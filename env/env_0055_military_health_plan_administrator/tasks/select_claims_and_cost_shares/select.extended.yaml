    claims_d: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a drafted installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
    chg_begun_d: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts.'
    paid_d: 'Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received.'
    total_d: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a drafted installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
    annual_d: Where the enrollment's fee arrangement (fee_coverage_type) is individual, so that exactly one family member is enrolled in Select and the family's catastrophic total is that member's own, and that total for the plan year has reached catastrophic_cap_family, enrollment fees are no longer collected for the rest of the plan year and the annual fee a drafted installment is figured from is zero; that total is the beneficiary liability posted on the enrollment's Select claim lines less the liability their reversals withdrew, plus, where the tier's fees_count_toward_catastrophic_cap is true, the enrollment fees paid toward installments whose coverage period has begun (the payments posted, never more than those installments). Where the fee arrangement is individual and that total falls short of the cap, the annual fee is annual_fee_individual; otherwise, with two or more members enrolled under a family arrangement, it is annual_fee_family.
    first_months_d: Where only one installment's coverage period has begun on the enrollment, so that it is the enrollment's first, and the enrollment took effect after the first month of that installment's calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is one twelfth of the annual fee for each month the installment covers; each figure is rounded to the cent.
    end_months_d: Where only one installment's coverage period has begun on the enrollment, so that it is the enrollment's first, and the enrollment took effect after the first month of that installment's calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is one twelfth of the annual fee for each month the installment covers; each figure is rounded to the cent.
    inst_owed_d: Where only one installment's coverage period has begun on the enrollment, so that it is the enrollment's first, and the enrollment took effect after the first month of that installment's calendar period, the installment owed is one twelfth of the annual fee for each month from the month containing the effective date through the end of the period; where the enrollment ended before the last month of the installment period that contains its last day of coverage, it is one twelfth of the annual fee for each month from the start of that period through the month containing the last day of coverage, that month counted whole; otherwise it is one twelfth of the annual fee for each month the installment covers; each figure is rounded to the cent.
    after_end_d: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts.'
    first_amt_d: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts.'
    charged_due_d: 'The charges that count toward the past-due balance depend on the enrollment''s standing: where the enrollment has ended, the charges whose coverage period began in or before the month containing its last day of coverage count, and a charge for a later period is void; where the enrollment is active, the charges whose coverage period has begun count and a charge billed ahead is left for its due date; otherwise, while the enrollment is awaiting activation, only its first installment, due with the application, counts.'
    left_d: 'Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received.'
    received_d: 'Payments on a fee account are applied to installments oldest first: where the payments left once the earlier counted charges are settled reach the installment owed, the whole installment owed counts as already received; where some but less is left, what is left counts as already received; otherwise nothing counts as already received.'
    unsettled_d: The bank draft is the installment owed less what counts as already received, plus any part of the earlier counted charges the payments did not settle, rounded to the cent and never below zero.
    result: The bank draft is the installment owed less what counts as already received, plus any part of the earlier counted charges the payments did not settle, rounded to the cent and never below zero.
  factors:
  - id: draft_fee_level
    effect: parameter
    decides: annual_d
    bindings:
    - claims_d
    - total_d
    - annual_d
    ladder: *id006
    baseline:
      annual_d: P('annual_fee_family')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: draft_installment_period
    effect: parameter
    decides: per_d
    bindings:
    - charged_freq_d
    - freq_d
    - per_d
    ladder:
    - when: the frequency in force (the one installments are being charged at, a change of the elected frequency waiting for the next period) is annual
      value: 12 months
    - when: the frequency in force is quarterly
      value: 3 months
    - when: otherwise (monthly)
      value: 1 month
    baseline:
      per_d: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: draft_latest_installment
    effect: method
    decides: earlier_d
    bindings:
    - cur_n_d
    - cur_amt_d
    - end_amt_d
    - first_cur_d
    - first_counted_d
    - earlier_d
    ladder:
    - when: the enrollment has ended
      method: the latest installment is the charges for the installment period that contains the last day of coverage, up to that day's month; the earlier counted charges are the counted charges other than those
    - when: a charge has been made for the installment period that contains the payment date
      method: the latest installment is that period's charges, a charge billed ahead for a later period left aside; the earlier counted charges are the counted charges other than those
    - when: otherwise
      method: the latest installment is the enrollment's first installment; the earlier counted charges are the counted charges other than it
    baseline:
      earlier_d: RND(charged_due_d - (first_amt_d if first_counted_d else 0), 2)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: draft_counted_charges
    effect: method
    decides: charged_due_d
    bindings:
    - ended_d
    - after_end_d
    - first_amt_d
    - charged_due_d
    ladder:
    - when: the enrollment has ended
      method: count the charges whose period began in or before the month of the last day of coverage
    - when: the enrollment is active
      method: count the charges whose period has begun
    - when: otherwise (awaiting activation)
      method: count only the first installment
    baseline:
      charged_due_d: first_amt_d
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: draft_already_received
    effect: parameter
    decides: received_d
    bindings:
    - paid_d
    - left_d
    - received_d
    ladder:
    - when: the payments left once the earlier counted charges are settled reach the installment owed
      value: inst_owed_d
    - when: some but less is left
      value: left_d
    - when: otherwise
      value: '0'
    baseline:
      received_d: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: With no other rule applied, the latest installment is the enrollment's first installment, it is owed at the annual family fee, annual_fee_family, for one month of it, nothing counts as already received on it, only the enrollment's first installment counts as a charge on the account, and the bank draft is the installment owed plus the amount by which the charges counted other than the latest installment exceed the payments posted, rounded to the cent.
    params:
    - annual_fee_family
  inputs:
    history:
    - table: select_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: select_fee_charge
    - table: select_fee_ledger
      aggregate: latest
      field: installment_frequency
      filters:
        event_type: select_fee_charge
    - table: select_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: select_fee_payment
    - table: select_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: select_claim_line_post
    cross_category: []
- id: select_ext_ohi_stay_reprocessing
  base_policy_refs: *id001
  overwrite:
  - base_policy: select_agg_family_accumulators
    superseded_clause: Prime cost shares, point-of-service charges and premium-based plan costs are separate accumulators and never count toward the Select family totals.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_catastrophic_cap
    superseded_clause: Point-of-service charges, Prime cost shares, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_ohi_coordination
    superseded_clause: With other health insurance on file, the line's deductible and cost share are figured on the allowed amount net of the other insurer's payment, and TRICARE pays no more than the allowed amount less the other insurer's payment and the beneficiary liability.
    replaced_by: 'With other health insurance on file, the deductible and cost share of a reprocessed stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  trigger: state_due
  subject:
  - select_claim_line_post
  computes: tricare_paid_amount
  target_tool: post_select_ohi_reprocessed_stay_ac99ca71
  params:
    plan_year_anchor: '2000-01-01'
    months_per_year: 12
    ledger_months: 600
  rule: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line. It covers the reprocessed stay of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee''s own Select enrollment carrying the family''s fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family''s deductible and catastrophic totals are the enrollee''s own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family''s Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design. The TRICARE payment on a stay reprocessed for other health insurance is fixed only after every outpatient line of the plan year that stands reversed for other health insurance carries its reprocessed adjudication. The TRICARE payment on a stay reprocessed for other health insurance is not fixed until the fee account shows no past-due balance on the plan year''s installments whose coverage period has begun. Every billed inpatient day of a reprocessed stay is covered. The beneficiary liability on a reprocessed stay is inpatient_network_admission_copay, charged once for the stay. TRICARE pays as primary payer on a reprocessed stay: the payable allowed amount less the beneficiary liability, rounded to the cent and never below zero. A reprocessed stay with no covered day carries no beneficiary liability. Where an Inpatient Mental Health Authorization for the patient at the stay''s facility starting on the admission date was approved (whether its days are still open or have all been used) for fewer days than the stay billed, the covered days of a reprocessed stay are the days it authorized; where the stay''s service class is in prior_authorization_required_service_classes and no such approved authorization is on file, a reprocessed stay has no covered day; otherwise every billed inpatient day of a reprocessed stay is covered. An inpatient mental health stay is priced by the day, so its payable allowed amount is the reversed line''s allowed amount times the covered days divided by the billed days, rounded to the cent; any other reprocessed stay is payable at the reversed line''s full allowed amount when it has a covered day and not at all otherwise. With other health insurance on file, the amount a reprocessed stay is cost-shared on is its payable allowed amount less the other insurer''s payment, never below zero; otherwise it is the payable allowed amount. Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a reprocessed stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent. Where the tier''s fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a reprocessed stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added. Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total. Where the family catastrophic total of a reprocessed stay (the Select liability posted less the liability withdrawn, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has already reached catastrophic_cap_family, the stay carries no beneficiary liability; where the room left under catastrophic_cap_family once that total is taken away is less than the liability figured under the inpatient basis, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured under the inpatient basis. What TRICARE would pay as primary payer on a reprocessed stay is its payable allowed amount less the beneficiary liability, never below zero. With other health insurance on file, the deductible and cost share of a reprocessed stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  prerequisite:
  - problem: select_ext_ohi_line_reprocessing
    kind: value_input
    gate: claims_s
    form: state
    policy_source: The TRICARE payment on a stay reprocessed for other health insurance is fixed only after every outpatient line of the plan year that stands reversed for other health insurance carries its reprocessed adjudication.
    condition: Every select_claim_line_reverse entry with reversal_reason ohi_retroactive and no inpatient days in the plan year is followed by a select_claim_line_post entry on the same claim_number carrying its reprocessed adjudication.
    resolved_by: post_select_ohi_reprocessed_line_2895a639
    effect: Once the outpatient line is reprocessed, its new liability joins the Select liability posted, so claims_s rises by that liability and the room left under the catastrophic cap shrinks by it.
  - problem: select_ext_bank_draft_payment
    kind: value_input
    gate: fees_s
    form: state
    policy_source: The TRICARE payment on a stay reprocessed for other health insurance is not fixed until the fee account shows no past-due balance on the plan year's installments whose coverage period has begun.
    condition: The select_fee_charge entries of the plan year whose coverage_period_start is on or before the adjudication date are covered by the select_fee_payment entries on the account applied oldest first, leaving no past-due balance on the fee account.
    resolved_by: authorize_select_bank_draft_0bb89bb0
    effect: Once the beneficiary's bank draft is posted, the payments on the fee account grow by the amount drafted, so fees_s rises by it and the room left under the catastrophic cap shrinks by the same amount.
  cross_category:
  - *id002
  - category: referral
    as: branch
    reads:
    - status
    - units_authorized
    - variant_name
    - servicing_provider_id
    - valid_from
    note: 'The covered days of the stay are decided from the patient''s Inpatient Mental Health Authorization at the facility in the referrals and authorizations product: its status and the days it authorized.'
  compute:
  - scope_s: (F('fee_bearing') == True and F('fee_coverage_type') == 'individual') and (MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12) and (XCOUNT('prime','prime_enrollments') == 0 or (XCOUNT('prime','prime_enrollments') == 1 and MONTHS(K('plan_year_anchor'), CFIELD('prime','enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12))
  - rev_im: LATEST('select_claim_lines','reversed_claim_line_id', date_field='posted_date', event_type='select_claim_line_reverse', service_class='inpatient_mental_health_admission', reversal_reason='ohi_retroactive')
  - rev_ia: LATEST('select_claim_lines','reversed_claim_line_id', date_field='posted_date', event_type='select_claim_line_reverse', service_class='inpatient_admission', reversal_reason='ohi_retroactive')
  - rev_s: rev_im if rev_im else rev_ia
  - class_s: LATEST('select_claim_lines','service_class', date_field='posted_date', select_claim_line_id=rev_s)
  - adm_s: LATEST('select_claim_lines','service_date', date_field='posted_date', select_claim_line_id=rev_s)
  - fac_s: LATEST('select_claim_lines','provider_id', date_field='posted_date', select_claim_line_id=rev_s)
  - net_s: LATEST('select_claim_lines','provider_network_status', date_field='posted_date', select_claim_line_id=rev_s)
  - days_s: LATEST('select_claim_lines','inpatient_days', date_field='posted_date', select_claim_line_id=rev_s)
  - billed_s: LATEST('select_claim_lines','billed_amount', date_field='posted_date', select_claim_line_id=rev_s)
  - allowed_s: LATEST('select_claim_lines','allowed_amount', date_field='posted_date', select_claim_line_id=rev_s)
  - ohi_paid_s: LATEST('select_claim_lines','ohi_paid_amount', date_field='posted_date', select_claim_line_id=rev_s)
  - auth_ok_s: CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', servicing_provider_id=fac_s, valid_from=adm_s) == 'approved' or CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', servicing_provider_id=fac_s, valid_from=adm_s) == 'exhausted'
  - auth_days_s: CFIELD('referral','units_authorized', variant_name='Inpatient Mental Health Authorization', servicing_provider_id=fac_s, valid_from=adm_s)
  - needs_auth_s: class_s in P('prior_authorization_required_service_classes')
  - cov_s: auth_days_s if (auth_ok_s and auth_days_s < days_s) else (0 if (needs_auth_s and not auth_ok_s) else days_s)
  - share_s: cov_s / days_s if class_s == 'inpatient_mental_health_admission' else (1 if cov_s > 0 else 0)
  - pay_s: RND(allowed_s * share_s, 2)
  - base_s: MX(0, RND(pay_s - ohi_paid_s, 2)) if F('ohi_on_file') else pay_s
  - claims_s: SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_post') - SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_reverse')
  - chg_begun_s: SUM('select_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - paid_s: SUM('select_fee_ledger','amount', event_type='select_fee_payment')
  - fees_s: chg_begun_s if (P('fees_count_toward_catastrophic_cap') and paid_s >= chg_begun_s) else (paid_s if (P('fees_count_toward_catastrophic_cap') and paid_s > 0) else 0)
  - plan_change_s: CFIELD('prime','status') == 'disenrolled_voluntary' and DAYS(CFIELD('prime','disenrollment_date'), F('enrollment_effective_date')) == 1
  - pr_cs_s: XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_reverse') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post', pos_applied=True)
  - pr_chg_begun_s: XSUM('prime','prime_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='prime_fee_charge')
  - pr_paid_s: XSUM('prime','prime_fee_ledger','amount', event_type='prime_fee_payment')
  - pr_amt_s: RND(pr_cs_s + MN(pr_chg_begun_s, pr_paid_s), 2)
  - carry_s: P('catastrophic_cap_family') if (plan_change_s and pr_amt_s >= P('catastrophic_cap_family')) else (pr_amt_s if plan_change_s else 0)
  - basis_s: P('inpatient_non_network_basis') if net_s != 'network' else P('inpatient_network_basis')
  - daily_s: P('inpatient_non_network_daily_charge') if net_s != 'network' else P('inpatient_network_daily_charge')
  - pct_s: P('inpatient_non_network_pct') if net_s != 'network' else P('inpatient_network_pct_of_allowed')
  - uncapped_s: 0 if cov_s == 0 else (RND(MN(daily_s * cov_s, RND(base_s * pct_s / 100, 2)), 2) if basis_s == 'lesser_of_per_diem_or_pct' else (RND(MX(daily_s * cov_s, P('inpatient_network_minimum_charge')), 2) if basis_s == 'per_diem_with_minimum' else (RND(base_s * pct_s / 100, 2) if basis_s == 'percent_of_allowed' else P('inpatient_network_admission_copay'))))
  - room_s: RND(P('catastrophic_cap_family') - claims_s - fees_s - carry_s, 2)
  - liability_s: 0 if room_s <= 0 else (room_s if room_s < uncapped_s else uncapped_s)
  - primary_s: RND(MX(0, pay_s - liability_s), 2)
  - billed_cov_s: RND(billed_s * share_s, 2)
  - tricare_s: RND(MN(primary_s, MX(0, (MN(billed_cov_s, pay_s * (1 + P('nonparticipating_balance_billing_limit_pct') / 100)) - ohi_paid_s) * 1 - liability_s)), 2) if (F('ohi_on_file') and ohi_paid_s > 0 and net_s == 'non_network_nonparticipating') else (RND(MX(0, (pay_s - ohi_paid_s) * 1 - liability_s), 2) if (F('ohi_on_file') and ohi_paid_s > 0) else primary_s)
  - result: tricare_s if scope_s else None
  compute_basis:
    scope_s: It covers the reprocessed stay of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee's own Select enrollment carrying the family's fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family's deductible and catastrophic totals are the enrollee's own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family's Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design.
    rev_im: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    rev_ia: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    rev_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    class_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    adm_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    fac_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    net_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    days_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    billed_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    allowed_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    ohi_paid_s: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select inpatient facility stay that was reversed because the beneficiary''s other health insurance was found retroactively: the stay reprocessed is the stay line named by the enrollment''s most recent reversal for other health insurance found retroactively of an inpatient mental health admission or, where there is none, of an inpatient admission, and its admission date, facility, network relationship, service class, billed inpatient days, billed and allowed amounts and the other insurer''s payment are read from that reversed line.'
    auth_ok_s: Where an Inpatient Mental Health Authorization for the patient at the stay's facility starting on the admission date was approved (whether its days are still open or have all been used) for fewer days than the stay billed, the covered days of a reprocessed stay are the days it authorized; where the stay's service class is in prior_authorization_required_service_classes and no such approved authorization is on file, a reprocessed stay has no covered day; otherwise every billed inpatient day of a reprocessed stay is covered.
    auth_days_s: Where an Inpatient Mental Health Authorization for the patient at the stay's facility starting on the admission date was approved (whether its days are still open or have all been used) for fewer days than the stay billed, the covered days of a reprocessed stay are the days it authorized; where the stay's service class is in prior_authorization_required_service_classes and no such approved authorization is on file, a reprocessed stay has no covered day; otherwise every billed inpatient day of a reprocessed stay is covered.
    needs_auth_s: Where an Inpatient Mental Health Authorization for the patient at the stay's facility starting on the admission date was approved (whether its days are still open or have all been used) for fewer days than the stay billed, the covered days of a reprocessed stay are the days it authorized; where the stay's service class is in prior_authorization_required_service_classes and no such approved authorization is on file, a reprocessed stay has no covered day; otherwise every billed inpatient day of a reprocessed stay is covered.
    cov_s: Where an Inpatient Mental Health Authorization for the patient at the stay's facility starting on the admission date was approved (whether its days are still open or have all been used) for fewer days than the stay billed, the covered days of a reprocessed stay are the days it authorized; where the stay's service class is in prior_authorization_required_service_classes and no such approved authorization is on file, a reprocessed stay has no covered day; otherwise every billed inpatient day of a reprocessed stay is covered.
    share_s: An inpatient mental health stay is priced by the day, so its payable allowed amount is the reversed line's allowed amount times the covered days divided by the billed days, rounded to the cent; any other reprocessed stay is payable at the reversed line's full allowed amount when it has a covered day and not at all otherwise.
    pay_s: An inpatient mental health stay is priced by the day, so its payable allowed amount is the reversed line's allowed amount times the covered days divided by the billed days, rounded to the cent; any other reprocessed stay is payable at the reversed line's full allowed amount when it has a covered day and not at all otherwise.
    base_s: With other health insurance on file, the amount a reprocessed stay is cost-shared on is its payable allowed amount less the other insurer's payment, never below zero; otherwise it is the payable allowed amount.
    claims_s: Where the family catastrophic total of a reprocessed stay (the Select liability posted less the liability withdrawn, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has already reached catastrophic_cap_family, the stay carries no beneficiary liability; where the room left under catastrophic_cap_family once that total is taken away is less than the liability figured under the inpatient basis, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured under the inpatient basis.
    chg_begun_s: Where the tier's fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a reprocessed stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added.
    paid_s: Where the tier's fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a reprocessed stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added.
    fees_s: Where the tier's fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a reprocessed stay in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added.
    plan_change_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_cs_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_chg_begun_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_paid_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    pr_amt_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    carry_s: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a reprocessed stay. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
    basis_s: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a reprocessed stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    daily_s: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a reprocessed stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    pct_s: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a reprocessed stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    uncapped_s: 'Under the tier''s inpatient basis for the facility''s network relationship on the admission date, the beneficiary liability on a reprocessed stay with a covered day is figured as follows: where the basis is lesser_of_per_diem_or_pct, it is the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared; where it is per_diem_with_minimum, it is the daily charge times the covered days but never less than inpatient_network_minimum_charge; where it is percent_of_allowed, it is the stated percent of the amount cost-shared; otherwise, under per_admission_copay, it is inpatient_network_admission_copay once; each figure is rounded to the cent.'
    room_s: Where the family catastrophic total of a reprocessed stay (the Select liability posted less the liability withdrawn, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has already reached catastrophic_cap_family, the stay carries no beneficiary liability; where the room left under catastrophic_cap_family once that total is taken away is less than the liability figured under the inpatient basis, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured under the inpatient basis.
    liability_s: Where the family catastrophic total of a reprocessed stay (the Select liability posted less the liability withdrawn, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has already reached catastrophic_cap_family, the stay carries no beneficiary liability; where the room left under catastrophic_cap_family once that total is taken away is less than the liability figured under the inpatient basis, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured under the inpatient basis.
    primary_s: What TRICARE would pay as primary payer on a reprocessed stay is its payable allowed amount less the beneficiary liability, never below zero.
    billed_cov_s: 'With other health insurance on file, the deductible and cost share of a reprocessed stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
    tricare_s: 'With other health insurance on file, the deductible and cost share of a reprocessed stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
    result: 'With other health insurance on file, the deductible and cost share of a reprocessed stay (its billed amount and allowed amount counted in proportion to the covered days, as its payable allowed amount is) are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  factors:
  - id: ohi_stay_covered_days
    effect: parameter
    decides: cov_s
    bindings:
    - auth_ok_s
    - auth_days_s
    - needs_auth_s
    - cov_s
    ladder:
    - when: an Inpatient Mental Health Authorization at the stay's facility starting on the admission date was approved for fewer days than the stay billed
      value: the days it authorized
    - when: the stay's service class needs prior authorization and no such approved authorization is on file
      value: '0'
    - when: otherwise
      value: every billed inpatient day
    baseline:
      cov_s: days_s
    evidence:
    - cross_category
    - history
    cross_difficulty: referral
  - id: ohi_stay_inpatient_basis
    effect: method
    decides: uncapped_s
    bindings:
    - net_s
    - basis_s
    - daily_s
    - pct_s
    - uncapped_s
    ladder:
    - when: the basis for the facility's network relationship is lesser_of_per_diem_or_pct
      method: the lesser of the daily charge times the covered days and the stated percent of the amount cost-shared
    - when: the basis is per_diem_with_minimum
      method: the daily charge times the covered days, never less than the minimum charge
    - when: the basis is percent_of_allowed
      method: the stated percent of the amount cost-shared
    - when: otherwise (per_admission_copay)
      method: the admission copayment once for the stay
    baseline:
      uncapped_s: 0 if cov_s == 0 else P('inpatient_network_admission_copay')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: ohi_stay_select_fees
    effect: parameter
    decides: fees_s
    bindings:
    - chg_begun_s
    - paid_s
    - fees_s
    ladder: *id007
    baseline:
      fees_s: '0'
    evidence:
    - history
    - tier_param
    - date
    cross_difficulty: null
  - id: ohi_stay_prime_carryover
    effect: parameter
    decides: carry_s
    bindings:
    - plan_change_s
    - pr_cs_s
    - pr_chg_begun_s
    - pr_paid_s
    - pr_amt_s
    - carry_s
    ladder:
    - when: the beneficiary changed from TRICARE Prime during the plan year and the Prime amounts reach catastrophic_cap_family
      value: P('catastrophic_cap_family')
    - when: the beneficiary changed from TRICARE Prime during the plan year
      value: pr_amt_s
    - when: otherwise
      value: '0'
    baseline:
      carry_s: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: prime
  - id: ohi_stay_cap_stage
    effect: parameter
    decides: liability_s
    bindings:
    - claims_s
    - room_s
    - liability_s
    ladder:
    - when: the family catastrophic total has already reached catastrophic_cap_family
      value: '0'
    - when: the room left under the cap is less than the liability figured under the inpatient basis
      value: room_s
    - when: otherwise
      value: uncapped_s
    baseline:
      liability_s: uncapped_s
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: ohi_stay_payer_coordination
    effect: method
    decides: tricare_s
    bindings:
    - billed_s
    - primary_s
    - tricare_s
    ladder: *id003
    baseline:
      tricare_s: primary_s
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'Every billed inpatient day of a reprocessed stay is covered. The beneficiary liability on a reprocessed stay is inpatient_network_admission_copay, charged once for the stay. TRICARE pays as primary payer on a reprocessed stay: the payable allowed amount less the beneficiary liability, rounded to the cent and never below zero. A reprocessed stay with no covered day carries no beneficiary liability. An inpatient mental health stay is priced by the day, so its payable allowed amount is the reversed line''s allowed amount times the covered days divided by the billed days, rounded to the cent; any other reprocessed stay is payable at the reversed line''s full allowed amount when it has a covered day and not at all otherwise. With other health insurance on file, the amount a reprocessed stay is cost-shared on is its payable allowed amount less the other insurer''s payment, never below zero; otherwise it is the payable allowed amount.'
    params:
    - inpatient_network_admission_copay
  inputs:
    history:
    - table: select_claim_lines
      aggregate: latest
      field: reversed_claim_line_id
      filters:
        event_type: select_claim_line_reverse
    - table: select_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: select_claim_line_post
    - table: select_claim_lines
      aggregate: sum
      field: cost_share_amount
      filters:
        event_type: select_claim_line_reverse
    - table: select_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: select_fee_payment
    - *id008
    - &id011
      category: prime
      table: prime_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: prime_fee_payment
    - *id009
    cross_category:
    - prime
    - referral
- id: select_ext_cap_line_reprocessing
  base_policy_refs: *id001
  overwrite:
  - base_policy: select_prior_authorization_and_filing
    superseded_clause: A line whose service_class is in prior_authorization_required_service_classes is payable only when an approved authorization for the patient covers the provider and the service date.
    replaced_by: 'For a line this policy reprocesses for the catastrophic cap, and only for such a line, the authorization finding of the line it replaces stands in place of a fresh authorization test: the reprocessed line is payable on that finding and carries that line''s authorization reference, because only the family''s catastrophic standing is revisited; every other Select line remains under the base authorization rule.'
  - base_policy: select_agg_family_accumulators
    superseded_clause: Prime cost shares, point-of-service charges and premium-based plan costs are separate accumulators and never count toward the Select family totals.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a cap-reprocessed line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_catastrophic_cap
    superseded_clause: Point-of-service charges, Prime cost shares, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count.
    replaced_by: 'Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a cap-reprocessed line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total.'
  - base_policy: select_ohi_coordination
    superseded_clause: With other health insurance on file, the line's deductible and cost share are figured on the allowed amount net of the other insurer's payment, and TRICARE pays no more than the allowed amount less the other insurer's payment and the beneficiary liability.
    replaced_by: 'With other health insurance on file, the deductible and cost share of a line reprocessed for the catastrophic cap are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  trigger: on_request
  subject:
  - select_claim_line_post
  computes: tricare_paid_amount
  target_tool: post_select_cap_reprocessed_line_5ecdf694
  params:
    plan_year_anchor: '2000-01-01'
    months_per_year: 12
    ledger_months: 600
  rule: 'This policy settles the TRICARE payment on the reprocessed adjudication of a TRICARE Select outpatient line that was reversed for catastrophic-cap reprocessing: the line reprocessed is the line with no inpatient days named by the enrollment''s most recent catastrophic-cap reversal, and its service date, network relationship, service class, billed and allowed amounts and the other insurer''s payment are read from that reversed line. It covers the reprocessed line of an enrollee who is the only member of the sponsor family enrolled in Select, read from the enrollee''s own Select enrollment carrying the family''s fee billing (fee_bearing true) under an individual fee arrangement (fee_coverage_type individual), whose Select enrollment took effect in the plan year that contains the adjudication date, and who holds no TRICARE Prime enrollment or exactly one that took effect in that same plan year, so that the family''s deductible and catastrophic totals are the enrollee''s own and every claim line and every installment whose coverage period has begun on that enrollment, and every Prime claim line and Prime installment of the enrollee, belongs to that calendar plan year; for any other enrollee this policy settles nothing. A fee-exempt enrollment carries no fee arrangement from which the family''s Select membership can be read, so the fee-exempt tiers (the Active Duty Family Member tiers) are outside this policy by design. The TRICARE payment on a line reprocessed for the catastrophic cap is fixed only after every inpatient stay of the plan year that stands reversed for other health insurance carries its reprocessed adjudication. For a line this policy reprocesses for the catastrophic cap, and only for such a line, the authorization finding of the line it replaces stands in place of a fresh authorization test: the reprocessed line is payable on that finding and carries that line''s authorization reference, because only the family''s catastrophic standing is revisited; every other Select line remains under the base authorization rule. The amount a line reprocessed for the catastrophic cap is cost-shared and paid on is the reversed line''s allowed amount. Its liability figured before the cap is the deductible it takes, the smaller of the amount cost-shared and the tier''s deductible_individual less the deductible already applied on the enrollment''s claim lines net of reversals and nothing for a service class in deductible_exempt_service_classes or network preventive care, plus the cost share the tier''s outpatient basis gives for its network relationship and service class on what is left (non_network_outpatient_cost_share_pct outside the network, network_dme_cost_share_pct for network durable medical equipment, the network copayment for network preventive care or on a fixed_copayment tier, never more than what is left, and network_outpatient_cost_share_pct otherwise), rounded to the cent. The beneficiary liability on a line reprocessed for the catastrophic cap is that liability figured before the cap, and TRICARE pays as primary payer: the allowed amount less that liability, rounded to the cent and never below zero. With other health insurance on file, the amount a line reprocessed for the catastrophic cap is cost-shared on is the allowed amount less the other insurer''s payment, never below zero; otherwise it is the allowed amount. Where the service date of the cap-reprocessed line is the admission date of an inpatient mental health stay on the enrollment and an Inpatient Mental Health Authorization starting that day was approved (whether its days are still open or have all been used) for fewer days than it was requested for, the attending share is the days authorized divided by the days requested; where an inpatient mental health stay was admitted that day and no such approved Inpatient Mental Health Authorization is on file, the attending share is zero; otherwise the attending share is one. The amount the cap-reprocessed line is cost-shared on is that amount times the attending share, rounded to the cent. Where the tier''s fees_count_toward_catastrophic_cap is true and the payments posted on the fee account cover the installments whose coverage period has begun, those installments are added to the family catastrophic total of a cap-reprocessed line in full; where fees count and some but less has been paid, the payments posted are added; otherwise no enrollment fee is added. Where the beneficiary changed from TRICARE Prime to this Select enrollment during the plan year (the Prime enrollment ended by the beneficiary''s own choice on the day before Select took effect), the amounts already credited toward the Prime catastrophic cap are credited to the family catastrophic total of a cap-reprocessed line. Within this policy''s scope the beneficiary''s only Prime enrollment took effect in the plan year, so every Prime record belongs to that calendar plan year, and the Prime amounts are: the cost shares on the beneficiary''s Prime claim lines other than point-of-service charges, less the cost shares withdrawn by Prime reversals, plus the Prime enrollment fees paid toward the Prime installments whose coverage period has begun (the Prime payments posted, never more than those installments, payments being applied oldest first). Where those Prime amounts reach catastrophic_cap_family, catastrophic_cap_family is credited; where the beneficiary changed from Prime in that way and they fall short of it, those Prime amounts are credited; otherwise nothing is credited from Prime. Point-of-service charges, premium-based plan costs and amounts a nonparticipating provider bills above the allowed amount never count toward the total. Where the family catastrophic total of a cap-reprocessed line (the Select liability posted less the liability withdrawn, plus the enrollment fees added, plus any amount credited from TRICARE Prime) has reached catastrophic_cap_family, the line carries no liability; where the room left under the cap is less than the liability figured before the cap, the liability is cut to that room, rounded to the cent; otherwise the liability is the one figured before the cap. What TRICARE would pay as primary payer on a cap-reprocessed line is the allowed amount times the attending share, less the beneficiary liability, never below zero. With other health insurance on file, the deductible and cost share of a line reprocessed for the catastrophic cap are figured on the allowed amount net of the other insurer''s payment, and where the other insurer paid on it TRICARE pays second: where the provider is non-network nonparticipating, TRICARE pays the lesser of what it would pay as primary payer and the charge the provider may bill the beneficiary (the billed amount, never more than the allowed amount plus nonparticipating_balance_billing_limit_pct percent) less the other insurer''s payment, times the attending share, less the beneficiary liability; where the provider is participating, TRICARE pays the allowed amount less the other insurer''s payment, times the attending share, less the beneficiary liability; otherwise TRICARE pays what it would pay as primary payer. Each figure is rounded to the cent and never below zero.'
  prerequisite:
  - problem: select_ext_ohi_stay_reprocessing
    kind: value_input
    gate: claims_r
    form: state
    policy_source: The TRICARE payment on a line reprocessed for the catastrophic cap is fixed only after every inpatient stay of the plan year that stands reversed for other health insurance carries its reprocessed adjudication.
    condition: Every select_claim_line_reverse entry with reversal_reason ohi_retroactive for an inpatient stay in the plan year is followed by a select_claim_line_post entry on the same claim_number carrying its reprocessed adjudication.
    resolved_by: post_select_ohi_reprocessed_stay_ac99ca71
    effect: Once the stay is reprocessed, its liability joins the Select liability posted, so claims_r rises by it and the room left under the catastrophic cap shrinks by it.
  cross_category:
  - *id002
  - *id010
  compute:
  - scope_r: (F('fee_bearing') == True and F('fee_coverage_type') == 'individual') and (MONTHS(K('plan_year_anchor'), F('enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12) and (XCOUNT('prime','prime_enrollments') == 0 or (XCOUNT('prime','prime_enrollments') == 1 and MONTHS(K('plan_year_anchor'), CFIELD('prime','enrollment_effective_date')) // 12 == MONTHS(K('plan_year_anchor'), NOW) // 12))
  - rev_r: LATEST('select_claim_lines','reversed_claim_line_id', date_field='posted_date', event_type='select_claim_line_reverse', inpatient_days=0, reversal_reason='catastrophic_cap_reprocessing')
  - sd_r: LATEST('select_claim_lines','service_date', date_field='posted_date', select_claim_line_id=rev_r)
  - class_r: LATEST('select_claim_lines','service_class', date_field='posted_date', select_claim_line_id=rev_r)
  - net_r: LATEST('select_claim_lines','provider_network_status', date_field='posted_date', select_claim_line_id=rev_r)
  - allowed_r: LATEST('select_claim_lines','allowed_amount', date_field='posted_date', select_claim_line_id=rev_r)
  - billed_r: LATEST('select_claim_lines','billed_amount', date_field='posted_date', select_claim_line_id=rev_r)
  - ohi_paid_r: LATEST('select_claim_lines','ohi_paid_amount', date_field='posted_date', select_claim_line_id=rev_r)
  - base_r: MX(0, RND(allowed_r - ohi_paid_r, 2)) if F('ohi_on_file') else allowed_r
  - mh_stay_r: COUNT('select_claim_lines', event_type='select_claim_line_post', service_class='inpatient_mental_health_admission', service_date=sd_r)
  - auth_ok_r: CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', valid_from=sd_r) == 'approved' or CFIELD('referral','status', variant_name='Inpatient Mental Health Authorization', valid_from=sd_r) == 'exhausted'
  - auth_days_r: CFIELD('referral','units_authorized', variant_name='Inpatient Mental Health Authorization', valid_from=sd_r)
  - req_days_r: CFIELD('referral','units_requested', variant_name='Inpatient Mental Health Authorization', valid_from=sd_r)
  - att_r: auth_days_r / req_days_r if (mh_stay_r > 0 and auth_ok_r and req_days_r > auth_days_r) else (0 if (mh_stay_r > 0 and not auth_ok_r) else 1)
  - amt_r: RND(base_r * att_r, 2)
  - ded_net_r: SUM('select_claim_lines','deductible_applied', event_type='select_claim_line_post') - SUM('select_claim_lines','deductible_applied', event_type='select_claim_line_reverse')
  - ded_r: 0 if (class_r in P('deductible_exempt_service_classes') or (class_r == 'preventive_care' and net_r == 'network')) else RND(MN(amt_r, MX(0, P('deductible_individual') - ded_net_r)), 2)
  - left_r: RND(amt_r - ded_r, 2)
  - cs_r: RND(left_r * P('non_network_outpatient_cost_share_pct') / 100, 2) if net_r != 'network' else (RND(left_r * P('network_dme_cost_share_pct') / 100, 2) if class_r == 'durable_medical_equipment' else (MN(P('network_copay_' + class_r), left_r) if (class_r == 'preventive_care' or P('network_cost_share_basis') == 'fixed_copayment') else RND(left_r * P('network_outpatient_cost_share_pct') / 100, 2)))
  - uncapped_r: RND(ded_r + cs_r, 2)
  - claims_r: SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_post') - SUM('select_claim_lines','cost_share_amount', event_type='select_claim_line_reverse')
  - chg_begun_r: SUM('select_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='select_fee_charge')
  - paid_r: SUM('select_fee_ledger','amount', event_type='select_fee_payment')
  - fees_r: chg_begun_r if (P('fees_count_toward_catastrophic_cap') and paid_r >= chg_begun_r) else (paid_r if (P('fees_count_toward_catastrophic_cap') and paid_r > 0) else 0)
  - plan_change_r: CFIELD('prime','status') == 'disenrolled_voluntary' and DAYS(CFIELD('prime','disenrollment_date'), F('enrollment_effective_date')) == 1
  - pr_cs_r: XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_reverse') - XSUM('prime','prime_claim_lines','cost_share_amount', event_type='prime_claim_line_post', pos_applied=True)
  - pr_chg_begun_r: XSUM('prime','prime_fee_ledger','amount', within_months=K('ledger_months'), date_field='coverage_period_start', event_type='prime_fee_charge')
  - pr_paid_r: XSUM('prime','prime_fee_ledger','amount', event_type='prime_fee_payment')
  - pr_amt_r: RND(pr_cs_r + MN(pr_chg_begun_r, pr_paid_r), 2)
  - carry_r: P('catastrophic_cap_family') if (plan_change_r and pr_amt_r >= P('catastrophic_cap_family')) else (pr_amt_r if plan_change_r else 0)
  - room_r: RND(P('catastrophic_cap_family') - claims_r - fees_r - carry_r, 2)
  - liability_r: 0 if room_r <= 0 else (room_r if room_r < uncapped_r else uncapped_r)
  - primary_r: RND(MX(0, RND(allowed_r * att_r, 2) - liability_r), 2)
  - tricare_r: RND(MN(primary_r, MX(0, (MN(billed_r, allowed_r * (1 + P('nonparticipating_balance_billing_limit_pct') / 100)) - ohi_paid_r) * att_r - liability_r)), 2) if (F('ohi_on_file') and ohi_paid_r > 0 and net_r == 'non_network_nonparticipating') else (RND(MX(0, (allowed_r - ohi_paid_r) * att_r - liability_r), 2) if (F('ohi_on_file') and ohi_paid_r > 0) else primary_r)
  - result: tricare_r if scope_r else None
