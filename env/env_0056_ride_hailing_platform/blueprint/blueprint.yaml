name: env_0056_ride_hailing_platform
company: Wayfare Mobility

background: |
  Wayfare Mobility, Inc. is a Denver-based ride-hailing platform operating in seven Mountain West and Southwest metros: Denver, Colorado Springs, Salt Lake City, Phoenix, Tucson, Las Vegas and Albuquerque.
  It connects riders who book trips in the Wayfare app with drivers who work as independent contractors, and its support desk speaks plainly and calmly to both sides, often about money that has already moved.
  Riders book trips in one of seven ride options, Wayfare Shared, Wayfare Standard, Wayfare Green, Wayfare Comfort, Wayfare XL, Wayfare Black and Wayfare Black SUV, either on demand or ahead of time through Wayfare Reserve, and every trip keeps its own record of fare, fees, tips, waivers, adjustments and refunds.
  Frequent riders hold a Wayfare Pass membership on one of six plans, Wayfare Pass Student, Wayfare Pass Monthly, Wayfare Pass Annual, Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual and Wayfare Pass All Access Annual, billed monthly or annually and earning Pass ride credit on eligible trips.
  Riders in Denver, Salt Lake City and Phoenix can also hold a Wayfare Bikes plan, Wayfare Bikes Pay As You Ride, Day Pass, Monthly Pass, Access Annual, Annual or Annual Plus, with rides and fees booked against the plan.
  Drivers contract under a driver services agreement for one service level, the Wayfare Standard, Wayfare Green, Wayfare Comfort, Wayfare XL, Wayfare Black or Wayfare Black SUV Driver Agreement, whose standing record collects documents, rating reviews, warnings, safety reports and background rechecks.
  Each driver also has one earnings account, carrying a Wayfare Pro status of Wayfare Pro Blue, Silver, Gold, Platinum, Diamond or Diamond Elite for the quarter, into which trip pay, tips, fee shares, cleaning payouts and incentive bonuses post and out of which instant cashouts and weekly payouts flow.
  Drivers without a qualifying car can rent one weekly through Wayfare Rentals in the Economy Sedan, Hybrid Sedan, Electric Sedan, Midsize SUV, Minivan or Premium Sedan class, paid from earnings first.
  When a rider leaves a mess or damage behind, the driver's report becomes a cleaning or damage fee assessment against the rider at Cleaning Fee Level 1 (Minor) through Cleaning Fee Level 4 (Major), or Damage Fee (Interior Repair) or Damage Fee (Exterior Repair).
  Most people who call are riders with a recent trip, many of them Pass members, asking about a fare, a cancellation or no-show fee, a membership charge or a cleaning fee that appeared on their card.
  Drivers call about missing pay, unpaid bonuses, cashout fees, holds on their payouts, expiring documents, warnings and deactivations, and some of them also ride with Wayfare on the same profile.
  A typical caller brings weeks or months of history: dozens of trips, a membership that has renewed, paused or lapsed, earlier refunds or courtesy waivers, past warnings or an appeal.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: rider_trip_fares_cancellations_and_refunds
    claim:
      categories: [trip]
      event_types: [trip_fare_adjustment, trip_refund, trip_fee_waiver, trip_balance_settlement, trip_tip]
    summary: >
      Riders call about charges on their trips: a fare higher than the upfront price, a cancellation or no-show fee they think should not apply, wait time, tolls or an airport fee they did not expect, a reservation fee on a Wayfare Reserve trip, a tip they want to add, or a hold on new requests because an earlier charge failed to collect.
      The setting varies by ride option (rates, grace periods, fees and support limits differ across the seven options per trip_evt_fare, trip_evt_cancellation_fee, trip_evt_no_show and trip_evt_adjustments_and_refunds), by booking mode, by whether the rider held a Wayfare Pass membership in a benefit-bearing status at the request and how much of its monthly allowances is used (trip_msr_pass_free_cancellations_month), by the rider's courtesy refunds across all trips in the lookback (trip_agg_courtesy_refund), and by unpaid amounts across every trip of the rider (trip_agg_outstanding_balance_hold).
      The records are the trip with its timestamps, estimates and actuals, the per-charge ledger with original_charge_id links, waiver rows, fare review requests and the rider's Pass membership; the rules gate every adjustment or refund on the review window of the disputed charge and on the per-trip support limit, pin each refund reason to a specific charge, and decide cancellation fees by a fixed order of waiver bases, while the natural course of a trip runs request, acceptance, arrival, pickup and drop-off before any fare is charged.
      Identity verification, fare adjustments, refunds and settlements of outstanding charges are agent actions, while adding a tip or cancelling a trip is the rider's own act; a request above the support limit or about a wrong drop-off location is registered as a fare review rather than adjusted.
      Requests no rule decides, such as compensation for a driver's conduct, a refund of a correctly charged fare because the rider disliked the route or vehicle, or reimbursement of costs outside the trip, can only be handed off as POLICY_NOT_COVERED.

  - name: pass_membership_billing_and_benefits
    claim:
      categories: [pass]
      event_types: [pass_fee_refund, pass_cancel_now, pass_auto_renew_off, pass_auto_renew_on, pass_plan_change, pass_pause_schedule, pass_fee_charge, pass_credit_earn, pass_credit_forfeit]
    summary: >
      Wayfare Pass members call about their membership: an unexpected renewal or trial-conversion charge, wanting to cancel now or at period end, a refund of a fee, a missing or capped ride credit, a plan upgrade or downgrade, a pause, a past-due membership after a declined card, or a Student plan whose verification lapsed.
      The setting varies by plan (fee, billing period, trial length, credit rate and caps, pause and proration eligibility differ across the six plans per pass_evt_fee_billing, pass_evt_ride_credit, pass_pause_rules and pass_cancellation_and_refund), by membership status, by signup channel (card partner memberships are billed and refunded by the partner), and by benefit use since the latest charge, which reads the member's trips and trip charges as well as the membership ledger (pass_msr_benefit_uses_since_charge).
      The records are the membership with its period dates, auto-renew and pause fields, the fee and credit ledger with original_event_id links, and the trip charges that carry Pass waivers, discounts and credits; the rules decide full refunds by a calendar-day window from the fee charge, prorate annual refunds by unused whole months less credit earned, cap credit per trip and per calendar month, and admit one membership per customer (pass_agg_multi_holding), while a membership naturally runs enrollment, trial, paid periods and renewal before it ends.
      Refunds, credit corrections and benefit checks are agent actions after identity verification, while turning auto-renew off or on, ending the membership at once, changing plan and scheduling a pause are the member's own decisions made through the member.
      Requests outside the rules, such as refunding a monthly fee outside its window because the member forgot to cancel, extending a trial, transferring credit to another rider or refunding a partner-billed membership, can only be handed off as POLICY_NOT_COVERED.

  - name: cleaning_and_damage_fee_assessments
    claim:
      categories: [damage]
      event_types: [damage_report, damage_evidence_submit, damage_review_open, damage_deny, damage_reconsider, damage_approve_charge, damage_dispute, damage_uphold, damage_reverse, damage_reclassify, damage_fee_refund, damage_fee_partial_refund]
    summary: >
      Two kinds of caller meet over one assessment: drivers reporting a mess or damage after a trip or asking why a report was denied or paid less, and riders disputing a cleaning or damage fee on their card.
      The setting varies by fee level (flat fees, receipt caps and minimums, photo and receipt requirements, filing windows and courtesy eligibility differ across the six levels per damage_evt_fee_charge, damage_filing_and_evidence and damage_agg_courtesy_first_incident), by assessment status, by the incident category and ride option of the trip, by the rider's other assessments in the lookback and by the reporting driver's report volume across all riders (damage_agg_driver_report_volume).
      The records are the assessment with its evidence totals, the evidence and fee ledger with original_event_id links, the trip with its drop-off moment and the reporting driver's agreement; the rules gate a report on a completed trip within an elapsed-hour filing window, a review on minimum evidence, a dispute on a calendar-day window from the charge date, and allow levels to move only downward, while an assessment naturally runs report, evidence, review and charge before any dispute.
      Recording reports and evidence the driver supplies, reviewing, approving, denying, reclassifying and refunding are agent actions, while disputing a fee is the rider's own claim made through the rider, and the driver's payout follows the fee through the earnings ledger.
      Situations no rule decides, such as an injury mentioned in the report, a repair above the cap, a Shared trip, or a driver over the report-volume threshold, go to Trust and Safety or the insurance desk through a POLICY_NOT_COVERED handoff.

  - name: driver_earnings_bonuses_and_payouts
    claim:
      categories: [earnings]
      event_types: [earnings_adjustment_credit, earnings_adjustment_debit, earnings_bonus_credit, earnings_bonus_optin, earnings_instant_cashout, earnings_instant_cashout_fee, earnings_payout_release, earnings_payout_hold, earnings_payout_method_change, earnings_cancellation_credit]
    summary: >
      Drivers call about their pay: a trip that paid less than expected, a toll, wait time or cancellation share that never posted, a quest, consecutive-trip, referral or earnings guarantee bonus they believe they earned, an instant cashout fee, a payout that did not arrive, a payout hold, or a deduction they do not recognise.
      The setting varies by Wayfare Pro status (cashout fees and free cashouts differ per tier in earnings_evt_instant_cashout, and status is set quarterly per earnings_pro_tier_evaluation), by account status and hold reason, by the ride option and records of the trips involved (earnings_evt_trip_pay reads the trip's actuals, wait time and toll charges), by the terms of each personal offer and the trips that qualify for it (earnings_evt_bonus), and by deductions coming from rider refunds, cleaning fee reversals and Wayfare Rentals.
      The records are the earnings account, the earnings ledger with trip, assessment, offer and rental references, the incentive offers and opt-ins, the driver's trips and their rider charges; the rules gate missing-pay credits on a calendar-day window from the trip and a per-trip support limit, unpaid-bonus questions on a claim window from the offer's window end, and cashouts on account status and a waiting period from account opening, while pay naturally posts at drop-off, bonuses after the window ends and payouts weekly.
      Crediting missing pay or an earned bonus and lifting a resolved hold are agent actions, while cashing out, opting in to an offer and changing the payout method are the driver's own decisions made through the driver.
      Requests no rule decides, such as paying a near-missed bonus, crediting time or distance the trip record does not show, extending an offer, or a missing-pay claim above the support limit, can only be handed off as POLICY_NOT_COVERED.

  - name: driver_account_holds_and_deactivations
    claim:
      categories: [driver]
      event_types: [driver_hold, driver_hold_release, driver_deactivate, driver_reactivate, driver_document_submit, driver_document_update, driver_course_completion, driver_tier_change, driver_quality_warning, driver_voluntary_close]
    summary: >
      Drivers call because they cannot go online or fear they soon will not: an expired license, insurance, inspection or permit, a background recheck, a failed identity check, a rating or cancellation-rate warning, a safety investigation, a downgrade from a premium level, or a deactivation they want reversed.
      The setting varies by service level (rating and cancellation thresholds, fallback levels, required documents, inspection intervals and vehicle limits differ across the six agreements per driver_rating_standard, driver_cancellation_standard, driver_document_compliance and driver_onboarding_screening), by agreement status and hold or deactivation reason, by the dates on file, and by the driver's warning, report and course history in their lookbacks.
      The records are the agreement with its document expiry dates, hold and deactivation fields and rating snapshot, the standing record of documents, notices, reviews, warnings, safety reports, course completions and rechecks, and the appeals with their outcomes; the rules lift a document hold only when every required document is unexpired, accept appeals only for appealable reasons within a calendar-day window from deactivation, reverse rating deactivations only through the course, and leave safety outcomes to Trust and Safety, while an agreement naturally runs signing, screening and activation before any standing action.
      Recording documents, placing and lifting holds whose conditions are met, deactivating, reactivating on a granted appeal or completed course and moving a level are agent actions, while appealing, registering a new vehicle and ending the agreement are the driver's own claims and decisions made through the driver.
      Situations no rule decides, such as a safety hold past its investigation limit, a dispute of a rider's account of an incident, or reinstatement on grounds the policy does not list, can only be handed off as POLICY_NOT_COVERED.
