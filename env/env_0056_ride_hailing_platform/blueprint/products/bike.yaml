# Wayfare Bikes: bike share and scooter plans in the Denver, Salt Lake City and Phoenix systems. One
# holding = one plan; rides, overtime, parking and lost-vehicle fees are booked against it.
category: bike
display_name: Wayfare Bikes and Scooters

binding:
  holding_table: bike_plans
  event_tables: [bike_rides]
  status_field: status
  variant_field: variant_name
  quantity_fields: {net_charged: bike_charges}

lifecycle:
  states: [pending_payment, active, suspended, expired, cancelled]
  transitions:
    - {from: pending_payment, to: active, by: system, means: "The plan price is collected (or the free Pay As You Ride account is opened) and the plan can be used."}
    - {from: pending_payment, to: cancelled, by: system, means: "The plan price is declined at purchase."}
    - {from: active, to: suspended, by: system, means: "A bike charge is unpaid; the plan cannot unlock vehicles."}
    - {from: suspended, to: active, by: agent, means: "Every unpaid charge is paid and the plan is reinstated."}
    - {from: active, to: expired, by: system, means: "The term ends without renewal."}
    - {from: suspended, to: expired, by: system, means: "The term ends while the plan is suspended."}
    - {from: active, to: cancelled, by: user, means: "The rider cancels the plan."}

accounts:
  - key: bike_charges
    unit: USD
    meaning: "Plan prices, ride charges and fees booked under the plan less refunds."

parameter_schema:
  plan_price: "Price of the plan for one term, USD (0.00 for Pay As You Ride)"
  plan_term_days: "Days one term of the plan lasts, counting the activation date as day 1; 0 = open-ended account"
  day_pass_activation: "A Day Pass term starts at the first unlock after purchase, not at purchase"
  auto_renew: "Whether the plan renews automatically at the end of its term (true/false)"
  unlock_fee: "Charge per unlock of any vehicle, USD"
  classic_included_minutes: "Minutes of each classic bike ride included in the plan, minutes"
  classic_per_minute: "Charge per classic bike minute beyond the included minutes, USD per minute"
  ebike_per_minute: "Charge per e-bike minute beyond any free e-bike minutes, USD per minute"
  ebike_free_minutes_per_ride: "E-bike minutes per ride included before per-minute charges, minutes"
  ebike_cap_per_ride: "Most an e-bike ride's minute charges can total, USD; none = no cap"
  scooter_per_minute: "Charge per scooter minute, USD per minute"
  minute_rounding: "Ride minutes are rounded up to the next whole minute"
  overtime_basis: "Classic bike minutes beyond the included minutes are booked as an overtime fee row, separate from the ride charge"
  max_concurrent_rides: "Vehicles one rider may have unlocked at the same time, count"
  improper_parking_fee: "Fee when a vehicle is ended outside a station or parking zone, USD"
  parking_fee_first_offense_waived: "Whether the first improper parking in 12 months gets a warning instead of the fee (true/false)"
  parking_lookback_months: "Lookback for the first-offense waiver, months"
  lost_vehicle_threshold_hours: "A ride not ended this many elapsed hours after unlock is treated as a lost or stolen vehicle, hours"
  lost_vehicle_fee: "Fee for a lost or stolen vehicle by vehicle type, USD (mapping)"
  lost_fee_recovery_refund_days: "A lost vehicle fee is refunded in full when the vehicle is recovered undamaged within this many calendar days of the unlock"
  malfunction_report_hours: "Hours after a ride ends within which a malfunction must be reported for a refund of that ride, elapsed hours"
  dock_failure_refund: "Whether overtime caused by a dock that failed to lock the vehicle is refunded (true/false)"
  refund_destination: "Refunds return to the original payment method"
  cancellation_refund_days: "Calendar days after purchase within which an unused plan is refunded in full on cancellation; 0 = never"
  unused_definition: "A plan is unused when no ride has been started under it"
  annual_prorated_refund: "Whether annual plans are refunded pro rata after the full-refund window (true/false)"
  access_program_proof: "Programs whose enrollment qualifies for Access Annual (list)"
  access_reverify_months: "Months after purchase when Access eligibility must be shown again, months; 0 for other plans"
  unpaid_suspension: "Whether a plan is suspended while any bike charge is unpaid (true/false)"
  reinstatement_basis: "A suspended plan is reinstated when every unpaid charge is paid; the term is not extended for the suspension"
  pass_all_access_classic_free_minutes: "For riders holding a Wayfare Pass All Access Annual membership in trial, active or pending_cancellation status, classic minutes per ride free of charge on top of the plan's included minutes, minutes"
  pass_all_access_unlock_waived: "Whether the unlock fee is waived for riders holding a Wayfare Pass All Access Annual membership in a benefit-bearing status (true/false)"
  benefit_stacking: "When a plan allowance and a Wayfare Pass benefit both apply to one ride, the plan's included minutes are used first and the Pass minutes after them"
  markets: "Bike share systems the plan is sold in (list)"
  plan_switch_basis: "Moving to another plan cancels the current plan under its own refund rule and buys the new one"
  renewal_reminder_days: "Days before an annual renewal when the renewal reminder is sent, calendar days; 0 for non-annual plans"
  renewal_charge_day: "Renewals are charged on the day after expires_date"
  renewal_decline_handling: "A declined renewal ends the plan at expiry without retries"
  ride_history_window_days: "Days of ride history the rider can see in the app and support can refund against, calendar days"
  group_ride_basis: "Each unlocked vehicle is charged as its own ride under the rider's plan"
  ebike_unlock_requires_plan_balance: "Whether an e-bike unlock requires no unpaid charges on the plan (true/false)"
  helmet_discount: "Discount for verified helmet use, USD"
  vehicle_types_allowed: "Vehicle types the plan may unlock (list)"
  scooter_min_age: "Minimum rider age for scooters, years"
  night_scooter_curfew: "Hours scooters cannot be unlocked, market local time"
  station_full_extra_minutes: "Free minutes added when the destination station is full and the rider docks elsewhere, minutes"
  plan_fee_tax_basis: "Plan prices include applicable taxes"
  rounding_rule: "Every computed bike amount is rounded half up to the cent once, at the end of its computation"

