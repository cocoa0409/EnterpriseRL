events:
  - type: bike_plan_purchase
    target: bike_plans
    mutation: create
    meaning: "A rider buys a bike and scooter plan or opens a Pay As You Ride account."
    grain: "One row per plan."
    fields:
      customer_id: "Rider."
      variant_name: "Plan bought."
      market: "Bike share system."
      purchased_date: "Date bought."
      expires_date: "Last valid day (empty until a Day Pass is first used; empty for Pay As You Ride)."
      auto_renew: "Auto-renew setting."
    triggers:
      - event: "bike:bike_plan_fee"
        when: {variant_name: {not: "Wayfare Bikes Pay As You Ride"}}
        map: {charge_date: purchased_date}
      - event: "bike:bike_plan_activate"
        map: {}
  - type: bike_plan_activate
    target: bike_plans
    mutation: {transition: {from: pending_payment, to: active}}
    meaning: "The plan becomes usable."
    grain: "One write per plan."
    fields:
      expires_date: "Last valid day of the first term."
    triggers: []
  - type: bike_plan_payment_fail
    target: bike_plans
    mutation: {transition: {from: pending_payment, to: cancelled}}
    meaning: "The plan price is declined at purchase."
    grain: "One write per plan."
    fields:
      cancelled_date: "Date cancelled."
    triggers: []
  - type: bike_plan_suspend
    target: bike_plans
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The plan is suspended for an unpaid charge."
    grain: "One write per suspension."
    fields:
      expires_date: "Unchanged."
    triggers: []
  - type: bike_plan_reinstate
    target: bike_plans
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The plan is reinstated after the unpaid charges are paid."
    grain: "One write per reinstatement."
    fields:
      expires_date: "Unchanged."
    triggers: []
  - type: bike_plan_expire
    target: bike_plans
    mutation: {transition: [{from: active, to: expired}, {from: suspended, to: expired}]}
    meaning: "The term ends without renewal."
    grain: "One write per plan."
    fields:
      expires_date: "Last valid day."
    triggers: []
  - type: bike_plan_cancel
    target: bike_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The rider cancels the plan."
    grain: "One write per plan."
    fields:
      cancelled_date: "Date cancelled."
      auto_renew: "false."
    triggers: []
  - type: bike_plan_renew
    target: bike_plans
    mutation: update
    meaning: "The plan renews for another term."
    grain: "One write per renewal."
    fields:
      expires_date: "Last valid day of the new term."
    triggers:
      - event: "bike:bike_plan_fee"
        map: {}
  - type: bike_auto_renew_change
    target: bike_plans
    mutation: update
    meaning: "The rider turns auto-renew on or off."
    grain: "One write per change."
    fields:
      auto_renew: "New setting."
    triggers: []

  - type: bike_plan_fee
    target: bike_rides
    meaning: "The plan price is charged at purchase or renewal."
    grain: "One row per term bought."
    distinguish_by: [charge_date]
    fields:
      bike_plan_id: "Plan charged."
      charge_date: "Date charged."
      amount: "Plan price (positive)."
    account: bike_charges
    direction: in
    triggers: []
  - type: bike_ride_charge
    target: bike_rides
    meaning: "A ride is charged: unlock fee and minute charges beyond what the plan includes."
    grain: "One row per ride."
    distinguish_by: [ride_started_at]
    fields:
      bike_plan_id: "Plan the ride is under."
      charge_date: "Date the ride ended."
      ride_started_at: "Moment of unlock."
      vehicle_type: "Vehicle ridden."
      ride_minutes: "Ride length in whole minutes."
      amount: "Ride charge (positive, may be 0.00)."
    account: bike_charges
    direction: in
    triggers: []
  - type: bike_overtime_fee
    target: bike_rides
    meaning: "Classic bike minutes beyond the plan's included minutes are charged."
    grain: "One row per ride with overtime."
    distinguish_by: [ride_started_at]
    fields:
      bike_plan_id: "Plan the ride is under."
      charge_date: "Date the ride ended."
      ride_started_at: "Moment of unlock."
      vehicle_type: "classic_bike."
      ride_minutes: "Ride length in whole minutes."
      amount: "Overtime charge (positive)."
    account: bike_charges
    direction: in
    triggers: []
  - type: bike_parking_fee
    target: bike_rides
    meaning: "A vehicle was ended outside a station or parking zone."
    grain: "One row per ride improperly ended."
    distinguish_by: [ride_started_at]
    fields:
      bike_plan_id: "Plan the ride is under."
      charge_date: "Date charged."
      ride_started_at: "Moment of unlock."
      vehicle_type: "Vehicle ridden."
      amount: "Parking fee (positive)."
    account: bike_charges
    direction: in
    triggers: []
  - type: bike_lost_vehicle_fee
    target: bike_rides
    meaning: "A vehicle not returned within the lost-vehicle threshold is charged as lost or stolen."
    grain: "One row per ride not ended."
    distinguish_by: [ride_started_at]
    fields:
      bike_plan_id: "Plan the ride is under."
      charge_date: "Date charged."
      ride_started_at: "Moment of unlock."
      vehicle_type: "Vehicle not returned."
      amount: "Lost vehicle fee (positive)."
    account: bike_charges
    direction: in
    triggers: []
  - type: bike_refund
    target: bike_rides
    meaning: "A bike charge is refunded."
    grain: "One row per charge refunded."
    distinguish_by: [original_charge_id]
    fields:
      bike_plan_id: "Plan refunded."
      charge_date: "Date refunded."
      amount: "Amount returned (negative)."
      original_charge_id: "Charge refunded."
      refund_reason: "vehicle_malfunction, dock_failure, lost_vehicle_recovered or duplicate_charge."
    account: bike_charges
    direction: out
    triggers: []

measures:
  - id: bike_msr_parking_fees_lookback
    window: "parking_lookback_months calendar months ending on the ride date."
    measure: "Count of bike_parking_fee rows and first-offense parking warnings of the rider (all plans of the same customer_id) in the window."

policies:
  - id: bike_agg_multi_holding
    subject: [bike_plan_purchase]
    rule: >-
      A rider may hold one plan per bike share system at a time.
      A plan is bought only when the rider has no plan in pending_payment, active or suspended status in the same system; moving to another plan cancels the current one under its own refund rule and buys the new one (plan_switch_basis).
    eligibility:
      - id: one_plan_per_system
        applies_to: [bike_plan_purchase]
        kind: dedup
        condition: "A plan is bought only when the rider has no plan in pending_payment, active or suspended status in the same system; moving to another plan cancels the current one under its own refund rule and buys the new one (plan_switch_basis)."
        evidence_fields: [bike_plans.customer_id, bike_plans.market, bike_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[bike_plans.customer_id, bike_plans.market]]
          action_bindings: {bike_plans.customer_id: customer_id, bike_plans.market: market}
        dedup_contract:
          table: bike_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id, market: market}
          duplicate_filters: {status: [pending_payment, active, suspended]}
          distinct_fields: [purchased_date]
    params:
      max_per_customer: 3
      markets: "=markets"
      plan_switch_basis: "=plan_switch_basis"

  - id: bike_agg_pass_benefit
    subject: [bike_ride_charge, bike_overtime_fee]
    rule: >-
      A rider who also holds a Wayfare Pass All Access Annual membership in trial, active or pending_cancellation status gets the plan's pass_all_access_classic_free_minutes on each classic bike ride and, where pass_all_access_unlock_waived is true, no unlock fee; other Wayfare Pass plans give no bike benefit.
      The plan's included minutes are used first and the Pass minutes after them (benefit_stacking).
    eligibility:
      - id: pass_in_force
        applies_to: [bike_ride_charge, bike_overtime_fee]
        kind: state
        condition: "A rider who also holds a Wayfare Pass All Access Annual membership in trial, active or pending_cancellation status gets the plan's pass_all_access_classic_free_minutes on each classic bike ride and, where pass_all_access_unlock_waived is true, no unlock fee; other Wayfare Pass plans give no bike benefit."
        evidence_fields: [pass_memberships.status, pass_memberships.variant_name, pass_memberships.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.customer_id]]
          action_bindings: {pass_memberships.customer_id: customer_id}
        state_contract:
          field: pass_memberships.status
          allowed: [trial, active, pending_cancellation]
    params:
      benefit_stacking: "=benefit_stacking"
      per_tier:
        "Wayfare Bikes Pay As You Ride": {pass_all_access_classic_free_minutes: "=pass_all_access_classic_free_minutes", pass_all_access_unlock_waived: "=pass_all_access_unlock_waived"}
        "Wayfare Bikes Day Pass": {pass_all_access_classic_free_minutes: "=pass_all_access_classic_free_minutes", pass_all_access_unlock_waived: "=pass_all_access_unlock_waived"}
        "Wayfare Bikes Monthly Pass": {pass_all_access_classic_free_minutes: "=pass_all_access_classic_free_minutes", pass_all_access_unlock_waived: "=pass_all_access_unlock_waived"}
        "Wayfare Bikes Access Annual": {pass_all_access_classic_free_minutes: "=pass_all_access_classic_free_minutes", pass_all_access_unlock_waived: "=pass_all_access_unlock_waived"}
        "Wayfare Bikes Annual": {pass_all_access_classic_free_minutes: "=pass_all_access_classic_free_minutes", pass_all_access_unlock_waived: "=pass_all_access_unlock_waived"}
        "Wayfare Bikes Annual Plus": {pass_all_access_classic_free_minutes: "=pass_all_access_classic_free_minutes", pass_all_access_unlock_waived: "=pass_all_access_unlock_waived"}

  - id: bike_purchase_and_term
    subject: [bike_plan_purchase, bike_plan_activate, bike_plan_payment_fail, bike_plan_expire, bike_plan_renew, bike_auto_renew_change, bike_plan_fee]
    rule: >-
      Plans are sold in the systems listed in markets to riders meeting the entry gate; Access Annual requires enrollment in one of access_program_proof, shown again every access_reverify_months.
      A plan becomes active when its price is collected; a term lasts plan_term_days counting the activation day, except that a Day Pass term starts at its first unlock (day_pass_activation).
      Plans with auto_renew true renew on the day after expires_date (renewal_charge_day) at plan_price, with a reminder renewal_reminder_days before an annual renewal; a declined renewal ends the plan at expiry (renewal_decline_handling); prices include tax (plan_fee_tax_basis).
    eligibility: []
    params:
      access_program_proof: "=access_program_proof"
      renewal_charge_day: "=renewal_charge_day"
      renewal_decline_handling: "=renewal_decline_handling"
      plan_fee_tax_basis: "=plan_fee_tax_basis"
      per_tier:
        "Wayfare Bikes Pay As You Ride": {plan_price: "=plan_price", plan_term_days: "=plan_term_days", day_pass_activation: "=day_pass_activation", auto_renew: "=auto_renew", access_reverify_months: "=access_reverify_months", renewal_reminder_days: "=renewal_reminder_days"}
        "Wayfare Bikes Day Pass": {plan_price: "=plan_price", plan_term_days: "=plan_term_days", day_pass_activation: "=day_pass_activation", auto_renew: "=auto_renew", access_reverify_months: "=access_reverify_months", renewal_reminder_days: "=renewal_reminder_days"}
        "Wayfare Bikes Monthly Pass": {plan_price: "=plan_price", plan_term_days: "=plan_term_days", day_pass_activation: "=day_pass_activation", auto_renew: "=auto_renew", access_reverify_months: "=access_reverify_months", renewal_reminder_days: "=renewal_reminder_days"}
        "Wayfare Bikes Access Annual": {plan_price: "=plan_price", plan_term_days: "=plan_term_days", day_pass_activation: "=day_pass_activation", auto_renew: "=auto_renew", access_reverify_months: "=access_reverify_months", renewal_reminder_days: "=renewal_reminder_days"}
        "Wayfare Bikes Annual": {plan_price: "=plan_price", plan_term_days: "=plan_term_days", day_pass_activation: "=day_pass_activation", auto_renew: "=auto_renew", access_reverify_months: "=access_reverify_months", renewal_reminder_days: "=renewal_reminder_days"}
        "Wayfare Bikes Annual Plus": {plan_price: "=plan_price", plan_term_days: "=plan_term_days", day_pass_activation: "=day_pass_activation", auto_renew: "=auto_renew", access_reverify_months: "=access_reverify_months", renewal_reminder_days: "=renewal_reminder_days"}

  - id: bike_evt_ride_pricing
    subject: [bike_ride_charge, bike_overtime_fee]
    rule: >-
      Rides are charged only on an active plan; a suspended plan cannot unlock vehicles.
      Each ride is charged the unlock_fee plus minute charges by vehicle type: classic bike minutes beyond classic_included_minutes at classic_per_minute (booked as a separate overtime row, overtime_basis), e-bike minutes beyond ebike_free_minutes_per_ride at ebike_per_minute up to ebike_cap_per_ride, and scooter minutes at scooter_per_minute; minutes are rounded up (minute_rounding).
      A rider may have at most max_concurrent_rides vehicles unlocked at once, each charged as its own ride (group_ride_basis); scooters require age scooter_min_age and cannot be unlocked during night_scooter_curfew.
      When the destination station is full and the rider docks at the next station, station_full_extra_minutes are added to the included minutes.
    eligibility:
      - id: active_plan
        applies_to: [bike_ride_charge]
        kind: state
        condition: "Rides are charged only on an active plan; a suspended plan cannot unlock vehicles."
        evidence_fields: [bike_plans.status, bike_plans.bike_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[bike_plans.bike_plan_id]]
          action_bindings: {bike_plans.bike_plan_id: bike_plan_id}
        state_contract:
          field: bike_plans.status
          allowed: [active]
    params:
      minute_rounding: "=minute_rounding"
      overtime_basis: "=overtime_basis"
      group_ride_basis: "=group_ride_basis"
      scooter_min_age: "=scooter_min_age"
      night_scooter_curfew: "=night_scooter_curfew"
      station_full_extra_minutes: "=station_full_extra_minutes"
      vehicle_types_allowed: "=vehicle_types_allowed"
      helmet_discount: "=helmet_discount"
      ebike_unlock_requires_plan_balance: "=ebike_unlock_requires_plan_balance"
      rounding_rule: "=rounding_rule"
      per_tier:
        "Wayfare Bikes Pay As You Ride": {unlock_fee: "=unlock_fee", classic_included_minutes: "=classic_included_minutes", classic_per_minute: "=classic_per_minute", ebike_per_minute: "=ebike_per_minute", ebike_free_minutes_per_ride: "=ebike_free_minutes_per_ride", ebike_cap_per_ride: "=ebike_cap_per_ride", scooter_per_minute: "=scooter_per_minute", max_concurrent_rides: "=max_concurrent_rides"}
        "Wayfare Bikes Day Pass": {unlock_fee: "=unlock_fee", classic_included_minutes: "=classic_included_minutes", classic_per_minute: "=classic_per_minute", ebike_per_minute: "=ebike_per_minute", ebike_free_minutes_per_ride: "=ebike_free_minutes_per_ride", ebike_cap_per_ride: "=ebike_cap_per_ride", scooter_per_minute: "=scooter_per_minute", max_concurrent_rides: "=max_concurrent_rides"}
        "Wayfare Bikes Monthly Pass": {unlock_fee: "=unlock_fee", classic_included_minutes: "=classic_included_minutes", classic_per_minute: "=classic_per_minute", ebike_per_minute: "=ebike_per_minute", ebike_free_minutes_per_ride: "=ebike_free_minutes_per_ride", ebike_cap_per_ride: "=ebike_cap_per_ride", scooter_per_minute: "=scooter_per_minute", max_concurrent_rides: "=max_concurrent_rides"}
        "Wayfare Bikes Access Annual": {unlock_fee: "=unlock_fee", classic_included_minutes: "=classic_included_minutes", classic_per_minute: "=classic_per_minute", ebike_per_minute: "=ebike_per_minute", ebike_free_minutes_per_ride: "=ebike_free_minutes_per_ride", ebike_cap_per_ride: "=ebike_cap_per_ride", scooter_per_minute: "=scooter_per_minute", max_concurrent_rides: "=max_concurrent_rides"}
        "Wayfare Bikes Annual": {unlock_fee: "=unlock_fee", classic_included_minutes: "=classic_included_minutes", classic_per_minute: "=classic_per_minute", ebike_per_minute: "=ebike_per_minute", ebike_free_minutes_per_ride: "=ebike_free_minutes_per_ride", ebike_cap_per_ride: "=ebike_cap_per_ride", scooter_per_minute: "=scooter_per_minute", max_concurrent_rides: "=max_concurrent_rides"}
        "Wayfare Bikes Annual Plus": {unlock_fee: "=unlock_fee", classic_included_minutes: "=classic_included_minutes", classic_per_minute: "=classic_per_minute", ebike_per_minute: "=ebike_per_minute", ebike_free_minutes_per_ride: "=ebike_free_minutes_per_ride", ebike_cap_per_ride: "=ebike_cap_per_ride", scooter_per_minute: "=scooter_per_minute", max_concurrent_rides: "=max_concurrent_rides"}

  - id: bike_evt_parking_and_lost
    subject: [bike_parking_fee, bike_lost_vehicle_fee]
    rule: >-
      A vehicle ended outside a station or parking zone is charged improper_parking_fee, except that the rider's first improper parking within parking_lookback_months (bike_msr_parking_fees_lookback) gets a warning instead (parking_fee_first_offense_waived).
      A ride not ended lost_vehicle_threshold_hours after unlock is charged the lost_vehicle_fee for its vehicle type.
    eligibility: []
    params:
      improper_parking_fee: "=improper_parking_fee"
      parking_fee_first_offense_waived: "=parking_fee_first_offense_waived"
      parking_lookback_months: "=parking_lookback_months"
      lost_vehicle_threshold_hours: "=lost_vehicle_threshold_hours"
      lost_vehicle_fee: "=lost_vehicle_fee"
    measures: [bike_msr_parking_fees_lookback]

  - id: bike_evt_refunds
    subject: [bike_refund]
    rule: >-
      Refunds return to the original payment method (refund_destination) and name the charge refunded.
      A ride is refunded in full for a malfunction reported within malfunction_report_hours after the ride ended; overtime caused by a dock that failed to lock is refunded (dock_failure_refund); a lost vehicle fee is refunded in full when the vehicle is recovered undamaged within lost_fee_recovery_refund_days of the unlock; a duplicate charge is always refunded.
      Support refunds only charges within ride_history_window_days.
    eligibility:
      - id: one_refund_per_charge
        applies_to: [bike_refund]
        kind: dedup
        condition: "Refunds return to the original payment method (refund_destination) and name the charge refunded."
        evidence_fields: [bike_rides.original_charge_id, bike_rides.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[bike_rides.original_charge_id]]
          action_bindings: {bike_rides.original_charge_id: original_charge_id}
        dedup_contract:
          table: bike_rides
          mode: separate_record
          object_bindings: {original_charge_id: original_charge_id}
          duplicate_filters: {event_type: [bike_refund]}
          distinct_fields: [charge_date]
    params:
      refund_destination: "=refund_destination"
      malfunction_report_hours: "=malfunction_report_hours"
      dock_failure_refund: "=dock_failure_refund"
      lost_fee_recovery_refund_days: "=lost_fee_recovery_refund_days"
      ride_history_window_days: "=ride_history_window_days"

  - id: bike_cancellation_and_suspension
    subject: [bike_plan_cancel, bike_plan_suspend, bike_plan_reinstate, bike_refund]
    rule: >-
      Cancelling a plan is the rider's own decision; an unused plan (unused_definition) cancelled within cancellation_refund_days of purchase is refunded in full, and no plan is refunded pro rata after that (annual_prorated_refund).
      A plan is suspended while any bike charge under it is unpaid (unpaid_suspension) and is reinstated when every unpaid charge is paid, without extending the term (reinstatement_basis).
    eligibility: []
    params:
      unused_definition: "=unused_definition"
      annual_prorated_refund: "=annual_prorated_refund"
      unpaid_suspension: "=unpaid_suspension"
      reinstatement_basis: "=reinstatement_basis"
      per_tier:
        "Wayfare Bikes Pay As You Ride": {cancellation_refund_days: "=cancellation_refund_days"}
        "Wayfare Bikes Day Pass": {cancellation_refund_days: "=cancellation_refund_days"}
        "Wayfare Bikes Monthly Pass": {cancellation_refund_days: "=cancellation_refund_days"}
        "Wayfare Bikes Access Annual": {cancellation_refund_days: "=cancellation_refund_days"}
        "Wayfare Bikes Annual": {cancellation_refund_days: "=cancellation_refund_days"}
        "Wayfare Bikes Annual Plus": {cancellation_refund_days: "=cancellation_refund_days"}

  - id: bike_lifecycle_notes
    subject: [bike_plan_expire, bike_plan_cancel]
    rule: >-
      An expired or cancelled plan cannot unlock vehicles; charges booked before it ended remain payable and refundable under the rules above.
      A rider whose plan expired buys a new plan rather than reactivating the old one.
    eligibility: []
