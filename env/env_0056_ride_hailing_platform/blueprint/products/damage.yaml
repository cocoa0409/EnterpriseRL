events:
  # ---------------- holding writes ----------------
  - type: damage_report
    target: damage_assessments
    mutation: create
    meaning: "A driver reports a mess or damage left on a trip, opening an assessment against the trip's requesting rider."
    grain: "One row per report."
    fields:
      customer_id: "Requesting rider of the trip."
      variant_name: "Level the driver reported."
      trip_id: "Trip concerned."
      driver_customer_id: "Reporting driver."
      driver_agreement_id: "Reporting driver's agreement."
      reported_at: "Moment of the report."
      incident_category: "What was reported."
      photo_count: "Photos submitted with the report."
      repair_receipt_amount: "Receipt total submitted with the report, or 0.00."
    triggers: []
  - type: damage_review_open
    target: damage_assessments
    mutation: {transition: {from: reported, to: under_review}}
    meaning: "The minimum evidence is on file and the report enters review."
    grain: "One write per assessment."
    fields:
      photo_count: "Photos on file."
    triggers: []
  - type: damage_deny
    target: damage_assessments
    mutation: {transition: [{from: reported, to: denied}, {from: under_review, to: denied}]}
    meaning: "The report is denied and nothing is charged."
    grain: "One write per denial."
    fields:
      closed_date: "Date denied."
    triggers: []
  - type: damage_reconsider
    target: damage_assessments
    mutation: {transition: {from: denied, to: under_review}}
    meaning: "A denied report is reopened for review on the driver's request with new evidence."
    grain: "One write per reconsideration."
    fields:
      closed_date: "Cleared."
    triggers: []
  - type: damage_approve_charge
    target: damage_assessments
    mutation: {transition: {from: under_review, to: charged}}
    meaning: "Review approves the fee at the level held and it is charged to the rider."
    grain: "One write per assessment."
    fields:
      assessed_fee: "Fee approved."
      charged_date: "Date charged."
    triggers:
      - event: "damage:damage_fee_charge"
        map: {amount: assessed_fee, event_date: charged_date}
  - type: damage_dispute
    target: damage_assessments
    mutation: {transition: {from: charged, to: disputed}}
    meaning: "The rider disputes the fee."
    grain: "One write per assessment."
    fields:
      dispute_filed_date: "Date disputed."
    triggers: []
  - type: damage_uphold
    target: damage_assessments
    mutation: {transition: {from: disputed, to: upheld}}
    meaning: "The dispute is decided and the fee stands."
    grain: "One write per assessment."
    fields:
      closed_date: "Date decided."
    triggers: []
  - type: damage_reverse
    target: damage_assessments
    mutation: {transition: [{from: disputed, to: reversed}, {from: charged, to: reversed}]}
    meaning: "The fee is reversed and refunded in full."
    grain: "One write per assessment."
    fields:
      closed_date: "Date reversed."
      assessed_fee: "Set to 0.00."
    triggers:
      - event: "damage:damage_fee_refund"
        map: {event_date: closed_date}
  - type: damage_reclassify
    target: damage_assessments
    mutation: update
    meaning: "A reviewer moves the assessment to a lower level the evidence supports."
    grain: "One write per reclassification."
    fields:
      variant_name: "New, lower level."
      assessed_fee: "Fee at the new level."
    triggers: []
  - type: damage_evidence_update
    target: damage_assessments
    mutation: update
    meaning: "The evidence totals on the assessment are brought up to date after a submission."
    grain: "One write per evidence submission."
    fields:
      photo_count: "Photos now on file."
      repair_receipt_amount: "Receipt total now on file."
    triggers: []

  # ---------------- ledger writes ----------------
  - type: damage_evidence_submit
    target: damage_events
    meaning: "The driver submits photos or a receipt or estimate for a report."
    grain: "One row per submission of one evidence type."
    distinguish_by: [recorded_at, evidence_type]
    fields:
      damage_assessment_id: "Assessment the evidence is for."
      event_date: "Date submitted."
      recorded_at: "Moment submitted."
      amount: "0.00."
      evidence_type: "photo_set, cleaning_receipt, repair_receipt or repair_estimate."
      evidence_count: "Photos or documents in the submission."
      fee_level: "Level held when submitted."
    triggers:
      - event: "damage:damage_evidence_update"
        map: {}
  - type: damage_fee_charge
    target: damage_events
    meaning: "The approved fee is charged to the rider."
    grain: "One row per assessment (an assessment is charged once)."
    distinguish_by: [damage_assessment_id]
    fields:
      damage_assessment_id: "Assessment charged."
      event_date: "Date charged."
      recorded_at: "Moment charged."
      amount: "Fee charged (positive)."
      fee_level: "Level charged."
    account: fee_billed
    direction: in
    triggers:
      - event: "earnings:earnings_cleaning_credit"
        map: {damage_assessment_id: damage_assessment_id}
  - type: damage_fee_refund
    target: damage_events
    meaning: "The whole remaining fee is refunded to the rider."
    grain: "One row per fee charge refunded in full."
    distinguish_by: [original_event_id]
    fields:
      damage_assessment_id: "Assessment refunded."
      event_date: "Date refunded."
      recorded_at: "Moment refunded."
      amount: "Amount returned (negative): the fee charged less any partial refund already made."
      fee_level: "Level held when refunded."
      original_event_id: "The fee charge refunded."
      refund_reason: "service_animal_shedding, insufficient_evidence, wrong_rider, duplicate_report, filed_outside_window or courtesy_first_incident."
    account: fee_billed
    direction: out
    triggers:
      - event: "earnings:earnings_adjustment_debit"
        when: {refund_reason: {not: courtesy_first_incident}}
        map: {damage_assessment_id: damage_assessment_id, adjustment_reason: cleaning_fee_reversal}
  - type: damage_fee_partial_refund
    target: damage_events
    meaning: "Part of the fee is refunded because the assessment was moved to a lower level after it was charged."
    grain: "One row per reclassification after charge."
    distinguish_by: [original_event_id, fee_level]
    fields:
      damage_assessment_id: "Assessment refunded."
      event_date: "Date refunded."
      recorded_at: "Moment refunded."
      amount: "Difference returned (negative)."
      fee_level: "Lower level the fee was reduced to."
      original_event_id: "The fee charge partly refunded."
      refund_reason: "level_reclassified."
    account: fee_billed
    direction: out
    triggers:
      - event: "earnings:earnings_adjustment_debit"
        map: {damage_assessment_id: damage_assessment_id, adjustment_reason: cleaning_fee_reversal}

measures:
  - id: damage_msr_rider_prior_charged
    window: "courtesy_lookback_days calendar days ending on the day before the trip of the assessment in question."
    measure: "Count of the rider's other assessments (same customer_id) with a charged_date in the window whose status is charged, disputed or upheld."
  - id: damage_msr_driver_reports_window
    window: "driver_report_lookback_days calendar days ending on the report date, both ends inclusive."
    measure: "Count of assessments with the same driver_customer_id whose reported_at falls in the window, the report in question included."
  - id: damage_msr_evidence_submissions
    window: "Life of one assessment."
    measure: "Count of damage_evidence_submit rows on the assessment."
  - id: damage_msr_refunded_so_far
    window: "Life of one assessment."
    measure: "Absolute sum of damage_fee_refund and damage_fee_partial_refund amounts on the assessment."

policies:
  - id: damage_agg_multi_holding
    subject: [damage_report]
    rule: >-
      A rider may have any number of assessments over time, but a trip carries at most max_assessments_per_trip assessment.
      A report is accepted only when the trip has no other assessment in reported, under_review, charged, disputed, upheld or reversed status; when an earlier report on the trip was denied, a new report is not opened and the driver uses reconsideration of the denied one instead.
      A mess and damage found on the same trip are reported as one assessment at the higher level that the evidence supports.
    eligibility:
      - id: one_assessment_per_trip
        applies_to: [damage_report]
        kind: dedup
        condition: "A report is accepted only when the trip has no other assessment in reported, under_review, charged, disputed, upheld or reversed status; when an earlier report on the trip was denied, a new report is not opened and the driver uses reconsideration of the denied one instead."
        evidence_fields: [damage_assessments.trip_id, damage_assessments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.trip_id]]
          action_bindings: {damage_assessments.trip_id: trip_id}
        dedup_contract:
          table: damage_assessments
          mode: separate_record
          object_bindings: {trip_id: trip_id}
          duplicate_filters: {status: [reported, under_review, denied, charged, disputed, upheld, reversed]}
          distinct_fields: [reported_at]
    params:
      max_per_customer: null
      max_assessments_per_trip: "=max_assessments_per_trip"

  - id: damage_agg_driver_report_volume
    subject: [damage_report, damage_approve_charge]
    rule: >-
      Reports are counted per driver across all riders and trips (damage_msr_driver_reports_window).
      When a report brings the driver's count to driver_report_review_threshold or more, support may not approve it: it stays with Trust and Safety, and the only support action is a POLICY_NOT_COVERED handoff.
      Below the threshold, reports are reviewed by support in the usual way.
    eligibility:
      - id: below_report_threshold
        applies_to: [damage_approve_charge]
        kind: authorization
        condition: "When a report brings the driver's count to driver_report_review_threshold or more, support may not approve it: it stays with Trust and Safety, and the only support action is a POLICY_NOT_COVERED handoff."
        evidence_fields: [damage_assessments.driver_customer_id, damage_assessments.reported_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.driver_customer_id]]
          action_bindings: {damage_assessments.driver_customer_id: driver_customer_id}
    params:
      driver_report_review_threshold: "=driver_report_review_threshold"
      driver_report_lookback_days: "=driver_report_lookback_days"
    measures: [damage_msr_driver_reports_window]

  - id: damage_filing_and_evidence
    subject: [damage_report, damage_review_open, damage_evidence_submit, damage_evidence_update]
    rule: >-
      A report can be made only on a completed trip.
      A report must be made within the filing window: The filing window is counted in elapsed hours from the trip's drop-off moment, and the report must be registered no later than filing_window_hours full hours after it.
      The driver reports through the driver app or driver support (report_channels) and may submit evidence up to max_evidence_submissions times per report; evidence is accepted only while the assessment is reported, under_review or denied.
      The report enters review only when it has at least min_photos photos and, for levels with receipt_required true, a document of a type in receipt_types_accepted; photos must show photo_subjects_required.
      When the minimum evidence is not on file evidence_deadline_hours after reported_at, the report is denied (evidence_deadline_missed).
      A report that mentions an injury to anyone is never handled as a fee and goes to Trust and Safety (injury_route).
    eligibility:
      - id: completed_trip
        applies_to: [damage_report]
        kind: state
        condition: "A report can be made only on a completed trip."
        evidence_fields: [trips.status, trips.trip_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips.trip_id]]
          action_bindings: {trips.trip_id: trip_id}
        state_contract:
          field: trips.status
          allowed: [completed]
      - id: within_filing_window
        applies_to: [damage_report]
        kind: time
        condition: "A report must be made within the filing window: The filing window is counted in elapsed hours from the trip's drop-off moment, and the report must be registered no later than filing_window_hours full hours after it."
        evidence_fields: [trips.dropoff_at, trips.trip_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips.trip_id]]
          action_bindings: {trips.trip_id: trip_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "trip's drop-off moment"
          anchor_source: trips.dropoff_at
          relation: not_after
          duration_source: variants.filing_window_hours
          unit: elapsed_hours
          counting_rule: "The filing window is counted in elapsed hours from the trip's drop-off moment, and the report must be registered no later than filing_window_hours full hours after it."
          boundary: inclusive
      - id: evidence_open_status
        applies_to: [damage_evidence_submit]
        kind: state
        condition: "The driver reports through the driver app or driver support (report_channels) and may submit evidence up to max_evidence_submissions times per report; evidence is accepted only while the assessment is reported, under_review or denied."
        evidence_fields: [damage_assessments.status, damage_assessments.damage_assessment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.damage_assessment_id]]
          action_bindings: {damage_assessments.damage_assessment_id: damage_assessment_id}
        state_contract:
          field: damage_assessments.status
          allowed: [reported, under_review, denied]
    params:
      report_channels: "=report_channels"
      injury_route: "=injury_route"
      per_tier:
        "Cleaning Fee Level 1 (Minor)": {filing_window_hours: "=filing_window_hours", evidence_deadline_hours: "=evidence_deadline_hours", min_photos: "=min_photos", receipt_required: "=receipt_required", receipt_types_accepted: "=receipt_types_accepted", max_evidence_submissions: "=max_evidence_submissions", photo_subjects_required: "=photo_subjects_required"}
        "Cleaning Fee Level 2 (Moderate)": {filing_window_hours: "=filing_window_hours", evidence_deadline_hours: "=evidence_deadline_hours", min_photos: "=min_photos", receipt_required: "=receipt_required", receipt_types_accepted: "=receipt_types_accepted", max_evidence_submissions: "=max_evidence_submissions", photo_subjects_required: "=photo_subjects_required"}
        "Cleaning Fee Level 3 (Significant)": {filing_window_hours: "=filing_window_hours", evidence_deadline_hours: "=evidence_deadline_hours", min_photos: "=min_photos", receipt_required: "=receipt_required", receipt_types_accepted: "=receipt_types_accepted", max_evidence_submissions: "=max_evidence_submissions", photo_subjects_required: "=photo_subjects_required"}
        "Cleaning Fee Level 4 (Major)": {filing_window_hours: "=filing_window_hours", evidence_deadline_hours: "=evidence_deadline_hours", min_photos: "=min_photos", receipt_required: "=receipt_required", receipt_types_accepted: "=receipt_types_accepted", max_evidence_submissions: "=max_evidence_submissions", photo_subjects_required: "=photo_subjects_required"}
        "Damage Fee (Interior Repair)": {filing_window_hours: "=filing_window_hours", evidence_deadline_hours: "=evidence_deadline_hours", min_photos: "=min_photos", receipt_required: "=receipt_required", receipt_types_accepted: "=receipt_types_accepted", max_evidence_submissions: "=max_evidence_submissions", photo_subjects_required: "=photo_subjects_required"}
        "Damage Fee (Exterior Repair)": {filing_window_hours: "=filing_window_hours", evidence_deadline_hours: "=evidence_deadline_hours", min_photos: "=min_photos", receipt_required: "=receipt_required", receipt_types_accepted: "=receipt_types_accepted", max_evidence_submissions: "=max_evidence_submissions", photo_subjects_required: "=photo_subjects_required"}
    measures: [damage_msr_evidence_submissions]

  - id: damage_level_classification
    subject: [damage_report, damage_reclassify]
    rule: >-
      Each level covers the incidents its level_definition, surfaces_affected, vehicle_offline_expected, professional_cleaning_required and odor_treatment_included describe (level_examples are typical cases), and only the incident categories listed in its entry gate.
      A report is held at the lowest level whose definition matches the evidence on file; when the evidence matches a lower level than the one reported, the reviewer moves it down (reclassification_direction) and never up.
      The non_chargeable_conditions are not chargeable at any level, and a report consisting only of them is denied (non_chargeable_condition).
    eligibility: []
    params:
      non_chargeable_conditions: "=non_chargeable_conditions"
      reclassification_allowed: "=reclassification_allowed"
      reclassification_direction: "=reclassification_direction"
      per_tier:
        "Cleaning Fee Level 1 (Minor)": {level_definition: "=level_definition", surfaces_affected: "=surfaces_affected", vehicle_offline_expected: "=vehicle_offline_expected", professional_cleaning_required: "=professional_cleaning_required", odor_treatment_included: "=odor_treatment_included", level_examples: "=level_examples"}
        "Cleaning Fee Level 2 (Moderate)": {level_definition: "=level_definition", surfaces_affected: "=surfaces_affected", vehicle_offline_expected: "=vehicle_offline_expected", professional_cleaning_required: "=professional_cleaning_required", odor_treatment_included: "=odor_treatment_included", level_examples: "=level_examples"}
        "Cleaning Fee Level 3 (Significant)": {level_definition: "=level_definition", surfaces_affected: "=surfaces_affected", vehicle_offline_expected: "=vehicle_offline_expected", professional_cleaning_required: "=professional_cleaning_required", odor_treatment_included: "=odor_treatment_included", level_examples: "=level_examples"}
        "Cleaning Fee Level 4 (Major)": {level_definition: "=level_definition", surfaces_affected: "=surfaces_affected", vehicle_offline_expected: "=vehicle_offline_expected", professional_cleaning_required: "=professional_cleaning_required", odor_treatment_included: "=odor_treatment_included", level_examples: "=level_examples"}
        "Damage Fee (Interior Repair)": {level_definition: "=level_definition", surfaces_affected: "=surfaces_affected", vehicle_offline_expected: "=vehicle_offline_expected", professional_cleaning_required: "=professional_cleaning_required", odor_treatment_included: "=odor_treatment_included", level_examples: "=level_examples"}
        "Damage Fee (Exterior Repair)": {level_definition: "=level_definition", surfaces_affected: "=surfaces_affected", vehicle_offline_expected: "=vehicle_offline_expected", professional_cleaning_required: "=professional_cleaning_required", odor_treatment_included: "=odor_treatment_included", level_examples: "=level_examples"}

  - id: damage_evt_fee_charge
    subject: [damage_fee_charge, damage_approve_charge]
    rule: >-
      A fee is charged only on an assessment approved at review, once, on approval (charge_timing).
      At a flat level the fee is the level's flat_fee; at a receipt-based level it is the receipt or estimate amount on file (estimate_settles_fee), capped at receipt_fee_cap, and a receipt below receipt_min_amount is denied (below_receipt_minimum); the part of a repair above the cap is never charged to the rider and the driver is referred to the insurance claim desk (excess_damage_route) through a POLICY_NOT_COVERED handoff.
      The fee is charged in full to the rider who requested the trip (fee_payer_basis), including for companions, and is never split (split_fare_allocation).
      Support may not approve a fee on a Wayfare Shared trip (shared_trip_assessable); those reports go to Trust and Safety.
      A fee that fails to collect stays on the assessment (unpaid_fee_handling).
    eligibility:
      - id: approved_assessment
        applies_to: [damage_fee_charge]
        kind: state
        condition: "A fee is charged only on an assessment approved at review, once, on approval (charge_timing)."
        evidence_fields: [damage_assessments.status, damage_assessments.damage_assessment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.damage_assessment_id]]
          action_bindings: {damage_assessments.damage_assessment_id: damage_assessment_id}
        state_contract:
          field: damage_assessments.status
          allowed: [charged]
      - id: not_shared_trip
        applies_to: [damage_approve_charge]
        kind: authorization
        condition: "Support may not approve a fee on a Wayfare Shared trip (shared_trip_assessable); those reports go to Trust and Safety."
        evidence_fields: [trips.variant_name, trips.trip_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips.trip_id]]
          action_bindings: {trips.trip_id: trip_id}
    params:
      charge_timing: "=charge_timing"
      excess_damage_route: "=excess_damage_route"
      fee_payer_basis: "=fee_payer_basis"
      split_fare_allocation: "=split_fare_allocation"
      shared_trip_assessable: "=shared_trip_assessable"
      unpaid_fee_handling: "=unpaid_fee_handling"
      rounding_rule: "=rounding_rule"
      per_tier:
        "Cleaning Fee Level 1 (Minor)": {fee_basis: "=fee_basis", flat_fee: "=flat_fee", receipt_fee_cap: "=receipt_fee_cap", receipt_min_amount: "=receipt_min_amount", estimate_settles_fee: "=estimate_settles_fee"}
        "Cleaning Fee Level 2 (Moderate)": {fee_basis: "=fee_basis", flat_fee: "=flat_fee", receipt_fee_cap: "=receipt_fee_cap", receipt_min_amount: "=receipt_min_amount", estimate_settles_fee: "=estimate_settles_fee"}
        "Cleaning Fee Level 3 (Significant)": {fee_basis: "=fee_basis", flat_fee: "=flat_fee", receipt_fee_cap: "=receipt_fee_cap", receipt_min_amount: "=receipt_min_amount", estimate_settles_fee: "=estimate_settles_fee"}
        "Cleaning Fee Level 4 (Major)": {fee_basis: "=fee_basis", flat_fee: "=flat_fee", receipt_fee_cap: "=receipt_fee_cap", receipt_min_amount: "=receipt_min_amount", estimate_settles_fee: "=estimate_settles_fee"}
        "Damage Fee (Interior Repair)": {fee_basis: "=fee_basis", flat_fee: "=flat_fee", receipt_fee_cap: "=receipt_fee_cap", receipt_min_amount: "=receipt_min_amount", estimate_settles_fee: "=estimate_settles_fee"}
        "Damage Fee (Exterior Repair)": {fee_basis: "=fee_basis", flat_fee: "=flat_fee", receipt_fee_cap: "=receipt_fee_cap", receipt_min_amount: "=receipt_min_amount", estimate_settles_fee: "=estimate_settles_fee"}
    formula:
      amount: "flat_fee if fee_basis == 'flat' else min(repair_receipt_amount, receipt_fee_cap)"

  - id: damage_dispute_rules
    subject: [damage_dispute, damage_uphold, damage_reverse]
    rule: >-
      Disputing a fee is the rider's own claim and is made by the rider, at most disputes_per_assessment time per assessment.
      A dispute is accepted only within the dispute window: The dispute window is counted in calendar days from the charged_date: day 1 is the calendar day after the charge, and the dispute must be filed no later than the last day of the window.
      A disputed fee is upheld when the evidence on file met the level's photo and receipt requirements at approval (dispute_evidence_standard), and reversed in full otherwise (insufficient_evidence); the rider's account alone never reverses a fee backed by evidence that meets the standard (rider_statement_weight).
      When the evidence supports only a lower level, the assessment is moved down, the difference is refunded, and the fee is upheld at the lower level.
      A fee is also reversed in full, with or without a dispute, when the records show the charge was against the wrong rider (wrong_rider), duplicated another assessment (duplicate_report) or was reported outside the filing window (filed_outside_window).
    eligibility:
      - id: within_dispute_window
        applies_to: [damage_dispute]
        kind: time
        condition: "A dispute is accepted only within the dispute window: The dispute window is counted in calendar days from the charged_date: day 1 is the calendar day after the charge, and the dispute must be filed no later than the last day of the window."
        evidence_fields: [damage_assessments.charged_date, damage_assessments.damage_assessment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.damage_assessment_id]]
          action_bindings: {damage_assessments.damage_assessment_id: damage_assessment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "charged_date"
          anchor_source: damage_assessments.charged_date
          relation: not_after
          duration_source: variants.rider_dispute_window_days
          unit: calendar_days
          counting_rule: "The dispute window is counted in calendar days from the charged_date: day 1 is the calendar day after the charge, and the dispute must be filed no later than the last day of the window."
          boundary: inclusive
    params:
      rider_dispute_window_days: "=rider_dispute_window_days"
      disputes_per_assessment: "=disputes_per_assessment"
      dispute_evidence_standard: "=dispute_evidence_standard"
      rider_statement_weight: "=rider_statement_weight"

  - id: damage_evt_refunds
    subject: [damage_fee_refund, damage_fee_partial_refund, damage_reclassify]
    rule: >-
      Refunds return to the original payment method (refund_destination) and always name the fee charge they return (original_event_id).
      A partial refund is made only when a charged assessment is moved to a lower level while it is disputed or after it was upheld; it equals the fee at the old level less the fee at the new level (partial_refund_basis).
      A full refund returns the fee charged less anything already refunded (damage_msr_refunded_so_far), and is made only when the assessment is reversed.
      When a refund is made for any reason other than a first-incident courtesy, the reporting driver's payout on the amount returned is taken back; a courtesy refund leaves the driver's payout in place (courtesy_payout_kept).
    eligibility:
      - id: reversed_assessment
        applies_to: [damage_fee_refund]
        kind: state
        condition: "A full refund returns the fee charged less anything already refunded (damage_msr_refunded_so_far), and is made only when the assessment is reversed."
        evidence_fields: [damage_assessments.status, damage_assessments.damage_assessment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.damage_assessment_id]]
          action_bindings: {damage_assessments.damage_assessment_id: damage_assessment_id}
        state_contract:
          field: damage_assessments.status
          allowed: [reversed]
      - id: reclassified_after_charge
        applies_to: [damage_fee_partial_refund]
        kind: state
        condition: "A partial refund is made only when a charged assessment is moved to a lower level while it is disputed or after it was upheld; it equals the fee at the old level less the fee at the new level (partial_refund_basis)."
        evidence_fields: [damage_assessments.status, damage_assessments.damage_assessment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.damage_assessment_id]]
          action_bindings: {damage_assessments.damage_assessment_id: damage_assessment_id}
        state_contract:
          field: damage_assessments.status
          allowed: [disputed, upheld]
    params:
      refund_destination: "=refund_destination"
      partial_refund_basis: "=partial_refund_basis"
      courtesy_payout_kept: "=courtesy_payout_kept"
    measures: [damage_msr_refunded_so_far]

  - id: damage_agg_courtesy_first_incident
    subject: [damage_fee_refund, damage_reverse]
    rule: >-
      A disputed fee at a level with courtesy_first_incident_eligible true may be reversed once as a first-incident courtesy, even though the evidence meets the standard.
      The courtesy applies only when the rider has no other charged, disputed or upheld assessment with a charged_date in the courtesy lookback (damage_msr_rider_prior_charged is 0), counted across all of the rider's assessments.
      The courtesy refund carries refund reason courtesy_first_incident and the driver keeps the payout.
    eligibility:
      - id: first_incident
        applies_to: [damage_fee_refund]
        kind: authorization
        condition: "The courtesy applies only when the rider has no other charged, disputed or upheld assessment with a charged_date in the courtesy lookback (damage_msr_rider_prior_charged is 0), counted across all of the rider's assessments."
        evidence_fields: [damage_assessments.customer_id, damage_assessments.status, damage_assessments.charged_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.customer_id]]
          action_bindings: {damage_assessments.customer_id: customer_id}
    params:
      courtesy_lookback_days: "=courtesy_lookback_days"
      per_tier:
        "Cleaning Fee Level 1 (Minor)": {courtesy_first_incident_eligible: "=courtesy_first_incident_eligible"}
        "Cleaning Fee Level 2 (Moderate)": {courtesy_first_incident_eligible: "=courtesy_first_incident_eligible"}
        "Cleaning Fee Level 3 (Significant)": {courtesy_first_incident_eligible: "=courtesy_first_incident_eligible"}
        "Cleaning Fee Level 4 (Major)": {courtesy_first_incident_eligible: "=courtesy_first_incident_eligible"}
        "Damage Fee (Interior Repair)": {courtesy_first_incident_eligible: "=courtesy_first_incident_eligible"}
        "Damage Fee (Exterior Repair)": {courtesy_first_incident_eligible: "=courtesy_first_incident_eligible"}
    measures: [damage_msr_rider_prior_charged]

  - id: damage_service_animal
    subject: [damage_deny, damage_reverse, damage_fee_refund]
    rule: >-
      Hair or dander shed by a service animal is never charged (service_animal_shedding_exempt): a report of animal_hair_or_mess that consists of shedding from a service animal the rider was travelling with is denied before charge, or reversed in full with reason service_animal_shedding when already charged.
      Whether the animal was a service animal is the rider's own statement and is accepted as given; the rider is never asked for documentation or the animal's training.
      A mess other than shedding left by a service animal is charged at its level like any other mess (service_animal_accident_chargeable).
    eligibility:
      - id: service_animal_statement
        applies_to: [damage_reverse, damage_fee_refund]
        kind: caller_fact
        condition: "Whether the animal was a service animal is the rider's own statement and is accepted as given; the rider is never asked for documentation or the animal's training."
        evidence_fields: [damage_assessments.incident_category, damage_assessments.damage_assessment_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[damage_assessments.damage_assessment_id]]
          action_bindings: {damage_assessments.damage_assessment_id: damage_assessment_id}
    params:
      service_animal_shedding_exempt: "=service_animal_shedding_exempt"
      service_animal_accident_chargeable: "=service_animal_accident_chargeable"

  - id: damage_reconsideration
    subject: [damage_reconsider, damage_deny]
    rule: >-
      A denial is recorded with one of the denial_reasons.
      A driver may ask for reconsideration of a denied report only within the reconsideration window: The reconsideration window is counted in calendar days from the denial's closed_date: day 1 is the calendar day after the denial, and the request must be made no later than the last day of the window.
      Reconsideration is granted at most reconsiderations_per_assessment time and only when the driver submits new evidence that cures the denial reason; denials for filed_outside_window, duplicate_report and non_chargeable_condition cannot be cured.
    eligibility:
      - id: within_reconsideration_window
        applies_to: [damage_reconsider]
        kind: time
        condition: "A driver may ask for reconsideration of a denied report only within the reconsideration window: The reconsideration window is counted in calendar days from the denial's closed_date: day 1 is the calendar day after the denial, and the request must be made no later than the last day of the window."
        evidence_fields: [damage_assessments.closed_date, damage_assessments.damage_assessment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[damage_assessments.damage_assessment_id]]
          action_bindings: {damage_assessments.damage_assessment_id: damage_assessment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "denial's closed_date"
          anchor_source: damage_assessments.closed_date
          relation: not_after
          duration_source: variants.reconsideration_window_days
          unit: calendar_days
          counting_rule: "The reconsideration window is counted in calendar days from the denial's closed_date: day 1 is the calendar day after the denial, and the request must be made no later than the last day of the window."
          boundary: inclusive
    params:
      denial_reasons: "=denial_reasons"
      reconsideration_window_days: "=reconsideration_window_days"
      reconsiderations_per_assessment: "=reconsiderations_per_assessment"
      review_path: "=review_path"
