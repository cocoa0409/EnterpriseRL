# Driver services agreements: every driver contracts with Wayfare as an independent contractor for one
# service level. One holding = one agreement. Its standing (documents, rating, cancellations, safety,
# background checks) decides whether it is active, on hold or deactivated, and appeals and
# reactivation bring it back.
category: driver
display_name: Driver Services Agreements and Account Standing

binding:
  holding_table: driver_agreements
  event_tables: [driver_standing_events]
  intake_tables: [driver_appeals]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [applied, screening, active, on_hold, deactivated, closed]
  transitions:
    - {from: applied, to: screening, by: system, means: "Documents are on file and the background check is ordered."}
    - {from: screening, to: active, by: system, means: "The background check is clear and the vehicle and documents are approved."}
    - {from: screening, to: closed, by: system, means: "The applicant does not pass screening; the agreement closes."}
    - {from: active, to: on_hold, by: agent, means: "The agreement is put on hold for a recorded hold reason; the driver cannot go online."}
    - {from: on_hold, to: active, by: agent, means: "The hold reason is resolved and the driver can go online again."}
    - {from: active, to: deactivated, by: agent, means: "The agreement is deactivated for a recorded reason."}
    - {from: on_hold, to: deactivated, by: agent, means: "A hold ends in deactivation."}
    - {from: deactivated, to: active, by: agent, means: "The deactivation is reversed: appeal granted, course reactivation or document reinstatement."}
    - {from: deactivated, to: closed, by: system, means: "A deactivated agreement is not reactivated within the closing period."}
    - {from: active, to: closed, by: user, means: "The driver ends the agreement."}
    - {from: on_hold, to: closed, by: user, means: "The driver ends the agreement while on hold."}

accounts: []

parameter_schema:
  max_vehicle_age_years: "Oldest vehicle accepted, counted as current calendar year minus model year, years"
  vehicle_age_rollover: "Vehicle age steps up on January 1 each year; a vehicle that ages out leaves the level that day"
  min_vehicle_seats: "Fewest passenger seats the registered vehicle must have, seats"
  allowed_powertrains: "Powertrains accepted for the level (list)"
  required_documents: "Documents that must be on file and unexpired (list)"
  inspection_interval_months: "Months a vehicle inspection stays valid from the inspection date, months"
  min_rating_to_keep: "Rating below which the rating standard acts, on the average of the rating window, 2 decimal places"
  rating_window_trips: "Most recent rated trips averaged into the current rating, trips"
  min_rated_trips_for_action: "Rated trips needed before the rating standard can act, trips"
  rating_fallback_agreement: "Agreement a driver below min_rating_to_keep is moved to instead of a warning, when the rating still meets that agreement's own standard; none = no fallback"
  rating_reassessment_days: "Days after a rating warning until the rating review that decides deactivation, calendar days"
  rating_warnings_before_deactivation: "Rating warnings a driver receives before a still-low rating leads to deactivation, count"
  cancellation_rate_threshold_pct: "Driver cancellation rate above which the cancellation standard acts, percent"
  cancellation_rate_window_trips: "Most recent accepted trips over which the driver cancellation rate is computed, trips"
  cancellation_excluded_reasons: "Driver cancellations that do not count toward the rate (list)"
  cancellation_warnings_before_hold: "Cancellation warnings before a further breach leads to a temporary hold, count"
  cancellation_hold_days: "Length of a temporary hold for a repeated cancellation-rate breach, calendar days"
  cancellation_breaches_for_deactivation: "Cancellation-rate breaches within the lookback that lead to deactivation instead of a hold, count"
  cancellation_breach_lookback_days: "Lookback for counting cancellation-rate breaches, calendar days"
  warning_validity_days: "A warning older than this no longer counts toward escalation, calendar days"
  acceptance_rate_action: "Acceptance rate never leads to a warning, hold, downgrade or deactivation (drivers are free to decline requests)"
  expiry_notice_first_days: "Days before a document's expiry date that the first expiry notice is sent, calendar days"
  expiry_notice_second_days: "Days before a document's expiry date that the second expiry notice is sent, calendar days"
  document_expiry_hold: "Whether the agreement goes on hold the day after a required document expires (true/false)"
  document_hold_max_days: "Days a document hold may last before the agreement is deactivated for document lapse, calendar days"
  document_lapse_reactivation: "A document-lapse deactivation is reversed without appeal once every required document is on file and unexpired"
  background_recheck_interval_months: "Months after background_check_date when the next background check falls due, months"
  background_recheck_hold: "Whether an overdue background check puts the agreement on hold until a result arrives (true/false)"
  adverse_action_response_business_days: "Business days a driver has to respond to a pre-adverse action notice after a consider result before a final decision, business days (Monday-Friday, excluding US federal holidays)"
  safety_hold_categories: "Safety report categories that place the agreement on hold at once pending investigation (list)"
  safety_warning_categories: "Safety report categories that lead to a warning unless repeated (list)"
  unsafe_driving_reports_for_hold: "Reports in the warning categories within the lookback that place the agreement on hold, count"
  unsafe_driving_lookback_days: "Lookback for counting warning-category safety reports, calendar days"
  safety_investigation_max_days: "Longest a safety hold may last before Trust and Safety must release or deactivate, calendar days"
  appeal_window_days: "Calendar days after deactivation_date within which a driver may appeal"
  appealable_reasons: "Deactivation reasons that may be appealed (list)"
  appeals_per_deactivation: "Most appeals per deactivation, count"
  appeal_decision_days: "Calendar days Wayfare takes to decide an appeal after it is submitted"
  course_reactivation: "Whether a rating deactivation can be reversed by completing the quality improvement course (true/false)"
  course_reactivations_per_365_days: "Course reactivations allowed within 365 days, count"
  deactivation_close_after_days: "A deactivated agreement not reactivated within this many calendar days is closed"
  reapplication_wait_months: "Months after an agreement closed for cause before the driver may sign a new one, months"
  tier_upgrade_min_active_days: "Days an agreement must have been active before moving to a higher level, calendar days"
  tier_change_inspection_required: "Whether a level change requires an inspection of the vehicle valid on the change date (true/false)"
  fraud_deactivation_payout_hold: "Whether a fraud deactivation places the driver's earnings payouts on hold (true/false)"
  hold_release_requirements: "What lifts each hold reason (mapping)"
  identity_check_hold: "Whether a failed real-time identity photo check places the agreement on hold (true/false)"
  voluntary_close_effective: "When a driver's own closing of the agreement takes effect"
  rounding_rule: "Ratings and rates are compared at the precision recorded (2 decimal places for ratings, 1 for percentages), never rounded further"

