# Wayfare Pass: the rider membership. One holding = one membership on one plan; it is billed per
# period, earns Pass ride credit on eligible trips, and unlocks fee waivers and discounts that the
# trip charter applies at charge time.
category: pass
display_name: Wayfare Pass (rider membership)

binding:
  holding_table: pass_memberships
  event_tables: [pass_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {member_credit_balance: member_credit, net_fees_paid: membership_fees}

lifecycle:
  states: [enrolled, trial, active, past_due, paused, pending_cancellation, cancelled]
  transitions:
    - {from: enrolled, to: trial, by: system, means: "A first-time member eligible for a free trial starts the trial on the enrollment date."}
    - {from: enrolled, to: active, by: system, means: "The first membership fee is collected (or a card partner offer is confirmed) and the first paid period begins."}
    - {from: trial, to: active, by: system, means: "The trial converts: the first fee is collected the day after the trial ends."}
    - {from: enrolled, to: cancelled, by: system, means: "The first membership fee is declined; the enrollment ends without benefits."}
    - {from: trial, to: cancelled, by: system, means: "The trial conversion fee is declined; the membership ends."}
    - {from: trial, to: cancelled, by: user, means: "The member cancels during the free trial; the membership ends at once and is never charged."}
    - {from: active, to: past_due, by: system, means: "A renewal fee is declined; the membership is past due while retries run."}
    - {from: past_due, to: active, by: system, means: "A retry or a new payment method collects the renewal fee."}
    - {from: past_due, to: cancelled, by: system, means: "The dunning grace period ends without payment."}
    - {from: active, to: paused, by: system, means: "A pause the member scheduled starts on the renewal date instead of a renewal charge."}
    - {from: paused, to: active, by: system, means: "The pause ends and a new paid period begins with a renewal charge."}
    - {from: paused, to: cancelled, by: user, means: "The member ends a paused membership."}
    - {from: active, to: pending_cancellation, by: user, means: "The member turns auto-renew off; benefits continue to the end of the period in force."}
    - {from: pending_cancellation, to: active, by: user, means: "The member turns auto-renew back on before the period ends."}
    - {from: pending_cancellation, to: cancelled, by: system, means: "The period in force ends with auto-renew off."}
    - {from: pending_cancellation, to: cancelled, by: user, means: "The member ends the membership at once instead of waiting for the period end."}
    - {from: active, to: cancelled, by: user, means: "The member ends the membership at once."}

accounts:
  - key: member_credit
    unit: USD
    meaning: "Pass ride credit earned on eligible trips, less credit spent on fares and credit forfeited."
  - key: membership_fees
    unit: USD
    meaning: "Membership fees charged to the member less fees refunded."

parameter_schema:
  membership_fee: "Fee for one billing period of the plan, USD"
  billing_period: "Length of one billing period (monthly or annual)"
  billing_period_months: "Billing period length in calendar months"
  period_end_rule: "How the period end is found: the day before the same day-of-month billing_period_months later; when that day does not exist the period ends on the last day of the shorter month"
  free_trial_days: "Length of the free trial for a first-time member, calendar days counting the enrollment date as day 1; 0 = no trial"
  trial_lookback_months: "No trial is granted if the customer held any Wayfare Pass membership that began within this many calendar months before enrollment, months"
  ride_credit_rate_pct: "Pass ride credit earned on the eligible fare of each eligible completed trip, percent"
  ride_credit_cap_per_trip: "Most Pass ride credit one trip can earn, USD"
  ride_credit_monthly_cap: "Most Pass ride credit that can be earned in one calendar month, USD"
  ride_credit_min_eligible_fare: "Trips whose eligible fare is below this amount earn no credit, USD"
  ride_credit_eligible_options: "Ride options whose trips earn Pass ride credit (list)"
  ride_credit_excluded_components: "Charges that are never part of the eligible fare (list); the eligible fare is the fare charge amount less the booking fee"
  ride_credit_reserved_trips: "Whether reserved trips earn credit like on-demand trips (true/false)"
  ride_credit_posting_delay_hours: "Hours after drop-off before earned credit becomes available to spend, hours"
  credit_expiry_days_after_end: "Unspent credit is forfeited this many calendar days after the membership's cancelled_date, days"
  credit_redemption_scope: "What Pass ride credit can pay for (list)"
  member_discount_pct: "Member discount on the fare excluding the booking fee for the options in member_discount_options, percent"
  member_discount_options: "Ride options the member discount applies to (list; empty when the plan has no discount)"
  free_cancellations_per_month: "Rider cancellation fees waived per calendar month as a Pass benefit, count"
  rebook_grace_minutes: "A cancellation fee is waived when the member requests a new trip within this many minutes of cancelling, minutes; does not use the monthly allowance"
  priority_pickups_per_month: "Priority Pickup charges waived per calendar month, count"
  reservation_fee_waived: "Whether Wayfare Reserve reservation fees are waived for the member (true/false)"
  benefits_in_past_due: "Whether benefits (discount, credit earning, waivers) apply while the membership is past due (true/false)"
  benefits_in_trial: "Whether all plan benefits apply during the free trial (true/false)"
  pause_allowed: "Whether the member may pause the membership (true/false)"
  pause_min_months: "Shortest pause, whole billing months; 0 where pausing is not offered"
  pause_max_months: "Longest pause, whole billing months; 0 where pausing is not offered"
  pause_frequency_months: "A new pause may begin only if no pause began within this many calendar months before; 0 where pausing is not offered"
  refund_full_window_days: "A fee charge is refunded in full when the member cancels within this many calendar days of the charge date and no benefit was used since that charge, days"
  annual_proration_refund: "Whether an annual fee not refundable in full is refunded pro rata for unused whole months on immediate cancellation (true/false)"
  proration_unit: "Unit of pro rata refunds: whole calendar months of the period not yet begun on the cancellation date"
  proration_credit_offset: "Whether Pass ride credit earned in the current period is deducted from a pro rata refund (true/false)"
  proration_min_refund: "A pro rata refund below this amount is not paid, USD; 0.00 where proration is not offered"
  immediate_cancel_allowed: "Whether the member may end the membership at once instead of at period end (true/false)"
  payment_retry_attempts: "Retries of a declined membership fee before the membership ends, count"
  payment_retry_interval_days: "Days between retries of a declined fee, calendar days"
  dunning_grace_days: "Days after the first decline during which the membership stays past due before it ends, calendar days"
  student_verification_valid_months: "Student verification is valid for this many calendar months from the verification date; 0 for non-student plans"
  student_reverify_grace_days: "Days after student verification lapses before the plan converts at the next renewal, calendar days; 0 for non-student plans"
  student_lapse_conversion_plan: "Plan a lapsed student membership converts to at its next renewal; none for non-student plans"
  upgrade_targets: "Plans this plan may move up to mid-period (list)"
  downgrade_targets: "Plans this plan may move down to at the next renewal (list)"
  upgrade_proration_basis: "An upgrade starts a new period on the change date and is charged the new plan's fee less the unused value of the current period, the unused value being the current fee times unused days over days in the period"
  downgrade_effective: "When a downgrade takes effect"
  plan_changes_per_period: "Most plan changes per billing period, count"
  card_partner_refundable: "Whether Wayfare refunds anything on a membership taken out through a card partner offer (true/false)"
  card_partner_plans: "Plans a card partner offer can provide (true/false per plan)"
  credit_month_basis: "Monthly credit caps and allowances count by calendar month in the member's home market time"
  rounding_rule: "Every computed membership amount is rounded half up to the cent once, at the end of its computation"

