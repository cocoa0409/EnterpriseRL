# Wayfare Rentals: weekly vehicle rentals for drivers who do not have a qualifying car. One holding =
# one rental of one vehicle class; charges are booked weekly and paid from the driver's earnings
# first, then from the card on file.
category: rental
display_name: Wayfare Rentals (driver vehicle rentals)

binding:
  holding_table: rental_agreements
  event_tables: [rental_charges]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: rental_balance, deposit_held: rental_deposit}

lifecycle:
  states: [reserved, active, return_due, returned, closed]
  transitions:
    - {from: reserved, to: active, by: system, means: "The driver collects the vehicle at the hub; deposit and first week are booked."}
    - {from: reserved, to: closed, by: user, means: "The driver cancels the reservation before pickup."}
    - {from: reserved, to: closed, by: system, means: "The reservation lapses unpicked after the hold period."}
    - {from: active, to: return_due, by: agent, means: "A return is required (driver agreement deactivated or closed, or an unpaid balance past the threshold) by a return_due_date."}
    - {from: active, to: returned, by: user, means: "The driver returns the vehicle."}
    - {from: return_due, to: returned, by: user, means: "The driver returns the vehicle after a return was required."}
    - {from: returned, to: closed, by: system, means: "The return inspection is done, the deposit is settled and the rental closes."}

accounts:
  - key: rental_balance
    unit: USD
    meaning: "Rental charges booked less rebates, payments and deposit offsets; what the driver still owes."
  - key: rental_deposit
    unit: USD
    meaning: "Security deposit held less amounts released or applied."

parameter_schema:
  weekly_rate: "Rental charge per rental week, USD"
  rental_week_basis: "A rental week runs from the pickup weekday to the same weekday a week later; charges are booked on the first day of each week"
  auto_renew_weekly: "Whether the rental continues week to week until the vehicle is returned (true/false)"
  partial_week_refund: "Whether part of a weekly charge is refunded when the vehicle is returned mid-week (true/false)"
  ride_rebate_ladder: "Credit against the week's rental by completed trips in the rental week; the highest step reached applies, steps never add (mapping)"
  ride_rebate_basis: "Trips that count for the rebate: completed trips driven by the renter under the linked agreement with drop-off in the rental week"
  included_miles_per_week: "Miles included per rental week, miles"
  mileage_overage_rate: "Charge per mile over the weekly allowance, USD per mile"
  mileage_basis: "Miles for a week are odometer readings at the week's start and end; unused miles do not carry over"
  security_deposit: "Deposit held at pickup, USD"
  deposit_release_days: "Calendar days after the return date by which the remaining deposit is released"
  deposit_application_order: "At return, the deposit is applied to the unpaid balance first and the rest is released"
  damage_deductible: "Most a renter pays for damage from one incident, USD"
  damage_charge_schedule: "Charge by damage category before the deductible cap, USD (mapping); major_collision is charged at the deductible"
  damage_dispute_window_days: "Calendar days after a damage charge within which the renter may dispute it"
  normal_wear_exempt: "Whether normal wear (tire wear, small stone chips under the size of a coin, interior wear) is never charged (true/false)"
  toll_passthrough: "Tolls on the rental vehicle are charged at the posted toll with no administration fee"
  toll_schedule_reference: "Toll amounts follow the per-facility amounts Wayfare charges riders (trip charter toll_schedule)"
  late_return_grace_hours: "Hours after the return deadline before a late return fee applies, elapsed hours"
  late_return_daily_fee: "Fee per started day after the grace period that a required return is late, USD"
  return_after_deactivation_hours: "Hours after the linked driver agreement is deactivated or closed within which the vehicle must be returned, elapsed hours"
  past_due_return_threshold: "An unpaid balance above this amount for past_due_return_days requires the vehicle to be returned, USD"
  past_due_return_days: "Days an unpaid balance may stay above the threshold before a return is required, calendar days"
  return_notice_to_due_hours: "Hours from a required return to its return_due_date for balance-driven returns, elapsed hours"
  payment_order: "How each charge is paid (list, in order)"
  card_charge_timing: "Any part of a charge not covered by earnings is charged to the card on file the day after the weekly deduction"
  reservation_hold_days: "Calendar days a reservation is held for pickup before it lapses"
  reservation_fee: "Fee to reserve a vehicle, USD"
  max_active_rentals: "Most rentals one driver may hold in reserved, active or return_due status, count"
  hubs_by_market: "Hub serving each market (mapping)"
  maintenance_included: "Whether routine maintenance and repairs from wear are included and never charged (true/false)"
  insurance_included: "Coverage included in the weekly rate"
  roadside_assistance_included: "Whether 24-hour roadside assistance is included (true/false)"
  personal_use_allowed: "Whether the vehicle may be used for personal driving within the mileage allowance (true/false)"
  out_of_state_allowed: "Whether the vehicle may leave the hub's state (true/false)"
  additional_drivers_allowed: "Whether anyone other than the renter may drive the vehicle (true/false)"
  smoking_allowed: "Whether smoking or vaping in the vehicle is allowed (true/false); smoke damage is charged as interior damage"
  pet_allowed: "Whether non-service pets may ride in the vehicle off-trip (true/false)"
  ev_charging_included: "Whether charging at Wayfare hub chargers is included at no cost (true/false)"
  return_inspection_required: "Whether a return inspection by hub staff is required before the rental closes (true/false)"
  after_hours_return_allowed: "Whether vehicles may be returned to the hub drop box after hours (true/false)"
  after_hours_return_basis: "An after-hours return counts as returned at the hub's next opening time"
  vehicle_swap_basis: "A vehicle swap at the hub keeps the same rental and week; only the plate changes"
  min_rental_weeks: "Shortest rental, weeks"
  early_return_fee: "Fee for returning before the end of a rental week, USD"
  first_week_charge_timing: "The first weekly charge and the deposit are booked at pickup"
  unpaid_balance_new_rental_block: "Whether a driver with an unpaid balance on an earlier rental may reserve a new one (true/false)"
  rounding_rule: "Every computed rental amount is rounded half up to the cent once, at the end of its computation"

