events:
  - type: rental_reserve
    target: rental_agreements
    mutation: create
    meaning: "A driver reserves a vehicle class at a hub."
    grain: "One row per rental."
    fields:
      customer_id: "Driver."
      driver_agreement_id: "Driver services agreement the rental is for."
      variant_name: "Vehicle class reserved."
      rental_hub: "Hub of pickup and return."
      reserved_date: "Date reserved."
    triggers: []
  - type: rental_pickup
    target: rental_agreements
    mutation: {transition: {from: reserved, to: active}}
    meaning: "The driver collects the vehicle."
    grain: "One write per rental."
    fields:
      pickup_date: "Date collected."
      vehicle_plate: "Plate of the vehicle."
      odometer_out: "Odometer at pickup."
    triggers:
      - event: "rental:rental_deposit_hold"
        map: {charge_date: pickup_date}
      - event: "rental:rental_weekly_charge"
        map: {charge_date: pickup_date, rental_week_start: pickup_date}
  - type: rental_reservation_cancel
    target: rental_agreements
    mutation: {transition: {from: reserved, to: closed}}
    meaning: "The reservation ends without pickup, cancelled by the driver or lapsed."
    grain: "One write per rental."
    fields:
      closed_date: "Date closed."
    triggers: []
  - type: rental_return_require
    target: rental_agreements
    mutation: {transition: {from: active, to: return_due}}
    meaning: "The driver is required to return the vehicle by a date."
    grain: "One write per rental."
    fields:
      return_due_date: "Date the vehicle must be back."
    triggers: []
  - type: rental_vehicle_return
    target: rental_agreements
    mutation: {transition: [{from: active, to: returned}, {from: return_due, to: returned}]}
    meaning: "The vehicle is returned to the hub."
    grain: "One write per rental."
    fields:
      returned_date: "Date returned."
      odometer_in: "Odometer at return."
    triggers: []
  - type: rental_close
    target: rental_agreements
    mutation: {transition: {from: returned, to: closed}}
    meaning: "The rental closes after inspection and deposit settlement."
    grain: "One write per rental."
    fields:
      closed_date: "Date closed."
    triggers: []
  - type: rental_vehicle_swap
    target: rental_agreements
    mutation: update
    meaning: "The vehicle is swapped at the hub within the same rental."
    grain: "One write per swap."
    fields:
      vehicle_plate: "Plate of the new vehicle."
      odometer_out: "Odometer of the new vehicle at swap."
    triggers: []

  - type: rental_weekly_charge
    target: rental_charges
    meaning: "The weekly rental charge is booked at the start of a rental week."
    grain: "One row per rental week."
    distinguish_by: [rental_week_start]
    fields:
      rental_agreement_id: "Rental charged."
      charge_date: "Date booked."
      amount: "Weekly rate (positive)."
      rental_week_start: "First day of the week."
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_ride_rebate
    target: rental_charges
    meaning: "A rebate on the week's rental is credited for trips completed in the rental week."
    grain: "One row per rental week that reached a rebate step."
    distinguish_by: [rental_week_start]
    fields:
      rental_agreement_id: "Rental credited."
      charge_date: "Date credited."
      amount: "Rebate (negative)."
      rental_week_start: "Week the rebate is for."
    account: rental_balance
    direction: out
    triggers: []
  - type: rental_mileage_overage
    target: rental_charges
    meaning: "Miles over the weekly allowance are charged at the end of a rental week."
    grain: "One row per rental week over the allowance."
    distinguish_by: [rental_week_start]
    fields:
      rental_agreement_id: "Rental charged."
      charge_date: "Date booked."
      amount: "Overage charge (positive)."
      rental_week_start: "Week the overage is for."
      miles_over: "Miles over the allowance."
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_damage_charge
    target: rental_charges
    meaning: "Damage found on the vehicle is charged to the renter."
    grain: "One row per damage incident."
    distinguish_by: [charge_date, damage_category]
    fields:
      rental_agreement_id: "Rental charged."
      charge_date: "Date booked."
      amount: "Damage charge (positive)."
      damage_category: "Category of damage."
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_toll_charge
    target: rental_charges
    meaning: "A toll incurred by the rental vehicle is passed through."
    grain: "One row per toll facility per day."
    distinguish_by: [charge_date, toll_facility]
    fields:
      rental_agreement_id: "Rental charged."
      charge_date: "Date of the toll."
      amount: "Toll (positive)."
      toll_facility: "Facility."
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_late_return_fee
    target: rental_charges
    meaning: "A required return is late beyond the grace period."
    grain: "One row per late day."
    distinguish_by: [charge_date]
    fields:
      rental_agreement_id: "Rental charged."
      charge_date: "Late day charged."
      amount: "Late fee (positive)."
    account: rental_balance
    direction: in
    triggers: []
  - type: rental_earnings_payment
    target: rental_charges
    meaning: "A rental charge is paid from the driver's earnings."
    grain: "One row per charge paid from earnings."
    distinguish_by: [original_charge_id]
    fields:
      rental_agreement_id: "Rental paid."
      charge_date: "Date paid."
      amount: "Amount paid (negative)."
      original_charge_id: "Charge paid."
    account: rental_balance
    direction: out
    triggers:
      - event: "earnings:earnings_rental_deduction"
        map: {rental_charge_id: original_charge_id}
  - type: rental_card_payment
    target: rental_charges
    meaning: "The part of a rental charge not covered by earnings is paid by card."
    grain: "One row per charge paid by card."
    distinguish_by: [original_charge_id]
    fields:
      rental_agreement_id: "Rental paid."
      charge_date: "Date paid."
      amount: "Amount paid (negative)."
      original_charge_id: "Charge paid."
    account: rental_balance
    direction: out
    triggers: []
  - type: rental_deposit_hold
    target: rental_charges
    meaning: "The security deposit is taken at pickup."
    grain: "One row per rental."
    distinguish_by: [charge_date]
    fields:
      rental_agreement_id: "Rental."
      charge_date: "Date held."
      amount: "Deposit (positive)."
    account: rental_deposit
    direction: in
    triggers: []
  - type: rental_deposit_release
    target: rental_charges
    meaning: "What remains of the deposit is returned after the rental."
    grain: "One row per rental."
    distinguish_by: [charge_date]
    fields:
      rental_agreement_id: "Rental."
      charge_date: "Date released."
      amount: "Amount released (negative)."
    account: rental_deposit
    direction: out
    triggers: []
  - type: rental_deposit_applied
    target: rental_charges
    meaning: "Part of the deposit is applied to an unpaid charge at return."
    grain: "One row per charge the deposit pays."
    distinguish_by: [original_charge_id]
    fields:
      rental_agreement_id: "Rental."
      charge_date: "Date applied."
      amount: "Amount applied (negative)."
      original_charge_id: "Charge the deposit pays."
    account: rental_deposit
    direction: out
    triggers:
      - event: "rental:rental_balance_offset"
        map: {original_charge_id: original_charge_id, charge_date: charge_date}
  - type: rental_balance_offset
    target: rental_charges
    meaning: "An unpaid charge is cleared by deposit applied to it."
    grain: "One row per charge cleared by deposit."
    distinguish_by: [original_charge_id]
    fields:
      rental_agreement_id: "Rental."
      charge_date: "Date cleared."
      amount: "Amount cleared (negative)."
      original_charge_id: "Charge cleared."
    account: rental_balance
    direction: out
    triggers: []

measures:
  - id: rental_msr_week_trips
    window: "One rental week, from rental_week_start (inclusive) to the same weekday a week later (exclusive)."
    measure: "Count of trips with the renter as driver_customer_id under the rental's driver_agreement_id, status completed, dropoff_at inside the week."
  - id: rental_msr_unpaid_days
    window: "Up to the current day."
    measure: "Number of consecutive calendar days, ending today, on which balance_due has been above past_due_return_threshold."

policies:
  - id: rental_agg_multi_holding
    subject: [rental_reserve]
    rule: >-
      A driver may hold one rental at a time.
      A reservation is accepted only when the driver has no rental in reserved, active or return_due status and no unpaid balance on an earlier rental (unpaid_balance_new_rental_block).
    eligibility:
      - id: one_open_rental
        applies_to: [rental_reserve]
        kind: dedup
        condition: "A reservation is accepted only when the driver has no rental in reserved, active or return_due status and no unpaid balance on an earlier rental (unpaid_balance_new_rental_block)."
        evidence_fields: [rental_agreements.customer_id, rental_agreements.status, rental_agreements.balance_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[rental_agreements.customer_id]]
          action_bindings: {rental_agreements.customer_id: customer_id}
        dedup_contract:
          table: rental_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [reserved, active, return_due]}
          distinct_fields: [reserved_date]
    params:
      max_per_customer: 1
      max_active_rentals: "=max_active_rentals"
      unpaid_balance_new_rental_block: "=unpaid_balance_new_rental_block"

  - id: rental_eligibility_and_pickup
    subject: [rental_reserve, rental_pickup, rental_reservation_cancel, rental_vehicle_swap]
    rule: >-
      A vehicle class can be reserved only by a driver whose driver services agreement is active and of a level listed in the class's entry gate, at the hub serving the driver's market (hubs_by_market).
      A reservation is held reservation_hold_days for pickup and then lapses; reservations cost reservation_fee and may be cancelled free by the driver before pickup.
      At pickup the deposit and the first weekly charge are booked (first_week_charge_timing); a swap at the hub keeps the same rental and week (vehicle_swap_basis).
    eligibility:
      - id: active_eligible_agreement
        applies_to: [rental_reserve]
        kind: authorization
        condition: "A vehicle class can be reserved only by a driver whose driver services agreement is active and of a level listed in the class's entry gate, at the hub serving the driver's market (hubs_by_market)."
        evidence_fields: [driver_agreements.status, driver_agreements.variant_name, driver_agreements.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
    params:
      reservation_hold_days: "=reservation_hold_days"
      reservation_fee: "=reservation_fee"
      hubs_by_market: "=hubs_by_market"
      first_week_charge_timing: "=first_week_charge_timing"
      vehicle_swap_basis: "=vehicle_swap_basis"

  - id: rental_evt_weekly_charge_and_rebate
    subject: [rental_weekly_charge, rental_ride_rebate]
    rule: >-
      A weekly charge of the class's weekly_rate is booked on the first day of each rental week while the vehicle is out (rental_week_basis, auto_renew_weekly); nothing is refunded for a week cut short (partial_week_refund).
      At the end of each week a rebate is credited by the trips completed that week (rental_msr_week_trips, ride_rebate_basis): the highest step of the class's ride_rebate_ladder reached applies, and steps never add up.
      The rental includes maintenance, insurance and roadside assistance as listed (maintenance_included, insurance_included, roadside_assistance_included), which are never charged separately.
    eligibility: []
    params:
      rental_week_basis: "=rental_week_basis"
      auto_renew_weekly: "=auto_renew_weekly"
      partial_week_refund: "=partial_week_refund"
      ride_rebate_basis: "=ride_rebate_basis"
      maintenance_included: "=maintenance_included"
      insurance_included: "=insurance_included"
      roadside_assistance_included: "=roadside_assistance_included"
      min_rental_weeks: "=min_rental_weeks"
      early_return_fee: "=early_return_fee"
      per_tier:
        "Wayfare Rentals Economy Sedan": {weekly_rate: "=weekly_rate", ride_rebate_ladder: "=ride_rebate_ladder"}
        "Wayfare Rentals Hybrid Sedan": {weekly_rate: "=weekly_rate", ride_rebate_ladder: "=ride_rebate_ladder"}
        "Wayfare Rentals Electric Sedan": {weekly_rate: "=weekly_rate", ride_rebate_ladder: "=ride_rebate_ladder"}
        "Wayfare Rentals Midsize SUV": {weekly_rate: "=weekly_rate", ride_rebate_ladder: "=ride_rebate_ladder"}
        "Wayfare Rentals Minivan": {weekly_rate: "=weekly_rate", ride_rebate_ladder: "=ride_rebate_ladder"}
        "Wayfare Rentals Premium Sedan": {weekly_rate: "=weekly_rate", ride_rebate_ladder: "=ride_rebate_ladder"}
    measures: [rental_msr_week_trips]

  - id: rental_evt_mileage
    subject: [rental_mileage_overage]
    rule: >-
      Miles driven in a rental week above included_miles_per_week are charged at mileage_overage_rate per mile (mileage_basis); unused miles never carry over.
      Personal use is allowed within the allowance (personal_use_allowed), the vehicle may not leave the hub's state (out_of_state_allowed) and only the renter may drive it (additional_drivers_allowed).
    eligibility: []
    params:
      mileage_basis: "=mileage_basis"
      personal_use_allowed: "=personal_use_allowed"
      out_of_state_allowed: "=out_of_state_allowed"
      additional_drivers_allowed: "=additional_drivers_allowed"
      per_tier:
        "Wayfare Rentals Economy Sedan": {included_miles_per_week: "=included_miles_per_week", mileage_overage_rate: "=mileage_overage_rate"}
        "Wayfare Rentals Hybrid Sedan": {included_miles_per_week: "=included_miles_per_week", mileage_overage_rate: "=mileage_overage_rate"}
        "Wayfare Rentals Electric Sedan": {included_miles_per_week: "=included_miles_per_week", mileage_overage_rate: "=mileage_overage_rate"}
        "Wayfare Rentals Midsize SUV": {included_miles_per_week: "=included_miles_per_week", mileage_overage_rate: "=mileage_overage_rate"}
        "Wayfare Rentals Minivan": {included_miles_per_week: "=included_miles_per_week", mileage_overage_rate: "=mileage_overage_rate"}
        "Wayfare Rentals Premium Sedan": {included_miles_per_week: "=included_miles_per_week", mileage_overage_rate: "=mileage_overage_rate"}
    formula:
      amount: "round(miles_over * mileage_overage_rate, 2)"

  - id: rental_evt_damage_and_tolls
    subject: [rental_damage_charge, rental_toll_charge]
    rule: >-
      Damage found at return or reported during the rental is charged by damage_charge_schedule, with major_collision charged at the damage_deductible, and no single incident ever charges more than the class's damage_deductible; normal wear is never charged (normal_wear_exempt), and smoke damage is charged as interior damage (smoking_allowed).
      The renter may dispute a damage charge within damage_dispute_window_days of its charge date.
      Tolls are passed through at cost with no administration fee (toll_passthrough, toll_schedule_reference).
    eligibility: []
    params:
      damage_charge_schedule: "=damage_charge_schedule"
      damage_dispute_window_days: "=damage_dispute_window_days"
      normal_wear_exempt: "=normal_wear_exempt"
      smoking_allowed: "=smoking_allowed"
      toll_passthrough: "=toll_passthrough"
      toll_schedule_reference: "=toll_schedule_reference"
      per_tier:
        "Wayfare Rentals Economy Sedan": {damage_deductible: "=damage_deductible", pet_allowed: "=pet_allowed"}
        "Wayfare Rentals Hybrid Sedan": {damage_deductible: "=damage_deductible", pet_allowed: "=pet_allowed"}
        "Wayfare Rentals Electric Sedan": {damage_deductible: "=damage_deductible", pet_allowed: "=pet_allowed"}
        "Wayfare Rentals Midsize SUV": {damage_deductible: "=damage_deductible", pet_allowed: "=pet_allowed"}
        "Wayfare Rentals Minivan": {damage_deductible: "=damage_deductible", pet_allowed: "=pet_allowed"}
        "Wayfare Rentals Premium Sedan": {damage_deductible: "=damage_deductible", pet_allowed: "=pet_allowed"}

  - id: rental_evt_payment
    subject: [rental_earnings_payment, rental_card_payment]
    rule: >-
      Each charge is paid in payment_order: from the driver's earnings at the weekly deduction, as far as the available balance allows, and the rest by the card on file the day after (card_charge_timing).
      A payment always names the charge it pays, and the payments on a charge never exceed it.
      Charging at Wayfare hub chargers is included for the Electric Sedan (ev_charging_included).
    eligibility: []
    params:
      payment_order: "=payment_order"
      card_charge_timing: "=card_charge_timing"
      per_tier:
        "Wayfare Rentals Economy Sedan": {ev_charging_included: "=ev_charging_included"}
        "Wayfare Rentals Hybrid Sedan": {ev_charging_included: "=ev_charging_included"}
        "Wayfare Rentals Electric Sedan": {ev_charging_included: "=ev_charging_included"}
        "Wayfare Rentals Midsize SUV": {ev_charging_included: "=ev_charging_included"}
        "Wayfare Rentals Minivan": {ev_charging_included: "=ev_charging_included"}
        "Wayfare Rentals Premium Sedan": {ev_charging_included: "=ev_charging_included"}

  - id: rental_deposit_rules
    subject: [rental_deposit_hold, rental_deposit_release, rental_deposit_applied, rental_balance_offset]
    rule: >-
      The class's security_deposit is held at pickup.
      The deposit is applied or released only after the vehicle is returned: first to any unpaid charge, oldest first (deposit_application_order), each application clearing that charge by the same amount, and the rest released within deposit_release_days of the return date.
    eligibility:
      - id: returned_vehicle
        applies_to: [rental_deposit_release, rental_deposit_applied]
        kind: state
        condition: "The deposit is applied or released only after the vehicle is returned: first to any unpaid charge, oldest first (deposit_application_order), each application clearing that charge by the same amount, and the rest released within deposit_release_days of the return date."
        evidence_fields: [rental_agreements.status, rental_agreements.rental_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[rental_agreements.rental_agreement_id]]
          action_bindings: {rental_agreements.rental_agreement_id: rental_agreement_id}
        state_contract:
          field: rental_agreements.status
          allowed: [returned, closed]
    params:
      deposit_release_days: "=deposit_release_days"
      deposit_application_order: "=deposit_application_order"
      per_tier:
        "Wayfare Rentals Economy Sedan": {security_deposit: "=security_deposit"}
        "Wayfare Rentals Hybrid Sedan": {security_deposit: "=security_deposit"}
        "Wayfare Rentals Electric Sedan": {security_deposit: "=security_deposit"}
        "Wayfare Rentals Midsize SUV": {security_deposit: "=security_deposit"}
        "Wayfare Rentals Minivan": {security_deposit: "=security_deposit"}
        "Wayfare Rentals Premium Sedan": {security_deposit: "=security_deposit"}

  - id: rental_return_rules
    subject: [rental_return_require, rental_vehicle_return, rental_close, rental_late_return_fee]
    rule: >-
      A return is required when the linked driver services agreement is deactivated or closed (return due return_after_deactivation_hours after that), or when balance_due has stayed above past_due_return_threshold for past_due_return_days (rental_msr_unpaid_days; return due return_notice_to_due_hours after the requirement).
      Returning the vehicle is the driver's own act; the driver may return it at any time without an early return fee, and an after-hours drop-box return counts at the hub's next opening (after_hours_return_basis).
      A late return fee is charged only on a rental with a required return: one late_return_daily_fee per started day beyond return_due_date plus late_return_grace_hours.
      The rental closes after the return inspection (return_inspection_required).
    eligibility:
      - id: required_return
        applies_to: [rental_late_return_fee]
        kind: state
        condition: "A late return fee is charged only on a rental with a required return: one late_return_daily_fee per started day beyond return_due_date plus late_return_grace_hours."
        evidence_fields: [rental_agreements.status, rental_agreements.rental_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[rental_agreements.rental_agreement_id]]
          action_bindings: {rental_agreements.rental_agreement_id: rental_agreement_id}
        state_contract:
          field: rental_agreements.status
          allowed: [return_due, returned]
    params:
      return_after_deactivation_hours: "=return_after_deactivation_hours"
      past_due_return_threshold: "=past_due_return_threshold"
      past_due_return_days: "=past_due_return_days"
      return_notice_to_due_hours: "=return_notice_to_due_hours"
      late_return_grace_hours: "=late_return_grace_hours"
      after_hours_return_allowed: "=after_hours_return_allowed"
      after_hours_return_basis: "=after_hours_return_basis"
      return_inspection_required: "=return_inspection_required"
      per_tier:
        "Wayfare Rentals Economy Sedan": {late_return_daily_fee: "=late_return_daily_fee"}
        "Wayfare Rentals Hybrid Sedan": {late_return_daily_fee: "=late_return_daily_fee"}
        "Wayfare Rentals Electric Sedan": {late_return_daily_fee: "=late_return_daily_fee"}
        "Wayfare Rentals Midsize SUV": {late_return_daily_fee: "=late_return_daily_fee"}
        "Wayfare Rentals Minivan": {late_return_daily_fee: "=late_return_daily_fee"}
        "Wayfare Rentals Premium Sedan": {late_return_daily_fee: "=late_return_daily_fee"}
    measures: [rental_msr_unpaid_days]
