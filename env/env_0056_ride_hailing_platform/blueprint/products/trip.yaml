# Wayfare rider trips: the ride options a rider books, and everything charged, waived, adjusted or
# refunded on each trip. One holding = one trip (a short-lived contract between the rider and
# Wayfare for one ride option); a rider accumulates many trips over time.
category: trip
display_name: Wayfare Rides (rider trips and fares)

binding:
  holding_table: trips
  event_tables: [trip_charges]
  intake_tables: [trip_fare_reviews]
  status_field: status
  variant_field: variant_name
  quantity_fields: {net_charged: rider_charges, outstanding_amount: outstanding_balance}

lifecycle:
  states: [requested, scheduled, accepted, driver_arrived, in_progress, completed, rider_cancelled, driver_cancelled, rider_no_show, unfulfilled]
  transitions:
    - {from: requested, to: accepted, by: system, means: "A driver accepts an on-demand request in the driver app."}
    - {from: scheduled, to: accepted, by: system, means: "A driver confirms a reserved trip ahead of the reserved pickup time."}
    - {from: accepted, to: driver_arrived, by: system, means: "The driver marks arrival at the pickup point."}
    - {from: driver_arrived, to: in_progress, by: system, means: "The rider is picked up and the driver starts the trip."}
    - {from: in_progress, to: completed, by: system, means: "The driver ends the trip at drop-off; the fare is charged."}
    - {from: requested, to: rider_cancelled, by: user, means: "The rider cancels an on-demand request before any driver accepts."}
    - {from: scheduled, to: rider_cancelled, by: user, means: "The rider cancels a reserved trip before a driver confirms it."}
    - {from: accepted, to: rider_cancelled, by: user, means: "The rider cancels after a driver accepted and before the driver arrived."}
    - {from: driver_arrived, to: rider_cancelled, by: user, means: "The rider cancels after the driver arrived and before pickup."}
    - {from: accepted, to: driver_cancelled, by: system, means: "The driver cancels the accepted trip before arriving."}
    - {from: driver_arrived, to: driver_cancelled, by: system, means: "The driver cancels after arriving, before the no-show wait has run out."}
    - {from: driver_arrived, to: rider_no_show, by: system, means: "The driver marks the rider as a no-show once the no-show wait has run out; the app does not offer the button earlier."}
    - {from: requested, to: unfulfilled, by: system, means: "No driver accepted the on-demand request within the dispatch timeout."}
    - {from: scheduled, to: unfulfilled, by: system, means: "No driver was confirmed for a reserved trip by the reserved dispatch cutoff."}

accounts:
  - key: rider_charges
    unit: USD
    meaning: "Everything charged to the rider on one trip (fare, reservation fee, wait time, tolls, airport fee, Priority Pickup, cancellation or no-show fee, tip) less fare adjustments and refunds."
  - key: outstanding_balance
    unit: USD
    meaning: "Amounts on one trip that failed to collect from the rider's payment method and remain unpaid."

parameter_schema:
  base_fare: "Fixed amount added to every time-and-distance fare before the busy-time multiplier, USD"
  per_mile_rate: "Charge per mile driven from pickup to drop-off, USD per mile"
  per_minute_rate: "Charge per minute from pickup to drop-off, USD per minute"
  booking_fee: "Flat booking fee added to every completed fare, never multiplied by the busy-time multiplier, USD"
  minimum_fare: "Lowest fare charged for a completed trip, compared against the time-and-distance fare after the multiplier and option surcharge and before the booking fee, USD"
  option_surcharge: "Flat per-trip surcharge of the ride option (Green: zero-emission vehicle surcharge), added after the multiplier, USD"
  second_seat_surcharge: "Surcharge when a Shared request is for 2 seats instead of 1, added after the multiplier, USD; 0.00 where not applicable"
  surge_applies_to: "Fare components the busy-time multiplier multiplies (list)"
  upfront_recalc_threshold_pct: "The upfront fare stands unless the rider changed the route or the actual miles or the actual minutes exceed the estimate by more than this percentage, percent"
  max_seats_requestable: "Most seats one request may be for, seats"
  free_wait_minutes: "Minutes after the driver's arrival before wait time is billed on an on-demand trip, minutes"
  wait_rate_per_minute: "Charge per billable wait minute, USD per minute"
  wait_time_rounding: "How billable wait time is counted (whole elapsed minutes only, partial minutes dropped)"
  max_wait_before_no_show_minutes: "Minutes the driver must wait after arrival on an on-demand trip before a no-show may be marked, minutes"
  cancellation_grace_minutes: "Minutes after a driver accepts an on-demand trip during which the rider may cancel without a fee, minutes"
  cancellation_fee: "Fee for a rider cancellation of an on-demand trip after the grace period, USD"
  no_show_fee: "Fee when the driver marks an on-demand rider as a no-show, USD"
  eta_delay_waiver_minutes: "No cancellation fee if the rider cancels while the driver has not arrived and more than this many minutes have passed beyond the original pickup estimate, minutes"
  reservation_available: "Whether the ride option can be booked ahead through Wayfare Reserve (true/false)"
  reservation_fee: "Reservation fee charged when a reserved trip is booked, USD; 0.00 where reservations are not offered"
  reservation_min_lead_minutes: "Shortest time between booking and the reserved pickup time, minutes; 0 where not offered"
  reservation_max_days_ahead: "Furthest ahead a pickup may be reserved, calendar days; 0 where not offered"
  reserved_free_cancel_minutes: "A reserved trip may be cancelled free at least this many minutes before the reserved pickup time, minutes; 0 where not offered"
  reserved_late_cancellation_fee: "Fee for cancelling a reserved trip inside the free-cancel cutoff, USD; 0.00 where not offered"
  reserved_no_show_fee: "Fee when a reserved rider is marked a no-show, USD; 0.00 where not offered"
  reserved_free_wait_minutes: "Free wait on a reserved non-airport pickup, counted from the later of the reserved pickup time and the driver's arrival, minutes"
  reserved_airport_free_wait_minutes: "Free wait on a reserved airport pickup, counted the same way, minutes"
  reserved_driver_late_minutes: "If the driver of a reserved trip has not arrived this many minutes after the reserved pickup time, the rider may cancel free and the reservation fee is refunded, minutes"
  reservation_fee_refund_if_unfulfilled: "Whether the reservation fee is refunded when no driver is found for a reserved trip (true/false)"
  dispatch_timeout_minutes: "An on-demand request no driver accepts within this many minutes is closed as unfulfilled, minutes"
  reserved_dispatch_cutoff_minutes: "A reserved trip with no driver confirmed this many minutes after the reserved pickup time is closed as unfulfilled, minutes; 0 where not offered"
  priority_pickup_available: "Whether Priority Pickup can be added to the request (true/false)"
  priority_pickup_fee: "Charge for Priority Pickup, USD; 0.00 where not offered"
  airport_surcharge_schedule: "Airport access fee passed through to the rider per qualifying airport trip, by airport code, USD (mapping)"
  airport_surcharge_legs: "Which trip ends each airport charges its access fee on, by airport code (mapping of lists)"
  toll_schedule: "Toll passed through to the rider per crossing of each toll facility, by facility, USD (mapping)"
  toll_basis: "Tolls are charged only for facilities actually crossed between pickup and drop-off (one charge per facility per trip)"
  tip_window_days: "Calendar days after drop-off during which the rider may add a tip"
  tip_max_amount: "Largest single tip accepted on one trip, USD"
  fare_review_window_days: "Calendar days after the charge date of a charge during which the rider may ask for it to be adjusted or refunded"
  agent_adjustment_limit: "Largest total amount support may adjust or refund on one trip without the fare review team, USD"
  adjustment_excludes_booking_fee: "Whether the booking fee stays charged when a fare is reduced for route inefficiency or a wrong drop-off (true/false)"
  courtesy_refunds_per_window: "Most courtesy refunds of a cancellation or no-show fee per rider in the courtesy lookback window, count"
  courtesy_lookback_days: "Length of the rolling courtesy lookback window, calendar days including the current day"
  payment_retry_attempts: "Automatic retries of a failed trip payment before the amount is left outstanding, count"
  payment_retry_interval_hours: "Hours between automatic payment retries, hours"
  outstanding_balance_blocks_requests: "Whether a rider with any unpaid trip amount may not request or reserve a new trip until it is settled (true/false)"
  max_concurrent_on_demand: "Most on-demand trips one rider may have open (requested, accepted, driver arrived or in progress) at once, count"
  max_open_reservations: "Most reserved trips one rider may hold in scheduled or accepted status at once, count"
  rounding_rule: "Every computed rider amount is rounded half up to the cent once, at the end of its computation"

