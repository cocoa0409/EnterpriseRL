events:
- type: damage_report
  target: damage_assessments
  mutation: create
  meaning: A driver reports a mess or damage left on a trip, opening an assessment against the trip's requesting rider.
  grain: One row per report.
  fields:
    customer_id: Requesting rider of the trip.
    variant_name: Level the driver reported.
    trip_id: Trip concerned.
    driver_customer_id: Reporting driver.
    driver_agreement_id: Reporting driver's agreement.
    reported_at: Moment of the report.
    incident_category: What was reported.
    photo_count: Photos submitted with the report.
    repair_receipt_amount: Receipt total submitted with the report, or 0.00.
  triggers: []
- type: damage_review_open
  target: damage_assessments
  mutation:
    transition:
      from: reported
      to: under_review
  meaning: The minimum evidence is on file and the report enters review.
  grain: One write per assessment.
  fields:
    photo_count: Photos on file.
  triggers: []
- type: damage_deny
  target: damage_assessments
  mutation:
    transition:
    - from: reported
      to: denied
    - from: under_review
      to: denied
  meaning: The report is denied and nothing is charged.
  grain: One write per denial.
  fields:
    closed_date: Date denied.
  triggers: []
- type: damage_reconsider
  target: damage_assessments
  mutation:
    transition:
      from: denied
      to: under_review
  meaning: A denied report is reopened for review on the driver's request with new evidence.
  grain: One write per reconsideration.
  fields:
    closed_date: Cleared.
  triggers: []
- type: damage_approve_charge
  target: damage_assessments
  mutation:
    transition:
      from: under_review
      to: charged
  meaning: Review approves the fee at the level held and it is charged to the rider.
  grain: One write per assessment.
  fields:
    assessed_fee: Fee approved.
    charged_date: Date charged.
  triggers:
  - event: damage:damage_fee_charge
    map:
      amount: assessed_fee
      event_date: charged_date
- type: damage_dispute
  target: damage_assessments
  mutation:
    transition:
      from: charged
      to: disputed
  meaning: The rider disputes the fee.
  grain: One write per assessment.
  fields:
    dispute_filed_date: Date disputed.
  triggers: []
- type: damage_uphold
  target: damage_assessments
  mutation:
    transition:
      from: disputed
      to: upheld
  meaning: The dispute is decided and the fee stands.
  grain: One write per assessment.
  fields:
    closed_date: Date decided.
  triggers: []
- type: damage_reverse
  target: damage_assessments
  mutation:
    transition:
    - from: disputed
      to: reversed
    - from: charged
      to: reversed
  meaning: The fee is reversed and refunded in full.
  grain: One write per assessment.
  fields:
    closed_date: Date reversed.
    assessed_fee: Set to 0.00.
  triggers:
  - event: damage:damage_fee_refund
    map:
      event_date: closed_date
- type: damage_reclassify
  target: damage_assessments
  mutation: update
  meaning: A reviewer moves the assessment to a lower level the evidence supports.
  grain: One write per reclassification.
  fields:
    variant_name: New, lower level.
    assessed_fee: Fee at the new level.
  triggers: []
- type: damage_evidence_update
  target: damage_assessments
  mutation: update
  meaning: The evidence totals on the assessment are brought up to date after a submission.
  grain: One write per evidence submission.
  fields:
    photo_count: Photos now on file.
    repair_receipt_amount: Receipt total now on file.
  triggers: []
- type: damage_evidence_submit
  target: damage_events
  meaning: The driver submits photos or a receipt or estimate for a report.
  grain: One row per submission of one evidence type.
  distinguish_by:
  - recorded_at
  - evidence_type
  fields:
    damage_assessment_id: Assessment the evidence is for.
    event_date: Date submitted.
    recorded_at: Moment submitted.
    amount: 0.00.
    evidence_type: photo_set, cleaning_receipt, repair_receipt or repair_estimate.
    evidence_count: Photos or documents in the submission.
    fee_level: Level held when submitted.
  triggers:
  - event: damage:damage_evidence_update
    map: {}
- type: damage_fee_charge
  target: damage_events
  meaning: The approved fee is charged to the rider.
  grain: One row per assessment (an assessment is charged once).
  distinguish_by:
  - damage_assessment_id
  fields:
    damage_assessment_id: Assessment charged.
    event_date: Date charged.
    recorded_at: Moment charged.
    amount: Fee charged (positive).
    fee_level: Level charged.
  account: fee_billed
  direction: in
  triggers:
  - event: earnings:earnings_cleaning_credit
    map:
      damage_assessment_id: damage_assessment_id
- type: damage_fee_refund
  target: damage_events
  meaning: The whole remaining fee is refunded to the rider.
  grain: One row per fee charge refunded in full.
  distinguish_by:
  - original_event_id
  fields:
    damage_assessment_id: Assessment refunded.
    event_date: Date refunded.
    recorded_at: Moment refunded.
    amount: 'Amount returned (negative): the fee charged less any partial refund already made.'
    fee_level: Level held when refunded.
    original_event_id: The fee charge refunded.
    refund_reason: service_animal_shedding, insufficient_evidence, wrong_rider, duplicate_report, filed_outside_window or courtesy_first_incident.
  account: fee_billed
  direction: out
  triggers:
  - event: earnings:earnings_adjustment_debit
    when:
      refund_reason:
        not: courtesy_first_incident
    map:
      damage_assessment_id: damage_assessment_id
      adjustment_reason: cleaning_fee_reversal
- type: damage_fee_partial_refund
  target: damage_events
  meaning: Part of the fee is refunded because the assessment was moved to a lower level after it was charged.
  grain: One row per reclassification after charge.
  distinguish_by:
  - original_event_id
  - fee_level
  fields:
    damage_assessment_id: Assessment refunded.
    event_date: Date refunded.
    recorded_at: Moment refunded.
    amount: Difference returned (negative).
    fee_level: Lower level the fee was reduced to.
    original_event_id: The fee charge partly refunded.
    refund_reason: level_reclassified.
  account: fee_billed
  direction: out
  triggers:
  - event: earnings:earnings_adjustment_debit
    map:
      damage_assessment_id: damage_assessment_id
      adjustment_reason: cleaning_fee_reversal
measures:
- id: damage_msr_rider_prior_charged
  window: courtesy_lookback_days calendar days ending on the day before the trip of the assessment in question.
  measure: Count of the rider's other assessments (same customer_id) with a charged_date in the window whose status is charged, disputed or upheld.
- id: damage_msr_driver_reports_window
  window: driver_report_lookback_days calendar days ending on the report date, both ends inclusive.
  measure: Count of assessments with the same driver_customer_id whose reported_at falls in the window, the report in question included.
- id: damage_msr_evidence_submissions
  window: Life of one assessment.
  measure: Count of damage_evidence_submit rows on the assessment.
- id: damage_msr_refunded_so_far
  window: Life of one assessment.
  measure: Absolute sum of damage_fee_refund and damage_fee_partial_refund amounts on the assessment.
policies:
- id: damage_agg_multi_holding
  subject:
  - damage_report
  rule: A rider may have any number of assessments over time, but a trip carries at most max_assessments_per_trip assessment. A report is accepted only when the trip has no other assessment in reported, under_review, charged, disputed, upheld or reversed status; when an earlier report on the trip was denied, a new report is not opened and the driver uses reconsideration of the denied one instead. A mess and damage found on the same trip are reported as one assessment at the higher level that the evidence supports.
  eligibility:
  - id: one_assessment_per_trip
    applies_to:
    - damage_report
    kind: dedup
    condition: A report is accepted only when the trip has no other assessment in reported, under_review, charged, disputed, upheld or reversed status; when an earlier report on the trip was denied, a new report is not opened and the driver uses reconsideration of the denied one instead.
    evidence_fields:
    - damage_assessments.trip_id
    - damage_assessments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.trip_id
      action_bindings:
        damage_assessments.trip_id: trip_id
    dedup_contract:
      table: damage_assessments
      mode: separate_record
      object_bindings:
        trip_id: trip_id
      duplicate_filters:
        status:
        - reported
        - under_review
        - denied
        - charged
        - disputed
        - upheld
        - reversed
      distinct_fields:
      - reported_at
  params:
    max_per_customer: null
    max_assessments_per_trip: =max_assessments_per_trip
- id: damage_agg_driver_report_volume
  subject:
  - damage_report
  - damage_approve_charge
  rule: 'Reports are counted per driver across all riders and trips (damage_msr_driver_reports_window). When a report brings the driver''s count to driver_report_review_threshold or more, support may not approve it: it stays with Trust and Safety, and the only support action is a POLICY_NOT_COVERED handoff. Below the threshold, reports are reviewed by support in the usual way.'
  eligibility:
  - id: below_report_threshold
    applies_to:
    - damage_approve_charge
    kind: authorization
    condition: 'When a report brings the driver''s count to driver_report_review_threshold or more, support may not approve it: it stays with Trust and Safety, and the only support action is a POLICY_NOT_COVERED handoff.'
    evidence_fields:
    - damage_assessments.driver_customer_id
    - damage_assessments.reported_at
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.driver_customer_id
      action_bindings:
        damage_assessments.driver_customer_id: driver_customer_id
  params:
    driver_report_review_threshold: =driver_report_review_threshold
    driver_report_lookback_days: =driver_report_lookback_days
  measures:
  - damage_msr_driver_reports_window
- id: damage_filing_and_evidence
  subject:
  - damage_report
  - damage_review_open
  - damage_evidence_submit
  - damage_evidence_update
  rule: 'A report can be made only on a completed trip. A report must be made within the filing window: The filing window is counted in elapsed hours from the trip''s drop-off moment, and the report must be registered no later than filing_window_hours full hours after it. The driver reports through the driver app or driver support (report_channels) and may submit evidence up to max_evidence_submissions times per report; evidence is accepted only while the assessment is reported, under_review or denied. The report enters review only when it has at least min_photos photos and, for levels with receipt_required true, a document of a type in receipt_types_accepted; photos must show photo_subjects_required. When the minimum evidence is not on file evidence_deadline_hours after reported_at, the report is denied (evidence_deadline_missed). A report that mentions an injury to anyone is never handled as a fee and goes to Trust and Safety (injury_route).'
  eligibility:
  - id: completed_trip
    applies_to:
    - damage_report
    kind: state
    condition: A report can be made only on a completed trip.
    evidence_fields:
    - trips.status
    - trips.trip_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trips.trip_id
      action_bindings:
        trips.trip_id: trip_id
    state_contract:
      field: trips.status
      allowed:
      - completed
  - id: within_filing_window
    applies_to:
    - damage_report
    kind: time
    condition: 'A report must be made within the filing window: The filing window is counted in elapsed hours from the trip''s drop-off moment, and the report must be registered no later than filing_window_hours full hours after it.'
    evidence_fields:
    - trips.dropoff_at
    - trips.trip_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trips.trip_id
      action_bindings:
        trips.trip_id: trip_id
    temporal_basis:
      clock: frozen_time
      anchor_event: trip's drop-off moment
      anchor_source: trips.dropoff_at
      relation: not_after
      duration_source: variants.filing_window_hours
      unit: elapsed_hours
      counting_rule: The filing window is counted in elapsed hours from the trip's drop-off moment, and the report must be registered no later than filing_window_hours full hours after it.
      boundary: inclusive
  - id: evidence_open_status
    applies_to:
    - damage_evidence_submit
    kind: state
    condition: The driver reports through the driver app or driver support (report_channels) and may submit evidence up to max_evidence_submissions times per report; evidence is accepted only while the assessment is reported, under_review or denied.
    evidence_fields:
    - damage_assessments.status
    - damage_assessments.damage_assessment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.damage_assessment_id
      action_bindings:
        damage_assessments.damage_assessment_id: damage_assessment_id
    state_contract:
      field: damage_assessments.status
      allowed:
      - reported
      - under_review
      - denied
  params:
    report_channels: =report_channels
    injury_route: =injury_route
    per_tier:
      Cleaning Fee Level 1 (Minor):
        filing_window_hours: =filing_window_hours
        evidence_deadline_hours: =evidence_deadline_hours
        min_photos: =min_photos
        receipt_required: =receipt_required
        receipt_types_accepted: =receipt_types_accepted
        max_evidence_submissions: =max_evidence_submissions
        photo_subjects_required: =photo_subjects_required
      Cleaning Fee Level 2 (Moderate):
        filing_window_hours: =filing_window_hours
        evidence_deadline_hours: =evidence_deadline_hours
        min_photos: =min_photos
        receipt_required: =receipt_required
        receipt_types_accepted: =receipt_types_accepted
        max_evidence_submissions: =max_evidence_submissions
        photo_subjects_required: =photo_subjects_required
      Cleaning Fee Level 3 (Significant):
        filing_window_hours: =filing_window_hours
        evidence_deadline_hours: =evidence_deadline_hours
        min_photos: =min_photos
        receipt_required: =receipt_required
        receipt_types_accepted: =receipt_types_accepted
        max_evidence_submissions: =max_evidence_submissions
        photo_subjects_required: =photo_subjects_required
      Cleaning Fee Level 4 (Major):
        filing_window_hours: =filing_window_hours
        evidence_deadline_hours: =evidence_deadline_hours
        min_photos: =min_photos
        receipt_required: =receipt_required
        receipt_types_accepted: =receipt_types_accepted
        max_evidence_submissions: =max_evidence_submissions
        photo_subjects_required: =photo_subjects_required
      Damage Fee (Interior Repair):
        filing_window_hours: =filing_window_hours
        evidence_deadline_hours: =evidence_deadline_hours
        min_photos: =min_photos
        receipt_required: =receipt_required
        receipt_types_accepted: =receipt_types_accepted
        max_evidence_submissions: =max_evidence_submissions
        photo_subjects_required: =photo_subjects_required
      Damage Fee (Exterior Repair):
        filing_window_hours: =filing_window_hours
        evidence_deadline_hours: =evidence_deadline_hours
        min_photos: =min_photos
        receipt_required: =receipt_required
        receipt_types_accepted: =receipt_types_accepted
        max_evidence_submissions: =max_evidence_submissions
        photo_subjects_required: =photo_subjects_required
  measures:
  - damage_msr_evidence_submissions
- id: damage_level_classification
  subject:
  - damage_report
  - damage_reclassify
  rule: Each level covers the incidents its level_definition, surfaces_affected, vehicle_offline_expected, professional_cleaning_required and odor_treatment_included describe (level_examples are typical cases), and only the incident categories listed in its entry gate. A report is held at the lowest level whose definition matches the evidence on file; when the evidence matches a lower level than the one reported, the reviewer moves it down (reclassification_direction) and never up. The non_chargeable_conditions are not chargeable at any level, and a report consisting only of them is denied (non_chargeable_condition).
  eligibility: []
  params:
    non_chargeable_conditions: =non_chargeable_conditions
    reclassification_allowed: =reclassification_allowed
    reclassification_direction: =reclassification_direction
    per_tier:
      Cleaning Fee Level 1 (Minor):
        level_definition: =level_definition
        surfaces_affected: =surfaces_affected
        vehicle_offline_expected: =vehicle_offline_expected
        professional_cleaning_required: =professional_cleaning_required
        odor_treatment_included: =odor_treatment_included
        level_examples: =level_examples
      Cleaning Fee Level 2 (Moderate):
        level_definition: =level_definition
        surfaces_affected: =surfaces_affected
        vehicle_offline_expected: =vehicle_offline_expected
        professional_cleaning_required: =professional_cleaning_required
        odor_treatment_included: =odor_treatment_included
        level_examples: =level_examples
      Cleaning Fee Level 3 (Significant):
        level_definition: =level_definition
        surfaces_affected: =surfaces_affected
        vehicle_offline_expected: =vehicle_offline_expected
        professional_cleaning_required: =professional_cleaning_required
        odor_treatment_included: =odor_treatment_included
        level_examples: =level_examples
      Cleaning Fee Level 4 (Major):
        level_definition: =level_definition
        surfaces_affected: =surfaces_affected
        vehicle_offline_expected: =vehicle_offline_expected
        professional_cleaning_required: =professional_cleaning_required
        odor_treatment_included: =odor_treatment_included
        level_examples: =level_examples
      Damage Fee (Interior Repair):
        level_definition: =level_definition
        surfaces_affected: =surfaces_affected
        vehicle_offline_expected: =vehicle_offline_expected
        professional_cleaning_required: =professional_cleaning_required
        odor_treatment_included: =odor_treatment_included
        level_examples: =level_examples
      Damage Fee (Exterior Repair):
        level_definition: =level_definition
        surfaces_affected: =surfaces_affected
        vehicle_offline_expected: =vehicle_offline_expected
        professional_cleaning_required: =professional_cleaning_required
        odor_treatment_included: =odor_treatment_included
        level_examples: =level_examples
- id: damage_evt_fee_charge
  subject:
  - damage_fee_charge
  - damage_approve_charge
  rule: A fee is charged only on an assessment approved at review, once, on approval (charge_timing). At a flat level the fee is the level's flat_fee; at a receipt-based level it is the receipt or estimate amount on file (estimate_settles_fee), capped at receipt_fee_cap, and a receipt below receipt_min_amount is denied (below_receipt_minimum); the part of a repair above the cap is never charged to the rider and the driver is referred to the insurance claim desk (excess_damage_route) through a POLICY_NOT_COVERED handoff. The fee is charged in full to the rider who requested the trip (fee_payer_basis), including for companions, and is never split (split_fare_allocation). Support may not approve a fee on a Wayfare Shared trip (shared_trip_assessable); those reports go to Trust and Safety. A fee that fails to collect stays on the assessment (unpaid_fee_handling).
  eligibility:
  - id: approved_assessment
    applies_to:
    - damage_fee_charge
    kind: state
    condition: A fee is charged only on an assessment approved at review, once, on approval (charge_timing).
    evidence_fields:
    - damage_assessments.status
    - damage_assessments.damage_assessment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.damage_assessment_id
      action_bindings:
        damage_assessments.damage_assessment_id: damage_assessment_id
    state_contract:
      field: damage_assessments.status
      allowed:
      - charged
  - id: not_shared_trip
    applies_to:
    - damage_approve_charge
    kind: authorization
    condition: Support may not approve a fee on a Wayfare Shared trip (shared_trip_assessable); those reports go to Trust and Safety.
    evidence_fields:
    - trips.variant_name
    - trips.trip_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - trips.trip_id
      action_bindings:
        trips.trip_id: trip_id
  params:
    charge_timing: =charge_timing
    excess_damage_route: =excess_damage_route
    fee_payer_basis: =fee_payer_basis
    split_fare_allocation: =split_fare_allocation
    shared_trip_assessable: =shared_trip_assessable
    unpaid_fee_handling: =unpaid_fee_handling
    rounding_rule: =rounding_rule
    per_tier:
      Cleaning Fee Level 1 (Minor):
        fee_basis: =fee_basis
        flat_fee: =flat_fee
        receipt_fee_cap: =receipt_fee_cap
        receipt_min_amount: =receipt_min_amount
        estimate_settles_fee: =estimate_settles_fee
      Cleaning Fee Level 2 (Moderate):
        fee_basis: =fee_basis
        flat_fee: =flat_fee
        receipt_fee_cap: =receipt_fee_cap
        receipt_min_amount: =receipt_min_amount
        estimate_settles_fee: =estimate_settles_fee
      Cleaning Fee Level 3 (Significant):
        fee_basis: =fee_basis
        flat_fee: =flat_fee
        receipt_fee_cap: =receipt_fee_cap
        receipt_min_amount: =receipt_min_amount
        estimate_settles_fee: =estimate_settles_fee
      Cleaning Fee Level 4 (Major):
        fee_basis: =fee_basis
        flat_fee: =flat_fee
        receipt_fee_cap: =receipt_fee_cap
        receipt_min_amount: =receipt_min_amount
        estimate_settles_fee: =estimate_settles_fee
      Damage Fee (Interior Repair):
        fee_basis: =fee_basis
        flat_fee: =flat_fee
        receipt_fee_cap: =receipt_fee_cap
        receipt_min_amount: =receipt_min_amount
        estimate_settles_fee: =estimate_settles_fee
      Damage Fee (Exterior Repair):
        fee_basis: =fee_basis
        flat_fee: =flat_fee
        receipt_fee_cap: =receipt_fee_cap
        receipt_min_amount: =receipt_min_amount
        estimate_settles_fee: =estimate_settles_fee
  formula:
    amount: flat_fee if fee_basis == 'flat' else min(repair_receipt_amount, receipt_fee_cap)
- id: damage_dispute_rules
  subject:
  - damage_dispute
  - damage_uphold
  - damage_reverse
  rule: 'Disputing a fee is the rider''s own claim and is made by the rider, at most disputes_per_assessment time per assessment. A dispute is accepted only within the dispute window: The dispute window is counted in calendar days from the charged_date: day 1 is the calendar day after the charge, and the dispute must be filed no later than the last day of the window. A disputed fee is upheld when the evidence on file met the level''s photo and receipt requirements at approval (dispute_evidence_standard), and reversed in full otherwise (insufficient_evidence); the rider''s account alone never reverses a fee backed by evidence that meets the standard (rider_statement_weight). When the evidence supports only a lower level, the assessment is moved down, the difference is refunded, and the fee is upheld at the lower level. A fee is also reversed in full, with or without a dispute, when the records show the charge was against the wrong rider (wrong_rider), duplicated another assessment (duplicate_report) or was reported outside the filing window (filed_outside_window).'
  eligibility:
  - id: within_dispute_window
    applies_to:
    - damage_dispute
    kind: time
    condition: 'A dispute is accepted only within the dispute window: The dispute window is counted in calendar days from the charged_date: day 1 is the calendar day after the charge, and the dispute must be filed no later than the last day of the window.'
    evidence_fields:
    - damage_assessments.charged_date
    - damage_assessments.damage_assessment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.damage_assessment_id
      action_bindings:
        damage_assessments.damage_assessment_id: damage_assessment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: charged_date
      anchor_source: damage_assessments.charged_date
      relation: not_after
      duration_source: variants.rider_dispute_window_days
      unit: calendar_days
      counting_rule: 'The dispute window is counted in calendar days from the charged_date: day 1 is the calendar day after the charge, and the dispute must be filed no later than the last day of the window.'
      boundary: inclusive
  params:
    rider_dispute_window_days: =rider_dispute_window_days
    disputes_per_assessment: =disputes_per_assessment
    dispute_evidence_standard: =dispute_evidence_standard
    rider_statement_weight: =rider_statement_weight
- id: damage_evt_refunds
  subject:
  - damage_fee_refund
  - damage_fee_partial_refund
  - damage_reclassify
  rule: Refunds return to the original payment method (refund_destination) and always name the fee charge they return (original_event_id). A partial refund is made only when a charged assessment is moved to a lower level while it is disputed or after it was upheld; it equals the fee at the old level less the fee at the new level (partial_refund_basis). A full refund returns the fee charged less anything already refunded (damage_msr_refunded_so_far), and is made only when the assessment is reversed. When a refund is made for any reason other than a first-incident courtesy, the reporting driver's payout on the amount returned is taken back; a courtesy refund leaves the driver's payout in place (courtesy_payout_kept).
  eligibility:
  - id: reversed_assessment
    applies_to:
    - damage_fee_refund
    kind: state
    condition: A full refund returns the fee charged less anything already refunded (damage_msr_refunded_so_far), and is made only when the assessment is reversed.
    evidence_fields:
    - damage_assessments.status
    - damage_assessments.damage_assessment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.damage_assessment_id
      action_bindings:
        damage_assessments.damage_assessment_id: damage_assessment_id
    state_contract:
      field: damage_assessments.status
      allowed:
      - reversed
  - id: reclassified_after_charge
    applies_to:
    - damage_fee_partial_refund
    kind: state
    condition: A partial refund is made only when a charged assessment is moved to a lower level while it is disputed or after it was upheld; it equals the fee at the old level less the fee at the new level (partial_refund_basis).
    evidence_fields:
    - damage_assessments.status
    - damage_assessments.damage_assessment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.damage_assessment_id
      action_bindings:
        damage_assessments.damage_assessment_id: damage_assessment_id
    state_contract:
      field: damage_assessments.status
      allowed:
      - disputed
      - upheld
  params:
    refund_destination: =refund_destination
    partial_refund_basis: =partial_refund_basis
    courtesy_payout_kept: =courtesy_payout_kept
  measures:
  - damage_msr_refunded_so_far
- id: damage_agg_courtesy_first_incident
  subject:
  - damage_fee_refund
  - damage_reverse
  rule: A disputed fee at a level with courtesy_first_incident_eligible true may be reversed once as a first-incident courtesy, even though the evidence meets the standard. The courtesy applies only when the rider has no other charged, disputed or upheld assessment with a charged_date in the courtesy lookback (damage_msr_rider_prior_charged is 0), counted across all of the rider's assessments. The courtesy refund carries refund reason courtesy_first_incident and the driver keeps the payout.
  eligibility:
  - id: first_incident
    applies_to:
    - damage_fee_refund
    kind: authorization
    condition: The courtesy applies only when the rider has no other charged, disputed or upheld assessment with a charged_date in the courtesy lookback (damage_msr_rider_prior_charged is 0), counted across all of the rider's assessments.
    evidence_fields:
    - damage_assessments.customer_id
    - damage_assessments.status
    - damage_assessments.charged_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.customer_id
      action_bindings:
        damage_assessments.customer_id: customer_id
  params:
    courtesy_lookback_days: =courtesy_lookback_days
    per_tier:
      Cleaning Fee Level 1 (Minor):
        courtesy_first_incident_eligible: =courtesy_first_incident_eligible
      Cleaning Fee Level 2 (Moderate):
        courtesy_first_incident_eligible: =courtesy_first_incident_eligible
      Cleaning Fee Level 3 (Significant):
        courtesy_first_incident_eligible: =courtesy_first_incident_eligible
      Cleaning Fee Level 4 (Major):
        courtesy_first_incident_eligible: =courtesy_first_incident_eligible
      Damage Fee (Interior Repair):
        courtesy_first_incident_eligible: =courtesy_first_incident_eligible
      Damage Fee (Exterior Repair):
        courtesy_first_incident_eligible: =courtesy_first_incident_eligible
  measures:
  - damage_msr_rider_prior_charged
- id: damage_service_animal
  subject:
  - damage_deny
  - damage_reverse
  - damage_fee_refund
  rule: 'Hair or dander shed by a service animal is never charged (service_animal_shedding_exempt): a report of animal_hair_or_mess that consists of shedding from a service animal the rider was travelling with is denied before charge, or reversed in full with reason service_animal_shedding when already charged. Whether the animal was a service animal is the rider''s own statement and is accepted as given; the rider is never asked for documentation or the animal''s training. A mess other than shedding left by a service animal is charged at its level like any other mess (service_animal_accident_chargeable).'
  eligibility:
  - id: service_animal_statement
    applies_to:
    - damage_reverse
    - damage_fee_refund
    kind: caller_fact
    condition: Whether the animal was a service animal is the rider's own statement and is accepted as given; the rider is never asked for documentation or the animal's training.
    evidence_fields:
    - damage_assessments.incident_category
    - damage_assessments.damage_assessment_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - damage_assessments.damage_assessment_id
      action_bindings:
        damage_assessments.damage_assessment_id: damage_assessment_id
  params:
    service_animal_shedding_exempt: =service_animal_shedding_exempt
    service_animal_accident_chargeable: =service_animal_accident_chargeable
- id: damage_reconsideration
  subject:
  - damage_reconsider
  - damage_deny
  rule: 'A denial is recorded with one of the denial_reasons. A driver may ask for reconsideration of a denied report only within the reconsideration window: The reconsideration window is counted in calendar days from the denial''s closed_date: day 1 is the calendar day after the denial, and the request must be made no later than the last day of the window. Reconsideration is granted at most reconsiderations_per_assessment time and only when the driver submits new evidence that cures the denial reason; denials for filed_outside_window, duplicate_report and non_chargeable_condition cannot be cured.'
  eligibility:
  - id: within_reconsideration_window
    applies_to:
    - damage_reconsider
    kind: time
    condition: 'A driver may ask for reconsideration of a denied report only within the reconsideration window: The reconsideration window is counted in calendar days from the denial''s closed_date: day 1 is the calendar day after the denial, and the request must be made no later than the last day of the window.'
    evidence_fields:
    - damage_assessments.closed_date
    - damage_assessments.damage_assessment_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - damage_assessments.damage_assessment_id
      action_bindings:
        damage_assessments.damage_assessment_id: damage_assessment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: denial's closed_date
      anchor_source: damage_assessments.closed_date
      relation: not_after
      duration_source: variants.reconsideration_window_days
      unit: calendar_days
      counting_rule: 'The reconsideration window is counted in calendar days from the denial''s closed_date: day 1 is the calendar day after the denial, and the request must be made no later than the last day of the window.'
      boundary: inclusive
  params:
    denial_reasons: =denial_reasons
    reconsideration_window_days: =reconsideration_window_days
    reconsiderations_per_assessment: =reconsiderations_per_assessment
    review_path: =review_path
extended_policies:
- id: damage_ext_review_move_down_fee
  base_policy_refs:
  - damage_level_classification
  - damage_evt_refunds
  - damage_evt_fee_charge
  overwrite:
  - base_policy: damage_evt_fee_charge
    superseded_clause: At a flat level the fee is the level's flat_fee
    replaced_by: Where the adjustments below apply, the flat fee of the level moved to is first multiplied by the cabin multiplier, giving the cabin-adjusted fee; the metro add-on, the liquid add-on, the upholstery add-on and the odor component are then added to the cabin-adjusted fee, and the total is rounded half up to the cent once, at the end.
  - base_policy: damage_level_classification
    superseded_clause: A report is held at the lowest level whose definition matches the evidence on file
    replaced_by: A cleaning fee report under review that is held at a cleaning level whose entry gate does not list the incident category reported is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee assessed at the moved-down level is recorded with the move.
  trigger: state_due
  subject:
  - damage_reclassify
  computes: assessed_fee
  target_tool: move_down_report_level_d77023ae
  params:
    fee_level1: 25.0
    fee_level2: 60.0
    fee_level3: 100.0
    fee_level4: 150.0
    cabin_full_mult: 1.25
    cabin_partial_mult: 1.1
    metro_high_addon: 15.0
    metro_mid_addon: 8.0
    liquid_soak_addon: 25.0
    liquid_short_addon: 12.0
    long_trip_minutes: 30
    leather_addon: 12.0
    premium_cloth_addon: 6.0
    odor_share: 0.2
    odor_flat: 10.0
  rule: 'A cleaning fee report under review that is held at a cleaning level whose entry gate does not list the incident category reported is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee assessed at the moved-down level is recorded with the move. The fee assessed at the moved-down level starts from the flat fee of the level the report is moved to (flat_fee); in the standard assessment that flat fee is the whole fee assessed, rounded half up to the cent. Where the adjustments below apply, the flat fee of the level moved to is first multiplied by the cabin multiplier, giving the cabin-adjusted fee; the metro add-on, the liquid add-on, the upholstery add-on and the odor component are then added to the cabin-adjusted fee, and the total is rounded half up to the cent once, at the end. The cabin multiplier of a moved-down assessment is read from the reported trip: when the trip''s ride option has three seat rows (Wayfare XL or Wayfare Black SUV) and the request was for five or more seats, it is the full-cabin multiplier; when the ride option has three seat rows and the request was for four or fewer seats, or the ride option is a premium two-row option (Wayfare Comfort or Wayfare Black), it is the partial-cabin multiplier; on any other trip it is one. The metro add-on of a moved-down assessment is read from the market the reported trip started in: Denver, Las Vegas and Salt Lake City carry the high-cost metro add-on; Colorado Springs, Phoenix and Tucson carry the mid-cost metro add-on; any other market carries no metro add-on. The liquid add-on of a moved-down assessment is read from the incident category and the reported trip''s actual duration: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes carries the liquid soak add-on; a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor on any trip, carries the short-exposure add-on; any other incident carries no liquid add-on. The upholstery add-on of a moved-down assessment is read from the reported trip''s ride option: Wayfare Black and Wayfare Black SUV, whose cabins are leather, carry the leather add-on; Wayfare Comfort carries the premium cloth add-on; any other ride option carries no upholstery add-on. The odor component of a moved-down assessment is worked out by the incident category and the evidence on file: smoke or vape odor, which needs a whole-cabin odor treatment, takes the odor share of the flat fee of the level moved to; a food or drink spill, animal hair or mess or bodily fluids with at least one professional cleaning document on the assessment''s evidence ledger takes the flat deodorizing charge; any other report, such as one of trash or debris or one cleaned without a professional cleaning document, takes no odor component.'
  prerequisite: []
  cross_category:
  - category: trip
    as: branch
    reads:
    - variant_name
    - seats_requested
    - market
    - actual_minutes
    note: The reported trip's ride option and seats decide the cabin multiplier and the upholstery add-on, its market the metro add-on and its actual duration the liquid add-on.
  compute:
  - held_rank: 4 if F('variant_name') == 'Cleaning Fee Level 4 (Major)' else (3 if F('variant_name') == 'Cleaning Fee Level 3 (Significant)' else (2 if F('variant_name') == 'Cleaning Fee Level 2 (Moderate)' else 1))
  - incident: F('incident_category')
  - new_rank: 4 if held_rank >= 4 and incident == 'bodily_fluids' else (3 if held_rank >= 3 and (incident == 'food_or_drink_spill' or incident == 'smoke_or_vape_odor' or incident == 'animal_hair_or_mess' or incident == 'bodily_fluids') else (2 if held_rank >= 2 and (incident == 'food_or_drink_spill' or incident == 'trash_or_debris' or incident == 'smoke_or_vape_odor' or incident == 'animal_hair_or_mess') else 1))
  - new_flat_fee: K('fee_level4') if new_rank == 4 else (K('fee_level3') if new_rank == 3 else (K('fee_level2') if new_rank == 2 else K('fee_level1')))
  - cabin_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - cabin_seats: CFIELD('trip', 'seats_requested', trip_id=F('trip_id'))
  - cabin_multiplier: K('cabin_full_mult') if (cabin_option == 'Wayfare XL' or cabin_option == 'Wayfare Black SUV') and cabin_seats >= 5 else (K('cabin_partial_mult') if ((cabin_option == 'Wayfare XL' or cabin_option == 'Wayfare Black SUV') and cabin_seats <= 4) or (cabin_option == 'Wayfare Comfort' or cabin_option == 'Wayfare Black') else 1.0)
  - cabin_fee: new_flat_fee * cabin_multiplier
  - metro_market: CFIELD('trip', 'market', trip_id=F('trip_id'))
  - metro_addon: K('metro_high_addon') if metro_market == 'DEN' or metro_market == 'LAS' or metro_market == 'SLC' else (K('metro_mid_addon') if metro_market == 'COS' or metro_market == 'PHX' or metro_market == 'TUS' else 0.0)
  - soak_minutes: CFIELD('trip', 'actual_minutes', trip_id=F('trip_id'))
  - liquid_addon: K('liquid_soak_addon') if (incident == 'food_or_drink_spill' or incident == 'bodily_fluids') and soak_minutes >= K('long_trip_minutes') else (K('liquid_short_addon') if ((incident == 'food_or_drink_spill' or incident == 'bodily_fluids') and soak_minutes < K('long_trip_minutes')) or (incident == 'animal_hair_or_mess' or incident == 'smoke_or_vape_odor') else 0.0)
  - trim_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - upholstery_addon: K('leather_addon') if trim_option == 'Wayfare Black' or trim_option == 'Wayfare Black SUV' else (K('premium_cloth_addon') if trim_option == 'Wayfare Comfort' else 0.0)
  - odor_documents: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - odor_component: new_flat_fee * K('odor_share') if incident == 'smoke_or_vape_odor' else (K('odor_flat') if (incident == 'food_or_drink_spill' or incident == 'animal_hair_or_mess' or incident == 'bodily_fluids') and odor_documents > 0 else 0.0)
  - result: RND(cabin_fee + metro_addon + liquid_addon + upholstery_addon + odor_component, 2)
  compute_basis:
    new_rank: A cleaning fee report under review that is held at a cleaning level whose entry gate does not list the incident category reported is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee assessed at the moved-down level is recorded with the move.
    new_flat_fee: The fee assessed at the moved-down level starts from the flat fee of the level the report is moved to (flat_fee); in the standard assessment that flat fee is the whole fee assessed, rounded half up to the cent.
    cabin_option: The cabin multiplier of a moved-down assessment is read from the reported trip
    cabin_multiplier: when the trip's ride option has three seat rows (Wayfare XL or Wayfare Black SUV) and the request was for five or more seats, it is the full-cabin multiplier; when the ride option has three seat rows and the request was for four or fewer seats, or the ride option is a premium two-row option (Wayfare Comfort or Wayfare Black), it is the partial-cabin multiplier; on any other trip it is one.
    cabin_fee: the flat fee of the level moved to is first multiplied by the cabin multiplier, giving the cabin-adjusted fee
    metro_market: The metro add-on of a moved-down assessment is read from the market the reported trip started in
    metro_addon: Denver, Las Vegas and Salt Lake City carry the high-cost metro add-on; Colorado Springs, Phoenix and Tucson carry the mid-cost metro add-on; any other market carries no metro add-on.
    soak_minutes: The liquid add-on of a moved-down assessment is read from the incident category and the reported trip's actual duration
    liquid_addon: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes carries the liquid soak add-on; a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor on any trip, carries the short-exposure add-on; any other incident carries no liquid add-on.
    trim_option: The upholstery add-on of a moved-down assessment is read from the reported trip's ride option
    upholstery_addon: Wayfare Black and Wayfare Black SUV, whose cabins are leather, carry the leather add-on; Wayfare Comfort carries the premium cloth add-on; any other ride option carries no upholstery add-on.
    odor_documents: with at least one professional cleaning document on the assessment's evidence ledger
    odor_component: smoke or vape odor, which needs a whole-cabin odor treatment, takes the odor share of the flat fee of the level moved to; a food or drink spill, animal hair or mess or bodily fluids with at least one professional cleaning document on the assessment's evidence ledger takes the flat deodorizing charge; any other report, such as one of trash or debris or one cleaned without a professional cleaning document, takes no odor component.
    result: the metro add-on, the liquid add-on, the upholstery add-on and the odor component are then added to the cabin-adjusted fee, and the total is rounded half up to the cent once, at the end.
  factors:
  - id: cabin_size
    effect: parameter
    decides: cabin_multiplier
    bindings:
    - cabin_option
    - cabin_seats
    - cabin_multiplier
    ladder:
    - when: the reported trip's ride option has three seat rows (Wayfare XL or Wayfare Black SUV) and the request was for five or more seats
      value: K('cabin_full_mult')
    - when: the ride option has three seat rows and the request was for four or fewer seats, or the ride option is Wayfare Comfort or Wayfare Black
      value: K('cabin_partial_mult')
    - when: otherwise
      value: '1.0'
    baseline:
      cabin_multiplier: '1.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: metro_cost
    effect: parameter
    decides: metro_addon
    bindings:
    - metro_market
    - metro_addon
    ladder:
    - when: the reported trip started in Denver, Las Vegas or Salt Lake City
      value: K('metro_high_addon')
    - when: the reported trip started in Colorado Springs, Phoenix or Tucson
      value: K('metro_mid_addon')
    - when: otherwise
      value: '0.0'
    baseline:
      metro_addon: '0.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: liquid_exposure
    effect: parameter
    decides: liquid_addon
    bindings:
    - soak_minutes
    - liquid_addon
    ladder:
    - when: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes
      value: K('liquid_soak_addon')
    - when: a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor on any trip
      value: K('liquid_short_addon')
    - when: otherwise
      value: '0.0'
    baseline:
      liquid_addon: '0.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: upholstery
    effect: parameter
    decides: upholstery_addon
    bindings:
    - trim_option
    - upholstery_addon
    ladder:
    - when: the reported trip's ride option is Wayfare Black or Wayfare Black SUV (leather cabin)
      value: K('leather_addon')
    - when: the reported trip's ride option is Wayfare Comfort
      value: K('premium_cloth_addon')
    - when: otherwise
      value: '0.0'
    baseline:
      upholstery_addon: '0.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: odor_treatment
    effect: method
    decides: odor_component
    bindings:
    - odor_documents
    - odor_component
    ladder:
    - when: the incident category is smoke or vape odor
      method: 'the odor component is the odor share of the flat fee of the level moved to (a proportion of that level''s fee: whole-cabin odor treatment)'
    - when: a food or drink spill, animal hair or mess or bodily fluids, and at least one professional cleaning document is on the evidence ledger
      method: the odor component is the flat deodorizing charge (a fixed amount added)
    - when: otherwise
      method: no odor component is added
    baseline:
      odor_component: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A cleaning fee report under review that is held at a cleaning level whose entry gate does not list the incident category reported is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee assessed at the moved-down level is recorded with the move. The fee assessed at the moved-down level starts from the flat fee of the level the report is moved to (flat_fee); in the standard assessment that flat fee is the whole fee assessed, rounded half up to the cent.
    params:
    - fee_level1
    - fee_level2
    - fee_level3
    - fee_level4
    - flat_fee
  inputs:
    history:
    - table: damage_events
      aggregate: count
      field: damage_event_id
      filters:
        event_type: damage_evidence_submit
        evidence_type: cleaning_receipt
    cross_category:
    - trip
- id: damage_ext_approval_photo_shortfall
  base_policy_refs:
  - damage_filing_and_evidence
  overwrite: []
  trigger: state_due
  subject:
  - damage_evidence_submit
  - damage_evidence_update
  computes: photos_in_upload
  target_tool: upload_report_photos_a5022c03
  params:
    photos_per_row: 2
    three_row_count: 3
    two_row_count: 2
    rows_full_photos: 2
    rows_partial_photos: 1
    long_trip_minutes: 30
    liquid_long_photos: 2
    liquid_short_photos: 1
    leather_trim_photos: 2
    cloth_trim_photos: 1
    overview_photos_per_passenger_row: 1
  rule: 'For a cleaning or damage fee report under review, the approval photo set is the number of photos the report must have on file before its fee is approved, and the photos still needed are the approval photo set less the photos on file (photo_count), never below zero, counted as a whole number of photos; the driver uploads the photos still needed as one photo submission. In the standard count the approval photo set is the minimum photo count of the level held (min_photos). Where the adjustments below apply, the approval photo set is the core photo count of the level held plus the occupied-seat close-ups, the liquid close-ups and the trim close-ups. The core photo count of an approval photo set is worked out from the photo subjects the level held requires (photo_subjects_required): a level that requires a photo of each affected surface takes a close-up and an in-context photo of every seat row of the reported vehicle, that is the per-row photo pair for each seat row (three seat rows for Wayfare XL and Wayfare Black SUV, two for any other ride option), and its minimum photo count is not used; a level that requires close-up and in-context photos of the affected area takes its minimum photo count plus one overview photo of each passenger row, the seat rows behind the driver''s row of the reported vehicle; any other level takes its minimum photo count. The occupied-seat close-ups of an approval photo set are read from the reported trip: a three-row ride option (Wayfare XL or Wayfare Black SUV) with five or more seats requested adds the full-party close-ups; a three-row ride option with four or fewer seats requested, or a two-row ride option with three or more seats requested, adds the partial-party close-ups; any other trip adds no occupied-seat close-ups. The liquid close-ups of an approval photo set are read from the incident category and the reported trip''s actual duration: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes adds the long-exposure close-ups; a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor, adds the short-exposure close-ups; any other incident adds no liquid close-ups. The trim close-ups of an approval photo set are read from the reported trip''s ride option: Wayfare Black and Wayfare Black SUV, whose cabins are leather, add the leather trim close-ups; Wayfare Comfort adds the cloth trim close-ups; any other ride option adds no trim close-ups. The photos still needed for approval are counted only after the fee level held on the assessment is one whose entry gate lists the incident category reported.'
  prerequisite:
  - problem: damage_ext_review_move_down_fee
    kind: value_input
    gate: set_minimum
    form: state
    policy_source: The photos still needed for approval are counted only after the fee level held on the assessment is one whose entry gate lists the incident category reported.
    condition: damage_assessments.variant_name names a level whose entry gate lists damage_assessments.incident_category.
    resolved_by: move_down_report_level_d77023ae
    effect: 'Once the report sits at the level its incident category allows, set_minimum and photo_set are read at that level: the minimum photo count and the photo subjects of the moved-down level replace those of the level reported, which changes the approval photo set and the photos still needed.'
  cross_category:
  - category: trip
    as: branch
    reads:
    - variant_name
    - seats_requested
    - actual_minutes
    note: The reported trip's ride option and seats decide the occupied-seat close-ups, the trim close-ups and the seat rows of the vehicle; its actual duration decides the liquid close-ups.
  compute:
  - set_minimum: P('min_photos')
  - photos_on_file: F('photo_count')
  - incident: F('incident_category')
  - row_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - row_seats: CFIELD('trip', 'seats_requested', trip_id=F('trip_id'))
  - row_photos: K('rows_full_photos') if (row_option == 'Wayfare XL' or row_option == 'Wayfare Black SUV') and row_seats >= 5 else (K('rows_partial_photos') if ((row_option == 'Wayfare XL' or row_option == 'Wayfare Black SUV') and row_seats <= 4) or ((row_option != 'Wayfare XL' and row_option != 'Wayfare Black SUV') and row_seats >= 3) else 0)
  - liquid_minutes: CFIELD('trip', 'actual_minutes', trip_id=F('trip_id'))
  - liquid_photos: K('liquid_long_photos') if (incident == 'food_or_drink_spill' or incident == 'bodily_fluids') and liquid_minutes >= K('long_trip_minutes') else (K('liquid_short_photos') if ((incident == 'food_or_drink_spill' or incident == 'bodily_fluids') and liquid_minutes < K('long_trip_minutes')) or (incident == 'animal_hair_or_mess' or incident == 'smoke_or_vape_odor') else 0)
  - trim_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - trim_photos: K('leather_trim_photos') if trim_option == 'Wayfare Black' or trim_option == 'Wayfare Black SUV' else (K('cloth_trim_photos') if trim_option == 'Wayfare Comfort' else 0)
  - set_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - vehicle_rows: K('three_row_count') if set_option == 'Wayfare XL' or set_option == 'Wayfare Black SUV' else K('two_row_count')
  - set_core: K('photos_per_row') * vehicle_rows if 'each_affected_surface' in P('photo_subjects_required') else (set_minimum + K('overview_photos_per_passenger_row') * (vehicle_rows - 1) if 'affected_area_in_context' in P('photo_subjects_required') else set_minimum)
  - photo_set: set_core + row_photos + liquid_photos + trim_photos
  - result: MX(0, photo_set - photos_on_file)
  compute_basis:
    set_minimum: In the standard count the approval photo set is the minimum photo count of the level held (min_photos).
    photos_on_file: the photos still needed are the approval photo set less the photos on file (photo_count), never below zero, counted as a whole number of photos
    row_option: The occupied-seat close-ups of an approval photo set are read from the reported trip
    row_photos: a three-row ride option (Wayfare XL or Wayfare Black SUV) with five or more seats requested adds the full-party close-ups; a three-row ride option with four or fewer seats requested, or a two-row ride option with three or more seats requested, adds the partial-party close-ups; any other trip adds no occupied-seat close-ups.
    liquid_minutes: The liquid close-ups of an approval photo set are read from the incident category and the reported trip's actual duration
    liquid_photos: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes adds the long-exposure close-ups; a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor, adds the short-exposure close-ups; any other incident adds no liquid close-ups.
    trim_option: The trim close-ups of an approval photo set are read from the reported trip's ride option
    trim_photos: Wayfare Black and Wayfare Black SUV, whose cabins are leather, add the leather trim close-ups; Wayfare Comfort adds the cloth trim close-ups; any other ride option adds no trim close-ups.
    vehicle_rows: three seat rows for Wayfare XL and Wayfare Black SUV, two for any other ride option
    result: the photos still needed are the approval photo set less the photos on file (photo_count), never below zero, counted as a whole number of photos
    set_core: a level that requires a photo of each affected surface takes a close-up and an in-context photo of every seat row of the reported vehicle, that is the per-row photo pair for each seat row (three seat rows for Wayfare XL and Wayfare Black SUV, two for any other ride option), and its minimum photo count is not used; a level that requires close-up and in-context photos of the affected area takes its minimum photo count plus one overview photo of each passenger row, the seat rows behind the driver's row of the reported vehicle; any other level takes its minimum photo count.
    photo_set: the approval photo set is the core photo count of the level held plus the occupied-seat close-ups, the liquid close-ups and the trim close-ups.
  factors:
  - id: seat_row_photos
    effect: parameter
    decides: row_photos
    bindings:
    - row_option
    - row_seats
    - row_photos
    ladder:
    - when: a three-row ride option (Wayfare XL or Wayfare Black SUV) with five or more seats requested (full party)
      value: K('rows_full_photos')
    - when: a three-row ride option with four or fewer seats requested, or a two-row ride option with three or more seats requested (partial party)
      value: K('rows_partial_photos')
    - when: otherwise
      value: '0'
    baseline:
      row_photos: '0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: liquid_close_ups
    effect: parameter
    decides: liquid_photos
    bindings:
    - liquid_minutes
    - liquid_photos
    ladder:
    - when: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes
      value: K('liquid_long_photos')
    - when: a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor
      value: K('liquid_short_photos')
    - when: otherwise
      value: '0'
    baseline:
      liquid_photos: '0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: trim_close_ups
    effect: parameter
    decides: trim_photos
    bindings:
    - trim_option
    - trim_photos
    ladder:
    - when: the reported trip's ride option is Wayfare Black or Wayfare Black SUV (leather cabin)
      value: K('leather_trim_photos')
    - when: the reported trip's ride option is Wayfare Comfort
      value: K('cloth_trim_photos')
    - when: otherwise
      value: '0'
    baseline:
      trim_photos: '0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: set_assembly
    effect: method
    decides: set_core
    bindings:
    - set_option
    - vehicle_rows
    - set_core
    ladder:
    - when: the level held requires a photo of each affected surface
      method: the core is the per-row photo pair for every seat row of the reported vehicle (built per seat row; the level minimum is not used)
    - when: the level held requires close-up and in-context photos of the affected area
      method: the core is the level's minimum photo count plus one overview photo of each passenger row (the seat rows behind the driver's row)
    - when: otherwise
      method: the core is the level's minimum photo count
    baseline:
      set_core: set_minimum
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: trip
  baseline:
    rule: For a cleaning or damage fee report under review, the approval photo set is the number of photos the report must have on file before its fee is approved, and the photos still needed are the approval photo set less the photos on file (photo_count), never below zero, counted as a whole number of photos; the driver uploads the photos still needed as one photo submission. In the standard count the approval photo set is the minimum photo count of the level held (min_photos).
    params:
    - min_photos
  inputs:
    history: []
    cross_category:
    - trip
- id: damage_ext_partner_work_order_price
  base_policy_refs:
  - damage_filing_and_evidence
  overwrite: []
  trigger: state_due
  subject:
  - damage_evidence_update
  computes: cleaning_cost_on_file
  target_tool: price_partner_work_order_4e0ef0e3
  params:
    package_level1: 45.0
    package_level2: 85.0
    package_level3: 140.0
    package_level4: 210.0
    row_price_level1: 20.0
    row_price_level2: 35.0
    row_price_level3: 55.0
    row_price_level4: 80.0
    seat_rows_priced: 3
    long_trip_minutes: 30
    extraction_long: 55.0
    extraction_short: 25.0
    metro_high_rate: 1.1
    metro_mid_rate: 1.05
    rush_next_day: 35.0
    rush_short_turnaround: 15.0
    leather_conditioning: 30.0
    cloth_conditioning: 15.0
    sunday_charge: 30.0
    saturday_charge: 20.0
  rule: 'A Wayfare partner detailer''s work order on a cleaning fee report reaches the assessment''s evidence ledger as a professional cleaning document without a price, and support records its price as the cleaning cost on file (repair_receipt_amount) from the partner rate card; a report with no partner work order on its evidence ledger has no partner price, and its cleaning cost on file is recorded as zero. In the standard pricing a partner work order is priced at the rate card''s standard interior package for the level held, rounded half up to the cent. Where the adjustments below apply, the service basis and the extraction charge are added together, that sum is multiplied by the metro rate, and the rush charge, the leather conditioning charge and the weekend charge are then added; the total is rounded half up to the cent once, at the end. The service basis of a partner work order is worked out from the reported trip: a three-row ride option (Wayfare XL or Wayfare Black SUV) with five or more seats requested is priced per seat row, that is the level''s row price for each of the three seat rows; a three-row ride option with four or fewer seats requested, or a premium two-row option (Wayfare Comfort or Wayfare Black), is priced as the standard interior package plus one row price; any other trip is priced as the standard interior package. The extraction charge of a partner work order is read from the incident category and the reported trip''s actual duration: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes takes the deep extraction charge; a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor, takes the surface extraction charge; any other incident takes no extraction charge. The metro rate of a partner work order is read from the market the reported trip started in: Denver, Las Vegas and Salt Lake City take the high-cost metro rate; Colorado Springs, Phoenix and Tucson take the mid-cost metro rate; any other market takes a rate of one. The rush charge of a partner work order is read from the calendar days between the reported trip''s drop-off date and the date the work order was put on the evidence ledger: one day or less takes the next-day rush charge; two or three days take the short-turnaround charge; more days take no rush charge. The leather conditioning charge of a partner work order is read from the reported trip''s ride option: Wayfare Black and Wayfare Black SUV, whose cabins are leather, take the leather conditioning charge; Wayfare Comfort takes the cloth conditioning charge; any other ride option takes no conditioning charge. The weekend charge of a partner work order is read from the day of the week the work order was put on the evidence ledger: a Sunday takes the Sunday charge; a Saturday takes the Saturday charge; a weekday takes no weekend charge. A partner work order on file is not priced until the fee level held on the assessment lists the incident category reported in its entry gate.'
  prerequisite:
  - problem: damage_ext_review_move_down_fee
    kind: value_input
    gate: level_package
    form: state
    policy_source: A partner work order on file is not priced until the fee level held on the assessment lists the incident category reported in its entry gate.
    condition: damage_assessments.variant_name names a level whose entry gate lists damage_assessments.incident_category.
    resolved_by: move_down_report_level_d77023ae
    effect: Once the report sits at the level its incident category allows, level_package and level_row_price are read at that level, so the standard interior package and the per-row price of the moved-down level replace those of the level reported.
  cross_category:
  - category: trip
    as: branch
    reads:
    - variant_name
    - seats_requested
    - actual_minutes
    - market
    - dropoff_at
    note: The reported trip's ride option and seats decide the service basis and the conditioning charge, its actual duration the extraction charge, its market the metro rate and its drop-off date the rush charge.
  compute:
  - work_orders: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - work_order_date: LATEST('damage_events', 'event_date', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - incident: F('incident_category')
  - level_package: K('package_level4') if F('variant_name') == 'Cleaning Fee Level 4 (Major)' else (K('package_level3') if F('variant_name') == 'Cleaning Fee Level 3 (Significant)' else (K('package_level2') if F('variant_name') == 'Cleaning Fee Level 2 (Moderate)' else K('package_level1')))
  - level_row_price: K('row_price_level4') if F('variant_name') == 'Cleaning Fee Level 4 (Major)' else (K('row_price_level3') if F('variant_name') == 'Cleaning Fee Level 3 (Significant)' else (K('row_price_level2') if F('variant_name') == 'Cleaning Fee Level 2 (Moderate)' else K('row_price_level1')))
  - basis_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - basis_seats: CFIELD('trip', 'seats_requested', trip_id=F('trip_id'))
  - service_basis: K('seat_rows_priced') * level_row_price if (basis_option == 'Wayfare XL' or basis_option == 'Wayfare Black SUV') and basis_seats >= 5 else (level_package + level_row_price if ((basis_option == 'Wayfare XL' or basis_option == 'Wayfare Black SUV') and basis_seats <= 4) or (basis_option == 'Wayfare Comfort' or basis_option == 'Wayfare Black') else level_package)
  - extraction_minutes: CFIELD('trip', 'actual_minutes', trip_id=F('trip_id'))
  - extraction_charge: K('extraction_long') if (incident == 'food_or_drink_spill' or incident == 'bodily_fluids') and extraction_minutes >= K('long_trip_minutes') else (K('extraction_short') if ((incident == 'food_or_drink_spill' or incident == 'bodily_fluids') and extraction_minutes < K('long_trip_minutes')) or (incident == 'animal_hair_or_mess' or incident == 'smoke_or_vape_odor') else 0.0)
  - rate_market: CFIELD('trip', 'market', trip_id=F('trip_id'))
  - metro_rate: K('metro_high_rate') if rate_market == 'DEN' or rate_market == 'LAS' or rate_market == 'SLC' else (K('metro_mid_rate') if rate_market == 'COS' or rate_market == 'PHX' or rate_market == 'TUS' else 1.0)
  - rush_days: DAYS(CFIELD('trip', 'dropoff_at', trip_id=F('trip_id')), work_order_date) if work_orders > 0 else 99
  - rush_charge: K('rush_next_day') if rush_days <= 1 else (K('rush_short_turnaround') if rush_days <= 3 else 0.0)
  - conditioning_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - conditioning_charge: K('leather_conditioning') if conditioning_option == 'Wayfare Black' or conditioning_option == 'Wayfare Black SUV' else (K('cloth_conditioning') if conditioning_option == 'Wayfare Comfort' else 0.0)
  - weekday_index: DAYS('2026-01-03', work_order_date) % 7 if work_orders > 0 else 3
  - weekend_charge: K('sunday_charge') if weekday_index == 1 else (K('saturday_charge') if weekday_index == 0 else 0.0)
  - result: RND((service_basis + extraction_charge) * metro_rate + rush_charge + conditioning_charge + weekend_charge, 2) if work_orders > 0 else 0.0
  compute_basis:
    work_orders: a report with no partner work order on its evidence ledger has no partner price, and its cleaning cost on file is recorded as zero.
    work_order_date: the date the work order was put on the evidence ledger
    level_package: In the standard pricing a partner work order is priced at the rate card's standard interior package for the level held, rounded half up to the cent.
    level_row_price: that is the level's row price for each of the three seat rows
    basis_option: The service basis of a partner work order is worked out from the reported trip
    service_basis: a three-row ride option (Wayfare XL or Wayfare Black SUV) with five or more seats requested is priced per seat row, that is the level's row price for each of the three seat rows; a three-row ride option with four or fewer seats requested, or a premium two-row option (Wayfare Comfort or Wayfare Black), is priced as the standard interior package plus one row price; any other trip is priced as the standard interior package.
    extraction_minutes: The extraction charge of a partner work order is read from the incident category and the reported trip's actual duration
    extraction_charge: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes takes the deep extraction charge; a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor, takes the surface extraction charge; any other incident takes no extraction charge.
    rate_market: The metro rate of a partner work order is read from the market the reported trip started in
    metro_rate: Denver, Las Vegas and Salt Lake City take the high-cost metro rate; Colorado Springs, Phoenix and Tucson take the mid-cost metro rate; any other market takes a rate of one.
    rush_days: The rush charge of a partner work order is read from the calendar days between the reported trip's drop-off date and the date the work order was put on the evidence ledger
    rush_charge: one day or less takes the next-day rush charge; two or three days take the short-turnaround charge; more days take no rush charge.
    conditioning_option: The leather conditioning charge of a partner work order is read from the reported trip's ride option
    conditioning_charge: Wayfare Black and Wayfare Black SUV, whose cabins are leather, take the leather conditioning charge; Wayfare Comfort takes the cloth conditioning charge; any other ride option takes no conditioning charge.
    weekday_index: The weekend charge of a partner work order is read from the day of the week the work order was put on the evidence ledger
    weekend_charge: a Sunday takes the Sunday charge; a Saturday takes the Saturday charge; a weekday takes no weekend charge.
    result: the service basis and the extraction charge are added together, that sum is multiplied by the metro rate, and the rush charge, the leather conditioning charge and the weekend charge are then added; the total is rounded half up to the cent once, at the end.
  factors:
  - id: service_basis
    effect: method
    decides: service_basis
    bindings:
    - basis_option
    - basis_seats
    - service_basis
    ladder:
    - when: a three-row ride option (Wayfare XL or Wayfare Black SUV) and five or more seats requested
      method: 'priced per seat row: the level''s row price times the three seat rows (the package is not used)'
    - when: a three-row ride option and four or fewer seats requested, or a premium two-row option (Wayfare Comfort or Wayfare Black)
      method: priced as the standard interior package plus one row price
    - when: otherwise
      method: priced as the standard interior package
    baseline:
      service_basis: level_package
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: extraction
    effect: parameter
    decides: extraction_charge
    bindings:
    - extraction_minutes
    - extraction_charge
    ladder:
    - when: a food or drink spill or bodily fluids on a trip whose actual duration reached the long-trip minutes
      value: K('extraction_long')
    - when: a food or drink spill or bodily fluids on a shorter trip, or animal hair or mess or smoke or vape odor
      value: K('extraction_short')
    - when: otherwise
      value: '0.0'
    baseline:
      extraction_charge: '0.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: metro_rate
    effect: parameter
    decides: metro_rate
    bindings:
    - rate_market
    - metro_rate
    ladder:
    - when: the reported trip started in Denver, Las Vegas or Salt Lake City
      value: K('metro_high_rate')
    - when: the reported trip started in Colorado Springs, Phoenix or Tucson
      value: K('metro_mid_rate')
    - when: otherwise
      value: '1.0'
    baseline:
      metro_rate: '1.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: rush_turnaround
    effect: parameter
    decides: rush_charge
    bindings:
    - rush_days
    - rush_charge
    ladder:
    - when: one calendar day or less between the trip's drop-off date and the work order date
      value: K('rush_next_day')
    - when: two or three calendar days
      value: K('rush_short_turnaround')
    - when: otherwise
      value: '0.0'
    baseline:
      rush_charge: '0.0'
    evidence:
    - date
    - history
    - cross_category
    cross_difficulty: trip
  - id: leather_conditioning
    effect: parameter
    decides: conditioning_charge
    bindings:
    - conditioning_option
    - conditioning_charge
    ladder:
    - when: the reported trip's ride option is Wayfare Black or Wayfare Black SUV (leather cabin)
      value: K('leather_conditioning')
    - when: the reported trip's ride option is Wayfare Comfort
      value: K('cloth_conditioning')
    - when: otherwise
      value: '0.0'
    baseline:
      conditioning_charge: '0.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: weekend_service
    effect: parameter
    decides: weekend_charge
    bindings:
    - weekday_index
    - weekend_charge
    ladder:
    - when: the work order was put on the evidence ledger on a Sunday
      value: K('sunday_charge')
    - when: the work order was put on the evidence ledger on a Saturday
      value: K('saturday_charge')
    - when: otherwise (a weekday)
      value: '0.0'
    baseline:
      weekend_charge: '0.0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: A Wayfare partner detailer's work order on a cleaning fee report reaches the assessment's evidence ledger as a professional cleaning document without a price, and support records its price as the cleaning cost on file (repair_receipt_amount) from the partner rate card; a report with no partner work order on its evidence ledger has no partner price, and its cleaning cost on file is recorded as zero. In the standard pricing a partner work order is priced at the rate card's standard interior package for the level held, rounded half up to the cent.
    params:
    - package_level1
    - package_level2
    - package_level3
    - package_level4
  inputs:
    history:
    - table: damage_events
      aggregate: count
      field: damage_event_id
      filters:
        event_type: damage_evidence_submit
        evidence_type: cleaning_receipt
    - table: damage_events
      aggregate: latest
      field: event_date
      filters:
        event_type: damage_evidence_submit
        evidence_type: cleaning_receipt
    cross_category:
    - trip
- id: damage_ext_cleaning_fee_on_approval
  base_policy_refs:
  - damage_agg_driver_report_volume
  - damage_evt_fee_charge
  overwrite:
  - base_policy: damage_evt_fee_charge
    superseded_clause: At a flat level the fee is the level's flat_fee
    replaced_by: Where the adjustments below apply, the fee basis and the lost driving time are added together, the sum is held to the vehicle fee cap, the Pass goodwill is then subtracted, and the result is reduced by the member-tenure goodwill percentage; the total is rounded half up to the cent once, at the end.
  trigger: state_due
  subject:
  - damage_approve_charge
  - damage_fee_charge
  computes: fee_charged
  target_tool: approve_cleaning_fee_charge_639a45e8
  params:
    standard_cap_multiple: 2.5
    premium_cap_multiple: 3.0
    three_row_cap_multiple: 3.8
    lost_day_rate: 30.0
    plus_tier_goodwill: 20.0
    base_tier_goodwill: 10.0
    tenure_long_months: 12
    tenure_mid_months: 3
    tenure_long_pct: 0.08
    tenure_mid_pct: 0.04
  rule: 'A cleaning fee report under review is approved at the cleaning level it holds and its fee is charged to the rider who requested the trip in the same step; the fee charged on approval is the amount booked as the fee charge. In the standard approval the fee charged is the flat fee of the level held (flat_fee), never more than the standard cap multiple of that flat fee, rounded half up to the cent. Where the adjustments below apply, the fee basis and the lost driving time are added together, the sum is held to the vehicle fee cap, the Pass goodwill is then subtracted, and the result is reduced by the member-tenure goodwill percentage; the total is rounded half up to the cent once, at the end. The fee basis of an approved cleaning fee is worked out from the level held and the evidence on file: when the level held requires professional cleaning (professional_cleaning_required), a professional cleaning document is on the evidence ledger and a cleaning cost is on file, the fee basis is the cleaning cost on file; when the level held does not require professional cleaning and either a cleaning cost is on file or a fee was assessed on the report at review, the fee basis is the larger of the cleaning cost on file and the fee at the level, which is the fee assessed at review where one was assessed and the level''s flat fee otherwise; in any other case the fee basis is the level''s flat fee. The lost driving time of an approved cleaning fee is worked out from the level held and the evidence on file: when the level held assumes the vehicle was taken offline (vehicle_offline_expected) and a professional cleaning document is on the evidence ledger, it is the daily lost-time rate for each calendar day from the reported trip''s drop-off date through the date of the latest professional cleaning document, both days counted; when the level assumes the vehicle was taken offline and no professional cleaning document is on file, it is the daily lost-time rate for one day; when the level does not assume the vehicle was taken offline, there is no lost driving time. The vehicle fee cap of an approved cleaning fee is a multiple of the flat fee of the level held, and the multiple is read from the reported trip''s ride option: a three-row option (Wayfare XL or Wayfare Black SUV) takes the three-row cap multiple; a premium two-row option (Wayfare Comfort or Wayfare Black) takes the premium cap multiple; any other ride option takes the standard cap multiple. The Pass goodwill of an approved cleaning fee is read from the rider''s Wayfare Pass membership in active status: Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual and Wayfare Pass All Access Annual take the Plus-tier goodwill; Wayfare Pass Monthly, Wayfare Pass Annual and Wayfare Pass Student take the base-tier goodwill; a rider with no active membership takes no Pass goodwill. The member-tenure goodwill percentage of an approved cleaning fee is read from the whole calendar months the rider''s active Wayfare Pass membership has run from its enrolled date to the approval date: the long-tenure months or more take the long-tenure percentage; from the mid-tenure months up to one month less than the long-tenure months take the mid-tenure percentage; fewer months, or no active membership, take no member-tenure goodwill. The fee charged on approval is fixed only after the fee level held on the assessment is one whose entry gate lists the incident category reported. The fee charged on approval is not fixed until every partner work order on the assessment''s evidence ledger carries its price in the cleaning cost on file. A cleaning fee is charged on approval only once the photos on file for the report reach the approval photo set for the level held.'
  prerequisite:
  - problem: damage_ext_review_move_down_fee
    kind: value_input
    gate: level_flat
    form: state
    policy_source: The fee charged on approval is fixed only after the fee level held on the assessment is one whose entry gate lists the incident category reported.
    condition: damage_assessments.variant_name names a level whose entry gate lists damage_assessments.incident_category.
    resolved_by: move_down_report_level_d77023ae
    effect: Once the report sits at the level its incident category allows, level_flat and the level parameters read by fee_basis and lost_time are those of the moved-down level, and assessed_at_review carries the fee assessed with the move.
  - problem: damage_ext_partner_work_order_price
    kind: value_input
    gate: cost_on_file
    form: state
    policy_source: The fee charged on approval is not fixed until every partner work order on the assessment's evidence ledger carries its price in the cleaning cost on file.
    condition: Where a professional cleaning document (damage_events.evidence_type cleaning_receipt) is on the assessment's ledger, damage_assessments.repair_receipt_amount is above zero.
    resolved_by: price_partner_work_order_4e0ef0e3
    effect: Once the partner work order is priced, cost_on_file holds its rate-card price instead of zero, which enters fee_basis as the cleaning cost on file.
  - problem: damage_ext_approval_photo_shortfall
    kind: state_gate
    gate: damage_assessments.photo_count
    form: state
    policy_source: A cleaning fee is charged on approval only once the photos on file for the report reach the approval photo set for the level held.
    condition: damage_assessments.photo_count is at least the approval photo set of the level held.
    resolved_by: upload_report_photos_a5022c03
    effect: Once the driver's photo upload lands, the photos on file reach the approval photo set, so the approval may be written.
  cross_category:
  - category: trip
    as: branch
    reads:
    - variant_name
    - dropoff_at
    note: The reported trip's ride option decides the vehicle fee cap and its drop-off date starts the lost driving time.
  - category: pass
    as: branch
    reads:
    - variant_name
    - status
    - enrolled_date
    note: The plan of the rider's active Wayfare Pass membership decides the Pass goodwill and its enrolled date the member-tenure goodwill.
  compute:
  - level_flat: P('flat_fee')
  - cost_on_file: F('repair_receipt_amount')
  - assessed_at_review: F('assessed_fee')
  - basis_documents: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - fee_basis: cost_on_file if P('professional_cleaning_required') and basis_documents > 0 and cost_on_file > 0 else (MX(cost_on_file, assessed_at_review if assessed_at_review > 0 else level_flat) if (not P('professional_cleaning_required')) and (cost_on_file > 0 or assessed_at_review > 0) else level_flat)
  - lost_documents: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - lost_document_date: LATEST('damage_events', 'event_date', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - lost_dropoff: CFIELD('trip', 'dropoff_at', trip_id=F('trip_id'))
  - lost_time: K('lost_day_rate') * (DAYS(lost_dropoff, lost_document_date) + 1) if P('vehicle_offline_expected') and lost_documents > 0 else (K('lost_day_rate') if P('vehicle_offline_expected') else 0.0)
  - cap_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - fee_cap: level_flat * (K('three_row_cap_multiple') if cap_option == 'Wayfare XL' or cap_option == 'Wayfare Black SUV' else (K('premium_cap_multiple') if cap_option == 'Wayfare Comfort' or cap_option == 'Wayfare Black' else K('standard_cap_multiple')))
  - capped_fee: MN(fee_basis + lost_time, fee_cap)
  - pass_plan: CFIELD('pass', 'variant_name', status='active')
  - pass_goodwill: K('plus_tier_goodwill') if pass_plan == 'Wayfare Pass Plus Monthly' or pass_plan == 'Wayfare Pass Plus Annual' or pass_plan == 'Wayfare Pass All Access Annual' else (K('base_tier_goodwill') if pass_plan == 'Wayfare Pass Monthly' or pass_plan == 'Wayfare Pass Annual' or pass_plan == 'Wayfare Pass Student' else 0.0)
  - tenure_months: MONTHS(CFIELD('pass', 'enrolled_date', status='active'), NOW) if EXISTS('pass', status='active') else 0
  - tenure_pct: K('tenure_long_pct') if tenure_months >= K('tenure_long_months') else (K('tenure_mid_pct') if tenure_months >= K('tenure_mid_months') else 0.0)
  - result: RND((capped_fee - pass_goodwill) * (1 - tenure_pct), 2)
  compute_basis:
    level_flat: In the standard approval the fee charged is the flat fee of the level held (flat_fee), never more than the standard cap multiple of that flat fee, rounded half up to the cent.
    basis_documents: a professional cleaning document is on the evidence ledger
    fee_basis: when the level held requires professional cleaning (professional_cleaning_required), a professional cleaning document is on the evidence ledger and a cleaning cost is on file, the fee basis is the cleaning cost on file; when the level held does not require professional cleaning and either a cleaning cost is on file or a fee was assessed on the report at review, the fee basis is the larger of the cleaning cost on file and the fee at the level, which is the fee assessed at review where one was assessed and the level's flat fee otherwise; in any other case the fee basis is the level's flat fee.
    lost_documents: a professional cleaning document is on the evidence ledger
    lost_document_date: the date of the latest professional cleaning document
    lost_dropoff: from the reported trip's drop-off date
    lost_time: when the level held assumes the vehicle was taken offline (vehicle_offline_expected) and a professional cleaning document is on the evidence ledger, it is the daily lost-time rate for each calendar day from the reported trip's drop-off date through the date of the latest professional cleaning document, both days counted; when the level assumes the vehicle was taken offline and no professional cleaning document is on file, it is the daily lost-time rate for one day; when the level does not assume the vehicle was taken offline, there is no lost driving time.
    cap_option: the multiple is read from the reported trip's ride option
    fee_cap: 'The vehicle fee cap of an approved cleaning fee is a multiple of the flat fee of the level held, and the multiple is read from the reported trip''s ride option: a three-row option (Wayfare XL or Wayfare Black SUV) takes the three-row cap multiple; a premium two-row option (Wayfare Comfort or Wayfare Black) takes the premium cap multiple; any other ride option takes the standard cap multiple.'
    capped_fee: the fee basis and the lost driving time are added together, the sum is held to the vehicle fee cap
    pass_plan: The Pass goodwill of an approved cleaning fee is read from the rider's Wayfare Pass membership in active status
    pass_goodwill: Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual and Wayfare Pass All Access Annual take the Plus-tier goodwill; Wayfare Pass Monthly, Wayfare Pass Annual and Wayfare Pass Student take the base-tier goodwill; a rider with no active membership takes no Pass goodwill.
    tenure_months: The member-tenure goodwill percentage of an approved cleaning fee is read from the whole calendar months the rider's active Wayfare Pass membership has run from its enrolled date to the approval date
    tenure_pct: the long-tenure months or more take the long-tenure percentage; from the mid-tenure months up to one month less than the long-tenure months take the mid-tenure percentage; fewer months, or no active membership, take no member-tenure goodwill.
    result: the Pass goodwill is then subtracted, and the result is reduced by the member-tenure goodwill percentage; the total is rounded half up to the cent once, at the end.
  factors:
  - id: fee_basis
    effect: method
    decides: fee_basis
    bindings:
    - basis_documents
    - fee_basis
    ladder:
    - when: the level held requires professional cleaning, a professional cleaning document is on the evidence ledger and a cleaning cost is on file
      method: the fee basis is the cleaning cost on file (the cost replaces the level fee)
    - when: the level held does not require professional cleaning and a cleaning cost is on file or a fee was assessed at review
      method: the fee basis is the larger of the cleaning cost on file and the fee at the level (assessed fee where one was assessed, otherwise the flat fee)
    - when: otherwise
      method: the fee basis is the level's flat fee
    baseline:
      fee_basis: level_flat
    evidence:
    - history
    cross_difficulty: null
  - id: lost_driving_time
    effect: method
    decides: lost_time
    bindings:
    - lost_documents
    - lost_document_date
    - lost_dropoff
    - lost_time
    ladder:
    - when: the level held assumes the vehicle was taken offline and a professional cleaning document is on the evidence ledger
      method: the daily lost-time rate times the calendar days from the trip's drop-off date through the latest professional cleaning document date, both days counted
    - when: the level held assumes the vehicle was taken offline and no professional cleaning document is on file
      method: the daily lost-time rate for one day
    - when: otherwise
      method: no lost driving time
    baseline:
      lost_time: '0.0'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: trip
  - id: vehicle_fee_cap
    effect: parameter
    decides: fee_cap
    bindings:
    - cap_option
    - fee_cap
    ladder:
    - when: the reported trip's ride option is Wayfare XL or Wayfare Black SUV
      value: K('three_row_cap_multiple') times the level's flat fee
    - when: the reported trip's ride option is Wayfare Comfort or Wayfare Black
      value: K('premium_cap_multiple') times the level's flat fee
    - when: otherwise
      value: K('standard_cap_multiple') times the level's flat fee
    baseline:
      fee_cap: level_flat * K('standard_cap_multiple')
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: pass_goodwill
    effect: parameter
    decides: pass_goodwill
    bindings:
    - pass_plan
    - pass_goodwill
    ladder:
    - when: the rider's active membership is Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual or Wayfare Pass All Access Annual
      value: K('plus_tier_goodwill')
    - when: the rider's active membership is Wayfare Pass Monthly, Wayfare Pass Annual or Wayfare Pass Student
      value: K('base_tier_goodwill')
    - when: otherwise (no active membership)
      value: '0.0'
    baseline:
      pass_goodwill: '0.0'
    evidence:
    - cross_category
    cross_difficulty: pass
  - id: member_tenure_goodwill
    effect: parameter
    decides: tenure_pct
    bindings:
    - tenure_months
    - tenure_pct
    ladder:
    - when: the rider's active Wayfare Pass membership has run the long-tenure months or more since its enrolled date
      value: K('tenure_long_pct')
    - when: it has run from the mid-tenure months up to one month less than the long-tenure months
      value: K('tenure_mid_pct')
    - when: otherwise (fewer months, or no active membership)
      value: '0.0'
    baseline:
      tenure_pct: '0.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: pass
  baseline:
    rule: A cleaning fee report under review is approved at the cleaning level it holds and its fee is charged to the rider who requested the trip in the same step; the fee charged on approval is the amount booked as the fee charge. In the standard approval the fee charged is the flat fee of the level held (flat_fee), never more than the standard cap multiple of that flat fee, rounded half up to the cent.
    params:
    - flat_fee
    - standard_cap_multiple
  inputs:
    history:
    - table: damage_events
      aggregate: count
      field: damage_event_id
      filters:
        event_type: damage_evidence_submit
        evidence_type: cleaning_receipt
    - table: damage_events
      aggregate: latest
      field: event_date
      filters:
        event_type: damage_evidence_submit
        evidence_type: cleaning_receipt
    cross_category:
    - trip
    - pass
- id: damage_ext_repair_schedule_estimate
  base_policy_refs:
  - damage_filing_and_evidence
  overwrite: []
  trigger: state_due
  subject:
  - damage_evidence_submit
  - damage_evidence_update
  computes: schedule_estimate_amount
  target_tool: file_schedule_repair_estimate_16065485
  params:
    parts_exterior: 152.0
    parts_interior: 118.0
    labor_hours_exterior: 2.0
    labor_hours_interior: 1.5
    standard_labor_rate: 90.0
    mid_labor_rate: 108.0
    high_labor_rate: 118.0
    spot_paint: 85.0
    blend_hours_per_panel: 0.8
    blended_panels: 2
    luxury_parts_mult: 1.45
    premium_parts_mult: 1.2
    arizona_parts_tax: 0.086
    nevada_parts_tax: 0.0838
    standard_parts_tax: 0.0725
    full_calibration: 95.0
    partial_calibration: 40.0
    schedule_tolerance: 0.2
    refinish_labor_rate: 108.0
  rule: 'For a receipt-based damage report under review, the Wayfare repair schedule estimate is the repair amount the Wayfare repair schedule gives for the level held; when the shop estimate on file is more than the schedule tolerance above the schedule estimate, the driver files the schedule estimate as a second repair estimate, its amount replaces the shop estimate''s amount as the repair amount on file (repair_receipt_amount), and both estimates stay on the evidence ledger. In the standard schedule the estimate is the level''s standard parts allowance with the standard parts tax added to it, plus the level''s standard labor hours at the standard labor rate, plus one spot paint charge, rounded half up to the cent. Where the adjustments below apply, the parts allowance is first multiplied by the parts tier multiplier and the parts tax is then added to that amount; the labor hours are priced at the metro labor rate; the paint charge follows the paint method; the sensor calibration charge is added; the total is rounded half up to the cent once, at the end. The parts tier multiplier of a schedule estimate is read from the reported trip''s ride option: Wayfare Black and Wayfare Black SUV take the luxury parts multiplier; Wayfare Comfort and Wayfare XL take the premium parts multiplier; any other ride option takes a multiplier of one. The metro labor rate of a schedule estimate is read from the market the reported trip started in: Denver, Salt Lake City and Las Vegas take the high-cost labor rate; Phoenix, Tucson and Colorado Springs take the mid-cost labor rate; any other market takes the standard labor rate. The paint method of a schedule estimate depends on the level held and the reported trip''s ride option: an exterior repair on Wayfare Black or Wayfare Black SUV is blended, priced as the blend paint hours for each of the blended panels (the damaged panel and one adjacent panel) at the schedule''s refinish labor rate; an interior repair takes no paint charge; any other repair takes the spot paint charge. The parts tax of a schedule estimate is read from the state of the market the reported trip started in: Phoenix and Tucson (Arizona) take the Arizona parts tax rate; Las Vegas (Nevada) takes the Nevada parts tax rate; any other market takes the standard parts tax rate. The sensor calibration charge of a schedule estimate depends on the level held and the reported trip''s ride option: an exterior repair on Wayfare Black or Wayfare Black SUV takes the full calibration charge; an exterior repair on Wayfare Comfort or Wayfare XL, or an interior repair on Wayfare Black or Wayfare Black SUV, takes the partial calibration charge; any other repair takes no calibration charge.'
  prerequisite: []
  cross_category:
  - category: trip
    as: branch
    reads:
    - variant_name
    - market
    note: The reported trip's ride option decides the parts tier, the paint method and the calibration charge; its market decides the labor rate and the parts tax.
  compute:
  - is_exterior: F('variant_name') == 'Damage Fee (Exterior Repair)'
  - parts_allowance: K('parts_exterior') if is_exterior else K('parts_interior')
  - labor_hours: K('labor_hours_exterior') if is_exterior else K('labor_hours_interior')
  - parts_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - parts_mult: K('luxury_parts_mult') if parts_option == 'Wayfare Black' or parts_option == 'Wayfare Black SUV' else (K('premium_parts_mult') if parts_option == 'Wayfare Comfort' or parts_option == 'Wayfare XL' else 1.0)
  - labor_market: CFIELD('trip', 'market', trip_id=F('trip_id'))
  - labor_rate: K('high_labor_rate') if labor_market == 'DEN' or labor_market == 'SLC' or labor_market == 'LAS' else (K('mid_labor_rate') if labor_market == 'PHX' or labor_market == 'TUS' or labor_market == 'COS' else K('standard_labor_rate'))
  - paint_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - paint_charge: K('blend_hours_per_panel') * K('blended_panels') * K('refinish_labor_rate') if is_exterior and (paint_option == 'Wayfare Black' or paint_option == 'Wayfare Black SUV') else (0.0 if F('variant_name') == 'Damage Fee (Interior Repair)' else K('spot_paint'))
  - tax_market: CFIELD('trip', 'market', trip_id=F('trip_id'))
  - parts_tax_rate: K('arizona_parts_tax') if tax_market == 'PHX' or tax_market == 'TUS' else (K('nevada_parts_tax') if tax_market == 'LAS' else K('standard_parts_tax'))
  - calibration_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - calibration_charge: K('full_calibration') if is_exterior and (calibration_option == 'Wayfare Black' or calibration_option == 'Wayfare Black SUV') else (K('partial_calibration') if (is_exterior and (calibration_option == 'Wayfare Comfort' or calibration_option == 'Wayfare XL')) or ((not is_exterior) and (calibration_option == 'Wayfare Black' or calibration_option == 'Wayfare Black SUV')) else 0.0)
  - result: RND(parts_allowance * parts_mult * (1 + parts_tax_rate) + labor_hours * labor_rate + paint_charge + calibration_charge, 2)
  compute_basis:
    parts_allowance: In the standard schedule the estimate is the level's standard parts allowance with the standard parts tax added to it, plus the level's standard labor hours at the standard labor rate, plus one spot paint charge, rounded half up to the cent.
    labor_hours: plus the level's standard labor hours at the standard labor rate
    parts_option: The parts tier multiplier of a schedule estimate is read from the reported trip's ride option
    parts_mult: Wayfare Black and Wayfare Black SUV take the luxury parts multiplier; Wayfare Comfort and Wayfare XL take the premium parts multiplier; any other ride option takes a multiplier of one.
    labor_market: The metro labor rate of a schedule estimate is read from the market the reported trip started in
    labor_rate: Denver, Salt Lake City and Las Vegas take the high-cost labor rate; Phoenix, Tucson and Colorado Springs take the mid-cost labor rate; any other market takes the standard labor rate.
    paint_option: The paint method of a schedule estimate depends on the level held and the reported trip's ride option
    paint_charge: an exterior repair on Wayfare Black or Wayfare Black SUV is blended, priced as the blend paint hours for each of the blended panels (the damaged panel and one adjacent panel) at the schedule's refinish labor rate; an interior repair takes no paint charge; any other repair takes the spot paint charge.
    tax_market: The parts tax of a schedule estimate is read from the state of the market the reported trip started in
    parts_tax_rate: Phoenix and Tucson (Arizona) take the Arizona parts tax rate; Las Vegas (Nevada) takes the Nevada parts tax rate; any other market takes the standard parts tax rate.
    calibration_option: The sensor calibration charge of a schedule estimate depends on the level held and the reported trip's ride option
    calibration_charge: an exterior repair on Wayfare Black or Wayfare Black SUV takes the full calibration charge; an exterior repair on Wayfare Comfort or Wayfare XL, or an interior repair on Wayfare Black or Wayfare Black SUV, takes the partial calibration charge; any other repair takes no calibration charge.
    result: the parts allowance is first multiplied by the parts tier multiplier and the parts tax is then added to that amount; the labor hours are priced at the metro labor rate; the paint charge follows the paint method; the sensor calibration charge is added; the total is rounded half up to the cent once, at the end.
  factors:
  - id: parts_tier
    effect: parameter
    decides: parts_mult
    bindings:
    - parts_option
    - parts_mult
    ladder:
    - when: the reported trip's ride option is Wayfare Black or Wayfare Black SUV
      value: K('luxury_parts_mult')
    - when: the reported trip's ride option is Wayfare Comfort or Wayfare XL
      value: K('premium_parts_mult')
    - when: otherwise
      value: '1.0'
    baseline:
      parts_mult: '1.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: metro_labor_rate
    effect: parameter
    decides: labor_rate
    bindings:
    - labor_market
    - labor_rate
    ladder:
    - when: the reported trip started in Denver, Salt Lake City or Las Vegas
      value: K('high_labor_rate')
    - when: the reported trip started in Phoenix, Tucson or Colorado Springs
      value: K('mid_labor_rate')
    - when: otherwise
      value: K('standard_labor_rate')
    baseline:
      labor_rate: K('standard_labor_rate')
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: paint_method
    effect: method
    decides: paint_charge
    bindings:
    - paint_option
    - paint_charge
    ladder:
    - when: an exterior repair on Wayfare Black or Wayfare Black SUV
      method: 'blended paint: the blend paint hours for each of the two blended panels, priced at the schedule''s refinish labor rate'
    - when: an interior repair
      method: no paint charge
    - when: otherwise
      method: one flat spot paint charge
    baseline:
      paint_charge: K('spot_paint')
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: parts_tax
    effect: parameter
    decides: parts_tax_rate
    bindings:
    - tax_market
    - parts_tax_rate
    ladder:
    - when: the reported trip started in Phoenix or Tucson (Arizona)
      value: K('arizona_parts_tax')
    - when: the reported trip started in Las Vegas (Nevada)
      value: K('nevada_parts_tax')
    - when: otherwise
      value: K('standard_parts_tax')
    baseline:
      parts_tax_rate: K('standard_parts_tax')
    evidence:
    - cross_category
    cross_difficulty: trip
  - id: sensor_calibration
    effect: parameter
    decides: calibration_charge
    bindings:
    - calibration_option
    - calibration_charge
    ladder:
    - when: an exterior repair and the reported trip's ride option is Wayfare Black or Wayfare Black SUV
      value: K('full_calibration')
    - when: an exterior repair on Wayfare Comfort or Wayfare XL, or an interior repair on Wayfare Black or Wayfare Black SUV
      value: K('partial_calibration')
    - when: otherwise
      value: '0.0'
    baseline:
      calibration_charge: '0.0'
    evidence:
    - cross_category
    cross_difficulty: trip
  baseline:
    rule: For a receipt-based damage report under review, the Wayfare repair schedule estimate is the repair amount the Wayfare repair schedule gives for the level held; when the shop estimate on file is more than the schedule tolerance above the schedule estimate, the driver files the schedule estimate as a second repair estimate, its amount replaces the shop estimate's amount as the repair amount on file (repair_receipt_amount), and both estimates stay on the evidence ledger. In the standard schedule the estimate is the level's standard parts allowance with the standard parts tax added to it, plus the level's standard labor hours at the standard labor rate, plus one spot paint charge, rounded half up to the cent.
    params:
    - parts_exterior
    - parts_interior
    - labor_hours_exterior
    - labor_hours_interior
    - standard_labor_rate
    - spot_paint
    - standard_parts_tax
    - schedule_tolerance
  inputs:
    history: []
    cross_category:
    - trip
- id: damage_ext_damage_fee_on_approval
  base_policy_refs:
  - damage_agg_driver_report_volume
  - damage_evt_fee_charge
  overwrite:
  - base_policy: damage_evt_fee_charge
    superseded_clause: at a receipt-based level it is the receipt or estimate amount on file (estimate_settles_fee), capped at receipt_fee_cap
    replaced_by: Where the adjustments below apply, the repair amount on file is first multiplied by the estimate settlement share and the lost driving time is added to that; the sum is held to the vehicle damage cap; the Pass goodwill is then subtracted and the result is reduced by the trip-volume goodwill percentage; the total is rounded half up to the cent once, at the end.
  trigger: state_due
  subject:
  - damage_approve_charge
  - damage_fee_charge
  computes: fee_charged
  target_tool: approve_damage_fee_charge_55ca59de
  params:
    single_estimate_share: 0.85
    corroborated_estimate_share: 0.95
    damage_day_rate: 55.0
    luxury_damage_cap: 1000.0
    premium_damage_cap: 850.0
    plus_tier_damage_goodwill: 25.0
    base_tier_damage_goodwill: 10.0
    volume_high_trips: 6
    volume_mid_trips: 2
    volume_high_pct: 0.05
    volume_mid_pct: 0.03
  rule: 'A receipt-based damage report under review is approved at the damage level it holds and its fee is charged to the rider who requested the trip in the same step; the fee charged on approval is the amount booked as the fee charge. In the standard approval the fee charged is the repair amount on file (repair_receipt_amount), never more than the level''s receipt fee cap (receipt_fee_cap), rounded half up to the cent. Where the adjustments below apply, the repair amount on file is first multiplied by the estimate settlement share and the lost driving time is added to that; the sum is held to the vehicle damage cap; the Pass goodwill is then subtracted and the result is reduced by the trip-volume goodwill percentage; the total is rounded half up to the cent once, at the end. The estimate settlement share of an approved damage fee is read from the repair documents on the evidence ledger: when no final repair receipt is on file and exactly one repair estimate submission is on file, it is the single-estimate share; when no final repair receipt is on file and two or more repair estimate submissions are on file (a shop estimate checked against a second estimate), it is the corroborated-estimate share; when a final repair receipt is on file the whole repair amount on file is settled. The lost driving time of an approved damage fee depends on the level held and the reported trip''s ride option: an exterior repair on Wayfare Black or Wayfare Black SUV, whose vehicle stays off premium service until the panel and calibration work is booked, takes the daily damage lost-time rate for each calendar day from the reported trip''s drop-off date through the date of the latest repair estimate or receipt on the assessment''s evidence ledger (the report date when none is on the ledger), both days counted; an exterior repair on any other ride option takes the daily damage lost-time rate for one day; an interior repair, which leaves the vehicle drivable, takes no lost driving time. The vehicle damage cap of an approved damage fee is read from the reported trip''s ride option: Wayfare Black and Wayfare Black SUV take the luxury damage cap; Wayfare Comfort and Wayfare XL take the premium damage cap; any other ride option takes the level''s receipt fee cap. For an approved damage fee the cap beyond which the part of a repair is never charged to the rider and is referred to the insurance claim desk is the vehicle damage cap. The Pass goodwill of an approved damage fee is read from the rider''s Wayfare Pass membership in active status: Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual and Wayfare Pass All Access Annual take the Plus-tier damage goodwill; Wayfare Pass Monthly, Wayfare Pass Annual and Wayfare Pass Student take the base-tier damage goodwill; a rider with no active membership takes no Pass goodwill. The trip-volume goodwill percentage of an approved damage fee is read from the rider''s trip fare charges whose charge date lies fewer than six whole calendar months before the approval date: a count at or above the high-volume trip count takes the high-volume percentage; a count from the mid-volume trip count up to one less than the high-volume trip count takes the mid-volume percentage; a lower count takes no trip-volume goodwill. A damage fee charged on approval is fixed only after the repair amount on file is no more than the Wayfare repair schedule estimate for the repair increased by the schedule tolerance. A damage fee is charged to a rider only after each earlier charged fee assessment of that rider is held at a level whose entry gate lists its incident category and, where that level is below the level its fee was charged at, carries a level-difference refund booked at the level it is held at.'
  prerequisite:
  - problem: damage_ext_repair_schedule_estimate
    kind: value_input
    gate: amount_on_file
    form: state
    policy_source: A damage fee charged on approval is fixed only after the repair amount on file is no more than the Wayfare repair schedule estimate for the repair increased by the schedule tolerance.
    condition: damage_assessments.repair_receipt_amount is at most the Wayfare repair schedule estimate for the level held and the reported trip, increased by the schedule tolerance.
    resolved_by: file_schedule_repair_estimate_16065485
    effect: Once the schedule estimate is filed, amount_on_file holds the schedule amount instead of the shop estimate, and a second repair estimate submission is on the ledger, which also changes the estimate settlement share and the latest repair document date read by the lost driving time.
  - problem: damage_ext_level_correction_refund
    kind: state_gate
    gate: damage_events.fee_level
    form: state
    policy_source: A damage fee is charged to a rider only after each earlier charged fee assessment of that rider is held at a level whose entry gate lists its incident category and, where that level is below the level its fee was charged at, carries a level-difference refund booked at the level it is held at.
    condition: 'For every other damage_assessments row of the rider (same customer_id) with a damage_fee_charge on its ledger: variant_name names a level whose entry gate lists incident_category, and if variant_name is below the fee_level of its damage_fee_charge, its ledger carries a damage_fee_partial_refund whose fee_level equals variant_name.'
    resolved_by: refund_level_difference_30807e99
    effect: Once the refund at the corrected level is booked on the rider's earlier assessment, every earlier charged fee of the rider stands at a gate-listing level with its level-difference refund booked, so the approval of the new damage fee may be written.
  cross_category:
  - category: trip
    as: history
    reads:
    - variant_name
    - dropoff_at
    - trip_charges.event_type
    - trip_charges.charge_date
    note: The reported trip's ride option decides the vehicle damage cap and the lost-driving-time method, its drop-off date starts the lost driving time, and the rider's trip fare charges in the last six months decide the trip-volume goodwill.
  - category: pass
    as: branch
    reads:
    - variant_name
    - status
    note: The plan of the rider's active Wayfare Pass membership decides the Pass goodwill.
  compute:
  - amount_on_file: F('repair_receipt_amount')
  - level_cap: P('receipt_fee_cap')
  - settle_receipts: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='repair_receipt')
  - settle_estimates: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='repair_estimate')
  - settlement_share: K('single_estimate_share') if settle_receipts == 0 and settle_estimates == 1 else (K('corroborated_estimate_share') if settle_receipts == 0 and settle_estimates >= 2 else 1.0)
  - lost_estimates: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='repair_estimate')
  - lost_receipts: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='repair_receipt')
  - lost_estimate_date: LATEST('damage_events', 'event_date', event_type='damage_evidence_submit', evidence_type='repair_estimate') if lost_estimates > 0 else '0000-00-00'
  - lost_receipt_date: LATEST('damage_events', 'event_date', event_type='damage_evidence_submit', evidence_type='repair_receipt') if lost_receipts > 0 else '0000-00-00'
  - lost_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - lost_dropoff: CFIELD('trip', 'dropoff_at', trip_id=F('trip_id'))
  - lost_time: K('damage_day_rate') * (DAYS(lost_dropoff, MX(lost_estimate_date, lost_receipt_date) if lost_estimates + lost_receipts > 0 else F('reported_at')) + 1) if F('variant_name') == 'Damage Fee (Exterior Repair)' and (lost_option == 'Wayfare Black' or lost_option == 'Wayfare Black SUV') else (K('damage_day_rate') if F('variant_name') == 'Damage Fee (Exterior Repair)' else 0.0)
  - cap_option: CFIELD('trip', 'variant_name', trip_id=F('trip_id'))
  - damage_cap: K('luxury_damage_cap') if cap_option == 'Wayfare Black' or cap_option == 'Wayfare Black SUV' else (K('premium_damage_cap') if cap_option == 'Wayfare Comfort' or cap_option == 'Wayfare XL' else level_cap)
  - capped_fee: MN(amount_on_file * settlement_share + lost_time, damage_cap)
  - pass_plan: CFIELD('pass', 'variant_name', status='active')
  - pass_goodwill: K('plus_tier_damage_goodwill') if pass_plan == 'Wayfare Pass Plus Monthly' or pass_plan == 'Wayfare Pass Plus Annual' or pass_plan == 'Wayfare Pass All Access Annual' else (K('base_tier_damage_goodwill') if pass_plan == 'Wayfare Pass Monthly' or pass_plan == 'Wayfare Pass Annual' or pass_plan == 'Wayfare Pass Student' else 0.0)
  - recent_trips: XCOUNT('trip', 'trip_charges', within_months=6, date_field='charge_date', event_type='trip_fare_charge')
  - volume_pct: K('volume_high_pct') if recent_trips >= K('volume_high_trips') else (K('volume_mid_pct') if recent_trips >= K('volume_mid_trips') else 0.0)
  - result: RND((capped_fee - pass_goodwill) * (1 - volume_pct), 2)
  compute_basis:
    amount_on_file: In the standard approval the fee charged is the repair amount on file (repair_receipt_amount), never more than the level's receipt fee cap (receipt_fee_cap), rounded half up to the cent.
    level_cap: never more than the level's receipt fee cap (receipt_fee_cap)
    settle_receipts: The estimate settlement share of an approved damage fee is read from the repair documents on the evidence ledger
    settle_estimates: The estimate settlement share of an approved damage fee is read from the repair documents on the evidence ledger
    settlement_share: when no final repair receipt is on file and exactly one repair estimate submission is on file, it is the single-estimate share; when no final repair receipt is on file and two or more repair estimate submissions are on file (a shop estimate checked against a second estimate), it is the corroborated-estimate share; when a final repair receipt is on file the whole repair amount on file is settled.
    lost_estimates: the latest repair estimate or receipt on the assessment's evidence ledger (the report date when none is on the ledger)
    lost_receipts: the latest repair estimate or receipt on the assessment's evidence ledger (the report date when none is on the ledger)
    lost_estimate_date: through the date of the latest repair estimate or receipt on the assessment's evidence ledger (the report date when none is on the ledger), both days counted
    lost_receipt_date: through the date of the latest repair estimate or receipt on the assessment's evidence ledger (the report date when none is on the ledger), both days counted
    lost_option: The lost driving time of an approved damage fee depends on the level held and the reported trip's ride option
    lost_dropoff: from the reported trip's drop-off date
    lost_time: an exterior repair on Wayfare Black or Wayfare Black SUV, whose vehicle stays off premium service until the panel and calibration work is booked, takes the daily damage lost-time rate for each calendar day from the reported trip's drop-off date through the date of the latest repair estimate or receipt on the assessment's evidence ledger (the report date when none is on the ledger), both days counted; an exterior repair on any other ride option takes the daily damage lost-time rate for one day; an interior repair, which leaves the vehicle drivable, takes no lost driving time.
    cap_option: The vehicle damage cap of an approved damage fee is read from the reported trip's ride option
    damage_cap: Wayfare Black and Wayfare Black SUV take the luxury damage cap; Wayfare Comfort and Wayfare XL take the premium damage cap; any other ride option takes the level's receipt fee cap.
    capped_fee: the repair amount on file is first multiplied by the estimate settlement share and the lost driving time is added to that; the sum is held to the vehicle damage cap
    pass_plan: The Pass goodwill of an approved damage fee is read from the rider's Wayfare Pass membership in active status
    pass_goodwill: Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual and Wayfare Pass All Access Annual take the Plus-tier damage goodwill; Wayfare Pass Monthly, Wayfare Pass Annual and Wayfare Pass Student take the base-tier damage goodwill; a rider with no active membership takes no Pass goodwill.
    recent_trips: The trip-volume goodwill percentage of an approved damage fee is read from the rider's trip fare charges whose charge date lies fewer than six whole calendar months before the approval date
    volume_pct: a count at or above the high-volume trip count takes the high-volume percentage; a count from the mid-volume trip count up to one less than the high-volume trip count takes the mid-volume percentage; a lower count takes no trip-volume goodwill.
    result: the Pass goodwill is then subtracted and the result is reduced by the trip-volume goodwill percentage; the total is rounded half up to the cent once, at the end.
  factors:
  - id: estimate_settlement
    effect: parameter
    decides: settlement_share
    bindings:
    - settle_receipts
    - settle_estimates
    - settlement_share
    ladder:
    - when: no final repair receipt is on file and exactly one repair estimate submission is on file
      value: K('single_estimate_share')
    - when: no final repair receipt is on file and two or more repair estimate submissions are on file
      value: K('corroborated_estimate_share')
    - when: otherwise (a final repair receipt is on file)
      value: '1.0'
    baseline:
      settlement_share: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: damage_lost_time
    effect: method
    decides: lost_time
    bindings:
    - lost_estimates
    - lost_receipts
    - lost_estimate_date
    - lost_receipt_date
    - lost_option
    - lost_dropoff
    - lost_time
    ladder:
    - when: an exterior repair on Wayfare Black or Wayfare Black SUV
      method: the daily damage lost-time rate times the calendar days from the trip's drop-off date through the latest repair estimate or receipt date on the ledger (report date if none), both days counted
    - when: an exterior repair on any other ride option
      method: the daily damage lost-time rate for one day
    - when: otherwise (an interior repair)
      method: no lost driving time
    baseline:
      lost_time: '0.0'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: trip
  - id: vehicle_damage_cap
    effect: parameter
    decides: damage_cap
    bindings:
    - cap_option
    - damage_cap
    ladder:
    - when: the reported trip's ride option is Wayfare Black or Wayfare Black SUV
      value: K('luxury_damage_cap')
    - when: the reported trip's ride option is Wayfare Comfort or Wayfare XL
      value: K('premium_damage_cap')
    - when: otherwise
      value: the level's receipt fee cap (receipt_fee_cap)
    baseline:
      damage_cap: level_cap
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: trip
  - id: damage_pass_goodwill
    effect: parameter
    decides: pass_goodwill
    bindings:
    - pass_plan
    - pass_goodwill
    ladder:
    - when: the rider's active membership is Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual or Wayfare Pass All Access Annual
      value: K('plus_tier_damage_goodwill')
    - when: the rider's active membership is Wayfare Pass Monthly, Wayfare Pass Annual or Wayfare Pass Student
      value: K('base_tier_damage_goodwill')
    - when: otherwise (no active membership)
      value: '0.0'
    baseline:
      pass_goodwill: '0.0'
    evidence:
    - cross_category
    cross_difficulty: pass
  - id: damage_trip_volume
    effect: parameter
    decides: volume_pct
    bindings:
    - recent_trips
    - volume_pct
    ladder:
    - when: the rider's trip fare charges in the last six whole months reach the high-volume trip count
      value: K('volume_high_pct')
    - when: they reach the mid-volume trip count but not the high-volume trip count
      value: K('volume_mid_pct')
    - when: otherwise
      value: '0.0'
    baseline:
      volume_pct: '0.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: trip
  baseline:
    rule: A receipt-based damage report under review is approved at the damage level it holds and its fee is charged to the rider who requested the trip in the same step; the fee charged on approval is the amount booked as the fee charge. In the standard approval the fee charged is the repair amount on file (repair_receipt_amount), never more than the level's receipt fee cap (receipt_fee_cap), rounded half up to the cent.
    params:
    - receipt_fee_cap
  inputs:
    history:
    - table: damage_events
      aggregate: count
      field: damage_event_id
      filters:
        event_type: damage_evidence_submit
        evidence_type: repair_estimate
    - table: damage_events
      aggregate: count
      field: damage_event_id
      filters:
        event_type: damage_evidence_submit
        evidence_type: repair_receipt
    - table: damage_events
      aggregate: latest
      field: event_date
      filters:
        event_type: damage_evidence_submit
    - category: trip
      table: trip_charges
      aggregate: count
      field: trip_charge_id
      within_months: 6
      filters:
        event_type: trip_fare_charge
    cross_category:
    - trip
    - pass
- id: damage_ext_upheld_level_correction_fee
  base_policy_refs:
  - damage_level_classification
  - damage_evt_refunds
  - damage_evt_fee_charge
  - damage_dispute_rules
  overwrite:
  - base_policy: damage_evt_fee_charge
    superseded_clause: At a flat level the fee is the level's flat_fee
    replaced_by: Where the adjustments below apply, the carried fee is worked out first; the lost-time removal is subtracted from it, never going below zero; the result is reduced by the correction credit percentage and then by the overcharge-age credit percentage; the total is rounded half up to the cent once, at the end.
  - base_policy: damage_level_classification
    superseded_clause: A report is held at the lowest level whose definition matches the evidence on file
    replaced_by: A charged cleaning fee whose assessment is held at a cleaning level whose entry gate does not list the incident category reported, whether the charge stands undisputed, disputed or upheld, is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee standing at that level is recorded with the move.
  trigger: state_due
  subject:
  - damage_reclassify
  computes: fee_standing
  target_tool: correct_upheld_fee_level_42a82f5f
  params:
    fee_level1: 25.0
    fee_level2: 60.0
    fee_level3: 100.0
    fee_level4: 150.0
    removal_day_rate: 30.0
    repeat_correction_credit: 0.1
    disputed_correction_credit: 0.05
    long_age_days: 45
    short_age_days: 15
    long_age_credit: 0.08
    short_age_credit: 0.04
  rule: 'A charged cleaning fee whose assessment is held at a cleaning level whose entry gate does not list the incident category reported, whether the charge stands undisputed, disputed or upheld, is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee standing at that level is recorded with the move. In the standard correction the fee standing at the level moved to is that level''s flat fee (flat_fee), rounded half up to the cent. Where the adjustments below apply, the carried fee is worked out first; the lost-time removal is subtracted from it, never going below zero; the result is reduced by the correction credit percentage and then by the overcharge-age credit percentage; the total is rounded half up to the cent once, at the end. The carried fee of a correction is worked out from the fee standing before the move, which is the fee charged less every refund already made on it, and from the flat fees of the two levels: when the fee standing before the move is above the flat fee of the level moved from, the carried fee is that standing fee scaled by the flat fee of the level moved to over the flat fee of the level moved from; when it is below the flat fee of the level moved from, the carried fee is the standing fee less the difference between the two flat fees, never below zero; when it equals the flat fee of the level moved from, the carried fee is the flat fee of the level moved to. The lost-time removal of a correction depends on the two levels and the evidence on file: when the level moved from assumes the vehicle was taken offline (vehicle_offline_expected), the level moved to does not, and a professional cleaning document is on the evidence ledger, it is the daily lost-time removal rate for each calendar day from the reported trip''s drop-off date through the date of the latest professional cleaning document, both days counted; when the level moved from assumes the vehicle was taken offline, the level moved to does not, and no professional cleaning document is on file, it is the daily lost-time removal rate for one day; otherwise there is no lost-time removal. The correction credit of a correction is read from the assessment''s refund and dispute history: a charge that already carries a level-difference refund takes the repeat-correction credit; a charge with no level-difference refund that the rider has disputed takes the disputed-correction credit; any other charge takes no correction credit. The overcharge-age credit of a correction is read from the calendar days from the charge date to the day of the correction: more than the long-age days take the long-age credit; from the short-age days up to the long-age days take the short-age credit; fewer days take no overcharge-age credit.'
  prerequisite: []
  cross_category:
  - category: trip
    as: branch
    reads:
    - dropoff_at
    note: The reported trip's drop-off date starts the days counted in the lost-time removal.
  compute:
  - held_rank: 4 if F('variant_name') == 'Cleaning Fee Level 4 (Major)' else (3 if F('variant_name') == 'Cleaning Fee Level 3 (Significant)' else (2 if F('variant_name') == 'Cleaning Fee Level 2 (Moderate)' else 1))
  - incident: F('incident_category')
  - new_rank: 4 if held_rank >= 4 and incident == 'bodily_fluids' else (3 if held_rank >= 3 and (incident == 'food_or_drink_spill' or incident == 'smoke_or_vape_odor' or incident == 'animal_hair_or_mess' or incident == 'bodily_fluids') else (2 if held_rank >= 2 and (incident == 'food_or_drink_spill' or incident == 'trash_or_debris' or incident == 'smoke_or_vape_odor' or incident == 'animal_hair_or_mess') else 1))
  - old_flat: K('fee_level4') if held_rank == 4 else (K('fee_level3') if held_rank == 3 else (K('fee_level2') if held_rank == 2 else K('fee_level1')))
  - new_flat: K('fee_level4') if new_rank == 4 else (K('fee_level3') if new_rank == 3 else (K('fee_level2') if new_rank == 2 else K('fee_level1')))
  - carry_charged: SUM('damage_events', 'amount', event_type='damage_fee_charge')
  - carry_refunded: SUM('damage_events', 'amount', event_type='damage_fee_partial_refund') + SUM('damage_events', 'amount', event_type='damage_fee_refund')
  - carried_fee: (carry_charged + carry_refunded) * new_flat / old_flat if carry_charged + carry_refunded > old_flat else (MX(0, carry_charged + carry_refunded - (old_flat - new_flat)) if carry_charged + carry_refunded < old_flat else new_flat)
  - removal_documents: COUNT('damage_events', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - removal_document_date: LATEST('damage_events', 'event_date', event_type='damage_evidence_submit', evidence_type='cleaning_receipt')
  - removal_dropoff: CFIELD('trip', 'dropoff_at', trip_id=F('trip_id'))
  - lost_removal: K('removal_day_rate') * (DAYS(removal_dropoff, removal_document_date) + 1) if held_rank >= 3 and new_rank <= 2 and removal_documents > 0 else (K('removal_day_rate') if held_rank >= 3 and new_rank <= 2 else 0.0)
  - prior_refunds: COUNT('damage_events', event_type='damage_fee_partial_refund')
  - correction_pct: K('repeat_correction_credit') if prior_refunds > 0 else (K('disputed_correction_credit') if F('dispute_filed_date') != '' else 0.0)
  - age_days: DAYS(F('charged_date'), NOW)
  - age_pct: K('long_age_credit') if age_days > K('long_age_days') else (K('short_age_credit') if age_days >= K('short_age_days') else 0.0)
  - result: RND(MX(0, carried_fee - lost_removal) * (1 - correction_pct) * (1 - age_pct), 2)
  compute_basis:
    new_rank: A charged cleaning fee whose assessment is held at a cleaning level whose entry gate does not list the incident category reported, whether the charge stands undisputed, disputed or upheld, is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee standing at that level is recorded with the move.
    new_flat: In the standard correction the fee standing at the level moved to is that level's flat fee (flat_fee), rounded half up to the cent.
    old_flat: the flat fee of the level moved from
    carry_charged: the fee standing before the move, which is the fee charged less every refund already made on it
    carry_refunded: the fee standing before the move, which is the fee charged less every refund already made on it
    carried_fee: when the fee standing before the move is above the flat fee of the level moved from, the carried fee is that standing fee scaled by the flat fee of the level moved to over the flat fee of the level moved from; when it is below the flat fee of the level moved from, the carried fee is the standing fee less the difference between the two flat fees, never below zero; when it equals the flat fee of the level moved from, the carried fee is the flat fee of the level moved to.
    removal_documents: a professional cleaning document is on the evidence ledger
    removal_document_date: the date of the latest professional cleaning document
    removal_dropoff: from the reported trip's drop-off date
    lost_removal: when the level moved from assumes the vehicle was taken offline (vehicle_offline_expected), the level moved to does not, and a professional cleaning document is on the evidence ledger, it is the daily lost-time removal rate for each calendar day from the reported trip's drop-off date through the date of the latest professional cleaning document, both days counted; when the level moved from assumes the vehicle was taken offline, the level moved to does not, and no professional cleaning document is on file, it is the daily lost-time removal rate for one day; otherwise there is no lost-time removal.
    prior_refunds: The correction credit of a correction is read from the assessment's refund and dispute history
    correction_pct: a charge that already carries a level-difference refund takes the repeat-correction credit; a charge with no level-difference refund that the rider has disputed takes the disputed-correction credit; any other charge takes no correction credit.
    age_days: The overcharge-age credit of a correction is read from the calendar days from the charge date to the day of the correction
    age_pct: more than the long-age days take the long-age credit; from the short-age days up to the long-age days take the short-age credit; fewer days take no overcharge-age credit.
    result: the lost-time removal is subtracted from it, never going below zero; the result is reduced by the correction credit percentage and then by the overcharge-age credit percentage; the total is rounded half up to the cent once, at the end.
  factors:
  - id: carried_fee
    effect: method
    decides: carried_fee
    bindings:
    - carry_charged
    - carry_refunded
    - carried_fee
    ladder:
    - when: the fee standing before the move (fee charged less refunds) is above the flat fee of the level moved from
      method: scale the standing fee by the ratio of the two levels' flat fees (proportional)
    - when: the fee standing before the move is below the flat fee of the level moved from
      method: subtract the difference between the two flat fees from the standing fee, never below zero (difference)
    - when: otherwise (equal)
      method: the flat fee of the level moved to
    baseline:
      carried_fee: new_flat
    evidence:
    - history
    cross_difficulty: null
  - id: lost_time_removal
    effect: method
    decides: lost_removal
    bindings:
    - removal_documents
    - removal_document_date
    - removal_dropoff
    - lost_removal
    ladder:
    - when: the level moved from assumes the vehicle offline, the level moved to does not, and a professional cleaning document is on the ledger
      method: remove the daily rate for each calendar day from the trip's drop-off date through the latest professional cleaning document date, both days counted
    - when: the level moved from assumes the vehicle offline, the level moved to does not, and no professional cleaning document is on file
      method: remove the daily rate for one day
    - when: otherwise
      method: no removal
    baseline:
      lost_removal: '0.0'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: trip
  - id: correction_credit
    effect: parameter
    decides: correction_pct
    bindings:
    - prior_refunds
    - correction_pct
    ladder:
    - when: the charge already carries a level-difference refund
      value: K('repeat_correction_credit')
    - when: no level-difference refund yet and the rider disputed the charge
      value: K('disputed_correction_credit')
    - when: otherwise
      value: '0.0'
    baseline:
      correction_pct: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: overcharge_age_credit
    effect: parameter
    decides: age_pct
    bindings:
    - age_days
    - age_pct
    ladder:
    - when: more than the long-age days from the charge date to the correction
      value: K('long_age_credit')
    - when: from the short-age days up to the long-age days
      value: K('short_age_credit')
    - when: otherwise
      value: '0.0'
    baseline:
      age_pct: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: A charged cleaning fee whose assessment is held at a cleaning level whose entry gate does not list the incident category reported, whether the charge stands undisputed, disputed or upheld, is moved down to the highest lower cleaning level whose entry gate lists that category, and the fee standing at that level is recorded with the move. In the standard correction the fee standing at the level moved to is that level's flat fee (flat_fee), rounded half up to the cent.
    params:
    - fee_level1
    - fee_level2
    - fee_level3
    - fee_level4
    - flat_fee
  inputs:
    history:
    - table: damage_events
      aggregate: sum
      field: amount
      filters:
        event_type: damage_fee_charge
    - table: damage_events
      aggregate: sum
      field: amount
      filters:
        event_type: damage_fee_partial_refund
    - table: damage_events
      aggregate: count
      field: damage_event_id
      filters:
        event_type: damage_fee_partial_refund
    - table: damage_events
      aggregate: latest
      field: event_date
      filters:
        event_type: damage_evidence_submit
        evidence_type: cleaning_receipt
    cross_category:
    - trip
- id: damage_ext_level_correction_refund
  base_policy_refs:
  - damage_evt_refunds
  overwrite:
  - base_policy: damage_evt_refunds
    superseded_clause: it equals the fee at the old level less the fee at the new level (partial_refund_basis)
    replaced_by: Where the adjustments below apply, the refund base is worked out first and the Pass goodwill, the trip-volume goodwill and the re-contact goodwill are then added to it; the total is rounded half up to the cent once, at the end.
  trigger: state_due
  subject:
  - damage_fee_partial_refund
  computes: refund_amount
  target_tool: refund_level_difference_30807e99
  params:
    fee_level1: 25.0
    fee_level2: 60.0
    fee_level3: 100.0
    fee_level4: 150.0
    plus_tier_refund_goodwill: 10.0
    base_tier_refund_goodwill: 5.0
    volume_high_trips: 6
    volume_mid_trips: 2
    high_volume_refund_goodwill: 8.0
    mid_volume_refund_goodwill: 4.0
    recontact_days: 30
    long_recontact_goodwill: 10.0
    short_recontact_goodwill: 5.0
  rule: 'When a charged fee is moved down to a lower level while it is disputed or after it was upheld, the rider is refunded the level difference on the fee charge, booked as a partial refund against that charge at the level moved to; a level-difference refund is never below zero. In the standard refund the level difference is the flat fee of the level moved from less the flat fee of the level moved to, rounded half up to the cent. The level moved from of a refund is the level of the latest level-difference refund already made on the charge, or the level the fee was charged at when none was made. Where the adjustments below apply, the refund base is worked out first and the Pass goodwill, the trip-volume goodwill and the re-contact goodwill are then added to it; the total is rounded half up to the cent once, at the end. The refund base of a level-difference refund depends on the refunds already made on the charge: when a level-difference refund was already made on it, the refund base is the fee charged less every refund already made on it, less the fee standing at the level moved to; when none was made and the fee charged differs from the flat fee of the level moved from, the refund base is the fee charged less the fee standing at the level moved to; otherwise the refund base is the level difference of the standard refund. The Pass goodwill of a level-difference refund is read from the rider''s Wayfare Pass membership in active status: Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual and Wayfare Pass All Access Annual take the Plus-tier refund goodwill; Wayfare Pass Monthly, Wayfare Pass Annual and Wayfare Pass Student take the base-tier refund goodwill; a rider with no active membership takes no Pass goodwill. The trip-volume goodwill of a level-difference refund is read from the rider''s trip fare charges whose charge date lies fewer than six whole calendar months before the refund date: a count at or above the high-volume trip count takes the high-volume refund goodwill; a count from the mid-volume trip count up to one less than the high-volume trip count takes the mid-volume refund goodwill; a lower count takes no trip-volume goodwill. The re-contact goodwill of a level-difference refund is read from the calendar days since the assessment''s dispute was closed: more than the re-contact days take the long re-contact goodwill; the re-contact days or fewer take the short re-contact goodwill; a dispute not yet closed, or no dispute, takes no re-contact goodwill. A level-difference refund is worked out only after the assessment is held at a level whose entry gate lists its incident category.'
  prerequisite:
  - problem: damage_ext_upheld_level_correction_fee
    kind: value_input
    gate: to_flat
    form: state
    policy_source: A level-difference refund is worked out only after the assessment is held at a level whose entry gate lists its incident category.
    condition: damage_assessments.variant_name names a level whose entry gate lists damage_assessments.incident_category.
    resolved_by: correct_upheld_fee_level_42a82f5f
    effect: Once the charged fee is moved to the level its category allows, to_flat is that level's flat fee and standing is the fee standing recorded with the move, so the refund base is worked out against the corrected level.
  cross_category:
  - category: pass
    as: branch
    reads:
    - variant_name
    - status
    note: The plan of the rider's active Wayfare Pass membership decides the Pass goodwill.
  - category: trip
    as: history
    reads:
    - trip_charges.event_type
    - trip_charges.charge_date
    note: The rider's trip fare charges in the last six months decide the trip-volume goodwill.
  compute:
  - refund_charged: SUM('damage_events', 'amount', event_type='damage_fee_charge')
  - refund_already: -(SUM('damage_events', 'amount', event_type='damage_fee_partial_refund') + SUM('damage_events', 'amount', event_type='damage_fee_refund'))
  - refund_count: COUNT('damage_events', event_type='damage_fee_partial_refund')
  - from_level: LATEST('damage_events', 'fee_level', event_type='damage_fee_partial_refund') if refund_count > 0 else LATEST('damage_events', 'fee_level', event_type='damage_fee_charge')
  - from_flat: K('fee_level4') if from_level == 'Cleaning Fee Level 4 (Major)' else (K('fee_level3') if from_level == 'Cleaning Fee Level 3 (Significant)' else (K('fee_level2') if from_level == 'Cleaning Fee Level 2 (Moderate)' else K('fee_level1')))
  - to_flat: K('fee_level4') if F('variant_name') == 'Cleaning Fee Level 4 (Major)' else (K('fee_level3') if F('variant_name') == 'Cleaning Fee Level 3 (Significant)' else (K('fee_level2') if F('variant_name') == 'Cleaning Fee Level 2 (Moderate)' else K('fee_level1')))
  - standing: F('assessed_fee')
  - refund_base: MX(0, refund_charged - refund_already - standing) if refund_count > 0 else (MX(0, refund_charged - standing) if refund_charged != from_flat else MX(0, from_flat - to_flat))
  - pass_plan: CFIELD('pass', 'variant_name', status='active')
  - pass_goodwill: K('plus_tier_refund_goodwill') if pass_plan == 'Wayfare Pass Plus Monthly' or pass_plan == 'Wayfare Pass Plus Annual' or pass_plan == 'Wayfare Pass All Access Annual' else (K('base_tier_refund_goodwill') if pass_plan == 'Wayfare Pass Monthly' or pass_plan == 'Wayfare Pass Annual' or pass_plan == 'Wayfare Pass Student' else 0.0)
  - recent_trips: XCOUNT('trip', 'trip_charges', within_months=6, date_field='charge_date', event_type='trip_fare_charge')
  - volume_goodwill: K('high_volume_refund_goodwill') if recent_trips >= K('volume_high_trips') else (K('mid_volume_refund_goodwill') if recent_trips >= K('volume_mid_trips') else 0.0)
  - recontact_days_elapsed: DAYS(F('closed_date'), NOW) if F('closed_date') != '' else -1
  - recontact_goodwill: K('long_recontact_goodwill') if recontact_days_elapsed > K('recontact_days') else (K('short_recontact_goodwill') if recontact_days_elapsed >= 0 else 0.0)
  - result: RND(refund_base + pass_goodwill + volume_goodwill + recontact_goodwill, 2)
  compute_basis:
    refund_charged: the fee charged
    refund_already: less every refund already made on it
    refund_count: The refund base of a level-difference refund depends on the refunds already made on the charge
    from_level: The level moved from of a refund is the level of the latest level-difference refund already made on the charge, or the level the fee was charged at when none was made.
    from_flat: In the standard refund the level difference is the flat fee of the level moved from less the flat fee of the level moved to, rounded half up to the cent.
    to_flat: In the standard refund the level difference is the flat fee of the level moved from less the flat fee of the level moved to, rounded half up to the cent.
    standing: less the fee standing at the level moved to
    refund_base: when a level-difference refund was already made on it, the refund base is the fee charged less every refund already made on it, less the fee standing at the level moved to; when none was made and the fee charged differs from the flat fee of the level moved from, the refund base is the fee charged less the fee standing at the level moved to; otherwise the refund base is the level difference of the standard refund.
    pass_plan: The Pass goodwill of a level-difference refund is read from the rider's Wayfare Pass membership in active status
    pass_goodwill: Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual and Wayfare Pass All Access Annual take the Plus-tier refund goodwill; Wayfare Pass Monthly, Wayfare Pass Annual and Wayfare Pass Student take the base-tier refund goodwill; a rider with no active membership takes no Pass goodwill.
    recent_trips: The trip-volume goodwill of a level-difference refund is read from the rider's trip fare charges whose charge date lies fewer than six whole calendar months before the refund date
    volume_goodwill: a count at or above the high-volume trip count takes the high-volume refund goodwill; a count from the mid-volume trip count up to one less than the high-volume trip count takes the mid-volume refund goodwill; a lower count takes no trip-volume goodwill.
    recontact_days_elapsed: The re-contact goodwill of a level-difference refund is read from the calendar days since the assessment's dispute was closed
    recontact_goodwill: more than the re-contact days take the long re-contact goodwill; the re-contact days or fewer take the short re-contact goodwill; a dispute not yet closed, or no dispute, takes no re-contact goodwill.
    result: the refund base is worked out first and the Pass goodwill, the trip-volume goodwill and the re-contact goodwill are then added to it; the total is rounded half up to the cent once, at the end.
  factors:
  - id: refund_base
    effect: method
    decides: refund_base
    bindings:
    - refund_charged
    - refund_already
    - refund_count
    - refund_base
    ladder:
    - when: a level-difference refund was already made on the charge
      method: fee charged less every refund already made, less the fee standing at the level moved to
    - when: no refund was made and the fee charged differs from the flat fee of the level moved from
      method: fee charged less the fee standing at the level moved to
    - when: otherwise
      method: flat fee of the level moved from less flat fee of the level moved to
    baseline:
      refund_base: MX(0, from_flat - to_flat)
    evidence:
    - history
    cross_difficulty: null
  - id: refund_pass_goodwill
    effect: parameter
    decides: pass_goodwill
    bindings:
    - pass_plan
    - pass_goodwill
    ladder:
    - when: the rider's active membership is Wayfare Pass Plus Monthly, Wayfare Pass Plus Annual or Wayfare Pass All Access Annual
      value: K('plus_tier_refund_goodwill')
    - when: the rider's active membership is Wayfare Pass Monthly, Wayfare Pass Annual or Wayfare Pass Student
      value: K('base_tier_refund_goodwill')
    - when: otherwise (no active membership)
      value: '0.0'
    baseline:
      pass_goodwill: '0.0'
    evidence:
    - cross_category
    cross_difficulty: pass
  - id: refund_trip_volume
    effect: parameter
    decides: volume_goodwill
    bindings:
    - recent_trips
    - volume_goodwill
    ladder:
    - when: the rider's trip fare charges in the last six whole months reach the high-volume trip count
      value: K('high_volume_refund_goodwill')
    - when: they reach the mid-volume trip count but not the high-volume trip count
      value: K('mid_volume_refund_goodwill')
    - when: otherwise
      value: '0.0'
    baseline:
      volume_goodwill: '0.0'
    evidence:
    - history
    - cross_category
    cross_difficulty: trip
  - id: recontact_goodwill
    effect: parameter
    decides: recontact_goodwill
    bindings:
    - recontact_days_elapsed
    - recontact_goodwill
    ladder:
    - when: the assessment's dispute was closed more than the re-contact days ago
      value: K('long_recontact_goodwill')
    - when: it was closed the re-contact days ago or fewer
      value: K('short_recontact_goodwill')
    - when: otherwise (dispute not closed, or no dispute)
      value: '0.0'
    baseline:
      recontact_goodwill: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: When a charged fee is moved down to a lower level while it is disputed or after it was upheld, the rider is refunded the level difference on the fee charge, booked as a partial refund against that charge at the level moved to; a level-difference refund is never below zero. In the standard refund the level difference is the flat fee of the level moved from less the flat fee of the level moved to, rounded half up to the cent. The level moved from of a refund is the level of the latest level-difference refund already made on the charge, or the level the fee was charged at when none was made.
    params:
    - fee_level1
    - fee_level2
    - fee_level3
    - fee_level4
    - flat_fee
  inputs:
    history:
    - table: damage_events
      aggregate: sum
      field: amount
      filters:
        event_type: damage_fee_charge
    - table: damage_events
      aggregate: sum
      field: amount
      filters:
        event_type: damage_fee_partial_refund
    - table: damage_events
      aggregate: latest
      field: fee_level
      filters:
        event_type: damage_fee_partial_refund
    - category: trip
      table: trip_charges
      aggregate: count
      field: trip_charge_id
      within_months: 6
      filters:
        event_type: trip_fare_charge
    cross_category:
    - pass
    - trip
