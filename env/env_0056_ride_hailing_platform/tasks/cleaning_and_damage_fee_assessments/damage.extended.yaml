category: damage
display_name: Cleaning and Damage Fees
binding:
  holding_table: damage_assessments
  event_tables:
  - damage_events
  status_field: status
  variant_field: variant_name
  quantity_fields:
    net_fee_billed: fee_billed
lifecycle:
  states:
  - reported
  - under_review
  - denied
  - charged
  - disputed
  - upheld
  - reversed
  transitions:
  - from: reported
    to: under_review
    by: system
    means: The report has the minimum photos and receipts for its level on file and enters review.
  - from: reported
    to: denied
    by: agent
    means: 'The report is denied before review: filed outside the window, evidence deadline missed, duplicate, or not chargeable.'
  - from: under_review
    to: denied
    by: agent
    means: Review finds the report not chargeable.
  - from: denied
    to: under_review
    by: agent
    means: The driver asks for reconsideration with new evidence within the reconsideration window.
  - from: under_review
    to: charged
    by: agent
    means: Review approves the fee and it is charged to the rider.
  - from: charged
    to: disputed
    by: user
    means: The rider disputes the fee.
  - from: disputed
    to: upheld
    by: agent
    means: The dispute is decided and the fee stands, at its level or a lower one.
  - from: disputed
    to: reversed
    by: agent
    means: The dispute is decided for the rider and the fee is refunded in full.
  - from: charged
    to: reversed
    by: agent
    means: A charged fee is found not chargeable without a dispute (for example a service animal shedding report) and is refunded in full.
accounts:
- key: fee_billed
  unit: USD
  meaning: Cleaning or damage fee charged to the rider on one assessment less refunds.
parameter_schema:
  level_definition: What the level covers, used to place a report at a level
  surfaces_affected: Extent of the affected area that places a report at the level
  vehicle_offline_expected: Whether the level assumes the vehicle had to be taken offline (true/false)
  professional_cleaning_required: Whether the level requires professional cleaning or detailing (true/false)
  odor_treatment_included: Whether odor treatment is part of the level (true/false)
  fee_basis: 'How the fee is set: flat by level, or the repair receipt amount'
  flat_fee: Fee charged to the rider at a flat level, USD; 0.00 for receipt-based levels
  receipt_fee_cap: Most a receipt-based fee can charge the rider, USD; 0.00 for flat levels
  receipt_min_amount: Smallest receipt a receipt-based report is processed for, USD; 0.00 for flat levels
  excess_damage_route: 'Where the part of a repair above the cap goes: never charged to the rider; the driver files it with the commercial auto insurance claim desk'
  min_photos: Photos the report must have on file before it can be reviewed, count
  receipt_required: Whether a receipt or estimate must be on file before review (true/false)
  receipt_types_accepted: Evidence documents accepted as the receipt (list)
  estimate_settles_fee: Whether a repair estimate is enough to charge, or a final repair receipt is needed (estimate / receipt_only)
  max_evidence_submissions: Most evidence submissions the driver may make on one report, count
  filing_window_hours: Hours after the trip's drop-off within which the driver must report, elapsed hours
  evidence_deadline_hours: Hours after the report within which the minimum evidence must be on file, elapsed hours
  report_channels: Channels a driver may report through (list)
  fee_payer_basis: The fee is charged to the rider who requested the trip, including for companions travelling on the request
  split_fare_allocation: Whether a fee is split among split-fare participants (it is charged in full to the requesting rider)
  shared_trip_assessable: Whether support may approve a fee on a Wayfare Shared trip (Shared trips are referred to Trust and Safety instead) (true/false)
  non_chargeable_conditions: Conditions never charged at any level (list)
  service_animal_shedding_exempt: Whether hair or dander shed by a service animal is exempt from any fee (true/false)
  service_animal_accident_chargeable: Whether a mess other than shedding left by a service animal may be charged at its level (true/false)
  max_assessments_per_trip: Most assessments on one trip, count
  charge_timing: The fee is charged to the rider's card on file when the assessment is approved
  rider_dispute_window_days: Calendar days after the charge date within which the rider may dispute the fee
  disputes_per_assessment: Most disputes per assessment, count
  dispute_evidence_standard: A disputed fee is upheld when the evidence on file met the level's photo and receipt requirements at approval; otherwise it is reversed
  rider_statement_weight: A rider's account alone never reverses a fee backed by evidence that meets the standard
  reclassification_allowed: Whether a reviewer may move a report to a different level when the evidence shows one (true/false)
  reclassification_direction: Direction a level may move at review or dispute
  partial_refund_basis: When a charged fee is reclassified to a lower level, the rider is refunded the difference between the two fees
  refund_destination: Refunds return to the original payment method
  courtesy_first_incident_eligible: Whether a disputed fee at this level may be reversed once as a first-incident courtesy (true/false)
  courtesy_lookback_days: A first-incident courtesy needs no other charged assessment against the rider within this many calendar days before the trip, days
  courtesy_payout_kept: Whether the driver keeps the payout when a fee is reversed as a courtesy (true/false)
  driver_report_review_threshold: Reports by one driver within the lookback at or above which new reports go to Trust and Safety instead of support, count
  driver_report_lookback_days: Lookback for counting a driver's reports, calendar days ending on the report date
  reconsideration_window_days: Calendar days after a denial within which the driver may ask for reconsideration with new evidence
  reconsiderations_per_assessment: Most reconsiderations per assessment, count
  denial_reasons: Recorded grounds for denying a report (list)
  injury_route: Reports that mention an injury are never handled as a fee; they go to Trust and Safety
  rounding_rule: Every computed fee or refund is rounded half up to the cent once, at the end of its computation
  level_examples: Typical incidents at the level (list)
  photo_subjects_required: What the photos on file must show (list)
  review_path: How a report that has its minimum evidence is decided
  unpaid_fee_handling: A fee that fails to collect stays on the assessment and is retried on the card on file; it never moves to trip charges
