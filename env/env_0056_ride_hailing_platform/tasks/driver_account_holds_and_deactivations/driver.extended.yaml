events:
  # ---------------- holding writes ----------------
  - type: driver_agreement_sign
    target: driver_agreements
    mutation: create
    meaning: "A driver signs a driver services agreement for a service level."
    grain: "One row per agreement."
    fields:
      customer_id: "Driver."
      variant_name: "Service level signed for."
      market: "Market the driver will drive in."
      signed_date: "Date signed."
      vehicle_model_year: "Registered vehicle model year."
      vehicle_seats: "Registered vehicle passenger seats."
      vehicle_powertrain: "Registered vehicle powertrain."
      license_expiry_date: "License expiry on file."
      insurance_expiry_date: "Insurance expiry on file."
      inspection_expiry_date: "Inspection expiry on file."
      commercial_permit_expiry_date: "Permit expiry on file (Black levels)."
    triggers:
      - event: "earnings:earnings_account_open"
        map: {customer_id: customer_id}
  - type: driver_screening_start
    target: driver_agreements
    mutation: {transition: {from: applied, to: screening}}
    meaning: "Screening starts once the documents are on file and the background check is ordered."
    grain: "One write per agreement."
    fields:
      signed_date: "Unchanged."
    triggers: []
  - type: driver_activate
    target: driver_agreements
    mutation: {transition: {from: screening, to: active}}
    meaning: "Screening is passed and the driver can go online."
    grain: "One write per agreement."
    fields:
      activated_date: "Date activated."
      background_check_date: "Date of the clear background check."
    triggers: []
  - type: driver_screening_fail
    target: driver_agreements
    mutation: {transition: {from: screening, to: closed}}
    meaning: "The applicant does not pass screening."
    grain: "One write per agreement."
    fields:
      closed_date: "Date closed."
    triggers: []
  - type: driver_hold
    target: driver_agreements
    mutation: {transition: {from: active, to: on_hold}}
    meaning: "The agreement is put on hold."
    grain: "One write per hold."
    fields:
      hold_reason: "document_expired, safety_investigation, background_recheck_pending, identity_check_failed or cancellation_rate."
      hold_started_date: "Date the hold began."
    triggers: []
  - type: driver_hold_release
    target: driver_agreements
    mutation: {transition: {from: on_hold, to: active}}
    meaning: "The hold is lifted."
    grain: "One write per hold."
    fields:
      hold_reason: "Set back to none."
      hold_started_date: "Cleared."
    triggers: []
  - type: driver_deactivate
    target: driver_agreements
    mutation: {transition: [{from: active, to: deactivated}, {from: on_hold, to: deactivated}]}
    meaning: "The agreement is deactivated."
    grain: "One write per deactivation."
    fields:
      deactivation_reason: "rating_below_minimum, cancellation_rate, safety_violation, fraud, document_lapse or background_check."
      deactivation_date: "Date of deactivation."
      hold_reason: "Set back to none."
    triggers:
      - event: "earnings:earnings_payout_hold"
        when: {deactivation_reason: fraud}
        map: {payout_hold_reason: deactivation_fraud}
  - type: driver_reactivate
    target: driver_agreements
