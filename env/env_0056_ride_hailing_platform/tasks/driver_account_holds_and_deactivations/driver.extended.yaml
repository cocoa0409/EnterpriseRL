measures:
  - id: driver_msr_cancellation_breaches
    window: "cancellation_breach_lookback_days calendar days ending on the current day, inclusive."
    measure: "Count of driver_quality_warning rows with warning_basis cancellation_rate on the agreement in the window; every cancellation-rate breach, whether it brought a warning or a hold, is recorded as one such row."
  - id: driver_msr_warning_reports
    window: "unsafe_driving_lookback_days calendar days ending on the current day, inclusive."
    measure: "Count of driver_safety_report rows on the agreement whose category is in safety_warning_categories."
  - id: driver_msr_course_reactivations
    window: "365 calendar days ending on the current day, inclusive."
    measure: "Count of driver_course_completion rows on the agreement in the window that were followed by a reactivation."
  - id: driver_msr_live_warnings
    window: "warning_validity_days calendar days ending on the current day, inclusive."
    measure: "driver_quality_warning rows on the agreement in the window, by warning_basis."

policies:
  - id: driver_agg_multi_holding
    subject: [driver_agreement_sign]
    rule: >-
      A driver holds one driver services agreement at a time; changing service level is a level change on that agreement, not a second agreement.
      A new agreement may be signed only when the driver has no agreement in applied, screening, active, on_hold or deactivated status.
      After an agreement closed for cause, a new agreement may be signed only once the reapplication wait has passed: The reapplication wait is counted in calendar months from the closed_date: the driver may sign again on or after the same day-of-month reapplication_wait_months later, or the last day of that month when the day does not exist.
      An agreement closed by the driver's own choice or after a failed screening carries no wait.
    eligibility:
      - id: one_agreement
        applies_to: [driver_agreement_sign]
        kind: dedup
        condition: "A new agreement may be signed only when the driver has no agreement in applied, screening, active, on_hold or deactivated status."
        evidence_fields: [driver_agreements.customer_id, driver_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.customer_id]]
          action_bindings: {driver_agreements.customer_id: customer_id}
        dedup_contract:
          table: driver_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, screening, active, on_hold, deactivated]}
          distinct_fields: [signed_date]
      - id: reapplication_wait
        applies_to: [driver_agreement_sign]
        kind: time
        condition: "After an agreement closed for cause, a new agreement may be signed only once the reapplication wait has passed: The reapplication wait is counted in calendar months from the closed_date: the driver may sign again on or after the same day-of-month reapplication_wait_months later, or the last day of that month when the day does not exist."
        evidence_fields: [driver_agreements.closed_date, driver_agreements.customer_id, driver_agreements.deactivation_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.customer_id]]
          action_bindings: {driver_agreements.customer_id: customer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "closed_date"
          anchor_source: driver_agreements.closed_date
          relation: not_before
          duration_source: variants.reapplication_wait_months
          unit: calendar_months
          counting_rule: "The reapplication wait is counted in calendar months from the closed_date: the driver may sign again on or after the same day-of-month reapplication_wait_months later, or the last day of that month when the day does not exist."
          boundary: inclusive
    params:
      max_per_customer: 1
      reapplication_wait_months: "=reapplication_wait_months"

  - id: driver_onboarding_screening
    subject: [driver_agreement_sign, driver_screening_start, driver_activate, driver_screening_fail]
    rule: >-
      An agreement is signed for a level only when the driver meets that level's entry gate (age, years licensed, rating and lifetime trips for the premium levels) and the vehicle is no older than max_vehicle_age_years, has at least min_vehicle_seats seats and a powertrain in allowed_powertrains.
      Screening starts when every document in required_documents is on file and unexpired; the agreement becomes active only on a clear background check, and closes if screening is not passed.
      Signing an agreement opens the driver's earnings account.
    eligibility:
      - id: level_entry_gate
        applies_to: [driver_agreement_sign]
        kind: authorization
        condition: "An agreement is signed for a level only when the driver meets that level's entry gate (age, years licensed, rating and lifetime trips for the premium levels) and the vehicle is no older than max_vehicle_age_years, has at least min_vehicle_seats seats and a powertrain in allowed_powertrains."
        evidence_fields: [customers.date_of_birth, driver_agreements.vehicle_model_year, driver_agreements.vehicle_seats, driver_agreements.vehicle_powertrain, driver_agreements.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.customer_id]]
          action_bindings: {driver_agreements.customer_id: customer_id}
    params:
      vehicle_age_rollover: "=vehicle_age_rollover"
      per_tier:
        "Wayfare Standard Driver Agreement": {max_vehicle_age_years: "=max_vehicle_age_years", min_vehicle_seats: "=min_vehicle_seats", allowed_powertrains: "=allowed_powertrains", required_documents: "=required_documents"}
        "Wayfare Green Driver Agreement": {max_vehicle_age_years: "=max_vehicle_age_years", min_vehicle_seats: "=min_vehicle_seats", allowed_powertrains: "=allowed_powertrains", required_documents: "=required_documents"}
        "Wayfare Comfort Driver Agreement": {max_vehicle_age_years: "=max_vehicle_age_years", min_vehicle_seats: "=min_vehicle_seats", allowed_powertrains: "=allowed_powertrains", required_documents: "=required_documents"}
        "Wayfare XL Driver Agreement": {max_vehicle_age_years: "=max_vehicle_age_years", min_vehicle_seats: "=min_vehicle_seats", allowed_powertrains: "=allowed_powertrains", required_documents: "=required_documents"}
        "Wayfare Black Driver Agreement": {max_vehicle_age_years: "=max_vehicle_age_years", min_vehicle_seats: "=min_vehicle_seats", allowed_powertrains: "=allowed_powertrains", required_documents: "=required_documents"}
        "Wayfare Black SUV Driver Agreement": {max_vehicle_age_years: "=max_vehicle_age_years", min_vehicle_seats: "=min_vehicle_seats", allowed_powertrains: "=allowed_powertrains", required_documents: "=required_documents"}

  - id: driver_rating_standard
    subject: [driver_rating_review, driver_quality_warning, driver_deactivate, driver_tier_change]
    rule: >-
      The rating standard acts only on an active agreement with at least min_rated_trips_for_action rated trips in the rating window; the rating is the average of the most recent rating_window_trips rated trips, compared at two decimal places.
      When the rating is below the level's min_rating_to_keep and the level has a rating_fallback_agreement whose own min_rating_to_keep the rating still meets, the agreement is moved to that level instead of being warned.
      Otherwise a rating below min_rating_to_keep brings a rating warning; at the rating review held rating_reassessment_days after the warning, a rating still below the standard of the level then held leads to deactivation for rating_below_minimum once rating_warnings_before_deactivation warnings are on record within warning_validity_days, and a rating at or above it closes the matter.
      A rating deactivation is never appealed; it is reversed only through the quality improvement course.
    eligibility:
      - id: active_agreement
        applies_to: [driver_rating_review, driver_quality_warning]
        kind: state
        condition: "The rating standard acts only on an active agreement with at least min_rated_trips_for_action rated trips in the rating window; the rating is the average of the most recent rating_window_trips rated trips, compared at two decimal places."
        evidence_fields: [driver_agreements.status, driver_agreements.driver_agreement_id, driver_agreements.rated_trips_count]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
        state_contract:
          field: driver_agreements.status
          allowed: [active]
    params:
      rating_window_trips: "=rating_window_trips"
      min_rated_trips_for_action: "=min_rated_trips_for_action"
      rating_reassessment_days: "=rating_reassessment_days"
      rating_warnings_before_deactivation: "=rating_warnings_before_deactivation"
      warning_validity_days: "=warning_validity_days"
      rounding_rule: "=rounding_rule"
      per_tier:
        "Wayfare Standard Driver Agreement": {min_rating_to_keep: "=min_rating_to_keep", rating_fallback_agreement: "=rating_fallback_agreement"}
        "Wayfare Green Driver Agreement": {min_rating_to_keep: "=min_rating_to_keep", rating_fallback_agreement: "=rating_fallback_agreement"}
        "Wayfare Comfort Driver Agreement": {min_rating_to_keep: "=min_rating_to_keep", rating_fallback_agreement: "=rating_fallback_agreement"}
        "Wayfare XL Driver Agreement": {min_rating_to_keep: "=min_rating_to_keep", rating_fallback_agreement: "=rating_fallback_agreement"}
        "Wayfare Black Driver Agreement": {min_rating_to_keep: "=min_rating_to_keep", rating_fallback_agreement: "=rating_fallback_agreement"}
        "Wayfare Black SUV Driver Agreement": {min_rating_to_keep: "=min_rating_to_keep", rating_fallback_agreement: "=rating_fallback_agreement"}
    measures: [driver_msr_live_warnings]

  - id: driver_cancellation_standard
    subject: [driver_quality_warning, driver_hold, driver_hold_release, driver_deactivate]
    rule: >-
      The driver cancellation rate is driver cancellations over the most recent cancellation_rate_window_trips accepted trips, leaving out cancellation_excluded_reasons.
      Every breach is recorded as a cancellation warning on the standing record. A rate above the level's cancellation_rate_threshold_pct brings a cancellation warning; a further breach while cancellation_warnings_before_hold warning is on record within warning_validity_days places the agreement on hold for cancellation_hold_days, after which the hold is lifted.
      When breaches in the lookback (driver_msr_cancellation_breaches) reach cancellation_breaches_for_deactivation, the agreement is deactivated for cancellation_rate instead of held.
      The acceptance rate is never used for any warning, hold, level change or deactivation (acceptance_rate_action).
    eligibility: []
    params:
      cancellation_rate_window_trips: "=cancellation_rate_window_trips"
      cancellation_excluded_reasons: "=cancellation_excluded_reasons"
      cancellation_warnings_before_hold: "=cancellation_warnings_before_hold"
      cancellation_breaches_for_deactivation: "=cancellation_breaches_for_deactivation"
      cancellation_breach_lookback_days: "=cancellation_breach_lookback_days"
      acceptance_rate_action: "=acceptance_rate_action"
      per_tier:
        "Wayfare Standard Driver Agreement": {cancellation_rate_threshold_pct: "=cancellation_rate_threshold_pct", cancellation_hold_days: "=cancellation_hold_days"}
        "Wayfare Green Driver Agreement": {cancellation_rate_threshold_pct: "=cancellation_rate_threshold_pct", cancellation_hold_days: "=cancellation_hold_days"}
        "Wayfare Comfort Driver Agreement": {cancellation_rate_threshold_pct: "=cancellation_rate_threshold_pct", cancellation_hold_days: "=cancellation_hold_days"}
        "Wayfare XL Driver Agreement": {cancellation_rate_threshold_pct: "=cancellation_rate_threshold_pct", cancellation_hold_days: "=cancellation_hold_days"}
        "Wayfare Black Driver Agreement": {cancellation_rate_threshold_pct: "=cancellation_rate_threshold_pct", cancellation_hold_days: "=cancellation_hold_days"}
        "Wayfare Black SUV Driver Agreement": {cancellation_rate_threshold_pct: "=cancellation_rate_threshold_pct", cancellation_hold_days: "=cancellation_hold_days"}
    measures: [driver_msr_cancellation_breaches]

  - id: driver_document_compliance
    subject: [driver_document_submit, driver_document_expiry_notice, driver_document_update, driver_hold, driver_hold_release, driver_deactivate]
    rule: >-
      Documents are accepted on any agreement that is not closed.
      Expiry notices go out expiry_notice_first_days and expiry_notice_second_days before a required document's expiry date.
      On the day after a required document expires without an unexpired replacement on file, the agreement goes on hold with reason document_expired (document_expiry_hold).
      A document hold is lifted only when every required document is on file and unexpired on the day the hold is lifted (hold_release_requirements); a document expiring later the same day does not count as unexpired.
      A document hold still in place document_hold_max_days after hold_started_date ends in deactivation for document_lapse, which is reversed without appeal once every required document is on file and unexpired (document_lapse_reactivation).
      An uploaded document updates the expiry date on the agreement only when it is of a required type and its expiry date is later than the one on file.
    eligibility:
      - id: not_closed
        applies_to: [driver_document_submit]
        kind: state
        condition: "Documents are accepted on any agreement that is not closed."
        evidence_fields: [driver_agreements.status, driver_agreements.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
        state_contract:
          field: driver_agreements.status
          allowed: [applied, screening, active, on_hold, deactivated]
      - id: documents_valid_for_release
        applies_to: [driver_hold_release]
        kind: authorization
        condition: "A document hold is lifted only when every required document is on file and unexpired on the day the hold is lifted (hold_release_requirements); a document expiring later the same day does not count as unexpired."
        evidence_fields: [driver_agreements.license_expiry_date, driver_agreements.insurance_expiry_date, driver_agreements.inspection_expiry_date, driver_agreements.commercial_permit_expiry_date, driver_agreements.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
    params:
      expiry_notice_first_days: "=expiry_notice_first_days"
      expiry_notice_second_days: "=expiry_notice_second_days"
      document_expiry_hold: "=document_expiry_hold"
      document_hold_max_days: "=document_hold_max_days"
      document_lapse_reactivation: "=document_lapse_reactivation"
      hold_release_requirements: "=hold_release_requirements"
      per_tier:
        "Wayfare Standard Driver Agreement": {required_documents: "=required_documents", inspection_interval_months: "=inspection_interval_months"}
        "Wayfare Green Driver Agreement": {required_documents: "=required_documents", inspection_interval_months: "=inspection_interval_months"}
        "Wayfare Comfort Driver Agreement": {required_documents: "=required_documents", inspection_interval_months: "=inspection_interval_months"}
        "Wayfare XL Driver Agreement": {required_documents: "=required_documents", inspection_interval_months: "=inspection_interval_months"}
        "Wayfare Black Driver Agreement": {required_documents: "=required_documents", inspection_interval_months: "=inspection_interval_months"}
        "Wayfare Black SUV Driver Agreement": {required_documents: "=required_documents", inspection_interval_months: "=inspection_interval_months"}

  - id: driver_background_recheck_rules
    subject: [driver_background_recheck, driver_hold, driver_hold_release, driver_deactivate]
    rule: >-
      A background recheck falls due background_recheck_interval_months after background_check_date; an agreement whose recheck is overdue goes on hold with reason background_recheck_pending until a result arrives (background_recheck_hold).
      A clear result lifts the hold and updates background_check_date.
      A consider result starts a pre-adverse action notice: the driver has adverse_action_response_business_days to respond before a final decision, and the agreement stays on hold meanwhile.
      An adverse final result deactivates the agreement for background_check, which may be appealed.
      A failed real-time identity photo check places the agreement on hold with reason identity_check_failed (identity_check_hold), lifted when identity is confirmed by a new photo check.
    eligibility: []
    params:
      background_recheck_interval_months: "=background_recheck_interval_months"
      background_recheck_hold: "=background_recheck_hold"
      adverse_action_response_business_days: "=adverse_action_response_business_days"
      identity_check_hold: "=identity_check_hold"

  - id: driver_safety_rules
    subject: [driver_safety_report, driver_hold, driver_hold_release, driver_deactivate]
    rule: >-
      A safety report in safety_hold_categories places the agreement on hold at once with reason safety_investigation, whatever the driver's rating or history.
      Reports in safety_warning_categories bring a warning, and place the agreement on hold once they reach unsafe_driving_reports_for_hold within the lookback (driver_msr_warning_reports).
      Safety investigations are decided by Trust and Safety, not by support: support never lifts a safety hold and never decides the outcome; a safety hold still open safety_investigation_max_days after hold_started_date is handed to a human through a POLICY_NOT_COVERED handoff when the driver calls about it.
      A substantiated investigation ends in deactivation for safety_violation; an unsubstantiated one lifts the hold.
    eligibility:
      - id: trust_and_safety_decides
        applies_to: [driver_hold_release]
        kind: authorization
        condition: "Safety investigations are decided by Trust and Safety, not by support: support never lifts a safety hold and never decides the outcome; a safety hold still open safety_investigation_max_days after hold_started_date is handed to a human through a POLICY_NOT_COVERED handoff when the driver calls about it."
        evidence_fields: [driver_agreements.hold_reason, driver_agreements.hold_started_date, driver_agreements.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
    params:
      safety_hold_categories: "=safety_hold_categories"
      safety_warning_categories: "=safety_warning_categories"
      unsafe_driving_reports_for_hold: "=unsafe_driving_reports_for_hold"
      unsafe_driving_lookback_days: "=unsafe_driving_lookback_days"
      safety_investigation_max_days: "=safety_investigation_max_days"
    measures: [driver_msr_warning_reports]

  - id: driver_appeals_and_reactivation
    subject: [driver_reactivate, driver_course_completion, driver_agreement_close]
    rule: >-
      A deactivation for a reason in appealable_reasons may be appealed by the driver, at most appeals_per_deactivation time; the appeal is the driver's own claim, is registered as an appeal for review and is decided by Wayfare within appeal_decision_days.
      An appeal is accepted only within the appeal window: The appeal window is counted in calendar days from the deactivation_date: day 1 is the calendar day after deactivation, and the appeal must be registered no later than the last day of the window.
      An agreement is reactivated on appeal only when the appeal for that deactivation is recorded as granted; support never grants an appeal itself.
      A rating_below_minimum deactivation is reversed when the driver completes the quality improvement course after the deactivation_date (course_reactivation), at most course_reactivations_per_365_days time in 365 days (driver_msr_course_reactivations); the course is completed only on a deactivated agreement.
      A document_lapse deactivation is reversed under driver_document_compliance; a deactivated agreement not reactivated within deactivation_close_after_days of deactivation_date closes.
    eligibility:
      - id: within_appeal_window
        applies_to: [driver_reactivate]
        kind: time
        condition: "An appeal is accepted only within the appeal window: The appeal window is counted in calendar days from the deactivation_date: day 1 is the calendar day after deactivation, and the appeal must be registered no later than the last day of the window."
        evidence_fields: [driver_agreements.deactivation_date, driver_agreements.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "deactivation_date"
          anchor_source: driver_agreements.deactivation_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: "The appeal window is counted in calendar days from the deactivation_date: day 1 is the calendar day after deactivation, and the appeal must be registered no later than the last day of the window."
          boundary: inclusive
      - id: appeal_granted
        applies_to: [driver_reactivate]
        kind: authorization
        condition: "An agreement is reactivated on appeal only when the appeal for that deactivation is recorded as granted; support never grants an appeal itself."
        evidence_fields: [driver_appeals.appeal_status, driver_appeals.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_appeals.driver_agreement_id]]
          action_bindings: {driver_appeals.driver_agreement_id: driver_agreement_id}
      - id: course_on_deactivated
        applies_to: [driver_course_completion]
        kind: state
        condition: "A rating_below_minimum deactivation is reversed when the driver completes the quality improvement course after the deactivation_date (course_reactivation), at most course_reactivations_per_365_days time in 365 days (driver_msr_course_reactivations); the course is completed only on a deactivated agreement."
        evidence_fields: [driver_agreements.status, driver_agreements.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
        state_contract:
          field: driver_agreements.status
          allowed: [deactivated]
    params:
      appeal_window_days: "=appeal_window_days"
      appealable_reasons: "=appealable_reasons"
      appeals_per_deactivation: "=appeals_per_deactivation"
      appeal_decision_days: "=appeal_decision_days"
      course_reactivation: "=course_reactivation"
      course_reactivations_per_365_days: "=course_reactivations_per_365_days"
      deactivation_close_after_days: "=deactivation_close_after_days"
    measures: [driver_msr_course_reactivations]

  - id: driver_level_changes
    subject: [driver_tier_change, driver_vehicle_update]
    rule: >-
      A move to a higher level requires the agreement to have been active long enough: The upgrade wait is counted in calendar days from the activated_date: day 1 is the calendar day after activation, and the move may be made from the day after the last day of the wait.
      The move also requires the new level's entry gate, vehicle requirements and documents, and an inspection valid on the change date (tier_change_inspection_required).
      When the registered vehicle stops meeting the level (age on the vehicle_age_rollover date, seats, or powertrain after a vehicle change), the agreement moves to the highest level the vehicle and the driver's rating still meet, and is never deactivated for that alone.
      Changing vehicle or level is the driver's own request; a fallback move under the rating standard needs no request.
    eligibility:
      - id: upgrade_wait
        applies_to: [driver_tier_change]
        kind: time
        condition: "A move to a higher level requires the agreement to have been active long enough: The upgrade wait is counted in calendar days from the activated_date: day 1 is the calendar day after activation, and the move may be made from the day after the last day of the wait."
        evidence_fields: [driver_agreements.activated_date, driver_agreements.driver_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[driver_agreements.driver_agreement_id]]
          action_bindings: {driver_agreements.driver_agreement_id: driver_agreement_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "activated_date"
          anchor_source: driver_agreements.activated_date
          relation: not_before
          duration_source: variants.tier_upgrade_min_active_days
          unit: calendar_days
          counting_rule: "The upgrade wait is counted in calendar days from the activated_date: day 1 is the calendar day after activation, and the move may be made from the day after the last day of the wait."
          boundary: exclusive
    params:
      tier_upgrade_min_active_days: "=tier_upgrade_min_active_days"
      tier_change_inspection_required: "=tier_change_inspection_required"
      vehicle_age_rollover: "=vehicle_age_rollover"

  - id: driver_voluntary_close_rules
    subject: [driver_voluntary_close, driver_deactivate]
    rule: >-
      A driver may end the agreement at any time while it is active or on hold; it is the driver's own decision and takes effect at once (voluntary_close_effective), and no reapplication wait applies.
      Ending the agreement does not cancel earnings already posted: the earnings account pays out its balance before it closes.
      A fraud deactivation also places the driver's earnings payouts on hold (fraud_deactivation_payout_hold); other deactivations leave payouts running.
    eligibility: []
    params:
      voluntary_close_effective: "=voluntary_close_effective"
      fraud_deactivation_payout_hold: "=fraud_deactivation_payout_hold"

extended_policies:
- id: driver_ext_document_lapse_allowance
  base_policy_refs:
  - driver_rating_standard
  - driver_cancellation_standard
  - driver_document_compliance
  - driver_background_recheck_rules
  - driver_safety_rules
  - driver_voluntary_close_rules
  overwrite:
  - base_policy: driver_document_compliance
    superseded_clause: A document hold still in place document_hold_max_days after hold_started_date ends in deactivation for document_lapse
    replaced_by: A document hold still in place on the day its lapse allowance days run out ends in deactivation for document lapse, and the deactivation is dated the hold start date plus the lapse allowance days.
  trigger: state_due
  subject:
  - driver_deactivate
  computes: allowance_days
  target_tool: deactivate_for_document_lapse_e185dacd
  params:
    tenure_long_days: 1825
    tenure_mid_days: 730
    tenure_bonus_long: 10
    tenure_bonus_mid: 5
    pro_bonus_gold: 10
    pro_bonus_silver: 5
    insurance_lapse_adj: -20
    license_lapse_adj: -10
    rating_high: 4.9
    rating_mid: 4.8
    rating_bonus_high: 8
    rating_bonus_mid: 4
    warn_window_months: 6
    warn_two_adj: -10
    warn_one_adj: -5
  rule: 'The lapse allowance days are the calendar days a document hold may run, counted from the hold start date, before it ends in deactivation for document lapse. A document hold still in place on the day its lapse allowance days run out ends in deactivation for document lapse, and the deactivation is dated the hold start date plus the lapse allowance days. The lapse allowance days start from the standard document hold length of the agreement''s level (document_hold_max_days). The lapsed document is the required document with the earliest expiry date among the driver''s license, auto insurance and vehicle inspection on the agreement, the for-hire permit on the agreement on the Wayfare Black and Wayfare Black SUV levels, and the vehicle registration on file, which is the latest vehicle registration upload on the standing record. Five adjustments are added once each to that standard length, giving the adjusted length; the lapse-clock rule then sets the day the lapse clock runs from, and the lapse allowance days are the adjusted length plus the days from the hold start date to that day; no adjustment acts on another adjustment. Tenure: an agreement active at least tenure_long_days calendar days, counted from its activation date to the day the allowance is worked out, adds tenure_bonus_long days to the lapse allowance days; one active at least tenure_mid_days but fewer than tenure_long_days days adds tenure_bonus_mid days; one active fewer than tenure_mid_days days adds none. Wayfare Pro status: a driver whose earnings account holds Wayfare Pro Gold, Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite adds pro_bonus_gold days to the lapse allowance days; a driver holding Wayfare Pro Silver adds pro_bonus_silver days; a driver holding Wayfare Pro Blue adds none. Lapsed insurance or license: when the auto insurance expiry date on the agreement falls on or before the day the allowance is worked out, the lapse allowance days change by insurance_lapse_adj days; when the auto insurance expiry date is later than that day but the driver''s license expiry date falls on or before it, they change by license_lapse_adj days; when both dates are later than that day, they do not change. Rating: when the rating at the latest rating review on the standing record is at least rating_high, the lapse allowance days gain rating_bonus_high days; when it is at least rating_mid but below rating_high, they gain rating_bonus_mid days; when it is below rating_mid, they gain none; ratings are compared at two decimal places as recorded. Recent quality warnings: when the standing record holds two or more quality warnings dated fewer than warn_window_months whole calendar months before the day the allowance is worked out, the lapse allowance days change by warn_two_adj days; when it holds exactly one such warning, they change by warn_one_adj days; when it holds none, they do not change. Lapse-clock rule: the lapse clock runs from the date of the second expiry notice covering the lapsed document''s expiry date when both expiry notices for that date are on the standing record, because the driver was then warned twice; from the lapsed document''s expiry date when only one of them is on record, which includes two covering notices of which neither is a second notice; and from the hold start date when no such notice is on record; a clock day before the hold start date makes the days from the hold start date to it negative. No rounding applies, and the lapse allowance days are a whole number of days.'
  prerequisite: []
  cross_category:
  - category: earnings
    as: branch
    reads:
    - variant_name
    note: The Wayfare Pro status adjustment reads the Pro status held on the driver's earnings account.
  compute:
  - standard_length: P('document_hold_max_days')
  - days_active: DAYS(F('activated_date'), NOW)
  - tenure_adj: K('tenure_bonus_long') if days_active >= K('tenure_long_days') else (K('tenure_bonus_mid') if days_active >= K('tenure_mid_days') else 0)
  - pro_status: CFIELD('earnings', 'variant_name')
  - pro_adj: K('pro_bonus_gold') if (pro_status == 'Wayfare Pro Gold' or pro_status == 'Wayfare Pro Platinum' or pro_status == 'Wayfare Pro Diamond' or pro_status == 'Wayfare Pro Diamond Elite') else (K('pro_bonus_silver') if pro_status == 'Wayfare Pro Silver' else 0)
  - insurance_days_past: DAYS(F('insurance_expiry_date'), NOW)
  - license_days_past: DAYS(F('license_expiry_date'), NOW)
  - lapse_kind_adj: K('insurance_lapse_adj') if insurance_days_past >= 0 else (K('license_lapse_adj') if license_days_past >= 0 else 0)
  - review_rating: LATEST('driver_standing_events', 'rating_at_review', event_type='driver_rating_review')
  - rating_adj: K('rating_bonus_high') if review_rating >= K('rating_high') else (K('rating_bonus_mid') if review_rating >= K('rating_mid') else 0)
  - recent_warnings: COUNT('driver_standing_events', within_months=K('warn_window_months'), event_type='driver_quality_warning')
  - warning_adj: K('warn_two_adj') if recent_warnings >= 2 else (K('warn_one_adj') if recent_warnings == 1 else 0)
  - adjusted_length: standard_length + tenure_adj + pro_adj + lapse_kind_adj + rating_adj + warning_adj
  - lapsed_expiry: min(F('license_expiry_date'), F('insurance_expiry_date'), F('inspection_expiry_date'), (F('commercial_permit_expiry_date') if (F('variant_name') == 'Wayfare Black Driver Agreement' or F('variant_name') == 'Wayfare Black SUV Driver Agreement') else '9999-12-31'), (LATEST('driver_standing_events', 'document_expiry_date', event_type='driver_document_submit', document_type='vehicle_registration') or '9999-12-31'))
  - lapse_notices: COUNT('driver_standing_events', event_type='driver_document_expiry_notice', document_expiry_date=lapsed_expiry)
  - second_notice_date: LATEST('driver_standing_events', 'event_date', event_type='driver_document_expiry_notice', document_expiry_date=lapsed_expiry, notice_sequence=2)
  - clock_shift: DAYS(F('hold_started_date'), second_notice_date) if (lapse_notices >= 2 and second_notice_date) else (DAYS(F('hold_started_date'), lapsed_expiry) if lapse_notices >= 1 else 0)
  - lapse_allowance: adjusted_length + clock_shift
  - result: lapse_allowance
  compute_basis:
    standard_length: The lapse allowance days start from the standard document hold length of the agreement's level (document_hold_max_days).
    days_active: an agreement active at least tenure_long_days calendar days, counted from its activation date to the day the allowance is worked out
    tenure_adj: 'Tenure: an agreement active at least tenure_long_days calendar days, counted from its activation date to the day the allowance is worked out, adds tenure_bonus_long days to the lapse allowance days; one active at least tenure_mid_days but fewer than tenure_long_days days adds tenure_bonus_mid days; one active fewer than tenure_mid_days days adds none.'
    pro_status: a driver whose earnings account holds Wayfare Pro Gold, Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite
    pro_adj: 'Wayfare Pro status: a driver whose earnings account holds Wayfare Pro Gold, Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite adds pro_bonus_gold days to the lapse allowance days; a driver holding Wayfare Pro Silver adds pro_bonus_silver days; a driver holding Wayfare Pro Blue adds none.'
    insurance_days_past: when the auto insurance expiry date on the agreement falls on or before the day the allowance is worked out
    license_days_past: but the driver's license expiry date falls on or before it
    lapse_kind_adj: 'Lapsed insurance or license: when the auto insurance expiry date on the agreement falls on or before the day the allowance is worked out, the lapse allowance days change by insurance_lapse_adj days; when the auto insurance expiry date is later than that day but the driver''s license expiry date falls on or before it, they change by license_lapse_adj days; when both dates are later than that day, they do not change.'
    review_rating: when the rating at the latest rating review on the standing record is at least rating_high
    rating_adj: 'Rating: when the rating at the latest rating review on the standing record is at least rating_high, the lapse allowance days gain rating_bonus_high days; when it is at least rating_mid but below rating_high, they gain rating_bonus_mid days; when it is below rating_mid, they gain none; ratings are compared at two decimal places as recorded.'
    recent_warnings: when the standing record holds two or more quality warnings dated fewer than warn_window_months whole calendar months before the day the allowance is worked out
    warning_adj: 'Recent quality warnings: when the standing record holds two or more quality warnings dated fewer than warn_window_months whole calendar months before the day the allowance is worked out, the lapse allowance days change by warn_two_adj days; when it holds exactly one such warning, they change by warn_one_adj days; when it holds none, they do not change.'
    adjusted_length: Five adjustments are added once each to that standard length, giving the adjusted length
    lapsed_expiry: The lapsed document is the required document with the earliest expiry date among the driver's license, auto insurance and vehicle inspection on the agreement, the for-hire permit on the agreement on the Wayfare Black and Wayfare Black SUV levels, and the vehicle registration on file, which is the latest vehicle registration upload on the standing record.
    lapse_notices: when both expiry notices for that date are on the standing record
    clock_shift: 'Lapse-clock rule: the lapse clock runs from the date of the second expiry notice covering the lapsed document''s expiry date when both expiry notices for that date are on the standing record, because the driver was then warned twice; from the lapsed document''s expiry date when only one of them is on record, which includes two covering notices of which neither is a second notice; and from the hold start date when no such notice is on record; a clock day before the hold start date makes the days from the hold start date to it negative.'
    lapse_allowance: the lapse allowance days are the adjusted length plus the days from the hold start date to that day
    result: A document hold still in place on the day its lapse allowance days run out ends in deactivation for document lapse, and the deactivation is dated the hold start date plus the lapse allowance days.
    second_notice_date: the lapse clock runs from the date of the second expiry notice covering the lapsed document's expiry date when both expiry notices for that date are on the standing record
  factors:
  - id: tenure
    effect: parameter
    decides: tenure_adj
    bindings:
    - days_active
    - tenure_adj
    ladder:
    - when: the agreement has been active at least tenure_long_days calendar days since its activation date
      value: K('tenure_bonus_long')
    - when: the agreement has been active at least tenure_mid_days but fewer than tenure_long_days calendar days
      value: K('tenure_bonus_mid')
    - when: the agreement has been active fewer than tenure_mid_days calendar days
      value: '0'
    baseline:
      tenure_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: pro_status
    effect: parameter
    decides: pro_adj
    bindings:
    - pro_status
    - pro_adj
    ladder:
    - when: the driver's earnings account holds Wayfare Pro Gold, Platinum, Diamond or Diamond Elite
      value: K('pro_bonus_gold')
    - when: the driver's earnings account holds Wayfare Pro Silver
      value: K('pro_bonus_silver')
    - when: the driver's earnings account holds Wayfare Pro Blue
      value: '0'
    baseline:
      pro_adj: '0'
    evidence:
    - cross_category
    cross_difficulty: earnings
  - id: lapsed_insurance_or_license
    effect: parameter
    decides: lapse_kind_adj
    bindings:
    - insurance_days_past
    - license_days_past
    - lapse_kind_adj
    ladder:
    - when: the auto insurance expiry date on the agreement falls on or before the day the allowance is worked out
      value: K('insurance_lapse_adj')
    - when: the auto insurance expiry date is later than that day and the driver's license expiry date falls on or before it
      value: K('license_lapse_adj')
    - when: both the auto insurance and the driver's license expiry dates are later than that day
      value: '0'
    baseline:
      lapse_kind_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: review_rating
    effect: parameter
    decides: rating_adj
    bindings:
    - review_rating
    - rating_adj
    ladder:
    - when: the rating at the latest rating review is at least rating_high
      value: K('rating_bonus_high')
    - when: the rating at the latest rating review is at least rating_mid but below rating_high
      value: K('rating_bonus_mid')
    - when: the rating at the latest rating review is below rating_mid
      value: '0'
    baseline:
      rating_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: recent_warnings
    effect: parameter
    decides: warning_adj
    bindings:
    - recent_warnings
    - warning_adj
    ladder:
    - when: two or more quality warnings dated fewer than warn_window_months whole calendar months back
      value: K('warn_two_adj')
    - when: exactly one such quality warning
      value: K('warn_one_adj')
    - when: no such quality warning
      value: '0'
    baseline:
      warning_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: lapse_clock
    effect: method
    decides: clock_shift
    bindings:
    - lapsed_expiry
    - lapse_notices
    - second_notice_date
    - clock_shift
    ladder:
    - when: both expiry notices covering the lapsed document's expiry date are on the standing record
      method: 'the lapse clock runs from the second notice''s date: the days from the hold start date to that date are added to the adjusted length'
    - when: only one of the two expiry notices covering the lapsed document's expiry date is on the standing record
      method: 'the lapse clock runs from the lapsed document''s expiry date: the days from the hold start date to that date are added to the adjusted length'
    - when: no expiry notice covers the lapsed document's expiry date
      method: the lapse clock runs from the hold start date and the adjusted length stands
    baseline:
      clock_shift: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The lapse allowance days are the calendar days a document hold may run, counted from the hold start date, before it ends in deactivation for document lapse. A document hold still in place on the day its lapse allowance days run out ends in deactivation for document lapse, and the deactivation is dated the hold start date plus the lapse allowance days. The lapse allowance days start from the standard document hold length of the agreement's level (document_hold_max_days).
    params:
    - document_hold_max_days
  inputs:
    history:
    - table: driver_standing_events
      aggregate: latest
      field: rating_at_review
      filters:
        event_type: driver_rating_review
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 6
      filters:
        event_type: driver_quality_warning
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      filters:
        event_type: driver_document_expiry_notice
        document_expiry_date: the lapsed document expiry date
    - table: driver_standing_events
      aggregate: latest
      field: event_date
      filters:
        event_type: driver_document_expiry_notice
        notice_sequence: 2
    cross_category:
    - earnings
- id: driver_ext_insurance_binder_acceptance
  base_policy_refs:
  - driver_document_compliance
  overwrite:
  - base_policy: driver_document_compliance
    superseded_clause: An uploaded document updates the expiry date on the agreement only when it is of a required type and its expiry date is later than the one on file.
    replaced_by: 'A binder updates the agreement only when support records it: the auto insurance expiry date on the agreement becomes the recording day plus the binder acceptance days, whatever end date is printed on the binder.'
  trigger: state_due
  subject:
  - driver_document_update
  computes: accepted_days
  target_tool: record_insurance_binder_0f7a5736
  params:
    standard_binder_days: 45
    lapse_long_days: 60
    lapse_long_adj: -10
    lapse_short_adj: -5
    notice_window_months: 24
    late_two_adj: -6
    late_one_adj: -3
    tenure_days: 1095
    pro_gold_bonus: 8
    pro_silver_bonus: 4
    term_long_days: 60
    term_mid_days: 30
    term_long_bonus: 10
    term_mid_bonus: 5
    deactivated_adj: -6
    hold_adj: -3
    late_three_adj: -10
  rule: 'The binder acceptance days are the calendar days, counted from the day support records it, for which an insurance binder uploaded to the standing record is accepted as the auto insurance on file. A binder updates the agreement only when support records it: the auto insurance expiry date on the agreement becomes the recording day plus the binder acceptance days, whatever end date is printed on the binder. The binder is the latest auto insurance upload on the standing record, and its upload date and printed end date are the date and the expiry date shown on that upload entry. The binder acceptance days start from standard_binder_days days and never run past the binder''s printed end date. The binder acceptance days are fixed only after the agreement''s status and deactivation date already show any deactivation for document lapse that its document hold has run into. Five adjustments are added once each to the standard binder days, giving the adjusted binder days; the takeover-clock rule then sets the day the binder''s cover is counted from, the binder acceptance days being the adjusted binder days plus the days from the recording day to that day, never below zero, and the cap at the binder''s printed end date is applied last. Insurance lapse: when the auto insurance expiry date on the agreement lies more than lapse_long_days calendar days before the recording day, the binder acceptance days change by lapse_long_adj days; when it lies at least one but no more than lapse_long_days days before it, they change by lapse_short_adj days; when it is the recording day or later, they do not change. Late insurance renewals: when the standing record holds three or more second expiry notices for the auto insurance dated fewer than notice_window_months whole calendar months before the recording day, the binder acceptance days change by late_three_adj days; when it holds exactly two, they change by late_two_adj days; when it holds exactly one, they change by late_one_adj days; when it holds none, they do not change. Wayfare Pro status and tenure: a driver whose earnings account holds Wayfare Pro Gold, Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite and whose agreement has been active at least tenure_days calendar days since its activation date adds pro_gold_bonus days to the binder acceptance days; a driver holding Wayfare Pro Silver whose agreement has been active at least tenure_days days adds pro_silver_bonus days; any other driver adds none. Binder term: when the binder''s printed end date lies at least term_long_days calendar days after its upload date, the binder acceptance days gain term_long_bonus days; when it lies at least term_mid_days but fewer than term_long_days days after, they gain term_mid_bonus days; when it lies fewer than term_mid_days days after, they gain none. Agreement standing: on an agreement deactivated with its deactivation date on or before the recording day, the binder acceptance days change by deactivated_adj days; on an agreement on hold with its hold start date on or before the recording day, they change by hold_adj days; on an agreement in any other standing, they do not change. Takeover-clock rule: when the auto insurance expiry date on the agreement is later than the recording day, the binder takes over when that insurance ends, so its cover is counted from that expiry date; when the insurance on the agreement had already expired before the binder''s upload date, the binder''s cover is counted from its upload date, so the days the binder waited to be recorded are used up; when the insurance expired on or after the upload date and no later than the recording day, the cover is counted from the recording day. No rounding applies.'
  prerequisite:
  - problem: driver_ext_document_lapse_allowance
    kind: value_input
    gate: standing_adj
    form: state
    policy_source: The binder acceptance days are fixed only after the agreement's status and deactivation date already show any deactivation for document lapse that its document hold has run into.
    condition: driver_agreements.status reads deactivated with deactivation_reason document_lapse and the deactivation_date the lapse allowance gives, whenever the document hold in force has run past its lapse allowance days on or before the recording day.
    resolved_by: deactivate_for_document_lapse_e185dacd
    effect: The agreement-standing adjustment moves from its on-hold value (hold_adj) to its deactivated value (deactivated_adj), so standing_adj changes value.
  cross_category:
  - category: earnings
    as: branch
    reads:
    - variant_name
    note: The Wayfare Pro status and tenure adjustment reads the Pro status held on the driver's earnings account.
  compute:
  - printed_end: LATEST('driver_standing_events', 'document_expiry_date', event_type='driver_document_submit', document_type='auto_insurance')
  - upload_date: LATEST('driver_standing_events', 'event_date', event_type='driver_document_submit', document_type='auto_insurance')
  - days_to_printed_end: DAYS(NOW, printed_end)
  - binder_term: DAYS(upload_date, printed_end)
  - term_adj: K('term_long_bonus') if binder_term >= K('term_long_days') else (K('term_mid_bonus') if binder_term >= K('term_mid_days') else 0)
  - lapse_days: DAYS(F('insurance_expiry_date'), NOW)
  - lapse_adj: K('lapse_long_adj') if lapse_days > K('lapse_long_days') else (K('lapse_short_adj') if lapse_days >= 1 else 0)
  - late_insurance_notices: COUNT('driver_standing_events', within_months=K('notice_window_months'), event_type='driver_document_expiry_notice', document_type='auto_insurance', notice_sequence=2)
  - late_adj: K('late_three_adj') if late_insurance_notices >= 3 else (K('late_two_adj') if late_insurance_notices == 2 else (K('late_one_adj') if late_insurance_notices == 1 else 0))
  - pro_status: CFIELD('earnings', 'variant_name')
  - days_active: DAYS(F('activated_date'), NOW)
  - pro_tenure_adj: K('pro_gold_bonus') if ((pro_status == 'Wayfare Pro Gold' or pro_status == 'Wayfare Pro Platinum' or pro_status == 'Wayfare Pro Diamond' or pro_status == 'Wayfare Pro Diamond Elite') and days_active >= K('tenure_days')) else (K('pro_silver_bonus') if (pro_status == 'Wayfare Pro Silver' and days_active >= K('tenure_days')) else 0)
  - standing_adj: K('deactivated_adj') if (F('status') == 'deactivated' and DAYS(F('deactivation_date'), NOW) >= 0) else (K('hold_adj') if (F('status') == 'on_hold' and DAYS(F('hold_started_date'), NOW) >= 0) else 0)
  - adjusted_binder_days: K('standard_binder_days') + lapse_adj + late_adj + pro_tenure_adj + term_adj + standing_adj
  - takeover_shift: DAYS(NOW, F('insurance_expiry_date')) if DAYS(NOW, F('insurance_expiry_date')) > 0 else (0 - DAYS(upload_date, NOW) if DAYS(F('insurance_expiry_date'), upload_date) > 0 else 0)
  - result: MN(MX(0, adjusted_binder_days + takeover_shift), days_to_printed_end)
  compute_basis:
    printed_end: The binder is the latest auto insurance upload on the standing record, and its upload date and printed end date are the date and the expiry date shown on that upload entry.
    upload_date: The binder is the latest auto insurance upload on the standing record, and its upload date and printed end date are the date and the expiry date shown on that upload entry.
    days_to_printed_end: never run past the binder's printed end date
    binder_term: when the binder's printed end date lies at least term_long_days calendar days after its upload date
    term_adj: 'Binder term: when the binder''s printed end date lies at least term_long_days calendar days after its upload date, the binder acceptance days gain term_long_bonus days; when it lies at least term_mid_days but fewer than term_long_days days after, they gain term_mid_bonus days; when it lies fewer than term_mid_days days after, they gain none.'
    lapse_days: when the auto insurance expiry date on the agreement lies more than lapse_long_days calendar days before the recording day
    lapse_adj: 'Insurance lapse: when the auto insurance expiry date on the agreement lies more than lapse_long_days calendar days before the recording day, the binder acceptance days change by lapse_long_adj days; when it lies at least one but no more than lapse_long_days days before it, they change by lapse_short_adj days; when it is the recording day or later, they do not change.'
    late_insurance_notices: when the standing record holds three or more second expiry notices for the auto insurance dated fewer than notice_window_months whole calendar months before the recording day
    late_adj: 'Late insurance renewals: when the standing record holds three or more second expiry notices for the auto insurance dated fewer than notice_window_months whole calendar months before the recording day, the binder acceptance days change by late_three_adj days; when it holds exactly two, they change by late_two_adj days; when it holds exactly one, they change by late_one_adj days; when it holds none, they do not change.'
    pro_status: a driver whose earnings account holds Wayfare Pro Gold, Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite
    days_active: whose agreement has been active at least tenure_days calendar days since its activation date
    pro_tenure_adj: 'Wayfare Pro status and tenure: a driver whose earnings account holds Wayfare Pro Gold, Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite and whose agreement has been active at least tenure_days calendar days since its activation date adds pro_gold_bonus days to the binder acceptance days; a driver holding Wayfare Pro Silver whose agreement has been active at least tenure_days days adds pro_silver_bonus days; any other driver adds none.'
    standing_adj: 'Agreement standing: on an agreement deactivated with its deactivation date on or before the recording day, the binder acceptance days change by deactivated_adj days; on an agreement on hold with its hold start date on or before the recording day, they change by hold_adj days; on an agreement in any other standing, they do not change.'
    adjusted_binder_days: Five adjustments are added once each to the standard binder days, giving the adjusted binder days
    takeover_shift: 'Takeover-clock rule: when the auto insurance expiry date on the agreement is later than the recording day, the binder takes over when that insurance ends, so its cover is counted from that expiry date; when the insurance on the agreement had already expired before the binder''s upload date, the binder''s cover is counted from its upload date, so the days the binder waited to be recorded are used up; when the insurance expired on or after the upload date and no later than the recording day, the cover is counted from the recording day.'
    result: the binder acceptance days being the adjusted binder days plus the days from the recording day to that day, never below zero, and the cap at the binder's printed end date is applied last
  factors:
  - id: insurance_lapse
    effect: parameter
    decides: lapse_adj
    bindings:
    - lapse_days
    - lapse_adj
    ladder:
    - when: the auto insurance expiry date on the agreement lies more than lapse_long_days calendar days before the recording day
      value: K('lapse_long_adj')
    - when: it lies at least one but no more than lapse_long_days days before the recording day
      value: K('lapse_short_adj')
    - when: it is the recording day or later
      value: '0'
    baseline:
      lapse_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: late_insurance_renewals
    effect: parameter
    decides: late_adj
    bindings:
    - late_insurance_notices
    - late_adj
    ladder:
    - when: three or more second expiry notices for the auto insurance dated fewer than notice_window_months whole calendar months back
      value: K('late_three_adj')
    - when: exactly two such second expiry notices
      value: K('late_two_adj')
    - when: exactly one such second expiry notice
      value: K('late_one_adj')
    - when: no such second expiry notice
      value: '0'
    baseline:
      late_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: pro_status_and_tenure
    effect: parameter
    decides: pro_tenure_adj
    bindings:
    - pro_status
    - days_active
    - pro_tenure_adj
    ladder:
    - when: Wayfare Pro Gold, Platinum, Diamond or Diamond Elite on the earnings account and the agreement active at least tenure_days calendar days
      value: K('pro_gold_bonus')
    - when: Wayfare Pro Silver on the earnings account and the agreement active at least tenure_days calendar days
      value: K('pro_silver_bonus')
    - when: Wayfare Pro Blue, or the agreement active fewer than tenure_days calendar days
      value: '0'
    baseline:
      pro_tenure_adj: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: earnings
  - id: binder_term
    effect: parameter
    decides: term_adj
    bindings:
    - binder_term
    - term_adj
    ladder:
    - when: the binder's printed end date lies at least term_long_days calendar days after its upload date
      value: K('term_long_bonus')
    - when: it lies at least term_mid_days but fewer than term_long_days days after the upload date
      value: K('term_mid_bonus')
    - when: it lies fewer than term_mid_days days after the upload date
      value: '0'
    baseline:
      term_adj: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: agreement_standing
    effect: parameter
    decides: standing_adj
    bindings:
    - standing_adj
    ladder:
    - when: the agreement is deactivated with its deactivation date on or before the recording day
      value: K('deactivated_adj')
    - when: the agreement is on hold with its hold start date on or before the recording day
      value: K('hold_adj')
    - when: the agreement is in any other standing
      value: '0'
    baseline:
      standing_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: takeover_clock
    effect: method
    decides: takeover_shift
    bindings:
    - takeover_shift
    ladder:
    - when: the insurance expiry date on the agreement is later than the recording day
      method: 'the binder''s cover is counted from that expiry date: the days from the recording day to it are added'
    - when: the insurance on the agreement expired before the binder's upload date
      method: 'the binder''s cover is counted from its upload date: the days from the upload date to the recording day are taken off'
    - when: the insurance expired on or after the upload date and no later than the recording day
      method: the cover is counted from the recording day and the adjusted binder days stand
    baseline:
      takeover_shift: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The binder acceptance days are the calendar days, counted from the day support records it, for which an insurance binder uploaded to the standing record is accepted as the auto insurance on file. A binder updates the agreement only when support records it: the auto insurance expiry date on the agreement becomes the recording day plus the binder acceptance days, whatever end date is printed on the binder. The binder is the latest auto insurance upload on the standing record, and its upload date and printed end date are the date and the expiry date shown on that upload entry. The binder acceptance days start from standard_binder_days days and never run past the binder''s printed end date.'
    params:
    - standard_binder_days
  inputs:
    history:
    - table: driver_standing_events
      aggregate: latest
      field: document_expiry_date
      filters:
        event_type: driver_document_submit
        document_type: auto_insurance
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 24
      filters:
        event_type: driver_document_expiry_notice
        document_type: auto_insurance
        notice_sequence: 2
    cross_category:
    - earnings
- id: driver_ext_temporary_license_acceptance
  base_policy_refs:
  - driver_document_compliance
  overwrite:
  - base_policy: driver_document_compliance
    superseded_clause: An uploaded document updates the expiry date on the agreement only when it is of a required type and its expiry date is later than the one on file.
    replaced_by: The upload puts the temporary license on the standing record with an expiry date of the upload day plus the temporary license acceptance days, and the driver's license expiry date on the agreement becomes that same date.
  trigger: on_request
  subject:
  - driver_document_submit
  - driver_document_update
  computes: accepted_days
  target_tool: upload_temporary_license_ef094b46
  params:
    standard_license_days: 30
    check_recent_days: 180
    check_year_days: 365
    check_recent_bonus: 6
    check_year_bonus: 3
    short_doc_days: 30
    short_two_adj: -12
    short_one_adj: -6
    late_window_months: 24
    late_three_adj: -6
    late_some_adj: -3
    pro_high_bonus: 6
    pro_mid_bonus: 3
    late_five_adj: -10
    deactivated_adj: -8
    hold_adj: -4
    relapse_days: 14
    lapse_cap_days: 10
  rule: 'The temporary license acceptance days are the calendar days, counted from the day the driver uploads it, for which a paper temporary driver''s license issued on renewal is accepted as the driver''s license on file. The upload puts the temporary license on the standing record with an expiry date of the upload day plus the temporary license acceptance days, and the driver''s license expiry date on the agreement becomes that same date. The temporary license acceptance days start from standard_license_days days. The temporary license acceptance days are not worked out until the auto insurance expiry date on the agreement carries the accepted period of every insurance binder uploaded to the standing record. Before the temporary license acceptance days are worked out, the agreement''s status must already show the deactivation for document lapse owed by any document hold that has run past its lapse allowance. Five adjustments are added once each to the standard temporary license days, giving the adjusted temporary license days; the license takeover rule then adds days to them or takes days off them as it states, and the temporary license acceptance days are the result, never below one. Background check recency: when the latest clear background check on the agreement is dated fewer than check_recent_days calendar days before the upload day, the temporary license acceptance days gain check_recent_bonus days; when it is dated at least check_recent_days but fewer than check_year_days days before, they gain check_year_bonus days; when it is dated check_year_days days or more before, they gain none. Other documents on file: counting the auto insurance and the vehicle inspection, plus the for-hire permit on the Wayfare Black and Wayfare Black SUV levels, each of these whose expiry date on the agreement lies fewer than short_doc_days calendar days after the upload day, or is already past, is a short document; with two or more short documents the temporary license acceptance days change by short_two_adj days, with exactly one they change by short_one_adj days, and with none they do not change. Late renewals: when the standing record holds five or more second expiry notices, for any document, dated fewer than late_window_months whole calendar months before the upload day, the temporary license acceptance days change by late_five_adj days; when it holds three or four, they change by late_three_adj days; when it holds one or two, they change by late_some_adj days; when it holds none, they do not change. Wayfare Pro status: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite adds pro_high_bonus days to the temporary license acceptance days; a driver holding Wayfare Pro Silver or Wayfare Pro Gold adds pro_mid_bonus days; a driver holding Wayfare Pro Blue adds none. Agreement standing: on an agreement deactivated with its deactivation date on or before the upload day, the temporary license acceptance days change by deactivated_adj days; on an agreement on hold with its hold start date on or before the upload day, they change by hold_adj days; on an agreement in any other standing, they do not change. License takeover rule: when the driver''s license expiry date on the agreement is later than the upload day, the temporary license takes over when that license ends, so its cover is counted from that expiry date and the days from the upload day to it are added; when the license on the agreement expired at least relapse_days calendar days before the upload day, the cover is counted from the upload day and the uncovered days beyond relapse_days are taken off, at most lapse_cap_days days; when it expired fewer than relapse_days days before the upload day, or on the upload day itself, the cover is counted from the upload day and nothing is added or taken off. No rounding applies.'
  prerequisite:
  - problem: driver_ext_insurance_binder_acceptance
    kind: value_input
    gate: short_doc_adj
    form: state
    policy_source: The temporary license acceptance days are not worked out until the auto insurance expiry date on the agreement carries the accepted period of every insurance binder uploaded to the standing record.
    condition: driver_agreements.insurance_expiry_date equals the recording day plus the binder acceptance days of the latest auto insurance upload that is a binder, for every binder upload on the standing record.
    resolved_by: record_insurance_binder_0f7a5736
    effect: The auto insurance stops being a short document once its accepted period is on the agreement, so short_documents falls by one and short_doc_adj moves up one tier.
  - problem: driver_ext_document_lapse_allowance
    kind: value_input
    gate: standing_adj
    form: state
    policy_source: Before the temporary license acceptance days are worked out, the agreement's status must already show the deactivation for document lapse owed by any document hold that has run past its lapse allowance.
    condition: driver_agreements.status reads deactivated with deactivation_reason document_lapse and the deactivation_date the lapse allowance gives, whenever the document hold in force has run past its lapse allowance days on or before the upload day.
    resolved_by: deactivate_for_document_lapse_e185dacd
    effect: The agreement-standing adjustment moves from its on-hold value (hold_adj) to its deactivated value (deactivated_adj), so standing_adj changes value.
  cross_category:
  - category: earnings
    as: branch
    reads:
    - variant_name
    note: The Wayfare Pro status adjustment reads the Pro status held on the driver's earnings account.
  compute:
  - days_since_check: DAYS(F('background_check_date'), NOW)
  - check_adj: K('check_recent_bonus') if days_since_check < K('check_recent_days') else (K('check_year_bonus') if days_since_check < K('check_year_days') else 0)
  - insurance_left: DAYS(NOW, F('insurance_expiry_date'))
  - inspection_left: DAYS(NOW, F('inspection_expiry_date'))
  - permit_short: (DAYS(NOW, F('commercial_permit_expiry_date')) < K('short_doc_days')) if (F('variant_name') == 'Wayfare Black Driver Agreement' or F('variant_name') == 'Wayfare Black SUV Driver Agreement') else False
  - short_documents: int(insurance_left < K('short_doc_days')) + int(inspection_left < K('short_doc_days')) + int(permit_short)
  - short_doc_adj: K('short_two_adj') if short_documents >= 2 else (K('short_one_adj') if short_documents == 1 else 0)
  - late_notices: COUNT('driver_standing_events', within_months=K('late_window_months'), event_type='driver_document_expiry_notice', notice_sequence=2)
  - late_adj: K('late_five_adj') if late_notices >= 5 else (K('late_three_adj') if late_notices >= 3 else (K('late_some_adj') if late_notices >= 1 else 0))
  - pro_status: CFIELD('earnings', 'variant_name')
  - pro_adj: K('pro_high_bonus') if (pro_status == 'Wayfare Pro Platinum' or pro_status == 'Wayfare Pro Diamond' or pro_status == 'Wayfare Pro Diamond Elite') else (K('pro_mid_bonus') if (pro_status == 'Wayfare Pro Silver' or pro_status == 'Wayfare Pro Gold') else 0)
  - standing_adj: K('deactivated_adj') if (F('status') == 'deactivated' and DAYS(F('deactivation_date'), NOW) >= 0) else (K('hold_adj') if (F('status') == 'on_hold' and DAYS(F('hold_started_date'), NOW) >= 0) else 0)
  - adjusted_license_days: K('standard_license_days') + check_adj + short_doc_adj + late_adj + pro_adj + standing_adj
  - license_left: DAYS(NOW, F('license_expiry_date'))
  - takeover_shift: license_left if license_left > 0 else ((0 - MN((0 - license_left) - K('relapse_days'), K('lapse_cap_days'))) if (0 - license_left) >= K('relapse_days') else 0)
  - result: MX(1, adjusted_license_days + takeover_shift)
  compute_basis:
    days_since_check: when the latest clear background check on the agreement is dated fewer than check_recent_days calendar days before the upload day
    check_adj: 'Background check recency: when the latest clear background check on the agreement is dated fewer than check_recent_days calendar days before the upload day, the temporary license acceptance days gain check_recent_bonus days; when it is dated at least check_recent_days but fewer than check_year_days days before, they gain check_year_bonus days; when it is dated check_year_days days or more before, they gain none.'
    insurance_left: counting the auto insurance and the vehicle inspection
    inspection_left: counting the auto insurance and the vehicle inspection
    permit_short: plus the for-hire permit on the Wayfare Black and Wayfare Black SUV levels
    short_documents: each of these whose expiry date on the agreement lies fewer than short_doc_days calendar days after the upload day, or is already past, is a short document
    short_doc_adj: 'Other documents on file: counting the auto insurance and the vehicle inspection, plus the for-hire permit on the Wayfare Black and Wayfare Black SUV levels, each of these whose expiry date on the agreement lies fewer than short_doc_days calendar days after the upload day, or is already past, is a short document; with two or more short documents the temporary license acceptance days change by short_two_adj days, with exactly one they change by short_one_adj days, and with none they do not change.'
    late_notices: when the standing record holds five or more second expiry notices, for any document, dated fewer than late_window_months whole calendar months before the upload day
    late_adj: 'Late renewals: when the standing record holds five or more second expiry notices, for any document, dated fewer than late_window_months whole calendar months before the upload day, the temporary license acceptance days change by late_five_adj days; when it holds three or four, they change by late_three_adj days; when it holds one or two, they change by late_some_adj days; when it holds none, they do not change.'
    pro_status: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite
    pro_adj: 'Wayfare Pro status: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite adds pro_high_bonus days to the temporary license acceptance days; a driver holding Wayfare Pro Silver or Wayfare Pro Gold adds pro_mid_bonus days; a driver holding Wayfare Pro Blue adds none.'
    standing_adj: 'Agreement standing: on an agreement deactivated with its deactivation date on or before the upload day, the temporary license acceptance days change by deactivated_adj days; on an agreement on hold with its hold start date on or before the upload day, they change by hold_adj days; on an agreement in any other standing, they do not change.'
    adjusted_license_days: Five adjustments are added once each to the standard temporary license days, giving the adjusted temporary license days
    license_left: when the driver's license expiry date on the agreement is later than the upload day
    takeover_shift: 'License takeover rule: when the driver''s license expiry date on the agreement is later than the upload day, the temporary license takes over when that license ends, so its cover is counted from that expiry date and the days from the upload day to it are added; when the license on the agreement expired at least relapse_days calendar days before the upload day, the cover is counted from the upload day and the uncovered days beyond relapse_days are taken off, at most lapse_cap_days days; when it expired fewer than relapse_days days before the upload day, or on the upload day itself, the cover is counted from the upload day and nothing is added or taken off.'
    result: the temporary license acceptance days are the result, never below one
  factors:
  - id: license_takeover
    effect: method
    decides: takeover_shift
    bindings:
    - license_left
    - takeover_shift
    ladder:
    - when: the license expiry date on the agreement is later than the upload day
      method: 'the cover is counted from the old license''s expiry date: the days from the upload day to that date are added'
    - when: the license on the agreement expired at least relapse_days days before the upload day
      method: 'the cover is counted from the upload day: the days the license was uncovered beyond relapse_days are taken off, at most lapse_cap_days'
    - when: the license expired fewer than relapse_days days before the upload day, or on the upload day
      method: the cover is counted from the upload day and the adjusted days stand
    baseline:
      takeover_shift: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: background_check_recency
    effect: parameter
    decides: check_adj
    bindings:
    - days_since_check
    - check_adj
    ladder:
    - when: the latest clear background check is dated fewer than check_recent_days calendar days before the upload day
      value: K('check_recent_bonus')
    - when: it is dated at least check_recent_days but fewer than check_year_days days before
      value: K('check_year_bonus')
    - when: it is dated check_year_days days or more before
      value: '0'
    baseline:
      check_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: other_documents_on_file
    effect: parameter
    decides: short_doc_adj
    bindings:
    - insurance_left
    - inspection_left
    - permit_short
    - short_documents
    - short_doc_adj
    ladder:
    - when: two or more of the auto insurance, the vehicle inspection and (Black levels) the for-hire permit run fewer than short_doc_days days past the upload day or are past
      value: K('short_two_adj')
    - when: exactly one of them does
      value: K('short_one_adj')
    - when: none of them does
      value: '0'
    baseline:
      short_doc_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: late_renewals
    effect: parameter
    decides: late_adj
    bindings:
    - late_notices
    - late_adj
    ladder:
    - when: five or more second expiry notices, any document, dated fewer than late_window_months whole calendar months back
      value: K('late_five_adj')
    - when: three or four such second expiry notices
      value: K('late_three_adj')
    - when: one or two such second expiry notices
      value: K('late_some_adj')
    - when: no such second expiry notice
      value: '0'
    baseline:
      late_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: pro_status
    effect: parameter
    decides: pro_adj
    bindings:
    - pro_status
    - pro_adj
    ladder:
    - when: the driver's earnings account holds Wayfare Pro Platinum, Diamond or Diamond Elite
      value: K('pro_high_bonus')
    - when: the driver's earnings account holds Wayfare Pro Silver or Gold
      value: K('pro_mid_bonus')
    - when: the driver's earnings account holds Wayfare Pro Blue
      value: '0'
    baseline:
      pro_adj: '0'
    evidence:
    - cross_category
    cross_difficulty: earnings
  - id: agreement_standing
    effect: parameter
    decides: standing_adj
    bindings:
    - standing_adj
    ladder:
    - when: the agreement is deactivated with its deactivation date on or before the upload day
      value: K('deactivated_adj')
    - when: the agreement is on hold with its hold start date on or before the upload day
      value: K('hold_adj')
    - when: the agreement is in any other standing
      value: '0'
    baseline:
      standing_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The temporary license acceptance days are the calendar days, counted from the day the driver uploads it, for which a paper temporary driver's license issued on renewal is accepted as the driver's license on file. The upload puts the temporary license on the standing record with an expiry date of the upload day plus the temporary license acceptance days, and the driver's license expiry date on the agreement becomes that same date. The temporary license acceptance days start from standard_license_days days.
    params:
    - standard_license_days
  inputs:
    history:
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 24
      filters:
        event_type: driver_document_expiry_notice
        notice_sequence: 2
    cross_category:
    - earnings
- id: driver_ext_cancellation_warning_sequence
  base_policy_refs:
  - driver_rating_standard
  - driver_cancellation_standard
  overwrite: []
  trigger: state_due
  subject:
  - driver_quality_warning
  computes: notice_sequence
  target_tool: record_cancellation_warning_d72ae138
  params:
    window_black_months: 24
    window_mid_months: 18
    window_other_months: 12
    continuation_months: 3
    reset_months: 12
    forgive_high: 3
    forgive_gold: 2
    severe_points: 2.0
    serious_points: 1.0
    severe_add: 2
    serious_add: 1
  rule: 'The cancellation warning sequence number is the number a cancellation-rate warning carries within the driver''s current warning cycle. A cancellation-rate warning continues the numbering of the driver''s warning cycle: its cancellation warning sequence number is the sequence number of the latest earlier cancellation-rate warning on the standing record plus one, or one when the standing record holds no earlier cancellation-rate warning. The warning records the cancellation rate shown at the latest rating review on the standing record. Four rules shape the cancellation warning sequence number: the cycle rule decides whether the number continues from the latest earlier warning, is recounted over the cycle window or starts a fresh cycle; the cycle-window rule sets how far back a recount reaches; Wayfare Pro forgiveness is taken off the recounted warnings but never below zero; and the severity rule adds to a continued or recounted number, while a fresh cycle always starts at one. Cycle rule: when the latest earlier cancellation-rate warning is dated fewer than continuation_months whole calendar months before the recording day, the cancellation warning sequence number continues from it, being that warning''s sequence number plus one plus the severity addition; when it is dated at least continuation_months but fewer than reset_months whole calendar months back, the cycle is recounted, the number being one plus the severity addition plus the earlier cancellation-rate warnings inside the cycle window less Wayfare Pro forgiveness; when there is no earlier cancellation-rate warning, or the latest one is dated reset_months whole calendar months or more back, a fresh cycle starts and the number is one. Cycle-window rule: a recount of the cancellation warning sequence number counts the earlier cancellation-rate warnings dated fewer than window_black_months whole calendar months before the recording day on the Wayfare Black and Wayfare Black SUV levels, fewer than window_mid_months months on the Wayfare Comfort and Wayfare XL levels, and fewer than window_other_months months on the Wayfare Standard and Wayfare Green levels. Wayfare Pro forgiveness: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite has forgive_high recounted warnings of the cancellation warning sequence number forgiven; a driver holding Wayfare Pro Gold has forgive_gold forgiven; a driver holding Wayfare Pro Blue or Silver has none forgiven. Severity rule: when the cancellation rate at the latest rating review exceeds the level''s cancellation rate threshold by at least severe_points percentage points, a continued or recounted cancellation warning sequence number gains severe_add; when it exceeds it by at least serious_points but fewer than severe_points points, the number gains serious_add; when it exceeds it by fewer than serious_points points, the number gains nothing; rates are compared at one decimal place as recorded. No rounding applies.'
  prerequisite: []
  cross_category:
  - category: earnings
    as: branch
    reads:
    - variant_name
    note: Wayfare Pro forgiveness reads the Pro status held on the driver's earnings account.
  compute:
  - cycle_window: K('window_black_months') if (F('variant_name') == 'Wayfare Black Driver Agreement' or F('variant_name') == 'Wayfare Black SUV Driver Agreement') else (K('window_mid_months') if (F('variant_name') == 'Wayfare Comfort Driver Agreement' or F('variant_name') == 'Wayfare XL Driver Agreement') else K('window_other_months'))
  - earlier_warnings: COUNT('driver_standing_events', within_months=cycle_window, event_type='driver_quality_warning', warning_basis='cancellation_rate')
  - pro_status: CFIELD('earnings', 'variant_name')
  - forgiven: K('forgive_high') if (pro_status == 'Wayfare Pro Platinum' or pro_status == 'Wayfare Pro Diamond' or pro_status == 'Wayfare Pro Diamond Elite') else (K('forgive_gold') if pro_status == 'Wayfare Pro Gold' else 0)
  - latest_rate: LATEST('driver_standing_events', 'cancellation_rate_pct', event_type='driver_rating_review')
  - rate_excess: RND(latest_rate - P('cancellation_rate_threshold_pct'), 1)
  - severity_add: K('severe_add') if rate_excess >= K('severe_points') else (K('serious_add') if rate_excess >= K('serious_points') else 0)
  - latest_warning_date: LATEST('driver_standing_events', 'event_date', event_type='driver_quality_warning', warning_basis='cancellation_rate')
  - latest_warning_number: LATEST('driver_standing_events', 'notice_sequence', event_type='driver_quality_warning', warning_basis='cancellation_rate')
  - continued_number: (latest_warning_number + 1 + severity_add) if latest_warning_date else 1
  - months_since_warning: MONTHS(latest_warning_date, NOW) if latest_warning_date else 9999
  - sequence_number: 1 if months_since_warning >= K('reset_months') else ((1 + severity_add + MX(0, earlier_warnings - forgiven)) if months_since_warning >= K('continuation_months') else continued_number)
  - result: sequence_number
  compute_basis:
    cycle_window: 'Cycle-window rule: a recount of the cancellation warning sequence number counts the earlier cancellation-rate warnings dated fewer than window_black_months whole calendar months before the recording day on the Wayfare Black and Wayfare Black SUV levels, fewer than window_mid_months months on the Wayfare Comfort and Wayfare XL levels, and fewer than window_other_months months on the Wayfare Standard and Wayfare Green levels.'
    earlier_warnings: the earlier cancellation-rate warnings inside the cycle window less Wayfare Pro forgiveness
    pro_status: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite
    forgiven: 'Wayfare Pro forgiveness: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite has forgive_high recounted warnings of the cancellation warning sequence number forgiven; a driver holding Wayfare Pro Gold has forgive_gold forgiven; a driver holding Wayfare Pro Blue or Silver has none forgiven.'
    latest_rate: when the cancellation rate at the latest rating review exceeds the level's cancellation rate threshold
    rate_excess: rates are compared at one decimal place as recorded
    severity_add: 'Severity rule: when the cancellation rate at the latest rating review exceeds the level''s cancellation rate threshold by at least severe_points percentage points, a continued or recounted cancellation warning sequence number gains severe_add; when it exceeds it by at least serious_points but fewer than severe_points points, the number gains serious_add; when it exceeds it by fewer than serious_points points, the number gains nothing; rates are compared at one decimal place as recorded.'
    latest_warning_date: when the latest earlier cancellation-rate warning is dated fewer than continuation_months whole calendar months before the recording day
    latest_warning_number: its cancellation warning sequence number is the sequence number of the latest earlier cancellation-rate warning on the standing record plus one
    continued_number: the cancellation warning sequence number continues from it, being that warning's sequence number plus one plus the severity addition
    months_since_warning: when it is dated at least continuation_months but fewer than reset_months whole calendar months back
    sequence_number: 'Cycle rule: when the latest earlier cancellation-rate warning is dated fewer than continuation_months whole calendar months before the recording day, the cancellation warning sequence number continues from it, being that warning''s sequence number plus one plus the severity addition; when it is dated at least continuation_months but fewer than reset_months whole calendar months back, the cycle is recounted, the number being one plus the severity addition plus the earlier cancellation-rate warnings inside the cycle window less Wayfare Pro forgiveness; when there is no earlier cancellation-rate warning, or the latest one is dated reset_months whole calendar months or more back, a fresh cycle starts and the number is one.'
    result: Four rules shape the cancellation warning sequence number
  factors:
  - id: cycle_window
    effect: parameter
    decides: cycle_window
    bindings:
    - cycle_window
    - earlier_warnings
    ladder:
    - when: a recount on the Wayfare Black or Wayfare Black SUV level
      value: K('window_black_months')
    - when: a recount on the Wayfare Comfort or Wayfare XL level
      value: K('window_mid_months')
    - when: a recount on the Wayfare Standard or Wayfare Green level
      value: K('window_other_months')
    baseline:
      cycle_window: K('window_other_months')
    evidence:
    - history
    cross_difficulty: null
  - id: cycle_rule
    effect: method
    decides: sequence_number
    bindings:
    - latest_warning_date
    - months_since_warning
    - sequence_number
    ladder:
    - when: no earlier cancellation-rate warning, or the latest one dated reset_months whole calendar months or more back
      method: 'a fresh cycle starts: the number is one'
    - when: the latest earlier cancellation-rate warning dated at least continuation_months but fewer than reset_months whole calendar months back
      method: 'the cycle is recounted: one plus the severity addition plus the earlier cancellation-rate warnings in the cycle window less forgiveness'
    - when: the latest earlier cancellation-rate warning dated fewer than continuation_months whole calendar months back
      method: 'the number continues: that warning''s number plus one plus the severity addition'
    baseline:
      sequence_number: continued_number
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pro_forgiveness
    effect: parameter
    decides: forgiven
    bindings:
    - pro_status
    - forgiven
    ladder:
    - when: the driver's earnings account holds Wayfare Pro Platinum, Diamond or Diamond Elite
      value: K('forgive_high')
    - when: the driver's earnings account holds Wayfare Pro Gold
      value: K('forgive_gold')
    - when: the driver's earnings account holds Wayfare Pro Blue or Silver
      value: '0'
    baseline:
      forgiven: '0'
    evidence:
    - cross_category
    cross_difficulty: earnings
  - id: severity
    effect: parameter
    decides: severity_add
    bindings:
    - latest_rate
    - rate_excess
    - severity_add
    ladder:
    - when: the latest rating review's cancellation rate exceeds the level's threshold by at least severe_points points
      value: K('severe_add')
    - when: it exceeds the threshold by at least serious_points but fewer than severe_points points
      value: K('serious_add')
    - when: it exceeds the threshold by fewer than serious_points points
      value: '0'
    baseline:
      severity_add: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The cancellation warning sequence number is the number a cancellation-rate warning carries within the driver''s current warning cycle. A cancellation-rate warning continues the numbering of the driver''s warning cycle: its cancellation warning sequence number is the sequence number of the latest earlier cancellation-rate warning on the standing record plus one, or one when the standing record holds no earlier cancellation-rate warning. The warning records the cancellation rate shown at the latest rating review on the standing record.'
    params: []
  inputs:
    history:
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 24
      filters:
        event_type: driver_quality_warning
        warning_basis: cancellation_rate
    - table: driver_standing_events
      aggregate: latest
      field: cancellation_rate_pct
      filters:
        event_type: driver_rating_review
    - table: driver_standing_events
      aggregate: latest
      field: notice_sequence
      filters:
        event_type: driver_quality_warning
        warning_basis: cancellation_rate
    cross_category:
    - earnings
- id: driver_ext_registration_hold_start
  base_policy_refs:
  - driver_cancellation_standard
  - driver_document_compliance
  - driver_background_recheck_rules
  - driver_safety_rules
  overwrite:
  - base_policy: driver_document_compliance
    superseded_clause: On the day after a required document expires without an unexpired replacement on file, the agreement goes on hold with reason document_expired (document_expiry_hold).
    replaced_by: The vehicle registration on file is the latest vehicle registration upload on the standing record; once its expiry date has passed, the agreement goes on hold for an expired document with its hold start date set to that expiry date plus the registration grace days, and the hold is placed as soon as that start date has arrived.
  trigger: state_due
  subject:
  - driver_hold
  computes: grace_days
  target_tool: place_registration_hold_154e4b50
  params:
    standard_grace_days: 1
    tenure_long_days: 1825
    tenure_mid_days: 730
    tenure_long_bonus: 6
    tenure_mid_bonus: 3
    late_window_months: 36
    late_three_adj: -2
    late_some_adj: -1
    rating_high: 4.9
    rating_mid: 4.8
    pro_high_bonus: 6
    pro_mid_bonus: 4
    history_window_months: 36
    history_three_bonus: 6
    history_two_bonus: 4
    warning_window_months: 3
    report_window_months: 6
  rule: 'The registration grace days are the calendar days after a lapsed vehicle registration''s expiry date on which the document hold for it begins. The vehicle registration on file is the latest vehicle registration upload on the standing record; once its expiry date has passed, the agreement goes on hold for an expired document with its hold start date set to that expiry date plus the registration grace days, and the hold is placed as soon as that start date has arrived. The registration grace days start from standard_grace_days day. The registration grace days are fixed only after the standing record carries the quality warning owed for every rating review that found the cancellation rate above the level''s threshold. Four adjustments are added once each to the standard grace, giving the adjusted grace; the grace-clock rule then sets the day the grace runs from, and the registration grace days are the adjusted grace plus the days from the expiry date to that day, never fewer than one. Tenure: an agreement active at least tenure_long_days calendar days, counted from its activation date to the day the grace is worked out, adds tenure_long_bonus days to the registration grace days; one active at least tenure_mid_days but fewer than tenure_long_days days adds tenure_mid_bonus days; one active fewer than tenure_mid_days days adds none. Late registration renewals: when the standing record holds three or more second expiry notices for the vehicle registration dated fewer than late_window_months whole calendar months before the day the grace is worked out, the registration grace days change by late_three_adj days; when it holds one or two, they change by late_some_adj days; when it holds none, they do not change. Wayfare Pro status and rating: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite and whose rating at the latest rating review is at least rating_high adds pro_high_bonus days to the registration grace days; a driver holding Wayfare Pro Silver or Wayfare Pro Gold whose rating at the latest rating review is at least rating_mid adds pro_mid_bonus days; any other driver adds none. Registration history: when the standing record holds three or more vehicle registration uploads dated fewer than history_window_months whole calendar months before the day the grace is worked out, the registration grace days gain history_three_bonus days; when it holds exactly two, they gain history_two_bonus days; when it holds one or none, they gain none. Grace-clock rule: when the standing record holds a quality warning dated fewer than warning_window_months whole calendar months before the day the grace is worked out and the second expiry notice covering the registration''s expiry date is on record, the grace runs from that second notice''s date, because a driver already under a warning was told a week ahead; when it holds no such warning but holds an unsafe driving safety report dated fewer than report_window_months whole calendar months before that day and the first expiry notice covering that expiry date is on record, the grace runs from that first notice''s date; otherwise the grace runs from the registration''s expiry date. No rounding applies.'
  prerequisite:
  - problem: driver_ext_cancellation_warning_sequence
    kind: value_input
    gate: clock_shift
    form: state
    policy_source: The registration grace days are fixed only after the standing record carries the quality warning owed for every rating review that found the cancellation rate above the level's threshold.
    condition: Every driver_rating_review on the standing record whose cancellation_rate_pct is above the level's cancellation_rate_threshold_pct has a driver_quality_warning with warning_basis cancellation_rate recorded for it.
    resolved_by: record_cancellation_warning_d72ae138
    effect: Once the owed warning is on the standing record it is a quality warning dated fewer than warning_window_months whole months back, so the grace-clock rule runs the grace from the registration's second expiry notice and clock_shift changes from 0 to the (negative) days between the expiry date and that notice.
  cross_category:
  - category: earnings
    as: branch
    reads:
    - variant_name
    note: The Wayfare Pro status and rating adjustment reads the Pro status held on the driver's earnings account.
  compute:
  - registration_expiry: LATEST('driver_standing_events', 'document_expiry_date', event_type='driver_document_submit', document_type='vehicle_registration')
  - days_active: DAYS(F('activated_date'), NOW)
  - tenure_adj: K('tenure_long_bonus') if days_active >= K('tenure_long_days') else (K('tenure_mid_bonus') if days_active >= K('tenure_mid_days') else 0)
  - late_registration_notices: COUNT('driver_standing_events', within_months=K('late_window_months'), event_type='driver_document_expiry_notice', document_type='vehicle_registration', notice_sequence=2)
  - late_adj: K('late_three_adj') if late_registration_notices >= 3 else (K('late_some_adj') if late_registration_notices >= 1 else 0)
  - pro_status: CFIELD('earnings', 'variant_name')
  - review_rating: LATEST('driver_standing_events', 'rating_at_review', event_type='driver_rating_review')
  - pro_rating_adj: K('pro_high_bonus') if ((pro_status == 'Wayfare Pro Platinum' or pro_status == 'Wayfare Pro Diamond' or pro_status == 'Wayfare Pro Diamond Elite') and review_rating >= K('rating_high')) else (K('pro_mid_bonus') if ((pro_status == 'Wayfare Pro Silver' or pro_status == 'Wayfare Pro Gold') and review_rating >= K('rating_mid')) else 0)
  - registration_uploads: COUNT('driver_standing_events', within_months=K('history_window_months'), event_type='driver_document_submit', document_type='vehicle_registration')
  - history_adj: K('history_three_bonus') if registration_uploads >= 3 else (K('history_two_bonus') if registration_uploads == 2 else 0)
  - adjusted_grace: K('standard_grace_days') + tenure_adj + late_adj + pro_rating_adj + history_adj
  - live_warnings: COUNT('driver_standing_events', within_months=K('warning_window_months'), event_type='driver_quality_warning')
  - unsafe_reports: COUNT('driver_standing_events', within_months=K('report_window_months'), event_type='driver_safety_report', safety_report_category='unsafe_driving')
  - second_notice_date: LATEST('driver_standing_events', 'event_date', event_type='driver_document_expiry_notice', document_type='vehicle_registration', document_expiry_date=registration_expiry, notice_sequence=2)
  - first_notice_date: LATEST('driver_standing_events', 'event_date', event_type='driver_document_expiry_notice', document_type='vehicle_registration', document_expiry_date=registration_expiry, notice_sequence=1)
  - clock_shift: DAYS(registration_expiry, second_notice_date) if (live_warnings >= 1 and second_notice_date) else (DAYS(registration_expiry, first_notice_date) if (live_warnings == 0 and unsafe_reports >= 1 and first_notice_date) else 0)
  - result: MX(1, adjusted_grace + clock_shift)
  compute_basis:
    registration_expiry: The vehicle registration on file is the latest vehicle registration upload on the standing record; once its expiry date has passed, the agreement goes on hold for an expired document with its hold start date set to that expiry date plus the registration grace days, and the hold is placed as soon as that start date has arrived.
    days_active: an agreement active at least tenure_long_days calendar days, counted from its activation date to the day the grace is worked out
    tenure_adj: 'Tenure: an agreement active at least tenure_long_days calendar days, counted from its activation date to the day the grace is worked out, adds tenure_long_bonus days to the registration grace days; one active at least tenure_mid_days but fewer than tenure_long_days days adds tenure_mid_bonus days; one active fewer than tenure_mid_days days adds none.'
    late_registration_notices: when the standing record holds three or more second expiry notices for the vehicle registration dated fewer than late_window_months whole calendar months before the day the grace is worked out
    late_adj: 'Late registration renewals: when the standing record holds three or more second expiry notices for the vehicle registration dated fewer than late_window_months whole calendar months before the day the grace is worked out, the registration grace days change by late_three_adj days; when it holds one or two, they change by late_some_adj days; when it holds none, they do not change.'
    pro_status: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite
    review_rating: whose rating at the latest rating review is at least rating_high
    pro_rating_adj: 'Wayfare Pro status and rating: a driver whose earnings account holds Wayfare Pro Platinum, Wayfare Pro Diamond or Wayfare Pro Diamond Elite and whose rating at the latest rating review is at least rating_high adds pro_high_bonus days to the registration grace days; a driver holding Wayfare Pro Silver or Wayfare Pro Gold whose rating at the latest rating review is at least rating_mid adds pro_mid_bonus days; any other driver adds none.'
    registration_uploads: when the standing record holds three or more vehicle registration uploads dated fewer than history_window_months whole calendar months before the day the grace is worked out
    history_adj: 'Registration history: when the standing record holds three or more vehicle registration uploads dated fewer than history_window_months whole calendar months before the day the grace is worked out, the registration grace days gain history_three_bonus days; when it holds exactly two, they gain history_two_bonus days; when it holds one or none, they gain none.'
    adjusted_grace: Four adjustments are added once each to the standard grace, giving the adjusted grace
    live_warnings: when the standing record holds a quality warning dated fewer than warning_window_months whole calendar months before the day the grace is worked out
    unsafe_reports: but holds an unsafe driving safety report dated fewer than report_window_months whole calendar months before that day
    second_notice_date: the second expiry notice covering the registration's expiry date is on record
    first_notice_date: the first expiry notice covering that expiry date is on record
    clock_shift: 'Grace-clock rule: when the standing record holds a quality warning dated fewer than warning_window_months whole calendar months before the day the grace is worked out and the second expiry notice covering the registration''s expiry date is on record, the grace runs from that second notice''s date, because a driver already under a warning was told a week ahead; when it holds no such warning but holds an unsafe driving safety report dated fewer than report_window_months whole calendar months before that day and the first expiry notice covering that expiry date is on record, the grace runs from that first notice''s date; otherwise the grace runs from the registration''s expiry date.'
    result: the registration grace days are the adjusted grace plus the days from the expiry date to that day, never fewer than one
  factors:
  - id: tenure
    effect: parameter
    decides: tenure_adj
    bindings:
    - days_active
    - tenure_adj
    ladder:
    - when: the agreement has been active at least tenure_long_days calendar days
      value: K('tenure_long_bonus')
    - when: the agreement has been active at least tenure_mid_days but fewer than tenure_long_days days
      value: K('tenure_mid_bonus')
    - when: the agreement has been active fewer than tenure_mid_days days
      value: '0'
    baseline:
      tenure_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: late_registration_renewals
    effect: parameter
    decides: late_adj
    bindings:
    - late_registration_notices
    - late_adj
    ladder:
    - when: three or more second expiry notices for the vehicle registration dated fewer than late_window_months whole calendar months back
      value: K('late_three_adj')
    - when: one or two such second expiry notices
      value: K('late_some_adj')
    - when: no such second expiry notice
      value: '0'
    baseline:
      late_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: pro_status_and_rating
    effect: parameter
    decides: pro_rating_adj
    bindings:
    - pro_status
    - review_rating
    - pro_rating_adj
    ladder:
    - when: Wayfare Pro Platinum, Diamond or Diamond Elite on the earnings account and the latest review rating at least rating_high
      value: K('pro_high_bonus')
    - when: Wayfare Pro Silver or Gold on the earnings account and the latest review rating at least rating_mid
      value: K('pro_mid_bonus')
    - when: any other combination
      value: '0'
    baseline:
      pro_rating_adj: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: earnings
  - id: registration_history
    effect: parameter
    decides: history_adj
    bindings:
    - registration_uploads
    - history_adj
    ladder:
    - when: three or more vehicle registration uploads dated fewer than history_window_months whole calendar months back
      value: K('history_three_bonus')
    - when: exactly two such uploads
      value: K('history_two_bonus')
    - when: one such upload or none
      value: '0'
    baseline:
      history_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: grace_clock
    effect: method
    decides: clock_shift
    bindings:
    - live_warnings
    - unsafe_reports
    - second_notice_date
    - first_notice_date
    - clock_shift
    ladder:
    - when: a quality warning dated fewer than warning_window_months whole calendar months back, with the registration's second expiry notice on record
      method: 'the grace runs from the second notice''s date: the days from the expiry date to that date are added (a negative number)'
    - when: no such warning but an unsafe driving safety report dated fewer than report_window_months whole calendar months back, with the first expiry notice on record
      method: 'the grace runs from the first notice''s date: the days from the expiry date to that date are added (a negative number)'
    - when: neither, or the relevant notice is not on record
      method: the grace runs from the expiry date and the adjusted grace stands
    baseline:
      clock_shift: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The registration grace days are the calendar days after a lapsed vehicle registration's expiry date on which the document hold for it begins. The vehicle registration on file is the latest vehicle registration upload on the standing record; once its expiry date has passed, the agreement goes on hold for an expired document with its hold start date set to that expiry date plus the registration grace days, and the hold is placed as soon as that start date has arrived. The registration grace days start from standard_grace_days day.
    params:
    - standard_grace_days
  inputs:
    history:
    - table: driver_standing_events
      aggregate: latest
      field: document_expiry_date
      filters:
        event_type: driver_document_submit
        document_type: vehicle_registration
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 36
      filters:
        event_type: driver_document_expiry_notice
        document_type: vehicle_registration
        notice_sequence: 2
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 36
      filters:
        event_type: driver_document_submit
        document_type: vehicle_registration
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 3
      filters:
        event_type: driver_quality_warning
    cross_category:
    - earnings
- id: driver_ext_inspection_validity
  base_policy_refs:
  - driver_document_compliance
  overwrite:
  - base_policy: driver_document_compliance
    superseded_clause: An uploaded document updates the expiry date on the agreement only when it is of a required type and its expiry date is later than the one on file.
    replaced_by: 'An inspection upload carries no expiry date of its own: support records it, and the vehicle inspection expiry date on the agreement becomes the inspection date plus the inspection validity days.'
  trigger: state_due
  subject:
  - driver_document_update
  computes: validity_days
  target_tool: record_inspection_validity_ad704ee2
  params:
    month_days: 30
    age_old_years: 5
    age_mid_years: 3
    age_old_adj: -30
    age_mid_adj: -15
    late_window_months: 24
    late_three_adj: -20
    late_some_adj: -10
    use_high_trips: 1000
    use_mid_trips: 500
    use_high_adj: -20
    use_mid_adj: -10
    reg_soon_days: 30
    reg_lapsed_adj: -20
    reg_soon_adj: -10
    early_days: 7
    lapse_cap_days: 30
  rule: 'The inspection validity days are the calendar days, counted from the inspection date, for which a passed vehicle inspection uploaded to the standing record counts as the vehicle inspection on file. An inspection upload carries no expiry date of its own: support records it, and the vehicle inspection expiry date on the agreement becomes the inspection date plus the inspection validity days. The inspection is the latest vehicle inspection upload on the standing record, and the inspection date is the date of that upload entry. The inspection validity days start from the level''s inspection interval (inspection_interval_months) counted at month_days days to the month. Four adjustments are added once each to that standard validity, giving the adjusted validity, and the clock-start rule then turns the adjusted validity into the inspection validity days. Vehicle age: for a vehicle at least age_old_years old, counted as the current calendar year minus its model year, the inspection validity days change by age_old_adj days; for one at least age_mid_years but fewer than age_old_years years old, they change by age_mid_adj days; for one fewer than age_mid_years years old, they do not change. Late inspections: when the standing record holds three or more second expiry notices for the vehicle inspection dated fewer than late_window_months whole calendar months before the recording day, the inspection validity days change by late_three_adj days; when it holds one or two, they change by late_some_adj days; when it holds none, they do not change. Vehicle use: the agreement''s lifetime trips divided by its days active, counted from its activation date to the recording day, and multiplied by 365 give its yearly trips; yearly trips of at least use_high_trips change the inspection validity days by use_high_adj days, yearly trips of at least use_mid_trips but fewer than use_high_trips change them by use_mid_adj days, and fewer than use_mid_trips leave them unchanged. Registration on file: when the vehicle registration on file, the latest vehicle registration upload on the standing record, expired before the recording day, the inspection validity days change by reg_lapsed_adj days; when it expires on the recording day or fewer than reg_soon_days days after it, they change by reg_soon_adj days; when it expires later, they do not change. Clock-start rule: for an inspection passed while the inspection on file still had at least early_days days to run, counted from the inspection date to the expiry date on file, the inspection validity days run from that expiry date, so the days between the inspection date and the expiry date on file are added to the adjusted validity; for an inspection passed after the inspection on file had expired, they run from the inspection date and the adjusted validity loses the days the inspection on file had been expired, at most lapse_cap_days days; for an inspection passed while the inspection on file had not expired but had fewer than early_days days to run, they run from the inspection date and the adjusted validity is taken unchanged. No rounding applies beyond whole days.'
  prerequisite: []
  cross_category: []
  compute:
  - inspection_date: LATEST('driver_standing_events', 'event_date', event_type='driver_document_submit', document_type='vehicle_inspection')
  - standard_validity: P('inspection_interval_months') * K('month_days')
  - current_year: MONTHS('2000-01-01', NOW) // 12 + 2000
  - vehicle_age: current_year - F('vehicle_model_year')
  - age_adj: K('age_old_adj') if vehicle_age >= K('age_old_years') else (K('age_mid_adj') if vehicle_age >= K('age_mid_years') else 0)
  - late_inspection_notices: COUNT('driver_standing_events', within_months=K('late_window_months'), event_type='driver_document_expiry_notice', document_type='vehicle_inspection', notice_sequence=2)
  - late_adj: K('late_three_adj') if late_inspection_notices >= 3 else (K('late_some_adj') if late_inspection_notices >= 1 else 0)
  - yearly_trips: F('lifetime_trips') * 365 / MX(1, DAYS(F('activated_date'), NOW))
  - use_adj: K('use_high_adj') if yearly_trips >= K('use_high_trips') else (K('use_mid_adj') if yearly_trips >= K('use_mid_trips') else 0)
  - registration_expiry: LATEST('driver_standing_events', 'document_expiry_date', event_type='driver_document_submit', document_type='vehicle_registration')
  - days_to_registration_expiry: DAYS(NOW, registration_expiry)
  - registration_adj: K('reg_lapsed_adj') if days_to_registration_expiry < 0 else (K('reg_soon_adj') if days_to_registration_expiry < K('reg_soon_days') else 0)
  - adjusted_validity: standard_validity + age_adj + late_adj + use_adj + registration_adj
  - days_ahead: DAYS(inspection_date, F('inspection_expiry_date'))
  - inspection_validity: adjusted_validity + days_ahead if days_ahead >= K('early_days') else (adjusted_validity - MN(0 - days_ahead, K('lapse_cap_days')) if days_ahead < 0 else adjusted_validity)
  - result: inspection_validity
  compute_basis:
    inspection_date: The inspection is the latest vehicle inspection upload on the standing record, and the inspection date is the date of that upload entry.
    standard_validity: The inspection validity days start from the level's inspection interval (inspection_interval_months) counted at month_days days to the month.
    current_year: counted as the current calendar year minus its model year
    vehicle_age: counted as the current calendar year minus its model year
    age_adj: 'Vehicle age: for a vehicle at least age_old_years old, counted as the current calendar year minus its model year, the inspection validity days change by age_old_adj days; for one at least age_mid_years but fewer than age_old_years years old, they change by age_mid_adj days; for one fewer than age_mid_years years old, they do not change.'
    late_inspection_notices: when the standing record holds three or more second expiry notices for the vehicle inspection dated fewer than late_window_months whole calendar months before the recording day
    late_adj: 'Late inspections: when the standing record holds three or more second expiry notices for the vehicle inspection dated fewer than late_window_months whole calendar months before the recording day, the inspection validity days change by late_three_adj days; when it holds one or two, they change by late_some_adj days; when it holds none, they do not change.'
    yearly_trips: the agreement's lifetime trips divided by its days active, counted from its activation date to the recording day, and multiplied by 365 give its yearly trips
    use_adj: 'Vehicle use: the agreement''s lifetime trips divided by its days active, counted from its activation date to the recording day, and multiplied by 365 give its yearly trips; yearly trips of at least use_high_trips change the inspection validity days by use_high_adj days, yearly trips of at least use_mid_trips but fewer than use_high_trips change them by use_mid_adj days, and fewer than use_mid_trips leave them unchanged.'
    registration_expiry: the vehicle registration on file, the latest vehicle registration upload on the standing record
    days_to_registration_expiry: when it expires on the recording day or fewer than reg_soon_days days after it
    registration_adj: 'Registration on file: when the vehicle registration on file, the latest vehicle registration upload on the standing record, expired before the recording day, the inspection validity days change by reg_lapsed_adj days; when it expires on the recording day or fewer than reg_soon_days days after it, they change by reg_soon_adj days; when it expires later, they do not change.'
    adjusted_validity: Four adjustments are added once each to that standard validity, giving the adjusted validity, and the clock-start rule then turns the adjusted validity into the inspection validity days.
    days_ahead: counted from the inspection date to the expiry date on file
    inspection_validity: 'Clock-start rule: for an inspection passed while the inspection on file still had at least early_days days to run, counted from the inspection date to the expiry date on file, the inspection validity days run from that expiry date, so the days between the inspection date and the expiry date on file are added to the adjusted validity; for an inspection passed after the inspection on file had expired, they run from the inspection date and the adjusted validity loses the days the inspection on file had been expired, at most lapse_cap_days days; for an inspection passed while the inspection on file had not expired but had fewer than early_days days to run, they run from the inspection date and the adjusted validity is taken unchanged.'
    result: 'An inspection upload carries no expiry date of its own: support records it, and the vehicle inspection expiry date on the agreement becomes the inspection date plus the inspection validity days.'
  factors:
  - id: vehicle_age
    effect: parameter
    decides: age_adj
    bindings:
    - current_year
    - vehicle_age
    - age_adj
    ladder:
    - when: the vehicle is at least age_old_years old (current calendar year minus model year)
      value: K('age_old_adj')
    - when: it is at least age_mid_years but fewer than age_old_years years old
      value: K('age_mid_adj')
    - when: it is fewer than age_mid_years years old
      value: '0'
    baseline:
      age_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: late_inspections
    effect: parameter
    decides: late_adj
    bindings:
    - late_inspection_notices
    - late_adj
    ladder:
    - when: three or more second expiry notices for the vehicle inspection dated fewer than late_window_months whole calendar months back
      value: K('late_three_adj')
    - when: one or two such second expiry notices
      value: K('late_some_adj')
    - when: no such second expiry notice
      value: '0'
    baseline:
      late_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: vehicle_use
    effect: parameter
    decides: use_adj
    bindings:
    - yearly_trips
    - use_adj
    ladder:
    - when: yearly trips (lifetime trips per day active times 365) of at least use_high_trips
      value: K('use_high_adj')
    - when: yearly trips of at least use_mid_trips but fewer than use_high_trips
      value: K('use_mid_adj')
    - when: yearly trips fewer than use_mid_trips
      value: '0'
    baseline:
      use_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: registration_on_file
    effect: parameter
    decides: registration_adj
    bindings:
    - registration_expiry
    - days_to_registration_expiry
    - registration_adj
    ladder:
    - when: the registration on file expired before the recording day
      value: K('reg_lapsed_adj')
    - when: it expires on the recording day or fewer than reg_soon_days days after it
      value: K('reg_soon_adj')
    - when: it expires reg_soon_days or more days after the recording day
      value: '0'
    baseline:
      registration_adj: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: clock_start
    effect: method
    decides: inspection_validity
    bindings:
    - days_ahead
    - inspection_validity
    ladder:
    - when: the inspection on file still had at least early_days days to run on the inspection date
      method: 'the validity runs from the expiry date on file: the days from the inspection date to that expiry date are added to the adjusted validity'
    - when: the inspection on file had already expired on the inspection date
      method: the validity runs from the inspection date and loses the days the inspection on file had been expired, at most lapse_cap_days
    - when: the inspection on file had not expired but had fewer than early_days days to run
      method: the validity runs from the inspection date and the adjusted validity is taken unchanged
    baseline:
      inspection_validity: adjusted_validity
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The inspection validity days are the calendar days, counted from the inspection date, for which a passed vehicle inspection uploaded to the standing record counts as the vehicle inspection on file. An inspection upload carries no expiry date of its own: support records it, and the vehicle inspection expiry date on the agreement becomes the inspection date plus the inspection validity days. The inspection is the latest vehicle inspection upload on the standing record, and the inspection date is the date of that upload entry. The inspection validity days start from the level''s inspection interval (inspection_interval_months) counted at month_days days to the month.'
    params:
    - inspection_interval_months
    - month_days
  inputs:
    history:
    - table: driver_standing_events
      aggregate: latest
      field: event_date
      filters:
        event_type: driver_document_submit
        document_type: vehicle_inspection
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 24
      filters:
        event_type: driver_document_expiry_notice
        document_type: vehicle_inspection
        notice_sequence: 2
    - table: driver_standing_events
      aggregate: latest
      field: document_expiry_date
      filters:
        event_type: driver_document_submit
        document_type: vehicle_registration
    cross_category: []
- id: driver_ext_temporary_permit_acceptance
  base_policy_refs:
  - driver_document_compliance
  overwrite:
  - base_policy: driver_document_compliance
    superseded_clause: An uploaded document updates the expiry date on the agreement only when it is of a required type and its expiry date is later than the one on file.
    replaced_by: The upload puts the temporary permit on the standing record with an expiry date of the upload day plus the temporary permit acceptance days, and the for-hire permit expiry date on the agreement becomes that same date.
  trigger: on_request
  subject:
  - driver_document_submit
  - driver_document_update
  computes: accepted_days
  target_tool: upload_temporary_permit_14d2792d
  params:
    standard_permit_days: 30
    rating_high: 4.9
    rating_mid: 4.85
    rating_high_bonus: 6
    rating_mid_bonus: 3
    short_doc_days: 30
    short_two_adj: -12
    short_one_adj: -6
    check_recent_days: 180
    check_year_days: 365
    check_recent_bonus: 6
    check_year_bonus: 3
    permit_window_months: 36
    permit_three_bonus: 5
    permit_two_bonus: 2
    deactivated_adj: -10
    hold_adj: -5
    relapse_days: 14
    lapse_cap_days: 10
  rule: 'The temporary permit acceptance days are the calendar days, counted from the day the driver uploads it, for which the temporary for-hire permit issued on renewal is accepted as the for-hire permit on file. The upload puts the temporary permit on the standing record with an expiry date of the upload day plus the temporary permit acceptance days, and the for-hire permit expiry date on the agreement becomes that same date. The temporary permit acceptance days start from standard_permit_days days. The temporary permit acceptance days are not worked out until the vehicle inspection expiry date on the agreement carries the validity of the latest inspection uploaded to the standing record. Before the temporary permit acceptance days are worked out, the agreement must already carry the document hold owed for a vehicle registration whose grace days have run out. Five adjustments are added once each to the standard temporary permit days, giving the adjusted temporary permit days; the permit takeover rule then adds days to them or takes days off them as it states, and the temporary permit acceptance days are the result, never below one. Rating: when the rating at the latest rating review is at least rating_high, the temporary permit acceptance days gain rating_high_bonus days; when it is at least rating_mid but below rating_high, they gain rating_mid_bonus days; when it is below rating_mid, they gain none; ratings are compared at two decimal places as recorded. Other vehicle documents on file: counting the auto insurance and the vehicle inspection by their expiry dates on the agreement, and the vehicle registration by the expiry date on its latest upload, each whose expiry date lies fewer than short_doc_days calendar days after the upload day, or is already past, is a short document; with two or more short documents the temporary permit acceptance days change by short_two_adj days, with exactly one they change by short_one_adj days, and with none they do not change. Background check recency: when the latest clear background check on the agreement is dated fewer than check_recent_days calendar days before the upload day, the temporary permit acceptance days gain check_recent_bonus days; when it is dated at least check_recent_days but fewer than check_year_days days before, they gain check_year_bonus days; when it is dated check_year_days days or more before, they gain none. Permit renewal history: when the standing record holds three or more for-hire permit uploads dated fewer than permit_window_months whole calendar months before the upload day, the temporary permit acceptance days gain permit_three_bonus days; when it holds exactly two, they gain permit_two_bonus days; when it holds one or none, they gain none. Agreement standing: on an agreement deactivated with its deactivation date on or before the upload day, the temporary permit acceptance days change by deactivated_adj days; on an agreement on hold with its hold start date on or before the upload day, they change by hold_adj days; on an agreement in any other standing, they do not change. Permit takeover rule: when the for-hire permit expiry date on the agreement is later than the upload day, the temporary permit takes over when that permit ends, so its cover is counted from that expiry date and the days from the upload day to it are added; when the permit on the agreement expired at least relapse_days calendar days before the upload day, the cover is counted from the upload day and the uncovered days beyond relapse_days are taken off, at most lapse_cap_days days; when it expired fewer than relapse_days days before the upload day, or on the upload day itself, the cover is counted from the upload day and nothing is added or taken off. No rounding applies.'
  prerequisite:
  - problem: driver_ext_inspection_validity
    kind: value_input
    gate: short_doc_adj
    form: state
    policy_source: The temporary permit acceptance days are not worked out until the vehicle inspection expiry date on the agreement carries the validity of the latest inspection uploaded to the standing record.
    condition: driver_agreements.inspection_expiry_date equals the inspection date of the latest vehicle inspection upload plus the inspection validity days that upload is owed.
    resolved_by: record_inspection_validity_ad704ee2
    effect: The vehicle inspection stops being a short document once its validity is on the agreement, so short_documents falls by one and short_doc_adj moves up one tier.
  - problem: driver_ext_registration_hold_start
    kind: value_input
    gate: standing_adj
    form: state
    policy_source: Before the temporary permit acceptance days are worked out, the agreement must already carry the document hold owed for a vehicle registration whose grace days have run out.
    condition: driver_agreements.status reads on_hold with hold_reason document_expired and hold_started_date equal to the lapsed registration's expiry date plus its registration grace days, whenever that start date is on or before the upload day.
    resolved_by: place_registration_hold_154e4b50
    effect: The agreement-standing adjustment moves from 0 (active) to its on-hold value (hold_adj), so standing_adj changes value.
  cross_category: []
  compute:
  - review_rating: LATEST('driver_standing_events', 'rating_at_review', event_type='driver_rating_review')
  - rating_adj: K('rating_high_bonus') if review_rating >= K('rating_high') else (K('rating_mid_bonus') if review_rating >= K('rating_mid') else 0)
  - insurance_left: DAYS(NOW, F('insurance_expiry_date'))
  - inspection_left: DAYS(NOW, F('inspection_expiry_date'))
  - registration_left: DAYS(NOW, LATEST('driver_standing_events', 'document_expiry_date', event_type='driver_document_submit', document_type='vehicle_registration'))
  - short_documents: int(insurance_left < K('short_doc_days')) + int(inspection_left < K('short_doc_days')) + int(registration_left < K('short_doc_days'))
  - short_doc_adj: K('short_two_adj') if short_documents >= 2 else (K('short_one_adj') if short_documents == 1 else 0)
  - days_since_check: DAYS(F('background_check_date'), NOW)
  - check_adj: K('check_recent_bonus') if days_since_check < K('check_recent_days') else (K('check_year_bonus') if days_since_check < K('check_year_days') else 0)
  - permit_uploads: COUNT('driver_standing_events', within_months=K('permit_window_months'), event_type='driver_document_submit', document_type='commercial_permit')
  - history_adj: K('permit_three_bonus') if permit_uploads >= 3 else (K('permit_two_bonus') if permit_uploads == 2 else 0)
  - standing_adj: K('deactivated_adj') if (F('status') == 'deactivated' and DAYS(F('deactivation_date'), NOW) >= 0) else (K('hold_adj') if (F('status') == 'on_hold' and DAYS(F('hold_started_date'), NOW) >= 0) else 0)
  - adjusted_permit_days: K('standard_permit_days') + rating_adj + short_doc_adj + check_adj + history_adj + standing_adj
  - permit_left: DAYS(NOW, F('commercial_permit_expiry_date'))
  - takeover_shift: permit_left if permit_left > 0 else ((0 - MN((0 - permit_left) - K('relapse_days'), K('lapse_cap_days'))) if (0 - permit_left) >= K('relapse_days') else 0)
  - result: MX(1, adjusted_permit_days + takeover_shift)
  compute_basis:
    review_rating: when the rating at the latest rating review is at least rating_high
    rating_adj: 'Rating: when the rating at the latest rating review is at least rating_high, the temporary permit acceptance days gain rating_high_bonus days; when it is at least rating_mid but below rating_high, they gain rating_mid_bonus days; when it is below rating_mid, they gain none; ratings are compared at two decimal places as recorded.'
    insurance_left: counting the auto insurance and the vehicle inspection by their expiry dates on the agreement
    inspection_left: counting the auto insurance and the vehicle inspection by their expiry dates on the agreement
    registration_left: the vehicle registration by the expiry date on its latest upload
    short_documents: each whose expiry date lies fewer than short_doc_days calendar days after the upload day, or is already past, is a short document
    short_doc_adj: 'Other vehicle documents on file: counting the auto insurance and the vehicle inspection by their expiry dates on the agreement, and the vehicle registration by the expiry date on its latest upload, each whose expiry date lies fewer than short_doc_days calendar days after the upload day, or is already past, is a short document; with two or more short documents the temporary permit acceptance days change by short_two_adj days, with exactly one they change by short_one_adj days, and with none they do not change.'
    days_since_check: when the latest clear background check on the agreement is dated fewer than check_recent_days calendar days before the upload day
    check_adj: 'Background check recency: when the latest clear background check on the agreement is dated fewer than check_recent_days calendar days before the upload day, the temporary permit acceptance days gain check_recent_bonus days; when it is dated at least check_recent_days but fewer than check_year_days days before, they gain check_year_bonus days; when it is dated check_year_days days or more before, they gain none.'
    permit_uploads: when the standing record holds three or more for-hire permit uploads dated fewer than permit_window_months whole calendar months before the upload day
    history_adj: 'Permit renewal history: when the standing record holds three or more for-hire permit uploads dated fewer than permit_window_months whole calendar months before the upload day, the temporary permit acceptance days gain permit_three_bonus days; when it holds exactly two, they gain permit_two_bonus days; when it holds one or none, they gain none.'
    standing_adj: 'Agreement standing: on an agreement deactivated with its deactivation date on or before the upload day, the temporary permit acceptance days change by deactivated_adj days; on an agreement on hold with its hold start date on or before the upload day, they change by hold_adj days; on an agreement in any other standing, they do not change.'
    adjusted_permit_days: Five adjustments are added once each to the standard temporary permit days, giving the adjusted temporary permit days
    permit_left: when the for-hire permit expiry date on the agreement is later than the upload day
    takeover_shift: 'Permit takeover rule: when the for-hire permit expiry date on the agreement is later than the upload day, the temporary permit takes over when that permit ends, so its cover is counted from that expiry date and the days from the upload day to it are added; when the permit on the agreement expired at least relapse_days calendar days before the upload day, the cover is counted from the upload day and the uncovered days beyond relapse_days are taken off, at most lapse_cap_days days; when it expired fewer than relapse_days days before the upload day, or on the upload day itself, the cover is counted from the upload day and nothing is added or taken off.'
    result: the temporary permit acceptance days are the result, never below one
  factors:
  - id: permit_takeover
    effect: method
    decides: takeover_shift
    bindings:
    - permit_left
    - takeover_shift
    ladder:
    - when: the permit expiry date on the agreement is later than the upload day
      method: 'the cover is counted from the old permit''s expiry date: the days from the upload day to that date are added'
    - when: the permit on the agreement expired at least relapse_days days before the upload day
      method: 'the cover is counted from the upload day: the days the permit was uncovered beyond relapse_days are taken off, at most lapse_cap_days'
    - when: the permit expired fewer than relapse_days days before the upload day, or on the upload day
      method: the cover is counted from the upload day and the adjusted days stand
    baseline:
      takeover_shift: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: review_rating
    effect: parameter
    decides: rating_adj
    bindings:
    - review_rating
    - rating_adj
    ladder:
    - when: the rating at the latest rating review is at least rating_high
      value: K('rating_high_bonus')
    - when: it is at least rating_mid but below rating_high
      value: K('rating_mid_bonus')
    - when: it is below rating_mid
      value: '0'
    baseline:
      rating_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: other_vehicle_documents
    effect: parameter
    decides: short_doc_adj
    bindings:
    - insurance_left
    - inspection_left
    - registration_left
    - short_documents
    - short_doc_adj
    ladder:
    - when: two or more of the auto insurance, the vehicle inspection and the vehicle registration run fewer than short_doc_days days past the upload day or are past
      value: K('short_two_adj')
    - when: exactly one of them does
      value: K('short_one_adj')
    - when: none of them does
      value: '0'
    baseline:
      short_doc_adj: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: background_check_recency
    effect: parameter
    decides: check_adj
    bindings:
    - days_since_check
    - check_adj
    ladder:
    - when: the latest clear background check is dated fewer than check_recent_days calendar days before the upload day
      value: K('check_recent_bonus')
    - when: it is dated at least check_recent_days but fewer than check_year_days days before
      value: K('check_year_bonus')
    - when: it is dated check_year_days days or more before
      value: '0'
    baseline:
      check_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: permit_renewal_history
    effect: parameter
    decides: history_adj
    bindings:
    - permit_uploads
    - history_adj
    ladder:
    - when: three or more for-hire permit uploads dated fewer than permit_window_months whole calendar months back
      value: K('permit_three_bonus')
    - when: exactly two such uploads
      value: K('permit_two_bonus')
    - when: one such upload or none
      value: '0'
    baseline:
      history_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: agreement_standing
    effect: parameter
    decides: standing_adj
    bindings:
    - standing_adj
    ladder:
    - when: the agreement is deactivated with its deactivation date on or before the upload day
      value: K('deactivated_adj')
    - when: the agreement is on hold with its hold start date on or before the upload day
      value: K('hold_adj')
    - when: the agreement is in any other standing
      value: '0'
    baseline:
      standing_adj: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The temporary permit acceptance days are the calendar days, counted from the day the driver uploads it, for which the temporary for-hire permit issued on renewal is accepted as the for-hire permit on file. The upload puts the temporary permit on the standing record with an expiry date of the upload day plus the temporary permit acceptance days, and the for-hire permit expiry date on the agreement becomes that same date. The temporary permit acceptance days start from standard_permit_days days.
    params:
    - standard_permit_days
  inputs:
    history:
    - table: driver_standing_events
      aggregate: latest
      field: rating_at_review
      filters:
        event_type: driver_rating_review
    - table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 36
      filters:
        event_type: driver_document_submit
        document_type: commercial_permit
    cross_category: []
