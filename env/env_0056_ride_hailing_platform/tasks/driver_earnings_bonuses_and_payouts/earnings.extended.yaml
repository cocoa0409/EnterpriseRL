    ladder:
    - when: the opt-in comes early_flat_days or more calendar days before the window start date
      method: a flat early_flat_credit
    - when: the opt-in comes at least one but fewer than early_flat_days calendar days before the window start date
      method: early_per_day_credit multiplied by the number of those days
    - when: otherwise (the opt-in is made on the window start date)
      method: nothing
    baseline:
      early_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The standard locked guarantee is the guaranteed amount stated on the upcoming earnings guarantee offer, unchanged. The locked guarantee is rounded half up to the cent once, at the end.
