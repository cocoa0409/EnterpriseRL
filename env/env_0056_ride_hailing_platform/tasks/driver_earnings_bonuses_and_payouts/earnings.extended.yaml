# Driver earnings and Wayfare Pro: every driver has one earnings account. Trip pay, tips, fee
# shares, cleaning payouts and incentive bonuses post into it; instant cashouts, weekly payouts,
# rental deductions and corrections post out of it. The account's tier is the driver's Wayfare Pro
# status for the current quarter, set from Pro points earned in the quarter before.
category: earnings
display_name: Driver Earnings and Wayfare Pro

binding:
  holding_table: earnings_accounts
  event_tables: [earnings_ledger, bonus_offers]
  status_field: status
  variant_field: variant_name
  quantity_fields: {available_balance: earnings_balance, pro_points_balance: pro_points}

lifecycle:
  states: [pending_setup, active, payout_hold, closed]
  transitions:
    - {from: pending_setup, to: active, by: system, means: "The driver's payout bank account or Wayfare debit card is verified."}
    - {from: pending_setup, to: closed, by: system, means: "The driver agreement closes before payouts were ever set up."}
    - {from: active, to: payout_hold, by: agent, means: "Payouts and cashouts are held for a recorded hold reason."}
    - {from: payout_hold, to: active, by: agent, means: "The hold reason is resolved and payouts resume."}
    - {from: active, to: closed, by: system, means: "The driver agreement is closed and the final balance has been paid out."}
    - {from: payout_hold, to: closed, by: system, means: "The driver agreement is closed while payouts are held; any balance is settled under the hold outcome."}

accounts:
  - key: earnings_balance
    unit: USD
    meaning: "Driver earnings posted and not yet paid out, net of deductions, clawbacks and fees; may be negative."
  - key: pro_points
    unit: points
    meaning: "Wayfare Pro points earned in the current quarter."

parameter_schema:
  tier_period_months: "Length of a Wayfare Pro qualifying period: calendar quarters (January-March, April-June, July-September, October-December), months"
  tier_evaluation_basis: "Status for a quarter is set from the points and quality metrics of the quarter just ended"
  max_tier_drop_per_evaluation: "Most status levels a driver can drop at one quarterly evaluation (status protection), levels"
  points_per_standard_trip: "Pro points for a completed trip outside peak periods in a non-premium option, points"
  points_per_peak_trip: "Pro points for a completed trip requested inside a peak period, points"
  points_per_premium_trip: "Pro points for a completed trip in a premium option outside peak periods, points"
  peak_periods: "Peak periods by day group, market local time, start inclusive and end exclusive (mapping)"
  premium_options: "Ride options whose trips earn premium points (list)"
  points_precedence: "When a trip is both peak and premium it earns the peak points; points are never added together"
  points_reset_rule: "Points reset to 0 at the end of each quarter, after the evaluation"
  driver_rate_card: "Driver pay per completed trip by ride option: base, per mile and per minute of the trip, and the minimum trip pay, USD (mapping)"
  driver_trip_extra: "Flat extra driver pay per completed trip by ride option (Green: zero-emission extra), USD (mapping)"
  surge_driver_share_pct: "Share of the busy-time multiplier passed to the driver on time-and-distance pay, percent"
  driver_wait_rate: "Driver pay per billable wait minute, by ride option, USD per minute (mapping)"
  toll_reimbursement_pct: "Share of each toll charged to the rider that is paid to the driver, percent"
  airport_fee_driver_share_pct: "Share of airport access fees paid to the driver, percent"
  long_pickup_threshold_minutes: "Original pickup estimate above which long pickup pay applies, minutes"
  long_pickup_rate_per_minute: "Driver pay per estimated pickup minute above the threshold, USD per minute"
  cancellation_fee_driver_share_pct: "Share of a rider cancellation fee paid to the driver, percent"
  no_show_fee_driver_share_pct: "Share of a rider no-show fee paid to the driver, percent"
  reservation_fee_driver_share_pct: "Share of a reservation fee paid to the driver who completes the reserved trip, percent"
  tip_driver_share_pct: "Share of a rider tip paid to the driver, percent"
  cleaning_fee_driver_share_pct: "Share of a cleaning fee charged to a rider that is paid to the driver, percent"
  damage_fee_driver_share_pct: "Share of a damage fee charged to a rider that is paid to the driver, percent"
  instant_cashout_fee_external: "Fee per instant cashout to an external debit card beyond the free cashouts of the day, USD"
  instant_cashout_fee_wayfare_card: "Fee per instant cashout to the Wayfare debit card, USD"
  free_external_cashouts_per_day: "Instant cashouts to an external debit card free of the fee per calendar day, count"
  instant_cashout_daily_count_limit: "Most instant cashouts per calendar day, count"
  instant_cashout_min_amount: "Smallest instant cashout, USD"
  instant_cashout_daily_max_amount: "Most cashed out instantly per calendar day, USD"
  instant_cashout_new_account_wait_days: "Calendar days after the account's opened_date before instant cashout is available"
  cashout_day_basis: "Daily cashout limits and free cashouts count by calendar day in the driver's market time"
  earnings_week: "An earnings week runs from Monday 04:00 to the next Monday 03:59:59, market local time"
  weekly_payout_weekday: "Day the scheduled weekly payout of the previous earnings week is sent"
  weekly_payout_min_amount: "Smallest scheduled payout sent; a lower or negative balance carries forward, USD"
  negative_balance_hold_threshold: "An available balance at or below this amount places payouts on hold for negative balance, USD"
  fraud_review_max_days: "Longest a fraud review payout hold may last before it must be released or the agreement deactivated, calendar days"
  adjustment_request_window_days: "Calendar days after a trip's drop-off or cancellation within which a driver may ask for missing pay on it"
  adjustment_agent_limit: "Largest total support may credit to a driver for one trip without the earnings review team, USD"
  bonus_payout_days: "Calendar days after window_end by which an earned bonus is credited"
  bonus_claim_window_days: "Calendar days after window_end within which a driver may ask about an unpaid bonus"
  guarantee_min_acceptance_rate_pct: "Lowest acceptance rate over the guarantee window that keeps an earnings guarantee payable, percent"
  guarantee_max_cancellation_rate_pct: "Highest driver cancellation rate over the window that keeps an earnings guarantee payable, percent"
  guarantee_earnings_basis: "Earnings that count toward a guarantee (list); tips, bonuses, cleaning and damage payouts never count"
  quest_trip_basis: "Trips counted toward quests, consecutive-trip and referral targets: completed trips whose drop-off falls inside the window, in the offer's market"
  consecutive_trips_max_gap_minutes: "Most minutes between one drop-off and the next acceptance for trips to stay consecutive, minutes"
  referral_completion_days: "Calendar days from a referred driver's activation within which the referral target must be met"
  optin_required_types: "Incentives that pay only if the driver opted in before window_start (list)"
  bonus_clawback_lookback_days: "Calendar days after a bonus was credited within which it can be clawed back for disqualified trips"
  rental_deduction_basis: "Rental charges are deducted from the available balance only down to 0.00; the rest stays on the rental to be paid by card"
  rounding_rule: "Every computed earnings amount is rounded half up to the cent once, at the end of its computation"

