    - driver
    - rental
- id: earnings_ext_guarantee_optin_lock
  base_policy_refs:
  - earnings_evt_bonus
  - earnings_pro_tier_evaluation
  overwrite:
  - base_policy: earnings_evt_bonus
    superseded_clause: An earnings guarantee pays the guaranteed_amount less the window earnings (earnings_msr_guarantee_window_earnings, counting only guarantee_earnings_basis), when positive, provided the driver was online at least required_online_minutes, kept an acceptance rate of at least guarantee_min_acceptance_rate_pct and a cancellation rate of at most guarantee_max_cancellation_rate_pct over the window.
    replaced_by: Once an opt-in is recorded, the earnings guarantee for that offer pays the locked guarantee on the opt-in less the window earnings (earnings_msr_guarantee_window_earnings, counting only guarantee_earnings_basis), when positive, provided the driver was online at least required_online_minutes, kept an acceptance rate of at least guarantee_min_acceptance_rate_pct and a cancellation rate of at most guarantee_max_cancellation_rate_pct over the window.
  - base_policy: earnings_pro_tier_evaluation
    superseded_clause: Status benefits (instant cashout fees and free cashouts) follow the status recorded on the account for the current quarter.
    replaced_by: The Pro boost follows the Wayfare Pro status recorded on the earnings account for the current quarter
  trigger: on_request
  subject:
  - earnings_bonus_optin
  computes: guaranteed_amount
  target_tool: opt_in_to_guarantee_dc9f134f
  params:
    level_scale_premium: 1.25
    level_scale_plus: 1.1
    quality_lookback_months: 6
    quality_warnings_two: 2
    quality_scale_two: 0.85
    quality_scale_one: 0.93
    boost_points_top: 300
    boost_points_mid: 30
    boost_top: 0.08
    boost_mid: 0.04
    activity_lookback_months: 1
    activity_trips_low: 20
    activity_trips_high: 60
    activity_scale_low: 0.8
    activity_scale_mid: 0.9
    career_trips_new: 1000
    career_trips_mid: 3000
    career_supplement_new: 20.0
    career_supplement_mid: 10.0
    early_flat_days: 3
    early_flat_credit: 15.0
    early_per_day_credit: 4.0
  rule: 'An earnings guarantee opt-in is the driver''s own action; it is open only for the account''s upcoming earnings guarantee, which is the earnings guarantee offer with the latest window start on the account, and only before that window starts. The opt-in records the locked guarantee, the guaranteed amount the driver is held to for that window. Once an opt-in is recorded, the earnings guarantee for that offer pays the locked guarantee on the opt-in less the window earnings (earnings_msr_guarantee_window_earnings, counting only guarantee_earnings_basis), when positive, provided the driver was online at least required_online_minutes, kept an acceptance rate of at least guarantee_min_acceptance_rate_pct and a cancellation rate of at most guarantee_max_cancellation_rate_pct over the window. The standard locked guarantee is the guaranteed amount stated on the upcoming earnings guarantee offer, unchanged. The locked guarantee is rounded half up to the cent once, at the end. A locked guarantee is not worked out until the earnings account no longer shows a payout hold whose reason has been resolved. The locked guarantee is worked out in this order: the guaranteed amount stated on the offer is multiplied by the level scale, the quality scale, one plus the Pro boost and the activity scale, all applied together to that stated amount; the early-career supplement and the early opt-in credit are then added to that product; the sum is rounded once. The level scale follows the service level of the driver''s driver services agreement: the Wayfare Black and Wayfare Black SUV Driver Agreements scale the guarantee by level_scale_premium; the Wayfare Comfort and Wayfare XL Driver Agreements scale it by level_scale_plus; every other service level leaves it unscaled. The quality scale follows the quality warnings recorded on the driver''s standing record within the last quality_lookback_months whole months: quality_warnings_two or more warnings scale the guarantee by quality_scale_two; at least one but fewer than quality_warnings_two warnings scale it by quality_scale_one; no warning leaves it unscaled. The Pro boost follows the Wayfare Pro status recorded on the earnings account for the current quarter, the Pro points the account has earned in the current quarter and whether its payouts are on hold: Wayfare Pro Platinum, Diamond or Diamond Elite with at least boost_points_top points this quarter on an account whose payouts are not on hold earns boost_top; Wayfare Pro Silver or Gold with at least boost_points_mid points this quarter on an account whose payouts are not on hold earns boost_mid; any other status, fewer points, or an account on payout hold earns no boost. The activity scale follows the driver''s paid trips in the last activity_lookback_months whole month, which are the trip pay entries posted in that period less the trips whose pay was taken back as fraudulent in the same period: fewer than activity_trips_low paid trips scale the guarantee by activity_scale_low; at least activity_trips_low but fewer than activity_trips_high paid trips scale it by activity_scale_mid; activity_trips_high or more leave it unscaled. The early-career supplement follows the lifetime trips on the driver''s driver services agreement: fewer than career_trips_new adds career_supplement_new; at least career_trips_new but fewer than career_trips_mid adds career_supplement_mid; career_trips_mid or more adds nothing. The early opt-in credit follows how many calendar days the opt-in comes before the window''s start date, counted from the opt-in date to the window''s start date: early_flat_days or more days earn the flat early_flat_credit; at least one but fewer than early_flat_days days earn early_per_day_credit for each of those days; an opt-in on the window''s start date earns nothing.'
  prerequisite:
  - problem: earnings_ext_hold_release_payout
    kind: value_input
    gate: pro_boost
    form: state
    policy_source: A locked guarantee is not worked out until the earnings account no longer shows a payout hold whose reason has been resolved.
    condition: earnings_accounts.status is active and earnings_accounts.payout_hold_reason is none whenever the hold reason on record has been resolved (for negative_balance, available_balance above negative_balance_hold_threshold).
    resolved_by: lift_payout_hold_7e61ef01
    effect: Lifting the resolved hold sets the earnings account back to active, so the Pro boost binding moves from its on-hold tier (no boost) to the tier the Pro status and the quarter's Pro points select.
  cross_category:
  - category: driver
    as: history
    reads:
    - variant_name
    - lifetime_trips
    - driver_standing_events.event_type
    - driver_standing_events.event_date
    note: The level scale, the early-career supplement and the quality scale are decided from the driver services agreement and its standing record.
  compute:
  - offer_guarantee: float(LATEST('bonus_offers','guaranteed_amount', date_field='window_start', event_type='earnings_bonus_offer_issue', incentive_type='earnings_guarantee'))
  - offer_start: LATEST('bonus_offers','window_start', date_field='window_start', event_type='earnings_bonus_offer_issue', incentive_type='earnings_guarantee')
  - agreement_level: CFIELD('driver','variant_name')
  - level_scale: K('level_scale_premium') if (agreement_level == 'Wayfare Black Driver Agreement' or agreement_level == 'Wayfare Black SUV Driver Agreement') else (K('level_scale_plus') if (agreement_level == 'Wayfare Comfort Driver Agreement' or agreement_level == 'Wayfare XL Driver Agreement') else 1.0)
  - warnings: XCOUNT('driver','driver_standing_events', within_months=K('quality_lookback_months'), date_field='event_date', event_type='driver_quality_warning')
  - quality_scale: K('quality_scale_two') if warnings >= K('quality_warnings_two') else (K('quality_scale_one') if warnings >= 1 else 1.0)
  - quarter_points: SUM('earnings_ledger','points', event_type='earnings_points_credit', points_period_start=F('tier_period_start'))
  - pro_boost: K('boost_top') if ((F('variant_name') == 'Wayfare Pro Platinum' or F('variant_name') == 'Wayfare Pro Diamond' or F('variant_name') == 'Wayfare Pro Diamond Elite') and quarter_points >= K('boost_points_top') and F('status') == 'active') else (K('boost_mid') if ((F('variant_name') == 'Wayfare Pro Silver' or F('variant_name') == 'Wayfare Pro Gold') and quarter_points >= K('boost_points_mid') and F('status') == 'active') else 0)
  - paid_trips: COUNT('earnings_ledger', within_months=K('activity_lookback_months'), date_field='entry_date', event_type='earnings_trip_credit') - COUNT('earnings_ledger', within_months=K('activity_lookback_months'), date_field='entry_date', event_type='earnings_adjustment_debit', adjustment_reason='fraudulent_trip')
  - activity_scale: K('activity_scale_low') if paid_trips < K('activity_trips_low') else (K('activity_scale_mid') if paid_trips < K('activity_trips_high') else 1.0)
  - career_trips: int(CFIELD('driver','lifetime_trips'))
  - career_supplement: K('career_supplement_new') if career_trips < K('career_trips_new') else (K('career_supplement_mid') if career_trips < K('career_trips_mid') else 0)
  - days_ahead: DAYS(NOW, offer_start)
  - early_credit: K('early_flat_credit') if days_ahead >= K('early_flat_days') else (K('early_per_day_credit') * days_ahead if days_ahead >= 1 else 0)
  - result: RND(offer_guarantee * level_scale * quality_scale * (1 + pro_boost) * activity_scale + career_supplement + early_credit, 2)
  compute_basis:
    offer_guarantee: The standard locked guarantee is the guaranteed amount stated on the upcoming earnings guarantee offer, unchanged.
    offer_start: 'The early opt-in credit follows how many calendar days the opt-in comes before the window''s start date, counted from the opt-in date to the window''s start date: early_flat_days or more days earn the flat early_flat_credit; at least one but fewer than early_flat_days days earn early_per_day_credit for each of those days; an opt-in on the window''s start date earns nothing.'
    agreement_level: 'The level scale follows the service level of the driver''s driver services agreement: the Wayfare Black and Wayfare Black SUV Driver Agreements scale the guarantee by level_scale_premium; the Wayfare Comfort and Wayfare XL Driver Agreements scale it by level_scale_plus; every other service level leaves it unscaled.'
    level_scale: 'The level scale follows the service level of the driver''s driver services agreement: the Wayfare Black and Wayfare Black SUV Driver Agreements scale the guarantee by level_scale_premium; the Wayfare Comfort and Wayfare XL Driver Agreements scale it by level_scale_plus; every other service level leaves it unscaled.'
    warnings: 'The quality scale follows the quality warnings recorded on the driver''s standing record within the last quality_lookback_months whole months: quality_warnings_two or more warnings scale the guarantee by quality_scale_two; at least one but fewer than quality_warnings_two warnings scale it by quality_scale_one; no warning leaves it unscaled.'
    quality_scale: 'The quality scale follows the quality warnings recorded on the driver''s standing record within the last quality_lookback_months whole months: quality_warnings_two or more warnings scale the guarantee by quality_scale_two; at least one but fewer than quality_warnings_two warnings scale it by quality_scale_one; no warning leaves it unscaled.'
    quarter_points: 'The Pro boost follows the Wayfare Pro status recorded on the earnings account for the current quarter, the Pro points the account has earned in the current quarter and whether its payouts are on hold: Wayfare Pro Platinum, Diamond or Diamond Elite with at least boost_points_top points this quarter on an account whose payouts are not on hold earns boost_top; Wayfare Pro Silver or Gold with at least boost_points_mid points this quarter on an account whose payouts are not on hold earns boost_mid; any other status, fewer points, or an account on payout hold earns no boost.'
    pro_boost: 'The Pro boost follows the Wayfare Pro status recorded on the earnings account for the current quarter, the Pro points the account has earned in the current quarter and whether its payouts are on hold: Wayfare Pro Platinum, Diamond or Diamond Elite with at least boost_points_top points this quarter on an account whose payouts are not on hold earns boost_top; Wayfare Pro Silver or Gold with at least boost_points_mid points this quarter on an account whose payouts are not on hold earns boost_mid; any other status, fewer points, or an account on payout hold earns no boost.'
    paid_trips: 'The activity scale follows the driver''s paid trips in the last activity_lookback_months whole month, which are the trip pay entries posted in that period less the trips whose pay was taken back as fraudulent in the same period: fewer than activity_trips_low paid trips scale the guarantee by activity_scale_low; at least activity_trips_low but fewer than activity_trips_high paid trips scale it by activity_scale_mid; activity_trips_high or more leave it unscaled.'
    activity_scale: 'The activity scale follows the driver''s paid trips in the last activity_lookback_months whole month, which are the trip pay entries posted in that period less the trips whose pay was taken back as fraudulent in the same period: fewer than activity_trips_low paid trips scale the guarantee by activity_scale_low; at least activity_trips_low but fewer than activity_trips_high paid trips scale it by activity_scale_mid; activity_trips_high or more leave it unscaled.'
    career_trips: 'The early-career supplement follows the lifetime trips on the driver''s driver services agreement: fewer than career_trips_new adds career_supplement_new; at least career_trips_new but fewer than career_trips_mid adds career_supplement_mid; career_trips_mid or more adds nothing.'
    career_supplement: 'The early-career supplement follows the lifetime trips on the driver''s driver services agreement: fewer than career_trips_new adds career_supplement_new; at least career_trips_new but fewer than career_trips_mid adds career_supplement_mid; career_trips_mid or more adds nothing.'
    days_ahead: 'The early opt-in credit follows how many calendar days the opt-in comes before the window''s start date, counted from the opt-in date to the window''s start date: early_flat_days or more days earn the flat early_flat_credit; at least one but fewer than early_flat_days days earn early_per_day_credit for each of those days; an opt-in on the window''s start date earns nothing.'
    early_credit: 'The early opt-in credit follows how many calendar days the opt-in comes before the window''s start date, counted from the opt-in date to the window''s start date: early_flat_days or more days earn the flat early_flat_credit; at least one but fewer than early_flat_days days earn early_per_day_credit for each of those days; an opt-in on the window''s start date earns nothing.'
    result: 'The locked guarantee is worked out in this order: the guaranteed amount stated on the offer is multiplied by the level scale, the quality scale, one plus the Pro boost and the activity scale, all applied together to that stated amount; the early-career supplement and the early opt-in credit are then added to that product; the sum is rounded once. The locked guarantee is rounded half up to the cent once, at the end.'
  factors:
  - id: level_scale
    effect: parameter
    decides: level_scale
    bindings:
    - agreement_level
    - level_scale
    ladder:
    - when: the driver services agreement is a Wayfare Black or Wayfare Black SUV Driver Agreement
      value: K('level_scale_premium')
    - when: the agreement is a Wayfare Comfort or Wayfare XL Driver Agreement
      value: K('level_scale_plus')
    - when: otherwise (any other service level)
      value: '1.0'
    baseline:
      level_scale: '1.0'
    evidence:
    - cross_category
    cross_difficulty: driver
  - id: quality_scale
    effect: parameter
    decides: quality_scale
    bindings:
    - warnings
    - quality_scale
    ladder:
    - when: quality_warnings_two or more quality warnings within the last quality_lookback_months whole months
      value: K('quality_scale_two')
    - when: at least one but fewer than quality_warnings_two quality warnings in that period
      value: K('quality_scale_one')
    - when: otherwise (no quality warning in that period)
      value: '1.0'
    baseline:
      quality_scale: '1.0'
    evidence:
    - cross_category
