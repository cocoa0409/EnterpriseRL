events:
  # ---------------- holding writes ----------------
  - type: earnings_account_open
    target: earnings_accounts
    mutation: create
    meaning: "An earnings account is opened for a driver when the driver signs a driver services agreement."
    grain: "One row per driver."
    fields:
      customer_id: "Driver."
      driver_agreement_id: "Agreement the account pays out for."
      variant_name: "Wayfare Pro Blue at opening."
      opened_date: "Date opened."
      payout_method: "Payout method chosen at setup."
      tier_period_start: "First day of the current calendar quarter."
    triggers: []
  - type: earnings_account_activate
    target: earnings_accounts
    mutation: {transition: {from: pending_setup, to: active}}
    meaning: "The payout destination is verified and the account can pay out."
    grain: "One write per account."
    fields:
      payout_method: "Verified payout method."
    triggers: []
  - type: earnings_payout_hold
    target: earnings_accounts
    mutation: {transition: {from: active, to: payout_hold}}
    meaning: "Payouts and instant cashouts are held."
    grain: "One write per hold."
    fields:
      payout_hold_reason: "bank_verification_failed, fraud_review, negative_balance or deactivation_fraud."
    triggers: []
  - type: earnings_payout_release
    target: earnings_accounts
    mutation: {transition: {from: payout_hold, to: active}}
    meaning: "A payout hold is lifted."
    grain: "One write per hold."
    fields:
      payout_hold_reason: "Set back to none."
    triggers: []
  - type: earnings_account_close
    target: earnings_accounts
    mutation: {transition: [{from: active, to: closed}, {from: payout_hold, to: closed}, {from: pending_setup, to: closed}]}
    meaning: "The earnings account is closed after the driver agreement closes."
    grain: "One write per account."
    fields:
      closed_date: "Date closed."
    triggers: []
  - type: earnings_tier_evaluation
    target: earnings_accounts
    mutation: update
    meaning: "The quarterly Wayfare Pro evaluation sets the status for the new quarter."
    grain: "One write per account per quarter."
    fields:
      variant_name: "Pro status for the new quarter."
      tier_period_start: "First day of the new quarter."
    triggers: []
  - type: earnings_payout_method_change
    target: earnings_accounts
    mutation: update
    meaning: "The driver switches scheduled payouts between bank deposit and the Wayfare debit card."
    grain: "One write per change."
    fields:
      payout_method: "New payout method."
    triggers: []

  # ---------------- ledger writes (earnings_ledger) ----------------
  - type: earnings_trip_credit
    target: earnings_ledger
    meaning: "Driver pay for a completed trip posts."
    grain: "One row per completed trip."
    distinguish_by: [trip_id]
    fields:
      earnings_account_id: "Account credited."
      trip_id: "Trip paid."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Trip pay (positive)."
    account: earnings_balance
    direction: in
    triggers:
      - event: "earnings:earnings_points_credit"
        map: {trip_id: trip_id}
  - type: earnings_tip_credit
    target: earnings_ledger
    meaning: "A rider's tip posts to the driver."
    grain: "One row per tipped trip."
    distinguish_by: [trip_id]
    fields:
      earnings_account_id: "Account credited."
      trip_id: "Trip tipped."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Tip share (positive)."
    account: earnings_balance
    direction: in
    triggers: []
  - type: earnings_cancellation_credit
    target: earnings_ledger
    meaning: "The driver's share of a rider cancellation or no-show fee posts."
    grain: "One row per trip whose rider was charged a cancellation or no-show fee."
    distinguish_by: [trip_id]
    fields:
      earnings_account_id: "Account credited."
      trip_id: "Cancelled or no-show trip."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Driver share (positive)."
    account: earnings_balance
    direction: in
    triggers: []
  - type: earnings_cleaning_credit
    target: earnings_ledger
    meaning: "The driver's payout for a cleaning or damage fee charged to a rider posts."
    grain: "One row per assessment charged."
    distinguish_by: [damage_assessment_id]
    fields:
      earnings_account_id: "Account credited."
      damage_assessment_id: "Assessment charged."
      trip_id: "Trip of the assessment."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Payout (positive)."
    account: earnings_balance
    direction: in
    triggers: []
  - type: earnings_bonus_credit
    target: earnings_ledger
    meaning: "An incentive bonus or earnings guarantee top-up that was earned posts."
    grain: "One row per offer paid."
    distinguish_by: [bonus_offer_id]
    fields:
      earnings_account_id: "Account credited."
      bonus_offer_id: "Offer paid (the issue entry)."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Bonus or top-up (positive)."
    account: earnings_balance
    direction: in
    triggers: []
  - type: earnings_adjustment_credit
    target: earnings_ledger
    meaning: "Pay missing from a trip is credited to the driver."
    grain: "One row per trip and reason."
    distinguish_by: [trip_id, adjustment_reason]
    fields:
      earnings_account_id: "Account credited."
      trip_id: "Trip the missing pay belongs to."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Amount credited (positive)."
      adjustment_reason: "missing_toll_reimbursement, missing_wait_time, missing_cancellation_credit or fare_correction."
      original_entry_id: "The trip pay entry being corrected, when one exists; empty otherwise."
    account: earnings_balance
    direction: in
    triggers: []
  - type: earnings_adjustment_debit
    target: earnings_ledger
    meaning: "Pay is taken back from the driver because a rider charge it came from was reduced or reversed, or the trip was disqualified."
    grain: "One row per trip or assessment and reason."
    distinguish_by: [trip_id, damage_assessment_id, adjustment_reason]
    fields:
      earnings_account_id: "Account debited."
      trip_id: "Trip concerned."
      damage_assessment_id: "Assessment concerned, for cleaning_fee_reversal; empty otherwise."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Amount taken back (negative)."
      adjustment_reason: "route_inefficiency_clawback, cleaning_fee_reversal, cancellation_fee_reversal, fare_correction, duplicate_credit or fraudulent_trip."
      original_entry_id: "The credit being reversed."
    account: earnings_balance
    direction: out
    triggers: []
  - type: earnings_instant_cashout
    target: earnings_ledger
    meaning: "The driver cashes out available earnings instantly."
    grain: "One row per cashout."
    distinguish_by: [posted_at]
    fields:
      earnings_account_id: "Account paid out from."
      entry_date: "Date of the cashout."
      posted_at: "Moment of the cashout."
      amount: "Amount cashed out (negative)."
      cashout_channel: "wayfare_debit_card or external_debit_card."
    account: earnings_balance
    direction: out
    triggers:
      - event: "earnings:earnings_instant_cashout_fee"
        map: {original_entry_id: earnings_entry_id, cashout_channel: cashout_channel}
  - type: earnings_instant_cashout_fee
    target: earnings_ledger
    meaning: "The fee for an instant cashout is booked (0.00 when free)."
    grain: "One row per cashout."
    distinguish_by: [original_entry_id]
    fields:
      earnings_account_id: "Account charged."
      entry_date: "Date of the cashout."
      posted_at: "Moment of the cashout."
      amount: "Fee (negative, or 0.00)."
      original_entry_id: "The cashout the fee belongs to."
      cashout_channel: "Channel of the cashout."
    account: earnings_balance
    direction: out
    triggers: []
  - type: earnings_weekly_payout
    target: earnings_ledger
    meaning: "A payout of the available balance is sent to the payout method."
    grain: "One row per earnings week paid, or per hold release or account closing payout."
    distinguish_by: [payout_week_start, payout_type]
    fields:
      earnings_account_id: "Account paid out from."
      entry_date: "Date sent."
      posted_at: "Moment sent."
      amount: "Amount paid out (negative)."
      payout_week_start: "Monday of the earnings week paid (for hold release and closing payouts, the Monday of the current week)."
      payout_type: "scheduled_weekly, hold_release or final_on_close."
    account: earnings_balance
    direction: out
    triggers: []
  - type: earnings_rental_deduction
    target: earnings_ledger
    meaning: "A Wayfare Rentals charge is paid from the driver's earnings."
    grain: "One row per rental charge paid from earnings."
    distinguish_by: [rental_charge_id]
    fields:
      earnings_account_id: "Account debited."
      rental_charge_id: "Rental charge paid."
      entry_date: "Date deducted."
      posted_at: "Moment deducted."
      amount: "Amount deducted (negative)."
    account: earnings_balance
    direction: out
    triggers: []
  - type: earnings_bonus_clawback
    target: earnings_ledger
    meaning: "A bonus already paid is taken back because qualifying trips were disqualified."
    grain: "One row per offer clawed back."
    distinguish_by: [bonus_offer_id]
    fields:
      earnings_account_id: "Account debited."
      bonus_offer_id: "Offer whose bonus is taken back."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      amount: "Amount taken back (negative)."
      original_entry_id: "The bonus credit reversed."
    account: earnings_balance
    direction: out
    triggers: []
  - type: earnings_points_credit
    target: earnings_ledger
    meaning: "Wayfare Pro points are earned on a completed trip."
    grain: "One row per completed trip."
    distinguish_by: [trip_id]
    fields:
      earnings_account_id: "Account earning points."
      trip_id: "Trip that earned them."
      entry_date: "Date posted."
      posted_at: "Moment posted."
      points: "Points earned (positive)."
      points_basis: "standard_trip, peak_trip or premium_trip."
      points_period_start: "Quarter the points count toward."
    account: pro_points
    direction: in
    triggers: []
  - type: earnings_points_reset
    target: earnings_ledger
    meaning: "Points are reset to zero at the end of a quarter."
    grain: "One row per account per quarter."
    distinguish_by: [points_period_start]
    fields:
      earnings_account_id: "Account reset."
      entry_date: "First day of the new quarter."
      posted_at: "Moment of the reset."
      points: "Minus the quarter's points."
      points_period_start: "Quarter being closed."
    account: pro_points
    direction: out
    triggers:
      - event: "earnings:earnings_tier_evaluation"
        map: {}

  # ---------------- incentive offers (bonus_offers) ----------------
  - type: earnings_bonus_offer_issue
    target: bonus_offers
    meaning: "Wayfare offers the driver a personal incentive with its own window, target and reward."
    grain: "One row per offer."
    distinguish_by: [incentive_type, window_start]
    fields:
      earnings_account_id: "Account the offer is made to."
      issued_at: "Moment issued."
      incentive_type: "quest, consecutive_trips, earnings_guarantee or referral."
      market: "Market the offer is valid in."
      window_start: "Start of the window."
      window_end: "End of the window (exclusive)."
      target_trip_count: "Trips required, or 0 for a guarantee."
      reward_amount: "Reward when the target is met, or 0.00 for a guarantee."
      guaranteed_amount: "Guaranteed earnings, or 0.00."
      required_online_minutes: "Online time a guarantee requires, or 0."
      referred_customer_id: "Referred new driver, for a referral offer."
    triggers: []
  - type: earnings_bonus_optin
    target: bonus_offers
    meaning: "The driver opts in to an offer that requires it."
    grain: "One row per offer opted into."
    distinguish_by: [source_offer_id]
    fields:
      earnings_account_id: "Account opting in."
      issued_at: "Moment of the opt-in."
      source_offer_id: "Offer opted into."
      incentive_type: "Type of the offer."
      market: "Market of the offer."
    triggers: []

measures:
  - id: earnings_msr_time_distance_pay
    window: "One completed trip."
    measure: "From driver_rate_card for the trip's ride option: the larger of the minimum and (base + per_mile x actual_miles + per_minute x actual_minutes) x surge_multiplier x surge_driver_share_pct / 100."
  - id: earnings_msr_trip_addons
    window: "One completed trip."
    measure: "driver_trip_extra for the ride option + driver_wait_rate x wait_minutes_billed of the trip's wait time charge + toll_reimbursement_pct of the trip's toll charges + long_pickup_rate_per_minute x (original_eta_minutes - long_pickup_threshold_minutes) when original_eta_minutes exceeds the threshold + reservation_fee_driver_share_pct of the trip's reservation fee when one was charged and not refunded."
  - id: earnings_msr_cashouts_today
    window: "The current calendar day in the driver's market time."
    measure: "Count and total amount of earnings_instant_cashout rows of the account dated today, with the count of those whose cashout_channel is external_debit_card."
  - id: earnings_msr_offer_qualifying_trips
    window: "From the offer's window_start (inclusive) to window_end (exclusive)."
    measure: "Count of trips with the driver as driver_customer_id, status completed, market equal to the offer's market and dropoff_at inside the window; for a referral offer the trips of the referred_customer_id instead."
  - id: earnings_msr_guarantee_window_earnings
    window: "From the offer's window_start (inclusive) to window_end (exclusive)."
    measure: "Sum of earnings_trip_credit and earnings_cancellation_credit amounts for trips whose dropoff_at or cancelled_at falls inside the window."
  - id: earnings_msr_trip_support_credited
    window: "Life of one trip."
    measure: "Sum of earnings_adjustment_credit amounts on that trip_id."

policies:
  - id: earnings_agg_multi_holding
    subject: [earnings_account_open]
    rule: >-
      A driver has exactly one earnings account, opened when the driver signs a driver services agreement and linked to it; a driver whose earnings account is closed gets a new one only with a new agreement.
      An earnings account is opened only when the driver has no earnings account in pending_setup, active or payout_hold status.
      Every new account starts at Wayfare Pro Blue for the rest of the quarter in which it opens.
    eligibility:
      - id: one_open_account
        applies_to: [earnings_account_open]
        kind: dedup
        condition: "An earnings account is opened only when the driver has no earnings account in pending_setup, active or payout_hold status."
        evidence_fields: [earnings_accounts.customer_id, earnings_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.customer_id]]
          action_bindings: {earnings_accounts.customer_id: customer_id}
        dedup_contract:
          table: earnings_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_setup, active, payout_hold]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 1

  - id: earnings_evt_trip_pay
    subject: [earnings_trip_credit, earnings_points_credit]
    rule: >-
      Trip pay posts only to an account in pending_setup, active or payout_hold status, once per completed trip, at drop-off.
      Trip pay is the time-and-distance pay of the ride option the trip was requested under (earnings_msr_time_distance_pay, using the trip's actual miles and minutes and the busy-time multiplier recorded at the request, never below the option's minimum trip pay) plus the add-ons (earnings_msr_trip_addons): the option's trip extra, wait pay for the billable wait minutes the rider was charged, the tolls the rider was charged, long pickup pay and the driver's share of a reservation fee.
      Driver pay does not depend on the rider's fare, Pass discount or Pass credits, and airport access fees are never driver pay.
      Each completed trip also earns Pro points for the quarter of its drop-off: points_per_peak_trip when the request fell in a peak period, otherwise points_per_premium_trip for a premium option, otherwise points_per_standard_trip; peak and premium points are never added together.
    eligibility:
      - id: open_account
        applies_to: [earnings_trip_credit]
        kind: state
        condition: "Trip pay posts only to an account in pending_setup, active or payout_hold status, once per completed trip, at drop-off."
        evidence_fields: [earnings_accounts.status, earnings_accounts.earnings_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.earnings_account_id]]
          action_bindings: {earnings_accounts.earnings_account_id: earnings_account_id}
        state_contract:
          field: earnings_accounts.status
          allowed: [pending_setup, active, payout_hold]
    params:
      driver_rate_card: "=driver_rate_card"
      driver_trip_extra: "=driver_trip_extra"
      surge_driver_share_pct: "=surge_driver_share_pct"
      driver_wait_rate: "=driver_wait_rate"
      toll_reimbursement_pct: "=toll_reimbursement_pct"
      airport_fee_driver_share_pct: "=airport_fee_driver_share_pct"
      long_pickup_threshold_minutes: "=long_pickup_threshold_minutes"
      long_pickup_rate_per_minute: "=long_pickup_rate_per_minute"
      reservation_fee_driver_share_pct: "=reservation_fee_driver_share_pct"
      points_per_standard_trip: "=points_per_standard_trip"
      points_per_peak_trip: "=points_per_peak_trip"
      points_per_premium_trip: "=points_per_premium_trip"
      peak_periods: "=peak_periods"
      premium_options: "=premium_options"
      points_precedence: "=points_precedence"
      rounding_rule: "=rounding_rule"
    formula:
      amount: "round(earnings_msr_time_distance_pay + earnings_msr_trip_addons, 2)"
    measures: [earnings_msr_time_distance_pay, earnings_msr_trip_addons]

  - id: earnings_evt_fee_shares
    subject: [earnings_cancellation_credit, earnings_tip_credit, earnings_cleaning_credit]
    rule: >-
      Fee shares post only to an account in pending_setup, active or payout_hold status.
      When a rider is charged a cancellation fee the driver who accepted the trip receives cancellation_fee_driver_share_pct of it, and of a no-show fee no_show_fee_driver_share_pct; nothing is paid when the fee was waived or when the driver cancelled.
      A tip is paid at tip_driver_share_pct.
      When a cleaning or damage fee is charged to a rider, the reporting driver receives cleaning_fee_driver_share_pct of a cleaning fee or damage_fee_driver_share_pct of a damage fee, on the assessment's own reference.
      When the rider's fee is later reversed or reduced for a reason that undoes it, the driver's share of the amount returned is taken back as an adjustment debit (cancellation_fee_reversal or cleaning_fee_reversal); a fee returned to the rider as a courtesy, or a cleaning fee reversed as a first-incident courtesy, stays with the driver.
    eligibility:
      - id: open_account
        applies_to: [earnings_cancellation_credit, earnings_tip_credit, earnings_cleaning_credit]
        kind: state
        condition: "Fee shares post only to an account in pending_setup, active or payout_hold status."
        evidence_fields: [earnings_accounts.status, earnings_accounts.earnings_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.earnings_account_id]]
          action_bindings: {earnings_accounts.earnings_account_id: earnings_account_id}
        state_contract:
          field: earnings_accounts.status
          allowed: [pending_setup, active, payout_hold]
    params:
      cancellation_fee_driver_share_pct: "=cancellation_fee_driver_share_pct"
      no_show_fee_driver_share_pct: "=no_show_fee_driver_share_pct"
      tip_driver_share_pct: "=tip_driver_share_pct"
      cleaning_fee_driver_share_pct: "=cleaning_fee_driver_share_pct"
      damage_fee_driver_share_pct: "=damage_fee_driver_share_pct"

  - id: earnings_evt_adjustments
    subject: [earnings_adjustment_credit, earnings_adjustment_debit]
    rule: >-
      A driver may ask for missing pay on a trip only within the adjustment window: The adjustment window is counted in calendar days from the trip's drop-off or cancellation date: day 1 is the calendar day after it, and the request must be made no later than the last day of the window.
      Missing pay is credited only when the records show it was owed and not paid: missing_toll_reimbursement when the rider was charged a toll the trip pay left out, missing_wait_time when the rider was charged wait time the trip pay left out, missing_cancellation_credit when the rider was charged a cancellation or no-show fee with no driver share posted, and fare_correction when trip pay was computed at the wrong ride option or distance; the credit equals what the rules owed less what was paid.
      A driver's report of time or distance that the trip record does not show is not credited.
      Support may credit up to adjustment_agent_limit in total per trip (earnings_msr_trip_support_credited); a request above it is passed to the earnings review team through a POLICY_NOT_COVERED handoff.
      Debits are posted when a rider charge the driver was paid from is reduced or reversed: a route_inefficiency_clawback equal to the rider's fare reduction, a fare_correction equal to the reimbursed toll or wait pay that was reversed, a cancellation_fee_reversal or cleaning_fee_reversal equal to the driver share of what was returned; a debit never exceeds the credit it reverses and may take the balance below zero.
    eligibility:
      - id: within_adjustment_window
        applies_to: [earnings_adjustment_credit]
        kind: time
        condition: "A driver may ask for missing pay on a trip only within the adjustment window: The adjustment window is counted in calendar days from the trip's drop-off or cancellation date: day 1 is the calendar day after it, and the request must be made no later than the last day of the window."
        evidence_fields: [trips.dropoff_at, trips.cancelled_at, trips.trip_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[trips.trip_id]]
          action_bindings: {trips.trip_id: trip_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "trip's drop-off or cancellation date"
          anchor_source: trips.dropoff_at
          relation: not_after
          duration_source: variants.adjustment_request_window_days
          unit: calendar_days
          counting_rule: "The adjustment window is counted in calendar days from the trip's drop-off or cancellation date: day 1 is the calendar day after it, and the request must be made no later than the last day of the window."
          boundary: inclusive
      - id: within_support_limit
        applies_to: [earnings_adjustment_credit]
        kind: authorization
        condition: "Support may credit up to adjustment_agent_limit in total per trip (earnings_msr_trip_support_credited); a request above it is passed to the earnings review team through a POLICY_NOT_COVERED handoff."
        evidence_fields: [earnings_ledger.trip_id, earnings_ledger.amount, earnings_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_ledger.trip_id]]
          action_bindings: {earnings_ledger.trip_id: trip_id}
    params:
      adjustment_request_window_days: "=adjustment_request_window_days"
      adjustment_agent_limit: "=adjustment_agent_limit"
    measures: [earnings_msr_trip_support_credited]

  - id: earnings_evt_instant_cashout
    subject: [earnings_instant_cashout, earnings_instant_cashout_fee]
    rule: >-
      Instant cashout is available only on an active account; an account on payout hold cannot cash out.
      Instant cashout opens after a waiting period: The waiting period is counted in calendar days from the account's opened_date: day 1 is the calendar day after it, and cashout is available from the day after the last day of the period.
      A cashout must be at least instant_cashout_min_amount and no more than the available balance; at most instant_cashout_daily_count_limit cashouts and instant_cashout_daily_max_amount in total per calendar day in the driver's market time (earnings_msr_cashouts_today).
      Each cashout books one fee row: cashouts to the Wayfare debit card cost instant_cashout_fee_wayfare_card; cashouts to an external debit card are free for the first free_external_cashouts_per_day of the day under the driver's Pro status for the quarter, and cost instant_cashout_fee_external after that.
      The fee is never waived outside these rules and is not refunded when the driver changes their mind.
      Cashing out is the driver's own decision and is done by the driver.
    eligibility:
      - id: active_account
        applies_to: [earnings_instant_cashout]
        kind: state
        condition: "Instant cashout is available only on an active account; an account on payout hold cannot cash out."
        evidence_fields: [earnings_accounts.status, earnings_accounts.earnings_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.earnings_account_id]]
          action_bindings: {earnings_accounts.earnings_account_id: earnings_account_id}
        state_contract:
          field: earnings_accounts.status
          allowed: [active]
      - id: new_account_wait
        applies_to: [earnings_instant_cashout]
        kind: time
        condition: "Instant cashout opens after a waiting period: The waiting period is counted in calendar days from the account's opened_date: day 1 is the calendar day after it, and cashout is available from the day after the last day of the period."
        evidence_fields: [earnings_accounts.opened_date, earnings_accounts.earnings_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.earnings_account_id]]
          action_bindings: {earnings_accounts.earnings_account_id: earnings_account_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "account's opened_date"
          anchor_source: earnings_accounts.opened_date
          relation: not_before
          duration_source: variants.instant_cashout_new_account_wait_days
          unit: calendar_days
          counting_rule: "The waiting period is counted in calendar days from the account's opened_date: day 1 is the calendar day after it, and cashout is available from the day after the last day of the period."
          boundary: exclusive
    params:
      instant_cashout_fee_wayfare_card: "=instant_cashout_fee_wayfare_card"
      instant_cashout_daily_count_limit: "=instant_cashout_daily_count_limit"
      instant_cashout_min_amount: "=instant_cashout_min_amount"
      instant_cashout_daily_max_amount: "=instant_cashout_daily_max_amount"
      instant_cashout_new_account_wait_days: "=instant_cashout_new_account_wait_days"
      cashout_day_basis: "=cashout_day_basis"
      per_tier:
        "Wayfare Pro Blue": {instant_cashout_fee_external: "=instant_cashout_fee_external", free_external_cashouts_per_day: "=free_external_cashouts_per_day"}
        "Wayfare Pro Silver": {instant_cashout_fee_external: "=instant_cashout_fee_external", free_external_cashouts_per_day: "=free_external_cashouts_per_day"}
        "Wayfare Pro Gold": {instant_cashout_fee_external: "=instant_cashout_fee_external", free_external_cashouts_per_day: "=free_external_cashouts_per_day"}
        "Wayfare Pro Platinum": {instant_cashout_fee_external: "=instant_cashout_fee_external", free_external_cashouts_per_day: "=free_external_cashouts_per_day"}
        "Wayfare Pro Diamond": {instant_cashout_fee_external: "=instant_cashout_fee_external", free_external_cashouts_per_day: "=free_external_cashouts_per_day"}
        "Wayfare Pro Diamond Elite": {instant_cashout_fee_external: "=instant_cashout_fee_external", free_external_cashouts_per_day: "=free_external_cashouts_per_day"}
    measures: [earnings_msr_cashouts_today]

  - id: earnings_evt_weekly_payout
    subject: [earnings_weekly_payout]
    rule: >-
      Payouts are sent only from an account that is active, or closed with a balance to settle.
      Each earnings_week, the balance available at the week's end is paid out on weekly_payout_weekday to the payout method on file when it is at least weekly_payout_min_amount; a lower or negative balance carries forward and is recovered from later earnings before any payout.
      When a payout hold is lifted, the balance held is paid out at once as a hold_release payout instead of waiting for the next week; when the account closes with a positive balance, it is paid out as a final_on_close payout.
      Payouts are never sent while the account is on hold, and support does not send off-cycle payouts for any other reason.
    eligibility:
      - id: payable_account
        applies_to: [earnings_weekly_payout]
        kind: state
        condition: "Payouts are sent only from an account that is active, or closed with a balance to settle."
        evidence_fields: [earnings_accounts.status, earnings_accounts.earnings_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.earnings_account_id]]
          action_bindings: {earnings_accounts.earnings_account_id: earnings_account_id}
        state_contract:
          field: earnings_accounts.status
          allowed: [active, closed]
    params:
      earnings_week: "=earnings_week"
      weekly_payout_weekday: "=weekly_payout_weekday"
      weekly_payout_min_amount: "=weekly_payout_min_amount"

  - id: earnings_payout_holds
    subject: [earnings_payout_hold, earnings_payout_release, earnings_account_activate, earnings_account_close, earnings_payout_method_change]
    rule: >-
      An account becomes active once its payout destination is verified; until then earnings accrue but nothing is paid out.
      Payouts are held for one of four recorded reasons: bank_verification_failed when the payout destination is rejected, negative_balance when the available balance is at or below negative_balance_hold_threshold, fraud_review when trips on the account are under fraud review, and deactivation_fraud when the driver services agreement is deactivated for fraud.
      A hold is lifted only when its reason is resolved: a verified new payout destination for bank_verification_failed, the balance recovering above negative_balance_hold_threshold for negative_balance, a cleared review for fraud_review; a fraud review hold cannot last more than fraud_review_max_days and is then lifted unless the agreement has been deactivated for fraud, and a deactivation_fraud hold is lifted only if the deactivation is reversed on appeal.
      Earnings keep posting while payouts are held.
      Switching the payout method between bank deposit and the Wayfare debit card is the driver's own decision and takes effect from the next payout.
      The account closes when the driver services agreement closes, after the last payout it is owed.
    eligibility:
      - id: hold_reason_on_record
        applies_to: [earnings_payout_release]
        kind: authorization
        condition: "A hold is lifted only when its reason is resolved: a verified new payout destination for bank_verification_failed, the balance recovering above negative_balance_hold_threshold for negative_balance, a cleared review for fraud_review; a fraud review hold cannot last more than fraud_review_max_days and is then lifted unless the agreement has been deactivated for fraud, and a deactivation_fraud hold is lifted only if the deactivation is reversed on appeal."
        evidence_fields: [earnings_accounts.payout_hold_reason, earnings_accounts.available_balance, earnings_accounts.earnings_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.earnings_account_id]]
          action_bindings: {earnings_accounts.earnings_account_id: earnings_account_id}
    params:
      negative_balance_hold_threshold: "=negative_balance_hold_threshold"
      fraud_review_max_days: "=fraud_review_max_days"

  - id: earnings_pro_tier_evaluation
    subject: [earnings_tier_evaluation, earnings_points_reset]
    rule: >-
      On the first day of each calendar quarter the driver's Wayfare Pro status for the new quarter is set from the quarter just ended: the highest status whose entry gate is met by that quarter's points, the driver's current rating, cancellation rate and acceptance rate.
      Status protection: a driver drops at most max_tier_drop_per_evaluation level at one evaluation, even when the quarter's results meet only a lower gate.
      The quarter's points are then reset to zero; points never carry over and status is never changed mid-quarter, whatever the driver's results so far.
      Status benefits (instant cashout fees and free cashouts) follow the status recorded on the account for the current quarter.
    eligibility: []
    params:
      tier_period_months: "=tier_period_months"
      tier_evaluation_basis: "=tier_evaluation_basis"
      max_tier_drop_per_evaluation: "=max_tier_drop_per_evaluation"
      points_reset_rule: "=points_reset_rule"

  - id: earnings_evt_bonus
    subject: [earnings_bonus_credit, earnings_bonus_offer_issue, earnings_bonus_optin]
    rule: >-
      Offers are personal: each offer record carries its own market, window, target and reward, and only trips that satisfy quest_trip_basis count toward it (earnings_msr_offer_qualifying_trips).
      A quest pays reward_amount once when the qualifying trips reach target_trip_count; a consecutive_trips offer pays when target_trip_count qualifying trips are completed in a row, each next trip accepted within consecutive_trips_max_gap_minutes of the previous drop-off; a referral pays when the referred driver completes target_trip_count trips within referral_completion_days of their activation (the offer window).
      An earnings guarantee pays the guaranteed_amount less the window earnings (earnings_msr_guarantee_window_earnings, counting only guarantee_earnings_basis), when positive, provided the driver was online at least required_online_minutes, kept an acceptance rate of at least guarantee_min_acceptance_rate_pct and a cancellation rate of at most guarantee_max_cancellation_rate_pct over the window.
      An offer whose incentive type is in optin_required_types pays only if the driver opted in before its window_start; the opt-in is the driver's own action.
      Earned bonuses post within bonus_payout_days after window_end, once per offer.
      A driver may raise an unpaid bonus only within the claim window: The claim window is counted in calendar days from the offer's window_end date: day 1 is the calendar day after window_end, and the question must be raised no later than the last day of the window.
      Near misses are never paid, and offers are never extended or combined.
    eligibility:
      - id: within_claim_window
        applies_to: [earnings_bonus_credit]
        kind: time
        condition: "A driver may raise an unpaid bonus only within the claim window: The claim window is counted in calendar days from the offer's window_end date: day 1 is the calendar day after window_end, and the question must be raised no later than the last day of the window."
        evidence_fields: [bonus_offers.window_end, bonus_offers.bonus_offer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[bonus_offers.bonus_offer_id]]
          action_bindings: {bonus_offers.bonus_offer_id: bonus_offer_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "offer's window_end date"
          anchor_source: bonus_offers.window_end
          relation: not_after
          duration_source: variants.bonus_claim_window_days
          unit: calendar_days
          counting_rule: "The claim window is counted in calendar days from the offer's window_end date: day 1 is the calendar day after window_end, and the question must be raised no later than the last day of the window."
          boundary: inclusive
      - id: one_payment_per_offer
        applies_to: [earnings_bonus_credit]
        kind: dedup
        condition: "Earned bonuses post within bonus_payout_days after window_end, once per offer."
        evidence_fields: [earnings_ledger.bonus_offer_id, earnings_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_ledger.bonus_offer_id]]
          action_bindings: {earnings_ledger.bonus_offer_id: bonus_offer_id}
        dedup_contract:
          table: earnings_ledger
          mode: separate_record
          object_bindings: {bonus_offer_id: bonus_offer_id}
          duplicate_filters: {event_type: [earnings_bonus_credit]}
          distinct_fields: [entry_date]
      - id: optin_before_window
        applies_to: [earnings_bonus_credit]
        kind: authorization
        condition: "An offer whose incentive type is in optin_required_types pays only if the driver opted in before its window_start; the opt-in is the driver's own action."
        evidence_fields: [bonus_offers.source_offer_id, bonus_offers.issued_at, bonus_offers.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[bonus_offers.source_offer_id]]
          action_bindings: {bonus_offers.source_offer_id: bonus_offer_id}
    params:
      quest_trip_basis: "=quest_trip_basis"
      consecutive_trips_max_gap_minutes: "=consecutive_trips_max_gap_minutes"
      referral_completion_days: "=referral_completion_days"
      guarantee_min_acceptance_rate_pct: "=guarantee_min_acceptance_rate_pct"
      guarantee_max_cancellation_rate_pct: "=guarantee_max_cancellation_rate_pct"
      guarantee_earnings_basis: "=guarantee_earnings_basis"
      optin_required_types: "=optin_required_types"
      bonus_payout_days: "=bonus_payout_days"
      bonus_claim_window_days: "=bonus_claim_window_days"
    formula:
      when: "incentive_type == 'earnings_guarantee'"
      amount: "max(0, round(guaranteed_amount - earnings_msr_guarantee_window_earnings, 2))"
    measures: [earnings_msr_offer_qualifying_trips, earnings_msr_guarantee_window_earnings]

  - id: earnings_evt_bonus_clawback
    subject: [earnings_bonus_clawback]
    rule: >-
      A paid bonus is clawed back only when trips it counted are later disqualified as fraudulent (an earnings_adjustment_debit with reason fraudulent_trip on the trip) and the disqualification is booked within bonus_clawback_lookback_days of the bonus credit.
      The clawback is the whole bonus when the remaining qualifying trips no longer reach the target, and nothing otherwise; a guarantee top-up is recomputed without the disqualified trips' earnings and the difference is clawed back.
      A bonus is clawed back at most once.
    eligibility: []
    params:
      bonus_clawback_lookback_days: "=bonus_clawback_lookback_days"

  - id: earnings_evt_rental_deduction
    subject: [earnings_rental_deduction]
    rule: >-
      Wayfare Rentals charges are paid from the driver's earnings each week before the scheduled payout, oldest charge first.
      A deduction never takes the available balance below 0.00 (rental_deduction_basis): when the balance does not cover a charge, only the balance is deducted and the remainder stays on the rental to be paid by card.
      A deduction is made only while the account is active; nothing is deducted during a payout hold.
    eligibility:
      - id: active_account
        applies_to: [earnings_rental_deduction]
        kind: state
        condition: "A deduction is made only while the account is active; nothing is deducted during a payout hold."
        evidence_fields: [earnings_accounts.status, earnings_accounts.earnings_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[earnings_accounts.earnings_account_id]]
          action_bindings: {earnings_accounts.earnings_account_id: earnings_account_id}
        state_contract:
          field: earnings_accounts.status
          allowed: [active]
    params:
      rental_deduction_basis: "=rental_deduction_basis"

extended_policies:
- id: earnings_ext_hold_release_payout
  base_policy_refs:
  - earnings_payout_holds
  - earnings_evt_weekly_payout
  overwrite:
  - base_policy: earnings_evt_weekly_payout
    superseded_clause: When a payout hold is lifted, the balance held is paid out at once as a hold_release payout instead of waiting for the next week
    replaced_by: When a payout hold is lifted, the available balance is paid out at once as a hold-release payout instead of waiting for the next week, less the incentive reserve, the new-account holdback, the cashout holdback and the ended-rental holdback set out below.
  trigger: state_due
  subject:
  - earnings_payout_release
  computes: payout_amount
  target_tool: lift_payout_hold_7e61ef01
  params:
    reserve_lookback_months: 3
    bonus_count_latest: 3
    reserve_count_high: 2
    reserve_rate_high: 1.0
    reserve_rate_low: 0.5
    safety_lookback_months: 6
    trust_rating_top: 4.9
    trust_rating_mid: 4.8
    trust_scale_top: 0.5
    trust_scale_mid: 0.75
    tenure_new_months: 6
    tenure_mid_months: 12
    holdback_new: 60.0
    holdback_mid: 30.0
    cashout_lookback_months: 1
    cashout_count_high: 3
    cashout_share_high: 0.2
    cashout_share_low: 0.1
  rule: 'A payout hold is lifted only when its recorded reason is resolved, and the agent who lifts it sends the hold-release payout at the same moment, to the payout method on file. When a payout hold is lifted, the available balance is paid out at once as a hold-release payout instead of waiting for the next week, less the incentive reserve, the new-account holdback, the cashout holdback and the ended-rental holdback set out below. The standard hold-release payout is the whole available balance at the moment the hold is lifted, with nothing kept back. The hold-release payout is rounded half up to the cent once, at the end, and is never below zero. The hold-release payout is worked out in this order: first the incentive reserve, the new-account holdback, the cashout holdback and the ended-rental holdback are each worked out from the records as they stand when the hold is lifted; then the four are added together and taken off the available balance once; any amount kept back stays in the available balance and is paid with the next scheduled weekly payout. The incentive reserve is the reserve base multiplied by the reserve rate and then by the trust scale. The reserve base follows how many bonus entries were posted to the account within the reserve lookback, which is reserve_lookback_months whole months back from the day the hold is lifted: with bonus_count_latest or more such bonus entries, the reserve base is the amount of the most recently posted bonus entry alone; with at least one but fewer than bonus_count_latest, the reserve base is the total of the bonus entries posted within the reserve lookback less the bonus clawbacks posted within the same lookback; with none, the reserve base is nothing. The reserve rate follows how many trip disqualifications for fraud (debits with reason fraudulent_trip) and bonus clawbacks were posted within the reserve lookback, counted together: reserve_count_high or more set the reserve rate at reserve_rate_high; at least one but fewer than reserve_count_high set it at reserve_rate_low; none sets it at zero. The trust scale follows the current rating on the driver''s driver services agreement and whether a safety report about the driver was recorded on the standing record within the last safety_lookback_months whole months: a rating at or above trust_rating_top with no such safety report scales the reserve by trust_scale_top; a rating at or above trust_rating_mid but below trust_rating_top with no such safety report scales it by trust_scale_mid; any other rating, or any such safety report, leaves the reserve unscaled. The new-account holdback follows how many whole months the earnings account has been open on the day the hold is lifted, counted from its opened date: fewer than tenure_new_months holds back holdback_new; at least tenure_new_months but fewer than tenure_mid_months holds back holdback_mid; tenure_mid_months or more holds back nothing. The cashout holdback is the total of the instant cashouts made from the account within the last cashout_lookback_months whole month, before their fees, multiplied by a share that follows how many instant cashouts were made in that period: cashout_count_high or more set the share at cashout_share_high; at least one but fewer than cashout_count_high set it at cashout_share_low; none sets it at zero. The ended-rental holdback follows the status of the driver''s Wayfare Rentals rental: a rental that has been returned and is not yet closed holds back its balance due less the security deposit still held, never below zero; a rental whose return is due holds back its whole balance due; an active rental, a closed rental or no rental holds back nothing.'
  prerequisite: []
  cross_category:
  - category: driver
    as: history
    reads:
    - current_rating
    - driver_standing_events.event_type
    - driver_standing_events.event_date
    note: The trust scale is decided from the rating on the driver services agreement and the safety reports on the standing record.
  - category: rental
    as: branch
    reads:
    - status
    - balance_due
    - deposit_held
    note: The ended-rental holdback is decided from the status, balance due and deposit held of the Wayfare Rentals rental.
  compute:
  - bal: F('available_balance')
  - bonus_count: COUNT('earnings_ledger', within_months=K('reserve_lookback_months'), date_field='entry_date', event_type='earnings_bonus_credit')
  - bonus_net: SUM('earnings_ledger','amount', within_months=K('reserve_lookback_months'), date_field='entry_date', event_type='earnings_bonus_credit') + SUM('earnings_ledger','amount', within_months=K('reserve_lookback_months'), date_field='entry_date', event_type='earnings_bonus_clawback')
  - bonus_latest: LATEST('earnings_ledger','amount', date_field='posted_at', event_type='earnings_bonus_credit')
  - reserve_base: bonus_latest if bonus_count >= K('bonus_count_latest') else (bonus_net if bonus_count >= 1 else 0)
  - disq_count: COUNT('earnings_ledger', within_months=K('reserve_lookback_months'), date_field='entry_date', event_type='earnings_adjustment_debit', adjustment_reason='fraudulent_trip') + COUNT('earnings_ledger', within_months=K('reserve_lookback_months'), date_field='entry_date', event_type='earnings_bonus_clawback')
  - reserve_rate: K('reserve_rate_high') if disq_count >= K('reserve_count_high') else (K('reserve_rate_low') if disq_count >= 1 else 0)
  - rating: float(CFIELD('driver','current_rating'))
  - safety_reports: XCOUNT('driver','driver_standing_events', within_months=K('safety_lookback_months'), date_field='event_date', event_type='driver_safety_report')
  - trust_scale: K('trust_scale_top') if (rating >= K('trust_rating_top') and safety_reports == 0) else (K('trust_scale_mid') if (rating >= K('trust_rating_mid') and rating < K('trust_rating_top') and safety_reports == 0) else 1.0)
  - incentive_reserve: reserve_base * reserve_rate * trust_scale
  - months_open: MONTHS(F('opened_date'), NOW)
  - tenure_holdback: K('holdback_new') if months_open < K('tenure_new_months') else (K('holdback_mid') if months_open < K('tenure_mid_months') else 0)
  - cashout_total: -SUM('earnings_ledger','amount', within_months=K('cashout_lookback_months'), date_field='entry_date', event_type='earnings_instant_cashout')
  - cashout_count: COUNT('earnings_ledger', within_months=K('cashout_lookback_months'), date_field='entry_date', event_type='earnings_instant_cashout')
  - cashout_share: K('cashout_share_high') if cashout_count >= K('cashout_count_high') else (K('cashout_share_low') if cashout_count >= 1 else 0)
  - cashout_holdback: cashout_total * cashout_share
  - rental_status: CFIELD('rental','status')
  - rental_due: float(CFIELD('rental','balance_due') or 0)
  - rental_deposit: float(CFIELD('rental','deposit_held') or 0)
  - rental_holdback: MX(0, rental_due - rental_deposit) if rental_status == 'returned' else (rental_due if rental_status == 'return_due' else 0)
  - result: MX(0, RND(bal - (incentive_reserve + tenure_holdback + cashout_holdback + rental_holdback), 2))
  compute_basis:
    bal: The standard hold-release payout is the whole available balance at the moment the hold is lifted, with nothing kept back.
    bonus_count: 'The reserve base follows how many bonus entries were posted to the account within the reserve lookback, which is reserve_lookback_months whole months back from the day the hold is lifted: with bonus_count_latest or more such bonus entries, the reserve base is the amount of the most recently posted bonus entry alone; with at least one but fewer than bonus_count_latest, the reserve base is the total of the bonus entries posted within the reserve lookback less the bonus clawbacks posted within the same lookback; with none, the reserve base is nothing.'
    bonus_net: 'The reserve base follows how many bonus entries were posted to the account within the reserve lookback, which is reserve_lookback_months whole months back from the day the hold is lifted: with bonus_count_latest or more such bonus entries, the reserve base is the amount of the most recently posted bonus entry alone; with at least one but fewer than bonus_count_latest, the reserve base is the total of the bonus entries posted within the reserve lookback less the bonus clawbacks posted within the same lookback; with none, the reserve base is nothing.'
    bonus_latest: 'The reserve base follows how many bonus entries were posted to the account within the reserve lookback, which is reserve_lookback_months whole months back from the day the hold is lifted: with bonus_count_latest or more such bonus entries, the reserve base is the amount of the most recently posted bonus entry alone; with at least one but fewer than bonus_count_latest, the reserve base is the total of the bonus entries posted within the reserve lookback less the bonus clawbacks posted within the same lookback; with none, the reserve base is nothing.'
    reserve_base: 'The reserve base follows how many bonus entries were posted to the account within the reserve lookback, which is reserve_lookback_months whole months back from the day the hold is lifted: with bonus_count_latest or more such bonus entries, the reserve base is the amount of the most recently posted bonus entry alone; with at least one but fewer than bonus_count_latest, the reserve base is the total of the bonus entries posted within the reserve lookback less the bonus clawbacks posted within the same lookback; with none, the reserve base is nothing.'
    disq_count: 'The reserve rate follows how many trip disqualifications for fraud (debits with reason fraudulent_trip) and bonus clawbacks were posted within the reserve lookback, counted together: reserve_count_high or more set the reserve rate at reserve_rate_high; at least one but fewer than reserve_count_high set it at reserve_rate_low; none sets it at zero.'
    reserve_rate: 'The reserve rate follows how many trip disqualifications for fraud (debits with reason fraudulent_trip) and bonus clawbacks were posted within the reserve lookback, counted together: reserve_count_high or more set the reserve rate at reserve_rate_high; at least one but fewer than reserve_count_high set it at reserve_rate_low; none sets it at zero.'
    rating: 'The trust scale follows the current rating on the driver''s driver services agreement and whether a safety report about the driver was recorded on the standing record within the last safety_lookback_months whole months: a rating at or above trust_rating_top with no such safety report scales the reserve by trust_scale_top; a rating at or above trust_rating_mid but below trust_rating_top with no such safety report scales it by trust_scale_mid; any other rating, or any such safety report, leaves the reserve unscaled.'
    safety_reports: 'The trust scale follows the current rating on the driver''s driver services agreement and whether a safety report about the driver was recorded on the standing record within the last safety_lookback_months whole months: a rating at or above trust_rating_top with no such safety report scales the reserve by trust_scale_top; a rating at or above trust_rating_mid but below trust_rating_top with no such safety report scales it by trust_scale_mid; any other rating, or any such safety report, leaves the reserve unscaled.'
    trust_scale: 'The trust scale follows the current rating on the driver''s driver services agreement and whether a safety report about the driver was recorded on the standing record within the last safety_lookback_months whole months: a rating at or above trust_rating_top with no such safety report scales the reserve by trust_scale_top; a rating at or above trust_rating_mid but below trust_rating_top with no such safety report scales it by trust_scale_mid; any other rating, or any such safety report, leaves the reserve unscaled.'
    incentive_reserve: The incentive reserve is the reserve base multiplied by the reserve rate and then by the trust scale.
    months_open: 'The new-account holdback follows how many whole months the earnings account has been open on the day the hold is lifted, counted from its opened date: fewer than tenure_new_months holds back holdback_new; at least tenure_new_months but fewer than tenure_mid_months holds back holdback_mid; tenure_mid_months or more holds back nothing.'
    tenure_holdback: 'The new-account holdback follows how many whole months the earnings account has been open on the day the hold is lifted, counted from its opened date: fewer than tenure_new_months holds back holdback_new; at least tenure_new_months but fewer than tenure_mid_months holds back holdback_mid; tenure_mid_months or more holds back nothing.'
    cashout_total: 'The cashout holdback is the total of the instant cashouts made from the account within the last cashout_lookback_months whole month, before their fees, multiplied by a share that follows how many instant cashouts were made in that period: cashout_count_high or more set the share at cashout_share_high; at least one but fewer than cashout_count_high set it at cashout_share_low; none sets it at zero.'
    cashout_count: 'The cashout holdback is the total of the instant cashouts made from the account within the last cashout_lookback_months whole month, before their fees, multiplied by a share that follows how many instant cashouts were made in that period: cashout_count_high or more set the share at cashout_share_high; at least one but fewer than cashout_count_high set it at cashout_share_low; none sets it at zero.'
    cashout_share: 'The cashout holdback is the total of the instant cashouts made from the account within the last cashout_lookback_months whole month, before their fees, multiplied by a share that follows how many instant cashouts were made in that period: cashout_count_high or more set the share at cashout_share_high; at least one but fewer than cashout_count_high set it at cashout_share_low; none sets it at zero.'
    cashout_holdback: 'The cashout holdback is the total of the instant cashouts made from the account within the last cashout_lookback_months whole month, before their fees, multiplied by a share that follows how many instant cashouts were made in that period: cashout_count_high or more set the share at cashout_share_high; at least one but fewer than cashout_count_high set it at cashout_share_low; none sets it at zero.'
    rental_status: 'The ended-rental holdback follows the status of the driver''s Wayfare Rentals rental: a rental that has been returned and is not yet closed holds back its balance due less the security deposit still held, never below zero; a rental whose return is due holds back its whole balance due; an active rental, a closed rental or no rental holds back nothing.'
    rental_due: 'The ended-rental holdback follows the status of the driver''s Wayfare Rentals rental: a rental that has been returned and is not yet closed holds back its balance due less the security deposit still held, never below zero; a rental whose return is due holds back its whole balance due; an active rental, a closed rental or no rental holds back nothing.'
    rental_deposit: 'The ended-rental holdback follows the status of the driver''s Wayfare Rentals rental: a rental that has been returned and is not yet closed holds back its balance due less the security deposit still held, never below zero; a rental whose return is due holds back its whole balance due; an active rental, a closed rental or no rental holds back nothing.'
    rental_holdback: 'The ended-rental holdback follows the status of the driver''s Wayfare Rentals rental: a rental that has been returned and is not yet closed holds back its balance due less the security deposit still held, never below zero; a rental whose return is due holds back its whole balance due; an active rental, a closed rental or no rental holds back nothing.'
    result: 'The hold-release payout is worked out in this order: first the incentive reserve, the new-account holdback, the cashout holdback and the ended-rental holdback are each worked out from the records as they stand when the hold is lifted; then the four are added together and taken off the available balance once; any amount kept back stays in the available balance and is paid with the next scheduled weekly payout. The hold-release payout is rounded half up to the cent once, at the end, and is never below zero.'
  factors:
  - id: reserve_base_selection
    effect: method
    decides: reserve_base
    bindings:
    - bonus_count
    - bonus_net
    - bonus_latest
    - reserve_base
    ladder:
    - when: bonus_count_latest or more bonus entries posted within the reserve lookback
      method: the reserve base is the amount of the most recently posted bonus entry alone
    - when: at least one but fewer than bonus_count_latest bonus entries posted within the reserve lookback
      method: the reserve base is the total of the bonus entries posted within the reserve lookback less the bonus clawbacks posted within it
    - when: otherwise (no bonus entry posted within the reserve lookback)
      method: the reserve base is nothing
    baseline:
      reserve_base: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: reserve_rate
    effect: parameter
    decides: reserve_rate
    bindings:
    - disq_count
    - reserve_rate
    ladder:
    - when: reserve_count_high or more fraud disqualifications and bonus clawbacks within the reserve lookback
      value: K('reserve_rate_high')
    - when: at least one but fewer than reserve_count_high of them
      value: K('reserve_rate_low')
    - when: otherwise (none)
      value: '0'
    baseline:
      reserve_rate: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: trust_scale
    effect: parameter
    decides: trust_scale
    bindings:
    - rating
    - safety_reports
    - trust_scale
    ladder:
    - when: agreement rating at or above trust_rating_top and no safety report within safety_lookback_months
      value: K('trust_scale_top')
    - when: agreement rating at or above trust_rating_mid but below trust_rating_top and no safety report within safety_lookback_months
      value: K('trust_scale_mid')
    - when: otherwise (a lower rating, or any safety report within safety_lookback_months)
      value: '1.0'
    baseline:
      trust_scale: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: driver
  - id: new_account_holdback
    effect: parameter
    decides: tenure_holdback
    bindings:
    - months_open
    - tenure_holdback
    ladder:
    - when: earnings account open fewer than tenure_new_months whole months
      value: K('holdback_new')
    - when: open at least tenure_new_months but fewer than tenure_mid_months whole months
      value: K('holdback_mid')
    - when: otherwise (open tenure_mid_months whole months or more)
      value: '0'
    baseline:
      tenure_holdback: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: cashout_holdback_share
    effect: parameter
    decides: cashout_share
    bindings:
    - cashout_total
    - cashout_count
    - cashout_share
    - cashout_holdback
    ladder:
    - when: cashout_count_high or more instant cashouts within the last cashout_lookback_months whole month
      value: K('cashout_share_high')
    - when: at least one but fewer than cashout_count_high instant cashouts in that period
      value: K('cashout_share_low')
    - when: otherwise (no instant cashout in that period)
      value: '0'
    baseline:
      cashout_share: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: ended_rental_holdback
    effect: method
    decides: rental_holdback
    bindings:
    - rental_status
    - rental_due
    - rental_deposit
    - rental_holdback
    ladder:
    - when: the Wayfare Rentals rental has been returned and is not yet closed
      method: hold back the balance due less the security deposit still held, never below zero
    - when: the rental is in return-due status
      method: hold back the whole balance due
    - when: otherwise (an active or closed rental, or no rental)
      method: hold back nothing
    baseline:
      rental_holdback: '0'
    evidence:
    - cross_category
    cross_difficulty: rental
  baseline:
    rule: The standard hold-release payout is the whole available balance at the moment the hold is lifted, with nothing kept back. The hold-release payout is rounded half up to the cent once, at the end, and is never below zero.
    params: []
  inputs:
    history:
    - table: earnings_ledger
      aggregate: count
      field: earnings_entry_id
      within_months: 3
      filters:
        event_type: earnings_bonus_credit
    - table: earnings_ledger
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: earnings_bonus_credit
    - table: earnings_ledger
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: earnings_bonus_clawback
    - table: earnings_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: earnings_bonus_credit
    - table: earnings_ledger
      aggregate: count
      field: earnings_entry_id
      within_months: 3
      filters:
        event_type: earnings_adjustment_debit
        adjustment_reason: fraudulent_trip
    - table: earnings_ledger
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: earnings_instant_cashout
    - category: driver
      table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 6
      filters:
        event_type: driver_safety_report
