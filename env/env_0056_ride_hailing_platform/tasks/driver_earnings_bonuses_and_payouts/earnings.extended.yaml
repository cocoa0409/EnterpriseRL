    - pro_boost
    ladder:
    - when: Wayfare Pro Platinum, Diamond or Diamond Elite, at least boost_points_top Pro points this quarter, and payouts not on hold
      value: K('boost_top')
    - when: Wayfare Pro Silver or Gold, at least boost_points_mid Pro points this quarter, and payouts not on hold
      value: K('boost_mid')
    - when: otherwise (any other status, fewer points, or payouts on hold)
      value: '0'
    baseline:
      pro_boost: '0'
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: activity_scale
    effect: parameter
    decides: activity_scale
    bindings:
    - paid_trips
    - activity_scale
    ladder:
    - when: fewer than activity_trips_low paid trips in the last activity_lookback_months whole month
      value: K('activity_scale_low')
    - when: at least activity_trips_low but fewer than activity_trips_high paid trips in that period
      value: K('activity_scale_mid')
    - when: otherwise (activity_trips_high paid trips or more)
      value: '1.0'
    baseline:
      activity_scale: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: early_career_supplement
    effect: parameter
    decides: career_supplement
