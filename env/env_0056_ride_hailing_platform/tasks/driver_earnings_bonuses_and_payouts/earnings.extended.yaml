    - career_trips
    - career_supplement
    ladder:
    - when: fewer than career_trips_new lifetime trips on the driver services agreement
      value: K('career_supplement_new')
    - when: at least career_trips_new but fewer than career_trips_mid lifetime trips
      value: K('career_supplement_mid')
    - when: otherwise (career_trips_mid lifetime trips or more)
      value: '0'
    baseline:
