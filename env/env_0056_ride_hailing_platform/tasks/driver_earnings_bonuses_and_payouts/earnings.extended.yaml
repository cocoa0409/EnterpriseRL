- id: earnings_ext_quest_reward_settlement
  base_policy_refs:
  - earnings_evt_bonus
  - earnings_pro_tier_evaluation
  overwrite:
  - base_policy: earnings_evt_bonus
    superseded_clause: A quest pays reward_amount once when the qualifying trips reach target_trip_count
    replaced_by: An earned quest is credited the quest reward set out below, once per offer.
  - base_policy: earnings_pro_tier_evaluation
    superseded_clause: Status benefits (instant cashout fees and free cashouts) follow the status recorded on the account for the current quarter.
    replaced_by: The Pro boost rate follows the Wayfare Pro status recorded on the earnings account for the current quarter
  trigger: state_due
  subject:
  - earnings_bonus_credit
  computes: amount
  target_tool: credit_quest_reward_07fce82e
  params:
    boost_rating_top: 4.9
    boost_rating_mid: 4.85
    boost_top: 0.1
    boost_mid: 0.05
    standing_lookback_months: 6
    standing_warnings_two: 2
    standing_scale_one: 0.5
    peak_trips_high: 20
    peak_trips_mid: 5
    peak_supplement_high: 12.0
    peak_supplement_mid: 6.0
    late_per_day_days: 7
    late_per_day_credit: 2.0
    late_flat_credit: 5.0
  rule: 'Support settles an unpaid quest reward for the account''s most recently ended quest, which is the quest offer with the latest window end on the account, once the records show that its trip target was reached with trips counted under quest_trip_basis and that its payout date, bonus_payout_days after the window end, has passed with no bonus entry for that offer on the statement. An earned quest is credited the quest reward set out below, once per offer. The standard quest reward is the reward amount stated on the quest offer, unchanged. The quest reward is rounded half up to the cent once, at the end. The quest reward is worked out in this order: the Pro boost rate is first multiplied by the standing scale; the stated reward amount is then multiplied by one plus that product; the peak-driver supplement and the late-settlement credit are added to the result; the sum is rounded once. The Pro boost rate follows the Wayfare Pro status recorded on the earnings account for the current quarter and the current rating on the driver''s driver services agreement: Wayfare Pro Platinum, Diamond or Diamond Elite with a rating at or above boost_rating_top earns boost_top; Wayfare Pro Silver or Gold with a rating at or above boost_rating_mid earns boost_mid; any other status, or a lower rating, earns no boost. The standing scale follows the quality warnings recorded on the driver''s standing record within the last standing_lookback_months whole months: standing_warnings_two or more warnings set it at zero, so no boost is paid; at least one but fewer than standing_warnings_two warnings set it at standing_scale_one; no warning sets it at one, so the boost is paid in full. The peak-driver supplement follows how many trips earned peak-trip Pro points for the account in the current quarter: peak_trips_high or more add peak_supplement_high; at least peak_trips_mid but fewer than peak_trips_high add peak_supplement_mid; fewer than peak_trips_mid add nothing. The late-settlement credit follows how many calendar days the settlement comes after the quest''s payout date, counted from the payout date, which is bonus_payout_days after the window end date, to the settlement date: late_per_day_days or more days earn late_per_day_credit for each of those days; at least one but fewer than late_per_day_days days earn the flat late_flat_credit; a settlement on or before the payout date earns nothing.'
  prerequisite: []
  cross_category:
  - category: driver
    as: history
    reads:
    - current_rating
    - driver_standing_events.event_type
    - driver_standing_events.event_date
    note: The Pro boost rate reads the agreement rating and the standing scale counts the quality warnings on the standing record.
  compute:
  - reward: float(LATEST('bonus_offers','reward_amount', date_field='window_end', event_type='earnings_bonus_offer_issue', incentive_type='quest'))
  - quest_end: LATEST('bonus_offers','window_end', date_field='window_end', event_type='earnings_bonus_offer_issue', incentive_type='quest')
  - agreement_rating: float(CFIELD('driver','current_rating'))
  - boost_rate: K('boost_top') if ((F('variant_name') == 'Wayfare Pro Platinum' or F('variant_name') == 'Wayfare Pro Diamond' or F('variant_name') == 'Wayfare Pro Diamond Elite') and agreement_rating >= K('boost_rating_top')) else (K('boost_mid') if ((F('variant_name') == 'Wayfare Pro Silver' or F('variant_name') == 'Wayfare Pro Gold') and agreement_rating >= K('boost_rating_mid')) else 0)
  - standing_warnings: XCOUNT('driver','driver_standing_events', within_months=K('standing_lookback_months'), date_field='event_date', event_type='driver_quality_warning')
  - standing_scale: 0 if standing_warnings >= K('standing_warnings_two') else (K('standing_scale_one') if standing_warnings >= 1 else 1.0)
  - peak_trips: COUNT('earnings_ledger', event_type='earnings_points_credit', points_basis='peak_trip', points_period_start=F('tier_period_start'))
  - peak_supplement: K('peak_supplement_high') if peak_trips >= K('peak_trips_high') else (K('peak_supplement_mid') if peak_trips >= K('peak_trips_mid') else 0)
  - days_late: DAYS(quest_end, NOW) - P('bonus_payout_days')
  - late_credit: K('late_per_day_credit') * days_late if days_late >= K('late_per_day_days') else (K('late_flat_credit') if days_late >= 1 else 0)
  - result: RND(reward * (1 + boost_rate * standing_scale) + peak_supplement + late_credit, 2)
  compute_basis:
    reward: The standard quest reward is the reward amount stated on the quest offer, unchanged.
    quest_end: 'The late-settlement credit follows how many calendar days the settlement comes after the quest''s payout date, counted from the payout date, which is bonus_payout_days after the window end date, to the settlement date: late_per_day_days or more days earn late_per_day_credit for each of those days; at least one but fewer than late_per_day_days days earn the flat late_flat_credit; a settlement on or before the payout date earns nothing.'
    agreement_rating: 'The Pro boost rate follows the Wayfare Pro status recorded on the earnings account for the current quarter and the current rating on the driver''s driver services agreement: Wayfare Pro Platinum, Diamond or Diamond Elite with a rating at or above boost_rating_top earns boost_top; Wayfare Pro Silver or Gold with a rating at or above boost_rating_mid earns boost_mid; any other status, or a lower rating, earns no boost.'
    boost_rate: 'The Pro boost rate follows the Wayfare Pro status recorded on the earnings account for the current quarter and the current rating on the driver''s driver services agreement: Wayfare Pro Platinum, Diamond or Diamond Elite with a rating at or above boost_rating_top earns boost_top; Wayfare Pro Silver or Gold with a rating at or above boost_rating_mid earns boost_mid; any other status, or a lower rating, earns no boost.'
    standing_warnings: 'The standing scale follows the quality warnings recorded on the driver''s standing record within the last standing_lookback_months whole months: standing_warnings_two or more warnings set it at zero, so no boost is paid; at least one but fewer than standing_warnings_two warnings set it at standing_scale_one; no warning sets it at one, so the boost is paid in full.'
    standing_scale: 'The standing scale follows the quality warnings recorded on the driver''s standing record within the last standing_lookback_months whole months: standing_warnings_two or more warnings set it at zero, so no boost is paid; at least one but fewer than standing_warnings_two warnings set it at standing_scale_one; no warning sets it at one, so the boost is paid in full.'
    peak_trips: 'The peak-driver supplement follows how many trips earned peak-trip Pro points for the account in the current quarter: peak_trips_high or more add peak_supplement_high; at least peak_trips_mid but fewer than peak_trips_high add peak_supplement_mid; fewer than peak_trips_mid add nothing.'
    peak_supplement: 'The peak-driver supplement follows how many trips earned peak-trip Pro points for the account in the current quarter: peak_trips_high or more add peak_supplement_high; at least peak_trips_mid but fewer than peak_trips_high add peak_supplement_mid; fewer than peak_trips_mid add nothing.'
    days_late: 'The late-settlement credit follows how many calendar days the settlement comes after the quest''s payout date, counted from the payout date, which is bonus_payout_days after the window end date, to the settlement date: late_per_day_days or more days earn late_per_day_credit for each of those days; at least one but fewer than late_per_day_days days earn the flat late_flat_credit; a settlement on or before the payout date earns nothing.'
    late_credit: 'The late-settlement credit follows how many calendar days the settlement comes after the quest''s payout date, counted from the payout date, which is bonus_payout_days after the window end date, to the settlement date: late_per_day_days or more days earn late_per_day_credit for each of those days; at least one but fewer than late_per_day_days days earn the flat late_flat_credit; a settlement on or before the payout date earns nothing.'
    result: 'The quest reward is worked out in this order: the Pro boost rate is first multiplied by the standing scale; the stated reward amount is then multiplied by one plus that product; the peak-driver supplement and the late-settlement credit are added to the result; the sum is rounded once. The quest reward is rounded half up to the cent once, at the end.'
  factors:
  - id: pro_boost_rate
    effect: parameter
    decides: boost_rate
    bindings:
    - agreement_rating
    - boost_rate
    ladder:
    - when: Wayfare Pro Platinum, Diamond or Diamond Elite with an agreement rating at or above boost_rating_top
      value: K('boost_top')
    - when: Wayfare Pro Silver or Gold with an agreement rating at or above boost_rating_mid
      value: K('boost_mid')
    - when: otherwise (any other status, or a lower rating)
      value: '0'
    baseline:
      boost_rate: '0'
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: driver
  - id: standing_scale
    effect: parameter
    decides: standing_scale
    bindings:
    - standing_warnings
    - standing_scale
    ladder:
    - when: standing_warnings_two or more quality warnings within the last standing_lookback_months whole months
      value: '0'
    - when: at least one but fewer than standing_warnings_two quality warnings in that period
      value: K('standing_scale_one')
    - when: otherwise (no quality warning in that period)
      value: '1.0'
    baseline:
      standing_scale: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: driver
  - id: peak_driver_supplement
    effect: parameter
    decides: peak_supplement
    bindings:
    - peak_trips
    - peak_supplement
    ladder:
    - when: peak_trips_high or more peak-point trips in the current quarter
      value: K('peak_supplement_high')
    - when: at least peak_trips_mid but fewer than peak_trips_high peak-point trips
      value: K('peak_supplement_mid')
    - when: otherwise (fewer than peak_trips_mid peak-point trips)
      value: '0'
    baseline:
      peak_supplement: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: late_settlement_credit
    effect: method
    decides: late_credit
    bindings:
    - quest_end
    - days_late
    - late_credit
    ladder:
    - when: late_per_day_days or more calendar days after the payout date
      method: late_per_day_credit for each day after the payout date
    - when: at least one but fewer than late_per_day_days calendar days after the payout date
      method: a flat late_flat_credit
    - when: otherwise (settled on or before the payout date)
      method: nothing
    baseline:
      late_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The standard quest reward is the reward amount stated on the quest offer, unchanged. The quest reward is rounded half up to the cent once, at the end.
    params: []
  inputs:
    history:
    - table: bonus_offers
      aggregate: latest
      field: reward_amount
      filters:
        event_type: earnings_bonus_offer_issue
        incentive_type: quest
    - table: earnings_ledger
      aggregate: count
      field: earnings_entry_id
      filters:
        event_type: earnings_points_credit
        points_basis: peak_trip
    - category: driver
      table: driver_standing_events
      aggregate: count
      field: driver_standing_event_id
      within_months: 6
      filters:
        event_type: driver_quality_warning
    cross_category:
    - driver
- id: earnings_ext_max_instant_cashout
  base_policy_refs:
  - earnings_evt_instant_cashout
  - earnings_pro_tier_evaluation
  overwrite:
  - base_policy: earnings_evt_instant_cashout
    superseded_clause: A cashout must be at least instant_cashout_min_amount and no more than the available balance; at most instant_cashout_daily_count_limit cashouts and instant_cashout_daily_max_amount in total per calendar day in the driver's market time (earnings_msr_cashouts_today).
    replaced_by: A cashout must be at least instant_cashout_min_amount and no more than the available balance; at most instant_cashout_daily_count_limit cashouts are made per calendar day in the driver's market time, and the cashouts of one calendar day together never exceed the daily cashout limit set out below.
  - base_policy: earnings_evt_instant_cashout
    superseded_clause: 'Each cashout books one fee row: cashouts to the Wayfare debit card cost instant_cashout_fee_wayfare_card; cashouts to an external debit card are free for the first free_external_cashouts_per_day of the day under the driver''s Pro status for the quarter, and cost instant_cashout_fee_external after that.'
    replaced_by: 'Each cashout books one fee row: cashouts to the Wayfare debit card cost instant_cashout_fee_wayfare_card, and a cashout to an external debit card costs the cashout fee set out below.'
  - base_policy: earnings_pro_tier_evaluation
    superseded_clause: Status benefits (instant cashout fees and free cashouts) follow the status recorded on the account for the current quarter.
    replaced_by: The daily cashout limit follows the Wayfare Pro status recorded on the earnings account for the current quarter
  trigger: on_request
  subject:
  - earnings_instant_cashout
  computes: amount
  target_tool: cash_out_to_debit_card_82ffed45
  params:
    cap_trips_top: 3000
    cap_trips_mid: 1000
    cap_top: 1000.0
    cap_mid: 750.0
    card_holder_fee: 0.4
    settle_new_months: 3
    settle_mid_months: 6
    risk_lookback_months: 3
    risk_share: 0.8
  rule: 'An instant cashout to an external debit card is the driver''s own act; when the driver asks to cash out as much as possible, the cashout amount is the largest instant cashout set out below, and the driver makes the cashout with that amount and its cashout fee. A cashout must be at least instant_cashout_min_amount and no more than the available balance; at most instant_cashout_daily_count_limit cashouts are made per calendar day in the driver''s market time, and the cashouts of one calendar day together never exceed the daily cashout limit set out below. Each cashout books one fee row: cashouts to the Wayfare debit card cost instant_cashout_fee_wayfare_card, and a cashout to an external debit card costs the cashout fee set out below. The standard largest instant cashout is the available balance less the cashout fee, capped at the daily cashout limit less the instant cashouts already made today. The standard daily cashout limit is instant_cashout_daily_max_amount, and the standard cashout fee is instant_cashout_fee_external under the driver''s Pro status for the quarter. The largest instant cashout is rounded half up to the cent once, at the end, and is never below zero. The largest instant cashout is worked out only after the earnings statement carries a bonus entry for the most recently ended quest whose trip target was reached and whose payout date has passed. The largest instant cashout is worked out in this order: first the settling credits are taken off the available balance; the risk method is then applied to that settled balance; the rental set-aside and the cashout fee are then taken off the result; finally that amount is compared with the daily cashout limit less the instant cashouts already made today, and the smaller of the two is the largest instant cashout. The daily cashout limit follows the Wayfare Pro status recorded on the earnings account for the current quarter and the lifetime trips on the driver''s driver services agreement: Wayfare Pro Platinum, Diamond or Diamond Elite with at least cap_trips_top lifetime trips has a daily cashout limit of cap_top; Wayfare Pro Silver or Gold with at least cap_trips_mid lifetime trips has cap_mid; any other status, or fewer lifetime trips, keeps instant_cashout_daily_max_amount. The cashout fee follows the instant cashouts to an external debit card already made today and the account''s payout method: while fewer external debit card cashouts have been made today than free_external_cashouts_per_day under the driver''s Pro status, the cashout is free; once those free cashouts are used, an account whose scheduled payouts go to the Wayfare debit card pays card_holder_fee; once those free cashouts are used, any other account pays instant_cashout_fee_external under the driver''s Pro status. The settling credits follow how many whole months the earnings account has been open, counted from its opened date: an account open fewer than settle_new_months has every credit posted today held as settling; an account open at least settle_new_months but fewer than settle_mid_months has only the tips posted today held as settling; an account open settle_mid_months or more has nothing held as settling. The risk method follows the debits posted to the account within the last risk_lookback_months whole months: when a trip was disqualified for fraud in that period, the settled balance is multiplied by risk_share; when no trip was disqualified for fraud but a route-inefficiency clawback was posted in that period, the most recent route-inefficiency clawback is taken off the settled balance; when neither was posted, the settled balance is used as it stands. The rental set-aside follows the driver''s Wayfare Rentals rental: an active rental with a balance due sets aside that balance due for the weekly rental deduction; an active rental with nothing due sets aside the class''s weekly_rate for the next weekly charge; a rental that is not active, or no rental, sets aside nothing.'
  prerequisite:
  - problem: earnings_ext_quest_reward_settlement
    kind: value_input
    gate: bal
    form: state
    policy_source: The largest instant cashout is worked out only after the earnings statement carries a bonus entry for the most recently ended quest whose trip target was reached and whose payout date has passed.
    condition: earnings_ledger holds an earnings_bonus_credit entry whose bonus_offer_id is the quest offer with the latest window_end on the account, whenever that quest's target was reached and its payout date (window_end plus bonus_payout_days) has passed.
    resolved_by: credit_quest_reward_07fce82e
    effect: Posting the quest reward raises earnings_accounts.available_balance by the reward, so the bal binding, and with it the largest instant cashout, rises by the same amount while the daily cashout limit does not bind.
  cross_category:
  - category: driver
    as: branch
    reads:
    - lifetime_trips
    note: The daily cashout limit reads the lifetime trips on the driver services agreement.
  - category: rental
    as: branch
    reads:
    - status
    - balance_due
    - weekly_rate
    note: The rental set-aside reads the status and balance due of the Wayfare Rentals rental and its class weekly rate.
  compute:
  - bal: F('available_balance')
  - cashed_today: -SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_instant_cashout')
  - career_trips: int(CFIELD('driver','lifetime_trips'))
  - daily_cap: K('cap_top') if ((F('variant_name') == 'Wayfare Pro Platinum' or F('variant_name') == 'Wayfare Pro Diamond' or F('variant_name') == 'Wayfare Pro Diamond Elite') and career_trips >= K('cap_trips_top')) else (K('cap_mid') if ((F('variant_name') == 'Wayfare Pro Silver' or F('variant_name') == 'Wayfare Pro Gold') and career_trips >= K('cap_trips_mid')) else P('instant_cashout_daily_max_amount'))
  - ext_today: COUNT('earnings_ledger', entry_date=NOW, event_type='earnings_instant_cashout', cashout_channel='external_debit_card')
  - fee: 0 if ext_today < P('free_external_cashouts_per_day') else (K('card_holder_fee') if F('payout_method') == 'wayfare_debit_card' else P('instant_cashout_fee_external'))
  - months_open: MONTHS(F('opened_date'), NOW)
  - credits_today: SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_trip_credit') + SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_tip_credit') + SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_cancellation_credit') + SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_cleaning_credit') + SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_bonus_credit') + SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_adjustment_credit')
  - tips_today: SUM('earnings_ledger','amount', entry_date=NOW, event_type='earnings_tip_credit')
  - settling: credits_today if months_open < K('settle_new_months') else (tips_today if months_open < K('settle_mid_months') else 0)
  - settled_balance: bal - settling
  - fraud_count: COUNT('earnings_ledger', within_months=K('risk_lookback_months'), date_field='entry_date', event_type='earnings_adjustment_debit', adjustment_reason='fraudulent_trip')
  - route_count: COUNT('earnings_ledger', within_months=K('risk_lookback_months'), date_field='entry_date', event_type='earnings_adjustment_debit', adjustment_reason='route_inefficiency_clawback')
  - route_latest: -float(LATEST('earnings_ledger','amount', date_field='posted_at', event_type='earnings_adjustment_debit', adjustment_reason='route_inefficiency_clawback') or 0)
  - risk_adjusted: settled_balance * K('risk_share') if fraud_count >= 1 else (settled_balance - route_latest if route_count >= 1 else settled_balance)
  - rental_status: CFIELD('rental','status')
  - rental_due: float(CFIELD('rental','balance_due') or 0)
  - rental_setaside: rental_due if (rental_status == 'active' and rental_due > 0) else (float(CPARAM('rental','weekly_rate')) if rental_status == 'active' else 0)
  - result: MX(0, MN(daily_cap - cashed_today, RND(risk_adjusted - rental_setaside - fee, 2)))
  compute_basis:
    bal: The standard largest instant cashout is the available balance less the cashout fee, capped at the daily cashout limit less the instant cashouts already made today.
    cashed_today: The standard largest instant cashout is the available balance less the cashout fee, capped at the daily cashout limit less the instant cashouts already made today.
    career_trips: 'The daily cashout limit follows the Wayfare Pro status recorded on the earnings account for the current quarter and the lifetime trips on the driver''s driver services agreement: Wayfare Pro Platinum, Diamond or Diamond Elite with at least cap_trips_top lifetime trips has a daily cashout limit of cap_top; Wayfare Pro Silver or Gold with at least cap_trips_mid lifetime trips has cap_mid; any other status, or fewer lifetime trips, keeps instant_cashout_daily_max_amount.'
    daily_cap: 'The daily cashout limit follows the Wayfare Pro status recorded on the earnings account for the current quarter and the lifetime trips on the driver''s driver services agreement: Wayfare Pro Platinum, Diamond or Diamond Elite with at least cap_trips_top lifetime trips has a daily cashout limit of cap_top; Wayfare Pro Silver or Gold with at least cap_trips_mid lifetime trips has cap_mid; any other status, or fewer lifetime trips, keeps instant_cashout_daily_max_amount.'
    ext_today: 'The cashout fee follows the instant cashouts to an external debit card already made today and the account''s payout method: while fewer external debit card cashouts have been made today than free_external_cashouts_per_day under the driver''s Pro status, the cashout is free; once those free cashouts are used, an account whose scheduled payouts go to the Wayfare debit card pays card_holder_fee; once those free cashouts are used, any other account pays instant_cashout_fee_external under the driver''s Pro status.'
    fee: 'The cashout fee follows the instant cashouts to an external debit card already made today and the account''s payout method: while fewer external debit card cashouts have been made today than free_external_cashouts_per_day under the driver''s Pro status, the cashout is free; once those free cashouts are used, an account whose scheduled payouts go to the Wayfare debit card pays card_holder_fee; once those free cashouts are used, any other account pays instant_cashout_fee_external under the driver''s Pro status.'
    months_open: 'The settling credits follow how many whole months the earnings account has been open, counted from its opened date: an account open fewer than settle_new_months has every credit posted today held as settling; an account open at least settle_new_months but fewer than settle_mid_months has only the tips posted today held as settling; an account open settle_mid_months or more has nothing held as settling.'
    credits_today: 'The settling credits follow how many whole months the earnings account has been open, counted from its opened date: an account open fewer than settle_new_months has every credit posted today held as settling; an account open at least settle_new_months but fewer than settle_mid_months has only the tips posted today held as settling; an account open settle_mid_months or more has nothing held as settling.'
    tips_today: 'The settling credits follow how many whole months the earnings account has been open, counted from its opened date: an account open fewer than settle_new_months has every credit posted today held as settling; an account open at least settle_new_months but fewer than settle_mid_months has only the tips posted today held as settling; an account open settle_mid_months or more has nothing held as settling.'
    settling: 'The settling credits follow how many whole months the earnings account has been open, counted from its opened date: an account open fewer than settle_new_months has every credit posted today held as settling; an account open at least settle_new_months but fewer than settle_mid_months has only the tips posted today held as settling; an account open settle_mid_months or more has nothing held as settling.'
    settled_balance: 'The largest instant cashout is worked out in this order: first the settling credits are taken off the available balance; the risk method is then applied to that settled balance; the rental set-aside and the cashout fee are then taken off the result; finally that amount is compared with the daily cashout limit less the instant cashouts already made today, and the smaller of the two is the largest instant cashout.'
    fraud_count: 'The risk method follows the debits posted to the account within the last risk_lookback_months whole months: when a trip was disqualified for fraud in that period, the settled balance is multiplied by risk_share; when no trip was disqualified for fraud but a route-inefficiency clawback was posted in that period, the most recent route-inefficiency clawback is taken off the settled balance; when neither was posted, the settled balance is used as it stands.'
    route_count: 'The risk method follows the debits posted to the account within the last risk_lookback_months whole months: when a trip was disqualified for fraud in that period, the settled balance is multiplied by risk_share; when no trip was disqualified for fraud but a route-inefficiency clawback was posted in that period, the most recent route-inefficiency clawback is taken off the settled balance; when neither was posted, the settled balance is used as it stands.'
    route_latest: 'The risk method follows the debits posted to the account within the last risk_lookback_months whole months: when a trip was disqualified for fraud in that period, the settled balance is multiplied by risk_share; when no trip was disqualified for fraud but a route-inefficiency clawback was posted in that period, the most recent route-inefficiency clawback is taken off the settled balance; when neither was posted, the settled balance is used as it stands.'
    risk_adjusted: 'The risk method follows the debits posted to the account within the last risk_lookback_months whole months: when a trip was disqualified for fraud in that period, the settled balance is multiplied by risk_share; when no trip was disqualified for fraud but a route-inefficiency clawback was posted in that period, the most recent route-inefficiency clawback is taken off the settled balance; when neither was posted, the settled balance is used as it stands.'
    rental_status: 'The rental set-aside follows the driver''s Wayfare Rentals rental: an active rental with a balance due sets aside that balance due for the weekly rental deduction; an active rental with nothing due sets aside the class''s weekly_rate for the next weekly charge; a rental that is not active, or no rental, sets aside nothing.'
    rental_due: 'The rental set-aside follows the driver''s Wayfare Rentals rental: an active rental with a balance due sets aside that balance due for the weekly rental deduction; an active rental with nothing due sets aside the class''s weekly_rate for the next weekly charge; a rental that is not active, or no rental, sets aside nothing.'
    rental_setaside: 'The rental set-aside follows the driver''s Wayfare Rentals rental: an active rental with a balance due sets aside that balance due for the weekly rental deduction; an active rental with nothing due sets aside the class''s weekly_rate for the next weekly charge; a rental that is not active, or no rental, sets aside nothing.'
    result: 'The largest instant cashout is worked out in this order: first the settling credits are taken off the available balance; the risk method is then applied to that settled balance; the rental set-aside and the cashout fee are then taken off the result; finally that amount is compared with the daily cashout limit less the instant cashouts already made today, and the smaller of the two is the largest instant cashout. The largest instant cashout is rounded half up to the cent once, at the end, and is never below zero.'
  factors:
  - id: daily_cashout_limit
    effect: parameter
    decides: daily_cap
    bindings:
    - career_trips
    - daily_cap
    ladder:
    - when: Wayfare Pro Platinum, Diamond or Diamond Elite with at least cap_trips_top lifetime trips on the agreement
      value: K('cap_top')
    - when: Wayfare Pro Silver or Gold with at least cap_trips_mid lifetime trips on the agreement
      value: K('cap_mid')
    - when: otherwise (any other status, or fewer lifetime trips)
      value: P('instant_cashout_daily_max_amount')
    baseline:
      daily_cap: P('instant_cashout_daily_max_amount')
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: driver
  - id: cashout_fee
    effect: parameter
    decides: fee
    bindings:
    - ext_today
    - fee
    ladder:
    - when: fewer external debit card cashouts made today than free_external_cashouts_per_day under the Pro status
      value: '0'
    - when: the free cashouts of the day are used and scheduled payouts go to the Wayfare debit card
      value: K('card_holder_fee')
    - when: otherwise (the free cashouts of the day are used and scheduled payouts go to a bank account)
      value: P('instant_cashout_fee_external')
    baseline:
      fee: P('instant_cashout_fee_external')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: settling_credits
    effect: method
    decides: settling
    bindings:
    - months_open
    - credits_today
    - tips_today
    - settling
    ladder:
    - when: earnings account open fewer than settle_new_months whole months
      method: every credit posted today is held as settling
    - when: open at least settle_new_months but fewer than settle_mid_months whole months
      method: only the tips posted today are held as settling
    - when: otherwise (open settle_mid_months whole months or more)
      method: nothing is held as settling
    baseline:
      settling: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: risk_method
    effect: method
    decides: risk_adjusted
    bindings:
    - fraud_count
    - route_count
    - route_latest
    - risk_adjusted
    ladder:
    - when: a trip disqualified for fraud within the last risk_lookback_months whole months
      method: the settled balance is multiplied by risk_share
    - when: no fraud disqualification but a route-inefficiency clawback within the last risk_lookback_months whole months
      method: the most recent route-inefficiency clawback is taken off the settled balance
    - when: otherwise (neither in that period)
      method: the settled balance is used as it stands
    baseline:
      risk_adjusted: settled_balance
    evidence:
    - history
    cross_difficulty: null
  - id: rental_setaside
    effect: parameter
    decides: rental_setaside
    bindings:
    - rental_status
    - rental_due
    - rental_setaside
    ladder:
    - when: an active Wayfare Rentals rental with a balance due
      value: CFIELD('rental','balance_due')
    - when: an active Wayfare Rentals rental with nothing due
      value: CPARAM('rental','weekly_rate')
    - when: otherwise (a rental that is not active, or no rental)
      value: '0'
    baseline:
      rental_setaside: '0'
    evidence:
    - cross_category
    cross_difficulty: rental
  baseline:
    rule: The standard largest instant cashout is the available balance less the cashout fee, capped at the daily cashout limit less the instant cashouts already made today. The standard daily cashout limit is instant_cashout_daily_max_amount, and the standard cashout fee is instant_cashout_fee_external under the driver's Pro status for the quarter. The largest instant cashout is rounded half up to the cent once, at the end, and is never below zero.
    params:
    - instant_cashout_daily_max_amount
    - instant_cashout_fee_external
  inputs:
    history:
    - table: earnings_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: earnings_instant_cashout
    - table: earnings_ledger
      aggregate: count
      field: earnings_entry_id
      filters:
        event_type: earnings_instant_cashout
        cashout_channel: external_debit_card
    - table: earnings_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: earnings_tip_credit
    - table: earnings_ledger
      aggregate: count
      field: earnings_entry_id
      within_months: 3
      filters:
        event_type: earnings_adjustment_debit
        adjustment_reason: route_inefficiency_clawback
    - table: earnings_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: earnings_adjustment_debit
        adjustment_reason: route_inefficiency_clawback
    cross_category:
    - driver
    - rental
