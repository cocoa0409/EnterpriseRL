      um_trips: "The loyalty upgrade discount is 10 percent for a member who has held the membership for at least 24 whole months and has at least 20 trips charged a fare in the last three months; it is 5 percent for a member who does not meet that tier but has held the membership for at least 12 whole months and has at least 6 such trips; it is nothing for anyone else."
      um_loyal: "The loyalty upgrade discount is 10 percent for a member who has held the membership for at least 24 whole months and has at least 20 trips charged a fare in the last three months; it is 5 percent for a member who does not meet that tier but has held the membership for at least 12 whole months and has at least 6 such trips; it is nothing for anyone else."
      um_comfort_trips: "The Comfort-rider upgrade discount counts the member's completed Wayfare Comfort and Wayfare Black trips dropped off in the last three months: 5 percent at 3 or more, 2 percent at 1 or 2, nothing at none."
      um_comfort: "The Comfort-rider upgrade discount counts the member's completed Wayfare Comfort and Wayfare Black trips dropped off in the last three months: 5 percent at 3 or more, 2 percent at 1 or 2, nothing at none."
      um_reserve_fees: "The Reserve-rider upgrade credit counts the Wayfare Reserve reservation fees charged to the member in the last three months: 2.00 at 3 or more, 1.00 at 1 or 2, nothing at none."
      um_reserve: "The Reserve-rider upgrade credit counts the Wayfare Reserve reservation fees charged to the member in the last three months: 2.00 at 3 or more, 1.00 at 1 or 2, nothing at none."
      um_airport_trips: "The airport-rider upgrade discount counts the member's completed trips dropped off in the last three months that picked up or dropped off at an airport: 3 percent at 3 or more, 1 percent at 1 or 2, nothing at none."
      um_airport: "The airport-rider upgrade discount counts the member's completed trips dropped off in the last three months that picked up or dropped off at an airport: 3 percent at 3 or more, 1 percent at 1 or 2, nothing at none."
      um_pickup_charges: "The Priority Pickup upgrade credit counts the Priority Pickup charges the member paid in the last three months: 2.00 at 3 or more, 1.00 at 1 or 2, nothing at none."
      um_pickup: "The Priority Pickup upgrade credit counts the Priority Pickup charges the member paid in the last three months: 2.00 at 3 or more, 1.00 at 1 or 2, nothing at none."
      um_discount: "the loyalty upgrade discount, the Comfort-rider upgrade discount and the airport-rider upgrade discount are added into one discount rate and the Plus Monthly membership fee is reduced once by that combined rate"
      result: "The Plus Monthly upgrade charge is worked out in this order: the unused-period credit is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period share and rounded half up to the cent; the loyalty upgrade discount, the Comfort-rider upgrade discount and the airport-rider upgrade discount are added into one discount rate and the Plus Monthly membership fee is reduced once by that combined rate; the Reserve-rider upgrade credit, the Priority Pickup upgrade credit and then the unused-period credit are subtracted from the reduced fee; the charge is never below 0.00 and is rounded half up to the cent once, at the end."
    factors:
      - id: unused_period_share
        effect: method
        decides: um_share
        bindings: [um_last_charge, um_credit_posts, um_share]
        ladder:
          - when: "the latest membership fee charge is within the plan's full refund window on the change date and no Pass ride credit has been posted for the period"
            method: "the whole period counts as unused"
          - when: "an annual plan, not in the first tier"
            method: "whole calendar months of the period, counted from the period start's day of month, beginning after the change date, over twelve"
          - when: "otherwise"
            method: "days from the change date through the period's last day, both counted, over the days in the period"
