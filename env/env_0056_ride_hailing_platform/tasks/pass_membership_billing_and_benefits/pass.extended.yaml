  # ---------------------------------------------------------------- task 0 (root problem)
  - id: pass_ext_plus_monthly_upgrade_charge
    base_policy_refs: [pass_plan_change_rules, pass_student_verification, pass_evt_fee_billing]
    overwrite:
      - base_policy: pass_plan_change_rules
        superseded_clause: >-
          An upgrade (a plan listed in upgrade_targets) takes effect on the day it is made: a new period of the new plan starts that day and the fee collected is the new plan's membership_fee less the unused value of the current period (pass_msr_unused_period_value), booked as charge_reason plan_change_proration.
        replaced_by: >-
          The Plus Monthly upgrade charge is worked out in this order: the unused-period credit is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period share and rounded half up to the cent; the loyalty upgrade discount, the Comfort-rider upgrade discount and the airport-rider upgrade discount are added into one discount rate and the Plus Monthly membership fee is reduced once by that combined rate; the Reserve-rider upgrade credit, the Priority Pickup upgrade credit and then the unused-period credit are subtracted from the reduced fee; the charge is never below 0.00 and is rounded half up to the cent once, at the end.
      - base_policy: pass_evt_fee_billing
        superseded_clause: >-
          The fee for a period is the plan's membership_fee;
        replaced_by: >-
          A move up to the Wayfare Pass Plus Monthly plan takes effect on the day it is made: a new one-month period of Plus Monthly starts that day and the Plus Monthly upgrade charge is collected for it as a plan change charge.
    trigger: on_request
    subject: [pass_plan_change, pass_fee_charge]
    computes: proration_charge
    target_tool: upgrade_pass_to_plus_monthly_9f7c0895
    params:
      plus_monthly_fee: 19.99
      loyal_tenure_high: 24
      loyal_tenure_low: 12
      loyal_trips_high: 20
      loyal_trips_low: 6
      loyal_disc_high: 0.10
      loyal_disc_low: 0.05
      comfort_trips_high: 3
      comfort_trips_low: 1
      comfort_disc_high: 0.05
      comfort_disc_low: 0.02
      reserve_fees_high: 3
      reserve_fees_low: 1
      reserve_credit_high: 2.00
      reserve_credit_low: 1.00
      airport_trips_high: 3
      airport_trips_low: 1
      airport_disc_high: 0.03
      airport_disc_low: 0.01
      pickup_charges_high: 3
      pickup_charges_low: 1
      pickup_credit_high: 2.00
      pickup_credit_low: 1.00
    rule: >-
      A move up to the Wayfare Pass Plus Monthly plan takes effect on the day it is made: a new one-month period of Plus Monthly starts that day and the Plus Monthly upgrade charge is collected for it as a plan change charge.
      The Plus Monthly upgrade charge is worked out only after the billing period in force carries a collected membership fee.
      The Plus Monthly upgrade charge is the Plus Monthly membership fee of 19.99 less the unused-period credit.
      The unused-period credit is the membership fees collected for the billing period in force less any fee refunds booked against them, multiplied by the days from the change date through the last day of the period, both days counted, over the days in the period, both end days counted, and rounded half up to the cent.
      The unused-period share depends on the timing and on the plan: where the latest membership fee charge is no more than the plan's full refund window in calendar days old on the change date and no Pass ride credit has been posted for the period, the share is the whole period; for an annual plan otherwise, the share is the whole calendar months of the period, counted from the period start's day of month, that begin after the change date, over twelve; otherwise the share is the days from the change date through the last day of the period, both days counted, over the days in the period, both end days counted.
      The loyalty upgrade discount is 10 percent for a member who has held the membership for at least 24 whole months and has at least 20 trips charged a fare in the last three months; it is 5 percent for a member who does not meet that tier but has held the membership for at least 12 whole months and has at least 6 such trips; it is nothing for anyone else.
      The Comfort-rider upgrade discount counts the member's completed Wayfare Comfort and Wayfare Black trips dropped off in the last three months: 5 percent at 3 or more, 2 percent at 1 or 2, nothing at none.
      The Reserve-rider upgrade credit counts the Wayfare Reserve reservation fees charged to the member in the last three months: 2.00 at 3 or more, 1.00 at 1 or 2, nothing at none.
      The airport-rider upgrade discount counts the member's completed trips dropped off in the last three months that picked up or dropped off at an airport: 3 percent at 3 or more, 1 percent at 1 or 2, nothing at none.
      The Priority Pickup upgrade credit counts the Priority Pickup charges the member paid in the last three months: 2.00 at 3 or more, 1.00 at 1 or 2, nothing at none.
      The Plus Monthly upgrade charge is worked out in this order: the unused-period credit is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period share and rounded half up to the cent; the loyalty upgrade discount, the Comfort-rider upgrade discount and the airport-rider upgrade discount are added into one discount rate and the Plus Monthly membership fee is reduced once by that combined rate; the Reserve-rider upgrade credit, the Priority Pickup upgrade credit and then the unused-period credit are subtracted from the reduced fee; the charge is never below 0.00 and is rounded half up to the cent once, at the end.
    prerequisite:
      - problem: pass_ext_restoration_payment
        kind: value_input
        gate: um_paid
        form: state
        policy_source: >-
          The Plus Monthly upgrade charge is worked out only after the billing period in force carries a collected membership fee.
        condition: >-
          The membership ledger carries a membership fee charge whose billing period start equals the membership's current period start.
        resolved_by: restore_past_due_pass_5ad4a609
        effect: >-
          The membership fees collected for the period in force rise from nothing to the restoration payment, so the unused-period credit is taken on that collected amount, and because the fee was collected inside the full refund window with no credit posted the unused-period share becomes the whole period.
    cross_category:
      - category: trip
        as: history
        reads: [trip_charges.event_type, trip_charges.charge_date, trips.variant_name, trips.status, trips.airport_leg, trips.dropoff_at]
        note: The loyalty, Comfort-rider, Reserve-rider, airport-rider and Priority Pickup tiers are read from the member's trips and trip charges over the last three months.
    compute:
      - um_paid: "SUM('pass_events', 'amount', event_type='pass_fee_charge', billing_period_start=F('current_period_start')) + SUM('pass_events', 'amount', event_type='pass_fee_refund', billing_period_start=F('current_period_start'))"
      - um_last_charge: "LATEST('pass_events', 'event_date', event_type='pass_fee_charge')"
      - um_credit_posts: "COUNT('pass_events', event_type='pass_credit_earn', billing_period_start=F('current_period_start'))"
      - um_share: "1 if DAYS(um_last_charge, NOW) <= P('refund_full_window_days') and um_credit_posts == 0 else ((P('billing_period_months') - MONTHS(F('current_period_start'), NOW) - 1) / P('billing_period_months') if P('billing_period_months') == 12 else (DAYS(NOW, F('current_period_end')) + 1) / (DAYS(F('current_period_start'), F('current_period_end')) + 1))"
      - um_unused: "RND(MX(0, um_paid) * um_share, 2)"
      - um_tenure: "MONTHS(F('enrolled_date'), NOW)"
      - um_trips: "XCOUNT('trip', 'trip_charges', within_months=3, date_field='charge_date', event_type='trip_fare_charge')"
      - um_loyal: "K('loyal_disc_high') if um_tenure >= K('loyal_tenure_high') and um_trips >= K('loyal_trips_high') else (K('loyal_disc_low') if um_tenure >= K('loyal_tenure_low') and um_trips >= K('loyal_trips_low') else 0)"
      - um_comfort_trips: "XCOUNT('trip', 'trips', within_months=3, date_field='dropoff_at', status='completed', variant_name='Wayfare Comfort') + XCOUNT('trip', 'trips', within_months=3, date_field='dropoff_at', status='completed', variant_name='Wayfare Black')"
      - um_comfort: "K('comfort_disc_high') if um_comfort_trips >= K('comfort_trips_high') else (K('comfort_disc_low') if um_comfort_trips >= K('comfort_trips_low') else 0)"
      - um_reserve_fees: "XCOUNT('trip', 'trip_charges', within_months=3, date_field='charge_date', event_type='trip_reservation_fee')"
      - um_reserve: "K('reserve_credit_high') if um_reserve_fees >= K('reserve_fees_high') else (K('reserve_credit_low') if um_reserve_fees >= K('reserve_fees_low') else 0)"
      - um_airport_trips: "XCOUNT('trip', 'trips', within_months=3, date_field='dropoff_at', status='completed', airport_leg='pickup') + XCOUNT('trip', 'trips', within_months=3, date_field='dropoff_at', status='completed', airport_leg='dropoff')"
      - um_airport: "K('airport_disc_high') if um_airport_trips >= K('airport_trips_high') else (K('airport_disc_low') if um_airport_trips >= K('airport_trips_low') else 0)"
      - um_pickup_charges: "XCOUNT('trip', 'trip_charges', within_months=3, date_field='charge_date', event_type='trip_priority_pickup_charge')"
      - um_pickup: "K('pickup_credit_high') if um_pickup_charges >= K('pickup_charges_high') else (K('pickup_credit_low') if um_pickup_charges >= K('pickup_charges_low') else 0)"
      - um_discount: "um_loyal + um_comfort + um_airport"
      - result: "RND(MX(0, K('plus_monthly_fee') * (1 - um_discount) - um_reserve - um_pickup - um_unused), 2)"
    compute_basis:
      um_paid: "The unused-period credit is the membership fees collected for the billing period in force less any fee refunds booked against them"
      um_last_charge: "where the latest membership fee charge is no more than the plan's full refund window in calendar days old on the change date and no Pass ride credit has been posted for the period, the share is the whole period"
      um_credit_posts: "no Pass ride credit has been posted for the period"
      um_share: "The unused-period share depends on the timing and on the plan: where the latest membership fee charge is no more than the plan's full refund window in calendar days old on the change date and no Pass ride credit has been posted for the period, the share is the whole period; for an annual plan otherwise, the share is the whole calendar months of the period, counted from the period start's day of month, that begin after the change date, over twelve; otherwise the share is the days from the change date through the last day of the period, both days counted, over the days in the period, both end days counted."
      um_unused: "the unused-period credit is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period share and rounded half up to the cent"
