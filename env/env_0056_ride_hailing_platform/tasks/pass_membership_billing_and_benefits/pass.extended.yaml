events:
  # ---------------- holding writes ----------------
  - type: pass_enroll
    target: pass_memberships
    mutation: create
    meaning: "A rider enrolls in a Wayfare Pass plan."
    grain: "One row per membership."
    fields:
      customer_id: "Member."
      variant_name: "Plan enrolled in."
      signup_channel: "rider_app, website or card_partner_offer."
      enrolled_date: "Enrollment date."
      trial_end_date: "Last trial day when a trial is granted; empty otherwise."
      current_period_start: "First day of the first period (the enrollment date)."
      current_period_end: "Last day of the trial or of the first paid period."
      auto_renew: "true at enrollment."
      student_verified_until: "Student verification expiry for the Student plan; empty otherwise."
    triggers:
      - event: "pass:pass_trial_start"
        when: {trial_end_date: {not: ""}}
        map: {}
      - event: "pass:pass_fee_charge"
        when: {trial_end_date: "", signup_channel: {not: card_partner_offer}}
        map: {charge_reason: initial, billing_period_start: enrolled_date}
      - event: "pass:pass_activate"
        when: {signup_channel: card_partner_offer}
        map: {current_period_start: current_period_start, current_period_end: current_period_end}
  - type: pass_trial_start
    target: pass_memberships
    mutation: {transition: {from: enrolled, to: trial}}
    meaning: "The free trial starts."
    grain: "One write per membership."
    fields:
      trial_end_date: "Last day of the trial."
    triggers: []
  - type: pass_activate
    target: pass_memberships
    mutation: {transition: [{from: enrolled, to: active}, {from: trial, to: active}]}
    meaning: "The first paid period begins."
    grain: "One write per membership."
    fields:
      current_period_start: "First day of the first paid period."
      current_period_end: "Last day of the first paid period."
    triggers: []
  - type: pass_payment_lapse
    target: pass_memberships
    mutation: {transition: {from: active, to: past_due}}
    meaning: "A renewal fee is declined and the membership becomes past due."
    grain: "One write per declined renewal."
    fields:
      current_period_start: "First day of the period the declined renewal was for."
    triggers: []
  - type: pass_payment_recover
    target: pass_memberships
    mutation: {transition: {from: past_due, to: active}}
    meaning: "The past-due renewal fee is collected."
    grain: "One write per recovered renewal."
    fields:
      current_period_end: "Last day of the period now paid."
    triggers: []
  - type: pass_lapse_end
    target: pass_memberships
    mutation: {transition: [{from: past_due, to: cancelled}, {from: enrolled, to: cancelled}, {from: trial, to: cancelled}]}
    meaning: "The membership ends because a fee could not be collected."
    grain: "One write per membership."
    fields:
      cancelled_date: "Date the membership ended."
    triggers: []
  - type: pass_pause_schedule
    target: pass_memberships
    mutation: update
    meaning: "The member schedules a pause to start at the next renewal date."
    grain: "One write per pause scheduled."
    fields:
      last_paused_date: "Date the pause will start (the day after current_period_end)."
      paused_until: "Last day of the pause."
    triggers: []
  - type: pass_pause
    target: pass_memberships
    mutation: {transition: {from: active, to: paused}}
    meaning: "A scheduled pause starts on the renewal date; no renewal is charged."
    grain: "One write per pause."
    fields:
      current_period_end: "Unchanged; the paid period ended the day before the pause."
    triggers: []
  - type: pass_resume
    target: pass_memberships
    mutation: {transition: {from: paused, to: active}}
    meaning: "The pause ends and a new paid period begins."
    grain: "One write per pause."
    fields:
      current_period_start: "Day after paused_until."
      current_period_end: "Last day of the new period."
      paused_until: "Cleared."
    triggers:
      - event: "pass:pass_fee_charge"
        map: {charge_reason: renewal, billing_period_start: current_period_start}
  - type: pass_auto_renew_off
    target: pass_memberships
    mutation: {transition: {from: active, to: pending_cancellation}}
    meaning: "The member turns auto-renew off."
    grain: "One write per change."
    fields:
      auto_renew: "false."
    triggers: []
  - type: pass_auto_renew_on
    target: pass_memberships
    mutation: {transition: {from: pending_cancellation, to: active}}
    meaning: "The member turns auto-renew back on before the period ends."
    grain: "One write per change."
    fields:
      auto_renew: "true."
    triggers: []
  - type: pass_period_end_cancel
    target: pass_memberships
    mutation: {transition: {from: pending_cancellation, to: cancelled}}
    meaning: "The period ends with auto-renew off and the membership ends."
    grain: "One write per membership."
    fields:
      cancelled_date: "Day after current_period_end."
    triggers: []
  - type: pass_cancel_now
    target: pass_memberships
    mutation: {transition: [{from: active, to: cancelled}, {from: trial, to: cancelled}, {from: paused, to: cancelled}, {from: pending_cancellation, to: cancelled}]}
    meaning: "The member ends the membership at once."
    grain: "One write per membership."
    fields:
      cancelled_date: "Date the member ended it."
      auto_renew: "false."
    triggers: []
  - type: pass_plan_change
    target: pass_memberships
    mutation: update
    meaning: "The membership moves to another plan: an upgrade at once, a downgrade or student conversion at the renewal date."
    grain: "One write per plan change."
    fields:
      variant_name: "New plan."
      current_period_start: "First day of the period under the new plan."
      current_period_end: "Last day of the period under the new plan."
      student_verified_until: "Cleared when leaving the Student plan."
    triggers: []
  - type: pass_renew
    target: pass_memberships
    mutation: update
    meaning: "A renewal fee is collected and the next period begins."
    grain: "One write per renewal."
    fields:
      current_period_start: "Day after the previous current_period_end."
      current_period_end: "Last day of the new period."
    triggers: []
  - type: pass_student_reverify
    target: pass_memberships
    mutation: update
    meaning: "A Student member renews student verification."
    grain: "One write per verification."
    fields:
      student_verified_until: "New verification expiry."
    triggers: []

  # ---------------- ledger writes ----------------
  - type: pass_fee_charge
    target: pass_events
    meaning: "A membership fee is collected from the member's card."
    grain: "One row per fee collected for a period and reason."
    distinguish_by: [billing_period_start, charge_reason]
    fields:
      pass_membership_id: "Membership charged."
      event_date: "Date collected."
      amount: "Fee collected (positive)."
      billing_period_start: "First day of the period paid for."
      charge_reason: "initial, trial_conversion, renewal or plan_change_proration."
    account: membership_fees
    direction: in
    triggers:
      - event: "pass:pass_activate"
        when: {charge_reason: [initial, trial_conversion]}
        map: {current_period_start: billing_period_start}
      - event: "pass:pass_renew"
        when: {charge_reason: renewal}
        map: {current_period_start: billing_period_start}
  - type: pass_fee_refund
    target: pass_events
    meaning: "A membership fee, or part of it, is returned to the member's card."
    grain: "One row per fee charge refunded."
    distinguish_by: [original_event_id]
    fields:
      pass_membership_id: "Membership refunded."
      event_date: "Date refunded."
      amount: "Amount returned (negative)."
      billing_period_start: "Period of the refunded charge."
      original_event_id: "The fee charge refunded."
      refund_basis: "full_refund_window, annual_proration or duplicate_charge."
    account: membership_fees
    direction: out
    triggers: []
  - type: pass_payment_decline
    target: pass_events
    meaning: "An attempt to collect a membership fee is declined."
    grain: "One row per declined attempt."
    distinguish_by: [billing_period_start, charge_reason, retry_number]
    fields:
      pass_membership_id: "Membership concerned."
      event_date: "Date of the attempt."
      amount: "0.00."
      billing_period_start: "Period the fee was for."
      charge_reason: "Reason of the fee attempted."
      retry_number: "0 for the scheduled attempt, 1-3 for retries."
    triggers:
      - event: "pass:pass_payment_lapse"
        when: {charge_reason: renewal, retry_number: 0}
        map: {current_period_start: billing_period_start}
      - event: "pass:pass_lapse_end"
        when: {charge_reason: [initial, trial_conversion]}
        map: {cancelled_date: event_date}
  - type: pass_credit_earn
    target: pass_events
    meaning: "Pass ride credit is earned on an eligible completed trip."
    grain: "One row per trip that earns credit."
    distinguish_by: [trip_id]
    fields:
      pass_membership_id: "Membership earning the credit."
      trip_id: "Trip that earned it."
      event_date: "Date the credit posted."
      amount: "Credit earned (positive)."
      credit_month: "Calendar month of the trip's drop-off."
      billing_period_start: "Period in force at drop-off."
    account: member_credit
    direction: in
    triggers: []
  - type: pass_credit_redeem
    target: pass_events
    meaning: "Pass ride credit pays part or all of a fare."
    grain: "One row per fare paid with credit."
    distinguish_by: [trip_id]
    fields:
      pass_membership_id: "Membership whose credit is spent."
      trip_id: "Trip paid."
      event_date: "Date spent."
      amount: "Credit spent (negative)."
    account: member_credit
    direction: out
    triggers: []
  - type: pass_credit_forfeit
    target: pass_events
    meaning: "Pass ride credit is forfeited: credit left after the membership ended, or credit earned on a fare later refunded."
    grain: "One row per membership ending, or per refunded trip."
    distinguish_by: [forfeit_reason, trip_id]
    fields:
      pass_membership_id: "Membership concerned."
      trip_id: "Refunded trip for a trip_refunded forfeiture; empty for membership_ended."
      event_date: "Date forfeited."
      amount: "Credit removed (negative)."
      original_event_id: "The credit earn reversed, for trip_refunded; empty otherwise."
      forfeit_reason: "membership_ended or trip_refunded."
    account: member_credit
    direction: out
    triggers: []

measures:
  - id: pass_msr_credit_earned_month
    window: "The calendar month (member's home market time) given by credit_month."
    measure: "Sum of pass_credit_earn amounts of the membership with that credit_month, less trip_refunded pass_credit_forfeit amounts of credits earned in that month."
  - id: pass_msr_credit_earned_period
    window: "The billing period in force (current_period_start through current_period_end)."
    measure: "Sum of pass_credit_earn amounts of the membership whose billing_period_start equals current_period_start, less trip_refunded pass_credit_forfeit amounts reversing those credits."
  - id: pass_msr_benefit_uses_since_charge
    window: "From the event_date of the fee charge in question through the current day, inclusive."
    measure: "Count of pass_credit_earn rows of the membership, plus trip_fee_waiver rows in trip_charges carrying this pass_membership_id with a Pass waiver_basis, plus trip_fare_charge rows carrying this pass_membership_id with member_discount_amount above 0.00, dated in the window."
  - id: pass_msr_trip_eligible_fare
    window: "One trip."
    measure: "The amount of the trip's trip_fare_charge less the booking_fee of its ride option (trip charter), not below 0.00; wait time, tolls, airport fees, Priority Pickup, reservation fees and tips are separate rows and never included."
  - id: pass_msr_unused_whole_months
    window: "The billing period in force on the cancellation date."
    measure: "Number of whole calendar months of the period, counted from the period start's day-of-month, that begin after the cancellation date."
  - id: pass_msr_unused_period_value
    window: "The billing period in force on the change date."
    measure: "membership_fee of the current plan times the days of the period from the change date through current_period_end inclusive, divided by the days in the period, rounded half up to the cent."

policies:
  - id: pass_agg_multi_holding
    subject: [pass_enroll]
    rule: >-
      A customer may hold only one Wayfare Pass membership at a time.
      A new enrollment is accepted only when the customer has no membership in enrolled, trial, active, past_due, paused or pending_cancellation status; a customer whose membership is cancelled may enroll again, subject to the trial rules.
      Moving between plans is a plan change on the existing membership, never a second enrollment.
    eligibility:
      - id: one_open_membership
        applies_to: [pass_enroll]
        kind: dedup
        condition: "A new enrollment is accepted only when the customer has no membership in enrolled, trial, active, past_due, paused or pending_cancellation status; a customer whose membership is cancelled may enroll again, subject to the trial rules."
        evidence_fields: [pass_memberships.customer_id, pass_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.customer_id]]
          action_bindings: {pass_memberships.customer_id: customer_id}
        dedup_contract:
          table: pass_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [enrolled, trial, active, past_due, paused, pending_cancellation]}
          distinct_fields: [enrolled_date]
    params:
      max_per_customer: 1

  - id: pass_enrollment_and_trial
    subject: [pass_enroll, pass_trial_start, pass_activate]
    rule: >-
      Enrollment is open to customers aged at least the plan's entry age on the enrollment date, by the date of birth on the profile, with a payment card on file.
      The Student plan additionally requires student enrollment verified by Wayfare's verification partner, valid for student_verification_valid_months from the verification date.
      A free trial of free_trial_days is granted only when the customer has held no Wayfare Pass membership that began within trial_lookback_months before the enrollment date and the membership is not taken out through a card partner offer; the trial runs from the enrollment date (day 1) and trial_end_date is its last day.
      All plan benefits apply during the trial; on the day after trial_end_date the first fee is collected (trial_conversion) and the membership becomes active, or ends if that fee is declined.
      Without a trial the first fee is collected on the enrollment date (initial) and the membership becomes active when it is collected; a card partner membership becomes active on the enrollment date without any Wayfare fee.
      A customer who is not eligible for a trial is enrolled without one rather than refused.
      A card partner offer can provide only plans whose card_partner_plans is true.
    eligibility:
      - id: entry_age
        applies_to: [pass_enroll]
        kind: authorization
        condition: "Enrollment is open to customers aged at least the plan's entry age on the enrollment date, by the date of birth on the profile, with a payment card on file."
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
      - id: trial_lookback
        applies_to: [pass_trial_start]
        kind: authorization
        condition: "A free trial of free_trial_days is granted only when the customer has held no Wayfare Pass membership that began within trial_lookback_months before the enrollment date and the membership is not taken out through a card partner offer; the trial runs from the enrollment date (day 1) and trial_end_date is its last day."
        evidence_fields: [pass_memberships.customer_id, pass_memberships.enrolled_date, pass_memberships.signup_channel]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.customer_id]]
          action_bindings: {pass_memberships.customer_id: customer_id}
    params:
      trial_lookback_months: "=trial_lookback_months"
      card_partner_plans: "=card_partner_plans"
      benefits_in_trial: "=benefits_in_trial"
      per_tier:
        "Wayfare Pass Student": {free_trial_days: "=free_trial_days", student_verification_valid_months: "=student_verification_valid_months"}
        "Wayfare Pass Monthly": {free_trial_days: "=free_trial_days", student_verification_valid_months: "=student_verification_valid_months"}
        "Wayfare Pass Annual": {free_trial_days: "=free_trial_days", student_verification_valid_months: "=student_verification_valid_months"}
        "Wayfare Pass Plus Monthly": {free_trial_days: "=free_trial_days", student_verification_valid_months: "=student_verification_valid_months"}
        "Wayfare Pass Plus Annual": {free_trial_days: "=free_trial_days", student_verification_valid_months: "=student_verification_valid_months"}
        "Wayfare Pass All Access Annual": {free_trial_days: "=free_trial_days", student_verification_valid_months: "=student_verification_valid_months"}

  - id: pass_evt_fee_billing
    subject: [pass_fee_charge, pass_renew]
    rule: >-
      Membership fees are collected only on a membership in enrolled, trial, active or past_due status.
      The fee for a period is the plan's membership_fee; the period ends on the day before the same day-of-month billing_period_months later, falling back to the last day of the month when that day does not exist (period_end_rule).
      The renewal fee is collected on the day after current_period_end when auto-renew is on; a membership in pending_cancellation is never renewed, and a paused membership is not charged until the pause ends.
      A membership taken out through a card partner offer is never billed by Wayfare.
      Each period is paid by exactly one fee charge per reason; a second collection for the same period and reason is a duplicate and is refunded in full with refund basis duplicate_charge.
    eligibility:
      - id: billable_status
        applies_to: [pass_fee_charge]
        kind: state
        condition: "Membership fees are collected only on a membership in enrolled, trial, active or past_due status."
        evidence_fields: [pass_memberships.status, pass_memberships.pass_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.pass_membership_id]]
          action_bindings: {pass_memberships.pass_membership_id: pass_membership_id}
        state_contract:
          field: pass_memberships.status
          allowed: [enrolled, trial, active, past_due]
    params:
      period_end_rule: "=period_end_rule"
      per_tier:
        "Wayfare Pass Student": {membership_fee: "=membership_fee", billing_period_months: "=billing_period_months"}
        "Wayfare Pass Monthly": {membership_fee: "=membership_fee", billing_period_months: "=billing_period_months"}
        "Wayfare Pass Annual": {membership_fee: "=membership_fee", billing_period_months: "=billing_period_months"}
        "Wayfare Pass Plus Monthly": {membership_fee: "=membership_fee", billing_period_months: "=billing_period_months"}
        "Wayfare Pass Plus Annual": {membership_fee: "=membership_fee", billing_period_months: "=billing_period_months"}
        "Wayfare Pass All Access Annual": {membership_fee: "=membership_fee", billing_period_months: "=billing_period_months"}
    formula:
      when: "charge_reason in ['initial', 'trial_conversion', 'renewal']"
      amount: "membership_fee"

  - id: pass_evt_payment_dunning
    subject: [pass_payment_decline, pass_payment_lapse, pass_payment_recover, pass_lapse_end]
    rule: >-
      When a renewal fee is declined, the membership becomes past_due and the fee is retried payment_retry_attempts times, payment_retry_interval_days apart; each declined attempt is one pass_payment_decline row.
      While past_due the membership gives no benefits: no member discount, no ride credit earning and no fee waivers, although credit already earned can still be spent.
      If the fee is collected (a retry or a payment method the member adds) before dunning_grace_days have passed since the first decline, the membership becomes active again with the same period dates; otherwise it ends on the day the grace period runs out.
      A declined initial or trial conversion fee is not retried: the membership ends at once.
    eligibility: []
    params:
      payment_retry_attempts: "=payment_retry_attempts"
      benefits_in_past_due: "=benefits_in_past_due"
      per_tier:
        "Wayfare Pass Student": {payment_retry_interval_days: "=payment_retry_interval_days", dunning_grace_days: "=dunning_grace_days"}
        "Wayfare Pass Monthly": {payment_retry_interval_days: "=payment_retry_interval_days", dunning_grace_days: "=dunning_grace_days"}
        "Wayfare Pass Annual": {payment_retry_interval_days: "=payment_retry_interval_days", dunning_grace_days: "=dunning_grace_days"}
        "Wayfare Pass Plus Monthly": {payment_retry_interval_days: "=payment_retry_interval_days", dunning_grace_days: "=dunning_grace_days"}
        "Wayfare Pass Plus Annual": {payment_retry_interval_days: "=payment_retry_interval_days", dunning_grace_days: "=dunning_grace_days"}
        "Wayfare Pass All Access Annual": {payment_retry_interval_days: "=payment_retry_interval_days", dunning_grace_days: "=dunning_grace_days"}

  - id: pass_evt_ride_credit
    subject: [pass_credit_earn]
    rule: >-
      Pass ride credit is earned only on trips completed while the membership is in trial, active or pending_cancellation status.
      Only trips in a ride option listed in the plan's ride_credit_eligible_options earn credit, reserved trips included; the eligible fare is the trip's fare charge less the ride option's booking fee (pass_msr_trip_eligible_fare), and wait time, tolls, airport fees, Priority Pickup, reservation fees and tips never count.
      A trip whose eligible fare is below ride_credit_min_eligible_fare earns nothing.
      The credit is ride_credit_rate_pct of the eligible fare, rounded half up to the cent, capped at ride_credit_cap_per_trip and at what remains of ride_credit_monthly_cap for the calendar month of the drop-off (pass_msr_credit_earned_month); when the monthly cap is reached the trip earns nothing and nothing carries over.
      Credit posts ride_credit_posting_delay_hours after drop-off and can be spent from then on.
    eligibility:
      - id: benefit_bearing_status
        applies_to: [pass_credit_earn]
        kind: state
        condition: "Pass ride credit is earned only on trips completed while the membership is in trial, active or pending_cancellation status."
        evidence_fields: [pass_memberships.status, pass_memberships.pass_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.pass_membership_id]]
          action_bindings: {pass_memberships.pass_membership_id: pass_membership_id}
        state_contract:
          field: pass_memberships.status
          allowed: [trial, active, pending_cancellation]
    params:
      ride_credit_min_eligible_fare: "=ride_credit_min_eligible_fare"
      ride_credit_posting_delay_hours: "=ride_credit_posting_delay_hours"
      ride_credit_excluded_components: "=ride_credit_excluded_components"
      ride_credit_reserved_trips: "=ride_credit_reserved_trips"
      credit_month_basis: "=credit_month_basis"
      per_tier:
        "Wayfare Pass Student": {ride_credit_rate_pct: "=ride_credit_rate_pct", ride_credit_cap_per_trip: "=ride_credit_cap_per_trip", ride_credit_monthly_cap: "=ride_credit_monthly_cap", ride_credit_eligible_options: "=ride_credit_eligible_options"}
        "Wayfare Pass Monthly": {ride_credit_rate_pct: "=ride_credit_rate_pct", ride_credit_cap_per_trip: "=ride_credit_cap_per_trip", ride_credit_monthly_cap: "=ride_credit_monthly_cap", ride_credit_eligible_options: "=ride_credit_eligible_options"}
        "Wayfare Pass Annual": {ride_credit_rate_pct: "=ride_credit_rate_pct", ride_credit_cap_per_trip: "=ride_credit_cap_per_trip", ride_credit_monthly_cap: "=ride_credit_monthly_cap", ride_credit_eligible_options: "=ride_credit_eligible_options"}
        "Wayfare Pass Plus Monthly": {ride_credit_rate_pct: "=ride_credit_rate_pct", ride_credit_cap_per_trip: "=ride_credit_cap_per_trip", ride_credit_monthly_cap: "=ride_credit_monthly_cap", ride_credit_eligible_options: "=ride_credit_eligible_options"}
        "Wayfare Pass Plus Annual": {ride_credit_rate_pct: "=ride_credit_rate_pct", ride_credit_cap_per_trip: "=ride_credit_cap_per_trip", ride_credit_monthly_cap: "=ride_credit_monthly_cap", ride_credit_eligible_options: "=ride_credit_eligible_options"}
        "Wayfare Pass All Access Annual": {ride_credit_rate_pct: "=ride_credit_rate_pct", ride_credit_cap_per_trip: "=ride_credit_cap_per_trip", ride_credit_monthly_cap: "=ride_credit_monthly_cap", ride_credit_eligible_options: "=ride_credit_eligible_options"}
    formula:
      when_not: "pass_msr_trip_eligible_fare < ride_credit_min_eligible_fare"
      amount: "max(0, min(round(pass_msr_trip_eligible_fare * ride_credit_rate_pct / 100, 2), ride_credit_cap_per_trip, ride_credit_monthly_cap - pass_msr_credit_earned_month))"
    measures: [pass_msr_trip_eligible_fare, pass_msr_credit_earned_month]

  - id: pass_evt_credit_redeem_forfeit
    subject: [pass_credit_redeem, pass_credit_forfeit]
    rule: >-
      Pass ride credit pays only fares (credit_redemption_scope), only when the member switches credit on for the trip, and never more than the posted balance or the fare charge; the redemption equals the member_credit_applied recorded on the fare charge.
      Credit stays spendable while the membership is in any status other than cancelled, and after cancellation for credit_expiry_days_after_end calendar days counted from the day after cancelled_date; whatever is left after that is forfeited in one row with reason membership_ended.
      When a fare that earned credit is refunded in full, the credit earned on that trip is forfeited with reason trip_refunded, pointing at the credit earn it reverses; when less than that credit remains in the balance, only the remaining balance is forfeited and the balance never goes below 0.00.
      Partial fare adjustments do not change credit already earned.
    eligibility: []
    params:
      credit_redemption_scope: "=credit_redemption_scope"
      credit_expiry_days_after_end: "=credit_expiry_days_after_end"

  - id: pass_cancellation_and_refund
    subject: [pass_auto_renew_off, pass_auto_renew_on, pass_period_end_cancel, pass_cancel_now, pass_fee_refund]
    rule: >-
      Turning auto-renew off and ending a membership at once are the member's own decisions and are made by the member; turning auto-renew off keeps every benefit to the end of the period in force, and it can be turned back on any time before the period ends.
      A fee refund is made only on a membership that is active, past_due, paused, pending_cancellation or cancelled.
      A fee charge is refunded in full only when the member ends the membership within the full refund window: The full refund window is counted in calendar days from the event_date of the fee charge: day 1 is the calendar day after the charge, and the membership must be ended no later than the last day of the window.
      The full refund also requires that no benefit was used since that charge (pass_msr_benefit_uses_since_charge is 0).
      When the full refund does not apply, an annual plan with annual_proration_refund true that the member ends at once is refunded membership_fee times the unused whole months (pass_msr_unused_whole_months) over billing_period_months, less the credit earned in the period (pass_msr_credit_earned_period) when proration_credit_offset is true; a result below proration_min_refund is not paid.
      Monthly plans are not refunded outside the full refund window, a member who only turns auto-renew off is never refunded, and a membership taken out through a card partner offer is never refunded by Wayfare (card_partner_refundable).
      A duplicate fee charge is always refunded in full regardless of these windows.
      One refund per fee charge; the refund names the charge it returns (original_event_id).
    eligibility:
      - id: refundable_status
        applies_to: [pass_fee_refund]
        kind: state
        condition: "A fee refund is made only on a membership that is active, past_due, paused, pending_cancellation or cancelled."
        evidence_fields: [pass_memberships.status, pass_memberships.pass_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.pass_membership_id]]
          action_bindings: {pass_memberships.pass_membership_id: pass_membership_id}
        state_contract:
          field: pass_memberships.status
          allowed: [active, past_due, paused, pending_cancellation, cancelled]
      - id: within_full_refund_window
        applies_to: [pass_fee_refund]
        kind: time
        condition: "A fee charge is refunded in full only when the member ends the membership within the full refund window: The full refund window is counted in calendar days from the event_date of the fee charge: day 1 is the calendar day after the charge, and the membership must be ended no later than the last day of the window."
        evidence_fields: [pass_events.event_date, pass_events.pass_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_events.pass_event_id]]
          action_bindings: {pass_events.pass_event_id: original_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "event_date of the fee charge"
          anchor_source: pass_events.event_date
          relation: not_after
          duration_source: variants.refund_full_window_days
          unit: calendar_days
          counting_rule: "The full refund window is counted in calendar days from the event_date of the fee charge: day 1 is the calendar day after the charge, and the membership must be ended no later than the last day of the window."
          boundary: inclusive
      - id: no_benefit_used
        applies_to: [pass_fee_refund]
        kind: authorization
        condition: "The full refund also requires that no benefit was used since that charge (pass_msr_benefit_uses_since_charge is 0)."
        evidence_fields: [pass_events.pass_membership_id, pass_events.event_type, pass_events.event_date, trip_charges.pass_membership_id, trip_charges.waiver_basis, trip_charges.member_discount_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_events.pass_membership_id], [trip_charges.pass_membership_id]]
          action_bindings: {pass_events.pass_membership_id: pass_membership_id, trip_charges.pass_membership_id: pass_membership_id}
      - id: one_refund_per_charge
        applies_to: [pass_fee_refund]
        kind: dedup
        condition: "One refund per fee charge; the refund names the charge it returns (original_event_id)."
        evidence_fields: [pass_events.original_event_id, pass_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_events.original_event_id]]
          action_bindings: {pass_events.original_event_id: original_event_id}
        dedup_contract:
          table: pass_events
          mode: separate_record
          object_bindings: {original_event_id: original_event_id}
          duplicate_filters: {event_type: [pass_fee_refund]}
          distinct_fields: [event_date]
    params:
      immediate_cancel_allowed: "=immediate_cancel_allowed"
      card_partner_refundable: "=card_partner_refundable"
      rounding_rule: "=rounding_rule"
      per_tier:
        "Wayfare Pass Student": {refund_full_window_days: "=refund_full_window_days", annual_proration_refund: "=annual_proration_refund", proration_unit: "=proration_unit", proration_credit_offset: "=proration_credit_offset", proration_min_refund: "=proration_min_refund"}
        "Wayfare Pass Monthly": {refund_full_window_days: "=refund_full_window_days", annual_proration_refund: "=annual_proration_refund", proration_unit: "=proration_unit", proration_credit_offset: "=proration_credit_offset", proration_min_refund: "=proration_min_refund"}
        "Wayfare Pass Annual": {refund_full_window_days: "=refund_full_window_days", annual_proration_refund: "=annual_proration_refund", proration_unit: "=proration_unit", proration_credit_offset: "=proration_credit_offset", proration_min_refund: "=proration_min_refund"}
        "Wayfare Pass Plus Monthly": {refund_full_window_days: "=refund_full_window_days", annual_proration_refund: "=annual_proration_refund", proration_unit: "=proration_unit", proration_credit_offset: "=proration_credit_offset", proration_min_refund: "=proration_min_refund"}
        "Wayfare Pass Plus Annual": {refund_full_window_days: "=refund_full_window_days", annual_proration_refund: "=annual_proration_refund", proration_unit: "=proration_unit", proration_credit_offset: "=proration_credit_offset", proration_min_refund: "=proration_min_refund"}
        "Wayfare Pass All Access Annual": {refund_full_window_days: "=refund_full_window_days", annual_proration_refund: "=annual_proration_refund", proration_unit: "=proration_unit", proration_credit_offset: "=proration_credit_offset", proration_min_refund: "=proration_min_refund"}
    formula:
      prorated_refund: "round(membership_fee * pass_msr_unused_whole_months / billing_period_months - pass_msr_credit_earned_period, 2)"
      pays_prorated: "annual_proration_refund and prorated_refund >= proration_min_refund"
    measures: [pass_msr_benefit_uses_since_charge, pass_msr_unused_whole_months, pass_msr_credit_earned_period]

  - id: pass_pause_rules
    subject: [pass_pause_schedule, pass_pause, pass_resume]
    rule: >-
      Pausing is offered only on plans with pause_allowed true, only on an active membership with auto-renew on, and is the member's own decision.
      A pause covers between pause_min_months and pause_max_months whole billing months; it starts on the day after current_period_end, so the period already paid is used in full, and paused_until is its last day.
      A new pause may be scheduled only once the previous pause is far enough back: The pause frequency is counted in calendar months from the previous last_paused_date: the new pause may be scheduled on or after the same day-of-month pause_frequency_months later, or the last day of that month when the day does not exist.
      While paused there are no fees and no benefits; on the day after paused_until a new period begins with a renewal charge.
    eligibility:
      - id: pause_frequency
        applies_to: [pass_pause_schedule]
        kind: time
        condition: "A new pause may be scheduled only once the previous pause is far enough back: The pause frequency is counted in calendar months from the previous last_paused_date: the new pause may be scheduled on or after the same day-of-month pause_frequency_months later, or the last day of that month when the day does not exist."
        evidence_fields: [pass_memberships.last_paused_date, pass_memberships.pass_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.pass_membership_id]]
          action_bindings: {pass_memberships.pass_membership_id: pass_membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "previous last_paused_date"
          anchor_source: pass_memberships.last_paused_date
          relation: not_before
          duration_source: variants.pause_frequency_months
          unit: calendar_months
          counting_rule: "The pause frequency is counted in calendar months from the previous last_paused_date: the new pause may be scheduled on or after the same day-of-month pause_frequency_months later, or the last day of that month when the day does not exist."
          boundary: inclusive
    params:
      per_tier:
        "Wayfare Pass Student": {pause_allowed: "=pause_allowed", pause_min_months: "=pause_min_months", pause_max_months: "=pause_max_months", pause_frequency_months: "=pause_frequency_months"}
        "Wayfare Pass Monthly": {pause_allowed: "=pause_allowed", pause_min_months: "=pause_min_months", pause_max_months: "=pause_max_months", pause_frequency_months: "=pause_frequency_months"}
        "Wayfare Pass Annual": {pause_allowed: "=pause_allowed", pause_min_months: "=pause_min_months", pause_max_months: "=pause_max_months", pause_frequency_months: "=pause_frequency_months"}
        "Wayfare Pass Plus Monthly": {pause_allowed: "=pause_allowed", pause_min_months: "=pause_min_months", pause_max_months: "=pause_max_months", pause_frequency_months: "=pause_frequency_months"}
        "Wayfare Pass Plus Annual": {pause_allowed: "=pause_allowed", pause_min_months: "=pause_min_months", pause_max_months: "=pause_max_months", pause_frequency_months: "=pause_frequency_months"}
        "Wayfare Pass All Access Annual": {pause_allowed: "=pause_allowed", pause_min_months: "=pause_min_months", pause_max_months: "=pause_max_months", pause_frequency_months: "=pause_frequency_months"}

  - id: pass_plan_change_rules
    subject: [pass_plan_change, pass_fee_charge]
    rule: >-
      A plan change is the member's own decision and is allowed only on an active membership, at most plan_changes_per_period times per billing period.
      An upgrade (a plan listed in upgrade_targets) takes effect on the day it is made: a new period of the new plan starts that day and the fee collected is the new plan's membership_fee less the unused value of the current period (pass_msr_unused_period_value), booked as charge_reason plan_change_proration.
      A downgrade (a plan listed in downgrade_targets) takes effect at the next renewal and is charged at the new plan's fee then; a move to a plan in neither list is not allowed.
      Moving to or from the Student plan follows the same lists; moving onto the Student plan also requires current student verification.
      A membership taken out through a card partner offer can change plan only by ending the partner membership and enrolling again.
    eligibility:
      - id: active_membership
        applies_to: [pass_plan_change]
        kind: authorization
        condition: "A plan change is the member's own decision and is allowed only on an active membership, at most plan_changes_per_period times per billing period."
        evidence_fields: [pass_memberships.status, pass_memberships.pass_membership_id, pass_memberships.current_period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[pass_memberships.pass_membership_id]]
          action_bindings: {pass_memberships.pass_membership_id: pass_membership_id}
    params:
      plan_changes_per_period: "=plan_changes_per_period"
      upgrade_proration_basis: "=upgrade_proration_basis"
      downgrade_effective: "=downgrade_effective"
      per_tier:
        "Wayfare Pass Student": {upgrade_targets: "=upgrade_targets", downgrade_targets: "=downgrade_targets"}
        "Wayfare Pass Monthly": {upgrade_targets: "=upgrade_targets", downgrade_targets: "=downgrade_targets"}
        "Wayfare Pass Annual": {upgrade_targets: "=upgrade_targets", downgrade_targets: "=downgrade_targets"}
        "Wayfare Pass Plus Monthly": {upgrade_targets: "=upgrade_targets", downgrade_targets: "=downgrade_targets"}
        "Wayfare Pass Plus Annual": {upgrade_targets: "=upgrade_targets", downgrade_targets: "=downgrade_targets"}
        "Wayfare Pass All Access Annual": {upgrade_targets: "=upgrade_targets", downgrade_targets: "=downgrade_targets"}
    formula:
      when: "charge_reason == 'plan_change_proration'"
      amount: "round(membership_fee - pass_msr_unused_period_value, 2)"
    measures: [pass_msr_unused_period_value]

  - id: pass_student_verification
    subject: [pass_student_reverify, pass_plan_change]
    rule: >-
      A Student membership needs student verification valid on each renewal date; verification is renewed through Wayfare's verification partner and extends student_verified_until by student_verification_valid_months from the verification date.
      When student_verified_until has passed and the member has not re-verified within student_reverify_grace_days after it, the membership converts at its next renewal to student_lapse_conversion_plan and is charged that plan's fee; it is not cancelled.
      A member who re-verifies before that renewal stays on the Student plan.
    eligibility: []
    params:
      per_tier:
        "Wayfare Pass Student": {student_reverify_grace_days: "=student_reverify_grace_days", student_lapse_conversion_plan: "=student_lapse_conversion_plan"}
        "Wayfare Pass Monthly": {student_reverify_grace_days: "=student_reverify_grace_days", student_lapse_conversion_plan: "=student_lapse_conversion_plan"}
        "Wayfare Pass Annual": {student_reverify_grace_days: "=student_reverify_grace_days", student_lapse_conversion_plan: "=student_lapse_conversion_plan"}
        "Wayfare Pass Plus Monthly": {student_reverify_grace_days: "=student_reverify_grace_days", student_lapse_conversion_plan: "=student_lapse_conversion_plan"}
        "Wayfare Pass Plus Annual": {student_reverify_grace_days: "=student_reverify_grace_days", student_lapse_conversion_plan: "=student_lapse_conversion_plan"}
        "Wayfare Pass All Access Annual": {student_reverify_grace_days: "=student_reverify_grace_days", student_lapse_conversion_plan: "=student_lapse_conversion_plan"}

  - id: pass_trip_benefits
    subject: [pass_credit_earn, pass_credit_redeem]
    rule: >-
      A membership confers its trip benefits only while it is in trial, active or pending_cancellation status: the member discount (member_discount_pct on member_discount_options), free cancellations (free_cancellations_per_month), rebook grace (rebook_grace_minutes), Priority Pickup waivers (priority_pickups_per_month), the reservation fee waiver (reservation_fee_waived) and ride credit earning; the trip charter applies them when it charges each trip and records each use on the trip's charges.
      Allowances count per calendar month in the member's home market time, unused allowances do not carry over, and a benefit is used only on a trip requested while the membership was in force.
      Where several benefits touch one trip they all apply: the member discount first, then ride credit is earned on the discounted fare, and credit spent pays the discounted fare.
    eligibility: []
    params:
      per_tier:
        "Wayfare Pass Student": {member_discount_pct: "=member_discount_pct", member_discount_options: "=member_discount_options", free_cancellations_per_month: "=free_cancellations_per_month", rebook_grace_minutes: "=rebook_grace_minutes", priority_pickups_per_month: "=priority_pickups_per_month", reservation_fee_waived: "=reservation_fee_waived"}
        "Wayfare Pass Monthly": {member_discount_pct: "=member_discount_pct", member_discount_options: "=member_discount_options", free_cancellations_per_month: "=free_cancellations_per_month", rebook_grace_minutes: "=rebook_grace_minutes", priority_pickups_per_month: "=priority_pickups_per_month", reservation_fee_waived: "=reservation_fee_waived"}
        "Wayfare Pass Annual": {member_discount_pct: "=member_discount_pct", member_discount_options: "=member_discount_options", free_cancellations_per_month: "=free_cancellations_per_month", rebook_grace_minutes: "=rebook_grace_minutes", priority_pickups_per_month: "=priority_pickups_per_month", reservation_fee_waived: "=reservation_fee_waived"}
        "Wayfare Pass Plus Monthly": {member_discount_pct: "=member_discount_pct", member_discount_options: "=member_discount_options", free_cancellations_per_month: "=free_cancellations_per_month", rebook_grace_minutes: "=rebook_grace_minutes", priority_pickups_per_month: "=priority_pickups_per_month", reservation_fee_waived: "=reservation_fee_waived"}
        "Wayfare Pass Plus Annual": {member_discount_pct: "=member_discount_pct", member_discount_options: "=member_discount_options", free_cancellations_per_month: "=free_cancellations_per_month", rebook_grace_minutes: "=rebook_grace_minutes", priority_pickups_per_month: "=priority_pickups_per_month", reservation_fee_waived: "=reservation_fee_waived"}
        "Wayfare Pass All Access Annual": {member_discount_pct: "=member_discount_pct", member_discount_options: "=member_discount_options", free_cancellations_per_month: "=free_cancellations_per_month", rebook_grace_minutes: "=rebook_grace_minutes", priority_pickups_per_month: "=priority_pickups_per_month", reservation_fee_waived: "=reservation_fee_waived"}

# ============================================================================
# extended_policies (difficulty pass_membership_billing_and_benefits)
# ============================================================================
extended_policies:
  # ---------------------------------------------------------------- task 0 (prerequisite problem)
  - id: pass_ext_restoration_payment
    base_policy_refs: [pass_evt_fee_billing, pass_plan_change_rules, pass_evt_payment_dunning]
    overwrite:
      - base_policy: pass_evt_fee_billing
        superseded_clause: >-
          The fee for a period is the plan's membership_fee;
        replaced_by: >-
          The restoration payment is worked out in this order: the restored-period share of the membership fee is taken first; the loyalty restoration discount, the frequent-rider restoration discount and the credit-use restoration discount are then added into one discount rate, and that share is reduced once by the combined rate; the payment recovery fee is added to the reduced amount; the total is rounded half up to the cent once, at the end.
    trigger: on_request
    subject: [pass_fee_charge, pass_payment_recover]
    computes: amount
    target_tool: restore_past_due_pass_5ad4a609
    params:
      loyal_tenure_high: 18
      loyal_tenure_low: 6
      loyal_disc_high: 0.10
      loyal_disc_low: 0.05
      rider_trips_high: 12
      rider_trips_low: 6
      rider_disc_high: 0.05
      rider_disc_low: 0.02
      credit_use_high: 8.00
      credit_use_low: 4.00
      credit_disc_high: 0.03
      credit_disc_low: 0.01
      attempts_high: 3
      attempts_low: 2
      recovery_fee_high: 1.00
      recovery_fee_low: 0.50
    rule: >-
      A past-due membership is restored when the member pays the declined renewal of the billing period in force with a payment method they now choose; the payment is booked as a renewal fee charge for that period and the membership becomes active again with the same period dates.
      The restoration payment is the plan's membership fee for the billing period in force.
      It is rounded half up to the cent.
      The restored-period share of the membership fee depends on how the restoration falls: for a monthly plan restored while the declined attempts recorded on the period's renewal are fewer than the plan's payment retries plus one, the share is the days from the restoration date through the last day of the period, both days counted, over the days in the period, both end days counted; for an annual plan restored while the declined attempts recorded on the period's renewal are fewer than the plan's payment retries plus one, the share is the whole calendar months of the period, counted from the period start's day of month, that begin after the restoration date, over twelve; any other restoration takes the full membership fee.
      The loyalty restoration discount is 10 percent for a member who has held the membership for at least 18 whole months and has no declined scheduled renewal in the 12 months before the restoration other than the one being restored; it is 5 percent for a member who does not meet that tier but has held the membership for at least 6 whole months and has at most one such other declined scheduled renewal; it is nothing for anyone else.
      The frequent-rider restoration discount counts the member's trips charged a fare in the last three months: 5 percent at 12 or more such trips, 2 percent at 6 to 11, nothing below 6.
      The credit-use restoration discount looks at the Pass ride credit the member spent on fares in the last six months: 3 percent at 8.00 or more, 1 percent at 4.00 or more but under 8.00, nothing under 4.00.
      The payment recovery fee depends on the declined attempts recorded on the period's renewal: 1.00 at three or more attempts, 0.50 at exactly two, nothing at one.
      The restoration payment is worked out in this order: the restored-period share of the membership fee is taken first; the loyalty restoration discount, the frequent-rider restoration discount and the credit-use restoration discount are then added into one discount rate, and that share is reduced once by the combined rate; the payment recovery fee is added to the reduced amount; the total is rounded half up to the cent once, at the end.
    prerequisite: []
    cross_category:
      - category: trip
        as: history
        reads: [trip_charges.event_type, trip_charges.charge_date]
        note: The frequent-rider restoration discount takes its tier from the member's fare charges in the trip ledger over the last three months.
    compute:
      - r_fee: "P('membership_fee')"
      - r_attempts: "COUNT('pass_events', event_type='pass_payment_decline', billing_period_start=F('current_period_start'))"
      - r_period_days: "DAYS(F('current_period_start'), F('current_period_end')) + 1"
      - r_days_left: "DAYS(NOW, F('current_period_end')) + 1"
      - r_months_left: "P('billing_period_months') - MONTHS(F('current_period_start'), NOW) - 1"
      - r_share: "r_days_left / r_period_days if P('billing_period_months') == 1 and r_attempts < P('payment_retry_attempts') + 1 else (r_months_left / P('billing_period_months') if P('billing_period_months') == 12 and r_attempts < P('payment_retry_attempts') + 1 else 1)"
      - r_tenure: "MONTHS(F('enrolled_date'), NOW)"
      - r_other_declines: "COUNT('pass_events', within_months=12, event_type='pass_payment_decline', retry_number=0) - COUNT('pass_events', event_type='pass_payment_decline', retry_number=0, billing_period_start=F('current_period_start'))"
      - r_loyal: "K('loyal_disc_high') if r_tenure >= K('loyal_tenure_high') and r_other_declines == 0 else (K('loyal_disc_low') if r_tenure >= K('loyal_tenure_low') and r_other_declines <= 1 else 0)"
      - r_trips: "XCOUNT('trip', 'trip_charges', within_months=3, date_field='charge_date', event_type='trip_fare_charge')"
      - r_rider: "K('rider_disc_high') if r_trips >= K('rider_trips_high') else (K('rider_disc_low') if r_trips >= K('rider_trips_low') else 0)"
      - r_credit_spent: "0 - SUM('pass_events', 'amount', within_months=6, event_type='pass_credit_redeem')"
      - r_credit_use: "K('credit_disc_high') if r_credit_spent >= K('credit_use_high') else (K('credit_disc_low') if r_credit_spent >= K('credit_use_low') else 0)"
      - r_recovery_fee: "K('recovery_fee_high') if r_attempts >= K('attempts_high') else (K('recovery_fee_low') if r_attempts >= K('attempts_low') else 0)"
      - r_discount: "r_loyal + r_rider + r_credit_use"
      - result: "RND(r_fee * r_share * (1 - r_discount) + r_recovery_fee, 2)"
    compute_basis:
      r_fee: "The restoration payment is the plan's membership fee for the billing period in force."
      r_attempts: "The payment recovery fee depends on the declined attempts recorded on the period's renewal: 1.00 at three or more attempts, 0.50 at exactly two, nothing at one."
      r_share: "The restored-period share of the membership fee depends on how the restoration falls: for a monthly plan restored while the declined attempts recorded on the period's renewal are fewer than the plan's payment retries plus one, the share is the days from the restoration date through the last day of the period, both days counted, over the days in the period, both end days counted; for an annual plan restored while the declined attempts recorded on the period's renewal are fewer than the plan's payment retries plus one, the share is the whole calendar months of the period, counted from the period start's day of month, that begin after the restoration date, over twelve; any other restoration takes the full membership fee."
      r_other_declines: "The loyalty restoration discount is 10 percent for a member who has held the membership for at least 18 whole months and has no declined scheduled renewal in the 12 months before the restoration other than the one being restored; it is 5 percent for a member who does not meet that tier but has held the membership for at least 6 whole months and has at most one such other declined scheduled renewal; it is nothing for anyone else."
      r_loyal: "The loyalty restoration discount is 10 percent for a member who has held the membership for at least 18 whole months and has no declined scheduled renewal in the 12 months before the restoration other than the one being restored; it is 5 percent for a member who does not meet that tier but has held the membership for at least 6 whole months and has at most one such other declined scheduled renewal; it is nothing for anyone else."
      r_trips: "The frequent-rider restoration discount counts the member's trips charged a fare in the last three months: 5 percent at 12 or more such trips, 2 percent at 6 to 11, nothing below 6."
      r_rider: "The frequent-rider restoration discount counts the member's trips charged a fare in the last three months: 5 percent at 12 or more such trips, 2 percent at 6 to 11, nothing below 6."
      r_credit_spent: "The credit-use restoration discount looks at the Pass ride credit the member spent on fares in the last six months: 3 percent at 8.00 or more, 1 percent at 4.00 or more but under 8.00, nothing under 4.00."
      r_credit_use: "The credit-use restoration discount looks at the Pass ride credit the member spent on fares in the last six months: 3 percent at 8.00 or more, 1 percent at 4.00 or more but under 8.00, nothing under 4.00."
      r_recovery_fee: "The payment recovery fee depends on the declined attempts recorded on the period's renewal: 1.00 at three or more attempts, 0.50 at exactly two, nothing at one."
      r_discount: "the loyalty restoration discount, the frequent-rider restoration discount and the credit-use restoration discount are then added into one discount rate, and that share is reduced once by the combined rate"
      result: "The restoration payment is worked out in this order: the restored-period share of the membership fee is taken first; the loyalty restoration discount, the frequent-rider restoration discount and the credit-use restoration discount are then added into one discount rate, and that share is reduced once by the combined rate; the payment recovery fee is added to the reduced amount; the total is rounded half up to the cent once, at the end."
    factors:
      - id: restored_period_share
        effect: method
        decides: r_share
        bindings: [r_period_days, r_days_left, r_months_left, r_share]
        ladder:
          - when: "a monthly plan whose period's renewal shows fewer declined attempts than the plan's payment retries plus one"
            method: "the membership fee is multiplied by the days from the restoration date through the period's last day, both counted, over the days in the period"
          - when: "an annual plan whose period's renewal shows fewer declined attempts than the plan's payment retries plus one"
            method: "the membership fee is multiplied by the whole calendar months of the period, counted from the period start's day of month, that begin after the restoration date, over twelve"
          - when: "otherwise"
            method: "the full membership fee is taken"
        baseline:
          r_share: "1"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: loyalty_restoration_discount
        effect: parameter
        decides: r_loyal
        bindings: [r_tenure, r_other_declines, r_loyal]
        ladder:
          - when: "membership held at least 18 whole months and no other declined scheduled renewal in the 12 months before the restoration"
            value: "K('loyal_disc_high') = 10 percent"
          - when: "not the first tier, membership held at least 6 whole months and at most one other declined scheduled renewal in those 12 months"
            value: "K('loyal_disc_low') = 5 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          r_loyal: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: frequent_rider_restoration_discount
        effect: parameter
        decides: r_rider
        bindings: [r_trips, r_rider]
        ladder:
          - when: "12 or more trips charged a fare in the last three months"
            value: "K('rider_disc_high') = 5 percent"
          - when: "6 to 11 such trips"
            value: "K('rider_disc_low') = 2 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          r_rider: "0"
        evidence: [cross_category, history]
        cross_difficulty: trip
      - id: credit_use_restoration_discount
        effect: parameter
        decides: r_credit_use
        bindings: [r_credit_spent, r_credit_use]
        ladder:
          - when: "Pass ride credit spent on fares in the last six months of 8.00 or more"
            value: "K('credit_disc_high') = 3 percent"
          - when: "4.00 or more but under 8.00"
            value: "K('credit_disc_low') = 1 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          r_credit_use: "0"
        evidence: [history]
        cross_difficulty: null
      - id: payment_recovery_fee
        effect: parameter
        decides: r_recovery_fee
        bindings: [r_attempts, r_recovery_fee]
        ladder:
          - when: "three or more declined attempts recorded on the period's renewal"
            value: "K('recovery_fee_high') = 1.00"
          - when: "exactly two declined attempts"
            value: "K('recovery_fee_low') = 0.50"
          - when: "otherwise"
            value: "0"
        baseline:
          r_recovery_fee: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The restoration payment is the plan's membership fee for the billing period in force.
        It is rounded half up to the cent.
      params: [membership_fee]
    inputs:
      history:
