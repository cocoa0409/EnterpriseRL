  # ---------------------------------------------------------------- task 1 (prerequisite problem)
  - id: pass_ext_trip_credit_posting
    base_policy_refs: [pass_evt_ride_credit, pass_trip_benefits]
    overwrite:
      - base_policy: pass_evt_ride_credit
        superseded_clause: >-
          Only trips in a ride option listed in the plan's ride_credit_eligible_options earn credit, reserved trips included; the eligible fare is the trip's fare charge less the ride option's booking fee (pass_msr_trip_eligible_fare), and wait time, tolls, airport fees, Priority Pickup, reservation fees and tips never count.
        replaced_by: >-
          Only trips in a ride option listed among the plan's credit-earning ride options earn credit, reserved trips included, and wait time, tolls, airport fees, Priority Pickup, reservation fees and tips never count.
      - base_policy: pass_evt_ride_credit
        superseded_clause: >-
          The credit is ride_credit_rate_pct of the eligible fare, rounded half up to the cent, capped at ride_credit_cap_per_trip and at what remains of ride_credit_monthly_cap for the calendar month of the drop-off (pass_msr_credit_earned_month); when the monthly cap is reached the trip earns nothing and nothing carries over.
        replaced_by: >-
          The trip ride credit is worked out in this order: the plan's credit rate and the frequent-rider points, the ride-option points, the Wayfare Pro driver points and the trip-type points are added into one credit rate; the eligible fare is multiplied by that rate and rounded half up to the cent; the result is capped at the plan's per-trip cap and at what remains of the plan's monthly cap, counted over the Pass ride credit posted to the membership after the same day of the previous month less the credit forfeited in that time; a trip whose eligible fare is under the plan's minimum eligible fare earns nothing; the late-posting goodwill is added to a credit above 0.00, and the total is rounded half up to the cent. For this monthly cap the rolling month above takes the place of the calendar month of the drop-off that the plan's credit-month basis sets for monthly credit caps: a credit is never held back by the credit already counted in the calendar month of its drop-off, and the calendar month of the drop-off recorded on each credit entry only shows when the trip was taken.
    trigger: state_due
    subject: [pass_credit_earn]
    computes: amount
    target_tool: post_pass_ride_credit_f79e4c68
    params:
      freq_postings_high: 12
      freq_postings_low: 6
      freq_tenure_high: 24
      freq_tenure_low: 12
      freq_points_high: 2
      freq_points_low: 1
      green_points: 2
      shared_points: 1
      pro_points_top: 2
      pro_points_mid: 1
      airport_points: 1
      reserved_points: 0.5
      goodwill_days_long: 5
      goodwill_days_short: 3
      goodwill_long: 1.00
      goodwill_short: 0.50
    rule: >-
      Pass ride credit owed on a completed trip is posted on the membership as a credit earn entry for that trip; a trip whose credit did not reach the membership within the posting delay is posted by the support desk on the same terms.
      Only trips in a ride option listed among the plan's credit-earning ride options earn credit, reserved trips included, and wait time, tolls, airport fees, Priority Pickup, reservation fees and tips never count.
      The trip ride credit is the plan's credit rate applied to the eligible fare, where the eligible fare is the trip's fare charge less the ride option's booking fee and never below 0.00.
      It is rounded half up to the cent, capped at the plan's per-trip cap and at what remains of the plan's monthly cap, counted over the Pass ride credit posted to the membership after the same day of the previous month less the credit forfeited in that time, and a trip whose eligible fare is under the plan's minimum eligible fare earns nothing.
      The frequent-rider points depend on the member's credit history and tenure: 2 percentage points for a member with at least 12 credit earn entries posted in the last three months and at least 24 whole months of membership; 1 percentage point for a member who does not meet that tier but has at least 6 such entries and at least 12 whole months; nothing for anyone else.
      The ride-option points are 2 percentage points for a Wayfare Green trip, 1 percentage point for a Wayfare Shared trip and nothing for any other ride option.
      The Wayfare Pro driver points follow the Wayfare Pro status on the member's own driver earnings account: 2 percentage points at Wayfare Pro Platinum, Diamond or Diamond Elite, 1 percentage point at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account.
      The trip-type points are 1 percentage point for a trip that picked up or dropped off at an airport, 0.5 percentage point for a reserved trip that touched no airport, and nothing for any other trip.
      The eligible-fare basis depends on how the fare was set: where the rider changed the route and the fare charge was recalculated to more than the upfront fare less the member discount recorded on it, the eligible fare is the upfront fare less the ride option's booking fee and less that member discount; where a fare adjustment has been booked against the fare charge, the eligible fare is the fare charge net of those adjustments less the booking fee; otherwise it is the fare charge less the booking fee; in every case never below 0.00.
      The late-posting goodwill rewards the wait for credit that was due 48 hours after drop-off: 1.00 when the posting is made 5 or more calendar days after the drop-off date, 0.50 when it is made 3 or 4 days after, nothing when it is made sooner.
      The trip ride credit is worked out in this order: the plan's credit rate and the frequent-rider points, the ride-option points, the Wayfare Pro driver points and the trip-type points are added into one credit rate; the eligible fare is multiplied by that rate and rounded half up to the cent; the result is capped at the plan's per-trip cap and at what remains of the plan's monthly cap, counted over the Pass ride credit posted to the membership after the same day of the previous month less the credit forfeited in that time; a trip whose eligible fare is under the plan's minimum eligible fare earns nothing; the late-posting goodwill is added to a credit above 0.00, and the total is rounded half up to the cent.
      For this monthly cap the rolling month above takes the place of the calendar month of the drop-off that the plan's credit-month basis sets for monthly credit caps: a credit is never held back by the credit already counted in the calendar month of its drop-off, and the calendar month of the drop-off recorded on each credit entry only shows when the trip was taken.
    prerequisite: []
    cross_category:
      - category: trip
        as: history
        reads: [trip_charges.trip_id, trip_charges.amount, trip_charges.fare_basis, trip_charges.member_discount_amount, trip_charges.event_type, trips.variant_name, trips.upfront_fare, trips.airport_leg, trips.booking_mode, trips.dropoff_at]
        note: The trip, its ride option, fare figures, airport leg, booking mode and drop-off date come from the trip product's records and set the eligible-fare basis, ride-option, trip-type and goodwill tiers.
      - category: earnings
        as: branch
        reads: [variant_name]
        note: The Wayfare Pro status on the member's own driver earnings account sets the Wayfare Pro driver points.
    compute:
      - e_trip: "XLATEST('trip', 'trip_charges', 'trip_id', date_field='charged_at', event_type='trip_fare_charge')"
      - e_fare_id: "XLATEST('trip', 'trip_charges', 'trip_charge_id', date_field='charged_at', event_type='trip_fare_charge', trip_id=e_trip)"
      - e_fare: "XLATEST('trip', 'trip_charges', 'amount', date_field='charged_at', event_type='trip_fare_charge', trip_id=e_trip)"
      - e_booking_fee: "CPARAM('trip', 'booking_fee', trip_id=e_trip)"
      - e_fare_basis: "XLATEST('trip', 'trip_charges', 'fare_basis', date_field='charged_at', event_type='trip_fare_charge', trip_id=e_trip)"
      - e_discount: "XLATEST('trip', 'trip_charges', 'member_discount_amount', date_field='charged_at', event_type='trip_fare_charge', trip_id=e_trip)"
      - e_upfront: "CFIELD('trip', 'upfront_fare', trip_id=e_trip)"
      - e_route_changed: "CFIELD('trip', 'rider_changed_route', trip_id=e_trip)"
      - e_adjusted: "XSUM('trip', 'trip_charges', 'amount', event_type='trip_fare_adjustment', original_charge_id=e_fare_id)"
      - e_eligible_fare: "MX(0, e_upfront - e_booking_fee - e_discount) if e_route_changed == True and e_fare_basis == 'recalculated' and e_fare > e_upfront - e_discount else (MX(0, e_fare + e_adjusted - e_booking_fee) if e_adjusted < 0 else MX(0, e_fare - e_booking_fee))"
      - e_postings: "COUNT('pass_events', within_months=3, event_type='pass_credit_earn')"
      - e_tenure: "MONTHS(F('enrolled_date'), NOW)"
      - e_freq_points: "K('freq_points_high') if e_postings >= K('freq_postings_high') and e_tenure >= K('freq_tenure_high') else (K('freq_points_low') if e_postings >= K('freq_postings_low') and e_tenure >= K('freq_tenure_low') else 0)"
      - e_option: "CFIELD('trip', 'variant_name', trip_id=e_trip)"
      - e_option_points: "K('green_points') if e_option == 'Wayfare Green' else (K('shared_points') if e_option == 'Wayfare Shared' else 0)"
      - e_pro_status: "CFIELD('earnings', 'variant_name')"
      - e_pro_points: "K('pro_points_top') if e_pro_status == 'Wayfare Pro Platinum' or e_pro_status == 'Wayfare Pro Diamond' or e_pro_status == 'Wayfare Pro Diamond Elite' else (K('pro_points_mid') if e_pro_status == 'Wayfare Pro Gold' or e_pro_status == 'Wayfare Pro Silver' else 0)"
      - e_airport_leg: "CFIELD('trip', 'airport_leg', trip_id=e_trip)"
      - e_booking_mode: "CFIELD('trip', 'booking_mode', trip_id=e_trip)"
      - e_trip_points: "K('airport_points') if e_airport_leg != 'none' else (K('reserved_points') if e_booking_mode == 'reserved' else 0)"
      - e_rate: "P('ride_credit_rate_pct') + e_freq_points + e_option_points + e_pro_points + e_trip_points"
      - e_raw: "RND(e_eligible_fare * e_rate / 100, 2)"
      - e_month_earned: "SUM('pass_events', 'amount', within_months=1, event_type='pass_credit_earn') + SUM('pass_events', 'amount', within_months=1, event_type='pass_credit_forfeit')"
      - e_room: "MX(0, P('ride_credit_monthly_cap') - e_month_earned)"
      - e_capped: "MN(e_raw, P('ride_credit_cap_per_trip'), e_room)"
      - e_earned: "e_capped if e_option in P('ride_credit_eligible_options') and e_eligible_fare >= P('ride_credit_min_eligible_fare') else 0"
      - e_days_late: "DAYS(CFIELD('trip', 'dropoff_at', trip_id=e_trip), NOW)"
      - e_goodwill: "K('goodwill_long') if e_days_late >= K('goodwill_days_long') else (K('goodwill_short') if e_days_late >= K('goodwill_days_short') else 0)"
      - result: "RND(e_earned + (e_goodwill if e_earned > 0 else 0), 2)"
    compute_basis:
      e_trip: "Pass ride credit owed on a completed trip is posted on the membership as a credit earn entry for that trip"
      e_fare_id: "where a fare adjustment has been booked against the fare charge"
      e_fare: "the eligible fare is the trip's fare charge less the ride option's booking fee and never below 0.00"
      e_booking_fee: "the eligible fare is the trip's fare charge less the ride option's booking fee and never below 0.00"
      e_fare_basis: "where the rider changed the route and the fare charge was recalculated to more than the upfront fare less the member discount recorded on it"
      e_discount: "less that member discount"
      e_upfront: "the eligible fare is the upfront fare less the ride option's booking fee and less that member discount"
      e_route_changed: "where the rider changed the route"
      e_adjusted: "where a fare adjustment has been booked against the fare charge, the eligible fare is the fare charge net of those adjustments less the booking fee"
      e_eligible_fare: "The eligible-fare basis depends on how the fare was set: where the rider changed the route and the fare charge was recalculated to more than the upfront fare less the member discount recorded on it, the eligible fare is the upfront fare less the ride option's booking fee and less that member discount; where a fare adjustment has been booked against the fare charge, the eligible fare is the fare charge net of those adjustments less the booking fee; otherwise it is the fare charge less the booking fee; in every case never below 0.00."
      e_postings: "at least 12 credit earn entries posted in the last three months"
      e_tenure: "at least 24 whole months of membership"
      e_freq_points: "The frequent-rider points depend on the member's credit history and tenure: 2 percentage points for a member with at least 12 credit earn entries posted in the last three months and at least 24 whole months of membership; 1 percentage point for a member who does not meet that tier but has at least 6 such entries and at least 12 whole months; nothing for anyone else."
      e_option: "The ride-option points are 2 percentage points for a Wayfare Green trip, 1 percentage point for a Wayfare Shared trip and nothing for any other ride option."
      e_option_points: "The ride-option points are 2 percentage points for a Wayfare Green trip, 1 percentage point for a Wayfare Shared trip and nothing for any other ride option."
      e_pro_status: "The Wayfare Pro driver points follow the Wayfare Pro status on the member's own driver earnings account"
      e_pro_points: "The Wayfare Pro driver points follow the Wayfare Pro status on the member's own driver earnings account: 2 percentage points at Wayfare Pro Platinum, Diamond or Diamond Elite, 1 percentage point at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account."
      e_airport_leg: "1 percentage point for a trip that picked up or dropped off at an airport"
      e_booking_mode: "0.5 percentage point for a reserved trip that touched no airport"
      e_trip_points: "The trip-type points are 1 percentage point for a trip that picked up or dropped off at an airport, 0.5 percentage point for a reserved trip that touched no airport, and nothing for any other trip."
      e_rate: "the plan's credit rate and the frequent-rider points, the ride-option points, the Wayfare Pro driver points and the trip-type points are added into one credit rate"
      e_raw: "the eligible fare is multiplied by that rate and rounded half up to the cent"
      e_month_earned: "For this monthly cap the rolling month above takes the place of the calendar month of the drop-off that the plan's credit-month basis sets for monthly credit caps: a credit is never held back by the credit already counted in the calendar month of its drop-off"
      e_room: "at what remains of the plan's monthly cap, counted over the Pass ride credit posted to the membership after the same day of the previous month less the credit forfeited in that time"
      e_capped: "the result is capped at the plan's per-trip cap and at what remains of the plan's monthly cap"
      e_earned: "Only trips in a ride option listed among the plan's credit-earning ride options earn credit, reserved trips included, and wait time, tolls, airport fees, Priority Pickup, reservation fees and tips never count."
      e_days_late: "1.00 when the posting is made 5 or more calendar days after the drop-off date, 0.50 when it is made 3 or 4 days after, nothing when it is made sooner"
      e_goodwill: "The late-posting goodwill rewards the wait for credit that was due 48 hours after drop-off: 1.00 when the posting is made 5 or more calendar days after the drop-off date, 0.50 when it is made 3 or 4 days after, nothing when it is made sooner."
      result: "the late-posting goodwill is added to a credit above 0.00, and the total is rounded half up to the cent"
    factors:
      - id: frequent_rider_points
        effect: parameter
        decides: e_freq_points
        bindings: [e_postings, e_tenure, e_freq_points]
        ladder:
          - when: "at least 12 credit earn entries posted in the last three months and at least 24 whole months of membership"
            value: "K('freq_points_high') = 2 percentage points"
          - when: "not the first tier, at least 6 such entries and at least 12 whole months"
            value: "K('freq_points_low') = 1 percentage point"
          - when: "otherwise"
            value: "0"
        baseline:
          e_freq_points: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: ride_option_points
        effect: parameter
        decides: e_option_points
        bindings: [e_option, e_option_points]
        ladder:
          - when: "the trip was a Wayfare Green trip"
            value: "K('green_points') = 2 percentage points"
          - when: "the trip was a Wayfare Shared trip"
            value: "K('shared_points') = 1 percentage point"
          - when: "otherwise"
            value: "0"
        baseline:
          e_option_points: "0"
        evidence: [cross_category]
        cross_difficulty: trip
      - id: eligible_fare_basis
        effect: method
        decides: e_eligible_fare
        bindings: [e_fare_id, e_fare_basis, e_discount, e_upfront, e_route_changed, e_adjusted, e_eligible_fare]
        ladder:
          - when: "the rider changed the route and the fare charge was recalculated to more than the upfront fare less its member discount"
            method: "eligible fare = upfront fare less the booking fee less the member discount on the fare charge"
          - when: "not the first tier, and a fare adjustment has been booked against the fare charge"
            method: "eligible fare = fare charge net of the adjustments less the booking fee"
          - when: "otherwise"
            method: "eligible fare = fare charge less the booking fee"
        baseline:
          e_eligible_fare: "MX(0, e_fare - e_booking_fee)"
        evidence: [cross_category]
        cross_difficulty: trip
      - id: late_posting_goodwill
        effect: parameter
        decides: e_goodwill
        bindings: [e_days_late, e_goodwill]
        ladder:
          - when: "posting made 5 or more calendar days after the drop-off date"
            value: "K('goodwill_long') = 1.00"
          - when: "posting made 3 or 4 days after"
            value: "K('goodwill_short') = 0.50"
          - when: "otherwise"
            value: "0"
        baseline:
          e_goodwill: "0"
        evidence: [date, cross_category]
        cross_difficulty: trip
      - id: pro_driver_points
        effect: parameter
        decides: e_pro_points
        bindings: [e_pro_status, e_pro_points]
        ladder:
          - when: "Wayfare Pro Platinum, Diamond or Diamond Elite on the member's own earnings account"
            value: "K('pro_points_top') = 2 percentage points"
          - when: "Wayfare Pro Gold or Silver"
            value: "K('pro_points_mid') = 1 percentage point"
          - when: "otherwise (Wayfare Pro Blue or no earnings account)"
            value: "0"
        baseline:
          e_pro_points: "0"
        evidence: [cross_category]
        cross_difficulty: earnings
      - id: trip_type_points
        effect: parameter
        decides: e_trip_points
        bindings: [e_airport_leg, e_booking_mode, e_trip_points]
        ladder:
          - when: "the trip picked up or dropped off at an airport"
            value: "K('airport_points') = 1 percentage point"
          - when: "a reserved trip that touched no airport"
            value: "K('reserved_points') = 0.5 percentage point"
          - when: "otherwise"
            value: "0"
        baseline:
          e_trip_points: "0"
        evidence: [cross_category]
        cross_difficulty: trip
    baseline:
      rule: >-
        The trip ride credit is the plan's credit rate applied to the eligible fare, where the eligible fare is the trip's fare charge less the ride option's booking fee and never below 0.00.
        It is rounded half up to the cent, capped at the plan's per-trip cap and at what remains of the plan's monthly cap, counted over the Pass ride credit posted to the membership after the same day of the previous month less the credit forfeited in that time, and a trip whose eligible fare is under the plan's minimum eligible fare earns nothing.
      params: [ride_credit_rate_pct, ride_credit_cap_per_trip, ride_credit_monthly_cap, ride_credit_min_eligible_fare]
    inputs:
      history:
        - {table: pass_events, aggregate: count, field: pass_event_id, within_months: 3, filters: {event_type: pass_credit_earn}}
        - {table: pass_events, aggregate: sum, field: amount, filters: {event_type: pass_credit_earn}}
        - {category: trip, table: trip_charges, aggregate: latest, field: trip_id, filters: {event_type: trip_fare_charge}}
      cross_category: [trip, earnings]
  # ---------------------------------------------------------------- task 1 (prerequisite problem)
  - id: pass_ext_refunded_fare_credit_forfeit
    base_policy_refs: [pass_evt_credit_redeem_forfeit]
    overwrite:
      - base_policy: pass_evt_credit_redeem_forfeit
        superseded_clause: >-
          Partial fare adjustments do not change credit already earned.
        replaced_by: >-
          The clawed-back credit depends on what the adjustments left of the fare: where they took back less than a tenth of the eligible fare (the fare charge less the booking fee) and left the fare charge net of its adjustments, less the ride option's booking fee, at or above the plan's minimum eligible fare, nothing is clawed back; where they took back at least a tenth of the eligible fare and left it at or above that minimum, the credit earned on the trip is multiplied by the amount taken back over the eligible fare and rounded half up to the cent; where they left it under that minimum, the whole credit earned on the trip is clawed back.
    trigger: state_due
    subject: [pass_credit_forfeit]
    computes: amount
    target_tool: forfeit_pass_ride_credit_4b5902d4
    params:
      pro_rata_min_share: 0.10
      loyal_tenure_high: 24
      loyal_tenure_low: 12
      loyal_relief_high: 0.50
      loyal_relief_low: 0.25
      timing_days_long: 7
      timing_days_short: 3
      timing_relief_long: 0.25
      timing_relief_short: 0.10
      pro_relief_top: 0.20
      pro_relief_mid: 0.10
      rider_trips_high: 20
      rider_trips_low: 10
      rider_relief_high: 0.15
      rider_relief_low: 0.05
    rule: >-
      When a fare that earned Pass ride credit is later reduced by a fare adjustment, the credit correction owed is booked as a credit forfeiture of the trip-refund kind that names the credit earn entry it corrects.
      When fare adjustments reduce a fare that earned Pass ride credit, the clawed-back credit is the whole credit earned on the trip, and the credit correction is that clawed-back credit.
      The credit correction is limited to the credit balance the member holds and is never below 0.00.
      The clawed-back credit depends on what the adjustments left of the fare: where they took back less than a tenth of the eligible fare (the fare charge less the booking fee) and left the fare charge net of its adjustments, less the ride option's booking fee, at or above the plan's minimum eligible fare, nothing is clawed back; where they took back at least a tenth of the eligible fare and left it at or above that minimum, the credit earned on the trip is multiplied by the amount taken back over the eligible fare and rounded half up to the cent; where they left it under that minimum, the whole credit earned on the trip is clawed back.
      The loyalty correction relief is 50 percent for a member who has held the membership for at least 24 whole months and has had no credit correction or forfeiture on a trip in the last 12 months; it is 25 percent for a member who does not meet that tier but has held the membership for at least 12 whole months and has had at most one such entry in the last 12 months; it is nothing for anyone else.
      The correction-timing relief follows the calendar days from the fare charge date to the fare adjustment date: 25 percent at 7 days or more, 10 percent at 3 to 6 days, nothing under 3 days.
      The Wayfare Pro correction relief follows the Wayfare Pro status on the member's own driver earnings account: 20 percent at Wayfare Pro Platinum, Diamond or Diamond Elite, 10 percent at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account.
      The frequent-rider correction relief counts the member's trips charged a fare in the last three months: 15 percent at 20 or more, 5 percent at 10 to 19, nothing below 10.
      The credit correction is worked out in this order: the clawed-back credit is set by what the adjustments left of the fare; the loyalty correction relief, the correction-timing relief, the Wayfare Pro correction relief and the frequent-rider correction relief are added into one relief share, capped at the whole; the clawed-back credit is reduced once by that combined share and rounded half up to the cent; the result is limited to the credit balance the member holds and is never below 0.00.
    prerequisite: []
    cross_category:
      - category: trip
        as: history
        reads: [trip_charges.trip_id, trip_charges.trip_charge_id, trip_charges.amount, trip_charges.charge_date, trip_charges.original_charge_id, trip_charges.event_type]
        note: The adjusted fare, the amount the adjustments took back, the fare and adjustment dates and the member's fare charges over three months come from the trip ledger and set the clawback, timing and frequent-rider tiers.
      - category: earnings
        as: branch
        reads: [variant_name]
        note: The Wayfare Pro status on the member's own earnings account sets the Wayfare Pro correction relief.
    compute:
      - f_trip: "XLATEST('trip', 'trip_charges', 'trip_id', date_field='charged_at', event_type='trip_fare_adjustment')"
      - f_earned: "LATEST('pass_events', 'amount', event_type='pass_credit_earn', trip_id=f_trip)"
      - f_fare_id: "XLATEST('trip', 'trip_charges', 'trip_charge_id', date_field='charged_at', event_type='trip_fare_charge', trip_id=f_trip)"
      - f_fare: "XLATEST('trip', 'trip_charges', 'amount', date_field='charged_at', event_type='trip_fare_charge', trip_id=f_trip)"
      - f_booking_fee: "CPARAM('trip', 'booking_fee', trip_id=f_trip)"
      - f_eligible: "MX(0, f_fare - f_booking_fee)"
      - f_taken: "0 - XSUM('trip', 'trip_charges', 'amount', event_type='trip_fare_adjustment', original_charge_id=f_fare_id)"
      - f_clawback: "(0 if f_taken < f_eligible * K('pro_rata_min_share') else RND(f_earned * f_taken / f_eligible, 2)) if f_eligible - f_taken >= P('ride_credit_min_eligible_fare') else f_earned"
      - f_tenure: "MONTHS(F('enrolled_date'), NOW)"
      - f_prior: "COUNT('pass_events', within_months=12, event_type='pass_credit_forfeit', forfeit_reason='trip_refunded')"
      - f_loyal: "K('loyal_relief_high') if f_tenure >= K('loyal_tenure_high') and f_prior == 0 else (K('loyal_relief_low') if f_tenure >= K('loyal_tenure_low') and f_prior <= 1 else 0)"
      - f_fare_date: "XLATEST('trip', 'trip_charges', 'charge_date', date_field='charged_at', event_type='trip_fare_charge', trip_id=f_trip)"
      - f_adjust_date: "XLATEST('trip', 'trip_charges', 'charge_date', date_field='charged_at', event_type='trip_fare_adjustment', trip_id=f_trip)"
      - f_days: "DAYS(f_fare_date, f_adjust_date)"
      - f_timing: "K('timing_relief_long') if f_days >= K('timing_days_long') else (K('timing_relief_short') if f_days >= K('timing_days_short') else 0)"
      - f_pro_status: "CFIELD('earnings', 'variant_name')"
      - f_pro_relief: "K('pro_relief_top') if f_pro_status == 'Wayfare Pro Platinum' or f_pro_status == 'Wayfare Pro Diamond' or f_pro_status == 'Wayfare Pro Diamond Elite' else (K('pro_relief_mid') if f_pro_status == 'Wayfare Pro Gold' or f_pro_status == 'Wayfare Pro Silver' else 0)"
      - f_trips: "XCOUNT('trip', 'trip_charges', within_months=3, date_field='charge_date', event_type='trip_fare_charge')"
      - f_rider_relief: "K('rider_relief_high') if f_trips >= K('rider_trips_high') else (K('rider_relief_low') if f_trips >= K('rider_trips_low') else 0)"
      - f_relief: "MN(1, f_loyal + f_timing + f_pro_relief + f_rider_relief)"
      - f_reduced: "RND(f_clawback * (1 - f_relief), 2)"
      - result: "MX(0, MN(f_reduced, F('member_credit_balance')))"
    compute_basis:
      f_trip: "When a fare that earned Pass ride credit is later reduced by a fare adjustment, the credit correction owed is booked as a credit forfeiture of the trip-refund kind that names the credit earn entry it corrects."
      f_earned: "the whole credit earned on the trip is clawed back"
      f_fare_id: "the fare charge net of its adjustments"
      f_fare: "the eligible fare (the fare charge less the booking fee)"
      f_booking_fee: "less the ride option's booking fee"
      f_eligible: "the eligible fare (the fare charge less the booking fee)"
      f_taken: "the credit earned on the trip is multiplied by the amount taken back over the eligible fare"
      f_clawback: "The clawed-back credit depends on what the adjustments left of the fare: where they took back less than a tenth of the eligible fare (the fare charge less the booking fee) and left the fare charge net of its adjustments, less the ride option's booking fee, at or above the plan's minimum eligible fare, nothing is clawed back; where they took back at least a tenth of the eligible fare and left it at or above that minimum, the credit earned on the trip is multiplied by the amount taken back over the eligible fare and rounded half up to the cent; where they left it under that minimum, the whole credit earned on the trip is clawed back."
      f_tenure: "has held the membership for at least 24 whole months"
      f_prior: "has had no credit correction or forfeiture on a trip in the last 12 months"
      f_loyal: "The loyalty correction relief is 50 percent for a member who has held the membership for at least 24 whole months and has had no credit correction or forfeiture on a trip in the last 12 months; it is 25 percent for a member who does not meet that tier but has held the membership for at least 12 whole months and has had at most one such entry in the last 12 months; it is nothing for anyone else."
      f_fare_date: "the calendar days from the fare charge date to the fare adjustment date"
      f_adjust_date: "the calendar days from the fare charge date to the fare adjustment date"
      f_days: "the calendar days from the fare charge date to the fare adjustment date"
      f_timing: "The correction-timing relief follows the calendar days from the fare charge date to the fare adjustment date: 25 percent at 7 days or more, 10 percent at 3 to 6 days, nothing under 3 days."
      f_pro_status: "The Wayfare Pro correction relief follows the Wayfare Pro status on the member's own driver earnings account"
      f_pro_relief: "The Wayfare Pro correction relief follows the Wayfare Pro status on the member's own driver earnings account: 20 percent at Wayfare Pro Platinum, Diamond or Diamond Elite, 10 percent at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account."
      f_trips: "The frequent-rider correction relief counts the member's trips charged a fare in the last three months: 15 percent at 20 or more, 5 percent at 10 to 19, nothing below 10."
      f_rider_relief: "The frequent-rider correction relief counts the member's trips charged a fare in the last three months: 15 percent at 20 or more, 5 percent at 10 to 19, nothing below 10."
      f_relief: "the loyalty correction relief, the correction-timing relief, the Wayfare Pro correction relief and the frequent-rider correction relief are added into one relief share, capped at the whole"
      f_reduced: "the clawed-back credit is reduced once by that combined share and rounded half up to the cent"
      result: "the result is limited to the credit balance the member holds and is never below 0.00"
    factors:
      - id: adjustment_clawback
        effect: method
        decides: f_clawback
        bindings: [f_fare_id, f_fare, f_booking_fee, f_eligible, f_taken, f_clawback]
        ladder:
          - when: "the adjustments took back less than a tenth of the eligible fare and left it at or above the plan's minimum eligible fare"
            method: "nothing is clawed back"
          - when: "the adjustments took back at least a tenth of the eligible fare and left it at or above the minimum"
            method: "the credit earned on the trip times the amount taken back over the eligible fare, rounded half up to the cent"
          - when: "otherwise (the fare charge net of its adjustments, less the booking fee, is under the minimum)"
            method: "the whole credit earned on the trip is clawed back"
        baseline:
          f_clawback: "f_earned"
        evidence: [cross_category, history]
        cross_difficulty: trip
      - id: loyalty_correction_relief
        effect: parameter
        decides: f_loyal
        bindings: [f_tenure, f_prior, f_loyal]
        ladder:
          - when: "membership held at least 24 whole months and no credit correction or forfeiture on a trip in the last 12 months"
            value: "K('loyal_relief_high') = 50 percent"
          - when: "not the first tier, held at least 12 whole months and at most one such entry in the last 12 months"
            value: "K('loyal_relief_low') = 25 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          f_loyal: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: correction_timing_relief
        effect: parameter
        decides: f_timing
        bindings: [f_fare_date, f_adjust_date, f_days, f_timing]
        ladder:
          - when: "the fare adjustment was booked 7 or more calendar days after the fare charge"
            value: "K('timing_relief_long') = 25 percent"
          - when: "3 to 6 days after"
            value: "K('timing_relief_short') = 10 percent"
          - when: "otherwise (under 3 days)"
            value: "0"
        baseline:
          f_timing: "0"
        evidence: [cross_category, date]
        cross_difficulty: trip
      - id: pro_correction_relief
        effect: parameter
        decides: f_pro_relief
        bindings: [f_pro_status, f_pro_relief]
        ladder:
          - when: "Wayfare Pro Platinum, Diamond or Diamond Elite on the member's own earnings account"
            value: "K('pro_relief_top') = 20 percent"
          - when: "Wayfare Pro Gold or Silver"
            value: "K('pro_relief_mid') = 10 percent"
          - when: "otherwise (Wayfare Pro Blue or no earnings account)"
            value: "0"
        baseline:
          f_pro_relief: "0"
        evidence: [cross_category]
        cross_difficulty: earnings
      - id: frequent_rider_correction_relief
        effect: parameter
        decides: f_rider_relief
        bindings: [f_trips, f_rider_relief]
        ladder:
          - when: "20 or more trips charged a fare in the last three months"
            value: "K('rider_relief_high') = 15 percent"
          - when: "10 to 19 such trips"
            value: "K('rider_relief_low') = 5 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          f_rider_relief: "0"
        evidence: [cross_category]
        cross_difficulty: trip
    baseline:
      rule: >-
        When fare adjustments reduce a fare that earned Pass ride credit, the clawed-back credit is the whole credit earned on the trip, and the credit correction is that clawed-back credit.
        The credit correction is limited to the credit balance the member holds and is never below 0.00.
      params: []
    inputs:
      history:
        - {table: pass_events, aggregate: latest, field: amount, filters: {event_type: pass_credit_earn}}
        - {table: pass_events, aggregate: count, field: pass_event_id, within_months: 12, filters: {event_type: pass_credit_forfeit, forfeit_reason: trip_refunded}}
        - {category: trip, table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_fare_adjustment}}
      cross_category: [trip, earnings]
  # ---------------------------------------------------------------- task 1 (prerequisite problem)
  - id: pass_ext_upgrade_window_refund
    base_policy_refs: [pass_cancellation_and_refund]
    overwrite:
      - base_policy: pass_cancellation_and_refund
        superseded_clause: >-
          A fee charge is refunded in full only when the member ends the membership within the full refund window: The full refund window is counted in calendar days from the event_date of the fee charge: day 1 is the calendar day after the charge, and the membership must be ended no later than the last day of the window.
        replaced_by: >-
          A period fee is refunded under the full refund window when, no later than the last day of the plan's full refund window, the member ends the membership at once or moves up to the Wayfare Pass All Access Annual plan; the window is counted in calendar days from the event date of the fee charge, day 1 being the calendar day after the charge.
      - base_policy: pass_cancellation_and_refund
        superseded_clause: >-
          The full refund also requires that no benefit was used since that charge (pass_msr_benefit_uses_since_charge is 0).
        replaced_by: >-
          The benefit deduction is worked out in this order: the netted benefit is multiplied by the netting share and rounded half up to the cent; the Pass waiver charge is added; the Wayfare Pro refund relief and the frequent-rider refund relief are then subtracted; the deduction is never below 0.00; the window refund is the period fee less that deduction, rounded half up to the cent.
    trigger: on_request
    subject: [pass_fee_refund]
    computes: amount
    target_tool: refund_pass_period_fee_d96d0945
    params:
      share_tenure_high: 24
      share_tenure_low: 12
      share_high: 0.50
      share_low: 0.75
      pro_relief_top: 5.00
      pro_relief_mid: 2.50
      rider_trips_high: 20
      rider_trips_low: 10
      rider_relief_high: 3.00
      rider_relief_low: 1.50
      waiver_value_plus: 3.75
      waiver_value_core: 2.50
    rule: >-
      A period fee is refunded under the full refund window when, no later than the last day of the plan's full refund window, the member ends the membership at once or moves up to the Wayfare Pass All Access Annual plan; the window is counted in calendar days from the event date of the fee charge, day 1 being the calendar day after the charge.
      The window refund is booked against the fee charge that paid the period in force and names that charge.
      The window refund is fixed only after every eligible trip completed in that period whose credit has fallen due carries its ride credit entry.
      The window refund is not worked out before every fare of that period reduced by a fare adjustment carries the credit correction owed on it.
      The window refund returns the period fee in full.
      The benefit netting depends on the plan: on an annual plan the netted benefit is the Pass ride credit earned on trips completed in the period in force, less the credit forfeited or corrected on trips of that period; on a monthly plan on which Pass ride credit was spent on fares in the period, the netted benefit is the credit spent in the period; otherwise nothing is netted.
      The netting share depends on the member's standing: 50 percent of the netted benefit for a member who has held the membership for at least 24 whole months and has never had a membership fee refunded before; 75 percent for a member who does not meet that tier but has held it for at least 12 whole months and has had at most one earlier fee refund; the whole netted benefit for anyone else.
      The Pass waiver charge counts the Pass fee waivers recorded on the member's trips in the last month and values each at 3.75 on the Plus Monthly, Plus Annual and All Access Annual plans and at 2.50 on the Monthly and Annual plans; waivers on the Student plan are not counted.
      The Wayfare Pro refund relief follows the Wayfare Pro status on the member's own driver earnings account: 5.00 at Wayfare Pro Platinum, Diamond or Diamond Elite, 2.50 at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account.
      The frequent-rider refund relief counts the member's trips charged a fare in the last three months: 3.00 at 20 or more, 1.50 at 10 to 19, nothing below 10.
      The benefit deduction is worked out in this order: the netted benefit is multiplied by the netting share and rounded half up to the cent; the Pass waiver charge is added; the Wayfare Pro refund relief and the frequent-rider refund relief are then subtracted; the deduction is never below 0.00; the window refund is the period fee less that deduction, rounded half up to the cent.
    prerequisite:
      - problem: pass_ext_trip_credit_posting
        kind: value_input
        gate: w_credit_period
        form: state
        policy_source: >-
          The window refund is fixed only after every eligible trip completed in that period whose credit has fallen due carries its ride credit entry.
        condition: >-
          Every completed trip of the member in a credit-earning ride option whose drop-off falls in the billing period in force and whose credit has fallen due (48 hours after drop-off) has a credit earn entry on the membership ledger for that trip.
        resolved_by: post_pass_ride_credit_f79e4c68
        effect: >-
          The Pass ride credit earned on trips of the period rises by the credit posted for the trip that had none, so the netted benefit and the benefit deduction rise and the window refund falls.
      - problem: pass_ext_refunded_fare_credit_forfeit
        kind: value_input
        gate: w_credit_period
        form: state
        policy_source: >-
          The window refund is not worked out before every fare of that period reduced by a fare adjustment carries the credit correction owed on it.
        condition: >-
          Every trip of the period whose fare charge carries a fare adjustment for which a credit correction is owed (the adjustments took back at least a tenth of the eligible fare, or left it under the plan's minimum eligible fare) has a credit forfeiture entry of the trip-refund kind naming that trip's credit earn entry.
        resolved_by: forfeit_pass_ride_credit_4b5902d4
        effect: >-
          The credit taken back on trips of the period rises by the credit correction booked, so the netted benefit and the benefit deduction fall and the window refund rises.
    cross_category:
      - category: trip
        as: history
        reads: [trip_charges.event_type, trip_charges.charge_date, trip_charges.pass_membership_id]
        note: The member's fare charges over three months set the frequent-rider refund relief and the Pass fee waivers of the last month set the Pass waiver charge.
      - category: earnings
        as: branch
        reads: [variant_name]
        note: The Wayfare Pro status on the member's own earnings account sets the Wayfare Pro refund relief.
    compute:
      - w_fee: "LATEST('pass_events', 'amount', event_type='pass_fee_charge', billing_period_start=F('current_period_start'))"
      - w_credit_period: "SUM('pass_events', 'amount', event_type='pass_credit_earn', billing_period_start=F('current_period_start')) + SUM('pass_events', 'amount', event_type='pass_credit_forfeit', forfeit_reason='trip_refunded', billing_period_start=F('current_period_start'))"
      - w_spent_period: "0 - SUM('pass_events', 'amount', event_type='pass_credit_redeem', billing_period_start=F('current_period_start'))"
      - w_netted: "w_credit_period if P('billing_period_months') == 12 else (w_spent_period if w_spent_period > 0 else 0)"
      - w_tenure: "MONTHS(F('enrolled_date'), NOW)"
      - w_prior_refunds: "COUNT('pass_events', event_type='pass_fee_refund')"
      - w_share: "K('share_high') if w_tenure >= K('share_tenure_high') and w_prior_refunds == 0 else (K('share_low') if w_tenure >= K('share_tenure_low') and w_prior_refunds <= 1 else 1)"
      - w_waivers: "XCOUNT('trip', 'trip_charges', within_months=1, date_field='charge_date', event_type='trip_fee_waiver', pass_membership_id=HID)"
      - w_waiver_value: "K('waiver_value_plus') if F('variant_name') == 'Wayfare Pass Plus Monthly' or F('variant_name') == 'Wayfare Pass Plus Annual' or F('variant_name') == 'Wayfare Pass All Access Annual' else (K('waiver_value_core') if F('variant_name') == 'Wayfare Pass Monthly' or F('variant_name') == 'Wayfare Pass Annual' else 0)"
      - w_pro_status: "CFIELD('earnings', 'variant_name')"
      - w_pro_relief: "K('pro_relief_top') if w_pro_status == 'Wayfare Pro Platinum' or w_pro_status == 'Wayfare Pro Diamond' or w_pro_status == 'Wayfare Pro Diamond Elite' else (K('pro_relief_mid') if w_pro_status == 'Wayfare Pro Gold' or w_pro_status == 'Wayfare Pro Silver' else 0)"
      - w_trips: "XCOUNT('trip', 'trip_charges', within_months=3, date_field='charge_date', event_type='trip_fare_charge')"
      - w_rider_relief: "K('rider_relief_high') if w_trips >= K('rider_trips_high') else (K('rider_relief_low') if w_trips >= K('rider_trips_low') else 0)"
      - w_deduction: "MX(0, RND(w_netted * w_share, 2) + w_waivers * w_waiver_value - w_pro_relief - w_rider_relief)"
      - result: "RND(MX(0, w_fee - w_deduction), 2)"
    compute_basis:
      w_fee: "The window refund is booked against the fee charge that paid the period in force and names that charge."
      w_credit_period: "on an annual plan the netted benefit is the Pass ride credit earned on trips completed in the period in force, less the credit forfeited or corrected on trips of that period"
      w_spent_period: "on a monthly plan on which Pass ride credit was spent on fares in the period, the netted benefit is the credit spent in the period"
      w_netted: "The benefit netting depends on the plan: on an annual plan the netted benefit is the Pass ride credit earned on trips completed in the period in force, less the credit forfeited or corrected on trips of that period; on a monthly plan on which Pass ride credit was spent on fares in the period, the netted benefit is the credit spent in the period; otherwise nothing is netted."
      w_tenure: "has held the membership for at least 24 whole months"
      w_prior_refunds: "has never had a membership fee refunded before"
      w_share: "The netting share depends on the member's standing: 50 percent of the netted benefit for a member who has held the membership for at least 24 whole months and has never had a membership fee refunded before; 75 percent for a member who does not meet that tier but has held it for at least 12 whole months and has had at most one earlier fee refund; the whole netted benefit for anyone else."
      w_waivers: "The Pass waiver charge counts the Pass fee waivers recorded on the member's trips in the last month"
      w_waiver_value: "The Pass waiver charge counts the Pass fee waivers recorded on the member's trips in the last month and values each at 3.75 on the Plus Monthly, Plus Annual and All Access Annual plans and at 2.50 on the Monthly and Annual plans; waivers on the Student plan are not counted."
      w_pro_status: "The Wayfare Pro refund relief follows the Wayfare Pro status on the member's own driver earnings account"
      w_pro_relief: "The Wayfare Pro refund relief follows the Wayfare Pro status on the member's own driver earnings account: 5.00 at Wayfare Pro Platinum, Diamond or Diamond Elite, 2.50 at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account."
      w_trips: "The frequent-rider refund relief counts the member's trips charged a fare in the last three months: 3.00 at 20 or more, 1.50 at 10 to 19, nothing below 10."
      w_rider_relief: "The frequent-rider refund relief counts the member's trips charged a fare in the last three months: 3.00 at 20 or more, 1.50 at 10 to 19, nothing below 10."
      w_deduction: "The benefit deduction is worked out in this order: the netted benefit is multiplied by the netting share and rounded half up to the cent; the Pass waiver charge is added; the Wayfare Pro refund relief and the frequent-rider refund relief are then subtracted; the deduction is never below 0.00; the window refund is the period fee less that deduction, rounded half up to the cent."
      result: "the window refund is the period fee less that deduction, rounded half up to the cent"
    factors:
      - id: benefit_netting_basis
        effect: method
        decides: w_netted
        bindings: [w_credit_period, w_spent_period, w_netted]
        ladder:
          - when: "an annual plan"
            method: "net the Pass ride credit earned on trips completed in the period in force, less the credit forfeited or corrected on trips of that period"
          - when: "a monthly plan on which Pass ride credit was spent on fares in the period"
            method: "net the Pass ride credit spent on fares in the period"
          - when: "otherwise"
            method: "net nothing"
        baseline:
          w_netted: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: netting_share
        effect: parameter
        decides: w_share
        bindings: [w_tenure, w_prior_refunds, w_share]
        ladder:
          - when: "membership held at least 24 whole months and no membership fee ever refunded before"
            value: "K('share_high') = 50 percent"
          - when: "not the first tier, held at least 12 whole months and at most one earlier fee refund"
            value: "K('share_low') = 75 percent"
          - when: "otherwise"
            value: "1 (the whole netted benefit)"
        baseline:
          w_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: pass_waiver_charge
        effect: parameter
        decides: w_waiver_value
        bindings: [w_waivers, w_waiver_value]
        ladder:
          - when: "the membership is on the Plus Monthly, Plus Annual or All Access Annual plan"
            value: "K('waiver_value_plus') = 3.75 per Pass fee waiver recorded in the last month"
          - when: "the membership is on the Monthly or Annual plan"
            value: "K('waiver_value_core') = 2.50 per waiver"
          - when: "otherwise (Student plan)"
            value: "0"
        baseline:
          w_waiver_value: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: trip
      - id: pro_refund_relief
        effect: parameter
        decides: w_pro_relief
        bindings: [w_pro_status, w_pro_relief]
        ladder:
          - when: "Wayfare Pro Platinum, Diamond or Diamond Elite on the member's own earnings account"
            value: "K('pro_relief_top') = 5.00"
          - when: "Wayfare Pro Gold or Silver"
            value: "K('pro_relief_mid') = 2.50"
          - when: "otherwise (Wayfare Pro Blue or no earnings account)"
            value: "0"
        baseline:
          w_pro_relief: "0"
        evidence: [cross_category]
        cross_difficulty: earnings
      - id: frequent_rider_refund_relief
        effect: parameter
        decides: w_rider_relief
        bindings: [w_trips, w_rider_relief]
        ladder:
          - when: "20 or more trips charged a fare in the last three months"
            value: "K('rider_relief_high') = 3.00"
          - when: "10 to 19 such trips"
            value: "K('rider_relief_low') = 1.50"
          - when: "otherwise"
            value: "0"
        baseline:
          w_rider_relief: "0"
        evidence: [cross_category]
        cross_difficulty: trip
    baseline:
      rule: >-
        The window refund returns the period fee in full.
      params: []
    inputs:
      history:
        - {table: pass_events, aggregate: sum, field: amount, filters: {event_type: pass_credit_earn}}
        - {table: pass_events, aggregate: count, field: pass_event_id, filters: {event_type: pass_fee_refund}}
        - {category: trip, table: trip_charges, aggregate: count, field: trip_charge_id, within_months: 1, filters: {event_type: trip_fee_waiver}}
      cross_category: [trip, earnings]
  # ---------------------------------------------------------------- task 1 (root problem)
  - id: pass_ext_all_access_upgrade_charge
    base_policy_refs: [pass_plan_change_rules, pass_student_verification, pass_evt_fee_billing]
    overwrite:
      - base_policy: pass_plan_change_rules
        superseded_clause: >-
          An upgrade (a plan listed in upgrade_targets) takes effect on the day it is made: a new period of the new plan starts that day and the fee collected is the new plan's membership_fee less the unused value of the current period (pass_msr_unused_period_value), booked as charge_reason plan_change_proration.
        replaced_by: >-
          The All Access upgrade charge is worked out in this order: the unused-period value is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period portion and rounded half up to the cent; the loyalty All Access discount, the Wayfare Pro All Access discount, the annual commitment discount, the Green-rider All Access discount and the Black-rider All Access discount are added into one discount rate and the All Access Annual membership fee is reduced once by that combined rate; the unused-period value is subtracted from the reduced fee; the charge is never below 0.00 and is rounded half up to the cent once, at the end.
      - base_policy: pass_evt_fee_billing
        superseded_clause: >-
          The fee for a period is the plan's membership_fee;
        replaced_by: >-
          A move up to the Wayfare Pass All Access Annual plan takes effect on the day it is made: a new twelve-month period of All Access Annual starts that day and the All Access upgrade charge is collected for it as a plan change charge.
    trigger: on_request
    subject: [pass_plan_change, pass_fee_charge]
    computes: proration_charge
    target_tool: upgrade_pass_to_all_access_2d51c03c
    params:
      all_access_fee: 249.00
      loyal_tenure_high: 24
      loyal_tenure_low: 12
      loyal_trips_high: 20
      loyal_trips_low: 10
      loyal_disc_high: 0.10
      loyal_disc_low: 0.05
      pro_disc_top: 0.10
      pro_disc_mid: 0.05
      commit_renewals_high: 2
      commit_disc_high: 0.05
      commit_disc_low: 0.02
      green_trips_high: 4
      green_trips_low: 2
      green_disc_high: 0.03
      green_disc_low: 0.01
      black_trips_high: 3
      black_trips_low: 1
      black_disc_high: 0.04
      black_disc_low: 0.02
    rule: >-
      A move up to the Wayfare Pass All Access Annual plan takes effect on the day it is made: a new twelve-month period of All Access Annual starts that day and the All Access upgrade charge is collected for it as a plan change charge.
      The All Access upgrade charge is not fixed until a period fee still inside its full refund window carries the refund owed on it.
      The All Access upgrade charge is the All Access Annual membership fee of 249.00 less the unused-period value.
      The unused-period value is the membership fees collected for the billing period in force less any fee refunds booked against them, multiplied by the days from the change date through the last day of the period, both days counted, over the days in the period, both end days counted, and rounded half up to the cent.
      The unused-period portion depends on the timing and on the plan: where the latest membership fee charge is no more than the plan's full refund window in calendar days old on the change date and no Pass ride credit has been posted for the period, the portion is the whole period; for an annual plan otherwise, the portion is the whole calendar months of the period, counted from the period start's day of month, that begin after the change date, over twelve; otherwise the portion is the days from the change date through the last day of the period, both days counted, over the days in the period, both end days counted.
      The loyalty All Access discount is 10 percent for a member who has held the membership for at least 24 whole months and has at least 20 trips charged a fare in the last three months; it is 5 percent for a member who does not meet that tier but has held the membership for at least 12 whole months and has at least 10 such trips; it is nothing for anyone else.
      The Wayfare Pro All Access discount follows the Wayfare Pro status on the member's own driver earnings account: 10 percent at Wayfare Pro Platinum, Diamond or Diamond Elite, 5 percent at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account.
      The annual commitment discount counts the annual renewals the member has paid, being renewal fee charges less those refunded as duplicate charges: 5 percent for a member on an annual plan with at least 2 paid annual renewals, 2 percent for a member on an annual plan with exactly 1, nothing otherwise.
      The Green-rider All Access discount counts the member's completed Wayfare Green trips dropped off in the last three months: 3 percent at 4 or more, 1 percent at 2 or 3, nothing below 2.
      The Black-rider All Access discount counts the member's completed Wayfare Black and Wayfare Black SUV trips dropped off in the last three months: 4 percent at 3 or more, 2 percent at 1 or 2, nothing at none.
      The All Access upgrade charge is worked out in this order: the unused-period value is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period portion and rounded half up to the cent; the loyalty All Access discount, the Wayfare Pro All Access discount, the annual commitment discount, the Green-rider All Access discount and the Black-rider All Access discount are added into one discount rate and the All Access Annual membership fee is reduced once by that combined rate; the unused-period value is subtracted from the reduced fee; the charge is never below 0.00 and is rounded half up to the cent once, at the end.
    prerequisite:
      - problem: pass_ext_upgrade_window_refund
        kind: value_input
        gate: ua_paid
        form: state
        policy_source: >-
          The All Access upgrade charge is not fixed until a period fee still inside its full refund window carries the refund owed on it.
        condition: >-
          When the fee charge that paid the period in force is no more than the plan's full refund window in calendar days old, the ledger carries a fee refund with refund basis full refund window naming that charge.
        resolved_by: refund_pass_period_fee_d96d0945
        effect: >-
          The membership fees collected for the period less refunds fall from the period fee to the benefit deduction kept, so the unused-period value falls and the charge rises.
    cross_category:
      - category: trip
        as: history
        reads: [trip_charges.event_type, trip_charges.charge_date, trips.variant_name, trips.status, trips.dropoff_at]
        note: The member's fare charges, Green trips and Black trips over three months set the loyalty, Green-rider and Black-rider tiers.
      - category: earnings
        as: branch
        reads: [variant_name]
        note: The Wayfare Pro status on the member's own earnings account sets the Wayfare Pro All Access discount.
    compute:
      - ua_paid: "SUM('pass_events', 'amount', event_type='pass_fee_charge', billing_period_start=F('current_period_start')) + SUM('pass_events', 'amount', event_type='pass_fee_refund', billing_period_start=F('current_period_start'))"
      - ua_last_charge: "LATEST('pass_events', 'event_date', event_type='pass_fee_charge')"
      - ua_credit_posts: "COUNT('pass_events', event_type='pass_credit_earn', billing_period_start=F('current_period_start'))"
      - ua_portion: "1 if DAYS(ua_last_charge, NOW) <= P('refund_full_window_days') and ua_credit_posts == 0 else ((P('billing_period_months') - MONTHS(F('current_period_start'), NOW) - 1) / P('billing_period_months') if P('billing_period_months') == 12 else (DAYS(NOW, F('current_period_end')) + 1) / (DAYS(F('current_period_start'), F('current_period_end')) + 1))"
      - ua_unused: "RND(MX(0, ua_paid) * ua_portion, 2)"
      - ua_tenure: "MONTHS(F('enrolled_date'), NOW)"
      - ua_trips: "XCOUNT('trip', 'trip_charges', within_months=3, date_field='charge_date', event_type='trip_fare_charge')"
      - ua_loyal: "K('loyal_disc_high') if ua_tenure >= K('loyal_tenure_high') and ua_trips >= K('loyal_trips_high') else (K('loyal_disc_low') if ua_tenure >= K('loyal_tenure_low') and ua_trips >= K('loyal_trips_low') else 0)"
      - ua_pro_status: "CFIELD('earnings', 'variant_name')"
      - ua_pro: "K('pro_disc_top') if ua_pro_status == 'Wayfare Pro Platinum' or ua_pro_status == 'Wayfare Pro Diamond' or ua_pro_status == 'Wayfare Pro Diamond Elite' else (K('pro_disc_mid') if ua_pro_status == 'Wayfare Pro Gold' or ua_pro_status == 'Wayfare Pro Silver' else 0)"
      - ua_renewals: "COUNT('pass_events', event_type='pass_fee_charge', charge_reason='renewal') - COUNT('pass_events', event_type='pass_fee_refund', refund_basis='duplicate_charge')"
      - ua_commit: "K('commit_disc_high') if P('billing_period_months') == 12 and ua_renewals >= K('commit_renewals_high') else (K('commit_disc_low') if P('billing_period_months') == 12 and ua_renewals == 1 else 0)"
      - ua_green_trips: "XCOUNT('trip', 'trips', within_months=3, date_field='dropoff_at', status='completed', variant_name='Wayfare Green')"
      - ua_green: "K('green_disc_high') if ua_green_trips >= K('green_trips_high') else (K('green_disc_low') if ua_green_trips >= K('green_trips_low') else 0)"
      - ua_black_trips: "XCOUNT('trip', 'trips', within_months=3, date_field='dropoff_at', status='completed', variant_name='Wayfare Black') + XCOUNT('trip', 'trips', within_months=3, date_field='dropoff_at', status='completed', variant_name='Wayfare Black SUV')"
      - ua_black: "K('black_disc_high') if ua_black_trips >= K('black_trips_high') else (K('black_disc_low') if ua_black_trips >= K('black_trips_low') else 0)"
      - ua_discount: "ua_loyal + ua_pro + ua_commit + ua_green + ua_black"
      - result: "RND(MX(0, K('all_access_fee') * (1 - ua_discount) - ua_unused), 2)"
    compute_basis:
      ua_paid: "The unused-period value is the membership fees collected for the billing period in force less any fee refunds booked against them"
      ua_last_charge: "where the latest membership fee charge is no more than the plan's full refund window in calendar days old on the change date"
      ua_credit_posts: "no Pass ride credit has been posted for the period"
      ua_portion: "The unused-period portion depends on the timing and on the plan: where the latest membership fee charge is no more than the plan's full refund window in calendar days old on the change date and no Pass ride credit has been posted for the period, the portion is the whole period; for an annual plan otherwise, the portion is the whole calendar months of the period, counted from the period start's day of month, that begin after the change date, over twelve; otherwise the portion is the days from the change date through the last day of the period, both days counted, over the days in the period, both end days counted."
      ua_unused: "the unused-period value is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period portion and rounded half up to the cent"
      ua_tenure: "has held the membership for at least 24 whole months"
      ua_trips: "has at least 20 trips charged a fare in the last three months"
      ua_loyal: "The loyalty All Access discount is 10 percent for a member who has held the membership for at least 24 whole months and has at least 20 trips charged a fare in the last three months; it is 5 percent for a member who does not meet that tier but has held the membership for at least 12 whole months and has at least 10 such trips; it is nothing for anyone else."
      ua_pro_status: "The Wayfare Pro All Access discount follows the Wayfare Pro status on the member's own driver earnings account"
      ua_pro: "The Wayfare Pro All Access discount follows the Wayfare Pro status on the member's own driver earnings account: 10 percent at Wayfare Pro Platinum, Diamond or Diamond Elite, 5 percent at Wayfare Pro Gold or Silver, nothing at Wayfare Pro Blue or without an earnings account."
      ua_renewals: "The annual commitment discount counts the annual renewals the member has paid, being renewal fee charges less those refunded as duplicate charges"
      ua_commit: "The annual commitment discount counts the annual renewals the member has paid, being renewal fee charges less those refunded as duplicate charges: 5 percent for a member on an annual plan with at least 2 paid annual renewals, 2 percent for a member on an annual plan with exactly 1, nothing otherwise."
      ua_green_trips: "The Green-rider All Access discount counts the member's completed Wayfare Green trips dropped off in the last three months: 3 percent at 4 or more, 1 percent at 2 or 3, nothing below 2."
      ua_green: "The Green-rider All Access discount counts the member's completed Wayfare Green trips dropped off in the last three months: 3 percent at 4 or more, 1 percent at 2 or 3, nothing below 2."
      ua_black_trips: "The Black-rider All Access discount counts the member's completed Wayfare Black and Wayfare Black SUV trips dropped off in the last three months: 4 percent at 3 or more, 2 percent at 1 or 2, nothing at none."
      ua_black: "The Black-rider All Access discount counts the member's completed Wayfare Black and Wayfare Black SUV trips dropped off in the last three months: 4 percent at 3 or more, 2 percent at 1 or 2, nothing at none."
      ua_discount: "the loyalty All Access discount, the Wayfare Pro All Access discount, the annual commitment discount, the Green-rider All Access discount and the Black-rider All Access discount are added into one discount rate and the All Access Annual membership fee is reduced once by that combined rate"
      result: "The All Access upgrade charge is worked out in this order: the unused-period value is the membership fees collected for the period in force less the fee refunds booked against them, multiplied by the unused-period portion and rounded half up to the cent; the loyalty All Access discount, the Wayfare Pro All Access discount, the annual commitment discount, the Green-rider All Access discount and the Black-rider All Access discount are added into one discount rate and the All Access Annual membership fee is reduced once by that combined rate; the unused-period value is subtracted from the reduced fee; the charge is never below 0.00 and is rounded half up to the cent once, at the end."
    factors:
      - id: unused_period_portion
        effect: method
        decides: ua_portion
        bindings: [ua_last_charge, ua_credit_posts, ua_portion]
        ladder:
          - when: "the latest fee charge is within the plan's full refund window on the change date and no Pass ride credit has been posted for the period"
            method: "the whole period counts as unused"
          - when: "an annual plan, not in the first tier"
            method: "whole calendar months of the period, counted from the period start's day of month, beginning after the change date, over twelve"
          - when: "otherwise"
            method: "days from the change date through the period's last day, both counted, over the days in the period"
        baseline:
          ua_portion: "(DAYS(NOW, F('current_period_end')) + 1) / (DAYS(F('current_period_start'), F('current_period_end')) + 1)"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: loyalty_all_access_discount
        effect: parameter
        decides: ua_loyal
        bindings: [ua_tenure, ua_trips, ua_loyal]
        ladder:
          - when: "membership held at least 24 whole months and at least 20 trips charged a fare in the last three months"
            value: "K('loyal_disc_high') = 10 percent"
          - when: "not the first tier, held at least 12 whole months and at least 10 such trips"
            value: "K('loyal_disc_low') = 5 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          ua_loyal: "0"
        evidence: [date, cross_category]
        cross_difficulty: trip
      - id: pro_all_access_discount
        effect: parameter
        decides: ua_pro
        bindings: [ua_pro_status, ua_pro]
        ladder:
          - when: "Wayfare Pro Platinum, Diamond or Diamond Elite on the member's own earnings account"
            value: "K('pro_disc_top') = 10 percent"
          - when: "Wayfare Pro Gold or Silver"
            value: "K('pro_disc_mid') = 5 percent"
          - when: "otherwise (Wayfare Pro Blue or no earnings account)"
            value: "0"
        baseline:
          ua_pro: "0"
        evidence: [cross_category]
        cross_difficulty: earnings
      - id: annual_commitment_discount
        effect: parameter
        decides: ua_commit
        bindings: [ua_renewals, ua_commit]
        ladder:
          - when: "an annual plan with at least 2 paid annual renewals"
            value: "K('commit_disc_high') = 5 percent"
          - when: "an annual plan with exactly 1 paid annual renewal"
            value: "K('commit_disc_low') = 2 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          ua_commit: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: green_rider_all_access_discount
        effect: parameter
        decides: ua_green
        bindings: [ua_green_trips, ua_green]
        ladder:
          - when: "4 or more completed Wayfare Green trips dropped off in the last three months"
            value: "K('green_disc_high') = 3 percent"
          - when: "2 or 3 such trips"
            value: "K('green_disc_low') = 1 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          ua_green: "0"
        evidence: [cross_category]
        cross_difficulty: trip
      - id: black_rider_all_access_discount
        effect: parameter
        decides: ua_black
        bindings: [ua_black_trips, ua_black]
        ladder:
          - when: "3 or more completed Wayfare Black or Black SUV trips dropped off in the last three months"
            value: "K('black_disc_high') = 4 percent"
          - when: "1 or 2 such trips"
            value: "K('black_disc_low') = 2 percent"
          - when: "otherwise"
            value: "0"
        baseline:
          ua_black: "0"
        evidence: [cross_category]
        cross_difficulty: trip
    baseline:
      rule: >-
        The All Access upgrade charge is the All Access Annual membership fee of 249.00 less the unused-period value.
        The unused-period value is the membership fees collected for the billing period in force less any fee refunds booked against them, multiplied by the days from the change date through the last day of the period, both days counted, over the days in the period, both end days counted, and rounded half up to the cent.
      params: [all_access_fee]
    inputs:
      history:
        - {table: pass_events, aggregate: sum, field: amount, filters: {event_type: pass_fee_charge}}
        - {table: pass_events, aggregate: count, field: pass_event_id, filters: {event_type: pass_fee_refund}}
        - {category: trip, table: trip_charges, aggregate: count, field: trip_charge_id, within_months: 3, filters: {event_type: trip_fare_charge}}
        - {category: trip, table: trips, aggregate: count, field: trip_id, within_months: 3, filters: {status: completed}}
      cross_category: [trip, earnings]
