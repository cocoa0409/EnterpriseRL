  - id: trip_ext_detour_toll_return
    base_policy_refs: [trip_agg_outstanding_balance_hold, trip_evt_airport_and_tolls]
    overwrite:
      - base_policy: trip_evt_airport_and_tolls
        superseded_clause: >-
          A toll is charged once per toll facility crossed between pickup and drop-off, at the toll_schedule amount for that facility, whichever direction it was crossed;
        replaced_by: >-
          A toll is still charged once per toll facility crossed between pickup and drop-off, at the toll schedule amount for that facility, whichever direction it was crossed, but on a trip whose fare was recalculated because the driver's route ran beyond the estimate without any rider route change, Wayfare returns the detour toll return against the trip's unpaid fare.
      - base_policy: trip_agg_outstanding_balance_hold
        superseded_clause: >-
          An outstanding charge is settled in full by one trip_balance_settlement row for that charge
        replaced_by: >-
          The detour toll return is booked as a refund-offset settlement entry against the unpaid fare charge, giving toll not incurred as its reason, and settles that unpaid fare in part; the toll charge itself and the rider's card are left as they are, and the entry counts toward the trip's support limit as a refund of that amount would.
    trigger: state_due
    subject: [trip_balance_settlement]
    computes: offset_amount
    target_tool: apply_detour_toll_return_b5bdaa70
    params:
      toll_share_standard: 0.25
      severe_detour_ratio: 1.75
      moderate_detour_ratio: 1.25
      facility_weight_toll_road: 1.0
      facility_weight_express: 0.6
      facility_weight_standard: 0.4
      tenure_mult_standard: 1.0
      tenure_mult_recent: 1.05
      tenure_mult_established: 1.15
      established_months: 6
      toll_timeliness_standard: 1.0
      toll_timeliness_mid: 0.85
      toll_timeliness_late: 0.6
      toll_mid_days: 8
      toll_late_days: 21
      fare_allowance_none: 0.0
      fare_allowance_mid: 0.20
      fare_allowance_large: 0.40
      fare_allowance_mid_fare: 25.00
      fare_allowance_large_fare: 50.00
    rule: >-
      A toll is still charged once per toll facility crossed between pickup and drop-off, at the toll schedule amount for that facility, whichever direction it was crossed, but on a trip whose fare was recalculated because the driver's route ran beyond the estimate without any rider route change, Wayfare returns the detour toll return against the trip's unpaid fare.
      The detour toll return is booked as a refund-offset settlement entry against the unpaid fare charge, giving toll not incurred as its reason, and settles that unpaid fare in part; the toll charge itself and the rider's card are left as they are, and the entry counts toward the trip's support limit as a refund of that amount would.
      The reason toll not incurred on such a settlement entry marks the detour toll return; it is not a refund of the toll charge, which keeps its whole-charge meaning on a refund entry.
      A trip with no toll charge, a trip whose rider changed the route, a trip whose fare stood at the upfront fare, or a trip whose fare was collected gets no detour toll return under this rule.
      The detour toll return is the attributed toll multiplied by the facility weight, then by the member tenure multiplier, then by the toll timeliness factor, with the fare-size allowance then added in dollars; it never exceeds the toll charged on the trip and is rounded half up to the cent once, at the end.
      The attributed toll is the toll charged on the trip times the standard detour toll share.
      The facility weight is the standard facility weight, the member tenure multiplier is the standard tenure multiplier, the toll timeliness factor is the standard toll timeliness factor and the fare-size allowance is nil.
      The attributed toll is instead worked out from how far the route ran beyond the estimate, measured as the trip's actual miles divided by its estimated miles: at least the severe detour ratio attributes the whole toll charged on the trip to the detour; at least the moderate detour ratio but below the severe detour ratio attributes the part of the toll charged in proportion to the extra miles, that is the toll times the actual miles less the estimated miles, divided by the actual miles; a smaller ratio keeps the standard detour toll share of the toll.
      The facility weight instead follows the toll facility charged on the trip: a toll road (E-470 or the Northwest Parkway), which a direct route avoids, takes the toll-road weight; a Colorado express lane (the I-25, US 36 or C-470 express lanes), which a rider may choose for speed, takes the express-lane weight; any other facility keeps the standard facility weight.
      The member tenure multiplier instead follows the Wayfare Pass membership in force at the request: a membership in trial, active or pending_cancellation status enrolled at least the established member months before today multiplies the return by the established tenure multiplier, one in those statuses enrolled more recently by the recent tenure multiplier, and any other rider keeps the standard tenure multiplier.
      The toll timeliness factor instead counts the calendar days from the charge date of the toll to today: at least the late toll days take the late toll timeliness factor, at least the mid toll days but fewer than the late toll days take the mid toll timeliness factor, and fewer than the mid toll days keep the standard toll timeliness factor.
      The fare-size allowance instead follows the fare charge amount: a fare charge of at least the large allowance fare adds the large fare-size allowance, one of at least the mid allowance fare but below the large allowance fare adds the mid fare-size allowance, and a smaller fare charge adds nothing.
    prerequisite: []
    cross_category:
      - category: pass
        as: branch
        reads: [status, enrolled_date]
        note: The member tenure multiplier reads the status and enrollment date of the membership in force at the request.
    compute:
      - toll_charged: "SUM('trip_charges','amount', event_type='trip_toll_charge')"
      - detour_miles_ratio: "F('actual_miles') / F('estimated_miles')"
      - attributed_toll: "toll_charged if detour_miles_ratio >= K('severe_detour_ratio') else (toll_charged * (F('actual_miles') - F('estimated_miles')) / F('actual_miles') if detour_miles_ratio >= K('moderate_detour_ratio') else toll_charged * K('toll_share_standard'))"
      - toll_facility_charged: "LATEST('trip_charges','toll_facility', date_field='charge_date', event_type='trip_toll_charge')"
      - facility_weight: "K('facility_weight_toll_road') if (toll_facility_charged == 'e_470' or toll_facility_charged == 'northwest_parkway') else (K('facility_weight_express') if (toll_facility_charged == 'i25_express_lanes' or toll_facility_charged == 'us36_express_lanes' or toll_facility_charged == 'c470_express_lanes') else K('facility_weight_standard'))"
      - toll_membership_status: "CFIELD('pass','status', pass_membership_id=F('pass_membership_id'))"
      - toll_membership_months: "MONTHS(CFIELD('pass','enrolled_date', pass_membership_id=F('pass_membership_id')) or NOW, NOW)"
      - member_tenure_multiplier: "K('tenure_mult_established') if ((toll_membership_status == 'trial' or toll_membership_status == 'active' or toll_membership_status == 'pending_cancellation') and toll_membership_months >= K('established_months')) else (K('tenure_mult_recent') if ((toll_membership_status == 'trial' or toll_membership_status == 'active' or toll_membership_status == 'pending_cancellation') and toll_membership_months < K('established_months')) else K('tenure_mult_standard'))"
      - toll_days_elapsed: "DAYS(LATEST('trip_charges','charge_date', date_field='charge_date', event_type='trip_toll_charge'), NOW)"
      - toll_timeliness: "K('toll_timeliness_late') if toll_days_elapsed >= K('toll_late_days') else (K('toll_timeliness_mid') if toll_days_elapsed >= K('toll_mid_days') else K('toll_timeliness_standard'))"
      - fare_for_toll_allowance: "SUM('trip_charges','amount', event_type='trip_fare_charge')"
      - fare_size_allowance: "K('fare_allowance_large') if fare_for_toll_allowance >= K('fare_allowance_large_fare') else (K('fare_allowance_mid') if fare_for_toll_allowance >= K('fare_allowance_mid_fare') else K('fare_allowance_none'))"
      - result: "RND(MN(attributed_toll * facility_weight * member_tenure_multiplier * toll_timeliness + fare_size_allowance, toll_charged), 2)"
    compute_basis:
      toll_charged: "The attributed toll is the toll charged on the trip times the standard detour toll share."
      detour_miles_ratio: "measured as the trip's actual miles divided by its estimated miles"
      attributed_toll: "at least the severe detour ratio attributes the whole toll charged on the trip to the detour; at least the moderate detour ratio but below the severe detour ratio attributes the part of the toll charged in proportion to the extra miles, that is the toll times the actual miles less the estimated miles, divided by the actual miles; a smaller ratio keeps the standard detour toll share of the toll."
      toll_facility_charged: "The facility weight instead follows the toll facility charged on the trip"
