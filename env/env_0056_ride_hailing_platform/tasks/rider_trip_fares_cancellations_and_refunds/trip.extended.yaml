        ladder:
          - when: "actual miles short of estimated miles by at least the short drop-off miles and at least one Wayfare Bikes ride charged on the fare charge date"
            value: "K('share_stranded_bike')"
          - when: "actual miles short of estimated miles by at least the short drop-off miles and no Wayfare Bikes ride charged on the fare charge date"
