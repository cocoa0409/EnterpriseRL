      toll_membership_status: "a membership in trial, active or pending_cancellation status"
      toll_membership_months: "enrolled at least the established member months before today"
      member_tenure_multiplier: "a membership in trial, active or pending_cancellation status enrolled at least the established member months before today multiplies the return by the established tenure multiplier, one in those statuses enrolled more recently by the recent tenure multiplier, and any other rider keeps the standard tenure multiplier."
      toll_days_elapsed: "The toll timeliness factor instead counts the calendar days from the charge date of the toll to today"
      toll_timeliness: "at least the late toll days take the late toll timeliness factor, at least the mid toll days but fewer than the late toll days take the mid toll timeliness factor, and fewer than the mid toll days keep the standard toll timeliness factor."
      fare_for_toll_allowance: "The fare-size allowance instead follows the fare charge amount"
      fare_size_allowance: "a fare charge of at least the large allowance fare adds the large fare-size allowance, one of at least the mid allowance fare but below the large allowance fare adds the mid fare-size allowance, and a smaller fare charge adds nothing."
      result: "The detour toll return is the attributed toll multiplied by the facility weight, then by the member tenure multiplier, then by the toll timeliness factor, with the fare-size allowance then added in dollars; it never exceeds the toll charged on the trip and is rounded half up to the cent once, at the end."
    factors:
      - id: toll_attribution
        effect: method
        decides: attributed_toll
        bindings: [toll_charged, detour_miles_ratio, attributed_toll]
        ladder:
          - when: "actual miles divided by estimated miles of at least the severe detour ratio"
            method: "the whole toll charged on the trip is attributed to the detour"
          - when: "a ratio of at least the moderate detour ratio but below the severe detour ratio"
            method: "the toll is attributed in proportion to the extra miles: toll x (actual miles - estimated miles) / actual miles"
          - when: "otherwise"
            method: "the standard detour toll share of the toll is attributed"
        baseline:
          attributed_toll: "toll_charged * K('toll_share_standard')"
        evidence: [history]
        cross_difficulty: null
      - id: facility_weight
        effect: parameter
        decides: facility_weight
        bindings: [toll_facility_charged, facility_weight]
        ladder:
          - when: "the toll charged is for a toll road (E-470 or the Northwest Parkway)"
            value: "K('facility_weight_toll_road')"
          - when: "the toll charged is for a Colorado express lane (I-25, US 36 or C-470 express lanes)"
            value: "K('facility_weight_express')"
          - when: "otherwise"
            value: "K('facility_weight_standard')"
        baseline:
          facility_weight: "K('facility_weight_standard')"
        evidence: [history]
        cross_difficulty: null
      - id: member_tenure_multiplier
        effect: parameter
        decides: member_tenure_multiplier
        bindings: [toll_membership_status, toll_membership_months, member_tenure_multiplier]
        ladder:
          - when: "membership in trial, active or pending_cancellation status enrolled at least the established member months ago"
            value: "K('tenure_mult_established')"
          - when: "membership in those statuses enrolled fewer than the established member months ago"
            value: "K('tenure_mult_recent')"
          - when: "otherwise"
            value: "K('tenure_mult_standard')"
        baseline:
          member_tenure_multiplier: "K('tenure_mult_standard')"
        evidence: [cross_category, date]
        cross_difficulty: pass
      - id: toll_timeliness
        effect: parameter
        decides: toll_timeliness
        bindings: [toll_days_elapsed, toll_timeliness]
        ladder:
          - when: "at least the late toll days from the toll charge date to today"
            value: "K('toll_timeliness_late')"
          - when: "at least the mid toll days and fewer than the late toll days"
            value: "K('toll_timeliness_mid')"
          - when: "otherwise"
            value: "K('toll_timeliness_standard')"
        baseline:
          toll_timeliness: "K('toll_timeliness_standard')"
        evidence: [date]
        cross_difficulty: null
      - id: fare_size_allowance
        effect: parameter
        decides: fare_size_allowance
        bindings: [fare_for_toll_allowance, fare_size_allowance]
        ladder:
          - when: "fare charge of at least the large allowance fare"
            value: "K('fare_allowance_large')"
          - when: "fare charge of at least the mid allowance fare and below the large allowance fare"
            value: "K('fare_allowance_mid')"
          - when: "otherwise"
            value: "K('fare_allowance_none')"
        baseline:
          fare_size_allowance: "K('fare_allowance_none')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The detour toll return is the attributed toll multiplied by the facility weight, then by the member tenure multiplier, then by the toll timeliness factor, with the fare-size allowance then added in dollars; it never exceeds the toll charged on the trip and is rounded half up to the cent once, at the end.
        The attributed toll is the toll charged on the trip times the standard detour toll share.
        The facility weight is the standard facility weight, the member tenure multiplier is the standard tenure multiplier, the toll timeliness factor is the standard toll timeliness factor and the fare-size allowance is nil.
      params: [toll_share_standard, facility_weight_standard, tenure_mult_standard, toll_timeliness_standard, fare_allowance_none]
    inputs:
      history:
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_toll_charge}}
        - {table: trip_charges, aggregate: latest, field: toll_facility, filters: {event_type: trip_toll_charge}}
        - {table: trip_charges, aggregate: latest, field: charge_date, filters: {event_type: trip_toll_charge}}
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_fare_charge}}
      cross_category: [pass]
  - id: trip_ext_detour_fare_offset
    base_policy_refs: [trip_agg_outstanding_balance_hold, trip_evt_adjustments_and_refunds]
    overwrite:
      - base_policy: trip_evt_adjustments_and_refunds
        superseded_clause: >-
          route_inefficiency, only when fare_basis is recalculated and rider_changed_route is false, takes back the fare charge amount minus the upfront fare less member_discount_amount (the rider pays what was quoted)
        replaced_by: >-
          On a collected fare, a route-inefficiency fare adjustment still takes back the fare charge amount less the upfront fare less the member discount recorded on the fare charge; on a fare charge that failed to collect, the detour fare correction below is owed instead.
      - base_policy: trip_agg_outstanding_balance_hold
        superseded_clause: >-
          or refund_offset when a refund or fare adjustment is booked against a charge that is still outstanding, in which case the settlement equals the outstanding amount of that charge and the rider's card is not refunded for the part that was never collected
        replaced_by: >-
          A detour fare correction owed on a fare charge that failed to collect is booked only as a refund-offset settlement entry against that fare charge, giving route inefficiency as its reason, for the detour fare correction itself; no fare adjustment entry is written, the entry counts toward the trip's support limit in place of the fare adjustment it replaces, and the rest of the unpaid fare stays unpaid.
    trigger: state_due
    subject: [trip_balance_settlement]
    computes: offset_amount
    target_tool: book_detour_fare_offset_50a7c54a
    params:
      credit_cap_standard: 2.00
      credit_cap_mid: 4.00
      credit_cap_large: 8.00
      credit_cap_mid_fare: 25.00
      credit_cap_large_fare: 50.00
      overrun_long_minutes: 20
      overrun_short_minutes: 10
      booking_return_fare_floor: 40.00
      booking_return_full: 1.0
      booking_return_partial: 0.6
      booking_return_none: 0.0
      member_credit_full: 2.00
      member_credit_part: 1.00
      member_credit_none: 0.0
      member_credit_fee_floor: 100.00
    rule: >-
      A trip whose fare charge was recalculated because the actual miles or minutes ran beyond the estimate while the rider changed nothing about the route was lengthened by the driver, and the rider owes only the honoured quote.
      On a collected fare, a route-inefficiency fare adjustment still takes back the fare charge amount less the upfront fare less the member discount recorded on the fare charge; on a fare charge that failed to collect, the detour fare correction below is owed instead.
      A detour fare correction owed on a fare charge that failed to collect is booked only as a refund-offset settlement entry against that fare charge, giving route inefficiency as its reason, for the detour fare correction itself; no fare adjustment entry is written, the entry counts toward the trip's support limit in place of the fare adjustment it replaces, and the rest of the unpaid fare stays unpaid.
      A detour fare correction that would take the support total of the trip above the ride option's support limit is sent to the fare review team as a fare review instead of being booked.
      A trip whose rider changed the route, or whose fare stood at the upfront fare, gets no detour fare correction.
      The detour fare correction is the fare charge amount less the honoured quote, plus the detour credits as limited by the detour credit cap; it never exceeds the unpaid amount left on the fare charge and is rounded half up to the cent once, at the end.
      The honoured quote is the trip's upfront fare less the member discount recorded on the fare charge.
      The detour credits are the booking-fee return and the member detour credit, added together.
      The booking-fee return and the member detour credit are each nil, and the detour credit cap is the standard detour credit cap.
      The honoured quote is instead worked out from the Wayfare Pass membership in force at the request: where that membership is in trial, active or pending_cancellation status, lists the ride option among its member discount options, and the discount recorded on the fare charge is larger than the plan's member discount percent of the upfront fare less the booking fee (rounded half up to the cent), the honoured quote is the upfront fare less that plan discount on the upfront fare; where the membership is in no such status and the fare charge nevertheless records a member discount above zero, the honoured quote is the upfront fare with no discount; otherwise it is the upfront fare less the discount recorded on the fare charge.
      The booking-fee return instead follows how far the trip's actual minutes ran beyond its estimated minutes: at least the long overrun minutes on a fare charge of at least the booking-return fare floor return the ride option's booking fee in full, at least the short overrun minutes otherwise return the partial share of it, and a shorter overrun returns nothing.
      The member detour credit instead follows the membership in force at the request: a membership in trial, active or pending_cancellation status on which membership fee charges of at least the member-credit fee floor were booked in the last 6 months gives the full member detour credit, one in those statuses with smaller fee charges in the last 6 months gives the part member detour credit, and any other rider gets none.
      The detour credit cap instead follows the fare charge amount: a fare charge of at least the large credit-cap fare takes the large detour credit cap, one of at least the mid credit-cap fare but below the large credit-cap fare takes the mid detour credit cap, and a smaller fare charge keeps the standard detour credit cap.
    prerequisite: []
    cross_category:
      - category: pass
        as: branch
        reads: [status, member_discount_pct, member_discount_options, pass_events.amount]
        note: The honoured quote reads the plan discount, status and discount options of the membership in force at the request; the member detour credit reads its status and the fee charges booked on it in the last 6 months.
    compute:
      - correction_fare: "SUM('trip_charges','amount', event_type='trip_fare_charge')"
      - correction_recorded_discount: "SUM('trip_charges','member_discount_amount', event_type='trip_fare_charge')"
      - unpaid_on_fare: "SUM('trip_charges','amount', event_type='trip_payment_failure') + SUM('trip_charges','amount', event_type='trip_balance_settlement')"
      - quote_membership_status: "CFIELD('pass','status', pass_membership_id=F('pass_membership_id'))"
      - quote_option_listed: "F('variant_name') in (CPARAM('pass','member_discount_options', pass_membership_id=F('pass_membership_id')) or '')"
      - quote_discount_on_upfront: "RND((CPARAM('pass','member_discount_pct', pass_membership_id=F('pass_membership_id')) or 0) / 100 * (F('upfront_fare') - P('booking_fee')), 2)"
      - honoured_quote: "(F('upfront_fare') - quote_discount_on_upfront) if ((quote_membership_status == 'trial' or quote_membership_status == 'active' or quote_membership_status == 'pending_cancellation') and quote_option_listed and correction_recorded_discount > quote_discount_on_upfront) else (F('upfront_fare') if (not (quote_membership_status == 'trial' or quote_membership_status == 'active' or quote_membership_status == 'pending_cancellation') and correction_recorded_discount > 0) else F('upfront_fare') - correction_recorded_discount)"
      - detour_overrun_minutes: "F('actual_minutes') - F('estimated_minutes')"
      - fare_for_booking_return: "SUM('trip_charges','amount', event_type='trip_fare_charge')"
      - booking_fee_return: "P('booking_fee') * K('booking_return_full') if (detour_overrun_minutes >= K('overrun_long_minutes') and fare_for_booking_return >= K('booking_return_fare_floor')) else (P('booking_fee') * K('booking_return_partial') if (detour_overrun_minutes >= K('overrun_short_minutes') and not (detour_overrun_minutes >= K('overrun_long_minutes') and fare_for_booking_return >= K('booking_return_fare_floor'))) else K('booking_return_none'))"
      - credit_membership_status: "CFIELD('pass','status', pass_membership_id=F('pass_membership_id'))"
      - membership_fees_last_six_months: "XSUM('pass','pass_events','amount', within_months=6, event_type='pass_fee_charge', pass_membership_id=F('pass_membership_id'))"
      - member_detour_credit: "K('member_credit_full') if ((credit_membership_status == 'trial' or credit_membership_status == 'active' or credit_membership_status == 'pending_cancellation') and membership_fees_last_six_months >= K('member_credit_fee_floor')) else (K('member_credit_part') if ((credit_membership_status == 'trial' or credit_membership_status == 'active' or credit_membership_status == 'pending_cancellation') and membership_fees_last_six_months < K('member_credit_fee_floor')) else K('member_credit_none'))"
      - fare_for_credit_cap: "SUM('trip_charges','amount', event_type='trip_fare_charge')"
      - detour_credit_cap: "K('credit_cap_large') if fare_for_credit_cap >= K('credit_cap_large_fare') else (K('credit_cap_mid') if fare_for_credit_cap >= K('credit_cap_mid_fare') else K('credit_cap_standard'))"
      - result: "RND(MN(correction_fare - honoured_quote + MN(booking_fee_return + member_detour_credit, detour_credit_cap), unpaid_on_fare), 2)"
    compute_basis:
      correction_fare: "The detour fare correction is the fare charge amount less the honoured quote"
      correction_recorded_discount: "The honoured quote is the trip's upfront fare less the member discount recorded on the fare charge."
      unpaid_on_fare: "it never exceeds the unpaid amount left on the fare charge"
      quote_membership_status: "where that membership is in trial, active or pending_cancellation status"
      quote_option_listed: "lists the ride option among its member discount options"
      quote_discount_on_upfront: "the plan's member discount percent of the upfront fare less the booking fee (rounded half up to the cent)"
      honoured_quote: "the honoured quote is the upfront fare less that plan discount on the upfront fare; where the membership is in no such status and the fare charge nevertheless records a member discount above zero, the honoured quote is the upfront fare with no discount; otherwise it is the upfront fare less the discount recorded on the fare charge."
      detour_overrun_minutes: "The booking-fee return instead follows how far the trip's actual minutes ran beyond its estimated minutes"
      fare_for_booking_return: "on a fare charge of at least the booking-return fare floor"
      booking_fee_return: "at least the long overrun minutes on a fare charge of at least the booking-return fare floor return the ride option's booking fee in full, at least the short overrun minutes otherwise return the partial share of it, and a shorter overrun returns nothing."
      credit_membership_status: "a membership in trial, active or pending_cancellation status on which membership fee charges of at least the member-credit fee floor were booked in the last 6 months"
      membership_fees_last_six_months: "on which membership fee charges of at least the member-credit fee floor were booked in the last 6 months"
      member_detour_credit: "gives the full member detour credit, one in those statuses with smaller fee charges in the last 6 months gives the part member detour credit, and any other rider gets none."
      fare_for_credit_cap: "The detour credit cap instead follows the fare charge amount"
      detour_credit_cap: "a fare charge of at least the large credit-cap fare takes the large detour credit cap, one of at least the mid credit-cap fare but below the large credit-cap fare takes the mid detour credit cap, and a smaller fare charge keeps the standard detour credit cap."
      result: "The detour fare correction is the fare charge amount less the honoured quote, plus the detour credits as limited by the detour credit cap; it never exceeds the unpaid amount left on the fare charge and is rounded half up to the cent once, at the end."
    factors:
      - id: honoured_quote_basis
        effect: method
        decides: honoured_quote
        bindings: [quote_membership_status, quote_option_listed, quote_discount_on_upfront, honoured_quote]
        ladder:
          - when: "membership in trial, active or pending_cancellation status listing the ride option, and the recorded discount larger than the plan discount on the upfront fare"
            method: "the honoured quote is the upfront fare less the plan's discount figured on the upfront fare less the booking fee"
          - when: "membership in no such status and a recorded discount above zero"
            method: "the honoured quote is the upfront fare with no discount"
          - when: "otherwise"
            method: "the honoured quote is the upfront fare less the discount recorded on the fare charge"
        baseline:
          honoured_quote: "F('upfront_fare') - correction_recorded_discount"
        evidence: [cross_category, tier_param, history]
        cross_difficulty: pass
      - id: booking_fee_return
        effect: parameter
        decides: booking_fee_return
        bindings: [detour_overrun_minutes, fare_for_booking_return, booking_fee_return]
        ladder:
          - when: "actual minutes beyond estimated minutes by at least the long overrun minutes and a fare charge of at least the booking-return fare floor"
            value: "P('booking_fee') * K('booking_return_full')"
          - when: "at least the short overrun minutes, the first tier not met"
            value: "P('booking_fee') * K('booking_return_partial')"
          - when: "otherwise"
            value: "K('booking_return_none')"
        baseline:
          booking_fee_return: "K('booking_return_none')"
        evidence: [history]
        cross_difficulty: null
      - id: member_detour_credit
        effect: parameter
        decides: member_detour_credit
        bindings: [credit_membership_status, membership_fees_last_six_months, member_detour_credit]
        ladder:
          - when: "membership in trial, active or pending_cancellation status with fee charges of at least the member-credit fee floor booked on it in the last 6 months"
            value: "K('member_credit_full')"
          - when: "membership in those statuses with smaller fee charges in the last 6 months"
            value: "K('member_credit_part')"
          - when: "otherwise"
            value: "K('member_credit_none')"
        baseline:
          member_detour_credit: "K('member_credit_none')"
        evidence: [cross_category, history]
        cross_difficulty: pass
      - id: detour_credit_cap
        effect: parameter
        decides: detour_credit_cap
        bindings: [fare_for_credit_cap, detour_credit_cap]
        ladder:
          - when: "fare charge of at least the large credit-cap fare"
            value: "K('credit_cap_large')"
          - when: "fare charge of at least the mid credit-cap fare and below the large credit-cap fare"
            value: "K('credit_cap_mid')"
          - when: "otherwise"
            value: "K('credit_cap_standard')"
        baseline:
          detour_credit_cap: "K('credit_cap_standard')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The detour fare correction is the fare charge amount less the honoured quote, plus the detour credits as limited by the detour credit cap; it never exceeds the unpaid amount left on the fare charge and is rounded half up to the cent once, at the end.
        The honoured quote is the trip's upfront fare less the member discount recorded on the fare charge.
        The detour credits are the booking-fee return and the member detour credit, added together.
        The booking-fee return and the member detour credit are each nil, and the detour credit cap is the standard detour credit cap.
      params: [credit_cap_standard, booking_return_none, member_credit_none]
    inputs:
      history:
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_fare_charge}}
        - {table: trip_charges, aggregate: sum, field: member_discount_amount, filters: {event_type: trip_fare_charge}}
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_payment_failure}}
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_balance_settlement}}
        - {category: pass, table: pass_events, aggregate: sum, field: amount, within_months: 6, filters: {event_type: pass_fee_charge}}
      cross_category: [pass]
  - id: trip_ext_detour_delay_referral
    base_policy_refs: [trip_evt_adjustments_and_refunds]
    overwrite: []
    trigger: state_due
    subject: [trip_fare_adjustment]
    computes: requested_amount
    target_tool: refer_detour_delay_review_b094ef4b
    params:
      grace_standard: 10
      grace_member: 5
      grace_plus: 0
      toll_detour_ratio: 1.40
      minor_detour_ratio: 1.10
      minute_value_standard: 1.0
      minute_value_priority: 1.5
      minute_value_reserved: 2.0
      referral_timeliness_standard: 1.0
      referral_timeliness_mid: 0.9
      referral_timeliness_late: 0.7
      referral_mid_days: 8
      referral_late_days: 21
      referral_cap_standard: 6.00
      referral_cap_mid: 12.00
      referral_cap_large: 20.00
      referral_cap_mid_fare: 25.00
      referral_cap_large_fare: 50.00
    rule: >-
      The time a rider lost to a driver's detour is never compensated by support itself: on a trip whose fare was recalculated because the actual miles or minutes ran beyond the estimate without any rider route change, support refers the detour delay to the fare review team as a fare review against the fare charge, giving route inefficiency as its reason, at the detour delay referral amount.
      A trip whose rider changed the route, whose fare stood at the upfront fare, or whose actual minutes did not run beyond the estimated minutes has no detour delay to refer.
      The detour delay referral amount is the compensable delay minutes multiplied by the ride option's per-minute rate and by the minute-value factor, then by the referral timeliness factor, and the figure is limited to the referral cap and rounded half up to the cent once, at the end.
      The compensable delay minutes are the measured delay minutes less the delay grace minutes, and never below zero.
      The measured delay minutes are the trip's actual minutes less its estimated minutes.
      The delay grace minutes are the standard delay grace minutes, the minute-value factor is the standard minute-value factor, the referral timeliness factor is the standard referral timeliness factor and the referral cap is the standard referral cap.
      The measured delay minutes are instead worked out from how the route ran: on a trip whose actual miles reached at least the toll-detour ratio of its estimated miles and that carries a toll charge, showing the driver left the direct route for a toll road, the measured delay is the time spent on the extra miles, that is the actual miles less the estimated miles, times the actual minutes, divided by the actual miles; on any other trip whose actual miles reached at least the minor-detour ratio of its estimated miles, the measured delay is the actual minutes less the estimated minutes scaled to the miles driven, that is the estimated minutes times the actual miles divided by the estimated miles, and never below zero; on any other trip it stays the actual minutes less the estimated minutes.
      The delay grace minutes instead follow the Wayfare Pass membership in force at the request: a Wayfare Pass Plus Monthly, Plus Annual or All Access Annual membership in trial, active or pending_cancellation status takes the Plus delay grace minutes, any other membership in one of those statuses takes the member delay grace minutes, and any other rider keeps the standard delay grace minutes.
      The minute-value factor instead follows what the rider booked for speed: a trip booked through Wayfare Reserve (it carries a reservation fee or reservation-fee waiver entry) takes the reserved minute-value factor, a trip requested with Priority Pickup (it carries a Priority Pickup charge or Priority Pickup waiver entry) that was not reserved takes the priority minute-value factor, and any other trip keeps the standard minute-value factor.
      The referral timeliness factor instead counts the calendar days from the charge date of the fare charge to today: at least the late referral days take the late referral timeliness factor, at least the mid referral days but fewer than the late referral days take the mid referral timeliness factor, and fewer than the mid referral days keep the standard referral timeliness factor.
      The referral cap instead follows the fare charge amount: a fare charge of at least the large referral fare takes the large referral cap, one of at least the mid referral fare but below the large referral fare takes the mid referral cap, and a smaller fare charge keeps the standard referral cap.
    prerequisite: []
    cross_category:
      - category: pass
        as: branch
        reads: [status, variant_name]
        note: The delay grace minutes read the plan and status of the membership in force at the request.
    compute:
      - detour_ratio_for_delay: "F('actual_miles') / F('estimated_miles')"
      - delay_toll_entries: "COUNT('trip_charges', event_type='trip_toll_charge')"
      - measured_delay_minutes: "(F('actual_miles') - F('estimated_miles')) * F('actual_minutes') / F('actual_miles') if (detour_ratio_for_delay >= K('toll_detour_ratio') and delay_toll_entries >= 1) else (MX(0, F('actual_minutes') - F('estimated_minutes') * F('actual_miles') / F('estimated_miles')) if (detour_ratio_for_delay >= K('minor_detour_ratio') and not (detour_ratio_for_delay >= K('toll_detour_ratio') and delay_toll_entries >= 1)) else F('actual_minutes') - F('estimated_minutes'))"
      - grace_membership_status: "CFIELD('pass','status', pass_membership_id=F('pass_membership_id'))"
      - grace_membership_plan: "CFIELD('pass','variant_name', pass_membership_id=F('pass_membership_id'))"
      - delay_grace_minutes: "K('grace_plus') if ((grace_membership_plan == 'Wayfare Pass Plus Monthly' or grace_membership_plan == 'Wayfare Pass Plus Annual' or grace_membership_plan == 'Wayfare Pass All Access Annual') and (grace_membership_status == 'trial' or grace_membership_status == 'active' or grace_membership_status == 'pending_cancellation')) else (K('grace_member') if (not (grace_membership_plan == 'Wayfare Pass Plus Monthly' or grace_membership_plan == 'Wayfare Pass Plus Annual' or grace_membership_plan == 'Wayfare Pass All Access Annual') and (grace_membership_status == 'trial' or grace_membership_status == 'active' or grace_membership_status == 'pending_cancellation')) else K('grace_standard'))"
      - compensable_minutes: "MX(0, measured_delay_minutes - delay_grace_minutes)"
      - reserved_entries: "COUNT('trip_charges', event_type='trip_reservation_fee') + COUNT('trip_charges', event_type='trip_fee_waiver', waived_fee_type='reservation_fee')"
      - priority_entries: "COUNT('trip_charges', event_type='trip_priority_pickup_charge') + COUNT('trip_charges', event_type='trip_fee_waiver', waived_fee_type='priority_pickup_charge')"
      - minute_value_factor: "K('minute_value_reserved') if reserved_entries >= 1 else (K('minute_value_priority') if (priority_entries >= 1 and reserved_entries == 0) else K('minute_value_standard'))"
      - referral_days_elapsed: "DAYS(LATEST('trip_charges','charge_date', date_field='charge_date', event_type='trip_fare_charge'), NOW)"
      - referral_timeliness: "K('referral_timeliness_late') if referral_days_elapsed >= K('referral_late_days') else (K('referral_timeliness_mid') if referral_days_elapsed >= K('referral_mid_days') else K('referral_timeliness_standard'))"
      - fare_for_referral_cap: "SUM('trip_charges','amount', event_type='trip_fare_charge')"
      - referral_cap: "K('referral_cap_large') if fare_for_referral_cap >= K('referral_cap_large_fare') else (K('referral_cap_mid') if fare_for_referral_cap >= K('referral_cap_mid_fare') else K('referral_cap_standard'))"
      - result: "RND(MN(compensable_minutes * P('per_minute_rate') * minute_value_factor * referral_timeliness, referral_cap), 2)"
    compute_basis:
      detour_ratio_for_delay: "on a trip whose actual miles reached at least the toll-detour ratio of its estimated miles"
      delay_toll_entries: "and that carries a toll charge, showing the driver left the direct route for a toll road"
      measured_delay_minutes: "the measured delay is the time spent on the extra miles, that is the actual miles less the estimated miles, times the actual minutes, divided by the actual miles; on any other trip whose actual miles reached at least the minor-detour ratio of its estimated miles, the measured delay is the actual minutes less the estimated minutes scaled to the miles driven, that is the estimated minutes times the actual miles divided by the estimated miles, and never below zero; on any other trip it stays the actual minutes less the estimated minutes."
      grace_membership_status: "a Wayfare Pass Plus Monthly, Plus Annual or All Access Annual membership in trial, active or pending_cancellation status"
      grace_membership_plan: "The delay grace minutes instead follow the Wayfare Pass membership in force at the request"
      delay_grace_minutes: "a Wayfare Pass Plus Monthly, Plus Annual or All Access Annual membership in trial, active or pending_cancellation status takes the Plus delay grace minutes, any other membership in one of those statuses takes the member delay grace minutes, and any other rider keeps the standard delay grace minutes."
      compensable_minutes: "The compensable delay minutes are the measured delay minutes less the delay grace minutes, and never below zero."
      reserved_entries: "a trip booked through Wayfare Reserve (it carries a reservation fee or reservation-fee waiver entry)"
      priority_entries: "a trip requested with Priority Pickup (it carries a Priority Pickup charge or Priority Pickup waiver entry)"
      minute_value_factor: "a trip booked through Wayfare Reserve (it carries a reservation fee or reservation-fee waiver entry) takes the reserved minute-value factor, a trip requested with Priority Pickup (it carries a Priority Pickup charge or Priority Pickup waiver entry) that was not reserved takes the priority minute-value factor, and any other trip keeps the standard minute-value factor."
      referral_days_elapsed: "The referral timeliness factor instead counts the calendar days from the charge date of the fare charge to today"
      referral_timeliness: "at least the late referral days take the late referral timeliness factor, at least the mid referral days but fewer than the late referral days take the mid referral timeliness factor, and fewer than the mid referral days keep the standard referral timeliness factor."
      fare_for_referral_cap: "The referral cap instead follows the fare charge amount"
      referral_cap: "a fare charge of at least the large referral fare takes the large referral cap, one of at least the mid referral fare but below the large referral fare takes the mid referral cap, and a smaller fare charge keeps the standard referral cap."
      result: "The detour delay referral amount is the compensable delay minutes multiplied by the ride option's per-minute rate and by the minute-value factor, then by the referral timeliness factor, and the figure is limited to the referral cap and rounded half up to the cent once, at the end."
    factors:
      - id: delay_measure
        effect: method
        decides: measured_delay_minutes
        bindings: [detour_ratio_for_delay, delay_toll_entries, measured_delay_minutes]
        ladder:
          - when: "actual miles at least the toll-detour ratio of the estimated miles and a toll charge on the trip"
            method: "measured delay = (actual miles - estimated miles) x actual minutes / actual miles (time spent on the extra miles)"
          - when: "actual miles at least the minor-detour ratio of the estimated miles, the first tier not met"
            method: "measured delay = actual minutes - estimated minutes x actual miles / estimated miles, never below zero (overrun beyond the time the longer route should take)"
          - when: "otherwise"
            method: "measured delay = actual minutes - estimated minutes"
        baseline:
          measured_delay_minutes: "F('actual_minutes') - F('estimated_minutes')"
        evidence: [history]
        cross_difficulty: null
      - id: delay_grace_minutes
        effect: parameter
        decides: delay_grace_minutes
        bindings: [grace_membership_status, grace_membership_plan, delay_grace_minutes]
        ladder:
          - when: "Wayfare Pass Plus Monthly, Plus Annual or All Access Annual membership in trial, active or pending_cancellation status"
            value: "K('grace_plus')"
          - when: "any other membership in one of those statuses"
            value: "K('grace_member')"
          - when: "otherwise"
            value: "K('grace_standard')"
        baseline:
          delay_grace_minutes: "K('grace_standard')"
        evidence: [cross_category]
        cross_difficulty: pass
      - id: minute_value_factor
        effect: parameter
        decides: minute_value_factor
        bindings: [reserved_entries, priority_entries, minute_value_factor]
        ladder:
          - when: "the trip carries a reservation fee or reservation-fee waiver entry"
            value: "K('minute_value_reserved')"
          - when: "the trip carries a Priority Pickup charge or Priority Pickup waiver entry and no reservation entry"
            value: "K('minute_value_priority')"
          - when: "otherwise"
            value: "K('minute_value_standard')"
        baseline:
          minute_value_factor: "K('minute_value_standard')"
        evidence: [history]
        cross_difficulty: null
      - id: referral_timeliness
        effect: parameter
        decides: referral_timeliness
        bindings: [referral_days_elapsed, referral_timeliness]
        ladder:
          - when: "at least the late referral days from the fare charge date to today"
            value: "K('referral_timeliness_late')"
          - when: "at least the mid referral days and fewer than the late referral days"
            value: "K('referral_timeliness_mid')"
          - when: "otherwise"
            value: "K('referral_timeliness_standard')"
        baseline:
          referral_timeliness: "K('referral_timeliness_standard')"
        evidence: [date]
        cross_difficulty: null
      - id: referral_cap
        effect: parameter
        decides: referral_cap
        bindings: [fare_for_referral_cap, referral_cap]
        ladder:
          - when: "fare charge of at least the large referral fare"
            value: "K('referral_cap_large')"
          - when: "fare charge of at least the mid referral fare and below the large referral fare"
            value: "K('referral_cap_mid')"
          - when: "otherwise"
            value: "K('referral_cap_standard')"
        baseline:
          referral_cap: "K('referral_cap_standard')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The detour delay referral amount is the compensable delay minutes multiplied by the ride option's per-minute rate and by the minute-value factor, then by the referral timeliness factor, and the figure is limited to the referral cap and rounded half up to the cent once, at the end.
        The compensable delay minutes are the measured delay minutes less the delay grace minutes, and never below zero.
        The measured delay minutes are the trip's actual minutes less its estimated minutes.
        The delay grace minutes are the standard delay grace minutes, the minute-value factor is the standard minute-value factor, the referral timeliness factor is the standard referral timeliness factor and the referral cap is the standard referral cap.
      params: [grace_standard, minute_value_standard, referral_timeliness_standard, referral_cap_standard, per_minute_rate]
    inputs:
      history:
        - {table: trip_charges, aggregate: count, field: trip_charge_id, filters: {event_type: trip_toll_charge}}
        - {table: trip_charges, aggregate: count, field: trip_charge_id, filters: {event_type: trip_fee_waiver, waived_fee_type: priority_pickup_charge}}
        - {table: trip_charges, aggregate: count, field: trip_charge_id, filters: {event_type: trip_fee_waiver, waived_fee_type: reservation_fee}}
        - {table: trip_charges, aggregate: latest, field: charge_date, filters: {event_type: trip_fare_charge}}
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_fare_charge}}
      cross_category: [pass]
  - id: trip_ext_unpaid_fare_payment
    base_policy_refs: [trip_agg_outstanding_balance_hold]
    overwrite:
      - base_policy: trip_agg_outstanding_balance_hold
        superseded_clause: >-
          A rider whose outstanding balance is above 0.00 may not request or reserve a new trip until it is settled; this hold is lifted by settlement, never by waiver, and support cannot override it.
        replaced_by: >-
          An amount held out of the payment against a submitted fare review stays unpaid on the fare charge without blocking new requests until the fare review team decides it; any other unpaid amount still blocks new requests until it is settled.
      - base_policy: trip_agg_outstanding_balance_hold
        superseded_clause: >-
          An outstanding charge is settled in full by one trip_balance_settlement row for that charge
        replaced_by: >-
          The rider pays the unpaid-fare payment amount with a newly added payment method as one settlement entry against the fare charge, which settles the unpaid fare in part when an amount is held out.
    trigger: on_request
    subject: [trip_balance_settlement]
    computes: payment_amount
    target_tool: pay_unpaid_fare_new_card_1dc475f0
    params:
      none_counted: 0.0
      basis_share_recalculated: 1.0
      basis_share_minimum: 0.7
      basis_share_standard: 0.4
      history_factor_clean: 1.0
      history_factor_one: 0.5
      history_factor_standard: 0.25
      holdout_timing_prompt: 1.0
      holdout_timing_mid: 0.75
      holdout_timing_standard: 0.6
      holdout_prompt_days: 7
      holdout_mid_days: 14
      holdout_cap_standard: 3.00
      holdout_cap_mid: 8.00
      holdout_cap_large: 15.00
      holdout_cap_mid_fare: 25.00
      holdout_cap_large_fare: 50.00
    rule: >-
      A rider whose fare charge failed to collect and who wants to settle it pays it themselves with a newly added payment method.
      The rider pays the unpaid-fare payment amount with a newly added payment method as one settlement entry against the fare charge, which settles the unpaid fare in part when an amount is held out.
      An amount held out of the payment against a submitted fare review stays unpaid on the fare charge without blocking new requests until the fare review team decides it; any other unpaid amount still blocks new requests until it is settled.
      A payment toward an unpaid fare is not taken until the fare charge carries a refund-offset settlement entry giving toll not incurred as its reason wherever a toll was charged on a trip whose fare was recalculated without any rider route change.
      The unpaid-fare payment amount is fixed only after a fare recalculated without any rider route change carries a refund-offset settlement entry giving route inefficiency as its reason.
      The unpaid-fare payment amount is not fixed before any detour delay on a trip whose fare was recalculated without a rider route change stands as a submitted fare review giving route inefficiency as its reason.
      The unpaid-fare payment amount is the unpaid amount left on the fare charge less the held-out amount, rounded half up to the cent once, at the end.
      The unpaid amount left on the fare charge is the payment failure booked against it less every settlement entry already booked against it.
      The held-out amount is found in three steps: first the review amount counted is taken; that dollar figure is then multiplied by the fare-basis share, by the payment-history factor and by the hold-out timing factor, each a fraction with no dollar amount added; the result is then limited to the hold-out cap and never exceeds the unpaid amount left on the fare charge.
      The review amount counted is nil, the fare-basis share is the standard fare-basis share, the payment-history factor is the standard payment-history factor, the hold-out timing factor is the standard hold-out timing factor and the hold-out cap is the standard hold-out cap.
      The review amount counted instead follows the Wayfare Pass membership in force at the request: where it is in trial, active or pending_cancellation status, the requested amounts of every submitted fare review on the trip are added together; where the trip had a membership in force at the request that is in any other status, only the requested amounts of submitted fare reviews registered against the unpaid fare charge itself are added together; where the trip had no membership in force at the request, no review amount is counted and the whole unpaid amount is collected.
      The fare-basis share instead follows how the fare charge was set: a recalculated fare takes the recalculated share, a fare set at the minimum fare takes the minimum-fare share, and an upfront fare keeps the standard fare-basis share.
      The payment-history factor instead counts the Wayfare Pass membership fee payments declined for the rider in the last 3 months: none takes the clean payment-history factor, exactly one takes the one-decline factor, and two or more keep the standard payment-history factor.
      The hold-out timing factor instead counts the calendar days from the date the payment failure was booked to today: at most the prompt payment days take the prompt hold-out timing factor, more than the prompt payment days but at most the mid payment days take the mid hold-out timing factor, and a later payment keeps the standard hold-out timing factor.
      The hold-out cap instead follows the fare charge amount: a fare charge of at least the large hold-out fare takes the large hold-out cap, one of at least the mid hold-out fare but below the large hold-out fare takes the mid hold-out cap, and a smaller fare charge keeps the standard hold-out cap.
    prerequisite:
      - problem: trip_ext_detour_toll_return
        kind: value_input
        gate: unpaid_left
        form: state
        policy_source: >-
          A payment toward an unpaid fare is not taken until the fare charge carries a refund-offset settlement entry giving toll not incurred as its reason wherever a toll was charged on a trip whose fare was recalculated without any rider route change.
        condition: >-
          The unpaid fare charge of a detoured trip that carries a toll charge has a refund-offset settlement entry giving toll not incurred as its reason, so the unpaid amount left on the fare charge already reflects the detour toll return.
        resolved_by: apply_detour_toll_return_b5bdaa70
        effect: >-
          Once the detour toll return is booked against the unpaid fare, the unpaid amount left on the fare charge drops by that return and the payment amount drops with it.
      - problem: trip_ext_detour_fare_offset
        kind: value_input
        gate: unpaid_left
        form: state
        policy_source: >-
          The unpaid-fare payment amount is fixed only after a fare recalculated without any rider route change carries a refund-offset settlement entry giving route inefficiency as its reason.
        condition: >-
          The recalculated fare charge of a trip without a rider route change carries a refund-offset settlement entry giving route inefficiency as its reason, so the unpaid amount left on the fare charge already reflects the detour fare correction.
        resolved_by: book_detour_fare_offset_50a7c54a
        effect: >-
          Once the detour fare correction is booked against the unpaid fare, the unpaid amount left on the fare charge drops by the correction and the payment amount drops with it.
      - problem: trip_ext_detour_delay_referral
        kind: value_input
        gate: review_amount_counted
        form: state
        policy_source: >-
          The unpaid-fare payment amount is not fixed before any detour delay on a trip whose fare was recalculated without a rider route change stands as a submitted fare review giving route inefficiency as its reason.
        condition: >-
          The trip carries a submitted fare review giving route inefficiency as its reason for the detour delay, so the review amount counted is known.
        resolved_by: refer_detour_delay_review_b094ef4b
        effect: >-
          Once the detour delay is referred, the review amount counted rises from nil to the referral amount, part of which is held out of the payment.
    cross_category:
      - category: pass
        as: branch
        reads: [status, pass_events.event_type, pass_events.event_date]
        note: The review amount counted reads the status of the membership in force at the request; the payment-history factor counts the rider's declined membership fee payments of the last 3 months.
    compute:
      - unpaid_left: "SUM('trip_charges','amount', event_type='trip_payment_failure') + SUM('trip_charges','amount', event_type='trip_balance_settlement')"
      - counted_membership_status: "CFIELD('pass','status', pass_membership_id=F('pass_membership_id'))"
      - unpaid_fare_charge_id: "LATEST('trip_charges','original_charge_id', date_field='charge_date', event_type='trip_payment_failure')"
      - review_amount_counted: "SUM('trip_fare_reviews','requested_amount', review_status='submitted') if (counted_membership_status == 'trial' or counted_membership_status == 'active' or counted_membership_status == 'pending_cancellation') else (SUM('trip_fare_reviews','requested_amount', review_status='submitted', trip_charge_id=unpaid_fare_charge_id) if (counted_membership_status != None and not (counted_membership_status == 'trial' or counted_membership_status == 'active' or counted_membership_status == 'pending_cancellation')) else K('none_counted'))"
      - fare_basis_of_charge: "LATEST('trip_charges','fare_basis', date_field='charge_date', event_type='trip_fare_charge')"
      - fare_basis_share: "K('basis_share_recalculated') if fare_basis_of_charge == 'recalculated' else (K('basis_share_minimum') if fare_basis_of_charge == 'minimum_fare' else K('basis_share_standard'))"
      - declined_fee_payments: "XCOUNT('pass','pass_events', within_months=3, date_field='event_date', event_type='pass_payment_decline')"
      - payment_history_factor: "K('history_factor_clean') if declined_fee_payments == 0 else (K('history_factor_one') if declined_fee_payments == 1 else K('history_factor_standard'))"
      - failure_days_elapsed: "DAYS(LATEST('trip_charges','charge_date', date_field='charge_date', event_type='trip_payment_failure'), NOW)"
      - holdout_timing: "K('holdout_timing_prompt') if failure_days_elapsed <= K('holdout_prompt_days') else (K('holdout_timing_mid') if failure_days_elapsed <= K('holdout_mid_days') else K('holdout_timing_standard'))"
      - fare_for_holdout_cap: "SUM('trip_charges','amount', event_type='trip_fare_charge')"
      - holdout_cap: "K('holdout_cap_large') if fare_for_holdout_cap >= K('holdout_cap_large_fare') else (K('holdout_cap_mid') if fare_for_holdout_cap >= K('holdout_cap_mid_fare') else K('holdout_cap_standard'))"
      - held_out: "MN(review_amount_counted * fare_basis_share * payment_history_factor * holdout_timing, holdout_cap, unpaid_left)"
      - result: "RND(unpaid_left - held_out, 2)"
    compute_basis:
      unpaid_left: "The unpaid amount left on the fare charge is the payment failure booked against it less every settlement entry already booked against it."
      counted_membership_status: "The review amount counted instead follows the Wayfare Pass membership in force at the request"
      unpaid_fare_charge_id: "only the requested amounts of submitted fare reviews registered against the unpaid fare charge itself are added together"
      review_amount_counted: "where it is in trial, active or pending_cancellation status, the requested amounts of every submitted fare review on the trip are added together; where the trip had a membership in force at the request that is in any other status, only the requested amounts of submitted fare reviews registered against the unpaid fare charge itself are added together; where the trip had no membership in force at the request, no review amount is counted and the whole unpaid amount is collected."
      fare_basis_of_charge: "The fare-basis share instead follows how the fare charge was set"
      fare_basis_share: "a recalculated fare takes the recalculated share, a fare set at the minimum fare takes the minimum-fare share, and an upfront fare keeps the standard fare-basis share."
      declined_fee_payments: "The payment-history factor instead counts the Wayfare Pass membership fee payments declined for the rider in the last 3 months"
      payment_history_factor: "none takes the clean payment-history factor, exactly one takes the one-decline factor, and two or more keep the standard payment-history factor."
      failure_days_elapsed: "The hold-out timing factor instead counts the calendar days from the date the payment failure was booked to today"
      holdout_timing: "at most the prompt payment days take the prompt hold-out timing factor, more than the prompt payment days but at most the mid payment days take the mid hold-out timing factor, and a later payment keeps the standard hold-out timing factor."
      fare_for_holdout_cap: "The hold-out cap instead follows the fare charge amount"
      holdout_cap: "a fare charge of at least the large hold-out fare takes the large hold-out cap, one of at least the mid hold-out fare but below the large hold-out fare takes the mid hold-out cap, and a smaller fare charge keeps the standard hold-out cap."
      held_out: "The held-out amount is found in three steps: first the review amount counted is taken; that dollar figure is then multiplied by the fare-basis share, by the payment-history factor and by the hold-out timing factor, each a fraction with no dollar amount added; the result is then limited to the hold-out cap and never exceeds the unpaid amount left on the fare charge."
      result: "The unpaid-fare payment amount is the unpaid amount left on the fare charge less the held-out amount, rounded half up to the cent once, at the end."
    factors:
      - id: review_amount_basis
        effect: method
        decides: review_amount_counted
        bindings: [counted_membership_status, unpaid_fare_charge_id, review_amount_counted]
        ladder:
          - when: "membership in force at the request in trial, active or pending_cancellation status"
            method: "add the requested amounts of every submitted fare review on the trip"
          - when: "a membership in force at the request in any other status"
            method: "add only the requested amounts of submitted fare reviews registered against the unpaid fare charge itself"
          - when: "otherwise (no membership in force at the request)"
            method: "count no review amount; the whole unpaid amount is collected"
        baseline:
          review_amount_counted: "K('none_counted')"
        evidence: [cross_category, history]
        cross_difficulty: pass
      - id: fare_basis_share
        effect: parameter
        decides: fare_basis_share
        bindings: [fare_basis_of_charge, fare_basis_share]
        ladder:
          - when: "the fare charge was recalculated"
            value: "K('basis_share_recalculated')"
          - when: "the fare charge was set at the minimum fare"
            value: "K('basis_share_minimum')"
          - when: "otherwise (an upfront fare)"
            value: "K('basis_share_standard')"
        baseline:
          fare_basis_share: "K('basis_share_standard')"
        evidence: [history]
        cross_difficulty: null
      - id: payment_history_factor
        effect: parameter
        decides: payment_history_factor
        bindings: [declined_fee_payments, payment_history_factor]
        ladder:
          - when: "no Wayfare Pass fee payment declined for the rider in the last 3 months"
            value: "K('history_factor_clean')"
          - when: "exactly one declined in the last 3 months"
            value: "K('history_factor_one')"
          - when: "otherwise (two or more)"
            value: "K('history_factor_standard')"
        baseline:
          payment_history_factor: "K('history_factor_standard')"
        evidence: [cross_category, history]
        cross_difficulty: pass
      - id: holdout_timing
        effect: parameter
        decides: holdout_timing
        bindings: [failure_days_elapsed, holdout_timing]
        ladder:
          - when: "at most the prompt payment days from the payment failure date to today"
            value: "K('holdout_timing_prompt')"
          - when: "more than the prompt payment days and at most the mid payment days"
            value: "K('holdout_timing_mid')"
          - when: "otherwise"
            value: "K('holdout_timing_standard')"
        baseline:
          holdout_timing: "K('holdout_timing_standard')"
        evidence: [date, history]
        cross_difficulty: null
      - id: holdout_cap
        effect: parameter
        decides: holdout_cap
        bindings: [fare_for_holdout_cap, holdout_cap]
        ladder:
          - when: "fare charge of at least the large hold-out fare"
            value: "K('holdout_cap_large')"
          - when: "fare charge of at least the mid hold-out fare and below the large hold-out fare"
            value: "K('holdout_cap_mid')"
          - when: "otherwise"
            value: "K('holdout_cap_standard')"
        baseline:
          holdout_cap: "K('holdout_cap_standard')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The unpaid-fare payment amount is the unpaid amount left on the fare charge less the held-out amount, rounded half up to the cent once, at the end.
        The unpaid amount left on the fare charge is the payment failure booked against it less every settlement entry already booked against it.
        The held-out amount is found in three steps: first the review amount counted is taken; that dollar figure is then multiplied by the fare-basis share, by the payment-history factor and by the hold-out timing factor, each a fraction with no dollar amount added; the result is then limited to the hold-out cap and never exceeds the unpaid amount left on the fare charge.
        The review amount counted is nil, the fare-basis share is the standard fare-basis share, the payment-history factor is the standard payment-history factor, the hold-out timing factor is the standard hold-out timing factor and the hold-out cap is the standard hold-out cap.
      params: [none_counted, basis_share_standard, history_factor_standard, holdout_timing_standard, holdout_cap_standard]
    inputs:
      history:
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_payment_failure}}
        - {table: trip_charges, aggregate: sum, field: amount, filters: {event_type: trip_balance_settlement}}
        - {table: trip_fare_reviews, aggregate: sum, field: requested_amount, filters: {review_status: submitted}}
        - {table: trip_charges, aggregate: latest, field: fare_basis, filters: {event_type: trip_fare_charge}}
        - {category: pass, table: pass_events, aggregate: count, field: pass_event_id, within_months: 3, filters: {event_type: pass_payment_decline}}
      cross_category: [pass]
