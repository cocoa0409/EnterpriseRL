      fare_for_review_cap: "The review request cap instead follows the fare charge amount"
      review_request_cap: "a fare charge of at least the premium review fare takes the premium review request cap, one of at least the mid review fare but below the premium review fare takes the mid review request cap, and any smaller fare charge the standard review request cap."
      onward_date: "The onward-journey reimbursement is instead worked out from the Wayfare Bikes ride charges booked on the charge date of the fare charge"
      onward_bike_charges: "where those charges come to at least the full reimbursement threshold, the reimbursement is the sum of those charges as booked"
      onward_bike_rides: "where some such ride was charged but the charges come to less than the threshold"
      onward_reimbursement: "where those charges come to at least the full reimbursement threshold, the reimbursement is the sum of those charges as booked; where some such ride was charged but the charges come to less than the threshold, the reimbursement is the flat onward-journey allowance instead of the charges; where no such ride was charged there is no reimbursement."
      airport_fee_entries: "a trip carrying an airport fee entry whose airport end was the pickup"
      luggage_allowance: "a trip carrying an airport fee entry whose airport end was the pickup takes the airport-pickup luggage allowance, one carrying an airport fee entry whose airport end was the drop-off takes the airport-drop-off luggage allowance, and any other trip takes none."
      review_days_elapsed: "The review timeliness factor counts the calendar days from the charge date of the fare charge to today"
      review_timeliness: "at least the late review days take the late review timeliness factor, at least the mid review days but fewer than the late review days take the mid review timeliness factor, and fewer than the mid review days take the standard review timeliness factor."
      result: "The wrong drop-off review amount is the fare still standing on the trip multiplied by the stranding share, then by the member review multiplier, then by the review timeliness factor, plus the onward-journey reimbursement and the luggage allowance, and the total is limited to the review request cap and rounded half up to the cent once, at the end."
    factors:
      - id: stranding_share
        effect: parameter
        decides: stranding_share
