name: env_0057_durable_medical_equipment_supplier
company: Summit Ridge Home Medical

background: |
  Summit Ridge Home Medical is an accredited durable medical equipment supplier headquartered in Pittsburgh, serving about 41,000 active patients from fourteen branches across western Pennsylvania, eastern Ohio and the northern panhandle of West Virginia.
  It furnishes home medical equipment and recurring supplies to patients at home, and its patient-services desk answers calls from patients, family caregivers and the referral partners who send it orders: hospital discharge planners, sleep centers, pulmonology and urology clinics, rehab seating clinics, skilled nursing facilities and home health agencies.
  The tone of the desk is warm, plain-spoken and careful with insurance language, because most callers are older adults or caregivers juggling several pieces of equipment at once.
  PAP Therapy Equipment is held as one device record per order, in the classes Travel CPAP System (E0601), CPAP Fixed-Pressure System (E0601), Auto-Adjusting CPAP System (E0601), Bilevel PAP Spontaneous System (E0470), Bilevel PAP Spontaneous-Timed System (E0471) and Adaptive Servo-Ventilation System (E0471), and is booked as monthly rental claims, self-pay sales, compliance downloads, repairs and pickups.
  Home Oxygen Therapy is held as one oxygen rental per patient in the classes Stationary Concentrator Oxygen (E1390), Concentrator with Portable Cylinders (E1390 + E0431), Concentrator with Home Fill System (E1390 + K0738), Concentrator with Portable Oxygen Concentrator (E1390 + E1392), Liquid Oxygen System (E0439 + E0434) and High-Flow Concentrator with Portable Cylinders (E1390 + E0431), booked as monthly equipment and contents claims alongside deliveries, refills and maintenance visits.
  Mobility Equipment is held as one wheelchair record per chair in the classes Standard Manual Wheelchair (K0001), Lightweight Manual Wheelchair (K0003), High-Strength Lightweight Wheelchair (K0004), Ultralightweight Manual Wheelchair (K0005), Group 2 Standard Power Wheelchair (K0823) and Group 3 Complex Rehab Power Wheelchair (K0856), booked as rental, purchase and repair claims, home assessments, deliveries and pickups.
  Hospital Beds & Support Surfaces are held as one bed record per patient in the classes Fixed-Height Hospital Bed (E0250), Variable-Height Hospital Bed (E0255), Semi-Electric Hospital Bed (E0260), Total Electric Hospital Bed (E0265), Heavy-Duty Hospital Bed (E0303) and Extra Heavy-Duty Hospital Bed (E0304), billed either to insurance or as a private month-to-month rental.
  The PAP Supply Replenishment Program enrolls PAP users in one of the Medicare Part B Resupply Schedule, Medicare Advantage Resupply Schedule, Medicaid Resupply Schedule, Commercial HMO Resupply Schedule, Commercial PPO Resupply Schedule or Self-Pay Supply Subscription, and books every mask, cushion, tubing, filter and water chamber shipped as its own line next to the patient's refill confirmations.
  The Urological Supply Program enrolls patients in the Straight Intermittent Catheter Program (A4351), Coudé Tip Intermittent Catheter Program (A4352), Closed-System Catheter Program (A4353), Indwelling Foley Catheter Program (A4338), All-Silicone Indwelling Catheter Program (A4344) or Male External Catheter Program (A4349), with catheter and accessory shipments, samples and refill contacts booked the same way.
  Behind every piece of equipment sits Insurance Coverage & Patient Responsibility: each patient holds one or two coverage records in the payer classes Original Medicare Part B, Medicare Advantage HMO, Medicare Advantage PPO, Medicaid Fee-for-Service, Commercial HMO, Commercial PPO and Medicare Supplement Plan G.
  Each coverage record carries the eligibility responses, the benefit-year deductible and out-of-pocket accumulators and a patient-account ledger of charges, payments, secondary-insurer payments, adjustments, refunds and statements.
  Prior authorizations, return pickups, appeals, travel arrangements, purchase elections and financial-hardship or payment-plan paperwork arrive as requests attached to the record they concern.
  A typical caller is a Medicare beneficiary in their seventies who rents a CPAP or an oxygen concentrator, receives PAP supplies every few months and carries a Medigap or Medicaid record behind Original Medicare, while younger commercially insured patients more often hold a single power wheelchair or catheter enrollment.
  Callers bring months or years of history with them: rental months paid and denied, hospital stays that paused billing, changes of insurance mid-rental, repairs on equipment they now own, recouped claims, statements they disagree with and shipments they say arrived too early or not at all.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_log

difficulties:
  - name: pap_therapy_rentals
    claim:
      categories: [pap]
      event_types: [pap_order_create, pap_setup_complete, pap_delivery, pap_compliance_download, pap_reevaluation_received, pap_trial_convert, pap_rental_paid, pap_rental_denied, pap_claim_reversal, pap_title_transfer, pap_suspend, pap_resume, pap_period_restart, pap_payer_update, pap_rx_update, pap_repair, pap_return, pap_pickup, pap_replace, pap_purchase_sale, pap_sale_delivered, pap_purchase_refund]
    summary: >
      Callers are sleep-apnea patients, their caregivers and sleep-center or practitioner offices asking
      about a PAP device anywhere in its life: a new order waiting for setup, a coverage trial whose
      compliance or re-evaluation is in question, a rental month that was denied or recouped, a device
      approaching or past ownership, an owned device that broke, a hospital stay that interrupted the
      rental, a change of insurance mid-rental, a travel unit bought for cash, or a device they want to
      return or replace; the setting varies across the six device classes, the trial, rental, suspended
      and owned statuses, whether the patient also holds a self-pay device or a supply enrollment, and
      the payer class and payment history of the coverage record behind the device. The governing records
      are the PAP device record, its claim lines, service history and requests together with the
      coverage record that is billed, and the rules take the shape of class-specific qualification and
      compliance standards under pap_order_qualification and pap_trial_compliance, month-by-month fee and
      modifier rules under pap_evt_rental_billing, a capped count of paid months toward ownership whose
      length the coverage class sets under pap_ownership, break-in-need and payer-change restarts under
      pap_suspension_break and pap_payer_transition, cost assignment by status and warranty under
      pap_repair_responsibility, appeal windows under pap_appeal, and self-pay pricing, return windows and
      restocking under pap_self_pay. In the natural course of the business an order is qualified and set
      up, the trial is proven, rental months are billed until title passes, and repairs, suspensions,
      returns or replacements arise along the way. Recording deliveries, downloads, re-evaluations, claim
      outcomes, suspensions, repairs and replacements are agent service actions, while declining an order,
      confirming that a rented device is to be given back and choosing what to buy are the patient's own
      decisions that the agent hands to the patient to confirm. Requests no policy decides, such as a
      dispute over the clinical content of a sleep study, a demand to be paid for months of non-use, a
      manufacturer recall settlement or a legal claim about a device injury, go to a representative under
      POLICY_NOT_COVERED.

  - name: home_oxygen_service
    claim:
      categories: [oxygen]
      event_types: [oxygen_order_create, oxygen_setup_complete, oxygen_delivery, oxygen_rental_paid, oxygen_rental_denied, oxygen_claim_reversal, oxygen_cap_reached, oxygen_contents_paid, oxygen_retest_received, oxygen_suspend, oxygen_resume, oxygen_period_restart, oxygen_system_change, oxygen_rx_update, oxygen_payer_update, oxygen_maintenance_visit, oxygen_return, oxygen_pickup, oxygen_lifetime_end]
    summary: >
      Callers are home oxygen patients, family caregivers and discharge planners asking about a new oxygen
      setup, a monthly equipment or contents charge, a denied or recouped month, a group II repeat test, a
      change from cylinders to a portable concentrator, a flow-rate change, a hospital stay, an upcoming
      trip, a power outage or malfunction, the end of equipment payments, the end of the equipment's useful
      lifetime, or giving the equipment back; the setting varies across the six system classes, the
      active, suspended and payment-cap-reached statuses, group I versus group II qualification, flow
      rate and usage pattern, and the coverage class billed. The records involved are the oxygen record,
      its equipment and contents claim lines, deliveries, maintenance visits and retests, travel and other
      requests, and the coverage record, and the governing rules take the shape of saturation, test-age
      and mobility gates under oxygen_qualification, a monthly fee adjusted for flow and portable
      equipment under oxygen_evt_monthly_billing, a payment cap and continued furnishing obligation under
      oxygen_payment_cap, contents billing only after the cap under oxygen_contents_billing, repeat-test
      windows under oxygen_group_ii_retest, service obligations and travel arrangements under
      oxygen_service_obligation and oxygen_travel, and replacement elections under oxygen_lifetime. In the
      natural course of the business oxygen is qualified and set up, billed monthly until the cap,
      furnished without equipment payment until the useful lifetime ends, and serviced, refilled,
      suspended or changed in between. Recording setups, deliveries, maintenance, retests, claim outcomes,
      suspensions and class changes are agent service actions, while confirming a return, declining an
      order and electing replacement equipment are the patient's own decisions handed to the patient.
      Requests no policy decides, such as oxygen for an international trip, a home-safety dispute over
      smoking, a claim for spoiled medication after a power outage, or a request to keep two complete
      systems in two homes, go to a representative under POLICY_NOT_COVERED.

  - name: wheelchair_mobility
    claim:
      categories: [mobility]
      event_types: [mobility_order_create, mobility_notice_signed, mobility_home_assessment, mobility_delivery, mobility_delivery_complete, mobility_purchase_delivered, mobility_purchase_election, mobility_rental_paid, mobility_rental_denied, mobility_purchase_paid, mobility_claim_reversal, mobility_title_transfer, mobility_suspend, mobility_resume, mobility_payer_update, mobility_repair, mobility_repair_paid, mobility_return, mobility_pickup, mobility_replace]
    summary: >
      Callers are wheelchair users, caregivers, therapists and rehab seating clinics asking where a power
      chair stands in authorization, whether a home assessment is still needed, why a rental month was
      denied, whether a complex chair can still be bought outright, what an upgraded chair will cost them,
      who pays for a battery, joystick or tire repair, what happens after a hospital stay or a change of
      insurance, and how to return or replace a chair; the setting varies across manual and power classes,
      rented, suspended and owned statuses, whether the patient elected an upgrade with or without a signed
      notice, the component and age of a repaired part, and the coverage class billed. The records involved
      are the wheelchair record, its rental, purchase and repair claim lines, delivery, assessment, repair
      and pickup history, its requests, and the coverage record, and the governing rules take the shape of
      examination, evaluation, assessment and prior-authorization gates under mobility_qualification,
      rental fees by month under mobility_evt_rental_billing, a first-month purchase election window under
      mobility_purchase_option, ownership after the coverage class's capped months under mobility_ownership,
      upgrade differences that need the patient's signed notice under mobility_upgrade, component
      warranties and repair-versus-replace thresholds under mobility_repair_responsibility, and same-or-
      similar and replacement limits under mobility_agg_same_or_similar and mobility_replacement. In the
      natural course of the business a chair is qualified, authorized where required, assessed, delivered,
      rented or bought, repaired and eventually returned or replaced. Recording assessments, deliveries,
      claim outcomes, suspensions and repairs are agent service actions, while signing the upgrade notice,
      electing the purchase option, declining an order and confirming a return are the patient's own acts
      handed to the patient. Requests no policy decides, such as van or vehicle modifications, a second
      chair for a vacation home, home ramp construction, or compensation for a fall blamed on the chair, go
      to a representative under POLICY_NOT_COVERED.

  - name: pap_supply_replenishment
    claim:
      categories: [resupply]
      event_types: [resupply_enroll, resupply_activate, resupply_hold, resupply_release, resupply_opt_out, resupply_schedule_change, resupply_order_renew, resupply_preference_update, resupply_refill_confirmed, resupply_refill_declined, resupply_item_shipped, resupply_item_denied, resupply_line_reversal, resupply_no_charge_replacement, resupply_shipping_charge]
    summary: >
      Callers are PAP users and caregivers asking for new masks, cushions, tubing, filters or water
      chambers, asking why an item cannot ship yet or was denied, wanting a different mask style or a
      better fit, reporting a defective or lost package, asking for faster shipping, reporting new
      insurance, or wanting to stop or restart their supplies; the setting varies across the six payer
      schedules, active and on-hold enrollments, the patient's mask style, humidifier and tubing, whether
      the device was furnished by Summit Ridge or another supplier, the automatic-shipment choice, and the
      shipment history of each item. The records involved are the supply enrollment, its shipment lines
      and refill contacts, the PAP device record it serves and the coverage record billed, and the
      governing rules take the shape of a schedule fixed by the primary payer class under
      resupply_agg_schedule_match, per-item limits, covered periods and earliest ship dates under
      resupply_evt_shipment, the patient's own refill request and its freshness under
      resupply_refill_confirmation, item fit and mutual exclusions under resupply_item_compatibility,
      no-charge replacements under resupply_replacement_rules, holds and closures under resupply_hold_rules,
      shipping charges under resupply_shipping and self-pay pricing under resupply_self_pay_pricing. In the
      natural course of the business a patient is enrolled and verified, confirms each refill, receives
      items that each cover a period, and is put on hold or moved to a new schedule when circumstances
      change. Recording refill confirmations, shipments, replacements, holds and schedule changes are agent
      service actions, while asking for a refill, choosing automatic shipments, choosing to pay for extra
      items and opting out are the patient's own choices handed to the patient. Requests no policy decides,
      such as supplies for a device the patient has not used in years, a brand the schedule does not carry
      shipped abroad, or reimbursement for supplies bought at a retail store, go to a representative under
      POLICY_NOT_COVERED.

  - name: patient_account_balances
    claim:
      categories: [coverage]
      event_types: [coverage_add, coverage_verify_active, coverage_verify_ineligible, coverage_terminate, coverage_priority_update, coverage_eligibility_check, coverage_patient_charge, coverage_payment, coverage_secondary_payment, coverage_adjustment, coverage_refund, coverage_payment_plan_set, coverage_hardship_set, coverage_statement, coverage_collections_referral]
    summary: >
      Callers are patients, spouses and adult children asking about a statement, a balance they believe
      their secondary insurance should have paid, a payment they made that does not show, a credit they
      want refunded, a payment arrangement or financial-hardship discount, a Medicaid card that arrived
      after charges were posted, new insurance to add or old insurance that ended, or a collection notice;
      the setting varies across the seven payer classes, primary and secondary combinations, QMB status,
      deductible and out-of-pocket progress in the benefit year, open charges spread over several coverage
      accounts, and the statement, payment and arrangement history. The records involved are the coverage
      records, the patient-account ledger and the patient-account requests, read together with the
      equipment and supply claim lines the charges stem from, and the governing rules take the shape of
      cost-share splitting with deductible, coinsurance, copay and out-of-pocket limits under
      coverage_cost_share, coordination between primary and secondary under coverage_agg_coordination, QMB
      protection under coverage_qmb_protection, payment application and oldest-first allocation under
      coverage_evt_payment and coverage_agg_payment_allocation, credit refunds under coverage_credit_refund,
      arrangements under coverage_payment_plan, hardship tiers and their documentation window under
      coverage_hardship, other adjustments and their stacking under coverage_evt_adjustments, statements
      and collection referrals under coverage_statement_collections, and retroactive Medicaid under
      coverage_retro_medicaid. In the natural course of the business coverage is added and verified, claim
      lines leave patient charges, secondary payers and adjustments reduce them, statements go out, and
      payments, arrangements, refunds or referrals follow. Recording coverage, eligibility responses,
      payments the patient reports with a reference, adjustments, refunds and statements are agent service
      actions, while signing a payment arrangement, applying for hardship and asking for a small credit to
      be refunded are the patient's own acts handed to the patient. Requests no policy decides, such as
      negotiating a lump-sum settlement below the balance, disputing a payer's medical-necessity decision
      as unfair, waiving cost share as a courtesy, or crediting a balance at another supplier, go to a
      representative under POLICY_NOT_COVERED.
