events:
  - type: beds_order_create
    target: beds_holdings
    mutation: create
    meaning: A hospital bed order arrives (or a family arranges a private rental) and a bed record is opened.
    grain: one row per bed order
    fields:
      customer_id: patient
      variant_name: bed class ordered
      billing_mode: coverage or private rental
      coverage_id: coverage billed; empty for a private rental
      ordering_npi: ordering practitioner NPI
      referral_source: kind of referral partner
      order_date: order date
      patient_weight_lbs: patient weight
      support_surface: surface ordered with the bed
    triggers: []

  - type: beds_notice_signed
    target: beds_holdings
    mutation: update
    meaning: The patient signs the coverage class's notice for the total electric upgrade.
    grain: one row per transaction
    fields:
      notice_on_file: signed
    triggers: []

  - type: beds_delivery_complete
    target: beds_holdings
    mutation: {transition: {from: order_received, to: rental_active}}
    meaning: The bed is delivered and assembled in the home.
    grain: one row per transaction
    fields:
      delivery_date: delivery date
      rental_period_start_date: first day of the rental period (the delivery date)
      serial_number: bed serial number
    triggers: []

  - type: beds_order_cancel
    target: beds_holdings
    mutation: {transition: {from: order_received, to: cancelled}}
    meaning: The bed is declined before delivery.
    grain: one row per transaction
    fields:
      closed_date: date declined
    triggers: []

  - type: beds_title_transfer
    target: beds_holdings
    mutation: {transition: {from: rental_active, to: patient_owned}}
    meaning: The capped coverage rental completes and the bed becomes the patient's property.
    grain: one row per transaction
    fields:
      ownership_date: date title passed
    triggers: []

  - type: beds_suspend
    target: beds_holdings
    mutation: {transition: {from: rental_active, to: suspended}}
    meaning: Coverage rental billing pauses for an inpatient or skilled nursing stay.
    grain: one row per transaction
    fields:
      suspended_date: admission date
    triggers: []

  - type: beds_resume
    target: beds_holdings
    mutation: {transition: {from: suspended, to: rental_active}}
    meaning: The patient is home again and billing resumes.
    grain: one row per transaction
    fields:
      suspended_date: cleared on resumption
    triggers: []

  - type: beds_return
    target: beds_holdings
    mutation: {transition: [{from: rental_active, to: returned}, {from: suspended, to: returned}]}
    meaning: The patient or family confirms the bed is given back.
    grain: one row per transaction
    fields:
      closed_date: date of the confirmed return
    triggers: []

  - type: beds_surface_update
    target: beds_holdings
    mutation: update
    meaning: A Group 2 powered mattress is added to or removed from the bed.
    grain: one row per transaction
    fields:
      support_surface: surface now furnished
    triggers: []

  - type: beds_hospice_update
    target: beds_holdings
    mutation: update
    meaning: The patient's hospice election is recorded on the bed.
    grain: one row per transaction
    fields:
      hospice_election_date: date the hospice election took effect
    triggers: []

  - type: beds_payer_update
    target: beds_holdings
    mutation: update
    meaning: A different primary coverage starts paying and a new rental period begins.
    grain: one row per transaction
    fields:
      coverage_id: new primary coverage
      rental_period_start_date: first date of service under the new coverage
    triggers: []

  - type: beds_rental_paid
    target: beds_billing
    meaning: The payer pays one capped rental month of the bed (with any support surface).
    grain: one row per paid rental month within a rental period under one coverage
    distinguish_by: [coverage_id, rental_month_number, service_from_date]
    fields:
      coverage_id: coverage that paid
      hcpcs_code: billed code
      billing_modifier: KH, KI or KJ
      rental_month_number: month ordinal
      service_from_date: first day of the month
      adjudication_date: remittance date
      allowed_amount: allowed amount, bed plus surface
      surface_allowed_amount: surface part
      payer_paid_amount: payer payment
      patient_responsibility: patient cost share
      upgrade_difference_amount: patient-owed upgrade difference
      claim_number: claim control number
    account: rental_months
    direction: in
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: beds, source_bill_id: beds_bill_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}
      - event: coverage:coverage_patient_charge
        when: {upgrade_difference_amount: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: beds, source_bill_id: beds_bill_id, amount: upgrade_difference_amount, responsibility_type: upgrade_difference, posting_date: service_from_date}

  - type: beds_rental_denied
    target: beds_billing
    meaning: The payer denies a rental month.
    grain: one row per denied rental month claim
    distinguish_by: [coverage_id, service_from_date, denial_reason]
    fields:
      coverage_id: coverage billed
      hcpcs_code: billed code
      billing_modifier: KH, KI or KJ
      rental_month_number: month ordinal billed
      service_from_date: first day of the month
      adjudication_date: denial remittance date
      denial_reason: denial reason
      claim_number: claim control number
    triggers: []

  - type: beds_claim_reversal
    target: beds_billing
    meaning: The payer takes back a paid rental month.
    grain: one row per paid month reversed
    distinguish_by: [original_bill_id]
    fields:
      coverage_id: coverage that recouped
      original_bill_id: paid month reversed
      reversal_reason: why it was taken back
      payer_paid_amount: amount taken back
      service_from_date: first day of the reversed month
      adjudication_date: recoupment remittance date
      claim_number: claim control number of the reversal
    account: rental_months
    direction: out
    triggers:
      - event: coverage:coverage_adjustment
        map: {coverage_id: coverage_id, customer_id: customer_id, adjustment_reason: claim_reversal}

  - type: beds_self_pay_rent
    target: beds_billing
    meaning: One month (or a prorated final part-month) of a private bed rental is charged to the card.
    grain: one row per private rental month charged
    distinguish_by: [rental_month_number, service_from_date]
    fields:
      rental_month_number: private month ordinal
      service_from_date: first day of the month charged
      adjudication_date: card charge date
      self_pay_amount: amount charged
    triggers: []

  - type: beds_delivery
    target: beds_service
    meaning: A bed or support surface is delivered and set up (initial delivery, surface delivery or swap).
    grain: one row per item delivered
    distinguish_by: [service_date, delivery_purpose]
    fields:
      service_date: delivery date
      delivery_purpose: why delivered
      entrapment_check_done: whether the entrapment check was documented
      serial_number: serial number delivered
    triggers:
      - event: beds:beds_delivery_complete
        when: {delivery_purpose: initial_delivery}
        map: {delivery_date: service_date, rental_period_start_date: service_date, serial_number: serial_number}

  - type: beds_service_visit
    target: beds_service
    meaning: A technician performs preventive maintenance or a repair on the bed.
    grain: one row per service visit
    distinguish_by: [service_date, visit_type]
    fields:
      service_date: visit date
      visit_type: maintenance or repair
      entrapment_check_done: whether the entrapment check was documented
      repair_coverage: who bears a repair's cost
      labor_units: labor units
      parts_amount: parts cost
      repair_patient_share: patient-owed amount on a patient-paid repair
      serial_number: bed serviced
    triggers:
      - event: coverage:coverage_patient_charge
        when: {repair_coverage: patient_paid}
        map: {customer_id: customer_id, source_category: beds, source_bill_id: beds_service_id, amount: repair_patient_share, responsibility_type: repair_patient_share, posting_date: service_date}

  - type: beds_pickup
    target: beds_service
    meaning: A rented bed is collected (or found missing on the pickup attempt).
    grain: one row per pickup visit
    distinguish_by: [service_date]
    fields:
      service_date: pickup date
      pickup_condition: condition found
      serial_number: bed collected
    triggers: []

measures:
  - id: beds_msr_paid_months_current_period
    window: beds_billing rows of the holding whose coverage_id equals the holding's coverage_id and whose service_from_date is on or after rental_period_start_date, up to the handling date
    measure: count of beds_rental_paid rows minus the count of beds_claim_reversal rows whose original_bill_id is one of them

policies:
  - id: beds_agg_multi_holding
    subject: [beds_order_create]
    rule: >-
      A patient holds at most `max_per_customer` open bed record (any status other than returned or
      cancelled); a different class or a surface is furnished on the existing record or after the first
      is returned. No bed is ordered while another bed record of the patient is order_received,
      rental_active or suspended.
    eligibility:
      - id: one_open_bed
        applies_to: [beds_order_create]
        kind: dedup
        condition: No bed is ordered while another bed record of the patient is order_received, rental_active or suspended.
        evidence_fields: [beds_holdings.customer_id, beds_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_holdings.customer_id]
          action_bindings:
            beds_holdings.customer_id: customer_id
        dedup_contract:
          table: beds_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [order_received, rental_active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: beds_qualification
    subject: [beds_order_create, beds_delivery_complete, beds_delivery]
    rule: >-
      A coverage-billed bed qualifies on the class's `qualification_basis` and a patient weight between
      `patient_weight_min_lbs` and `patient_weight_max_lbs`; a patient too heavy for the class ordered
      needs the heavier class. A written order older than `rx_validity_months` cannot be delivered.
      Delivery follows within `delivery_lead_business_days` business days, on the day of hospital
      discharge where `hospital_discharge_same_day` is true, assembled in the home with the side-rail
      entrapment check documented where `entrapment_check_required` is true. When the primary coverage's
      class requires prior authorization for beds and surfaces (coverage parameter
      prior_auth_bed_required), a coverage-billed bed is delivered only once a prior_authorization
      request on this holding is approved and the delivery date is within the coverage's
      prior_auth_validity_days of its decision_date. A private rental needs only the first month's rent and
      the delivery fee paid.
      The bed furnished is the class's `hcpcs_code` with `height_adjustment` height control and
      `head_foot_adjustment` head and foot controls, a sleeping surface `bed_width_in` inches wide,
      and a mattress and side rails where `mattress_included` and `side_rails_included` are true; it
      is assembled in the home by Summit Ridge staff where `in_home_setup_required` is true.
    eligibility:
      - id: bed_prior_auth
        applies_to: [beds_delivery_complete]
        kind: authorization
        condition: When the primary coverage's class requires prior authorization for beds and surfaces (coverage parameter prior_auth_bed_required), a coverage-billed bed is delivered only once a prior_authorization request on this holding is approved and the delivery date is within the coverage's prior_auth_validity_days of its decision_date.
        evidence_fields: [beds_requests.request_type, beds_requests.request_status, beds_requests.decision_date, beds_requests.beds_holding_id, coverage_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_requests.beds_holding_id]
          action_bindings:
            beds_requests.beds_holding_id: beds_holding_id
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"code": "=hcpcs_code", "height": "=height_adjustment", "head_foot": "=head_foot_adjustment", "width": "=bed_width_in", "mattress": "=mattress_included", "rails": "=side_rails_included", "home_setup": "=in_home_setup_required", "basis": "=qualification_basis", "weight_min": "=patient_weight_min_lbs", "weight_max": "=patient_weight_max_lbs", "lead_days": "=delivery_lead_business_days", "discharge_same_day": "=hospital_discharge_same_day", "entrapment": "=entrapment_check_required"}
        "Variable-Height Hospital Bed (E0255)": {"code": "=hcpcs_code", "height": "=height_adjustment", "head_foot": "=head_foot_adjustment", "width": "=bed_width_in", "mattress": "=mattress_included", "rails": "=side_rails_included", "home_setup": "=in_home_setup_required", "basis": "=qualification_basis", "weight_min": "=patient_weight_min_lbs", "weight_max": "=patient_weight_max_lbs", "lead_days": "=delivery_lead_business_days", "discharge_same_day": "=hospital_discharge_same_day", "entrapment": "=entrapment_check_required"}
        "Semi-Electric Hospital Bed (E0260)": {"code": "=hcpcs_code", "height": "=height_adjustment", "head_foot": "=head_foot_adjustment", "width": "=bed_width_in", "mattress": "=mattress_included", "rails": "=side_rails_included", "home_setup": "=in_home_setup_required", "basis": "=qualification_basis", "weight_min": "=patient_weight_min_lbs", "weight_max": "=patient_weight_max_lbs", "lead_days": "=delivery_lead_business_days", "discharge_same_day": "=hospital_discharge_same_day", "entrapment": "=entrapment_check_required"}
        "Total Electric Hospital Bed (E0265)": {"code": "=hcpcs_code", "height": "=height_adjustment", "head_foot": "=head_foot_adjustment", "width": "=bed_width_in", "mattress": "=mattress_included", "rails": "=side_rails_included", "home_setup": "=in_home_setup_required", "basis": "=qualification_basis", "weight_min": "=patient_weight_min_lbs", "weight_max": "=patient_weight_max_lbs", "lead_days": "=delivery_lead_business_days", "discharge_same_day": "=hospital_discharge_same_day", "entrapment": "=entrapment_check_required"}
        "Heavy-Duty Hospital Bed (E0303)": {"code": "=hcpcs_code", "height": "=height_adjustment", "head_foot": "=head_foot_adjustment", "width": "=bed_width_in", "mattress": "=mattress_included", "rails": "=side_rails_included", "home_setup": "=in_home_setup_required", "basis": "=qualification_basis", "weight_min": "=patient_weight_min_lbs", "weight_max": "=patient_weight_max_lbs", "lead_days": "=delivery_lead_business_days", "discharge_same_day": "=hospital_discharge_same_day", "entrapment": "=entrapment_check_required"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"code": "=hcpcs_code", "height": "=height_adjustment", "head_foot": "=head_foot_adjustment", "width": "=bed_width_in", "mattress": "=mattress_included", "rails": "=side_rails_included", "home_setup": "=in_home_setup_required", "basis": "=qualification_basis", "weight_min": "=patient_weight_min_lbs", "weight_max": "=patient_weight_max_lbs", "lead_days": "=delivery_lead_business_days", "discharge_same_day": "=hospital_discharge_same_day", "entrapment": "=entrapment_check_required"}

  - id: beds_evt_rental_billing
    subject: [beds_rental_paid, beds_rental_denied]
    rule: >-
      Coverage rental months are billed on the anniversary of rental_period_start_date (same day of each
      later month, month-end fallback; after a resumption from the resumption date) under the class's
      `billed_as_hcpcs`, months 1 to 3 at `rental_fee_months_1_3` and later months at
      `rental_fee_months_4_13` of the billed class, plus the E0277 surface fees when a surface is
      furnished; the allowed amount is each fee times the coverage class's allowed_pct_of_fee_schedule
      divided by 100, rounded to the cent half up, then summed. Months are never prorated and no month
      beginning in a suspension is billed. A coverage rental month is billed only while the bed record
      is rental_active.
    eligibility:
      - id: bed_billable_status
        applies_to: [beds_rental_paid]
        kind: state
        condition: A coverage rental month is billed only while the bed record is rental_active.
        evidence_fields: [beds_holdings.status, beds_holdings.beds_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_holdings.beds_holding_id]
          action_bindings:
            beds_holdings.beds_holding_id: beds_holding_id
        state_contract:
          field: beds_holdings.status
          allowed: [rental_active]
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"billed_as": "=billed_as_hcpcs", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Variable-Height Hospital Bed (E0255)": {"billed_as": "=billed_as_hcpcs", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Semi-Electric Hospital Bed (E0260)": {"billed_as": "=billed_as_hcpcs", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Total Electric Hospital Bed (E0265)": {"billed_as": "=billed_as_hcpcs", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Heavy-Duty Hospital Bed (E0303)": {"billed_as": "=billed_as_hcpcs", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"billed_as": "=billed_as_hcpcs", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
    measures: [beds_msr_paid_months_current_period]

  - id: beds_ownership
    subject: [beds_title_transfer, beds_rental_paid]
    rule: >-
      Title passes once beds_msr_paid_months_current_period reaches the coverage class's
      capped_rental_months; ownership_date is the day after the last day of the final paid month. The E0277
      surface follows its own count on the same rental and title to it passes the same way. A private
      rental never transfers title, however long it runs. An owned bed is replaced on coverage only after
      `reasonable_useful_lifetime_months` from delivery_date, or earlier for loss or theft with a report
      where `lost_stolen_report_required` is true, or for irreparable damage; a replacement opens a new
      bed record.
    eligibility: []
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"rul": "=reasonable_useful_lifetime_months", "lost_report": "=lost_stolen_report_required"}
        "Variable-Height Hospital Bed (E0255)": {"rul": "=reasonable_useful_lifetime_months", "lost_report": "=lost_stolen_report_required"}
        "Semi-Electric Hospital Bed (E0260)": {"rul": "=reasonable_useful_lifetime_months", "lost_report": "=lost_stolen_report_required"}
        "Total Electric Hospital Bed (E0265)": {"rul": "=reasonable_useful_lifetime_months", "lost_report": "=lost_stolen_report_required"}
        "Heavy-Duty Hospital Bed (E0303)": {"rul": "=reasonable_useful_lifetime_months", "lost_report": "=lost_stolen_report_required"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"rul": "=reasonable_useful_lifetime_months", "lost_report": "=lost_stolen_report_required"}
    measures: [beds_msr_paid_months_current_period]

  - id: beds_upgrade
    subject: [beds_notice_signed, beds_rental_paid]
    rule: >-
      A Total Electric Hospital Bed (E0265) is billed to coverage as the semi-electric class; the patient
      owes on each paid month the difference between the E0265 fee and the E0260 fee for that month,
      each times the coverage class's allowed_pct_of_fee_schedule divided by 100 and rounded to the cent
      half up, and only where the coverage class's upgrade_billing_permitted is true. The difference is
      charged only when the upgrade notice is signed: the notice_on_file of the bed record is signed.
      Without it the difference is written off under the coverage charter.
    eligibility:
      - id: bed_notice_signed
        applies_to: [beds_rental_paid]
        kind: authorization
        condition: 'the notice_on_file of the bed record is signed.'
        evidence_fields: [beds_holdings.notice_on_file, beds_holdings.beds_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_holdings.beds_holding_id]
          action_bindings:
            beds_holdings.beds_holding_id: beds_holding_id
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"status_class": "=coverage_status_class", "notice": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13"}
        "Variable-Height Hospital Bed (E0255)": {"status_class": "=coverage_status_class", "notice": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13"}
        "Semi-Electric Hospital Bed (E0260)": {"status_class": "=coverage_status_class", "notice": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13"}
        "Total Electric Hospital Bed (E0265)": {"status_class": "=coverage_status_class", "notice": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13"}
        "Heavy-Duty Hospital Bed (E0303)": {"status_class": "=coverage_status_class", "notice": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"status_class": "=coverage_status_class", "notice": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13"}

  - id: beds_support_surface
    subject: [beds_surface_update, beds_rental_paid]
    rule: >-
      A Group 2 powered mattress (`e0277_hcpcs`) is furnished on coverage only where
      `support_surface_addon_allowed` is true and the patient has multiple pressure ulcers of at least stage
      `e0277_wound_stage_min` on the trunk or pelvis after `e0277_prior_group1_trial_months` months on a
      Group 1 surface with a comprehensive ulcer program, or large or multiple stage 3 or 4 ulcers, or a
      flap or graft for such an ulcer within the past `flap_graft_lookback_days` days; continued need is documented every
      `e0277_documentation_interval_months` months and the surface is removed when the ulcers heal. A
      surface is added only once a prior_authorization request on this holding is approved where the
      coverage class's prior_auth_bed_required is true.
    eligibility:
      - id: surface_prior_auth
        applies_to: [beds_surface_update]
        kind: authorization
        condition: A surface is added only once a prior_authorization request on this holding is approved where the coverage class's prior_auth_bed_required is true.
        evidence_fields: [beds_requests.request_type, beds_requests.request_status, beds_requests.beds_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_requests.beds_holding_id]
          action_bindings:
            beds_requests.beds_holding_id: beds_holding_id
    params:
      flap_graft_lookback_days: 60
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"allowed": "=support_surface_addon_allowed", "stage": "=e0277_wound_stage_min", "trial_months": "=e0277_prior_group1_trial_months", "doc_months": "=e0277_documentation_interval_months", "fee_1_3": "=e0277_rental_fee_months_1_3", "fee_4_13": "=e0277_rental_fee_months_4_13"}
        "Variable-Height Hospital Bed (E0255)": {"allowed": "=support_surface_addon_allowed", "stage": "=e0277_wound_stage_min", "trial_months": "=e0277_prior_group1_trial_months", "doc_months": "=e0277_documentation_interval_months", "fee_1_3": "=e0277_rental_fee_months_1_3", "fee_4_13": "=e0277_rental_fee_months_4_13"}
        "Semi-Electric Hospital Bed (E0260)": {"allowed": "=support_surface_addon_allowed", "stage": "=e0277_wound_stage_min", "trial_months": "=e0277_prior_group1_trial_months", "doc_months": "=e0277_documentation_interval_months", "fee_1_3": "=e0277_rental_fee_months_1_3", "fee_4_13": "=e0277_rental_fee_months_4_13"}
        "Total Electric Hospital Bed (E0265)": {"allowed": "=support_surface_addon_allowed", "stage": "=e0277_wound_stage_min", "trial_months": "=e0277_prior_group1_trial_months", "doc_months": "=e0277_documentation_interval_months", "fee_1_3": "=e0277_rental_fee_months_1_3", "fee_4_13": "=e0277_rental_fee_months_4_13"}
        "Heavy-Duty Hospital Bed (E0303)": {"allowed": "=support_surface_addon_allowed", "stage": "=e0277_wound_stage_min", "trial_months": "=e0277_prior_group1_trial_months", "doc_months": "=e0277_documentation_interval_months", "fee_1_3": "=e0277_rental_fee_months_1_3", "fee_4_13": "=e0277_rental_fee_months_4_13"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"allowed": "=support_surface_addon_allowed", "stage": "=e0277_wound_stage_min", "trial_months": "=e0277_prior_group1_trial_months", "doc_months": "=e0277_documentation_interval_months", "fee_1_3": "=e0277_rental_fee_months_1_3", "fee_4_13": "=e0277_rental_fee_months_4_13"}

  - id: beds_suspension_break
    subject: [beds_suspend, beds_resume]
    rule: >-
      An inpatient or skilled nursing admission suspends a coverage rental with the admission date as
      suspended_date; no month beginning in the suspension is billed. A suspended bed rental resumes in
      the same rental period only when the patient comes home no later than `break_in_need_days` days
      after the suspension began, counting calendar days from the day after suspended_date, the allowance
      being `break_in_need_days` plus the days remaining in the rental month in which the suspension
      began. A longer break starts a new rental period after `new_period_requirements`. A private rental is
      never suspended; the family returns the bed or keeps paying.
    eligibility:
      - id: bed_break_allowance
        applies_to: [beds_resume]
        kind: time
        condition: A suspended bed rental resumes in the same rental period only when the patient comes home no later than `break_in_need_days` days after the suspension began, counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the rental month in which the suspension began.
        evidence_fields: [beds_holdings.suspended_date, beds_holdings.beds_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_holdings.beds_holding_id]
          action_bindings:
            beds_holdings.beds_holding_id: beds_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension began
          anchor_source: beds_holdings.suspended_date
          relation: not_after
          duration_source: variants.break_in_need_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the rental month in which the suspension began
          boundary: inclusive
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Variable-Height Hospital Bed (E0255)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Semi-Electric Hospital Bed (E0260)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Total Electric Hospital Bed (E0265)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Heavy-Duty Hospital Bed (E0303)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}

  - id: beds_evt_claim_reversal
    subject: [beds_claim_reversal]
    rule: >-
      A recoupment is recorded against the one paid month it takes back, as original_bill_id; a paid
      month is reversed at most once. A month overlapping a hospice election is reversed with
      hospice_overlap. Every patient charge stemming from the reversed month is removed under the coverage
      charter.
    eligibility:
      - id: bed_reverse_once
        applies_to: [beds_claim_reversal]
        kind: dedup
        condition: a paid month is reversed at most once.
        evidence_fields: [beds_billing.original_bill_id, beds_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_billing.original_bill_id]
          action_bindings:
            beds_billing.original_bill_id: original_bill_id
        dedup_contract:
          table: beds_billing
          mode: separate_record
          object_bindings: {original_bill_id: original_bill_id}
          duplicate_filters: {event_type: [beds_claim_reversal]}
          distinct_fields: []

  - id: beds_service_responsibility
    subject: [beds_service_visit]
    rule: >-
      Preventive maintenance with the entrapment check is performed every `maintenance_interval_months`
      months on every bed in the home. While rented (coverage or private) every repair is Summit Ridge's
      obligation at no charge, completed or swapped within `rental_swap_business_days` business days. On an
      owned bed the frame warranty `frame_warranty_months` and the electrical warranty
      `electrical_warranty_months` apply first, counted from delivery_date; out of warranty, labor at
      `repair_labor_rate_per_unit` per unit plus parts is billed to the coverage with the patient owing the
      cost share, and a repair costing more than `repair_cost_replace_threshold_pct` percent of
      `fee_schedule_purchase_price` is not made. A service visit is recorded only on a bed in the home: the
      bed record is rental_active, suspended or patient_owned.
    eligibility:
      - id: bed_in_home
        applies_to: [beds_service_visit]
        kind: state
        condition: the bed record is rental_active, suspended or patient_owned.
        evidence_fields: [beds_holdings.status, beds_holdings.beds_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_holdings.beds_holding_id]
          action_bindings:
            beds_holdings.beds_holding_id: beds_holding_id
        state_contract:
          field: beds_holdings.status
          allowed: [rental_active, suspended, patient_owned]
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"maintenance_months": "=maintenance_interval_months", "swap_days": "=rental_swap_business_days", "frame_months": "=frame_warranty_months", "electrical_months": "=electrical_warranty_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Variable-Height Hospital Bed (E0255)": {"maintenance_months": "=maintenance_interval_months", "swap_days": "=rental_swap_business_days", "frame_months": "=frame_warranty_months", "electrical_months": "=electrical_warranty_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Semi-Electric Hospital Bed (E0260)": {"maintenance_months": "=maintenance_interval_months", "swap_days": "=rental_swap_business_days", "frame_months": "=frame_warranty_months", "electrical_months": "=electrical_warranty_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Total Electric Hospital Bed (E0265)": {"maintenance_months": "=maintenance_interval_months", "swap_days": "=rental_swap_business_days", "frame_months": "=frame_warranty_months", "electrical_months": "=electrical_warranty_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Heavy-Duty Hospital Bed (E0303)": {"maintenance_months": "=maintenance_interval_months", "swap_days": "=rental_swap_business_days", "frame_months": "=frame_warranty_months", "electrical_months": "=electrical_warranty_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"maintenance_months": "=maintenance_interval_months", "swap_days": "=rental_swap_business_days", "frame_months": "=frame_warranty_months", "electrical_months": "=electrical_warranty_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}

  - id: beds_return_pickup
    subject: [beds_return, beds_pickup, beds_order_cancel]
    rule: >-
      A bed may be declined before delivery at no charge. A rented bed is returned only at the patient's or
      family's own confirmation: a rented bed is returned only after a return_pickup request on this
      holding is approved. Pickup follows within `pickup_lead_business_days` business days; a private
      rental is charged `self_pay_pickup_fee`. A bed recovered damaged beyond normal wear is charged
      `damage_fee_beyond_wear`; a bed still not recovered `unreturned_equipment_days` days after the
      confirmed pickup date is charged `unreturned_equipment_charge`. A return after the patient's death is
      never charged damage or pickup fees.
    eligibility:
      - id: bed_return_confirmed
        applies_to: [beds_return]
        kind: authorization
        condition: a rented bed is returned only after a return_pickup request on this holding is approved.
        evidence_fields: [beds_requests.request_type, beds_requests.request_status, beds_requests.beds_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_requests.beds_holding_id]
          action_bindings:
            beds_requests.beds_holding_id: beds_holding_id
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"pickup_days": "=pickup_lead_business_days", "pickup_fee": "=self_pay_pickup_fee", "damage_fee": "=damage_fee_beyond_wear", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge"}
        "Variable-Height Hospital Bed (E0255)": {"pickup_days": "=pickup_lead_business_days", "pickup_fee": "=self_pay_pickup_fee", "damage_fee": "=damage_fee_beyond_wear", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge"}
        "Semi-Electric Hospital Bed (E0260)": {"pickup_days": "=pickup_lead_business_days", "pickup_fee": "=self_pay_pickup_fee", "damage_fee": "=damage_fee_beyond_wear", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge"}
        "Total Electric Hospital Bed (E0265)": {"pickup_days": "=pickup_lead_business_days", "pickup_fee": "=self_pay_pickup_fee", "damage_fee": "=damage_fee_beyond_wear", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge"}
        "Heavy-Duty Hospital Bed (E0303)": {"pickup_days": "=pickup_lead_business_days", "pickup_fee": "=self_pay_pickup_fee", "damage_fee": "=damage_fee_beyond_wear", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"pickup_days": "=pickup_lead_business_days", "pickup_fee": "=self_pay_pickup_fee", "damage_fee": "=damage_fee_beyond_wear", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge"}

  - id: beds_self_pay_rental
    subject: [beds_self_pay_rent]
    rule: >-
      A private rental is charged `self_pay_monthly_rent` per month in advance on the anniversary of the
      delivery date, plus `self_pay_delivery_fee` with the first month, for at least `self_pay_min_months`
      months; after the minimum, a final part-month ending on the pickup date is prorated by day where
      `self_pay_daily_proration_after_first_month` is true (the monthly rent times the days used divided by
      the days in that rental month, rounded to the cent half up) and the overpaid remainder refunded to
      the card. A private rental month is charged only while the bed record is rental_active. A private
      rental never becomes a coverage rental retroactively; a family that obtains coverage starts a new
      coverage-billed record.
    eligibility:
      - id: private_rental_active
        applies_to: [beds_self_pay_rent]
        kind: state
        condition: A private rental month is charged only while the bed record is rental_active.
        evidence_fields: [beds_holdings.status, beds_holdings.beds_holding_id, beds_holdings.billing_mode]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_holdings.beds_holding_id]
          action_bindings:
            beds_holdings.beds_holding_id: beds_holding_id
        state_contract:
          field: beds_holdings.status
          allowed: [rental_active]
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"rent": "=self_pay_monthly_rent", "delivery_fee": "=self_pay_delivery_fee", "min_months": "=self_pay_min_months", "proration": "=self_pay_daily_proration_after_first_month"}
        "Variable-Height Hospital Bed (E0255)": {"rent": "=self_pay_monthly_rent", "delivery_fee": "=self_pay_delivery_fee", "min_months": "=self_pay_min_months", "proration": "=self_pay_daily_proration_after_first_month"}
        "Semi-Electric Hospital Bed (E0260)": {"rent": "=self_pay_monthly_rent", "delivery_fee": "=self_pay_delivery_fee", "min_months": "=self_pay_min_months", "proration": "=self_pay_daily_proration_after_first_month"}
        "Total Electric Hospital Bed (E0265)": {"rent": "=self_pay_monthly_rent", "delivery_fee": "=self_pay_delivery_fee", "min_months": "=self_pay_min_months", "proration": "=self_pay_daily_proration_after_first_month"}
        "Heavy-Duty Hospital Bed (E0303)": {"rent": "=self_pay_monthly_rent", "delivery_fee": "=self_pay_delivery_fee", "min_months": "=self_pay_min_months", "proration": "=self_pay_daily_proration_after_first_month"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"rent": "=self_pay_monthly_rent", "delivery_fee": "=self_pay_delivery_fee", "min_months": "=self_pay_min_months", "proration": "=self_pay_daily_proration_after_first_month"}

  - id: beds_hospice
    subject: [beds_hospice_update, beds_rental_denied]
    rule: >-
      When a patient elects hospice and the terminal diagnosis requires the bed, the hospice furnishes it
      from the election date where `hospice_billing_stop` is true: rental months beginning on or after
      hospice_election_date are not billed to coverage, and one billed in error is denied with
      hospice_enrollment and never charged to the patient. Summit Ridge then either picks the bed up on the
      family's confirmed return or keeps it in place only under a separate arrangement with the hospice,
      which this charter does not price. A hospice election is recorded only from the hospice's notice of
      election, never from the family's statement alone.
    eligibility:
      - id: hospice_notice
        applies_to: [beds_hospice_update]
        kind: authorization
        condition: A hospice election is recorded only from the hospice's notice of election, never from the family's statement alone.
        evidence_fields: [beds_holdings.hospice_election_date, beds_holdings.beds_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [beds_holdings.beds_holding_id]
          action_bindings:
            beds_holdings.beds_holding_id: beds_holding_id
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"billing_stop": "=hospice_billing_stop"}
        "Variable-Height Hospital Bed (E0255)": {"billing_stop": "=hospice_billing_stop"}
        "Semi-Electric Hospital Bed (E0260)": {"billing_stop": "=hospice_billing_stop"}
        "Total Electric Hospital Bed (E0265)": {"billing_stop": "=hospice_billing_stop"}
        "Heavy-Duty Hospital Bed (E0303)": {"billing_stop": "=hospice_billing_stop"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"billing_stop": "=hospice_billing_stop"}

  - id: beds_payer_transition
    subject: [beds_payer_update]
    rule: >-
      When a different primary coverage starts paying, a new rental period begins under it on the first
      date of service it covers, months under the earlier coverage do not count, and the class's
      `payer_entry_requalification` is needed first. The rental moves only once the new coverage is
      verified: the new coverage record is in status active.
    eligibility:
      - id: bed_new_coverage_verified
        applies_to: [beds_payer_update]
        kind: state
        condition: the new coverage record is in status active.
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active]
    params:
      per_tier:
        "Fixed-Height Hospital Bed (E0250)": {"requalification": "=payer_entry_requalification"}
        "Variable-Height Hospital Bed (E0255)": {"requalification": "=payer_entry_requalification"}
        "Semi-Electric Hospital Bed (E0260)": {"requalification": "=payer_entry_requalification"}
        "Total Electric Hospital Bed (E0265)": {"requalification": "=payer_entry_requalification"}
        "Heavy-Duty Hospital Bed (E0303)": {"requalification": "=payer_entry_requalification"}
        "Extra Heavy-Duty Hospital Bed (E0304)": {"requalification": "=payer_entry_requalification"}
