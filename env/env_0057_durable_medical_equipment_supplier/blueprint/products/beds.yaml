# Policy charter: Hospital Beds & Support Surfaces (category key: beds)
# A beds holding is one home hospital bed order through its life: qualification, delivery, capped
# rental months toward ownership (or a private month-to-month rental), an optional Group 2 powered
# mattress, hospice interaction, service, and return.

category: beds
display_name: Hospital Beds & Support Surfaces

binding:
  holding_table: beds_holdings
  event_tables: [beds_billing, beds_service]
  intake_tables: [beds_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [order_received, rental_active, suspended, patient_owned, returned, cancelled]
  transitions:
    - {from: order_received, to: rental_active, by: agent, means: "The bed is delivered and assembled; rental month 1 (coverage or private) starts."}
    - {from: order_received, to: cancelled, by: user, means: "The patient or family declines the bed before delivery."}
    - {from: rental_active, to: suspended, by: agent, means: "The patient is admitted to a hospital or skilled nursing facility and coverage rental billing pauses."}
    - {from: suspended, to: rental_active, by: agent, means: "The patient is home again and rental billing resumes."}
    - {from: rental_active, to: patient_owned, by: system, means: "The last capped coverage rental month is paid and title passes to the patient."}
    - {from: rental_active, to: returned, by: user, means: "The patient or family gives the bed back."}
    - {from: suspended, to: returned, by: user, means: "The bed is given back during a suspension."}

accounts:
  - key: rental_months
    unit: rental months
    meaning: Paid capped coverage rental months of the bed in the current rental period; a reversal takes one back.

parameter_schema:
  hcpcs_code: "HCPCS code of the bed class (string)"
  billed_as_hcpcs: "Code actually billed to coverage for the class (string)"
  coverage_status_class: "How coverage treats the class (enum: covered, upgrade_only)"
  qualification_basis: "Coverage criteria set for the class (enum: positioning_or_elevation, height_for_transfer, frequent_position_change, electric_height_convenience, weight_350_to_600, weight_over_600)"
  patient_weight_min_lbs: "Lowest patient weight for which the class is appropriate (pounds)"
  patient_weight_max_lbs: "Highest patient weight the class is rated for (pounds)"
  height_adjustment: "How bed height is adjusted (enum: fixed, manual_crank, electric)"
  head_foot_adjustment: "How head and foot sections are adjusted (enum: manual_crank, electric)"
  bed_width_in: "Sleeping surface width (inches)"
  mattress_included: "Whether a standard mattress is included in the bed payment (boolean)"
  side_rails_included: "Whether side rails are included in the bed payment (boolean)"
  fee_schedule_purchase_price: "Fee-schedule purchase amount of the billed class (USD)"
  rental_fee_months_1_3: "Fee-schedule rental for each of months 1 through 3 of the class (USD per month)"
  rental_fee_months_4_13: "Fee-schedule rental for each month from month 4 on (USD per month)"
  rental_month_anchor: "Rule fixing each rental month's service_from_date (enum: delivery_date_anniversary)"
  upgrade_notice_required: "Whether a signed notice is required before the upgrade difference over the billed class is charged (boolean)"
  support_surface_addon_allowed: "Whether a Group 2 powered mattress may be furnished with the class (boolean)"
  e0277_hcpcs: "Code of the Group 2 powered pressure-reducing mattress (string)"
  e0277_rental_fee_months_1_3: "Fee-schedule rental of the E0277 surface for months 1 through 3 (USD per month)"
  e0277_rental_fee_months_4_13: "Fee-schedule rental of the E0277 surface from month 4 on (USD per month)"
  e0277_wound_stage_min: "Lowest pressure-ulcer stage (multiple ulcers on trunk or pelvis) that qualifies for the E0277 surface (stage)"
  e0277_prior_group1_trial_months: "Months on a Group 1 surface with a comprehensive ulcer program that must precede the E0277 surface when qualifying on stage 2 ulcers (months)"
  e0277_documentation_interval_months: "Interval at which continued need for the E0277 surface must be documented (months)"
  delivery_lead_business_days: "Business days from a complete order to delivery (days)"
  hospital_discharge_same_day: "Whether delivery is guaranteed on the day of hospital discharge for orders received by noon (boolean)"
  in_home_setup_required: "Whether the bed is assembled in the home by Summit Ridge staff (boolean)"
  entrapment_check_required: "Whether a side-rail entrapment check must be documented at delivery and at each service visit (boolean)"
  maintenance_interval_months: "Calendar months between preventive maintenance visits (months)"
  reasonable_useful_lifetime_months: "Reasonable useful lifetime counted from delivery_date (calendar months)"
  frame_warranty_months: "Manufacturer frame warranty counted from delivery_date (calendar months)"
  electrical_warranty_months: "Manufacturer warranty on motors and hand pendant counted from delivery_date (calendar months); 0 when no electrical parts"
  repair_labor_rate_per_unit: "Labor rate per 15-minute unit on a repair of an owned bed (USD)"
  repair_cost_replace_threshold_pct: "Repair cost as a percentage of fee_schedule_purchase_price above which the bed is replaced (percent)"
  rental_swap_business_days: "Business days within which a malfunctioning rented bed is repaired or swapped (days)"
  break_in_need_days: "Days of a break in need, beyond the days left in the rental month it began, after which a new rental period starts (days)"
  new_period_requirements: "What a new rental period after a long break needs (enum: new_order)"
  payer_entry_requalification: "What the rental needs when a new primary coverage starts paying (enum: new_order)"
  rx_validity_months: "Calendar months a written order stays usable to deliver the bed (months)"
  hospice_billing_stop: "Whether coverage billing stops from the hospice election date because the hospice furnishes the bed (boolean)"
  self_pay_monthly_rent: "Private monthly rent of the class, charged to the card in advance (USD per month)"
  self_pay_delivery_fee: "Private rental delivery and setup fee (USD)"
  self_pay_pickup_fee: "Private rental pickup fee (USD)"
  self_pay_min_months: "Minimum private rental term (months)"
  self_pay_daily_proration_after_first_month: "Whether a private rental's final partial month after the minimum term is prorated by day (boolean)"
  pickup_lead_business_days: "Business days after a confirmed return within which the bed is picked up (days)"
  unreturned_equipment_days: "Calendar days after the confirmed pickup date after which a rented bed still not recovered is charged (days)"
  unreturned_equipment_charge: "Charge for a rented bed not recovered (USD)"
  damage_fee_beyond_wear: "Charge for a rented bed recovered damaged beyond normal wear (USD)"
  lost_stolen_report_required: "Whether replacement for loss or theft before the end of the useful lifetime requires a report (boolean)"

