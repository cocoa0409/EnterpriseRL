# Policy charter: Insurance Coverage & Patient Responsibility (category key: coverage)
# Each coverage record a patient holds with Summit Ridge is a payer-class account: it carries the
# payer's eligibility, the benefit-year accumulators and the patient responsibility that the payer's
# adjudication of equipment and supply claim lines leaves behind.

category: coverage
display_name: Insurance Coverage & Patient Responsibility

binding:
  holding_table: coverage_holdings
  event_tables: [coverage_ledger]
  intake_tables: [coverage_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {patient_balance: patient_balance, deductible_met: deductible_met, oop_met: oop_met}

lifecycle:
  states: [pending_verification, active, not_eligible, terminated]
  transitions:
    - {from: pending_verification, to: active, by: agent, means: "The payer's eligibility response shows the coverage active for the date checked, so the record can carry claims."}
    - {from: pending_verification, to: not_eligible, by: agent, means: "The payer's eligibility response shows no active coverage for the member, so the record never carries claims."}
    - {from: active, to: terminated, by: agent, means: "The payer's eligibility response or written notice shows the coverage ended; the termination date is recorded and later dates of service cannot be billed to it."}

accounts:
  - key: patient_balance
    unit: USD
    meaning: Patient responsibility owed on this coverage account; charges and refunds raise it, patient payments, secondary payments and adjustments lower it; a negative value is a credit owed to the patient.
  - key: deductible_met
    unit: USD
    meaning: Deductible the patient has satisfied on this coverage in the current benefit year.
  - key: oop_met
    unit: USD
    meaning: Patient cost share counted toward this coverage's out-of-pocket maximum in the current benefit year.

parameter_schema:
  payer_type: "Payer family the class belongs to (enum: medicare_ffs, medicare_advantage, medicaid, commercial, medicare_supplement); decides which notice, appeal and cost-share regime applies"
  coverage_role_allowed: "Priorities in which this payer class may sit on a patient account (enum: primary_only, primary_or_secondary, secondary_only)"
  annual_deductible: "Annual deductible the patient satisfies before coinsurance applies to DME claim lines when this coverage is primary (USD per benefit year)"
  dme_coinsurance_pct: "Coinsurance percentage of the allowed amount owed by the patient on DME lines after the deductible, when this coverage is primary (percent)"
  medicaid_copay_per_line: "Fixed copayment per DME claim line owed by a Medicaid recipient who is not a QMB (USD); 0.00 for classes without a per-line copay"
  out_of_pocket_max: "In-network out-of-pocket maximum for the benefit year after which the patient owes no further deductible, coinsurance or copay (USD); 0.00 means no out-of-pocket maximum exists for the class"
  oop_includes_deductible: "Whether amounts applied to the deductible also count toward the out-of-pocket maximum (boolean)"
  allowed_pct_of_fee_schedule: "Contracted allowed amount as a percentage of the Summit Ridge fee schedule (the published DMEPOS fee schedule amounts carried in each equipment charter) (percent)"
  capped_rental_months: "Number of paid rental months in one continuous rental period after which title of a capped-rental item transfers to the patient (months)"
  oxygen_rental_cap_months: "Number of paid monthly oxygen equipment payments after which equipment payments stop for the oxygen rental period (months)"
  oxygen_useful_lifetime_months: "Reasonable useful lifetime of oxygen equipment counted from the first day of the first paid month, during which the supplier must keep furnishing the equipment (months)"
  prior_auth_pmd_required: "Whether power mobility devices require an affirmed prior authorization before delivery (boolean)"
  prior_auth_pap_required: "Whether PAP devices require an affirmed prior authorization before setup (boolean)"
  prior_auth_oxygen_required: "Whether home oxygen requires an affirmed prior authorization before setup (boolean)"
  prior_auth_bed_required: "Whether hospital beds and powered support surfaces require an affirmed prior authorization before delivery (boolean)"
  prior_auth_catheter_required: "Whether urological supply programs require an affirmed prior authorization before the first shipment (boolean)"
  prior_auth_standard_decision_days: "Calendar days the payer has to decide a standard prior-authorization request after receipt (days); 0 means the class runs no prior-authorization program"
  prior_auth_expedited_decision_hours: "Hours the payer has to decide an expedited prior-authorization request (hours); 0 means no prior-authorization program"
  prior_auth_validity_days: "Calendar days an affirmed prior authorization stays usable for delivery, counted from the decision date (days); 0 means no prior-authorization program"
  referral_required_for_dme: "Whether a primary-care referral must be on file before DME is billed to this class (boolean)"
  noncovered_notice_mechanism: "Instrument that must be signed before an expected non-covered or upgraded item can be billed to the patient (enum: abn_form, plan_org_determination, financial_waiver, not_permitted, follows_primary)"
  upgrade_billing_permitted: "Whether the patient may elect an upgraded item and pay the difference over the allowed amount of the covered item (boolean)"
  timely_filing_days: "Calendar days after the date of service within which the claim must reach this payer (days)"
  redetermination_window_days: "Calendar days after the initial denial date within which a first-level appeal (redetermination or reconsideration) may be filed (days)"
  appeal_decision_days: "Calendar days the payer has to decide a first-level appeal (days)"
  eligibility_reverify_days: "Maximum age in calendar days of the last eligibility response before a rental month, shipment or delivery may be billed to this class (days)"
  secondary_crossover_automatic: "Whether a claim adjudicated by this class as primary crosses over to the secondary payer automatically, without a separate secondary claim (boolean)"
  as_secondary_covers_deductible: "When this class is secondary, whether it pays the primary's deductible portion (boolean)"
  as_secondary_coinsurance_cover_pct: "When this class is secondary, the percentage of the primary's coinsurance portion it pays (percent)"
  qmb_cost_share_billing_prohibited: "Whether a QMB flag on this class forbids billing the patient any Medicare deductible or coinsurance (boolean)"
  retro_eligibility_days: "Calendar days before the application date for which this class can grant retroactive eligibility, making earlier patient charges rebillable (days)"
  benefit_year_basis: "How the benefit year for accumulators is reckoned (enum: calendar_year, plan_year)"
  statement_cycle_days: "Calendar days between consecutive patient statements on an account carrying a balance (days)"
  statements_before_collections: "Number of statements that must have shown an unpaid balance before the account may be referred to collections (count)"
  collections_referral_permitted: "Whether an unpaid balance on this class may be referred to an outside collection agency at all (boolean)"
  collections_min_balance: "Smallest unpaid balance that may be referred to collections (USD)"
  small_balance_writeoff_max: "Largest remaining balance that is written off rather than statemented again after the final statement cycle (USD)"
  prompt_pay_discount_pct: "Discount on a charge's patient responsibility when it is paid in full within the prompt-pay window (percent); 0 means no prompt-pay discount for the class"
  prompt_pay_window_days: "Calendar days after the first statement showing the charge within which payment in full earns the prompt-pay discount (days); 0 when no discount"
  payment_plan_min_balance: "Smallest account balance for which a monthly payment arrangement may be set (USD)"
  payment_plan_min_monthly: "Smallest monthly installment accepted on a payment arrangement (USD)"
  payment_plan_max_months: "Longest payment arrangement, in monthly installments (months)"
  payment_plan_default_missed: "Consecutive missed installments after which an arrangement is defaulted (count)"
  hardship_fpl_ladder: "Financial-hardship discount ladder: household income as a percentage of the federal poverty level mapped to the hardship tier and its discount on patient responsibility (list of {max_fpl_pct, hardship_tier, discount_pct}, first matching row wins; income above the last row earns no discount)"
  hardship_documentation_days: "Calendar days after the hardship application is submitted within which the patient's income documentation must be received (days)"
  hardship_approval_valid_months: "Calendar months a hardship approval stays in force from its approval date (months)"
  hardship_lookback_days: "Calendar days before the hardship approval date within which already-posted open charges also receive the hardship discount (days)"
  credit_auto_refund_threshold: "Smallest credit balance refunded automatically without a patient request (USD); smaller credits are refunded only on request"
  refund_issue_days: "Calendar days after a credit balance arises (or after a refund request for a sub-threshold credit) within which the refund must be issued (days)"
  secondary_claim_filing_days: "Calendar days after the primary payer's adjudication within which a non-crossover secondary claim must be filed with this class acting as secondary (days)"
  missing_notice_supplier_liable: "Whether, when the required non-covered notice was not signed before delivery, the supplier absorbs the non-covered amount instead of the patient (boolean)"

