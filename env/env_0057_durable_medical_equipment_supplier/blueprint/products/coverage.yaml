      benefit_year_basis: "calendar_year"
      statement_cycle_days: 30
      statements_before_collections: 3
      collections_referral_permitted: true
      collections_min_balance: 50.0
      small_balance_writeoff_max: 4.99
      prompt_pay_discount_pct: 0
      prompt_pay_window_days: 0
      payment_plan_min_balance: 150.0
      payment_plan_min_monthly: 25.0
      payment_plan_max_months: 12
      payment_plan_default_missed: 2
      hardship_fpl_ladder: [{"max_fpl_pct": 200, "hardship_tier": "full_100", "discount_pct": 100}, {"max_fpl_pct": 250, "hardship_tier": "partial_75", "discount_pct": 75}, {"max_fpl_pct": 300, "hardship_tier": "partial_50", "discount_pct": 50}, {"max_fpl_pct": 400, "hardship_tier": "partial_25", "discount_pct": 25}]
      hardship_documentation_days: 30
      hardship_approval_valid_months: 12
      hardship_lookback_days: 180
      credit_auto_refund_threshold: 5.0
      refund_issue_days: 60
      secondary_claim_filing_days: 365
      missing_notice_supplier_liable: true

events:
  - type: coverage_add
    target: coverage_holdings
    mutation: create
    meaning: A coverage record is opened on the patient's account from the insurance card details supplied at intake or when the patient reports new insurance.
    grain: one row per coverage enrollment (payer class plus member id) held by the patient
    fields:
      customer_id: patient who holds the coverage
      variant_name: official payer-class name of the coverage
      coverage_priority: primary or secondary, per the coordination of benefits order
      member_id: member id copied verbatim from the card
      plan_name: plan name copied verbatim from the card
      effective_date: first covered date of service per the card or eligibility response
      benefit_year_start: first day of the benefit year in force
    triggers:
      - event: coverage:coverage_eligibility_check
        map: {coverage_id: coverage_id, customer_id: customer_id}

  - type: coverage_verify_active
    target: coverage_holdings
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: The payer's eligibility response confirms active coverage and the record starts carrying claims.
    grain: one row per transaction
    fields:
      last_eligibility_check_date: date of the eligibility response that confirmed the coverage
      effective_date: effective date returned by the payer
    triggers: []

  - type: coverage_verify_ineligible
    target: coverage_holdings
    mutation: {transition: {from: pending_verification, to: not_eligible}}
    meaning: The payer's eligibility response shows no active coverage for the member id supplied.
    grain: one row per transaction
    fields:
      last_eligibility_check_date: date of the eligibility response that found no coverage
    triggers: []

  - type: coverage_terminate
    target: coverage_holdings
    mutation: {transition: {from: active, to: terminated}}
    meaning: The coverage ends per the payer's eligibility response or written notice.
    grain: one row per transaction
    fields:
      termination_date: last covered date of service returned by the payer
      last_eligibility_check_date: date of the payer response or notice that showed the termination
    triggers: []

  - type: coverage_priority_update
    target: coverage_holdings
    mutation: update
    meaning: The coordination-of-benefits order between the patient's two coverage records is corrected after a coordination update request is approved.
    grain: one row per transaction
    fields:
      coverage_priority: the corrected payment order of this record
    triggers: []

  - type: coverage_payment_plan_set
    target: coverage_holdings
    mutation: update
    meaning: A monthly payment arrangement on the account balance is set, defaulted or completed.
    grain: one row per transaction
    fields:
      payment_plan_status: new state of the arrangement
      payment_plan_monthly_amount: agreed monthly installment
      payment_plan_start_date: due date of the first installment
    triggers: []

  - type: coverage_hardship_set
    target: coverage_holdings
    mutation: update
    meaning: A financial-hardship tier is approved (or lapses) on the account after the patient's income documentation is reviewed.
    grain: one row per transaction
    fields:
      hardship_tier: approved hardship tier from the hardship ladder
      hardship_approved_date: date the approval is recorded
    triggers: []

  - type: coverage_eligibility_check
    target: coverage_ledger
    meaning: A payer eligibility response (270/271 transaction or payer portal check) is recorded on the coverage.
    grain: one row per eligibility response received for the coverage
    distinguish_by: [posting_date]
    fields:
      coverage_id: coverage record checked
      customer_id: patient whose coverage was checked
      posting_date: date of the eligibility response
      eligibility_result: active, inactive or terminated as returned by the payer
    triggers: []

  - type: coverage_patient_charge
    target: coverage_ledger
    meaning: One component of patient responsibility left by the adjudication of an equipment or supply claim line (or a self-pay sale) is posted to the patient account.
    grain: one row per claim line and responsibility component
    distinguish_by: [source_category, source_bill_id, responsibility_type]
    fields:
      coverage_id: coverage account on which the patient responsibility arose (the coverage that adjudicated the line, or the primary record for a self-pay line)
      customer_id: owning patient
      posting_date: date the charge is posted
      amount: patient responsibility for this component
      line_allowed_amount: allowed amount of the originating claim line
      source_category: category of the originating line
      source_bill_id: reference of the originating line
      responsibility_type: which component of patient responsibility this charge is
    account: patient_balance
    direction: in
    triggers:
      - event: coverage:coverage_deductible_applied
        when: {responsibility_type: deductible}
        map: {coverage_id: coverage_id, customer_id: customer_id, posting_date: posting_date, amount: amount, line_allowed_amount: line_allowed_amount, source_category: source_category, source_bill_id: source_bill_id}
      - event: coverage:coverage_oop_applied
        when: {responsibility_type: [coinsurance, copay]}
        map: {coverage_id: coverage_id, customer_id: customer_id, posting_date: posting_date, amount: amount, source_category: source_category, source_bill_id: source_bill_id, responsibility_type: responsibility_type}

  - type: coverage_deductible_applied
    target: coverage_ledger
    meaning: The deductible portion of a claim line is added to the benefit-year deductible accumulator.
    grain: one row per claim line whose adjudication applied an amount to the deductible
    distinguish_by: [source_category, source_bill_id]
    fields:
      coverage_id: coverage whose deductible accumulates
      customer_id: owning patient
      posting_date: date posted
      amount: amount applied to the deductible
      line_allowed_amount: allowed amount of the originating claim line
      source_category: category of the originating line
      source_bill_id: reference of the originating line
      benefit_year: benefit year the amount counts toward
    account: deductible_met
    direction: in
    triggers: []

  - type: coverage_deductible_reset
    target: coverage_ledger
    meaning: The deductible accumulator returns to zero at the start of a new benefit year.
    grain: one row per coverage per benefit-year rollover
    distinguish_by: [benefit_year]
    fields:
      coverage_id: coverage whose accumulator resets
      customer_id: owning patient
      posting_date: first day of the new benefit year
      amount: accumulated deductible removed (the deductible_met value before the reset)
      benefit_year: the benefit year that ended
    account: deductible_met
    direction: out
    triggers: []

  - type: coverage_oop_applied
    target: coverage_ledger
    meaning: Patient cost share on a claim line is added to the benefit-year out-of-pocket accumulator.
    grain: one row per claim line and cost-share component counted toward the out-of-pocket maximum
    distinguish_by: [source_category, source_bill_id, responsibility_type]
    fields:
      coverage_id: coverage whose accumulator grows
      customer_id: owning patient
      posting_date: date posted
      amount: cost share counted
      source_category: category of the originating line
      source_bill_id: reference of the originating line
      responsibility_type: cost-share component counted (deductible, coinsurance or copay)
      benefit_year: benefit year the amount counts toward
    account: oop_met
    direction: in
    triggers: []

  - type: coverage_oop_reset
    target: coverage_ledger
    meaning: The out-of-pocket accumulator returns to zero at the start of a new benefit year.
    grain: one row per coverage per benefit-year rollover
    distinguish_by: [benefit_year]
    fields:
      coverage_id: coverage whose accumulator resets
      customer_id: owning patient
      posting_date: first day of the new benefit year
      amount: accumulated out-of-pocket amount removed
      benefit_year: the benefit year that ended
    account: oop_met
    direction: out
    triggers: []

  - type: coverage_payment
    target: coverage_ledger
    meaning: A patient payment is applied to one open charge on the account.
    grain: one row per payment and charge it is applied to (a payment spread over two charges is two rows sharing one payment reference)
    distinguish_by: [payment_reference, applied_to_entry_id]
    fields:
      coverage_id: coverage account the paid charge sits on
      customer_id: owning patient
      posting_date: date the payment is posted
      amount: portion of the payment applied to this charge (an unapplied remainder is applied with an empty applied_to_entry_id and becomes a credit)
      payment_method: card, ach, check or hsa_fsa_card
      payment_reference: check number or card confirmation code quoted by the patient
      applied_to_entry_id: the charge the payment settles
    account: patient_balance
    direction: out
    triggers: []

  - type: coverage_secondary_payment
    target: coverage_ledger
    meaning: The secondary payer's payment on the patient share of a primary-adjudicated line is applied to the charge on the primary account.
    grain: one row per secondary payer and charge paid
    distinguish_by: [applied_to_entry_id, payer_coverage_id]
    fields:
      coverage_id: primary coverage account on which the charge sits
      customer_id: owning patient
      posting_date: date the secondary remittance is posted
      amount: amount the secondary payer paid on the charge
      payer_coverage_id: the secondary coverage record that paid
      applied_to_entry_id: the charge the secondary payment settles
      line_allowed_amount: allowed amount of the originating claim line
      source_category: category of the originating line
      source_bill_id: reference of the originating line
    account: patient_balance
    direction: out
    triggers: []

  - type: coverage_adjustment
    target: coverage_ledger
    meaning: A charge is reduced or removed for a policy reason (QMB protection, hardship, prompt pay, small balance, missing notice, retroactive Medicaid).
    grain: one row per charge and adjustment reason
    distinguish_by: [applied_to_entry_id, adjustment_reason]
    fields:
      coverage_id: coverage account the adjusted charge sits on
      customer_id: owning patient
      posting_date: date the adjustment is posted
      amount: amount removed from the charge
      adjustment_reason: reason code of the adjustment
      applied_to_entry_id: the charge adjusted
    account: patient_balance
    direction: out
    triggers: []

  - type: coverage_refund
    target: coverage_ledger
    meaning: A credit balance on the account is refunded to the patient through the method of the payment that created it.
    grain: one row per payment whose overpayment is refunded
    distinguish_by: [applied_to_entry_id]
    fields:
      coverage_id: coverage account carrying the credit
      customer_id: owning patient
      posting_date: date the refund is issued
      amount: refunded amount
      payment_method: method the refund is sent through (the method of the payment refunded)
      applied_to_entry_id: the payment entry whose overpayment is refunded
    account: patient_balance
    direction: in
    triggers: []

  - type: coverage_statement
    target: coverage_ledger
    meaning: A patient statement showing the open balance of the account is issued.
    grain: one row per statement cycle of the account
    distinguish_by: [statement_cycle, posting_date]
    fields:
      coverage_id: coverage account statemented
      customer_id: owning patient
      posting_date: statement date
      statement_cycle: ordinal of the statement since the balance last stood at zero or below
      balance_due: balance printed on the statement
    triggers: []

  - type: coverage_collections_referral
    target: coverage_ledger
    meaning: An unpaid balance is referred to the outside collection agency.
    grain: one row per referral of the account balance
    distinguish_by: [posting_date]
    fields:
      coverage_id: coverage account referred
      customer_id: owning patient
      posting_date: referral date
      balance_due: balance referred
    triggers: []

measures:
  - id: coverage_msr_unpaid_statements
    window: from the most recent posting_date on which the account's running patient_balance stood at 0.00 or below (or from account opening if it never did) up to the handling date
    measure: count of coverage_statement entries on the coverage account with balance_due greater than 0.00
  - id: coverage_msr_missed_installments
    window: the run of consecutive monthly due dates, counted from payment_plan_start_date and recurring on the same day of each later month, ending at the last due date on or before the handling date
    measure: number of most recent consecutive due dates for which the coverage_payment entries posted from that due date up to the day before the next due date total less than payment_plan_monthly_amount
  - id: coverage_msr_open_charges
    window: all entries on every coverage account of the patient up to the handling date
    measure: for each coverage_patient_charge, its amount minus the coverage_payment, coverage_secondary_payment and coverage_adjustment amounts whose applied_to_entry_id is that charge; a charge is open while the result is above 0.00, and charges are ordered by posting_date then source_bill_id

policies:
  - id: coverage_agg_multi_holding
    subject: [coverage_add]
    rule: >-
      A patient may hold at most `max_per_customer` coverage records in pending_verification or active
      at the same time, one with coverage_priority primary and one with coverage_priority secondary;
      terminated and not_eligible records stay on the account as history and do not count. A payer
      class may only take a priority its `coverage_role_allowed` admits, so Medicare Supplement Plan G
      is only ever secondary and only behind Original Medicare Part B, and Medicare Advantage is never
      combined with a Medicare Supplement record. No coverage record is added while a record with the
      same variant_name and member_id is pending_verification or active. A third concurrent record is
      refused until the record it replaces has been terminated from the payer's response.
    eligibility:
      - id: no_duplicate_enrollment
        applies_to: [coverage_add]
        kind: dedup
        condition: No coverage record is added while a record with the same variant_name and member_id is pending_verification or active.
        evidence_fields: [coverage_holdings.variant_name, coverage_holdings.member_id, coverage_holdings.status, coverage_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.customer_id, coverage_holdings.member_id]
          action_bindings:
            coverage_holdings.customer_id: customer_id
            coverage_holdings.member_id: member_id
        dedup_contract:
          table: coverage_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id, member_id: member_id, variant_name: variant_name}
          duplicate_filters: {status: [pending_verification, active]}
          distinct_fields: []
    params:
      max_per_customer: 2
      max_primary_concurrent: 1
      max_secondary_concurrent: 1

  - id: coverage_agg_coordination
    subject: [coverage_secondary_payment, coverage_priority_update, coverage_patient_charge]
    rule: >-
      Claim lines adjudicate on the primary record first, and the patient responsibility the primary
      leaves is posted as charges on the primary account. When a secondary record exists, the secondary
      pays on those charges: on the deductible charge only when its `as_secondary_covers_deductible` is
      true, and on the coinsurance charge the percentage `as_secondary_coinsurance_cover_pct` of that
      charge, rounded to the cent half up; it pays nothing on copay, non_covered_with_notice,
      upgrade_difference, self_pay, repair_patient_share or unreturned_equipment charges. A secondary
      payment is posted on the primary account against the charge it settles, carrying the secondary
      record as payer_coverage_id, and never exceeds the open amount of that charge. When the primary's
      `secondary_crossover_automatic` is true the secondary payment follows crossover without a
      separate claim; otherwise the secondary claim must be filed within the secondary class's
      `secondary_claim_filing_days` after the primary adjudication, and a secondary payment refused
      for late filing leaves the charge with the patient. Medicaid Fee-for-Service is always the payer
      of last resort: when it is held together with any other coverage it is secondary. The paying
      secondary coverage record is in status active or terminated. A coverage_priority correction is
      made only after a coordination_update request on the record is approved.
    eligibility:
      - id: secondary_record_standing
        applies_to: [coverage_secondary_payment]
        kind: state
        condition: The paying secondary coverage record is in status active or terminated.
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: payer_coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active, terminated]
      - id: coordination_update_approved
        applies_to: [coverage_priority_update]
        kind: authorization
        condition: A coverage_priority correction is made only after a coordination_update request on the record is approved.
        evidence_fields: [coverage_requests.request_type, coverage_requests.request_status, coverage_requests.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_requests.coverage_id]
          action_bindings:
            coverage_requests.coverage_id: coverage_id
    params:
      per_tier:
        Original Medicare Part B: {covers_deductible: "=as_secondary_covers_deductible", coinsurance_cover_pct: "=as_secondary_coinsurance_cover_pct", crossover: "=secondary_crossover_automatic"}
        Medicare Advantage HMO: {covers_deductible: "=as_secondary_covers_deductible", coinsurance_cover_pct: "=as_secondary_coinsurance_cover_pct", crossover: "=secondary_crossover_automatic"}
        Medicare Advantage PPO: {covers_deductible: "=as_secondary_covers_deductible", coinsurance_cover_pct: "=as_secondary_coinsurance_cover_pct", crossover: "=secondary_crossover_automatic"}
        Medicaid Fee-for-Service: {covers_deductible: "=as_secondary_covers_deductible", coinsurance_cover_pct: "=as_secondary_coinsurance_cover_pct", crossover: "=secondary_crossover_automatic"}
        Commercial HMO: {covers_deductible: "=as_secondary_covers_deductible", coinsurance_cover_pct: "=as_secondary_coinsurance_cover_pct", crossover: "=secondary_crossover_automatic"}
        Commercial PPO: {covers_deductible: "=as_secondary_covers_deductible", coinsurance_cover_pct: "=as_secondary_coinsurance_cover_pct", crossover: "=secondary_crossover_automatic"}
        Medicare Supplement Plan G: {covers_deductible: "=as_secondary_covers_deductible", coinsurance_cover_pct: "=as_secondary_coinsurance_cover_pct", crossover: "=secondary_crossover_automatic"}
    formula:
      secondary_on_coinsurance: round(amount * as_secondary_coinsurance_cover_pct / 100, 2)

  - id: coverage_cost_share
    subject: [coverage_patient_charge, coverage_deductible_applied, coverage_oop_applied]
    rule: >-
      The patient responsibility on a covered claim line adjudicated by a primary record is split into
      components in this order. The deductible component is the smaller of the line's allowed amount
      and the deductible still unmet (`annual_deductible` minus the record's deductible_met). The
      coinsurance component is `dme_coinsurance_pct` of the allowed amount left after the deductible
      component, rounded to the cent half up. A Medicaid Fee-for-Service primary record that is not a
      QMB record carries instead a copay component of `medicaid_copay_per_line` per claim line and no
      deductible or coinsurance. When the class has an out-of-pocket maximum (`out_of_pocket_max`
      above 0.00), the components together never exceed the room left under it (the maximum minus
      oop_met), the reduction falling on the coinsurance component first, then the copay, then the
      deductible; deductible amounts count toward oop_met only when `oop_includes_deductible` is true.
      Each non-zero component posts as its own coverage_patient_charge; a component of 0.00 is not
      posted. The deductible component also posts to deductible_met and the coinsurance and copay
      components post to oop_met, in the benefit year of the line's date of service. Charges post only
      on a coverage record whose coverage covered the line's date of service: the coverage record is
      in status active or terminated. Lines adjudicated as non-covered, upgrade differences and
      self-pay sales are not split by this policy; they post as a single charge of their own
      responsibility_type under the equipment category's rules.
    eligibility:
      - id: covering_record
        applies_to: [coverage_patient_charge]
        kind: state
        condition: 'the coverage record is in status active or terminated.'
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_id, coverage_holdings.effective_date, coverage_holdings.termination_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active, terminated]
    params:
      per_tier:
        Original Medicare Part B: {deductible: "=annual_deductible", coinsurance_pct: "=dme_coinsurance_pct", copay: "=medicaid_copay_per_line", oop_max: "=out_of_pocket_max"}
        Medicare Advantage HMO: {deductible: "=annual_deductible", coinsurance_pct: "=dme_coinsurance_pct", copay: "=medicaid_copay_per_line", oop_max: "=out_of_pocket_max"}
        Medicare Advantage PPO: {deductible: "=annual_deductible", coinsurance_pct: "=dme_coinsurance_pct", copay: "=medicaid_copay_per_line", oop_max: "=out_of_pocket_max"}
        Medicaid Fee-for-Service: {deductible: "=annual_deductible", coinsurance_pct: "=dme_coinsurance_pct", copay: "=medicaid_copay_per_line", oop_max: "=out_of_pocket_max"}
        Commercial HMO: {deductible: "=annual_deductible", coinsurance_pct: "=dme_coinsurance_pct", copay: "=medicaid_copay_per_line", oop_max: "=out_of_pocket_max"}
        Commercial PPO: {deductible: "=annual_deductible", coinsurance_pct: "=dme_coinsurance_pct", copay: "=medicaid_copay_per_line", oop_max: "=out_of_pocket_max"}
        Medicare Supplement Plan G: {deductible: "=annual_deductible", coinsurance_pct: "=dme_coinsurance_pct", copay: "=medicaid_copay_per_line", oop_max: "=out_of_pocket_max"}
    formula:
      deductible_component: min(line_allowed_amount, max(0, annual_deductible - deductible_met))
      coinsurance_component: round((line_allowed_amount - deductible_component) * dme_coinsurance_pct / 100, 2)
      oop_room_when_capped: max(0, out_of_pocket_max - oop_met)

  - id: coverage_qmb_protection
    subject: [coverage_adjustment, coverage_patient_charge]
    rule: >-
      A patient whose Medicaid Fee-for-Service record carries qmb_status qmb may not be billed any
      Medicare deductible or coinsurance on lines adjudicated by Original Medicare Part B or a Medicare
      Advantage record, and owes no Medicaid copay either. The QMB protection applies only while the
      Medicaid record is active: the Medicaid record carrying qmb_status qmb is in status active. Such
      components are still posted as charges so that the accumulators move, and on the same posting
      date each is removed in full by a coverage_adjustment with adjustment_reason
      qmb_cost_share_prohibited applied to that charge. The protection never covers
      non_covered_with_notice, upgrade_difference, self_pay or unreturned_equipment charges, which
      follow their own rules. When QMB protection applies to a charge, no hardship, prompt-pay or
      small-balance adjustment is posted on it.
    eligibility:
      - id: qmb_record_active
        applies_to: [coverage_adjustment]
        kind: state
        condition: the Medicaid record carrying qmb_status qmb is in status active.
        evidence_fields: [coverage_holdings.status, coverage_holdings.qmb_status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: medicaid_coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active]
    params:
      per_tier:
        Original Medicare Part B: {qmb_prohibited: "=qmb_cost_share_billing_prohibited"}
        Medicare Advantage HMO: {qmb_prohibited: "=qmb_cost_share_billing_prohibited"}
        Medicare Advantage PPO: {qmb_prohibited: "=qmb_cost_share_billing_prohibited"}
        Medicaid Fee-for-Service: {qmb_prohibited: "=qmb_cost_share_billing_prohibited"}
        Commercial HMO: {qmb_prohibited: "=qmb_cost_share_billing_prohibited"}
        Commercial PPO: {qmb_prohibited: "=qmb_cost_share_billing_prohibited"}
        Medicare Supplement Plan G: {qmb_prohibited: "=qmb_cost_share_billing_prohibited"}

  - id: coverage_evt_eligibility
    subject: [coverage_eligibility_check, coverage_verify_active, coverage_verify_ineligible, coverage_terminate]
    rule: >-
      Every coverage record is checked with the payer when it is added, and an equipment rental month,
      supply shipment or delivery may be billed to a record only when its last_eligibility_check_date
      is no more than `eligibility_reverify_days` calendar days before the date of service; an older
      check is refreshed with a new eligibility check first. A response of active moves a
      pending_verification record to active; a response of inactive moves a pending_verification record
      to not_eligible; a response of terminated on an active record moves it to terminated with the
      payer's termination date. Coverage is ended only from the payer's eligibility response or written
      notice, never from the patient's statement alone: a coverage record is terminated only when an
      eligibility check on it returned terminated. A patient who reports new insurance has the new
      record added and checked; the old record stays active until its own check returns terminated.
    eligibility:
      - id: termination_from_payer
        applies_to: [coverage_terminate]
        kind: authorization
        condition: 'a coverage record is terminated only when an eligibility check on it returned terminated.'
        evidence_fields: [coverage_ledger.eligibility_result, coverage_ledger.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_ledger.coverage_id]
          action_bindings:
            coverage_ledger.coverage_id: coverage_id
    params:
      per_tier:
        Original Medicare Part B: {reverify_days: "=eligibility_reverify_days"}
        Medicare Advantage HMO: {reverify_days: "=eligibility_reverify_days"}
        Medicare Advantage PPO: {reverify_days: "=eligibility_reverify_days"}
        Medicaid Fee-for-Service: {reverify_days: "=eligibility_reverify_days"}
        Commercial HMO: {reverify_days: "=eligibility_reverify_days"}
        Commercial PPO: {reverify_days: "=eligibility_reverify_days"}
        Medicare Supplement Plan G: {reverify_days: "=eligibility_reverify_days"}

  - id: coverage_evt_payment
    subject: [coverage_payment]
    rule: >-
      A patient payment is posted for the exact amount the patient pays, with the payment_method used
      and the payment_reference the patient quotes copied verbatim. A payment reference already posted
      on the account is never posted again for the same charge. The payment is applied to the charge
      the patient names from a statement; when the patient names none it is applied under
      coverage_agg_payment_allocation. When the payment exceeds the open amount of the charges it is
      applied to, the remainder posts with an empty applied_to_entry_id and leaves a credit on the
      account, handled under coverage_credit_refund. A payment on an account with an active payment
      arrangement counts toward the installment of the due date it follows.
    eligibility:
      - id: payment_not_reposted
        applies_to: [coverage_payment]
        kind: dedup
        condition: A payment reference already posted on the account is never posted again for the same charge.
        evidence_fields: [coverage_ledger.payment_reference, coverage_ledger.applied_to_entry_id, coverage_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_ledger.payment_reference, coverage_ledger.applied_to_entry_id]
          action_bindings:
            coverage_ledger.payment_reference: payment_reference
            coverage_ledger.applied_to_entry_id: applied_to_entry_id
        dedup_contract:
          table: coverage_ledger
          mode: separate_record
          object_bindings: {payment_reference: payment_reference, applied_to_entry_id: applied_to_entry_id}
          duplicate_filters: {event_type: [coverage_payment]}
          distinct_fields: []
    measures: [coverage_msr_open_charges]

  - id: coverage_agg_payment_allocation
    subject: [coverage_payment, coverage_secondary_payment]
    rule: >-
      A patient payment that names no charge is allocated across all of the patient's coverage
      accounts, oldest open charge first: open charges are taken in the order of
      coverage_msr_open_charges and each receives the smaller of its open amount and the payment still
      unallocated, one coverage_payment entry per charge, until the payment is used up. Charges of
      responsibility_type unreturned_equipment are taken last, after every other open charge. A
      secondary payment is never reallocated: it settles only the charge it adjudicated. The patient's
      total balance is the sum of patient_balance across all of their coverage accounts, and that
      total is what is quoted when the patient asks what they owe.
    eligibility: []
    measures: [coverage_msr_open_charges]

  - id: coverage_credit_refund
    subject: [coverage_refund]
    rule: >-
      A coverage account whose patient_balance stands below 0.00 carries a credit owed to the patient.
      A credit of at least `credit_auto_refund_threshold` is refunded without a request; a smaller credit
      is refunded only when the patient asks for it through a refund_request. The refund amount is the
      whole credit, sent through the payment_method of the payment that created it and applied to that
      payment entry; a credit created by several payments is refunded against the most recent of them
      first. Before refunding, the credit is first applied to any open charge on the patient's other
      coverage accounts, and only what remains is refunded. A payment entry that has already been
      refunded is never refunded again. The refund is issued within `refund_issue_days` calendar days
      after the credit arose or the request was received.
    eligibility:
      - id: refund_once_per_payment
        applies_to: [coverage_refund]
        kind: dedup
        condition: A payment entry that has already been refunded is never refunded again.
        evidence_fields: [coverage_ledger.applied_to_entry_id, coverage_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_ledger.applied_to_entry_id]
          action_bindings:
            coverage_ledger.applied_to_entry_id: applied_to_entry_id
        dedup_contract:
          table: coverage_ledger
          mode: separate_record
          object_bindings: {applied_to_entry_id: applied_to_entry_id}
          duplicate_filters: {event_type: [coverage_refund]}
          distinct_fields: []
    params:
      per_tier:
        Original Medicare Part B: {auto_threshold: "=credit_auto_refund_threshold", issue_days: "=refund_issue_days"}
        Medicare Advantage HMO: {auto_threshold: "=credit_auto_refund_threshold", issue_days: "=refund_issue_days"}
        Medicare Advantage PPO: {auto_threshold: "=credit_auto_refund_threshold", issue_days: "=refund_issue_days"}
        Medicaid Fee-for-Service: {auto_threshold: "=credit_auto_refund_threshold", issue_days: "=refund_issue_days"}
        Commercial HMO: {auto_threshold: "=credit_auto_refund_threshold", issue_days: "=refund_issue_days"}
        Commercial PPO: {auto_threshold: "=credit_auto_refund_threshold", issue_days: "=refund_issue_days"}
        Medicare Supplement Plan G: {auto_threshold: "=credit_auto_refund_threshold", issue_days: "=refund_issue_days"}
    formula:
      refund_amount: abs(patient_balance) if patient_balance < 0 else 0

  - id: coverage_payment_plan
    subject: [coverage_payment_plan_set]
    rule: >-
      A monthly payment arrangement may be set on a coverage account whose patient_balance is at least
      `payment_plan_min_balance`. The installment is the larger of `payment_plan_min_monthly` and the
      balance divided by `payment_plan_max_months`, rounded to the cent half up; the patient may choose
      a larger installment but never a smaller one. The arrangement is set only after the patient signs
      it: a payment_plan_agreement request for this account is in status approved. The arrangement can
      only be set while the account is in status active or terminated. The first installment falls due
      on the payment_plan_start_date the patient chooses, no later than one statement cycle after the
      agreement is approved. When coverage_msr_missed_installments reaches
      `payment_plan_default_missed` the arrangement becomes defaulted; when the balance reaches 0.00 it
      becomes completed. A defaulted arrangement is not reinstated; a new agreement is required.
    eligibility:
      - id: plan_agreement_signed
        applies_to: [coverage_payment_plan_set]
        kind: authorization
        condition: a payment_plan_agreement request for this account is in status approved.
        evidence_fields: [coverage_requests.request_type, coverage_requests.request_status, coverage_requests.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_requests.coverage_id]
          action_bindings:
            coverage_requests.coverage_id: coverage_id
      - id: plan_account_standing
        applies_to: [coverage_payment_plan_set]
        kind: state
        condition: The arrangement can only be set while the account is in status active or terminated.
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active, terminated]
    params:
      per_tier:
        Original Medicare Part B: {min_balance: "=payment_plan_min_balance", min_monthly: "=payment_plan_min_monthly", max_months: "=payment_plan_max_months"}
        Medicare Advantage HMO: {min_balance: "=payment_plan_min_balance", min_monthly: "=payment_plan_min_monthly", max_months: "=payment_plan_max_months"}
        Medicare Advantage PPO: {min_balance: "=payment_plan_min_balance", min_monthly: "=payment_plan_min_monthly", max_months: "=payment_plan_max_months"}
        Medicaid Fee-for-Service: {min_balance: "=payment_plan_min_balance", min_monthly: "=payment_plan_min_monthly", max_months: "=payment_plan_max_months"}
        Commercial HMO: {min_balance: "=payment_plan_min_balance", min_monthly: "=payment_plan_min_monthly", max_months: "=payment_plan_max_months"}
        Commercial PPO: {min_balance: "=payment_plan_min_balance", min_monthly: "=payment_plan_min_monthly", max_months: "=payment_plan_max_months"}
        Medicare Supplement Plan G: {min_balance: "=payment_plan_min_balance", min_monthly: "=payment_plan_min_monthly", max_months: "=payment_plan_max_months"}
    formula:
      monthly_installment: max(payment_plan_min_monthly, round(patient_balance / payment_plan_max_months, 2))
    measures: [coverage_msr_missed_installments]

  - id: coverage_hardship
    subject: [coverage_hardship_set, coverage_adjustment]
    rule: >-
      Financial hardship is decided individually, never routinely: a patient applies through a
      hardship_application request and supplies household income documentation, and the hardship tier
      is the first row of `hardship_fpl_ladder` whose max_fpl_pct is at or above the documented
      household income as a percentage of the federal poverty level; income above the last row earns
      no tier. The hardship approval is recorded no later than `hardship_documentation_days` after the
      hardship application is submitted, counting calendar days from the day after the submitted_date
      with the boundary day included; an application whose documentation is not complete by then is
      denied. An approved tier stays in force for `hardship_approval_valid_months` calendar months from
      hardship_approved_date. While it is in force, each charge of responsibility_type deductible,
      coinsurance, copay or repair_patient_share receives a coverage_adjustment with adjustment_reason
      hardship_discount equal to the tier's discount_pct of the charge's open amount, rounded to the
      cent half up; charges already open on the approval date receive it only if posted within
      `hardship_lookback_days` before the approval date. Self-pay, upgrade_difference,
      non_covered_with_notice and unreturned_equipment charges never receive a hardship discount.
    eligibility:
      - id: documentation_window
        applies_to: [coverage_hardship_set]
        kind: time
        condition: The hardship approval is recorded no later than `hardship_documentation_days` after the hardship application is submitted, counting calendar days from the day after the submitted_date with the boundary day included; an application whose documentation is not complete by then is denied.
        evidence_fields: [coverage_requests.submitted_date, coverage_requests.request_type, coverage_requests.coverage_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_requests.coverage_request_id]
          action_bindings:
            coverage_requests.coverage_request_id: coverage_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hardship application is submitted
          anchor_source: coverage_requests.submitted_date
          relation: not_after
          duration_source: variants.hardship_documentation_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after the submitted_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        Original Medicare Part B: {ladder: "=hardship_fpl_ladder", doc_days: "=hardship_documentation_days", valid_months: "=hardship_approval_valid_months", lookback_days: "=hardship_lookback_days"}
        Medicare Advantage HMO: {ladder: "=hardship_fpl_ladder", doc_days: "=hardship_documentation_days", valid_months: "=hardship_approval_valid_months", lookback_days: "=hardship_lookback_days"}
        Medicare Advantage PPO: {ladder: "=hardship_fpl_ladder", doc_days: "=hardship_documentation_days", valid_months: "=hardship_approval_valid_months", lookback_days: "=hardship_lookback_days"}
        Medicaid Fee-for-Service: {ladder: "=hardship_fpl_ladder", doc_days: "=hardship_documentation_days", valid_months: "=hardship_approval_valid_months", lookback_days: "=hardship_lookback_days"}
        Commercial HMO: {ladder: "=hardship_fpl_ladder", doc_days: "=hardship_documentation_days", valid_months: "=hardship_approval_valid_months", lookback_days: "=hardship_lookback_days"}
        Commercial PPO: {ladder: "=hardship_fpl_ladder", doc_days: "=hardship_documentation_days", valid_months: "=hardship_approval_valid_months", lookback_days: "=hardship_lookback_days"}
        Medicare Supplement Plan G: {ladder: "=hardship_fpl_ladder", doc_days: "=hardship_documentation_days", valid_months: "=hardship_approval_valid_months", lookback_days: "=hardship_lookback_days"}

  - id: coverage_evt_adjustments
    subject: [coverage_adjustment]
    rule: >-
      Besides QMB protection and hardship, three adjustments exist. A prompt-pay discount of
      `prompt_pay_discount_pct` of a charge applies when the class offers one and the patient pays the
      charge in full no later than `prompt_pay_window_days` calendar days after the first statement
      showing it; it is posted with adjustment_reason prompt_pay_discount on the paying day and the
      payment due is reduced by it. A charge of responsibility_type non_covered_with_notice or
      upgrade_difference whose equipment record shows no signed notice on file before delivery is
      removed in full with adjustment_reason missing_notice_writeoff when `missing_notice_supplier_liable`
      is true. After the final statement cycle an account balance of no more than
      `small_balance_writeoff_max` is written off with adjustment_reason small_balance_writeoff.
      When an equipment or supply category reverses a paid claim line, every open charge stemming from
      that line is removed in full with adjustment_reason claim_reversal on the reversal date.
      Adjustments on one charge never stack beyond its open amount: when a hardship discount and a
      prompt-pay discount could both apply to the same charge, only the larger one is posted, and QMB
      protection displaces both.
    eligibility: []
    params:
      per_tier:
        Original Medicare Part B: {prompt_pct: "=prompt_pay_discount_pct", prompt_days: "=prompt_pay_window_days", small_max: "=small_balance_writeoff_max"}
        Medicare Advantage HMO: {prompt_pct: "=prompt_pay_discount_pct", prompt_days: "=prompt_pay_window_days", small_max: "=small_balance_writeoff_max"}
        Medicare Advantage PPO: {prompt_pct: "=prompt_pay_discount_pct", prompt_days: "=prompt_pay_window_days", small_max: "=small_balance_writeoff_max"}
        Medicaid Fee-for-Service: {prompt_pct: "=prompt_pay_discount_pct", prompt_days: "=prompt_pay_window_days", small_max: "=small_balance_writeoff_max"}
        Commercial HMO: {prompt_pct: "=prompt_pay_discount_pct", prompt_days: "=prompt_pay_window_days", small_max: "=small_balance_writeoff_max"}
        Commercial PPO: {prompt_pct: "=prompt_pay_discount_pct", prompt_days: "=prompt_pay_window_days", small_max: "=small_balance_writeoff_max"}
        Medicare Supplement Plan G: {prompt_pct: "=prompt_pay_discount_pct", prompt_days: "=prompt_pay_window_days", small_max: "=small_balance_writeoff_max"}
    formula:
      prompt_pay_discount: round(amount * prompt_pay_discount_pct / 100, 2)

  - id: coverage_statement_collections
    subject: [coverage_statement, coverage_collections_referral]
    rule: >-
      An account whose patient_balance is above 0.00 receives a statement every `statement_cycle_days`
      calendar days, numbered from 1 since the balance last stood at 0.00 or below. An account may be
      referred to collections only when coverage_msr_unpaid_statements has reached
      `statements_before_collections`, the balance is at least `collections_min_balance` and the class
      permits referral (`collections_referral_permitted`). It is never referred while an arrangement is
      in good standing: the account's payment_plan_status is none, defaulted or completed. It is also
      never referred while a hardship_application request on the account is submitted, while any
      charge in the balance stems from a claim line with a pending appeal request in its equipment
      category, or while the patient is QMB-protected.
    eligibility:
      - id: no_active_arrangement
        applies_to: [coverage_collections_referral]
        kind: state
        condition: "the account's payment_plan_status is none, defaulted or completed."
        evidence_fields: [coverage_holdings.payment_plan_status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.payment_plan_status
          allowed: [none, defaulted, completed]
    params:
      per_tier:
        Original Medicare Part B: {cycle_days: "=statement_cycle_days", statements: "=statements_before_collections", min_balance: "=collections_min_balance", permitted: "=collections_referral_permitted"}
        Medicare Advantage HMO: {cycle_days: "=statement_cycle_days", statements: "=statements_before_collections", min_balance: "=collections_min_balance", permitted: "=collections_referral_permitted"}
        Medicare Advantage PPO: {cycle_days: "=statement_cycle_days", statements: "=statements_before_collections", min_balance: "=collections_min_balance", permitted: "=collections_referral_permitted"}
        Medicaid Fee-for-Service: {cycle_days: "=statement_cycle_days", statements: "=statements_before_collections", min_balance: "=collections_min_balance", permitted: "=collections_referral_permitted"}
        Commercial HMO: {cycle_days: "=statement_cycle_days", statements: "=statements_before_collections", min_balance: "=collections_min_balance", permitted: "=collections_referral_permitted"}
        Commercial PPO: {cycle_days: "=statement_cycle_days", statements: "=statements_before_collections", min_balance: "=collections_min_balance", permitted: "=collections_referral_permitted"}
        Medicare Supplement Plan G: {cycle_days: "=statement_cycle_days", statements: "=statements_before_collections", min_balance: "=collections_min_balance", permitted: "=collections_referral_permitted"}
    measures: [coverage_msr_unpaid_statements]

  - id: coverage_accumulators
    subject: [coverage_deductible_applied, coverage_oop_applied, coverage_deductible_reset, coverage_oop_reset]
    rule: >-
      Accumulators belong to the benefit year reckoned by `benefit_year_basis`: a calendar_year class
      rolls over on January 1, a plan_year class on the anniversary of benefit_year_start. On the first
      day of a new benefit year the deductible_met and oop_met of the record are each reset to 0.00 by
      a reset entry equal to the amount accumulated in the year that ended. Amounts accumulate in the
      benefit year of the claim line's date of service, not of its posting date, so a line from the
      prior year adjudicated after the rollover adds to the prior year and does not reduce what the
      patient owes toward the new year's deductible.
    eligibility: []
    params:
      per_tier:
        Original Medicare Part B: {basis: "=benefit_year_basis", includes_deductible: "=oop_includes_deductible"}
        Medicare Advantage HMO: {basis: "=benefit_year_basis", includes_deductible: "=oop_includes_deductible"}
        Medicare Advantage PPO: {basis: "=benefit_year_basis", includes_deductible: "=oop_includes_deductible"}
        Medicaid Fee-for-Service: {basis: "=benefit_year_basis", includes_deductible: "=oop_includes_deductible"}
        Commercial HMO: {basis: "=benefit_year_basis", includes_deductible: "=oop_includes_deductible"}
        Commercial PPO: {basis: "=benefit_year_basis", includes_deductible: "=oop_includes_deductible"}
        Medicare Supplement Plan G: {basis: "=benefit_year_basis", includes_deductible: "=oop_includes_deductible"}

  - id: coverage_retro_medicaid
    subject: [coverage_add, coverage_adjustment]
    rule: >-
      When a Medicaid Fee-for-Service record is added with an effective_date earlier than the date it
      is added, charges on the patient's other coverage accounts whose originating line's date of
      service falls on or after that effective_date and no more than `retro_eligibility_days` before
      the date the record is added become rebillable to Medicaid: each such open charge is removed in
      full with adjustment_reason retro_medicaid_rebill, and any patient payment already applied to
      such a charge is refunded under coverage_credit_refund once the adjustment leaves a credit. Charges
      outside that window stay with the patient.
    eligibility: []
    params:
      per_tier:
        Original Medicare Part B: {retro_days: "=retro_eligibility_days"}
        Medicare Advantage HMO: {retro_days: "=retro_eligibility_days"}
        Medicare Advantage PPO: {retro_days: "=retro_eligibility_days"}
        Medicaid Fee-for-Service: {retro_days: "=retro_eligibility_days"}
        Commercial HMO: {retro_days: "=retro_eligibility_days"}
        Commercial PPO: {retro_days: "=retro_eligibility_days"}
        Medicare Supplement Plan G: {retro_days: "=retro_eligibility_days"}

  - id: coverage_payer_program_rules
    subject: [coverage_patient_charge, coverage_eligibility_check, coverage_adjustment]
    rule: >-
      Each payer class carries the program rules that the equipment and supply charters read from the
      patient's primary coverage record. The class's `payer_type` decides which notice, appeal and
      cost-share regime applies. Contracted allowed amounts are `allowed_pct_of_fee_schedule` percent of
      the fee schedule printed in each equipment or supply charter. Capped-rental items transfer title
      after `capped_rental_months` paid months in one continuous rental period; oxygen equipment payments
      stop after `oxygen_rental_cap_months` paid months, and the supplier keeps furnishing oxygen
      equipment until `oxygen_useful_lifetime_months` have passed from the first paid month. Prior
      authorization is required before delivery of power mobility devices where `prior_auth_pmd_required`
      is true, before PAP setup where `prior_auth_pap_required` is true, before oxygen setup where
      `prior_auth_oxygen_required` is true, before hospital beds and powered surfaces where
      `prior_auth_bed_required` is true, and before the first urological shipment where
      `prior_auth_catheter_required` is true; the payer decides a standard request within
      `prior_auth_standard_decision_days` calendar days and an expedited one within
      `prior_auth_expedited_decision_hours` hours, and an affirmed authorization is usable for
      `prior_auth_validity_days` calendar days from its decision date. Where `referral_required_for_dme`
      is true a primary-care referral must be on file before DME is billed. An item expected to be
      denied, or an upgrade where `upgrade_billing_permitted` is true, may be charged to the patient only
      after the patient signed the class's `noncovered_notice_mechanism` before delivery; under
      not_permitted the patient is never charged, and under follows_primary the primary's instrument
      governs. A claim must reach the payer within `timely_filing_days` calendar days of the date of
      service. A first-level appeal must be filed within `redetermination_window_days` calendar days of
      the denial and is decided within `appeal_decision_days`. A line denied because Summit Ridge missed
      a prior authorization, a referral, the filing limit or a required notice is never charged to the
      patient; any charge posted for it is removed with adjustment_reason missing_notice_writeoff.
    eligibility: []
    params:
      per_tier:
