events:
  - type: mobility_order_create
    target: mobility_holdings
    mutation: create
    meaning: A written wheelchair order arrives and a wheelchair record is opened.
    grain: one row per chair order
    fields:
      customer_id: patient
      variant_name: class ordered (the class the patient will receive)
      coverage_id: primary coverage billed; empty for self-pay
      covered_class: class the coverage pays for
      ordering_npi: ordering practitioner NPI
      referral_source: kind of referral partner
      order_date: date the order was received
      f2f_exam_date: face-to-face examination date
      specialty_eval_date: specialty evaluation date
      patient_weight_lbs: patient weight on the order
    triggers: []

  - type: mobility_notice_signed
    target: mobility_holdings
    mutation: update
    meaning: The patient signs the coverage class's notice accepting financial responsibility for an upgrade or non-covered item.
    grain: one row per transaction
    fields:
      notice_on_file: signed
    triggers: []

  - type: mobility_delivery_complete
    target: mobility_holdings
    mutation: {transition: {from: order_received, to: rental_active}}
    meaning: The chair is delivered under a capped rental.
    grain: one row per transaction
    fields:
      delivery_date: delivery date
      rental_period_start_date: first day of the rental period (the delivery date)
      serial_number: chair serial number
    triggers: []

  - type: mobility_purchase_delivered
    target: mobility_holdings
    mutation: {transition: {from: order_received, to: patient_owned}}
    meaning: The chair is delivered as a purchase and becomes the patient's property.
    grain: one row per transaction
    fields:
      delivery_date: delivery date
      ownership_date: date title passed (the delivery date)
      serial_number: chair serial number
    triggers: []

  - type: mobility_order_cancel
    target: mobility_holdings
    mutation: {transition: {from: order_received, to: cancelled}}
    meaning: The patient declines the chair before delivery.
    grain: one row per transaction
    fields:
      closed_date: date declined
    triggers: []

  - type: mobility_purchase_election
    target: mobility_holdings
    mutation: {transition: {from: rental_active, to: patient_owned}}
    meaning: The patient elects to buy a rented chair of a class with a first-month purchase option.
    grain: one row per transaction
    fields:
      ownership_date: date the election was made
    triggers: []

  - type: mobility_title_transfer
    target: mobility_holdings
    mutation: {transition: {from: rental_active, to: patient_owned}}
    meaning: The capped rental completes and title passes to the patient.
    grain: one row per transaction
    fields:
      ownership_date: date title passed
    triggers: []

  - type: mobility_suspend
    target: mobility_holdings
    mutation: {transition: {from: rental_active, to: suspended}}
    meaning: Rental billing pauses for an inpatient or skilled nursing stay.
    grain: one row per transaction
    fields:
      suspended_date: admission date
    triggers: []

  - type: mobility_resume
    target: mobility_holdings
    mutation: {transition: {from: suspended, to: rental_active}}
    meaning: The patient is home again and rental billing resumes.
    grain: one row per transaction
    fields:
      suspended_date: cleared on resumption
    triggers: []

  - type: mobility_return
    target: mobility_holdings
    mutation: {transition: [{from: rental_active, to: returned}, {from: suspended, to: returned}]}
    meaning: The patient confirms the rented chair is given back.
    grain: one row per transaction
    fields:
      closed_date: date of the confirmed return
    triggers: []

  - type: mobility_replace
    target: mobility_holdings
    mutation: {transition: {from: patient_owned, to: replaced}}
    meaning: An owned chair is retired because a replacement record is opened.
    grain: one row per transaction
    fields:
      closed_date: date the replacement order was opened
    triggers: []

  - type: mobility_payer_update
    target: mobility_holdings
    mutation: update
    meaning: A different primary coverage starts paying for the rented chair and a new rental period begins.
    grain: one row per transaction
    fields:
      coverage_id: new primary coverage
      rental_period_start_date: first date of service under the new coverage
    triggers: []

  - type: mobility_period_restart
    target: mobility_holdings
    mutation: update
    meaning: After a break in need longer than allowed, a new rental period starts under a new order.
    grain: one row per transaction
    fields:
      rental_period_start_date: first day of the new rental period
      f2f_exam_date: new face-to-face date where required
    triggers: []

  - type: mobility_rental_paid
    target: mobility_billing
    meaning: The payer pays one capped-rental month of the chair.
    grain: one row per paid rental month within a rental period under one coverage
    distinguish_by: [coverage_id, rental_month_number, service_from_date]
    fields:
      coverage_id: coverage that paid
      hcpcs_code: covered class code
      billing_modifier: KH, KI or KJ
      rental_month_number: month ordinal
      service_from_date: first day of the month
      adjudication_date: remittance date
      allowed_amount: allowed amount for the covered class
      payer_paid_amount: payer payment
      patient_responsibility: patient cost share
      upgrade_difference_amount: patient-owed upgrade difference for the month
      claim_number: claim control number
    account: rental_months
    direction: in
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: mobility, source_bill_id: mobility_bill_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}
      - event: coverage:coverage_patient_charge
        when: {upgrade_difference_amount: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: mobility, source_bill_id: mobility_bill_id, amount: upgrade_difference_amount, responsibility_type: upgrade_difference, posting_date: service_from_date}

  - type: mobility_rental_denied
    target: mobility_billing
    meaning: The payer denies a rental month claim.
    grain: one row per denied rental month claim
    distinguish_by: [coverage_id, service_from_date, denial_reason]
    fields:
      coverage_id: coverage billed
      hcpcs_code: class code
      billing_modifier: KH, KI or KJ
      rental_month_number: month ordinal billed
      service_from_date: first day of the month
      adjudication_date: denial remittance date
      denial_reason: denial reason
      claim_number: claim control number
    triggers: []

  - type: mobility_claim_reversal
    target: mobility_billing
    meaning: The payer takes back a paid rental month or purchase line.
    grain: one row per paid line reversed
    distinguish_by: [original_bill_id]
    fields:
      coverage_id: coverage that recouped
      original_bill_id: the paid line reversed
      reversal_reason: why it was taken back
      payer_paid_amount: amount taken back
      service_from_date: first day of the reversed month
      adjudication_date: recoupment remittance date
      claim_number: claim control number of the reversal
    account: rental_months
    direction: out
    triggers:
      - event: coverage:coverage_adjustment
        map: {coverage_id: coverage_id, customer_id: customer_id, adjustment_reason: claim_reversal}

  - type: mobility_purchase_paid
    target: mobility_billing
    meaning: The payer pays the lump-sum purchase of a chair whose purchase option was elected.
    grain: one row per paid purchase line
    distinguish_by: [coverage_id, service_from_date, hcpcs_code]
    fields:
      coverage_id: coverage that paid
      hcpcs_code: covered class code
      billing_modifier: NU
      service_from_date: delivery date
      adjudication_date: remittance date
      allowed_amount: allowed purchase amount for the covered class
      payer_paid_amount: payer payment
      patient_responsibility: patient cost share
      upgrade_difference_amount: patient-owed upgrade difference
      claim_number: claim control number
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: mobility, source_bill_id: mobility_bill_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}
      - event: coverage:coverage_patient_charge
        when: {upgrade_difference_amount: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: mobility, source_bill_id: mobility_bill_id, amount: upgrade_difference_amount, responsibility_type: upgrade_difference, posting_date: service_from_date}

  - type: mobility_repair_paid
    target: mobility_billing
    meaning: The payer pays the repair (labor and parts) of a patient-owned chair.
    grain: one row per paid repair job
    distinguish_by: [related_service_id]
    fields:
      coverage_id: coverage that paid
      hcpcs_code: K0739
      billing_modifier: RB
      related_service_id: the repair job billed
      service_from_date: repair completion date
      adjudication_date: remittance date
      allowed_amount: allowed repair amount
      payer_paid_amount: payer payment
      patient_responsibility: patient cost share
      claim_number: claim control number
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: mobility, source_bill_id: mobility_bill_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}

  - type: mobility_self_pay_sale
    target: mobility_billing
    meaning: A chair is sold outright to a self-pay patient and paid at the time of order.
    grain: one row per self-pay sale
    distinguish_by: [service_from_date, hcpcs_code]
    fields:
      hcpcs_code: class code sold
      service_from_date: delivery date
      sale_amount: price charged
      fee_amount: delivery fee charged
    triggers: []

  - type: mobility_self_pay_refund
    target: mobility_billing
    meaning: A returned self-pay chair is refunded less the restocking fee.
    grain: one row per refunded sale
    distinguish_by: [original_bill_id]
    fields:
      original_bill_id: the sale refunded
      service_from_date: date the chair was received back
      sale_amount: amount refunded
      fee_amount: restocking fee withheld
    triggers: []

  - type: mobility_delivery
    target: mobility_service
    meaning: A chair is handed over to the patient (initial rental delivery, purchase delivery or loaner).
    grain: one row per chair handed over
    distinguish_by: [service_date, delivery_purpose, serial_number]
    fields:
      service_date: hand-over date
      delivery_purpose: why the chair was delivered
      delivery_mode: how it was handed over
      serial_number: chair serial number
    triggers:
      - event: mobility:mobility_delivery_complete
        when: {delivery_purpose: initial_rental_delivery}
        map: {delivery_date: service_date, rental_period_start_date: service_date, serial_number: serial_number}
      - event: mobility:mobility_purchase_delivered
        when: {delivery_purpose: purchase_delivery}
        map: {delivery_date: service_date, ownership_date: service_date, serial_number: serial_number}

  - type: mobility_home_assessment
    target: mobility_service
    meaning: Summit Ridge assesses the patient's home for power chair access before delivery.
    grain: one row per home assessment visit
    distinguish_by: [service_date]
    fields:
      service_date: assessment date
      assessment_result: accessible or not
    triggers: []

  - type: mobility_repair
    target: mobility_service
    meaning: A chair fault is repaired and its cost assigned.
    grain: one row per repair job
    distinguish_by: [service_date, repair_component]
    fields:
      service_date: repair completion date
      repair_component: component repaired
      repair_coverage: who bears the cost
      labor_units: labor in 15-minute units
      parts_amount: parts cost
      repair_patient_share: amount owed by the patient on a patient-paid repair
      loaner_issued: whether a loaner was issued
      serial_number: chair repaired
    triggers:
      - event: coverage:coverage_patient_charge
        when: {repair_coverage: patient_paid}
        map: {customer_id: customer_id, source_category: mobility, source_bill_id: mobility_service_id, amount: repair_patient_share, responsibility_type: repair_patient_share, posting_date: service_date}

  - type: mobility_pickup
    target: mobility_service
    meaning: A rented chair is collected (or found missing on the pickup attempt).
    grain: one row per pickup visit
    distinguish_by: [service_date]
    fields:
      service_date: pickup date
      pickup_condition: condition found
      serial_number: chair collected
    triggers: []

measures:
  - id: mobility_msr_paid_months_current_period
    window: mobility_billing rows of the holding whose coverage_id equals the holding's coverage_id and whose service_from_date is on or after rental_period_start_date, up to the handling date
    measure: count of mobility_rental_paid rows minus the count of mobility_claim_reversal rows whose original_bill_id is one of them
  - id: mobility_msr_last_battery_replacement
    window: mobility_service rows of the holding up to the handling date
    measure: the latest service_date among mobility_repair rows with repair_component battery (delivery_date when there is none)

policies:
  - id: mobility_agg_multi_holding
    subject: [mobility_order_create]
    rule: >-
      A patient may hold at most `max_per_customer` open wheelchair records (any status other than
      returned, cancelled or replaced): at most one billed to coverage, plus self-pay chairs. A
      coverage-billed order is never opened while another coverage-billed chair order of the patient is
      order_received.
    eligibility:
      - id: one_pending_covered_order
        applies_to: [mobility_order_create]
        kind: dedup
        condition: A coverage-billed order is never opened while another coverage-billed chair order of the patient is order_received.
        evidence_fields: [mobility_holdings.customer_id, mobility_holdings.status, mobility_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.customer_id]
          action_bindings:
            mobility_holdings.customer_id: customer_id
        dedup_contract:
          table: mobility_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id, coverage_id: coverage_id}
          duplicate_filters: {status: [order_received]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: mobility_agg_same_or_similar
    subject: [mobility_order_create, mobility_rental_denied]
    rule: >-
      Coverage pays for one wheelchair at a time. A coverage-billed order is not opened while another
      coverage-billed chair of the patient is rental_active or suspended, or patient_owned with fewer
      than `reasonable_useful_lifetime_months` elapsed since its delivery_date, unless it is a replacement
      under mobility_replacement. A manual chair as a backup for a power chair user, or a second chair
      for another home, is never billed to coverage; the patient may buy it self-pay. Rental months
      billed for a duplicate chair are denied with same_or_similar and never charged to the patient.
    eligibility: []
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"rul_months": "=reasonable_useful_lifetime_months", "equipment_type": "=equipment_type"}
        "Lightweight Manual Wheelchair (K0003)": {"rul_months": "=reasonable_useful_lifetime_months", "equipment_type": "=equipment_type"}
        "High-Strength Lightweight Wheelchair (K0004)": {"rul_months": "=reasonable_useful_lifetime_months", "equipment_type": "=equipment_type"}
        "Ultralightweight Manual Wheelchair (K0005)": {"rul_months": "=reasonable_useful_lifetime_months", "equipment_type": "=equipment_type"}
        "Group 2 Standard Power Wheelchair (K0823)": {"rul_months": "=reasonable_useful_lifetime_months", "equipment_type": "=equipment_type"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"rul_months": "=reasonable_useful_lifetime_months", "equipment_type": "=equipment_type"}

  - id: mobility_qualification
    subject: [mobility_order_create, mobility_delivery_complete, mobility_purchase_delivered, mobility_home_assessment, mobility_delivery]
    rule: >-
      A coverage-billed order qualifies only when the patient meets the class's
      `coverage_criteria_code`, weighs no more than `patient_weight_capacity_lbs`, had the face-to-face
      examination no more than `f2f_lookback_days` before the order date where that value is above 0,
      and has a specialty evaluation where `specialty_eval_required` is true with ATP involvement where
      `atp_involvement_required` is true. A written order older than `rx_validity_months` cannot be
      delivered. Where `home_assessment_required` is true a power chair is delivered only after a
      mobility_home_assessment on this holding shows home_accessible. When the class is
      `class_prior_auth_eligible` and the primary coverage's class requires prior authorization for
      power mobility (coverage parameter prior_auth_pmd_required), a power chair is delivered only once a
      prior_authorization request on this holding is approved and the delivery date is within the
      coverage's prior_auth_validity_days of its decision_date; a non-affirmed request may be corrected
      and resubmitted. Delivery follows within `delivery_lead_business_days` business days, in the home
      with training where `in_home_delivery_training_required` is true.
      The chair furnished must meet its code (`hcpcs_code`): the `frame_weight_class` for a manual
      chair, and for a power base at least `min_speed_mph` and `min_range_miles`, with a power seating
      option only where `power_seating_option` is true.
    eligibility:
      - id: home_accessible
        applies_to: [mobility_delivery_complete, mobility_purchase_delivered]
        kind: authorization
        condition: Where `home_assessment_required` is true a power chair is delivered only after a mobility_home_assessment on this holding shows home_accessible.
        evidence_fields: [mobility_service.assessment_result, mobility_service.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_service.mobility_holding_id]
          action_bindings:
            mobility_service.mobility_holding_id: mobility_holding_id
      - id: pmd_prior_auth
        applies_to: [mobility_delivery_complete, mobility_purchase_delivered]
        kind: authorization
        condition: When the class is `class_prior_auth_eligible` and the primary coverage's class requires prior authorization for power mobility (coverage parameter prior_auth_pmd_required), a power chair is delivered only once a prior_authorization request on this holding is approved and the delivery date is within the coverage's prior_auth_validity_days of its decision_date; a non-affirmed request may be corrected and resubmitted.
        evidence_fields: [mobility_requests.request_type, mobility_requests.request_status, mobility_requests.decision_date, mobility_requests.mobility_holding_id, coverage_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_requests.mobility_holding_id]
          action_bindings:
            mobility_requests.mobility_holding_id: mobility_holding_id
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"code": "=hcpcs_code", "frame_class": "=frame_weight_class", "min_speed": "=min_speed_mph", "min_range": "=min_range_miles", "power_seating": "=power_seating_option", "criteria": "=coverage_criteria_code", "weight_cap": "=patient_weight_capacity_lbs", "f2f_days": "=f2f_lookback_days", "specialty": "=specialty_eval_required", "atp": "=atp_involvement_required", "home_assessment": "=home_assessment_required", "pa_eligible": "=class_prior_auth_eligible", "lead_days": "=delivery_lead_business_days"}
        "Lightweight Manual Wheelchair (K0003)": {"code": "=hcpcs_code", "frame_class": "=frame_weight_class", "min_speed": "=min_speed_mph", "min_range": "=min_range_miles", "power_seating": "=power_seating_option", "criteria": "=coverage_criteria_code", "weight_cap": "=patient_weight_capacity_lbs", "f2f_days": "=f2f_lookback_days", "specialty": "=specialty_eval_required", "atp": "=atp_involvement_required", "home_assessment": "=home_assessment_required", "pa_eligible": "=class_prior_auth_eligible", "lead_days": "=delivery_lead_business_days"}
        "High-Strength Lightweight Wheelchair (K0004)": {"code": "=hcpcs_code", "frame_class": "=frame_weight_class", "min_speed": "=min_speed_mph", "min_range": "=min_range_miles", "power_seating": "=power_seating_option", "criteria": "=coverage_criteria_code", "weight_cap": "=patient_weight_capacity_lbs", "f2f_days": "=f2f_lookback_days", "specialty": "=specialty_eval_required", "atp": "=atp_involvement_required", "home_assessment": "=home_assessment_required", "pa_eligible": "=class_prior_auth_eligible", "lead_days": "=delivery_lead_business_days"}
        "Ultralightweight Manual Wheelchair (K0005)": {"code": "=hcpcs_code", "frame_class": "=frame_weight_class", "min_speed": "=min_speed_mph", "min_range": "=min_range_miles", "power_seating": "=power_seating_option", "criteria": "=coverage_criteria_code", "weight_cap": "=patient_weight_capacity_lbs", "f2f_days": "=f2f_lookback_days", "specialty": "=specialty_eval_required", "atp": "=atp_involvement_required", "home_assessment": "=home_assessment_required", "pa_eligible": "=class_prior_auth_eligible", "lead_days": "=delivery_lead_business_days"}
        "Group 2 Standard Power Wheelchair (K0823)": {"code": "=hcpcs_code", "frame_class": "=frame_weight_class", "min_speed": "=min_speed_mph", "min_range": "=min_range_miles", "power_seating": "=power_seating_option", "criteria": "=coverage_criteria_code", "weight_cap": "=patient_weight_capacity_lbs", "f2f_days": "=f2f_lookback_days", "specialty": "=specialty_eval_required", "atp": "=atp_involvement_required", "home_assessment": "=home_assessment_required", "pa_eligible": "=class_prior_auth_eligible", "lead_days": "=delivery_lead_business_days"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"code": "=hcpcs_code", "frame_class": "=frame_weight_class", "min_speed": "=min_speed_mph", "min_range": "=min_range_miles", "power_seating": "=power_seating_option", "criteria": "=coverage_criteria_code", "weight_cap": "=patient_weight_capacity_lbs", "f2f_days": "=f2f_lookback_days", "specialty": "=specialty_eval_required", "atp": "=atp_involvement_required", "home_assessment": "=home_assessment_required", "pa_eligible": "=class_prior_auth_eligible", "lead_days": "=delivery_lead_business_days"}

  - id: mobility_evt_rental_billing
    subject: [mobility_rental_paid, mobility_rental_denied]
    rule: >-
      Rental months are billed on the anniversary of rental_period_start_date (`rental_month_anchor`;
      same day of each later calendar month, falling back to the last day of a shorter month; after a
      resumption the next month starts on the resumption date), with the month number the next ordinal
      after the paid months of mobility_msr_paid_months_current_period. Months 1 to 3 carry KH or KI and
      the covered class's `rental_fee_months_1_3`; later months carry KJ and `rental_fee_months_4_13`.
      The allowed amount is the covered class's fee times the coverage class's
      allowed_pct_of_fee_schedule divided by 100, rounded to the cent half up. Months are never prorated
      and no month whose first day falls in a suspension is billed. A rental month is billed only while
      the wheelchair record is rental_active.
    eligibility:
      - id: mobility_billable_status
        applies_to: [mobility_rental_paid]
        kind: state
        condition: A rental month is billed only while the wheelchair record is rental_active.
        evidence_fields: [mobility_holdings.status, mobility_holdings.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.mobility_holding_id]
          action_bindings:
            mobility_holdings.mobility_holding_id: mobility_holding_id
        state_contract:
          field: mobility_holdings.status
          allowed: [rental_active]
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Lightweight Manual Wheelchair (K0003)": {"fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "High-Strength Lightweight Wheelchair (K0004)": {"fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Ultralightweight Manual Wheelchair (K0005)": {"fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Group 2 Standard Power Wheelchair (K0823)": {"fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "anchor": "=rental_month_anchor"}
    formula:
      covered_fee: rental_fee_months_1_3 if rental_month_number <= 3 else rental_fee_months_4_13
    measures: [mobility_msr_paid_months_current_period]

  - id: mobility_purchase_option
    subject: [mobility_purchase_election, mobility_purchase_paid, mobility_claim_reversal]
    rule: >-
      On a class whose `first_month_purchase_option` is true, Summit Ridge offers the patient at delivery
      the choice to buy the chair outright instead of renting; only the patient can make the election.
      The purchase election is received no later than `purchase_election_window_days` after the chair is
      delivered, counting calendar days from the day after delivery_date with the boundary day included;
      a later request is refused and the rental continues to the cap. On election the chair is billed
      once as a purchase (modifier NU) at `fee_schedule_purchase_price` times the coverage class's
      allowed_pct_of_fee_schedule divided by 100, rounded to the cent half up, with service_from_date the
      delivery date, and a rental month 1 already paid is reversed by the payer with reversal_reason
      purchase_conversion. Classes without the option are never sold outright to coverage.
    eligibility:
      - id: election_window
        applies_to: [mobility_purchase_election]
        kind: time
        condition: The purchase election is received no later than `purchase_election_window_days` after the chair is delivered, counting calendar days from the day after delivery_date with the boundary day included; a later request is refused and the rental continues to the cap.
        evidence_fields: [mobility_holdings.delivery_date, mobility_holdings.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.mobility_holding_id]
          action_bindings:
            mobility_holdings.mobility_holding_id: mobility_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the chair is delivered
          anchor_source: mobility_holdings.delivery_date
          relation: not_after
          duration_source: variants.purchase_election_window_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after delivery_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"option": "=first_month_purchase_option", "window_days": "=purchase_election_window_days", "purchase_price": "=fee_schedule_purchase_price"}
        "Lightweight Manual Wheelchair (K0003)": {"option": "=first_month_purchase_option", "window_days": "=purchase_election_window_days", "purchase_price": "=fee_schedule_purchase_price"}
        "High-Strength Lightweight Wheelchair (K0004)": {"option": "=first_month_purchase_option", "window_days": "=purchase_election_window_days", "purchase_price": "=fee_schedule_purchase_price"}
        "Ultralightweight Manual Wheelchair (K0005)": {"option": "=first_month_purchase_option", "window_days": "=purchase_election_window_days", "purchase_price": "=fee_schedule_purchase_price"}
        "Group 2 Standard Power Wheelchair (K0823)": {"option": "=first_month_purchase_option", "window_days": "=purchase_election_window_days", "purchase_price": "=fee_schedule_purchase_price"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"option": "=first_month_purchase_option", "window_days": "=purchase_election_window_days", "purchase_price": "=fee_schedule_purchase_price"}

  - id: mobility_ownership
    subject: [mobility_title_transfer, mobility_rental_paid, mobility_rental_denied]
    rule: >-
      Title passes once mobility_msr_paid_months_current_period reaches the coverage class's
      capped_rental_months; ownership_date is the day after the last day of the final paid month. A month
      beyond the cap is denied with cap_reached and never charged to the patient. Months under an earlier
      coverage or rental period do not count. An owned chair is never picked up.
    eligibility: []
    measures: [mobility_msr_paid_months_current_period]

  - id: mobility_suspension_break
    subject: [mobility_suspend, mobility_resume, mobility_period_restart]
    rule: >-
      An inpatient or skilled nursing admission suspends the rental with the admission date as
      suspended_date; no month whose first day falls in the suspension is billed. A suspended rental
      resumes in the same rental period only when the patient comes home no later than
      `break_in_need_days` days after the suspension began, counting calendar days from the day after
      suspended_date, the allowance being `break_in_need_days` plus the days remaining in the rental month
      in which the suspension began. A longer break starts a new rental period on the return-home date
      with the count back at 1, after the class's `new_period_requirements`.
    eligibility:
      - id: mobility_break_allowance
        applies_to: [mobility_resume]
        kind: time
        condition: A suspended rental resumes in the same rental period only when the patient comes home no later than `break_in_need_days` days after the suspension began, counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the rental month in which the suspension began.
        evidence_fields: [mobility_holdings.suspended_date, mobility_holdings.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.mobility_holding_id]
          action_bindings:
            mobility_holdings.mobility_holding_id: mobility_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension began
          anchor_source: mobility_holdings.suspended_date
          relation: not_after
          duration_source: variants.break_in_need_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the rental month in which the suspension began
          boundary: inclusive
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Lightweight Manual Wheelchair (K0003)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "High-Strength Lightweight Wheelchair (K0004)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Ultralightweight Manual Wheelchair (K0005)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Group 2 Standard Power Wheelchair (K0823)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}

  - id: mobility_evt_claim_reversal
    subject: [mobility_claim_reversal]
    rule: >-
      A recoupment is recorded against the one paid line it takes back, as original_bill_id, one
      reversal per line named in the payer's letter; a paid line is reversed at most once. A reversed
      rental month leaves the paid count; every patient charge stemming from the reversed line is
      removed under the coverage charter.
    eligibility:
      - id: mobility_reverse_once
        applies_to: [mobility_claim_reversal]
        kind: dedup
        condition: a paid line is reversed at most once.
        evidence_fields: [mobility_billing.original_bill_id, mobility_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_billing.original_bill_id]
          action_bindings:
            mobility_billing.original_bill_id: original_bill_id
        dedup_contract:
          table: mobility_billing
          mode: separate_record
          object_bindings: {original_bill_id: original_bill_id}
          duplicate_filters: {event_type: [mobility_claim_reversal]}
          distinct_fields: []

  - id: mobility_repair_responsibility
    subject: [mobility_repair, mobility_repair_paid]
    rule: >-
      While a chair is rental_active or suspended every repair is Summit Ridge's rental obligation at no
      charge, completed or swapped within `rental_swap_business_days` business days. On an owned chair the
      component's manufacturer warranty applies first, each counted from delivery_date:
      `frame_warranty_months` for the frame, `electronics_warranty_months` for joystick and controller,
      `motor_warranty_months` for motor and gearbox, `battery_warranty_months` for batteries (counted from
      the last battery replacement when there is one) and `tire_caster_warranty_months` for tires and
      casters; upholstery and brakes carry no warranty. Out of warranty, a repair of a chair bought or
      capped under coverage is billed to the coverage as labor at `repair_labor_rate_per_unit` per unit
      plus parts, the patient owing the cost share; batteries are billed no more often than every
      `battery_replacement_min_months` months, measured from mobility_msr_last_battery_replacement. A
      self-pay chair's out-of-warranty repair is patient_paid. When labor plus parts would exceed
      `repair_cost_replace_threshold_pct` percent of `fee_schedule_purchase_price`, the chair is replaced
      instead. A technician assesses a reported fault within `repair_assessment_business_days` business
      days, and a loaner is issued where `loaner_during_owned_repair` is true. A repair is recorded only
      on a chair the patient still has: the wheelchair record is rental_active, suspended or
      patient_owned.
    eligibility:
      - id: chair_with_patient
        applies_to: [mobility_repair]
        kind: state
        condition: the wheelchair record is rental_active, suspended or patient_owned.
        evidence_fields: [mobility_holdings.status, mobility_holdings.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.mobility_holding_id]
          action_bindings:
            mobility_holdings.mobility_holding_id: mobility_holding_id
        state_contract:
          field: mobility_holdings.status
          allowed: [rental_active, suspended, patient_owned]
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"frame_months": "=frame_warranty_months", "electronics_months": "=electronics_warranty_months", "motor_months": "=motor_warranty_months", "battery_months": "=battery_warranty_months", "tire_months": "=tire_caster_warranty_months", "battery_min": "=battery_replacement_min_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Lightweight Manual Wheelchair (K0003)": {"frame_months": "=frame_warranty_months", "electronics_months": "=electronics_warranty_months", "motor_months": "=motor_warranty_months", "battery_months": "=battery_warranty_months", "tire_months": "=tire_caster_warranty_months", "battery_min": "=battery_replacement_min_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "High-Strength Lightweight Wheelchair (K0004)": {"frame_months": "=frame_warranty_months", "electronics_months": "=electronics_warranty_months", "motor_months": "=motor_warranty_months", "battery_months": "=battery_warranty_months", "tire_months": "=tire_caster_warranty_months", "battery_min": "=battery_replacement_min_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Ultralightweight Manual Wheelchair (K0005)": {"frame_months": "=frame_warranty_months", "electronics_months": "=electronics_warranty_months", "motor_months": "=motor_warranty_months", "battery_months": "=battery_warranty_months", "tire_months": "=tire_caster_warranty_months", "battery_min": "=battery_replacement_min_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Group 2 Standard Power Wheelchair (K0823)": {"frame_months": "=frame_warranty_months", "electronics_months": "=electronics_warranty_months", "motor_months": "=motor_warranty_months", "battery_months": "=battery_warranty_months", "tire_months": "=tire_caster_warranty_months", "battery_min": "=battery_replacement_min_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"frame_months": "=frame_warranty_months", "electronics_months": "=electronics_warranty_months", "motor_months": "=motor_warranty_months", "battery_months": "=battery_warranty_months", "tire_months": "=tire_caster_warranty_months", "battery_min": "=battery_replacement_min_months", "labor_rate": "=repair_labor_rate_per_unit", "replace_pct": "=repair_cost_replace_threshold_pct"}
    formula:
      repair_cost: labor_units * repair_labor_rate_per_unit + parts_amount
    measures: [mobility_msr_last_battery_replacement]

  - id: mobility_upgrade
    subject: [mobility_notice_signed, mobility_rental_paid, mobility_purchase_paid]
    rule: >-
      A patient who qualifies for a covered class may elect a higher class where `upgrade_permitted` is
      true and the coverage class's upgrade_billing_permitted is true; the coverage pays only for the
      covered_class and the patient owes, on each paid line, the difference between the furnished class's
      fee and the covered class's fee for that line, each times the coverage class's
      allowed_pct_of_fee_schedule divided by 100 and rounded to the cent half up. An upgrade difference is
      billed to the patient only when the patient's notice is on file: the notice_on_file of the record is
      signed. The notice is the coverage class's noncovered_notice_mechanism and only the patient can sign
      it. Without a signed notice the difference is never charged and is written off under the coverage
      charter. A Medicaid patient is never offered a billed upgrade.
    eligibility:
      - id: notice_signed
        applies_to: [mobility_rental_paid, mobility_purchase_paid]
        kind: authorization
        condition: An upgrade difference is billed to the patient only when the patient's notice is on file
        evidence_fields: [mobility_holdings.notice_on_file, mobility_holdings.covered_class, mobility_holdings.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.mobility_holding_id]
          action_bindings:
            mobility_holdings.mobility_holding_id: mobility_holding_id
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"permitted": "=upgrade_permitted", "notice_required": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "purchase_price": "=fee_schedule_purchase_price"}
        "Lightweight Manual Wheelchair (K0003)": {"permitted": "=upgrade_permitted", "notice_required": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "purchase_price": "=fee_schedule_purchase_price"}
        "High-Strength Lightweight Wheelchair (K0004)": {"permitted": "=upgrade_permitted", "notice_required": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "purchase_price": "=fee_schedule_purchase_price"}
        "Ultralightweight Manual Wheelchair (K0005)": {"permitted": "=upgrade_permitted", "notice_required": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "purchase_price": "=fee_schedule_purchase_price"}
        "Group 2 Standard Power Wheelchair (K0823)": {"permitted": "=upgrade_permitted", "notice_required": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "purchase_price": "=fee_schedule_purchase_price"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"permitted": "=upgrade_permitted", "notice_required": "=upgrade_notice_required", "fee_1_3": "=rental_fee_months_1_3", "fee_4_13": "=rental_fee_months_4_13", "purchase_price": "=fee_schedule_purchase_price"}

  - id: mobility_return_pickup
    subject: [mobility_return, mobility_pickup, mobility_order_cancel]
    rule: >-
      A patient may decline a chair before delivery at no charge, except a custom_configured chair whose
      build has started, which is then treated as delivered. A rented chair is returned only at the
      patient's own confirmation: a rented chair is returned only after a return_pickup request on this
      holding is approved. Pickup follows within `pickup_lead_business_days` business days; billing stops
      with the last month that began before the return. A chair recovered damaged beyond normal wear is
      charged `damage_fee_beyond_wear`; a chair still not recovered `unreturned_equipment_days` days after
      the confirmed pickup date is charged `unreturned_equipment_charge`, removed if later recovered. An
      owned chair is never picked up or charged.
    eligibility:
      - id: mobility_return_confirmed
        applies_to: [mobility_return]
        kind: authorization
        condition: a rented chair is returned only after a return_pickup request on this holding is approved.
        evidence_fields: [mobility_requests.request_type, mobility_requests.request_status, mobility_requests.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_requests.mobility_holding_id]
          action_bindings:
            mobility_requests.mobility_holding_id: mobility_holding_id
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "damage_fee": "=damage_fee_beyond_wear", "custom": "=custom_configured"}
        "Lightweight Manual Wheelchair (K0003)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "damage_fee": "=damage_fee_beyond_wear", "custom": "=custom_configured"}
        "High-Strength Lightweight Wheelchair (K0004)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "damage_fee": "=damage_fee_beyond_wear", "custom": "=custom_configured"}
        "Ultralightweight Manual Wheelchair (K0005)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "damage_fee": "=damage_fee_beyond_wear", "custom": "=custom_configured"}
        "Group 2 Standard Power Wheelchair (K0823)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "damage_fee": "=damage_fee_beyond_wear", "custom": "=custom_configured"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "damage_fee": "=damage_fee_beyond_wear", "custom": "=custom_configured"}

  - id: mobility_self_pay
    subject: [mobility_self_pay_sale, mobility_self_pay_refund, mobility_purchase_delivered]
    rule: >-
      Any class may be sold outright to a self-pay patient at `self_pay_retail_price` plus
      `self_pay_delivery_fee`, paid in full at order. A self-pay chair is refunded only when it comes back
      unused and complete no later than `self_pay_return_window_days` after delivery, counting calendar
      days from the day after delivery_date with the boundary day included; a class with a window of 0 or
      that is `custom_configured` is never refunded. The refund is the price less
      `self_pay_restocking_fee_pct` percent, rounded to the cent half up; the delivery fee is never
      refunded. A sale is refunded at most once.
    eligibility:
      - id: mobility_return_window
        applies_to: [mobility_self_pay_refund]
        kind: time
        condition: A self-pay chair is refunded only when it comes back unused and complete no later than `self_pay_return_window_days` after delivery, counting calendar days from the day after delivery_date with the boundary day included; a class with a window of 0 or that is `custom_configured` is never refunded.
        evidence_fields: [mobility_holdings.delivery_date, mobility_holdings.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.mobility_holding_id]
          action_bindings:
            mobility_holdings.mobility_holding_id: mobility_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: after delivery
          anchor_source: mobility_holdings.delivery_date
          relation: not_after
          duration_source: variants.self_pay_return_window_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after delivery_date with the boundary day included
          boundary: inclusive
      - id: mobility_refund_once
        applies_to: [mobility_self_pay_refund]
        kind: dedup
        condition: A sale is refunded at most once.
        evidence_fields: [mobility_billing.original_bill_id, mobility_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_billing.original_bill_id]
          action_bindings:
            mobility_billing.original_bill_id: original_bill_id
        dedup_contract:
          table: mobility_billing
          mode: separate_record
          object_bindings: {original_bill_id: original_bill_id}
          duplicate_filters: {event_type: [mobility_self_pay_refund]}
          distinct_fields: []
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"price": "=self_pay_retail_price", "delivery_fee": "=self_pay_delivery_fee", "window_days": "=self_pay_return_window_days", "restock_pct": "=self_pay_restocking_fee_pct", "custom": "=custom_configured"}
        "Lightweight Manual Wheelchair (K0003)": {"price": "=self_pay_retail_price", "delivery_fee": "=self_pay_delivery_fee", "window_days": "=self_pay_return_window_days", "restock_pct": "=self_pay_restocking_fee_pct", "custom": "=custom_configured"}
        "High-Strength Lightweight Wheelchair (K0004)": {"price": "=self_pay_retail_price", "delivery_fee": "=self_pay_delivery_fee", "window_days": "=self_pay_return_window_days", "restock_pct": "=self_pay_restocking_fee_pct", "custom": "=custom_configured"}
        "Ultralightweight Manual Wheelchair (K0005)": {"price": "=self_pay_retail_price", "delivery_fee": "=self_pay_delivery_fee", "window_days": "=self_pay_return_window_days", "restock_pct": "=self_pay_restocking_fee_pct", "custom": "=custom_configured"}
        "Group 2 Standard Power Wheelchair (K0823)": {"price": "=self_pay_retail_price", "delivery_fee": "=self_pay_delivery_fee", "window_days": "=self_pay_return_window_days", "restock_pct": "=self_pay_restocking_fee_pct", "custom": "=custom_configured"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"price": "=self_pay_retail_price", "delivery_fee": "=self_pay_delivery_fee", "window_days": "=self_pay_return_window_days", "restock_pct": "=self_pay_restocking_fee_pct", "custom": "=custom_configured"}
    formula:
      refund_amount: round(self_pay_retail_price * (100 - self_pay_restocking_fee_pct) / 100, 2)

  - id: mobility_replacement
    subject: [mobility_replace, mobility_order_create]
    rule: >-
      An owned chair is replaced for age only when the useful lifetime has elapsed: an age-based
      replacement is ordered no earlier than `reasonable_useful_lifetime_months` after the chair is
      delivered, counting calendar months from delivery_date with month-end fallback to the last day of
      a shorter month and the boundary day included. Before then a chair is replaced only for loss or
      theft (with a report where `lost_stolen_report_required` is true), irreparable damage, a repair
      costlier than replacement, or a documented change in medical condition where
      `replacement_for_condition_change` is true. The replacement opens a new record with its own
      qualification and rental period; the old record moves to replaced.
    eligibility:
      - id: mobility_useful_life
        applies_to: [mobility_replace]
        kind: time
        condition: an age-based replacement is ordered no earlier than `reasonable_useful_lifetime_months` after the chair is delivered, counting calendar months from delivery_date with month-end fallback to the last day of a shorter month and the boundary day included.
        evidence_fields: [mobility_holdings.delivery_date, mobility_holdings.mobility_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_holdings.mobility_holding_id]
          action_bindings:
            mobility_holdings.mobility_holding_id: mobility_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the chair is delivered
          anchor_source: mobility_holdings.delivery_date
          relation: not_before
          duration_source: variants.reasonable_useful_lifetime_months
          unit: calendar_months
          counting_rule: counting calendar months from delivery_date with month-end fallback to the last day of a shorter month and the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"rul_months": "=reasonable_useful_lifetime_months", "condition_change": "=replacement_for_condition_change", "report": "=lost_stolen_report_required"}
        "Lightweight Manual Wheelchair (K0003)": {"rul_months": "=reasonable_useful_lifetime_months", "condition_change": "=replacement_for_condition_change", "report": "=lost_stolen_report_required"}
        "High-Strength Lightweight Wheelchair (K0004)": {"rul_months": "=reasonable_useful_lifetime_months", "condition_change": "=replacement_for_condition_change", "report": "=lost_stolen_report_required"}
        "Ultralightweight Manual Wheelchair (K0005)": {"rul_months": "=reasonable_useful_lifetime_months", "condition_change": "=replacement_for_condition_change", "report": "=lost_stolen_report_required"}
        "Group 2 Standard Power Wheelchair (K0823)": {"rul_months": "=reasonable_useful_lifetime_months", "condition_change": "=replacement_for_condition_change", "report": "=lost_stolen_report_required"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"rul_months": "=reasonable_useful_lifetime_months", "condition_change": "=replacement_for_condition_change", "report": "=lost_stolen_report_required"}

  - id: mobility_payer_transition
    subject: [mobility_payer_update]
    rule: >-
      When a different primary coverage starts paying during a rental, a new rental period begins under
      it on the first date of service it covers, months under the earlier coverage do not count, and the
      new coverage pays only after the class's `payer_entry_requalification` (and its own prior
      authorization where its class requires one). The rental moves only once the new coverage is
      verified: the new coverage record is in status active. An owned chair is not affected.
    eligibility:
      - id: mobility_new_coverage_verified
        applies_to: [mobility_payer_update]
        kind: state
        condition: the new coverage record is in status active.
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active]
    params:
      per_tier:
        "Standard Manual Wheelchair (K0001)": {"requalification": "=payer_entry_requalification"}
        "Lightweight Manual Wheelchair (K0003)": {"requalification": "=payer_entry_requalification"}
        "High-Strength Lightweight Wheelchair (K0004)": {"requalification": "=payer_entry_requalification"}
        "Ultralightweight Manual Wheelchair (K0005)": {"requalification": "=payer_entry_requalification"}
        "Group 2 Standard Power Wheelchair (K0823)": {"requalification": "=payer_entry_requalification"}
        "Group 3 Complex Rehab Power Wheelchair (K0856)": {"requalification": "=payer_entry_requalification"}

  - id: mobility_appeal
    subject: [mobility_rental_denied]
    rule: >-
      A denied rental month may be appealed through a redetermination_appeal request naming it as
      related_bill_id. The appeal is filed no later than the coverage class's
      redetermination_window_days after the denial is received, counting calendar days from the day after
      the denied line's adjudication_date with the boundary day included. A denial for cap_reached,
      same_or_similar or inpatient_stay is not appealed; a prior_auth_missing, f2f_missing or
      home_assessment_missing denial is appealed only when the proof was on file before delivery.
    eligibility:
      - id: mobility_appeal_window
        applies_to: [mobility_rental_denied]
        kind: time
        condition: The appeal is filed no later than the coverage class's redetermination_window_days after the denial is received, counting calendar days from the day after the denied line's adjudication_date with the boundary day included.
        evidence_fields: [mobility_billing.adjudication_date, mobility_billing.mobility_bill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [mobility_billing.mobility_bill_id]
          action_bindings:
            mobility_billing.mobility_bill_id: related_bill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the denial is received
          anchor_source: mobility_billing.adjudication_date
          relation: not_after
          duration_source: params.appeal_window_days_reference
          unit: calendar_days
          counting_rule: counting calendar days from the day after the denied line's adjudication_date with the boundary day included
          boundary: inclusive
    params:
      appeal_window_days_reference: coverage.redetermination_window_days
