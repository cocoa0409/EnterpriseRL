# Policy charter: Home Oxygen Therapy (category key: oxygen)
# An oxygen holding is one home oxygen rental: Summit Ridge keeps title to the equipment, is paid a
# monthly equipment payment for a capped number of months, and must keep furnishing and servicing the
# equipment through its reasonable useful lifetime; gas and liquid contents become separately billable
# after the cap.

category: oxygen
display_name: Home Oxygen Therapy

binding:
  holding_table: oxygen_holdings
  event_tables: [oxygen_billing, oxygen_service]
  intake_tables: [oxygen_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [order_received, rental_active, suspended, payment_cap_reached, returned, cancelled, lifetime_ended]
  transitions:
    - {from: order_received, to: rental_active, by: agent, means: "The oxygen system is delivered and set up; the first month of the payment period starts."}
    - {from: order_received, to: cancelled, by: user, means: "The patient declines oxygen before delivery."}
    - {from: rental_active, to: suspended, by: agent, means: "The patient is admitted to a hospital or skilled nursing facility and monthly billing pauses."}
    - {from: suspended, to: rental_active, by: agent, means: "The patient is home again and monthly billing resumes."}
    - {from: rental_active, to: payment_cap_reached, by: system, means: "The last capped equipment month is paid; Summit Ridge keeps furnishing the equipment without equipment payment."}
    - {from: rental_active, to: returned, by: user, means: "The patient no longer uses oxygen and gives the equipment back."}
    - {from: suspended, to: returned, by: user, means: "The patient gives the equipment back during a suspension."}
    - {from: payment_cap_reached, to: returned, by: user, means: "The patient no longer uses oxygen after the cap and gives the equipment back."}
    - {from: payment_cap_reached, to: lifetime_ended, by: agent, means: "The useful lifetime has elapsed and the patient elected new equipment, which opens a new oxygen record."}

accounts:
  - key: equipment_months
    unit: paid equipment months
    meaning: Monthly oxygen equipment payments received in the current payment period; a reversal takes one back.

parameter_schema:
  stationary_hcpcs: "HCPCS code of the stationary equipment (string)"
  portable_hcpcs: "HCPCS code of the portable add-on, or none (string)"
  stationary_monthly_fee: "Fee-schedule monthly equipment payment for the stationary system, contents included during the payment period (USD per month)"
  portable_addon_monthly_fee: "Fee-schedule monthly add-on for portable equipment (USD per month); 0.00 when no portable"
  high_flow_threshold_lpm: "Prescribed flow above which the high-flow adjustment applies (LPM)"
  high_flow_uplift_pct: "Increase of the stationary payment when the prescribed flow is above high_flow_threshold_lpm (percent)"
  low_flow_threshold_lpm: "Prescribed flow below which the low-flow reduction applies (LPM)"
  low_flow_reduction_pct: "Reduction of the stationary payment when the prescribed flow is below low_flow_threshold_lpm (percent)"
  max_flow_lpm: "Highest continuous flow the system class delivers (LPM)"
  pulse_dose_capable: "Whether the portable unit delivers pulse dose (boolean)"
  oxygen_conserving_device_included: "Whether a conserving device is furnished with portable cylinders or liquid (boolean)"
  contents_included_during_cap: "Whether gas or liquid contents are included in the monthly payment during the payment period (boolean)"
  post_cap_contents_hcpcs: "HCPCS code of the monthly contents fee billed after the payment cap, or none (string)"
  post_cap_contents_monthly_fee: "Fee-schedule monthly contents payment after the cap (USD per month); 0.00 when no contents are billable"
  contents_delivery_min_per_month: "Contents deliveries required within a month for that month's contents fee to be billable (count); 0 when no contents billing"
  qualifying_spo2_max_group_i: "Saturation at or below which the test qualifies under group I (percent)"
  qualifying_spo2_group_ii: "Saturation value that qualifies under group II when a qualifying comorbidity is documented (percent)"
  qualifying_test_lookback_days: "Calendar days before the order date within which the qualifying test must have been performed (days)"
  group_ii_retest_earliest_day: "Earliest day of therapy (setup_date being day 1) for the group II repeat test (day number)"
  group_ii_retest_latest_day: "Latest day of therapy for the group II repeat test supporting payment from month 4 (day number)"
  portable_mobility_documentation_required: "Whether portable equipment is billable only when mobility within the home is documented (boolean)"
  setup_lead_hours: "Hours from a complete order to setup (hours)"
  discharge_same_day_setup: "Whether setup is guaranteed on the day of hospital discharge when the order arrives by noon (boolean)"
  setup_by_rt_required: "Whether setup must be performed by a respiratory therapist (boolean)"
  routine_maintenance_interval_months: "Calendar months between routine maintenance visits to the stationary unit (months)"
  malfunction_response_hours: "Hours within which a reported equipment malfunction is answered with a repair or swap (hours)"
  power_outage_response_hours: "Hours within which backup oxygen is brought during a reported power outage (hours); 0 when the system needs no power"
  emergency_backup_cylinders: "Backup cylinders kept in the home for power outages (count)"
  cylinder_refill_cycle_days: "Days between scheduled portable cylinder deliveries (days); 0 when no cylinders"
  cylinders_per_delivery_max: "Most portable cylinders left on one scheduled delivery (count); 0 when no cylinders"
  liquid_refill_cycle_days: "Days between scheduled liquid reservoir refills (days); 0 when no liquid"
  home_fill_cylinder_count: "Home-fill cylinders furnished with the fill unit (count); 0 when no fill unit"
  poc_battery_count: "Batteries furnished with a portable concentrator (count); 0 when none"
  humidifier_bottle_above_lpm: "Prescribed flow above which a humidifier bottle is furnished (LPM)"
  airline_approved: "Whether the portable unit may be carried on aircraft (boolean)"
  travel_extra_supply_days: "Days of extra portable supply delivered for travel inside the Summit Ridge service area (days)"
  travel_partner_lead_business_days: "Business days of notice needed before out-of-area travel to arrange a partner supplier (days)"
  travel_partner_max_days: "Longest out-of-area stay one partner arrangement covers (days)"
  break_in_need_days: "Days of a break in need, beyond the days left in the month it began, after which a new payment period must start (days)"
  new_period_requirements: "What a new payment period after a long break needs (enum: new_test_and_order)"
  payer_entry_requalification: "What a patient already on oxygen needs when a new primary coverage starts paying (enum: qualifying_test_within_lookback)"
  rx_validity_months: "Calendar months a written oxygen order stays usable to start therapy (months)"
  rx_change_requires_new_order: "Whether a change of flow, usage pattern or system class needs a new written order (boolean)"
  pickup_lead_business_days: "Business days after a confirmed return within which equipment is picked up (days)"
  unreturned_equipment_days: "Calendar days after the confirmed pickup date after which equipment still not recovered is charged (days)"
  unreturned_equipment_charge: "Charge for a stationary system not recovered (USD)"
  lost_cylinder_charge_each: "Charge per portable cylinder not recovered (USD); 0.00 when no cylinders"
  damage_fee_beyond_wear: "Charge for equipment recovered damaged beyond normal wear (USD)"
  relocation_arrangement_required: "Whether Summit Ridge must arrange a successor supplier when the patient moves outside the service area during the furnishing obligation (boolean)"

