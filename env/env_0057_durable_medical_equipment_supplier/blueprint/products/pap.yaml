# Policy charter: PAP Therapy Equipment (category key: pap)
# A PAP holding is one sleep-therapy device order through its life: referral, setup, the coverage
# trial, capped rental months toward ownership, repairs, and return or replacement.

category: pap
display_name: PAP Therapy Equipment

binding:
  holding_table: pap_holdings
  event_tables: [pap_billing, pap_service]
  intake_tables: [pap_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [order_received, trial_active, rental_active, suspended, patient_owned, returned, cancelled, replaced]
  transitions:
    - {from: order_received, to: trial_active, by: agent, means: "A coverage-billed device is delivered and set up; day 1 of the coverage trial and of rental month 1."}
    - {from: order_received, to: patient_owned, by: agent, means: "A self-pay device is delivered; title passes to the patient on delivery."}
    - {from: order_received, to: cancelled, by: user, means: "The patient declines the device before delivery."}
    - {from: trial_active, to: rental_active, by: agent, means: "Compliance and the practitioner re-evaluation are documented, so rental continues past the trial."}
    - {from: trial_active, to: returned, by: user, means: "The patient gives the device back during the trial (failed or declined therapy)."}
    - {from: rental_active, to: suspended, by: agent, means: "The patient is admitted to a hospital or skilled nursing facility and rental billing pauses."}
    - {from: suspended, to: rental_active, by: agent, means: "The patient is discharged home and rental billing resumes."}
    - {from: rental_active, to: patient_owned, by: system, means: "The last capped rental month is paid and title passes to the patient."}
    - {from: rental_active, to: returned, by: user, means: "The patient gives the rented device back."}
    - {from: suspended, to: returned, by: user, means: "The patient gives the rented device back during a suspension."}
    - {from: patient_owned, to: replaced, by: agent, means: "A replacement device is ordered for an owned device past its useful lifetime or lost, stolen or irreparably damaged."}

accounts:
  - key: rental_months
    unit: rental months
    meaning: Paid capped-rental months of the device; each paid month counts toward ownership within its rental period and a reversal takes one back.

parameter_schema:
  hcpcs_code: "HCPCS code under which the base device is billed (string)"
  acquisition_method: "How the device is furnished when billed to coverage (enum: self_pay_purchase, capped_rental)"
  fee_schedule_purchase_price: "Summit Ridge fee-schedule purchase amount of the base device, the basis of the rental fees and of repair-versus-replace comparisons (USD)"
  rental_fee_months_1_3: "Fee-schedule rental amount for each of rental months 1 through 3 of the base device (USD per month)"
  rental_fee_months_4_13: "Fee-schedule rental amount for each rental month from month 4 on of the base device (USD per month)"
  humidifier_billable: "Whether a heated humidifier furnished with the device is billed as a separate rental add-on (boolean)"
  humidifier_hcpcs: "HCPCS code of the humidifier add-on, or not_billed (string)"
  humidifier_fee_months_1_3: "Fee-schedule rental amount of the humidifier add-on for rental months 1 through 3 (USD per month)"
  humidifier_fee_months_4_13: "Fee-schedule rental amount of the humidifier add-on from rental month 4 on (USD per month)"
  rental_month_anchor: "Rule fixing each rental month's service_from_date (enum: not_applicable, setup_date_anniversary)"
  qualifying_ahi_min: "AHI (events per hour) at or above which the qualifying test alone qualifies the patient (number); 0 when no AHI rule applies"
  qualifying_ahi_min_with_symptoms: "Lower AHI at or above which the patient qualifies when documented symptoms or comorbidities are present (number); 0 when no AHI rule applies"
  prior_cpap_failure_required: "Whether CPAP must have been tried and proven ineffective before this class is ordered (boolean)"
  cardiac_ef_threshold_pct: "Left ventricular ejection fraction at or below which the class may not be furnished (percent); 0 when no cardiac rule applies"
  rx_validity_months: "Calendar months after its date that a written order remains usable to start therapy or a supply cycle (months)"
  setup_lead_business_days: "Business days (Monday-Friday, excluding Summit Ridge holidays) from a complete order to the scheduled setup (days)"
  setup_modes_allowed: "Delivery modes allowed for the initial setup (list of enum: in_home_setup, branch_setup, virtual_setup, courier)"
  respiratory_therapist_setup: "Whether the setup must be performed by a licensed respiratory therapist (boolean)"
  modem_data_required: "Whether compliance is proven only from device modem or card data rather than patient report (boolean)"
  trial_period_days: "Length of the initial coverage trial counted from setup_date (calendar days); 0 when there is no trial"
  compliance_basis: "How compliance is measured (enum: not_applicable, nights_over_threshold, average_daily_use)"
  compliance_window_days: "Length of the consecutive usage window evaluated for compliance (calendar nights)"
  compliance_window_latest_end_day: "Latest trial day (setup_date being day 1) on which the qualifying compliance window may end (day number)"
  compliance_min_hours: "Minimum hours of use per night (nights_over_threshold) or average hours per 24 hours (average_daily_use) (hours)"
  compliance_min_night_pct: "Share of nights in the window that must reach compliance_min_hours under the nights_over_threshold basis (percent); 0 under other bases"
  reevaluation_earliest_day: "Earliest trial day (setup_date being day 1) on which the practitioner re-evaluation may take place to support continued coverage (day number)"
  reevaluation_latest_day: "Latest trial day on which the re-evaluation may take place to support conversion at the end of the trial (day number)"
  failed_trial_requalification: "What a patient who fails the trial needs before a new trial can start (enum: not_applicable, facility_retest_and_visit)"
  break_in_need_days: "Days of a break in need (suspension), beyond the days left in the rental month in which it began, after which a new rental period must start (days)"
  new_period_requirements: "What a new rental period after a long break needs before billing resumes (enum: not_applicable, new_order_and_visit)"
  payer_entry_requalification: "What a patient already on therapy needs when a new primary coverage starts paying mid-rental (enum: not_applicable, prior_test_and_new_visit)"
  self_pay_retail_price: "Cash price of the device sold outright to a self-pay patient (USD)"
  self_pay_delivery_fee: "Non-refundable delivery and setup fee on a self-pay sale (USD)"
  self_pay_return_window_days: "Calendar days after delivery within which a self-pay device may be returned for a refund (days)"
  self_pay_restocking_fee_pct: "Restocking fee withheld from the device price on a self-pay return (percent)"
  manufacturer_warranty_months: "Manufacturer warranty on the base device counted from setup_date (calendar months)"
  reasonable_useful_lifetime_months: "Reasonable useful lifetime of the device counted from setup_date, before which coverage does not replace it for age (calendar months)"
  repair_labor_rate_per_unit: "Labor rate per 15-minute unit on a repair of a patient-owned device (K0739) (USD)"
  repair_cost_replace_threshold_pct: "Repair cost, as a percentage of fee_schedule_purchase_price, above which the device is replaced instead of repaired (percent)"
  loaner_during_owned_repair: "Whether a loaner device is issued while a patient-owned device is out for repair (boolean)"
  malfunction_swap_business_days: "Business days within which a malfunctioning rented device is swapped, or a warranty depot repair is turned around for a self-pay device (days)"
  pickup_lead_business_days: "Business days after the patient confirms a return within which the pickup is scheduled (days)"
  unreturned_equipment_days: "Calendar days after the confirmed pickup date after which a rented device still not recovered is charged to the patient (days); 0 when the device is never picked up"
  unreturned_equipment_charge: "Charge to the patient for a rented device not recovered (USD)"
  damage_fee_beyond_wear: "Charge to the patient for a rented device recovered damaged beyond normal wear (USD)"
  pressure_change_requires_new_order: "Whether any change to the prescribed pressure requires a new written order (boolean)"
  max_pressure_cmh2o: "Highest pressure the device class delivers (cmH2O)"
  backup_rate_capable: "Whether the class delivers a backup respiratory rate (boolean)"
  replacement_requires_new_visit: "Whether a replacement ordered after the reasonable useful lifetime requires a new in-person practitioner visit (boolean)"
  lost_stolen_report_required: "Whether replacement before the end of the useful lifetime for loss or theft requires a police, fire or insurance report (boolean)"

