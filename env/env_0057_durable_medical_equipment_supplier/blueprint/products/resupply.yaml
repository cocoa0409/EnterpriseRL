      quantity_on_hand_check_required: false
      contact_channels_allowed: ["text_message", "patient_portal", "email"]
      max_months_per_shipment: 3
      missed_cycle_backfill_allowed: true
      early_ship_for_travel_days: 30
      rx_validity_months: 12
      continued_use_proof_months: 0
      continued_use_basis: "none"
      supplies_prior_auth_required: false
      supplies_pa_validity_months: 0
      interface_type_change_limited: false
      max_interface_exchanges_per_period: 1
      mask_fit_exchange_days: 30
      defect_replacement_days: 30
      defect_replacement_counts_toward_limit: false
      lost_package_trace_business_days: 7
      heated_tubing_excludes_standard: false
      humidifier_chamber_requires_humidifier: false
      ground_shipping_fee: 6.95
      self_pay_free_shipping_min: 75.0
      expedited_shipping_fee: 14.95
      ground_transit_business_days: 5
      expedited_transit_business_days: 2
      branch_pickup_allowed: true
      inpatient_hold_applies: false
      hold_max_days: 30
      outside_device_proof_required: false

events:
  - type: resupply_enroll
    target: resupply_holdings
    mutation: create
    meaning: A patient is enrolled in the supply program for a PAP device.
    grain: one row per enrollment
    fields:
      customer_id: patient
      variant_name: schedule matching the primary coverage billed
      coverage_id: coverage billed; empty for the self-pay subscription
      pap_holding_id: Summit Ridge device record served; empty for an outside device
      device_source: who furnished the device
      mask_style: interface style used
      humidifier_in_use: whether a heated humidifier is used
      heated_tubing_in_use: whether heated tubing is used
      auto_ship: automatic shipment opt-in
      rx_date: date of the supply order
      last_continued_use_date: latest proof of continued use
      enrollment_date: enrollment date
    triggers: []

  - type: resupply_activate
    target: resupply_holdings
    mutation: {transition: {from: enrolled_pending, to: active}}
    meaning: The enrollment is verified and shipments may start.
    grain: one row per transaction
    fields:
      hold_reason: none
    triggers: []

  - type: resupply_enroll_decline
    target: resupply_holdings
    mutation: {transition: {from: enrolled_pending, to: cancelled}}
    meaning: The patient declines the enrollment before the first shipment.
    grain: one row per transaction
    fields:
      cancelled_date: date declined
    triggers: []

  - type: resupply_hold
    target: resupply_holdings
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Shipments stop for a recorded reason.
    grain: one row per transaction
    fields:
      hold_reason: reason for the hold
      hold_date: date the hold began
    triggers: []

  - type: resupply_release
    target: resupply_holdings
    mutation: {transition: {from: on_hold, to: active}}
    meaning: The hold reason is cleared.
    grain: one row per transaction
    fields:
      hold_reason: none
      hold_date: cleared
    triggers: []

  - type: resupply_opt_out
    target: resupply_holdings
    mutation: {transition: [{from: active, to: cancelled}, {from: on_hold, to: cancelled}]}
    meaning: The patient opts out of the program.
    grain: one row per transaction
    fields:
      cancelled_date: opt-out date
    triggers: []

  - type: resupply_hold_expire
    target: resupply_holdings
    mutation: {transition: {from: on_hold, to: cancelled}}
    meaning: A hold not cleared in time closes the enrollment.
    grain: one row per transaction
    fields:
      cancelled_date: closing date
    triggers: []

  - type: resupply_schedule_change
    target: resupply_holdings
    mutation: update
    meaning: The schedule and coverage billed change because the patient's primary coverage changed.
    grain: one row per transaction
    fields:
      variant_name: schedule matching the new primary coverage
      coverage_id: new coverage billed (empty for self-pay)
    triggers: []

  - type: resupply_order_renew
    target: resupply_holdings
    mutation: update
    meaning: A renewed supply order or a newer proof of continued use is recorded.
    grain: one row per transaction
    fields:
      rx_date: date of the renewed order
      last_continued_use_date: date of the newer proof
    triggers: []

  - type: resupply_preference_update
    target: resupply_holdings
    mutation: update
    meaning: The patient's interface style, humidifier or tubing use, or automatic-shipment choice changes.
    grain: one row per transaction
    fields:
      mask_style: interface style now used
      humidifier_in_use: humidifier use
      heated_tubing_in_use: heated tubing use
      auto_ship: automatic shipment opt-in
    triggers: []

  - type: resupply_item_shipped
    target: resupply_shipments
    meaning: A quantity of one supply item ships and is billed to coverage or to the patient.
    grain: one row per item code per shipment
    distinguish_by: [hcpcs_code, service_from_date, billing_basis]
    fields:
      coverage_id: coverage billed (empty for self-pay)
      billing_basis: coverage or self_pay
      hcpcs_code: item code
      quantity: units shipped
      service_from_date: ship date
      covers_through_date: last day of use the units cover
      adjudication_date: remittance or transaction date
      allowed_amount: allowed amount
      payer_paid_amount: payer payment
      patient_responsibility: patient cost share
      self_pay_amount: amount charged to the card
      shipping_method: how it shipped
      claim_number: claim control number
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: resupply, source_bill_id: resupply_line_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}

  - type: resupply_item_denied
    target: resupply_shipments
    meaning: The payer denies a shipped item line.
    grain: one row per denied item line
    distinguish_by: [hcpcs_code, service_from_date, denial_reason]
    fields:
      coverage_id: coverage billed
      billing_basis: coverage
      hcpcs_code: item code
      quantity: units billed
      service_from_date: ship date
      adjudication_date: denial remittance date
      denial_reason: denial reason
      claim_number: claim control number
    triggers: []

  - type: resupply_line_reversal
    target: resupply_shipments
    meaning: The payer takes back payment of a shipped item line.
    grain: one row per paid line reversed
    distinguish_by: [original_line_id]
    fields:
      coverage_id: coverage that recouped
      original_line_id: the paid line reversed
      reversal_reason: why it was taken back
      payer_paid_amount: amount taken back
      service_from_date: date of service of the reversed line
      adjudication_date: recoupment remittance date
      claim_number: claim control number of the reversal
    triggers:
      - event: coverage:coverage_adjustment
        map: {coverage_id: coverage_id, customer_id: customer_id, adjustment_reason: claim_reversal}

  - type: resupply_no_charge_replacement
    target: resupply_shipments
    meaning: An item is shipped again at no charge to replace one that did not fit, was defective, was lost in transit or was the wrong item.
    grain: one row per replaced line and reason
    distinguish_by: [original_line_id, replacement_reason]
    fields:
      billing_basis: no_charge
      hcpcs_code: item code shipped
      quantity: units shipped
      service_from_date: ship date
      original_line_id: the line replaced
      replacement_reason: why it was replaced
      shipping_method: how it shipped
    triggers: []

  - type: resupply_shipping_charge
    target: resupply_shipments
    meaning: A patient-paid shipping charge (expedited, or ground on a small self-pay order) is taken for one shipment.
    grain: one row per shipment carrying a shipping charge
    distinguish_by: [service_from_date, shipping_method]
    fields:
      billing_basis: self_pay
      hcpcs_code: none
      service_from_date: ship date
      shipping_method: method charged for
      self_pay_amount: shipping charge
    triggers: []

  - type: resupply_refill_confirmed
    target: resupply_contacts
    meaning: The patient affirmatively asks for a refill of named items and reports their supply status.
    grain: one row per refill confirmation
    distinguish_by: [contact_date, items_requested]
    fields:
      contact_date: confirmation date
      contact_channel: channel used
      items_requested: items asked for
      supply_status_confirmed: reported supply status
    triggers: []

  - type: resupply_refill_declined
    target: resupply_contacts
    meaning: The patient declines a refill or reports that supplies are not yet used up.
    grain: one row per declined refill contact
    distinguish_by: [contact_date]
    fields:
      contact_date: contact date
      contact_channel: channel used
      supply_status_confirmed: reported supply status
    triggers: []

measures:
  - id: resupply_msr_item_covered_through
    window: resupply_item_shipped lines of the holding for one hcpcs_code, excluding lines named by a resupply_line_reversal, up to the handling date
    measure: the latest covers_through_date among those lines (empty when the item never shipped)
  - id: resupply_msr_last_interface
    window: resupply_item_shipped lines of the holding with hcpcs_code A7030 or A7034, excluding reversed lines, up to the handling date
    measure: the hcpcs_code, service_from_date and covers_through_date of the most recent such line

policies:
  - id: resupply_agg_multi_holding
    subject: [resupply_enroll]
    rule: >-
      A patient holds at most `max_per_customer` supply enrollment that is not cancelled; a change of
      payer changes the schedule on the same enrollment rather than opening a second one. No enrollment
      is opened while another enrollment of the patient is enrolled_pending, active or on_hold.
    eligibility:
      - id: one_open_enrollment
        applies_to: [resupply_enroll]
        kind: dedup
        condition: No enrollment is opened while another enrollment of the patient is enrolled_pending, active or on_hold.
        evidence_fields: [resupply_holdings.customer_id, resupply_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resupply_holdings.customer_id]
          action_bindings:
            resupply_holdings.customer_id: customer_id
        dedup_contract:
          table: resupply_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [enrolled_pending, active, on_hold]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: resupply_agg_schedule_match
    subject: [resupply_enroll, resupply_schedule_change, resupply_item_shipped]
    rule: >-
      The schedule an enrollment follows is fixed by the payer class of the patient's active primary
      coverage record (`payer_class_match`): Original Medicare Part B, a Medicare Advantage HMO or PPO,
      Medicaid Fee-for-Service, a Commercial HMO or a Commercial PPO each select their own schedule, and a
      patient with no coverage billed for supplies follows the Self-Pay Supply Subscription. A secondary
      record (including Medicare Supplement Plan G) never changes the schedule. When the primary coverage
      changes, the schedule and coverage_id are changed before the next shipment, and a line shipped
      under the wrong schedule is not billed to either payer until corrected. The schedule moves to a
      new coverage only once it is verified: the new coverage record is in status active. Items already
      shipped keep the periods they were shipped under.
    eligibility:
      - id: new_primary_verified
        applies_to: [resupply_schedule_change]
        kind: state
        condition: the new coverage record is in status active.
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_priority, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active]
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"payer_class": "=payer_class_match"}
        "Medicare Advantage Resupply Schedule": {"payer_class": "=payer_class_match"}
        "Medicaid Resupply Schedule": {"payer_class": "=payer_class_match"}
        "Commercial HMO Resupply Schedule": {"payer_class": "=payer_class_match"}
        "Commercial PPO Resupply Schedule": {"payer_class": "=payer_class_match"}
        "Self-Pay Supply Subscription": {"payer_class": "=payer_class_match"}

  - id: resupply_enrollment
    subject: [resupply_enroll, resupply_activate]
    rule: >-
      An enrollment serves a PAP device the patient is using. A Summit Ridge device qualifies while its
      device record is trial_active, rental_active or patient_owned; an outside device qualifies only with
      proof of ownership or prior coverage where `outside_device_proof_required` is true. The supply order
      must be no older than `rx_validity_months` and, where `continued_use_proof_months` is above 0, the
      latest proof of continued use (`continued_use_basis`) no older than that many months. Where
      `supplies_prior_auth_required` is true an affirmed authorization no older than
      `supplies_pa_validity_months` must be on file. auto_ship may be true only where `auto_ship_allowed`
      is true and only on the patient's own choice. An enrollment is activated only while the Summit Ridge
      device record it serves is trial_active, rental_active or patient_owned.
    eligibility:
      - id: device_in_use
        applies_to: [resupply_activate]
        kind: state
        condition: An enrollment is activated only while the Summit Ridge device record it serves is trial_active, rental_active or patient_owned.
        evidence_fields: [pap_holdings.status, pap_holdings.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_holdings.pap_holding_id]
          action_bindings:
            pap_holdings.pap_holding_id: pap_holding_id
        state_contract:
          field: pap_holdings.status
          allowed: [trial_active, rental_active, patient_owned]
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months", "use_basis": "=continued_use_basis", "pa_required": "=supplies_prior_auth_required", "pa_months": "=supplies_pa_validity_months", "auto_ship": "=auto_ship_allowed", "outside_proof": "=outside_device_proof_required"}
        "Medicare Advantage Resupply Schedule": {"rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months", "use_basis": "=continued_use_basis", "pa_required": "=supplies_prior_auth_required", "pa_months": "=supplies_pa_validity_months", "auto_ship": "=auto_ship_allowed", "outside_proof": "=outside_device_proof_required"}
        "Medicaid Resupply Schedule": {"rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months", "use_basis": "=continued_use_basis", "pa_required": "=supplies_prior_auth_required", "pa_months": "=supplies_pa_validity_months", "auto_ship": "=auto_ship_allowed", "outside_proof": "=outside_device_proof_required"}
        "Commercial HMO Resupply Schedule": {"rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months", "use_basis": "=continued_use_basis", "pa_required": "=supplies_prior_auth_required", "pa_months": "=supplies_pa_validity_months", "auto_ship": "=auto_ship_allowed", "outside_proof": "=outside_device_proof_required"}
        "Commercial PPO Resupply Schedule": {"rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months", "use_basis": "=continued_use_basis", "pa_required": "=supplies_prior_auth_required", "pa_months": "=supplies_pa_validity_months", "auto_ship": "=auto_ship_allowed", "outside_proof": "=outside_device_proof_required"}
        "Self-Pay Supply Subscription": {"rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months", "use_basis": "=continued_use_basis", "pa_required": "=supplies_prior_auth_required", "pa_months": "=supplies_pa_validity_months", "auto_ship": "=auto_ship_allowed", "outside_proof": "=outside_device_proof_required"}

  - id: resupply_refill_confirmation
    subject: [resupply_refill_confirmed, resupply_refill_declined, resupply_item_shipped]
    rule: >-
      On a schedule whose `auto_ship_allowed` is false, or for a patient whose auto_ship is false, every
      shipment of coverage-billed items must rest on the patient's own refill request: the patient names
      the items wanted and, where `quantity_on_hand_check_required` is true, reports that the supply on
      hand of each is nearly exhausted; the request is accepted only through a channel in
      `contact_channels_allowed`. A refill is confirmed only on the patient's own statement of the items
      wanted and their supply status. An item the patient reports as not_exhausted is not shipped and the
      contact is recorded as declined. Items are shipped no later than `refill_contact_lead_days` after the
      refill is confirmed, counting calendar days from the day after contact_date with the boundary day
      included; an older confirmation needs a new contact. A caregiver may answer for the patient only when
      listed on the profile; Summit Ridge never infers a request from silence.
    eligibility:
      - id: patient_request
        applies_to: [resupply_refill_confirmed]
        kind: caller_fact
        condition: A refill is confirmed only on the patient's own statement of the items wanted and their supply status.
        evidence_fields: [resupply_contacts.items_requested, resupply_contacts.supply_status_confirmed, resupply_contacts.resupply_holding_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [resupply_contacts.resupply_holding_id]
          action_bindings:
            resupply_contacts.resupply_holding_id: resupply_holding_id
      - id: confirmation_fresh
        applies_to: [resupply_item_shipped]
        kind: time
        condition: Items are shipped no later than `refill_contact_lead_days` after the refill is confirmed, counting calendar days from the day after contact_date with the boundary day included; an older confirmation needs a new contact.
        evidence_fields: [resupply_contacts.contact_date, resupply_contacts.resupply_contact_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resupply_contacts.resupply_contact_id]
          action_bindings:
            resupply_contacts.resupply_contact_id: resupply_contact_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the refill is confirmed
          anchor_source: resupply_contacts.contact_date
          relation: not_after
          duration_source: variants.refill_contact_lead_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after contact_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"auto_ship": "=auto_ship_allowed", "on_hand_check": "=quantity_on_hand_check_required", "channels": "=contact_channels_allowed", "lead_days": "=refill_contact_lead_days"}
        "Medicare Advantage Resupply Schedule": {"auto_ship": "=auto_ship_allowed", "on_hand_check": "=quantity_on_hand_check_required", "channels": "=contact_channels_allowed", "lead_days": "=refill_contact_lead_days"}
        "Medicaid Resupply Schedule": {"auto_ship": "=auto_ship_allowed", "on_hand_check": "=quantity_on_hand_check_required", "channels": "=contact_channels_allowed", "lead_days": "=refill_contact_lead_days"}
        "Commercial HMO Resupply Schedule": {"auto_ship": "=auto_ship_allowed", "on_hand_check": "=quantity_on_hand_check_required", "channels": "=contact_channels_allowed", "lead_days": "=refill_contact_lead_days"}
        "Commercial PPO Resupply Schedule": {"auto_ship": "=auto_ship_allowed", "on_hand_check": "=quantity_on_hand_check_required", "channels": "=contact_channels_allowed", "lead_days": "=refill_contact_lead_days"}
        "Self-Pay Supply Subscription": {"auto_ship": "=auto_ship_allowed", "on_hand_check": "=quantity_on_hand_check_required", "channels": "=contact_channels_allowed", "lead_days": "=refill_contact_lead_days"}

  - id: resupply_evt_shipment
    subject: [resupply_item_shipped, resupply_item_denied]
    rule: >-
      Each item follows its own limit `limit_<item>` of qty units per months, measured
      `schedule_period_basis`: the units shipped on one line cover units divided by qty times months
      calendar months from the ship date, and covers_through_date is the day before the same day of the
      month that many months later (month-end fallback). One line may cover at most
      `max_months_per_shipment` months, except an item whose own period is longer, which ships one period
      (qty units) at a time. A new line of an item ships no earlier than `ship_no_earlier_days` before the
      current supply of the item runs out, counting back calendar days from the item's
      resupply_msr_item_covered_through with the boundary day included; travel adds
      `early_ship_for_travel_days` where that value is above 0. Quantities not shipped in an earlier period
      are never added to a later line unless `missed_cycle_backfill_allowed` is true. The allowed amount is
      quantity times the item's `item_fee_schedule` amount times the coverage class's
      allowed_pct_of_fee_schedule divided by 100, rounded to the cent half up. Units beyond the limit are
      not billed to coverage; where `beyond_schedule_self_pay_allowed` is true the patient may buy them as a
      self_pay line. Items ship only while the enrollment is active.
    eligibility:
      - id: enrollment_active
        applies_to: [resupply_item_shipped]
        kind: state
        condition: Items ship only while the enrollment is active.
        evidence_fields: [resupply_holdings.status, resupply_holdings.resupply_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resupply_holdings.resupply_holding_id]
          action_bindings:
            resupply_holdings.resupply_holding_id: resupply_holding_id
        state_contract:
          field: resupply_holdings.status
          allowed: [active]
      - id: not_too_early
        applies_to: [resupply_item_shipped]
        kind: time
        condition: A new line of an item ships no earlier than `ship_no_earlier_days` before the current supply of the item runs out, counting back calendar days from the item's resupply_msr_item_covered_through with the boundary day included; travel adds `early_ship_for_travel_days` where that value is above 0.
        evidence_fields: [resupply_shipments.covers_through_date, resupply_shipments.hcpcs_code, resupply_shipments.resupply_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resupply_shipments.resupply_holding_id, resupply_shipments.hcpcs_code]
          action_bindings:
            resupply_shipments.resupply_holding_id: resupply_holding_id
            resupply_shipments.hcpcs_code: hcpcs_code
        temporal_basis:
          clock: frozen_time
          anchor_event: the current supply of the item runs out
          anchor_source: resupply_shipments.covers_through_date
          relation: not_before
          duration_source: variants.ship_no_earlier_days
          unit: calendar_days
          counting_rule: counting back calendar days from the item's resupply_msr_item_covered_through with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"a7030": "=limit_a7030_full_face_mask", "a7031": "=limit_a7031_full_face_cushion", "a7034": "=limit_a7034_nasal_interface", "a7032": "=limit_a7032_nasal_cushion", "a7033": "=limit_a7033_pillow_pair", "a7035": "=limit_a7035_headgear", "a7036": "=limit_a7036_chinstrap", "a7037": "=limit_a7037_tubing", "a4604": "=limit_a4604_heated_tubing", "a7038": "=limit_a7038_disposable_filter", "a7039": "=limit_a7039_reusable_filter", "a7046": "=limit_a7046_water_chamber", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "fees": "=item_fee_schedule"}
        "Medicare Advantage Resupply Schedule": {"a7030": "=limit_a7030_full_face_mask", "a7031": "=limit_a7031_full_face_cushion", "a7034": "=limit_a7034_nasal_interface", "a7032": "=limit_a7032_nasal_cushion", "a7033": "=limit_a7033_pillow_pair", "a7035": "=limit_a7035_headgear", "a7036": "=limit_a7036_chinstrap", "a7037": "=limit_a7037_tubing", "a4604": "=limit_a4604_heated_tubing", "a7038": "=limit_a7038_disposable_filter", "a7039": "=limit_a7039_reusable_filter", "a7046": "=limit_a7046_water_chamber", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "fees": "=item_fee_schedule"}
