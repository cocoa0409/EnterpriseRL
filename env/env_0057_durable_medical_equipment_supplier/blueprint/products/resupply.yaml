    measures: [resupply_msr_item_covered_through]

  - id: resupply_item_compatibility
    subject: [resupply_item_shipped, resupply_preference_update]
    rule: >-
      Items must fit the equipment recorded on the enrollment. A full_face patient receives A7030 and
      A7031; a nasal patient receives A7034 and A7032; a nasal_pillows patient receives A7034 and A7033;
      A7036 ships only to nasal and nasal_pillows patients. Where `heated_tubing_excludes_standard` is true,
      A4604 and A7037 never both ship inside one tubing period: heated_tubing_in_use decides which one.
      Where `humidifier_chamber_requires_humidifier` is true, A7046 ships only when humidifier_in_use is
      true. Where `interface_type_change_limited` is true, an interface of a different style shipped
      before resupply_msr_last_interface's covers_through_date is not billed to coverage (the patient may
      buy it self-pay) unless it is the fit exchange allowed under resupply_replacement_rules. A change
      of style is recorded as a preference update before items of the new style ship.
    eligibility: []
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"tubing_exclusive": "=heated_tubing_excludes_standard", "chamber_rule": "=humidifier_chamber_requires_humidifier", "interface_limit": "=interface_type_change_limited"}
        "Medicare Advantage Resupply Schedule": {"tubing_exclusive": "=heated_tubing_excludes_standard", "chamber_rule": "=humidifier_chamber_requires_humidifier", "interface_limit": "=interface_type_change_limited"}
        "Medicaid Resupply Schedule": {"tubing_exclusive": "=heated_tubing_excludes_standard", "chamber_rule": "=humidifier_chamber_requires_humidifier", "interface_limit": "=interface_type_change_limited"}
        "Commercial HMO Resupply Schedule": {"tubing_exclusive": "=heated_tubing_excludes_standard", "chamber_rule": "=humidifier_chamber_requires_humidifier", "interface_limit": "=interface_type_change_limited"}
        "Commercial PPO Resupply Schedule": {"tubing_exclusive": "=heated_tubing_excludes_standard", "chamber_rule": "=humidifier_chamber_requires_humidifier", "interface_limit": "=interface_type_change_limited"}
        "Self-Pay Supply Subscription": {"tubing_exclusive": "=heated_tubing_excludes_standard", "chamber_rule": "=humidifier_chamber_requires_humidifier", "interface_limit": "=interface_type_change_limited"}
    measures: [resupply_msr_last_interface]

  - id: resupply_replacement_rules
    subject: [resupply_no_charge_replacement]
    rule: >-
      Summit Ridge reships at no charge, without billing coverage and without counting toward any limit
      (`defect_replacement_counts_toward_limit`), in four cases tied to one original line: a mask_fit_exchange
      of a newly shipped interface or cushion within `mask_fit_exchange_days` of its ship date, limited to
      `max_interface_exchanges_per_period` per new interface; a manufacturer_defect reported within
      `defect_replacement_days` of the ship date; a carrier_lost shipment with no delivery confirmation after
      `lost_package_trace_business_days` business days; and a wrong_item shipped in error. An original line
      receives at most one no-charge replacement per reason. Opened items are otherwise never returned or
      exchanged.
    eligibility:
      - id: one_replacement_per_reason
        applies_to: [resupply_no_charge_replacement]
        kind: dedup
        condition: An original line receives at most one no-charge replacement per reason.
        evidence_fields: [resupply_shipments.original_line_id, resupply_shipments.replacement_reason, resupply_shipments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resupply_shipments.original_line_id]
          action_bindings:
            resupply_shipments.original_line_id: original_line_id
        dedup_contract:
          table: resupply_shipments
          mode: separate_record
          object_bindings: {original_line_id: original_line_id, replacement_reason: replacement_reason}
          duplicate_filters: {event_type: [resupply_no_charge_replacement]}
          distinct_fields: []
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"fit_days": "=mask_fit_exchange_days", "fit_max": "=max_interface_exchanges_per_period", "defect_days": "=defect_replacement_days", "counts": "=defect_replacement_counts_toward_limit", "trace_days": "=lost_package_trace_business_days"}
        "Medicare Advantage Resupply Schedule": {"fit_days": "=mask_fit_exchange_days", "fit_max": "=max_interface_exchanges_per_period", "defect_days": "=defect_replacement_days", "counts": "=defect_replacement_counts_toward_limit", "trace_days": "=lost_package_trace_business_days"}
        "Medicaid Resupply Schedule": {"fit_days": "=mask_fit_exchange_days", "fit_max": "=max_interface_exchanges_per_period", "defect_days": "=defect_replacement_days", "counts": "=defect_replacement_counts_toward_limit", "trace_days": "=lost_package_trace_business_days"}
        "Commercial HMO Resupply Schedule": {"fit_days": "=mask_fit_exchange_days", "fit_max": "=max_interface_exchanges_per_period", "defect_days": "=defect_replacement_days", "counts": "=defect_replacement_counts_toward_limit", "trace_days": "=lost_package_trace_business_days"}
        "Commercial PPO Resupply Schedule": {"fit_days": "=mask_fit_exchange_days", "fit_max": "=max_interface_exchanges_per_period", "defect_days": "=defect_replacement_days", "counts": "=defect_replacement_counts_toward_limit", "trace_days": "=lost_package_trace_business_days"}
        "Self-Pay Supply Subscription": {"fit_days": "=mask_fit_exchange_days", "fit_max": "=max_interface_exchanges_per_period", "defect_days": "=defect_replacement_days", "counts": "=defect_replacement_counts_toward_limit", "trace_days": "=lost_package_trace_business_days"}

  - id: resupply_hold_rules
    subject: [resupply_hold, resupply_release, resupply_hold_expire, resupply_opt_out, resupply_enroll_decline]
    rule: >-
      An active enrollment goes on hold with the matching hold_reason when the patient is an inpatient or
      in skilled nursing (where `inpatient_hold_applies` is true), the supply order is older than
      `rx_validity_months`, the proof of continued use is older than `continued_use_proof_months`, the
      primary coverage cannot be verified, or the Summit Ridge device record is returned. No item ships
      during a hold, and the period of an item does not pause during it. The hold is released when its
      reason is cleared. An enrollment on hold is closed only after the hold has lasted `hold_max_days`
      days, counting calendar days from the day after hold_date with the boundary day included. The patient
      may decline or opt out at any time by their own confirmation; items already shipped are not
      returned.
    eligibility:
      - id: hold_lasted
        applies_to: [resupply_hold_expire]
        kind: time
        condition: An enrollment on hold is closed only after the hold has lasted `hold_max_days` days, counting calendar days from the day after hold_date with the boundary day included.
        evidence_fields: [resupply_holdings.hold_date, resupply_holdings.resupply_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resupply_holdings.resupply_holding_id]
          action_bindings:
            resupply_holdings.resupply_holding_id: resupply_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold has lasted
          anchor_source: resupply_holdings.hold_date
          relation: not_before
          duration_source: variants.hold_max_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after hold_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months"}
        "Medicare Advantage Resupply Schedule": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months"}
        "Medicaid Resupply Schedule": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months"}
        "Commercial HMO Resupply Schedule": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months"}
        "Commercial PPO Resupply Schedule": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months"}
        "Self-Pay Supply Subscription": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "use_proof_months": "=continued_use_proof_months"}

  - id: resupply_evt_line_reversal
    subject: [resupply_line_reversal]
    rule: >-
      A recoupment of a paid item line is recorded against that line as original_line_id, one reversal per
      line named by the payer; a paid line is reversed at most once. The reversed line no longer counts for
      resupply_msr_item_covered_through, and every patient charge stemming from it is removed under the
      coverage charter.
    eligibility:
      - id: resupply_reverse_once
        applies_to: [resupply_line_reversal]
        kind: dedup
        condition: a paid line is reversed at most once.
        evidence_fields: [resupply_shipments.original_line_id, resupply_shipments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [resupply_shipments.original_line_id]
          action_bindings:
            resupply_shipments.original_line_id: original_line_id
        dedup_contract:
          table: resupply_shipments
          mode: separate_record
          object_bindings: {original_line_id: original_line_id}
          duplicate_filters: {event_type: [resupply_line_reversal]}
          distinct_fields: []

  - id: resupply_shipping
    subject: [resupply_shipping_charge, resupply_item_shipped]
    rule: >-
      Ground shipping costs `ground_shipping_fee`, waived for a self-pay subscription order whose items total
      at least `self_pay_free_shipping_min` when that value is above 0.00, and arrives in
      `ground_transit_business_days` business days. Expedited shipping, at the patient's request only, costs
      `expedited_shipping_fee` per shipment, arrives in `expedited_transit_business_days` business days, and
      is charged to the patient's card, never to coverage. Branch pickup is free where
      `branch_pickup_allowed` is true. One shipping charge is taken per shipment, whatever the number of
      item lines.
    eligibility: []
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"ground_fee": "=ground_shipping_fee", "free_min": "=self_pay_free_shipping_min", "expedited_fee": "=expedited_shipping_fee", "ground_days": "=ground_transit_business_days", "expedited_days": "=expedited_transit_business_days", "pickup": "=branch_pickup_allowed"}
        "Medicare Advantage Resupply Schedule": {"ground_fee": "=ground_shipping_fee", "free_min": "=self_pay_free_shipping_min", "expedited_fee": "=expedited_shipping_fee", "ground_days": "=ground_transit_business_days", "expedited_days": "=expedited_transit_business_days", "pickup": "=branch_pickup_allowed"}
        "Medicaid Resupply Schedule": {"ground_fee": "=ground_shipping_fee", "free_min": "=self_pay_free_shipping_min", "expedited_fee": "=expedited_shipping_fee", "ground_days": "=ground_transit_business_days", "expedited_days": "=expedited_transit_business_days", "pickup": "=branch_pickup_allowed"}
        "Commercial HMO Resupply Schedule": {"ground_fee": "=ground_shipping_fee", "free_min": "=self_pay_free_shipping_min", "expedited_fee": "=expedited_shipping_fee", "ground_days": "=ground_transit_business_days", "expedited_days": "=expedited_transit_business_days", "pickup": "=branch_pickup_allowed"}
        "Commercial PPO Resupply Schedule": {"ground_fee": "=ground_shipping_fee", "free_min": "=self_pay_free_shipping_min", "expedited_fee": "=expedited_shipping_fee", "ground_days": "=ground_transit_business_days", "expedited_days": "=expedited_transit_business_days", "pickup": "=branch_pickup_allowed"}
        "Self-Pay Supply Subscription": {"ground_fee": "=ground_shipping_fee", "free_min": "=self_pay_free_shipping_min", "expedited_fee": "=expedited_shipping_fee", "ground_days": "=ground_transit_business_days", "expedited_days": "=expedited_transit_business_days", "pickup": "=branch_pickup_allowed"}

  - id: resupply_self_pay_pricing
    subject: [resupply_item_shipped]
    rule: >-
      A self_pay line costs quantity times the item's `self_pay_item_prices` amount; on the Self-Pay Supply
      Subscription the `subscription_discount_pct` discount applies to every line, rounded to the cent half
      up per line, while a beyond-schedule self_pay line on a coverage schedule receives no discount. A
      self-pay line is charged to the card on file on its ship date and never posts to a coverage account.
      The subscription has no unit limits but still follows `max_months_per_shipment`.
    eligibility: []
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"prices": "=self_pay_item_prices", "discount_pct": "=subscription_discount_pct", "beyond_schedule": "=beyond_schedule_self_pay_allowed"}
        "Medicare Advantage Resupply Schedule": {"prices": "=self_pay_item_prices", "discount_pct": "=subscription_discount_pct", "beyond_schedule": "=beyond_schedule_self_pay_allowed"}
        "Medicaid Resupply Schedule": {"prices": "=self_pay_item_prices", "discount_pct": "=subscription_discount_pct", "beyond_schedule": "=beyond_schedule_self_pay_allowed"}
        "Commercial HMO Resupply Schedule": {"prices": "=self_pay_item_prices", "discount_pct": "=subscription_discount_pct", "beyond_schedule": "=beyond_schedule_self_pay_allowed"}
        "Commercial PPO Resupply Schedule": {"prices": "=self_pay_item_prices", "discount_pct": "=subscription_discount_pct", "beyond_schedule": "=beyond_schedule_self_pay_allowed"}
        "Self-Pay Supply Subscription": {"prices": "=self_pay_item_prices", "discount_pct": "=subscription_discount_pct", "beyond_schedule": "=beyond_schedule_self_pay_allowed"}

  - id: resupply_order_continuity
    subject: [resupply_order_renew, resupply_preference_update]
    rule: >-
      A renewed supply order is recorded only from the practitioner's signed order, and a newer proof of
      continued use only from a compliance download or practitioner note of the kind `continued_use_basis`
      accepts; a patient's own account of use is never proof. Recording either clears an order_expired or
      continued_use_lapsed hold. The automatic-shipment choice is the patient's own and is set only where
      `auto_ship_allowed` is true; turning it off takes effect for the next cycle.
    eligibility: []
    params:
      per_tier:
        "Medicare Part B Resupply Schedule": {"use_basis": "=continued_use_basis", "auto_ship": "=auto_ship_allowed", "rx_months": "=rx_validity_months"}
        "Medicare Advantage Resupply Schedule": {"use_basis": "=continued_use_basis", "auto_ship": "=auto_ship_allowed", "rx_months": "=rx_validity_months"}
        "Medicaid Resupply Schedule": {"use_basis": "=continued_use_basis", "auto_ship": "=auto_ship_allowed", "rx_months": "=rx_validity_months"}
        "Commercial HMO Resupply Schedule": {"use_basis": "=continued_use_basis", "auto_ship": "=auto_ship_allowed", "rx_months": "=rx_validity_months"}
        "Commercial PPO Resupply Schedule": {"use_basis": "=continued_use_basis", "auto_ship": "=auto_ship_allowed", "rx_months": "=rx_validity_months"}
        "Self-Pay Supply Subscription": {"use_basis": "=continued_use_basis", "auto_ship": "=auto_ship_allowed", "rx_months": "=rx_validity_months"}
