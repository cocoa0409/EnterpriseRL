events:
  - type: urology_enroll
    target: urology_holdings
    mutation: create
    meaning: A catheter supply order arrives and the patient is enrolled in a program.
    grain: one row per enrollment
    fields:
      customer_id: patient
      variant_name: program enrolled
      coverage_id: coverage billed; empty for self-pay
      ordering_npi: ordering practitioner NPI
      referral_source: kind of referral partner
      diagnosis_basis: documented condition
      condition_permanent: permanence documented
      catheterizations_per_day: catheterizations per day ordered
      criteria_documented_date: date of program criteria documentation
      uti_count_12_months: documented infections in 12 months
      french_size: catheter size on the order
      rx_date: order date
      last_continued_need_date: latest continued-need documentation
      enrollment_date: enrollment date
    triggers: []

  - type: urology_activate
    target: urology_holdings
    mutation: {transition: {from: enrolled_pending, to: active}}
    meaning: The enrollment is verified and shipments may start.
    grain: one row per transaction
    fields:
      hold_reason: none
    triggers: []

  - type: urology_enroll_decline
    target: urology_holdings
    mutation: {transition: {from: enrolled_pending, to: cancelled}}
    meaning: The patient declines before the first shipment.
    grain: one row per transaction
    fields:
      cancelled_date: date declined
    triggers: []

  - type: urology_hold
    target: urology_holdings
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Shipments stop for a recorded reason.
    grain: one row per transaction
    fields:
      hold_reason: reason for the hold
      hold_date: hold start date
    triggers: []

  - type: urology_release
    target: urology_holdings
    mutation: {transition: {from: on_hold, to: active}}
    meaning: The hold reason is cleared.
    grain: one row per transaction
    fields:
      hold_reason: none
      hold_date: cleared
    triggers: []

  - type: urology_opt_out
    target: urology_holdings
    mutation: {transition: [{from: active, to: cancelled}, {from: on_hold, to: cancelled}]}
    meaning: The patient leaves the program.
    grain: one row per transaction
    fields:
      cancelled_date: date left
    triggers: []

  - type: urology_hold_expire
    target: urology_holdings
    mutation: {transition: {from: on_hold, to: cancelled}}
    meaning: A hold not cleared in time closes the enrollment.
    grain: one row per transaction
    fields:
      cancelled_date: closing date
    triggers: []

  - type: urology_program_switch
    target: urology_holdings
    mutation: update
    meaning: The patient moves to another catheter program (for example straight to coudé) on new documentation.
    grain: one row per transaction
    fields:
      variant_name: new program
      criteria_documented_date: date of the documentation supporting the new program
      uti_count_12_months: documented infections when relevant
      french_size: size on the new order
      rx_date: date of the new order
    triggers: []

  - type: urology_order_renew
    target: urology_holdings
    mutation: update
    meaning: A renewed order or newer continued-need documentation is recorded.
    grain: one row per transaction
    fields:
      rx_date: renewed order date
      last_continued_need_date: newer continued-need documentation date
    triggers: []

  - type: urology_item_shipped
    target: urology_shipments
    meaning: A quantity of one urological item ships and is billed to coverage or the patient.
    grain: one row per item code per shipment
    distinguish_by: [hcpcs_code, service_from_date, billing_basis]
    fields:
      coverage_id: coverage billed
      billing_basis: coverage or self_pay
      hcpcs_code: item code
      quantity: units shipped
      service_from_date: ship date
      covers_through_date: last day of use covered
      adjudication_date: remittance or charge date
      allowed_amount: allowed amount
      payer_paid_amount: payer payment
      patient_responsibility: patient cost share
      self_pay_amount: card charge
      shipping_method: how it shipped
      claim_number: claim control number
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: urology, source_bill_id: urology_line_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}

  - type: urology_item_denied
    target: urology_shipments
    meaning: The payer denies a shipped item line.
    grain: one row per denied item line
    distinguish_by: [hcpcs_code, service_from_date, denial_reason]
    fields:
      coverage_id: coverage billed
      billing_basis: coverage
      hcpcs_code: item code
      quantity: units billed
      service_from_date: ship date
      adjudication_date: denial remittance date
      denial_reason: denial reason
      claim_number: claim control number
    triggers: []

  - type: urology_line_reversal
    target: urology_shipments
    meaning: The payer takes back a paid item line.
    grain: one row per paid line reversed
    distinguish_by: [original_line_id]
    fields:
      coverage_id: coverage that recouped
      original_line_id: line reversed
      reversal_reason: why taken back
      payer_paid_amount: amount taken back
      service_from_date: date of service of the reversed line
      adjudication_date: recoupment remittance date
      claim_number: claim control number of the reversal
    triggers:
      - event: coverage:coverage_adjustment
        map: {coverage_id: coverage_id, customer_id: customer_id, adjustment_reason: claim_reversal}

  - type: urology_no_charge_replacement
    target: urology_shipments
    meaning: An item ships again at no charge (product switch, defect, carrier loss or wrong item).
    grain: one row per replaced line and reason
    distinguish_by: [original_line_id, replacement_reason]
    fields:
      billing_basis: no_charge
      hcpcs_code: item code
      quantity: units shipped
      service_from_date: ship date
      original_line_id: line replaced
      replacement_reason: reason
      shipping_method: how it shipped
    triggers: []

  - type: urology_sample_shipped
    target: urology_shipments
    meaning: A free trial sample of catheters ships before or during enrollment.
    grain: one row per sample shipment
    distinguish_by: [service_from_date, hcpcs_code]
    fields:
      billing_basis: no_charge
      hcpcs_code: catheter code sampled
      quantity: units sent
      service_from_date: ship date
      shipping_method: how it shipped
    triggers: []

  - type: urology_refill_confirmed
    target: urology_contacts
    meaning: The patient asks for a refill of named items and reports supply nearly exhausted.
    grain: one row per refill confirmation
    distinguish_by: [contact_date, items_requested]
    fields:
      contact_date: confirmation date
      contact_channel: channel used
      items_requested: items asked for
      supply_status_confirmed: reported supply status
    triggers: []

  - type: urology_refill_declined
    target: urology_contacts
    meaning: The patient declines a refill or reports supplies not yet used up.
    grain: one row per declined contact
    distinguish_by: [contact_date]
    fields:
      contact_date: contact date
      contact_channel: channel used
      supply_status_confirmed: reported supply status
    triggers: []

measures:
  - id: urology_msr_item_covered_through
    window: urology_item_shipped lines of the holding for one hcpcs_code, excluding lines named by a urology_line_reversal, up to the handling date
    measure: the latest covers_through_date among those lines (empty when the item never shipped)
  - id: urology_msr_samples_this_year
    window: urology_sample_shipped lines of the patient's enrollments with service_from_date in the calendar year of the handling date
    measure: count of those lines

policies:
  - id: urology_agg_multi_holding
    subject: [urology_enroll]
    rule: >-
      A patient holds at most `max_per_customer` urological enrollment that is not cancelled; a change of
      catheter type is a program switch on the same enrollment. No enrollment is opened while another
      enrollment of the patient is enrolled_pending, active or on_hold.
    eligibility:
      - id: one_open_urology_enrollment
        applies_to: [urology_enroll]
        kind: dedup
        condition: No enrollment is opened while another enrollment of the patient is enrolled_pending, active or on_hold.
        evidence_fields: [urology_holdings.customer_id, urology_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_holdings.customer_id]
          action_bindings:
            urology_holdings.customer_id: customer_id
        dedup_contract:
          table: urology_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [enrolled_pending, active, on_hold]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: urology_qualification
    subject: [urology_enroll, urology_activate]
    rule: >-
      Coverage pays for urological supplies only when the condition is permanent (expected to last at
      least `permanence_months` months and documented as indefinite) and the program's
      `criteria_documentation` is on file: for the coudé program, documentation that a straight tip cannot
      be inserted; for the closed-system program, a qualifying criterion, which on the infection ground
      means at least `uti_count_required` infections in the 12 months before criteria_documented_date while
      on sterile intermittent catheters; for the all-silicone program, latex allergy or recurrent
      encrustation. The order must be no older than `rx_validity_months` and continued need documented
      within `continued_need_proof_months`. When the primary coverage's class requires prior authorization
      for urological supplies (coverage parameter prior_auth_catheter_required) and the program is
      `prior_auth_program_eligible`, an enrollment is activated only once a prior_authorization request on
      this holding is approved.
    eligibility:
      - id: urology_prior_auth
        applies_to: [urology_activate]
        kind: authorization
        condition: When the primary coverage's class requires prior authorization for urological supplies (coverage parameter prior_auth_catheter_required) and the program is `prior_auth_program_eligible`, an enrollment is activated only once a prior_authorization request on this holding is approved.
        evidence_fields: [urology_requests.request_type, urology_requests.request_status, urology_requests.urology_holding_id, coverage_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_requests.urology_holding_id]
          action_bindings:
            urology_requests.urology_holding_id: urology_holding_id
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"permanence": "=permanence_months", "criteria": "=criteria_documentation", "uti_required": "=uti_count_required", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months", "pa_eligible": "=prior_auth_program_eligible"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"permanence": "=permanence_months", "criteria": "=criteria_documentation", "uti_required": "=uti_count_required", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months", "pa_eligible": "=prior_auth_program_eligible"}
        "Closed-System Catheter Program (A4353)": {"permanence": "=permanence_months", "criteria": "=criteria_documentation", "uti_required": "=uti_count_required", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months", "pa_eligible": "=prior_auth_program_eligible"}
        "Indwelling Foley Catheter Program (A4338)": {"permanence": "=permanence_months", "criteria": "=criteria_documentation", "uti_required": "=uti_count_required", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months", "pa_eligible": "=prior_auth_program_eligible"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"permanence": "=permanence_months", "criteria": "=criteria_documentation", "uti_required": "=uti_count_required", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months", "pa_eligible": "=prior_auth_program_eligible"}
        "Male External Catheter Program (A4349)": {"permanence": "=permanence_months", "criteria": "=criteria_documentation", "uti_required": "=uti_count_required", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months", "pa_eligible": "=prior_auth_program_eligible"}

  - id: urology_evt_shipment
    subject: [urology_item_shipped, urology_item_denied]
    rule: >-
      Monthly quantities follow the program: `primary_monthly_limit` catheters (plus
      `extra_units_with_documentation` when obstruction, infection or leakage is documented, and never more
      than one catheter per ordered catheterization per day where `per_catheterization_basis` is true),
      `lubricant_monthly_limit` lubricant units, `insertion_tray_monthly_limit` trays,
      `bedside_bag_monthly_limit` bedside bags, `leg_bag_monthly_limit` leg bags and
      `adhesive_remover_monthly_limit` adhesive remover units, measured `supply_period_basis`. One line may
      cover at most `max_months_per_shipment` months; covers_through_date is the day before the same day of
      the month that many months after the ship date. An item ships no earlier than `ship_no_earlier_days`
      before the current supply of the item runs out, counting back calendar days from the item's
      urology_msr_item_covered_through with the boundary day included. Unshipped months are never added
      later unless `missed_cycle_backfill_allowed` is true. The allowed amount is quantity times the item's
      fee (`primary_fee_per_unit`, `lubricant_fee_per_unit`, `insertion_tray_fee`, `bedside_bag_fee`,
      `leg_bag_fee` or `adhesive_remover_fee`) times the coverage class's allowed_pct_of_fee_schedule
      divided by 100, rounded to the cent half up. Supplies for a covered skilled nursing stay are not
      billed where `nursing_facility_billing_excluded` is true. Items ship only while the enrollment is
      active.
      Catheters are billed under the program's `primary_hcpcs` and lubricant under `lubricant_hcpcs`.
    eligibility:
      - id: urology_enrollment_active
        applies_to: [urology_item_shipped]
        kind: state
        condition: Items ship only while the enrollment is active.
        evidence_fields: [urology_holdings.status, urology_holdings.urology_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_holdings.urology_holding_id]
          action_bindings:
            urology_holdings.urology_holding_id: urology_holding_id
        state_contract:
          field: urology_holdings.status
          allowed: [active]
      - id: urology_not_too_early
        applies_to: [urology_item_shipped]
        kind: time
        condition: An item ships no earlier than `ship_no_earlier_days` before the current supply of the item runs out, counting back calendar days from the item's urology_msr_item_covered_through with the boundary day included.
        evidence_fields: [urology_shipments.covers_through_date, urology_shipments.hcpcs_code, urology_shipments.urology_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_shipments.urology_holding_id, urology_shipments.hcpcs_code]
          action_bindings:
            urology_shipments.urology_holding_id: urology_holding_id
            urology_shipments.hcpcs_code: hcpcs_code
        temporal_basis:
          clock: frozen_time
          anchor_event: the current supply of the item runs out
          anchor_source: urology_shipments.covers_through_date
          relation: not_before
          duration_source: variants.ship_no_earlier_days
          unit: calendar_days
          counting_rule: counting back calendar days from the item's urology_msr_item_covered_through with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"catheter_code": "=primary_hcpcs", "lubricant_code": "=lubricant_hcpcs", "catheters": "=primary_monthly_limit", "extra": "=extra_units_with_documentation", "per_cath": "=per_catheterization_basis", "lubricant": "=lubricant_monthly_limit", "trays": "=insertion_tray_monthly_limit", "bedside": "=bedside_bag_monthly_limit", "leg": "=leg_bag_monthly_limit", "remover": "=adhesive_remover_monthly_limit", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "catheter_fee": "=primary_fee_per_unit"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"catheter_code": "=primary_hcpcs", "lubricant_code": "=lubricant_hcpcs", "catheters": "=primary_monthly_limit", "extra": "=extra_units_with_documentation", "per_cath": "=per_catheterization_basis", "lubricant": "=lubricant_monthly_limit", "trays": "=insertion_tray_monthly_limit", "bedside": "=bedside_bag_monthly_limit", "leg": "=leg_bag_monthly_limit", "remover": "=adhesive_remover_monthly_limit", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "catheter_fee": "=primary_fee_per_unit"}
        "Closed-System Catheter Program (A4353)": {"catheter_code": "=primary_hcpcs", "lubricant_code": "=lubricant_hcpcs", "catheters": "=primary_monthly_limit", "extra": "=extra_units_with_documentation", "per_cath": "=per_catheterization_basis", "lubricant": "=lubricant_monthly_limit", "trays": "=insertion_tray_monthly_limit", "bedside": "=bedside_bag_monthly_limit", "leg": "=leg_bag_monthly_limit", "remover": "=adhesive_remover_monthly_limit", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "catheter_fee": "=primary_fee_per_unit"}
        "Indwelling Foley Catheter Program (A4338)": {"catheter_code": "=primary_hcpcs", "lubricant_code": "=lubricant_hcpcs", "catheters": "=primary_monthly_limit", "extra": "=extra_units_with_documentation", "per_cath": "=per_catheterization_basis", "lubricant": "=lubricant_monthly_limit", "trays": "=insertion_tray_monthly_limit", "bedside": "=bedside_bag_monthly_limit", "leg": "=leg_bag_monthly_limit", "remover": "=adhesive_remover_monthly_limit", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "catheter_fee": "=primary_fee_per_unit"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"catheter_code": "=primary_hcpcs", "lubricant_code": "=lubricant_hcpcs", "catheters": "=primary_monthly_limit", "extra": "=extra_units_with_documentation", "per_cath": "=per_catheterization_basis", "lubricant": "=lubricant_monthly_limit", "trays": "=insertion_tray_monthly_limit", "bedside": "=bedside_bag_monthly_limit", "leg": "=leg_bag_monthly_limit", "remover": "=adhesive_remover_monthly_limit", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "catheter_fee": "=primary_fee_per_unit"}
        "Male External Catheter Program (A4349)": {"catheter_code": "=primary_hcpcs", "lubricant_code": "=lubricant_hcpcs", "catheters": "=primary_monthly_limit", "extra": "=extra_units_with_documentation", "per_cath": "=per_catheterization_basis", "lubricant": "=lubricant_monthly_limit", "trays": "=insertion_tray_monthly_limit", "bedside": "=bedside_bag_monthly_limit", "leg": "=leg_bag_monthly_limit", "remover": "=adhesive_remover_monthly_limit", "max_months": "=max_months_per_shipment", "early_days": "=ship_no_earlier_days", "catheter_fee": "=primary_fee_per_unit"}
    measures: [urology_msr_item_covered_through]

  - id: urology_refill_confirmation
    subject: [urology_refill_confirmed, urology_refill_declined, urology_item_shipped]
    rule: >-
      Each shipment rests on the patient's own refill request naming the items and, where
      `quantity_on_hand_check_required` is true, reporting the supply nearly exhausted; automatic shipments
      are allowed only for commercially billed and self-pay patients where `commercial_auto_ship_allowed`
      is true and never for Medicare, Medicare Advantage or Medicaid billed patients while
      `government_payer_auto_ship_allowed` is false. A refill is confirmed only on the patient's own
      statement of the items wanted and their supply status. Items ship no later than
      `refill_contact_lead_days` after the refill is confirmed, counting calendar days from the day after
      contact_date with the boundary day included.
    eligibility:
      - id: urology_patient_request
        applies_to: [urology_refill_confirmed]
        kind: caller_fact
        condition: A refill is confirmed only on the patient's own statement of the items wanted and their supply status.
        evidence_fields: [urology_contacts.items_requested, urology_contacts.supply_status_confirmed, urology_contacts.urology_holding_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [urology_contacts.urology_holding_id]
          action_bindings:
            urology_contacts.urology_holding_id: urology_holding_id
      - id: urology_confirmation_fresh
        applies_to: [urology_item_shipped]
        kind: time
        condition: Items ship no later than `refill_contact_lead_days` after the refill is confirmed, counting calendar days from the day after contact_date with the boundary day included.
        evidence_fields: [urology_contacts.contact_date, urology_contacts.urology_contact_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_contacts.urology_contact_id]
          action_bindings:
            urology_contacts.urology_contact_id: urology_contact_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the refill is confirmed
          anchor_source: urology_contacts.contact_date
          relation: not_after
          duration_source: variants.refill_contact_lead_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after contact_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"on_hand": "=quantity_on_hand_check_required", "gov_auto": "=government_payer_auto_ship_allowed", "com_auto": "=commercial_auto_ship_allowed", "lead_days": "=refill_contact_lead_days"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"on_hand": "=quantity_on_hand_check_required", "gov_auto": "=government_payer_auto_ship_allowed", "com_auto": "=commercial_auto_ship_allowed", "lead_days": "=refill_contact_lead_days"}
        "Closed-System Catheter Program (A4353)": {"on_hand": "=quantity_on_hand_check_required", "gov_auto": "=government_payer_auto_ship_allowed", "com_auto": "=commercial_auto_ship_allowed", "lead_days": "=refill_contact_lead_days"}
        "Indwelling Foley Catheter Program (A4338)": {"on_hand": "=quantity_on_hand_check_required", "gov_auto": "=government_payer_auto_ship_allowed", "com_auto": "=commercial_auto_ship_allowed", "lead_days": "=refill_contact_lead_days"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"on_hand": "=quantity_on_hand_check_required", "gov_auto": "=government_payer_auto_ship_allowed", "com_auto": "=commercial_auto_ship_allowed", "lead_days": "=refill_contact_lead_days"}
        "Male External Catheter Program (A4349)": {"on_hand": "=quantity_on_hand_check_required", "gov_auto": "=government_payer_auto_ship_allowed", "com_auto": "=commercial_auto_ship_allowed", "lead_days": "=refill_contact_lead_days"}

  - id: urology_program_switch_rules
    subject: [urology_program_switch]
    rule: >-
      A move to another program needs the new program's own criteria documented and a new order where
      `size_change_requires_new_order` is true for a size change; a move into the closed-system program
      needs a criteria date on or after the qualifying infections where
      `switch_to_closed_system_requires_criteria_date` is true. The switch takes effect for shipments after
      it is recorded; catheters of the old program already shipped keep their covered period, and the new
      program's catheters ship only once the old catheters' covers_through_date is within
      `ship_no_earlier_days`. A program is switched only after a program_switch_review request on this
      holding is approved.
    eligibility:
      - id: switch_reviewed
        applies_to: [urology_program_switch]
        kind: authorization
        condition: A program is switched only after a program_switch_review request on this holding is approved.
        evidence_fields: [urology_requests.request_type, urology_requests.request_status, urology_requests.urology_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_requests.urology_holding_id]
          action_bindings:
            urology_requests.urology_holding_id: urology_holding_id
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"size_order": "=size_change_requires_new_order", "closed_rule": "=switch_to_closed_system_requires_criteria_date", "early_days": "=ship_no_earlier_days"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"size_order": "=size_change_requires_new_order", "closed_rule": "=switch_to_closed_system_requires_criteria_date", "early_days": "=ship_no_earlier_days"}
        "Closed-System Catheter Program (A4353)": {"size_order": "=size_change_requires_new_order", "closed_rule": "=switch_to_closed_system_requires_criteria_date", "early_days": "=ship_no_earlier_days"}
        "Indwelling Foley Catheter Program (A4338)": {"size_order": "=size_change_requires_new_order", "closed_rule": "=switch_to_closed_system_requires_criteria_date", "early_days": "=ship_no_earlier_days"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"size_order": "=size_change_requires_new_order", "closed_rule": "=switch_to_closed_system_requires_criteria_date", "early_days": "=ship_no_earlier_days"}
        "Male External Catheter Program (A4349)": {"size_order": "=size_change_requires_new_order", "closed_rule": "=switch_to_closed_system_requires_criteria_date", "early_days": "=ship_no_earlier_days"}

  - id: urology_replacement_rules
    subject: [urology_no_charge_replacement]
    rule: >-
      Summit Ridge ships at no charge, without billing coverage and without counting toward the monthly
      limits, in four cases tied to one original line: a product_switch of brand or size within
      `product_switch_window_days` of the first shipment, a manufacturer_defect reported within
      `defect_replacement_days`, a carrier_lost shipment unconfirmed after `lost_package_trace_business_days`
      business days, and a wrong_item. An original line receives at most one no-charge replacement per
      reason. Opened sterile catheters are never otherwise returned or exchanged.
    eligibility:
      - id: urology_one_replacement
        applies_to: [urology_no_charge_replacement]
        kind: dedup
        condition: An original line receives at most one no-charge replacement per reason.
        evidence_fields: [urology_shipments.original_line_id, urology_shipments.replacement_reason, urology_shipments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_shipments.original_line_id]
          action_bindings:
            urology_shipments.original_line_id: original_line_id
        dedup_contract:
          table: urology_shipments
          mode: separate_record
          object_bindings: {original_line_id: original_line_id, replacement_reason: replacement_reason}
          duplicate_filters: {event_type: [urology_no_charge_replacement]}
          distinct_fields: []
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"switch_days": "=product_switch_window_days", "defect_days": "=defect_replacement_days", "trace_days": "=lost_package_trace_business_days"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"switch_days": "=product_switch_window_days", "defect_days": "=defect_replacement_days", "trace_days": "=lost_package_trace_business_days"}
        "Closed-System Catheter Program (A4353)": {"switch_days": "=product_switch_window_days", "defect_days": "=defect_replacement_days", "trace_days": "=lost_package_trace_business_days"}
        "Indwelling Foley Catheter Program (A4338)": {"switch_days": "=product_switch_window_days", "defect_days": "=defect_replacement_days", "trace_days": "=lost_package_trace_business_days"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"switch_days": "=product_switch_window_days", "defect_days": "=defect_replacement_days", "trace_days": "=lost_package_trace_business_days"}
        "Male External Catheter Program (A4349)": {"switch_days": "=product_switch_window_days", "defect_days": "=defect_replacement_days", "trace_days": "=lost_package_trace_business_days"}

  - id: urology_samples
    subject: [urology_sample_shipped]
    rule: >-
      A prospective or enrolled patient may receive a free sample of `sample_units_free` catheters of a
      program's catheter, at most `sample_limit_per_year` sample shipments per calendar year counted by
      urology_msr_samples_this_year. A sample is never billed to coverage and never counts toward a
      monthly limit. Samples go only to an enrollment that is enrolled_pending or active.
    eligibility:
      - id: sample_enrollment_open
        applies_to: [urology_sample_shipped]
        kind: state
        condition: Samples go only to an enrollment that is enrolled_pending or active.
        evidence_fields: [urology_holdings.status, urology_holdings.urology_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_holdings.urology_holding_id]
          action_bindings:
            urology_holdings.urology_holding_id: urology_holding_id
        state_contract:
          field: urology_holdings.status
          allowed: [enrolled_pending, active]
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"units": "=sample_units_free", "per_year": "=sample_limit_per_year"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"units": "=sample_units_free", "per_year": "=sample_limit_per_year"}
        "Closed-System Catheter Program (A4353)": {"units": "=sample_units_free", "per_year": "=sample_limit_per_year"}
        "Indwelling Foley Catheter Program (A4338)": {"units": "=sample_units_free", "per_year": "=sample_limit_per_year"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"units": "=sample_units_free", "per_year": "=sample_limit_per_year"}
        "Male External Catheter Program (A4349)": {"units": "=sample_units_free", "per_year": "=sample_limit_per_year"}
    measures: [urology_msr_samples_this_year]

  - id: urology_hold_rules
    subject: [urology_hold, urology_release, urology_hold_expire, urology_opt_out, urology_enroll_decline]
    rule: >-
      An active enrollment goes on hold with the matching hold_reason during an inpatient or skilled
      nursing stay (where `inpatient_hold_applies` is true), when the order is older than
      `rx_validity_months`, when continued need is undocumented for `continued_need_proof_months`, or when
      the coverage cannot be verified; nothing ships during a hold and the hold is released when its reason
      clears. An enrollment on hold is closed only after the hold has lasted `hold_max_days` days, counting
      calendar days from the day after hold_date with the boundary day included. The patient may decline or
      leave at any time by their own confirmation.
    eligibility:
      - id: urology_hold_lasted
        applies_to: [urology_hold_expire]
        kind: time
        condition: An enrollment on hold is closed only after the hold has lasted `hold_max_days` days, counting calendar days from the day after hold_date with the boundary day included.
        evidence_fields: [urology_holdings.hold_date, urology_holdings.urology_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_holdings.urology_holding_id]
          action_bindings:
            urology_holdings.urology_holding_id: urology_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold has lasted
          anchor_source: urology_holdings.hold_date
          relation: not_before
          duration_source: variants.hold_max_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after hold_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months"}
        "Closed-System Catheter Program (A4353)": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months"}
        "Indwelling Foley Catheter Program (A4338)": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months"}
        "Male External Catheter Program (A4349)": {"inpatient": "=inpatient_hold_applies", "hold_days": "=hold_max_days", "rx_months": "=rx_validity_months", "need_months": "=continued_need_proof_months"}

  - id: urology_evt_line_reversal
    subject: [urology_line_reversal]
    rule: >-
      A recoupment is recorded against the one paid line it takes back, as original_line_id; a paid line is
      reversed at most once. The reversed line no longer counts toward urology_msr_item_covered_through and
      every patient charge stemming from it is removed under the coverage charter.
    eligibility:
      - id: urology_reverse_once
        applies_to: [urology_line_reversal]
        kind: dedup
        condition: a paid line is reversed at most once.
        evidence_fields: [urology_shipments.original_line_id, urology_shipments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [urology_shipments.original_line_id]
          action_bindings:
            urology_shipments.original_line_id: original_line_id
        dedup_contract:
          table: urology_shipments
          mode: separate_record
          object_bindings: {original_line_id: original_line_id}
          duplicate_filters: {event_type: [urology_line_reversal]}
          distinct_fields: []

  - id: urology_self_pay
    subject: [urology_item_shipped]
    rule: >-
      A self_pay catheter line costs quantity times `self_pay_unit_price`; enrolled self-pay patients
      receive `self_pay_accessory_discount_pct` off accessory items, rounded to the cent half up per line.
      Catheters beyond the monthly limit may be bought self-pay where `beyond_limit_self_pay_allowed` is
      true. A hydrophilic catheter is furnished at no extra charge where `hydrophilic_option` is true and is
      never billed as an upgrade. Shipping by ground costs `ground_shipping_fee`, expedited costs
      `expedited_shipping_fee` paid by the patient, and every package is unmarked where
      `discreet_packaging` is true.
    eligibility: []
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"unit_price": "=self_pay_unit_price", "accessory_pct": "=self_pay_accessory_discount_pct", "beyond": "=beyond_limit_self_pay_allowed", "hydrophilic": "=hydrophilic_option", "ground_fee": "=ground_shipping_fee", "expedited_fee": "=expedited_shipping_fee", "discreet": "=discreet_packaging"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"unit_price": "=self_pay_unit_price", "accessory_pct": "=self_pay_accessory_discount_pct", "beyond": "=beyond_limit_self_pay_allowed", "hydrophilic": "=hydrophilic_option", "ground_fee": "=ground_shipping_fee", "expedited_fee": "=expedited_shipping_fee", "discreet": "=discreet_packaging"}
        "Closed-System Catheter Program (A4353)": {"unit_price": "=self_pay_unit_price", "accessory_pct": "=self_pay_accessory_discount_pct", "beyond": "=beyond_limit_self_pay_allowed", "hydrophilic": "=hydrophilic_option", "ground_fee": "=ground_shipping_fee", "expedited_fee": "=expedited_shipping_fee", "discreet": "=discreet_packaging"}
        "Indwelling Foley Catheter Program (A4338)": {"unit_price": "=self_pay_unit_price", "accessory_pct": "=self_pay_accessory_discount_pct", "beyond": "=beyond_limit_self_pay_allowed", "hydrophilic": "=hydrophilic_option", "ground_fee": "=ground_shipping_fee", "expedited_fee": "=expedited_shipping_fee", "discreet": "=discreet_packaging"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"unit_price": "=self_pay_unit_price", "accessory_pct": "=self_pay_accessory_discount_pct", "beyond": "=beyond_limit_self_pay_allowed", "hydrophilic": "=hydrophilic_option", "ground_fee": "=ground_shipping_fee", "expedited_fee": "=expedited_shipping_fee", "discreet": "=discreet_packaging"}
        "Male External Catheter Program (A4349)": {"unit_price": "=self_pay_unit_price", "accessory_pct": "=self_pay_accessory_discount_pct", "beyond": "=beyond_limit_self_pay_allowed", "hydrophilic": "=hydrophilic_option", "ground_fee": "=ground_shipping_fee", "expedited_fee": "=expedited_shipping_fee", "discreet": "=discreet_packaging"}

  - id: urology_order_continuity
    subject: [urology_order_renew]
    rule: >-
      A renewed order or newer continued-need documentation is recorded only from the practitioner's signed
      documents, never from the patient's statement. Recording it clears an order_expired or
      continued_need_lapsed hold. An indwelling catheter is changed every `catheter_change_interval_days`
      days, and the latex content of the program (`latex_free`) is confirmed against any allergy on the
      order before renewal.
    eligibility: []
    params:
      per_tier:
        "Straight Intermittent Catheter Program (A4351)": {"change_days": "=catheter_change_interval_days", "latex_free": "=latex_free", "rx_months": "=rx_validity_months"}
        "Coud\u00e9 Tip Intermittent Catheter Program (A4352)": {"change_days": "=catheter_change_interval_days", "latex_free": "=latex_free", "rx_months": "=rx_validity_months"}
        "Closed-System Catheter Program (A4353)": {"change_days": "=catheter_change_interval_days", "latex_free": "=latex_free", "rx_months": "=rx_validity_months"}
        "Indwelling Foley Catheter Program (A4338)": {"change_days": "=catheter_change_interval_days", "latex_free": "=latex_free", "rx_months": "=rx_validity_months"}
        "All-Silicone Indwelling Catheter Program (A4344)": {"change_days": "=catheter_change_interval_days", "latex_free": "=latex_free", "rx_months": "=rx_validity_months"}
        "Male External Catheter Program (A4349)": {"change_days": "=catheter_change_interval_days", "latex_free": "=latex_free", "rx_months": "=rx_validity_months"}
