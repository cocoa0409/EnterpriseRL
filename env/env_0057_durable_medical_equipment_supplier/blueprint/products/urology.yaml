# Policy charter: Urological Supply Program (category key: urology)
# A urology holding is the patient's enrollment in a catheter program under the prosthetic-device
# benefit: monthly catheter and accessory quantities shipped in up to three-month cycles on the
# patient's own refill request, with program-specific documentation.

category: urology
display_name: Urological Supply Program

binding:
  holding_table: urology_holdings
  event_tables: [urology_shipments, urology_contacts]
  intake_tables: [urology_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [enrolled_pending, active, on_hold, cancelled]
  transitions:
    - {from: enrolled_pending, to: active, by: agent, means: "Order, permanence, program criteria and coverage are verified and shipments may start."}
    - {from: enrolled_pending, to: cancelled, by: user, means: "The patient declines the program before the first shipment."}
    - {from: active, to: on_hold, by: agent, means: "Shipments stop for a recorded hold reason."}
    - {from: on_hold, to: active, by: agent, means: "The hold reason is cleared."}
    - {from: active, to: cancelled, by: user, means: "The patient leaves the program."}
    - {from: on_hold, to: cancelled, by: user, means: "The patient leaves the program while on hold."}
    - {from: on_hold, to: cancelled, by: agent, means: "A hold not cleared in time closes the enrollment."}

accounts: []

parameter_schema:
  primary_hcpcs: "Code of the program's catheter (string)"
  primary_monthly_limit: "Catheters allowed per month of supply (units)"
  primary_fee_per_unit: "Fee-schedule amount per catheter before the coverage class's allowed percentage (USD)"
  extra_units_with_documentation: "Additional catheters per month allowed when obstruction, infection or leakage is documented (units); 0 when none"
  criteria_documentation: "Documentation the program needs beyond the order (enum: none, straight_failure_documented, closed_system_criteria, none_beyond_order, latex_allergy_or_encrustation)"
  uti_count_required: "Infections in 12 months on sterile intermittent catheters that qualify the closed system on that ground (count); 0 when not applicable"
  permanence_months: "Expected minimum duration of the condition for it to count as permanent (months)"
  lubricant_hcpcs: "Code of separately billable lubricant, or none (string)"
  lubricant_monthly_limit: "Lubricant units allowed per month (units); 0 when none"
  lubricant_fee_per_unit: "Fee-schedule amount per lubricant unit (USD); 0.00 when none"
  insertion_tray_monthly_limit: "Insertion trays (A4314) allowed per month (units); 0 when none"
  insertion_tray_fee: "Fee-schedule amount per insertion tray (USD); 0.00 when none"
  bedside_bag_monthly_limit: "Bedside drainage bags (A4357) allowed per month (units)"
  bedside_bag_fee: "Fee-schedule amount per bedside drainage bag (USD)"
  leg_bag_monthly_limit: "Leg bags (A4358) allowed per month (units)"
  leg_bag_fee: "Fee-schedule amount per leg bag (USD)"
  adhesive_remover_monthly_limit: "Adhesive remover units (A4455, per ounce) allowed per month (units); 0 when none"
  adhesive_remover_fee: "Fee-schedule amount per adhesive remover unit (USD); 0.00 when none"
  catheter_change_interval_days: "Days between routine changes of an indwelling catheter that the monthly limit is built on (days); 0 for other programs"
  supply_period_basis: "How a month of supply is measured (enum: rolling_from_last_service_date)"
  max_months_per_shipment: "Most months of supply one shipment may cover (months)"
  refill_contact_lead_days: "Most calendar days a refill confirmation may precede the ship date (days)"
  ship_no_earlier_days: "Most calendar days before the covers_through_date of the last shipped line that a new line of the same item may ship (days)"
  quantity_on_hand_check_required: "Whether the patient must report the supply on hand nearly exhausted before each shipment (boolean)"
  government_payer_auto_ship_allowed: "Whether automatic shipments are allowed for Medicare, Medicare Advantage or Medicaid billed patients (boolean)"
  commercial_auto_ship_allowed: "Whether automatic shipments are allowed for commercially billed and self-pay patients (boolean)"
  rx_validity_months: "Calendar months a supply order stays usable (months)"
  continued_need_proof_months: "Calendar months the latest documentation of continued need stays sufficient (months)"
  prior_auth_program_eligible: "Whether the program falls under the coverage's urological prior-authorization requirement (boolean)"
  hydrophilic_option: "Whether a hydrophilic-coated catheter may be furnished under the code at no extra charge (boolean)"
  latex_free: "Whether the program's catheter is latex-free (boolean)"
  sample_units_free: "Catheters sent free as a trial sample before enrollment (units)"
  sample_limit_per_year: "Free sample shipments allowed per patient per calendar year (count)"
  product_switch_window_days: "Calendar days after the first shipment within which one brand or size switch is shipped at no charge (days)"
  defect_replacement_days: "Calendar days after shipment within which a defective item is replaced at no charge (days)"
  lost_package_trace_business_days: "Business days without delivery confirmation after which a lost shipment is reshipped at no charge (days)"
  discreet_packaging: "Whether shipments go in unmarked packaging (boolean)"
  ground_shipping_fee: "Charge for ground shipping (USD)"
  expedited_shipping_fee: "Patient-paid charge for expedited shipping, never billed to coverage (USD)"
  self_pay_unit_price: "Cash price per catheter on a self-pay line (USD)"
  self_pay_accessory_discount_pct: "Discount on self-pay accessory items (bags, lubricant, trays, remover) for an enrolled self-pay patient (percent)"
  beyond_limit_self_pay_allowed: "Whether catheters beyond the monthly limit may be bought at self-pay prices (boolean)"
  missed_cycle_backfill_allowed: "Whether units not shipped in an earlier month may be added to a later shipment (boolean)"
  inpatient_hold_applies: "Whether shipments stop while the patient is an inpatient or in skilled nursing (boolean)"
  hold_max_days: "Calendar days an enrollment may stay on hold before it is cancelled (days)"
  nursing_facility_billing_excluded: "Whether supplies for a patient in a covered skilled nursing stay are excluded from Summit Ridge billing (boolean)"
  per_catheterization_basis: "Whether the monthly limit is further capped at one catheter per ordered catheterization per day (boolean)"
  switch_to_closed_system_requires_criteria_date: "Whether a move into the closed-system program needs a criteria documentation date on or after the qualifying infections (boolean)"
  size_change_requires_new_order: "Whether a change of French size needs a new written order (boolean)"

