- id: oxygen_ext_post_break_period_start
  base_policy_refs:
  - oxygen_suspension_break
  overwrite:
  - base_policy: oxygen_suspension_break
    superseded_clause: >-
      A longer break starts a new payment period on the return-home date with the month count back at 1
    replaced_by: >-
      For a new payment period this policy opens, and only for such a period, its first day is the day worked out
      below in place of the return-home date; every other new payment period after a longer break remains under
      the base rule.
  trigger: on_request
  subject:
  - oxygen_period_restart
  computes: rental_period_start_date
  target_tool: restart_oxygen_payment_period_b66f451e
  params:
    restart_reach_medicare_days: 365
    restart_reach_plan_days: 30
    restart_reach_other_days: 7
    recheck_medicare_days: 90
    recheck_plan_days: 30
    restart_min_paid_plan: 1
    restart_min_paid_medicaid: 2
    restart_min_paid_other: 3
    span_plan_days: 31
    span_medicare_days: 28
    span_other_days: 21
  rule: >-
    When a patient whose oxygen record is suspended chooses to keep the oxygen with Summit Ridge after a break in
    need that ran past the allowance, a new payment period is opened with a first day worked out as follows. A new
    payment period after a stay is not opened until the oxygen record shows the stay as a suspension with its suspension
    date. The first day of a new payment period after a stay is fixed only after the oxygen claim history carries
    the payer's paid line for each equipment month that began before the stay. For a new payment period this policy
    opens, and only for such a period, its first day is the day worked out below in place of the return-home date;
    every other new payment period after a longer break remains under the base rule. The new payment period begins
    on the day the patient confirms continuing, written as YYYY-MM-DD, with the month count back at 1. The day the
    patient came home is read from the oxygen record: when the record is suspended and a technician visit is on
    record later than the suspension date, the day home is the date of the most recent technician visit; otherwise,
    when the record is suspended, no technician visit is on record later than the suspension date and a cylinder
    refill is, it is the date of the most recent cylinder refill; otherwise it is the day the patient confirms continuing.
    The new payment period begins on the day home instead of the day of confirmation only when all four of the following
    conditions hold, each counted in calendar days as the later date minus the earlier date; when any of them fails,
    it begins on the day the patient confirms continuing. The filing reach: the day home is no more than `restart_reach_medicare_days`
    days before the confirmation when the coverage named on the oxygen record is Original Medicare Part B or Medicare
    Supplement Plan G, no more than `restart_reach_plan_days` days when it is Commercial PPO, Commercial HMO, Medicare
    Advantage PPO or Medicare Advantage HMO, and no more than `restart_reach_other_days` days for any other coverage
    class. The coverage recheck: the coverage's last eligibility check is dated on or after the day home and no
    more than `recheck_medicare_days` days after it when the coverage is Original Medicare Part B or Medicare Supplement
    Plan G, no more than `recheck_plan_days` days after it when it is Commercial PPO, Commercial HMO, Medicare Advantage
    PPO or Medicare Advantage HMO, and 0 days after it for any other coverage class. The paid-month floor: the payment
    period being closed has at least `restart_min_paid_plan` paid equipment months (paid months less reversed months
    under the coverage on the oxygen record) when that coverage is Commercial PPO or Commercial HMO, at least `restart_min_paid_medicaid`
    when it is Medicaid Fee-for-Service, and at least `restart_min_paid_other` for any other coverage class. The
    paid-month span: the suspension date falls on or after the first day of the most recent equipment month paid
    under the coverage named on the oxygen record and no more than `span_plan_days` days after it when the coverage
    is Commercial PPO or Commercial HMO, no more than `span_medicare_days` days after it when it is Original Medicare
    Part B, Medicare Supplement Plan G, Medicare Advantage PPO or Medicare Advantage HMO, and no more than `span_other_days`
    days after it for any other coverage class.
  prerequisite:
  - problem: oxygen_ext_stay_suspension_day
    kind: value_input
    gate: home_again_day
    form: state
    policy_source: >-
      A new payment period after a stay is not opened until the oxygen record shows the stay as a suspension with
      its suspension date.
    condition: oxygen_holdings.status is suspended and oxygen_holdings.suspended_date is filled in
    resolved_by: record_oxygen_suspension_f17584ff
    effect: >-
      the suspension status and date let the technician visit after the stay count as the day home
  - problem: oxygen_ext_paid_in_full_equipment_month
    kind: value_input
    gate: old_period_paid
    form: state
    policy_source: >-
      The first day of a new payment period after a stay is fixed only after the oxygen claim history carries the
      payer's paid line for each equipment month that began before the stay.
    condition: >-
      oxygen_billing carries an oxygen_rental_paid line for every equipment month that began before the suspension
      date
    resolved_by: record_oxygen_equipment_payment_51bbc3fc
    effect: >-
      the paid line raises the paid-month count of the closing period and sets the most recent paid month the suspension
      date is measured from
  cross_category:
  - category: coverage
    as: branch
    reads:
    - variant_name
    - last_eligibility_check_date
    note: >-
      the coverage class and its last eligibility check set the filing reach, the recheck window, the paid-month
      floor and the paid-month span
  compute:
  - visit_after_stay: >-
      LATEST('oxygen_service','service_date', date_field='service_date', event_type='oxygen_maintenance_visit')
      or ''
  - delivery_after_stay: >-
      LATEST('oxygen_service','service_date', date_field='service_date', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
      or ''
  - home_again_day: >-
      visit_after_stay if (F('status') == 'suspended' and visit_after_stay > F('suspended_date')) else (delivery_after_stay
      if (F('status') == 'suspended' and visit_after_stay <= F('suspended_date') and delivery_after_stay > F('suspended_date'))
      else NOW)
  - payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - restart_reach_days: >-
      K('restart_reach_medicare_days') if (payer_class == 'Original Medicare Part B' or payer_class == 'Medicare
      Supplement Plan G') else (K('restart_reach_plan_days') if (payer_class == 'Commercial PPO' or payer_class
      == 'Commercial HMO' or payer_class == 'Medicare Advantage PPO' or payer_class == 'Medicare Advantage HMO')
      else K('restart_reach_other_days'))
  - recheck_payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - restart_recheck_days: >-
      K('recheck_medicare_days') if (recheck_payer_class == 'Original Medicare Part B' or recheck_payer_class ==
      'Medicare Supplement Plan G') else (K('recheck_plan_days') if (recheck_payer_class == 'Commercial PPO' or
      recheck_payer_class == 'Commercial HMO' or recheck_payer_class == 'Medicare Advantage PPO' or recheck_payer_class
      == 'Medicare Advantage HMO') else 0)
  - old_period_paid: >-
      COUNT('oxygen_billing', event_type='oxygen_rental_paid', coverage_id=F('coverage_id')) - COUNT('oxygen_billing',
      event_type='oxygen_claim_reversal', coverage_id=F('coverage_id'))
  - floor_payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - restart_min_paid: >-
      K('restart_min_paid_plan') if (floor_payer_class == 'Commercial PPO' or floor_payer_class == 'Commercial HMO')
      else (K('restart_min_paid_medicaid') if floor_payer_class == 'Medicaid Fee-for-Service' else K('restart_min_paid_other'))
  - stay_offset_days: >-
      DAYS(LATEST('oxygen_billing','service_from_date', date_field='service_from_date', event_type='oxygen_rental_paid',
      coverage_id=F('coverage_id')) or '1900-01-01', F('suspended_date') or NOW)
  - span_payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - paid_month_span_days: >-
      K('span_plan_days') if (span_payer_class == 'Commercial PPO' or span_payer_class == 'Commercial HMO') else
      (K('span_medicare_days') if (span_payer_class == 'Original Medicare Part B' or span_payer_class == 'Medicare
      Supplement Plan G' or span_payer_class == 'Medicare Advantage PPO' or span_payer_class == 'Medicare Advantage
      HMO') else K('span_other_days'))
  - result: >-
      home_again_day if (DAYS(home_again_day, NOW) <= restart_reach_days and (DAYS(home_again_day, CFIELD('coverage','last_eligibility_check_date',
      coverage_id=F('coverage_id')) or '1900-01-01')) >= 0 and (DAYS(home_again_day, CFIELD('coverage','last_eligibility_check_date',
      coverage_id=F('coverage_id')) or '1900-01-01')) <= restart_recheck_days and old_period_paid >= restart_min_paid
      and stay_offset_days >= 0 and stay_offset_days <= paid_month_span_days) else NOW
  compute_basis:
    visit_after_stay: >-
      The day the patient came home is read from the oxygen record: when the record is suspended and a technician
      visit is on record later than the suspension date, the day home is the date of the most recent technician
