      F('referral_source') == 'skilled_nursing_facility' else 0)
  - result: >-
      at_home_day if ((DAYS(setup_day, at_home_day)) <= predelivery_days and (DAYS(at_home_day, NOW)) <= setup_reach_days
      and order_gap_days <= order_lead_days) else setup_day
  compute_basis:
