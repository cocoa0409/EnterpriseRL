      it is the stationary fee reduced by the class's `low_flow_reduction_pct` percent, plus the portable add-on
      when portable equipment is billable; when the flow is neither above the high-flow threshold nor below the
      low-flow threshold and portable equipment is billable, it is the stationary fee plus the portable add-on;
      otherwise it is the stationary fee.
    payer_class: >-
      Payer high-flow rate: the result is next multiplied by `commercial_high_flow_pct` percent when the prescribed
      flow on the oxygen record is above the class's `high_flow_threshold_lpm` and the coverage named on the oxygen
      record is Commercial PPO or Commercial HMO, by `medicaid_high_flow_pct` percent when that flow is above that
      threshold and the coverage is Medicaid Fee-for-Service, and by 100 percent otherwise.
    payer_flow_pct: >-
      Payer high-flow rate: the result is next multiplied by `commercial_high_flow_pct` percent when the prescribed
      flow on the oxygen record is above the class's `high_flow_threshold_lpm` and the coverage named on the oxygen
      record is Commercial PPO or Commercial HMO, by `medicaid_high_flow_pct` percent when that flow is above that
      threshold and the coverage is Medicaid Fee-for-Service, and by 100 percent otherwise.
    paid_months_before: >-
      Rental position: the result is next multiplied by `opening_month_pct` percent when no equipment month has
      been paid yet under the coverage on the oxygen record (paid months less reversed months), by `long_rental_pct`
      percent when 12 or more have been paid, and by 100 percent otherwise.
    rental_position_pct: >-
      Rental position: the result is next multiplied by `opening_month_pct` percent when no equipment month has
      been paid yet under the coverage on the oxygen record (paid months less reversed months), by `long_rental_pct`
      percent when 12 or more have been paid, and by 100 percent otherwise.
    initial_delivery_day: >-
      Discharge training: the result is next multiplied by `hospital_training_pct` percent when the initial-setup
      delivery came before the setup date on the oxygen record and the order came from a hospital discharge, by
      `facility_training_pct` percent when it came before the setup date and the order came from a skilled nursing
      facility, and by 100 percent otherwise.
    training_rate_pct: >-
      Discharge training: the result is next multiplied by `hospital_training_pct` percent when the initial-setup
      delivery came before the setup date on the oxygen record and the order came from a hospital discharge, by
      `facility_training_pct` percent when it came before the setup date and the order came from a skilled nursing
      facility, and by 100 percent otherwise.
    pap_on_same_plan: >-
      Multi-rental: the result is next multiplied by `rented_pap_pct` percent when the patient's PAP device record
      names the same coverage, carries no ownership date, has fewer than 13 PAP rental months paid and began its
      payment period at least `rented_pap_min_months` whole calendar months before the posting date; by `owned_pap_pct`
      percent when the PAP device record carries an ownership date or 13 or more PAP rental months have been paid;
