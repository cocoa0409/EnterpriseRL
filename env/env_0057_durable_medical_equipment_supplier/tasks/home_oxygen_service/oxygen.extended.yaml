- id: oxygen_ext_paid_in_full_contents_month
  base_policy_refs:
  - oxygen_contents_billing
  overwrite:
  - base_policy: oxygen_contents_billing
    superseded_clause: >-
      After the cap, classes with a `post_cap_contents_hcpcs` other than none bill one contents month at `post_cap_contents_monthly_fee`
      times the coverage class's allowed_pct_of_fee_schedule divided by 100, rounded to the cent half up.
    replaced_by: >-
      For a contents month this policy governs, and only for such a month, the contents allowance is the amount
      the last step below produces, rounded once to the cent half up, in place of the class's `post_cap_contents_monthly_fee`
      times the allowed percentage; every other contents month remains under the base contents billing rule.
  trigger: state_due
  subject:
  - oxygen_contents_paid
  computes: allowed_amount
  target_tool: record_oxygen_contents_payment_7caaff46
  params:
    sleep_only_pct: 60
    exertion_only_pct: 50
    exertion_and_sleep_pct: 80
    late_contents_pct: 90
    mid_contents_pct: 95
    large_refill_pct: 110
    large_refill_cylinders: 10
    small_refill_pct: 90
    small_refill_cylinders: 5
    frequent_refill_pct: 105
    frequent_refill_count: 10
    sparse_refill_pct: 95
    sparse_refill_count: 3
    rented_pap_pct: 97
    rented_pap_min_months: 3
    owned_pap_pct: 99
    conserver_flow_allowance: 12.5
    low_flow_contents_floor: 25.0
  rule: >-
    A contents month after the payment cap that the coverage paid in full, leaving no patient share because the
    plan's out-of-pocket maximum was already met, is posted with a contents allowance worked out as follows. For
    a contents month this policy governs, and only for such a month, the contents allowance is the amount the last
    step below produces, rounded once to the cent half up, in place of the class's `post_cap_contents_monthly_fee`
    times the allowed percentage; every other contents month remains under the base contents billing rule. The standard
    contents allowance of a month is the class's `post_cap_contents_monthly_fee` times the coverage class's allowed_pct_of_fee_schedule
    divided by 100, rounded once to the cent half up. Contents flow treatment: the class's `post_cap_contents_monthly_fee`
    is first adjusted for the prescribed flow on the oxygen record; when that flow is above the class's `high_flow_threshold_lpm`,
    the class furnishes a conserving device and at least one cylinder refill is on record, the conserving device
    holds down the gas used at high flow, so a flat `conserver_flow_allowance` dollars is added to the contents
    fee instead of any percentage raise; otherwise, when the flow is above that threshold, the contents fee is raised
    by the class's `high_flow_uplift_pct` percent; otherwise, when the flow is below the class's `low_flow_threshold_lpm`,
    the contents fee is reduced by the class's `low_flow_reduction_pct` percent and the reduced fee is then compared
    with `low_flow_contents_floor` dollars, the higher of the two being kept; otherwise the contents fee is unchanged.
    Contents usage share: the contents amount is then multiplied by the share of the day the order uses oxygen:
    by `sleep_only_pct` percent for an order for sleep only, by `exertion_only_pct` percent for an order for exertion
    only with at least one cylinder refill on record, by `exertion_and_sleep_pct` percent for an order for exertion
    and sleep with at least one cylinder refill on record, and by 100 percent for any other order. Contents position:
    the contents amount is next multiplied by `late_contents_pct` percent when the month is the 13th or later contents
    month paid under the coverage named on the oxygen record (contents months already paid under it plus one), by
    `mid_contents_pct` percent when it is the 7th to the 12th, and by 100 percent otherwise. Refill size: the contents
    amount is next multiplied by `large_refill_pct` percent when at least one cylinder refill is on record and the
    cylinder refills on record average `large_refill_cylinders` or more cylinders per refill, by `small_refill_pct`
    percent when at least one cylinder refill is on record and they average `small_refill_cylinders` or fewer, and
    by 100 percent otherwise, including when no cylinder refill is on record. Refill frequency: the contents amount
    is next multiplied by `frequent_refill_pct` percent when `frequent_refill_count` or more cylinder refills are
    dated less than six whole calendar months before the posting date, by `sparse_refill_pct` percent when `sparse_refill_count`
    or fewer are, and by 100 percent otherwise. Contents PAP bundle: the contents amount is next multiplied by `rented_pap_pct`
    percent when the patient's PAP device record names the same coverage as the oxygen record, carries no ownership
    date, has fewer than 13 PAP rental months paid and began its payment period at least `rented_pap_min_months`
    whole calendar months before the posting date; by `owned_pap_pct` percent when the PAP device record carries
    an ownership date or 13 or more PAP rental months have been paid; and by 100 percent otherwise. Last, the contents
    amount is multiplied by the coverage class's allowed_pct_of_fee_schedule divided by 100; each percentage acts
    on the amount the step before it produced, in the order stated, and nothing is rounded until the contents allowance
    is rounded once to the cent half up.
  prerequisite: []
  cross_category:
  - category: coverage
    as: branch
    reads:
    - allowed_pct_of_fee_schedule
    note: the coverage class sets the allowed percentage
  - category: pap
    as: history
    reads:
    - coverage_id
    - ownership_date
    - rental_period_start_date
    - pap_billing.event_type
    note: the PAP device record and its paid rental months set the contents PAP bundle percentage
  compute:
  - contents_fee: P('post_cap_contents_monthly_fee')
  - conserver_refills: >-
      COUNT('oxygen_service', event_type='oxygen_delivery', delivery_purpose='cylinder_refill') > 0 and P('oxygen_conserving_device_included')
      == True
  - contents_flow_fee: >-
      contents_fee + K('conserver_flow_allowance') if (F('prescribed_lpm') > P('high_flow_threshold_lpm') and conserver_refills)
      else (contents_fee * (100 + P('high_flow_uplift_pct')) / 100 if F('prescribed_lpm') > P('high_flow_threshold_lpm')
      else (MX(contents_fee * (100 - P('low_flow_reduction_pct')) / 100, K('low_flow_contents_floor')) if F('prescribed_lpm')
      < P('low_flow_threshold_lpm') else contents_fee))
  - refills_on_record: COUNT('oxygen_service', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
  - contents_usage_pct: >-
      K('sleep_only_pct') if F('usage_pattern') == 'sleep_only' else (K('exertion_only_pct') if (F('usage_pattern')
      == 'exertion_only' and refills_on_record > 0) else (K('exertion_and_sleep_pct') if (F('usage_pattern') ==
      'exertion_and_sleep' and refills_on_record > 0) else 100))
  - contents_months_paid: COUNT('oxygen_billing', event_type='oxygen_contents_paid', coverage_id=F('coverage_id'))
  - contents_step_pct: >-
      K('late_contents_pct') if contents_months_paid + 1 >= 13 else (K('mid_contents_pct') if contents_months_paid
      + 1 >= 7 else 100)
  - sized_refills: COUNT('oxygen_service', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
  - refill_cylinders: >-
      SUM('oxygen_service', 'cylinders_delivered', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
  - refill_volume_pct: >-
      K('large_refill_pct') if (sized_refills > 0 and refill_cylinders / sized_refills >= K('large_refill_cylinders'))
      else (K('small_refill_pct') if (sized_refills > 0 and refill_cylinders / sized_refills <= K('small_refill_cylinders'))
      else 100)
  - recent_refills: >-
      COUNT('oxygen_service', within_months=6, date_field='service_date', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
  - refill_frequency_pct: >-
      K('frequent_refill_pct') if recent_refills >= K('frequent_refill_count') else (K('sparse_refill_pct') if recent_refills
      <= K('sparse_refill_count') else 100)
  - pap_same_plan: >-
      CFIELD('pap','coverage_id') == F('coverage_id') and (CFIELD('pap','ownership_date') or '') == ''
  - pap_months_rented: MONTHS(CFIELD('pap','rental_period_start_date') or NOW, NOW)
  - pap_months_paid: XCOUNT('pap','pap_billing', event_type='pap_rental_paid')
  - contents_multi_pct: >-
      K('rented_pap_pct') if (pap_same_plan and pap_months_paid < 13 and pap_months_rented >= K('rented_pap_min_months'))
      else (K('owned_pap_pct') if ((CFIELD('pap','ownership_date') or '') != '' or pap_months_paid >= 13) else 100)
  - line_plan_pct: CPARAM('coverage','allowed_pct_of_fee_schedule', coverage_id=F('coverage_id'))
  - result: >-
      RND(contents_flow_fee * contents_usage_pct / 100 * contents_step_pct / 100 * refill_volume_pct / 100 * refill_frequency_pct
      / 100 * contents_multi_pct / 100 * line_plan_pct / 100, 2)
  compute_basis:
    contents_fee: >-
      The standard contents allowance of a month is the class's `post_cap_contents_monthly_fee` times the coverage
      class's allowed_pct_of_fee_schedule divided by 100, rounded once to the cent half up.
    conserver_refills: >-
      Contents flow treatment: the class's `post_cap_contents_monthly_fee` is first adjusted for the prescribed
      flow on the oxygen record; when that flow is above the class's `high_flow_threshold_lpm`, the class furnishes
      a conserving device and at least one cylinder refill is on record, the conserving device holds down the gas
      used at high flow, so a flat `conserver_flow_allowance` dollars is added to the contents fee instead of any
      percentage raise; otherwise, when the flow is above that threshold, the contents fee is raised by the class's
      `high_flow_uplift_pct` percent; otherwise, when the flow is below the class's `low_flow_threshold_lpm`, the
      contents fee is reduced by the class's `low_flow_reduction_pct` percent and the reduced fee is then compared
      with `low_flow_contents_floor` dollars, the higher of the two being kept; otherwise the contents fee is unchanged.
    contents_flow_fee: >-
      Contents flow treatment: the class's `post_cap_contents_monthly_fee` is first adjusted for the prescribed
      flow on the oxygen record; when that flow is above the class's `high_flow_threshold_lpm`, the class furnishes
      a conserving device and at least one cylinder refill is on record, the conserving device holds down the gas
      used at high flow, so a flat `conserver_flow_allowance` dollars is added to the contents fee instead of any
      percentage raise; otherwise, when the flow is above that threshold, the contents fee is raised by the class's
      `high_flow_uplift_pct` percent; otherwise, when the flow is below the class's `low_flow_threshold_lpm`, the
      contents fee is reduced by the class's `low_flow_reduction_pct` percent and the reduced fee is then compared
      with `low_flow_contents_floor` dollars, the higher of the two being kept; otherwise the contents fee is unchanged.
    refills_on_record: >-
      Contents usage share: the contents amount is then multiplied by the share of the day the order uses oxygen:
      by `sleep_only_pct` percent for an order for sleep only, by `exertion_only_pct` percent for an order for exertion
      only with at least one cylinder refill on record, by `exertion_and_sleep_pct` percent for an order for exertion
      and sleep with at least one cylinder refill on record, and by 100 percent for any other order.
    contents_usage_pct: >-
      Contents usage share: the contents amount is then multiplied by the share of the day the order uses oxygen:
      by `sleep_only_pct` percent for an order for sleep only, by `exertion_only_pct` percent for an order for exertion
      only with at least one cylinder refill on record, by `exertion_and_sleep_pct` percent for an order for exertion
      and sleep with at least one cylinder refill on record, and by 100 percent for any other order.
    contents_months_paid: >-
      Contents position: the contents amount is next multiplied by `late_contents_pct` percent when the month is
      the 13th or later contents month paid under the coverage named on the oxygen record (contents months already
      paid under it plus one), by `mid_contents_pct` percent when it is the 7th to the 12th, and by 100 percent
      otherwise.
    contents_step_pct: >-
      Contents position: the contents amount is next multiplied by `late_contents_pct` percent when the month is
      the 13th or later contents month paid under the coverage named on the oxygen record (contents months already
      paid under it plus one), by `mid_contents_pct` percent when it is the 7th to the 12th, and by 100 percent
      otherwise.
    sized_refills: >-
      Refill size: the contents amount is next multiplied by `large_refill_pct` percent when at least one cylinder
      refill is on record and the cylinder refills on record average `large_refill_cylinders` or more cylinders
      per refill, by `small_refill_pct` percent when at least one cylinder refill is on record and they average
      `small_refill_cylinders` or fewer, and by 100 percent otherwise, including when no cylinder refill is on record.
    refill_cylinders: >-
      Refill size: the contents amount is next multiplied by `large_refill_pct` percent when at least one cylinder
      refill is on record and the cylinder refills on record average `large_refill_cylinders` or more cylinders
      per refill, by `small_refill_pct` percent when at least one cylinder refill is on record and they average
      `small_refill_cylinders` or fewer, and by 100 percent otherwise, including when no cylinder refill is on record.
    refill_volume_pct: >-
      Refill size: the contents amount is next multiplied by `large_refill_pct` percent when at least one cylinder
      refill is on record and the cylinder refills on record average `large_refill_cylinders` or more cylinders
      per refill, by `small_refill_pct` percent when at least one cylinder refill is on record and they average
      `small_refill_cylinders` or fewer, and by 100 percent otherwise, including when no cylinder refill is on record.
    recent_refills: >-
      Refill frequency: the contents amount is next multiplied by `frequent_refill_pct` percent when `frequent_refill_count`
      or more cylinder refills are dated less than six whole calendar months before the posting date, by `sparse_refill_pct`
      percent when `sparse_refill_count` or fewer are, and by 100 percent otherwise.
    refill_frequency_pct: >-
      Refill frequency: the contents amount is next multiplied by `frequent_refill_pct` percent when `frequent_refill_count`
      or more cylinder refills are dated less than six whole calendar months before the posting date, by `sparse_refill_pct`
      percent when `sparse_refill_count` or fewer are, and by 100 percent otherwise.
    pap_same_plan: >-
      Contents PAP bundle: the contents amount is next multiplied by `rented_pap_pct` percent when the patient's
      PAP device record names the same coverage as the oxygen record, carries no ownership date, has fewer than
      13 PAP rental months paid and began its payment period at least `rented_pap_min_months` whole calendar months
      before the posting date; by `owned_pap_pct` percent when the PAP device record carries an ownership date or
      13 or more PAP rental months have been paid; and by 100 percent otherwise.
    pap_months_rented: >-
      Contents PAP bundle: the contents amount is next multiplied by `rented_pap_pct` percent when the patient's
      PAP device record names the same coverage as the oxygen record, carries no ownership date, has fewer than
      13 PAP rental months paid and began its payment period at least `rented_pap_min_months` whole calendar months
      before the posting date; by `owned_pap_pct` percent when the PAP device record carries an ownership date or
      13 or more PAP rental months have been paid; and by 100 percent otherwise.
    pap_months_paid: >-
      Contents PAP bundle: the contents amount is next multiplied by `rented_pap_pct` percent when the patient's
      PAP device record names the same coverage as the oxygen record, carries no ownership date, has fewer than
      13 PAP rental months paid and began its payment period at least `rented_pap_min_months` whole calendar months
      before the posting date; by `owned_pap_pct` percent when the PAP device record carries an ownership date or
      13 or more PAP rental months have been paid; and by 100 percent otherwise.
    contents_multi_pct: >-
      Contents PAP bundle: the contents amount is next multiplied by `rented_pap_pct` percent when the patient's
      PAP device record names the same coverage as the oxygen record, carries no ownership date, has fewer than
      13 PAP rental months paid and began its payment period at least `rented_pap_min_months` whole calendar months
      before the posting date; by `owned_pap_pct` percent when the PAP device record carries an ownership date or
      13 or more PAP rental months have been paid; and by 100 percent otherwise.
    line_plan_pct: >-
      The standard contents allowance of a month is the class's `post_cap_contents_monthly_fee` times the coverage
      class's allowed_pct_of_fee_schedule divided by 100, rounded once to the cent half up.
    result: >-
      Last, the contents amount is multiplied by the coverage class's allowed_pct_of_fee_schedule divided by 100;
      each percentage acts on the amount the step before it produced, in the order stated, and nothing is rounded
      until the contents allowance is rounded once to the cent half up.
  factors:
  - id: contents_usage_share
    effect: parameter
    decides: contents_usage_pct
    bindings:
    - refills_on_record
    - contents_usage_pct
    ladder:
    - when: the order is for sleep only
      value: K('sleep_only_pct')
    - when: the order is for exertion only and at least one cylinder refill is on record
      value: K('exertion_only_pct')
    - when: the order is for exertion and sleep and at least one cylinder refill is on record
      value: K('exertion_and_sleep_pct')
    - when: otherwise
      value: '100'
    baseline:
      contents_usage_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: contents_flow_treatment
    effect: method
    decides: contents_flow_fee
    bindings:
    - conserver_refills
    - contents_flow_fee
    ladder:
    - when: >-
        the flow is above the high-flow threshold, the class furnishes a conserving device and a cylinder refill
        is on record
      method: a flat conserver allowance is added to the contents fee instead of a percentage raise
    - when: otherwise, the flow is above the high-flow threshold
      method: the contents fee is raised by the class high-flow percentage
    - when: otherwise, the flow is below the low-flow threshold
      method: >-
        the contents fee is reduced by the class low-flow percentage, then the higher of the reduced fee and the
        low-flow contents floor is kept
    - when: otherwise
      method: the contents fee is unchanged
    baseline:
      contents_flow_fee: contents_fee
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: contents_position_step
    effect: parameter
    decides: contents_step_pct
    bindings:
    - contents_months_paid
    - contents_step_pct
    ladder:
    - when: the month is the 13th or later contents month paid under the coverage on the record
      value: K('late_contents_pct')
    - when: the month is the 7th to the 12th
      value: K('mid_contents_pct')
    - when: otherwise
      value: '100'
    baseline:
      contents_step_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: refill_size_rate
    effect: parameter
    decides: refill_volume_pct
    bindings:
    - sized_refills
    - refill_cylinders
    - refill_volume_pct
    ladder:
    - when: >-
        at least one cylinder refill is on record and the refills average the large-refill cylinder count or more
      value: K('large_refill_pct')
    - when: >-
        at least one cylinder refill is on record and the refills average the small-refill cylinder count or fewer
      value: K('small_refill_pct')
    - when: otherwise, including when no cylinder refill is on record
      value: '100'
    baseline:
      refill_volume_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: refill_frequency_rate
    effect: parameter
    decides: refill_frequency_pct
    bindings:
    - recent_refills
    - refill_frequency_pct
    ladder:
    - when: >-
        the frequent-refill count or more refills are dated less than six whole months before the posting date
      value: K('frequent_refill_pct')
    - when: the sparse-refill count or fewer are
      value: K('sparse_refill_pct')
    - when: otherwise
      value: '100'
    baseline:
      refill_frequency_pct: '100'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: contents_pap_bundle
    effect: parameter
    decides: contents_multi_pct
    bindings:
    - pap_same_plan
    - pap_months_rented
    - pap_months_paid
    - contents_multi_pct
    ladder:
    - when: >-
        the PAP device record names the same coverage, carries no ownership date, has fewer than 13 PAP rental months
        paid and began its payment period at least the minimum months before the posting date
      value: K('rented_pap_pct')
    - when: >-
        the PAP device record carries an ownership date, or 13 or more PAP rental months have been paid
      value: K('owned_pap_pct')
    - when: otherwise
      value: '100'
    baseline:
      contents_multi_pct: '100'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: pap
  baseline:
    rule: >-
      The standard contents allowance of a month is the class's `post_cap_contents_monthly_fee` times the coverage
      class's allowed_pct_of_fee_schedule divided by 100, rounded once to the cent half up.
    params:
    - post_cap_contents_monthly_fee
  inputs:
    history:
    - table: oxygen_billing
      aggregate: count
      field: oxygen_bill_id
      filters:
        event_type: oxygen_contents_paid
    - table: oxygen_service
      aggregate: sum
      field: cylinders_delivered
      filters:
        event_type: oxygen_delivery
        delivery_purpose: cylinder_refill
    - table: oxygen_service
      aggregate: count
      field: oxygen_service_id
      within_months: 6
      filters:
        event_type: oxygen_delivery
        delivery_purpose: cylinder_refill
    - category: pap
      table: pap_billing
      aggregate: count
      field: pap_bill_id
      filters:
        event_type: pap_rental_paid
    cross_category:
    - coverage
    - pap
- id: oxygen_ext_new_primary_first_day
  base_policy_refs:
  - oxygen_payer_transition
  overwrite:
  - base_policy: oxygen_payer_transition
    superseded_clause: a new payment period begins under it on the first date of service it covers
    replaced_by: >-
      For a change of primary coverage this policy governs, and only for such a change, a new payment period begins
      under the new coverage on the first day of service worked out below; every other change of primary coverage
      remains under the base rule.
  trigger: on_request
  subject:
  - oxygen_payer_update
  computes: rental_period_start_date
  target_tool: confirm_oxygen_primary_coverage_03bf25f6
  params:
    new_reach_medicare_days: 365
    new_reach_plan_days: 180
    new_reach_other_days: 90
    commercial_window_days: 180
    medicare_window_days: 120
    other_window_days: 60
    check_medicare_days: 90
    check_plan_days: 30
    commercial_lag_days: 60
    advantage_lag_days: 45
    other_lag_days: 30
  rule: >-
    When the patient confirms that a different coverage has become primary for the oxygen, the oxygen record is
    moved to that coverage with the first day of service it covers worked out as follows. A new coverage's first
    day of service for the oxygen is fixed only after the oxygen claim history carries the paid line of each contents
    month the earlier coverage paid after the payment cap. For a change of primary coverage this policy governs,
    and only for such a change, a new payment period begins under the new coverage on the first day of service worked
    out below; every other change of primary coverage remains under the base rule. The first day of service the
    new coverage covers is its effective date on the coverage record, and a new payment period begins under it on
    that day, written as YYYY-MM-DD. When the effective date falls inside the last month the earlier coverage paid
    on the oxygen claim history - that month began before the effective date and less than one whole calendar month
    before it - and the earlier coverage denied a later month as coverage inactive, the first day of service is
    the first day of the most recent month it denied as coverage inactive; when the last month the earlier coverage
    paid began on or after the effective date, the first day of service is the first day of that paid month; otherwise
    it is the effective date. The first day of service found this way replaces the effective date only when all
    four of the following conditions hold, counted in calendar days as the later date minus the earlier date; when
    any of them fails, the first day of service is the effective date. The new-coverage reach: the first day of
    service is no more than `new_reach_medicare_days` days before the confirmation when the new coverage is Original
    Medicare Part B or Medicare Supplement Plan G, no more than `new_reach_plan_days` days when it is Commercial
    PPO, Commercial HMO, Medicare Advantage PPO or Medicare Advantage HMO, and no more than `new_reach_other_days`
    days for any other class. The denial window: the most recent coverage-inactive denial from the earlier coverage
    was adjudicated no more than `commercial_window_days` days before the confirmation when the earlier coverage
    is Commercial PPO or Commercial HMO, no more than `medicare_window_days` days when it is Original Medicare Part
    B or Medicare Supplement Plan G, and no more than `other_window_days` days for any other class; when the earlier
    coverage has no coverage-inactive denial on the oxygen claim history, the denial window is met. The new-coverage
    check: the new coverage's last eligibility check is no more than `check_medicare_days` days before the confirmation
    when the new coverage is Original Medicare Part B or Medicare Supplement Plan G, no more than `check_plan_days`
    days when it is Commercial PPO, Commercial HMO, Medicare Advantage PPO or Medicare Advantage HMO, and 0 days
    for any other class. The denial lag: that coverage-inactive denial was adjudicated no more than `commercial_lag_days`
    days after the new coverage's effective date when the earlier coverage is Commercial PPO or Commercial HMO,
    no more than `advantage_lag_days` days when it is Medicare Advantage PPO or Medicare Advantage HMO, and no more
    than `other_lag_days` days for any other class; when the earlier coverage has no coverage-inactive denial on
    the oxygen claim history, the denial lag is met. Moving the oxygen to the new coverage and fixing its first
    day of service do not wait on the new coverage's requalifying test: that test decides whether equipment months
    under the new coverage are paid, not the first day of service or the move itself.
  prerequisite:
  - problem: oxygen_ext_paid_in_full_contents_month
    kind: value_input
    gate: earlier_paid_start
    form: state
    policy_source: >-
      A new coverage's first day of service for the oxygen is fixed only after the oxygen claim history carries
      the paid line of each contents month the earlier coverage paid after the payment cap.
    condition: >-
      oxygen_billing carries an oxygen_contents_paid line for every contents month the earlier coverage paid, including
      the month running on the new effective date
    resolved_by: record_oxygen_contents_payment_7caaff46
    effect: >-
      the posted month moves the last month the earlier coverage paid to the one running on the effective date,
      so the first day of service becomes the next month billed instead of the effective date
  cross_category:
  - category: coverage
    as: branch
    reads:
    - effective_date
    - variant_name
    - last_eligibility_check_date
    - status
    - coverage_priority
    note: >-
      the new coverage gives the effective date, reach and check window; the earlier coverage class gives the denial
      window and lag
  compute:
  - new_effective_day: CFIELD('coverage','effective_date', status='active', coverage_priority='primary')
  - earlier_paid_start: >-
      LATEST('oxygen_billing','service_from_date', date_field='service_from_date', coverage_id=F('coverage_id'),
      event_type='oxygen_contents_paid') or (LATEST('oxygen_billing','service_from_date', date_field='service_from_date',
      coverage_id=F('coverage_id'), event_type='oxygen_rental_paid') or '')
  - inactive_denials: >-
      COUNT('oxygen_billing', coverage_id=F('coverage_id'), event_type='oxygen_rental_denied', denial_reason='coverage_inactive')
  - next_billed_start: >-
      LATEST('oxygen_billing','service_from_date', date_field='service_from_date', coverage_id=F('coverage_id'),
      event_type='oxygen_rental_denied', denial_reason='coverage_inactive') or ''
  - first_covered_day: >-
      next_billed_start if (earlier_paid_start != '' and earlier_paid_start < new_effective_day and MONTHS(earlier_paid_start,
      new_effective_day) == 0 and inactive_denials > 0 and next_billed_start > new_effective_day) else (earlier_paid_start
      if (earlier_paid_start != '' and earlier_paid_start >= new_effective_day) else new_effective_day)
  - payer_class: CFIELD('coverage','variant_name', status='active', coverage_priority='primary')
  - new_plan_reach_days: >-
      K('new_reach_medicare_days') if (payer_class == 'Original Medicare Part B' or payer_class == 'Medicare Supplement
      Plan G') else (K('new_reach_plan_days') if (payer_class == 'Commercial PPO' or payer_class == 'Commercial
      HMO' or payer_class == 'Medicare Advantage PPO' or payer_class == 'Medicare Advantage HMO') else K('new_reach_other_days'))
  - earlier_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - denial_age_days: >-
      DAYS(LATEST('oxygen_billing','adjudication_date', date_field='service_from_date', coverage_id=F('coverage_id'),
      event_type='oxygen_rental_denied', denial_reason='coverage_inactive') or NOW, NOW)
  - denial_window_days: >-
      K('commercial_window_days') if (earlier_class == 'Commercial PPO' or earlier_class == 'Commercial HMO') else
      (K('medicare_window_days') if (earlier_class == 'Original Medicare Part B' or earlier_class == 'Medicare Supplement
      Plan G') else K('other_window_days'))
  - new_check_age_days: >-
      DAYS(CFIELD('coverage','last_eligibility_check_date', status='active', coverage_priority='primary') or '1900-01-01',
      NOW)
  - check_payer_class: CFIELD('coverage','variant_name', status='active', coverage_priority='primary')
  - new_check_limit_days: >-
      K('check_medicare_days') if (check_payer_class == 'Original Medicare Part B' or check_payer_class == 'Medicare
      Supplement Plan G') else (K('check_plan_days') if (check_payer_class == 'Commercial PPO' or check_payer_class
      == 'Commercial HMO' or check_payer_class == 'Medicare Advantage PPO' or check_payer_class == 'Medicare Advantage
      HMO') else 0)
  - denial_lag_days: >-
      DAYS(new_effective_day, LATEST('oxygen_billing','adjudication_date', date_field='service_from_date', coverage_id=F('coverage_id'),
      event_type='oxygen_rental_denied', denial_reason='coverage_inactive') or new_effective_day)
  - lag_earlier_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - denial_lag_limit_days: >-
      K('commercial_lag_days') if (lag_earlier_class == 'Commercial PPO' or lag_earlier_class == 'Commercial HMO')
      else (K('advantage_lag_days') if (lag_earlier_class == 'Medicare Advantage PPO' or lag_earlier_class == 'Medicare
      Advantage HMO') else K('other_lag_days'))
  - result: >-
      first_covered_day if (DAYS(first_covered_day, NOW) <= new_plan_reach_days and denial_age_days <= denial_window_days
      and new_check_age_days <= new_check_limit_days and denial_lag_days <= denial_lag_limit_days) else new_effective_day
  compute_basis:
    new_effective_day: >-
      The first day of service the new coverage covers is its effective date on the coverage record, and a new payment
      period begins under it on that day, written as YYYY-MM-DD.
    earlier_paid_start: >-
      When the effective date falls inside the last month the earlier coverage paid on the oxygen claim history
      - that month began before the effective date and less than one whole calendar month before it - and the earlier
      coverage denied a later month as coverage inactive, the first day of service is the first day of the most
      recent month it denied as coverage inactive; when the last month the earlier coverage paid began on or after
      the effective date, the first day of service is the first day of that paid month; otherwise it is the effective
      date. A new coverage's first day of service for the oxygen is fixed only after the oxygen claim history carries
      the paid line of each contents month the earlier coverage paid after the payment cap.
    inactive_denials: >-
      When the effective date falls inside the last month the earlier coverage paid on the oxygen claim history
      - that month began before the effective date and less than one whole calendar month before it - and the earlier
      coverage denied a later month as coverage inactive, the first day of service is the first day of the most
      recent month it denied as coverage inactive; when the last month the earlier coverage paid began on or after
      the effective date, the first day of service is the first day of that paid month; otherwise it is the effective
      date.
    next_billed_start: >-
      When the effective date falls inside the last month the earlier coverage paid on the oxygen claim history
      - that month began before the effective date and less than one whole calendar month before it - and the earlier
      coverage denied a later month as coverage inactive, the first day of service is the first day of the most
      recent month it denied as coverage inactive; when the last month the earlier coverage paid began on or after
      the effective date, the first day of service is the first day of that paid month; otherwise it is the effective
      date.
    first_covered_day: >-
      When the effective date falls inside the last month the earlier coverage paid on the oxygen claim history
      - that month began before the effective date and less than one whole calendar month before it - and the earlier
      coverage denied a later month as coverage inactive, the first day of service is the first day of the most
      recent month it denied as coverage inactive; when the last month the earlier coverage paid began on or after
      the effective date, the first day of service is the first day of that paid month; otherwise it is the effective
      date.
    payer_class: >-
      The new-coverage reach: the first day of service is no more than `new_reach_medicare_days` days before the
      confirmation when the new coverage is Original Medicare Part B or Medicare Supplement Plan G, no more than
      `new_reach_plan_days` days when it is Commercial PPO, Commercial HMO, Medicare Advantage PPO or Medicare Advantage
      HMO, and no more than `new_reach_other_days` days for any other class.
    new_plan_reach_days: >-
      The new-coverage reach: the first day of service is no more than `new_reach_medicare_days` days before the
      confirmation when the new coverage is Original Medicare Part B or Medicare Supplement Plan G, no more than
      `new_reach_plan_days` days when it is Commercial PPO, Commercial HMO, Medicare Advantage PPO or Medicare Advantage
      HMO, and no more than `new_reach_other_days` days for any other class.
    earlier_class: >-
      The denial window: the most recent coverage-inactive denial from the earlier coverage was adjudicated no more
      than `commercial_window_days` days before the confirmation when the earlier coverage is Commercial PPO or
      Commercial HMO, no more than `medicare_window_days` days when it is Original Medicare Part B or Medicare Supplement
      Plan G, and no more than `other_window_days` days for any other class; when the earlier coverage has no coverage-inactive
      denial on the oxygen claim history, the denial window is met.
    denial_age_days: >-
      The denial window: the most recent coverage-inactive denial from the earlier coverage was adjudicated no more
      than `commercial_window_days` days before the confirmation when the earlier coverage is Commercial PPO or
      Commercial HMO, no more than `medicare_window_days` days when it is Original Medicare Part B or Medicare Supplement
      Plan G, and no more than `other_window_days` days for any other class; when the earlier coverage has no coverage-inactive
      denial on the oxygen claim history, the denial window is met.
    denial_window_days: >-
      The denial window: the most recent coverage-inactive denial from the earlier coverage was adjudicated no more
      than `commercial_window_days` days before the confirmation when the earlier coverage is Commercial PPO or
      Commercial HMO, no more than `medicare_window_days` days when it is Original Medicare Part B or Medicare Supplement
      Plan G, and no more than `other_window_days` days for any other class; when the earlier coverage has no coverage-inactive
      denial on the oxygen claim history, the denial window is met.
    new_check_age_days: >-
      The new-coverage check: the new coverage's last eligibility check is no more than `check_medicare_days` days
      before the confirmation when the new coverage is Original Medicare Part B or Medicare Supplement Plan G, no
      more than `check_plan_days` days when it is Commercial PPO, Commercial HMO, Medicare Advantage PPO or Medicare
      Advantage HMO, and 0 days for any other class.
    check_payer_class: >-
      The new-coverage check: the new coverage's last eligibility check is no more than `check_medicare_days` days
      before the confirmation when the new coverage is Original Medicare Part B or Medicare Supplement Plan G, no
      more than `check_plan_days` days when it is Commercial PPO, Commercial HMO, Medicare Advantage PPO or Medicare
      Advantage HMO, and 0 days for any other class.
    new_check_limit_days: >-
      The new-coverage check: the new coverage's last eligibility check is no more than `check_medicare_days` days
      before the confirmation when the new coverage is Original Medicare Part B or Medicare Supplement Plan G, no
      more than `check_plan_days` days when it is Commercial PPO, Commercial HMO, Medicare Advantage PPO or Medicare
      Advantage HMO, and 0 days for any other class.
    denial_lag_days: >-
      The denial lag: that coverage-inactive denial was adjudicated no more than `commercial_lag_days` days after
      the new coverage's effective date when the earlier coverage is Commercial PPO or Commercial HMO, no more than
      `advantage_lag_days` days when it is Medicare Advantage PPO or Medicare Advantage HMO, and no more than `other_lag_days`
      days for any other class; when the earlier coverage has no coverage-inactive denial on the oxygen claim history,
      the denial lag is met.
    lag_earlier_class: >-
      The denial lag: that coverage-inactive denial was adjudicated no more than `commercial_lag_days` days after
      the new coverage's effective date when the earlier coverage is Commercial PPO or Commercial HMO, no more than
      `advantage_lag_days` days when it is Medicare Advantage PPO or Medicare Advantage HMO, and no more than `other_lag_days`
      days for any other class; when the earlier coverage has no coverage-inactive denial on the oxygen claim history,
