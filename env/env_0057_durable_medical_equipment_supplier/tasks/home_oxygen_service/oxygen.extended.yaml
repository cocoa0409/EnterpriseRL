  rule: >-
    An inpatient or skilled nursing stay that is reported after it began is recorded as a suspension of the active
    oxygen record, dated as follows. A stay is recorded as a suspension only after the oxygen record shows an active
    rental with its setup date. For a stay this policy governs, and only for such a stay, the suspension date is
    the day worked out below in place of the admission date; every other stay remains under the base rule and is
    suspended with its admission date as the suspension date. The suspension is dated on the day the stay is reported,
    written as YYYY-MM-DD. A stay that already shows on another Summit Ridge rental of the patient is dated from
    that record instead, while the oxygen record is an active rental: when the patient's PAP device record is suspended
    with a suspension date later than the oxygen setup date, the evidence day is that PAP suspension date; otherwise,
    when the patient's hospital bed record is suspended, the evidence day is the bed's suspension date; otherwise
    the evidence day is the day the stay is reported. The evidence day dates the suspension only when all three
    of the following conditions hold; when any of them fails, the suspension is dated on the day the stay is reported.
    The back-dating reach: the evidence day is no more than `reach_medicare_days` calendar days before the day the
    stay is reported when the coverage named on the oxygen record is Original Medicare Part B or Medicare Supplement
    Plan G, no more than `reach_standard_days` days when it is Commercial PPO, Commercial HMO, Medicare Advantage
    PPO or Medicare Advantage HMO, and no more than `reach_short_days` days for any other coverage class. The home-use
    window: the most recent cylinder refill on the oxygen record, or the setup date when no cylinder refill is on
    record, falls on or before the evidence day and no more than the class's `cylinder_refill_cycle_days` calendar
    days before it for a class with portable cylinder refills, no more than the class's `liquid_refill_cycle_days`
    days before it for a class with liquid refills, and 0 days before it for any other class. The established rental:
    when the oxygen record is an active rental and the patient's PAP device record is suspended with a suspension
    date later than the oxygen setup date, the PAP device record's payment period began at least `pap_established_months`
    whole calendar months before that PAP suspension date; otherwise, when the oxygen record is an active rental
    and the patient's hospital bed record is suspended, the hospital bed record's payment period began at least
    `bed_established_months` whole calendar months before the bed's suspension date; otherwise the oxygen record's
    own payment period began at least `other_established_months` whole calendar months before the day the stay is
    reported.
