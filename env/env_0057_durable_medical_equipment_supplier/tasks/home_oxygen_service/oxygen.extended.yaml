- id: oxygen_ext_return_closing_day
  base_policy_refs:
  - oxygen_return_pickup
  overwrite:
  - base_policy: oxygen_return_pickup
    superseded_clause: billing stops with the last month that began before the return
    replaced_by: >-
      For a return this policy closes, and only for such a return, billing stops with the last month that began
      before the closing day; every other return remains under the base rule.
  trigger: on_request
  subject:
  - oxygen_return
  computes: closed_date
  target_tool: confirm_oxygen_return_2399228d
  params:
    carve_medicare_days: 365
    carve_advantage_days: 180
    close_check_medicare_days: 90
    close_check_plan_days: 30
  rule: >-
    When the patient or the patient's representative confirms the return of oxygen equipment that is no longer needed,
    the confirmation approves the pending return request and closes the oxygen record on a closing day worked out
    as follows. A return for a patient whose need ended before the confirmation is dated only after the oxygen record
    names as its coverage the coverage that is now active and primary. The oxygen record closes on the day the return
    is confirmed, written as YYYY-MM-DD. For a return this policy closes, and only for such a return, billing stops
    with the last month that began before the closing day; every other return remains under the base rule. The day
    the need ended is read from the patient's records: when the patient's hospital bed rental is active and shows
    a hospice election dated before the confirmation, it is that hospice election date; otherwise, when the oxygen
    record is suspended, it is the suspension date; otherwise it is the day the return is confirmed. The record
    closes on the day the need ended instead of the day of confirmation only when all three of the following conditions
    hold, counted in calendar days as the later date minus the earlier date; when any of them fails, it closes on
    the day the return is confirmed. The carve-out reach: the day the need ended is no more than `carve_medicare_days`
    days before the confirmation when the coverage named on the oxygen record is Original Medicare Part B or Medicare
    Supplement Plan G, no more than `carve_advantage_days` days when it is Medicare Advantage PPO or Medicare Advantage
    HMO, and 0 days for any other coverage class. The last-use window: the most recent cylinder refill on the oxygen
    record, or the setup date when none is on record, falls on or before the day the need ended and no more than
    the class's `cylinder_refill_cycle_days` days before it for a class with portable cylinder refills, no more
    than the class's `liquid_refill_cycle_days` days before it for a class with liquid refills, and 0 days before
    it for any other class. The closing coverage check: the last eligibility check of the coverage named on the
    oxygen record is no more than `close_check_medicare_days` days before the confirmation when that coverage is
    Original Medicare Part B or Medicare Supplement Plan G, no more than `close_check_plan_days` days when it is
    Commercial PPO, Commercial HMO, Medicare Advantage PPO or Medicare Advantage HMO, and 0 days for any other class.
  prerequisite:
  - problem: oxygen_ext_new_primary_first_day
    kind: value_input
    gate: close_reach_days
    form: state
    policy_source: >-
      A return for a patient whose need ended before the confirmation is dated only after the oxygen record names
      as its coverage the coverage that is now active and primary.
    condition: oxygen_holdings.coverage_id names the coverage record that is active and primary
    resolved_by: confirm_oxygen_primary_coverage_03bf25f6
    effect: >-
      the coverage named on the record becomes Original Medicare Part B, which sets the carve-out reach to 365 days
      and the closing check window to 90 days, so the record closes on the hospice election date
  cross_category:
  - category: beds
    as: branch
    reads:
    - status
    - hospice_election_date
    note: the hospice election on the hospital bed rental gives the day the need ended
  - category: coverage
    as: branch
    reads:
    - variant_name
    - last_eligibility_check_date
    note: >-
      the coverage named on the oxygen record sets the carve-out reach and the closing check window
  compute:
  - hospice_start: CFIELD('beds','hospice_election_date', status='rental_active') or ''
  - need_end_day: >-
      hospice_start if (EXISTS('beds', status='rental_active') and hospice_start != '' and hospice_start < NOW)
      else (F('suspended_date') if F('status') == 'suspended' else NOW)
  - payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - close_reach_days: >-
      K('carve_medicare_days') if (payer_class == 'Original Medicare Part B' or payer_class == 'Medicare Supplement
      Plan G') else (K('carve_advantage_days') if (payer_class == 'Medicare Advantage PPO' or payer_class == 'Medicare
      Advantage HMO') else 0)
  - last_use_day: >-
      LATEST('oxygen_service','service_date', date_field='service_date', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
      if COUNT('oxygen_service', event_type='oxygen_delivery', delivery_purpose='cylinder_refill') > 0 else F('setup_date')
  - use_window_days: >-
      P('cylinder_refill_cycle_days') if P('cylinder_refill_cycle_days') > 0 else (P('liquid_refill_cycle_days')
      if P('liquid_refill_cycle_days') > 0 else 0)
  - close_check_age_days: >-
      DAYS(CFIELD('coverage','last_eligibility_check_date', coverage_id=F('coverage_id')) or '1900-01-01', NOW)
  - check_payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - close_check_limit_days: >-
      K('close_check_medicare_days') if (check_payer_class == 'Original Medicare Part B' or check_payer_class ==
      'Medicare Supplement Plan G') else (K('close_check_plan_days') if (check_payer_class == 'Commercial PPO' or
      check_payer_class == 'Commercial HMO' or check_payer_class == 'Medicare Advantage PPO' or check_payer_class
      == 'Medicare Advantage HMO') else 0)
  - result: >-
      need_end_day if (DAYS(need_end_day, NOW) <= close_reach_days and (DAYS(last_use_day, need_end_day)) >= 0 and
      (DAYS(last_use_day, need_end_day)) <= use_window_days and close_check_age_days <= close_check_limit_days)
      else NOW
  compute_basis:
    hospice_start: >-
      The day the need ended is read from the patient's records: when the patient's hospital bed rental is active
      and shows a hospice election dated before the confirmation, it is that hospice election date; otherwise, when
      the oxygen record is suspended, it is the suspension date; otherwise it is the day the return is confirmed.
    need_end_day: >-
      The day the need ended is read from the patient's records: when the patient's hospital bed rental is active
      and shows a hospice election dated before the confirmation, it is that hospice election date; otherwise, when
      the oxygen record is suspended, it is the suspension date; otherwise it is the day the return is confirmed.
    payer_class: >-
      The carve-out reach: the day the need ended is no more than `carve_medicare_days` days before the confirmation
      when the coverage named on the oxygen record is Original Medicare Part B or Medicare Supplement Plan G, no
      more than `carve_advantage_days` days when it is Medicare Advantage PPO or Medicare Advantage HMO, and 0 days
      for any other coverage class.
    close_reach_days: >-
      The carve-out reach: the day the need ended is no more than `carve_medicare_days` days before the confirmation
      when the coverage named on the oxygen record is Original Medicare Part B or Medicare Supplement Plan G, no
      more than `carve_advantage_days` days when it is Medicare Advantage PPO or Medicare Advantage HMO, and 0 days
      for any other coverage class. A return for a patient whose need ended before the confirmation is dated only
      after the oxygen record names as its coverage the coverage that is now active and primary.
    last_use_day: >-
      The last-use window: the most recent cylinder refill on the oxygen record, or the setup date when none is
      on record, falls on or before the day the need ended and no more than the class's `cylinder_refill_cycle_days`
      days before it for a class with portable cylinder refills, no more than the class's `liquid_refill_cycle_days`
      days before it for a class with liquid refills, and 0 days before it for any other class.
    use_window_days: >-
      The last-use window: the most recent cylinder refill on the oxygen record, or the setup date when none is
      on record, falls on or before the day the need ended and no more than the class's `cylinder_refill_cycle_days`
      days before it for a class with portable cylinder refills, no more than the class's `liquid_refill_cycle_days`
      days before it for a class with liquid refills, and 0 days before it for any other class.
    close_check_age_days: >-
      The closing coverage check: the last eligibility check of the coverage named on the oxygen record is no more
      than `close_check_medicare_days` days before the confirmation when that coverage is Original Medicare Part
      B or Medicare Supplement Plan G, no more than `close_check_plan_days` days when it is Commercial PPO, Commercial
      HMO, Medicare Advantage PPO or Medicare Advantage HMO, and 0 days for any other class.
    check_payer_class: >-
      The closing coverage check: the last eligibility check of the coverage named on the oxygen record is no more
      than `close_check_medicare_days` days before the confirmation when that coverage is Original Medicare Part
      B or Medicare Supplement Plan G, no more than `close_check_plan_days` days when it is Commercial PPO, Commercial
      HMO, Medicare Advantage PPO or Medicare Advantage HMO, and 0 days for any other class.
    close_check_limit_days: >-
      The closing coverage check: the last eligibility check of the coverage named on the oxygen record is no more
      than `close_check_medicare_days` days before the confirmation when that coverage is Original Medicare Part
      B or Medicare Supplement Plan G, no more than `close_check_plan_days` days when it is Commercial PPO, Commercial
      HMO, Medicare Advantage PPO or Medicare Advantage HMO, and 0 days for any other class.
    result: >-
      The record closes on the day the need ended instead of the day of confirmation only when all three of the
      following conditions hold, counted in calendar days as the later date minus the earlier date; when any of
      them fails, it closes on the day the return is confirmed. The oxygen record closes on the day the return is
      confirmed, written as YYYY-MM-DD. The last-use window: the most recent cylinder refill on the oxygen record,
      or the setup date when none is on record, falls on or before the day the need ended and no more than the class's
      `cylinder_refill_cycle_days` days before it for a class with portable cylinder refills, no more than the class's
      `liquid_refill_cycle_days` days before it for a class with liquid refills, and 0 days before it for any other
      class.
  factors:
  - id: need_end_source
    effect: method
    decides: need_end_day
    bindings:
    - hospice_start
    - need_end_day
    ladder:
    - when: >-
        the hospital bed rental is active and shows a hospice election dated before the confirmation
      method: the need ended on the hospice election date
    - when: the oxygen record is suspended
      method: the need ended on the suspension date
    - when: otherwise
      method: the need ends on the day the return is confirmed
    baseline:
      need_end_day: NOW
    evidence:
    - cross_category
    - date
    cross_difficulty: beds
  - id: carve_out_reach
    effect: parameter
    decides: close_reach_days
