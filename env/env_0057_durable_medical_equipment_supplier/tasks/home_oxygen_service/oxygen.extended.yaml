    denial_lag_limit_days: >-
      The denial lag: that coverage-inactive denial was adjudicated no more than `commercial_lag_days` days after
      the new coverage's effective date when the earlier coverage is Commercial PPO or Commercial HMO, no more than
      `advantage_lag_days` days when it is Medicare Advantage PPO or Medicare Advantage HMO, and no more than `other_lag_days`
      days for any other class; when the earlier coverage has no coverage-inactive denial on the oxygen claim history,
      the denial lag is met.
    result: >-
      The first day of service found this way replaces the effective date only when all four of the following conditions
      hold, counted in calendar days as the later date minus the earlier date; when any of them fails, the first
      day of service is the effective date. The first day of service the new coverage covers is its effective date
      on the coverage record, and a new payment period begins under it on that day, written as YYYY-MM-DD.
  factors:
  - id: covered_day_anchor
    effect: method
    decides: first_covered_day
    bindings:
    - earlier_paid_start
    - inactive_denials
    - next_billed_start
