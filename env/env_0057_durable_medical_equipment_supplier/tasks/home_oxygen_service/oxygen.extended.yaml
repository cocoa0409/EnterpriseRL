  factors:
  - id: awake_usage_share
    effect: parameter
    decides: usage_rate_pct
    bindings:
    - awake_use_deliveries
    - usage_rate_pct
    ladder:
    - when: the order is for sleep only
      value: K('sleep_only_pct')
    - when: the order is for exertion only and at least one cylinder refill is on record
      value: K('exertion_only_pct')
    - when: the order is for exertion and sleep and at least one cylinder refill is on record
      value: K('exertion_and_sleep_pct')
    - when: otherwise
      value: '100'
    baseline:
      usage_rate_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: flow_fee_combination
    effect: method
    decides: month_equipment_fee
    bindings:
    - portable_billable
    - month_equipment_fee
    ladder:
    - when: the prescribed flow is above the high-flow threshold and portable equipment is billable
      method: >-
        the higher of the stationary fee raised by the class high-flow uplift and the stationary fee plus the add-on
    - when: the prescribed flow is above the high-flow threshold and no portable equipment is billable
      method: the stationary fee raised by the class high-flow uplift
    - when: the prescribed flow is below the low-flow threshold
      method: >-
        the stationary fee reduced by the low-flow percentage, plus the add-on when portable equipment is billable
    - when: >-
        the prescribed flow is neither above the high-flow threshold nor below the low-flow threshold and portable
        equipment is billable
      method: the stationary fee plus the add-on
    - when: otherwise
      method: the stationary fee
    baseline:
      month_equipment_fee: stationary_fee
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: payer_high_flow_rate
    effect: parameter
    decides: payer_flow_pct
    bindings:
    - payer_class
    - payer_flow_pct
    ladder:
    - when: >-
        the prescribed flow is above the high-flow threshold and the coverage on the oxygen record is Commercial
        PPO or Commercial HMO
      value: K('commercial_high_flow_pct')
    - when: >-
        the prescribed flow is above the high-flow threshold and the coverage on the oxygen record is Medicaid Fee-for-Service
      value: K('medicaid_high_flow_pct')
    - when: otherwise
      value: '100'
    baseline:
      payer_flow_pct: '100'
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: rental_position_step
    effect: parameter
    decides: rental_position_pct
    bindings:
    - paid_months_before
    - rental_position_pct
    ladder:
    - when: no equipment month has been paid yet under the coverage on the record
      value: K('opening_month_pct')
    - when: 12 or more equipment months have been paid under that coverage
      value: K('long_rental_pct')
    - when: otherwise
      value: '100'
    baseline:
      rental_position_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: discharge_training_rate
    effect: parameter
    decides: training_rate_pct
    bindings:
    - initial_delivery_day
    - training_rate_pct
    ladder:
    - when: >-
        the initial-setup delivery came before the setup date and the order came from a hospital discharge
      value: K('hospital_training_pct')
    - when: >-
        the initial-setup delivery came before the setup date and the order came from a skilled nursing facility
      value: K('facility_training_pct')
    - when: otherwise
      value: '100'
    baseline:
      training_rate_pct: '100'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pap_multi_rental
    effect: parameter
    decides: multi_rental_pct
    bindings:
    - pap_on_same_plan
    - pap_rented_months
    - pap_paid_months
    - multi_rental_pct
    ladder:
    - when: >-
        the PAP device record names the same coverage, carries no ownership date, has fewer than 13 PAP rental months
        paid and began its payment period at least the minimum months before the posting date
      value: K('rented_pap_pct')
    - when: >-
        the PAP device record carries an ownership date, or 13 or more PAP rental months have been paid
      value: K('owned_pap_pct')
    - when: otherwise
      value: '100'
    baseline:
      multi_rental_pct: '100'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: pap
  baseline:
    rule: >-
      The standard month's fee is the class's `stationary_monthly_fee`. The standard allowed amount is the month's
      fee times the coverage class's allowed_pct_of_fee_schedule divided by 100, rounded once to the cent half up.
    params:
    - stationary_monthly_fee
  inputs:
    history:
    - table: oxygen_billing
      aggregate: count
      field: oxygen_bill_id
      filters:
