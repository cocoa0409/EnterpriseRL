  - evidence_rental_months: >-
      MONTHS(CFIELD('pap','rental_period_start_date', status='suspended'), CFIELD('pap','suspended_date', status='suspended'))
      if (F('status') == 'rental_active' and (CFIELD('pap','suspended_date', status='suspended') or '') > F('setup_date'))
      else (MONTHS(CFIELD('beds','rental_period_start_date', status='suspended'), CFIELD('beds','suspended_date',
