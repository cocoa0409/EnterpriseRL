events:
  - type: oxygen_order_create
    target: oxygen_holdings
    mutation: create
    meaning: A written oxygen order arrives from a referral partner and an oxygen record is opened.
    grain: one row per oxygen order
    fields:
      customer_id: patient
      variant_name: system class ordered
      coverage_id: primary coverage to be billed
      ordering_npi: ordering practitioner NPI
      referral_source: kind of referral partner
      order_date: date the order was received
      qualifying_test_date: date of the qualifying test
      qualifying_spo2: saturation on the qualifying test
      qualifying_group: group I or group II
      prescribed_lpm: prescribed flow
      usage_pattern: when oxygen is used
      mobile_in_home: whether mobility in the home is documented
      rx_date: date of the written order
    triggers: []

  - type: oxygen_setup_complete
    target: oxygen_holdings
    mutation: {transition: {from: order_received, to: rental_active}}
    meaning: The oxygen system is set up in the home and the payment period begins.
    grain: one row per transaction
    fields:
      setup_date: setup date
      rental_period_start_date: first day of the payment period (the setup date)
      serial_number: stationary unit serial number
    triggers: []

  - type: oxygen_order_cancel
    target: oxygen_holdings
    mutation: {transition: {from: order_received, to: cancelled}}
    meaning: The patient declines oxygen before delivery.
    grain: one row per transaction
    fields:
      closed_date: date declined
    triggers: []

  - type: oxygen_suspend
    target: oxygen_holdings
    mutation: {transition: {from: rental_active, to: suspended}}
    meaning: Monthly billing pauses for an inpatient or skilled nursing stay.
    grain: one row per transaction
    fields:
      suspended_date: admission date
    triggers: []

  - type: oxygen_resume
    target: oxygen_holdings
    mutation: {transition: {from: suspended, to: rental_active}}
    meaning: The patient is home again and billing resumes in the same payment period.
    grain: one row per transaction
    fields:
      suspended_date: cleared on resumption
    triggers: []

  - type: oxygen_cap_reached
    target: oxygen_holdings
    mutation: {transition: {from: rental_active, to: payment_cap_reached}}
    meaning: The last capped equipment month is paid.
    grain: one row per transaction
    fields:
      cap_reached_date: day after the last day of the final paid month
    triggers: []

  - type: oxygen_return
    target: oxygen_holdings
    mutation: {transition: [{from: rental_active, to: returned}, {from: suspended, to: returned}, {from: payment_cap_reached, to: returned}]}
    meaning: The patient confirms the oxygen equipment is given back.
    grain: one row per transaction
    fields:
      closed_date: date of the confirmed return
    triggers: []

  - type: oxygen_lifetime_end
    target: oxygen_holdings
    mutation: {transition: {from: payment_cap_reached, to: lifetime_ended}}
    meaning: The equipment's useful lifetime has elapsed and the patient elected new equipment under a new record.
    grain: one row per transaction
    fields:
      closed_date: date the replacement election was recorded
    triggers: []

  - type: oxygen_system_change
    target: oxygen_holdings
    mutation: update
    meaning: The oxygen system class is changed on a new order (for example cylinders to a portable concentrator) within the same payment period.
    grain: one row per transaction
    fields:
      variant_name: new system class
      prescribed_lpm: flow on the new order
      usage_pattern: usage on the new order
      rx_date: date of the new order
      serial_number: new stationary unit serial number
    triggers: []

  - type: oxygen_rx_update
    target: oxygen_holdings
    mutation: update
    meaning: A new written order changes the flow rate or usage pattern on the same system.
    grain: one row per transaction
    fields:
      prescribed_lpm: flow on the new order
      usage_pattern: usage on the new order
      mobile_in_home: mobility documentation on the new order
      rx_date: date of the new order
    triggers: []

  - type: oxygen_payer_update
    target: oxygen_holdings
    mutation: update
    meaning: A different primary coverage starts paying and a new payment period begins under it.
    grain: one row per transaction
    fields:
      coverage_id: new primary coverage
      rental_period_start_date: first date of service under the new coverage
    triggers: []

  - type: oxygen_period_restart
    target: oxygen_holdings
    mutation: update
    meaning: After a break in need longer than allowed, a new payment period starts on a new test and order.
    grain: one row per transaction
    fields:
      rental_period_start_date: first day of the new period
      qualifying_test_date: date of the new qualifying test
      qualifying_spo2: saturation on the new test
      rx_date: date of the new order
    triggers: []

  - type: oxygen_rental_paid
    target: oxygen_billing
    meaning: The payer pays one monthly equipment payment of the payment period.
    grain: one row per paid equipment month within a payment period under one coverage
    distinguish_by: [coverage_id, rental_month_number, service_from_date]
    fields:
      coverage_id: coverage that paid
      hcpcs_code: stationary code
      flow_modifier: flow-rate modifier
      rental_month_number: month ordinal 1-36
      service_from_date: first day of the month
      adjudication_date: remittance date
      allowed_amount: allowed amount, stationary plus portable add-on
      portable_allowed_amount: portable add-on part
      payer_paid_amount: payer payment
      patient_responsibility: patient responsibility
      claim_number: claim control number
    account: equipment_months
    direction: in
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: oxygen, source_bill_id: oxygen_bill_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}

  - type: oxygen_rental_denied
    target: oxygen_billing
    meaning: The payer denies a monthly equipment claim.
    grain: one row per denied equipment month claim
    distinguish_by: [coverage_id, service_from_date, denial_reason]
    fields:
      coverage_id: coverage billed
      hcpcs_code: stationary code
      flow_modifier: flow-rate modifier
      rental_month_number: month ordinal billed
      service_from_date: first day of the month
      adjudication_date: remittance date of the denial
      denial_reason: denial reason
      claim_number: claim control number
    triggers: []

  - type: oxygen_claim_reversal
    target: oxygen_billing
    meaning: The payer takes back a paid equipment month.
    grain: one row per paid month reversed
    distinguish_by: [original_bill_id]
    fields:
      coverage_id: coverage that recouped
      original_bill_id: the paid month reversed
      reversal_reason: why it was taken back
      payer_paid_amount: amount taken back
      service_from_date: first day of the reversed month
      adjudication_date: recoupment remittance date
      claim_number: claim control number of the reversal
    account: equipment_months
    direction: out
    triggers:
      - event: coverage:coverage_adjustment
        map: {coverage_id: coverage_id, customer_id: customer_id, adjustment_reason: claim_reversal}

  - type: oxygen_contents_paid
    target: oxygen_billing
    meaning: The payer pays one month of gas or liquid contents after the equipment-payment cap.
    grain: one row per paid contents month after the cap
    distinguish_by: [coverage_id, service_from_date, hcpcs_code]
    fields:
      coverage_id: coverage that paid
      hcpcs_code: contents code
      rental_month_number: contents month ordinal counted from the cap
      service_from_date: first day of the contents month
      adjudication_date: remittance date
      allowed_amount: allowed contents fee
      payer_paid_amount: payer payment
      patient_responsibility: patient responsibility
      claim_number: claim control number
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: oxygen, source_bill_id: oxygen_bill_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}

  - type: oxygen_delivery
    target: oxygen_service
    meaning: Equipment or contents are delivered to the home (setup, refill, travel supply, swap or backup cylinders).
    grain: one row per delivery stop
    distinguish_by: [service_date, delivery_purpose]
    fields:
      service_date: delivery date
      delivery_purpose: why the delivery was made
      cylinders_delivered: cylinders left
      serial_number: unit delivered (setup or swap)
      travel_destination_zip: destination ZIP on a travel supply
    triggers:
      - event: oxygen:oxygen_setup_complete
        when: {delivery_purpose: initial_setup}
        map: {setup_date: service_date, rental_period_start_date: service_date, serial_number: serial_number}

  - type: oxygen_maintenance_visit
    target: oxygen_service
    meaning: A technician services the equipment (routine maintenance, malfunction repair or power-outage response).
    grain: one row per service visit
    distinguish_by: [service_date, visit_type]
    fields:
      service_date: visit date
      visit_type: kind of visit
      serial_number: unit serviced
    triggers: []

  - type: oxygen_retest_received
    target: oxygen_service
    meaning: A group II patient's repeat saturation test is received.
    grain: one row per repeat test documented
    distinguish_by: [retest_date]
    fields:
      service_date: date the result was received
      retest_date: date of the repeat test
      retest_spo2: saturation on the repeat test
    triggers: []

  - type: oxygen_pickup
    target: oxygen_service
    meaning: Equipment is collected from the home (or found missing on the pickup attempt).
    grain: one row per pickup visit
    distinguish_by: [service_date]
    fields:
      service_date: pickup date
      pickup_condition: condition found
      cylinders_unreturned: cylinders not recovered
      serial_number: unit collected
    triggers: []

measures:
  - id: oxygen_msr_paid_months_current_period
    window: oxygen_billing rows of the holding whose coverage_id equals the holding's coverage_id and whose service_from_date is on or after rental_period_start_date, up to the handling date
    measure: count of oxygen_rental_paid rows minus the count of oxygen_claim_reversal rows whose original_bill_id is one of them
  - id: oxygen_msr_contents_deliveries_in_month
    window: one contents month, from its service_from_date up to the day before the same day of the next calendar month
    measure: count of oxygen_delivery rows of the holding with delivery_purpose cylinder_refill or liquid_refill and service_date inside the month

policies:
  - id: oxygen_agg_multi_holding
    subject: [oxygen_order_create]
    rule: >-
      A patient holds at most `max_per_customer` open oxygen record (any status other than returned,
      cancelled or lifetime_ended); a different system class is furnished by changing the class on the
      existing record, never by opening a second one. A new oxygen record is opened only when no oxygen
      record of the patient is order_received, rental_active, suspended or payment_cap_reached; a
      replacement election under oxygen_lifetime closes the old record before the new one is opened.
    eligibility:
      - id: one_open_oxygen_record
        applies_to: [oxygen_order_create]
        kind: dedup
        condition: A new oxygen record is opened only when no oxygen record of the patient is order_received, rental_active, suspended or payment_cap_reached; a replacement election under oxygen_lifetime closes the old record before the new one is opened.
        evidence_fields: [oxygen_holdings.customer_id, oxygen_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_holdings.customer_id]
          action_bindings:
            oxygen_holdings.customer_id: customer_id
        dedup_contract:
          table: oxygen_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [order_received, rental_active, suspended, payment_cap_reached]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: oxygen_qualification
    subject: [oxygen_order_create, oxygen_setup_complete, oxygen_delivery]
    rule: >-
      Oxygen qualifies when the qualifying test shows saturation at or below
      `qualifying_spo2_max_group_i` (group I), or equal to `qualifying_spo2_group_ii` with a documented
      qualifying comorbidity (group II), and was performed no more than `qualifying_test_lookback_days`
      before the order date. Portable equipment is billable only when mobility within the home is
      documented where `portable_mobility_documentation_required` is true; an order for sleep_only use
      never qualifies for portable equipment. A written order older than `rx_validity_months` cannot
      start oxygen. Setup is made within `setup_lead_hours` of a complete order, on the day of hospital
      discharge where `discharge_same_day_setup` is true, by a respiratory therapist where
      `setup_by_rt_required` is true, and leaves `emergency_backup_cylinders` backup cylinders. When the
      primary coverage's class requires prior authorization for oxygen (coverage parameter
      prior_auth_oxygen_required), oxygen is set up only once a prior_authorization request on this
      holding is approved and the setup date is within the coverage's prior_auth_validity_days of its
      decision_date. Oxygen is set up only when the coverage's last eligibility check is within that
      coverage class's eligibility_reverify_days before the setup date.
    eligibility:
      - id: oxygen_prior_auth
        applies_to: [oxygen_setup_complete]
        kind: authorization
        condition: When the primary coverage's class requires prior authorization for oxygen (coverage parameter prior_auth_oxygen_required), oxygen is set up only once a prior_authorization request on this holding is approved and the setup date is within the coverage's prior_auth_validity_days of its decision_date.
        evidence_fields: [oxygen_requests.request_type, oxygen_requests.request_status, oxygen_requests.decision_date, oxygen_requests.oxygen_holding_id, coverage_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_requests.oxygen_holding_id]
          action_bindings:
            oxygen_requests.oxygen_holding_id: oxygen_holding_id
      - id: oxygen_eligibility_current
        applies_to: [oxygen_setup_complete]
        kind: authorization
        condition: Oxygen is set up only when the coverage's last eligibility check is within that coverage class's eligibility_reverify_days before the setup date.
        evidence_fields: [coverage_holdings.last_eligibility_check_date, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"spo2_group_i": "=qualifying_spo2_max_group_i", "spo2_group_ii": "=qualifying_spo2_group_ii", "lookback_days": "=qualifying_test_lookback_days", "mobility_required": "=portable_mobility_documentation_required", "lead_hours": "=setup_lead_hours", "backup_cylinders": "=emergency_backup_cylinders"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"spo2_group_i": "=qualifying_spo2_max_group_i", "spo2_group_ii": "=qualifying_spo2_group_ii", "lookback_days": "=qualifying_test_lookback_days", "mobility_required": "=portable_mobility_documentation_required", "lead_hours": "=setup_lead_hours", "backup_cylinders": "=emergency_backup_cylinders"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"spo2_group_i": "=qualifying_spo2_max_group_i", "spo2_group_ii": "=qualifying_spo2_group_ii", "lookback_days": "=qualifying_test_lookback_days", "mobility_required": "=portable_mobility_documentation_required", "lead_hours": "=setup_lead_hours", "backup_cylinders": "=emergency_backup_cylinders"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"spo2_group_i": "=qualifying_spo2_max_group_i", "spo2_group_ii": "=qualifying_spo2_group_ii", "lookback_days": "=qualifying_test_lookback_days", "mobility_required": "=portable_mobility_documentation_required", "lead_hours": "=setup_lead_hours", "backup_cylinders": "=emergency_backup_cylinders"}
        "Liquid Oxygen System (E0439 + E0434)": {"spo2_group_i": "=qualifying_spo2_max_group_i", "spo2_group_ii": "=qualifying_spo2_group_ii", "lookback_days": "=qualifying_test_lookback_days", "mobility_required": "=portable_mobility_documentation_required", "lead_hours": "=setup_lead_hours", "backup_cylinders": "=emergency_backup_cylinders"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"spo2_group_i": "=qualifying_spo2_max_group_i", "spo2_group_ii": "=qualifying_spo2_group_ii", "lookback_days": "=qualifying_test_lookback_days", "mobility_required": "=portable_mobility_documentation_required", "lead_hours": "=setup_lead_hours", "backup_cylinders": "=emergency_backup_cylinders"}

  - id: oxygen_evt_monthly_billing
    subject: [oxygen_rental_paid, oxygen_rental_denied]
    rule: >-
      Each month of the payment period is billed on the anniversary of rental_period_start_date (the
      same day of each later calendar month, falling back to the last day of a shorter month; after a
      resumption the next month starts on the resumption date); the month number is the next ordinal
      after the paid months counted by oxygen_msr_paid_months_current_period. The month's fee is
      `stationary_monthly_fee`, adjusted for the prescribed flow in force on the month's first day: above
      `high_flow_threshold_lpm` the stationary fee rises by `high_flow_uplift_pct` percent (modifier QG,
      or QF when portable equipment is furnished, in which case the portable add-on is not paid on top of
      the uplift and the higher of the two amounts applies); below `low_flow_threshold_lpm` it falls by
      `low_flow_reduction_pct` percent (modifier QE). The portable add-on
      `portable_addon_monthly_fee` is added when portable equipment is furnished and billable. The
      allowed amount is the fee times the coverage class's allowed_pct_of_fee_schedule divided by 100,
      rounded to the cent half up. Contents are included during the payment period and never billed
      separately in it. For a group II patient, months from month 4 are payable only when a repeat test
      between therapy days `group_ii_retest_earliest_day` and `group_ii_retest_latest_day` again
      qualifies; otherwise they are denied with retest_missing. An equipment month is billed only while
      the oxygen record is rental_active.
      The line carries the class's `stationary_hcpcs`, with the portable equipment `portable_hcpcs`
      riding on it.
    eligibility:
      - id: oxygen_billable_status
        applies_to: [oxygen_rental_paid]
        kind: state
        condition: An equipment month is billed only while the oxygen record is rental_active.
        evidence_fields: [oxygen_holdings.status, oxygen_holdings.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_holdings.oxygen_holding_id]
          action_bindings:
            oxygen_holdings.oxygen_holding_id: oxygen_holding_id
        state_contract:
          field: oxygen_holdings.status
          allowed: [rental_active]
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"stationary_code": "=stationary_hcpcs", "portable_code": "=portable_hcpcs", "stationary_fee": "=stationary_monthly_fee", "portable_fee": "=portable_addon_monthly_fee", "high_flow_lpm": "=high_flow_threshold_lpm", "high_flow_pct": "=high_flow_uplift_pct", "low_flow_lpm": "=low_flow_threshold_lpm", "low_flow_pct": "=low_flow_reduction_pct", "retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"stationary_code": "=stationary_hcpcs", "portable_code": "=portable_hcpcs", "stationary_fee": "=stationary_monthly_fee", "portable_fee": "=portable_addon_monthly_fee", "high_flow_lpm": "=high_flow_threshold_lpm", "high_flow_pct": "=high_flow_uplift_pct", "low_flow_lpm": "=low_flow_threshold_lpm", "low_flow_pct": "=low_flow_reduction_pct", "retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"stationary_code": "=stationary_hcpcs", "portable_code": "=portable_hcpcs", "stationary_fee": "=stationary_monthly_fee", "portable_fee": "=portable_addon_monthly_fee", "high_flow_lpm": "=high_flow_threshold_lpm", "high_flow_pct": "=high_flow_uplift_pct", "low_flow_lpm": "=low_flow_threshold_lpm", "low_flow_pct": "=low_flow_reduction_pct", "retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"stationary_code": "=stationary_hcpcs", "portable_code": "=portable_hcpcs", "stationary_fee": "=stationary_monthly_fee", "portable_fee": "=portable_addon_monthly_fee", "high_flow_lpm": "=high_flow_threshold_lpm", "high_flow_pct": "=high_flow_uplift_pct", "low_flow_lpm": "=low_flow_threshold_lpm", "low_flow_pct": "=low_flow_reduction_pct", "retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day"}
        "Liquid Oxygen System (E0439 + E0434)": {"stationary_code": "=stationary_hcpcs", "portable_code": "=portable_hcpcs", "stationary_fee": "=stationary_monthly_fee", "portable_fee": "=portable_addon_monthly_fee", "high_flow_lpm": "=high_flow_threshold_lpm", "high_flow_pct": "=high_flow_uplift_pct", "low_flow_lpm": "=low_flow_threshold_lpm", "low_flow_pct": "=low_flow_reduction_pct", "retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"stationary_code": "=stationary_hcpcs", "portable_code": "=portable_hcpcs", "stationary_fee": "=stationary_monthly_fee", "portable_fee": "=portable_addon_monthly_fee", "high_flow_lpm": "=high_flow_threshold_lpm", "high_flow_pct": "=high_flow_uplift_pct", "low_flow_lpm": "=low_flow_threshold_lpm", "low_flow_pct": "=low_flow_reduction_pct", "retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day"}
    formula:
      high_flow_with_portable_fee: max(stationary_monthly_fee * (100 + high_flow_uplift_pct) / 100, stationary_monthly_fee + portable_addon_monthly_fee)
      low_flow_fee: stationary_monthly_fee * (100 - low_flow_reduction_pct) / 100 + portable_addon_monthly_fee
    measures: [oxygen_msr_paid_months_current_period]

  - id: oxygen_payment_cap
    subject: [oxygen_cap_reached, oxygen_rental_paid, oxygen_rental_denied]
    rule: >-
      Equipment payments stop once oxygen_msr_paid_months_current_period reaches the coverage class's
      oxygen_rental_cap_months; cap_reached_date is the day after the last day of the final paid month.
      An equipment month billed beyond the cap is denied with cap_reached and never charged to the
      patient. Summit Ridge keeps title to the equipment and must keep furnishing and servicing it,
      without equipment payment, until the coverage class's oxygen_useful_lifetime_months have elapsed
      from the first day of the first paid month of the period. Months paid under an earlier coverage or
      an earlier period do not count toward the cap.
    eligibility: []
    measures: [oxygen_msr_paid_months_current_period]

  - id: oxygen_contents_billing
    subject: [oxygen_contents_paid]
    rule: >-
      After the cap, classes with a `post_cap_contents_hcpcs` other than none bill one contents month
      at `post_cap_contents_monthly_fee` times the coverage class's allowed_pct_of_fee_schedule divided
      by 100, rounded to the cent half up. Contents months follow the same anniversary days as the
      equipment months, and a month is billable only when oxygen_msr_contents_deliveries_in_month
      reaches `contents_delivery_min_per_month`. Concentrator, home-fill and portable-concentrator
      classes never bill contents. Contents are billed only after the payment cap: the oxygen record is
      payment_cap_reached.
    eligibility:
      - id: contents_after_cap
        applies_to: [oxygen_contents_paid]
        kind: state
        condition: 'the oxygen record is payment_cap_reached.'
        evidence_fields: [oxygen_holdings.status, oxygen_holdings.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_holdings.oxygen_holding_id]
          action_bindings:
            oxygen_holdings.oxygen_holding_id: oxygen_holding_id
        state_contract:
          field: oxygen_holdings.status
          allowed: [payment_cap_reached]
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"contents_code": "=post_cap_contents_hcpcs", "contents_fee": "=post_cap_contents_monthly_fee", "min_deliveries": "=contents_delivery_min_per_month"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"contents_code": "=post_cap_contents_hcpcs", "contents_fee": "=post_cap_contents_monthly_fee", "min_deliveries": "=contents_delivery_min_per_month"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"contents_code": "=post_cap_contents_hcpcs", "contents_fee": "=post_cap_contents_monthly_fee", "min_deliveries": "=contents_delivery_min_per_month"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"contents_code": "=post_cap_contents_hcpcs", "contents_fee": "=post_cap_contents_monthly_fee", "min_deliveries": "=contents_delivery_min_per_month"}
        "Liquid Oxygen System (E0439 + E0434)": {"contents_code": "=post_cap_contents_hcpcs", "contents_fee": "=post_cap_contents_monthly_fee", "min_deliveries": "=contents_delivery_min_per_month"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"contents_code": "=post_cap_contents_hcpcs", "contents_fee": "=post_cap_contents_monthly_fee", "min_deliveries": "=contents_delivery_min_per_month"}
    measures: [oxygen_msr_contents_deliveries_in_month]

  - id: oxygen_suspension_break
    subject: [oxygen_suspend, oxygen_resume, oxygen_period_restart]
    rule: >-
      An inpatient or skilled nursing admission suspends the record with the admission date as
      suspended_date, and no month whose first day falls during the suspension is billed. Oxygen resumes
      in the same payment period only when the patient comes home no later than `break_in_need_days`
      days after the suspension began, counting calendar days from the day after suspended_date, the
      allowance being `break_in_need_days` plus the days remaining in the month in which the suspension
      began. A longer break starts a new payment period on the return-home date with the month count
      back at 1, and needs the class's `new_period_requirements` before billing. Travel is never a
      suspension.
    eligibility:
      - id: oxygen_break_allowance
        applies_to: [oxygen_resume]
        kind: time
        condition: Oxygen resumes in the same payment period only when the patient comes home no later than `break_in_need_days` days after the suspension began, counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the month in which the suspension began.
        evidence_fields: [oxygen_holdings.suspended_date, oxygen_holdings.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_holdings.oxygen_holding_id]
          action_bindings:
            oxygen_holdings.oxygen_holding_id: oxygen_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension began
          anchor_source: oxygen_holdings.suspended_date
          relation: not_after
          duration_source: variants.break_in_need_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the month in which the suspension began
          boundary: inclusive
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "Liquid Oxygen System (E0439 + E0434)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"break_days": "=break_in_need_days", "restart_needs": "=new_period_requirements"}

  - id: oxygen_evt_claim_reversal
    subject: [oxygen_claim_reversal]
    rule: >-
      A recoupment of a paid equipment month is recorded against that one month as original_bill_id,
      one reversal per month named in the payer's letter, and a paid month is reversed at most once. The
      reversed month leaves the paid count, every patient charge stemming from it is removed under the
      coverage charter, and a patient payment already made on it becomes a credit.
    eligibility:
      - id: oxygen_reverse_once
        applies_to: [oxygen_claim_reversal]
        kind: dedup
        condition: a paid month is reversed at most once.
        evidence_fields: [oxygen_billing.original_bill_id, oxygen_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_billing.original_bill_id]
          action_bindings:
            oxygen_billing.original_bill_id: original_bill_id
        dedup_contract:
          table: oxygen_billing
          mode: separate_record
          object_bindings: {original_bill_id: original_bill_id}
          duplicate_filters: {event_type: [oxygen_claim_reversal]}
          distinct_fields: []

  - id: oxygen_service_obligation
    subject: [oxygen_maintenance_visit, oxygen_delivery]
    rule: >-
      Summit Ridge owns oxygen equipment for its whole life and bears every repair: the patient is never
      charged for maintenance, malfunction repair, swaps or power-outage response. The stationary unit
      receives routine maintenance every `routine_maintenance_interval_months` calendar months from
      setup_date; a reported malfunction is answered within `malfunction_response_hours`; a reported
      power outage is answered with backup oxygen within `power_outage_response_hours`. Portable
      cylinders are delivered every `cylinder_refill_cycle_days` days up to `cylinders_per_delivery_max`
      per delivery and liquid reservoirs are refilled every `liquid_refill_cycle_days` days, with no
      charge during the payment period. Equipment is serviced only while it is in the home: the oxygen
      record is rental_active, suspended or payment_cap_reached. When the patient moves outside the
      service area during the furnishing obligation and `relocation_arrangement_required` is true,
      Summit Ridge arranges a successor supplier rather than picking the equipment up.
      Refills cost nothing during the payment period because contents are included there
      (`contents_included_during_cap`). The setup furnishes the class's accessories: a conserving
      device where `oxygen_conserving_device_included` is true, `home_fill_cylinder_count` home-fill
      cylinders, `poc_battery_count` portable-concentrator batteries, pulse-dose delivery only where
      `pulse_dose_capable` is true, and a humidifier bottle when the prescribed flow is above
      `humidifier_bottle_above_lpm`.
    eligibility:
      - id: equipment_in_home
        applies_to: [oxygen_maintenance_visit]
        kind: state
        condition: 'the oxygen record is rental_active, suspended or payment_cap_reached.'
        evidence_fields: [oxygen_holdings.status, oxygen_holdings.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_holdings.oxygen_holding_id]
          action_bindings:
            oxygen_holdings.oxygen_holding_id: oxygen_holding_id
        state_contract:
          field: oxygen_holdings.status
          allowed: [rental_active, suspended, payment_cap_reached]
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"contents_included": "=contents_included_during_cap", "conserver": "=oxygen_conserving_device_included", "fill_cylinders": "=home_fill_cylinder_count", "poc_batteries": "=poc_battery_count", "pulse": "=pulse_dose_capable", "humidifier_lpm": "=humidifier_bottle_above_lpm", "maintenance_months": "=routine_maintenance_interval_months", "malfunction_hours": "=malfunction_response_hours", "outage_hours": "=power_outage_response_hours", "cylinder_cycle": "=cylinder_refill_cycle_days", "cylinders_max": "=cylinders_per_delivery_max", "liquid_cycle": "=liquid_refill_cycle_days"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"contents_included": "=contents_included_during_cap", "conserver": "=oxygen_conserving_device_included", "fill_cylinders": "=home_fill_cylinder_count", "poc_batteries": "=poc_battery_count", "pulse": "=pulse_dose_capable", "humidifier_lpm": "=humidifier_bottle_above_lpm", "maintenance_months": "=routine_maintenance_interval_months", "malfunction_hours": "=malfunction_response_hours", "outage_hours": "=power_outage_response_hours", "cylinder_cycle": "=cylinder_refill_cycle_days", "cylinders_max": "=cylinders_per_delivery_max", "liquid_cycle": "=liquid_refill_cycle_days"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"contents_included": "=contents_included_during_cap", "conserver": "=oxygen_conserving_device_included", "fill_cylinders": "=home_fill_cylinder_count", "poc_batteries": "=poc_battery_count", "pulse": "=pulse_dose_capable", "humidifier_lpm": "=humidifier_bottle_above_lpm", "maintenance_months": "=routine_maintenance_interval_months", "malfunction_hours": "=malfunction_response_hours", "outage_hours": "=power_outage_response_hours", "cylinder_cycle": "=cylinder_refill_cycle_days", "cylinders_max": "=cylinders_per_delivery_max", "liquid_cycle": "=liquid_refill_cycle_days"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"contents_included": "=contents_included_during_cap", "conserver": "=oxygen_conserving_device_included", "fill_cylinders": "=home_fill_cylinder_count", "poc_batteries": "=poc_battery_count", "pulse": "=pulse_dose_capable", "humidifier_lpm": "=humidifier_bottle_above_lpm", "maintenance_months": "=routine_maintenance_interval_months", "malfunction_hours": "=malfunction_response_hours", "outage_hours": "=power_outage_response_hours", "cylinder_cycle": "=cylinder_refill_cycle_days", "cylinders_max": "=cylinders_per_delivery_max", "liquid_cycle": "=liquid_refill_cycle_days"}
        "Liquid Oxygen System (E0439 + E0434)": {"contents_included": "=contents_included_during_cap", "conserver": "=oxygen_conserving_device_included", "fill_cylinders": "=home_fill_cylinder_count", "poc_batteries": "=poc_battery_count", "pulse": "=pulse_dose_capable", "humidifier_lpm": "=humidifier_bottle_above_lpm", "maintenance_months": "=routine_maintenance_interval_months", "malfunction_hours": "=malfunction_response_hours", "outage_hours": "=power_outage_response_hours", "cylinder_cycle": "=cylinder_refill_cycle_days", "cylinders_max": "=cylinders_per_delivery_max", "liquid_cycle": "=liquid_refill_cycle_days"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"contents_included": "=contents_included_during_cap", "conserver": "=oxygen_conserving_device_included", "fill_cylinders": "=home_fill_cylinder_count", "poc_batteries": "=poc_battery_count", "pulse": "=pulse_dose_capable", "humidifier_lpm": "=humidifier_bottle_above_lpm", "maintenance_months": "=routine_maintenance_interval_months", "malfunction_hours": "=malfunction_response_hours", "outage_hours": "=power_outage_response_hours", "cylinder_cycle": "=cylinder_refill_cycle_days", "cylinders_max": "=cylinders_per_delivery_max", "liquid_cycle": "=liquid_refill_cycle_days"}

  - id: oxygen_travel
    subject: [oxygen_delivery]
    rule: >-
      A patient traveling inside the Summit Ridge service area receives a travel_supply delivery of up
      to `travel_extra_supply_days` days of extra portable supply at no charge. For travel outside the
      service area Summit Ridge arranges a partner supplier at the destination on a travel_arrangement
      request received at least `travel_partner_lead_business_days` business days before
      travel_start_date, for a stay of no more than `travel_partner_max_days` days; the partner is paid
      by Summit Ridge and nothing is billed to the patient or the coverage for it. A longer stay is a
      relocation, not travel. Only a class whose `airline_approved` is true may be carried on an
      aircraft; cylinders and liquid never fly. A travel supply is delivered only once a
      travel_arrangement request on this holding is approved.
    eligibility:
      - id: travel_request_approved
        applies_to: [oxygen_delivery]
        kind: authorization
        condition: A travel supply is delivered only once a travel_arrangement request on this holding is approved.
        evidence_fields: [oxygen_requests.request_type, oxygen_requests.request_status, oxygen_requests.travel_start_date, oxygen_requests.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_requests.oxygen_holding_id]
          action_bindings:
            oxygen_requests.oxygen_holding_id: oxygen_holding_id
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"extra_days": "=travel_extra_supply_days", "partner_lead": "=travel_partner_lead_business_days", "partner_max": "=travel_partner_max_days", "airline": "=airline_approved"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"extra_days": "=travel_extra_supply_days", "partner_lead": "=travel_partner_lead_business_days", "partner_max": "=travel_partner_max_days", "airline": "=airline_approved"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"extra_days": "=travel_extra_supply_days", "partner_lead": "=travel_partner_lead_business_days", "partner_max": "=travel_partner_max_days", "airline": "=airline_approved"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"extra_days": "=travel_extra_supply_days", "partner_lead": "=travel_partner_lead_business_days", "partner_max": "=travel_partner_max_days", "airline": "=airline_approved"}
        "Liquid Oxygen System (E0439 + E0434)": {"extra_days": "=travel_extra_supply_days", "partner_lead": "=travel_partner_lead_business_days", "partner_max": "=travel_partner_max_days", "airline": "=airline_approved"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"extra_days": "=travel_extra_supply_days", "partner_lead": "=travel_partner_lead_business_days", "partner_max": "=travel_partner_max_days", "airline": "=airline_approved"}

  - id: oxygen_return_pickup
    subject: [oxygen_return, oxygen_pickup, oxygen_order_cancel]
    rule: >-
      A patient may decline oxygen before delivery at no charge. Equipment is returned only at the
      patient's own confirmation of a return_pickup request: oxygen equipment is returned only after a
      return_pickup request on this holding is approved. Pickup is made within
      `pickup_lead_business_days` business days of the confirmation, and billing stops with the last
      month that began before the return. Equipment recovered damaged beyond normal wear is charged
      `damage_fee_beyond_wear`; each cylinder not recovered is charged `lost_cylinder_charge_each`; a
      stationary system still not recovered `unreturned_equipment_days` days after the confirmed pickup
      date is charged `unreturned_equipment_charge`. A charge is removed when the item is later
      recovered. A return because the patient died is never charged for damage or missing items.
    eligibility:
      - id: oxygen_return_confirmed
        applies_to: [oxygen_return]
        kind: authorization
        condition: oxygen equipment is returned only after a return_pickup request on this holding is approved.
        evidence_fields: [oxygen_requests.request_type, oxygen_requests.request_status, oxygen_requests.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_requests.oxygen_holding_id]
          action_bindings:
            oxygen_requests.oxygen_holding_id: oxygen_holding_id
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "cylinder_charge": "=lost_cylinder_charge_each", "damage_fee": "=damage_fee_beyond_wear"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "cylinder_charge": "=lost_cylinder_charge_each", "damage_fee": "=damage_fee_beyond_wear"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "cylinder_charge": "=lost_cylinder_charge_each", "damage_fee": "=damage_fee_beyond_wear"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "cylinder_charge": "=lost_cylinder_charge_each", "damage_fee": "=damage_fee_beyond_wear"}
        "Liquid Oxygen System (E0439 + E0434)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "cylinder_charge": "=lost_cylinder_charge_each", "damage_fee": "=damage_fee_beyond_wear"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"pickup_days": "=pickup_lead_business_days", "unreturned_days": "=unreturned_equipment_days", "unreturned_charge": "=unreturned_equipment_charge", "cylinder_charge": "=lost_cylinder_charge_each", "damage_fee": "=damage_fee_beyond_wear"}

  - id: oxygen_lifetime
    subject: [oxygen_lifetime_end, oxygen_order_create]
    rule: >-
      When the coverage class's oxygen_useful_lifetime_months have elapsed from the first day of the
      first paid month of the period, the patient may elect new equipment on a replacement_election
      request; the election closes the record as lifetime_ended and opens a new oxygen record with a new
      payment period and a new cap. The useful lifetime is complete only after the coverage class's oxygen_useful_lifetime_months have elapsed since the first paid month of the period began, counting calendar months from rental_period_start_date with month-end fallback to the last day of a shorter month and the boundary day included. Without
      an election the existing equipment stays in the home and is furnished without equipment payment.
      No election is accepted before the lifetime is complete, whatever the equipment's age or condition.
    eligibility:
      - id: lifetime_complete
        applies_to: [oxygen_lifetime_end]
        kind: time
        condition: The useful lifetime is complete only after the coverage class's oxygen_useful_lifetime_months have elapsed since the first paid month of the period began, counting calendar months from rental_period_start_date with month-end fallback to the last day of a shorter month and the boundary day included.
        evidence_fields: [oxygen_holdings.rental_period_start_date, oxygen_holdings.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_holdings.oxygen_holding_id]
          action_bindings:
            oxygen_holdings.oxygen_holding_id: oxygen_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the first paid month of the period began
          anchor_source: oxygen_holdings.rental_period_start_date
          relation: not_before
          duration_source: params.useful_lifetime_reference
          unit: calendar_months
          counting_rule: counting calendar months from rental_period_start_date with month-end fallback to the last day of a shorter month and the boundary day included
          boundary: inclusive
    params:
      useful_lifetime_reference: coverage.oxygen_useful_lifetime_months

  - id: oxygen_group_ii_retest
    subject: [oxygen_retest_received, oxygen_rental_paid]
    rule: >-
      A group II patient's repeat test supports payment from month 4 only when its retest_date falls
      between therapy days `group_ii_retest_earliest_day` and `group_ii_retest_latest_day` (setup_date
      being day 1) and its retest_spo2 is at or below `qualifying_spo2_group_ii`. Month 4 and later of a
      group II patient are paid only when an oxygen_retest_received on this holding meets that test. A
      group I patient needs no repeat test. A repeat test after the window supports payment only from the
      month that begins after the retest_date.
    eligibility:
      - id: retest_on_file
        applies_to: [oxygen_rental_paid]
        kind: authorization
        condition: Month 4 and later of a group II patient are paid only when an oxygen_retest_received on this holding meets that test.
        evidence_fields: [oxygen_service.retest_date, oxygen_service.retest_spo2, oxygen_service.oxygen_holding_id, oxygen_holdings.qualifying_group]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_service.oxygen_holding_id]
          action_bindings:
            oxygen_service.oxygen_holding_id: oxygen_holding_id
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day", "spo2_group_ii": "=qualifying_spo2_group_ii"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day", "spo2_group_ii": "=qualifying_spo2_group_ii"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day", "spo2_group_ii": "=qualifying_spo2_group_ii"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day", "spo2_group_ii": "=qualifying_spo2_group_ii"}
        "Liquid Oxygen System (E0439 + E0434)": {"retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day", "spo2_group_ii": "=qualifying_spo2_group_ii"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"retest_from": "=group_ii_retest_earliest_day", "retest_to": "=group_ii_retest_latest_day", "spo2_group_ii": "=qualifying_spo2_group_ii"}

  - id: oxygen_change_orders
    subject: [oxygen_system_change, oxygen_rx_update]
    rule: >-
      A change of flow, usage pattern or system class is made only on a new written order where
      `rx_change_requires_new_order` is true, never on the patient's request alone. A change of system
      class keeps the same payment period and paid-month count; it is made only after a system_change
      request on this holding is approved, and the new class's portable add-on is billable only when its
      own mobility rule is met. A prescribed flow above the class's `max_flow_lpm` needs a class that
      delivers it. No extra charge to the patient arises from a change of class.
    eligibility:
      - id: system_change_approved
        applies_to: [oxygen_system_change]
        kind: authorization
        condition: it is made only after a system_change request on this holding is approved
        evidence_fields: [oxygen_requests.request_type, oxygen_requests.request_status, oxygen_requests.oxygen_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_requests.oxygen_holding_id]
          action_bindings:
            oxygen_requests.oxygen_holding_id: oxygen_holding_id
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"new_order": "=rx_change_requires_new_order", "max_flow": "=max_flow_lpm", "rx_months": "=rx_validity_months"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"new_order": "=rx_change_requires_new_order", "max_flow": "=max_flow_lpm", "rx_months": "=rx_validity_months"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"new_order": "=rx_change_requires_new_order", "max_flow": "=max_flow_lpm", "rx_months": "=rx_validity_months"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"new_order": "=rx_change_requires_new_order", "max_flow": "=max_flow_lpm", "rx_months": "=rx_validity_months"}
        "Liquid Oxygen System (E0439 + E0434)": {"new_order": "=rx_change_requires_new_order", "max_flow": "=max_flow_lpm", "rx_months": "=rx_validity_months"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"new_order": "=rx_change_requires_new_order", "max_flow": "=max_flow_lpm", "rx_months": "=rx_validity_months"}

  - id: oxygen_payer_transition
    subject: [oxygen_payer_update]
    rule: >-
      When a different primary coverage starts paying, a new payment period begins under it on the
      first date of service it covers and months paid under the earlier coverage do not count toward
      the new cap; the new coverage pays only when the class's `payer_entry_requalification` is met by a
      qualifying test within the lookback before the change. The oxygen moves to the new coverage only
      once that coverage is verified: the new coverage record is in status active.
    eligibility:
      - id: oxygen_new_coverage_verified
        applies_to: [oxygen_payer_update]
        kind: state
        condition: the new coverage record is in status active.
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active]
    params:
      per_tier:
        "Stationary Concentrator Oxygen (E1390)": {"requalification": "=payer_entry_requalification"}
        "Concentrator with Portable Cylinders (E1390 + E0431)": {"requalification": "=payer_entry_requalification"}
        "Concentrator with Home Fill System (E1390 + K0738)": {"requalification": "=payer_entry_requalification"}
        "Concentrator with Portable Oxygen Concentrator (E1390 + E1392)": {"requalification": "=payer_entry_requalification"}
        "Liquid Oxygen System (E0439 + E0434)": {"requalification": "=payer_entry_requalification"}
        "High-Flow Concentrator with Portable Cylinders (E1390 + E0431)": {"requalification": "=payer_entry_requalification"}

  - id: oxygen_appeal
    subject: [oxygen_rental_denied]
    rule: >-
      A denied equipment month may be appealed through a redetermination_appeal request naming it as
      related_bill_id. The appeal is filed no later than the coverage class's
      redetermination_window_days after the denial is received, counting calendar days from the day
      after the denied line's adjudication_date with the boundary day included. A denial for cap_reached
      or inpatient_stay is not appealed; a retest_missing or mobility_not_documented denial is appealed
      only when the proof was on file before the denial.
    eligibility:
      - id: oxygen_appeal_window
        applies_to: [oxygen_rental_denied]
        kind: time
        condition: The appeal is filed no later than the coverage class's redetermination_window_days after the denial is received, counting calendar days from the day after the denied line's adjudication_date with the boundary day included.
        evidence_fields: [oxygen_billing.adjudication_date, oxygen_billing.oxygen_bill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [oxygen_billing.oxygen_bill_id]
          action_bindings:
            oxygen_billing.oxygen_bill_id: related_bill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the denial is received
          anchor_source: oxygen_billing.adjudication_date
          relation: not_after
          duration_source: params.appeal_window_days_reference
          unit: calendar_days
          counting_rule: counting calendar days from the day after the denied line's adjudication_date with the boundary day included
          boundary: inclusive
    params:
      appeal_window_days_reference: coverage.redetermination_window_days

# ============================================================================
# extended_policies: the multi-factor calculation policies of the home_oxygen_service difficulty
# ============================================================================
extended_policies:
- id: oxygen_ext_setup_start_day
  base_policy_refs:
  - oxygen_qualification
  overwrite:
  - base_policy: oxygen_qualification
    superseded_clause: >-
      Oxygen is set up only when the coverage's last eligibility check is within that coverage class's eligibility_reverify_days
      before the setup date.
    replaced_by: >-
      For a setup this policy governs, and only for such a setup, the eligibility check that counts is the most
      recent eligibility check on the coverage's eligibility history dated on or before the setup day, and oxygen
      is set up only when that check is within that coverage class's eligibility_reverify_days before the setup
      day; every other setup remains under the base eligibility test.
  trigger: state_due
  subject:
  - oxygen_setup_complete
  computes: setup_date
  target_tool: record_oxygen_setup_e2e7878b
  params:
    contracted_predelivery_days: 2
    other_predelivery_days: 1
    reach_medicare_days: 365
    reach_standard_days: 180
    reach_short_days: 90
    discharge_lead_days: 1
    facility_lead_days: 2
  rule: >-
    A home oxygen system that has been delivered while its oxygen record still shows the order as awaiting setup
    is recorded as set up on a setup day worked out as follows. The setup day is the date of the initial-setup delivery
    in the patient's oxygen service history. The setup day is recorded as both the setup date and the first day
    of the payment period, and it is written as YYYY-MM-DD. A system delivered for training before the patient came
    home from a facility starts instead on the patient's first day at home: when the order came from a hospital
    discharge and at least one backup-cylinder delivery is on record later than the initial-setup delivery, the
    first day at home is the date of the most recent backup-cylinder delivery; otherwise, when the order came from
    a skilled nursing facility and at least one cylinder refill is on record later than the initial-setup delivery,
    the first day at home is the date of the most recent cylinder refill; otherwise the first day at home is the
    initial-setup delivery date itself. The first day at home replaces the initial-setup delivery date only when
    all three of the following conditions hold, each counted in calendar days as the later date minus the earlier
    date; when any of them fails, the setup day stays the initial-setup delivery date. The training-delivery allowance:
    the initial-setup delivery came no more than `contracted_predelivery_days` days before the first day at home
    for an order from a hospital discharge or a skilled nursing facility when the coverage named on the oxygen record
    is Original Medicare Part B, Medicare Supplement Plan G, Medicare Advantage PPO, Medicare Advantage HMO, Commercial
    PPO or Commercial HMO, no more than `other_predelivery_days` days before it for an order from a hospital discharge
    or a skilled nursing facility under any other coverage class, and 0 days before it for any other order. The
    back-dating reach: the first day at home is no more than `reach_medicare_days` days before the day the setup
    is recorded when the coverage named on the oxygen record is Original Medicare Part B or Medicare Supplement
    Plan G, no more than `reach_standard_days` days when it is Commercial PPO, Commercial HMO, Medicare Advantage
    PPO or Medicare Advantage HMO, and no more than `reach_short_days` days for any other coverage class. The order-to-delivery
    lead: the initial-setup delivery came no more than `discharge_lead_days` days after the written order was received
    for an order from a hospital discharge, no more than `facility_lead_days` days after it for an order from a
    skilled nursing facility, and 0 days after it for any other order. The setup day worked out under this policy
    is the only setup date and payment-period start recorded for such a system; the date of the initial-setup delivery
    is carried as the setup date only when this policy keeps the setup day on that delivery. For a setup this policy
    governs, and only for such a setup, the eligibility check that counts is the most recent eligibility check on
    the coverage's eligibility history dated on or before the setup day, and oxygen is set up only when that check
    is within that coverage class's eligibility_reverify_days before the setup day; every other setup remains under
    the base eligibility test.
  prerequisite: []
  cross_category:
  - category: coverage
    as: branch
    reads:
    - variant_name
    note: the coverage class sets the back-dating reach and the training-delivery allowance
  compute:
  - setup_day: >-
      LATEST('oxygen_service','service_date', date_field='service_date', event_type='oxygen_delivery', delivery_purpose='initial_setup')
  - home_day: >-
      LATEST('oxygen_service','service_date', date_field='service_date', event_type='oxygen_delivery', delivery_purpose='backup_cylinders')
      or ''
  - refill_day: >-
      LATEST('oxygen_service','service_date', date_field='service_date', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
      or ''
  - at_home_day: >-
      home_day if (F('referral_source') == 'hospital_discharge' and COUNT('oxygen_service', event_type='oxygen_delivery',
      delivery_purpose='backup_cylinders') > 0 and home_day > setup_day) else (refill_day if (F('referral_source')
      == 'skilled_nursing_facility' and COUNT('oxygen_service', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
      > 0 and refill_day > setup_day) else setup_day)
  - training_payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - predelivery_days: >-
      K('contracted_predelivery_days') if ((F('referral_source') == 'hospital_discharge' or F('referral_source')
      == 'skilled_nursing_facility') and (training_payer_class == 'Original Medicare Part B' or training_payer_class
      == 'Medicare Supplement Plan G' or training_payer_class == 'Medicare Advantage PPO' or training_payer_class
      == 'Medicare Advantage HMO' or training_payer_class == 'Commercial PPO' or training_payer_class == 'Commercial
      HMO')) else (K('other_predelivery_days') if (F('referral_source') == 'hospital_discharge' or F('referral_source')
      == 'skilled_nursing_facility') else 0)
  - payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - setup_reach_days: >-
      K('reach_medicare_days') if (payer_class == 'Original Medicare Part B' or payer_class == 'Medicare Supplement
      Plan G') else (K('reach_standard_days') if (payer_class == 'Commercial PPO' or payer_class == 'Commercial
      HMO' or payer_class == 'Medicare Advantage PPO' or payer_class == 'Medicare Advantage HMO') else K('reach_short_days'))
