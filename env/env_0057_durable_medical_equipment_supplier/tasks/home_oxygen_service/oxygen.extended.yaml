- id: oxygen_ext_paid_in_full_equipment_month
  base_policy_refs:
  - oxygen_evt_monthly_billing
  - oxygen_payment_cap
  - oxygen_group_ii_retest
  overwrite:
  - base_policy: oxygen_evt_monthly_billing
    superseded_clause: >-
      The month's fee is `stationary_monthly_fee`, adjusted for the prescribed flow in force on the month's first
      day: above `high_flow_threshold_lpm` the stationary fee rises by `high_flow_uplift_pct` percent
    replaced_by: >-
      For an equipment month this policy governs, and only for such a month, the month's fee is worked out by the
      flow combination and the percentage steps below in place of the stationary fee and its flow adjustment; every
      other equipment month remains under the base monthly billing rule for its fee.
  - base_policy: oxygen_evt_monthly_billing
    superseded_clause: >-
      The allowed amount is the fee times the coverage class's allowed_pct_of_fee_schedule divided by 100, rounded
      to the cent half up.
    replaced_by: >-
      For such a month, and only for such a month, the allowed amount is the amount the last step below produces,
      rounded once to the cent half up, in place of the fee times the allowed percentage; every other equipment
      month remains under the base monthly billing rule for its allowed amount.
  trigger: state_due
  subject:
  - oxygen_rental_paid
  computes: allowed_amount
  target_tool: record_oxygen_equipment_payment_51bbc3fc
  params:
    sleep_only_pct: 60
    exertion_only_pct: 50
    exertion_and_sleep_pct: 80
    commercial_high_flow_pct: 93
    medicaid_high_flow_pct: 87
    opening_month_pct: 110
    long_rental_pct: 90
    hospital_training_pct: 105
    facility_training_pct: 103
    rented_pap_pct: 97
    rented_pap_min_months: 3
    owned_pap_pct: 99
  rule: >-
    An equipment month that the coverage paid in full, leaving no patient share because the plan's out-of-pocket
    maximum was already met, is posted with an allowed amount worked out as follows. An equipment month is posted
    as paid only after the oxygen record shows the system set up, with its setup date and an active rental. For
    an equipment month this policy governs, and only for such a month, the month's fee is worked out by the flow
    combination and the percentage steps below in place of the stationary fee and its flow adjustment; every other
    equipment month remains under the base monthly billing rule for its fee. For such a month, and only for such
    a month, the allowed amount is the amount the last step below produces, rounded once to the cent half up, in
    place of the fee times the allowed percentage; every other equipment month remains under the base monthly billing
    rule for its allowed amount. The standard month's fee is the class's `stationary_monthly_fee`. The standard
    allowed amount is the month's fee times the coverage class's allowed_pct_of_fee_schedule divided by 100, rounded
    once to the cent half up. Flow combination: portable equipment is billable when the class carries a portable
    add-on, mobility within the home is documented on the oxygen record, the order is not for sleep only, and at
    least one backup-cylinder delivery or cylinder refill is on the oxygen service record; when the prescribed flow
    on the oxygen record is above the class's `high_flow_threshold_lpm` and portable equipment is billable, the
    month's fee is the higher of the class's stationary fee raised by the class's `high_flow_uplift_pct` percent
    and the stationary fee plus the class's `portable_addon_monthly_fee`, so the add-on is never paid on top of
    the raised fee; when the flow is above that threshold and no portable equipment is billable, the month's fee
    is the stationary fee raised by the class's `high_flow_uplift_pct` percent; when the flow is below the class's
    `low_flow_threshold_lpm`, it is the stationary fee reduced by the class's `low_flow_reduction_pct` percent,
    plus the portable add-on when portable equipment is billable; when the flow is neither above the high-flow threshold
    nor below the low-flow threshold and portable equipment is billable, it is the stationary fee plus the portable
    add-on; otherwise it is the stationary fee. Usage share: the month's fee is then multiplied by the share of
    the day the order uses oxygen: by `sleep_only_pct` percent for an order for sleep only, by `exertion_only_pct`
    percent for an order for exertion only with at least one cylinder refill on record, by `exertion_and_sleep_pct`
    percent for an order for exertion and sleep with at least one cylinder refill on record, and by 100 percent
    for any other order. Payer high-flow rate: the result is next multiplied by `commercial_high_flow_pct` percent
    when the prescribed flow on the oxygen record is above the class's `high_flow_threshold_lpm` and the coverage
    named on the oxygen record is Commercial PPO or Commercial HMO, by `medicaid_high_flow_pct` percent when that
    flow is above that threshold and the coverage is Medicaid Fee-for-Service, and by 100 percent otherwise. Rental
    position: the result is next multiplied by `opening_month_pct` percent when no equipment month has been paid
    yet under the coverage on the oxygen record (paid months less reversed months), by `long_rental_pct` percent
    when 12 or more have been paid, and by 100 percent otherwise. Discharge training: the result is next multiplied
    by `hospital_training_pct` percent when the initial-setup delivery came before the setup date on the oxygen
    record and the order came from a hospital discharge, by `facility_training_pct` percent when it came before
    the setup date and the order came from a skilled nursing facility, and by 100 percent otherwise. Multi-rental:
    the result is next multiplied by `rented_pap_pct` percent when the patient's PAP device record names the same
    coverage, carries no ownership date, has fewer than 13 PAP rental months paid and began its payment period at
    least `rented_pap_min_months` whole calendar months before the posting date; by `owned_pap_pct` percent when
    the PAP device record carries an ownership date or 13 or more PAP rental months have been paid; and by 100 percent
    otherwise. Last, the result is multiplied by the coverage class's allowed_pct_of_fee_schedule divided by 100;
    each percentage acts on the amount the step before it produced, in the order stated, and nothing is rounded
    until the allowed amount is rounded once to the cent half up.
  prerequisite:
  - problem: oxygen_ext_setup_start_day
    kind: value_input
    gate: training_rate_pct
    form: state
    policy_source: >-
      An equipment month is posted as paid only after the oxygen record shows the system set up, with its setup
      date and an active rental.
    condition: >-
      oxygen_holdings.status is rental_active and oxygen_holdings.setup_date is filled in for the oxygen record
    resolved_by: record_oxygen_setup_e2e7878b
    effect: >-
      the setup date written on the record decides whether the initial-setup delivery came before it, which sets
      the discharge-training percentage of the month
  cross_category:
  - category: coverage
    as: branch
    reads:
    - variant_name
    - allowed_pct_of_fee_schedule
    note: the coverage class sets the payer high-flow rate and the allowed percentage
  - category: pap
    as: history
    reads:
    - coverage_id
    - ownership_date
    - rental_period_start_date
    - pap_billing.event_type
    note: the PAP device record and its paid rental months set the multi-rental percentage
  compute:
  - stationary_fee: P('stationary_monthly_fee')
  - awake_use_deliveries: COUNT('oxygen_service', event_type='oxygen_delivery', delivery_purpose='cylinder_refill')
  - usage_rate_pct: >-
      K('sleep_only_pct') if F('usage_pattern') == 'sleep_only' else (K('exertion_only_pct') if (F('usage_pattern')
      == 'exertion_only' and awake_use_deliveries > 0) else (K('exertion_and_sleep_pct') if (F('usage_pattern')
      == 'exertion_and_sleep' and awake_use_deliveries > 0) else 100))
  - portable_billable: >-
      P('portable_addon_monthly_fee') > 0 and F('mobile_in_home') == True and F('usage_pattern') != 'sleep_only'
      and (COUNT('oxygen_service', event_type='oxygen_delivery', delivery_purpose='backup_cylinders') + COUNT('oxygen_service',
      event_type='oxygen_delivery', delivery_purpose='cylinder_refill')) > 0
  - month_equipment_fee: >-
      MX(stationary_fee * (100 + P('high_flow_uplift_pct')) / 100, stationary_fee + P('portable_addon_monthly_fee'))
      if (F('prescribed_lpm') > P('high_flow_threshold_lpm') and portable_billable) else (stationary_fee * (100
      + P('high_flow_uplift_pct')) / 100 if F('prescribed_lpm') > P('high_flow_threshold_lpm') else (stationary_fee
      * (100 - P('low_flow_reduction_pct')) / 100 + (P('portable_addon_monthly_fee') if portable_billable else 0)
      if F('prescribed_lpm') < P('low_flow_threshold_lpm') else (stationary_fee + P('portable_addon_monthly_fee')
      if portable_billable else stationary_fee)))
  - payer_class: CFIELD('coverage','variant_name', coverage_id=F('coverage_id'))
  - payer_flow_pct: >-
      K('commercial_high_flow_pct') if (F('prescribed_lpm') > P('high_flow_threshold_lpm') and (payer_class == 'Commercial
      PPO' or payer_class == 'Commercial HMO')) else (K('medicaid_high_flow_pct') if (F('prescribed_lpm') > P('high_flow_threshold_lpm')
      and payer_class == 'Medicaid Fee-for-Service') else 100)
  - paid_months_before: >-
      COUNT('oxygen_billing', event_type='oxygen_rental_paid', coverage_id=F('coverage_id')) - COUNT('oxygen_billing',
      event_type='oxygen_claim_reversal', coverage_id=F('coverage_id'))
  - rental_position_pct: >-
      K('opening_month_pct') if paid_months_before == 0 else (K('long_rental_pct') if paid_months_before >= 12 else
      100)
  - initial_delivery_day: >-
      LATEST('oxygen_service','service_date', date_field='service_date', event_type='oxygen_delivery', delivery_purpose='initial_setup')
  - training_rate_pct: >-
      K('hospital_training_pct') if (DAYS(initial_delivery_day, F('setup_date')) > 0 and F('referral_source') ==
      'hospital_discharge') else (K('facility_training_pct') if (DAYS(initial_delivery_day, F('setup_date')) > 0
      and F('referral_source') == 'skilled_nursing_facility') else 100)
  - pap_on_same_plan: >-
      CFIELD('pap','coverage_id') == F('coverage_id') and (CFIELD('pap','ownership_date') or '') == ''
  - pap_rented_months: MONTHS(CFIELD('pap','rental_period_start_date') or NOW, NOW)
  - pap_paid_months: XCOUNT('pap','pap_billing', event_type='pap_rental_paid')
  - multi_rental_pct: >-
      K('rented_pap_pct') if (pap_on_same_plan and pap_paid_months < 13 and pap_rented_months >= K('rented_pap_min_months'))
      else (K('owned_pap_pct') if ((CFIELD('pap','ownership_date') or '') != '' or pap_paid_months >= 13) else 100)
  - plan_allowed_pct: CPARAM('coverage','allowed_pct_of_fee_schedule', coverage_id=F('coverage_id'))
  - result: >-
      RND(month_equipment_fee * usage_rate_pct / 100 * payer_flow_pct / 100 * rental_position_pct / 100 * training_rate_pct
      / 100 * multi_rental_pct / 100 * plan_allowed_pct / 100, 2)
  compute_basis:
    stationary_fee: The standard month's fee is the class's `stationary_monthly_fee`.
    awake_use_deliveries: >-
      Usage share: the month's fee is then multiplied by the share of the day the order uses oxygen: by `sleep_only_pct`
      percent for an order for sleep only, by `exertion_only_pct` percent for an order for exertion only with at
      least one cylinder refill on record, by `exertion_and_sleep_pct` percent for an order for exertion and sleep
      with at least one cylinder refill on record, and by 100 percent for any other order.
    usage_rate_pct: >-
      Usage share: the month's fee is then multiplied by the share of the day the order uses oxygen: by `sleep_only_pct`
      percent for an order for sleep only, by `exertion_only_pct` percent for an order for exertion only with at
      least one cylinder refill on record, by `exertion_and_sleep_pct` percent for an order for exertion and sleep
      with at least one cylinder refill on record, and by 100 percent for any other order.
    portable_billable: >-
      Flow combination: portable equipment is billable when the class carries a portable add-on, mobility within
      the home is documented on the oxygen record, the order is not for sleep only, and at least one backup-cylinder
      delivery or cylinder refill is on the oxygen service record; when the prescribed flow on the oxygen record
      is above the class's `high_flow_threshold_lpm` and portable equipment is billable, the month's fee is the
      higher of the class's stationary fee raised by the class's `high_flow_uplift_pct` percent and the stationary
      fee plus the class's `portable_addon_monthly_fee`, so the add-on is never paid on top of the raised fee; when
      the flow is above that threshold and no portable equipment is billable, the month's fee is the stationary
      fee raised by the class's `high_flow_uplift_pct` percent; when the flow is below the class's `low_flow_threshold_lpm`,
      it is the stationary fee reduced by the class's `low_flow_reduction_pct` percent, plus the portable add-on
      when portable equipment is billable; when the flow is neither above the high-flow threshold nor below the
      low-flow threshold and portable equipment is billable, it is the stationary fee plus the portable add-on;
      otherwise it is the stationary fee.
    month_equipment_fee: >-
      Flow combination: portable equipment is billable when the class carries a portable add-on, mobility within
      the home is documented on the oxygen record, the order is not for sleep only, and at least one backup-cylinder
      delivery or cylinder refill is on the oxygen service record; when the prescribed flow on the oxygen record
      is above the class's `high_flow_threshold_lpm` and portable equipment is billable, the month's fee is the
      higher of the class's stationary fee raised by the class's `high_flow_uplift_pct` percent and the stationary
      fee plus the class's `portable_addon_monthly_fee`, so the add-on is never paid on top of the raised fee; when
      the flow is above that threshold and no portable equipment is billable, the month's fee is the stationary
