    evidence:
    - history
    cross_difficulty: null
  - id: cash_period_rule
    effect: method
    decides: cash_rule
    bindings:
    - cash_any
    - alt_tubing_cash
    - cash_rule
    ladder:
    - when: the enrollment shows a self-pay line for an item of the recorded equipment
      method: each such item's latest self-pay line counts toward its supply at its covered-through date
    - when: the enrollment shows no self-pay line for an item of the recorded equipment but shows one for the tubing
        type not in use
      method: that line counts toward the supply of the tubing in use
    - when: otherwise
      method: self-pay lines do not count toward an item's supply
    baseline:
      cash_rule: '''none'''
    evidence:
    - history
    cross_difficulty: null
  - id: answering_lead
    effect: parameter
    decides: lead_answering
    bindings:
    - confirms_6
    - declines_6
    - lead_answering
    ladder:
    - when: four or more refill confirmations and no refill decline in the last 6 months
      value: K('lead_steady_days') (5 days)
    - when: two or more refill confirmations and exactly one refill decline in the last 6 months
      value: K('lead_mixed_days') (3 days)
    - when: otherwise
      value: 0 days
    baseline:
      lead_answering: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: proof_recency_lead
    effect: parameter
    decides: lead_proof
    bindings:
    - proof_age_days
    - lead_proof
    ladder:
    - when: the enrollment's continued-use date is no more than 30 days old
      value: K('lead_fresh_proof_days') (5 days)
    - when: the continued-use date is older than 30 days but less than 6 months old
      value: K('lead_recent_proof_days') (2 days)
    - when: otherwise
      value: 0 days
    baseline:
      lead_proof: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: tenure_lead
    effect: parameter
    decides: lead_tenure
    bindings:
    - enrolled_months
    - lead_tenure
    ladder:
    - when: the patient has been enrolled 60 or more months
      value: K('lead_long_days') (4 days)
    - when: the patient has been enrolled 24 to 59 months
      value: K('lead_mid_days') (2 days)
    - when: otherwise
      value: 0 days
    baseline:
      lead_tenure: '0'
    evidence:
    - date
    cross_difficulty: null
  inputs:
    history:
    - table: resupply_shipments
      aggregate: latest
      field: covers_through_date
      filters:
        event_type: resupply_item_shipped
    - table: resupply_contacts
      aggregate: count
      field: contact_date
      within_months: 6
      filters:
        event_type: resupply_refill_confirmed
    cross_category: []
- id: resupply_ext_recorded_style_from_use
  base_policy_refs:
  - resupply_item_compatibility
  - resupply_order_continuity
  overwrite: []
  trigger: state_due
  subject:
  - resupply_preference_update
  computes: mask_style
  target_tool: update_mask_style_bfa4256b
  params:
    span_wide_months: 3
    span_mid_months: 2
    span_std_months: 1
    wide_branch_lines: 4
    mid_branch_lines: 2
    lines_with_interface: 2
    lines_interface_earlier: 3
    lines_std: 4
  rule: 'The interface style recorded on a supply enrollment follows the cushion item the patient actually uses,
    read from the enrollment''s own interface and cushion lines, and the record is changed to the style that evidence
    establishes. The standard method reads every interface and cushion line on the enrollment shipped in the last
    month: the cushion item of the newest such line is the candidate, and the recorded style changes to the candidate''s
    style only when four or more such lines of the candidate item were shipped in that span; otherwise the recorded
    style stays. A full face cushion (A7031) belongs to the full_face style, a nasal cushion (A7032) to the nasal
    style and a pair of nasal pillows (A7033) to the nasal_pillows style. Which lines count as evidence of the style
    in use: when the enrollment shows self-pay lines collected at a branch, those lines and any no-charge mask_fit_exchange
    lines count and no other line does, the standing-order lines that the enrollment ships to the recorded style
    included; when it shows no branch-collected lines but shows no-charge mask_fit_exchange lines, only those exchange
    lines count; otherwise every interface and cushion line counts, shipped lines and no-charge lines of any reason
    alike. The span read back from the handling day is three calendar months for a patient who collected four or
    more self-pay lines at a branch in the last 6 months, two calendar months for one who collected two or three,
    and otherwise one calendar month. The candidate is chosen as follows: when two or more cushion items have counted
    lines in the span, the item with the most counted lines is the candidate and a tie goes to the item whose newest
    counted line is newer; when the counted lines in the span are all of one cushion item, that item is the candidate;
    otherwise the cushion item of the newest counted line is the candidate. The counted lines of the candidate item
    needed to change the record are two when the patient also collected the interface that goes with the candidate''s
    style (a nasal interface A7034 for nasal or nasal_pillows, a full face mask A7030 for full_face) within the
    span, three when that interface was collected only before the span, and otherwise four. A style taken from the
    patient''s own words alone is never recorded without the enrollment''s lines.'
  baseline:
    rule: 'The standard method reads every interface and cushion line on the enrollment shipped in the last month:
      the cushion item of the newest such line is the candidate, and the recorded style changes to the candidate''s
      style only when four or more such lines of the candidate item were shipped in that span; otherwise the recorded
      style stays. A full face cushion (A7031) belongs to the full_face style, a nasal cushion (A7032) to the nasal
      style and a pair of nasal pillows (A7033) to the nasal_pillows style.'
    params:
    - span_std_months
    - lines_std
  prerequisite: []
  cross_category: []
  compute:
  - branch_6: COUNT('resupply_shipments', within_months=6, date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='branch_pickup')
  - fit_any: COUNT('resupply_shipments', event_type='resupply_no_charge_replacement', replacement_reason='mask_fit_exchange')
  - branch_any: COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay', shipping_method='branch_pickup')
  - evidence_mode: '''branch'' if branch_any > 0 else (''fit'' if fit_any > 0 else ''all'')'
  - span_months: K('span_wide_months') if branch_6 >= K('wide_branch_lines') else (K('span_mid_months') if (branch_6
      >= K('mid_branch_lines') and branch_6 < K('wide_branch_lines')) else K('span_std_months'))
  - br_a7031: COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='branch_pickup', hcpcs_code='A7031')
  - fx_a7031: COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date', event_type='resupply_no_charge_replacement',
      replacement_reason='mask_fit_exchange', hcpcs_code='A7031')
  - al_a7031: COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date', event_type='resupply_item_shipped',
      hcpcs_code='A7031') + COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date',
      event_type='resupply_no_charge_replacement', hcpcs_code='A7031')
  - n_a7031: (br_a7031 + fx_a7031) if evidence_mode == 'branch' else (fx_a7031 if evidence_mode == 'fit' else al_a7031)
  - br_a7032: COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date', event_type='resupply_item_shipped',
