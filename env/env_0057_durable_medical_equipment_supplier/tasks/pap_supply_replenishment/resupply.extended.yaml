      by three and rounding it up to a whole unit; otherwise they are the latest standing-order line''s units per
      month, its units divided by the whole months it covered.'
    rate: 'The units per month are worked out as follows: when the cushion item of the recorded style differs from
      the item of the latest standing-order cushion line, they are the units of the recorded style''s item the patient
      collected at a branch in the last 3 calendar months divided by three, rounded up to a whole unit; when the
      item is the same and the patient also collected units of it at a branch in the last 3 calendar months, they
      are the latest standing-order line''s units per month plus the result of dividing those branch units by three
      and rounding it up to a whole unit; otherwise they are the latest standing-order line''s units per month,
      its units divided by the whole months it covered.'
    sub_months: The months a standing-order line covers are one for a subscription opened less than 12 months ago,
      two for one opened 12 to 23 months ago, and otherwise the schedule's maximum months per shipment.
    span: The months a standing-order line covers are one for a subscription opened less than 12 months ago, two
      for one opened 12 to 23 months ago, and otherwise the schedule's maximum months per shipment.
    order_left: A line never covers months past the supply order's validity, counted as the order's validity months
      less the whole months since the order date, less one for the month in progress.
    months: A line never covers months past the supply order's validity, counted as the order's validity months
      less the whole months since the order date, less one for the month in progress.
    std_units_12: 'Months the standing order missed are made up on the line: the standing-order months missed in
      the last 12 months are 12 less the months that the standing-order lines of the latest standing-order item
      shipped in that span cover at that line''s units per month, the difference rounded down to a whole month and
      never below zero; when two or more were missed, two months of units are added; when exactly one was missed,
      one month of units is added; otherwise nothing is added.'
    missed: 'Months the standing order missed are made up on the line: the standing-order months missed in the last
      12 months are 12 less the months that the standing-order lines of the latest standing-order item shipped in
      that span cover at that line''s units per month, the difference rounded down to a whole month and never below
      zero; when two or more were missed, two months of units are added; when exactly one was missed, one month
      of units is added; otherwise nothing is added.'
    made_up: 'Months the standing order missed are made up on the line: the standing-order months missed in the
      last 12 months are 12 less the months that the standing-order lines of the latest standing-order item shipped
      in that span cover at that line''s units per month, the difference rounded down to a whole month and never
      below zero; when two or more were missed, two months of units are added; when exactly one was missed, one
      month of units is added; otherwise nothing is added.'
    bought_outright: On the Self-Pay Supply Subscription the discount is 15 percent for a patient who bought the
      PAP device outright from Summit Ridge and whose subscription was opened 12 or more months ago, 12 percent
      for a patient who bought the device outright from Summit Ridge and whose subscription was opened less than
      12 months ago, and otherwise the schedule's subscription discount; it applies to every self-pay item line
      of the subscription, standing-order lines, branch purchases and add-on items alike, and is rounded to the
      cent half up per line; a shipping charge is not an item line and takes no discount, its amount following the
      shipping rules.
    discount: On the Self-Pay Supply Subscription the discount is 15 percent for a patient who bought the PAP device
      outright from Summit Ridge and whose subscription was opened 12 or more months ago, 12 percent for a patient
      who bought the device outright from Summit Ridge and whose subscription was opened less than 12 months ago,
      and otherwise the schedule's subscription discount; it applies to every self-pay item line of the subscription,
      standing-order lines, branch purchases and add-on items alike, and is rounded to the cent half up per line;
      a shipping charge is not an item line and takes no discount, its amount following the shipping rules.
    units: The units shipped are the units per month times the months covered plus any made-up units, rounded down
      to a whole unit, and the amount charged is the units shipped times the cash price less the discount.
    result: The units shipped are the units per month times the months covered plus any made-up units, rounded down
      to a whole unit, and the amount charged is the units shipped times the cash price less the discount.
  factors:
  - id: unit_basis
    effect: method
    decides: rate
    bindings:
    - branch_units
    - rate
    ladder:
    - when: the cushion item of the recorded style differs from the latest standing-order cushion line's item
      method: units per month are that item's branch-collected units of the last 3 months divided by three, rounded
        up
    - when: the item is the same and the patient also collected it at a branch in the last 3 months
      method: units per month are the standing-order rate plus the branch units divided by three, rounded up
    - when: otherwise
      method: units per month are the latest standing-order line's units per month
    baseline:
      rate: std_rate
    evidence:
    - history
    cross_difficulty: null
  - id: cycle_months
    effect: parameter
    decides: span
    bindings:
    - sub_months
    - span
    ladder:
    - when: the subscription was opened less than 12 months ago
      value: K('months_new_sub') (one month)
    - when: the subscription was opened 12 to 23 months ago
      value: K('months_mid_sub') (two months)
    - when: otherwise
      value: P('max_months_per_shipment')
    baseline:
      span: P('max_months_per_shipment')
    evidence:
    - date
    cross_difficulty: null
  - id: missed_month_makeup
    effect: parameter
    decides: made_up
    bindings:
    - std_units_12
    - missed
    - made_up
    ladder:
    - when: two or more standing-order months were missed in the last 12 months
      value: two months of units added
    - when: exactly one standing-order month was missed in the last 12 months
      value: one month of units added
    - when: otherwise
      value: nothing added
    baseline:
      made_up: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: owner_discount
    effect: parameter
    decides: discount
    bindings:
    - bought_outright
    - discount
    ladder:
    - when: the patient bought the PAP device outright from Summit Ridge and the subscription was opened 12 or more
        months ago
      value: K('disc_owner_long') (15 percent)
    - when: the patient bought the device outright from Summit Ridge and the subscription was opened less than 12
        months ago
      value: K('disc_owner_new') (12 percent)
    - when: otherwise
      value: the schedule's subscription discount
    baseline:
      discount: P('subscription_discount_pct')
    evidence:
    - cross_category
    - date
    cross_difficulty: pap
  inputs:
    history:
    - table: resupply_shipments
      aggregate: sum
      field: quantity
      within_months: 12
      filters:
        event_type: resupply_item_shipped
        billing_basis: self_pay
    - category: pap
      table: pap_billing
      aggregate: count
      field: event_type
      filters:
        event_type: pap_purchase_sale
    cross_category:
    - pap
- id: resupply_ext_ground_charge_catch_up
  base_policy_refs:
  - resupply_shipping
  overwrite:
  - base_policy: resupply_shipping
    superseded_clause: Ground shipping costs `ground_shipping_fee`, waived for a self-pay subscription order whose
      items total at least `self_pay_free_shipping_min` when that value is above 0.00
    replaced_by: For a self-pay shipment that went out by ground, and only for such a shipment, the shipment owes
      one ground shipping charge unless its value reaches the free-shipping floor below, and the newest such shipment,
      when it is found without a shipping charge, has the charge worked out here booked against its own ship date;
      every other shipment that went out by ground remains under the base ground-shipping rule, and an expedited
      shipment or a branch pickup, which is not a ground shipment, owes no ground charge.
  trigger: state_due
  subject:
  - resupply_shipping_charge
  computes: self_pay_amount
  target_tool: book_ground_shipping_charge_38ca3aab
  params:
    min_new_sub: 100.0
    min_mid_sub: 85.0
    share_very_late: 40
    share_late: 60
    fee_filters: 3.95
    fee_light: 4.95
  rule: 'For a self-pay shipment that went out by ground, and only for such a shipment, the shipment owes one ground
    shipping charge unless its value reaches the free-shipping floor below, and the newest such shipment, when it
    is found without a shipping charge, has the charge worked out here booked against its own ship date; every other
    shipment that went out by ground remains under the base ground-shipping rule, and an expedited shipment or a
    branch pickup, which is not a ground shipment, owes no ground charge. The standard method charges the schedule''s
    ground shipping fee for the newest self-pay shipment that went out by ground and carries no shipping charge,
    unless the list value of its items reaches the schedule''s free-shipping minimum, in which case nothing is owed.
    The value compared with the minimum is the amount charged on the shipment''s lines for a shipment without a
    cushion or mask line, the list value less the schedule''s subscription discount for a shipment with a cushion
    line, and otherwise the list value of its items at cash prices. The free-shipping floor a ground shipment''s
    value is tested against is 100.00 for a subscription opened less than 12 months ago, 85.00 for one opened 12
    to 23 months ago, and otherwise the schedule''s free-shipping minimum. A charge booked late is reduced: to 40
    percent of the fee when it is booked 31 or more days after the shipment went out, to 60 percent when it is booked
    15 to 30 days after, and otherwise it is the full fee. The ground fee owed for the shipment is 3.95 for a shipment
    of filters only, 4.95 for a shipment without a mask or cushion line that holds an item other than filters, and
    otherwise the schedule''s ground shipping fee. The ground charge booked is the ground fee owed times the share
    kept, rounded to the cent half up.'
  baseline:
    rule: The standard method charges the schedule's ground shipping fee for the newest self-pay shipment that went
      out by ground and carries no shipping charge, unless the list value of its items reaches the schedule's free-shipping
      minimum, in which case nothing is owed.
    params:
    - ground_shipping_fee
    - self_pay_free_shipping_min
  prerequisite: []
  cross_category: []
  compute:
  - box_date: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground') or '0000-01-01'
  - box_charged: COUNT('resupply_shipments', event_type='resupply_shipping_charge', service_from_date=box_date)
  - box_lines: COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date)
  - box_amount: SUM('resupply_shipments', 'self_pay_amount', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date)
  - box_list: RND(SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date, hcpcs_code='A7030') * 129.0 + SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped',
      billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7031') * 44.0 + SUM('resupply_shipments',
      'quantity', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7034')
      * 89.0 + SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date, hcpcs_code='A7032') * 29.0 + SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped',
      billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7033') * 19.0 + SUM('resupply_shipments',
      'quantity', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7035')
      * 35.0 + SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date, hcpcs_code='A7036') * 19.0 + SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped',
      billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7037') * 15.0 + SUM('resupply_shipments',
      'quantity', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A4604')
      * 39.0 + SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date, hcpcs_code='A7038') * 2.5 + SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped',
      billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7039') * 9.0 + SUM('resupply_shipments',
      'quantity', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7046')
      * 24.0, 2)
  - box_cushions: COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date,
      hcpcs_code='A7031') + COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date, hcpcs_code='A7032') + COUNT('resupply_shipments', event_type='resupply_item_shipped',
      billing_basis='self_pay', service_from_date=box_date, hcpcs_code='A7033')
  - box_masks: COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date,
      hcpcs_code='A7030') + COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date, hcpcs_code='A7034')
  - box_filters: COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay', service_from_date=box_date,
      hcpcs_code='A7038') + COUNT('resupply_shipments', event_type='resupply_item_shipped', billing_basis='self_pay',
      service_from_date=box_date, hcpcs_code='A7039')
  - compare_value: box_amount if (box_cushions == 0 and box_masks == 0) else (RND(box_list * (100 - P('subscription_discount_pct'))
      / 100, 2) if box_cushions > 0 else box_list)
  - sub_months: MONTHS(F('enrollment_date'), NOW)
  - free_min: K('min_new_sub') if sub_months < 12 else (K('min_mid_sub') if (sub_months >= 12 and sub_months < 24)
      else P('self_pay_free_shipping_min'))
  - days_late: DAYS(box_date, NOW)
  - share: K('share_very_late') if days_late >= 31 else (K('share_late') if (days_late >= 15 and days_late < 31)
      else 100)
  - fee: K('fee_filters') if (box_lines > 0 and box_filters == box_lines) else (K('fee_light') if (box_cushions
      == 0 and box_masks == 0 and box_filters < box_lines) else P('ground_shipping_fee'))
  - owed: box_date != '0000-01-01' and box_charged == 0 and compare_value < free_min
  - result: RND(fee * share / 100 + 0.0000001, 2) if owed else 0
  compute_basis:
    box_date: The standard method charges the schedule's ground shipping fee for the newest self-pay shipment that
      went out by ground and carries no shipping charge, unless the list value of its items reaches the schedule's
      free-shipping minimum, in which case nothing is owed.
    box_charged: The standard method charges the schedule's ground shipping fee for the newest self-pay shipment
      that went out by ground and carries no shipping charge, unless the list value of its items reaches the schedule's
      free-shipping minimum, in which case nothing is owed.
    box_lines: The ground fee owed for the shipment is 3.95 for a shipment of filters only, 4.95 for a shipment
      without a mask or cushion line that holds an item other than filters, and otherwise the schedule's ground
      shipping fee.
    box_amount: The value compared with the minimum is the amount charged on the shipment's lines for a shipment
      without a cushion or mask line, the list value less the schedule's subscription discount for a shipment with
      a cushion line, and otherwise the list value of its items at cash prices.
    box_list: The value compared with the minimum is the amount charged on the shipment's lines for a shipment without
      a cushion or mask line, the list value less the schedule's subscription discount for a shipment with a cushion
      line, and otherwise the list value of its items at cash prices.
    box_cushions: The value compared with the minimum is the amount charged on the shipment's lines for a shipment
      without a cushion or mask line, the list value less the schedule's subscription discount for a shipment with
      a cushion line, and otherwise the list value of its items at cash prices.
    box_masks: The ground fee owed for the shipment is 3.95 for a shipment of filters only, 4.95 for a shipment
      without a mask or cushion line that holds an item other than filters, and otherwise the schedule's ground
      shipping fee.
    box_filters: The ground fee owed for the shipment is 3.95 for a shipment of filters only, 4.95 for a shipment
      without a mask or cushion line that holds an item other than filters, and otherwise the schedule's ground
      shipping fee.
    compare_value: The value compared with the minimum is the amount charged on the shipment's lines for a shipment
      without a cushion or mask line, the list value less the schedule's subscription discount for a shipment with
      a cushion line, and otherwise the list value of its items at cash prices.
    sub_months: The free-shipping floor a ground shipment's value is tested against is 100.00 for a subscription
      opened less than 12 months ago, 85.00 for one opened 12 to 23 months ago, and otherwise the schedule's free-shipping
      minimum.
    free_min: The free-shipping floor a ground shipment's value is tested against is 100.00 for a subscription opened
      less than 12 months ago, 85.00 for one opened 12 to 23 months ago, and otherwise the schedule's free-shipping
      minimum.
    days_late: 'A charge booked late is reduced: to 40 percent of the fee when it is booked 31 or more days after
      the shipment went out, to 60 percent when it is booked 15 to 30 days after, and otherwise it is the full fee.'
    share: 'A charge booked late is reduced: to 40 percent of the fee when it is booked 31 or more days after the
      shipment went out, to 60 percent when it is booked 15 to 30 days after, and otherwise it is the full fee.'
    fee: The ground fee owed for the shipment is 3.95 for a shipment of filters only, 4.95 for a shipment without
      a mask or cushion line that holds an item other than filters, and otherwise the schedule's ground shipping
      fee.
    owed: The standard method charges the schedule's ground shipping fee for the newest self-pay shipment that went
      out by ground and carries no shipping charge, unless the list value of its items reaches the schedule's free-shipping
      minimum, in which case nothing is owed.
    result: The ground charge booked is the ground fee owed times the share kept, rounded to the cent half up.
  factors:
  - id: compared_value
    effect: method
    decides: compare_value
    bindings:
    - box_amount
    - box_list
    - box_cushions
    - compare_value
    ladder:
    - when: the shipment has no cushion or mask line
      method: the amount charged on its lines is compared
    - when: the shipment has a cushion line
      method: the list value less the schedule's subscription discount is compared
    - when: otherwise
      method: the list value at cash prices is compared
    baseline:
      compare_value: box_list
    evidence:
    - history
    cross_difficulty: null
  - id: free_ship_floor
    effect: parameter
    decides: free_min
    bindings:
    - sub_months
    - free_min
    ladder:
    - when: the subscription was opened less than 12 months ago
      value: K('min_new_sub') (100.00)
    - when: the subscription was opened 12 to 23 months ago
      value: K('min_mid_sub') (85.00)
    - when: otherwise
      value: the schedule's free-shipping minimum
    baseline:
      free_min: P('self_pay_free_shipping_min')
    evidence:
    - date
    cross_difficulty: null
  - id: late_booking_share
    effect: parameter
    decides: share
    bindings:
    - days_late
    - share
    ladder:
    - when: booked 31 or more days after the shipment went out
      value: K('share_very_late') (40 percent)
    - when: booked 15 to 30 days after the shipment went out
      value: K('share_late') (60 percent)
    - when: otherwise
      value: the full fee (100 percent)
    baseline:
      share: '100'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: parcel_rate
    effect: parameter
    decides: fee
    bindings:
    - box_lines
    - box_masks
    - box_filters
    - fee
    ladder:
    - when: the shipment holds filters only
      value: K('fee_filters') (3.95)
    - when: the shipment has no mask or cushion line and holds an item other than filters
      value: K('fee_light') (4.95)
    - when: otherwise
      value: the schedule's ground shipping fee
    baseline:
      fee: P('ground_shipping_fee')
    evidence:
    - history
    cross_difficulty: null
  inputs:
    history:
    - table: resupply_shipments
      aggregate: sum
      field: self_pay_amount
      filters:
        event_type: resupply_item_shipped
        billing_basis: self_pay
    cross_category: []
- id: resupply_ext_rush_shipping_charge
  base_policy_refs:
  - resupply_shipping
  overwrite:
  - base_policy: resupply_shipping
    superseded_clause: Expedited shipping, at the patient's request only, costs `expedited_shipping_fee` per shipment,
      arrives in `expedited_transit_business_days` business days, and is charged to the patient's card, never to
      coverage.
    replaced_by: Expedited shipping is the patient's own request and is charged to the card on file, never to coverage,
      once for each shipment that goes out expedited, at the rush charge worked out here on the day the shipment
      goes out; it arrives in the schedule's expedited transit business days.
  trigger: on_request
  subject:
  - resupply_shipping_charge
  computes: self_pay_amount
  target_tool: pay_expedited_shipping_41dc5e4a
  params:
    fee_small_parcel: 12.95
    fee_large_parcel: 13.95
    small_units: 6
    share_recent: 80
    share_earlier: 90
    recent_days: 21
    earlier_days: 45
    first_rush_off: 1.0
    second_rush_off: 0.5
  rule: 'Expedited shipping is the patient''s own request and is charged to the card on file, never to coverage,
    once for each shipment that goes out expedited, at the rush charge worked out here on the day the shipment goes
    out; it arrives in the schedule''s expedited transit business days. The standard method charges the schedule''s
    expedited shipping fee once for the shipment going out today. The rush fee for today''s shipment is 12.95 for
    a shipment of cushions or filters only holding six units or fewer, 13.95 for a shipment of cushions or filters
    only holding more than six units, and otherwise the schedule''s expedited shipping fee. How the rush is priced
    depends on what the shipment would have paid by ground: when the amount charged on today''s item lines reaches
    the schedule''s free-shipping minimum and that minimum is above 0.00, the rush is priced as an upgrade, the
    rush fee less the schedule''s ground shipping fee; when today''s shipment carries item lines whose amount is
    below a free-shipping minimum that is above 0.00, the rush is priced as the schedule''s ground shipping fee
    plus half the difference between the rush fee and the ground fee; otherwise, whether no item line is booked
    on today''s shipment or the schedule has no free-shipping minimum above 0.00, the rush is priced at the full
    rush fee. A patient who has already paid for a recent shipment pays a share of the priced rush: 80 percent when
    a ground shipping charge is booked for a shipment that went out in the last 21 days, 90 percent when the newest
    such shipment went out 22 to 45 days ago, and otherwise the full priced rush. A first rush is softened: 1.00
    is taken off when the enrollment shows no expedited shipping charge in the last 12 months, 0.50 when it shows
    exactly one, and otherwise nothing. The rush charge is the priced rush times the share, less the amount taken
    off, never below zero, rounded to the cent half up. The rush charge for a shipment is fixed only after the standing-order
    cushion line due on the enrollment stands booked on that shipment. No rush charge is fixed until the newest
    shipment that went out by ground before the day of the rush carries the ground shipping charge it owes.'
  baseline:
    rule: The standard method charges the schedule's expedited shipping fee once for the shipment going out today.
    params:
    - expedited_shipping_fee
  prerequisite:
  - problem: resupply_ext_standing_order_charge
    kind: value_input
    gate: today_amount
    form: state
    policy_source: The rush charge for a shipment is fixed only after the standing-order cushion line due on the
      enrollment stands booked on that shipment.
    condition: the standing-order cushion line whose supply is within the schedule's ship-window days of running
      out is booked with today's ship date
    resolved_by: book_subscription_line_cd282959
    effect: today's shipment carries its item line, which sets the rush fee and the pricing method
  - problem: resupply_ext_ground_charge_catch_up
    kind: value_input
    gate: last_ground_box
    form: state
    policy_source: No rush charge is fixed until the newest shipment that went out by ground before the day of the
      rush carries the ground shipping charge it owes.
    condition: the newest self-pay shipment that went out by ground before today, when its value is below the free-shipping
      floor, carries a ground shipping-charge line dated with its ship date
    resolved_by: book_ground_shipping_charge_38ca3aab
    effect: the newest ground charge moves to the most recent ground shipment, which lowers the share of the priced
      rush
  cross_category: []
  compute:
  - today_lines: COUNT('resupply_shipments', event_type='resupply_item_shipped', service_from_date=NOW)
  - today_units: SUM('resupply_shipments', 'quantity', event_type='resupply_item_shipped', service_from_date=NOW)
  - today_small_lines: COUNT('resupply_shipments', event_type='resupply_item_shipped', service_from_date=NOW, hcpcs_code='A7031')
      + COUNT('resupply_shipments', event_type='resupply_item_shipped', service_from_date=NOW, hcpcs_code='A7032')
      + COUNT('resupply_shipments', event_type='resupply_item_shipped', service_from_date=NOW, hcpcs_code='A7033')
      + COUNT('resupply_shipments', event_type='resupply_item_shipped', service_from_date=NOW, hcpcs_code='A7038')
      + COUNT('resupply_shipments', event_type='resupply_item_shipped', service_from_date=NOW, hcpcs_code='A7039')
  - today_amount: SUM('resupply_shipments', 'self_pay_amount', event_type='resupply_item_shipped', service_from_date=NOW)
  - fee: K('fee_small_parcel') if (today_lines > 0 and today_small_lines == today_lines and today_units <= K('small_units'))
      else (K('fee_large_parcel') if (today_lines > 0 and today_small_lines == today_lines and today_units > K('small_units'))
      else P('expedited_shipping_fee'))
  - priced: (fee - P('ground_shipping_fee')) if (P('self_pay_free_shipping_min') > 0 and today_amount >= P('self_pay_free_shipping_min'))
      else ((P('ground_shipping_fee') + (fee - P('ground_shipping_fee')) / 2) if (today_lines > 0 and P('self_pay_free_shipping_min')
      > 0 and today_amount < P('self_pay_free_shipping_min')) else fee)
  - last_ground_box: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_shipping_charge',
      shipping_method='ground') or '0000-01-01'
  - share: K('share_recent') if DAYS(last_ground_box, NOW) <= K('recent_days') else (K('share_earlier') if (DAYS(last_ground_box,
      NOW) > K('recent_days') and DAYS(last_ground_box, NOW) <= K('earlier_days')) else 100)
  - rushes_12: COUNT('resupply_shipments', within_months=12, date_field='service_from_date', event_type='resupply_shipping_charge',
      shipping_method='expedited')
  - taken_off: K('first_rush_off') if rushes_12 == 0 else (K('second_rush_off') if rushes_12 == 1 else 0)
  - result: MX(0, RND(priced * share / 100 - taken_off + 0.0000001, 2))
  compute_basis:
    today_lines: The rush fee for today's shipment is 12.95 for a shipment of cushions or filters only holding six
      units or fewer, 13.95 for a shipment of cushions or filters only holding more than six units, and otherwise
      the schedule's expedited shipping fee.
    today_units: The rush fee for today's shipment is 12.95 for a shipment of cushions or filters only holding six
      units or fewer, 13.95 for a shipment of cushions or filters only holding more than six units, and otherwise
      the schedule's expedited shipping fee.
    today_small_lines: The rush fee for today's shipment is 12.95 for a shipment of cushions or filters only holding
      six units or fewer, 13.95 for a shipment of cushions or filters only holding more than six units, and otherwise
      the schedule's expedited shipping fee.
    today_amount: 'How the rush is priced depends on what the shipment would have paid by ground: when the amount
      charged on today''s item lines reaches the schedule''s free-shipping minimum and that minimum is above 0.00,
      the rush is priced as an upgrade, the rush fee less the schedule''s ground shipping fee; when today''s shipment
      carries item lines whose amount is below a free-shipping minimum that is above 0.00, the rush is priced as
      the schedule''s ground shipping fee plus half the difference between the rush fee and the ground fee; otherwise,
      whether no item line is booked on today''s shipment or the schedule has no free-shipping minimum above 0.00,
      the rush is priced at the full rush fee.'
    fee: The rush fee for today's shipment is 12.95 for a shipment of cushions or filters only holding six units
      or fewer, 13.95 for a shipment of cushions or filters only holding more than six units, and otherwise the
      schedule's expedited shipping fee.
    priced: 'How the rush is priced depends on what the shipment would have paid by ground: when the amount charged
      on today''s item lines reaches the schedule''s free-shipping minimum and that minimum is above 0.00, the rush
      is priced as an upgrade, the rush fee less the schedule''s ground shipping fee; when today''s shipment carries
      item lines whose amount is below a free-shipping minimum that is above 0.00, the rush is priced as the schedule''s
      ground shipping fee plus half the difference between the rush fee and the ground fee; otherwise, whether no
      item line is booked on today''s shipment or the schedule has no free-shipping minimum above 0.00, the rush
      is priced at the full rush fee.'
    last_ground_box: 'A patient who has already paid for a recent shipment pays a share of the priced rush: 80 percent
      when a ground shipping charge is booked for a shipment that went out in the last 21 days, 90 percent when
      the newest such shipment went out 22 to 45 days ago, and otherwise the full priced rush.'
    share: 'A patient who has already paid for a recent shipment pays a share of the priced rush: 80 percent when
      a ground shipping charge is booked for a shipment that went out in the last 21 days, 90 percent when the newest
      such shipment went out 22 to 45 days ago, and otherwise the full priced rush.'
    rushes_12: 'A first rush is softened: 1.00 is taken off when the enrollment shows no expedited shipping charge
      in the last 12 months, 0.50 when it shows exactly one, and otherwise nothing.'
    taken_off: 'A first rush is softened: 1.00 is taken off when the enrollment shows no expedited shipping charge
      in the last 12 months, 0.50 when it shows exactly one, and otherwise nothing.'
    result: The rush charge is the priced rush times the share, less the amount taken off, never below zero, rounded
      to the cent half up.
  factors:
  - id: rush_parcel_fee
    effect: parameter
    decides: fee
    bindings:
    - today_units
    - today_small_lines
    - fee
    ladder:
    - when: a shipment of cushions or filters only holding six units or fewer
      value: K('fee_small_parcel') (12.95)
    - when: a shipment of cushions or filters only holding more than six units
      value: K('fee_large_parcel') (13.95)
    - when: otherwise
      value: the schedule's expedited shipping fee
    baseline:
      fee: P('expedited_shipping_fee')
    evidence:
    - history
    cross_difficulty: null
  - id: ground_credit
    effect: method
    decides: priced
    bindings:
    - today_lines
    - today_amount
    - priced
    ladder:
    - when: today's item lines reach the schedule's free-shipping minimum and that minimum is above 0.00
      method: 'upgrade pricing: the rush fee less the schedule''s ground shipping fee'
    - when: today's shipment carries item lines whose amount is below a free-shipping minimum that is above 0.00
      method: 'split pricing: the ground fee plus half the difference between the rush fee and the ground fee'
    - when: otherwise (no item line booked today, or no free-shipping minimum above 0.00 on the schedule)
      method: the full rush fee
    baseline:
      priced: fee
    evidence:
    - history
    cross_difficulty: null
  - id: recent_payer_share
    effect: parameter
    decides: share
    bindings:
    - last_ground_box
    - share
    ladder:
    - when: a ground shipping charge is booked for a shipment that went out in the last 21 days
      value: K('share_recent') (80 percent)
    - when: the newest such shipment went out 22 to 45 days ago
      value: K('share_earlier') (90 percent)
    - when: otherwise
      value: the full priced rush (100 percent)
    baseline:
      share: '100'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: first_rush_softener
    effect: parameter
    decides: taken_off
    bindings:
    - rushes_12
    - taken_off
    ladder:
    - when: no expedited shipping charge in the last 12 months
      value: K('first_rush_off') (1.00)
    - when: exactly one expedited shipping charge in the last 12 months
      value: K('second_rush_off') (0.50)
    - when: otherwise
      value: nothing taken off
    baseline:
      taken_off: '0'
    evidence:
    - history
    cross_difficulty: null
  inputs:
    history:
    - table: resupply_shipments
      aggregate: latest
      field: service_from_date
      filters:
        event_type: resupply_shipping_charge
        shipping_method: ground
    cross_category: []
