- id: resupply_ext_standing_order_charge
  base_policy_refs:
  - resupply_agg_schedule_match
  - resupply_refill_confirmation
  - resupply_evt_shipment
  - resupply_item_compatibility
  - resupply_shipping
  - resupply_self_pay_pricing
  overwrite:
  - base_policy: resupply_refill_confirmation
    superseded_clause: Items are shipped no later than `refill_contact_lead_days` after the refill is confirmed,
      counting calendar days from the day after contact_date with the boundary day included; an older confirmation
      needs a new contact.
    replaced_by: A standing-order line on the Self-Pay Supply Subscription for a patient who chose automatic shipments
      ships on its cycle without a refill confirmation, while a line that rests on a refill confirmation still ships
      no later than the schedule's refill lead days after it, counting calendar days from the day after the confirmation
      date with the boundary day included, and an older confirmation needs a new contact; whether a coverage-billed
      line must rest on a refill request still follows the base rule, and a no-charge reship, which answers the
      line it replaces, is not held to this window.
  - base_policy: resupply_self_pay_pricing
    superseded_clause: on the Self-Pay Supply Subscription the `subscription_discount_pct` discount applies to every
      line, rounded to the cent half up per line
    replaced_by: On the Self-Pay Supply Subscription the discount is 15 percent for a patient who bought the PAP
      device outright from Summit Ridge and whose subscription was opened 12 or more months ago, 12 percent for
      a patient who bought the device outright from Summit Ridge and whose subscription was opened less than 12
      months ago, and otherwise the schedule's subscription discount; it applies to every self-pay item line of
      the subscription, standing-order lines, branch purchases and add-on items alike, and is rounded to the cent
      half up per line; a shipping charge is not an item line and takes no discount, its amount following the shipping
      rules.
  trigger: state_due
  subject:
  - resupply_item_shipped
  computes: self_pay_amount
  target_tool: book_subscription_line_cd282959
  params:
    price_a7031: 44.0
    price_a7032: 29.0
    price_a7033: 19.0
    months_new_sub: 1
    months_mid_sub: 2
    disc_owner_long: 15
    disc_owner_new: 12
  rule: 'On the Self-Pay Supply Subscription with automatic shipments chosen, the standing order ships the cushion
    item of the recorded mask style on its cycle as a self-pay line charged to the card on file, once the cushion
    supply on the enrollment is within the schedule''s ship-window days of running out. A standing-order line on
    the Self-Pay Supply Subscription for a patient who chose automatic shipments ships on its cycle without a refill
    confirmation, while a line that rests on a refill confirmation still ships no later than the schedule''s refill
    lead days after it, counting calendar days from the day after the confirmation date with the boundary day included,
    and an older confirmation needs a new contact; whether a coverage-billed line must rest on a refill request
    still follows the base rule, and a no-charge reship, which answers the line it replaces, is not held to this
    window. The standard method repeats the standing order: the line carries the latest standing-order cushion line''s
    units per month for the schedule''s maximum months per shipment, priced at the item''s cash price less the subscription
    discount of the schedule, rounded to the cent half up for the line. The cash prices are 44.00 for a full face
    cushion (A7031), 29.00 for a nasal cushion (A7032) and 19.00 for a pair of nasal pillows (A7033), and the cushion
    item is the one of the recorded mask style. The units per month are worked out as follows: when the cushion
    item of the recorded style differs from the item of the latest standing-order cushion line, they are the units
    of the recorded style''s item the patient collected at a branch in the last 3 calendar months divided by three,
    rounded up to a whole unit; when the item is the same and the patient also collected units of it at a branch
    in the last 3 calendar months, they are the latest standing-order line''s units per month plus the result of
    dividing those branch units by three and rounding it up to a whole unit; otherwise they are the latest standing-order
    line''s units per month, its units divided by the whole months it covered. The months a standing-order line
    covers are one for a subscription opened less than 12 months ago, two for one opened 12 to 23 months ago, and
    otherwise the schedule''s maximum months per shipment. A line never covers months past the supply order''s validity,
    counted as the order''s validity months less the whole months since the order date, less one for the month in
    progress. Months the standing order missed are made up on the line: the standing-order months missed in the
    last 12 months are 12 less the months that the standing-order lines of the latest standing-order item shipped
    in that span cover at that line''s units per month, the difference rounded down to a whole month and never below
    zero; when two or more were missed, two months of units are added; when exactly one was missed, one month of
    units is added; otherwise nothing is added. On the Self-Pay Supply Subscription the discount is 15 percent for
    a patient who bought the PAP device outright from Summit Ridge and whose subscription was opened 12 or more
    months ago, 12 percent for a patient who bought the device outright from Summit Ridge and whose subscription
    was opened less than 12 months ago, and otherwise the schedule''s subscription discount; it applies to every
    self-pay item line of the subscription, standing-order lines, branch purchases and add-on items alike, and is
    rounded to the cent half up per line; a shipping charge is not an item line and takes no discount, its amount
    following the shipping rules. The units shipped are the units per month times the months covered plus any made-up
    units, rounded down to a whole unit, and the amount charged is the units shipped times the cash price less the
    discount. The standing-order history is read from the enrollment''s self-pay cushion lines that went out by
    ground; lines collected at a branch are purchases outside the standing order. A standing-order line travels
    expedited when the patient asks for faster shipping of it, is collected at a branch when the patient asks to
    collect it, and otherwise travels by ground. The line''s covered-through date is the day before the same day
    of the month that lies the months covered after the ship date, made-up units not extending it. A standing-order
    cushion line is booked only after the recorded mask style matches the style that the patient''s own interface
    and cushion lines establish.'
  baseline:
    rule: 'The standard method repeats the standing order: the line carries the latest standing-order cushion line''s
      units per month for the schedule''s maximum months per shipment, priced at the item''s cash price less the
      subscription discount of the schedule, rounded to the cent half up for the line. The cash prices are 44.00
      for a full face cushion (A7031), 29.00 for a nasal cushion (A7032) and 19.00 for a pair of nasal pillows (A7033),
      and the cushion item is the one of the recorded mask style. A line never covers months past the supply order''s
      validity, counted as the order''s validity months less the whole months since the order date, less one for
      the month in progress.'
    params:
    - max_months_per_shipment
    - subscription_discount_pct
    - price_a7031
    - price_a7032
    - price_a7033
  prerequisite:
  - problem: resupply_ext_recorded_style_from_use
    kind: value_input
    gate: item
    form: state
    policy_source: A standing-order cushion line is booked only after the recorded mask style matches the style
      that the patient's own interface and cushion lines establish.
    condition: the enrollment's mask_style equals the style that the enrollment's interface and cushion lines establish
      under the recorded-style rule
    resolved_by: update_mask_style_bfa4256b
    effect: the cushion item, its cash price and the units-per-month basis of the standing-order line follow the
      corrected style
  cross_category:
  - category: pap
    as: history
    reads:
    - pap_billing.event_type
    note: the line discount is decided from whether the PAP device record shows a self-pay purchase sale.
  compute:
  - item: '''A7031'' if F(''mask_style'') == ''full_face'' else (''A7032'' if F(''mask_style'') == ''nasal'' else
      ''A7033'')'
  - price: K('price_a7031') if item == 'A7031' else (K('price_a7032') if item == 'A7032' else K('price_a7033'))
  - sd_a7031: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground', hcpcs_code='A7031') or '0000-01-01'
  - sd_a7032: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground', hcpcs_code='A7032') or '0000-01-01'
  - sd_a7033: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground', hcpcs_code='A7033') or '0000-01-01'
  - std_item: '''A7031'' if (sd_a7031 >= sd_a7032 and sd_a7031 >= sd_a7033) else (''A7032'' if sd_a7032 >= sd_a7033
      else ''A7033'')'
  - std_qty: LATEST('resupply_shipments', 'quantity', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground', hcpcs_code=std_item) or 0
  - std_from: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground', hcpcs_code=std_item) or NOW
  - std_thru: LATEST('resupply_shipments', 'covers_through_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground', hcpcs_code=std_item) or NOW
  - std_rate: std_qty / (MONTHS(std_from, std_thru) + 1)
  - branch_units: SUM('resupply_shipments', 'quantity', within_months=3, date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='branch_pickup', hcpcs_code=item)
  - rate: (-((-branch_units) // 3)) if item != std_item else ((std_rate + (-((-branch_units) // 3))) if branch_units
      > 0 else std_rate)
  - sub_months: MONTHS(F('enrollment_date'), NOW)
  - span: K('months_new_sub') if sub_months < 12 else (K('months_mid_sub') if (sub_months >= 12 and sub_months <
      24) else P('max_months_per_shipment'))
  - order_left: P('rx_validity_months') - MONTHS(F('rx_date'), NOW) - 1
  - months: MX(0, MN(span, order_left))
  - std_units_12: SUM('resupply_shipments', 'quantity', within_months=12, date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='self_pay', shipping_method='ground', hcpcs_code=std_item)
  - missed: int(MX(0, 12 - (std_units_12 / std_rate if std_rate > 0 else 12)))
  - made_up: 2 * rate if missed >= 2 else (rate if missed >= 1 else 0)
  - bought_outright: XCOUNT('pap', 'pap_billing', event_type='pap_purchase_sale')
  - discount: K('disc_owner_long') if (bought_outright > 0 and sub_months >= 12) else (K('disc_owner_new') if (bought_outright
      > 0 and sub_months < 12) else P('subscription_discount_pct'))
  - units: int(rate * months + made_up)
  - result: RND(units * price * (100 - discount) / 100 + 0.0000001, 2)
