    decides: lines_needed
    bindings:
    - iface_span
    - iface_ever
    - lines_needed
    ladder:
    - when: the interface that goes with the candidate's style was collected within the span
      value: K('lines_with_interface') (two lines)
    - when: that interface was collected only before the span
      value: K('lines_interface_earlier') (three lines)
    - when: otherwise
