- id: resupply_replacement_rules
  subject:
  - resupply_no_charge_replacement
  rule: 'Summit Ridge reships at no charge, without billing coverage and without counting toward any limit (`defect_replacement_counts_toward_limit`),
    in four cases tied to one original line: a mask_fit_exchange of a newly shipped interface or cushion within
    `mask_fit_exchange_days` of its ship date, limited to `max_interface_exchanges_per_period` per new interface;
    a manufacturer_defect reported within `defect_replacement_days` of the ship date; a carrier_lost shipment with
    no delivery confirmation after `lost_package_trace_business_days` business days; and a wrong_item shipped in
    error. An original line receives at most one no-charge replacement per reason. Opened items are otherwise never
    returned or exchanged.'
  eligibility:
  - id: one_replacement_per_reason
    applies_to:
    - resupply_no_charge_replacement
    kind: dedup
    condition: An original line receives at most one no-charge replacement per reason.
    evidence_fields:
    - resupply_shipments.original_line_id
    - resupply_shipments.replacement_reason
    - resupply_shipments.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - resupply_shipments.original_line_id
      action_bindings:
        resupply_shipments.original_line_id: original_line_id
    dedup_contract:
      table: resupply_shipments
      mode: separate_record
      object_bindings:
        original_line_id: original_line_id
        replacement_reason: replacement_reason
      duplicate_filters:
        event_type:
        - resupply_no_charge_replacement
      distinct_fields: []
  params:
