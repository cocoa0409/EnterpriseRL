        fit_days: =mask_fit_exchange_days
        fit_max: =max_interface_exchanges_per_period
        defect_days: =defect_replacement_days
        counts: =defect_replacement_counts_toward_limit
        trace_days: =lost_package_trace_business_days
      Medicaid Resupply Schedule:
