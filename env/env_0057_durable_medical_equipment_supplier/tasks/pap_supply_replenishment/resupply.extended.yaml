        auto_ship: =auto_ship_allowed
        rx_months: =rx_validity_months
extended_policies:
- id: resupply_ext_continued_use_proof_date
  base_policy_refs:
  - resupply_order_continuity
  overwrite: []
  trigger: state_due
  subject:
  - resupply_order_renew
  computes: last_continued_use_date
  target_tool: record_continued_use_proof_c97fce72
  params:
    hours_long_owner: 1.5
    hours_recent_owner: 3.0
    owner_years_months: 36
    nights_modem_prompt: 21
    nights_modem_late: 25
    prompt_pull_days: 7
    share_recent_note: 40
    share_older_note: 55
    note_recent_months: 12
    governing_window_days: 90
    note_lead_days: 7
  rule: 'When the proof of continued use that governs on the device record is credited with a date newer than the
    continued-use date on the supply enrollment, the enrollment''s continued-use date is brought up to that credited
    date; a date that is not newer leaves the enrollment as it is. The standard method reads the newest compliance
    download on the device record: it proves continued use when its average daily use reaches the device class''s
    compliance minimum hours, its window holds the device class''s full compliance window of nights, and the device
    class''s compliance night percentage of those nights reach four hours of use, and it is then credited at the
    last night of its window; a newest download that falls short of any of these is set aside for the newest download
    that met the device class''s compliance standard, credited at the last night of its window; and on a schedule
    that accepts either compliance data or a practitioner note, the newer of that credited download date and the
    visit date of the newest practitioner re-evaluation documenting benefit is recorded, while a schedule that accepts
    only one kind records the newest proof of its own kind. The average daily use a download must reach is 1.5 hours
    for a patient who owns the device and whose setup was 36 or more months ago, 3.0 hours for a patient who owns
    the device and whose setup was less than 36 months ago, and otherwise the device class''s compliance minimum
    hours. The nights a download''s window must hold are 21 for a device class whose compliance is proven only from
    modem or card data when the download was taken no more than 7 days after the last night of its window, 25 for
    a device class whose compliance is proven only from modem or card data when the download was taken more than
    7 days after that night, and otherwise the device class''s full compliance window. The share of the window''s
    nights that must reach four hours of use is 40 percent for a patient with a practitioner re-evaluation documenting
    benefit within the last 12 months, 55 percent for a patient whose newest re-evaluation documenting benefit is
    older than 12 months, and otherwise the device class''s compliance night percentage. The date credited to the
    newest download, when it proves continued use, is the practitioner visit date when the newest re-evaluation
    documenting benefit is dated on or no more than 7 days before the day the download was taken; when there is
    no such re-evaluation, it is the date the download was taken when it was taken no more than 7 days after the
    last night of its window, and otherwise the last night of its window. On a schedule that accepts either compliance
    data or a practitioner note, the kind of proof that governs is decided as follows: when the download that proves
    continued use has a window that ended within the last 90 days, that download governs and a practitioner note
    is not used; when no such download ended within the last 90 days but a re-evaluation documenting benefit is
    dated within the last 90 days, that note''s visit date governs; otherwise the newer of the two is recorded as
    the standard method sets out. A patient''s own account of use is never proof, and a date is recorded only from
    the device record.'
  baseline:
    rule: 'The standard method reads the newest compliance download on the device record: it proves continued use
      when its average daily use reaches the device class''s compliance minimum hours, its window holds the device
      class''s full compliance window of nights, and the device class''s compliance night percentage of those nights
      reach four hours of use, and it is then credited at the last night of its window; a newest download that falls
      short of any of these is set aside for the newest download that met the device class''s compliance standard,
      credited at the last night of its window; and on a schedule that accepts either compliance data or a practitioner
      note, the newer of that credited download date and the visit date of the newest practitioner re-evaluation
      documenting benefit is recorded, while a schedule that accepts only one kind records the newest proof of its
      own kind.'
    params:
    - continued_use_basis
  prerequisite: []
  cross_category:
  - category: pap
    as: history
    reads:
    - pap_service.window_end_date
    - pap_service.service_date
    - pap_service.avg_daily_use_hours
    - pap_service.nights_in_window
    - pap_service.nights_4h_plus
    - pap_service.compliance_result
    - pap_service.visit_date
    - pap_service.benefit_documented
    - status
    - setup_date
    - variant_name
    note: the download tests, the credited date and the governing kind are decided from the device record's compliance
      downloads, re-evaluations, ownership and class parameters.
  compute:
  - dev_status: CFIELD('pap', 'status', pap_holding_id=F('pap_holding_id'))
  - dev_setup: CFIELD('pap', 'setup_date', pap_holding_id=F('pap_holding_id'))
  - class_hours: CPARAM('pap', 'compliance_min_hours', pap_holding_id=F('pap_holding_id'))
  - class_window: CPARAM('pap', 'compliance_window_days', pap_holding_id=F('pap_holding_id'))
  - class_pct: CPARAM('pap', 'compliance_min_night_pct', pap_holding_id=F('pap_holding_id'))
  - class_modem: CPARAM('pap', 'modem_data_required', pap_holding_id=F('pap_holding_id'))
  - dl_end: XLATEST('pap', 'pap_service', 'window_end_date', date_field='service_date', event_type='pap_compliance_download')
  - dl_taken: XLATEST('pap', 'pap_service', 'service_date', date_field='service_date', event_type='pap_compliance_download')
  - dl_avg: XLATEST('pap', 'pap_service', 'avg_daily_use_hours', date_field='service_date', event_type='pap_compliance_download')
  - dl_nights: XLATEST('pap', 'pap_service', 'nights_in_window', date_field='service_date', event_type='pap_compliance_download')
  - dl_hits: XLATEST('pap', 'pap_service', 'nights_4h_plus', date_field='service_date', event_type='pap_compliance_download')
  - dl_result: XLATEST('pap', 'pap_service', 'compliance_result', date_field='service_date', event_type='pap_compliance_download')
  - met_end: XLATEST('pap', 'pap_service', 'window_end_date', date_field='service_date', event_type='pap_compliance_download',
      compliance_result='met') or '0000-01-01'
  - note_date: XLATEST('pap', 'pap_service', 'visit_date', date_field='visit_date', event_type='pap_reevaluation_received',
      benefit_documented=True) or '0000-01-01'
  - min_hours: K('hours_long_owner') if (dev_status == 'patient_owned' and MONTHS(dev_setup, NOW) >= K('owner_years_months'))
      else (K('hours_recent_owner') if (dev_status == 'patient_owned' and MONTHS(dev_setup, NOW) < K('owner_years_months'))
      else class_hours)
  - pull_lag: DAYS(dl_end, dl_taken)
  - min_nights: K('nights_modem_prompt') if (class_modem == True and pull_lag <= K('prompt_pull_days')) else (K('nights_modem_late')
      if (class_modem == True and pull_lag > K('prompt_pull_days')) else class_window)
  - min_share: K('share_recent_note') if (note_date != '0000-01-01' and MONTHS(note_date, NOW) < K('note_recent_months'))
      else (K('share_older_note') if (note_date != '0000-01-01' and MONTHS(note_date, NOW) >= K('note_recent_months'))
      else class_pct)
  - dl_counts: dl_avg >= min_hours and dl_nights >= min_nights and 100 * dl_hits >= min_share * dl_nights
  - dl_credit: note_date if (note_date != '0000-01-01' and note_date <= dl_taken and DAYS(note_date, dl_taken) <=
      K('note_lead_days')) else (dl_taken if (pull_lag <= K('prompt_pull_days')) else dl_end)
  - proof_dl: dl_credit if dl_counts else met_end
  - proof_dl_end: dl_end if dl_counts else met_end
  - newest_accepted: MX(proof_dl, note_date) if P('continued_use_basis') == 'compliance_data_or_practitioner_note'
      else (note_date if P('continued_use_basis') == 'practitioner_note_only' else proof_dl)
  - governing: proof_dl if (P('continued_use_basis') == 'compliance_data_or_practitioner_note' and DAYS(proof_dl_end,
      NOW) <= K('governing_window_days')) else (note_date if (P('continued_use_basis') == 'compliance_data_or_practitioner_note'
      and DAYS(note_date, NOW) <= K('governing_window_days')) else newest_accepted)
  - result: governing if governing > (F('last_continued_use_date') or '') else F('last_continued_use_date')
  compute_basis:
    dev_status: for a patient who owns the device and whose setup was 36 or more months ago
    dev_setup: for a patient who owns the device and whose setup was 36 or more months ago
    class_hours: otherwise the device class's compliance minimum hours
    class_window: otherwise the device class's full compliance window
    class_pct: otherwise the device class's compliance night percentage
    class_modem: 21 for a device class whose compliance is proven only from modem or card data when the download
      was taken no more than 7 days after the last night of its window
    dl_end: The standard method reads the newest compliance download on the device record
    dl_taken: the date the download was taken when it was taken no more than 7 days after the last night of its
      window
    dl_avg: its average daily use reaches the device class's compliance minimum hours
    dl_nights: its window holds the device class's full compliance window of nights
    dl_hits: the device class's compliance night percentage of those nights reach four hours of use
    dl_result: The standard method reads the newest compliance download on the device record
    met_end: a newest download that falls short of any of these is set aside for the newest download that met the
      device class's compliance standard, credited at the last night of its window
    note_date: the visit date of the newest practitioner re-evaluation documenting benefit
    min_hours: The average daily use a download must reach is 1.5 hours for a patient who owns the device and whose
      setup was 36 or more months ago, 3.0 hours for a patient who owns the device and whose setup was less than
      36 months ago, and otherwise the device class's compliance minimum hours.
    pull_lag: when the download was taken no more than 7 days after the last night of its window
    min_nights: The nights a download's window must hold are 21 for a device class whose compliance is proven only
      from modem or card data when the download was taken no more than 7 days after the last night of its window,
      25 for a device class whose compliance is proven only from modem or card data when the download was taken
      more than 7 days after that night, and otherwise the device class's full compliance window.
    min_share: The share of the window's nights that must reach four hours of use is 40 percent for a patient with
      a practitioner re-evaluation documenting benefit within the last 12 months, 55 percent for a patient whose
      newest re-evaluation documenting benefit is older than 12 months, and otherwise the device class's compliance
      night percentage.
    dl_counts: it proves continued use when its average daily use reaches the device class's compliance minimum
      hours, its window holds the device class's full compliance window of nights, and the device class's compliance
      night percentage of those nights reach four hours of use
    dl_credit: The date credited to the newest download, when it proves continued use, is the practitioner visit
      date when the newest re-evaluation documenting benefit is dated on or no more than 7 days before the day the
      download was taken; when there is no such re-evaluation, it is the date the download was taken when it was
      taken no more than 7 days after the last night of its window, and otherwise the last night of its window.
    proof_dl: a newest download that falls short of any of these is set aside for the newest download that met the
      device class's compliance standard, credited at the last night of its window
    proof_dl_end: when the download that proves continued use has a window that ended within the last 90 days
    newest_accepted: on a schedule that accepts either compliance data or a practitioner note, the newer of that
      credited download date and the visit date of the newest practitioner re-evaluation documenting benefit is
      recorded, while a schedule that accepts only one kind records the newest proof of its own kind
    governing: 'On a schedule that accepts either compliance data or a practitioner note, the kind of proof that
      governs is decided as follows: when the download that proves continued use has a window that ended within
      the last 90 days, that download governs and a practitioner note is not used; when no such download ended within
      the last 90 days but a re-evaluation documenting benefit is dated within the last 90 days, that note''s visit
      date governs; otherwise the newer of the two is recorded as the standard method sets out.'
    result: When the proof of continued use that governs on the device record is credited with a date newer than
      the continued-use date on the supply enrollment, the enrollment's continued-use date is brought up to that
      credited date; a date that is not newer leaves the enrollment as it is.
  factors:
  - id: use_hours_bar
    effect: parameter
    decides: min_hours
    bindings:
    - dev_status
    - dev_setup
    - class_hours
    - min_hours
    ladder:
    - when: the patient owns the device and its setup was 36 or more months ago
      value: K('hours_long_owner') (1.5 hours)
    - when: the patient owns the device and its setup was less than 36 months ago
      value: K('hours_recent_owner') (3.0 hours)
    - when: otherwise
      value: the device class's compliance minimum hours
    baseline:
      min_hours: class_hours
    evidence:
    - cross_category
    - date
    cross_difficulty: pap
  - id: window_nights_bar
    effect: parameter
    decides: min_nights
    bindings:
    - class_window
    - class_modem
    - pull_lag
    - min_nights
    ladder:
    - when: the device class's compliance is proven only from modem or card data and the download was taken no more
        than 7 days after the last night of its window
      value: K('nights_modem_prompt') (21 nights)
    - when: the device class's compliance is proven only from modem or card data and the download was taken more
        than 7 days after the last night of its window
      value: K('nights_modem_late') (25 nights)
    - when: otherwise
      value: the device class's full compliance window
    baseline:
      min_nights: class_window
    evidence:
    - cross_category
    - date
    cross_difficulty: pap
  - id: four_hour_share_bar
    effect: parameter
    decides: min_share
    bindings:
    - class_pct
    - note_date
    - min_share
    ladder:
    - when: a practitioner re-evaluation documenting benefit is dated within the last 12 months
      value: K('share_recent_note') (40 percent)
    - when: the newest re-evaluation documenting benefit is older than 12 months
      value: K('share_older_note') (55 percent)
    - when: otherwise
      value: the device class's compliance night percentage
    baseline:
      min_share: class_pct
    evidence:
    - cross_category
    - date
    cross_difficulty: pap
  - id: credited_night
    effect: parameter
    decides: dl_credit
    bindings:
    - dl_taken
    - dl_credit
    ladder:
    - when: the newest re-evaluation documenting benefit is dated on or no more than 7 days before the day the download
        was taken
      value: the practitioner visit date
    - when: no such re-evaluation, and the download was taken no more than 7 days after the last night of its window
      value: the date the download was taken
    - when: otherwise
      value: the last night of the download's window
    baseline:
      dl_credit: dl_end
    evidence:
    - cross_category
    - date
    cross_difficulty: pap
  - id: governing_kind
    effect: method
    decides: governing
    bindings:
    - proof_dl_end
    - newest_accepted
    - governing
    ladder:
    - when: on a schedule that accepts either kind, the download that proves continued use has a window that ended
        within the last 90 days
      method: that download governs and a practitioner note is not used
    - when: on a schedule that accepts either kind, no such download ended within the last 90 days and a re-evaluation
        documenting benefit is dated within the last 90 days
      method: that note's visit date governs
    - when: otherwise
      method: the newer of the credited download date and the newest re-evaluation documenting benefit is recorded,
        as the standard method sets out
    baseline:
      governing: newest_accepted
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  inputs:
    history:
    - category: pap
      table: pap_service
      aggregate: latest
      field: window_end_date
      filters:
        event_type: pap_compliance_download
    - category: pap
      table: pap_service
      aggregate: latest
      field: visit_date
      filters:
        event_type: pap_reevaluation_received
        benefit_documented: true
    cross_category:
    - pap
- id: resupply_ext_covered_filter_units
  base_policy_refs:
  - resupply_agg_schedule_match
  - resupply_refill_confirmation
  - resupply_evt_shipment
  - resupply_item_compatibility
  - resupply_shipping
  - resupply_self_pay_pricing
  - resupply_evt_line_reversal
  overwrite:
  - base_policy: resupply_evt_shipment
    superseded_clause: the units shipped on one line cover units divided by qty times months calendar months from
      the ship date, and covers_through_date is the day before the same day of the month that many months later
    replaced_by: For a coverage-billed disposable-filter line booked under this rule, and only for such a line,
      the line covers the months shipped, counted from the ship date, and its covered-through date is the day before
      the same day of the month that many months later; every other line that an item limit dates remains under
      the base covered-period rule, while a no-charge reship, which counts toward no limit, and a standing-order
      line on the Self-Pay Supply Subscription, which has no unit limits, take the covered-through dates their own
      rules state.
  trigger: state_due
  subject:
  - resupply_item_shipped
  computes: quantity
  target_tool: ship_covered_refill_e8c1261e
  params:
    filters_allowance_std: 2
    filters_allowance_ppo: 4
    span_std_months: 1
    span_mid_months: 2
    established_months: 12
    settled_months: 6
    lines_full: 4
    lines_mid: 2
    heavy_use_hours: 5.0
    use_window_months: 6
    standard_rate: 1
    decline_window_months: 2
    decline_near_days: 30
    kept_many_months: 2
    kept_one_month: 1
    many_declines: 2
    full_use_hours: 8
  rule: 'A coverage-billed line of disposable filters (A7038) ships against the patient''s refill confirmation once
    that confirmation reaches the last day it may ship, and its units are worked out as follows. The standard method
    ships one month of filters at one disposable filter a month, so the standard line carries one filter. The months
    a line covers are the schedule''s maximum months per shipment for a patient enrolled 12 or more months whose
    enrollment shows four or more coverage-billed filter lines shipped in the last 12 months, two months for a patient
    enrolled 6 or more months whose enrollment shows two or three such lines, and otherwise one month. How the filters
    per month are worked out depends on the device''s data: when the newest compliance download that met the device
    class''s compliance standard was taken within the last 6 months and shows an average daily use of 5.0 hours
    or more, they are the schedule''s monthly filter allowance, two a month or four a month on the Commercial PPO
    Resupply Schedule; when a compliance download was taken within the last 6 months but that condition is not met,
    they are scaled to measured use, the allowance times the newest download''s average daily use divided by 8 hours,
    rounded up to a whole filter and never more than the allowance; otherwise they are one a month. Months that
    lapsed before the line ships are dropped and never shipped, counted as the whole months from a lapse date to
    the ship date: when the filters on hand ran out before the refill was confirmed, the lapse date is the day the
    filter supply ran out; when they ran out on or after the day the refill was confirmed but before the ship date,
    the lapse date is the confirmation date; otherwise nothing is dropped. The filter supply runs out on the latest
    covered-through date among the enrollment''s coverage-billed filter lines, a line a payer later took back still
    counting because its filters were delivered; this run-out date serves only the months dropped here, and when
    a covered line may ship still follows the base covered-through measure, from which a reversed line drops out.
    Months are also kept back for filters the patient still holds: two months when the enrollment shows two or more
    refill declines dated less than two whole months before the ship date, one month when it shows exactly one such
    decline and that decline is dated on or before the confirmation date and no more than 30 days before it, and
    otherwise none. The months shipped are the months the line covers less the months dropped and the months kept
    back, never below zero, and the units are the months shipped times the filters per month, a whole number. For
    a coverage-billed disposable-filter line booked under this rule, and only for such a line, the line covers the
    months shipped, counted from the ship date, and its covered-through date is the day before the same day of the
    month that many months later; every other line that an item limit dates remains under the base covered-period
    rule, while a no-charge reship, which counts toward no limit, and a standing-order line on the Self-Pay Supply
    Subscription, which has no unit limits, take the covered-through dates their own rules state.'
  baseline:
    rule: The standard method ships one month of filters at one disposable filter a month, so the standard line
      carries one filter.
    params:
    - span_std_months
    - standard_rate
  prerequisite: []
  cross_category:
  - category: pap
    as: history
    reads:
    - pap_service.service_date
    - pap_service.avg_daily_use_hours
    - pap_service.compliance_result
    note: the filters per month are decided from the device record's compliance downloads.
  compute:
  - allowance: K('filters_allowance_ppo') if F('variant_name') == 'Commercial PPO Resupply Schedule' else K('filters_allowance_std')
  - enrolled_m: MONTHS(F('enrollment_date'), NOW)
  - filter_lines_12: COUNT('resupply_shipments', within_months=12, date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code='A7038')
  - span: P('max_months_per_shipment') if (enrolled_m >= K('established_months') and filter_lines_12 >= K('lines_full'))
      else (K('span_mid_months') if (enrolled_m >= K('settled_months') and filter_lines_12 >= K('lines_mid') and
      filter_lines_12 < K('lines_full')) else K('span_std_months'))
  - met_taken: XLATEST('pap', 'pap_service', 'service_date', date_field='service_date', event_type='pap_compliance_download',
      compliance_result='met') or '0000-01-01'
  - met_avg: XLATEST('pap', 'pap_service', 'avg_daily_use_hours', date_field='service_date', event_type='pap_compliance_download',
      compliance_result='met') or 0
  - downloads_6: XCOUNT('pap', 'pap_service', within_months=6, date_field='service_date', event_type='pap_compliance_download')
  - newest_avg: XLATEST('pap', 'pap_service', 'avg_daily_use_hours', date_field='service_date', event_type='pap_compliance_download')
      or 0
  - rate: allowance if (MONTHS(met_taken, NOW) < K('use_window_months') and met_avg >= K('heavy_use_hours')) else
      (MN(allowance, -((-(allowance * newest_avg)) // K('full_use_hours'))) if downloads_6 > 0 else K('standard_rate'))
  - ran_out: LATEST('resupply_shipments', 'covers_through_date', date_field='covers_through_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code='A7038') or NOW
  - confirmed_on: LATEST('resupply_contacts', 'contact_date', date_field='contact_date', event_type='resupply_refill_confirmed')
      or NOW
  - dropped: MONTHS(ran_out, NOW) if ran_out < confirmed_on else (MONTHS(confirmed_on, NOW) if ran_out < NOW else
      0)
  - declines_2: COUNT('resupply_contacts', within_months=K('decline_window_months'), date_field='contact_date',
      event_type='resupply_refill_declined')
  - last_decline: LATEST('resupply_contacts', 'contact_date', date_field='contact_date', event_type='resupply_refill_declined')
      or '0000-01-01'
  - kept_back: K('kept_many_months') if declines_2 >= K('many_declines') else (K('kept_one_month') if (declines_2
      == 1 and last_decline <= confirmed_on and DAYS(last_decline, confirmed_on) <= K('decline_near_days')) else
      0)
  - months_shipped: MX(0, span - dropped - kept_back)
  - result: int(months_shipped * rate)
  compute_basis:
    allowance: the schedule's monthly filter allowance, two a month or four a month on the Commercial PPO Resupply
      Schedule
    enrolled_m: for a patient enrolled 12 or more months whose enrollment shows four or more coverage-billed filter
      lines shipped in the last 12 months
    filter_lines_12: four or more coverage-billed filter lines shipped in the last 12 months
    span: The months a line covers are the schedule's maximum months per shipment for a patient enrolled 12 or more
      months whose enrollment shows four or more coverage-billed filter lines shipped in the last 12 months, two
      months for a patient enrolled 6 or more months whose enrollment shows two or three such lines, and otherwise
      one month.
    met_taken: when the newest compliance download that met the device class's compliance standard was taken within
      the last 6 months
    met_avg: and shows an average daily use of 5.0 hours or more
    downloads_6: when a compliance download was taken within the last 6 months but that condition is not met
    newest_avg: the allowance times the newest download's average daily use divided by 8 hours
    rate: 'How the filters per month are worked out depends on the device''s data: when the newest compliance download
      that met the device class''s compliance standard was taken within the last 6 months and shows an average daily
      use of 5.0 hours or more, they are the schedule''s monthly filter allowance, two a month or four a month on
      the Commercial PPO Resupply Schedule; when a compliance download was taken within the last 6 months but that
      condition is not met, they are scaled to measured use, the allowance times the newest download''s average
      daily use divided by 8 hours, rounded up to a whole filter and never more than the allowance; otherwise they
      are one a month.'
    ran_out: The filter supply runs out on the latest covered-through date among the enrollment's coverage-billed
      filter lines, a line a payer later took back still counting because its filters were delivered; this run-out
      date serves only the months dropped here, and when a covered line may ship still follows the base covered-through
      measure, from which a reversed line drops out.
    confirmed_on: ships against the patient's refill confirmation once that confirmation reaches the last day it
      may ship
    dropped: when the filters on hand ran out before the refill was confirmed, the lapse date is the day the filter
      supply ran out; when they ran out on or after the day the refill was confirmed but before the ship date, the
      lapse date is the confirmation date; otherwise nothing is dropped
    declines_2: two months when the enrollment shows two or more refill declines dated less than two whole months
      before the ship date
    last_decline: one month when it shows exactly one such decline and that decline is dated on or before the confirmation
      date and no more than 30 days before it
    kept_back: 'Months are also kept back for filters the patient still holds: two months when the enrollment shows
      two or more refill declines dated less than two whole months before the ship date, one month when it shows
      exactly one such decline and that decline is dated on or before the confirmation date and no more than 30
      days before it, and otherwise none.'
    months_shipped: The months shipped are the months the line covers less the months dropped and the months kept
      back, never below zero
    result: the units are the months shipped times the filters per month, a whole number
  factors:
  - id: line_span
    effect: parameter
    decides: span
    bindings:
    - enrolled_m
    - filter_lines_12
    - span
    ladder:
    - when: the patient has been enrolled 12 or more months and the enrollment shows four or more coverage-billed
        filter lines in the last 12 months
      value: P('max_months_per_shipment')
    - when: the patient has been enrolled 6 or more months and the enrollment shows two or three coverage-billed
        filter lines in the last 12 months
      value: K('span_mid_months') (two months)
    - when: otherwise
      value: K('span_std_months') (one month)
    baseline:
      span: K('span_std_months')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: monthly_filter_rate
    effect: method
    decides: rate
    bindings:
    - met_taken
    - met_avg
    - downloads_6
    - newest_avg
    - rate
    ladder:
    - when: the newest compliance download that met the class standard was taken within the last 6 months and shows
        an average daily use of 5.0 hours or more
      method: the schedule's monthly filter allowance is shipped as it stands
    - when: a compliance download was taken within the last 6 months but the first condition is not met
      method: 'the allowance is scaled to measured use: allowance times the newest download''s average daily hours
        over 8, rounded up, capped at the allowance'
    - when: otherwise
      method: a fixed one filter a month
    baseline:
      rate: K('standard_rate')
    evidence:
    - cross_category
    - date
    cross_difficulty: pap
  - id: lapsed_month_anchor
    effect: parameter
    decides: dropped
    bindings:
    - ran_out
    - confirmed_on
    - dropped
    ladder:
    - when: the filters ran out before the refill was confirmed
      value: the whole months from the run-out day to the ship date
    - when: the filters ran out on or after the confirmation date but before the ship date
      value: the whole months from the confirmation date to the ship date
    - when: otherwise
      value: no months dropped
    baseline:
      dropped: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: held_supply_months
    effect: parameter
    decides: kept_back
    bindings:
    - declines_2
    - last_decline
    - kept_back
    ladder:
    - when: two or more refill declines dated less than two whole months before the ship date
      value: 2 months kept back
    - when: exactly one such decline, dated on or before the confirmation date and no more than 30 days before it
      value: 1 month kept back
    - when: otherwise
      value: 0 months kept back
    baseline:
      kept_back: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  inputs:
    history:
    - table: resupply_shipments
      aggregate: count
      field: quantity
      within_months: 12
      filters:
        event_type: resupply_item_shipped
        billing_basis: coverage
        hcpcs_code: A7038
    - table: resupply_contacts
      aggregate: count
      field: contact_date
      within_months: 2
      filters:
        event_type: resupply_refill_declined
    - category: pap
      table: pap_service
      aggregate: latest
      field: avg_daily_use_hours
      filters:
        event_type: pap_compliance_download
        compliance_result: met
    cross_category:
    - pap
- id: resupply_ext_wrong_cushion_reship_units
  base_policy_refs:
  - resupply_replacement_rules
  overwrite: []
  trigger: state_due
  subject:
  - resupply_no_charge_replacement
  computes: quantity
  target_tool: send_no_charge_replacement_8a217fc0
  params:
    full_face_rate: 1
    full_face_rate_ppo: 2
    nasal_rate: 2
    cushion_rate_medicaid: 1
    quick_days: 30
    late_days: 90
    error_window_months: 12
    repeat_many: 2
    repeat_many_months: 2
    repeat_one_month: 1
    without_long_days: 60
    without_short_days: 30
    spare_long_units: 2
    spare_short_units: 1
  rule: 'When a coverage-billed line shipped a cushion item that does not fit the mask style recorded on the enrollment
    (a full face cushion, a nasal cushion or nasal pillows other than the one the recorded style uses), Summit Ridge
    owes the patient a no-charge reship of the fitting cushion item for the style recorded, replacing that line
    with replacement reason wrong_item. The reship carries the period of the line it replaces: its covered-through
    date is the replaced line''s covered-through date. The standard method reships the same item count as the line
    it replaces: the replaced line''s own monthly rate times the months counted from a start date to the replaced
    line''s covered-through date, the start date being the replaced line''s ship date and the months being the whole
    calendar months between the two dates plus one for the month the start date falls in. The months a line covered
    are the whole calendar months from its ship date to its covered-through date, plus one for the month it began
    in, and its monthly rate is its units divided by those months. The monthly rate of the reship is the fitting
    item''s monthly allowance under the schedule when the fitting item''s latest coverage-billed line carried at
    least that allowance a month, that latest line''s own monthly rate when it carried less, and otherwise the replaced
    line''s own monthly rate; the fitting item''s monthly allowance is one a month for a full face cushion, two
    a month on the Commercial PPO Resupply Schedule, two a month for a nasal cushion or nasal pillows, and one a
    month for any cushion item on the Medicaid Resupply Schedule. How the months from the start date are counted
    depends on when the error is handled: when it is handled 31 to 90 days after the replaced line shipped, only
    the whole calendar months from the start date to the replaced line''s covered-through date count; when it is
    handled more than 90 days after, no months count; otherwise the whole calendar months count plus one for the
    month the start date falls in. The start date is the handling day when the fitting item''s earlier supply had
    already run out before the handling day, the day that earlier supply runs out when it is still running on the
    handling day, and otherwise the replaced line''s ship date. Months are added for a patient Summit Ridge has
    already let down: two months when the enrollment shows two or more no-charge reships for wrong_item or carrier_lost
    in the last 12 months before this one, one month when it shows exactly one, and otherwise none. Spare units
    are added for the time the patient went without the fitting item, counted in days from the day the fitting item''s
    earlier supply ran out to the handling day: two units for 60 days or more, one unit for 30 to 59 days, and otherwise
    none. The units reshipped are the monthly rate times the sum of the months covered and the months added, plus
    the spare units, rounded to the nearest whole unit with a half rounding up.'
  baseline:
    rule: 'The standard method reships the same item count as the line it replaces: the replaced line''s own monthly
      rate times the months counted from a start date to the replaced line''s covered-through date, the start date
      being the replaced line''s ship date and the months being the whole calendar months between the two dates
      plus one for the month the start date falls in. The months a line covered are the whole calendar months from
      its ship date to its covered-through date, plus one for the month it began in, and its monthly rate is its
      units divided by those months.'
    params: []
  prerequisite: []
  cross_category: []
  compute:
  - style: F('mask_style')
  - fitting: '''A7031'' if style == ''full_face'' else (''A7032'' if style == ''nasal'' else ''A7033'')'
  - other_a: '''A7032'' if fitting == ''A7031'' else ''A7031'''
  - other_b: '''A7032'' if fitting == ''A7033'' else ''A7033'''
  - other_a_ship: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code=other_a) or '0000-01-01'
  - other_b_ship: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code=other_b) or '0000-01-01'
  - wrong_code: other_a if other_a_ship >= other_b_ship else other_b
  - wrong_ship: MX(other_a_ship, other_b_ship)
  - wrong_qty: LATEST('resupply_shipments', 'quantity', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code=wrong_code)
  - wrong_end: LATEST('resupply_shipments', 'covers_through_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code=wrong_code)
  - wrong_months: MONTHS(wrong_ship, wrong_end) + 1
  - wrong_rate: wrong_qty / wrong_months
  - prev_qty: LATEST('resupply_shipments', 'quantity', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code=fitting) or 0
  - prev_ship: LATEST('resupply_shipments', 'service_from_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code=fitting) or '0000-01-01'
  - prev_end: LATEST('resupply_shipments', 'covers_through_date', date_field='service_from_date', event_type='resupply_item_shipped',
      billing_basis='coverage', hcpcs_code=fitting) or '0000-01-01'
  - prev_rate: prev_qty / (MONTHS(prev_ship, prev_end) + 1) if prev_qty > 0 else 0
  - allowance_fit: K('cushion_rate_medicaid') if F('variant_name') == 'Medicaid Resupply Schedule' else (K('full_face_rate_ppo')
      if (F('variant_name') == 'Commercial PPO Resupply Schedule' and fitting == 'A7031') else (K('full_face_rate')
      if fitting == 'A7031' else K('nasal_rate')))
  - reship_rate: allowance_fit if (prev_qty > 0 and prev_rate >= allowance_fit) else (prev_rate if (prev_qty > 0
      and prev_rate < allowance_fit) else wrong_rate)
  - handled_after: DAYS(wrong_ship, NOW)
  - start_date: NOW if (prev_end != '0000-01-01' and prev_end < NOW) else (prev_end if (prev_end != '0000-01-01'
      and prev_end >= NOW) else wrong_ship)
  - months_covered: MONTHS(start_date, wrong_end) if (handled_after > K('quick_days') and handled_after <= K('late_days'))
      else (0 if handled_after > K('late_days') else MONTHS(start_date, wrong_end) + 1)
  - earlier_errors: COUNT('resupply_shipments', within_months=K('error_window_months'), date_field='service_from_date',
      event_type='resupply_no_charge_replacement', replacement_reason='wrong_item') + COUNT('resupply_shipments',
      within_months=K('error_window_months'), date_field='service_from_date', event_type='resupply_no_charge_replacement',
      replacement_reason='carrier_lost')
  - months_added: K('repeat_many_months') if earlier_errors >= K('repeat_many') else (K('repeat_one_month') if earlier_errors
      == 1 else 0)
  - days_without: DAYS(prev_end, NOW) if prev_end != '0000-01-01' else 0
  - spare_units: K('spare_long_units') if days_without >= K('without_long_days') else (K('spare_short_units') if
      (days_without >= K('without_short_days') and days_without < K('without_long_days')) else 0)
  - result: int(reship_rate * (months_covered + months_added) + spare_units + 0.5)
  compute_basis:
    style: a cushion item that does not fit the mask style recorded on the enrollment
    fitting: the fitting cushion item for the style recorded
    other_a: a full face cushion, a nasal cushion or nasal pillows other than the one the recorded style uses
    other_b: a full face cushion, a nasal cushion or nasal pillows other than the one the recorded style uses
    other_a_ship: When a coverage-billed line shipped a cushion item that does not fit the mask style recorded on
      the enrollment
    other_b_ship: When a coverage-billed line shipped a cushion item that does not fit the mask style recorded on
      the enrollment
    wrong_code: replacing that line with replacement reason wrong_item
    wrong_ship: the replaced line's ship date
    wrong_qty: its monthly rate is its units divided by those months
    wrong_end: its covered-through date is the replaced line's covered-through date
    wrong_months: The months a line covered are the whole calendar months from its ship date to its covered-through
      date, plus one for the month it began in
    wrong_rate: its monthly rate is its units divided by those months
    prev_qty: when the fitting item's latest coverage-billed line carried at least that allowance a month
    prev_ship: when the fitting item's latest coverage-billed line carried at least that allowance a month
    prev_end: the day that earlier supply runs out when it is still running on the handling day
    prev_rate: that latest line's own monthly rate when it carried less
    allowance_fit: the fitting item's monthly allowance is one a month for a full face cushion, two a month on the
      Commercial PPO Resupply Schedule, two a month for a nasal cushion or nasal pillows, and one a month for any
      cushion item on the Medicaid Resupply Schedule
    reship_rate: The monthly rate of the reship is the fitting item's monthly allowance under the schedule when
      the fitting item's latest coverage-billed line carried at least that allowance a month, that latest line's
      own monthly rate when it carried less, and otherwise the replaced line's own monthly rate
    handled_after: when it is handled 31 to 90 days after the replaced line shipped
    start_date: The start date is the handling day when the fitting item's earlier supply had already run out before
      the handling day, the day that earlier supply runs out when it is still running on the handling day, and otherwise
      the replaced line's ship date.
    months_covered: 'How the months from the start date are counted depends on when the error is handled: when it
      is handled 31 to 90 days after the replaced line shipped, only the whole calendar months from the start date
      to the replaced line''s covered-through date count; when it is handled more than 90 days after, no months
      count; otherwise the whole calendar months count plus one for the month the start date falls in.'
    earlier_errors: two or more no-charge reships for wrong_item or carrier_lost in the last 12 months before this
      one
    months_added: 'Months are added for a patient Summit Ridge has already let down: two months when the enrollment
      shows two or more no-charge reships for wrong_item or carrier_lost in the last 12 months before this one,
      one month when it shows exactly one, and otherwise none.'
    days_without: counted in days from the day the fitting item's earlier supply ran out to the handling day
    spare_units: 'Spare units are added for the time the patient went without the fitting item, counted in days
      from the day the fitting item''s earlier supply ran out to the handling day: two units for 60 days or more,
      one unit for 30 to 59 days, and otherwise none.'
    result: The units reshipped are the monthly rate times the sum of the months covered and the months added, plus
      the spare units, rounded to the nearest whole unit with a half rounding up.
  factors:
  - id: reship_monthly_rate
    effect: parameter
    decides: reship_rate
    bindings:
    - prev_qty
    - prev_ship
    - prev_rate
    - allowance_fit
    - reship_rate
    ladder:
    - when: the fitting item's latest coverage-billed line carried at least the schedule's monthly allowance for
        that item
      value: the fitting item's monthly allowance under the schedule
    - when: the fitting item's latest coverage-billed line carried less than that allowance a month
      value: that latest line's own monthly rate
    - when: otherwise
      value: the replaced line's own monthly rate
    baseline:
      reship_rate: wrong_rate
    evidence:
    - history
    cross_difficulty: null
  - id: period_share
    effect: method
    decides: months_covered
    bindings:
    - handled_after
    - months_covered
    ladder:
    - when: the error is handled 31 to 90 days after the replaced line shipped
      method: only the whole calendar months from the start date to the replaced line's covered-through date count
    - when: the error is handled more than 90 days after the replaced line shipped
      method: no months count
    - when: otherwise
      method: the whole calendar months count plus one for the month the start date falls in
    baseline:
      months_covered: MONTHS(start_date, wrong_end) + 1
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: remainder_start
    effect: parameter
    decides: start_date
    bindings:
    - prev_end
    - start_date
    ladder:
    - when: the fitting item's earlier supply had already run out before the handling day
      value: the handling day
    - when: the fitting item's earlier supply is still running on the handling day
      value: the day that earlier supply runs out
    - when: otherwise
      value: the replaced line's ship date
    baseline:
      start_date: wrong_ship
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: letdown_months
    effect: parameter
    decides: months_added
    bindings:
    - earlier_errors
    - months_added
    ladder:
    - when: two or more no-charge reships for wrong_item or carrier_lost in the last 12 months
      value: K('repeat_many_months') (two months)
    - when: exactly one such reship in the last 12 months
      value: K('repeat_one_month') (one month)
    - when: otherwise
      value: no months
    baseline:
      months_added: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: went_without_spares
    effect: parameter
    decides: spare_units
    bindings:
    - days_without
    - spare_units
    ladder:
    - when: the patient went 60 days or more without the fitting item
      value: K('spare_long_units') (two units)
    - when: the patient went 30 to 59 days without the fitting item
      value: K('spare_short_units') (one unit)
    - when: otherwise
      value: no spare units
    baseline:
      spare_units: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  inputs:
    history:
    - table: resupply_shipments
      aggregate: latest
      field: quantity
      filters:
        event_type: resupply_item_shipped
        billing_basis: coverage
    - table: resupply_shipments
      aggregate: count
      field: replacement_reason
      within_months: 12
      filters:
        event_type: resupply_no_charge_replacement
    cross_category: []
- id: resupply_ext_refill_request_items
  base_policy_refs:
  - resupply_refill_confirmation
  - resupply_evt_line_reversal
  overwrite:
  - base_policy: resupply_refill_confirmation
    superseded_clause: A refill is confirmed only on the patient's own statement of the items wanted and their supply
      status.
    replaced_by: For a refill request the patient places on a phone call, and only for such a request, a refill
      is confirmed on the patient's own answer in the call, asking for the items that are due and reporting their
      supply as nearly exhausted, and the items it records are the request's item list; every other refill confirmation
      remains under the base rule.
  trigger: on_request
  subject:
  - resupply_refill_confirmed
  computes: items_requested
  target_tool: confirm_refill_request_b3535d21
  params:
    steady_confirms: 4
    mixed_confirms: 2
    lead_steady_days: 5
    lead_mixed_days: 3
    fresh_proof_days: 30
    recent_proof_months: 6
    lead_fresh_proof_days: 5
    lead_recent_proof_days: 2
    long_months: 60
    mid_months: 24
    lead_long_days: 4
    lead_mid_days: 2
  rule: 'A refill request records the patient''s own request for PAP supply items, and its item list is worked out
    from the enrollment''s records. For a refill request the patient places on a phone call, and only for such a
    request, a refill is confirmed on the patient''s own answer in the call, asking for the items that are due and
    reporting their supply as nearly exhausted, and the items it records are the request''s item list; every other
    refill confirmation remains under the base rule. A request is placed on a phone call only on a schedule whose
    accepted channels include phone calls; on a schedule that accepts no phone call, such as the Self-Pay Supply
    Subscription, no request is recorded on the call. The items of the recorded equipment are the interface and
    cushion item of the recorded mask style (a full face mask with full face cushions, or a nasal interface with
    nasal cushions or with nasal pillows), headgear, the tubing in use (heated tubing when heated tubing is in use,
    otherwise standard tubing), disposable filters, and a water chamber when a humidifier is in use. The standard
    method lists each item of the recorded equipment whose supply runs out no more than the schedule''s ship-window
    days after the request, its supply running out on the latest covered-through date among its coverage-billed
    lines, a line a payer later took back still counting because its items were delivered; an item never shipped
    is not listed. The item list is written as HCPCS codes in ascending order separated by commas. How no-charge
    lines count toward an item''s supply: when the enrollment shows a no-charge reship for wrong_item or carrier_lost,
    an item''s no-charge lines count at their own covered-through date; when it shows only no-charge replacements
    for manufacturer_defect or mask_fit_exchange, an item''s latest no-charge line counts at the covered-through
    date of the line it replaced; otherwise no-charge lines do not count. How cash purchases count toward an item''s
    supply: when the enrollment shows a self-pay line for an item of the recorded equipment, each such item''s latest
    self-pay line counts at its covered-through date; when it shows no self-pay line for an item of the recorded
    equipment but shows one for the tubing type not in use, that line counts toward the tubing in use; otherwise
    self-pay lines do not count. An item''s supply runs out on the latest of the dates that count toward it. An
    item is listed when its supply runs out no more than the horizon after the request, the horizon being the schedule''s
    ship-window days plus the lead days. The lead days add up three allowances: for answering refill reminders,
    five days for a patient with four or more refill confirmations and no refill decline in the last 6 months, three
    days for a patient with two or more refill confirmations and exactly one refill decline in the last 6 months,
    and otherwise none; for a fresh proof of continued use, five days when the enrollment''s continued-use date
    is no more than 30 days old, two days when it is older than that but less than 6 months old, and otherwise none;
    and for time on the program, four days for a patient enrolled 60 or more months, two days for one enrolled 24
    to 59 months, and otherwise none. The item list is fixed only after every earlier refill confirmation naming
    disposable filters whose last shipping day falls on the day of the request stands answered by a coverage-billed
    disposable-filter line shipped on or after its contact date. No item list is fixed until the newest coverage-billed
    line that shipped a cushion item not fitting the recorded mask style stands answered by a no-charge reship of
    the fitting cushion item. The item list is fixed only after the enrollment''s continued-use date is no older
    than the credited date of the proof of continued use that governs on the device record. These supply dates serve
    the item list only and do not change when a coverage-billed line may ship.'
  baseline:
    rule: The items of the recorded equipment are the interface and cushion item of the recorded mask style (a full
      face mask with full face cushions, or a nasal interface with nasal cushions or with nasal pillows), headgear,
      the tubing in use (heated tubing when heated tubing is in use, otherwise standard tubing), disposable filters,
      and a water chamber when a humidifier is in use. The standard method lists each item of the recorded equipment
      whose supply runs out no more than the schedule's ship-window days after the request, its supply running out
      on the latest covered-through date among its coverage-billed lines, a line a payer later took back still counting
      because its items were delivered; an item never shipped is not listed. The item list is written as HCPCS codes
      in ascending order separated by commas.
    params:
    - ship_no_earlier_days
  prerequisite:
  - problem: resupply_ext_covered_filter_units
    kind: value_input
    gate: cov_filt
    form: state
    policy_source: The item list is fixed only after every earlier refill confirmation naming disposable filters
      whose last shipping day falls on the day of the request stands answered by a coverage-billed disposable-filter
      line shipped on or after its contact date.
    condition: every refill confirmation on the enrollment that names A7038 and whose last shipping day (its contact
      date plus the schedule's refill lead days) is the handling day is followed, on or after its contact date,
      by a coverage-billed A7038 shipped line
    resolved_by: ship_covered_refill_e8c1261e
    effect: the item's latest coverage-billed covered-through date moves out to the end of the new line, so an item
      the confirmation named stops counting as due when the new request's horizon is applied
  - problem: resupply_ext_wrong_cushion_reship_units
    kind: value_input
    gate: nc_cush
    form: state
    policy_source: No item list is fixed until the newest coverage-billed line that shipped a cushion item not fitting
      the recorded mask style stands answered by a no-charge reship of the fitting cushion item.
    condition: the newest coverage-billed cushion line whose item does not fit the recorded mask style is named
      as original line by a no-charge replacement with replacement reason wrong_item
    resolved_by: send_no_charge_replacement_8a217fc0
    effect: the fitting cushion item gains a no-charge line whose covered-through date counts toward its supply,
      so it stops counting as due
  - problem: resupply_ext_continued_use_proof_date
    kind: value_input
    gate: lead_proof
    form: state
    policy_source: The item list is fixed only after the enrollment's continued-use date is no older than the credited
      date of the proof of continued use that governs on the device record.
    condition: the enrollment's last_continued_use_date is on or after the date the continued-use proof rule credits
      to the governing proof on the device record
    resolved_by: record_continued_use_proof_c97fce72
    effect: the continued-use date becomes recent, which raises the proof-recency lead days and widens the horizon
  cross_category: []
