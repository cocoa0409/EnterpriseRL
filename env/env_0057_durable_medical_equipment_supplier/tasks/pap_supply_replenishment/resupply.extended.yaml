# Extended product charter for the pap_supply_replenishment difficulty (category resupply).
# Base section copied verbatim from blueprint/products/resupply.yaml; extended_policies added below.
category: resupply
display_name: PAP Supply Replenishment Program
binding:
  holding_table: resupply_holdings
  event_tables:
  - resupply_shipments
  - resupply_contacts
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - enrolled_pending
  - active
  - on_hold
  - cancelled
  transitions:
  - from: enrolled_pending
    to: active
    by: agent
    means: Device, order, continued use and coverage are verified and shipments may start.
  - from: enrolled_pending
    to: cancelled
    by: user
    means: The patient declines the enrollment before the first shipment.
  - from: active
    to: on_hold
    by: agent
    means: Shipments stop for a recorded hold reason.
  - from: on_hold
    to: active
    by: agent
    means: The hold reason is cleared and shipments may resume.
  - from: active
    to: cancelled
    by: user
    means: The patient opts out of the program.
  - from: on_hold
    to: cancelled
    by: user
    means: The patient opts out while on hold.
  - from: on_hold
    to: cancelled
    by: agent
    means: The hold is not cleared within the allowed time and the enrollment is closed.
accounts: []
parameter_schema:
  payer_class_match: Coverage payer class(es) whose primary record this schedule must follow (string)
  limit_a7030_full_face_mask: 'Full face mask A7030: units allowed per period ({qty, months}; qty 0 means no limit)'
  limit_a7031_full_face_cushion: 'Full face mask cushion A7031: units allowed per period ({qty, months})'
  limit_a7034_nasal_interface: 'Nasal mask or pillows interface A7034: units allowed per period ({qty, months})'
  limit_a7032_nasal_cushion: 'Nasal mask cushion A7032: units allowed per period ({qty, months})'
  limit_a7033_pillow_pair: 'Nasal pillows pair A7033: units allowed per period ({qty, months})'
  limit_a7035_headgear: 'Headgear A7035: units allowed per period ({qty, months})'
  limit_a7036_chinstrap: 'Chinstrap A7036: units allowed per period ({qty, months})'
  limit_a7037_tubing: 'Standard tubing A7037: units allowed per period ({qty, months})'
  limit_a4604_heated_tubing: 'Heated tubing A4604: units allowed per period ({qty, months})'
  limit_a7038_disposable_filter: 'Disposable filter A7038: units allowed per period ({qty, months})'
  limit_a7039_reusable_filter: 'Non-disposable filter A7039: units allowed per period ({qty, months})'
  limit_a7046_water_chamber: 'Humidifier water chamber A7046: units allowed per period ({qty, months})'
  schedule_period_basis: 'How an item''s period is measured (enum: rolling_from_last_service_date, none)'
  item_fee_schedule: Fee-schedule amount per unit of each supply item before the coverage class's allowed percentage
    (map HCPCS -> USD)
  self_pay_item_prices: Cash price per unit of each supply item on a self-pay line (map HCPCS -> USD)
  subscription_discount_pct: Discount on self-pay item prices for patients on the self-pay subscription (percent)
  beyond_schedule_self_pay_allowed: Whether items beyond the schedule may be sold to the patient at self-pay prices
    (boolean)
  refill_contact_lead_days: Most calendar days a refill confirmation may precede the ship date it supports (days)
  ship_no_earlier_days: Most calendar days before the covers_through_date of the item's last shipped line that a
    new shipment of that item may go out (days)
  auto_ship_allowed: Whether shipments may go out without a fresh refill confirmation for each cycle (boolean)
  quantity_on_hand_check_required: Whether the patient must confirm the supply on hand is nearly exhausted before
    each shipment (boolean)
  contact_channels_allowed: 'Channels through which a refill confirmation is accepted (list of enum: phone_call,
    text_message, patient_portal, email)'
  max_months_per_shipment: Most months of supply one shipment of an item may cover (months)
  missed_cycle_backfill_allowed: Whether quantities not shipped in an earlier period may be added to a later shipment
    (boolean)
  early_ship_for_travel_days: Extra calendar days a shipment may go out early when the patient will be traveling
    (days); 0 when not allowed
  rx_validity_months: Calendar months a written supply order stays usable (months)
  continued_use_proof_months: Calendar months the latest proof of continued use stays sufficient (months); 0 when
    no proof is needed
  continued_use_basis: 'What counts as proof of continued use (enum: compliance_data_or_practitioner_note, practitioner_note_only,
    compliance_data_only, none)'
  supplies_prior_auth_required: Whether the schedule needs an affirmed prior authorization covering supplies (boolean)
  supplies_pa_validity_months: Calendar months a supplies prior authorization stays in force (months); 0 when none
    is needed
  interface_type_change_limited: Whether an interface of a different style inside the current interface period is
    not covered (boolean)
  max_interface_exchanges_per_period: No-charge mask-fit exchanges allowed per new interface shipped (count)
  mask_fit_exchange_days: Calendar days after a new interface ships within which one no-charge fit exchange is allowed
    (days)
  defect_replacement_days: Calendar days after a line ships within which a defective item is replaced at no charge
    (days)
  defect_replacement_counts_toward_limit: Whether a no-charge replacement counts toward the item's schedule limit
    (boolean)
  lost_package_trace_business_days: Business days without delivery confirmation after which a lost shipment is reshipped
    at no charge (days)
  heated_tubing_excludes_standard: Whether heated and standard tubing are mutually exclusive within one period (boolean)
  humidifier_chamber_requires_humidifier: Whether a water chamber ships only to patients using a heated humidifier
    (boolean)
  ground_shipping_fee: Charge for ground shipping (USD)
  self_pay_free_shipping_min: Self-pay order value at or above which ground shipping is free (USD); 0.00 when ground
    is always free
  expedited_shipping_fee: Patient-paid charge for expedited shipping, never billed to coverage (USD)
  ground_transit_business_days: Business days ground shipping takes (days)
  expedited_transit_business_days: Business days expedited shipping takes (days)
  branch_pickup_allowed: Whether the patient may collect the shipment at a branch (boolean)
  inpatient_hold_applies: Whether shipments stop while the patient is an inpatient or in skilled nursing (boolean)
  hold_max_days: Calendar days an enrollment may stay on hold before it is cancelled (days)
  outside_device_proof_required: Whether a device furnished by another supplier needs proof that it was covered
    or owned (purchase record or prior supplier letter) before enrollment (boolean)
