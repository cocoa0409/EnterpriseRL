    use only from a compliance download or practitioner note of the kind `continued_use_basis` accepts; a patient's
    own account of use is never proof. Recording either clears an order_expired or continued_use_lapsed hold. The
    automatic-shipment choice is the patient's own and is set only where `auto_ship_allowed` is true; turning it
    off takes effect for the next cycle.
