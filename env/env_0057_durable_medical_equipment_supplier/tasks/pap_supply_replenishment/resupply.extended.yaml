- id: resupply_hold_rules
  subject:
  - resupply_hold
  - resupply_release
  - resupply_hold_expire
  - resupply_opt_out
  - resupply_enroll_decline
  rule: An active enrollment goes on hold with the matching hold_reason when the patient is an inpatient or in skilled
    nursing (where `inpatient_hold_applies` is true), the supply order is older than `rx_validity_months`, the proof
    of continued use is older than `continued_use_proof_months`, the primary coverage cannot be verified, or the
    Summit Ridge device record is returned. No item ships during a hold, and the period of an item does not pause
    during it. The hold is released when its reason is cleared. An enrollment on hold is closed only after the hold
    has lasted `hold_max_days` days, counting calendar days from the day after hold_date with the boundary day included.
    The patient may decline or opt out at any time by their own confirmation; items already shipped are not returned.
  eligibility:
  - id: hold_lasted
    applies_to:
    - resupply_hold_expire
    kind: time
    condition: An enrollment on hold is closed only after the hold has lasted `hold_max_days` days, counting calendar
      days from the day after hold_date with the boundary day included.
    evidence_fields:
    - resupply_holdings.hold_date
    - resupply_holdings.resupply_holding_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - resupply_holdings.resupply_holding_id
      action_bindings:
        resupply_holdings.resupply_holding_id: resupply_holding_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold has lasted
      anchor_source: resupply_holdings.hold_date
      relation: not_before
      duration_source: variants.hold_max_days
      unit: calendar_days
      counting_rule: counting calendar days from the day after hold_date with the boundary day included
      boundary: inclusive
  params:
    per_tier:
      Medicare Part B Resupply Schedule:
        inpatient: =inpatient_hold_applies
        hold_days: =hold_max_days
        rx_months: =rx_validity_months
        use_proof_months: =continued_use_proof_months
      Medicare Advantage Resupply Schedule:
        inpatient: =inpatient_hold_applies
        hold_days: =hold_max_days
        rx_months: =rx_validity_months
        use_proof_months: =continued_use_proof_months
      Medicaid Resupply Schedule:
        inpatient: =inpatient_hold_applies
        hold_days: =hold_max_days
        rx_months: =rx_validity_months
        use_proof_months: =continued_use_proof_months
      Commercial HMO Resupply Schedule:
        inpatient: =inpatient_hold_applies
        hold_days: =hold_max_days
        rx_months: =rx_validity_months
        use_proof_months: =continued_use_proof_months
      Commercial PPO Resupply Schedule:
        inpatient: =inpatient_hold_applies
        hold_days: =hold_max_days
        rx_months: =rx_validity_months
        use_proof_months: =continued_use_proof_months
      Self-Pay Supply Subscription:
        inpatient: =inpatient_hold_applies
        hold_days: =hold_max_days
        rx_months: =rx_validity_months
        use_proof_months: =continued_use_proof_months
