- id: resupply_item_compatibility
  subject:
  - resupply_item_shipped
  - resupply_preference_update
  rule: 'Items must fit the equipment recorded on the enrollment. A full_face patient receives A7030 and A7031;
    a nasal patient receives A7034 and A7032; a nasal_pillows patient receives A7034 and A7033; A7036 ships only
    to nasal and nasal_pillows patients. Where `heated_tubing_excludes_standard` is true, A4604 and A7037 never
    both ship inside one tubing period: heated_tubing_in_use decides which one. Where `humidifier_chamber_requires_humidifier`
    is true, A7046 ships only when humidifier_in_use is true. Where `interface_type_change_limited` is true, an
    interface of a different style shipped before resupply_msr_last_interface''s covers_through_date is not billed
    to coverage (the patient may buy it self-pay) unless it is the fit exchange allowed under resupply_replacement_rules.
    A change of style is recorded as a preference update before items of the new style ship.'
