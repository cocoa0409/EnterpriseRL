  - fx_a7033: COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date', event_type='resupply_no_charge_replacement',
      replacement_reason='mask_fit_exchange', hcpcs_code='A7033')
  - al_a7033: COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date', event_type='resupply_item_shipped',
      hcpcs_code='A7033') + COUNT('resupply_shipments', within_months=span_months, date_field='service_from_date',
