events:
  - type: pap_order_create
    target: pap_holdings
    mutation: create
    meaning: A written PAP order arrives from a referral partner (or a self-pay patient's prescription) and a device record is opened.
    grain: one row per device order
    fields:
      customer_id: patient the device is ordered for
      variant_name: device class ordered
      coverage_id: primary coverage to be billed; empty for self-pay
      ordering_npi: NPI of the ordering practitioner
      referral_source: kind of referral partner
      order_date: date the order was received
      qualifying_test_date: date of the qualifying sleep test
      qualifying_ahi: AHI of the qualifying test
      humidifier_included: whether a heated humidifier is ordered
      prescribed_pressure: pressure setting on the order
      rx_date: date of the written order
    triggers: []

  - type: pap_setup_complete
    target: pap_holdings
    mutation: {transition: {from: order_received, to: trial_active}}
    meaning: A coverage-billed device is set up with the patient and the trial and first rental period begin.
    grain: one row per transaction
    fields:
      setup_date: delivery and setup date
      rental_period_start_date: first day of the rental period (the setup date)
      serial_number: serial number of the device set up
    triggers: []

  - type: pap_sale_delivered
    target: pap_holdings
    mutation: {transition: {from: order_received, to: patient_owned}}
    meaning: A self-pay device is delivered and becomes the patient's property.
    grain: one row per transaction
    fields:
      setup_date: delivery date
      ownership_date: date title passed (the delivery date)
      serial_number: serial number of the device delivered
    triggers: []

  - type: pap_order_cancel
    target: pap_holdings
    mutation: {transition: {from: order_received, to: cancelled}}
    meaning: The patient declines the ordered device before it is delivered.
    grain: one row per transaction
    fields:
      closed_date: date the patient declined
    triggers: []

  - type: pap_trial_convert
    target: pap_holdings
    mutation: {transition: {from: trial_active, to: rental_active}}
    meaning: The trial ends with compliance and benefit documented and the rental continues.
    grain: one row per transaction
    fields:
      prescribed_pressure: pressure setting in force at conversion
    triggers: []

  - type: pap_suspend
    target: pap_holdings
    mutation: {transition: {from: rental_active, to: suspended}}
    meaning: Rental billing pauses because the patient is admitted to a hospital or skilled nursing facility.
    grain: one row per transaction
    fields:
      suspended_date: admission date reported
    triggers: []

  - type: pap_resume
    target: pap_holdings
    mutation: {transition: {from: suspended, to: rental_active}}
    meaning: The patient is home again and rental billing resumes in the same rental period.
    grain: one row per transaction
    fields:
      suspended_date: cleared to empty on resumption
    triggers: []

  - type: pap_title_transfer
    target: pap_holdings
    mutation: {transition: {from: rental_active, to: patient_owned}}
    meaning: The capped rental period completes and the device becomes the patient's property.
    grain: one row per transaction
    fields:
      ownership_date: date title passed
    triggers: []

  - type: pap_return
    target: pap_holdings
    mutation: {transition: [{from: trial_active, to: returned}, {from: rental_active, to: returned}, {from: suspended, to: returned}]}
    meaning: The patient confirms that the rented device is given back.
    grain: one row per transaction
    fields:
      closed_date: date of the confirmed return
    triggers:
      - event: resupply:resupply_hold
        map: {hold_reason: device_returned, hold_date: closed_date}

  - type: pap_replace
    target: pap_holdings
    mutation: {transition: {from: patient_owned, to: replaced}}
    meaning: An owned device is retired because a replacement device record is opened.
    grain: one row per transaction
    fields:
      closed_date: date the replacement order was opened
    triggers: []

  - type: pap_rx_update
    target: pap_holdings
    mutation: update
    meaning: A new written order changes the prescribed pressure.
    grain: one row per transaction
    fields:
      prescribed_pressure: pressure on the new order
      rx_date: date of the new order
    triggers: []

  - type: pap_payer_update
    target: pap_holdings
    mutation: update
    meaning: A different primary coverage starts paying for the rented device and a new rental period begins under it.
    grain: one row per transaction
    fields:
      coverage_id: the new primary coverage
      rental_period_start_date: first date of service under the new coverage
    triggers: []

  - type: pap_period_restart
    target: pap_holdings
    mutation: update
    meaning: After a break in need longer than allowed, a new rental period starts under a new order.
    grain: one row per transaction
    fields:
      rental_period_start_date: first day of the new rental period
      rx_date: date of the new order
    triggers: []

  - type: pap_rental_paid
    target: pap_billing
    meaning: The payer pays one capped-rental month of the device (with any humidifier add-on).
    grain: one row per paid rental month of the device within a rental period under one coverage
    distinguish_by: [coverage_id, rental_month_number, service_from_date]
    fields:
      coverage_id: coverage that paid
      hcpcs_code: base device code
      billing_modifier: KH, KI or KJ by month number
      rental_month_number: month ordinal within the rental period
      service_from_date: first day of the rental month
      adjudication_date: remittance date of the payment
      allowed_amount: allowed amount of the line, device plus add-on
      addon_allowed_amount: humidifier part of the allowed amount
      payer_paid_amount: payer payment
      patient_responsibility: patient responsibility assigned by the payer
      claim_number: payer claim control number
    account: rental_months
    direction: in
    triggers:
      - event: coverage:coverage_patient_charge
        when: {patient_responsibility: {not: "0.00"}}
        map: {coverage_id: coverage_id, customer_id: customer_id, source_category: pap, source_bill_id: pap_bill_id, line_allowed_amount: allowed_amount, posting_date: service_from_date}

  - type: pap_rental_denied
    target: pap_billing
    meaning: The payer denies a rental month claim.
    grain: one row per denied rental month claim
    distinguish_by: [coverage_id, service_from_date, denial_reason]
    fields:
      coverage_id: coverage billed
      hcpcs_code: base device code
      billing_modifier: KH, KI or KJ by month number
      rental_month_number: month ordinal billed
      service_from_date: first day of the rental month billed
      adjudication_date: remittance date of the denial
      denial_reason: payer denial reason
      claim_number: payer claim control number
    triggers: []

  - type: pap_claim_reversal
    target: pap_billing
    meaning: The payer takes back payment of a previously paid rental month (recoupment or retraction).
    grain: one row per paid rental month reversed
    distinguish_by: [original_bill_id]
    fields:
      coverage_id: coverage that recouped
      original_bill_id: the paid rental month reversed
      reversal_reason: why the payment was taken back
      payer_paid_amount: amount taken back
      service_from_date: first day of the reversed rental month
      adjudication_date: date of the recoupment remittance
      claim_number: claim control number of the reversal
    account: rental_months
    direction: out
    triggers:
      - event: coverage:coverage_adjustment
        map: {coverage_id: coverage_id, customer_id: customer_id, adjustment_reason: claim_reversal}

  - type: pap_purchase_sale
    target: pap_billing
    meaning: A device is sold outright to a self-pay patient and paid at the time of order.
    grain: one row per self-pay device sale
    distinguish_by: [service_from_date, hcpcs_code]
    fields:
      hcpcs_code: device code sold
      billing_modifier: NU
      service_from_date: delivery date
      sale_amount: device price charged
      fee_amount: delivery fee charged
    triggers: []

  - type: pap_purchase_refund
    target: pap_billing
    meaning: A returned self-pay device is refunded less the restocking fee.
    grain: one row per refunded sale
    distinguish_by: [original_bill_id]
    fields:
      original_bill_id: the sale line refunded
      service_from_date: date the returned device was received
      sale_amount: amount refunded
      fee_amount: restocking fee withheld
    triggers: []

  - type: pap_delivery
    target: pap_service
    meaning: A device is handed over to the patient (initial setup, self-pay delivery, malfunction swap or loaner).
    grain: one row per device handed over
    distinguish_by: [service_date, delivery_purpose, serial_number]
    fields:
      service_date: hand-over date
      delivery_purpose: why the device was delivered
      delivery_mode: how it was handed over
      serial_number: serial number delivered
    triggers:
      - event: pap:pap_setup_complete
        when: {delivery_purpose: initial_rental_setup}
        map: {setup_date: service_date, rental_period_start_date: service_date, serial_number: serial_number}
      - event: pap:pap_sale_delivered
        when: {delivery_purpose: self_pay_delivery}
        map: {setup_date: service_date, ownership_date: service_date, serial_number: serial_number}

  - type: pap_compliance_download
    target: pap_service
    meaning: Usage data for a window is downloaded from the device modem or card and scored against the compliance standard.
    grain: one row per usage window downloaded
    distinguish_by: [window_start_date, window_end_date]
    fields:
      service_date: download date
      window_start_date: first night of the window
      window_end_date: last night of the window
      nights_in_window: nights in the window
      nights_4h_plus: nights reaching the minimum hours
      avg_daily_use_hours: average hours per 24 hours
      compliance_result: met or not_met
    triggers: []

  - type: pap_reevaluation_received
    target: pap_service
    meaning: The treating practitioner's re-evaluation note documenting use and benefit is received.
    grain: one row per practitioner re-evaluation visit documented
    distinguish_by: [visit_date]
    fields:
      service_date: date the note was received
      visit_date: date of the practitioner visit
      benefit_documented: whether improvement on therapy is documented
    triggers: []

  - type: pap_repair
    target: pap_service
    meaning: A device fault is repaired (or the rented device swapped) and the cost is assigned.
    grain: one row per repair job
    distinguish_by: [service_date, repair_fault, serial_number]
    fields:
      service_date: repair completion date
      serial_number: device repaired
      repair_fault: fault found
      repair_coverage: who bears the cost
      labor_units: labor in 15-minute units
      parts_amount: parts cost
      repair_patient_share: amount owed by the patient on a patient-paid repair
      loaner_issued: whether a loaner was issued
    triggers:
      - event: coverage:coverage_patient_charge
        when: {repair_coverage: patient_paid}
        map: {customer_id: customer_id, source_category: pap, source_bill_id: pap_service_id, amount: repair_patient_share, responsibility_type: repair_patient_share, posting_date: service_date}

  - type: pap_pickup
    target: pap_service
    meaning: A rented device is collected from the patient's home (or the pickup attempt finds it missing).
    grain: one row per pickup visit
    distinguish_by: [service_date, serial_number]
    fields:
      service_date: pickup date
      serial_number: device collected or sought
      pickup_condition: condition found
    triggers: []

measures:
  - id: pap_msr_paid_months_current_period
    window: pap_billing rows of the holding whose coverage_id equals the holding's current coverage_id and whose service_from_date is on or after the holding's rental_period_start_date, up to the handling date
    measure: count of pap_rental_paid rows minus the count of pap_claim_reversal rows whose original_bill_id is one of those rows
  - id: pap_msr_last_paid_month
    window: same rows as pap_msr_paid_months_current_period
    measure: the highest rental_month_number among pap_rental_paid rows not reversed by a pap_claim_reversal (0 when none)

policies:
  - id: pap_agg_multi_holding
    subject: [pap_order_create]
    rule: >-
      A patient may hold at most `max_per_customer` PAP device records that are open (any status other
      than returned, cancelled or replaced): at most one billed to coverage and at most one self-pay
      device. A Travel CPAP System (E0601) is always self-pay. No second self-pay order is opened while
      another self-pay device record of the patient is order_received.
    eligibility:
      - id: one_open_self_pay_order
        applies_to: [pap_order_create]
        kind: dedup
        condition: No second self-pay order is opened while another self-pay device record of the patient is order_received.
        evidence_fields: [pap_holdings.customer_id, pap_holdings.status, pap_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_holdings.customer_id]
          action_bindings:
            pap_holdings.customer_id: customer_id
        dedup_contract:
          table: pap_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id, coverage_id: coverage_id}
          duplicate_filters: {status: [order_received]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: pap_agg_same_or_similar
    subject: [pap_order_create, pap_rental_denied]
    rule: >-
      Coverage pays for one PAP device at a time. A coverage-billed order is not opened while another
      coverage-billed PAP record of the patient is trial_active, rental_active or suspended, or is
      patient_owned with fewer than `reasonable_useful_lifetime_months` elapsed since its setup_date,
      unless the new order is the replacement opened under pap_replacement or a change of device class
      under which the earlier record is returned. A change from a CPAP class to a bilevel class during
      the trial does not start a new trial: the bilevel record's trial days continue from the CPAP
      record's setup_date. Rental months billed for a duplicate device are denied with denial_reason
      same_or_similar and are never billed to the patient. A self-pay device never counts as the
      coverage-billed device and never blocks one.
    eligibility: []
    params:
      per_tier:
        Travel CPAP System (E0601): {rul_months: "=reasonable_useful_lifetime_months", payer_billed: false}
        CPAP Fixed-Pressure System (E0601): {rul_months: "=reasonable_useful_lifetime_months", payer_billed: true}
        Auto-Adjusting CPAP System (E0601): {rul_months: "=reasonable_useful_lifetime_months", payer_billed: true}
        Bilevel PAP Spontaneous System (E0470): {rul_months: "=reasonable_useful_lifetime_months", payer_billed: true}
        Bilevel PAP Spontaneous-Timed System (E0471): {rul_months: "=reasonable_useful_lifetime_months", payer_billed: true}
        Adaptive Servo-Ventilation System (E0471): {rul_months: "=reasonable_useful_lifetime_months", payer_billed: true}

  - id: pap_order_qualification
    subject: [pap_order_create, pap_setup_complete, pap_delivery]
    rule: >-
      A coverage-billed order qualifies when the qualifying test shows an AHI of at least
      `qualifying_ahi_min`, or at least `qualifying_ahi_min_with_symptoms` with documented symptoms or
      comorbidities, plus the class's own requirement: prior CPAP failure where
      `prior_cpap_failure_required` is true, and an ejection fraction above `cardiac_ef_threshold_pct`
      where that threshold is above 0. A written order older than `rx_validity_months` cannot start
      therapy. Setup is scheduled `setup_lead_business_days` business days after the order is complete,
      in one of the class's `setup_modes_allowed`, by a respiratory therapist where
      `respiratory_therapist_setup` is true. When the primary coverage's class requires prior
      authorization for PAP devices (coverage parameter prior_auth_pap_required), a coverage-billed
      device is set up only once a prior_authorization request on this holding is approved and the
      setup date is within the coverage's prior_auth_validity_days of its decision_date. A
      coverage-billed device is set up only when the coverage's last eligibility check is within that
      coverage class's eligibility_reverify_days before the setup date. A self-pay device needs only a
      valid written order and full payment.
      A patient whose order calls for a backup rate needs a class whose `backup_rate_capable` is true.
    eligibility:
      - id: prior_auth_on_file
        applies_to: [pap_setup_complete]
        kind: authorization
        condition: When the primary coverage's class requires prior authorization for PAP devices (coverage parameter prior_auth_pap_required), a coverage-billed device is set up only once a prior_authorization request on this holding is approved and the setup date is within the coverage's prior_auth_validity_days of its decision_date.
        evidence_fields: [pap_requests.request_type, pap_requests.request_status, pap_requests.decision_date, pap_requests.pap_holding_id, coverage_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_requests.pap_holding_id]
          action_bindings:
            pap_requests.pap_holding_id: pap_holding_id
      - id: eligibility_current
        applies_to: [pap_setup_complete]
        kind: authorization
        condition: A coverage-billed device is set up only when the coverage's last eligibility check is within that coverage class's eligibility_reverify_days before the setup date.
        evidence_fields: [coverage_holdings.last_eligibility_check_date, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
    params:
      per_tier:
        Travel CPAP System (E0601): {ahi_min: "=qualifying_ahi_min", ahi_min_symptoms: "=qualifying_ahi_min_with_symptoms", cpap_failure: "=prior_cpap_failure_required", ef_threshold: "=cardiac_ef_threshold_pct", backup_rate: "=backup_rate_capable", lead_days: "=setup_lead_business_days", rt_setup: "=respiratory_therapist_setup"}
        CPAP Fixed-Pressure System (E0601): {ahi_min: "=qualifying_ahi_min", ahi_min_symptoms: "=qualifying_ahi_min_with_symptoms", cpap_failure: "=prior_cpap_failure_required", ef_threshold: "=cardiac_ef_threshold_pct", backup_rate: "=backup_rate_capable", lead_days: "=setup_lead_business_days", rt_setup: "=respiratory_therapist_setup"}
        Auto-Adjusting CPAP System (E0601): {ahi_min: "=qualifying_ahi_min", ahi_min_symptoms: "=qualifying_ahi_min_with_symptoms", cpap_failure: "=prior_cpap_failure_required", ef_threshold: "=cardiac_ef_threshold_pct", backup_rate: "=backup_rate_capable", lead_days: "=setup_lead_business_days", rt_setup: "=respiratory_therapist_setup"}
        Bilevel PAP Spontaneous System (E0470): {ahi_min: "=qualifying_ahi_min", ahi_min_symptoms: "=qualifying_ahi_min_with_symptoms", cpap_failure: "=prior_cpap_failure_required", ef_threshold: "=cardiac_ef_threshold_pct", backup_rate: "=backup_rate_capable", lead_days: "=setup_lead_business_days", rt_setup: "=respiratory_therapist_setup"}
        Bilevel PAP Spontaneous-Timed System (E0471): {ahi_min: "=qualifying_ahi_min", ahi_min_symptoms: "=qualifying_ahi_min_with_symptoms", cpap_failure: "=prior_cpap_failure_required", ef_threshold: "=cardiac_ef_threshold_pct", backup_rate: "=backup_rate_capable", lead_days: "=setup_lead_business_days", rt_setup: "=respiratory_therapist_setup"}
        Adaptive Servo-Ventilation System (E0471): {ahi_min: "=qualifying_ahi_min", ahi_min_symptoms: "=qualifying_ahi_min_with_symptoms", cpap_failure: "=prior_cpap_failure_required", ef_threshold: "=cardiac_ef_threshold_pct", backup_rate: "=backup_rate_capable", lead_days: "=setup_lead_business_days", rt_setup: "=respiratory_therapist_setup"}

  - id: pap_trial_compliance
    subject: [pap_trial_convert, pap_compliance_download, pap_reevaluation_received]
    rule: >-
      A coverage-billed device starts on a trial of `trial_period_days` counted from setup_date as day
      1. A compliance download scores one window of `compliance_window_days` consecutive nights:
      under nights_over_threshold the window is met when nights_4h_plus is at least
      `compliance_min_night_pct` percent of nights_in_window, with nights_4h_plus counting nights of at
      least `compliance_min_hours` hours; under average_daily_use it is met when avg_daily_use_hours is
      at least `compliance_min_hours`. Where `modem_data_required` is true only modem or card data
      count, never the patient's own account of use. The trial converts to rental_active only when
      both proofs are on file: a met window ending no later than trial day
      `compliance_window_latest_end_day`, and a practitioner re-evaluation whose visit_date falls
      between trial days `reevaluation_earliest_day` and `reevaluation_latest_day` inclusive with
      benefit_documented true. A device is converted only when a pap_compliance_download on this
      holding shows compliance_result met and a pap_reevaluation_received on this holding shows
      benefit_documented true. A trial without both proofs by its last day fails: rental months from
      month 4 are not billable and are denied with compliance_not_documented or reevaluation_missing
      when submitted, and a new trial needs the class's `failed_trial_requalification`.
    eligibility:
      - id: both_proofs_on_file
        applies_to: [pap_trial_convert]
        kind: authorization
        condition: A device is converted only when a pap_compliance_download on this holding shows compliance_result met and a pap_reevaluation_received on this holding shows benefit_documented true.
        evidence_fields: [pap_service.compliance_result, pap_service.window_end_date, pap_service.visit_date, pap_service.benefit_documented, pap_service.pap_holding_id, pap_holdings.setup_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_service.pap_holding_id]
          action_bindings:
            pap_service.pap_holding_id: pap_holding_id
    params:
      per_tier:
        Travel CPAP System (E0601): {trial_days: "=trial_period_days", basis: "=compliance_basis", window: "=compliance_window_days", min_hours: "=compliance_min_hours", night_pct: "=compliance_min_night_pct", reeval_from: "=reevaluation_earliest_day", reeval_to: "=reevaluation_latest_day"}
        CPAP Fixed-Pressure System (E0601): {trial_days: "=trial_period_days", basis: "=compliance_basis", window: "=compliance_window_days", min_hours: "=compliance_min_hours", night_pct: "=compliance_min_night_pct", reeval_from: "=reevaluation_earliest_day", reeval_to: "=reevaluation_latest_day"}
        Auto-Adjusting CPAP System (E0601): {trial_days: "=trial_period_days", basis: "=compliance_basis", window: "=compliance_window_days", min_hours: "=compliance_min_hours", night_pct: "=compliance_min_night_pct", reeval_from: "=reevaluation_earliest_day", reeval_to: "=reevaluation_latest_day"}
        Bilevel PAP Spontaneous System (E0470): {trial_days: "=trial_period_days", basis: "=compliance_basis", window: "=compliance_window_days", min_hours: "=compliance_min_hours", night_pct: "=compliance_min_night_pct", reeval_from: "=reevaluation_earliest_day", reeval_to: "=reevaluation_latest_day"}
        Bilevel PAP Spontaneous-Timed System (E0471): {trial_days: "=trial_period_days", basis: "=compliance_basis", window: "=compliance_window_days", min_hours: "=compliance_min_hours", night_pct: "=compliance_min_night_pct", reeval_from: "=reevaluation_earliest_day", reeval_to: "=reevaluation_latest_day"}
        Adaptive Servo-Ventilation System (E0471): {trial_days: "=trial_period_days", basis: "=compliance_basis", window: "=compliance_window_days", min_hours: "=compliance_min_hours", night_pct: "=compliance_min_night_pct", reeval_from: "=reevaluation_earliest_day", reeval_to: "=reevaluation_latest_day"}
    formula:
      nights_rule_met: nights_4h_plus * 100 >= compliance_min_night_pct * nights_in_window
      average_rule_met: avg_daily_use_hours >= compliance_min_hours

  - id: pap_evt_rental_billing
    subject: [pap_rental_paid, pap_rental_denied]
    rule: >-
      Each rental month of a coverage-billed device is billed on the anniversary of the rental period
      (`rental_month_anchor`): month 1 starts on rental_period_start_date and each later month starts
      on the same day of the following calendar month, falling back to the last day of a shorter month;
      after a resumption the next month starts on the resumption date. The month number is the next
      ordinal after pap_msr_last_paid_month. Months 1 to 3 carry modifier KH (month 1) or KI and the
      fee `rental_fee_months_1_3`; months from 4 on carry KJ and the fee `rental_fee_months_4_13`. Where
      `humidifier_billable` is true and the record has humidifier_included true, the humidifier add-on
      adds `humidifier_fee_months_1_3` or `humidifier_fee_months_4_13` for the same month. The allowed
      amount is each fee times the coverage class's allowed_pct_of_fee_schedule divided by 100,
      rounded to the cent half up, then summed. A full month is billed for any month the device is in
      the home on its first day; months are never prorated. No month whose first day falls while the
      record is suspended is billed. A rental month is billed only while the device record is
      trial_active or rental_active. The patient responsibility on a paid month is split under the
      coverage charter's cost-share rules.
      Each line carries the class's `hcpcs_code` under its `acquisition_method`, and the humidifier
      add-on is billed under `humidifier_hcpcs`.
    eligibility:
      - id: billable_status
        applies_to: [pap_rental_paid]
        kind: state
        condition: A rental month is billed only while the device record is trial_active or rental_active.
        evidence_fields: [pap_holdings.status, pap_holdings.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_holdings.pap_holding_id]
          action_bindings:
            pap_holdings.pap_holding_id: pap_holding_id
        state_contract:
          field: pap_holdings.status
          allowed: [trial_active, rental_active]
    params:
      per_tier:
        Travel CPAP System (E0601): {code: "=hcpcs_code", method: "=acquisition_method", hum_code: "=humidifier_hcpcs", fee_1_3: "=rental_fee_months_1_3", fee_4_13: "=rental_fee_months_4_13", hum_1_3: "=humidifier_fee_months_1_3", hum_4_13: "=humidifier_fee_months_4_13"}
        CPAP Fixed-Pressure System (E0601): {code: "=hcpcs_code", method: "=acquisition_method", hum_code: "=humidifier_hcpcs", fee_1_3: "=rental_fee_months_1_3", fee_4_13: "=rental_fee_months_4_13", hum_1_3: "=humidifier_fee_months_1_3", hum_4_13: "=humidifier_fee_months_4_13"}
        Auto-Adjusting CPAP System (E0601): {code: "=hcpcs_code", method: "=acquisition_method", hum_code: "=humidifier_hcpcs", fee_1_3: "=rental_fee_months_1_3", fee_4_13: "=rental_fee_months_4_13", hum_1_3: "=humidifier_fee_months_1_3", hum_4_13: "=humidifier_fee_months_4_13"}
        Bilevel PAP Spontaneous System (E0470): {code: "=hcpcs_code", method: "=acquisition_method", hum_code: "=humidifier_hcpcs", fee_1_3: "=rental_fee_months_1_3", fee_4_13: "=rental_fee_months_4_13", hum_1_3: "=humidifier_fee_months_1_3", hum_4_13: "=humidifier_fee_months_4_13"}
        Bilevel PAP Spontaneous-Timed System (E0471): {code: "=hcpcs_code", method: "=acquisition_method", hum_code: "=humidifier_hcpcs", fee_1_3: "=rental_fee_months_1_3", fee_4_13: "=rental_fee_months_4_13", hum_1_3: "=humidifier_fee_months_1_3", hum_4_13: "=humidifier_fee_months_4_13"}
        Adaptive Servo-Ventilation System (E0471): {code: "=hcpcs_code", method: "=acquisition_method", hum_code: "=humidifier_hcpcs", fee_1_3: "=rental_fee_months_1_3", fee_4_13: "=rental_fee_months_4_13", hum_1_3: "=humidifier_fee_months_1_3", hum_4_13: "=humidifier_fee_months_4_13"}
    formula:
      device_fee: rental_fee_months_1_3 if rental_month_number <= 3 else rental_fee_months_4_13
      humidifier_fee: humidifier_fee_months_1_3 if rental_month_number <= 3 else humidifier_fee_months_4_13
    measures: [pap_msr_last_paid_month]

  - id: pap_ownership
    subject: [pap_title_transfer, pap_rental_paid, pap_rental_denied]
    rule: >-
      Title passes to the patient once pap_msr_paid_months_current_period reaches the coverage class's
      capped_rental_months; ownership_date is the day after the last day of the final paid month (the
      day its next month would have started). A month beyond the cap is never billed, and one billed in
      error is denied with cap_reached and never charged to the patient. Months paid under an earlier
      coverage or an earlier rental period do not count toward the cap. After title passes the device
      is the patient's property: it is never picked up, and its repairs follow pap_repair_responsibility.
    eligibility: []
    measures: [pap_msr_paid_months_current_period]

  - id: pap_suspension_break
    subject: [pap_suspend, pap_resume, pap_period_restart]
    rule: >-
      When the patient is admitted to a hospital or skilled nursing facility the record is suspended
      with the admission date as suspended_date; rental is not billed for any month whose first day
      falls during the suspension. When the patient is home again the rental resumes in the same rental
      period, with the paid months counted so far carried forward. A suspended rental resumes only when
      the patient comes home no later than `break_in_need_days` days after the suspension began,
      counting calendar days from the day after suspended_date, the allowance being `break_in_need_days`
      plus the days remaining in the rental month in which the suspension began. A longer break ends
      the rental period: the record resumes with a new rental period whose rental_period_start_date is
      the return-home date and whose month count starts again at 1, and billing waits for the class's
      `new_period_requirements`. A suspension is never used for a planned absence such as travel; the
      device stays rented and billed.
    eligibility:
      - id: break_within_allowance
        applies_to: [pap_resume]
        kind: time
        condition: A suspended rental resumes only when the patient comes home no later than `break_in_need_days` days after the suspension began, counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the rental month in which the suspension began.
        evidence_fields: [pap_holdings.suspended_date, pap_holdings.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_holdings.pap_holding_id]
          action_bindings:
            pap_holdings.pap_holding_id: pap_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension began
          anchor_source: pap_holdings.suspended_date
          relation: not_after
          duration_source: variants.break_in_need_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after suspended_date, the allowance being `break_in_need_days` plus the days remaining in the rental month in which the suspension began
          boundary: inclusive
    params:
      per_tier:
        Travel CPAP System (E0601): {break_days: "=break_in_need_days", restart_needs: "=new_period_requirements"}
        CPAP Fixed-Pressure System (E0601): {break_days: "=break_in_need_days", restart_needs: "=new_period_requirements"}
        Auto-Adjusting CPAP System (E0601): {break_days: "=break_in_need_days", restart_needs: "=new_period_requirements"}
        Bilevel PAP Spontaneous System (E0470): {break_days: "=break_in_need_days", restart_needs: "=new_period_requirements"}
        Bilevel PAP Spontaneous-Timed System (E0471): {break_days: "=break_in_need_days", restart_needs: "=new_period_requirements"}
        Adaptive Servo-Ventilation System (E0471): {break_days: "=break_in_need_days", restart_needs: "=new_period_requirements"}

  - id: pap_evt_claim_reversal
    subject: [pap_claim_reversal]
    rule: >-
      A payer recoupment or retraction of a paid rental month is recorded against that one month,
      carrying its pap_bill_id as original_bill_id; a case letter covering several months is recorded
      as one reversal per month named. A paid month is reversed at most once. A reversal takes the month
      out of the paid count, so the next month billed reuses its ordinal only if it was the last paid
      month; a reversed month inside the period is re-billed only after an appeal is won. Every patient
      charge stemming from the reversed month is removed under the coverage charter, and a patient
      payment already made on it becomes a credit.
    eligibility:
      - id: reverse_once
        applies_to: [pap_claim_reversal]
        kind: dedup
        condition: A paid month is reversed at most once.
        evidence_fields: [pap_billing.original_bill_id, pap_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_billing.original_bill_id]
          action_bindings:
            pap_billing.original_bill_id: original_bill_id
        dedup_contract:
          table: pap_billing
          mode: separate_record
          object_bindings: {original_bill_id: original_bill_id}
          duplicate_filters: {event_type: [pap_claim_reversal]}
          distinct_fields: []

  - id: pap_appeal
    subject: [pap_rental_denied]
    rule: >-
      A denied rental month may be appealed through a redetermination_appeal request naming that line
      as related_bill_id. The appeal is filed no later than the coverage class's
      redetermination_window_days after the denial is received, counting calendar days from the day after the denied line's adjudication_date with the boundary day included. A denial for
      cap_reached, same_or_similar or inpatient_stay is not appealed because the facts behind it are
      correct; a denial for compliance_not_documented or reevaluation_missing is appealed only when the
      missing proof was in fact on file before the denial. One appeal per denied line is open at a time.
    eligibility:
      - id: appeal_window
        applies_to: [pap_rental_denied]
        kind: time
        condition: The appeal is filed no later than the coverage class's redetermination_window_days after the denial is received, counting calendar days from the day after the denied line's adjudication_date with the boundary day included.
        evidence_fields: [pap_billing.adjudication_date, pap_billing.pap_bill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_billing.pap_bill_id]
          action_bindings:
            pap_billing.pap_bill_id: related_bill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the denial is received
          anchor_source: pap_billing.adjudication_date
          relation: not_after
          duration_source: params.appeal_window_days_reference
          unit: calendar_days
          counting_rule: counting calendar days from the day after the denied line's adjudication_date with the boundary day included
          boundary: inclusive
    params:
      appeal_window_days_reference: coverage.redetermination_window_days

  - id: pap_repair_responsibility
    subject: [pap_repair]
    rule: >-
      Who pays for a repair follows the record's status. While the device is trial_active,
      rental_active or suspended, any repair or swap is Summit Ridge's rental obligation at no charge,
      and a malfunctioning device is swapped within `malfunction_swap_business_days` business days. A
      patient-owned device within `manufacturer_warranty_months` of setup_date is repaired under the
      manufacturer warranty at no charge, except water_damage and drop_damage, which the warranty
      excludes. Otherwise an owned device bought under coverage is repaired with labor at
      `repair_labor_rate_per_unit` per unit plus parts billed to the coverage, the patient owing the
      cost share; an owned self-pay device is repaired at the patient's cost (repair_coverage
      patient_paid). When labor plus parts would exceed `repair_cost_replace_threshold_pct` percent of
      `fee_schedule_purchase_price`, the device is not repaired and is replaced under pap_replacement.
      Where `loaner_during_owned_repair` is true a loaner is issued while an owned device is out for
      repair. A repair is recorded only on a device the patient still has: the device record is
      trial_active, rental_active, suspended or patient_owned.
    eligibility:
      - id: device_with_patient
        applies_to: [pap_repair]
        kind: state
        condition: the device record is trial_active, rental_active, suspended or patient_owned.
        evidence_fields: [pap_holdings.status, pap_holdings.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_holdings.pap_holding_id]
          action_bindings:
            pap_holdings.pap_holding_id: pap_holding_id
        state_contract:
          field: pap_holdings.status
          allowed: [trial_active, rental_active, suspended, patient_owned]
    params:
      per_tier:
        Travel CPAP System (E0601): {warranty_months: "=manufacturer_warranty_months", labor_rate: "=repair_labor_rate_per_unit", replace_pct: "=repair_cost_replace_threshold_pct", loaner: "=loaner_during_owned_repair", swap_days: "=malfunction_swap_business_days"}
        CPAP Fixed-Pressure System (E0601): {warranty_months: "=manufacturer_warranty_months", labor_rate: "=repair_labor_rate_per_unit", replace_pct: "=repair_cost_replace_threshold_pct", loaner: "=loaner_during_owned_repair", swap_days: "=malfunction_swap_business_days"}
        Auto-Adjusting CPAP System (E0601): {warranty_months: "=manufacturer_warranty_months", labor_rate: "=repair_labor_rate_per_unit", replace_pct: "=repair_cost_replace_threshold_pct", loaner: "=loaner_during_owned_repair", swap_days: "=malfunction_swap_business_days"}
        Bilevel PAP Spontaneous System (E0470): {warranty_months: "=manufacturer_warranty_months", labor_rate: "=repair_labor_rate_per_unit", replace_pct: "=repair_cost_replace_threshold_pct", loaner: "=loaner_during_owned_repair", swap_days: "=malfunction_swap_business_days"}
        Bilevel PAP Spontaneous-Timed System (E0471): {warranty_months: "=manufacturer_warranty_months", labor_rate: "=repair_labor_rate_per_unit", replace_pct: "=repair_cost_replace_threshold_pct", loaner: "=loaner_during_owned_repair", swap_days: "=malfunction_swap_business_days"}
        Adaptive Servo-Ventilation System (E0471): {warranty_months: "=manufacturer_warranty_months", labor_rate: "=repair_labor_rate_per_unit", replace_pct: "=repair_cost_replace_threshold_pct", loaner: "=loaner_during_owned_repair", swap_days: "=malfunction_swap_business_days"}
    formula:
      repair_cost: labor_units * repair_labor_rate_per_unit + parts_amount
      replace_instead: labor_units * repair_labor_rate_per_unit + parts_amount > fee_schedule_purchase_price * repair_cost_replace_threshold_pct / 100

  - id: pap_return_pickup
    subject: [pap_return, pap_pickup, pap_order_cancel]
    rule: >-
      A patient may decline an order before delivery at no charge. A rented device is returned only at
      the patient's own confirmation: a return_pickup request is registered, and the return takes
      effect when the patient confirms it. A rented device is returned only after a return_pickup
      request on this holding is approved. The pickup is scheduled within `pickup_lead_business_days`
      business days of the confirmation. Rental billing stops with the last month that began before the
      return; the month in which the device leaves is not refunded. A device recovered damaged beyond
      normal wear is charged `damage_fee_beyond_wear`; a device still not recovered
      `unreturned_equipment_days` days after the confirmed pickup date is charged
      `unreturned_equipment_charge`, which is removed if the device is later recovered. A
      patient-owned device is never picked up or charged on return.
    eligibility:
      - id: return_confirmed
        applies_to: [pap_return]
        kind: authorization
        condition: A rented device is returned only after a return_pickup request on this holding is approved.
        evidence_fields: [pap_requests.request_type, pap_requests.request_status, pap_requests.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_requests.pap_holding_id]
          action_bindings:
            pap_requests.pap_holding_id: pap_holding_id
    params:
      per_tier:
        Travel CPAP System (E0601): {pickup_days: "=pickup_lead_business_days", unreturned_days: "=unreturned_equipment_days", unreturned_charge: "=unreturned_equipment_charge", damage_fee: "=damage_fee_beyond_wear"}
        CPAP Fixed-Pressure System (E0601): {pickup_days: "=pickup_lead_business_days", unreturned_days: "=unreturned_equipment_days", unreturned_charge: "=unreturned_equipment_charge", damage_fee: "=damage_fee_beyond_wear"}
        Auto-Adjusting CPAP System (E0601): {pickup_days: "=pickup_lead_business_days", unreturned_days: "=unreturned_equipment_days", unreturned_charge: "=unreturned_equipment_charge", damage_fee: "=damage_fee_beyond_wear"}
        Bilevel PAP Spontaneous System (E0470): {pickup_days: "=pickup_lead_business_days", unreturned_days: "=unreturned_equipment_days", unreturned_charge: "=unreturned_equipment_charge", damage_fee: "=damage_fee_beyond_wear"}
        Bilevel PAP Spontaneous-Timed System (E0471): {pickup_days: "=pickup_lead_business_days", unreturned_days: "=unreturned_equipment_days", unreturned_charge: "=unreturned_equipment_charge", damage_fee: "=damage_fee_beyond_wear"}
        Adaptive Servo-Ventilation System (E0471): {pickup_days: "=pickup_lead_business_days", unreturned_days: "=unreturned_equipment_days", unreturned_charge: "=unreturned_equipment_charge", damage_fee: "=damage_fee_beyond_wear"}

  - id: pap_self_pay
    subject: [pap_purchase_sale, pap_sale_delivered, pap_purchase_refund]
    rule: >-
      Any class may be bought outright by a self-pay patient at `self_pay_retail_price` plus
      `self_pay_delivery_fee`, paid in full when the order is placed; the Travel CPAP System (E0601) is
      sold only this way. A self-pay device is returned for a refund only when it comes back complete in
      its original packaging no later than `self_pay_return_window_days` after the device is delivered,
      counting calendar days from the day after the delivery date with the boundary day included. The
      refund is the device price less `self_pay_restocking_fee_pct` percent, rounded to the cent half up;
      the delivery fee and any mask or tubing that has been used are never refunded. A sale is refunded
      at most once. A self-pay device is never billed to coverage afterward.
    eligibility:
      - id: return_window
        applies_to: [pap_purchase_refund]
        kind: time
        condition: A self-pay device is returned for a refund only when it comes back complete in its original packaging no later than `self_pay_return_window_days` after the device is delivered, counting calendar days from the day after the delivery date with the boundary day included.
        evidence_fields: [pap_holdings.setup_date, pap_holdings.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_holdings.pap_holding_id]
          action_bindings:
            pap_holdings.pap_holding_id: pap_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the device is delivered
          anchor_source: pap_holdings.setup_date
          relation: not_after
          duration_source: variants.self_pay_return_window_days
          unit: calendar_days
          counting_rule: counting calendar days from the day after the delivery date with the boundary day included
          boundary: inclusive
      - id: refund_once
        applies_to: [pap_purchase_refund]
        kind: dedup
        condition: A sale is refunded at most once.
        evidence_fields: [pap_billing.original_bill_id, pap_billing.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_billing.original_bill_id]
          action_bindings:
            pap_billing.original_bill_id: original_bill_id
        dedup_contract:
          table: pap_billing
          mode: separate_record
          object_bindings: {original_bill_id: original_bill_id}
          duplicate_filters: {event_type: [pap_purchase_refund]}
          distinct_fields: []
    params:
      per_tier:
        Travel CPAP System (E0601): {price: "=self_pay_retail_price", delivery_fee: "=self_pay_delivery_fee", window_days: "=self_pay_return_window_days", restock_pct: "=self_pay_restocking_fee_pct"}
        CPAP Fixed-Pressure System (E0601): {price: "=self_pay_retail_price", delivery_fee: "=self_pay_delivery_fee", window_days: "=self_pay_return_window_days", restock_pct: "=self_pay_restocking_fee_pct"}
        Auto-Adjusting CPAP System (E0601): {price: "=self_pay_retail_price", delivery_fee: "=self_pay_delivery_fee", window_days: "=self_pay_return_window_days", restock_pct: "=self_pay_restocking_fee_pct"}
        Bilevel PAP Spontaneous System (E0470): {price: "=self_pay_retail_price", delivery_fee: "=self_pay_delivery_fee", window_days: "=self_pay_return_window_days", restock_pct: "=self_pay_restocking_fee_pct"}
        Bilevel PAP Spontaneous-Timed System (E0471): {price: "=self_pay_retail_price", delivery_fee: "=self_pay_delivery_fee", window_days: "=self_pay_return_window_days", restock_pct: "=self_pay_restocking_fee_pct"}
        Adaptive Servo-Ventilation System (E0471): {price: "=self_pay_retail_price", delivery_fee: "=self_pay_delivery_fee", window_days: "=self_pay_return_window_days", restock_pct: "=self_pay_restocking_fee_pct"}
    formula:
      refund_amount: round(self_pay_retail_price * (100 - self_pay_restocking_fee_pct) / 100, 2)

  - id: pap_replacement
    subject: [pap_replace, pap_order_create]
    rule: >-
      An owned device is replaced in two situations. An age-based replacement is ordered no earlier
      than `reasonable_useful_lifetime_months` after the device is set up, counting calendar months
      from setup_date with month-end fallback to the last day of a shorter month and the boundary day
      included; it needs a new practitioner visit where `replacement_requires_new_visit` is true but
      never a new sleep test. Before that point a device is replaced only when it is lost, stolen or
      irreparably damaged, with a police, fire or insurance report where `lost_stolen_report_required`
      is true, or when pap_repair_responsibility finds repair costlier than replacement. The
      replacement opens a new device record with a new rental period and a new capped count; the old
      record moves to replaced. Wear, a newer model or a patient preference is not a reason to replace.
    eligibility:
      - id: useful_life_elapsed
        applies_to: [pap_replace]
        kind: time
        condition: An age-based replacement is ordered no earlier than `reasonable_useful_lifetime_months` after the device is set up, counting calendar months from setup_date with month-end fallback to the last day of a shorter month and the boundary day included; it needs a new practitioner visit where `replacement_requires_new_visit` is true but never a new sleep test.
        evidence_fields: [pap_holdings.setup_date, pap_holdings.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_holdings.pap_holding_id]
          action_bindings:
            pap_holdings.pap_holding_id: pap_holding_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the device is set up
          anchor_source: pap_holdings.setup_date
          relation: not_before
          duration_source: variants.reasonable_useful_lifetime_months
          unit: calendar_months
          counting_rule: counting calendar months from setup_date with month-end fallback to the last day of a shorter month and the boundary day included
          boundary: inclusive
    params:
      per_tier:
        Travel CPAP System (E0601): {rul_months: "=reasonable_useful_lifetime_months", new_visit: "=replacement_requires_new_visit", report: "=lost_stolen_report_required"}
        CPAP Fixed-Pressure System (E0601): {rul_months: "=reasonable_useful_lifetime_months", new_visit: "=replacement_requires_new_visit", report: "=lost_stolen_report_required"}
        Auto-Adjusting CPAP System (E0601): {rul_months: "=reasonable_useful_lifetime_months", new_visit: "=replacement_requires_new_visit", report: "=lost_stolen_report_required"}
        Bilevel PAP Spontaneous System (E0470): {rul_months: "=reasonable_useful_lifetime_months", new_visit: "=replacement_requires_new_visit", report: "=lost_stolen_report_required"}
        Bilevel PAP Spontaneous-Timed System (E0471): {rul_months: "=reasonable_useful_lifetime_months", new_visit: "=replacement_requires_new_visit", report: "=lost_stolen_report_required"}
        Adaptive Servo-Ventilation System (E0471): {rul_months: "=reasonable_useful_lifetime_months", new_visit: "=replacement_requires_new_visit", report: "=lost_stolen_report_required"}

  - id: pap_rx_change
    subject: [pap_rx_update]
    rule: >-
      The prescribed pressure is changed only on a new written order from the treating practitioner,
      never on the patient's request alone and never by the agent: a pressure is changed only after a
      pressure_change request on this holding is approved. The new pressure must lie within the class's
      `max_pressure_cmh2o`; a pressure the class cannot deliver needs a new order for a different class
      under pap_agg_same_or_similar. The new rx_date restarts `rx_validity_months` for supply cycles.
    eligibility:
      - id: new_order_on_file
        applies_to: [pap_rx_update]
        kind: authorization
        condition: a pressure is changed only after a pressure_change request on this holding is approved.
        evidence_fields: [pap_requests.request_type, pap_requests.request_status, pap_requests.pap_holding_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pap_requests.pap_holding_id]
          action_bindings:
            pap_requests.pap_holding_id: pap_holding_id
    params:
      per_tier:
        Travel CPAP System (E0601): {max_pressure: "=max_pressure_cmh2o", new_order: "=pressure_change_requires_new_order", rx_months: "=rx_validity_months"}
        CPAP Fixed-Pressure System (E0601): {max_pressure: "=max_pressure_cmh2o", new_order: "=pressure_change_requires_new_order", rx_months: "=rx_validity_months"}
        Auto-Adjusting CPAP System (E0601): {max_pressure: "=max_pressure_cmh2o", new_order: "=pressure_change_requires_new_order", rx_months: "=rx_validity_months"}
        Bilevel PAP Spontaneous System (E0470): {max_pressure: "=max_pressure_cmh2o", new_order: "=pressure_change_requires_new_order", rx_months: "=rx_validity_months"}
        Bilevel PAP Spontaneous-Timed System (E0471): {max_pressure: "=max_pressure_cmh2o", new_order: "=pressure_change_requires_new_order", rx_months: "=rx_validity_months"}
        Adaptive Servo-Ventilation System (E0471): {max_pressure: "=max_pressure_cmh2o", new_order: "=pressure_change_requires_new_order", rx_months: "=rx_validity_months"}

  - id: pap_payer_transition
    subject: [pap_payer_update]
    rule: >-
      When a different primary coverage starts paying during a rental (for example a move from a
      Medicare Advantage plan to Original Medicare Part B, or from commercial coverage to Medicare), a
      new rental period begins under the new coverage on the first date of service it covers, and the
      months paid under the earlier coverage do not count toward the new coverage's cap. Where
      `payer_entry_requalification` is prior_test_and_new_visit, the new coverage pays only once the
      qualifying test on file predates the new coverage and a new practitioner visit documents
      continued use and benefit; months before that visit are not billed to the new coverage. The
      rental moves to the new coverage only once it is verified: the new coverage record is in status
      active. A patient-owned device is not affected by a change of coverage.
    eligibility:
      - id: new_coverage_verified
        applies_to: [pap_payer_update]
        kind: state
        condition: the new coverage record is in status active.
        evidence_fields: [coverage_holdings.status, coverage_holdings.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [coverage_holdings.coverage_id]
          action_bindings:
            coverage_holdings.coverage_id: coverage_id
        state_contract:
          field: coverage_holdings.status
          allowed: [active]
    params:
      per_tier:
        Travel CPAP System (E0601): {requalification: "=payer_entry_requalification"}
        CPAP Fixed-Pressure System (E0601): {requalification: "=payer_entry_requalification"}
        Auto-Adjusting CPAP System (E0601): {requalification: "=payer_entry_requalification"}
        Bilevel PAP Spontaneous System (E0470): {requalification: "=payer_entry_requalification"}
        Bilevel PAP Spontaneous-Timed System (E0471): {requalification: "=payer_entry_requalification"}
        Adaptive Servo-Ventilation System (E0471): {requalification: "=payer_entry_requalification"}

# ============================================================================
# extended_policies (pap_therapy_rentals)
# ============================================================================
extended_policies:
  - id: pap_ext_return_labor
    base_policy_refs: [pap_repair_responsibility]
    overwrite: []
    trigger: on_request
    subject: [pap_repair]
    computes: labor_units
    target_tool: record_return_inspection_bc7317cd
    params:
      base_units: 2
      keep_long_days: 14
      keep_mid_days: 7
      keep_long_units: 2
      keep_mid_units: 1
      humid_full_units: 2
      humid_part_units: 1
      shipped_units: 1
      home_setup_units: 2
      protocol_units: 2
      min_job_units: 1
    rule: >-
      When a self-pay device bought outright comes back to Summit Ridge on a completed return pickup request, the branch books
      reconditioning labor for the unit on its return inspection, in 15-minute labor units. Return
      reconditioning labor starts from a standard return inspection of 2 labor units. The units for how
      long the patient kept the unit are counted from the delivery date on the device record to the date
      the completed return pickup request records the unit as received back: a unit kept more than 14
      days adds 2 labor units for extended-use sanitation, a unit kept more than 7 and up to 14 days adds
      1 labor unit, and a unit kept 7 days or less adds none. The humidifier care units depend on whether
      the heated humidifier went into use: a device furnished with a humidifier to a patient whose active
      PAP supply enrollment shows the humidifier in use adds 2 labor units to dry and descale the water
      chamber, a device furnished with a humidifier to a patient whose supply enrollment does not show it
      in use adds 1 labor unit, and a device without a humidifier adds none. The setup-route units follow
      how the unit was handed over at delivery: a unit shipped for a virtual setup adds 1 labor unit for the
      transit check of a shipped unit, a unit set up in the patient's home adds 2 labor units to clear the settings the
      therapist configured, and a unit handed over any other way adds none. The labor units are the sum
      of the standard return inspection and these additions. A unit that already had warranty repairs on
      its record has that work verified again: with two or more manufacturer-warranty repairs on the record the unit goes through the full diagnostic protocol and the sum is increased by the labor units booked on all of those warranty jobs plus 2 protocol units, with exactly one the labor units booked on that warranty repair job, never less than 1 unit, are added to the sum, and with none the sum is booked as counted.
    baseline:
      rule: >-
        Return reconditioning labor starts from a standard return inspection of 2 labor units. The labor
        units are the sum of the standard return inspection and these additions.
      params: [base_units]
    prerequisite: []
    cross_category:
      - category: resupply
        as: branch
        reads: [humidifier_in_use, status]
        note: the humidifier care units read whether the patient's active supply enrollment shows the humidifier in use
    compute:
      - recv_date: "LATEST('pap_requests', 'decision_date', date_field='decision_date', request_type='return_pickup', request_status='completed')"
      - kept_days: "DAYS(F('setup_date'), recv_date)"
      - keep_units: "K('keep_long_units') if kept_days > K('keep_long_days') else (K('keep_mid_units') if kept_days > K('keep_mid_days') else 0)"
      - supply_humid: "CFIELD('resupply', 'humidifier_in_use', status='active')"
      - humid_units: "K('humid_full_units') if (F('humidifier_included') == True and supply_humid == True) else (K('humid_part_units') if F('humidifier_included') == True else 0)"
      - setup_mode: "LATEST('pap_service', 'delivery_mode', date_field='service_date', event_type='pap_delivery')"
      - route_units: "K('shipped_units') if setup_mode == 'virtual_setup' else (K('home_setup_units') if setup_mode == 'in_home_setup' else 0)"
      - warranty_jobs: "COUNT('pap_service', event_type='pap_repair', repair_coverage='manufacturer_warranty')"
      - subtotal: "K('base_units') + keep_units + humid_units + route_units"
      - warranty_job_units: "LATEST('pap_service', 'labor_units', date_field='service_date', event_type='pap_repair', repair_coverage='manufacturer_warranty')"
      - warranty_total_units: "SUM('pap_service', 'labor_units', event_type='pap_repair', repair_coverage='manufacturer_warranty')"
      - booked_units: "subtotal + warranty_total_units + K('protocol_units') if warranty_jobs >= 2 else (subtotal + MX(K('min_job_units'), warranty_job_units) if warranty_jobs == 1 else subtotal)"
      - result: "int(booked_units)"
    compute_basis:
      recv_date: "the date the completed return pickup request records the unit as received back"
      kept_days: "The units for how long the patient kept the unit are counted from the delivery date on the device record to the date the completed return pickup request records the unit as received back"
      keep_units: "a unit kept more than 14 days adds 2 labor units for extended-use sanitation, a unit kept more than 7 and up to 14 days adds 1 labor unit, and a unit kept 7 days or less adds none."
      supply_humid: "a patient whose active PAP supply enrollment shows the humidifier in use"
      humid_units: "a device furnished with a humidifier to a patient whose active PAP supply enrollment shows the humidifier in use adds 2 labor units to dry and descale the water chamber, a device furnished with a humidifier to a patient whose supply enrollment does not show it in use adds 1 labor unit, and a device without a humidifier adds none."
      setup_mode: "The setup-route units follow how the unit was handed over at delivery"
      route_units: "a unit shipped for a virtual setup adds 1 labor unit for the transit check of a shipped unit, a unit set up in the patient's home adds 2 labor units to clear the settings the therapist configured, and a unit handed over any other way adds none."
      warranty_jobs: "A unit that already had warranty repairs on its record has that work verified again"
      subtotal: "The labor units are the sum of the standard return inspection and these additions."
      warranty_job_units: "the labor units booked on that warranty repair job, never less than 1 unit"
      warranty_total_units: "the sum is increased by the labor units booked on all of those warranty jobs plus 2 protocol units"
      booked_units: "with two or more manufacturer-warranty repairs on the record the unit goes through the full diagnostic protocol and the sum is increased by the labor units booked on all of those warranty jobs plus 2 protocol units, with exactly one the labor units booked on that warranty repair job, never less than 1 unit, are added to the sum, and with none the sum is booked as counted."
    factors:
      - id: keep_time_units
        effect: parameter
        decides: keep_units
        bindings: [recv_date, kept_days, keep_units]
        ladder:
          - when: "the unit was kept more than 14 days between delivery and receipt back"
            value: "2 labor units"
          - when: "the unit was kept more than 7 and up to 14 days"
            value: "1 labor unit"
          - when: "otherwise (kept 7 days or less)"
            value: "0 labor units"
        baseline:
          keep_units: "0"
        evidence: [date]
        cross_difficulty: null
      - id: humidifier_care_units
        effect: parameter
        decides: humid_units
        bindings: [supply_humid, humid_units]
        ladder:
          - when: "the device was furnished with a humidifier and the patient's active supply enrollment shows the humidifier in use"
            value: "2 labor units"
          - when: "the device was furnished with a humidifier and the supply enrollment does not show it in use"
            value: "1 labor unit"
          - when: "otherwise (no humidifier furnished)"
            value: "0 labor units"
        baseline:
          humid_units: "0"
        evidence: [cross_category]
        cross_difficulty: resupply
      - id: setup_route_units
        effect: parameter
        decides: route_units
        bindings: [setup_mode, route_units]
        ladder:
          - when: "the unit was shipped for a virtual setup"
            value: "1 labor unit"
          - when: "the unit was set up in the patient's home"
            value: "2 labor units"
          - when: "otherwise (any other hand-over)"
            value: "0 labor units"
        baseline:
          route_units: "0"
        evidence: [history]
        cross_difficulty: null
      - id: warranty_rework_protocol
        effect: method
        decides: booked_units
        bindings: [warranty_jobs, warranty_job_units, warranty_total_units, booked_units]
        ladder:
          - when: "two or more manufacturer-warranty repairs are on the device record"
            method: "full diagnostic protocol: the labor units of all those warranty jobs plus 2 protocol units are added to the sum"
          - when: "exactly one manufacturer-warranty repair is on the device record"
            method: "the labor units booked on that warranty repair job, never less than 1, are added to the sum"
          - when: "otherwise (no warranty repair on the record)"
            method: "the sum of units is booked as counted"
        baseline:
          booked_units: "subtotal"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: pap_requests, aggregate: latest, field: decision_date, filters: {request_type: return_pickup, request_status: completed}}
        - {table: pap_service, aggregate: latest, field: delivery_mode, filters: {event_type: pap_delivery}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_repair, repair_coverage: manufacturer_warranty}}
        - {table: pap_service, aggregate: latest, field: labor_units, filters: {event_type: pap_repair, repair_coverage: manufacturer_warranty}}
        - {table: pap_service, aggregate: sum, field: labor_units, filters: {event_type: pap_repair, repair_coverage: manufacturer_warranty}}
      cross_category: [resupply]

  - id: pap_ext_return_parts
    base_policy_refs: [pap_repair_responsibility]
    overwrite: []
    trigger: on_request
    subject: [pap_repair]
    computes: parts_amount
    target_tool: record_return_inspection_bc7317cd
    params:
      filter_set_price: 7.50
      chamber_full_price: 24.00
      chamber_seal_price: 9.50
      heated_adapter_price: 12.00
      standard_hose_price: 6.00
      airpath_long_price: 18.00
      airpath_mid_price: 9.00
      airpath_long_days: 14
      airpath_mid_days: 7
      seal_two_price: 7.00
      seal_one_price: 3.50
    rule: >-
      The parts a returned self-pay unit consumes in reconditioning are booked on its return inspection
      at Summit Ridge list price. Reconditioning parts start from the filter set fitted to every returned
      unit, listed at 7.50 USD, and the internal air-path kit, chosen by the days from the delivery date on
      the device record to the date the completed return pickup request records the unit as received back:
      more than 14 days takes the full air-path kit at 18.00 USD, more than 7 and up to 14 days takes the
      half kit at 9.00 USD, and 7 days or less takes none. The parts list is the sum of the filter set and the
      air-path kit, booked to the cent. The water-chamber part depends on the
      humidifier: a device furnished with a humidifier to a patient whose active PAP supply enrollment
      shows the humidifier in use takes a new water chamber at 24.00 USD, a device furnished with a
      humidifier whose use the supply enrollment does not show takes a chamber seal at 9.50 USD, and a
      device without a humidifier takes no chamber part. The outlet part follows the tubing the patient's
      supply enrollment records: a patient whose active enrollment records heated tubing has the
      heated-tubing outlet adapter replaced at 12.00 USD, a patient on standard tubing with the humidifier
      in use has the standard outlet hose replaced at 6.00 USD, and any other patient takes no outlet part.
      A unit whose case was opened for warranty work takes new tamper seals and case screws: 7.00 USD for
      two or more manufacturer-warranty repairs on its device record, 3.50 USD for exactly one, and nothing
      for none. The water-chamber part, the outlet part and the tamper-seal part are added to the parts
      list. The air-path kit's day count starts from the latest event that put a fresh air path in the
      unit: on a unit with a manufacturer-warranty repair on its device record the days are counted from
      the service date of the latest such repair, on a unit shipped for a virtual setup they are counted
      from the transaction date on its sale line, the date the sale was paid and the unit left the warehouse, and on any other unit they are
      counted from the delivery date; the air-path kit tiers apply to that count.
    baseline:
      rule: >-
        Reconditioning parts start from the filter set fitted to every returned unit, listed at 7.50 USD,
        and the internal air-path kit, chosen by the days from the delivery date on the device record to
        the date the completed return pickup request records the unit as received back: more than 14 days
        takes the full air-path kit at 18.00 USD, more than 7 and up to 14 days takes the half kit at 9.00
        USD, and 7 days or less takes none. The parts list is the sum of the filter set and the air-path kit,
        booked to the cent.
      params: [filter_set_price, airpath_long_price, airpath_mid_price, airpath_long_days, airpath_mid_days]
    prerequisite: []
    cross_category:
      - category: resupply
        as: branch
        reads: [humidifier_in_use, heated_tubing_in_use, status]
        note: the water-chamber and outlet parts read the humidifier and tubing the patient's active supply enrollment records
    compute:
      - supply_humid: "CFIELD('resupply', 'humidifier_in_use', status='active')"
      - chamber_part: "K('chamber_full_price') if (F('humidifier_included') == True and supply_humid == True) else (K('chamber_seal_price') if F('humidifier_included') == True else 0)"
      - supply_heated: "CFIELD('resupply', 'heated_tubing_in_use', status='active')"
      - outlet_part: "K('heated_adapter_price') if supply_heated == True else (K('standard_hose_price') if CFIELD('resupply', 'humidifier_in_use', status='active') == True else 0)"
      - seal_jobs: "COUNT('pap_service', event_type='pap_repair', repair_coverage='manufacturer_warranty')"
      - seal_part: "K('seal_two_price') if seal_jobs >= 2 else (K('seal_one_price') if seal_jobs == 1 else 0)"
      - recv_date: "LATEST('pap_requests', 'decision_date', date_field='decision_date', request_type='return_pickup', request_status='completed')"
      - warranty_jobs: "COUNT('pap_service', event_type='pap_repair', repair_coverage='manufacturer_warranty')"
      - last_warranty_date: "LATEST('pap_service', 'service_date', date_field='service_date', event_type='pap_repair', repair_coverage='manufacturer_warranty')"
      - setup_mode: "LATEST('pap_service', 'delivery_mode', date_field='service_date', event_type='pap_delivery')"
      - sale_date: "LATEST('pap_billing', 'adjudication_date', date_field='adjudication_date', event_type='pap_purchase_sale')"
      - airpath_days: "DAYS(last_warranty_date, recv_date) if warranty_jobs >= 1 else (DAYS(sale_date, recv_date) if setup_mode == 'virtual_setup' else DAYS(F('setup_date'), recv_date))"
      - airpath_part: "K('airpath_long_price') if airpath_days > K('airpath_long_days') else (K('airpath_mid_price') if airpath_days > K('airpath_mid_days') else 0)"
      - parts_list: "K('filter_set_price') + airpath_part + chamber_part + outlet_part + seal_part"
      - result: "RND(parts_list, 2)"
    compute_basis:
      supply_humid: "a patient whose active PAP supply enrollment shows the humidifier in use"
      chamber_part: "a device furnished with a humidifier to a patient whose active PAP supply enrollment shows the humidifier in use takes a new water chamber at 24.00 USD, a device furnished with a humidifier whose use the supply enrollment does not show takes a chamber seal at 9.50 USD, and a device without a humidifier takes no chamber part."
      supply_heated: "The outlet part follows the tubing the patient's supply enrollment records"
      outlet_part: "a patient whose active enrollment records heated tubing has the heated-tubing outlet adapter replaced at 12.00 USD, a patient on standard tubing with the humidifier in use has the standard outlet hose replaced at 6.00 USD, and any other patient takes no outlet part."
      seal_jobs: "A unit whose case was opened for warranty work takes new tamper seals and case screws"
      seal_part: "7.00 USD for two or more manufacturer-warranty repairs on its device record, 3.50 USD for exactly one, and nothing for none."
      recv_date: "the date the completed return pickup request records the unit as received back"
      warranty_jobs: "on a unit with a manufacturer-warranty repair on its device record"
      last_warranty_date: "the days are counted from the service date of the latest such repair"
      setup_mode: "on a unit shipped for a virtual setup"
      sale_date: "counted from the transaction date on its sale line, the date the sale was paid and the unit left the warehouse"
      airpath_days: "on a unit with a manufacturer-warranty repair on its device record the days are counted from the service date of the latest such repair, on a unit shipped for a virtual setup they are counted from the transaction date on its sale line, the date the sale was paid and the unit left the warehouse, and on any other unit they are counted from the delivery date; the air-path kit tiers apply to that count."
      airpath_part: "more than 14 days takes the full air-path kit at 18.00 USD, more than 7 and up to 14 days takes the half kit at 9.00 USD, and 7 days or less takes none."
      parts_list: "The water-chamber part, the outlet part and the tamper-seal part are added to the parts list."
    factors:
      - id: chamber_part_price
        effect: parameter
        decides: chamber_part
        bindings: [supply_humid, chamber_part]
        ladder:
          - when: "the device was furnished with a humidifier and the patient's active supply enrollment shows the humidifier in use"
            value: "new water chamber, 24.00 USD"
          - when: "the device was furnished with a humidifier and the supply enrollment does not show it in use"
            value: "chamber seal, 9.50 USD"
          - when: "otherwise (no humidifier furnished)"
            value: "no chamber part, 0.00 USD"
        baseline:
          chamber_part: "0"
        evidence: [cross_category]
        cross_difficulty: resupply
      - id: outlet_part_price
        effect: parameter
        decides: outlet_part
        bindings: [supply_heated, outlet_part]
        ladder:
          - when: "the patient's active supply enrollment records heated tubing"
            value: "heated-tubing outlet adapter, 12.00 USD"
          - when: "the enrollment records standard tubing and the humidifier in use"
            value: "standard outlet hose, 6.00 USD"
          - when: "otherwise"
            value: "no outlet part, 0.00 USD"
        baseline:
          outlet_part: "0"
        evidence: [cross_category]
        cross_difficulty: resupply
      - id: case_seal_part
        effect: parameter
        decides: seal_part
        bindings: [seal_jobs, seal_part]
        ladder:
          - when: "two or more manufacturer-warranty repairs are on the device record"
            value: "7.00 USD"
          - when: "exactly one manufacturer-warranty repair is on the device record"
            value: "3.50 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          seal_part: "0"
        evidence: [history]
        cross_difficulty: null
      - id: airpath_clock_anchor
        effect: method
        decides: airpath_part
        bindings: [warranty_jobs, last_warranty_date, setup_mode, sale_date, airpath_days, airpath_part]
        ladder:
          - when: "a manufacturer-warranty repair is on the device record"
            method: "air-path kit chosen by the days from the service date of the latest warranty repair to the receipt date"
          - when: "no warranty repair, and the unit was shipped for a virtual setup"
            method: "air-path kit chosen by the days from the transaction date on the sale line (the date the sale was paid) to the receipt date"
          - when: "otherwise"
            method: "air-path kit chosen by the days from the delivery date to the receipt date"
        baseline:
          airpath_part: "K('airpath_long_price') if DAYS(F('setup_date'), recv_date) > K('airpath_long_days') else (K('airpath_mid_price') if DAYS(F('setup_date'), recv_date) > K('airpath_mid_days') else 0)"
        evidence: [history, date]
        cross_difficulty: null
    inputs:
      history:
        - {table: pap_requests, aggregate: latest, field: decision_date, filters: {request_type: return_pickup, request_status: completed}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_repair, repair_coverage: manufacturer_warranty}}
        - {table: pap_service, aggregate: latest, field: service_date, filters: {event_type: pap_repair, repair_coverage: manufacturer_warranty}}
        - {table: pap_billing, aggregate: latest, field: adjudication_date, filters: {event_type: pap_purchase_sale}}
        - {table: pap_service, aggregate: latest, field: delivery_mode, filters: {event_type: pap_delivery}}
      cross_category: [resupply]

  - id: pap_ext_used_accessories
    base_policy_refs: [pap_repair_responsibility]
    overwrite:
      - base_policy: pap_repair_responsibility
        superseded_clause: >-
          an owned self-pay device is repaired at the patient's cost (repair_coverage patient_paid).
        replaced_by: >-
          For a self-pay device sent back to Summit Ridge on a completed return pickup request, and only for such a device, the return
          inspection assigns no repair cost and the patient bears only the value of the used
          accessories that came with the unit; every other owned self-pay device that is outside the manufacturer warranty, or has water or drop damage, remains repaired at the patient's cost as the base repair rule states.
      - base_policy: pap_repair_responsibility
        superseded_clause: >-
          A patient-owned device within `manufacturer_warranty_months` of setup_date is repaired
          under the manufacturer warranty at no charge, except water_damage and drop_damage, which
          the warranty excludes.
        replaced_by: >-
          For a self-pay device sent back to Summit Ridge on a completed return pickup request, which this policy governs, and only for such
          a device, a unit still within the manufacturer warranty period is inspected and
          reconditioned for stock instead of being repaired under the manufacturer warranty; every
          other patient-owned device within the manufacturer warranty period remains repaired under
          the manufacturer warranty at no charge, except water and drop damage, as the base repair
          rule states.
      - base_policy: pap_repair_responsibility
        superseded_clause: >-
          A repair is recorded only on a device the patient still has
        replaced_by: >-
          For a self-pay device sent back to Summit Ridge on a completed return pickup request, and only for such a device, the return
          inspection is recorded on its device record while that record is patient_owned even though
          the unit is no longer in the patient's hands; every other repair remains recorded only on
          a device the patient still has, as the base repair rule states.
    trigger: on_request
    subject: [pap_repair]
    computes: repair_patient_share
    target_tool: record_return_inspection_bc7317cd
    params:
      nasal_mask_value: 89.00
      full_face_mask_value: 129.00
      pillows_mask_value: 108.00
      standard_tubing_value: 15.00
      heated_set_value: 63.00
      standard_set_value: 39.00
      shipped_packaging: 6.50
      home_packaging: 3.25
      tubing_period_days: 90
      hygiene_days: 14
    rule: >-
      A self-pay device sent back to Summit Ridge on a completed return pickup request is inspected and reconditioned for stock, not repaired
      for the patient, so its return inspection carries no repair cost assignment and the only amount the patient bears on it is the value of the used accessories that came with the unit. For a self-pay device sent back to Summit Ridge on a completed return pickup request, which this policy governs, and only for such a device, a unit still within the manufacturer warranty period is inspected and reconditioned for stock instead of being repaired under the manufacturer warranty; every other patient-owned device within the manufacturer warranty period remains repaired under the manufacturer warranty at no charge, except water and drop damage, as the base repair rule states. For a self-pay device sent back to Summit Ridge on a completed return pickup request, and only for such a device, the return inspection assigns no repair cost and the patient bears only the value of the used accessories that came with the unit; every other owned self-pay device that is outside the manufacturer warranty, or has water or drop damage, remains repaired at the patient's cost as the base repair rule states. For a self-pay device sent back to Summit Ridge on a completed return pickup request, and only for such a device, the return inspection is recorded on its device record while that record is patient_owned even though the unit is no longer in the patient's hands; every other repair remains recorded only on a device the patient still has, as the base repair rule states. The used accessories are a mask and the tubing set, valued at Summit Ridge self-pay prices: the standard
      kit is a nasal mask at 89.00 USD and standard tubing at 15.00 USD, and the standard used-accessory amount is the mask value plus the tubing value. The mask value follows the interface style recorded on the patient's
      active PAP supply enrollment: a full face mask is valued at 129.00 USD, a nasal pillows interface
      (frame and pillow pair) at 108.00 USD, and any other style at the nasal mask value. The tubing value
      follows the air path recorded on that enrollment: heated tubing with the humidifier in use is valued
      as the heated set of heated tubing and water chamber at 63.00 USD, standard tubing with the
      humidifier in use as the standard set of tubing and water chamber at 39.00 USD, and any other
      combination at the standard tubing value. How much of the kit value the patient bears depends on
      how long the unit was kept, counted from the delivery date on the device record to the date the
      completed return pickup request records the unit as received back: a patient with an active supply enrollment who kept the unit more than 14 days bears the mask value plus the tubing value prorated over the 90-day replacement period of the tubing, the tubing value times the days kept divided by 90; a patient who kept the unit 14 days or less bears the mask value
      only, the tubing set being cleaned and restocked; any other patient bears the full kit value. A
      unit that travelled carries its replacement packaging on top: 6.50 USD for a unit shipped for a virtual setup, 3.25 USD for a unit set up in the patient's home, and nothing for a unit handed over any
      other way. The amount is rounded half up to the cent.
    baseline:
      rule: >-
        The used accessories are a mask and the tubing set, valued at Summit Ridge self-pay prices: the
        standard kit is a nasal mask at 89.00 USD and standard tubing at 15.00 USD, and the standard used-accessory amount is the mask value plus the tubing value. The amount is rounded half up to the cent.
      params: [nasal_mask_value, standard_tubing_value]
    prerequisite: []
    cross_category:
      - category: resupply
        as: branch
        reads: [mask_style, heated_tubing_in_use, humidifier_in_use, status]
        note: the mask and tubing values read the interface and air path the patient's active supply enrollment records
    compute:
      - mask_style: "CFIELD('resupply', 'mask_style', status='active')"
      - mask_value: "K('full_face_mask_value') if mask_style == 'full_face' else (K('pillows_mask_value') if mask_style == 'nasal_pillows' else K('nasal_mask_value'))"
      - supply_heated: "CFIELD('resupply', 'heated_tubing_in_use', status='active')"
      - supply_humid: "CFIELD('resupply', 'humidifier_in_use', status='active')"
      - tubing_value: "K('heated_set_value') if (supply_heated == True and supply_humid == True) else (K('standard_set_value') if (supply_heated == False and supply_humid == True) else K('standard_tubing_value'))"
      - kit_value: "mask_value + tubing_value"
      - recv_date: "LATEST('pap_requests', 'decision_date', date_field='decision_date', request_type='return_pickup', request_status='completed')"
      - kept_days: "DAYS(F('setup_date'), recv_date)"
      - enrolled: "EXISTS('resupply', status='active')"
      - borne_value: "mask_value + tubing_value * kept_days / K('tubing_period_days') if (enrolled and kept_days > K('hygiene_days')) else (mask_value if kept_days <= K('hygiene_days') else kit_value)"
      - shipped_count: "COUNT('pap_service', event_type='pap_delivery', delivery_mode='virtual_setup')"
      - home_count: "COUNT('pap_service', event_type='pap_delivery', delivery_mode='in_home_setup')"
      - packaging: "K('shipped_packaging') if shipped_count >= 1 else (K('home_packaging') if home_count >= 1 else 0)"
      - result: "RND(borne_value + packaging, 2)"
    compute_basis:
      mask_style: "The mask value follows the interface style recorded on the patient's active PAP supply enrollment"
      mask_value: "a full face mask is valued at 129.00 USD, a nasal pillows interface (frame and pillow pair) at 108.00 USD, and any other style at the nasal mask value."
      supply_heated: "The tubing value follows the air path recorded on that enrollment"
      supply_humid: "The tubing value follows the air path recorded on that enrollment"
      tubing_value: "heated tubing with the humidifier in use is valued as the heated set of heated tubing and water chamber at 63.00 USD, standard tubing with the humidifier in use as the standard set of tubing and water chamber at 39.00 USD, and any other combination at the standard tubing value."
      kit_value: "the standard used-accessory amount is the mask value plus the tubing value."
      recv_date: "the date the completed return pickup request records the unit as received back"
      kept_days: "counted from the delivery date on the device record to the date the completed return pickup request records the unit as received back"
      enrolled: "a patient with an active supply enrollment"
      borne_value: "a patient with an active supply enrollment who kept the unit more than 14 days bears the mask value plus the tubing value prorated over the 90-day replacement period of the tubing, the tubing value times the days kept divided by 90; a patient who kept the unit 14 days or less bears the mask value only, the tubing set being cleaned and restocked; any other patient bears the full kit value."
      shipped_count: "A unit that travelled carries its replacement packaging on top"
      home_count: "3.25 USD for a unit set up in the patient's home"
      packaging: "6.50 USD for a unit shipped for a virtual setup, 3.25 USD for a unit set up in the patient's home, and nothing for a unit handed over any other way."
      result: "The amount is rounded half up to the cent."
    factors:
      - id: mask_style_value
        effect: parameter
        decides: mask_value
        bindings: [mask_style, mask_value]
        ladder:
          - when: "the active supply enrollment records a full face mask"
            value: "129.00 USD"
          - when: "the active supply enrollment records a nasal pillows interface"
            value: "108.00 USD"
          - when: "otherwise"
            value: "89.00 USD (nasal mask)"
        baseline:
          mask_value: "K('nasal_mask_value')"
        evidence: [cross_category]
        cross_difficulty: resupply
      - id: air_path_set_value
        effect: parameter
        decides: tubing_value
        bindings: [supply_heated, supply_humid, tubing_value]
        ladder:
          - when: "the enrollment records heated tubing and the humidifier in use"
            value: "heated set, 63.00 USD"
          - when: "the enrollment records standard tubing and the humidifier in use"
            value: "standard set, 39.00 USD"
          - when: "otherwise"
            value: "standard tubing, 15.00 USD"
        baseline:
          tubing_value: "K('standard_tubing_value')"
        evidence: [cross_category]
        cross_difficulty: resupply
      - id: hygiene_charge_basis
        effect: method
        decides: borne_value
        bindings: [recv_date, kept_days, enrolled, borne_value]
        ladder:
          - when: "the patient has an active supply enrollment and kept the unit more than 14 days"
            method: "the mask value plus the tubing value prorated over its 90-day replacement period (tubing value times days kept divided by 90)"
          - when: "the unit was kept 14 days or less"
            method: "the mask value only"
          - when: "otherwise"
            method: "the full kit value (mask plus tubing)"
        baseline:
          borne_value: "kit_value"
        evidence: [date, cross_category]
        cross_difficulty: resupply
      - id: travel_packaging_value
        effect: parameter
        decides: packaging
        bindings: [shipped_count, home_count, packaging]
        ladder:
          - when: "the unit was shipped for a virtual setup"
            value: "6.50 USD"
          - when: "the unit was set up in the patient's home"
            value: "3.25 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          packaging: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: pap_requests, aggregate: latest, field: decision_date, filters: {request_type: return_pickup, request_status: completed}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_delivery, delivery_mode: virtual_setup}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_delivery, delivery_mode: in_home_setup}}
      cross_category: [resupply]

  - id: pap_ext_self_pay_refund
    base_policy_refs: [pap_self_pay]
    overwrite:
      - base_policy: pap_self_pay
        superseded_clause: >-
          The refund is the device price less `self_pay_restocking_fee_pct` percent, rounded to the cent half
          up; the delivery fee and any mask or tubing that has been used are never refunded.
        replaced_by: >-
          The refund starts from the device price charged on the sale line being refunded, less a restocking
          fee of the class's standard restocking percentage of that price rounded half up to the cent, and
          less the standard accessory kit of 104.00 USD for the used mask and tubing; the standard refund does not include the delivery fee.
    trigger: on_request
    subject: [pap_purchase_refund]
    computes: refund_amount
    target_tool: return_device_for_refund_b6f98fe9
    params:
      wear_free_days: 14
      wear_short_limit_days: 21
      wear_daily_pct: 0.4
      wear_late_pct: 0.8
      restock_heavy_parts: 40
      restock_light_parts: 10
      restock_heavy_add: 5
      restock_light_add: 2.5
      cap_long_tenure: 140.00
      cap_short_tenure: 170.00
      tenure_months: 12
      handling_heavy_units: 10
      handling_light_units: 5
      handling_heavy: 35.00
      handling_light: 20.00
      std_kit_value: 104.00
      fee_half_share: 0.5
    rule: >-
      A self-pay device returned complete in its original packaging within the class's return window is
      refunded to the card it was paid with. The refund starts from the device price charged on the sale line being refunded, less a restocking
      fee of the class's standard restocking percentage of that price rounded half up to the cent, and
      less the standard accessory kit of 104.00 USD for the used mask and tubing; the standard refund does not include the delivery fee. For a self-pay refund this policy governs, and only for such a refund, the class's restocking percentage is taken of the refundable value worked out below rather than of the full device price, and the delivery fee, otherwise non-refundable, comes back to the patient only through the delivery fee credit below. The refund is fixed only after the device's service history carries a return inspection
      recording the value of used accessories the patient bears. No restocking percentage is set on the
      refund until the return inspection on the device record shows the reconditioning parts amount.
      Before the refund's handling charge is applied, the return inspection on the device record must
      show the reconditioning labor units booked for the unit. The days the patient kept the unit are
      counted from the delivery date on the device record to the date the completed return pickup request
      records the unit as received back. The refundable value of the unit depends on those days: a unit kept more than 21 days loses 0.4 percent of the price for each of days 15 to 21 and a further 0.8 percent of the price for each day kept beyond 21; a unit kept more than 14 and up to 21 days loses 0.4 percent of the price for each day kept beyond 14; a unit kept 14 days or less is refunded at the full price. The refundable value is rounded half up to
      the cent and is the base of the restocking fee. The restocking percentage follows the reconditioning
      parts amount on the return inspection: 40.00 USD or more of parts adds 5 percentage points to the class's standard restocking percentage, 10.00 USD or more but under 40.00 USD adds 2.5 percentage points, and less than 10.00 USD keeps the class's standard restocking percentage. The restocking fee is that percentage of the refundable value, rounded half
      up to the cent. Supply-program patients have the restocking fee capped: a patient whose PAP supply enrollment is active and has been open 12 months or more pays at most
      140.00 USD, a patient whose enrollment is active and has been open less than 12 months pays at most
      170.00 USD, and any other patient pays the fee uncapped. The used-accessory withholding follows
      the return inspection: when the return inspection on the device record shows a used-accessory amount above the standard accessory kit of 104.00 USD that amount is withheld, when it shows no used-accessory amount at all the accessories came back sealed and nothing is withheld, and in any other case, an amount above zero up to the standard kit or no used-accessory amount recorded on the device record, the standard kit is withheld as the minimum charge for opened accessories. The handling charge
      follows the reconditioning labor on the return inspection: 10 or more labor units cost 35.00 USD, 5
      to 9 labor units cost 20.00 USD, and fewer cost nothing. A unit that failed early is credited the
      delivery fee charged on its sale line: a unit with a manufacturer-warranty repair on its record that
      was shipped for a virtual setup is credited the whole delivery fee, a unit with such a repair that was
      handed over any other way is credited half the delivery fee, and any other unit is credited nothing.
      The refund is the refundable value, less the restocking fee after any cap, less the used-accessory
      withholding, less the handling charge, plus the delivery fee credit, rounded half up to the cent.
    baseline:
      rule: >-
        The refund starts from the device price charged on the sale line being refunded, less a restocking
        fee of the class's standard restocking percentage of that price rounded half up to the cent, and
        less the standard accessory kit of 104.00 USD for the used mask and tubing; the standard refund does not include the delivery fee.
      params: [std_kit_value, self_pay_restocking_fee_pct]
    prerequisite:
      - problem: pap_ext_used_accessories
        kind: value_input
        gate: withheld_value
        form: state
        policy_source: >-
          The refund is fixed only after the device's service history carries a return inspection
          recording the value of used accessories the patient bears.
        condition: >-
          a pap_repair service record with repair_coverage none stands on the returned device record and
          carries the used-accessory amount in repair_patient_share
        resolved_by: record_return_inspection_bc7317cd
        effect: >-
          the used-accessory withholding is set from the amount the inspection records: an amount above the standard accessory kit of 104.00 USD is withheld as recorded, a sealed return (an inspection recording no amount) withholds nothing, and any other amount, or no amount recorded, withholds the standard kit
      - problem: pap_ext_return_parts
        kind: value_input
        gate: restock_pct
        form: state
        policy_source: >-
          No restocking percentage is set on the refund until the return inspection on the device record
          shows the reconditioning parts amount.
        condition: >-
          a pap_repair service record with repair_coverage none stands on the returned device record and
          carries the reconditioning parts amount in parts_amount
        resolved_by: record_return_inspection_bc7317cd
        effect: >-
          the restocking percentage moves from the class's standard percentage to the tier the recorded
          parts amount selects
      - problem: pap_ext_return_labor
        kind: value_input
        gate: handling_charge
        form: state
        policy_source: >-
          Before the refund's handling charge is applied, the return inspection on the device record must
          show the reconditioning labor units booked for the unit.
        condition: >-
          a pap_repair service record with repair_coverage none stands on the returned device record and
          carries the reconditioning labor in labor_units
        resolved_by: record_return_inspection_bc7317cd
        effect: >-
          the handling charge moves from nothing to the tier the recorded labor units select
    cross_category:
      - category: resupply
        as: branch
        reads: [status, enrollment_date]
        note: the restocking cap reads whether the supply enrollment is active and how long it has been open
    compute:
      - sale_price: "LATEST('pap_billing', 'sale_amount', date_field='service_from_date', event_type='pap_purchase_sale')"
      - recv_date: "LATEST('pap_requests', 'decision_date', date_field='decision_date', request_type='return_pickup', request_status='completed')"
      - kept_days: "DAYS(F('setup_date'), recv_date)"
      - worn_value: "RND(sale_price * (1 - K('wear_daily_pct') / 100 * (K('wear_short_limit_days') - K('wear_free_days')) - K('wear_late_pct') / 100 * (kept_days - K('wear_short_limit_days'))), 2) if kept_days > K('wear_short_limit_days') else (RND(sale_price * (1 - K('wear_daily_pct') / 100 * (kept_days - K('wear_free_days'))), 2) if kept_days > K('wear_free_days') else sale_price)"
      - parts_recorded: "MAX('pap_service', 'parts_amount', event_type='pap_repair', repair_coverage='none')"
      - restock_pct: "P('self_pay_restocking_fee_pct') + K('restock_heavy_add') if parts_recorded >= K('restock_heavy_parts') else (P('self_pay_restocking_fee_pct') + K('restock_light_add') if parts_recorded >= K('restock_light_parts') else P('self_pay_restocking_fee_pct'))"
      - raw_restock: "RND(worn_value * restock_pct / 100, 2)"
      - enroll_months: "MONTHS(CFIELD('resupply', 'enrollment_date', status='active'), NOW) if CFIELD('resupply', 'status', status='active') == 'active' else 0"
      - supply_status: "CFIELD('resupply', 'status', status='active')"
      - restock_cap: "K('cap_long_tenure') if (enroll_months >= K('tenure_months') and supply_status == 'active') else (K('cap_short_tenure') if (enroll_months < K('tenure_months') and supply_status == 'active') else raw_restock)"
      - restock_fee: "MN(raw_restock, restock_cap)"
      - inspections: "COUNT('pap_service', event_type='pap_repair', repair_coverage='none')"
      - share_recorded: "MAX('pap_service', 'repair_patient_share', event_type='pap_repair', repair_coverage='none')"
      - withheld_value: "share_recorded if share_recorded > K('std_kit_value') else (0 if (inspections >= 1 and share_recorded == 0) else K('std_kit_value'))"
      - labor_recorded: "MAX('pap_service', 'labor_units', event_type='pap_repair', repair_coverage='none')"
      - handling_charge: "K('handling_heavy') if labor_recorded >= K('handling_heavy_units') else (K('handling_light') if labor_recorded >= K('handling_light_units') else 0)"
      - warranty_jobs: "COUNT('pap_service', event_type='pap_repair', repair_coverage='manufacturer_warranty')"
      - setup_mode: "LATEST('pap_service', 'delivery_mode', date_field='service_date', event_type='pap_delivery')"
      - sale_fee: "LATEST('pap_billing', 'fee_amount', date_field='service_from_date', event_type='pap_purchase_sale')"
      - fee_credit: "sale_fee if (warranty_jobs >= 1 and setup_mode == 'virtual_setup') else (RND(sale_fee * K('fee_half_share'), 2) if (warranty_jobs >= 1 and setup_mode != 'virtual_setup') else 0)"
      - result: "RND(worn_value - restock_fee - withheld_value - handling_charge + fee_credit, 2)"
    compute_basis:
      sale_price: "The refund starts from the device price charged on the sale line being refunded"
      recv_date: "the date the completed return pickup request records the unit as received back"
      kept_days: "The days the patient kept the unit are counted from the delivery date on the device record to the date the completed return pickup request records the unit as received back."
      worn_value: "a unit kept more than 21 days loses 0.4 percent of the price for each of days 15 to 21 and a further 0.8 percent of the price for each day kept beyond 21; a unit kept more than 14 and up to 21 days loses 0.4 percent of the price for each day kept beyond 14; a unit kept 14 days or less is refunded at the full price. The refundable value is rounded half up to the cent and is the base of the restocking fee."
      parts_recorded: "The restocking percentage follows the reconditioning parts amount on the return inspection"
      restock_pct: "40.00 USD or more of parts adds 5 percentage points to the class's standard restocking percentage, 10.00 USD or more but under 40.00 USD adds 2.5 percentage points, and less than 10.00 USD keeps the class's standard restocking percentage."
      raw_restock: "The restocking fee is that percentage of the refundable value, rounded half up to the cent."
      enroll_months: "has been open 12 months or more"
      supply_status: "a patient whose PAP supply enrollment is active"
      restock_cap: "a patient whose PAP supply enrollment is active and has been open 12 months or more pays at most 140.00 USD, a patient whose enrollment is active and has been open less than 12 months pays at most 170.00 USD, and any other patient pays the fee uncapped."
      restock_fee: "less the restocking fee after any cap"
      inspections: "when it shows no used-accessory amount at all the accessories came back sealed and nothing is withheld"
      share_recorded: "The used-accessory withholding follows the return inspection"
      withheld_value: "when the return inspection on the device record shows a used-accessory amount above the standard accessory kit of 104.00 USD that amount is withheld, when it shows no used-accessory amount at all the accessories came back sealed and nothing is withheld, and in any other case, an amount above zero up to the standard kit or no used-accessory amount recorded on the device record, the standard kit is withheld as the minimum charge for opened accessories."
      labor_recorded: "The handling charge follows the reconditioning labor on the return inspection"
      handling_charge: "10 or more labor units cost 35.00 USD, 5 to 9 labor units cost 20.00 USD, and fewer cost nothing."
      warranty_jobs: "a unit with a manufacturer-warranty repair on its record"
      setup_mode: "that was shipped for a virtual setup"
      sale_fee: "A unit that failed early is credited the delivery fee charged on its sale line"
      fee_credit: "a unit with a manufacturer-warranty repair on its record that was shipped for a virtual setup is credited the whole delivery fee, a unit with such a repair that was handed over any other way is credited half the delivery fee, and any other unit is credited nothing."
      result: "The refund is the refundable value, less the restocking fee after any cap, less the used-accessory withholding, less the handling charge, plus the delivery fee credit, rounded half up to the cent."
    factors:
      - id: wear_proration
        effect: method
        decides: worn_value
        bindings: [recv_date, kept_days, worn_value]
        ladder:
          - when: "the unit was kept more than 21 days"
            method: "two-rate proration: 0.4 percent of the price for each of days 15 to 21 plus 0.8 percent for each day beyond 21, rounded to the cent"
          - when: "the unit was kept more than 14 and up to 21 days"
            method: "price less 0.4 percent of the price per day kept beyond 14, rounded to the cent"
          - when: "otherwise (kept 14 days or less)"
            method: "the full price"
        baseline:
          worn_value: "sale_price"
        evidence: [date]
        cross_difficulty: null
      - id: restock_rate_tier
        effect: parameter
        decides: restock_pct
        bindings: [parts_recorded, restock_pct]
        ladder:
          - when: "the return inspection records 40.00 USD or more of reconditioning parts"
            value: "the class's standard restocking percentage plus 5 percentage points"
          - when: "the return inspection records 10.00 USD or more but under 40.00 USD of parts"
            value: "the class's standard restocking percentage plus 2.5 percentage points"
          - when: "otherwise (under 10.00 USD of parts)"
            value: "the class's standard restocking percentage"
        baseline:
          restock_pct: "P('self_pay_restocking_fee_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: restock_loyalty_cap
        effect: parameter
        decides: restock_cap
        bindings: [enroll_months, supply_status, restock_cap]
        ladder:
          - when: "the PAP supply enrollment is active and has been open 12 months or more"
            value: "restocking fee capped at 140.00 USD"
          - when: "the PAP supply enrollment is active and has been open less than 12 months"
            value: "restocking fee capped at 170.00 USD"
          - when: "otherwise"
            value: "no cap"
        baseline:
          restock_cap: "raw_restock"
        evidence: [cross_category, date]
        cross_difficulty: resupply
      - id: accessory_withholding
        effect: parameter
        decides: withheld_value
        bindings: [inspections, share_recorded, withheld_value]
        ladder:
          - when: "the return inspection shows a used-accessory amount above the standard kit of 104.00 USD"
            value: "the recorded used-accessory amount"
          - when: "the return inspection shows no used-accessory amount at all (accessories came back sealed)"
            value: "0.00 USD"
          - when: "otherwise (an amount above zero up to the standard kit, or no used-accessory amount recorded on the device record)"
            value: "standard accessory kit, 104.00 USD (minimum charge for opened accessories)"
        baseline:
          withheld_value: "K('std_kit_value')"
        evidence: [history]
        cross_difficulty: null
      - id: handling_charge_tier
        effect: parameter
        decides: handling_charge
        bindings: [labor_recorded, handling_charge]
        ladder:
          - when: "the return inspection records 10 or more labor units"
            value: "35.00 USD"
          - when: "the return inspection records 5 to 9 labor units"
            value: "20.00 USD"
          - when: "otherwise (fewer than 5 units)"
            value: "0.00 USD"
        baseline:
          handling_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: delivery_fee_credit
        effect: parameter
        decides: fee_credit
        bindings: [warranty_jobs, setup_mode, sale_fee, fee_credit]
        ladder:
          - when: "a manufacturer-warranty repair is on the device record and the unit was shipped for a virtual setup"
            value: "the whole delivery fee charged on the sale line"
          - when: "a manufacturer-warranty repair is on the device record and the unit was handed over any other way"
            value: "half the delivery fee charged on the sale line"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          fee_credit: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: pap_billing, aggregate: latest, field: sale_amount, filters: {event_type: pap_purchase_sale}}
        - {table: pap_billing, aggregate: latest, field: fee_amount, filters: {event_type: pap_purchase_sale}}
        - {table: pap_requests, aggregate: latest, field: decision_date, filters: {request_type: return_pickup, request_status: completed}}
        - {table: pap_service, aggregate: max, field: parts_amount, filters: {event_type: pap_repair, repair_coverage: none}}
        - {table: pap_service, aggregate: max, field: labor_units, filters: {event_type: pap_repair, repair_coverage: none}}
        - {table: pap_service, aggregate: max, field: repair_patient_share, filters: {event_type: pap_repair, repair_coverage: none}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_repair, repair_coverage: manufacturer_warranty}}
      cross_category: [resupply]

  - id: pap_ext_usage_nights
    base_policy_refs: [pap_trial_compliance]
    overwrite:
      - base_policy: pap_trial_compliance
        superseded_clause: >-
          A compliance download scores one window of `compliance_window_days` consecutive nights
        replaced_by: >-
          For a usage summary download, which this policy governs, and only for such a download, the
          download is not a scored compliance window: it states the qualifying nights the modem has
          reported from the setup date on the device record through the last night of the latest
          downloaded window, and carries no met or not-met result; every other compliance download
          remains a scored window of the class's compliance window nights, as the base trial-compliance rule states.
    trigger: on_request
    subject: [pap_compliance_download]
    computes: nights_4h_plus
    target_tool: record_usage_download_48c54aed
    params:
      swap_home_credit: 2
      swap_other_credit: 1
      acclim_low_credit: 5
      acclim_mid_credit: 3
      acclim_low_pct: 50
      acclim_mid_pct: 70
      window_nights: 30
      pressure_approved_credit: 3
      pressure_pending_credit: 1
    rule: >-
      A usage summary download is a statement Summit Ridge files on a device record to summarise the therapy use the modem has reported for the unit standing in the home. For a usage summary download, which this policy governs, and only for such a download, the download is not a scored compliance window: it states the qualifying nights the modem has reported from the setup date on the device record through the last night of the latest downloaded window, and carries no met or not-met result; every other compliance download remains a scored window of the class's compliance window nights, as the base trial-compliance rule states. The qualifying nights credited start from the nights of four hours or more reported in the
      30-night compliance windows downloaded on the device record, summed across those windows. Which windows
      are summed follows the units that have stood in the home: on a record with a malfunction swap only
      the windows downloaded from the serial now on the record are summed; on a record with a loaner
      delivery and no swap every window except those downloaded from the loaner's serial is summed; on any
      other record every window is summed. Nights lost to an equipment fault are credited: a record whose
      latest malfunction swap was made by an in-home visit is credited 2 nights, a record with a swap made
      any other way is credited 1 night, and a record without a swap is credited none. The first weeks on
      therapy are credited by how the unit first set up performed, taking its qualifying nights as a share
      of 30 nights per window downloaded from it: under 50 percent credits 5 nights, 50 percent or more but
      under 70 percent credits 3 nights, and 70 percent or more, or no window from that unit, credits none.
      A pressure change re-starts acclimation: a record with an approved pressure change request is
      credited 3 nights, a record whose pressure change request is still submitted is credited 1 night,
      and any other record is credited none. The qualifying nights credited are the windows summed plus
      these credits, a whole number of nights.
    baseline:
      rule: >-
        The qualifying nights credited start from the nights of four hours or more reported in the 30-night
        compliance windows downloaded on the device record, summed across those windows.
      params: []
    prerequisite: []
    cross_category: []
    compute:
      - all_nights: "(SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='not_met') + SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='met'))"
      - swaps: "COUNT('pap_service', event_type='pap_delivery', delivery_purpose='malfunction_swap')"
      - loaners: "COUNT('pap_service', event_type='pap_delivery', delivery_purpose='loaner')"
      - loaner_serial: "LATEST('pap_service', 'serial_number', date_field='service_date', event_type='pap_delivery', delivery_purpose='loaner')"
      - counted_nights: "(SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='not_met', serial_number=F('serial_number')) + SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='met', serial_number=F('serial_number'))) if swaps >= 1 else (all_nights - (SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='not_met', serial_number=loaner_serial) + SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='met', serial_number=loaner_serial)) if loaners >= 1 else all_nights)"
      - swap_jobs: "COUNT('pap_service', event_type='pap_delivery', delivery_purpose='malfunction_swap')"
      - swap_mode: "LATEST('pap_service', 'delivery_mode', date_field='service_date', event_type='pap_delivery', delivery_purpose='malfunction_swap')"
      - swap_credit: "K('swap_home_credit') if (swap_jobs >= 1 and swap_mode == 'in_home_setup') else (K('swap_other_credit') if swap_jobs >= 1 else 0)"
      - first_serial: "LATEST('pap_service', 'serial_number', date_field='service_date', event_type='pap_delivery', delivery_purpose='initial_rental_setup')"
      - first_nights: "(SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='not_met', serial_number=first_serial) + SUM('pap_service', 'nights_4h_plus', event_type='pap_compliance_download', compliance_result='met', serial_number=first_serial))"
      - first_windows: "(COUNT('pap_service', event_type='pap_compliance_download', compliance_result='not_met', serial_number=first_serial) + COUNT('pap_service', event_type='pap_compliance_download', compliance_result='met', serial_number=first_serial))"
      - first_share: "first_nights * 100 / (first_windows * K('window_nights')) if first_windows >= 1 else 100"
      - acclim_credit: "K('acclim_low_credit') if first_share < K('acclim_low_pct') else (K('acclim_mid_credit') if first_share < K('acclim_mid_pct') else 0)"
      - pressure_approved: "COUNT('pap_requests', request_type='pressure_change', request_status='approved')"
      - pressure_pending: "COUNT('pap_requests', request_type='pressure_change', request_status='submitted')"
      - pressure_credit: "K('pressure_approved_credit') if pressure_approved >= 1 else (K('pressure_pending_credit') if pressure_pending >= 1 else 0)"
      - result: "int(counted_nights + swap_credit + acclim_credit + pressure_credit)"
    compute_basis:
      all_nights: "The qualifying nights credited start from the nights of four hours or more reported in the 30-night compliance windows downloaded on the device record, summed across those windows."
      swaps: "on a record with a malfunction swap"
      loaners: "on a record with a loaner delivery and no swap"
      loaner_serial: "every window except those downloaded from the loaner's serial is summed"
      counted_nights: "on a record with a malfunction swap only the windows downloaded from the serial now on the record are summed; on a record with a loaner delivery and no swap every window except those downloaded from the loaner's serial is summed; on any other record every window is summed."
      swap_jobs: "a record with a swap made any other way"
      swap_mode: "a record whose latest malfunction swap was made by an in-home visit"
      swap_credit: "a record whose latest malfunction swap was made by an in-home visit is credited 2 nights, a record with a swap made any other way is credited 1 night, and a record without a swap is credited none."
      first_serial: "The first weeks on therapy are credited by how the unit first set up performed"
      first_nights: "taking its qualifying nights as a share of 30 nights per window downloaded from it"
      first_windows: "taking its qualifying nights as a share of 30 nights per window downloaded from it"
      first_share: "taking its qualifying nights as a share of 30 nights per window downloaded from it"
      acclim_credit: "under 50 percent credits 5 nights, 50 percent or more but under 70 percent credits 3 nights, and 70 percent or more, or no window from that unit, credits none."
      pressure_approved: "a record with an approved pressure change request"
      pressure_pending: "a record whose pressure change request is still submitted"
      pressure_credit: "a record with an approved pressure change request is credited 3 nights, a record whose pressure change request is still submitted is credited 1 night, and any other record is credited none."
      result: "The qualifying nights credited are the windows summed plus these credits, a whole number of nights."
    factors:
      - id: serial_window_scope
        effect: method
        decides: counted_nights
        bindings: [swaps, loaners, loaner_serial, counted_nights]
        ladder:
          - when: "a malfunction swap is on the device record"
            method: "sum only the windows downloaded from the serial now on the record"
          - when: "a loaner delivery and no swap is on the device record"
            method: "sum every window except those downloaded from the loaner's serial"
          - when: "otherwise"
            method: "sum every window on the record"
        baseline:
          counted_nights: "all_nights"
        evidence: [history]
        cross_difficulty: null
      - id: swap_night_credit
        effect: parameter
        decides: swap_credit
        bindings: [swap_jobs, swap_mode, swap_credit]
        ladder:
          - when: "a malfunction swap is on the record and the latest one was made by an in-home visit"
            value: "2 nights"
          - when: "a malfunction swap is on the record and the latest one was made any other way"
            value: "1 night"
          - when: "otherwise (no swap)"
            value: "0 nights"
        baseline:
          swap_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: acclimation_night_credit
        effect: parameter
        decides: acclim_credit
        bindings: [first_serial, first_nights, first_windows, first_share, acclim_credit]
        ladder:
          - when: "the unit first set up reported qualifying nights under 50 percent of 30 nights per window"
            value: "5 nights"
          - when: "it reported 50 percent or more but under 70 percent"
            value: "3 nights"
          - when: "otherwise (70 percent or more, or no window from that unit)"
            value: "0 nights"
        baseline:
          acclim_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: pressure_night_credit
        effect: parameter
        decides: pressure_credit
        bindings: [pressure_approved, pressure_pending, pressure_credit]
        ladder:
          - when: "an approved pressure change request is on the device record"
            value: "3 nights"
          - when: "a pressure change request is still submitted"
            value: "1 night"
          - when: "otherwise"
            value: "0 nights"
        baseline:
          pressure_credit: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: pap_service, aggregate: sum, field: nights_4h_plus, filters: {event_type: pap_compliance_download}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_delivery, delivery_purpose: malfunction_swap}}
        - {table: pap_service, aggregate: latest, field: serial_number, filters: {event_type: pap_delivery, delivery_purpose: initial_rental_setup}}
        - {table: pap_requests, aggregate: count, field: pap_request_id, filters: {request_type: pressure_change}}
      cross_category: []

  - id: pap_ext_usage_hours
    base_policy_refs: [pap_trial_compliance]
    overwrite:
      - base_policy: pap_trial_compliance
        superseded_clause: >-
          A compliance download scores one window of `compliance_window_days` consecutive nights
        replaced_by: >-
          For a usage summary download, which this policy governs, and only for such a download, the
          average daily use is a statement of the hours the modem has reported, not a compliance
          score, and the summary carries no met or not-met result; every other compliance download
          remains a scored window of the class's compliance window nights, as the base trial-compliance rule states.
    trigger: on_request
    subject: [pap_compliance_download]
    computes: avg_daily_use_hours
    target_tool: record_usage_download_48c54aed
    params:
      swap_home_hours: 0.2
      swap_other_hours: 0.1
      pressure_approved_hours: 0.3
      pressure_pending_hours: 0.1
      first_low_hours: 3.0
      first_mid_hours: 4.0
      first_low_add: 0.2
      first_mid_add: 0.1
    rule: >-
      For a usage summary download, which this policy governs, and only for such a download, the average daily use is a statement of the hours the modem has reported, not a compliance score, and the summary carries no met or not-met result; every other compliance download remains a scored window of the class's compliance window nights, as the base trial-compliance rule states. The average daily
      use stated starts from the average hours per 24 hours of the 30-night compliance windows downloaded
      on the device record, averaged across those windows with each window counting once, and is rounded half up to one decimal place; a device record with no such window states 0.0 hours. Which windows are averaged follows the units that have stood in the home: on
      a record with a malfunction swap only the windows downloaded from the serial now on the record are
      averaged; on a record with a loaner delivery and no swap every window except those downloaded from
      the loaner's serial is averaged; on any other record every window is averaged. Hours lost to an
      equipment fault are added back to the average: a record whose latest malfunction swap was made by an
      in-home visit adds 0.2 hours, a record with a swap made any other way adds 0.1 hours, and a record
      without a swap adds nothing. A pressure change shortens nights while the patient adjusts: a record
      with an approved pressure change request adds 0.3 hours, a record whose pressure change request is
      still submitted adds 0.1 hours, and any other record adds nothing. The first weeks on therapy are
      allowed for by how the unit first set up performed, taking the average of its windows: under 3.0
      hours adds 0.2 hours, 3.0 hours or more but under 4.0 hours adds 0.1 hours, and 4.0 hours or more,
      or no window from that unit, adds nothing. The average daily use stated is the averaged windows plus
      these additions, rounded half up to one decimal place once, at the end.
    baseline:
      rule: >-
        The average daily use stated starts from the average hours per 24 hours of the 30-night compliance
        windows downloaded on the device record, averaged across those windows with each window counting once, and is rounded half up to one decimal place; a device record with no such window states 0.0 hours.
      params: []
    prerequisite: []
    cross_category: []
    compute:
      - all_hours: "(SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='not_met') + SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='met'))"
      - all_windows: "(COUNT('pap_service', event_type='pap_compliance_download', compliance_result='not_met') + COUNT('pap_service', event_type='pap_compliance_download', compliance_result='met'))"
      - swaps: "COUNT('pap_service', event_type='pap_delivery', delivery_purpose='malfunction_swap')"
      - loaners: "COUNT('pap_service', event_type='pap_delivery', delivery_purpose='loaner')"
      - loaner_serial: "LATEST('pap_service', 'serial_number', date_field='service_date', event_type='pap_delivery', delivery_purpose='loaner')"
      - averaged_hours: "(SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='not_met', serial_number=F('serial_number')) + SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='met', serial_number=F('serial_number'))) / MX(1, (COUNT('pap_service', event_type='pap_compliance_download', compliance_result='not_met', serial_number=F('serial_number')) + COUNT('pap_service', event_type='pap_compliance_download', compliance_result='met', serial_number=F('serial_number')))) if swaps >= 1 else ((all_hours - (SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='not_met', serial_number=loaner_serial) + SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='met', serial_number=loaner_serial))) / MX(1, all_windows - (COUNT('pap_service', event_type='pap_compliance_download', compliance_result='not_met', serial_number=loaner_serial) + COUNT('pap_service', event_type='pap_compliance_download', compliance_result='met', serial_number=loaner_serial))) if loaners >= 1 else all_hours / MX(1, all_windows))"
      - swap_jobs: "COUNT('pap_service', event_type='pap_delivery', delivery_purpose='malfunction_swap')"
      - swap_mode: "LATEST('pap_service', 'delivery_mode', date_field='service_date', event_type='pap_delivery', delivery_purpose='malfunction_swap')"
      - swap_hours: "K('swap_home_hours') if (swap_jobs >= 1 and swap_mode == 'in_home_setup') else (K('swap_other_hours') if swap_jobs >= 1 else 0)"
      - pressure_approved: "COUNT('pap_requests', request_type='pressure_change', request_status='approved')"
      - pressure_pending: "COUNT('pap_requests', request_type='pressure_change', request_status='submitted')"
      - pressure_hours: "K('pressure_approved_hours') if pressure_approved >= 1 else (K('pressure_pending_hours') if pressure_pending >= 1 else 0)"
      - first_serial: "LATEST('pap_service', 'serial_number', date_field='service_date', event_type='pap_delivery', delivery_purpose='initial_rental_setup')"
      - first_windows: "(COUNT('pap_service', event_type='pap_compliance_download', compliance_result='not_met', serial_number=first_serial) + COUNT('pap_service', event_type='pap_compliance_download', compliance_result='met', serial_number=first_serial))"
      - first_avg: "(SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='not_met', serial_number=first_serial) + SUM('pap_service', 'avg_daily_use_hours', event_type='pap_compliance_download', compliance_result='met', serial_number=first_serial)) / first_windows if first_windows >= 1 else K('first_mid_hours')"
      - first_hours: "K('first_low_add') if first_avg < K('first_low_hours') else (K('first_mid_add') if first_avg < K('first_mid_hours') else 0)"
      - result: "RND(averaged_hours + swap_hours + pressure_hours + first_hours, 1)"
    compute_basis:
      all_hours: "The average daily use stated starts from the average hours per 24 hours of the 30-night compliance windows downloaded on the device record, averaged across those windows with each window counting once"
      all_windows: "averaged across those windows with each window counting once"
      swaps: "on a record with a malfunction swap"
      loaners: "on a record with a loaner delivery and no swap"
      loaner_serial: "every window except those downloaded from the loaner's serial is averaged"
      averaged_hours: "on a record with a malfunction swap only the windows downloaded from the serial now on the record are averaged; on a record with a loaner delivery and no swap every window except those downloaded from the loaner's serial is averaged; on any other record every window is averaged."
      swap_jobs: "a record with a swap made any other way"
      swap_mode: "a record whose latest malfunction swap was made by an in-home visit"
      swap_hours: "a record whose latest malfunction swap was made by an in-home visit adds 0.2 hours, a record with a swap made any other way adds 0.1 hours, and a record without a swap adds nothing."
      pressure_approved: "a record with an approved pressure change request"
      pressure_pending: "a record whose pressure change request is still submitted"
      pressure_hours: "a record with an approved pressure change request adds 0.3 hours, a record whose pressure change request is still submitted adds 0.1 hours, and any other record adds nothing."
      first_serial: "The first weeks on therapy are allowed for by how the unit first set up performed"
      first_windows: "taking the average of its windows"
      first_avg: "taking the average of its windows"
      first_hours: "under 3.0 hours adds 0.2 hours, 3.0 hours or more but under 4.0 hours adds 0.1 hours, and 4.0 hours or more, or no window from that unit, adds nothing."
      result: "The average daily use stated is the averaged windows plus these additions, rounded half up to one decimal place once, at the end."
    factors:
      - id: serial_hours_scope
        effect: method
        decides: averaged_hours
        bindings: [swaps, loaners, loaner_serial, averaged_hours]
        ladder:
          - when: "a malfunction swap is on the device record"
            method: "average only the windows downloaded from the serial now on the record"
          - when: "a loaner delivery and no swap is on the device record"
            method: "average every window except those downloaded from the loaner's serial"
          - when: "otherwise"
            method: "average every window on the record"
        baseline:
          averaged_hours: "all_hours / MX(1, all_windows)"
        evidence: [history]
        cross_difficulty: null
      - id: swap_time_addback
        effect: parameter
        decides: swap_hours
        bindings: [swap_jobs, swap_mode, swap_hours]
        ladder:
          - when: "a malfunction swap is on the record and the latest one was made by an in-home visit"
            value: "0.2 hours"
          - when: "a malfunction swap is on the record and the latest one was made any other way"
            value: "0.1 hours"
          - when: "otherwise (no swap)"
            value: "0.0 hours"
        baseline:
          swap_hours: "0"
        evidence: [history]
        cross_difficulty: null
      - id: pressure_time_addback
        effect: parameter
        decides: pressure_hours
        bindings: [pressure_approved, pressure_pending, pressure_hours]
        ladder:
          - when: "an approved pressure change request is on the device record"
            value: "0.3 hours"
          - when: "a pressure change request is still submitted"
            value: "0.1 hours"
          - when: "otherwise"
            value: "0.0 hours"
        baseline:
          pressure_hours: "0"
        evidence: [history]
        cross_difficulty: null
      - id: first_unit_time_addback
        effect: parameter
        decides: first_hours
        bindings: [first_serial, first_windows, first_avg, first_hours]
        ladder:
          - when: "the windows of the unit first set up average under 3.0 hours"
            value: "0.2 hours"
          - when: "they average 3.0 hours or more but under 4.0 hours"
            value: "0.1 hours"
          - when: "otherwise (4.0 hours or more, or no window from that unit)"
            value: "0.0 hours"
        baseline:
          first_hours: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: pap_service, aggregate: sum, field: avg_daily_use_hours, filters: {event_type: pap_compliance_download}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_compliance_download}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_delivery, delivery_purpose: malfunction_swap}}
        - {table: pap_requests, aggregate: count, field: pap_request_id, filters: {request_type: pressure_change}}
      cross_category: []

  - id: pap_ext_home_unit_purchase
    base_policy_refs: [pap_self_pay, pap_evt_rental_billing]
    overwrite:
      - base_policy: pap_evt_rental_billing
        superseded_clause: >-
          A rental month is billed only while the device record is trial_active or rental_active.
        replaced_by: >-
          a rental month is billed only while the device record is trial_active or rental_active and
          carries no self-pay sale of the unit.
      - base_policy: pap_self_pay
        superseded_clause: >-
          Any class may be bought outright by a self-pay patient at `self_pay_retail_price` plus
          `self_pay_delivery_fee`, paid in full when the order is placed;
        replaced_by: >-
          For a unit bought outright where it already stands in the patient's home on a coverage-billed device record, which this policy governs, and only for such a unit, the unit is
          sold at its list price, paid in full by the patient when the sale is booked, with no
          delivery fee; every other outright purchase remains at the class's self-pay retail price
          plus its self-pay delivery fee, paid in full when the order is placed, as the base self-pay rule states.
    trigger: on_request
    subject: [pap_purchase_sale]
    computes: sale_amount
    target_tool: purchase_home_device_8c1f8216
    params:
      rated_hours: 20000
      regular_use_hours: 4.5
      light_use_hours: 2.0
      night_hours: 4
      qualifying_floor: 63
      short_floor: 40
      failed_far_pct: 15
      failed_near_pct: 8
      failed_edge_pct: 4
      mid_floor: 50
      repair_two_pct: 10
      repair_one_pct: 5
      humid_full_value: 79.00
      humid_half_value: 39.50
    rule: >-
      A patient may buy outright the unit that already stands in their home on a coverage-billed device
      record, as a self-pay purchase, instead of returning it. A unit bought outright is sold at the
      class's self-pay retail price, paid in full by the patient when the sale is booked; a unit already standing in the patient's home carries no delivery fee. For a unit bought outright where it already stands in the patient's home on a coverage-billed device record, which this policy governs, and only for such a unit, the unit is sold at its list price, paid in full by the patient when the sale is booked, with no delivery fee; every other outright purchase remains at the class's self-pay retail price plus its self-pay delivery fee, paid in full when the order is placed, as the base self-pay rule states. The price of a unit bought where it already stands in the patient's home is fixed only after the device record carries a
      usage summary crediting the qualifying nights. No wear is taken off the in-home unit's price until a
      usage summary on the device record states the average daily use. The list price follows the coverage the unit was rented under: while the coverage record on the device record is active, the unit is sold at the class's charge for a rented device not returned; when that coverage record has terminated, the unit is sold at the average of that charge and the class's self-pay retail price, rounded half up to the cent; on any other record the list price is the self-pay retail price. The sale ends the coverage rental: the self-pay sale line is the patient's record of owning the unit, the device record keeps its status and coverage as they stand, and a rental month is billed only while the device record is trial_active or rental_active and carries no self-pay sale of the unit. Wear is taken off the list price by the use the usage summary documents: when the summary states an average daily use of 4.5 hours or more, the list price is reduced in proportion to the therapy hours, the summary's average daily use times the days from the setup date to today, over a rated life of 20000 hours; when it states 2.0 hours or more but under 4.5 hours, the list price is reduced in proportion to the qualifying nights the summary credits times 4 hours, over the same 20000 hours; when it states under 2.0 hours, or no usage summary is on the device record, no wear is taken. The
      worn price is rounded half up to the cent. A failed coverage trial is discounted: when more days have passed since setup than the class's trial period and the usage summary credits fewer than 40 qualifying nights, the discount is 15 percent; when the trial period has passed and the summary credits 40 or more but fewer than 50 qualifying nights, it is 8 percent; when the trial period has passed and the summary credits 50 or more but fewer than 63 qualifying nights, it is 4 percent; otherwise there is no trial discount. A unit is discounted by the repair jobs on its device record, counting every repair job on that record including jobs on a unit since swapped out: 10 percent for two or more repair jobs, 5 percent for exactly one, and nothing for none. The trial discount and the repair discount are first added into one total
      percentage, which reduces the worn price once, rounded half up to the cent; the two discounts do not
      act one after the other. The heated humidifier furnished with the unit is sold with it: a unit
      furnished with a humidifier to a patient whose active PAP supply enrollment shows the humidifier in
      use adds 79.00 USD, a unit furnished with a humidifier the enrollment does not show in use adds 39.50
      USD, and a unit without a humidifier adds nothing. The sale amount is the discounted price plus the
      humidifier amount, rounded half up to the cent.
    baseline:
      rule: >-
        A unit bought outright is sold at the class's self-pay retail price, paid in full by the patient
        when the sale is booked; a unit already standing in the patient's home carries no delivery fee.
      params: [self_pay_retail_price]
    prerequisite:
      - problem: pap_ext_usage_nights
        kind: value_input
        gate: failed_pct
        form: state
        policy_source: >-
          The price of a unit bought where it already stands in the patient's home is fixed only after the
          device record carries a usage summary crediting the qualifying nights.
        condition: >-
          a pap_compliance_download record with compliance_result none (a usage summary) stands on the device
          record and carries the qualifying nights credited in nights_4h_plus
        resolved_by: record_usage_download_48c54aed
        effect: >-
          the trial discount is set from the qualifying nights the summary credits (8 percent for 40 to 49 nights, 4 percent for 50 to 62, once the trial period has passed) instead of none
      - problem: pap_ext_usage_hours
        kind: value_input
        gate: worn_price
        form: state
        policy_source: >-
          No wear is taken off the in-home unit's price until a usage summary on the device record states the
          average daily use.
        condition: >-
          a pap_compliance_download record with compliance_result none (a usage summary) stands on the device
          record and carries the average daily use in avg_daily_use_hours
        resolved_by: record_usage_download_48c54aed
        effect: >-
          the worn price moves from the unworn list price to the wear the summary's average daily use selects
          (therapy-hours wear at 4.5 hours or more)
    cross_category:
      - category: coverage
        as: branch
        reads: [status]
        note: the list price reads whether the coverage record the unit is rented under is active or terminated
      - category: resupply
        as: branch
        reads: [humidifier_in_use, status]
        note: the humidifier amount reads whether the active supply enrollment shows the humidifier in use
    compute:
      - cov_status: "CFIELD('coverage', 'status', coverage_id=F('coverage_id'))"
      - list_price: "P('unreturned_equipment_charge') if cov_status == 'active' else (RND((P('unreturned_equipment_charge') + P('self_pay_retail_price')) / 2, 2) if cov_status == 'terminated' else P('self_pay_retail_price'))"
      - days_in_home: "DAYS(F('setup_date'), NOW)"
      - summary_count: "COUNT('pap_service', event_type='pap_compliance_download', compliance_result='none')"
      - summary_hours: "LATEST('pap_service', 'avg_daily_use_hours', date_field='service_date', event_type='pap_compliance_download', compliance_result='none') if summary_count >= 1 else 0"
      - summary_credit_nights: "LATEST('pap_service', 'nights_4h_plus', date_field='service_date', event_type='pap_compliance_download', compliance_result='none') if summary_count >= 1 else 0"
      - worn_price: "RND(list_price * (1 - summary_hours * days_in_home / K('rated_hours')), 2) if summary_hours >= K('regular_use_hours') else (RND(list_price * (1 - summary_credit_nights * K('night_hours') / K('rated_hours')), 2) if summary_hours >= K('light_use_hours') else list_price)"
      - summaries_on_file: "COUNT('pap_service', event_type='pap_compliance_download', compliance_result='none')"
      - summary_nights: "LATEST('pap_service', 'nights_4h_plus', date_field='service_date', event_type='pap_compliance_download', compliance_result='none')"
      - trial_days_elapsed: "DAYS(F('setup_date'), NOW)"
      - failed_pct: "K('failed_far_pct') if (summaries_on_file >= 1 and trial_days_elapsed > P('trial_period_days') and summary_nights < K('short_floor')) else (K('failed_near_pct') if (summaries_on_file >= 1 and trial_days_elapsed > P('trial_period_days') and summary_nights >= K('short_floor') and summary_nights < K('mid_floor')) else (K('failed_edge_pct') if (summaries_on_file >= 1 and trial_days_elapsed > P('trial_period_days') and summary_nights >= K('mid_floor') and summary_nights < K('qualifying_floor')) else 0))"
      - repair_jobs: "COUNT('pap_service', event_type='pap_repair')"
      - repair_pct: "K('repair_two_pct') if repair_jobs >= 2 else (K('repair_one_pct') if repair_jobs == 1 else 0)"
      - discounted: "RND(worn_price * (1 - (failed_pct + repair_pct) / 100), 2)"
      - supply_humid: "CFIELD('resupply', 'humidifier_in_use', status='active')"
      - humid_value: "K('humid_full_value') if (F('humidifier_included') == True and supply_humid == True) else (K('humid_half_value') if F('humidifier_included') == True else 0)"
      - result: "RND(discounted + humid_value, 2)"
    compute_basis:
      cov_status: "The list price follows the coverage the unit was rented under"
      list_price: "while the coverage record on the device record is active, the unit is sold at the class's charge for a rented device not returned; when that coverage record has terminated, the unit is sold at the average of that charge and the class's self-pay retail price, rounded half up to the cent; on any other record the list price is the self-pay retail price."
      days_in_home: "the days from the setup date to today"
      summary_count: "Wear is taken off the list price by the use the usage summary documents"
      summary_hours: "when the summary states an average daily use of 4.5 hours or more"
      summary_credit_nights: "the qualifying nights the summary credits times 4 hours"
      worn_price: "when the summary states an average daily use of 4.5 hours or more, the list price is reduced in proportion to the therapy hours, the summary's average daily use times the days from the setup date to today, over a rated life of 20000 hours; when it states 2.0 hours or more but under 4.5 hours, the list price is reduced in proportion to the qualifying nights the summary credits times 4 hours, over the same 20000 hours; when it states under 2.0 hours, or no usage summary is on the device record, no wear is taken. The worn price is rounded half up to the cent."
      summaries_on_file: "the usage summary credits fewer than 40 qualifying nights"
      summary_nights: "the summary credits 50 or more but fewer than 63 qualifying nights"
      trial_days_elapsed: "more days have passed since setup than the class's trial period"
      failed_pct: "when more days have passed since setup than the class's trial period and the usage summary credits fewer than 40 qualifying nights, the discount is 15 percent; when the trial period has passed and the summary credits 40 or more but fewer than 50 qualifying nights, it is 8 percent; when the trial period has passed and the summary credits 50 or more but fewer than 63 qualifying nights, it is 4 percent; otherwise there is no trial discount."
      repair_jobs: "counting every repair job on that record including jobs on a unit since swapped out"
      repair_pct: "10 percent for two or more repair jobs, 5 percent for exactly one, and nothing for none."
      discounted: "The trial discount and the repair discount are first added into one total percentage, which reduces the worn price once, rounded half up to the cent; the two discounts do not act one after the other."
      supply_humid: "a patient whose active PAP supply enrollment shows the humidifier in use"
      humid_value: "a unit furnished with a humidifier to a patient whose active PAP supply enrollment shows the humidifier in use adds 79.00 USD, a unit furnished with a humidifier the enrollment does not show in use adds 39.50 USD, and a unit without a humidifier adds nothing."
      result: "The sale amount is the discounted price plus the humidifier amount, rounded half up to the cent."
    factors:
      - id: list_price_basis
        effect: parameter
        decides: list_price
        bindings: [cov_status, list_price]
        ladder:
          - when: "the coverage record the unit is rented under is active"
            value: "the class's charge for a rented device not returned"
          - when: "that coverage record has terminated"
            value: "the average of the class's charge for a rented device not returned and its self-pay retail price"
          - when: "otherwise"
            value: "the class's self-pay retail price"
        baseline:
          list_price: "P('self_pay_retail_price')"
        evidence: [cross_category]
        cross_difficulty: coverage
      - id: hours_wear_basis
        effect: method
        decides: worn_price
        bindings: [days_in_home, summary_count, summary_hours, summary_credit_nights, worn_price]
        ladder:
          - when: "the usage summary states an average daily use of 4.5 hours or more"
            method: "list price reduced in proportion to therapy hours (average daily use times days since setup) over 20000 rated hours"
          - when: "the usage summary states 2.0 hours or more but under 4.5 hours"
            method: "list price reduced in proportion to the credited qualifying nights times 4 hours over 20000 rated hours"
          - when: "otherwise (under 2.0 hours)"
            method: "no wear taken"
        baseline:
          worn_price: "list_price"
        evidence: [history, date]
        cross_difficulty: null
      - id: failed_trial_discount
        effect: parameter
        decides: failed_pct
        bindings: [summaries_on_file, summary_nights, trial_days_elapsed, failed_pct]
        ladder:
          - when: "the class's trial period has passed and the usage summary credits fewer than 40 qualifying nights"
            value: "15 percent"
          - when: "the trial period has passed and the summary credits 40 or more but fewer than 50 qualifying nights"
            value: "8 percent"
          - when: "the trial period has passed and the summary credits 50 or more but fewer than 63 qualifying nights"
            value: "4 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          failed_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: repair_history_discount
        effect: parameter
        decides: repair_pct
        bindings: [repair_jobs, repair_pct]
        ladder:
          - when: "two or more repair jobs are on the device record (including jobs on a unit since swapped out)"
            value: "10 percent"
          - when: "exactly one repair job is on the device record"
            value: "5 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          repair_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: humidifier_bundle_value
        effect: parameter
        decides: humid_value
        bindings: [supply_humid, humid_value]
        ladder:
          - when: "the unit was furnished with a humidifier and the active supply enrollment shows it in use"
            value: "79.00 USD"
          - when: "the unit was furnished with a humidifier the enrollment does not show in use"
            value: "39.50 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          humid_value: "0"
        evidence: [cross_category]
        cross_difficulty: resupply
    inputs:
      history:
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_compliance_download, compliance_result: none}}
        - {table: pap_service, aggregate: latest, field: avg_daily_use_hours, filters: {event_type: pap_compliance_download, compliance_result: none}}
        - {table: pap_service, aggregate: latest, field: nights_4h_plus, filters: {event_type: pap_compliance_download, compliance_result: none}}
        - {table: pap_service, aggregate: count, field: pap_service_id, filters: {event_type: pap_repair}}
      cross_category: [coverage, resupply]
