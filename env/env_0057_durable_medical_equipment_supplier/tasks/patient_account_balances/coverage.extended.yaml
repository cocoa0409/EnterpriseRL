extended_policies:
- id: coverage_ext_hardship_discount
  base_policy_refs:
  - coverage_qmb_protection
  - coverage_hardship
  - coverage_evt_adjustments
  - coverage_retro_medicaid
  - coverage_payer_program_rules
  overwrite:
  - base_policy: coverage_hardship
    superseded_clause: equal to the tier's discount_pct of the charge's open amount, rounded to the cent half up
    replaced_by: >-
      The medical-burden, ongoing-rental, coverage-tenure, payment-effort, statement-age and charge-type points
      are added together to the tier's discount percentage to give one assistance percentage, which never exceeds
      `max_pct`; for every hardship discount, and only for hardship discounts, that percentage is applied once to
      the charge's amount as posted, and the points are never applied as separate discounts one after another.
  - base_policy: coverage_qmb_protection
    superseded_clause: >-
      The QMB protection applies only while the Medicaid record is active: the Medicaid record carrying qmb_status
      qmb is in status active.
    replaced_by: >-
      For a hardship discount, and only for a hardship discount, no Medicaid record has to be active, because the
      discount rests on the hardship approval alone; QMB protection itself, and every adjustment other than a hardship
      or a prompt-pay discount, remains under the base rule, so QMB protection applies only while the Medicaid record
      carrying qmb_status qmb is in status active.
  - base_policy: coverage_evt_adjustments
    superseded_clause: >-
      Adjustments on one charge never stack beyond its open amount: when a hardship discount and a prompt-pay discount
      could both apply to the same charge, only the larger one is posted, and QMB protection displaces both.
    replaced_by: >-
      For a hardship discount, and only for a hardship discount, the adjustment is posted for its full figure even
      where a payment has already been applied to the charge, the part above the charge's open amount staying on
      the account as a credit toward its other open charges; every adjustment other than a hardship or a prompt-pay
      discount remains under the base rule and never stacks beyond its charge's open amount, and when a hardship
      and a prompt-pay discount could both apply to one charge only the larger is posted, with QMB protection displacing
      both.
  trigger: state_due
  subject:
  - coverage_adjustment
  computes: amount
  target_tool: apply_hardship_discount_c60f16b6
  params:
    tier_pct_full_100: 100
    tier_pct_partial_75: 75
    tier_pct_partial_50: 50
    tier_pct_partial_25: 25
    trailing_window_months: 12
    rental_pts_two: 8
    rental_pts_one: 5
    tenure_long_months: 60
    tenure_mid_months: 24
    tenure_pts_long: 3
    tenure_pts_mid: 1
    effort_high_count: 4
    effort_low_count: 1
    effort_pts_high: 3
    effort_pts_low: 1
    statement_window_months: 6
    aged_high_count: 5
    aged_mid_count: 3
    aged_pts_high: 3
    aged_pts_mid: 1
    max_pct: 100
    burden_step: 300.0
    charge_pts_repair: 4
    charge_pts_deductible: 2
  rule: >-
    Summit Ridge grants a financial-assistance discount on each patient charge of responsibility_type deductible,
    coinsurance, copay or repair_patient_share on the coverage account that the account's hardship approval covers:
    a charge posted while the approval is in force, and a charge already open on the approval date that was posted
    no more than `hardship_lookback_days` calendar days before it; each such charge receives one adjustment with
    adjustment_reason hardship_discount, posted against that charge. A charge posted while the approval is in force
    receives its discount when it posts, a charge open on the approval date receives it on that date, and a discount
    missed at that moment is posted when the omission is found; missed discounts are worked one charge at a time,
    starting from the account's most recently posted patient charge. The discount figured is the one for the account's
    most recently posted patient charge; it is 0.00, and nothing is posted, when that charge is of a type the discount
    never reaches or was posted more than `hardship_lookback_days` calendar days before the approval date. An approval
    is in force while fewer than `hardship_approval_valid_months` whole calendar months have passed between hardship_approved_date
    and the handling date; an account whose hardship_tier is none, or whose approval is no longer in force, receives
    no hardship discount. The hardship discount on a charge is the account's assistance percentage of the charge's
    amount as posted, rounded to the cent half up. The assistance percentage is the discount percentage of the approved
    hardship tier: `tier_pct_full_100` for full_100, `tier_pct_partial_75` for partial_75, `tier_pct_partial_50`
    for partial_50 and `tier_pct_partial_25` for partial_25. Medical-burden points are added to the assistance percentage
    by a measure that depends on the patient's equipment: for a patient whose wheelchair record is rental_active,
    one point for each full `burden_step` of patient charges on this coverage account whose whole calendar months
    before the handling date do not exceed those of that wheelchair's rental_period_start_date; for a patient with
    no rental_active wheelchair whose coverage class counts its benefit year as a plan_year, one point for each
    full `burden_step` of patient charges on this coverage account whose whole calendar months before the handling
    date do not exceed those of the record's benefit_year_start; for any other patient, no medical-burden points.
    Ongoing-rental points are added for the monthly equipment rentals the patient holds with Summit Ridge, counting
    a wheelchair record, an oxygen record and a PAP device record that is rental_active: two or more such rentals
    add `rental_pts_two` points, exactly one adds `rental_pts_one` points, and none adds no ongoing-rental points.
    Coverage-tenure points are added according to the whole calendar months between this coverage record's effective_date
    and the handling date: at least `tenure_long_months` months add `tenure_pts_long` points, at least `tenure_mid_months`
    but fewer than `tenure_long_months` months add `tenure_pts_mid` points, and fewer than `tenure_mid_months` months
    add none. Payment-effort points are added according to the patient-payment entries posted on the account fewer
    than `trailing_window_months` whole calendar months before the handling date: at least `effort_high_count` entries
    add `effort_pts_high` points, at least `effort_low_count` but fewer than `effort_high_count` entries add `effort_pts_low`
    points, and no entry adds none. Statement-age points are added according to the statements issued on the account
    fewer than `statement_window_months` whole calendar months before the handling date: at least `aged_high_count`
    statements add `aged_pts_high` points, at least `aged_mid_count` but fewer than `aged_high_count` statements
    add `aged_pts_mid` points, and fewer than `aged_mid_count` statements add none. Charge-type points are added
    according to the responsibility_type of the charge being discounted: a repair_patient_share charge, an unplanned
    repair of equipment the patient owns, adds `charge_pts_repair` points; a deductible charge adds `charge_pts_deductible`
    points; a coinsurance or copay charge adds none. The medical-burden, ongoing-rental, coverage-tenure, payment-effort,
    statement-age and charge-type points are added together to the tier's discount percentage to give one assistance
    percentage, which never exceeds `max_pct`; for every hardship discount, and only for hardship discounts, that
    percentage is applied once to the charge's amount as posted, and the points are never applied as separate discounts
    one after another. Self-pay, upgrade_difference, non_covered_with_notice and unreturned_equipment charges never
    receive a hardship discount, and when QMB protection applies to a charge no hardship discount is posted on it.
    For a hardship discount, and only for a hardship discount, the adjustment is posted for its full figure even
    where a payment has already been applied to the charge, the part above the charge's open amount staying on the
    account as a credit toward its other open charges; every adjustment other than a hardship or a prompt-pay discount
    remains under the base rule and never stacks beyond its charge's open amount, and when a hardship and a prompt-pay
    discount could both apply to one charge only the larger is posted, with QMB protection displacing both. For
    a hardship discount, and only for a hardship discount, no Medicaid record has to be active, because the discount
    rests on the hardship approval alone; QMB protection itself, and every adjustment other than a hardship or a
    prompt-pay discount, remains under the base rule, so QMB protection applies only while the Medicaid record carrying
    qmb_status qmb is in status active.
  prerequisite: []
  cross_category:
  - category: mobility
    as: branch
    reads:
    - status
    - rental_period_start_date
    note: >-
      Decides the medical-burden window (rental period start of an active wheelchair rental) and counts toward the
      ongoing-rental points.
  - category: oxygen
    as: existence
    reads:
    - status
    note: An active oxygen rental counts toward the ongoing-rental points.
  - category: pap
    as: existence
    reads:
    - status
    note: An active PAP rental counts toward the ongoing-rental points.
  compute:
  - h_charge_amount: >-
      LATEST('coverage_ledger', 'amount', date_field='posting_date', event_type='coverage_patient_charge')
  - h_charge_date: >-
      LATEST('coverage_ledger', 'posting_date', date_field='posting_date', event_type='coverage_patient_charge')
  - h_covered_type: >-
      LATEST('coverage_ledger', 'responsibility_type', date_field='posting_date', event_type='coverage_patient_charge')
  - h_charge_covered: >-
      0 if F('hardship_tier') == 'none' else (1 if ((h_covered_type == 'deductible' or h_covered_type == 'coinsurance'
      or h_covered_type == 'copay' or h_covered_type == 'repair_patient_share') and DAYS(h_charge_date, F('hardship_approved_date'))
      <= P('hardship_lookback_days')) else 0)
  - h_tier_pct: >-
      0 if F('hardship_tier') == 'none' else (0 if MONTHS(F('hardship_approved_date'), NOW) >= P('hardship_approval_valid_months')
      else (K('tier_pct_full_100') if F('hardship_tier') == 'full_100' else (K('tier_pct_partial_75') if F('hardship_tier')
      == 'partial_75' else (K('tier_pct_partial_50') if F('hardship_tier') == 'partial_50' else K('tier_pct_partial_25')))))
  - h_wheelchair_start: CFIELD('mobility', 'rental_period_start_date', status='rental_active')
  - h_burden_pts: >-
      int(SUM('coverage_ledger', 'amount', within_months=MONTHS(h_wheelchair_start, NOW) + 1, date_field='posting_date',
      event_type='coverage_patient_charge') / K('burden_step')) if h_wheelchair_start else (int(SUM('coverage_ledger',
      'amount', within_months=MONTHS(F('benefit_year_start'), NOW) + 1, date_field='posting_date', event_type='coverage_patient_charge')
      / K('burden_step')) if P('benefit_year_basis') == 'plan_year' else 0)
  - h_active_rentals: >-
      (1 if EXISTS('mobility', status='rental_active') else 0) + (1 if EXISTS('oxygen', status='rental_active')
      else 0) + (1 if EXISTS('pap', status='rental_active') else 0)
  - h_rental_pts: >-
      K('rental_pts_two') if h_active_rentals >= 2 else (K('rental_pts_one') if h_active_rentals == 1 else 0)
  - h_coverage_months: MONTHS(F('effective_date'), NOW)
  - h_tenure_pts: >-
      K('tenure_pts_long') if h_coverage_months >= K('tenure_long_months') else (K('tenure_pts_mid') if h_coverage_months
      >= K('tenure_mid_months') else 0)
  - h_payment_entries: >-
      COUNT('coverage_ledger', within_months=K('trailing_window_months'), date_field='posting_date', event_type='coverage_payment')
  - h_effort_pts: >-
      K('effort_pts_high') if h_payment_entries >= K('effort_high_count') else (K('effort_pts_low') if h_payment_entries
      >= K('effort_low_count') else 0)
  - h_recent_statements: >-
      COUNT('coverage_ledger', within_months=K('statement_window_months'), date_field='posting_date', event_type='coverage_statement')
  - h_aged_pts: >-
      K('aged_pts_high') if h_recent_statements >= K('aged_high_count') else (K('aged_pts_mid') if h_recent_statements
      >= K('aged_mid_count') else 0)
  - h_kind: >-
      LATEST('coverage_ledger', 'responsibility_type', date_field='posting_date', event_type='coverage_patient_charge')
  - h_type_pts: >-
      K('charge_pts_repair') if h_kind == 'repair_patient_share' else (K('charge_pts_deductible') if h_kind == 'deductible'
      else 0)
  - h_assist_pct: >-
      0 if h_tier_pct == 0 else MN(K('max_pct'), h_tier_pct + h_burden_pts + h_rental_pts + h_tenure_pts + h_effort_pts
      + h_aged_pts + h_type_pts)
  - result: 0 if h_charge_covered == 0 else RND(h_charge_amount * h_assist_pct / 100 + 0.000001, 2)
