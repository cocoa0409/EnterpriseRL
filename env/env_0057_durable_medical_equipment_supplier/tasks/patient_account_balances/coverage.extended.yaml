      event_type='mobility_rental_paid') > 0 else 0) + (1 if XCOUNT('oxygen', 'oxygen_billing', within_months=K('rental_window_months'),
      date_field='service_from_date', event_type='oxygen_rental_paid') > 0 else 0) + (1 if XCOUNT('pap', 'pap_billing',
      within_months=K('rental_window_months'), date_field='service_from_date', event_type='pap_rental_paid') > 0
