      approval is in force, the core term is the months still left in that approval, `hardship_approval_valid_months`
      less the whole calendar months between hardship_approved_date and the handling date; for an account with no
      approval in force whose patient holds a rental_active wheelchair, the core term is the rental months still
      left to ownership, the class's `capped_rental_months` less the wheelchair rental months the patient's records
      show paid in the wheelchair's current rental period (months whose service began no more whole calendar months
      before the handling date than its rental_period_start_date), net of any such month later reversed; for any
      other account the core term is the class's `payment_plan_max_months`.
    r_size_balance: >-
      Balance-size months are added according to the account's patient_balance together with the statement_cycle
      printed on its latest statement: a balance of at least `size_large_balance` on a cycle of at least `size_cycle`
      adds `size_months_large` months; a balance of at least `size_mid_balance` but below `size_large_balance` on
      a cycle of at least `size_cycle` adds `size_months_mid` months; any other account adds none.
  factors:
  - id: installment_core_term_basis
    effect: method
    decides: r_core_term
    bindings:
    - r_hardship_months
    - r_wheelchair_status
    - r_wheelchair_start
    - r_wheelchair_paid_months
    - r_core_term
    ladder:
    - when: the account's hardship approval is in force
      method: >-
        core term = `hardship_approval_valid_months` less the whole months since hardship_approved_date (the months
        left in the approval)
    - when: no approval in force, and the patient holds a rental_active wheelchair
      method: >-
        core term = the class's `capped_rental_months` less the wheelchair months paid in the current rental period,
        net of reversed months (the months left to ownership)
    - when: otherwise
      method: core term = the class's `payment_plan_max_months`
    baseline:
      r_core_term: P('payment_plan_max_months')
    evidence:
    - date
    - cross_category
    cross_difficulty: mobility
  - id: installment_proven_arrangement_months
    effect: parameter
    decides: r_proven_months
    bindings:
    - r_completed_start_months
    - r_proven_months
    ladder:
    - when: >-
        payment_plan_status shows a completed arrangement whose payment_plan_start_date falls no more than `proven_window_months`
        months before the handling date
      value: K('proven_months_recent')
    - when: >-
        payment_plan_status shows a completed arrangement that started more than `proven_window_months` months before
        the handling date
      value: K('proven_months_older')
    - when: otherwise
      value: '0'
    baseline:
      r_proven_months: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: installment_rental_load_months
    effect: parameter
    decides: r_rental_months
    bindings:
    - r_ongoing_rentals
    - r_rental_months
    ladder:
    - when: >-
        two or more wheelchair, oxygen or PAP device lines with a paid rental month that began fewer than `rental_window_months`
        months before the handling date
      value: K('rental_months_two')
    - when: exactly one such line
      value: K('rental_months_one')
    - when: otherwise
      value: '0'
    baseline:
      r_rental_months: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: mobility
  - id: installment_coverage_loyalty_months
    effect: parameter
    decides: r_loyal_months
    bindings:
    - r_coverage_months
    - r_loyal_months
    ladder:
    - when: at least `loyal_long_months` whole months since the coverage record's effective_date
      value: K('loyal_months_long')
    - when: at least `loyal_mid_months` but fewer than `loyal_long_months` months
      value: K('loyal_months_mid')
    - when: otherwise
      value: '0'
    baseline:
      r_loyal_months: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: installment_balance_size_months
    effect: parameter
    decides: r_size_months
    bindings:
    - r_size_balance
    - r_latest_cycle
    - r_size_months
    ladder:
    - when: >-
        patient_balance at least `size_large_balance` and the latest statement_cycle at least `size_cycle`
      value: K('size_months_large')
    - when: >-
        patient_balance at least `size_mid_balance` but below `size_large_balance`, and the latest statement_cycle
        at least `size_cycle`
      value: K('size_months_mid')
    - when: otherwise
      value: '0'
    baseline:
      r_size_months: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: installment_payment_regularity_months
    effect: parameter
    decides: r_regular_months
    bindings:
    - r_payment_entries
    - r_regular_months
    ladder:
    - when: >-
        at least `regular_high_count` patient-payment entries posted fewer than `regular_window_months` months before
        the handling date
      value: K('regular_months_high')
    - when: at least `regular_mid_count` but fewer than `regular_high_count` such entries
      value: K('regular_months_mid')
    - when: otherwise
      value: '0'
    baseline:
      r_regular_months: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The monthly installment of a new arrangement is the account's patient_balance divided by the arrangement term
      in months, rounded to the cent half up, and never less than `payment_plan_min_monthly`; the patient may choose
      a larger installment but never a smaller one. The arrangement term is the class's `payment_plan_max_months`.
    params:
    - payment_plan_max_months
    - payment_plan_min_monthly
  inputs:
    history:
    - table: coverage_ledger
      aggregate: latest
      field: statement_cycle
      filters:
        event_type: coverage_statement
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 12
      filters:
        event_type: coverage_payment
    - category: mobility
      table: mobility_billing
      aggregate: count
      field: mobility_bill_id
      filters:
        event_type: mobility_rental_paid
    - category: oxygen
      table: oxygen_billing
      aggregate: count
      field: oxygen_bill_id
      within_months: 2
      filters:
        event_type: oxygen_rental_paid
    - category: pap
      table: pap_billing
      aggregate: count
      field: pap_bill_id
      within_months: 2
      filters:
        event_type: pap_rental_paid
    cross_category:
    - mobility
    - oxygen
    - pap
- id: coverage_ext_medicaid_crossover
  base_policy_refs:
  - coverage_agg_coordination
  - coverage_agg_payment_allocation
  overwrite:
  - base_policy: coverage_agg_coordination
    superseded_clause: >-
      and on the coinsurance charge the percentage `as_secondary_coinsurance_cover_pct` of that charge, rounded
      to the cent half up;
    replaced_by: >-
      For a Medicaid secondary's crossover on a coinsurance charge from an oxygen line, and only for such a crossover,
      the payment on the coinsurance charge is figured as this rule sets out; every other secondary payment on a
      coinsurance charge remains under the base rule, paying `as_secondary_coinsurance_cover_pct` percent of that
      charge, rounded to the cent half up.
  - base_policy: coverage_agg_coordination
    superseded_clause: >-
      A secondary payment is posted on the primary account against the charge it settles, carrying the secondary
      record as payer_coverage_id, and never exceeds the open amount of that charge.
    replaced_by: >-
      For a crossover this rule prices, and only for such a crossover, the payment is posted on the primary account
      against the coinsurance charge it settles, carrying the Medicaid record as payer_coverage_id, and never exceeds
      the line's cost share, any part above the charge's open amount staying on the account as a credit; every other
      secondary payment remains under the base rule and never exceeds the open amount of the charge it settles.
  trigger: state_due
  subject:
  - coverage_secondary_payment
  computes: amount
  target_tool: post_crossover_payment_b661a2ed
  params:
    rate_pct_gas: 100
    rate_pct_liquid_poc: 92
    usage_pct_combined: 90
    usage_pct_single: 75
    copay_band_low_max: 10.0
    copay_band_mid_max: 45.0
    copay_band_upper_max: 75.0
    copay_band_low: 0.65
    copay_band_mid: 1.3
    copay_band_upper: 1.9
    phase_second_start: 13
    phase_third_start: 25
    phase_pct_second: 96
    phase_pct_third: 90
  rule: >-
    When a Medicaid Fee-for-Service record sits behind a primary coverage as the payer of last resort, every coinsurance
    charge the primary leaves on an oxygen claim line whose date of service falls on or after the Medicaid record's
    effective_date receives the Medicaid crossover payment as one secondary-payment entry on the primary account,
    naming the charge it settles and carrying the Medicaid record as payer_coverage_id; the crossover follows automatically
    when the primary's `secondary_crossover_automatic` is true. A deductible charge in that scope is paid by Medicaid
    under the coordination rule's deductible clause and is not priced here. Crossover remittances are posted one
    line at a time, starting from the newest oxygen line the primary adjudicated; the crossover figured is worked
    from that line, using its patient responsibility (the cost share), its rental month number and the amount the
    primary paid, and it settles the coinsurance charge that stems from that line. The Medicaid crossover payment
    is the crossover price of the line less the Medicaid copayment, never below zero, never more than the line's
    cost share, and rounded to the cent half up. The crossover price of the line is the lesser of the line's cost
    share and the Medicaid monthly rate less what the primary paid, never below zero; the Medicaid monthly rate
    is the oxygen class's `stationary_monthly_fee` plus its `portable_addon_monthly_fee`, times the Medicaid record's
    `allowed_pct_of_fee_schedule` percent, rounded to the cent half up, and the Medicaid copayment is the class's
    `medicaid_copay_per_line`. A flow multiplier applies to the stationary fee in the Medicaid monthly rate according
    to the prescribed flow on the oxygen record: a prescribed_lpm above the system class's `high_flow_threshold_lpm`
    raises it by the class's `high_flow_uplift_pct`; a prescribed_lpm below the class's `low_flow_threshold_lpm`
    lowers it by the class's `low_flow_reduction_pct`; any other flow leaves it as it is. The portable add-on in
    the Medicaid monthly rate is reckoned by the patient's flow and use: for a prescribed_lpm above the class's
    `high_flow_threshold_lpm` on a class furnishing portable equipment to a patient whose usage_pattern is not sleep_only,
    the add-on is only the part by which the stationary fee plus the portable add-on exceeds the stationary fee
    raised by `high_flow_uplift_pct`, never below zero, so that the higher of the two amounts applies; when the
    usage_pattern is sleep_only, no portable add-on enters the rate; in any other case the full `portable_addon_monthly_fee`
    enters it. The usage share of the Medicaid monthly rate follows the usage_pattern on the oxygen record: exertion_and_sleep
    takes `usage_pct_combined` percent of the rate, sleep_only or exertion_only takes `usage_pct_single` percent,
    and continuous use takes the whole rate. The rate share of the Medicaid monthly rate follows the oxygen system
    class: a class furnishing portable cylinders or a home fill system takes `rate_pct_gas` percent, a liquid oxygen
    system or a portable oxygen concentrator takes `rate_pct_liquid_poc` percent, and a stationary concentrator
    alone takes the Medicaid record's `allowed_pct_of_fee_schedule` percent. The rental-phase share of the Medicaid
    monthly rate follows the rental month number of the line: months from `phase_third_start` on take `phase_pct_third`
    percent, months from `phase_second_start` up to `phase_third_start` take `phase_pct_second` percent, and earlier
    months take the whole rate. With these rules applied, the Medicaid monthly rate is the stationary fee after
    the flow multiplier plus the portable add-on as reckoned, times the usage share, the rate share and the rental-phase
    share together, rounded once to the cent half up. The Medicaid copayment withheld from the crossover follows
    the Medicare cost share on the line that Medicaid is asked to pay: a qmb record owes no copayment; for any other
    record, a cost share of no more than `copay_band_low_max` withholds `copay_band_low`, a cost share above `copay_band_low_max`
    but no more than `copay_band_mid_max` withholds `copay_band_mid`, a cost share above `copay_band_mid_max` but
    no more than `copay_band_upper_max` withholds `copay_band_upper`, and a larger cost share withholds the class's
    `medicaid_copay_per_line`. For a Medicaid secondary's crossover on a coinsurance charge from an oxygen line,
    and only for such a crossover, the payment on the coinsurance charge is figured as this rule sets out; every
    other secondary payment on a coinsurance charge remains under the base rule, paying `as_secondary_coinsurance_cover_pct`
    percent of that charge, rounded to the cent half up. For a crossover this rule prices, and only for such a crossover,
    the payment is posted on the primary account against the coinsurance charge it settles, carrying the Medicaid
    record as payer_coverage_id, and never exceeds the line's cost share, any part above the charge's open amount
    staying on the account as a credit; every other secondary payment remains under the base rule and never exceeds
    the open amount of the charge it settles. Medicaid pays nothing under this rule on copay, non_covered_with_notice,
    upgrade_difference, self_pay, repair_patient_share or unreturned_equipment charges.
  prerequisite: []
  cross_category:
  - category: oxygen
    as: history
    reads:
    - status
    - variant_name
    - prescribed_lpm
    - usage_pattern
    - stationary_monthly_fee
    - portable_addon_monthly_fee
    - high_flow_threshold_lpm
    - high_flow_uplift_pct
    - low_flow_threshold_lpm
    - low_flow_reduction_pct
    - oxygen_billing.patient_responsibility
    - oxygen_billing.payer_paid_amount
    - oxygen_billing.allowed_amount
    - oxygen_billing.service_from_date
    - oxygen_billing.event_type
    note: >-
      The newest primary-adjudicated oxygen line, the oxygen record's flow, usage and class, and the class's fees
      decide every factor of the crossover price.
  compute:
  - s_cost_share: >-
      XLATEST('oxygen', 'oxygen_billing', 'patient_responsibility', date_field='adjudication_date')
  - s_primary_paid: XLATEST('oxygen', 'oxygen_billing', 'payer_paid_amount', date_field='adjudication_date')
  - s_stationary: CPARAM('oxygen', 'stationary_monthly_fee', status='rental_active')
  - s_lpm: CFIELD('oxygen', 'prescribed_lpm', status='rental_active')
  - s_flow_mult: >-
      (1 + CPARAM('oxygen', 'high_flow_uplift_pct', status='rental_active') / 100) if s_lpm > CPARAM('oxygen', 'high_flow_threshold_lpm',
      status='rental_active') else ((1 - CPARAM('oxygen', 'low_flow_reduction_pct', status='rental_active') / 100)
      if s_lpm < CPARAM('oxygen', 'low_flow_threshold_lpm', status='rental_active') else 1)
  - s_addon_lpm: CFIELD('oxygen', 'prescribed_lpm', status='rental_active')
  - s_addon_use: CFIELD('oxygen', 'usage_pattern', status='rental_active')
  - s_addon_portable: CPARAM('oxygen', 'portable_addon_monthly_fee', status='rental_active')
  - s_addon: >-
      MX(0, CPARAM('oxygen', 'stationary_monthly_fee', status='rental_active') + s_addon_portable - CPARAM('oxygen',
      'stationary_monthly_fee', status='rental_active') * (1 + CPARAM('oxygen', 'high_flow_uplift_pct', status='rental_active')
      / 100)) if (s_addon_lpm > CPARAM('oxygen', 'high_flow_threshold_lpm', status='rental_active') and s_addon_portable
      > 0 and s_addon_use != 'sleep_only') else (0 if s_addon_use == 'sleep_only' else s_addon_portable)
  - s_usage: CFIELD('oxygen', 'usage_pattern', status='rental_active')
  - s_usage_pct: >-
      K('usage_pct_combined') if s_usage == 'exertion_and_sleep' else (K('usage_pct_single') if (s_usage == 'sleep_only'
      or s_usage == 'exertion_only') else 100)
  - s_class: CFIELD('oxygen', 'variant_name', status='rental_active')
  - s_rate_pct: >-
      K('rate_pct_gas') if ('Portable Cylinders' in s_class or 'Home Fill' in s_class) else (K('rate_pct_liquid_poc')
      if ('Liquid' in s_class or 'Portable Oxygen Concentrator' in s_class) else P('allowed_pct_of_fee_schedule'))
  - s_month: XLATEST('oxygen', 'oxygen_billing', 'rental_month_number', date_field='adjudication_date')
  - s_phase_pct: >-
      K('phase_pct_third') if s_month >= K('phase_third_start') else (K('phase_pct_second') if s_month >= K('phase_second_start')
      else 100)
  - s_copay_share: >-
      XLATEST('oxygen', 'oxygen_billing', 'patient_responsibility', date_field='adjudication_date')
  - s_copay: >-
      0 if F('qmb_status') == 'qmb' else (K('copay_band_low') if s_copay_share <= K('copay_band_low_max') else (K('copay_band_mid')
      if s_copay_share <= K('copay_band_mid_max') else (K('copay_band_upper') if s_copay_share <= K('copay_band_upper_max')
      else P('medicaid_copay_per_line'))))
  - s_medicaid_rate: >-
      RND((s_stationary * s_flow_mult + s_addon) * s_usage_pct / 100 * s_rate_pct / 100 * s_phase_pct / 100 + 0.000001,
      2)
  - s_price: MN(s_cost_share, MX(0, s_medicaid_rate - s_primary_paid))
  - result: MN(s_cost_share, MX(0, RND(s_price - s_copay + 0.000001, 2)))
  compute_basis:
    s_cost_share: >-
      Crossover remittances are posted one line at a time, starting from the newest oxygen line the primary adjudicated;
      the crossover figured is worked from that line, using its patient responsibility (the cost share), its rental
      month number and the amount the primary paid, and it settles the coinsurance charge that stems from that line.
      The Medicaid crossover payment is the crossover price of the line less the Medicaid copayment, never below
      zero, never more than the line's cost share, and rounded to the cent half up.
    s_primary_paid: >-
