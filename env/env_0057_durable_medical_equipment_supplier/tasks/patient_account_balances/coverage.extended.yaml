- id: coverage_ext_arrangement_revision
  base_policy_refs:
  - coverage_payment_plan
  overwrite:
  - base_policy: coverage_payment_plan
    superseded_clause: >-
      The installment is the larger of `payment_plan_min_monthly` and the balance divided by `payment_plan_max_months`,
      rounded to the cent half up; the patient may choose a larger installment but never a smaller one.
    replaced_by: >-
      The remaining term is the core term plus the rental-burden, new-charge, installment-record and long-coverage
      months less the secondary-relief months; for the installment of an arrangement already in force that is being
      revised, and only for such a revision, the patient_balance is divided once by that whole remaining term, and
      every other arrangement installment remains under the base rule, the larger of `payment_plan_min_monthly`
      and the balance divided by `payment_plan_max_months`, rounded to the cent half up, the patient free to choose
      a larger installment but never a smaller one, unless the rule for a new arrangement opened with a deposit
      figures it.
  trigger: on_request
  subject:
  - coverage_payment_plan_set
  computes: monthly_amount
  target_tool: revise_payment_arrangement_5f5b46f9
  params:
    kept_record_count: 3
    kept_record_months: 3
    keep_end_min_months: 3
    rental_window_months: 2
    rental_ext_two: 2
    rental_ext_one: 1
    growth_high: 300.0
    growth_mid: 100.0
    growth_months_high: 2
    growth_months_mid: 1
    record_window_months: 6
    record_high_count: 6
    record_mid_count: 3
    record_months_high: 2
    record_months_mid: 1
    tenure_long_months: 120
    tenure_mid_months: 60
    tenure_months_long: 2
    tenure_months_mid: 1
    relief_window_months: 3
    relief_high_count: 2
    relief_mid_count: 1
    relief_months_high: 2
    relief_months_mid: 1
    benefit_year_months: 12
  rule: >-
    An arrangement already in force on a coverage account is revised when the patient asks for its installment to
    be re-figured on the balance the account carries now; the revision keeps the arrangement active, keeps its due
    day, rests on the agreement the patient signed for it, and sets only the monthly installment. A revised installment
    is not fixed until the coinsurance charge stemming from the newest oxygen line the primary adjudicated, when
    that line's date of service is on or after the Medicaid record's effective date, carries the crossover payment
    that Medicaid owes on it. The revised monthly installment is the account's patient_balance divided by the remaining
    term in months, rounded to the cent half up, and never less than `payment_plan_min_monthly`. The remaining term
    is the class's `payment_plan_max_months`. The remaining term is built on a core term set by the arrangement's
    record: an arrangement runs to the class's `payment_plan_max_months` installments from its payment_plan_start_date,
    the installments fallen due being the whole calendar months from payment_plan_start_date to the handling date
    plus one; when the account shows at least `kept_record_count` patient-payment entries posted fewer than `kept_record_months`
    whole calendar months before the handling date and at least `keep_end_min_months` installments are still to
    fall due, the core term is the installments still to fall due, so the original end date is kept; when the account
    shows that many entries but fewer installments are still to fall due, the arrangement is re-anchored on the
    benefit year and the core term is the months left in the current benefit year, `benefit_year_months` less the
    whole calendar months between the record's benefit_year_start and the handling date; for any other arrangement
    the core term is the class's `payment_plan_max_months`, counted afresh. Rental-burden months are added according
    to the patient's ongoing monthly rentals, counting each of the wheelchair, oxygen and PAP device lines with
    a paid rental month whose service_from_date falls fewer than `rental_window_months` whole calendar months before
    the handling date: two or more such rentals add `rental_ext_two` months, exactly one adds `rental_ext_one` months,
    and none adds none. New-charge months are added according to the patient charges posted on the account since
    the arrangement began, a charge counting when it was posted fewer whole calendar months before the handling
    date than the installments fallen due: charges totalling at least `growth_high` add `growth_months_high` months,
    at least `growth_mid` but less than `growth_high` add `growth_months_mid` months, and less adds none. Installment-record
    months are added according to the patient-payment entries posted on the account fewer than `record_window_months`
    whole calendar months before the handling date: at least `record_high_count` entries add `record_months_high`
    months, at least `record_mid_count` but fewer than `record_high_count` add `record_months_mid` months, and fewer
    add none. Long-coverage months are added according to the whole calendar months between the coverage record's
    effective_date and the handling date: at least `tenure_long_months` add `tenure_months_long` months, at least
    `tenure_mid_months` but fewer than `tenure_long_months` add `tenure_months_mid` months, and fewer add none.
    Secondary-relief months are taken off according to the secondary-payment entries posted on the account fewer
    than `relief_window_months` whole calendar months before the handling date: at least `relief_high_count` entries
    take off `relief_months_high` months, at least `relief_mid_count` but fewer than `relief_high_count` take off
    `relief_months_mid` months, and fewer take off none. The remaining term is the core term plus the rental-burden,
    new-charge, installment-record and long-coverage months less the secondary-relief months; for the installment
    of an arrangement already in force that is being revised, and only for such a revision, the patient_balance
    is divided once by that whole remaining term, and every other arrangement installment remains under the base
    rule, the larger of `payment_plan_min_monthly` and the balance divided by `payment_plan_max_months`, rounded
    to the cent half up, the patient free to choose a larger installment but never a smaller one, unless the rule
    for a new arrangement opened with a deposit figures it.
  prerequisite:
