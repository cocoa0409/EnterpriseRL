    h_kind: >-
      Charge-type points are added according to the responsibility_type of the charge being discounted: a repair_patient_share
      charge, an unplanned repair of equipment the patient owns, adds `charge_pts_repair` points; a deductible charge
      adds `charge_pts_deductible` points; a coinsurance or copay charge adds none.
    h_type_pts: >-
      Charge-type points are added according to the responsibility_type of the charge being discounted: a repair_patient_share
      charge, an unplanned repair of equipment the patient owns, adds `charge_pts_repair` points; a deductible charge
      adds `charge_pts_deductible` points; a coinsurance or copay charge adds none.
    h_assist_pct: >-
      The medical-burden, ongoing-rental, coverage-tenure, payment-effort, statement-age and charge-type points
      are added together to the tier's discount percentage to give one assistance percentage, which never exceeds
      `max_pct`; for every hardship discount, and only for hardship discounts, that percentage is applied once to
      the charge's amount as posted, and the points are never applied as separate discounts one after another.
    result: >-
      The hardship discount on a charge is the account's assistance percentage of the charge's amount as posted,
      rounded to the cent half up.
  factors:
  - id: hardship_medical_burden_points
    effect: method
    decides: h_burden_pts
    bindings:
    - h_wheelchair_start
    - h_burden_pts
    ladder:
    - when: the patient's wheelchair record is rental_active
      method: >-
        one point per full `burden_step` of charges on this account posted since the wheelchair's rental period
        began (window anchored on the rental period start)
    - when: no rental_active wheelchair, and the coverage class counts its benefit year as a plan_year
      method: >-
        one point per full `burden_step` of charges on this account posted since the benefit-year start (window
        anchored on the benefit-year reset)
    - when: otherwise
      method: no medical-burden points
    baseline:
      h_burden_pts: '0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: mobility
  - id: hardship_ongoing_rental_points
    effect: parameter
    decides: h_rental_pts
    bindings:
    - h_active_rentals
    - h_rental_pts
    ladder:
    - when: two or more of the patient's wheelchair, oxygen and PAP device records are rental_active
      value: K('rental_pts_two')
    - when: exactly one of them is rental_active
      value: K('rental_pts_one')
    - when: otherwise
      value: '0'
    baseline:
      h_rental_pts: '0'
    evidence:
    - cross_category
    cross_difficulty: mobility
  - id: hardship_coverage_tenure_points
    effect: parameter
    decides: h_tenure_pts
    bindings:
    - h_coverage_months
    - h_tenure_pts
    ladder:
    - when: >-
        at least `tenure_long_months` whole calendar months since the coverage record's effective_date
      value: K('tenure_pts_long')
    - when: at least `tenure_mid_months` but fewer than `tenure_long_months` months
      value: K('tenure_pts_mid')
    - when: otherwise
      value: '0'
    baseline:
      h_tenure_pts: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: hardship_payment_effort_points
    effect: parameter
    decides: h_effort_pts
    bindings:
    - h_payment_entries
    - h_effort_pts
    ladder:
    - when: >-
        at least `effort_high_count` patient-payment entries posted fewer than `trailing_window_months` whole months
        before the handling date
      value: K('effort_pts_high')
    - when: at least `effort_low_count` but fewer than `effort_high_count` such entries
      value: K('effort_pts_low')
    - when: otherwise
      value: '0'
    baseline:
      h_effort_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: hardship_statement_age_points
    effect: parameter
    decides: h_aged_pts
    bindings:
    - h_recent_statements
    - h_aged_pts
    ladder:
    - when: >-
        at least `aged_high_count` statements issued fewer than `statement_window_months` whole months before the
        handling date
      value: K('aged_pts_high')
    - when: at least `aged_mid_count` but fewer than `aged_high_count` such statements
      value: K('aged_pts_mid')
    - when: otherwise
      value: '0'
    baseline:
      h_aged_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: hardship_charge_type_points
    effect: parameter
    decides: h_type_pts
    bindings:
    - h_kind
    - h_type_pts
    ladder:
    - when: the charge being discounted is a repair_patient_share charge
      value: K('charge_pts_repair')
    - when: the charge being discounted is a deductible charge
      value: K('charge_pts_deductible')
    - when: otherwise (coinsurance or copay)
      value: '0'
    baseline:
      h_type_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The hardship discount on a charge is the account's assistance percentage of the charge's amount as posted,
      rounded to the cent half up. The assistance percentage is the discount percentage of the approved hardship
      tier: `tier_pct_full_100` for full_100, `tier_pct_partial_75` for partial_75, `tier_pct_partial_50` for partial_50
      and `tier_pct_partial_25` for partial_25.
    params:
    - tier_pct_full_100
    - tier_pct_partial_75
    - tier_pct_partial_50
    - tier_pct_partial_25
  inputs:
    history:
    - table: coverage_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: coverage_patient_charge
    - table: coverage_ledger
      aggregate: latest
      field: responsibility_type
      filters:
        event_type: coverage_patient_charge
    - table: coverage_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: coverage_patient_charge
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 12
      filters:
        event_type: coverage_payment
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 6
      filters:
        event_type: coverage_statement
    cross_category:
    - mobility
    - oxygen
    - pap
- id: coverage_ext_prompt_pay_discount
  base_policy_refs:
  - coverage_qmb_protection
  - coverage_hardship
  - coverage_evt_adjustments
  - coverage_retro_medicaid
  - coverage_payer_program_rules
  overwrite:
  - base_policy: coverage_evt_adjustments
    superseded_clause: >-
      A prompt-pay discount of `prompt_pay_discount_pct` of a charge applies when the class offers one and the patient
      pays the charge in full no later than `prompt_pay_window_days` calendar days after the first statement showing
      it; it is posted with adjustment_reason prompt_pay_discount on the paying day and the payment due is reduced
      by it.
    replaced_by: >-
      The speed, payment-channel, loyalty and payment-size points are added to, and the aged-account and assistance-overlap
      points taken off, the class's `prompt_pay_discount_pct` to give one prompt-pay rate; for a prompt-pay discount
      on a coinsurance charge, and only for such a discount, that rate is applied once to the amount of the charge
      paid in full, the points are never applied as separate discounts one after another, and a prompt-pay discount
      on any other charge remains under the base rule.
  - base_policy: coverage_qmb_protection
    superseded_clause: >-
      The QMB protection applies only while the Medicaid record is active: the Medicaid record carrying qmb_status
      qmb is in status active.
    replaced_by: >-
      For a prompt-pay discount, and only for a prompt-pay discount, no Medicaid record has to be active, because
      the discount rests on the payment that earned it; QMB protection itself, and every adjustment other than a
      hardship or a prompt-pay discount, remains under the base rule, so QMB protection applies only while the Medicaid
      record carrying qmb_status qmb is in status active.
  - base_policy: coverage_evt_adjustments
    superseded_clause: >-
      Adjustments on one charge never stack beyond its open amount: when a hardship discount and a prompt-pay discount
      could both apply to the same charge, only the larger one is posted, and QMB protection displaces both.
    replaced_by: >-
      For a prompt-pay discount, and only for a prompt-pay discount, the adjustment is posted for its full figure
      even though the qualifying payment has already brought the charge's open amount to 0.00, the discount staying
      on the account as a credit toward its other open charges; every adjustment other than a hardship or a prompt-pay
      discount remains under the base rule and never stacks beyond its charge's open amount, and when a hardship
      and a prompt-pay discount could both apply to one charge only the larger is posted, with QMB protection displacing
      both.
  trigger: state_due
  subject:
  - coverage_adjustment
  computes: amount
  target_tool: apply_prompt_pay_discount_12f1a0eb
  params:
    channel_pts_bank: 1.0
    channel_pts_hsa: 0.5
    loyalty_months: 60
    loyalty_payment_count: 4
    recent_window_months: 12
    loyalty_pts_both: 1.0
    loyalty_pts_one: 0.5
    aged_window_months: 6
    aged_high_count: 5
    aged_mid_count: 3
    aged_pts_high: 1.0
    aged_pts_mid: 0.5
    size_high_amount: 250.0
    size_mid_amount: 50.0
    size_pts_high: 1.0
    size_pts_mid: 0.5
    weekday_share: 5
    week_days: 7
    speed_pts_start: 2.0
    speed_step_days: 8
    overlap_pts_deep: 1.0
    overlap_pts_light: 0.5
  rule: >-
    Summit Ridge grants a prompt-pay discount on a coinsurance charge on the coverage account that a patient-payment
    entry pays in full on or after the latest statement issued on the account and no later than `prompt_pay_window_days`
    calendar days after it, on a coverage class whose `prompt_pay_discount_pct` is above 0; it is posted as one
    adjustment with adjustment_reason prompt_pay_discount against the charge paid, and a class whose `prompt_pay_discount_pct`
    is 0 grants none. A prompt-pay discount that was not posted on the paying day is posted when the omission is
    found before the account's next statement is issued; once a later statement has gone out showing the account
    without it, the account stands as statemented and no discount is posted for that payment. Missed prompt-pay
    discounts are worked one payment at a time, starting from the account's most recent patient-payment entry, and
    the discount figured is the one for that entry and the account's most recently posted coinsurance charge; it
    is 0.00, and nothing is posted, when that entry is smaller than that charge or was posted before, or more than
    `prompt_pay_window_days` calendar days after, the latest statement. The prompt-pay discount is the prompt-pay
    rate, taken as a percentage, of the amount of the charge the qualifying payment paid in full, rounded to the
    cent half up. The prompt-pay rate is the class's `prompt_pay_discount_pct`. Speed points are added to the prompt-pay
    rate by a reckoning that depends on where the charge comes from: for a charge stemming from a wheelchair, an
    oxygen or a PAP line, the points are `speed_pts_start` less one point for each full `speed_step_days` calendar
    days from the charge's posting date to the payment's posting date, never below zero; for a charge stemming from
    a PAP supply or a urological supply line, they are `speed_pts_start` less one point for each full `speed_step_days`
    weekdays in that span, the weekdays taken as five sevenths of the calendar days rounded down, never below zero;
    for any other charge, no speed points. Payment-channel points are added according to how the qualifying payment
    was made: ach or check adds `channel_pts_bank` points, hsa_fsa_card adds `channel_pts_hsa` points, and card
    adds none. Loyalty points are added according to two conditions, the coverage record having been held at least
    `loyalty_months` whole calendar months since its effective_date and the account showing at least `loyalty_payment_count`
    patient-payment entries posted fewer than `recent_window_months` whole calendar months before the handling date:
    both conditions met add `loyalty_pts_both` points, exactly one of them met adds `loyalty_pts_one` points, and
    neither met adds none. Aged-account points are taken off the prompt-pay rate according to the statements issued
    on the account fewer than `aged_window_months` whole calendar months before the handling date: at least `aged_high_count`
    statements take off `aged_pts_high` points, at least `aged_mid_count` but fewer than `aged_high_count` statements
    take off `aged_pts_mid` points, and fewer than `aged_mid_count` statements take off none. Payment-size points
    are added according to the amount the qualifying payment paid on the charge: at least `size_high_amount` adds
    `size_pts_high` points, at least `size_mid_amount` but less than `size_high_amount` adds `size_pts_mid` points,
    and less than `size_mid_amount` adds none. Assistance-overlap points are taken off the prompt-pay rate while
    the account's hardship approval is in force, that is while fewer than `hardship_approval_valid_months` whole
    calendar months have passed between hardship_approved_date and the handling date: a full_100, partial_75 or
    partial_50 tier takes off `overlap_pts_deep` points, a partial_25 tier takes off `overlap_pts_light` points,
    and an account with no approval in force takes off none. The speed, payment-channel, loyalty and payment-size
    points are added to, and the aged-account and assistance-overlap points taken off, the class's `prompt_pay_discount_pct`
    to give one prompt-pay rate; for a prompt-pay discount on a coinsurance charge, and only for such a discount,
    that rate is applied once to the amount of the charge paid in full, the points are never applied as separate
    discounts one after another, and a prompt-pay discount on any other charge remains under the base rule. For
    a prompt-pay discount, and only for a prompt-pay discount, the adjustment is posted for its full figure even
    though the qualifying payment has already brought the charge's open amount to 0.00, the discount staying on
    the account as a credit toward its other open charges; every adjustment other than a hardship or a prompt-pay
    discount remains under the base rule and never stacks beyond its charge's open amount, and when a hardship and
    a prompt-pay discount could both apply to one charge only the larger is posted, with QMB protection displacing
    both. For a prompt-pay discount, and only for a prompt-pay discount, no Medicaid record has to be active, because
    the discount rests on the payment that earned it; QMB protection itself, and every adjustment other than a hardship
    or a prompt-pay discount, remains under the base rule, so QMB protection applies only while the Medicaid record
    carrying qmb_status qmb is in status active.
  prerequisite: []
  cross_category: []
  compute:
  - p_class_pct: P('prompt_pay_discount_pct')
  - p_charge_amount: >-
      LATEST('coverage_ledger', 'amount', date_field='posting_date', event_type='coverage_patient_charge', responsibility_type='coinsurance')
  - e_paid_amount: >-
      LATEST('coverage_ledger', 'amount', date_field='posting_date', event_type='coverage_payment')
  - e_paid_on: >-
      LATEST('coverage_ledger', 'posting_date', date_field='posting_date', event_type='coverage_payment')
  - e_statement_on: >-
      LATEST('coverage_ledger', 'posting_date', date_field='posting_date', event_type='coverage_statement')
  - p_eligible: >-
      1 if (e_paid_amount >= p_charge_amount and DAYS(e_statement_on, e_paid_on) >= 0 and DAYS(e_statement_on, e_paid_on)
      <= P('prompt_pay_window_days')) else 0
  - p_charge_source: >-
      LATEST('coverage_ledger', 'source_category', date_field='posting_date', event_type='coverage_patient_charge',
      responsibility_type='coinsurance')
  - p_charge_date: >-
      LATEST('coverage_ledger', 'posting_date', date_field='posting_date', event_type='coverage_patient_charge',
      responsibility_type='coinsurance')
  - p_paid_on: >-
      LATEST('coverage_ledger', 'posting_date', date_field='posting_date', event_type='coverage_payment')
  - p_speed_pts: >-
      MX(0, K('speed_pts_start') - int(DAYS(p_charge_date, p_paid_on) / K('speed_step_days'))) if (p_charge_source
      == 'mobility' or p_charge_source == 'oxygen' or p_charge_source == 'pap') else (MX(0, K('speed_pts_start')
      - int(int(DAYS(p_charge_date, p_paid_on) * K('weekday_share') / K('week_days')) / K('speed_step_days'))) if
      (p_charge_source == 'resupply' or p_charge_source == 'urology') else 0)
  - p_paid_method: >-
      LATEST('coverage_ledger', 'payment_method', date_field='posting_date', event_type='coverage_payment')
  - p_channel_pts: >-
      K('channel_pts_bank') if (p_paid_method == 'ach' or p_paid_method == 'check') else (K('channel_pts_hsa') if
      p_paid_method == 'hsa_fsa_card' else 0)
  - p_coverage_months: MONTHS(F('effective_date'), NOW)
  - p_payment_entries: >-
      COUNT('coverage_ledger', within_months=K('recent_window_months'), date_field='posting_date', event_type='coverage_payment')
  - p_loyalty_pts: >-
      K('loyalty_pts_both') if (p_coverage_months >= K('loyalty_months') and p_payment_entries >= K('loyalty_payment_count'))
      else (K('loyalty_pts_one') if (p_coverage_months >= K('loyalty_months') or p_payment_entries >= K('loyalty_payment_count'))
      else 0)
  - p_recent_statements: >-
      COUNT('coverage_ledger', within_months=K('aged_window_months'), date_field='posting_date', event_type='coverage_statement')
  - p_aged_pts: >-
      K('aged_pts_high') if p_recent_statements >= K('aged_high_count') else (K('aged_pts_mid') if p_recent_statements
      >= K('aged_mid_count') else 0)
  - p_paid_amount: >-
      LATEST('coverage_ledger', 'amount', date_field='posting_date', event_type='coverage_payment')
  - p_size_pts: >-
      K('size_pts_high') if p_paid_amount >= K('size_high_amount') else (K('size_pts_mid') if p_paid_amount >= K('size_mid_amount')
      else 0)
  - p_overlap_months: >-
      P('hardship_approval_valid_months') if F('hardship_tier') == 'none' else MONTHS(F('hardship_approved_date'),
      NOW)
  - p_overlap_pts: >-
      K('overlap_pts_deep') if (p_overlap_months < P('hardship_approval_valid_months') and (F('hardship_tier') ==
      'full_100' or F('hardship_tier') == 'partial_75' or F('hardship_tier') == 'partial_50')) else (K('overlap_pts_light')
      if (p_overlap_months < P('hardship_approval_valid_months') and F('hardship_tier') == 'partial_25') else 0)
  - p_rate: >-
      p_class_pct + p_speed_pts + p_channel_pts + p_loyalty_pts - p_aged_pts + p_size_pts - p_overlap_pts
  - result: >-
      0 if (p_class_pct == 0 or p_eligible == 0) else RND(p_charge_amount * p_rate / 100 + 0.000001, 2)
  compute_basis:
