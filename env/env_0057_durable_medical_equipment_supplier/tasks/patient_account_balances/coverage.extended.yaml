      method: core term = the installments still to fall due (original end date kept)
    - when: >-
        at least `kept_record_count` such entries but fewer than `keep_end_min_months` installments still to fall
        due
      method: >-
        core term = the months left in the current benefit year, `benefit_year_months` less the whole months since
        benefit_year_start (re-anchored on the benefit year)
    - when: otherwise
      method: core term = the class's `payment_plan_max_months`, counted afresh
    baseline:
      m_core: P('payment_plan_max_months')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: revision_rental_burden_months
    effect: parameter
    decides: m_rental_months
    bindings:
    - m_ongoing_rentals
    - m_rental_months
    ladder:
    - when: >-
        two or more wheelchair, oxygen or PAP device lines with a paid rental month that began fewer than `rental_window_months`
        months before the handling date
      value: K('rental_ext_two')
    - when: exactly one such line
      value: K('rental_ext_one')
    - when: otherwise
      value: '0'
    baseline:
      m_rental_months: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: oxygen
  - id: revision_new_charge_months
    effect: parameter
    decides: m_growth_months
    bindings:
    - m_charge_window
    - m_new_charges
    - m_growth_months
    ladder:
    - when: charges posted since the arrangement began total at least `growth_high`
      value: K('growth_months_high')
    - when: they total at least `growth_mid` but less than `growth_high`
      value: K('growth_months_mid')
    - when: otherwise
      value: '0'
    baseline:
      m_growth_months: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: revision_installment_record_months
    effect: parameter
    decides: m_record_months
    bindings:
    - m_record_entries
    - m_record_months
    ladder:
    - when: at least `record_high_count` payment entries in the last `record_window_months` months
      value: K('record_months_high')
    - when: at least `record_mid_count` but fewer than `record_high_count` such entries
      value: K('record_months_mid')
    - when: otherwise
      value: '0'
    baseline:
      m_record_months: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: revision_long_coverage_months
    effect: parameter
    decides: m_tenure_months
    bindings:
    - m_coverage_months
    - m_tenure_months
    ladder:
    - when: at least `tenure_long_months` whole months since the coverage record's effective_date
      value: K('tenure_months_long')
    - when: at least `tenure_mid_months` but fewer than `tenure_long_months` months
      value: K('tenure_months_mid')
    - when: otherwise
      value: '0'
    baseline:
      m_tenure_months: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: revision_secondary_relief_months
    effect: parameter
    decides: m_relief_months
    bindings:
    - m_secondary_entries
    - m_relief_months
    ladder:
    - when: >-
        at least `relief_high_count` secondary-payment entries in the last `relief_window_months` months
      value: K('relief_months_high')
    - when: at least `relief_mid_count` but fewer than `relief_high_count` such entries
      value: K('relief_months_mid')
    - when: otherwise
      value: '0'
    baseline:
      m_relief_months: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The revised monthly installment is the account's patient_balance divided by the remaining term in months,
      rounded to the cent half up, and never less than `payment_plan_min_monthly`. The remaining term is the class's
      `payment_plan_max_months`.
    params:
    - payment_plan_max_months
    - payment_plan_min_monthly
  inputs:
    history:
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 3
      filters:
        event_type: coverage_payment
    - table: coverage_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: coverage_patient_charge
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 6
      filters:
        event_type: coverage_payment
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 3
      filters:
        event_type: coverage_secondary_payment
    - category: oxygen
      table: oxygen_billing
      aggregate: count
      field: oxygen_bill_id
      within_months: 2
      filters:
        event_type: oxygen_rental_paid
    cross_category:
    - mobility
    - oxygen
    - pap
