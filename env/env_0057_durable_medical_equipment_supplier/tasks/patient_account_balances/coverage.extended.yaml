      The crossover price of the line is the lesser of the line's cost share and the Medicaid monthly rate less
      what the primary paid, never below zero; the Medicaid monthly rate is the oxygen class's `stationary_monthly_fee`
      plus its `portable_addon_monthly_fee`, times the Medicaid record's `allowed_pct_of_fee_schedule` percent,
      rounded to the cent half up, and the Medicaid copayment is the class's `medicaid_copay_per_line`.
    result: >-
      The Medicaid crossover payment is the crossover price of the line less the Medicaid copayment, never below
      zero, never more than the line's cost share, and rounded to the cent half up.
  factors:
  - id: crossover_flow_multiplier
    effect: parameter
    decides: s_flow_mult
    bindings:
    - s_lpm
    - s_flow_mult
    ladder:
    - when: prescribed_lpm above the class's `high_flow_threshold_lpm`
      value: 1 + `high_flow_uplift_pct` / 100
    - when: prescribed_lpm below the class's `low_flow_threshold_lpm`
      value: 1 - `low_flow_reduction_pct` / 100
    - when: otherwise
      value: '1'
    baseline:
      s_flow_mult: '1'
    evidence:
    - cross_category
    cross_difficulty: oxygen
  - id: crossover_addon_reckoning
    effect: method
    decides: s_addon
    bindings:
    - s_addon_lpm
    - s_addon_use
    - s_addon_portable
    - s_addon
    ladder:
    - when: >-
        prescribed_lpm above the class's `high_flow_threshold_lpm`, the class furnishes portable equipment, and
        the usage_pattern is not sleep_only
      method: >-
        only the part by which the stationary fee plus the portable add-on exceeds the stationary fee raised by
        `high_flow_uplift_pct`, never below zero (the higher of the two amounts applies)
    - when: the usage_pattern is sleep_only
      method: no portable add-on enters the rate
    - when: otherwise
      method: the full `portable_addon_monthly_fee` enters the rate
    baseline:
      s_addon: s_addon_portable
    evidence:
    - cross_category
    cross_difficulty: oxygen
  - id: crossover_usage_share
    effect: parameter
    decides: s_usage_pct
    bindings:
    - s_usage
    - s_usage_pct
    ladder:
    - when: usage_pattern exertion_and_sleep
      value: K('usage_pct_combined')
    - when: usage_pattern sleep_only or exertion_only
      value: K('usage_pct_single')
    - when: otherwise (continuous)
      value: '100'
    baseline:
      s_usage_pct: '100'
    evidence:
    - cross_category
    cross_difficulty: oxygen
  - id: crossover_class_rate_share
    effect: parameter
    decides: s_rate_pct
    bindings:
    - s_class
    - s_rate_pct
    ladder:
    - when: the oxygen class furnishes portable cylinders or a home fill system
      value: K('rate_pct_gas')
    - when: the oxygen class is a liquid oxygen system or a portable oxygen concentrator
      value: K('rate_pct_liquid_poc')
    - when: otherwise
      value: P('allowed_pct_of_fee_schedule')
    baseline:
      s_rate_pct: P('allowed_pct_of_fee_schedule')
    evidence:
    - cross_category
    cross_difficulty: oxygen
  - id: crossover_rental_phase_share
    effect: parameter
    decides: s_phase_pct
    bindings:
    - s_month
    - s_phase_pct
    ladder:
    - when: the line's rental month number is at least `phase_third_start`
      value: K('phase_pct_third')
    - when: the rental month number is at least `phase_second_start` but below `phase_third_start`
      value: K('phase_pct_second')
    - when: otherwise
      value: '100'
    baseline:
      s_phase_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: oxygen
  - id: crossover_copay_band
    effect: parameter
    decides: s_copay
    bindings:
    - s_copay_share
    - s_copay
    ladder:
    - when: the Medicaid record is a qmb record
      value: '0'
    - when: >-
        a not_qmb record and a Medicare cost share on the line of no more than `copay_band_low_max`
      value: K('copay_band_low')
    - when: >-
        a not_qmb record and a cost share above `copay_band_low_max` but no more than `copay_band_mid_max`
      value: K('copay_band_mid')
    - when: >-
        a not_qmb record and a cost share above `copay_band_mid_max` but no more than `copay_band_upper_max`
      value: K('copay_band_upper')
    - when: otherwise (a not_qmb record and a larger cost share)
      value: P('medicaid_copay_per_line')
    baseline:
      s_copay: P('medicaid_copay_per_line')
    evidence:
    - cross_category
    cross_difficulty: oxygen
  baseline:
