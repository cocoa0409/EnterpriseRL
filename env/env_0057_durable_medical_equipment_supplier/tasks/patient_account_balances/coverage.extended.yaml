      Loyalty points are added according to two conditions, the coverage record having been held at least `loyalty_months`
      whole calendar months since its effective_date and the account showing at least `loyalty_payment_count` patient-payment
      entries posted fewer than `recent_window_months` whole calendar months before the handling date: both conditions
      met add `loyalty_pts_both` points, exactly one of them met adds `loyalty_pts_one` points, and neither met
      adds none.
    p_loyalty_pts: >-
      Loyalty points are added according to two conditions, the coverage record having been held at least `loyalty_months`
      whole calendar months since its effective_date and the account showing at least `loyalty_payment_count` patient-payment
      entries posted fewer than `recent_window_months` whole calendar months before the handling date: both conditions
      met add `loyalty_pts_both` points, exactly one of them met adds `loyalty_pts_one` points, and neither met
      adds none.
    p_recent_statements: >-
      Aged-account points are taken off the prompt-pay rate according to the statements issued on the account fewer
      than `aged_window_months` whole calendar months before the handling date: at least `aged_high_count` statements
      take off `aged_pts_high` points, at least `aged_mid_count` but fewer than `aged_high_count` statements take
      off `aged_pts_mid` points, and fewer than `aged_mid_count` statements take off none.
    p_aged_pts: >-
      Aged-account points are taken off the prompt-pay rate according to the statements issued on the account fewer
      than `aged_window_months` whole calendar months before the handling date: at least `aged_high_count` statements
      take off `aged_pts_high` points, at least `aged_mid_count` but fewer than `aged_high_count` statements take
      off `aged_pts_mid` points, and fewer than `aged_mid_count` statements take off none.
    p_paid_amount: >-
      Payment-size points are added according to the amount the qualifying payment paid on the charge: at least
      `size_high_amount` adds `size_pts_high` points, at least `size_mid_amount` but less than `size_high_amount`
      adds `size_pts_mid` points, and less than `size_mid_amount` adds none.
    p_size_pts: >-
      Payment-size points are added according to the amount the qualifying payment paid on the charge: at least
      `size_high_amount` adds `size_pts_high` points, at least `size_mid_amount` but less than `size_high_amount`
      adds `size_pts_mid` points, and less than `size_mid_amount` adds none.
    p_overlap_months: >-
      Assistance-overlap points are taken off the prompt-pay rate while the account's hardship approval is in force,
      that is while fewer than `hardship_approval_valid_months` whole calendar months have passed between hardship_approved_date
      and the handling date: a full_100, partial_75 or partial_50 tier takes off `overlap_pts_deep` points, a partial_25
      tier takes off `overlap_pts_light` points, and an account with no approval in force takes off none.
    p_overlap_pts: >-
      Assistance-overlap points are taken off the prompt-pay rate while the account's hardship approval is in force,
      that is while fewer than `hardship_approval_valid_months` whole calendar months have passed between hardship_approved_date
      and the handling date: a full_100, partial_75 or partial_50 tier takes off `overlap_pts_deep` points, a partial_25
      tier takes off `overlap_pts_light` points, and an account with no approval in force takes off none.
    p_rate: >-
      The speed, payment-channel, loyalty and payment-size points are added to, and the aged-account and assistance-overlap
      points taken off, the class's `prompt_pay_discount_pct` to give one prompt-pay rate; for a prompt-pay discount
      on a coinsurance charge, and only for such a discount, that rate is applied once to the amount of the charge
      paid in full, the points are never applied as separate discounts one after another, and a prompt-pay discount
      on any other charge remains under the base rule.
    result: >-
      The prompt-pay discount is the prompt-pay rate, taken as a percentage, of the amount of the charge the qualifying
      payment paid in full, rounded to the cent half up.
  factors:
  - id: prompt_speed_reckoning
    effect: method
    decides: p_speed_pts
    bindings:
    - p_charge_source
    - p_charge_date
    - p_paid_on
    - p_speed_pts
    ladder:
    - when: the charge stems from a wheelchair, an oxygen or a PAP line
      method: >-
        `speed_pts_start` less one point per full `speed_step_days` calendar days from the charge's posting date
        to the payment's posting date, never below zero
    - when: the charge stems from a PAP supply or a urological supply line
      method: >-
        `speed_pts_start` less one point per full `speed_step_days` weekdays (five sevenths of the calendar days,
        rounded down) in that span, never below zero
    - when: otherwise
      method: no speed points
    baseline:
      p_speed_pts: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: prompt_channel_points
    effect: parameter
    decides: p_channel_pts
    bindings:
    - p_paid_method
    - p_channel_pts
    ladder:
    - when: the qualifying payment was made by ach or check
      value: K('channel_pts_bank')
    - when: the qualifying payment was made by hsa_fsa_card
      value: K('channel_pts_hsa')
    - when: otherwise (card)
      value: '0'
    baseline:
      p_channel_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: prompt_loyalty_points
    effect: parameter
    decides: p_loyalty_pts
    bindings:
    - p_coverage_months
    - p_payment_entries
    - p_loyalty_pts
    ladder:
    - when: >-
        coverage held at least `loyalty_months` months and at least `loyalty_payment_count` patient-payment entries
        in the last `recent_window_months` months
      value: K('loyalty_pts_both')
    - when: exactly one of those two conditions met
      value: K('loyalty_pts_one')
    - when: otherwise
      value: '0'
    baseline:
      p_loyalty_pts: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: prompt_aged_account_points
    effect: parameter
    decides: p_aged_pts
    bindings:
    - p_recent_statements
    - p_aged_pts
    ladder:
    - when: at least `aged_high_count` statements issued in the last `aged_window_months` months
      value: K('aged_pts_high')
    - when: at least `aged_mid_count` but fewer than `aged_high_count` such statements
      value: K('aged_pts_mid')
    - when: otherwise
      value: '0'
    baseline:
      p_aged_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: prompt_payment_size_points
    effect: parameter
    decides: p_size_pts
    bindings:
    - p_paid_amount
    - p_size_pts
    ladder:
    - when: the qualifying payment paid at least `size_high_amount` on the charge
      value: K('size_pts_high')
    - when: it paid at least `size_mid_amount` but less than `size_high_amount`
      value: K('size_pts_mid')
    - when: otherwise
      value: '0'
    baseline:
      p_size_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: prompt_assistance_overlap_points
    effect: parameter
    decides: p_overlap_pts
    bindings:
    - p_overlap_months
    - p_overlap_pts
    ladder:
    - when: hardship approval in force on a full_100, partial_75 or partial_50 tier
      value: K('overlap_pts_deep')
    - when: hardship approval in force on a partial_25 tier
      value: K('overlap_pts_light')
    - when: otherwise
      value: '0'
    baseline:
      p_overlap_pts: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The prompt-pay discount is the prompt-pay rate, taken as a percentage, of the amount of the charge the qualifying
      payment paid in full, rounded to the cent half up. The prompt-pay rate is the class's `prompt_pay_discount_pct`.
    params:
    - prompt_pay_discount_pct
  inputs:
    history:
    - table: coverage_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: coverage_payment
    - table: coverage_ledger
      aggregate: latest
      field: posting_date
      filters:
        event_type: coverage_statement
    - table: coverage_ledger
      aggregate: latest
      field: posting_date
      filters:
        event_type: coverage_patient_charge
        responsibility_type: coinsurance
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 12
      filters:
        event_type: coverage_payment
    - table: coverage_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 6
      filters:
        event_type: coverage_statement
    - table: coverage_ledger
      aggregate: latest
      field: amount
      filters:
        event_type: coverage_patient_charge
        responsibility_type: coinsurance
    cross_category: []
- id: coverage_ext_arrangement_deposit
  base_policy_refs:
  - coverage_evt_payment
  - coverage_agg_payment_allocation
  overwrite:
  - base_policy: coverage_evt_payment
    superseded_clause: >-
      A patient payment is posted for the exact amount the patient pays, with the payment_method used and the payment_reference
      the patient quotes copied verbatim.
    replaced_by: >-
      For an arrangement deposit, and only for an arrangement deposit, the entry is posted for the exact amount
      the patient pays, with the payment_method the patient uses and, as payment_reference, the confirmation code
      the payment network issues for that deposit; every other patient payment remains under the base rule, posted
      for the exact amount paid with the payment_method used and the payment_reference the patient quotes copied
      verbatim.
  - base_policy: coverage_evt_payment
    superseded_clause: >-
      A payment reference already posted on the account is never posted again for the same charge.
    replaced_by: >-
      For an arrangement deposit, and only for an arrangement deposit, the confirmation code is issued for that
      deposit alone and is never shared with another payment entry on the account; for every other patient payment
      the base rule stands, and a payment reference already posted on the account is never posted again for the
      same charge.
  - base_policy: coverage_agg_payment_allocation
    superseded_clause: >-
      A patient payment that names no charge is allocated across all of the patient's coverage accounts, oldest
      open charge first: open charges are taken in the order of coverage_msr_open_charges and each receives the
      smaller of its open amount and the payment still unallocated, one coverage_payment entry per charge, until
      the payment is used up.
    replaced_by: >-
      For an arrangement deposit, and only for an arrangement deposit, the payment is posted as one patient-payment
      entry naming the account's oldest open charge; every other patient payment that names no charge remains under
      the base rule, allocated across all of the patient's coverage accounts oldest open charge first, one entry
      per charge.
  - base_policy: coverage_evt_payment
    superseded_clause: >-
      When the payment exceeds the open amount of the charges it is applied to, the remainder posts with an empty
      applied_to_entry_id and leaves a credit on the account, handled under coverage_credit_refund.
    replaced_by: >-
      For an arrangement deposit, and only for an arrangement deposit, a deposit larger than the named charge's
      open amount is still posted whole on that one entry, its excess carried by the account balance toward the
      account's next open charges; every other patient payment that exceeds the open amount of the charges it is
      applied to remains under the base rule, its remainder posted with an empty applied_to_entry_id as a credit.
  trigger: on_request
  subject:
  - coverage_payment
  computes: amount
  target_tool: pay_arrangement_deposit_e794f585
  params:
    deposit_pct_standard: 10
    history_recent_days: 60
    history_pts_both: 4
    history_pts_one: 2
    hardship_pts_deep: 4
    hardship_pts_light: 2
    exposure_large: 2500.0
    exposure_mid: 500.0
    exposure_pts_large: 4
    exposure_pts_mid: 2
    cycle_high: 6
    cycle_mid: 3
    cycle_pts_high: 3
    cycle_pts_mid: 1
    bank_pts_ach: 1.0
    bank_pts_check: 0.5
    rental_window_months: 2
    half_share: 0.5
    three_quarter_share: 0.75
    quarters_per_dollar: 4
    mode_half: 2
    mode_three_quarter: 1
    mode_as_figured: 0
  rule: >-
    An arrangement deposit is the patient's own payment that opens a monthly payment arrangement on a coverage account.
    For an arrangement deposit, and only for an arrangement deposit, the payment is posted as one patient-payment
    entry naming the account's oldest open charge; every other patient payment that names no charge remains under
    the base rule, allocated across all of the patient's coverage accounts oldest open charge first, one entry per
    charge. For an arrangement deposit, and only for an arrangement deposit, a deposit larger than the named charge's
    open amount is still posted whole on that one entry, its excess carried by the account balance toward the account's
    next open charges; every other patient payment that exceeds the open amount of the charges it is applied to
    remains under the base rule, its remainder posted with an empty applied_to_entry_id as a credit. For an arrangement
    deposit, and only for an arrangement deposit, the entry is posted for the exact amount the patient pays, with
    the payment_method the patient uses and, as payment_reference, the confirmation code the payment network issues
    for that deposit; every other patient payment remains under the base rule, posted for the exact amount paid
    with the payment_method used and the payment_reference the patient quotes copied verbatim. For an arrangement
    deposit, and only for an arrangement deposit, the confirmation code is issued for that deposit alone and is
    never shared with another payment entry on the account; for every other patient payment the base rule stands,
    and a payment reference already posted on the account is never posted again for the same charge. The arrangement
    deposit is figured only after every charge the account's hardship approval covers carries its hardship discount.
    The arrangement deposit is not worked out until every coinsurance charge that a payment made since the latest
    statement paid in full within the prompt-pay window carries its prompt-pay discount. The figured arrangement
    deposit is the deposit percentage of the account's patient_balance at the time the deposit is figured, rounded
    to the cent half up, and the deposit the patient pays is that figured deposit. The deposit percentage is `deposit_pct_standard`.
    Proven-payer points are taken off the deposit percentage according to two conditions, the account's payment_plan_status
    showing a completed arrangement and the latest patient-payment entry on the account having been posted no more
    than `history_recent_days` calendar days before the handling date: both met take off `history_pts_both` points,
    exactly one met takes off `history_pts_one` points, and neither takes off none. Hardship points are taken off
    the deposit percentage while the account's hardship approval is in force, that is while fewer than `hardship_approval_valid_months`
    whole calendar months have passed between hardship_approved_date and the handling date: a full_100, partial_75
    or partial_50 tier takes off `hardship_pts_deep` points, a partial_25 tier takes off `hardship_pts_light` points,
    and an account with no approval in force takes off none. Exposure points are added to the deposit percentage
    according to the patient charges posted on the coverage account in the current benefit year, a charge counting
    when the whole calendar months between its posting date and the handling date do not exceed the whole calendar
    months between the record's benefit_year_start and the handling date: charges totalling at least `exposure_large`
    add `exposure_pts_large` points, at least `exposure_mid` but less than `exposure_large` add `exposure_pts_mid`
    points, and less than `exposure_mid` adds none. Dunning points are added to the deposit percentage according
    to the statement_cycle printed on the account's latest statement: a cycle of at least `cycle_high` adds `cycle_pts_high`
    points, at least `cycle_mid` but below `cycle_high` adds `cycle_pts_mid` points, and a lower cycle adds none.
    Bank-payer points are taken off the deposit percentage according to how the latest patient-payment entry on
    the account was made: ach takes off `bank_pts_ach` points, check takes off `bank_pts_check` points, and any
    other method takes off none. The exposure and dunning points are added to, and the proven-payer, hardship and
    bank-payer points taken off, `deposit_pct_standard` to give one deposit percentage, which is applied once to
    the account's patient_balance. The deposit the patient pays is settled from the figured deposit by the patient's
    ongoing monthly rentals, counting each of the wheelchair, oxygen and PAP device lines with a paid rental month
    whose service_from_date falls fewer than `rental_window_months` whole calendar months before the handling date:
    with two or more such rentals the deposit is half the figured deposit rounded down to a whole dollar; with exactly
    one such rental it is three quarters of the figured deposit rounded up to the next quarter dollar; with none
    it is the figured deposit as it stands.
  prerequisite:
  - problem: coverage_ext_hardship_discount
    kind: value_input
    gate: d_balance
    form: state
    policy_source: >-
      The arrangement deposit is figured only after every charge the account's hardship approval covers carries
      its hardship discount.
    condition: >-
      Every coverage_patient_charge of a discountable responsibility_type that the account's hardship approval covers
      (posted while the approval is in force, or open on the approval date and posted within the lookback before
      it) has a coverage_adjustment entry with adjustment_reason hardship_discount whose applied_to_entry_id is
      that charge.
    resolved_by: apply_hardship_discount_c60f16b6
    effect: >-
      The hardship-discount adjustment lowers the account's patient_balance by the discount, so the balance the
      deposit percentage is applied to (d_balance) falls by that amount.
  - problem: coverage_ext_prompt_pay_discount
    kind: value_input
    gate: d_balance
    form: state
    policy_source: >-
      The arrangement deposit is not worked out until every coinsurance charge that a payment made since the latest
      statement paid in full within the prompt-pay window carries its prompt-pay discount.
    condition: >-
      Every coinsurance coverage_patient_charge paid in full by a coverage_payment entry posted on or after the
      latest coverage_statement and no more than prompt_pay_window_days after it, on a class with prompt_pay_discount_pct
      above 0, has a coverage_adjustment entry with adjustment_reason prompt_pay_discount whose applied_to_entry_id
      is that charge.
    resolved_by: apply_prompt_pay_discount_12f1a0eb
    effect: >-
      The prompt-pay adjustment lowers the account's patient_balance by the discount, so the balance the deposit
      percentage is applied to (d_balance) falls by that amount.
  cross_category:
  - category: mobility
    as: history
    reads:
    - mobility_billing.service_from_date
    - mobility_billing.event_type
    note: >-
      Paid wheelchair rental months in the recent window count as an ongoing rental for the deposit settlement.
  - category: oxygen
    as: history
    reads:
    - oxygen_billing.service_from_date
    - oxygen_billing.event_type
    note: >-
      Paid oxygen equipment months in the recent window count as an ongoing rental for the deposit settlement.
  - category: pap
    as: history
    reads:
    - pap_billing.service_from_date
    - pap_billing.event_type
    note: >-
      Paid PAP rental months in the recent window count as an ongoing rental for the deposit settlement.
  compute:
  - d_balance: F('patient_balance')
  - d_last_payment_on: >-
      LATEST('coverage_ledger', 'posting_date', date_field='posting_date', event_type='coverage_payment')
  - d_history_pts: >-
      K('history_pts_both') if (F('payment_plan_status') == 'completed' and DAYS(d_last_payment_on, NOW) <= K('history_recent_days'))
      else (K('history_pts_one') if (F('payment_plan_status') == 'completed' or DAYS(d_last_payment_on, NOW) <=
      K('history_recent_days')) else 0)
  - d_hardship_in_force: >-
      0 if F('hardship_tier') == 'none' else (1 if MONTHS(F('hardship_approved_date'), NOW) < P('hardship_approval_valid_months')
      else 0)
  - d_hardship_pts: >-
      K('hardship_pts_deep') if (d_hardship_in_force == 1 and (F('hardship_tier') == 'full_100' or F('hardship_tier')
      == 'partial_75' or F('hardship_tier') == 'partial_50')) else (K('hardship_pts_light') if (d_hardship_in_force
      == 1 and F('hardship_tier') == 'partial_25') else 0)
  - d_year_charges: >-
      SUM('coverage_ledger', 'amount', within_months=MONTHS(F('benefit_year_start'), NOW) + 1, date_field='posting_date',
      event_type='coverage_patient_charge')
  - d_exposure_pts: >-
      K('exposure_pts_large') if d_year_charges >= K('exposure_large') else (K('exposure_pts_mid') if d_year_charges
      >= K('exposure_mid') else 0)
  - d_latest_cycle: >-
      LATEST('coverage_ledger', 'statement_cycle', date_field='posting_date', event_type='coverage_statement')
  - d_dunning_pts: >-
      K('cycle_pts_high') if d_latest_cycle >= K('cycle_high') else (K('cycle_pts_mid') if d_latest_cycle >= K('cycle_mid')
      else 0)
  - d_last_method: >-
      LATEST('coverage_ledger', 'payment_method', date_field='posting_date', event_type='coverage_payment')
  - d_bank_pts: >-
      K('bank_pts_ach') if d_last_method == 'ach' else (K('bank_pts_check') if d_last_method == 'check' else 0)
  - d_pct: >-
      K('deposit_pct_standard') + d_exposure_pts + d_dunning_pts - d_history_pts - d_hardship_pts - d_bank_pts
  - d_figured: RND(d_balance * d_pct / 100 + 0.000001, 2)
  - d_ongoing_rentals: >-
      (1 if XCOUNT('mobility', 'mobility_billing', within_months=K('rental_window_months'), date_field='service_from_date',
      event_type='mobility_rental_paid') > 0 else 0) + (1 if XCOUNT('oxygen', 'oxygen_billing', within_months=K('rental_window_months'),
      date_field='service_from_date', event_type='oxygen_rental_paid') > 0 else 0) + (1 if XCOUNT('pap', 'pap_billing',
      within_months=K('rental_window_months'), date_field='service_from_date', event_type='pap_rental_paid') > 0
      else 0)
  - d_settle_mode: >-
      K('mode_half') if d_ongoing_rentals >= 2 else (K('mode_three_quarter') if d_ongoing_rentals == 1 else K('mode_as_figured'))
  - d_deposit: >-
      float(int(d_figured * K('half_share'))) if d_settle_mode == K('mode_half') else (((int(d_figured * K('three_quarter_share')
      * K('quarters_per_dollar')) + (1 if d_figured * K('three_quarter_share') * K('quarters_per_dollar') > int(d_figured
      * K('three_quarter_share') * K('quarters_per_dollar')) else 0)) / K('quarters_per_dollar')) if d_settle_mode
      == K('mode_three_quarter') else d_figured)
  - result: RND(d_deposit, 2)
  compute_basis:
    d_balance: >-
      The figured arrangement deposit is the deposit percentage of the account's patient_balance at the time the
      deposit is figured, rounded to the cent half up, and the deposit the patient pays is that figured deposit.
    d_last_payment_on: >-
      Proven-payer points are taken off the deposit percentage according to two conditions, the account's payment_plan_status
      showing a completed arrangement and the latest patient-payment entry on the account having been posted no
      more than `history_recent_days` calendar days before the handling date: both met take off `history_pts_both`
      points, exactly one met takes off `history_pts_one` points, and neither takes off none.
    d_history_pts: >-
      Proven-payer points are taken off the deposit percentage according to two conditions, the account's payment_plan_status
      showing a completed arrangement and the latest patient-payment entry on the account having been posted no
      more than `history_recent_days` calendar days before the handling date: both met take off `history_pts_both`
      points, exactly one met takes off `history_pts_one` points, and neither takes off none.
    d_hardship_in_force: >-
      Hardship points are taken off the deposit percentage while the account's hardship approval is in force, that
      is while fewer than `hardship_approval_valid_months` whole calendar months have passed between hardship_approved_date
      and the handling date: a full_100, partial_75 or partial_50 tier takes off `hardship_pts_deep` points, a partial_25
      tier takes off `hardship_pts_light` points, and an account with no approval in force takes off none.
    d_hardship_pts: >-
      Hardship points are taken off the deposit percentage while the account's hardship approval is in force, that
      is while fewer than `hardship_approval_valid_months` whole calendar months have passed between hardship_approved_date
      and the handling date: a full_100, partial_75 or partial_50 tier takes off `hardship_pts_deep` points, a partial_25
      tier takes off `hardship_pts_light` points, and an account with no approval in force takes off none.
    d_year_charges: >-
      Exposure points are added to the deposit percentage according to the patient charges posted on the coverage
      account in the current benefit year, a charge counting when the whole calendar months between its posting
      date and the handling date do not exceed the whole calendar months between the record's benefit_year_start
      and the handling date: charges totalling at least `exposure_large` add `exposure_pts_large` points, at least
      `exposure_mid` but less than `exposure_large` add `exposure_pts_mid` points, and less than `exposure_mid`
      adds none.
    d_exposure_pts: >-
      Exposure points are added to the deposit percentage according to the patient charges posted on the coverage
      account in the current benefit year, a charge counting when the whole calendar months between its posting
      date and the handling date do not exceed the whole calendar months between the record's benefit_year_start
      and the handling date: charges totalling at least `exposure_large` add `exposure_pts_large` points, at least
      `exposure_mid` but less than `exposure_large` add `exposure_pts_mid` points, and less than `exposure_mid`
      adds none.
    d_latest_cycle: >-
      Dunning points are added to the deposit percentage according to the statement_cycle printed on the account's
      latest statement: a cycle of at least `cycle_high` adds `cycle_pts_high` points, at least `cycle_mid` but
      below `cycle_high` adds `cycle_pts_mid` points, and a lower cycle adds none.
    d_dunning_pts: >-
      Dunning points are added to the deposit percentage according to the statement_cycle printed on the account's
      latest statement: a cycle of at least `cycle_high` adds `cycle_pts_high` points, at least `cycle_mid` but
      below `cycle_high` adds `cycle_pts_mid` points, and a lower cycle adds none.
    d_last_method: >-
      Bank-payer points are taken off the deposit percentage according to how the latest patient-payment entry on
      the account was made: ach takes off `bank_pts_ach` points, check takes off `bank_pts_check` points, and any
      other method takes off none.
    d_bank_pts: >-
      Bank-payer points are taken off the deposit percentage according to how the latest patient-payment entry on
      the account was made: ach takes off `bank_pts_ach` points, check takes off `bank_pts_check` points, and any
      other method takes off none.
    d_pct: >-
      The exposure and dunning points are added to, and the proven-payer, hardship and bank-payer points taken off,
      `deposit_pct_standard` to give one deposit percentage, which is applied once to the account's patient_balance.
    d_figured: >-
      The figured arrangement deposit is the deposit percentage of the account's patient_balance at the time the
      deposit is figured, rounded to the cent half up, and the deposit the patient pays is that figured deposit.
    d_ongoing_rentals: >-
      The deposit the patient pays is settled from the figured deposit by the patient's ongoing monthly rentals,
      counting each of the wheelchair, oxygen and PAP device lines with a paid rental month whose service_from_date
      falls fewer than `rental_window_months` whole calendar months before the handling date: with two or more such
      rentals the deposit is half the figured deposit rounded down to a whole dollar; with exactly one such rental
      it is three quarters of the figured deposit rounded up to the next quarter dollar; with none it is the figured
      deposit as it stands.
    d_deposit: >-
      The deposit the patient pays is settled from the figured deposit by the patient's ongoing monthly rentals,
      counting each of the wheelchair, oxygen and PAP device lines with a paid rental month whose service_from_date
      falls fewer than `rental_window_months` whole calendar months before the handling date: with two or more such
      rentals the deposit is half the figured deposit rounded down to a whole dollar; with exactly one such rental
      it is three quarters of the figured deposit rounded up to the next quarter dollar; with none it is the figured
      deposit as it stands.
    result: >-
      For an arrangement deposit, and only for an arrangement deposit, the entry is posted for the exact amount
      the patient pays, with the payment_method the patient uses and, as payment_reference, the confirmation code
      the payment network issues for that deposit; every other patient payment remains under the base rule, posted
      for the exact amount paid with the payment_method used and the payment_reference the patient quotes copied
      verbatim.
    d_settle_mode: >-
      The deposit the patient pays is settled from the figured deposit by the patient's ongoing monthly rentals,
      counting each of the wheelchair, oxygen and PAP device lines with a paid rental month whose service_from_date
      falls fewer than `rental_window_months` whole calendar months before the handling date: with two or more such
      rentals the deposit is half the figured deposit rounded down to a whole dollar; with exactly one such rental
      it is three quarters of the figured deposit rounded up to the next quarter dollar; with none it is the figured
      deposit as it stands.
  factors:
  - id: deposit_proven_payer_points
    effect: parameter
    decides: d_history_pts
    bindings:
    - d_last_payment_on
    - d_history_pts
    ladder:
    - when: >-
        payment_plan_status shows a completed arrangement and the latest patient-payment entry was posted no more
        than `history_recent_days` days before the handling date
      value: K('history_pts_both')
    - when: exactly one of those two conditions holds
      value: K('history_pts_one')
    - when: otherwise
      value: '0'
    baseline:
      d_history_pts: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: deposit_hardship_points
    effect: parameter
    decides: d_hardship_pts
    bindings:
    - d_hardship_in_force
    - d_hardship_pts
    ladder:
    - when: approval in force on a full_100, partial_75 or partial_50 tier
      value: K('hardship_pts_deep')
    - when: approval in force on a partial_25 tier
      value: K('hardship_pts_light')
    - when: otherwise
      value: '0'
    baseline:
      d_hardship_pts: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: deposit_exposure_points
    effect: parameter
    decides: d_exposure_pts
    bindings:
    - d_year_charges
    - d_exposure_pts
    ladder:
    - when: patient charges posted in the current benefit year total at least `exposure_large`
      value: K('exposure_pts_large')
    - when: they total at least `exposure_mid` but less than `exposure_large`
      value: K('exposure_pts_mid')
    - when: otherwise
      value: '0'
    baseline:
      d_exposure_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: deposit_dunning_points
    effect: parameter
    decides: d_dunning_pts
    bindings:
    - d_latest_cycle
    - d_dunning_pts
    ladder:
    - when: the latest statement's statement_cycle is at least `cycle_high`
      value: K('cycle_pts_high')
    - when: it is at least `cycle_mid` but below `cycle_high`
      value: K('cycle_pts_mid')
    - when: otherwise
      value: '0'
    baseline:
      d_dunning_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: deposit_bank_payer_points
    effect: parameter
    decides: d_bank_pts
    bindings:
    - d_last_method
    - d_bank_pts
    ladder:
    - when: the latest patient-payment entry was made by ach
      value: K('bank_pts_ach')
    - when: it was made by check
      value: K('bank_pts_check')
    - when: otherwise
      value: '0'
    baseline:
      d_bank_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: deposit_rental_settlement
    effect: method
    decides: d_settle_mode
    bindings:
    - d_ongoing_rentals
    - d_settle_mode
    ladder:
    - when: >-
        two or more of the patient's wheelchair, oxygen and PAP device lines have a paid rental month whose service
        began fewer than `rental_window_months` months before the handling date
      method: half the figured deposit, rounded down to a whole dollar
    - when: exactly one such line
      method: three quarters of the figured deposit, rounded up to the next quarter dollar
    - when: otherwise
      method: the figured deposit as it stands, in cents
    baseline:
      d_settle_mode: K('mode_as_figured')
    evidence:
    - cross_category
    - history
    cross_difficulty: mobility
  baseline:
    rule: >-
      The figured arrangement deposit is the deposit percentage of the account's patient_balance at the time the
      deposit is figured, rounded to the cent half up, and the deposit the patient pays is that figured deposit.
      The deposit percentage is `deposit_pct_standard`.
    params:
    - deposit_pct_standard
  inputs:
    history:
    - table: coverage_ledger
      aggregate: latest
      field: posting_date
      filters:
        event_type: coverage_payment
    - table: coverage_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: coverage_patient_charge
    - table: coverage_ledger
      aggregate: latest
      field: statement_cycle
      filters:
        event_type: coverage_statement
    - category: mobility
      table: mobility_billing
      aggregate: count
      field: mobility_bill_id
      within_months: 2
      filters:
        event_type: mobility_rental_paid
    - category: oxygen
      table: oxygen_billing
      aggregate: count
      field: oxygen_bill_id
      within_months: 2
      filters:
        event_type: oxygen_rental_paid
    - category: pap
      table: pap_billing
      aggregate: count
      field: pap_bill_id
      within_months: 2
      filters:
        event_type: pap_rental_paid
    cross_category:
    - mobility
    - oxygen
    - pap
- id: coverage_ext_arrangement_installment
  base_policy_refs:
  - coverage_payment_plan
  overwrite:
  - base_policy: coverage_payment_plan
    superseded_clause: >-
      The installment is the larger of `payment_plan_min_monthly` and the balance divided by `payment_plan_max_months`,
      rounded to the cent half up; the patient may choose a larger installment but never a smaller one.
    replaced_by: >-
      The arrangement term is the core term plus the proven-arrangement, rental-load, coverage-loyalty, balance-size
      and payment-regularity months; for the installment of a new arrangement, and only for a new arrangement, the
      patient_balance is divided once by that whole term, and every other arrangement installment remains under
      the base rule, the larger of `payment_plan_min_monthly` and the balance divided by `payment_plan_max_months`,
      rounded to the cent half up, the patient free to choose a larger installment but never a smaller one, unless
      the rule for revising an arrangement already in force figures it.
  trigger: on_request
  subject:
  - coverage_payment_plan_set
  computes: monthly_amount
  target_tool: set_payment_arrangement_62cec67a
  params:
    proven_window_months: 36
    proven_months_recent: 2
    proven_months_older: 1
    rental_window_months: 2
    rental_months_two: 2
    rental_months_one: 1
    loyal_long_months: 60
    loyal_mid_months: 24
    loyal_months_long: 2
    loyal_months_mid: 1
    size_large_balance: 1000.0
    size_mid_balance: 400.0
    size_cycle: 3
    size_months_large: 2
    size_months_mid: 1
    regular_window_months: 12
    regular_high_count: 6
    regular_mid_count: 3
    regular_months_high: 2
    regular_months_mid: 1
  rule: >-
    A new monthly payment arrangement is set on a coverage account with no arrangement active, whose patient_balance
    is at least `payment_plan_min_balance`, once a payment_plan_agreement request for the account is approved; the
    installments fall due from the payment_plan_start_date the patient chooses, no later than one statement cycle
    after the agreement was approved. The monthly installment of a new arrangement is fixed only after the arrangement
    deposit stands on the account as a patient-payment entry posted on the day the arrangement is set. The monthly
    installment of a new arrangement is the account's patient_balance divided by the arrangement term in months,
    rounded to the cent half up, and never less than `payment_plan_min_monthly`; the patient may choose a larger
    installment but never a smaller one. The arrangement term is the class's `payment_plan_max_months`. The arrangement
    term is built on a core term set by the account's situation: for an account whose hardship approval is in force,
    the core term is the months still left in that approval, `hardship_approval_valid_months` less the whole calendar
    months between hardship_approved_date and the handling date; for an account with no approval in force whose
    patient holds a rental_active wheelchair, the core term is the rental months still left to ownership, the class's
    `capped_rental_months` less the wheelchair rental months the patient's records show paid in the wheelchair's
    current rental period (months whose service began no more whole calendar months before the handling date than
    its rental_period_start_date), net of any such month later reversed; for any other account the core term is
    the class's `payment_plan_max_months`. Proven-arrangement months are added to the core term: an account whose
    payment_plan_status shows a completed arrangement whose payment_plan_start_date falls no more than `proven_window_months`
    whole calendar months before the handling date adds `proven_months_recent` months; an account whose completed
    arrangement started more than `proven_window_months` whole calendar months before the handling date adds `proven_months_older`
    months; any other account adds none. Rental-load months are added according to the patient's ongoing monthly
    rentals, counting each of the wheelchair, oxygen and PAP device lines with a paid rental month whose service_from_date
    falls fewer than `rental_window_months` whole calendar months before the handling date: two or more such rentals
    add `rental_months_two` months, exactly one adds `rental_months_one` months, and none adds none. Coverage-loyalty
    months are added according to the whole calendar months between the coverage record's effective_date and the
    handling date: at least `loyal_long_months` add `loyal_months_long` months, at least `loyal_mid_months` but
    fewer than `loyal_long_months` add `loyal_months_mid` months, and fewer add none. Balance-size months are added
    according to the account's patient_balance together with the statement_cycle printed on its latest statement:
    a balance of at least `size_large_balance` on a cycle of at least `size_cycle` adds `size_months_large` months;
    a balance of at least `size_mid_balance` but below `size_large_balance` on a cycle of at least `size_cycle`
    adds `size_months_mid` months; any other account adds none. Payment-regularity months are added according to
    the patient-payment entries posted on the account fewer than `regular_window_months` whole calendar months before
    the handling date: at least `regular_high_count` entries add `regular_months_high` months, at least `regular_mid_count`
    but fewer than `regular_high_count` entries add `regular_months_mid` months, and fewer add none. The arrangement
    term is the core term plus the proven-arrangement, rental-load, coverage-loyalty, balance-size and payment-regularity
    months; for the installment of a new arrangement, and only for a new arrangement, the patient_balance is divided
    once by that whole term, and every other arrangement installment remains under the base rule, the larger of
    `payment_plan_min_monthly` and the balance divided by `payment_plan_max_months`, rounded to the cent half up,
    the patient free to choose a larger installment but never a smaller one, unless the rule for revising an arrangement
    already in force figures it.
  prerequisite:
  - problem: coverage_ext_arrangement_deposit
    kind: value_input
    gate: r_balance
    form: state
    policy_source: >-
      The monthly installment of a new arrangement is fixed only after the arrangement deposit stands on the account
      as a patient-payment entry posted on the day the arrangement is set.
    condition: >-
      The account carries a coverage_payment entry posted on the handling date for the arrangement deposit, applied
      to the account's oldest open charge.
    resolved_by: pay_arrangement_deposit_e794f585
    effect: >-
      The deposit payment lowers the account's patient_balance by the deposit amount, which lowers the balance the
      installment divides by the arrangement term (r_balance), and adds one patient-payment entry to the payment-regularity
      count.
  cross_category:
  - category: mobility
    as: history
    reads:
    - status
    - mobility_billing.service_from_date
    - mobility_billing.event_type
    note: >-
      An active wheelchair rental and its paid months set the core term when no hardship approval is in force, and
      recent paid wheelchair months count toward the rental-load months.
  - category: oxygen
    as: history
    reads:
    - oxygen_billing.service_from_date
    - oxygen_billing.event_type
    note: Recent paid oxygen equipment months count toward the rental-load months.
  - category: pap
    as: history
    reads:
    - pap_billing.service_from_date
    - pap_billing.event_type
    note: Recent paid PAP rental months count toward the rental-load months.
  compute:
  - r_balance: F('patient_balance')
  - r_hardship_months: >-
      P('hardship_approval_valid_months') if F('hardship_tier') == 'none' else MONTHS(F('hardship_approved_date'),
      NOW)
  - r_wheelchair_status: CFIELD('mobility', 'status', status='rental_active')
  - r_wheelchair_start: CFIELD('mobility', 'rental_period_start_date', status='rental_active')
  - r_wheelchair_paid_months: >-
      0 if not r_wheelchair_start else (XCOUNT('mobility', 'mobility_billing', within_months=MONTHS(r_wheelchair_start,
      NOW) + 1, date_field='service_from_date', event_type='mobility_rental_paid') - XCOUNT('mobility', 'mobility_billing',
      within_months=MONTHS(r_wheelchair_start, NOW) + 1, date_field='service_from_date', event_type='mobility_claim_reversal'))
  - r_core_term: >-
      (P('hardship_approval_valid_months') - r_hardship_months) if r_hardship_months < P('hardship_approval_valid_months')
      else ((P('capped_rental_months') - r_wheelchair_paid_months) if r_wheelchair_status == 'rental_active' else
      P('payment_plan_max_months'))
  - r_completed_start_months: >-
      MONTHS(F('payment_plan_start_date'), NOW) if F('payment_plan_status') == 'completed' else 0
  - r_proven_months: >-
      K('proven_months_recent') if (F('payment_plan_status') == 'completed' and r_completed_start_months <= K('proven_window_months'))
      else (K('proven_months_older') if (F('payment_plan_status') == 'completed' and r_completed_start_months >
      K('proven_window_months')) else 0)
  - r_ongoing_rentals: >-
      (1 if XCOUNT('mobility', 'mobility_billing', within_months=K('rental_window_months'), date_field='service_from_date',
      event_type='mobility_rental_paid') > 0 else 0) + (1 if XCOUNT('oxygen', 'oxygen_billing', within_months=K('rental_window_months'),
      date_field='service_from_date', event_type='oxygen_rental_paid') > 0 else 0) + (1 if XCOUNT('pap', 'pap_billing',
      within_months=K('rental_window_months'), date_field='service_from_date', event_type='pap_rental_paid') > 0
      else 0)
  - r_rental_months: >-
      K('rental_months_two') if r_ongoing_rentals >= 2 else (K('rental_months_one') if r_ongoing_rentals == 1 else
      0)
  - r_coverage_months: MONTHS(F('effective_date'), NOW)
  - r_loyal_months: >-
      K('loyal_months_long') if r_coverage_months >= K('loyal_long_months') else (K('loyal_months_mid') if r_coverage_months
      >= K('loyal_mid_months') else 0)
  - r_latest_cycle: >-
      LATEST('coverage_ledger', 'statement_cycle', date_field='posting_date', event_type='coverage_statement')
  - r_size_balance: F('patient_balance')
  - r_size_months: >-
      K('size_months_large') if (r_size_balance >= K('size_large_balance') and r_latest_cycle >= K('size_cycle'))
      else (K('size_months_mid') if (r_size_balance >= K('size_mid_balance') and r_latest_cycle >= K('size_cycle'))
      else 0)
  - r_payment_entries: >-
      COUNT('coverage_ledger', within_months=K('regular_window_months'), date_field='posting_date', event_type='coverage_payment')
  - r_regular_months: >-
      K('regular_months_high') if r_payment_entries >= K('regular_high_count') else (K('regular_months_mid') if
      r_payment_entries >= K('regular_mid_count') else 0)
  - r_term: >-
      r_core_term + r_proven_months + r_rental_months + r_loyal_months + r_size_months + r_regular_months
  - result: MX(P('payment_plan_min_monthly'), RND(r_balance / r_term + 0.000001, 2))
  compute_basis:
    r_balance: >-
      The monthly installment of a new arrangement is the account's patient_balance divided by the arrangement term
      in months, rounded to the cent half up, and never less than `payment_plan_min_monthly`; the patient may choose
      a larger installment but never a smaller one.
    r_hardship_months: >-
      The arrangement term is built on a core term set by the account's situation: for an account whose hardship
      approval is in force, the core term is the months still left in that approval, `hardship_approval_valid_months`
      less the whole calendar months between hardship_approved_date and the handling date; for an account with no
      approval in force whose patient holds a rental_active wheelchair, the core term is the rental months still
      left to ownership, the class's `capped_rental_months` less the wheelchair rental months the patient's records
      show paid in the wheelchair's current rental period (months whose service began no more whole calendar months
      before the handling date than its rental_period_start_date), net of any such month later reversed; for any
      other account the core term is the class's `payment_plan_max_months`.
    r_wheelchair_status: >-
      The arrangement term is built on a core term set by the account's situation: for an account whose hardship
      approval is in force, the core term is the months still left in that approval, `hardship_approval_valid_months`
      less the whole calendar months between hardship_approved_date and the handling date; for an account with no
      approval in force whose patient holds a rental_active wheelchair, the core term is the rental months still
