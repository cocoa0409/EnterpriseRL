- id: mobility_ext_caster_claim
  base_policy_refs:
  - mobility_repair_responsibility
  overwrite: []
  trigger: state_due
  subject:
  - mobility_repair
  computes: labor_units
  target_tool: record_caster_warranty_job_ad31669e
  params:
    cst_std_units: 2
    cst_repeat_days: 30
    cst_recent_days: 180
    cst_new_days: 14
    cst_mid_days: 60
    cst_new_units: 2
    cst_mid_units: 1
    cst_bench_units: 1
    cst_site_units: 2
    cst_rec_high_count: 3
    cst_rec_mid_count: 2
    cst_rec_high_units: 2
    cst_rec_mid_units: 1
    cst_shelf_days: 7
    cst_shelf_long_days: 21
    cst_shelf_units: 1
    cst_shelf_long_units: 2
  rule: 'Summit Ridge claims from the chair manufacturer the labor of every tire or caster replacement done under
    the manufacturer''s tire and caster warranty, in whole 15-minute units, and posts that claim on the repair job.
    The units claimed for a warranty caster replacement are the standard caster allowance of `cst_std_units` units.
    The caster allowance is worked out by a different method when a tire or caster replacement under the manufacturer''s
    warranty is already posted on the chair: when the latest such posting is no more than `cst_repeat_days` days
    before the day the caster claim is posted, the caster allowance is the standard caster allowance doubled, to
    pay for a fork and bearing inspection; when it is more than `cst_repeat_days` but no more than `cst_recent_days`
    days before, the caster allowance is the standard caster allowance plus one unit; with no such posting, or an
    older one, the standard caster allowance applies. An early-wear allowance is added to the caster allowance by
    the days from the chair''s delivery_date to the day the caster claim is posted: `cst_new_units` units for no
    more than `cst_new_days` days, `cst_mid_units` unit for more than `cst_new_days` but no more than `cst_mid_days`
    days, and nothing for a longer span. A wheel-bench allowance is added for where the caster work is done: `cst_bench_units`
    unit when a loaner chair has been delivered for the chair, `cst_site_units` units when no loaner chair has been
    delivered and its own delivery (its purchase or initial rental delivery, not a loaner delivery) was into the
    home with training, and nothing otherwise. A recurrence-review allowance is added to a caster claim by the number
    of repair_estimate requests on the chair: `cst_rec_high_units` units for `cst_rec_high_count` or more, `cst_rec_mid_units`
    unit for exactly `cst_rec_mid_count`, and nothing for fewer. A tire-settling allowance is added to a caster
    claim by the days from the chair''s order_date to its delivery_date: `cst_shelf_long_units` units for `cst_shelf_long_days`
    days or more, `cst_shelf_units` unit for at least `cst_shelf_days` but fewer than `cst_shelf_long_days` days,
    and nothing for fewer than `cst_shelf_days` days. The units claimed for a warranty caster replacement are the
    caster allowance and the four added allowances summed, a whole number.'
  prerequisite: []
  cross_category: []
  compute:
  - last_cst: LATEST('mobility_service', 'service_date', date_field='service_date', event_type='mobility_repair',
      repair_component='tires_casters', repair_coverage='manufacturer_warranty')
  - days_cst: DAYS(last_cst, NOW) if last_cst else 99999
  - cst_units: K('cst_std_units') * 2 if days_cst <= K('cst_repeat_days') else (K('cst_std_units') + 1 if days_cst
      <= K('cst_recent_days') else K('cst_std_units'))
  - cst_age: DAYS(F('delivery_date'), NOW)
  - wear_units: K('cst_new_units') if cst_age <= K('cst_new_days') else (K('cst_mid_units') if cst_age <= K('cst_mid_days')
      else 0)
  - cst_loaners: COUNT('mobility_service', event_type='mobility_delivery', delivery_purpose='loaner')
  - cst_home: COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='in_home_delivery_training',
      delivery_purpose='purchase_delivery') + COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='in_home_delivery_training',
      delivery_purpose='initial_rental_delivery')
  - bench_units: K('cst_bench_units') if cst_loaners >= 1 else (K('cst_site_units') if cst_home >= 1 else 0)
  - cst_reqs: COUNT('mobility_requests', request_type='repair_estimate')
  - recur_units: K('cst_rec_high_units') if cst_reqs >= K('cst_rec_high_count') else (K('cst_rec_mid_units') if
      cst_reqs == K('cst_rec_mid_count') else 0)
  - settle_days: DAYS(F('order_date'), F('delivery_date'))
  - settle_units: K('cst_shelf_long_units') if settle_days >= K('cst_shelf_long_days') else (K('cst_shelf_units')
      if settle_days >= K('cst_shelf_days') else 0)
  - result: cst_units + wear_units + bench_units + recur_units + settle_units
  compute_basis:
    last_cst: when a tire or caster replacement under the manufacturer's warranty is already posted on the chair
    days_cst: when the latest such posting is no more than `cst_repeat_days` days before the day the caster claim
      is posted
    cst_units: 'The caster allowance is worked out by a different method when a tire or caster replacement under
      the manufacturer''s warranty is already posted on the chair: when the latest such posting is no more than
      `cst_repeat_days` days before the day the caster claim is posted, the caster allowance is the standard caster
      allowance doubled, to pay for a fork and bearing inspection; when it is more than `cst_repeat_days` but no
      more than `cst_recent_days` days before, the caster allowance is the standard caster allowance plus one unit;
      with no such posting, or an older one, the standard caster allowance applies.'
    cst_age: by the days from the chair's delivery_date to the day the caster claim is posted
    wear_units: 'An early-wear allowance is added to the caster allowance by the days from the chair''s delivery_date
      to the day the caster claim is posted: `cst_new_units` units for no more than `cst_new_days` days, `cst_mid_units`
      unit for more than `cst_new_days` but no more than `cst_mid_days` days, and nothing for a longer span.'
    cst_loaners: '`cst_bench_units` unit when a loaner chair has been delivered for the chair'
    cst_home: '`cst_site_units` units when no loaner chair has been delivered and its own delivery (its purchase
      or initial rental delivery, not a loaner delivery) was into the home with training'
    bench_units: 'A wheel-bench allowance is added for where the caster work is done: `cst_bench_units` unit when
      a loaner chair has been delivered for the chair, `cst_site_units` units when no loaner chair has been delivered
      and its own delivery (its purchase or initial rental delivery, not a loaner delivery) was into the home with
      training, and nothing otherwise.'
    cst_reqs: by the number of repair_estimate requests on the chair
    recur_units: 'A recurrence-review allowance is added to a caster claim by the number of repair_estimate requests
      on the chair: `cst_rec_high_units` units for `cst_rec_high_count` or more, `cst_rec_mid_units` unit for exactly
      `cst_rec_mid_count`, and nothing for fewer.'
    settle_days: by the days from the chair's order_date to its delivery_date
    settle_units: 'A tire-settling allowance is added to a caster claim by the days from the chair''s order_date
      to its delivery_date: `cst_shelf_long_units` units for `cst_shelf_long_days` days or more, `cst_shelf_units`
      unit for at least `cst_shelf_days` but fewer than `cst_shelf_long_days` days, and nothing for fewer than `cst_shelf_days`
      days.'
    result: The units claimed for a warranty caster replacement are the caster allowance and the four added allowances
      summed, a whole number.
  factors:
  - id: fork_method
    effect: method
    decides: cst_units
    bindings:
    - last_cst
    - days_cst
    - cst_units
    ladder:
    - when: a warranty tire or caster posting no more than cst_repeat_days days before the posting day
      method: the standard caster allowance is doubled
    - when: the latest such posting more than cst_repeat_days but no more than cst_recent_days days before
      method: the standard caster allowance plus one unit
    - when: otherwise (no such posting, or an older one)
      method: the standard caster allowance as it stands
    baseline:
      cst_units: K('cst_std_units')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: early_wear
    effect: parameter
    decides: wear_units
    bindings:
    - cst_age
    - wear_units
    ladder:
    - when: no more than cst_new_days days from delivery_date
      value: K('cst_new_units')
    - when: more than cst_new_days but no more than cst_mid_days days
      value: K('cst_mid_units')
    - when: otherwise (a longer span)
      value: '0'
    baseline:
      wear_units: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: wheel_bench
    effect: parameter
    decides: bench_units
    bindings:
    - cst_loaners
    - cst_home
    - bench_units
    ladder:
    - when: a loaner chair has been delivered for the chair
      value: K('cst_bench_units')
    - when: no loaner delivered and the chair's own delivery was into the home with training
      value: K('cst_site_units')
    - when: otherwise
      value: '0'
    baseline:
      bench_units: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: recurrence_review
    effect: parameter
    decides: recur_units
    bindings:
    - cst_reqs
    - recur_units
    ladder:
    - when: cst_rec_high_count or more repair_estimate requests on the chair
      value: K('cst_rec_high_units')
    - when: exactly cst_rec_mid_count requests
      value: K('cst_rec_mid_units')
    - when: otherwise (fewer)
      value: '0'
    baseline:
      recur_units: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: tire_settling
    effect: parameter
    decides: settle_units
    bindings:
    - settle_days
    - settle_units
    ladder:
    - when: cst_shelf_long_days days or more from order_date to delivery_date
      value: K('cst_shelf_long_units')
    - when: at least cst_shelf_days but fewer than cst_shelf_long_days days
      value: K('cst_shelf_units')
    - when: otherwise (fewer than cst_shelf_days days)
      value: '0'
    baseline:
      settle_units: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: Summit Ridge claims from the chair manufacturer the labor of every tire or caster replacement done under
      the manufacturer's tire and caster warranty, in whole 15-minute units, and posts that claim on the repair
      job. The units claimed for a warranty caster replacement are the standard caster allowance of `cst_std_units`
      units.
    params:
    - cst_std_units
  inputs:
    history:
    - table: mobility_service
      aggregate: latest
      field: service_date
      filters:
        event_type: mobility_repair
        repair_component: tires_casters
        repair_coverage: manufacturer_warranty
    - table: mobility_requests
      aggregate: count
      field: mobility_request_id
      filters:
        request_type: repair_estimate
    cross_category: []
- id: mobility_ext_kept_chair_adjustment
  base_policy_refs:
  - mobility_self_pay
  overwrite:
  - base_policy: mobility_self_pay
    superseded_clause: The refund is the price less `self_pay_restocking_fee_pct` percent, rounded to the cent half
      up; the delivery fee is never refunded.
    replaced_by: For a cash-sale chair the patient keeps, which this policy governs, and only for such a chair,
      the price adjustment is the adjustment percentage of the price, plus the delivery fee returned, the day credit,
      the multi-service courtesy and the failure-timing credit, rounded to the cent half up, the adjustment percentage
      acting on the price alone and no restocking percentage being withheld because the chair does not come back;
      a refund of a self-pay sale that is neither the price adjustment under this rule nor the refund of a cash-sale
      chair given back remains under the base refund rule.
  - base_policy: mobility_self_pay
    superseded_clause: A self-pay chair is refunded only when it comes back unused and complete no later than `self_pay_return_window_days`
      after delivery, counting calendar days from the day after delivery_date with the boundary day included; a
      class with a window of 0 or that is `custom_configured` is never refunded.
    replaced_by: For a cash-sale chair the patient keeps, which this policy governs, and only for such a chair,
      a price adjustment is made without the chair coming back, and only while it is no more than `self_pay_return_window_days`
      after delivery, counting calendar days from the day after delivery_date with the boundary day included; a
      class with a window of 0 or that is `custom_configured` receives none; a self-pay chair that is neither kept
      by the patient under this rule nor given back under the refund rule for a cash-sale chair given back remains
      under the base return rule.
  trigger: on_request
  subject:
  - mobility_self_pay_refund
  computes: adjustment_amount
  target_tool: accept_chair_price_adjustment_610693ba
  params:
    adj_std_pct: 5
    adj_high_pct: 15
    adj_high_jobs: 2
    day_power: 13.42
    day_manual_home: 2.05
    day_manual_courier: 1.53
    ms_rental: 20
    ms_owned: 10
    ft_early_days: 7
    ft_mid_days: 21
    ft_early: 15
    ft_mid: 7.5
    adj_top_pct: 20
    adj_top_jobs: 3
    day_std: 1.0
  rule: 'When a patient keeps a wheelchair Summit Ridge sold for cash after it needed a warranty repair in its first
    weeks, Summit Ridge returns part of the price as a price adjustment, worked out on the day it is booked from
    the chair''s own sale line, service history and requests, and the patient accepts it in person. For a cash-sale
    chair the patient keeps, which this policy governs, and only for such a chair, a price adjustment is made without
    the chair coming back, and only while it is no more than `self_pay_return_window_days` after delivery, counting
    calendar days from the day after delivery_date with the boundary day included; a class with a window of 0 or
    that is `custom_configured` receives none; a self-pay chair that is neither kept by the patient under this rule
    nor given back under the refund rule for a cash-sale chair given back remains under the base return rule. Accepting
    a price adjustment uses the sale''s one refund, so a chair that has received one is not refunded if it is later
    given back. The price adjustment on a cash-sale chair the patient keeps is `adj_std_pct` percent of the price
    on its sale line plus a day credit of `day_std` for each day counted, the days running from the requested_date
    of the chair''s latest repair_estimate request to its decision_date (no days while that request is undecided
    or when the chair has none) and the day credit being that daily rate times those days, rounded to the cent half
    up; the adjustment is rounded to the cent half up and nothing else is added. The adjustment percentage depends
    on the repair jobs posted on the chair under the manufacturer''s warranty: `adj_top_pct` percent with `adj_top_jobs`
    or more such jobs, `adj_high_pct` percent with exactly `adj_high_jobs`, and the standard `adj_std_pct` percent
    with fewer. The delivery fee is returned by a different method according to how the repair was handled: when
    a loaner chair has been delivered for the chair, the delivery fee on the sale line is returned in full; when
    no loaner chair has been delivered and its own delivery (its purchase or initial rental delivery, not a loaner
    delivery) was made by courier, half the delivery fee is returned, rounded to the cent half up; otherwise no
    part of the delivery fee is returned. The days counted for the day credit run by a different method: when a
    loaner chair has been delivered for the chair and the chair has a repair_estimate request, from the requested_date
    of its latest repair_estimate request to the date of the latest loaner delivery, the days until a loaner chair
    reached the patient; when no loaner chair has been delivered and the chair''s latest repair_estimate request
    is undecided, from that request''s requested_date to the booking day, the days that repair has been open so
    far; otherwise from the latest repair_estimate request''s requested_date to its decision_date, the days that
    repair took (no days when the chair has no repair_estimate request). The daily rate of the day credit is set
    by the chair''s class and by how its own delivery (its purchase or initial rental delivery, not a loaner delivery)
    was made: `day_power` for a power chair, `day_manual_home` for a manual chair whose own delivery was into the
    home with training, `day_manual_courier` for a manual chair whose own delivery was by courier, and the standard
    `day_std` for a manual chair whose own delivery was made any other way. A multi-service courtesy is added when
    the patient also holds Summit Ridge sleep-therapy or oxygen equipment: `ms_rental` when the patient''s PAP record
    is rental_active or the patient''s oxygen record is rental_active; `ms_owned` when neither record is rental_active
    and the patient''s PAP record is patient_owned or the patient''s oxygen record is payment_cap_reached; and nothing
    otherwise. A failure-timing credit is added by the days from delivery_date to the requested_date of the chair''s
    latest repair_estimate request: `ft_early` for no more than `ft_early_days` days, `ft_mid` for more than `ft_early_days`
    but no more than `ft_mid_days` days, and nothing for a longer span or no such request. For a cash-sale chair
    the patient keeps, which this policy governs, and only for such a chair, the price adjustment is the adjustment
    percentage of the price, plus the delivery fee returned, the day credit, the multi-service courtesy and the
    failure-timing credit, rounded to the cent half up, the adjustment percentage acting on the price alone and
    no restocking percentage being withheld because the chair does not come back; a refund of a self-pay sale that
    is neither the price adjustment under this rule nor the refund of a cash-sale chair given back remains under
    the base refund rule. The price adjustment on a cash-sale chair the patient keeps is fixed only after the chair''s
    service history shows a tires and casters repair job under the manufacturer''s warranty for every tire or caster
    replacement completed on it.'
  prerequisite:
  - problem: mobility_ext_caster_claim
    kind: value_input
    gate: adj_pct
    form: state
    policy_source: The price adjustment on a cash-sale chair the patient keeps is fixed only after the chair's service
      history shows a tires and casters repair job under the manufacturer's warranty for every tire or caster replacement
      completed on it.
    condition: The chair's service history carries a mobility_repair row with repair_component tires_casters and
      repair_coverage manufacturer_warranty for every completed tire-or-caster repair_estimate request on the chair.
    resolved_by: record_caster_warranty_job_ad31669e
    effect: The posted caster job raises the count of warranty repair jobs on the chair, which moves the adjustment
      percentage to a higher tier.
  cross_category:
  - category: pap
    as: branch
    reads:
    - status
    note: The multi-service courtesy tier is decided by the status of the patient's PAP record.
  - category: oxygen
    as: branch
    reads:
    - status
    note: The multi-service courtesy tier is also decided by the status of the patient's oxygen record.
  compute:
  - adj_price: SUM('mobility_billing', 'sale_amount', event_type='mobility_self_pay_sale')
  - adj_fee: SUM('mobility_billing', 'fee_amount', event_type='mobility_self_pay_sale')
  - adj_jobs: COUNT('mobility_service', event_type='mobility_repair', repair_coverage='manufacturer_warranty')
  - adj_pct: K('adj_top_pct') if adj_jobs >= K('adj_top_jobs') else (K('adj_high_pct') if adj_jobs == K('adj_high_jobs')
      else K('adj_std_pct'))
  - fr_loaners: COUNT('mobility_service', event_type='mobility_delivery', delivery_purpose='loaner')
  - fr_courier: COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='courier', delivery_purpose='purchase_delivery')
      + COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='courier', delivery_purpose='initial_rental_delivery')
  - fee_ret: adj_fee if fr_loaners >= 1 else (int(adj_fee / 2 * 100 + 0.500001) / 100 if fr_courier >= 1 else 0)
  - da_req: LATEST('mobility_requests', 'requested_date', date_field='requested_date', request_type='repair_estimate')
  - da_dec: LATEST('mobility_requests', 'decision_date', date_field='requested_date', request_type='repair_estimate')
  - da_loaner: LATEST('mobility_service', 'service_date', date_field='service_date', event_type='mobility_delivery',
      delivery_purpose='loaner')
  - down_days: DAYS(da_req, da_loaner) if (da_req and da_loaner) else (DAYS(da_req, NOW) if (da_req and not da_dec)
      else (DAYS(da_req, da_dec) if da_req else 0))
  - dr_home: COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='in_home_delivery_training',
      delivery_purpose='purchase_delivery') + COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='in_home_delivery_training',
      delivery_purpose='initial_rental_delivery')
  - dr_courier: COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='courier', delivery_purpose='purchase_delivery')
      + COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='courier', delivery_purpose='initial_rental_delivery')
  - down_rate: K('day_power') if P('equipment_type') == 'power' else (K('day_manual_home') if dr_home >= 1 else
      (K('day_manual_courier') if dr_courier >= 1 else K('day_std')))
  - day_credit: int(down_rate * down_days * 100 + 0.500001) / 100
  - pap_st: CFIELD('pap', 'status')
  - ox_st: CFIELD('oxygen', 'status')
  - ms_amt: K('ms_rental') if (pap_st == 'rental_active' or ox_st == 'rental_active') else (K('ms_owned') if (pap_st
      == 'patient_owned' or ox_st == 'payment_cap_reached') else 0)
  - ft_req: LATEST('mobility_requests', 'requested_date', date_field='requested_date', request_type='repair_estimate')
  - ft_days: DAYS(F('delivery_date'), ft_req) if ft_req else 99999
  - ft_amt: K('ft_early') if ft_days <= K('ft_early_days') else (K('ft_mid') if ft_days <= K('ft_mid_days') else
      0)
  - result: int((adj_price * adj_pct / 100 + fee_ret + day_credit + ms_amt + ft_amt) * 100 + 0.500001) / 100
  compute_basis:
    adj_price: The price adjustment on a cash-sale chair the patient keeps is `adj_std_pct` percent of the price
      on its sale line plus a day credit of `day_std` for each day counted, the days running from the requested_date
      of the chair's latest repair_estimate request to its decision_date (no days while that request is undecided
      or when the chair has none) and the day credit being that daily rate times those days, rounded to the cent
      half up; the adjustment is rounded to the cent half up and nothing else is added.
    adj_fee: the delivery fee on the sale line is returned in full
    adj_jobs: The adjustment percentage depends on the repair jobs posted on the chair under the manufacturer's
      warranty
    adj_pct: 'The adjustment percentage depends on the repair jobs posted on the chair under the manufacturer''s
      warranty: `adj_top_pct` percent with `adj_top_jobs` or more such jobs, `adj_high_pct` percent with exactly
      `adj_high_jobs`, and the standard `adj_std_pct` percent with fewer.'
    fee_ret: 'The delivery fee is returned by a different method according to how the repair was handled: when a
      loaner chair has been delivered for the chair, the delivery fee on the sale line is returned in full; when
      no loaner chair has been delivered and its own delivery (its purchase or initial rental delivery, not a loaner
      delivery) was made by courier, half the delivery fee is returned, rounded to the cent half up; otherwise no
      part of the delivery fee is returned.'
    down_days: 'The days counted for the day credit run by a different method: when a loaner chair has been delivered
      for the chair and the chair has a repair_estimate request, from the requested_date of its latest repair_estimate
      request to the date of the latest loaner delivery, the days until a loaner chair reached the patient; when
      no loaner chair has been delivered and the chair''s latest repair_estimate request is undecided, from that
      request''s requested_date to the booking day, the days that repair has been open so far; otherwise from the
      latest repair_estimate request''s requested_date to its decision_date, the days that repair took (no days
      when the chair has no repair_estimate request).'
    down_rate: 'The daily rate of the day credit is set by the chair''s class and by how its own delivery (its purchase
      or initial rental delivery, not a loaner delivery) was made: `day_power` for a power chair, `day_manual_home`
      for a manual chair whose own delivery was into the home with training, `day_manual_courier` for a manual chair
      whose own delivery was by courier, and the standard `day_std` for a manual chair whose own delivery was made
      any other way.'
    day_credit: plus a day credit of `day_std` for each day counted, the days running from the requested_date of
      the chair's latest repair_estimate request to its decision_date (no days while that request is undecided or
      when the chair has none) and the day credit being that daily rate times those days, rounded to the cent half
      up
    pap_st: the patient's PAP record is rental_active
    ms_amt: 'A multi-service courtesy is added when the patient also holds Summit Ridge sleep-therapy or oxygen
      equipment: `ms_rental` when the patient''s PAP record is rental_active or the patient''s oxygen record is
      rental_active; `ms_owned` when neither record is rental_active and the patient''s PAP record is patient_owned
      or the patient''s oxygen record is payment_cap_reached; and nothing otherwise.'
    ft_days: by the days from delivery_date to the requested_date of the chair's latest repair_estimate request
    ft_amt: 'A failure-timing credit is added by the days from delivery_date to the requested_date of the chair''s
      latest repair_estimate request: `ft_early` for no more than `ft_early_days` days, `ft_mid` for more than `ft_early_days`
      but no more than `ft_mid_days` days, and nothing for a longer span or no such request.'
    result: For a cash-sale chair the patient keeps, which this policy governs, and only for such a chair, the price
      adjustment is the adjustment percentage of the price, plus the delivery fee returned, the day credit, the
      multi-service courtesy and the failure-timing credit, rounded to the cent half up, the adjustment percentage
      acting on the price alone and no restocking percentage being withheld because the chair does not come back;
      a refund of a self-pay sale that is neither the price adjustment under this rule nor the refund of a cash-sale
      chair given back remains under the base refund rule.
    ox_st: the patient's oxygen record is rental_active
    fr_loaners: when a loaner chair has been delivered for the chair, the delivery fee on the sale line is returned
      in full
    fr_courier: when no loaner chair has been delivered and its own delivery (its purchase or initial rental delivery,
      not a loaner delivery) was made by courier
    da_req: from the requested_date of its latest repair_estimate request to the date of the latest loaner delivery
    da_dec: otherwise from the latest repair_estimate request's requested_date to its decision_date, the days that
      repair took (no days when the chair has no repair_estimate request).
    da_loaner: to the date of the latest loaner delivery
    dr_home: '`day_manual_home` for a manual chair whose own delivery was into the home with training'
    dr_courier: '`day_manual_courier` for a manual chair whose own delivery was by courier'
    ft_req: by the days from delivery_date to the requested_date of the chair's latest repair_estimate request
  factors:
  - id: sev_tier
    effect: parameter
    decides: adj_pct
    bindings:
    - adj_jobs
    - adj_pct
    ladder:
    - when: adj_top_jobs or more repair jobs posted on the chair under the manufacturer's warranty
      value: K('adj_top_pct')
    - when: exactly adj_high_jobs such jobs
      value: K('adj_high_pct')
    - when: otherwise (fewer, the one warranty repair the adjustment presumes)
      value: K('adj_std_pct')
    baseline:
      adj_pct: K('adj_std_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: fee_return
    effect: method
    decides: fee_ret
    bindings:
    - fr_loaners
    - fr_courier
    - fee_ret
    ladder:
    - when: a loaner chair has been delivered for the chair
      method: the delivery fee on the sale line is returned in full
    - when: no loaner delivered and the chair's own delivery was by courier
      method: half the delivery fee, rounded half up
    - when: otherwise
      method: no part of the delivery fee is returned
    baseline:
      fee_ret: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: down_anchor
    effect: method
    decides: down_days
    bindings:
    - da_req
    - da_dec
    - da_loaner
    - down_days
    ladder:
    - when: a loaner chair has been delivered for the chair and the chair has a repair_estimate request
      method: days from the latest repair_estimate request's requested_date to the latest loaner delivery
    - when: no loaner delivered and the latest repair_estimate request is undecided
      method: days from that request's requested_date to the booking day
    - when: otherwise (no loaner, latest repair_estimate request decided; or no request)
      method: days from that request's requested_date to its decision_date (none without a request)
    baseline:
      down_days: DAYS(da_req, da_dec) if (da_req and da_dec) else 0
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: down_rate_tier
    effect: parameter
    decides: down_rate
    bindings:
    - dr_home
    - dr_courier
    - down_rate
    ladder:
    - when: a power chair
      value: K('day_power')
    - when: a manual chair whose own delivery was into the home with training
      value: K('day_manual_home')
    - when: a manual chair whose own delivery was by courier
      value: K('day_manual_courier')
    - when: otherwise (a manual chair whose own delivery was made any other way)
      value: K('day_std')
    baseline:
      down_rate: K('day_std')
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: multi_service
    effect: parameter
    decides: ms_amt
    bindings:
    - pap_st
    - ox_st
    - ms_amt
    ladder:
    - when: the patient's PAP record is rental_active or the patient's oxygen record is rental_active
      value: K('ms_rental')
    - when: neither is rental_active, and the PAP record is patient_owned or the oxygen record is payment_cap_reached
      value: K('ms_owned')
    - when: otherwise
      value: '0'
    baseline:
      ms_amt: '0'
    evidence:
    - cross_category
    cross_difficulty: pap
  - id: fail_timing
    effect: parameter
    decides: ft_amt
    bindings:
    - ft_req
    - ft_days
    - ft_amt
    ladder:
    - when: no more than ft_early_days days from delivery to the latest repair request
      value: K('ft_early')
    - when: more than ft_early_days but no more than ft_mid_days days
      value: K('ft_mid')
    - when: otherwise (longer, or no request)
      value: '0'
    baseline:
      ft_amt: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: When a patient keeps a wheelchair Summit Ridge sold for cash after it needed a warranty repair in its
      first weeks, Summit Ridge returns part of the price as a price adjustment, worked out on the day it is booked
      from the chair's own sale line, service history and requests, and the patient accepts it in person. The price
      adjustment on a cash-sale chair the patient keeps is `adj_std_pct` percent of the price on its sale line plus
      a day credit of `day_std` for each day counted, the days running from the requested_date of the chair's latest
      repair_estimate request to its decision_date (no days while that request is undecided or when the chair has
      none) and the day credit being that daily rate times those days, rounded to the cent half up; the adjustment
      is rounded to the cent half up and nothing else is added.
    params:
    - adj_std_pct
    - day_std
  inputs:
    history:
    - table: mobility_billing
      aggregate: sum
      field: sale_amount
      filters:
        event_type: mobility_self_pay_sale
    - table: mobility_service
      aggregate: count
      field: mobility_service_id
      filters:
        event_type: mobility_repair
        repair_coverage: manufacturer_warranty
    - table: mobility_requests
      aggregate: latest
      field: requested_date
      filters:
        request_type: repair_estimate
    cross_category:
    - pap
    - oxygen
