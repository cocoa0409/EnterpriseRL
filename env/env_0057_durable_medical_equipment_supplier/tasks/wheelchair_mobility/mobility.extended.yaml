  - mobility_repair_responsibility
  overwrite: []
  trigger: state_due
  subject:
  - mobility_repair
  computes: labor_units
  target_tool: record_battery_warranty_job_f5177195
  params:
    std_units: 2
    repeat_days: 30
    recent_days: 180
    new_short_days: 14
    new_long_days: 60
    new_short_units: 2
    new_long_units: 1
    site_units: 2
    liquid_units: 2
    poc_units: 1
    fault_high_count: 4
    fault_mid_count: 3
    fault_high_units: 2
    fault_mid_units: 1
    shelf_long_days: 21
    shelf_mid_days: 7
    shelf_long_units: 2
    shelf_mid_units: 1
    access_units: 3
  rule: 'Summit Ridge claims from the chair manufacturer the labor of every battery-set replacement done under the
    manufacturer''s battery warranty, in whole 15-minute units, and posts that claim on the repair job. The units
    claimed for a warranty battery-set replacement are the standard battery-set allowance of `std_units` units.
    The battery-set allowance is worked out by a different method when the chair''s service history already holds
    a battery replacement posted under the manufacturer''s warranty: when the latest such posting is no more than
    `repeat_days` days before the day the claim is posted, the allowance is the standard allowance doubled, to pay
    for a full charging-system diagnosis; when it is more than `repeat_days` but no more than `recent_days` days
    before, the allowance is the standard allowance plus one unit; when there is no such posting, or it is older
    than `recent_days` days, the standard allowance applies. A new-chair diagnostic allowance is added to the battery-set
    allowance by the days from the chair''s delivery_date to the day the claim is posted: `new_short_units` units
    for no more than `new_short_days` days, `new_long_units` unit for more than `new_short_days` but no more than
    `new_long_days` days, and nothing for a longer span. A battery-bay handling allowance is added by the chair''s
    loaner and home-assessment records: `access_units` units when no loaner chair has been delivered for the chair
    and two or more in-home accessibility assessments are recorded on it, `site_units` units when no loaner chair
    has been delivered for it and exactly one in-home accessibility assessment is recorded, and nothing in any other
    case. An oxygen-safety allowance is added to a battery-set claim when the patient''s oxygen record is rental_active
    or payment_cap_reached: `liquid_units` units when its portable equipment is a liquid oxygen portable (E0434),
    `poc_units` unit when it is a portable oxygen concentrator (E1392), and nothing for any other portable equipment
    or when there is no such oxygen record. A fault-review allowance is added to a battery-set claim by the number
    of repair_estimate requests on the chair: `fault_high_units` units for `fault_high_count` or more, `fault_mid_units`
    unit for exactly `fault_mid_count`, and nothing for fewer. A shelf-conditioning allowance is added to a battery-set
    claim by the days from the chair''s order_date to its delivery_date: `shelf_long_units` units for `shelf_long_days`
    days or more, `shelf_mid_units` unit for at least `shelf_mid_days` but fewer than `shelf_long_days` days, and
    nothing for fewer than `shelf_mid_days` days. The units claimed for a warranty battery-set replacement are the
    battery-set allowance and the five added allowances summed, a whole number.'
  prerequisite: []
  cross_category:
  - category: oxygen
    as: branch
    reads:
    - status
    - portable_hcpcs
    note: The oxygen-safety allowance tier is decided by the portable equipment class of the patient's oxygen record
      in rental.
  compute:
  - days_new: DAYS(F('delivery_date'), NOW)
  - last_set: LATEST('mobility_service', 'service_date', date_field='service_date', event_type='mobility_repair',
      repair_component='battery', repair_coverage='manufacturer_warranty')
  - days_set: DAYS(last_set, NOW) if last_set else 99999
  - set_units: K('std_units') * 2 if days_set <= K('repeat_days') else (K('std_units') + 1 if days_set <= K('recent_days')
      else K('std_units'))
  - new_units: K('new_short_units') if days_new <= K('new_short_days') else (K('new_long_units') if days_new <=
      K('new_long_days') else 0)
  - loaners: COUNT('mobility_service', event_type='mobility_delivery', delivery_purpose='loaner')
  - assess_n: COUNT('mobility_service', event_type='mobility_home_assessment')
  - bay_units: K('access_units') if (loaners == 0 and assess_n >= 2) else (K('site_units') if (loaners == 0 and
      assess_n == 1) else 0)
  - o2_a: CPARAM('oxygen', 'portable_hcpcs', status='rental_active')
  - o2_b: CPARAM('oxygen', 'portable_hcpcs', status='payment_cap_reached')
  - o2_port: o2_a if o2_a else o2_b
  - o2_units: K('liquid_units') if o2_port == 'E0434' else (K('poc_units') if o2_port == 'E1392' else 0)
  - faults: COUNT('mobility_requests', request_type='repair_estimate')
  - fault_units: K('fault_high_units') if faults >= K('fault_high_count') else (K('fault_mid_units') if faults ==
      K('fault_mid_count') else 0)
  - shelf_days: DAYS(F('order_date'), F('delivery_date'))
  - shelf_units: K('shelf_long_units') if shelf_days >= K('shelf_long_days') else (K('shelf_mid_units') if shelf_days
      >= K('shelf_mid_days') else 0)
  - result: set_units + new_units + bay_units + o2_units + fault_units + shelf_units
  compute_basis:
    days_new: A new-chair diagnostic allowance is added to the battery-set allowance by the days from the chair's
      delivery_date to the day the claim is posted
    last_set: the chair's service history already holds a battery replacement posted under the manufacturer's warranty
    days_set: when the latest such posting is no more than `repeat_days` days before the day the claim is posted
    set_units: 'The battery-set allowance is worked out by a different method when the chair''s service history
      already holds a battery replacement posted under the manufacturer''s warranty: when the latest such posting
      is no more than `repeat_days` days before the day the claim is posted, the allowance is the standard allowance
      doubled, to pay for a full charging-system diagnosis; when it is more than `repeat_days` but no more than
      `recent_days` days before, the allowance is the standard allowance plus one unit; when there is no such posting,
      or it is older than `recent_days` days, the standard allowance applies.'
    new_units: '`new_short_units` units for no more than `new_short_days` days, `new_long_units` unit for more than
      `new_short_days` but no more than `new_long_days` days, and nothing for a longer span.'
    loaners: when no loaner chair has been delivered for the chair
    bay_units: 'A battery-bay handling allowance is added by the chair''s loaner and home-assessment records: `access_units`
      units when no loaner chair has been delivered for the chair and two or more in-home accessibility assessments
      are recorded on it, `site_units` units when no loaner chair has been delivered for it and exactly one in-home
      accessibility assessment is recorded, and nothing in any other case.'
    o2_a: when the patient's oxygen record is rental_active or payment_cap_reached
    o2_b: when the patient's oxygen record is rental_active or payment_cap_reached
    o2_port: when the patient's oxygen record is rental_active or payment_cap_reached
    o2_units: 'An oxygen-safety allowance is added to a battery-set claim when the patient''s oxygen record is rental_active
      or payment_cap_reached: `liquid_units` units when its portable equipment is a liquid oxygen portable (E0434),
      `poc_units` unit when it is a portable oxygen concentrator (E1392), and nothing for any other portable equipment
      or when there is no such oxygen record.'
    faults: by the number of repair_estimate requests on the chair
    fault_units: 'A fault-review allowance is added to a battery-set claim by the number of repair_estimate requests
      on the chair: `fault_high_units` units for `fault_high_count` or more, `fault_mid_units` unit for exactly
      `fault_mid_count`, and nothing for fewer.'
    shelf_days: by the days from the chair's order_date to its delivery_date
    shelf_units: 'A shelf-conditioning allowance is added to a battery-set claim by the days from the chair''s order_date
      to its delivery_date: `shelf_long_units` units for `shelf_long_days` days or more, `shelf_mid_units` unit
      for at least `shelf_mid_days` but fewer than `shelf_long_days` days, and nothing for fewer than `shelf_mid_days`
      days.'
    result: The units claimed for a warranty battery-set replacement are the battery-set allowance and the five
      added allowances summed, a whole number.
    assess_n: two or more in-home accessibility assessments are recorded on it
  factors:
  - id: set_method
    effect: method
    decides: set_units
    bindings:
    - last_set
    - days_set
    - set_units
    ladder:
    - when: the latest battery replacement posted under the manufacturer's warranty is no more than repeat_days
        days before the posting day
      method: the standard battery-set allowance is doubled
    - when: the latest such posting is more than repeat_days but no more than recent_days days before the posting
        day
      method: the standard battery-set allowance plus one unit
    - when: otherwise (no such posting, or older than recent_days days)
      method: the standard battery-set allowance as it stands
    baseline:
      set_units: K('std_units')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: new_unit_window
    effect: parameter
    decides: new_units
    bindings:
    - days_new
    - new_units
    ladder:
    - when: no more than new_short_days days from delivery_date to the posting day
      value: K('new_short_units')
    - when: more than new_short_days but no more than new_long_days days
      value: K('new_long_units')
    - when: otherwise (more than new_long_days days)
      value: '0'
    baseline:
      new_units: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: bay_handling
    effect: parameter
    decides: bay_units
    bindings:
    - loaners
    - assess_n
    - bay_units
    ladder:
    - when: no loaner chair delivered for the chair and two or more in-home accessibility assessments recorded
      value: K('access_units')
    - when: no loaner chair delivered and exactly one in-home accessibility assessment recorded
      value: K('site_units')
    - when: otherwise (for example a loaner chair has been delivered for the chair)
      value: '0'
    baseline:
      bay_units: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: o2_safety
    effect: parameter
    decides: o2_units
    bindings:
    - o2_a
    - o2_b
    - o2_port
    - o2_units
    ladder:
    - when: an oxygen record in rental_active or payment_cap_reached whose portable equipment is E0434
      value: K('liquid_units')
    - when: an oxygen record in rental_active or payment_cap_reached whose portable equipment is E1392
      value: K('poc_units')
    - when: otherwise
      value: '0'
    baseline:
      o2_units: '0'
    evidence:
    - cross_category
    cross_difficulty: oxygen
  - id: fault_review
    effect: parameter
    decides: fault_units
    bindings:
    - faults
    - fault_units
    ladder:
    - when: fault_high_count or more repair_estimate requests on the chair
      value: K('fault_high_units')
    - when: exactly fault_mid_count repair_estimate requests
      value: K('fault_mid_units')
    - when: otherwise (fewer)
      value: '0'
    baseline:
      fault_units: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: shelf_conditioning
    effect: parameter
    decides: shelf_units
    bindings:
    - shelf_days
    - shelf_units
    ladder:
    - when: shelf_long_days days or more from order_date to delivery_date
      value: K('shelf_long_units')
    - when: at least shelf_mid_days but fewer than shelf_long_days days
      value: K('shelf_mid_units')
    - when: otherwise (fewer than shelf_mid_days days)
      value: '0'
    baseline:
      shelf_units: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: Summit Ridge claims from the chair manufacturer the labor of every battery-set replacement done under
      the manufacturer's battery warranty, in whole 15-minute units, and posts that claim on the repair job. The
      units claimed for a warranty battery-set replacement are the standard battery-set allowance of `std_units`
      units.
    params:
    - std_units
  inputs:
    history:
    - table: mobility_service
      aggregate: latest
      field: service_date
      filters:
        event_type: mobility_repair
        repair_component: battery
        repair_coverage: manufacturer_warranty
    - table: mobility_requests
      aggregate: count
      field: mobility_request_id
      filters:
        request_type: repair_estimate
    - table: mobility_service
      aggregate: count
      field: mobility_service_id
      filters:
        event_type: mobility_delivery
        delivery_purpose: loaner
    - table: mobility_service
      aggregate: count
      field: mobility_service_id
      filters:
        event_type: mobility_home_assessment
    cross_category:
    - oxygen
- id: mobility_ext_controller_claim
  base_policy_refs:
