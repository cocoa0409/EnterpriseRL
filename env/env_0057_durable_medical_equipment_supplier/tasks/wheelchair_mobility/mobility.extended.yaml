  - ctl_age: DAYS(F('delivery_date'), NOW)
  - first_units: K('ctl_new_units') if ctl_age <= K('ctl_new_days') else (K('ctl_mid_units') if ctl_age <= K('ctl_mid_days')
      else 0)
  - ctl_loaners: COUNT('mobility_service', event_type='mobility_delivery', delivery_purpose='loaner')
  - ctl_assess: COUNT('mobility_service', event_type='mobility_home_assessment')
  - ctl_place: K('ctl_access_units') if (ctl_loaners == 0 and ctl_assess >= 2) else (K('ctl_site_units') if (ctl_loaners
      == 0 and ctl_assess == 1) else 0)
  - aux_a: CPARAM('oxygen', 'portable_hcpcs', status='rental_active')
  - aux_b: CPARAM('oxygen', 'portable_hcpcs', status='payment_cap_reached')
  - aux_port: aux_a if aux_a else aux_b
  - aux_units: K('aux_poc_units') if aux_port == 'E1392' else (K('aux_liquid_units') if aux_port == 'E0434' else
      0)
  - result: ctl_units + first_units + ctl_place + aux_units
