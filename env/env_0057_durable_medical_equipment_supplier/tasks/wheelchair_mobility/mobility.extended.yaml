- id: mobility_ext_drive_unit_claim
  base_policy_refs:
  - mobility_repair_responsibility
  overwrite: []
  trigger: state_due
  subject:
  - mobility_repair
  computes: labor_units
  target_tool: record_drive_warranty_job_9fda7dd9
  params:
    drv_std_units: 5
    pair_days: 14
    align_days: 90
    align_units: 2
    drv_site_units: 1
    mount_poc_units: 1
    mount_carrier_units: 2
    lemon_high_count: 4
    lemon_mid_count: 3
    lemon_high_units: 2
    lemon_mid_units: 1
    drv_access_units: 2
  rule: 'Summit Ridge claims from the chair manufacturer the labor of every drive motor or gearbox replacement done
    under the manufacturer''s motor warranty, in whole 15-minute units, and posts that claim on the repair job.
    The units claimed for a warranty drive-unit replacement are the standard drive-unit allowance of `drv_std_units`
    units. The drive-unit allowance is worked out by a different method by the days from the chair''s delivery_date
    to the day the drive-unit claim is posted: for no more than `pair_days` days the manufacturer''s early-failure
    teardown of the whole drive train applies and the allowance is the standard drive-unit allowance doubled; for
    more than `pair_days` but no more than `align_days` days the allowance is the standard drive-unit allowance
    plus `align_units` units for aligning the opposite gearbox; for a longer span the standard drive-unit allowance
    applies. A drive-base handling allowance is added by the chair''s loaner and home-assessment records: `drv_access_units`
    units when no loaner chair has been delivered for the chair and two or more in-home accessibility assessments
    are recorded on it, `drv_site_units` unit when no loaner chair has been delivered for it and exactly one in-home
    accessibility assessment is recorded, and nothing in any other case. A mount-removal allowance is added to a
    drive-unit claim when the patient''s oxygen record is rental_active or payment_cap_reached: `mount_poc_units`
    unit when its portable equipment is a portable oxygen concentrator (E1392), `mount_carrier_units` units when
    it is a cylinder, home-fill or liquid portable (E0431, K0738 or E0434), and nothing when there is no such oxygen
    record or no portable equipment. A lemon-review allowance is added to a drive-unit claim by the number of repair_estimate
    requests on the chair: `lemon_high_units` units for `lemon_high_count` or more, `lemon_mid_units` unit for exactly
    `lemon_mid_count`, and nothing for fewer. The units claimed for a warranty drive-unit replacement are the drive-unit
    allowance and the three added allowances summed, a whole number.'
  prerequisite: []
  cross_category:
  - category: oxygen
    as: branch
    reads:
    - status
    - portable_hcpcs
    note: The mount-removal allowance tier is decided by the portable equipment class of the patient's oxygen record
      in rental.
  compute:
  - drv_age: DAYS(F('delivery_date'), NOW)
  - drv_units: K('drv_std_units') * 2 if drv_age <= K('pair_days') else (K('drv_std_units') + K('align_units') if
      drv_age <= K('align_days') else K('drv_std_units'))
  - drv_loaners: COUNT('mobility_service', event_type='mobility_delivery', delivery_purpose='loaner')
  - drv_assess: COUNT('mobility_service', event_type='mobility_home_assessment')
  - drv_place: K('drv_access_units') if (drv_loaners == 0 and drv_assess >= 2) else (K('drv_site_units') if (drv_loaners
      == 0 and drv_assess == 1) else 0)
  - mount_a: CPARAM('oxygen', 'portable_hcpcs', status='rental_active')
  - mount_b: CPARAM('oxygen', 'portable_hcpcs', status='payment_cap_reached')
  - mount_port: mount_a if mount_a else mount_b
  - mount_units: K('mount_poc_units') if mount_port == 'E1392' else (K('mount_carrier_units') if (mount_port ==
      'E0431' or mount_port == 'K0738' or mount_port == 'E0434') else 0)
  - lemon_reqs: COUNT('mobility_requests', request_type='repair_estimate')
  - lemon_units: K('lemon_high_units') if lemon_reqs >= K('lemon_high_count') else (K('lemon_mid_units') if lemon_reqs
      == K('lemon_mid_count') else 0)
  - result: drv_units + drv_place + mount_units + lemon_units
  compute_basis:
    drv_age: by the days from the chair's delivery_date to the day the drive-unit claim is posted
    drv_units: 'The drive-unit allowance is worked out by a different method by the days from the chair''s delivery_date
      to the day the drive-unit claim is posted: for no more than `pair_days` days the manufacturer''s early-failure
      teardown of the whole drive train applies and the allowance is the standard drive-unit allowance doubled;
      for more than `pair_days` but no more than `align_days` days the allowance is the standard drive-unit allowance
      plus `align_units` units for aligning the opposite gearbox; for a longer span the standard drive-unit allowance
      applies.'
    drv_loaners: when no loaner chair has been delivered for the chair
    drv_place: 'A drive-base handling allowance is added by the chair''s loaner and home-assessment records: `drv_access_units`
      units when no loaner chair has been delivered for the chair and two or more in-home accessibility assessments
      are recorded on it, `drv_site_units` unit when no loaner chair has been delivered for it and exactly one in-home
      accessibility assessment is recorded, and nothing in any other case.'
    mount_a: when the patient's oxygen record is rental_active or payment_cap_reached
    mount_b: when the patient's oxygen record is rental_active or payment_cap_reached
    mount_port: when the patient's oxygen record is rental_active or payment_cap_reached
    mount_units: 'A mount-removal allowance is added to a drive-unit claim when the patient''s oxygen record is
      rental_active or payment_cap_reached: `mount_poc_units` unit when its portable equipment is a portable oxygen
      concentrator (E1392), `mount_carrier_units` units when it is a cylinder, home-fill or liquid portable (E0431,
      K0738 or E0434), and nothing when there is no such oxygen record or no portable equipment.'
    lemon_reqs: by the number of repair_estimate requests on the chair
    lemon_units: 'A lemon-review allowance is added to a drive-unit claim by the number of repair_estimate requests
      on the chair: `lemon_high_units` units for `lemon_high_count` or more, `lemon_mid_units` unit for exactly
      `lemon_mid_count`, and nothing for fewer.'
    result: The units claimed for a warranty drive-unit replacement are the drive-unit allowance and the three added
      allowances summed, a whole number.
    drv_assess: two or more in-home accessibility assessments are recorded on it
  factors:
  - id: pair_method
    effect: method
    decides: drv_units
    bindings:
    - drv_age
    - drv_units
    ladder:
    - when: no more than pair_days days from delivery_date to the posting day
      method: 'early-failure teardown of the drive train: the standard drive-unit allowance doubled'
    - when: more than pair_days but no more than align_days days
      method: the standard drive-unit allowance plus align_units units for aligning the opposite gearbox
    - when: otherwise (a longer span)
      method: the standard drive-unit allowance as it stands
    baseline:
      drv_units: K('drv_std_units')
    evidence:
    - date
    cross_difficulty: null
  - id: base_handling
    effect: parameter
    decides: drv_place
    bindings:
    - drv_loaners
    - drv_assess
    - drv_place
    ladder:
    - when: no loaner chair delivered for the chair and two or more in-home accessibility assessments recorded
      value: K('drv_access_units')
    - when: no loaner chair delivered and exactly one in-home accessibility assessment recorded
      value: K('drv_site_units')
    - when: otherwise (for example a loaner chair has been delivered for the chair)
      value: '0'
    baseline:
      drv_place: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: mount_removal
    effect: parameter
    decides: mount_units
    bindings:
    - mount_a
    - mount_b
    - mount_port
    - mount_units
    ladder:
    - when: an oxygen record in rental_active or payment_cap_reached whose portable equipment is E1392
      value: K('mount_poc_units')
    - when: an oxygen record in rental_active or payment_cap_reached whose portable equipment is E0431, K0738 or
        E0434
      value: K('mount_carrier_units')
    - when: otherwise
      value: '0'
    baseline:
      mount_units: '0'
    evidence:
    - cross_category
    cross_difficulty: oxygen
  - id: lemon_review
    effect: parameter
    decides: lemon_units
    bindings:
    - lemon_reqs
    - lemon_units
    ladder:
    - when: lemon_high_count or more repair_estimate requests on the chair
      value: K('lemon_high_units')
    - when: exactly lemon_mid_count repair_estimate requests
      value: K('lemon_mid_units')
    - when: otherwise (fewer)
      value: '0'
    baseline:
      lemon_units: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: Summit Ridge claims from the chair manufacturer the labor of every drive motor or gearbox replacement
      done under the manufacturer's motor warranty, in whole 15-minute units, and posts that claim on the repair
      job. The units claimed for a warranty drive-unit replacement are the standard drive-unit allowance of `drv_std_units`
      units.
    params:
    - drv_std_units
  inputs:
    history:
    - table: mobility_requests
      aggregate: count
      field: mobility_request_id
      filters:
        request_type: repair_estimate
    - table: mobility_service
      aggregate: count
      field: mobility_service_id
      filters:
        event_type: mobility_delivery
        delivery_purpose: loaner
    - table: mobility_service
      aggregate: count
      field: mobility_service_id
      filters:
        event_type: mobility_home_assessment
    cross_category:
    - oxygen
- id: mobility_ext_cash_chair_refund
  base_policy_refs:
  - mobility_self_pay
  overwrite:
  - base_policy: mobility_self_pay
    superseded_clause: The refund is the price less `self_pay_restocking_fee_pct` percent, rounded to the cent half
      up; the delivery fee is never refunded.
    replaced_by: For a cash-sale chair given back, which this policy governs, and only for such a chair, the refund
      is the price less the restocking percentage of the price, plus the delivery fee refunded, less the use charge,
      the assessment fee and the mount fee, rounded to the cent half up, the restocking percentage acting on the
      price alone; a refund of a self-pay sale that is neither the refund of a chair given back under this rule
      nor the price adjustment on a cash-sale chair the patient keeps remains under the base refund rule.
  - base_policy: mobility_self_pay
    superseded_clause: A self-pay chair is refunded only when it comes back unused and complete no later than `self_pay_return_window_days`
      after delivery, counting calendar days from the day after delivery_date with the boundary day included; a
      class with a window of 0 or that is `custom_configured` is never refunded.
    replaced_by: For a cash-sale chair given back, which this policy governs, and only for such a chair, the chair
      is refunded only when it comes back complete, used or not, no later than `self_pay_return_window_days` after
      delivery, counting calendar days from the day after delivery_date with the boundary day included; a class
      with a window of 0 or that is `custom_configured` is never refunded; a self-pay chair that is neither given
      back under this rule nor kept by the patient under the price-adjustment rule for a cash-sale chair the patient
      keeps remains under the base return rule.
  trigger: on_request
  subject:
  - mobility_self_pay_refund
  computes: refund_amount
  target_tool: confirm_chair_return_refund_d347f359
  params:
    jobs_high: 4
    jobs_mid: 3
    jobs_low: 2
    rate_mid: 5
    rate_low: 10
    early_days: 7
    grace_days: 3
    rate_manual_home: 2.05
    assess_two_fee: 125
    assess_one_fee: 75
    mount_poc_fee: 85
    mount_carrier_fee: 35
    rate_power: 13.42
    rate_manual_courier: 1.53
    std_day_rate: 1.0
  rule: 'When a patient gives back a wheelchair Summit Ridge sold for cash, the refund is worked out on the day
    it is booked from the chair''s own sale line, service history and requests, and the patient confirms the return
    and the refund in person. A cash-sale chair is the patient''s own and is never picked up: it comes back when
    the patient brings it to a branch, where its return_pickup request is approved on the day it is checked in complete.
    For a cash-sale chair given back, which this policy governs, and only for such a chair, the chair is refunded
    only when it comes back complete, used or not, no later than `self_pay_return_window_days` after delivery, counting
    calendar days from the day after delivery_date with the boundary day included; a class with a window of 0 or
    that is `custom_configured` is never refunded; a self-pay chair that is neither given back under this rule nor
    kept by the patient under the price-adjustment rule for a cash-sale chair the patient keeps remains under the
    base return rule. The refund on a cash-sale chair given back is the price on its sale line less `self_pay_restocking_fee_pct`
    percent of that price, less a use charge of `std_day_rate` for each day of use beyond the first `grace_days`
    days, the days of use running from delivery_date to the decision_date of the chair''s latest return_pickup request
    (the booking day when it has none) and the use charge being that daily rate times those days, rounded to the
    cent half up; the refund is rounded to the cent half up and the delivery fee on the sale line is not refunded.
    The restocking percentage depends on the repair jobs posted on the chair under the manufacturer''s warranty:
    with `jobs_high` or more such jobs no restocking is withheld; with exactly `jobs_mid` the restocking percentage
    is `rate_mid` percent; with exactly `jobs_low` it is `rate_low` percent; with fewer the class''s `self_pay_restocking_fee_pct`
    percent applies. The delivery fee is treated by a different method when at least one joystick-and-controller
    or motor-and-gearbox job is posted on the chair under the manufacturer''s warranty: when the return was requested
    no more than `early_days` days after delivery_date, the delivery fee on the sale line is refunded in full; when
    it was requested later, the delivery fee is refunded in proportion to the return-window days left, as the fee
    times the class''s `self_pay_return_window_days` less the days to the return request, divided by `self_pay_return_window_days`,
    rounded to the cent half up; without such a job the delivery fee is not refunded. The days to the return request
    run from delivery_date to the requested_date of the chair''s latest return_pickup request, or to the booking
    day when there is none. The days of use of a cash-sale chair given back are counted by a different method according
    to its repair history: when a loaner chair has been delivered for the chair, from delivery_date to the requested_date
    of its latest return_pickup request (the booking day when it has none), less the days from the requested_date
    to the decision_date of its latest repair_estimate request (no days when that request has no decision date or
    the chair has none); when no loaner chair has been delivered and the chair has a repair_estimate request, from
    delivery_date to the requested_date of its latest repair_estimate request, the day its latest fault was reported,
    so that no use is charged after the chair''s latest failure; otherwise from delivery_date to the decision_date
    of its latest return_pickup request (the booking day when it has none), the day the chair was checked in at
    the branch. The daily rate of the use charge is set by the chair''s class and by how its own delivery (its purchase
    or initial rental delivery, not a loaner delivery) was made: `rate_power` for a power chair, `rate_manual_home`
    for a manual chair whose own delivery was into the home with training, `rate_manual_courier` for a manual chair
    whose own delivery was by courier, and the standard `std_day_rate` for a manual chair whose own delivery was
    made any other way. An assessment fee is withheld for the in-home accessibility assessments recorded on the
    chair: `assess_two_fee` for two or more, `assess_one_fee` for one, and nothing for none. A portable-oxygen mount
    fee is withheld when the patient''s oxygen record is rental_active or payment_cap_reached: `mount_poc_fee` when
    its portable equipment is a portable oxygen concentrator (E1392), `mount_carrier_fee` when it is a cylinder,
    home-fill or liquid portable (E0431, K0738 or E0434), and nothing when there is no such oxygen record or no
    portable equipment. For a cash-sale chair given back, which this policy governs, and only for such a chair,
    the refund is the price less the restocking percentage of the price, plus the delivery fee refunded, less the
    use charge, the assessment fee and the mount fee, rounded to the cent half up, the restocking percentage acting
    on the price alone; a refund of a self-pay sale that is neither the refund of a chair given back under this
    rule nor the price adjustment on a cash-sale chair the patient keeps remains under the base refund rule. The
    refund on a cash-sale chair given back is fixed only after the chair''s service history shows a battery repair
    job under the manufacturer''s warranty for every battery-set replacement completed on it. The refund on a cash-sale
    chair given back is not fixed until the chair''s service history shows a joystick and controller repair job
    under the manufacturer''s warranty for every controller replacement completed on it. Before the refund on a
    cash-sale chair given back is fixed, the chair''s service history must show a motor and gearbox repair job under
    the manufacturer''s warranty for every drive-unit replacement completed on it.'
  prerequisite:
  - problem: mobility_ext_battery_set_claim
    kind: value_input
    gate: restock_pct
    form: state
    policy_source: The refund on a cash-sale chair given back is fixed only after the chair's service history shows
      a battery repair job under the manufacturer's warranty for every battery-set replacement completed on it.
    condition: The chair's service history carries a mobility_repair row with repair_component battery and repair_coverage
      manufacturer_warranty for every completed battery-set repair_estimate request on the chair.
    resolved_by: record_battery_warranty_job_f5177195
    effect: The posted battery-set job raises the count of warranty repair jobs on the chair, which moves the restocking
      percentage to a lower tier.
  - problem: mobility_ext_controller_claim
    kind: value_input
    gate: restock_pct
    form: state
    policy_source: The refund on a cash-sale chair given back is not fixed until the chair's service history shows
      a joystick and controller repair job under the manufacturer's warranty for every controller replacement completed
      on it.
    condition: The chair's service history carries a mobility_repair row with repair_component joystick_controller
      and repair_coverage manufacturer_warranty for every completed controller repair_estimate request on the chair.
    resolved_by: record_controller_warranty_job_4540982f
    effect: The posted controller job raises the count of warranty repair jobs on the chair (a lower restocking
      tier) and is a drive-system job for the delivery-fee method.
  - problem: mobility_ext_drive_unit_claim
    kind: value_input
    gate: restock_pct
    form: state
    policy_source: Before the refund on a cash-sale chair given back is fixed, the chair's service history must
      show a motor and gearbox repair job under the manufacturer's warranty for every drive-unit replacement completed
      on it.
    condition: The chair's service history carries a mobility_repair row with repair_component motor_gearbox and
      repair_coverage manufacturer_warranty for every completed drive-unit repair_estimate request on the chair.
    resolved_by: record_drive_warranty_job_9fda7dd9
    effect: The posted drive-unit job raises the count of warranty repair jobs on the chair (a lower restocking
      tier) and is a drive-system job for the delivery-fee method.
  cross_category:
  - category: oxygen
    as: branch
    reads:
    - status
    - portable_hcpcs
    note: The portable-oxygen mount fee tier is decided by the portable equipment class of the patient's oxygen
      record in rental.
  compute:
  - price: SUM('mobility_billing', 'sale_amount', event_type='mobility_self_pay_sale')
  - fee_paid: SUM('mobility_billing', 'fee_amount', event_type='mobility_self_pay_sale')
  - wjobs: COUNT('mobility_service', event_type='mobility_repair', repair_coverage='manufacturer_warranty')
  - restock_pct: 0 if wjobs >= K('jobs_high') else (K('rate_mid') if wjobs == K('jobs_mid') else (K('rate_low')
      if wjobs == K('jobs_low') else P('self_pay_restocking_fee_pct')))
  - fs_ret_req: LATEST('mobility_requests', 'requested_date', date_field='requested_date', request_type='return_pickup')
  - drive_jobs: COUNT('mobility_service', event_type='mobility_repair', repair_component='joystick_controller',
      repair_coverage='manufacturer_warranty') + COUNT('mobility_service', event_type='mobility_repair', repair_component='motor_gearbox',
      repair_coverage='manufacturer_warranty')
  - req_days: DAYS(F('delivery_date'), fs_ret_req) if fs_ret_req else DAYS(F('delivery_date'), NOW)
  - fee_back: fee_paid if (drive_jobs >= 1 and req_days <= K('early_days')) else (int(fee_paid * (P('self_pay_return_window_days')
      - req_days) / P('self_pay_return_window_days') * 100 + 0.500001) / 100 if (drive_jobs >= 1 and req_days >
      K('early_days')) else 0)
  - base_ret_dec: LATEST('mobility_requests', 'decision_date', date_field='requested_date', request_type='return_pickup')
  - ua_ret_req: LATEST('mobility_requests', 'requested_date', date_field='requested_date', request_type='return_pickup')
  - ref_loaner: LATEST('mobility_service', 'service_date', date_field='service_date', event_type='mobility_delivery',
      delivery_purpose='loaner')
  - rep_req: LATEST('mobility_requests', 'requested_date', date_field='requested_date', request_type='repair_estimate')
  - rep_dec: LATEST('mobility_requests', 'decision_date', date_field='requested_date', request_type='repair_estimate')
  - use_days: (DAYS(F('delivery_date'), ua_ret_req) if ua_ret_req else DAYS(F('delivery_date'), NOW)) - (DAYS(rep_req,
      rep_dec) if (rep_req and rep_dec) else 0) if ref_loaner else (DAYS(F('delivery_date'), rep_req) if rep_req
      else (DAYS(F('delivery_date'), base_ret_dec) if base_ret_dec else DAYS(F('delivery_date'), NOW)))
  - rate_home: COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='in_home_delivery_training',
      delivery_purpose='purchase_delivery') + COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='in_home_delivery_training',
      delivery_purpose='initial_rental_delivery')
  - rate_courier: COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='courier', delivery_purpose='purchase_delivery')
      + COUNT('mobility_service', event_type='mobility_delivery', delivery_mode='courier', delivery_purpose='initial_rental_delivery')
  - day_rate: K('rate_power') if P('equipment_type') == 'power' else (K('rate_manual_home') if rate_home >= 1 else
      (K('rate_manual_courier') if rate_courier >= 1 else K('std_day_rate')))
  - use_charge: int(day_rate * MX(0, use_days - K('grace_days')) * 100 + 0.500001) / 100
  - assessed: COUNT('mobility_service', event_type='mobility_home_assessment')
  - assess_fee: K('assess_two_fee') if assessed >= 2 else (K('assess_one_fee') if assessed == 1 else 0)
  - mnt_a: CPARAM('oxygen', 'portable_hcpcs', status='rental_active')
  - mnt_b: CPARAM('oxygen', 'portable_hcpcs', status='payment_cap_reached')
  - mnt_port: mnt_a if mnt_a else mnt_b
  - mount_fee: K('mount_poc_fee') if mnt_port == 'E1392' else (K('mount_carrier_fee') if (mnt_port == 'E0431' or
      mnt_port == 'K0738' or mnt_port == 'E0434') else 0)
  - result: int((price * (100 - restock_pct) / 100 + fee_back - use_charge - assess_fee - mount_fee) * 100 + 0.500001)
      / 100
  compute_basis:
    fee_paid: the delivery fee on the sale line is refunded in full
    wjobs: The restocking percentage depends on the repair jobs posted on the chair under the manufacturer's warranty
    restock_pct: 'The restocking percentage depends on the repair jobs posted on the chair under the manufacturer''s
      warranty: with `jobs_high` or more such jobs no restocking is withheld; with exactly `jobs_mid` the restocking
      percentage is `rate_mid` percent; with exactly `jobs_low` it is `rate_low` percent; with fewer the class''s
      `self_pay_restocking_fee_pct` percent applies.'
    drive_jobs: when at least one joystick-and-controller or motor-and-gearbox job is posted on the chair under
      the manufacturer's warranty
    req_days: The days to the return request run from delivery_date to the requested_date of the chair's latest
      return_pickup request, or to the booking day when there is none.
    fee_back: 'The delivery fee is treated by a different method when at least one joystick-and-controller or motor-and-gearbox
      job is posted on the chair under the manufacturer''s warranty: when the return was requested no more than
      `early_days` days after delivery_date, the delivery fee on the sale line is refunded in full; when it was
      requested later, the delivery fee is refunded in proportion to the return-window days left, as the fee times
      the class''s `self_pay_return_window_days` less the days to the return request, divided by `self_pay_return_window_days`,
      rounded to the cent half up; without such a job the delivery fee is not refunded.'
    use_days: 'The days of use of a cash-sale chair given back are counted by a different method according to its
      repair history: when a loaner chair has been delivered for the chair, from delivery_date to the requested_date
      of its latest return_pickup request (the booking day when it has none), less the days from the requested_date
      to the decision_date of its latest repair_estimate request (no days when that request has no decision date
      or the chair has none); when no loaner chair has been delivered and the chair has a repair_estimate request,
      from delivery_date to the requested_date of its latest repair_estimate request, the day its latest fault was
      reported, so that no use is charged after the chair''s latest failure; otherwise from delivery_date to the
      decision_date of its latest return_pickup request (the booking day when it has none), the day the chair was
      checked in at the branch.'
    day_rate: 'The daily rate of the use charge is set by the chair''s class and by how its own delivery (its purchase
      or initial rental delivery, not a loaner delivery) was made: `rate_power` for a power chair, `rate_manual_home`
      for a manual chair whose own delivery was into the home with training, `rate_manual_courier` for a manual
      chair whose own delivery was by courier, and the standard `std_day_rate` for a manual chair whose own delivery
      was made any other way.'
    use_charge: less a use charge of `std_day_rate` for each day of use beyond the first `grace_days` days, the
      days of use running from delivery_date to the decision_date of the chair's latest return_pickup request (the
      booking day when it has none) and the use charge being that daily rate times those days, rounded to the cent
      half up
    assessed: An assessment fee is withheld for the in-home accessibility assessments recorded on the chair
    assess_fee: 'An assessment fee is withheld for the in-home accessibility assessments recorded on the chair:
      `assess_two_fee` for two or more, `assess_one_fee` for one, and nothing for none.'
    mnt_a: when the patient's oxygen record is rental_active or payment_cap_reached
    mnt_b: when the patient's oxygen record is rental_active or payment_cap_reached
    mnt_port: when the patient's oxygen record is rental_active or payment_cap_reached
    mount_fee: 'A portable-oxygen mount fee is withheld when the patient''s oxygen record is rental_active or payment_cap_reached:
      `mount_poc_fee` when its portable equipment is a portable oxygen concentrator (E1392), `mount_carrier_fee`
      when it is a cylinder, home-fill or liquid portable (E0431, K0738 or E0434), and nothing when there is no
      such oxygen record or no portable equipment.'
    result: For a cash-sale chair given back, which this policy governs, and only for such a chair, the refund is
      the price less the restocking percentage of the price, plus the delivery fee refunded, less the use charge,
      the assessment fee and the mount fee, rounded to the cent half up, the restocking percentage acting on the
      price alone; a refund of a self-pay sale that is neither the refund of a chair given back under this rule
      nor the price adjustment on a cash-sale chair the patient keeps remains under the base refund rule.
    ref_loaner: when a loaner chair has been delivered for the chair
    rep_req: the requested_date of its latest repair_estimate request
    rep_dec: less the days from the requested_date to the decision_date of its latest repair_estimate request (no
      days when that request has no decision date or the chair has none)
    price: The refund on a cash-sale chair given back is the price on its sale line less `self_pay_restocking_fee_pct`
      percent of that price, less a use charge of `std_day_rate` for each day of use beyond the first `grace_days`
      days, the days of use running from delivery_date to the decision_date of the chair's latest return_pickup
      request (the booking day when it has none) and the use charge being that daily rate times those days, rounded
      to the cent half up; the refund is rounded to the cent half up and the delivery fee on the sale line is not
      refunded.
    fs_ret_req: The days to the return request run from delivery_date to the requested_date of the chair's latest
      return_pickup request, or to the booking day when there is none.
    base_ret_dec: the days of use running from delivery_date to the decision_date of the chair's latest return_pickup
      request (the booking day when it has none)
    ua_ret_req: from delivery_date to the requested_date of its latest return_pickup request (the booking day when
      it has none)
    rate_home: '`rate_manual_home` for a manual chair whose own delivery was into the home with training'
    rate_courier: '`rate_manual_courier` for a manual chair whose own delivery was by courier'
  factors:
  - id: restock_ladder
    effect: parameter
    decides: restock_pct
    bindings:
    - wjobs
    - restock_pct
    ladder:
    - when: jobs_high or more repair jobs posted on the chair under the manufacturer's warranty
      value: '0'
    - when: exactly jobs_mid such jobs
      value: K('rate_mid')
    - when: exactly jobs_low such jobs
      value: K('rate_low')
    - when: otherwise (fewer)
      value: P('self_pay_restocking_fee_pct')
    baseline:
      restock_pct: P('self_pay_restocking_fee_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: fee_share
    effect: method
    decides: fee_back
    bindings:
    - fs_ret_req
    - drive_jobs
    - req_days
    - fee_back
    ladder:
    - when: a warranty joystick-and-controller or motor-and-gearbox job is posted and the return was requested no
        more than early_days days after delivery
      method: the delivery fee on the sale line is refunded in full
    - when: such a job is posted and the return was requested more than early_days days after delivery
      method: the fee times the window days left over the window days, rounded half up
    - when: otherwise (no such job)
      method: the delivery fee is not refunded
    baseline:
      fee_back: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: use_anchor
    effect: method
    decides: use_days
    bindings:
    - ua_ret_req
    - ref_loaner
    - rep_req
    - rep_dec
    - use_days
    ladder:
    - when: a loaner chair has been delivered for the chair
      method: days from delivery_date to the latest return request's requested_date, less the days from the latest
        repair_estimate request's requested_date to its decision_date
    - when: no loaner chair delivered and the chair has a repair_estimate request
      method: days from delivery_date to the requested_date of the latest repair_estimate request
    - when: otherwise (no repair_estimate request)
      method: days from delivery_date to the latest return request's decision_date (the booking day when it has
        none)
    baseline:
      use_days: DAYS(F('delivery_date'), base_ret_dec) if base_ret_dec else DAYS(F('delivery_date'), NOW)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: day_rate_tier
    effect: parameter
    decides: day_rate
    bindings:
    - rate_home
    - rate_courier
    - day_rate
    ladder:
    - when: a power chair
      value: K('rate_power')
    - when: a manual chair whose own delivery was into the home with training
      value: K('rate_manual_home')
    - when: a manual chair whose own delivery was by courier
      value: K('rate_manual_courier')
    - when: otherwise (a manual chair whose own delivery was made any other way)
      value: K('std_day_rate')
    baseline:
      day_rate: K('std_day_rate')
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: assess_withhold
    effect: parameter
    decides: assess_fee
    bindings:
    - assessed
    - assess_fee
    ladder:
    - when: two or more in-home accessibility assessments recorded on the chair
      value: K('assess_two_fee')
    - when: exactly one
      value: K('assess_one_fee')
    - when: otherwise (none)
      value: '0'
    baseline:
      assess_fee: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: o2_mount_fee
    effect: parameter
    decides: mount_fee
    bindings:
    - mnt_a
    - mnt_b
    - mnt_port
    - mount_fee
    ladder:
    - when: an oxygen record in rental_active or payment_cap_reached whose portable equipment is E1392
      value: K('mount_poc_fee')
    - when: an oxygen record in rental_active or payment_cap_reached whose portable equipment is E0431, K0738 or
        E0434
      value: K('mount_carrier_fee')
    - when: otherwise
      value: '0'
    baseline:
      mount_fee: '0'
    evidence:
    - cross_category
    cross_difficulty: oxygen
  baseline:
    rule: When a patient gives back a wheelchair Summit Ridge sold for cash, the refund is worked out on the day
      it is booked from the chair's own sale line, service history and requests, and the patient confirms the return
      and the refund in person. The refund on a cash-sale chair given back is the price on its sale line less `self_pay_restocking_fee_pct`
      percent of that price, less a use charge of `std_day_rate` for each day of use beyond the first `grace_days`
      days, the days of use running from delivery_date to the decision_date of the chair's latest return_pickup
      request (the booking day when it has none) and the use charge being that daily rate times those days, rounded
      to the cent half up; the refund is rounded to the cent half up and the delivery fee on the sale line is not
      refunded.
    params:
    - self_pay_restocking_fee_pct
    - std_day_rate
    - grace_days
  inputs:
    history:
    - table: mobility_billing
      aggregate: sum
      field: sale_amount
      filters:
        event_type: mobility_self_pay_sale
    - table: mobility_service
      aggregate: count
      field: mobility_service_id
      filters:
