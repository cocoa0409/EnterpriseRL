# Policy charter: Mobility Equipment (category key: mobility)
# A mobility holding is one wheelchair order through its life: qualification and authorization,
# delivery, capped rental months or a first-month purchase, upgrades the patient pays for, repairs,
# and return or replacement.

category: mobility
display_name: Mobility Equipment

binding:
  holding_table: mobility_holdings
  event_tables: [mobility_billing, mobility_service]
  intake_tables: [mobility_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [order_received, rental_active, suspended, patient_owned, returned, cancelled, replaced]
  transitions:
    - {from: order_received, to: rental_active, by: agent, means: "The chair is delivered under a capped rental; rental month 1 starts."}
    - {from: order_received, to: patient_owned, by: agent, means: "The chair is delivered as a purchase (self-pay sale, or a purchase election made before delivery)."}
    - {from: order_received, to: cancelled, by: user, means: "The patient declines the chair before delivery."}
    - {from: rental_active, to: patient_owned, by: user, means: "The patient elects the first-month purchase option on a class that offers it."}
    - {from: rental_active, to: patient_owned, by: system, means: "The last capped rental month is paid and title passes to the patient."}
    - {from: rental_active, to: suspended, by: agent, means: "The patient is admitted to a hospital or skilled nursing facility and rental billing pauses."}
    - {from: suspended, to: rental_active, by: agent, means: "The patient is home again and rental billing resumes."}
    - {from: rental_active, to: returned, by: user, means: "The patient gives the rented chair back."}
    - {from: suspended, to: returned, by: user, means: "The patient gives the rented chair back during a suspension."}
    - {from: patient_owned, to: replaced, by: agent, means: "A replacement chair is ordered for an owned chair."}

accounts:
  - key: rental_months
    unit: rental months
    meaning: Paid capped-rental months of the chair counting toward ownership in the current rental period; a reversal takes one back.

parameter_schema:
  hcpcs_code: "HCPCS code of the chair class (string)"
  equipment_type: "Manual or power chair (enum: manual, power)"
  coverage_criteria_code: "Coverage criteria set the patient must meet (enum: mobility_limitation, lightweight_need, high_strength_need, full_time_ultralight, power_need, complex_rehab_power)"
  frame_weight_class: "Frame weight band of the class as defined by its code (string)"
  patient_weight_capacity_lbs: "Highest patient weight the class is rated for (pounds)"
  min_speed_mph: "Minimum top speed the power base must reach for the code (mph); 0 for manual chairs"
  min_range_miles: "Minimum range on one charge for the code (miles); 0 for manual chairs"
  power_seating_option: "Whether the class accepts a power seating option such as tilt (boolean)"
  fee_schedule_purchase_price: "Summit Ridge fee-schedule purchase amount of the class, the basis of rental fees, upgrade differences and repair-versus-replace (USD)"
  rental_fee_months_1_3: "Fee-schedule rental amount for each of rental months 1 through 3 (USD per month)"
  rental_fee_months_4_13: "Fee-schedule rental amount for each rental month from month 4 on (USD per month)"
  rental_month_anchor: "Rule fixing each rental month's service_from_date (enum: delivery_date_anniversary)"
  first_month_purchase_option: "Whether the patient may elect to buy the chair outright in the first rental month instead of renting (boolean)"
  purchase_election_window_days: "Calendar days after delivery within which the purchase election must be received (days); 0 when no purchase option"
  f2f_lookback_days: "Calendar days before the order date within which the face-to-face mobility examination must have taken place (days); 0 when not required"
  specialty_eval_required: "Whether a PT/OT or physiatrist specialty seating evaluation is required (boolean)"
  atp_involvement_required: "Whether a RESNA-certified Assistive Technology Professional must take part in the selection (boolean)"
  home_assessment_required: "Whether an in-home accessibility assessment showing the home accessible is required before delivery (boolean)"
  class_prior_auth_eligible: "Whether the class falls under the coverage's power-mobility prior-authorization requirement (boolean)"
  rx_validity_months: "Calendar months a written order stays usable to deliver the chair (months)"
  delivery_lead_business_days: "Business days from a complete order (and any affirmed authorization) to delivery (days)"
  in_home_delivery_training_required: "Whether delivery must be in the home with user training (boolean)"
  reasonable_useful_lifetime_months: "Reasonable useful lifetime counted from delivery_date, before which coverage does not replace the chair for age (calendar months)"
  frame_warranty_months: "Manufacturer frame warranty counted from delivery_date (calendar months)"
  electronics_warranty_months: "Manufacturer warranty on the joystick, controller and wiring counted from delivery_date (calendar months); 0 for manual chairs"
  motor_warranty_months: "Manufacturer warranty on motors and gearboxes counted from delivery_date (calendar months); 0 for manual chairs"
  battery_warranty_months: "Manufacturer warranty on batteries counted from delivery_date or the last battery replacement (calendar months); 0 for manual chairs"
  tire_caster_warranty_months: "Manufacturer warranty on tires and casters counted from delivery_date (calendar months)"
  battery_replacement_min_months: "Shortest interval between coverage-billed battery replacements outside warranty (calendar months); 0 for manual chairs"
  repair_labor_rate_per_unit: "Labor rate per 15-minute unit on a repair of an owned chair (K0739) (USD)"
  repair_cost_replace_threshold_pct: "Repair cost, as a percentage of fee_schedule_purchase_price, above which the chair is replaced instead of repaired (percent)"
  repair_assessment_business_days: "Business days within which a technician assesses a reported fault on an owned chair (days)"
  rental_swap_business_days: "Business days within which a malfunctioning rented chair is repaired or swapped (days)"
  loaner_during_owned_repair: "Whether a loaner chair is issued while an owned chair is out for repair (boolean)"
  upgrade_permitted: "Whether the patient may elect this class as an upgrade over a lower covered class and pay the difference (boolean)"
  upgrade_notice_required: "Whether a signed notice is required before an upgrade difference can be billed to the patient (boolean)"
  break_in_need_days: "Days of a break in need, beyond the days left in the rental month it began, after which a new rental period starts (days)"
  new_period_requirements: "What a new rental period after a long break needs (enum: new_order, new_order_and_f2f)"
  payer_entry_requalification: "What a rental needs when a new primary coverage starts paying (enum: new_order, new_order_and_eval, new_order_and_f2f)"
  pickup_lead_business_days: "Business days after a confirmed return within which the chair is picked up (days)"
  unreturned_equipment_days: "Calendar days after the confirmed pickup date after which a rented chair still not recovered is charged (days)"
  unreturned_equipment_charge: "Charge for a rented chair not recovered (USD)"
  damage_fee_beyond_wear: "Charge for a rented chair recovered damaged beyond normal wear (USD)"
  custom_configured: "Whether the chair is configured to the patient's measurements and cannot be resold (boolean)"
  self_pay_retail_price: "Cash price of the class sold outright to a self-pay patient (USD)"
  self_pay_delivery_fee: "Non-refundable delivery fee on a self-pay sale (USD)"
  self_pay_return_window_days: "Calendar days after delivery within which a self-pay chair may be returned for a refund (days); 0 when not returnable"
  self_pay_restocking_fee_pct: "Restocking fee withheld on a self-pay return (percent)"
  replacement_for_condition_change: "Whether a documented change in medical condition allows replacement before the end of the useful lifetime (boolean)"
  lost_stolen_report_required: "Whether replacement for loss or theft before the end of the useful lifetime requires a police, fire or insurance report (boolean)"

