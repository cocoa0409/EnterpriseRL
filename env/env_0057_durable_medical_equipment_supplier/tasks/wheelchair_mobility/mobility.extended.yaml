      concentrator (E1392), `aux_liquid_units` unit when it is a liquid oxygen portable (E0434), and nothing for
      any other portable equipment or when there is no such oxygen record.'
    result: The units claimed for a warranty controller replacement are the controller allowance and the three added
      allowances summed, a whole number.
    ctl_reqs: by the number of repair_estimate requests on the chair
    ctl_assess: two or more in-home accessibility assessments are recorded on it
  factors:
  - id: harness_method
    effect: method
    decides: ctl_units
    bindings:
