      `harness_mid_count` requests it is the standard controller allowance plus one unit; with fewer the standard
      controller allowance applies.'
    ctl_age: by the days from the chair's delivery_date to the day the controller claim is posted
    first_units: 'A first-weeks diagnostic allowance is added to the controller allowance by the days from the chair''s
      delivery_date to the day the controller claim is posted: `ctl_new_units` units for no more than `ctl_new_days`
      days, `ctl_mid_units` unit for more than `ctl_new_days` but no more than `ctl_mid_days` days, and nothing
      for a longer span.'
    ctl_loaners: when no loaner chair has been delivered for the chair
    ctl_place: 'A controller handling allowance is added by the chair''s loaner and home-assessment records: `ctl_access_units`
      units when no loaner chair has been delivered for the chair and two or more in-home accessibility assessments
      are recorded on it, `ctl_site_units` units when no loaner chair has been delivered for it and exactly one
