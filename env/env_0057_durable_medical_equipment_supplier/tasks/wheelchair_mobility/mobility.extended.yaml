  computes: labor_units
  target_tool: record_controller_warranty_job_4540982f
  params:
    ctl_std_units: 3
    harness_high_count: 3
    harness_mid_count: 2
    ctl_new_days: 14
    ctl_mid_days: 90
    ctl_new_units: 2
    ctl_mid_units: 1
    ctl_site_units: 2
    aux_poc_units: 2
    aux_liquid_units: 1
    ctl_access_units: 3
  rule: 'Summit Ridge claims from the chair manufacturer the labor of every joystick or controller replacement done
    under the manufacturer''s electronics warranty, in whole 15-minute units, and posts that claim on the repair
    job. The units claimed for a warranty controller replacement are the standard controller allowance of `ctl_std_units`
    units. The controller allowance is worked out by a different method by the number of repair_estimate requests
    on the chair: with `harness_high_count` or more requests the controller allowance is the standard controller
    allowance doubled, to pay for a full wiring-harness and charger diagnosis of a repeat-fault chair; with exactly
    `harness_mid_count` requests it is the standard controller allowance plus one unit; with fewer the standard
    controller allowance applies. A first-weeks diagnostic allowance is added to the controller allowance by the
    days from the chair''s delivery_date to the day the controller claim is posted: `ctl_new_units` units for no
    more than `ctl_new_days` days, `ctl_mid_units` unit for more than `ctl_new_days` but no more than `ctl_mid_days`
