name: env_0058_home_warranty_company
company: Bridgewell Home Warranty

background: |
  Bridgewell Home Warranty is a national home warranty company headquartered in Columbus, Ohio, that sells and administers service contracts covering the repair and replacement of home systems and appliances in 46 states.
  About 1.4 million households hold a Bridgewell contract, and service is delivered through a network of roughly 16,000 independent licensed contractors in heating and cooling, plumbing, electrical, appliance, garage door, pool, septic, well, roofing, locksmith and utility line trades.
  The customer care center speaks in a plain, steady and courteous voice, and it serves homeowners, landlords and the real estate agents who order plans for their clients.
  Homeowner Service Contracts are sold directly in six tiers, Bridgewell ApplianceCare, Bridgewell SystemsCare, Bridgewell HomeCare Bronze, Bridgewell HomeCare Silver, Bridgewell HomeCare Gold and Bridgewell HomeCare Platinum, each held as a one-year contract on one property and billed monthly or annually.
  Real Estate Service Contracts are ordered by agents at listing or once a purchase contract is signed, in the Bridgewell Closing Starter, Bridgewell Closing Standard, Bridgewell Closing Plus, Bridgewell Closing Premier, Bridgewell Closing Premier Two-Year and Bridgewell New Construction Three-Year plans, and are invoiced to escrow at closing.
  Rental Property Service Contracts serve landlords one property at a time in the Bridgewell Rental Appliance, Bridgewell Rental Systems, Bridgewell Rental Combo, Bridgewell Rental Combo Plus, Bridgewell Rental Multi-Unit Combo and Bridgewell Rental Multi-Unit Combo Plus tiers.
  Optional Coverage Add-Ons attach to a homeowner, rental or real estate contract as the Bridgewell Second Refrigerator Rider, Bridgewell Septic System Rider, Bridgewell Well Pump Rider, Bridgewell Limited Roof Leak Rider, Bridgewell Pool Equipment Rider, Bridgewell Pool and Spa Equipment Rider and Bridgewell Guest Unit Rider, and each rider is billed alongside its base contract.
  Utility Line Protection Plans cover the homeowner-owned stretch of service lines as the Bridgewell Exterior Water Service Line Plan, Bridgewell Exterior Electrical Line Plan, Bridgewell Exterior Sewer and Septic Line Plan, Bridgewell Interior Plumbing and Drainage Plan, Bridgewell Water and Sewer Line Bundle and Bridgewell Total Home Lines Plan, many of them billed on a partner utility's monthly bill.
  HVAC Maintenance Agreements, sold as Bridgewell Comfort Care Essential, Bridgewell Comfort Care Standard, Bridgewell Comfort Care Plus, Bridgewell Comfort Care Dual-System, Bridgewell Comfort Care Dual-System Plus and Bridgewell Comfort Care Premier, give members scheduled tune-ups and member pricing on repairs.
  New Home Builder Warranties are enrolled by registered builders at the first sale of a new home as the Bridgewell Structural-Only Ten-Year Warranty, Bridgewell 1-2-10 Builder Warranty, Bridgewell 1-2-10 Builder Warranty with Appliances, Bridgewell 1-2-10 Attached Home Warranty, Bridgewell 1-2-10 Builder Warranty with Systems Extension and Bridgewell 2-4-10 Premier Builder Warranty.
  Every contract leaves a running record: premiums billed and paid, credits and refunds, service requests with their fees, contractor assignments, coverage determinations, repair and replacement authorizations, cash settlements, renewals and cancellations.
  Typical callers are homeowners with a broken furnace, refrigerator or water heater who hold one contract and perhaps a rider or a line plan, buyers in their first year after closing on a plan their agent ordered, and landlords who carry several rental contracts at once.
  Real estate agents call about orders for listings and pending sales, closing date changes and unpaid closing invoices, and many customers arrive with a history of earlier repairs, prior tiers, missed payments or a cancellation already under way.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: homeowner_claims_and_replacement
    claim:
      categories: [homeplan]
      event_types: [homeplan_service_request, homeplan_service_fee_charge, homeplan_service_fee_refund, homeplan_contractor_dispatch, homeplan_coverage_determination, homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_offer, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement, homeplan_authorization_reversal, homeplan_work_completion]
    summary: >
      Homeowners holding a Homeowner Service Contract call when a system or appliance fails: they want service placed,
      a contractor sent or replaced, a denial explained, a repair-or-replace decision made, or a cash offer settled,
      and their situation varies with the tier held (and any tier held before a mid-term upgrade), the contract's
      status and waiting period, the service call fee option, earlier requests on the same item, payments already made
      against the item's per-term cap and the aggregate limit, and whether a rider or line plan also touches the item.
      The records involved are the contract, its service requests, the claim-handling history and the service-fee
      ledger; the governing rules are the active-status gate on requests and dispatch
      (homeplan_evt_service_request_and_fees, homeplan_evt_contractor_dispatch), the ordered coverage conditions and
      waiting periods (homeplan_evt_coverage_determination), the per-tier item caps and aggregate limit
      (homeplan_evt_benefit_caps), the replacement threshold and like-unit standard (homeplan_evt_repair_or_replace),
      per-tier supplemental allowances (homeplan_evt_supplemental_allowances), cash-in-lieu offers and their validity
      window (homeplan_evt_cash_in_lieu) and out-of-network reimbursement (homeplan_evt_out_of_network), and in the
      domain a request naturally precedes its fee, its dispatch, its determination and then any authorization,
      completion, reversal or settlement. Placing requests, collecting and refunding fees, dispatching, determining
      coverage, authorizing work and allowances, issuing and paying cash offers on the customer's acceptance, and
      reversing authorizations are agent service actions, while accepting a cash-in-lieu offer in place of a
      replacement, declining covered work or paying a difference above a cap is the customer's own decision handed
      over to them. Requests no policy decides, such as reimbursing a repair the customer arranged without
      pre-authorization, paying for consequential water damage to floors and walls, or insisting on a specific brand
      or color of replacement at Bridgewell's cost, leave a POLICY_NOT_COVERED handoff as the only correct route.

  - name: real_estate_closing_plans
    claim:
      categories: [realty]
      event_types: [realty_order, realty_listing_extension, realty_closing_date_change, realty_closing_recorded, realty_coverage_activation, realty_void_unpaid, realty_listing_expiration, realty_order_cancellation, realty_invoice, realty_seller_service_charge, realty_payment, realty_credit_memo, realty_refund, realty_buyer_cancellation, realty_conversion]
    summary: >
      Real estate agents, sellers and buyers call about plans ordered for a home sale: agents placing or changing an
      order, extending seller listing coverage, moving a closing date or chasing an unpaid closing invoice; sellers
      whose sale fell through and who now face a charge for listing-period service; and buyers asking whether their
      coverage is confirmed, cancelling it, or converting it to a homeowner contract near term end. The setting varies
      with the plan ordered, the order type, the contract status from listing through closing and payment, extensions
      already used, payments and credits on each invoice, and seller-phase service already paid. The records are the
      real estate contract, its invoices, payments, credit memos and refunds, and the seller-phase service history; the
      rules are the order and agent-license requirements (realty_order_requirements), one open order per property
      (realty_agg_one_open_order_per_property), premium pricing by size, units and dwelling type
      (realty_premium_pricing), the listing coverage period, extension window and count (realty_seller_listing_coverage),
      the escrow payment window that confirms or voids buyer coverage (realty_closing_and_escrow), the lesser-of
      failed-sale charge (realty_failed_sale_charges), buyer cancellation credits and invoice credit memos
      (realty_cancellation_and_credits) and the conversion offer (realty_conversion_and_expiration), and in the domain
      an order precedes its invoice, the closing precedes payment and coverage confirmation, and an unclosed listing
      ends in expiry or cancellation. Recording orders, extensions, closing details, payments, credits and refunds and
      billing failed-sale charges are agent service actions, while a buyer's cancellation of their own coverage and the
      buyer's acceptance of a conversion are the customer's own decisions handed over to them. Requests outside the
      charter, such as paying an agent for ordering, backdating buyer coverage to before closing, or waiving a
      failed-sale charge as a courtesy, are POLICY_NOT_COVERED handoffs.

  - name: rental_property_renewals_and_cancellations
    claim:
      categories: [landlord]
      event_types: [landlord_renewal_notice, landlord_renewal_preference_change, landlord_renewal, landlord_expiration, landlord_late_renewal, landlord_cancellation, landlord_premium_charge, landlord_premium_payment, landlord_premium_credit, landlord_premium_refund, landlord_nonpayment_suspension, landlord_reinstatement, landlord_nonpayment_cancellation, landlord_ownership_transfer, landlord_plan_upgrade]
    summary: >
      Landlords and small property investors call about the money and term side of their Rental Property Service
      Contracts: what a renewal will cost, turning automatic renewal off, renewing after a term lapsed, bringing a
      suspended contract current, cancelling after selling a property, transferring a contract to a purchaser who keeps
      renting, or upgrading a tier. Their situation varies with the tier and unit count of each property, monthly versus
      annual billing, how many of their contracts are in force on a given term start, renewal notice dates, payment
      history and returned payments, the free-look and sale-waiver windows, and benefit Bridgewell already paid in the
      term. The records are the landlord's contracts, the billing ledger with the portfolio discount applied to each
      charge, and cancellation requests; the rules are portfolio discount bands counted at term start
      (landlord_agg_portfolio_discount), installment and annual pricing with stacked discounts (landlord_premium_pricing),
      grace, suspension and cure windows (landlord_premium_collection_and_nonpayment), renewal notice and late-renewal
      windows (landlord_renewal_terms), free-look, pro-rata and sale-waiver cancellation credits
      (landlord_cancellation_and_refund), transfer conditions (landlord_ownership_transfer_rules) and upgrade proration
      (landlord_plan_upgrade_rules), and in the domain a notice precedes a renewal, a confirmed request precedes a
      cancellation and its credit, and a cured balance precedes reinstatement. Recording cancellation requests, renewals,
      reinstatements, charges, payments, credits and refunds are agent service actions, while confirming a cancellation,
      consenting to take a transfer and accepting an upgrade price are the customer's own decisions handed over to them.
      Requests no policy decides, such as combining a spouse's or company's contracts into one portfolio, refunding
      monthly installments already billed outside the free look, or waiving a returned payment fee, are
      POLICY_NOT_COVERED handoffs.

  - name: optional_coverage_riders
    claim:
      categories: [addon]
      event_types: [addon_rider_enrollment, addon_rider_activation, addon_rider_removal, addon_rider_renewal, addon_premium_charge, addon_premium_payment, addon_premium_credit, addon_premium_refund, addon_service_request, addon_service_fee_charge, addon_contractor_dispatch, addon_coverage_determination, addon_benefit_authorization, addon_authorization_reversal]
    summary: >
      Customers call to add, remove or use optional coverage riders on a homeowner, rental or real estate contract:
      adding pool, septic, well, roof leak, second refrigerator or guest unit coverage, switching between the two pool
      riders, asking why a rider claim was denied, or getting the included septic pumping. The setting varies with the
      base contract's category, tier and status, the riders already attached, the property facts stated when the rider
      was added, the rider's waiting period and add date, the base contract's billing frequency, and benefit already paid
      under the rider's per-request and per-term caps. The records are the rider, its base contract, the rider billing
      ledger and the rider service and claim history; the rules are per-base rider limits and the pool-rider mutual
      exclusion (addon_agg_riders_per_base), base category, status and tier requirements and stated property facts
      (addon_rider_eligibility), rider pricing and annual proration (addon_rider_pricing), the mid-term waiting period
      (addon_rider_activation_rules), removal credits (addon_rider_removal_and_credit), alignment with the base term
      (addon_rider_base_alignment), rider fees (addon_evt_service_request_and_fees), covered and excluded components
      (addon_evt_coverage_determination) and caps, pumping and allowances (addon_evt_benefit_authorization), and in the
      domain a rider is added and billed before it activates, and a rider request precedes its determination and any
      authorization. Adding riders, billing, activating, recording requests, determining coverage and authorizing
      benefits are agent service actions, while removing a rider and accepting a cash settlement are the customer's own
      decisions handed over to them. Requests outside the charter, such as covering a pool that was not working when the
      rider was added, carrying a rider over to a different property, or paying for a full roof replacement, are
      POLICY_NOT_COVERED handoffs.

  - name: utility_line_repairs
    claim:
      categories: [lineplan]
      event_types: [lineplan_service_request, lineplan_contractor_dispatch, lineplan_line_determination, lineplan_repair_authorization, lineplan_authorization_reversal, lineplan_work_completion, lineplan_cancellation, lineplan_premium_credit, lineplan_premium_refund]
    summary: >
      Homeowners holding Utility Line Protection Plans call about a broken water service line, a backed-up sewer
      lateral, a damaged electrical service drop or an interior pipe failure, sometimes after the utility told them the
      problem is on their side, and sometimes to cancel a plan billed on their utility bill. The setting varies with the
      plan's covered line types and per-occurrence caps, the plan status and waiting period, which side of the utility
      connection point the failure is on, the line material, prior covered breaks on the same line, whether a repaired
      section failed again inside the repair guarantee, and the restoration work the repair needs. The records are the
      plan, its line service requests and the claim history of determinations, authorizations and completions, plus the
      billing ledger for cancellations; the rules are the active-status gate on requests and dispatch
      (lineplan_evt_service_request, lineplan_evt_dispatch), the ordered determination conditions including the utility
      side, mandated work and lead lines (lineplan_evt_line_determination), per-occurrence caps with restoration
      allowances inside them and the full-replacement break count (lineplan_evt_repair_authorization), and cancellation
      credits by billing frequency (lineplan_renewal_and_cancellation), and in the domain a request precedes dispatch,
      a determination precedes authorization, and completion starts the repair guarantee. Recording requests,
      dispatching, determining, authorizing, reversing and posting credits and refunds are agent service actions, while
      cancelling the plan and paying the contractor for work beyond a cap are the customer's own decisions handed over
      to them. Requests no policy decides, such as reimbursing a plumber the customer hired directly, paying for a
      utility-ordered lead line replacement, or restoring a decorative driveway, are POLICY_NOT_COVERED handoffs.
