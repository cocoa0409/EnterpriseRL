          action_bindings:
            addon_billing_entries.addon_rider_id: addon_rider_id
            addon_billing_entries.credit_reason: credit_reason
        dedup_contract:
          table: addon_billing_entries
          mode: separate_record
          object_bindings: {addon_rider_id: addon_rider_id, credit_reason: credit_reason}
          duplicate_filters: {event_type: [addon_premium_credit]}
          distinct_fields: [billing_period_start]
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {rider_free_look_days: "=rider_free_look_days", removal_allowed_midterm: "=removal_allowed_midterm", removal_credit_on_annual: "=removal_credit_on_annual"}
        Bridgewell Septic System Rider: {rider_free_look_days: "=rider_free_look_days", removal_allowed_midterm: "=removal_allowed_midterm", removal_credit_on_annual: "=removal_credit_on_annual"}
        Bridgewell Well Pump Rider: {rider_free_look_days: "=rider_free_look_days", removal_allowed_midterm: "=removal_allowed_midterm", removal_credit_on_annual: "=removal_credit_on_annual"}
        Bridgewell Limited Roof Leak Rider: {rider_free_look_days: "=rider_free_look_days", removal_allowed_midterm: "=removal_allowed_midterm", removal_credit_on_annual: "=removal_credit_on_annual"}
        Bridgewell Pool Equipment Rider: {rider_free_look_days: "=rider_free_look_days", removal_allowed_midterm: "=removal_allowed_midterm", removal_credit_on_annual: "=removal_credit_on_annual"}
        Bridgewell Pool and Spa Equipment Rider: {rider_free_look_days: "=rider_free_look_days", removal_allowed_midterm: "=removal_allowed_midterm", removal_credit_on_annual: "=removal_credit_on_annual"}
        Bridgewell Guest Unit Rider: {rider_free_look_days: "=rider_free_look_days", removal_allowed_midterm: "=removal_allowed_midterm", removal_credit_on_annual: "=removal_credit_on_annual"}
    formula:
      removal_credit: "max(0, addon_msr_rider_premium_paid_term - addon_msr_term_benefit_paid) if addon_msr_days_since_added <= rider_free_look_days else max(0, round(addon_msr_rider_premium_paid_term * addon_msr_unexpired_term_days / addon_msr_rider_term_days, 2) - addon_msr_term_benefit_paid)"
    measures: [addon_msr_days_since_added, addon_msr_rider_premium_paid_term, addon_msr_unexpired_term_days, addon_msr_rider_term_days, addon_msr_term_benefit_paid]

  - id: addon_rider_base_alignment
    subject: [addon_rider_renewal, addon_rider_base_termination]
    rule: >-
      A rider is co-terminous with its base contract. When the base contract renews or late-renews and renews_with_base
      is true, the rider renews for the same new term without a new waiting period and its term cap restarts.
      A rider renews only while its status is active or waiting_period.
      When the base contract is cancelled, expires, is voided or converts, the rider ends the same day with status
      ended_with_base. A rider on a converted real estate contract does not carry over to the new homeowner service
      contract; the customer may add it there as a new rider with a new waiting period. On a rental property ownership
      transfer the rider moves with the base contract when transferable_with_base is true.
    eligibility:
      - id: renew_only_open_rider
        applies_to: [addon_rider_renewal]
        kind: state
        condition: "A rider renews only while its status is active or waiting_period."
        evidence_fields: [addon_riders.status, addon_riders.addon_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_riders.addon_rider_id]
          action_bindings:
            addon_riders.addon_rider_id: addon_rider_id
        state_contract:
          field: addon_riders.status
          allowed: [waiting_period, active]
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {renews_with_base: "=renews_with_base", transferable_with_base: "=transferable_with_base"}
        Bridgewell Septic System Rider: {renews_with_base: "=renews_with_base", transferable_with_base: "=transferable_with_base"}
        Bridgewell Well Pump Rider: {renews_with_base: "=renews_with_base", transferable_with_base: "=transferable_with_base"}
        Bridgewell Limited Roof Leak Rider: {renews_with_base: "=renews_with_base", transferable_with_base: "=transferable_with_base"}
        Bridgewell Pool Equipment Rider: {renews_with_base: "=renews_with_base", transferable_with_base: "=transferable_with_base"}
        Bridgewell Pool and Spa Equipment Rider: {renews_with_base: "=renews_with_base", transferable_with_base: "=transferable_with_base"}
        Bridgewell Guest Unit Rider: {renews_with_base: "=renews_with_base", transferable_with_base: "=transferable_with_base"}

  - id: addon_evt_service_request_and_fees
    subject: [addon_service_request, addon_service_fee_charge, addon_service_fee_refund]
    rule: >-
      Rider service requests are accepted only while the rider status is active.
      The base contract must also be in force for service (active, or for a real estate base, active) on the request
      date. A new_failure rider request carries the base contract's service call fee: the contract's service_call_fee
      on a homeowner service contract, and the base tier's service_call_fee on a rental property or real estate contract.
      When concurrent_visit_single_fee is true and the rider component is serviced in the same visit and trade as an
      open base contract request, no rider fee is charged. A septic_pumping request and a recall placed no later than
      repair_guarantee_days calendar days after the earlier rider repair was completed carry no fee. The fee is refunded
      only when the request is cancelled before a contractor is assigned or was charged in error. Septic pumping may be
      requested only while addon_msr_pumpings_used_term is below septic_pumping_per_term.
    eligibility:
      - id: rider_active_for_requests
        applies_to: [addon_service_request]
        kind: state
        condition: "Rider service requests are accepted only while the rider status is active."
        evidence_fields: [addon_riders.status, addon_riders.addon_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_riders.addon_rider_id]
          action_bindings:
            addon_riders.addon_rider_id: addon_rider_id
        state_contract:
          field: addon_riders.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {concurrent_visit_single_fee: "=concurrent_visit_single_fee", repair_guarantee_days: "=repair_guarantee_days", septic_pumping_per_term: "=septic_pumping_per_term"}
        Bridgewell Septic System Rider: {concurrent_visit_single_fee: "=concurrent_visit_single_fee", repair_guarantee_days: "=repair_guarantee_days", septic_pumping_per_term: "=septic_pumping_per_term"}
        Bridgewell Well Pump Rider: {concurrent_visit_single_fee: "=concurrent_visit_single_fee", repair_guarantee_days: "=repair_guarantee_days", septic_pumping_per_term: "=septic_pumping_per_term"}
        Bridgewell Limited Roof Leak Rider: {concurrent_visit_single_fee: "=concurrent_visit_single_fee", repair_guarantee_days: "=repair_guarantee_days", septic_pumping_per_term: "=septic_pumping_per_term"}
        Bridgewell Pool Equipment Rider: {concurrent_visit_single_fee: "=concurrent_visit_single_fee", repair_guarantee_days: "=repair_guarantee_days", septic_pumping_per_term: "=septic_pumping_per_term"}
        Bridgewell Pool and Spa Equipment Rider: {concurrent_visit_single_fee: "=concurrent_visit_single_fee", repair_guarantee_days: "=repair_guarantee_days", septic_pumping_per_term: "=septic_pumping_per_term"}
        Bridgewell Guest Unit Rider: {concurrent_visit_single_fee: "=concurrent_visit_single_fee", repair_guarantee_days: "=repair_guarantee_days", septic_pumping_per_term: "=septic_pumping_per_term"}
    measures: [addon_msr_pumpings_used_term]

  - id: addon_evt_dispatch
    subject: [addon_contractor_dispatch]
    rule: >-
      A contractor is dispatched on a rider request only while the rider status is active.
      The request goes to a network contractor whose trade matches the rider component (pool_spa, septic, well_pump,
      roofing, appliance, or the guest unit item's trade) and whose service ZIP codes include the base property's ZIP
      code, preferred before standard, never suspended; ties go to the contractor reference that sorts first
      alphabetically. Emergency handling applies only when emergency_service_available is true, with contact within
      emergency_contact_hours hours; otherwise contact is within routine_contact_hours hours. A missed contact window
      leads to re-dispatch, and each assignment carries the next dispatch_sequence starting at 1.
    eligibility:
      - id: rider_active_for_dispatch
        applies_to: [addon_contractor_dispatch]
        kind: state
        condition: "A contractor is dispatched on a rider request only while the rider status is active."
        evidence_fields: [addon_riders.status, addon_riders.addon_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
