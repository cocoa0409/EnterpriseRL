events:
  - type: addon_rider_enrollment
    target: addon_riders
    mutation: create
    meaning: The customer adds an optional coverage rider to one base contract.
    grain: One row per rider added.
    fields:
      customer_id: The base contract holder.
      variant_name: The rider added.
      base_category: Which kind of base contract the rider attaches to.
      homeplan_contract_id: The homeowner service contract, when that is the base.
      landlord_contract_id: The rental property service contract, when that is the base.
      realty_contract_id: The real estate contract, when that is the base.
      added_date: The date the rider was added.
      added_with_base: Whether it was added on the base enrollment date or, for a real estate base, before closing.
      coverage_effective_date: The first day rider items are covered.
      term_start_date: The start of the base term the rider is attached to (the closing date for a real estate rider added before closing).
      term_end_date: The base contract's term end date.
      billing_frequency: Follows the base contract (monthly or annual; a real estate base is billed annual).
      water_source: The property water source, as stated.
      sewer_type: The property sewer type, as stated.
      roof_type: The roof type, as stated.
      roof_condition_attested: Whether the customer attested the roof has no known leak or damage.
      pool_spa_config: The pool and spa configuration, as stated.
      guest_unit_sqft: The guest unit living area, as stated.
    triggers:
      - event: addon:addon_premium_charge
        map: {}
      - event: addon:addon_rider_activation
        when: {added_with_base: true}
        map: {}
  - type: addon_rider_activation
    target: addon_riders
    mutation: {transition: {from: waiting_period, to: active}}
    meaning: Rider coverage starts.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers: []
  - type: addon_rider_renewal
    target: addon_riders
    mutation: update
    meaning: The rider renews together with its base contract for the base contract's new term.
    grain: One row per transaction.
    fields:
      term_start_date: The base contract's new term start.
      term_end_date: The base contract's new term end.
    triggers:
      - event: addon:addon_premium_charge
        map: {}
  - type: addon_rider_removal
    target: addon_riders
    mutation: {transition: [{from: waiting_period, to: removed}, {from: active, to: removed}]}
    meaning: The customer removes the rider while keeping the base contract.
    grain: One row per transaction.
    fields:
      status: Becomes removed.
      end_date: The removal date, which is the date the customer asked to remove it.
    triggers: []
  - type: addon_rider_base_termination
    target: addon_riders
    mutation: {transition: [{from: waiting_period, to: ended_with_base}, {from: active, to: ended_with_base}]}
    meaning: The rider ends because its base contract was cancelled, expired, voided or converted.
    grain: One row per transaction.
    fields:
      status: Becomes ended_with_base.
      end_date: The base contract's end date.
    triggers: []
  - type: addon_premium_charge
    target: addon_billing_entries
    meaning: Rider premium is billed.
    grain: One row per rider premium amount for one billing period.
    distinguish_by: [charge_type, billing_period_start]
    fields:
      entry_date: The billing date.
      amount: The amount billed, positive.
      charge_type: Monthly rider premium or prorated annual rider premium.
      billing_period_start: First day of the period covered.
      billing_period_end: Last day of the period covered.
    account: premium_balance
    direction: in
    triggers: []
  - type: addon_premium_payment
    target: addon_billing_entries
    meaning: Rider premium is paid.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: How it was paid.
    account: premium_balance
    direction: out
    triggers: []
  - type: addon_premium_credit
    target: addon_billing_entries
    meaning: Unused rider premium is credited when the rider is removed or ends with its base, or a billing error is corrected.
    grain: One row per credit reason on the rider and period.
    distinguish_by: [credit_reason, billing_period_start]
    fields:
      entry_date: The posting date.
      amount: The credit, positive.
      credit_reason: Why.
      billing_period_start: The start of the period the credit relates to.
    account: premium_balance
    direction: out
    triggers: []
  - type: addon_premium_refund
    target: addon_billing_entries
    meaning: A rider credit balance is refunded.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund, positive.
      refund_reference: The refund confirmation number.
      payment_method: How it is refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: addon_service_fee_charge
    target: addon_billing_entries
    meaning: A service call fee is collected on a rider service request.
    grain: One row per rider service request charged.
    distinguish_by: [addon_service_request_id]
    fields:
      entry_date: The collection date.
      amount: The fee, positive.
      addon_service_request_id: The rider service request.
    account: service_fee_balance
    direction: in
    triggers: []
  - type: addon_service_fee_refund
    target: addon_billing_entries
    meaning: A rider service call fee is refunded.
    grain: One row per rider service request refunded.
    distinguish_by: [addon_service_request_id]
    fields:
      entry_date: The refund date.
      amount: The refund, positive.
      addon_service_request_id: The rider service request.
      fee_refund_reason: Why.
    account: service_fee_balance
    direction: out
    triggers: []
  - type: addon_service_request
    target: addon_service_requests
    meaning: The customer reports a failure of a rider-covered component or asks for the included septic pumping.
    grain: One row per component failure or pumping request.
    distinguish_by: [addon_service_request_id]
    fields:
      addon_service_request_id: The rider service request number.
      request_date: The date placed.
      component: The component reported.
      trade: The trade.
      request_type: new_failure, recall or septic_pumping.
      urgency: Emergency or routine.
      concurrent_with_base_visit: Whether it is serviced in the same visit and trade as an open base contract request.
      failure_description: The customer's description, verbatim.
    triggers:
      - event: addon:addon_service_fee_charge
        when: {request_type: new_failure, concurrent_with_base_visit: false}
        map: {addon_service_request_id: addon_service_request_id}
  - type: addon_contractor_dispatch
    target: addon_claim_events
    meaning: A network contractor is assigned to a rider service request.
    grain: One row per assignment on one rider service request.
    distinguish_by: [addon_service_request_id, dispatch_sequence]
    fields:
      addon_service_request_id: The rider service request.
      event_date: The assignment date.
      service_contractor_id: The contractor.
      dispatch_sequence: 1 for the first assignment, incremented per further assignment.
      dispatch_reason: Initial, re-dispatch or recall.
    triggers: []
  - type: addon_coverage_determination
    target: addon_claim_events
    meaning: Bridgewell decides whether the rider covers the failure.
    grain: One row per rider service request.
    distinguish_by: [addon_service_request_id]
    fields:
      addon_service_request_id: The rider service request.
      event_date: The determination date.
      component: The component.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered.
    triggers: []
  - type: addon_benefit_authorization
    target: addon_claim_events
    meaning: Bridgewell authorizes a repair, replacement, cash-in-lieu settlement, the included septic pumping or an allowance under the rider.
    grain: One row per authorization number.
    distinguish_by: [authorization_number]
    fields:
      addon_service_request_id: The rider service request.
      event_date: The authorization date.
      component: The component.
      authorization_number: The authorization number.
      resolution_type: repair, replacement, cash_in_lieu, septic_pumping or allowance.
      allowance_type: For an allowance, which one.
      invoice_amount: For an allowance or pumping, the documented cost.
      repair_estimate: The repair estimate.
      replacement_cost: The contracted replacement cost.
      amount: The amount Bridgewell pays.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: addon_authorization_reversal
    target: addon_claim_events
    meaning: A rider authorization is reversed because the work will not be performed.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      addon_service_request_id: The rider service request.
      event_date: The reversal date.
      reversed_authorization_number: The authorization reversed.
      reversal_reason: Why.
      amount: The amount reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []

measures:
  - id: addon_msr_open_riders_of_type
    window: Snapshot at the moment a rider is added.
    measure: Count of addon_riders on the same base contract with the same variant_name (or with the variant_name named by mutually_exclusive_with) whose status is waiting_period or active.
  - id: addon_msr_term_benefit_paid
    window: The rider term (term_start_date through term_end_date) in which the rider service request's request_date falls.
    measure: Sum of addon_benefit_authorization amounts on the rider for requests in the window, minus addon_authorization_reversal amounts for those authorizations.
  - id: addon_msr_request_benefit_paid
    window: The life of one rider service request.
    measure: Sum of addon_benefit_authorization amounts on that request, excluding allowance rows, minus reversals of them.
  - id: addon_msr_pumpings_used_term
    window: The current rider term.
    measure: Count of addon_benefit_authorization rows with resolution_type septic_pumping in the window that were not reversed.
  - id: addon_msr_rider_premium_paid_term
    window: The current rider term up to the removal date.
    measure: Sum of addon_premium_payment amounts posted in the window.
  - id: addon_msr_unexpired_term_days
    window: The current rider term as of the removal or base end date.
    measure: Count of calendar days from the day after the removal or base end date through term_end_date inclusive.
  - id: addon_msr_rider_term_days
    window: The current rider term.
    measure: Count of calendar days from the later of term_start_date and added_date through term_end_date inclusive.
  - id: addon_msr_days_since_added
    window: From added_date to the removal date.
    measure: Count of calendar days from the day after added_date through the removal date inclusive.

policies:
  - id: addon_agg_multi_holding
    subject: [addon_rider_enrollment]
    rule: >-
      A customer may hold any number of riders across their base contracts. How many riders of one kind a single base
      contract may carry, and which riders exclude each other, is governed by addon_agg_riders_per_base.
    eligibility: []
    params:
      max_per_customer: null

  - id: addon_agg_riders_per_base
    subject: [addon_rider_enrollment]
    rule: >-
      Riders are counted per base contract, using addon_msr_open_riders_of_type over riders in status waiting_period
      or active; removed riders and riders that ended with their base never count.
      A rider is not added when the base contract already carries max_per_base_contract riders of the same kind in status waiting_period or active.
      A rider is not added when the base contract carries the rider named by its mutually_exclusive_with in status waiting_period or active.
      A customer who wants to move between the Pool Equipment Rider and the Pool and Spa Equipment Rider removes the
      rider held and adds the other, and the added rider serves its own waiting period. Riders on different base
      contracts of the same customer never combine for caps or pricing.
    eligibility:
      - id: per_base_rider_limit
        applies_to: [addon_rider_enrollment]
        kind: dedup
        condition: "A rider is not added when the base contract already carries max_per_base_contract riders of the same kind in status waiting_period or active."
        evidence_fields: [addon_riders.homeplan_contract_id, addon_riders.landlord_contract_id, addon_riders.realty_contract_id, addon_riders.variant_name, addon_riders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_riders.homeplan_contract_id, addon_riders.landlord_contract_id, addon_riders.realty_contract_id, addon_riders.variant_name]
          action_bindings:
            addon_riders.homeplan_contract_id: homeplan_contract_id
            addon_riders.landlord_contract_id: landlord_contract_id
            addon_riders.realty_contract_id: realty_contract_id
            addon_riders.variant_name: variant_name
        dedup_contract:
          table: addon_riders
          mode: separate_record
          object_bindings: {homeplan_contract_id: homeplan_contract_id, landlord_contract_id: landlord_contract_id, realty_contract_id: realty_contract_id, variant_name: variant_name}
          duplicate_filters: {status: [waiting_period, active]}
          distinct_fields: [added_date]
      - id: mutually_exclusive_rider_absent
        applies_to: [addon_rider_enrollment]
        kind: dedup
        condition: "A rider is not added when the base contract carries the rider named by its mutually_exclusive_with in status waiting_period or active."
        evidence_fields: [addon_riders.homeplan_contract_id, addon_riders.landlord_contract_id, addon_riders.realty_contract_id, addon_riders.variant_name, addon_riders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_riders.homeplan_contract_id, addon_riders.landlord_contract_id, addon_riders.realty_contract_id]
          action_bindings:
            addon_riders.homeplan_contract_id: homeplan_contract_id
            addon_riders.landlord_contract_id: landlord_contract_id
            addon_riders.realty_contract_id: realty_contract_id
        dedup_contract:
          table: addon_riders
          mode: separate_record
          object_bindings: {homeplan_contract_id: homeplan_contract_id, landlord_contract_id: landlord_contract_id, realty_contract_id: realty_contract_id}
          duplicate_filters: {status: [waiting_period, active]}
          distinct_fields: [variant_name]
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {max_per_base_contract: "=max_per_base_contract", mutually_exclusive_with: "=mutually_exclusive_with"}
        Bridgewell Septic System Rider: {max_per_base_contract: "=max_per_base_contract", mutually_exclusive_with: "=mutually_exclusive_with"}
        Bridgewell Well Pump Rider: {max_per_base_contract: "=max_per_base_contract", mutually_exclusive_with: "=mutually_exclusive_with"}
        Bridgewell Limited Roof Leak Rider: {max_per_base_contract: "=max_per_base_contract", mutually_exclusive_with: "=mutually_exclusive_with"}
        Bridgewell Pool Equipment Rider: {max_per_base_contract: "=max_per_base_contract", mutually_exclusive_with: "=mutually_exclusive_with"}
        Bridgewell Pool and Spa Equipment Rider: {max_per_base_contract: "=max_per_base_contract", mutually_exclusive_with: "=mutually_exclusive_with"}
        Bridgewell Guest Unit Rider: {max_per_base_contract: "=max_per_base_contract", mutually_exclusive_with: "=mutually_exclusive_with"}
    measures: [addon_msr_open_riders_of_type]

  - id: addon_rider_eligibility
    subject: [addon_rider_enrollment]
    rule: >-
      A rider attaches to exactly one base contract of a category for which its eligible_on_homeplan,
      eligible_on_landlord or eligible_on_realty is true, held by the same customer.
      On a homeowner service contract, a rider is added only while the base contract status is waiting_period or active.
      On a rental property service contract, a rider is added only while the base contract status is waiting_period or active.
      On a real estate contract, a rider is added only while the base contract status is listing_coverage, awaiting_closing or active; a rider added before closing covers the buyer phase only.
      Where requires_appliance_base is true, the base tier must cover the kitchen refrigerator (a refrigerator or kitchen
      appliance cap above 0.00); where requires_combo_base is true, the base tier must cover both heating and the kitchen
      refrigerator. The property facts the rider depends on (water_source, sewer_type, roof_type and the roof condition attestation, pool_spa_config and pool operating condition, guest_unit_sqft) are taken from the customer's statement and must satisfy the rider's entry gate.
      Mid-term additions require add_midterm_allowed and at least min_days_remaining_to_add calendar days between
      added_date and the base term_end_date. The rider's term_end_date always equals the base contract's term_end_date.
    eligibility:
      - id: homeplan_base_open
        applies_to: [addon_rider_enrollment]
        kind: state
        condition: "On a homeowner service contract, a rider is added only while the base contract status is waiting_period or active."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [waiting_period, active]
      - id: landlord_base_open
        applies_to: [addon_rider_enrollment]
        kind: state
        condition: "On a rental property service contract, a rider is added only while the base contract status is waiting_period or active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [waiting_period, active]
      - id: realty_base_open
        applies_to: [addon_rider_enrollment]
        kind: state
        condition: "On a real estate contract, a rider is added only while the base contract status is listing_coverage, awaiting_closing or active; a rider added before closing covers the buyer phase only."
        evidence_fields: [realty_contracts.status, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        state_contract:
          field: realty_contracts.status
          allowed: [listing_coverage, awaiting_closing, active]
      - id: property_facts_stated
        applies_to: [addon_rider_enrollment]
        kind: caller_fact
        condition: "The property facts the rider depends on (water_source, sewer_type, roof_type and the roof condition attestation, pool_spa_config and pool operating condition, guest_unit_sqft) are taken from the customer's statement and must satisfy the rider's entry gate."
        evidence_fields: [addon_riders.water_source, addon_riders.sewer_type, addon_riders.roof_type, addon_riders.roof_condition_attested, addon_riders.pool_spa_config, addon_riders.guest_unit_sqft, addon_riders.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [addon_riders.customer_id]
          action_bindings:
            addon_riders.customer_id: customer_id
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {eligible_on_homeplan: "=eligible_on_homeplan", eligible_on_landlord: "=eligible_on_landlord", eligible_on_realty: "=eligible_on_realty", requires_appliance_base: "=requires_appliance_base", requires_combo_base: "=requires_combo_base", min_days_remaining_to_add: "=min_days_remaining_to_add"}
        Bridgewell Septic System Rider: {eligible_on_homeplan: "=eligible_on_homeplan", eligible_on_landlord: "=eligible_on_landlord", eligible_on_realty: "=eligible_on_realty", requires_appliance_base: "=requires_appliance_base", requires_combo_base: "=requires_combo_base", min_days_remaining_to_add: "=min_days_remaining_to_add"}
        Bridgewell Well Pump Rider: {eligible_on_homeplan: "=eligible_on_homeplan", eligible_on_landlord: "=eligible_on_landlord", eligible_on_realty: "=eligible_on_realty", requires_appliance_base: "=requires_appliance_base", requires_combo_base: "=requires_combo_base", min_days_remaining_to_add: "=min_days_remaining_to_add"}
        Bridgewell Limited Roof Leak Rider: {eligible_on_homeplan: "=eligible_on_homeplan", eligible_on_landlord: "=eligible_on_landlord", eligible_on_realty: "=eligible_on_realty", requires_appliance_base: "=requires_appliance_base", requires_combo_base: "=requires_combo_base", min_days_remaining_to_add: "=min_days_remaining_to_add"}
        Bridgewell Pool Equipment Rider: {eligible_on_homeplan: "=eligible_on_homeplan", eligible_on_landlord: "=eligible_on_landlord", eligible_on_realty: "=eligible_on_realty", requires_appliance_base: "=requires_appliance_base", requires_combo_base: "=requires_combo_base", min_days_remaining_to_add: "=min_days_remaining_to_add"}
        Bridgewell Pool and Spa Equipment Rider: {eligible_on_homeplan: "=eligible_on_homeplan", eligible_on_landlord: "=eligible_on_landlord", eligible_on_realty: "=eligible_on_realty", requires_appliance_base: "=requires_appliance_base", requires_combo_base: "=requires_combo_base", min_days_remaining_to_add: "=min_days_remaining_to_add"}
        Bridgewell Guest Unit Rider: {eligible_on_homeplan: "=eligible_on_homeplan", eligible_on_landlord: "=eligible_on_landlord", eligible_on_realty: "=eligible_on_realty", requires_appliance_base: "=requires_appliance_base", requires_combo_base: "=requires_combo_base", min_days_remaining_to_add: "=min_days_remaining_to_add"}

  - id: addon_rider_pricing
    subject: [addon_premium_charge, addon_premium_payment]
    rule: >-
      On a monthly-billed base, monthly_rider_premium is billed with each base installment from the first base billing
      period that starts on or after added_date (a rider added on the base enrollment date is billed from the first
      installment). On an annual-billed base, one prorated annual rider premium is billed on added_date (or on each
      renewal term start), equal to monthly_rider_premium times 12 reduced by annual_pay_discount_rate, multiplied by
      addon_msr_rider_term_days and divided by the number of days in the base term, rounded to the cent. A rider on a
      real estate contract is billed as annual-billed for each 12-month buyer contract year. Payments are applied to the
      rider's own balance. A rider premium is never discounted by a landlord portfolio discount.
      Rider premium is billed only while the rider status is waiting_period or active.
      When the base contract is suspended for nonpayment, rider requests are not accepted either.
    eligibility:
      - id: rider_billed_while_open
        applies_to: [addon_premium_charge]
        kind: state
        condition: "Rider premium is billed only while the rider status is waiting_period or active."
        evidence_fields: [addon_riders.status, addon_riders.addon_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_riders.addon_rider_id]
          action_bindings:
            addon_riders.addon_rider_id: addon_rider_id
        state_contract:
          field: addon_riders.status
          allowed: [waiting_period, active]
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {monthly_rider_premium: "=monthly_rider_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Septic System Rider: {monthly_rider_premium: "=monthly_rider_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Well Pump Rider: {monthly_rider_premium: "=monthly_rider_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Limited Roof Leak Rider: {monthly_rider_premium: "=monthly_rider_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Pool Equipment Rider: {monthly_rider_premium: "=monthly_rider_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Pool and Spa Equipment Rider: {monthly_rider_premium: "=monthly_rider_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Guest Unit Rider: {monthly_rider_premium: "=monthly_rider_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
    formula:
      annual_rider_premium: "round(monthly_rider_premium * 12 * (1 - annual_pay_discount_rate), 2)"
    measures: [addon_msr_rider_term_days]

  - id: addon_rider_activation_rules
    subject: [addon_rider_activation]
    rule: >-
      A rider added on the base enrollment date, or on a real estate contract before closing, has coverage_effective_date
      equal to the base contract's coverage start and activates with it when waiting_waived_at_base_enrollment is true.
      A rider added mid-term activates no earlier than waiting_period_days calendar days after the rider is added, counting the add date as day zero.
      The waiting period runs even when the base contract itself is already active, and failures first reported before
      the rider's coverage_effective_date are never covered by the rider.
    eligibility:
      - id: rider_waiting_elapsed
        applies_to: [addon_rider_activation]
        kind: time
        condition: "A rider added mid-term activates no earlier than waiting_period_days calendar days after the rider is added, counting the add date as day zero."
        evidence_fields: [addon_riders.added_date, addon_riders.added_with_base, addon_riders.addon_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_riders.addon_rider_id]
          action_bindings:
            addon_riders.addon_rider_id: addon_rider_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rider is added
          anchor_source: addon_riders.added_date
          relation: not_before
          duration_source: variants.waiting_period_days
          unit: calendar_days
          counting_rule: counting the add date as day zero
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {waiting_period_days: "=waiting_period_days", waiting_waived_at_base_enrollment: "=waiting_waived_at_base_enrollment"}
        Bridgewell Septic System Rider: {waiting_period_days: "=waiting_period_days", waiting_waived_at_base_enrollment: "=waiting_waived_at_base_enrollment"}
        Bridgewell Well Pump Rider: {waiting_period_days: "=waiting_period_days", waiting_waived_at_base_enrollment: "=waiting_waived_at_base_enrollment"}
        Bridgewell Limited Roof Leak Rider: {waiting_period_days: "=waiting_period_days", waiting_waived_at_base_enrollment: "=waiting_waived_at_base_enrollment"}
        Bridgewell Pool Equipment Rider: {waiting_period_days: "=waiting_period_days", waiting_waived_at_base_enrollment: "=waiting_waived_at_base_enrollment"}
        Bridgewell Pool and Spa Equipment Rider: {waiting_period_days: "=waiting_period_days", waiting_waived_at_base_enrollment: "=waiting_waived_at_base_enrollment"}
        Bridgewell Guest Unit Rider: {waiting_period_days: "=waiting_period_days", waiting_waived_at_base_enrollment: "=waiting_waived_at_base_enrollment"}

  - id: addon_rider_removal_and_credit
    subject: [addon_rider_removal, addon_premium_credit, addon_premium_refund]
    rule: >-
      Removing a rider is the customer's own decision and is effective on the date the customer asks.
      A rider is removed only when removal_allowed_midterm is true and the rider status is waiting_period or active.
      On a monthly-billed base, rider billing stops from the next base billing period and nothing already billed is
      credited. On an annual-billed or real estate base, when removal_credit_on_annual is true, a removal no later than
      rider_free_look_days calendar days after added_date (addon_msr_days_since_added) is credited all rider premium paid
      in the term less addon_msr_term_benefit_paid; a later removal is credited addon_msr_rider_premium_paid_term times
      addon_msr_unexpired_term_days divided by addon_msr_rider_term_days, rounded to the cent, less
      addon_msr_term_benefit_paid. No admin fee applies to a rider removal, and a negative result is credited as zero.
      When the base contract is cancelled, the rider ends with it and its unused premium is credited by the same method;
      when the base expires, the rider premium is fully earned and nothing is credited. Each rider receives at most one credit per credit reason and period.
      Credit balances are refunded to the original payment method with the base contract's refund.
    eligibility:
      - id: rider_open_for_removal
        applies_to: [addon_rider_removal]
        kind: authorization
        condition: "A rider is removed only when removal_allowed_midterm is true and the rider status is waiting_period or active."
        evidence_fields: [addon_riders.status, addon_riders.addon_rider_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_riders.addon_rider_id]
          action_bindings:
            addon_riders.addon_rider_id: addon_rider_id
      - id: one_credit_per_reason
        applies_to: [addon_premium_credit]
        kind: dedup
        condition: "Each rider receives at most one credit per credit reason and period."
        evidence_fields: [addon_billing_entries.addon_rider_id, addon_billing_entries.credit_reason, addon_billing_entries.billing_period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
