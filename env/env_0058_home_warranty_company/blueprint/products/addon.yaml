          action_bindings:
            addon_riders.addon_rider_id: addon_rider_id
        state_contract:
          field: addon_riders.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {routine_contact_hours: "=routine_contact_hours", emergency_service_available: "=emergency_service_available", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Septic System Rider: {routine_contact_hours: "=routine_contact_hours", emergency_service_available: "=emergency_service_available", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Well Pump Rider: {routine_contact_hours: "=routine_contact_hours", emergency_service_available: "=emergency_service_available", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Limited Roof Leak Rider: {routine_contact_hours: "=routine_contact_hours", emergency_service_available: "=emergency_service_available", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Pool Equipment Rider: {routine_contact_hours: "=routine_contact_hours", emergency_service_available: "=emergency_service_available", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Pool and Spa Equipment Rider: {routine_contact_hours: "=routine_contact_hours", emergency_service_available: "=emergency_service_available", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Guest Unit Rider: {routine_contact_hours: "=routine_contact_hours", emergency_service_available: "=emergency_service_available", emergency_contact_hours: "=emergency_contact_hours"}

  - id: addon_evt_coverage_determination
    subject: [addon_coverage_determination]
    rule: >-
      One coverage determination is issued per rider service request.
      A rider failure is covered only when every condition below holds, and otherwise is not_covered with the first
      failing reason in this order. (1) rider_not_in_force: the rider was active and its base contract in force for
      service on the request date. (2) waiting_period: the failure was first reported on or after the rider's
      coverage_effective_date. (3) component_not_covered: the component is in covered_components and not in
      excluded_components; for the Guest Unit Rider, the item is one the base tier covers and the guest unit is no
      larger than guest_unit_max_sqft; for the Limited Roof Leak Rider, the roof type is in roof_types_covered and the
      leak is over an occupied living area when roof_leak_occupied_area_only is true. (4) preexisting_condition:
      conditions existing before the rider's coverage_effective_date are never covered, including a pool or spa not in
      operating condition when the rider was added or a roof leak that existed when the condition was attested.
      (5) misuse_or_external_damage: misuse, freezing, chemical damage, weather and other external causes are never
      covered. (6) cap_exhausted: the remaining term benefit under addon_evt_benefit_authorization is above zero.
    eligibility:
      - id: one_rider_determination
        applies_to: [addon_coverage_determination]
        kind: dedup
        condition: "One coverage determination is issued per rider service request."
        evidence_fields: [addon_claim_events.addon_service_request_id, addon_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_claim_events.addon_service_request_id]
          action_bindings:
            addon_claim_events.addon_service_request_id: addon_service_request_id
        dedup_contract:
          table: addon_claim_events
          mode: separate_record
          object_bindings: {addon_service_request_id: addon_service_request_id}
          duplicate_filters: {event_type: [addon_coverage_determination]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {covered_components: "=covered_components", excluded_components: "=excluded_components", roof_types_covered: "=roof_types_covered", roof_leak_occupied_area_only: "=roof_leak_occupied_area_only", guest_unit_max_sqft: "=guest_unit_max_sqft", unknown_preexisting_covered: "=unknown_preexisting_covered", pool_operating_condition_required: "=pool_operating_condition_required", spa_equipment_covered: "=spa_equipment_covered", roof_condition_attestation_required: "=roof_condition_attestation_required", guest_unit_kitchen_appliances_covered: "=guest_unit_kitchen_appliances_covered", requires_private_well: "=requires_private_well", requires_private_septic: "=requires_private_septic", requires_pool_or_spa: "=requires_pool_or_spa"}
        Bridgewell Septic System Rider: {covered_components: "=covered_components", excluded_components: "=excluded_components", roof_types_covered: "=roof_types_covered", roof_leak_occupied_area_only: "=roof_leak_occupied_area_only", guest_unit_max_sqft: "=guest_unit_max_sqft", unknown_preexisting_covered: "=unknown_preexisting_covered", pool_operating_condition_required: "=pool_operating_condition_required", spa_equipment_covered: "=spa_equipment_covered", roof_condition_attestation_required: "=roof_condition_attestation_required", guest_unit_kitchen_appliances_covered: "=guest_unit_kitchen_appliances_covered", requires_private_well: "=requires_private_well", requires_private_septic: "=requires_private_septic", requires_pool_or_spa: "=requires_pool_or_spa"}
        Bridgewell Well Pump Rider: {covered_components: "=covered_components", excluded_components: "=excluded_components", roof_types_covered: "=roof_types_covered", roof_leak_occupied_area_only: "=roof_leak_occupied_area_only", guest_unit_max_sqft: "=guest_unit_max_sqft", unknown_preexisting_covered: "=unknown_preexisting_covered", pool_operating_condition_required: "=pool_operating_condition_required", spa_equipment_covered: "=spa_equipment_covered", roof_condition_attestation_required: "=roof_condition_attestation_required", guest_unit_kitchen_appliances_covered: "=guest_unit_kitchen_appliances_covered", requires_private_well: "=requires_private_well", requires_private_septic: "=requires_private_septic", requires_pool_or_spa: "=requires_pool_or_spa"}
        Bridgewell Limited Roof Leak Rider: {covered_components: "=covered_components", excluded_components: "=excluded_components", roof_types_covered: "=roof_types_covered", roof_leak_occupied_area_only: "=roof_leak_occupied_area_only", guest_unit_max_sqft: "=guest_unit_max_sqft", unknown_preexisting_covered: "=unknown_preexisting_covered", pool_operating_condition_required: "=pool_operating_condition_required", spa_equipment_covered: "=spa_equipment_covered", roof_condition_attestation_required: "=roof_condition_attestation_required", guest_unit_kitchen_appliances_covered: "=guest_unit_kitchen_appliances_covered", requires_private_well: "=requires_private_well", requires_private_septic: "=requires_private_septic", requires_pool_or_spa: "=requires_pool_or_spa"}
