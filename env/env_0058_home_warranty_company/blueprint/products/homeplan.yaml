events:
  # ---- contract (holding) writes ----
  - type: homeplan_enrollment
    target: homeplan_contracts
    mutation: create
    meaning: A homeowner purchases a new homeowner service contract for one property, online, by phone, or by converting an expiring real estate contract.
    grain: One row per contract purchased.
    fields:
      customer_id: The purchasing homeowner.
      variant_name: The official tier purchased.
      property_address: The covered property address as the customer states it.
      property_zip: The five-digit ZIP code of the covered property.
      property_type: The dwelling type of the covered property.
      square_footage: The living-area square footage of the covered property.
      enrollment_channel: How the contract was purchased (online, phone, realty_conversion).
      realty_contract_id: For a realty conversion, the expiring real estate contract it continues; empty otherwise.
      start_date: The purchase date, which is also the first term start.
      term_start_date: The start of the current term (equal to start_date at enrollment).
      term_end_date: The last covered day of the current term.
      coverage_effective_date: The first day failures are covered.
      term_number: 1 at enrollment.
      billing_frequency: Monthly installments or annual pay-in-full.
      service_call_fee: The service call fee option elected.
      auto_renew: Whether the contract renews automatically.
    triggers:
      - event: homeplan:homeplan_premium_charge
        when: {billing_frequency: monthly}
        map: {charge_type: monthly_installment}
      - event: homeplan:homeplan_premium_charge
        when: {billing_frequency: annual}
        map: {charge_type: annual_premium}
      - event: homeplan:homeplan_coverage_activation
        when: {enrollment_channel: realty_conversion}
        map: {}
  - type: homeplan_coverage_activation
    target: homeplan_contracts
    mutation: {transition: {from: waiting_period, to: active}}
    meaning: The waiting period ends and coverage starts.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers: []
  - type: homeplan_renewal_notice
    target: homeplan_contracts
    mutation: update
    meaning: Bridgewell issues the renewal notice stating the renewal term and price ahead of term end.
    grain: One row per transaction.
    fields:
      renewal_notice_date: The date the renewal notice was issued for the current term.
    triggers: []
  - type: homeplan_renewal_preference_change
    target: homeplan_contracts
    mutation: update
    meaning: The customer turns automatic renewal on or off.
    grain: One row per transaction.
    fields:
      auto_renew: The new automatic renewal setting.
    triggers: []
  - type: homeplan_renewal
    target: homeplan_contracts
    mutation: update
    meaning: An active contract renews into a new term on its term end, optionally at a different tier or service call fee option.
    grain: One row per transaction.
    fields:
      term_start_date: The first day of the new term (the day after the prior term_end_date).
      term_end_date: The last day of the new term.
      term_number: Incremented by one.
      variant_name: The tier for the new term (a downgrade takes effect only here).
      prior_variant_name: The tier of the term that just ended.
      service_call_fee: The service call fee option for the new term.
      renewal_notice_date: Cleared for the new term.
    triggers:
      - event: homeplan:homeplan_premium_charge
        map: {}
      - event: addon:addon_rider_renewal
        map: {}
  - type: homeplan_plan_upgrade
    target: homeplan_contracts
    mutation: update
    meaning: The customer moves to a higher tier during the term.
    grain: One row per transaction.
    fields:
      variant_name: The higher tier now held.
      prior_variant_name: The tier held before the upgrade.
      last_plan_change_date: The date the upgrade took effect.
    triggers: []
  - type: homeplan_cancellation
    target: homeplan_contracts
    mutation: {transition: [{from: waiting_period, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The customer confirms a cancellation request and the contract ends.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation effective date, which is the notice date on the cancellation request.
    triggers:
      - event: homeplan:homeplan_premium_credit
        map: {credit_reason: cancellation_refund_credit}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: homeplan_nonpayment_suspension
    target: homeplan_contracts
    mutation: {transition: {from: active, to: suspended_nonpayment}}
    meaning: Service is suspended because an installment is past due beyond the grace period.
    grain: One row per transaction.
    fields:
      status: Becomes suspended_nonpayment.
      suspended_date: The date service was suspended.
    triggers: []
  - type: homeplan_reinstatement
    target: homeplan_contracts
    mutation: {transition: {from: suspended_nonpayment, to: active}}
    meaning: A suspended contract is reinstated after the full past-due balance is paid within the cure period.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      suspended_date: Cleared on reinstatement.
    triggers: []
  - type: homeplan_nonpayment_cancellation
    target: homeplan_contracts
    mutation: {transition: {from: suspended_nonpayment, to: cancelled}}
    meaning: A suspended contract is cancelled because the past-due balance was not cured in time.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The date the contract was cancelled for nonpayment.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: homeplan_expiration
    target: homeplan_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The term_end_date of the term that ended.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: homeplan_late_renewal
    target: homeplan_contracts
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired contract is renewed within the late-renewal grace period.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      term_start_date: The date of the late renewal.
      term_end_date: The last day of the new term counted from the late renewal date.
      term_number: Incremented by one.
      end_date: Cleared.
    triggers:
      - event: homeplan:homeplan_premium_charge
        map: {}
  # ---- premium ledger ----
      - event: addon:addon_rider_renewal
        map: {}
  - type: homeplan_premium_charge
    target: homeplan_billing_entries
    meaning: A premium amount is billed to the customer (an installment, an annual premium, an upgrade proration, a returned payment or a returned payment fee).
    grain: One row per amount billed for one billing period and charge type.
    distinguish_by: [charge_type, billing_period_start, payment_reference]
    fields:
      entry_date: The billing date.
      amount: The amount billed, positive.
      charge_type: What is being billed.
      billing_period_start: The first day of the period the charge covers (for a returned payment or its fee, the period of the returned payment).
      billing_period_end: The last day of the period the charge covers.
      payment_reference: For a returned payment or returned payment fee, the confirmation number of the payment that was returned; empty otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: homeplan_premium_payment
    target: homeplan_billing_entries
    meaning: The customer pays premium.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: Card, bank draft (ach) or check.
    account: premium_balance
    direction: out
    triggers: []
  - type: homeplan_premium_credit
    target: homeplan_billing_entries
    meaning: A premium credit is posted, either the cancellation refund credit or a billing correction.
    grain: One row per credit posted for one source object.
    distinguish_by: [credit_reason, homeplan_cancellation_request_id, billing_period_start]
    fields:
      entry_date: The posting date.
      amount: The credit amount, positive.
      credit_reason: Why the credit is posted.
      homeplan_cancellation_request_id: For a cancellation credit, the cancellation request it settles; empty otherwise.
      billing_period_start: For a billing correction, the period of the charge corrected; empty otherwise.
    account: premium_balance
    direction: out
    triggers: []
  - type: homeplan_premium_refund
    target: homeplan_billing_entries
    meaning: A refund is disbursed to the customer from a credit balance.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund amount, positive.
      refund_reference: The refund confirmation number.
      homeplan_cancellation_request_id: The cancellation request the refund settles.
      payment_method: How the refund is returned (card, ach or check).
    account: premium_balance
    direction: in
    triggers: []
  - type: homeplan_service_fee_charge
    target: homeplan_billing_entries
    meaning: A service call fee or surcharge is collected for a service request.
    grain: One row per fee type collected on one service request.
    distinguish_by: [homeplan_service_request_id, fee_type]
    fields:
      entry_date: The collection date.
      amount: The fee collected, positive.
      homeplan_service_request_id: The service request the fee belongs to.
      fee_type: Standard visit fee, second-opinion fee, or after-hours surcharge.
    account: service_fee_balance
    direction: in
    triggers: []
  - type: homeplan_service_fee_refund
    target: homeplan_billing_entries
    meaning: A service call fee collected on a request is refunded.
    grain: One row per fee type refunded on one service request.
    distinguish_by: [homeplan_service_request_id, fee_type]
    fields:
      entry_date: The refund date.
      amount: The amount refunded, positive.
      homeplan_service_request_id: The service request whose fee is refunded.
      fee_type: The fee type being refunded.
      fee_refund_reason: Why the fee is refunded.
    account: service_fee_balance
    direction: out
    triggers: []
  # ---- service requests ----
  - type: homeplan_service_request
    target: homeplan_service_requests
    meaning: The customer reports a failure of one item and asks for service.
    grain: One row per item failure reported (one trade per request).
    distinguish_by: [homeplan_service_request_id]
    fields:
      homeplan_service_request_id: The service request number.
      request_date: The date the request was placed.
      covered_item: The item that failed.
      trade: The trade that services the item.
      request_type: A new failure, a recall under a guarantee, or a second opinion.
      urgency: Emergency or routine.
      service_window: Whether the customer asks for a business-hours or after-hours visit.
      failure_description: The customer's description of the failure, verbatim.
      prior_authorization_number: For a recall, the authorization number of the earlier repair or replacement; for a second opinion, empty.
    triggers:
      - event: homeplan:homeplan_service_fee_charge
        when: {request_type: new_failure}
        map: {homeplan_service_request_id: homeplan_service_request_id, fee_type: standard_visit}
      - event: homeplan:homeplan_service_fee_charge
        when: {request_type: second_opinion}
        map: {homeplan_service_request_id: homeplan_service_request_id, fee_type: second_opinion}
      - event: homeplan:homeplan_service_fee_charge
        when: {urgency: routine, service_window: after_hours}
        map: {homeplan_service_request_id: homeplan_service_request_id, fee_type: after_hours_surcharge}
  # ---- claim handling ----
  - type: homeplan_contractor_dispatch
    target: homeplan_claim_events
    meaning: A contractor is assigned to a service request, or the customer is pre-authorized to use their own licensed contractor.
    grain: One row per assignment on one service request.
    distinguish_by: [homeplan_service_request_id, dispatch_sequence]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The assignment date.
      service_contractor_id: The network contractor assigned; empty for an out-of-network authorization.
      dispatch_sequence: 1 for the first assignment on the request, incremented for each further assignment.
      dispatch_reason: Initial assignment, re-dispatch after a missed contact window, second opinion, recall, or out-of-network authorization.
    triggers: []
  - type: homeplan_coverage_determination
    target: homeplan_claim_events
    meaning: Bridgewell decides whether the reported failure is covered.
    grain: One row per determination stage on one service request.
    distinguish_by: [homeplan_service_request_id, determination_stage]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The determination date.
      covered_item: The item the determination concerns.
      determination_stage: Initial determination or the review after a second opinion.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered; empty when covered.
    triggers: []
  - type: homeplan_repair_authorization
    target: homeplan_claim_events
    meaning: Bridgewell authorizes the contractor to repair the covered item.
    grain: One row per repair authorization number.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The authorization date.
      covered_item: The item repaired.
      authorization_number: The authorization number issued.
      repair_estimate: The contractor's repair estimate.
      replacement_cost: Bridgewell's contracted replacement cost for a like unit (equipment plus installation).
      amount: The amount Bridgewell pays toward the repair.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_replacement_authorization
    target: homeplan_claim_events
    meaning: Bridgewell decides to replace the covered item with a unit of like capacity and efficiency.
    grain: One row per replacement authorization number.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The authorization date.
      covered_item: The item replaced.
      authorization_number: The authorization number issued.
      repair_estimate: The contractor's repair estimate that was compared.
      replacement_cost: Bridgewell's contracted replacement cost (equipment plus installation).
      replacement_basis: Why replacement was chosen over repair.
      amount: The amount Bridgewell pays toward the replacement.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_supplemental_allowance
    target: homeplan_claim_events
    meaning: Bridgewell pays a supplemental allowance attached to a covered repair or replacement (code violation, permit, haul-away, refrigerant, crane access or slab access).
    grain: One row per allowance type on one service request.
    distinguish_by: [homeplan_service_request_id, allowance_type]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The authorization date.
      allowance_type: Which allowance.
      invoice_amount: The documented cost of the work the allowance pays toward.
      amount: The amount paid under the allowance.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_cash_in_lieu_offer
    target: homeplan_claim_events
    meaning: Bridgewell offers cash in place of providing a replacement unit.
    grain: One row per offer on one service request.
    distinguish_by: [homeplan_service_request_id, settlement_basis]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The offer date.
      covered_item: The item the offer concerns.
      replacement_cost: Bridgewell's contracted replacement cost used as the offer basis.
      amount: The cash offered.
      settlement_basis: Whether Bridgewell elected cash or the customer asked for cash in place of an authorized replacement.
      offer_expiration_date: The last day the offer may be accepted.
    triggers: []
  - type: homeplan_cash_in_lieu_payment
    target: homeplan_claim_events
    meaning: The customer accepts a cash-in-lieu offer and Bridgewell pays it.
    grain: One row per accepted offer.
    distinguish_by: [homeplan_service_request_id, authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The acceptance date.
      covered_item: The item settled in cash.
      authorization_number: The cash settlement authorization number issued.
      amount: The cash paid.
      settlement_basis: Copied from the accepted offer.
      reversed_authorization_number: For a customer-elected settlement, the replacement authorization number it replaces; empty otherwise.
    account: benefit_consumed
    direction: in
    triggers:
      - event: homeplan:homeplan_authorization_reversal
        when: {settlement_basis: customer_elected}
        map: {homeplan_service_request_id: homeplan_service_request_id, reversed_authorization_number: reversed_authorization_number, reversal_reason: cash_in_lieu_elected}
  - type: homeplan_out_of_network_reimbursement
    target: homeplan_claim_events
    meaning: Bridgewell reimburses the customer for a pre-authorized licensed contractor of their choosing.
    grain: One row per reimbursement authorization number.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The reimbursement date.
      covered_item: The item repaired.
      authorization_number: The reimbursement authorization number.
      invoice_amount: The contractor invoice the customer submitted.
      amount: The amount reimbursed.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_authorization_reversal
    target: homeplan_claim_events
    meaning: A repair or replacement authorization is reversed because the work will not be performed.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The reversal date.
      reversed_authorization_number: The authorization number being reversed.
      reversal_reason: Why it is reversed.
      amount: The authorized amount being reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []
  - type: homeplan_work_completion
    target: homeplan_claim_events
    meaning: The contractor reports that the authorized repair or replacement has been completed.
    grain: One row per authorization completed.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The completion date.
      authorization_number: The repair or replacement authorization completed.
      covered_item: The item worked on.
    triggers: []

measures:
  - id: homeplan_msr_item_benefit_paid_term
    window: The contract term in which the service request's request_date falls (term_start_date through term_end_date of that term).
    measure: Sum of amount on homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_cash_in_lieu_payment and homeplan_out_of_network_reimbursement rows for the same covered_item on the contract whose service request falls in the window, minus amount on homeplan_authorization_reversal rows reversing any of those authorizations.
  - id: homeplan_msr_term_benefit_paid
    window: The contract term in which the service request's request_date falls; for a cancellation, the current term as of notice_date.
    measure: Sum of amount on every benefit_consumed in-event (repair, replacement, supplemental allowance, cash in lieu, out-of-network reimbursement) on the contract whose service request falls in the window, minus amount on homeplan_authorization_reversal rows for those authorizations.
  - id: homeplan_msr_term_refrigerant_paid
    window: The current contract term (term_start_date through term_end_date).
    measure: Sum of amount on homeplan_supplemental_allowance rows with allowance_type refrigerant on the contract whose service request falls in the window.
  - id: homeplan_msr_term_premium_paid
    window: The current contract term as of the cancellation notice_date (term_start_date through notice_date).
    measure: Sum of amount on homeplan_premium_payment rows with entry_date in the window, minus amount on homeplan_premium_charge rows with charge_type returned_payment in the window.
  - id: homeplan_msr_unexpired_term_days
    window: The current contract term as of the cancellation notice_date.
    measure: Count of calendar days from the day after notice_date through term_end_date inclusive (0 when notice_date is on or after term_end_date).
  - id: homeplan_msr_term_days
    window: The current contract term.
    measure: Count of calendar days from term_start_date through term_end_date inclusive.
  - id: homeplan_msr_days_since_start
    window: From the original start_date to the cancellation notice_date.
    measure: Count of calendar days from the day after start_date through notice_date inclusive.
  - id: homeplan_msr_oldest_unpaid_due_date
    window: All premium charges on the contract up to frozen time.
    measure: The billing_period_start of the oldest monthly_installment or annual_premium charge not fully covered by payments and credits applied oldest charge first.

policies:
  - id: homeplan_agg_multi_holding
    subject: [homeplan_enrollment]
    rule: >-
      A customer may hold any number of homeowner service contracts, one for each distinct property they own
      and occupy as a residence. How many contracts one property may carry is governed by
      homeplan_agg_one_contract_per_property.
    eligibility: []
    params:
      max_per_customer: null

  - id: homeplan_agg_one_contract_per_property
    subject: [homeplan_enrollment]
    rule: >-
      A property address may carry only one homeowner service contract at a time.
      A new homeowner service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      Homeowner coverage and rental property coverage are mutually exclusive for the same property:
      a new homeowner service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      A real estate contract for the same address in status active or closed_pending_payment also blocks a new homeowner service contract, except a realty_conversion enrollment that continues that real estate contract.
      Contracts in status expired or cancelled never block a new enrollment. Addresses are compared exactly as
      recorded on each contract.
    eligibility:
      - id: no_open_homeowner_contract_on_property
        applies_to: [homeplan_enrollment]
        kind: dedup
        condition: "A new homeowner service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [homeplan_contracts.property_address, homeplan_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.property_address]
          action_bindings:
            homeplan_contracts.property_address: property_address
        dedup_contract:
          table: homeplan_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []
      - id: no_open_rental_contract_on_property
        applies_to: [homeplan_enrollment]
        kind: dedup
        condition: "a new homeowner service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [landlord_contracts.property_address, landlord_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.property_address]
          action_bindings:
            landlord_contracts.property_address: property_address
        dedup_contract:
          table: landlord_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []
      - id: no_open_realty_contract_on_property
        applies_to: [homeplan_enrollment]
        kind: dedup
        condition: "A real estate contract for the same address in status active or closed_pending_payment also blocks a new homeowner service contract, except a realty_conversion enrollment that continues that real estate contract."
        evidence_fields: [realty_contracts.property_address, realty_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.property_address]
          action_bindings:
            realty_contracts.property_address: property_address
        dedup_contract:
          table: realty_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [active, closed_pending_payment]}
          distinct_fields: []

  - id: homeplan_enrollment_terms
    subject: [homeplan_enrollment, homeplan_coverage_activation]
    rule: >-
      Enrollment is open only to owner-occupied residential properties whose property type and living-area square footage satisfy the entry gate of the tier purchased.
      Properties rented to tenants or used commercially are enrolled under rental property service contracts
      instead, and the property type and square footage are taken from the customer's statement at enrollment.
      The service call fee elected must be one of the tier's low_fee_option_amount, standard_service_call_fee or
      high_fee_option_amount, and billing_frequency is monthly or annual. Each term lasts contract_term_months
      calendar months: term_end_date is the day before the same calendar day contract_term_months later, falling
      back to the last day of the month when that day does not exist. For an online or phone enrollment,
      coverage_effective_date is start_date plus waiting_period_days calendar days and the contract stays in
      waiting_period until then.
      For an online or phone enrollment, the contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero.
      A realty_conversion enrollment continues a real estate contract held by the same customer for the same
      property address, has coverage_effective_date equal to start_date and activates immediately.
      A realty_conversion enrollment keeps continuous coverage only when its start date is no later than conversion_continuity_days calendar days after the day the real estate contract term ends; the day count starts the day after the real estate term_end_date and the boundary day itself qualifies.
      A conversion requested later than that is enrolled as a phone enrollment with the normal waiting period.
    eligibility:
      - id: owner_occupied_property_within_entry_gate
        applies_to: [homeplan_enrollment]
        kind: caller_fact
        condition: "Enrollment is open only to owner-occupied residential properties whose property type and living-area square footage satisfy the entry gate of the tier purchased."
        evidence_fields: [homeplan_contracts.property_address, homeplan_contracts.property_type, homeplan_contracts.square_footage]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.property_address]
          action_bindings:
            homeplan_contracts.property_address: property_address
      - id: waiting_period_elapsed_before_activation
        applies_to: [homeplan_coverage_activation]
        kind: time
        condition: "For an online or phone enrollment, the contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero."
        evidence_fields: [homeplan_contracts.start_date, homeplan_contracts.enrollment_channel, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract is purchased
          anchor_source: homeplan_contracts.start_date
          relation: not_before
          duration_source: variants.waiting_period_days
          unit: calendar_days
          counting_rule: counting the purchase date as day zero
          boundary: inclusive
      - id: conversion_within_continuity_window
        applies_to: [homeplan_enrollment, homeplan_coverage_activation]
        kind: time
        condition: "A realty_conversion enrollment keeps continuous coverage only when its start date is no later than conversion_continuity_days calendar days after the day the real estate contract term ends; the day count starts the day after the real estate term_end_date and the boundary day itself qualifies."
        evidence_fields: [realty_contracts.term_end_date, realty_contracts.realty_contract_id, realty_contracts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the real estate contract term ends
          anchor_source: realty_contracts.term_end_date
          relation: not_after
          duration_source: variants.conversion_continuity_days
          unit: calendar_days
          counting_rule: the day count starts the day after the real estate term_end_date and the boundary day itself qualifies
          boundary: inclusive

  - id: homeplan_premium_pricing
    subject: [homeplan_premium_charge, homeplan_enrollment, homeplan_renewal, homeplan_late_renewal]
    rule: >-
      The monthly installment for a tier equals monthly_premium, plus low_fee_monthly_surcharge when the
      contract's service_call_fee equals low_fee_option_amount, minus high_fee_monthly_discount when it equals
      high_fee_option_amount, plus oversize_home_monthly_surcharge when square_footage is at or above
      oversize_home_threshold_sqft, minus condo_townhome_monthly_discount when property_type is condominium or
      townhome; the adjustments are flat amounts added together, never compounded. A monthly-billed contract is
      charged one monthly_installment per billing period; each billing period starts on the same calendar day of
      the month as term_start_date (the last day of the month when that day does not exist) and the installment
      is due on the period start. An annual-billed contract is charged one annual_premium per term on
      term_start_date, equal to twelve monthly installments reduced by annual_pay_discount_rate and rounded to the
      cent. Renewal and late-renewal terms are priced with the tier parameters in force on the new term start
      date for the tier held for that term. A returned premium payment is billed back as a returned_payment charge
      equal to the returned amount together with one returned_payment_fee charge of returned_payment_fee, both
      carrying the confirmation number of the returned payment.
      Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment.
      No premium is billed for any period after a contract's end_date.
    eligibility:
      - id: premium_billed_only_on_open_contract
        applies_to: [homeplan_premium_charge]
        kind: state
        condition: "Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [waiting_period, active, suspended_nonpayment]
    params:
      per_tier:
        Bridgewell ApplianceCare: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell SystemsCare: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Bronze: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Silver: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Gold: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Platinum: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
    formula:
      monthly_installment: "monthly_premium + (low_fee_monthly_surcharge if service_call_fee == low_fee_option_amount else 0) - (high_fee_monthly_discount if service_call_fee == high_fee_option_amount else 0) + (oversize_home_monthly_surcharge if square_footage >= oversize_home_threshold_sqft else 0) - (condo_townhome_monthly_discount if property_type in ['condominium', 'townhome'] else 0)"
      annual_premium: "round(monthly_installment * 12 * (1 - annual_pay_discount_rate), 2)"

  - id: homeplan_evt_premium_collection_and_nonpayment
    subject: [homeplan_premium_payment, homeplan_nonpayment_suspension, homeplan_reinstatement, homeplan_nonpayment_cancellation]
    rule: >-
      A premium payment is applied to premium_balance, oldest unpaid charge first. The installment that drives
      nonpayment handling is the oldest unpaid one (homeplan_msr_oldest_unpaid_due_date).
      Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends.
      While a contract is suspended_nonpayment no service request is accepted and no contractor is dispatched.
      A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies.
      Reinstatement does not restart the waiting period and does not change term dates, and failures first
      reported while suspended are not covered.
      A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date.
      On a nonpayment cancellation the cancellation admin fee is not charged and no refund is due, and premium
      already billed for periods before the cancellation remains owed. Payments received on a cancelled or expired
      contract are applied to its remaining balance but never reinstate it.
    eligibility:
      - id: grace_period_passed_before_suspension
        applies_to: [homeplan_nonpayment_suspension]
        kind: time
        condition: "Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends."
        evidence_fields: [homeplan_billing_entries.billing_period_start, homeplan_billing_entries.homeplan_contract_id, homeplan_contracts.premium_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_billing_entries.homeplan_contract_id]
          action_bindings:
            homeplan_billing_entries.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment's due date
          anchor_source: homeplan_billing_entries.billing_period_start
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after the due date, and suspension applies from the first day after the grace period ends
          boundary: exclusive
      - id: cure_within_window_for_reinstatement
        applies_to: [homeplan_reinstatement]
        kind: time
        condition: "A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies."
        evidence_fields: [homeplan_contracts.suspended_date, homeplan_contracts.premium_balance, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: homeplan_contracts.suspended_date
          relation: not_after
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: the count starts the day after suspended_date and the boundary day itself qualifies
          boundary: inclusive
      - id: cure_window_lapsed_before_cancellation
        applies_to: [homeplan_nonpayment_cancellation]
        kind: time
        condition: "A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date."
        evidence_fields: [homeplan_contracts.suspended_date, homeplan_contracts.premium_balance, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: homeplan_contracts.suspended_date
          relation: not_before
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: counted from the day after suspended_date
          boundary: exclusive
    measures: [homeplan_msr_oldest_unpaid_due_date]

  - id: homeplan_renewal_terms
    subject: [homeplan_renewal_notice, homeplan_renewal_preference_change, homeplan_renewal, homeplan_expiration, homeplan_late_renewal]
    rule: >-
      Bridgewell issues one renewal notice per term stating the renewal tier, service call fee option and price.
      A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies.
      When auto_renew is false, or the renewal notice was not issued in time, the contract expires at the end of
      term_end_date unless the customer affirmatively asks to renew before then, in which case it renews on the
      terms stated for the renewal. The customer may turn auto_renew off or on at any time before term_end_date.
      A renewed term starts the day after the prior term_end_date and keeps continuous coverage with no new
      waiting period. A downgrade to a lower tier or a change of service call fee option takes effect only at
      renewal; items no longer covered after a downgrade stop being covered on the new term start date, and
      service requests opened before then are completed under the prior tier. Per-item caps, the aggregate limit
      and the refrigerant allowance restart with each new term.
      An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies.
      A late renewal starts a new full term on the late renewal date, and failures that began between the term end
      and the late renewal are not covered. After the late-renewal grace period an expired contract cannot be
      renewed and the customer must purchase a new contract with a new waiting period.
    eligibility:
      - id: renewal_notice_issued_in_time
        applies_to: [homeplan_renewal]
        kind: time
        condition: "A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies."
        evidence_fields: [homeplan_contracts.renewal_notice_date, homeplan_contracts.term_end_date, homeplan_contracts.auto_renew, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal notice for the expiring term was issued
          anchor_source: homeplan_contracts.renewal_notice_date
          relation: not_before
          duration_source: variants.renewal_notice_days
          unit: calendar_days
          counting_rule: counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies
          boundary: inclusive
      - id: late_renewal_within_grace
        applies_to: [homeplan_late_renewal]
        kind: time
        condition: "An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies."
        evidence_fields: [homeplan_contracts.term_end_date, homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its term end
          anchor_source: homeplan_contracts.term_end_date
          relation: not_after
          duration_source: variants.late_renewal_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after term_end_date and the boundary day itself qualifies
          boundary: inclusive

  - id: homeplan_plan_upgrade_rules
    subject: [homeplan_plan_upgrade, homeplan_premium_charge]
    rule: >-
      A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active.
      An upgrade moves to any higher-ranked tier; a move to a lower-ranked tier is a downgrade and is processed only
      at renewal under homeplan_renewal_terms. The upgrade takes effect on the date the customer requests it,
      records the tier held before it as prior_variant_name, and keeps the current term dates. For a monthly-billed
      contract, installments for billing periods starting on or after the upgrade date are billed at the new tier's
      monthly installment and no proration is billed. For an annual-billed contract, one upgrade_proration charge is
      billed on the upgrade date, equal to the new tier's annual premium minus the current tier's annual premium
      (each computed for this contract under homeplan_premium_pricing), multiplied by
      homeplan_msr_unexpired_term_days and divided by homeplan_msr_term_days, rounded to the cent; for this
      purpose the two day counts are taken as of the upgrade date. When to cover items and higher limits added
      by an upgrade is governed by homeplan_evt_coverage_determination.
    eligibility:
      - id: upgrade_allowed_on_open_contract
        applies_to: [homeplan_plan_upgrade]
        kind: state
        condition: "A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.variant_name, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [waiting_period, active]
    params:
      per_tier:
        Bridgewell ApplianceCare: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell SystemsCare: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Bronze: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Silver: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Gold: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Platinum: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
    measures: [homeplan_msr_unexpired_term_days, homeplan_msr_term_days]

  - id: homeplan_cancellation_and_refund
    subject: [homeplan_cancellation, homeplan_premium_credit, homeplan_premium_refund]
    rule: >-
      A cancellation starts when the customer gives notice: the agent records the notice on a cancellation
      request whose notice_date is the date the customer gives notice, and the customer then confirms it.
      A contract is cancelled only after the customer has confirmed the cancellation request on file.
      The cancellation is effective on notice_date and is never backdated before it. The cancellation credit is
      computed as of notice_date. The free-look period covers a notice given within free_look_days calendar days
      after start_date, counted from the day after start_date with the boundary day included
      (homeplan_msr_days_since_start), and applies only in the first term. Within the free-look period the credit
      is all premium paid for the current term (homeplan_msr_term_premium_paid) less the benefit Bridgewell has
      paid in the term (homeplan_msr_term_benefit_paid), and no admin fee applies. After the free-look period, an
      annual-billed contract is credited the unearned share of premium paid for the current term
      (homeplan_msr_term_premium_paid times homeplan_msr_unexpired_term_days divided by homeplan_msr_term_days,
      rounded to the cent), less cancellation_admin_fee, less homeplan_msr_term_benefit_paid; a monthly-billed
      contract is credited nothing for installments already billed, is charged no admin fee, and is billed no
      further installments. The credit is never negative: a result below zero is posted as a zero credit and the
      difference is not billed to the customer. Service call fees are never returned through a cancellation.
      A cancellation credit is posted only after the customer has confirmed the cancellation request on file.
      Only one cancellation credit and one refund are posted per cancellation request.
      The credit is first applied to unpaid premium for periods before notice_date, and any credit balance left
      is refunded to the original payment method within refund_processing_days calendar days after the
      cancellation is confirmed.
    eligibility:
      - id: cancellation_confirmed_by_customer
        applies_to: [homeplan_cancellation]
        kind: authorization
        condition: "A contract is cancelled only after the customer has confirmed the cancellation request on file."
        evidence_fields: [homeplan_cancellation_requests.request_status, homeplan_cancellation_requests.homeplan_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_cancellation_requests.homeplan_cancellation_request_id]
          action_bindings:
            homeplan_cancellation_requests.homeplan_cancellation_request_id: homeplan_cancellation_request_id
      - id: credit_after_confirmed_request
        applies_to: [homeplan_premium_credit]
        kind: authorization
        condition: "A cancellation credit is posted only after the customer has confirmed the cancellation request on file."
        evidence_fields: [homeplan_cancellation_requests.request_status, homeplan_cancellation_requests.homeplan_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_cancellation_requests.homeplan_cancellation_request_id]
          action_bindings:
            homeplan_cancellation_requests.homeplan_cancellation_request_id: homeplan_cancellation_request_id
      - id: one_credit_and_refund_per_request
        applies_to: [homeplan_premium_credit, homeplan_premium_refund]
        kind: dedup
        condition: "Only one cancellation credit and one refund are posted per cancellation request."
        evidence_fields: [homeplan_billing_entries.homeplan_cancellation_request_id, homeplan_billing_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_billing_entries.homeplan_cancellation_request_id]
          action_bindings:
            homeplan_billing_entries.homeplan_cancellation_request_id: homeplan_cancellation_request_id
        dedup_contract:
          table: homeplan_billing_entries
          mode: separate_record
          object_bindings: {homeplan_cancellation_request_id: homeplan_cancellation_request_id, event_type: event_type}
          duplicate_filters: {event_type: [homeplan_premium_credit, homeplan_premium_refund]}
          distinct_fields: []
    formula:
      within_free_look: "homeplan_msr_days_since_start <= free_look_days and term_number == 1"
      prorata_credit: "round(homeplan_msr_term_premium_paid * homeplan_msr_unexpired_term_days / homeplan_msr_term_days, 2)"
      cancellation_credit: "max(0, homeplan_msr_term_premium_paid - homeplan_msr_term_benefit_paid) if within_free_look else (0 if billing_frequency == 'monthly' else max(0, prorata_credit - cancellation_admin_fee - homeplan_msr_term_benefit_paid))"
    measures: [homeplan_msr_days_since_start, homeplan_msr_term_premium_paid, homeplan_msr_unexpired_term_days, homeplan_msr_term_days, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_service_request_and_fees
    subject: [homeplan_service_request, homeplan_service_fee_charge, homeplan_service_fee_refund]
    rule: >-
      A service request covers one failed item serviced by one trade; a failure that needs two trades is placed as
      two requests, each carrying its own fee.
      Service requests are accepted only while the contract status is active.
      A new_failure request is charged the contract's service_call_fee once.
      A recall request is charged no fee when it concerns the same covered item as an earlier authorization on the contract and is placed no later than repair_guarantee_days calendar days after that earlier repair is completed (replacement_labor_guarantee_days for a Bridgewell-provided replacement); the count starts the day after the completion date and the boundary day itself qualifies.
      A return visit placed after that window is a new_failure request and carries the fee. A second-opinion
      request may be placed only after an initial determination on the same item, and is charged the contract's
      service_call_fee multiplied by second_opinion_fee_rate and rounded to the cent; when that amount is zero no
      fee is posted. A routine request for which the customer asks for an after-hours visit is also charged
      after_hours_non_emergency_surcharge; emergency requests never carry the surcharge, and nothing is posted when
      the tier's surcharge is zero. A request is an emergency when the failure leaves the home without heat while
      the outdoor temperature is below no_heat_outdoor_temp_f, without cooling while it is above
      no_cooling_outdoor_temp_f, without running water, or without electrical power, or causes an active water
      leak that cannot be stopped at a fixture shutoff; every other request is routine.
      The fee of each fee type is charged at most once per service request.
      When fee_refund_before_dispatch is true and the customer cancels the request before any contractor dispatch is recorded for it, the fees collected on that request are refunded in full.
      Fees are not refunded because a failure is determined not covered, because the customer declines a covered
      repair or replacement, or because the customer accepts cash in lieu. A fee collected in error, such as a
      standard fee on a qualifying recall, is refunded with fee_refund_reason charged_in_error.
    eligibility:
      - id: requests_only_on_active_contract
        applies_to: [homeplan_service_request]
        kind: state
        condition: "Service requests are accepted only while the contract status is active."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [active]
      - id: recall_within_guarantee_window
        applies_to: [homeplan_service_fee_charge]
        kind: time
        condition: "A recall request is charged no fee when it concerns the same covered item as an earlier authorization on the contract and is placed no later than repair_guarantee_days calendar days after that earlier repair is completed (replacement_labor_guarantee_days for a Bridgewell-provided replacement); the count starts the day after the completion date and the boundary day itself qualifies."
        evidence_fields: [homeplan_claim_events.event_date, homeplan_claim_events.authorization_number, homeplan_claim_events.covered_item]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.authorization_number]
          action_bindings:
            homeplan_claim_events.authorization_number: prior_authorization_number
        temporal_basis:
          clock: frozen_time
          anchor_event: that earlier repair is completed
          anchor_source: homeplan_claim_events.event_date
          relation: not_after
          duration_source: variants.repair_guarantee_days
          unit: calendar_days
          counting_rule: the count starts the day after the completion date and the boundary day itself qualifies
          boundary: inclusive
      - id: one_fee_per_type_per_request
        applies_to: [homeplan_service_fee_charge]
        kind: dedup
        condition: "The fee of each fee type is charged at most once per service request."
        evidence_fields: [homeplan_billing_entries.homeplan_service_request_id, homeplan_billing_entries.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_billing_entries.homeplan_service_request_id, homeplan_billing_entries.fee_type]
          action_bindings:
            homeplan_billing_entries.homeplan_service_request_id: homeplan_service_request_id
            homeplan_billing_entries.fee_type: fee_type
        dedup_contract:
          table: homeplan_billing_entries
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id, fee_type: fee_type}
          duplicate_filters: {event_type: [homeplan_service_fee_charge]}
          distinct_fields: []
      - id: fee_refund_only_before_dispatch
        applies_to: [homeplan_service_fee_refund]
        kind: authorization
        condition: "When fee_refund_before_dispatch is true and the customer cancels the request before any contractor dispatch is recorded for it, the fees collected on that request are refunded in full."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
    params:
      no_heat_outdoor_temp_f: 40
      no_cooling_outdoor_temp_f: 90
      per_tier:
        Bridgewell ApplianceCare: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell SystemsCare: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Bronze: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Silver: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Gold: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Platinum: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
    formula:
      standard_fee: "service_call_fee if request_type == 'new_failure' else 0"
      second_opinion_fee: "round(service_call_fee * second_opinion_fee_rate, 2) if request_type == 'second_opinion' else 0"
      after_hours_fee: "after_hours_non_emergency_surcharge if (urgency == 'routine' and service_window == 'after_hours') else 0"

  - id: homeplan_evt_contractor_dispatch
    subject: [homeplan_contractor_dispatch]
    rule: >-
      A contractor is dispatched only on a service request whose contract status is active.
      The request is assigned to a network contractor whose trade matches the request's trade and whose service
      ZIP codes include the property_zip; preferred contractors are chosen before standard ones, suspended
      contractors are never assigned, and an emergency request is assigned only to a contractor offering emergency
      service. Among equally ranked eligible contractors the one whose service contractor reference sorts first
      alphabetically is assigned. The assigned contractor must contact the customer within routine_contact_hours
      hours for a routine request or emergency_contact_hours hours for an emergency request, measured from the
      dispatch. When the assigned contractor misses the contact window, the request is re-dispatched to the next
      eligible contractor with dispatch_reason redispatch_missed_contact. When no eligible network contractor
      exists for the trade and ZIP code, or two consecutive assigned contractors miss the contact window,
      Bridgewell pre-authorizes the customer to use a licensed contractor of their choosing by recording an
      assignment with dispatch_reason out_of_network_authorized and no contractor reference. A second-opinion
      request is assigned to an eligible contractor other than the one that made the initial diagnosis, and a
      recall request is assigned to the contractor that performed the original work unless that contractor is now
      suspended, in which case it is assigned as an initial request. Each assignment on a request carries the next
      dispatch_sequence number, starting at 1.
    eligibility:
      - id: dispatch_only_on_active_contract
        applies_to: [homeplan_contractor_dispatch]
        kind: state
        condition: "A contractor is dispatched only on a service request whose contract status is active."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell ApplianceCare: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell SystemsCare: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Bronze: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Silver: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Gold: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Platinum: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}

  - id: homeplan_evt_coverage_determination
    subject: [homeplan_coverage_determination]
    rule: >-
      A failure is covered only when every condition below holds; otherwise the determination is not_covered with
      the first failing reason in this order. (1) contract_not_in_force: the contract was active on the request
      date. (2) waiting_period: the failure was first reported on or after coverage_effective_date.
      For an item or a higher limit added by a mid-term upgrade, the failure must also be first reported at least upgrade_waiting_period_days calendar days after the upgrade takes effect; the count starts the day after last_plan_change_date and the boundary day itself qualifies.
      Until then such an item is determined under prior_variant_name, and an item that tier did not cover fails
      with waiting_period. (3) item_not_in_plan: the tier's cap for the covered item is greater than 0.00.
      (4) preexisting_condition: the failure did not arise from a condition that existed before
      coverage_effective_date; known or visually detectable pre-existing conditions are never covered, and
      unknown, undetectable pre-existing conditions are covered only when the tier's unknown_preexisting_covered is
      true. (5) improper_installation: a failure caused by improper prior installation, prior repair or a code
      violation in the original installation is covered only when improper_installation_covered is true.
      (6) misuse_or_external_damage: failures from misuse, abuse, pests, weather, fire, flood or other external
      causes are never covered. (7) cosmetic_only: defects that do not affect operation are never covered.
      (8) cap_exhausted: the remaining item benefit and the remaining aggregate benefit under
      homeplan_evt_benefit_caps are both above zero. Conditions (1) to (3) and (8) are decided from the contract,
      request and payment records and may be determined without a dispatch; conditions (4) to (7) are decided
      from the dispatched contractor's diagnosis.
      An initial determination is issued once per service request.
      After a second opinion, one review determination is issued on the original request; the review outcome
      replaces the initial outcome and any authorization follows the review outcome.
    eligibility:
      - id: one_determination_per_stage
        applies_to: [homeplan_coverage_determination]
        kind: dedup
        condition: "An initial determination is issued once per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.determination_stage]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.determination_stage]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
            homeplan_claim_events.determination_stage: determination_stage
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id, determination_stage: determination_stage}
          duplicate_filters: {event_type: [homeplan_coverage_determination]}
          distinct_fields: []
      - id: upgrade_items_waiting_period
        applies_to: [homeplan_coverage_determination]
        kind: time
        condition: "For an item or a higher limit added by a mid-term upgrade, the failure must also be first reported at least upgrade_waiting_period_days calendar days after the upgrade takes effect; the count starts the day after last_plan_change_date and the boundary day itself qualifies."
        evidence_fields: [homeplan_contracts.last_plan_change_date, homeplan_contracts.prior_variant_name, homeplan_service_requests.request_date, homeplan_service_requests.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_service_requests.homeplan_service_request_id]
          action_bindings:
            homeplan_service_requests.homeplan_service_request_id: homeplan_service_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the upgrade takes effect
          anchor_source: homeplan_contracts.last_plan_change_date
          relation: not_before
          duration_source: variants.upgrade_waiting_period_days
          unit: calendar_days
          counting_rule: the count starts the day after last_plan_change_date and the boundary day itself qualifies
          boundary: inclusive
    params:
      per_tier:
        Bridgewell ApplianceCare: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell SystemsCare: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Bronze: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Silver: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Gold: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Platinum: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_repair_or_replace
    subject: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_authorization_reversal, homeplan_work_completion]
    rule: >-
      Repair or replacement is authorized only after a covered determination is on file for the service request.
      Bridgewell, not the customer, chooses between repair and replacement. Bridgewell replaces the item when the
      contractor's repair_estimate is at or above repair_to_replace_threshold_rate times replacement_cost
      (replacement_basis repair_cost_threshold), when the parts needed cannot be obtained within
      parts_lead_time_replace_days calendar days (parts_unavailable), or when the contractor certifies the item
      cannot be repaired (not_repairable); otherwise it repairs. A replacement is a unit of similar features,
      capacity and efficiency, not of identical brand, color or dimensions, and where current efficiency
      standards require a different unit the standard-compliant unit is provided. The amount Bridgewell pays on an
      authorization is the lowest of the cost of the chosen work (repair_estimate for a repair, replacement_cost for
      a replacement), the remaining item benefit and the remaining aggregate benefit under
      homeplan_evt_benefit_caps. When the cost exceeds the amount paid, the customer may pay the difference to the
      contractor to have the work done, or decline the work. A customer who wants an upgraded model pays the
      difference between the like unit and the upgraded unit directly to the contractor.
      Only one repair or replacement authorization is open per service request; a new authorization on the same request requires reversing the earlier one first.
      An authorization is reversed in full, never in part, when the customer declines the work
      (customer_declined_work), when cash in lieu replaces it (cash_in_lieu_elected), or when it duplicated
      another authorization (duplicate_authorization); a completed authorization is never reversed. The
      contractor's completion report closes the authorization and starts the repair guarantee or the replacement
      labor guarantee.
    eligibility:
      - id: covered_determination_on_file
        applies_to: [homeplan_repair_authorization, homeplan_replacement_authorization]
        kind: authorization
        condition: "Repair or replacement is authorized only after a covered determination is on file for the service request."
        evidence_fields: [homeplan_claim_events.determination_outcome, homeplan_claim_events.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
      - id: one_open_authorization_per_request
        applies_to: [homeplan_repair_authorization, homeplan_replacement_authorization]
        kind: dedup
        condition: "Only one repair or replacement authorization is open per service request; a new authorization on the same request requires reversing the earlier one first."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type, homeplan_claim_events.reversed_authorization_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id}
          duplicate_filters: {event_type: [homeplan_repair_authorization, homeplan_replacement_authorization]}
          distinct_fields: [authorization_number]
    params:
      per_tier:
        Bridgewell ApplianceCare: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell SystemsCare: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Bronze: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Silver: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Gold: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Platinum: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
    formula:
      replace_by_cost: "repair_estimate >= repair_to_replace_threshold_rate * replacement_cost"
      repair_amount: "min(repair_estimate, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid)"
      replacement_amount: "min(replacement_cost, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid)"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_benefit_caps
    subject: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement]
    rule: >-
      Each covered item has a per-term cap equal to the tier parameter that item_cap maps it to; the cap is shared by
      every repair, replacement, cash-in-lieu settlement and out-of-network reimbursement for that item in the term,
      counted by homeplan_msr_item_benefit_paid_term. Every payment on the contract, supplemental allowances
      included, counts toward aggregate_term_limit, counted by homeplan_msr_term_benefit_paid. A payment counts in
      the term in which its service request's request_date falls, even when authorized after a renewal. The cap
      that applies is the one of the tier under which the request is determined; when an upgrade raised an item's
      cap, payments made before the upgrade in the same term still count against it. A reversed authorization stops
      counting from its reversal. The remaining item benefit is the item cap less
      homeplan_msr_item_benefit_paid_term and the remaining aggregate benefit is aggregate_term_limit less
      homeplan_msr_term_benefit_paid, each floored at zero; when either is zero, nothing further is paid for that
      item in the term. Supplemental allowances count toward the aggregate limit but not toward any item cap.
      Service call fees never count toward any cap and never reduce one.
    eligibility: []
    params:
      item_cap:
        heating_system: heating_system_cap
        cooling_system: cooling_system_cap
        ductwork: ductwork_cap
        plumbing_leak: plumbing_leak_cap
        plumbing_stoppage: plumbing_stoppage_cap
        water_heater: water_heater_cap
        electrical: electrical_cap
        ceiling_fan: ceiling_fan_cap
        garbage_disposal: garbage_disposal_cap
        whirlpool_tub: whirlpool_tub_cap
        refrigerator: refrigerator_cap
        oven_range_cooktop: oven_range_cooktop_cap
        dishwasher: dishwasher_cap
        built_in_microwave: built_in_microwave_cap
        clothes_washer: clothes_washer_cap
        clothes_dryer: clothes_dryer_cap
        garage_door_opener: garage_door_opener_cap
      per_tier:
        Bridgewell ApplianceCare: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell SystemsCare: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Bronze: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Silver: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Gold: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Platinum: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
    formula:
      item_remaining: "max(0, item_cap - homeplan_msr_item_benefit_paid_term)"
      aggregate_remaining: "max(0, aggregate_term_limit - homeplan_msr_term_benefit_paid)"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_supplemental_allowances
    subject: [homeplan_supplemental_allowance]
    rule: >-
      Supplemental allowances are paid only on a service request with a repair or replacement authorization that has not been reversed.
      code_violation pays toward correcting a code violation that must be corrected to complete the covered work,
      up to code_violation_allowance. permit pays toward permits the covered work requires, up to
      permit_fee_allowance. haul_away pays toward removing and disposing of equipment Bridgewell replaced, up to
      haul_away_allowance, and only on a replacement authorization. refrigerant pays toward refrigerant recovery
      and recharge on a covered cooling_system repair or replacement, up to refrigerant_allowance per term across
      all requests on the contract, less homeplan_msr_term_refrigerant_paid. crane_access pays toward crane or
      lift access to rooftop equipment, up to crane_access_allowance. slab_access pays toward opening and closing a
      concrete slab to reach a covered plumbing_leak, up to slab_leak_access_allowance. Each allowance pays the
      lowest of the documented invoice_amount, the allowance limit and the remaining aggregate benefit, and a tier
      whose allowance is 0.00 pays nothing for that type.
      Each allowance type is paid at most once per service request.
      Allowances are never paid on a cash-in-lieu settlement or an out-of-network reimbursement, because Bridgewell
      performs no installation there.
    eligibility:
      - id: live_authorization_on_request
        applies_to: [homeplan_supplemental_allowance]
        kind: authorization
        condition: "Supplemental allowances are paid only on a service request with a repair or replacement authorization that has not been reversed."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.authorization_number, homeplan_claim_events.reversed_authorization_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
      - id: one_allowance_per_type_per_request
        applies_to: [homeplan_supplemental_allowance]
        kind: dedup
        condition: "Each allowance type is paid at most once per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.allowance_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.allowance_type]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
            homeplan_claim_events.allowance_type: allowance_type
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id, allowance_type: allowance_type}
          duplicate_filters: {event_type: [homeplan_supplemental_allowance]}
          distinct_fields: []
    params:
      allowance_limit:
        code_violation: code_violation_allowance
        permit: permit_fee_allowance
        haul_away: haul_away_allowance
        refrigerant: refrigerant_allowance
        crane_access: crane_access_allowance
        slab_access: slab_leak_access_allowance
      per_tier:
        Bridgewell ApplianceCare: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell SystemsCare: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Bronze: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Silver: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Gold: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Platinum: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
    formula:
      allowance_paid: "max(0, min(invoice_amount, allowance_limit, aggregate_term_limit - homeplan_msr_term_benefit_paid))"
      refrigerant_paid: "max(0, min(invoice_amount, refrigerant_allowance - homeplan_msr_term_refrigerant_paid, aggregate_term_limit - homeplan_msr_term_benefit_paid))"
    measures: [homeplan_msr_term_refrigerant_paid, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_cash_in_lieu
    subject: [homeplan_cash_in_lieu_offer, homeplan_cash_in_lieu_payment]
    rule: >-
      Bridgewell offers cash in lieu with settlement_basis company_elected instead of providing a replacement when a
      replacement is warranted under homeplan_evt_repair_or_replace but a like unit cannot be sourced or installed
      through the network. A customer who holds a replacement authorization that is not yet completed may ask for
      cash instead, with settlement_basis customer_elected. The offer amount is Bridgewell's contracted
      replacement_cost for the like unit, limited to the remaining item benefit and the remaining aggregate benefit
      (for a customer_elected offer, computed as if the replacement authorization it replaces had already been
      reversed), and rounded to the cent; supplemental allowances and service call fees are never added.
      offer_expiration_date is cash_in_lieu_offer_validity_days calendar days after the offer date.
      Cash in lieu is paid only when the customer accepts an offer on file no later than cash_in_lieu_offer_validity_days calendar days after the offer is issued; the count starts the day after the offer date and the boundary day itself qualifies.
      Accepting is the customer's own decision and is recorded by the customer. The payment equals the accepted
      offer amount and carries the offer's settlement_basis; a customer_elected payment names the replacement
      authorization it replaces, which is reversed in full the same day. Payment is issued within
      cash_in_lieu_payment_days calendar days after acceptance. An expired offer cannot be accepted, and the agent
      may issue a new offer at the then-current contracted replacement cost.
      Cash in lieu is paid at most once per service request.
      Once cash in lieu is paid on a request, no repair or replacement is authorized on it.
    eligibility:
      - id: offer_accepted_within_validity
        applies_to: [homeplan_cash_in_lieu_payment]
        kind: time
        condition: "Cash in lieu is paid only when the customer accepts an offer on file no later than cash_in_lieu_offer_validity_days calendar days after the offer is issued; the count starts the day after the offer date and the boundary day itself qualifies."
        evidence_fields: [homeplan_claim_events.event_date, homeplan_claim_events.offer_expiration_date, homeplan_claim_events.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the offer is issued
          anchor_source: homeplan_claim_events.event_date
          relation: not_after
          duration_source: variants.cash_in_lieu_offer_validity_days
          unit: calendar_days
          counting_rule: the count starts the day after the offer date and the boundary day itself qualifies
          boundary: inclusive
      - id: one_cash_settlement_per_request
        applies_to: [homeplan_cash_in_lieu_payment]
        kind: dedup
        condition: "Cash in lieu is paid at most once per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id}
          duplicate_filters: {event_type: [homeplan_cash_in_lieu_payment]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell ApplianceCare: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell SystemsCare: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Bronze: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Silver: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Gold: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Platinum: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
    formula:
      cash_offer: "round(max(0, min(replacement_cost, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid)), 2)"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_out_of_network
    subject: [homeplan_out_of_network_reimbursement]
    rule: >-
      An out-of-network reimbursement is paid only when an assignment with dispatch_reason out_of_network_authorized and a covered determination are both on file for the service request.
      The reimbursement is the lowest of the licensed contractor's invoice_amount, out_of_network_reimbursement_cap,
      the remaining item benefit and the remaining aggregate benefit; the service call fee collected on the request
      is not refunded. Work by an unlicensed contractor or by the customer, and work performed before the
      out-of-network authorization date, is not reimbursed.
      One out-of-network reimbursement is paid per service request.
    eligibility:
      - id: out_of_network_preauthorized
        applies_to: [homeplan_out_of_network_reimbursement]
        kind: authorization
        condition: "An out-of-network reimbursement is paid only when an assignment with dispatch_reason out_of_network_authorized and a covered determination are both on file for the service request."
        evidence_fields: [homeplan_claim_events.dispatch_reason, homeplan_claim_events.determination_outcome, homeplan_claim_events.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
      - id: one_reimbursement_per_request
        applies_to: [homeplan_out_of_network_reimbursement]
        kind: dedup
        condition: "One out-of-network reimbursement is paid per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id}
          duplicate_filters: {event_type: [homeplan_out_of_network_reimbursement]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell ApplianceCare: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell SystemsCare: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Bronze: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Silver: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Gold: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Platinum: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
    formula:
      reimbursement: "max(0, min(invoice_amount, out_of_network_reimbursement_cap, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid))"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]
