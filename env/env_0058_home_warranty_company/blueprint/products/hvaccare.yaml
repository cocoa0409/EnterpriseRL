# HVAC Maintenance Agreements — Bridgewell Comfort Care memberships: scheduled precision tune-ups of a home's
# heating and cooling equipment by network HVAC contractors, with member pricing on repairs the customer pays for.
category: hvaccare
display_name: HVAC Maintenance Agreements

binding:
  holding_table: hvaccare_agreements
  event_tables: [hvaccare_billing_entries, hvaccare_visit_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {membership_balance: membership_balance, visits_remaining: visit_entitlement}

lifecycle:
  states: [enrolled, active, expired, cancelled]
  transitions:
    - {from: enrolled, to: active, by: agent, means: The qualifying inspection finds the equipment serviceable and the agent activates the agreement.}
    - {from: enrolled, to: cancelled, by: system, means: The equipment fails the qualifying inspection, or no inspection is completed in time, and the enrollment is cancelled.}
    - {from: active, to: cancelled, by: user, means: The customer cancels the agreement.}
    - {from: active, to: cancelled, by: system, means: The membership fee remains unpaid beyond the payment grace period.}
    - {from: active, to: expired, by: system, means: The term ends without renewal.}

accounts:
  - key: membership_balance
    unit: USD
    meaning: Membership fees the customer owes; positive means owed to Bridgewell, negative means a credit owed back.
  - key: visit_entitlement
    unit: visits
    meaning: Tune-up visits available to the customer in the current term.

parameter_schema:
  annual_fee: Annual membership fee for the included systems when paid in full, USD.
  monthly_fee: Monthly membership fee for the included systems, USD.
  systems_included: Number of HVAC systems the membership fee covers, count.
  additional_system_annual_fee: Annual fee for each system beyond those included (one twelfth of it is added to each monthly fee), USD.
  max_systems: Maximum number of systems on one agreement, count.
  visits_per_system_per_term: Tune-up visits per enrolled system per term, count.
  cooling_tuneup_included: Whether a cooling-season tune-up is included, boolean.
  heating_tuneup_included: Whether a heating-season tune-up is included, boolean.
  cooling_visit_window_start_month: First calendar month in which cooling tune-ups are scheduled, month number.
  cooling_visit_window_end_month: Last calendar month in which cooling tune-ups are scheduled, month number.
  heating_visit_window_start_month: First calendar month in which heating tune-ups are scheduled, month number.
  heating_visit_window_end_month: Last calendar month in which heating tune-ups are scheduled, month number.
  second_visit_min_gap_days: Minimum calendar days between two tune-ups of the same system in a term, days.
  filter_replacement_included: Whether standard 1-inch filters are replaced at each visit, boolean.
  filters_per_visit: Number of standard filters replaced per visit, count.
  condensate_drain_treatment_included: Whether the condensate drain is flushed and treated, boolean.
  refrigerant_topoff_lbs_included: Pounds of refrigerant top-off included per term per system, pounds.
  coil_cleaning_included: Whether outdoor coil cleaning is included, boolean.
  carbon_monoxide_test_included: Whether a carbon monoxide test is performed on the heating visit, boolean.
  thermostat_calibration_included: Whether the thermostat is checked and calibrated, boolean.
  water_heater_flush_included: Whether an annual water heater flush is included, boolean.
  indoor_air_quality_check_included: Whether an indoor air quality check is included, boolean.
  uv_lamp_replacement_included: Whether one UV air purifier lamp replacement per term is included, boolean.
  equipment_types_covered: Equipment types eligible for the agreement, list.
  ductless_heads_per_system: Ductless indoor heads serviced as one system, count.
  repair_discount_rate: Member discount on customer-paid repairs by network HVAC contractors, decimal fraction.
  repair_discount_cap_per_repair: Maximum member discount on one repair invoice, USD.
  overtime_charges_waived: Whether after-hours overtime charges are waived on member repairs, boolean.
  priority_scheduling_hours: Hours within which a member repair call is scheduled, hours.
  member_diagnostic_fee: Diagnostic fee a member pays on a repair call, USD.
  visit_retail_value: Retail value of one completed tune-up, deducted from a cancellation refund, USD.
  qualifying_inspection_days: Calendar days after enrollment within which the qualifying inspection must be completed, days.
  inspection_failure_full_refund: Whether all fees paid are refunded when the equipment fails the qualifying inspection, boolean.
  warranty_holder_discount_rate: Discount on the membership fee for a customer whose homeowner service contract covers the heating system at the same address, decimal fraction.
  contract_term_months: Length of each term, calendar months.
  renewal_notice_days: Minimum calendar days before term end by which the renewal notice must be issued for automatic renewal, days.
  late_renewal_grace_days: Calendar days after term end during which an expired agreement may be re-enrolled without a new qualifying inspection, days.
  cancellation_admin_fee: Administrative fee deducted from a refund after the free-look period, USD.
  free_look_days: Calendar days after the start date within which a cancellation is refunded in full less visits used, days.
  refund_processing_days: Calendar days after cancellation within which a refund is issued, days.
  payment_grace_days: Calendar days after a fee's due date before nonpayment cancels the agreement, days.
  booking_hold_days: Calendar days after a fee's due date after which new visits and member repair pricing are on hold until the balance is paid, days.
  unused_visit_carryover: Whether unused visits carry into the next term, boolean.
  visit_reschedule_notice_hours: Hours of notice needed to reschedule a booked visit without a missed-appointment fee, hours.
  missed_appointment_fee: Fee billed when the customer misses a booked visit without notice, USD.
  returned_payment_fee: Fee billed when a membership payment is returned unpaid, USD.
  transfer_allowed: Whether the agreement transfers to a new owner of the property, boolean.
  price_lock_terms: Number of terms, counting the first, during which the membership fee does not change, count.

