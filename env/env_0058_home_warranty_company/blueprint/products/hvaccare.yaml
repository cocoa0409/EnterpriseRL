events:
  - type: hvaccare_enrollment
    target: hvaccare_agreements
    mutation: create
    meaning: A customer enrolls a property's HVAC equipment in a maintenance agreement.
    grain: One row per agreement.
    fields:
      customer_id: The customer.
      variant_name: The agreement level.
      property_address: The property address as stated.
      property_zip: The property ZIP code.
      systems_enrolled: Number of systems enrolled.
      equipment_summary: The equipment enrolled, verbatim as described (for example "Trane XR14 heat pump, Carrier 59SC furnace").
      billing_frequency: Monthly or annual.
      start_date: The enrollment date.
      term_start_date: Equal to start_date.
      term_end_date: The last day of the first term.
      term_number: 1.
      auto_renew: Whether the agreement renews automatically.
    triggers:
      - event: hvaccare:hvaccare_membership_charge
        when: {billing_frequency: monthly}
        map: {charge_type: monthly_fee}
      - event: hvaccare:hvaccare_membership_charge
        when: {billing_frequency: annual}
        map: {charge_type: annual_fee}
  - type: hvaccare_qualifying_inspection
    target: hvaccare_agreements
    mutation: update
    meaning: A network contractor inspects the enrolled equipment to confirm it is serviceable.
    grain: One row per transaction.
    fields:
      inspection_date: The inspection date.
      inspection_result: passed or failed_repair_needed.
    triggers: []
  - type: hvaccare_activation
    target: hvaccare_agreements
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The agreement becomes active after a passed inspection.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers:
      - event: hvaccare:hvaccare_visit_allotment
        map: {}
  - type: hvaccare_enrollment_cancellation
    target: hvaccare_agreements
    mutation: {transition: {from: enrolled, to: cancelled}}
    meaning: The enrollment is cancelled because the equipment failed inspection or was not inspected in time.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation date.
    triggers:
      - event: hvaccare:hvaccare_membership_credit
        map: {credit_reason: inspection_not_passed}
  - type: hvaccare_cancellation
    target: hvaccare_agreements
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The customer cancels the agreement.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The date the customer gave notice.
    triggers:
      - event: hvaccare:hvaccare_membership_credit
        map: {credit_reason: customer_cancellation}
      - event: hvaccare:hvaccare_visit_forfeiture
        map: {}
  - type: hvaccare_nonpayment_cancellation
    target: hvaccare_agreements
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The agreement is cancelled because the fee stayed unpaid beyond the grace period.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation date.
    triggers:
      - event: hvaccare:hvaccare_visit_forfeiture
        map: {}
  - type: hvaccare_expiration
    target: hvaccare_agreements
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The term_end_date.
    triggers:
      - event: hvaccare:hvaccare_visit_forfeiture
        map: {}
  - type: hvaccare_renewal_notice
    target: hvaccare_agreements
    mutation: update
    meaning: Bridgewell issues the renewal notice.
    grain: One row per transaction.
    fields:
      renewal_notice_date: The notice date.
    triggers: []
  - type: hvaccare_renewal
    target: hvaccare_agreements
    mutation: update
    meaning: The agreement renews into a new term, with unused visits of the old term forfeited and a new allotment granted.
    grain: One row per transaction.
    fields:
      term_start_date: The day after the prior term_end_date.
      term_end_date: The last day of the new term.
      term_number: Incremented by one.
      renewal_notice_date: Cleared.
    triggers:
      - event: hvaccare:hvaccare_visit_forfeiture
        map: {}
      - event: hvaccare:hvaccare_visit_allotment
        map: {}
      - event: hvaccare:hvaccare_membership_charge
        map: {}
  - type: hvaccare_ownership_transfer
    target: hvaccare_agreements
    mutation: update
    meaning: The agreement moves to the new owner of the property.
    grain: One row per transaction.
    fields:
      customer_id: The new owner.
      transfer_date: The transfer date.
    triggers: []
  - type: hvaccare_membership_charge
    target: hvaccare_billing_entries
    meaning: A membership fee, additional-system fee, missed-appointment fee or returned-payment item is billed.
    grain: One row per amount billed for one period and charge type.
    distinguish_by: [charge_type, billing_period_start, hvaccare_visit_event_id]
    fields:
      entry_date: The billing date.
      amount: The amount billed, positive.
      charge_type: What is billed.
      billing_period_start: First day of the period (the due date).
      billing_period_end: Last day of the period.
      hvaccare_visit_event_id: For a missed-appointment fee, the booked visit that was missed; empty otherwise.
    account: membership_balance
    direction: in
    triggers: []
  - type: hvaccare_membership_payment
    target: hvaccare_billing_entries
    meaning: The customer pays membership fees.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: How it was paid.
    account: membership_balance
    direction: out
    triggers: []
  - type: hvaccare_membership_credit
    target: hvaccare_billing_entries
    meaning: A membership credit is posted on cancellation or for a billing correction.
    grain: One row per credit reason and period.
    distinguish_by: [credit_reason, billing_period_start]
    fields:
      entry_date: The posting date.
      amount: The credit, positive.
      credit_reason: Why.
      billing_period_start: The period the credit relates to.
    account: membership_balance
    direction: out
    triggers: []
  - type: hvaccare_membership_refund
    target: hvaccare_billing_entries
    meaning: A credit balance is refunded.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund, positive.
      refund_reference: The refund confirmation number.
      payment_method: How it is refunded.
    account: membership_balance
    direction: in
    triggers: []
  - type: hvaccare_visit_allotment
    target: hvaccare_visit_events
    meaning: The term's tune-up visits are granted.
    grain: One row per term.
    distinguish_by: [allotment_term_start]
    fields:
      event_date: The grant date.
      allotment_term_start: The term_start_date of the term granted.
      visit_count: Visits granted, positive.
    account: visit_entitlement
    direction: in
    triggers: []
  - type: hvaccare_tuneup_visit
    target: hvaccare_visit_events
    meaning: A booked tune-up of one system is completed, or the customer misses it.
    grain: One row per system per season visit.
    distinguish_by: [system_number, visit_season, event_date]
    fields:
      event_date: The visit date.
      system_number: Which enrolled system (1 to systems_enrolled).
      visit_season: cooling or heating.
      visit_status: completed or missed.
      service_contractor_id: The contractor.
      visit_count: 1 when completed, 0 when missed.
    account: visit_entitlement
    direction: out
    triggers:
      - event: hvaccare:hvaccare_membership_charge
        when: {visit_status: missed}
        map: {charge_type: missed_appointment_fee}
  - type: hvaccare_visit_forfeiture
    target: hvaccare_visit_events
    meaning: Unused visits lapse at the end of a term or on cancellation.
    grain: One row per term closed.
    distinguish_by: [allotment_term_start]
    fields:
      event_date: The forfeiture date.
      allotment_term_start: The term whose unused visits lapse.
      visit_count: Visits forfeited, positive.
    account: visit_entitlement
    direction: out
    triggers: []
  - type: hvaccare_member_repair_discount
    target: hvaccare_visit_events
    meaning: The member discount is applied to a customer-paid repair invoice from a network HVAC contractor.
    grain: One row per repair invoice.
    distinguish_by: [repair_invoice_number]
    fields:
      event_date: The invoice date.
      repair_invoice_number: The contractor's invoice number, verbatim.
      repair_invoice_amount: The invoice amount before discount.
      discount_amount: The member discount applied.
      service_contractor_id: The contractor.
    triggers: []

measures:
  - id: hvaccare_msr_visits_completed_term
    window: The current term.
    measure: Count of hvaccare_tuneup_visit rows with visit_status completed in the window.
  - id: hvaccare_msr_term_fee_paid
    window: The current term up to the cancellation notice date.
    measure: Sum of hvaccare_membership_payment amounts in the window, minus returned_payment charges in the window.
  - id: hvaccare_msr_warranty_holder_at_term_start
    window: Snapshot on the term_start_date of the term being billed.
    measure: 1 when the agreement holder holds a homeplan_contracts record for the same property address in status waiting_period or active whose tier's heating_system_cap is above 0.00, otherwise 0.
  - id: hvaccare_msr_days_since_start
    window: From start_date to the cancellation notice date.
    measure: Count of calendar days from the day after start_date through the notice date inclusive.
  - id: hvaccare_msr_oldest_unpaid_due_date
    window: All membership charges up to frozen time.
    measure: The billing_period_start of the oldest monthly_fee or annual_fee charge not fully paid, payments applied oldest first.

policies:
  - id: hvaccare_agg_multi_holding
    subject: [hvaccare_enrollment]
    rule: >-
      A customer may hold any number of maintenance agreements, one per property. The per-property limit and how an
      agreement combines with a homeowner service contract are governed by hvaccare_agg_property_and_bundle.
    eligibility: []
    params:
      max_per_customer: null

  - id: hvaccare_agg_property_and_bundle
    subject: [hvaccare_enrollment, hvaccare_membership_charge]
    rule: >-
      A property carries one maintenance agreement; all of its systems, up to max_systems, are enrolled on that agreement.
      A new agreement is not enrolled when an agreement for the same property address is in status enrolled or active.
      A customer who holds a homeowner service contract in status waiting_period or active for the same address, on a tier whose heating_system_cap is above 0.00, receives warranty_holder_discount_rate off each membership fee charge; the discount is set at each term start and kept for the term even if the homeowner service contract ends mid-term.
      The maintenance agreement never pays for repairs: a failure found during a tune-up is repaired under the
      customer's home warranty when covered there, and otherwise at member pricing under hvaccare_member_benefits.
    eligibility:
      - id: one_agreement_per_property
        applies_to: [hvaccare_enrollment]
        kind: dedup
        condition: "A new agreement is not enrolled when an agreement for the same property address is in status enrolled or active."
        evidence_fields: [hvaccare_agreements.property_address, hvaccare_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_agreements.property_address]
          action_bindings:
            hvaccare_agreements.property_address: property_address
        dedup_contract:
          table: hvaccare_agreements
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [enrolled, active]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Comfort Care Essential: {warranty_holder_discount_rate: "=warranty_holder_discount_rate", max_systems: "=max_systems"}
        Bridgewell Comfort Care Standard: {warranty_holder_discount_rate: "=warranty_holder_discount_rate", max_systems: "=max_systems"}
        Bridgewell Comfort Care Plus: {warranty_holder_discount_rate: "=warranty_holder_discount_rate", max_systems: "=max_systems"}
        Bridgewell Comfort Care Dual-System: {warranty_holder_discount_rate: "=warranty_holder_discount_rate", max_systems: "=max_systems"}
        Bridgewell Comfort Care Dual-System Plus: {warranty_holder_discount_rate: "=warranty_holder_discount_rate", max_systems: "=max_systems"}
        Bridgewell Comfort Care Premier: {warranty_holder_discount_rate: "=warranty_holder_discount_rate", max_systems: "=max_systems"}

  - id: hvaccare_enrollment_and_inspection
    subject: [hvaccare_enrollment, hvaccare_qualifying_inspection, hvaccare_activation, hvaccare_enrollment_cancellation]
    rule: >-
      The equipment types and number of systems are taken from the customer's statement and must satisfy the entry gate and max_systems of the agreement level.
      A ductless system counts as one system for up to ductless_heads_per_system indoor heads. Each term lasts
      contract_term_months calendar months, ending the day before the same calendar day contract_term_months later (the
      last day of the month when that day does not exist). A network contractor performs a qualifying inspection.
      An agreement is activated only when the qualifying inspection result is passed and the inspection was completed no later than qualifying_inspection_days calendar days after the agreement is enrolled, counting from the day after start_date with the boundary day included.
      When the result is failed_repair_needed, or no inspection is completed in that window, the enrollment is cancelled
      and, when inspection_failure_full_refund is true, every fee paid is credited and refunded; the customer may
      re-enroll after the repair. A property re-enrolled no later than late_renewal_grace_days calendar days after its
      previous agreement expired carries over that agreement's passed inspection result and inspection_date and
      needs no new inspection.
    eligibility:
      - id: equipment_stated_within_gate
        applies_to: [hvaccare_enrollment]
        kind: caller_fact
        condition: "The equipment types and number of systems are taken from the customer's statement and must satisfy the entry gate and max_systems of the agreement level."
        evidence_fields: [hvaccare_agreements.property_address, hvaccare_agreements.systems_enrolled, hvaccare_agreements.equipment_summary]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [hvaccare_agreements.property_address]
          action_bindings:
            hvaccare_agreements.property_address: property_address
      - id: inspection_passed_in_window
        applies_to: [hvaccare_activation]
        kind: time
        condition: "An agreement is activated only when the qualifying inspection result is passed and the inspection was completed no later than qualifying_inspection_days calendar days after the agreement is enrolled, counting from the day after start_date with the boundary day included."
        evidence_fields: [hvaccare_agreements.start_date, hvaccare_agreements.inspection_date, hvaccare_agreements.inspection_result, hvaccare_agreements.hvaccare_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_agreements.hvaccare_agreement_id]
          action_bindings:
            hvaccare_agreements.hvaccare_agreement_id: hvaccare_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement is enrolled
          anchor_source: hvaccare_agreements.start_date
          relation: not_after
          duration_source: variants.qualifying_inspection_days
          unit: calendar_days
          counting_rule: counting from the day after start_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Comfort Care Essential: {qualifying_inspection_days: "=qualifying_inspection_days", inspection_failure_full_refund: "=inspection_failure_full_refund", equipment_types_covered: "=equipment_types_covered", ductless_heads_per_system: "=ductless_heads_per_system", contract_term_months: "=contract_term_months"}
        Bridgewell Comfort Care Standard: {qualifying_inspection_days: "=qualifying_inspection_days", inspection_failure_full_refund: "=inspection_failure_full_refund", equipment_types_covered: "=equipment_types_covered", ductless_heads_per_system: "=ductless_heads_per_system", contract_term_months: "=contract_term_months"}
        Bridgewell Comfort Care Plus: {qualifying_inspection_days: "=qualifying_inspection_days", inspection_failure_full_refund: "=inspection_failure_full_refund", equipment_types_covered: "=equipment_types_covered", ductless_heads_per_system: "=ductless_heads_per_system", contract_term_months: "=contract_term_months"}
        Bridgewell Comfort Care Dual-System: {qualifying_inspection_days: "=qualifying_inspection_days", inspection_failure_full_refund: "=inspection_failure_full_refund", equipment_types_covered: "=equipment_types_covered", ductless_heads_per_system: "=ductless_heads_per_system", contract_term_months: "=contract_term_months"}
        Bridgewell Comfort Care Dual-System Plus: {qualifying_inspection_days: "=qualifying_inspection_days", inspection_failure_full_refund: "=inspection_failure_full_refund", equipment_types_covered: "=equipment_types_covered", ductless_heads_per_system: "=ductless_heads_per_system", contract_term_months: "=contract_term_months"}
        Bridgewell Comfort Care Premier: {qualifying_inspection_days: "=qualifying_inspection_days", inspection_failure_full_refund: "=inspection_failure_full_refund", equipment_types_covered: "=equipment_types_covered", ductless_heads_per_system: "=ductless_heads_per_system", contract_term_months: "=contract_term_months"}

  - id: hvaccare_membership_pricing
    subject: [hvaccare_membership_charge, hvaccare_membership_payment]
    rule: >-
      The membership fee covers systems_included systems; each further system adds additional_system_annual_fee per
      term, billed in full on an annual agreement and in twelve equal monthly parts, rounded to the cent, on a monthly
      agreement. A monthly agreement is charged monthly_fee plus the monthly part of any additional-system fees each
      billing period, starting on the same calendar day of the month as term_start_date and due on its start; an annual
      agreement is charged annual_fee plus additional-system fees once per term on term_start_date. The warranty holder
      discount under hvaccare_agg_property_and_bundle reduces the fee and additional-system fees, rounded to the cent.
      During the first price_lock_terms terms the fee stays at the amounts in force on start_date; later terms are
      priced at the parameters in force on the term start. A visit missed without visit_reschedule_notice_hours hours of
      notice is billed missed_appointment_fee, and a returned payment is billed back with returned_payment_fee.
      Membership fees are billed only while the agreement status is enrolled or active.
      Payments are applied oldest unpaid charge first.
    eligibility:
      - id: fees_on_open_agreement
        applies_to: [hvaccare_membership_charge]
        kind: state
        condition: "Membership fees are billed only while the agreement status is enrolled or active."
        evidence_fields: [hvaccare_agreements.status, hvaccare_agreements.hvaccare_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_agreements.hvaccare_agreement_id]
          action_bindings:
            hvaccare_agreements.hvaccare_agreement_id: hvaccare_agreement_id
        state_contract:
          field: hvaccare_agreements.status
          allowed: [enrolled, active]
    params:
      per_tier:
        Bridgewell Comfort Care Essential: {annual_fee: "=annual_fee", monthly_fee: "=monthly_fee", systems_included: "=systems_included", additional_system_annual_fee: "=additional_system_annual_fee", price_lock_terms: "=price_lock_terms", missed_appointment_fee: "=missed_appointment_fee", returned_payment_fee: "=returned_payment_fee", visit_reschedule_notice_hours: "=visit_reschedule_notice_hours"}
        Bridgewell Comfort Care Standard: {annual_fee: "=annual_fee", monthly_fee: "=monthly_fee", systems_included: "=systems_included", additional_system_annual_fee: "=additional_system_annual_fee", price_lock_terms: "=price_lock_terms", missed_appointment_fee: "=missed_appointment_fee", returned_payment_fee: "=returned_payment_fee", visit_reschedule_notice_hours: "=visit_reschedule_notice_hours"}
        Bridgewell Comfort Care Plus: {annual_fee: "=annual_fee", monthly_fee: "=monthly_fee", systems_included: "=systems_included", additional_system_annual_fee: "=additional_system_annual_fee", price_lock_terms: "=price_lock_terms", missed_appointment_fee: "=missed_appointment_fee", returned_payment_fee: "=returned_payment_fee", visit_reschedule_notice_hours: "=visit_reschedule_notice_hours"}
        Bridgewell Comfort Care Dual-System: {annual_fee: "=annual_fee", monthly_fee: "=monthly_fee", systems_included: "=systems_included", additional_system_annual_fee: "=additional_system_annual_fee", price_lock_terms: "=price_lock_terms", missed_appointment_fee: "=missed_appointment_fee", returned_payment_fee: "=returned_payment_fee", visit_reschedule_notice_hours: "=visit_reschedule_notice_hours"}
        Bridgewell Comfort Care Dual-System Plus: {annual_fee: "=annual_fee", monthly_fee: "=monthly_fee", systems_included: "=systems_included", additional_system_annual_fee: "=additional_system_annual_fee", price_lock_terms: "=price_lock_terms", missed_appointment_fee: "=missed_appointment_fee", returned_payment_fee: "=returned_payment_fee", visit_reschedule_notice_hours: "=visit_reschedule_notice_hours"}
        Bridgewell Comfort Care Premier: {annual_fee: "=annual_fee", monthly_fee: "=monthly_fee", systems_included: "=systems_included", additional_system_annual_fee: "=additional_system_annual_fee", price_lock_terms: "=price_lock_terms", missed_appointment_fee: "=missed_appointment_fee", returned_payment_fee: "=returned_payment_fee", visit_reschedule_notice_hours: "=visit_reschedule_notice_hours"}
    formula:
      annual_charge: "round((annual_fee + additional_system_annual_fee * max(0, systems_enrolled - systems_included)) * (1 - warranty_discount), 2)"
      monthly_charge: "round((monthly_fee + additional_system_annual_fee / 12 * max(0, systems_enrolled - systems_included)) * (1 - warranty_discount), 2)"
      warranty_discount: "warranty_holder_discount_rate * hvaccare_msr_warranty_holder_at_term_start"
    measures: [hvaccare_msr_warranty_holder_at_term_start]

  - id: hvaccare_visit_entitlement
    subject: [hvaccare_visit_allotment, hvaccare_tuneup_visit, hvaccare_visit_forfeiture]
    rule: >-
      At activation and at each renewal the term's allotment is granted: visits_per_system_per_term visits for each
      enrolled system, one cooling tune-up when cooling_tuneup_included is true and one heating tune-up when
      heating_tuneup_included is true. Cooling tune-ups are scheduled from cooling_visit_window_start_month through
      cooling_visit_window_end_month and heating tune-ups from heating_visit_window_start_month through
      heating_visit_window_end_month, and two tune-ups of the same system in a term are at least
      second_visit_min_gap_days calendar days apart.
      Tune-ups are performed only while the agreement status is active.
      A completed tune-up uses one visit; a missed visit uses none but is billed under hvaccare_membership_pricing. Each
      completed visit includes the services the level's switches turn on (filters, condensate drain, refrigerant top-off
      up to refrigerant_topoff_lbs_included pounds per system per term, coil cleaning, carbon monoxide test, thermostat
      calibration, water heater flush, indoor air quality check, UV lamp). When unused_visit_carryover is false, unused
      visits lapse at term end, on cancellation and on expiry, and a lapsed visit is never refunded or credited.
      New visits are not booked while any membership fee is more than booking_hold_days calendar days past due.
    eligibility:
      - id: tuneups_on_active_agreement
        applies_to: [hvaccare_tuneup_visit]
        kind: state
        condition: "Tune-ups are performed only while the agreement status is active."
        evidence_fields: [hvaccare_agreements.status, hvaccare_agreements.hvaccare_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_agreements.hvaccare_agreement_id]
          action_bindings:
            hvaccare_agreements.hvaccare_agreement_id: hvaccare_agreement_id
        state_contract:
          field: hvaccare_agreements.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Comfort Care Essential: {visits_per_system_per_term: "=visits_per_system_per_term", cooling_tuneup_included: "=cooling_tuneup_included", heating_tuneup_included: "=heating_tuneup_included", cooling_visit_window_start_month: "=cooling_visit_window_start_month", cooling_visit_window_end_month: "=cooling_visit_window_end_month", heating_visit_window_start_month: "=heating_visit_window_start_month", heating_visit_window_end_month: "=heating_visit_window_end_month", second_visit_min_gap_days: "=second_visit_min_gap_days", filter_replacement_included: "=filter_replacement_included", filters_per_visit: "=filters_per_visit", condensate_drain_treatment_included: "=condensate_drain_treatment_included", refrigerant_topoff_lbs_included: "=refrigerant_topoff_lbs_included", coil_cleaning_included: "=coil_cleaning_included", carbon_monoxide_test_included: "=carbon_monoxide_test_included", thermostat_calibration_included: "=thermostat_calibration_included", water_heater_flush_included: "=water_heater_flush_included", indoor_air_quality_check_included: "=indoor_air_quality_check_included", uv_lamp_replacement_included: "=uv_lamp_replacement_included", unused_visit_carryover: "=unused_visit_carryover", booking_hold_days: "=booking_hold_days"}
        Bridgewell Comfort Care Standard: {visits_per_system_per_term: "=visits_per_system_per_term", cooling_tuneup_included: "=cooling_tuneup_included", heating_tuneup_included: "=heating_tuneup_included", cooling_visit_window_start_month: "=cooling_visit_window_start_month", cooling_visit_window_end_month: "=cooling_visit_window_end_month", heating_visit_window_start_month: "=heating_visit_window_start_month", heating_visit_window_end_month: "=heating_visit_window_end_month", second_visit_min_gap_days: "=second_visit_min_gap_days", filter_replacement_included: "=filter_replacement_included", filters_per_visit: "=filters_per_visit", condensate_drain_treatment_included: "=condensate_drain_treatment_included", refrigerant_topoff_lbs_included: "=refrigerant_topoff_lbs_included", coil_cleaning_included: "=coil_cleaning_included", carbon_monoxide_test_included: "=carbon_monoxide_test_included", thermostat_calibration_included: "=thermostat_calibration_included", water_heater_flush_included: "=water_heater_flush_included", indoor_air_quality_check_included: "=indoor_air_quality_check_included", uv_lamp_replacement_included: "=uv_lamp_replacement_included", unused_visit_carryover: "=unused_visit_carryover", booking_hold_days: "=booking_hold_days"}
        Bridgewell Comfort Care Plus: {visits_per_system_per_term: "=visits_per_system_per_term", cooling_tuneup_included: "=cooling_tuneup_included", heating_tuneup_included: "=heating_tuneup_included", cooling_visit_window_start_month: "=cooling_visit_window_start_month", cooling_visit_window_end_month: "=cooling_visit_window_end_month", heating_visit_window_start_month: "=heating_visit_window_start_month", heating_visit_window_end_month: "=heating_visit_window_end_month", second_visit_min_gap_days: "=second_visit_min_gap_days", filter_replacement_included: "=filter_replacement_included", filters_per_visit: "=filters_per_visit", condensate_drain_treatment_included: "=condensate_drain_treatment_included", refrigerant_topoff_lbs_included: "=refrigerant_topoff_lbs_included", coil_cleaning_included: "=coil_cleaning_included", carbon_monoxide_test_included: "=carbon_monoxide_test_included", thermostat_calibration_included: "=thermostat_calibration_included", water_heater_flush_included: "=water_heater_flush_included", indoor_air_quality_check_included: "=indoor_air_quality_check_included", uv_lamp_replacement_included: "=uv_lamp_replacement_included", unused_visit_carryover: "=unused_visit_carryover", booking_hold_days: "=booking_hold_days"}
        Bridgewell Comfort Care Dual-System: {visits_per_system_per_term: "=visits_per_system_per_term", cooling_tuneup_included: "=cooling_tuneup_included", heating_tuneup_included: "=heating_tuneup_included", cooling_visit_window_start_month: "=cooling_visit_window_start_month", cooling_visit_window_end_month: "=cooling_visit_window_end_month", heating_visit_window_start_month: "=heating_visit_window_start_month", heating_visit_window_end_month: "=heating_visit_window_end_month", second_visit_min_gap_days: "=second_visit_min_gap_days", filter_replacement_included: "=filter_replacement_included", filters_per_visit: "=filters_per_visit", condensate_drain_treatment_included: "=condensate_drain_treatment_included", refrigerant_topoff_lbs_included: "=refrigerant_topoff_lbs_included", coil_cleaning_included: "=coil_cleaning_included", carbon_monoxide_test_included: "=carbon_monoxide_test_included", thermostat_calibration_included: "=thermostat_calibration_included", water_heater_flush_included: "=water_heater_flush_included", indoor_air_quality_check_included: "=indoor_air_quality_check_included", uv_lamp_replacement_included: "=uv_lamp_replacement_included", unused_visit_carryover: "=unused_visit_carryover", booking_hold_days: "=booking_hold_days"}
        Bridgewell Comfort Care Dual-System Plus: {visits_per_system_per_term: "=visits_per_system_per_term", cooling_tuneup_included: "=cooling_tuneup_included", heating_tuneup_included: "=heating_tuneup_included", cooling_visit_window_start_month: "=cooling_visit_window_start_month", cooling_visit_window_end_month: "=cooling_visit_window_end_month", heating_visit_window_start_month: "=heating_visit_window_start_month", heating_visit_window_end_month: "=heating_visit_window_end_month", second_visit_min_gap_days: "=second_visit_min_gap_days", filter_replacement_included: "=filter_replacement_included", filters_per_visit: "=filters_per_visit", condensate_drain_treatment_included: "=condensate_drain_treatment_included", refrigerant_topoff_lbs_included: "=refrigerant_topoff_lbs_included", coil_cleaning_included: "=coil_cleaning_included", carbon_monoxide_test_included: "=carbon_monoxide_test_included", thermostat_calibration_included: "=thermostat_calibration_included", water_heater_flush_included: "=water_heater_flush_included", indoor_air_quality_check_included: "=indoor_air_quality_check_included", uv_lamp_replacement_included: "=uv_lamp_replacement_included", unused_visit_carryover: "=unused_visit_carryover", booking_hold_days: "=booking_hold_days"}
        Bridgewell Comfort Care Premier: {visits_per_system_per_term: "=visits_per_system_per_term", cooling_tuneup_included: "=cooling_tuneup_included", heating_tuneup_included: "=heating_tuneup_included", cooling_visit_window_start_month: "=cooling_visit_window_start_month", cooling_visit_window_end_month: "=cooling_visit_window_end_month", heating_visit_window_start_month: "=heating_visit_window_start_month", heating_visit_window_end_month: "=heating_visit_window_end_month", second_visit_min_gap_days: "=second_visit_min_gap_days", filter_replacement_included: "=filter_replacement_included", filters_per_visit: "=filters_per_visit", condensate_drain_treatment_included: "=condensate_drain_treatment_included", refrigerant_topoff_lbs_included: "=refrigerant_topoff_lbs_included", coil_cleaning_included: "=coil_cleaning_included", carbon_monoxide_test_included: "=carbon_monoxide_test_included", thermostat_calibration_included: "=thermostat_calibration_included", water_heater_flush_included: "=water_heater_flush_included", indoor_air_quality_check_included: "=indoor_air_quality_check_included", uv_lamp_replacement_included: "=uv_lamp_replacement_included", unused_visit_carryover: "=unused_visit_carryover", booking_hold_days: "=booking_hold_days"}
    formula:
      visits_granted: "visits_per_system_per_term * systems_enrolled"
    measures: [hvaccare_msr_visits_completed_term]

  - id: hvaccare_member_benefits
    subject: [hvaccare_member_repair_discount]
    rule: >-
      A member repair discount is applied only while the agreement status is active.
      On a repair the member pays for to a network HVAC contractor, the invoice is reduced by repair_discount_rate,
      rounded to the cent and limited to repair_discount_cap_per_repair. The diagnostic fee on a member repair call is
      member_diagnostic_fee, overtime charges are waived when overtime_charges_waived is true, and the call is scheduled
      within priority_scheduling_hours hours. The discount applies only to the amount the member pays: it never applies
      to a repair paid under a Bridgewell home warranty contract, never to the home warranty service call fee, and never
      to a repair by a contractor outside the network. One discount is applied per repair invoice.
    eligibility:
      - id: discount_on_active_agreement
        applies_to: [hvaccare_member_repair_discount]
        kind: state
        condition: "A member repair discount is applied only while the agreement status is active."
        evidence_fields: [hvaccare_agreements.status, hvaccare_agreements.hvaccare_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_agreements.hvaccare_agreement_id]
          action_bindings:
            hvaccare_agreements.hvaccare_agreement_id: hvaccare_agreement_id
        state_contract:
          field: hvaccare_agreements.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Comfort Care Essential: {repair_discount_rate: "=repair_discount_rate", repair_discount_cap_per_repair: "=repair_discount_cap_per_repair", member_diagnostic_fee: "=member_diagnostic_fee", overtime_charges_waived: "=overtime_charges_waived", priority_scheduling_hours: "=priority_scheduling_hours"}
        Bridgewell Comfort Care Standard: {repair_discount_rate: "=repair_discount_rate", repair_discount_cap_per_repair: "=repair_discount_cap_per_repair", member_diagnostic_fee: "=member_diagnostic_fee", overtime_charges_waived: "=overtime_charges_waived", priority_scheduling_hours: "=priority_scheduling_hours"}
        Bridgewell Comfort Care Plus: {repair_discount_rate: "=repair_discount_rate", repair_discount_cap_per_repair: "=repair_discount_cap_per_repair", member_diagnostic_fee: "=member_diagnostic_fee", overtime_charges_waived: "=overtime_charges_waived", priority_scheduling_hours: "=priority_scheduling_hours"}
        Bridgewell Comfort Care Dual-System: {repair_discount_rate: "=repair_discount_rate", repair_discount_cap_per_repair: "=repair_discount_cap_per_repair", member_diagnostic_fee: "=member_diagnostic_fee", overtime_charges_waived: "=overtime_charges_waived", priority_scheduling_hours: "=priority_scheduling_hours"}
        Bridgewell Comfort Care Dual-System Plus: {repair_discount_rate: "=repair_discount_rate", repair_discount_cap_per_repair: "=repair_discount_cap_per_repair", member_diagnostic_fee: "=member_diagnostic_fee", overtime_charges_waived: "=overtime_charges_waived", priority_scheduling_hours: "=priority_scheduling_hours"}
        Bridgewell Comfort Care Premier: {repair_discount_rate: "=repair_discount_rate", repair_discount_cap_per_repair: "=repair_discount_cap_per_repair", member_diagnostic_fee: "=member_diagnostic_fee", overtime_charges_waived: "=overtime_charges_waived", priority_scheduling_hours: "=priority_scheduling_hours"}
    formula:
      discount_amount: "min(round(repair_invoice_amount * repair_discount_rate, 2), repair_discount_cap_per_repair)"

  - id: hvaccare_renewal_and_cancellation
    subject: [hvaccare_renewal_notice, hvaccare_renewal, hvaccare_expiration, hvaccare_cancellation, hvaccare_membership_credit, hvaccare_membership_refund, hvaccare_ownership_transfer]
    rule: >-
      An agreement with auto_renew true renews on its term end only when the renewal notice was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date and a notice issued exactly that many days before qualifies.
      Otherwise it expires at the end of term_end_date; within late_renewal_grace_days calendar days after term_end_date
      the customer may re-enroll without a new qualifying inspection. The customer may cancel at any time; cancellation
      is effective on the notice date. Within free_look_days calendar days after start_date
      (hvaccare_msr_days_since_start) the customer is credited the fees paid in the term (hvaccare_msr_term_fee_paid)
      less visit_retail_value for each completed visit (hvaccare_msr_visits_completed_term). Afterwards an annual
      agreement is credited the same amount less cancellation_admin_fee, the visits already received being the value
      the customer has used; a monthly agreement stops billing and is credited nothing. A credit is never negative and is
      refunded within refund_processing_days calendar days. A membership fee unpaid more than payment_grace_days
      calendar days after its due date cancels the agreement for nonpayment with no refund.
      Only one cancellation credit is posted per agreement.
      When transfer_allowed is true the agreement moves to a new owner of the property for the rest of the term.
    eligibility:
      - id: hvac_renewal_notice_in_time
        applies_to: [hvaccare_renewal]
        kind: time
        condition: "An agreement with auto_renew true renews on its term end only when the renewal notice was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date and a notice issued exactly that many days before qualifies."
        evidence_fields: [hvaccare_agreements.renewal_notice_date, hvaccare_agreements.term_end_date, hvaccare_agreements.hvaccare_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_agreements.hvaccare_agreement_id]
          action_bindings:
            hvaccare_agreements.hvaccare_agreement_id: hvaccare_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal notice was issued
          anchor_source: hvaccare_agreements.renewal_notice_date
          relation: not_before
          duration_source: variants.renewal_notice_days
          unit: calendar_days
          counting_rule: counting runs backward from term_end_date and a notice issued exactly that many days before qualifies
          boundary: inclusive
      - id: one_hvac_cancellation_credit
        applies_to: [hvaccare_membership_credit]
        kind: dedup
        condition: "Only one cancellation credit is posted per agreement."
        evidence_fields: [hvaccare_billing_entries.hvaccare_agreement_id, hvaccare_billing_entries.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_billing_entries.hvaccare_agreement_id, hvaccare_billing_entries.credit_reason]
          action_bindings:
            hvaccare_billing_entries.hvaccare_agreement_id: hvaccare_agreement_id
            hvaccare_billing_entries.credit_reason: credit_reason
        dedup_contract:
          table: hvaccare_billing_entries
          mode: separate_record
          object_bindings: {hvaccare_agreement_id: hvaccare_agreement_id, credit_reason: credit_reason}
          duplicate_filters: {credit_reason: [customer_cancellation, inspection_not_passed]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Comfort Care Essential: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days", visit_retail_value: "=visit_retail_value", payment_grace_days: "=payment_grace_days", transfer_allowed: "=transfer_allowed"}
        Bridgewell Comfort Care Standard: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days", visit_retail_value: "=visit_retail_value", payment_grace_days: "=payment_grace_days", transfer_allowed: "=transfer_allowed"}
        Bridgewell Comfort Care Plus: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days", visit_retail_value: "=visit_retail_value", payment_grace_days: "=payment_grace_days", transfer_allowed: "=transfer_allowed"}
        Bridgewell Comfort Care Dual-System: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days", visit_retail_value: "=visit_retail_value", payment_grace_days: "=payment_grace_days", transfer_allowed: "=transfer_allowed"}
        Bridgewell Comfort Care Dual-System Plus: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days", visit_retail_value: "=visit_retail_value", payment_grace_days: "=payment_grace_days", transfer_allowed: "=transfer_allowed"}
        Bridgewell Comfort Care Premier: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days", visit_retail_value: "=visit_retail_value", payment_grace_days: "=payment_grace_days", transfer_allowed: "=transfer_allowed"}
    formula:
      cancellation_credit: "max(0, hvaccare_msr_term_fee_paid - visit_retail_value * hvaccare_msr_visits_completed_term) if hvaccare_msr_days_since_start <= free_look_days else (0 if billing_frequency == 'monthly' else max(0, hvaccare_msr_term_fee_paid - visit_retail_value * hvaccare_msr_visits_completed_term - cancellation_admin_fee))"
    measures: [hvaccare_msr_days_since_start, hvaccare_msr_visits_completed_term, hvaccare_msr_term_fee_paid]

  - id: hvaccare_nonpayment
    subject: [hvaccare_nonpayment_cancellation]
    rule: >-
      Fees are due on their billing period start, and the oldest unpaid one is hvaccare_msr_oldest_unpaid_due_date.
      An agreement is cancelled for nonpayment only when a fee remains unpaid more than payment_grace_days calendar days after the fee's due date; the count starts the day after the due date.
      A nonpayment cancellation carries no admin fee and no refund, unused visits lapse, and fees billed for periods
      before the cancellation remain owed.
    eligibility:
      - id: hvac_grace_passed
        applies_to: [hvaccare_nonpayment_cancellation]
        kind: time
        condition: "An agreement is cancelled for nonpayment only when a fee remains unpaid more than payment_grace_days calendar days after the fee's due date; the count starts the day after the due date."
        evidence_fields: [hvaccare_billing_entries.billing_period_start, hvaccare_billing_entries.hvaccare_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hvaccare_billing_entries.hvaccare_agreement_id]
          action_bindings:
            hvaccare_billing_entries.hvaccare_agreement_id: hvaccare_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fee's due date
          anchor_source: hvaccare_billing_entries.billing_period_start
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after the due date
          boundary: exclusive
    measures: [hvaccare_msr_oldest_unpaid_due_date]
