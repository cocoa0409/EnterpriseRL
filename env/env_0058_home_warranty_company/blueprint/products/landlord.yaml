events:
  - type: landlord_enrollment
    target: landlord_contracts
    mutation: create
    meaning: A landlord purchases a rental property service contract for one rental property.
    grain: One row per contract purchased.
    fields:
      customer_id: The landlord.
      variant_name: The tier purchased.
      property_address: The rental property address as stated.
      property_zip: The property ZIP code.
      property_type: The dwelling type.
      unit_count: Number of dwelling units covered.
      year_built: The year the building was built, as stated.
      tenant_contact_name: The tenant the landlord authorizes to place requests, verbatim; empty if none.
      tenant_contact_phone: That tenant's phone number; empty if none.
      start_date: The purchase date.
      term_start_date: Equal to start_date.
      term_end_date: The last day of the first term.
      coverage_effective_date: start_date plus the waiting period.
      term_number: 1.
      billing_frequency: Monthly or annual.
      auto_renew: Whether the contract renews automatically.
    triggers:
      - event: landlord:landlord_premium_charge
        when: {billing_frequency: monthly}
        map: {charge_type: monthly_installment}
      - event: landlord:landlord_premium_charge
        when: {billing_frequency: annual}
        map: {charge_type: annual_premium}
  - type: landlord_coverage_activation
    target: landlord_contracts
    mutation: {transition: {from: waiting_period, to: active}}
    meaning: The waiting period ends and coverage starts.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers: []
  - type: landlord_renewal_notice
    target: landlord_contracts
    mutation: update
    meaning: Bridgewell issues the renewal notice for the term, stating the renewal price with the portfolio discount then applicable.
    grain: One row per transaction.
    fields:
      renewal_notice_date: The date the notice was issued.
    triggers: []
  - type: landlord_renewal_preference_change
    target: landlord_contracts
    mutation: update
    meaning: The landlord turns automatic renewal on or off.
    grain: One row per transaction.
    fields:
      auto_renew: The new setting.
    triggers: []
  - type: landlord_renewal
    target: landlord_contracts
    mutation: update
    meaning: An active contract renews into a new term on its term end, optionally at a different tier.
    grain: One row per transaction.
    fields:
      term_start_date: The day after the prior term_end_date.
      term_end_date: The last day of the new term.
      term_number: Incremented by one.
      variant_name: The tier for the new term.
      prior_variant_name: The tier of the term that ended.
      renewal_notice_date: Cleared for the new term.
    triggers:
      - event: landlord:landlord_premium_charge
        map: {}
      - event: addon:addon_rider_renewal
        map: {}
  - type: landlord_plan_upgrade
    target: landlord_contracts
    mutation: update
    meaning: The landlord moves the contract to a higher tier during the term.
    grain: One row per transaction.
    fields:
      variant_name: The higher tier.
      prior_variant_name: The tier before the upgrade.
      last_plan_change_date: The upgrade date.
    triggers: []
  - type: landlord_tenant_contact_update
    target: landlord_contracts
    mutation: update
    meaning: The landlord changes or removes the authorized tenant contact, for example at tenant turnover.
    grain: One row per transaction.
    fields:
      tenant_contact_name: The new authorized tenant, verbatim; empty to remove.
      tenant_contact_phone: The new tenant phone; empty to remove.
    triggers: []
  - type: landlord_ownership_transfer
    target: landlord_contracts
    mutation: update
    meaning: The contract is transferred to the purchaser of the rental property, who keeps it as a rental.
    grain: One row per transaction.
    fields:
      customer_id: The purchaser, who now holds the contract.
      transfer_date: The transfer date.
      tenant_contact_name: Kept or cleared as the purchaser instructs.
      tenant_contact_phone: Kept or cleared as the purchaser instructs.
    triggers:
      - event: landlord:landlord_premium_charge
        map: {charge_type: transfer_fee}
  - type: landlord_cancellation
    target: landlord_contracts
    mutation: {transition: [{from: waiting_period, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The landlord confirms a cancellation request and the contract ends.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The notice date on the cancellation request.
    triggers:
      - event: landlord:landlord_premium_credit
        map: {credit_reason: cancellation_refund_credit}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: landlord_nonpayment_suspension
    target: landlord_contracts
    mutation: {transition: {from: active, to: suspended_nonpayment}}
    meaning: Service is suspended for an installment past due beyond the grace period.
    grain: One row per transaction.
    fields:
      status: Becomes suspended_nonpayment.
      suspended_date: The suspension date.
    triggers: []
  - type: landlord_reinstatement
    target: landlord_contracts
    mutation: {transition: {from: suspended_nonpayment, to: active}}
    meaning: A suspended contract is reinstated after the past-due balance is paid in time.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      suspended_date: Cleared.
    triggers: []
  - type: landlord_nonpayment_cancellation
    target: landlord_contracts
    mutation: {transition: {from: suspended_nonpayment, to: cancelled}}
    meaning: A suspended contract is cancelled because the past-due balance was not cured in time.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation date.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: landlord_expiration
    target: landlord_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The term_end_date.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: landlord_late_renewal
    target: landlord_contracts
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired contract is renewed within the late-renewal grace period.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      term_start_date: The late renewal date.
      term_end_date: The last day of the new term counted from the late renewal date.
      term_number: Incremented by one.
      end_date: Cleared.
    triggers:
      - event: landlord:landlord_premium_charge
        map: {}
      - event: addon:addon_rider_renewal
        map: {}
  - type: landlord_premium_charge
    target: landlord_billing_entries
    meaning: A premium amount or transfer fee is billed to the contract holder.
    grain: One row per amount billed for one billing period and charge type.
    distinguish_by: [charge_type, billing_period_start, payment_reference]
    fields:
      entry_date: The billing date.
      amount: The amount billed, positive.
      charge_type: What is billed.
      billing_period_start: First day of the period covered (the transfer date for a transfer fee).
      billing_period_end: Last day of the period covered.
      portfolio_discount_rate: The portfolio discount applied to an installment or annual premium; 0.00 otherwise.
      payment_reference: For a returned payment or its fee, the payment returned; empty otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: landlord_premium_payment
    target: landlord_billing_entries
    meaning: The contract holder pays premium.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: How it was paid.
    account: premium_balance
    direction: out
    triggers: []
  - type: landlord_premium_credit
    target: landlord_billing_entries
    meaning: A premium credit is posted for a cancellation or a billing correction.
    grain: One row per credit for one source object.
    distinguish_by: [credit_reason, landlord_cancellation_request_id, billing_period_start]
    fields:
      entry_date: The posting date.
      amount: The credit, positive.
      credit_reason: Why.
      landlord_cancellation_request_id: For a cancellation credit, the request it settles.
      billing_period_start: For a correction, the period corrected.
    account: premium_balance
    direction: out
    triggers: []
  - type: landlord_premium_refund
    target: landlord_billing_entries
    meaning: A credit balance is refunded to the landlord.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund, positive.
      refund_reference: The refund confirmation number.
      landlord_cancellation_request_id: The cancellation request settled.
      payment_method: How it is refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: landlord_service_fee_charge
    target: landlord_billing_entries
    meaning: A service call fee or surcharge is billed to the landlord for a service request.
    grain: One row per fee type on one service request.
    distinguish_by: [landlord_service_request_id, fee_type]
    fields:
      entry_date: The billing date.
      amount: The fee, positive.
      landlord_service_request_id: The service request.
      fee_type: Standard visit, second opinion or after-hours surcharge.
    account: service_fee_balance
    direction: in
    triggers: []
  - type: landlord_service_fee_refund
    target: landlord_billing_entries
    meaning: A service call fee is refunded.
    grain: One row per fee type refunded on one service request.
    distinguish_by: [landlord_service_request_id, fee_type]
    fields:
      entry_date: The refund date.
      amount: The refund, positive.
      landlord_service_request_id: The service request.
      fee_type: The fee refunded.
      fee_refund_reason: Why.
    account: service_fee_balance
    direction: out
    triggers: []
  - type: landlord_service_request
    target: landlord_service_requests
    meaning: The landlord or the authorized tenant reports a failure in one unit.
    grain: One row per item failure in one unit.
    distinguish_by: [landlord_service_request_id]
    fields:
      landlord_service_request_id: The service request number.
      request_date: The date placed.
      unit_label: The unit, verbatim as the caller names it (for example "Unit B"); "Main" on a single-unit property.
      requested_by: landlord or authorized_tenant.
      covered_item: The item that failed.
      trade: The trade.
      request_type: new_failure, recall or second_opinion.
      urgency: Emergency or routine.
      service_window: business_hours or after_hours.
      failure_description: The caller's description, verbatim.
    triggers:
      - event: landlord:landlord_service_fee_charge
        when: {request_type: new_failure}
        map: {landlord_service_request_id: landlord_service_request_id, fee_type: standard_visit}
      - event: landlord:landlord_service_fee_charge
        when: {request_type: second_opinion}
        map: {landlord_service_request_id: landlord_service_request_id, fee_type: second_opinion}
      - event: landlord:landlord_service_fee_charge
        when: {urgency: routine, service_window: after_hours}
        map: {landlord_service_request_id: landlord_service_request_id, fee_type: after_hours_surcharge}
  - type: landlord_contractor_dispatch
    target: landlord_claim_events
    meaning: A network contractor is assigned to a service request.
    grain: One row per assignment on one service request.
    distinguish_by: [landlord_service_request_id, dispatch_sequence]
    fields:
      landlord_service_request_id: The service request.
      event_date: The assignment date.
      service_contractor_id: The contractor.
      dispatch_sequence: 1 for the first assignment, incremented per further assignment.
      dispatch_reason: Initial, re-dispatch, second opinion or recall.
    triggers: []
  - type: landlord_coverage_determination
    target: landlord_claim_events
    meaning: Bridgewell decides whether the failure is covered.
    grain: One row per determination stage on one service request.
    distinguish_by: [landlord_service_request_id, determination_stage]
    fields:
      landlord_service_request_id: The service request.
      event_date: The determination date.
      covered_item: The item.
      unit_label: The unit.
      determination_stage: initial or review.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered.
    triggers: []
  - type: landlord_benefit_authorization
    target: landlord_claim_events
    meaning: Bridgewell authorizes a repair, replacement, cash-in-lieu settlement or supplemental allowance on a covered request.
    grain: One row per authorization number.
    distinguish_by: [authorization_number]
    fields:
      landlord_service_request_id: The service request.
      event_date: The authorization date.
      covered_item: The item.
      unit_label: The unit.
      authorization_number: The authorization number.
      resolution_type: repair, replacement, cash_in_lieu or allowance.
      allowance_type: For an allowance, which one.
      invoice_amount: For an allowance, the documented cost.
      repair_estimate: The repair estimate.
      replacement_cost: The contracted replacement cost.
      amount: The amount Bridgewell pays.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: landlord_authorization_reversal
    target: landlord_claim_events
    meaning: An authorization is reversed because the work will not be performed.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      landlord_service_request_id: The service request.
      event_date: The reversal date.
      reversed_authorization_number: The authorization reversed.
      reversal_reason: Why.
      amount: The amount reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []

measures:
  - id: landlord_msr_portfolio_property_count
    window: Snapshot on the term_start_date of the term being priced (for a new enrollment, its start_date).
    measure: Count of the landlord's landlord_contracts, this one included, whose status on that date is waiting_period, active or suspended_nonpayment.
  - id: landlord_msr_term_premium_paid
    window: The current term as of the cancellation notice_date (term_start_date through notice_date).
    measure: Sum of landlord_premium_payment amounts in the window, minus landlord_premium_charge amounts with charge_type returned_payment in the window.
  - id: landlord_msr_unexpired_term_days
    window: The current term as of the cancellation notice_date.
    measure: Count of calendar days from the day after notice_date through term_end_date inclusive.
  - id: landlord_msr_term_days
    window: The current term.
    measure: Count of calendar days from term_start_date through term_end_date inclusive.
  - id: landlord_msr_days_since_start
    window: From start_date to the cancellation notice_date.
    measure: Count of calendar days from the day after start_date through notice_date inclusive.
  - id: landlord_msr_term_benefit_paid
    window: The term in which the service request's request_date falls.
    measure: Sum of landlord_benefit_authorization amounts on the contract for requests in the window, minus landlord_authorization_reversal amounts for those authorizations.
  - id: landlord_msr_unit_item_benefit_paid_term
    window: The term in which the service request's request_date falls.
    measure: The same sum as landlord_msr_term_benefit_paid restricted to the same unit_label and covered_item, excluding allowance rows.
  - id: landlord_msr_days_since_sale_closing
    window: From the property_sale_closing_date on a cancellation request with cancel_reason sold_property to that request's notice_date.
    measure: Count of calendar days from the day after property_sale_closing_date through notice_date inclusive; undefined (never qualifying) when the request does not give cancel_reason sold_property.
  - id: landlord_msr_oldest_unpaid_due_date
    window: All premium charges on the contract up to frozen time.
    measure: The billing_period_start of the oldest monthly_installment or annual_premium charge not fully covered by payments and credits applied oldest charge first.

policies:
  - id: landlord_agg_multi_holding
    subject: [landlord_enrollment]
    rule: >-
      A landlord may hold any number of rental property service contracts, one per rental property. How many
      contracts one property may carry is governed by landlord_agg_one_contract_per_property, and how the landlord's
      contracts combine for pricing is governed by landlord_agg_portfolio_discount.
    eligibility: []
    params:
      max_per_customer: null

  - id: landlord_agg_one_contract_per_property
    subject: [landlord_enrollment, landlord_ownership_transfer]
    rule: >-
      A rental property carries only one service contract at a time.
      A new rental property service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      Rental coverage and homeowner coverage are mutually exclusive for the same property:
      a new rental property service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      An owner who moves out and starts renting the home cancels the homeowner service contract and enrolls a rental
      property service contract; an owner who moves into a former rental does the reverse. A purchaser who will
      occupy the property cannot take a transfer and buys a homeowner service contract instead.
    eligibility:
      - id: no_open_rental_contract_on_property
        applies_to: [landlord_enrollment]
        kind: dedup
        condition: "A new rental property service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [landlord_contracts.property_address, landlord_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.property_address]
          action_bindings:
            landlord_contracts.property_address: property_address
        dedup_contract:
          table: landlord_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []
      - id: no_open_homeowner_contract_on_property
        applies_to: [landlord_enrollment]
        kind: dedup
        condition: "a new rental property service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [homeplan_contracts.property_address, homeplan_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.property_address]
          action_bindings:
            homeplan_contracts.property_address: property_address
        dedup_contract:
          table: homeplan_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []

  - id: landlord_agg_portfolio_discount
    subject: [landlord_premium_charge, landlord_enrollment, landlord_renewal, landlord_late_renewal]
    rule: >-
      A landlord's contracts combine for a portfolio discount on premium. The number of contracts counted is
      landlord_msr_portfolio_property_count, a snapshot taken on the first day of the term being priced, counting only
      contracts held under the same customer profile (contracts of a spouse, partner or separate company profile are
      never combined). When the count is at or above portfolio_high_min_properties the discount is
      portfolio_high_discount_rate; otherwise, when it is at or above portfolio_mid_min_properties, it is
      portfolio_mid_discount_rate; otherwise it is 0.00. The bands do not stack: exactly one rate applies. The rate is
      fixed for the whole term: enrolling, cancelling, expiring or transferring other properties during the term never
      changes the installments already set, and the rate is taken again at each renewal and late renewal. The rate
      applies to monthly_installment, annual_premium and upgrade_proration charges and never to returned_payment,
      returned_payment_fee or transfer_fee charges. A transferred contract keeps its rate until the purchaser's first
      renewal, when the purchaser's own portfolio is counted.
    eligibility: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Systems: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Combo: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Combo Plus: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Multi-Unit Combo: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Multi-Unit Combo Plus: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
    formula:
      portfolio_discount_rate: "portfolio_high_discount_rate if landlord_msr_portfolio_property_count >= portfolio_high_min_properties else (portfolio_mid_discount_rate if landlord_msr_portfolio_property_count >= portfolio_mid_min_properties else 0)"
    measures: [landlord_msr_portfolio_property_count]

  - id: landlord_enrollment_terms
    subject: [landlord_enrollment, landlord_coverage_activation]
    rule: >-
      A rental property service contract covers a residential property the landlord rents out or holds for rent.
      The property type, unit count and year built are taken from the landlord's statement and must satisfy the entry gate of the tier purchased.
      Single-unit tiers cover one dwelling unit; multi-unit tiers cover every unit of a two- to four-unit building
      under one contract. Each term lasts contract_term_months calendar months, ending on the day before the same
      calendar day contract_term_months later, or on the last day of the month when that day does not exist.
      coverage_effective_date is start_date plus waiting_period_days calendar days.
      The contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero.
      The landlord may name one authorized tenant contact on the contract.
    eligibility:
      - id: rental_property_within_entry_gate
        applies_to: [landlord_enrollment]
        kind: caller_fact
        condition: "The property type, unit count and year built are taken from the landlord's statement and must satisfy the entry gate of the tier purchased."
        evidence_fields: [landlord_contracts.property_address, landlord_contracts.property_type, landlord_contracts.unit_count, landlord_contracts.year_built]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.property_address]
          action_bindings:
            landlord_contracts.property_address: property_address
      - id: waiting_period_before_activation
        applies_to: [landlord_coverage_activation]
        kind: time
        condition: "The contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero."
        evidence_fields: [landlord_contracts.start_date, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract is purchased
          anchor_source: landlord_contracts.start_date
          relation: not_before
          duration_source: variants.waiting_period_days
          unit: calendar_days
          counting_rule: counting the purchase date as day zero
          boundary: inclusive

  - id: landlord_premium_pricing
    subject: [landlord_premium_charge]
    rule: >-
      The base monthly amount is monthly_premium plus additional_unit_monthly_premium for each unit beyond the first.
      A monthly-billed contract is charged one monthly_installment per billing period, equal to the base monthly
      amount reduced by the term's portfolio_discount_rate under landlord_agg_portfolio_discount and rounded to the
      cent; billing periods start on the same calendar day of the month as term_start_date (the last day of the month
      when that day does not exist) and each installment is due on its period start. An annual-billed contract is
      charged one annual_premium per term on term_start_date, equal to twelve base monthly amounts reduced first by
      annual_pay_discount_rate and then by the portfolio discount rate, rounded to the cent once at the end; the two
      discounts multiply and are never added. Each premium charge records the portfolio_discount_rate applied. A
      returned payment is billed back as a returned_payment charge plus one returned_payment_fee charge of
      returned_payment_fee. A transfer is billed one transfer_fee charge of transfer_fee to the purchaser.
      Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment.
    eligibility:
      - id: premium_billed_on_open_contract
        applies_to: [landlord_premium_charge]
        kind: state
        condition: "Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [waiting_period, active, suspended_nonpayment]
    params:
      per_tier:
        Bridgewell Rental Appliance: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Systems: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Combo: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Combo Plus: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Multi-Unit Combo: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Multi-Unit Combo Plus: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
    formula:
      base_monthly: "monthly_premium + additional_unit_monthly_premium * (unit_count - 1)"
      monthly_installment: "round(base_monthly * (1 - portfolio_discount_rate), 2)"
      annual_premium: "round(base_monthly * 12 * (1 - annual_pay_discount_rate) * (1 - portfolio_discount_rate), 2)"

  - id: landlord_premium_collection_and_nonpayment
    subject: [landlord_premium_payment, landlord_nonpayment_suspension, landlord_reinstatement, landlord_nonpayment_cancellation]
    rule: >-
      Payments are applied to premium_balance, oldest unpaid charge first; the installment driving nonpayment
      handling is landlord_msr_oldest_unpaid_due_date. Each contract is billed and collected on its own, and a
      payment is applied only to the contract it names.
      Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends.
      No service request is accepted on a suspended contract.
      A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies.
      Reinstatement keeps the term dates and the term's portfolio discount, and failures first reported while
      suspended are not covered.
      A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date.
      A nonpayment cancellation carries no admin fee and no refund, and premium billed for periods before it remains
      owed.
    eligibility:
      - id: grace_passed_before_suspension
        applies_to: [landlord_nonpayment_suspension]
        kind: time
        condition: "Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends."
        evidence_fields: [landlord_billing_entries.billing_period_start, landlord_billing_entries.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_billing_entries.landlord_contract_id]
          action_bindings:
            landlord_billing_entries.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment's due date
          anchor_source: landlord_billing_entries.billing_period_start
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after the due date, and suspension applies from the first day after the grace period ends
          boundary: exclusive
      - id: cure_within_window
        applies_to: [landlord_reinstatement]
        kind: time
        condition: "A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies."
        evidence_fields: [landlord_contracts.suspended_date, landlord_contracts.premium_balance, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: landlord_contracts.suspended_date
          relation: not_after
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: the count starts the day after suspended_date and the boundary day itself qualifies
          boundary: inclusive
      - id: cure_lapsed_before_cancellation
        applies_to: [landlord_nonpayment_cancellation]
        kind: time
        condition: "A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date."
        evidence_fields: [landlord_contracts.suspended_date, landlord_contracts.premium_balance, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: landlord_contracts.suspended_date
          relation: not_before
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: counted from the day after suspended_date
          boundary: exclusive
    params:
      per_tier:
        Bridgewell Rental Appliance: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Systems: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Combo: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Combo Plus: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Multi-Unit Combo: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Multi-Unit Combo Plus: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
    measures: [landlord_msr_oldest_unpaid_due_date]

  - id: landlord_renewal_terms
    subject: [landlord_renewal_notice, landlord_renewal_preference_change, landlord_renewal, landlord_expiration, landlord_late_renewal]
    rule: >-
      Bridgewell issues one renewal notice per term stating the renewal tier and the renewal installment, priced with
      the portfolio discount projected for the renewal date.
      A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies.
      When auto_renew is false or the notice was late, the contract expires at the end of term_end_date unless the
      landlord affirmatively renews before then. The landlord may turn auto_renew off or on at any time before
      term_end_date. A renewed term starts the day after the prior term_end_date with no new waiting period, at the
      tier parameters in force on that day and the portfolio discount counted on that day, which may differ from the
      notice when properties were added or dropped in between. A move to a lower tier takes effect only at renewal.
      An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies.
      A late renewal starts a new full term on the late renewal date, failures that began between the term end and
      the late renewal are not covered, and per-unit caps, the aggregate limit and the refrigerant allowance restart
      with each new term. After the late-renewal grace period, the property needs a new contract with a new waiting
      period.
    eligibility:
      - id: renewal_notice_in_time
        applies_to: [landlord_renewal]
        kind: time
        condition: "A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies."
        evidence_fields: [landlord_contracts.renewal_notice_date, landlord_contracts.term_end_date, landlord_contracts.auto_renew, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal notice for the expiring term was issued
          anchor_source: landlord_contracts.renewal_notice_date
          relation: not_before
          duration_source: variants.renewal_notice_days
          unit: calendar_days
          counting_rule: counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies
          boundary: inclusive
      - id: late_renewal_in_grace
        applies_to: [landlord_late_renewal]
        kind: time
        condition: "An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies."
        evidence_fields: [landlord_contracts.term_end_date, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its term end
          anchor_source: landlord_contracts.term_end_date
          relation: not_after
          duration_source: variants.late_renewal_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after term_end_date and the boundary day itself qualifies
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Rental Appliance: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Systems: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Combo: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Combo Plus: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Multi-Unit Combo: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Multi-Unit Combo Plus: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
    measures: [landlord_msr_portfolio_property_count]

  - id: landlord_cancellation_and_refund
    subject: [landlord_cancellation, landlord_premium_credit, landlord_premium_refund]
    rule: >-
      A cancellation starts when the landlord gives notice: the agent records a cancellation request whose
      notice_date is the date the landlord gives notice, with the reason given and, for a sale, the
      property_sale_closing_date the landlord states, and the landlord then confirms it.
      A contract is cancelled only after the landlord has confirmed the cancellation request on file.
      The cancellation is effective on notice_date and never backdated. Within the first term, a notice given no later
      than free_look_days calendar days after start_date (landlord_msr_days_since_start) is credited all premium paid
      for the term less landlord_msr_term_benefit_paid, with no admin fee. Otherwise an annual-billed contract is
      credited landlord_msr_term_premium_paid times landlord_msr_unexpired_term_days divided by
      landlord_msr_term_days, rounded to the cent, less cancellation_admin_fee, less landlord_msr_term_benefit_paid,
      and a monthly-billed contract is credited nothing for installments already billed, carries no admin fee and is
      billed no further installments. The admin fee is waived when admin_fee_waived_on_sale is true and the request
      gives cancel_reason sold_property.
      The sale waiver applies only when notice is given no later than sale_cancellation_window_days calendar days after the property sale closes, counting from the day after property_sale_closing_date with the boundary day included.
      A credit is never negative and the difference is never billed. Service call fees are never returned through a
      cancellation, and cancelling one contract never changes the portfolio discount already set on the landlord's
      other contracts for their current terms.
      A cancellation credit is posted only after the landlord has confirmed the cancellation request on file.
      Only one cancellation credit and one refund are posted per cancellation request.
      Any credit balance is refunded within refund_processing_days calendar days after confirmation.
    eligibility:
      - id: cancellation_confirmed
        applies_to: [landlord_cancellation]
        kind: authorization
        condition: "A contract is cancelled only after the landlord has confirmed the cancellation request on file."
        evidence_fields: [landlord_cancellation_requests.request_status, landlord_cancellation_requests.landlord_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_cancellation_requests.landlord_cancellation_request_id]
          action_bindings:
            landlord_cancellation_requests.landlord_cancellation_request_id: landlord_cancellation_request_id
      - id: credit_after_confirmation
        applies_to: [landlord_premium_credit]
        kind: authorization
        condition: "A cancellation credit is posted only after the landlord has confirmed the cancellation request on file."
        evidence_fields: [landlord_cancellation_requests.request_status, landlord_cancellation_requests.landlord_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_cancellation_requests.landlord_cancellation_request_id]
          action_bindings:
            landlord_cancellation_requests.landlord_cancellation_request_id: landlord_cancellation_request_id
      - id: sale_waiver_window
        applies_to: [landlord_premium_credit]
        kind: time
        condition: "The sale waiver applies only when notice is given no later than sale_cancellation_window_days calendar days after the property sale closes, counting from the day after property_sale_closing_date with the boundary day included."
        evidence_fields: [landlord_cancellation_requests.property_sale_closing_date, landlord_cancellation_requests.notice_date, landlord_cancellation_requests.landlord_cancellation_request_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [landlord_cancellation_requests.landlord_cancellation_request_id]
          action_bindings:
            landlord_cancellation_requests.landlord_cancellation_request_id: landlord_cancellation_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the property sale closes
          anchor_source: landlord_cancellation_requests.property_sale_closing_date
          relation: not_after
          duration_source: variants.sale_cancellation_window_days
          unit: calendar_days
          counting_rule: counting from the day after property_sale_closing_date with the boundary day included
          boundary: inclusive
      - id: one_credit_one_refund
        applies_to: [landlord_premium_credit, landlord_premium_refund]
        kind: dedup
        condition: "Only one cancellation credit and one refund are posted per cancellation request."
        evidence_fields: [landlord_billing_entries.landlord_cancellation_request_id, landlord_billing_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_billing_entries.landlord_cancellation_request_id]
          action_bindings:
            landlord_billing_entries.landlord_cancellation_request_id: landlord_cancellation_request_id
        dedup_contract:
          table: landlord_billing_entries
          mode: separate_record
          object_bindings: {landlord_cancellation_request_id: landlord_cancellation_request_id, event_type: event_type}
          duplicate_filters: {event_type: [landlord_premium_credit, landlord_premium_refund]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Systems: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Combo: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Combo Plus: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Multi-Unit Combo: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
    formula:
      within_free_look: "landlord_msr_days_since_start <= free_look_days and term_number == 1"
      sale_waiver_qualified: "landlord_msr_days_since_sale_closing <= sale_cancellation_window_days"
      admin_fee_applied: "0 if (admin_fee_waived_on_sale and sale_waiver_qualified) else cancellation_admin_fee"
      cancellation_credit: "max(0, landlord_msr_term_premium_paid - landlord_msr_term_benefit_paid) if within_free_look else (0 if billing_frequency == 'monthly' else max(0, round(landlord_msr_term_premium_paid * landlord_msr_unexpired_term_days / landlord_msr_term_days, 2) - admin_fee_applied - landlord_msr_term_benefit_paid))"
    measures: [landlord_msr_days_since_start, landlord_msr_term_premium_paid, landlord_msr_unexpired_term_days, landlord_msr_term_days, landlord_msr_term_benefit_paid, landlord_msr_days_since_sale_closing]

  - id: landlord_ownership_transfer_rules
    subject: [landlord_ownership_transfer, landlord_tenant_contact_update]
    rule: >-
      When a landlord sells a covered rental property to a purchaser who will keep renting it, the contract may be
      transferred instead of cancelled, provided the tier's transfer_allowed is true.
      A transfer is processed only while the contract status is waiting_period or active.
      A transfer is processed only when the contract's premium_balance is zero or less.
      The purchaser must have a landlord customer profile on file and consents to the transfer as their own decision;
      the purchaser becomes the contract holder on transfer_date, keeps the current term, tier, billing frequency and
      the term's portfolio discount, and is billed transfer_fee. The selling landlord receives no refund on a transfer.
      The authorized tenant contact is changed only on the instruction of the current contract holder, and is cleared
      at tenant turnover; a former tenant's requests are no longer accepted after the change.
    eligibility:
      - id: transfer_on_open_contract
        applies_to: [landlord_ownership_transfer]
        kind: state
        condition: "A transfer is processed only while the contract status is waiting_period or active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [waiting_period, active]
      - id: transfer_requires_clear_balance
        applies_to: [landlord_ownership_transfer]
        kind: authorization
        condition: "A transfer is processed only when the contract's premium_balance is zero or less."
        evidence_fields: [landlord_contracts.premium_balance, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
    params:
      per_tier:
        Bridgewell Rental Appliance: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Systems: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Combo: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Combo Plus: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Multi-Unit Combo: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Multi-Unit Combo Plus: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}

  - id: landlord_plan_upgrade_rules
    subject: [landlord_plan_upgrade]
    rule: >-
      A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active.
      An upgrade moves to a higher-ranked tier whose entry gate the property satisfies; downgrades happen only at
      renewal. The upgrade takes effect on the request date and keeps the term dates. A monthly-billed contract is
      billed the new tier's installment from the next billing period; an annual-billed contract is billed one
      upgrade_proration charge equal to the difference between the two tiers' annual premiums under
      landlord_premium_pricing (same portfolio discount) times landlord_msr_unexpired_term_days divided by
      landlord_msr_term_days, rounded to the cent, both day counts taken as of the upgrade date. Items and higher
      caps added by the upgrade are covered only for failures first reported at least upgrade_waiting_period_days
      calendar days after the upgrade, as stated in landlord_evt_coverage_determination.
    eligibility:
      - id: upgrade_on_open_contract
        applies_to: [landlord_plan_upgrade]
        kind: state
        condition: "A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.variant_name, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [waiting_period, active]
    params:
      per_tier:
        Bridgewell Rental Appliance: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Systems: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo Plus: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
    measures: [landlord_msr_unexpired_term_days, landlord_msr_term_days]

  - id: landlord_evt_service_request_and_fees
    subject: [landlord_service_request, landlord_service_fee_charge, landlord_service_fee_refund]
    rule: >-
      Service requests are accepted only while the contract status is active.
      A request names one unit and one failed item. The landlord may always place requests.
      An authorized tenant may place a request only when tenant_requests_allowed is true and the caller's name and phone match the tenant_contact_name and tenant_contact_phone on the contract.
      All fees are billed to the landlord, never to the tenant. A new_failure request is charged service_call_fee
      once. A recall for the same unit and item placed no later than repair_guarantee_days calendar days after the
      earlier repair was completed carries no fee; a later return visit is a new_failure. A second opinion may be
      requested only by the landlord after an initial determination and is charged service_call_fee times
      second_opinion_fee_rate, rounded to the cent, with nothing posted when that is zero. A routine request for an
      after-hours visit is also charged tenant_after_hours_surcharge; emergencies never are. A request is an
      emergency when the failure leaves a unit without heat in freezing weather, without running water, without
      electrical power, or with an active leak that cannot be stopped at a fixture shutoff.
      The fee of each fee type is charged at most once per service request.
      Fees are refunded in full only when the request is cancelled before any contractor is assigned, or when a fee
      was charged in error; a not-covered determination never refunds the fee.
    eligibility:
      - id: requests_on_active_contract
        applies_to: [landlord_service_request]
        kind: state
        condition: "Service requests are accepted only while the contract status is active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [active]
      - id: tenant_is_authorized_contact
        applies_to: [landlord_service_request]
        kind: caller_fact
        condition: "An authorized tenant may place a request only when tenant_requests_allowed is true and the caller's name and phone match the tenant_contact_name and tenant_contact_phone on the contract."
        evidence_fields: [landlord_contracts.tenant_contact_name, landlord_contracts.tenant_contact_phone, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
      - id: one_fee_per_type
        applies_to: [landlord_service_fee_charge]
        kind: dedup
        condition: "The fee of each fee type is charged at most once per service request."
        evidence_fields: [landlord_billing_entries.landlord_service_request_id, landlord_billing_entries.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_billing_entries.landlord_service_request_id, landlord_billing_entries.fee_type]
          action_bindings:
            landlord_billing_entries.landlord_service_request_id: landlord_service_request_id
            landlord_billing_entries.fee_type: fee_type
        dedup_contract:
          table: landlord_billing_entries
          mode: separate_record
          object_bindings: {landlord_service_request_id: landlord_service_request_id, fee_type: fee_type}
          duplicate_filters: {event_type: [landlord_service_fee_charge]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Systems: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Combo: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Combo Plus: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Multi-Unit Combo: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
    formula:
      standard_fee: "service_call_fee if request_type == 'new_failure' else 0"
      second_opinion_fee: "round(service_call_fee * second_opinion_fee_rate, 2) if request_type == 'second_opinion' else 0"
      after_hours_fee: "tenant_after_hours_surcharge if (urgency == 'routine' and service_window == 'after_hours') else 0"

  - id: landlord_evt_dispatch
    subject: [landlord_contractor_dispatch]
    rule: >-
      A contractor is dispatched only on a service request whose contract status is active.
      The request goes to a network contractor whose trade matches and whose service ZIP codes include the
      property_zip, preferred before standard, never suspended, and emergency-capable for an emergency; ties go to the
      contractor reference that sorts first alphabetically. The contractor arranges access with the requester (the
      authorized tenant when the tenant placed the request) within routine_contact_hours hours, or
      emergency_contact_hours hours for an emergency; a missed window leads to re-dispatch with dispatch_reason
      redispatch_missed_contact. A second opinion goes to a different eligible contractor, and a recall to the original
      contractor unless now suspended. Each assignment carries the next dispatch_sequence, starting at 1.
    eligibility:
      - id: dispatch_on_active_contract
        applies_to: [landlord_contractor_dispatch]
        kind: state
        condition: "A contractor is dispatched only on a service request whose contract status is active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Rental Appliance: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Systems: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Combo: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Combo Plus: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Multi-Unit Combo: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Multi-Unit Combo Plus: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}

  - id: landlord_evt_coverage_determination
    subject: [landlord_coverage_determination]
    rule: >-
      A failure is covered only when every condition below holds, and otherwise is not_covered with the first failing
      reason in this order. (1) contract_not_in_force: the contract was active on the request date. (2)
      waiting_period: the failure was first reported on or after coverage_effective_date and, for an item or higher cap
      added by a mid-term upgrade, at least upgrade_waiting_period_days calendar days after last_plan_change_date.
      (3) item_not_in_plan: the tier's cap for the item is above 0.00. (4) preexisting_condition: conditions existing
      before coverage_effective_date are covered only when unknown, undetectable and unknown_preexisting_covered is
      true. (5) tenant_damage: failures caused by a tenant's misuse, abuse or damage are covered only when
      tenant_damage_covered is true. (6) misuse_or_external_damage: other misuse and external causes (weather, pests,
      fire, flood, freezing in a unit left without heat) are never covered. (7) cap_exhausted: the remaining per-unit
      item benefit and the remaining aggregate benefit under landlord_evt_benefit_authorization are both above zero.
      An initial determination is issued once per service request.
      After a landlord-requested second opinion, one review determination replaces the initial outcome.
    eligibility:
      - id: one_initial_determination
        applies_to: [landlord_coverage_determination]
        kind: dedup
        condition: "An initial determination is issued once per service request."
        evidence_fields: [landlord_claim_events.landlord_service_request_id, landlord_claim_events.determination_stage]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_claim_events.landlord_service_request_id, landlord_claim_events.determination_stage]
          action_bindings:
            landlord_claim_events.landlord_service_request_id: landlord_service_request_id
            landlord_claim_events.determination_stage: determination_stage
        dedup_contract:
          table: landlord_claim_events
          mode: separate_record
          object_bindings: {landlord_service_request_id: landlord_service_request_id, determination_stage: determination_stage}
          duplicate_filters: {event_type: [landlord_coverage_determination]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Systems: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo Plus: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}

  - id: landlord_evt_benefit_authorization
    subject: [landlord_benefit_authorization, landlord_authorization_reversal]
    rule: >-
      A benefit is authorized only after a covered determination is on file for the service request.
      Bridgewell replaces when repair_estimate is at or above repair_to_replace_threshold_rate times replacement_cost
      or the item cannot be repaired, and otherwise repairs. Caps apply per dwelling unit: each unit's item has its own
      cap (item_cap), counted by landlord_msr_unit_item_benefit_paid_term, and all payments on the contract share
      aggregate_term_limit, counted by landlord_msr_term_benefit_paid. The amount paid is the lowest of the work's
      cost, the remaining unit item benefit and the remaining aggregate benefit. Supplemental allowances pay the lower
      of invoice_amount and the allowance (code_violation_allowance, permit_fee_allowance, haul_away_allowance on a
      replacement, refrigerant_allowance per term on a cooling repair, and lead_safe_work_allowance when year_built is before
      lead_safe_built_before_year and the work disturbs painted surfaces), count toward the aggregate limit only, and are paid at most
      once per type per request. When a like unit cannot be sourced, or the landlord asks for cash in place of an
      authorized replacement, cash in lieu equal to the contracted replacement_cost within the same limits is offered;
      it is the landlord's decision, must be accepted no later than cash_in_lieu_offer_validity_days calendar days after
      the offer, is paid within cash_in_lieu_payment_days calendar days, and replaces the replacement authorization,
      which is reversed in full. A tenant cannot accept cash in lieu or approve paying a difference above a cap.
      Only one repair, replacement or cash-in-lieu authorization is open per service request.
      An authorization is reversed in full when the work will not be performed and never after completion.
    eligibility:
      - id: covered_before_benefit
        applies_to: [landlord_benefit_authorization]
        kind: authorization
        condition: "A benefit is authorized only after a covered determination is on file for the service request."
        evidence_fields: [landlord_claim_events.determination_outcome, landlord_claim_events.landlord_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_claim_events.landlord_service_request_id]
          action_bindings:
            landlord_claim_events.landlord_service_request_id: landlord_service_request_id
      - id: one_open_resolution
        applies_to: [landlord_benefit_authorization]
        kind: dedup
        condition: "Only one repair, replacement or cash-in-lieu authorization is open per service request."
        evidence_fields: [landlord_claim_events.landlord_service_request_id, landlord_claim_events.resolution_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_claim_events.landlord_service_request_id]
          action_bindings:
            landlord_claim_events.landlord_service_request_id: landlord_service_request_id
        dedup_contract:
          table: landlord_claim_events
          mode: separate_record
          object_bindings: {landlord_service_request_id: landlord_service_request_id}
          duplicate_filters: {resolution_type: [repair, replacement, cash_in_lieu]}
          distinct_fields: [authorization_number]
    params:
      lead_safe_built_before_year: 1978
      item_cap:
        heating_system: heating_system_cap
        cooling_system: cooling_system_cap
        ductwork: ductwork_cap
        plumbing: plumbing_cap
        water_heater: water_heater_cap
        electrical: electrical_cap
        kitchen_appliance: kitchen_appliance_cap
        laundry_appliance: laundry_appliance_cap
        garage_door_opener: garage_door_opener_cap
      per_tier:
        Bridgewell Rental Appliance: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Systems: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Combo: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Combo Plus: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Multi-Unit Combo: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Multi-Unit Combo Plus: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
    formula:
      amount: "max(0, min(repair_estimate if repair_estimate < repair_to_replace_threshold_rate * replacement_cost else replacement_cost, item_cap - landlord_msr_unit_item_benefit_paid_term, aggregate_term_limit - landlord_msr_term_benefit_paid))"
    measures: [landlord_msr_unit_item_benefit_paid_term, landlord_msr_term_benefit_paid]
