# Rental Property Service Contracts — annual service contracts for landlords and small property investors,
# one contract per rental property, with tenant-placed service requests and portfolio pricing.
category: landlord
display_name: Rental Property Service Contracts

binding:
  holding_table: landlord_contracts
  event_tables: [landlord_billing_entries, landlord_service_requests, landlord_claim_events]
  intake_tables: [landlord_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [waiting_period, active, suspended_nonpayment, expired, cancelled]
  transitions:
    - {from: waiting_period, to: active, by: system, means: The waiting period ends on the coverage effective date.}
    - {from: waiting_period, to: cancelled, by: user, means: The landlord confirms cancellation before coverage begins.}
    - {from: active, to: cancelled, by: user, means: The landlord confirms a cancellation request on file during the term.}
    - {from: active, to: suspended_nonpayment, by: system, means: A premium installment remains unpaid beyond the payment grace period.}
    - {from: suspended_nonpayment, to: active, by: agent, means: The full past-due balance is paid within the cure period and the agent reinstates the contract.}
    - {from: suspended_nonpayment, to: cancelled, by: system, means: The past-due balance is not cured within the cure period.}
    - {from: active, to: expired, by: system, means: The term ends without renewal.}
    - {from: expired, to: active, by: agent, means: The landlord renews within the late-renewal grace period and the agent reinstates the contract for a new term.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Premium and transfer fees the landlord owes on the contract; positive means owed to Bridgewell, negative means a credit owed back.
  - key: service_fee_balance
    unit: USD
    meaning: Service call fees and surcharges collected on the contract's service requests and not refunded.
  - key: benefit_consumed
    unit: USD
    meaning: Dollars Bridgewell has committed toward covered repairs, replacements, cash in lieu and allowances on the contract, net of reversals.

parameter_schema:
  monthly_premium: Monthly premium for the first dwelling unit before any portfolio discount, USD.
  additional_unit_monthly_premium: Monthly premium added for each dwelling unit beyond the first, USD.
  annual_pay_discount_rate: Discount when the term premium is paid in full up front, decimal fraction of twelve monthly installments.
  portfolio_mid_min_properties: Minimum number of the landlord's rental property contracts in force at term start for the mid portfolio discount, count.
  portfolio_mid_discount_rate: Portfolio discount at the mid band, decimal fraction of the installment.
  portfolio_high_min_properties: Minimum number of the landlord's rental property contracts in force at term start for the high portfolio discount, count.
  portfolio_high_discount_rate: Portfolio discount at the high band, decimal fraction of the installment.
  service_call_fee: Service call fee per service request, billed to the landlord, USD.
  tenant_after_hours_surcharge: Surcharge when a non-emergency after-hours visit is requested, USD.
  second_opinion_fee_rate: Fraction of the service call fee charged for a landlord-requested second opinion, decimal fraction.
  contract_term_months: Length of each term, calendar months.
  waiting_period_days: Calendar days after purchase before coverage begins, days.
  upgrade_waiting_period_days: Calendar days after a mid-term upgrade before added items or higher limits are covered, days.
  midterm_upgrade_allowed: Whether the tier can be upgraded during a term, boolean.
  free_look_days: Calendar days after the original start date within which a cancellation receives the free-look refund, days.
  cancellation_admin_fee: Administrative fee deducted from a pro-rata refund after the free-look period, USD.
  admin_fee_waived_on_sale: Whether the admin fee is waived when the landlord cancels because the property was sold, boolean.
  sale_cancellation_window_days: Calendar days after the property sale closes within which a sale cancellation qualifies for the admin fee waiver, days.
  refund_processing_days: Calendar days after a confirmed cancellation within which the refund is issued, days.
  payment_grace_days: Calendar days after an installment's due date before nonpayment suspends service, days.
  suspension_cure_days: Calendar days after suspension during which paying the full past-due balance reinstates the contract, days.
  returned_payment_fee: Fee billed when a premium payment is returned unpaid, USD.
  renewal_notice_days: Minimum calendar days before term end by which the renewal notice must be issued for automatic renewal, days.
  late_renewal_grace_days: Calendar days after term end during which an expired contract can be renewed without a new waiting period, days.
  transfer_allowed: Whether the contract can be transferred to a purchaser who keeps the property as a rental, boolean.
  transfer_fee: Fee billed to the purchaser when the contract is transferred, USD.
  aggregate_term_limit: Total benefit limit per term across all units, items and allowances, USD.
  heating_system_cap: Per-unit per-term limit for the heating system, USD; 0.00 means not covered.
  cooling_system_cap: Per-unit per-term limit for the cooling system, USD; 0.00 means not covered.
  ductwork_cap: Per-unit per-term limit for ductwork, USD; 0.00 means not covered.
  plumbing_cap: Per-unit per-term limit for interior plumbing leaks and stoppages, USD; 0.00 means not covered.
  water_heater_cap: Per-unit per-term limit for the water heater, USD; 0.00 means not covered.
  electrical_cap: Per-unit per-term limit for the electrical system, USD; 0.00 means not covered.
  kitchen_appliance_cap: Per-unit per-term limit for each kitchen appliance, USD; 0.00 means not covered.
  laundry_appliance_cap: Per-unit per-term limit for each laundry appliance, USD; 0.00 means not covered.
  garage_door_opener_cap: Per-unit per-term limit for the garage door opener, USD; 0.00 means not covered.
  code_violation_allowance: Per-request amount for correcting a code violation needed to complete covered work, USD.
  permit_fee_allowance: Per-request amount for permits covered work requires, USD.
  haul_away_allowance: Per-request amount for removing replaced equipment, USD.
  refrigerant_allowance: Per-term amount for refrigerant recovery and recharge across the contract, USD.
  lead_safe_work_allowance: Per-request amount toward lead-safe work practices required in older housing that may contain lead paint, USD.
  unknown_preexisting_covered: Whether failures from unknown, undetectable pre-existing conditions are covered, boolean.
  tenant_damage_covered: Whether failures caused by tenant misuse or damage are covered, boolean.
  tenant_requests_allowed: Whether the authorized tenant contact may place service requests directly, boolean.
  routine_contact_hours: Hours within which the contractor contacts the requester on a routine request, hours.
  emergency_contact_hours: Hours within which the contractor contacts the requester on an emergency request, hours.
  repair_guarantee_days: Calendar days after a completed repair during which a recall for the same failure carries no fee, days.
  repair_to_replace_threshold_rate: Repair estimate as a fraction of contracted replacement cost at or above which Bridgewell replaces, decimal fraction.
  cash_in_lieu_offer_validity_days: Calendar days after a cash-in-lieu offer within which it may be accepted, days.
  cash_in_lieu_payment_days: Calendar days after acceptance within which cash in lieu is paid, days.

