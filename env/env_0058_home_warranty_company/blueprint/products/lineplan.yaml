events:
  - type: lineplan_enrollment
    target: lineplan_contracts
    mutation: create
    meaning: A homeowner enrolls in a line protection plan for one property, directly or through a partner utility.
    grain: One row per plan enrolled.
    fields:
      customer_id: The homeowner.
      variant_name: The plan enrolled.
      property_address: The property address as stated.
      property_zip: The property ZIP code.
      property_type: The dwelling type.
      partner_utility: The partner utility the enrollment came through, or direct.
      billing_channel: utility_bill, card or ach.
      billing_frequency: Monthly or annual.
      service_line_material: The water service line material, as stated (unknown if not known).
      start_date: The enrollment date.
      coverage_effective_date: start_date plus the waiting period.
      term_start_date: Equal to start_date.
      term_end_date: The last day of the first term.
      term_number: 1.
      auto_renew: Whether the plan renews automatically.
    triggers:
      - event: lineplan:lineplan_premium_charge
        when: {billing_frequency: monthly}
        map: {charge_type: monthly_premium}
      - event: lineplan:lineplan_premium_charge
        when: {billing_frequency: annual}
        map: {charge_type: annual_premium}
  - type: lineplan_coverage_activation
    target: lineplan_contracts
    mutation: {transition: {from: waiting_period, to: active}}
    meaning: The waiting period ends.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers: []
  - type: lineplan_renewal_notice
    target: lineplan_contracts
    mutation: update
    meaning: Bridgewell issues the renewal notice for the term.
    grain: One row per transaction.
    fields:
      renewal_notice_date: The notice date.
    triggers: []
  - type: lineplan_renewal_preference_change
    target: lineplan_contracts
    mutation: update
    meaning: The customer turns automatic renewal on or off.
    grain: One row per transaction.
    fields:
      auto_renew: The new setting.
    triggers: []
  - type: lineplan_renewal
    target: lineplan_contracts
    mutation: update
    meaning: The plan renews into a new term.
    grain: One row per transaction.
    fields:
      term_start_date: The day after the prior term_end_date.
      term_end_date: The last day of the new term.
      term_number: Incremented by one.
      renewal_notice_date: Cleared for the new term.
    triggers:
      - event: lineplan:lineplan_premium_charge
        map: {}
  - type: lineplan_billing_channel_change
    target: lineplan_contracts
    mutation: update
    meaning: The customer moves billing between the partner utility bill and direct card or bank billing.
    grain: One row per transaction.
    fields:
      billing_channel: The new billing channel.
    triggers: []
  - type: lineplan_cancellation
    target: lineplan_contracts
    mutation: {transition: [{from: waiting_period, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The customer cancels the plan.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The date the customer gave notice.
    triggers:
      - event: lineplan:lineplan_premium_credit
        map: {credit_reason: cancellation_refund_credit}
  - type: lineplan_nonpayment_suspension
    target: lineplan_contracts
    mutation: {transition: {from: active, to: suspended_nonpayment}}
    meaning: Coverage is suspended for nonpayment.
    grain: One row per transaction.
    fields:
      status: Becomes suspended_nonpayment.
      suspended_date: The suspension date.
    triggers: []
  - type: lineplan_reinstatement
    target: lineplan_contracts
    mutation: {transition: {from: suspended_nonpayment, to: active}}
    meaning: The plan is reinstated after the past-due balance is paid in time.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      suspended_date: Cleared.
    triggers: []
  - type: lineplan_nonpayment_cancellation
    target: lineplan_contracts
    mutation: {transition: {from: suspended_nonpayment, to: cancelled}}
    meaning: The plan is cancelled because the past-due balance was not cured.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation date.
    triggers: []
  - type: lineplan_expiration
    target: lineplan_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The term_end_date.
    triggers: []
  - type: lineplan_late_renewal
    target: lineplan_contracts
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired plan is restored within the late-renewal grace period.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      term_start_date: The restoration date.
      term_end_date: The last day of the new term.
      term_number: Incremented by one.
      end_date: Cleared.
    triggers:
      - event: lineplan:lineplan_premium_charge
        map: {}
  - type: lineplan_premium_charge
    target: lineplan_billing_entries
    meaning: Plan premium is billed (monthly, annual, or a returned payment and its fee).
    grain: One row per amount billed for one period and charge type.
    distinguish_by: [charge_type, billing_period_start, payment_reference]
    fields:
      entry_date: The billing date.
      amount: The amount billed, positive.
      charge_type: What is billed.
      billing_period_start: First day of the period (the installment due date).
      billing_period_end: Last day of the period.
      payment_reference: For a returned payment or its fee, the payment returned; empty otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: lineplan_premium_payment
    target: lineplan_billing_entries
    meaning: Premium is paid directly or remitted by the partner utility.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment or utility remittance confirmation number.
      payment_method: utility_bill, card or ach.
    account: premium_balance
    direction: out
    triggers: []
  - type: lineplan_premium_credit
    target: lineplan_billing_entries
    meaning: A premium credit is posted for a cancellation or a billing correction.
    grain: One row per credit reason and period.
    distinguish_by: [credit_reason, billing_period_start]
    fields:
      entry_date: The posting date.
      amount: The credit, positive.
      credit_reason: Why.
      billing_period_start: The period the credit relates to.
    account: premium_balance
    direction: out
    triggers: []
  - type: lineplan_premium_refund
    target: lineplan_billing_entries
    meaning: A credit balance is refunded.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund, positive.
      refund_reference: The refund confirmation number.
      payment_method: How it is refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: lineplan_service_request
    target: lineplan_service_requests
    meaning: The customer reports a failure on one line.
    grain: One row per line failure reported.
    distinguish_by: [lineplan_service_request_id]
    fields:
      lineplan_service_request_id: The service request number.
      request_date: The date placed.
      line_type: The line reported.
      request_type: new_failure or recall.
      urgency: Emergency or routine.
      failure_description: The customer's description, verbatim.
    triggers: []
  - type: lineplan_contractor_dispatch
    target: lineplan_claim_events
    meaning: A network line contractor is assigned.
    grain: One row per assignment on one service request.
    distinguish_by: [lineplan_service_request_id, dispatch_sequence]
    fields:
      lineplan_service_request_id: The service request.
      event_date: The assignment date.
      service_contractor_id: The contractor.
      dispatch_sequence: 1 for the first assignment, incremented per further assignment.
      dispatch_reason: Initial, re-dispatch or recall.
    triggers: []
  - type: lineplan_line_determination
    target: lineplan_claim_events
    meaning: Bridgewell decides whether the line failure is covered, including which side of the property line it is on.
    grain: One row per service request.
    distinguish_by: [lineplan_service_request_id]
    fields:
      lineplan_service_request_id: The service request.
      event_date: The determination date.
      line_type: The line.
      failure_location: homeowner_side or utility_side.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered.
    triggers: []
  - type: lineplan_repair_authorization
    target: lineplan_claim_events
    meaning: Bridgewell authorizes a section repair, a full line replacement, a temporary repair or a restoration allowance on a covered occurrence.
    grain: One row per authorization number.
    distinguish_by: [authorization_number]
    fields:
      lineplan_service_request_id: The service request.
      event_date: The authorization date.
      line_type: The line.
      authorization_number: The authorization number.
      resolution_type: section_repair, full_line_replacement, temporary_repair or allowance.
      allowance_type: For an allowance, which one.
      repair_method: open_trench, trenchless or not_applicable.
      invoice_amount: The contractor's cost for this item of work.
      amount: The amount Bridgewell pays.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: lineplan_authorization_reversal
    target: lineplan_claim_events
    meaning: An authorization is reversed because the work will not be performed.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      lineplan_service_request_id: The service request.
      event_date: The reversal date.
      reversed_authorization_number: The authorization reversed.
      reversal_reason: Why.
      amount: The amount reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []
  - type: lineplan_work_completion
    target: lineplan_claim_events
    meaning: The contractor reports the permanent repair or replacement complete.
    grain: One row per authorization completed.
    distinguish_by: [authorization_number]
    fields:
      lineplan_service_request_id: The service request.
      event_date: The completion date.
      authorization_number: The authorization completed.
      line_type: The line.
    triggers: []

measures:
  - id: lineplan_msr_occurrence_benefit_paid
    window: One occurrence (a new_failure service request together with any recall request that names it through its repaired section).
    measure: Sum of lineplan_repair_authorization amounts on the occurrence, allowances included, minus lineplan_authorization_reversal amounts for those authorizations.
  - id: lineplan_msr_prior_breaks_in_lookback
    window: The replacement_lookback_days calendar days ending on the request date.
    measure: Count of earlier covered new_failure occurrences on the same line_type of the same property (across this and any earlier plan held for the address) with a completed section_repair in the window.
  - id: lineplan_msr_term_premium_paid
    window: The current term up to the cancellation notice date.
    measure: Sum of lineplan_premium_payment amounts in the window, minus returned_payment charges in the window.
  - id: lineplan_msr_unexpired_term_days
    window: The current term as of the cancellation notice date.
    measure: Count of calendar days from the day after the notice date through term_end_date inclusive.
  - id: lineplan_msr_term_days
    window: The current term.
    measure: Count of calendar days from term_start_date through term_end_date inclusive.
  - id: lineplan_msr_days_since_start
    window: From start_date to the cancellation notice date.
    measure: Count of calendar days from the day after start_date through the notice date inclusive.
  - id: lineplan_msr_term_benefit_paid
    window: The current term up to the cancellation notice date.
    measure: Sum of lineplan_repair_authorization amounts for requests placed in the window, minus reversals of them.

policies:
  - id: lineplan_agg_multi_holding
    subject: [lineplan_enrollment]
    rule: >-
      A customer may hold any number of line protection plans, for one or several properties. Which plans one property
      may hold together is governed by lineplan_agg_no_overlapping_lines.
    eligibility: []
    params:
      max_per_customer: null

  - id: lineplan_agg_no_overlapping_lines
    subject: [lineplan_enrollment]
    rule: >-
      Plans on the same property combine only when they cover different lines: a property may hold, for example, a
      water line plan and an electrical line plan together, and each plan pays its own occurrences under its own caps.
      A plan is not enrolled when the same property address already has a plan in status waiting_period, active or suspended_nonpayment whose covered_line_types share a line type with the plan requested.
      A customer moving from single-line plans to a bundle cancels the overlapping plans first, effective the day before
      the bundle starts; the bundle then serves its own waiting period for lines that were not continuously covered.
      Line protection plans and home warranty contracts on the same property do not exclude each other: when a failure
      is covered by both, the line protection plan pays first and the home warranty contract pays only what remains
      under its own caps.
    eligibility:
      - id: no_overlapping_open_plan
        applies_to: [lineplan_enrollment]
        kind: dedup
        condition: "A plan is not enrolled when the same property address already has a plan in status waiting_period, active or suspended_nonpayment whose covered_line_types share a line type with the plan requested."
        evidence_fields: [lineplan_contracts.property_address, lineplan_contracts.status, lineplan_contracts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.property_address]
          action_bindings:
            lineplan_contracts.property_address: property_address
        dedup_contract:
          table: lineplan_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: [variant_name]
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {covered_line_types: "=covered_line_types", multi_line_bundle: "=multi_line_bundle"}
        Bridgewell Exterior Electrical Line Plan: {covered_line_types: "=covered_line_types", multi_line_bundle: "=multi_line_bundle"}
        Bridgewell Exterior Sewer and Septic Line Plan: {covered_line_types: "=covered_line_types", multi_line_bundle: "=multi_line_bundle"}
        Bridgewell Interior Plumbing and Drainage Plan: {covered_line_types: "=covered_line_types", multi_line_bundle: "=multi_line_bundle"}
        Bridgewell Water and Sewer Line Bundle: {covered_line_types: "=covered_line_types", multi_line_bundle: "=multi_line_bundle"}
        Bridgewell Total Home Lines Plan: {covered_line_types: "=covered_line_types", multi_line_bundle: "=multi_line_bundle"}

  - id: lineplan_enrollment_terms
    subject: [lineplan_enrollment, lineplan_coverage_activation, lineplan_billing_channel_change]
    rule: >-
      The property type is taken from the customer's statement and must satisfy the entry gate of the plan requested.
      Exterior line plans cover only the line segment the homeowner is responsible for, from the utility's connection
      point (curb stop, property-line cleanout, meter or service drop) to the home; condominium owners are not eligible
      for exterior line plans because the association owns those lines. Each term lasts contract_term_months calendar
      months, ending on the day before the same calendar day contract_term_months later, or the last day of the month
      when that day does not exist. coverage_effective_date is start_date plus waiting_period_days calendar days.
      The plan activates no earlier than waiting_period_days calendar days after the plan is enrolled, counting the enrollment date as day zero.
      An enrollment through a partner utility may be billed on the utility bill when on_bill_billing_available is
      true; the customer may move billing between utility_bill, card and ach at any time, effective for the next
      billing period. Plans are not transferable to a new owner when transfer_allowed is false; the seller cancels and
      the buyer enrolls.
    eligibility:
      - id: property_type_eligible
        applies_to: [lineplan_enrollment]
        kind: caller_fact
        condition: "The property type is taken from the customer's statement and must satisfy the entry gate of the plan requested."
        evidence_fields: [lineplan_contracts.property_address, lineplan_contracts.property_type]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.property_address]
          action_bindings:
            lineplan_contracts.property_address: property_address
      - id: line_waiting_elapsed
        applies_to: [lineplan_coverage_activation]
        kind: time
        condition: "The plan activates no earlier than waiting_period_days calendar days after the plan is enrolled, counting the enrollment date as day zero."
        evidence_fields: [lineplan_contracts.start_date, lineplan_contracts.lineplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.lineplan_contract_id]
          action_bindings:
            lineplan_contracts.lineplan_contract_id: lineplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan is enrolled
          anchor_source: lineplan_contracts.start_date
          relation: not_before
          duration_source: variants.waiting_period_days
          unit: calendar_days
          counting_rule: counting the enrollment date as day zero
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {waiting_period_days: "=waiting_period_days", on_bill_billing_available: "=on_bill_billing_available", transfer_allowed: "=transfer_allowed", contract_term_months: "=contract_term_months"}
        Bridgewell Exterior Electrical Line Plan: {waiting_period_days: "=waiting_period_days", on_bill_billing_available: "=on_bill_billing_available", transfer_allowed: "=transfer_allowed", contract_term_months: "=contract_term_months"}
        Bridgewell Exterior Sewer and Septic Line Plan: {waiting_period_days: "=waiting_period_days", on_bill_billing_available: "=on_bill_billing_available", transfer_allowed: "=transfer_allowed", contract_term_months: "=contract_term_months"}
        Bridgewell Interior Plumbing and Drainage Plan: {waiting_period_days: "=waiting_period_days", on_bill_billing_available: "=on_bill_billing_available", transfer_allowed: "=transfer_allowed", contract_term_months: "=contract_term_months"}
        Bridgewell Water and Sewer Line Bundle: {waiting_period_days: "=waiting_period_days", on_bill_billing_available: "=on_bill_billing_available", transfer_allowed: "=transfer_allowed", contract_term_months: "=contract_term_months"}
        Bridgewell Total Home Lines Plan: {waiting_period_days: "=waiting_period_days", on_bill_billing_available: "=on_bill_billing_available", transfer_allowed: "=transfer_allowed", contract_term_months: "=contract_term_months"}

  - id: lineplan_premium_pricing
    subject: [lineplan_premium_charge]
    rule: >-
      A monthly-billed plan is charged monthly_premium per billing period, each period starting on the same calendar day
      of the month as term_start_date (the last day of the month when that day does not exist) and due on its start. An
      annual-billed plan is charged once per term on term_start_date twelve monthly premiums reduced by
      annual_pay_discount_rate, rounded to the cent. Renewal terms are priced at the parameters in force on the new term
      start. A returned payment is billed back as a returned_payment charge plus one returned_payment_fee charge.
      Premium is billed only while the plan status is waiting_period, active or suspended_nonpayment.
    eligibility:
      - id: line_premium_on_open_plan
        applies_to: [lineplan_premium_charge]
        kind: state
        condition: "Premium is billed only while the plan status is waiting_period, active or suspended_nonpayment."
        evidence_fields: [lineplan_contracts.status, lineplan_contracts.lineplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.lineplan_contract_id]
          action_bindings:
            lineplan_contracts.lineplan_contract_id: lineplan_contract_id
        state_contract:
          field: lineplan_contracts.status
          allowed: [waiting_period, active, suspended_nonpayment]
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {monthly_premium: "=monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Exterior Electrical Line Plan: {monthly_premium: "=monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Exterior Sewer and Septic Line Plan: {monthly_premium: "=monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Interior Plumbing and Drainage Plan: {monthly_premium: "=monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Water and Sewer Line Bundle: {monthly_premium: "=monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Total Home Lines Plan: {monthly_premium: "=monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate", returned_payment_fee: "=returned_payment_fee"}
    formula:
      annual_premium: "round(monthly_premium * 12 * (1 - annual_pay_discount_rate), 2)"

  - id: lineplan_premium_collection_and_nonpayment
    subject: [lineplan_premium_payment, lineplan_nonpayment_suspension, lineplan_reinstatement, lineplan_nonpayment_cancellation]
    rule: >-
      Payments, including partner utility remittances, are applied oldest unpaid charge first.
      Coverage is suspended only when a premium remains unpaid more than payment_grace_days calendar days after the premium's due date; the count starts the day after the due date.
      No service request is accepted on a suspended plan.
      A suspended plan is reinstated only when premium_balance is zero or less and the payment posts no later than suspension_cure_days calendar days after the plan was suspended; the count starts the day after suspended_date and the boundary day itself qualifies.
      A suspended plan not cured within that window is cancelled for nonpayment with no refund.
    eligibility:
      - id: line_grace_passed
        applies_to: [lineplan_nonpayment_suspension]
        kind: time
        condition: "Coverage is suspended only when a premium remains unpaid more than payment_grace_days calendar days after the premium's due date; the count starts the day after the due date."
        evidence_fields: [lineplan_billing_entries.billing_period_start, lineplan_billing_entries.lineplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_billing_entries.lineplan_contract_id]
          action_bindings:
            lineplan_billing_entries.lineplan_contract_id: lineplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the premium's due date
          anchor_source: lineplan_billing_entries.billing_period_start
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after the due date
          boundary: exclusive
      - id: line_cure_window
        applies_to: [lineplan_reinstatement]
        kind: time
        condition: "A suspended plan is reinstated only when premium_balance is zero or less and the payment posts no later than suspension_cure_days calendar days after the plan was suspended; the count starts the day after suspended_date and the boundary day itself qualifies."
        evidence_fields: [lineplan_contracts.suspended_date, lineplan_contracts.premium_balance, lineplan_contracts.lineplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.lineplan_contract_id]
          action_bindings:
            lineplan_contracts.lineplan_contract_id: lineplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan was suspended
          anchor_source: lineplan_contracts.suspended_date
          relation: not_after
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: the count starts the day after suspended_date and the boundary day itself qualifies
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days"}
        Bridgewell Exterior Electrical Line Plan: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days"}
        Bridgewell Exterior Sewer and Septic Line Plan: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days"}
        Bridgewell Interior Plumbing and Drainage Plan: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days"}
        Bridgewell Water and Sewer Line Bundle: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days"}
        Bridgewell Total Home Lines Plan: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days"}

  - id: lineplan_renewal_and_cancellation
    subject: [lineplan_renewal_notice, lineplan_renewal_preference_change, lineplan_renewal, lineplan_expiration, lineplan_late_renewal, lineplan_cancellation, lineplan_premium_credit, lineplan_premium_refund]
    rule: >-
      A plan with auto_renew true renews on its term end only when its renewal notice was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date and a notice issued exactly that many days before qualifies.
      Otherwise the plan expires at the end of term_end_date unless the customer renews before then. An expired plan can
      be restored within late_renewal_grace_days calendar days after term_end_date with no new waiting period, starting a
      new term on the restoration date. The customer may cancel at any time by giving notice; the cancellation is
      effective on the notice date. Within free_look_days calendar days after start_date (lineplan_msr_days_since_start)
      the customer is credited all premium paid less lineplan_msr_term_benefit_paid. After that, an annual-billed plan is
      credited lineplan_msr_term_premium_paid times lineplan_msr_unexpired_term_days divided by lineplan_msr_term_days,
      rounded to the cent, less cancellation_admin_fee and less lineplan_msr_term_benefit_paid, and a monthly-billed plan
      is credited nothing and simply stops billing. A credit is never negative.
      Only one cancellation credit is posted per plan cancellation.
      Credits are refunded within refund_processing_days calendar days to the channel that paid, a utility-billed plan
      being refunded by the partner utility as a bill credit.
    eligibility:
      - id: line_renewal_notice_in_time
        applies_to: [lineplan_renewal]
        kind: time
        condition: "A plan with auto_renew true renews on its term end only when its renewal notice was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date and a notice issued exactly that many days before qualifies."
        evidence_fields: [lineplan_contracts.renewal_notice_date, lineplan_contracts.term_end_date, lineplan_contracts.lineplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.lineplan_contract_id]
          action_bindings:
            lineplan_contracts.lineplan_contract_id: lineplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its renewal notice was issued
          anchor_source: lineplan_contracts.renewal_notice_date
          relation: not_before
          duration_source: variants.renewal_notice_days
          unit: calendar_days
          counting_rule: counting runs backward from term_end_date and a notice issued exactly that many days before qualifies
          boundary: inclusive
      - id: one_line_cancellation_credit
        applies_to: [lineplan_premium_credit]
        kind: dedup
        condition: "Only one cancellation credit is posted per plan cancellation."
        evidence_fields: [lineplan_billing_entries.lineplan_contract_id, lineplan_billing_entries.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_billing_entries.lineplan_contract_id, lineplan_billing_entries.credit_reason]
          action_bindings:
            lineplan_billing_entries.lineplan_contract_id: lineplan_contract_id
            lineplan_billing_entries.credit_reason: credit_reason
        dedup_contract:
          table: lineplan_billing_entries
          mode: separate_record
          object_bindings: {lineplan_contract_id: lineplan_contract_id, credit_reason: credit_reason}
          duplicate_filters: {credit_reason: [cancellation_refund_credit]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days"}
        Bridgewell Exterior Electrical Line Plan: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days"}
        Bridgewell Exterior Sewer and Septic Line Plan: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days"}
        Bridgewell Interior Plumbing and Drainage Plan: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days"}
        Bridgewell Water and Sewer Line Bundle: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days"}
        Bridgewell Total Home Lines Plan: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", refund_processing_days: "=refund_processing_days"}
    formula:
      cancellation_credit: "max(0, lineplan_msr_term_premium_paid - lineplan_msr_term_benefit_paid) if lineplan_msr_days_since_start <= free_look_days else (0 if billing_frequency == 'monthly' else max(0, round(lineplan_msr_term_premium_paid * lineplan_msr_unexpired_term_days / lineplan_msr_term_days, 2) - cancellation_admin_fee - lineplan_msr_term_benefit_paid))"
    measures: [lineplan_msr_days_since_start, lineplan_msr_term_premium_paid, lineplan_msr_unexpired_term_days, lineplan_msr_term_days, lineplan_msr_term_benefit_paid]

  - id: lineplan_evt_service_request
    subject: [lineplan_service_request]
    rule: >-
      Line service requests are accepted only while the plan status is active.
      Line plans carry no service call fee and no deductible. A request names one line. A failure of a section repaired
      under the plan reported no later than repair_guarantee_days calendar days after that repair was completed is a
      recall of the original occurrence, not a new occurrence. A request is an emergency when the failure stops water,
      sewer, electrical or gas service to the home, or a line is actively leaking or a gas leak is suspected; a suspected
      gas leak is first reported to the gas utility and 911.
    eligibility:
      - id: line_requests_on_active_plan
        applies_to: [lineplan_service_request]
        kind: state
        condition: "Line service requests are accepted only while the plan status is active."
        evidence_fields: [lineplan_contracts.status, lineplan_contracts.lineplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.lineplan_contract_id]
          action_bindings:
            lineplan_contracts.lineplan_contract_id: lineplan_contract_id
        state_contract:
          field: lineplan_contracts.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {repair_guarantee_days: "=repair_guarantee_days"}
