        interior_drain_line: interior_plumbing_occurrence_cap
        gas_service_line: gas_line_occurrence_cap
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {water_line_occurrence_cap: "=water_line_occurrence_cap", sewer_line_occurrence_cap: "=sewer_line_occurrence_cap", electrical_line_occurrence_cap: "=electrical_line_occurrence_cap", interior_plumbing_occurrence_cap: "=interior_plumbing_occurrence_cap", gas_line_occurrence_cap: "=gas_line_occurrence_cap", public_way_restoration_allowance: "=public_way_restoration_allowance", landscaping_restoration_allowance: "=landscaping_restoration_allowance", slab_access_allowance: "=slab_access_allowance", full_replacement_break_count: "=full_replacement_break_count", replacement_lookback_days: "=replacement_lookback_days", trenchless_method_allowed: "=trenchless_method_allowed", emergency_temporary_repair_covered: "=emergency_temporary_repair_covered", permit_fee_covered: "=permit_fee_covered", camera_inspection_covered: "=camera_inspection_covered", cleanout_installation_covered: "=cleanout_installation_covered", hardscape_restoration_covered: "=hardscape_restoration_covered", gas_leak_test_covered: "=gas_leak_test_covered"}
        Bridgewell Exterior Electrical Line Plan: {water_line_occurrence_cap: "=water_line_occurrence_cap", sewer_line_occurrence_cap: "=sewer_line_occurrence_cap", electrical_line_occurrence_cap: "=electrical_line_occurrence_cap", interior_plumbing_occurrence_cap: "=interior_plumbing_occurrence_cap", gas_line_occurrence_cap: "=gas_line_occurrence_cap", public_way_restoration_allowance: "=public_way_restoration_allowance", landscaping_restoration_allowance: "=landscaping_restoration_allowance", slab_access_allowance: "=slab_access_allowance", full_replacement_break_count: "=full_replacement_break_count", replacement_lookback_days: "=replacement_lookback_days", trenchless_method_allowed: "=trenchless_method_allowed", emergency_temporary_repair_covered: "=emergency_temporary_repair_covered", permit_fee_covered: "=permit_fee_covered", camera_inspection_covered: "=camera_inspection_covered", cleanout_installation_covered: "=cleanout_installation_covered", hardscape_restoration_covered: "=hardscape_restoration_covered", gas_leak_test_covered: "=gas_leak_test_covered"}
