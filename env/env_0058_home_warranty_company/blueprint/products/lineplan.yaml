  - id: lineplan_evt_dispatch
    subject: [lineplan_contractor_dispatch]
    rule: >-
      A line contractor is dispatched only while the plan status is active.
      The request goes to a network contractor with trade utility_line (electrical for an electrical line) whose service
      ZIP codes include the property_zip, preferred before standard, never suspended, emergency-capable for an emergency;
      ties go to the contractor reference that sorts first alphabetically. The contractor contacts the customer within
      routine_contact_hours hours, or emergency_contact_hours hours for an emergency; a missed window leads to re-dispatch.
      When own_contractor_reimbursement_allowed is false, work by a contractor the customer hires is never reimbursed.
      Each assignment carries the next dispatch_sequence starting at 1.
    eligibility:
      - id: line_dispatch_on_active_plan
        applies_to: [lineplan_contractor_dispatch]
        kind: state
        condition: "A line contractor is dispatched only while the plan status is active."
        evidence_fields: [lineplan_contracts.status, lineplan_contracts.lineplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_contracts.lineplan_contract_id]
          action_bindings:
            lineplan_contracts.lineplan_contract_id: lineplan_contract_id
        state_contract:
          field: lineplan_contracts.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours", own_contractor_reimbursement_allowed: "=own_contractor_reimbursement_allowed"}
        Bridgewell Exterior Electrical Line Plan: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours", own_contractor_reimbursement_allowed: "=own_contractor_reimbursement_allowed"}
        Bridgewell Exterior Sewer and Septic Line Plan: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours", own_contractor_reimbursement_allowed: "=own_contractor_reimbursement_allowed"}
        Bridgewell Interior Plumbing and Drainage Plan: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours", own_contractor_reimbursement_allowed: "=own_contractor_reimbursement_allowed"}
        Bridgewell Water and Sewer Line Bundle: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours", own_contractor_reimbursement_allowed: "=own_contractor_reimbursement_allowed"}
        Bridgewell Total Home Lines Plan: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours", own_contractor_reimbursement_allowed: "=own_contractor_reimbursement_allowed"}

  - id: lineplan_evt_line_determination
    subject: [lineplan_line_determination]
    rule: >-
      One determination is issued per line service request.
      A line failure is covered only when every condition below holds, and otherwise is not_covered with the first
      failing reason in this order. (1) contract_not_in_force: the plan was active on the request date. (2)
      waiting_period: the failure was first reported on or after coverage_effective_date. (3) line_not_in_plan: the line
      type is in covered_line_types and its occurrence cap is above 0.00, a septic line only when septic_line_covered
      is true and a well line only when well_line_covered is true. (4) utility_owned_side: the failure is on the
      homeowner's side of the connection point (failure_location homeowner_side); a utility-side failure is referred to
      the utility. (5) utility_mandated_work: work ordered by the utility or a government program is covered only when
      utility_mandated_work_covered is true, and replacing a lead service line only when lead_line_replacement_covered is
      true. (6) preexisting_condition: a failure that began before coverage_effective_date is never covered.
      (7) third_party_damage: damage by digging, construction or a third party is never covered. (8)
      excluded_condition: the failure is not one of the plan's excluded_conditions, freezing is covered only when
      frozen_line_covered is true and tree roots only when tree_root_damage_covered is true.
    eligibility:
      - id: one_line_determination
        applies_to: [lineplan_line_determination]
        kind: dedup
        condition: "One determination is issued per line service request."
        evidence_fields: [lineplan_claim_events.lineplan_service_request_id, lineplan_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_claim_events.lineplan_service_request_id]
          action_bindings:
            lineplan_claim_events.lineplan_service_request_id: lineplan_service_request_id
        dedup_contract:
          table: lineplan_claim_events
          mode: separate_record
          object_bindings: {lineplan_service_request_id: lineplan_service_request_id}
          duplicate_filters: {event_type: [lineplan_line_determination]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Exterior Water Service Line Plan: {septic_line_covered: "=septic_line_covered", well_line_covered: "=well_line_covered", utility_mandated_work_covered: "=utility_mandated_work_covered", lead_line_replacement_covered: "=lead_line_replacement_covered", frozen_line_covered: "=frozen_line_covered", tree_root_damage_covered: "=tree_root_damage_covered", excluded_conditions: "=excluded_conditions", main_shutoff_valve_covered: "=main_shutoff_valve_covered", meter_base_covered: "=meter_base_covered", interior_drain_clearing_covered: "=interior_drain_clearing_covered", backflow_preventer_covered: "=backflow_preventer_covered"}
        Bridgewell Exterior Electrical Line Plan: {septic_line_covered: "=septic_line_covered", well_line_covered: "=well_line_covered", utility_mandated_work_covered: "=utility_mandated_work_covered", lead_line_replacement_covered: "=lead_line_replacement_covered", frozen_line_covered: "=frozen_line_covered", tree_root_damage_covered: "=tree_root_damage_covered", excluded_conditions: "=excluded_conditions", main_shutoff_valve_covered: "=main_shutoff_valve_covered", meter_base_covered: "=meter_base_covered", interior_drain_clearing_covered: "=interior_drain_clearing_covered", backflow_preventer_covered: "=backflow_preventer_covered"}
        Bridgewell Exterior Sewer and Septic Line Plan: {septic_line_covered: "=septic_line_covered", well_line_covered: "=well_line_covered", utility_mandated_work_covered: "=utility_mandated_work_covered", lead_line_replacement_covered: "=lead_line_replacement_covered", frozen_line_covered: "=frozen_line_covered", tree_root_damage_covered: "=tree_root_damage_covered", excluded_conditions: "=excluded_conditions", main_shutoff_valve_covered: "=main_shutoff_valve_covered", meter_base_covered: "=meter_base_covered", interior_drain_clearing_covered: "=interior_drain_clearing_covered", backflow_preventer_covered: "=backflow_preventer_covered"}
        Bridgewell Interior Plumbing and Drainage Plan: {septic_line_covered: "=septic_line_covered", well_line_covered: "=well_line_covered", utility_mandated_work_covered: "=utility_mandated_work_covered", lead_line_replacement_covered: "=lead_line_replacement_covered", frozen_line_covered: "=frozen_line_covered", tree_root_damage_covered: "=tree_root_damage_covered", excluded_conditions: "=excluded_conditions", main_shutoff_valve_covered: "=main_shutoff_valve_covered", meter_base_covered: "=meter_base_covered", interior_drain_clearing_covered: "=interior_drain_clearing_covered", backflow_preventer_covered: "=backflow_preventer_covered"}
        Bridgewell Water and Sewer Line Bundle: {septic_line_covered: "=septic_line_covered", well_line_covered: "=well_line_covered", utility_mandated_work_covered: "=utility_mandated_work_covered", lead_line_replacement_covered: "=lead_line_replacement_covered", frozen_line_covered: "=frozen_line_covered", tree_root_damage_covered: "=tree_root_damage_covered", excluded_conditions: "=excluded_conditions", main_shutoff_valve_covered: "=main_shutoff_valve_covered", meter_base_covered: "=meter_base_covered", interior_drain_clearing_covered: "=interior_drain_clearing_covered", backflow_preventer_covered: "=backflow_preventer_covered"}
        Bridgewell Total Home Lines Plan: {septic_line_covered: "=septic_line_covered", well_line_covered: "=well_line_covered", utility_mandated_work_covered: "=utility_mandated_work_covered", lead_line_replacement_covered: "=lead_line_replacement_covered", frozen_line_covered: "=frozen_line_covered", tree_root_damage_covered: "=tree_root_damage_covered", excluded_conditions: "=excluded_conditions", main_shutoff_valve_covered: "=main_shutoff_valve_covered", meter_base_covered: "=meter_base_covered", interior_drain_clearing_covered: "=interior_drain_clearing_covered", backflow_preventer_covered: "=backflow_preventer_covered"}

  - id: lineplan_evt_repair_authorization
    subject: [lineplan_repair_authorization, lineplan_authorization_reversal, lineplan_work_completion]
    rule: >-
      Line work is authorized only after a covered determination is on file for the service request.
      Each occurrence is paid up to the plan's occurrence cap for the line type (occurrence_cap), counted by
      lineplan_msr_occurrence_benefit_paid, and occurrences are not limited in number. The contractor repairs the failed
      section, except that the whole line from the connection point to the home is replaced when
      full_replacement_break_count is above 0 and lineplan_msr_prior_breaks_in_lookback is at or above
      full_replacement_break_count minus 1. Trenchless methods are used only when trenchless_method_allowed is true and
      cost no more than open trenching. When emergency_temporary_repair_covered is true, a temporary repair to restore
      service is authorized first and counts toward the same occurrence. Restoration allowances are paid inside the
      occurrence cap, never in addition to it: public_way_restoration_allowance for a public sidewalk, curb or street,
      landscaping_restoration_allowance for basic lawn restoration, slab_access_allowance for access through a slab,
      and permits, camera inspection and cleanout installation where permit_fee_covered, camera_inspection_covered and
      cleanout_installation_covered are true. Private driveways and patios are restored only when
      hardscape_restoration_covered is true. Each authorization pays the lower of its invoice_amount and the remaining
      occurrence benefit; the customer may pay the contractor for work beyond the cap or decline it. A recall is paid
      under the original occurrence and its remaining benefit. An authorization is reversed in full when the work will not be performed and never after completion.
      The completion report starts the repair guarantee.
    eligibility:
      - id: line_covered_before_work
        applies_to: [lineplan_repair_authorization]
        kind: authorization
        condition: "Line work is authorized only after a covered determination is on file for the service request."
        evidence_fields: [lineplan_claim_events.determination_outcome, lineplan_claim_events.lineplan_service_request_id]
