          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lineplan_claim_events.lineplan_service_request_id]
          action_bindings:
            lineplan_claim_events.lineplan_service_request_id: lineplan_service_request_id
    params:
      occurrence_cap:
        water_service_line: water_line_occurrence_cap
