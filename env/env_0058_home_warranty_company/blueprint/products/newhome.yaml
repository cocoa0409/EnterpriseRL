  - id: newhome_claim_determination_rules
    subject: [newhome_claim_determination]
    rule: >-
      One determination is issued per claim.
      A claim is covered only when every condition holds, and otherwise is not_covered with the first failing reason:
      (1) warranty_not_in_force: the warranty was confirmed and the defect was discovered within the phase for its
      category, or filed within the grace after it. (2) late_notice: the claim met the notice window in
      newhome_claim_filing. (3) below_performance_standard: a drywall crack is wider than drywall_crack_threshold_inches,
      a slab crack wider or displaced more than slab_crack_threshold_inches, or a floor more than
      floor_out_of_level_threshold_inches out of level within any 32-inch span. (4) not_structural_defect: a structural
      claim shows actual physical damage to one of load_bearing_elements_covered that makes it unable to carry its load
      or makes the home unsafe, confirmed by an engineer when structural_claim_engineer_required is true; damage from
      soil movement qualifies only when soil_movement_damage_covered is true. (5) excluded_item: the item is not in
      workmanship_items_excluded, mold damage is excluded unless mold_damage_covered is true, detached structures unless
      detached_structures_covered is true, and association common elements unless condo_common_elements_covered is
      true. (6) owner_caused: damage from the owner's alterations, neglect or failure to maintain drainage is excluded.
      Structural determinations are issued within structural_evaluation_days calendar days after filing.
    eligibility:
      - id: one_determination_per_claim
        applies_to: [newhome_claim_determination]
        kind: dedup
        condition: "One determination is issued per claim."
        evidence_fields: [newhome_claim_events.newhome_claim_id, newhome_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [newhome_claim_events.newhome_claim_id]
          action_bindings:
            newhome_claim_events.newhome_claim_id: newhome_claim_id
        dedup_contract:
          table: newhome_claim_events
          mode: separate_record
          object_bindings: {newhome_claim_id: newhome_claim_id}
          duplicate_filters: {event_type: [newhome_claim_determination]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Structural-Only Ten-Year Warranty: {drywall_crack_threshold_inches: "=drywall_crack_threshold_inches", slab_crack_threshold_inches: "=slab_crack_threshold_inches", floor_out_of_level_threshold_inches: "=floor_out_of_level_threshold_inches", load_bearing_elements_covered: "=load_bearing_elements_covered", structural_claim_engineer_required: "=structural_claim_engineer_required", soil_movement_damage_covered: "=soil_movement_damage_covered", workmanship_items_excluded: "=workmanship_items_excluded", mold_damage_covered: "=mold_damage_covered", detached_structures_covered: "=detached_structures_covered", condo_common_elements_covered: "=condo_common_elements_covered", structural_evaluation_days: "=structural_evaluation_days"}
        Bridgewell 1-2-10 Builder Warranty: {drywall_crack_threshold_inches: "=drywall_crack_threshold_inches", slab_crack_threshold_inches: "=slab_crack_threshold_inches", floor_out_of_level_threshold_inches: "=floor_out_of_level_threshold_inches", load_bearing_elements_covered: "=load_bearing_elements_covered", structural_claim_engineer_required: "=structural_claim_engineer_required", soil_movement_damage_covered: "=soil_movement_damage_covered", workmanship_items_excluded: "=workmanship_items_excluded", mold_damage_covered: "=mold_damage_covered", detached_structures_covered: "=detached_structures_covered", condo_common_elements_covered: "=condo_common_elements_covered", structural_evaluation_days: "=structural_evaluation_days"}
