  - id: newhome_payments_and_settlements
    subject: [newhome_benefit_authorization, newhome_authorization_reversal]
    rule: >-
      A payment is authorized only after a covered determination is on file for the claim.
      Structural: Bridgewell repairs the defect or, when structural_cash_settlement_allowed is true, pays the reasonable
      cost of repair in cash, at its own option; engineer inspections are at its cost when engineer_inspection_covered is
      true; when the home must be vacated, lodging and storage are paid up to structural_living_expense_allowance per
      claim. All structural payments over the warranty's life are limited to structural_limit_pct_of_sale_price times
      final_sale_price, counted by newhome_msr_structural_paid_life. The structural_deductible is billed on the first
      structural claim only when structural_deductible_once_per_home is true (newhome_msr_structural_deductibles_billed).
      A structural repair is warranted through structural_end_date when structural_repair_warranty_to_term_end is true.
      Systems extension: in the extension years, a claim in one of systems_extension_trades is paid up to
      systems_extension_claim_cap less systems_extension_deductible, within systems_extension_aggregate
      (newhome_msr_systems_extension_paid). Appliances: a covered appliance in appliance_types_covered is repaired or
      replaced up to appliance_item_cap with appliance_service_fee billed per claim. Emergency work the homeowner had
      done to stop further damage to a covered defect is reimbursed up to emergency_repair_reimbursement_cap. An
      authorization is reversed in full when the work will not be performed or was authorized in error.
    eligibility:
      - id: covered_before_payment
        applies_to: [newhome_benefit_authorization]
        kind: authorization
        condition: "A payment is authorized only after a covered determination is on file for the claim."
        evidence_fields: [newhome_claim_events.determination_outcome, newhome_claim_events.newhome_claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [newhome_claim_events.newhome_claim_id]
          action_bindings:
            newhome_claim_events.newhome_claim_id: newhome_claim_id
