# New Home Builder Warranties — third-party warranties a home builder enrolls for each new home at closing:
# workmanship, systems and structural coverage phases running from the closing date, held by the homeowner.
category: newhome
display_name: New Home Builder Warranties

binding:
  holding_table: newhome_warranties
  event_tables: [newhome_billing_entries, newhome_claims, newhome_claim_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {builder_fee_balance: builder_fee_balance}

lifecycle:
  states: [enrollment_pending, workmanship_period, systems_period, structural_period, expired, voided]
  transitions:
    - {from: enrollment_pending, to: workmanship_period, by: system, means: The builder's enrollment fee is paid and coverage starts at the closing date in the workmanship period.}
    - {from: enrollment_pending, to: structural_period, by: system, means: The builder's enrollment fee is paid on a structural-only warranty and coverage starts at the closing date.}
    - {from: enrollment_pending, to: voided, by: system, means: The builder did not pay the enrollment fee in time and the enrollment is voided.}
    - {from: workmanship_period, to: systems_period, by: system, means: The workmanship period ends and the systems period continues.}
    - {from: systems_period, to: structural_period, by: system, means: The systems period ends and only structural coverage continues.}
    - {from: structural_period, to: expired, by: system, means: The structural period ends.}

accounts:
  - key: builder_fee_balance
    unit: USD
    meaning: Enrollment fee the builder owes for this home; positive means owed to Bridgewell.
  - key: deductible_balance
    unit: USD
    meaning: Deductibles and fees billed to the homeowner on claims and not yet paid or waived.
  - key: benefit_consumed
    unit: USD
    meaning: Dollars Bridgewell has committed on the warranty's claims (structural repairs or settlements, living expenses, systems extension, appliance, builder-default and emergency reimbursements), net of reversals.

parameter_schema:
  workmanship_years: Years after closing during which workmanship defects are covered (the builder's obligation), years; 0 means none.
  systems_years: Years after closing during which plumbing, electrical and HVAC distribution systems are covered, years; 0 means none.
  structural_years: Years after closing during which structural defects are covered by Bridgewell, years.
  builder_fee_rate_per_thousand: Builder enrollment fee per 1,000 dollars of final sale price, USD.
  builder_fee_minimum: Minimum builder enrollment fee per home, USD.
  builder_enrollment_window_days: Calendar days after closing within which the builder must enroll the home, days.
  builder_fee_payment_days: Calendar days after enrollment within which the builder must pay the fee, days.
  structural_deductible: Deductible the homeowner pays on a structural claim, USD.
  structural_limit_pct_of_sale_price: Structural coverage limit over the warranty's life as a fraction of the final sale price, decimal fraction.
  structural_living_expense_allowance: Amount paid toward lodging and storage when the home must be vacated for a structural repair, USD.
  structural_cash_settlement_allowed: Whether Bridgewell may pay the reasonable cost of repair in cash instead of repairing, boolean.
  structural_evaluation_days: Calendar days after a structural claim is filed within which Bridgewell issues its determination, days.
  engineer_inspection_covered: Whether the engineering inspection of a structural claim is at Bridgewell's cost, boolean.
  soil_movement_damage_covered: Whether structural damage caused by soil movement is covered, boolean.
  condo_common_elements_covered: Whether common elements of an attached-home association are covered, boolean.
  systems_extension_deductible: Deductible per systems claim in the years Bridgewell insures systems beyond year two, USD.
  systems_extension_claim_cap: Limit per systems claim in the extension years, USD.
  systems_extension_aggregate: Total limit for systems claims in the extension years, USD.
  appliance_coverage_years: Years after closing during which builder-installed appliances are covered, years; 0 means none.
  appliance_item_cap: Limit per appliance claim, USD.
  appliance_service_fee: Service fee per appliance claim, USD.
  water_penetration_years: Years after closing during which water penetration through roof, windows and walls is covered as workmanship, years.
  builder_tender_required_first: Whether workmanship and builder-period systems claims go to the builder first, boolean.
  builder_response_days: Calendar days after a claim is tendered within which the builder must respond, days.
  builder_repair_completion_days: Calendar days after accepting a claim within which the builder must complete the repair, days.
  builder_default_backstop: Whether Bridgewell pays for an accepted workmanship or systems defect when the builder defaults, boolean.
  builder_default_limit: Total limit Bridgewell pays for builder-default claims, USD.
  mediation_available: Whether the homeowner may request mediation of a builder dispute, boolean.
  mediation_fee: Fee the homeowner pays to request mediation, USD.
  mediation_fee_refunded_if_homeowner_prevails: Whether the mediation fee is refunded when the mediator finds for the homeowner, boolean.
  mediation_request_days: Calendar days after the builder's response (or missed deadline) within which mediation must be requested, days.
  claim_notice_days_after_discovery: Calendar days after discovering a defect within which the claim must be filed, days.
  claim_grace_after_period_end_days: Calendar days after a coverage phase ends within which a defect discovered during it may still be filed, days.
  cosmetic_reporting_days: Calendar days after closing within which cosmetic surface defects must be reported, days.
  drywall_crack_threshold_inches: Drywall crack width above which a crack is a workmanship defect, inches.
  slab_crack_threshold_inches: Concrete slab crack width or vertical displacement above which it is a workmanship defect, inches.
  floor_out_of_level_threshold_inches: Floor deviation within any 32-inch span above which it is a workmanship defect, inches.
  emergency_repair_reimbursement_cap: Amount reimbursed for emergency work the homeowner has done to prevent further damage before a claim is evaluated, USD.
  automatic_transfer_to_subsequent_owner: Whether the warranty passes automatically to a later owner of the home, boolean.
  mold_damage_covered: Whether mold damage is covered, boolean.
  detached_structures_covered: Whether detached garages and outbuildings are covered, boolean.
  structural_repair_warranty_to_term_end: Whether a structural repair is itself warranted through the end of the structural period, boolean.
  systems_extension_trades: Trades covered in the systems extension years, list.
  appliance_types_covered: Appliance types covered, list.
  workmanship_items_excluded: Items never covered as workmanship, list.
  load_bearing_elements_covered: Load-bearing elements whose actual physical damage is a structural defect, list.
  structural_claim_engineer_required: Whether a structural determination requires an engineer's evaluation, boolean.
  structural_deductible_once_per_home: Whether the structural deductible is charged only once over the warranty's life, boolean.

