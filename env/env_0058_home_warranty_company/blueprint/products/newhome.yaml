events:
  - type: newhome_enrollment
    target: newhome_warranties
    mutation: create
    meaning: A registered builder enrolls a newly built home sold to a homeowner.
    grain: One row per home enrolled.
    fields:
      customer_id: The first homeowner.
      variant_name: The warranty program enrolled.
      property_address: The home's address as stated.
      property_zip: The home's ZIP code.
      home_type: Detached, townhome or condominium.
      builder_name: The builder, verbatim.
      builder_registration_number: The builder's Bridgewell registration number, verbatim.
      final_sale_price: The final sale price on the closing statement.
      closing_date: The closing date, when coverage starts.
      enrollment_date: The date the builder enrolled the home.
      workmanship_end_date: The last day of the workmanship period (empty for structural-only).
      systems_end_date: The last day of the systems period (empty for structural-only).
      structural_end_date: The last day of the structural period.
    triggers:
      - event: newhome:newhome_builder_fee_charge
        map: {charge_type: builder_enrollment_fee}
  - type: newhome_enrollment_confirmation
    target: newhome_warranties
    mutation: {transition: [{from: enrollment_pending, to: workmanship_period}, {from: enrollment_pending, to: structural_period}]}
    meaning: The builder's fee is paid and the warranty is confirmed from the closing date.
    grain: One row per transaction.
    fields:
      status: Becomes workmanship_period, or structural_period for a structural-only warranty.
    triggers: []
  - type: newhome_void_unpaid
    target: newhome_warranties
    mutation: {transition: {from: enrollment_pending, to: voided}}
    meaning: The enrollment is voided because the builder did not pay the fee in time.
    grain: One row per transaction.
    fields:
      status: Becomes voided.
      end_date: The void date.
    triggers:
      - event: newhome:newhome_fee_credit
        map: {credit_reason: enrollment_voided}
  - type: newhome_systems_phase_start
    target: newhome_warranties
    mutation: {transition: {from: workmanship_period, to: systems_period}}
    meaning: The workmanship period ends.
    grain: One row per transaction.
    fields:
      status: Becomes systems_period.
    triggers: []
  - type: newhome_structural_phase_start
    target: newhome_warranties
    mutation: {transition: {from: systems_period, to: structural_period}}
    meaning: The systems period ends.
    grain: One row per transaction.
    fields:
      status: Becomes structural_period.
    triggers: []
  - type: newhome_expiration
    target: newhome_warranties
    mutation: {transition: {from: structural_period, to: expired}}
    meaning: The structural period ends.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The structural_end_date.
    triggers: []
  - type: newhome_owner_transfer
    target: newhome_warranties
    mutation: update
    meaning: The home is sold and the warranty passes to the new owner.
    grain: One row per transaction.
    fields:
      customer_id: The new owner.
      transfer_date: The date of the resale closing.
    triggers: []
  - type: newhome_builder_fee_charge
    target: newhome_billing_entries
    meaning: The builder is billed the enrollment fee for the home.
    grain: One row per home enrollment fee.
    distinguish_by: [charge_type]
    fields:
      entry_date: The billing date.
      amount: The fee, positive.
      charge_type: builder_enrollment_fee.
      payer_role: builder.
    account: builder_fee_balance
    direction: in
    triggers: []
  - type: newhome_builder_fee_payment
    target: newhome_billing_entries
    meaning: The builder pays the enrollment fee.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: How it was paid.
      payer_role: builder.
    account: builder_fee_balance
    direction: out
    triggers: []
  - type: newhome_fee_credit
    target: newhome_billing_entries
    meaning: The builder's fee is credited because the enrollment was voided or billed in error.
    grain: One row per credit reason.
    distinguish_by: [credit_reason]
    fields:
      entry_date: The posting date.
      amount: The credit, positive.
      credit_reason: Why.
    account: builder_fee_balance
    direction: out
    triggers: []
  - type: newhome_homeowner_charge
    target: newhome_billing_entries
    meaning: The homeowner is billed a structural deductible, a systems extension deductible, an appliance service fee or a mediation fee on a claim.
    grain: One row per charge type on one claim.
    distinguish_by: [newhome_claim_id, charge_type]
    fields:
      entry_date: The billing date.
      amount: The amount, positive.
      charge_type: Which deductible or fee.
      newhome_claim_id: The claim.
      payer_role: homeowner.
    account: deductible_balance
    direction: in
    triggers: []
  - type: newhome_homeowner_payment
    target: newhome_billing_entries
    meaning: The homeowner pays a deductible or fee.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: How it was paid.
      newhome_claim_id: The claim the payment is for.
      payer_role: homeowner.
    account: deductible_balance
    direction: out
    triggers: []
  - type: newhome_homeowner_credit
    target: newhome_billing_entries
    meaning: A homeowner charge is credited (mediation fee refunded after the homeowner prevails, or a charge waived or billed in error).
    grain: One row per credit reason on one claim.
    distinguish_by: [newhome_claim_id, credit_reason]
    fields:
      entry_date: The posting date.
      amount: The credit, positive.
      newhome_claim_id: The claim.
      credit_reason: Why.
    account: deductible_balance
    direction: out
    triggers: []
  - type: newhome_claim_filed
    target: newhome_claims
    meaning: The homeowner files a written claim for a defect.
    grain: One row per defect claimed.
    distinguish_by: [newhome_claim_id]
    fields:
      newhome_claim_id: The claim number.
      filed_date: The filing date.
      discovery_date: The date the homeowner says the defect was discovered.
      claim_category: workmanship, water_penetration, systems, structural or appliance.
      defect_description: The homeowner's description, verbatim.
      emergency_repair_performed: Whether the homeowner had emergency work done before filing.
    triggers: []
  - type: newhome_builder_tender
    target: newhome_claim_events
    meaning: A workmanship or builder-period systems claim is tendered to the builder.
    grain: One row per claim tendered.
    distinguish_by: [newhome_claim_id]
    fields:
      newhome_claim_id: The claim.
      event_date: The tender date.
      response_due_date: The date the builder must respond by.
    triggers: []
  - type: newhome_builder_response
    target: newhome_claim_events
    meaning: The builder accepts or disputes a tendered claim, or the response deadline passes.
    grain: One row per claim.
    distinguish_by: [newhome_claim_id]
    fields:
      newhome_claim_id: The claim.
      event_date: The response date (or the deadline when no response came).
      builder_response: accepted, disputed or no_response.
    triggers: []
  - type: newhome_mediation_request
    target: newhome_claim_events
    meaning: The homeowner asks for mediation of a builder dispute.
    grain: One row per claim mediated.
    distinguish_by: [newhome_claim_id]
    fields:
      newhome_claim_id: The claim.
      event_date: The request date.
    triggers:
      - event: newhome:newhome_homeowner_charge
        map: {newhome_claim_id: newhome_claim_id, charge_type: mediation_fee}
  - type: newhome_mediation_outcome
    target: newhome_claim_events
    meaning: The mediator issues an outcome.
    grain: One row per claim mediated.
    distinguish_by: [newhome_claim_id]
    fields:
      newhome_claim_id: The claim.
      event_date: The outcome date.
      mediation_outcome: homeowner_prevails, builder_prevails or settled.
    triggers:
      - event: newhome:newhome_homeowner_credit
        when: {mediation_outcome: homeowner_prevails}
        map: {newhome_claim_id: newhome_claim_id, credit_reason: mediation_fee_refund}
  - type: newhome_claim_determination
    target: newhome_claim_events
    meaning: Bridgewell decides whether the claim is a covered defect under the warranty's standards.
    grain: One row per claim.
    distinguish_by: [newhome_claim_id]
    fields:
      newhome_claim_id: The claim.
      event_date: The determination date.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered.
    triggers: []
  - type: newhome_benefit_authorization
    target: newhome_claim_events
    meaning: Bridgewell authorizes a payment on a claim (structural repair or cash settlement, engineer inspection, living expenses, systems extension or appliance repair, builder-default payment, emergency reimbursement).
    grain: One row per authorization number.
    distinguish_by: [authorization_number]
    fields:
      newhome_claim_id: The claim.
      event_date: The authorization date.
      authorization_number: The authorization number.
      resolution_type: What is paid.
      invoice_amount: The documented cost.
      amount: The amount Bridgewell pays.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: newhome_authorization_reversal
    target: newhome_claim_events
    meaning: An authorization is reversed because the work will not be performed or was authorized in error.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      newhome_claim_id: The claim.
      event_date: The reversal date.
      reversed_authorization_number: The authorization reversed.
      reversal_reason: Why.
      amount: The amount reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []

measures:
  - id: newhome_msr_structural_paid_life
    window: The whole warranty life.
    measure: Sum of newhome_benefit_authorization amounts with resolution_type structural_repair, structural_cash_settlement or living_expense, minus reversals of them.
  - id: newhome_msr_structural_deductibles_billed
    window: The whole warranty life.
    measure: Count of newhome_homeowner_charge rows with charge_type structural_deductible.
  - id: newhome_msr_systems_extension_paid
    window: The systems extension years (from the second anniversary of closing_date through systems_end_date).
    measure: Sum of newhome_benefit_authorization amounts with resolution_type systems_extension_repair, minus reversals.
  - id: newhome_msr_builder_default_paid
    window: The whole warranty life.
    measure: Sum of newhome_benefit_authorization amounts with resolution_type builder_default_payment, minus reversals.

policies:
  - id: newhome_agg_multi_holding
    subject: [newhome_enrollment]
    rule: >-
      A customer may own several warranted homes, each with its own warranty. Whether one home can carry more than one
      warranty is governed by newhome_agg_one_warranty_per_home.
    eligibility: []
    params:
      max_per_customer: null

  - id: newhome_agg_one_warranty_per_home
    subject: [newhome_enrollment]
    rule: >-
      A home is enrolled once, by its builder, at its first sale.
      A home is not enrolled when a warranty for the same property address is in status enrollment_pending, workmanship_period, systems_period or structural_period.
      A builder warranty does not exclude a homeowner service contract on the same home: during the builder's workmanship
      and systems periods, defects in construction are claimed under this warranty, while ordinary wear failures of
      appliances and systems are handled under any homeowner service contract the owner holds.
    eligibility:
      - id: one_open_warranty_per_home
        applies_to: [newhome_enrollment]
        kind: dedup
        condition: "A home is not enrolled when a warranty for the same property address is in status enrollment_pending, workmanship_period, systems_period or structural_period."
        evidence_fields: [newhome_warranties.property_address, newhome_warranties.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [newhome_warranties.property_address]
          action_bindings:
            newhome_warranties.property_address: property_address
        dedup_contract:
          table: newhome_warranties
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [enrollment_pending, workmanship_period, systems_period, structural_period]}
          distinct_fields: []

  - id: newhome_enrollment_and_builder_fee
    subject: [newhome_enrollment, newhome_builder_fee_charge, newhome_builder_fee_payment, newhome_fee_credit, newhome_enrollment_confirmation, newhome_void_unpaid]
    rule: >-
      Only a builder registered with Bridgewell enrolls homes, giving the builder_registration_number on file with the program.
      A home is enrolled only when the builder enrolls it no later than builder_enrollment_window_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included.
      The builder is billed the greater of builder_fee_minimum and builder_fee_rate_per_thousand for each 1,000 dollars
      of final_sale_price, rounded to the cent; the homeowner pays nothing for the warranty. The fee is due
      builder_fee_payment_days calendar days after enrollment_date. On payment the warranty is confirmed retroactively
      from closing_date. An enrollment whose fee is unpaid after that is voided, the fee is credited in full, and claims
      filed while it was pending are closed not covered; the homeowner is told to take the matter up with the builder.
      Phase end dates are set at enrollment: workmanship_end_date is the day before the workmanship_years anniversary of
      closing_date, systems_end_date the day before the systems_years anniversary and structural_end_date the day before
      the structural_years anniversary, a 29 February anniversary falling back to 28 February.
    eligibility:
      - id: builder_registered
        applies_to: [newhome_enrollment]
        kind: authorization
        condition: "Only a builder registered with Bridgewell enrolls homes, giving the builder_registration_number on file with the program."
        evidence_fields: [newhome_warranties.builder_registration_number, newhome_warranties.builder_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [newhome_warranties.builder_registration_number]
          action_bindings:
            newhome_warranties.builder_registration_number: builder_registration_number
      - id: enrolled_within_window
        applies_to: [newhome_enrollment]
        kind: time
        condition: "A home is enrolled only when the builder enrolls it no later than builder_enrollment_window_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included."
        evidence_fields: [newhome_warranties.closing_date, newhome_warranties.property_address]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [newhome_warranties.property_address]
          action_bindings:
            newhome_warranties.property_address: property_address
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale closes
          anchor_source: newhome_warranties.closing_date
          relation: not_after
          duration_source: variants.builder_enrollment_window_days
          unit: calendar_days
          counting_rule: counting from the day after closing_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Structural-Only Ten-Year Warranty: {builder_fee_rate_per_thousand: "=builder_fee_rate_per_thousand", builder_fee_minimum: "=builder_fee_minimum", builder_enrollment_window_days: "=builder_enrollment_window_days", builder_fee_payment_days: "=builder_fee_payment_days", workmanship_years: "=workmanship_years", systems_years: "=systems_years", structural_years: "=structural_years"}
        Bridgewell 1-2-10 Builder Warranty: {builder_fee_rate_per_thousand: "=builder_fee_rate_per_thousand", builder_fee_minimum: "=builder_fee_minimum", builder_enrollment_window_days: "=builder_enrollment_window_days", builder_fee_payment_days: "=builder_fee_payment_days", workmanship_years: "=workmanship_years", systems_years: "=systems_years", structural_years: "=structural_years"}
        Bridgewell 1-2-10 Builder Warranty with Appliances: {builder_fee_rate_per_thousand: "=builder_fee_rate_per_thousand", builder_fee_minimum: "=builder_fee_minimum", builder_enrollment_window_days: "=builder_enrollment_window_days", builder_fee_payment_days: "=builder_fee_payment_days", workmanship_years: "=workmanship_years", systems_years: "=systems_years", structural_years: "=structural_years"}
        Bridgewell 1-2-10 Attached Home Warranty: {builder_fee_rate_per_thousand: "=builder_fee_rate_per_thousand", builder_fee_minimum: "=builder_fee_minimum", builder_enrollment_window_days: "=builder_enrollment_window_days", builder_fee_payment_days: "=builder_fee_payment_days", workmanship_years: "=workmanship_years", systems_years: "=systems_years", structural_years: "=structural_years"}
        Bridgewell 1-2-10 Builder Warranty with Systems Extension: {builder_fee_rate_per_thousand: "=builder_fee_rate_per_thousand", builder_fee_minimum: "=builder_fee_minimum", builder_enrollment_window_days: "=builder_enrollment_window_days", builder_fee_payment_days: "=builder_fee_payment_days", workmanship_years: "=workmanship_years", systems_years: "=systems_years", structural_years: "=structural_years"}
        Bridgewell 2-4-10 Premier Builder Warranty: {builder_fee_rate_per_thousand: "=builder_fee_rate_per_thousand", builder_fee_minimum: "=builder_fee_minimum", builder_enrollment_window_days: "=builder_enrollment_window_days", builder_fee_payment_days: "=builder_fee_payment_days", workmanship_years: "=workmanship_years", systems_years: "=systems_years", structural_years: "=structural_years"}
    formula:
      builder_fee: "max(builder_fee_minimum, round(builder_fee_rate_per_thousand * final_sale_price / 1000, 2))"

  - id: newhome_coverage_phases
    subject: [newhome_systems_phase_start, newhome_structural_phase_start, newhome_expiration, newhome_owner_transfer]
    rule: >-
      Coverage runs in phases from closing_date: workmanship and water penetration defects through workmanship_end_date
      (water penetration for water_penetration_years), distribution systems through systems_end_date, appliances for
      appliance_coverage_years, and structural defects through structural_end_date. The warranty moves to systems_period
      the day after workmanship_end_date, to structural_period the day after systems_end_date and to expired the day
      after structural_end_date. When automatic_transfer_to_subsequent_owner is true, a resale passes the remaining
      coverage to the new owner without a fee or new enrollment; phase dates never restart.
      A warranty passes to a new owner only while it is in workmanship_period, systems_period or structural_period.
    eligibility:
      - id: transfer_while_in_force
        applies_to: [newhome_owner_transfer]
        kind: state
        condition: "A warranty passes to a new owner only while it is in workmanship_period, systems_period or structural_period."
        evidence_fields: [newhome_warranties.status, newhome_warranties.newhome_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [newhome_warranties.newhome_warranty_id]
          action_bindings:
            newhome_warranties.newhome_warranty_id: newhome_warranty_id
        state_contract:
          field: newhome_warranties.status
          allowed: [workmanship_period, systems_period, structural_period]
    params:
      per_tier:
        Bridgewell Structural-Only Ten-Year Warranty: {water_penetration_years: "=water_penetration_years", appliance_coverage_years: "=appliance_coverage_years", automatic_transfer_to_subsequent_owner: "=automatic_transfer_to_subsequent_owner"}
        Bridgewell 1-2-10 Builder Warranty: {water_penetration_years: "=water_penetration_years", appliance_coverage_years: "=appliance_coverage_years", automatic_transfer_to_subsequent_owner: "=automatic_transfer_to_subsequent_owner"}
        Bridgewell 1-2-10 Builder Warranty with Appliances: {water_penetration_years: "=water_penetration_years", appliance_coverage_years: "=appliance_coverage_years", automatic_transfer_to_subsequent_owner: "=automatic_transfer_to_subsequent_owner"}
        Bridgewell 1-2-10 Attached Home Warranty: {water_penetration_years: "=water_penetration_years", appliance_coverage_years: "=appliance_coverage_years", automatic_transfer_to_subsequent_owner: "=automatic_transfer_to_subsequent_owner"}
        Bridgewell 1-2-10 Builder Warranty with Systems Extension: {water_penetration_years: "=water_penetration_years", appliance_coverage_years: "=appliance_coverage_years", automatic_transfer_to_subsequent_owner: "=automatic_transfer_to_subsequent_owner"}
        Bridgewell 2-4-10 Premier Builder Warranty: {water_penetration_years: "=water_penetration_years", appliance_coverage_years: "=appliance_coverage_years", automatic_transfer_to_subsequent_owner: "=automatic_transfer_to_subsequent_owner"}

  - id: newhome_claim_filing
    subject: [newhome_claim_filed]
    rule: >-
      Claims are filed in writing by the current owner.
      A claim is accepted only when it is filed no later than claim_notice_days_after_discovery calendar days after the defect is discovered, counting from the day after the discovery_date the homeowner states with the boundary day included.
      The defect must have been discovered within the coverage phase for its claim_category; a defect discovered during
      a phase may still be filed up to claim_grace_after_period_end_days calendar days after that phase ends. Cosmetic
      surface defects (paint, finishes, scratches, chips) are covered only when reported within cosmetic_reporting_days
      calendar days after closing_date. When the homeowner had emergency work done to stop further damage, the claim
      says so and the cost is reimbursed under newhome_payments_and_settlements.
    eligibility:
      - id: filed_within_notice_window
        applies_to: [newhome_claim_filed]
        kind: time
        condition: "A claim is accepted only when it is filed no later than claim_notice_days_after_discovery calendar days after the defect is discovered, counting from the day after the discovery_date the homeowner states with the boundary day included."
        evidence_fields: [newhome_claims.discovery_date, newhome_claims.newhome_warranty_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [newhome_claims.newhome_warranty_id]
          action_bindings:
            newhome_claims.newhome_warranty_id: newhome_warranty_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the defect is discovered
          anchor_source: newhome_claims.discovery_date
          relation: not_after
          duration_source: variants.claim_notice_days_after_discovery
          unit: calendar_days
          counting_rule: counting from the day after the discovery_date the homeowner states with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Structural-Only Ten-Year Warranty: {claim_notice_days_after_discovery: "=claim_notice_days_after_discovery", claim_grace_after_period_end_days: "=claim_grace_after_period_end_days", cosmetic_reporting_days: "=cosmetic_reporting_days"}
        Bridgewell 1-2-10 Builder Warranty: {claim_notice_days_after_discovery: "=claim_notice_days_after_discovery", claim_grace_after_period_end_days: "=claim_grace_after_period_end_days", cosmetic_reporting_days: "=cosmetic_reporting_days"}
        Bridgewell 1-2-10 Builder Warranty with Appliances: {claim_notice_days_after_discovery: "=claim_notice_days_after_discovery", claim_grace_after_period_end_days: "=claim_grace_after_period_end_days", cosmetic_reporting_days: "=cosmetic_reporting_days"}
        Bridgewell 1-2-10 Attached Home Warranty: {claim_notice_days_after_discovery: "=claim_notice_days_after_discovery", claim_grace_after_period_end_days: "=claim_grace_after_period_end_days", cosmetic_reporting_days: "=cosmetic_reporting_days"}
        Bridgewell 1-2-10 Builder Warranty with Systems Extension: {claim_notice_days_after_discovery: "=claim_notice_days_after_discovery", claim_grace_after_period_end_days: "=claim_grace_after_period_end_days", cosmetic_reporting_days: "=cosmetic_reporting_days"}
        Bridgewell 2-4-10 Premier Builder Warranty: {claim_notice_days_after_discovery: "=claim_notice_days_after_discovery", claim_grace_after_period_end_days: "=claim_grace_after_period_end_days", cosmetic_reporting_days: "=cosmetic_reporting_days"}

  - id: newhome_builder_tender_and_mediation
    subject: [newhome_builder_tender, newhome_builder_response, newhome_mediation_request, newhome_mediation_outcome, newhome_homeowner_charge, newhome_homeowner_payment, newhome_homeowner_credit]
    rule: >-
      When builder_tender_required_first is true, workmanship, water penetration and builder-period systems claims are
      tendered to the builder, who must respond within builder_response_days calendar days of the tender and complete an
      accepted repair within builder_repair_completion_days calendar days.
      Mediation is requested only when mediation_available is true and the request is made no later than mediation_request_days calendar days after the builder responds, counting from the day after the builder's response or missed deadline with the boundary day included.
      Mediation is open when the builder disputes the claim or does not respond. The homeowner pays mediation_fee, which is
      refunded when the mediator finds for the homeowner and mediation_fee_refunded_if_homeowner_prevails is true. When
      the builder does not perform an accepted repair or a mediated outcome in favor of the homeowner by its deadline,
      and builder_default_backstop is true, Bridgewell pays the reasonable cost of the repair up to builder_default_limit
      over the warranty's life (newhome_msr_builder_default_paid). Each homeowner charge is billed once per claim and charge type.
      Homeowner payments are applied to the open charges of the claim they name.
    eligibility:
      - id: mediation_within_window
        applies_to: [newhome_mediation_request]
        kind: time
        condition: "Mediation is requested only when mediation_available is true and the request is made no later than mediation_request_days calendar days after the builder responds, counting from the day after the builder's response or missed deadline with the boundary day included."
        evidence_fields: [newhome_claim_events.event_date, newhome_claim_events.builder_response, newhome_claim_events.newhome_claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [newhome_claim_events.newhome_claim_id]
          action_bindings:
            newhome_claim_events.newhome_claim_id: newhome_claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the builder responds
          anchor_source: newhome_claim_events.event_date
          relation: not_after
          duration_source: variants.mediation_request_days
          unit: calendar_days
          counting_rule: counting from the day after the builder's response or missed deadline with the boundary day included
          boundary: inclusive
      - id: one_charge_per_claim_type
        applies_to: [newhome_homeowner_charge]
        kind: dedup
        condition: "Each homeowner charge is billed once per claim and charge type."
        evidence_fields: [newhome_billing_entries.newhome_claim_id, newhome_billing_entries.charge_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [newhome_billing_entries.newhome_claim_id, newhome_billing_entries.charge_type]
          action_bindings:
            newhome_billing_entries.newhome_claim_id: newhome_claim_id
            newhome_billing_entries.charge_type: charge_type
        dedup_contract:
          table: newhome_billing_entries
          mode: separate_record
          object_bindings: {newhome_claim_id: newhome_claim_id, charge_type: charge_type}
          duplicate_filters: {event_type: [newhome_homeowner_charge]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Structural-Only Ten-Year Warranty: {builder_tender_required_first: "=builder_tender_required_first", builder_response_days: "=builder_response_days", builder_repair_completion_days: "=builder_repair_completion_days", mediation_available: "=mediation_available", mediation_fee: "=mediation_fee", mediation_fee_refunded_if_homeowner_prevails: "=mediation_fee_refunded_if_homeowner_prevails", mediation_request_days: "=mediation_request_days", builder_default_backstop: "=builder_default_backstop", builder_default_limit: "=builder_default_limit"}
        Bridgewell 1-2-10 Builder Warranty: {builder_tender_required_first: "=builder_tender_required_first", builder_response_days: "=builder_response_days", builder_repair_completion_days: "=builder_repair_completion_days", mediation_available: "=mediation_available", mediation_fee: "=mediation_fee", mediation_fee_refunded_if_homeowner_prevails: "=mediation_fee_refunded_if_homeowner_prevails", mediation_request_days: "=mediation_request_days", builder_default_backstop: "=builder_default_backstop", builder_default_limit: "=builder_default_limit"}
        Bridgewell 1-2-10 Builder Warranty with Appliances: {builder_tender_required_first: "=builder_tender_required_first", builder_response_days: "=builder_response_days", builder_repair_completion_days: "=builder_repair_completion_days", mediation_available: "=mediation_available", mediation_fee: "=mediation_fee", mediation_fee_refunded_if_homeowner_prevails: "=mediation_fee_refunded_if_homeowner_prevails", mediation_request_days: "=mediation_request_days", builder_default_backstop: "=builder_default_backstop", builder_default_limit: "=builder_default_limit"}
        Bridgewell 1-2-10 Attached Home Warranty: {builder_tender_required_first: "=builder_tender_required_first", builder_response_days: "=builder_response_days", builder_repair_completion_days: "=builder_repair_completion_days", mediation_available: "=mediation_available", mediation_fee: "=mediation_fee", mediation_fee_refunded_if_homeowner_prevails: "=mediation_fee_refunded_if_homeowner_prevails", mediation_request_days: "=mediation_request_days", builder_default_backstop: "=builder_default_backstop", builder_default_limit: "=builder_default_limit"}
        Bridgewell 1-2-10 Builder Warranty with Systems Extension: {builder_tender_required_first: "=builder_tender_required_first", builder_response_days: "=builder_response_days", builder_repair_completion_days: "=builder_repair_completion_days", mediation_available: "=mediation_available", mediation_fee: "=mediation_fee", mediation_fee_refunded_if_homeowner_prevails: "=mediation_fee_refunded_if_homeowner_prevails", mediation_request_days: "=mediation_request_days", builder_default_backstop: "=builder_default_backstop", builder_default_limit: "=builder_default_limit"}
