events:
  - type: realty_order
    target: realty_contracts
    mutation: create
    meaning: A real estate agent (or a buyer or seller directly) orders a real estate plan for a property being sold, either with seller listing coverage or as a buyer-only order.
    grain: One row per plan ordered for one property transaction.
    fields:
      customer_id: The covered homeowner at order time (the seller on a listing order, the buyer on a buyer-only order).
      variant_name: The plan ordered.
      order_type: listing_with_seller_coverage or buyer_only.
      ordering_agent_license_number: The license number of the ordering real estate agent; empty when a homeowner orders directly.
      ordering_agent_side: Whether the ordering agent represents the seller (listing_agent) or the buyer (buyer_agent); none when a homeowner orders directly.
      property_address: The property address as stated on the order.
      property_zip: The property ZIP code.
      property_type: The dwelling type.
      unit_count: Number of dwelling units (1 to 4).
      square_footage: Living-area square footage.
      home_inspection_completed: Whether a home inspection was completed before closing, per the order.
      certificate_of_occupancy_date: For a new construction plan, the certificate of occupancy date; empty otherwise.
      order_date: The order date.
      listing_coverage_end_date: For a listing order, the last day of seller coverage; empty for a buyer-only order.
      listing_extension_count: 0 at order.
      expected_closing_date: The expected closing date stated on the order, if known.
    triggers:
      - event: realty:realty_invoice
        map: {}
  - type: realty_listing_extension
    target: realty_contracts
    mutation: update
    meaning: Seller listing coverage is extended because the home is still listed.
    grain: One row per transaction.
    fields:
      listing_coverage_end_date: The extended last day of seller coverage.
      listing_extension_count: Incremented by one.
    triggers: []
  - type: realty_closing_date_change
    target: realty_contracts
    mutation: update
    meaning: The ordering agent reports a new expected closing date.
    grain: One row per transaction.
    fields:
      expected_closing_date: The new expected closing date.
    triggers: []
  - type: realty_closing_recorded
    target: realty_contracts
    mutation: {transition: [{from: listing_coverage, to: closed_pending_payment}, {from: awaiting_closing, to: closed_pending_payment}]}
    meaning: The sale closes; buyer coverage dates are set and the buyer becomes the contract holder.
    grain: One row per transaction.
    fields:
      status: Becomes closed_pending_payment.
      customer_id: The buyer, who now holds the contract.
      closing_date: The actual closing date.
      escrow_file_number: The escrow or title file number for the closing, verbatim from the agent or escrow officer.
      coverage_start_date: Equal to the closing date.
      term_end_date: The last day of the buyer term.
    triggers: []
  - type: realty_coverage_activation
    target: realty_contracts
    mutation: {transition: {from: closed_pending_payment, to: active}}
    meaning: The plan invoice is paid within the escrow payment window and buyer coverage is confirmed.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers: []
  - type: realty_void_unpaid
    target: realty_contracts
    mutation: {transition: {from: closed_pending_payment, to: voided}}
    meaning: The plan invoice was not paid within the escrow payment window and the plan is voided.
    grain: One row per transaction.
    fields:
      status: Becomes voided.
      end_date: The date the plan was voided.
    triggers:
      - event: realty:realty_credit_memo
        map: {credit_reason: invoice_voided}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: realty_listing_expiration
    target: realty_contracts
    mutation: {transition: {from: listing_coverage, to: listing_expired}}
    meaning: The seller listing period ends without a closing.
    grain: One row per transaction.
    fields:
      status: Becomes listing_expired.
      end_date: The listing_coverage_end_date that passed.
    triggers:
      - event: realty:realty_credit_memo
        map: {credit_reason: listing_expired_unclosed}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: realty_order_cancellation
    target: realty_contracts
    mutation: {transition: [{from: listing_coverage, to: cancelled}, {from: awaiting_closing, to: cancelled}]}
    meaning: The order is cancelled before closing because the listing was withdrawn, the sale fell through, or a buyer-only order lapsed.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation date.
    triggers:
      - event: realty:realty_credit_memo
        map: {credit_reason: order_cancelled}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: realty_buyer_cancellation
    target: realty_contracts
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The buyer cancels buyer coverage during the term.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The date the buyer gave notice, which is the cancellation effective date.
    triggers:
      - event: realty:realty_credit_memo
        map: {credit_reason: buyer_cancellation_refund_credit}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: realty_term_expiration
    target: realty_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: The buyer term ends.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The term_end_date.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: realty_conversion
    target: realty_contracts
    mutation: {transition: [{from: active, to: converted}, {from: expired, to: converted}]}
    meaning: The buyer accepts the direct renewal offer and continues under a homeowner service contract.
    grain: One row per transaction.
    fields:
      status: Becomes converted.
      end_date: The conversion date.
    triggers:
      - event: homeplan:homeplan_enrollment
        map: {customer_id: customer_id, realty_contract_id: realty_contract_id, enrollment_channel: realty_conversion}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: realty_invoice
    target: realty_billing_entries
    meaning: The plan premium is invoiced for payment through escrow at closing.
    grain: One row per invoice number.
    distinguish_by: [invoice_number]
    fields:
      entry_date: The invoice date.
      amount: The plan premium invoiced, positive.
      invoice_number: The invoice number.
      due_date: The date payment is due (the closing date plus the escrow payment window once closing is recorded; the expected closing date before then).
    account: invoice_balance
    direction: in
    triggers: []
  - type: realty_seller_service_charge
    target: realty_billing_entries
    meaning: The seller is billed for listing-period service because the sale did not close.
    grain: One row per failed-sale charge invoice.
    distinguish_by: [invoice_number]
    fields:
      entry_date: The billing date.
      amount: The failed-sale charge, positive.
      invoice_number: The failed-sale invoice number.
      due_date: The payment due date.
    account: invoice_balance
    direction: in
    triggers: []
  - type: realty_payment
    target: realty_billing_entries
    meaning: A payment is received against a realty invoice.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      invoice_number: The invoice paid.
      payer_role: Who paid (escrow, buyer or seller).
      payment_method: How it was paid.
    account: invoice_balance
    direction: out
    triggers: []
  - type: realty_credit_memo
    target: realty_billing_entries
    meaning: An invoice is credited, in full when an order is cancelled, expires unclosed or is voided, or by the refundable amount when a buyer cancels.
    grain: One row per credit on one invoice for one reason.
    distinguish_by: [invoice_number, credit_reason]
    fields:
      entry_date: The posting date.
      amount: The credit amount, positive.
      invoice_number: The invoice credited.
      credit_reason: Why it is credited.
    account: invoice_balance
    direction: out
    triggers: []
  - type: realty_refund
    target: realty_billing_entries
    meaning: A credit balance is refunded to the party that paid.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund amount, positive.
      refund_reference: The refund confirmation number.
      invoice_number: The invoice whose credit is refunded.
      payer_role: Who receives the refund.
      payment_method: How it is refunded.
    account: invoice_balance
    direction: in
    triggers: []
  - type: realty_service_fee_charge
    target: realty_billing_entries
    meaning: A service call fee is collected on a service request.
    grain: One row per service request charged.
    distinguish_by: [realty_service_request_id]
    fields:
      entry_date: The collection date.
      amount: The fee collected, positive.
      realty_service_request_id: The service request.
    account: service_fee_balance
    direction: in
    triggers: []
  - type: realty_service_fee_refund
    target: realty_billing_entries
    meaning: A service call fee is refunded.
    grain: One row per service request refunded.
    distinguish_by: [realty_service_request_id]
    fields:
      entry_date: The refund date.
      amount: The amount refunded, positive.
      realty_service_request_id: The service request.
    account: service_fee_balance
    direction: out
    triggers: []
  - type: realty_service_request
    target: realty_service_requests
    meaning: The covered party (seller during listing, buyer after closing) reports a failure or asks for the rekey benefit.
    grain: One row per item failure or rekey request.
    distinguish_by: [realty_service_request_id]
    fields:
      realty_service_request_id: The service request number.
      request_date: The date the request was placed.
      coverage_phase: Whether the request falls under seller listing coverage or buyer coverage.
      covered_item: The item that failed, or locks for a rekey.
      trade: The trade that services the item.
      request_type: new_failure, recall or rekey.
      urgency: Emergency or routine.
      failure_description: The caller's description, verbatim.
    triggers:
      - event: realty:realty_service_fee_charge
        when: {request_type: new_failure}
        map: {realty_service_request_id: realty_service_request_id}
  - type: realty_contractor_dispatch
    target: realty_claim_events
    meaning: A network contractor is assigned to a service request.
    grain: One row per assignment on one service request.
    distinguish_by: [realty_service_request_id, dispatch_sequence]
    fields:
      realty_service_request_id: The service request.
      event_date: The assignment date.
      service_contractor_id: The contractor assigned.
      dispatch_sequence: 1 for the first assignment, incremented per further assignment.
      dispatch_reason: Initial, re-dispatch after a missed contact window, or recall.
    triggers: []
  - type: realty_coverage_determination
    target: realty_claim_events
    meaning: Bridgewell decides whether the reported failure is covered.
    grain: One row per service request.
    distinguish_by: [realty_service_request_id]
    fields:
      realty_service_request_id: The service request.
      event_date: The determination date.
      covered_item: The item.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered.
    triggers: []
  - type: realty_benefit_authorization
    target: realty_claim_events
    meaning: Bridgewell authorizes a repair, a replacement, a cash-in-lieu settlement, the rekey benefit or a supplemental allowance on a covered request.
    grain: One row per authorization number.
    distinguish_by: [authorization_number]
    fields:
      realty_service_request_id: The service request.
      event_date: The authorization date.
      covered_item: The item.
      authorization_number: The authorization number issued.
      resolution_type: repair, replacement, cash_in_lieu, rekey or allowance.
      allowance_type: For an allowance, which one (code_violation, permit, haul_away, refrigerant); empty otherwise.
      invoice_amount: For an allowance, the documented cost it pays toward; empty otherwise.
      repair_estimate: The contractor's repair estimate.
      replacement_cost: Bridgewell's contracted replacement cost.
      amount: The amount Bridgewell pays.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: realty_authorization_reversal
    target: realty_claim_events
    meaning: An authorization is reversed because the work will not be performed.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      realty_service_request_id: The service request.
      event_date: The reversal date.
      reversed_authorization_number: The authorization reversed.
      reversal_reason: Why.
      amount: The amount reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []

measures:
  - id: realty_msr_seller_phase_benefit_paid
    window: The whole seller listing coverage period of the order (order_date through the closing, expiration or cancellation).
    measure: Sum of amount on realty_benefit_authorization rows whose service request has coverage_phase seller_listing, minus amount on realty_authorization_reversal rows for those authorizations.
  - id: realty_msr_seller_item_benefit_paid
    window: The whole seller listing coverage period of the order.
    measure: The same sum as realty_msr_seller_phase_benefit_paid restricted to rows for the same covered_item.
  - id: realty_msr_contract_year_benefit_paid
    window: The buyer contract year in which the service request's request_date falls; contract years are consecutive 12-month periods starting on coverage_start_date.
    measure: Sum of amount on realty_benefit_authorization rows whose service request has coverage_phase buyer and falls in the window, minus amount on realty_authorization_reversal rows for those authorizations.
  - id: realty_msr_item_benefit_paid_year
    window: The buyer contract year in which the service request's request_date falls.
    measure: The same sum as realty_msr_contract_year_benefit_paid restricted to rows for the same covered_item and excluding allowance rows.
  - id: realty_msr_refrigerant_paid_year
    window: The buyer contract year in which the service request's request_date falls.
    measure: Sum of amount on realty_benefit_authorization rows with resolution_type allowance and allowance_type refrigerant in the window, net of reversals.
  - id: realty_msr_plan_premium_invoiced
    window: The life of the order.
    measure: Sum of amount on realty_invoice rows on the contract.
  - id: realty_msr_plan_premium_paid
    window: The life of the order.
    measure: Sum of amount on realty_payment rows applied to the contract's realty_invoice invoice numbers.
  - id: realty_msr_days_since_closing
    window: From closing_date to the buyer's cancellation notice date.
    measure: Count of calendar days from the day after closing_date through the notice date inclusive.
  - id: realty_msr_unexpired_term_days
    window: The buyer term as of the cancellation notice date.
    measure: Count of calendar days from the day after the notice date through term_end_date inclusive.
  - id: realty_msr_term_days
    window: The buyer term.
    measure: Count of calendar days from coverage_start_date through term_end_date inclusive.

policies:
  - id: realty_agg_multi_holding
    subject: [realty_order]
    rule: >-
      There is no limit on how many real estate contracts one customer may be associated with: a homeowner may be
      the seller on one transaction and the buyer on another, and an agent may order plans for any number of
      clients. How many open orders one property may carry is governed by realty_agg_one_open_order_per_property.
    eligibility: []
    params:
      max_per_customer: null

  - id: realty_agg_one_open_order_per_property
    subject: [realty_order]
    rule: >-
      One property transaction carries one real estate plan.
      A new real estate order is not placed when a real estate contract for the same property address is in status listing_coverage, awaiting_closing or closed_pending_payment.
      On a listed property whose listing order carries seller coverage, the buyer's coverage is provided by that
      same order at closing; the buyer's agent may change the plan on that order before closing instead of placing
      a second order. A buyer-only order may be placed on a property whose earlier real estate contract is active,
      expired, converted, cancelled, voided or listing_expired. Seller listing coverage duplicates the seller's own
      homeowner service contract: a listing order with seller coverage is not placed for a seller who holds a
      homeowner service contract in status active for the same address, and such a seller is offered a
      buyer-only order instead.
    eligibility:
      - id: no_open_order_on_property
        applies_to: [realty_order]
        kind: dedup
        condition: "A new real estate order is not placed when a real estate contract for the same property address is in status listing_coverage, awaiting_closing or closed_pending_payment."
        evidence_fields: [realty_contracts.property_address, realty_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.property_address]
          action_bindings:
            realty_contracts.property_address: property_address
        dedup_contract:
          table: realty_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [listing_coverage, awaiting_closing, closed_pending_payment]}
          distinct_fields: []

  - id: realty_order_requirements
    subject: [realty_order]
    rule: >-
      A real estate plan is ordered by a licensed real estate agent for a client, or directly by the buyer or the
      seller of the property.
      An order placed by an agent is accepted only when ordering_agent_license_number matches the real estate license number on a real estate agent profile on file.
      The property type, unit count and square footage on the order are taken from the ordering party's statement and must satisfy the entry gate of the plan ordered.
      A listing_with_seller_coverage order is placed only by or for the seller, only on a plan whose
      seller_coverage_available is true, and only while the home is listed for sale; its customer is the seller and
      it starts in listing_coverage on order_date with listing_coverage_end_date equal to order_date plus
      seller_coverage_max_days calendar days. A buyer_only order is placed for the buyer once a purchase contract is
      signed; its customer is the buyer and it starts in awaiting_closing with no coverage until closing. The New
      Construction Three-Year plan is ordered only buyer_only, for a single-unit home whose certificate of occupancy
      is dated no more than the entry gate's day limit before the expected closing. Agents receive no compensation
      of any kind for ordering a plan. The plan ordered may be changed to another plan at any time before closing,
      and the invoice is then reissued at the new plan's premium.
    eligibility:
      - id: ordering_agent_license_on_file
        applies_to: [realty_order]
        kind: authorization
        condition: "An order placed by an agent is accepted only when ordering_agent_license_number matches the real estate license number on a real estate agent profile on file."
        evidence_fields: [customers.real_estate_license_number, customers.customer_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.real_estate_license_number]
          action_bindings:
            customers.real_estate_license_number: ordering_agent_license_number
      - id: property_within_entry_gate
        applies_to: [realty_order]
        kind: caller_fact
        condition: "The property type, unit count and square footage on the order are taken from the ordering party's statement and must satisfy the entry gate of the plan ordered."
        evidence_fields: [realty_contracts.property_address, realty_contracts.property_type, realty_contracts.unit_count, realty_contracts.square_footage]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [realty_contracts.property_address]
          action_bindings:
            realty_contracts.property_address: property_address
    params:
      per_tier:
        Bridgewell Closing Starter: {seller_coverage_available: "=seller_coverage_available", seller_coverage_max_days: "=seller_coverage_max_days"}
        Bridgewell Closing Standard: {seller_coverage_available: "=seller_coverage_available", seller_coverage_max_days: "=seller_coverage_max_days"}
        Bridgewell Closing Plus: {seller_coverage_available: "=seller_coverage_available", seller_coverage_max_days: "=seller_coverage_max_days"}
        Bridgewell Closing Premier: {seller_coverage_available: "=seller_coverage_available", seller_coverage_max_days: "=seller_coverage_max_days"}
        Bridgewell Closing Premier Two-Year: {seller_coverage_available: "=seller_coverage_available", seller_coverage_max_days: "=seller_coverage_max_days"}
        Bridgewell New Construction Three-Year: {seller_coverage_available: "=seller_coverage_available", seller_coverage_max_days: "=seller_coverage_max_days"}

  - id: realty_premium_pricing
    subject: [realty_invoice, realty_order]
    rule: >-
      The plan premium covers the whole buyer term and is invoiced once per order, payable through escrow at
      closing. It equals base_premium, plus oversize_premium_surcharge when square_footage is at or above
      oversize_threshold_sqft, plus additional_unit_premium for each dwelling unit beyond the first, minus
      condo_premium_discount when property_type is condominium or townhome. Seller listing coverage carries no
      separate premium. When the plan is changed before closing, the earlier invoice is credited in full and a new
      invoice is issued at the new plan's premium. The invoice is due on the closing date.
      The plan premium is invoiced only on an order in status listing_coverage or awaiting_closing.
    eligibility:
      - id: invoice_before_closing_only
        applies_to: [realty_invoice]
        kind: state
        condition: "The plan premium is invoiced only on an order in status listing_coverage or awaiting_closing."
        evidence_fields: [realty_contracts.status, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        state_contract:
          field: realty_contracts.status
          allowed: [listing_coverage, awaiting_closing]
    params:
      per_tier:
        Bridgewell Closing Starter: {base_premium: "=base_premium", additional_unit_premium: "=additional_unit_premium"}
        Bridgewell Closing Standard: {base_premium: "=base_premium", additional_unit_premium: "=additional_unit_premium"}
        Bridgewell Closing Plus: {base_premium: "=base_premium", additional_unit_premium: "=additional_unit_premium"}
        Bridgewell Closing Premier: {base_premium: "=base_premium", additional_unit_premium: "=additional_unit_premium"}
        Bridgewell Closing Premier Two-Year: {base_premium: "=base_premium", additional_unit_premium: "=additional_unit_premium"}
        Bridgewell New Construction Three-Year: {base_premium: "=base_premium", additional_unit_premium: "=additional_unit_premium"}
    formula:
      plan_premium: "base_premium + (oversize_premium_surcharge if square_footage >= oversize_threshold_sqft else 0) + additional_unit_premium * (unit_count - 1) - (condo_premium_discount if property_type in ['condominium', 'townhome'] else 0)"

  - id: realty_seller_listing_coverage
    subject: [realty_listing_extension, realty_listing_expiration]
    rule: >-
      Seller listing coverage runs from order_date through listing_coverage_end_date and ends earlier when the sale
      closes or the order is cancelled. It covers the seller for failures of items the plan covers, limited to
      seller_item_cap per item and seller_aggregate_cap in total, with heating, cooling and ductwork covered only
      when seller_hvac_covered is true; roof leaks and the rekey benefit are never part of seller coverage.
      A listing extension is granted only while the order is in status listing_coverage.
      A listing extension is granted only when it is requested no later than seller_coverage_max_days calendar days after the order is placed, counting from the day after order_date with the boundary day included.
      A listing extension is granted only while listing_extension_count is below max_seller_extensions.
      An extension adds seller_extension_days calendar days to listing_coverage_end_date. When
      listing_coverage_end_date passes without a closing, the order moves to listing_expired on the following day,
      the plan invoice is credited in full, and any listing-period service is billed under
      realty_failed_sale_charges. A seller whose listing expired may have the agent place a new order.
    eligibility:
      - id: extension_only_during_listing
        applies_to: [realty_listing_extension]
        kind: state
        condition: "A listing extension is granted only while the order is in status listing_coverage."
        evidence_fields: [realty_contracts.status, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        state_contract:
          field: realty_contracts.status
          allowed: [listing_coverage]
      - id: extension_requested_before_original_end
        applies_to: [realty_listing_extension]
        kind: time
        condition: "A listing extension is granted only when it is requested no later than seller_coverage_max_days calendar days after the order is placed, counting from the day after order_date with the boundary day included."
        evidence_fields: [realty_contracts.order_date, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the order is placed
          anchor_source: realty_contracts.order_date
          relation: not_after
          duration_source: variants.seller_coverage_max_days
          unit: calendar_days
          counting_rule: counting from the day after order_date with the boundary day included
          boundary: inclusive
      - id: extension_count_below_limit
        applies_to: [realty_listing_extension]
        kind: authorization
        condition: "A listing extension is granted only while listing_extension_count is below max_seller_extensions."
        evidence_fields: [realty_contracts.listing_extension_count, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
    params:
      per_tier:
        Bridgewell Closing Starter: {seller_item_cap: "=seller_item_cap", seller_aggregate_cap: "=seller_aggregate_cap", seller_hvac_covered: "=seller_hvac_covered"}
        Bridgewell Closing Standard: {seller_item_cap: "=seller_item_cap", seller_aggregate_cap: "=seller_aggregate_cap", seller_hvac_covered: "=seller_hvac_covered"}
        Bridgewell Closing Plus: {seller_item_cap: "=seller_item_cap", seller_aggregate_cap: "=seller_aggregate_cap", seller_hvac_covered: "=seller_hvac_covered"}
        Bridgewell Closing Premier: {seller_item_cap: "=seller_item_cap", seller_aggregate_cap: "=seller_aggregate_cap", seller_hvac_covered: "=seller_hvac_covered"}
        Bridgewell Closing Premier Two-Year: {seller_item_cap: "=seller_item_cap", seller_aggregate_cap: "=seller_aggregate_cap", seller_hvac_covered: "=seller_hvac_covered"}
        Bridgewell New Construction Three-Year: {seller_item_cap: "=seller_item_cap", seller_aggregate_cap: "=seller_aggregate_cap", seller_hvac_covered: "=seller_hvac_covered"}

  - id: realty_closing_and_escrow
    subject: [realty_closing_recorded, realty_closing_date_change, realty_coverage_activation, realty_void_unpaid, realty_payment, realty_order_cancellation]
    rule: >-
      The ordering agent or the escrow officer reports the closing with the actual closing_date and the
      escrow_file_number; the buyer, whose customer profile must be on file, becomes the contract holder, and
      coverage_start_date equals closing_date. term_end_date is the day before the same calendar day
      buyer_term_months later, falling back to the last day of the month when that day does not exist. Seller
      listing coverage ends at closing; requests the seller placed before closing are finished under seller
      coverage. The expected closing date may be changed only before closing. Payments are applied to the oldest
      open invoice first.
      Buyer coverage is confirmed only when the plan invoice is paid in full no later than escrow_payment_window_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included.
      Once confirmed, buyer coverage applies to failures reported from closing_date onward. While the contract is
      closed_pending_payment the buyer's service requests are recorded but no contractor is dispatched.
      A plan whose invoice is still unpaid is voided once more than escrow_payment_window_days calendar days have passed after the sale closes, counted from the day after closing_date.
      A voided plan's invoice is credited in full, requests recorded while it was pending are closed not covered,
      and a payment arriving after the void is refunded to the payer. A buyer-only order still in awaiting_closing
      more than pending_order_expiry_days calendar days after its expected closing date lapses and is cancelled by
      the agent; the agent may also cancel a listing or buyer-only order at any time before closing when the sale
      will not proceed.
    eligibility:
      - id: invoice_paid_within_window
        applies_to: [realty_coverage_activation]
        kind: time
        condition: "Buyer coverage is confirmed only when the plan invoice is paid in full no later than escrow_payment_window_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included."
        evidence_fields: [realty_contracts.closing_date, realty_contracts.invoice_balance, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale closes
          anchor_source: realty_contracts.closing_date
          relation: not_after
          duration_source: variants.escrow_payment_window_days
          unit: calendar_days
          counting_rule: counting from the day after closing_date with the boundary day included
          boundary: inclusive
      - id: void_only_after_window
        applies_to: [realty_void_unpaid]
        kind: time
        condition: "A plan whose invoice is still unpaid is voided once more than escrow_payment_window_days calendar days have passed after the sale closes, counted from the day after closing_date."
        evidence_fields: [realty_contracts.closing_date, realty_contracts.invoice_balance, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale closes
          anchor_source: realty_contracts.closing_date
          relation: not_before
          duration_source: variants.escrow_payment_window_days
          unit: calendar_days
          counting_rule: counted from the day after closing_date
          boundary: exclusive
    params:
      per_tier:
        Bridgewell Closing Starter: {buyer_term_months: "=buyer_term_months", escrow_payment_window_days: "=escrow_payment_window_days"}
        Bridgewell Closing Standard: {buyer_term_months: "=buyer_term_months", escrow_payment_window_days: "=escrow_payment_window_days"}
        Bridgewell Closing Plus: {buyer_term_months: "=buyer_term_months", escrow_payment_window_days: "=escrow_payment_window_days"}
        Bridgewell Closing Premier: {buyer_term_months: "=buyer_term_months", escrow_payment_window_days: "=escrow_payment_window_days"}
        Bridgewell Closing Premier Two-Year: {buyer_term_months: "=buyer_term_months", escrow_payment_window_days: "=escrow_payment_window_days"}
        Bridgewell New Construction Three-Year: {buyer_term_months: "=buyer_term_months", escrow_payment_window_days: "=escrow_payment_window_days"}
    measures: [realty_msr_plan_premium_paid]

  - id: realty_failed_sale_charges
    subject: [realty_seller_service_charge]
    rule: >-
      When a listing order ends without a closing, the seller pays for the listing-period service Bridgewell
      provided. A failed-sale charge is billed only on an order in status listing_expired or cancelled that never recorded a closing.
      The charge is the lesser of the plan premium invoiced on the order (realty_msr_plan_premium_invoiced) and the
      seller-phase benefit Bridgewell paid (realty_msr_seller_phase_benefit_paid); no charge is billed when that
      benefit is zero, and seller service call fees already collected never reduce it. The charge is billed to the
      seller and due failed_sale_bill_due_days calendar days after billing. Only one failed-sale charge is billed per order.
      A buyer-only order never carries a failed-sale charge.
    eligibility:
      - id: failed_sale_only_on_unclosed_order
        applies_to: [realty_seller_service_charge]
        kind: state
        condition: "A failed-sale charge is billed only on an order in status listing_expired or cancelled that never recorded a closing."
        evidence_fields: [realty_contracts.status, realty_contracts.closing_date, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        state_contract:
          field: realty_contracts.status
          allowed: [listing_expired, cancelled]
      - id: one_failed_sale_charge_per_order
        applies_to: [realty_seller_service_charge]
        kind: dedup
        condition: "Only one failed-sale charge is billed per order."
        evidence_fields: [realty_billing_entries.realty_contract_id, realty_billing_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_billing_entries.realty_contract_id]
          action_bindings:
            realty_billing_entries.realty_contract_id: realty_contract_id
        dedup_contract:
          table: realty_billing_entries
          mode: separate_record
          object_bindings: {realty_contract_id: realty_contract_id}
          duplicate_filters: {event_type: [realty_seller_service_charge]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Closing Starter: {failed_sale_bill_due_days: "=failed_sale_bill_due_days"}
        Bridgewell Closing Standard: {failed_sale_bill_due_days: "=failed_sale_bill_due_days"}
        Bridgewell Closing Plus: {failed_sale_bill_due_days: "=failed_sale_bill_due_days"}
        Bridgewell Closing Premier: {failed_sale_bill_due_days: "=failed_sale_bill_due_days"}
        Bridgewell Closing Premier Two-Year: {failed_sale_bill_due_days: "=failed_sale_bill_due_days"}
        Bridgewell New Construction Three-Year: {failed_sale_bill_due_days: "=failed_sale_bill_due_days"}
    formula:
      failed_sale_charge: "min(realty_msr_plan_premium_invoiced, realty_msr_seller_phase_benefit_paid)"
    measures: [realty_msr_plan_premium_invoiced, realty_msr_seller_phase_benefit_paid]

  - id: realty_evt_service_request_and_fees
    subject: [realty_service_request, realty_service_fee_charge, realty_service_fee_refund]
    rule: >-
      Service requests are accepted only while the contract status is listing_coverage, closed_pending_payment or active.
      A request placed while the contract is in listing_coverage is a seller_listing request placed by the seller; a
      request placed on or after the closing is a buyer request placed by the buyer. A new_failure request is charged
      seller_service_call_fee in the seller phase and service_call_fee in the buyer phase, once per request. A recall
      for the same item placed no later than repair_guarantee_days calendar days after the earlier repair was
      completed carries no fee, and a later return visit is a new_failure request.
      A rekey request is accepted only when it is placed no later than rekey_request_window_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included.
      The rekey benefit is available only in the buyer phase on plans whose rekey_lock_count is above 0, covers up to
      rekey_lock_count exterior keyed locks once per order, and carries no fee. The fee is refunded in full when the
      caller cancels the request before any contractor is assigned, or when the request was placed on a plan that is
      later voided; it is not refunded because the failure is determined not covered.
    eligibility:
      - id: requests_only_while_covered
        applies_to: [realty_service_request]
        kind: state
        condition: "Service requests are accepted only while the contract status is listing_coverage, closed_pending_payment or active."
        evidence_fields: [realty_contracts.status, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        state_contract:
          field: realty_contracts.status
          allowed: [listing_coverage, closed_pending_payment, active]
      - id: rekey_within_window
        applies_to: [realty_service_request]
        kind: time
        condition: "A rekey request is accepted only when it is placed no later than rekey_request_window_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included."
        evidence_fields: [realty_contracts.closing_date, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale closes
          anchor_source: realty_contracts.closing_date
          relation: not_after
          duration_source: variants.rekey_request_window_days
          unit: calendar_days
          counting_rule: counting from the day after closing_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Closing Starter: {service_call_fee: "=service_call_fee", seller_service_call_fee: "=seller_service_call_fee", rekey_lock_count: "=rekey_lock_count"}
        Bridgewell Closing Standard: {service_call_fee: "=service_call_fee", seller_service_call_fee: "=seller_service_call_fee", rekey_lock_count: "=rekey_lock_count"}
        Bridgewell Closing Plus: {service_call_fee: "=service_call_fee", seller_service_call_fee: "=seller_service_call_fee", rekey_lock_count: "=rekey_lock_count"}
        Bridgewell Closing Premier: {service_call_fee: "=service_call_fee", seller_service_call_fee: "=seller_service_call_fee", rekey_lock_count: "=rekey_lock_count"}
        Bridgewell Closing Premier Two-Year: {service_call_fee: "=service_call_fee", seller_service_call_fee: "=seller_service_call_fee", rekey_lock_count: "=rekey_lock_count"}
        Bridgewell New Construction Three-Year: {service_call_fee: "=service_call_fee", seller_service_call_fee: "=seller_service_call_fee", rekey_lock_count: "=rekey_lock_count"}
    formula:
      fee: "(seller_service_call_fee if coverage_phase == 'seller_listing' else service_call_fee) if request_type == 'new_failure' else 0"

  - id: realty_evt_dispatch
    subject: [realty_contractor_dispatch]
    rule: >-
      A contractor is dispatched only while the contract status is listing_coverage or active.
      Requests recorded while the contract is closed_pending_payment wait and are dispatched once the plan invoice is
      paid and coverage is confirmed. The request goes to a network contractor whose trade matches and whose service
      ZIP codes include the property_zip, preferred before standard, never suspended, and emergency-capable for an
      emergency; ties go to the contractor reference that sorts first alphabetically. The contractor contacts the
      caller within routine_contact_hours hours, or emergency_contact_hours hours for an emergency, measured from
      the assignment; a missed contact window leads to re-dispatch with dispatch_reason redispatch_missed_contact. A
      recall goes to the contractor that did the original work unless now suspended. Each assignment carries the next
      dispatch_sequence, starting at 1.
    eligibility:
      - id: dispatch_only_while_in_force
        applies_to: [realty_contractor_dispatch]
        kind: state
        condition: "A contractor is dispatched only while the contract status is listing_coverage or active."
        evidence_fields: [realty_contracts.status, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        state_contract:
          field: realty_contracts.status
          allowed: [listing_coverage, active]
    params:
      per_tier:
        Bridgewell Closing Starter: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Closing Standard: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Closing Plus: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Closing Premier: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Closing Premier Two-Year: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell New Construction Three-Year: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}

  - id: realty_evt_coverage_determination
    subject: [realty_coverage_determination]
    rule: >-
      One coverage determination is issued per service request.
      A failure is covered only when every condition below holds, and otherwise is not_covered with the first failing
      reason in this order. (1) contract_not_in_force: a seller_listing request was placed while the contract was in
      listing_coverage, or a buyer request was placed on or after closing_date on a contract that is now active.
      (2) item_not_in_plan: the plan's cap for the item is above 0.00 and, in the seller phase, the item is not
      heating, cooling or ductwork unless seller_hvac_covered is true, and is not a roof leak.
      (3) systems_coverage_not_started applies only to plans whose systems_coverage_delay_days is above 0.
      For such a plan, a failure of heating_system, cooling_system, ductwork, plumbing, water_heater or electrical is covered only when it is reported at least systems_coverage_delay_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included.
      (4) preexisting_condition: in the seller phase, conditions existing before order_date are never covered; in the
      buyer phase, known or detectable pre-existing conditions are never covered, and unknown, undetectable ones are
      covered only when unknown_preexisting_covered is true and, where inspection_required_for_preexisting is true,
      home_inspection_completed is true. (5) misuse_or_external_damage: misuse and external causes are never covered.
      (6) cap_exhausted: the remaining item and aggregate benefit under realty_evt_benefit_authorization are both
      above zero.
    eligibility:
      - id: one_determination_per_request
        applies_to: [realty_coverage_determination]
        kind: dedup
        condition: "One coverage determination is issued per service request."
        evidence_fields: [realty_claim_events.realty_service_request_id, realty_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_claim_events.realty_service_request_id]
          action_bindings:
            realty_claim_events.realty_service_request_id: realty_service_request_id
        dedup_contract:
          table: realty_claim_events
          mode: separate_record
          object_bindings: {realty_service_request_id: realty_service_request_id}
          duplicate_filters: {event_type: [realty_coverage_determination]}
          distinct_fields: []
      - id: new_construction_systems_delay
        applies_to: [realty_coverage_determination]
        kind: time
        condition: "For such a plan, a failure of heating_system, cooling_system, ductwork, plumbing, water_heater or electrical is covered only when it is reported at least systems_coverage_delay_days calendar days after the sale closes, counting from the day after closing_date with the boundary day included."
        evidence_fields: [realty_contracts.closing_date, realty_service_requests.request_date, realty_service_requests.realty_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_service_requests.realty_service_request_id]
          action_bindings:
            realty_service_requests.realty_service_request_id: realty_service_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale closes
          anchor_source: realty_contracts.closing_date
          relation: not_before
          duration_source: variants.systems_coverage_delay_days
          unit: calendar_days
          counting_rule: counting from the day after closing_date with the boundary day included
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Closing Starter: {unknown_preexisting_covered: "=unknown_preexisting_covered", systems_coverage_delay_days: "=systems_coverage_delay_days", inspection_required_for_preexisting: "=inspection_required_for_preexisting"}
        Bridgewell Closing Standard: {unknown_preexisting_covered: "=unknown_preexisting_covered", systems_coverage_delay_days: "=systems_coverage_delay_days", inspection_required_for_preexisting: "=inspection_required_for_preexisting"}
        Bridgewell Closing Plus: {unknown_preexisting_covered: "=unknown_preexisting_covered", systems_coverage_delay_days: "=systems_coverage_delay_days", inspection_required_for_preexisting: "=inspection_required_for_preexisting"}
        Bridgewell Closing Premier: {unknown_preexisting_covered: "=unknown_preexisting_covered", systems_coverage_delay_days: "=systems_coverage_delay_days", inspection_required_for_preexisting: "=inspection_required_for_preexisting"}
        Bridgewell Closing Premier Two-Year: {unknown_preexisting_covered: "=unknown_preexisting_covered", systems_coverage_delay_days: "=systems_coverage_delay_days", inspection_required_for_preexisting: "=inspection_required_for_preexisting"}
        Bridgewell New Construction Three-Year: {unknown_preexisting_covered: "=unknown_preexisting_covered", systems_coverage_delay_days: "=systems_coverage_delay_days", inspection_required_for_preexisting: "=inspection_required_for_preexisting"}

  - id: realty_evt_benefit_authorization
    subject: [realty_benefit_authorization, realty_authorization_reversal]
    rule: >-
      A benefit is authorized only after a covered determination is on file for the service request.
      Bridgewell chooses repair or replacement: it replaces when repair_estimate is at or above
      repair_to_replace_threshold_rate times replacement_cost, when parts cannot be obtained within
      parts_lead_time_replace_days calendar days, or when the item cannot be repaired, and otherwise repairs. In the
      seller phase the amount paid is the lowest of the work's cost, seller_item_cap less
      realty_msr_seller_item_benefit_paid, and seller_aggregate_cap less realty_msr_seller_phase_benefit_paid. In the
      buyer phase it is the lowest of the work's cost, the item's cap (item_cap) less realty_msr_item_benefit_paid_year,
      and aggregate_contract_year_limit less realty_msr_contract_year_benefit_paid; buyer limits apply per contract
      year and restart on each anniversary of coverage_start_date. Buyer-phase supplemental allowances (code_violation,
      permit, haul_away on a replacement, refrigerant on a cooling repair) pay the lower of invoice_amount and the
      allowance, with refrigerant limited per contract year by realty_msr_refrigerant_paid_year, and count toward the
      aggregate limit only; the seller phase carries no allowances. When a like unit cannot be sourced, or the buyer
      asks for cash in place of an authorized replacement, cash in lieu equal to the contracted replacement_cost
      within the same limits is offered, and is authorized when the buyer accepts it no later than
      cash_in_lieu_offer_validity_days calendar days after the offer; an accepted cash settlement replaces the
      replacement authorization, which is reversed in full, and is paid within cash_in_lieu_payment_days calendar days.
      The rekey benefit is authorized at the contracted locksmith cost and counts toward the aggregate limit only.
      Only one repair, replacement or cash-in-lieu authorization is open per service request.
      An authorization is reversed in full when the work will not be performed and never after completion.
    eligibility:
      - id: covered_determination_before_benefit
        applies_to: [realty_benefit_authorization]
        kind: authorization
        condition: "A benefit is authorized only after a covered determination is on file for the service request."
        evidence_fields: [realty_claim_events.determination_outcome, realty_claim_events.realty_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_claim_events.realty_service_request_id]
          action_bindings:
            realty_claim_events.realty_service_request_id: realty_service_request_id
      - id: one_open_resolution_per_request
        applies_to: [realty_benefit_authorization]
        kind: dedup
        condition: "Only one repair, replacement or cash-in-lieu authorization is open per service request."
        evidence_fields: [realty_claim_events.realty_service_request_id, realty_claim_events.resolution_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_claim_events.realty_service_request_id]
          action_bindings:
            realty_claim_events.realty_service_request_id: realty_service_request_id
        dedup_contract:
          table: realty_claim_events
          mode: separate_record
          object_bindings: {realty_service_request_id: realty_service_request_id}
          duplicate_filters: {resolution_type: [repair, replacement, cash_in_lieu]}
          distinct_fields: [authorization_number]
    params:
      item_cap:
        heating_system: heating_system_cap
        cooling_system: cooling_system_cap
        ductwork: ductwork_cap
        plumbing: plumbing_cap
        water_heater: water_heater_cap
        electrical: electrical_cap
        kitchen_appliance: kitchen_appliance_cap
        laundry_appliance: laundry_appliance_cap
        garage_door_opener: garage_door_opener_cap
        roof_leak: roof_leak_cap
      per_tier:
        Bridgewell Closing Starter: {aggregate_contract_year_limit: "=aggregate_contract_year_limit", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance"}
        Bridgewell Closing Standard: {aggregate_contract_year_limit: "=aggregate_contract_year_limit", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance"}
        Bridgewell Closing Plus: {aggregate_contract_year_limit: "=aggregate_contract_year_limit", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance"}
        Bridgewell Closing Premier: {aggregate_contract_year_limit: "=aggregate_contract_year_limit", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance"}
        Bridgewell Closing Premier Two-Year: {aggregate_contract_year_limit: "=aggregate_contract_year_limit", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance"}
        Bridgewell New Construction Three-Year: {aggregate_contract_year_limit: "=aggregate_contract_year_limit", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance"}
    formula:
      buyer_amount: "max(0, min(repair_estimate if repair_estimate < repair_to_replace_threshold_rate * replacement_cost else replacement_cost, item_cap - realty_msr_item_benefit_paid_year, aggregate_contract_year_limit - realty_msr_contract_year_benefit_paid))"
      seller_amount: "max(0, min(repair_estimate if repair_estimate < repair_to_replace_threshold_rate * replacement_cost else replacement_cost, seller_item_cap - realty_msr_seller_item_benefit_paid, seller_aggregate_cap - realty_msr_seller_phase_benefit_paid))"
    measures: [realty_msr_item_benefit_paid_year, realty_msr_contract_year_benefit_paid, realty_msr_seller_item_benefit_paid, realty_msr_seller_phase_benefit_paid, realty_msr_refrigerant_paid_year]

  - id: realty_cancellation_and_credits
    subject: [realty_buyer_cancellation, realty_order_cancellation, realty_credit_memo, realty_refund]
    rule: >-
      An order cancelled before closing, an order whose listing expired, and a voided plan each have their plan
      invoice credited in full, and any amount already paid on it is refunded to the payer. A buyer may cancel active
      buyer coverage by giving notice; the cancellation is effective on the notice date.
      A buyer cancellation is processed only on the buyer's own request as the current contract holder.
      Within buyer_free_look_days calendar days after closing_date (realty_msr_days_since_closing), the buyer is
      credited the premium paid less the benefit Bridgewell paid in the buyer phase. After that, the buyer is credited
      the premium paid times realty_msr_unexpired_term_days divided by realty_msr_term_days, rounded to the cent, less
      buyer_cancel_admin_fee, less the buyer-phase benefit paid; a negative result is credited as zero and nothing is
      billed. Service call fees are never credited through a cancellation. Each invoice receives at most one credit memo per credit reason.
      Any credit balance is refunded within refund_processing_days calendar days to the party that paid the invoice
      (escrow refunds go to the buyer once the escrow file is closed).
    eligibility:
      - id: buyer_cancels_own_coverage
        applies_to: [realty_buyer_cancellation]
        kind: caller_fact
        condition: "A buyer cancellation is processed only on the buyer's own request as the current contract holder."
        evidence_fields: [realty_contracts.customer_id, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
      - id: one_credit_per_invoice_reason
        applies_to: [realty_credit_memo]
        kind: dedup
        condition: "Each invoice receives at most one credit memo per credit reason."
        evidence_fields: [realty_billing_entries.invoice_number, realty_billing_entries.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_billing_entries.invoice_number, realty_billing_entries.credit_reason]
          action_bindings:
            realty_billing_entries.invoice_number: invoice_number
            realty_billing_entries.credit_reason: credit_reason
        dedup_contract:
          table: realty_billing_entries
          mode: separate_record
          object_bindings: {invoice_number: invoice_number, credit_reason: credit_reason}
          duplicate_filters: {event_type: [realty_credit_memo]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Closing Starter: {buyer_free_look_days: "=buyer_free_look_days", buyer_cancel_admin_fee: "=buyer_cancel_admin_fee"}
        Bridgewell Closing Standard: {buyer_free_look_days: "=buyer_free_look_days", buyer_cancel_admin_fee: "=buyer_cancel_admin_fee"}
        Bridgewell Closing Plus: {buyer_free_look_days: "=buyer_free_look_days", buyer_cancel_admin_fee: "=buyer_cancel_admin_fee"}
        Bridgewell Closing Premier: {buyer_free_look_days: "=buyer_free_look_days", buyer_cancel_admin_fee: "=buyer_cancel_admin_fee"}
        Bridgewell Closing Premier Two-Year: {buyer_free_look_days: "=buyer_free_look_days", buyer_cancel_admin_fee: "=buyer_cancel_admin_fee"}
        Bridgewell New Construction Three-Year: {buyer_free_look_days: "=buyer_free_look_days", buyer_cancel_admin_fee: "=buyer_cancel_admin_fee"}
    formula:
      buyer_credit: "max(0, realty_msr_plan_premium_paid - realty_msr_contract_year_benefit_paid) if realty_msr_days_since_closing <= buyer_free_look_days else max(0, round(realty_msr_plan_premium_paid * realty_msr_unexpired_term_days / realty_msr_term_days, 2) - buyer_cancel_admin_fee - realty_msr_contract_year_benefit_paid)"
    measures: [realty_msr_days_since_closing, realty_msr_unexpired_term_days, realty_msr_term_days, realty_msr_plan_premium_paid, realty_msr_contract_year_benefit_paid]

  - id: realty_conversion_and_expiration
    subject: [realty_conversion, realty_term_expiration]
    rule: >-
      Bridgewell extends a direct renewal offer to the buyer conversion_offer_days_before_end calendar days before
      term_end_date, for the homeowner service contract tier named by conversion_tier, priced under
      homeplan_premium_pricing. A conversion is processed only on the buyer's own acceptance of the direct renewal offer.
      Accepting before term_end_date converts the contract at term end with continuous coverage; accepting after the
      term ended converts it only within the continuity window set by homeplan_enrollment_terms, and later acceptance
      is a new homeowner enrollment with a waiting period. A conversion creates a homeowner service contract with
      enrollment_channel realty_conversion for the same customer and address. A buyer who does not accept sees the
      contract expire at the end of term_end_date.
    eligibility:
      - id: buyer_accepts_conversion
        applies_to: [realty_conversion]
        kind: caller_fact
        condition: "A conversion is processed only on the buyer's own acceptance of the direct renewal offer."
        evidence_fields: [realty_contracts.customer_id, realty_contracts.term_end_date, realty_contracts.realty_contract_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
    params:
      per_tier:
        Bridgewell Closing Starter: {conversion_tier: "=conversion_tier"}
        Bridgewell Closing Standard: {conversion_tier: "=conversion_tier"}
        Bridgewell Closing Plus: {conversion_tier: "=conversion_tier"}
        Bridgewell Closing Premier: {conversion_tier: "=conversion_tier"}
        Bridgewell Closing Premier Two-Year: {conversion_tier: "=conversion_tier"}
        Bridgewell New Construction Three-Year: {conversion_tier: "=conversion_tier"}
