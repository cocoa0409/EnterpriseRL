# Homeowner Service Contracts — Bridgewell's direct-to-consumer annual home warranty plans.
category: homeplan
display_name: Homeowner Service Contracts

binding:
  holding_table: homeplan_contracts
  event_tables: [homeplan_billing_entries, homeplan_service_requests, homeplan_claim_events]
  intake_tables: [homeplan_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [waiting_period, active, suspended_nonpayment, expired, cancelled]
  transitions:
    - {from: waiting_period, to: active, by: system, means: The waiting period ends on the coverage effective date (or immediately for a realty conversion) and service requests can be placed.}
    - {from: waiting_period, to: cancelled, by: user, means: The customer confirms cancellation before coverage begins.}
    - {from: active, to: cancelled, by: user, means: The customer confirms a cancellation request on file during the term.}
    - {from: active, to: suspended_nonpayment, by: system, means: A premium installment remains unpaid beyond the payment grace period, so service is suspended.}
    - {from: suspended_nonpayment, to: active, by: agent, means: The full past-due premium balance is paid within the cure period and the agent reinstates the contract.}
    - {from: suspended_nonpayment, to: cancelled, by: system, means: The past-due balance is not cured within the cure period and the contract is cancelled for nonpayment.}
    - {from: active, to: expired, by: system, means: The term ends without an automatic or affirmative renewal.}
    - {from: expired, to: active, by: agent, means: The customer renews within the late-renewal grace period and the agent reinstates the contract for a new term without a new waiting period.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Premium the customer owes on the contract; positive means money owed to Bridgewell, negative means a credit owed back to the customer.
  - key: service_fee_balance
    unit: USD
    meaning: Service call fees collected on the contract's service requests and not refunded.
  - key: benefit_consumed
    unit: USD
    meaning: Dollars Bridgewell has committed toward covered repairs, replacements, allowances, cash in lieu and out-of-network reimbursements on the contract, net of reversals.

parameter_schema:
  monthly_premium: Base monthly premium for a single-family home at the standard service call fee, USD.
  annual_pay_discount_rate: Discount applied when the term premium is paid in full up front, decimal fraction of twelve monthly installments.
  standard_service_call_fee: The default service call fee option per service request per trade, USD.
  low_fee_option_amount: The lower service call fee option a customer may elect at enrollment or renewal, USD.
  low_fee_monthly_surcharge: Amount added to each monthly installment when the lower service call fee option is elected, USD.
  high_fee_option_amount: The higher service call fee option a customer may elect at enrollment or renewal, USD.
  high_fee_monthly_discount: Amount deducted from each monthly installment when the higher service call fee option is elected, USD.
  oversize_home_threshold_sqft: Living-area square footage at or above which the oversize-home surcharge applies, square feet.
  oversize_home_monthly_surcharge: Amount added to each monthly installment for homes at or above the oversize threshold, USD.
  condo_townhome_monthly_discount: Amount deducted from each monthly installment for a condominium or townhome, USD.
  contract_term_months: Length of each contract term, calendar months.
  waiting_period_days: Calendar days after the contract start date before new coverage begins, days.
  upgrade_waiting_period_days: Calendar days after a mid-term upgrade before items or higher limits added by the upgrade are covered, days.
  free_look_days: Calendar days after the original start date during which a cancellation receives the free-look refund, days.
  cancellation_admin_fee: Administrative fee deducted from a pro-rata refund on cancellation after the free-look period, USD.
  refund_processing_days: Calendar days after a confirmed cancellation within which the refund must be issued, days.
  payment_grace_days: Calendar days after an installment's due date before nonpayment suspends service, days.
  suspension_cure_days: Calendar days after suspension during which paying the full past-due balance reinstates the contract, days.
  returned_payment_fee: Fee billed when a premium payment is returned unpaid by the bank or card issuer, USD.
  renewal_notice_days: Minimum calendar days before term end by which the renewal notice must be issued for automatic renewal, days.
  late_renewal_grace_days: Calendar days after term end during which an expired contract can be renewed without a new waiting period, days.
  conversion_continuity_days: Calendar days after a real estate contract term ends within which a conversion enrollment keeps continuous coverage, days.
  midterm_upgrade_allowed: Whether the tier can be upgraded to a higher tier during a term, boolean.
  aggregate_term_limit: Maximum total benefit Bridgewell pays on the contract per term across all items and allowances, USD.
  heating_system_cap: Per-term limit for the heating system, USD; 0.00 means not covered by the tier.
  cooling_system_cap: Per-term limit for the cooling system, USD; 0.00 means not covered by the tier.
  ductwork_cap: Per-term limit for heating and cooling ductwork, USD; 0.00 means not covered by the tier.
  plumbing_leak_cap: Per-term limit for interior plumbing leaks and breaks, USD; 0.00 means not covered by the tier.
  plumbing_stoppage_cap: Per-term limit for clearing interior drain stoppages, USD; 0.00 means not covered by the tier.
  water_heater_cap: Per-term limit for the water heater, USD; 0.00 means not covered by the tier.
  electrical_cap: Per-term limit for the interior electrical system, USD; 0.00 means not covered by the tier.
  ceiling_fan_cap: Per-term limit for ceiling fans, USD; 0.00 means not covered by the tier.
  garbage_disposal_cap: Per-term limit for the garbage disposal, USD; 0.00 means not covered by the tier.
  whirlpool_tub_cap: Per-term limit for the whirlpool bathtub motor and pump, USD; 0.00 means not covered by the tier.
  refrigerator_cap: Per-term limit for the kitchen refrigerator, USD; 0.00 means not covered by the tier.
  oven_range_cooktop_cap: Per-term limit for the oven, range and cooktop, USD; 0.00 means not covered by the tier.
  dishwasher_cap: Per-term limit for the dishwasher, USD; 0.00 means not covered by the tier.
  built_in_microwave_cap: Per-term limit for the built-in microwave, USD; 0.00 means not covered by the tier.
  clothes_washer_cap: Per-term limit for the clothes washer, USD; 0.00 means not covered by the tier.
  clothes_dryer_cap: Per-term limit for the clothes dryer, USD; 0.00 means not covered by the tier.
  garage_door_opener_cap: Per-term limit for the garage door opener, USD; 0.00 means not covered by the tier.
  code_violation_allowance: Per-request amount paid to correct a code violation discovered during a covered repair or replacement, USD.
  permit_fee_allowance: Per-request amount paid toward permits required for a covered repair or replacement, USD.
  haul_away_allowance: Per-request amount paid to remove and dispose of replaced equipment, USD.
  refrigerant_allowance: Per-term amount paid for refrigerant recovery and recharge on covered cooling repairs, USD.
  crane_access_allowance: Per-request amount paid for crane or lift access to rooftop equipment, USD.
  slab_leak_access_allowance: Per-request amount paid to access a covered leak through a concrete slab and close the opening, USD.
  unknown_preexisting_covered: Whether failures from conditions that existed before coverage but were unknown and not detectable by visual inspection are covered, boolean.
  improper_installation_covered: Whether failures caused by improper prior installation or repair are covered, boolean.
  repair_guarantee_days: Calendar days after a covered repair is completed during which a return visit for the same failure carries no service call fee, days.
  replacement_labor_guarantee_days: Calendar days after a Bridgewell-provided replacement is installed during which a return visit for the installation carries no service call fee, days.
  routine_contact_hours: Hours within which the assigned contractor must contact the customer on a routine request, hours.
  emergency_contact_hours: Hours within which the assigned contractor must contact the customer on an emergency request, hours.
  after_hours_non_emergency_surcharge: Surcharge billed when the customer asks for an after-hours visit on a request that is not an emergency, USD.
  second_opinion_fee_rate: Fraction of the contract's service call fee charged for a customer-requested second opinion, decimal fraction.
  out_of_network_reimbursement_cap: Maximum reimbursement per request for a pre-authorized licensed contractor of the customer's choosing, USD.
  repair_to_replace_threshold_rate: Repair estimate as a fraction of contracted replacement cost at or above which Bridgewell replaces instead of repairing, decimal fraction.
  parts_lead_time_replace_days: Calendar days of parts lead time beyond which Bridgewell replaces instead of waiting for parts, days.
  cash_in_lieu_offer_validity_days: Calendar days after a cash-in-lieu offer is issued during which the customer may accept it, days.
  cash_in_lieu_payment_days: Calendar days after acceptance within which the cash-in-lieu payment must be issued, days.
  fee_refund_before_dispatch: Whether a service call fee is refunded when the customer cancels the request before a contractor is dispatched, boolean.

