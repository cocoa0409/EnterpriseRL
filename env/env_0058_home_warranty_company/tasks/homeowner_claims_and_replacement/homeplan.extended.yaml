    factors:
      - id: outage_day_count
        effect: method
        decides: outage_days
        bindings: [outage_item, outage_start, outage_end, outage_age, outage_days]
        ladder:
          - when: "a heating_system, water_heater or refrigerator whose request was placed at least delay_min_days days before the offer date"
            method: "every calendar day after the request date up to and including the offer date counts"
          - when: "any other item whose request was placed at least delay_min_days days before the offer date"
            method: "only the days beyond the first delay_min_days count"
          - when: "otherwise (the request was placed fewer than delay_min_days days before the offer date)"
            method: "no day counts"
        baseline:
          outage_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: recall_fee_return_ladder
        effect: parameter
        decides: fee_return_share
        bindings: [recall_kind, earlier_work_number, earlier_work_request, earlier_visit_fee, earlier_replacements, fee_return_share]
        ladder:
          - when: "a recall that names an earlier Bridgewell replacement, whose installed unit has failed outright"
            value: "K('fee_return_replacement')"
          - when: "a recall that names an earlier Bridgewell repair"
            value: "K('fee_return_repair')"
          - when: "otherwise (the request is not a recall)"
            value: "0.0"
        baseline:
          fee_return_share: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: early_failure_method
        effect: method
        decides: early_failure_credit
        bindings: [recall_date, earlier_completion, earlier_amount, guarantee_window, failure_gap, early_failure_credit]
        ladder:
          - when: "the request is a recall that came no more than early_failure_days days after the earlier work's completion"
            method: "the amount recorded on the earlier work's authorization multiplied by early_install_share, rounded to the cent"
          - when: "the recall came later but within the guarantee window of the earlier work"
            method: "the flat labor_guarantee_goodwill"
          - when: "otherwise (not a recall, or after that window)"
            method: "no early-failure credit"
        baseline:
          early_failure_credit: "0.0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: network_miss_ladder
        effect: parameter
        decides: network_miss_credit
        bindings: [recall_misses, household_misses, line_plan_misses, network_miss_credit]
        ladder:
          - when: "an assignment on the request carries dispatch_reason redispatch_missed_contact and, within the twelve months before today, an assignment on another of the household's homeowner-contract requests or on a request under a Bridgewell line plan the customer holds was re-dispatched for that reason"
            value: "K('network_miss_credit_repeat')"
          - when: "an assignment on the request carries that dispatch_reason and no such earlier re-dispatch exists in that time"
            value: "K('network_miss_credit_one')"
          - when: "otherwise (no assignment on the request carries that dispatch_reason)"
            value: "0.0"
        baseline:
          network_miss_credit: "0.0"
        evidence: [history, cross_category]
        cross_difficulty: lineplan
    baseline:
      rule: >-
        The company-elected acceptance payment is worked out on the service request of the replacement authorization
        most recently issued on the contract, from the most recent company-elected offer on that request.
        It starts from the accepted offer amount.
        The remaining item benefit and the remaining aggregate benefit are counted as if the standing authorization had
        already been reversed: the tier's cap for the covered item less the payments on that item counted toward the
        remaining benefits with the authorization's amount taken back out, floored at zero, and aggregate_term_limit less
        every payment on the contract counted toward them with the authorization's amount taken back out, floored at
        zero.
        A payment counts toward the remaining benefits when its event date falls within the twelve months before today,
        that is after the same calendar day twelve months earlier, whatever term its request fell in; repair,
        replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count
        toward the aggregate only, and a reversal takes its authorization's amount back out of both counts.
        The company-elected acceptance payment is the lowest of the amount so started, the remaining item benefit and
        the remaining aggregate benefit, never below zero, rounded to the cent once at the end.
      params: [aggregate_term_limit]
