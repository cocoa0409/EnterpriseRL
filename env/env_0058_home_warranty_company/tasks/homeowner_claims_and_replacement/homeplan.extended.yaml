events:
  # ---- contract (holding) writes ----
  - type: homeplan_enrollment
    target: homeplan_contracts
    mutation: create
    meaning: A homeowner purchases a new homeowner service contract for one property, online, by phone, or by converting an expiring real estate contract.
    grain: One row per contract purchased.
    fields:
      customer_id: The purchasing homeowner.
      variant_name: The official tier purchased.
      property_address: The covered property address as the customer states it.
      property_zip: The five-digit ZIP code of the covered property.
      property_type: The dwelling type of the covered property.
      square_footage: The living-area square footage of the covered property.
      enrollment_channel: How the contract was purchased (online, phone, realty_conversion).
      realty_contract_id: For a realty conversion, the expiring real estate contract it continues; empty otherwise.
      start_date: The purchase date, which is also the first term start.
      term_start_date: The start of the current term (equal to start_date at enrollment).
      term_end_date: The last covered day of the current term.
      coverage_effective_date: The first day failures are covered.
      term_number: 1 at enrollment.
      billing_frequency: Monthly installments or annual pay-in-full.
      service_call_fee: The service call fee option elected.
      auto_renew: Whether the contract renews automatically.
    triggers:
      - event: homeplan:homeplan_premium_charge
        when: {billing_frequency: monthly}
        map: {charge_type: monthly_installment}
      - event: homeplan:homeplan_premium_charge
        when: {billing_frequency: annual}
        map: {charge_type: annual_premium}
      - event: homeplan:homeplan_coverage_activation
        when: {enrollment_channel: realty_conversion}
        map: {}
  - type: homeplan_coverage_activation
    target: homeplan_contracts
    mutation: {transition: {from: waiting_period, to: active}}
    meaning: The waiting period ends and coverage starts.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers: []
  - type: homeplan_renewal_notice
    target: homeplan_contracts
    mutation: update
    meaning: Bridgewell issues the renewal notice stating the renewal term and price ahead of term end.
    grain: One row per transaction.
    fields:
      renewal_notice_date: The date the renewal notice was issued for the current term.
    triggers: []
  - type: homeplan_renewal_preference_change
    target: homeplan_contracts
    mutation: update
    meaning: The customer turns automatic renewal on or off.
    grain: One row per transaction.
    fields:
      auto_renew: The new automatic renewal setting.
    triggers: []
  - type: homeplan_renewal
    target: homeplan_contracts
    mutation: update
    meaning: An active contract renews into a new term on its term end, optionally at a different tier or service call fee option.
    grain: One row per transaction.
    fields:
      term_start_date: The first day of the new term (the day after the prior term_end_date).
      term_end_date: The last day of the new term.
      term_number: Incremented by one.
      variant_name: The tier for the new term (a downgrade takes effect only here).
      prior_variant_name: The tier of the term that just ended.
      service_call_fee: The service call fee option for the new term.
      renewal_notice_date: Cleared for the new term.
    triggers:
      - event: homeplan:homeplan_premium_charge
        map: {}
      - event: addon:addon_rider_renewal
        map: {}
  - type: homeplan_plan_upgrade
    target: homeplan_contracts
    mutation: update
    meaning: The customer moves to a higher tier during the term.
    grain: One row per transaction.
    fields:
      variant_name: The higher tier now held.
      prior_variant_name: The tier held before the upgrade.
      last_plan_change_date: The date the upgrade took effect.
    triggers: []
  - type: homeplan_cancellation
    target: homeplan_contracts
    mutation: {transition: [{from: waiting_period, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The customer confirms a cancellation request and the contract ends.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation effective date, which is the notice date on the cancellation request.
    triggers:
      - event: homeplan:homeplan_premium_credit
        map: {credit_reason: cancellation_refund_credit}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: homeplan_nonpayment_suspension
    target: homeplan_contracts
    mutation: {transition: {from: active, to: suspended_nonpayment}}
    meaning: Service is suspended because an installment is past due beyond the grace period.
    grain: One row per transaction.
    fields:
      status: Becomes suspended_nonpayment.
      suspended_date: The date service was suspended.
    triggers: []
  - type: homeplan_reinstatement
    target: homeplan_contracts
    mutation: {transition: {from: suspended_nonpayment, to: active}}
    meaning: A suspended contract is reinstated after the full past-due balance is paid within the cure period.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      suspended_date: Cleared on reinstatement.
    triggers: []
  - type: homeplan_nonpayment_cancellation
    target: homeplan_contracts
    mutation: {transition: {from: suspended_nonpayment, to: cancelled}}
    meaning: A suspended contract is cancelled because the past-due balance was not cured in time.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The date the contract was cancelled for nonpayment.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: homeplan_expiration
    target: homeplan_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The term_end_date of the term that ended.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: homeplan_late_renewal
    target: homeplan_contracts
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired contract is renewed within the late-renewal grace period.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      term_start_date: The date of the late renewal.
      term_end_date: The last day of the new term counted from the late renewal date.
      term_number: Incremented by one.
      end_date: Cleared.
    triggers:
      - event: homeplan:homeplan_premium_charge
        map: {}
  # ---- premium ledger ----
      - event: addon:addon_rider_renewal
        map: {}
  - type: homeplan_premium_charge
    target: homeplan_billing_entries
    meaning: A premium amount is billed to the customer (an installment, an annual premium, an upgrade proration, a returned payment or a returned payment fee).
    grain: One row per amount billed for one billing period and charge type.
    distinguish_by: [charge_type, billing_period_start, payment_reference]
    fields:
      entry_date: The billing date.
      amount: The amount billed, positive.
      charge_type: What is being billed.
      billing_period_start: The first day of the period the charge covers (for a returned payment or its fee, the period of the returned payment).
      billing_period_end: The last day of the period the charge covers.
      payment_reference: For a returned payment or returned payment fee, the confirmation number of the payment that was returned; empty otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: homeplan_premium_payment
    target: homeplan_billing_entries
    meaning: The customer pays premium.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: Card, bank draft (ach) or check.
    account: premium_balance
    direction: out
    triggers: []
  - type: homeplan_premium_credit
    target: homeplan_billing_entries
    meaning: A premium credit is posted, either the cancellation refund credit or a billing correction.
    grain: One row per credit posted for one source object.
    distinguish_by: [credit_reason, homeplan_cancellation_request_id, billing_period_start]
    fields:
      entry_date: The posting date.
      amount: The credit amount, positive.
      credit_reason: Why the credit is posted.
      homeplan_cancellation_request_id: For a cancellation credit, the cancellation request it settles; empty otherwise.
      billing_period_start: For a billing correction, the period of the charge corrected; empty otherwise.
    account: premium_balance
    direction: out
    triggers: []
  - type: homeplan_premium_refund
    target: homeplan_billing_entries
    meaning: A refund is disbursed to the customer from a credit balance.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund amount, positive.
      refund_reference: The refund confirmation number.
      homeplan_cancellation_request_id: The cancellation request the refund settles.
      payment_method: How the refund is returned (card, ach or check).
    account: premium_balance
    direction: in
    triggers: []
  - type: homeplan_service_fee_charge
    target: homeplan_billing_entries
    meaning: A service call fee or surcharge is collected for a service request.
    grain: One row per fee type collected on one service request.
    distinguish_by: [homeplan_service_request_id, fee_type]
    fields:
      entry_date: The collection date.
      amount: The fee collected, positive.
      homeplan_service_request_id: The service request the fee belongs to.
      fee_type: Standard visit fee, second-opinion fee, or after-hours surcharge.
    account: service_fee_balance
    direction: in
    triggers: []
  - type: homeplan_service_fee_refund
    target: homeplan_billing_entries
    meaning: A service call fee collected on a request is refunded.
    grain: One row per fee type refunded on one service request.
    distinguish_by: [homeplan_service_request_id, fee_type]
    fields:
      entry_date: The refund date.
      amount: The amount refunded, positive.
      homeplan_service_request_id: The service request whose fee is refunded.
      fee_type: The fee type being refunded.
      fee_refund_reason: Why the fee is refunded.
    account: service_fee_balance
    direction: out
    triggers: []
  # ---- service requests ----
  - type: homeplan_service_request
    target: homeplan_service_requests
    meaning: The customer reports a failure of one item and asks for service.
    grain: One row per item failure reported (one trade per request).
    distinguish_by: [homeplan_service_request_id]
    fields:
      homeplan_service_request_id: The service request number.
      request_date: The date the request was placed.
      covered_item: The item that failed.
      trade: The trade that services the item.
      request_type: A new failure, a recall under a guarantee, or a second opinion.
      urgency: Emergency or routine.
      service_window: Whether the customer asks for a business-hours or after-hours visit.
      failure_description: The customer's description of the failure, verbatim.
      prior_authorization_number: For a recall, the authorization number of the earlier repair or replacement; for a second opinion, empty.
    triggers:
      - event: homeplan:homeplan_service_fee_charge
        when: {request_type: new_failure}
        map: {homeplan_service_request_id: homeplan_service_request_id, fee_type: standard_visit}
      - event: homeplan:homeplan_service_fee_charge
        when: {request_type: second_opinion}
        map: {homeplan_service_request_id: homeplan_service_request_id, fee_type: second_opinion}
      - event: homeplan:homeplan_service_fee_charge
        when: {urgency: routine, service_window: after_hours}
        map: {homeplan_service_request_id: homeplan_service_request_id, fee_type: after_hours_surcharge}
  # ---- claim handling ----
  - type: homeplan_contractor_dispatch
    target: homeplan_claim_events
    meaning: A contractor is assigned to a service request, or the customer is pre-authorized to use their own licensed contractor.
    grain: One row per assignment on one service request.
    distinguish_by: [homeplan_service_request_id, dispatch_sequence]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The assignment date.
      service_contractor_id: The network contractor assigned; empty for an out-of-network authorization.
      dispatch_sequence: 1 for the first assignment on the request, incremented for each further assignment.
      dispatch_reason: Initial assignment, re-dispatch after a missed contact window, second opinion, recall, or out-of-network authorization.
    triggers: []
  - type: homeplan_coverage_determination
    target: homeplan_claim_events
    meaning: Bridgewell decides whether the reported failure is covered.
    grain: One row per determination stage on one service request.
    distinguish_by: [homeplan_service_request_id, determination_stage]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The determination date.
      covered_item: The item the determination concerns.
      determination_stage: Initial determination or the review after a second opinion.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered; empty when covered.
    triggers: []
  - type: homeplan_repair_authorization
    target: homeplan_claim_events
    meaning: Bridgewell authorizes the contractor to repair the covered item.
    grain: One row per repair authorization number.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The authorization date.
      covered_item: The item repaired.
      authorization_number: The authorization number issued.
      repair_estimate: The contractor's repair estimate.
      replacement_cost: Bridgewell's contracted replacement cost for a like unit (equipment plus installation).
      amount: The amount Bridgewell pays toward the repair.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_replacement_authorization
    target: homeplan_claim_events
    meaning: Bridgewell decides to replace the covered item with a unit of like capacity and efficiency.
    grain: One row per replacement authorization number.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The authorization date.
      covered_item: The item replaced.
      authorization_number: The authorization number issued.
      repair_estimate: The contractor's repair estimate that was compared.
      replacement_cost: Bridgewell's contracted replacement cost (equipment plus installation).
      replacement_basis: Why replacement was chosen over repair.
      amount: The amount Bridgewell pays toward the replacement.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_supplemental_allowance
    target: homeplan_claim_events
    meaning: Bridgewell pays a supplemental allowance attached to a covered repair or replacement (code violation, permit, haul-away, refrigerant, crane access or slab access).
    grain: One row per allowance type on one service request.
    distinguish_by: [homeplan_service_request_id, allowance_type]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The authorization date.
      allowance_type: Which allowance.
      invoice_amount: The documented cost of the work the allowance pays toward.
      amount: The amount paid under the allowance.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_cash_in_lieu_offer
    target: homeplan_claim_events
    meaning: Bridgewell offers cash in place of providing a replacement unit.
    grain: One row per offer on one service request.
    distinguish_by: [homeplan_service_request_id, settlement_basis]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The offer date.
      covered_item: The item the offer concerns.
      replacement_cost: Bridgewell's contracted replacement cost used as the offer basis.
      amount: The cash offered.
      settlement_basis: Whether Bridgewell elected cash or the customer asked for cash in place of an authorized replacement.
      offer_expiration_date: The last day the offer may be accepted.
    triggers: []
  - type: homeplan_cash_in_lieu_payment
    target: homeplan_claim_events
    meaning: The customer accepts a cash-in-lieu offer and Bridgewell pays it.
    grain: One row per accepted offer.
    distinguish_by: [homeplan_service_request_id, authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The acceptance date.
      covered_item: The item settled in cash.
      authorization_number: The cash settlement authorization number issued.
      amount: The cash paid.
      settlement_basis: Copied from the accepted offer.
      reversed_authorization_number: For a customer-elected settlement, the replacement authorization number it replaces; empty otherwise.
    account: benefit_consumed
    direction: in
    triggers:
      - event: homeplan:homeplan_authorization_reversal
        when: {settlement_basis: customer_elected}
        map: {homeplan_service_request_id: homeplan_service_request_id, reversed_authorization_number: reversed_authorization_number, reversal_reason: cash_in_lieu_elected}
  - type: homeplan_out_of_network_reimbursement
    target: homeplan_claim_events
    meaning: Bridgewell reimburses the customer for a pre-authorized licensed contractor of their choosing.
    grain: One row per reimbursement authorization number.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The reimbursement date.
      covered_item: The item repaired.
      authorization_number: The reimbursement authorization number.
      invoice_amount: The contractor invoice the customer submitted.
      amount: The amount reimbursed.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: homeplan_authorization_reversal
    target: homeplan_claim_events
    meaning: A repair or replacement authorization is reversed because the work will not be performed.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The reversal date.
      reversed_authorization_number: The authorization number being reversed.
      reversal_reason: Why it is reversed.
      amount: The authorized amount being reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []
  - type: homeplan_work_completion
    target: homeplan_claim_events
    meaning: The contractor reports that the authorized repair or replacement has been completed.
    grain: One row per authorization completed.
    distinguish_by: [authorization_number]
    fields:
      homeplan_service_request_id: The service request.
      event_date: The completion date.
      authorization_number: The repair or replacement authorization completed.
      covered_item: The item worked on.
    triggers: []

measures:
  - id: homeplan_msr_item_benefit_paid_term
    window: The contract term in which the service request's request_date falls (term_start_date through term_end_date of that term).
    measure: Sum of amount on homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_cash_in_lieu_payment and homeplan_out_of_network_reimbursement rows for the same covered_item on the contract whose service request falls in the window, minus amount on homeplan_authorization_reversal rows reversing any of those authorizations.
  - id: homeplan_msr_term_benefit_paid
    window: The contract term in which the service request's request_date falls; for a cancellation, the current term as of notice_date.
    measure: Sum of amount on every benefit_consumed in-event (repair, replacement, supplemental allowance, cash in lieu, out-of-network reimbursement) on the contract whose service request falls in the window, minus amount on homeplan_authorization_reversal rows for those authorizations.
  - id: homeplan_msr_term_refrigerant_paid
    window: The current contract term (term_start_date through term_end_date).
    measure: Sum of amount on homeplan_supplemental_allowance rows with allowance_type refrigerant on the contract whose service request falls in the window.
  - id: homeplan_msr_term_premium_paid
    window: The current contract term as of the cancellation notice_date (term_start_date through notice_date).
    measure: Sum of amount on homeplan_premium_payment rows with entry_date in the window, minus amount on homeplan_premium_charge rows with charge_type returned_payment in the window.
  - id: homeplan_msr_unexpired_term_days
    window: The current contract term as of the cancellation notice_date.
    measure: Count of calendar days from the day after notice_date through term_end_date inclusive (0 when notice_date is on or after term_end_date).
  - id: homeplan_msr_term_days
    window: The current contract term.
    measure: Count of calendar days from term_start_date through term_end_date inclusive.
  - id: homeplan_msr_days_since_start
    window: From the original start_date to the cancellation notice_date.
    measure: Count of calendar days from the day after start_date through notice_date inclusive.
  - id: homeplan_msr_oldest_unpaid_due_date
    window: All premium charges on the contract up to frozen time.
    measure: The billing_period_start of the oldest monthly_installment or annual_premium charge not fully covered by payments and credits applied oldest charge first.

policies:
  - id: homeplan_agg_multi_holding
    subject: [homeplan_enrollment]
    rule: >-
      A customer may hold any number of homeowner service contracts, one for each distinct property they own
      and occupy as a residence. How many contracts one property may carry is governed by
      homeplan_agg_one_contract_per_property.
    eligibility: []
    params:
      max_per_customer: null

  - id: homeplan_agg_one_contract_per_property
    subject: [homeplan_enrollment]
    rule: >-
      A property address may carry only one homeowner service contract at a time.
      A new homeowner service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      Homeowner coverage and rental property coverage are mutually exclusive for the same property:
      a new homeowner service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      A real estate contract for the same address in status active or closed_pending_payment also blocks a new homeowner service contract, except a realty_conversion enrollment that continues that real estate contract.
      Contracts in status expired or cancelled never block a new enrollment. Addresses are compared exactly as
      recorded on each contract.
    eligibility:
      - id: no_open_homeowner_contract_on_property
        applies_to: [homeplan_enrollment]
        kind: dedup
        condition: "A new homeowner service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [homeplan_contracts.property_address, homeplan_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.property_address]
          action_bindings:
            homeplan_contracts.property_address: property_address
        dedup_contract:
          table: homeplan_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []
      - id: no_open_rental_contract_on_property
        applies_to: [homeplan_enrollment]
        kind: dedup
        condition: "a new homeowner service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [landlord_contracts.property_address, landlord_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.property_address]
          action_bindings:
            landlord_contracts.property_address: property_address
        dedup_contract:
          table: landlord_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []
      - id: no_open_realty_contract_on_property
        applies_to: [homeplan_enrollment]
        kind: dedup
        condition: "A real estate contract for the same address in status active or closed_pending_payment also blocks a new homeowner service contract, except a realty_conversion enrollment that continues that real estate contract."
        evidence_fields: [realty_contracts.property_address, realty_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.property_address]
          action_bindings:
            realty_contracts.property_address: property_address
        dedup_contract:
          table: realty_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [active, closed_pending_payment]}
          distinct_fields: []

  - id: homeplan_enrollment_terms
    subject: [homeplan_enrollment, homeplan_coverage_activation]
    rule: >-
      Enrollment is open only to owner-occupied residential properties whose property type and living-area square footage satisfy the entry gate of the tier purchased.
      Properties rented to tenants or used commercially are enrolled under rental property service contracts
      instead, and the property type and square footage are taken from the customer's statement at enrollment.
      The service call fee elected must be one of the tier's low_fee_option_amount, standard_service_call_fee or
      high_fee_option_amount, and billing_frequency is monthly or annual. Each term lasts contract_term_months
      calendar months: term_end_date is the day before the same calendar day contract_term_months later, falling
      back to the last day of the month when that day does not exist. For an online or phone enrollment,
      coverage_effective_date is start_date plus waiting_period_days calendar days and the contract stays in
      waiting_period until then.
      For an online or phone enrollment, the contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero.
      A realty_conversion enrollment continues a real estate contract held by the same customer for the same
      property address, has coverage_effective_date equal to start_date and activates immediately.
      A realty_conversion enrollment keeps continuous coverage only when its start date is no later than conversion_continuity_days calendar days after the day the real estate contract term ends; the day count starts the day after the real estate term_end_date and the boundary day itself qualifies.
      A conversion requested later than that is enrolled as a phone enrollment with the normal waiting period.
    eligibility:
      - id: owner_occupied_property_within_entry_gate
        applies_to: [homeplan_enrollment]
        kind: caller_fact
        condition: "Enrollment is open only to owner-occupied residential properties whose property type and living-area square footage satisfy the entry gate of the tier purchased."
        evidence_fields: [homeplan_contracts.property_address, homeplan_contracts.property_type, homeplan_contracts.square_footage]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.property_address]
          action_bindings:
            homeplan_contracts.property_address: property_address
      - id: waiting_period_elapsed_before_activation
        applies_to: [homeplan_coverage_activation]
        kind: time
        condition: "For an online or phone enrollment, the contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero."
        evidence_fields: [homeplan_contracts.start_date, homeplan_contracts.enrollment_channel, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract is purchased
          anchor_source: homeplan_contracts.start_date
          relation: not_before
          duration_source: variants.waiting_period_days
          unit: calendar_days
          counting_rule: counting the purchase date as day zero
          boundary: inclusive
      - id: conversion_within_continuity_window
        applies_to: [homeplan_enrollment, homeplan_coverage_activation]
        kind: time
        condition: "A realty_conversion enrollment keeps continuous coverage only when its start date is no later than conversion_continuity_days calendar days after the day the real estate contract term ends; the day count starts the day after the real estate term_end_date and the boundary day itself qualifies."
        evidence_fields: [realty_contracts.term_end_date, realty_contracts.realty_contract_id, realty_contracts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [realty_contracts.realty_contract_id]
          action_bindings:
            realty_contracts.realty_contract_id: realty_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the real estate contract term ends
          anchor_source: realty_contracts.term_end_date
          relation: not_after
          duration_source: variants.conversion_continuity_days
          unit: calendar_days
          counting_rule: the day count starts the day after the real estate term_end_date and the boundary day itself qualifies
          boundary: inclusive

  - id: homeplan_premium_pricing
    subject: [homeplan_premium_charge, homeplan_enrollment, homeplan_renewal, homeplan_late_renewal]
    rule: >-
      The monthly installment for a tier equals monthly_premium, plus low_fee_monthly_surcharge when the
      contract's service_call_fee equals low_fee_option_amount, minus high_fee_monthly_discount when it equals
      high_fee_option_amount, plus oversize_home_monthly_surcharge when square_footage is at or above
      oversize_home_threshold_sqft, minus condo_townhome_monthly_discount when property_type is condominium or
      townhome; the adjustments are flat amounts added together, never compounded. A monthly-billed contract is
      charged one monthly_installment per billing period; each billing period starts on the same calendar day of
      the month as term_start_date (the last day of the month when that day does not exist) and the installment
      is due on the period start. An annual-billed contract is charged one annual_premium per term on
      term_start_date, equal to twelve monthly installments reduced by annual_pay_discount_rate and rounded to the
      cent. Renewal and late-renewal terms are priced with the tier parameters in force on the new term start
      date for the tier held for that term. A returned premium payment is billed back as a returned_payment charge
      equal to the returned amount together with one returned_payment_fee charge of returned_payment_fee, both
      carrying the confirmation number of the returned payment.
      Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment.
      No premium is billed for any period after a contract's end_date.
    eligibility:
      - id: premium_billed_only_on_open_contract
        applies_to: [homeplan_premium_charge]
        kind: state
        condition: "Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [waiting_period, active, suspended_nonpayment]
    params:
      per_tier:
        Bridgewell ApplianceCare: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell SystemsCare: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Bronze: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Silver: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Gold: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
        Bridgewell HomeCare Platinum: {monthly_premium: "=monthly_premium", oversize_home_monthly_surcharge: "=oversize_home_monthly_surcharge"}
    formula:
      monthly_installment: "monthly_premium + (low_fee_monthly_surcharge if service_call_fee == low_fee_option_amount else 0) - (high_fee_monthly_discount if service_call_fee == high_fee_option_amount else 0) + (oversize_home_monthly_surcharge if square_footage >= oversize_home_threshold_sqft else 0) - (condo_townhome_monthly_discount if property_type in ['condominium', 'townhome'] else 0)"
      annual_premium: "round(monthly_installment * 12 * (1 - annual_pay_discount_rate), 2)"

  - id: homeplan_evt_premium_collection_and_nonpayment
    subject: [homeplan_premium_payment, homeplan_nonpayment_suspension, homeplan_reinstatement, homeplan_nonpayment_cancellation]
    rule: >-
      A premium payment is applied to premium_balance, oldest unpaid charge first. The installment that drives
      nonpayment handling is the oldest unpaid one (homeplan_msr_oldest_unpaid_due_date).
      Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends.
      While a contract is suspended_nonpayment no service request is accepted and no contractor is dispatched.
      A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies.
      Reinstatement does not restart the waiting period and does not change term dates, and failures first
      reported while suspended are not covered.
      A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date.
      On a nonpayment cancellation the cancellation admin fee is not charged and no refund is due, and premium
      already billed for periods before the cancellation remains owed. Payments received on a cancelled or expired
      contract are applied to its remaining balance but never reinstate it.
    eligibility:
      - id: grace_period_passed_before_suspension
        applies_to: [homeplan_nonpayment_suspension]
        kind: time
        condition: "Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends."
        evidence_fields: [homeplan_billing_entries.billing_period_start, homeplan_billing_entries.homeplan_contract_id, homeplan_contracts.premium_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_billing_entries.homeplan_contract_id]
          action_bindings:
            homeplan_billing_entries.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment's due date
          anchor_source: homeplan_billing_entries.billing_period_start
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after the due date, and suspension applies from the first day after the grace period ends
          boundary: exclusive
      - id: cure_within_window_for_reinstatement
        applies_to: [homeplan_reinstatement]
        kind: time
        condition: "A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies."
        evidence_fields: [homeplan_contracts.suspended_date, homeplan_contracts.premium_balance, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: homeplan_contracts.suspended_date
          relation: not_after
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: the count starts the day after suspended_date and the boundary day itself qualifies
          boundary: inclusive
      - id: cure_window_lapsed_before_cancellation
        applies_to: [homeplan_nonpayment_cancellation]
        kind: time
        condition: "A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date."
        evidence_fields: [homeplan_contracts.suspended_date, homeplan_contracts.premium_balance, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: homeplan_contracts.suspended_date
          relation: not_before
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: counted from the day after suspended_date
          boundary: exclusive
    measures: [homeplan_msr_oldest_unpaid_due_date]

  - id: homeplan_renewal_terms
    subject: [homeplan_renewal_notice, homeplan_renewal_preference_change, homeplan_renewal, homeplan_expiration, homeplan_late_renewal]
    rule: >-
      Bridgewell issues one renewal notice per term stating the renewal tier, service call fee option and price.
      A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies.
      When auto_renew is false, or the renewal notice was not issued in time, the contract expires at the end of
      term_end_date unless the customer affirmatively asks to renew before then, in which case it renews on the
      terms stated for the renewal. The customer may turn auto_renew off or on at any time before term_end_date.
      A renewed term starts the day after the prior term_end_date and keeps continuous coverage with no new
      waiting period. A downgrade to a lower tier or a change of service call fee option takes effect only at
      renewal; items no longer covered after a downgrade stop being covered on the new term start date, and
      service requests opened before then are completed under the prior tier. Per-item caps, the aggregate limit
      and the refrigerant allowance restart with each new term.
      An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies.
      A late renewal starts a new full term on the late renewal date, and failures that began between the term end
      and the late renewal are not covered. After the late-renewal grace period an expired contract cannot be
      renewed and the customer must purchase a new contract with a new waiting period.
    eligibility:
      - id: renewal_notice_issued_in_time
        applies_to: [homeplan_renewal]
        kind: time
        condition: "A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies."
        evidence_fields: [homeplan_contracts.renewal_notice_date, homeplan_contracts.term_end_date, homeplan_contracts.auto_renew, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal notice for the expiring term was issued
          anchor_source: homeplan_contracts.renewal_notice_date
          relation: not_before
          duration_source: variants.renewal_notice_days
          unit: calendar_days
          counting_rule: counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies
          boundary: inclusive
      - id: late_renewal_within_grace
        applies_to: [homeplan_late_renewal]
        kind: time
        condition: "An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies."
        evidence_fields: [homeplan_contracts.term_end_date, homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its term end
          anchor_source: homeplan_contracts.term_end_date
          relation: not_after
          duration_source: variants.late_renewal_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after term_end_date and the boundary day itself qualifies
          boundary: inclusive

  - id: homeplan_plan_upgrade_rules
    subject: [homeplan_plan_upgrade, homeplan_premium_charge]
    rule: >-
      A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active.
      An upgrade moves to any higher-ranked tier; a move to a lower-ranked tier is a downgrade and is processed only
      at renewal under homeplan_renewal_terms. The upgrade takes effect on the date the customer requests it,
      records the tier held before it as prior_variant_name, and keeps the current term dates. For a monthly-billed
      contract, installments for billing periods starting on or after the upgrade date are billed at the new tier's
      monthly installment and no proration is billed. For an annual-billed contract, one upgrade_proration charge is
      billed on the upgrade date, equal to the new tier's annual premium minus the current tier's annual premium
      (each computed for this contract under homeplan_premium_pricing), multiplied by
      homeplan_msr_unexpired_term_days and divided by homeplan_msr_term_days, rounded to the cent; for this
      purpose the two day counts are taken as of the upgrade date. When to cover items and higher limits added
      by an upgrade is governed by homeplan_evt_coverage_determination.
    eligibility:
      - id: upgrade_allowed_on_open_contract
        applies_to: [homeplan_plan_upgrade]
        kind: state
        condition: "A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.variant_name, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [waiting_period, active]
    params:
      per_tier:
        Bridgewell ApplianceCare: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell SystemsCare: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Bronze: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Silver: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Gold: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
        Bridgewell HomeCare Platinum: {midterm_upgrade_allowed: "=midterm_upgrade_allowed"}
    measures: [homeplan_msr_unexpired_term_days, homeplan_msr_term_days]

  - id: homeplan_cancellation_and_refund
    subject: [homeplan_cancellation, homeplan_premium_credit, homeplan_premium_refund]
    rule: >-
      A cancellation starts when the customer gives notice: the agent records the notice on a cancellation
      request whose notice_date is the date the customer gives notice, and the customer then confirms it.
      A contract is cancelled only after the customer has confirmed the cancellation request on file.
      The cancellation is effective on notice_date and is never backdated before it. The cancellation credit is
      computed as of notice_date. The free-look period covers a notice given within free_look_days calendar days
      after start_date, counted from the day after start_date with the boundary day included
      (homeplan_msr_days_since_start), and applies only in the first term. Within the free-look period the credit
      is all premium paid for the current term (homeplan_msr_term_premium_paid) less the benefit Bridgewell has
      paid in the term (homeplan_msr_term_benefit_paid), and no admin fee applies. After the free-look period, an
      annual-billed contract is credited the unearned share of premium paid for the current term
      (homeplan_msr_term_premium_paid times homeplan_msr_unexpired_term_days divided by homeplan_msr_term_days,
      rounded to the cent), less cancellation_admin_fee, less homeplan_msr_term_benefit_paid; a monthly-billed
      contract is credited nothing for installments already billed, is charged no admin fee, and is billed no
      further installments. The credit is never negative: a result below zero is posted as a zero credit and the
      difference is not billed to the customer. Service call fees are never returned through a cancellation.
      A cancellation credit is posted only after the customer has confirmed the cancellation request on file.
      Only one cancellation credit and one refund are posted per cancellation request.
      The credit is first applied to unpaid premium for periods before notice_date, and any credit balance left
      is refunded to the original payment method within refund_processing_days calendar days after the
      cancellation is confirmed.
    eligibility:
      - id: cancellation_confirmed_by_customer
        applies_to: [homeplan_cancellation]
        kind: authorization
        condition: "A contract is cancelled only after the customer has confirmed the cancellation request on file."
        evidence_fields: [homeplan_cancellation_requests.request_status, homeplan_cancellation_requests.homeplan_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_cancellation_requests.homeplan_cancellation_request_id]
          action_bindings:
            homeplan_cancellation_requests.homeplan_cancellation_request_id: homeplan_cancellation_request_id
      - id: credit_after_confirmed_request
        applies_to: [homeplan_premium_credit]
        kind: authorization
        condition: "A cancellation credit is posted only after the customer has confirmed the cancellation request on file."
        evidence_fields: [homeplan_cancellation_requests.request_status, homeplan_cancellation_requests.homeplan_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_cancellation_requests.homeplan_cancellation_request_id]
          action_bindings:
            homeplan_cancellation_requests.homeplan_cancellation_request_id: homeplan_cancellation_request_id
      - id: one_credit_and_refund_per_request
        applies_to: [homeplan_premium_credit, homeplan_premium_refund]
        kind: dedup
        condition: "Only one cancellation credit and one refund are posted per cancellation request."
        evidence_fields: [homeplan_billing_entries.homeplan_cancellation_request_id, homeplan_billing_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_billing_entries.homeplan_cancellation_request_id]
          action_bindings:
            homeplan_billing_entries.homeplan_cancellation_request_id: homeplan_cancellation_request_id
        dedup_contract:
          table: homeplan_billing_entries
          mode: separate_record
          object_bindings: {homeplan_cancellation_request_id: homeplan_cancellation_request_id, event_type: event_type}
          duplicate_filters: {event_type: [homeplan_premium_credit, homeplan_premium_refund]}
          distinct_fields: []
    formula:
      within_free_look: "homeplan_msr_days_since_start <= free_look_days and term_number == 1"
      prorata_credit: "round(homeplan_msr_term_premium_paid * homeplan_msr_unexpired_term_days / homeplan_msr_term_days, 2)"
      cancellation_credit: "max(0, homeplan_msr_term_premium_paid - homeplan_msr_term_benefit_paid) if within_free_look else (0 if billing_frequency == 'monthly' else max(0, prorata_credit - cancellation_admin_fee - homeplan_msr_term_benefit_paid))"
    measures: [homeplan_msr_days_since_start, homeplan_msr_term_premium_paid, homeplan_msr_unexpired_term_days, homeplan_msr_term_days, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_service_request_and_fees
    subject: [homeplan_service_request, homeplan_service_fee_charge, homeplan_service_fee_refund]
    rule: >-
      A service request covers one failed item serviced by one trade; a failure that needs two trades is placed as
      two requests, each carrying its own fee.
      Service requests are accepted only while the contract status is active.
      A new_failure request is charged the contract's service_call_fee once.
      A recall request is charged no fee when it concerns the same covered item as an earlier authorization on the contract and is placed no later than repair_guarantee_days calendar days after that earlier repair is completed (replacement_labor_guarantee_days for a Bridgewell-provided replacement); the count starts the day after the completion date and the boundary day itself qualifies.
      A return visit placed after that window is a new_failure request and carries the fee. A second-opinion
      request may be placed only after an initial determination on the same item, and is charged the contract's
      service_call_fee multiplied by second_opinion_fee_rate and rounded to the cent; when that amount is zero no
      fee is posted. A routine request for which the customer asks for an after-hours visit is also charged
      after_hours_non_emergency_surcharge; emergency requests never carry the surcharge, and nothing is posted when
      the tier's surcharge is zero. A request is an emergency when the failure leaves the home without heat while
      the outdoor temperature is below no_heat_outdoor_temp_f, without cooling while it is above
      no_cooling_outdoor_temp_f, without running water, or without electrical power, or causes an active water
      leak that cannot be stopped at a fixture shutoff; every other request is routine.
      The fee of each fee type is charged at most once per service request.
      When fee_refund_before_dispatch is true and the customer cancels the request before any contractor dispatch is recorded for it, the fees collected on that request are refunded in full.
      Fees are not refunded because a failure is determined not covered, because the customer declines a covered
      repair or replacement, or because the customer accepts cash in lieu. A fee collected in error, such as a
      standard fee on a qualifying recall, is refunded with fee_refund_reason charged_in_error.
    eligibility:
      - id: requests_only_on_active_contract
        applies_to: [homeplan_service_request]
        kind: state
        condition: "Service requests are accepted only while the contract status is active."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [active]
      - id: recall_within_guarantee_window
        applies_to: [homeplan_service_fee_charge]
        kind: time
        condition: "A recall request is charged no fee when it concerns the same covered item as an earlier authorization on the contract and is placed no later than repair_guarantee_days calendar days after that earlier repair is completed (replacement_labor_guarantee_days for a Bridgewell-provided replacement); the count starts the day after the completion date and the boundary day itself qualifies."
        evidence_fields: [homeplan_claim_events.event_date, homeplan_claim_events.authorization_number, homeplan_claim_events.covered_item]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.authorization_number]
          action_bindings:
            homeplan_claim_events.authorization_number: prior_authorization_number
        temporal_basis:
          clock: frozen_time
          anchor_event: that earlier repair is completed
          anchor_source: homeplan_claim_events.event_date
          relation: not_after
          duration_source: variants.repair_guarantee_days
          unit: calendar_days
          counting_rule: the count starts the day after the completion date and the boundary day itself qualifies
          boundary: inclusive
      - id: one_fee_per_type_per_request
        applies_to: [homeplan_service_fee_charge]
        kind: dedup
        condition: "The fee of each fee type is charged at most once per service request."
        evidence_fields: [homeplan_billing_entries.homeplan_service_request_id, homeplan_billing_entries.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_billing_entries.homeplan_service_request_id, homeplan_billing_entries.fee_type]
          action_bindings:
            homeplan_billing_entries.homeplan_service_request_id: homeplan_service_request_id
            homeplan_billing_entries.fee_type: fee_type
        dedup_contract:
          table: homeplan_billing_entries
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id, fee_type: fee_type}
          duplicate_filters: {event_type: [homeplan_service_fee_charge]}
          distinct_fields: []
      - id: fee_refund_only_before_dispatch
        applies_to: [homeplan_service_fee_refund]
        kind: authorization
        condition: "When fee_refund_before_dispatch is true and the customer cancels the request before any contractor dispatch is recorded for it, the fees collected on that request are refunded in full."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
    params:
      no_heat_outdoor_temp_f: 40
      no_cooling_outdoor_temp_f: 90
      per_tier:
        Bridgewell ApplianceCare: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell SystemsCare: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Bronze: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Silver: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Gold: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell HomeCare Platinum: {second_opinion_fee_rate: "=second_opinion_fee_rate", after_hours_non_emergency_surcharge: "=after_hours_non_emergency_surcharge", repair_guarantee_days: "=repair_guarantee_days"}
    formula:
      standard_fee: "service_call_fee if request_type == 'new_failure' else 0"
      second_opinion_fee: "round(service_call_fee * second_opinion_fee_rate, 2) if request_type == 'second_opinion' else 0"
      after_hours_fee: "after_hours_non_emergency_surcharge if (urgency == 'routine' and service_window == 'after_hours') else 0"

  - id: homeplan_evt_contractor_dispatch
    subject: [homeplan_contractor_dispatch]
    rule: >-
      A contractor is dispatched only on a service request whose contract status is active.
      The request is assigned to a network contractor whose trade matches the request's trade and whose service
      ZIP codes include the property_zip; preferred contractors are chosen before standard ones, suspended
      contractors are never assigned, and an emergency request is assigned only to a contractor offering emergency
      service. Among equally ranked eligible contractors the one whose service contractor reference sorts first
      alphabetically is assigned. The assigned contractor must contact the customer within routine_contact_hours
      hours for a routine request or emergency_contact_hours hours for an emergency request, measured from the
      dispatch. When the assigned contractor misses the contact window, the request is re-dispatched to the next
      eligible contractor with dispatch_reason redispatch_missed_contact. When no eligible network contractor
      exists for the trade and ZIP code, or two consecutive assigned contractors miss the contact window,
      Bridgewell pre-authorizes the customer to use a licensed contractor of their choosing by recording an
      assignment with dispatch_reason out_of_network_authorized and no contractor reference. A second-opinion
      request is assigned to an eligible contractor other than the one that made the initial diagnosis, and a
      recall request is assigned to the contractor that performed the original work unless that contractor is now
      suspended, in which case it is assigned as an initial request. Each assignment on a request carries the next
      dispatch_sequence number, starting at 1.
    eligibility:
      - id: dispatch_only_on_active_contract
        applies_to: [homeplan_contractor_dispatch]
        kind: state
        condition: "A contractor is dispatched only on a service request whose contract status is active."
        evidence_fields: [homeplan_contracts.status, homeplan_contracts.homeplan_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.homeplan_contract_id]
          action_bindings:
            homeplan_contracts.homeplan_contract_id: homeplan_contract_id
        state_contract:
          field: homeplan_contracts.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell ApplianceCare: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell SystemsCare: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Bronze: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Silver: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Gold: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell HomeCare Platinum: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}

  - id: homeplan_evt_coverage_determination
    subject: [homeplan_coverage_determination]
    rule: >-
      A failure is covered only when every condition below holds; otherwise the determination is not_covered with
      the first failing reason in this order. (1) contract_not_in_force: the contract was active on the request
      date. (2) waiting_period: the failure was first reported on or after coverage_effective_date.
      For an item or a higher limit added by a mid-term upgrade, the failure must also be first reported at least upgrade_waiting_period_days calendar days after the upgrade takes effect; the count starts the day after last_plan_change_date and the boundary day itself qualifies.
      Until then such an item is determined under prior_variant_name, and an item that tier did not cover fails
      with waiting_period. (3) item_not_in_plan: the tier's cap for the covered item is greater than 0.00.
      (4) preexisting_condition: the failure did not arise from a condition that existed before
      coverage_effective_date; known or visually detectable pre-existing conditions are never covered, and
      unknown, undetectable pre-existing conditions are covered only when the tier's unknown_preexisting_covered is
      true. (5) improper_installation: a failure caused by improper prior installation, prior repair or a code
      violation in the original installation is covered only when improper_installation_covered is true.
      (6) misuse_or_external_damage: failures from misuse, abuse, pests, weather, fire, flood or other external
      causes are never covered. (7) cosmetic_only: defects that do not affect operation are never covered.
      (8) cap_exhausted: the remaining item benefit and the remaining aggregate benefit under
      homeplan_evt_benefit_caps are both above zero. Conditions (1) to (3) and (8) are decided from the contract,
      request and payment records and may be determined without a dispatch; conditions (4) to (7) are decided
      from the dispatched contractor's diagnosis.
      An initial determination is issued once per service request.
      After a second opinion, one review determination is issued on the original request; the review outcome
      replaces the initial outcome and any authorization follows the review outcome.
    eligibility:
      - id: one_determination_per_stage
        applies_to: [homeplan_coverage_determination]
        kind: dedup
        condition: "An initial determination is issued once per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.determination_stage]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.determination_stage]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
            homeplan_claim_events.determination_stage: determination_stage
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id, determination_stage: determination_stage}
          duplicate_filters: {event_type: [homeplan_coverage_determination]}
          distinct_fields: []
      - id: upgrade_items_waiting_period
        applies_to: [homeplan_coverage_determination]
        kind: time
        condition: "For an item or a higher limit added by a mid-term upgrade, the failure must also be first reported at least upgrade_waiting_period_days calendar days after the upgrade takes effect; the count starts the day after last_plan_change_date and the boundary day itself qualifies."
        evidence_fields: [homeplan_contracts.last_plan_change_date, homeplan_contracts.prior_variant_name, homeplan_service_requests.request_date, homeplan_service_requests.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_service_requests.homeplan_service_request_id]
          action_bindings:
            homeplan_service_requests.homeplan_service_request_id: homeplan_service_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the upgrade takes effect
          anchor_source: homeplan_contracts.last_plan_change_date
          relation: not_before
          duration_source: variants.upgrade_waiting_period_days
          unit: calendar_days
          counting_rule: the count starts the day after last_plan_change_date and the boundary day itself qualifies
          boundary: inclusive
    params:
      per_tier:
        Bridgewell ApplianceCare: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell SystemsCare: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Bronze: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Silver: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Gold: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
        Bridgewell HomeCare Platinum: {unknown_preexisting_covered: "=unknown_preexisting_covered", improper_installation_covered: "=improper_installation_covered"}
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_repair_or_replace
    subject: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_authorization_reversal, homeplan_work_completion]
    rule: >-
      Repair or replacement is authorized only after a covered determination is on file for the service request.
      Bridgewell, not the customer, chooses between repair and replacement. Bridgewell replaces the item when the
      contractor's repair_estimate is at or above repair_to_replace_threshold_rate times replacement_cost
      (replacement_basis repair_cost_threshold), when the parts needed cannot be obtained within
      parts_lead_time_replace_days calendar days (parts_unavailable), or when the contractor certifies the item
      cannot be repaired (not_repairable); otherwise it repairs. A replacement is a unit of similar features,
      capacity and efficiency, not of identical brand, color or dimensions, and where current efficiency
      standards require a different unit the standard-compliant unit is provided. The amount Bridgewell pays on an
      authorization is the lowest of the cost of the chosen work (repair_estimate for a repair, replacement_cost for
      a replacement), the remaining item benefit and the remaining aggregate benefit under
      homeplan_evt_benefit_caps. When the cost exceeds the amount paid, the customer may pay the difference to the
      contractor to have the work done, or decline the work. A customer who wants an upgraded model pays the
      difference between the like unit and the upgraded unit directly to the contractor.
      Only one repair or replacement authorization is open per service request; a new authorization on the same request requires reversing the earlier one first.
      An authorization is reversed in full, never in part, when the customer declines the work
      (customer_declined_work), when cash in lieu replaces it (cash_in_lieu_elected), or when it duplicated
      another authorization (duplicate_authorization); a completed authorization is never reversed. The
      contractor's completion report closes the authorization and starts the repair guarantee or the replacement
      labor guarantee.
    eligibility:
      - id: covered_determination_on_file
        applies_to: [homeplan_repair_authorization, homeplan_replacement_authorization]
        kind: authorization
        condition: "Repair or replacement is authorized only after a covered determination is on file for the service request."
        evidence_fields: [homeplan_claim_events.determination_outcome, homeplan_claim_events.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
      - id: one_open_authorization_per_request
        applies_to: [homeplan_repair_authorization, homeplan_replacement_authorization]
        kind: dedup
        condition: "Only one repair or replacement authorization is open per service request; a new authorization on the same request requires reversing the earlier one first."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type, homeplan_claim_events.reversed_authorization_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id}
          duplicate_filters: {event_type: [homeplan_repair_authorization, homeplan_replacement_authorization]}
          distinct_fields: [authorization_number]
    params:
      per_tier:
        Bridgewell ApplianceCare: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell SystemsCare: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Bronze: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Silver: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Gold: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
        Bridgewell HomeCare Platinum: {repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days"}
    formula:
      replace_by_cost: "repair_estimate >= repair_to_replace_threshold_rate * replacement_cost"
      repair_amount: "min(repair_estimate, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid)"
      replacement_amount: "min(replacement_cost, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid)"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_benefit_caps
    subject: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement]
    rule: >-
      Each covered item has a per-term cap equal to the tier parameter that item_cap maps it to; the cap is shared by
      every repair, replacement, cash-in-lieu settlement and out-of-network reimbursement for that item in the term,
      counted by homeplan_msr_item_benefit_paid_term. Every payment on the contract, supplemental allowances
      included, counts toward aggregate_term_limit, counted by homeplan_msr_term_benefit_paid. A payment counts in
      the term in which its service request's request_date falls, even when authorized after a renewal. The cap
      that applies is the one of the tier under which the request is determined; when an upgrade raised an item's
      cap, payments made before the upgrade in the same term still count against it. A reversed authorization stops
      counting from its reversal. The remaining item benefit is the item cap less
      homeplan_msr_item_benefit_paid_term and the remaining aggregate benefit is aggregate_term_limit less
      homeplan_msr_term_benefit_paid, each floored at zero; when either is zero, nothing further is paid for that
      item in the term. Supplemental allowances count toward the aggregate limit but not toward any item cap.
      Service call fees never count toward any cap and never reduce one.
    eligibility: []
    params:
      item_cap:
        heating_system: heating_system_cap
        cooling_system: cooling_system_cap
        ductwork: ductwork_cap
        plumbing_leak: plumbing_leak_cap
        plumbing_stoppage: plumbing_stoppage_cap
        water_heater: water_heater_cap
        electrical: electrical_cap
        ceiling_fan: ceiling_fan_cap
        garbage_disposal: garbage_disposal_cap
        whirlpool_tub: whirlpool_tub_cap
        refrigerator: refrigerator_cap
        oven_range_cooktop: oven_range_cooktop_cap
        dishwasher: dishwasher_cap
        built_in_microwave: built_in_microwave_cap
        clothes_washer: clothes_washer_cap
        clothes_dryer: clothes_dryer_cap
        garage_door_opener: garage_door_opener_cap
      per_tier:
        Bridgewell ApplianceCare: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell SystemsCare: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Bronze: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Silver: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Gold: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
        Bridgewell HomeCare Platinum: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", refrigerator_cap: "=refrigerator_cap"}
    formula:
      item_remaining: "max(0, item_cap - homeplan_msr_item_benefit_paid_term)"
      aggregate_remaining: "max(0, aggregate_term_limit - homeplan_msr_term_benefit_paid)"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_supplemental_allowances
    subject: [homeplan_supplemental_allowance]
    rule: >-
      Supplemental allowances are paid only on a service request with a repair or replacement authorization that has not been reversed.
      code_violation pays toward correcting a code violation that must be corrected to complete the covered work,
      up to code_violation_allowance. permit pays toward permits the covered work requires, up to
      permit_fee_allowance. haul_away pays toward removing and disposing of equipment Bridgewell replaced, up to
      haul_away_allowance, and only on a replacement authorization. refrigerant pays toward refrigerant recovery
      and recharge on a covered cooling_system repair or replacement, up to refrigerant_allowance per term across
      all requests on the contract, less homeplan_msr_term_refrigerant_paid. crane_access pays toward crane or
      lift access to rooftop equipment, up to crane_access_allowance. slab_access pays toward opening and closing a
      concrete slab to reach a covered plumbing_leak, up to slab_leak_access_allowance. Each allowance pays the
      lowest of the documented invoice_amount, the allowance limit and the remaining aggregate benefit, and a tier
      whose allowance is 0.00 pays nothing for that type.
      Each allowance type is paid at most once per service request.
      Allowances are never paid on a cash-in-lieu settlement or an out-of-network reimbursement, because Bridgewell
      performs no installation there.
    eligibility:
      - id: live_authorization_on_request
        applies_to: [homeplan_supplemental_allowance]
        kind: authorization
        condition: "Supplemental allowances are paid only on a service request with a repair or replacement authorization that has not been reversed."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.authorization_number, homeplan_claim_events.reversed_authorization_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
      - id: one_allowance_per_type_per_request
        applies_to: [homeplan_supplemental_allowance]
        kind: dedup
        condition: "Each allowance type is paid at most once per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.allowance_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.allowance_type]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
            homeplan_claim_events.allowance_type: allowance_type
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id, allowance_type: allowance_type}
          duplicate_filters: {event_type: [homeplan_supplemental_allowance]}
          distinct_fields: []
    params:
      allowance_limit:
        code_violation: code_violation_allowance
        permit: permit_fee_allowance
        haul_away: haul_away_allowance
        refrigerant: refrigerant_allowance
        crane_access: crane_access_allowance
        slab_access: slab_leak_access_allowance
      per_tier:
        Bridgewell ApplianceCare: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell SystemsCare: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Bronze: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Silver: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Gold: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
        Bridgewell HomeCare Platinum: {code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", crane_access_allowance: "=crane_access_allowance", slab_leak_access_allowance: "=slab_leak_access_allowance"}
    formula:
      allowance_paid: "max(0, min(invoice_amount, allowance_limit, aggregate_term_limit - homeplan_msr_term_benefit_paid))"
      refrigerant_paid: "max(0, min(invoice_amount, refrigerant_allowance - homeplan_msr_term_refrigerant_paid, aggregate_term_limit - homeplan_msr_term_benefit_paid))"
    measures: [homeplan_msr_term_refrigerant_paid, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_cash_in_lieu
    subject: [homeplan_cash_in_lieu_offer, homeplan_cash_in_lieu_payment]
    rule: >-
      Bridgewell offers cash in lieu with settlement_basis company_elected instead of providing a replacement when a
      replacement is warranted under homeplan_evt_repair_or_replace but a like unit cannot be sourced or installed
      through the network. A customer who holds a replacement authorization that is not yet completed may ask for
      cash instead, with settlement_basis customer_elected. The offer amount is Bridgewell's contracted
      replacement_cost for the like unit, limited to the remaining item benefit and the remaining aggregate benefit
      (for a customer_elected offer, computed as if the replacement authorization it replaces had already been
      reversed), and rounded to the cent; supplemental allowances and service call fees are never added.
      offer_expiration_date is cash_in_lieu_offer_validity_days calendar days after the offer date.
      Cash in lieu is paid only when the customer accepts an offer on file no later than cash_in_lieu_offer_validity_days calendar days after the offer is issued; the count starts the day after the offer date and the boundary day itself qualifies.
      Accepting is the customer's own decision and is recorded by the customer. The payment equals the accepted
      offer amount and carries the offer's settlement_basis; a customer_elected payment names the replacement
      authorization it replaces, which is reversed in full the same day. Payment is issued within
      cash_in_lieu_payment_days calendar days after acceptance. An expired offer cannot be accepted, and the agent
      may issue a new offer at the then-current contracted replacement cost.
      Cash in lieu is paid at most once per service request.
      Once cash in lieu is paid on a request, no repair or replacement is authorized on it.
    eligibility:
      - id: offer_accepted_within_validity
        applies_to: [homeplan_cash_in_lieu_payment]
        kind: time
        condition: "Cash in lieu is paid only when the customer accepts an offer on file no later than cash_in_lieu_offer_validity_days calendar days after the offer is issued; the count starts the day after the offer date and the boundary day itself qualifies."
        evidence_fields: [homeplan_claim_events.event_date, homeplan_claim_events.offer_expiration_date, homeplan_claim_events.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the offer is issued
          anchor_source: homeplan_claim_events.event_date
          relation: not_after
          duration_source: variants.cash_in_lieu_offer_validity_days
          unit: calendar_days
          counting_rule: the count starts the day after the offer date and the boundary day itself qualifies
          boundary: inclusive
      - id: one_cash_settlement_per_request
        applies_to: [homeplan_cash_in_lieu_payment]
        kind: dedup
        condition: "Cash in lieu is paid at most once per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id}
          duplicate_filters: {event_type: [homeplan_cash_in_lieu_payment]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell ApplianceCare: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell SystemsCare: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Bronze: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Silver: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Gold: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
        Bridgewell HomeCare Platinum: {cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", aggregate_term_limit: "=aggregate_term_limit"}
    formula:
      cash_offer: "round(max(0, min(replacement_cost, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid)), 2)"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

  - id: homeplan_evt_out_of_network
    subject: [homeplan_out_of_network_reimbursement]
    rule: >-
      An out-of-network reimbursement is paid only when an assignment with dispatch_reason out_of_network_authorized and a covered determination are both on file for the service request.
      The reimbursement is the lowest of the licensed contractor's invoice_amount, out_of_network_reimbursement_cap,
      the remaining item benefit and the remaining aggregate benefit; the service call fee collected on the request
      is not refunded. Work by an unlicensed contractor or by the customer, and work performed before the
      out-of-network authorization date, is not reimbursed.
      One out-of-network reimbursement is paid per service request.
    eligibility:
      - id: out_of_network_preauthorized
        applies_to: [homeplan_out_of_network_reimbursement]
        kind: authorization
        condition: "An out-of-network reimbursement is paid only when an assignment with dispatch_reason out_of_network_authorized and a covered determination are both on file for the service request."
        evidence_fields: [homeplan_claim_events.dispatch_reason, homeplan_claim_events.determination_outcome, homeplan_claim_events.homeplan_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
      - id: one_reimbursement_per_request
        applies_to: [homeplan_out_of_network_reimbursement]
        kind: dedup
        condition: "One out-of-network reimbursement is paid per service request."
        evidence_fields: [homeplan_claim_events.homeplan_service_request_id, homeplan_claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_claim_events.homeplan_service_request_id]
          action_bindings:
            homeplan_claim_events.homeplan_service_request_id: homeplan_service_request_id
        dedup_contract:
          table: homeplan_claim_events
          mode: separate_record
          object_bindings: {homeplan_service_request_id: homeplan_service_request_id}
          duplicate_filters: {event_type: [homeplan_out_of_network_reimbursement]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell ApplianceCare: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell SystemsCare: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Bronze: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Silver: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Gold: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
        Bridgewell HomeCare Platinum: {out_of_network_reimbursement_cap: "=out_of_network_reimbursement_cap"}
    formula:
      reimbursement: "max(0, min(invoice_amount, out_of_network_reimbursement_cap, item_cap - homeplan_msr_item_benefit_paid_term, aggregate_term_limit - homeplan_msr_term_benefit_paid))"
    measures: [homeplan_msr_item_benefit_paid_term, homeplan_msr_term_benefit_paid]

extended_policies:
  - id: homeplan_ext_stalled_repair_replacement
    base_policy_refs: [homeplan_evt_repair_or_replace, homeplan_evt_benefit_caps]
    overwrite:
      - base_policy: homeplan_evt_repair_or_replace
        superseded_clause: >-
          The amount Bridgewell pays on an authorization is the lowest of the cost of the chosen work
          (repair_estimate for a repair, replacement_cost for a replacement), the remaining item benefit and
          the remaining aggregate benefit under homeplan_evt_benefit_caps.
        replaced_by: >-
          For a replacement authorized after a stalled repair, and only for such a replacement, the amount
          Bridgewell pays is the lowest of the stalled-repair replacement cost, the remaining item benefit
          and the remaining aggregate benefit; every other repair or replacement authorization remains under
          the base rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          A payment counts in the term in which its service request's request_date falls, even when
          authorized after a renewal.
        replaced_by: >-
          For a replacement authorized after a stalled repair, and only for such a replacement, the item cap
          and aggregate_term_limit are measured against the payments dated within the twelve months before
          today; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          the cap is shared by every repair, replacement, cash-in-lieu settlement and out-of-network
          reimbursement for that item in the term, counted by homeplan_msr_item_benefit_paid_term
        replaced_by: >-
          For a replacement authorized after a stalled repair, and only for such a replacement, the item cap
          is still shared by every repair, replacement, cash-in-lieu settlement and out-of-network
          reimbursement for that item, counted over the payments dated within the twelve months before today
          rather than over the term; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          Every payment on the contract, supplemental allowances included, counts toward
          aggregate_term_limit, counted by homeplan_msr_term_benefit_paid.
        replaced_by: >-
          For a replacement authorized after a stalled repair, and only for such a replacement, every
          payment on the contract, supplemental allowances included, still counts toward
          aggregate_term_limit, counted over the payments dated within the twelve months before today rather
          than over the term; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          The remaining item benefit is the item cap less homeplan_msr_item_benefit_paid_term and the
          remaining aggregate benefit is aggregate_term_limit less homeplan_msr_term_benefit_paid, each
          floored at zero
        replaced_by: >-
          For a replacement authorized after a stalled repair, and only for such a replacement, the
          remaining item benefit is still the item cap less the payments counted toward that item and the
          remaining aggregate benefit is still aggregate_term_limit less the payments counted toward it,
          each floored at zero, with both counted over the payments dated within the twelve months before
          today; every other payment remains measured by the base term rule.
    trigger: state_due
    subject: [homeplan_replacement_authorization]
    computes: amount
    target_tool: authorize_stalled_repair_replacement_b6f80e12
    params:
      escalation_long_days: 60
      escalation_short_days: 30
      escalation_rate_long: 0.04
      escalation_rate_short: 0.02
      daily_stall_credit: 5.00
      fast_service_contact_hours: 24
      missed_contact_credit_repeat: 150.00
      missed_contact_credit_one: 75.00
      appliance_line_connection: 65.00
      inlet_hose_connection: 40.00
      carry_in_heavy: 60.00
      carry_in_other: 25.00
      after_hours_install_absorbed: 90.00
      after_hours_install_shared: 45.00
    rule: >-
      A repair authorization stalls when it stands more than parts_lead_time_replace_days calendar days after
      its authorization date without a completion report; when the customer then declines the stalled repair and
      it is reversed, the parts are treated as not obtainable within parts_lead_time_replace_days, and
      Bridgewell replaces the item by issuing a replacement authorization on the same request with
      replacement_basis parts_unavailable, carrying the covered item and the repair_estimate recorded on the
      reversed repair authorization, recording as its replacement_cost the re-priced like-unit cost described
      below and as its amount the stalled-repair replacement payment. The stalled-repair replacement payment is
      worked out from the service request whose repair authorization was most recently reversed because the
      customer declined the work. The re-priced like-unit cost is the replacement_cost recorded on that
      request's repair authorization, and the stalled-repair replacement cost is the re-priced like-unit cost.
      The remaining item benefit is the tier's cap for the covered item less the payments on that item counted
      toward the remaining benefits, floored at zero, and the remaining aggregate benefit is
      aggregate_term_limit less every payment on the contract counted toward them, floored at zero. A payment
      counts toward the remaining benefits when its event date falls within the twelve months before today, that
      is after the same calendar day twelve months earlier, whatever term its request fell in; repair,
      replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count
      toward the aggregate only, and a reversal takes its authorization's amount back out of both counts. The
      stalled-repair replacement payment is the lowest of the stalled-repair replacement cost, the remaining
      item benefit and the remaining aggregate benefit, never below zero, rounded to the cent once at the end.
      For a replacement authorized after a stalled repair, and only for such a replacement, the amount
      Bridgewell pays is the lowest of the stalled-repair replacement cost, the remaining item benefit and the
      remaining aggregate benefit; every other repair or replacement authorization remains under the base rule.
      For a replacement authorized after a stalled repair, and only for such a replacement, the item cap and
      aggregate_term_limit are measured against the payments dated within the twelve months before today; every
      other payment remains measured by the base term rule. For a replacement authorized after a stalled repair,
      and only for such a replacement, the remaining item benefit is still the item cap less the payments
      counted toward that item and the remaining aggregate benefit is still aggregate_term_limit less the
      payments counted toward it, each floored at zero, with both counted over the payments dated within the
      twelve months before today; every other payment remains measured by the base term rule. For a replacement
      authorized after a stalled repair, and only for such a replacement, every payment on the contract,
      supplemental allowances included, still counts toward aggregate_term_limit, counted over the payments
      dated within the twelve months before today rather than over the term; every other payment remains
      measured by the base term rule. For a replacement authorized after a stalled repair, and only for such a
      replacement, the item cap is still shared by every repair, replacement, cash-in-lieu settlement and
      out-of-network reimbursement for that item, counted over the payments dated within the twelve months
      before today rather than over the term; every other payment remains measured by the base term rule. The
      recorded replacement_cost becomes the re-priced like-unit cost by multiplying it by one plus the
      price-list escalation rate and rounding to the cent, and the price-list escalation rate depends on the
      calendar days from the stalled repair authorization's date to today: escalation_rate_long when more than
      escalation_long_days days have passed, escalation_rate_short when more than escalation_short_days but no
      more than escalation_long_days days have passed, and no escalation when escalation_short_days days or
      fewer have passed. A water-line connection charge, a stall credit, a missed-contact credit, a carry-in
      charge and an after-hours installation charge are added to the stalled-repair replacement cost as flat
      dollar amounts, never compounded, and the cost so obtained is compared with the two remaining benefits
      without being rounded first. The water-line connection charge pays for the water hook-ups that the
      contracted like-unit cost (equipment plus standard installation) leaves out: appliance_line_connection for
      a refrigerator, whose ice-maker and dispenser supply line is an add-on hook-up beyond standard
      installation, inlet_hose_connection for a dishwasher or clothes_washer, whose supply and drain hoses are
      replaced with the unit, and nothing for a water_heater or any other item, whose connections are part of
      the contracted installation. The stall credit is daily_stall_credit for each stall day, rounded to the
      cent, and the stall days are counted by the kind of request: for an emergency request, the calendar days
      after the request date up to and including the reversal date; for a routine request on a tier whose
      routine_contact_hours is fast_service_contact_hours or fewer, the calendar days after the repair
      authorization date up to and including the reversal date; for any other routine request, no stall days are
      counted. The missed-contact credit is missed_contact_credit_repeat when an assignment on the stalled
      request carries dispatch_reason redispatch_missed_contact and, within the twelve months before today, the
      household has already met another missed contact window, counting first an assignment re-dispatched for
      that reason on another of its homeowner-contract requests and then one on a request under a Bridgewell
      coverage rider the customer holds, so that the stalled request's miss is a repeat failure of Bridgewell's
      network for that household; missed_contact_credit_one when an assignment on the stalled request carries
      that dispatch_reason and no such earlier re-dispatch exists in that time; and nothing when no assignment
      on the stalled request carries that dispatch_reason. The carry-in charge pays for carrying the replacement
      into an attached dwelling: carry_in_heavy when the property is a townhome or condominium and the item is a
      refrigerator, clothes_washer or clothes_dryer, carry_in_other when the property is a townhome or
      condominium and the item is any other item, and nothing when the property is a single-family or mobile
      home. The after-hours installation charge pays the contractor's premium for installing in the visit window
      the customer asked for: after_hours_install_absorbed when the stalled request asked for an after-hours
      visit and the tier's after_hours_non_emergency_surcharge is zero, so that the customer paid no surcharge,
      after_hours_install_shared when it asked for an after-hours visit and the tier's surcharge is above zero,
      and nothing when it asked for a business-hours visit.
    prerequisite: []
    cross_category:
      - category: addon
        as: history
        reads: [addon_claim_events.event_type, addon_claim_events.dispatch_reason, addon_claim_events.event_date]
        note: The missed-contact credit's repeat tier is decided from the re-dispatches after a missed contact window recorded on the customer's coverage rider requests in the twelve months before today.
    inputs:
      history:
        - {table: homeplan_claim_events, aggregate: latest, field: replacement_cost, filters: {event_type: homeplan_repair_authorization}}
        - {table: homeplan_claim_events, aggregate: count, field: homeplan_claim_event_id, filters: {event_type: homeplan_contractor_dispatch, dispatch_reason: redispatch_missed_contact}}
        - {table: homeplan_service_requests, aggregate: latest, field: service_window, filters: {}}
        - {table: homeplan_claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement, homeplan_authorization_reversal]}}
      cross_category: [addon]
    compute:
      - stalled_request: "LATEST('homeplan_claim_events', 'homeplan_service_request_id', event_type='homeplan_authorization_reversal', reversal_reason='customer_declined_work')"
      - stalled_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_repair_authorization', homeplan_service_request_id=stalled_request)"
      - recorded_cost: "LATEST('homeplan_claim_events', 'replacement_cost', event_type='homeplan_repair_authorization', homeplan_service_request_id=stalled_request)"
      - repair_auth_date: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_repair_authorization', homeplan_service_request_id=stalled_request)"
      - reversal_date: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_authorization_reversal', homeplan_service_request_id=stalled_request)"
      - cost_age_days: "DAYS(repair_auth_date, NOW)"
      - escalation_rate: "K('escalation_rate_long') if cost_age_days > K('escalation_long_days') else (K('escalation_rate_short') if cost_age_days > K('escalation_short_days') else 0.0)"
      - repriced_cost: "RND(recorded_cost * (1 + escalation_rate), 2)"
      - connection_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_repair_authorization', homeplan_service_request_id=stalled_request)"
      - line_connection_charge: "K('appliance_line_connection') if connection_item == 'refrigerator' else (K('inlet_hose_connection') if (connection_item == 'dishwasher' or connection_item == 'clothes_washer') else 0.0)"
      - request_date: "LATEST('homeplan_service_requests', 'request_date', date_field='request_date', homeplan_service_request_id=stalled_request)"
      - request_urgency: "LATEST('homeplan_service_requests', 'urgency', date_field='request_date', homeplan_service_request_id=stalled_request)"
      - stall_days: "DAYS(request_date, reversal_date) if request_urgency == 'emergency' else (DAYS(repair_auth_date, reversal_date) if P('routine_contact_hours') <= K('fast_service_contact_hours') else 0)"
      - stall_credit: "RND(stall_days * K('daily_stall_credit'), 2)"
      - missed_contacts: "COUNT('homeplan_claim_events', event_type='homeplan_contractor_dispatch', dispatch_reason='redispatch_missed_contact', homeplan_service_request_id=stalled_request)"
      - household_misses: "COUNT('homeplan_claim_events', within_months=12, event_type='homeplan_contractor_dispatch', dispatch_reason='redispatch_missed_contact') - COUNT('homeplan_claim_events', within_months=12, event_type='homeplan_contractor_dispatch', dispatch_reason='redispatch_missed_contact', homeplan_service_request_id=stalled_request)"
      - rider_misses: "XCOUNT('addon', 'addon_claim_events', within_months=12, event_type='addon_contractor_dispatch', dispatch_reason='redispatch_missed_contact')"
      - missed_contact_credit: "K('missed_contact_credit_repeat') if (missed_contacts >= 1 and (household_misses >= 1 or rider_misses >= 1)) else (K('missed_contact_credit_one') if (missed_contacts >= 1 and household_misses == 0 and rider_misses == 0) else 0.0)"
      - carry_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_authorization_reversal', homeplan_service_request_id=stalled_request)"
      - carry_in_charge: "K('carry_in_heavy') if ((F('property_type') == 'townhome' or F('property_type') == 'condominium') and (carry_item == 'refrigerator' or carry_item == 'clothes_washer' or carry_item == 'clothes_dryer')) else (K('carry_in_other') if ((F('property_type') == 'townhome' or F('property_type') == 'condominium') and not (carry_item == 'refrigerator' or carry_item == 'clothes_washer' or carry_item == 'clothes_dryer')) else 0.0)"
      - install_window: "LATEST('homeplan_service_requests', 'service_window', date_field='request_date', homeplan_service_request_id=stalled_request)"
      - after_hours_install_charge: "K('after_hours_install_absorbed') if (install_window == 'after_hours' and P('after_hours_non_emergency_surcharge') == 0) else (K('after_hours_install_shared') if (install_window == 'after_hours' and P('after_hours_non_emergency_surcharge') > 0) else 0.0)"
      - cost_basis: "repriced_cost + line_connection_charge + stall_credit + missed_contact_credit + carry_in_charge + after_hours_install_charge"
      - item_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization', covered_item=stalled_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization', covered_item=stalled_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment', covered_item=stalled_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement', covered_item=stalled_item) - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal', covered_item=stalled_item)"
      - item_remaining: "MX(0, P(stalled_item + '_cap') - item_paid)"
      - aggregate_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_supplemental_allowance') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement') - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal')"
      - aggregate_remaining: "MX(0, P('aggregate_term_limit') - aggregate_paid)"
      - result: "RND(MX(0, MN(cost_basis, item_remaining, aggregate_remaining)), 2)"
    compute_basis:
      stalled_request: "The stalled-repair replacement payment is worked out from the service request whose repair authorization was most recently reversed because the customer declined the work."
      stalled_item: "carrying the covered item and the repair_estimate recorded on the reversed repair authorization"
      recorded_cost: "The re-priced like-unit cost is the replacement_cost recorded on that request's repair authorization"
      repair_auth_date: "the price-list escalation rate depends on the calendar days from the stalled repair authorization's date to today"
      reversal_date: "the calendar days after the repair authorization date up to and including the reversal date"
      cost_age_days: "the price-list escalation rate depends on the calendar days from the stalled repair authorization's date to today"
      escalation_rate: "escalation_rate_long when more than escalation_long_days days have passed, escalation_rate_short when more than escalation_short_days but no more than escalation_long_days days have passed, and no escalation when escalation_short_days days or fewer have passed."
      repriced_cost: "The recorded replacement_cost becomes the re-priced like-unit cost by multiplying it by one plus the price-list escalation rate and rounding to the cent"
      connection_item: "The water-line connection charge pays for the water hook-ups that the contracted like-unit cost (equipment plus standard installation) leaves out"
      line_connection_charge: "appliance_line_connection for a refrigerator, whose ice-maker and dispenser supply line is an add-on hook-up beyond standard installation, inlet_hose_connection for a dishwasher or clothes_washer, whose supply and drain hoses are replaced with the unit, and nothing for a water_heater or any other item, whose connections are part of the contracted installation."
      request_date: "for an emergency request, the calendar days after the request date up to and including the reversal date"
      request_urgency: "the stall days are counted by the kind of request"
      stall_days: "for an emergency request, the calendar days after the request date up to and including the reversal date; for a routine request on a tier whose routine_contact_hours is fast_service_contact_hours or fewer, the calendar days after the repair authorization date up to and including the reversal date; for any other routine request, no stall days are counted."
      stall_credit: "The stall credit is daily_stall_credit for each stall day, rounded to the cent"
      missed_contacts: "when an assignment on the stalled request carries dispatch_reason redispatch_missed_contact"
      household_misses: "counting first an assignment re-dispatched for that reason on another of its homeowner-contract requests"
      rider_misses: "and then one on a request under a Bridgewell coverage rider the customer holds"
      missed_contact_credit: "The missed-contact credit is missed_contact_credit_repeat when an assignment on the stalled request carries dispatch_reason redispatch_missed_contact and, within the twelve months before today, the household has already met another missed contact window, counting first an assignment re-dispatched for that reason on another of its homeowner-contract requests and then one on a request under a Bridgewell coverage rider the customer holds, so that the stalled request's miss is a repeat failure of Bridgewell's network for that household; missed_contact_credit_one when an assignment on the stalled request carries that dispatch_reason and no such earlier re-dispatch exists in that time; and nothing when no assignment on the stalled request carries that dispatch_reason."
      carry_item: "the item is a refrigerator, clothes_washer or clothes_dryer"
      carry_in_charge: "The carry-in charge pays for carrying the replacement into an attached dwelling: carry_in_heavy when the property is a townhome or condominium and the item is a refrigerator, clothes_washer or clothes_dryer, carry_in_other when the property is a townhome or condominium and the item is any other item, and nothing when the property is a single-family or mobile home."
      install_window: "when the stalled request asked for an after-hours visit"
      after_hours_install_charge: "after_hours_install_absorbed when the stalled request asked for an after-hours visit and the tier's after_hours_non_emergency_surcharge is zero, so that the customer paid no surcharge, after_hours_install_shared when it asked for an after-hours visit and the tier's surcharge is above zero, and nothing when it asked for a business-hours visit."
      cost_basis: "A water-line connection charge, a stall credit, a missed-contact credit, a carry-in charge and an after-hours installation charge are added to the stalled-repair replacement cost as flat dollar amounts, never compounded, and the cost so obtained is compared with the two remaining benefits without being rounded first."
      item_paid: "A payment counts toward the remaining benefits when its event date falls within the twelve months before today, that is after the same calendar day twelve months earlier, whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its authorization's amount back out of both counts."
      item_remaining: "The remaining item benefit is the tier's cap for the covered item less the payments on that item counted toward the remaining benefits, floored at zero"
      aggregate_paid: "A payment counts toward the remaining benefits when its event date falls within the twelve months before today, that is after the same calendar day twelve months earlier, whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its authorization's amount back out of both counts."
      aggregate_remaining: "the remaining aggregate benefit is aggregate_term_limit less every payment on the contract counted toward them, floored at zero."
      result: "The stalled-repair replacement payment is the lowest of the stalled-repair replacement cost, the remaining item benefit and the remaining aggregate benefit, never below zero, rounded to the cent once at the end."
    factors:
      - id: price_list_escalation
        effect: parameter
        decides: escalation_rate
        bindings: [cost_age_days, escalation_rate]
        ladder:
          - when: "more than escalation_long_days calendar days have passed from the stalled repair authorization's date to today"
            value: "K('escalation_rate_long')"
          - when: "more than escalation_short_days but no more than escalation_long_days calendar days have passed"
            value: "K('escalation_rate_short')"
          - when: "otherwise (escalation_short_days days or fewer have passed)"
            value: "0.0 (no escalation)"
        baseline:
          escalation_rate: "0.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: water_line_connection_ladder
        effect: parameter
        decides: line_connection_charge
        bindings: [connection_item, line_connection_charge]
        ladder:
          - when: "the item is a refrigerator, whose ice-maker and dispenser supply line is an add-on hook-up beyond standard installation"
            value: "K('appliance_line_connection')"
          - when: "the item is a dishwasher or clothes_washer, whose supply and drain hoses are replaced with the unit"
            value: "K('inlet_hose_connection')"
          - when: "otherwise (a water_heater or any other item, whose connections are part of the contracted installation)"
            value: "0.0"
        baseline:
          line_connection_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: stall_day_count_basis
        effect: method
        decides: stall_days
        bindings: [request_date, request_urgency, stall_days]
        ladder:
          - when: "the stalled request is an emergency request"
            method: "stall days are the calendar days after the request date up to and including the reversal date"
          - when: "the stalled request is a routine request on a tier whose routine_contact_hours is fast_service_contact_hours or fewer"
            method: "stall days are the calendar days after the repair authorization date up to and including the reversal date"
          - when: "otherwise (any other routine request)"
            method: "no stall days are counted"
        baseline:
          stall_days: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: missed_contact_ladder
        effect: parameter
        decides: missed_contact_credit
        bindings: [missed_contacts, household_misses, rider_misses, missed_contact_credit]
        ladder:
          - when: "an assignment on the stalled request carries dispatch_reason redispatch_missed_contact and, within the twelve months before today, an assignment on another of the household's homeowner-contract requests or on a request under a Bridgewell coverage rider the customer holds was re-dispatched for that reason"
            value: "K('missed_contact_credit_repeat')"
          - when: "an assignment on the stalled request carries that dispatch_reason and no such earlier re-dispatch exists in that time"
            value: "K('missed_contact_credit_one')"
          - when: "otherwise (no assignment on the stalled request carries that dispatch_reason)"
            value: "0.0"
        baseline:
          missed_contact_credit: "0.0"
        evidence: [history, cross_category]
        cross_difficulty: addon
      - id: attached_dwelling_carry_in
        effect: parameter
        decides: carry_in_charge
        bindings: [carry_item, carry_in_charge]
        ladder:
          - when: "the property is a townhome or condominium and the item is a refrigerator, clothes_washer or clothes_dryer"
            value: "K('carry_in_heavy')"
          - when: "the property is a townhome or condominium and the item is any other item"
            value: "K('carry_in_other')"
          - when: "otherwise (a single-family or mobile home)"
            value: "0.0"
        baseline:
          carry_in_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: install_window_premium
        effect: parameter
        decides: after_hours_install_charge
        bindings: [install_window, after_hours_install_charge]
        ladder:
          - when: "the stalled request asked for an after-hours visit and the tier's after_hours_non_emergency_surcharge is zero"
            value: "K('after_hours_install_absorbed')"
          - when: "the stalled request asked for an after-hours visit and the tier's surcharge is above zero"
            value: "K('after_hours_install_shared')"
          - when: "otherwise (a business-hours visit)"
            value: "0.0"
        baseline:
          after_hours_install_charge: "0.0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The stalled-repair replacement payment is worked out from the service request whose repair authorization was
        most recently reversed because the customer declined the work.
        The re-priced like-unit cost is the replacement_cost recorded on that request's repair authorization, and the
        stalled-repair replacement cost is the re-priced like-unit cost.
        The remaining item benefit is the tier's cap for the covered item less the payments on that item counted toward
        the remaining benefits, floored at zero, and the remaining aggregate benefit is aggregate_term_limit less every
        payment on the contract counted toward them, floored at zero.
        A payment counts toward the remaining benefits when its event date falls within the twelve months before today,
        that is after the same calendar day twelve months earlier, whatever term its request fell in; repair,
        replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count
        toward the aggregate only, and a reversal takes its authorization's amount back out of both counts.
        The stalled-repair replacement payment is the lowest of the stalled-repair replacement cost, the remaining item
        benefit and the remaining aggregate benefit, never below zero, rounded to the cent once at the end.
      params: [aggregate_term_limit]

  - id: homeplan_ext_customer_elected_cash
    base_policy_refs: [homeplan_evt_cash_in_lieu, homeplan_evt_benefit_caps, homeplan_evt_repair_or_replace, homeplan_evt_service_request_and_fees, homeplan_evt_supplemental_allowances]
    overwrite:
      - base_policy: homeplan_evt_cash_in_lieu
        superseded_clause: >-
          Cash in lieu is paid only when the customer accepts an offer on file no later than
          cash_in_lieu_offer_validity_days calendar days after the offer is issued; the count starts the day
          after the offer date and the boundary day itself qualifies.
        replaced_by: >-
          For a customer-elected settlement, and only for such a settlement, the cash is fixed and paid on
          the day the customer elects it, with no cash-in-lieu offer on file; every company-elected
          settlement remains under the base offer-and-acceptance rule.
      - base_policy: homeplan_evt_cash_in_lieu
        superseded_clause: >-
          The offer amount is Bridgewell's contracted replacement_cost for the like unit, limited to the
          remaining item benefit and the remaining aggregate benefit (for a customer_elected offer, computed
          as if the replacement authorization it replaces had already been reversed), and rounded to the
          cent; supplemental allowances and service call fees are never added.
        replaced_by: >-
          For a customer-elected settlement, and only for such a settlement, the cash paid is the
          customer-elected cash worked out below rather than an offer amount, still limited to the remaining
          item benefit and the remaining aggregate benefit counted as if the replaced authorization had
          already been reversed and still rounded to the cent, while the stall fee credit and the disposal
          addition this rule names are added to it; every company-elected settlement remains under the base
          rule.
      - base_policy: homeplan_evt_cash_in_lieu
        superseded_clause: >-
          The payment equals the accepted offer amount and carries the offer's settlement_basis
        replaced_by: >-
          For a customer-elected settlement, and only for such a settlement, the payment is the
          customer-elected cash worked out below, with no offer to accept, and it carries settlement_basis
          customer_elected; every company-elected settlement remains under the base rule.
      - base_policy: homeplan_evt_service_request_and_fees
        superseded_clause: >-
          Fees are not refunded because a failure is determined not covered, because the customer declines a
          covered repair or replacement, or because the customer accepts cash in lieu.
        replaced_by: >-
          For a customer-elected settlement on a request whose repair authorization stalled and was
          reversed, and only for such a settlement, the standard visit fee collected on that request is
          credited in the cash at the stall fee share described below, while fees are still not refunded
          because a failure is determined not covered or because the customer declines a covered repair or
          replacement; every other fee remains under the base fee rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          A payment counts in the term in which its service request's request_date falls, even when
          authorized after a renewal.
        replaced_by: >-
          For a customer-elected settlement, and only for such a settlement, the item cap and
          aggregate_term_limit are measured against the payments dated within the twelve months before
          today; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          the cap is shared by every repair, replacement, cash-in-lieu settlement and out-of-network
          reimbursement for that item in the term, counted by homeplan_msr_item_benefit_paid_term
        replaced_by: >-
          For a customer-elected settlement, and only for such a settlement, the item cap is still shared by
          every repair, replacement, cash-in-lieu settlement and out-of-network reimbursement for that item,
          counted over the payments dated within the twelve months before today rather than over the term;
          every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          Every payment on the contract, supplemental allowances included, counts toward
          aggregate_term_limit, counted by homeplan_msr_term_benefit_paid.
        replaced_by: >-
          For a customer-elected settlement, and only for such a settlement, every payment on the contract,
          supplemental allowances included, still counts toward aggregate_term_limit, counted over the
          payments dated within the twelve months before today rather than over the term; every other
          payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          The remaining item benefit is the item cap less homeplan_msr_item_benefit_paid_term and the
          remaining aggregate benefit is aggregate_term_limit less homeplan_msr_term_benefit_paid, each
          floored at zero
        replaced_by: >-
          For a customer-elected settlement, and only for such a settlement, the remaining item benefit is
          still the item cap less the payments counted toward that item and the remaining aggregate benefit
          is still aggregate_term_limit less the payments counted toward it, each floored at zero, with both
          counted over the payments dated within the twelve months before today; every other payment remains
          measured by the base term rule.
      - base_policy: homeplan_evt_supplemental_allowances
        superseded_clause: >-
          Allowances are never paid on a cash-in-lieu settlement or an out-of-network reimbursement, because
          Bridgewell performs no installation there.
        replaced_by: >-
          On a customer-elected cash settlement, and only on such a settlement, the cash carries the
          disposal addition described below for the old unit the customer's own installer must take away,
          and no supplemental allowance row is booked; every other cash settlement and every out-of-network
          reimbursement remains under the base allowance rule.
    trigger: on_request
    subject: [homeplan_cash_in_lieu_payment, homeplan_authorization_reversal]
    computes: cash_amount
    target_tool: elect_cash_in_place_of_replacement_7cf483ad
    params:
      delivery_install_charge: 300.00
      licensed_install_share: 0.30
      fee_credit_full_multiple: 4
      fee_credit_half_multiple: 2
      fee_share_full: 1.00
      fee_share_half: 0.50
      disposal_refrigerant_equipment: 75.00
      disposal_tank_equipment: 50.00
      spoilage_full_days: 7
      spoilage_full: 150.00
      spoilage_partial: 75.00
    rule: >-
      A homeowner who holds a replacement authorization that is neither completed nor reversed may take cash in
      its place; the settlement is recorded by the customer, carries settlement_basis customer_elected, names
      the replacement authorization it replaces, and reverses that authorization in full the same day. A
      customer-elected settlement is available only on a replacement that a network contractor can install: when
      every network contractor of the request's trade whose service ZIP codes include the property_zip is
      suspended, Bridgewell elects cash itself and the settlement is company-elected. A customer-elected cash
      settlement on a service request is fixed only after a replacement authorization that carries neither a
      reversal nor a completion report stands on that request. For a customer-elected settlement, and only for
      such a settlement, the cash is fixed and paid on the day the customer elects it, with no cash-in-lieu
      offer on file; every company-elected settlement remains under the base offer-and-acceptance rule. For a
      customer-elected settlement, and only for such a settlement, the cash paid is the customer-elected cash
      worked out below rather than an offer amount, still limited to the remaining item benefit and the
      remaining aggregate benefit counted as if the replaced authorization had already been reversed and still
      rounded to the cent, while the stall fee credit and the disposal addition this rule names are added to it;
      every company-elected settlement remains under the base rule. For a customer-elected settlement, and only
      for such a settlement, the item cap and aggregate_term_limit are measured against the payments dated
      within the twelve months before today; every other payment remains measured by the base term rule. For a
      customer-elected settlement, and only for such a settlement, the remaining item benefit is still the item
      cap less the payments counted toward that item and the remaining aggregate benefit is still
      aggregate_term_limit less the payments counted toward it, each floored at zero, with both counted over the
      payments dated within the twelve months before today; every other payment remains measured by the base
      term rule. For a customer-elected settlement, and only for such a settlement, every payment on the
      contract, supplemental allowances included, still counts toward aggregate_term_limit, counted over the
      payments dated within the twelve months before today rather than over the term; every other payment
      remains measured by the base term rule. For a customer-elected settlement, and only for such a settlement,
      the item cap is still shared by every repair, replacement, cash-in-lieu settlement and out-of-network
      reimbursement for that item, counted over the payments dated within the twelve months before today rather
      than over the term; every other payment remains measured by the base term rule. The customer-elected cash
      is worked out from the replacement authorization most recently issued on the contract, which is the
      authorization the cash replaces. Its cash starting figure is the amount recorded on that replacement
      authorization. The remaining item benefit and the remaining aggregate benefit are counted as if that
      replacement authorization had already been reversed: the tier's cap for the covered item less the payments
      on that item counted toward the remaining benefits with the authorization's amount taken back out, floored
      at zero, and aggregate_term_limit less every payment on the contract counted toward them with the
      authorization's amount taken back out, floored at zero. A payment counts toward the remaining benefits
      when its event date falls within the twelve months before today, that is after the same calendar day
      twelve months earlier, whatever term its request fell in; repair, replacement, cash-in-lieu and
      out-of-network payments count toward the item, supplemental allowances count toward the aggregate only,
      and a reversal takes its authorization's amount back out of both counts. The customer-elected cash is the
      lowest of the cash starting figure, the remaining item benefit and the remaining aggregate benefit, never
      below zero, rounded to the cent once at the end. The cash starting figure follows what Bridgewell no
      longer provides once the customer takes cash: for a refrigerator, clothes_washer, clothes_dryer or
      oven_range_cooktop, which Bridgewell would deliver and connect, it is the recorded amount less
      delivery_install_charge; for a heating_system, cooling_system or water_heater, which needs licensed
      installation, it is the recorded amount multiplied by one less licensed_install_share and rounded to the
      cent; for any other item it is the recorded amount as it stands. A stall fee credit, a disposal addition
      and a food spoilage allowance are added to the cash starting figure before it is compared with the two
      remaining benefits. On a customer-elected cash settlement, and only on such a settlement, the cash carries
      the disposal addition described below for the old unit the customer's own installer must take away, and no
      supplemental allowance row is booked; every other cash settlement and every out-of-network reimbursement
      remains under the base allowance rule. For a customer-elected settlement on a request whose repair
      authorization stalled and was reversed, and only for such a settlement, the standard visit fee collected
      on that request is credited in the cash at the stall fee share described below, while fees are still not
      refunded because a failure is determined not covered or because the customer declines a covered repair or
      replacement; every other fee remains under the base fee rule. The stall fee credit is the standard visit
      fee collected on the request multiplied by the stall fee share and rounded to the cent, where the stall
      span is the calendar days from the date of the request's repair authorization to the date of that
      authorization's reversal: the share is fee_share_full when the stall span is at least
      fee_credit_full_multiple times parts_lead_time_replace_days, fee_share_half when it is at least
      fee_credit_half_multiple times but less than fee_credit_full_multiple times parts_lead_time_replace_days,
      and nothing when it is shorter or the request carries no reversed repair authorization. The disposal
      addition pays for the regulated disposal the customer now arranges for the old unit:
      disposal_refrigerant_equipment for a refrigerator or cooling_system, whose refrigerant must be recovered
      by a certified technician, disposal_tank_equipment for a water_heater or heating_system, and nothing for
      any other item. The food spoilage allowance applies to a refrigerator by the calendar days from the
      request date to today: spoilage_full when the refrigerator has been out of service more than
      spoilage_full_days days, spoilage_partial when it has been out of service more than one day but no more
      than spoilage_full_days days, and nothing for a refrigerator out of service one day or less or for any
      other item. For a customer-elected settlement, and only for such a settlement, the payment is the
      customer-elected cash worked out below, with no offer to accept, and it carries settlement_basis
      customer_elected; every company-elected settlement remains under the base rule.
    prerequisite:
      - problem: homeplan_ext_stalled_repair_replacement
        kind: value_input
        gate: live_replacement_amount
        form: state
        policy_source: >-
          A customer-elected cash settlement on a service request is fixed only after a replacement authorization that
          carries neither a reversal nor a completion report stands on that request.
        condition: >-
          The service request carries a homeplan_replacement_authorization row whose authorization_number is neither
          named as reversed_authorization_number on a homeplan_authorization_reversal row nor named on a
          homeplan_work_completion row.
        resolved_by: authorize_stalled_repair_replacement_b6f80e12
        effect: >-
          live_replacement_amount takes the amount of the replacement authorization standing on the request (with no
          standing replacement there is no amount to start from), which fixes the cash starting figure and the amounts
          taken back out of the remaining item and aggregate benefits.
    cross_category: []
    inputs:
      history:
        - {table: homeplan_claim_events, aggregate: latest, field: amount, filters: {event_type: homeplan_replacement_authorization}}
        - {table: homeplan_billing_entries, aggregate: sum, field: amount, filters: {event_type: homeplan_service_fee_charge, fee_type: standard_visit}}
        - {table: homeplan_service_requests, aggregate: latest, field: request_date, filters: {}}
        - {table: homeplan_claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement, homeplan_authorization_reversal]}}
      cross_category: []
    compute:
      - settled_request: "LATEST('homeplan_claim_events', 'homeplan_service_request_id', event_type='homeplan_replacement_authorization')"
      - live_replacement_amount: "LATEST('homeplan_claim_events', 'amount', event_type='homeplan_replacement_authorization', homeplan_service_request_id=settled_request)"
      - settled_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_replacement_authorization', homeplan_service_request_id=settled_request)"
      - starting_figure: "RND(live_replacement_amount - K('delivery_install_charge'), 2) if (settled_item == 'refrigerator' or settled_item == 'clothes_washer' or settled_item == 'clothes_dryer' or settled_item == 'oven_range_cooktop') else (RND(live_replacement_amount * (1 - K('licensed_install_share')), 2) if (settled_item == 'heating_system' or settled_item == 'cooling_system' or settled_item == 'water_heater') else live_replacement_amount)"
      - stalled_auth_number: "LATEST('homeplan_claim_events', 'authorization_number', event_type='homeplan_repair_authorization', homeplan_service_request_id=settled_request)"
      - stalled_auth_date: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_repair_authorization', homeplan_service_request_id=settled_request)"
      - stalled_reversal_date: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_authorization_reversal', reversed_authorization_number=stalled_auth_number)"
      - stall_span_days: "DAYS(stalled_auth_date, stalled_reversal_date) if (stalled_auth_date != None and stalled_reversal_date != None) else 0"
      - visit_fee_paid: "SUM('homeplan_billing_entries', 'amount', event_type='homeplan_service_fee_charge', fee_type='standard_visit', homeplan_service_request_id=settled_request)"
      - stall_fee_share: "K('fee_share_full') if stall_span_days >= K('fee_credit_full_multiple') * P('parts_lead_time_replace_days') else (K('fee_share_half') if stall_span_days >= K('fee_credit_half_multiple') * P('parts_lead_time_replace_days') else 0.0)"
      - stall_fee_credit: "RND(visit_fee_paid * stall_fee_share, 2)"
      - disposal_item: "LATEST('homeplan_service_requests', 'covered_item', date_field='request_date', homeplan_service_request_id=settled_request)"
      - disposal_addition: "K('disposal_refrigerant_equipment') if (disposal_item == 'refrigerator' or disposal_item == 'cooling_system') else (K('disposal_tank_equipment') if (disposal_item == 'water_heater' or disposal_item == 'heating_system') else 0.0)"
      - outage_start: "LATEST('homeplan_service_requests', 'request_date', date_field='request_date', homeplan_service_request_id=settled_request)"
      - outage_days: "DAYS(outage_start, NOW)"
      - spoilage_allowance: "K('spoilage_full') if (disposal_item == 'refrigerator' and outage_days > K('spoilage_full_days')) else (K('spoilage_partial') if (disposal_item == 'refrigerator' and outage_days > 1 and outage_days <= K('spoilage_full_days')) else 0.0)"
      - cash_total: "starting_figure + stall_fee_credit + disposal_addition + spoilage_allowance"
      - item_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization', covered_item=settled_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization', covered_item=settled_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment', covered_item=settled_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement', covered_item=settled_item) - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal', covered_item=settled_item)"
      - item_remaining_as_if: "MX(0, P(settled_item + '_cap') - (item_paid - live_replacement_amount))"
      - aggregate_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_supplemental_allowance') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement') - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal')"
      - aggregate_remaining_as_if: "MX(0, P('aggregate_term_limit') - (aggregate_paid - live_replacement_amount))"
      - result: "RND(MX(0, MN(cash_total, item_remaining_as_if, aggregate_remaining_as_if)), 2)"
    compute_basis:
      settled_request: "The customer-elected cash is worked out from the replacement authorization most recently issued on the contract, which is the authorization the cash replaces."
      live_replacement_amount: "Its cash starting figure is the amount recorded on that replacement authorization."
      settled_item: "The cash starting figure follows what Bridgewell no longer provides once the customer takes cash"
      starting_figure: "for a refrigerator, clothes_washer, clothes_dryer or oven_range_cooktop, which Bridgewell would deliver and connect, it is the recorded amount less delivery_install_charge; for a heating_system, cooling_system or water_heater, which needs licensed installation, it is the recorded amount multiplied by one less licensed_install_share and rounded to the cent; for any other item it is the recorded amount as it stands."
      stalled_auth_number: "the stall span is the calendar days from the date of the request's repair authorization to the date of that authorization's reversal"
      stalled_auth_date: "the stall span is the calendar days from the date of the request's repair authorization to the date of that authorization's reversal"
      stalled_reversal_date: "the stall span is the calendar days from the date of the request's repair authorization to the date of that authorization's reversal"
      stall_span_days: "nothing when it is shorter or the request carries no reversed repair authorization."
      visit_fee_paid: "The stall fee credit is the standard visit fee collected on the request multiplied by the stall fee share and rounded to the cent"
      stall_fee_share: "the share is fee_share_full when the stall span is at least fee_credit_full_multiple times parts_lead_time_replace_days, fee_share_half when it is at least fee_credit_half_multiple times but less than fee_credit_full_multiple times parts_lead_time_replace_days, and nothing when it is shorter or the request carries no reversed repair authorization."
      stall_fee_credit: "The stall fee credit is the standard visit fee collected on the request multiplied by the stall fee share and rounded to the cent"
      disposal_item: "The disposal addition pays for the regulated disposal the customer now arranges for the old unit"
      disposal_addition: "disposal_refrigerant_equipment for a refrigerator or cooling_system, whose refrigerant must be recovered by a certified technician, disposal_tank_equipment for a water_heater or heating_system, and nothing for any other item."
      outage_start: "The food spoilage allowance applies to a refrigerator by the calendar days from the request date to today"
      outage_days: "The food spoilage allowance applies to a refrigerator by the calendar days from the request date to today"
      spoilage_allowance: "spoilage_full when the refrigerator has been out of service more than spoilage_full_days days, spoilage_partial when it has been out of service more than one day but no more than spoilage_full_days days, and nothing for a refrigerator out of service one day or less or for any other item."
      cash_total: "A stall fee credit, a disposal addition and a food spoilage allowance are added to the cash starting figure before it is compared with the two remaining benefits."
      item_paid: "A payment counts toward the remaining benefits when its event date falls within the twelve months before today, that is after the same calendar day twelve months earlier, whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its authorization's amount back out of both counts."
      item_remaining_as_if: "the tier's cap for the covered item less the payments on that item counted toward the remaining benefits with the authorization's amount taken back out, floored at zero"
      aggregate_paid: "A payment counts toward the remaining benefits when its event date falls within the twelve months before today, that is after the same calendar day twelve months earlier, whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its authorization's amount back out of both counts."
      aggregate_remaining_as_if: "aggregate_term_limit less every payment on the contract counted toward them with the authorization's amount taken back out, floored at zero."
      result: "The customer-elected cash is the lowest of the cash starting figure, the remaining item benefit and the remaining aggregate benefit, never below zero, rounded to the cent once at the end."
    factors:
      - id: cash_starting_figure_basis
        effect: method
        decides: starting_figure
        bindings: [settled_item, starting_figure]
        ladder:
          - when: "the replaced item is a refrigerator, clothes_washer, clothes_dryer or oven_range_cooktop"
            method: "the cash starting figure is the recorded replacement amount less delivery_install_charge"
          - when: "the replaced item is a heating_system, cooling_system or water_heater"
            method: "the cash starting figure is the recorded replacement amount multiplied by one less licensed_install_share, rounded to the cent"
          - when: "otherwise (any other item)"
            method: "the cash starting figure is the recorded replacement amount as it stands"
        baseline:
          starting_figure: "live_replacement_amount"
        evidence: [history]
        cross_difficulty: null
      - id: stall_fee_share_ladder
        effect: parameter
        decides: stall_fee_share
        bindings: [stalled_auth_number, stalled_auth_date, stalled_reversal_date, stall_span_days, visit_fee_paid, stall_fee_share]
        ladder:
          - when: "the stall span is at least fee_credit_full_multiple times parts_lead_time_replace_days"
            value: "K('fee_share_full')"
          - when: "the stall span is at least fee_credit_half_multiple times but less than fee_credit_full_multiple times parts_lead_time_replace_days"
            value: "K('fee_share_half')"
          - when: "otherwise (shorter, or no reversed repair authorization on the request)"
            value: "0.0"
        baseline:
          stall_fee_share: "0.0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: regulated_disposal_ladder
        effect: parameter
        decides: disposal_addition
        bindings: [disposal_item, disposal_addition]
        ladder:
          - when: "the old unit is a refrigerator or cooling_system"
            value: "K('disposal_refrigerant_equipment')"
          - when: "the old unit is a water_heater or heating_system"
            value: "K('disposal_tank_equipment')"
          - when: "otherwise (any other item)"
            value: "0.0"
        baseline:
          disposal_addition: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: food_spoilage_ladder
        effect: parameter
        decides: spoilage_allowance
        bindings: [outage_start, outage_days, spoilage_allowance]
        ladder:
          - when: "a refrigerator out of service more than spoilage_full_days days since the request date"
            value: "K('spoilage_full')"
          - when: "a refrigerator out of service more than one day but no more than spoilage_full_days days"
            value: "K('spoilage_partial')"
          - when: "otherwise (one day or less, or any other item)"
            value: "0.0"
        baseline:
          spoilage_allowance: "0.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The customer-elected cash is worked out from the replacement authorization most recently issued on the
        contract, which is the authorization the cash replaces.
        Its cash starting figure is the amount recorded on that replacement authorization.
        The remaining item benefit and the remaining aggregate benefit are counted as if that replacement authorization
        had already been reversed: the tier's cap for the covered item less the payments on that item counted toward
        the remaining benefits with the authorization's amount taken back out, floored at zero, and
        aggregate_term_limit less every payment on the contract counted toward them with the authorization's amount
        taken back out, floored at zero.
        A payment counts toward the remaining benefits when its event date falls within the twelve months before today,
        that is after the same calendar day twelve months earlier, whatever term its request fell in; repair,
        replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count
        toward the aggregate only, and a reversal takes its authorization's amount back out of both counts.
        The customer-elected cash is the lowest of the cash starting figure, the remaining item benefit and the
        remaining aggregate benefit, never below zero, rounded to the cent once at the end.
      params: [aggregate_term_limit]

  - id: homeplan_ext_haul_away_on_completed_replacement
    base_policy_refs: [homeplan_evt_supplemental_allowances, homeplan_evt_benefit_caps]
    overwrite:
      - base_policy: homeplan_evt_supplemental_allowances
        superseded_clause: >-
          Each allowance pays the lowest of the documented invoice_amount, the allowance limit and the
          remaining aggregate benefit, and a tier whose allowance is 0.00 pays nothing for that type.
        replaced_by: >-
          For a haul-away allowance on a Bridgewell replacement whose completion report is on file, and only
          for such an allowance, the payment is the lowest of the contracted disposal charge,
          haul_away_allowance and the remaining aggregate benefit, with the late-booking credit added after
          that comparison, and a tier whose haul_away_allowance is 0.00 still pays nothing for that type, so
          no haul-away allowance is owed or booked on it; every other allowance remains under the base rule.
      - base_policy: homeplan_evt_supplemental_allowances
        superseded_clause: >-
          haul_away pays toward removing and disposing of equipment Bridgewell replaced, up to
          haul_away_allowance, and only on a replacement authorization.
        replaced_by: >-
          For a haul-away allowance on a Bridgewell replacement whose completion report is on file, and only
          for such an allowance, it still pays toward removing and disposing of the equipment Bridgewell
          replaced and only on a replacement authorization, and its payment is the lowest of the contracted
          disposal charge, haul_away_allowance and the remaining aggregate benefit with the late-booking
          credit added after that comparison, so that credit may carry the payment above
          haul_away_allowance; every other allowance remains under the base rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          A payment counts in the term in which its service request's request_date falls, even when
          authorized after a renewal.
        replaced_by: >-
          For a haul-away allowance booked under this rule, and only for such an allowance,
          aggregate_term_limit is measured against the payments dated within the twelve months before today;
          every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          Every payment on the contract, supplemental allowances included, counts toward
          aggregate_term_limit, counted by homeplan_msr_term_benefit_paid.
        replaced_by: >-
          For a haul-away allowance booked under this rule, and only for such an allowance, every payment on
          the contract, supplemental allowances included, still counts toward aggregate_term_limit, counted
          over the payments dated within the twelve months before today rather than over the term; every
          other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          The remaining item benefit is the item cap less homeplan_msr_item_benefit_paid_term and the
          remaining aggregate benefit is aggregate_term_limit less homeplan_msr_term_benefit_paid, each
          floored at zero
        replaced_by: >-
          For a haul-away allowance booked under this rule, and only for such an allowance, the remaining
          item benefit is still the item cap less the payments counted toward that item, which no allowance
          enters, and the remaining aggregate benefit is still aggregate_term_limit less the payments
          counted toward it, each floored at zero, with both counted over the payments dated within the
          twelve months before today; every other payment remains measured by the base term rule.
    trigger: state_due
    subject: [homeplan_supplemental_allowance]
    computes: amount
    target_tool: book_supplemental_allowance_cce1a240
    params:
      charge_refrigerant_equipment: 55.00
      charge_tank_equipment: 45.00
      charge_standard_equipment: 30.00
      carry_charge_appliance: 20.00
      carry_charge_other_trade: 12.00
      after_hours_charge_emergency: 30.00
      after_hours_charge_routine: 20.00
      size_large_cost: 2000.00
      size_mid_cost: 800.00
      size_charge_large: 15.00
      size_charge_mid: 8.00
      late_daily_after_days: 30
      late_weekly_after_days: 14
      late_daily_credit: 0.10
      late_weekly_credit: 0.50
    rule: >-
      When Bridgewell's network contractor completes a replacement, removing the old equipment is part of the
      installation, and a haul-away allowance is owed on that service request as soon as the completion report
      is on file, provided the tier's haul_away_allowance is above 0.00 (a tier whose haul_away_allowance is
      0.00 owes and books none); the allowance is booked once per request with allowance_type haul_away, records
      the contracted disposal charge described below as its invoice_amount, and counts toward the aggregate
      limit but not toward any item cap. The haul-away payment is worked out for the replacement that the most
      recent completion report on the contract closes. The contracted disposal charge for the removed equipment
      is charge_standard_equipment. The remaining aggregate benefit is aggregate_term_limit less every payment
      on the contract counted toward it, floored at zero, where a payment counts when its event date falls
      within the twelve months before today, that is after the same calendar day twelve months earlier, whatever
      term its request fell in, supplemental allowances count, and a reversal takes its authorization's amount
      back out. The haul-away payment is the lowest of the contracted disposal charge, haul_away_allowance and
      the remaining aggregate benefit, never below zero, rounded to the cent. For a haul-away allowance on a
      Bridgewell replacement whose completion report is on file, and only for such an allowance, the payment is
      the lowest of the contracted disposal charge, haul_away_allowance and the remaining aggregate benefit,
      with the late-booking credit added after that comparison, and a tier whose haul_away_allowance is 0.00
      still pays nothing for that type, so no haul-away allowance is owed or booked on it; every other allowance
      remains under the base rule. For a haul-away allowance booked under this rule, and only for such an
      allowance, aggregate_term_limit is measured against the payments dated within the twelve months before
      today; every other payment remains measured by the base term rule. For a haul-away allowance booked under
      this rule, and only for such an allowance, the remaining item benefit is still the item cap less the
      payments counted toward that item, which no allowance enters, and the remaining aggregate benefit is still
      aggregate_term_limit less the payments counted toward it, each floored at zero, with both counted over the
      payments dated within the twelve months before today; every other payment remains measured by the base
      term rule. For a haul-away allowance booked under this rule, and only for such an allowance, every payment
      on the contract, supplemental allowances included, still counts toward aggregate_term_limit, counted over
      the payments dated within the twelve months before today rather than over the term; every other payment
      remains measured by the base term rule. The disposal charge depends on the equipment class removed:
      charge_refrigerant_equipment when the replaced item is a refrigerator or cooling_system, whose refrigerant
      must be recovered before disposal, charge_tank_equipment when it is a water_heater or heating_system, and
      charge_standard_equipment for any other item. A carry-out charge is added to the disposal charge:
      carry_charge_appliance when the property is a townhome or condominium and the replacement request was an
      appliance-trade request, carry_charge_other_trade when the property is a townhome or condominium and the
      request was for another trade, and nothing when the property is a single-family or mobile home. A
      unit-size charge is added to the disposal charge: size_charge_large when the replaced unit's contracted
      replacement_cost is size_large_cost or more, size_charge_mid when it is at least size_mid_cost but less
      than size_large_cost, and nothing when it is less than size_mid_cost. An after-hours removal charge is
      added to the disposal charge, because the old unit is carried out at the installation visit held in the
      window the replacement request asked for: after_hours_charge_emergency when the replacement request asked
      for an after-hours visit and was an emergency request, after_hours_charge_routine when it asked for an
      after-hours visit and was a routine request, and nothing when it asked for a business-hours visit. The
      late-booking credit follows the calendar days from the completion date to today: when more than
      late_daily_after_days days have passed, late_daily_credit for each day beyond late_daily_after_days; when
      more than late_weekly_after_days but no more than late_daily_after_days days have passed,
      late_weekly_credit for each full week beyond late_weekly_after_days; otherwise no credit; the credit is
      rounded to the cent and added after the disposal charge has been compared with haul_away_allowance and the
      remaining aggregate benefit. For a haul-away allowance on a Bridgewell replacement whose completion report
      is on file, and only for such an allowance, it still pays toward removing and disposing of the equipment
      Bridgewell replaced and only on a replacement authorization, and its payment is the lowest of the
      contracted disposal charge, haul_away_allowance and the remaining aggregate benefit with the late-booking
      credit added after that comparison, so that credit may carry the payment above haul_away_allowance; every
      other allowance remains under the base rule.
    prerequisite: []
    cross_category: []
    inputs:
      history:
        - {table: homeplan_claim_events, aggregate: latest, field: authorization_number, filters: {event_type: homeplan_work_completion}}
        - {table: homeplan_claim_events, aggregate: count, field: homeplan_claim_event_id, filters: {event_type: homeplan_replacement_authorization}}
        - {table: homeplan_service_requests, aggregate: latest, field: service_window, filters: {}}
        - {table: homeplan_claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement, homeplan_authorization_reversal]}}
      cross_category: []
    compute:
      - completed_auth: "LATEST('homeplan_claim_events', 'authorization_number', event_type='homeplan_work_completion')"
      - completion_date: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_work_completion')"
      - removal_request: "LATEST('homeplan_claim_events', 'homeplan_service_request_id', event_type='homeplan_replacement_authorization', authorization_number=completed_auth)"
      - refrigerant_removals: "COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', authorization_number=completed_auth, covered_item='refrigerator') + COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', authorization_number=completed_auth, covered_item='cooling_system')"
      - tank_removals: "COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', authorization_number=completed_auth, covered_item='water_heater') + COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', authorization_number=completed_auth, covered_item='heating_system')"
      - class_charge: "K('charge_refrigerant_equipment') if refrigerant_removals >= 1 else (K('charge_tank_equipment') if tank_removals >= 1 else K('charge_standard_equipment'))"
      - removal_trade: "LATEST('homeplan_service_requests', 'trade', date_field='request_date', homeplan_service_request_id=removal_request)"
      - carry_charge: "K('carry_charge_appliance') if ((F('property_type') == 'townhome' or F('property_type') == 'condominium') and removal_trade == 'appliance') else (K('carry_charge_other_trade') if ((F('property_type') == 'townhome' or F('property_type') == 'condominium') and removal_trade != 'appliance') else 0.0)"
      - removed_unit_cost: "LATEST('homeplan_claim_events', 'replacement_cost', event_type='homeplan_replacement_authorization', authorization_number=completed_auth)"
      - size_charge: "K('size_charge_large') if removed_unit_cost >= K('size_large_cost') else (K('size_charge_mid') if removed_unit_cost >= K('size_mid_cost') else 0.0)"
      - removal_window: "LATEST('homeplan_service_requests', 'service_window', date_field='request_date', homeplan_service_request_id=removal_request)"
      - removal_urgency: "LATEST('homeplan_service_requests', 'urgency', date_field='request_date', homeplan_service_request_id=removal_request)"
      - after_hours_charge: "K('after_hours_charge_emergency') if (removal_window == 'after_hours' and removal_urgency == 'emergency') else (K('after_hours_charge_routine') if (removal_window == 'after_hours' and removal_urgency == 'routine') else 0.0)"
      - disposal_charge: "class_charge + carry_charge + size_charge + after_hours_charge"
      - booking_lag_days: "DAYS(completion_date, NOW)"
      - late_credit: "RND((booking_lag_days - K('late_daily_after_days')) * K('late_daily_credit'), 2) if booking_lag_days > K('late_daily_after_days') else (RND(int((booking_lag_days - K('late_weekly_after_days')) / 7) * K('late_weekly_credit'), 2) if booking_lag_days > K('late_weekly_after_days') else 0.0)"
      - aggregate_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_supplemental_allowance') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement') - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal')"
      - aggregate_remaining: "MX(0, P('aggregate_term_limit') - aggregate_paid)"
      - result: "RND(MX(0, MN(disposal_charge, P('haul_away_allowance'), aggregate_remaining)) + late_credit, 2)"
    compute_basis:
      completed_auth: "The haul-away payment is worked out for the replacement that the most recent completion report on the contract closes."
      completion_date: "The late-booking credit follows the calendar days from the completion date to today"
      removal_request: "The haul-away payment is worked out for the replacement that the most recent completion report on the contract closes."
      refrigerant_removals: "charge_refrigerant_equipment when the replaced item is a refrigerator or cooling_system, whose refrigerant must be recovered before disposal"
      tank_removals: "charge_tank_equipment when it is a water_heater or heating_system"
      class_charge: "charge_refrigerant_equipment when the replaced item is a refrigerator or cooling_system, whose refrigerant must be recovered before disposal, charge_tank_equipment when it is a water_heater or heating_system, and charge_standard_equipment for any other item."
      removal_trade: "the replacement request was an appliance-trade request"
      carry_charge: "A carry-out charge is added to the disposal charge: carry_charge_appliance when the property is a townhome or condominium and the replacement request was an appliance-trade request, carry_charge_other_trade when the property is a townhome or condominium and the request was for another trade, and nothing when the property is a single-family or mobile home."
      removed_unit_cost: "when the replaced unit's contracted replacement_cost is size_large_cost or more"
      size_charge: "A unit-size charge is added to the disposal charge: size_charge_large when the replaced unit's contracted replacement_cost is size_large_cost or more, size_charge_mid when it is at least size_mid_cost but less than size_large_cost, and nothing when it is less than size_mid_cost."
      removal_window: "the replacement request asked for an after-hours visit"
      removal_urgency: "and was an emergency request"
      after_hours_charge: "after_hours_charge_emergency when the replacement request asked for an after-hours visit and was an emergency request, after_hours_charge_routine when it asked for an after-hours visit and was a routine request, and nothing when it asked for a business-hours visit."
      disposal_charge: "A carry-out charge is added to the disposal charge"
      booking_lag_days: "The late-booking credit follows the calendar days from the completion date to today"
      late_credit: "when more than late_daily_after_days days have passed, late_daily_credit for each day beyond late_daily_after_days; when more than late_weekly_after_days but no more than late_daily_after_days days have passed, late_weekly_credit for each full week beyond late_weekly_after_days; otherwise no credit; the credit is rounded to the cent and added after the disposal charge has been compared with haul_away_allowance and the remaining aggregate benefit."
      aggregate_paid: "where a payment counts when its event date falls within the twelve months before today, that is after the same calendar day twelve months earlier, whatever term its request fell in, supplemental allowances count, and a reversal takes its authorization's amount back out."
      aggregate_remaining: "The remaining aggregate benefit is aggregate_term_limit less every payment on the contract counted toward it, floored at zero"
      result: "the payment is the lowest of the contracted disposal charge, haul_away_allowance and the remaining aggregate benefit, with the late-booking credit added after that comparison"
    factors:
      - id: removed_equipment_class
        effect: parameter
        decides: class_charge
        bindings: [refrigerant_removals, tank_removals, class_charge]
        ladder:
          - when: "the replaced item is a refrigerator or cooling_system"
            value: "K('charge_refrigerant_equipment')"
          - when: "the replaced item is a water_heater or heating_system"
            value: "K('charge_tank_equipment')"
          - when: "otherwise (any other item)"
            value: "K('charge_standard_equipment')"
        baseline:
          class_charge: "K('charge_standard_equipment')"
        evidence: [history]
        cross_difficulty: null
      - id: carry_out_ladder
        effect: parameter
        decides: carry_charge
        bindings: [removal_trade, carry_charge]
        ladder:
          - when: "the property is a townhome or condominium and the replacement request was an appliance-trade request"
            value: "K('carry_charge_appliance')"
          - when: "the property is a townhome or condominium and the request was for another trade"
            value: "K('carry_charge_other_trade')"
          - when: "otherwise (a single-family or mobile home)"
            value: "0.0"
        baseline:
          carry_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: unit_size_ladder
        effect: parameter
        decides: size_charge
        bindings: [removed_unit_cost, size_charge]
        ladder:
          - when: "the replaced unit's contracted replacement_cost is size_large_cost or more"
            value: "K('size_charge_large')"
          - when: "it is at least size_mid_cost but less than size_large_cost"
            value: "K('size_charge_mid')"
          - when: "otherwise (less than size_mid_cost)"
            value: "0.0"
        baseline:
          size_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: after_hours_removal_ladder
        effect: parameter
        decides: after_hours_charge
        bindings: [removal_window, removal_urgency, after_hours_charge]
        ladder:
          - when: "the replacement request asked for an after-hours visit and was an emergency request"
            value: "K('after_hours_charge_emergency')"
          - when: "the replacement request asked for an after-hours visit and was a routine request"
            value: "K('after_hours_charge_routine')"
          - when: "otherwise (a business-hours visit)"
            value: "0.0"
        baseline:
          after_hours_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: late_booking_day_count
        effect: method
        decides: late_credit
        bindings: [completion_date, booking_lag_days, late_credit]
        ladder:
          - when: "more than late_daily_after_days calendar days have passed from the completion date to today"
            method: "late_daily_credit for each calendar day beyond late_daily_after_days"
          - when: "more than late_weekly_after_days but no more than late_daily_after_days days have passed"
            method: "late_weekly_credit for each full week beyond late_weekly_after_days"
          - when: "otherwise"
            method: "no late-booking credit"
        baseline:
          late_credit: "0.0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The haul-away payment is worked out for the replacement that the most recent completion report on the contract
        closes.
        The contracted disposal charge for the removed equipment is charge_standard_equipment.
        The remaining aggregate benefit is aggregate_term_limit less every payment on the contract counted toward it,
        floored at zero, where a payment counts when its event date falls within the twelve months before today, that is
        after the same calendar day twelve months earlier, whatever term its request fell in, supplemental allowances
        count, and a reversal takes its authorization's amount back out.
        The haul-away payment is the lowest of the contracted disposal charge, haul_away_allowance and the remaining
        aggregate benefit, never below zero, rounded to the cent.
      params: [charge_standard_equipment, haul_away_allowance, aggregate_term_limit]

  - id: homeplan_ext_company_elected_cash_offer
    base_policy_refs: [homeplan_evt_cash_in_lieu, homeplan_evt_repair_or_replace, homeplan_evt_benefit_caps, homeplan_evt_supplemental_allowances]
    overwrite:
      - base_policy: homeplan_evt_cash_in_lieu
        superseded_clause: >-
          The offer amount is Bridgewell's contracted replacement_cost for the like unit, limited to the
          remaining item benefit and the remaining aggregate benefit (for a customer_elected offer, computed
          as if the replacement authorization it replaces had already been reversed), and rounded to the
          cent; supplemental allowances and service call fees are never added.
        replaced_by: >-
          For a company-elected offer on a standing replacement authorization that no network contractor can
          install, and only for such an offer, the offer amount is the company-elected cash amount worked
          out below, still limited to the remaining item benefit and the remaining aggregate benefit and
          still rounded to the cent, those benefits being counted as if the standing authorization had
          already been reversed, while the additions this rule names take the place of supplemental
          allowances and no service call fee is added; every other offer remains under the base rule.
      - base_policy: homeplan_evt_supplemental_allowances
        superseded_clause: >-
          Allowances are never paid on a cash-in-lieu settlement or an out-of-network reimbursement, because
          Bridgewell performs no installation there.
        replaced_by: >-
          On a company-elected offer worked out under this rule, and only on such an offer, the cash carries
          the code-compliance addition, the failed-unit disposal charge and the self-installation permit
          addition described below for work the homeowner's own installer must now do, and no supplemental
          allowance row is booked; every other cash settlement and every out-of-network reimbursement
          remains under the base allowance rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          A payment counts in the term in which its service request's request_date falls, even when
          authorized after a renewal.
        replaced_by: >-
          For a company-elected offer worked out under this rule, and only for such an offer, the item cap
          and aggregate_term_limit are measured against the payments dated within the twelve months before
          today; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          the cap is shared by every repair, replacement, cash-in-lieu settlement and out-of-network
          reimbursement for that item in the term, counted by homeplan_msr_item_benefit_paid_term
        replaced_by: >-
          For a company-elected offer worked out under this rule, and only for such an offer, the item cap
          is still shared by every repair, replacement, cash-in-lieu settlement and out-of-network
          reimbursement for that item, counted over the payments dated within the twelve months before today
          rather than over the term; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          Every payment on the contract, supplemental allowances included, counts toward
          aggregate_term_limit, counted by homeplan_msr_term_benefit_paid.
        replaced_by: >-
          For a company-elected offer worked out under this rule, and only for such an offer, every payment
          on the contract, supplemental allowances included, still counts toward aggregate_term_limit,
          counted over the payments dated within the twelve months before today rather than over the term;
          every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          The remaining item benefit is the item cap less homeplan_msr_item_benefit_paid_term and the
          remaining aggregate benefit is aggregate_term_limit less homeplan_msr_term_benefit_paid, each
          floored at zero
        replaced_by: >-
          For a company-elected offer worked out under this rule, and only for such an offer, the remaining
          item benefit is still the item cap less the payments counted toward that item and the remaining
          aggregate benefit is still aggregate_term_limit less the payments counted toward it, each floored
          at zero, with both counted over the payments dated within the twelve months before today; every
          other payment remains measured by the base term rule.
    trigger: state_due
    subject: [homeplan_cash_in_lieu_offer]
    computes: amount
    target_tool: issue_company_cash_offer_eabc2067
    params:
      requote_long_days: 60
      requote_short_days: 30
      requote_rate_long: 0.04
      requote_rate_short: 0.02
      reconnect_water_heater: 95.00
      reconnect_hvac: 160.00
      licensed_install_gap_share: 0.10
      delivery_install_gap: 60.00
      drain_pan_water_heater: 85.00
      condensate_pan_hvac: 80.00
      unit_disposal_refrigerant: 80.00
      unit_disposal_tank: 45.00
      self_install_permit_charge: 150.00
      permit_count_hvac: 2
      permit_count_water_heater: 1
    rule: >-
      Bridgewell elects cash in place of a replacement it has authorized when no network contractor can install
      the like unit: every network contractor of the request's trade whose service ZIP codes include the
      property_zip is suspended. The offer is recorded on the request with settlement_basis company_elected, the
      re-quoted like-unit cost described below as its replacement_cost, the company-elected cash amount as its
      amount, and an offer_expiration_date cash_in_lieu_offer_validity_days calendar days after the offer date.
      A company-elected cash-in-lieu offer is issued only once the most recent completion report on the
      contract, when it closes a Bridgewell replacement on a tier that pays a haul-away allowance, has that
      replacement's haul-away allowance on the records. For a company-elected offer on a standing replacement
      authorization that no network contractor can install, and only for such an offer, the offer amount is the
      company-elected cash amount worked out below, still limited to the remaining item benefit and the
      remaining aggregate benefit and still rounded to the cent, those benefits being counted as if the standing
      authorization had already been reversed, while the additions this rule names take the place of
      supplemental allowances and no service call fee is added; every other offer remains under the base rule.
      For a company-elected offer worked out under this rule, and only for such an offer, the item cap and
      aggregate_term_limit are measured against the payments dated within the twelve months before today; every
      other payment remains measured by the base term rule. For a company-elected offer worked out under this
      rule, and only for such an offer, the remaining item benefit is still the item cap less the payments
      counted toward that item and the remaining aggregate benefit is still aggregate_term_limit less the
      payments counted toward it, each floored at zero, with both counted over the payments dated within the
      twelve months before today; every other payment remains measured by the base term rule. For a
      company-elected offer worked out under this rule, and only for such an offer, every payment on the
      contract, supplemental allowances included, still counts toward aggregate_term_limit, counted over the
      payments dated within the twelve months before today rather than over the term; every other payment
      remains measured by the base term rule. For a company-elected offer worked out under this rule, and only
      for such an offer, the item cap is still shared by every repair, replacement, cash-in-lieu settlement and
      out-of-network reimbursement for that item, counted over the payments dated within the twelve months
      before today rather than over the term; every other payment remains measured by the base term rule. On a
      company-elected offer worked out under this rule, and only on such an offer, the cash carries the
      code-compliance addition, the failed-unit disposal charge and the self-installation permit addition
      described below for work the homeowner's own installer must now do, and no supplemental allowance row is
      booked; every other cash settlement and every out-of-network reimbursement remains under the base
      allowance rule. The offer states the cash that takes the place of the standing replacement; the credits
      owed on the request for Bridgewell's own service failures are not part of it. The company-elected cash
      amount is worked out from the replacement authorization most recently issued on the contract, which is the
      standing authorization the cash takes the place of. The re-quoted like-unit cost is the replacement_cost
      recorded on that authorization, and the company-elected cash basis is the re-quoted like-unit cost. The
      remaining item benefit and the remaining aggregate benefit are counted as if the standing authorization
      had already been reversed: the tier's cap for the covered item less the payments on that item counted
      toward the remaining benefits with the authorization's amount taken back out, floored at zero, and
      aggregate_term_limit less every payment on the contract counted toward them with the authorization's
      amount taken back out, floored at zero. A payment counts toward the remaining benefits when its event date
      falls within the twelve months before today, that is after the same calendar day twelve months earlier,
      whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count
      toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its
      authorization's amount back out of both counts. The company-elected cash amount is the lowest of the
      company-elected cash basis, the remaining item benefit and the remaining aggregate benefit, never below
      zero, rounded to the cent. The recorded replacement_cost becomes the re-quoted like-unit cost by
      multiplying it by one plus the re-quote rate and rounding to the cent, and the re-quote rate depends on
      the calendar days from the standing authorization's date to today: requote_rate_long when more than
      requote_long_days days have passed, requote_rate_short when more than requote_short_days but no more than
      requote_long_days days have passed, and no re-quote when requote_short_days days or fewer have passed. A
      supply reconnection charge, an outside-installer labor gap, a code-compliance addition, a failed-unit
      disposal charge and a self-installation permit addition are added to the company-elected cash basis as
      flat dollar amounts, never compounded, and the basis so obtained is compared with the two remaining
      benefits without being rounded first. The supply reconnection charge pays for the connection parts the
      homeowner's installer fits to the like unit: reconnect_water_heater for a water_heater, whose supply
      connectors and relief discharge line are replaced, reconnect_hvac for a heating_system or cooling_system,
      whose refrigerant line set or flue connector is replaced, and nothing for any other item. The
      outside-installer labor gap covers what an installer outside the network charges beyond the labor in
      Bridgewell's contracted cost, and its method follows the trade the item needs: for a water_heater,
      heating_system or cooling_system, which a licensed tradesperson must install, it is the recorded
      replacement_cost multiplied by licensed_install_gap_share and rounded to the cent; for a refrigerator,
      clothes_washer, clothes_dryer, dishwasher or oven_range_cooktop, which is delivered and connected, it is
      the flat delivery_install_gap; for any other item there is no gap. The code-compliance addition pays for
      the pan and discharge line that code requires when the self-installed unit sits in an attached dwelling:
      drain_pan_water_heater when the item is a water_heater and the property is a townhome or condominium,
      condensate_pan_hvac when the item is a heating_system or cooling_system and the property is a townhome or
      condominium, and nothing otherwise. The failed-unit disposal charge pays for taking away the failed unit
      the homeowner's installer removes: unit_disposal_refrigerant for a refrigerator or cooling_system, whose
      refrigerant must be recovered, unit_disposal_tank for a water_heater or heating_system, and nothing for
      any other item. The self-installation permit addition pays for the permits the homeowner must now obtain:
      permit_count_hvac times self_install_permit_charge for a heating_system or cooling_system,
      permit_count_water_heater times self_install_permit_charge for a water_heater, and nothing for any other
      item.
    prerequisite:
      - problem: homeplan_ext_haul_away_on_completed_replacement
        kind: state_gate
        gate: homeplan_claim_events.allowance_type
        form: state
        policy_source: >-
          A company-elected cash-in-lieu offer is issued only once the most recent completion report on the
          contract, when it closes a Bridgewell replacement on a tier that pays a haul-away allowance, has
          that replacement's haul-away allowance on the records.
        condition: >-
          When the most recent homeplan_work_completion row names a homeplan_replacement_authorization and
          the tier's haul_away_allowance is above 0.00, that authorization's service request carries a
          homeplan_supplemental_allowance row with allowance_type haul_away.
        resolved_by: book_supplemental_allowance_cce1a240
        effect: >-
          The gate on issuing the offer holds once the replacement closed by the most recent completion report carries
          its haul-away allowance; the offer amount itself is unchanged while the remaining aggregate benefit does not
          bind.
    cross_category: []
    inputs:
      history:
        - {table: homeplan_claim_events, aggregate: latest, field: replacement_cost, filters: {event_type: homeplan_replacement_authorization}}
        - {table: homeplan_service_requests, aggregate: latest, field: covered_item, filters: {}}
        - {table: homeplan_claim_events, aggregate: latest, field: event_date, filters: {event_type: homeplan_replacement_authorization}}
        - {table: homeplan_claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement, homeplan_authorization_reversal]}}
      cross_category: []
    compute:
      - standing_request: "LATEST('homeplan_claim_events', 'homeplan_service_request_id', event_type='homeplan_replacement_authorization')"
      - standing_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request)"
      - standing_amount: "LATEST('homeplan_claim_events', 'amount', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request)"
      - recorded_basis: "LATEST('homeplan_claim_events', 'replacement_cost', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request)"
      - authorization_date: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request)"
      - quote_age_days: "DAYS(authorization_date, NOW)"
      - requote_rate: "K('requote_rate_long') if quote_age_days > K('requote_long_days') else (K('requote_rate_short') if quote_age_days > K('requote_short_days') else 0.0)"
      - requoted_cost: "RND(recorded_basis * (1 + requote_rate), 2)"
      - reconnect_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_coverage_determination', homeplan_service_request_id=standing_request)"
      - reconnection_charge: "K('reconnect_water_heater') if reconnect_item == 'water_heater' else (K('reconnect_hvac') if (reconnect_item == 'heating_system' or reconnect_item == 'cooling_system') else 0.0)"
      - install_trade_item: "LATEST('homeplan_service_requests', 'covered_item', date_field='request_date', homeplan_service_request_id=standing_request)"
      - install_gap: "RND(recorded_basis * K('licensed_install_gap_share'), 2) if (install_trade_item == 'water_heater' or install_trade_item == 'heating_system' or install_trade_item == 'cooling_system') else (K('delivery_install_gap') if (install_trade_item == 'refrigerator' or install_trade_item == 'clothes_washer' or install_trade_item == 'clothes_dryer' or install_trade_item == 'dishwasher' or install_trade_item == 'oven_range_cooktop') else 0.0)"
      - code_item: "LATEST('homeplan_service_requests', 'covered_item', date_field='request_date', homeplan_service_request_id=standing_request)"
      - code_addition: "K('drain_pan_water_heater') if (code_item == 'water_heater' and (F('property_type') == 'townhome' or F('property_type') == 'condominium')) else (K('condensate_pan_hvac') if ((code_item == 'heating_system' or code_item == 'cooling_system') and (F('property_type') == 'townhome' or F('property_type') == 'condominium')) else 0.0)"
      - refrigerant_units: "COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request, covered_item='refrigerator') + COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request, covered_item='cooling_system')"
      - tank_units: "COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request, covered_item='water_heater') + COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', homeplan_service_request_id=standing_request, covered_item='heating_system')"
      - unit_disposal_charge: "K('unit_disposal_refrigerant') if refrigerant_units >= 1 else (K('unit_disposal_tank') if tank_units >= 1 else 0.0)"
      - permit_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_coverage_determination', homeplan_service_request_id=standing_request)"
      - permit_count: "K('permit_count_hvac') if (permit_item == 'heating_system' or permit_item == 'cooling_system') else (K('permit_count_water_heater') if permit_item == 'water_heater' else 0)"
      - permit_addition: "permit_count * K('self_install_permit_charge')"
      - cash_basis: "requoted_cost + reconnection_charge + install_gap + code_addition + unit_disposal_charge + permit_addition"
      - item_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization', covered_item=standing_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization', covered_item=standing_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment', covered_item=standing_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement', covered_item=standing_item) - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal', covered_item=standing_item)"
      - item_remaining_as_if: "MX(0, P(standing_item + '_cap') - (item_paid - standing_amount))"
      - aggregate_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_supplemental_allowance') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement') - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal')"
      - aggregate_remaining_as_if: "MX(0, P('aggregate_term_limit') - (aggregate_paid - standing_amount))"
      - result: "RND(MX(0, MN(cash_basis, item_remaining_as_if, aggregate_remaining_as_if)), 2)"
    compute_basis:
      standing_request: "The company-elected cash amount is worked out from the replacement authorization most recently issued on the contract, which is the standing authorization the cash takes the place of."
      standing_item: "the tier's cap for the covered item less the payments on that item counted toward the remaining benefits with the authorization's amount taken back out"
      standing_amount: "with the authorization's amount taken back out"
      recorded_basis: "The re-quoted like-unit cost is the replacement_cost recorded on that authorization"
      authorization_date: "the re-quote rate depends on the calendar days from the standing authorization's date to today"
      quote_age_days: "the re-quote rate depends on the calendar days from the standing authorization's date to today"
      requote_rate: "requote_rate_long when more than requote_long_days days have passed, requote_rate_short when more than requote_short_days but no more than requote_long_days days have passed, and no re-quote when requote_short_days days or fewer have passed."
      requoted_cost: "The recorded replacement_cost becomes the re-quoted like-unit cost by multiplying it by one plus the re-quote rate and rounding to the cent"
      reconnect_item: "The supply reconnection charge pays for the connection parts the homeowner's installer fits to the like unit"
      reconnection_charge: "reconnect_water_heater for a water_heater, whose supply connectors and relief discharge line are replaced, reconnect_hvac for a heating_system or cooling_system, whose refrigerant line set or flue connector is replaced, and nothing for any other item."
      install_trade_item: "its method follows the trade the item needs"
      install_gap: "for a water_heater, heating_system or cooling_system, which a licensed tradesperson must install, it is the recorded replacement_cost multiplied by licensed_install_gap_share and rounded to the cent; for a refrigerator, clothes_washer, clothes_dryer, dishwasher or oven_range_cooktop, which is delivered and connected, it is the flat delivery_install_gap; for any other item there is no gap."
      code_item: "drain_pan_water_heater when the item is a water_heater and the property is a townhome or condominium"
      code_addition: "The code-compliance addition pays for the pan and discharge line that code requires when the self-installed unit sits in an attached dwelling: drain_pan_water_heater when the item is a water_heater and the property is a townhome or condominium, condensate_pan_hvac when the item is a heating_system or cooling_system and the property is a townhome or condominium, and nothing otherwise."
      refrigerant_units: "unit_disposal_refrigerant for a refrigerator or cooling_system, whose refrigerant must be recovered"
      tank_units: "unit_disposal_tank for a water_heater or heating_system"
      unit_disposal_charge: "unit_disposal_refrigerant for a refrigerator or cooling_system, whose refrigerant must be recovered, unit_disposal_tank for a water_heater or heating_system, and nothing for any other item."
      permit_item: "The self-installation permit addition pays for the permits the homeowner must now obtain"
      permit_count: "permit_count_hvac times self_install_permit_charge for a heating_system or cooling_system, permit_count_water_heater times self_install_permit_charge for a water_heater, and nothing for any other item."
      permit_addition: "permit_count_hvac times self_install_permit_charge for a heating_system or cooling_system, permit_count_water_heater times self_install_permit_charge for a water_heater"
      cash_basis: "A supply reconnection charge, an outside-installer labor gap, a code-compliance addition, a failed-unit disposal charge and a self-installation permit addition are added to the company-elected cash basis as flat dollar amounts, never compounded, and the basis so obtained is compared with the two remaining benefits without being rounded first."
      item_paid: "A payment counts toward the remaining benefits when its event date falls within the twelve months before today, that is after the same calendar day twelve months earlier, whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its authorization's amount back out of both counts."
      item_remaining_as_if: "the tier's cap for the covered item less the payments on that item counted toward the remaining benefits with the authorization's amount taken back out, floored at zero"
      aggregate_paid: "A payment counts toward the remaining benefits when its event date falls within the twelve months before today, that is after the same calendar day twelve months earlier, whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its authorization's amount back out of both counts."
      aggregate_remaining_as_if: "aggregate_term_limit less every payment on the contract counted toward them with the authorization's amount taken back out, floored at zero."
      result: "The company-elected cash amount is the lowest of the company-elected cash basis, the remaining item benefit and the remaining aggregate benefit, never below zero, rounded to the cent."
    factors:
      - id: offer_requote_ladder
        effect: parameter
        decides: requote_rate
        bindings: [quote_age_days, requote_rate]
        ladder:
          - when: "more than requote_long_days calendar days have passed from the standing authorization's date to today"
            value: "K('requote_rate_long')"
          - when: "more than requote_short_days but no more than requote_long_days days have passed"
            value: "K('requote_rate_short')"
          - when: "otherwise (requote_short_days days or fewer have passed)"
            value: "0.0 (no re-quote)"
        baseline:
          requote_rate: "0.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: supply_reconnection_ladder
        effect: parameter
        decides: reconnection_charge
        bindings: [reconnect_item, reconnection_charge]
        ladder:
          - when: "the item is a water_heater, whose supply connectors and relief discharge line are replaced"
            value: "K('reconnect_water_heater')"
          - when: "the item is a heating_system or cooling_system, whose refrigerant line set or flue connector is replaced"
            value: "K('reconnect_hvac')"
          - when: "otherwise (any other item)"
            value: "0.0"
        baseline:
          reconnection_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: outside_installer_method
        effect: method
        decides: install_gap
        bindings: [install_trade_item, install_gap]
        ladder:
          - when: "the item is a water_heater, heating_system or cooling_system, which a licensed tradesperson must install"
            method: "the recorded replacement_cost multiplied by licensed_install_gap_share, rounded to the cent"
          - when: "the item is a refrigerator, clothes_washer, clothes_dryer, dishwasher or oven_range_cooktop, which is delivered and connected"
            method: "the flat delivery_install_gap"
          - when: "otherwise (any other item)"
            method: "no labor gap"
        baseline:
          install_gap: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: attached_dwelling_code_pan
        effect: parameter
        decides: code_addition
        bindings: [code_item, code_addition]
        ladder:
          - when: "the item is a water_heater and the property is a townhome or condominium"
            value: "K('drain_pan_water_heater')"
          - when: "the item is a heating_system or cooling_system and the property is a townhome or condominium"
            value: "K('condensate_pan_hvac')"
          - when: "otherwise"
            value: "0.0"
        baseline:
          code_addition: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: failed_unit_disposal
        effect: parameter
        decides: unit_disposal_charge
        bindings: [refrigerant_units, tank_units, unit_disposal_charge]
        ladder:
          - when: "the failed unit is a refrigerator or cooling_system, whose refrigerant must be recovered"
            value: "K('unit_disposal_refrigerant')"
          - when: "the failed unit is a water_heater or heating_system"
            value: "K('unit_disposal_tank')"
          - when: "otherwise (any other item)"
            value: "0.0"
        baseline:
          unit_disposal_charge: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: owner_permit_ladder
        effect: parameter
        decides: permit_count
        bindings: [permit_item, permit_count, permit_addition]
        ladder:
          - when: "the item is a heating_system or cooling_system"
            value: "K('permit_count_hvac') permits at self_install_permit_charge each"
          - when: "the item is a water_heater"
            value: "K('permit_count_water_heater') permit at self_install_permit_charge"
          - when: "otherwise (any other item)"
            value: "0 (no permit addition)"
        baseline:
          permit_count: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The company-elected cash amount is worked out from the replacement authorization most recently issued on the
        contract, which is the standing authorization the cash takes the place of.
        The re-quoted like-unit cost is the replacement_cost recorded on that authorization, and the company-elected
        cash basis is the re-quoted like-unit cost.
        The remaining item benefit and the remaining aggregate benefit are counted as if the standing authorization had
        already been reversed: the tier's cap for the covered item less the payments on that item counted toward the
        remaining benefits with the authorization's amount taken back out, floored at zero, and aggregate_term_limit less
        every payment on the contract counted toward them with the authorization's amount taken back out, floored at
        zero.
        A payment counts toward the remaining benefits when its event date falls within the twelve months before today,
        that is after the same calendar day twelve months earlier, whatever term its request fell in; repair,
        replacement, cash-in-lieu and out-of-network payments count toward the item, supplemental allowances count
        toward the aggregate only, and a reversal takes its authorization's amount back out of both counts.
        The company-elected cash amount is the lowest of the company-elected cash basis, the remaining item benefit and
        the remaining aggregate benefit, never below zero, rounded to the cent.
      params: [aggregate_term_limit]

  - id: homeplan_ext_company_cash_acceptance
    base_policy_refs: [homeplan_evt_cash_in_lieu, homeplan_evt_benefit_caps, homeplan_evt_repair_or_replace, homeplan_evt_service_request_and_fees]
    overwrite:
      - base_policy: homeplan_evt_cash_in_lieu
        superseded_clause: >-
          The payment equals the accepted offer amount and carries the offer's settlement_basis
        replaced_by: >-
          For the acceptance of a company-elected offer made because no network contractor can install the
          replacement, and only for such an acceptance, the payment starts from the accepted offer amount,
          adds the service-failure credits worked out below, and carries the offer's settlement_basis
          company_elected; every other accepted offer remains under the base rule.
      - base_policy: homeplan_evt_service_request_and_fees
        superseded_clause: >-
          Fees are not refunded because a failure is determined not covered, because the customer declines a
          covered repair or replacement, or because the customer accepts cash in lieu.
        replaced_by: >-
          For the acceptance of a company-elected offer on a recall of earlier Bridgewell work, and only for
          such an acceptance, part or all of the standard visit fee paid for that earlier work is returned
          within the payment as described below, while fees are still not refunded because a failure is
          determined not covered or because the customer declines a covered repair or replacement; every
          other fee remains under the base fee rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          A payment counts in the term in which its service request's request_date falls, even when
          authorized after a renewal.
        replaced_by: >-
          For a company-elected acceptance payment worked out under this rule, and only for such a payment,
          the item cap and aggregate_term_limit are measured against the payments dated within the twelve
          months before today; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          the cap is shared by every repair, replacement, cash-in-lieu settlement and out-of-network
          reimbursement for that item in the term, counted by homeplan_msr_item_benefit_paid_term
        replaced_by: >-
          For a company-elected acceptance payment worked out under this rule, and only for such a payment,
          the item cap is still shared by every repair, replacement, cash-in-lieu settlement and
          out-of-network reimbursement for that item, counted over the payments dated within the twelve
          months before today rather than over the term; every other payment remains measured by the base
          term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          Every payment on the contract, supplemental allowances included, counts toward
          aggregate_term_limit, counted by homeplan_msr_term_benefit_paid.
        replaced_by: >-
          For a company-elected acceptance payment worked out under this rule, and only for such a payment,
          every payment on the contract, supplemental allowances included, still counts toward
          aggregate_term_limit, counted over the payments dated within the twelve months before today rather
          than over the term; every other payment remains measured by the base term rule.
      - base_policy: homeplan_evt_benefit_caps
        superseded_clause: >-
          The remaining item benefit is the item cap less homeplan_msr_item_benefit_paid_term and the
          remaining aggregate benefit is aggregate_term_limit less homeplan_msr_term_benefit_paid, each
          floored at zero
        replaced_by: >-
          For a company-elected acceptance payment worked out under this rule, and only for such a payment,
          the remaining item benefit is still the item cap less the payments counted toward that item and
          the remaining aggregate benefit is still aggregate_term_limit less the payments counted toward it,
          each floored at zero, with both counted over the payments dated within the twelve months before
          today; every other payment remains measured by the base term rule.
    trigger: on_request
    subject: [homeplan_cash_in_lieu_payment, homeplan_authorization_reversal]
    computes: payment_amount
    target_tool: accept_company_cash_offer_2503240a
    params:
      delay_min_days: 7
      daily_outage_credit: 3.00
      fee_return_replacement: 1.00
      fee_return_repair: 0.50
      early_failure_days: 30
      early_install_share: 0.25
      labor_guarantee_goodwill: 100.00
      network_miss_credit_repeat: 120.00
      network_miss_credit_one: 75.00
    rule: >-
      Accepting a company-elected cash-in-lieu offer is the customer's own decision and is recorded by the
      customer; the payment carries settlement_basis company_elected, and in the same action the replacement
      authorization standing on the request is reversed in full with reversal_reason cash_in_lieu_elected,
      because once cash in lieu is paid on a request no repair or replacement remains authorized on it. The cash
      paid on accepting a company-elected settlement is not fixed until an unexpired company-elected
      cash-in-lieu offer stands on the service request. For the acceptance of a company-elected offer made
      because no network contractor can install the replacement, and only for such an acceptance, the payment
      starts from the accepted offer amount, adds the service-failure credits worked out below, and carries the
      offer's settlement_basis company_elected; every other accepted offer remains under the base rule. For a
      company-elected acceptance payment worked out under this rule, and only for such a payment, the item cap
      and aggregate_term_limit are measured against the payments dated within the twelve months before today;
      every other payment remains measured by the base term rule. For a company-elected acceptance payment
      worked out under this rule, and only for such a payment, the remaining item benefit is still the item cap
      less the payments counted toward that item and the remaining aggregate benefit is still
      aggregate_term_limit less the payments counted toward it, each floored at zero, with both counted over the
      payments dated within the twelve months before today; every other payment remains measured by the base
      term rule. For a company-elected acceptance payment worked out under this rule, and only for such a
      payment, every payment on the contract, supplemental allowances included, still counts toward
      aggregate_term_limit, counted over the payments dated within the twelve months before today rather than
      over the term; every other payment remains measured by the base term rule. For a company-elected
      acceptance payment worked out under this rule, and only for such a payment, the item cap is still shared
      by every repair, replacement, cash-in-lieu settlement and out-of-network reimbursement for that item,
      counted over the payments dated within the twelve months before today rather than over the term; every
      other payment remains measured by the base term rule. The company-elected acceptance payment is worked out
      on the service request of the replacement authorization most recently issued on the contract, from the
      most recent company-elected offer on that request. It starts from the accepted offer amount. The accepted
      offer amount is paid as the offer states it; accepting the cash also closes the claim, so the
      service-failure credits Bridgewell owes on that request (the outage credit, the visit-fee return, the
      early-failure credit and the network-miss credit described below) are settled in the same payment. The
      remaining item benefit and the remaining aggregate benefit are counted as if the standing authorization
      had already been reversed: the tier's cap for the covered item less the payments on that item counted
      toward the remaining benefits with the authorization's amount taken back out, floored at zero, and
      aggregate_term_limit less every payment on the contract counted toward them with the authorization's
      amount taken back out, floored at zero. A payment counts toward the remaining benefits when its event date
      falls within the twelve months before today, that is after the same calendar day twelve months earlier,
      whatever term its request fell in; repair, replacement, cash-in-lieu and out-of-network payments count
      toward the item, supplemental allowances count toward the aggregate only, and a reversal takes its
      authorization's amount back out of both counts. The company-elected acceptance payment is the lowest of
      the amount so started, the remaining item benefit and the remaining aggregate benefit, never below zero,
      rounded to the cent once at the end. An outage credit, a visit-fee return, an early-failure credit and a
      network-miss credit are added to the accepted offer amount as flat dollar amounts, never compounded,
      before the total is compared with the two remaining benefits. The outage credit is daily_outage_credit for
      each counted day, and the days are counted by the item and by how long the request had stood on the date
      of the accepted offer, because from that date the homeowner holds the cash that ends the outage: when the
      item leaves the home without heat, hot water or refrigeration (a heating_system, water_heater or
      refrigerator) and the request was placed at least delay_min_days days before the offer date, every
      calendar day after the request date up to and including the offer date counts; when it is any other item
      and the request was placed at least delay_min_days days before the offer date, only the days beyond the
      first delay_min_days count; when the request was placed fewer than delay_min_days days before the offer
      date, no day counts. For the acceptance of a company-elected offer on a recall of earlier Bridgewell work,
      and only for such an acceptance, part or all of the standard visit fee paid for that earlier work is
      returned within the payment as described below, while fees are still not refunded because a failure is
      determined not covered or because the customer declines a covered repair or replacement; every other fee
      remains under the base fee rule. The visit-fee return is the standard visit fee collected on the request
      of the earlier Bridgewell work that the recall names, multiplied by the return share and rounded to the
      cent: fee_return_replacement when the recall names an earlier Bridgewell replacement, whose installed unit
      has failed outright, fee_return_repair when it names an earlier Bridgewell repair, and nothing when the
      request is not a recall. The early-failure credit applies when the request is a recall of earlier
      Bridgewell work and is counted from that earlier work's completion date to the recall's request date: when
      the recall came no more than early_failure_days days after the completion, the credit is the amount
      recorded on the earlier work's authorization multiplied by early_install_share and rounded to the cent,
      returning the installation share of work that failed at once; when it came later but within the guarantee
      window of the earlier work (replacement_labor_guarantee_days for a Bridgewell-provided replacement,
      repair_guarantee_days for a repair), the credit is labor_guarantee_goodwill; when the request is not a
      recall or the recall came after that window, there is no credit. The network-miss credit is
      network_miss_credit_repeat when an assignment on the request carries dispatch_reason
      redispatch_missed_contact and, within the twelve months before today, the household has already met
      another missed contact window, counting first an assignment re-dispatched for that reason on another of
      its homeowner-contract requests and then one on a request under a Bridgewell line plan the customer holds,
      so that the miss repeats a failure of Bridgewell's contractor network the household has already met;
      network_miss_credit_one when an assignment on the request carries that dispatch_reason and no such earlier
      re-dispatch exists in that time; and nothing when no assignment on the request carries that
      dispatch_reason.
    prerequisite:
      - problem: homeplan_ext_company_elected_cash_offer
        kind: value_input
        gate: accepted_offer_amount
        form: state
        policy_source: >-
          The cash paid on accepting a company-elected settlement is not fixed until an unexpired company-elected
          cash-in-lieu offer stands on the service request.
        condition: >-
          The service request carries a homeplan_cash_in_lieu_offer row with settlement_basis company_elected whose
          offer_expiration_date is today or later.
        resolved_by: issue_company_cash_offer_eabc2067
        effect: >-
          accepted_offer_amount takes the amount of the company-elected offer standing on the request, which the
          payment starts from; with no offer on the request there is no amount to accept.
    cross_category:
      - category: lineplan
        as: history
        reads: [lineplan_claim_events.event_type, lineplan_claim_events.dispatch_reason, lineplan_claim_events.event_date]
        note: The network-miss credit's repeat tier is decided from the re-dispatches after a missed contact window recorded on the customer's line plan requests in the twelve months before today.
    inputs:
      history:
        - {table: homeplan_claim_events, aggregate: latest, field: amount, filters: {event_type: homeplan_cash_in_lieu_offer, settlement_basis: company_elected}}
        - {table: homeplan_claim_events, aggregate: count, field: homeplan_claim_event_id, filters: {event_type: homeplan_contractor_dispatch, dispatch_reason: redispatch_missed_contact}}
        - {table: homeplan_billing_entries, aggregate: sum, field: amount, filters: {event_type: homeplan_service_fee_charge, fee_type: standard_visit}}
        - {table: homeplan_claim_events, aggregate: latest, field: event_date, filters: {event_type: homeplan_work_completion}}
        - {table: homeplan_claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: [homeplan_repair_authorization, homeplan_replacement_authorization, homeplan_supplemental_allowance, homeplan_cash_in_lieu_payment, homeplan_out_of_network_reimbursement, homeplan_authorization_reversal]}}
      cross_category: [lineplan]
    compute:
      - offer_request: "LATEST('homeplan_claim_events', 'homeplan_service_request_id', event_type='homeplan_replacement_authorization')"
      - accepted_offer_amount: "LATEST('homeplan_claim_events', 'amount', event_type='homeplan_cash_in_lieu_offer', settlement_basis='company_elected', homeplan_service_request_id=offer_request)"
      - accepted_item: "LATEST('homeplan_claim_events', 'covered_item', event_type='homeplan_replacement_authorization', homeplan_service_request_id=offer_request)"
      - standing_amount: "LATEST('homeplan_claim_events', 'amount', event_type='homeplan_replacement_authorization', homeplan_service_request_id=offer_request)"
      - outage_item: "LATEST('homeplan_service_requests', 'covered_item', date_field='request_date', homeplan_service_request_id=offer_request)"
      - outage_start: "LATEST('homeplan_service_requests', 'request_date', date_field='request_date', homeplan_service_request_id=offer_request)"
      - outage_end: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_cash_in_lieu_offer', settlement_basis='company_elected', homeplan_service_request_id=offer_request)"
      - outage_age: "DAYS(outage_start, outage_end)"
      - outage_days: "outage_age if ((outage_item == 'heating_system' or outage_item == 'water_heater' or outage_item == 'refrigerator') and outage_age >= K('delay_min_days')) else ((outage_age - K('delay_min_days')) if (not (outage_item == 'heating_system' or outage_item == 'water_heater' or outage_item == 'refrigerator') and outage_age >= K('delay_min_days')) else 0)"
      - outage_credit: "RND(outage_days * K('daily_outage_credit'), 2)"
      - recall_kind: "LATEST('homeplan_service_requests', 'request_type', date_field='request_date', homeplan_service_request_id=offer_request)"
      - earlier_work_number: "LATEST('homeplan_service_requests', 'prior_authorization_number', date_field='request_date', homeplan_service_request_id=offer_request)"
      - earlier_work_request: "LATEST('homeplan_claim_events', 'homeplan_service_request_id', authorization_number=earlier_work_number)"
      - earlier_visit_fee: "SUM('homeplan_billing_entries', 'amount', event_type='homeplan_service_fee_charge', fee_type='standard_visit', homeplan_service_request_id=earlier_work_request)"
      - earlier_replacements: "COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', authorization_number=earlier_work_number)"
      - fee_return_share: "K('fee_return_replacement') if (recall_kind == 'recall' and earlier_replacements >= 1) else (K('fee_return_repair') if (recall_kind == 'recall' and earlier_replacements == 0) else 0.0)"
      - fee_return: "RND(earlier_visit_fee * fee_return_share, 2)"
      - recall_date: "LATEST('homeplan_service_requests', 'request_date', date_field='request_date', homeplan_service_request_id=offer_request)"
      - earlier_completion: "LATEST('homeplan_claim_events', 'event_date', event_type='homeplan_work_completion', authorization_number=earlier_work_number)"
      - earlier_amount: "LATEST('homeplan_claim_events', 'amount', event_type='homeplan_replacement_authorization', authorization_number=earlier_work_number) or LATEST('homeplan_claim_events', 'amount', event_type='homeplan_repair_authorization', authorization_number=earlier_work_number) or 0.0"
      - guarantee_window: "P('replacement_labor_guarantee_days') if COUNT('homeplan_claim_events', event_type='homeplan_replacement_authorization', authorization_number=earlier_work_number) >= 1 else P('repair_guarantee_days')"
      - failure_gap: "DAYS(earlier_completion, recall_date) if (recall_kind == 'recall' and earlier_completion != None) else -1"
      - early_failure_credit: "RND(earlier_amount * K('early_install_share'), 2) if (failure_gap >= 0 and failure_gap <= K('early_failure_days')) else (K('labor_guarantee_goodwill') if (failure_gap > K('early_failure_days') and failure_gap <= guarantee_window) else 0.0)"
      - recall_misses: "COUNT('homeplan_claim_events', event_type='homeplan_contractor_dispatch', dispatch_reason='redispatch_missed_contact', homeplan_service_request_id=offer_request)"
      - household_misses: "COUNT('homeplan_claim_events', within_months=12, event_type='homeplan_contractor_dispatch', dispatch_reason='redispatch_missed_contact') - COUNT('homeplan_claim_events', within_months=12, event_type='homeplan_contractor_dispatch', dispatch_reason='redispatch_missed_contact', homeplan_service_request_id=offer_request)"
      - line_plan_misses: "XCOUNT('lineplan', 'lineplan_claim_events', within_months=12, event_type='lineplan_contractor_dispatch', dispatch_reason='redispatch_missed_contact')"
      - network_miss_credit: "K('network_miss_credit_repeat') if (recall_misses >= 1 and (household_misses >= 1 or line_plan_misses >= 1)) else (K('network_miss_credit_one') if (recall_misses >= 1 and household_misses == 0 and line_plan_misses == 0) else 0.0)"
      - payment_total: "accepted_offer_amount + outage_credit + fee_return + early_failure_credit + network_miss_credit"
      - item_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization', covered_item=accepted_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization', covered_item=accepted_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment', covered_item=accepted_item) + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement', covered_item=accepted_item) - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal', covered_item=accepted_item)"
      - item_remaining_as_if: "MX(0, P(accepted_item + '_cap') - (item_paid - standing_amount))"
      - aggregate_paid: "SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_repair_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_replacement_authorization') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_supplemental_allowance') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_cash_in_lieu_payment') + SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_out_of_network_reimbursement') - SUM('homeplan_claim_events', 'amount', within_months=12, event_type='homeplan_authorization_reversal')"
      - aggregate_remaining_as_if: "MX(0, P('aggregate_term_limit') - (aggregate_paid - standing_amount))"
      - result: "RND(MX(0, MN(payment_total, item_remaining_as_if, aggregate_remaining_as_if)), 2)"
