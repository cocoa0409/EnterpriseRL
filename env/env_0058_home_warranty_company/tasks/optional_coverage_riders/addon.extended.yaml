  - id: addon_evt_benefit_authorization
    subject: [addon_benefit_authorization, addon_authorization_reversal]
    rule: >-
      A rider benefit is authorized only after a covered determination is on file for the rider service request.
      Bridgewell replaces the component when repair_estimate is at or above repair_to_replace_threshold_rate times
      replacement_cost, when parts cannot be obtained within parts_lead_time_replace_days calendar days, or when it
      cannot be repaired, and otherwise repairs. The amount paid on a repair, replacement or cash-in-lieu settlement is
      the lowest of the work's cost, per_request_cap less addon_msr_request_benefit_paid, and term_cap less
      addon_msr_term_benefit_paid. The included septic pumping pays the lower of the pumping invoice and
      septic_pumping_allowance, once per term while addon_msr_pumpings_used_term is below septic_pumping_per_term,
      and only when a covered stoppage is caused by septic backup. Allowances (haul_away_allowance on a replacement,
      permit_fee_allowance, refrigerant_allowance on a sealed-system repair, code_violation_allowance) pay the lower of
      invoice_amount and the allowance, once per type per request, and count toward term_cap. Cash in lieu equal to the
      contracted replacement_cost within the same caps is offered when a like component cannot be sourced or the
      customer asks for cash in place of an authorized replacement; it is the customer's decision, must be accepted no
      later than cash_in_lieu_offer_validity_days calendar days after the offer, is paid within cash_in_lieu_payment_days
      calendar days, and the replacement authorization it replaces is reversed in full.
      Only one repair, replacement or cash-in-lieu authorization is open per rider service request.
      An authorization is reversed in full when the work will not be performed and never after completion.
    eligibility:
      - id: covered_before_rider_benefit
        applies_to: [addon_benefit_authorization]
        kind: authorization
        condition: "A rider benefit is authorized only after a covered determination is on file for the rider service request."
        evidence_fields: [addon_claim_events.determination_outcome, addon_claim_events.addon_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_claim_events.addon_service_request_id]
          action_bindings:
            addon_claim_events.addon_service_request_id: addon_service_request_id
      - id: one_open_rider_resolution
        applies_to: [addon_benefit_authorization]
        kind: dedup
        condition: "Only one repair, replacement or cash-in-lieu authorization is open per rider service request."
        evidence_fields: [addon_claim_events.addon_service_request_id, addon_claim_events.resolution_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [addon_claim_events.addon_service_request_id]
          action_bindings:
            addon_claim_events.addon_service_request_id: addon_service_request_id
        dedup_contract:
          table: addon_claim_events
          mode: separate_record
          object_bindings: {addon_service_request_id: addon_service_request_id}
          duplicate_filters: {resolution_type: [repair, replacement, cash_in_lieu]}
          distinct_fields: [authorization_number]
    params:
      per_tier:
        Bridgewell Second Refrigerator Rider: {term_cap: "=term_cap", per_request_cap: "=per_request_cap", septic_pumping_allowance: "=septic_pumping_allowance", haul_away_allowance: "=haul_away_allowance", permit_fee_allowance: "=permit_fee_allowance", refrigerant_allowance: "=refrigerant_allowance", code_violation_allowance: "=code_violation_allowance", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days"}
        Bridgewell Septic System Rider: {term_cap: "=term_cap", per_request_cap: "=per_request_cap", septic_pumping_allowance: "=septic_pumping_allowance", haul_away_allowance: "=haul_away_allowance", permit_fee_allowance: "=permit_fee_allowance", refrigerant_allowance: "=refrigerant_allowance", code_violation_allowance: "=code_violation_allowance", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days"}
        Bridgewell Well Pump Rider: {term_cap: "=term_cap", per_request_cap: "=per_request_cap", septic_pumping_allowance: "=septic_pumping_allowance", haul_away_allowance: "=haul_away_allowance", permit_fee_allowance: "=permit_fee_allowance", refrigerant_allowance: "=refrigerant_allowance", code_violation_allowance: "=code_violation_allowance", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days"}
        Bridgewell Limited Roof Leak Rider: {term_cap: "=term_cap", per_request_cap: "=per_request_cap", septic_pumping_allowance: "=septic_pumping_allowance", haul_away_allowance: "=haul_away_allowance", permit_fee_allowance: "=permit_fee_allowance", refrigerant_allowance: "=refrigerant_allowance", code_violation_allowance: "=code_violation_allowance", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days"}
        Bridgewell Pool Equipment Rider: {term_cap: "=term_cap", per_request_cap: "=per_request_cap", septic_pumping_allowance: "=septic_pumping_allowance", haul_away_allowance: "=haul_away_allowance", permit_fee_allowance: "=permit_fee_allowance", refrigerant_allowance: "=refrigerant_allowance", code_violation_allowance: "=code_violation_allowance", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days"}
        Bridgewell Pool and Spa Equipment Rider: {term_cap: "=term_cap", per_request_cap: "=per_request_cap", septic_pumping_allowance: "=septic_pumping_allowance", haul_away_allowance: "=haul_away_allowance", permit_fee_allowance: "=permit_fee_allowance", refrigerant_allowance: "=refrigerant_allowance", code_violation_allowance: "=code_violation_allowance", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days"}
        Bridgewell Guest Unit Rider: {term_cap: "=term_cap", per_request_cap: "=per_request_cap", septic_pumping_allowance: "=septic_pumping_allowance", haul_away_allowance: "=haul_away_allowance", permit_fee_allowance: "=permit_fee_allowance", refrigerant_allowance: "=refrigerant_allowance", code_violation_allowance: "=code_violation_allowance", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate", parts_lead_time_replace_days: "=parts_lead_time_replace_days", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days"}
    formula:
      amount: "max(0, min(repair_estimate if repair_estimate < repair_to_replace_threshold_rate * replacement_cost else replacement_cost, per_request_cap - addon_msr_request_benefit_paid, term_cap - addon_msr_term_benefit_paid))"
      pumping_amount: "max(0, min(invoice_amount, septic_pumping_allowance, term_cap - addon_msr_term_benefit_paid))"
    measures: [addon_msr_request_benefit_paid, addon_msr_term_benefit_paid, addon_msr_pumpings_used_term]

# ============================================================================
# extended_policies: the multi-factor calculation policies this difficulty adds
# ============================================================================
extended_policies:
- id: addon_ext_annual_premium_correction
  base_policy_refs:
  - addon_rider_removal_and_credit
  - addon_rider_pricing
  overwrite:
  - base_policy: addon_rider_pricing
    superseded_clause: On an annual-billed base, one prorated annual rider premium is billed on added_date (or on each renewal
      term start), equal to monthly_rider_premium times 12 reduced by annual_pay_discount_rate, multiplied by addon_msr_rider_term_days
      and divided by the number of days in the base term, rounded to the cent.
    replaced_by: On an annual-billed base one prorated annual rider premium is still billed on the add date or on each renewal
      term start. For a rider on a homeowner or rental property service contract this policy sets the amount due on that
      premium as the corrected term premium, and only for such a rider; a rider on a real estate contract is still billed
      as annual-billed for each 12-month buyer contract year, at monthly_rider_premium times 12 reduced by annual_pay_discount_rate,
      multiplied by the days from the later of its term start date and add date through its term end date, both days counted,
      divided by the number of days in its base term, and rounded to the cent, and is owed no correction under this policy;
      a rider on a monthly-billed base is still billed monthly_rider_premium with each base installment.
  - base_policy: addon_rider_removal_and_credit
    superseded_clause: Each rider receives at most one credit per credit reason and period.
    replaced_by: A rider receives at most one billing correction for each prorated annual rider premium charge; for a billing
      correction this policy sets that limit, and only for such a credit, while every other rider credit is still limited
      to one per credit reason and period.
  trigger: state_due
  subject:
  - addon_premium_credit
  computes: amount
  target_tool: post_rider_premium_correction_851994d3
  params:
    size_surcharge_both: 4.25
    size_surcharge_one: 2.0
    guest_unit_sqft_mark: 600
    prepay_rate_early: 0.14
    prepay_rate_mid: 0.12
    prepay_early_days: 30
    prepay_mid_days: 15
    bundle_rate_both: 0.06
    bundle_rate_one: 0.03
    tenure_rate_long: 0.05
    tenure_rate_mid: 0.02
    tenure_terms_long: 5
    tenure_terms_mid: 3
    autopay_rate_ach: 0.02
    autopay_rate_card: 0.01
  rule: 'A rider whose homeowner or rental property base contract is billed annually is owed a premium billing correction
    when the prorated annual rider premium charged for its current term is higher than its corrected term premium, as when
    a rider added during the term was charged for the whole term. On an annual-billed base one prorated annual rider premium
    is still billed on the add date or on each renewal term start. For a rider on a homeowner or rental property service
    contract this policy sets the amount due on that premium as the corrected term premium, and only for such a rider; a
    rider on a real estate contract is still billed as annual-billed for each 12-month buyer contract year, at monthly_rider_premium
    times 12 reduced by annual_pay_discount_rate, multiplied by the days from the later of its term start date and add date
    through its term end date, both days counted, divided by the number of days in its base term, and rounded to the cent,
    and is owed no correction under this policy; a rider on a monthly-billed base is still billed monthly_rider_premium
    with each base installment. A rider receives at most one billing correction for each prorated annual rider premium charge;
    for a billing correction this policy sets that limit, and only for such a credit, while every other rider credit is
    still limited to one per credit reason and period. The corrected monthly rate is the rider''s monthly_rider_premium.
    The corrected discount rate is the rider''s annual_pay_discount_rate. The corrected annual premium is twelve times the
    corrected monthly rate, reduced once by the corrected discount rate and rounded to the cent. The corrected billed share
    is the number of days from the later of the rider''s term start date and its add date through its term end date, both
    days counted, divided by the number of days from the term start date through the term end date, both days counted. The
    corrected term premium is the corrected annual premium multiplied by the corrected billed share and rounded to the cent.
    The billing correction is the prorated annual rider premium charged with an entry date in the current term, less any
    billing correction already credited with an entry date in the current term, less the corrected term premium, rounded
    to the cent; a result of zero or less posts no billing correction, and a charge below the corrected term premium is
    never billed up by it. An entry counts as dated in the current term when the whole months from its date to the correction
    date are fewer than one more than the whole months from the term start date to the correction date. For a Guest Unit
    Rider the corrected monthly rate is raised by size_surcharge_both when the stated guest unit living area is above guest_unit_sqft_mark
    square feet and the base home''s square footage is at or above the base homeowner tier''s own oversize_home_threshold_sqft,
    raised by size_surcharge_one when exactly one of those two holds, and not raised when neither holds or the rider is
    of another kind. The corrected discount rate follows how early the latest premium payment on the base homeowner contract
    posted, counted in days from that payment''s posting date to that contract''s current term start date: prepay_rate_early
    when it posted prepay_early_days or more days before the term start date, prepay_rate_mid when it posted prepay_mid_days
    or more but fewer than prepay_early_days days before it, and the rider''s published annual_pay_discount_rate when it
    posted fewer than prepay_mid_days days before the term start date, on or after it, or when no premium payment is on
    file for the base homeowner contract or the rider''s base is not a homeowner contract. A corrected bundle rate is added
    to the corrected discount rate: bundle_rate_both when the customer holds both a utility line protection plan and an
    HVAC maintenance agreement in active status, bundle_rate_one when exactly one of the two is held in active status, and
    nothing when neither is. A corrected tenure rate is added to the corrected discount rate: tenure_rate_long when the
    base homeowner contract is in term number tenure_terms_long or later, tenure_rate_mid when it is in term number tenure_terms_mid
    or later but before tenure_terms_long, and nothing for an earlier term or a base that is not a homeowner contract. A
    corrected autopay rate is added to the corrected discount rate: autopay_rate_ach when the latest premium payment on
    the base homeowner contract was made by ach, autopay_rate_card when it was made by card, and nothing otherwise, including
    when the rider''s base is not a homeowner contract. The rates added to the corrected discount rate are summed with it
    into one total rate that reduces twelve times the corrected monthly rate once; they never compound. The corrected billed
    share follows the proration method in Bridgewell''s rider rate schedule for the region where the base homeowner property
    lies, read from its property ZIP code: for a ZIP code from 43000 through 49999 (Ohio, Indiana and Michigan), every started
    month of the rider''s term is billed, so the share is the whole months from the later of the term start date and the
    add date to the term end date, plus one, divided by twelve; for a ZIP code from 73000 through 79999 (Oklahoma and Texas),
    only completed months are billed, so the share is those whole months divided by twelve; for any other property the day
    count stated above applies.'
  prerequisite: []
  cross_category:
  - category: homeplan
    as: history
    reads:
    - square_footage
    - property_zip
    - term_start_date
    - term_number
    - oversize_home_threshold_sqft
    - homeplan_billing_entries.entry_date
    - homeplan_billing_entries.payment_method
    note: Decides the size, prepayment, tenure, autopay and billed-share tiers from the base homeowner contract, its tier
      and its premium payments.
  - category: lineplan
    as: existence
    reads:
    - status
    note: Decides the bundle tier from an active utility line protection plan.
  - category: hvaccare
    as: existence
    reads:
    - status
    note: Decides the bundle tier from an active HVAC maintenance agreement.
  compute:
  - term_window: MONTHS(F('term_start_date'), NOW) + 1
  - charged: SUM('addon_billing_entries', 'amount', within_months=term_window, date_field='entry_date', event_type='addon_premium_charge',
      charge_type='prorated_annual_rider_premium')
  - corrected_already: SUM('addon_billing_entries', 'amount', within_months=term_window, date_field='entry_date', event_type='addon_premium_credit',
      credit_reason='billing_correction')
  - base_home_sqft: CFIELD('homeplan', 'square_footage', homeplan_contract_id=F('homeplan_contract_id')) or 0
  - oversize_mark: CPARAM('homeplan', 'oversize_home_threshold_sqft', homeplan_contract_id=F('homeplan_contract_id')) or
      0
  - home_oversize: base_home_sqft > 0 and base_home_sqft >= oversize_mark
  - size_raise: K('size_surcharge_both') if (F('variant_name') == 'Bridgewell Guest Unit Rider' and F('guest_unit_sqft')
      > K('guest_unit_sqft_mark') and home_oversize) else (K('size_surcharge_one') if (F('variant_name') == 'Bridgewell
      Guest Unit Rider' and (F('guest_unit_sqft') > K('guest_unit_sqft_mark') or home_oversize)) else 0)
  - corrected_monthly: P('monthly_rider_premium') + size_raise
  - base_term_start: CFIELD('homeplan', 'term_start_date', homeplan_contract_id=F('homeplan_contract_id'))
  - last_base_payment: XLATEST('homeplan', 'homeplan_billing_entries', 'entry_date', date_field='entry_date', event_type='homeplan_premium_payment',
      homeplan_contract_id=F('homeplan_contract_id'))
  - prepay_days: DAYS(last_base_payment, base_term_start) if (last_base_payment and base_term_start) else -1
  - prepay_rate: K('prepay_rate_early') if prepay_days >= K('prepay_early_days') else (K('prepay_rate_mid') if prepay_days
      >= K('prepay_mid_days') else P('annual_pay_discount_rate'))
  - has_line: EXISTS('lineplan', status='active')
  - has_hvac: EXISTS('hvaccare', status='active')
  - bundle_rate: K('bundle_rate_both') if (has_line and has_hvac) else (K('bundle_rate_one') if (has_line or has_hvac) else
      0)
  - base_terms: CFIELD('homeplan', 'term_number', homeplan_contract_id=F('homeplan_contract_id')) or 0
  - tenure_rate: K('tenure_rate_long') if base_terms >= K('tenure_terms_long') else (K('tenure_rate_mid') if base_terms
      >= K('tenure_terms_mid') else 0)
  - base_pay_method: XLATEST('homeplan', 'homeplan_billing_entries', 'payment_method', date_field='entry_date', event_type='homeplan_premium_payment',
      homeplan_contract_id=F('homeplan_contract_id'))
  - autopay_rate: K('autopay_rate_ach') if base_pay_method == 'ach' else (K('autopay_rate_card') if base_pay_method == 'card'
      else 0)
  - discount_total: prepay_rate + bundle_rate + tenure_rate + autopay_rate
  - annual_due: RND(corrected_monthly * 12 * (1 - discount_total), 2)
  - base_days: DAYS(F('term_start_date'), F('term_end_date')) + 1
  - rider_start: MX(F('term_start_date'), F('added_date'))
  - property_zip: CFIELD('homeplan', 'property_zip', homeplan_contract_id=F('homeplan_contract_id')) or ''
  - billed_share: ((MONTHS(rider_start, F('term_end_date')) + 1) / 12) if (property_zip >= '43000' and property_zip <= '49999')
      else ((MONTHS(rider_start, F('term_end_date')) / 12) if (property_zip >= '73000' and property_zip <= '79999') else
      ((DAYS(rider_start, F('term_end_date')) + 1) / base_days))
  - corrected_premium: RND(annual_due * billed_share, 2)
  - realty_base: F('base_category') == 'realty'
  - result: 0 if realty_base else MX(0, RND(charged - corrected_already - corrected_premium, 2))
  compute_basis:
    term_window: An entry counts as dated in the current term when the whole months from its date to the correction date
      are fewer than one more than the whole months from the term start date to the correction date.
    charged: The billing correction is the prorated annual rider premium charged with an entry date in the current term,
      less any billing correction already credited with an entry date in the current term, less the corrected term premium,
      rounded to the cent
    corrected_already: less any billing correction already credited with an entry date in the current term
    base_home_sqft: the base home's square footage is at or above the base homeowner tier's own oversize_home_threshold_sqft
    oversize_mark: the base homeowner tier's own oversize_home_threshold_sqft
    home_oversize: the base home's square footage is at or above the base homeowner tier's own oversize_home_threshold_sqft
    size_raise: For a Guest Unit Rider the corrected monthly rate is raised by size_surcharge_both when the stated guest
      unit living area is above guest_unit_sqft_mark square feet and the base home's square footage is at or above the base
      homeowner tier's own oversize_home_threshold_sqft, raised by size_surcharge_one when exactly one of those two holds,
      and not raised when neither holds or the rider is of another kind.
    corrected_monthly: The corrected monthly rate is the rider's monthly_rider_premium.
    base_term_start: counted in days from that payment's posting date to that contract's current term start date
    last_base_payment: The corrected discount rate follows how early the latest premium payment on the base homeowner contract
      posted
    prepay_days: counted in days from that payment's posting date to that contract's current term start date
    prepay_rate: prepay_rate_early when it posted prepay_early_days or more days before the term start date, prepay_rate_mid
      when it posted prepay_mid_days or more but fewer than prepay_early_days days before it, and the rider's published
      annual_pay_discount_rate when it posted fewer than prepay_mid_days days before the term start date, on or after it,
      or when no premium payment is on file for the base homeowner contract or the rider's base is not a homeowner contract.
    has_line: a utility line protection plan
    has_hvac: an HVAC maintenance agreement in active status
    bundle_rate: 'A corrected bundle rate is added to the corrected discount rate: bundle_rate_both when the customer holds
      both a utility line protection plan and an HVAC maintenance agreement in active status, bundle_rate_one when exactly
      one of the two is held in active status, and nothing when neither is.'
    base_terms: when the base homeowner contract is in term number tenure_terms_long or later
    tenure_rate: 'A corrected tenure rate is added to the corrected discount rate: tenure_rate_long when the base homeowner
      contract is in term number tenure_terms_long or later, tenure_rate_mid when it is in term number tenure_terms_mid
      or later but before tenure_terms_long, and nothing for an earlier term or a base that is not a homeowner contract.'
    base_pay_method: when the latest premium payment on the base homeowner contract was made by ach
    autopay_rate: 'A corrected autopay rate is added to the corrected discount rate: autopay_rate_ach when the latest premium
      payment on the base homeowner contract was made by ach, autopay_rate_card when it was made by card, and nothing otherwise,
      including when the rider''s base is not a homeowner contract.'
    discount_total: The rates added to the corrected discount rate are summed with it into one total rate that reduces twelve
      times the corrected monthly rate once; they never compound.
    annual_due: The corrected annual premium is twelve times the corrected monthly rate, reduced once by the corrected discount
      rate and rounded to the cent.
    base_days: divided by the number of days from the term start date through the term end date, both days counted
    rider_start: the later of the rider's term start date and its add date
    property_zip: The corrected billed share follows the proration method in Bridgewell's rider rate schedule for the region
      where the base homeowner property lies, read from its property ZIP code
    billed_share: for a ZIP code from 43000 through 49999 (Ohio, Indiana and Michigan), every started month of the rider's
      term is billed, so the share is the whole months from the later of the term start date and the add date to the term
      end date, plus one, divided by twelve; for a ZIP code from 73000 through 79999 (Oklahoma and Texas), only completed
      months are billed, so the share is those whole months divided by twelve; for any other property the day count stated
      above applies.
    corrected_premium: The corrected term premium is the corrected annual premium multiplied by the corrected billed share
      and rounded to the cent.
    result: a result of zero or less posts no billing correction, and a charge below the corrected term premium is never
      billed up by it.
    realty_base: a rider on a real estate contract is still billed as annual-billed for each 12-month buyer contract year,
      at monthly_rider_premium times 12 reduced by annual_pay_discount_rate, multiplied by the days from the later of its
      term start date and add date through its term end date, both days counted, divided by the number of days in its base
      term, and rounded to the cent, and is owed no correction under this policy
  factors:
  - id: pc_guest_size
    effect: parameter
    decides: size_raise
    bindings:
    - base_home_sqft
    - oversize_mark
    - home_oversize
    - size_raise
    ladder:
    - when: a Guest Unit Rider whose stated guest unit area is above the mark and whose base home is at or above the homeowner
        tier's oversize-home threshold
      value: K('size_surcharge_both')
    - when: a Guest Unit Rider for which exactly one of those two holds
      value: K('size_surcharge_one')
    - when: otherwise
      value: '0'
    baseline:
      size_raise: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: homeplan
  - id: pc_prepayment
    effect: parameter
    decides: prepay_rate
    bindings:
    - base_term_start
    - last_base_payment
    - prepay_days
    - prepay_rate
    ladder:
    - when: the latest homeowner premium payment posted prepay_early_days or more days before the homeowner term start
      value: K('prepay_rate_early')
    - when: it posted prepay_mid_days or more but fewer than prepay_early_days days before it
      value: K('prepay_rate_mid')
    - when: otherwise (later, on or after the term start, or none on file)
      value: P('annual_pay_discount_rate')
    baseline:
      prepay_rate: P('annual_pay_discount_rate')
    evidence:
    - cross_category
    - date
    cross_difficulty: homeplan
  - id: pc_bundle
    effect: parameter
    decides: bundle_rate
    bindings:
    - has_line
    - has_hvac
    - bundle_rate
    ladder:
    - when: an active utility line protection plan and an active HVAC maintenance agreement are both held
      value: K('bundle_rate_both')
    - when: one of the two is held in active status, but not both
      value: K('bundle_rate_one')
    - when: otherwise
      value: '0'
    baseline:
      bundle_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: lineplan
  - id: pc_tenure
    effect: parameter
    decides: tenure_rate
    bindings:
    - base_terms
    - tenure_rate
    ladder:
    - when: the base homeowner contract is in term number tenure_terms_long or later
      value: K('tenure_rate_long')
    - when: it is in term number tenure_terms_mid or later but before tenure_terms_long
      value: K('tenure_rate_mid')
    - when: otherwise
      value: '0'
    baseline:
      tenure_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: pc_autopay
    effect: parameter
    decides: autopay_rate
    bindings:
    - base_pay_method
    - autopay_rate
    ladder:
    - when: the latest homeowner premium payment was made by ach
      value: K('autopay_rate_ach')
    - when: it was made by card
      value: K('autopay_rate_card')
    - when: otherwise
      value: '0'
    baseline:
      autopay_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: pc_state_proration
    effect: method
    decides: billed_share
    bindings:
    - property_zip
    - billed_share
    ladder:
    - when: the base homeowner property ZIP code is from 43000 through 49999 (Ohio, Indiana and Michigan)
      method: 'every started month is billed: whole months from the rider''s start to the term end, plus one, over twelve'
    - when: the property ZIP code is from 73000 through 79999 (Oklahoma and Texas)
      method: 'only completed months are billed: whole months from the rider''s start to the term end, over twelve'
    - when: otherwise
      method: days from the rider's start through the term end, both counted, over the term's days
    baseline:
      billed_share: (DAYS(rider_start, F('term_end_date')) + 1) / base_days
    evidence:
    - cross_category
    - date
    cross_difficulty: homeplan
  baseline:
    rule: The corrected monthly rate is the rider's monthly_rider_premium. The corrected discount rate is the rider's annual_pay_discount_rate.
      The corrected annual premium is twelve times the corrected monthly rate, reduced once by the corrected discount rate
      and rounded to the cent. The corrected billed share is the number of days from the later of the rider's term start
      date and its add date through its term end date, both days counted, divided by the number of days from the term start
      date through the term end date, both days counted. The corrected term premium is the corrected annual premium multiplied
      by the corrected billed share and rounded to the cent. The billing correction is the prorated annual rider premium
      charged with an entry date in the current term, less any billing correction already credited with an entry date in
      the current term, less the corrected term premium, rounded to the cent; a result of zero or less posts no billing
      correction, and a charge below the corrected term premium is never billed up by it. An entry counts as dated in the
      current term when the whole months from its date to the correction date are fewer than one more than the whole months
      from the term start date to the correction date.
    params:
    - monthly_rider_premium
    - annual_pay_discount_rate
  inputs:
    history:
    - table: addon_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: addon_premium_charge
        charge_type: prorated_annual_rider_premium
    - table: addon_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: addon_premium_credit
        credit_reason: billing_correction
    - category: homeplan
      table: homeplan_billing_entries
      aggregate: latest
      field: entry_date
      filters:
        event_type: homeplan_premium_payment
    - category: homeplan
      table: homeplan_billing_entries
      aggregate: latest
      field: payment_method
      filters:
        event_type: homeplan_premium_payment
    cross_category:
    - homeplan
    - lineplan
    - hvaccare
- id: addon_ext_rider_work_authorization
  base_policy_refs:
  - addon_evt_benefit_authorization
  overwrite:
  - base_policy: addon_evt_benefit_authorization
    superseded_clause: Bridgewell replaces the component when repair_estimate is at or above repair_to_replace_threshold_rate
      times replacement_cost, when parts cannot be obtained within parts_lead_time_replace_days calendar days, or when it
      cannot be repaired, and otherwise repairs.
    replaced_by: 'For a repair or replacement under a rider, the authorized work cost follows the request''s history and
      figures: when a repair of the same component was authorized on the rider no more than repair_guarantee_days calendar
      days before the authorization date, the contractor''s repair guarantee carries the work and the authorized work cost
      is zero; otherwise, when the repair estimate is at or above repair_to_replace_threshold_rate times the contracted
      replacement cost, or when the covered determination records no repair estimate above zero because the contractor found
      that the component cannot be repaired or that its parts cannot be obtained within parts_lead_time_replace_days calendar
      days, the component is replaced and the authorized work cost is the contracted replacement cost; otherwise the component
      is repaired at the repair estimate.'
  - base_policy: addon_evt_benefit_authorization
    superseded_clause: The amount paid on a repair, replacement or cash-in-lieu settlement is the lowest of the work's cost,
      per_request_cap less addon_msr_request_benefit_paid, and term_cap less addon_msr_term_benefit_paid.
    replaced_by: For a repair or replacement authorization this policy sets the amount Bridgewell pays, and only for such
      an authorization; a cash settlement the customer takes is paid under the cash-settlement rules, and cash Bridgewell
      itself offers is still paid at the lowest of the contracted replacement cost, per_request_cap less the repair, replacement
      and cash-in-lieu amounts already authorized on the request net of reversals, and term_cap less the rider benefit authorized
      in the term net of reversals.
  trigger: state_due
  subject:
  - addon_benefit_authorization
  computes: amount
  target_tool: authorize_rider_work_f2a2f75a
  params:
    limit_platinum: 3500.0
    limit_gold: 3000.0
    hvac_uplift_plus: 400.0
    hvac_uplift_basic: 200.0
    maintenance_share_lapsed: 0.8
    maintenance_share_late: 0.9
    after_hours_weekend: 150.0
    after_hours_weekday: 75.0
  rule: 'The rider''s most recently placed service request, when its coverage determination is covered, is owed one repair
    or replacement authorization, unless the customer settles it in cash. The figures used are those of that request''s
    covered coverage determination. For a repair or replacement authorization this policy sets the amount Bridgewell pays,
    and only for such an authorization; a cash settlement the customer takes is paid under the cash-settlement rules, and
    cash Bridgewell itself offers is still paid at the lowest of the contracted replacement cost, per_request_cap less the
    repair, replacement and cash-in-lieu amounts already authorized on the request net of reversals, and term_cap less the
    rider benefit authorized in the term net of reversals. The authorized work cost is the repair estimate on that determination.
    The authorized item limit is the rider''s per_request_cap. The work-authorization amount is the lowest of the authorized
    work cost, the authorized item limit less the repair, replacement and cash-in-lieu amounts already authorized on the
    rider for the same component in the current term net of every reversal recorded for that component, and the rider''s
    term_cap less the rider benefit authorized in the current term net of reversals, never below zero, and it is rounded
    to the cent. A rider benefit counts as authorized in the current term when the whole months from its date to the authorization
    date are fewer than one more than the whole months from the term start date to the authorization date. For a repair
    or replacement under a rider, the authorized work cost follows the request''s history and figures: when a repair of
    the same component was authorized on the rider no more than repair_guarantee_days calendar days before the authorization
    date, the contractor''s repair guarantee carries the work and the authorized work cost is zero; otherwise, when the
    repair estimate is at or above repair_to_replace_threshold_rate times the contracted replacement cost, or when the covered
    determination records no repair estimate above zero because the contractor found that the component cannot be repaired
    or that its parts cannot be obtained within parts_lead_time_replace_days calendar days, the component is replaced and
    the authorized work cost is the contracted replacement cost; otherwise the component is repaired at the repair estimate.
    The authorized item limit follows the base homeowner contract''s tier: limit_platinum for Bridgewell HomeCare Platinum,
    limit_gold for Bridgewell HomeCare Gold, and the rider''s per_request_cap for any other tier or base. An HVAC member
    uplift is added to the authorized item limit when the component is a guest unit heating or cooling system: hvac_uplift_plus
    when the customer holds an active Bridgewell Comfort Care Plus, Bridgewell Comfort Care Dual-System Plus or Bridgewell
    Comfort Care Premier agreement, hvac_uplift_basic when the active HVAC maintenance agreement held is at another level,
    and nothing without an active agreement or for any other component. For a guest unit heating or cooling system the lowest
    amount is paid at a maintenance share: maintenance_share_lapsed when the customer''s HVAC maintenance records show no
    completed tune-up visit dated less than twenty-four whole months before the authorization date, maintenance_share_late
    when the latest completed tune-up is dated twelve or more but fewer than twenty-four whole months before it, and in
    full when a completed tune-up is dated less than twelve whole months before it or the component is of another kind.
    An after-hours addition is added to the work-authorization amount after the limits and the maintenance share are applied,
    and it is not itself limited: after_hours_weekend when the request is an emergency placed on a Saturday or Sunday, after_hours_weekday
    when it is an emergency placed on another day, and nothing for a routine request.'
  prerequisite: []
  cross_category:
  - category: homeplan
    as: branch
    reads:
    - variant_name
    note: Decides the item-limit tier from the base homeowner contract's tier.
  - category: hvaccare
    as: history
    reads:
    - status
    - variant_name
    - hvaccare_visit_events.event_date
    - hvaccare_visit_events.visit_status
    note: Decides the HVAC member uplift from the active agreement's level and the maintenance share from its completed
      tune-up visits.
  compute:
  - req_id: LATEST('addon_service_requests', 'addon_service_request_id', date_field='request_date')
  - req_urgency: LATEST('addon_service_requests', 'urgency', date_field='request_date')
  - req_date: LATEST('addon_service_requests', 'request_date', date_field='request_date')
  - det_est: LATEST('addon_claim_events', 'repair_estimate', date_field='event_date', event_type='addon_coverage_determination',
      determination_outcome='covered', addon_service_request_id=req_id) or 0
  - det_repl: LATEST('addon_claim_events', 'replacement_cost', date_field='event_date', event_type='addon_coverage_determination',
      determination_outcome='covered', addon_service_request_id=req_id) or 0
  - det_comp: LATEST('addon_claim_events', 'component', date_field='event_date', event_type='addon_coverage_determination',
      determination_outcome='covered', addon_service_request_id=req_id)
  - last_same_repair: LATEST('addon_claim_events', 'event_date', date_field='event_date', event_type='addon_benefit_authorization',
      resolution_type='repair', component=det_comp)
  - recall_gap: DAYS(last_same_repair, NOW) if last_same_repair else 99999
  - work_cost: 0 if recall_gap <= P('repair_guarantee_days') else (det_repl if (det_est <= 0 or det_est >= P('repair_to_replace_threshold_rate')
      * det_repl) else det_est)
  - base_tier: CFIELD('homeplan', 'variant_name', homeplan_contract_id=F('homeplan_contract_id'))
  - item_limit: K('limit_platinum') if base_tier == 'Bridgewell HomeCare Platinum' else (K('limit_gold') if base_tier ==
      'Bridgewell HomeCare Gold' else P('per_request_cap'))
  - hvac_level: CFIELD('hvaccare', 'variant_name', status='active')
  - hvac_item: det_comp == 'guest_unit_heating_system' or det_comp == 'guest_unit_cooling_system'
  - hvac_plus: hvac_level == 'Bridgewell Comfort Care Plus' or hvac_level == 'Bridgewell Comfort Care Dual-System Plus'
      or hvac_level == 'Bridgewell Comfort Care Premier'
  - hvac_uplift: K('hvac_uplift_plus') if (hvac_item and hvac_plus) else (K('hvac_uplift_basic') if (hvac_item and hvac_level
      and not hvac_plus) else 0)
  - term_window: MONTHS(F('term_start_date'), NOW) + 1
  - item_paid: SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_benefit_authorization',
      component=det_comp, resolution_type='repair') + SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_benefit_authorization',
      component=det_comp, resolution_type='replacement') + SUM('addon_claim_events', 'amount', within_months=term_window,
      event_type='addon_benefit_authorization', component=det_comp, resolution_type='cash_in_lieu') - SUM('addon_claim_events',
      'amount', within_months=term_window, event_type='addon_authorization_reversal', component=det_comp)
  - term_paid: SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_benefit_authorization')
      - SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_authorization_reversal')
  - capped: MX(0, MN(work_cost, item_limit + hvac_uplift - item_paid, P('term_cap') - term_paid))
  - last_tuneup: XLATEST('hvaccare', 'hvaccare_visit_events', 'event_date', date_field='event_date', event_type='hvaccare_tuneup_visit',
      visit_status='completed')
  - tuneup_months: MONTHS(last_tuneup, NOW) if last_tuneup else 999
  - maintenance_share: K('maintenance_share_lapsed') if (hvac_item and tuneup_months >= 24) else (K('maintenance_share_late')
      if (hvac_item and tuneup_months >= 12) else 1)
  - weekday_index: DAYS('2000-01-01', req_date) % 7
  - after_hours: K('after_hours_weekend') if (req_urgency == 'emergency' and weekday_index < 2) else (K('after_hours_weekday')
      if (req_urgency == 'emergency' and weekday_index >= 2) else 0)
  - result: RND(RND(capped * maintenance_share, 2) + after_hours, 2)
  compute_basis:
    req_id: The rider's most recently placed service request, when its coverage determination is covered, is owed one repair
      or replacement authorization
    req_urgency: when the request is an emergency placed on a Saturday or Sunday
    req_date: when the request is an emergency placed on a Saturday or Sunday
    det_est: The figures used are those of that request's covered coverage determination.
    det_repl: The figures used are those of that request's covered coverage determination.
    det_comp: The figures used are those of that request's covered coverage determination.
    last_same_repair: when a repair of the same component was authorized on the rider no more than repair_guarantee_days
      calendar days before the authorization date
    recall_gap: no more than repair_guarantee_days calendar days before the authorization date
    work_cost: 'For a repair or replacement under a rider, the authorized work cost follows the request''s history and figures:
      when a repair of the same component was authorized on the rider no more than repair_guarantee_days calendar days before
      the authorization date, the contractor''s repair guarantee carries the work and the authorized work cost is zero;
      otherwise, when the repair estimate is at or above repair_to_replace_threshold_rate times the contracted replacement
      cost, or when the covered determination records no repair estimate above zero because the contractor found that the
      component cannot be repaired or that its parts cannot be obtained within parts_lead_time_replace_days calendar days,
      the component is replaced and the authorized work cost is the contracted replacement cost; otherwise the component
      is repaired at the repair estimate.'
    base_tier: The authorized item limit follows the base homeowner contract's tier
    item_limit: 'The authorized item limit follows the base homeowner contract''s tier: limit_platinum for Bridgewell HomeCare
      Platinum, limit_gold for Bridgewell HomeCare Gold, and the rider''s per_request_cap for any other tier or base.'
    hvac_level: when the customer holds an active Bridgewell Comfort Care Plus, Bridgewell Comfort Care Dual-System Plus
      or Bridgewell Comfort Care Premier agreement
    hvac_item: when the component is a guest unit heating or cooling system
    hvac_plus: an active Bridgewell Comfort Care Plus, Bridgewell Comfort Care Dual-System Plus or Bridgewell Comfort Care
      Premier agreement
    hvac_uplift: 'An HVAC member uplift is added to the authorized item limit when the component is a guest unit heating
      or cooling system: hvac_uplift_plus when the customer holds an active Bridgewell Comfort Care Plus, Bridgewell Comfort
      Care Dual-System Plus or Bridgewell Comfort Care Premier agreement, hvac_uplift_basic when the active HVAC maintenance
      agreement held is at another level, and nothing without an active agreement or for any other component.'
    term_window: A rider benefit counts as authorized in the current term when the whole months from its date to the authorization
      date are fewer than one more than the whole months from the term start date to the authorization date.
    item_paid: the repair, replacement and cash-in-lieu amounts already authorized on the rider for the same component in
      the current term net of every reversal recorded for that component
    term_paid: the rider's term_cap less the rider benefit authorized in the current term net of reversals
    capped: The work-authorization amount is the lowest of the authorized work cost, the authorized item limit less the
      repair, replacement and cash-in-lieu amounts already authorized on the rider for the same component in the current
      term net of every reversal recorded for that component, and the rider's term_cap less the rider benefit authorized
      in the current term net of reversals, never below zero, and it is rounded to the cent.
    last_tuneup: when the customer's HVAC maintenance records show no completed tune-up visit dated less than twenty-four
      whole months before the authorization date
    tuneup_months: maintenance_share_late when the latest completed tune-up is dated twelve or more but fewer than twenty-four
      whole months before it
    maintenance_share: 'For a guest unit heating or cooling system the lowest amount is paid at a maintenance share: maintenance_share_lapsed
      when the customer''s HVAC maintenance records show no completed tune-up visit dated less than twenty-four whole months
      before the authorization date, maintenance_share_late when the latest completed tune-up is dated twelve or more but
      fewer than twenty-four whole months before it, and in full when a completed tune-up is dated less than twelve whole
      months before it or the component is of another kind.'
    weekday_index: an emergency placed on a Saturday or Sunday
    after_hours: 'An after-hours addition is added to the work-authorization amount after the limits and the maintenance
      share are applied, and it is not itself limited: after_hours_weekend when the request is an emergency placed on a
      Saturday or Sunday, after_hours_weekday when it is an emergency placed on another day, and nothing for a routine request.'
    result: never below zero, and it is rounded to the cent
  factors:
  - id: rw_work_basis
    effect: method
    decides: work_cost
    bindings:
    - last_same_repair
    - recall_gap
    - work_cost
    ladder:
    - when: a repair of the same component was authorized on the rider no more than repair_guarantee_days calendar days
        earlier
      method: the contractor's repair guarantee carries the work; the authorized work cost is zero
    - when: otherwise, the repair estimate is at or above repair_to_replace_threshold_rate times the contracted replacement
        cost, or no repair estimate above zero is recorded because the component cannot be repaired or its parts cannot
        be obtained within parts_lead_time_replace_days calendar days
      method: the component is replaced; the authorized work cost is the contracted replacement cost
    - when: otherwise
      method: the component is repaired; the authorized work cost is the repair estimate
    baseline:
      work_cost: det_est
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: rw_item_limit
    effect: parameter
    decides: item_limit
    bindings:
    - base_tier
    - item_limit
    ladder:
    - when: the base homeowner contract's tier is Bridgewell HomeCare Platinum
      value: K('limit_platinum')
    - when: its tier is Bridgewell HomeCare Gold
      value: K('limit_gold')
    - when: otherwise
      value: P('per_request_cap')
    baseline:
      item_limit: P('per_request_cap')
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: rw_hvac_member
    effect: parameter
    decides: hvac_uplift
    bindings:
    - hvac_level
    - hvac_item
    - hvac_plus
    - hvac_uplift
    ladder:
    - when: a guest unit heating or cooling component and an active Comfort Care Plus, Dual-System Plus or Premier agreement
      value: K('hvac_uplift_plus')
    - when: a guest unit heating or cooling component and an active agreement at another level
      value: K('hvac_uplift_basic')
    - when: otherwise
      value: '0'
    baseline:
      hvac_uplift: '0'
    evidence:
    - cross_category
    cross_difficulty: hvaccare
  - id: rw_maintenance_share
    effect: parameter
    decides: maintenance_share
    bindings:
    - last_tuneup
    - tuneup_months
    - maintenance_share
    ladder:
    - when: a guest unit heating or cooling component and no completed tune-up dated less than twenty-four whole months
        before
      value: K('maintenance_share_lapsed')
    - when: a guest unit heating or cooling component whose household's latest completed tune-up is twelve to twenty-three
        whole months old
      value: K('maintenance_share_late')
    - when: otherwise
      value: '1'
    baseline:
      maintenance_share: '1'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: hvaccare
  - id: rw_after_hours
    effect: parameter
    decides: after_hours
    bindings:
    - req_urgency
    - req_date
    - weekday_index
    - after_hours
    ladder:
    - when: an emergency request placed on a Saturday or Sunday
      value: K('after_hours_weekend')
    - when: an emergency request placed on another day
      value: K('after_hours_weekday')
    - when: otherwise (routine)
      value: '0'
    baseline:
      after_hours: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The figures used are those of that request's covered coverage determination. The authorized work cost is the repair
      estimate on that determination. The authorized item limit is the rider's per_request_cap. The work-authorization amount
      is the lowest of the authorized work cost, the authorized item limit less the repair, replacement and cash-in-lieu
      amounts already authorized on the rider for the same component in the current term net of every reversal recorded
      for that component, and the rider's term_cap less the rider benefit authorized in the current term net of reversals,
      never below zero, and it is rounded to the cent. A rider benefit counts as authorized in the current term when the
      whole months from its date to the authorization date are fewer than one more than the whole months from the term start
      date to the authorization date.
    params:
    - per_request_cap
    - term_cap
  inputs:
    history:
    - table: addon_claim_events
      aggregate: latest
      field: repair_estimate
      filters:
        event_type: addon_coverage_determination
        determination_outcome: covered
    - table: addon_service_requests
      aggregate: latest
      field: urgency
      filters: {}
    - table: addon_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: addon_benefit_authorization
    - category: hvaccare
      table: hvaccare_visit_events
      aggregate: latest
      field: event_date
      filters:
        event_type: hvaccare_tuneup_visit
        visit_status: completed
    cross_category:
    - homeplan
    - hvaccare
- id: addon_ext_rider_removal_credit
  base_policy_refs:
  - addon_rider_removal_and_credit
  overwrite:
  - base_policy: addon_rider_removal_and_credit
    superseded_clause: On an annual-billed or real estate base, when removal_credit_on_annual is true, a removal no later
      than rider_free_look_days calendar days after added_date (addon_msr_days_since_added) is credited all rider premium
      paid in the term less addon_msr_term_benefit_paid; a later removal is credited addon_msr_rider_premium_paid_term times
      addon_msr_unexpired_term_days divided by addon_msr_rider_term_days, rounded to the cent, less addon_msr_term_benefit_paid.
    replaced_by: 'This removal credit applies to a rider the customer removes, and only to such a rider. A rider that ends
      because its base contract is cancelled is still credited by the earlier method: on an annual-billed or real estate
      base, when removal_credit_on_annual is true, an end no later than rider_free_look_days calendar days after the add
      date is credited all rider premium paid in the term less the rider benefit authorized in the term net of reversals,
      and a later end is credited the rider premium paid in the term times the calendar days after the end date through
      the term end date divided by the days from the later of the term start date and the add date through the term end
      date, both days counted, rounded to the cent, less that same net benefit; no admin fee applies, a negative result
      is credited as zero, and on a monthly-billed base nothing already billed is credited.'
  - base_policy: addon_rider_removal_and_credit
    superseded_clause: No admin fee applies to a rider removal, and a negative result is credited as zero.
    replaced_by: 'This removal credit applies to a rider the customer removes, and only to such a rider. A rider that ends
      because its base contract is cancelled is still credited by the earlier method: on an annual-billed or real estate
      base, when removal_credit_on_annual is true, an end no later than rider_free_look_days calendar days after the add
      date is credited all rider premium paid in the term less the rider benefit authorized in the term net of reversals,
      and a later end is credited the rider premium paid in the term times the calendar days after the end date through
      the term end date divided by the days from the later of the term start date and the add date through the term end
      date, both days counted, rounded to the cent, less that same net benefit; no admin fee applies, a negative result
      is credited as zero, and on a monthly-billed base nothing already billed is credited.'
  - base_policy: addon_rider_removal_and_credit
    superseded_clause: Each rider receives at most one credit per credit reason and period.
    replaced_by: A rider receives at most one removal credit, posted with its removal; for a removal credit this policy
      sets that limit, and only for such a credit, while every other rider credit is still limited to one per credit reason
      and period.
  trigger: on_request
  subject:
  - addon_rider_removal
  - addon_premium_credit
  computes: amount
  target_tool: remove_rider_with_credit_c919c4de
  params:
    retention_rate_standard: 0.1
    retention_rate_one: 0.05
    fee_standard: 25.0
    fee_mid: 15.0
    offset_share_half: 0.5
  rule: 'A rider the customer removes while keeping its base contract is removed effective on the day the customer asks,
    and on an annual-billed or real estate base the removal is settled by a removal credit posted with it. This removal
    credit applies to a rider the customer removes, and only to such a rider. A rider that ends because its base contract
    is cancelled is still credited by the earlier method: on an annual-billed or real estate base, when removal_credit_on_annual
    is true, an end no later than rider_free_look_days calendar days after the add date is credited all rider premium paid
    in the term less the rider benefit authorized in the term net of reversals, and a later end is credited the rider premium
    paid in the term times the calendar days after the end date through the term end date divided by the days from the later
    of the term start date and the add date through the term end date, both days counted, rounded to the cent, less that
    same net benefit; no admin fee applies, a negative result is credited as zero, and on a monthly-billed base nothing
    already billed is credited. A rider receives at most one removal credit, posted with its removal; for a removal credit
    this policy sets that limit, and only for such a credit, while every other rider credit is still limited to one per
    credit reason and period. The removal credit is fixed only after every prorated annual rider premium charged in the
    current term on a homeowner or rental property base above the corrected term premium carries its billing correction
    on the rider''s ledger. The removal credit is not fixed until Bridgewell has authorized the repair or replacement owed
    on the rider''s most recently placed service request, when that request''s coverage determination is covered. The retained
    rider premium is the rider premium paid with an entry date in the current term less the billing corrections credited
    with an entry date in the current term. The unearned share of the removal credit is the whole months from the removal
    date to the term end date divided by the whole months from the later of the term start date and the add date to the
    term end date, counting that divisor as at least one month. The unearned removal premium is the retained rider premium
    multiplied by the unearned share of the removal credit and rounded to the cent. The removal retention is the unearned
    removal premium multiplied by the removal retention rate, which is retention_rate_standard, and rounded to the cent.
    The removal processing fee is fee_standard. The removal benefit offset is the rider benefit authorized in the current
    term net of reversals, multiplied by the removal benefit-offset share, which is one, and rounded to the cent. The removal
    credit is the unearned removal premium less the removal retention, less the removal processing fee, less the removal
    benefit offset, rounded to the cent; a negative result is credited as zero. A rider removed from a monthly-billed base
    is credited zero, because its billing simply stops from the next base billing period. An entry counts as dated in the
    current term when the whole months from its date to the removal date are fewer than one more than the whole months from
    the term start date to the removal date. The unearned share of the removal credit follows the timing of the removal
    and the refund method in Bridgewell''s filed contract terms for the region where the base homeowner property lies, read
    from its property ZIP code: when the removal comes no later than rider_free_look_days calendar days after the add date,
    the share is one; otherwise, for a ZIP code from 43000 through 45999 (Ohio) or from 75000 through 79999 (Texas), where
    those terms refund by the day, the share is the calendar days after the removal date through the term end date divided
    by the days from the later of the term start date and the add date through the term end date, both days counted; otherwise
    it is the whole-month share stated above. The removal retention rate follows the customer''s other active Bridgewell
    plans: zero when both a utility line protection plan and an HVAC maintenance agreement are held in active status, retention_rate_one
    when exactly one of the two is, and retention_rate_standard when neither is. The removal processing fee follows the
    base homeowner contract''s current tier: zero for Bridgewell HomeCare Gold or Bridgewell HomeCare Platinum, fee_mid
    for Bridgewell HomeCare Silver or Bridgewell HomeCare Bronze, and fee_standard for any other tier or base. The removal
    benefit-offset share follows the claims terms in Bridgewell''s filed contract terms for the region where the base homeowner
    property lies, read from its property ZIP code: zero for a ZIP code from 43000 through 45999 (Ohio) or from 10000 through
    14999 (New York), where those terms deduct no paid claims from a refund of unearned premium; offset_share_half for a
    ZIP code from 73000 through 74999 (Oklahoma), where those terms deduct half of the paid claims; and one for any other
    property.'
  prerequisite:
  - problem: addon_ext_annual_premium_correction
    kind: value_input
    gate: retained_premium
    form: state
    policy_source: The removal credit is fixed only after every prorated annual rider premium charged in the current term
      on a homeowner or rental property base above the corrected term premium carries its billing correction on the rider's
      ledger.
    condition: The rider's billing ledger carries a billing-correction premium credit dated in the current term for every
      prorated annual rider premium charge of the current term on a homeowner or rental property base that exceeds the corrected
      term premium.
    resolved_by: post_rider_premium_correction_851994d3
    effect: Once the billing correction is credited, the retained rider premium falls by the corrected amount, so the unearned
      removal premium and the removal credit are worked out on the corrected premium.
  - problem: addon_ext_rider_work_authorization
    kind: state_gate
    gate: addon_claim_events.authorization_number
    form: action
    policy_source: The removal credit is not fixed until Bridgewell has authorized the repair or replacement owed on the
      rider's most recently placed service request, when that request's coverage determination is covered.
    fallback_reason: The record a covered request carries once it is settled is a benefit authorization standing on it,
      and that same kind of entry is also left by a cash settlement the customer accepts under another policy; a state naming
      any authorization would not single out the owed repair or replacement, and a state naming only repair or replacement
      authorizations would wrongly hold back a rider whose latest request was settled in cash, so the dependency is stated
      as the action.
    condition: The rider's most recently placed service request, when its coverage determination is covered and it was not
      settled in cash, carries a repair or replacement benefit authorization.
    resolved_by: authorize_rider_work_f2a2f75a
    effect: Once the owed repair or replacement is authorized, the rider's latest covered request is settled and the removal
      credit may be fixed; the authorized amount enters the rider benefit authorized in the current term that the removal
      benefit offset reads.
  cross_category:
  - category: homeplan
    as: branch
    reads:
    - property_zip
    - variant_name
    note: Decides the unearned-share method and the benefit-offset share from the base property's state, and the processing
      fee from the base tier.
  - category: lineplan
    as: existence
    reads:
    - status
    note: Decides the retention tier from an active utility line protection plan.
  - category: hvaccare
    as: existence
    reads:
    - status
    note: Decides the retention tier from an active HVAC maintenance agreement.
  compute:
  - term_window: MONTHS(F('term_start_date'), NOW) + 1
  - paid_term: SUM('addon_billing_entries', 'amount', within_months=term_window, date_field='entry_date', event_type='addon_premium_payment')
  - corrections_term: SUM('addon_billing_entries', 'amount', within_months=term_window, date_field='entry_date', event_type='addon_premium_credit',
      credit_reason='billing_correction')
  - retained_premium: paid_term - corrections_term
  - since_add: DAYS(F('added_date'), NOW)
  - property_zip: CFIELD('homeplan', 'property_zip', homeplan_contract_id=F('homeplan_contract_id')) or ''
  - rider_from: MX(F('term_start_date'), F('added_date'))
  - daily_state: (property_zip >= '43000' and property_zip <= '45999') or (property_zip >= '75000' and property_zip <= '79999')
  - unearned_share: 1 if since_add <= P('rider_free_look_days') else ((DAYS(NOW, F('term_end_date')) / (DAYS(rider_from,
      F('term_end_date')) + 1)) if (since_add > P('rider_free_look_days') and daily_state) else (MONTHS(NOW, F('term_end_date'))
      / MX(1, MONTHS(rider_from, F('term_end_date')))))
  - unearned_premium: RND(retained_premium * unearned_share, 2)
  - holds_line: EXISTS('lineplan', status='active')
  - holds_hvac: EXISTS('hvaccare', status='active')
  - retention_rate: 0 if (holds_line and holds_hvac) else (K('retention_rate_one') if (holds_line or holds_hvac) else K('retention_rate_standard'))
  - retention: RND(unearned_premium * retention_rate, 2)
  - base_tier: CFIELD('homeplan', 'variant_name', homeplan_contract_id=F('homeplan_contract_id'))
  - removal_fee: 0 if (base_tier == 'Bridgewell HomeCare Gold' or base_tier == 'Bridgewell HomeCare Platinum') else (K('fee_mid')
      if (base_tier == 'Bridgewell HomeCare Silver' or base_tier == 'Bridgewell HomeCare Bronze') else K('fee_standard'))
  - claims_zip: CFIELD('homeplan', 'property_zip', homeplan_contract_id=F('homeplan_contract_id')) or ''
  - offset_share: 0 if ((claims_zip >= '43000' and claims_zip <= '45999') or (claims_zip >= '10000' and claims_zip <= '14999'))
      else (K('offset_share_half') if (claims_zip >= '73000' and claims_zip <= '74999') else 1)
  - term_benefit: SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_benefit_authorization')
      - SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_authorization_reversal')
  - benefit_offset: RND(term_benefit * offset_share, 2)
  - result: 0 if F('billing_frequency') == 'monthly' else MX(0, RND(unearned_premium - retention - removal_fee - benefit_offset,
      2))
  compute_basis:
    term_window: An entry counts as dated in the current term when the whole months from its date to the removal date are
      fewer than one more than the whole months from the term start date to the removal date.
    paid_term: the rider premium paid with an entry date in the current term
    corrections_term: less the billing corrections credited with an entry date in the current term
    retained_premium: The retained rider premium is the rider premium paid with an entry date in the current term less the
      billing corrections credited with an entry date in the current term.
    since_add: when the removal comes no later than rider_free_look_days calendar days after the add date
    property_zip: the refund method in Bridgewell's filed contract terms for the region where the base homeowner property
      lies, read from its property ZIP code
    rider_from: the later of the term start date and the add date
    daily_state: for a ZIP code from 43000 through 45999 (Ohio) or from 75000 through 79999 (Texas), where those terms refund
      by the day
    unearned_share: 'The unearned share of the removal credit follows the timing of the removal and the refund method in
      Bridgewell''s filed contract terms for the region where the base homeowner property lies, read from its property ZIP
      code: when the removal comes no later than rider_free_look_days calendar days after the add date, the share is one;
      otherwise, for a ZIP code from 43000 through 45999 (Ohio) or from 75000 through 79999 (Texas), where those terms refund
      by the day, the share is the calendar days after the removal date through the term end date divided by the days from
      the later of the term start date and the add date through the term end date, both days counted; otherwise it is the
      whole-month share stated above.'
    unearned_premium: The unearned removal premium is the retained rider premium multiplied by the unearned share of the
      removal credit and rounded to the cent.
    holds_line: a utility line protection plan
    holds_hvac: an HVAC maintenance agreement are held in active status
    retention_rate: 'The removal retention rate follows the customer''s other active Bridgewell plans: zero when both a
      utility line protection plan and an HVAC maintenance agreement are held in active status, retention_rate_one when
      exactly one of the two is, and retention_rate_standard when neither is.'
    retention: The removal retention is the unearned removal premium multiplied by the removal retention rate, which is
      retention_rate_standard, and rounded to the cent.
    base_tier: The removal processing fee follows the base homeowner contract's current tier
    removal_fee: 'The removal processing fee follows the base homeowner contract''s current tier: zero for Bridgewell HomeCare
      Gold or Bridgewell HomeCare Platinum, fee_mid for Bridgewell HomeCare Silver or Bridgewell HomeCare Bronze, and fee_standard
      for any other tier or base.'
    claims_zip: The removal benefit-offset share follows the claims terms in Bridgewell's filed contract terms for the region
      where the base homeowner property lies, read from its property ZIP code
    offset_share: 'The removal benefit-offset share follows the claims terms in Bridgewell''s filed contract terms for the
      region where the base homeowner property lies, read from its property ZIP code: zero for a ZIP code from 43000 through
      45999 (Ohio) or from 10000 through 14999 (New York), where those terms deduct no paid claims from a refund of unearned
      premium; offset_share_half for a ZIP code from 73000 through 74999 (Oklahoma), where those terms deduct half of the
      paid claims; and one for any other property.'
    term_benefit: the rider benefit authorized in the current term net of reversals
    benefit_offset: The removal benefit offset is the rider benefit authorized in the current term net of reversals, multiplied
      by the removal benefit-offset share, which is one, and rounded to the cent.
    result: The removal credit is the unearned removal premium less the removal retention, less the removal processing fee,
      less the removal benefit offset, rounded to the cent; a negative result is credited as zero.
  factors:
  - id: rc_unearned_share
    effect: method
    decides: unearned_share
    bindings:
    - since_add
    - property_zip
    - daily_state
    - unearned_share
    ladder:
    - when: the removal comes no later than rider_free_look_days calendar days after the add date
      method: 'the share is one: the whole retained premium is unearned'
    - when: later, and the base property's ZIP code lies in a region whose filed terms refund by the day (Ohio 43000-45999,
        Texas 75000-79999)
      method: calendar days after the removal date through the term end, over the days of the rider's term, both counted
    - when: otherwise
      method: whole months from the removal date to the term end, over the whole months of the rider's term
    baseline:
      unearned_share: MONTHS(NOW, F('term_end_date')) / MX(1, MONTHS(rider_from, F('term_end_date')))
    evidence:
    - date
    - cross_category
    cross_difficulty: homeplan
  - id: rc_retention
    effect: parameter
    decides: retention_rate
    bindings:
    - holds_line
    - holds_hvac
    - retention_rate
    ladder:
    - when: an active utility line protection plan and an active HVAC maintenance agreement are both held
      value: '0'
    - when: one of the two is held, but not both
      value: K('retention_rate_one')
    - when: otherwise
      value: K('retention_rate_standard')
    baseline:
      retention_rate: K('retention_rate_standard')
    evidence:
    - cross_category
    cross_difficulty: lineplan
  - id: rc_processing_fee
    effect: parameter
    decides: removal_fee
    bindings:
    - base_tier
    - removal_fee
    ladder:
    - when: the base homeowner contract's current tier is Gold or Platinum
      value: '0'
    - when: its current tier is Silver or Bronze
      value: K('fee_mid')
    - when: otherwise
      value: K('fee_standard')
    baseline:
      removal_fee: K('fee_standard')
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: rc_offset_share
    effect: parameter
    decides: offset_share
    bindings:
    - claims_zip
    - offset_share
    ladder:
    - when: the base property's ZIP code lies in a region whose filed terms deduct no paid claims (Ohio 43000-45999, New
        York 10000-14999)
      value: '0'
    - when: it lies in Oklahoma (73000-74999), whose filed terms deduct half of the paid claims
      value: K('offset_share_half')
    - when: otherwise
      value: '1'
    baseline:
      offset_share: '1'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  baseline:
    rule: The retained rider premium is the rider premium paid with an entry date in the current term less the billing corrections
      credited with an entry date in the current term. The unearned share of the removal credit is the whole months from
      the removal date to the term end date divided by the whole months from the later of the term start date and the add
      date to the term end date, counting that divisor as at least one month. The unearned removal premium is the retained
      rider premium multiplied by the unearned share of the removal credit and rounded to the cent. The removal retention
      is the unearned removal premium multiplied by the removal retention rate, which is retention_rate_standard, and rounded
      to the cent. The removal processing fee is fee_standard. The removal benefit offset is the rider benefit authorized
      in the current term net of reversals, multiplied by the removal benefit-offset share, which is one, and rounded to
      the cent. The removal credit is the unearned removal premium less the removal retention, less the removal processing
      fee, less the removal benefit offset, rounded to the cent; a negative result is credited as zero. A rider removed
      from a monthly-billed base is credited zero, because its billing simply stops from the next base billing period. An
      entry counts as dated in the current term when the whole months from its date to the removal date are fewer than one
      more than the whole months from the term start date to the removal date.
    params:
    - retention_rate_standard
    - fee_standard
  inputs:
    history:
    - table: addon_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: addon_premium_payment
    - table: addon_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: addon_premium_credit
        credit_reason: billing_correction
    - table: addon_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: addon_benefit_authorization
    cross_category:
    - homeplan
    - lineplan
    - hvaccare
- id: addon_ext_rider_visit_fee
  base_policy_refs:
  - addon_evt_service_request_and_fees
  overwrite:
  - base_policy: addon_evt_service_request_and_fees
    superseded_clause: 'A new_failure rider request carries the base contract''s service call fee: the contract''s service_call_fee
      on a homeowner service contract, and the base tier''s service_call_fee on a rental property or real estate contract.'
    replaced_by: For a rider on a homeowner service contract this policy sets the service call fee of a new-failure rider
      request, and only for such a rider; a rider on a rental property or real estate contract still carries the base tier's
      service_call_fee.
  - base_policy: addon_evt_service_request_and_fees
    superseded_clause: When concurrent_visit_single_fee is true and the rider component is serviced in the same visit and
      trade as an open base contract request, no rider fee is charged.
    replaced_by: For a rider on a homeowner service contract, a rider request counts as serviced in the same visit and trade
      as a base contract request only when that same homeowner contract has a service request in the same trade placed on
      the same day, and then, concurrent_visit_single_fee being true, no rider visit fee is charged; for a rider on a rental
      property or real estate contract, when concurrent_visit_single_fee is true, no rider fee is charged when the component
      is serviced in the same visit and trade as an open request on that base contract.
  trigger: state_due
  subject:
  - addon_service_fee_charge
  computes: amount
  target_tool: charge_rider_visit_fee_fc58860f
  params:
    weekend_surcharge_sunday: 40.0
    weekend_surcharge_saturday: 25.0
    tier_credit_platinum: 25.0
    tier_credit_gold: 10.0
    follow_up_credit_same_trade: 40.0
    follow_up_credit_other_trade: 15.0
    sales_tax_texas: 0.0825
    sales_tax_ohio: 0.0575
  rule: 'Every new-failure rider service request owes one rider visit fee, collected on the request, unless it is serviced
    in the same visit and trade as a base contract request. For a rider on a homeowner service contract, a rider request
    counts as serviced in the same visit and trade as a base contract request only when that same homeowner contract has
    a service request in the same trade placed on the same day, and then, concurrent_visit_single_fee being true, no rider
    visit fee is charged; for a rider on a rental property or real estate contract, when concurrent_visit_single_fee is
    true, no rider fee is charged when the component is serviced in the same visit and trade as an open request on that
    base contract. A rider request placed on a Saturday or Sunday is logged without its fee, and the fee is collected by
    the representative who next handles the request with the customer. The visit fee is computed for the rider''s most recently
    placed service request. For a rider on a homeowner service contract this policy sets the service call fee of a new-failure
    rider request, and only for such a rider; a rider on a rental property or real estate contract still carries the base
    tier''s service_call_fee. The rider visit fee basis is the service call fee elected on the base homeowner contract.
    The rider visit fee is the rider visit fee basis, rounded to the cent and never below zero; a recall, a septic pumping
    request or a request serviced alongside a base visit carries no rider visit fee. The rider visit fee basis follows the
    trade of the request: when the trade is one the base homeowner plan services itself (hvac, plumbing, electrical or appliance),
    the basis is the elected fee, except that when the elected fee is above the base tier''s standard_service_call_fee the
    basis is the lower of the two; when the trade is one only riders service (pool and spa, septic, well pump or roofing),
    the basis is the higher of the elected fee and the base tier''s standard_service_call_fee. A weekend visit surcharge
    is added to the rider visit fee: weekend_surcharge_sunday when the request was placed on a Sunday, weekend_surcharge_saturday
    when it was placed on a Saturday, and nothing for a request placed on a weekday. A tier credit is taken off the rider
    visit fee: tier_credit_platinum when the base homeowner contract''s tier is Bridgewell HomeCare Platinum, tier_credit_gold
    when it is Bridgewell HomeCare Gold, and nothing for any other tier. A follow-up credit is taken off the rider visit
    fee: follow_up_credit_same_trade when another rider service request in the same trade was placed on the rider less than
    one whole month before the day the fee is charged, follow_up_credit_other_trade when no such request exists but another
    rider service request in a different trade was placed in that month, and nothing otherwise; the request being charged
    is never counted as another request. The surcharge and the credits are applied to the rider visit fee basis together,
    and the resulting fee then carries the service-call sales tax rate in Bridgewell''s tax schedule for the region where
    the base homeowner property lies, read from its property ZIP code: sales_tax_texas for a ZIP code from 75000 through
    79999 (Texas), sales_tax_ohio for a ZIP code from 43000 through 45999 (Ohio), and none for any other property; the taxed
    fee is rounded to the cent once.'
  prerequisite: []
  cross_category:
  - category: homeplan
    as: history
    reads:
    - service_call_fee
    - variant_name
    - standard_service_call_fee
    - property_zip
    - homeplan_service_requests.request_date
    - homeplan_service_requests.trade
    note: Supplies the elected and standard fees, decides the basis and tier-credit tiers, the property region's service-call
      tax rate, and whether a same-day same-trade request on the base homeowner contract makes the visit concurrent.
  compute:
  - req_type: LATEST('addon_service_requests', 'request_type', date_field='request_date')
  - req_trade: LATEST('addon_service_requests', 'trade', date_field='request_date')
  - req_date: LATEST('addon_service_requests', 'request_date', date_field='request_date')
  - same_day_base: XCOUNT('homeplan', 'homeplan_service_requests', request_date=req_date, trade=req_trade, homeplan_contract_id=F('homeplan_contract_id'))
  - elected_fee: CFIELD('homeplan', 'service_call_fee', homeplan_contract_id=F('homeplan_contract_id')) or 0
  - standard_fee: CPARAM('homeplan', 'standard_service_call_fee', homeplan_contract_id=F('homeplan_contract_id')) or 0
  - plan_trade: req_trade == 'hvac' or req_trade == 'plumbing' or req_trade == 'electrical' or req_trade == 'appliance'
  - fee_basis: MX(elected_fee, standard_fee) if (not plan_trade) else (MN(elected_fee, standard_fee) if (plan_trade and
      elected_fee > standard_fee) else elected_fee)
  - weekday_index: DAYS('2000-01-01', req_date) % 7
  - weekend_surcharge: K('weekend_surcharge_sunday') if weekday_index == 1 else (K('weekend_surcharge_saturday') if weekday_index
      == 0 else 0)
  - base_tier: CFIELD('homeplan', 'variant_name', homeplan_contract_id=F('homeplan_contract_id'))
  - tier_credit: K('tier_credit_platinum') if base_tier == 'Bridgewell HomeCare Platinum' else (K('tier_credit_gold') if
      base_tier == 'Bridgewell HomeCare Gold' else 0)
  - self_in_window: 1 if MONTHS(req_date, NOW) < 1 else 0
  - same_trade_recent: COUNT('addon_service_requests', within_months=1, date_field='request_date', trade=req_trade) - self_in_window
  - all_recent: COUNT('addon_service_requests', within_months=1, date_field='request_date') - self_in_window
  - follow_up_credit: K('follow_up_credit_same_trade') if same_trade_recent >= 1 else (K('follow_up_credit_other_trade')
      if all_recent - same_trade_recent >= 1 else 0)
  - property_zip: CFIELD('homeplan', 'property_zip', homeplan_contract_id=F('homeplan_contract_id')) or ''
  - sales_tax: K('sales_tax_texas') if (property_zip >= '75000' and property_zip <= '79999') else (K('sales_tax_ohio') if
      (property_zip >= '43000' and property_zip <= '45999') else 0)
  - no_fee: req_type != 'new_failure' or same_day_base >= 1
  - result: 0 if no_fee else MX(0, RND((fee_basis + weekend_surcharge - tier_credit - follow_up_credit) * (1 + sales_tax),
      2))
  compute_basis:
    req_type: a recall, a septic pumping request or a request serviced alongside a base visit carries no rider visit fee
    req_trade: The visit fee is computed for the rider's most recently placed service request.
    req_date: The visit fee is computed for the rider's most recently placed service request.
    same_day_base: For a rider on a homeowner service contract, a rider request counts as serviced in the same visit and
      trade as a base contract request only when that same homeowner contract has a service request in the same trade placed
      on the same day, and then, concurrent_visit_single_fee being true, no rider visit fee is charged; for a rider on a
      rental property or real estate contract, when concurrent_visit_single_fee is true, no rider fee is charged when the
      component is serviced in the same visit and trade as an open request on that base contract.
    elected_fee: The rider visit fee basis is the service call fee elected on the base homeowner contract.
    standard_fee: the base tier's standard_service_call_fee
    plan_trade: when the trade is one the base homeowner plan services itself (hvac, plumbing, electrical or appliance)
    fee_basis: 'The rider visit fee basis follows the trade of the request: when the trade is one the base homeowner plan
      services itself (hvac, plumbing, electrical or appliance), the basis is the elected fee, except that when the elected
      fee is above the base tier''s standard_service_call_fee the basis is the lower of the two; when the trade is one only
      riders service (pool and spa, septic, well pump or roofing), the basis is the higher of the elected fee and the base
      tier''s standard_service_call_fee.'
    weekday_index: weekend_surcharge_sunday when the request was placed on a Sunday, weekend_surcharge_saturday when it
      was placed on a Saturday
    weekend_surcharge: 'A weekend visit surcharge is added to the rider visit fee: weekend_surcharge_sunday when the request
      was placed on a Sunday, weekend_surcharge_saturday when it was placed on a Saturday, and nothing for a request placed
      on a weekday.'
    base_tier: A tier credit is taken off the rider visit fee
    tier_credit: 'A tier credit is taken off the rider visit fee: tier_credit_platinum when the base homeowner contract''s
      tier is Bridgewell HomeCare Platinum, tier_credit_gold when it is Bridgewell HomeCare Gold, and nothing for any other
      tier.'
    self_in_window: the request being charged is never counted as another request.
    same_trade_recent: another rider service request in the same trade was placed on the rider less than one whole month
      before the day the fee is charged
    all_recent: another rider service request in a different trade was placed in that month
    follow_up_credit: 'A follow-up credit is taken off the rider visit fee: follow_up_credit_same_trade when another rider
      service request in the same trade was placed on the rider less than one whole month before the day the fee is charged,
      follow_up_credit_other_trade when no such request exists but another rider service request in a different trade was
      placed in that month, and nothing otherwise; the request being charged is never counted as another request.'
    property_zip: the region where the base homeowner property lies, read from its property ZIP code
    sales_tax: sales_tax_texas for a ZIP code from 75000 through 79999 (Texas), sales_tax_ohio for a ZIP code from 43000
      through 45999 (Ohio), and none for any other property
    no_fee: Every new-failure rider service request owes one rider visit fee, collected on the request, unless it is serviced
      in the same visit and trade as a base contract request
    result: 'The surcharge and the credits are applied to the rider visit fee basis together, and the resulting fee then
      carries the service-call sales tax rate in Bridgewell''s tax schedule for the region where the base homeowner property
      lies, read from its property ZIP code: sales_tax_texas for a ZIP code from 75000 through 79999 (Texas), sales_tax_ohio
      for a ZIP code from 43000 through 45999 (Ohio), and none for any other property; the taxed fee is rounded to the cent
      once.'
  factors:
  - id: vf_fee_basis
    effect: method
    decides: fee_basis
    bindings:
    - elected_fee
    - standard_fee
    - plan_trade
    - fee_basis
    ladder:
    - when: the request's trade is one only riders service (pool and spa, septic, well pump or roofing)
      method: the higher of the elected fee and the base tier's standard service call fee
    - when: a trade the base plan services itself, and the elected fee is above the tier's standard fee
      method: the lower of the elected fee and the base tier's standard service call fee
    - when: otherwise
      method: the elected fee as it stands
    baseline:
      fee_basis: elected_fee
    evidence:
    - cross_category
    - history
    cross_difficulty: homeplan
  - id: vf_weekend_visit
    effect: parameter
    decides: weekend_surcharge
    bindings:
    - weekday_index
    - weekend_surcharge
    ladder:
    - when: the request was placed on a Sunday
      value: K('weekend_surcharge_sunday')
    - when: it was placed on a Saturday
      value: K('weekend_surcharge_saturday')
    - when: otherwise (a weekday)
      value: '0'
    baseline:
      weekend_surcharge: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: vf_tier_credit
    effect: parameter
    decides: tier_credit
    bindings:
    - base_tier
    - tier_credit
    ladder:
    - when: the base homeowner contract's tier is Bridgewell HomeCare Platinum
      value: K('tier_credit_platinum')
    - when: its tier is Bridgewell HomeCare Gold
      value: K('tier_credit_gold')
    - when: otherwise
      value: '0'
    baseline:
      tier_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: vf_follow_up
    effect: parameter
    decides: follow_up_credit
    bindings:
    - self_in_window
    - same_trade_recent
    - all_recent
    - follow_up_credit
    ladder:
    - when: another rider request in the same trade less than one whole month before the charge day
      value: K('follow_up_credit_same_trade')
    - when: no such request, but another rider request in a different trade in that month
      value: K('follow_up_credit_other_trade')
    - when: otherwise
      value: '0'
    baseline:
      follow_up_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: vf_sales_tax
    effect: parameter
    decides: sales_tax
    bindings:
    - property_zip
    - sales_tax
    ladder:
    - when: the base property's ZIP code is from 75000 through 79999 (Texas)
      value: K('sales_tax_texas')
    - when: it is from 43000 through 45999 (Ohio)
      value: K('sales_tax_ohio')
    - when: otherwise
      value: '0'
    baseline:
      sales_tax: '0'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  baseline:
    rule: The visit fee is computed for the rider's most recently placed service request. The rider visit fee basis is the
