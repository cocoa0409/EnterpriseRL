# Optional Coverage Add-Ons — riders a customer attaches to a homeowner, rental property or real estate
# service contract to cover items the base plan excludes. Each rider is held as its own record, co-terminous
# with its base contract.
category: addon
display_name: Optional Coverage Add-Ons

binding:
  holding_table: addon_riders
  event_tables: [addon_billing_entries, addon_service_requests, addon_claim_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [waiting_period, active, removed, ended_with_base]
  transitions:
    - {from: waiting_period, to: active, by: system, means: The rider's waiting period ends, or it was added with the base enrollment or at closing and starts with the base coverage.}
    - {from: waiting_period, to: removed, by: user, means: The customer removes the rider before its coverage starts.}
    - {from: active, to: removed, by: user, means: The customer removes the rider during the term.}
    - {from: waiting_period, to: ended_with_base, by: system, means: The base contract ended, so the rider ends on the same day.}
    - {from: active, to: ended_with_base, by: system, means: The base contract ended, so the rider ends on the same day.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Rider premium the customer owes; positive means owed to Bridgewell, negative means a credit owed back.
  - key: service_fee_balance
    unit: USD
    meaning: Service call fees collected on rider service requests and not refunded.
  - key: benefit_consumed
    unit: USD
    meaning: Dollars Bridgewell has committed under the rider (repairs, replacements, pumping, allowances, cash in lieu), net of reversals.

parameter_schema:
  monthly_rider_premium: Monthly rider premium added to the base contract's billing, USD.
  annual_pay_discount_rate: Discount on the rider premium when the base contract is billed annually, decimal fraction.
  term_cap: Total rider benefit per base contract term, USD.
  per_request_cap: Maximum rider benefit on one service request, USD.
  waiting_period_days: Calendar days after a rider is added mid-term before its items are covered, days.
  waiting_waived_at_base_enrollment: Whether a rider added on the base enrollment date or at a real estate closing starts with the base coverage, boolean.
  rider_free_look_days: Calendar days after the rider is added within which removal returns all rider premium paid less rider benefit paid, days.
  min_days_remaining_to_add: Minimum calendar days that must remain in the base term for a rider to be added mid-term, days.
  add_midterm_allowed: Whether the rider can be added during a base term, boolean.
  requires_appliance_base: Whether the base contract's tier must cover the kitchen refrigerator, boolean.
  requires_combo_base: Whether the base contract's tier must cover both systems and appliances, boolean.
  eligible_on_homeplan: Whether the rider can attach to a homeowner service contract, boolean.
  eligible_on_landlord: Whether the rider can attach to a rental property service contract, boolean.
  eligible_on_realty: Whether the rider can attach to a real estate contract for the buyer phase, boolean.
  mutually_exclusive_with: The rider that cannot be held on the same base contract at the same time, official tier name or none.
  max_per_base_contract: Maximum number of this rider on one base contract at a time, count.
  requires_private_well: Whether the property must draw water from a private well, boolean.
  requires_private_septic: Whether the property must be on a private septic system, boolean.
  requires_pool_or_spa: Whether the property must have an in-ground or above-ground pool or spa, boolean.
  pool_operating_condition_required: Whether the pool or spa equipment must be in operating condition on the date the rider is added, boolean.
  spa_equipment_covered: Whether separate spa equipment is covered, boolean.
  roof_types_covered: Roof types the rider accepts, list of roof type values.
  roof_leak_occupied_area_only: Whether only leaks over occupied living areas are covered, boolean.
  roof_condition_attestation_required: Whether the customer must attest that the roof is free of known leaks and damage when adding the rider, boolean.
  guest_unit_max_sqft: Maximum living area of the detached guest unit, square feet; 0 when not applicable.
  guest_unit_kitchen_appliances_covered: Whether guest unit kitchen appliances are covered to the base tier's appliance coverage, boolean.
  covered_components: Components the rider covers, list of component names.
  excluded_components: Components and losses the rider never covers, list of names.
  septic_pumping_per_term: Number of septic tank pumpings included per term, count.
  septic_pumping_allowance: Amount paid toward one included septic tank pumping, USD.
  haul_away_allowance: Per-request amount for removing replaced rider equipment, USD.
  permit_fee_allowance: Per-request amount for permits rider work requires, USD.
  refrigerant_allowance: Per-request amount for refrigerant recovery and recharge on a sealed-system repair, USD.
  code_violation_allowance: Per-request amount for correcting a code violation needed to complete rider work, USD.
  unknown_preexisting_covered: Whether rider failures from unknown pre-existing conditions are covered, boolean.
  repair_to_replace_threshold_rate: Repair estimate as a fraction of contracted replacement cost at or above which Bridgewell replaces, decimal fraction.
  parts_lead_time_replace_days: Calendar days of parts lead time beyond which Bridgewell replaces instead of waiting, days.
  repair_guarantee_days: Calendar days after a completed rider repair during which a recall carries no fee, days.
  routine_contact_hours: Hours within which the contractor contacts the customer on a routine rider request, hours.
  emergency_service_available: Whether rider failures can be handled as emergencies, boolean.
  emergency_contact_hours: Hours within which the contractor contacts the customer on an emergency rider request, hours; 0 when emergency service is not available.
  cash_in_lieu_offer_validity_days: Calendar days after a cash-in-lieu offer within which it may be accepted, days.
  cash_in_lieu_payment_days: Calendar days after acceptance within which cash in lieu is paid, days.
  removal_allowed_midterm: Whether the rider can be removed during the base term, boolean.
  removal_credit_on_annual: Whether removing a rider from an annually billed base credits the unused rider premium, boolean.
  concurrent_visit_single_fee: Whether a rider item serviced in the same visit and trade as a base contract request carries no separate fee, boolean.
  renews_with_base: Whether the rider renews automatically when the base contract renews, boolean.
  transferable_with_base: Whether the rider moves with the base contract on an ownership transfer, boolean.

