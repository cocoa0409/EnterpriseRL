- id: addon_ext_cash_settlement
  base_policy_refs:
  - addon_evt_benefit_authorization
  overwrite:
  - base_policy: addon_evt_benefit_authorization
    superseded_clause: Cash in lieu equal to the contracted replacement_cost within the same caps is offered when a like
      component cannot be sourced or the customer asks for cash in place of an authorized replacement; it is the customer's
      decision, must be accepted no later than cash_in_lieu_offer_validity_days calendar days after the offer, is paid within
      cash_in_lieu_payment_days calendar days, and the replacement authorization it replaces is reversed in full.
    replaced_by: 'A customer whose most recently placed rider service request has a covered coverage determination may take
      a cash settlement in place of the repair or replacement owed on it; it is the customer''s own decision, it is taken
      no later than cash_in_lieu_offer_validity_days calendar days after the covered determination, it is paid within cash_in_lieu_payment_days
      calendar days, and no repair or replacement is authorized on that request once it is taken. Cash that Bridgewell itself
      offers because a like component cannot be sourced is still settled as before: it equals the lowest of the contracted
      replacement cost, per_request_cap less the repair, replacement and cash-in-lieu amounts already authorized on the
      request net of reversals, and term_cap less the rider benefit authorized in the term net of reversals, must be accepted
      no later than cash_in_lieu_offer_validity_days calendar days after the offer, is paid within cash_in_lieu_payment_days
      calendar days, and the replacement authorization it replaces is reversed in full.'
  - base_policy: addon_evt_benefit_authorization
    superseded_clause: The amount paid on a repair, replacement or cash-in-lieu settlement is the lowest of the work's cost,
      per_request_cap less addon_msr_request_benefit_paid, and term_cap less addon_msr_term_benefit_paid.
    replaced_by: For a cash settlement the customer takes this policy sets the amount Bridgewell pays, and only for such
      a settlement; a repair or replacement is paid under the work-authorization rules, and cash Bridgewell itself offers
      is limited as stated above.
  trigger: on_request
  subject:
  - addon_benefit_authorization
  computes: amount
  target_tool: accept_rider_cash_settlement_51ff485a
  params:
    cash_rate_standard: 0.9
    cash_rate_platinum: 1.0
    cash_rate_gold: 0.95
    motor_class_rate: 0.9
    heater_class_rate: 0.85
    tax_texas: 0.0825
    tax_ohio: 0.0575
    prompt_days: 3
    settlement_deduction_late: 25.0
    settlement_deduction_standard: 50.0
    diagnosis_offset_two_plus: 70.0
    diagnosis_offset_one: 35.0
  rule: 'A customer whose most recently placed rider service request has a covered coverage determination may take a cash
    settlement in place of the repair or replacement owed on it; it is the customer''s own decision, it is taken no later
    than cash_in_lieu_offer_validity_days calendar days after the covered determination, it is paid within cash_in_lieu_payment_days
    calendar days, and no repair or replacement is authorized on that request once it is taken. Cash that Bridgewell itself
    offers because a like component cannot be sourced is still settled as before: it equals the lowest of the contracted
    replacement cost, per_request_cap less the repair, replacement and cash-in-lieu amounts already authorized on the request
    net of reversals, and term_cap less the rider benefit authorized in the term net of reversals, must be accepted no later
    than cash_in_lieu_offer_validity_days calendar days after the offer, is paid within cash_in_lieu_payment_days calendar
    days, and the replacement authorization it replaces is reversed in full. For a cash settlement the customer takes this
    policy sets the amount Bridgewell pays, and only for such a settlement; a repair or replacement is paid under the work-authorization
    rules, and cash Bridgewell itself offers is limited as stated above. The figures used are those of the settled request''s
    covered coverage determination, and the request settled is the rider''s most recently placed service request. The cash
    settlement is fixed only after the rider service request being settled carries any service call fee entry it owes. The
    cash settlement is not fixed until the component most recently authorized for replacement under the rider, when its
    removal cost is documented on its request''s coverage determination, carries its haul-away allowance authorization.
    The cash basis is the contracted replacement cost on that determination. The cash rate is cash_rate_standard. The settlement
    deduction is settlement_deduction_standard. The cash value is the cash basis multiplied by the cash rate and rounded
    to the cent, less the settlement deduction. The cash settlement is the lowest of the cash value, the contracted replacement
    cost, the rider''s per_request_cap and the rider''s term_cap less the rider benefit authorized in the current term net
    of reversals, never below zero and rounded to the cent. A rider benefit counts as authorized in the current term when
    the whole months from its date to the settlement date are fewer than one more than the whole months from the term start
    date to the settlement date. The cash basis follows the work owed on the request: when a repair of the same component
    was authorized on the rider no more than repair_guarantee_days calendar days before the settlement date, the contractor''s
    repair guarantee carries the work and the cash basis is zero; otherwise, when a repair estimate above zero is recorded
    and is below repair_to_replace_threshold_rate times the contracted replacement cost, a repair is owed and the cash basis
    is the repair estimate; otherwise the contracted replacement cost stated above applies. The cash rate follows the base
    homeowner contract''s tier: cash_rate_platinum for Bridgewell HomeCare Platinum, cash_rate_gold for Bridgewell HomeCare
    Gold, and cash_rate_standard for any other tier or base. An equipment class rate also applies, multiplied with the cash
    rate, for the wear of the failed equipment: motor_class_rate when the component is a pump, a motor or a blower, heater_class_rate
    when it is a pool heater or a spa heater, and one for any other component. The cash value excludes the installed-equipment
    sales tax rate in Bridgewell''s tax schedule for the region where the base homeowner property lies, which Bridgewell
    does not incur when it pays cash, read from the property ZIP code: the cash basis times the rates is divided by one
    plus tax_texas for a ZIP code from 75000 through 79999 (Texas), by one plus tax_ohio for a ZIP code from 43000 through
    45999 (Ohio), and by one for any other property, before rounding. The settlement deduction follows the request''s fee
    and the timing of the decision: zero when the request being settled carries its service call fee entry and the settlement
    is taken no more than prompt_days calendar days after the covered determination, settlement_deduction_late when the
    request carries its service call fee entry and the settlement is taken later, and settlement_deduction_standard otherwise.
    A diagnosis offset is also taken off the cash value for the contractor trips Bridgewell already paid on the request:
    diagnosis_offset_two_plus when the request shows two or more contractor assignments, diagnosis_offset_one when it shows
    one, and nothing when it shows none.'
  prerequisite:
  - problem: addon_ext_rider_visit_fee
    kind: value_input
    gate: fee_entries
    form: state
    policy_source: The cash settlement is fixed only after the rider service request being settled carries any service call
      fee entry it owes.
    condition: The rider billing ledger carries the service call fee entry owed on the rider service request being settled
      (a new-failure request owes one unless it counts as serviced in the same visit and trade as a base contract request).
    resolved_by: charge_rider_visit_fee_fc58860f
    effect: Once the fee entry is booked on the request, the settlement deduction moves off its standard amount (to zero
      when the settlement is taken promptly), so the cash value rises accordingly.
  - problem: addon_ext_haul_away_allowance
    kind: state_gate
    gate: addon_claim_events.allowance_type
    form: state
    policy_source: The cash settlement is not fixed until the component most recently authorized for replacement under the
      rider, when its removal cost is documented on its request's coverage determination, carries its haul-away allowance
      authorization.
    condition: The rider service request carrying the rider's most recent replacement authorization, when its coverage determination
      documents a removal cost, carries a haul-away allowance authorization.
    resolved_by: authorize_haul_away_allowance_ee656dca
    effect: Once the haul-away allowance is authorized, the rider benefit authorized in the current term is complete for
      the term-cap comparison the cash settlement makes, and the settlement may be fixed.
  cross_category:
  - category: homeplan
    as: branch
    reads:
    - variant_name
    - property_zip
    note: Decides the cash-rate tier from the base tier and the sales-tax exclusion from the base property's state.
  compute:
  - req_id: LATEST('addon_service_requests', 'addon_service_request_id', date_field='request_date')
  - det_est: LATEST('addon_claim_events', 'repair_estimate', date_field='event_date', event_type='addon_coverage_determination',
      determination_outcome='covered', addon_service_request_id=req_id) or 0
  - det_repl: LATEST('addon_claim_events', 'replacement_cost', date_field='event_date', event_type='addon_coverage_determination',
      determination_outcome='covered', addon_service_request_id=req_id) or 0
  - det_comp: LATEST('addon_claim_events', 'component', date_field='event_date', event_type='addon_coverage_determination',
      determination_outcome='covered', addon_service_request_id=req_id)
  - det_date: LATEST('addon_claim_events', 'event_date', date_field='event_date', event_type='addon_coverage_determination',
      determination_outcome='covered', addon_service_request_id=req_id)
  - last_same_repair: LATEST('addon_claim_events', 'event_date', date_field='event_date', event_type='addon_benefit_authorization',
      resolution_type='repair', component=det_comp)
  - recall_gap: DAYS(last_same_repair, NOW) if last_same_repair else 99999
  - cash_basis: 0 if recall_gap <= P('repair_guarantee_days') else (det_est if (det_est > 0 and det_est < P('repair_to_replace_threshold_rate')
      * det_repl) else det_repl)
  - base_tier: CFIELD('homeplan', 'variant_name', homeplan_contract_id=F('homeplan_contract_id'))
  - cash_rate: K('cash_rate_platinum') if base_tier == 'Bridgewell HomeCare Platinum' else (K('cash_rate_gold') if base_tier
      == 'Bridgewell HomeCare Gold' else K('cash_rate_standard'))
  - class_component: LATEST('addon_service_requests', 'component', date_field='request_date')
  - class_rate: K('motor_class_rate') if (class_component == 'pool_pump' or class_component == 'pool_motor' or class_component
      == 'spa_pump' or class_component == 'spa_blower' or class_component == 'septic_pump' or class_component == 'aerobic_pump'
      or class_component == 'well_pump') else (K('heater_class_rate') if (class_component == 'pool_heater' or class_component
      == 'spa_heater') else 1)
  - property_zip: CFIELD('homeplan', 'property_zip', homeplan_contract_id=F('homeplan_contract_id')) or ''
  - tax_rate: K('tax_texas') if (property_zip >= '75000' and property_zip <= '79999') else (K('tax_ohio') if (property_zip
      >= '43000' and property_zip <= '45999') else 0)
  - fee_entries: COUNT('addon_billing_entries', event_type='addon_service_fee_charge', addon_service_request_id=req_id)
  - days_since_det: DAYS(det_date, NOW)
  - deduction: 0 if (fee_entries >= 1 and days_since_det <= K('prompt_days')) else (K('settlement_deduction_late') if (fee_entries
      >= 1 and days_since_det > K('prompt_days')) else K('settlement_deduction_standard'))
  - assignments: COUNT('addon_claim_events', event_type='addon_contractor_dispatch', addon_service_request_id=req_id)
  - diagnosis_offset: K('diagnosis_offset_two_plus') if assignments >= 2 else (K('diagnosis_offset_one') if assignments
      == 1 else 0)
  - cash_value: RND(cash_basis * cash_rate * class_rate / (1 + tax_rate), 2) - deduction - diagnosis_offset
  - term_window: MONTHS(F('term_start_date'), NOW) + 1
  - term_paid: SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_benefit_authorization')
      - SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_authorization_reversal')
  - result: RND(MX(0, MN(cash_value, det_repl, P('per_request_cap'), P('term_cap') - term_paid)), 2)
  compute_basis:
    req_id: the request settled is the rider's most recently placed service request
    det_est: The figures used are those of the settled request's covered coverage determination
    det_repl: The figures used are those of the settled request's covered coverage determination
    det_comp: The figures used are those of the settled request's covered coverage determination
    det_date: the settlement is taken no more than prompt_days calendar days after the covered determination
    last_same_repair: when a repair of the same component was authorized on the rider no more than repair_guarantee_days
      calendar days before the settlement date
    recall_gap: no more than repair_guarantee_days calendar days before the settlement date
    cash_basis: 'The cash basis follows the work owed on the request: when a repair of the same component was authorized
      on the rider no more than repair_guarantee_days calendar days before the settlement date, the contractor''s repair
      guarantee carries the work and the cash basis is zero; otherwise, when a repair estimate above zero is recorded and
      is below repair_to_replace_threshold_rate times the contracted replacement cost, a repair is owed and the cash basis
      is the repair estimate; otherwise the contracted replacement cost stated above applies.'
    base_tier: The cash rate follows the base homeowner contract's tier
    cash_rate: 'The cash rate follows the base homeowner contract''s tier: cash_rate_platinum for Bridgewell HomeCare Platinum,
      cash_rate_gold for Bridgewell HomeCare Gold, and cash_rate_standard for any other tier or base.'
    class_component: 'for the wear of the failed equipment: motor_class_rate when the component is a pump, a motor or a
      blower'
    class_rate: 'An equipment class rate also applies, multiplied with the cash rate, for the wear of the failed equipment:
      motor_class_rate when the component is a pump, a motor or a blower, heater_class_rate when it is a pool heater or
      a spa heater, and one for any other component.'
    property_zip: the region where the base homeowner property lies, which Bridgewell does not incur when it pays cash,
      read from the property ZIP code
    tax_rate: the cash basis times the rates is divided by one plus tax_texas for a ZIP code from 75000 through 79999 (Texas),
      by one plus tax_ohio for a ZIP code from 43000 through 45999 (Ohio), and by one for any other property, before rounding.
    fee_entries: when the request being settled carries its service call fee entry
    days_since_det: the settlement is taken no more than prompt_days calendar days after the covered determination
    deduction: 'The settlement deduction follows the request''s fee and the timing of the decision: zero when the request
      being settled carries its service call fee entry and the settlement is taken no more than prompt_days calendar days
      after the covered determination, settlement_deduction_late when the request carries its service call fee entry and
      the settlement is taken later, and settlement_deduction_standard otherwise.'
    assignments: when the request shows two or more contractor assignments
    diagnosis_offset: 'A diagnosis offset is also taken off the cash value for the contractor trips Bridgewell already paid
      on the request: diagnosis_offset_two_plus when the request shows two or more contractor assignments, diagnosis_offset_one
      when it shows one, and nothing when it shows none.'
    cash_value: The cash value is the cash basis multiplied by the cash rate and rounded to the cent, less the settlement
      deduction.
    term_window: A rider benefit counts as authorized in the current term when the whole months from its date to the settlement
      date are fewer than one more than the whole months from the term start date to the settlement date.
    term_paid: the rider's term_cap less the rider benefit authorized in the current term net of reversals
    result: The cash settlement is the lowest of the cash value, the contracted replacement cost, the rider's per_request_cap
      and the rider's term_cap less the rider benefit authorized in the current term net of reversals, never below zero
      and rounded to the cent.
  factors:
  - id: cl_cash_basis
    effect: method
    decides: cash_basis
    bindings:
    - last_same_repair
    - recall_gap
    - cash_basis
    ladder:
    - when: a repair of the same component was authorized on the rider no more than repair_guarantee_days calendar days
        earlier
      method: the contractor's repair guarantee carries the work; the cash basis is zero
    - when: otherwise, a repair estimate above zero is recorded and is below repair_to_replace_threshold_rate times the
        contracted replacement cost
      method: a repair is owed; the cash basis is the repair estimate
    - when: otherwise
      method: a replacement is owed; the cash basis is the contracted replacement cost
    baseline:
      cash_basis: det_repl
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cl_tier_rate
    effect: parameter
    decides: cash_rate
    bindings:
    - base_tier
    - cash_rate
    ladder:
    - when: the base homeowner contract's tier is Bridgewell HomeCare Platinum
      value: K('cash_rate_platinum')
    - when: its tier is Bridgewell HomeCare Gold
      value: K('cash_rate_gold')
    - when: otherwise
      value: K('cash_rate_standard')
    baseline:
      cash_rate: K('cash_rate_standard')
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: cl_class_rate
    effect: parameter
    decides: class_rate
    bindings:
    - class_component
    - class_rate
    ladder:
    - when: the component is a pump, a motor or a blower
      value: K('motor_class_rate')
    - when: it is a pool heater or a spa heater
      value: K('heater_class_rate')
    - when: otherwise
      value: '1'
    baseline:
      class_rate: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: cl_tax_exclusion
    effect: parameter
    decides: tax_rate
    bindings:
    - property_zip
    - tax_rate
    ladder:
    - when: the base property's ZIP code is from 75000 through 79999 (Texas)
      value: K('tax_texas')
    - when: it is from 43000 through 45999 (Ohio)
      value: K('tax_ohio')
    - when: otherwise
      value: '0'
    baseline:
      tax_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: cl_settlement_deduction
    effect: parameter
    decides: deduction
    bindings:
    - det_date
    - fee_entries
    - days_since_det
    - deduction
    ladder:
    - when: the request carries its service call fee entry and the settlement is taken no more than prompt_days days after
        the covered determination
      value: '0'
    - when: the request carries its service call fee entry and the settlement is taken later
      value: K('settlement_deduction_late')
    - when: otherwise
      value: K('settlement_deduction_standard')
    baseline:
      deduction: K('settlement_deduction_standard')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cl_diagnosis_offset
    effect: parameter
    decides: diagnosis_offset
    bindings:
    - assignments
    - diagnosis_offset
    ladder:
    - when: the request shows two or more contractor assignments
      value: K('diagnosis_offset_two_plus')
    - when: it shows one
      value: K('diagnosis_offset_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      diagnosis_offset: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The figures used are those of the settled request's covered coverage determination, and the request settled is
      the rider's most recently placed service request. The cash basis is the contracted replacement cost on that determination.
      The cash rate is cash_rate_standard. The settlement deduction is settlement_deduction_standard. The cash value is
      the cash basis multiplied by the cash rate and rounded to the cent, less the settlement deduction. The cash settlement
      is the lowest of the cash value, the contracted replacement cost, the rider's per_request_cap and the rider's term_cap
      less the rider benefit authorized in the current term net of reversals, never below zero and rounded to the cent.
      A rider benefit counts as authorized in the current term when the whole months from its date to the settlement date
      are fewer than one more than the whole months from the term start date to the settlement date.
    params:
    - cash_rate_standard
    - settlement_deduction_standard
    - per_request_cap
    - term_cap
  inputs:
    history:
    - table: addon_claim_events
      aggregate: latest
      field: repair_estimate
      filters:
        event_type: addon_coverage_determination
        determination_outcome: covered
    - table: addon_billing_entries
      aggregate: count
      field: amount
      filters:
        event_type: addon_service_fee_charge
    - table: addon_claim_events
      aggregate: count
      field: event_date
      filters:
        event_type: addon_contractor_dispatch
    - table: addon_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: addon_benefit_authorization
    cross_category:
    - homeplan
