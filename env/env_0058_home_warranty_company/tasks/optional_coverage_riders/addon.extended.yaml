- id: addon_ext_haul_away_allowance
  base_policy_refs:
  - addon_evt_benefit_authorization
  overwrite:
  - base_policy: addon_evt_benefit_authorization
    superseded_clause: Allowances (haul_away_allowance on a replacement, permit_fee_allowance, refrigerant_allowance on
      a sealed-system repair, code_violation_allowance) pay the lower of invoice_amount and the allowance, once per type
      per request, and count toward term_cap.
    replaced_by: For a haul-away allowance this policy sets the amount Bridgewell pays, and only for such an allowance;
      every other allowance (permit, refrigerant on a sealed-system repair, code violation) still pays the lower of its
      invoice amount and its allowance, once per type per request, and counts toward term_cap.
  trigger: state_due
  subject:
  - addon_benefit_authorization
  computes: amount
  target_tool: authorize_haul_away_allowance_ee656dca
  params:
    heater_uplift: 40.0
    motor_uplift: 15.0
    condo_access_uplift: 30.0
    townhome_access_uplift: 20.0
    disposal_uplift_california: 35.0
    disposal_uplift_south_central: 10.0
    removal_share_high: 0.4
    removal_share_mid: 0.2
    removal_uplift_high: 20.0
    removal_uplift_mid: 10.0
    reassignment_uplift_two_plus: 30.0
    reassignment_uplift_one: 15.0
  rule: 'A haul-away allowance is owed once on the component most recently authorized for replacement under a rider, and
    only once the cost of removing and disposing of the old component is documented on that request''s coverage determination;
    it is authorized on that request and counts toward the rider''s term_cap. For a haul-away allowance this policy sets
    the amount Bridgewell pays, and only for such an allowance; every other allowance (permit, refrigerant on a sealed-system
    repair, code violation) still pays the lower of its invoice amount and its allowance, once per type per request, and
    counts toward term_cap. The haul-away limit is the rider''s haul_away_allowance. The haul-away allowance is the lowest
    of the documented removal cost, the haul-away limit and the rider''s term_cap less the rider benefit authorized in the
    current term net of reversals, never below zero and rounded to the cent. A rider benefit counts as authorized in the
    current term when the whole months from its date to the authorization date are fewer than one more than the whole months
    from the term start date to the authorization date. The starting haul-away limit follows the base homeowner contract''s
    tier: for Bridgewell HomeCare Platinum it is the higher of the rider''s haul_away_allowance and the tier''s own haul_away_allowance;
    for Bridgewell HomeCare Gold or Bridgewell HomeCare Silver it is the average of those two allowances; for any other
    tier or base it is the rider''s haul_away_allowance. An equipment uplift is added to the haul-away limit: heater_uplift
    when the replaced component is a pool heater or a spa heater, motor_uplift when it is a pump, a motor, a blower or a
    filter, and nothing for any other component. An access uplift is added to the haul-away limit for the dwelling recorded
    on the base homeowner contract: condo_access_uplift for a condominium, townhome_access_uplift for a townhome, and nothing
    for any other dwelling type. A disposal uplift is added to the haul-away limit for the disposal fee schedule Bridgewell''s
    network applies in the region where the base homeowner property lies, read from its property ZIP code: disposal_uplift_california
    for a ZIP code from 90000 through 96199 (California), disposal_uplift_south_central for a ZIP code from 73000 through
    79999 (Oklahoma and Texas), and nothing for any other property. A removal-share uplift is added to the haul-away limit:
    removal_uplift_high when the documented removal cost is more than removal_share_high of the component''s contracted
    replacement cost, removal_uplift_mid when it is more than removal_share_mid but no more than removal_share_high of it,
    and nothing otherwise. A reassignment uplift is added to the haul-away limit for the extra trips on that request: reassignment_uplift_two_plus
    when the request shows three or more contractor assignments, reassignment_uplift_one when it shows exactly two, and
    nothing when it shows one or none. All uplifts are added to the starting haul-away limit before the lowest amount is
    taken.'
  prerequisite: []
  cross_category:
  - category: homeplan
    as: branch
    reads:
    - variant_name
    - haul_away_allowance
    - property_type
    - property_zip
    note: Decides the starting-limit method from the base tier, and the access and disposal tiers from the base property's
      dwelling type and state.
  compute:
  - repl_request: LATEST('addon_claim_events', 'addon_service_request_id', date_field='event_date', event_type='addon_benefit_authorization',
      resolution_type='replacement')
  - repl_component: LATEST('addon_claim_events', 'component', date_field='event_date', event_type='addon_benefit_authorization',
      resolution_type='replacement')
  - removal_cost: LATEST('addon_claim_events', 'invoice_amount', date_field='event_date', event_type='addon_coverage_determination',
      addon_service_request_id=repl_request) or 0
  - repl_cost: LATEST('addon_claim_events', 'replacement_cost', date_field='event_date', event_type='addon_coverage_determination',
      addon_service_request_id=repl_request) or 0
  - base_tier: CFIELD('homeplan', 'variant_name', homeplan_contract_id=F('homeplan_contract_id'))
  - tier_haul: CPARAM('homeplan', 'haul_away_allowance', homeplan_contract_id=F('homeplan_contract_id')) or 0
  - start_limit: MX(P('haul_away_allowance'), tier_haul) if base_tier == 'Bridgewell HomeCare Platinum' else ((P('haul_away_allowance')
      + tier_haul) / 2 if (base_tier == 'Bridgewell HomeCare Gold' or base_tier == 'Bridgewell HomeCare Silver') else P('haul_away_allowance'))
  - equip_uplift: K('heater_uplift') if (repl_component == 'pool_heater' or repl_component == 'spa_heater') else (K('motor_uplift')
      if (repl_component == 'pool_pump' or repl_component == 'pool_motor' or repl_component == 'spa_pump' or repl_component
      == 'spa_blower' or repl_component == 'pool_filter' or repl_component == 'septic_pump' or repl_component == 'aerobic_pump'
      or repl_component == 'well_pump') else 0)
  - dwelling_type: CFIELD('homeplan', 'property_type', homeplan_contract_id=F('homeplan_contract_id'))
  - access_uplift: K('condo_access_uplift') if dwelling_type == 'condominium' else (K('townhome_access_uplift') if dwelling_type
      == 'townhome' else 0)
  - property_zip: CFIELD('homeplan', 'property_zip', homeplan_contract_id=F('homeplan_contract_id')) or ''
  - disposal_uplift: K('disposal_uplift_california') if (property_zip >= '90000' and property_zip <= '96199') else (K('disposal_uplift_south_central')
      if (property_zip >= '73000' and property_zip <= '79999') else 0)
  - removal_share: removal_cost / repl_cost if repl_cost > 0 else 0
  - share_uplift: K('removal_uplift_high') if removal_share > K('removal_share_high') else (K('removal_uplift_mid') if removal_share
      > K('removal_share_mid') else 0)
  - assignments: COUNT('addon_claim_events', event_type='addon_contractor_dispatch', addon_service_request_id=repl_request)
  - reassignment_uplift: K('reassignment_uplift_two_plus') if assignments >= 3 else (K('reassignment_uplift_one') if assignments
      == 2 else 0)
  - haul_limit: start_limit + equip_uplift + access_uplift + disposal_uplift + share_uplift + reassignment_uplift
  - term_window: MONTHS(F('term_start_date'), NOW) + 1
  - term_paid: SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_benefit_authorization')
      - SUM('addon_claim_events', 'amount', within_months=term_window, event_type='addon_authorization_reversal')
  - result: RND(MX(0, MN(removal_cost, haul_limit, P('term_cap') - term_paid)), 2)
  compute_basis:
    repl_request: A haul-away allowance is owed once on the component most recently authorized for replacement under a rider
    repl_component: A haul-away allowance is owed once on the component most recently authorized for replacement under a
      rider
    removal_cost: only once the cost of removing and disposing of the old component is documented on that request's coverage
      determination
    repl_cost: the component's contracted replacement cost
    base_tier: The starting haul-away limit follows the base homeowner contract's tier
    tier_haul: the tier's own haul_away_allowance
    start_limit: 'The starting haul-away limit follows the base homeowner contract''s tier: for Bridgewell HomeCare Platinum
      it is the higher of the rider''s haul_away_allowance and the tier''s own haul_away_allowance; for Bridgewell HomeCare
      Gold or Bridgewell HomeCare Silver it is the average of those two allowances; for any other tier or base it is the
      rider''s haul_away_allowance.'
    equip_uplift: 'An equipment uplift is added to the haul-away limit: heater_uplift when the replaced component is a pool
      heater or a spa heater, motor_uplift when it is a pump, a motor, a blower or a filter, and nothing for any other component.'
    dwelling_type: for the dwelling recorded on the base homeowner contract
    access_uplift: 'An access uplift is added to the haul-away limit for the dwelling recorded on the base homeowner contract:
      condo_access_uplift for a condominium, townhome_access_uplift for a townhome, and nothing for any other dwelling type.'
    property_zip: the region where the base homeowner property lies, read from its property ZIP code
    disposal_uplift: 'A disposal uplift is added to the haul-away limit for the disposal fee schedule Bridgewell''s network
      applies in the region where the base homeowner property lies, read from its property ZIP code: disposal_uplift_california
      for a ZIP code from 90000 through 96199 (California), disposal_uplift_south_central for a ZIP code from 73000 through
      79999 (Oklahoma and Texas), and nothing for any other property.'
    removal_share: when the documented removal cost is more than removal_share_high of the component's contracted replacement
      cost
    share_uplift: 'A removal-share uplift is added to the haul-away limit: removal_uplift_high when the documented removal
      cost is more than removal_share_high of the component''s contracted replacement cost, removal_uplift_mid when it is
      more than removal_share_mid but no more than removal_share_high of it, and nothing otherwise.'
    assignments: when the request shows three or more contractor assignments
    reassignment_uplift: 'A reassignment uplift is added to the haul-away limit for the extra trips on that request: reassignment_uplift_two_plus
      when the request shows three or more contractor assignments, reassignment_uplift_one when it shows exactly two, and
      nothing when it shows one or none.'
    haul_limit: All uplifts are added to the starting haul-away limit before the lowest amount is taken.
    term_window: A rider benefit counts as authorized in the current term when the whole months from its date to the authorization
      date are fewer than one more than the whole months from the term start date to the authorization date.
    term_paid: the rider's term_cap less the rider benefit authorized in the current term net of reversals
    result: The haul-away allowance is the lowest of the documented removal cost, the haul-away limit and the rider's term_cap
      less the rider benefit authorized in the current term net of reversals, never below zero and rounded to the cent.
  factors:
  - id: ha_limit_source
    effect: method
    decides: start_limit
    bindings:
    - base_tier
    - tier_haul
    - start_limit
    ladder:
    - when: the base homeowner contract's tier is Bridgewell HomeCare Platinum
      method: the higher of the rider's haul-away allowance and the tier's own haul-away allowance
    - when: its tier is Bridgewell HomeCare Gold or Bridgewell HomeCare Silver
      method: the average of the rider's and the tier's haul-away allowances
    - when: otherwise
      method: the rider's own haul-away allowance
    baseline:
      start_limit: P('haul_away_allowance')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: homeplan
  - id: ha_equipment
    effect: parameter
    decides: equip_uplift
    bindings:
    - repl_component
    - equip_uplift
    ladder:
    - when: the replaced component is a pool heater or a spa heater
      value: K('heater_uplift')
    - when: it is a pump, a motor, a blower or a filter
      value: K('motor_uplift')
    - when: otherwise
      value: '0'
    baseline:
      equip_uplift: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: ha_access
    effect: parameter
    decides: access_uplift
    bindings:
    - dwelling_type
    - access_uplift
    ladder:
    - when: the base homeowner contract records a condominium
      value: K('condo_access_uplift')
    - when: it records a townhome
      value: K('townhome_access_uplift')
    - when: otherwise
      value: '0'
    baseline:
      access_uplift: '0'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: ha_disposal_state
    effect: parameter
    decides: disposal_uplift
    bindings:
    - property_zip
    - disposal_uplift
    ladder:
    - when: the base property's ZIP code is from 90000 through 96199 (California)
      value: K('disposal_uplift_california')
    - when: it is from 73000 through 79999 (Oklahoma and Texas)
      value: K('disposal_uplift_south_central')
    - when: otherwise
      value: '0'
    baseline:
      disposal_uplift: '0'
    evidence:
    - cross_category
    cross_difficulty: homeplan
  - id: ha_removal_share
    effect: parameter
    decides: share_uplift
    bindings:
    - removal_cost
    - repl_cost
    - removal_share
    - share_uplift
    ladder:
    - when: the documented removal cost is more than removal_share_high of the contracted replacement cost
      value: K('removal_uplift_high')
    - when: it is more than removal_share_mid but no more than removal_share_high of it
      value: K('removal_uplift_mid')
    - when: otherwise
      value: '0'
    baseline:
      share_uplift: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: ha_reassignment
    effect: parameter
    decides: reassignment_uplift
    bindings:
    - assignments
    - reassignment_uplift
    ladder:
    - when: the request shows three or more contractor assignments
      value: K('reassignment_uplift_two_plus')
    - when: it shows exactly two
      value: K('reassignment_uplift_one')
    - when: otherwise (one or none)
      value: '0'
    baseline:
      reassignment_uplift: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The haul-away limit is the rider's haul_away_allowance. The haul-away allowance is the lowest of the documented
      removal cost, the haul-away limit and the rider's term_cap less the rider benefit authorized in the current term net
      of reversals, never below zero and rounded to the cent. A rider benefit counts as authorized in the current term when
      the whole months from its date to the authorization date are fewer than one more than the whole months from the term
      start date to the authorization date.
    params:
    - haul_away_allowance
    - term_cap
  inputs:
    history:
    - table: addon_claim_events
      aggregate: latest
      field: invoice_amount
      filters:
        event_type: addon_coverage_determination
    - table: addon_claim_events
      aggregate: count
      field: event_date
      filters:
        event_type: addon_contractor_dispatch
    - table: addon_claim_events
      aggregate: sum
      field: amount
      filters:
