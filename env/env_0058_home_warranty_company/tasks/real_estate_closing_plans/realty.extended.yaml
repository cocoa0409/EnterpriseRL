category: realty
display_name: Real Estate Service Contracts
binding:
  holding_table: realty_contracts
  event_tables:
  - realty_billing_entries
  - realty_service_requests
  - realty_claim_events
  status_field: status
  variant_field: variant_name
  quantity_fields:
    invoice_balance: invoice_balance
lifecycle:
  states:
  - listing_coverage
  - awaiting_closing
  - closed_pending_payment
  - active
  - listing_expired
  - voided
  - cancelled
  - expired
  - converted
  transitions:
  - from: listing_coverage
    to: closed_pending_payment
    by: system
    means: >-
      The sale closes; the buyer becomes the contract holder and the plan invoice awaits payment from escrow.
  - from: awaiting_closing
    to: closed_pending_payment
    by: system
    means: The sale closes on a buyer-only order and the plan invoice awaits payment from escrow.
  - from: closed_pending_payment
    to: active
    by: system
    means: >-
      The plan invoice is paid within the escrow payment window and buyer coverage is in force from the closing
      date.
  - from: closed_pending_payment
    to: voided
    by: system
    means: The plan invoice is not paid within the escrow payment window and the plan is voided.
  - from: listing_coverage
    to: listing_expired
    by: system
    means: The seller listing period ends without a closing.
  - from: listing_coverage
    to: cancelled
    by: agent
    means: The ordering agent cancels the order because the listing was withdrawn or the sale will not proceed.
  - from: awaiting_closing
    to: cancelled
    by: agent
    means: The ordering agent cancels a buyer-only order before closing
    or the order lapses unclosed.: null
  - from: active
    to: cancelled
    by: user
    means: The buyer cancels buyer coverage during the term.
  - from: active
    to: expired
    by: system
    means: The buyer term ends.
  - from: active
    to: converted
    by: user
    means: >-
      The buyer accepts the direct renewal offer before the term ends and continues under a homeowner service contract.
  - from: expired
    to: converted
    by: user
    means: >-
      The buyer accepts the direct renewal offer shortly after the term ended and continues under a homeowner service
      contract.
accounts:
- key: invoice_balance
  unit: USD
  meaning: >-
    Amount owed on the contract's invoices (the plan premium invoiced to escrow and any failed-sale charge billed
    to the seller); negative means a credit owed back.
- key: service_fee_balance
  unit: USD
  meaning: Service call fees collected on the contract's service requests and not refunded.
- key: benefit_consumed
  unit: USD
  meaning: >-
    Dollars Bridgewell has committed toward covered repairs, replacements, cash in lieu and rekeying on the contract,
    net of reversals.
parameter_schema:
  base_premium: Plan premium for one dwelling unit under the oversize threshold, for the full buyer term, USD.
  oversize_threshold_sqft: Living-area square footage at or above which the oversize surcharge applies, square feet.
  oversize_premium_surcharge: Amount added to the plan premium for a home at or above the oversize threshold, USD.
  condo_premium_discount: Amount deducted from the plan premium for a condominium or townhome, USD.
  additional_unit_premium: >-
    Amount added to the plan premium for each dwelling unit beyond the first on a two- to four-unit property, USD.
  buyer_term_months: Length of buyer coverage counted from the closing date, calendar months.
  service_call_fee: Buyer-phase service call fee per service request, USD.
  seller_coverage_available: Whether seller listing coverage can be included with a listing order, boolean.
  seller_coverage_max_days: Calendar days of seller listing coverage from the order date before any extension, days.
  seller_extension_days: Calendar days one listing extension adds to the listing coverage end date, days.
  max_seller_extensions: Maximum number of listing extensions per order, count.
  seller_item_cap: Limit per covered item during seller listing coverage, USD.
  seller_aggregate_cap: Total limit for all seller listing coverage claims on the order, USD.
  seller_hvac_covered: Whether heating, cooling and ductwork are covered during seller listing coverage, boolean.
  seller_service_call_fee: Seller-phase service call fee per service request, USD.
  failed_sale_bill_due_days: Calendar days after a failed-sale charge is billed by which the seller must pay it,
    days.
  escrow_payment_window_days: Calendar days after closing within which the plan invoice must be paid to keep buyer
    coverage, days.
  pending_order_expiry_days: Calendar days after the expected closing date after which an unclosed buyer-only order
    lapses, days.
  unknown_preexisting_covered: >-
    Whether buyer-phase failures from unknown, undetectable pre-existing conditions are covered, boolean.
  inspection_required_for_preexisting: Whether unknown pre-existing coverage requires a home inspection completed
    before closing, boolean.
  code_violation_allowance: Per-request buyer-phase amount for correcting a code violation needed to complete covered
    work, USD.
  permit_fee_allowance: Per-request buyer-phase amount for permits covered work requires, USD.
  haul_away_allowance: Per-request buyer-phase amount for removing replaced equipment, USD.
  refrigerant_allowance: Per-contract-year buyer-phase amount for refrigerant recovery and recharge, USD.
  aggregate_contract_year_limit: Total buyer-phase limit per contract year across all items, USD.
  heating_system_cap: Buyer-phase limit per contract year for the heating system, USD; 0.00 means not covered.
  cooling_system_cap: Buyer-phase limit per contract year for the cooling system, USD; 0.00 means not covered.
  ductwork_cap: Buyer-phase limit per contract year for ductwork, USD; 0.00 means not covered.
  plumbing_cap: >-
    Buyer-phase limit per contract year for interior plumbing leaks and stoppages, USD; 0.00 means not covered.
  water_heater_cap: Buyer-phase limit per contract year for the water heater, USD; 0.00 means not covered.
  electrical_cap: Buyer-phase limit per contract year for the electrical system, USD; 0.00 means not covered.
  kitchen_appliance_cap: >-
    Buyer-phase limit per contract year for each kitchen appliance (refrigerator, range, dishwasher, built-in microwave),
    USD; 0.00 means not covered.
  laundry_appliance_cap: Buyer-phase limit per contract year for each laundry appliance, USD; 0.00 means not covered.
  garage_door_opener_cap: Buyer-phase limit per contract year for the garage door opener, USD; 0.00 means not covered.
  roof_leak_cap: >-
    Buyer-phase limit per contract year for limited roof leak repair over occupied living space, USD; 0.00 means
    not covered.
  rekey_lock_count: Number of exterior keyed locks rekeyed for the buyer, count; 0 means no rekey benefit.
  rekey_request_window_days: Calendar days after the closing date within which the rekey benefit must be requested,
    days.
  repair_guarantee_days: >-
    Calendar days after a completed repair during which a recall for the same failure carries no fee, days.
  routine_contact_hours: Hours within which the assigned contractor contacts the customer on a routine request,
    hours.
  emergency_contact_hours: Hours within which the assigned contractor contacts the customer on an emergency request,
    hours.
  systems_coverage_delay_days: >-
    Calendar days after closing before heating, cooling, ductwork, plumbing, water heater and electrical coverage
    starts, days; 0 means from closing.
  repair_to_replace_threshold_rate: >-
    Repair estimate as a fraction of contracted replacement cost at or above which Bridgewell replaces, decimal
    fraction.
  parts_lead_time_replace_days: Calendar days of parts lead time beyond which Bridgewell replaces instead of waiting,
    days.
  cash_in_lieu_offer_validity_days: Calendar days after a cash-in-lieu offer within which it may be accepted, days.
  cash_in_lieu_payment_days: Calendar days after acceptance within which cash in lieu is paid, days.
  buyer_free_look_days: >-
    Calendar days after the closing date within which a buyer cancellation receives the free-look refund, days.
  buyer_cancel_admin_fee: Administrative fee deducted from a buyer's pro-rata refund after the free-look period,
    USD.
  refund_processing_days: Calendar days after a buyer cancellation within which the refund is issued, days.
  conversion_offer_days_before_end: Calendar days before the buyer term end on which the direct renewal offer is
    issued, days.
  conversion_tier: The homeowner service contract tier offered on conversion, official tier name.
