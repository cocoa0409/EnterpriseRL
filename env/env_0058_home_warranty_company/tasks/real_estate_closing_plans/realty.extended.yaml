- id: realty_ext_seller_settlement_payment
  base_policy_refs:
  - realty_closing_and_escrow
  - realty_failed_sale_charges
  overwrite:
  - base_policy: realty_failed_sale_charges
    superseded_clause: The charge is billed to the seller and due failed_sale_bill_due_days calendar days after
      billing.
    replaced_by: >-
      For a failed-sale charge the seller asks to spread, and only for such a charge, the settlement plan this policy
      works out replaces the single due date: the first settlement payment is taken when the plan is set up and
      the rest of the charge falls due in equal monthly installments, the first of them on the charge's due date;
      every other failed-sale charge remains billed to the seller and due failed_sale_bill_due_days calendar days
      after billing.
  trigger: on_request
  subject:
  - realty_payment
  computes: amount
  target_tool: pay_failed_sale_charge_by_card_a1a6aa51
  params:
    returned_upper_count: 2
    standing_upper_share: 0.3
    standing_lower_share: 0.15
    tenure_short_months: 6
    tenure_mid_months: 24
    tenure_short_share: 0.25
    tenure_mid_share: 0.1
    autopay_ach_relief: 0.1
    autopay_card_relief: 0.05
    two_installment_floor: 400.0
    three_installment_floor: 900.0
  rule: >-
    A seller who asks to spread a failed-sale charge settles it under a settlement plan and pays the first settlement
    payment directly by card; the payment is posted against the failed-sale invoice and applied to the oldest open
    invoice first. A seller's settlement payment toward listing-period service is not taken until the order's billing
    history carries the failed-sale charge invoice billed for that service. For a failed-sale charge the seller
    asks to spread, and only for such a charge, the settlement plan this policy works out replaces the single due
    date: the first settlement payment is taken when the plan is set up and the rest of the charge falls due in
    equal monthly installments, the first of them on the charge's due date; every other failed-sale charge remains
    billed to the seller and due failed_sale_bill_due_days calendar days after billing. The settlement plan is set
    up once, before the seller has made any payment on the order, and the first settlement payment is the payment
    taken when it is set up. The first settlement payment is worked out from the order's billing history. The open
    failed-sale balance is the failed-sale charges billed on the order less the payments the seller has already
    made on the order. The seller pays the open failed-sale balance in full as the first settlement payment, rounded
    to the cent. The payment-history down payment share follows the returned payments recorded on the seller's Bridgewell
    homeowner service contracts and utility line protection plans in the twelve months before the settlement date:
    with returned_upper_count or more returned payments the share is standing_upper_share, with exactly one it is
    standing_lower_share, and with none there is no payment-history share. The tenure down payment share follows
    how long the seller has held Bridgewell coverage, counted as the whole months from the start date of the seller's
    earliest-started utility line protection plan or homeowner service contract in status active to the settlement
    date: fewer than tenure_short_months months, or no such plan or contract, gives tenure_short_share; at least
    tenure_short_months but fewer than tenure_mid_months months gives tenure_mid_share; and tenure_mid_months months
    or more gives no tenure share. The autopay relief lowers the down payment share for a seller whose active Bridgewell
    utility line protection plan is billed automatically: billed by automatic bank draft the relief is autopay_ach_relief,
    billed automatically to a card it is autopay_card_relief, and billed on the utility bill, or with no active
    line plan, there is no autopay relief. The down payment share is the payment-history share plus the tenure share
    less the autopay relief, floored at zero, and the down payment is the open failed-sale balance times that share,
    rounded to the cent. The settlement schedule splits the open failed-sale balance less the down payment: when
    the open failed-sale balance is above three_installment_floor, it is split into three monthly installments and
    the first installment is that amount less two installments of one third of it rounded down to the cent; when
    the open failed-sale balance is above two_installment_floor but no more than three_installment_floor, it is
    split into two monthly installments and the first installment is half of it rounded up to the cent; in every
    other case it is not split and the whole of it is the first installment. The first settlement payment taken
    now is the down payment plus the first installment, rounded to the cent.
  prerequisite:
  - problem: realty_ext_failed_sale_charge
    kind: value_input
    gate: failed_sale_billed
    form: state
    policy_source: >-
      A seller's settlement payment toward listing-period service is not taken until the order's billing history
      carries the failed-sale charge invoice billed for that service.
    condition: >-
      realty_billing_entries carries a realty_seller_service_charge row for the order (the failed-sale charge invoice),
      so the failed-sale charges billed on the order are above zero.
    resolved_by: bill_failed_sale_charge_3e9b31c4
    effect: >-
      failed_sale_billed rises from 0.00 to the charge billed, which turns the open failed-sale balance, the down
      payment and the first settlement payment from zero into the scheduled figure.
  cross_category:
  - category: lineplan
    as: history
    reads:
    - status
    - start_date
    - billing_channel
    - lineplan_billing_entries.charge_type
    - lineplan_billing_entries.entry_date
    note: >-
      The payment-history, tenure and autopay down payment tiers are decided from the seller's line plan, its billing
      channel and its returned payments.
  - category: homeplan
    as: history
    reads:
    - status
    - start_date
    - homeplan_billing_entries.charge_type
    - homeplan_billing_entries.entry_date
    note: >-
      The payment-history and tenure down payment tiers also count the seller's homeowner contracts and their returned
      payments.
  compute:
  - failed_sale_billed: SUM('realty_billing_entries', 'amount', event_type='realty_seller_service_charge')
  - seller_paid: SUM('realty_billing_entries', 'amount', event_type='realty_payment', payer_role='seller')
  - open_balance: RND(failed_sale_billed - seller_paid, 2)
  - homeowner_returned: >-
      XCOUNT('homeplan', 'homeplan_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')
  - line_returned: >-
      XCOUNT('lineplan', 'lineplan_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')
  - standing_share: >-
      K('standing_upper_share') if (homeowner_returned + line_returned) >= K('returned_upper_count') else (K('standing_lower_share')
      if (homeowner_returned + line_returned) == 1 else 0)
  - line_start: CFIELD('lineplan', 'start_date', status='active')
  - homeowner_start: CFIELD('homeplan', 'start_date', status='active')
  - tenure_months: >-
      MX(MONTHS(line_start, NOW) if line_start else 0, MONTHS(homeowner_start, NOW) if homeowner_start else 0)
  - tenure_share: >-
      K('tenure_short_share') if tenure_months < K('tenure_short_months') else (K('tenure_mid_share') if tenure_months
      < K('tenure_mid_months') else 0)
  - line_channel: CFIELD('lineplan', 'billing_channel', status='active')
  - autopay_relief: >-
      K('autopay_ach_relief') if line_channel == 'ach' else (K('autopay_card_relief') if line_channel == 'card'
      else 0)
  - down_share: MX(0, standing_share + tenure_share - autopay_relief)
  - down_payment: RND(open_balance * down_share, 2)
  - split_cents: int(RND((open_balance - down_payment) * 100, 0))
  - first_installment: >-
      (split_cents - 2 * (split_cents // 3)) / 100 if open_balance > K('three_installment_floor') else ((split_cents
      - split_cents // 2) / 100 if open_balance > K('two_installment_floor') else split_cents / 100)
  - result: RND(down_payment + first_installment, 2)
  compute_basis:
    failed_sale_billed: >-
      The open failed-sale balance is the failed-sale charges billed on the order less the payments the seller has
      already made on the order.
    seller_paid: less the payments the seller has already made on the order
    open_balance: >-
      The open failed-sale balance is the failed-sale charges billed on the order less the payments the seller has
      already made on the order.
    homeowner_returned: >-
      the returned payments recorded on the seller's Bridgewell homeowner service contracts and utility line protection
      plans in the twelve months before the settlement date
    line_returned: >-
      the returned payments recorded on the seller's Bridgewell homeowner service contracts and utility line protection
      plans in the twelve months before the settlement date
    standing_share: >-
      with returned_upper_count or more returned payments the share is standing_upper_share, with exactly one it
      is standing_lower_share, and with none there is no payment-history share.
    line_start: >-
      the start date of the seller's earliest-started utility line protection plan or homeowner service contract
      in status active
    homeowner_start: >-
      the start date of the seller's earliest-started utility line protection plan or homeowner service contract
      in status active
    tenure_months: >-
      counted as the whole months from the start date of the seller's earliest-started utility line protection plan
      or homeowner service contract in status active to the settlement date
    tenure_share: >-
      fewer than tenure_short_months months, or no such plan or contract, gives tenure_short_share; at least tenure_short_months
      but fewer than tenure_mid_months months gives tenure_mid_share; and tenure_mid_months months or more gives
      no tenure share.
    line_channel: a seller whose active Bridgewell utility line protection plan is billed automatically
    autopay_relief: >-
      billed by automatic bank draft the relief is autopay_ach_relief, billed automatically to a card it is autopay_card_relief,
      and billed on the utility bill, or with no active line plan, there is no autopay relief.
    down_share: >-
      The down payment share is the payment-history share plus the tenure share less the autopay relief, floored
      at zero
    down_payment: the down payment is the open failed-sale balance times that share, rounded to the cent.
    split_cents: The settlement schedule splits the open failed-sale balance less the down payment
    first_installment: >-
      when the open failed-sale balance is above three_installment_floor, it is split into three monthly installments
      and the first installment is that amount less two installments of one third of it rounded down to the cent;
      when the open failed-sale balance is above two_installment_floor but no more than three_installment_floor,
      it is split into two monthly installments and the first installment is half of it rounded up to the cent;
      in every other case it is not split and the whole of it is the first installment.
    result: >-
      The first settlement payment taken now is the down payment plus the first installment, rounded to the cent.
  factors:
  - id: settlement_installments
    effect: method
    decides: first_installment
    bindings:
    - seller_paid
    - open_balance
    - split_cents
    - first_installment
    ladder:
    - when: an open failed-sale balance above three_installment_floor
      method: >-
        three monthly installments: the first is the amount after the down payment less two installments of one
        third of it rounded down to the cent
    - when: an open failed-sale balance above two_installment_floor but no more than three_installment_floor
      method: 'two monthly installments: the first is half the amount after the down payment rounded up to the cent'
    - when: otherwise
      method: 'not split: the whole amount after the down payment is the first installment'
    baseline:
      first_installment: split_cents / 100
    evidence:
    - history
    cross_difficulty: null
  - id: payment_history_down_payment
    effect: parameter
    decides: standing_share
    bindings:
    - homeowner_returned
    - line_returned
    - standing_share
    ladder:
    - when: >-
        returned_upper_count or more returned payments on the seller's homeowner contracts and line plans in the
        last twelve months
      value: K('standing_upper_share')
    - when: exactly one returned payment in the last twelve months
      value: K('standing_lower_share')
    - when: otherwise (no returned payment)
      value: no payment-history share (0)
    baseline:
      standing_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: lineplan
  - id: coverage_tenure_down_payment
    effect: parameter
    decides: tenure_share
    bindings:
    - line_start
    - homeowner_start
    - tenure_months
    - tenure_share
    ladder:
    - when: >-
        fewer than tenure_short_months whole months since the earliest active line plan or homeowner contract started,
        or no such plan or contract
      value: K('tenure_short_share')
    - when: at least tenure_short_months but fewer than tenure_mid_months whole months
      value: K('tenure_mid_share')
    - when: otherwise (tenure_mid_months months or more)
      value: no tenure share (0)
    baseline:
      tenure_share: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: lineplan
  - id: autopay_down_payment_relief
    effect: parameter
    decides: autopay_relief
    bindings:
    - line_channel
    - autopay_relief
    ladder:
    - when: the seller's active line plan is billed by automatic bank draft
      value: K('autopay_ach_relief')
    - when: the seller's active line plan is billed automatically to a card
      value: K('autopay_card_relief')
    - when: otherwise (billed on the utility bill, or no active line plan)
      value: no autopay relief (0)
    baseline:
      autopay_relief: '0'
    evidence:
    - cross_category
    cross_difficulty: lineplan
  baseline:
    rule: >-
      The first settlement payment is worked out from the order's billing history. The open failed-sale balance
      is the failed-sale charges billed on the order less the payments the seller has already made on the order.
      The seller pays the open failed-sale balance in full as the first settlement payment, rounded to the cent.
    params: []
  inputs:
    history:
    - table: realty_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: realty_seller_service_charge
    - table: realty_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: realty_payment
        payer_role: seller
    - category: lineplan
      table: lineplan_billing_entries
      aggregate: count
      field: charge_type
      within_months: 12
      filters:
        charge_type: returned_payment
    - category: homeplan
      table: homeplan_billing_entries
      aggregate: count
      field: charge_type
      within_months: 12
      filters:
        charge_type: returned_payment
    cross_category:
    - lineplan
    - homeplan
- id: realty_ext_reissued_plan_invoice
  base_policy_refs:
  - realty_premium_pricing
  - realty_order_requirements
  overwrite:
  - base_policy: realty_premium_pricing
    superseded_clause: >-
      It equals base_premium, plus oversize_premium_surcharge when square_footage is at or above oversize_threshold_sqft,
      plus additional_unit_premium for each dwelling unit beyond the first, minus condo_premium_discount when property_type
      is condominium or townhome.
    replaced_by: >-
      For a plan invoice reissued after a plan change before closing this policy sets the invoiced amount, and only
      for such an invoice; every other plan invoice still equals base_premium, plus oversize_premium_surcharge when
      square_footage is at or above oversize_threshold_sqft, plus additional_unit_premium for each dwelling unit
      beyond the first, minus condo_premium_discount when property_type is condominium or townhome.
  - base_policy: realty_premium_pricing
    superseded_clause: >-
      When the plan is changed before closing, the earlier invoice is credited in full and a new invoice is issued
      at the new plan's premium.
    replaced_by: >-
      When the plan is changed before closing, the earlier invoice is credited in full and the reissued plan invoice
      is issued at the reissued plan premium this policy works out.
  - base_policy: realty_order_requirements
    superseded_clause: >-
      The plan ordered may be changed to another plan at any time before closing, and the invoice is then reissued
      at the new plan's premium.
    replaced_by: >-
      The plan ordered may still be changed to another plan at any time before closing, and the invoice is then
      reissued at the reissued plan premium this policy works out; only such a reissued invoice is priced this way.
  - base_policy: realty_premium_pricing
    superseded_clause: The invoice is due on the closing date.
    replaced_by: >-
      A plan invoice reissued after a plan change before closing is due on the expected closing date shown on the
      order, and only such an invoice; every other plan invoice remains due on the closing date.
  trigger: state_due
  subject:
  - realty_invoice
  computes: amount
  target_tool: reissue_plan_invoice_480f4e9f
  params:
    reissue_fee_upper_count: 3
    reissue_fee_upper: 50.0
    reissue_fee_lower: 25.0
    early_order_upper_days: 60
    early_order_lower_days: 30
    early_order_upper_allowance: 40.0
    early_order_lower_allowance: 20.0
    loyalty_per_completed_term: 22.5
    loyalty_flat_credit: 40.0
    bundle_upper_premium: 150.0
    bundle_upper_discount: 60.0
    bundle_lower_discount: 30.0
  rule: >-
    When the plan is changed before closing, the earlier invoice is credited in full and the reissued plan invoice
    is issued at the reissued plan premium this policy works out. For a plan invoice reissued after a plan change
    before closing this policy sets the invoiced amount, and only for such an invoice; every other plan invoice
    still equals base_premium, plus oversize_premium_surcharge when square_footage is at or above oversize_threshold_sqft,
    plus additional_unit_premium for each dwelling unit beyond the first, minus condo_premium_discount when property_type
    is condominium or townhome. The plan ordered may still be changed to another plan at any time before closing,
    and the invoice is then reissued at the reissued plan premium this policy works out; only such a reissued invoice
    is priced this way. The plan premium is invoiced only on an order in status listing_coverage or awaiting_closing.
    A plan invoice reissued after a plan change before closing is due on the expected closing date shown on the
    order, and only such an invoice; every other plan invoice remains due on the closing date. The reissued plan
    premium is worked out from the plan now on the order and the order's property facts. The plan list premium is
    base_premium of the plan now on the order, plus oversize_premium_surcharge when square_footage is at or above
    oversize_threshold_sqft, plus additional_unit_premium for each dwelling unit beyond the first, minus condo_premium_discount
    when property_type is condominium or townhome. The reissued plan premium is the plan list premium, rounded to
    the cent. The reissue handling fee follows how many times the plan on the order has already been changed, counted
    as the plan-change credit memos on the order: with reissue_fee_upper_count or more such credit memos the fee
    is reissue_fee_upper, with exactly two it is reissue_fee_lower, and with fewer than two there is no reissue
    handling fee. The early ordering allowance follows the calendar days from order_date to the expected closing
    date on the order: early_order_upper_days or more days earn early_order_upper_allowance, early_order_lower_days
    or more but fewer than early_order_upper_days days earn early_order_lower_allowance, and fewer than early_order_lower_days
    days earn no early ordering allowance. The homeowner loyalty credit on a reissued plan invoice is worked out
    from the buyer's Bridgewell homeowner service contract in status active and the returned premium payments recorded
    on the buyer's homeowner contracts in the twelve months before the invoice date: when that contract is in its
    third or a later term and no returned payment is recorded in those twelve months, the credit is loyalty_per_completed_term
    for each completed term, the completed terms being the current term number less one; when that contract is in
    its second term and no returned payment is recorded in those twelve months, the credit is the flat loyalty_flat_credit;
    in every other case there is no homeowner loyalty credit. The rider bundle discount applies when the order itself
    carries a Bridgewell optional coverage rider in status waiting_period or active: when the rider premium billed
    on that rider is at least bundle_upper_premium the discount is bundle_upper_discount, when it is above zero
    but below bundle_upper_premium the discount is bundle_lower_discount, and an order carrying no such rider receives
    no rider bundle discount. The reissued plan premium is the plan list premium plus the reissue handling fee,
    less the early ordering allowance, the homeowner loyalty credit and the rider bundle discount, each a flat amount
    added or subtracted once, floored at zero and rounded to the cent.
  prerequisite: []
  cross_category:
  - category: homeplan
    as: history
    reads:
    - status
    - term_number
    - homeplan_billing_entries.charge_type
    - homeplan_billing_entries.entry_date
    note: >-
      The homeowner loyalty credit tier and method are decided from the buyer's active homeowner contract term number
      and its returned payments in the last twelve months.
  - category: addon
    as: history
    reads:
    - status
    - addon_rider_id
    - realty_contract_id
    - addon_billing_entries.event_type
    - addon_billing_entries.amount
    note: >-
      The rider bundle discount tier is decided from the rider attached to this order and the premium billed on
      that rider.
  compute:
  - plan_list_premium: >-
      P('base_premium') + (P('oversize_premium_surcharge') if F('square_footage') >= P('oversize_threshold_sqft')
      else 0) + P('additional_unit_premium') * (F('unit_count') - 1) - (P('condo_premium_discount') if (F('property_type')
      == 'condominium' or F('property_type') == 'townhome') else 0)
  - plan_change_credits: >-
      COUNT('realty_billing_entries', date_field='entry_date', event_type='realty_credit_memo', credit_reason='plan_changed')
  - reissue_fee: >-
      K('reissue_fee_upper') if plan_change_credits >= K('reissue_fee_upper_count') else (K('reissue_fee_lower')
      if plan_change_credits == 2 else 0)
  - order_lead_days: DAYS(F('order_date'), F('expected_closing_date'))
  - early_allowance: >-
      K('early_order_upper_allowance') if order_lead_days >= K('early_order_upper_days') else (K('early_order_lower_allowance')
      if order_lead_days >= K('early_order_lower_days') else 0)
  - homeowner_term: CFIELD('homeplan', 'term_number', status='active') or 0
  - homeowner_returned: >-
      XCOUNT('homeplan', 'homeplan_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')
  - loyalty_credit: >-
      K('loyalty_per_completed_term') * (homeowner_term - 1) if (homeowner_term >= 3 and homeowner_returned == 0)
      else (K('loyalty_flat_credit') if (homeowner_term == 2 and homeowner_returned == 0) else 0)
  - order_rider_id: CFIELD('addon', 'addon_rider_id', realty_contract_id=HID)
  - order_rider_status: CFIELD('addon', 'status', realty_contract_id=HID)
  - rider_premium_billed: >-
      XSUM('addon', 'addon_billing_entries', 'amount', event_type='addon_premium_charge', addon_rider_id=order_rider_id)
      if order_rider_id else 0
  - bundle_discount: >-
      K('bundle_upper_discount') if ((order_rider_status == 'waiting_period' or order_rider_status == 'active')
      and rider_premium_billed >= K('bundle_upper_premium')) else (K('bundle_lower_discount') if ((order_rider_status
      == 'waiting_period' or order_rider_status == 'active') and rider_premium_billed > 0 and rider_premium_billed
      < K('bundle_upper_premium')) else 0)
  - result: RND(MX(0, plan_list_premium + reissue_fee - early_allowance - loyalty_credit - bundle_discount), 2)
  compute_basis:
    plan_list_premium: >-
      The plan list premium is base_premium of the plan now on the order, plus oversize_premium_surcharge when square_footage
      is at or above oversize_threshold_sqft, plus additional_unit_premium for each dwelling unit beyond the first,
      minus condo_premium_discount when property_type is condominium or townhome.
    plan_change_credits: counted as the plan-change credit memos on the order
    reissue_fee: >-
      with reissue_fee_upper_count or more such credit memos the fee is reissue_fee_upper, with exactly two it is
      reissue_fee_lower, and with fewer than two there is no reissue handling fee.
    order_lead_days: >-
      The early ordering allowance follows the calendar days from order_date to the expected closing date on the
      order
    early_allowance: >-
      early_order_upper_days or more days earn early_order_upper_allowance, early_order_lower_days or more but fewer
      than early_order_upper_days days earn early_order_lower_allowance, and fewer than early_order_lower_days days
      earn no early ordering allowance.
    homeowner_term: the buyer's Bridgewell homeowner service contract in status active
    homeowner_returned: >-
      the returned premium payments recorded on the buyer's homeowner contracts in the twelve months before the
      invoice date
    loyalty_credit: >-
      when that contract is in its third or a later term and no returned payment is recorded in those twelve months,
      the credit is loyalty_per_completed_term for each completed term, the completed terms being the current term
      number less one; when that contract is in its second term and no returned payment is recorded in those twelve
      months, the credit is the flat loyalty_flat_credit; in every other case there is no homeowner loyalty credit.
    order_rider_status: >-
      when the order itself carries a Bridgewell optional coverage rider in status waiting_period or active
    rider_premium_billed: the rider premium billed on that rider
    bundle_discount: >-
      when the rider premium billed on that rider is at least bundle_upper_premium the discount is bundle_upper_discount,
      when it is above zero but below bundle_upper_premium the discount is bundle_lower_discount, and an order carrying
      no such rider receives no rider bundle discount.
    result: >-
      The reissued plan premium is the plan list premium plus the reissue handling fee, less the early ordering
      allowance, the homeowner loyalty credit and the rider bundle discount, each a flat amount added or subtracted
      once, floored at zero and rounded to the cent.
    order_rider_id: when the order itself carries a Bridgewell optional coverage rider
  factors:
  - id: plan_reissue_handling
    effect: parameter
    decides: reissue_fee
    bindings:
    - plan_change_credits
    - reissue_fee
    ladder:
    - when: reissue_fee_upper_count or more plan-change credit memos on the order
      value: K('reissue_fee_upper')
    - when: exactly two plan-change credit memos on the order
      value: K('reissue_fee_lower')
    - when: otherwise (fewer than two)
      value: no reissue handling fee (0)
    baseline:
      reissue_fee: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: early_ordering_allowance
    effect: parameter
    decides: early_allowance
    bindings:
    - order_lead_days
    - early_allowance
    ladder:
    - when: early_order_upper_days or more calendar days from order_date to the expected closing date
      value: K('early_order_upper_allowance')
    - when: early_order_lower_days or more but fewer than early_order_upper_days days
      value: K('early_order_lower_allowance')
    - when: otherwise
      value: no early ordering allowance (0)
    baseline:
      early_allowance: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: homeowner_loyalty_credit
    effect: method
    decides: loyalty_credit
    bindings:
    - homeowner_term
    - homeowner_returned
    - loyalty_credit
    ladder:
    - when: >-
        an active Bridgewell homeowner contract in its third or a later term AND no returned premium payment in
        the last twelve months
      method: 'per-term credit: loyalty_per_completed_term times the completed terms (term number less one)'
    - when: >-
        an active Bridgewell homeowner contract in its second term AND no returned premium payment in the last twelve
        months
      method: 'flat credit: loyalty_flat_credit regardless of tenure'
    - when: otherwise
      method: no homeowner loyalty credit
    baseline:
      loyalty_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: homeplan
  - id: rider_bundle_discount
    effect: parameter
    decides: bundle_discount
    bindings:
    - order_rider_id
    - order_rider_status
    - rider_premium_billed
    - bundle_discount
    ladder:
    - when: >-
        a rider on this order in status waiting_period or active AND premium billed on that rider at least bundle_upper_premium
      value: K('bundle_upper_discount')
    - when: >-
        a rider on this order in status waiting_period or active AND premium billed on that rider above zero but
        below bundle_upper_premium
      value: K('bundle_lower_discount')
    - when: otherwise
      value: no rider bundle discount (0)
    baseline:
      bundle_discount: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: addon
  baseline:
    rule: >-
      The reissued plan premium is worked out from the plan now on the order and the order's property facts. The
      plan list premium is base_premium of the plan now on the order, plus oversize_premium_surcharge when square_footage
      is at or above oversize_threshold_sqft, plus additional_unit_premium for each dwelling unit beyond the first,
      minus condo_premium_discount when property_type is condominium or townhome. The reissued plan premium is the
      plan list premium, rounded to the cent.
    params:
    - base_premium
    - oversize_premium_surcharge
    - oversize_threshold_sqft
    - additional_unit_premium
    - condo_premium_discount
  inputs:
    history:
    - table: realty_billing_entries
      aggregate: count
      field: credit_reason
      filters:
        event_type: realty_credit_memo
        credit_reason: plan_changed
    - category: homeplan
      table: homeplan_billing_entries
      aggregate: count
      field: charge_type
      within_months: 12
      filters:
        charge_type: returned_payment
    - category: addon
      table: addon_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: addon_premium_charge
    cross_category:
    - homeplan
    - addon
- id: realty_ext_buyer_direct_prepayment
  base_policy_refs:
  - realty_closing_and_escrow
  - realty_premium_pricing
  - realty_cancellation_and_credits
  overwrite:
  - base_policy: realty_premium_pricing
    superseded_clause: >-
      The plan premium covers the whole buyer term and is invoiced once per order, payable through escrow at closing.
    replaced_by: >-
      The plan premium covers the whole buyer term and is invoiced once per order, a plan change before closing
      crediting that invoice and reissuing it; on a buyer-only order before closing the buyer may pay part of it
      directly by card up to the direct card limit this policy works out, and only on such an order, while the rest
      of the premium on such an order and the whole premium on every other order remain payable through escrow at
      closing.
  - base_policy: realty_cancellation_and_credits
    superseded_clause: >-
      Any credit balance is refunded within refund_processing_days calendar days to the party that paid the invoice
      (escrow refunds go to the buyer once the escrow file is closed).
    replaced_by: >-
      A payment the buyer made toward a plan invoice that was later credited for a plan change on the same buyer-only
      order stays on that order and counts toward the reissued plan invoice instead of being refunded, and only
      for such a payment; every other credit balance remains refunded within refund_processing_days calendar days
      to the party that paid the invoice, and escrow refunds still go to the buyer once the escrow file is closed.
  trigger: on_request
  subject:
  - realty_payment
  computes: amount
  target_tool: prepay_plan_invoice_by_card_13fdf553
  params:
    card_history_days: 30
    established_limit_share: 0.5
    recent_limit_multiple: 2
    standard_card_limit: 400.0
    rental_upper_count: 24
    rental_lower_count: 12
    rental_upper_increment: 150.0
    rental_lower_increment: 75.0
    lead_upper_days: 14
    lead_lower_days: 7
    lead_upper_increment: 100.0
    lead_lower_increment: 50.0
    autopay_upper_count: 10
    autopay_upper_increment: 100.0
    autopay_lower_increment: 50.0
  rule: >-
    A buyer may pay part of the plan premium of a buyer-only order directly by card before closing; the card payment
    is posted against the plan invoice that is open on the order, and whatever it leaves open on that invoice remains
    payable through escrow at closing. A buyer's direct payment toward the plan premium is taken only after the
    order's billing history carries a plan invoice that no plan-change credit memo offsets. The plan premium covers
    the whole buyer term and is invoiced once per order, a plan change before closing crediting that invoice and
    reissuing it; on a buyer-only order before closing the buyer may pay part of it directly by card up to the direct
    card limit this policy works out, and only on such an order, while the rest of the premium on such an order
    and the whole premium on every other order remain payable through escrow at closing. A payment the buyer made
    toward a plan invoice that was later credited for a plan change on the same buyer-only order stays on that order
    and counts toward the reissued plan invoice instead of being refunded, and only for such a payment; every other
    credit balance remains refunded within refund_processing_days calendar days to the party that paid the invoice,
    and escrow refunds still go to the buyer once the escrow file is closed. The direct card payment is worked out
    from the order's billing history. The premium still owed is the plan invoices on the order less the plan-change
    credit memos on it less the payments the buyer has already made on the order, floored at zero. The direct card
    limit on an order is standard_card_limit, less the card payments already taken on the order, floored at zero.
    The buyer pays by card the lesser of the premium still owed and the direct card limit, rounded to the cent.
    The direct card limit basis follows the card payments already taken on the order: when a card payment was taken
    on the order and the order was placed at least card_history_days calendar days before the payment date, the
    basis is established_limit_share of the open plan invoice amount (the plan invoices less the plan-change credit
    memos), rounded to the cent; when a card payment was taken on the order but the order was placed fewer than
    card_history_days days before the payment date, the basis is recent_limit_multiple times the largest card payment
    taken on the order; when no card payment was taken on the order, the basis is the flat standard_card_limit.
    The rental owner increment raises the direct card limit for a buyer who holds a Bridgewell rental property service
    contract in status active: rental_upper_count or more rental premium payments recorded for the buyer in the
    twelve months before the payment date add rental_upper_increment, rental_lower_count or more but fewer than
    rental_upper_count add rental_lower_increment, and fewer such payments, or no active rental contract, add nothing.
    The clearing-time increment raises the direct card limit by the calendar days from the payment date to the expected
    closing date on the order, so that the card payment settles before closing: lead_upper_days or more days add
    lead_upper_increment, lead_lower_days or more but fewer than lead_upper_days days add lead_lower_increment,
    and fewer days add nothing. The homeowner autopay increment raises the direct card limit for a buyer whose homeowner
    service contract premiums are drawn by automatic bank draft: autopay_upper_count or more bank-draft premium
    payments on the buyer's homeowner contracts in the twelve months before the payment date add autopay_upper_increment,
    at least one but fewer than autopay_upper_count add autopay_lower_increment, and none add nothing. The direct
    card limit is the limit basis plus the rental owner, clearing-time and homeowner autopay increments, each added
    once, less the card payments already taken on the order, floored at zero and rounded to the cent.
  prerequisite:
  - problem: realty_ext_reissued_plan_invoice
    kind: value_input
    gate: plan_invoiced
    form: state
    policy_source: >-
      A buyer's direct payment toward the plan premium is taken only after the order's billing history carries a
      plan invoice that no plan-change credit memo offsets.
    condition: >-
      realty_billing_entries carries more realty_invoice amount than realty_credit_memo amount with credit_reason
      plan_changed on the order, i.e. a plan invoice issued after the latest plan change stands open.
    resolved_by: reissue_plan_invoice_480f4e9f
    effect: >-
      plan_invoiced rises by the reissued plan premium, so the open plan invoice amount, the premium still owed
      and the limit basis rise from their pre-invoice values and the direct card payment goes from zero to the limited
      figure.
  cross_category:
  - category: landlord
    as: history
    reads:
    - status
    - landlord_billing_entries.event_type
    - landlord_billing_entries.entry_date
    note: >-
      The rental owner increment tier is decided from the buyer's active rental contract and its premium payments
      in the last twelve months.
  - category: homeplan
    as: history
    reads:
    - homeplan_billing_entries.event_type
    - homeplan_billing_entries.payment_method
    - homeplan_billing_entries.entry_date
    note: >-
      The homeowner autopay increment tier is decided from the bank-draft premium payments on the buyer's homeowner
      contracts in the last twelve months.
  compute:
  - plan_invoiced: SUM('realty_billing_entries', 'amount', event_type='realty_invoice')
  - plan_change_credited: >-
      SUM('realty_billing_entries', 'amount', event_type='realty_credit_memo', credit_reason='plan_changed')
  - open_plan_invoice: RND(plan_invoiced - plan_change_credited, 2)
  - buyer_paid: SUM('realty_billing_entries', 'amount', event_type='realty_payment', payer_role='buyer')
  - premium_owed: MX(0, RND(open_plan_invoice - buyer_paid, 2))
  - card_paid: SUM('realty_billing_entries', 'amount', event_type='realty_payment', payment_method='card')
  - largest_card_payment: MAX('realty_billing_entries', 'amount', event_type='realty_payment', payment_method='card')
  - order_age_days: DAYS(F('order_date'), NOW)
  - limit_basis: >-
      RND(K('established_limit_share') * open_plan_invoice, 2) if (card_paid > 0 and order_age_days >= K('card_history_days'))
      else (K('recent_limit_multiple') * largest_card_payment if (card_paid > 0 and order_age_days < K('card_history_days'))
      else K('standard_card_limit'))
  - rental_active: CFIELD('landlord', 'status', status='active') == 'active'
  - rental_payments: >-
      XCOUNT('landlord', 'landlord_billing_entries', within_months=12, date_field='entry_date', event_type='landlord_premium_payment')
  - rental_increment: >-
      K('rental_upper_increment') if (rental_active and rental_payments >= K('rental_upper_count')) else (K('rental_lower_increment')
      if (rental_active and rental_payments >= K('rental_lower_count') and rental_payments < K('rental_upper_count'))
      else 0)
  - closing_lead_days: DAYS(NOW, F('expected_closing_date'))
  - lead_increment: >-
      K('lead_upper_increment') if closing_lead_days >= K('lead_upper_days') else (K('lead_lower_increment') if
      closing_lead_days >= K('lead_lower_days') else 0)
  - homeowner_bank_drafts: >-
      XCOUNT('homeplan', 'homeplan_billing_entries', within_months=12, date_field='entry_date', event_type='homeplan_premium_payment',
      payment_method='ach')
  - autopay_increment: >-
      K('autopay_upper_increment') if homeowner_bank_drafts >= K('autopay_upper_count') else (K('autopay_lower_increment')
      if homeowner_bank_drafts >= 1 else 0)
  - card_limit: MX(0, RND(limit_basis + rental_increment + lead_increment + autopay_increment - card_paid, 2))
  - result: RND(MN(premium_owed, card_limit), 2)
  compute_basis:
    plan_invoiced: the plan invoices on the order
    plan_change_credited: less the plan-change credit memos on it
    open_plan_invoice: the open plan invoice amount (the plan invoices less the plan-change credit memos)
    buyer_paid: less the payments the buyer has already made on the order
    premium_owed: >-
      The premium still owed is the plan invoices on the order less the plan-change credit memos on it less the
      payments the buyer has already made on the order, floored at zero.
    card_paid: less the card payments already taken on the order
    largest_card_payment: recent_limit_multiple times the largest card payment taken on the order
    order_age_days: the order was placed at least card_history_days calendar days before the payment date
    limit_basis: >-
      when a card payment was taken on the order and the order was placed at least card_history_days calendar days
      before the payment date, the basis is established_limit_share of the open plan invoice amount (the plan invoices
      less the plan-change credit memos), rounded to the cent; when a card payment was taken on the order but the
      order was placed fewer than card_history_days days before the payment date, the basis is recent_limit_multiple
      times the largest card payment taken on the order; when no card payment was taken on the order, the basis
      is the flat standard_card_limit.
    rental_active: a buyer who holds a Bridgewell rental property service contract in status active
    rental_payments: rental premium payments recorded for the buyer in the twelve months before the payment date
    rental_increment: >-
      rental_upper_count or more rental premium payments recorded for the buyer in the twelve months before the
      payment date add rental_upper_increment, rental_lower_count or more but fewer than rental_upper_count add
      rental_lower_increment, and fewer such payments, or no active rental contract, add nothing.
    closing_lead_days: the calendar days from the payment date to the expected closing date on the order
    lead_increment: >-
      lead_upper_days or more days add lead_upper_increment, lead_lower_days or more but fewer than lead_upper_days
      days add lead_lower_increment, and fewer days add nothing.
    homeowner_bank_drafts: >-
      bank-draft premium payments on the buyer's homeowner contracts in the twelve months before the payment date
    autopay_increment: >-
      autopay_upper_count or more bank-draft premium payments on the buyer's homeowner contracts in the twelve months
      before the payment date add autopay_upper_increment, at least one but fewer than autopay_upper_count add autopay_lower_increment,
      and none add nothing.
    card_limit: >-
      The direct card limit is the limit basis plus the rental owner, clearing-time and homeowner autopay increments,
      each added once, less the card payments already taken on the order, floored at zero and rounded to the cent.
    result: >-
      The buyer pays by card the lesser of the premium still owed and the direct card limit, rounded to the cent.
  factors:
  - id: card_limit_basis
    effect: method
    decides: limit_basis
    bindings:
    - card_paid
    - largest_card_payment
    - order_age_days
    - limit_basis
    ladder:
    - when: >-
        a card payment already taken on the order AND the order placed at least card_history_days days before the
        payment date
      method: 'proportional: established_limit_share of the open plan invoice amount, rounded to the cent'
    - when: >-
        a card payment already taken on the order AND the order placed fewer than card_history_days days before
        the payment date
      method: 'anchored on payment history: recent_limit_multiple times the largest card payment taken on the order'
    - when: otherwise (no card payment taken on the order)
      method: 'flat: standard_card_limit'
    baseline:
      limit_basis: K('standard_card_limit')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: rental_owner_increment
    effect: parameter
    decides: rental_increment
    bindings:
    - rental_active
    - rental_payments
    - rental_increment
    ladder:
    - when: >-
        an active Bridgewell rental property contract AND rental_upper_count or more rental premium payments in
        the last twelve months
      value: K('rental_upper_increment')
    - when: >-
        an active Bridgewell rental property contract AND at least rental_lower_count but fewer than rental_upper_count
        such payments
      value: K('rental_lower_increment')
    - when: otherwise
      value: no rental owner increment (0)
    baseline:
      rental_increment: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: landlord
  - id: clearing_time_increment
    effect: parameter
    decides: lead_increment
    bindings:
    - closing_lead_days
    - lead_increment
    ladder:
    - when: lead_upper_days or more calendar days from the payment date to the expected closing date
      value: K('lead_upper_increment')
    - when: lead_lower_days or more but fewer than lead_upper_days days
      value: K('lead_lower_increment')
    - when: otherwise
      value: no clearing-time increment (0)
    baseline:
      lead_increment: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: homeowner_autopay_increment
    effect: parameter
    decides: autopay_increment
    bindings:
    - homeowner_bank_drafts
    - autopay_increment
    ladder:
    - when: >-
        autopay_upper_count or more bank-draft premium payments on the buyer's homeowner contracts in the last twelve
        months
      value: K('autopay_upper_increment')
    - when: at least one but fewer than autopay_upper_count such payments
      value: K('autopay_lower_increment')
    - when: otherwise (no bank-draft premium payment)
      value: no homeowner autopay increment (0)
    baseline:
      autopay_increment: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: homeplan
  baseline:
    rule: >-
      The direct card payment is worked out from the order's billing history. The premium still owed is the plan
      invoices on the order less the plan-change credit memos on it less the payments the buyer has already made
      on the order, floored at zero. The direct card limit on an order is standard_card_limit, less the card payments
      already taken on the order, floored at zero. The buyer pays by card the lesser of the premium still owed and
      the direct card limit, rounded to the cent.
    params:
    - standard_card_limit
  inputs:
    history:
    - table: realty_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: realty_invoice
    - table: realty_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: realty_credit_memo
        credit_reason: plan_changed
    - table: realty_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: realty_payment
    - category: landlord
      table: landlord_billing_entries
      aggregate: count
      field: entry_date
      within_months: 12
      filters:
        event_type: landlord_premium_payment
    - category: homeplan
      table: homeplan_billing_entries
      aggregate: count
      field: payment_method
      within_months: 12
      filters:
        event_type: homeplan_premium_payment
        payment_method: ach
    cross_category:
    - landlord
    - homeplan
