- id: realty_failed_sale_charges
  subject:
  - realty_seller_service_charge
  rule: >-
    When a listing order ends without a closing, the seller pays for the listing-period service Bridgewell provided.
    A failed-sale charge is billed only on an order in status listing_expired or cancelled that never recorded a
    closing. The charge is the lesser of the plan premium invoiced on the order (realty_msr_plan_premium_invoiced)
    and the seller-phase benefit Bridgewell paid (realty_msr_seller_phase_benefit_paid); no charge is billed when
    that benefit is zero, and seller service call fees already collected never reduce it. The charge is billed to
    the seller and due failed_sale_bill_due_days calendar days after billing. Only one failed-sale charge is billed
    per order. A buyer-only order never carries a failed-sale charge.
  eligibility:
  - id: failed_sale_only_on_unclosed_order
    applies_to:
    - realty_seller_service_charge
    kind: state
    condition: >-
      A failed-sale charge is billed only on an order in status listing_expired or cancelled that never recorded
      a closing.
    evidence_fields:
    - realty_contracts.status
    - realty_contracts.closing_date
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    state_contract:
      field: realty_contracts.status
      allowed:
      - listing_expired
      - cancelled
  - id: one_failed_sale_charge_per_order
    applies_to:
    - realty_seller_service_charge
    kind: dedup
    condition: Only one failed-sale charge is billed per order.
    evidence_fields:
    - realty_billing_entries.realty_contract_id
    - realty_billing_entries.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_billing_entries.realty_contract_id
      action_bindings:
        realty_billing_entries.realty_contract_id: realty_contract_id
    dedup_contract:
      table: realty_billing_entries
      mode: separate_record
      object_bindings:
        realty_contract_id: realty_contract_id
      duplicate_filters:
        event_type:
        - realty_seller_service_charge
      distinct_fields: []
  params:
    per_tier:
      Bridgewell Closing Starter:
        failed_sale_bill_due_days: =failed_sale_bill_due_days
      Bridgewell Closing Standard:
        failed_sale_bill_due_days: =failed_sale_bill_due_days
      Bridgewell Closing Plus:
        failed_sale_bill_due_days: =failed_sale_bill_due_days
      Bridgewell Closing Premier:
        failed_sale_bill_due_days: =failed_sale_bill_due_days
      Bridgewell Closing Premier Two-Year:
        failed_sale_bill_due_days: =failed_sale_bill_due_days
      Bridgewell New Construction Three-Year:
        failed_sale_bill_due_days: =failed_sale_bill_due_days
  formula:
    failed_sale_charge: min(realty_msr_plan_premium_invoiced, realty_msr_seller_phase_benefit_paid)
  measures:
  - realty_msr_plan_premium_invoiced
  - realty_msr_seller_phase_benefit_paid
- id: realty_evt_service_request_and_fees
  subject:
  - realty_service_request
  - realty_service_fee_charge
  - realty_service_fee_refund
  rule: >-
    Service requests are accepted only while the contract status is listing_coverage, closed_pending_payment or
    active. A request placed while the contract is in listing_coverage is a seller_listing request placed by the
    seller; a request placed on or after the closing is a buyer request placed by the buyer. A new_failure request
    is charged seller_service_call_fee in the seller phase and service_call_fee in the buyer phase, once per request.
    A recall for the same item placed no later than repair_guarantee_days calendar days after the earlier repair
    was completed carries no fee, and a later return visit is a new_failure request. A rekey request is accepted
    only when it is placed no later than rekey_request_window_days calendar days after the sale closes, counting
    from the day after closing_date with the boundary day included. The rekey benefit is available only in the buyer
    phase on plans whose rekey_lock_count is above 0, covers up to rekey_lock_count exterior keyed locks once per
    order, and carries no fee. The fee is refunded in full when the caller cancels the request before any contractor
    is assigned, or when the request was placed on a plan that is later voided; it is not refunded because the failure
    is determined not covered.
  eligibility:
  - id: requests_only_while_covered
    applies_to:
    - realty_service_request
    kind: state
    condition: >-
      Service requests are accepted only while the contract status is listing_coverage, closed_pending_payment or
      active.
    evidence_fields:
    - realty_contracts.status
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    state_contract:
      field: realty_contracts.status
      allowed:
      - listing_coverage
      - closed_pending_payment
      - active
  - id: rekey_within_window
    applies_to:
    - realty_service_request
    kind: time
    condition: >-
      A rekey request is accepted only when it is placed no later than rekey_request_window_days calendar days after
      the sale closes, counting from the day after closing_date with the boundary day included.
    evidence_fields:
    - realty_contracts.closing_date
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the sale closes
      anchor_source: realty_contracts.closing_date
      relation: not_after
      duration_source: variants.rekey_request_window_days
      unit: calendar_days
      counting_rule: counting from the day after closing_date with the boundary day included
      boundary: inclusive
  params:
    per_tier:
      Bridgewell Closing Starter:
        service_call_fee: =service_call_fee
        seller_service_call_fee: =seller_service_call_fee
        rekey_lock_count: =rekey_lock_count
      Bridgewell Closing Standard:
        service_call_fee: =service_call_fee
        seller_service_call_fee: =seller_service_call_fee
        rekey_lock_count: =rekey_lock_count
      Bridgewell Closing Plus:
        service_call_fee: =service_call_fee
        seller_service_call_fee: =seller_service_call_fee
        rekey_lock_count: =rekey_lock_count
      Bridgewell Closing Premier:
        service_call_fee: =service_call_fee
        seller_service_call_fee: =seller_service_call_fee
        rekey_lock_count: =rekey_lock_count
      Bridgewell Closing Premier Two-Year:
        service_call_fee: =service_call_fee
        seller_service_call_fee: =seller_service_call_fee
        rekey_lock_count: =rekey_lock_count
      Bridgewell New Construction Three-Year:
        service_call_fee: =service_call_fee
        seller_service_call_fee: =seller_service_call_fee
        rekey_lock_count: =rekey_lock_count
  formula:
    fee: >-
      (seller_service_call_fee if coverage_phase == 'seller_listing' else service_call_fee) if request_type == 'new_failure'
      else 0
- id: realty_evt_dispatch
  subject:
  - realty_contractor_dispatch
  rule: >-
    A contractor is dispatched only while the contract status is listing_coverage or active. Requests recorded while
    the contract is closed_pending_payment wait and are dispatched once the plan invoice is paid and coverage is
    confirmed. The request goes to a network contractor whose trade matches and whose service ZIP codes include
    the property_zip, preferred before standard, never suspended, and emergency-capable for an emergency; ties go
    to the contractor reference that sorts first alphabetically. The contractor contacts the caller within routine_contact_hours
    hours, or emergency_contact_hours hours for an emergency, measured from the assignment; a missed contact window
    leads to re-dispatch with dispatch_reason redispatch_missed_contact. A recall goes to the contractor that did
    the original work unless now suspended. Each assignment carries the next dispatch_sequence, starting at 1.
  eligibility:
  - id: dispatch_only_while_in_force
    applies_to:
    - realty_contractor_dispatch
    kind: state
    condition: A contractor is dispatched only while the contract status is listing_coverage or active.
    evidence_fields:
    - realty_contracts.status
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    state_contract:
      field: realty_contracts.status
      allowed:
      - listing_coverage
      - active
  params:
    per_tier:
      Bridgewell Closing Starter:
        routine_contact_hours: =routine_contact_hours
        emergency_contact_hours: =emergency_contact_hours
      Bridgewell Closing Standard:
        routine_contact_hours: =routine_contact_hours
        emergency_contact_hours: =emergency_contact_hours
      Bridgewell Closing Plus:
        routine_contact_hours: =routine_contact_hours
        emergency_contact_hours: =emergency_contact_hours
      Bridgewell Closing Premier:
        routine_contact_hours: =routine_contact_hours
        emergency_contact_hours: =emergency_contact_hours
      Bridgewell Closing Premier Two-Year:
        routine_contact_hours: =routine_contact_hours
        emergency_contact_hours: =emergency_contact_hours
      Bridgewell New Construction Three-Year:
        routine_contact_hours: =routine_contact_hours
        emergency_contact_hours: =emergency_contact_hours
- id: realty_evt_coverage_determination
  subject:
  - realty_coverage_determination
  rule: >-
    One coverage determination is issued per service request. A failure is covered only when every condition below
    holds, and otherwise is not_covered with the first failing reason in this order. (1) contract_not_in_force:
    a seller_listing request was placed while the contract was in listing_coverage, or a buyer request was placed
    on or after closing_date on a contract that is now active. (2) item_not_in_plan: the plan's cap for the item
    is above 0.00 and, in the seller phase, the item is not heating, cooling or ductwork unless seller_hvac_covered
    is true, and is not a roof leak. (3) systems_coverage_not_started applies only to plans whose systems_coverage_delay_days
    is above 0. For such a plan, a failure of heating_system, cooling_system, ductwork, plumbing, water_heater or
    electrical is covered only when it is reported at least systems_coverage_delay_days calendar days after the
    sale closes, counting from the day after closing_date with the boundary day included. (4) preexisting_condition:
    in the seller phase, conditions existing before order_date are never covered; in the buyer phase, known or detectable
    pre-existing conditions are never covered, and unknown, undetectable ones are covered only when unknown_preexisting_covered
    is true and, where inspection_required_for_preexisting is true, home_inspection_completed is true. (5) misuse_or_external_damage:
    misuse and external causes are never covered. (6) cap_exhausted: the remaining item and aggregate benefit under
    realty_evt_benefit_authorization are both above zero.
  eligibility:
  - id: one_determination_per_request
    applies_to:
    - realty_coverage_determination
    kind: dedup
    condition: One coverage determination is issued per service request.
    evidence_fields:
    - realty_claim_events.realty_service_request_id
    - realty_claim_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_claim_events.realty_service_request_id
      action_bindings:
        realty_claim_events.realty_service_request_id: realty_service_request_id
    dedup_contract:
      table: realty_claim_events
      mode: separate_record
      object_bindings:
        realty_service_request_id: realty_service_request_id
      duplicate_filters:
        event_type:
        - realty_coverage_determination
      distinct_fields: []
  - id: new_construction_systems_delay
    applies_to:
    - realty_coverage_determination
    kind: time
    condition: >-
      For such a plan, a failure of heating_system, cooling_system, ductwork, plumbing, water_heater or electrical
      is covered only when it is reported at least systems_coverage_delay_days calendar days after the sale closes,
      counting from the day after closing_date with the boundary day included.
    evidence_fields:
    - realty_contracts.closing_date
    - realty_service_requests.request_date
    - realty_service_requests.realty_service_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_service_requests.realty_service_request_id
      action_bindings:
        realty_service_requests.realty_service_request_id: realty_service_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the sale closes
      anchor_source: realty_contracts.closing_date
      relation: not_before
      duration_source: variants.systems_coverage_delay_days
      unit: calendar_days
      counting_rule: counting from the day after closing_date with the boundary day included
      boundary: inclusive
  params:
    per_tier:
      Bridgewell Closing Starter:
        unknown_preexisting_covered: =unknown_preexisting_covered
        systems_coverage_delay_days: =systems_coverage_delay_days
        inspection_required_for_preexisting: =inspection_required_for_preexisting
      Bridgewell Closing Standard:
        unknown_preexisting_covered: =unknown_preexisting_covered
        systems_coverage_delay_days: =systems_coverage_delay_days
        inspection_required_for_preexisting: =inspection_required_for_preexisting
      Bridgewell Closing Plus:
        unknown_preexisting_covered: =unknown_preexisting_covered
        systems_coverage_delay_days: =systems_coverage_delay_days
        inspection_required_for_preexisting: =inspection_required_for_preexisting
      Bridgewell Closing Premier:
        unknown_preexisting_covered: =unknown_preexisting_covered
        systems_coverage_delay_days: =systems_coverage_delay_days
        inspection_required_for_preexisting: =inspection_required_for_preexisting
      Bridgewell Closing Premier Two-Year:
        unknown_preexisting_covered: =unknown_preexisting_covered
        systems_coverage_delay_days: =systems_coverage_delay_days
        inspection_required_for_preexisting: =inspection_required_for_preexisting
      Bridgewell New Construction Three-Year:
        unknown_preexisting_covered: =unknown_preexisting_covered
        systems_coverage_delay_days: =systems_coverage_delay_days
        inspection_required_for_preexisting: =inspection_required_for_preexisting
- id: realty_evt_benefit_authorization
  subject:
  - realty_benefit_authorization
  - realty_authorization_reversal
  rule: >-
    A benefit is authorized only after a covered determination is on file for the service request. Bridgewell chooses
    repair or replacement: it replaces when repair_estimate is at or above repair_to_replace_threshold_rate times
    replacement_cost, when parts cannot be obtained within parts_lead_time_replace_days calendar days, or when the
    item cannot be repaired, and otherwise repairs. In the seller phase the amount paid is the lowest of the work's
    cost, seller_item_cap less realty_msr_seller_item_benefit_paid, and seller_aggregate_cap less realty_msr_seller_phase_benefit_paid.
    In the buyer phase it is the lowest of the work's cost, the item's cap (item_cap) less realty_msr_item_benefit_paid_year,
    and aggregate_contract_year_limit less realty_msr_contract_year_benefit_paid; buyer limits apply per contract
    year and restart on each anniversary of coverage_start_date. Buyer-phase supplemental allowances (code_violation,
    permit, haul_away on a replacement, refrigerant on a cooling repair) pay the lower of invoice_amount and the
    allowance, with refrigerant limited per contract year by realty_msr_refrigerant_paid_year, and count toward
    the aggregate limit only; the seller phase carries no allowances. When a like unit cannot be sourced, or the
    buyer asks for cash in place of an authorized replacement, cash in lieu equal to the contracted replacement_cost
    within the same limits is offered, and is authorized when the buyer accepts it no later than cash_in_lieu_offer_validity_days
    calendar days after the offer; an accepted cash settlement replaces the replacement authorization, which is
    reversed in full, and is paid within cash_in_lieu_payment_days calendar days. The rekey benefit is authorized
    at the contracted locksmith cost and counts toward the aggregate limit only. Only one repair, replacement or
    cash-in-lieu authorization is open per service request. An authorization is reversed in full when the work will
    not be performed and never after completion.
  eligibility:
  - id: covered_determination_before_benefit
    applies_to:
    - realty_benefit_authorization
    kind: authorization
    condition: A benefit is authorized only after a covered determination is on file for the service request.
    evidence_fields:
    - realty_claim_events.determination_outcome
    - realty_claim_events.realty_service_request_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_claim_events.realty_service_request_id
      action_bindings:
        realty_claim_events.realty_service_request_id: realty_service_request_id
  - id: one_open_resolution_per_request
    applies_to:
    - realty_benefit_authorization
    kind: dedup
    condition: Only one repair, replacement or cash-in-lieu authorization is open per service request.
    evidence_fields:
    - realty_claim_events.realty_service_request_id
    - realty_claim_events.resolution_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_claim_events.realty_service_request_id
      action_bindings:
        realty_claim_events.realty_service_request_id: realty_service_request_id
    dedup_contract:
      table: realty_claim_events
      mode: separate_record
      object_bindings:
        realty_service_request_id: realty_service_request_id
      duplicate_filters:
        resolution_type:
        - repair
        - replacement
        - cash_in_lieu
      distinct_fields:
      - authorization_number
  params:
    item_cap:
      heating_system: heating_system_cap
      cooling_system: cooling_system_cap
      ductwork: ductwork_cap
      plumbing: plumbing_cap
      water_heater: water_heater_cap
      electrical: electrical_cap
      kitchen_appliance: kitchen_appliance_cap
      laundry_appliance: laundry_appliance_cap
      garage_door_opener: garage_door_opener_cap
      roof_leak: roof_leak_cap
    per_tier:
      Bridgewell Closing Starter:
        aggregate_contract_year_limit: =aggregate_contract_year_limit
        code_violation_allowance: =code_violation_allowance
        permit_fee_allowance: =permit_fee_allowance
        haul_away_allowance: =haul_away_allowance
        refrigerant_allowance: =refrigerant_allowance
      Bridgewell Closing Standard:
        aggregate_contract_year_limit: =aggregate_contract_year_limit
        code_violation_allowance: =code_violation_allowance
        permit_fee_allowance: =permit_fee_allowance
        haul_away_allowance: =haul_away_allowance
        refrigerant_allowance: =refrigerant_allowance
      Bridgewell Closing Plus:
        aggregate_contract_year_limit: =aggregate_contract_year_limit
        code_violation_allowance: =code_violation_allowance
        permit_fee_allowance: =permit_fee_allowance
        haul_away_allowance: =haul_away_allowance
        refrigerant_allowance: =refrigerant_allowance
      Bridgewell Closing Premier:
        aggregate_contract_year_limit: =aggregate_contract_year_limit
        code_violation_allowance: =code_violation_allowance
        permit_fee_allowance: =permit_fee_allowance
        haul_away_allowance: =haul_away_allowance
        refrigerant_allowance: =refrigerant_allowance
      Bridgewell Closing Premier Two-Year:
        aggregate_contract_year_limit: =aggregate_contract_year_limit
        code_violation_allowance: =code_violation_allowance
        permit_fee_allowance: =permit_fee_allowance
        haul_away_allowance: =haul_away_allowance
        refrigerant_allowance: =refrigerant_allowance
      Bridgewell New Construction Three-Year:
        aggregate_contract_year_limit: =aggregate_contract_year_limit
        code_violation_allowance: =code_violation_allowance
        permit_fee_allowance: =permit_fee_allowance
        haul_away_allowance: =haul_away_allowance
        refrigerant_allowance: =refrigerant_allowance
  formula:
    buyer_amount: >-
      max(0, min(repair_estimate if repair_estimate < repair_to_replace_threshold_rate * replacement_cost else replacement_cost,
      item_cap - realty_msr_item_benefit_paid_year, aggregate_contract_year_limit - realty_msr_contract_year_benefit_paid))
    seller_amount: >-
      max(0, min(repair_estimate if repair_estimate < repair_to_replace_threshold_rate * replacement_cost else replacement_cost,
      seller_item_cap - realty_msr_seller_item_benefit_paid, seller_aggregate_cap - realty_msr_seller_phase_benefit_paid))
  measures:
  - realty_msr_item_benefit_paid_year
  - realty_msr_contract_year_benefit_paid
  - realty_msr_seller_item_benefit_paid
  - realty_msr_seller_phase_benefit_paid
  - realty_msr_refrigerant_paid_year
- id: realty_cancellation_and_credits
  subject:
  - realty_buyer_cancellation
  - realty_order_cancellation
  - realty_credit_memo
  - realty_refund
  rule: >-
    An order cancelled before closing, an order whose listing expired, and a voided plan each have their plan invoice
    credited in full, and any amount already paid on it is refunded to the payer. A buyer may cancel active buyer
    coverage by giving notice; the cancellation is effective on the notice date. A buyer cancellation is processed
    only on the buyer's own request as the current contract holder. Within buyer_free_look_days calendar days after
    closing_date (realty_msr_days_since_closing), the buyer is credited the premium paid less the benefit Bridgewell
    paid in the buyer phase. After that, the buyer is credited the premium paid times realty_msr_unexpired_term_days
    divided by realty_msr_term_days, rounded to the cent, less buyer_cancel_admin_fee, less the buyer-phase benefit
    paid; a negative result is credited as zero and nothing is billed. Service call fees are never credited through
    a cancellation. Each invoice receives at most one credit memo per credit reason. Any credit balance is refunded
    within refund_processing_days calendar days to the party that paid the invoice (escrow refunds go to the buyer
    once the escrow file is closed).
  eligibility:
  - id: buyer_cancels_own_coverage
    applies_to:
    - realty_buyer_cancellation
    kind: caller_fact
    condition: A buyer cancellation is processed only on the buyer's own request as the current contract holder.
    evidence_fields:
    - realty_contracts.customer_id
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
  - id: one_credit_per_invoice_reason
    applies_to:
    - realty_credit_memo
    kind: dedup
    condition: Each invoice receives at most one credit memo per credit reason.
    evidence_fields:
    - realty_billing_entries.invoice_number
    - realty_billing_entries.credit_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_billing_entries.invoice_number
        - realty_billing_entries.credit_reason
      action_bindings:
        realty_billing_entries.invoice_number: invoice_number
        realty_billing_entries.credit_reason: credit_reason
    dedup_contract:
      table: realty_billing_entries
      mode: separate_record
      object_bindings:
        invoice_number: invoice_number
        credit_reason: credit_reason
      duplicate_filters:
        event_type:
        - realty_credit_memo
      distinct_fields: []
  params:
    per_tier:
      Bridgewell Closing Starter:
        buyer_free_look_days: =buyer_free_look_days
        buyer_cancel_admin_fee: =buyer_cancel_admin_fee
      Bridgewell Closing Standard:
        buyer_free_look_days: =buyer_free_look_days
        buyer_cancel_admin_fee: =buyer_cancel_admin_fee
      Bridgewell Closing Plus:
        buyer_free_look_days: =buyer_free_look_days
        buyer_cancel_admin_fee: =buyer_cancel_admin_fee
      Bridgewell Closing Premier:
        buyer_free_look_days: =buyer_free_look_days
        buyer_cancel_admin_fee: =buyer_cancel_admin_fee
      Bridgewell Closing Premier Two-Year:
        buyer_free_look_days: =buyer_free_look_days
        buyer_cancel_admin_fee: =buyer_cancel_admin_fee
      Bridgewell New Construction Three-Year:
        buyer_free_look_days: =buyer_free_look_days
        buyer_cancel_admin_fee: =buyer_cancel_admin_fee
  formula:
    buyer_credit: >-
      max(0, realty_msr_plan_premium_paid - realty_msr_contract_year_benefit_paid) if realty_msr_days_since_closing
      <= buyer_free_look_days else max(0, round(realty_msr_plan_premium_paid * realty_msr_unexpired_term_days /
      realty_msr_term_days, 2) - buyer_cancel_admin_fee - realty_msr_contract_year_benefit_paid)
  measures:
  - realty_msr_days_since_closing
  - realty_msr_unexpired_term_days
  - realty_msr_term_days
  - realty_msr_plan_premium_paid
  - realty_msr_contract_year_benefit_paid
- id: realty_conversion_and_expiration
  subject:
  - realty_conversion
  - realty_term_expiration
  rule: >-
    Bridgewell extends a direct renewal offer to the buyer conversion_offer_days_before_end calendar days before
    term_end_date, for the homeowner service contract tier named by conversion_tier, priced under homeplan_premium_pricing.
    A conversion is processed only on the buyer's own acceptance of the direct renewal offer. Accepting before term_end_date
    converts the contract at term end with continuous coverage; accepting after the term ended converts it only
    within the continuity window set by homeplan_enrollment_terms, and later acceptance is a new homeowner enrollment
    with a waiting period. A conversion creates a homeowner service contract with enrollment_channel realty_conversion
    for the same customer and address. A buyer who does not accept sees the contract expire at the end of term_end_date.
  eligibility:
  - id: buyer_accepts_conversion
    applies_to:
    - realty_conversion
    kind: caller_fact
    condition: A conversion is processed only on the buyer's own acceptance of the direct renewal offer.
    evidence_fields:
    - realty_contracts.customer_id
    - realty_contracts.term_end_date
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
  params:
    per_tier:
      Bridgewell Closing Starter:
        conversion_tier: =conversion_tier
      Bridgewell Closing Standard:
        conversion_tier: =conversion_tier
      Bridgewell Closing Plus:
        conversion_tier: =conversion_tier
      Bridgewell Closing Premier:
        conversion_tier: =conversion_tier
      Bridgewell Closing Premier Two-Year:
        conversion_tier: =conversion_tier
      Bridgewell New Construction Three-Year:
        conversion_tier: =conversion_tier
extended_policies:
- id: realty_ext_failed_sale_charge
  base_policy_refs:
  - realty_failed_sale_charges
  overwrite:
  - base_policy: realty_failed_sale_charges
    superseded_clause: >-
      The charge is the lesser of the plan premium invoiced on the order (realty_msr_plan_premium_invoiced) and
      the seller-phase benefit Bridgewell paid (realty_msr_seller_phase_benefit_paid); no charge is billed when
      that benefit is zero, and seller service call fees already collected never reduce it.
    replaced_by: >-
      The failed-sale charge billed on an order is the amount this paragraph works out in place of the plain lesser-of
      amount, no failed-sale charge is billed when the seller-phase benefit paid is zero, and seller service call
      fees already collected never reduce it.
  trigger: state_due
  subject:
  - realty_seller_service_charge
  computes: amount
  target_tool: bill_failed_sale_charge_3e9b31c4
  params:
    daily_proration_max_days: 60
    listing_period_months: 6
    hvac_after_hours_rate: 95.0
    general_after_hours_rate: 70.0
    maintained_visit_count: 2
    maintained_upper_rate: 0.2
    maintained_lower_rate: 0.1
    missed_contact_multi_credit: 75.0
    missed_contact_single_credit: 40.0
    keep_home_window_days: 30
    keep_home_upper_monthly: 70.0
    keep_home_upper_rate: 0.5
    keep_home_lower_rate: 0.25
  rule: >-
    When a listing order ends without a closing, Bridgewell bills the seller one failed-sale charge for the listing-period
    service it provided. A failed-sale charge is billed only on an order in status listing_expired or cancelled
    that never recorded a closing, only one failed-sale charge is billed per order, a buyer-only order never carries
    one, and the charge is due failed_sale_bill_due_days calendar days after the billing date, so its due date is
    the billing date plus failed_sale_bill_due_days calendar days. The failed-sale charge is worked out from the
    order's own billing and claim records. The plan premium invoiced is the sum of the plan invoices on the order,
    and the seller-phase benefit paid is the sum of the benefit authorizations on the order less the authorization
    reversals on it. The failed-sale charge cap is the plan premium invoiced. The failed-sale charge is the lesser
    of the failed-sale charge cap and the seller-phase benefit paid, never below zero, rounded to the cent. The
    failed-sale charge billed on an order is the amount this paragraph works out in place of the plain lesser-of
    amount, no failed-sale charge is billed when the seller-phase benefit paid is zero, and seller service call
    fees already collected never reduce it. The failed-sale charge cap follows how long the listing order stayed
    in force, counted as the calendar days from order_date to the order's end_date: when the order ended fewer than
    daily_proration_max_days days after order_date, the cap is the plan premium invoiced times those days divided
    by seller_coverage_max_days, rounded to the cent; when it ended at least daily_proration_max_days days but fewer
    than seller_coverage_max_days days after order_date, the cap is the plan premium invoiced times the listing
    months begun divided by listing_period_months, rounded to the cent, where the listing months begun are the whole
    calendar months from order_date to end_date plus one; when it ended seller_coverage_max_days or more days after
    order_date, the cap is the full plan premium invoiced. The after-hours dispatch cost recovered on a failed sale
    is the listing's after-hours rate times the number of emergency requests the seller placed in the seller phase:
    when at least one of those emergency requests was in the hvac trade the after-hours rate is hvac_after_hours_rate,
    the costliest after-hours dispatch; when there were emergency requests but none in the hvac trade it is general_after_hours_rate;
    and when the seller placed no emergency request there is no after-hours dispatch cost. The maintained-system
    credit on a failed sale is a share of the heating, cooling and ductwork benefit authorized on the order less
    the reversals of such authorizations: when the seller holds an active Bridgewell HVAC maintenance agreement
    on the same property address and at least maintained_visit_count completed tune-up visits are recorded under
    the seller's maintenance agreements in the twelve months before the billing date, the share is maintained_upper_rate;
    when the seller holds such an agreement on the same address and fewer than maintained_visit_count but at least
    one completed tune-up visit is recorded in those twelve months, the share is maintained_lower_rate; otherwise
    there is no maintained-system credit. The missed-contact service credit on a failed sale is a flat credit for
    listing-period service in which a contractor missed the contact window: when two or more re-dispatches after
    a missed contact window are recorded on the order the credit is missed_contact_multi_credit, when exactly one
    is recorded it is missed_contact_single_credit, and when none is recorded there is no missed-contact service
    credit. The keep-home waiver on a failed sale is a share of the charge waived when the seller keeps the home
    under a Bridgewell homeowner service contract for the same property address whose start date falls on or after
    the order's end_date and no more than keep_home_window_days calendar days after it: when that homeowner contract's
    tier carries a monthly_premium at or above keep_home_upper_monthly the waiver share is keep_home_upper_rate,
    when it carries a monthly_premium below keep_home_upper_monthly the waiver share is keep_home_lower_rate, and
    when the seller holds no such homeowner contract there is no keep-home waiver. The amounts combine in this order:
    first the lesser of the failed-sale charge cap and the seller-phase benefit paid is taken, then the after-hours
    dispatch cost is added to it, then the maintained-system credit and the missed-contact service credit are subtracted,
    and that subtotal is floored at zero; the keep-home waiver share is then applied once to that floored subtotal,
    which is reduced by the waiver share, and the result is rounded to the cent as the failed-sale charge.
  prerequisite: []
  cross_category:
  - category: hvaccare
    as: history
    reads:
    - property_address
    - status
    - hvaccare_visit_events.event_type
    - hvaccare_visit_events.visit_status
    - hvaccare_visit_events.event_date
    note: >-
      The maintained-system credit tier is decided from the seller's HVAC maintenance agreement address and its
      completed tune-up visits in the last twelve months.
  - category: homeplan
    as: branch
    reads:
    - property_address
    - start_date
    - variant_name
    note: >-
      The keep-home waiver tier is decided from the start date and the tier monthly premium of the seller's homeowner
      contract on the same address.
  compute:
  - premium_invoiced: SUM('realty_billing_entries', 'amount', event_type='realty_invoice')
  - benefit_authorized: SUM('realty_claim_events', 'amount', event_type='realty_benefit_authorization')
  - benefit_reversed: SUM('realty_claim_events', 'amount', event_type='realty_authorization_reversal')
  - seller_benefit_paid: RND(benefit_authorized - benefit_reversed, 2)
  - days_in_force: DAYS(F('order_date'), F('end_date'))
  - listing_months_begun: MONTHS(F('order_date'), F('end_date')) + 1
  - charge_cap: >-
      RND(premium_invoiced * days_in_force / P('seller_coverage_max_days'), 2) if days_in_force < K('daily_proration_max_days')
      else (RND(premium_invoiced * listing_months_begun / K('listing_period_months'), 2) if days_in_force < P('seller_coverage_max_days')
      else premium_invoiced)
  - lesser_amount: MN(charge_cap, seller_benefit_paid)
  - emergency_requests: >-
      COUNT('realty_service_requests', date_field='request_date', coverage_phase='seller_listing', urgency='emergency')
  - hvac_emergency_requests: >-
      COUNT('realty_service_requests', date_field='request_date', coverage_phase='seller_listing', urgency='emergency',
      trade='hvac')
  - after_hours_rate: >-
      K('hvac_after_hours_rate') if hvac_emergency_requests >= 1 else (K('general_after_hours_rate') if (emergency_requests
      >= 1 and hvac_emergency_requests == 0) else 0)
  - dispatch_cost: RND(after_hours_rate * emergency_requests, 2)
  - hvac_benefit: >-
      SUM('realty_claim_events', 'amount', event_type='realty_benefit_authorization', covered_item='heating_system')
      + SUM('realty_claim_events', 'amount', event_type='realty_benefit_authorization', covered_item='cooling_system')
      + SUM('realty_claim_events', 'amount', event_type='realty_benefit_authorization', covered_item='ductwork')
      - SUM('realty_claim_events', 'amount', event_type='realty_authorization_reversal', covered_item='heating_system')
      - SUM('realty_claim_events', 'amount', event_type='realty_authorization_reversal', covered_item='cooling_system')
      - SUM('realty_claim_events', 'amount', event_type='realty_authorization_reversal', covered_item='ductwork')
  - tuneup_visits: >-
      XCOUNT('hvaccare', 'hvaccare_visit_events', within_months=12, date_field='event_date', event_type='hvaccare_tuneup_visit',
      visit_status='completed')
  - maintained_same_home: CFIELD('hvaccare', 'property_address', status='active') == F('property_address')
  - maintained_share: >-
      K('maintained_upper_rate') if (maintained_same_home and tuneup_visits >= K('maintained_visit_count')) else
      (K('maintained_lower_rate') if (maintained_same_home and tuneup_visits >= 1 and tuneup_visits < K('maintained_visit_count'))
      else 0)
  - maintained_credit: RND(hvac_benefit * maintained_share, 2)
  - missed_contact_redispatches: >-
      COUNT('realty_claim_events', event_type='realty_contractor_dispatch', dispatch_reason='redispatch_missed_contact')
  - missed_contact_credit: >-
      K('missed_contact_multi_credit') if missed_contact_redispatches >= 2 else (K('missed_contact_single_credit')
      if missed_contact_redispatches == 1 else 0)
  - floored_subtotal: >-
      MX(0, RND(lesser_amount + dispatch_cost - maintained_credit - missed_contact_credit, 2)) if seller_benefit_paid
      > 0 else 0
  - kept_home_start: CFIELD('homeplan', 'start_date', property_address=F('property_address'))
  - kept_home_monthly: CPARAM('homeplan', 'monthly_premium', property_address=F('property_address')) or 0
  - days_to_keep_home: DAYS(F('end_date'), kept_home_start) if kept_home_start else -1
  - waiver_share: >-
      K('keep_home_upper_rate') if (days_to_keep_home >= 0 and days_to_keep_home <= K('keep_home_window_days') and
      kept_home_monthly >= K('keep_home_upper_monthly')) else (K('keep_home_lower_rate') if (days_to_keep_home >=
      0 and days_to_keep_home <= K('keep_home_window_days') and kept_home_monthly < K('keep_home_upper_monthly'))
      else 0)
  - result: RND(floored_subtotal * (1 - waiver_share), 2)
  compute_basis:
    premium_invoiced: The plan premium invoiced is the sum of the plan invoices on the order
    benefit_authorized: >-
      the seller-phase benefit paid is the sum of the benefit authorizations on the order less the authorization
      reversals on it.
    benefit_reversed: >-
      the seller-phase benefit paid is the sum of the benefit authorizations on the order less the authorization
      reversals on it.
    seller_benefit_paid: >-
      the seller-phase benefit paid is the sum of the benefit authorizations on the order less the authorization
      reversals on it.
    days_in_force: >-
      The failed-sale charge cap follows how long the listing order stayed in force, counted as the calendar days
      from order_date to the order's end_date
    listing_months_begun: where the listing months begun are the whole calendar months from order_date to end_date
      plus one
    charge_cap: >-
      when the order ended fewer than daily_proration_max_days days after order_date, the cap is the plan premium
      invoiced times those days divided by seller_coverage_max_days, rounded to the cent; when it ended at least
      daily_proration_max_days days but fewer than seller_coverage_max_days days after order_date, the cap is the
      plan premium invoiced times the listing months begun divided by listing_period_months, rounded to the cent,
      where the listing months begun are the whole calendar months from order_date to end_date plus one; when it
      ended seller_coverage_max_days or more days after order_date, the cap is the full plan premium invoiced.
    lesser_amount: first the lesser of the failed-sale charge cap and the seller-phase benefit paid is taken
    emergency_requests: >-
      the listing's after-hours rate times the number of emergency requests the seller placed in the seller phase
    hvac_emergency_requests: when at least one of those emergency requests was in the hvac trade
    after_hours_rate: >-
      when at least one of those emergency requests was in the hvac trade the after-hours rate is hvac_after_hours_rate,
      the costliest after-hours dispatch; when there were emergency requests but none in the hvac trade it is general_after_hours_rate;
      and when the seller placed no emergency request there is no after-hours dispatch cost.
    dispatch_cost: >-
      The after-hours dispatch cost recovered on a failed sale is the listing's after-hours rate times the number
      of emergency requests the seller placed in the seller phase
    hvac_benefit: >-
      a share of the heating, cooling and ductwork benefit authorized on the order less the reversals of such authorizations
    tuneup_visits: >-
      at least maintained_visit_count completed tune-up visits are recorded under the seller's maintenance agreements
      in the twelve months before the billing date
    maintained_same_home: when the seller holds an active Bridgewell HVAC maintenance agreement on the same property
      address
    maintained_share: >-
      the share is maintained_upper_rate; when the seller holds such an agreement on the same address and fewer
      than maintained_visit_count but at least one completed tune-up visit is recorded in those twelve months, the
      share is maintained_lower_rate; otherwise there is no maintained-system credit.
    maintained_credit: >-
      The maintained-system credit on a failed sale is a share of the heating, cooling and ductwork benefit authorized
      on the order less the reversals of such authorizations
    missed_contact_redispatches: re-dispatches after a missed contact window are recorded on the order
    missed_contact_credit: >-
      when two or more re-dispatches after a missed contact window are recorded on the order the credit is missed_contact_multi_credit,
      when exactly one is recorded it is missed_contact_single_credit, and when none is recorded there is no missed-contact
      service credit.
    floored_subtotal: >-
      then the after-hours dispatch cost is added to it, then the maintained-system credit and the missed-contact
      service credit are subtracted, and that subtotal is floored at zero; no failed-sale charge is billed when
      the seller-phase benefit paid is zero
    kept_home_start: >-
      a Bridgewell homeowner service contract for the same property address whose start date falls on or after the
      order's end_date and no more than keep_home_window_days calendar days after it
    kept_home_monthly: when that homeowner contract's tier carries a monthly_premium at or above keep_home_upper_monthly
    days_to_keep_home: >-
      whose start date falls on or after the order's end_date and no more than keep_home_window_days calendar days
      after it
    waiver_share: >-
      when that homeowner contract's tier carries a monthly_premium at or above keep_home_upper_monthly the waiver
      share is keep_home_upper_rate, when it carries a monthly_premium below keep_home_upper_monthly the waiver
      share is keep_home_lower_rate, and when the seller holds no such homeowner contract there is no keep-home
      waiver.
    result: >-
      the keep-home waiver share is then applied once to that floored subtotal, which is reduced by the waiver share,
      and the result is rounded to the cent as the failed-sale charge.
  factors:
  - id: listing_cap_proration
    effect: method
    decides: charge_cap
    bindings:
    - days_in_force
    - listing_months_begun
    - charge_cap
    ladder:
    - when: the listing order ended fewer than daily_proration_max_days calendar days after order_date
      method: >-
        the cap is the plan premium invoiced times the days in force divided by seller_coverage_max_days, rounded
        to the cent (daily proration)
    - when: >-
        the listing order ended at least daily_proration_max_days but fewer than seller_coverage_max_days calendar
        days after order_date
      method: >-
        the cap is the plan premium invoiced times the listing months begun (whole months plus one) divided by listing_period_months,
        rounded to the cent (proration by months begun)
    - when: otherwise (the order stayed in force seller_coverage_max_days days or more)
      method: the cap is the full plan premium invoiced
    baseline:
      charge_cap: premium_invoiced
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: after_hours_dispatch_recovery
    effect: parameter
    decides: after_hours_rate
    bindings:
    - emergency_requests
    - hvac_emergency_requests
    - after_hours_rate
    - dispatch_cost
    ladder:
    - when: at least one emergency seller-phase request in the hvac trade
      value: K('hvac_after_hours_rate') per emergency seller-phase request
    - when: emergency seller-phase requests AND none of them in the hvac trade
      value: K('general_after_hours_rate') per emergency seller-phase request
    - when: otherwise (no emergency seller-phase request)
      value: no after-hours dispatch cost (0)
    baseline:
      after_hours_rate: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: maintained_hvac_credit
    effect: parameter
    decides: maintained_share
    bindings:
    - hvac_benefit
    - tuneup_visits
    - maintained_same_home
    - maintained_share
    - maintained_credit
    ladder:
    - when: >-
        an active Bridgewell HVAC maintenance agreement on the same property address AND at least maintained_visit_count
        completed tune-up visits in the last twelve months
      value: K('maintained_upper_rate') of the net heating, cooling and ductwork benefit
    - when: >-
        an active Bridgewell HVAC maintenance agreement on the same property address AND at least one but fewer
        than maintained_visit_count completed tune-up visits in the last twelve months
      value: K('maintained_lower_rate') of the net heating, cooling and ductwork benefit
    - when: otherwise
      value: no maintained-system credit (0)
    baseline:
      maintained_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: missed_contact_service_credit
    effect: parameter
    decides: missed_contact_credit
    bindings:
    - missed_contact_redispatches
    - missed_contact_credit
    ladder:
    - when: two or more re-dispatches after a missed contact window on the order
      value: K('missed_contact_multi_credit')
    - when: exactly one re-dispatch after a missed contact window on the order
      value: K('missed_contact_single_credit')
    - when: otherwise
      value: no missed-contact service credit (0)
    baseline:
      missed_contact_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: keep_home_waiver
    effect: parameter
    decides: waiver_share
    bindings:
    - kept_home_start
    - kept_home_monthly
    - days_to_keep_home
    - waiver_share
    ladder:
    - when: >-
        a Bridgewell homeowner contract on the same address started 0 to keep_home_window_days days after the order's
        end_date AND its tier monthly_premium is at or above keep_home_upper_monthly
      value: K('keep_home_upper_rate') of the charge waived
    - when: >-
        a Bridgewell homeowner contract on the same address started 0 to keep_home_window_days days after the order's
        end_date AND its tier monthly_premium is below keep_home_upper_monthly
      value: K('keep_home_lower_rate') of the charge waived
    - when: otherwise
      value: no keep-home waiver (0)
    baseline:
      waiver_share: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: homeplan
  baseline:
    rule: >-
      The failed-sale charge is worked out from the order's own billing and claim records. The plan premium invoiced
      is the sum of the plan invoices on the order, and the seller-phase benefit paid is the sum of the benefit
      authorizations on the order less the authorization reversals on it. The failed-sale charge cap is the plan
      premium invoiced. The failed-sale charge is the lesser of the failed-sale charge cap and the seller-phase
      benefit paid, never below zero, rounded to the cent.
    params:
    - seller_coverage_max_days
  inputs:
    history:
    - table: realty_billing_entries
      aggregate: sum
      field: amount
      filters:
        event_type: realty_invoice
    - table: realty_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: realty_benefit_authorization
