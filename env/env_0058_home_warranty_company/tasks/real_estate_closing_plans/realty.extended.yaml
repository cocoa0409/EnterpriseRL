events:
- type: realty_order
  target: realty_contracts
  mutation: create
  meaning: >-
    A real estate agent (or a buyer or seller directly) orders a real estate plan for a property being sold, either
    with seller listing coverage or as a buyer-only order.
  grain: One row per plan ordered for one property transaction.
  fields:
    customer_id: >-
      The covered homeowner at order time (the seller on a listing order, the buyer on a buyer-only order).
    variant_name: The plan ordered.
    order_type: listing_with_seller_coverage or buyer_only.
    ordering_agent_license_number: The license number of the ordering real estate agent; empty when a homeowner
      orders directly.
    ordering_agent_side: >-
      Whether the ordering agent represents the seller (listing_agent) or the buyer (buyer_agent); none when a homeowner
      orders directly.
    property_address: The property address as stated on the order.
    property_zip: The property ZIP code.
    property_type: The dwelling type.
    unit_count: Number of dwelling units (1 to 4).
    square_footage: Living-area square footage.
    home_inspection_completed: Whether a home inspection was completed before closing, per the order.
    certificate_of_occupancy_date: For a new construction plan, the certificate of occupancy date; empty otherwise.
    order_date: The order date.
    listing_coverage_end_date: For a listing order, the last day of seller coverage; empty for a buyer-only order.
    listing_extension_count: 0 at order.
    expected_closing_date: The expected closing date stated on the order, if known.
  triggers:
  - event: realty:realty_invoice
    map: {}
- type: realty_listing_extension
  target: realty_contracts
  mutation: update
  meaning: Seller listing coverage is extended because the home is still listed.
  grain: One row per transaction.
  fields:
    listing_coverage_end_date: The extended last day of seller coverage.
    listing_extension_count: Incremented by one.
  triggers: []
- type: realty_closing_date_change
  target: realty_contracts
  mutation: update
  meaning: The ordering agent reports a new expected closing date.
  grain: One row per transaction.
  fields:
    expected_closing_date: The new expected closing date.
  triggers: []
- type: realty_closing_recorded
  target: realty_contracts
  mutation:
    transition:
    - from: listing_coverage
      to: closed_pending_payment
    - from: awaiting_closing
      to: closed_pending_payment
  meaning: The sale closes; buyer coverage dates are set and the buyer becomes the contract holder.
  grain: One row per transaction.
  fields:
    status: Becomes closed_pending_payment.
    customer_id: The buyer, who now holds the contract.
    closing_date: The actual closing date.
    escrow_file_number: The escrow or title file number for the closing, verbatim from the agent or escrow officer.
    coverage_start_date: Equal to the closing date.
    term_end_date: The last day of the buyer term.
  triggers: []
- type: realty_coverage_activation
  target: realty_contracts
  mutation:
    transition:
      from: closed_pending_payment
      to: active
  meaning: The plan invoice is paid within the escrow payment window and buyer coverage is confirmed.
  grain: One row per transaction.
  fields:
    status: Becomes active.
  triggers: []
- type: realty_void_unpaid
  target: realty_contracts
  mutation:
    transition:
      from: closed_pending_payment
      to: voided
  meaning: The plan invoice was not paid within the escrow payment window and the plan is voided.
  grain: One row per transaction.
  fields:
    status: Becomes voided.
    end_date: The date the plan was voided.
  triggers:
  - event: realty:realty_credit_memo
    map:
      credit_reason: invoice_voided
  - event: addon:addon_rider_base_termination
    map: {}
- type: realty_listing_expiration
  target: realty_contracts
  mutation:
    transition:
      from: listing_coverage
      to: listing_expired
  meaning: The seller listing period ends without a closing.
  grain: One row per transaction.
  fields:
    status: Becomes listing_expired.
    end_date: The listing_coverage_end_date that passed.
  triggers:
  - event: realty:realty_credit_memo
    map:
      credit_reason: listing_expired_unclosed
  - event: addon:addon_rider_base_termination
    map: {}
- type: realty_order_cancellation
  target: realty_contracts
  mutation:
    transition:
    - from: listing_coverage
      to: cancelled
    - from: awaiting_closing
      to: cancelled
  meaning: >-
    The order is cancelled before closing because the listing was withdrawn, the sale fell through, or a buyer-only
    order lapsed.
  grain: One row per transaction.
  fields:
    status: Becomes cancelled.
    end_date: The cancellation date.
  triggers:
  - event: realty:realty_credit_memo
    map:
      credit_reason: order_cancelled
  - event: addon:addon_rider_base_termination
    map: {}
- type: realty_buyer_cancellation
  target: realty_contracts
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: The buyer cancels buyer coverage during the term.
  grain: One row per transaction.
  fields:
    status: Becomes cancelled.
    end_date: The date the buyer gave notice, which is the cancellation effective date.
  triggers:
  - event: realty:realty_credit_memo
    map:
      credit_reason: buyer_cancellation_refund_credit
  - event: addon:addon_rider_base_termination
    map: {}
- type: realty_term_expiration
  target: realty_contracts
  mutation:
    transition:
      from: active
      to: expired
  meaning: The buyer term ends.
  grain: One row per transaction.
  fields:
    status: Becomes expired.
    end_date: The term_end_date.
  triggers:
  - event: addon:addon_rider_base_termination
    map: {}
- type: realty_conversion
  target: realty_contracts
  mutation:
    transition:
    - from: active
      to: converted
    - from: expired
      to: converted
  meaning: The buyer accepts the direct renewal offer and continues under a homeowner service contract.
  grain: One row per transaction.
  fields:
    status: Becomes converted.
    end_date: The conversion date.
  triggers:
  - event: homeplan:homeplan_enrollment
    map:
      customer_id: customer_id
      realty_contract_id: realty_contract_id
      enrollment_channel: realty_conversion
  - event: addon:addon_rider_base_termination
    map: {}
- type: realty_invoice
  target: realty_billing_entries
  meaning: The plan premium is invoiced for payment through escrow at closing.
  grain: One row per invoice number.
  distinguish_by:
  - invoice_number
  fields:
    entry_date: The invoice date.
    amount: The plan premium invoiced, positive.
    invoice_number: The invoice number.
    due_date: >-
      The date payment is due (the closing date plus the escrow payment window once closing is recorded; the expected
      closing date before then).
  account: invoice_balance
  direction: in
  triggers: []
- type: realty_seller_service_charge
  target: realty_billing_entries
  meaning: The seller is billed for listing-period service because the sale did not close.
  grain: One row per failed-sale charge invoice.
  distinguish_by:
  - invoice_number
  fields:
    entry_date: The billing date.
    amount: The failed-sale charge, positive.
    invoice_number: The failed-sale invoice number.
    due_date: The payment due date.
  account: invoice_balance
  direction: in
  triggers: []
- type: realty_payment
  target: realty_billing_entries
  meaning: A payment is received against a realty invoice.
  grain: One row per payment posted.
  distinguish_by:
  - payment_reference
  fields:
    entry_date: The posting date.
    amount: The amount paid, positive.
    payment_reference: The payment confirmation number.
    invoice_number: The invoice paid.
    payer_role: Who paid (escrow, buyer or seller).
    payment_method: How it was paid.
  account: invoice_balance
  direction: out
  triggers: []
- type: realty_credit_memo
  target: realty_billing_entries
  meaning: >-
    An invoice is credited, in full when an order is cancelled, expires unclosed or is voided, or by the refundable
    amount when a buyer cancels.
  grain: One row per credit on one invoice for one reason.
  distinguish_by:
  - invoice_number
  - credit_reason
  fields:
    entry_date: The posting date.
    amount: The credit amount, positive.
    invoice_number: The invoice credited.
    credit_reason: Why it is credited.
  account: invoice_balance
  direction: out
  triggers: []
- type: realty_refund
  target: realty_billing_entries
  meaning: A credit balance is refunded to the party that paid.
  grain: One row per refund disbursed.
  distinguish_by:
  - refund_reference
  fields:
    entry_date: The disbursement date.
    amount: The refund amount, positive.
    refund_reference: The refund confirmation number.
    invoice_number: The invoice whose credit is refunded.
    payer_role: Who receives the refund.
    payment_method: How it is refunded.
  account: invoice_balance
  direction: in
  triggers: []
- type: realty_service_fee_charge
  target: realty_billing_entries
  meaning: A service call fee is collected on a service request.
  grain: One row per service request charged.
  distinguish_by:
  - realty_service_request_id
  fields:
    entry_date: The collection date.
    amount: The fee collected, positive.
    realty_service_request_id: The service request.
  account: service_fee_balance
  direction: in
  triggers: []
- type: realty_service_fee_refund
  target: realty_billing_entries
  meaning: A service call fee is refunded.
  grain: One row per service request refunded.
  distinguish_by:
  - realty_service_request_id
  fields:
    entry_date: The refund date.
    amount: The amount refunded, positive.
    realty_service_request_id: The service request.
  account: service_fee_balance
  direction: out
  triggers: []
- type: realty_service_request
  target: realty_service_requests
  meaning: >-
    The covered party (seller during listing, buyer after closing) reports a failure or asks for the rekey benefit.
  grain: One row per item failure or rekey request.
  distinguish_by:
  - realty_service_request_id
  fields:
    realty_service_request_id: The service request number.
    request_date: The date the request was placed.
    coverage_phase: Whether the request falls under seller listing coverage or buyer coverage.
    covered_item: The item that failed, or locks for a rekey.
    trade: The trade that services the item.
    request_type: new_failure, recall or rekey.
    urgency: Emergency or routine.
    failure_description: The caller's description, verbatim.
  triggers:
  - event: realty:realty_service_fee_charge
    when:
      request_type: new_failure
    map:
      realty_service_request_id: realty_service_request_id
- type: realty_contractor_dispatch
  target: realty_claim_events
  meaning: A network contractor is assigned to a service request.
  grain: One row per assignment on one service request.
  distinguish_by:
  - realty_service_request_id
  - dispatch_sequence
  fields:
    realty_service_request_id: The service request.
    event_date: The assignment date.
    service_contractor_id: The contractor assigned.
    dispatch_sequence: 1 for the first assignment, incremented per further assignment.
    dispatch_reason: Initial, re-dispatch after a missed contact window, or recall.
  triggers: []
- type: realty_coverage_determination
  target: realty_claim_events
  meaning: Bridgewell decides whether the reported failure is covered.
  grain: One row per service request.
  distinguish_by:
  - realty_service_request_id
  fields:
    realty_service_request_id: The service request.
    event_date: The determination date.
    covered_item: The item.
    determination_outcome: Covered or not covered.
    denial_reason: The controlled reason when not covered.
  triggers: []
- type: realty_benefit_authorization
  target: realty_claim_events
  meaning: >-
    Bridgewell authorizes a repair, a replacement, a cash-in-lieu settlement, the rekey benefit or a supplemental
    allowance on a covered request.
  grain: One row per authorization number.
  distinguish_by:
  - authorization_number
  fields:
    realty_service_request_id: The service request.
    event_date: The authorization date.
    covered_item: The item.
    authorization_number: The authorization number issued.
    resolution_type: repair, replacement, cash_in_lieu, rekey or allowance.
    allowance_type: For an allowance, which one (code_violation, permit, haul_away, refrigerant); empty otherwise.
    invoice_amount: For an allowance, the documented cost it pays toward; empty otherwise.
    repair_estimate: The contractor's repair estimate.
    replacement_cost: Bridgewell's contracted replacement cost.
    amount: The amount Bridgewell pays.
  account: benefit_consumed
  direction: in
  triggers: []
- type: realty_authorization_reversal
  target: realty_claim_events
  meaning: An authorization is reversed because the work will not be performed.
  grain: One row per authorization reversed.
  distinguish_by:
  - reversed_authorization_number
  fields:
    realty_service_request_id: The service request.
    event_date: The reversal date.
    reversed_authorization_number: The authorization reversed.
    reversal_reason: Why.
    amount: The amount reversed, positive.
  account: benefit_consumed
  direction: out
  triggers: []
measures:
- id: realty_msr_seller_phase_benefit_paid
  window: >-
    The whole seller listing coverage period of the order (order_date through the closing, expiration or cancellation).
  measure: >-
    Sum of amount on realty_benefit_authorization rows whose service request has coverage_phase seller_listing,
    minus amount on realty_authorization_reversal rows for those authorizations.
- id: realty_msr_seller_item_benefit_paid
  window: The whole seller listing coverage period of the order.
  measure: The same sum as realty_msr_seller_phase_benefit_paid restricted to rows for the same covered_item.
- id: realty_msr_contract_year_benefit_paid
  window: >-
    The buyer contract year in which the service request's request_date falls; contract years are consecutive 12-month
    periods starting on coverage_start_date.
  measure: >-
    Sum of amount on realty_benefit_authorization rows whose service request has coverage_phase buyer and falls
    in the window, minus amount on realty_authorization_reversal rows for those authorizations.
- id: realty_msr_item_benefit_paid_year
  window: The buyer contract year in which the service request's request_date falls.
  measure: >-
    The same sum as realty_msr_contract_year_benefit_paid restricted to rows for the same covered_item and excluding
    allowance rows.
- id: realty_msr_refrigerant_paid_year
  window: The buyer contract year in which the service request's request_date falls.
  measure: >-
    Sum of amount on realty_benefit_authorization rows with resolution_type allowance and allowance_type refrigerant
    in the window, net of reversals.
- id: realty_msr_plan_premium_invoiced
  window: The life of the order.
  measure: Sum of amount on realty_invoice rows on the contract.
- id: realty_msr_plan_premium_paid
  window: The life of the order.
  measure: Sum of amount on realty_payment rows applied to the contract's realty_invoice invoice numbers.
- id: realty_msr_days_since_closing
  window: From closing_date to the buyer's cancellation notice date.
  measure: Count of calendar days from the day after closing_date through the notice date inclusive.
- id: realty_msr_unexpired_term_days
  window: The buyer term as of the cancellation notice date.
  measure: Count of calendar days from the day after the notice date through term_end_date inclusive.
- id: realty_msr_term_days
  window: The buyer term.
  measure: Count of calendar days from coverage_start_date through term_end_date inclusive.
policies:
- id: realty_agg_multi_holding
  subject:
  - realty_order
  rule: >-
    There is no limit on how many real estate contracts one customer may be associated with: a homeowner may be
    the seller on one transaction and the buyer on another, and an agent may order plans for any number of clients.
    How many open orders one property may carry is governed by realty_agg_one_open_order_per_property.
  eligibility: []
  params:
    max_per_customer: null
- id: realty_agg_one_open_order_per_property
  subject:
  - realty_order
  rule: >-
    One property transaction carries one real estate plan. A new real estate order is not placed when a real estate
    contract for the same property address is in status listing_coverage, awaiting_closing or closed_pending_payment.
    On a listed property whose listing order carries seller coverage, the buyer's coverage is provided by that same
    order at closing; the buyer's agent may change the plan on that order before closing instead of placing a second
    order. A buyer-only order may be placed on a property whose earlier real estate contract is active, expired,
    converted, cancelled, voided or listing_expired. Seller listing coverage duplicates the seller's own homeowner
    service contract: a listing order with seller coverage is not placed for a seller who holds a homeowner service
    contract in status active for the same address, and such a seller is offered a buyer-only order instead.
  eligibility:
  - id: no_open_order_on_property
    applies_to:
    - realty_order
    kind: dedup
    condition: >-
      A new real estate order is not placed when a real estate contract for the same property address is in status
      listing_coverage, awaiting_closing or closed_pending_payment.
    evidence_fields:
    - realty_contracts.property_address
    - realty_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.property_address
      action_bindings:
        realty_contracts.property_address: property_address
    dedup_contract:
      table: realty_contracts
      mode: separate_record
      object_bindings:
        property_address: property_address
      duplicate_filters:
        status:
        - listing_coverage
        - awaiting_closing
        - closed_pending_payment
      distinct_fields: []
- id: realty_order_requirements
  subject:
  - realty_order
  rule: >-
    A real estate plan is ordered by a licensed real estate agent for a client, or directly by the buyer or the
    seller of the property. An order placed by an agent is accepted only when ordering_agent_license_number matches
    the real estate license number on a real estate agent profile on file. The property type, unit count and square
    footage on the order are taken from the ordering party's statement and must satisfy the entry gate of the plan
    ordered. A listing_with_seller_coverage order is placed only by or for the seller, only on a plan whose seller_coverage_available
    is true, and only while the home is listed for sale; its customer is the seller and it starts in listing_coverage
    on order_date with listing_coverage_end_date equal to order_date plus seller_coverage_max_days calendar days.
    A buyer_only order is placed for the buyer once a purchase contract is signed; its customer is the buyer and
    it starts in awaiting_closing with no coverage until closing. The New Construction Three-Year plan is ordered
    only buyer_only, for a single-unit home whose certificate of occupancy is dated no more than the entry gate's
    day limit before the expected closing. Agents receive no compensation of any kind for ordering a plan. The plan
    ordered may be changed to another plan at any time before closing, and the invoice is then reissued at the new
    plan's premium.
  eligibility:
  - id: ordering_agent_license_on_file
    applies_to:
    - realty_order
    kind: authorization
    condition: >-
      An order placed by an agent is accepted only when ordering_agent_license_number matches the real estate license
      number on a real estate agent profile on file.
    evidence_fields:
    - customers.real_estate_license_number
    - customers.customer_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.real_estate_license_number
      action_bindings:
        customers.real_estate_license_number: ordering_agent_license_number
  - id: property_within_entry_gate
    applies_to:
    - realty_order
    kind: caller_fact
    condition: >-
      The property type, unit count and square footage on the order are taken from the ordering party's statement
      and must satisfy the entry gate of the plan ordered.
    evidence_fields:
    - realty_contracts.property_address
    - realty_contracts.property_type
    - realty_contracts.unit_count
    - realty_contracts.square_footage
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - realty_contracts.property_address
      action_bindings:
        realty_contracts.property_address: property_address
  params:
    per_tier:
      Bridgewell Closing Starter:
        seller_coverage_available: =seller_coverage_available
        seller_coverage_max_days: =seller_coverage_max_days
      Bridgewell Closing Standard:
        seller_coverage_available: =seller_coverage_available
        seller_coverage_max_days: =seller_coverage_max_days
      Bridgewell Closing Plus:
        seller_coverage_available: =seller_coverage_available
        seller_coverage_max_days: =seller_coverage_max_days
      Bridgewell Closing Premier:
        seller_coverage_available: =seller_coverage_available
        seller_coverage_max_days: =seller_coverage_max_days
      Bridgewell Closing Premier Two-Year:
        seller_coverage_available: =seller_coverage_available
        seller_coverage_max_days: =seller_coverage_max_days
      Bridgewell New Construction Three-Year:
        seller_coverage_available: =seller_coverage_available
        seller_coverage_max_days: =seller_coverage_max_days
- id: realty_premium_pricing
  subject:
  - realty_invoice
  - realty_order
  rule: >-
    The plan premium covers the whole buyer term and is invoiced once per order, payable through escrow at closing.
    It equals base_premium, plus oversize_premium_surcharge when square_footage is at or above oversize_threshold_sqft,
    plus additional_unit_premium for each dwelling unit beyond the first, minus condo_premium_discount when property_type
    is condominium or townhome. Seller listing coverage carries no separate premium. When the plan is changed before
    closing, the earlier invoice is credited in full and a new invoice is issued at the new plan's premium. The
    invoice is due on the closing date. The plan premium is invoiced only on an order in status listing_coverage
    or awaiting_closing.
  eligibility:
  - id: invoice_before_closing_only
    applies_to:
    - realty_invoice
    kind: state
    condition: The plan premium is invoiced only on an order in status listing_coverage or awaiting_closing.
    evidence_fields:
    - realty_contracts.status
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    state_contract:
      field: realty_contracts.status
      allowed:
      - listing_coverage
      - awaiting_closing
  params:
    per_tier:
      Bridgewell Closing Starter:
        base_premium: =base_premium
        additional_unit_premium: =additional_unit_premium
      Bridgewell Closing Standard:
        base_premium: =base_premium
        additional_unit_premium: =additional_unit_premium
      Bridgewell Closing Plus:
        base_premium: =base_premium
        additional_unit_premium: =additional_unit_premium
      Bridgewell Closing Premier:
        base_premium: =base_premium
        additional_unit_premium: =additional_unit_premium
      Bridgewell Closing Premier Two-Year:
        base_premium: =base_premium
        additional_unit_premium: =additional_unit_premium
      Bridgewell New Construction Three-Year:
        base_premium: =base_premium
        additional_unit_premium: =additional_unit_premium
  formula:
    plan_premium: >-
      base_premium + (oversize_premium_surcharge if square_footage >= oversize_threshold_sqft else 0) + additional_unit_premium
      * (unit_count - 1) - (condo_premium_discount if property_type in ['condominium', 'townhome'] else 0)
- id: realty_seller_listing_coverage
  subject:
  - realty_listing_extension
  - realty_listing_expiration
  rule: >-
    Seller listing coverage runs from order_date through listing_coverage_end_date and ends earlier when the sale
    closes or the order is cancelled. It covers the seller for failures of items the plan covers, limited to seller_item_cap
    per item and seller_aggregate_cap in total, with heating, cooling and ductwork covered only when seller_hvac_covered
    is true; roof leaks and the rekey benefit are never part of seller coverage. A listing extension is granted
    only while the order is in status listing_coverage. A listing extension is granted only when it is requested
    no later than seller_coverage_max_days calendar days after the order is placed, counting from the day after
    order_date with the boundary day included. A listing extension is granted only while listing_extension_count
    is below max_seller_extensions. An extension adds seller_extension_days calendar days to listing_coverage_end_date.
    When listing_coverage_end_date passes without a closing, the order moves to listing_expired on the following
    day, the plan invoice is credited in full, and any listing-period service is billed under realty_failed_sale_charges.
    A seller whose listing expired may have the agent place a new order.
  eligibility:
  - id: extension_only_during_listing
    applies_to:
    - realty_listing_extension
    kind: state
    condition: A listing extension is granted only while the order is in status listing_coverage.
    evidence_fields:
    - realty_contracts.status
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    state_contract:
      field: realty_contracts.status
      allowed:
      - listing_coverage
  - id: extension_requested_before_original_end
    applies_to:
    - realty_listing_extension
    kind: time
    condition: >-
      A listing extension is granted only when it is requested no later than seller_coverage_max_days calendar days
      after the order is placed, counting from the day after order_date with the boundary day included.
    evidence_fields:
    - realty_contracts.order_date
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the order is placed
      anchor_source: realty_contracts.order_date
      relation: not_after
      duration_source: variants.seller_coverage_max_days
      unit: calendar_days
      counting_rule: counting from the day after order_date with the boundary day included
      boundary: inclusive
  - id: extension_count_below_limit
    applies_to:
    - realty_listing_extension
    kind: authorization
    condition: A listing extension is granted only while listing_extension_count is below max_seller_extensions.
    evidence_fields:
    - realty_contracts.listing_extension_count
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
  params:
    per_tier:
      Bridgewell Closing Starter:
        seller_item_cap: =seller_item_cap
        seller_aggregate_cap: =seller_aggregate_cap
        seller_hvac_covered: =seller_hvac_covered
      Bridgewell Closing Standard:
        seller_item_cap: =seller_item_cap
        seller_aggregate_cap: =seller_aggregate_cap
        seller_hvac_covered: =seller_hvac_covered
      Bridgewell Closing Plus:
        seller_item_cap: =seller_item_cap
        seller_aggregate_cap: =seller_aggregate_cap
        seller_hvac_covered: =seller_hvac_covered
      Bridgewell Closing Premier:
        seller_item_cap: =seller_item_cap
        seller_aggregate_cap: =seller_aggregate_cap
        seller_hvac_covered: =seller_hvac_covered
      Bridgewell Closing Premier Two-Year:
        seller_item_cap: =seller_item_cap
        seller_aggregate_cap: =seller_aggregate_cap
        seller_hvac_covered: =seller_hvac_covered
      Bridgewell New Construction Three-Year:
        seller_item_cap: =seller_item_cap
        seller_aggregate_cap: =seller_aggregate_cap
        seller_hvac_covered: =seller_hvac_covered
- id: realty_closing_and_escrow
  subject:
  - realty_closing_recorded
  - realty_closing_date_change
  - realty_coverage_activation
  - realty_void_unpaid
  - realty_payment
  - realty_order_cancellation
  rule: >-
    The ordering agent or the escrow officer reports the closing with the actual closing_date and the escrow_file_number;
    the buyer, whose customer profile must be on file, becomes the contract holder, and coverage_start_date equals
    closing_date. term_end_date is the day before the same calendar day buyer_term_months later, falling back to
    the last day of the month when that day does not exist. Seller listing coverage ends at closing; requests the
    seller placed before closing are finished under seller coverage. The expected closing date may be changed only
    before closing. Payments are applied to the oldest open invoice first. Buyer coverage is confirmed only when
    the plan invoice is paid in full no later than escrow_payment_window_days calendar days after the sale closes,
    counting from the day after closing_date with the boundary day included. Once confirmed, buyer coverage applies
    to failures reported from closing_date onward. While the contract is closed_pending_payment the buyer's service
    requests are recorded but no contractor is dispatched. A plan whose invoice is still unpaid is voided once more
    than escrow_payment_window_days calendar days have passed after the sale closes, counted from the day after
    closing_date. A voided plan's invoice is credited in full, requests recorded while it was pending are closed
    not covered, and a payment arriving after the void is refunded to the payer. A buyer-only order still in awaiting_closing
    more than pending_order_expiry_days calendar days after its expected closing date lapses and is cancelled by
    the agent; the agent may also cancel a listing or buyer-only order at any time before closing when the sale
    will not proceed.
  eligibility:
  - id: invoice_paid_within_window
    applies_to:
    - realty_coverage_activation
    kind: time
    condition: >-
      Buyer coverage is confirmed only when the plan invoice is paid in full no later than escrow_payment_window_days
      calendar days after the sale closes, counting from the day after closing_date with the boundary day included.
    evidence_fields:
    - realty_contracts.closing_date
    - realty_contracts.invoice_balance
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the sale closes
      anchor_source: realty_contracts.closing_date
      relation: not_after
      duration_source: variants.escrow_payment_window_days
      unit: calendar_days
      counting_rule: counting from the day after closing_date with the boundary day included
      boundary: inclusive
  - id: void_only_after_window
    applies_to:
    - realty_void_unpaid
    kind: time
    condition: >-
      A plan whose invoice is still unpaid is voided once more than escrow_payment_window_days calendar days have
      passed after the sale closes, counted from the day after closing_date.
    evidence_fields:
    - realty_contracts.closing_date
    - realty_contracts.invoice_balance
    - realty_contracts.realty_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - realty_contracts.realty_contract_id
      action_bindings:
        realty_contracts.realty_contract_id: realty_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the sale closes
      anchor_source: realty_contracts.closing_date
      relation: not_before
      duration_source: variants.escrow_payment_window_days
      unit: calendar_days
      counting_rule: counted from the day after closing_date
      boundary: exclusive
  params:
    per_tier:
      Bridgewell Closing Starter:
        buyer_term_months: =buyer_term_months
        escrow_payment_window_days: =escrow_payment_window_days
      Bridgewell Closing Standard:
        buyer_term_months: =buyer_term_months
        escrow_payment_window_days: =escrow_payment_window_days
      Bridgewell Closing Plus:
        buyer_term_months: =buyer_term_months
        escrow_payment_window_days: =escrow_payment_window_days
      Bridgewell Closing Premier:
        buyer_term_months: =buyer_term_months
        escrow_payment_window_days: =escrow_payment_window_days
      Bridgewell Closing Premier Two-Year:
        buyer_term_months: =buyer_term_months
        escrow_payment_window_days: =escrow_payment_window_days
      Bridgewell New Construction Three-Year:
        buyer_term_months: =buyer_term_months
        escrow_payment_window_days: =escrow_payment_window_days
  measures:
