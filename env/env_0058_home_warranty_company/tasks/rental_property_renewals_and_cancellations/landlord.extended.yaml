events:
  - type: landlord_enrollment
    target: landlord_contracts
    mutation: create
    meaning: A landlord purchases a rental property service contract for one rental property.
    grain: One row per contract purchased.
    fields:
      customer_id: The landlord.
      variant_name: The tier purchased.
      property_address: The rental property address as stated.
      property_zip: The property ZIP code.
      property_type: The dwelling type.
      unit_count: Number of dwelling units covered.
      year_built: The year the building was built, as stated.
      tenant_contact_name: The tenant the landlord authorizes to place requests, verbatim; empty if none.
      tenant_contact_phone: That tenant's phone number; empty if none.
      start_date: The purchase date.
      term_start_date: Equal to start_date.
      term_end_date: The last day of the first term.
      coverage_effective_date: start_date plus the waiting period.
      term_number: 1.
      billing_frequency: Monthly or annual.
      auto_renew: Whether the contract renews automatically.
    triggers:
      - event: landlord:landlord_premium_charge
        when: {billing_frequency: monthly}
        map: {charge_type: monthly_installment}
      - event: landlord:landlord_premium_charge
        when: {billing_frequency: annual}
        map: {charge_type: annual_premium}
  - type: landlord_coverage_activation
    target: landlord_contracts
    mutation: {transition: {from: waiting_period, to: active}}
    meaning: The waiting period ends and coverage starts.
    grain: One row per transaction.
    fields:
      status: Becomes active.
    triggers: []
  - type: landlord_renewal_notice
    target: landlord_contracts
    mutation: update
    meaning: Bridgewell issues the renewal notice for the term, stating the renewal price with the portfolio discount then applicable.
    grain: One row per transaction.
    fields:
      renewal_notice_date: The date the notice was issued.
    triggers: []
  - type: landlord_renewal_preference_change
    target: landlord_contracts
    mutation: update
    meaning: The landlord turns automatic renewal on or off.
    grain: One row per transaction.
    fields:
      auto_renew: The new setting.
    triggers: []
  - type: landlord_renewal
    target: landlord_contracts
    mutation: update
    meaning: An active contract renews into a new term on its term end, optionally at a different tier.
    grain: One row per transaction.
    fields:
      term_start_date: The day after the prior term_end_date.
      term_end_date: The last day of the new term.
      term_number: Incremented by one.
      variant_name: The tier for the new term.
      prior_variant_name: The tier of the term that ended.
      renewal_notice_date: Cleared for the new term.
    triggers:
      - event: landlord:landlord_premium_charge
        map: {}
      - event: addon:addon_rider_renewal
        map: {}
  - type: landlord_plan_upgrade
    target: landlord_contracts
    mutation: update
    meaning: The landlord moves the contract to a higher tier during the term.
    grain: One row per transaction.
    fields:
      variant_name: The higher tier.
      prior_variant_name: The tier before the upgrade.
      last_plan_change_date: The upgrade date.
    triggers: []
  - type: landlord_tenant_contact_update
    target: landlord_contracts
    mutation: update
    meaning: The landlord changes or removes the authorized tenant contact, for example at tenant turnover.
    grain: One row per transaction.
    fields:
      tenant_contact_name: The new authorized tenant, verbatim; empty to remove.
      tenant_contact_phone: The new tenant phone; empty to remove.
    triggers: []
  - type: landlord_ownership_transfer
    target: landlord_contracts
    mutation: update
    meaning: The contract is transferred to the purchaser of the rental property, who keeps it as a rental.
    grain: One row per transaction.
    fields:
      customer_id: The purchaser, who now holds the contract.
      transfer_date: The transfer date.
      tenant_contact_name: Kept or cleared as the purchaser instructs.
      tenant_contact_phone: Kept or cleared as the purchaser instructs.
    triggers:
      - event: landlord:landlord_premium_charge
        map: {charge_type: transfer_fee}
  - type: landlord_cancellation
    target: landlord_contracts
    mutation: {transition: [{from: waiting_period, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The landlord confirms a cancellation request and the contract ends.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The notice date on the cancellation request.
    triggers:
      - event: landlord:landlord_premium_credit
        map: {credit_reason: cancellation_refund_credit}
      - event: addon:addon_rider_base_termination
        map: {}
  - type: landlord_nonpayment_suspension
    target: landlord_contracts
    mutation: {transition: {from: active, to: suspended_nonpayment}}
    meaning: Service is suspended for an installment past due beyond the grace period.
    grain: One row per transaction.
    fields:
      status: Becomes suspended_nonpayment.
      suspended_date: The suspension date.
    triggers: []
  - type: landlord_reinstatement
    target: landlord_contracts
    mutation: {transition: {from: suspended_nonpayment, to: active}}
    meaning: A suspended contract is reinstated after the past-due balance is paid in time.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      suspended_date: Cleared.
    triggers: []
  - type: landlord_nonpayment_cancellation
    target: landlord_contracts
    mutation: {transition: {from: suspended_nonpayment, to: cancelled}}
    meaning: A suspended contract is cancelled because the past-due balance was not cured in time.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: The cancellation date.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: landlord_expiration
    target: landlord_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The term_end_date.
    triggers:
      - event: addon:addon_rider_base_termination
        map: {}
  - type: landlord_late_renewal
    target: landlord_contracts
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired contract is renewed within the late-renewal grace period.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      term_start_date: The late renewal date.
      term_end_date: The last day of the new term counted from the late renewal date.
      term_number: Incremented by one.
      end_date: Cleared.
    triggers:
      - event: landlord:landlord_premium_charge
        map: {}
      - event: addon:addon_rider_renewal
        map: {}
  - type: landlord_premium_charge
    target: landlord_billing_entries
    meaning: A premium amount or transfer fee is billed to the contract holder.
    grain: One row per amount billed for one billing period and charge type.
    distinguish_by: [charge_type, billing_period_start, payment_reference]
    fields:
      entry_date: The billing date.
      amount: The amount billed, positive.
      charge_type: What is billed.
      billing_period_start: First day of the period covered (the transfer date for a transfer fee).
      billing_period_end: Last day of the period covered.
      portfolio_discount_rate: The portfolio discount applied to an installment or annual premium; 0.00 otherwise.
      payment_reference: For a returned payment or its fee, the payment returned; empty otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: landlord_premium_payment
    target: landlord_billing_entries
    meaning: The contract holder pays premium.
    grain: One row per payment posted.
    distinguish_by: [payment_reference]
    fields:
      entry_date: The posting date.
      amount: The amount paid, positive.
      payment_reference: The payment confirmation number.
      payment_method: How it was paid.
    account: premium_balance
    direction: out
    triggers: []
  - type: landlord_premium_credit
    target: landlord_billing_entries
    meaning: A premium credit is posted for a cancellation or a billing correction.
    grain: One row per credit for one source object.
    distinguish_by: [credit_reason, landlord_cancellation_request_id, billing_period_start]
    fields:
      entry_date: The posting date.
      amount: The credit, positive.
      credit_reason: Why.
      landlord_cancellation_request_id: For a cancellation credit, the request it settles.
      billing_period_start: For a correction, the period corrected.
    account: premium_balance
    direction: out
    triggers: []
  - type: landlord_premium_refund
    target: landlord_billing_entries
    meaning: A credit balance is refunded to the landlord.
    grain: One row per refund disbursed.
    distinguish_by: [refund_reference]
    fields:
      entry_date: The disbursement date.
      amount: The refund, positive.
      refund_reference: The refund confirmation number.
      landlord_cancellation_request_id: The cancellation request settled.
      payment_method: How it is refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: landlord_service_fee_charge
    target: landlord_billing_entries
    meaning: A service call fee or surcharge is billed to the landlord for a service request.
    grain: One row per fee type on one service request.
    distinguish_by: [landlord_service_request_id, fee_type]
    fields:
      entry_date: The billing date.
      amount: The fee, positive.
      landlord_service_request_id: The service request.
      fee_type: Standard visit, second opinion or after-hours surcharge.
    account: service_fee_balance
    direction: in
    triggers: []
  - type: landlord_service_fee_refund
    target: landlord_billing_entries
    meaning: A service call fee is refunded.
    grain: One row per fee type refunded on one service request.
    distinguish_by: [landlord_service_request_id, fee_type]
    fields:
      entry_date: The refund date.
      amount: The refund, positive.
      landlord_service_request_id: The service request.
      fee_type: The fee refunded.
      fee_refund_reason: Why.
    account: service_fee_balance
    direction: out
    triggers: []
  - type: landlord_service_request
    target: landlord_service_requests
    meaning: The landlord or the authorized tenant reports a failure in one unit.
    grain: One row per item failure in one unit.
    distinguish_by: [landlord_service_request_id]
    fields:
      landlord_service_request_id: The service request number.
      request_date: The date placed.
      unit_label: The unit, verbatim as the caller names it (for example "Unit B"); "Main" on a single-unit property.
      requested_by: landlord or authorized_tenant.
      covered_item: The item that failed.
      trade: The trade.
      request_type: new_failure, recall or second_opinion.
      urgency: Emergency or routine.
      service_window: business_hours or after_hours.
      failure_description: The caller's description, verbatim.
    triggers:
      - event: landlord:landlord_service_fee_charge
        when: {request_type: new_failure}
        map: {landlord_service_request_id: landlord_service_request_id, fee_type: standard_visit}
      - event: landlord:landlord_service_fee_charge
        when: {request_type: second_opinion}
        map: {landlord_service_request_id: landlord_service_request_id, fee_type: second_opinion}
      - event: landlord:landlord_service_fee_charge
        when: {urgency: routine, service_window: after_hours}
        map: {landlord_service_request_id: landlord_service_request_id, fee_type: after_hours_surcharge}
  - type: landlord_contractor_dispatch
    target: landlord_claim_events
    meaning: A network contractor is assigned to a service request.
    grain: One row per assignment on one service request.
    distinguish_by: [landlord_service_request_id, dispatch_sequence]
    fields:
      landlord_service_request_id: The service request.
      event_date: The assignment date.
      service_contractor_id: The contractor.
      dispatch_sequence: 1 for the first assignment, incremented per further assignment.
      dispatch_reason: Initial, re-dispatch, second opinion or recall.
    triggers: []
  - type: landlord_coverage_determination
    target: landlord_claim_events
    meaning: Bridgewell decides whether the failure is covered.
    grain: One row per determination stage on one service request.
    distinguish_by: [landlord_service_request_id, determination_stage]
    fields:
      landlord_service_request_id: The service request.
      event_date: The determination date.
      covered_item: The item.
      unit_label: The unit.
      determination_stage: initial or review.
      determination_outcome: Covered or not covered.
      denial_reason: The controlled reason when not covered.
    triggers: []
  - type: landlord_benefit_authorization
    target: landlord_claim_events
    meaning: Bridgewell authorizes a repair, replacement, cash-in-lieu settlement or supplemental allowance on a covered request.
    grain: One row per authorization number.
    distinguish_by: [authorization_number]
    fields:
      landlord_service_request_id: The service request.
      event_date: The authorization date.
      covered_item: The item.
      unit_label: The unit.
      authorization_number: The authorization number.
      resolution_type: repair, replacement, cash_in_lieu or allowance.
      allowance_type: For an allowance, which one.
      invoice_amount: For an allowance, the documented cost.
      repair_estimate: The repair estimate.
      replacement_cost: The contracted replacement cost.
      amount: The amount Bridgewell pays.
    account: benefit_consumed
    direction: in
    triggers: []
  - type: landlord_authorization_reversal
    target: landlord_claim_events
    meaning: An authorization is reversed because the work will not be performed.
    grain: One row per authorization reversed.
    distinguish_by: [reversed_authorization_number]
    fields:
      landlord_service_request_id: The service request.
      event_date: The reversal date.
      reversed_authorization_number: The authorization reversed.
      reversal_reason: Why.
      amount: The amount reversed, positive.
    account: benefit_consumed
    direction: out
    triggers: []

measures:
  - id: landlord_msr_portfolio_property_count
    window: Snapshot on the term_start_date of the term being priced (for a new enrollment, its start_date).
    measure: Count of the landlord's landlord_contracts, this one included, whose status on that date is waiting_period, active or suspended_nonpayment.
  - id: landlord_msr_term_premium_paid
    window: The current term as of the cancellation notice_date (term_start_date through notice_date).
    measure: Sum of landlord_premium_payment amounts in the window, minus landlord_premium_charge amounts with charge_type returned_payment in the window.
  - id: landlord_msr_unexpired_term_days
    window: The current term as of the cancellation notice_date.
    measure: Count of calendar days from the day after notice_date through term_end_date inclusive.
  - id: landlord_msr_term_days
    window: The current term.
    measure: Count of calendar days from term_start_date through term_end_date inclusive.
  - id: landlord_msr_days_since_start
    window: From start_date to the cancellation notice_date.
    measure: Count of calendar days from the day after start_date through notice_date inclusive.
  - id: landlord_msr_term_benefit_paid
    window: The term in which the service request's request_date falls.
    measure: Sum of landlord_benefit_authorization amounts on the contract for requests in the window, minus landlord_authorization_reversal amounts for those authorizations.
  - id: landlord_msr_unit_item_benefit_paid_term
    window: The term in which the service request's request_date falls.
    measure: The same sum as landlord_msr_term_benefit_paid restricted to the same unit_label and covered_item, excluding allowance rows.
  - id: landlord_msr_days_since_sale_closing
    window: From the property_sale_closing_date on a cancellation request with cancel_reason sold_property to that request's notice_date.
    measure: Count of calendar days from the day after property_sale_closing_date through notice_date inclusive; undefined (never qualifying) when the request does not give cancel_reason sold_property.
  - id: landlord_msr_oldest_unpaid_due_date
    window: All premium charges on the contract up to frozen time.
    measure: The billing_period_start of the oldest monthly_installment or annual_premium charge not fully covered by payments and credits applied oldest charge first.

policies:
  - id: landlord_agg_multi_holding
    subject: [landlord_enrollment]
    rule: >-
      A landlord may hold any number of rental property service contracts, one per rental property. How many
      contracts one property may carry is governed by landlord_agg_one_contract_per_property, and how the landlord's
      contracts combine for pricing is governed by landlord_agg_portfolio_discount.
    eligibility: []
    params:
      max_per_customer: null

  - id: landlord_agg_one_contract_per_property
    subject: [landlord_enrollment, landlord_ownership_transfer]
    rule: >-
      A rental property carries only one service contract at a time.
      A new rental property service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      Rental coverage and homeowner coverage are mutually exclusive for the same property:
      a new rental property service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment.
      An owner who moves out and starts renting the home cancels the homeowner service contract and enrolls a rental
      property service contract; an owner who moves into a former rental does the reverse. A purchaser who will
      occupy the property cannot take a transfer and buys a homeowner service contract instead.
    eligibility:
      - id: no_open_rental_contract_on_property
        applies_to: [landlord_enrollment]
        kind: dedup
        condition: "A new rental property service contract is not enrolled when a rental property service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [landlord_contracts.property_address, landlord_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.property_address]
          action_bindings:
            landlord_contracts.property_address: property_address
        dedup_contract:
          table: landlord_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []
      - id: no_open_homeowner_contract_on_property
        applies_to: [landlord_enrollment]
        kind: dedup
        condition: "a new rental property service contract is not enrolled when a homeowner service contract for the same property address is in status waiting_period, active or suspended_nonpayment."
        evidence_fields: [homeplan_contracts.property_address, homeplan_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeplan_contracts.property_address]
          action_bindings:
            homeplan_contracts.property_address: property_address
        dedup_contract:
          table: homeplan_contracts
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [waiting_period, active, suspended_nonpayment]}
          distinct_fields: []

  - id: landlord_agg_portfolio_discount
    subject: [landlord_premium_charge, landlord_enrollment, landlord_renewal, landlord_late_renewal]
    rule: >-
      A landlord's contracts combine for a portfolio discount on premium. The number of contracts counted is
      landlord_msr_portfolio_property_count, a snapshot taken on the first day of the term being priced, counting only
      contracts held under the same customer profile (contracts of a spouse, partner or separate company profile are
      never combined). When the count is at or above portfolio_high_min_properties the discount is
      portfolio_high_discount_rate; otherwise, when it is at or above portfolio_mid_min_properties, it is
      portfolio_mid_discount_rate; otherwise it is 0.00. The bands do not stack: exactly one rate applies. The rate is
      fixed for the whole term: enrolling, cancelling, expiring or transferring other properties during the term never
      changes the installments already set, and the rate is taken again at each renewal and late renewal. The rate
      applies to monthly_installment, annual_premium and upgrade_proration charges and never to returned_payment,
      returned_payment_fee or transfer_fee charges. A transferred contract keeps its rate until the purchaser's first
      renewal, when the purchaser's own portfolio is counted.
    eligibility: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Systems: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Combo: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Combo Plus: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Multi-Unit Combo: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
        Bridgewell Rental Multi-Unit Combo Plus: {portfolio_mid_min_properties: "=portfolio_mid_min_properties", portfolio_mid_discount_rate: "=portfolio_mid_discount_rate", portfolio_high_min_properties: "=portfolio_high_min_properties", portfolio_high_discount_rate: "=portfolio_high_discount_rate", monthly_premium: "=monthly_premium"}
    formula:
      portfolio_discount_rate: "portfolio_high_discount_rate if landlord_msr_portfolio_property_count >= portfolio_high_min_properties else (portfolio_mid_discount_rate if landlord_msr_portfolio_property_count >= portfolio_mid_min_properties else 0)"
    measures: [landlord_msr_portfolio_property_count]

  - id: landlord_enrollment_terms
    subject: [landlord_enrollment, landlord_coverage_activation]
    rule: >-
      A rental property service contract covers a residential property the landlord rents out or holds for rent.
      The property type, unit count and year built are taken from the landlord's statement and must satisfy the entry gate of the tier purchased.
      Single-unit tiers cover one dwelling unit; multi-unit tiers cover every unit of a two- to four-unit building
      under one contract. Each term lasts contract_term_months calendar months, ending on the day before the same
      calendar day contract_term_months later, or on the last day of the month when that day does not exist.
      coverage_effective_date is start_date plus waiting_period_days calendar days.
      The contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero.
      The landlord may name one authorized tenant contact on the contract.
    eligibility:
      - id: rental_property_within_entry_gate
        applies_to: [landlord_enrollment]
        kind: caller_fact
        condition: "The property type, unit count and year built are taken from the landlord's statement and must satisfy the entry gate of the tier purchased."
        evidence_fields: [landlord_contracts.property_address, landlord_contracts.property_type, landlord_contracts.unit_count, landlord_contracts.year_built]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.property_address]
          action_bindings:
            landlord_contracts.property_address: property_address
      - id: waiting_period_before_activation
        applies_to: [landlord_coverage_activation]
        kind: time
        condition: "The contract activates no earlier than waiting_period_days calendar days after the contract is purchased, counting the purchase date as day zero."
        evidence_fields: [landlord_contracts.start_date, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract is purchased
          anchor_source: landlord_contracts.start_date
          relation: not_before
          duration_source: variants.waiting_period_days
          unit: calendar_days
          counting_rule: counting the purchase date as day zero
          boundary: inclusive

  - id: landlord_premium_pricing
    subject: [landlord_premium_charge]
    rule: >-
      The base monthly amount is monthly_premium plus additional_unit_monthly_premium for each unit beyond the first.
      A monthly-billed contract is charged one monthly_installment per billing period, equal to the base monthly
      amount reduced by the term's portfolio_discount_rate under landlord_agg_portfolio_discount and rounded to the
      cent; billing periods start on the same calendar day of the month as term_start_date (the last day of the month
      when that day does not exist) and each installment is due on its period start. An annual-billed contract is
      charged one annual_premium per term on term_start_date, equal to twelve base monthly amounts reduced first by
      annual_pay_discount_rate and then by the portfolio discount rate, rounded to the cent once at the end; the two
      discounts multiply and are never added. Each premium charge records the portfolio_discount_rate applied. A
      returned payment is billed back as a returned_payment charge plus one returned_payment_fee charge of
      returned_payment_fee. A transfer is billed one transfer_fee charge of transfer_fee to the purchaser.
      Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment.
    eligibility:
      - id: premium_billed_on_open_contract
        applies_to: [landlord_premium_charge]
        kind: state
        condition: "Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [waiting_period, active, suspended_nonpayment]
    params:
      per_tier:
        Bridgewell Rental Appliance: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Systems: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Combo: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Combo Plus: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Multi-Unit Combo: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
        Bridgewell Rental Multi-Unit Combo Plus: {monthly_premium: "=monthly_premium", additional_unit_monthly_premium: "=additional_unit_monthly_premium", annual_pay_discount_rate: "=annual_pay_discount_rate"}
    formula:
      base_monthly: "monthly_premium + additional_unit_monthly_premium * (unit_count - 1)"
      monthly_installment: "round(base_monthly * (1 - portfolio_discount_rate), 2)"
      annual_premium: "round(base_monthly * 12 * (1 - annual_pay_discount_rate) * (1 - portfolio_discount_rate), 2)"

  - id: landlord_premium_collection_and_nonpayment
    subject: [landlord_premium_payment, landlord_nonpayment_suspension, landlord_reinstatement, landlord_nonpayment_cancellation]
    rule: >-
      Payments are applied to premium_balance, oldest unpaid charge first; the installment driving nonpayment
      handling is landlord_msr_oldest_unpaid_due_date. Each contract is billed and collected on its own, and a
      payment is applied only to the contract it names.
      Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends.
      No service request is accepted on a suspended contract.
      A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies.
      Reinstatement keeps the term dates and the term's portfolio discount, and failures first reported while
      suspended are not covered.
      A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date.
      A nonpayment cancellation carries no admin fee and no refund, and premium billed for periods before it remains
      owed.
    eligibility:
      - id: grace_passed_before_suspension
        applies_to: [landlord_nonpayment_suspension]
        kind: time
        condition: "Service is suspended only when an installment remains unpaid more than payment_grace_days calendar days after the installment's due date; the count starts the day after the due date, and suspension applies from the first day after the grace period ends."
        evidence_fields: [landlord_billing_entries.billing_period_start, landlord_billing_entries.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_billing_entries.landlord_contract_id]
          action_bindings:
            landlord_billing_entries.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment's due date
          anchor_source: landlord_billing_entries.billing_period_start
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after the due date, and suspension applies from the first day after the grace period ends
          boundary: exclusive
      - id: cure_within_window
        applies_to: [landlord_reinstatement]
        kind: time
        condition: "A suspended contract is reinstated only when premium_balance is zero or less after payment and the payment posts no later than suspension_cure_days calendar days after the contract was suspended; the count starts the day after suspended_date and the boundary day itself qualifies."
        evidence_fields: [landlord_contracts.suspended_date, landlord_contracts.premium_balance, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: landlord_contracts.suspended_date
          relation: not_after
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: the count starts the day after suspended_date and the boundary day itself qualifies
          boundary: inclusive
      - id: cure_lapsed_before_cancellation
        applies_to: [landlord_nonpayment_cancellation]
        kind: time
        condition: "A suspended contract whose balance is not cleared is cancelled for nonpayment once more than suspension_cure_days calendar days have passed after the contract was suspended, counted from the day after suspended_date."
        evidence_fields: [landlord_contracts.suspended_date, landlord_contracts.premium_balance, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was suspended
          anchor_source: landlord_contracts.suspended_date
          relation: not_before
          duration_source: variants.suspension_cure_days
          unit: calendar_days
          counting_rule: counted from the day after suspended_date
          boundary: exclusive
    params:
      per_tier:
        Bridgewell Rental Appliance: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Systems: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Combo: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Combo Plus: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Multi-Unit Combo: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
        Bridgewell Rental Multi-Unit Combo Plus: {payment_grace_days: "=payment_grace_days", suspension_cure_days: "=suspension_cure_days", returned_payment_fee: "=returned_payment_fee"}
    measures: [landlord_msr_oldest_unpaid_due_date]

  - id: landlord_renewal_terms
    subject: [landlord_renewal_notice, landlord_renewal_preference_change, landlord_renewal, landlord_expiration, landlord_late_renewal]
    rule: >-
      Bridgewell issues one renewal notice per term stating the renewal tier and the renewal installment, priced with
      the portfolio discount projected for the renewal date.
      A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies.
      When auto_renew is false or the notice was late, the contract expires at the end of term_end_date unless the
      landlord affirmatively renews before then. The landlord may turn auto_renew off or on at any time before
      term_end_date. A renewed term starts the day after the prior term_end_date with no new waiting period, at the
      tier parameters in force on that day and the portfolio discount counted on that day, which may differ from the
      notice when properties were added or dropped in between. A move to a lower tier takes effect only at renewal.
      An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies.
      A late renewal starts a new full term on the late renewal date, failures that began between the term end and
      the late renewal are not covered, and per-unit caps, the aggregate limit and the refrigerant allowance restart
      with each new term. After the late-renewal grace period, the property needs a new contract with a new waiting
      period.
    eligibility:
      - id: renewal_notice_in_time
        applies_to: [landlord_renewal]
        kind: time
        condition: "A contract with auto_renew true renews automatically on its term end only when the renewal notice for the expiring term was issued at least renewal_notice_days calendar days before term_end_date; counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies."
        evidence_fields: [landlord_contracts.renewal_notice_date, landlord_contracts.term_end_date, landlord_contracts.auto_renew, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal notice for the expiring term was issued
          anchor_source: landlord_contracts.renewal_notice_date
          relation: not_before
          duration_source: variants.renewal_notice_days
          unit: calendar_days
          counting_rule: counting runs backward from term_end_date, and a notice issued exactly renewal_notice_days days before term_end_date qualifies
          boundary: inclusive
      - id: late_renewal_in_grace
        applies_to: [landlord_late_renewal]
        kind: time
        condition: "An expired contract may be renewed within late_renewal_grace_days calendar days after its term end without a new waiting period; the count starts the day after term_end_date and the boundary day itself qualifies."
        evidence_fields: [landlord_contracts.term_end_date, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its term end
          anchor_source: landlord_contracts.term_end_date
          relation: not_after
          duration_source: variants.late_renewal_grace_days
          unit: calendar_days
          counting_rule: the count starts the day after term_end_date and the boundary day itself qualifies
          boundary: inclusive
    params:
      per_tier:
        Bridgewell Rental Appliance: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Systems: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Combo: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Combo Plus: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Multi-Unit Combo: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
        Bridgewell Rental Multi-Unit Combo Plus: {renewal_notice_days: "=renewal_notice_days", late_renewal_grace_days: "=late_renewal_grace_days", contract_term_months: "=contract_term_months"}
    measures: [landlord_msr_portfolio_property_count]

  - id: landlord_cancellation_and_refund
    subject: [landlord_cancellation, landlord_premium_credit, landlord_premium_refund]
    rule: >-
      A cancellation starts when the landlord gives notice: the agent records a cancellation request whose
      notice_date is the date the landlord gives notice, with the reason given and, for a sale, the
      property_sale_closing_date the landlord states, and the landlord then confirms it.
      A contract is cancelled only after the landlord has confirmed the cancellation request on file.
      The cancellation is effective on notice_date and never backdated. Within the first term, a notice given no later
      than free_look_days calendar days after start_date (landlord_msr_days_since_start) is credited all premium paid
      for the term less landlord_msr_term_benefit_paid, with no admin fee. Otherwise an annual-billed contract is
      credited landlord_msr_term_premium_paid times landlord_msr_unexpired_term_days divided by
      landlord_msr_term_days, rounded to the cent, less cancellation_admin_fee, less landlord_msr_term_benefit_paid,
      and a monthly-billed contract is credited nothing for installments already billed, carries no admin fee and is
      billed no further installments. The admin fee is waived when admin_fee_waived_on_sale is true and the request
      gives cancel_reason sold_property.
      The sale waiver applies only when notice is given no later than sale_cancellation_window_days calendar days after the property sale closes, counting from the day after property_sale_closing_date with the boundary day included.
      A credit is never negative and the difference is never billed. Service call fees are never returned through a
      cancellation, and cancelling one contract never changes the portfolio discount already set on the landlord's
      other contracts for their current terms.
      A cancellation credit is posted only after the landlord has confirmed the cancellation request on file.
      Only one cancellation credit and one refund are posted per cancellation request.
      Any credit balance is refunded within refund_processing_days calendar days after confirmation.
    eligibility:
      - id: cancellation_confirmed
        applies_to: [landlord_cancellation]
        kind: authorization
        condition: "A contract is cancelled only after the landlord has confirmed the cancellation request on file."
        evidence_fields: [landlord_cancellation_requests.request_status, landlord_cancellation_requests.landlord_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_cancellation_requests.landlord_cancellation_request_id]
          action_bindings:
            landlord_cancellation_requests.landlord_cancellation_request_id: landlord_cancellation_request_id
      - id: credit_after_confirmation
        applies_to: [landlord_premium_credit]
        kind: authorization
        condition: "A cancellation credit is posted only after the landlord has confirmed the cancellation request on file."
        evidence_fields: [landlord_cancellation_requests.request_status, landlord_cancellation_requests.landlord_cancellation_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_cancellation_requests.landlord_cancellation_request_id]
          action_bindings:
            landlord_cancellation_requests.landlord_cancellation_request_id: landlord_cancellation_request_id
      - id: sale_waiver_window
        applies_to: [landlord_premium_credit]
        kind: time
        condition: "The sale waiver applies only when notice is given no later than sale_cancellation_window_days calendar days after the property sale closes, counting from the day after property_sale_closing_date with the boundary day included."
        evidence_fields: [landlord_cancellation_requests.property_sale_closing_date, landlord_cancellation_requests.notice_date, landlord_cancellation_requests.landlord_cancellation_request_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [landlord_cancellation_requests.landlord_cancellation_request_id]
          action_bindings:
            landlord_cancellation_requests.landlord_cancellation_request_id: landlord_cancellation_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the property sale closes
          anchor_source: landlord_cancellation_requests.property_sale_closing_date
          relation: not_after
          duration_source: variants.sale_cancellation_window_days
          unit: calendar_days
          counting_rule: counting from the day after property_sale_closing_date with the boundary day included
          boundary: inclusive
      - id: one_credit_one_refund
        applies_to: [landlord_premium_credit, landlord_premium_refund]
        kind: dedup
        condition: "Only one cancellation credit and one refund are posted per cancellation request."
        evidence_fields: [landlord_billing_entries.landlord_cancellation_request_id, landlord_billing_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_billing_entries.landlord_cancellation_request_id]
          action_bindings:
            landlord_billing_entries.landlord_cancellation_request_id: landlord_cancellation_request_id
        dedup_contract:
          table: landlord_billing_entries
          mode: separate_record
          object_bindings: {landlord_cancellation_request_id: landlord_cancellation_request_id, event_type: event_type}
          duplicate_filters: {event_type: [landlord_premium_credit, landlord_premium_refund]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Systems: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Combo: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Combo Plus: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Multi-Unit Combo: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {free_look_days: "=free_look_days", cancellation_admin_fee: "=cancellation_admin_fee", admin_fee_waived_on_sale: "=admin_fee_waived_on_sale", sale_cancellation_window_days: "=sale_cancellation_window_days", refund_processing_days: "=refund_processing_days"}
    formula:
      within_free_look: "landlord_msr_days_since_start <= free_look_days and term_number == 1"
      sale_waiver_qualified: "landlord_msr_days_since_sale_closing <= sale_cancellation_window_days"
      admin_fee_applied: "0 if (admin_fee_waived_on_sale and sale_waiver_qualified) else cancellation_admin_fee"
      cancellation_credit: "max(0, landlord_msr_term_premium_paid - landlord_msr_term_benefit_paid) if within_free_look else (0 if billing_frequency == 'monthly' else max(0, round(landlord_msr_term_premium_paid * landlord_msr_unexpired_term_days / landlord_msr_term_days, 2) - admin_fee_applied - landlord_msr_term_benefit_paid))"
    measures: [landlord_msr_days_since_start, landlord_msr_term_premium_paid, landlord_msr_unexpired_term_days, landlord_msr_term_days, landlord_msr_term_benefit_paid, landlord_msr_days_since_sale_closing]

  - id: landlord_ownership_transfer_rules
    subject: [landlord_ownership_transfer, landlord_tenant_contact_update]
    rule: >-
      When a landlord sells a covered rental property to a purchaser who will keep renting it, the contract may be
      transferred instead of cancelled, provided the tier's transfer_allowed is true.
      A transfer is processed only while the contract status is waiting_period or active.
      A transfer is processed only when the contract's premium_balance is zero or less.
      The purchaser must have a landlord customer profile on file and consents to the transfer as their own decision;
      the purchaser becomes the contract holder on transfer_date, keeps the current term, tier, billing frequency and
      the term's portfolio discount, and is billed transfer_fee. The selling landlord receives no refund on a transfer.
      The authorized tenant contact is changed only on the instruction of the current contract holder, and is cleared
      at tenant turnover; a former tenant's requests are no longer accepted after the change.
    eligibility:
      - id: transfer_on_open_contract
        applies_to: [landlord_ownership_transfer]
        kind: state
        condition: "A transfer is processed only while the contract status is waiting_period or active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [waiting_period, active]
      - id: transfer_requires_clear_balance
        applies_to: [landlord_ownership_transfer]
        kind: authorization
        condition: "A transfer is processed only when the contract's premium_balance is zero or less."
        evidence_fields: [landlord_contracts.premium_balance, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
    params:
      per_tier:
        Bridgewell Rental Appliance: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Systems: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Combo: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Combo Plus: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Multi-Unit Combo: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}
        Bridgewell Rental Multi-Unit Combo Plus: {transfer_allowed: "=transfer_allowed", transfer_fee: "=transfer_fee"}

  - id: landlord_plan_upgrade_rules
    subject: [landlord_plan_upgrade]
    rule: >-
      A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active.
      An upgrade moves to a higher-ranked tier whose entry gate the property satisfies; downgrades happen only at
      renewal. The upgrade takes effect on the request date and keeps the term dates. A monthly-billed contract is
      billed the new tier's installment from the next billing period; an annual-billed contract is billed one
      upgrade_proration charge equal to the difference between the two tiers' annual premiums under
      landlord_premium_pricing (same portfolio discount) times landlord_msr_unexpired_term_days divided by
      landlord_msr_term_days, rounded to the cent, both day counts taken as of the upgrade date. Items and higher
      caps added by the upgrade are covered only for failures first reported at least upgrade_waiting_period_days
      calendar days after the upgrade, as stated in landlord_evt_coverage_determination.
    eligibility:
      - id: upgrade_on_open_contract
        applies_to: [landlord_plan_upgrade]
        kind: state
        condition: "A tier may be upgraded mid-term only when the current tier's midterm_upgrade_allowed is true and the contract status is waiting_period or active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.variant_name, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [waiting_period, active]
    params:
      per_tier:
        Bridgewell Rental Appliance: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Systems: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo Plus: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {midterm_upgrade_allowed: "=midterm_upgrade_allowed", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
    measures: [landlord_msr_unexpired_term_days, landlord_msr_term_days]

  - id: landlord_evt_service_request_and_fees
    subject: [landlord_service_request, landlord_service_fee_charge, landlord_service_fee_refund]
    rule: >-
      Service requests are accepted only while the contract status is active.
      A request names one unit and one failed item. The landlord may always place requests.
      An authorized tenant may place a request only when tenant_requests_allowed is true and the caller's name and phone match the tenant_contact_name and tenant_contact_phone on the contract.
      All fees are billed to the landlord, never to the tenant. A new_failure request is charged service_call_fee
      once. A recall for the same unit and item placed no later than repair_guarantee_days calendar days after the
      earlier repair was completed carries no fee; a later return visit is a new_failure. A second opinion may be
      requested only by the landlord after an initial determination and is charged service_call_fee times
      second_opinion_fee_rate, rounded to the cent, with nothing posted when that is zero. A routine request for an
      after-hours visit is also charged tenant_after_hours_surcharge; emergencies never are. A request is an
      emergency when the failure leaves a unit without heat in freezing weather, without running water, without
      electrical power, or with an active leak that cannot be stopped at a fixture shutoff.
      The fee of each fee type is charged at most once per service request.
      Fees are refunded in full only when the request is cancelled before any contractor is assigned, or when a fee
      was charged in error; a not-covered determination never refunds the fee.
    eligibility:
      - id: requests_on_active_contract
        applies_to: [landlord_service_request]
        kind: state
        condition: "Service requests are accepted only while the contract status is active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [active]
      - id: tenant_is_authorized_contact
        applies_to: [landlord_service_request]
        kind: caller_fact
        condition: "An authorized tenant may place a request only when tenant_requests_allowed is true and the caller's name and phone match the tenant_contact_name and tenant_contact_phone on the contract."
        evidence_fields: [landlord_contracts.tenant_contact_name, landlord_contracts.tenant_contact_phone, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
      - id: one_fee_per_type
        applies_to: [landlord_service_fee_charge]
        kind: dedup
        condition: "The fee of each fee type is charged at most once per service request."
        evidence_fields: [landlord_billing_entries.landlord_service_request_id, landlord_billing_entries.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_billing_entries.landlord_service_request_id, landlord_billing_entries.fee_type]
          action_bindings:
            landlord_billing_entries.landlord_service_request_id: landlord_service_request_id
            landlord_billing_entries.fee_type: fee_type
        dedup_contract:
          table: landlord_billing_entries
          mode: separate_record
          object_bindings: {landlord_service_request_id: landlord_service_request_id, fee_type: fee_type}
          duplicate_filters: {event_type: [landlord_service_fee_charge]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Systems: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Combo: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Combo Plus: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Multi-Unit Combo: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {service_call_fee: "=service_call_fee", second_opinion_fee_rate: "=second_opinion_fee_rate", tenant_after_hours_surcharge: "=tenant_after_hours_surcharge", tenant_requests_allowed: "=tenant_requests_allowed", repair_guarantee_days: "=repair_guarantee_days"}
    formula:
      standard_fee: "service_call_fee if request_type == 'new_failure' else 0"
      second_opinion_fee: "round(service_call_fee * second_opinion_fee_rate, 2) if request_type == 'second_opinion' else 0"
      after_hours_fee: "tenant_after_hours_surcharge if (urgency == 'routine' and service_window == 'after_hours') else 0"

  - id: landlord_evt_dispatch
    subject: [landlord_contractor_dispatch]
    rule: >-
      A contractor is dispatched only on a service request whose contract status is active.
      The request goes to a network contractor whose trade matches and whose service ZIP codes include the
      property_zip, preferred before standard, never suspended, and emergency-capable for an emergency; ties go to the
      contractor reference that sorts first alphabetically. The contractor arranges access with the requester (the
      authorized tenant when the tenant placed the request) within routine_contact_hours hours, or
      emergency_contact_hours hours for an emergency; a missed window leads to re-dispatch with dispatch_reason
      redispatch_missed_contact. A second opinion goes to a different eligible contractor, and a recall to the original
      contractor unless now suspended. Each assignment carries the next dispatch_sequence, starting at 1.
    eligibility:
      - id: dispatch_on_active_contract
        applies_to: [landlord_contractor_dispatch]
        kind: state
        condition: "A contractor is dispatched only on a service request whose contract status is active."
        evidence_fields: [landlord_contracts.status, landlord_contracts.landlord_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_contracts.landlord_contract_id]
          action_bindings:
            landlord_contracts.landlord_contract_id: landlord_contract_id
        state_contract:
          field: landlord_contracts.status
          allowed: [active]
    params:
      per_tier:
        Bridgewell Rental Appliance: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Systems: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Combo: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Combo Plus: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Multi-Unit Combo: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}
        Bridgewell Rental Multi-Unit Combo Plus: {routine_contact_hours: "=routine_contact_hours", emergency_contact_hours: "=emergency_contact_hours"}

  - id: landlord_evt_coverage_determination
    subject: [landlord_coverage_determination]
    rule: >-
      A failure is covered only when every condition below holds, and otherwise is not_covered with the first failing
      reason in this order. (1) contract_not_in_force: the contract was active on the request date. (2)
      waiting_period: the failure was first reported on or after coverage_effective_date and, for an item or higher cap
      added by a mid-term upgrade, at least upgrade_waiting_period_days calendar days after last_plan_change_date.
      (3) item_not_in_plan: the tier's cap for the item is above 0.00. (4) preexisting_condition: conditions existing
      before coverage_effective_date are covered only when unknown, undetectable and unknown_preexisting_covered is
      true. (5) tenant_damage: failures caused by a tenant's misuse, abuse or damage are covered only when
      tenant_damage_covered is true. (6) misuse_or_external_damage: other misuse and external causes (weather, pests,
      fire, flood, freezing in a unit left without heat) are never covered. (7) cap_exhausted: the remaining per-unit
      item benefit and the remaining aggregate benefit under landlord_evt_benefit_authorization are both above zero.
      An initial determination is issued once per service request.
      After a landlord-requested second opinion, one review determination replaces the initial outcome.
    eligibility:
      - id: one_initial_determination
        applies_to: [landlord_coverage_determination]
        kind: dedup
        condition: "An initial determination is issued once per service request."
        evidence_fields: [landlord_claim_events.landlord_service_request_id, landlord_claim_events.determination_stage]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_claim_events.landlord_service_request_id, landlord_claim_events.determination_stage]
          action_bindings:
            landlord_claim_events.landlord_service_request_id: landlord_service_request_id
            landlord_claim_events.determination_stage: determination_stage
        dedup_contract:
          table: landlord_claim_events
          mode: separate_record
          object_bindings: {landlord_service_request_id: landlord_service_request_id, determination_stage: determination_stage}
          duplicate_filters: {event_type: [landlord_coverage_determination]}
          distinct_fields: []
    params:
      per_tier:
        Bridgewell Rental Appliance: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Systems: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Combo Plus: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}
        Bridgewell Rental Multi-Unit Combo Plus: {unknown_preexisting_covered: "=unknown_preexisting_covered", tenant_damage_covered: "=tenant_damage_covered", upgrade_waiting_period_days: "=upgrade_waiting_period_days"}

  - id: landlord_evt_benefit_authorization
    subject: [landlord_benefit_authorization, landlord_authorization_reversal]
    rule: >-
      A benefit is authorized only after a covered determination is on file for the service request.
      Bridgewell replaces when repair_estimate is at or above repair_to_replace_threshold_rate times replacement_cost
      or the item cannot be repaired, and otherwise repairs. Caps apply per dwelling unit: each unit's item has its own
      cap (item_cap), counted by landlord_msr_unit_item_benefit_paid_term, and all payments on the contract share
      aggregate_term_limit, counted by landlord_msr_term_benefit_paid. The amount paid is the lowest of the work's
      cost, the remaining unit item benefit and the remaining aggregate benefit. Supplemental allowances pay the lower
      of invoice_amount and the allowance (code_violation_allowance, permit_fee_allowance, haul_away_allowance on a
      replacement, refrigerant_allowance per term on a cooling repair, and lead_safe_work_allowance when year_built is before
      lead_safe_built_before_year and the work disturbs painted surfaces), count toward the aggregate limit only, and are paid at most
      once per type per request. When a like unit cannot be sourced, or the landlord asks for cash in place of an
      authorized replacement, cash in lieu equal to the contracted replacement_cost within the same limits is offered;
      it is the landlord's decision, must be accepted no later than cash_in_lieu_offer_validity_days calendar days after
      the offer, is paid within cash_in_lieu_payment_days calendar days, and replaces the replacement authorization,
      which is reversed in full. A tenant cannot accept cash in lieu or approve paying a difference above a cap.
      Only one repair, replacement or cash-in-lieu authorization is open per service request.
      An authorization is reversed in full when the work will not be performed and never after completion.
    eligibility:
      - id: covered_before_benefit
        applies_to: [landlord_benefit_authorization]
        kind: authorization
        condition: "A benefit is authorized only after a covered determination is on file for the service request."
        evidence_fields: [landlord_claim_events.determination_outcome, landlord_claim_events.landlord_service_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_claim_events.landlord_service_request_id]
          action_bindings:
            landlord_claim_events.landlord_service_request_id: landlord_service_request_id
      - id: one_open_resolution
        applies_to: [landlord_benefit_authorization]
        kind: dedup
        condition: "Only one repair, replacement or cash-in-lieu authorization is open per service request."
        evidence_fields: [landlord_claim_events.landlord_service_request_id, landlord_claim_events.resolution_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [landlord_claim_events.landlord_service_request_id]
          action_bindings:
            landlord_claim_events.landlord_service_request_id: landlord_service_request_id
        dedup_contract:
          table: landlord_claim_events
          mode: separate_record
          object_bindings: {landlord_service_request_id: landlord_service_request_id}
          duplicate_filters: {resolution_type: [repair, replacement, cash_in_lieu]}
          distinct_fields: [authorization_number]
    params:
      lead_safe_built_before_year: 1978
      item_cap:
        heating_system: heating_system_cap
        cooling_system: cooling_system_cap
        ductwork: ductwork_cap
        plumbing: plumbing_cap
        water_heater: water_heater_cap
        electrical: electrical_cap
        kitchen_appliance: kitchen_appliance_cap
        laundry_appliance: laundry_appliance_cap
        garage_door_opener: garage_door_opener_cap
      per_tier:
        Bridgewell Rental Appliance: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Systems: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Combo: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Combo Plus: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Multi-Unit Combo: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
        Bridgewell Rental Multi-Unit Combo Plus: {aggregate_term_limit: "=aggregate_term_limit", heating_system_cap: "=heating_system_cap", kitchen_appliance_cap: "=kitchen_appliance_cap", code_violation_allowance: "=code_violation_allowance", permit_fee_allowance: "=permit_fee_allowance", haul_away_allowance: "=haul_away_allowance", refrigerant_allowance: "=refrigerant_allowance", lead_safe_work_allowance: "=lead_safe_work_allowance", cash_in_lieu_offer_validity_days: "=cash_in_lieu_offer_validity_days", cash_in_lieu_payment_days: "=cash_in_lieu_payment_days", repair_to_replace_threshold_rate: "=repair_to_replace_threshold_rate"}
    formula:
      amount: "max(0, min(repair_estimate if repair_estimate < repair_to_replace_threshold_rate * replacement_cost else replacement_cost, item_cap - landlord_msr_unit_item_benefit_paid_term, aggregate_term_limit - landlord_msr_term_benefit_paid))"
    measures: [landlord_msr_unit_item_benefit_paid_term, landlord_msr_term_benefit_paid]

extended_policies:
  - id: landlord_ext_upgrade_catchup_charge
    base_policy_refs: [landlord_agg_portfolio_discount, landlord_premium_pricing, landlord_plan_upgrade_rules]
    overwrite:
      - base_policy: landlord_premium_pricing
        superseded_clause: >-
          Premium is billed only while the contract status is waiting_period, active or suspended_nonpayment.
        replaced_by: >-
          For a catch-up charge for a tier upgrade made during a term that has since ended, this policy bills the charge on the contract whatever status the contract now shows, and only for such a catch-up charge; every other premium charge remains billed only while the contract is open under the base rule.
      - base_policy: landlord_plan_upgrade_rules
        superseded_clause: >-
          an annual-billed contract is billed one upgrade_proration charge equal to the difference between the two tiers' annual premiums under landlord_premium_pricing (same portfolio discount) times landlord_msr_unexpired_term_days divided by landlord_msr_term_days, rounded to the cent, both day counts taken as of the upgrade date.
        replaced_by: >-
          For a catch-up charge on an annual-billed contract this policy replaces the base upgrade proration with the catch-up method set out here, and only for a catch-up charge; every other upgrade remains under the base rule.
    trigger: state_due
    subject: [landlord_premium_charge]
    computes: catchup_amount
    target_tool: bill_upgrade_catchup_f812c6ed
    params:
      monthly_appliance: 42.99
      monthly_systems: 47.99
      monthly_combo: 64.99
      monthly_mu_combo: 69.99
      unit_mu_combo: 39.99
      months_per_year: 12
      half_term_share: 0.5
      delay_concession_long: 0.25
      delay_concession_mid: 0.10
      delay_days_long: 120
      delay_days_mid: 60
      home_concession_annual: 0.05
      home_concession_monthly: 0.03
      autopay_concession_clean: 0.03
      autopay_concession_returned: 0.01
      term_goodwill_three: 0.05
      term_goodwill_two: 0.02
    rule: >
      This policy fixes the catch-up charge for a tier upgrade of an annual-billed rental property service contract whose upgrade charge was never billed, and the catch-up charge is billed, on the day it is billed, as one upgrade charge for the period from the upgrade date to the end of the term in which the upgrade was made.
      For a catch-up charge for a tier upgrade made during a term that has since ended, this policy bills the charge on the contract whatever status the contract now shows, and only for such a catch-up charge; every other premium charge remains billed only while the contract is open under the base rule.
      For a catch-up charge on an annual-billed contract this policy replaces the base upgrade proration with the catch-up method set out here, and only for a catch-up charge; every other upgrade remains under the base rule.
      The standard catch-up charge is the annual tier difference times the covered share of the term, rounded to the cent once at the end.
      The annual tier difference is twelve times the difference between the base monthly amount of the tier held after the upgrade and the base monthly amount of the tier held before it, each base monthly amount being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the term's annual premium charge, the two reductions multiplying.
      The standard covered share of the term is the calendar days from the day after the upgrade date through the end of the term in which the upgrade was made, divided by that term's days counted from its first day through its last day inclusive.
      The covered share used for a catch-up charge follows where the term stands: when the contract shows an end date for the term in which the upgrade was made, the share is the whole calendar months from the upgrade date to that term's end date, counted down to whole months, divided by twelve; when that term is still running and the upgrade was made with fewer than half of the term's days remaining, the share is those whole calendar months plus one, divided by twelve; otherwise the share is the standard covered share of the term.
      The billing-delay concession on a catch-up charge is 0.25 when more than 120 days have passed between the upgrade date and the day the catch-up is billed, 0.10 when more than 60 but no more than 120 days have passed, and 0 otherwise.
      The homeowner-plan concession on a catch-up charge is 0.05 when the landlord also holds an active Bridgewell homeowner service contract billed annually, 0.03 when the landlord holds an active homeowner service contract billed monthly, and 0 otherwise.
      The autopay concession on a catch-up charge is 0.03 when the most recent premium payment posted on the contract was made by ACH and no returned payment was billed back on the contract in the twelve months before the catch-up is billed, 0.01 when the most recent premium payment was made by ACH but a returned payment was billed back in those twelve months, and 0 when the most recent premium payment was made another way.
      The term-count goodwill on a catch-up charge is 0.05 when the contract carries annual premium charges for three or more terms, 0.02 when it carries them for exactly two terms, and 0 when it carries one.
      The billing-delay, homeowner-plan, autopay and term-count reductions are subtracted from one, and the catch-up charge is the annual tier difference times the covered share times that adjustment, rounded to the cent once at the end.
    prerequisite: []
    cross_category:
      - category: homeplan
        as: branch
        reads: [status, billing_frequency]
        note: The homeowner-plan concession reads whether the landlord holds an active Bridgewell homeowner service contract and how it is billed.
    compute:
      - new_base: "P('monthly_premium') + P('additional_unit_monthly_premium') * (F('unit_count') - 1)"
      - prior_base: "K('monthly_appliance') if F('prior_variant_name') == 'Bridgewell Rental Appliance' else (K('monthly_systems') if F('prior_variant_name') == 'Bridgewell Rental Systems' else (K('monthly_combo') if F('prior_variant_name') == 'Bridgewell Rental Combo' else (K('monthly_mu_combo') + K('unit_mu_combo') * (F('unit_count') - 1) if F('prior_variant_name') == 'Bridgewell Rental Multi-Unit Combo' else new_base)))"
      - term_rate: "LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='entry_date', charge_type='annual_premium')"
      - annual_difference: "12 * (new_base - prior_base) * (1 - P('annual_pay_discount_rate')) * (1 - term_rate)"
      - term_days: "DAYS(F('term_start_date'), F('term_end_date')) + 1"
      - remaining_days: "DAYS(F('last_plan_change_date'), F('term_end_date'))"
      - remaining_months: "MONTHS(F('last_plan_change_date'), F('term_end_date'))"
      - covered_share: "remaining_months / K('months_per_year') if F('end_date') != '' else ((remaining_months + 1) / K('months_per_year') if remaining_days < K('half_term_share') * term_days else remaining_days / term_days)"
      - posting_delay_days: "DAYS(F('last_plan_change_date'), NOW)"
      - delay_concession: "K('delay_concession_long') if posting_delay_days > K('delay_days_long') else (K('delay_concession_mid') if posting_delay_days > K('delay_days_mid') else 0)"
      - home_status: "CFIELD('homeplan', 'status')"
      - home_billing: "CFIELD('homeplan', 'billing_frequency')"
      - home_concession: "K('home_concession_annual') if (home_status == 'active' and home_billing == 'annual') else (K('home_concession_monthly') if (home_status == 'active' and home_billing == 'monthly') else 0)"
      - last_payment_method: "LATEST('landlord_billing_entries', 'payment_method', date_field='entry_date', event_type='landlord_premium_payment')"
      - returns_12: "COUNT('landlord_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')"
      - autopay_concession: "K('autopay_concession_clean') if (last_payment_method == 'ach' and returns_12 == 0) else (K('autopay_concession_returned') if (last_payment_method == 'ach' and returns_12 >= 1) else 0)"
      - annual_charges: "COUNT('landlord_billing_entries', charge_type='annual_premium')"
      - term_goodwill: "K('term_goodwill_three') if annual_charges >= 3 else (K('term_goodwill_two') if annual_charges == 2 else 0)"
      - adjustment: "1 - delay_concession - home_concession - autopay_concession - term_goodwill"
      - result: "RND(annual_difference * covered_share * adjustment, 2)"
    compute_basis:
      new_base: "each base monthly amount being the tier's monthly premium plus its additional-unit premium for each unit beyond the first"
      prior_base: "the difference between the base monthly amount of the tier held after the upgrade and the base monthly amount of the tier held before it"
      term_rate: "reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the term's annual premium charge, the two reductions multiplying"
      annual_difference: "The annual tier difference is twelve times the difference between the base monthly amount of the tier held after the upgrade and the base monthly amount of the tier held before it, each base monthly amount being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the term's annual premium charge, the two reductions multiplying."
      term_days: "divided by that term's days counted from its first day through its last day inclusive"
      remaining_days: "The standard covered share of the term is the calendar days from the day after the upgrade date through the end of the term in which the upgrade was made, divided by that term's days counted from its first day through its last day inclusive."
      remaining_months: "the share is the whole calendar months from the upgrade date to that term's end date, counted down to whole months, divided by twelve"
      covered_share: "The covered share used for a catch-up charge follows where the term stands: when the contract shows an end date for the term in which the upgrade was made, the share is the whole calendar months from the upgrade date to that term's end date, counted down to whole months, divided by twelve; when that term is still running and the upgrade was made with fewer than half of the term's days remaining, the share is those whole calendar months plus one, divided by twelve; otherwise the share is the standard covered share of the term."
      posting_delay_days: "when more than 120 days have passed between the upgrade date and the day the catch-up is billed"
      delay_concession: "The billing-delay concession on a catch-up charge is 0.25 when more than 120 days have passed between the upgrade date and the day the catch-up is billed, 0.10 when more than 60 but no more than 120 days have passed, and 0 otherwise."
      home_status: "when the landlord also holds an active Bridgewell homeowner service contract billed annually"
      home_billing: "0.03 when the landlord holds an active homeowner service contract billed monthly"
      home_concession: "The homeowner-plan concession on a catch-up charge is 0.05 when the landlord also holds an active Bridgewell homeowner service contract billed annually, 0.03 when the landlord holds an active homeowner service contract billed monthly, and 0 otherwise."
      last_payment_method: "when the most recent premium payment posted on the contract was made by ACH"
      returns_12: "no returned payment was billed back on the contract in the twelve months before the catch-up is billed"
      autopay_concession: "The autopay concession on a catch-up charge is 0.03 when the most recent premium payment posted on the contract was made by ACH and no returned payment was billed back on the contract in the twelve months before the catch-up is billed, 0.01 when the most recent premium payment was made by ACH but a returned payment was billed back in those twelve months, and 0 when the most recent premium payment was made another way."
      annual_charges: "when the contract carries annual premium charges for three or more terms"
      term_goodwill: "The term-count goodwill on a catch-up charge is 0.05 when the contract carries annual premium charges for three or more terms, 0.02 when it carries them for exactly two terms, and 0 when it carries one."
      adjustment: "The billing-delay, homeowner-plan, autopay and term-count reductions are subtracted from one"
      result: "the catch-up charge is the annual tier difference times the covered share times that adjustment, rounded to the cent once at the end."
    factors:
      - id: covered_share_convention
        effect: method
        decides: covered_share
        bindings: [remaining_months, covered_share]
        ladder:
          - when: "the contract shows an end date for the term in which the upgrade was made"
            method: "whole calendar months from the upgrade date to that term's end, counted down, divided by twelve"
          - when: "that term is still running AND the upgrade was made with fewer than half of the term's days remaining"
            method: "those whole calendar months plus one, divided by twelve"
          - when: "otherwise"
            method: "calendar days after the upgrade through the term end, divided by the term's days"
        baseline:
          covered_share: "remaining_days / term_days"
        evidence: [date]
        cross_difficulty: null
      - id: billing_delay_concession
        effect: parameter
        decides: delay_concession
        bindings: [posting_delay_days, delay_concession]
        ladder:
          - when: "more than 120 days between the upgrade date and the catch-up billing"
            value: "K('delay_concession_long')"
          - when: "more than 60 but no more than 120 days"
            value: "K('delay_concession_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          delay_concession: "0"
        evidence: [date]
        cross_difficulty: null
      - id: homeowner_plan_concession
        effect: parameter
        decides: home_concession
        bindings: [home_status, home_billing, home_concession]
        ladder:
          - when: "the landlord holds an active Bridgewell homeowner service contract AND it is billed annually"
            value: "K('home_concession_annual')"
          - when: "the landlord holds an active homeowner service contract AND it is billed monthly"
            value: "K('home_concession_monthly')"
          - when: "otherwise"
            value: "0"
        baseline:
          home_concession: "0"
        evidence: [cross_category]
        cross_difficulty: homeplan
      - id: catchup_autopay_concession
        effect: parameter
        decides: autopay_concession
        bindings: [last_payment_method, returns_12, autopay_concession]
        ladder:
          - when: "the most recent premium payment was made by ACH AND no returned payment billed back in the last twelve months"
            value: "K('autopay_concession_clean')"
          - when: "the most recent premium payment was made by ACH AND a returned payment billed back in the last twelve months"
            value: "K('autopay_concession_returned')"
          - when: "otherwise (the most recent premium payment made another way)"
            value: "0"
        baseline:
          autopay_concession: "0"
        evidence: [history]
        cross_difficulty: null
      - id: term_count_goodwill
        effect: parameter
        decides: term_goodwill
        bindings: [annual_charges, term_goodwill]
        ladder:
          - when: "annual premium charges for three or more terms on the contract"
            value: "K('term_goodwill_three')"
          - when: "annual premium charges for exactly two terms"
            value: "K('term_goodwill_two')"
          - when: "otherwise (one term)"
            value: "0"
        baseline:
          term_goodwill: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        This policy fixes the catch-up charge for a tier upgrade of an annual-billed rental property service contract whose upgrade charge was never billed, and the catch-up charge is billed, on the day it is billed, as one upgrade charge for the period from the upgrade date to the end of the term in which the upgrade was made.
        The standard catch-up charge is the annual tier difference times the covered share of the term, rounded to the cent once at the end.
        The annual tier difference is twelve times the difference between the base monthly amount of the tier held after the upgrade and the base monthly amount of the tier held before it, each base monthly amount being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the term's annual premium charge, the two reductions multiplying.
        The standard covered share of the term is the calendar days from the day after the upgrade date through the end of the term in which the upgrade was made, divided by that term's days counted from its first day through its last day inclusive.
      params: [monthly_premium, additional_unit_monthly_premium, annual_pay_discount_rate, monthly_appliance, monthly_systems, monthly_combo, monthly_mu_combo, unit_mu_combo]
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: latest, field: portfolio_discount_rate, filters: {charge_type: annual_premium}}
        - {table: landlord_billing_entries, aggregate: latest, field: payment_method, filters: {event_type: landlord_premium_payment}}
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, within_months: 12, filters: {charge_type: returned_payment}}
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, filters: {charge_type: annual_premium}}
      cross_category: [homeplan]

  - id: landlord_ext_late_renewal_premium
    base_policy_refs: [landlord_agg_portfolio_discount, landlord_renewal_terms, landlord_premium_pricing]
    overwrite:
      - base_policy: landlord_agg_portfolio_discount
        superseded_clause: >-
          The rate is fixed for the whole term: enrolling, cancelling, expiring or transferring other properties during the term never changes the installments already set, and the rate is taken again at each renewal and late renewal.
        replaced_by: >-
          For a late renewal this policy carries the portfolio discount rate recorded on the expired term's annual premium charge into the new term instead of counting the portfolio again, and only for such a late renewal; every other renewal remains under the base rule.
      - base_policy: landlord_premium_pricing
        superseded_clause: >-
          An annual-billed contract is charged one annual_premium per term on term_start_date, equal to twelve base monthly amounts reduced first by annual_pay_discount_rate and then by the portfolio discount rate, rounded to the cent once at the end; the two discounts multiply and are never added.
        replaced_by: >-
          For the premium of a late renewal the pay-in-full rate, the loadings, the credits and the lapse-day credit below apply in place of the standard annual premium terms, and only for such a premium; every other premium charge remains under the base pricing rule.
    trigger: on_request
    subject: [landlord_late_renewal]
    computes: renewal_premium
    target_tool: record_late_renewal_5b858282
    params:
      pif_rate_two_returns: 0.05
      pif_rate_one_return: 0.08
      claims_loading_heavy: 0.12
      claims_loading_moderate: 0.06
      claims_half_share: 0.5
      request_loading_four: 0.05
      request_loading_two: 0.02
      request_count_four: 4
      request_count_two: 2
      tenure_credit_three_years: 0.04
      tenure_credit_two_years: 0.02
      tenure_days_three_years: 1095
      tenure_days_two_years: 730
      line_bundle_credit_full: 0.05
      line_bundle_credit_part: 0.03
      line_bundle_payments_full: 12
      line_bundle_payments_part: 6
      year_days: 365
      year_weeks: 52
      week_days: 7
    rule: >
      This policy prices the new term of a rental property service contract that is renewed late, within its late-renewal grace period, and the new-term premium is billed as one annual premium on the late renewal date.
      The standard late-renewal premium is twelve times the contract's base monthly amount, which is the tier's monthly premium plus the tier's additional-unit premium for each unit beyond the first, reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the expired term's annual premium charge, the two reductions multiplying, and rounded to the cent once at the end.
      For a late renewal this policy carries the portfolio discount rate recorded on the expired term's annual premium charge into the new term instead of counting the portfolio again, and only for such a late renewal; every other renewal remains under the base rule.
      For the premium of a late renewal the pay-in-full rate, the loadings, the credits and the lapse-day credit below apply in place of the standard annual premium terms, and only for such a premium; every other premium charge remains under the base pricing rule.
      The late-renewal premium is fixed only after every tier upgrade made during the expired term carries its upgrade charge on the contract.
      The pay-in-full discount rate of a late-renewal premium follows the returned payments billed back on the contract in the thirty-six months before the late renewal: with two or more returned payments it is 0.05, with exactly one returned payment it is 0.08, and with none it is the tier's standard pay-in-full discount rate.
      The claims-experience loading of a late-renewal premium compares the benefit authorized on the contract in the twelve months before the late renewal, net of the authorizations reversed in those months, with the expired term's premium, which is the expired term's annual premium charge plus every upgrade charge billed on the contract in those twelve months: when that benefit is at least the expired term's premium and the contract carries at least two benefit authorizations in those months the loading is 0.12; when that benefit is at least half of the expired term's premium but below it and the contract carries at least one benefit authorization in those months the loading is 0.06; otherwise the claims-experience loading is 0.
      The request-frequency loading of a late-renewal premium is 0.05 when four or more service requests were placed on the contract in the twelve months before the late renewal, 0.02 when two or three were placed, and 0 when fewer than two were placed.
      The tenure credit of a late-renewal premium is 0.04 when the contract's original purchase date is 1,095 days or more before the late renewal date, 0.02 when it is 730 to 1,094 days before it, and 0 when it is fewer than 730 days before it.
      The line-plan bundle credit of a late-renewal premium is 0.05 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the late renewal, 0.03 when the landlord holds an active line plan and six to eleven such payments were posted, and 0 otherwise.
      The claims-experience loading and the request-frequency loading are added, the tenure credit and the line-plan bundle credit are subtracted, and that single adjustment rate is applied once to the standard late-renewal premium, before rounding, by multiplying it by one plus the adjustment rate.
      The lapse days of a late renewal are the calendar days after the expired term's end date and before the late renewal date.
      The lapse-day credit of a late-renewal premium follows why the contract lapsed: when the renewal notice for the expired term was issued fewer than the tier's renewal-notice days before the term end and automatic renewal was on, the adjusted premium is multiplied by 365 less the lapse days and divided by 365; when the notice was issued that late and automatic renewal was off, the adjusted premium is multiplied by 52 less the whole weeks of lapse and divided by 52; otherwise no lapse credit is given and the adjusted premium stands.
      The late-renewal premium after the lapse-day credit is rounded to the cent once at the end.
    prerequisite:
      - problem: landlord_ext_upgrade_catchup_charge
        kind: value_input
        gate: expired_term_premium
        form: state
        policy_source: >-
          The late-renewal premium is fixed only after every tier upgrade made during the expired term carries its upgrade charge on the contract.
        condition: >-
          The contract's billing entries carry an upgrade proration charge for every tier upgrade recorded during the expired term, so the expired term's premium includes those charges.
        resolved_by: bill_upgrade_catchup_f812c6ed
        effect: >-
          Once every upgrade of the expired term carries its charge, the expired term's premium used by the claims-experience loading includes those charges, which can move the loading to a lighter tier.
    cross_category:
      - category: lineplan
        as: history
        reads: [status, lineplan_billing_entries.event_type, lineplan_billing_entries.entry_date]
        note: The line-plan bundle credit reads whether the landlord holds an active utility line plan and counts the premium payments posted on the landlord's line plans in the last twelve months.
    compute:
      - base_monthly: "P('monthly_premium') + P('additional_unit_monthly_premium') * (F('unit_count') - 1)"
      - carried_rate: "LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='entry_date', charge_type='annual_premium')"
      - returned_count_36: "COUNT('landlord_billing_entries', within_months=36, date_field='entry_date', charge_type='returned_payment')"
      - pif_rate: "K('pif_rate_two_returns') if returned_count_36 >= 2 else (K('pif_rate_one_return') if returned_count_36 == 1 else P('annual_pay_discount_rate'))"
      - expired_annual: "LATEST('landlord_billing_entries', 'amount', date_field='entry_date', charge_type='annual_premium')"
      - upgrade_charges_12: "SUM('landlord_billing_entries', 'amount', within_months=12, date_field='entry_date', charge_type='upgrade_proration')"
      - expired_term_premium: "expired_annual + upgrade_charges_12"
      - benefit_12: "SUM('landlord_claim_events', 'amount', within_months=12, date_field='event_date', event_type='landlord_benefit_authorization') - SUM('landlord_claim_events', 'amount', within_months=12, date_field='event_date', event_type='landlord_authorization_reversal')"
      - authorizations_12: "COUNT('landlord_claim_events', within_months=12, date_field='event_date', event_type='landlord_benefit_authorization')"
      - claims_loading: "K('claims_loading_heavy') if (benefit_12 >= expired_term_premium and authorizations_12 >= 2) else (K('claims_loading_moderate') if (benefit_12 >= K('claims_half_share') * expired_term_premium and benefit_12 < expired_term_premium and authorizations_12 >= 1) else 0)"
      - requests_12: "COUNT('landlord_service_requests', within_months=12, date_field='request_date')"
      - request_loading: "K('request_loading_four') if requests_12 >= K('request_count_four') else (K('request_loading_two') if requests_12 >= K('request_count_two') else 0)"
      - tenure_days: "DAYS(F('start_date'), NOW)"
      - tenure_credit: "K('tenure_credit_three_years') if tenure_days >= K('tenure_days_three_years') else (K('tenure_credit_two_years') if tenure_days >= K('tenure_days_two_years') else 0)"
      - line_status: "CFIELD('lineplan', 'status', status='active')"
      - line_payments_12: "XCOUNT('lineplan', 'lineplan_billing_entries', within_months=12, date_field='entry_date', event_type='lineplan_premium_payment')"
      - line_bundle_credit: "K('line_bundle_credit_full') if (line_status == 'active' and line_payments_12 >= K('line_bundle_payments_full')) else (K('line_bundle_credit_part') if (line_status == 'active' and line_payments_12 >= K('line_bundle_payments_part') and line_payments_12 < K('line_bundle_payments_full')) else 0)"
      - notice_lead_days: "DAYS(F('renewal_notice_date'), F('term_end_date'))"
      - lapse_days: "DAYS(F('term_end_date'), NOW) - 1"
      - lapse_factor: "(K('year_days') - lapse_days) / K('year_days') if (notice_lead_days < P('renewal_notice_days') and F('auto_renew') == True) else ((K('year_weeks') - int(lapse_days / K('week_days'))) / K('year_weeks') if (notice_lead_days < P('renewal_notice_days') and F('auto_renew') == False) else 1)"
      - standard_premium: "12 * base_monthly * (1 - pif_rate) * (1 - carried_rate)"
      - adjustment_rate: "claims_loading + request_loading - tenure_credit - line_bundle_credit"
      - result: "RND(standard_premium * (1 + adjustment_rate) * lapse_factor, 2)"
    compute_basis:
      base_monthly: "The standard late-renewal premium is twelve times the contract's base monthly amount, which is the tier's monthly premium plus the tier's additional-unit premium for each unit beyond the first, reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the expired term's annual premium charge, the two reductions multiplying, and rounded to the cent once at the end."
      carried_rate: "For a late renewal this policy carries the portfolio discount rate recorded on the expired term's annual premium charge into the new term instead of counting the portfolio again, and only for such a late renewal; every other renewal remains under the base rule."
      returned_count_36: "the returned payments billed back on the contract in the thirty-six months before the late renewal"
      pif_rate: "The pay-in-full discount rate of a late-renewal premium follows the returned payments billed back on the contract in the thirty-six months before the late renewal: with two or more returned payments it is 0.05, with exactly one returned payment it is 0.08, and with none it is the tier's standard pay-in-full discount rate."
      expired_annual: "the expired term's premium, which is the expired term's annual premium charge plus every upgrade charge billed on the contract in those twelve months"
      upgrade_charges_12: "plus every upgrade charge billed on the contract in those twelve months"
      benefit_12: "the benefit authorized on the contract in the twelve months before the late renewal, net of the authorizations reversed in those months"
      authorizations_12: "the contract carries at least two benefit authorizations in those months"
      claims_loading: "when that benefit is at least the expired term's premium and the contract carries at least two benefit authorizations in those months the loading is 0.12; when that benefit is at least half of the expired term's premium but below it and the contract carries at least one benefit authorization in those months the loading is 0.06; otherwise the claims-experience loading is 0."
      requests_12: "when four or more service requests were placed on the contract in the twelve months before the late renewal"
      request_loading: "The request-frequency loading of a late-renewal premium is 0.05 when four or more service requests were placed on the contract in the twelve months before the late renewal, 0.02 when two or three were placed, and 0 when fewer than two were placed."
      tenure_days: "when the contract's original purchase date is 1,095 days or more before the late renewal date"
      tenure_credit: "The tenure credit of a late-renewal premium is 0.04 when the contract's original purchase date is 1,095 days or more before the late renewal date, 0.02 when it is 730 to 1,094 days before it, and 0 when it is fewer than 730 days before it."
      line_status: "when the landlord holds an active Bridgewell utility line protection plan"
      line_payments_12: "at least twelve premium payments were posted on the landlord's line plans in the twelve months before the late renewal"
      line_bundle_credit: "The line-plan bundle credit of a late-renewal premium is 0.05 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the late renewal, 0.03 when the landlord holds an active line plan and six to eleven such payments were posted, and 0 otherwise."
      notice_lead_days: "when the renewal notice for the expired term was issued fewer than the tier's renewal-notice days before the term end and automatic renewal was on"
      lapse_days: "The lapse days of a late renewal are the calendar days after the expired term's end date and before the late renewal date."
      lapse_factor: "The lapse-day credit of a late-renewal premium follows why the contract lapsed: when the renewal notice for the expired term was issued fewer than the tier's renewal-notice days before the term end and automatic renewal was on, the adjusted premium is multiplied by 365 less the lapse days and divided by 365; when the notice was issued that late and automatic renewal was off, the adjusted premium is multiplied by 52 less the whole weeks of lapse and divided by 52; otherwise no lapse credit is given and the adjusted premium stands."
      standard_premium: "reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the expired term's annual premium charge, the two reductions multiplying"
      adjustment_rate: "The claims-experience loading and the request-frequency loading are added, the tenure credit and the line-plan bundle credit are subtracted, and that single adjustment rate is applied once to the standard late-renewal premium, before rounding, by multiplying it by one plus the adjustment rate."
      result: "The late-renewal premium after the lapse-day credit is rounded to the cent once at the end."
    factors:
      - id: returned_history_pif_rate
        effect: parameter
        decides: pif_rate
        bindings: [returned_count_36, pif_rate]
        ladder:
          - when: "two or more returned payments billed back on the contract in the thirty-six months before the late renewal"
            value: "K('pif_rate_two_returns')"
          - when: "exactly one returned payment billed back in those thirty-six months"
            value: "K('pif_rate_one_return')"
          - when: "otherwise (no returned payment in those months)"
            value: "P('annual_pay_discount_rate')"
        baseline:
          pif_rate: "P('annual_pay_discount_rate')"
        evidence: [history]
        cross_difficulty: null
      - id: claims_experience_loading
        effect: parameter
        decides: claims_loading
        bindings: [expired_annual, upgrade_charges_12, expired_term_premium, benefit_12, authorizations_12, claims_loading]
        ladder:
          - when: "benefit authorized in the last twelve months (net of reversals) is at least the expired term's premium AND the contract carries at least two benefit authorizations in those months"
            value: "K('claims_loading_heavy')"
          - when: "that benefit is at least half of the expired term's premium but below it AND the contract carries at least one benefit authorization in those months"
            value: "K('claims_loading_moderate')"
          - when: "otherwise"
            value: "0"
        baseline:
          claims_loading: "0"
        evidence: [history]
        cross_difficulty: null
      - id: request_frequency_loading
        effect: parameter
        decides: request_loading
        bindings: [requests_12, request_loading]
        ladder:
          - when: "four or more service requests placed on the contract in the twelve months before the late renewal"
            value: "K('request_loading_four')"
          - when: "two or three service requests in those months"
            value: "K('request_loading_two')"
          - when: "otherwise (fewer than two)"
            value: "0"
        baseline:
          request_loading: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_credit
        effect: parameter
        decides: tenure_credit
        bindings: [tenure_days, tenure_credit]
        ladder:
          - when: "the original purchase date is 1,095 days or more before the late renewal date"
            value: "K('tenure_credit_three_years')"
          - when: "it is 730 to 1,094 days before the late renewal date"
            value: "K('tenure_credit_two_years')"
          - when: "otherwise (fewer than 730 days)"
            value: "0"
        baseline:
          tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: line_plan_bundle_credit
        effect: parameter
        decides: line_bundle_credit
        bindings: [line_status, line_payments_12, line_bundle_credit]
        ladder:
          - when: "the landlord holds an active Bridgewell utility line plan AND at least twelve premium payments were posted on the landlord's line plans in the last twelve months"
            value: "K('line_bundle_credit_full')"
          - when: "an active line plan AND six to eleven such payments"
            value: "K('line_bundle_credit_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          line_bundle_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: lineplan
      - id: lapse_day_credit
        effect: method
        decides: lapse_factor
        bindings: [notice_lead_days, lapse_days, lapse_factor]
        ladder:
          - when: "the renewal notice for the expired term was issued fewer than the renewal-notice days before the term end AND automatic renewal was on"
            method: "actual-day convention: the adjusted premium times (365 less the lapse days) over 365"
          - when: "the renewal notice was issued that late AND automatic renewal was off"
            method: "whole-week convention: the adjusted premium times (52 less the whole weeks of lapse) over 52"
          - when: "otherwise"
            method: "no lapse credit; the adjusted premium stands for the full year"
        baseline:
          lapse_factor: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        This policy prices the new term of a rental property service contract that is renewed late, within its late-renewal grace period, and the new-term premium is billed as one annual premium on the late renewal date.
        The standard late-renewal premium is twelve times the contract's base monthly amount, which is the tier's monthly premium plus the tier's additional-unit premium for each unit beyond the first, reduced first by the tier's pay-in-full discount rate and then by the portfolio discount rate recorded on the expired term's annual premium charge, the two reductions multiplying, and rounded to the cent once at the end.
      params: [monthly_premium, additional_unit_monthly_premium, annual_pay_discount_rate]
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, within_months: 36, filters: {charge_type: returned_payment}}
        - {table: landlord_billing_entries, aggregate: latest, field: amount, filters: {charge_type: annual_premium}}
        - {table: landlord_billing_entries, aggregate: sum, field: amount, within_months: 12, filters: {charge_type: upgrade_proration}}
        - {table: landlord_claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: landlord_benefit_authorization}}
        - {table: landlord_claim_events, aggregate: count, field: landlord_claim_event_id, within_months: 12, filters: {event_type: landlord_benefit_authorization}}
        - {table: landlord_service_requests, aggregate: count, field: landlord_service_request_id, within_months: 12, filters: {}}
        - {category: lineplan, table: lineplan_billing_entries, aggregate: count, field: lineplan_billing_entry_id, within_months: 12, filters: {event_type: lineplan_premium_payment}}
      cross_category: [lineplan]

  - id: landlord_ext_returned_payment_fee
    base_policy_refs: [landlord_agg_portfolio_discount, landlord_premium_pricing, landlord_premium_collection_and_nonpayment]
    overwrite:
      - base_policy: landlord_premium_pricing
        superseded_clause: >-
          A returned payment is billed back as a returned_payment charge plus one returned_payment_fee charge of returned_payment_fee.
        replaced_by: >-
          For a returned-payment fee this policy sets the fee as set out here, and only for such a fee; the returned payment itself is still billed back in full under the base rule.
      - base_policy: landlord_agg_portfolio_discount
        superseded_clause: >-
          The rate applies to monthly_installment, annual_premium and upgrade_proration charges and never to returned_payment, returned_payment_fee or transfer_fee charges.
        replaced_by: >-
          For a returned-payment fee this policy grants a fixed-dollar portfolio courtesy set by the contract's recorded portfolio discount rate, and only for such a fee; the portfolio discount rate itself is still never applied as a percentage to a returned payment, a returned-payment fee or a transfer fee.
    trigger: state_due
    subject: [landlord_premium_charge]
    computes: fee_amount
    target_tool: bill_returned_payment_fee_d229d74e
    params:
      fee_two_returns: 35.00
      fee_three_returns: 40.00
      large_returned_share: 0.025
      mid_returned_addition: 5.00
      size_large: 1000.00
      size_mid: 400.00
      channel_check: 5.00
      channel_card: 10.00
      courtesy_high: 10.00
      courtesy_mid: 5.00
      rate_high: 0.10
      rate_mid: 0.05
      ageing_reduction_long: 0.50
      ageing_reduction_mid: 0.25
      ageing_months_long: 12
      ageing_months_mid: 6
    rule: >
      This policy fixes the fee billed for the most recent returned premium payment on a rental property service contract when that payment was billed back without its returned-payment fee, and the fee is billed as one returned-payment fee charge naming that payment.
      For a returned-payment fee this policy sets the fee as set out here, and only for such a fee; the returned payment itself is still billed back in full under the base rule.
      For a returned-payment fee this policy grants a fixed-dollar portfolio courtesy set by the contract's recorded portfolio discount rate, and only for such a fee; the portfolio discount rate itself is still never applied as a percentage to a returned payment, a returned-payment fee or a transfer fee.
      The standard returned-payment fee is the tier's returned-payment fee, billed in full and rounded to the cent.
      A returned-payment fee is not billed until the contract stands in force again, in a status under which premium is billed.
      The repeat-return fee level is 40.00 when the contract carries three or more returned payments billed back in the thirty-six months before the fee is billed, 35.00 when it carries exactly two, and the tier's returned-payment fee otherwise.
      The fee basis follows the size of the returned payment: for a returned payment of 1000.00 or more, the fee is 2.5 percent of the returned payment in place of the repeat-return fee level; for a returned payment of at least 400.00 but under 1000.00, the fee is the repeat-return fee level plus 5.00; for a smaller returned payment, the fee is the repeat-return fee level.
      The returned-channel addition is 5.00 when the returned payment had been made by check, 10.00 when it had been made by card, and 0 when it had been made another way.
      The contract's recorded portfolio discount rate is the rate recorded on its most recent annual premium charge for an annual-billed contract, and the rate recorded on the installment for the current term's first billing period for a monthly-billed contract.
      The portfolio courtesy is 10.00 when the contract's recorded portfolio discount rate is 0.10 or more, 5.00 when it is at least 0.05 but under 0.10, and 0 otherwise.
      The ageing reduction on a returned-payment fee is 0.50 when twelve or more whole calendar months have passed from the day the payment was billed back to the day the fee is billed, 0.25 when six to eleven whole months have passed, and 0 when fewer than six have.
      The fee before ageing is the fee basis plus the returned-channel addition less the portfolio courtesy, and the returned-payment fee is the fee before ageing times one less the ageing reduction, rounded to the cent once at the end.
    prerequisite:
      - problem: landlord_ext_late_renewal_premium
        kind: state_gate
        gate: landlord_contracts.status
        form: state
        policy_source: >-
          A returned-payment fee is not billed until the contract stands in force again, in a status under which premium is billed.
        condition: >-
          The contract status is waiting_period, active or suspended_nonpayment when the fee is billed.
        resolved_by: record_late_renewal_5b858282
        effect: >-
          Once the contract stands in force again, the fee may be billed on it.
    cross_category: []
    compute:
      - returned_count_36f: "COUNT('landlord_billing_entries', within_months=36, date_field='entry_date', charge_type='returned_payment')"
      - repeat_fee_level: "K('fee_three_returns') if returned_count_36f >= 3 else (K('fee_two_returns') if returned_count_36f == 2 else P('returned_payment_fee'))"
      - returned_amount: "LATEST('landlord_billing_entries', 'amount', date_field='entry_date', charge_type='returned_payment')"
      - fee_basis: "K('large_returned_share') * returned_amount if returned_amount >= K('size_large') else (repeat_fee_level + K('mid_returned_addition') if returned_amount >= K('size_mid') else repeat_fee_level)"
      - returned_reference: "LATEST('landlord_billing_entries', 'payment_reference', date_field='entry_date', charge_type='returned_payment')"
      - returned_method: "LATEST('landlord_billing_entries', 'payment_method', date_field='entry_date', event_type='landlord_premium_payment', payment_reference=returned_reference)"
      - channel_addition: "K('channel_check') if returned_method == 'check' else (K('channel_card') if returned_method == 'card' else 0)"
      - recorded_rate: "LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='entry_date', charge_type='annual_premium') if F('billing_frequency') == 'annual' else LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='billing_period_start', charge_type='monthly_installment', billing_period_start=F('term_start_date'))"
      - portfolio_courtesy: "K('courtesy_high') if recorded_rate >= K('rate_high') else (K('courtesy_mid') if recorded_rate >= K('rate_mid') else 0)"
      - fee_before_ageing: "fee_basis + channel_addition - portfolio_courtesy"
      - return_date: "LATEST('landlord_billing_entries', 'entry_date', date_field='entry_date', charge_type='returned_payment')"
      - months_since_return: "MONTHS(return_date, NOW)"
      - ageing_reduction: "K('ageing_reduction_long') if months_since_return >= K('ageing_months_long') else (K('ageing_reduction_mid') if months_since_return >= K('ageing_months_mid') else 0)"
      - result: "RND(fee_before_ageing * (1 - ageing_reduction), 2)"
    compute_basis:
      returned_count_36f: "when the contract carries three or more returned payments billed back in the thirty-six months before the fee is billed"
      repeat_fee_level: "The repeat-return fee level is 40.00 when the contract carries three or more returned payments billed back in the thirty-six months before the fee is billed, 35.00 when it carries exactly two, and the tier's returned-payment fee otherwise."
      returned_amount: "This policy fixes the fee billed for the most recent returned premium payment on a rental property service contract when that payment was billed back without its returned-payment fee, and the fee is billed as one returned-payment fee charge naming that payment."
      fee_basis: "The fee basis follows the size of the returned payment: for a returned payment of 1000.00 or more, the fee is 2.5 percent of the returned payment in place of the repeat-return fee level; for a returned payment of at least 400.00 but under 1000.00, the fee is the repeat-return fee level plus 5.00; for a smaller returned payment, the fee is the repeat-return fee level."
      returned_reference: "the most recent returned premium payment on a rental property service contract"
      returned_method: "when the returned payment had been made by check"
      channel_addition: "The returned-channel addition is 5.00 when the returned payment had been made by check, 10.00 when it had been made by card, and 0 when it had been made another way."
      recorded_rate: "The contract's recorded portfolio discount rate is the rate recorded on its most recent annual premium charge for an annual-billed contract, and the rate recorded on the installment for the current term's first billing period for a monthly-billed contract."
      portfolio_courtesy: "The portfolio courtesy is 10.00 when the contract's recorded portfolio discount rate is 0.10 or more, 5.00 when it is at least 0.05 but under 0.10, and 0 otherwise."
      fee_before_ageing: "The fee before ageing is the fee basis plus the returned-channel addition less the portfolio courtesy"
      return_date: "whole calendar months have passed from the day the payment was billed back to the day the fee is billed"
      months_since_return: "when twelve or more whole calendar months have passed from the day the payment was billed back to the day the fee is billed"
      ageing_reduction: "The ageing reduction on a returned-payment fee is 0.50 when twelve or more whole calendar months have passed from the day the payment was billed back to the day the fee is billed, 0.25 when six to eleven whole months have passed, and 0 when fewer than six have."
      result: "the returned-payment fee is the fee before ageing times one less the ageing reduction, rounded to the cent once at the end."
    factors:
      - id: repeat_return_level
        effect: parameter
        decides: repeat_fee_level
        bindings: [returned_count_36f, repeat_fee_level]
        ladder:
          - when: "three or more returned payments billed back in the last thirty-six months"
            value: "K('fee_three_returns')"
          - when: "exactly two"
            value: "K('fee_two_returns')"
          - when: "otherwise"
            value: "P('returned_payment_fee')"
        baseline:
          repeat_fee_level: "P('returned_payment_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: returned_size_basis
        effect: method
        decides: fee_basis
        bindings: [returned_amount, fee_basis]
        ladder:
          - when: "the returned payment was 1000.00 or more"
            method: "percentage basis: 2.5 percent of the returned payment replaces the fee level, carried unrounded until the fee is rounded once at the end"
          - when: "it was at least 400.00 but under 1000.00"
            method: "flat basis: the fee level plus 5.00"
          - when: "otherwise"
            method: "the fee level as it stands"
        baseline:
          fee_basis: "repeat_fee_level"
        evidence: [history]
        cross_difficulty: null
      - id: returned_channel_addition
        effect: parameter
        decides: channel_addition
        bindings: [returned_reference, returned_method, channel_addition]
        ladder:
          - when: "the returned payment had been made by check"
            value: "K('channel_check')"
          - when: "it had been made by card"
            value: "K('channel_card')"
          - when: "otherwise"
            value: "0"
        baseline:
          channel_addition: "0"
        evidence: [history]
        cross_difficulty: null
      - id: portfolio_courtesy
        effect: parameter
        decides: portfolio_courtesy
        bindings: [recorded_rate, portfolio_courtesy]
        ladder:
          - when: "the contract's recorded portfolio discount rate is 0.10 or more"
            value: "K('courtesy_high')"
          - when: "it is at least 0.05 but under 0.10"
            value: "K('courtesy_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          portfolio_courtesy: "0"
        evidence: [history]
        cross_difficulty: null
      - id: fee_ageing_reduction
        effect: parameter
        decides: ageing_reduction
        bindings: [return_date, months_since_return, ageing_reduction]
        ladder:
          - when: "twelve or more whole calendar months since the payment was billed back"
            value: "K('ageing_reduction_long')"
          - when: "six to eleven whole calendar months"
            value: "K('ageing_reduction_mid')"
          - when: "otherwise (under six months)"
            value: "0"
        baseline:
          ageing_reduction: "0"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        This policy fixes the fee billed for the most recent returned premium payment on a rental property service contract when that payment was billed back without its returned-payment fee, and the fee is billed as one returned-payment fee charge naming that payment.
        The standard returned-payment fee is the tier's returned-payment fee, billed in full and rounded to the cent.
      params: [returned_payment_fee]
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, within_months: 36, filters: {charge_type: returned_payment}}
        - {table: landlord_billing_entries, aggregate: latest, field: amount, filters: {charge_type: returned_payment}}
        - {table: landlord_billing_entries, aggregate: latest, field: payment_method, filters: {event_type: landlord_premium_payment}}
        - {table: landlord_billing_entries, aggregate: latest, field: portfolio_discount_rate, filters: {charge_type: annual_premium}}
      cross_category: []

  - id: landlord_ext_plus_upgrade_charge
    base_policy_refs: [landlord_plan_upgrade_rules, landlord_agg_portfolio_discount, landlord_premium_pricing]
    overwrite:
      - base_policy: landlord_plan_upgrade_rules
        superseded_clause: >-
          an annual-billed contract is billed one upgrade_proration charge equal to the difference between the two tiers' annual premiums under landlord_premium_pricing (same portfolio discount) times landlord_msr_unexpired_term_days divided by landlord_msr_term_days, rounded to the cent, both day counts taken as of the upgrade date.
        replaced_by: >-
          For an annual-billed contract moving up to a Plus tier this policy fixes the upgrade charge as set out here, and only for such a move; every other upgrade remains under the base rule.
    trigger: on_request
    subject: [landlord_plan_upgrade, landlord_premium_charge]
    computes: upgrade_charge
    target_tool: accept_plus_upgrade_7955ec7e
    params:
      plus_monthly_single: 76.99
      plus_monthly_multi: 82.99
      plus_unit_multi: 46.99
      months_per_year: 12
      early_term_days: 31
      late_term_days: 270
      early_term_credit: 0.05
      late_term_loading: 0.03
      plus_line_credit_full: 0.05
      plus_line_credit_part: 0.03
      plus_line_payments_full: 12
      plus_line_payments_part: 6
      plus_autopay_clean: 0.03
      plus_autopay_returned: 0.01
    rule: >
      This policy fixes the charge a landlord accepts for moving an annual-billed contract up to a Plus tier during a term: from Bridgewell Rental Combo to Bridgewell Rental Combo Plus, or from Bridgewell Rental Multi-Unit Combo to Bridgewell Rental Multi-Unit Combo Plus, and the charge is billed as one upgrade charge on the upgrade date.
      For an annual-billed contract moving up to a Plus tier this policy fixes the upgrade charge as set out here, and only for such a move; every other upgrade remains under the base rule.
      The standard Plus upgrade charge is the annual Plus step times the unexpired share of the term, rounded to the cent once at the end.
      The annual Plus step is twelve times the difference between the Plus tier's base monthly amount and the current tier's base monthly amount, each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced first by the pay-in-full discount rate and then by the portfolio discount rate recorded on the current term's annual premium charge, the two reductions multiplying.
      The standard unexpired share of the term is the calendar days from the day after the upgrade date through the term end date, divided by the term's days counted from its first day through its last day inclusive.
      An upgrade charge is worked out only once the contract stands in a current term, in its waiting period or active, whose annual premium is billed on the contract.
      An upgrade charge is fixed only after every earlier tier upgrade on the contract carries its own upgrade charge.
      No upgrade charge is fixed until the most recent returned payment on the contract carries its returned-payment fee.
      The repeat-change share of a Plus upgrade charge follows the upgrade charges already billed on the contract in the twelve months before the upgrade and the benefit authorizations issued on it in the three months before the upgrade: when at least one upgrade charge was billed in those twelve months and at least one benefit authorization was issued in those three months, the share is the whole term, one; when at least one upgrade charge was billed in those twelve months and no benefit authorization was issued in those three months, the share is the whole calendar months from the upgrade date to the term end date, counted down to whole months, divided by twelve; otherwise the share is the standard unexpired share of the term.
      The term-timing adjustment on a Plus upgrade charge is a credit of 0.05 when the upgrade is made no more than 31 days after the term start date, a loading of 0.03 when it is made more than 270 days after the term start date, and 0 otherwise.
      The line-plan bundle credit on a Plus upgrade charge is 0.05 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the upgrade, 0.03 when the landlord holds an active line plan and six to eleven such payments were posted, and 0 otherwise.
      The autopay credit on a Plus upgrade charge is 0.03 when the most recent premium payment posted on the contract was made by ACH and no returned payment was billed back on the contract in the twelve months before the upgrade, 0.01 when the most recent premium payment was made by ACH but a returned payment was billed back in those twelve months, and 0 when the most recent premium payment was made another way.
      The line-plan bundle credit and the autopay credit are subtracted from one, the term-timing credit is subtracted from it or the term-timing loading added to it, and the Plus upgrade charge is the annual Plus step times the share times that sum, rounded to the cent once at the end.
    prerequisite:
      - problem: landlord_ext_late_renewal_premium
        kind: value_input
        gate: remaining_days
        form: state
        policy_source: >-
          An upgrade charge is worked out only once the contract stands in a current term, in its waiting period or active, whose annual premium is billed on the contract.
        condition: >-
          The contract status is waiting_period or active, and its term start and term end dates describe a current term for which an annual premium charge stands on the contract.
        resolved_by: record_late_renewal_5b858282
        effect: >-
          Once the contract stands in a current term with that term's annual premium billed, the unexpired days, the months to the term end and the days into the term are those of the current term.
      - problem: landlord_ext_upgrade_catchup_charge
        kind: value_input
        gate: upgrade_charges_12u
        form: state
        policy_source: >-
          An upgrade charge is fixed only after every earlier tier upgrade on the contract carries its own upgrade charge.
        condition: >-
          The contract's billing entries carry an upgrade proration charge for every tier upgrade the contract records.
        resolved_by: bill_upgrade_catchup_f812c6ed
        effect: >-
          Once every earlier upgrade carries its charge, the upgrade charges billed in the twelve months before a new upgrade include it, which can move the repeat-change share off the standard unexpired share.
      - problem: landlord_ext_returned_payment_fee
        kind: state_gate
        gate: landlord_billing_entries.charge_type
        form: state
        policy_source: >-
          No upgrade charge is fixed until the most recent returned payment on the contract carries its returned-payment fee.
        condition: >-
          The most recent returned payment charge on the contract has a returned-payment fee charge naming the same payment.
        resolved_by: bill_returned_payment_fee_d229d74e
        effect: >-
          Once the most recent returned payment carries its fee, the upgrade charge may be fixed.
    cross_category:
      - category: lineplan
        as: history
        reads: [status, lineplan_billing_entries.event_type, lineplan_billing_entries.entry_date]
        note: The line-plan bundle credit reads whether the landlord holds an active utility line plan and counts the premium payments posted on the landlord's line plans in the last twelve months.
    compute:
      - current_base: "P('monthly_premium') + P('additional_unit_monthly_premium') * (F('unit_count') - 1)"
      - plus_base: "K('plus_monthly_single') if F('variant_name') == 'Bridgewell Rental Combo' else (K('plus_monthly_multi') + K('plus_unit_multi') * (F('unit_count') - 1) if F('variant_name') == 'Bridgewell Rental Multi-Unit Combo' else current_base)"
      - term_rate_u: "LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='entry_date', charge_type='annual_premium')"
      - annual_step: "12 * (plus_base - current_base) * (1 - P('annual_pay_discount_rate')) * (1 - term_rate_u)"
      - term_days_u: "DAYS(F('term_start_date'), F('term_end_date')) + 1"
      - remaining_days: "DAYS(NOW, F('term_end_date'))"
      - remaining_months_u: "MONTHS(NOW, F('term_end_date'))"
      - upgrade_charges_12u: "COUNT('landlord_billing_entries', within_months=12, date_field='entry_date', charge_type='upgrade_proration')"
      - authorizations_3: "COUNT('landlord_claim_events', within_months=3, date_field='event_date', event_type='landlord_benefit_authorization')"
      - step_share: "1 if (upgrade_charges_12u >= 1 and authorizations_3 >= 1) else (remaining_months_u / K('months_per_year') if (upgrade_charges_12u >= 1 and authorizations_3 == 0) else remaining_days / term_days_u)"
      - days_into_term: "DAYS(F('term_start_date'), NOW)"
      - timing_adjustment: "0 - K('early_term_credit') if days_into_term <= K('early_term_days') else (K('late_term_loading') if days_into_term > K('late_term_days') else 0)"
      - plus_line_status: "CFIELD('lineplan', 'status', status='active')"
      - plus_line_payments: "XCOUNT('lineplan', 'lineplan_billing_entries', within_months=12, date_field='entry_date', event_type='lineplan_premium_payment')"
      - plus_line_credit: "K('plus_line_credit_full') if (plus_line_status == 'active' and plus_line_payments >= K('plus_line_payments_full')) else (K('plus_line_credit_part') if (plus_line_status == 'active' and plus_line_payments >= K('plus_line_payments_part') and plus_line_payments < K('plus_line_payments_full')) else 0)"
      - plus_last_method: "LATEST('landlord_billing_entries', 'payment_method', date_field='entry_date', event_type='landlord_premium_payment')"
      - plus_returns_12: "COUNT('landlord_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')"
      - plus_autopay_credit: "K('plus_autopay_clean') if (plus_last_method == 'ach' and plus_returns_12 == 0) else (K('plus_autopay_returned') if (plus_last_method == 'ach' and plus_returns_12 >= 1) else 0)"
      - adjustment_u: "1 - plus_line_credit - plus_autopay_credit + timing_adjustment"
      - result: "RND(annual_step * step_share * adjustment_u, 2)"
    compute_basis:
      current_base: "each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first"
      plus_base: "from Bridgewell Rental Combo to Bridgewell Rental Combo Plus, or from Bridgewell Rental Multi-Unit Combo to Bridgewell Rental Multi-Unit Combo Plus"
      term_rate_u: "reduced first by the pay-in-full discount rate and then by the portfolio discount rate recorded on the current term's annual premium charge, the two reductions multiplying"
      annual_step: "The annual Plus step is twelve times the difference between the Plus tier's base monthly amount and the current tier's base monthly amount, each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced first by the pay-in-full discount rate and then by the portfolio discount rate recorded on the current term's annual premium charge, the two reductions multiplying."
      term_days_u: "divided by the term's days counted from its first day through its last day inclusive"
      remaining_days: "The standard unexpired share of the term is the calendar days from the day after the upgrade date through the term end date, divided by the term's days counted from its first day through its last day inclusive."
      remaining_months_u: "the share is the whole calendar months from the upgrade date to the term end date, counted down to whole months, divided by twelve"
      upgrade_charges_12u: "the upgrade charges already billed on the contract in the twelve months before the upgrade"
      authorizations_3: "the benefit authorizations issued on it in the three months before the upgrade"
      step_share: "The repeat-change share of a Plus upgrade charge follows the upgrade charges already billed on the contract in the twelve months before the upgrade and the benefit authorizations issued on it in the three months before the upgrade: when at least one upgrade charge was billed in those twelve months and at least one benefit authorization was issued in those three months, the share is the whole term, one; when at least one upgrade charge was billed in those twelve months and no benefit authorization was issued in those three months, the share is the whole calendar months from the upgrade date to the term end date, counted down to whole months, divided by twelve; otherwise the share is the standard unexpired share of the term."
      days_into_term: "when the upgrade is made no more than 31 days after the term start date"
      timing_adjustment: "The term-timing adjustment on a Plus upgrade charge is a credit of 0.05 when the upgrade is made no more than 31 days after the term start date, a loading of 0.03 when it is made more than 270 days after the term start date, and 0 otherwise."
      plus_line_status: "when the landlord holds an active Bridgewell utility line protection plan"
      plus_line_payments: "at least twelve premium payments were posted on the landlord's line plans in the twelve months before the upgrade"
      plus_line_credit: "The line-plan bundle credit on a Plus upgrade charge is 0.05 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the upgrade, 0.03 when the landlord holds an active line plan and six to eleven such payments were posted, and 0 otherwise."
      plus_last_method: "when the most recent premium payment posted on the contract was made by ACH"
      plus_returns_12: "no returned payment was billed back on the contract in the twelve months before the upgrade"
      plus_autopay_credit: "The autopay credit on a Plus upgrade charge is 0.03 when the most recent premium payment posted on the contract was made by ACH and no returned payment was billed back on the contract in the twelve months before the upgrade, 0.01 when the most recent premium payment was made by ACH but a returned payment was billed back in those twelve months, and 0 when the most recent premium payment was made another way."
      adjustment_u: "The line-plan bundle credit and the autopay credit are subtracted from one, the term-timing credit is subtracted from it or the term-timing loading added to it"
      result: "the Plus upgrade charge is the annual Plus step times the share times that sum, rounded to the cent once at the end."
    factors:
      - id: repeat_change_share
        effect: method
        decides: step_share
        bindings: [remaining_months_u, upgrade_charges_12u, authorizations_3, step_share]
        ladder:
          - when: "at least one upgrade charge billed in the last twelve months AND at least one benefit authorization issued in the last three months"
            method: "the whole term is charged: share one"
          - when: "at least one upgrade charge billed in the last twelve months AND no benefit authorization issued in the last three months"
            method: "whole calendar months to the term end, counted down, divided by twelve"
          - when: "otherwise"
            method: "calendar days after the upgrade through the term end, divided by the term's days"
        baseline:
          step_share: "remaining_days / term_days_u"
        evidence: [history, date]
        cross_difficulty: null
      - id: term_timing_adjustment
        effect: parameter
        decides: timing_adjustment
        bindings: [days_into_term, timing_adjustment]
        ladder:
          - when: "the upgrade is made no more than 31 days after the term start date"
            value: "0 - K('early_term_credit')"
          - when: "it is made more than 270 days after the term start date"
            value: "K('late_term_loading')"
          - when: "otherwise"
            value: "0"
        baseline:
          timing_adjustment: "0"
        evidence: [date]
        cross_difficulty: null
      - id: plus_line_bundle_credit
        effect: parameter
        decides: plus_line_credit
        bindings: [plus_line_status, plus_line_payments, plus_line_credit]
        ladder:
          - when: "the landlord holds an active Bridgewell utility line plan AND at least twelve premium payments were posted on the landlord's line plans in the last twelve months"
            value: "K('plus_line_credit_full')"
          - when: "an active line plan AND six to eleven such payments"
            value: "K('plus_line_credit_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          plus_line_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: lineplan
      - id: plus_autopay_credit
        effect: parameter
        decides: plus_autopay_credit
        bindings: [plus_last_method, plus_returns_12, plus_autopay_credit]
        ladder:
          - when: "the most recent premium payment was made by ACH AND no returned payment billed back in the last twelve months"
            value: "K('plus_autopay_clean')"
          - when: "the most recent premium payment was made by ACH AND a returned payment billed back in the last twelve months"
            value: "K('plus_autopay_returned')"
          - when: "otherwise (the most recent premium payment made another way)"
            value: "0"
        baseline:
          plus_autopay_credit: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        This policy fixes the charge a landlord accepts for moving an annual-billed contract up to a Plus tier during a term: from Bridgewell Rental Combo to Bridgewell Rental Combo Plus, or from Bridgewell Rental Multi-Unit Combo to Bridgewell Rental Multi-Unit Combo Plus, and the charge is billed as one upgrade charge on the upgrade date.
        The standard Plus upgrade charge is the annual Plus step times the unexpired share of the term, rounded to the cent once at the end.
        The annual Plus step is twelve times the difference between the Plus tier's base monthly amount and the current tier's base monthly amount, each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced first by the pay-in-full discount rate and then by the portfolio discount rate recorded on the current term's annual premium charge, the two reductions multiplying.
        The standard unexpired share of the term is the calendar days from the day after the upgrade date through the term end date, divided by the term's days counted from its first day through its last day inclusive.
      params: [monthly_premium, additional_unit_monthly_premium, annual_pay_discount_rate, plus_monthly_single, plus_monthly_multi, plus_unit_multi]
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, within_months: 12, filters: {charge_type: upgrade_proration}}
        - {table: landlord_claim_events, aggregate: count, field: landlord_claim_event_id, within_months: 3, filters: {event_type: landlord_benefit_authorization}}
        - {table: landlord_billing_entries, aggregate: latest, field: payment_method, filters: {event_type: landlord_premium_payment}}
        - {category: lineplan, table: lineplan_billing_entries, aggregate: count, field: lineplan_billing_entry_id, within_months: 12, filters: {event_type: lineplan_premium_payment}}
      cross_category: [lineplan]

  - id: landlord_ext_rerating_correction_credit
    base_policy_refs: [landlord_cancellation_and_refund, landlord_agg_portfolio_discount]
    overwrite:
      - base_policy: landlord_cancellation_and_refund
        superseded_clause: >-
          A cancellation credit is posted only after the landlord has confirmed the cancellation request on file.
        replaced_by: >-
          The condition that a premium credit waits on a confirmed cancellation request binds cancellation credits only, so this policy posts a billing-correction credit without one, and only such a credit; every cancellation credit remains under the base rule.
      - base_policy: landlord_cancellation_and_refund
        superseded_clause: >-
          The sale waiver applies only when notice is given no later than sale_cancellation_window_days calendar days after the property sale closes, counting from the day after property_sale_closing_date with the boundary day included.
        replaced_by: >-
          The sale-waiver window conditions only the admin fee of a cancellation credit, so it is not applied to a billing-correction credit, and only to such a credit; every cancellation credit that carries an admin fee remains under the base rule.
      - base_policy: landlord_cancellation_and_refund
        superseded_clause: >-
          Only one cancellation credit and one refund are posted per cancellation request.
        replaced_by: >-
          The count of one credit and one refund per cancellation request covers cancellation credits only, so a billing-correction credit, which names no cancellation request, is not counted against it, and only such a credit is exempt; every cancellation credit remains under the base rule.
      - base_policy: landlord_agg_portfolio_discount
        superseded_clause: >-
          The number of contracts counted is landlord_msr_portfolio_property_count, a snapshot taken on the first day of the term being priced, counting only contracts held under the same customer profile (contracts of a spouse, partner or separate company profile are never combined).
        replaced_by: >-
          For a re-rating correction this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a correction; every other premium remains under the base rule.
    trigger: state_due
    subject: [landlord_premium_credit]
    computes: correction_amount
    target_tool: post_rerating_correction_12887c54
    params:
      goodwill_three_installments: 0.20
      goodwill_two_installments: 0.10
      daily_interest_rate_year: 0.12
      monthly_interest_rate: 0.01
      long_overcharge_days: 90
      short_overcharge_days: 30
      year_days_c: 365
      tenure_goodwill_three: 0.05
      tenure_goodwill_two: 0.03
      tenure_days_three_c: 1095
      tenure_days_two_c: 730
      autopay_goodwill_clean: 0.03
      autopay_goodwill_returned: 0.01
      line_goodwill_full: 0.04
      line_goodwill_part: 0.02
      line_payments_full_c: 12
    rule: >
      This policy fixes the billing-correction credit owed when monthly installments of the current term of a rental property service contract were billed at a portfolio discount rate of zero although the portfolio discount rate is fixed for the whole term, and the credit is posted as one billing-correction credit naming the earliest period corrected.
      The condition that a premium credit waits on a confirmed cancellation request binds cancellation credits only, so this policy posts a billing-correction credit without one, and only such a credit; every cancellation credit remains under the base rule.
      The sale-waiver window conditions only the admin fee of a cancellation credit, so it is not applied to a billing-correction credit, and only to such a credit; every cancellation credit that carries an admin fee remains under the base rule.
      The count of one credit and one refund per cancellation request covers cancellation credits only, so a billing-correction credit, which names no cancellation request, is not counted against it, and only such a credit is exempt; every cancellation credit remains under the base rule.
      For a re-rating correction this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a correction; every other premium remains under the base rule.
      The monthly installments of the current term are those whose billing period starts on or after the term start date.
      The standard re-rating correction is the total of the current term's installments billed at a portfolio discount rate of zero times the term's portfolio discount rate, rounded to the cent once at the end.
      The goodwill rate of a re-rating correction is 0.20 when three or more installments of the term were billed at a rate of zero, 0.10 when exactly two were, and 0 when one was.
      The overcharge interest on a re-rating correction follows how long the most recent installment billed at a rate of zero has been due when the correction is posted: after more than 90 days, the overcharge is multiplied by one plus 0.12 times those days divided by 365; after 31 to 90 days, it is multiplied by one plus 0.01 times the whole calendar months since that due date; after 30 days or fewer, no interest is added.
      The tenure goodwill rate of a re-rating correction is 0.05 when the contract's original purchase date is 1,095 days or more before the correction is posted, 0.03 when it is 730 to 1,094 days before, and 0 otherwise.
      The autopay goodwill rate of a re-rating correction is 0.03 when the most recent premium payment posted on the contract was made by ACH and no returned payment was billed back on the contract in the twelve months before the correction, 0.01 when the most recent premium payment was made by ACH but a returned payment was billed back in those twelve months, and 0 when the most recent premium payment was made another way.
      The line-plan customer goodwill rate of a re-rating correction is 0.04 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the correction, 0.02 when the landlord holds an active line plan with fewer such payments, and 0 otherwise.
      The goodwill, tenure, autopay and line-plan customer rates are added to one, and the re-rating correction is the overcharge times the interest factor times that sum, rounded to the cent once at the end.
    prerequisite: []
    cross_category:
      - category: lineplan
        as: history
        reads: [status, lineplan_billing_entries.event_type, lineplan_billing_entries.entry_date]
        note: The line-plan customer goodwill reads whether the landlord holds an active utility line plan and counts the premium payments posted on the landlord's line plans in the last twelve months.
    compute:
      - term_months: "MONTHS(F('term_start_date'), NOW) + 1"
      - correct_rate: "LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='billing_period_start', charge_type='monthly_installment', billing_period_start=F('term_start_date'))"
      - rerated_total: "SUM('landlord_billing_entries', 'amount', within_months=term_months, date_field='billing_period_start', charge_type='monthly_installment', portfolio_discount_rate=0.0)"
      - overcharge: "rerated_total * correct_rate"
      - rerated_count: "COUNT('landlord_billing_entries', within_months=term_months, date_field='billing_period_start', charge_type='monthly_installment', portfolio_discount_rate=0.0)"
      - goodwill_rate: "K('goodwill_three_installments') if rerated_count >= 3 else (K('goodwill_two_installments') if rerated_count == 2 else 0)"
      - latest_rerated_start: "LATEST('landlord_billing_entries', 'billing_period_start', date_field='billing_period_start', charge_type='monthly_installment', portfolio_discount_rate=0.0)"
      - overcharge_days: "DAYS(latest_rerated_start, NOW)"
      - interest_factor: "1 + K('daily_interest_rate_year') * overcharge_days / K('year_days_c') if overcharge_days > K('long_overcharge_days') else ((1 + K('monthly_interest_rate') * MONTHS(latest_rerated_start, NOW)) if overcharge_days > K('short_overcharge_days') else 1)"
      - tenure_days_c: "DAYS(F('start_date'), NOW)"
      - tenure_goodwill: "K('tenure_goodwill_three') if tenure_days_c >= K('tenure_days_three_c') else (K('tenure_goodwill_two') if tenure_days_c >= K('tenure_days_two_c') else 0)"
      - last_method_c: "LATEST('landlord_billing_entries', 'payment_method', date_field='entry_date', event_type='landlord_premium_payment')"
      - returns_12c: "COUNT('landlord_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')"
      - autopay_goodwill: "K('autopay_goodwill_clean') if (last_method_c == 'ach' and returns_12c == 0) else (K('autopay_goodwill_returned') if (last_method_c == 'ach' and returns_12c >= 1) else 0)"
      - line_status_c: "CFIELD('lineplan', 'status', status='active')"
      - line_payments_c: "XCOUNT('lineplan', 'lineplan_billing_entries', within_months=12, date_field='entry_date', event_type='lineplan_premium_payment')"
      - line_goodwill: "K('line_goodwill_full') if (line_status_c == 'active' and line_payments_c >= K('line_payments_full_c')) else (K('line_goodwill_part') if (line_status_c == 'active' and line_payments_c < K('line_payments_full_c')) else 0)"
      - result: "RND(overcharge * interest_factor * (1 + goodwill_rate + tenure_goodwill + autopay_goodwill + line_goodwill), 2)"
    compute_basis:
      term_months: "The monthly installments of the current term are those whose billing period starts on or after the term start date."
      correct_rate: "For a re-rating correction this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a correction; every other premium remains under the base rule."
      rerated_total: "The standard re-rating correction is the total of the current term's installments billed at a portfolio discount rate of zero times the term's portfolio discount rate, rounded to the cent once at the end."
      overcharge: "the total of the current term's installments billed at a portfolio discount rate of zero times the term's portfolio discount rate"
      rerated_count: "when three or more installments of the term were billed at a rate of zero"
      goodwill_rate: "The goodwill rate of a re-rating correction is 0.20 when three or more installments of the term were billed at a rate of zero, 0.10 when exactly two were, and 0 when one was."
      latest_rerated_start: "how long the most recent installment billed at a rate of zero has been due when the correction is posted"
      overcharge_days: "after more than 90 days, the overcharge is multiplied by one plus 0.12 times those days divided by 365"
      interest_factor: "The overcharge interest on a re-rating correction follows how long the most recent installment billed at a rate of zero has been due when the correction is posted: after more than 90 days, the overcharge is multiplied by one plus 0.12 times those days divided by 365; after 31 to 90 days, it is multiplied by one plus 0.01 times the whole calendar months since that due date; after 30 days or fewer, no interest is added."
      tenure_days_c: "when the contract's original purchase date is 1,095 days or more before the correction is posted"
      tenure_goodwill: "The tenure goodwill rate of a re-rating correction is 0.05 when the contract's original purchase date is 1,095 days or more before the correction is posted, 0.03 when it is 730 to 1,094 days before, and 0 otherwise."
      last_method_c: "when the most recent premium payment posted on the contract was made by ACH"
      returns_12c: "no returned payment was billed back on the contract in the twelve months before the correction"
      autopay_goodwill: "The autopay goodwill rate of a re-rating correction is 0.03 when the most recent premium payment posted on the contract was made by ACH and no returned payment was billed back on the contract in the twelve months before the correction, 0.01 when the most recent premium payment was made by ACH but a returned payment was billed back in those twelve months, and 0 when the most recent premium payment was made another way."
      line_status_c: "when the landlord holds an active Bridgewell utility line protection plan"
      line_payments_c: "at least twelve premium payments were posted on the landlord's line plans in the twelve months before the correction"
      line_goodwill: "The line-plan customer goodwill rate of a re-rating correction is 0.04 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the correction, 0.02 when the landlord holds an active line plan with fewer such payments, and 0 otherwise."
      result: "The goodwill, tenure, autopay and line-plan customer rates are added to one, and the re-rating correction is the overcharge times the interest factor times that sum, rounded to the cent once at the end."
    factors:
      - id: rerated_count_goodwill
        effect: parameter
        decides: goodwill_rate
        bindings: [rerated_count, goodwill_rate]
        ladder:
          - when: "three or more installments of the term billed at a portfolio rate of zero"
            value: "K('goodwill_three_installments')"
          - when: "exactly two such installments"
            value: "K('goodwill_two_installments')"
          - when: "otherwise (one)"
            value: "0"
        baseline:
          goodwill_rate: "0"
        evidence: [history]
        cross_difficulty: null
      - id: overcharge_interest
        effect: method
        decides: interest_factor
        bindings: [latest_rerated_start, overcharge_days, interest_factor]
        ladder:
          - when: "the most recent re-rated installment has been due more than 90 days"
            method: "daily simple interest: one plus 0.12 times the days due over 365"
          - when: "it has been due 31 to 90 days"
            method: "monthly simple interest: one plus 0.01 times the whole calendar months due"
          - when: "otherwise (30 days or fewer)"
            method: "no interest; the overcharge is taken as it stands"
        baseline:
          interest_factor: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: correction_tenure_goodwill
        effect: parameter
        decides: tenure_goodwill
        bindings: [tenure_days_c, tenure_goodwill]
        ladder:
          - when: "the original purchase date is 1,095 days or more before the correction"
            value: "K('tenure_goodwill_three')"
          - when: "730 to 1,094 days before"
            value: "K('tenure_goodwill_two')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_goodwill: "0"
        evidence: [date]
        cross_difficulty: null
      - id: correction_autopay_goodwill
        effect: parameter
        decides: autopay_goodwill
        bindings: [last_method_c, returns_12c, autopay_goodwill]
        ladder:
          - when: "the most recent premium payment was made by ACH AND no returned payment billed back in the last twelve months"
            value: "K('autopay_goodwill_clean')"
          - when: "the most recent premium payment was made by ACH AND a returned payment billed back in the last twelve months"
            value: "K('autopay_goodwill_returned')"
          - when: "otherwise (the most recent premium payment made another way)"
            value: "0"
        baseline:
          autopay_goodwill: "0"
        evidence: [history]
        cross_difficulty: null
      - id: line_plan_customer_goodwill
        effect: parameter
        decides: line_goodwill
        bindings: [line_status_c, line_payments_c, line_goodwill]
        ladder:
          - when: "the landlord holds an active Bridgewell utility line plan AND at least twelve premium payments were posted on the landlord's line plans in the last twelve months"
            value: "K('line_goodwill_full')"
          - when: "an active line plan AND fewer such payments"
            value: "K('line_goodwill_part')"
          - when: "otherwise (no active line plan)"
            value: "0"
        baseline:
          line_goodwill: "0"
        evidence: [cross_category, history]
        cross_difficulty: lineplan
    baseline:
      rule: >-
        This policy fixes the billing-correction credit owed when monthly installments of the current term of a rental property service contract were billed at a portfolio discount rate of zero although the portfolio discount rate is fixed for the whole term, and the credit is posted as one billing-correction credit naming the earliest period corrected.
        For a re-rating correction this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a correction; every other premium remains under the base rule.
        The monthly installments of the current term are those whose billing period starts on or after the term start date.
        The standard re-rating correction is the total of the current term's installments billed at a portfolio discount rate of zero times the term's portfolio discount rate, rounded to the cent once at the end.
      params: []
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: sum, field: amount, filters: {charge_type: monthly_installment, portfolio_discount_rate: 0.0}}
        - {table: landlord_billing_entries, aggregate: latest, field: portfolio_discount_rate, filters: {charge_type: monthly_installment}}
        - {table: landlord_billing_entries, aggregate: latest, field: payment_method, filters: {event_type: landlord_premium_payment}}
        - {category: lineplan, table: lineplan_billing_entries, aggregate: count, field: lineplan_billing_entry_id, within_months: 12, filters: {event_type: lineplan_premium_payment}}
      cross_category: [lineplan]

  - id: landlord_ext_notice_period_installment
    base_policy_refs: [landlord_agg_portfolio_discount, landlord_premium_pricing, landlord_plan_upgrade_rules]
    overwrite:
      - base_policy: landlord_premium_pricing
        superseded_clause: >-
          A monthly-billed contract is charged one monthly_installment per billing period, equal to the base monthly amount reduced by the term's portfolio_discount_rate under landlord_agg_portfolio_discount and rounded to the cent;
        replaced_by: >-
          For an installment that fell due and was never billed this policy fixes the installment as set out here, and only for such an installment; every installment billed on its due date remains under the base pricing rule.
      - base_policy: landlord_agg_portfolio_discount
        superseded_clause: >-
          The number of contracts counted is landlord_msr_portfolio_property_count, a snapshot taken on the first day of the term being priced, counting only contracts held under the same customer profile (contracts of a spouse, partner or separate company profile are never combined).
        replaced_by: >-
          For an installment that fell due and was never billed this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such an installment; every other premium remains under the base rule.
    trigger: state_due
    subject: [landlord_premium_charge]
    computes: installment_amount
    target_tool: bill_period_installment_43ec6687
    params:
      monthly_appliance_a: 42.99
      monthly_systems_a: 47.99
      monthly_combo_a: 64.99
      monthly_mu_combo_a: 69.99
      unit_mu_combo_a: 39.99
      correction_goodwill_ach: 0.02
      correction_goodwill_other: 0.01
      late_goodwill_long: 0.05
      late_goodwill_mid: 0.03
      late_days_long: 20
      late_days_mid: 10
      home_credit_annual: 0.03
      home_credit_monthly: 0.02
      line_credit_full_a: 0.02
      line_credit_part_a: 0.01
      line_payments_full_a: 12
      autopay_percent: 0.03
      autopay_flat: 1.00
    rule: >
      This policy fixes the monthly installment for a billing period of a monthly-billed rental property service contract that fell due and was never billed, and the installment is billed as one monthly installment for that period, due on the period start.
      For an installment that fell due and was never billed this policy fixes the installment as set out here, and only for such an installment; every installment billed on its due date remains under the base pricing rule.
      For an installment that fell due and was never billed this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such an installment; every other premium remains under the base rule.
      The period billed is the one that starts the day after the last billed installment's period ends.
      The tier in force for the period billed is the tier the contract held before its most recent tier change when that change was made on or after the period's start date, because a new tier's installment is billed only from the next billing period, and is otherwise the tier the contract holds.
      The standard late-billed installment is the base monthly amount of the tier in force for the period billed, which is the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced by the term's portfolio discount rate, and rounded to the cent once at the end.
      The installment for a billing period is fixed only after every earlier installment of the term that was billed at a portfolio discount rate of zero carries its billing correction.
      The correction goodwill on a late-billed installment is 0.02 when a billing-correction credit was posted on the contract in the three months before the installment is billed and the most recent premium payment was made by ACH, 0.01 when such a credit was posted in those months and the most recent premium payment was made another way, and 0 otherwise.
      The late-billing goodwill on a late-billed installment is 0.05 when the installment is billed more than 20 days after its due date, 0.03 when it is billed 11 to 20 days after its due date, and 0 when it is billed 1 to 10 days after its due date.
      The homeowner-plan credit on a late-billed installment is 0.03 when the landlord holds an active Bridgewell homeowner service contract billed annually, 0.02 when the landlord holds an active homeowner service contract billed monthly, and 0 otherwise.
      The line-plan credit on a late-billed installment is 0.02 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the installment is billed, 0.01 when the landlord holds an active line plan with fewer such payments, and 0 otherwise.
      The correction, late-billing, homeowner-plan and line-plan credits are subtracted from one and the standard installment is multiplied by that sum.
      The autopay discount on a late-billed installment then follows how the contract pays: when the most recent premium payment was made by ACH and no returned payment was billed back on the contract in the twelve months before the installment, the installment is reduced by 3 percent; when the most recent premium payment was made by ACH but a returned payment was billed back in those months, a flat 1.00 is taken off the installment; otherwise no autopay discount applies.
      The late-billed installment after the autopay discount is rounded to the cent once at the end.
    prerequisite:
      - problem: landlord_ext_rerating_correction_credit
        kind: value_input
        gate: correction_goodwill
        form: state
        policy_source: >-
          The installment for a billing period is fixed only after every earlier installment of the term that was billed at a portfolio discount rate of zero carries its billing correction.
        condition: >-
          A billing-correction credit stands on the contract for the installments of the current term billed at a portfolio discount rate of zero.
        resolved_by: post_rerating_correction_12887c54
        effect: >-
          Once the billing-correction credit stands on the contract, a correction credit falls in the three months before the installment, so the correction goodwill moves off zero.
    cross_category:
      - category: homeplan
        as: branch
        reads: [status, billing_frequency]
        note: The homeowner-plan credit reads whether the landlord holds an active homeowner service contract and how it is billed.
      - category: lineplan
        as: history
        reads: [status, lineplan_billing_entries.event_type, lineplan_billing_entries.entry_date]
        note: The line-plan credit reads whether the landlord holds an active utility line plan and counts the premium payments posted on the landlord's line plans in the last twelve months.
    compute:
      - current_base_a: "P('monthly_premium') + P('additional_unit_monthly_premium') * (F('unit_count') - 1)"
      - prior_base_a: "K('monthly_appliance_a') if F('prior_variant_name') == 'Bridgewell Rental Appliance' else (K('monthly_systems_a') if F('prior_variant_name') == 'Bridgewell Rental Systems' else (K('monthly_combo_a') if F('prior_variant_name') == 'Bridgewell Rental Combo' else (K('monthly_mu_combo_a') + K('unit_mu_combo_a') * (F('unit_count') - 1) if F('prior_variant_name') == 'Bridgewell Rental Multi-Unit Combo' else current_base_a)))"
      - period_end_before: "LATEST('landlord_billing_entries', 'billing_period_end', date_field='billing_period_start', charge_type='monthly_installment')"
      - base_monthly_a: "prior_base_a if (F('last_plan_change_date') != '' and DAYS(period_end_before, F('last_plan_change_date')) >= 1) else current_base_a"
      - term_rate_a: "LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='billing_period_start', charge_type='monthly_installment', billing_period_start=F('term_start_date'))"
      - standard_installment: "base_monthly_a * (1 - term_rate_a)"
      - corrections_3: "COUNT('landlord_billing_entries', within_months=3, date_field='entry_date', credit_reason='billing_correction')"
      - last_payment_method_a: "LATEST('landlord_billing_entries', 'payment_method', date_field='entry_date', event_type='landlord_premium_payment')"
      - correction_goodwill: "K('correction_goodwill_ach') if (corrections_3 >= 1 and last_payment_method_a == 'ach') else (K('correction_goodwill_other') if (corrections_3 >= 1 and last_payment_method_a != 'ach') else 0)"
      - last_period_end: "LATEST('landlord_billing_entries', 'billing_period_end', date_field='billing_period_start', charge_type='monthly_installment')"
      - days_late: "DAYS(last_period_end, NOW) - 1"
      - late_goodwill: "K('late_goodwill_long') if days_late > K('late_days_long') else (K('late_goodwill_mid') if days_late > K('late_days_mid') else 0)"
      - home_status_a: "CFIELD('homeplan', 'status', status='active')"
      - home_billing_a: "CFIELD('homeplan', 'billing_frequency', status='active')"
      - home_credit: "K('home_credit_annual') if (home_status_a == 'active' and home_billing_a == 'annual') else (K('home_credit_monthly') if (home_status_a == 'active' and home_billing_a == 'monthly') else 0)"
      - line_status_a: "CFIELD('lineplan', 'status', status='active')"
      - line_payments_a: "XCOUNT('lineplan', 'lineplan_billing_entries', within_months=12, date_field='entry_date', event_type='lineplan_premium_payment')"
      - line_credit_a: "K('line_credit_full_a') if (line_status_a == 'active' and line_payments_a >= K('line_payments_full_a')) else (K('line_credit_part_a') if (line_status_a == 'active' and line_payments_a < K('line_payments_full_a')) else 0)"
      - credited_installment: "standard_installment * (1 - correction_goodwill - late_goodwill - home_credit - line_credit_a)"
      - returns_12a: "COUNT('landlord_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')"
      - autopay_installment: "credited_installment * (1 - K('autopay_percent')) if (last_payment_method_a == 'ach' and returns_12a == 0) else (credited_installment - K('autopay_flat') if (last_payment_method_a == 'ach' and returns_12a >= 1) else credited_installment)"
      - result: "RND(autopay_installment, 2)"
    compute_basis:
      current_base_a: "which is the tier's monthly premium plus its additional-unit premium for each unit beyond the first"
      prior_base_a: "the tier the contract held before its most recent tier change"
      period_end_before: "The period billed is the one that starts the day after the last billed installment's period ends."
      base_monthly_a: "The tier in force for the period billed is the tier the contract held before its most recent tier change when that change was made on or after the period's start date, because a new tier's installment is billed only from the next billing period, and is otherwise the tier the contract holds."
      term_rate_a: "For an installment that fell due and was never billed this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such an installment; every other premium remains under the base rule."
      standard_installment: "The standard late-billed installment is the base monthly amount of the tier in force for the period billed, which is the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced by the term's portfolio discount rate, and rounded to the cent once at the end."
      corrections_3: "when a billing-correction credit was posted on the contract in the three months before the installment is billed"
      last_payment_method_a: "the most recent premium payment was made by ACH"
      correction_goodwill: "The correction goodwill on a late-billed installment is 0.02 when a billing-correction credit was posted on the contract in the three months before the installment is billed and the most recent premium payment was made by ACH, 0.01 when such a credit was posted in those months and the most recent premium payment was made another way, and 0 otherwise."
      last_period_end: "The period billed is the one that starts the day after the last billed installment's period ends."
      days_late: "when the installment is billed more than 20 days after its due date"
      late_goodwill: "The late-billing goodwill on a late-billed installment is 0.05 when the installment is billed more than 20 days after its due date, 0.03 when it is billed 11 to 20 days after its due date, and 0 when it is billed 1 to 10 days after its due date."
      home_status_a: "when the landlord holds an active Bridgewell homeowner service contract billed annually"
      home_billing_a: "0.02 when the landlord holds an active homeowner service contract billed monthly"
      home_credit: "The homeowner-plan credit on a late-billed installment is 0.03 when the landlord holds an active Bridgewell homeowner service contract billed annually, 0.02 when the landlord holds an active homeowner service contract billed monthly, and 0 otherwise."
      line_status_a: "when the landlord holds an active Bridgewell utility line protection plan"
      line_payments_a: "at least twelve premium payments were posted on the landlord's line plans in the twelve months before the installment is billed"
      line_credit_a: "The line-plan credit on a late-billed installment is 0.02 when the landlord holds an active Bridgewell utility line protection plan and at least twelve premium payments were posted on the landlord's line plans in the twelve months before the installment is billed, 0.01 when the landlord holds an active line plan with fewer such payments, and 0 otherwise."
      credited_installment: "The correction, late-billing, homeowner-plan and line-plan credits are subtracted from one and the standard installment is multiplied by that sum."
      returns_12a: "no returned payment was billed back on the contract in the twelve months before the installment"
      autopay_installment: "The autopay discount on a late-billed installment then follows how the contract pays: when the most recent premium payment was made by ACH and no returned payment was billed back on the contract in the twelve months before the installment, the installment is reduced by 3 percent; when the most recent premium payment was made by ACH but a returned payment was billed back in those months, a flat 1.00 is taken off the installment; otherwise no autopay discount applies."
      result: "The late-billed installment after the autopay discount is rounded to the cent once at the end."
    factors:
      - id: correction_goodwill
        effect: parameter
        decides: correction_goodwill
        bindings: [corrections_3, correction_goodwill]
        ladder:
          - when: "a billing-correction credit posted in the last three months AND the most recent premium payment made by ACH"
            value: "K('correction_goodwill_ach')"
          - when: "a billing-correction credit posted in the last three months AND the most recent premium payment made another way"
            value: "K('correction_goodwill_other')"
          - when: "otherwise"
            value: "0"
        baseline:
          correction_goodwill: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_billing_goodwill
        effect: parameter
        decides: late_goodwill
        bindings: [last_period_end, days_late, late_goodwill]
        ladder:
          - when: "the installment is billed more than 20 days after its due date"
            value: "K('late_goodwill_long')"
          - when: "it is billed 11 to 20 days after its due date"
            value: "K('late_goodwill_mid')"
          - when: "otherwise (billed 1 to 10 days after its due date)"
            value: "0"
        baseline:
          late_goodwill: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: installment_homeowner_credit
        effect: parameter
        decides: home_credit
        bindings: [home_status_a, home_billing_a, home_credit]
        ladder:
          - when: "the landlord holds an active Bridgewell homeowner service contract AND it is billed annually"
            value: "K('home_credit_annual')"
          - when: "an active homeowner service contract AND it is billed monthly"
            value: "K('home_credit_monthly')"
          - when: "otherwise"
            value: "0"
        baseline:
          home_credit: "0"
        evidence: [cross_category]
        cross_difficulty: homeplan
      - id: installment_line_credit
        effect: parameter
        decides: line_credit_a
        bindings: [line_status_a, line_payments_a, line_credit_a]
        ladder:
          - when: "the landlord holds an active Bridgewell utility line plan AND at least twelve premium payments were posted on the landlord's line plans in the last twelve months"
            value: "K('line_credit_full_a')"
          - when: "an active line plan AND fewer such payments"
            value: "K('line_credit_part_a')"
          - when: "otherwise"
            value: "0"
        baseline:
          line_credit_a: "0"
        evidence: [cross_category, history]
        cross_difficulty: lineplan
      - id: installment_autopay_discount
        effect: method
        decides: autopay_installment
        bindings: [returns_12a, autopay_installment]
        ladder:
          - when: "the most recent premium payment was made by ACH AND no returned payment billed back in the last twelve months"
            method: "percentage discount: the installment times one less 0.03"
          - when: "the most recent premium payment was made by ACH AND a returned payment billed back in the last twelve months"
            method: "flat discount: 1.00 taken off the installment"
          - when: "otherwise"
            method: "no autopay discount; the installment stands"
        baseline:
          autopay_installment: "credited_installment"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        This policy fixes the monthly installment for a billing period of a monthly-billed rental property service contract that fell due and was never billed, and the installment is billed as one monthly installment for that period, due on the period start.
        For an installment that fell due and was never billed this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such an installment; every other premium remains under the base rule.
        The period billed is the one that starts the day after the last billed installment's period ends.
        The tier in force for the period billed is the tier the contract held before its most recent tier change when that change was made on or after the period's start date, because a new tier's installment is billed only from the next billing period, and is otherwise the tier the contract holds.
        The standard late-billed installment is the base monthly amount of the tier in force for the period billed, which is the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced by the term's portfolio discount rate, and rounded to the cent once at the end.
      params: [monthly_premium, additional_unit_monthly_premium, monthly_appliance_a, monthly_systems_a, monthly_combo_a, monthly_mu_combo_a, unit_mu_combo_a]
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: latest, field: portfolio_discount_rate, filters: {charge_type: monthly_installment}}
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, within_months: 3, filters: {credit_reason: billing_correction}}
        - {table: landlord_billing_entries, aggregate: latest, field: billing_period_end, filters: {charge_type: monthly_installment}}
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, within_months: 12, filters: {charge_type: returned_payment}}
        - {category: lineplan, table: lineplan_billing_entries, aggregate: count, field: lineplan_billing_entry_id, within_months: 12, filters: {event_type: lineplan_premium_payment}}
      cross_category: [homeplan, lineplan]

  - id: landlord_ext_upgrade_difference_charge
    base_policy_refs: [landlord_agg_portfolio_discount, landlord_premium_pricing, landlord_plan_upgrade_rules]
    overwrite:
      - base_policy: landlord_agg_portfolio_discount
        superseded_clause: >-
          The number of contracts counted is landlord_msr_portfolio_property_count, a snapshot taken on the first day of the term being priced, counting only contracts held under the same customer profile (contracts of a spouse, partner or separate company profile are never combined).
        replaced_by: >-
          For an upgrade difference charge this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a charge; every other premium remains under the base rule.
    trigger: state_due
    subject: [landlord_premium_charge]
    computes: difference_amount
    target_tool: bill_upgrade_difference_aa78d3be
    params:
      monthly_appliance_d: 42.99
      monthly_systems_d: 47.99
      monthly_combo_d: 64.99
      monthly_mu_combo_d: 69.99
      unit_mu_combo_d: 39.99
      month_days_convention: 30
      full_period_days: 23
      minimum_charge_days: 7
      late_billing_days: 30
      mid_billing_days: 15
      delay_concession_late_d: 0.15
      delay_concession_mid_d: 0.05
      late_term_days_d: 150
      early_term_days_d: 60
      late_term_loading_d: 0.03
      early_term_credit_d: 0.05
      tenure_days_three_d: 1095
      tenure_days_two_d: 730
      tenure_credit_three_d: 0.04
      tenure_credit_two_d: 0.02
      home_credit_annual_d: 0.03
      home_credit_monthly_d: 0.02
      autopay_clean_d: 0.03
      autopay_returned_d: 0.01
    rule: >
      This policy fixes the upgrade difference charge for a monthly-billed rental property service contract moved to a higher tier part-way through a billing period, and the charge is billed as one upgrade charge for the rest of that period.
      A monthly-billed contract upgraded part-way through a billing period is also billed the difference for the rest of that period as set out here, while the new tier's installment is billed from the next billing period.
      For an upgrade difference charge this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a charge; every other premium remains under the base rule.
      No upgrade difference charge is fixed until the installment for the first billing period at the new tier stands billed on the contract.
      The monthly difference is the new tier's base monthly amount less the old tier's base monthly amount, each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced by the term's portfolio discount rate.
      The days left after the upgrade are the calendar days after the upgrade date and before the start of the first billing period at the new tier.
      The standard upgrade difference charge is the monthly difference times the days left after the upgrade divided by 30, rounded to the cent once at the end.
      The period share of an upgrade difference charge follows where in its billing period the upgrade fell: when 23 or more days were left after the upgrade, the full monthly difference is charged for that period; when 7 or fewer days were left, a one-week minimum of 7 days divided by 30 is charged for that period; otherwise the standard days left divided by 30 is used.
      The billing-delay concession on an upgrade difference charge is 0.15 when it is billed more than 30 days after the upgrade, 0.05 when it is billed 15 to 30 days after the upgrade, and 0 otherwise.
      The term-timing adjustment on an upgrade difference charge is a loading of 0.03 when the upgrade was made more than 150 days after the term start date, a credit of 0.05 when it was made no more than 60 days after the term start date, and 0 otherwise.
      The tenure credit on an upgrade difference charge is 0.04 when the contract's original purchase date is 1,095 days or more before the charge is billed, 0.02 when it is 730 to 1,094 days before, and 0 otherwise.
      The homeowner-plan credit on an upgrade difference charge is 0.03 when the landlord holds an active Bridgewell homeowner service contract billed annually, 0.02 when the landlord holds an active homeowner service contract billed monthly, and 0 otherwise.
      The autopay credit on an upgrade difference charge is 0.03 when two or more premium payments were posted on the contract by ACH in the three months before the charge and no returned payment was billed back on the contract in the twelve months before it, 0.01 when two or more such ACH payments were posted but a returned payment was billed back in those twelve months, and 0 when fewer than two premium payments were posted by ACH in those three months.
      The billing-delay concession, the tenure credit, the homeowner-plan credit and the autopay credit are subtracted from one, the term-timing loading is added or its credit subtracted, and the upgrade difference charge is the monthly difference times the period share times that sum, rounded to the cent once at the end.
    prerequisite:
      - problem: landlord_ext_notice_period_installment
        kind: state_gate
        gate: landlord_billing_entries.billing_period_start
        form: state
        policy_source: >-
          No upgrade difference charge is fixed until the installment for the first billing period at the new tier stands billed on the contract.
        condition: >-
          A monthly installment stands on the contract for the first billing period that starts after the upgrade date.
        resolved_by: bill_period_installment_43ec6687
        effect: >-
          Once that installment stands billed, the upgrade difference for the period before it may be fixed.
    cross_category:
      - category: homeplan
        as: branch
        reads: [status, billing_frequency]
        note: The homeowner-plan credit reads whether the landlord holds an active homeowner service contract and how it is billed.
    compute:
      - new_period_start: "LATEST('landlord_billing_entries', 'billing_period_start', date_field='billing_period_start', charge_type='monthly_installment')"
      - new_base_d: "P('monthly_premium') + P('additional_unit_monthly_premium') * (F('unit_count') - 1)"
      - old_base_d: "K('monthly_appliance_d') if F('prior_variant_name') == 'Bridgewell Rental Appliance' else (K('monthly_systems_d') if F('prior_variant_name') == 'Bridgewell Rental Systems' else (K('monthly_combo_d') if F('prior_variant_name') == 'Bridgewell Rental Combo' else (K('monthly_mu_combo_d') + K('unit_mu_combo_d') * (F('unit_count') - 1) if F('prior_variant_name') == 'Bridgewell Rental Multi-Unit Combo' else new_base_d)))"
      - term_rate_d: "LATEST('landlord_billing_entries', 'portfolio_discount_rate', date_field='billing_period_start', charge_type='monthly_installment', billing_period_start=F('term_start_date'))"
      - monthly_difference: "(new_base_d - old_base_d) * (1 - term_rate_d)"
      - days_left: "DAYS(F('last_plan_change_date'), new_period_start) - 1"
      - period_position_days: "DAYS(F('last_plan_change_date'), LATEST('landlord_billing_entries', 'billing_period_start', date_field='billing_period_start', charge_type='monthly_installment')) - 1"
      - period_share: "1 if period_position_days >= K('full_period_days') else (K('minimum_charge_days') / K('month_days_convention') if period_position_days <= K('minimum_charge_days') else days_left / K('month_days_convention'))"
      - delay_lag_days: "DAYS(F('last_plan_change_date'), NOW)"
      - delay_concession_d: "K('delay_concession_late_d') if delay_lag_days > K('late_billing_days') else (K('delay_concession_mid_d') if delay_lag_days >= K('mid_billing_days') else 0)"
      - upgrade_term_day: "DAYS(F('term_start_date'), F('last_plan_change_date'))"
      - timing_adjustment_d: "K('late_term_loading_d') if upgrade_term_day > K('late_term_days_d') else (0 - K('early_term_credit_d') if upgrade_term_day <= K('early_term_days_d') else 0)"
      - tenure_days_d: "DAYS(F('start_date'), NOW)"
      - tenure_credit_d: "K('tenure_credit_three_d') if tenure_days_d >= K('tenure_days_three_d') else (K('tenure_credit_two_d') if tenure_days_d >= K('tenure_days_two_d') else 0)"
      - home_status_d: "CFIELD('homeplan', 'status', status='active')"
      - home_billing_d: "CFIELD('homeplan', 'billing_frequency', status='active')"
      - home_credit_d: "K('home_credit_annual_d') if (home_status_d == 'active' and home_billing_d == 'annual') else (K('home_credit_monthly_d') if (home_status_d == 'active' and home_billing_d == 'monthly') else 0)"
      - ach_payments_3d: "COUNT('landlord_billing_entries', within_months=3, date_field='entry_date', event_type='landlord_premium_payment', payment_method='ach')"
      - returns_12d: "COUNT('landlord_billing_entries', within_months=12, date_field='entry_date', charge_type='returned_payment')"
      - autopay_credit_d: "K('autopay_clean_d') if (ach_payments_3d >= 2 and returns_12d == 0) else (K('autopay_returned_d') if (ach_payments_3d >= 2 and returns_12d >= 1) else 0)"
      - result: "RND(monthly_difference * period_share * (1 - delay_concession_d - tenure_credit_d - home_credit_d - autopay_credit_d + timing_adjustment_d), 2)"
    compute_basis:
      new_period_start: "before the start of the first billing period at the new tier"
      new_base_d: "each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first"
      old_base_d: "the new tier's base monthly amount less the old tier's base monthly amount"
      term_rate_d: "For an upgrade difference charge this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a charge; every other premium remains under the base rule."
      monthly_difference: "The monthly difference is the new tier's base monthly amount less the old tier's base monthly amount, each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced by the term's portfolio discount rate."
      days_left: "The days left after the upgrade are the calendar days after the upgrade date and before the start of the first billing period at the new tier."
      period_position_days: "follows where in its billing period the upgrade fell"
      period_share: "The period share of an upgrade difference charge follows where in its billing period the upgrade fell: when 23 or more days were left after the upgrade, the full monthly difference is charged for that period; when 7 or fewer days were left, a one-week minimum of 7 days divided by 30 is charged for that period; otherwise the standard days left divided by 30 is used."
      delay_lag_days: "when it is billed more than 30 days after the upgrade"
      delay_concession_d: "The billing-delay concession on an upgrade difference charge is 0.15 when it is billed more than 30 days after the upgrade, 0.05 when it is billed 15 to 30 days after the upgrade, and 0 otherwise."
      upgrade_term_day: "when the upgrade was made more than 150 days after the term start date"
      timing_adjustment_d: "The term-timing adjustment on an upgrade difference charge is a loading of 0.03 when the upgrade was made more than 150 days after the term start date, a credit of 0.05 when it was made no more than 60 days after the term start date, and 0 otherwise."
      tenure_days_d: "when the contract's original purchase date is 1,095 days or more before the charge is billed"
      tenure_credit_d: "The tenure credit on an upgrade difference charge is 0.04 when the contract's original purchase date is 1,095 days or more before the charge is billed, 0.02 when it is 730 to 1,094 days before, and 0 otherwise."
      home_status_d: "when the landlord holds an active Bridgewell homeowner service contract billed annually"
      home_billing_d: "0.02 when the landlord holds an active homeowner service contract billed monthly"
      home_credit_d: "The homeowner-plan credit on an upgrade difference charge is 0.03 when the landlord holds an active Bridgewell homeowner service contract billed annually, 0.02 when the landlord holds an active homeowner service contract billed monthly, and 0 otherwise."
      ach_payments_3d: "when two or more premium payments were posted on the contract by ACH in the three months before the charge"
      returns_12d: "no returned payment was billed back on the contract in the twelve months before it"
      autopay_credit_d: "The autopay credit on an upgrade difference charge is 0.03 when two or more premium payments were posted on the contract by ACH in the three months before the charge and no returned payment was billed back on the contract in the twelve months before it, 0.01 when two or more such ACH payments were posted but a returned payment was billed back in those twelve months, and 0 when fewer than two premium payments were posted by ACH in those three months."
      result: "The billing-delay concession, the tenure credit, the homeowner-plan credit and the autopay credit are subtracted from one, the term-timing loading is added or its credit subtracted, and the upgrade difference charge is the monthly difference times the period share times that sum, rounded to the cent once at the end."
    factors:
      - id: difference_period_share
        effect: method
        decides: period_share
        bindings: [period_position_days, period_share]
        ladder:
          - when: "23 or more days left in the billing period after the upgrade"
            method: "the full monthly difference is charged for the period"
          - when: "7 or fewer days left after the upgrade"
            method: "a flat one-week minimum share, 7 divided by 30, whatever the days left"
          - when: "otherwise"
            method: "days left divided by 30"
        baseline:
          period_share: "days_left / K('month_days_convention')"
        evidence: [history, date]
        cross_difficulty: null
      - id: difference_delay_concession
        effect: parameter
        decides: delay_concession_d
        bindings: [delay_lag_days, delay_concession_d]
        ladder:
          - when: "billed more than 30 days after the upgrade"
            value: "K('delay_concession_late_d')"
          - when: "billed 15 to 30 days after the upgrade"
            value: "K('delay_concession_mid_d')"
          - when: "otherwise"
            value: "0"
        baseline:
          delay_concession_d: "0"
        evidence: [date]
        cross_difficulty: null
      - id: upgrade_term_timing
        effect: parameter
        decides: timing_adjustment_d
        bindings: [upgrade_term_day, timing_adjustment_d]
        ladder:
          - when: "the upgrade was made more than 150 days after the term start date"
            value: "K('late_term_loading_d')"
          - when: "it was made no more than 60 days after the term start date"
            value: "0 - K('early_term_credit_d')"
          - when: "otherwise"
            value: "0"
        baseline:
          timing_adjustment_d: "0"
        evidence: [date]
        cross_difficulty: null
      - id: contract_tenure_credit
        effect: parameter
        decides: tenure_credit_d
        bindings: [tenure_days_d, tenure_credit_d]
        ladder:
          - when: "the original purchase date is 1,095 days or more before the charge is billed"
            value: "K('tenure_credit_three_d')"
          - when: "730 to 1,094 days before"
            value: "K('tenure_credit_two_d')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_credit_d: "0"
        evidence: [date]
        cross_difficulty: null
      - id: difference_homeowner_credit
        effect: parameter
        decides: home_credit_d
        bindings: [home_status_d, home_billing_d, home_credit_d]
        ladder:
          - when: "the landlord holds an active Bridgewell homeowner service contract AND it is billed annually"
            value: "K('home_credit_annual_d')"
          - when: "an active homeowner service contract AND it is billed monthly"
            value: "K('home_credit_monthly_d')"
          - when: "otherwise"
            value: "0"
        baseline:
          home_credit_d: "0"
        evidence: [cross_category]
        cross_difficulty: homeplan
      - id: difference_autopay_credit
        effect: parameter
        decides: autopay_credit_d
        bindings: [ach_payments_3d, returns_12d, autopay_credit_d]
        ladder:
          - when: "two or more premium payments by ACH in the last three months AND no returned payment billed back in the last twelve months"
            value: "K('autopay_clean_d')"
          - when: "two or more premium payments by ACH in the last three months AND a returned payment billed back in the last twelve months"
            value: "K('autopay_returned_d')"
          - when: "otherwise (fewer than two ACH premium payments in the last three months)"
            value: "0"
        baseline:
          autopay_credit_d: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        This policy fixes the upgrade difference charge for a monthly-billed rental property service contract moved to a higher tier part-way through a billing period, and the charge is billed as one upgrade charge for the rest of that period.
        For an upgrade difference charge this policy takes the term's portfolio discount rate as the rate recorded on the installment for the term's first billing period instead of counting the portfolio again, and only for such a charge; every other premium remains under the base rule.
        The monthly difference is the new tier's base monthly amount less the old tier's base monthly amount, each being the tier's monthly premium plus its additional-unit premium for each unit beyond the first, reduced by the term's portfolio discount rate.
        The days left after the upgrade are the calendar days after the upgrade date and before the start of the first billing period at the new tier.
        The standard upgrade difference charge is the monthly difference times the days left after the upgrade divided by 30, rounded to the cent once at the end.
      params: [monthly_premium, additional_unit_monthly_premium, monthly_appliance_d, monthly_systems_d, monthly_combo_d, monthly_mu_combo_d, unit_mu_combo_d, month_days_convention]
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: latest, field: billing_period_start, filters: {charge_type: monthly_installment}}
        - {table: landlord_billing_entries, aggregate: latest, field: portfolio_discount_rate, filters: {charge_type: monthly_installment}}
