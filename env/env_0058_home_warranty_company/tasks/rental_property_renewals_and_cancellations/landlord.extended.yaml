  - id: landlord_ext_sale_cancellation_credit
    base_policy_refs: [landlord_cancellation_and_refund]
    overwrite:
      - base_policy: landlord_cancellation_and_refund
        superseded_clause: >-
          a monthly-billed contract is credited nothing for installments already billed, carries no admin fee and is billed no further installments.
        replaced_by: >-
          For a monthly-billed contract cancelled because the property was sold, this policy credits the unused share of the installment for the billing period in which notice was given, as set out here, and only for such a cancellation; every other monthly-billed cancellation remains under the base rule, and no admin fee and no further installment applies to either.
      - base_policy: landlord_cancellation_and_refund
        superseded_clause: >-
          The cancellation is effective on notice_date and never backdated.
        replaced_by: >-
          For a monthly-billed contract cancelled because the property was sold, the cancellation stays effective on the notice date but the credit's unused days may be counted from the day after the sale closing as set out here, and only for such a credit; every other cancellation remains effective on the notice date with nothing counted before it.
    trigger: on_request
    subject: [landlord_cancellation, landlord_premium_credit]
    computes: cancellation_credit
    target_tool: confirm_sale_cancellation_d8f9046f
    params:
      quick_notice_days: 7
      slow_notice_days: 30
      week_days_c: 7
      holdback_large: 0.40
      holdback_small: 0.20
      home_bonus_full: 0.10
      home_bonus_part: 0.05
      home_payments_full: 12
      record_bonus_six: 0.03
      record_bonus_three: 0.01
      record_count_six: 6
      record_count_three: 3
      departure_bonus_three: 0.04
      departure_bonus_two: 0.02
      departure_days_three: 1095
      departure_days_two: 730
    rule: >
      This policy fixes the credit a landlord receives on confirming the cancellation of a monthly-billed rental property service contract because the property was sold, and the confirmation cancels the contract effective on the notice date and posts the credit as one cancellation credit for the cancellation request.
      For a monthly-billed contract cancelled because the property was sold, this policy credits the unused share of the installment for the billing period in which notice was given, as set out here, and only for such a cancellation; every other monthly-billed cancellation remains under the base rule, and no admin fee and no further installment applies to either.
      For a monthly-billed contract cancelled because the property was sold, the cancellation stays effective on the notice date but the credit's unused days may be counted from the day after the sale closing as set out here, and only for such a credit; every other cancellation remains effective on the notice date with nothing counted before it.
      A sale cancellation credit is not fixed until the installment for the billing period in which notice was given stands billed on the contract.
      The cancellation is confirmed and its credit posted only after every tier upgrade made during the term carries its upgrade charge on the contract.
      The standard sale cancellation credit is the installment billed for the billing period in which notice was given times the unused share of that period, rounded to the cent once at the end, where the unused share is the calendar days after the notice date through the period's last day, divided by the period's days counted from its first day through its last day inclusive.
      The unused share used for a sale cancellation credit follows how soon notice followed the sale closing: when notice was given no more than 7 days after the closing date, the unused days are counted from the day after the closing date, but never more than the period's days; when notice was given more than 30 days after the closing date, the unused days after the notice date are counted down to whole weeks; otherwise the standard unused share is used.
      The recent-claim holdback on a sale cancellation credit is 0.40 when benefit authorizations were issued on the contract in the month before the confirmation and together they are at least the notice-period installment, 0.20 when such authorizations were issued but together they are below that installment, and 0 when none were issued.
      The homeowner-plan bonus on a sale cancellation credit is 0.10 when the landlord holds an active Bridgewell homeowner service contract with at least twelve premium payments posted on it in the twelve months before the confirmation, 0.05 when the landlord holds an active homeowner contract with fewer such payments, and 0 otherwise.
      The payment-record bonus on a sale cancellation credit is 0.03 when six or more premium payments were posted on the contract in the six months before the confirmation, 0.01 when three to five were, and 0 when fewer than three were.
      The departing-customer tenure bonus on a sale cancellation credit is 0.04 when the contract's original purchase date is 1,095 days or more before the notice date, 0.02 when it is 730 to 1,094 days before it, and 0 otherwise.
      The recent-claim holdback is subtracted from one; separately the homeowner-plan, payment-record and departing-customer tenure bonuses are added to one; the sale cancellation credit is the notice-period installment times the unused share times both of those factors, rounded to the cent once at the end.
    prerequisite:
      - problem: landlord_ext_notice_period_installment
        kind: value_input
        gate: notice_installment
        form: state
        policy_source: >-
          A sale cancellation credit is not fixed until the installment for the billing period in which notice was given stands billed on the contract.
        condition: >-
          A monthly installment stands on the contract for the billing period that contains the notice date on the cancellation request.
        resolved_by: bill_period_installment_43ec6687
        effect: >-
          Once that installment stands billed, the notice-period installment, the period's last day and its day count are read from it.
      - problem: landlord_ext_upgrade_difference_charge
        kind: state_gate
        gate: landlord_billing_entries.charge_type
        form: state
        policy_source: >-
          The cancellation is confirmed and its credit posted only after every tier upgrade made during the term carries its upgrade charge on the contract.
        condition: >-
          An upgrade proration charge stands on the contract for every mid-period tier upgrade made during the current term.
        resolved_by: bill_upgrade_difference_aa78d3be
        effect: >-
          Once every upgrade of the term carries its charge, the cancellation may be confirmed and its credit posted.
    cross_category:
      - category: homeplan
        as: history
        reads: [status, homeplan_billing_entries.event_type, homeplan_billing_entries.entry_date]
        note: The homeowner-plan bonus reads whether the landlord holds an active homeowner service contract and counts the premium payments posted on it in the last twelve months.
    compute:
      - notice_installment: "LATEST('landlord_billing_entries', 'amount', date_field='billing_period_start', charge_type='monthly_installment')"
      - period_start_c: "LATEST('landlord_billing_entries', 'billing_period_start', date_field='billing_period_start', charge_type='monthly_installment')"
      - period_end_c: "LATEST('landlord_billing_entries', 'billing_period_end', date_field='billing_period_start', charge_type='monthly_installment')"
      - period_days_c: "DAYS(period_start_c, period_end_c) + 1"
      - notice_date_c: "LATEST('landlord_cancellation_requests', 'notice_date', date_field='notice_date')"
      - unused_days_notice: "DAYS(notice_date_c, period_end_c)"
      - closing_date_c: "LATEST('landlord_cancellation_requests', 'property_sale_closing_date', date_field='notice_date')"
      - notice_lag_days: "DAYS(closing_date_c, notice_date_c)"
      - unused_share: "MN(DAYS(closing_date_c, period_end_c), period_days_c) / period_days_c if notice_lag_days <= K('quick_notice_days') else ((int(unused_days_notice / K('week_days_c')) * K('week_days_c')) / period_days_c if notice_lag_days > K('slow_notice_days') else unused_days_notice / period_days_c)"
      - recent_authorizations: "COUNT('landlord_claim_events', within_months=1, date_field='event_date', event_type='landlord_benefit_authorization')"
      - recent_benefit: "SUM('landlord_claim_events', 'amount', within_months=1, date_field='event_date', event_type='landlord_benefit_authorization')"
      - holdback: "K('holdback_large') if (recent_authorizations >= 1 and recent_benefit >= notice_installment) else (K('holdback_small') if (recent_authorizations >= 1 and recent_benefit < notice_installment) else 0)"
      - home_status_c: "CFIELD('homeplan', 'status', status='active')"
      - home_payments_12: "XCOUNT('homeplan', 'homeplan_billing_entries', within_months=12, date_field='entry_date', event_type='homeplan_premium_payment')"
      - home_bonus: "K('home_bonus_full') if (home_status_c == 'active' and home_payments_12 >= K('home_payments_full')) else (K('home_bonus_part') if (home_status_c == 'active' and home_payments_12 < K('home_payments_full')) else 0)"
      - payments_6: "COUNT('landlord_billing_entries', within_months=6, date_field='entry_date', event_type='landlord_premium_payment')"
      - record_bonus: "K('record_bonus_six') if payments_6 >= K('record_count_six') else (K('record_bonus_three') if payments_6 >= K('record_count_three') else 0)"
      - departure_days: "DAYS(F('start_date'), LATEST('landlord_cancellation_requests', 'notice_date', date_field='notice_date'))"
      - departure_bonus: "K('departure_bonus_three') if departure_days >= K('departure_days_three') else (K('departure_bonus_two') if departure_days >= K('departure_days_two') else 0)"
      - result: "RND(notice_installment * unused_share * (1 - holdback) * (1 + home_bonus + record_bonus + departure_bonus), 2)"
    compute_basis:
      notice_installment: "the installment billed for the billing period in which notice was given"
      period_start_c: "the period's days counted from its first day through its last day inclusive"
      period_end_c: "the calendar days after the notice date through the period's last day"
      period_days_c: "divided by the period's days counted from its first day through its last day inclusive"
      notice_date_c: "the calendar days after the notice date through the period's last day"
      unused_days_notice: "The standard sale cancellation credit is the installment billed for the billing period in which notice was given times the unused share of that period, rounded to the cent once at the end, where the unused share is the calendar days after the notice date through the period's last day, divided by the period's days counted from its first day through its last day inclusive."
      closing_date_c: "when notice was given no more than 7 days after the closing date, the unused days are counted from the day after the closing date, but never more than the period's days"
      notice_lag_days: "follows how soon notice followed the sale closing"
      unused_share: "The unused share used for a sale cancellation credit follows how soon notice followed the sale closing: when notice was given no more than 7 days after the closing date, the unused days are counted from the day after the closing date, but never more than the period's days; when notice was given more than 30 days after the closing date, the unused days after the notice date are counted down to whole weeks; otherwise the standard unused share is used."
      recent_authorizations: "when benefit authorizations were issued on the contract in the month before the confirmation"
      recent_benefit: "together they are at least the notice-period installment"
      holdback: "The recent-claim holdback on a sale cancellation credit is 0.40 when benefit authorizations were issued on the contract in the month before the confirmation and together they are at least the notice-period installment, 0.20 when such authorizations were issued but together they are below that installment, and 0 when none were issued."
      home_status_c: "when the landlord holds an active Bridgewell homeowner service contract"
      home_payments_12: "with at least twelve premium payments posted on it in the twelve months before the confirmation"
      home_bonus: "The homeowner-plan bonus on a sale cancellation credit is 0.10 when the landlord holds an active Bridgewell homeowner service contract with at least twelve premium payments posted on it in the twelve months before the confirmation, 0.05 when the landlord holds an active homeowner contract with fewer such payments, and 0 otherwise."
      payments_6: "when six or more premium payments were posted on the contract in the six months before the confirmation"
      record_bonus: "The payment-record bonus on a sale cancellation credit is 0.03 when six or more premium payments were posted on the contract in the six months before the confirmation, 0.01 when three to five were, and 0 when fewer than three were."
      departure_days: "when the contract's original purchase date is 1,095 days or more before the notice date"
      departure_bonus: "The departing-customer tenure bonus on a sale cancellation credit is 0.04 when the contract's original purchase date is 1,095 days or more before the notice date, 0.02 when it is 730 to 1,094 days before it, and 0 otherwise."
      result: "The recent-claim holdback is subtracted from one; separately the homeowner-plan, payment-record and departing-customer tenure bonuses are added to one; the sale cancellation credit is the notice-period installment times the unused share times both of those factors, rounded to the cent once at the end."
    factors:
      - id: closing_anchor_share
        effect: method
        decides: unused_share
        bindings: [closing_date_c, notice_lag_days, unused_share]
        ladder:
          - when: "notice given no more than 7 days after the sale closing date"
            method: "unused days counted from the day after the closing date (never more than the period's days), over the period's days"
          - when: "notice given more than 30 days after the closing date"
            method: "unused days after the notice date counted down to whole weeks, over the period's days"
          - when: "otherwise"
            method: "unused days after the notice date over the period's days"
        baseline:
          unused_share: "unused_days_notice / period_days_c"
        evidence: [date]
        cross_difficulty: null
      - id: recent_claim_holdback
        effect: parameter
        decides: holdback
        bindings: [recent_authorizations, recent_benefit, holdback]
        ladder:
          - when: "benefit authorizations issued in the month before the confirmation AND together at least the notice-period installment"
            value: "K('holdback_large')"
          - when: "such authorizations issued AND together below that installment"
            value: "K('holdback_small')"
          - when: "otherwise (none issued)"
            value: "0"
        baseline:
          holdback: "0"
        evidence: [history]
        cross_difficulty: null
      - id: homeowner_plan_bonus
        effect: parameter
        decides: home_bonus
        bindings: [home_status_c, home_payments_12, home_bonus]
        ladder:
          - when: "the landlord holds an active Bridgewell homeowner service contract AND at least twelve premium payments posted on it in the last twelve months"
            value: "K('home_bonus_full')"
          - when: "an active homeowner contract AND fewer such payments"
            value: "K('home_bonus_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          home_bonus: "0"
        evidence: [cross_category, history]
        cross_difficulty: homeplan
      - id: payment_record_bonus
        effect: parameter
        decides: record_bonus
        bindings: [payments_6, record_bonus]
        ladder:
          - when: "six or more premium payments posted in the last six months"
            value: "K('record_bonus_six')"
          - when: "three to five premium payments"
            value: "K('record_bonus_three')"
          - when: "otherwise (fewer than three)"
            value: "0"
        baseline:
          record_bonus: "0"
        evidence: [history]
        cross_difficulty: null
      - id: departing_tenure_bonus
        effect: parameter
        decides: departure_bonus
        bindings: [departure_days, departure_bonus]
        ladder:
          - when: "the original purchase date is 1,095 days or more before the notice date"
            value: "K('departure_bonus_three')"
          - when: "730 to 1,094 days before the notice date"
            value: "K('departure_bonus_two')"
          - when: "otherwise"
            value: "0"
        baseline:
          departure_bonus: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        This policy fixes the credit a landlord receives on confirming the cancellation of a monthly-billed rental property service contract because the property was sold, and the confirmation cancels the contract effective on the notice date and posts the credit as one cancellation credit for the cancellation request.
        The standard sale cancellation credit is the installment billed for the billing period in which notice was given times the unused share of that period, rounded to the cent once at the end, where the unused share is the calendar days after the notice date through the period's last day, divided by the period's days counted from its first day through its last day inclusive.
      params: []
    inputs:
      history:
        - {table: landlord_billing_entries, aggregate: latest, field: amount, filters: {charge_type: monthly_installment}}
        - {table: landlord_cancellation_requests, aggregate: latest, field: notice_date, filters: {}}
        - {table: landlord_claim_events, aggregate: sum, field: amount, within_months: 1, filters: {event_type: landlord_benefit_authorization}}
        - {table: landlord_billing_entries, aggregate: count, field: landlord_billing_entry_id, within_months: 6, filters: {event_type: landlord_premium_payment}}
        - {category: homeplan, table: homeplan_billing_entries, aggregate: count, field: homeplan_billing_entry_id, within_months: 12, filters: {event_type: homeplan_premium_payment}}
      cross_category: [homeplan]
