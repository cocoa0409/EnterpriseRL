  - w_full_called: P('full_replacement_break_count') > 0 and w_orig_done != None and DAYS(w_orig_done, w_date) <=
      P('replacement_lookback_days')
  - w_scope_rate: K('scope_rate_whole') if w_full_called else (K('scope_rate_reopen') if w_type == 'recall' and
      not w_full_called else 1.0)
  - w_util_paid: SUM('lineplan_billing_entries', 'amount', within_months=K('partner_window_months'), date_field='entry_date',
      event_type='lineplan_premium_payment', payment_method='utility_bill')
  - w_partner_rate: K('partner_rate_lakeshore') if F('partner_utility') == 'Lakeshore Water Authority' and w_util_paid
      > 0 else (K('partner_rate_riverbend') if F('partner_utility') == 'Riverbend Municipal Utilities' and w_util_paid
      > 0 else 1.0)
  - w_urg: LATEST('lineplan_service_requests', 'urgency', date_field='request_date')
  - w_temp_here: COUNT('lineplan_claim_events', event_type='lineplan_repair_authorization', resolution_type='temporary_repair',
      lineplan_service_request_id=w_req)
  - w_plating: K('plating_add_plated') if w_urg == 'emergency' and w_temp_here > 0 else (K('plating_add_patched')
      if w_urg == 'emergency' and w_temp_here == 0 else 0.0)
  - w_month: MONTHS('2000-01-01', w_date) % 12
  - w_zip3: int(F('property_zip')) // 100
  - w_cold: K('cold_add_winter') if (w_month == 11 or w_month <= 2) and (w_zip3 == 5 or (w_zip3 >= 10 and w_zip3
      <= 69) or (w_zip3 >= 100 and w_zip3 <= 149) or (w_zip3 >= 480 and w_zip3 <= 629) or (w_zip3 >= 680 and w_zip3
      <= 693) or (w_zip3 >= 800 and w_zip3 <= 831) or (w_zip3 >= 995 and w_zip3 <= 999)) else (K('cold_add_shoulder')
      if (w_month == 10 or w_month == 3) and (w_zip3 == 5 or (w_zip3 >= 10 and w_zip3 <= 69) or (w_zip3 >= 100 and
      w_zip3 <= 149) or (w_zip3 >= 480 and w_zip3 <= 629) or (w_zip3 >= 680 and w_zip3 <= 693) or (w_zip3 >= 800
      and w_zip3 <= 831) or (w_zip3 >= 995 and w_zip3 <= 999)) else 0.0)
  - w_figure: P('public_way_restoration_allowance') * w_scope_rate * w_partner_rate + w_plating + w_cold
  - w_orig_pw: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', allowance_type='public_way_restoration',
      lineplan_service_request_id=w_orig)
  - w_temp_pw: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', allowance_type='public_way_restoration',
      lineplan_service_request_id=w_temp_req)
  - w_after_offset: MX(0, w_figure - w_orig_pw) if w_is_recall else (MX(0, w_figure - w_temp_pw) if w_is_cont else
      w_figure)
  - w_this_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=w_req)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=w_req)
  - w_link_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=(w_orig
      if w_is_recall else (w_temp_req if w_is_cont else ''))) - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal',
      lineplan_service_request_id=(w_orig if w_is_recall else (w_temp_req if w_is_cont else '')))
  - w_cap: P('water_line_occurrence_cap') if w_line == 'water_service_line' else (P('sewer_line_occurrence_cap')
      if w_line == 'sewer_lateral' else (P('gas_line_occurrence_cap') if w_line == 'gas_service_line' else 0.0))
  - w_open: MX(0, w_cap - w_this_net - w_link_net)
  - result: RND(MN(w_after_offset, w_open), 2)
  compute_basis:
    w_req: The public-way restoration payment is figured once per service request, on the day it is booked and from
      the plan's records as they stand that day; periods said to run to the request date end on the service request's
      request date.
    w_date: The public-way restoration payment is figured once per service request, on the day it is booked and
      from the plan's records as they stand that day; periods said to run to the request date end on the service
      request's request date.
    w_type: 'Public-way scope rate: where the plan replaces whole lines after repeat breaks, which is when its full
      replacement break count is above zero, and the most recent completed repair on the same line was completed
      no more than the plan''s replacement lookback days before the request date, the public-way restoration figure
      takes the whole-line public-way rate; for a recall where those two conditions do not both hold, it takes the
      re-opening public-way rate; every other request takes a public-way scope rate of one.'
    w_line: The public-way restoration payment is the allowance Bridgewell authorizes on a covered exterior water
      service line, sewer lateral or gas service line service request toward cutting and restoring a public sidewalk,
      curb or street that the permanent work opens, booked as one allowance authorization of type public way restoration;
      a whole-line replacement always opens the public way, because it starts at the connection point.
    w_orig: 'The public-way restoration payment is never more than the occurrence benefit still open, which is the
      plan''s occurrence cap for the line (the water line occurrence cap for a water service line, the sewer line
      occurrence cap for a sewer lateral, the gas line occurrence cap for a gas service line) less every amount
      already authorized, net of reversals, on the service request and on the earlier request whose occurrence it
      belongs to: for a recall reported no later than the plan''s repair guarantee days after the most recent completed
      repair on the same line, the request of that completed repair, and for a new failure reported no more than
      the public-way continuation days after a temporary repair was authorized on another request for the same line,
      that temporary-repair request.'
