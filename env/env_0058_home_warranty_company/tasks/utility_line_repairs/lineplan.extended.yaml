  factors:
  - id: lawn_recall_offset
    effect: method
    decides: l_after_offset
    bindings:
    - l_orig_lawn
    - l_temp_lawn
    - l_after_offset
    ladder:
    - when: a recall reported no later than the plan's repair guarantee days after the most recent completed repair
        on the same line
      method: the lawn restoration figure less the lawn restoration payments already authorized on the request of
        that completed repair, never below zero
    - when: a new failure reported no more than the lawn continuation days after a temporary repair was authorized
        on another request for the same line
      method: the lawn restoration figure less the lawn restoration payments already authorized on that temporary-repair
        request, never below zero
    - when: otherwise
      method: the lawn restoration figure in full
    baseline:
      l_after_offset: l_figure
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lawn_excavation_rate
    effect: parameter
    decides: l_exc_rate
    bindings:
    - l_full_called
    - l_exc_rate
    ladder:
    - when: whole lines are replaced after repeat breaks on the plan AND the most recent completed repair on the
        same line falls within the replacement lookback days before the request
      value: K('excavation_rate_whole')
    - when: a recall where those two conditions do not both hold
      value: K('excavation_rate_redig')
    - when: otherwise
      value: '1.0'
    baseline:
      l_exc_rate: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lawn_season_rate
    effect: parameter
    decides: l_season_rate
    bindings:
    - l_zip3
    - l_month
    - l_season_rate
    ladder:
    - when: a property in the frost territory AND the request was placed in December, January, February or March
      value: K('season_rate_dormant')
    - when: a property in the frost territory AND the request was placed in November or April
      value: K('season_rate_late')
    - when: otherwise
      value: '1.0'
    baseline:
      l_season_rate: '1.0'
    evidence:
    - date
    cross_difficulty: null
  - id: lawn_partner_schedule
    effect: parameter
    decides: l_partner_rate
    bindings:
    - l_util_paid
    - l_partner_rate
    ladder:
    - when: enrolled through Lakeshore Water Authority AND premium remitted through that utility's bill within the
        lawn partner window
      value: K('partner_rate_lakeshore')
    - when: enrolled through Riverbend Municipal Utilities AND premium remitted through that utility's bill within
        the lawn partner window
      value: K('partner_rate_riverbend')
    - when: otherwise
      value: '1.0'
    baseline:
      l_partner_rate: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: lawn_backfill_addition
    effect: parameter
    decides: l_backfill
    bindings:
    - l_urg
    - l_temp_here
    - l_backfill
    ladder:
    - when: an emergency request AND a temporary repair has been authorized on it
      value: K('backfill_add_second')
    - when: an emergency request AND no temporary repair has been authorized on it
      value: K('backfill_add_single')
    - when: otherwise
      value: '0.0'
    baseline:
      l_backfill: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'The lawn restoration payment is figured once per service request, on the day it is booked and from the
      plan''s records as they stand that day; periods said to run to the request date end on the service request''s
      request date. The standard lawn restoration payment is the plan''s landscaping restoration allowance as a
      flat amount, whatever the landscaper charges. The lawn restoration payment is never more than the occurrence
      benefit still open, which is the plan''s occurrence cap for the line (the water line occurrence cap for a
      water service line, the sewer line occurrence cap for a sewer lateral or a septic line, the electrical line
      occurrence cap for an electrical service line, the gas line occurrence cap for a gas service line) less every
      amount already authorized, net of reversals, on the service request and on the earlier request whose occurrence
      it belongs to: for a recall reported no later than the plan''s repair guarantee days after the most recent
      completed repair on the same line, the request of that completed repair, and for a new failure reported no
      more than the lawn continuation days after a temporary repair was authorized on another request for the same
      line, that temporary-repair request. The lawn restoration payment is rounded to the cent once, at the end.'
    params:
    - landscaping_restoration_allowance
    - water_line_occurrence_cap
    - sewer_line_occurrence_cap
    - electrical_line_occurrence_cap
    - gas_line_occurrence_cap
    - repair_guarantee_days
  inputs:
    history:
    - table: lineplan_service_requests
      aggregate: latest
      field: request_date
      filters: {}
    - table: lineplan_claim_events
      aggregate: latest
      field: event_date
      filters:
        event_type: lineplan_work_completion
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: lineplan_repair_authorization
        allowance_type: landscaping_restoration
    - table: lineplan_claim_events
      aggregate: count
      field: lineplan_claim_event_id
      filters:
        event_type: lineplan_repair_authorization
        resolution_type: temporary_repair
    - table: lineplan_billing_entries
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: lineplan_premium_payment
        payment_method: utility_bill
    cross_category: []
- id: lineplan_ext_exterior_work_payment
  base_policy_refs:
  - lineplan_evt_repair_authorization
  overwrite:
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: Each authorization pays the lower of its invoice_amount and the remaining occurrence benefit;
      the customer may pay the contractor for work beyond the cap or decline it.
    replaced_by: For permanent work on an exterior line whose contractor quote is above the exterior permanent-work
      payment, this policy sets the amount paid as stated here, and only for such work; every other authorization
      remains under the base rule that it pays the lower of its invoice amount and the remaining occurrence benefit.
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: Each occurrence is paid up to the plan's occurrence cap for the line type (occurrence_cap),
      counted by lineplan_msr_occurrence_benefit_paid, and occurrences are not limited in number.
    replaced_by: For such exterior permanent work the exterior workmanship recovery, the exterior material upgrade
      contribution, the exterior partner co-funding, the exterior frost excavation contribution and the exterior
      commissioning contribution are paid on top of the occurrence cap, and only for such work; every other payment
      on an occurrence remains within the base occurrence cap.
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: 'Restoration allowances are paid inside the occurrence cap, never in addition to it: public_way_restoration_allowance
      for a public sidewalk, curb or street, landscaping_restoration_allowance for basic lawn restoration, slab_access_allowance
      for access through a slab, and permits, camera inspection and cleanout installation where permit_fee_covered,
      camera_inspection_covered and cleanout_installation_covered are true.'
    replaced_by: For the acceptance camera inspection of a sewer lateral replaced whole this policy pays the sewer
      commissioning contribution on top of the occurrence cap, and only for that inspection; every other camera
      inspection remains under the base rule that it is paid inside the occurrence cap.
  trigger: on_request
  subject:
  - lineplan_repair_authorization
  computes: bridgewell_payment
  target_tool: approve_exterior_line_work_7ea09e9b
  params:
    continuation_days: 14
    full_recovery_days: 90
    share_full: 1.0
    share_half: 0.5
    upsizing_area: 2000
    upgrade_galvanized_upsized: 1050.0
    upgrade_galvanized: 750.0
    upgrade_standard: 250.0
    partner_window_months: 12
    cofund_lakeshore: 500.0
    cofund_riverbend: 250.0
    frost_winter: 600.0
    frost_shoulder: 300.0
    commission_water: 175.0
    commission_sewer: 225.0
  rule: 'The exterior permanent-work payment is what Bridgewell pays toward the permanent repair or replacement
    of a covered exterior water service line, sewer lateral, septic line, electrical service line or gas service
    line when the contractor''s quote for that work is above what Bridgewell pays; the customer approves the work
    in person and pays the contractor the rest of the quote, and the payment is booked as one repair authorization
    that records the contractor''s quote as its cost. The exterior permanent-work payment is not fixed until the
    service request carries the public-way restoration entry owed where that work opens a public sidewalk, curb
    or street. Before the exterior permanent-work payment is worked out, the service request must carry the landscaping
    restoration entry owed where that work is dug by open trench through the yard. The exterior permanent-work payment
    is figured once, on the day it is booked and from the plan''s records as they stand that day; periods said to
    run to the request date end on the service request''s request date. The standard exterior permanent-work payment
    is the exterior occurrence benefit left open on the service request: the plan''s occurrence cap for the line
    (the water line occurrence cap for a water service line, the sewer line occurrence cap for a sewer lateral or
    a septic line, the electrical line occurrence cap for an electrical service line, the gas line occurrence cap
    for a gas service line) less every amount already authorized on the service request, net of reversals, never
    below zero. The exterior permanent-work payment is rounded to the cent once, at the end. The exterior permanent-work
    payment is the exterior occurrence benefit left open, worked out over the exterior occurrence scope, plus the
    exterior workmanship recovery, plus the exterior material upgrade contribution, plus the exterior partner co-funding,
    plus the exterior frost excavation contribution, plus the exterior commissioning contribution. Exterior occurrence
    scope: for a recall reported no later than the plan''s repair guarantee days after the most recent completed
    repair on the same line, the amounts already authorized, net of reversals, on the request of that completed
    repair are deducted from the line''s occurrence cap together with those on the service request; for a new failure
    reported no more than the exterior continuation days after a temporary repair was authorized on another request
    for the same line, the amounts already authorized, net of reversals, on that temporary-repair request are deducted
    together with those on the service request; for every other request only the amounts on the service request
    are deducted. A repaired exterior section that fails again inside the repair guarantee is charged back to the
    network contractor who repaired it, and the recovered share returns to the exterior permanent-work payment.
    Exterior workmanship recovery: for a recall reported no more than the exterior full recovery days after the
    completed repair it recalls was completed, the exterior full recovery share of the payment on the authorization
    that completion closed is added, where that authorization is a section repair (a completed authorization is
    never reversed, so its payment stands as authorized); for a recall reported later than the exterior full recovery
    days but no later than the plan''s repair guarantee days after that completion, the exterior half recovery share
    of that section repair payment is added; for every other request nothing is added. An exterior line calls for
    whole-line work when the plan replaces whole lines after repeat breaks, which is when its full replacement break
    count is above zero, and the most recent completed repair on the same line was completed no more than the plan''s
    replacement lookback days before the request date. A water service line replaced whole is brought up to current
    code: a galvanized steel line is replaced in copper with a new curb stop, sized by the plumbing code to the
    home''s water demand, so a larger home needs the next pipe size up; a line of any other material needs a new
    curb stop and tracer wire; Bridgewell sizes the upsizing from the living area on its own records, so a home
    with no living area on those records is upgraded at the standard galvanized size. Exterior material upgrade
    contribution: on a water service line that calls for whole-line work and whose service line material on record
    is galvanized steel, a home whose living area recorded on the household''s active Bridgewell homeowner service
    contract for the same property address is at least the upsizing area in square feet adds the upsized galvanized
    upgrade contribution, and a home recorded below the upsizing area in square feet, or with no living area recorded
    on such a contract, adds the galvanized upgrade contribution; on a water service line that calls for whole-line
    work and whose recorded material is anything other than galvanized steel, the standard upgrade contribution
    is added; every other request adds no exterior material upgrade contribution. A property is in the frost territory
    when it lies in a state whose plumbing code sets a design frost depth of at least 36 inches for buried water
    lines across most of the state, because there the soil over a service line freezes deep enough in winter that
    excavation must break frozen ground: Alaska, Colorado, Connecticut, Illinois, Iowa, Maine, Massachusetts, Michigan,
    Minnesota, Montana, Nebraska, New Hampshire, New York, North Dakota, Rhode Island, South Dakota, Vermont, Wisconsin
    and Wyoming. The state is read from the first three digits of the ZIP code recorded for the property on the
    plan: 005, 010 through 069, 100 through 149, 480 through 629, 680 through 693, 800 through 831 and 995 through
    999 are the frost territory, and every other ZIP code is outside it. Exterior frost excavation contribution:
    on a property in the frost territory, a request placed in December, January, February or March adds the winter
    frost excavation contribution, for breaking frozen ground and thawing the trench line, and a request placed
    in November or April adds the shoulder-season frost excavation contribution; a request on a property outside
    the frost territory, or placed in any other month, adds no frost excavation contribution. Exterior commissioning
    contribution: on a line that calls for whole-line work, a water service line adds the water commissioning contribution
    for the pressure test, flushing and disinfection a new water service needs before it is put into use, and a
    sewer lateral adds the sewer commissioning contribution for the acceptance camera inspection of the finished
    lateral; every other request adds no commissioning contribution. Exterior partner co-funding: on a water service
    line that calls for whole-line work, a plan enrolled through Lakeshore Water Authority whose premium has been
    remitted through that utility''s bill within the exterior partner window adds the Lakeshore co-funding, and
    a plan enrolled through Riverbend Municipal Utilities whose premium has been remitted through that utility''s
    bill within the exterior partner window adds the Riverbend co-funding; every other request adds no exterior
    partner co-funding. Exterior windows counted in months run back from the day the payment is booked: an entry
    falls within an exterior window when fewer whole months than the window separate its posting date from that
    day. For permanent work on an exterior line whose contractor quote is above the exterior permanent-work payment,
    this policy sets the amount paid as stated here, and only for such work; every other authorization remains under
    the base rule that it pays the lower of its invoice amount and the remaining occurrence benefit. For such exterior
    permanent work the exterior workmanship recovery, the exterior material upgrade contribution, the exterior partner
    co-funding, the exterior frost excavation contribution and the exterior commissioning contribution are paid
    on top of the occurrence cap, and only for such work; every other payment on an occurrence remains within the
    base occurrence cap. For the acceptance camera inspection of a sewer lateral replaced whole this policy pays
    the sewer commissioning contribution on top of the occurrence cap, and only for that inspection; every other
    camera inspection remains under the base rule that it is paid inside the occurrence cap.'
  prerequisite:
  - problem: lineplan_ext_public_way_payment
    kind: value_input
    gate: e_this_net
    form: state
    policy_source: The exterior permanent-work payment is not fixed until the service request carries the public-way
      restoration entry owed where that work opens a public sidewalk, curb or street.
    condition: Where the permanent work opens a public sidewalk, curb or street, the service request carries an
      allowance authorization of type public way restoration in the plan's claim history, not reversed.
    resolved_by: authorize_public_way_restoration_c5bbe6ee
    effect: The public-way restoration payment booked on the service request joins the amounts already authorized
      on it, so the exterior occurrence benefit left open, and with it the exterior permanent-work payment, falls
      by exactly that payment.
  - problem: lineplan_ext_lawn_restoration_payment
    kind: value_input
    gate: e_this_net
    form: state
    policy_source: Before the exterior permanent-work payment is worked out, the service request must carry the
      landscaping restoration entry owed where that work is dug by open trench through the yard.
    condition: Where the permanent work is dug by open trench through the yard, the service request carries an allowance
      authorization of type landscaping restoration in the plan's claim history, not reversed.
    resolved_by: authorize_lawn_restoration_4590e15f
    effect: The lawn restoration payment booked on the service request joins the amounts already authorized on it,
      so the exterior occurrence benefit left open, and with it the exterior permanent-work payment, falls by exactly
      that payment.
  cross_category:
  - category: homeplan
    as: branch
    reads:
    - status
    - property_address
    - square_footage
    note: The exterior material upgrade contribution is sized by the living area recorded on the household's active
      homeowner service contract for the same property.
  compute:
  - e_req: LATEST('lineplan_service_requests', 'lineplan_service_request_id', date_field='request_date')
  - e_date: LATEST('lineplan_service_requests', 'request_date', date_field='request_date')
  - e_type: LATEST('lineplan_service_requests', 'request_type', date_field='request_date')
  - e_line: LATEST('lineplan_service_requests', 'line_type', date_field='request_date')
  - e_orig: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_work_completion',
      line_type=e_line)
  - e_orig_done: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_work_completion',
      line_type=e_line)
  - e_orig_auth: LATEST('lineplan_claim_events', 'authorization_number', date_field='event_date', event_type='lineplan_work_completion',
      line_type=e_line)
  - e_is_recall: e_type == 'recall' and e_orig_done != None and DAYS(e_orig_done, e_date) <= P('repair_guarantee_days')
  - e_temp_req: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=e_line)
  - e_temp_date: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=e_line)
  - e_is_cont: e_type == 'new_failure' and e_temp_date != None and e_temp_req != e_req and DAYS(e_temp_date, e_date)
      <= K('continuation_days')
  - e_this_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=e_req)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=e_req)
  - e_orig_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=e_orig)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=e_orig)
  - e_temp_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=e_temp_req)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=e_temp_req)
  - e_committed: e_this_net + e_orig_net if e_is_recall else (e_this_net + e_temp_net if e_is_cont else e_this_net)
  - e_cap: P('water_line_occurrence_cap') if e_line == 'water_service_line' else (P('sewer_line_occurrence_cap')
      if e_line == 'sewer_lateral' or e_line == 'septic_line' else (P('electrical_line_occurrence_cap') if e_line
      == 'electrical_service_line' else (P('gas_line_occurrence_cap') if e_line == 'gas_service_line' else 0.0)))
  - e_open: MX(0, e_cap - e_committed)
  - e_orig_repair: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', resolution_type='section_repair',
      authorization_number=e_orig_auth)
  - e_gap: DAYS(e_orig_done, e_date) if e_orig_done != None else 0
  - e_restore_share: K('share_full') if e_is_recall and e_gap <= K('full_recovery_days') else (K('share_half') if
      e_is_recall and e_gap > K('full_recovery_days') else 0.0)
  - e_restored: e_restore_share * e_orig_repair
  - e_full_called: P('full_replacement_break_count') > 0 and e_orig_done != None and DAYS(e_orig_done, e_date) <=
      P('replacement_lookback_days')
  - e_area: CFIELD('homeplan', 'square_footage', status='active', property_address=F('property_address')) or 0
  - e_material: K('upgrade_galvanized_upsized') if e_full_called and e_line == 'water_service_line' and F('service_line_material')
      == 'galvanized_steel' and e_area >= K('upsizing_area') else (K('upgrade_galvanized') if e_full_called and
      e_line == 'water_service_line' and F('service_line_material') == 'galvanized_steel' and e_area < K('upsizing_area')
      else (K('upgrade_standard') if e_full_called and e_line == 'water_service_line' and F('service_line_material')
      != 'galvanized_steel' else 0.0))
  - e_util_paid: SUM('lineplan_billing_entries', 'amount', within_months=K('partner_window_months'), date_field='entry_date',
      event_type='lineplan_premium_payment', payment_method='utility_bill')
  - e_cofund: K('cofund_lakeshore') if e_full_called and e_line == 'water_service_line' and F('partner_utility')
      == 'Lakeshore Water Authority' and e_util_paid > 0 else (K('cofund_riverbend') if e_full_called and e_line
      == 'water_service_line' and F('partner_utility') == 'Riverbend Municipal Utilities' and e_util_paid > 0 else
      0.0)
  - e_month: MONTHS('2000-01-01', e_date) % 12
  - e_zip3: int(F('property_zip')) // 100
  - e_frost: K('frost_winter') if (e_month == 11 or e_month <= 2) and (e_zip3 == 5 or (e_zip3 >= 10 and e_zip3 <=
      69) or (e_zip3 >= 100 and e_zip3 <= 149) or (e_zip3 >= 480 and e_zip3 <= 629) or (e_zip3 >= 680 and e_zip3
      <= 693) or (e_zip3 >= 800 and e_zip3 <= 831) or (e_zip3 >= 995 and e_zip3 <= 999)) else (K('frost_shoulder')
      if (e_month == 10 or e_month == 3) and (e_zip3 == 5 or (e_zip3 >= 10 and e_zip3 <= 69) or (e_zip3 >= 100 and
      e_zip3 <= 149) or (e_zip3 >= 480 and e_zip3 <= 629) or (e_zip3 >= 680 and e_zip3 <= 693) or (e_zip3 >= 800
      and e_zip3 <= 831) or (e_zip3 >= 995 and e_zip3 <= 999)) else 0.0)
  - e_commission: K('commission_water') if e_full_called and e_line == 'water_service_line' else (K('commission_sewer')
      if e_full_called and e_line == 'sewer_lateral' else 0.0)
  - result: RND(e_open + e_restored + e_material + e_cofund + e_frost + e_commission, 2)
