  factors:
  - id: pw_recall_offset
    effect: method
    decides: w_after_offset
    bindings:
    - w_orig_pw
    - w_temp_pw
    - w_after_offset
    ladder:
    - when: a recall reported no later than the plan's repair guarantee days after the most recent completed repair
        on the same line
      method: the public-way restoration figure less the public-way restoration payments already authorized on the
        request of that completed repair, never below zero
    - when: a new failure reported no more than the public-way continuation days after a temporary repair was authorized
        on another request for the same line
      method: the public-way restoration figure less the public-way restoration payments already authorized on that
        temporary-repair request, never below zero
    - when: otherwise
      method: the public-way restoration figure in full
    baseline:
      w_after_offset: w_figure
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pw_scope_rate
    effect: parameter
    decides: w_scope_rate
    bindings:
    - w_full_called
    - w_scope_rate
    ladder:
    - when: whole lines are replaced after repeat breaks on the plan AND the most recent completed repair on the
        same line falls within the replacement lookback days before the request
      value: K('scope_rate_whole')
    - when: a recall where those two conditions do not both hold
      value: K('scope_rate_reopen')
    - when: otherwise
      value: '1.0'
    baseline:
      w_scope_rate: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pw_partner_schedule
    effect: parameter
    decides: w_partner_rate
    bindings:
    - w_util_paid
    - w_partner_rate
    ladder:
    - when: enrolled through Lakeshore Water Authority AND premium remitted through that utility's bill within the
        public-way partner window
      value: K('partner_rate_lakeshore')
    - when: enrolled through Riverbend Municipal Utilities AND premium remitted through that utility's bill within
        the public-way partner window
      value: K('partner_rate_riverbend')
    - when: otherwise
      value: '1.0'
    baseline:
      w_partner_rate: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: pw_plating_addition
    effect: parameter
    decides: w_plating
    bindings:
    - w_urg
    - w_temp_here
    - w_plating
    ladder:
    - when: an emergency request AND a temporary repair has been authorized on it
      value: K('plating_add_plated')
    - when: an emergency request AND no temporary repair has been authorized on it
      value: K('plating_add_patched')
    - when: otherwise
      value: '0.0'
    baseline:
      w_plating: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: pw_cold_weather_addition
    effect: parameter
    decides: w_cold
    bindings:
    - w_zip3
    - w_month
    - w_cold
    ladder:
    - when: a property in the frost territory AND the request was placed in December, January, February or March
      value: K('cold_add_winter')
    - when: a property in the frost territory AND the request was placed in November or April
      value: K('cold_add_shoulder')
    - when: otherwise
      value: '0.0'
    baseline:
      w_cold: '0.0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: 'The public-way restoration payment is figured once per service request, on the day it is booked and from
      the plan''s records as they stand that day; periods said to run to the request date end on the service request''s
      request date. The standard public-way restoration payment is the plan''s public way restoration allowance
      as a flat amount, whatever the restoration crew charges. The public-way restoration payment is never more
      than the occurrence benefit still open, which is the plan''s occurrence cap for the line (the water line occurrence
      cap for a water service line, the sewer line occurrence cap for a sewer lateral, the gas line occurrence cap
      for a gas service line) less every amount already authorized, net of reversals, on the service request and
      on the earlier request whose occurrence it belongs to: for a recall reported no later than the plan''s repair
      guarantee days after the most recent completed repair on the same line, the request of that completed repair,
      and for a new failure reported no more than the public-way continuation days after a temporary repair was
      authorized on another request for the same line, that temporary-repair request. The public-way restoration
      payment is rounded to the cent once, at the end.'
    params:
    - public_way_restoration_allowance
    - water_line_occurrence_cap
    - sewer_line_occurrence_cap
    - gas_line_occurrence_cap
    - repair_guarantee_days
  inputs:
    history:
    - table: lineplan_service_requests
      aggregate: latest
      field: request_date
      filters: {}
    - table: lineplan_claim_events
      aggregate: latest
      field: event_date
      filters:
        event_type: lineplan_work_completion
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: lineplan_repair_authorization
        allowance_type: public_way_restoration
    - table: lineplan_claim_events
      aggregate: count
      field: lineplan_claim_event_id
      filters:
        event_type: lineplan_repair_authorization
        resolution_type: temporary_repair
    - table: lineplan_billing_entries
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: lineplan_premium_payment
        payment_method: utility_bill
    cross_category: []
- id: lineplan_ext_lawn_restoration_payment
  base_policy_refs:
  - lineplan_evt_repair_authorization
  overwrite:
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: Each authorization pays the lower of its invoice_amount and the remaining occurrence benefit;
      the customer may pay the contractor for work beyond the cap or decline it.
    replaced_by: For a landscaping restoration allowance this policy sets the amount paid as stated here, and only
      for such an allowance; every other authorization remains under the base rule that it pays the lower of its
      invoice amount and the remaining occurrence benefit.
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: 'Restoration allowances are paid inside the occurrence cap, never in addition to it: public_way_restoration_allowance
      for a public sidewalk, curb or street, landscaping_restoration_allowance for basic lawn restoration, slab_access_allowance
      for access through a slab, and permits, camera inspection and cleanout installation where permit_fee_covered,
      camera_inspection_covered and cleanout_installation_covered are true.'
    replaced_by: For basic lawn restoration this policy pays the lawn restoration payment worked out here in place
      of the bare landscaping restoration allowance, still inside the occurrence cap, and only for such restoration;
      every other restoration allowance remains under the base rule.
  trigger: on_request
  subject:
  - lineplan_repair_authorization
  computes: payment_amount
  target_tool: authorize_lawn_restoration_4590e15f
  params:
    continuation_days: 14
    excavation_rate_whole: 2.0
    excavation_rate_redig: 0.5
    season_rate_dormant: 1.3
    season_rate_late: 1.15
    partner_window_months: 12
    partner_rate_lakeshore: 1.1
    partner_rate_riverbend: 1.05
    backfill_add_second: 60.0
    backfill_add_single: 30.0
  rule: 'The lawn restoration payment is the allowance Bridgewell authorizes on a covered exterior water service
    line, sewer lateral, septic line, electrical service line or gas service line service request toward backfilling,
    seeding and strawing the yard that open-trench permanent work digs up, booked as one allowance authorization
    of type landscaping restoration. The lawn restoration payment is figured once per service request, on the day
    it is booked and from the plan''s records as they stand that day; periods said to run to the request date end
    on the service request''s request date. The standard lawn restoration payment is the plan''s landscaping restoration
    allowance as a flat amount, whatever the landscaper charges. The lawn restoration payment is never more than
    the occurrence benefit still open, which is the plan''s occurrence cap for the line (the water line occurrence
    cap for a water service line, the sewer line occurrence cap for a sewer lateral or a septic line, the electrical
    line occurrence cap for an electrical service line, the gas line occurrence cap for a gas service line) less
    every amount already authorized, net of reversals, on the service request and on the earlier request whose occurrence
    it belongs to: for a recall reported no later than the plan''s repair guarantee days after the most recent completed
    repair on the same line, the request of that completed repair, and for a new failure reported no more than the
    lawn continuation days after a temporary repair was authorized on another request for the same line, that temporary-repair
    request. The lawn restoration payment is rounded to the cent once, at the end. The lawn restoration figure is
    the plan''s landscaping restoration allowance multiplied first by the lawn excavation rate, then by the lawn
    season rate and then by the lawn partner schedule rate, with the lawn backfill addition then added; the lawn
    recall offset acts on that figure, and the occurrence benefit still open limits the result last. Lawn excavation
    rate: where the plan replaces whole lines after repeat breaks, which is when its full replacement break count
    is above zero, and the most recent completed repair on the same line was completed no more than the plan''s
    replacement lookback days before the request date, the lawn restoration figure takes the whole-run lawn rate,
    because the trench follows the whole line across the yard; for a recall where those two conditions do not both
    hold, it takes the re-dig lawn rate; every other request takes a lawn excavation rate of one. A property is
    in the frost territory when it lies in a state whose plumbing code sets a design frost depth of at least 36
    inches for buried water lines across most of the state, because there the soil over a service line freezes deep
    enough in winter that excavation must break frozen ground: Alaska, Colorado, Connecticut, Illinois, Iowa, Maine,
    Massachusetts, Michigan, Minnesota, Montana, Nebraska, New Hampshire, New York, North Dakota, Rhode Island,
    South Dakota, Vermont, Wisconsin and Wyoming. The state is read from the first three digits of the ZIP code
    recorded for the property on the plan: 005, 010 through 069, 100 through 149, 480 through 629, 680 through 693,
    800 through 831 and 995 through 999 are the frost territory, and every other ZIP code is outside it. Lawn season
    rate: on a property in the frost territory, a request placed in December, January, February or March takes the
    dormant-season lawn rate, because the yard is sodded or covered with an erosion blanket now and overseeded in
    spring, and a request placed in November or April takes the late-season lawn rate, for heavier straw cover on
    seed that germinates slowly; a request on a property outside the frost territory, or placed in any other month,
    takes a lawn season rate of one. Lawn backfill addition: an emergency request on which a temporary repair has
    been authorized adds the second-backfill lawn addition, because the emergency hole is backfilled once before
    the permanent dig; an emergency request with no temporary repair authorized on it adds the single-backfill lawn
    addition; every other request adds no lawn backfill addition. Lawn recall offset: for a recall reported no later
    than the plan''s repair guarantee days after the most recent completed repair on the same line, the lawn restoration
    payment is the lawn restoration figure less the lawn restoration payments already authorized on the request
    of that completed repair, never below zero; for a new failure reported no more than the lawn continuation days
    after a temporary repair was authorized on another request for the same line, the lawn restoration payment is
    the lawn restoration figure less the lawn restoration payments already authorized on that temporary-repair request,
    never below zero; every other lawn restoration payment is the lawn restoration figure in full. Lawn partner
    schedule rate: a plan enrolled through Lakeshore Water Authority whose premium has been remitted through that
    utility''s bill within the lawn partner window takes the Lakeshore lawn rate; a plan enrolled through Riverbend
    Municipal Utilities whose premium has been remitted through that utility''s bill within the lawn partner window
    takes the Riverbend lawn rate; every other plan takes a lawn partner schedule rate of one. Lawn windows counted
    in months run back from the day the payment is booked: an entry falls within a lawn window when fewer whole
    months than the window separate its posting date from that day. For a landscaping restoration allowance this
    policy sets the amount paid as stated here, and only for such an allowance; every other authorization remains
    under the base rule that it pays the lower of its invoice amount and the remaining occurrence benefit. For basic
    lawn restoration this policy pays the lawn restoration payment worked out here in place of the bare landscaping
    restoration allowance, still inside the occurrence cap, and only for such restoration; every other restoration
    allowance remains under the base rule.'
  prerequisite: []
  cross_category: []
  compute:
  - l_req: LATEST('lineplan_service_requests', 'lineplan_service_request_id', date_field='request_date')
  - l_date: LATEST('lineplan_service_requests', 'request_date', date_field='request_date')
  - l_type: LATEST('lineplan_service_requests', 'request_type', date_field='request_date')
  - l_line: LATEST('lineplan_service_requests', 'line_type', date_field='request_date')
  - l_orig: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_work_completion',
      line_type=l_line)
  - l_orig_done: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_work_completion',
      line_type=l_line)
  - l_is_recall: l_type == 'recall' and l_orig_done != None and DAYS(l_orig_done, l_date) <= P('repair_guarantee_days')
  - l_temp_req: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=l_line)
  - l_temp_date: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=l_line)
  - l_is_cont: l_type == 'new_failure' and l_temp_date != None and l_temp_req != l_req and DAYS(l_temp_date, l_date)
      <= K('continuation_days')
  - l_full_called: P('full_replacement_break_count') > 0 and l_orig_done != None and DAYS(l_orig_done, l_date) <=
      P('replacement_lookback_days')
  - l_exc_rate: K('excavation_rate_whole') if l_full_called else (K('excavation_rate_redig') if l_type == 'recall'
      and not l_full_called else 1.0)
  - l_month: MONTHS('2000-01-01', l_date) % 12
  - l_zip3: int(F('property_zip')) // 100
  - l_season_rate: K('season_rate_dormant') if (l_month == 11 or l_month <= 2) and (l_zip3 == 5 or (l_zip3 >= 10
      and l_zip3 <= 69) or (l_zip3 >= 100 and l_zip3 <= 149) or (l_zip3 >= 480 and l_zip3 <= 629) or (l_zip3 >=
      680 and l_zip3 <= 693) or (l_zip3 >= 800 and l_zip3 <= 831) or (l_zip3 >= 995 and l_zip3 <= 999)) else (K('season_rate_late')
      if (l_month == 10 or l_month == 3) and (l_zip3 == 5 or (l_zip3 >= 10 and l_zip3 <= 69) or (l_zip3 >= 100 and
      l_zip3 <= 149) or (l_zip3 >= 480 and l_zip3 <= 629) or (l_zip3 >= 680 and l_zip3 <= 693) or (l_zip3 >= 800
      and l_zip3 <= 831) or (l_zip3 >= 995 and l_zip3 <= 999)) else 1.0)
  - l_util_paid: SUM('lineplan_billing_entries', 'amount', within_months=K('partner_window_months'), date_field='entry_date',
      event_type='lineplan_premium_payment', payment_method='utility_bill')
  - l_partner_rate: K('partner_rate_lakeshore') if F('partner_utility') == 'Lakeshore Water Authority' and l_util_paid
      > 0 else (K('partner_rate_riverbend') if F('partner_utility') == 'Riverbend Municipal Utilities' and l_util_paid
      > 0 else 1.0)
  - l_urg: LATEST('lineplan_service_requests', 'urgency', date_field='request_date')
  - l_temp_here: COUNT('lineplan_claim_events', event_type='lineplan_repair_authorization', resolution_type='temporary_repair',
      lineplan_service_request_id=l_req)
  - l_backfill: K('backfill_add_second') if l_urg == 'emergency' and l_temp_here > 0 else (K('backfill_add_single')
      if l_urg == 'emergency' and l_temp_here == 0 else 0.0)
  - l_figure: P('landscaping_restoration_allowance') * l_exc_rate * l_season_rate * l_partner_rate + l_backfill
  - l_orig_lawn: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', allowance_type='landscaping_restoration',
      lineplan_service_request_id=l_orig)
  - l_temp_lawn: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', allowance_type='landscaping_restoration',
      lineplan_service_request_id=l_temp_req)
  - l_after_offset: MX(0, l_figure - l_orig_lawn) if l_is_recall else (MX(0, l_figure - l_temp_lawn) if l_is_cont
      else l_figure)
  - l_this_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=l_req)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=l_req)
  - l_link_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=(l_orig
      if l_is_recall else (l_temp_req if l_is_cont else ''))) - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal',
      lineplan_service_request_id=(l_orig if l_is_recall else (l_temp_req if l_is_cont else '')))
  - l_cap: P('water_line_occurrence_cap') if l_line == 'water_service_line' else (P('sewer_line_occurrence_cap')
      if l_line == 'sewer_lateral' or l_line == 'septic_line' else (P('electrical_line_occurrence_cap') if l_line
      == 'electrical_service_line' else (P('gas_line_occurrence_cap') if l_line == 'gas_service_line' else 0.0)))
  - l_open: MX(0, l_cap - l_this_net - l_link_net)
  - result: RND(MN(l_after_offset, l_open), 2)
