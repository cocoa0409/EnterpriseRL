      after the most recent completed repair on the same line, the public-way restoration payment is the public-way
      restoration figure less the public-way restoration payments already authorized on the request of that completed
      repair, never below zero; for a new failure reported no more than the public-way continuation days after a
      temporary repair was authorized on another request for the same line, the public-way restoration payment is
      the public-way restoration figure less the public-way restoration payments already authorized on that temporary-repair
      request, never below zero; every other public-way restoration payment is the public-way restoration figure
      in full.'
    w_temp_pw: 'Public-way recall offset: for a recall reported no later than the plan''s repair guarantee days
