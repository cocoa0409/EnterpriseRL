    - when: a recall reported no later than the plan's repair guarantee days after the most recent completed repair
        on the same line
      method: the slab access figure less the slab access payments already authorized on the request of that completed
        repair, never below zero
    - when: a new failure reported no more than the slab continuation days after a temporary repair was authorized
