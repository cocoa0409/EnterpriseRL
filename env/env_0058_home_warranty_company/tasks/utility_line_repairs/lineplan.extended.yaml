    w_urg: 'Public-way plating addition: an emergency request on which a temporary repair has been authorized adds
      the plated public-way addition, for the steel plating and cold patch that hold the opening until the permanent
      restoration; an emergency request with no temporary repair authorized on it adds the patched public-way addition;
      every other request adds no public-way plating addition.'
    w_temp_here: 'Public-way plating addition: an emergency request on which a temporary repair has been authorized
      adds the plated public-way addition, for the steel plating and cold patch that hold the opening until the
      permanent restoration; an emergency request with no temporary repair authorized on it adds the patched public-way
      addition; every other request adds no public-way plating addition.'
    w_plating: 'Public-way plating addition: an emergency request on which a temporary repair has been authorized
      adds the plated public-way addition, for the steel plating and cold patch that hold the opening until the
      permanent restoration; an emergency request with no temporary repair authorized on it adds the patched public-way
      addition; every other request adds no public-way plating addition.'
    w_month: 'Public-way cold-weather addition: on a property in the frost territory, a request placed in December,
      January, February or March adds the winter public-way addition, for the temporary asphalt patch that holds
      a winter cut until concrete can be poured in spring, and a request placed in November or April adds the shoulder-season
      public-way addition, for cold-weather concrete protection; a request on a property outside the frost territory,
      or placed in any other month, adds no cold-weather addition.'
    w_cold: 'A property is in the frost territory when it lies in a state whose plumbing code sets a design frost
      depth of at least 36 inches for buried water lines across most of the state, because there the soil over a
      service line freezes deep enough in winter that excavation must break frozen ground: Alaska, Colorado, Connecticut,
      Illinois, Iowa, Maine, Massachusetts, Michigan, Minnesota, Montana, Nebraska, New Hampshire, New York, North
      Dakota, Rhode Island, South Dakota, Vermont, Wisconsin and Wyoming. The state is read from the first three
      digits of the ZIP code recorded for the property on the plan: 005, 010 through 069, 100 through 149, 480 through
      629, 680 through 693, 800 through 831 and 995 through 999 are the frost territory, and every other ZIP code
      is outside it. Public-way cold-weather addition: on a property in the frost territory, a request placed in
