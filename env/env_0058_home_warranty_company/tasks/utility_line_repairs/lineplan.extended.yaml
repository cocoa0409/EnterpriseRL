extended_policies:
- id: lineplan_ext_slab_access_payment
  base_policy_refs:
  - lineplan_evt_repair_authorization
  overwrite:
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: Each authorization pays the lower of its invoice_amount and the remaining occurrence benefit;
      the customer may pay the contractor for work beyond the cap or decline it.
    replaced_by: For a slab access allowance this policy sets the amount paid as stated here, and only for such
      an allowance; every other authorization remains under the base rule that it pays the lower of its invoice
      amount and the remaining occurrence benefit.
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: 'Restoration allowances are paid inside the occurrence cap, never in addition to it: public_way_restoration_allowance
      for a public sidewalk, curb or street, landscaping_restoration_allowance for basic lawn restoration, slab_access_allowance
      for access through a slab, and permits, camera inspection and cleanout installation where permit_fee_covered,
      camera_inspection_covered and cleanout_installation_covered are true.'
    replaced_by: For access through a slab this policy pays the slab access payment worked out here in place of
      the bare slab access allowance, still inside the occurrence cap, and only for such access; every other restoration
      allowance remains under the base rule.
  trigger: on_request
  subject:
  - lineplan_repair_authorization
  computes: payment_amount
  target_tool: authorize_slab_access_payment_bcc8b3fe
  params:
    continuation_days: 14
    open_rate_drain: 1.4
    open_rate_attached: 1.2
    cut_add_same_day: 200.0
    cut_add_next_day: 100.0
    partner_window_months: 12
    partner_rate_prairie: 1.15
    partner_rate_tricounty: 1.1
  rule: 'The slab access payment is the allowance Bridgewell authorizes on a covered interior supply or drain line
    service request toward opening and closing the concrete slab or foundation above the failed line, booked as
    one allowance authorization of type slab access. The slab access payment is figured once per service request,
    on the day it is booked and from the plan''s records as they stand that day; periods said to run to the request
    date end on the service request''s request date. The standard slab access payment is the plan''s slab access
    allowance as a flat amount, whatever the contractor charges for the opening. The slab access payment is never
    more than the interior occurrence benefit still open, which is the plan''s interior plumbing occurrence cap
    less every amount already authorized, net of reversals, on the service request and on the earlier request whose
    occurrence it belongs to: for a recall reported no later than the plan''s repair guarantee days after the most
    recent completed repair on the same line, the request of that completed repair, and for a new failure reported
    no more than the slab continuation days after a temporary repair was authorized on another request for the same
    line, that temporary-repair request. The slab access payment is rounded to the cent once, at the end. The slab
    access figure is the plan''s slab access allowance multiplied first by the slab opening rate and then by the
    slab partner schedule rate, with the slab cutting addition then added; the slab recall offset acts on that figure,
    and the interior occurrence benefit still open limits the result last. A drain line lies deeper beneath the
    slab than a supply line, and the slab of an attached home is shared with the neighbouring unit and is cut only
    after the party-wall side has been scanned. Slab opening rate: a slab access payment on an interior drain line
    takes the drain slab opening rate; a slab access payment on an interior supply line of a property recorded on
    the plan as a townhome or a duplex takes the attached-home slab opening rate; every other slab access payment
    takes a slab opening rate of one. Concrete cutting crews called out on the day an active leak is reported charge
    an emergency callout premium, and a crew called out the next day for a leak that is still running charges a
    smaller emergency premium. Slab cutting addition: an emergency request whose first contractor assignment was
    made on the request date adds the same-day slab cutting addition; an emergency request whose first contractor
    assignment was made on a later day adds the next-day slab cutting addition; every other request adds no slab
    cutting addition. Slab recall offset: for a recall reported no later than the plan''s repair guarantee days
    after the most recent completed repair on the same line, the slab access payment is the slab access figure less
    the slab access payments already authorized on the request of that completed repair, never below zero; for a
    new failure reported no more than the slab continuation days after a temporary repair was authorized on another
    request for the same line, the slab access payment is the slab access figure less the slab access payments already
    authorized on that temporary-repair request, never below zero; every other slab access payment is the slab access
    figure in full. Slab partner schedule rate: a plan enrolled through Prairie Gas and Light whose premium has
    been remitted through that utility''s bill within the slab partner window takes the Prairie slab rate; a plan
    enrolled through Tri-County Electric Cooperative whose premium has been remitted through that utility''s bill
    within the slab partner window takes the Tri-County slab rate; every other plan takes a slab partner schedule
    rate of one. Slab windows counted in months run back from the day the payment is booked: an entry falls within
    a slab window when fewer whole months than the window separate its posting date from that day. For a slab access
    allowance this policy sets the amount paid as stated here, and only for such an allowance; every other authorization
    remains under the base rule that it pays the lower of its invoice amount and the remaining occurrence benefit.
    For access through a slab this policy pays the slab access payment worked out here in place of the bare slab
    access allowance, still inside the occurrence cap, and only for such access; every other restoration allowance
    remains under the base rule.'
  prerequisite: []
  cross_category: []
  compute:
  - s_req: LATEST('lineplan_service_requests', 'lineplan_service_request_id', date_field='request_date')
  - s_date: LATEST('lineplan_service_requests', 'request_date', date_field='request_date')
  - s_type: LATEST('lineplan_service_requests', 'request_type', date_field='request_date')
  - s_line: LATEST('lineplan_service_requests', 'line_type', date_field='request_date')
  - s_orig: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_work_completion',
      line_type=s_line)
  - s_orig_done: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_work_completion',
      line_type=s_line)
  - s_is_recall: s_type == 'recall' and s_orig_done != None and DAYS(s_orig_done, s_date) <= P('repair_guarantee_days')
  - s_temp_req: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=s_line)
  - s_temp_date: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=s_line)
  - s_is_cont: s_type == 'new_failure' and s_temp_date != None and s_temp_req != s_req and DAYS(s_temp_date, s_date)
      <= K('continuation_days')
  - s_open_rate: K('open_rate_drain') if s_line == 'interior_drain_line' else (K('open_rate_attached') if s_line
      == 'interior_supply_line' and (F('property_type') == 'townhome' or F('property_type') == 'duplex') else 1.0)
  - s_urg: LATEST('lineplan_service_requests', 'urgency', date_field='request_date')
  - s_disp_date: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_contractor_dispatch',
      dispatch_sequence=1, lineplan_service_request_id=s_req)
  - s_cut_add: K('cut_add_same_day') if s_urg == 'emergency' and s_disp_date != None and DAYS(s_date, s_disp_date)
      == 0 else (K('cut_add_next_day') if s_urg == 'emergency' and s_disp_date != None and DAYS(s_date, s_disp_date)
      > 0 else 0.0)
  - s_util_paid: SUM('lineplan_billing_entries', 'amount', within_months=K('partner_window_months'), date_field='entry_date',
      event_type='lineplan_premium_payment', payment_method='utility_bill')
  - s_partner_rate: K('partner_rate_prairie') if F('partner_utility') == 'Prairie Gas and Light' and s_util_paid
      > 0 else (K('partner_rate_tricounty') if F('partner_utility') == 'Tri-County Electric Cooperative' and s_util_paid
      > 0 else 1.0)
  - s_figure: P('slab_access_allowance') * s_open_rate * s_partner_rate + s_cut_add
  - s_orig_slab: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', allowance_type='slab_access',
      lineplan_service_request_id=s_orig)
  - s_temp_slab: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', allowance_type='slab_access',
      lineplan_service_request_id=s_temp_req)
  - s_after_offset: MX(0, s_figure - s_orig_slab) if s_is_recall else (MX(0, s_figure - s_temp_slab) if s_is_cont
      else s_figure)
  - s_this_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=s_req)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=s_req)
  - s_link_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=(s_orig
      if s_is_recall else (s_temp_req if s_is_cont else ''))) - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal',
      lineplan_service_request_id=(s_orig if s_is_recall else (s_temp_req if s_is_cont else '')))
  - s_open: MX(0, P('interior_plumbing_occurrence_cap') - s_this_net - s_link_net)
  - result: RND(MN(s_after_offset, s_open), 2)
  compute_basis:
    s_req: The slab access payment is figured once per service request, on the day it is booked and from the plan's
