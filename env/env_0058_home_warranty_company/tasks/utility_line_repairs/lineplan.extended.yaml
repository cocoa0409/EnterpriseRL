- id: lineplan_evt_repair_authorization
  subject:
  - lineplan_repair_authorization
  - lineplan_authorization_reversal
  - lineplan_work_completion
  rule: 'Line work is authorized only after a covered determination is on file for the service request. Each occurrence
    is paid up to the plan''s occurrence cap for the line type (occurrence_cap), counted by lineplan_msr_occurrence_benefit_paid,
    and occurrences are not limited in number. The contractor repairs the failed section, except that the whole
    line from the connection point to the home is replaced when full_replacement_break_count is above 0 and lineplan_msr_prior_breaks_in_lookback
    is at or above full_replacement_break_count minus 1. Trenchless methods are used only when trenchless_method_allowed
    is true and cost no more than open trenching. When emergency_temporary_repair_covered is true, a temporary repair
    to restore service is authorized first and counts toward the same occurrence. Restoration allowances are paid
    inside the occurrence cap, never in addition to it: public_way_restoration_allowance for a public sidewalk,
    curb or street, landscaping_restoration_allowance for basic lawn restoration, slab_access_allowance for access
    through a slab, and permits, camera inspection and cleanout installation where permit_fee_covered, camera_inspection_covered
    and cleanout_installation_covered are true. Private driveways and patios are restored only when hardscape_restoration_covered
    is true. Each authorization pays the lower of its invoice_amount and the remaining occurrence benefit; the customer
    may pay the contractor for work beyond the cap or decline it. A recall is paid under the original occurrence
    and its remaining benefit. An authorization is reversed in full when the work will not be performed and never
    after completion. The completion report starts the repair guarantee.'
