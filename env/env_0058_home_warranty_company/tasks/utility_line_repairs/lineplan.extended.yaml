- id: lineplan_ext_public_way_payment
  base_policy_refs:
  - lineplan_evt_repair_authorization
  overwrite:
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: Each authorization pays the lower of its invoice_amount and the remaining occurrence benefit;
      the customer may pay the contractor for work beyond the cap or decline it.
    replaced_by: For a public way restoration allowance this policy sets the amount paid as stated here, and only
      for such an allowance; every other authorization remains under the base rule that it pays the lower of its
      invoice amount and the remaining occurrence benefit.
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: 'Restoration allowances are paid inside the occurrence cap, never in addition to it: public_way_restoration_allowance
      for a public sidewalk, curb or street, landscaping_restoration_allowance for basic lawn restoration, slab_access_allowance
      for access through a slab, and permits, camera inspection and cleanout installation where permit_fee_covered,
      camera_inspection_covered and cleanout_installation_covered are true.'
    replaced_by: For a public sidewalk, curb or street this policy pays the public-way restoration payment worked
      out here in place of the bare public way restoration allowance, still inside the occurrence cap, and only
      for such restoration; every other restoration allowance remains under the base rule.
  trigger: on_request
  subject:
  - lineplan_repair_authorization
  computes: payment_amount
  target_tool: authorize_public_way_restoration_c5bbe6ee
  params:
    continuation_days: 14
    scope_rate_whole: 1.25
    scope_rate_reopen: 0.5
    partner_window_months: 12
    partner_rate_lakeshore: 1.1
    partner_rate_riverbend: 1.05
    plating_add_plated: 250.0
    plating_add_patched: 125.0
    cold_add_winter: 300.0
    cold_add_shoulder: 150.0
  rule: 'The public-way restoration payment is the allowance Bridgewell authorizes on a covered exterior water service
    line, sewer lateral or gas service line service request toward cutting and restoring a public sidewalk, curb
    or street that the permanent work opens, booked as one allowance authorization of type public way restoration;
    a whole-line replacement always opens the public way, because it starts at the connection point. The public-way
    restoration payment is figured once per service request, on the day it is booked and from the plan''s records
    as they stand that day; periods said to run to the request date end on the service request''s request date.
    The standard public-way restoration payment is the plan''s public way restoration allowance as a flat amount,
    whatever the restoration crew charges. The public-way restoration payment is never more than the occurrence
    benefit still open, which is the plan''s occurrence cap for the line (the water line occurrence cap for a water
    service line, the sewer line occurrence cap for a sewer lateral, the gas line occurrence cap for a gas service
    line) less every amount already authorized, net of reversals, on the service request and on the earlier request
    whose occurrence it belongs to: for a recall reported no later than the plan''s repair guarantee days after
    the most recent completed repair on the same line, the request of that completed repair, and for a new failure
    reported no more than the public-way continuation days after a temporary repair was authorized on another request
    for the same line, that temporary-repair request. The public-way restoration payment is rounded to the cent
    once, at the end. The public-way restoration figure is the plan''s public way restoration allowance multiplied
    first by the public-way scope rate and then by the public-way partner schedule rate, with the public-way plating
    addition and the public-way cold-weather addition then added; the public-way recall offset acts on that figure,
    and the occurrence benefit still open limits the result last. Public-way scope rate: where the plan replaces
    whole lines after repeat breaks, which is when its full replacement break count is above zero, and the most
    recent completed repair on the same line was completed no more than the plan''s replacement lookback days before
    the request date, the public-way restoration figure takes the whole-line public-way rate; for a recall where
    those two conditions do not both hold, it takes the re-opening public-way rate; every other request takes a
    public-way scope rate of one. Public-way plating addition: an emergency request on which a temporary repair
    has been authorized adds the plated public-way addition, for the steel plating and cold patch that hold the
    opening until the permanent restoration; an emergency request with no temporary repair authorized on it adds
    the patched public-way addition; every other request adds no public-way plating addition. A property is in the
    frost territory when it lies in a state whose plumbing code sets a design frost depth of at least 36 inches
    for buried water lines across most of the state, because there the soil over a service line freezes deep enough
    in winter that excavation must break frozen ground: Alaska, Colorado, Connecticut, Illinois, Iowa, Maine, Massachusetts,
    Michigan, Minnesota, Montana, Nebraska, New Hampshire, New York, North Dakota, Rhode Island, South Dakota, Vermont,
    Wisconsin and Wyoming. The state is read from the first three digits of the ZIP code recorded for the property
    on the plan: 005, 010 through 069, 100 through 149, 480 through 629, 680 through 693, 800 through 831 and 995
    through 999 are the frost territory, and every other ZIP code is outside it. Public-way cold-weather addition:
    on a property in the frost territory, a request placed in December, January, February or March adds the winter
    public-way addition, for the temporary asphalt patch that holds a winter cut until concrete can be poured in
    spring, and a request placed in November or April adds the shoulder-season public-way addition, for cold-weather
    concrete protection; a request on a property outside the frost territory, or placed in any other month, adds
    no cold-weather addition. Public-way recall offset: for a recall reported no later than the plan''s repair guarantee
    days after the most recent completed repair on the same line, the public-way restoration payment is the public-way
    restoration figure less the public-way restoration payments already authorized on the request of that completed
    repair, never below zero; for a new failure reported no more than the public-way continuation days after a temporary
    repair was authorized on another request for the same line, the public-way restoration payment is the public-way
    restoration figure less the public-way restoration payments already authorized on that temporary-repair request,
    never below zero; every other public-way restoration payment is the public-way restoration figure in full. Public-way
    partner schedule rate: a plan enrolled through Lakeshore Water Authority whose premium has been remitted through
    that utility''s bill within the public-way partner window takes the Lakeshore public-way rate; a plan enrolled
    through Riverbend Municipal Utilities whose premium has been remitted through that utility''s bill within the
    public-way partner window takes the Riverbend public-way rate; every other plan takes a public-way partner schedule
    rate of one. Public-way windows counted in months run back from the day the payment is booked: an entry falls
    within a public-way window when fewer whole months than the window separate its posting date from that day.
    For a public way restoration allowance this policy sets the amount paid as stated here, and only for such an
    allowance; every other authorization remains under the base rule that it pays the lower of its invoice amount
    and the remaining occurrence benefit. For a public sidewalk, curb or street this policy pays the public-way
    restoration payment worked out here in place of the bare public way restoration allowance, still inside the
    occurrence cap, and only for such restoration; every other restoration allowance remains under the base rule.'
