    w_full_called: 'Public-way scope rate: where the plan replaces whole lines after repeat breaks, which is when
      its full replacement break count is above zero, and the most recent completed repair on the same line was
      completed no more than the plan''s replacement lookback days before the request date, the public-way restoration
      figure takes the whole-line public-way rate; for a recall where those two conditions do not both hold, it
      takes the re-opening public-way rate; every other request takes a public-way scope rate of one.'
    w_scope_rate: 'Public-way scope rate: where the plan replaces whole lines after repeat breaks, which is when
      its full replacement break count is above zero, and the most recent completed repair on the same line was
      completed no more than the plan''s replacement lookback days before the request date, the public-way restoration
      figure takes the whole-line public-way rate; for a recall where those two conditions do not both hold, it
