- id: lineplan_evt_line_determination
  subject:
  - lineplan_line_determination
  rule: 'One determination is issued per line service request. A line failure is covered only when every condition
    below holds, and otherwise is not_covered with the first failing reason in this order. (1) contract_not_in_force:
    the plan was active on the request date. (2) waiting_period: the failure was first reported on or after coverage_effective_date.
    (3) line_not_in_plan: the line type is in covered_line_types and its occurrence cap is above 0.00, a septic
    line only when septic_line_covered is true and a well line only when well_line_covered is true. (4) utility_owned_side:
    the failure is on the homeowner''s side of the connection point (failure_location homeowner_side); a utility-side
    failure is referred to the utility. (5) utility_mandated_work: work ordered by the utility or a government program
    is covered only when utility_mandated_work_covered is true, and replacing a lead service line only when lead_line_replacement_covered
    is true. (6) preexisting_condition: a failure that began before coverage_effective_date is never covered. (7)
    third_party_damage: damage by digging, construction or a third party is never covered. (8) excluded_condition:
    the failure is not one of the plan''s excluded_conditions, freezing is covered only when frozen_line_covered
    is true and tree roots only when tree_root_damage_covered is true.'
