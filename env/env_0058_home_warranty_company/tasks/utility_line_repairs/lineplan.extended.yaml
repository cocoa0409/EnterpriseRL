      request only the amounts on the service request are deducted.'
    e_this_net: 'The standard exterior permanent-work payment is the exterior occurrence benefit left open on the
      service request: the plan''s occurrence cap for the line (the water line occurrence cap for a water service
      line, the sewer line occurrence cap for a sewer lateral or a septic line, the electrical line occurrence cap
      for an electrical service line, the gas line occurrence cap for a gas service line) less every amount already
      authorized on the service request, net of reversals, never below zero.'
    e_orig_net: 'Exterior occurrence scope: for a recall reported no later than the plan''s repair guarantee days
      after the most recent completed repair on the same line, the amounts already authorized, net of reversals,
      on the request of that completed repair are deducted from the line''s occurrence cap together with those on
      the service request; for a new failure reported no more than the exterior continuation days after a temporary
      repair was authorized on another request for the same line, the amounts already authorized, net of reversals,
      on that temporary-repair request are deducted together with those on the service request; for every other
      request only the amounts on the service request are deducted.'
    e_temp_net: 'Exterior occurrence scope: for a recall reported no later than the plan''s repair guarantee days
      after the most recent completed repair on the same line, the amounts already authorized, net of reversals,
      on the request of that completed repair are deducted from the line''s occurrence cap together with those on
      the service request; for a new failure reported no more than the exterior continuation days after a temporary
      repair was authorized on another request for the same line, the amounts already authorized, net of reversals,
      on that temporary-repair request are deducted together with those on the service request; for every other
      request only the amounts on the service request are deducted.'
    e_committed: 'Exterior occurrence scope: for a recall reported no later than the plan''s repair guarantee days
      after the most recent completed repair on the same line, the amounts already authorized, net of reversals,
      on the request of that completed repair are deducted from the line''s occurrence cap together with those on
      the service request; for a new failure reported no more than the exterior continuation days after a temporary
      repair was authorized on another request for the same line, the amounts already authorized, net of reversals,
      on that temporary-repair request are deducted together with those on the service request; for every other
      request only the amounts on the service request are deducted.'
    e_cap: 'The standard exterior permanent-work payment is the exterior occurrence benefit left open on the service
      request: the plan''s occurrence cap for the line (the water line occurrence cap for a water service line,
      the sewer line occurrence cap for a sewer lateral or a septic line, the electrical line occurrence cap for
      an electrical service line, the gas line occurrence cap for a gas service line) less every amount already
      authorized on the service request, net of reversals, never below zero.'
    e_open: 'The standard exterior permanent-work payment is the exterior occurrence benefit left open on the service
      request: the plan''s occurrence cap for the line (the water line occurrence cap for a water service line,
      the sewer line occurrence cap for a sewer lateral or a septic line, the electrical line occurrence cap for
      an electrical service line, the gas line occurrence cap for a gas service line) less every amount already
      authorized on the service request, net of reversals, never below zero.'
    e_orig_repair: 'Exterior workmanship recovery: for a recall reported no more than the exterior full recovery
      days after the completed repair it recalls was completed, the exterior full recovery share of the payment
      on the authorization that completion closed is added, where that authorization is a section repair (a completed
      authorization is never reversed, so its payment stands as authorized); for a recall reported later than the
      exterior full recovery days but no later than the plan''s repair guarantee days after that completion, the
      exterior half recovery share of that section repair payment is added; for every other request nothing is added.'
    e_gap: 'Exterior workmanship recovery: for a recall reported no more than the exterior full recovery days after
      the completed repair it recalls was completed, the exterior full recovery share of the payment on the authorization
      that completion closed is added, where that authorization is a section repair (a completed authorization is
      never reversed, so its payment stands as authorized); for a recall reported later than the exterior full recovery
      days but no later than the plan''s repair guarantee days after that completion, the exterior half recovery
      share of that section repair payment is added; for every other request nothing is added.'
    e_restore_share: 'Exterior workmanship recovery: for a recall reported no more than the exterior full recovery
      days after the completed repair it recalls was completed, the exterior full recovery share of the payment
      on the authorization that completion closed is added, where that authorization is a section repair (a completed
      authorization is never reversed, so its payment stands as authorized); for a recall reported later than the
      exterior full recovery days but no later than the plan''s repair guarantee days after that completion, the
      exterior half recovery share of that section repair payment is added; for every other request nothing is added.'
    e_restored: 'Exterior workmanship recovery: for a recall reported no more than the exterior full recovery days
      after the completed repair it recalls was completed, the exterior full recovery share of the payment on the
      authorization that completion closed is added, where that authorization is a section repair (a completed authorization
      is never reversed, so its payment stands as authorized); for a recall reported later than the exterior full
      recovery days but no later than the plan''s repair guarantee days after that completion, the exterior half
      recovery share of that section repair payment is added; for every other request nothing is added.'
    e_full_called: An exterior line calls for whole-line work when the plan replaces whole lines after repeat breaks,
      which is when its full replacement break count is above zero, and the most recent completed repair on the
      same line was completed no more than the plan's replacement lookback days before the request date.
    e_area: 'Exterior material upgrade contribution: on a water service line that calls for whole-line work and
      whose service line material on record is galvanized steel, a home whose living area recorded on the household''s
      active Bridgewell homeowner service contract for the same property address is at least the upsizing area in
      square feet adds the upsized galvanized upgrade contribution, and a home recorded below the upsizing area
      in square feet, or with no living area recorded on such a contract, adds the galvanized upgrade contribution;
      on a water service line that calls for whole-line work and whose recorded material is anything other than
      galvanized steel, the standard upgrade contribution is added; every other request adds no exterior material
      upgrade contribution.'
    e_material: 'Exterior material upgrade contribution: on a water service line that calls for whole-line work
      and whose service line material on record is galvanized steel, a home whose living area recorded on the household''s
      active Bridgewell homeowner service contract for the same property address is at least the upsizing area in
      square feet adds the upsized galvanized upgrade contribution, and a home recorded below the upsizing area
      in square feet, or with no living area recorded on such a contract, adds the galvanized upgrade contribution;
      on a water service line that calls for whole-line work and whose recorded material is anything other than
      galvanized steel, the standard upgrade contribution is added; every other request adds no exterior material
      upgrade contribution.'
    e_util_paid: 'Exterior partner co-funding: on a water service line that calls for whole-line work, a plan enrolled
      through Lakeshore Water Authority whose premium has been remitted through that utility''s bill within the
      exterior partner window adds the Lakeshore co-funding, and a plan enrolled through Riverbend Municipal Utilities
      whose premium has been remitted through that utility''s bill within the exterior partner window adds the Riverbend
      co-funding; every other request adds no exterior partner co-funding. Exterior windows counted in months run
      back from the day the payment is booked: an entry falls within an exterior window when fewer whole months
      than the window separate its posting date from that day.'
    e_cofund: 'Exterior partner co-funding: on a water service line that calls for whole-line work, a plan enrolled
      through Lakeshore Water Authority whose premium has been remitted through that utility''s bill within the
      exterior partner window adds the Lakeshore co-funding, and a plan enrolled through Riverbend Municipal Utilities
      whose premium has been remitted through that utility''s bill within the exterior partner window adds the Riverbend
      co-funding; every other request adds no exterior partner co-funding.'
    e_month: 'Exterior frost excavation contribution: on a property in the frost territory, a request placed in
      December, January, February or March adds the winter frost excavation contribution, for breaking frozen ground
      and thawing the trench line, and a request placed in November or April adds the shoulder-season frost excavation
      contribution; a request on a property outside the frost territory, or placed in any other month, adds no frost
      excavation contribution.'
    e_frost: 'A property is in the frost territory when it lies in a state whose plumbing code sets a design frost
      depth of at least 36 inches for buried water lines across most of the state, because there the soil over a
      service line freezes deep enough in winter that excavation must break frozen ground: Alaska, Colorado, Connecticut,
      Illinois, Iowa, Maine, Massachusetts, Michigan, Minnesota, Montana, Nebraska, New Hampshire, New York, North
      Dakota, Rhode Island, South Dakota, Vermont, Wisconsin and Wyoming. The state is read from the first three
      digits of the ZIP code recorded for the property on the plan: 005, 010 through 069, 100 through 149, 480 through
      629, 680 through 693, 800 through 831 and 995 through 999 are the frost territory, and every other ZIP code
      is outside it. Exterior frost excavation contribution: on a property in the frost territory, a request placed
      in December, January, February or March adds the winter frost excavation contribution, for breaking frozen
      ground and thawing the trench line, and a request placed in November or April adds the shoulder-season frost
      excavation contribution; a request on a property outside the frost territory, or placed in any other month,
      adds no frost excavation contribution.'
    e_commission: 'Exterior commissioning contribution: on a line that calls for whole-line work, a water service
      line adds the water commissioning contribution for the pressure test, flushing and disinfection a new water
      service needs before it is put into use, and a sewer lateral adds the sewer commissioning contribution for
      the acceptance camera inspection of the finished lateral; every other request adds no commissioning contribution.'
    result: The exterior permanent-work payment is rounded to the cent once, at the end. The exterior permanent-work
      payment is the exterior occurrence benefit left open, worked out over the exterior occurrence scope, plus
      the exterior workmanship recovery, plus the exterior material upgrade contribution, plus the exterior partner
      co-funding, plus the exterior frost excavation contribution, plus the exterior commissioning contribution.
    e_orig_auth: 'Exterior workmanship recovery: for a recall reported no more than the exterior full recovery days
      after the completed repair it recalls was completed, the exterior full recovery share of the payment on the
      authorization that completion closed is added, where that authorization is a section repair (a completed authorization
      is never reversed, so its payment stands as authorized); for a recall reported later than the exterior full
      recovery days but no later than the plan''s repair guarantee days after that completion, the exterior half
      recovery share of that section repair payment is added; for every other request nothing is added.'
    e_zip3: 'A property is in the frost territory when it lies in a state whose plumbing code sets a design frost
      depth of at least 36 inches for buried water lines across most of the state, because there the soil over a
      service line freezes deep enough in winter that excavation must break frozen ground: Alaska, Colorado, Connecticut,
      Illinois, Iowa, Maine, Massachusetts, Michigan, Minnesota, Montana, Nebraska, New Hampshire, New York, North
      Dakota, Rhode Island, South Dakota, Vermont, Wisconsin and Wyoming. The state is read from the first three
      digits of the ZIP code recorded for the property on the plan: 005, 010 through 069, 100 through 149, 480 through
      629, 680 through 693, 800 through 831 and 995 through 999 are the frost territory, and every other ZIP code
      is outside it.'
  factors:
  - id: exterior_occurrence_scope
    effect: method
    decides: e_committed
    bindings:
    - e_orig_net
    - e_temp_net
    - e_committed
    ladder:
    - when: a recall reported no later than the plan's repair guarantee days after the most recent completed repair
        on the same line
      method: deduct from the line's occurrence cap the net amounts on the request of that completed repair together
        with those on the service request
    - when: a new failure reported no more than the exterior continuation days after a temporary repair was authorized
        on another request for the same line
      method: deduct the net amounts on that temporary-repair request together with those on the service request
    - when: otherwise
      method: deduct only the net amounts on the service request
    baseline:
      e_committed: e_this_net
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: exterior_workmanship_recovery
    effect: parameter
    decides: e_restore_share
    bindings:
    - e_orig_auth
    - e_orig_repair
    - e_gap
    - e_restore_share
    - e_restored
    ladder:
    - when: a recall reported no more than the exterior full recovery days after the recalled repair was completed
      value: K('share_full')
    - when: a recall reported later than the exterior full recovery days but within the plan's repair guarantee
        days after that completion
      value: K('share_half')
    - when: otherwise
      value: '0.0'
    baseline:
      e_restore_share: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: exterior_material_upgrade
    effect: parameter
    decides: e_material
    bindings:
    - e_area
    - e_material
    ladder:
    - when: a water service line that calls for whole-line work AND galvanized steel on record AND a living area
        of at least the upsizing area in square feet recorded on the household's active Bridgewell homeowner service
        contract for the same address
      value: K('upgrade_galvanized_upsized')
    - when: a water service line that calls for whole-line work AND galvanized steel on record AND a recorded living
        area below the upsizing area in square feet or none recorded
      value: K('upgrade_galvanized')
    - when: a water service line that calls for whole-line work AND any other recorded material
      value: K('upgrade_standard')
    - when: otherwise
      value: '0.0'
    baseline:
      e_material: '0.0'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: homeplan
  - id: exterior_partner_cofunding
    effect: parameter
    decides: e_cofund
    bindings:
    - e_util_paid
    - e_cofund
    ladder:
    - when: a whole-line water service line request AND enrolled through Lakeshore Water Authority AND premium remitted
        through that utility's bill within the exterior partner window
      value: K('cofund_lakeshore')
    - when: a whole-line water service line request AND enrolled through Riverbend Municipal Utilities AND premium
        remitted through that utility's bill within the exterior partner window
      value: K('cofund_riverbend')
    - when: otherwise
      value: '0.0'
    baseline:
      e_cofund: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: exterior_frost_excavation
    effect: parameter
    decides: e_frost
    bindings:
    - e_zip3
    - e_month
    - e_frost
    ladder:
    - when: a property in the frost territory AND the request was placed in December, January, February or March
      value: K('frost_winter')
    - when: a property in the frost territory AND the request was placed in November or April
      value: K('frost_shoulder')
    - when: otherwise
      value: '0.0'
    baseline:
      e_frost: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: exterior_commissioning
    effect: parameter
    decides: e_commission
    bindings:
    - e_line
    - e_commission
    ladder:
    - when: the line calls for whole-line work AND it is a water service line
      value: K('commission_water')
    - when: the line calls for whole-line work AND it is a sewer lateral
      value: K('commission_sewer')
    - when: otherwise
      value: '0.0'
    baseline:
      e_commission: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: 'The exterior permanent-work payment is figured once, on the day it is booked and from the plan''s records
      as they stand that day; periods said to run to the request date end on the service request''s request date.
      The standard exterior permanent-work payment is the exterior occurrence benefit left open on the service request:
      the plan''s occurrence cap for the line (the water line occurrence cap for a water service line, the sewer
      line occurrence cap for a sewer lateral or a septic line, the electrical line occurrence cap for an electrical
      service line, the gas line occurrence cap for a gas service line) less every amount already authorized on
      the service request, net of reversals, never below zero. The exterior permanent-work payment is rounded to
      the cent once, at the end.'
    params:
    - water_line_occurrence_cap
    - sewer_line_occurrence_cap
    - electrical_line_occurrence_cap
    - gas_line_occurrence_cap
  inputs:
    history:
    - table: lineplan_service_requests
      aggregate: latest
      field: request_type
      filters: {}
    - table: lineplan_claim_events
      aggregate: latest
      field: event_date
      filters:
        event_type: lineplan_work_completion
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: lineplan_repair_authorization
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: lineplan_authorization_reversal
    - table: lineplan_billing_entries
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: lineplan_premium_payment
        payment_method: utility_bill
    cross_category:
    - homeplan
