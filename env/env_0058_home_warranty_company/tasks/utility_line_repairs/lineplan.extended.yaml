  rule: Line service requests are accepted only while the plan status is active. Line plans carry no service call
    fee and no deductible. A request names one line. A failure of a section repaired under the plan reported no
    later than repair_guarantee_days calendar days after that repair was completed is a recall of the original occurrence,
    not a new occurrence. A request is an emergency when the failure stops water, sewer, electrical or gas service
    to the home, or a line is actively leaking or a gas leak is suspected; a suspected gas leak is first reported
    to the gas utility and 911.
