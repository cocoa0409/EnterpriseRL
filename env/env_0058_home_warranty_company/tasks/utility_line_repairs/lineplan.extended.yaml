category: lineplan
display_name: Utility Line Protection Plans
binding:
  holding_table: lineplan_contracts
  event_tables:
  - lineplan_billing_entries
  - lineplan_service_requests
  - lineplan_claim_events
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance: premium_balance
lifecycle:
  states:
  - waiting_period
  - active
  - suspended_nonpayment
  - expired
  - cancelled
  transitions:
  - from: waiting_period
    to: active
    by: system
    means: The waiting period ends and line repairs are covered.
  - from: waiting_period
    to: cancelled
    by: user
    means: The customer cancels before coverage starts.
  - from: active
    to: cancelled
    by: user
    means: The customer cancels during the term.
  - from: active
    to: suspended_nonpayment
    by: system
    means: Premium remains unpaid beyond the payment grace period.
  - from: suspended_nonpayment
    to: active
    by: agent
    means: The past-due balance is paid within the cure period and the agent reinstates the plan.
  - from: suspended_nonpayment
    to: cancelled
    by: system
    means: The past-due balance is not cured within the cure period.
  - from: active
    to: expired
    by: system
    means: The term ends after the customer opted out of renewal.
  - from: expired
    to: active
    by: agent
    means: The customer re-enrolls within the late-renewal grace period and the agent restores the plan without
      a new waiting period.
accounts:
- key: premium_balance
  unit: USD
  meaning: Plan premium the customer owes; positive means owed to Bridgewell, negative means a credit owed back.
- key: benefit_consumed
  unit: USD
  meaning: Dollars Bridgewell has committed toward covered line repairs, replacements and restoration allowances,
    net of reversals.
parameter_schema:
  monthly_premium: Monthly plan premium, USD.
  annual_pay_discount_rate: Discount when the term premium is paid in full up front, decimal fraction of twelve
    monthly premiums.
  contract_term_months: Length of each term, calendar months.
  water_line_occurrence_cap: Limit per occurrence for the exterior water service line, USD; 0.00 means not covered.
  sewer_line_occurrence_cap: Limit per occurrence for the sewer lateral or septic line, USD; 0.00 means not covered.
  electrical_line_occurrence_cap: Limit per occurrence for the exterior electrical service line and meter base,
    USD; 0.00 means not covered.
  interior_plumbing_occurrence_cap: Limit per occurrence for interior supply and drain lines, USD; 0.00 means not
    covered.
  gas_line_occurrence_cap: Limit per occurrence for the exterior gas service line, USD; 0.00 means not covered.
  public_way_restoration_allowance: Per-occurrence amount for cutting and restoring a public sidewalk, curb or street,
    within the occurrence cap, USD.
  landscaping_restoration_allowance: Per-occurrence amount for basic lawn restoration (backfill, seed and straw),
    within the occurrence cap, USD.
  slab_access_allowance: Per-occurrence amount for accessing interior lines through a slab or foundation, within
    the occurrence cap, USD.
  hardscape_restoration_covered: Whether private driveways, patios and decorative hardscape are restored, boolean.
  permit_fee_covered: Whether permits required for a covered repair are paid within the occurrence cap, boolean.
  trenchless_method_allowed: Whether the contractor may use trenchless repair or replacement, boolean.
  lead_line_replacement_covered: Whether replacing a lead service line is covered, boolean.
  utility_mandated_work_covered: Whether work ordered by the utility or a government program rather than caused
    by a failure is covered, boolean.
  frozen_line_covered: Whether failures caused by freezing are covered, boolean.
  tree_root_damage_covered: Whether blockages and breaks caused by tree roots are covered, boolean.
  septic_line_covered: Whether the line from the house to the septic tank is covered, boolean.
  main_shutoff_valve_covered: Whether the homeowner's main water shutoff valve is covered, boolean.
  meter_base_covered: Whether the electrical meter base and weatherhead are covered, boolean.
  interior_drain_clearing_covered: Whether clearing an interior drain stoppage is covered, boolean.
  gas_leak_test_covered: Whether the pressure test required after a gas line repair is covered, boolean.
  emergency_temporary_repair_covered: Whether a temporary repair to restore service before the permanent repair
    is covered, boolean.
  waiting_period_days: Calendar days after enrollment before failures are covered, days.
  free_look_days: Calendar days after enrollment within which a cancellation receives the free-look refund, days.
  cancellation_admin_fee: Administrative fee on a cancellation, USD.
  refund_processing_days: Calendar days after cancellation within which a refund is issued, days.
  payment_grace_days: Calendar days after a premium's due date before nonpayment suspends coverage, days.
  suspension_cure_days: Calendar days after suspension during which paying the past-due balance reinstates the plan,
    days.
  renewal_notice_days: Minimum calendar days before term end by which the renewal notice must be issued for automatic
    renewal, days.
  late_renewal_grace_days: Calendar days after term end during which an expired plan can be restored without a new
    waiting period, days.
  on_bill_billing_available: Whether the plan may be billed on a partner utility's bill, boolean.
  routine_contact_hours: Hours within which the contractor contacts the customer on a routine request, hours.
  emergency_contact_hours: Hours within which the contractor contacts the customer on an emergency request, hours.
  repair_guarantee_days: Calendar days after a completed line repair during which a failure of the same repaired
    section is a recall, not a new occurrence, days.
  full_replacement_break_count: Number of covered breaks on the same line within the lookback at which Bridgewell
    replaces the line instead of repairing a section, count; 0 means never.
  replacement_lookback_days: Calendar days counted back from the request date for the full-replacement break count,
    days; 0 when not applicable.
  returned_payment_fee: Fee billed when a premium payment is returned unpaid, USD.
  well_line_covered: Whether the line from a private well to the house is covered, boolean.
  multi_line_bundle: Whether the plan is a bundle covering more than one line type, boolean.
  covered_line_types: Line types the plan covers, list of line type values.
  excluded_conditions: Conditions and parts the plan never covers, list of names.
  transfer_allowed: Whether the plan can be transferred to a new owner of the property, boolean.
  camera_inspection_covered: Whether a camera inspection to locate a sewer or drain failure is paid within the occurrence
    cap, boolean.
  cleanout_installation_covered: Whether installing a sewer cleanout required to complete a covered repair is paid
    within the occurrence cap, boolean.
  backflow_preventer_covered: Whether backflow preventers are covered, boolean.
  own_contractor_reimbursement_allowed: Whether a repair by a contractor of the customer's choosing is reimbursed,
    boolean.
