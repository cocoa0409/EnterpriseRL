    w_util_paid: 'Public-way partner schedule rate: a plan enrolled through Lakeshore Water Authority whose premium
      has been remitted through that utility''s bill within the public-way partner window takes the Lakeshore public-way
      rate; a plan enrolled through Riverbend Municipal Utilities whose premium has been remitted through that utility''s
      bill within the public-way partner window takes the Riverbend public-way rate; every other plan takes a public-way
      partner schedule rate of one. Public-way windows counted in months run back from the day the payment is booked:
      an entry falls within a public-way window when fewer whole months than the window separate its posting date
      from that day.'
    w_partner_rate: 'Public-way partner schedule rate: a plan enrolled through Lakeshore Water Authority whose premium
      has been remitted through that utility''s bill within the public-way partner window takes the Lakeshore public-way
      rate; a plan enrolled through Riverbend Municipal Utilities whose premium has been remitted through that utility''s
      bill within the public-way partner window takes the Riverbend public-way rate; every other plan takes a public-way
