  factors:
  - id: interior_occurrence_scope
    effect: method
    decides: i_committed
    bindings:
    - i_orig_net
    - i_temp_net
    - i_committed
    ladder:
    - when: a recall reported no later than the plan's repair guarantee days after the most recent completed repair
        on the same line
      method: deduct from the interior plumbing occurrence cap the net amounts on the request of that completed
        repair together with those on the service request
    - when: a new failure reported no more than the interior continuation days after a temporary repair was authorized
        on another request for the same line
      method: deduct the net amounts on that temporary-repair request together with those on the service request
    - when: otherwise
      method: deduct only the net amounts on the service request
    baseline:
      i_committed: i_this_net
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: interior_workmanship_recovery
    effect: parameter
    decides: i_restore_share
    bindings:
    - i_orig_auth
    - i_orig_repair
    - i_gap
    - i_restore_share
    - i_restored
    ladder:
    - when: a recall reported no more than the interior full recovery days after the recalled repair was completed
      value: K('share_full')
    - when: a recall reported later than the interior full recovery days but within the plan's repair guarantee
        days after that completion
      value: K('share_half')
    - when: otherwise
      value: '0.0'
    baseline:
      i_restore_share: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: interior_reroute_contribution
    effect: parameter
    decides: i_reroute
    bindings:
    - i_full_called
    - i_reroute
    ladder:
    - when: the line calls for whole-line work AND the request is on an interior drain line
      value: K('reroute_drain')
    - when: the line calls for whole-line work AND the request is on an interior supply line
      value: K('reroute_supply')
    - when: otherwise
      value: '0.0'
    baseline:
      i_reroute: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: interior_wall_restoration
    effect: parameter
    decides: i_wall
    bindings:
    - i_area
    - i_wall
    ladder:
    - when: the line calls for whole-line work AND the living area recorded on the household's active Bridgewell
        homeowner service contract for the same address is at least the large-home area in square feet
      value: K('wall_large')
    - when: the line calls for whole-line work AND the recorded living area is below the large-home area in square
        feet or no active such contract records one
      value: K('wall_standard')
    - when: otherwise
      value: '0.0'
    baseline:
      i_wall: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: homeplan
  baseline:
    rule: 'The interior permanent-work payment is figured once, on the day it is booked and from the plan''s records
      as they stand that day; periods said to run to the request date end on the service request''s request date.
      The standard interior permanent-work payment is the interior occurrence benefit left open on the service request:
      the plan''s interior plumbing occurrence cap less every amount already authorized on the service request,
      net of reversals, never below zero. The interior permanent-work payment is rounded to the cent once, at the
      end.'
    params:
    - interior_plumbing_occurrence_cap
  inputs:
    history:
    - table: lineplan_service_requests
      aggregate: latest
      field: request_type
      filters: {}
    - table: lineplan_claim_events
      aggregate: latest
      field: event_date
      filters:
        event_type: lineplan_work_completion
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: lineplan_repair_authorization
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
