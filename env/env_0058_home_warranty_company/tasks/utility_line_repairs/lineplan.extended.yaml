  baseline:
    rule: 'The slab access payment is figured once per service request, on the day it is booked and from the plan''s
      records as they stand that day; periods said to run to the request date end on the service request''s request
      date. The standard slab access payment is the plan''s slab access allowance as a flat amount, whatever the
      contractor charges for the opening. The slab access payment is never more than the interior occurrence benefit
      still open, which is the plan''s interior plumbing occurrence cap less every amount already authorized, net
      of reversals, on the service request and on the earlier request whose occurrence it belongs to: for a recall
      reported no later than the plan''s repair guarantee days after the most recent completed repair on the same
      line, the request of that completed repair, and for a new failure reported no more than the slab continuation
      days after a temporary repair was authorized on another request for the same line, that temporary-repair request.
      The slab access payment is rounded to the cent once, at the end.'
    params:
    - slab_access_allowance
    - interior_plumbing_occurrence_cap
    - repair_guarantee_days
  inputs:
    history:
    - table: lineplan_service_requests
      aggregate: latest
      field: request_type
      filters: {}
    - table: lineplan_claim_events
      aggregate: latest
      field: event_date
      filters:
        event_type: lineplan_work_completion
    - table: lineplan_claim_events
      aggregate: latest
      field: event_date
      filters:
        event_type: lineplan_contractor_dispatch
        dispatch_sequence: 1
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: lineplan_repair_authorization
        allowance_type: slab_access
    - table: lineplan_claim_events
      aggregate: sum
      field: amount
      filters:
        event_type: lineplan_authorization_reversal
    - table: lineplan_billing_entries
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: lineplan_premium_payment
        payment_method: utility_bill
    cross_category: []
- id: lineplan_ext_interior_work_payment
  base_policy_refs:
  - lineplan_evt_repair_authorization
  overwrite:
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: Each authorization pays the lower of its invoice_amount and the remaining occurrence benefit;
      the customer may pay the contractor for work beyond the cap or decline it.
    replaced_by: For permanent work on an interior supply or drain line whose contractor quote is above the interior
      permanent-work payment, this policy sets the amount paid as stated here, and only for such work; every other
      authorization remains under the base rule that it pays the lower of its invoice amount and the remaining occurrence
      benefit.
  - base_policy: lineplan_evt_repair_authorization
    superseded_clause: Each occurrence is paid up to the plan's occurrence cap for the line type (occurrence_cap),
      counted by lineplan_msr_occurrence_benefit_paid, and occurrences are not limited in number.
    replaced_by: For such interior permanent work the interior workmanship recovery, the interior reroute contribution
      and the interior wall restoration are paid on top of the occurrence cap, and only for such work; every other
      payment on an occurrence remains within the base occurrence cap.
  trigger: on_request
  subject:
  - lineplan_repair_authorization
  computes: bridgewell_payment
  target_tool: approve_interior_line_work_4d5cfcfa
  params:
    continuation_days: 14
    full_recovery_days: 90
    share_full: 1.0
    share_half: 0.5
    reroute_drain: 600.0
    reroute_supply: 400.0
    large_home_area: 2000
    wall_large: 450.0
    wall_standard: 300.0
  rule: 'The interior permanent-work payment is what Bridgewell pays toward the permanent repair, replacement or
    reroute of a covered interior supply or drain line when the contractor''s quote for that work is above what
    Bridgewell pays; the customer approves the work in person and pays the contractor the rest of the quote, and
    the payment is booked as one repair authorization that records the contractor''s quote as its cost. For an interior
    line that lies beneath a concrete slab or foundation, the interior permanent-work payment is fixed only after
    the service request carries its slab access entry. The interior permanent-work payment is figured once, on the
    day it is booked and from the plan''s records as they stand that day; periods said to run to the request date
    end on the service request''s request date. The standard interior permanent-work payment is the interior occurrence
    benefit left open on the service request: the plan''s interior plumbing occurrence cap less every amount already
    authorized on the service request, net of reversals, never below zero. The interior permanent-work payment is
    rounded to the cent once, at the end. The interior permanent-work payment is the interior occurrence benefit
    left open, worked out over the interior occurrence scope, plus the interior workmanship recovery, plus the interior
    reroute contribution, plus the interior wall restoration. Interior occurrence scope: for a recall reported no
    later than the plan''s repair guarantee days after the most recent completed repair on the same line, the amounts
    already authorized, net of reversals, on the request of that completed repair are deducted from the interior
    plumbing occurrence cap together with those on the service request; for a new failure reported no more than
    the interior continuation days after a temporary repair was authorized on another request for the same line,
    the amounts already authorized, net of reversals, on that temporary-repair request are deducted together with
    those on the service request; for every other request only the amounts on the service request are deducted.
    A repaired interior section that fails again inside the repair guarantee is charged back to the network contractor
    who repaired it, and the recovered share returns to the interior permanent-work payment. Interior workmanship
    recovery: for a recall reported no more than the interior full recovery days after the completed repair it recalls
    was completed, the interior full recovery share of the payment on the authorization that completion closed is
    added, where that authorization is a section repair (a completed authorization is never reversed, so its payment
    stands as authorized); for a recall reported later than the interior full recovery days but no later than the
    plan''s repair guarantee days after that completion, the interior half recovery share of that section repair
    payment is added; for every other request nothing is added. An interior line calls for whole-line work when
    the plan replaces whole lines after repeat breaks, which is when its full replacement break count is above zero,
    and the most recent completed repair on the same line was completed no more than the plan''s replacement lookback
    days before the request date. An interior line that keeps breaking beneath the slab is rerouted overhead, and
    Bridgewell contributes toward the reroute because it ends repeat slab openings. Interior reroute contribution:
    on an interior line that calls for whole-line work, a request on an interior drain line adds the drain reroute
    contribution and a request on an interior supply line adds the supply reroute contribution; every other request
    adds no reroute contribution. A rerouted line is run through walls and ceilings, and the drywall opened for
    it grows with the size of the home; drywall is not one of the restoration allowances the base rule pays inside
    the occurrence cap, and Bridgewell sizes it from the living area on its own records, so a home with no living
    area on those records is restored at the standard size. Interior wall restoration: on an interior line that
    calls for whole-line work, a home whose living area recorded on the household''s active Bridgewell homeowner
    service contract for the same property address is at least the large-home area in square feet adds the large-home
    wall restoration, and a home recorded below the large-home area in square feet, or with no living area recorded
    on such a contract, adds the standard wall restoration; every other request adds no wall restoration. For permanent
    work on an interior supply or drain line whose contractor quote is above the interior permanent-work payment,
    this policy sets the amount paid as stated here, and only for such work; every other authorization remains under
    the base rule that it pays the lower of its invoice amount and the remaining occurrence benefit. For such interior
    permanent work the interior workmanship recovery, the interior reroute contribution and the interior wall restoration
    are paid on top of the occurrence cap, and only for such work; every other payment on an occurrence remains
    within the base occurrence cap.'
  prerequisite:
  - problem: lineplan_ext_slab_access_payment
    kind: value_input
    gate: i_this_net
    form: state
    policy_source: For an interior line that lies beneath a concrete slab or foundation, the interior permanent-work
      payment is fixed only after the service request carries its slab access entry.
    condition: The service request of an interior line beneath a slab carries an allowance authorization of type
      slab access in the plan's claim history, not reversed.
    resolved_by: authorize_slab_access_payment_bcc8b3fe
    effect: The slab access payment booked on the service request joins the amounts already authorized on it, so
      the interior occurrence benefit left open, and with it the interior permanent-work payment, falls by exactly
      that payment.
  cross_category:
  - category: homeplan
    as: branch
    reads:
    - status
    - property_address
    - square_footage
    note: The interior wall restoration is decided from the living area recorded on the household's active homeowner
      service contract for the same property.
  compute:
  - i_req: LATEST('lineplan_service_requests', 'lineplan_service_request_id', date_field='request_date')
  - i_date: LATEST('lineplan_service_requests', 'request_date', date_field='request_date')
  - i_type: LATEST('lineplan_service_requests', 'request_type', date_field='request_date')
  - i_line: LATEST('lineplan_service_requests', 'line_type', date_field='request_date')
  - i_orig: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_work_completion',
      line_type=i_line)
  - i_orig_done: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_work_completion',
      line_type=i_line)
  - i_orig_auth: LATEST('lineplan_claim_events', 'authorization_number', date_field='event_date', event_type='lineplan_work_completion',
      line_type=i_line)
  - i_is_recall: i_type == 'recall' and i_orig_done != None and DAYS(i_orig_done, i_date) <= P('repair_guarantee_days')
  - i_temp_req: LATEST('lineplan_claim_events', 'lineplan_service_request_id', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=i_line)
  - i_temp_date: LATEST('lineplan_claim_events', 'event_date', date_field='event_date', event_type='lineplan_repair_authorization',
      resolution_type='temporary_repair', line_type=i_line)
  - i_is_cont: i_type == 'new_failure' and i_temp_date != None and i_temp_req != i_req and DAYS(i_temp_date, i_date)
      <= K('continuation_days')
  - i_this_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=i_req)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=i_req)
  - i_orig_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=i_orig)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=i_orig)
  - i_temp_net: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', lineplan_service_request_id=i_temp_req)
      - SUM('lineplan_claim_events', 'amount', event_type='lineplan_authorization_reversal', lineplan_service_request_id=i_temp_req)
  - i_committed: i_this_net + i_orig_net if i_is_recall else (i_this_net + i_temp_net if i_is_cont else i_this_net)
  - i_open: MX(0, P('interior_plumbing_occurrence_cap') - i_committed)
  - i_orig_repair: SUM('lineplan_claim_events', 'amount', event_type='lineplan_repair_authorization', resolution_type='section_repair',
      authorization_number=i_orig_auth)
  - i_gap: DAYS(i_orig_done, i_date) if i_orig_done != None else 0
  - i_restore_share: K('share_full') if i_is_recall and i_gap <= K('full_recovery_days') else (K('share_half') if
      i_is_recall and i_gap > K('full_recovery_days') else 0.0)
  - i_restored: i_restore_share * i_orig_repair
  - i_full_called: P('full_replacement_break_count') > 0 and i_orig_done != None and DAYS(i_orig_done, i_date) <=
      P('replacement_lookback_days')
  - i_reroute: K('reroute_drain') if i_full_called and i_line == 'interior_drain_line' else (K('reroute_supply')
      if i_full_called and i_line == 'interior_supply_line' else 0.0)
  - i_area: CFIELD('homeplan', 'square_footage', status='active', property_address=F('property_address')) or 0
  - i_wall: K('wall_large') if i_full_called and i_area >= K('large_home_area') else (K('wall_standard') if i_full_called
      and i_area < K('large_home_area') else 0.0)
  - result: RND(i_open + i_restored + i_reroute + i_wall, 2)
  compute_basis:
