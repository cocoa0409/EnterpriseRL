name: env_0059_residential_mortgage_lender
company: Larkspur Home Lending
background: |
  Larkspur Home Lending is a nonbank residential mortgage lender headquartered in Columbus, Ohio, licensed in 29 states and originating roughly 9,400 first-lien home loans a year through retail loan officers, an online application portal and a network of real estate agents who refer their buyers.
  Its loan origination support desk speaks with borrowers and with the buyer's agents who work alongside them, in a plain, patient tone that respects how much is riding on a closing date.
  Every application is a Mortgage Loan File opened under one of seven programs: Larkspur FHA 30-Year Fixed, Larkspur VA 30-Year Fixed, Larkspur HomeReady 30-Year Fixed, Larkspur Conventional 30-Year Fixed, Larkspur Conventional 15-Year Fixed, Larkspur High-Balance Conforming 30-Year Fixed and Larkspur Jumbo 30-Year Fixed.
  A loan file carries its own ledger of up-front credit report and application fees, its Loan Estimates, intents to proceed and Closing Disclosures, the underwriting conditions issued and cleared on it, and any tolerance cures owed at or after closing.
  The interest rate on a file is protected by a Rate Lock Commitment bought for a term: the Larkspur 15-Day, 30-Day, 45-Day, 60-Day and 90-Day Rate Locks, the Larkspur 120-Day Extended Rate Lock and the Larkspur 180-Day New Construction Rate Lock, each with its own time-stamped request log, extension, relock and float-down pricing entries, deposits and disputes.
  Each file's valuation is an Appraisal Order placed through Larkspur's appraisal management partners by report type, from the Larkspur Desktop Appraisal (Form 1004 Desktop) and Exterior-Only Appraisal (Form 2055) through the Condominium (Form 1073), Single-Family (Form 1004), FHA Single-Family (Form 1004 FHA) and Small Residential Income (Form 1025) appraisals to the Complex Property Appraisal (Form 1004 Jumbo), booking every appraisal charge, refund and reconsideration of value.
  Closing Cost Credits are reserved against a file, verified and either applied on the Closing Disclosure or forfeited: the Larkspur Hometown Heroes Credit, Returning Customer Credit, First Home Credit, On-Time Closing Guarantee, Builder Partner Credit, Neighborhood Access Grant and Neighborhood Access Grant Plus.
  Each file closes through a Closing and Funding engagement chosen by method, namely the Larkspur Traditional Wet Closing, Escrow Dry-Funding Closing, Mobile Notary Closing, Hybrid eClosing, Remote Online Notarization Closing, Power of Attorney Closing or Mail-Away Closing, which books prepaid per diem interest, closing fees, funding wires and funding disputes.
  Before they shop, many buyers hold a Mortgage Pre-Approval at one of six levels, from the Larkspur Pre-Qualification and Pre-Approval through the Verified, Underwritten and Jumbo Underwritten Pre-Approvals to the Lock & Shop Pre-Approval, under which letters are issued to the buyer and the buyer's agent.
  Some purchases also carry an Interest Rate Buydown, either a temporary Larkspur 1-0, 1-1, 2-1 or 3-2-1 Temporary Buydown paid by a seller, builder or Larkspur, or a Larkspur One-Point, Two-Point or Three-Point Permanent Buydown, with any subsidy held and drawn from a custodial account.
  Callers include first-time buyers, move-up buyers, veterans, homeowners refinancing, buyers of new construction and the licensed real estate agents who represent them.
  A typical borrower holds one loan file in process with a rate lock, an appraisal order and a scheduled closing, often a closing cost credit and sometimes a buydown, and occasionally a second file for a refinance of another home or a completed Larkspur loan from years before.
  Their history shows fee charges and refunds, several rounds of disclosures and conditions, lock extensions or relocks, appraisal charges and value challenges, and, after closing, questions about per diem interest, wires and fees.
logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_log
difficulties:
  - name: rate_lock_extensions_and_disputes
    claim:
      categories: [lock]
      event_types: [lock_request_logged, lock_extension_booked, lock_expiration_updated, lock_expired, lock_relocked, lock_relock_fee_booked,
                    lock_float_down_fee_booked, lock_repriced, lock_cost_waived, lock_deposit_refunded, lock_deposit_forfeited,
                    lock_dispute_filed, lock_dispute_resolved]
    summary: >
      Borrowers call because a closing has slipped and their rate lock is about to run out or already has, because they believe they asked to
      lock before the market moved, because they want the lower rate they now see advertised, or because an extension charge on their Closing
      Disclosure looks wrong; the setting varies by lock term (15-day through the 180-day new construction lock), by lock status (locked,
      expired, cancelled), by how many extensions and relocks the lock has already used, by whether an extended lock carries a deposit, and by
      what happened elsewhere on the file, such as a late appraisal or a program change.
      The records involved are the rate lock and its time-stamped request log, its pricing entries and deposit entries, the loan file's status
      and scheduled closing date, the appraisal order's due and completed dates and any Closing Disclosure already issued; the governing rules
      are the per-term extension cost, increments and caps of lock_extension, the confirmation pricing and cutoff of lock_confirmation_pricing,
      the relock window and worst-case pricing of lock_relock, the float-down terms of lock_float_down, the deposit dispositions of
      lock_deposit_handling and the filing window and evidence standard of lock_dispute_resolution, while lock_expiration,
      lock_agg_cancellation_cooling and lock_program_change_reprice decide the edges; in the ordinary course a lock is requested, confirmed,
      extended or relocked as needed and delivered at funding.
      Booking an extension, relock or float-down, waiving a cost, deciding a dispute and repricing a lock are agent actions taken on a verified
      customer's request, while cancelling a lock or withdrawing a lock request, and filing a dispute in the borrower's own name, are the
      borrower's own decisions and are handed to the borrower to confirm.
      Requests no rule decides, such as compensating a borrower for market losses beyond the logged terms, extending a lock past the term's
      extension cap, honoring a rate quoted by another lender, or reviewing a dispute about a lock desk error the request log cannot show, go
      to a human representative as POLICY_NOT_COVERED.
  - name: appraisal_orders_and_fees
    claim:
      categories: [appraisal]
      event_types: [appraisal_ordered, appraisal_fee_charged, appraisal_fee_refunded, appraisal_cancelled, appraisal_due_date_updated,
                    appraisal_delivered, appraisal_rov_submitted, appraisal_rov_decided, appraisal_rov_opened, appraisal_rov_closed,
                    appraisal_value_updated]
    summary: >
      Borrowers and their agents call to order or rush an appraisal, to ask why a trip fee or surcharge appeared, to cancel an order after
      deciding not to proceed, to get a copy of the report, or to challenge a value that came in below the contract price; the setting varies by
      report type, by the order's stage (ordered, assigned, on hold, inspected, completed, delivered, under reconsideration), by the loan
      program, property and loan size on the file, by whether the file is a higher-priced loan on a recently flipped property, and by the
      charges and refunds already booked.
      The records involved are the appraisal order with its due, inspection, completion and delivery dates, its fee ledger by component and
      its reconsideration requests, together with the loan file's status, program and purpose; the governing rules are the fee components and
      intent-to-proceed gate of appraisal_fee_schedule, the stage-based refunds of appraisal_fee_refund, report choice and turn time in
      appraisal_report_type_selection and appraisal_turn_time, the delivery timing of appraisal_delivery, the window and limits of
      appraisal_reconsideration_of_value, and the second-appraisal rules of appraisal_agg_orders_per_file and
      appraisal_hpml_flip_second_appraisal; in the ordinary course an order is placed after intent to proceed, assigned, inspected, completed and
      delivered, and any challenge follows delivery.
      Placing orders, booking charges and refunds, delivering the report, accepting a reconsideration and recording its outcome are agent
      actions, while cancelling a paid order and submitting a reconsideration with the borrower's own comparable sales are the borrower's
      decisions that the agent hands over for the borrower to make.
      Requests no rule decides, such as replacing the appraiser because the borrower dislikes the value, paying the borrower for a delayed
      closing caused by a late report, or ordering a valuation type Larkspur does not offer, go to a human representative as
      POLICY_NOT_COVERED.
  - name: disclosures_conditions_and_application_fees
    claim:
      categories: [loan]
      event_types: [loan_credit_report_fee_charged, loan_application_fee_collected, loan_fee_refunded, loan_fee_withdrawal_refunded, loan_fee_applied_at_closing,
                    loan_le_issued, loan_itp_received, loan_le_revised, loan_cd_issued, loan_cd_corrected, loan_condition_issued,
                    loan_condition_cleared, loan_condition_waived, loan_tolerance_cure_assessed, loan_tolerance_cure_paid,
                    loan_processing_started, loan_suspended, loan_resubmitted, loan_cleared_to_close, loan_terms_updated]
    summary: >
      Borrowers call to give intent to proceed, to pay or recover an application or credit report fee, to ask why a revised Loan Estimate or
      Closing Disclosure changed their costs, to send documents for open conditions or get a suspended file moving, or to ask whether a fee
      that rose at closing will be cured; the setting varies by loan program, by file status from application through clear-to-close and
      consummation, by how many disclosures and condition rounds the file has been through, by a second concurrent file, and by the borrower's
      locks, appraisals and credits elsewhere.
      The records involved are the loan file, its fee ledger, its disclosure history with issue, receipt and changed-circumstance dates, its
      conditions and its tolerance cures; the governing rules are TRID timing in loan_le_delivery, loan_intent_to_proceed,
      loan_changed_circumstance and loan_closing_disclosure_timing, fee collection and refunds in loan_evt_application_fee,
      loan_agg_shared_credit_report and loan_evt_fee_refund, conditions and suspense in loan_condition_management, loan_clear_to_close and
      loan_file_closure, tolerance cures in loan_tolerance_cure, and the program, concession and upfront fee rules of loan_program_eligibility,
      loan_interested_party_contribution and loan_upfront_program_fee; in the ordinary course a file is disclosed, receives intent to proceed,
      is processed and underwritten, clears its conditions and is cleared to close before consummation.
      Recording disclosures and intent to proceed, booking and refunding fees, issuing, clearing and waiving conditions, suspending and
      resubmitting files and booking cures are agent actions, while withdrawing the application and electing to waive escrow are the
      borrower's own decisions handed to the borrower.
      Requests no rule decides, such as waiving a condition because the borrower finds it intrusive, refunding a credit report fee after the
      pull, re-baselining a fee for a reason that is not a changed circumstance, or approving a file that fails a program limit, go to a human
      representative as POLICY_NOT_COVERED.
  - name: closing_cost_credits
    claim:
      categories: [credit]
      event_types: [credit_reserved, credit_verified, credit_award_booked, credit_guarantee_payout_booked, credit_applied_at_closing,
                    credit_reduced, credit_balance_forfeited, credit_expiration_extended, credit_expired, credit_revoked,
                    credit_docs_completed, credit_applied]
    summary: >
      Borrowers call to claim a closing cost credit they saw advertised, to find out how much a credit is worth on their loan, to keep a credit
      from expiring while closing slips, to ask why their Closing Disclosure shows less credit than promised, or to collect on the On-Time
      Closing Guarantee after a late closing; the setting varies by credit program, by credit status (reserved, verified, applied, expired,
      forfeited, revoked), by the loan file's program, purpose, income and census tract facts, by past Larkspur loans, and by other credits,
      seller or agent concessions and buydowns on the same file.
      The records involved are the closing credit and its ledger, the loan file and its Closing Disclosures, the customer's other loan files,
      and any buydown on the file; the governing rules are program tests in credit_program_eligibility, sizing in credit_award_amount,
      stacking, exclusion and application order in credit_agg_stacking and credit_application_at_closing, validity in credit_validity,
      forfeiture in credit_forfeiture and the guarantee in credit_closing_guarantee; in the ordinary course a credit is reserved while the file
      is in process, verified with documents, and applied at consummation, or else expires or is forfeited with the file.
      Reserving, verifying, extending, revoking and applying credits and booking awards, payouts, reductions and forfeitures are agent actions,
      while committing to a guarantee's terms and certifying first-time-buyer, occupation or occupancy facts are the borrower's own statements
      handed to the borrower.
      Requests no rule decides, such as paying unused credit in cash, granting a credit after the loan has closed, matching another lender's
      grant, or paying the guarantee for a delay caused by the seller, go to a human representative as POLICY_NOT_COVERED.
  - name: funding_and_disbursement_disputes
    claim:
      categories: [funding]
      event_types: [funding_closing_scheduled, funding_closing_date_changed, funding_docs_drawn, funding_docs_voided, funding_wire_sent,
                    funding_wire_returned, funding_per_diem_charged, funding_per_diem_refunded, funding_fee_charged, funding_fee_reversed,
                    funding_dispute_filed, funding_dispute_resolved, funding_rescinded]
    summary: >
      Borrowers and settlement-side callers ask when a loan will fund, why funding did not happen on the signing day, why prepaid interest was
      charged for days before the money moved, why a redraw, courier or wire fee appears, or how to rescind a refinance; the setting varies by
      closing method and property state, by closing status (scheduled, documents out, signed, in rescission, funded, rescinded, cancelled), by
      whether the transaction carries a right of rescission, by the lock and conditions on the loan file, and by wires that were returned.
      The records involved are the closing with its draw, signing, rescission and disbursement dates, its wire, interest and fee ledgers and its
      disputes, together with the loan file's conditions and the rate lock's expiration; the governing rules are method fit in
      funding_method_eligibility, package timing in funding_document_package, rescission in funding_rescission, funding release in
      funding_authorization, per diem arithmetic in funding_per_diem_interest, fee schedules in funding_closing_fees, returns in
      funding_wire_returns and the window and remedies of funding_dispute_resolution; in the ordinary course a cleared file is scheduled,
      documents are drawn, the borrower signs, any rescission period runs, and funds are wired.
      Scheduling, drawing documents, releasing wires, booking interest and fees, refunding and reversing them and deciding disputes are agent
      actions, while cancelling a scheduled closing and exercising the right of rescission belong to the borrower and are handed to the
      borrower.
      Requests no rule decides, such as compensating a seller for a late funding, waiving a rescission period without the required emergency
      statement, reimbursing moving or storage costs after a delay, or a funding that was released before the rescission period ended, go to a
      human representative as POLICY_NOT_COVERED.
