events:
- type: appraisal_ordered
  target: appraisal_orders
  mutation: create
  meaning: an appraisal of a chosen report type is ordered for a loan file
  grain: one row per appraisal order
  fields:
    customer_id: borrower on whose loan the appraisal is ordered (foreign key -> customers)
    loan_file_id: loan file the appraisal supports (foreign key -> loan_files)
    variant_name: appraisal report type ordered, written as the official report name
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
    order_reason: >-
      why the order exists: a first valuation, an appraisal transferred from another lender, a required
      second appraisal, or a replacement for an expired appraisal
    ordered_date: date the order was placed with the appraisal management company
    rush_requested: whether the borrower asked for rush turn time at order
    due_date: >-
      date the completed report is promised: ordered date plus the standard or rush turn time in business
      days, moved only for borrower-caused access delays
    gross_living_area_sqft: gross living area of the subject property as reported
    site_acres: site size of the subject property in acres
    seller_acquisition_date: >-
      date the seller acquired the subject property, from the title commitment; empty for refinances
    seller_acquisition_price: price the seller paid when acquiring the subject property; empty for refinances
    opened_date: date the order record was opened
  triggers:
  - event: appraisal:appraisal_fee_charged
    when:
      order_reason: [standard_order, second_appraisal_jumbo, new_order_after_expiration]
    map: {fee_component: base_fee, entry_date: ordered_date}
  - event: appraisal:appraisal_fee_charged
    when: {order_reason: transferred_in}
    map: {fee_component: transfer_review_fee, entry_date: ordered_date}
- type: appraisal_assigned
  target: appraisal_orders
  mutation:
    transition: {from: ordered, to: assigned}
  meaning: an appraiser accepts the assignment
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'}
  triggers: []
- type: appraisal_held
  target: appraisal_orders
  mutation:
    transition: {from: assigned, to: on_hold}
  meaning: the order is put on hold
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'}
  triggers: []
- type: appraisal_released
  target: appraisal_orders
  mutation:
    transition: {from: on_hold, to: assigned}
  meaning: the hold is lifted
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'}
  triggers: []
- type: appraisal_inspected
  target: appraisal_orders
  mutation:
    transition: {from: assigned, to: inspected}
  meaning: the inspection or desktop analysis is done
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
    inspection_date: >-
      date the appraiser inspected the property (or completed the desktop analysis); empty until then
  triggers: []
- type: appraisal_completed
  target: appraisal_orders
  mutation:
    transition: {from: inspected, to: completed}
  meaning: the completed report is received
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)', completed_date: date
      the completed report was received by Larkspur; empty until then, appraised_value: market value concluded
      in the report as last revised; empty until completed, cu_risk_score: Collateral Underwriter risk
      score returned for the report; empty when not scored, subject_to_completion: 'whether the value
      is subject to completion or repairs, requiring a final inspection'}
  triggers: []
- type: appraisal_delivered
  target: appraisal_orders
  mutation:
    transition: {from: completed, to: delivered}
  meaning: a copy of the report is delivered to the borrower
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)', delivered_to_borrower_date: date
      a copy of the completed report was delivered to the borrower; empty until then}
  triggers: []
- type: appraisal_rov_opened
  target: appraisal_orders
  mutation:
    transition: {from: delivered, to: under_reconsideration}
  meaning: a reconsideration of value is sent to the appraiser
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'}
  triggers: []
- type: appraisal_rov_closed
  target: appraisal_orders
  mutation:
    transition: {from: under_reconsideration, to: delivered}
  meaning: the reconsideration outcome is delivered
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'}
  triggers: []
- type: appraisal_cancelled
  target: appraisal_orders
  mutation:
    transition:
    - {from: ordered, to: cancelled}
    - {from: assigned, to: cancelled}
    - {from: on_hold, to: cancelled}
    - {from: inspected, to: cancelled}
  meaning: the order is cancelled
  grain: one row per appraisal order
  fields: {status: 'lifecycle status of the order (basis: appraisal lifecycle.states)', closed_date: date
      the order was cancelled; empty otherwise}
  triggers: []
- type: appraisal_due_date_updated
  target: appraisal_orders
  mutation: update
  meaning: the promised delivery date moves because the borrower delayed access
  grain: one row per appraisal order
  fields:
    due_date: >-
      date the completed report is promised: ordered date plus the standard or rush turn time in business
      days, moved only for borrower-caused access delays
  triggers: []
- type: appraisal_value_updated
  target: appraisal_orders
  mutation: update
  meaning: the appraised value changes after a reconsideration or a corrected report
  grain: one row per appraisal order
  fields: {appraised_value: market value concluded in the report as last revised; empty until completed}
  triggers: []
- type: appraisal_fee_charged
  target: appraisal_fee_ledger
  meaning: an appraisal charge is collected from the borrower
  grain: one row per charge component collected on an order
  distinguish_by: [fee_component, entry_date]
  fields: {appraisal_order_id: order charged (foreign key -> appraisal_orders), customer_id: borrower
      charged or refunded (foreign key -> customers), fee_component: which appraisal charge the entry
      concerns, amount: 'entry amount, always positive; event_type gives the direction', entry_date: date
      charged or refunded, payment_method: card or account charged or refunded, refund_reason: why a refund
      was issued; none on charges}
  account: appraisal_fees
  direction: in
  triggers: []
- type: appraisal_fee_refunded
  target: appraisal_fee_ledger
  meaning: a collected appraisal charge is returned to the borrower
  grain: one row per charge refunded
  distinguish_by: [original_fee_entry_id]
  fields:
    appraisal_order_id: order charged (foreign key -> appraisal_orders)
    customer_id: borrower charged or refunded (foreign key -> customers)
    fee_component: which appraisal charge the entry concerns
    amount: entry amount, always positive; event_type gives the direction
    entry_date: date charged or refunded
    payment_method: card or account charged or refunded
    original_fee_entry_id: >-
      for a refund, the charge entry refunded (foreign key -> appraisal_fee_ledger); empty on charges
    refund_reason: why a refund was issued; none on charges
  account: appraisal_fees
  direction: out
  triggers: []
- type: appraisal_rov_submitted
  target: appraisal_reconsiderations
  meaning: the borrower submits a reconsideration of value
  grain: one row per request
  distinguish_by: [submitted_date]
  fields:
    appraisal_order_id: order whose value is challenged (foreign key -> appraisal_orders)
    customer_id: borrower who requested the reconsideration (foreign key -> customers)
    rov_basis: ground the borrower raises
    submitted_date: >-
      date the request was submitted (on a decision record: the submission date of the source request)
    comparables_count: number of alternative comparable sales the borrower supplied
    decision: outcome; pending on the submission record
  triggers:
  - event: appraisal:appraisal_rov_opened
    when: {decision: pending}
- type: appraisal_rov_decided
  target: appraisal_reconsiderations
  meaning: the appraiser's response to a reconsideration is recorded
  grain: one row per request decided
  distinguish_by: [source_rov_id]
  fields:
    appraisal_order_id: order whose value is challenged (foreign key -> appraisal_orders)
    customer_id: borrower who requested the reconsideration (foreign key -> customers)
    rov_basis: ground the borrower raises
    submitted_date: >-
      date the request was submitted (on a decision record: the submission date of the source request)
    decision: outcome; pending on the submission record
    decided_date: date the appraiser's response was received; empty on the submission record
    revised_value: value after reconsideration when the decision is value_changed; empty otherwise
    source_rov_id: >-
      on a decision record, the submission it decides (foreign key -> appraisal_reconsiderations); empty
      on the submission
  triggers:
  - event: appraisal:appraisal_rov_closed
    when:
      decision: [value_changed, value_unchanged]
  - event: appraisal:appraisal_value_updated
    when: {decision: value_changed}
    map: {appraised_value: revised_value}
measures:
- id: appraisal_msr_rov_count
  window: the life of the appraisal order up to frozen time
  measure: >-
    count of appraisal_rov_submitted records on the order whose decision record is not returned_incomplete
- id: appraisal_msr_component_charges
  window: the life of the appraisal order up to frozen time
  measure: >-
    for each fee_component, the count of appraisal_fee_charged records on the order not refunded by an
    appraisal_fee_refunded record
policies:
- id: appraisal_agg_multi_holding
  subject: [appraisal_ordered]
  rule: >-
    A customer may have any number of appraisal orders across loan files and over time (max_per_customer
    is unlimited); each order belongs to exactly one loan file. Orders on the same file are read together
    under the per-file order policy.
  eligibility: []
  params: {max_per_customer: null}
- id: appraisal_agg_orders_per_file
  subject: [appraisal_ordered]
  rule: >-
    A loan file may carry only one appraisal order of order_reason standard_order, transferred_in or new_order_after_expiration
    whose status is not cancelled. A second order on the same file is placed only as second_appraisal_jumbo,
    when the base loan amount is above second_appraisal_loan_amount_threshold of the primary report type,
    or as second_appraisal_hpml_flip under the flip policy; a replacement for an appraisal that aged past
    its usable life is ordered as new_order_after_expiration only after the expired order is cancelled
    or its age limit has passed. A cancelled order never blocks a new one.
  eligibility:
  - id: one_primary_order_per_file
    applies_to: [appraisal_ordered]
    kind: dedup
    condition: >-
      A loan file may carry only one appraisal order of order_reason standard_order, transferred_in or
      new_order_after_expiration whose status is not cancelled.
    evidence_fields: [appraisal_orders.loan_file_id, appraisal_orders.order_reason, appraisal_orders.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [appraisal_orders.loan_file_id]
      action_bindings: {appraisal_orders.loan_file_id: loan_file_id}
    dedup_contract:
      table: appraisal_orders
      mode: separate_record
      object_bindings: {loan_file_id: loan_file_id}
      duplicate_filters:
        status: [ordered, assigned, on_hold, inspected, completed, delivered, under_reconsideration]
      distinct_fields: [order_reason]
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop): {second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold}
      Larkspur Exterior-Only Appraisal (Form 2055): {second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold}
      Larkspur Condominium Appraisal (Form 1073): {second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold}
      Larkspur Single-Family Appraisal (Form 1004): {second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold}
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA): {second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold}
      Larkspur Small Residential Income Appraisal (Form 1025): {second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold}
      Larkspur Complex Property Appraisal (Form 1004 Jumbo): {second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold}
- id: appraisal_report_type_selection
  subject: [appraisal_ordered]
  rule: >-
    The report type ordered must fit the loan file: the file's loan program is in eligible_loan_programs,
    its property_type in eligible_property_types, its loan_purpose in eligible_loan_purposes, its units
    no more than max_units, and its base-loan-to-value no more than max_ltv_for_form_pct. Where several
    report types fit, the default is the interior report for the property: the FHA report for an FHA file,
    the complex property report for a Jumbo file, the small residential income report for two to four
    units, the condominium report for a condominium and the single-family report otherwise; a desktop
    or exterior-only report is used only when it fits and the file's automated underwriting findings accept
    it in place of an interior inspection. due_date is ordered_date plus standard_turn_business_days business
    days, or plus rush_turn_business_days when rush_requested is true and rush_available is true. A business
    day is Monday through Friday excluding the US federal public holidays observed by the Federal Reserve
    Banks; Saturdays, Sundays and those holidays are skipped when counting. A transferred report is accepted
    only where transfer_allowed is true and the report was prepared for the same borrower and property
    within its validity_days.
  eligibility: []
- id: appraisal_fee_schedule
  subject: [appraisal_fee_charged]
  rule: >-
    Appraisal charges are collected only while the loan file status is processing, underwriting, conditionally_approved,
    suspended or clear_to_close. This follows from fee_collection_requires_itp: only after the borrower
    has received the Loan Estimate and given intent to proceed. The base_fee is charged once when the
    order is placed (orders transferred in are charged transfer_review_fee instead). rush_fee is charged
    once when the borrower asks for rush and rush_available is true. gla_surcharge is charged once when
    gross_living_area_sqft is above gla_surcharge_threshold_sqft, and acreage_surcharge once when site_acres
    is above acreage_surcharge_threshold_acres. rent_schedule_fee is charged once when the loan is for
    an investment property or qualifying income includes rent from the subject. trip_fee is charged for
    each kept appointment at which the appraiser could not get into the property; an appointment missed
    or cut short by the appraiser or the appraisal management company is never charged. reinspection_fee
    is charged once for each Form 1004D completion or update inspection. Nothing is charged for a reconsideration
    of value (rov_fee), for the borrower's copy of the report, for a desk review Larkspur orders when
    cu_risk_score is above cu_desk_review_threshold (desk_review_chargeable is false), or for an HPML
    flip second appraisal (hpml_second_appraisal_chargeable is false). Charges are paid by one of fee_payment_methods;
    there is no stacking or discount between components, each is charged at its own amount.
  eligibility:
  - id: after_itp_only
    applies_to: [appraisal_fee_charged]
    kind: state
    condition: >-
      Appraisal charges are collected only while the loan file status is processing, underwriting, conditionally_approved,
      suspended or clear_to_close.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_files.loan_file_id]
      action_bindings: {loan_files.loan_file_id: loan_file_id}
    state_contract:
      field: loan_files.status
      allowed: [processing, underwriting, conditionally_approved, suspended, clear_to_close]
  measures: [appraisal_msr_component_charges]
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop): {base_fee: =base_fee, rush_fee: =rush_fee, trip_fee: =trip_fee,
        reinspection_fee: =reinspection_fee}
      Larkspur Exterior-Only Appraisal (Form 2055): {base_fee: =base_fee, rush_fee: =rush_fee, trip_fee: =trip_fee,
        reinspection_fee: =reinspection_fee}
      Larkspur Condominium Appraisal (Form 1073): {base_fee: =base_fee, rush_fee: =rush_fee, trip_fee: =trip_fee,
        reinspection_fee: =reinspection_fee}
      Larkspur Single-Family Appraisal (Form 1004): {base_fee: =base_fee, rush_fee: =rush_fee, trip_fee: =trip_fee,
        reinspection_fee: =reinspection_fee}
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA): {base_fee: =base_fee, rush_fee: =rush_fee,
        trip_fee: =trip_fee, reinspection_fee: =reinspection_fee}
      Larkspur Small Residential Income Appraisal (Form 1025): {base_fee: =base_fee, rush_fee: =rush_fee,
        trip_fee: =trip_fee, reinspection_fee: =reinspection_fee}
      Larkspur Complex Property Appraisal (Form 1004 Jumbo): {base_fee: =base_fee, rush_fee: =rush_fee,
        trip_fee: =trip_fee, reinspection_fee: =reinspection_fee}
- id: appraisal_fee_refund
  subject: [appraisal_fee_refunded, appraisal_cancelled]
  rule: >-
    Refunds follow the stage the order had reached when it was cancelled, read from its status at cancellation.
    Cancelled while ordered (no appraiser assigned): every charge is refunded in full (cancelled_before_assignment).
    Cancelled while assigned or on_hold (no inspection yet): the base fee is refunded less cancellation_fee_after_assignment,
    which is retained, and every other charge not yet earned (rush, surcharges, rent schedule) is refunded
    in full (cancelled_before_inspection). Cancelled after inspection: cancellation_fee_after_inspection_pct
    percent of the base fee is retained, which at 100 means no base fee refund, while unearned rush and
    add-on charges are refunded. When the order was delivered later than its due_date after the borrower
    paid for rush, the rush_fee is refunded in full (rush_deadline_missed) even though the report was
    completed. Any charge collected before intent to proceed is refunded in full (charged_before_intent_to_proceed),
    and any charge on an HPML flip second appraisal is refunded in full (hpml_second_appraisal_not_chargeable).
    A refund disposes only of a charge entry that has not already been refunded. Refunds go to the original
    payment method within fee_refund_business_days business days and name the charge entry they return;
    a retained cancellation fee is not a separate charge, it is the part of the base fee not refunded.
  eligibility:
  - id: charge_not_refunded
    applies_to: [appraisal_fee_refunded]
    kind: dedup
    condition: A refund disposes only of a charge entry that has not already been refunded.
    evidence_fields: [appraisal_fee_ledger.original_fee_entry_id, appraisal_fee_ledger.appraisal_order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [appraisal_fee_ledger.original_fee_entry_id]
      action_bindings: {appraisal_fee_ledger.original_fee_entry_id: original_fee_entry_id}
    dedup_contract:
      table: appraisal_fee_ledger
      mode: separate_record
      object_bindings: {original_fee_entry_id: original_fee_entry_id}
      duplicate_filters:
        event_type: [appraisal_fee_refunded]
      distinct_fields: []
  formula: {base_refund_after_assignment: base_fee - cancellation_fee_after_assignment}
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop): {cancellation_fee_after_assignment: =cancellation_fee_after_assignment}
      Larkspur Exterior-Only Appraisal (Form 2055): {cancellation_fee_after_assignment: =cancellation_fee_after_assignment}
      Larkspur Condominium Appraisal (Form 1073): {cancellation_fee_after_assignment: =cancellation_fee_after_assignment}
      Larkspur Single-Family Appraisal (Form 1004): {cancellation_fee_after_assignment: =cancellation_fee_after_assignment}
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA): {cancellation_fee_after_assignment: =cancellation_fee_after_assignment}
      Larkspur Small Residential Income Appraisal (Form 1025): {cancellation_fee_after_assignment: =cancellation_fee_after_assignment}
      Larkspur Complex Property Appraisal (Form 1004 Jumbo): {cancellation_fee_after_assignment: =cancellation_fee_after_assignment}
- id: appraisal_turn_time
  subject: [appraisal_assigned, appraisal_inspected, appraisal_completed, appraisal_due_date_updated,
    appraisal_held, appraisal_released]
  rule: >-
    The appraisal management company assigns an appraiser within assignment_turn_business_days and the
    inspection is scheduled within inspection_scheduling_business_days after assignment. An order is put
    on hold only when the appraiser cannot get access to the property or a required charge is unpaid,
    and it is released when that is resolved. due_date moves only when the borrower or the borrower's
    agent delays access: it moves forward by the number of business days between the first offered inspection
    date and the inspection date the borrower accepted. Delays by the appraiser or the management company
    never move due_date. A report whose completed_date is later than its due_date is a late report; the
    number of calendar days between due_date and completed_date is the appraisal delay that other Larkspur
    policies rely on.
  eligibility: []
- id: appraisal_delivery
  subject: [appraisal_delivered]
  rule: >-
    Under the ECOA valuations rule the borrower receives a free copy (borrower_copy_free) of every appraisal
    and written valuation on the file. The borrower's copy of the report must be delivered no later than
    the end of the delivery period that starts on the date the report was completed. Count business days
    forward from completed_date, which is day zero; delivery on the last business day of the period is
    on time. A business day is Monday through Friday excluding the US federal public holidays observed
    by the Federal Reserve Banks; Saturdays, Sundays and those holidays are skipped when counting. Independently,
    the copy must reach the borrower at least delivery_business_days_before_consummation business days
    before consummation, unless the borrower signed a timing waiver (timing_waiver_signed_date) at least
    that many business days before consummation, in which case delivery at or before consummation suffices.
    A revised report after a reconsideration is delivered under the same rule from its own decision date.
  eligibility:
  - id: deliver_promptly
    applies_to: [appraisal_delivered]
    kind: time
    condition: >-
      The borrower's copy of the report must be delivered no later than the end of the delivery period
      that starts on the date the report was completed.
    evidence_fields: [appraisal_orders.completed_date, appraisal_orders.appraisal_order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: &id005
      - [appraisal_orders.appraisal_order_id]
      action_bindings: &id006 {appraisal_orders.appraisal_order_id: appraisal_order_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the report was completed
      anchor_source: appraisal_orders.completed_date
      relation: not_after
      duration_source: variants.delivery_business_days_after_completion
      unit: business_days
      counting_rule: >-
        Count business days forward from completed_date, which is day zero; delivery on the last business
        day of the period is on time.
      boundary: inclusive
- id: appraisal_reconsideration_of_value
  subject: [appraisal_rov_submitted, appraisal_rov_decided, appraisal_rov_opened, appraisal_rov_closed,
    appraisal_value_updated]
  rule: >-
    Where rov_allowed is true the borrower may ask the appraiser to reconsider the value. A reconsideration
    of value is accepted only while the order status is delivered. A reconsideration of value is accepted
    only if it is submitted no later than the end of the reconsideration window that starts on the date
    the report was delivered to the borrower. Count calendar days forward from delivered_to_borrower_date,
    which is day zero; a request submitted on the last day of the window is accepted. An order accepts
    at most rov_max_per_order requests (appraisal_msr_rov_count). A request on comparable_sales must include
    at least rov_min_comparables_for_sales_basis and no more than rov_max_comparables alternative sales;
    one that does not is returned_incomplete, does not count against the limit and does not reopen the
    order. A request raising valuation_bias is accepted on the same terms and is also referred to Larkspur's
    fair lending officer. The appraiser responds within rov_response_business_days. A value_changed decision
    updates appraised_value to revised_value; a value_unchanged decision leaves it. The borrower is never
    charged (rov_fee) and Larkspur never asks the appraiser to hit a target value.
  eligibility:
  - id: rov_on_delivered_report
    applies_to: [appraisal_rov_submitted]
    kind: state
    condition: A reconsideration of value is accepted only while the order status is delivered.
    evidence_fields: [appraisal_orders.status, appraisal_orders.appraisal_order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id005
      action_bindings: *id006
    state_contract:
      field: appraisal_orders.status
      allowed: [delivered]
  - id: rov_within_window
    applies_to: [appraisal_rov_submitted]
    kind: time
    condition: >-
      A reconsideration of value is accepted only if it is submitted no later than the end of the reconsideration
      window that starts on the date the report was delivered to the borrower.
    evidence_fields: [appraisal_orders.delivered_to_borrower_date, appraisal_orders.appraisal_order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id005
      action_bindings: *id006
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the report was delivered to the borrower
      anchor_source: appraisal_orders.delivered_to_borrower_date
      relation: not_after
      duration_source: variants.rov_window_calendar_days
      unit: calendar_days
      counting_rule: >-
        Count calendar days forward from delivered_to_borrower_date, which is day zero; a request submitted
        on the last day of the window is accepted.
      boundary: inclusive
  measures: [appraisal_msr_rov_count]
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop): {rov_max_per_order: =rov_max_per_order}
      Larkspur Exterior-Only Appraisal (Form 2055): {rov_max_per_order: =rov_max_per_order}
      Larkspur Condominium Appraisal (Form 1073): {rov_max_per_order: =rov_max_per_order}
      Larkspur Single-Family Appraisal (Form 1004): {rov_max_per_order: =rov_max_per_order}
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA): {rov_max_per_order: =rov_max_per_order}
      Larkspur Small Residential Income Appraisal (Form 1025): {rov_max_per_order: =rov_max_per_order}
      Larkspur Complex Property Appraisal (Form 1004 Jumbo): {rov_max_per_order: =rov_max_per_order}
- id: appraisal_validity_and_update
  subject: [appraisal_ordered, appraisal_fee_charged]
  rule: >-
    A report may support the note only while its age, in calendar days from inspection_date to the note
    date, is at most validity_days. Between validity_days and max_age_with_update_days a Form 1004D update
    by the original appraiser keeps it usable and is charged reinspection_fee; a report type whose max_age_with_update_days
    is 0 cannot be updated. Past max_age_with_update_days, or where no update is possible, a new order
    is placed with order_reason new_order_after_expiration and charged in full. A value subject to completion
    or repairs (subject_to_completion true) also needs a Form 1004D completion inspection before funding,
    charged reinspection_fee.
  eligibility: []
- id: appraisal_hpml_flip_second_appraisal
  subject: [appraisal_ordered, appraisal_fee_charged]
  rule: >-
    For a purchase on a loan file flagged as a higher-priced mortgage loan (hpml_flag true), Regulation
    Z requires a second full interior appraisal by a different appraiser when the seller acquired the
    property no more than flip_short_window_days days before the purchase contract and the contract price
    exceeds seller_acquisition_price by more than flip_short_window_increase_pct percent, or acquired
    it flip_short_window_days plus one to flip_long_window_days days before and the price exceeds it by
    more than flip_long_window_increase_pct percent. That second order uses order_reason second_appraisal_hpml_flip
    and the borrower is never charged for it. A file that is not HPML, a refinance, or a price increase
    at or below the percentage needs no second appraisal under this rule.
  eligibility: []
- id: appraisal_cancellation_and_hold
  subject: [appraisal_cancelled, appraisal_held, appraisal_released]
  rule: >-
    Only the borrower can cancel an order they are paying for; the system cancels it when the loan file
    is withdrawn, denied or closed, and when the order has been on hold for more than hold_auto_cancel_calendar_days
