events:
- type: buydown_elected
  target: buydowns
  mutation: create
  meaning: a buydown is elected on a loan file
  grain: one row per buydown
  fields: {customer_id: borrower (foreign key -> customers), loan_file_id: loan file bought down (foreign
      key -> loan_files), variant_name: 'buydown product, written as the official product name', status: 'lifecycle
      status (basis: buydown lifecycle.states)', funding_source: who pays for the buydown, elected_date: date
      the buydown was elected, note_rate: note rate of the loan the buydown applies to, loan_amount: total
      loan amount the buydown is computed on, opened_date: date the buydown record was opened}
  triggers: []
- type: buydown_approved
  target: buydowns
  mutation:
    transition: {from: elected, to: approved}
  meaning: the buydown is approved and its cost fixed
  grain: one row per buydown
  fields:
    status: 'lifecycle status (basis: buydown lifecycle.states)'
    monthly_pi_note_rate: monthly principal and interest at the note rate
    subsidy_amount: >-
      temporary buydown subsidy required (sum of the monthly payment reductions); 0.00 for permanent buydowns
    points_cost: cost of the discount points for a permanent buydown; 0.00 for temporary buydowns
  triggers: []
- type: buydown_terms_updated
  target: buydowns
  mutation: update
  meaning: the note rate or loan amount changes and the cost is recomputed
  grain: one row per buydown
  fields:
    note_rate: note rate of the loan the buydown applies to
    loan_amount: total loan amount the buydown is computed on
    monthly_pi_note_rate: monthly principal and interest at the note rate
    subsidy_amount: >-
      temporary buydown subsidy required (sum of the monthly payment reductions); 0.00 for permanent buydowns
    points_cost: cost of the discount points for a permanent buydown; 0.00 for temporary buydowns
  triggers: []
- type: buydown_funded
  target: buydowns
  mutation:
    transition: {from: approved, to: funded}
  meaning: the buydown is paid for at consummation
  grain: one row per buydown
  fields: {status: 'lifecycle status (basis: buydown lifecycle.states)', funded_date: date the subsidy
      or points were paid at closing; empty until funded, first_payment_date: 'first payment due date
      of the loan, from which subsidy draws begin; empty until funded'}
  triggers:
  - event: buydown:buydown_subsidy_funded
    map: {entry_date: funded_date}
- type: buydown_completed
  target: buydowns
  mutation:
    transition: {from: funded, to: completed}
  meaning: the buydown has run its course
  grain: one row per buydown
  fields: {status: 'lifecycle status (basis: buydown lifecycle.states)', closed_date: 'date it reached
      completed, terminated_early or cancelled; empty otherwise'}
  triggers: []
- type: buydown_terminated_early
  target: buydowns
  mutation:
    transition: {from: funded, to: terminated_early}
  meaning: the loan ends while subsidy remains
  grain: one row per buydown
  fields: {status: 'lifecycle status (basis: buydown lifecycle.states)', closed_date: 'date it reached
      completed, terminated_early or cancelled; empty otherwise'}
  triggers:
  - {event: 'buydown:buydown_subsidy_refunded'}
- type: buydown_cancelled
  target: buydowns
  mutation:
    transition:
    - {from: elected, to: cancelled}
    - {from: approved, to: cancelled}
  meaning: the buydown is cancelled before consummation
  grain: one row per buydown
  fields: {status: 'lifecycle status (basis: buydown lifecycle.states)', closed_date: 'date it reached
      completed, terminated_early or cancelled; empty otherwise'}
  triggers: []
- type: buydown_subsidy_funded
  target: buydown_subsidy_ledger
  meaning: the subsidy is deposited to the custodial account at consummation
  grain: one row per subsidy deposit
  distinguish_by: [entry_date]
  fields: {buydown_id: buydown (foreign key -> buydowns), customer_id: borrower (foreign key -> customers),
    amount: 'entry amount, positive', entry_date: date booked}
  account: buydown_subsidy
  direction: in
  triggers: []
- type: buydown_subsidy_drawn
  target: buydown_subsidy_ledger
  meaning: the subsidy pays the reduction on one monthly payment
  grain: one row per subsidized payment
  distinguish_by: [payment_number]
  fields: {buydown_id: buydown (foreign key -> buydowns), customer_id: borrower (foreign key -> customers),
    amount: 'entry amount, positive', entry_date: date booked, payment_number: loan payment number a draw
      supports (1 = first payment); 0 on funding and refund entries}
  account: buydown_subsidy
  direction: out
  triggers: []
- type: buydown_subsidy_refunded
  target: buydown_subsidy_ledger
  meaning: subsidy left at payoff or refinance, or overfunded, is paid out
  grain: one row per refund
  distinguish_by: [refund_reason, entry_date]
  fields:
    buydown_id: buydown (foreign key -> buydowns)
    customer_id: borrower (foreign key -> customers)
    amount: entry amount, positive
    entry_date: date booked
    refund_reason: why subsidy left other than by a draw; none on funding and draws
    source_entry_id: >-
      for a refund, the funding entry it returns (foreign key -> buydown_subsidy_ledger); empty otherwise
  account: buydown_subsidy
  direction: out
  triggers: []
measures:
- id: buydown_msr_buydowns_on_file
  window: current state at frozen time, per loan file
  measure: >-
    the buydowns with the same loan_file_id whose status is elected, approved, funded or completed, with
    their buydown_type
policies:
- id: buydown_agg_multi_holding
  subject: [buydown_elected]
  rule: >-
    A customer may hold buydowns on several loan files (max_per_customer is unlimited); the per-file policy
    limits what one loan file may carry.
  eligibility: []
  params: {max_per_customer: null}
- id: buydown_agg_per_file
  subject: [buydown_elected, buydown_approved]
  rule: >-
    A loan file may carry only one temporary buydown and only one permanent buydown in elected, approved,
    funded or completed status. A temporary and a permanent buydown combine on one file only where combinable_with_permanent
    is true for the temporary product; the permanent points then lower the note rate first and the temporary
    reductions apply to the bought-down note rate (buydown_msr_buydowns_on_file). Seller or builder money
    for both counts together toward the interested party cap of the loan.
  eligibility:
  - id: one_per_type_per_file
    applies_to: [buydown_elected]
    kind: dedup
    condition: >-
      A loan file may carry only one temporary buydown and only one permanent buydown in elected, approved,
      funded or completed status.
    evidence_fields: [buydowns.loan_file_id, buydowns.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [buydowns.loan_file_id]
      action_bindings: {buydowns.loan_file_id: loan_file_id}
    dedup_contract:
      table: buydowns
      mode: separate_record
      object_bindings: {loan_file_id: loan_file_id}
      duplicate_filters:
        status: [elected, approved, funded, completed]
      distinct_fields: [variant_name]
  measures: [buydown_msr_buydowns_on_file]
- id: buydown_eligibility
  subject: [buydown_elected, buydown_approved, buydown_cancelled]
  rule: >-
    A buydown is elected only while the loan file status is processing, underwriting, conditionally_approved
    or suspended. Once the file is cleared to close the buydown can no longer be added. The file must
    meet eligible_loan_programs, eligible_loan_purposes, eligible_occupancies, eligible_property_types,
    min_credit_score, max_ltv_pct and min_loan_term_months, and the payer must be in allowed_funding_sources;
    a seller or builder payer needs a purchase contract addendum, and a temporary buydown needs a buydown
    agreement signed by the borrower and the payer. The borrower is always qualified at the note rate
    (qualifying_rate_basis), never at a reduced rate. A buydown may be cancelled by the borrower until
    consummation without fee; a change after the Closing Disclosure needs a corrected disclosure.
  eligibility:
  - id: elect_before_ctc
    applies_to: [buydown_elected]
    kind: state
    condition: >-
      A buydown is elected only while the loan file status is processing, underwriting, conditionally_approved
      or suspended.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_files.loan_file_id]
      action_bindings: {loan_files.loan_file_id: loan_file_id}
    state_contract:
      field: loan_files.status
      allowed: *id007
- id: buydown_cost
  subject: [buydown_approved, buydown_terms_updated]
  rule: >-
    For a temporary buydown, monthly_pi_note_rate is the fully amortizing payment of loan_amount at note_rate
    over the loan term; for each subsidized month the reduced payment is computed at note_rate less that
    year's reduction (never below rate_floor_pct) and the difference is rounded to monthly_difference_rounding_decimals;
    subsidy_amount is the sum of those differences over 12 months per buydown year, and may not exceed
    max_subsidy_pct_of_loan of loan_amount. For a permanent buydown points_cost is discount_points times
    loan_amount divided by 100, rounded to the cent, and the note rate is lowered by permanent_rate_reduction_pct;
    the points count toward qm_points_fees_cap_pct with the other points and fees, and a buydown that
    would push the loan over the cap is refused. Whenever the note rate or loan amount changes before
    consummation (relock_recompute) the cost is recomputed in the same update.
  eligibility: []
  formula: {points_cost: 'round(discount_points * loan_amount / 100, 2)'}
  params:
    per_tier:
      Larkspur 1-0 Temporary Buydown: {year1_rate_reduction_pct: =year1_rate_reduction_pct, year2_rate_reduction_pct: =year2_rate_reduction_pct,
        year3_rate_reduction_pct: =year3_rate_reduction_pct, discount_points: =discount_points}
      Larkspur 1-1 Temporary Buydown: {year1_rate_reduction_pct: =year1_rate_reduction_pct, year2_rate_reduction_pct: =year2_rate_reduction_pct,
        year3_rate_reduction_pct: =year3_rate_reduction_pct, discount_points: =discount_points}
      Larkspur 2-1 Temporary Buydown: {year1_rate_reduction_pct: =year1_rate_reduction_pct, year2_rate_reduction_pct: =year2_rate_reduction_pct,
        year3_rate_reduction_pct: =year3_rate_reduction_pct, discount_points: =discount_points}
      Larkspur 3-2-1 Temporary Buydown: {year1_rate_reduction_pct: =year1_rate_reduction_pct, year2_rate_reduction_pct: =year2_rate_reduction_pct,
        year3_rate_reduction_pct: =year3_rate_reduction_pct, discount_points: =discount_points}
      Larkspur One-Point Permanent Buydown: {year1_rate_reduction_pct: =year1_rate_reduction_pct, year2_rate_reduction_pct: =year2_rate_reduction_pct,
        year3_rate_reduction_pct: =year3_rate_reduction_pct, discount_points: =discount_points}
      Larkspur Two-Point Permanent Buydown: {year1_rate_reduction_pct: =year1_rate_reduction_pct, year2_rate_reduction_pct: =year2_rate_reduction_pct,
        year3_rate_reduction_pct: =year3_rate_reduction_pct, discount_points: =discount_points}
      Larkspur Three-Point Permanent Buydown: {year1_rate_reduction_pct: =year1_rate_reduction_pct, year2_rate_reduction_pct: =year2_rate_reduction_pct,
        year3_rate_reduction_pct: =year3_rate_reduction_pct, discount_points: =discount_points}
- id: buydown_interested_party
  subject: [buydown_approved]
  rule: >-
    When the payer is in ipc_funding_sources, the subsidy or points cost is an interested party contribution
    and is added to the seller and agent concessions recorded on the loan file for the program's interested
    party cap; if the total would exceed the cap, the buydown is approved only after the concessions are
    reduced to fit. Larkspur-funded buydowns are lender credits, limited to lender_funding_source_cap,
    and do not count toward the cap.
  eligibility: []
- id: buydown_funding
  subject: [buydown_funded, buydown_subsidy_funded]
  rule: >-
    An approved buydown is funded at consummation (funding_timing): the payer's subsidy is deposited in
    full to the custodial account, or the points are paid on the Closing Disclosure. first_payment_date
    is the loan's first payment date. A permanent buydown has nothing to draw and completes once funded.
    Subsidy funded above subsidy_amount is refunded to the payer as overfunded.
  eligibility: []
- id: buydown_draws
  subject: [buydown_subsidy_drawn, buydown_completed]
  rule: >-
    Each monthly payment from the first payment for 12 times buydown_years payments draws that month's
    computed difference from the custodial account. The borrower is reminded payment_change_notice_days
    days before each yearly step-up. After the last subsidized payment the balance is zero and the buydown
    is completed.
  eligibility: []
- id: buydown_early_termination
  subject: [buydown_terminated_early, buydown_subsidy_refunded]
  rule: >-
    If the loan is paid off or refinanced while subsidy remains, the remaining subsidy_balance is credited
    to the borrower (unused_subsidy_treatment), never returned to the seller or builder; on an approved
    assumption it follows the loan instead (transfer_on_assumption). Points of a permanent buydown are
    never refunded (points_refundable is false).
  eligibility: []
