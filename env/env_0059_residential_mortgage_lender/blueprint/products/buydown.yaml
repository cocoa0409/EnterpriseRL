category: buydown
display_name: Interest Rate Buydown
binding:
  holding_table: buydowns
  event_tables: [buydown_subsidy_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {subsidy_balance: buydown_subsidy}
lifecycle:
  states: [elected, approved, funded, completed, terminated_early, cancelled]
  transitions:
  - {from: elected, to: approved, by: agent, means: 'eligibility, payer and amount are confirmed'}
  - {from: elected, to: cancelled, by: user, means: the borrower drops the buydown before approval}
  - {from: approved, to: cancelled, by: user, means: the borrower drops the buydown before consummation}
  - {from: elected, to: cancelled, by: system, means: the loan file is withdrawn or denied}
  - {from: approved, to: cancelled, by: system, means: the loan file is withdrawn or denied}
  - {from: approved, to: funded, by: system, means: the subsidy or points are paid at consummation}
  - {from: funded, to: completed, by: system, means: 'the last subsidized payment is drawn, or a permanent
      buydown is funded'}
  - {from: funded, to: terminated_early, by: system, means: the loan is paid off or refinanced while subsidy
      remains}
accounts:
- {key: buydown_subsidy, unit: USD, meaning: temporary buydown subsidy held in the custodial account and
    not yet drawn or refunded}
parameter_schema:
  buydown_type: >-
    temporary (payment subsidy for the first years) or permanent (discount points lowering the note rate)
  year1_rate_reduction_pct: reduction of the payment rate below the note rate in loan year 1; percent,
    3 decimals
  year2_rate_reduction_pct: reduction in loan year 2; percent, 3 decimals
  year3_rate_reduction_pct: reduction in loan year 3; percent, 3 decimals
  buydown_years: loan years with a temporary payment reduction; integer (0 for permanent)
  max_annual_step_up_pct: largest yearly increase of the payment rate; percent, 3 decimals
  permanent_rate_reduction_pct: note rate reduction bought by the points; percent, 3 decimals (0.000 for
    temporary)
  discount_points: points paid for a permanent buydown; points, 3 decimals (0.000 for temporary)
  eligible_loan_programs: loan programs the buydown may be used with; list
  eligible_loan_purposes: loan purposes; list
  eligible_occupancies: occupancies; list
  eligible_property_types: property types; list
  min_credit_score: minimum representative credit score; integer
  max_ltv_pct: maximum base-loan-to-value; percent, 2 decimals
  allowed_funding_sources: who may pay for it; list
  ipc_funding_sources: funding sources counted as interested party contributions; list
  qualifying_rate_basis: 'rate the borrower is qualified at: note_rate'
  monthly_difference_rounding_decimals: decimal places for each month's payment difference; integer
  subsidy_holder: 'where the subsidy is held after closing: custodial_account (none for permanent)'
  subsidy_draw_frequency: 'how the subsidy is drawn: monthly_with_payment (none for permanent)'
  unused_subsidy_treatment: 'what happens to subsidy left at payoff or refinance: credited_to_borrower'
  election_allowed_file_statuses: loan file statuses in which the buydown may be elected; list
  requires_contract_addendum: whether a seller or builder funded buydown needs a purchase contract addendum;
    boolean
  requires_buydown_agreement: whether the borrower signs a buydown agreement; boolean
  change_after_cd_requires_corrected_cd: whether a change after the Closing Disclosure needs a corrected
    disclosure; boolean
  cancellation_fee: fee to cancel before closing; USD
  cancellation_allowed_until: 'last point at which the buydown can be cancelled: consummation'
  points_refundable: whether permanent buydown points are refundable after closing; boolean
  qm_points_fees_cap_pct: >-
    points and fees cap for a qualified mortgage that the points count toward; percent, 2 decimals
  points_count_toward_qm_cap: whether the points count toward the qualified mortgage cap; boolean
  apr_reflects_buydown_when_third_party: >-
    whether the disclosed APR reflects the reduced payments when a seller or builder funds the buydown;
    boolean
  disclosed_as: >-
    where the cost appears on the Closing Disclosure: seller_or_builder_credit, lender_credit or discount_points
  funding_timing: 'when funds are collected: at_consummation'
  draw_start: 'first payment the subsidy supports: first_payment'
  payment_change_notice_days: days before each yearly step-up that the borrower is notified; integer (0
    for permanent)
  min_loan_term_months: minimum loan term; integer months
  max_subsidy_pct_of_loan: largest subsidy as a percent of the loan amount; percent, 2 decimals
  relock_recompute: >-
    whether a change of note rate or loan amount recomputes the subsidy or points cost; boolean
  overfunding_refund: whether subsidy funded above the computed amount is refunded to the payer; boolean
  combinable_with_permanent: whether a temporary buydown can be combined with a permanent one on the same
    file; boolean
  lender_funding_source_cap: largest amount Larkspur itself funds; USD
  max_points_per_loan: most discount points accepted on a loan; points, 3 decimals
  price_per_point_basis: 'dollar basis of one point: loan_amount'
  rate_floor_pct: lowest payment rate any year may reach; percent, 3 decimals
  payment_shock_disclosure_required: whether the borrower receives a payment schedule showing every step-up;
    boolean
  transfer_on_assumption: whether the remaining subsidy follows the loan on an approved assumption; boolean
  eligible_with_arm: whether it may be used on an adjustable-rate loan; boolean
  buydown_agreement_signer: 'who must sign the buydown agreement: borrower_and_payer'
