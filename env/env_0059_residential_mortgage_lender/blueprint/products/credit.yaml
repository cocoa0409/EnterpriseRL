category: credit
display_name: Closing Cost Credit
binding:
  holding_table: closing_credits
  event_tables: [credit_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {credit_balance: credit_value}
lifecycle:
  states: [reserved, verified, applied, expired, forfeited, revoked]
  transitions:
  - {from: reserved, to: verified, by: agent, means: eligibility documents are verified and the award
      amount is fixed}
  - {from: reserved, to: revoked, by: agent, means: verification fails or is not completed in time}
  - {from: verified, to: revoked, by: agent, means: a program or loan change makes the file ineligible
      before closing}
  - {from: reserved, to: expired, by: system, means: the expiration date passes before the credit is applied}
  - {from: verified, to: expired, by: system, means: the expiration date passes before the verified credit
      is applied}
  - {from: reserved, to: forfeited, by: system, means: 'the loan file is withdrawn, denied or closed'}
  - {from: verified, to: forfeited, by: system, means: 'the loan file is withdrawn, denied or closed'}
  - {from: verified, to: applied, by: system, means: the credit is applied on the Closing Disclosure at
      consummation}
accounts:
- {key: credit_value, unit: USD, meaning: closing cost credit awarded to the borrower and still available
    to apply at closing}
parameter_schema:
  credit_amount_type: 'how the award is sized: fixed, pct_of_base_loan or guarantee_payout'
  fixed_credit_amount: award for a fixed credit; USD (0.00 where the credit is not fixed)
  credit_pct_of_base_loan: >-
    award as a percent of the base loan amount for a percentage credit; percent, 3 decimals (0.000 where
    not a percentage credit)
  min_credit_amount: floor applied to a percentage award; USD
  credit_cap: maximum award; USD
  guarantee_payout_amount: credit owed when the closing guarantee is breached; USD (0.00 for other programs)
  eligible_loan_programs: loan programs the credit can be used with; list of official loan program names
  eligible_loan_purposes: loan purposes the credit can be used with; list
  eligible_occupancies: occupancies the credit can be used with; list
  min_credit_score: minimum representative credit score on the file; integer
  max_base_loan_amount: largest base loan amount the credit can be used with; USD
  requires_first_time_homebuyer: whether every borrower must be a first-time homebuyer; boolean
  requires_homebuyer_education: whether a homebuyer education certificate must be on file before verification;
    boolean
  max_income_pct_ami: maximum qualifying income as a percent of area median income; integer or no_limit
  eligible_tract_income_levels: census tract income levels that qualify the property; list
  geography_income_test: >-
    how the tract and income tests combine: none, income_only, tract_or_income or tract_and_income
  eligible_occupations: occupations that qualify; list (empty where occupation is not a test)
  requires_prior_larkspur_loan: whether the borrower must have a previously consummated Larkspur loan;
    boolean
  prior_loan_lookback_months: >-
    calendar months back from the reservation date within which the prior Larkspur loan must have closed;
    integer (0 where not a test)
  requires_partner_builder: whether the purchase must be a new home from a Larkspur partner builder; boolean
  funding_source: 'who funds the credit: larkspur or builder'
  counts_toward_ipc: >-
    whether the credit is an interested party contribution counted with seller and agent concessions;
    boolean
  reservation_allowed_file_statuses: loan file statuses in which the credit may be reserved; list
  verification_documents: documents needed to verify eligibility; list
  verification_deadline_days: calendar days after reservation by which eligibility must be verified; integer
  award_validity_days: calendar days after the reservation date until expiration; integer
  max_extensions: validity extensions allowed; integer
  extension_days: calendar days added by one extension; integer (0 where no extension)
  extension_allowed_file_statuses: loan file statuses in which an extension may be granted; list
  applicable_cost_categories: Closing Disclosure cost categories the credit may pay, in the order they
    are filled; list
  application_order: >-
    position of the credit when several credits are applied on one Closing Disclosure (1 is applied first);
    integer
  cash_back_allowed: whether unused credit may be paid to the borrower in cash; boolean
  unused_balance_treatment: 'what happens to credit that finds no eligible cost: forfeited'
  exclusive_group: programs in the same group cannot both be on one loan file; group name or none
  stackable_with: >-
    other credit programs this credit may be combined with on one loan file; list of official names
  repayment_required: whether the credit must be repaid on sale or refinance; boolean
  occupancy_certification_months: >-
    months the borrower certifies they will occupy the home; integer (0 where no certification)
  guarantee_enrollment_window_business_days: >-
    business days after the application date within which the guarantee must be enrolled; integer (0 where
    not a guarantee)
  guarantee_min_days_application_to_closing: >-
    minimum calendar days between application date and contract closing date for guarantee enrollment;
    integer
  guarantee_docs_deadline_days: >-
    calendar days before the guaranteed closing date by which the borrower must deliver every requested
    document; integer
  guarantee_excluded_delay_causes: causes of a late closing that never trigger a payout; list
  guarantee_payout_method: 'how a payout is delivered: lender_credit_at_closing'
  min_borrower_contribution: minimum borrower funds toward the purchase from their own resources; USD
  max_purchase_price: highest purchase price the credit can be used with; USD
  eligible_property_types: property types the credit can be used with; list
  reservation_channels: how a credit may be reserved; list (loan_officer, online_portal)
  program_change_retest: >-
    whether a loan program or amount change re-tests the credit's eligibility before closing; boolean
  annual_reservations_per_customer: credits of this program one customer may reserve in a calendar year;
    integer
