category: funding
display_name: Closing and Funding
binding:
  holding_table: closings
  event_tables: [funding_wires, funding_interest_ledger, funding_fee_ledger, funding_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {prepaid_interest_balance: prepaid_interest, funded_balance: disbursed_funds, closing_fee_balance: closing_fees}
lifecycle:
  states: [scheduled, docs_out, signed, in_rescission, funded, rescinded, cancelled]
  transitions:
  - {from: scheduled, to: docs_out, by: agent, means: the closing package is drawn and sent to the settlement
      agent}
  - {from: docs_out, to: scheduled, by: agent, means: the drawn package expired or had to be redrawn and
      the signing is set again}
  - {from: docs_out, to: signed, by: system, means: the borrower signs the note and security instrument}
  - {from: scheduled, to: cancelled, by: user, means: the borrower cancels the closing before documents
      are drawn}
  - {from: docs_out, to: cancelled, by: user, means: the borrower cancels the closing after documents
      are drawn}
  - {from: scheduled, to: cancelled, by: system, means: the loan file is withdrawn or denied}
  - {from: docs_out, to: cancelled, by: system, means: the loan file is withdrawn or denied}
  - {from: signed, to: in_rescission, by: system, means: a rescindable transaction enters its rescission
      period at signing}
  - {from: signed, to: funded, by: agent, means: funding is released for a transaction without rescission}
  - {from: in_rescission, to: funded, by: agent, means: funding is released after the rescission period
      expires}
  - {from: in_rescission, to: rescinded, by: user, means: the borrower exercises the right of rescission}
  - {from: funded, to: signed, by: system, means: the settlement agent returns the wire before disbursing
      it}
accounts:
- {key: prepaid_interest, unit: USD, meaning: per diem interest collected at closing and not refunded}
- {key: disbursed_funds, unit: USD, meaning: loan proceeds wired to the settlement agent and not returned}
- key: closing_fees
  unit: USD
  meaning: >-
    closing method, courier, wire, redraw and review fees charged to the borrower and not reversed
parameter_schema:
  eligible_property_states: states in which this closing method is offered; list of USPS codes
  eligible_loan_programs: loan programs that may close by this method; list of official names
  eligible_loan_purposes: loan purposes that may close by this method; list
  wet_funding: >-
    whether funds are wired at signing (true) or after the signed package is reviewed (false); boolean
  requires_in_person_notary: whether a notary is physically present at signing; boolean
  enote: whether the note is signed electronically as an eNote; boolean
  esign_consent_required: whether E-SIGN consent must be on file before documents are drawn; boolean
  recording_method: 'how the security instrument is recorded: paper or e_recording'
  closing_method_fee: fee for the closing method itself (mobile notary or remote notarization platform);
    USD
  after_hours_signing_fee: >-
    added fee for a signing on a weekday evening, Saturday or Sunday; USD (0.00 where not offered)
  after_hours_available: whether after-hours signings are offered; boolean
  courier_fee: overnight courier fee for shipping documents both ways; USD
  wire_fee: fee for the outgoing funding wire; USD
  poa_review_fee: fee to review a power of attorney; USD
  doc_redraw_fee: fee to redraw an expired or changed closing package when the change is the borrower's;
    USD
  reschedule_fee: fee to move a signing before documents are drawn; USD
  docs_draw_lead_business_days: business days before the scheduled closing date by which documents are
    drawn; integer
  docs_validity_calendar_days: calendar days after the draw date through which the package may be signed;
    integer
  poa_approval_business_days_before_closing: >-
    business days before the scheduled closing date by which the power of attorney must be approved; integer
    (0 where not used)
  max_signers_per_session: most borrowers and title holders who can sign in one session; integer
  notary_travel_radius_miles: distance a mobile notary travels without a surcharge; integer miles (0 where
    not mobile)
  closing_package_review_business_days: >-
    business days Larkspur takes to review a signed package before funding a dry or mail-away closing;
    integer
  funding_business_days_after_signing: business days after signing on which funds are wired when no rescission
    applies; integer
  max_business_days_signing_to_funding: >-
    longest gap allowed between signing and funding before verifications must be redone; integer
  funding_request_cutoff_time: latest time a funding request can be received for a same-day wire; HH:MM
    US Eastern
  wire_cutoff_time: latest time Larkspur releases a same-day wire; HH:MM US Eastern
  ptf_conditions_clear_before_wire: >-
    whether every prior-to-funding condition must be cleared before the wire is released; boolean
  lock_must_cover_disbursement: whether the rate lock must still be in force on the disbursement date;
    boolean
  settlement_agent_approval_required: whether the settlement agent must be on Larkspur's approved list;
    boolean
  closing_protection_letter_required: whether a closing protection letter must be issued for the settlement
    agent; boolean
  per_diem_day_count_basis: days in the year used to compute per diem interest; integer
  per_diem_daily_rounding_decimals: decimal places to which the daily interest amount is rounded; integer
  per_diem_refund_business_days: >-
    business days within which a prepaid interest overcharge is refunded once identified; integer
  post_closing_interest_shortfall_collected: >-
    whether interest under-collected because funding was earlier than estimated is billed after closing;
    boolean
  first_payment_month_offset: >-
    months after the disbursement month in which the first payment falls due, on the first day; integer
  rescission_business_days: specific business days of the right of rescission; integer
  rescission_purposes: loan purposes that carry the right of rescission on a primary residence; list
  rescission_occupancy: occupancy that carries the right of rescission; occupancy value
  funding_days_after_rescission_expiry: >-
    calendar days after the rescission expiration date on which funds may first be wired; integer
  rescission_waiver_requires_emergency_statement: >-
    whether a rescission waiver needs the borrower's dated, signed statement of a bona fide personal financial
    emergency; boolean
  returned_wire_resend_business_days: business days within which a wire returned for a Larkspur-side reason
    is re-sent; integer
  returned_wire_interest_borne_by_larkspur: >-
    whether interest for days lost to a wire returned for a Larkspur-side reason is refunded to the borrower;
    boolean
  dispute_window_calendar_days: >-
    calendar days after the disbursement date within which a funding dispute is accepted; integer
  dispute_acknowledge_business_days: business days within which a funding dispute is acknowledged; integer
  dispute_response_business_days: business days within which a funding dispute is decided; integer
  cancellation_fee: fee when the borrower cancels the closing; USD
  redraw_waived_when_larkspur_caused: >-
    whether the redraw fee is waived when the redraw is caused by a Larkspur change or error; boolean
  reschedules_before_redraw: >-
    times a signing can be moved within the package's validity before a redraw is needed; integer
