category: loan
display_name: Mortgage Loan File
binding:
  holding_table: loan_files
  event_tables: [loan_fee_ledger, loan_disclosures, loan_conditions, loan_tolerance_cures]
  status_field: status
  variant_field: variant_name
  quantity_fields: {prepaid_fee_balance: borrower_paid_fees, tolerance_cure_balance: tolerance_cure}
lifecycle:
  states: [application_received, disclosed, processing, underwriting, conditionally_approved, suspended,
    clear_to_close, consummated, rescinded, withdrawn, denied, closed_incomplete]
  transitions:
  - {from: application_received, to: disclosed, by: system, means: the initial Loan Estimate is issued
      on the file}
  - {from: application_received, to: withdrawn, by: user, means: the borrower withdraws the application
      before any Loan Estimate is issued}
  - {from: application_received, to: denied, by: agent, means: the application is denied before disclosure
      (for example the property is ineligible)}
  - {from: disclosed, to: processing, by: agent, means: the borrower's intent to proceed is received and
      processing begins}
  - {from: disclosed, to: withdrawn, by: user, means: the borrower withdraws after receiving the Loan
      Estimate}
  - from: disclosed
    to: withdrawn
    by: system
    means: >-
      no intent to proceed arrived within the intent-to-proceed window, so the application is treated
      as withdrawn
  - {from: processing, to: underwriting, by: agent, means: the processed file is submitted to underwriting}
  - {from: processing, to: withdrawn, by: user, means: the borrower withdraws during processing}
  - {from: underwriting, to: conditionally_approved, by: agent, means: the underwriter approves the file
      subject to conditions}
  - {from: underwriting, to: suspended, by: agent, means: the underwriter suspends the file for missing
      or unacceptable documentation}
  - {from: underwriting, to: denied, by: agent, means: the underwriter denies the file}
  - {from: underwriting, to: withdrawn, by: user, means: the borrower withdraws during underwriting}
  - {from: conditionally_approved, to: clear_to_close, by: agent, means: every prior-to-documents condition
      is cleared or waived and the file is cleared to close}
  - {from: conditionally_approved, to: suspended, by: agent, means: a prior-to-documents condition went
      past its due date unanswered}
  - {from: conditionally_approved, to: withdrawn, by: user, means: the borrower withdraws after conditional
      approval}
  - {from: suspended, to: underwriting, by: agent, means: the missing documents arrived and the file is
      resubmitted to underwriting}
  - from: suspended
    to: closed_incomplete
    by: system
    means: >-
      the suspense period expired without the documents and the file is closed for incompleteness
  - {from: suspended, to: denied, by: agent, means: on resubmission review the file is denied}
  - {from: suspended, to: withdrawn, by: user, means: the borrower withdraws a suspended file}
  - {from: clear_to_close, to: conditionally_approved, by: agent, means: clear-to-close is rescinded because
      a new prior-to-documents condition was issued}
  - {from: clear_to_close, to: consummated, by: system, means: the borrower signs the note at closing}
  - {from: clear_to_close, to: withdrawn, by: user, means: the borrower withdraws after clear-to-close}
  - {from: consummated, to: rescinded, by: user, means: the borrower exercises the right of rescission
      on a rescindable refinance}
accounts:
- key: borrower_paid_fees
  unit: USD
  meaning: >-
    application and credit report fees the borrower has paid before closing that have not been refunded
    or applied on the Closing Disclosure
- {key: tolerance_cure, unit: USD, meaning: TRID tolerance cure Larkspur owes the borrower and has not
    yet paid}
parameter_schema:
  min_credit_score: >-
    minimum representative credit score to open or move a file into the program; integer FICO points
  max_ltv_purchase_pct: maximum base-loan-to-value for a purchase; percent, 2 decimals
  max_ltv_rate_term_refi_pct: maximum base-loan-to-value for a rate-and-term refinance; percent, 2 decimals
  max_ltv_cash_out_pct: >-
    maximum base-loan-to-value for a cash-out refinance; percent, 2 decimals; 0.00 where cash-out is not
    an eligible purpose
  max_dti_pct: maximum total debt-to-income ratio; percent, 2 decimals
  max_loan_amount: maximum base loan amount; USD
  min_loan_amount: minimum base loan amount; USD
  min_reserves_months: post-closing reserves required, in months of the full housing payment; integer
  eligible_purposes: loan purposes the program accepts; list of loan_purpose values
  eligible_occupancies: occupancies the program accepts; list of occupancy values
  max_units: maximum dwelling units in the subject property; integer
  income_limit_pct_ami: >-
    maximum qualifying income as a percentage of area median income; integer, or the string no_limit
  requires_homebuyer_education: whether a first-time homebuyer file needs a homebuyer education certificate;
    boolean
  loan_term_months: amortization term of the note; integer months
  application_fee: application fee collected after intent to proceed; USD (0.00 means none is charged)
  credit_report_fee_per_borrower: tri-merge credit report fee per borrower pulled; USD
  origination_charge_pct: >-
    flat origination charge as a percent of the base loan amount, disclosed in the zero-tolerance bucket;
    percent, 3 decimals
  underwriting_fee: underwriting fee charged at closing; USD
  processing_fee: processing fee charged at closing; USD
  flood_certification_fee: flood zone determination fee charged at closing; USD
  tax_service_fee: real estate tax service fee charged at closing; USD
  upfront_program_fee_pct: >-
    upfront program fee financed into the loan (FHA upfront MIP, VA funding fee) as a percent of the base
    loan amount; percent, 3 decimals
  annual_program_premium_pct: >-
    annual program premium (FHA annual MIP) as a percent of the average outstanding balance; percent,
    3 decimals
  le_delivery_business_days: >-
    business days after the application date by which the initial Loan Estimate must be delivered or placed
    in the mail; integer
  itp_window_business_days: >-
    business days after the initial Loan Estimate is issued within which the borrower's intent to proceed
    must be received; integer
  mailbox_rule_business_days: >-
    specific business days after mailing on which a mailed disclosure is deemed received; integer
  le_to_consummation_waiting_business_days: >-
    specific business days that must pass between issuing the initial Loan Estimate and consummation;
    integer
  revised_le_receipt_days_before_consummation: >-
    specific business days before consummation by which a revised Loan Estimate must be received; integer
  cd_receipt_business_days_before_consummation: >-
    specific business days between the borrower's receipt of the Closing Disclosure and consummation;
    integer
  coc_redisclosure_business_days: >-
    business days after the changed circumstance is documented within which the revised disclosure must
    be issued; integer
  ten_percent_tolerance_pct: aggregate tolerance allowed on the 10 percent bucket; percent, 2 decimals
  cure_refund_calendar_days_after_consummation: >-
    calendar days after consummation within which a tolerance cure not credited at closing must be refunded;
    integer
  apr_tolerance_regular_pct: >-
    APR increase on a corrected Closing Disclosure beyond which a new waiting period starts (regular transaction);
    percent, 3 decimals
  apr_tolerance_irregular_pct: >-
    the same APR tolerance for an irregular transaction (multiple advances or irregular payment periods);
    percent, 3 decimals
  condition_response_calendar_days: >-
    calendar days after a condition is issued by which the borrower's documents are due; integer
  suspense_expiration_calendar_days: calendar days a file may stay suspended before it is closed for incompleteness;
    integer
  incompleteness_notice_response_days: >-
    calendar days given in the notice of incompleteness for the borrower to complete the file; integer
  credit_document_max_age_days: >-
    maximum age, in calendar days on the expected note date, of income and asset documents; integer
  credit_report_max_age_days: >-
    maximum age, in calendar days, of a credit report for use on a note (also the reuse window for a reissued
    report); integer
  verbal_voe_business_days_before_note: >-
    business days before the note date within which the verbal verification of employment must be completed;
    integer
  underwriting_turn_time_business_days: >-
    service level for the initial underwriting decision after submission; integer business days
  condition_review_turn_time_business_days: service level for reviewing documents received against a condition;
    integer business days
  max_resubmissions_before_senior_review: >-
    resubmissions from suspense allowed before the file must go to a senior underwriter; integer
  large_deposit_threshold: >-
    single deposit size that must be sourced; mapping {basis: monthly_qualifying_income | adjusted_property_value,
    pct: percent}
  gift_funds_allowed: whether documented gift funds may be used for down payment and closing costs; boolean
  min_borrower_own_funds_pct: >-
    minimum contribution from the borrower's own funds as a percent of the purchase price; percent, 2
    decimals
  ipc_cap_ladder: >-
    interested party contribution cap by loan-to-value band for primary residences and second homes; list
    of {max_ltv: percent, cap_pct: percent of the lower of price or value}, first band whose max_ltv is
    at or above the file LTV applies
  ipc_cap_investment_pct: >-
    interested party contribution cap for an investment property; percent, 2 decimals; 0.00 where investment
    property is not an eligible occupancy
  escrow_waiver_allowed: whether the borrower may waive the escrow account; boolean
  escrow_waiver_max_ltv_pct: >-
    maximum LTV at which an escrow waiver is allowed; percent, 2 decimals; 0.00 where waivers are not
    allowed
  escrow_waiver_fee_pct: >-
    price adjustment charged at closing for an escrow waiver, percent of the loan amount; percent, 3 decimals
  hpml_escrow_required_months: minimum months an escrow account must be kept on a higher-priced mortgage
    loan; integer
  application_fee_refundable_on_denial: whether a collected application fee is refunded when Larkspur
    denies the file; boolean
  application_fee_refund_window_business_days: >-
    business days after the application fee entry date within which a borrower withdrawal earns a full
    refund; integer
  application_fee_credited_at_closing: >-
    whether a collected application fee is credited back on the Closing Disclosure at consummation; boolean
