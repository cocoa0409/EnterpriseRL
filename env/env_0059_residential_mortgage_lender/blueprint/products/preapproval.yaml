category: preapproval
display_name: Mortgage Pre-Approval
binding:
  holding_table: preapprovals
  event_tables: [preapproval_letters, preapproval_hold_fees]
  status_field: status
  variant_field: variant_name
  quantity_fields: {hold_fee_balance: rate_hold_fee}
lifecycle:
  states: [requested, issued, expired, converted, declined, withdrawn]
  transitions:
  - {from: requested, to: issued, by: agent, means: the pre-approval is issued at the requested level}
  - {from: requested, to: declined, by: agent, means: the borrower does not qualify at any amount for
      the level}
  - {from: requested, to: withdrawn, by: user, means: the borrower withdraws the request}
  - {from: issued, to: expired, by: system, means: the expiration date passes}
  - {from: expired, to: issued, by: agent, means: an expired pre-approval is renewed after the required
      refresh}
  - {from: issued, to: converted, by: system, means: the borrower applies for a loan under the pre-approval}
  - {from: issued, to: declined, by: agent, means: a material change found on review voids the pre-approval}
  - {from: issued, to: withdrawn, by: user, means: the borrower withdraws the pre-approval}
accounts:
- {key: rate_hold_fee, unit: USD, meaning: 'Lock & Shop rate hold fee Larkspur holds pending closing,
    refund or forfeiture'}
parameter_schema:
  credit_pull_type: 'kind of credit inquiry made: soft or hard'
  income_verified: whether income documents are reviewed before issue; boolean
  assets_verified: whether asset statements are reviewed before issue; boolean
  underwriter_signoff: whether an underwriter signs the approval before issue; boolean
  aus_run_required: whether automated underwriting findings are run before issue; boolean
  eligible_loan_programs: loan programs the level can be sized for; list of official names
  min_credit_score: minimum representative credit score; integer
  dti_cushion_pct: >-
    points of debt-to-income held back below the program maximum when sizing; percent, 2 decimals
  rate_assumption_buffer_pct: points added to the current rate-sheet rate when sizing the payment; percent,
    3 decimals
  property_tax_assumption_pct: annual property tax assumed for sizing, as a percent of price; percent,
    2 decimals
  max_price_rounding_increment: increment to which max_purchase_price is rounded down; USD
  issue_turnaround_business_days: business days from a complete request to issue; integer
  validity_days: calendar days from the issued date to expiration; integer
  renewal_days: calendar days of validity granted by a renewal, counted from the renewal date; integer
  max_renewals: renewals allowed; integer
  credit_refresh_age_days: age in days of the credit report beyond which a renewal needs a new pull; integer
  document_max_age_days: >-
    age in days beyond which reviewed documents must be refreshed at renewal; integer (0 where no documents
    are reviewed)
  renewal_requires_document_refresh: whether a renewal re-reviews income and asset documents older than
    the limit; boolean
  letters_allowed: whether letters may be issued under the level; boolean
  property_specific_letters: whether a letter may name a specific property and offer price; boolean
  letter_amount_may_be_lowered: whether a letter may state a price below max_purchase_price; boolean
  letter_turnaround_business_days: business days to produce a requested letter; integer (0 = same business
    day)
  agent_can_request_letters: whether the named agent may request letters; boolean
  agent_requests_require_authorization: whether agent letter requests need the borrower's sharing authorization
    on file; boolean
  agent_visible_items: what Larkspur may tell an authorized agent; list
  increase_requires_reunderwrite: whether raising max_purchase_price requires the approval to be re-run;
    boolean
  max_increase_pct_without_reunderwrite: >-
    largest raise of max_purchase_price allowed without re-running the approval; percent, 2 decimals
  material_change_credit_score_drop: >-
    fall in credit score that counts as a material change voiding an underwritten approval; integer points
  approval_honored_if_no_material_change: whether the approval is honored at application when no material
    change occurred; boolean
  conversion_reuses_credit_report: >-
    whether the credit report is reused when the pre-approval converts to an application; boolean
  eligible_loan_purposes: loan purposes the level supports; list
  eligible_occupancies: occupancies the level supports; list
  preapproval_fee: fee for the pre-approval itself; USD
  rate_hold_available: whether a Lock & Shop rate hold is offered; boolean
  rate_hold_days: calendar days of the rate hold from the hold date; integer (0 where none)
  rate_hold_fee: fee for the rate hold; USD (0.00 where none)
  rate_hold_fee_credited_at_closing: >-
    whether the hold fee is credited at closing when the loan closes under the held rate; boolean
  rate_hold_fee_refund_if_declined: whether the hold fee is refunded when Larkspur declines the application;
    boolean
  rate_hold_forfeit_if_unused: whether the hold fee is forfeited when the hold expires without an application;
    boolean
  rate_hold_float_down_allowed: whether a held rate may be lowered once if the market improves; boolean
  rate_hold_float_down_min_improvement_pct: rate improvement needed for the one-time hold float-down;
    percent, 3 decimals
  reissue_after_decline_days: >-
    calendar days after a decline before a new request is taken without new information; integer
  hard_pull_disclosure_required: whether the borrower's consent to a hard credit inquiry must be recorded;
    boolean
  max_letters_per_property: letters that may name the same property address; integer
  letter_shows_expiration: whether every letter prints the pre-approval expiration date; boolean
  sizing_uses_program_limits: whether sizing applies the target program's loan limit and DTI maximum;
    boolean
  down_payment_min_pct: minimum planned down payment accepted for sizing; percent, 2 decimals
  gift_funds_count_for_sizing: whether documented gift funds count toward the down payment in sizing;
    boolean
