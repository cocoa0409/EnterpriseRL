events:
- type: preapproval_requested
  target: preapprovals
  mutation: create
  meaning: a borrower asks for a pre-approval at a chosen level
  grain: one row per pre-approval
  fields:
    customer_id: borrower the pre-approval is for (foreign key -> customers)
    agent_customer_id: buyer's real estate agent named by the borrower (foreign key -> customers); empty
      if none
    variant_name: pre-approval level, written as the official level name
    status: 'lifecycle status (basis: preapproval lifecycle.states)'
    target_loan_program: loan program the pre-approval was sized for
    requested_date: date the borrower asked for the pre-approval
    credit_pull_date: date of the credit report the pre-approval rests on
    credit_score: representative credit score from that report
    down_payment_pct: down payment the borrower plans, as a percent of the purchase price
    agent_sharing_authorized: >-
      whether the borrower has authorized Larkspur to share letters and expiration with the named agent
      and to take letter requests from that agent
    renewal_count: number of renewals granted
    opened_date: date the pre-approval record was opened
  triggers: []
- type: preapproval_issued
  target: preapprovals
  mutation:
    transition: {from: requested, to: issued}
  meaning: the pre-approval is issued with its amounts and expiration
  grain: one row per pre-approval
  fields: {status: 'lifecycle status (basis: preapproval lifecycle.states)', issued_date: date the pre-approval
      was issued or last renewed; empty until issued, expiration_date: last day the pre-approval and its
      letters are valid; empty until issued, max_loan_amount: largest base loan amount approved, max_purchase_price: 'largest
      purchase price supported, rounded down to the level''s increment'}
  triggers: []
- type: preapproval_declined
  target: preapprovals
  mutation:
    transition:
    - {from: requested, to: declined}
    - {from: issued, to: declined}
  meaning: the request is declined or the pre-approval voided
  grain: one row per pre-approval
  fields: {status: 'lifecycle status (basis: preapproval lifecycle.states)', closed_date: 'date it reached
      converted, declined or withdrawn; empty otherwise'}
  triggers:
  - event: preapproval:preapproval_letter_voided
    map: {void_reason: preapproval_declined}
- type: preapproval_expired
  target: preapprovals
  mutation:
    transition: {from: issued, to: expired}
  meaning: the pre-approval expires
  grain: one row per pre-approval
  fields: {status: 'lifecycle status (basis: preapproval lifecycle.states)'}
  triggers:
  - event: preapproval:preapproval_letter_voided
    map: {void_reason: preapproval_expired}
- type: preapproval_renewed
  target: preapprovals
  mutation:
    transition: {from: expired, to: issued}
  meaning: an expired pre-approval is renewed
  grain: one row per pre-approval
  fields: {status: 'lifecycle status (basis: preapproval lifecycle.states)', issued_date: date the pre-approval
      was issued or last renewed; empty until issued, expiration_date: last day the pre-approval and its
      letters are valid; empty until issued, credit_pull_date: date of the credit report the pre-approval
      rests on, credit_score: representative credit score from that report, renewal_count: number of renewals
      granted}
  triggers: []
- type: preapproval_converted
  target: preapprovals
  mutation:
    transition: {from: issued, to: converted}
  meaning: the borrower applies for a loan under the pre-approval
  grain: one row per pre-approval
  fields: {status: 'lifecycle status (basis: preapproval lifecycle.states)', closed_date: 'date it reached
      converted, declined or withdrawn; empty otherwise', preapproval_id: primary id of the pre-approval}
  triggers: []
- type: preapproval_withdrawn
  target: preapprovals
  mutation:
    transition:
    - {from: requested, to: withdrawn}
    - {from: issued, to: withdrawn}
  meaning: the borrower withdraws
  grain: one row per pre-approval
  fields: {status: 'lifecycle status (basis: preapproval lifecycle.states)', closed_date: 'date it reached
      converted, declined or withdrawn; empty otherwise'}
  triggers:
  - event: preapproval:preapproval_letter_voided
    map: {void_reason: preapproval_withdrawn}
- type: preapproval_terms_updated
  target: preapprovals
  mutation: update
  meaning: the approved amounts, planned down payment or named agent change
  grain: one row per pre-approval
  fields:
    max_loan_amount: largest base loan amount approved
    max_purchase_price: largest purchase price supported, rounded down to the level's increment
    down_payment_pct: down payment the borrower plans, as a percent of the purchase price
    agent_customer_id: buyer's real estate agent named by the borrower (foreign key -> customers); empty
      if none
    agent_sharing_authorized: >-
      whether the borrower has authorized Larkspur to share letters and expiration with the named agent
      and to take letter requests from that agent
  triggers: []
- type: preapproval_rate_held
  target: preapprovals
  mutation: update
  meaning: a Lock & Shop rate hold is placed or floated down
  grain: one row per pre-approval
  fields: {held_rate: rate held under a Lock & Shop rate hold; empty when none, rate_hold_expiration_date: last
      day of the rate hold; empty when none}
  triggers: []
- type: preapproval_letter_issued
  target: preapproval_letters
  meaning: a pre-approval letter is issued
  grain: one row per letter
  distinguish_by: [letter_seq]
  fields:
    preapproval_id: pre-approval the letter is issued under (foreign key -> preapprovals)
    customer_id: borrower (foreign key -> customers)
    letter_seq: >-
      1 for the first letter under the pre-approval, 2 for the next, and so on (a voiding record repeats
      the voided letter's number)
    letter_date: 'date on the letter (on a void record: the date voided)'
    letter_purchase_price: purchase price stated on the letter
    property_address: >-
      property address on a property-specific letter exactly as on the offer, or TBD for a general letter
    requested_by: who asked for the letter
    recipient_agent_customer_id: >-
      agent the letter was sent to (foreign key -> customers); empty when sent only to the borrower
  triggers: []
- type: preapproval_letter_voided
  target: preapproval_letters
  meaning: an issued letter is voided
  grain: one row per letter voided
  distinguish_by: [source_letter_id]
  fields:
    preapproval_id: pre-approval the letter is issued under (foreign key -> preapprovals)
    customer_id: borrower (foreign key -> customers)
    letter_seq: >-
      1 for the first letter under the pre-approval, 2 for the next, and so on (a voiding record repeats
      the voided letter's number)
    letter_date: 'date on the letter (on a void record: the date voided)'
    void_reason: why a letter was voided; none on issued letters
    source_letter_id: on a void record, the letter voided (foreign key -> preapproval_letters); empty
      otherwise
  triggers: []
- type: preapproval_hold_fee_collected
  target: preapproval_hold_fees
  meaning: the rate hold fee is paid
  grain: one row per hold fee paid
  distinguish_by: [entry_date]
  fields: {preapproval_id: pre-approval holding the rate (foreign key -> preapprovals), customer_id: borrower
      (foreign key -> customers), amount: 'entry amount, positive', entry_date: date booked, payment_method: how
      the money moved}
  account: rate_hold_fee
  direction: in
  triggers: []
- type: preapproval_hold_fee_credited
  target: preapproval_hold_fees
  meaning: the hold fee is credited at closing
  grain: one row per fee credited
  distinguish_by: [source_hold_fee_entry_id]
  fields:
    preapproval_id: pre-approval holding the rate (foreign key -> preapprovals)
    customer_id: borrower (foreign key -> customers)
    amount: entry amount, positive
    entry_date: date booked
    payment_method: how the money moved
    source_hold_fee_entry_id: >-
      for a credit, refund or forfeiture, the fee entry disposed of (foreign key -> preapproval_hold_fees);
      empty on collection
  account: rate_hold_fee
  direction: out
  triggers: []
- type: preapproval_hold_fee_refunded
  target: preapproval_hold_fees
  meaning: the hold fee is refunded
  grain: one row per fee refunded
  distinguish_by: [source_hold_fee_entry_id]
  fields:
    preapproval_id: pre-approval holding the rate (foreign key -> preapprovals)
    customer_id: borrower (foreign key -> customers)
    amount: entry amount, positive
    entry_date: date booked
    payment_method: how the money moved
    source_hold_fee_entry_id: >-
      for a credit, refund or forfeiture, the fee entry disposed of (foreign key -> preapproval_hold_fees);
      empty on collection
  account: rate_hold_fee
  direction: out
  triggers: []
- type: preapproval_hold_fee_forfeited
  target: preapproval_hold_fees
  meaning: the hold fee is forfeited
  grain: one row per fee forfeited
  distinguish_by: [source_hold_fee_entry_id]
  fields:
    preapproval_id: pre-approval holding the rate (foreign key -> preapprovals)
    customer_id: borrower (foreign key -> customers)
    amount: entry amount, positive
    entry_date: date booked
    payment_method: how the money moved
    source_hold_fee_entry_id: >-
      for a credit, refund or forfeiture, the fee entry disposed of (foreign key -> preapproval_hold_fees);
      empty on collection
  account: rate_hold_fee
  direction: out
  triggers: []
measures:
- id: preapproval_msr_recent_decline
  window: rolling reissue_after_decline_days calendar days ending on the frozen-time date
  measure: >-
    count of the customer's preapprovals with status declined whose closed_date falls in the window
- id: preapproval_msr_letters_for_property
  window: the life of the pre-approval up to frozen time
  measure: >-
    count of preapproval_letter_issued records on the pre-approval with the same property_address that
    no void record cancels
policies:
- id: preapproval_agg_multi_holding
  subject: [preapproval_requested]
  rule: >-
    A customer holds at most max_per_customer pre-approval in requested, issued or expired status; a request
    at a different level replaces the current one, which the borrower withdraws first. A new request within
    reissue_after_decline_days of a decline is taken only with new income, asset or credit information
    (preapproval_msr_recent_decline).
  eligibility: []
  params: {max_per_customer: 1}
  measures: [preapproval_msr_recent_decline]
- id: preapproval_issuance
  subject: [preapproval_issued, preapproval_declined, preapproval_requested]
  rule: >-
    A pre-approval is issued only after the level's checks: the credit pull of credit_pull_type with the
    borrower's recorded consent where hard_pull_disclosure_required is true, income and assets reviewed
    where income_verified and assets_verified are true, automated findings where aus_run_required is true,
    and underwriter sign-off where underwriter_signoff is true. The target program must be in eligible_loan_programs,
    the credit score at least min_credit_score and the planned down payment at least down_payment_min_pct.
    max_loan_amount is the largest base loan whose payment at the current rate-sheet rate plus rate_assumption_buffer_pct,
    with taxes at property_tax_assumption_pct, keeps debt-to-income at the program's max_dti_pct less
    dti_cushion_pct, capped at the program's loan limit. max_purchase_price is max_loan_amount divided
    by one minus the down payment fraction, rounded down to max_price_rounding_increment. expiration_date
    is issued_date plus validity_days calendar days. A borrower who fails the checks is declined; there
    is no fee (preapproval_fee).
  eligibility: []
  formula: {max_purchase_price_unrounded: max_loan_amount / (1 - down_payment_pct / 100)}
- id: preapproval_letters
  subject: [preapproval_letter_issued, preapproval_letter_voided]
  rule: >-
    A letter is issued only while the pre-approval status is issued. A letter requested by a real estate
    agent is issued only when the agent is the one named on the pre-approval and the borrower's sharing
    authorization is on file. This applies only where agent_can_request_letters is true; under a Pre-Qualification
    only the borrower or the loan officer can ask. A letter's purchase price may be lower than max_purchase_price
    (letter_amount_may_be_lowered) but never higher. A property-specific letter names the offer address
    and is available only where property_specific_letters is true, with at most max_letters_per_property
    live letters for one address (preapproval_msr_letters_for_property); otherwise the address is TBD.
    Every letter prints the expiration date. Letters are produced within letter_turnaround_business_days.
    An authorized agent may be told only agent_visible_items, never the borrower's income, assets, credit
    score or max_loan_amount. When max_purchase_price is lowered, every live letter above the new amount
    is voided (amount_reduced); expiration, decline and withdrawal void every live letter; a replacement
    letter for the same address voids the one it replaces.
  eligibility:
  - id: letter_on_issued
    applies_to: [preapproval_letter_issued]
    kind: state
    condition: A letter is issued only while the pre-approval status is issued.
    evidence_fields: [preapprovals.status, preapprovals.preapproval_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: &id005
      - [preapprovals.preapproval_id]
      action_bindings: &id006 {preapprovals.preapproval_id: preapproval_id}
    state_contract:
      field: preapprovals.status
      allowed: [issued]
  - id: agent_authorized
    applies_to: [preapproval_letter_issued]
    kind: authorization
    condition: >-
      A letter requested by a real estate agent is issued only when the agent is the one named on the
      pre-approval and the borrower's sharing authorization is on file.
    evidence_fields: [preapprovals.agent_customer_id, preapprovals.agent_sharing_authorized, preapprovals.preapproval_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id005
      action_bindings: *id006
  measures: [preapproval_msr_letters_for_property]
- id: preapproval_expiration_renewal
  subject: [preapproval_expired, preapproval_renewed]
  rule: >-
    A pre-approval expires the day after expiration_date and its letters are void. A renewal is granted
    at most max_renewals times and sets issued_date to the renewal date and expiration_date to the renewal
    date plus renewal_days calendar days. An expired pre-approval is renewed only while its credit report
    is no older than the credit refresh age, counted from the credit pull date; an older report needs
    a new pull first. Count calendar days forward from credit_pull_date, which is day zero; a renewal
    on the last day of the count may reuse the report. Where renewal_requires_document_refresh is true,
    income and asset documents older than document_max_age_days are re-reviewed first. A renewal after
    a new pull re-tests every issuance check and may come back at different amounts.
  eligibility:
  - id: credit_fresh_for_renewal
    applies_to: [preapproval_renewed]
    kind: time
    condition: >-
      An expired pre-approval is renewed only while its credit report is no older than the credit refresh
      age, counted from the credit pull date; an older report needs a new pull first.
    evidence_fields: [preapprovals.credit_pull_date, preapprovals.preapproval_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id005
      action_bindings: *id006
    temporal_basis:
      clock: frozen_time
      anchor_event: the credit pull date
      anchor_source: preapprovals.credit_pull_date
      relation: not_after
      duration_source: variants.credit_refresh_age_days
      unit: calendar_days
      counting_rule: >-
        Count calendar days forward from credit_pull_date, which is day zero; a renewal on the last day
        of the count may reuse the report.
      boundary: inclusive
- id: preapproval_terms_change
  subject: [preapproval_terms_updated]
  rule: >-
    Lowering max_purchase_price is always allowed. Raising it by more than max_increase_pct_without_reunderwrite
    percent, or at all where increase_requires_reunderwrite is true, re-runs the issuance checks on current
    information. Naming or changing the agent and granting or revoking agent_sharing_authorized is the
    borrower's decision alone; an agent cannot add themselves. A credit score drop of material_change_credit_score_drop
    points or more, new debt or an employment change found on review voids an underwritten pre-approval.
  eligibility: []
- id: preapproval_conversion
  subject: [preapproval_converted]
  rule: >-
    A pre-approval converts when the borrower applies for a loan file naming it; only an issued pre-approval
    converts. Where approval_honored_if_no_material_change is true the underwriting decision is honored
    on the loan file unless a material change occurred; where conversion_reuses_credit_report is true
    the pre-approval's credit report is reused while it is valid. An expired pre-approval must be renewed
    before it can convert; a borrower may also apply without one.
  eligibility: []
- id: preapproval_rate_hold
  subject: [preapproval_rate_held, preapproval_hold_fee_collected, preapproval_hold_fee_credited, preapproval_hold_fee_refunded,
    preapproval_hold_fee_forfeited]
  rule: >-
    Only a level with rate_hold_available true offers a rate hold. The hold is placed on payment of rate_hold_fee
    and runs rate_hold_days calendar days from the hold date. If the current rate improves by at least
    rate_hold_float_down_min_improvement_pct, the held rate may be lowered once where rate_hold_float_down_allowed
    is true. The fee is credited at closing when the converted loan closes under the held rate (rate_hold_fee_credited_at_closing),
    refunded when Larkspur declines the application (rate_hold_fee_refund_if_declined), and forfeited
    when the hold expires without an application or the borrower withdraws (rate_hold_forfeit_if_unused).
    A hold fee credit, refund or forfeiture disposes only of a fee entry not already disposed of.
  eligibility:
  - id: hold_fee_once
    applies_to: [preapproval_hold_fee_credited, preapproval_hold_fee_refunded, preapproval_hold_fee_forfeited]
    kind: dedup
    condition: >-
      A hold fee credit, refund or forfeiture disposes only of a fee entry not already disposed of.
    evidence_fields: [preapproval_hold_fees.source_hold_fee_entry_id, preapproval_hold_fees.preapproval_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [preapproval_hold_fees.source_hold_fee_entry_id]
      action_bindings: {preapproval_hold_fees.source_hold_fee_entry_id: source_hold_fee_entry_id}
    dedup_contract:
      table: preapproval_hold_fees
      mode: separate_record
      object_bindings: {source_hold_fee_entry_id: source_hold_fee_entry_id}
      duplicate_filters:
        event_type: [preapproval_hold_fee_credited, preapproval_hold_fee_refunded, preapproval_hold_fee_forfeited]
      distinct_fields: []
  params:
    per_tier:
      Larkspur Pre-Qualification: {rate_hold_fee: =rate_hold_fee, rate_hold_days: =rate_hold_days}
      Larkspur Pre-Approval: {rate_hold_fee: =rate_hold_fee, rate_hold_days: =rate_hold_days}
      Larkspur Verified Pre-Approval: {rate_hold_fee: =rate_hold_fee, rate_hold_days: =rate_hold_days}
      Larkspur Underwritten Pre-Approval: {rate_hold_fee: =rate_hold_fee, rate_hold_days: =rate_hold_days}
      Larkspur Jumbo Underwritten Pre-Approval: {rate_hold_fee: =rate_hold_fee, rate_hold_days: =rate_hold_days}
      Larkspur Lock & Shop Pre-Approval: {rate_hold_fee: =rate_hold_fee, rate_hold_days: =rate_hold_days}
- id: preapproval_withdrawal
  subject: [preapproval_withdrawn]
  rule: >-
    Only the borrower can withdraw a pre-approval or a pending request; an agent asking to cancel it is
    referred to the borrower. Withdrawal voids every live letter and forfeits an unused rate hold fee.
  eligibility: []
