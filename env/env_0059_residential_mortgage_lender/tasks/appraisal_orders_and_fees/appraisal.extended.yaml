events:
- type: appraisal_ordered
  target: appraisal_orders
  mutation: create
  meaning: an appraisal of a chosen report type is ordered for a loan file
  grain: one row per appraisal order
  fields:
    customer_id: borrower on whose loan the appraisal is ordered (foreign key -> customers)
    loan_file_id: loan file the appraisal supports (foreign key -> loan_files)
    variant_name: appraisal report type ordered, written as the official report name
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
    order_reason: 'why the order exists: a first valuation, an appraisal transferred from another lender, a required second appraisal, or a replacement for an expired appraisal'
    ordered_date: date the order was placed with the appraisal management company
    rush_requested: whether the borrower asked for rush turn time at order
    due_date: 'date the completed report is promised: ordered date plus the standard or rush turn time in business days, moved only for borrower-caused access delays'
    gross_living_area_sqft: gross living area of the subject property as reported
    site_acres: site size of the subject property in acres
    seller_acquisition_date: date the seller acquired the subject property, from the title commitment; empty for refinances
    seller_acquisition_price: price the seller paid when acquiring the subject property; empty for refinances
    opened_date: date the order record was opened
  triggers:
  - event: appraisal:appraisal_fee_charged
    when:
      order_reason:
      - standard_order
      - second_appraisal_jumbo
      - new_order_after_expiration
    map:
      fee_component: base_fee
      entry_date: ordered_date
  - event: appraisal:appraisal_fee_charged
    when:
      order_reason: transferred_in
    map:
      fee_component: transfer_review_fee
      entry_date: ordered_date
- type: appraisal_assigned
  target: appraisal_orders
  mutation:
    transition:
      from: ordered
      to: assigned
  meaning: an appraiser accepts the assignment
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
  triggers: []
- type: appraisal_held
  target: appraisal_orders
  mutation:
    transition:
      from: assigned
      to: on_hold
  meaning: the order is put on hold
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
  triggers: []
- type: appraisal_released
  target: appraisal_orders
  mutation:
    transition:
      from: on_hold
      to: assigned
  meaning: the hold is lifted
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
  triggers: []
- type: appraisal_inspected
  target: appraisal_orders
  mutation:
    transition:
      from: assigned
      to: inspected
  meaning: the inspection or desktop analysis is done
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
    inspection_date: date the appraiser inspected the property (or completed the desktop analysis); empty until then
  triggers: []
- type: appraisal_completed
  target: appraisal_orders
  mutation:
    transition:
      from: inspected
      to: completed
  meaning: the completed report is received
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
    completed_date: date the completed report was received by Larkspur; empty until then
    appraised_value: market value concluded in the report as last revised; empty until completed
    cu_risk_score: Collateral Underwriter risk score returned for the report; empty when not scored
    subject_to_completion: whether the value is subject to completion or repairs, requiring a final inspection
  triggers: []
- type: appraisal_delivered
  target: appraisal_orders
  mutation:
    transition:
      from: completed
      to: delivered
  meaning: a copy of the report is delivered to the borrower
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
    delivered_to_borrower_date: date a copy of the completed report was delivered to the borrower; empty until then
  triggers: []
- type: appraisal_rov_opened
  target: appraisal_orders
  mutation:
    transition:
      from: delivered
      to: under_reconsideration
  meaning: a reconsideration of value is sent to the appraiser
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
  triggers: []
- type: appraisal_rov_closed
  target: appraisal_orders
  mutation:
    transition:
      from: under_reconsideration
      to: delivered
  meaning: the reconsideration outcome is delivered
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
  triggers: []
- type: appraisal_cancelled
  target: appraisal_orders
  mutation:
    transition:
    - from: ordered
      to: cancelled
    - from: assigned
      to: cancelled
    - from: on_hold
      to: cancelled
    - from: inspected
      to: cancelled
  meaning: the order is cancelled
  grain: one row per appraisal order
  fields:
    status: 'lifecycle status of the order (basis: appraisal lifecycle.states)'
    closed_date: date the order was cancelled; empty otherwise
  triggers: []
- type: appraisal_due_date_updated
  target: appraisal_orders
  mutation: update
  meaning: the promised delivery date moves because the borrower delayed access
  grain: one row per appraisal order
  fields:
    due_date: 'date the completed report is promised: ordered date plus the standard or rush turn time in business days, moved only for borrower-caused access delays'
  triggers: []
- type: appraisal_value_updated
  target: appraisal_orders
  mutation: update
  meaning: the appraised value changes after a reconsideration or a corrected report
  grain: one row per appraisal order
  fields:
    appraised_value: market value concluded in the report as last revised; empty until completed
  triggers: []
- type: appraisal_fee_charged
  target: appraisal_fee_ledger
  meaning: an appraisal charge is collected from the borrower
  grain: one row per charge component collected on an order
  distinguish_by:
  - fee_component
  - entry_date
  fields:
    appraisal_order_id: order charged (foreign key -> appraisal_orders)
    customer_id: borrower charged or refunded (foreign key -> customers)
    fee_component: which appraisal charge the entry concerns
    amount: entry amount, always positive; event_type gives the direction
    entry_date: date charged or refunded
    payment_method: card or account charged or refunded
    refund_reason: why a refund was issued; none on charges
  account: appraisal_fees
  direction: in
  triggers: []
- type: appraisal_fee_refunded
  target: appraisal_fee_ledger
  meaning: a collected appraisal charge is returned to the borrower
  grain: one row per charge refunded
  distinguish_by:
  - original_fee_entry_id
  fields:
    appraisal_order_id: order charged (foreign key -> appraisal_orders)
    customer_id: borrower charged or refunded (foreign key -> customers)
    fee_component: which appraisal charge the entry concerns
    amount: entry amount, always positive; event_type gives the direction
    entry_date: date charged or refunded
    payment_method: card or account charged or refunded
    original_fee_entry_id: for a refund, the charge entry refunded (foreign key -> appraisal_fee_ledger); empty on charges
    refund_reason: why a refund was issued; none on charges
  account: appraisal_fees
  direction: out
  triggers: []
- type: appraisal_rov_submitted
  target: appraisal_reconsiderations
  meaning: the borrower submits a reconsideration of value
  grain: one row per request
  distinguish_by:
  - submitted_date
  fields:
    appraisal_order_id: order whose value is challenged (foreign key -> appraisal_orders)
    customer_id: borrower who requested the reconsideration (foreign key -> customers)
    rov_basis: ground the borrower raises
    submitted_date: 'date the request was submitted (on a decision record: the submission date of the source request)'
    comparables_count: number of alternative comparable sales the borrower supplied
    decision: outcome; pending on the submission record
  triggers:
  - event: appraisal:appraisal_rov_opened
    when:
      decision: pending
- type: appraisal_rov_decided
  target: appraisal_reconsiderations
  meaning: the appraiser's response to a reconsideration is recorded
  grain: one row per request decided
  distinguish_by:
  - source_rov_id
  fields:
    appraisal_order_id: order whose value is challenged (foreign key -> appraisal_orders)
    customer_id: borrower who requested the reconsideration (foreign key -> customers)
    rov_basis: ground the borrower raises
    submitted_date: 'date the request was submitted (on a decision record: the submission date of the source request)'
    decision: outcome; pending on the submission record
    decided_date: date the appraiser's response was received; empty on the submission record
    revised_value: value after reconsideration when the decision is value_changed; empty otherwise
    source_rov_id: on a decision record, the submission it decides (foreign key -> appraisal_reconsiderations); empty on the submission
  triggers:
  - event: appraisal:appraisal_rov_closed
    when:
      decision:
      - value_changed
      - value_unchanged
  - event: appraisal:appraisal_value_updated
    when:
      decision: value_changed
    map:
      appraised_value: revised_value
measures:
- id: appraisal_msr_rov_count
  window: the life of the appraisal order up to frozen time
  measure: count of appraisal_rov_submitted records on the order whose decision record is not returned_incomplete
- id: appraisal_msr_component_charges
  window: the life of the appraisal order up to frozen time
  measure: for each fee_component, the count of appraisal_fee_charged records on the order not refunded by an appraisal_fee_refunded record
policies:
- id: appraisal_agg_multi_holding
  subject:
  - appraisal_ordered
  rule: A customer may have any number of appraisal orders across loan files and over time (max_per_customer is unlimited); each order belongs to exactly one loan file. Orders on the same file are read together under the per-file order policy.
  eligibility: []
  params:
    max_per_customer: null
- id: appraisal_agg_orders_per_file
  subject:
  - appraisal_ordered
  rule: A loan file may carry only one appraisal order of order_reason standard_order, transferred_in or new_order_after_expiration whose status is not cancelled. A second order on the same file is placed only as second_appraisal_jumbo, when the base loan amount is above second_appraisal_loan_amount_threshold of the primary report type, or as second_appraisal_hpml_flip under the flip policy; a replacement for an appraisal that aged past its usable life is ordered as new_order_after_expiration only after the expired order is cancelled or its age limit has passed. A cancelled order never blocks a new one.
  eligibility:
  - id: one_primary_order_per_file
    applies_to:
    - appraisal_ordered
    kind: dedup
    condition: A loan file may carry only one appraisal order of order_reason standard_order, transferred_in or new_order_after_expiration whose status is not cancelled.
    evidence_fields:
    - appraisal_orders.loan_file_id
    - appraisal_orders.order_reason
    - appraisal_orders.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appraisal_orders.loan_file_id
      action_bindings:
        appraisal_orders.loan_file_id: loan_file_id
    dedup_contract:
      table: appraisal_orders
      mode: separate_record
      object_bindings:
        loan_file_id: loan_file_id
      duplicate_filters:
        status:
        - ordered
        - assigned
        - on_hold
        - inspected
        - completed
        - delivered
        - under_reconsideration
      distinct_fields:
      - order_reason
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop):
        second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold
      Larkspur Exterior-Only Appraisal (Form 2055):
        second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold
      Larkspur Condominium Appraisal (Form 1073):
        second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold
      Larkspur Single-Family Appraisal (Form 1004):
        second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA):
        second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold
      Larkspur Small Residential Income Appraisal (Form 1025):
        second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold
      Larkspur Complex Property Appraisal (Form 1004 Jumbo):
        second_appraisal_loan_amount_threshold: =second_appraisal_loan_amount_threshold
- id: appraisal_report_type_selection
  subject:
  - appraisal_ordered
  rule: 'The report type ordered must fit the loan file: the file''s loan program is in eligible_loan_programs, its property_type in eligible_property_types, its loan_purpose in eligible_loan_purposes, its units no more than max_units, and its base-loan-to-value no more than max_ltv_for_form_pct. Where several report types fit, the default is the interior report for the property: the FHA report for an FHA file, the complex property report for a Jumbo file, the small residential income report for two to four units, the condominium report for a condominium and the single-family report otherwise; a desktop or exterior-only report is used only when it fits and the file''s automated underwriting findings accept it in place of an interior inspection. due_date is ordered_date plus standard_turn_business_days business days, or plus rush_turn_business_days when rush_requested is true and rush_available is true. A business day is Monday through Friday excluding the US federal public holidays observed by the Federal Reserve Banks; Saturdays, Sundays and those holidays are skipped when counting. A transferred report is accepted only where transfer_allowed is true and the report was prepared for the same borrower and property within its validity_days.'
  eligibility: []
- id: appraisal_fee_schedule
  subject:
  - appraisal_fee_charged
  rule: 'Appraisal charges are collected only while the loan file status is processing, underwriting, conditionally_approved, suspended or clear_to_close. This follows from fee_collection_requires_itp: only after the borrower has received the Loan Estimate and given intent to proceed. The base_fee is charged once when the order is placed (orders transferred in are charged transfer_review_fee instead). rush_fee is charged once when the borrower asks for rush and rush_available is true. gla_surcharge is charged once when gross_living_area_sqft is above gla_surcharge_threshold_sqft, and acreage_surcharge once when site_acres is above acreage_surcharge_threshold_acres. rent_schedule_fee is charged once when the loan is for an investment property or qualifying income includes rent from the subject. trip_fee is charged for each kept appointment at which the appraiser could not get into the property; an appointment missed or cut short by the appraiser or the appraisal management company is never charged. reinspection_fee is charged once for each Form 1004D completion or update inspection. Nothing is charged for a reconsideration of value (rov_fee), for the borrower''s copy of the report, for a desk review Larkspur orders when cu_risk_score is above cu_desk_review_threshold (desk_review_chargeable is false), or for an HPML flip second appraisal (hpml_second_appraisal_chargeable is false). Charges are paid by one of fee_payment_methods; there is no stacking or discount between components, each is charged at its own amount.'
  eligibility:
  - id: after_itp_only
    applies_to:
    - appraisal_fee_charged
    kind: state
    condition: Appraisal charges are collected only while the loan file status is processing, underwriting, conditionally_approved, suspended or clear_to_close.
    evidence_fields:
    - loan_files.status
    - loan_files.loan_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loan_files.loan_file_id
      action_bindings:
        loan_files.loan_file_id: loan_file_id
    state_contract:
      field: loan_files.status
      allowed:
      - processing
      - underwriting
      - conditionally_approved
      - suspended
      - clear_to_close
  measures:
  - appraisal_msr_component_charges
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop):
        base_fee: =base_fee
        rush_fee: =rush_fee
        trip_fee: =trip_fee
        reinspection_fee: =reinspection_fee
      Larkspur Exterior-Only Appraisal (Form 2055):
        base_fee: =base_fee
        rush_fee: =rush_fee
        trip_fee: =trip_fee
        reinspection_fee: =reinspection_fee
      Larkspur Condominium Appraisal (Form 1073):
        base_fee: =base_fee
        rush_fee: =rush_fee
        trip_fee: =trip_fee
        reinspection_fee: =reinspection_fee
      Larkspur Single-Family Appraisal (Form 1004):
        base_fee: =base_fee
        rush_fee: =rush_fee
        trip_fee: =trip_fee
        reinspection_fee: =reinspection_fee
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA):
        base_fee: =base_fee
        rush_fee: =rush_fee
        trip_fee: =trip_fee
        reinspection_fee: =reinspection_fee
      Larkspur Small Residential Income Appraisal (Form 1025):
        base_fee: =base_fee
        rush_fee: =rush_fee
        trip_fee: =trip_fee
        reinspection_fee: =reinspection_fee
      Larkspur Complex Property Appraisal (Form 1004 Jumbo):
        base_fee: =base_fee
        rush_fee: =rush_fee
        trip_fee: =trip_fee
        reinspection_fee: =reinspection_fee
- id: appraisal_fee_refund
  subject:
  - appraisal_fee_refunded
  - appraisal_cancelled
  rule: 'Refunds follow the stage the order had reached when it was cancelled, read from its status at cancellation. Cancelled while ordered (no appraiser assigned): every charge is refunded in full (cancelled_before_assignment). Cancelled while assigned or on_hold (no inspection yet): the base fee is refunded less cancellation_fee_after_assignment, which is retained, and every other charge not yet earned (rush, surcharges, rent schedule) is refunded in full (cancelled_before_inspection). Cancelled after inspection: cancellation_fee_after_inspection_pct percent of the base fee is retained, which at 100 means no base fee refund, while unearned rush and add-on charges are refunded. When the order was delivered later than its due_date after the borrower paid for rush, the rush_fee is refunded in full (rush_deadline_missed) even though the report was completed. Any charge collected before intent to proceed is refunded in full (charged_before_intent_to_proceed), and any charge on an HPML flip second appraisal is refunded in full (hpml_second_appraisal_not_chargeable). A refund disposes only of a charge entry that has not already been refunded. Refunds go to the original payment method within fee_refund_business_days business days and name the charge entry they return; a retained cancellation fee is not a separate charge, it is the part of the base fee not refunded.'
  eligibility:
  - id: charge_not_refunded
    applies_to:
    - appraisal_fee_refunded
    kind: dedup
    condition: A refund disposes only of a charge entry that has not already been refunded.
    evidence_fields:
    - appraisal_fee_ledger.original_fee_entry_id
    - appraisal_fee_ledger.appraisal_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appraisal_fee_ledger.original_fee_entry_id
      action_bindings:
        appraisal_fee_ledger.original_fee_entry_id: original_fee_entry_id
    dedup_contract:
      table: appraisal_fee_ledger
      mode: separate_record
      object_bindings:
        original_fee_entry_id: original_fee_entry_id
      duplicate_filters:
        event_type:
        - appraisal_fee_refunded
      distinct_fields: []
  formula:
    base_refund_after_assignment: base_fee - cancellation_fee_after_assignment
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop):
        cancellation_fee_after_assignment: =cancellation_fee_after_assignment
      Larkspur Exterior-Only Appraisal (Form 2055):
        cancellation_fee_after_assignment: =cancellation_fee_after_assignment
      Larkspur Condominium Appraisal (Form 1073):
        cancellation_fee_after_assignment: =cancellation_fee_after_assignment
      Larkspur Single-Family Appraisal (Form 1004):
        cancellation_fee_after_assignment: =cancellation_fee_after_assignment
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA):
        cancellation_fee_after_assignment: =cancellation_fee_after_assignment
      Larkspur Small Residential Income Appraisal (Form 1025):
        cancellation_fee_after_assignment: =cancellation_fee_after_assignment
      Larkspur Complex Property Appraisal (Form 1004 Jumbo):
        cancellation_fee_after_assignment: =cancellation_fee_after_assignment
- id: appraisal_turn_time
  subject:
  - appraisal_assigned
  - appraisal_inspected
  - appraisal_completed
  - appraisal_due_date_updated
  - appraisal_held
  - appraisal_released
  rule: 'The appraisal management company assigns an appraiser within assignment_turn_business_days and the inspection is scheduled within inspection_scheduling_business_days after assignment. An order is put on hold only when the appraiser cannot get access to the property or a required charge is unpaid, and it is released when that is resolved. due_date moves only when the borrower or the borrower''s agent delays access: it moves forward by the number of business days between the first offered inspection date and the inspection date the borrower accepted. Delays by the appraiser or the management company never move due_date. A report whose completed_date is later than its due_date is a late report; the number of calendar days between due_date and completed_date is the appraisal delay that other Larkspur policies rely on.'
  eligibility: []
- id: appraisal_delivery
  subject:
  - appraisal_delivered
  rule: Under the ECOA valuations rule the borrower receives a free copy (borrower_copy_free) of every appraisal and written valuation on the file. The borrower's copy of the report must be delivered no later than the end of the delivery period that starts on the date the report was completed. Count business days forward from completed_date, which is day zero; delivery on the last business day of the period is on time. A business day is Monday through Friday excluding the US federal public holidays observed by the Federal Reserve Banks; Saturdays, Sundays and those holidays are skipped when counting. Independently, the copy must reach the borrower at least delivery_business_days_before_consummation business days before consummation, unless the borrower signed a timing waiver (timing_waiver_signed_date) at least that many business days before consummation, in which case delivery at or before consummation suffices. A revised report after a reconsideration is delivered under the same rule from its own decision date.
  eligibility:
  - id: deliver_promptly
    applies_to:
    - appraisal_delivered
    kind: time
    condition: The borrower's copy of the report must be delivered no later than the end of the delivery period that starts on the date the report was completed.
    evidence_fields:
    - appraisal_orders.completed_date
    - appraisal_orders.appraisal_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appraisal_orders.appraisal_order_id
      action_bindings:
        appraisal_orders.appraisal_order_id: appraisal_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the report was completed
      anchor_source: appraisal_orders.completed_date
      relation: not_after
      duration_source: variants.delivery_business_days_after_completion
      unit: business_days
      counting_rule: Count business days forward from completed_date, which is day zero; delivery on the last business day of the period is on time.
      boundary: inclusive
- id: appraisal_reconsideration_of_value
  subject:
  - appraisal_rov_submitted
  - appraisal_rov_decided
  - appraisal_rov_opened
  - appraisal_rov_closed
  - appraisal_value_updated
  rule: Where rov_allowed is true the borrower may ask the appraiser to reconsider the value. A reconsideration of value is accepted only while the order status is delivered. A reconsideration of value is accepted only if it is submitted no later than the end of the reconsideration window that starts on the date the report was delivered to the borrower. Count calendar days forward from delivered_to_borrower_date, which is day zero; a request submitted on the last day of the window is accepted. An order accepts at most rov_max_per_order requests (appraisal_msr_rov_count). A request on comparable_sales must include at least rov_min_comparables_for_sales_basis and no more than rov_max_comparables alternative sales; one that does not is returned_incomplete, does not count against the limit and does not reopen the order. A request raising valuation_bias is accepted on the same terms and is also referred to Larkspur's fair lending officer. The appraiser responds within rov_response_business_days. A value_changed decision updates appraised_value to revised_value; a value_unchanged decision leaves it. The borrower is never charged (rov_fee) and Larkspur never asks the appraiser to hit a target value.
  eligibility:
  - id: rov_on_delivered_report
    applies_to:
    - appraisal_rov_submitted
    kind: state
    condition: A reconsideration of value is accepted only while the order status is delivered.
    evidence_fields:
    - appraisal_orders.status
    - appraisal_orders.appraisal_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appraisal_orders.appraisal_order_id
      action_bindings:
        appraisal_orders.appraisal_order_id: appraisal_order_id
    state_contract:
      field: appraisal_orders.status
      allowed:
      - delivered
  - id: rov_within_window
    applies_to:
    - appraisal_rov_submitted
    kind: time
    condition: A reconsideration of value is accepted only if it is submitted no later than the end of the reconsideration window that starts on the date the report was delivered to the borrower.
    evidence_fields:
    - appraisal_orders.delivered_to_borrower_date
    - appraisal_orders.appraisal_order_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appraisal_orders.appraisal_order_id
      action_bindings:
        appraisal_orders.appraisal_order_id: appraisal_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the report was delivered to the borrower
      anchor_source: appraisal_orders.delivered_to_borrower_date
      relation: not_after
      duration_source: variants.rov_window_calendar_days
      unit: calendar_days
      counting_rule: Count calendar days forward from delivered_to_borrower_date, which is day zero; a request submitted on the last day of the window is accepted.
      boundary: inclusive
  measures:
  - appraisal_msr_rov_count
  params:
    per_tier:
      Larkspur Desktop Appraisal (Form 1004 Desktop):
        rov_max_per_order: =rov_max_per_order
      Larkspur Exterior-Only Appraisal (Form 2055):
        rov_max_per_order: =rov_max_per_order
      Larkspur Condominium Appraisal (Form 1073):
        rov_max_per_order: =rov_max_per_order
      Larkspur Single-Family Appraisal (Form 1004):
        rov_max_per_order: =rov_max_per_order
      Larkspur FHA Single-Family Appraisal (Form 1004 FHA):
        rov_max_per_order: =rov_max_per_order
      Larkspur Small Residential Income Appraisal (Form 1025):
        rov_max_per_order: =rov_max_per_order
      Larkspur Complex Property Appraisal (Form 1004 Jumbo):
        rov_max_per_order: =rov_max_per_order
- id: appraisal_validity_and_update
  subject:
  - appraisal_ordered
  - appraisal_fee_charged
  rule: A report may support the note only while its age, in calendar days from inspection_date to the note date, is at most validity_days. Between validity_days and max_age_with_update_days a Form 1004D update by the original appraiser keeps it usable and is charged reinspection_fee; a report type whose max_age_with_update_days is 0 cannot be updated. Past max_age_with_update_days, or where no update is possible, a new order is placed with order_reason new_order_after_expiration and charged in full. A value subject to completion or repairs (subject_to_completion true) also needs a Form 1004D completion inspection before funding, charged reinspection_fee.
  eligibility: []
- id: appraisal_hpml_flip_second_appraisal
  subject:
  - appraisal_ordered
  - appraisal_fee_charged
  rule: For a purchase on a loan file flagged as a higher-priced mortgage loan (hpml_flag true), Regulation Z requires a second full interior appraisal by a different appraiser when the seller acquired the property no more than flip_short_window_days days before the purchase contract and the contract price exceeds seller_acquisition_price by more than flip_short_window_increase_pct percent, or acquired it flip_short_window_days plus one to flip_long_window_days days before and the price exceeds it by more than flip_long_window_increase_pct percent. That second order uses order_reason second_appraisal_hpml_flip and the borrower is never charged for it. A file that is not HPML, a refinance, or a price increase at or below the percentage needs no second appraisal under this rule.
  eligibility: []
- id: appraisal_cancellation_and_hold
  subject:
  - appraisal_cancelled
  - appraisal_held
  - appraisal_released
  rule: Only the borrower can cancel an order they are paying for; the system cancels it when the loan file is withdrawn, denied or closed, and when the order has been on hold for more than hold_auto_cancel_calendar_days calendar days. A completed or delivered report is never cancelled; it stays on file. Cancellation stamps closed_date, and charges are refunded under the fee refund policy by the stage reached.
  eligibility: []
extended_policies:
- id: appraisal_ext_size_value_addon
  base_policy_refs:
  - appraisal_fee_schedule
  - appraisal_validity_and_update
  - appraisal_hpml_flip_second_appraisal
  overwrite:
  - base_policy: appraisal_fee_schedule
    superseded_clause: gla_surcharge is charged once when gross_living_area_sqft is above gla_surcharge_threshold_sqft
    replaced_by: The complexity add-on is charged once, on the order's gross-living-area surcharge line, on an order whose completed report states a gross living area per dwelling unit above the report type's gross-living-area surcharge threshold, and nothing is owed when that area is at or below the threshold.
  - base_policy: appraisal_fee_schedule
    superseded_clause: there is no stacking or discount between components, each is charged at its own amount.
    replaced_by: The complexity add-on is built from the parts below, in place of the report type's gross-living-area surcharge alone, and is reduced by two things only, its arrival rule and any amount already standing on its own line; the update visit charge and the final inspection charge stack their own parts under their own rules, and every other appraisal charge is still charged at its own amount with no stacking or discount.
  trigger: state_due
  subject:
  - appraisal_fee_charged
  computes: addon_amount
  target_tool: book_size_value_addon_5d867e2e
  params:
    middle_overage_sqft: 500
    upper_overage_sqft: 1500
    middle_size_multiple: 1.4
    upper_size_multiple: 1.8
    middle_value_floor: 1000000
    upper_value_floor: 1500000
    middle_value_addon: 125
    upper_value_addon: 200
    jumbo_program_addon: 100
    high_balance_program_addon: 60
    second_home_addon: 60
    investment_addon: 90
    mid_site_acres: 1.0
    large_site_acres: 3.0
    mid_site_addon: 40
    large_site_addon: 80
    long_lateness_days: 3
    short_lateness_deduction: 100
  rule: 'The complexity add-on is charged once, on the order''s gross-living-area surcharge line, on an order whose completed report states a gross living area per dwelling unit above the report type''s gross-living-area surcharge threshold, and nothing is owed when that area is at or below the threshold. The gross living area per dwelling unit is the gross living area the report states divided by the number of units on the loan file the order supports. An order placed as an HPML flip second appraisal is never charged the complexity add-on. It is booked as one charge and collected on the card or account the order''s base fee was collected with. Any amount already standing on the order''s gross-living-area surcharge line is taken off the complexity add-on, the result never going below zero, so the add-on is collected only once. The standard complexity add-on is the report type''s gross-living-area surcharge, charged at its own amount with nothing added to it. The complexity add-on is built from the parts below, in place of the report type''s gross-living-area surcharge alone, and is reduced by two things only, its arrival rule and any amount already standing on its own line; the update visit charge and the final inspection charge stack their own parts under their own rules, and every other appraisal charge is still charged at its own amount with no stacking or discount. The complexity add-on is worked out in this order: first the living-area part, the market-value part, the loan-program part, the occupancy part and the site part are added together into the add-on subtotal; then the arrival rule for the completed report is applied to that subtotal; the figure is kept to the cent. The living-area part of the complexity add-on follows how far the gross living area per dwelling unit exceeds the threshold: an overage of 1,500 square feet or more is 1.8 times the report type''s gross-living-area surcharge, an overage of at least 500 but under 1,500 square feet is 1.4 times that surcharge, and an overage under 500 square feet is the surcharge itself. The market-value part of the complexity add-on reads the property value on the loan file the order supports: a property value of 1,500,000 dollars or more adds 200 dollars, a property value of 1,000,000 to 1,499,999.99 dollars adds 125 dollars, and a lower property value adds nothing. The loan-program part of the complexity add-on reads the loan program of that loan file: the Larkspur Jumbo 30-Year Fixed adds 100 dollars, the Larkspur High-Balance Conforming 30-Year Fixed adds 60 dollars, and every other program adds nothing. The occupancy part of the complexity add-on reads the occupancy of that loan file: an investment property adds 90 dollars, a second home adds 60 dollars, and a primary residence adds nothing. The site part of the complexity add-on reads the site size the report states, counted as no site at all when the loan file''s property type is a condominium: a site of 3 acres or more adds 80 dollars, a site of 1 to under 3 acres adds 40 dollars, and a smaller site adds nothing. The arrival rule of the complexity add-on compares the completed date with the due date in calendar days: a report completed 3 days or more after its due date carries only the living-area part; a report completed 1 or 2 days after its due date carries the add-on subtotal less 100 dollars, but never less than the living-area part; and a report completed on or before its due date carries the whole add-on subtotal.'
  prerequisite: []
  cross_category:
  - category: loan
    as: branch
    reads:
    - units
    - property_value
    - variant_name
    - occupancy
    - property_type
    note: the per-unit living area and the market-value, loan-program, occupancy and site parts read the loan file the order supports
  compute:
  - living_area: F('gross_living_area_sqft')
  - dwelling_units: CFIELD('loan', 'units', loan_file_id=F('loan_file_id'))
  - area_per_unit: living_area / dwelling_units if dwelling_units else living_area
  - area_overage: area_per_unit - P('gla_surcharge_threshold_sqft')
  - size_component: P('gla_surcharge') * K('upper_size_multiple') if area_overage >= K('upper_overage_sqft') else (P('gla_surcharge') * K('middle_size_multiple') if area_overage >= K('middle_overage_sqft') else P('gla_surcharge'))
  - market_value: CFIELD('loan', 'property_value', loan_file_id=F('loan_file_id'))
  - value_component: K('upper_value_addon') if market_value >= K('upper_value_floor') else (K('middle_value_addon') if market_value >= K('middle_value_floor') else 0)
  - loan_program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - program_component: K('jumbo_program_addon') if loan_program == 'Larkspur Jumbo 30-Year Fixed' else (K('high_balance_program_addon') if loan_program == 'Larkspur High-Balance Conforming 30-Year Fixed' else 0)
  - loan_occupancy: CFIELD('loan', 'occupancy', loan_file_id=F('loan_file_id'))
  - occupancy_component: K('investment_addon') if loan_occupancy == 'investment_property' else (K('second_home_addon') if loan_occupancy == 'second_home' else 0)
  - dwelling_type: CFIELD('loan', 'property_type', loan_file_id=F('loan_file_id'))
  - site_component: K('large_site_addon') if F('site_acres') >= K('large_site_acres') and dwelling_type != 'condominium' else (K('mid_site_addon') if F('site_acres') >= K('mid_site_acres') and dwelling_type != 'condominium' else 0)
  - addon_subtotal: size_component + value_component + program_component + occupancy_component + site_component
  - arrival_lateness_days: DAYS(F('due_date'), F('completed_date'))
  - arrival_adjusted: size_component if arrival_lateness_days >= K('long_lateness_days') else (MX(size_component, addon_subtotal - K('short_lateness_deduction')) if arrival_lateness_days >= 1 else addon_subtotal)
  - already_billed: SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_charged', fee_component='gla_surcharge') - SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_refunded', fee_component='gla_surcharge')
  - addon_owed: MX(0, arrival_adjusted - already_billed) if area_overage > 0 and F('order_reason') != 'second_appraisal_hpml_flip' else 0
  - result: RND(addon_owed, 2)
  compute_basis:
    dwelling_units: The gross living area per dwelling unit is the gross living area the report states divided by the number of units on the loan file the order supports.
    area_per_unit: The gross living area per dwelling unit is the gross living area the report states divided by the number of units on the loan file the order supports.
    area_overage: The complexity add-on is charged once, on the order's gross-living-area surcharge line, on an order whose completed report states a gross living area per dwelling unit above the report type's gross-living-area surcharge threshold, and nothing is owed when that area is at or below the threshold.
    size_component: an overage of 1,500 square feet or more is 1.8 times the report type's gross-living-area surcharge, an overage of at least 500 but under 1,500 square feet is 1.4 times that surcharge, and an overage under 500 square feet is the surcharge itself.
    market_value: The market-value part of the complexity add-on reads the property value on the loan file the order supports
    value_component: a property value of 1,500,000 dollars or more adds 200 dollars, a property value of 1,000,000 to 1,499,999.99 dollars adds 125 dollars, and a lower property value adds nothing.
    loan_program: The loan-program part of the complexity add-on reads the loan program of that loan file
    program_component: the Larkspur Jumbo 30-Year Fixed adds 100 dollars, the Larkspur High-Balance Conforming 30-Year Fixed adds 60 dollars, and every other program adds nothing.
    loan_occupancy: The occupancy part of the complexity add-on reads the occupancy of that loan file
    occupancy_component: an investment property adds 90 dollars, a second home adds 60 dollars, and a primary residence adds nothing.
    dwelling_type: counted as no site at all when the loan file's property type is a condominium
    site_component: a site of 3 acres or more adds 80 dollars, a site of 1 to under 3 acres adds 40 dollars, and a smaller site adds nothing.
    addon_subtotal: first the living-area part, the market-value part, the loan-program part, the occupancy part and the site part are added together into the add-on subtotal
    arrival_lateness_days: The arrival rule of the complexity add-on compares the completed date with the due date in calendar days
    arrival_adjusted: a report completed 3 days or more after its due date carries only the living-area part; a report completed 1 or 2 days after its due date carries the add-on subtotal less 100 dollars, but never less than the living-area part; and a report completed on or before its due date carries the whole add-on subtotal.
    already_billed: Any amount already standing on the order's gross-living-area surcharge line is taken off the complexity add-on, the result never going below zero, so the add-on is collected only once.
    addon_owed: An order placed as an HPML flip second appraisal is never charged the complexity add-on.
    result: the figure is kept to the cent.
  factors:
  - id: living_area_overage_tier
    effect: parameter
    decides: size_component
    bindings:
    - dwelling_units
    - area_per_unit
    - area_overage
    - size_component
    ladder:
    - when: the gross living area per dwelling unit exceeds the threshold by 1,500 square feet or more
      value: 1.8 times the report type's gross-living-area surcharge
    - when: the gross living area per dwelling unit exceeds the threshold by at least 500 but under 1,500 square feet
      value: 1.4 times the report type's gross-living-area surcharge
    - when: otherwise
      value: the report type's gross-living-area surcharge
    baseline:
      size_component: P('gla_surcharge')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: null
  - id: market_value_tier
    effect: parameter
    decides: value_component
    bindings:
    - market_value
    - value_component
    ladder:
    - when: the loan file's property value is 1,500,000 dollars or more
      value: 200 dollars
    - when: the loan file's property value is 1,000,000 to 1,499,999.99 dollars
      value: 125 dollars
    - when: otherwise
      value: nothing
    baseline:
      value_component: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: loan_program_tier
    effect: parameter
    decides: program_component
    bindings:
    - loan_program
    - program_component
    ladder:
    - when: the loan file's program is the Larkspur Jumbo 30-Year Fixed
      value: 100 dollars
    - when: the loan file's program is the Larkspur High-Balance Conforming 30-Year Fixed
      value: 60 dollars
    - when: otherwise
      value: nothing
    baseline:
      program_component: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: occupancy_tier
    effect: parameter
    decides: occupancy_component
    bindings:
    - loan_occupancy
    - occupancy_component
    ladder:
    - when: the loan file's occupancy is an investment property
      value: 90 dollars
    - when: the loan file's occupancy is a second home
      value: 60 dollars
    - when: otherwise
      value: nothing
    baseline:
      occupancy_component: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: site_acreage_tier
    effect: parameter
    decides: site_component
    bindings:
    - dwelling_type
    - site_component
    ladder:
    - when: the report states a site of 3 acres or more and the loan file's property type is not a condominium
      value: 80 dollars
    - when: the report states a site of 1 to under 3 acres and the loan file's property type is not a condominium
      value: 40 dollars
    - when: otherwise
      value: nothing
    baseline:
      site_component: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: arrival_lateness_method
    effect: method
    decides: arrival_adjusted
    bindings:
    - arrival_lateness_days
    - arrival_adjusted
    ladder:
    - when: the report was completed 3 calendar days or more after its due date
      method: the add-on is the living-area part alone; the other parts are dropped
    - when: the report was completed 1 or 2 calendar days after its due date
      method: the add-on is the add-on subtotal less a flat 100 dollars, floored at the living-area part
    - when: otherwise
      method: the add-on is the whole add-on subtotal
    baseline:
      arrival_adjusted: addon_subtotal
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The complexity add-on is charged once, on the order's gross-living-area surcharge line, on an order whose completed report states a gross living area per dwelling unit above the report type's gross-living-area surcharge threshold, and nothing is owed when that area is at or below the threshold. The gross living area per dwelling unit is the gross living area the report states divided by the number of units on the loan file the order supports. An order placed as an HPML flip second appraisal is never charged the complexity add-on. Any amount already standing on the order's gross-living-area surcharge line is taken off the complexity add-on, the result never going below zero, so the add-on is collected only once. The standard complexity add-on is the report type's gross-living-area surcharge, charged at its own amount with nothing added to it.
    params:
    - gla_surcharge
    - gla_surcharge_threshold_sqft
  inputs:
    history:
    - table: appraisal_fee_ledger
      aggregate: sum
      field: amount
      filters:
        fee_component: gla_surcharge
    cross_category:
    - loan
- id: appraisal_ext_update_inspection_charge
  base_policy_refs:
  - appraisal_fee_schedule
  - appraisal_validity_and_update
  - appraisal_hpml_flip_second_appraisal
  overwrite:
  - base_policy: appraisal_validity_and_update
    superseded_clause: Between validity_days and max_age_with_update_days a Form 1004D update by the original appraiser keeps it usable and is charged reinspection_fee
    replaced_by: A Form 1004D update by the original appraiser keeps the report usable, and its update visit is charged under this rule, when the report's age, in calendar days from the inspection date to the closing date currently scheduled on the loan file, is above the report type's validity days and no more than its maximum age with an update; a report inside its validity days needs no update and is charged nothing under this rule, and a report past its maximum age with an update is replaced by a new order.
  - base_policy: appraisal_fee_schedule
    superseded_clause: reinspection_fee is charged once for each Form 1004D completion or update inspection.
    replaced_by: For an update visit the reinspection charge is the update visit charge worked out below, collected once for the visit; a completion visit on a report inside its validity days is charged under the final inspection charge, and any other Form 1004D inspection is still charged the report type's reinspection fee once.
  - base_policy: appraisal_fee_schedule
    superseded_clause: there is no stacking or discount between components, each is charged at its own amount.
    replaced_by: The update visit charge stacks the parts below on the report type's reinspection fee and is then set by its visit-scope rule; the complexity add-on and the final inspection charge stack their own parts under their own rules, and every other appraisal charge is still charged at its own amount with no stacking or discount.
  trigger: on_request
  subject:
  - appraisal_fee_charged
  computes: charge_amount
  target_tool: pay_update_inspection_charge_fc307ba0
  params:
    mid_age_days: 151
    long_age_days: 211
    mid_age_addon: 75
    long_age_addon: 150
    light_billed_addon: 60
    heavy_billed_addon: 120
    heavy_billed_floor: 400
    near_lock_days: 7
    mid_lock_days: 14
    mid_lock_rush_pct: 50
    thin_cushion_pct: 1
    mid_cushion_pct: 3
    thin_cushion_addon: 100
    mid_cushion_addon: 50
    mid_loan_amount_floor: 900000
    upper_loan_amount_floor: 1500000
    mid_loan_amount_addon: 60
    upper_loan_amount_addon: 120
    combined_part_pct: 60
    recent_visit_months: 2
    desktop_recert_charge: 175
  rule: 'A Form 1004D update by the original appraiser keeps the report usable, and its update visit is charged under this rule, when the report''s age, in calendar days from the inspection date to the closing date currently scheduled on the loan file, is above the report type''s validity days and no more than its maximum age with an update; a report inside its validity days needs no update and is charged nothing under this rule, and a report past its maximum age with an update is replaced by a new order. An order placed as an HPML flip second appraisal is never charged an update visit. The update visit charge is paid by the borrower in their own name, from the card or account the borrower chooses. The standard update visit charge is the report type''s reinspection fee, charged once for the visit. The update visit charge is not fixed until the order''s fee history carries the complexity add-on owed for the living area, site, market value, loan program and occupancy that the completed report and the loan file show. For an update visit the reinspection charge is the update visit charge worked out below, collected once for the visit; a completion visit on a report inside its validity days is charged under the final inspection charge, and any other Form 1004D inspection is still charged the report type''s reinspection fee once. The update visit charge stacks the parts below on the report type''s reinspection fee and is then set by its visit-scope rule; the complexity add-on and the final inspection charge stack their own parts under their own rules, and every other appraisal charge is still charged at its own amount with no stacking or discount. The update visit charge is worked out in this order: first the report type''s reinspection fee, the report-age part, the billed add-on part, the lock-horizon part, the market-conditions part and the loan-amount part are added together into the standard update charge; then the visit-scope rule is applied to that standard update charge; the figure is kept to the cent. The report-age part of the update visit charge reads the report''s age at the scheduled closing date: an age of 211 days or more adds 150 dollars, an age of 151 to 210 days adds 75 dollars, and a younger report adds nothing. The billed add-on part of the update visit charge reads the complexity add-on standing on the order, that is the charges on the gross-living-area surcharge line less any refunds of that line: a standing add-on of 400 dollars or more adds 120 dollars, a standing add-on above zero and under 400 dollars adds 60 dollars, and an order with no standing add-on adds nothing. The lock-horizon part of the update visit charge reads the expiration date of the locked rate lock on the same loan file and counts calendar days from today to that date: 0 to 7 days adds the report type''s rush fee, 8 to 14 days adds 50 percent of that rush fee, and a later expiration, an expired date or no locked rate lock adds nothing. The lock-horizon part is a turn-time premium inside the update visit charge; it is not a rush charge on the order, which is still charged only when the borrower asks for rush at order. The market-conditions part of the update visit charge compares the appraised value the report states with the property value on the loan file, as a percentage of that property value: when the appraised value is above the property value by less than 1 percent, or is not above it, the update carries a full market-conditions refresh and adds 100 dollars; when it is above by 1 to under 3 percent, a short refresh adds 50 dollars; and a cushion of 3 percent or more adds nothing. The loan-amount part of the update visit charge reads the base loan amount on the loan file: 1,500,000 dollars or more adds 120 dollars, 900,000 to 1,499,999.99 dollars adds 60 dollars, and a smaller base loan amount adds nothing. The visit-scope rule of the update visit charge reads the order''s completion flag and its reinspection charges: an order whose value is subject to completion is updated and certified complete in one combined visit, charged the standard update charge plus 60 percent of the report type''s reinspection fee; an order whose value is not subject to completion and which carries a reinspection charge dated within the last 2 calendar months is recertified from that recent visit at a flat 175 dollars; any other order is charged the standard update charge.'
  prerequisite:
  - problem: appraisal_ext_size_value_addon
    kind: value_input
    gate: billed_addon
    form: state
    policy_source: The update visit charge is not fixed until the order's fee history carries the complexity add-on owed for the living area, site, market value, loan program and occupancy that the completed report and the loan file show.
    condition: The order's fee history shows a gross-living-area surcharge charge equal to the complexity add-on the completed report and the loan file call for, so the billed add-on standing on the order equals that add-on.
    resolved_by: book_size_value_addon_5d867e2e
    effect: Once the complexity add-on is booked, the billed add-on standing on the order rises from nothing to the add-on amount, which moves the billed add-on part of the update visit charge onto the tier that standing amount selects.
  cross_category:
  - category: loan
    as: branch
    reads:
    - estimated_closing_date
    - base_loan_amount
    - property_value
    note: the report-age part reads the scheduled closing date, the loan-amount part the base loan amount and the market-conditions part the property value of the loan file
  - category: lock
    as: branch
    reads:
    - lock_expiration_date
    - status
    note: the lock-horizon part reads the expiration date of the locked rate lock on the same loan file
  compute:
  - report_age_days: DAYS(F('inspection_date'), CFIELD('loan', 'estimated_closing_date', loan_file_id=F('loan_file_id')))
  - update_needed: report_age_days > P('validity_days') and report_age_days <= P('max_age_with_update_days') and F('order_reason') != 'second_appraisal_hpml_flip'
  - age_component: K('long_age_addon') if report_age_days >= K('long_age_days') else (K('mid_age_addon') if report_age_days >= K('mid_age_days') else 0)
  - billed_addon: SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_charged', fee_component='gla_surcharge') - SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_refunded', fee_component='gla_surcharge')
  - billed_class_component: K('heavy_billed_addon') if billed_addon >= K('heavy_billed_floor') else (K('light_billed_addon') if billed_addon > 0 else 0)
  - lock_expiration: CFIELD('lock', 'lock_expiration_date', loan_file_id=F('loan_file_id'), status='locked')
  - lock_days_left: DAYS(NOW, lock_expiration) if lock_expiration else -1
  - lock_turn_component: P('rush_fee') if lock_days_left >= 0 and lock_days_left <= K('near_lock_days') else (RND(P('rush_fee') * K('mid_lock_rush_pct') / 100, 2) if lock_days_left > K('near_lock_days') and lock_days_left <= K('mid_lock_days') else 0)
  - value_on_file: CFIELD('loan', 'property_value', loan_file_id=F('loan_file_id'))
  - value_cushion_pct: (F('appraised_value') - value_on_file) * 100 / value_on_file if value_on_file else 0
  - cushion_component: K('thin_cushion_addon') if value_cushion_pct < K('thin_cushion_pct') else (K('mid_cushion_addon') if value_cushion_pct < K('mid_cushion_pct') else 0)
  - base_loan: CFIELD('loan', 'base_loan_amount', loan_file_id=F('loan_file_id'))
  - loan_amount_component: K('upper_loan_amount_addon') if base_loan >= K('upper_loan_amount_floor') else (K('mid_loan_amount_addon') if base_loan >= K('mid_loan_amount_floor') else 0)
  - standard_update_charge: P('reinspection_fee') + age_component + billed_class_component + lock_turn_component + cushion_component + loan_amount_component
  - recent_reinspection_charges: COUNT('appraisal_fee_ledger', within_months=K('recent_visit_months'), date_field='entry_date', event_type='appraisal_fee_charged', fee_component='reinspection_fee')
  - visit_scope_charge: standard_update_charge + RND(P('reinspection_fee') * K('combined_part_pct') / 100, 2) if F('subject_to_completion') == True else (K('desktop_recert_charge') if recent_reinspection_charges >= 1 else standard_update_charge)
  - result: RND(visit_scope_charge if update_needed else 0, 2)
  compute_basis:
    report_age_days: when the report's age, in calendar days from the inspection date to the closing date currently scheduled on the loan file, is above the report type's validity days and no more than its maximum age with an update
    update_needed: An order placed as an HPML flip second appraisal is never charged an update visit.
    age_component: an age of 211 days or more adds 150 dollars, an age of 151 to 210 days adds 75 dollars, and a younger report adds nothing.
    billed_addon: The billed add-on part of the update visit charge reads the complexity add-on standing on the order, that is the charges on the gross-living-area surcharge line less any refunds of that line
    billed_class_component: a standing add-on of 400 dollars or more adds 120 dollars, a standing add-on above zero and under 400 dollars adds 60 dollars, and an order with no standing add-on adds nothing.
    lock_expiration: The lock-horizon part of the update visit charge reads the expiration date of the locked rate lock on the same loan file and counts calendar days from today to that date
    lock_days_left: counts calendar days from today to that date
    lock_turn_component: 0 to 7 days adds the report type's rush fee, 8 to 14 days adds 50 percent of that rush fee, and a later expiration, an expired date or no locked rate lock adds nothing.
    value_on_file: The market-conditions part of the update visit charge compares the appraised value the report states with the property value on the loan file, as a percentage of that property value
    value_cushion_pct: The market-conditions part of the update visit charge compares the appraised value the report states with the property value on the loan file, as a percentage of that property value
    cushion_component: when the appraised value is above the property value by less than 1 percent, or is not above it, the update carries a full market-conditions refresh and adds 100 dollars; when it is above by 1 to under 3 percent, a short refresh adds 50 dollars; and a cushion of 3 percent or more adds nothing.
    base_loan: The loan-amount part of the update visit charge reads the base loan amount on the loan file
    loan_amount_component: 1,500,000 dollars or more adds 120 dollars, 900,000 to 1,499,999.99 dollars adds 60 dollars, and a smaller base loan amount adds nothing.
    standard_update_charge: first the report type's reinspection fee, the report-age part, the billed add-on part, the lock-horizon part, the market-conditions part and the loan-amount part are added together into the standard update charge
    recent_reinspection_charges: an order whose value is not subject to completion and which carries a reinspection charge dated within the last 2 calendar months is recertified from that recent visit at a flat 175 dollars
    visit_scope_charge: an order whose value is subject to completion is updated and certified complete in one combined visit, charged the standard update charge plus 60 percent of the report type's reinspection fee; an order whose value is not subject to completion and which carries a reinspection charge dated within the last 2 calendar months is recertified from that recent visit at a flat 175 dollars; any other order is charged the standard update charge.
    result: the figure is kept to the cent.
  factors:
  - id: note_date_age_tier
    effect: parameter
    decides: age_component
    bindings:
    - report_age_days
    - age_component
    ladder:
    - when: the report is 211 days old or more at the closing date scheduled on the loan file
      value: 150 dollars
    - when: the report is 151 to 210 days old at that date
      value: 75 dollars
    - when: otherwise
      value: nothing
    baseline:
      age_component: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: loan
  - id: billed_addon_class
    effect: parameter
    decides: billed_class_component
    bindings:
    - billed_addon
    - billed_class_component
    ladder:
    - when: the complexity add-on standing on the order is 400 dollars or more
      value: 120 dollars
    - when: the complexity add-on standing on the order is above zero and under 400 dollars
      value: 60 dollars
    - when: otherwise
      value: nothing
    baseline:
      billed_class_component: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: lock_horizon_tier
    effect: parameter
    decides: lock_turn_component
    bindings:
    - lock_expiration
    - lock_days_left
    - lock_turn_component
    ladder:
    - when: the locked rate lock on the loan file expires 0 to 7 calendar days from today
      value: the report type's rush fee
    - when: the locked rate lock on the loan file expires 8 to 14 calendar days from today
      value: 50 percent of the report type's rush fee
    - when: otherwise
      value: nothing
    baseline:
      lock_turn_component: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: lock
  - id: value_cushion_tier
    effect: parameter
    decides: cushion_component
    bindings:
    - value_on_file
    - value_cushion_pct
    - cushion_component
    ladder:
    - when: the appraised value is above the loan file's property value by less than 1 percent, or is not above it
      value: 100 dollars (full market-conditions refresh)
    - when: the appraised value is above the loan file's property value by 1 to under 3 percent
      value: 50 dollars (short market-conditions refresh)
    - when: otherwise
      value: nothing
    baseline:
      cushion_component: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: loan_amount_tier
    effect: parameter
    decides: loan_amount_component
    bindings:
    - base_loan
    - loan_amount_component
    ladder:
    - when: the loan file's base loan amount is 1,500,000 dollars or more
      value: 120 dollars
    - when: the loan file's base loan amount is 900,000 to 1,499,999.99 dollars
      value: 60 dollars
    - when: otherwise
      value: nothing
    baseline:
      loan_amount_component: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: visit_scope_method
    effect: method
    decides: visit_scope_charge
    bindings:
    - recent_reinspection_charges
    - visit_scope_charge
    ladder:
    - when: the value is subject to completion
      method: 'one combined update-and-completion visit: the standard update charge plus 60 percent of the report type''s reinspection fee'
    - when: the value is not subject to completion and the order carries a reinspection charge dated within the last 2 calendar months
      method: a desktop recertification from the recent visit at a flat 175 dollars, in place of the standard update charge
    - when: otherwise
      method: the standard update charge as built
    baseline:
      visit_scope_charge: standard_update_charge
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A Form 1004D update by the original appraiser keeps the report usable, and its update visit is charged under this rule, when the report's age, in calendar days from the inspection date to the closing date currently scheduled on the loan file, is above the report type's validity days and no more than its maximum age with an update; a report inside its validity days needs no update and is charged nothing under this rule, and a report past its maximum age with an update is replaced by a new order. An order placed as an HPML flip second appraisal is never charged an update visit. The standard update visit charge is the report type's reinspection fee, charged once for the visit.
    params:
    - reinspection_fee
    - validity_days
    - max_age_with_update_days
  inputs:
    history:
    - table: appraisal_fee_ledger
      aggregate: sum
      field: amount
      filters:
        fee_component: gla_surcharge
    - table: appraisal_fee_ledger
      aggregate: count
      field: amount
      within_months: 2
      filters:
        fee_component: reinspection_fee
    cross_category:
    - loan
    - lock
- id: appraisal_ext_late_rush_refund
  base_policy_refs:
  - appraisal_fee_refund
  - appraisal_turn_time
  overwrite:
  - base_policy: appraisal_fee_refund
    superseded_clause: When the order was delivered later than its due_date after the borrower paid for rush, the rush_fee is refunded in full (rush_deadline_missed) even though the report was completed.
    replaced_by: 'The late-rush refund is worked out in this order: first the days late are counted under the counting rule below; then the lateness share, the closing-slip points and the extension-cost points are added together into one refund share, which is never more than 100 percent and never less than zero; then that share is applied once to the rush charge standing on the order; the refund is kept to the cent.'
  trigger: state_due
  subject:
  - appraisal_fee_refunded
  computes: refund_amount
  target_tool: refund_late_rush_charge_6e5bda3a
  params:
    short_late_days: 2
    mid_late_days: 5
    short_late_share: 25
    mid_late_share: 50
    full_share: 100
    delivery_hold_days: 2
    long_slip_days: 10
    long_slip_points: 20
    short_slip_points: 10
    heavy_extension_cost: 500
    heavy_extension_points: 10
    light_extension_points: 5
  rule: 'A late-rush refund is owed on a completed order whose borrower paid a rush charge and whose days late are one or more, and nothing is refunded when the days late are zero or fewer. A rush charge on a cancelled order, on an order placed as an HPML flip second appraisal, or collected before the borrower''s intent to proceed is outside this rule, because the fee refund policy returns it in full. The late-rush refund names the rush charge entry it returns and goes back to the card or account that rush charge was collected with. The standard late-rush refund returns the rush charge standing on the order in full, the days late being the calendar days from the due date to the completed date. The late-rush refund is worked out in this order: first the days late are counted under the counting rule below; then the lateness share, the closing-slip points and the extension-cost points are added together into one refund share, which is never more than 100 percent and never less than zero; then that share is applied once to the rush charge standing on the order; the refund is kept to the cent. The counting rule of the late-rush refund picks the date the days late run to: when the order carries reconsideration decisions that changed the value, they run to the decided date of the latest such decision; when the copy reached the borrower more than 2 calendar days after the completed date, they run to the date the copy was delivered to the borrower; otherwise they run to the completed date. The days late of the late-rush refund are this refund''s own count; the appraisal delay, the calendar days from the due date to the completed date that other Larkspur rules rely on, is unchanged. The lateness share of the late-rush refund follows the days late: 1 or 2 days late returns 25 percent, 3 to 5 days late returns 50 percent, and 6 days late or more returns 100 percent. The closing-slip points of the late-rush refund count the calendar days by which the closing date currently scheduled on the loan file falls after the contract closing date: a slip of 10 days or more adds 20 percentage points, a slip of 1 to 9 days adds 10 points, and no slip adds nothing. The extension-cost points of the late-rush refund read the rate lock on the same loan file and total the lock costs the borrower still bears there, that is the extension costs booked to the borrower on that lock less every lock-cost waiver booked on that lock: lock costs still borne of 500 dollars or more add 10 percentage points, more than zero and under 500 dollars add 5 points, and nothing still borne adds nothing.'
  prerequisite: []
  cross_category:
  - category: loan
    as: branch
    reads:
    - estimated_closing_date
    - contract_closing_date
    - intent_to_proceed_date
    note: the closing-slip points compare the scheduled and contract closing dates, and the intent-to-proceed date marks a rush charge collected too early
  - category: lock
    as: history
    reads:
    - lock_id
    - lock_pricing_events.cost_amount
    - lock_pricing_events.cost_bearer
    - lock_pricing_events.event_type
    note: 'the extension-cost points total the lock costs the borrower still bears on the rate lock of the same loan file: extension costs booked to the borrower less every lock-cost waiver booked on that lock'
  compute:
  - rush_open: SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_charged', fee_component='rush_fee') - SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_refunded', fee_component='rush_fee')
  - rush_charge_date: LATEST('appraisal_fee_ledger', 'entry_date', date_field='entry_date', event_type='appraisal_fee_charged', fee_component='rush_fee')
  - itp_date: CFIELD('loan', 'intent_to_proceed_date', loan_file_id=F('loan_file_id'))
  - in_scope: 1 if F('status') != 'cancelled' and F('order_reason') != 'second_appraisal_hpml_flip' and F('completed_date') and not (itp_date and rush_charge_date and rush_charge_date < itp_date) else 0
  - value_change_decisions: COUNT('appraisal_reconsiderations', event_type='appraisal_rov_decided', decision='value_changed')
  - value_change_date: LATEST('appraisal_reconsiderations', 'decided_date', date_field='decided_date', event_type='appraisal_rov_decided', decision='value_changed')
  - delivery_hold: DAYS(F('completed_date'), F('delivered_to_borrower_date')) if F('delivered_to_borrower_date') else 0
  - late_endpoint: value_change_date if value_change_decisions >= 1 else (F('delivered_to_borrower_date') if delivery_hold > K('delivery_hold_days') else F('completed_date'))
  - days_late: DAYS(F('due_date'), late_endpoint) if late_endpoint else 0
  - lateness_share: K('short_late_share') if days_late >= 1 and days_late <= K('short_late_days') else (K('mid_late_share') if days_late > K('short_late_days') and days_late <= K('mid_late_days') else K('full_share'))
  - scheduled_close: CFIELD('loan', 'estimated_closing_date', loan_file_id=F('loan_file_id'))
  - contract_close: CFIELD('loan', 'contract_closing_date', loan_file_id=F('loan_file_id'))
  - slip_days: DAYS(contract_close, scheduled_close) if scheduled_close and contract_close else 0
  - closing_points: K('long_slip_points') if slip_days >= K('long_slip_days') else (K('short_slip_points') if slip_days >= 1 else 0)
  - file_lock_id: CFIELD('lock', 'lock_id', loan_file_id=F('loan_file_id'))
  - borrower_extension_cost: XSUM('lock', 'lock_pricing_events', 'cost_amount', event_type='lock_extension_booked', cost_bearer='borrower', lock_id=file_lock_id) - XSUM('lock', 'lock_pricing_events', 'cost_amount', event_type='lock_cost_waived', lock_id=file_lock_id)
  - extension_points: K('heavy_extension_points') if borrower_extension_cost >= K('heavy_extension_cost') else (K('light_extension_points') if borrower_extension_cost > 0 else 0)
  - refund_share: MN(K('full_share'), MX(0, lateness_share + closing_points + extension_points))
  - refund_owed: rush_open * refund_share / 100 if in_scope == 1 and days_late > 0 else 0
  - result: RND(refund_owed, 2)
  compute_basis:
    rush_open: then that share is applied once to the rush charge standing on the order
    rush_charge_date: A rush charge on a cancelled order, on an order placed as an HPML flip second appraisal, or collected before the borrower's intent to proceed is outside this rule, because the fee refund policy returns it in full.
    itp_date: A rush charge on a cancelled order, on an order placed as an HPML flip second appraisal, or collected before the borrower's intent to proceed is outside this rule, because the fee refund policy returns it in full.
    in_scope: A late-rush refund is owed on a completed order whose borrower paid a rush charge and whose days late are one or more, and nothing is refunded when the days late are zero or fewer.
    value_change_decisions: when the order carries reconsideration decisions that changed the value, they run to the decided date of the latest such decision
    value_change_date: when the order carries reconsideration decisions that changed the value, they run to the decided date of the latest such decision
    delivery_hold: when the copy reached the borrower more than 2 calendar days after the completed date, they run to the date the copy was delivered to the borrower
    late_endpoint: 'The counting rule of the late-rush refund picks the date the days late run to: when the order carries reconsideration decisions that changed the value, they run to the decided date of the latest such decision; when the copy reached the borrower more than 2 calendar days after the completed date, they run to the date the copy was delivered to the borrower; otherwise they run to the completed date.'
    days_late: The standard late-rush refund returns the rush charge standing on the order in full, the days late being the calendar days from the due date to the completed date.
    lateness_share: 'The lateness share of the late-rush refund follows the days late: 1 or 2 days late returns 25 percent, 3 to 5 days late returns 50 percent, and 6 days late or more returns 100 percent.'
    scheduled_close: The closing-slip points of the late-rush refund count the calendar days by which the closing date currently scheduled on the loan file falls after the contract closing date
    contract_close: The closing-slip points of the late-rush refund count the calendar days by which the closing date currently scheduled on the loan file falls after the contract closing date
    slip_days: The closing-slip points of the late-rush refund count the calendar days by which the closing date currently scheduled on the loan file falls after the contract closing date
    closing_points: a slip of 10 days or more adds 20 percentage points, a slip of 1 to 9 days adds 10 points, and no slip adds nothing.
    file_lock_id: The extension-cost points of the late-rush refund read the rate lock on the same loan file and total the lock costs the borrower still bears there, that is the extension costs booked to the borrower on that lock less every lock-cost waiver booked on that lock
    borrower_extension_cost: The extension-cost points of the late-rush refund read the rate lock on the same loan file and total the lock costs the borrower still bears there, that is the extension costs booked to the borrower on that lock less every lock-cost waiver booked on that lock
    extension_points: lock costs still borne of 500 dollars or more add 10 percentage points, more than zero and under 500 dollars add 5 points, and nothing still borne adds nothing.
    refund_share: the lateness share, the closing-slip points and the extension-cost points are added together into one refund share, which is never more than 100 percent and never less than zero
    refund_owed: A late-rush refund is owed on a completed order whose borrower paid a rush charge and whose days late are one or more, and nothing is refunded when the days late are zero or fewer.
    result: the refund is kept to the cent.
  factors:
  - id: lateness_share_tier
    effect: parameter
    decides: lateness_share
    bindings:
    - days_late
    - lateness_share
    ladder:
    - when: the report was 1 or 2 days late
      value: 25 percent
    - when: the report was 3 to 5 days late
      value: 50 percent
    - when: otherwise (6 days late or more)
      value: 100 percent
    baseline:
      lateness_share: K('full_share')
    evidence:
    - date
    cross_difficulty: null
  - id: days_late_endpoint
    effect: method
    decides: late_endpoint
    bindings:
    - value_change_decisions
    - value_change_date
    - delivery_hold
    - late_endpoint
    ladder:
    - when: the order carries reconsideration decisions that changed the value
      method: the days late run from the due date to the decided date of the latest such decision
    - when: the copy reached the borrower more than 2 calendar days after the completed date
      method: the days late run from the due date to the date the copy was delivered to the borrower
    - when: otherwise
      method: the days late run from the due date to the completed date
    baseline:
      late_endpoint: F('completed_date')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: closing_slip_points
    effect: parameter
    decides: closing_points
    bindings:
    - scheduled_close
    - contract_close
    - slip_days
    - closing_points
    ladder:
    - when: the loan file's scheduled closing date falls 10 days or more after its contract closing date
      value: 20 percentage points
    - when: the loan file's scheduled closing date falls 1 to 9 days after its contract closing date
      value: 10 percentage points
    - when: otherwise
      value: nothing
    baseline:
      closing_points: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: loan
  - id: extension_cost_points
    effect: parameter
    decides: extension_points
    bindings:
    - file_lock_id
    - borrower_extension_cost
    - extension_points
    ladder:
    - when: the lock costs the borrower still bears on the loan file's rate lock (extension costs booked to the borrower less every lock-cost waiver on that lock) total 500 dollars or more
      value: 10 percentage points
    - when: those lock costs still borne total more than zero and under 500 dollars
      value: 5 percentage points
    - when: otherwise
      value: nothing
    baseline:
      extension_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: lock
  baseline:
    rule: A late-rush refund is owed on a completed order whose borrower paid a rush charge and whose days late are one or more, and nothing is refunded when the days late are zero or fewer. A rush charge on a cancelled order, on an order placed as an HPML flip second appraisal, or collected before the borrower's intent to proceed is outside this rule, because the fee refund policy returns it in full. The standard late-rush refund returns the rush charge standing on the order in full, the days late being the calendar days from the due date to the completed date.
    params:
    - full_share
  inputs:
    history:
    - table: appraisal_fee_ledger
      aggregate: sum
      field: amount
      filters:
        fee_component: rush_fee
    - table: appraisal_reconsiderations
      aggregate: latest
      field: decided_date
      filters:
        decision: value_changed
    - category: lock
      table: lock_pricing_events
      aggregate: sum
      field: cost_amount
      filters:
        cost_bearer: borrower
    cross_category:
    - loan
    - lock
- id: appraisal_ext_final_inspection_charge
  base_policy_refs:
  - appraisal_fee_schedule
  - appraisal_validity_and_update
  - appraisal_hpml_flip_second_appraisal
  overwrite:
  - base_policy: appraisal_validity_and_update
    superseded_clause: A value subject to completion or repairs (subject_to_completion true) also needs a Form 1004D completion inspection before funding, charged reinspection_fee.
    replaced_by: A value subject to completion or repairs needs a Form 1004D completion inspection before funding; that completion visit is charged under this rule when the report is inside its validity days at the closing date currently scheduled on the loan file, while a report past its validity days has its completion certified in the combined visit charged under the update visit charge or, past its maximum age with an update, is replaced by a new order; an order whose value is not subject to completion is charged nothing under this rule.
  - base_policy: appraisal_fee_schedule
    superseded_clause: reinspection_fee is charged once for each Form 1004D completion or update inspection.
    replaced_by: For a completion visit charged under this rule the reinspection charge is the final inspection charge worked out below, collected once for the visit; an update visit, including one that also certifies completion, is charged under the update visit charge, and any other Form 1004D inspection is still charged the report type's reinspection fee once.
  - base_policy: appraisal_fee_schedule
    superseded_clause: there is no stacking or discount between components, each is charged at its own amount.
    replaced_by: The final inspection charge stacks the parts below on its visit base, less its outlay courtesy, its partner-builder reduction and the borrower's share for a late original report; the complexity add-on and the update visit charge stack their own parts under their own rules, and every other appraisal charge is still charged at its own amount with no stacking or discount.
  trigger: on_request
  subject:
  - appraisal_fee_charged
  computes: charge_amount
  target_tool: pay_final_inspection_charge_e30bacb7
  params:
    revisit_window_months: 2
    near_close_days: 5
    mid_close_days: 10
    mid_close_rush_pct: 50
    fha_review_addon: 50
    va_review_addon: 40
    mid_outlay_floor: 1000
    high_outlay_floor: 1500
    mid_outlay_courtesy: 30
    high_outlay_courtesy: 60
    verified_partner_reduction: 100
    reserved_partner_reduction: 50
    long_delay_days: 3
    long_delay_share: 50
    short_delay_share: 75
    full_borrower_share: 100
  rule: 'A value subject to completion or repairs needs a Form 1004D completion inspection before funding; that completion visit is charged under this rule when the report is inside its validity days at the closing date currently scheduled on the loan file, while a report past its validity days has its completion certified in the combined visit charged under the update visit charge or, past its maximum age with an update, is replaced by a new order; an order whose value is not subject to completion is charged nothing under this rule. An order placed as an HPML flip second appraisal is never charged a completion visit. The final inspection charge is paid by the borrower in their own name, from the card or account the borrower chooses. The standard final inspection charge is the report type''s reinspection fee, charged once for the visit and paid in full by the borrower. The final inspection charge is fixed only after the order''s fee history shows the refund owed on any rush charge whose promised delivery date was missed. For a completion visit charged under this rule the reinspection charge is the final inspection charge worked out below, collected once for the visit; an update visit, including one that also certifies completion, is charged under the update visit charge, and any other Form 1004D inspection is still charged the report type''s reinspection fee once. The final inspection charge stacks the parts below on its visit base, less its outlay courtesy, its partner-builder reduction and the borrower''s share for a late original report; the complexity add-on and the update visit charge stack their own parts under their own rules, and every other appraisal charge is still charged at its own amount with no stacking or discount. The final inspection charge is worked out in this order: first the visit base is set by the re-visit rule; then the closing-turn part and the program part are added to it and the outlay courtesy and the partner-builder reduction are taken off, the result never going below zero; then the borrower''s share for a late original report is applied once to that figure; the charge is kept to the cent. The re-visit rule of the final inspection charge reads the reinspection charges already on the order: when the order''s fee history carries reinspection charges dated within the last 2 calendar months, the appraiser is going back to finish the same completion check and the visit base is the report type''s reinspection fee less those recent reinspection charges, but never less than the report type''s trip fee; when it carries only older reinspection charges, the visit base is the report type''s reinspection fee plus its trip fee; when it carries no reinspection charge, the visit base is the report type''s reinspection fee. The closing-turn part of the final inspection charge reads the closing scheduled for the loan file and counts calendar days from today to its scheduled closing date: 0 to 5 days adds the report type''s rush fee, 6 to 10 days adds 50 percent of that rush fee, and a later date or no scheduled closing adds nothing. The closing-turn part is a turn-time premium inside the final inspection charge; it is not a rush charge on the order, which is still charged only when the borrower asks for rush at order. The program part of the final inspection charge reads the loan program of the loan file: the Larkspur FHA 30-Year Fixed adds 50 dollars, the Larkspur VA 30-Year Fixed adds 40 dollars, and every other program adds nothing. The outlay courtesy of the final inspection charge reads the appraisal charges standing on the order, that is every charge less every refund: standing charges of 1,500 dollars or more take off 60 dollars, standing charges of 1,000 to 1,499.99 dollars take off 30 dollars, and lower standing charges take off nothing. The partner-builder reduction of the final inspection charge reads the Builder Partner Credit on the loan file: a verified credit takes off 100 dollars, a reserved credit takes off 50 dollars, and no such credit, or one in any other status, takes off nothing. The borrower''s share of the final inspection charge for a late original report reads the order''s fee history and its dates: when the order carries a refund for a missed rush promise and the report was completed 3 days or more after its due date, the borrower pays 50 percent; when it carries such a refund and the report was completed 1 or 2 days after its due date, the borrower pays 75 percent; otherwise the borrower pays 100 percent.'
  prerequisite:
  - problem: appraisal_ext_late_rush_refund
    kind: value_input
    gate: rush_miss_refunds
    form: state
    policy_source: The final inspection charge is fixed only after the order's fee history shows the refund owed on any rush charge whose promised delivery date was missed.
    condition: The order's fee history carries a rush-line refund with the reason that the rush promise was missed, for the rush charge whose report arrived after its due date.
    resolved_by: refund_late_rush_charge_6e5bda3a
    effect: Once the late-rush refund stands, the order carries a refund for a missed rush promise, so the borrower's share for a late original report moves from 100 percent to the tier the report's completed-versus-due days select.
  cross_category:
  - category: funding
    as: branch
    reads:
    - scheduled_closing_date
    - status
    note: the closing-turn part reads the scheduled closing date of the closing scheduled for the loan file
  - category: loan
    as: branch
    reads:
    - variant_name
    - estimated_closing_date
    note: the program part reads the loan program, and the age test reads the closing date currently scheduled on the loan file
  - category: credit
    as: branch
    reads:
    - status
    - variant_name
    note: the partner-builder reduction reads the status of the Builder Partner Credit on the loan file
  compute:
  - report_age_at_close: DAYS(F('inspection_date'), CFIELD('loan', 'estimated_closing_date', loan_file_id=F('loan_file_id')))
  - completion_charged_here: 1 if F('subject_to_completion') == True and report_age_at_close <= P('validity_days') and F('order_reason') != 'second_appraisal_hpml_flip' else 0
  - recent_revisit_charges: COUNT('appraisal_fee_ledger', within_months=K('revisit_window_months'), date_field='entry_date', event_type='appraisal_fee_charged', fee_component='reinspection_fee')
  - recent_revisit_paid: SUM('appraisal_fee_ledger', 'amount', within_months=K('revisit_window_months'), date_field='entry_date', event_type='appraisal_fee_charged', fee_component='reinspection_fee')
  - all_revisit_charges: COUNT('appraisal_fee_ledger', event_type='appraisal_fee_charged', fee_component='reinspection_fee')
  - visit_base: MX(P('trip_fee'), P('reinspection_fee') - recent_revisit_paid) if recent_revisit_charges >= 1 else (P('reinspection_fee') + P('trip_fee') if all_revisit_charges >= 1 else P('reinspection_fee'))
  - scheduled_signing: CFIELD('funding', 'scheduled_closing_date', loan_file_id=F('loan_file_id'), status='scheduled')
  - days_to_signing: DAYS(NOW, scheduled_signing) if scheduled_signing else -1
  - closing_turn_part: P('rush_fee') if days_to_signing >= 0 and days_to_signing <= K('near_close_days') else (RND(P('rush_fee') * K('mid_close_rush_pct') / 100, 2) if days_to_signing > K('near_close_days') and days_to_signing <= K('mid_close_days') else 0)
  - file_program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - program_part: K('fha_review_addon') if file_program == 'Larkspur FHA 30-Year Fixed' else (K('va_review_addon') if file_program == 'Larkspur VA 30-Year Fixed' else 0)
  - standing_outlay: SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_charged') - SUM('appraisal_fee_ledger', 'amount', event_type='appraisal_fee_refunded')
  - outlay_courtesy: K('high_outlay_courtesy') if standing_outlay >= K('high_outlay_floor') else (K('mid_outlay_courtesy') if standing_outlay >= K('mid_outlay_floor') else 0)
  - partner_credit_status: CFIELD('credit', 'status', loan_file_id=F('loan_file_id'), variant_name='Larkspur Builder Partner Credit')
  - partner_reduction: K('verified_partner_reduction') if partner_credit_status == 'verified' else (K('reserved_partner_reduction') if partner_credit_status == 'reserved' else 0)
  - charge_before_share: MX(0, visit_base + closing_turn_part + program_part - outlay_courtesy - partner_reduction)
  - rush_miss_refunds: COUNT('appraisal_fee_ledger', event_type='appraisal_fee_refunded', refund_reason='rush_deadline_missed')
  - original_delay_days: DAYS(F('due_date'), F('completed_date'))
  - borrower_share: K('long_delay_share') if rush_miss_refunds >= 1 and original_delay_days >= K('long_delay_days') else (K('short_delay_share') if rush_miss_refunds >= 1 and original_delay_days >= 1 and original_delay_days < K('long_delay_days') else K('full_borrower_share'))
  - result: RND(charge_before_share * borrower_share / 100 if completion_charged_here == 1 else 0, 2)
  compute_basis:
    report_age_at_close: that completion visit is charged under this rule when the report is inside its validity days at the closing date currently scheduled on the loan file
    completion_charged_here: A value subject to completion or repairs needs a Form 1004D completion inspection before funding; that completion visit is charged under this rule when the report is inside its validity days at the closing date currently scheduled on the loan file, while a report past its validity days has its completion certified in the combined visit charged under the update visit charge or, past its maximum age with an update, is replaced by a new order; an order whose value is not subject to completion is charged nothing under this rule.
    recent_revisit_charges: when the order's fee history carries reinspection charges dated within the last 2 calendar months, the appraiser is going back to finish the same completion check
    recent_revisit_paid: the visit base is the report type's reinspection fee less those recent reinspection charges, but never less than the report type's trip fee
    all_revisit_charges: The re-visit rule of the final inspection charge reads the reinspection charges already on the order
    visit_base: when the order's fee history carries reinspection charges dated within the last 2 calendar months, the appraiser is going back to finish the same completion check and the visit base is the report type's reinspection fee less those recent reinspection charges, but never less than the report type's trip fee; when it carries only older reinspection charges, the visit base is the report type's reinspection fee plus its trip fee; when it carries no reinspection charge, the visit base is the report type's reinspection fee.
    scheduled_signing: The closing-turn part of the final inspection charge reads the closing scheduled for the loan file and counts calendar days from today to its scheduled closing date
    days_to_signing: counts calendar days from today to its scheduled closing date
    closing_turn_part: 0 to 5 days adds the report type's rush fee, 6 to 10 days adds 50 percent of that rush fee, and a later date or no scheduled closing adds nothing.
    file_program: The program part of the final inspection charge reads the loan program of the loan file
    program_part: the Larkspur FHA 30-Year Fixed adds 50 dollars, the Larkspur VA 30-Year Fixed adds 40 dollars, and every other program adds nothing.
    standing_outlay: The outlay courtesy of the final inspection charge reads the appraisal charges standing on the order, that is every charge less every refund
    outlay_courtesy: standing charges of 1,500 dollars or more take off 60 dollars, standing charges of 1,000 to 1,499.99 dollars take off 30 dollars, and lower standing charges take off nothing.
    partner_credit_status: The partner-builder reduction of the final inspection charge reads the Builder Partner Credit on the loan file
    partner_reduction: a verified credit takes off 100 dollars, a reserved credit takes off 50 dollars, and no such credit, or one in any other status, takes off nothing.
    charge_before_share: then the closing-turn part and the program part are added to it and the outlay courtesy and the partner-builder reduction are taken off, the result never going below zero
    rush_miss_refunds: The borrower's share of the final inspection charge for a late original report reads the order's fee history and its dates
    original_delay_days: the report was completed 3 days or more after its due date
    borrower_share: when the order carries a refund for a missed rush promise and the report was completed 3 days or more after its due date, the borrower pays 50 percent; when it carries such a refund and the report was completed 1 or 2 days after its due date, the borrower pays 75 percent; otherwise the borrower pays 100 percent.
    result: then the borrower's share for a late original report is applied once to that figure; the charge is kept to the cent.
  factors:
  - id: revisit_base_method
    effect: method
    decides: visit_base
    bindings:
    - recent_revisit_charges
    - recent_revisit_paid
    - all_revisit_charges
    - visit_base
    ladder:
    - when: the order's fee history carries reinspection charges dated within the last 2 calendar months
      method: 'the visit base is netted: the report type''s reinspection fee less those recent reinspection charges, floored at the report type''s trip fee'
    - when: the order's fee history carries only reinspection charges older than 2 calendar months
      method: 'the visit base is a fresh visit plus travel: the report type''s reinspection fee plus its trip fee'
    - when: otherwise
      method: the visit base is the report type's reinspection fee
    baseline:
      visit_base: P('reinspection_fee')
    evidence:
    - history
    cross_difficulty: null
  - id: signing_turn_tier
    effect: parameter
    decides: closing_turn_part
    bindings:
    - scheduled_signing
    - days_to_signing
    - closing_turn_part
    ladder:
    - when: the closing scheduled for the loan file has its scheduled closing date 0 to 5 calendar days from today
      value: the report type's rush fee
    - when: the closing scheduled for the loan file has its scheduled closing date 6 to 10 calendar days from today
      value: 50 percent of the report type's rush fee
    - when: otherwise
      value: nothing
    baseline:
      closing_turn_part: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: funding
  - id: government_program_tier
    effect: parameter
    decides: program_part
    bindings:
    - file_program
    - program_part
    ladder:
    - when: the loan file's program is the Larkspur FHA 30-Year Fixed
      value: 50 dollars
    - when: the loan file's program is the Larkspur VA 30-Year Fixed
      value: 40 dollars
    - when: otherwise
      value: nothing
    baseline:
      program_part: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: standing_outlay_tier
    effect: parameter
    decides: outlay_courtesy
    bindings:
    - standing_outlay
    - outlay_courtesy
    ladder:
    - when: the appraisal charges standing on the order total 1,500 dollars or more
      value: 60 dollars taken off
    - when: the appraisal charges standing on the order total 1,000 to 1,499.99 dollars
      value: 30 dollars taken off
    - when: otherwise
      value: nothing taken off
    baseline:
      outlay_courtesy: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: partner_builder_tier
    effect: parameter
    decides: partner_reduction
    bindings:
    - partner_credit_status
    - partner_reduction
    ladder:
    - when: the loan file's Builder Partner Credit is verified
      value: 100 dollars taken off
    - when: the loan file's Builder Partner Credit is reserved
      value: 50 dollars taken off
    - when: otherwise
      value: nothing taken off
    baseline:
      partner_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: credit
  - id: late_original_share
    effect: parameter
    decides: borrower_share
    bindings:
    - rush_miss_refunds
    - original_delay_days
    - borrower_share
    ladder:
    - when: the order carries a refund for a missed rush promise and the report was completed 3 days or more after its due date
      value: 50 percent
    - when: the order carries a refund for a missed rush promise and the report was completed 1 or 2 days after its due date
      value: 75 percent
    - when: otherwise
      value: 100 percent
    baseline:
      borrower_share: K('full_borrower_share')
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: A value subject to completion or repairs needs a Form 1004D completion inspection before funding; that completion visit is charged under this rule when the report is inside its validity days at the closing date currently scheduled on the loan file, while a report past its validity days has its completion certified in the combined visit charged under the update visit charge or, past its maximum age with an update, is replaced by a new order; an order whose value is not subject to completion is charged nothing under this rule. An order placed as an HPML flip second appraisal is never charged a completion visit. The standard final inspection charge is the report type's reinspection fee, charged once for the visit and paid in full by the borrower.
    params:
    - reinspection_fee
    - full_borrower_share
    - validity_days
  inputs:
    history:
    - table: appraisal_fee_ledger
      aggregate: sum
      field: amount
      within_months: 2
      filters:
        fee_component: reinspection_fee
    - table: appraisal_fee_ledger
      aggregate: count
      field: amount
      filters:
        refund_reason: rush_deadline_missed
    - table: appraisal_fee_ledger
      aggregate: sum
      field: amount
      filters: {}
    cross_category:
    - funding
    - loan
    - credit
