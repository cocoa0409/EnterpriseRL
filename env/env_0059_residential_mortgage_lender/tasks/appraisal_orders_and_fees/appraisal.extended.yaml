category: appraisal
display_name: Appraisal Order
binding:
  holding_table: appraisal_orders
  event_tables:
  - appraisal_fee_ledger
  - appraisal_reconsiderations
  status_field: status
  variant_field: variant_name
  quantity_fields:
    fee_balance: appraisal_fees
lifecycle:
  states:
  - ordered
  - assigned
  - on_hold
  - inspected
  - completed
  - delivered
  - under_reconsideration
  - cancelled
  transitions:
  - from: ordered
    to: assigned
    by: system
    means: the appraisal management company assigns an appraiser
  - from: ordered
    to: cancelled
    by: user
    means: the borrower cancels the order before an appraiser is assigned
  - from: ordered
    to: cancelled
    by: system
    means: the loan file is withdrawn, denied or closed before assignment
  - from: assigned
    to: on_hold
    by: agent
    means: the order is put on hold because the appraiser cannot get access or a required charge is unpaid
  - from: on_hold
    to: assigned
    by: agent
    means: the hold reason is resolved and the appraiser resumes
  - from: on_hold
    to: cancelled
    by: system
    means: the order stayed on hold past the hold limit, or the loan file closed
  - from: assigned
    to: inspected
    by: system
    means: the appraiser completes the inspection or desktop analysis
  - from: assigned
    to: cancelled
    by: user
    means: the borrower cancels after assignment and before inspection
  - from: assigned
    to: cancelled
    by: system
    means: the loan file is withdrawn, denied or closed after assignment
  - from: inspected
    to: completed
    by: system
    means: the completed report is received
  - from: inspected
    to: cancelled
    by: user
    means: the borrower cancels after the inspection
  - from: completed
    to: delivered
    by: agent
    means: a copy of the report is delivered to the borrower
  - from: delivered
    to: under_reconsideration
    by: agent
    means: a reconsideration of value request is accepted and sent to the appraiser
  - from: under_reconsideration
    to: delivered
    by: agent
    means: the appraiser's response is received and the outcome delivered to the borrower
accounts:
- key: appraisal_fees
  unit: USD
  meaning: appraisal charges the borrower has paid on the order, net of refunds
parameter_schema:
  inspection_scope: 'how the property is observed: desktop (no visit), exterior (drive-by) or interior (full walk-through)'
  eligible_loan_programs: loan programs for which this report type is accepted; list of official loan program names
  eligible_property_types: property types the report form covers; list of loan_files.property_type values
  eligible_loan_purposes: loan purposes for which this report type is accepted; list of loan_files.loan_purpose values
  max_units: maximum dwelling units the form covers; integer
  max_ltv_for_form_pct: maximum base-loan-to-value at which this report type is accepted; percent, 2 decimals
  base_fee: appraisal fee for the report; USD
  standard_turn_business_days: business days from order to promised delivery at standard speed; integer
  rush_available: whether rush turn time can be bought; boolean
  rush_fee: rush fee; USD (0.00 where rush is not available)
  rush_turn_business_days: business days from order to promised delivery with rush; integer (equal to standard where rush is not available)
  trip_fee: fee for an inspection appointment the appraiser kept but could not complete because of access the borrower controls; USD (0.00 for desktop)
  reinspection_fee: final inspection (Form 1004D completion or update) fee; USD
  gla_surcharge_threshold_sqft: gross living area above which the complexity surcharge applies; integer square feet
  gla_surcharge: complexity surcharge for gross living area above the threshold; USD
  acreage_surcharge_threshold_acres: site size above which the acreage surcharge applies; acres, 2 decimals
  acreage_surcharge: surcharge for site size above the threshold; USD
  rent_schedule_fee: add-on fee for a comparable rent schedule (Form 1007) or operating income statement (Form 216) when rental income is used; USD (0.00 where included)
  assignment_turn_business_days: business days within which the appraisal management company assigns an appraiser; integer
  inspection_scheduling_business_days: business days after assignment within which the inspection must be scheduled; integer
  hold_auto_cancel_calendar_days: calendar days an order may stay on hold before it is cancelled; integer
  cancellation_fee_after_assignment: fee retained when an assigned order is cancelled before inspection; USD
  cancellation_fee_after_inspection_pct: share of the base fee retained when an order is cancelled after inspection; percent
  fee_collection_requires_itp: whether appraisal charges may be collected only after the borrower's intent to proceed; boolean
  fee_payment_methods: accepted ways to pay appraisal charges; list of payment_method values
  fee_refund_business_days: business days within which an approved refund is issued; integer
  delivery_business_days_after_completion: business days after completed_date by which the report copy must be delivered to the borrower; integer
  delivery_business_days_before_consummation: business days before consummation by which the report copy must be delivered when no timing waiver is signed; integer
  timing_waiver_allowed: whether the borrower may waive the three-day delivery timing; boolean
  borrower_copy_free: whether the borrower's copy of the report is provided free of charge; boolean
  rov_allowed: whether the borrower may request a reconsideration of value; boolean
  rov_max_per_order: reconsiderations of value accepted per order; integer
  rov_window_calendar_days: calendar days after delivery to the borrower within which a reconsideration request is accepted; integer
  rov_max_comparables: maximum alternative comparable sales the borrower may submit with a request; integer
  rov_min_comparables_for_sales_basis: minimum alternative comparables required when the request rests on comparable sales; integer
  rov_response_business_days: business days within which the appraiser's response is due; integer
  rov_fee: charge to the borrower for a reconsideration of value; USD
  cu_desk_review_threshold: Collateral Underwriter score above which Larkspur orders a desk review at its own expense; decimal, 1 place
  validity_days: maximum age of the report, in calendar days from the inspection date to the note date, without an update; integer
  max_age_with_update_days: maximum age, in calendar days from the inspection date to the note date, reachable with a Form 1004D update; integer (0 = updates not accepted)
  transfer_allowed: whether a report ordered by another lender can be transferred into the file; boolean
  transfer_review_fee: fee to review a transferred report; USD (0.00 where transfers are not allowed)
  second_appraisal_loan_amount_threshold: base loan amount above which a second full appraisal is required and charged; USD (0.00 = never required)
  flip_short_window_days: days since the seller acquired the property within which the short-window price increase test applies; integer
  flip_short_window_increase_pct: price increase over the seller's acquisition price above which an HPML second appraisal is required in the short window; percent
  flip_long_window_days: days since the seller acquired the property within which the long-window price increase test applies; integer
  flip_long_window_increase_pct: price increase above which an HPML second appraisal is required in the long window; percent
  hpml_second_appraisal_chargeable: whether the borrower may be charged for an HPML flip second appraisal; boolean
  desk_review_chargeable: whether the borrower may be charged for a Larkspur-ordered desk review; boolean
