events:
- type: credit_reserved
  target: closing_credits
  mutation: create
  meaning: a closing cost credit program is reserved against a loan file
  grain: one row per credit award
  fields:
    customer_id: borrower who holds the credit (foreign key -> customers)
    loan_file_id: loan file the credit is reserved against (foreign key -> loan_files)
    variant_name: credit program, written as the official program name
    status: 'lifecycle status of the credit (basis: credit lifecycle.states)'
    eligibility_basis: the qualifying fact the credit was reserved on
    heroes_occupation: occupation verified for a Hometown Heroes credit; none for every other program
    partner_builder_name: >-
      legal name of the partner builder on the purchase contract for a Builder Partner credit; empty otherwise
    reserved_date: date the credit was reserved on the loan file
    expiration_date: >-
      date after which an unapplied credit expires: reserved date plus the program's validity days, plus
      any extension
    extension_count: number of validity extensions granted
    guarantee_closing_date: >-
      closing date guaranteed under the On-Time Closing Guarantee (the purchase contract closing date
      at enrollment); empty for other programs
    opened_date: date the credit record was opened
  triggers: []
- type: credit_verified
  target: closing_credits
  mutation:
    transition: {from: reserved, to: verified}
  meaning: eligibility is verified and the award amount fixed
  grain: one row per credit award
  fields:
    status: 'lifecycle status of the credit (basis: credit lifecycle.states)'
    verified_date: date eligibility was verified and the award amount fixed; empty until then
    basis_loan_amount: >-
      base loan amount on the loan file when the award amount was fixed; basis for percentage credits
    award_amount: >-
      credit amount fixed at verification (0.00 for the closing guarantee until a payout is owed)
  triggers:
  - event: credit:credit_award_booked
    when:
      award_amount: {not: 0.0}
    map: {entry_amount: award_amount, entry_date: verified_date}
- type: credit_expiration_extended
  target: closing_credits
  mutation: update
  meaning: the credit's validity is extended
  grain: one row per credit award
  fields:
    expiration_date: >-
      date after which an unapplied credit expires: reserved date plus the program's validity days, plus
      any extension
    extension_count: number of validity extensions granted
  triggers: []
- type: credit_docs_completed
  target: closing_credits
  mutation: update
  meaning: the date the borrower completed document delivery is recorded for the closing guarantee
  grain: one row per credit award
  fields:
    docs_complete_date: >-
      date the borrower delivered the last document Larkspur requested before closing, for the closing
      guarantee; empty until then
  triggers: []
- type: credit_award_booked
  target: credit_ledger
  meaning: the verified award amount becomes available to the borrower
  grain: one row per award or award increase booked
  distinguish_by: [entry_date]
  fields: {credit_award_id: credit award the entry belongs to (foreign key -> closing_credits), customer_id: borrower
      (foreign key -> customers), entry_amount: 'entry amount, always positive; event_type gives the direction',
    entry_date: date the entry was booked}
  account: credit_value
  direction: in
  triggers: []
- type: credit_guarantee_payout_booked
  target: credit_ledger
  meaning: the closing guarantee payout becomes owed after a late closing
  grain: one row per guarantee breach
  distinguish_by: [entry_date]
  fields: {credit_award_id: credit award the entry belongs to (foreign key -> closing_credits), customer_id: borrower
      (foreign key -> customers), entry_amount: 'entry amount, always positive; event_type gives the direction',
    entry_date: date the entry was booked}
  account: credit_value
  direction: in
  triggers: []
- type: credit_applied_at_closing
  target: credit_ledger
  meaning: credit is applied to a cost category on the Closing Disclosure
  grain: one row per credit and cost category applied
  distinguish_by: [cost_category, disclosure_id]
  fields:
    credit_award_id: credit award the entry belongs to (foreign key -> closing_credits)
    customer_id: borrower (foreign key -> customers)
    entry_amount: entry amount, always positive; event_type gives the direction
    entry_date: date the entry was booked
    cost_category: >-
      for an application entry, the cost category on the Closing Disclosure the credit pays; none on other
      entries
    disclosure_id: >-
      Closing Disclosure on which the credit was applied (foreign key -> loan_disclosures); empty on other
      entries
    source_entry_id: >-
      for an application, reduction or forfeiture, the award or payout entry it draws on (foreign key
      -> credit_ledger); empty on awards and payouts
  account: credit_value
  direction: out
  triggers:
  - {event: 'credit:credit_applied'}
- type: credit_reduced
  target: credit_ledger
  meaning: credit that cannot be used is taken off the balance before or at closing
  grain: one row per reduction
  distinguish_by: [reduction_reason, entry_date]
  fields:
    credit_award_id: credit award the entry belongs to (foreign key -> closing_credits)
    customer_id: borrower (foreign key -> customers)
    entry_amount: entry amount, always positive; event_type gives the direction
    entry_date: date the entry was booked
    reduction_reason: >-
      why value left the credit without being applied; none on award, payout and application entries
    source_entry_id: >-
      for an application, reduction or forfeiture, the award or payout entry it draws on (foreign key
      -> credit_ledger); empty on awards and payouts
  account: credit_value
  direction: out
  triggers: []
- type: credit_balance_forfeited
  target: credit_ledger
  meaning: the remaining balance of a credit that will never be applied is forfeited
  grain: one row per credit forfeited
  distinguish_by: [reduction_reason]
  fields:
    credit_award_id: credit award the entry belongs to (foreign key -> closing_credits)
    customer_id: borrower (foreign key -> customers)
    entry_amount: entry amount, always positive; event_type gives the direction
    entry_date: date the entry was booked
    reduction_reason: >-
      why value left the credit without being applied; none on award, payout and application entries
    source_entry_id: >-
      for an application, reduction or forfeiture, the award or payout entry it draws on (foreign key
      -> credit_ledger); empty on awards and payouts
  account: credit_value
  direction: out
  triggers: []
- type: credit_applied
  target: closing_credits
  mutation:
    transition: {from: verified, to: applied}
  meaning: the credit has been applied at consummation
  grain: one row per credit award
  fields: {status: 'lifecycle status of the credit (basis: credit lifecycle.states)', closed_date: 'date
      the credit reached applied, expired, forfeited or revoked; empty otherwise'}
  triggers: []
- type: credit_expired
  target: closing_credits
  mutation:
    transition:
    - {from: reserved, to: expired}
    - {from: verified, to: expired}
  meaning: the credit expires unapplied
  grain: one row per credit award
  fields: {status: 'lifecycle status of the credit (basis: credit lifecycle.states)', closed_date: 'date
      the credit reached applied, expired, forfeited or revoked; empty otherwise'}
  triggers:
  - event: credit:credit_balance_forfeited
    map: {reduction_reason: expired}
- type: credit_forfeited
  target: closing_credits
  mutation:
    transition:
    - {from: reserved, to: forfeited}
    - {from: verified, to: forfeited}
  meaning: the credit is forfeited because the loan will not close
  grain: one row per credit award
  fields: {status: 'lifecycle status of the credit (basis: credit lifecycle.states)', closed_date: 'date
      the credit reached applied, expired, forfeited or revoked; empty otherwise'}
  triggers:
  - event: credit:credit_balance_forfeited
    map: {reduction_reason: loan_not_closed}
- type: credit_revoked
  target: closing_credits
  mutation:
    transition:
    - {from: reserved, to: revoked}
    - {from: verified, to: revoked}
  meaning: the credit is revoked for ineligibility
  grain: one row per credit award
  fields: {status: 'lifecycle status of the credit (basis: credit lifecycle.states)', closed_date: 'date
      the credit reached applied, expired, forfeited or revoked; empty otherwise'}
  triggers:
  - event: credit:credit_balance_forfeited
    map: {reduction_reason: program_change_ineligible}
measures:
- id: credit_msr_credits_on_file
  window: current state at frozen time, per loan file
  measure: >-
    the closing_credits records with the same loan_file_id whose status is reserved, verified or applied,
    with their variant_name
- id: credit_msr_prior_larkspur_loan
  window: prior_loan_lookback_months calendar months ending on the credit's reserved_date
  measure: >-
    count of the customer's loan_files, other than the credit's own file, with status consummated and
    closed_date inside the window
- id: credit_msr_reservations_this_year
  window: the calendar year of the reservation date
  measure: >-
    count of closing_credits of the same customer and variant_name whose reserved_date falls in that calendar
    year, any status
policies:
- id: credit_agg_multi_holding
  subject: [credit_reserved]
  rule: >-
    A customer may hold credits on several loan files over time (max_per_customer is unlimited); on any
    one loan file the combination rules of the stacking policy apply, and each program may be reserved
    at most annual_reservations_per_customer times per calendar year (credit_msr_reservations_this_year).
  eligibility: []
  params: {max_per_customer: null}
  measures: [credit_msr_reservations_this_year]
- id: credit_agg_stacking
  subject: [credit_reserved, credit_applied_at_closing, credit_reduced]
  rule: >-
    Credits on the same loan file are read together (credit_msr_credits_on_file). A loan file may carry
    only one credit of each program in reserved, verified or applied status. A file may carry at most
    max_programs_per_file credits in reserved, verified or applied status. Two credits may sit on one
    file only when each program lists the other in stackable_with; two programs of the same exclusive_group
    (other than none) never combine, so a file holding the Neighborhood Access Grant cannot also hold
    the Neighborhood Access Grant Plus, and a borrower who qualifies for both is offered the Plus. A Builder
    Partner Credit may pay a buydown_subsidy only when the loan file also carries a temporary or permanent
    buydown. At closing the borrower's costs are covered first by the seller and agent concessions recorded
    on the loan file, then by the credits in ascending application_order, each filling its applicable_cost_categories
    in the listed order up to the cost still unpaid in that category; a credit never pays a cost another
    source has already paid, and the sum of every concession and credit on the Closing Disclosure never
    exceeds the borrower's total closing costs, prepaid items and, for credits that allow it, down payment.
    Unused credit is forfeited (unused_balance_treatment), never paid out (cash_back_allowed is false).
  eligibility:
  - id: one_per_program_per_file
    applies_to: [credit_reserved]
    kind: dedup
    condition: >-
      A loan file may carry only one credit of each program in reserved, verified or applied status.
    evidence_fields: [closing_credits.loan_file_id, closing_credits.variant_name, closing_credits.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [closing_credits.loan_file_id, closing_credits.variant_name]
      action_bindings: {closing_credits.loan_file_id: loan_file_id, closing_credits.variant_name: variant_name}
    dedup_contract:
      table: closing_credits
      mode: separate_record
      object_bindings: {loan_file_id: loan_file_id, variant_name: variant_name}
      duplicate_filters:
        status: [reserved, verified, applied]
      distinct_fields: []
  measures: [credit_msr_credits_on_file]
  params:
    max_programs_per_file: 3
    per_tier:
      Larkspur Hometown Heroes Credit: {application_order: =application_order, exclusive_group: =exclusive_group}
      Larkspur Returning Customer Credit: {application_order: =application_order, exclusive_group: =exclusive_group}
      Larkspur First Home Credit: {application_order: =application_order, exclusive_group: =exclusive_group}
      Larkspur On-Time Closing Guarantee: {application_order: =application_order, exclusive_group: =exclusive_group}
      Larkspur Builder Partner Credit: {application_order: =application_order, exclusive_group: =exclusive_group}
      Larkspur Neighborhood Access Grant: {application_order: =application_order, exclusive_group: =exclusive_group}
      Larkspur Neighborhood Access Grant Plus: {application_order: =application_order, exclusive_group: =exclusive_group}
- id: credit_program_eligibility
  subject: [credit_reserved, credit_verified, credit_revoked]
  rule: >-
    A credit may be reserved only while the loan file status is disclosed, processing, underwriting, conditionally_approved
    or suspended. The loan file must meet every test of the program: loan program in eligible_loan_programs,
    loan_purpose in eligible_loan_purposes, occupancy in eligible_occupancies, property type in eligible_property_types,
    credit score at least min_credit_score, base loan amount at most max_base_loan_amount and property
    value at most max_purchase_price. Where requires_first_time_homebuyer is true the file's first_time_homebuyer
    must be true; where requires_homebuyer_education is true a certificate must be on file before verification.
    The income and geography test follows geography_income_test: income_only requires qualifying_income_pct_ami
    at or below max_income_pct_ami; tract_or_income passes when the census_tract_income_level is in eligible_tract_income_levels
    or the income test passes; tract_and_income requires both; none tests neither. Hometown Heroes requires
    a verified heroes_occupation in eligible_occupations. Returning Customer requires at least one other
    Larkspur loan file of the customer consummated within prior_loan_lookback_months calendar months before
    the reservation date (credit_msr_prior_larkspur_loan above zero). Builder Partner requires a new-construction
    purchase from a partner builder named on the contract. Eligibility is verified from verification_documents
    within verification_deadline_days calendar days of reservation; a credit not verified in time, or
    whose documents fail, is revoked. Where program_change_retest is true, a program or amount change
    before closing re-runs every test and a credit that now fails is revoked; a credit that still passes
    keeps its award amount except that percentage credits are re-sized under the award policy.
  eligibility:
  - id: file_open_for_reservation
    applies_to: [credit_reserved]
    kind: state
    condition: >-
      A credit may be reserved only while the loan file status is disclosed, processing, underwriting,
      conditionally_approved or suspended.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_files.loan_file_id]
      action_bindings: {loan_files.loan_file_id: loan_file_id}
    state_contract:
      field: loan_files.status
      allowed: *id003
  measures: [credit_msr_prior_larkspur_loan]
  params:
    per_tier:
      Larkspur Hometown Heroes Credit: {geography_income_test: =geography_income_test, max_income_pct_ami: =max_income_pct_ami}
      Larkspur Returning Customer Credit: {geography_income_test: =geography_income_test, max_income_pct_ami: =max_income_pct_ami}
      Larkspur First Home Credit: {geography_income_test: =geography_income_test, max_income_pct_ami: =max_income_pct_ami}
      Larkspur On-Time Closing Guarantee: {geography_income_test: =geography_income_test, max_income_pct_ami: =max_income_pct_ami}
      Larkspur Builder Partner Credit: {geography_income_test: =geography_income_test, max_income_pct_ami: =max_income_pct_ami}
      Larkspur Neighborhood Access Grant: {geography_income_test: =geography_income_test, max_income_pct_ami: =max_income_pct_ami}
      Larkspur Neighborhood Access Grant Plus: {geography_income_test: =geography_income_test, max_income_pct_ami: =max_income_pct_ami}
- id: credit_award_amount
  subject: [credit_verified, credit_award_booked]
  rule: >-
    At verification the award amount is fixed. A fixed credit awards fixed_credit_amount. A percentage
    credit awards basis_loan_amount times credit_pct_of_base_loan percent, rounded to the cent, raised
    to min_credit_amount when below it and lowered to credit_cap when above it; basis_loan_amount is the
    base loan amount on the file at verification, never the financed total. If the base loan amount changes
    before closing the award is re-sized the same way, and a decrease is booked as a credit_reduced entry
    for the difference with reduction_reason loan_amount_decreased, and an increase as a further award
    entry for the difference. The closing guarantee awards 0.00 at verification; its payout is booked
    only under the guarantee policy. The verified award is booked once as an award entry.
  eligibility: []
  formula:
    award_amount: >-
      fixed_credit_amount if credit_amount_type == 'fixed' else min(credit_cap, max(min_credit_amount,
      round(basis_loan_amount * credit_pct_of_base_loan / 100, 2)))
  params:
    per_tier:
      Larkspur Hometown Heroes Credit: {fixed_credit_amount: =fixed_credit_amount, credit_pct_of_base_loan: =credit_pct_of_base_loan,
        min_credit_amount: =min_credit_amount, credit_cap: =credit_cap}
      Larkspur Returning Customer Credit: {fixed_credit_amount: =fixed_credit_amount, credit_pct_of_base_loan: =credit_pct_of_base_loan,
        min_credit_amount: =min_credit_amount, credit_cap: =credit_cap}
      Larkspur First Home Credit: {fixed_credit_amount: =fixed_credit_amount, credit_pct_of_base_loan: =credit_pct_of_base_loan,
        min_credit_amount: =min_credit_amount, credit_cap: =credit_cap}
      Larkspur On-Time Closing Guarantee: {fixed_credit_amount: =fixed_credit_amount, credit_pct_of_base_loan: =credit_pct_of_base_loan,
        min_credit_amount: =min_credit_amount, credit_cap: =credit_cap}
      Larkspur Builder Partner Credit: {fixed_credit_amount: =fixed_credit_amount, credit_pct_of_base_loan: =credit_pct_of_base_loan,
        min_credit_amount: =min_credit_amount, credit_cap: =credit_cap}
      Larkspur Neighborhood Access Grant: {fixed_credit_amount: =fixed_credit_amount, credit_pct_of_base_loan: =credit_pct_of_base_loan,
        min_credit_amount: =min_credit_amount, credit_cap: =credit_cap}
      Larkspur Neighborhood Access Grant Plus: {fixed_credit_amount: =fixed_credit_amount, credit_pct_of_base_loan: =credit_pct_of_base_loan,
        min_credit_amount: =min_credit_amount, credit_cap: =credit_cap}
- id: credit_validity
  subject: [credit_expiration_extended, credit_expired]
  rule: >-
    expiration_date is reserved_date plus award_validity_days calendar days, the reserved date being day
    zero. An extension is granted only if it is requested no later than the credit's current expiration
    date. Compare the request date with expiration_date; a request on the expiration date itself is on
    time, a request on any later day is not. An extension adds extension_days calendar days to the current
    expiration_date and raises extension_count by one; at most max_extensions are granted, and only while
    the loan file status is in extension_allowed_file_statuses. A credit expires only once its expiration
    date has passed. Compare the frozen-time date with expiration_date; the credit is still valid on the
    expiration date itself and expires from the following day. An expired credit's remaining balance is
    forfeited and the credit cannot be reinstated; the borrower may reserve the program again only within
    annual_reservations_per_customer.
  eligibility:
  - id: extension_before_expiry
    applies_to: [credit_expiration_extended]
    kind: time
    condition: >-
      An extension is granted only if it is requested no later than the credit's current expiration date.
    evidence_fields: [closing_credits.expiration_date, closing_credits.credit_award_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: &id008
      - [closing_credits.credit_award_id]
      action_bindings: &id009 {closing_credits.credit_award_id: credit_award_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the credit's current expiration date
      anchor_source: closing_credits.expiration_date
      relation: not_after
      duration_source: params.request_grace_days
      unit: calendar_days
      counting_rule: >-
        Compare the request date with expiration_date; a request on the expiration date itself is on time,
        a request on any later day is not.
      boundary: inclusive
  - id: expiry_passed
    applies_to: [credit_expired]
    kind: time
    condition: A credit expires only once its expiration date has passed.
    evidence_fields: [closing_credits.expiration_date, closing_credits.credit_award_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id008
      action_bindings: *id009
    temporal_basis:
      clock: frozen_time
      anchor_event: its expiration date
      anchor_source: closing_credits.expiration_date
      relation: not_before
      duration_source: params.request_grace_days
      unit: calendar_days
      counting_rule: >-
        Compare the frozen-time date with expiration_date; the credit is still valid on the expiration
        date itself and expires from the following day.
      boundary: exclusive
  params:
    request_grace_days: 0
    per_tier:
      Larkspur Hometown Heroes Credit: {award_validity_days: =award_validity_days, extension_days: =extension_days,
        max_extensions: =max_extensions}
      Larkspur Returning Customer Credit: {award_validity_days: =award_validity_days, extension_days: =extension_days,
        max_extensions: =max_extensions}
      Larkspur First Home Credit: {award_validity_days: =award_validity_days, extension_days: =extension_days,
        max_extensions: =max_extensions}
      Larkspur On-Time Closing Guarantee: {award_validity_days: =award_validity_days, extension_days: =extension_days,
        max_extensions: =max_extensions}
      Larkspur Builder Partner Credit: {award_validity_days: =award_validity_days, extension_days: =extension_days,
        max_extensions: =max_extensions}
      Larkspur Neighborhood Access Grant: {award_validity_days: =award_validity_days, extension_days: =extension_days,
        max_extensions: =max_extensions}
      Larkspur Neighborhood Access Grant Plus: {award_validity_days: =award_validity_days, extension_days: =extension_days,
        max_extensions: =max_extensions}
- id: credit_application_at_closing
  subject: [credit_applied_at_closing, credit_applied, credit_reduced]
  rule: >-
    A credit is applied at closing only while the credit status is verified. At consummation each verified
    credit on the file is applied on the final Closing Disclosure in the order and up to the limits of
    the stacking policy, against nonrecurring_closing_costs, prepaid_items_total and discount_points_amount
    on that disclosure, against the buydown subsidy of a buydown on the file, and against the down payment
    (property value less base loan amount) where allowed. One application entry is booked per cost category
    filled, naming the Closing Disclosure and the award or payout entry it draws on. A Builder Partner
    Credit counts toward the interested party contribution cap together with the seller and agent concessions
    (counts_toward_ipc); the part above the cap is booked as credit_reduced with exceeds_interested_party_cap
    before anything is applied. What remains after every eligible cost is paid is booked as credit_reduced
    with exceeds_eligible_costs. Once every application and reduction is booked the credit is applied
    and its balance is zero. A reserved credit that was never verified cannot be applied and is forfeited
    with the loan's closing.
  eligibility:
  - id: verified_before_application
    applies_to: [credit_applied_at_closing]
    kind: state
    condition: A credit is applied at closing only while the credit status is verified.
    evidence_fields: [closing_credits.status, closing_credits.credit_award_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id008
      action_bindings: *id009
    state_contract:
      field: closing_credits.status
      allowed: [verified]
  params:
    per_tier:
      Larkspur Hometown Heroes Credit: {applicable_cost_categories: =applicable_cost_categories, counts_toward_ipc: =counts_toward_ipc}
      Larkspur Returning Customer Credit: {applicable_cost_categories: =applicable_cost_categories, counts_toward_ipc: =counts_toward_ipc}
      Larkspur First Home Credit: {applicable_cost_categories: =applicable_cost_categories, counts_toward_ipc: =counts_toward_ipc}
      Larkspur On-Time Closing Guarantee: {applicable_cost_categories: =applicable_cost_categories, counts_toward_ipc: =counts_toward_ipc}
      Larkspur Builder Partner Credit: {applicable_cost_categories: =applicable_cost_categories, counts_toward_ipc: =counts_toward_ipc}
      Larkspur Neighborhood Access Grant: {applicable_cost_categories: =applicable_cost_categories, counts_toward_ipc: =counts_toward_ipc}
      Larkspur Neighborhood Access Grant Plus: {applicable_cost_categories: =applicable_cost_categories,
        counts_toward_ipc: =counts_toward_ipc}
- id: credit_forfeiture
  subject: [credit_forfeited, credit_balance_forfeited, credit_revoked]
  rule: >-
    When the loan file is withdrawn, denied, closed for incompleteness or lapses for want of intent to
    proceed, every reserved or verified credit on it is forfeited and any booked balance is forfeited
    with reduction_reason loan_not_closed. A revoked credit forfeits its balance with program_change_ineligible
    and an expired one with expired. A forfeiture entry names the award or payout entry it draws on and
    carries the whole remaining balance; nothing is ever paid to the borrower in cash. A credit on a withdrawn
    file does not move to a new application; the new file reserves afresh.
  eligibility: []
- id: credit_closing_guarantee
  subject: [credit_guarantee_payout_booked, credit_docs_completed, credit_reserved]
  rule: >-
    The On-Time Closing Guarantee is enrolled on a purchase within guarantee_enrollment_window_business_days
    business days after the application date, only when the contract closing date is at least guarantee_min_days_application_to_closing
    calendar days after the application date; guarantee_closing_date is the contract closing date at enrollment
    and does not move when the contract is amended. A guarantee payout is booked only when the loan was
    consummated after the guaranteed closing date. Compare the loan file's closed_date (the consummation
    date) with guarantee_closing_date; consummation on the guaranteed date itself is on time and owes
    nothing. The payout of guarantee_payout_amount is owed only when the borrower delivered every requested
    document (docs_complete_date) at least guarantee_docs_deadline_days calendar days before guarantee_closing_date
    and the delay was not caused by any of guarantee_excluded_delay_causes; it is delivered as a lender
    credit at closing (guarantee_payout_method) and applied like any other credit. A loan that never closes
    owes no payout.
  eligibility:
  - id: closed_late
    applies_to: [credit_guarantee_payout_booked]
    kind: time
    condition: >-
      A guarantee payout is booked only when the loan was consummated after the guaranteed closing date.
    evidence_fields: [closing_credits.guarantee_closing_date, loan_files.closed_date, closing_credits.credit_award_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id008
      action_bindings: *id009
    temporal_basis:
      clock: frozen_time
      anchor_event: the guaranteed closing date
      anchor_source: closing_credits.guarantee_closing_date
      relation: not_before
      duration_source: params.grace_days
      unit: calendar_days
      counting_rule: >-
        Compare the loan file's closed_date (the consummation date) with guarantee_closing_date; consummation
        on the guaranteed date itself is on time and owes nothing.
      boundary: exclusive
  params:
    grace_days: 0
    per_tier:
      Larkspur Hometown Heroes Credit: {guarantee_payout_amount: =guarantee_payout_amount}
      Larkspur Returning Customer Credit: {guarantee_payout_amount: =guarantee_payout_amount}
      Larkspur First Home Credit: {guarantee_payout_amount: =guarantee_payout_amount}
      Larkspur On-Time Closing Guarantee: {guarantee_payout_amount: =guarantee_payout_amount}
      Larkspur Builder Partner Credit: {guarantee_payout_amount: =guarantee_payout_amount}
      Larkspur Neighborhood Access Grant: {guarantee_payout_amount: =guarantee_payout_amount}
      Larkspur Neighborhood Access Grant Plus: {guarantee_payout_amount: =guarantee_payout_amount}

extended_policies:
- id: credit_ext_neighborhood_grant_award
  base_policy_refs:
  - credit_program_eligibility
  - credit_award_amount
  overwrite:
  - base_policy: credit_award_amount
    superseded_clause: A fixed credit awards fixed_credit_amount.
    replaced_by: For a Neighborhood Access Grant, and only for such a credit, the award is the result of the order stated below rather than simply the fixed_credit_amount;
      every other fixed credit except the Hometown Heroes Credit, whose award follows the Hometown Heroes award rule, still awards its fixed_credit_amount.
  trigger: on_request
  subject:
  - credit_verified
  - credit_award_booked
  computes: award_amount
  target_tool: certify_grant_occupancy_149507f1
  params:
    start_moderate: 4900.0
    start_income_only: 4750.0
    score_low: 640
    score_high: 680
    holdback_below_640: 500.0
    holdback_640_679: 250.0
    price_upper: 225000.0
    price_lower: 150000.0
    price_upper_add: 250.0
    price_lower_cut: 250.0
    single_income_add: 200.0
    multi_income_cut: 200.0
    burden_high_pct: 4.0
    burden_mid_pct: 3.0
    burden_high_add: 250.0
    burden_mid_add: 125.0
    phase_start_pct: 80
    phase_per_point: 25.0
    deep_subsidy_pct: 50
    deep_subsidy_add: 300.0
  rule: 'A Neighborhood Access Grant is verified when the borrower signs the twelve-month owner-occupancy certification within the verification deadline,
    its program tests being those of the eligibility policy; the grant award is fixed on that certification and booked once as an award entry on the grant''s
    ledger. The grant award at certification is the program''s fixed_credit_amount, lowered to the program''s credit_cap when above it. Larkspur sizes the
    Neighborhood Access Grant award to the household as follows. The starting amount of the grant award follows the census tract income level of the property:
    a property in a moderate-income tract starts at 4,900.00; a property in a middle-income or upper-income tract, where the grant is qualified on income
    alone, starts at 4,750.00; a property in a low-income tract starts at the fixed_credit_amount. A credit-score holdback applies: a representative credit
    score below 640 holds back 500.00, a representative credit score from 640 through 679 holds back 250.00, and a representative credit score of 680 or
    more holds back nothing. A purchase-price adjustment applies: a property value above 225,000.00 adds 250.00, a property value of 150,000.00 or less
    subtracts 250.00, and any other property value adds nothing. A household-income adjustment applies: a loan file with one borrower adds 200.00, a loan
    file with three or more borrowers subtracts 200.00, and a loan file with two borrowers adds nothing. A closing-cost burden adjustment applies, read
    from the total closing costs on the latest Closing Disclosure issued on the loan file: total closing costs above 4 percent of the property value add
    250.00, total closing costs above 3 percent and at most 4 percent of the property value add 125.00, and lower total closing costs add nothing. An income
    adjustment applies, worked out differently by the qualifying income on the loan file: qualifying income above 80 percent of area median income phases
    the grant down, the income adjustment being minus 25.00 for each whole percentage point of area median income above 80; qualifying income at or below
    50 percent of area median income earns a flat deep-subsidy supplement of plus 300.00; qualifying income above 50 percent and at most 80 percent of area
    median income takes no income adjustment. For a Neighborhood Access Grant, and only for such a credit, the award is the result of the order stated below
    rather than simply the fixed_credit_amount; every other fixed credit except the Hometown Heroes Credit, whose award follows the Hometown Heroes award
    rule, still awards its fixed_credit_amount. The Neighborhood Access Grant award is computed in this order: first the credit-score holdback is subtracted
    from the starting amount; then the purchase-price, household-income and closing-cost burden adjustments are each added with their sign; then the income
    adjustment is added with its sign; the result is lowered to the program''s credit_cap when above it and rounded to the cent.'
  prerequisite: []
  cross_category:
  - category: loan
    as: branch
    reads:
    - census_tract_income_level
    - qualifying_income_pct_ami
    - credit_score
    - property_value
    - borrower_count
    - loan_disclosures.total_closing_costs
    note: The starting amount, holdback, price, household, burden and income tiers are read from the borrower's loan file and its latest Closing Disclosure.
  compute:
  - tract: CFIELD('loan', 'census_tract_income_level', loan_file_id=F('loan_file_id'))
  - grant_start: K('start_moderate') if tract == 'moderate' else (K('start_income_only') if (tract == 'middle' or tract == 'upper') else P('fixed_credit_amount'))
  - score: CFIELD('loan', 'credit_score', loan_file_id=F('loan_file_id'))
  - score_holdback: K('holdback_below_640') if score < K('score_low') else (K('holdback_640_679') if score < K('score_high') else 0)
  - home_value: CFIELD('loan', 'property_value', loan_file_id=F('loan_file_id'))
  - price_adjustment: K('price_upper_add') if home_value > K('price_upper') else (0 - K('price_lower_cut') if home_value <= K('price_lower') else 0)
  - borrowers: CFIELD('loan', 'borrower_count', loan_file_id=F('loan_file_id'))
  - household_adjustment: K('single_income_add') if borrowers == 1 else (0 - K('multi_income_cut') if borrowers >= 3 else 0)
  - cd_total_costs: XLATEST('loan', 'loan_disclosures', 'total_closing_costs', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='closing_disclosure')
  - burden_adjustment: K('burden_high_add') if cd_total_costs > home_value * K('burden_high_pct') / 100 else (K('burden_mid_add') if cd_total_costs > home_value
      * K('burden_mid_pct') / 100 else 0)
  - adjusted_grant: grant_start - score_holdback + price_adjustment + household_adjustment + burden_adjustment
  - income_pct: CFIELD('loan', 'qualifying_income_pct_ami', loan_file_id=F('loan_file_id'))
  - income_adjustment: 0 - K('phase_per_point') * (income_pct - K('phase_start_pct')) if income_pct > K('phase_start_pct') else (K('deep_subsidy_add') if
      income_pct <= K('deep_subsidy_pct') else 0)
  - result: RND(MN(P('credit_cap'), adjusted_grant + income_adjustment), 2)
  compute_basis:
    tract: The starting amount of the grant award follows the census tract income level of the property
    grant_start: a property in a moderate-income tract starts at 4,900.00; a property in a middle-income or upper-income tract, where the grant is qualified
      on income alone, starts at 4,750.00; a property in a low-income tract starts at the fixed_credit_amount.
    score: a representative credit score below 640 holds back 500.00
    score_holdback: 'A credit-score holdback applies: a representative credit score below 640 holds back 500.00, a representative credit score from 640
      through 679 holds back 250.00, and a representative credit score of 680 or more holds back nothing.'
    home_value: a property value above 225,000.00 adds 250.00
    price_adjustment: 'A purchase-price adjustment applies: a property value above 225,000.00 adds 250.00, a property value of 150,000.00 or less subtracts
      250.00, and any other property value adds nothing.'
    borrowers: a loan file with one borrower adds 200.00
    household_adjustment: 'A household-income adjustment applies: a loan file with one borrower adds 200.00, a loan file with three or more borrowers subtracts
      200.00, and a loan file with two borrowers adds nothing.'
    cd_total_costs: read from the total closing costs on the latest Closing Disclosure issued on the loan file
    burden_adjustment: total closing costs above 4 percent of the property value add 250.00, total closing costs above 3 percent and at most 4 percent of
      the property value add 125.00, and lower total closing costs add nothing.
    adjusted_grant: first the credit-score holdback is subtracted from the starting amount; then the purchase-price, household-income and closing-cost burden
      adjustments are each added with their sign
    income_pct: An income adjustment applies, worked out differently by the qualifying income on the loan file
    income_adjustment: qualifying income above 80 percent of area median income phases the grant down, the income adjustment being minus 25.00 for each
      whole percentage point of area median income above 80; qualifying income at or below 50 percent of area median income earns a flat deep-subsidy supplement
      of plus 300.00; qualifying income above 50 percent and at most 80 percent of area median income takes no income adjustment.
    result: then the income adjustment is added with its sign; the result is lowered to the program's credit_cap when above it and rounded to the cent.
  factors:
  - id: nag_tract_start
    effect: parameter
    decides: grant_start
    bindings:
    - tract
    - grant_start
    ladder:
    - when: property in a moderate-income census tract
      value: K('start_moderate') = 4,900.00
    - when: property in a middle-income or upper-income tract (grant qualified on income alone)
      value: K('start_income_only') = 4,750.00
    - when: otherwise (low-income tract)
      value: P('fixed_credit_amount')
    baseline:
      grant_start: P('fixed_credit_amount')
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: nag_score_holdback
    effect: parameter
    decides: score_holdback
    bindings:
    - score
    - score_holdback
    ladder:
    - when: representative credit score below 640
      value: K('holdback_below_640') = 500.00
    - when: representative credit score from 640 through 679
      value: K('holdback_640_679') = 250.00
    - when: otherwise (680 or more)
      value: '0'
    baseline:
      score_holdback: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: nag_price_adjustment
    effect: parameter
    decides: price_adjustment
    bindings:
    - home_value
    - price_adjustment
    ladder:
    - when: property value above 225,000.00
      value: +K('price_upper_add') = +250.00
    - when: property value of 150,000.00 or less
      value: -K('price_lower_cut') = -250.00
    - when: otherwise
      value: '0'
    baseline:
      price_adjustment: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: nag_household_adjustment
    effect: parameter
    decides: household_adjustment
    bindings:
    - borrowers
    - household_adjustment
    ladder:
    - when: one borrower on the loan file
      value: +K('single_income_add') = +200.00
    - when: three or more borrowers on the loan file
      value: -K('multi_income_cut') = -200.00
    - when: otherwise (two borrowers)
      value: '0'
    baseline:
      household_adjustment: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: nag_cost_burden_adjustment
    effect: parameter
    decides: burden_adjustment
    bindings:
    - cd_total_costs
    - burden_adjustment
    ladder:
    - when: total closing costs on the latest Closing Disclosure above 4 percent of property value
      value: +K('burden_high_add') = +250.00
    - when: total closing costs above 3 percent and at most 4 percent of property value
      value: +K('burden_mid_add') = +125.00
    - when: otherwise
      value: '0'
    baseline:
      burden_adjustment: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: nag_income_shaping
    effect: method
    decides: income_adjustment
    bindings:
    - income_pct
    - income_adjustment
    ladder:
    - when: qualifying income above 80 percent of area median income
      method: 'linear phase-down: minus 25.00 times the whole percentage points of area median income above 80'
    - when: qualifying income at or below 50 percent of area median income
      method: 'flat deep-subsidy supplement: plus 300.00, independent of the income level'
    - when: otherwise (above 50 and at most 80 percent)
      method: no income adjustment
    baseline:
      income_adjustment: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  baseline:
    rule: The grant award at certification is the program's fixed_credit_amount, lowered to the program's credit_cap when above it.
    params:
    - fixed_credit_amount
    - credit_cap
  inputs:
    history:
    - category: loan
      table: loan_disclosures
      aggregate: latest
      field: total_closing_costs
      filters:
        disclosure_form: closing_disclosure
    cross_category:
    - loan
- id: credit_ext_grant_closing_cost_entry
  base_policy_refs:
  - credit_agg_stacking
  - credit_application_at_closing
  overwrite:
  - base_policy: credit_application_at_closing
    superseded_clause: At consummation each verified credit on the file is applied on the final Closing Disclosure in the order and up to the limits of
      the stacking policy, against nonrecurring_closing_costs, prepaid_items_total and discount_points_amount on that disclosure, against the buydown subsidy
      of a buydown on the file, and against the down payment (property value less base loan amount) where allowed.
    replaced_by: On the day of the scheduled closing, while the loan file is clear to close and its Closing Disclosure has been issued, each verified credit
      on the file is applied on that Closing Disclosure in the order and up to the limits of the stacking policy, against its nonrecurring closing costs,
      its discount points, the buydown subsidy of a buydown on the file and, where allowed, its down payment, the application entries being booked that
      day ahead of the signing; prepaid items are paid by credits only on the disbursement date, out of whatever balance remains, because prepaid interest
      and the initial escrow deposit are final only when the loan funds.
  - base_policy: credit_agg_stacking
    superseded_clause: each filling its applicable_cost_categories in the listed order up to the cost still unpaid in that category
    replaced_by: For the nonrecurring closing costs and the down payment of a Neighborhood Access Grant, and only for those two, the entries are sized by
      the Neighborhood Access Grant closing-cost and down payment rules; every other credit, and every other cost category of a Neighborhood Access Grant,
      still fills its applicable_cost_categories in the listed order up to the cost still unpaid in that category.
  trigger: state_due
  subject:
  - credit_applied_at_closing
  computes: entry_amount
  target_tool: post_closing_cost_credit_e81a44da
  params:
    short_lock_share: 1.0
    mid_lock_share: 0.5
    travel_closing_share: 1.0
    remote_closing_share: 0.5
    moderate_tract_share: 0.9
    income_only_share: 0.8
  rule: 'On the day of the scheduled closing, while the loan file is clear to close and its Closing Disclosure has been issued, each verified credit on
    the file is applied on that Closing Disclosure in the order and up to the limits of the stacking policy, against its nonrecurring closing costs, its
    discount points, the buydown subsidy of a buydown on the file and, where allowed, its down payment, the application entries being booked that day ahead
    of the signing; prepaid items are paid by credits only on the disbursement date, out of whatever balance remains, because prepaid interest and the initial
    escrow deposit are final only when the loan funds. For a Neighborhood Access Grant the closing-cost entry is one application entry naming that Closing
    Disclosure and the award entry it draws on. For the nonrecurring closing costs and the down payment of a Neighborhood Access Grant, and only for those
    two, the entries are sized by the Neighborhood Access Grant closing-cost and down payment rules; every other credit, and every other cost category of
    a Neighborhood Access Grant, still fills its applicable_cost_categories in the listed order up to the cost still unpaid in that category. A Neighborhood
    Access Grant''s closing-cost entry is booked only after the grant stands verified with an award entry on its ledger. The grant''s available balance
    is its award and payout entries less the application and reduction entries already on its ledger. The unpaid closing costs are the payable closing costs
    on the latest Closing Disclosure less the seller and agent concessions recorded on the loan file, less the charges the borrower paid before closing
    (the appraisal charges collected on the file''s appraisal order and the up-front application and credit report fees paid on the loan file), and less
    the closing-cost entries the grant has already booked, never below zero, rounded to the cent. The closing-cost entry is the lesser of the grant''s available
    balance and the unpaid closing costs. The payable closing costs on the Closing Disclosure are its nonrecurring closing costs. Larkspur refines this
    standard as follows. Where they apply, the rate-lock exclusion and the closing-service exclusion are subtracted together with the other deductions,
    before the floor at zero; the unpaid closing costs so found are then multiplied by the grant''s closing-cost share and rounded to the cent, and the
    closing-cost entry is the lesser of the grant''s available balance and that share of the unpaid closing costs. Larkspur sets the payable charges, the
    two exclusions and the share as follows. Which charges are payable depends on the loan program and pricing: on an FHA or VA file the payable closing
    costs are the zero-tolerance total plus the 10 percent tolerance total on the Closing Disclosure; on any other file flagged as a higher-priced mortgage
    loan they are the zero-tolerance total alone; on any other file they are the nonrecurring closing costs. The rate-lock exclusion follows the term of
    the rate lock product on the file, because a borrower who chose a short lock bears the cost of extending or repricing it: under a 15-Day, 30-Day or
    45-Day Rate Lock the whole of the borrower-borne extension, relock and float-down costs booked on that lock, less any of those costs Larkspur later
    waived, is excluded; under a 60-Day or 90-Day Rate Lock half of that amount, rounded to the cent, is excluded; under a 120-Day Extended or 180-Day New
    Construction Rate Lock nothing is excluded. The closing-service exclusion follows the closing method of the file''s closing, because a travelling or
    remote signing is a convenience the borrower chose: on a Mobile Notary Closing or Mail-Away Closing the whole of the closing-service fees charged on
    that closing (its closing-method, after-hours signing and courier fees), less any of them reversed, is excluded; on a Hybrid eClosing or Remote Online
    Notarization Closing half of those fees, rounded to the cent, is excluded; on any other closing method nothing is excluded. The closing-cost share follows
    the census tract income level of the property: a moderate-income tract takes 90 percent of the unpaid closing costs; a middle-income or upper-income
    tract, where the grant is qualified on income alone, takes 80 percent; a low-income tract takes the whole of them.'
  prerequisite:
  - problem: credit_ext_neighborhood_grant_award
    kind: value_input
    gate: credit_balance_left
    form: state
    policy_source: A Neighborhood Access Grant's closing-cost entry is booked only after the grant stands verified with an award entry on its ledger.
    condition: The grant's status is verified and its ledger carries a credit_award_booked entry, so its available balance equals the award amount.
    resolved_by: certify_grant_occupancy_149507f1
    effect: Once the grant is verified with its award entry, the available balance that limits the closing-cost entry rises from zero to the award amount.
  cross_category:
  - category: loan
    as: branch
    reads:
    - variant_name
    - hpml_flag
    - census_tract_income_level
    - seller_concession_amount
    - agent_concession_amount
    - prepaid_fee_balance
    - loan_disclosures.nonrecurring_closing_costs
    - loan_disclosures.zero_tolerance_total
    - loan_disclosures.ten_percent_tolerance_total
    note: The payable-charge scope, the share and the concessions read the loan file and its latest Closing Disclosure.
  - category: lock
    as: history
    reads:
    - variant_name
    - lock_id
    - lock_pricing_events.cost_amount
    note: The rate-lock exclusion is decided by the lock product's term and sums the borrower-borne extension, relock and float-down entries on that lock,
      net of waivers.
  - category: funding
    as: history
    reads:
    - variant_name
    - closing_id
    - funding_fee_ledger.amount
    note: The closing-service exclusion is decided by the closing method and sums the closing-method, after-hours signing and courier fees charged on that
      closing, net of reversals.
  - category: appraisal
    as: branch
    reads:
    - fee_balance
    note: The charges paid before closing read the appraisal charges collected on the file's appraisal order.
  compute:
  - award_total: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_award_booked')
  - payout_total: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_guarantee_payout_booked')
  - applied_total: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_applied_at_closing')
  - reduced_total: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_reduced')
  - credit_balance_left: RND(award_total + payout_total - applied_total - reduced_total, 2)
  - program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - hpml: CFIELD('loan', 'hpml_flag', loan_file_id=F('loan_file_id'))
  - cd_nonrecurring: XLATEST('loan', 'loan_disclosures', 'nonrecurring_closing_costs', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='closing_disclosure')
  - cd_zero_tolerance: XLATEST('loan', 'loan_disclosures', 'zero_tolerance_total', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='closing_disclosure')
  - cd_ten_percent: XLATEST('loan', 'loan_disclosures', 'ten_percent_tolerance_total', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='closing_disclosure')
  - payable_costs: cd_zero_tolerance + cd_ten_percent if (program == 'Larkspur FHA 30-Year Fixed' or program == 'Larkspur VA 30-Year Fixed') else (cd_zero_tolerance
      if hpml == True else cd_nonrecurring)
  - concessions: CFIELD('loan', 'seller_concession_amount', loan_file_id=F('loan_file_id')) + CFIELD('loan', 'agent_concession_amount', loan_file_id=F('loan_file_id'))
  - paid_before_closing: (CFIELD('appraisal', 'fee_balance', loan_file_id=F('loan_file_id')) or 0) + (CFIELD('loan', 'prepaid_fee_balance', loan_file_id=F('loan_file_id'))
      or 0)
  - lock_product: CFIELD('lock', 'variant_name', loan_file_id=F('loan_file_id'))
  - lock_pricing_costs: XSUM('lock', 'lock_pricing_events', 'cost_amount', lock_id=CFIELD('lock', 'lock_id', loan_file_id=F('loan_file_id')), event_type='lock_extension_booked',
      cost_bearer='borrower') + XSUM('lock', 'lock_pricing_events', 'cost_amount', lock_id=CFIELD('lock', 'lock_id', loan_file_id=F('loan_file_id')), event_type='lock_relock_fee_booked',
      cost_bearer='borrower') + XSUM('lock', 'lock_pricing_events', 'cost_amount', lock_id=CFIELD('lock', 'lock_id', loan_file_id=F('loan_file_id')), event_type='lock_float_down_fee_booked',
      cost_bearer='borrower') - XSUM('lock', 'lock_pricing_events', 'cost_amount', lock_id=CFIELD('lock', 'lock_id', loan_file_id=F('loan_file_id')), event_type='lock_cost_waived')
  - lock_exclusion: RND(lock_pricing_costs * K('short_lock_share'), 2) if (lock_product == 'Larkspur 15-Day Rate Lock' or lock_product == 'Larkspur 30-Day
      Rate Lock' or lock_product == 'Larkspur 45-Day Rate Lock') else (RND(lock_pricing_costs * K('mid_lock_share'), 2) if (lock_product == 'Larkspur 60-Day
      Rate Lock' or lock_product == 'Larkspur 90-Day Rate Lock') else 0)
  - closing_method: CFIELD('funding', 'variant_name', loan_file_id=F('loan_file_id'))
  - closing_service_fees: XSUM('funding', 'funding_fee_ledger', 'amount', closing_id=CFIELD('funding', 'closing_id', loan_file_id=F('loan_file_id')), event_type='funding_fee_charged',
      fee_code='closing_method_fee') + XSUM('funding', 'funding_fee_ledger', 'amount', closing_id=CFIELD('funding', 'closing_id', loan_file_id=F('loan_file_id')),
      event_type='funding_fee_charged', fee_code='after_hours_signing_fee') + XSUM('funding', 'funding_fee_ledger', 'amount', closing_id=CFIELD('funding',
      'closing_id', loan_file_id=F('loan_file_id')), event_type='funding_fee_charged', fee_code='courier_fee') - XSUM('funding', 'funding_fee_ledger', 'amount',
      closing_id=CFIELD('funding', 'closing_id', loan_file_id=F('loan_file_id')), event_type='funding_fee_reversed', fee_code='closing_method_fee') - XSUM('funding',
      'funding_fee_ledger', 'amount', closing_id=CFIELD('funding', 'closing_id', loan_file_id=F('loan_file_id')), event_type='funding_fee_reversed', fee_code='after_hours_signing_fee')
      - XSUM('funding', 'funding_fee_ledger', 'amount', closing_id=CFIELD('funding', 'closing_id', loan_file_id=F('loan_file_id')), event_type='funding_fee_reversed',
      fee_code='courier_fee')
  - closing_exclusion: RND(closing_service_fees * K('travel_closing_share'), 2) if (closing_method == 'Larkspur Mobile Notary Closing' or closing_method
      == 'Larkspur Mail-Away Closing') else (RND(closing_service_fees * K('remote_closing_share'), 2) if (closing_method == 'Larkspur Hybrid eClosing' or
      closing_method == 'Larkspur Remote Online Notarization Closing') else 0)
  - cc_booked: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_applied_at_closing', cost_category='nonrecurring_closing_costs')
  - cc_unpaid: RND(MX(0, payable_costs - concessions - paid_before_closing - cc_booked - lock_exclusion - closing_exclusion), 2)
  - tract: CFIELD('loan', 'census_tract_income_level', loan_file_id=F('loan_file_id'))
  - grant_cost_share: K('moderate_tract_share') if tract == 'moderate' else (K('income_only_share') if (tract == 'middle' or tract == 'upper') else 1)
  - grant_unpaid_share: RND(cc_unpaid * grant_cost_share, 2)
  - result: RND(MX(0, MN(credit_balance_left, grant_unpaid_share)), 2)
  compute_basis:
    award_total: The grant's available balance is its award and payout entries less the application and reduction entries already on its ledger.
    payout_total: The grant's available balance is its award and payout entries less the application and reduction entries already on its ledger.
    applied_total: The grant's available balance is its award and payout entries less the application and reduction entries already on its ledger.
    reduced_total: The grant's available balance is its award and payout entries less the application and reduction entries already on its ledger.
    credit_balance_left: The grant's available balance is its award and payout entries less the application and reduction entries already on its ledger.
    program: Which charges are payable depends on the loan program and pricing
    hpml: on any other file flagged as a higher-priced mortgage loan they are the zero-tolerance total alone
    cd_nonrecurring: The payable closing costs on the Closing Disclosure are its nonrecurring closing costs
    cd_zero_tolerance: the payable closing costs are the zero-tolerance total plus the 10 percent tolerance total on the Closing Disclosure
    cd_ten_percent: the payable closing costs are the zero-tolerance total plus the 10 percent tolerance total on the Closing Disclosure
    payable_costs: on an FHA or VA file the payable closing costs are the zero-tolerance total plus the 10 percent tolerance total on the Closing Disclosure;
      on any other file flagged as a higher-priced mortgage loan they are the zero-tolerance total alone; on any other file they are the nonrecurring closing
      costs.
    concessions: less the seller and agent concessions recorded on the loan file
    paid_before_closing: less the charges the borrower paid before closing (the appraisal charges collected on the file's appraisal order and the up-front
      application and credit report fees paid on the loan file)
    lock_product: The rate-lock exclusion follows the term of the rate lock product on the file
    lock_pricing_costs: the whole of the borrower-borne extension, relock and float-down costs booked on that lock, less any of those costs Larkspur later
      waived, is excluded
    lock_exclusion: under a 15-Day, 30-Day or 45-Day Rate Lock the whole of the borrower-borne extension, relock and float-down costs booked on that lock,
      less any of those costs Larkspur later waived, is excluded; under a 60-Day or 90-Day Rate Lock half of that amount, rounded to the cent, is excluded;
      under a 120-Day Extended or 180-Day New Construction Rate Lock nothing is excluded.
    closing_method: The closing-service exclusion follows the closing method of the file's closing
    closing_service_fees: the whole of the closing-service fees charged on that closing (its closing-method, after-hours signing and courier fees), less
      any of them reversed, is excluded
    closing_exclusion: on a Mobile Notary Closing or Mail-Away Closing the whole of the closing-service fees charged on that closing (its closing-method,
      after-hours signing and courier fees), less any of them reversed, is excluded; on a Hybrid eClosing or Remote Online Notarization Closing half of
      those fees, rounded to the cent, is excluded; on any other closing method nothing is excluded.
    cc_booked: and less the closing-cost entries the grant has already booked, never below zero, rounded to the cent
    cc_unpaid: Where they apply, the rate-lock exclusion and the closing-service exclusion are subtracted together with the other deductions, before the
      floor at zero
    tract: The closing-cost share follows the census tract income level of the property
    grant_cost_share: a moderate-income tract takes 90 percent of the unpaid closing costs; a middle-income or upper-income tract, where the grant is qualified
      on income alone, takes 80 percent; a low-income tract takes the whole of them.
    grant_unpaid_share: the unpaid closing costs so found are then multiplied by the grant's closing-cost share and rounded to the cent
    result: the closing-cost entry is the lesser of the grant's available balance and that share of the unpaid closing costs.
  factors:
  - id: cc_payable_scope
    effect: method
    decides: payable_costs
    bindings:
    - program
    - hpml
    - cd_nonrecurring
    - cd_zero_tolerance
    - cd_ten_percent
    - payable_costs
    ladder:
    - when: FHA or VA file
      method: payable closing costs = zero-tolerance total plus 10 percent tolerance total on the Closing Disclosure
    - when: any other file flagged as a higher-priced mortgage loan
      method: payable closing costs = zero-tolerance total alone
    - when: otherwise
      method: payable closing costs = the nonrecurring closing costs on the Closing Disclosure
    baseline:
      payable_costs: cd_nonrecurring
    evidence:
    - cross_category
    - history
    cross_difficulty: loan
  - id: cc_short_lock_exclusion
    effect: parameter
    decides: lock_exclusion
    bindings:
    - lock_product
    - lock_pricing_costs
    - lock_exclusion
    ladder:
    - when: 15-Day, 30-Day or 45-Day Rate Lock on the file
      value: K('short_lock_share') = the whole of the borrower-borne extension, relock and float-down costs
    - when: 60-Day or 90-Day Rate Lock on the file
      value: K('mid_lock_share') = half of those costs
    - when: otherwise (120-Day Extended or 180-Day New Construction Rate Lock)
      value: '0'
    baseline:
      lock_exclusion: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: lock
  - id: cc_signing_convenience_exclusion
    effect: parameter
    decides: closing_exclusion
    bindings:
    - closing_method
    - closing_service_fees
    - closing_exclusion
    ladder:
    - when: Mobile Notary Closing or Mail-Away Closing
      value: K('travel_closing_share') = the whole of the closing-method, after-hours signing and courier fees charged, less reversals
    - when: Hybrid eClosing or Remote Online Notarization Closing
      value: K('remote_closing_share') = half of those fees
    - when: otherwise
      value: '0'
    baseline:
      closing_exclusion: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: funding
  - id: cc_tract_cost_share
    effect: parameter
    decides: grant_cost_share
    bindings:
    - tract
    - grant_cost_share
    ladder:
    - when: moderate-income census tract
      value: K('moderate_tract_share') = 90 percent
    - when: middle-income or upper-income tract (grant qualified on income alone)
      value: K('income_only_share') = 80 percent
    - when: otherwise (low-income tract)
      value: the whole of the unpaid closing costs
    baseline:
      grant_cost_share: '1'
    evidence:
    - cross_category
    cross_difficulty: loan
  baseline:
    rule: The grant's available balance is its award and payout entries less the application and reduction entries already on its ledger. The unpaid closing
      costs are the payable closing costs on the latest Closing Disclosure less the seller and agent concessions recorded on the loan file, less the charges
      the borrower paid before closing (the appraisal charges collected on the file's appraisal order and the up-front application and credit report fees
      paid on the loan file), and less the closing-cost entries the grant has already booked, never below zero, rounded to the cent. The closing-cost entry
      is the lesser of the grant's available balance and the unpaid closing costs. The payable closing costs on the Closing Disclosure are its nonrecurring
      closing costs.
    params: []
  inputs:
