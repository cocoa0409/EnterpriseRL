- id: credit_ext_grant_down_payment_entry
  base_policy_refs:
  - credit_agg_stacking
  - credit_application_at_closing
  overwrite:
  - base_policy: credit_agg_stacking
    superseded_clause: each filling its applicable_cost_categories in the listed order up to the cost still unpaid in that category
    replaced_by: Only the down payment and the nonrecurring closing costs of a Neighborhood Access Grant are sized by that grant's down payment and closing-cost
      rules; every credit other than a Neighborhood Access Grant, and every other cost category of such a grant, still fills its applicable_cost_categories
      in the listed order up to the cost still unpaid in that category.
  trigger: state_due
  subject:
  - credit_applied_at_closing
  computes: entry_amount
  target_tool: post_down_payment_credit_64b83335
  params:
    income_low_pct: 50
    income_upper_pct: 80
    floor_lower_income: 500.0
    floor_upper_income: 2000.0
    repair_reserve_gov: 500.0
    repair_reserve_conv: 300.0
    ltv_high: 95.0
    ltv_mid: 90.0
    share_high_ltv: 0.75
    share_mid_ltv: 0.9
  rule: 'On the day of the scheduled closing, while the loan file is clear to close and its Closing Disclosure has been issued, a verified Neighborhood
    Access Grant pays the down payment on that Closing Disclosure, and one application entry is booked for the down payment, naming that Closing Disclosure
    and the award entry it draws on. Only the down payment and the nonrecurring closing costs of a Neighborhood Access Grant are sized by that grant''s
    down payment and closing-cost rules; every credit other than a Neighborhood Access Grant, and every other cost category of such a grant, still fills
    its applicable_cost_categories in the listed order up to the cost still unpaid in that category. The down payment entry of a Neighborhood Access Grant
    is not fixed until its ledger carries the closing-cost entry for the Closing Disclosure the loan closes on. The grant''s available balance is its award
    entries less the application and reduction entries already on its ledger. The down payment is the property value less the base loan amount on the loan
    file. The borrower keeps an own-funds reserve in the down payment: the down payment room is the down payment less the reserve, never below zero, rounded
    down to the whole dollar. The standard own-funds reserve is the program''s min_borrower_contribution. The down payment entry is the lesser of the grant''s
    available balance and the down payment room, less any down payment entries the grant has already booked, never below zero, rounded to the cent. Larkspur
    refines this standard as follows. The reserve is the own-funds floor plus a repair reserve. The own-funds floor follows the qualifying income on the
    loan file: qualifying income at or below 50 percent of area median income sets the floor at 500.00, qualifying income above 80 percent of area median
    income sets the floor at 2,000.00, and qualifying income above 50 and at most 80 percent of area median income keeps the floor at the min_borrower_contribution.
    An appraisal made subject to completion or repairs adds a repair reserve the borrower funds: on an FHA or VA file whose appraisal is subject to completion
    or repairs it adds 500.00, on any other file whose appraisal is subject to completion or repairs it adds 300.00, and an appraisal made as is adds nothing.
    The part of the reserve kept in the down payment is worked out by loan program, each in its own way: on an FHA or VA file, the closing costs the borrower
    still pays at closing count toward the reserve first, these being the nonrecurring closing costs on the latest Closing Disclosure less the seller and
    agent concessions recorded on the loan file and less the grant''s closing-cost entries, never below zero, and only the rest of the reserve, never below
    zero, is kept in the down payment; on a HomeReady file, the charges the borrower paid before closing (the appraisal charges collected on the file''s
    appraisal order and the up-front application and credit report fees paid on the loan file) count toward the reserve first, and only the rest of the
    reserve, never below zero, is kept in the down payment; on any other program the whole reserve is kept in the down payment. The down payment room is
    then worked out in this order: first the part of the reserve kept in the down payment is taken from the down payment, never below zero; then that amount
    is multiplied by the share for the file''s base-loan-to-value, which is 75 percent above 95 percent, 90 percent above 90 and at most 95 percent, and
    the whole amount at 90 percent or below; the product is rounded down to the whole dollar.'
  prerequisite:
  - problem: credit_ext_grant_closing_cost_entry
    kind: value_input
    gate: borrower_cost_share
    form: state
    policy_source: The down payment entry of a Neighborhood Access Grant is not fixed until its ledger carries the closing-cost entry for the Closing Disclosure
      the loan closes on.
    condition: The grant's ledger carries a credit_applied_at_closing entry with cost_category nonrecurring_closing_costs naming the latest Closing Disclosure
      of the loan file.
    resolved_by: post_closing_cost_credit_e81a44da
    effect: Once the closing-cost entry is booked, the closing costs the borrower still pays and the grant's available balance both fall by that entry,
      which on an FHA or VA file changes the part of the reserve kept in the down payment.
  cross_category:
  - category: loan
    as: branch
    reads:
    - property_value
    - base_loan_amount
    - qualifying_income_pct_ami
    - variant_name
    - seller_concession_amount
    - agent_concession_amount
    - prepaid_fee_balance
    - loan_disclosures.nonrecurring_closing_costs
    note: The down payment, the own-funds floor, the program-specific reserve rule and the loan-to-value share read the loan file and its latest Closing
      Disclosure.
  - category: appraisal
    as: branch
    reads:
    - subject_to_completion
    - fee_balance
    note: The repair reserve tier is read from whether the appraisal order on the file was made subject to completion or repairs.
  compute:
  - award_total: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_award_booked')
  - applied_total: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_applied_at_closing')
  - reduced_total: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_reduced')
  - grant_balance: RND(award_total - applied_total - reduced_total, 2)
  - home_value: CFIELD('loan', 'property_value', loan_file_id=F('loan_file_id'))
  - base_loan: CFIELD('loan', 'base_loan_amount', loan_file_id=F('loan_file_id'))
  - down_payment: RND(home_value - base_loan, 2)
  - income_pct: CFIELD('loan', 'qualifying_income_pct_ami', loan_file_id=F('loan_file_id'))
  - own_funds_floor: K('floor_lower_income') if income_pct <= K('income_low_pct') else (K('floor_upper_income') if income_pct > K('income_upper_pct') else
      P('min_borrower_contribution'))
  - program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - subject_to_repairs: CFIELD('appraisal', 'subject_to_completion', loan_file_id=F('loan_file_id'))
  - repair_reserve: K('repair_reserve_gov') if (subject_to_repairs == True and (program == 'Larkspur FHA 30-Year Fixed' or program == 'Larkspur VA 30-Year
      Fixed')) else (K('repair_reserve_conv') if (subject_to_repairs == True and program != 'Larkspur FHA 30-Year Fixed' and program != 'Larkspur VA 30-Year
      Fixed') else 0)
  - reserve_total: own_funds_floor + repair_reserve
  - cd_nonrecurring: XLATEST('loan', 'loan_disclosures', 'nonrecurring_closing_costs', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='closing_disclosure')
  - concessions: CFIELD('loan', 'seller_concession_amount', loan_file_id=F('loan_file_id')) + CFIELD('loan', 'agent_concession_amount', loan_file_id=F('loan_file_id'))
  - cc_entries: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_applied_at_closing', cost_category='nonrecurring_closing_costs')
  - borrower_cost_share: RND(MX(0, cd_nonrecurring - concessions - cc_entries), 2)
  - paid_before_closing: (CFIELD('appraisal', 'fee_balance', loan_file_id=F('loan_file_id')) or 0) + (CFIELD('loan', 'prepaid_fee_balance', loan_file_id=F('loan_file_id'))
      or 0)
  - offset_program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - reserve_in_down_payment: RND(MX(0, reserve_total - borrower_cost_share), 2) if (offset_program == 'Larkspur FHA 30-Year Fixed' or offset_program ==
      'Larkspur VA 30-Year Fixed') else (RND(MX(0, reserve_total - paid_before_closing), 2) if offset_program == 'Larkspur HomeReady 30-Year Fixed' else
      reserve_total)
  - room_before_share: RND(MX(0, down_payment - reserve_in_down_payment), 2)
  - ltv: CFIELD('loan', 'base_loan_amount', loan_file_id=F('loan_file_id')) / CFIELD('loan', 'property_value', loan_file_id=F('loan_file_id')) * 100
  - ltv_share: K('share_high_ltv') if ltv > K('ltv_high') else (K('share_mid_ltv') if ltv > K('ltv_mid') else 1)
  - dp_room: int(room_before_share * ltv_share + 0.000001)
  - dp_booked: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_applied_at_closing', cost_category='down_payment')
  - result: RND(MX(0, MN(grant_balance, dp_room) - dp_booked), 2)
  compute_basis:
    award_total: The grant's available balance is its award entries less the application and reduction entries already on its ledger.
    applied_total: The grant's available balance is its award entries less the application and reduction entries already on its ledger.
    reduced_total: The grant's available balance is its award entries less the application and reduction entries already on its ledger.
    grant_balance: The grant's available balance is its award entries less the application and reduction entries already on its ledger.
    home_value: The down payment is the property value less the base loan amount on the loan file.
    base_loan: The down payment is the property value less the base loan amount on the loan file.
    down_payment: The down payment is the property value less the base loan amount on the loan file.
    income_pct: The own-funds floor follows the qualifying income on the loan file
    own_funds_floor: qualifying income at or below 50 percent of area median income sets the floor at 500.00, qualifying income above 80 percent of area
      median income sets the floor at 2,000.00, and qualifying income above 50 and at most 80 percent of area median income keeps the floor at the min_borrower_contribution.
    program: on an FHA or VA file whose appraisal is subject to completion or repairs it adds 500.00
    subject_to_repairs: An appraisal made subject to completion or repairs adds a repair reserve the borrower funds
    repair_reserve: on an FHA or VA file whose appraisal is subject to completion or repairs it adds 500.00, on any other file whose appraisal is subject
      to completion or repairs it adds 300.00, and an appraisal made as is adds nothing.
    reserve_total: The reserve is the own-funds floor plus a repair reserve.
    cd_nonrecurring: these being the nonrecurring closing costs on the latest Closing Disclosure less the seller and agent concessions recorded on the loan
      file and less the grant's closing-cost entries, never below zero
    concessions: less the seller and agent concessions recorded on the loan file
    cc_entries: and less the grant's closing-cost entries, never below zero
    borrower_cost_share: the closing costs the borrower still pays at closing count toward the reserve first, these being the nonrecurring closing costs
      on the latest Closing Disclosure less the seller and agent concessions recorded on the loan file and less the grant's closing-cost entries, never
      below zero
    paid_before_closing: the charges the borrower paid before closing (the appraisal charges collected on the file's appraisal order and the up-front application
      and credit report fees paid on the loan file)
    offset_program: The part of the reserve kept in the down payment is worked out by loan program, each in its own way
    reserve_in_down_payment: on an FHA or VA file, the closing costs the borrower still pays at closing count toward the reserve first, these being the
      nonrecurring closing costs on the latest Closing Disclosure less the seller and agent concessions recorded on the loan file and less the grant's closing-cost
      entries, never below zero, and only the rest of the reserve, never below zero, is kept in the down payment; on a HomeReady file, the charges the borrower
      paid before closing (the appraisal charges collected on the file's appraisal order and the up-front application and credit report fees paid on the
      loan file) count toward the reserve first, and only the rest of the reserve, never below zero, is kept in the down payment; on any other program the
      whole reserve is kept in the down payment.
    room_before_share: first the part of the reserve kept in the down payment is taken from the down payment, never below zero
    ltv: the share for the file's base-loan-to-value
    ltv_share: which is 75 percent above 95 percent, 90 percent above 90 and at most 95 percent, and the whole amount at 90 percent or below
    dp_room: then that amount is multiplied by the share for the file's base-loan-to-value, which is 75 percent above 95 percent, 90 percent above 90 and
      at most 95 percent, and the whole amount at 90 percent or below; the product is rounded down to the whole dollar.
    dp_booked: less any down payment entries the grant has already booked
    result: The down payment entry is the lesser of the grant's available balance and the down payment room, less any down payment entries the grant has
      already booked, never below zero, rounded to the cent.
  factors:
  - id: dp_own_funds_floor
    effect: parameter
    decides: own_funds_floor
    bindings:
    - income_pct
    - own_funds_floor
    ladder:
    - when: qualifying income at or below 50 percent of area median income
      value: K('floor_lower_income') = 500.00
    - when: qualifying income above 80 percent of area median income
      value: K('floor_upper_income') = 2,000.00
    - when: otherwise (above 50 and at most 80 percent)
      value: P('min_borrower_contribution')
    baseline:
      own_funds_floor: P('min_borrower_contribution')
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: dp_repair_reserve
    effect: parameter
    decides: repair_reserve
    bindings:
    - program
    - subject_to_repairs
    - repair_reserve
    ladder:
    - when: appraisal subject to completion or repairs and the file is FHA or VA
      value: K('repair_reserve_gov') = 500.00
    - when: appraisal subject to completion or repairs and the file is any other program
      value: K('repair_reserve_conv') = 300.00
    - when: otherwise (appraisal made as is)
      value: '0'
    baseline:
      repair_reserve: '0'
    evidence:
    - cross_category
    cross_difficulty: appraisal
  - id: dp_reserve_offset_rule
    effect: method
    decides: reserve_in_down_payment
    bindings:
    - offset_program
    - reserve_in_down_payment
    ladder:
    - when: FHA or VA file
      method: kept in the down payment = reserve less the closing costs the borrower still pays at closing, never below zero
    - when: HomeReady file
      method: kept in the down payment = reserve less the charges the borrower paid before closing, never below zero
    - when: otherwise
      method: the whole reserve is kept in the down payment
    baseline:
      reserve_in_down_payment: reserve_total
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: dp_ltv_share
    effect: parameter
    decides: ltv_share
    bindings:
    - ltv
    - ltv_share
    ladder:
    - when: base-loan-to-value above 95 percent
      value: K('share_high_ltv') = 75 percent
    - when: base-loan-to-value above 90 and at most 95 percent
      value: K('share_mid_ltv') = 90 percent
    - when: otherwise (90 percent or below)
      value: the whole amount
    baseline:
      ltv_share: '1'
    evidence:
    - cross_category
    cross_difficulty: loan
  baseline:
    rule: 'The grant''s available balance is its award entries less the application and reduction entries already on its ledger. The down payment is the
      property value less the base loan amount on the loan file. The borrower keeps an own-funds reserve in the down payment: the down payment room is the
      down payment less the reserve, never below zero, rounded down to the whole dollar. The standard own-funds reserve is the program''s min_borrower_contribution.
      The down payment entry is the lesser of the grant''s available balance and the down payment room, less any down payment entries the grant has already
      booked, never below zero, rounded to the cent.'
    params:
    - min_borrower_contribution
  inputs:
    history:
    - table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_award_booked
    - table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_applied_at_closing
    - table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_reduced
    - category: loan
      table: loan_disclosures
      aggregate: latest
      field: nonrecurring_closing_costs
      filters:
        disclosure_form: closing_disclosure
    cross_category:
    - loan
    - appraisal
- id: credit_ext_heroes_validity_extension
  base_policy_refs:
  - credit_validity
  overwrite:
  - base_policy: credit_validity
    superseded_clause: An extension adds extension_days calendar days to the current expiration_date and raises extension_count by one
    replaced_by: For a Hometown Heroes Credit backed by a rate lock of 90 days or more, and only for such a credit, the extension is sized to the closing
      as the following rules state and still raises extension_count by one; every other credit's extension adds extension_days calendar days to the current
      expiration_date and raises extension_count by one.
  trigger: on_request
  subject:
  - credit_expiration_extended
  computes: extension_days
  target_tool: extend_credit_validity_45c9966f
  params:
    cushion_remote: 10
    cushion_mobile: 7
    inspection_completion: 10
    inspection_pending: 5
    conditions_two: 8
    conditions_one: 4
    block_long: 15
    block_mid: 10
  rule: 'A Hometown Heroes credit''s validity is extended on request, no later than its current expiration date and while the loan file is in a status that
    allows extensions, and each extension raises the credit''s extension count by one. The standard extension of a Hometown Heroes credit adds the program''s
    extension_days calendar days to its current expiration date. For a Hometown Heroes Credit backed by a rate lock of 90 days or more, and only for such
    a credit, the extension is sized to the closing as the following rules state and still raises extension_count by one; every other credit''s extension
    adds extension_days calendar days to the current expiration_date and raises extension_count by one. The days the Heroes extension must cover are the
    calendar days from the credit''s current expiration date to the target closing date, plus a signing cushion, an appraisal buffer and a conditions buffer,
    never below zero. The target closing date is chosen as follows: where a closing is scheduled with the settlement agent for the loan file, it is that
    scheduled closing date; where no closing is scheduled and the purchase contract closing date is later than the estimated closing date on the loan file,
    it is the purchase contract closing date; otherwise it is the estimated closing date on the loan file. The signing cushion follows the closing method
    of the scheduled closing: a Hybrid eClosing or Remote Online Notarization Closing adds 10 days, a Mobile Notary Closing or Mail-Away Closing adds 7
    days, and any other closing method adds none. The appraisal buffer follows the file''s appraisal order: an appraisal made subject to completion or repairs
    adds 10 days; an appraisal not yet completed (ordered, assigned, on hold or inspected) adds 5 days; any other appraisal order, whether completed or
    delivered as is, under reconsideration or cancelled, adds none. The conditions buffer follows the prior-to-documents conditions still open on the loan
    file (issued and neither cleared nor waived): two or more open conditions add 8 days, one open condition adds 4 days, and none adds nothing. The days
    granted then follow the rate lock on the file: under a Larkspur 180-Day New Construction Rate Lock, the days the Heroes extension must cover are rounded
    up to a whole number of 15-day blocks; under a Larkspur 90-Day Rate Lock or Larkspur 120-Day Extended Rate Lock, they are rounded up to a whole number
    of 10-day blocks; a count that is already a whole number of blocks stands as it is; under any other lock, the extension adds the program''s extension_days.'
  prerequisite: []
  cross_category:
  - category: loan
    as: history
    reads:
    - contract_closing_date
    - estimated_closing_date
    - loan_conditions.event_type
    note: The target closing date tiers and the conditions buffer read the loan file and its condition history.
  - category: funding
    as: branch
    reads:
    - scheduled_closing_date
    - variant_name
    note: The scheduled closing date and the closing method decide the target date and the signing cushion.
  - category: appraisal
    as: branch
    reads:
    - subject_to_completion
    - status
    note: The appraisal buffer reads the appraisal order on the file.
  - category: lock
    as: branch
    reads:
    - variant_name
    note: The rounding block is decided by the rate lock product on the file.
  compute:
  - current_expiration: F('expiration_date')
  - scheduled_close: CFIELD('funding', 'scheduled_closing_date', loan_file_id=F('loan_file_id'))
  - contract_close: CFIELD('loan', 'contract_closing_date', loan_file_id=F('loan_file_id'))
  - estimated_close: CFIELD('loan', 'estimated_closing_date', loan_file_id=F('loan_file_id'))
  - target_close: scheduled_close if (scheduled_close != None and scheduled_close != '') else (contract_close if (contract_close != None and contract_close
      != '' and contract_close > estimated_close) else estimated_close)
  - closing_method: CFIELD('funding', 'variant_name', loan_file_id=F('loan_file_id'))
  - cushion_days: K('cushion_remote') if (closing_method == 'Larkspur Hybrid eClosing' or closing_method == 'Larkspur Remote Online Notarization Closing')
      else (K('cushion_mobile') if (closing_method == 'Larkspur Mobile Notary Closing' or closing_method == 'Larkspur Mail-Away Closing') else 0)
  - appraisal_subject: CFIELD('appraisal', 'subject_to_completion', loan_file_id=F('loan_file_id'))
  - appraisal_status: CFIELD('appraisal', 'status', loan_file_id=F('loan_file_id'))
  - inspection_days: K('inspection_completion') if appraisal_subject == True else (K('inspection_pending') if (appraisal_status == 'ordered' or appraisal_status
      == 'assigned' or appraisal_status == 'on_hold' or appraisal_status == 'inspected') else 0)
  - open_conditions: XCOUNT('loan', 'loan_conditions', event_type='loan_condition_issued', condition_class='prior_to_documents', loan_file_id=F('loan_file_id'))
      - XCOUNT('loan', 'loan_conditions', event_type='loan_condition_cleared', condition_class='prior_to_documents', loan_file_id=F('loan_file_id')) - XCOUNT('loan',
      'loan_conditions', event_type='loan_condition_waived', condition_class='prior_to_documents', loan_file_id=F('loan_file_id'))
  - conditions_days: K('conditions_two') if open_conditions >= 2 else (K('conditions_one') if open_conditions == 1 else 0)
  - days_to_cover: MX(0, DAYS(current_expiration, target_close) + cushion_days + inspection_days + conditions_days)
  - lock_product: CFIELD('lock', 'variant_name', loan_file_id=F('loan_file_id'))
  - extension_granted: (0 - ((0 - days_to_cover) // K('block_long'))) * K('block_long') if lock_product == 'Larkspur 180-Day New Construction Rate Lock'
      else ((0 - ((0 - days_to_cover) // K('block_mid'))) * K('block_mid') if (lock_product == 'Larkspur 90-Day Rate Lock' or lock_product == 'Larkspur
      120-Day Extended Rate Lock') else P('extension_days'))
  - result: int(extension_granted)
  compute_basis:
    current_expiration: the calendar days from the credit's current expiration date to the target closing date
    scheduled_close: where a closing is scheduled with the settlement agent for the loan file, it is that scheduled closing date
    contract_close: where no closing is scheduled and the purchase contract closing date is later than the estimated closing date on the loan file, it is
      the purchase contract closing date
    estimated_close: otherwise it is the estimated closing date on the loan file.
    target_close: 'The target closing date is chosen as follows: where a closing is scheduled with the settlement agent for the loan file, it is that scheduled
      closing date; where no closing is scheduled and the purchase contract closing date is later than the estimated closing date on the loan file, it is
      the purchase contract closing date; otherwise it is the estimated closing date on the loan file.'
    closing_method: The signing cushion follows the closing method of the scheduled closing
    cushion_days: a Hybrid eClosing or Remote Online Notarization Closing adds 10 days, a Mobile Notary Closing or Mail-Away Closing adds 7 days, and any
      other closing method adds none.
    appraisal_subject: an appraisal made subject to completion or repairs adds 10 days
    appraisal_status: an appraisal not yet completed (ordered, assigned, on hold or inspected) adds 5 days
    inspection_days: 'The appraisal buffer follows the file''s appraisal order: an appraisal made subject to completion or repairs adds 10 days; an appraisal
      not yet completed (ordered, assigned, on hold or inspected) adds 5 days; any other appraisal order, whether completed or delivered as is, under reconsideration
      or cancelled, adds none.'
    open_conditions: The conditions buffer follows the prior-to-documents conditions still open on the loan file (issued and neither cleared nor waived)
    conditions_days: two or more open conditions add 8 days, one open condition adds 4 days, and none adds nothing.
    days_to_cover: The days the Heroes extension must cover are the calendar days from the credit's current expiration date to the target closing date,
      plus a signing cushion, an appraisal buffer and a conditions buffer, never below zero.
    lock_product: The days granted then follow the rate lock on the file
    extension_granted: under a Larkspur 180-Day New Construction Rate Lock, the days the Heroes extension must cover are rounded up to a whole number of
      15-day blocks; under a Larkspur 90-Day Rate Lock or Larkspur 120-Day Extended Rate Lock, they are rounded up to a whole number of 10-day blocks; a
      count that is already a whole number of blocks stands as it is; under any other lock, the extension adds the program's extension_days.
    result: The days granted then follow the rate lock on the file
  factors:
  - id: heroes_target_date_choice
    effect: method
    decides: target_close
    bindings:
    - scheduled_close
    - contract_close
    - estimated_close
    - target_close
    ladder:
    - when: a closing is scheduled with the settlement agent for the loan file
      method: target = the scheduled closing date
    - when: no closing is scheduled and the purchase contract closing date is later than the estimated closing date
      method: target = the purchase contract closing date
    - when: otherwise
      method: target = the estimated closing date on the loan file
    baseline:
      target_close: estimated_close
    evidence:
    - cross_category
    - date
    cross_difficulty: funding
  - id: heroes_signing_cushion
    effect: parameter
    decides: cushion_days
    bindings:
    - closing_method
    - cushion_days
    ladder:
    - when: Hybrid eClosing or Remote Online Notarization Closing
      value: K('cushion_remote') = 10 days
    - when: Mobile Notary Closing or Mail-Away Closing
      value: K('cushion_mobile') = 7 days
    - when: otherwise
      value: '0'
    baseline:
      cushion_days: '0'
    evidence:
    - cross_category
    cross_difficulty: funding
  - id: heroes_appraisal_buffer
    effect: parameter
    decides: inspection_days
    bindings:
    - appraisal_subject
    - appraisal_status
    - inspection_days
    ladder:
    - when: appraisal made subject to completion or repairs
      value: K('inspection_completion') = 10 days
    - when: appraisal not yet completed (ordered, assigned, on hold or inspected)
      value: K('inspection_pending') = 5 days
    - when: otherwise (completed as is)
      value: '0'
    baseline:
      inspection_days: '0'
    evidence:
    - cross_category
    cross_difficulty: appraisal
  - id: heroes_conditions_buffer
    effect: parameter
    decides: conditions_days
    bindings:
    - open_conditions
    - conditions_days
    ladder:
    - when: two or more prior-to-documents conditions open
      value: K('conditions_two') = 8 days
    - when: exactly one open
      value: K('conditions_one') = 4 days
    - when: otherwise
      value: '0'
    baseline:
      conditions_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: loan
  - id: heroes_block_rounding
    effect: method
    decides: extension_granted
    bindings:
    - lock_product
    - extension_granted
    ladder:
    - when: Larkspur 180-Day New Construction Rate Lock on the file
      method: round the days to cover up to the next whole block of 15 days
    - when: Larkspur 90-Day Rate Lock or Larkspur 120-Day Extended Rate Lock on the file
      method: round the days to cover up to the next whole block of 10 days
    - when: otherwise
      method: add the program's extension_days
    baseline:
      extension_granted: P('extension_days')
    evidence:
    - cross_category
    cross_difficulty: lock
  baseline:
    rule: The standard extension of a Hometown Heroes credit adds the program's extension_days calendar days to its current expiration date.
    params:
    - extension_days
  inputs:
    history:
    - category: loan
      table: loan_conditions
      aggregate: count
      field: condition_id
      filters:
        condition_class: prior_to_documents
    cross_category:
    - loan
    - funding
    - appraisal
    - lock
- id: credit_ext_heroes_recertified_award
  base_policy_refs:
  - credit_program_eligibility
  - credit_award_amount
  overwrite:
  - base_policy: credit_award_amount
    superseded_clause: A fixed credit awards fixed_credit_amount.
    replaced_by: For a Hometown Heroes Credit, and only for such a credit, the award follows the Hometown Heroes award rule stated here instead of the fixed_credit_amount;
      every other fixed credit except the Neighborhood Access Grant, whose award is sized on the borrower's occupancy certification, still awards its fixed_credit_amount.
  - base_policy: credit_award_amount
    superseded_clause: If the base loan amount changes before closing the award is re-sized the same way, and a decrease is booked as a credit_reduced entry
      for the difference with reduction_reason loan_amount_decreased, and an increase as a further award entry for the difference.
    replaced_by: 'For a Hometown Heroes Credit, and only for such a credit, a change of the base loan amount before closing is handled as follows: while
      the loan program on the file is unchanged, the award is re-sized by the Hometown Heroes award rule, an increase being booked as a further award entry
      for the difference and a decrease as a credit_reduced entry for the difference with reduction_reason loan_amount_decreased; where the loan program
      has changed as well, the award is re-fixed on the borrower''s re-certification, which books an increase as a further award entry and books nothing
      for a re-fixed award that is not above the available balance, so a re-certified Heroes credit is never lowered; every other credit is still re-sized
      the same way when its base loan amount changes before closing, a decrease being booked as a credit_reduced entry for the difference with reduction_reason
      loan_amount_decreased and an increase as a further award entry for the difference.'
  - base_policy: credit_program_eligibility
    superseded_clause: a credit that still passes keeps its award amount except that percentage credits are re-sized under the award policy.
    replaced_by: For a Hometown Heroes Credit, and only for such a credit, a change of the base loan amount alone re-sizes the award under the Hometown
      Heroes award rule and a change of the loan program re-fixes it on the borrower's re-certification; every other credit that still passes keeps its
      award amount except that percentage credits are re-sized under the award policy.
  trigger: on_request
  subject:
  - credit_award_booked
  computes: award_increase
  target_tool: recertify_hero_occupation_0487fd94
  params:
    start_pct_lowmod: 0.2
    start_pct_upper: 0.12
    start_pct_standard: 0.15
    purchase_fthb_add: 100.0
    refi_cut: 150.0
    underwritten_add: 100.0
    verified_add: 50.0
    gov_add: 125.0
    homeready_add: 75.0
    military_add: 125.0
    responder_add: 75.0
    charge_base: 25.0
    charge_per_day: 0.5
    charge_long_days: 45
    heroes_min: 500.0
  rule: 'The Hometown Heroes award is computed by this rule at verification, at each re-size and at re-certification, on the base loan amount then on the
    loan file, which becomes the credit''s basis. The standard Hometown Heroes award is 0.15 percent of the base loan amount, rounded to the cent, never
    below 500.00 and never above the program''s credit_cap. For a Hometown Heroes Credit, and only for such a credit, the award follows the Hometown Heroes
    award rule stated here instead of the fixed_credit_amount; every other fixed credit except the Neighborhood Access Grant, whose award is sized on the
    borrower''s occupancy certification, still awards its fixed_credit_amount. For a Hometown Heroes Credit, and only for such a credit, a change of the
    base loan amount before closing is handled as follows: while the loan program on the file is unchanged, the award is re-sized by the Hometown Heroes
    award rule, an increase being booked as a further award entry for the difference and a decrease as a credit_reduced entry for the difference with reduction_reason
    loan_amount_decreased; where the loan program has changed as well, the award is re-fixed on the borrower''s re-certification, which books an increase
    as a further award entry and books nothing for a re-fixed award that is not above the available balance, so a re-certified Heroes credit is never lowered;
    every other credit is still re-sized the same way when its base loan amount changes before closing, a decrease being booked as a credit_reduced entry
    for the difference with reduction_reason loan_amount_decreased and an increase as a further award entry for the difference. For a Hometown Heroes Credit,
    and only for such a credit, a change of the base loan amount alone re-sizes the award under the Hometown Heroes award rule and a change of the loan
    program re-fixes it on the borrower''s re-certification; every other credit that still passes keeps its award amount except that percentage credits
    are re-sized under the award policy. Where program_change_retest applies and the loan program changed after verification, the Hometown Heroes credit
    is re-tested, and the borrower''s re-certification of the qualifying occupation re-fixes its award. The re-certified Hometown Heroes award is fixed
    only once the credit''s expiration date reaches the signing date scheduled with the settlement agent for the loan. On re-certification the increase
    is the re-fixed award less the credit''s available balance (its award entries less its reduction and application entries), never below zero, rounded
    to the cent, and it is booked as a further award entry; where the re-fixed award is not above the available balance, the re-certification books no entry
    and the balance stands. Larkspur sizes the Heroes award as follows. The starting rate follows the census tract income level of the property: a low-income
    or moderate-income tract takes 0.20 percent of the base loan amount, an upper-income tract takes 0.12 percent, and a middle-income tract takes the standard
    0.15 percent. A purpose adjustment applies: a rate-and-term refinance subtracts 150.00, a purchase by a first-time homebuyer adds 100.00, and any other
    file adds nothing. A pre-approval adjustment applies for the pre-approval the loan file was converted from: an Underwritten or Jumbo Underwritten Pre-Approval
    adds 100.00, a Verified Pre-Approval adds 50.00, and any other or none adds nothing. A program supplement applies: an FHA or VA file adds 125.00, a
    HomeReady file adds 75.00, and any other program adds nothing. An occupation supplement applies for the occupation verified on the credit: an active
    military member or veteran on a VA file adds 125.00, a law enforcement officer, firefighter or emergency medical worker adds 75.00, and any other occupation
    adds nothing. An extension charge applies, worked out differently by the days the credit''s validity has been extended beyond the program''s award_validity_days,
    counted from the reserved date to the current expiration date: more than 45 extended days are charged 25.00 plus 0.50 for each extended day beyond 45;
    1 to 45 extended days are charged a flat 25.00; no extended days carry no charge. The Heroes award is computed in this order: first the starting rate
    is applied to the base loan amount and rounded to the cent; then the purpose, pre-approval, program and occupation amounts are each added with their
    sign; then the extension charge is subtracted; the result is raised to 500.00 when below it and lowered to the program''s credit_cap when above it.'
  prerequisite:
  - problem: credit_ext_heroes_validity_extension
    kind: value_input
    gate: extension_charge
    form: state
    policy_source: The re-certified Hometown Heroes award is fixed only once the credit's expiration date reaches the signing date scheduled with the settlement
      agent for the loan.
    condition: closing_credits.expiration_date is on or after closings.scheduled_closing_date for the loan file; only a validity extension moves the expiration
      date, and the extended days it adds set the extension charge.
    resolved_by: extend_credit_validity_45c9966f
    effect: Once the validity is extended to reach the scheduled signing date, the days extended beyond award_validity_days, counted from the reserved date
      to the new expiration date, set the extension charge subtracted in the re-fixed award.
  cross_category:
  - category: loan
    as: branch
    reads:
    - base_loan_amount
    - census_tract_income_level
    - loan_purpose
    - first_time_homebuyer
    - variant_name
    - preapproval_id
    note: The starting rate, purpose, program and occupation tiers read the loan file.
  - category: preapproval
    as: branch
    reads:
    - variant_name
    note: The pre-approval adjustment reads the level of the pre-approval the loan file was converted from.
  compute:
  - base_loan: CFIELD('loan', 'base_loan_amount', loan_file_id=F('loan_file_id'))
  - tract: CFIELD('loan', 'census_tract_income_level', loan_file_id=F('loan_file_id'))
  - start_rate: K('start_pct_lowmod') if (tract == 'low' or tract == 'moderate') else (K('start_pct_upper') if tract == 'upper' else K('start_pct_standard'))
  - start_amount: RND(base_loan * start_rate / 100, 2)
  - purpose: CFIELD('loan', 'loan_purpose', loan_file_id=F('loan_file_id'))
  - first_time: CFIELD('loan', 'first_time_homebuyer', loan_file_id=F('loan_file_id'))
  - purpose_adjustment: 0 - K('refi_cut') if purpose == 'rate_term_refinance' else (K('purchase_fthb_add') if (purpose == 'purchase' and first_time == True)
      else 0)
  - preapproval_level: CFIELD('preapproval', 'variant_name', preapproval_id=CFIELD('loan', 'preapproval_id', loan_file_id=F('loan_file_id')))
  - preapproval_adjustment: K('underwritten_add') if (preapproval_level == 'Larkspur Underwritten Pre-Approval' or preapproval_level == 'Larkspur Jumbo
      Underwritten Pre-Approval') else (K('verified_add') if preapproval_level == 'Larkspur Verified Pre-Approval' else 0)
  - program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - program_supplement: K('gov_add') if (program == 'Larkspur FHA 30-Year Fixed' or program == 'Larkspur VA 30-Year Fixed') else (K('homeready_add') if
      program == 'Larkspur HomeReady 30-Year Fixed' else 0)
  - occupation: F('heroes_occupation')
  - occupation_program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - occupation_supplement: K('military_add') if (occupation == 'active_military_or_veteran' and occupation_program == 'Larkspur VA 30-Year Fixed') else
      (K('responder_add') if (occupation == 'law_enforcement' or occupation == 'firefighter' or occupation == 'emergency_medical') else 0)
  - days_extended: MX(0, DAYS(F('reserved_date'), F('expiration_date')) - P('award_validity_days'))
  - extension_charge: K('charge_base') + K('charge_per_day') * (days_extended - K('charge_long_days')) if days_extended > K('charge_long_days') else (K('charge_base')
      if days_extended > 0 else 0)
  - heroes_award: MN(P('credit_cap'), MX(K('heroes_min'), RND(start_amount + purpose_adjustment + preapproval_adjustment + program_supplement + occupation_supplement
      - extension_charge, 2)))
  - award_entries: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_award_booked')
  - reduction_entries: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_reduced')
  - application_entries: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_applied_at_closing')
  - heroes_balance: RND(award_entries - reduction_entries - application_entries, 2)
  - result: RND(MX(0, heroes_award - heroes_balance), 2)
  compute_basis:
    base_loan: on the base loan amount then on the loan file, which becomes the credit's basis
    tract: The starting rate follows the census tract income level of the property
    start_rate: a low-income or moderate-income tract takes 0.20 percent of the base loan amount, an upper-income tract takes 0.12 percent, and a middle-income
      tract takes the standard 0.15 percent.
    start_amount: first the starting rate is applied to the base loan amount and rounded to the cent
    purpose: A purpose adjustment applies
    first_time: a purchase by a first-time homebuyer adds 100.00
    purpose_adjustment: a rate-and-term refinance subtracts 150.00, a purchase by a first-time homebuyer adds 100.00, and any other file adds nothing.
    preapproval_level: A pre-approval adjustment applies for the pre-approval the loan file was converted from
    preapproval_adjustment: an Underwritten or Jumbo Underwritten Pre-Approval adds 100.00, a Verified Pre-Approval adds 50.00, and any other or none adds
      nothing.
    program: A program supplement applies
    program_supplement: an FHA or VA file adds 125.00, a HomeReady file adds 75.00, and any other program adds nothing.
    occupation: An occupation supplement applies for the occupation verified on the credit
    occupation_program: an active military member or veteran on a VA file adds 125.00
    occupation_supplement: an active military member or veteran on a VA file adds 125.00, a law enforcement officer, firefighter or emergency medical worker
      adds 75.00, and any other occupation adds nothing.
    days_extended: by the days the credit's validity has been extended beyond the program's award_validity_days, counted from the reserved date to the current
      expiration date
    extension_charge: more than 45 extended days are charged 25.00 plus 0.50 for each extended day beyond 45; 1 to 45 extended days are charged a flat 25.00;
      no extended days carry no charge.
    heroes_award: then the purpose, pre-approval, program and occupation amounts are each added with their sign; then the extension charge is subtracted;
      the result is raised to 500.00 when below it and lowered to the program's credit_cap when above it.
    award_entries: the credit's available balance (its award entries less its reduction and application entries)
    reduction_entries: the credit's available balance (its award entries less its reduction and application entries)
    application_entries: the credit's available balance (its award entries less its reduction and application entries)
    heroes_balance: the credit's available balance (its award entries less its reduction and application entries)
    result: On re-certification the increase is the re-fixed award less the credit's available balance (its award entries less its reduction and application
      entries), never below zero, rounded to the cent, and it is booked as a further award entry
  factors:
  - id: heroes_starting_rate
    effect: parameter
    decides: start_rate
    bindings:
    - tract
    - start_rate
    ladder:
    - when: low-income or moderate-income census tract
      value: K('start_pct_lowmod') = 0.20 percent
    - when: upper-income census tract
      value: K('start_pct_upper') = 0.12 percent
    - when: otherwise (middle-income tract)
      value: K('start_pct_standard') = 0.15 percent
    baseline:
      start_rate: K('start_pct_standard')
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: heroes_purpose_adjustment
    effect: parameter
    decides: purpose_adjustment
    bindings:
    - purpose
    - first_time
    - purpose_adjustment
    ladder:
    - when: rate-and-term refinance
      value: -K('refi_cut') = -150.00
    - when: purchase by a first-time homebuyer
      value: +K('purchase_fthb_add') = +100.00
    - when: otherwise
      value: '0'
    baseline:
      purpose_adjustment: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: heroes_preapproval_adjustment
    effect: parameter
    decides: preapproval_adjustment
    bindings:
    - preapproval_level
    - preapproval_adjustment
    ladder:
    - when: converted from an Underwritten or Jumbo Underwritten Pre-Approval
      value: +K('underwritten_add') = +100.00
    - when: converted from a Verified Pre-Approval
      value: +K('verified_add') = +50.00
    - when: otherwise
      value: '0'
    baseline:
      preapproval_adjustment: '0'
    evidence:
    - cross_category
    cross_difficulty: preapproval
  - id: heroes_program_supplement
    effect: parameter
    decides: program_supplement
    bindings:
    - program
    - program_supplement
    ladder:
    - when: FHA or VA file
      value: +K('gov_add') = +125.00
    - when: HomeReady file
      value: +K('homeready_add') = +75.00
    - when: otherwise
      value: '0'
    baseline:
      program_supplement: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: heroes_occupation_supplement
    effect: parameter
    decides: occupation_supplement
    bindings:
    - occupation
    - occupation_program
    - occupation_supplement
    ladder:
    - when: active military member or veteran on a VA file
      value: +K('military_add') = +125.00
    - when: law enforcement officer, firefighter or emergency medical worker
      value: +K('responder_add') = +75.00
    - when: otherwise
      value: '0'
    baseline:
      occupation_supplement: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: heroes_extension_charge
    effect: method
    decides: extension_charge
    bindings:
    - days_extended
    - extension_charge
    ladder:
    - when: more than 45 days extended beyond award_validity_days
      method: 'linear charge: 25.00 plus 0.50 for each extended day beyond 45'
    - when: 1 to 45 days extended
      method: flat charge of 25.00, independent of the days
    - when: otherwise (never extended)
      method: no charge
    baseline:
      extension_charge: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The standard Hometown Heroes award is 0.15 percent of the base loan amount, rounded to the cent, never below 500.00 and never above the program's
      credit_cap. On re-certification the increase is the re-fixed award less the credit's available balance (its award entries less its reduction and application
      entries), never below zero, rounded to the cent, and it is booked as a further award entry; where the re-fixed award is not above the available balance,
      the re-certification books no entry and the balance stands.
    params:
    - start_pct_standard
    - heroes_min
    - credit_cap
  inputs:
    history:
    - table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_award_booked
    - table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_reduced
    cross_category:
    - loan
    - preapproval
- id: credit_ext_heroes_unpaid_cost_reduction
  base_policy_refs:
  - credit_agg_stacking
  - credit_application_at_closing
  overwrite: []
  trigger: state_due
  subject:
  - credit_reduced
  computes: entry_amount
  target_tool: reduce_unusable_credit_facd0be5
  params:
    cushion_far_days: 60
    cushion_near_days: 30
    cushion_far_pct: 5.0
    cushion_near_pct: 2.5
    tol_major: 100.0
    tol_minor: 50.0
  rule: 'Before closing, the part of a verified Hometown Heroes credit''s available balance above the costs it can still pay on the latest Loan Estimate
    is booked as a reduction for exceeding eligible costs, drawing on the credit''s first award entry. This reduction comes in addition to the base rule:
    what remains on any credit after every eligible cost is paid at closing is still booked as credit_reduced with exceeds_eligible_costs. A Hometown Heroes
    credit''s reduction against the Loan Estimate is not fixed until the credit''s basis stands at the base loan amount now on the loan file. The credit''s
    available balance is its award entries less its reduction and application entries. The costs a Heroes credit can still pay are the payable closing costs
    plus the prepaid items on the latest Loan Estimate, less the seller and agent concessions recorded on the loan file, less the charges the borrower has
    already paid (the appraisal charges collected on the file''s appraisal order and the up-front application and credit report fees paid on the loan file),
    and less the money Larkspur already holds and credits at closing (a rate lock deposit held on a lock whose product credits it at closing, and a pre-approval
    rate-hold fee held on a pre-approval whose level credits it at closing), never below zero. The reduction is the available balance less those costs,
    never below zero, rounded to the cent. The payable closing costs on the Loan Estimate are its nonrecurring closing costs. Larkspur refines this standard
    as follows. Where they apply, the buydown add-back and the re-disclosure cushion are added to the costs a Heroes credit can still pay together with
    the other terms, before the floor at zero; the reduction is then the available balance less those costs and less the excess tolerance, never below zero,
    rounded to the cent. Which closing costs are payable depends on program and pricing: on an FHA or VA file not flagged as a higher-priced mortgage loan
    they are the zero-tolerance total plus the 10 percent tolerance total on the Loan Estimate; on any file flagged as a higher-priced mortgage loan they
    are the zero-tolerance total alone; on any other file they are the nonrecurring closing costs. Concession money spent on a buydown does not pay closing
    costs: where a temporary buydown on the file is funded or to be funded by the seller or builder, whatever its status, its subsidy amount is added back;
    where the file''s buydown is instead a permanent buydown funded or to be funded by the seller or builder, its points cost is added back; any other buydown,
    or none, adds nothing back. Because costs on a Loan Estimate can still rise, a re-disclosure cushion is added, read from the days between the date the
    reduction is booked and the signing date scheduled with the settlement agent and from the loan file''s status: more than 60 days away on a file not
    yet clear to close adds 5 percent of the payable closing costs, rounded to the cent; 31 to 60 days away on a file not yet clear to close adds 2.5 percent
    of them, rounded to the cent; any other case, including no scheduled signing, adds no cushion. An excess tolerance is left on the credit, read from
    the changed circumstance on the latest Loan Estimate: a revised Loan Estimate for a program change or a loan amount change leaves 100.00 of excess;
    a revised Loan Estimate for any other changed circumstance leaves 50.00; an initial Loan Estimate, with no changed circumstance, leaves none.'
  prerequisite:
  - problem: credit_ext_heroes_recertified_award
    kind: value_input
    gate: heroes_balance
    form: state
    policy_source: A Hometown Heroes credit's reduction against the Loan Estimate is not fixed until the credit's basis stands at the base loan amount now
      on the loan file.
    condition: closing_credits.basis_loan_amount equals loan_files.base_loan_amount for the credit's loan file; after a program change only the borrower's
      occupation re-certification sets the basis.
    resolved_by: recertify_hero_occupation_0487fd94
    effect: Once the award is re-fixed on the current base loan amount, the available balance the reduction is measured from changes by the re-certification
      entry.
  cross_category:
  - category: loan
    as: history
    reads:
    - variant_name
    - hpml_flag
    - status
    - seller_concession_amount
    - agent_concession_amount
    - prepaid_fee_balance
    - preapproval_id
    - loan_disclosures.nonrecurring_closing_costs
    - loan_disclosures.zero_tolerance_total
    - loan_disclosures.ten_percent_tolerance_total
    - loan_disclosures.prepaid_items_total
    - loan_disclosures.coc_reason
    note: The payable scope, concessions, already-paid charges, cushion status and tolerance read the loan file and its latest Loan Estimate.
  - category: buydown
    as: branch
    reads:
    - subsidy_amount
    - points_cost
    - funding_source
    note: The buydown add-back reads the buydown on the file.
  - category: appraisal
    as: branch
    reads:
    - fee_balance
    note: The already-paid charges read the appraisal charges collected.
  - category: lock
    as: branch
    reads:
    - deposit_balance
    - deposit_credited_at_closing
    note: The money Larkspur holds reads the rate lock deposit and whether the lock product credits it at closing.
  - category: preapproval
    as: branch
    reads:
    - hold_fee_balance
    - rate_hold_fee_credited_at_closing
    note: The money Larkspur holds reads a pre-approval rate-hold fee and whether the pre-approval level credits it.
  - category: funding
    as: branch
    reads:
    - scheduled_closing_date
    note: The re-disclosure cushion tier reads the signing date scheduled with the settlement agent.
  compute:
  - award_entries: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_award_booked')
  - reduction_entries: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_reduced')
  - application_entries: SUM('credit_ledger', 'entry_amount', date_field='entry_date', event_type='credit_applied_at_closing')
  - heroes_balance: RND(award_entries - reduction_entries - application_entries, 2)
  - program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - hpml: CFIELD('loan', 'hpml_flag', loan_file_id=F('loan_file_id'))
  - le_nonrecurring: XLATEST('loan', 'loan_disclosures', 'nonrecurring_closing_costs', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='loan_estimate')
  - le_zero_tolerance: XLATEST('loan', 'loan_disclosures', 'zero_tolerance_total', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='loan_estimate')
  - le_ten_percent: XLATEST('loan', 'loan_disclosures', 'ten_percent_tolerance_total', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='loan_estimate')
  - payable_le_costs: le_zero_tolerance + le_ten_percent if ((program == 'Larkspur FHA 30-Year Fixed' or program == 'Larkspur VA 30-Year Fixed') and hpml
      != True) else (le_zero_tolerance if hpml == True else le_nonrecurring)
  - le_prepaid: XLATEST('loan', 'loan_disclosures', 'prepaid_items_total', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='loan_estimate')
  - concessions: CFIELD('loan', 'seller_concession_amount', loan_file_id=F('loan_file_id')) + CFIELD('loan', 'agent_concession_amount', loan_file_id=F('loan_file_id'))
  - already_paid: (CFIELD('appraisal', 'fee_balance', loan_file_id=F('loan_file_id')) or 0) + (CFIELD('loan', 'prepaid_fee_balance', loan_file_id=F('loan_file_id'))
      or 0)
  - held_money: ((CFIELD('lock', 'deposit_balance', loan_file_id=F('loan_file_id')) or 0) if CPARAM('lock', 'deposit_credited_at_closing', loan_file_id=F('loan_file_id'))
      == True else 0) + ((CFIELD('preapproval', 'hold_fee_balance', preapproval_id=CFIELD('loan', 'preapproval_id', loan_file_id=F('loan_file_id'))) or
      0) if CPARAM('preapproval', 'rate_hold_fee_credited_at_closing', preapproval_id=CFIELD('loan', 'preapproval_id', loan_file_id=F('loan_file_id')))
      == True else 0)
  - buydown_subsidy: CFIELD('buydown', 'subsidy_amount', loan_file_id=F('loan_file_id')) or 0
  - buydown_points: CFIELD('buydown', 'points_cost', loan_file_id=F('loan_file_id')) or 0
  - buydown_payer: CFIELD('buydown', 'funding_source', loan_file_id=F('loan_file_id'))
  - buydown_addback: buydown_subsidy if (buydown_subsidy > 0 and (buydown_payer == 'seller' or buydown_payer == 'builder')) else (buydown_points if (buydown_points
      > 0 and (buydown_payer == 'seller' or buydown_payer == 'builder')) else 0)
  - scheduled_signing: CFIELD('funding', 'scheduled_closing_date', loan_file_id=F('loan_file_id'))
  - file_status: CFIELD('loan', 'status', loan_file_id=F('loan_file_id'))
  - days_to_signing: DAYS(NOW, scheduled_signing) if (scheduled_signing != None and scheduled_signing != '') else 0
  - cushion_pct: K('cushion_far_pct') if (days_to_signing > K('cushion_far_days') and file_status != 'clear_to_close') else (K('cushion_near_pct') if (days_to_signing
      > K('cushion_near_days') and file_status != 'clear_to_close') else 0)
  - cushion: RND(payable_le_costs * cushion_pct / 100, 2)
  - le_change_reason: XLATEST('loan', 'loan_disclosures', 'coc_reason', date_field='issued_date', loan_file_id=F('loan_file_id'), disclosure_form='loan_estimate')
  - excess_tolerance: K('tol_major') if (le_change_reason == 'program_change' or le_change_reason == 'loan_amount_change') else (K('tol_minor') if (le_change_reason
      != None and le_change_reason != 'none') else 0)
  - costs_left: MX(0, payable_le_costs + le_prepaid - concessions - already_paid - held_money + buydown_addback + cushion)
  - result: RND(MX(0, heroes_balance - costs_left - excess_tolerance), 2)
  compute_basis:
    award_entries: The credit's available balance is its award entries less its reduction and application entries.
    reduction_entries: The credit's available balance is its award entries less its reduction and application entries.
    application_entries: The credit's available balance is its award entries less its reduction and application entries.
    heroes_balance: The credit's available balance is its award entries less its reduction and application entries.
    program: Which closing costs are payable depends on program and pricing
    hpml: on any file flagged as a higher-priced mortgage loan they are the zero-tolerance total alone
    le_nonrecurring: The payable closing costs on the Loan Estimate are its nonrecurring closing costs.
    le_zero_tolerance: they are the zero-tolerance total plus the 10 percent tolerance total on the Loan Estimate
    le_ten_percent: they are the zero-tolerance total plus the 10 percent tolerance total on the Loan Estimate
    payable_le_costs: on an FHA or VA file not flagged as a higher-priced mortgage loan they are the zero-tolerance total plus the 10 percent tolerance
      total on the Loan Estimate; on any file flagged as a higher-priced mortgage loan they are the zero-tolerance total alone; on any other file they are
      the nonrecurring closing costs.
    le_prepaid: the payable closing costs plus the prepaid items on the latest Loan Estimate
    concessions: less the seller and agent concessions recorded on the loan file
    already_paid: less the charges the borrower has already paid (the appraisal charges collected on the file's appraisal order and the up-front application
      and credit report fees paid on the loan file)
    held_money: less the money Larkspur already holds and credits at closing (a rate lock deposit held on a lock whose product credits it at closing, and
      a pre-approval rate-hold fee held on a pre-approval whose level credits it at closing), never below zero.
    buydown_subsidy: where a temporary buydown on the file is funded or to be funded by the seller or builder, whatever its status, its subsidy amount is
      added back
    buydown_points: where the file's buydown is instead a permanent buydown funded or to be funded by the seller or builder, its points cost is added back
    buydown_payer: funded or to be funded by the seller or builder
    buydown_addback: where a temporary buydown on the file is funded or to be funded by the seller or builder, whatever its status, its subsidy amount is
      added back; where the file's buydown is instead a permanent buydown funded or to be funded by the seller or builder, its points cost is added back;
      any other buydown, or none, adds nothing back.
    scheduled_signing: the signing date scheduled with the settlement agent
    file_status: and from the loan file's status
    days_to_signing: read from the days between the date the reduction is booked and the signing date scheduled with the settlement agent
    cushion_pct: more than 60 days away on a file not yet clear to close adds 5 percent of the payable closing costs, rounded to the cent; 31 to 60 days
      away on a file not yet clear to close adds 2.5 percent of them, rounded to the cent; any other case, including no scheduled signing, adds no cushion.
    cushion: adds 5 percent of the payable closing costs, rounded to the cent
    le_change_reason: read from the changed circumstance on the latest Loan Estimate
    excess_tolerance: a revised Loan Estimate for a program change or a loan amount change leaves 100.00 of excess; a revised Loan Estimate for any other
      changed circumstance leaves 50.00; an initial Loan Estimate, with no changed circumstance, leaves none.
    costs_left: Where they apply, the buydown add-back and the re-disclosure cushion are added to the costs a Heroes credit can still pay together with
      the other terms, before the floor at zero
    result: the reduction is then the available balance less those costs and less the excess tolerance, never below zero, rounded to the cent.
  factors:
  - id: heroes_le_payable_scope
    effect: method
    decides: payable_le_costs
    bindings:
    - program
    - hpml
    - le_nonrecurring
    - le_zero_tolerance
    - le_ten_percent
    - payable_le_costs
    ladder:
    - when: FHA or VA file not flagged as a higher-priced mortgage loan
      method: payable = zero-tolerance total plus 10 percent tolerance total on the Loan Estimate
    - when: file flagged as a higher-priced mortgage loan
      method: payable = zero-tolerance total alone
    - when: otherwise
      method: payable = nonrecurring closing costs on the Loan Estimate
    baseline:
      payable_le_costs: le_nonrecurring
    evidence:
    - cross_category
    - history
    cross_difficulty: loan
  - id: heroes_buydown_addback
    effect: parameter
    decides: buydown_addback
    bindings:
    - buydown_subsidy
    - buydown_points
    - buydown_payer
    - buydown_addback
    ladder:
    - when: temporary buydown funded or to be funded by the seller or builder
      value: the buydown's subsidy amount
    - when: permanent buydown funded or to be funded by the seller or builder
      value: the buydown's points cost
    - when: otherwise (borrower- or Larkspur-funded buydown, or none)
      value: '0'
    baseline:
      buydown_addback: '0'
    evidence:
    - cross_category
    cross_difficulty: buydown
  - id: heroes_redisclosure_cushion
    effect: parameter
    decides: cushion_pct
    bindings:
    - scheduled_signing
    - file_status
    - days_to_signing
    - cushion_pct
    - cushion
    ladder:
    - when: scheduled signing more than 60 days away and the loan file not yet clear to close
      value: K('cushion_far_pct') = 5 percent of the payable closing costs
    - when: scheduled signing 31 to 60 days away and the loan file not yet clear to close
      value: K('cushion_near_pct') = 2.5 percent
    - when: otherwise (30 days or fewer, cleared to close, or no scheduled signing)
      value: '0'
    baseline:
      cushion_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: funding
  - id: heroes_excess_tolerance
    effect: parameter
    decides: excess_tolerance
    bindings:
    - le_change_reason
    - excess_tolerance
    ladder:
    - when: latest Loan Estimate revised for a program change or a loan amount change
      value: K('tol_major') = 100.00
    - when: latest Loan Estimate revised for any other changed circumstance
      value: K('tol_minor') = 50.00
    - when: otherwise (initial Loan Estimate)
      value: '0'
    baseline:
      excess_tolerance: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: loan
  baseline:
    rule: The credit's available balance is its award entries less its reduction and application entries. The costs a Heroes credit can still pay are the
      payable closing costs plus the prepaid items on the latest Loan Estimate, less the seller and agent concessions recorded on the loan file, less the
      charges the borrower has already paid (the appraisal charges collected on the file's appraisal order and the up-front application and credit report
      fees paid on the loan file), and less the money Larkspur already holds and credits at closing (a rate lock deposit held on a lock whose product credits
      it at closing, and a pre-approval rate-hold fee held on a pre-approval whose level credits it at closing), never below zero. The reduction is the
      available balance less those costs, never below zero, rounded to the cent. The payable closing costs on the Loan Estimate are its nonrecurring closing
      costs.
    params: []
  inputs:
    history:
    - table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_award_booked
    - table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_reduced
    - category: loan
      table: loan_disclosures
      aggregate: latest
      field: prepaid_items_total
      filters:
        disclosure_form: loan_estimate
    cross_category:
    - loan
    - buydown
    - appraisal
    - lock
    - preapproval
    - funding
