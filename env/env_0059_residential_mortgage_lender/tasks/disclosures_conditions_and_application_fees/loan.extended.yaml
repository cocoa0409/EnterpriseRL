events:
- type: loan_application_taken
  target: loan_files
  mutation: create
  meaning: a borrower's mortgage application for one property is opened under a loan program
  grain: one row per loan file
  fields:
    customer_id: primary borrower who owns the file (foreign key -> customers)
    variant_name: loan program the file is underwritten under, written as the official program name
    status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'
    loan_purpose: purpose of the loan
    occupancy: how the borrower will occupy the subject property
    property_type: type of the subject property
    units: number of dwelling units in the subject property (1 to 4)
    property_address: street address of the subject property exactly as on the purchase contract or title
    property_state: state where the subject property is located
    base_loan_amount: loan amount before any financed upfront program fee (FHA upfront MIP or VA funding
      fee)
    loan_amount: total note amount = base loan amount plus any financed upfront program fee
    property_value: >-
      value used for loan-to-value: the lower of purchase price and appraised value for purchases, the
      appraised value for refinances
    credit_score: representative credit score of the file (lowest middle score among borrowers)
    dti_ratio: total debt-to-income ratio of the file as last underwritten
    borrower_count: number of borrowers on the application whose credit is pulled
    first_time_homebuyer: >-
      whether every borrower on the file is a first-time homebuyer (no ownership interest in a home in
      the past 3 years)
    homebuyer_education_completed: whether a homebuyer education certificate is on file
    qualifying_income_pct_ami: >-
      qualifying annual income of the file as a whole-number percentage of the area median income of the
      property's census tract
    census_tract_income_level: FFIEC income level of the subject property's census tract
    funding_fee_exempt: >-
      VA files only: the veteran receives VA service-connected disability compensation and is exempt from
      the VA funding fee; false on every other program
    application_date: >-
      date Larkspur received all six TRID application items (name, income, SSN, property address, estimated
      value, loan amount)
    contract_closing_date: closing date written in the purchase contract; empty for refinances
    estimated_closing_date: closing date currently scheduled on the file
    preapproval_id: >-
      pre-approval the application was converted from (foreign key -> preapprovals); empty if none
    agent_customer_id: >-
      buyer's real estate agent working with the borrower (foreign key -> customers); empty if none
    opened_date: date the loan file was opened
  triggers:
  - event: preapproval:preapproval_converted
    when:
      preapproval_id: {not: ''}
    map: {preapproval_id: preapproval_id}
- type: loan_credit_report_fee_charged
  target: loan_fee_ledger
  meaning: the tri-merge credit report fee is charged to the borrower's card when credit is pulled
  grain: one row per credit pull charged on a loan file
  distinguish_by: [fee_code, entry_date]
  fields:
    loan_file_id: loan file the fee belongs to (foreign key -> loan_files)
    customer_id: borrower who paid or is credited (foreign key -> customers)
    fee_code: which up-front fee the entry concerns
    amount: >-
      entry amount, always positive; whether it adds to or removes from the prepaid fee balance is given
      by event_type
    borrower_count: >-
      number of borrowers whose credit was pulled for a credit report fee entry; 0 on other entries
    entry_date: date the charge, refund or closing application was booked
    payment_method: >-
      how the money moved: the card or account charged/refunded, or a credit line on the Closing Disclosure
    entry_reason: why the entry was booked
  account: borrower_paid_fees
  direction: in
  triggers: []
- type: loan_application_fee_collected
  target: loan_fee_ledger
  meaning: the program's application fee is collected from the borrower
  grain: one row per application fee collected on a loan file
  distinguish_by: [fee_code, entry_date]
  fields:
    loan_file_id: loan file the fee belongs to (foreign key -> loan_files)
    customer_id: borrower who paid or is credited (foreign key -> customers)
    fee_code: which up-front fee the entry concerns
    amount: >-
      entry amount, always positive; whether it adds to or removes from the prepaid fee balance is given
      by event_type
    entry_date: date the charge, refund or closing application was booked
    payment_method: >-
      how the money moved: the card or account charged/refunded, or a credit line on the Closing Disclosure
    entry_reason: why the entry was booked
  account: borrower_paid_fees
  direction: in
  triggers: []
- type: loan_fee_refunded
  target: loan_fee_ledger
  meaning: >-
    a collected application fee is refunded because the file was denied or the fee was collected too early
  grain: one row per fee entry refunded
  distinguish_by: [original_fee_entry_id]
  fields:
    loan_file_id: loan file the fee belongs to (foreign key -> loan_files)
    customer_id: borrower who paid or is credited (foreign key -> customers)
    fee_code: which up-front fee the entry concerns
    amount: >-
      entry amount, always positive; whether it adds to or removes from the prepaid fee balance is given
      by event_type
    entry_date: date the charge, refund or closing application was booked
    payment_method: >-
      how the money moved: the card or account charged/refunded, or a credit line on the Closing Disclosure
    original_fee_entry_id: >-
      for a refund or closing application, the fee entry being refunded or applied (foreign key -> loan_fee_ledger);
      empty on charges
    entry_reason: why the entry was booked
  account: borrower_paid_fees
  direction: out
  triggers: []
- type: loan_fee_withdrawal_refunded
  target: loan_fee_ledger
  meaning: an application fee is refunded because the borrower withdrew within the refund window
  grain: one row per fee entry refunded on withdrawal
  distinguish_by: [original_fee_entry_id]
  fields:
    loan_file_id: loan file the fee belongs to (foreign key -> loan_files)
    customer_id: borrower who paid or is credited (foreign key -> customers)
    fee_code: which up-front fee the entry concerns
    amount: >-
      entry amount, always positive; whether it adds to or removes from the prepaid fee balance is given
      by event_type
    entry_date: date the charge, refund or closing application was booked
    payment_method: >-
      how the money moved: the card or account charged/refunded, or a credit line on the Closing Disclosure
    original_fee_entry_id: >-
      for a refund or closing application, the fee entry being refunded or applied (foreign key -> loan_fee_ledger);
      empty on charges
    entry_reason: why the entry was booked
  account: borrower_paid_fees
  direction: out
  triggers: []
- type: loan_fee_applied_at_closing
  target: loan_fee_ledger
  meaning: >-
    a previously collected application fee is credited back to the borrower on the Closing Disclosure
  grain: one row per fee entry applied at closing
  distinguish_by: [original_fee_entry_id]
  fields:
    loan_file_id: loan file the fee belongs to (foreign key -> loan_files)
    customer_id: borrower who paid or is credited (foreign key -> customers)
    fee_code: which up-front fee the entry concerns
    amount: >-
      entry amount, always positive; whether it adds to or removes from the prepaid fee balance is given
      by event_type
    entry_date: date the charge, refund or closing application was booked
    payment_method: >-
      how the money moved: the card or account charged/refunded, or a credit line on the Closing Disclosure
    original_fee_entry_id: >-
      for a refund or closing application, the fee entry being refunded or applied (foreign key -> loan_fee_ledger);
      empty on charges
    entry_reason: why the entry was booked
  account: borrower_paid_fees
  direction: out
  triggers: []
- type: loan_le_issued
  target: loan_disclosures
  meaning: the initial Loan Estimate is issued to the borrower
  grain: one row per initial Loan Estimate
  distinguish_by: [disclosure_form, disclosure_sequence]
  fields:
    loan_file_id: loan file disclosed (foreign key -> loan_files)
    customer_id: borrower the disclosure was delivered to (foreign key -> customers)
    disclosure_form: which TRID document the record is
    disclosure_sequence: 1 for the first document of this form on the file, 2 for the first revision,
      and so on
    issued_date: >-
      date the document was delivered in person, sent through the e-sign portal or placed in the mail;
      for an intent to proceed, the date it was given
    delivery_method: how the document was delivered or how the intent to proceed was given
    received_date: >-
      date the borrower received the document: the e-sign acknowledgment or in-person date, or for mail
      the date deemed received under the mailbox rule
    coc_reason: >-
      changed circumstance relied on for a revised Loan Estimate or corrected Closing Disclosure; none
      for initial documents
    apr: annual percentage rate disclosed; empty on an intent to proceed
    note_rate: interest rate disclosed; empty on an intent to proceed
    total_closing_costs: total closing costs (Loan Costs plus Other Costs) disclosed
    lender_credit_amount: lender credits disclosed, shown as a positive amount
    nonrecurring_closing_costs: >-
      borrower-paid one-time closing costs disclosed (Loan Costs sections A, B and C plus taxes and government
      fees in section E), excluding discount points
    prepaid_items_total: prepaid items and initial escrow payment disclosed (Other Costs sections F and
      G)
    discount_points_amount: discount points disclosed in section A, in dollars
    zero_tolerance_total: >-
      sum of the disclosed charges in the zero-tolerance bucket (Larkspur charges, transfer taxes, services
      the borrower could not shop for)
    ten_percent_tolerance_total: >-
      sum of the disclosed charges in the 10 percent aggregate bucket (recording fees plus shoppable services
      from Larkspur's written provider list)
  triggers:
  - {event: 'loan:loan_disclosed'}
- type: loan_itp_received
  target: loan_disclosures
  meaning: the borrower's intent to proceed with the Loan Estimate is received
  grain: one row per intent to proceed
  distinguish_by: [disclosure_form, issued_date]
  fields:
    loan_file_id: loan file disclosed (foreign key -> loan_files)
    customer_id: borrower the disclosure was delivered to (foreign key -> customers)
    disclosure_form: which TRID document the record is
    issued_date: >-
      date the document was delivered in person, sent through the e-sign portal or placed in the mail;
      for an intent to proceed, the date it was given
    delivery_method: how the document was delivered or how the intent to proceed was given
    received_date: >-
      date the borrower received the document: the e-sign acknowledgment or in-person date, or for mail
      the date deemed received under the mailbox rule
  triggers:
  - event: loan:loan_processing_started
    map: {intent_to_proceed_date: received_date}
- type: loan_le_revised
  target: loan_disclosures
  meaning: a revised Loan Estimate is issued on a changed circumstance
  grain: one row per revised Loan Estimate
  distinguish_by: [disclosure_form, disclosure_sequence]
