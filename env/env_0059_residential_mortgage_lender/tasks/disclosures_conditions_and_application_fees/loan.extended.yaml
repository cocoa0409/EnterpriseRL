    apr: annual percentage rate disclosed; empty on an intent to proceed
    note_rate: interest rate disclosed; empty on an intent to proceed
    total_closing_costs: total closing costs (Loan Costs plus Other Costs) disclosed
    lender_credit_amount: lender credits disclosed, shown as a positive amount
    nonrecurring_closing_costs: >-
