- type: loan_condition_issued
  target: loan_conditions
  meaning: an underwriter issues a condition on the file
  grain: one row per condition issued
  distinguish_by: [condition_code, issued_date]
  fields:
    loan_file_id: loan file the condition is on (foreign key -> loan_files)
    customer_id: borrower (foreign key -> customers)
    condition_code: what the condition asks for
    condition_class: whether the condition must be cleared before closing documents are drawn or before
      funding
    issued_date: >-
      date the underwriter issued the condition (on a cleared/waived record: the issue date of the source
      condition)
    due_date: >-
      date the borrower's documents are due (issued date plus the program's condition response days)
  triggers: []
- type: loan_condition_cleared
  target: loan_conditions
  meaning: documents satisfy an issued condition and it is cleared
  grain: one row per condition cleared
  distinguish_by: [source_condition_id]
  fields:
    loan_file_id: loan file the condition is on (foreign key -> loan_files)
    customer_id: borrower (foreign key -> customers)
    condition_code: what the condition asks for
    condition_class: whether the condition must be cleared before closing documents are drawn or before
      funding
    issued_date: >-
      date the underwriter issued the condition (on a cleared/waived record: the issue date of the source
      condition)
    document_date: >-
      date printed on the document supplied to satisfy the condition (statement date, paystub date); empty
      when not applicable
    resolved_date: date the condition was cleared or waived; empty on the issued record
    source_condition_id: >-
      on a cleared or waived record, the issued condition it resolves (foreign key -> loan_conditions);
      empty on the issued record
    waiver_reason: basis for a waiver; none on issued and cleared records
  triggers: []
- type: loan_condition_waived
  target: loan_conditions
  meaning: an issued condition is waived because it no longer applies or is satisfied otherwise
  grain: one row per condition waived
  distinguish_by: [source_condition_id]
  fields:
    loan_file_id: loan file the condition is on (foreign key -> loan_files)
    customer_id: borrower (foreign key -> customers)
    condition_code: what the condition asks for
    condition_class: whether the condition must be cleared before closing documents are drawn or before
      funding
    issued_date: >-
      date the underwriter issued the condition (on a cleared/waived record: the issue date of the source
      condition)
    resolved_date: date the condition was cleared or waived; empty on the issued record
    source_condition_id: >-
      on a cleared or waived record, the issued condition it resolves (foreign key -> loan_conditions);
      empty on the issued record
    waiver_reason: basis for a waiver; none on issued and cleared records
  triggers: []
- type: loan_tolerance_cure_assessed
  target: loan_tolerance_cures
  meaning: a TRID tolerance violation is measured and the cure owed is booked
  grain: one row per tolerance bucket exceeded on a final disclosure
  distinguish_by: [tolerance_bucket, final_disclosure_id]
  fields: {loan_file_id: loan file (foreign key -> loan_files), customer_id: borrower owed the cure (foreign
      key -> customers), tolerance_bucket: TRID tolerance bucket that was exceeded, baseline_disclosure_id: Loan
      Estimate whose amounts are the good-faith baseline (foreign key -> loan_disclosures), final_disclosure_id: Closing
      Disclosure whose amounts exceeded the baseline (foreign key -> loan_disclosures), cure_amount: 'cure
      owed or paid, positive', cure_method: how the cure is delivered, cure_date: date the cure was assessed
      or paid}
  account: tolerance_cure
  direction: in
  triggers: []
- type: loan_tolerance_cure_paid
  target: loan_tolerance_cures
  meaning: an assessed tolerance cure is paid as a closing credit or a post-closing refund
  grain: one row per assessed cure paid
  distinguish_by: [source_cure_entry_id]
  fields:
    loan_file_id: loan file (foreign key -> loan_files)
    customer_id: borrower owed the cure (foreign key -> customers)
    tolerance_bucket: TRID tolerance bucket that was exceeded
    cure_amount: cure owed or paid, positive
    cure_method: how the cure is delivered
    cure_date: date the cure was assessed or paid
    source_cure_entry_id: >-
      on a payment entry, the assessed cure it pays (foreign key -> loan_tolerance_cures); empty on the
      assessment
  account: tolerance_cure
  direction: out
  triggers: []
- type: loan_disclosed
  target: loan_files
  mutation:
    transition: {from: application_received, to: disclosed}
  meaning: the file moves to disclosed when the initial Loan Estimate goes out
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'}
  triggers: []
- type: loan_processing_started
  target: loan_files
  mutation:
    transition: {from: disclosed, to: processing}
  meaning: intent to proceed is on file and processing begins
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)', intent_to_proceed_date: date
      the borrower's intent to proceed was received; empty until then}
  triggers: []
- type: loan_itp_lapsed
  target: loan_files
  mutation:
    transition: {from: disclosed, to: withdrawn}
  meaning: no intent to proceed arrived in time and the application is treated as withdrawn
  grain: one row per loan file
  fields:
    status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'
    closed_date: >-
      date the file reached a terminal status (consummation, withdrawal, denial or closure for incompleteness);
      empty while open
  triggers:
  - &id004 {event: 'lock:lock_cancelled'}
  - &id005 {event: 'credit:credit_forfeited'}
- type: loan_submitted_to_underwriting
  target: loan_files
  mutation:
    transition: {from: processing, to: underwriting}
  meaning: the processed file is submitted to underwriting
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'}
  triggers: []
- type: loan_conditionally_approved
  target: loan_files
  mutation:
    transition: {from: underwriting, to: conditionally_approved}
  meaning: the underwriter issues a conditional approval
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'}
  triggers: []
- type: loan_suspended
  target: loan_files
  mutation:
    transition:
    - {from: underwriting, to: suspended}
    - {from: conditionally_approved, to: suspended}
  meaning: the file is suspended pending documentation
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)', suspended_date: date
      the file last entered suspended status; empty if never suspended}
  triggers: []
- type: loan_resubmitted
  target: loan_files
  mutation:
    transition: {from: suspended, to: underwriting}
  meaning: a suspended file is resubmitted to underwriting
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)', resubmission_count: number
      of times the file has been resubmitted to underwriting from suspense}
  triggers: []
- type: loan_cleared_to_close
  target: loan_files
  mutation:
    transition: {from: conditionally_approved, to: clear_to_close}
  meaning: the file is cleared to close
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'}
  triggers: []
- type: loan_ctc_rescinded
  target: loan_files
  mutation:
    transition: {from: clear_to_close, to: conditionally_approved}
  meaning: clear-to-close is withdrawn after a new prior-to-documents condition
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'}
  triggers: []
- type: loan_consummated
  target: loan_files
  mutation:
    transition: {from: clear_to_close, to: consummated}
  meaning: the borrower signs the note and the loan is consummated
  grain: one row per loan file
  fields:
    status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'
    closed_date: >-
      date the file reached a terminal status (consummation, withdrawal, denial or closure for incompleteness);
      empty while open
  triggers:
  - {event: 'credit:credit_applied_at_closing'}
  - {event: 'buydown:buydown_funded'}
- type: loan_withdrawn
  target: loan_files
  mutation:
    transition:
    - {from: application_received, to: withdrawn}
    - {from: disclosed, to: withdrawn}
    - {from: processing, to: withdrawn}
    - {from: underwriting, to: withdrawn}
    - {from: conditionally_approved, to: withdrawn}
    - {from: suspended, to: withdrawn}
    - {from: clear_to_close, to: withdrawn}
  meaning: the borrower withdraws the application
  grain: one row per loan file
  fields:
    status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'
    closed_date: >-
      date the file reached a terminal status (consummation, withdrawal, denial or closure for incompleteness);
      empty while open
  triggers:
  - *id004
  - *id005
- type: loan_denied
  target: loan_files
  mutation:
    transition:
    - {from: application_received, to: denied}
    - {from: underwriting, to: denied}
    - {from: suspended, to: denied}
  meaning: Larkspur denies the application
  grain: one row per loan file
  fields:
    status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'
    closed_date: >-
      date the file reached a terminal status (consummation, withdrawal, denial or closure for incompleteness);
      empty while open
  triggers:
  - *id004
  - *id005
- type: loan_closed_incomplete
  target: loan_files
  mutation:
    transition: {from: suspended, to: closed_incomplete}
  meaning: a suspended file is closed for incompleteness
  grain: one row per loan file
  fields:
    status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'
    closed_date: >-
      date the file reached a terminal status (consummation, withdrawal, denial or closure for incompleteness);
      empty while open
  triggers:
  - *id004
  - *id005
- type: loan_rescinded
  target: loan_files
  mutation:
    transition: {from: consummated, to: rescinded}
  meaning: the borrower rescinds a consummated refinance within the rescission period
  grain: one row per loan file
  fields: {status: 'lifecycle status of the loan file (basis: loan lifecycle.states)'}
  triggers: []
- type: loan_program_changed
  target: loan_files
  mutation: update
  meaning: the file is moved to a different loan program
  grain: one row per loan file
  fields: {variant_name: 'loan program the file is underwritten under, written as the official program
      name', base_loan_amount: loan amount before any financed upfront program fee (FHA upfront MIP or
      VA funding fee), loan_amount: total note amount = base loan amount plus any financed upfront program
      fee}
  triggers:
  - {event: 'lock:lock_repriced'}
- type: loan_terms_updated
  target: loan_files
  mutation: update
  meaning: >-
    loan terms or contract facts on the file change (amount, value, concessions, closing date, escrow
    election)
  grain: one row per loan file
  fields:
    base_loan_amount: loan amount before any financed upfront program fee (FHA upfront MIP or VA funding
      fee)
    loan_amount: total note amount = base loan amount plus any financed upfront program fee
    property_value: >-
      value used for loan-to-value: the lower of purchase price and appraised value for purchases, the
      appraised value for refinances
    estimated_closing_date: closing date currently scheduled on the file
    seller_concession_amount: >-
      total contribution toward the borrower's costs agreed by the seller or builder in the purchase contract
    agent_concession_amount: >-
      total contribution toward the borrower's costs agreed by a real estate agent out of commission
    escrow_waived: whether the borrower elected to waive the tax and insurance escrow account
  triggers: []
measures:
- id: loan_msr_open_ptd_conditions
  window: the life of the loan file up to frozen time
  measure: >-
    count of loan_condition_issued records on the file with condition_class prior_to_documents for which
    no loan_condition_cleared or loan_condition_waived record carries its condition_id as source_condition_id
- id: loan_msr_overdue_conditions
  window: the life of the loan file up to frozen time
  measure: >-
    count of loan_condition_issued records on the file that are still open (no cleared or waived record
    points to them) and whose due_date is earlier than the frozen-time date
- id: loan_msr_recent_credit_report_charge
  window: >-
    rolling credit_report_max_age_days calendar days ending on the frozen-time date, across every loan
    file of the same customer
  measure: >-
    the latest entry_date among loan_credit_report_fee_charged records of the customer, or empty if none
    falls in the window
policies:
- id: loan_program_eligibility
  subject: [loan_application_taken, loan_program_changed]
  rule: >-
    A file may be opened under, or moved into, a loan program only when every program limit of that program
    holds on the file's current facts: the representative credit score is at or above min_credit_score;
    the base-loan-to-value (base loan amount divided by property value, as a percent rounded to 2 decimals)
    is at or below the program maximum for the file's loan_purpose (max_ltv_purchase_pct, max_ltv_rate_term_refi_pct
    or max_ltv_cash_out_pct); the debt-to-income ratio is at or below max_dti_pct; the base loan amount
    lies between min_loan_amount and max_loan_amount inclusive; loan_purpose is in eligible_purposes,
    occupancy is in eligible_occupancies and units do not exceed max_units. Where income_limit_pct_ami
    is a number, qualifying_income_pct_ami must not exceed it; no_limit means income is not tested. Where
    requires_homebuyer_education is true and the file is a first-time homebuyer file, a homebuyer education
    certificate must be on file before the file is moved past conditional approval. A file that fails
    any limit is not opened under that program; the borrower is offered the programs whose limits the
    facts do meet. A program change on an existing file is a changed circumstance and re-tests every limit
    against the target program; it never carries over the old program's limits.
  eligibility: []
  formula:
    ltv: round(base_loan_amount / property_value * 100, 2)
    eligible: >-
      credit_score >= min_credit_score and dti_ratio <= max_dti_pct and base_loan_amount >= min_loan_amount
      and base_loan_amount <= max_loan_amount and units <= max_units
- id: loan_agg_multi_holding
  subject: [loan_application_taken]
  rule: >-
    A customer may have at most max_per_customer loan files in a non-terminal status (application_received,
    disclosed, processing, underwriting, conditionally_approved, suspended or clear_to_close) at the same
    time, counted across every Larkspur loan file on which the customer is the primary borrower; consummated,
    withdrawn, denied and closed_incomplete files do not count. No other loan file of the same customer
    for the same property address is in a non-terminal status. A borrower who wants a different program
    or amount on a property already in process keeps the existing file and changes its program or terms
    instead of opening a second file. A new application that would exceed the cap is not opened.
  eligibility:
  - id: one_active_file_per_property
    applies_to: [loan_application_taken]
    kind: dedup
    condition: >-
      No other loan file of the same customer for the same property address is in a non-terminal status.
    evidence_fields: [loan_files.customer_id, loan_files.property_address, loan_files.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_files.customer_id, loan_files.property_address]
      action_bindings: {loan_files.customer_id: customer_id, loan_files.property_address: property_address}
    dedup_contract:
      table: loan_files
      mode: separate_record
      object_bindings: {customer_id: customer_id, property_address: property_address}
      duplicate_filters:
        status: [application_received, disclosed, processing, underwriting, conditionally_approved, suspended,
          clear_to_close]
      distinct_fields: [loan_purpose]
  params: {max_per_customer: 2}
- id: loan_agg_shared_credit_report
  subject: [loan_credit_report_fee_charged]
  rule: >-
    Larkspur pulls one tri-merge credit report per borrower and reuses it across every loan file of the
    same customer while it is valid. A credit report fee is charged on a new loan file only after the
    credit report validity window that started on the customer's latest credit report fee charge has run
    out. The window is counted in calendar days from the entry_date of the customer's latest loan_credit_report_fee_charged
    record on any Larkspur loan file; that entry date is day zero and the report stays reusable through
    the last day of the window. Inside the window the existing report is reissued to the new file at no
    charge and no fee record is booked. Outside the window (or when the customer has no earlier charge)
    a new pull is made and the fee booked is credit_report_fee_per_borrower of the file's program times
    the number of borrowers pulled. The credit report fee is a bona fide third-party charge and may be
    collected before the Loan Estimate is delivered; it is never refunded once the report has been pulled.
  eligibility:
  - id: report_window_lapsed
    applies_to: [loan_credit_report_fee_charged]
    kind: time
    condition: >-
      A credit report fee is charged on a new loan file only after the credit report validity window that
      started on the customer's latest credit report fee charge has run out.
    evidence_fields: [loan_fee_ledger.entry_date, loan_fee_ledger.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_fee_ledger.customer_id]
      action_bindings: {loan_fee_ledger.customer_id: customer_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the customer's latest credit report fee charge
      anchor_source: loan_fee_ledger.entry_date
      relation: not_before
      duration_source: variants.credit_report_max_age_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days from the entry_date of the customer's latest loan_credit_report_fee_charged
        record on any Larkspur loan file; that entry date is day zero and the report stays reusable through
        the last day of the window.
      boundary: exclusive
  formula: {fee: credit_report_fee_per_borrower * borrower_count}
  measures: [loan_msr_recent_credit_report_charge]
- id: loan_evt_application_fee
  subject: [loan_application_fee_collected]
  rule: >-
    Under TRID no fee other than a bona fide credit report fee may be imposed before the borrower has
    received the Loan Estimate and indicated an intent to proceed. The application fee is collected only
    while the loan file status is processing, underwriting, conditionally_approved, suspended or clear_to_close.
    The application fee is collected at most once per loan file. The amount is application_fee of the
    program the file is in at the moment of collection; where that value is 0.00 no fee record is booked.
    A later program change never triggers a top-up for a higher-fee program and never a partial refund
    for a lower-fee program; the collected amount stands until it is refunded or applied at closing under
    the fee refund policy. A fee collected while the file was still application_received or disclosed
    is an improper collection and is refunded in full regardless of the refund window.
  eligibility:
  - id: after_intent_to_proceed
    applies_to: [loan_application_fee_collected]
    kind: state
    condition: >-
      The application fee is collected only while the loan file status is processing, underwriting, conditionally_approved,
      suspended or clear_to_close.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: &id006
      - [loan_files.loan_file_id]
      action_bindings: &id007 {loan_files.loan_file_id: loan_file_id}
    state_contract:
      field: loan_files.status
      allowed: [processing, underwriting, conditionally_approved, suspended, clear_to_close]
  - id: once_per_file
    applies_to: [loan_application_fee_collected]
    kind: dedup
    condition: The application fee is collected at most once per loan file.
    evidence_fields: [loan_fee_ledger.loan_file_id, loan_fee_ledger.fee_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_fee_ledger.loan_file_id]
      action_bindings: {loan_fee_ledger.loan_file_id: loan_file_id}
    dedup_contract:
      table: loan_fee_ledger
      mode: separate_record
      object_bindings: {loan_file_id: loan_file_id}
      duplicate_filters:
        event_type: [loan_application_fee_collected]
      distinct_fields: []
  params:
    per_tier:
      Larkspur FHA 30-Year Fixed: {application_fee: =application_fee}
      Larkspur VA 30-Year Fixed: {application_fee: =application_fee}
      Larkspur HomeReady 30-Year Fixed: {application_fee: =application_fee}
      Larkspur Conventional 30-Year Fixed: {application_fee: =application_fee}
      Larkspur Conventional 15-Year Fixed: {application_fee: =application_fee}
      Larkspur High-Balance Conforming 30-Year Fixed: {application_fee: =application_fee}
      Larkspur Jumbo 30-Year Fixed: {application_fee: =application_fee}
- id: loan_evt_fee_refund
  subject: [loan_fee_refunded, loan_fee_withdrawal_refunded, loan_fee_applied_at_closing]
  rule: >-
    Only the application fee is ever refunded or applied; credit report fees are final once the report
    is pulled. When Larkspur denies a file and application_fee_refundable_on_denial is true, the application
    fee is refunded in full with entry_reason denial_refund. A withdrawal refund of the application fee
    is issued only when the borrower's withdrawal was recorded within the refund window that started on
    the application fee's entry date. Such a refund carries entry_reason withdrawal_refund and is booked
    as a withdrawal refund. Count business days forward from the application fee entry_date, which is
    day zero; the withdrawal date (the file's closed_date) must fall on or before the last business day
    of the window. A business day is Monday through Friday excluding the US federal public holidays observed
    by the Federal Reserve Banks; Saturdays, Sundays and those holidays are skipped when counting. A withdrawal
    after the window keeps the fee. An application fee collected before intent to proceed is refunded
    in full whenever found, with entry_reason improper_collection_refund, whatever the file's status.
    At consummation, when application_fee_credited_at_closing is true, the collected application fee is
    credited on the Closing Disclosure with payment_method closing_disclosure_credit and entry_reason
    applied_at_closing; when it is false the fee stays paid. Every refund or closing application names
    the original fee entry it reverses, carries that entry's full amount, and refunds go back to the same
    payment method; a fee entry is refunded or applied at most once.
  eligibility:
  - id: withdrawal_within_window
    applies_to: [loan_fee_withdrawal_refunded]
    kind: time
    condition: >-
      A withdrawal refund of the application fee is issued only when the borrower's withdrawal was recorded
      within the refund window that started on the application fee's entry date.
    evidence_fields: [loan_fee_ledger.entry_date, loan_fee_ledger.loan_fee_entry_id, loan_files.closed_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_fee_ledger.loan_fee_entry_id]
      action_bindings: {loan_fee_ledger.loan_fee_entry_id: original_fee_entry_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the application fee's entry date
      anchor_source: loan_fee_ledger.entry_date
      relation: not_after
      duration_source: variants.application_fee_refund_window_business_days
      unit: business_days
      counting_rule: >-
        Count business days forward from the application fee entry_date, which is day zero; the withdrawal
        date (the file's closed_date) must fall on or before the last business day of the window.
      boundary: inclusive
  params:
    per_tier:
      Larkspur FHA 30-Year Fixed: {refundable_on_denial: =application_fee_refundable_on_denial, refund_window: =application_fee_refund_window_business_days,
        credited_at_closing: =application_fee_credited_at_closing}
      Larkspur VA 30-Year Fixed: {refundable_on_denial: =application_fee_refundable_on_denial, refund_window: =application_fee_refund_window_business_days,
        credited_at_closing: =application_fee_credited_at_closing}
      Larkspur HomeReady 30-Year Fixed: {refundable_on_denial: =application_fee_refundable_on_denial,
        refund_window: =application_fee_refund_window_business_days, credited_at_closing: =application_fee_credited_at_closing}
      Larkspur Conventional 30-Year Fixed: {refundable_on_denial: =application_fee_refundable_on_denial,
        refund_window: =application_fee_refund_window_business_days, credited_at_closing: =application_fee_credited_at_closing}
      Larkspur Conventional 15-Year Fixed: {refundable_on_denial: =application_fee_refundable_on_denial,
        refund_window: =application_fee_refund_window_business_days, credited_at_closing: =application_fee_credited_at_closing}
      Larkspur High-Balance Conforming 30-Year Fixed: {refundable_on_denial: =application_fee_refundable_on_denial,
        refund_window: =application_fee_refund_window_business_days, credited_at_closing: =application_fee_credited_at_closing}
      Larkspur Jumbo 30-Year Fixed: {refundable_on_denial: =application_fee_refundable_on_denial, refund_window: =application_fee_refund_window_business_days,
        credited_at_closing: =application_fee_credited_at_closing}
- id: loan_le_delivery
  subject: [loan_le_issued, loan_disclosed]
  rule: >-
    An application exists once all six TRID items are received; that date is the file's application_date.
    The initial Loan Estimate must be delivered or placed in the mail no later than the end of the delivery
    window that starts on the application date. Count business days forward from the application_date,
    which is day zero; the issued_date may be any day up to and including the last business day of the
    window. A business day is Monday through Friday excluding the US federal public holidays observed
    by the Federal Reserve Banks; Saturdays, Sundays and those holidays are skipped when counting. An
    initial Loan Estimate is issued only while the loan file status is application_received. The initial
    Loan Estimate carries disclosure_sequence 1. Receipt is the e-sign acknowledgment date for esign_portal
    delivery and the in-person date for in_person delivery; a mailed Loan Estimate is deemed received
    on the mailbox_rule_business_days-th specific business day after the issued_date, where a specific
    business day is every calendar day except Sundays and the US federal public holidays. Issuing the
    initial Loan Estimate moves the file to disclosed. A file whose application is denied or withdrawn
    before the delivery deadline does not receive a Loan Estimate.
  eligibility:
  - id: le_within_three_days
    applies_to: [loan_le_issued]
    kind: time
    condition: >-
      The initial Loan Estimate must be delivered or placed in the mail no later than the end of the delivery
      window that starts on the application date.
    evidence_fields: [loan_files.application_date, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    temporal_basis:
      clock: frozen_time
      anchor_event: the application date
      anchor_source: loan_files.application_date
      relation: not_after
      duration_source: variants.le_delivery_business_days
      unit: business_days
      counting_rule: >-
        Count business days forward from the application_date, which is day zero; the issued_date may
        be any day up to and including the last business day of the window.
      boundary: inclusive
  - id: le_only_before_disclosure
    applies_to: [loan_le_issued]
    kind: state
    condition: >-
      An initial Loan Estimate is issued only while the loan file status is application_received.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    state_contract:
      field: loan_files.status
      allowed: [application_received]
- id: loan_intent_to_proceed
  subject: [loan_itp_received, loan_processing_started, loan_itp_lapsed]
  rule: >-
    The borrower may indicate intent to proceed in any way (e-sign portal acknowledgment, a signed form,
    or a verbal statement to the loan officer noted the same day); silence is never intent to proceed.
    An intent to proceed is recorded only while the loan file status is disclosed. Intent to proceed counts
    only if it is received no later than the end of the intent-to-proceed window that starts on the initial
    Loan Estimate's issued date. Count business days forward from the issued_date of the file's loan_le_issued
    record, which is day zero; an intent to proceed received on the last business day of the window still
    counts. A business day is Monday through Friday excluding the US federal public holidays observed
    by the Federal Reserve Banks; Saturdays, Sundays and those holidays are skipped when counting. A timely
    intent to proceed moves the file to processing and stamps intent_to_proceed_date with the date received.
    When the window has passed with no intent to proceed, Larkspur is no longer bound by the Loan Estimate
    and the application is treated as withdrawn; a borrower who comes back afterwards starts a new application
    and receives a new Loan Estimate.
  eligibility:
  - id: itp_within_window
    applies_to: [loan_itp_received]
    kind: time
    condition: >-
      Intent to proceed counts only if it is received no later than the end of the intent-to-proceed window
      that starts on the initial Loan Estimate's issued date.
    evidence_fields: [loan_disclosures.issued_date, loan_disclosures.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_disclosures.loan_file_id]
      action_bindings: {loan_disclosures.loan_file_id: loan_file_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the initial Loan Estimate's issued date
      anchor_source: loan_disclosures.issued_date
      relation: not_after
      duration_source: variants.itp_window_business_days
      unit: business_days
      counting_rule: >-
        Count business days forward from the issued_date of the file's loan_le_issued record, which is
        day zero; an intent to proceed received on the last business day of the window still counts.
      boundary: inclusive
  - id: itp_only_when_disclosed
    applies_to: [loan_itp_received]
    kind: state
    condition: An intent to proceed is recorded only while the loan file status is disclosed.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    state_contract:
      field: loan_files.status
      allowed: [disclosed]
- id: loan_changed_circumstance
  subject: [loan_le_revised, loan_terms_updated, loan_program_changed]
  rule: >-
    Charges disclosed on the Loan Estimate may be re-baselined only for a valid changed circumstance:
    a borrower-requested change, a rate lock after a floating Loan Estimate, a lock extension or relock
    the borrower requested, an appraised value different from the value on the application, a loan amount
    change, a program change, a third-party charge increase caused by new information specific to the
    borrower or property, or a settlement delayed more than 60 days past the date shown on the Loan Estimate
    for a new-construction purchase. A lock extension caused by a Larkspur delay, a pricing error or a
    fee Larkspur simply forgot is never a changed circumstance. A revised Loan Estimate may be issued
    only while no Closing Disclosure has been issued on the file and the loan file status is processing,
    underwriting, conditionally_approved, suspended or clear_to_close. A revised Loan Estimate is valid
    only if it is issued no later than the end of the redisclosure window that starts on the date the
    changed circumstance was documented. Count business days forward from the coc_documented_date, which
    is day zero; issuing on the last business day of the window is timely. A business day is Monday through
    Friday excluding the US federal public holidays observed by the Federal Reserve Banks; Saturdays,
    Sundays and those holidays are skipped when counting. The revised Loan Estimate must also be received
    by the borrower no later than revised_le_receipt_days_before_consummation specific business days before
    consummation, where a specific business day is every calendar day except Sundays and the US federal
    public holidays; when it cannot be, the change is disclosed on the Closing Disclosure instead. A timely
    revised Loan Estimate becomes the good-faith baseline for the charges the circumstance actually affected;
    an untimely one, or one issued without a valid reason, leaves the earlier Loan Estimate as the baseline.
    Updating loan terms or the program on the file records the new facts and does not by itself re-baseline
    any charge.
  eligibility:
  - id: coc_redisclosed_in_time
    applies_to: [loan_le_revised]
    kind: time
    condition: >-
      A revised Loan Estimate is valid only if it is issued no later than the end of the redisclosure
      window that starts on the date the changed circumstance was documented.
    evidence_fields: [loan_disclosures.coc_documented_date, loan_disclosures.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_disclosures.loan_file_id]
      action_bindings: {loan_disclosures.loan_file_id: loan_file_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the changed circumstance was documented
      anchor_source: loan_disclosures.coc_documented_date
      relation: not_after
      duration_source: variants.coc_redisclosure_business_days
      unit: business_days
      counting_rule: >-
        Count business days forward from the coc_documented_date, which is day zero; issuing on the last
        business day of the window is timely.
      boundary: inclusive
  - id: revised_le_before_cd
    applies_to: [loan_le_revised]
    kind: state
    condition: >-
      A revised Loan Estimate may be issued only while no Closing Disclosure has been issued on the file
      and the loan file status is processing, underwriting, conditionally_approved, suspended or clear_to_close.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    state_contract:
      field: loan_files.status
      allowed: [processing, underwriting, conditionally_approved, suspended, clear_to_close]
- id: loan_closing_disclosure_timing
  subject: [loan_cd_issued, loan_cd_corrected, loan_consummated]
  rule: >-
    The initial Closing Disclosure must reach the borrower before consummation. Consummation may take
    place only on or after the end of the waiting period that starts on the date the borrower received
    the Closing Disclosure. Count specific business days forward from the received_date of the latest
    Closing Disclosure that started a waiting period, which is day zero; consummation may occur on the
    last day of the count. Here a specific business day is every calendar day except Sundays and the US
    federal public holidays. Consummation may also take place only on or after the end of the seven-day
    period that starts on the initial Loan Estimate's issued date. Count specific business days forward
    from the issued_date of the loan_le_issued record, which is day zero; consummation may occur on the
    seventh such day. A corrected Closing Disclosure issued before consummation starts a new waiting period
    only when the APR rises by more than apr_tolerance_regular_pct (apr_tolerance_irregular_pct for an
    irregular transaction) over the APR last disclosed, when the loan program changes, or when a prepayment
    penalty is added; any other change is disclosed on a corrected Closing Disclosure given at or before
    consummation without a new wait. A decrease in APR never starts a new wait. When a new wait applies
    and the scheduled closing date falls inside it, the closing must be rescheduled.
  eligibility:
  - id: cd_waiting_period
    applies_to: [loan_consummated]
    kind: time
    condition: >-
      Consummation may take place only on or after the end of the waiting period that starts on the date
      the borrower received the Closing Disclosure.
    evidence_fields: [loan_disclosures.received_date, loan_disclosures.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_disclosures.loan_file_id]
      action_bindings: {loan_disclosures.loan_file_id: loan_file_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the borrower received the Closing Disclosure
      anchor_source: loan_disclosures.received_date
      relation: not_before
      duration_source: variants.cd_receipt_business_days_before_consummation
      unit: business_days
      counting_rule: >-
        Count specific business days forward from the received_date of the latest Closing Disclosure that
        started a waiting period, which is day zero; consummation may occur on the last day of the count.
      boundary: inclusive
  - id: le_seven_day_wait
    applies_to: [loan_consummated]
    kind: time
    condition: >-
      Consummation may also take place only on or after the end of the seven-day period that starts on
      the initial Loan Estimate's issued date.
    evidence_fields: [loan_disclosures.issued_date, loan_disclosures.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_disclosures.loan_file_id]
      action_bindings: {loan_disclosures.loan_file_id: loan_file_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the initial Loan Estimate's issued date
      anchor_source: loan_disclosures.issued_date
      relation: not_before
      duration_source: variants.le_to_consummation_waiting_business_days
      unit: business_days
      counting_rule: >-
        Count specific business days forward from the issued_date of the loan_le_issued record, which
        is day zero; consummation may occur on the seventh such day.
      boundary: inclusive
- id: loan_condition_management
  subject: [loan_condition_issued, loan_condition_cleared, loan_condition_waived, loan_submitted_to_underwriting,
    loan_conditionally_approved, loan_suspended, loan_resubmitted]
  rule: >-
    A processed file is submitted to underwriting and receives a decision within underwriting_turn_time_business_days.
    Conditions are issued, cleared or waived only while the loan file status is underwriting, conditionally_approved,
    suspended or clear_to_close. Each issued condition is due condition_response_calendar_days calendar
    days after its issued_date (the issued date is day zero). Documents received are reviewed within condition_review_turn_time_business_days;
    a condition is cleared only by a document that answers it and whose document_date is no more than
    credit_document_max_age_days old on the expected note date (the file's estimated_closing_date); an
    older document leaves the condition open and a fresh one is requested. A single deposit at or above
    large_deposit_threshold must be sourced with a large_deposit_explanation condition; gift funds need
    a gift_letter condition and are acceptable only where gift_funds_allowed is true. The verbal verification
    of employment condition is prior_to_funding and is cleared only by a verification dated within verbal_voe_business_days_before_note
    business days before the note date. A condition is waived only when the fact it tests no longer applies
    to the file or another document already on file satisfies it; a borrower's request alone never waives
    a condition. When any prior-to-documents condition is past its due date and unanswered (loan_msr_overdue_conditions
    above zero), the file is suspended and suspended_date is stamped. A suspended file is resubmitted
    when every overdue condition is answered, adding one to resubmission_count; after max_resubmissions_before_senior_review
    resubmissions the next decision belongs to a senior underwriter.
  eligibility:
  - id: conditions_in_underwriting
    applies_to: [loan_condition_issued, loan_condition_cleared, loan_condition_waived]
    kind: state
    condition: >-
      Conditions are issued, cleared or waived only while the loan file status is underwriting, conditionally_approved,
      suspended or clear_to_close.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    state_contract:
      field: loan_files.status
      allowed: [underwriting, conditionally_approved, suspended, clear_to_close]
  measures: [loan_msr_overdue_conditions]
- id: loan_clear_to_close
  subject: [loan_cleared_to_close, loan_ctc_rescinded]
  rule: >-
    A conditionally approved file is cleared to close only when no prior-to-documents condition remains
    open (loan_msr_open_ptd_conditions equals zero), the file's documents are within their age limits
    on the scheduled closing date, and every program limit still holds; prior-to-funding conditions may
    remain open at clear-to-close and are worked before funding. If a new prior-to-documents condition
    is issued after clear-to-close (for example a new credit inquiry or a changed appraisal), clear-to-close
    is rescinded and the file returns to conditionally approved until that condition is cleared or waived.
  eligibility: []
  measures: [loan_msr_open_ptd_conditions]
- id: loan_tolerance_cure
  subject: [loan_tolerance_cure_assessed, loan_tolerance_cure_paid]
  rule: >-
    At closing the charges on the final Closing Disclosure are compared with the good-faith baseline (the
    initial Loan Estimate, or the latest timely revised Loan Estimate whose changed circumstance affected
    the charge). In the zero-tolerance bucket the cure is the amount by which zero_tolerance_total on
    the Closing Disclosure exceeds the baseline zero_tolerance_total. In the 10 percent bucket the cure
    is the amount by which ten_percent_tolerance_total on the Closing Disclosure exceeds the baseline
    ten_percent_tolerance_total increased by ten_percent_tolerance_pct percent, rounded to the cent. A
    decrease in either bucket is never netted against an increase in the other, and charges with no tolerance
    limit (prepaid interest, insurance premiums, services the borrower shopped for outside the provider
    list) are never cured. A cure known before consummation is given as a lender credit on the Closing
    Disclosure (cure_method credit_at_closing); a violation found later is refunded with a corrected Closing
    Disclosure (cure_method post_closing_refund). A post-closing tolerance refund must be paid no later
    than the end of the cure window that starts on the consummation date. Count calendar days forward
    from the file's closed_date (the consummation date), which is day zero; a refund paid on the last
    day of the window is timely. Each payment names the assessed cure it pays and pays it in full.
  eligibility:
  - id: cure_within_sixty_days
    applies_to: [loan_tolerance_cure_paid]
    kind: time
    condition: >-
      A post-closing tolerance refund must be paid no later than the end of the cure window that starts
      on the consummation date.
    evidence_fields: [loan_files.closed_date, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    temporal_basis:
      clock: frozen_time
      anchor_event: the consummation date
      anchor_source: loan_files.closed_date
      relation: not_after
      duration_source: variants.cure_refund_calendar_days_after_consummation
      unit: calendar_days
      counting_rule: >-
        Count calendar days forward from the file's closed_date (the consummation date), which is day
        zero; a refund paid on the last day of the window is timely.
      boundary: inclusive
  params:
    per_tier:
      Larkspur FHA 30-Year Fixed: {ten_percent_tolerance_pct: =ten_percent_tolerance_pct}
      Larkspur VA 30-Year Fixed: {ten_percent_tolerance_pct: =ten_percent_tolerance_pct}
      Larkspur HomeReady 30-Year Fixed: {ten_percent_tolerance_pct: =ten_percent_tolerance_pct}
      Larkspur Conventional 30-Year Fixed: {ten_percent_tolerance_pct: =ten_percent_tolerance_pct}
      Larkspur Conventional 15-Year Fixed: {ten_percent_tolerance_pct: =ten_percent_tolerance_pct}
      Larkspur High-Balance Conforming 30-Year Fixed: {ten_percent_tolerance_pct: =ten_percent_tolerance_pct}
      Larkspur Jumbo 30-Year Fixed: {ten_percent_tolerance_pct: =ten_percent_tolerance_pct}
- id: loan_interested_party_contribution
  subject: [loan_application_taken, loan_terms_updated]
  rule: >-
    Seller, builder and real estate agent contributions toward the borrower's costs are interested party
    contributions and are capped. The measured contribution is seller_concession_amount plus agent_concession_amount.
    The cap is a percent of the lower of purchase price and appraised value (property_value): for an investment
    property it is ipc_cap_investment_pct; otherwise it is the cap_pct of the first band in ipc_cap_ladder
    whose max_ltv is at or above the file's base-loan-to-value. For the VA program, payment of the veteran's
    normal closing costs is outside the cap and the concession amounts recorded on the file are the concessions
    beyond normal closing costs. A contribution above the cap is not allowed: the contract must be amended
    and the recorded concession amounts reduced to the cap (the agent concession is reduced first, then
    the seller concession) before the file can be cleared to close. Larkspur's own lender credits are
    not interested party contributions.
  eligibility: []
  formula: {ipc_total: seller_concession_amount + agent_concession_amount}
- id: loan_upfront_program_fee
  subject: [loan_application_taken, loan_program_changed, loan_terms_updated]
  rule: >-
    Where the program carries an upfront_program_fee_pct (FHA upfront mortgage insurance premium, VA funding
    fee) the fee is financed: loan_amount equals base_loan_amount plus base_loan_amount times upfront_program_fee_pct
    percent, rounded to the cent. A VA borrower with funding_fee_exempt true pays no funding fee and loan_amount
    equals base_loan_amount. Programs whose upfront_program_fee_pct is 0.000 always carry loan_amount
    equal to base_loan_amount. Program limits are tested on the base loan amount, never on the financed
    total. Whenever base_loan_amount or the program changes, loan_amount is recomputed in the same update.
  eligibility: []
  formula: {loan_amount: 'round(base_loan_amount * (1 + upfront_program_fee_pct / 100), 2)'}
- id: loan_escrow_waiver
  subject: [loan_terms_updated]
  rule: >-
    A borrower may elect to waive the tax and insurance escrow account only where escrow_waiver_allowed
    is true for the program and the base-loan-to-value is at or below escrow_waiver_max_ltv_pct. An escrow
    waiver may be recorded only when the file is not a higher-priced mortgage loan. A higher-priced mortgage
    loan must keep escrow for at least hpml_escrow_required_months months, so the election is refused.
    An accepted waiver is priced at closing at escrow_waiver_fee_pct of the loan amount, disclosed in
    the zero-tolerance bucket as a borrower-requested change.
  eligibility:
  - id: no_hpml_waiver
    applies_to: [loan_terms_updated]
    kind: state
    condition: An escrow waiver may be recorded only when the file is not a higher-priced mortgage loan.
    evidence_fields: [loan_files.hpml_flag, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    state_contract:
      field: loan_files.hpml_flag
      allowed: [false]
  params:
    per_tier:
      Larkspur FHA 30-Year Fixed: {escrow_waiver_fee_pct: =escrow_waiver_fee_pct}
      Larkspur VA 30-Year Fixed: {escrow_waiver_fee_pct: =escrow_waiver_fee_pct}
      Larkspur HomeReady 30-Year Fixed: {escrow_waiver_fee_pct: =escrow_waiver_fee_pct}
      Larkspur Conventional 30-Year Fixed: {escrow_waiver_fee_pct: =escrow_waiver_fee_pct}
      Larkspur Conventional 15-Year Fixed: {escrow_waiver_fee_pct: =escrow_waiver_fee_pct}
      Larkspur High-Balance Conforming 30-Year Fixed: {escrow_waiver_fee_pct: =escrow_waiver_fee_pct}
      Larkspur Jumbo 30-Year Fixed: {escrow_waiver_fee_pct: =escrow_waiver_fee_pct}
- id: loan_file_closure
  subject: [loan_withdrawn, loan_denied, loan_closed_incomplete, loan_itp_lapsed, loan_rescinded]
  rule: >-
    Only the borrower can withdraw an application; a real estate agent, seller or co-signer cannot withdraw
    it for them. A denial is an underwriting decision recorded by Larkspur and is followed by an adverse
    action notice. A suspended file is closed for incompleteness only after the suspense period that started
    on its suspended date has run out. Count calendar days forward from the file's suspended_date, which
    is day zero; the file may be closed on the day after the last day of the period. Before closing the
    file Larkspur sends a notice of incompleteness giving incompleteness_notice_response_days days to
    complete it. Every terminal status stamps closed_date with the date it took effect (a rescission keeps
    the consummation date already stamped); withdrawal, denial, intent-to-proceed lapse and closure for
    incompleteness cancel any open rate lock on the file and forfeit any closing cost credit not yet applied.
    A consummated refinance is rescinded only by the borrower, within the rescission period recorded on
    the closing. A file in rescinded, withdrawn, denied or closed_incomplete status is never reopened;
    the borrower starts a new application.
  eligibility:
  - id: suspense_expired
    applies_to: [loan_closed_incomplete]
    kind: time
    condition: >-
      A suspended file is closed for incompleteness only after the suspense period that started on its
      suspended date has run out.
    evidence_fields: [loan_files.suspended_date, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    temporal_basis:
      clock: frozen_time
      anchor_event: its suspended date
      anchor_source: loan_files.suspended_date
      relation: not_before
      duration_source: variants.suspense_expiration_calendar_days
      unit: calendar_days
      counting_rule: >-
        Count calendar days forward from the file's suspended_date, which is day zero; the file may be
        closed on the day after the last day of the period.
      boundary: exclusive
extended_policies:
- id: loan_ext_credit_report_repull_fee
  base_policy_refs:
  - loan_agg_shared_credit_report
  overwrite:
  - base_policy: loan_agg_shared_credit_report
    superseded_clause: >-
      Outside the window (or when the customer has no earlier charge) a new pull is made and the fee booked is credit_report_fee_per_borrower
      of the file's program times the number of borrowers pulled.
    replaced_by: >-
      For a credit report pulled again on an existing loan file at the borrower's authorization, and only for such a repull, the charge
      is worked out in five parts: the per-borrower price, the report bundle, the delivery fee, the credit supplement and the borrower's
      delay share; every other pull made outside the window or for a customer with no earlier charge, including the first pull on a
      new loan file, is still charged credit_report_fee_per_borrower of the file's program times the number of borrowers pulled.
  trigger: on_request
  subject:
  - loan_credit_report_fee_charged
  computes: amount
  target_tool: authorize_credit_report_repull_408eaf54
  params:
    upgrade_price_per_borrower: 61.8
    returning_price_per_borrower: 78.4
    upgrade_window_months: 6
    returning_window_months: 12
    joint_report_multiplier: 1.4
    rush_days: 7
    expedite_days: 21
    rush_fee: 25.0
    expedite_fee: 10.0
    supplement_fee_single: 25.0
    supplement_fee_multiple: 45.0
    shared_delay_share: 0.5
  rule: >-
    A credit report that has to be pulled again on a loan file is pulled only on the borrower's own authorization, and the borrower
    pays the charge for it; the charge is booked as one credit report fee charge on the file, naming as borrowers pulled every borrower
    currently on the file. For a credit report pulled again on an existing loan file at the borrower's authorization, and only for such
    a repull, the charge is worked out in five parts: the per-borrower price, the report bundle, the delivery fee, the credit supplement
    and the borrower's delay share; every other pull made outside the window or for a customer with no earlier charge, including the
    first pull on a new loan file, is still charged credit_report_fee_per_borrower of the file's program times the number of borrowers
    pulled. The standard repull charge is the program's credit_report_fee_per_borrower times the number of borrowers on the file, with
    no delivery fee, no supplement and with the borrower paying the whole of it. Per-borrower price of the repull: where the file's
    fee ledger carries a credit report fee charge booked less than upgrade_window_months whole months before the pull date, the bureaus
    upgrade that existing Larkspur tri-merge and the per-borrower price is upgrade_price_per_borrower; where the file carries no such
    charge but carries one booked less than returning_window_months whole months before the pull date, the per-borrower price is returning_price_per_borrower;
    where the file carries no credit report fee charge booked less than returning_window_months whole months before the pull date, the
    per-borrower price is the program's credit_report_fee_per_borrower. Report bundle of the repull: where one earlier credit report
    fee charge on the file covered two or more borrowers on a single pull and the file now has exactly two borrowers, the two are pulled
    again on one joint report whose cost is the per-borrower price times joint_report_multiplier; where such a joint pull exists and
    the file now has three or more borrowers, the first two are pulled on one joint report and every further borrower individually,
    so the report cost is the per-borrower price times joint_report_multiplier plus the per-borrower price for each borrower beyond
    two; where no earlier charge on the file covered two or more borrowers, or the file now has a single borrower, the report cost is
    the per-borrower price times the number of borrowers on the file. Delivery of the repull is timed to the scheduled closing date
    on the file: where the scheduled closing date is rush_days or fewer calendar days after the pull date, rush_fee is added; where
    it is more than rush_days but no more than expedite_days calendar days after the pull date, expedite_fee is added; where it is more
    than expedite_days calendar days after the pull date, or the file has no scheduled closing date on or after the pull date, no delivery
    fee is added. Credit supplement of the repull: each credit inquiry explanation condition issued on the file stands for a new account
    the bureaus must document, so where two or more credit inquiry explanation conditions have been issued on the file the repull carries
    a supplement of supplement_fee_multiple; where exactly one has been issued it carries supplement_fee_single; where none has been
    issued it carries no supplement. Delay share of the repull follows who bore the extension days booked on the customer's rate lock
    extensions, each extension counted by the days its own entry records even where Larkspur later waived its cost: where the extension
    days Larkspur bore are more than zero and at least the extension days the borrower bore, the borrower's share is zero and the charge
    is booked at 0.00; where the days Larkspur bore are more than zero but fewer than the days the borrower bore, the borrower's share
    is shared_delay_share; where Larkspur bore no extension days, the borrower's share is the whole charge. The delivery fee and the
    credit supplement are added to the report cost first, and the borrower's share is applied once to that sum; the result is rounded
    to the cent only at the end.
  prerequisite: []
  cross_category:
  - category: lock
    as: history
    reads:
    - lock_pricing_events.extension_days
    - lock_pricing_events.larkspur_borne_days
    note: >-
      the delay-share factor compares the extension days Larkspur bore with the days the borrower bore on the customer's lock extensions.
  compute:
  - recent_pulls: >-
      COUNT('loan_fee_ledger', within_months=K('upgrade_window_months'), date_field='entry_date', event_type='loan_credit_report_fee_charged')
  - year_pulls: >-
      COUNT('loan_fee_ledger', within_months=K('returning_window_months'), date_field='entry_date', event_type='loan_credit_report_fee_charged')
  - unit_price: >-
      K('upgrade_price_per_borrower') if recent_pulls >= 1 else (K('returning_price_per_borrower') if year_pulls >= 1 else P('credit_report_fee_per_borrower'))
  - widest_pull: MAX('loan_fee_ledger', 'borrower_count', event_type='loan_credit_report_fee_charged')
  - report_cost: >-
      unit_price * K('joint_report_multiplier') if (widest_pull >= 2 and F('borrower_count') == 2) else (unit_price * (K('joint_report_multiplier')
      + F('borrower_count') - 2) if (widest_pull >= 2 and F('borrower_count') >= 3) else unit_price * F('borrower_count'))
  - days_to_closing: DAYS(NOW, F('estimated_closing_date')) if F('estimated_closing_date') else -1
  - delivery_fee: >-
      0.0 if days_to_closing < 0 else (K('rush_fee') if days_to_closing <= K('rush_days') else (K('expedite_fee') if days_to_closing
      <= K('expedite_days') else 0.0))
  - inquiry_conditions: >-
      COUNT('loan_conditions', event_type='loan_condition_issued', condition_code='credit_inquiry_explanation')
  - supplement_fee: >-
      K('supplement_fee_multiple') if inquiry_conditions >= 2 else (K('supplement_fee_single') if inquiry_conditions == 1 else 0.0)
  - larkspur_days: XSUM('lock', 'lock_pricing_events', 'larkspur_borne_days', event_type='lock_extension_booked')
  - borrower_days: >-
      XSUM('lock', 'lock_pricing_events', 'extension_days', event_type='lock_extension_booked') - larkspur_days
  - borrower_share: >-
      0.0 if (larkspur_days > 0 and larkspur_days >= borrower_days) else (K('shared_delay_share') if (larkspur_days > 0 and larkspur_days
      < borrower_days) else 1.0)
  - result: RND((report_cost + delivery_fee + supplement_fee) * borrower_share, 2)
  compute_basis:
    recent_pulls: >-
      where the file's fee ledger carries a credit report fee charge booked less than upgrade_window_months whole months before the
      pull date
    year_pulls: but carries one booked less than returning_window_months whole months before the pull date
    unit_price: >-
      where the file's fee ledger carries a credit report fee charge booked less than upgrade_window_months whole months before the
      pull date, the bureaus upgrade that existing Larkspur tri-merge and the per-borrower price is upgrade_price_per_borrower; where
      the file carries no such charge but carries one booked less than returning_window_months whole months before the pull date, the
      per-borrower price is returning_price_per_borrower; where the file carries no credit report fee charge booked less than returning_window_months
      whole months before the pull date, the per-borrower price is the program's credit_report_fee_per_borrower.
    widest_pull: >-
      where one earlier credit report fee charge on the file covered two or more borrowers on a single pull
    report_cost: >-
      where one earlier credit report fee charge on the file covered two or more borrowers on a single pull and the file now has exactly
      two borrowers, the two are pulled again on one joint report whose cost is the per-borrower price times joint_report_multiplier;
      where such a joint pull exists and the file now has three or more borrowers, the first two are pulled on one joint report and
      every further borrower individually, so the report cost is the per-borrower price times joint_report_multiplier plus the per-borrower
      price for each borrower beyond two; where no earlier charge on the file covered two or more borrowers, or the file now has a single
      borrower, the report cost is the per-borrower price times the number of borrowers on the file.
    days_to_closing: Delivery of the repull is timed to the scheduled closing date on the file
    delivery_fee: >-
      where the scheduled closing date is rush_days or fewer calendar days after the pull date, rush_fee is added; where it is more
      than rush_days but no more than expedite_days calendar days after the pull date, expedite_fee is added; where it is more than
      expedite_days calendar days after the pull date, or the file has no scheduled closing date on or after the pull date, no delivery
      fee is added.
    inquiry_conditions: >-
      each credit inquiry explanation condition issued on the file stands for a new account the bureaus must document
    supplement_fee: >-
      where two or more credit inquiry explanation conditions have been issued on the file the repull carries a supplement of supplement_fee_multiple;
      where exactly one has been issued it carries supplement_fee_single; where none has been issued it carries no supplement.
    larkspur_days: >-
      Delay share of the repull follows who bore the extension days booked on the customer's rate lock extensions
    borrower_days: the extension days the borrower bore
    borrower_share: >-
      where the extension days Larkspur bore are more than zero and at least the extension days the borrower bore, the borrower's share
      is zero and the charge is booked at 0.00; where the days Larkspur bore are more than zero but fewer than the days the borrower
      bore, the borrower's share is shared_delay_share; where Larkspur bore no extension days, the borrower's share is the whole charge.
    result: >-
      The delivery fee and the credit supplement are added to the report cost first, and the borrower's share is applied once to that
      sum; the result is rounded to the cent only at the end.
  factors:
  - id: repull_unit_price
    effect: parameter
    decides: unit_price
    bindings:
    - recent_pulls
    - year_pulls
    - unit_price
    ladder:
    - when: >-
        the file's fee ledger carries a credit report fee charge booked less than upgrade_window_months whole months before the pull
        date
      value: K('upgrade_price_per_borrower')
    - when: no such charge, but one booked less than returning_window_months whole months before the pull date
      value: K('returning_price_per_borrower')
    - when: otherwise (no credit report fee charge on the file in the last returning_window_months months)
      value: P('credit_report_fee_per_borrower')
    baseline:
      unit_price: P('credit_report_fee_per_borrower')
    evidence:
    - history
    cross_difficulty: null
  - id: joint_bundle
    effect: method
    decides: report_cost
    bindings:
    - widest_pull
    - report_cost
    ladder:
    - when: >-
        an earlier charge on the file covered two or more borrowers on one pull and the file now has exactly two borrowers
      method: 'one joint report: the per-borrower price times joint_report_multiplier'
    - when: such a joint pull exists and the file now has three or more borrowers
      method: >-
        a joint report for the first two plus individual reports: the per-borrower price times joint_report_multiplier plus the per-borrower
        price for each borrower beyond two
    - when: >-
        otherwise (no earlier charge on the file covered two or more borrowers, or the file now has a single borrower)
      method: 'individual reports: the per-borrower price times the number of borrowers on the file'
    baseline:
      report_cost: unit_price * F('borrower_count')
    evidence:
    - history
    cross_difficulty: null
  - id: closing_delivery_speed
    effect: parameter
    decides: delivery_fee
    bindings:
    - days_to_closing
    - delivery_fee
    ladder:
    - when: the scheduled closing date is rush_days or fewer calendar days after the pull date
      value: K('rush_fee')
    - when: >-
        the scheduled closing date is more than rush_days but no more than expedite_days calendar days after the pull date
      value: K('expedite_fee')
    - when: >-
        otherwise (more than expedite_days calendar days, or no scheduled closing date on or after the pull date)
      value: '0.0'
    baseline:
      delivery_fee: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: inquiry_supplement
    effect: parameter
    decides: supplement_fee
    bindings:
    - inquiry_conditions
    - supplement_fee
    ladder:
    - when: two or more credit inquiry explanation conditions have been issued on the file
      value: K('supplement_fee_multiple')
    - when: exactly one credit inquiry explanation condition has been issued on the file
      value: K('supplement_fee_single')
    - when: otherwise (none issued)
      value: '0.0'
    baseline:
      supplement_fee: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: delay_bearer_share
    effect: parameter
    decides: borrower_share
    bindings:
    - larkspur_days
    - borrower_days
    - borrower_share
    ladder:
    - when: >-
        Larkspur bore more than zero extension days on the customer's lock extensions and at least as many as the borrower bore
      value: '0.0'
    - when: Larkspur bore more than zero extension days but fewer than the borrower bore
      value: K('shared_delay_share')
    - when: otherwise (Larkspur bore no extension days)
      value: '1.0'
    baseline:
      borrower_share: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: lock
  baseline:
    rule: >-
      The standard repull charge is the program's credit_report_fee_per_borrower times the number of borrowers on the file, with no
      delivery fee, no supplement and with the borrower paying the whole of it.
    params:
    - credit_report_fee_per_borrower
  inputs:
    history:
    - table: loan_fee_ledger
      aggregate: count
      field: entry_date
      within_months: 12
      filters:
        event_type: loan_credit_report_fee_charged
    - table: loan_fee_ledger
      aggregate: max
      field: borrower_count
      filters:
        event_type: loan_credit_report_fee_charged
    - table: loan_conditions
      aggregate: count
      field: condition_code
      filters:
        event_type: loan_condition_issued
        condition_code: credit_inquiry_explanation
    - category: lock
      table: lock_pricing_events
      aggregate: sum
      field: larkspur_borne_days
      filters:
        event_type: lock_extension_booked
    - category: lock
      table: lock_pricing_events
      aggregate: sum
      field: extension_days
      filters:
        event_type: lock_extension_booked
    cross_category:
    - lock
- id: loan_ext_corrected_cd_nonrecurring_costs
  base_policy_refs:
  - loan_closing_disclosure_timing
  overwrite: []
  trigger: on_request
  subject:
  - loan_cd_corrected
  computes: nonrecurring_closing_costs
  target_tool: issue_corrected_closing_disclosure_de3eb1f4
  params:
    recent_charge_months: 1
    title_new_commitment_days: 180
    title_datedown_days: 90
    title_rate_per_thousand: 1.1
    title_datedown_fee: 75.0
    voe_full_days: 30
    voe_update_days: 10
    voe_full_fee: 62.5
    voe_update_fee: 24.0
  rule: >-
    When the closing date of a file that already has a Closing Disclosure moves before consummation, Larkspur issues a corrected Closing
    Disclosure that restates the borrower-paid nonrecurring closing costs for the scheduled closing date. The corrected Closing Disclosure
    carries the next disclosure sequence after the latest Closing Disclosure on the file, the changed circumstance that moved the closing
    (borrower_requested_change when the borrower asked for the new date) and the date that circumstance was documented. The standard
    corrected figure is the nonrecurring closing costs shown on the latest Closing Disclosure issued on the file (the one with the highest
    disclosure sequence), carried forward (0.00 where the file carries no Closing Disclosure), plus the credit report fee charges booked
    on the file less than recent_charge_months whole months before the issue date at their booked amount. Appraisal update line of the
    corrected figure, measured in calendar days from the inspection date of the file's primary appraisal order (order reason standard_order,
    transferred_in or new_order_after_expiration) in delivered status to the scheduled closing date: a report older than its report
    type's validity_days and also older than its max_age_with_update_days (a report type that allows no update carries a max_age_with_update_days
    below its validity_days) needs a new appraisal and adds that report type's base_fee; a report older than its report type's validity_days
    but no older than max_age_with_update_days needs an update of the appraisal and adds that report type's reinspection_fee; a report
    no older than validity_days, or a file with no primary appraisal order in delivered status or no scheduled closing date, adds nothing
    for the appraisal. Title line of the corrected figure, measured in calendar days from the most recent document date among the cleared
    title commitment conditions to the scheduled closing date: a commitment more than title_new_commitment_days days old must be replaced
    by a new commitment, priced at title_rate_per_thousand for every thousand dollars of the base loan amount and rounded to the cent;
    a commitment more than title_datedown_days but no more than title_new_commitment_days days old is brought down by a date-down endorsement
    at the flat title_datedown_fee; a commitment no more than title_datedown_days days old, or a file with no cleared title commitment
    condition or no scheduled closing date, adds nothing. Employment re-verification line of the corrected figure, measured in calendar
    days from the most recent resolved date among the cleared verbal verification of employment conditions to the scheduled closing
    date: a verification more than voe_full_days days old adds voe_full_fee for each borrower on the file; one more than voe_update_days
    but no more than voe_full_days days old adds voe_update_fee for each borrower on the file; one no more than voe_update_days days
    old, or a file with no cleared verbal verification of employment condition yet or no scheduled closing date, adds nothing. Closing
    service line of the corrected figure, read from the file's closing in scheduled status: where that closing was opened on a date
    later than the issue date of the latest Closing Disclosure, is a Larkspur Mobile Notary Closing and its scheduled closing date falls
    on a Saturday or Sunday, the closing method's closing_method_fee and its after_hours_signing_fee are added; where it was opened
    on a date later than the issue date of the latest Closing Disclosure and is a Larkspur Mobile Notary Closing signing on a weekday,
    or a Larkspur Remote Online Notarization Closing signing on any day, only the closing method's closing_method_fee is added; where
    it was opened on or before the issue date of the latest Closing Disclosure, or is of any other method, or the file has no closing
    in scheduled status, or the file carries no Closing Disclosure, or a Mobile Notary Closing has no scheduled closing date, nothing
    is added for the closing service. Each line is added once, in dollars, to the carried-forward figure, and the total is rounded to
    the cent. The nonrecurring closing costs on a corrected Closing Disclosure are fixed only after the file's fee ledger carries a
    credit report fee charge whose report is still within the credit report validity window on the scheduled closing date.
  prerequisite:
  - problem: loan_ext_credit_report_repull_fee
    kind: value_input
    gate: credit_report_line
    form: state
    policy_source: >-
      The nonrecurring closing costs on a corrected Closing Disclosure are fixed only after the file's fee ledger carries a credit report
      fee charge whose report is still within the credit report validity window on the scheduled closing date.
    condition: >-
      the latest loan_credit_report_fee_charged entry on the loan file has an entry_date no more than the program's credit_report_max_age_days
      calendar days before the file's estimated_closing_date
    resolved_by: authorize_credit_report_repull_408eaf54
    effect: >-
      once the repull charge is booked less than a month before the issue date, the credit report line adds its booked amount
  cross_category:
  - category: appraisal
    as: branch
    reads:
    - base_fee
    - inspection_date
    - max_age_with_update_days
    - reinspection_fee
    - status
    - validity_days
    note: >-
      the appraisal update line is decided by how old the file's appraisal report (from its inspection date) will be on the scheduled
      closing date.
  - category: funding
    as: branch
    reads:
    - status
    - opened_date
    - variant_name
    - scheduled_closing_date
    - closing_method_fee
    - after_hours_signing_fee
    note: >-
      the closing service line is decided by the method, opening date and signing day of the closing now scheduled on the file.
  compute:
  - latest_cd_sequence: MAX('loan_disclosures', 'disclosure_sequence', disclosure_form='closing_disclosure')
  - prior_figure: >-
      (LATEST('loan_disclosures', 'nonrecurring_closing_costs', date_field='issued_date', disclosure_form='closing_disclosure', disclosure_sequence=int(latest_cd_sequence))
      or 0.0)
  - credit_report_line: >-
      SUM('loan_fee_ledger', 'amount', within_months=K('recent_charge_months'), date_field='entry_date', event_type='loan_credit_report_fee_charged')
  - delivered_order: >-
      CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='delivered') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='delivered') or CFIELD('appraisal', 'appraisal_order_id',
      loan_file_id=HID, order_reason='new_order_after_expiration', status='delivered')
  - appraisal_age: >-
      DAYS(CFIELD('appraisal', 'inspection_date', appraisal_order_id=delivered_order), F('estimated_closing_date')) if (delivered_order
      and F('estimated_closing_date')) else -1
  - appraisal_update_line: >-
      CPARAM('appraisal', 'base_fee', appraisal_order_id=delivered_order) if (appraisal_age >= 0 and appraisal_age > CPARAM('appraisal',
      'validity_days', appraisal_order_id=delivered_order) and appraisal_age > CPARAM('appraisal', 'max_age_with_update_days', appraisal_order_id=delivered_order))
      else (CPARAM('appraisal', 'reinspection_fee', appraisal_order_id=delivered_order) if (appraisal_age >= 0 and appraisal_age > CPARAM('appraisal',
      'validity_days', appraisal_order_id=delivered_order)) else 0.0)
  - title_document_date: >-
      LATEST('loan_conditions', 'document_date', date_field='document_date', condition_code='title_commitment', event_type='loan_condition_cleared')
  - title_age: >-
      DAYS(title_document_date, F('estimated_closing_date')) if (title_document_date and F('estimated_closing_date')) else -1
  - title_line: >-
      RND(K('title_rate_per_thousand') * F('base_loan_amount') / 1000, 2) if title_age > K('title_new_commitment_days') else (K('title_datedown_fee')
      if title_age > K('title_datedown_days') else 0.0)
  - voe_resolved_date: >-
      LATEST('loan_conditions', 'resolved_date', date_field='resolved_date', condition_code='verbal_verification_of_employment', event_type='loan_condition_cleared')
  - voe_age: >-
      DAYS(voe_resolved_date, F('estimated_closing_date')) if (voe_resolved_date and F('estimated_closing_date')) else -1
  - voe_line: >-
      K('voe_full_fee') * F('borrower_count') if voe_age > K('voe_full_days') else (K('voe_update_fee') * F('borrower_count') if voe_age
      > K('voe_update_days') else 0.0)
  - service_method: CFIELD('funding', 'variant_name', loan_file_id=HID, status='scheduled')
  - service_opened_after_cd: >-
      (DAYS(LATEST('loan_disclosures', 'issued_date', date_field='issued_date', disclosure_form='closing_disclosure', disclosure_sequence=int(latest_cd_sequence)),
      CFIELD('funding', 'opened_date', loan_file_id=HID, status='scheduled')) > 0) if (service_method and LATEST('loan_disclosures',
      'issued_date', date_field='issued_date', disclosure_form='closing_disclosure', disclosure_sequence=int(latest_cd_sequence))) else
      False
  - signing_weekday: >-
      (DAYS('2026-01-03', CFIELD('funding', 'scheduled_closing_date', loan_file_id=HID, status='scheduled')) % 7) if (service_method
      and CFIELD('funding', 'scheduled_closing_date', loan_file_id=HID, status='scheduled')) else -1
  - closing_service_line: >-
      (CPARAM('funding', 'closing_method_fee', loan_file_id=HID, status='scheduled') + CPARAM('funding', 'after_hours_signing_fee',
      loan_file_id=HID, status='scheduled')) if (service_opened_after_cd and service_method == 'Larkspur Mobile Notary Closing' and
      (signing_weekday == 0 or signing_weekday == 1)) else (CPARAM('funding', 'closing_method_fee', loan_file_id=HID, status='scheduled')
      if (service_opened_after_cd and ((service_method == 'Larkspur Mobile Notary Closing' and signing_weekday >= 2) or service_method
      == 'Larkspur Remote Online Notarization Closing')) else 0.0)
  - result: >-
      RND(prior_figure + credit_report_line + appraisal_update_line + title_line + voe_line + closing_service_line, 2)
  compute_basis:
    prior_figure: >-
      The standard corrected figure is the nonrecurring closing costs shown on the latest Closing Disclosure issued on the file (the
      one with the highest disclosure sequence), carried forward
    credit_report_line: >-
      plus the credit report fee charges booked on the file less than recent_charge_months whole months before the issue date at their
      booked amount.
    appraisal_age: >-
      measured in calendar days from the inspection date of the file's primary appraisal order (order reason standard_order, transferred_in
      or new_order_after_expiration) in delivered status to the scheduled closing date
    appraisal_update_line: >-
      a report older than its report type's validity_days and also older than its max_age_with_update_days (a report type that allows
      no update carries a max_age_with_update_days below its validity_days) needs a new appraisal and adds that report type's base_fee;
      a report older than its report type's validity_days but no older than max_age_with_update_days needs an update of the appraisal
      and adds that report type's reinspection_fee; a report no older than validity_days, or a file with no primary appraisal order
      in delivered status or no scheduled closing date, adds nothing for the appraisal.
    title_age: >-
      measured in calendar days from the most recent document date among the cleared title commitment conditions to the scheduled closing
      date
    title_line: >-
      a commitment more than title_new_commitment_days days old must be replaced by a new commitment, priced at title_rate_per_thousand
      for every thousand dollars of the base loan amount and rounded to the cent; a commitment more than title_datedown_days but no
      more than title_new_commitment_days days old is brought down by a date-down endorsement at the flat title_datedown_fee; a commitment
      no more than title_datedown_days days old, or a file with no cleared title commitment condition or no scheduled closing date,
      adds nothing.
    voe_age: >-
      measured in calendar days from the most recent resolved date among the cleared verbal verification of employment conditions to
      the scheduled closing date
    voe_line: >-
      a verification more than voe_full_days days old adds voe_full_fee for each borrower on the file; one more than voe_update_days
      but no more than voe_full_days days old adds voe_update_fee for each borrower on the file; one no more than voe_update_days days
      old, or a file with no cleared verbal verification of employment condition yet or no scheduled closing date, adds nothing.
    service_method: read from the file's closing in scheduled status
    service_opened_after_cd: opened on a date later than the issue date of the latest Closing Disclosure
    signing_weekday: its scheduled closing date falls on a Saturday or Sunday
    closing_service_line: >-
      where that closing was opened on a date later than the issue date of the latest Closing Disclosure, is a Larkspur Mobile Notary
      Closing and its scheduled closing date falls on a Saturday or Sunday, the closing method's closing_method_fee and its after_hours_signing_fee
      are added; where it was opened on a date later than the issue date of the latest Closing Disclosure and is a Larkspur Mobile Notary
      Closing signing on a weekday, or a Larkspur Remote Online Notarization Closing signing on any day, only the closing method's closing_method_fee
      is added; where it was opened on or before the issue date of the latest Closing Disclosure, or is of any other method, or the
      file has no closing in scheduled status, or the file carries no Closing Disclosure, or a Mobile Notary Closing has no scheduled
      closing date, nothing is added for the closing service.
    result: >-
      Each line is added once, in dollars, to the carried-forward figure, and the total is rounded to the cent.
    latest_cd_sequence: the latest Closing Disclosure issued on the file (the one with the highest disclosure sequence)
    delivered_order: >-
      the file's primary appraisal order (order reason standard_order, transferred_in or new_order_after_expiration) in delivered status
    title_document_date: the most recent document date among the cleared title commitment conditions
    voe_resolved_date: the most recent resolved date among the cleared verbal verification of employment conditions
  factors:
  - id: appraisal_recertification
    effect: parameter
    decides: appraisal_update_line
    bindings:
    - delivered_order
    - appraisal_age
    - appraisal_update_line
    ladder:
    - when: >-
        the appraisal will be older than its report type's validity_days and also older than its max_age_with_update_days (from inspection
        date) on the scheduled closing date
      value: CPARAM('appraisal', 'base_fee')
    - when: it will be older than validity_days but no older than max_age_with_update_days
      value: CPARAM('appraisal', 'reinspection_fee')
    - when: >-
        otherwise (no older than validity_days, no primary appraisal order in delivered status, or no scheduled closing date)
      value: '0.0'
    baseline:
      appraisal_update_line: '0.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: appraisal
  - id: title_bringdown
    effect: method
    decides: title_line
    bindings:
    - title_document_date
    - title_age
    - title_line
    ladder:
    - when: >-
        the most recent document date among the cleared title commitment conditions is more than title_new_commitment_days days before
        the scheduled closing date
      method: a new commitment priced at title_rate_per_thousand per thousand dollars of the base loan amount
    - when: it is more than title_datedown_days but no more than title_new_commitment_days days old
      method: a date-down endorsement at the flat title_datedown_fee
    - when: >-
        otherwise (no more than title_datedown_days days old, no cleared title commitment condition, or no scheduled closing date)
      method: nothing added
    baseline:
      title_line: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: employment_reverification
    effect: parameter
    decides: voe_line
    bindings:
    - voe_resolved_date
    - voe_age
    - voe_line
    ladder:
    - when: >-
        the most recent resolved date among the cleared verbal verification of employment conditions is more than voe_full_days days
        before the scheduled closing date
      value: K('voe_full_fee') for each borrower on the file
    - when: it is more than voe_update_days but no more than voe_full_days days old
      value: K('voe_update_fee') for each borrower on the file
    - when: >-
        otherwise (no more than voe_update_days days old, no cleared verification yet, or no scheduled closing date)
      value: '0.0'
    baseline:
      voe_line: '0.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: closing_service_line
    effect: method
    decides: closing_service_line
    bindings:
    - service_method
    - service_opened_after_cd
    - signing_weekday
    - closing_service_line
    ladder:
    - when: >-
        the closing in scheduled status was opened on a date later than the latest Closing Disclosure's issue date, is a Mobile Notary
        Closing and signs on a Saturday or Sunday
      method: add the method's closing_method_fee plus its after_hours_signing_fee
    - when: >-
        it was opened on a date later than the latest Closing Disclosure's issue date and is a Mobile Notary Closing signing on a weekday,
        or a Remote Online Notarization Closing signing on any day
      method: add the method's closing_method_fee only
    - when: >-
        otherwise (opened on or before the latest Closing Disclosure's issue date, another method, no closing in scheduled status, no
        Closing Disclosure, or a Mobile Notary closing without a scheduled date)
      method: add nothing
    baseline:
      closing_service_line: '0.0'
    evidence:
    - cross_category
    - date
    cross_difficulty: funding
  baseline:
    rule: >-
      The standard corrected figure is the nonrecurring closing costs shown on the latest Closing Disclosure issued on the file (the
      one with the highest disclosure sequence), carried forward (0.00 where the file carries no Closing Disclosure), plus the credit
      report fee charges booked on the file less than recent_charge_months whole months before the issue date at their booked amount.
    params:
    - recent_charge_months
  inputs:
    history:
    - table: loan_disclosures
      aggregate: latest
      field: nonrecurring_closing_costs
      filters:
        disclosure_form: closing_disclosure
    - table: loan_fee_ledger
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: loan_credit_report_fee_charged
    - table: loan_conditions
      aggregate: latest
      field: document_date
      filters:
        condition_code: title_commitment
        event_type: loan_condition_cleared
    - table: loan_conditions
      aggregate: latest
      field: resolved_date
      filters:
        condition_code: verbal_verification_of_employment
        event_type: loan_condition_cleared
    cross_category:
    - appraisal
    - funding
- id: loan_ext_application_fee_due
  base_policy_refs:
  - loan_evt_application_fee
  overwrite:
  - base_policy: loan_evt_application_fee
    superseded_clause: >-
      The amount is application_fee of the program the file is in at the moment of collection; where that value is 0.00 no fee record
      is booked.
    replaced_by: >-
      The application fee due is worked out at the moment of collection from the program's application_fee in five parts: the pre-approval
      rate, the Hometown Heroes discount, the e-disclosure discount, the returning-borrower discount and the credit report offset; where
      the program the file is in charges no application fee, no fee record is booked, and where a program that charges one works out
      an amount due of 0.00, the collection is booked at 0.00 so that the file shows the fee settled.
  trigger: on_request
  subject:
  - loan_application_fee_collected
  computes: amount
  target_tool: pay_application_fee_6c3f9eab
  params:
    underwritten_level_rate: 0.5
    verified_level_rate: 0.75
    first_responder_discount: 100.0
    other_heroes_discount: 50.0
    full_esign_discount: 40.0
    partial_esign_discount: 20.0
    recent_returning_discount: 100.0
    earlier_returning_discount: 50.0
    returning_window_months: 36
    offset_window_months: 6
  rule: >-
    The application fee is paid by the borrower personally, by card or bank debit, while the file is in processing, underwriting, conditionally
    approved, suspended or clear to close, and it is booked once on the file. The application fee due is worked out at the moment of
    collection from the program's application_fee in five parts: the pre-approval rate, the Hometown Heroes discount, the e-disclosure
    discount, the returning-borrower discount and the credit report offset; where the program the file is in charges no application
    fee, no fee record is booked, and where a program that charges one works out an amount due of 0.00, the collection is booked at
    0.00 so that the file shows the fee settled. The standard application fee due is the program's application_fee of the program the
    file is in, in full, with no discount and no offset. Pre-approval rate of the application fee: where the pre-approval the file was
    converted from is a Larkspur Underwritten Pre-Approval, a Larkspur Jumbo Underwritten Pre-Approval or a Larkspur Lock & Shop Pre-Approval,
    whose credit and income were already underwritten, the program fee is multiplied by underwritten_level_rate; where it is a Larkspur
    Verified Pre-Approval it is multiplied by verified_level_rate; where the file was converted from no pre-approval of those levels
    the program fee is taken in full. Hometown Heroes discount of the application fee: where the Larkspur Hometown Heroes Credit reserved
    against the file is verified and its verified occupation is firefighter, law enforcement or emergency medical, first_responder_discount
    is taken off; where that credit is verified and its verified occupation is active military or veteran, k12 educator or nurse, other_heroes_discount
    is taken off; where the file carries no verified Hometown Heroes Credit nothing is taken off. E-disclosure discount of the application
    fee: where the file's intent to proceed was given through the e-sign portal and no Loan Estimate on the file was delivered by mail
    or in person, full_esign_discount is taken off; where the intent to proceed was given through the e-sign portal but a Loan Estimate
    on the file was delivered by mail or in person, partial_esign_discount is taken off; where the intent to proceed was not given through
    the e-sign portal nothing is taken off. Returning-borrower discount of the application fee, read from the date of the most recent
    funding wire Larkspur sent on any closing of the customer: where that wire was sent less than returning_window_months whole months
    before the collection date, recent_returning_discount is taken off; where it was sent returning_window_months or more whole months
    before the collection date, earlier_returning_discount is taken off; where Larkspur has sent no funding wire on any closing of the
    customer, nothing is taken off. Credit report offset of the application fee: where the credit report fee charges booked on the file
    less than offset_window_months whole months before the collection date cover at least as many borrowers as the file now has, the
    booked amount of those charges, whatever it is (a 0.00 charge included), is taken off; where such recent charges cover fewer borrowers
    than the file now has, the program's credit_report_fee_per_borrower is taken off for each borrower they cover; where the file has
    no credit report fee charge in that period nothing is taken off. The pre-approval rate is applied to the program fee first; the
    four dollar amounts are then taken off that rated fee one after another, the result is never less than zero, and it is rounded to
    the cent at the end.
  prerequisite: []
  cross_category:
  - category: preapproval
    as: branch
    reads:
    - variant_name
    - preapproval_id
    note: >-
      the pre-approval tier is decided by the level of the pre-approval the file was converted from (the file's preapproval_id).
  - category: credit
    as: branch
    reads:
    - heroes_occupation
    - loan_file_id
    - status
    - variant_name
    note: >-
      the Hometown Heroes tier reads the status and verified occupation of the Hometown Heroes Credit reserved against the file.
  - category: funding
    as: history
    reads:
    - status
    - funding_wires.wire_date
    note: >-
      the returning-borrower discount is decided by the date of the most recent funding wire Larkspur sent on any closing of the customer.
  compute:
  - preapproval_level: CFIELD('preapproval', 'variant_name', preapproval_id=F('preapproval_id'))
  - level_rate: >-
      K('underwritten_level_rate') if (preapproval_level == 'Larkspur Underwritten Pre-Approval' or preapproval_level == 'Larkspur Jumbo
      Underwritten Pre-Approval' or preapproval_level == 'Larkspur Lock & Shop Pre-Approval') else (K('verified_level_rate') if preapproval_level
      == 'Larkspur Verified Pre-Approval' else 1.0)
  - heroes_status: >-
      CFIELD('credit', 'status', variant_name='Larkspur Hometown Heroes Credit', loan_file_id=HID, status='verified')
  - heroes_occupation: >-
      CFIELD('credit', 'heroes_occupation', variant_name='Larkspur Hometown Heroes Credit', loan_file_id=HID, status='verified')
  - heroes_discount: >-
      K('first_responder_discount') if (heroes_status == 'verified' and (heroes_occupation == 'firefighter' or heroes_occupation ==
      'law_enforcement' or heroes_occupation == 'emergency_medical')) else (K('other_heroes_discount') if (heroes_status == 'verified'
      and (heroes_occupation == 'active_military_or_veteran' or heroes_occupation == 'k12_educator' or heroes_occupation == 'nurse'))
      else 0.0)
  - itp_by_esign: COUNT('loan_disclosures', event_type='loan_itp_received', delivery_method='esign_portal')
  - paper_estimates: >-
      COUNT('loan_disclosures', disclosure_form='loan_estimate', delivery_method='us_mail') + COUNT('loan_disclosures', disclosure_form='loan_estimate',
      delivery_method='in_person')
  - esign_discount: >-
      K('full_esign_discount') if (itp_by_esign >= 1 and paper_estimates == 0) else (K('partial_esign_discount') if (itp_by_esign >=
      1 and paper_estimates >= 1) else 0.0)
  - funded_on: >-
      XLATEST('funding', 'funding_wires', 'wire_date', date_field='wire_date', event_type='funding_wire_sent')
  - returning_discount: >-
      K('recent_returning_discount') if (funded_on and MONTHS(funded_on, NOW) < K('returning_window_months')) else (K('earlier_returning_discount')
      if funded_on else 0.0)
  - recent_report_borrowers: >-
      SUM('loan_fee_ledger', 'borrower_count', within_months=K('offset_window_months'), date_field='entry_date', event_type='loan_credit_report_fee_charged')
  - recent_report_amount: >-
      SUM('loan_fee_ledger', 'amount', within_months=K('offset_window_months'), date_field='entry_date', event_type='loan_credit_report_fee_charged')
  - report_offset: >-
      recent_report_amount if recent_report_borrowers >= F('borrower_count') else (P('credit_report_fee_per_borrower') * recent_report_borrowers
      if recent_report_borrowers > 0 else 0.0)
  - result: >-
      RND(MX(0.0, P('application_fee') * level_rate - heroes_discount - esign_discount - returning_discount - report_offset), 2)
  compute_basis:
    preapproval_level: where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval
    level_rate: >-
      where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval, a Larkspur Jumbo Underwritten Pre-Approval
      or a Larkspur Lock & Shop Pre-Approval, whose credit and income were already underwritten, the program fee is multiplied by underwritten_level_rate;
      where it is a Larkspur Verified Pre-Approval it is multiplied by verified_level_rate; where the file was converted from no pre-approval
      of those levels the program fee is taken in full.
    heroes_status: where the Larkspur Hometown Heroes Credit reserved against the file is verified
    heroes_occupation: its verified occupation is firefighter, law enforcement or emergency medical
    heroes_discount: >-
      where the Larkspur Hometown Heroes Credit reserved against the file is verified and its verified occupation is firefighter, law
      enforcement or emergency medical, first_responder_discount is taken off; where that credit is verified and its verified occupation
      is active military or veteran, k12 educator or nurse, other_heroes_discount is taken off; where the file carries no verified Hometown
      Heroes Credit nothing is taken off.
    itp_by_esign: where the file's intent to proceed was given through the e-sign portal
    paper_estimates: no Loan Estimate on the file was delivered by mail or in person
    esign_discount: >-
      where the file's intent to proceed was given through the e-sign portal and no Loan Estimate on the file was delivered by mail
      or in person, full_esign_discount is taken off; where the intent to proceed was given through the e-sign portal but a Loan Estimate
      on the file was delivered by mail or in person, partial_esign_discount is taken off; where the intent to proceed was not given
      through the e-sign portal nothing is taken off.
    funded_on: read from the date of the most recent funding wire Larkspur sent on any closing of the customer
    returning_discount: >-
      where that wire was sent less than returning_window_months whole months before the collection date, recent_returning_discount
      is taken off; where it was sent returning_window_months or more whole months before the collection date, earlier_returning_discount
      is taken off; where Larkspur has sent no funding wire on any closing of the customer, nothing is taken off.
    recent_report_borrowers: >-
      where the credit report fee charges booked on the file less than offset_window_months whole months before the collection date
      cover at least as many borrowers as the file now has
    recent_report_amount: the booked amount of those charges, whatever it is (a 0.00 charge included), is taken off
    report_offset: >-
      where the credit report fee charges booked on the file less than offset_window_months whole months before the collection date
      cover at least as many borrowers as the file now has, the booked amount of those charges, whatever it is (a 0.00 charge included),
      is taken off; where such recent charges cover fewer borrowers than the file now has, the program's credit_report_fee_per_borrower
      is taken off for each borrower they cover; where the file has no credit report fee charge in that period nothing is taken off.
    result: >-
      The pre-approval rate is applied to the program fee first; the four dollar amounts are then taken off that rated fee one after
      another, the result is never less than zero, and it is rounded to the cent at the end.
  factors:
  - id: preapproval_level_rate
    effect: parameter
    decides: level_rate
    bindings:
    - preapproval_level
    - level_rate
    ladder:
    - when: >-
        the pre-approval the file was converted from is an Underwritten, Jumbo Underwritten or Lock & Shop Pre-Approval
      value: K('underwritten_level_rate')
    - when: the pre-approval the file was converted from is a Verified Pre-Approval
      value: K('verified_level_rate')
    - when: otherwise (no converted pre-approval of those levels)
      value: '1.0'
    baseline:
      level_rate: '1.0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: heroes_fee_discount
    effect: parameter
    decides: heroes_discount
    bindings:
    - heroes_status
    - heroes_occupation
    - heroes_discount
    ladder:
    - when: >-
        the Hometown Heroes Credit reserved against the file is verified and its occupation is firefighter, law enforcement or emergency
        medical
      value: K('first_responder_discount')
    - when: >-
        the Hometown Heroes Credit reserved against the file is verified and its occupation is active military or veteran, k12 educator
        or nurse
      value: K('other_heroes_discount')
    - when: otherwise (no verified Hometown Heroes Credit)
      value: '0.0'
    baseline:
      heroes_discount: '0.0'
    evidence:
    - cross_category
    cross_difficulty: credit
  - id: edisclosure_discount
    effect: parameter
    decides: esign_discount
    bindings:
    - itp_by_esign
    - paper_estimates
    - esign_discount
    ladder:
    - when: >-
        intent to proceed given through the e-sign portal and no Loan Estimate delivered by mail or in person
      value: K('full_esign_discount')
    - when: intent to proceed given through the e-sign portal and a Loan Estimate delivered by mail or in person
      value: K('partial_esign_discount')
    - when: otherwise (intent to proceed not given through the e-sign portal)
      value: '0.0'
    baseline:
      esign_discount: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: returning_borrower_discount
    effect: parameter
    decides: returning_discount
    bindings:
    - funded_on
    - returning_discount
    ladder:
    - when: >-
        the most recent funding wire Larkspur sent on any closing of the customer was sent less than returning_window_months whole months
        before the collection date
      value: K('recent_returning_discount')
    - when: that wire was sent returning_window_months or more whole months before the collection date
      value: K('earlier_returning_discount')
    - when: otherwise (no funding wire sent on any closing of the customer)
      value: '0.0'
    baseline:
      returning_discount: '0.0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: funding
  - id: credit_report_offset
    effect: method
    decides: report_offset
    bindings:
    - recent_report_borrowers
    - recent_report_amount
    - report_offset
    ladder:
    - when: recent credit report charges on the file cover at least as many borrowers as the file now has
      method: take off the booked amount of those charges
    - when: recent credit report charges cover fewer borrowers than the file now has
      method: take off credit_report_fee_per_borrower for each borrower they cover
    - when: otherwise (no credit report charge in the period)
      method: take off nothing
    baseline:
      report_offset: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The standard application fee due is the program's application_fee of the program the file is in, in full, with no discount and
      no offset.
    params:
    - application_fee
  inputs:
    history:
    - table: loan_disclosures
      aggregate: count
      field: delivery_method
      filters:
        event_type: loan_itp_received
    - table: loan_fee_ledger
      aggregate: sum
      field: amount
      within_months: 6
      filters:
        event_type: loan_credit_report_fee_charged
    - category: funding
      table: funding_wires
      aggregate: latest
      field: wire_date
      filters:
        event_type: funding_wire_sent
    cross_category:
    - preapproval
    - credit
    - funding
- id: loan_ext_revised_le_zero_tolerance
  base_policy_refs:
  - loan_changed_circumstance
  overwrite: []
  trigger: state_due
  subject:
  - loan_le_revised
  computes: zero_tolerance_total
  target_tool: issue_revised_loan_estimate_22df4f86
  params:
    extension_window_months: 1
    underwriting_relief_verified: 300.0
    processing_relief_other_heroes: 200.0
  rule: >-
    When a changed circumstance is documented on a file before any Closing Disclosure has been issued, Larkspur issues a revised Loan
    Estimate that restates the zero-tolerance charges. The revised Loan Estimate carries the next disclosure sequence after the latest
    Loan Estimate on the file, names the changed circumstance it rests on (rate_lock_extension for a lock extension the borrower requested)
    and the date that circumstance was documented, which for a lock extension is the date the borrower's extension request was logged
    in the lock request log. The standard zero-tolerance total of a revised Loan Estimate is the program's fee sheet: the program's
    underwriting_fee, processing_fee, application_fee, flood_certification_fee and tax_service_fee, plus credit_report_fee_per_borrower
    for each borrower on the file, plus the base_fee of the report type of the file's live primary appraisal order (the order placed
    on the file with order reason standard_order, transferred_in or new_order_after_expiration that is not cancelled; a file carries
    at most one such order), or nothing for the appraisal where the file has no live primary appraisal order, plus origination_charge_pct
    of the base loan amount rounded to the cent. Lock extension line of the revised Loan Estimate: where borrower-borne lock extension
    entries were booked on any rate lock of the customer less than extension_window_months whole months before the issue date, their
    dollar cost, less any lock cost waivers Larkspur booked on the customer's locks in that period and never below zero, is added; where
    no such extension entry was booked in that period but relock fee entries were, those relock fees, less such waivers and never below
    zero, are added; where neither was booked in that period, nothing is added. Appraisal surcharge line of the revised Loan Estimate:
    where the file's live primary appraisal order carries gross living area or acreage surcharge charges, those charges are added; where
    it carries neither but carries trip fee or reinspection fee charges, those charges are added; where it carries none of these charges,
    or the file has no live primary appraisal order, nothing is added. Appraisal rush line of the revised Loan Estimate: where the borrower
    requested rush turn time on the file's live primary appraisal order and a rush fee charge is booked on it, the booked rush fee is
    added; where the borrower requested rush turn time but no rush fee charge is booked, the report type's rush_fee is added; where
    rush turn time was not requested, or the file has no live primary appraisal order, nothing is added. Underwriting relief on the
    revised Loan Estimate: where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval, a Larkspur Jumbo
    Underwritten Pre-Approval or a Larkspur Lock & Shop Pre-Approval, the program's underwriting_fee is taken off; where it is a Larkspur
    Verified Pre-Approval, underwriting_relief_verified is taken off; otherwise nothing is taken off. Processing relief on the revised
    Loan Estimate: where the Hometown Heroes Credit reserved against the file is verified for a firefighter, law enforcement or emergency
    medical occupation, the program's processing_fee is taken off; where it is verified for an active military or veteran, k12 educator
    or nurse occupation, processing_relief_other_heroes is taken off; otherwise nothing is taken off. Application fee line of the revised
    Loan Estimate: where an application fee collection entry is on the file's fee ledger, whatever its amount (a 0.00 collection included),
    and none of it has been refunded, the program's application_fee in the fee sheet is replaced by the amount actually collected; where
    the collection on the ledger has been refunded in full, the program's application_fee is taken out of the fee sheet; where no application
    fee collection is on the ledger, as for a program that charges no application fee, the program's application_fee stays in the fee
    sheet. Each line is added to or taken from the fee-sheet total once, in dollars, and the total is rounded to the cent. The zero-tolerance
    total on a revised Loan Estimate is not fixed until the fee ledger shows the application fee actually collected on the file, wherever
    the program the file is in charges an application fee.
  prerequisite:
  - problem: loan_ext_application_fee_due
    kind: value_input
    gate: fee_collected_line
    form: state
    policy_source: >-
      The zero-tolerance total on a revised Loan Estimate is not fixed until the fee ledger shows the application fee actually collected
      on the file, wherever the program the file is in charges an application fee.
    condition: >-
      the loan file's fee ledger carries a loan_application_fee_collected entry, or the program the file is in has an application_fee
      of 0.00
    resolved_by: pay_application_fee_6c3f9eab
    effect: >-
      once the application fee is collected, the application fee line replaces the program's application_fee in the fee sheet by the
      amount actually collected
  cross_category:
  - category: lock
    as: history
    reads:
    - lock_pricing_events.cost_amount
    note: >-
      the lock extension line adds the borrower-borne extension cost booked on the customer's lock in the last month.
  - category: appraisal
    as: history
    reads:
    - base_fee
    - rush_fee
    - rush_requested
    - appraisal_fee_ledger.amount
    note: the appraisal surcharge and rush lines read the charges booked on the file's appraisal order.
  - category: preapproval
    as: branch
    reads:
    - variant_name
    - preapproval_id
    note: >-
      the pre-approval tier is decided by the level of the pre-approval the file was converted from (the file's preapproval_id).
  - category: credit
    as: branch
    reads:
    - heroes_occupation
    - loan_file_id
    - status
    - variant_name
    note: >-
      the Hometown Heroes tier reads the status and verified occupation of the Hometown Heroes Credit reserved against the file.
  compute:
  - standard_order: >-
      CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='delivered') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='under_reconsideration') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='completed') or CFIELD('appraisal', 'appraisal_order_id',
      loan_file_id=HID, order_reason='standard_order', status='inspected') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID,
      order_reason='standard_order', status='on_hold') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='standard_order',
      status='assigned') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='ordered')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='delivered') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='under_reconsideration') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='completed') or CFIELD('appraisal', 'appraisal_order_id',
      loan_file_id=HID, order_reason='transferred_in', status='inspected') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID,
      order_reason='transferred_in', status='on_hold') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in',
      status='assigned') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='ordered')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='delivered')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='under_reconsideration')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='completed')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='inspected')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='on_hold') or
      CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='assigned') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='ordered')
  - fee_sheet: >-
      P('underwriting_fee') + P('processing_fee') + P('application_fee') + P('flood_certification_fee') + P('tax_service_fee') + P('credit_report_fee_per_borrower')
      * F('borrower_count') + ((CPARAM('appraisal', 'base_fee', appraisal_order_id=standard_order) or 0.0) if standard_order else 0.0)
      + RND(P('origination_charge_pct') * F('base_loan_amount') / 100, 2)
  - extension_entries: >-
      XCOUNT('lock', 'lock_pricing_events', within_months=K('extension_window_months'), date_field='event_date', event_type='lock_extension_booked',
      cost_bearer='borrower')
  - extension_cost: >-
      XSUM('lock', 'lock_pricing_events', 'cost_amount', within_months=K('extension_window_months'), date_field='event_date', event_type='lock_extension_booked',
      cost_bearer='borrower')
  - relock_cost: >-
      XSUM('lock', 'lock_pricing_events', 'cost_amount', within_months=K('extension_window_months'), date_field='event_date', event_type='lock_relock_fee_booked')
  - relock_entries: >-
      XCOUNT('lock', 'lock_pricing_events', within_months=K('extension_window_months'), date_field='event_date', event_type='lock_relock_fee_booked')
  - waived_lock_cost: >-
      XSUM('lock', 'lock_pricing_events', 'cost_amount', within_months=K('extension_window_months'), date_field='event_date', event_type='lock_cost_waived')
  - extension_line: >-
      MX(0.0, extension_cost - waived_lock_cost) if extension_entries >= 1 else (MX(0.0, relock_cost - waived_lock_cost) if relock_entries
      >= 1 else 0.0)
  - size_entries: >-
      XCOUNT('appraisal', 'appraisal_fee_ledger', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='gla_surcharge')
      + XCOUNT('appraisal', 'appraisal_fee_ledger', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='acreage_surcharge')
  - size_surcharges: >-
      XSUM('appraisal', 'appraisal_fee_ledger', 'amount', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='gla_surcharge')
      + XSUM('appraisal', 'appraisal_fee_ledger', 'amount', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='acreage_surcharge')
  - visit_charges: >-
      XSUM('appraisal', 'appraisal_fee_ledger', 'amount', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='trip_fee')
      + XSUM('appraisal', 'appraisal_fee_ledger', 'amount', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='reinspection_fee')
  - visit_entries: >-
      XCOUNT('appraisal', 'appraisal_fee_ledger', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='trip_fee')
      + XCOUNT('appraisal', 'appraisal_fee_ledger', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='reinspection_fee')
  - surcharge_line: size_surcharges if size_entries >= 1 else (visit_charges if visit_entries >= 1 else 0.0)
  - rush_asked: CFIELD('appraisal', 'rush_requested', appraisal_order_id=standard_order)
  - rush_booked: >-
      XSUM('appraisal', 'appraisal_fee_ledger', 'amount', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='rush_fee')
  - rush_entries: >-
      XCOUNT('appraisal', 'appraisal_fee_ledger', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='rush_fee')
  - rush_line: >-
      rush_booked if (rush_asked == True and rush_entries >= 1) else (CPARAM('appraisal', 'rush_fee', appraisal_order_id=standard_order)
      if rush_asked == True else 0.0)
  - pa_level: CFIELD('preapproval', 'variant_name', preapproval_id=F('preapproval_id'))
  - underwriting_relief: >-
      P('underwriting_fee') if (pa_level == 'Larkspur Underwritten Pre-Approval' or pa_level == 'Larkspur Jumbo Underwritten Pre-Approval'
      or pa_level == 'Larkspur Lock & Shop Pre-Approval') else (K('underwriting_relief_verified') if pa_level == 'Larkspur Verified
      Pre-Approval' else 0.0)
  - heroes_state: >-
      CFIELD('credit', 'status', variant_name='Larkspur Hometown Heroes Credit', loan_file_id=HID, status='verified')
  - heroes_job: >-
      CFIELD('credit', 'heroes_occupation', variant_name='Larkspur Hometown Heroes Credit', loan_file_id=HID, status='verified')
  - processing_relief: >-
      P('processing_fee') if (heroes_state == 'verified' and (heroes_job == 'firefighter' or heroes_job == 'law_enforcement' or heroes_job
      == 'emergency_medical')) else (K('processing_relief_other_heroes') if (heroes_state == 'verified' and (heroes_job == 'active_military_or_veteran'
      or heroes_job == 'k12_educator' or heroes_job == 'nurse')) else 0.0)
  - fee_collections: COUNT('loan_fee_ledger', event_type='loan_application_fee_collected')
  - fee_collected: SUM('loan_fee_ledger', 'amount', event_type='loan_application_fee_collected')
  - fee_refunded: >-
      SUM('loan_fee_ledger', 'amount', event_type='loan_fee_refunded', fee_code='application_fee') + SUM('loan_fee_ledger', 'amount',
      event_type='loan_fee_withdrawal_refunded', fee_code='application_fee')
  - fee_collected_line: >-
      (fee_collected - P('application_fee')) if (fee_collections >= 1 and fee_refunded == 0) else ((0.0 - P('application_fee')) if (fee_collections
      >= 1 and fee_refunded >= fee_collected) else 0.0)
  - result: >-
      RND(fee_sheet + extension_line + surcharge_line + rush_line - underwriting_relief - processing_relief + fee_collected_line, 2)
  compute_basis:
    fee_sheet: >-
      The standard zero-tolerance total of a revised Loan Estimate is the program's fee sheet: the program's underwriting_fee, processing_fee,
      application_fee, flood_certification_fee and tax_service_fee, plus credit_report_fee_per_borrower for each borrower on the file,
      plus the base_fee of the report type of the file's live primary appraisal order (the order placed on the file with order reason
      standard_order, transferred_in or new_order_after_expiration that is not cancelled; a file carries at most one such order), or
      nothing for the appraisal where the file has no live primary appraisal order, plus origination_charge_pct of the base loan amount
      rounded to the cent.
    extension_cost: >-
      where borrower-borne lock extension entries were booked on any rate lock of the customer less than extension_window_months whole
      months before the issue date, their dollar cost
    relock_cost: those relock fees, less such waivers and never below zero, are added
    extension_line: >-
      where borrower-borne lock extension entries were booked on any rate lock of the customer less than extension_window_months whole
      months before the issue date, their dollar cost, less any lock cost waivers Larkspur booked on the customer's locks in that period
      and never below zero, is added; where no such extension entry was booked in that period but relock fee entries were, those relock
      fees, less such waivers and never below zero, are added; where neither was booked in that period, nothing is added.
    size_surcharges: >-
      where the file's live primary appraisal order carries gross living area or acreage surcharge charges, those charges are added
    visit_charges: where it carries neither but carries trip fee or reinspection fee charges, those charges are added
    surcharge_line: >-
      where the file's live primary appraisal order carries gross living area or acreage surcharge charges, those charges are added;
      where it carries neither but carries trip fee or reinspection fee charges, those charges are added; where it carries none of these
      charges, or the file has no live primary appraisal order, nothing is added.
    rush_asked: where the borrower requested rush turn time on the file's live primary appraisal order
    rush_booked: a rush fee charge is booked on it
    rush_line: >-
      where the borrower requested rush turn time on the file's live primary appraisal order and a rush fee charge is booked on it,
      the booked rush fee is added; where the borrower requested rush turn time but no rush fee charge is booked, the report type's
      rush_fee is added; where rush turn time was not requested, or the file has no live primary appraisal order, nothing is added.
    pa_level: where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval
    underwriting_relief: >-
      where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval, a Larkspur Jumbo Underwritten Pre-Approval
      or a Larkspur Lock & Shop Pre-Approval, the program's underwriting_fee is taken off; where it is a Larkspur Verified Pre-Approval,
      underwriting_relief_verified is taken off; otherwise nothing is taken off.
    heroes_state: where the Hometown Heroes Credit reserved against the file is verified
    heroes_job: for a firefighter, law enforcement or emergency medical occupation
    processing_relief: >-
      where the Hometown Heroes Credit reserved against the file is verified for a firefighter, law enforcement or emergency medical
      occupation, the program's processing_fee is taken off; where it is verified for an active military or veteran, k12 educator or
      nurse occupation, processing_relief_other_heroes is taken off; otherwise nothing is taken off.
    fee_collected: the amount actually collected
    fee_refunded: none of it has been refunded
    fee_collected_line: >-
      where an application fee collection entry is on the file's fee ledger, whatever its amount (a 0.00 collection included), and none
      of it has been refunded, the program's application_fee in the fee sheet is replaced by the amount actually collected; where the
      collection on the ledger has been refunded in full, the program's application_fee is taken out of the fee sheet; where no application
      fee collection is on the ledger, as for a program that charges no application fee, the program's application_fee stays in the
      fee sheet.
    result: >-
      Each line is added to or taken from the fee-sheet total once, in dollars, and the total is rounded to the cent.
    fee_collections: >-
      where an application fee collection entry is on the file's fee ledger, whatever its amount (a 0.00 collection included)
    extension_entries: >-
      where borrower-borne lock extension entries were booked on any rate lock of the customer less than extension_window_months whole
      months before the issue date
    relock_entries: where no such extension entry was booked in that period but relock fee entries were
    size_entries: where the file's live primary appraisal order carries gross living area or acreage surcharge charges
    visit_entries: where it carries neither but carries trip fee or reinspection fee charges
    rush_entries: a rush fee charge is booked on it
    standard_order: >-
      the file's live primary appraisal order (the order placed on the file with order reason standard_order, transferred_in or new_order_after_expiration
      that is not cancelled; a file carries at most one such order)
    waived_lock_cost: >-
      less any lock cost waivers Larkspur booked on the customer's locks in that period and never below zero
  factors:
  - id: lock_extension_line
    effect: method
    decides: extension_line
    bindings:
    - extension_entries
    - extension_cost
    - relock_entries
    - relock_cost
    - waived_lock_cost
    - extension_line
    ladder:
    - when: >-
        borrower-borne lock extension entries were booked less than extension_window_months whole months before the issue date
      method: add their dollar cost less lock cost waivers booked in the period (never below zero)
    - when: no such extension entry, but relock fee entries were booked in that period
      method: add the relock fees less such waivers (never below zero)
    - when: otherwise
      method: add nothing
    baseline:
      extension_line: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: lock
  - id: appraisal_surcharge_line
    effect: method
    decides: surcharge_line
    bindings:
    - size_entries
    - size_surcharges
    - visit_entries
    - visit_charges
    - surcharge_line
    ladder:
    - when: the appraisal order carries gross living area or acreage surcharge charges
      method: add those surcharge charges
    - when: it carries neither, but carries trip fee or reinspection fee charges
      method: add those visit charges
    - when: otherwise (none of these charges, or no live primary appraisal order)
      method: add nothing
    baseline:
      surcharge_line: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: appraisal
  - id: appraisal_rush_line
    effect: method
    decides: rush_line
    bindings:
    - rush_asked
    - rush_entries
    - rush_booked
    - rush_line
    ladder:
    - when: the borrower requested rush turn time and a rush fee charge is booked
      method: add the booked rush fee
    - when: the borrower requested rush turn time and no rush fee charge is booked
      method: add the report type's rush_fee from the schedule
    - when: otherwise (rush not requested, or no live primary appraisal order)
      method: add nothing
    baseline:
      rush_line: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: appraisal
  - id: pre_approval_underwriting_relief
    effect: parameter
    decides: underwriting_relief
    bindings:
    - pa_level
    - underwriting_relief
    ladder:
    - when: pre-approval the file was converted from is Underwritten, Jumbo Underwritten or Lock & Shop
      value: P('underwriting_fee')
    - when: pre-approval the file was converted from is Verified
      value: K('underwriting_relief_verified')
    - when: otherwise
      value: '0.0'
    baseline:
      underwriting_relief: '0.0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: heroes_processing_relief
    effect: parameter
    decides: processing_relief
    bindings:
    - heroes_state
    - heroes_job
    - processing_relief
    ladder:
    - when: >-
        Hometown Heroes Credit reserved against the file verified for firefighter, law enforcement or emergency medical
      value: P('processing_fee')
    - when: >-
        Hometown Heroes Credit reserved against the file verified for active military or veteran, k12 educator or nurse
      value: K('processing_relief_other_heroes')
    - when: otherwise
      value: '0.0'
    baseline:
      processing_relief: '0.0'
    evidence:
    - cross_category
    cross_difficulty: credit
  - id: collected_fee_line
    effect: method
    decides: fee_collected_line
    bindings:
    - fee_collections
    - fee_collected
    - fee_refunded
    - fee_collected_line
    ladder:
    - when: >-
        an application fee collection entry is on the fee ledger, whatever its amount, and none of it has been refunded
      method: replace the program's application_fee by the amount actually collected
    - when: the collection on the ledger has been refunded in full
      method: take the program's application_fee out of the fee sheet
    - when: otherwise (no collection on the ledger, as for a program that charges no application fee)
      method: leave the program's application_fee in the fee sheet
    baseline:
      fee_collected_line: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The standard zero-tolerance total of a revised Loan Estimate is the program's fee sheet: the program's underwriting_fee, processing_fee,
      application_fee, flood_certification_fee and tax_service_fee, plus credit_report_fee_per_borrower for each borrower on the file,
      plus the base_fee of the report type of the file's live primary appraisal order (the order placed on the file with order reason
      standard_order, transferred_in or new_order_after_expiration that is not cancelled; a file carries at most one such order), or
      nothing for the appraisal where the file has no live primary appraisal order, plus origination_charge_pct of the base loan amount
      rounded to the cent.
    params:
    - underwriting_fee
    - processing_fee
    - application_fee
    - flood_certification_fee
    - tax_service_fee
    - credit_report_fee_per_borrower
    - origination_charge_pct
  inputs:
    history:
    - category: lock
      table: lock_pricing_events
      aggregate: sum
      field: cost_amount
      within_months: 1
      filters:
        event_type: lock_extension_booked
        cost_bearer: borrower
    - category: appraisal
      table: appraisal_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: appraisal_fee_charged
    - table: loan_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: loan_application_fee_collected
    cross_category:
    - lock
    - appraisal
    - preapproval
    - credit
- id: loan_ext_zero_tolerance_cure
  base_policy_refs:
  - loan_tolerance_cure
  - loan_changed_circumstance
  overwrite:
  - base_policy: loan_tolerance_cure
    superseded_clause: >-
      At closing the charges on the final Closing Disclosure are compared with the good-faith baseline (the initial Loan Estimate, or
      the latest timely revised Loan Estimate whose changed circumstance affected the charge).
    replaced_by: >-
      For the zero-tolerance bucket before consummation, and only for it, Larkspur measures the zero-tolerance charges as last disclosed
      on a Loan Estimate against the good-faith baseline and books any cure as a lender credit at closing; the 10 percent bucket, and
      any violation found only after consummation, are still compared on the final Closing Disclosure with the good-faith baseline (the
      initial Loan Estimate, or the latest timely revised Loan Estimate whose changed circumstance affected the charge).
  - base_policy: loan_tolerance_cure
    superseded_clause: >-
      In the zero-tolerance bucket the cure is the amount by which zero_tolerance_total on the Closing Disclosure exceeds the baseline
      zero_tolerance_total.
    replaced_by: >-
      The measured increase of the cure is the zero-tolerance total on the latest Loan Estimate on the file, the one with the highest
      disclosure sequence, minus the zero-tolerance total on the initial Loan Estimate, kept with its sign, so that it is negative when
      the latest total is the lower one; a total the file does not carry counts as 0.00. The standard zero-tolerance cure is the measured
      increase where it is above zero, and nothing otherwise. A zero-tolerance violation found only after consummation is still the
      amount by which zero_tolerance_total on the final Closing Disclosure exceeds the baseline zero_tolerance_total.
  - base_policy: loan_changed_circumstance
    superseded_clause: >-
      A timely revised Loan Estimate becomes the good-faith baseline for the charges the circumstance actually affected; an untimely
      one, or one issued without a valid reason, leaves the earlier Loan Estimate as the baseline.
    replaced_by: >-
      For the zero-tolerance cure assessed before consummation, and only for it, the initial Loan Estimate stays the baseline disclosure
      and the increases that a changed circumstance accounts for are taken out of the measured increase as set out below instead of
      re-setting the baseline; for every other comparison, including the 10 percent bucket and the final Closing Disclosure after consummation,
      a timely revised Loan Estimate still becomes the good-faith baseline for the charges the circumstance actually affected, and an
      untimely one, or one issued without a valid reason, still leaves the earlier Loan Estimate as the baseline.
  trigger: state_due
  subject:
  - loan_tolerance_cure_assessed
  computes: cure_amount
  target_tool: assess_tolerance_cure_d5e015cb
  params:
    cure_window_months: 1
    underwriting_addback_verified: 300.0
    processing_addback_other_heroes: 200.0
  rule: >-
    For the zero-tolerance bucket before consummation, and only for it, Larkspur measures the zero-tolerance charges as last disclosed
    on a Loan Estimate against the good-faith baseline and books any cure as a lender credit at closing; the 10 percent bucket, and
    any violation found only after consummation, are still compared on the final Closing Disclosure with the good-faith baseline (the
    initial Loan Estimate, or the latest timely revised Loan Estimate whose changed circumstance affected the charge). The cure is booked
    as one entry in the zero_tolerance bucket naming the initial Loan Estimate as the baseline disclosure and the latest Loan Estimate
    on the file as the disclosure measured, with cure method credit_at_closing; where the cure works out to nothing, no cure entry is
    booked. The measured increase of the cure is the zero-tolerance total on the latest Loan Estimate on the file, the one with the
    highest disclosure sequence, minus the zero-tolerance total on the initial Loan Estimate, kept with its sign, so that it is negative
    when the latest total is the lower one; a total the file does not carry counts as 0.00. The standard zero-tolerance cure is the
    measured increase where it is above zero, and nothing otherwise. A zero-tolerance violation found only after consummation is still
    the amount by which zero_tolerance_total on the final Closing Disclosure exceeds the baseline zero_tolerance_total. For the zero-tolerance
    cure assessed before consummation, and only for it, the initial Loan Estimate stays the baseline disclosure and the increases that
    a changed circumstance accounts for are taken out of the measured increase as set out below instead of re-setting the baseline;
    for every other comparison, including the 10 percent bucket and the final Closing Disclosure after consummation, a timely revised
    Loan Estimate still becomes the good-faith baseline for the charges the circumstance actually affected, and an untimely one, or
    one issued without a valid reason, still leaves the earlier Loan Estimate as the baseline. Extension re-baselining of the cure:
    where borrower-borne lock extension entries were booked on any rate lock of the customer less than cure_window_months whole months
    before the cure date, the borrower requested that extension and its dollar cost, less any lock cost waivers Larkspur booked on the
    customer's locks in that period and never below zero, is taken out of the measured increase; where no such extension entry was booked
    in that period but relock fee entries were, those relock fees, less such waivers and never below zero, are taken out; where neither
    was booked in that period, nothing is taken out. Rush re-baselining of the cure: where the borrower requested rush turn time on
    the file's live primary appraisal order (the order placed on the file with order reason standard_order, transferred_in or new_order_after_expiration
    that is not cancelled; a file carries at most one such order) and a rush fee charge is booked on it, the booked rush fee is taken
    out of the measured increase because the borrower asked for it; where the borrower requested rush turn time and no rush fee charge
    is booked, the report type's rush_fee is taken out; where rush turn time was not requested, or the file has no live primary appraisal
    order, nothing is taken out. Underwriting add-back of the cure, because a fee decrease never offsets an increase in another charge:
    where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval, a Larkspur Jumbo Underwritten Pre-Approval
    or a Larkspur Lock & Shop Pre-Approval, the program's underwriting_fee is added back to the measured increase; where it is a Larkspur
    Verified Pre-Approval, underwriting_addback_verified is added back; otherwise nothing is added back. Processing add-back of the
    cure: where the Hometown Heroes Credit reserved against the file is verified for a firefighter, law enforcement or emergency medical
    occupation, the program's processing_fee is added back; where it is verified for an active military or veteran, k12 educator or
    nurse occupation, processing_addback_other_heroes is added back; otherwise nothing is added back. Application fee add-back of the
    cure: where an application fee collection entry is on the fee ledger, whatever its amount (a 0.00 collection included), and it has
    not been refunded, the difference between the program's application_fee and the amount collected is added back, which is nothing
    when the full program fee was collected; where the collection has been refunded in full, the program's application_fee is added
    back; where no application fee collection is on the ledger, as for a program that charges no application fee, nothing is added back.
    Each amount taken out or added back adjusts the signed measured increase once, in dollars; the cure is that adjusted increase where
    it is above zero and nothing otherwise, rounded to the cent. A zero-tolerance cure is assessed only after the latest Loan Estimate
    on the file carries the changed circumstance documented most recently on the file.
  prerequisite:
  - problem: loan_ext_revised_le_zero_tolerance
    kind: value_input
    gate: latest_estimate_total
    form: state
    policy_source: >-
      A zero-tolerance cure is assessed only after the latest Loan Estimate on the file carries the changed circumstance documented
      most recently on the file.
    condition: >-
      the latest loan_estimate disclosure on the file has a coc_documented_date no earlier than the date of the changed circumstance
      documented most recently on the file (for a lock extension, the request_date of the borrower's extension request in the lock request
      log)
    resolved_by: issue_revised_loan_estimate_22df4f86
    effect: >-
      once the revised Loan Estimate is issued, the measured increase is taken from its zero-tolerance total instead of the earlier
      Loan Estimate's
  cross_category:
  - category: lock
    as: history
    reads:
    - lock_pricing_events.cost_amount
    note: >-
      the extension re-baselining takes out the borrower-borne extension cost booked on the customer's lock in the last month.
  - category: appraisal
    as: history
    reads:
    - rush_requested
    - rush_fee
    - appraisal_fee_ledger.amount
    note: the rush re-baselining takes out the rush fee the borrower asked for.
  - category: preapproval
    as: branch
    reads:
    - variant_name
    - preapproval_id
    note: >-
      the pre-approval tier is decided by the level of the pre-approval the file was converted from (the file's preapproval_id).
  - category: credit
    as: branch
    reads:
    - heroes_occupation
    - loan_file_id
    - status
    - variant_name
    note: >-
      the Hometown Heroes tier reads the status and verified occupation of the Hometown Heroes Credit reserved against the file.
  compute:
  - standard_order: >-
      CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='delivered') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='under_reconsideration') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='completed') or CFIELD('appraisal', 'appraisal_order_id',
      loan_file_id=HID, order_reason='standard_order', status='inspected') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID,
      order_reason='standard_order', status='on_hold') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='standard_order',
      status='assigned') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='standard_order', status='ordered')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='delivered') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='under_reconsideration') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='completed') or CFIELD('appraisal', 'appraisal_order_id',
      loan_file_id=HID, order_reason='transferred_in', status='inspected') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID,
      order_reason='transferred_in', status='on_hold') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in',
      status='assigned') or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='transferred_in', status='ordered')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='delivered')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='under_reconsideration')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='completed')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='inspected')
      or CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='on_hold') or
      CFIELD('appraisal', 'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='assigned') or CFIELD('appraisal',
      'appraisal_order_id', loan_file_id=HID, order_reason='new_order_after_expiration', status='ordered')
  - latest_estimate_sequence: MAX('loan_disclosures', 'disclosure_sequence', disclosure_form='loan_estimate')
  - latest_estimate_total: >-
      (LATEST('loan_disclosures', 'zero_tolerance_total', date_field='issued_date', disclosure_form='loan_estimate', disclosure_sequence=int(latest_estimate_sequence))
      or 0.0)
  - initial_estimate_total: >-
      (LATEST('loan_disclosures', 'zero_tolerance_total', date_field='issued_date', event_type='loan_le_issued') or 0.0)
  - measured_increase: latest_estimate_total - initial_estimate_total
  - borrower_extension_entries: >-
      XCOUNT('lock', 'lock_pricing_events', within_months=K('cure_window_months'), date_field='event_date', event_type='lock_extension_booked',
      cost_bearer='borrower')
  - borrower_extension_cost: >-
      XSUM('lock', 'lock_pricing_events', 'cost_amount', within_months=K('cure_window_months'), date_field='event_date', event_type='lock_extension_booked',
      cost_bearer='borrower')
  - borrower_relock_cost: >-
      XSUM('lock', 'lock_pricing_events', 'cost_amount', within_months=K('cure_window_months'), date_field='event_date', event_type='lock_relock_fee_booked')
  - borrower_relock_entries: >-
      XCOUNT('lock', 'lock_pricing_events', within_months=K('cure_window_months'), date_field='event_date', event_type='lock_relock_fee_booked')
  - waived_lock_cost: >-
      XSUM('lock', 'lock_pricing_events', 'cost_amount', within_months=K('cure_window_months'), date_field='event_date', event_type='lock_cost_waived')
  - extension_taken_out: >-
      MX(0.0, borrower_extension_cost - waived_lock_cost) if borrower_extension_entries >= 1 else (MX(0.0, borrower_relock_cost - waived_lock_cost)
      if borrower_relock_entries >= 1 else 0.0)
  - rush_wanted: CFIELD('appraisal', 'rush_requested', appraisal_order_id=standard_order)
  - rush_charged: >-
      XSUM('appraisal', 'appraisal_fee_ledger', 'amount', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='rush_fee')
  - rush_charge_entries: >-
      XCOUNT('appraisal', 'appraisal_fee_ledger', appraisal_order_id=standard_order, event_type='appraisal_fee_charged', fee_component='rush_fee')
  - rush_taken_out: >-
      rush_charged if (rush_wanted == True and rush_charge_entries >= 1) else (CPARAM('appraisal', 'rush_fee', appraisal_order_id=standard_order)
      if rush_wanted == True else 0.0)
  - converted_level: CFIELD('preapproval', 'variant_name', preapproval_id=F('preapproval_id'))
  - underwriting_added_back: >-
      P('underwriting_fee') if (converted_level == 'Larkspur Underwritten Pre-Approval' or converted_level == 'Larkspur Jumbo Underwritten
      Pre-Approval' or converted_level == 'Larkspur Lock & Shop Pre-Approval') else (K('underwriting_addback_verified') if converted_level
      == 'Larkspur Verified Pre-Approval' else 0.0)
  - heroes_credit_status: >-
      CFIELD('credit', 'status', variant_name='Larkspur Hometown Heroes Credit', loan_file_id=HID, status='verified')
  - heroes_credit_job: >-
      CFIELD('credit', 'heroes_occupation', variant_name='Larkspur Hometown Heroes Credit', loan_file_id=HID, status='verified')
  - processing_added_back: >-
      P('processing_fee') if (heroes_credit_status == 'verified' and (heroes_credit_job == 'firefighter' or heroes_credit_job == 'law_enforcement'
      or heroes_credit_job == 'emergency_medical')) else (K('processing_addback_other_heroes') if (heroes_credit_status == 'verified'
      and (heroes_credit_job == 'active_military_or_veteran' or heroes_credit_job == 'k12_educator' or heroes_credit_job == 'nurse'))
      else 0.0)
  - app_fee_collections: COUNT('loan_fee_ledger', event_type='loan_application_fee_collected')
  - app_fee_paid: SUM('loan_fee_ledger', 'amount', event_type='loan_application_fee_collected')
  - app_fee_returned: >-
      SUM('loan_fee_ledger', 'amount', event_type='loan_fee_refunded', fee_code='application_fee') + SUM('loan_fee_ledger', 'amount',
      event_type='loan_fee_withdrawal_refunded', fee_code='application_fee')
  - fee_added_back: >-
      (P('application_fee') - app_fee_paid) if (app_fee_collections >= 1 and app_fee_returned == 0) else (P('application_fee') if (app_fee_collections
      >= 1 and app_fee_returned >= app_fee_paid) else 0.0)
  - result: >-
      RND(MX(0.0, measured_increase - extension_taken_out - rush_taken_out + underwriting_added_back + processing_added_back + fee_added_back),
      2)
  compute_basis:
    latest_estimate_total: >-
      the zero-tolerance total on the latest Loan Estimate on the file, the one with the highest disclosure sequence
    initial_estimate_total: the zero-tolerance total on the initial Loan Estimate
    measured_increase: >-
      The measured increase of the cure is the zero-tolerance total on the latest Loan Estimate on the file, the one with the highest
      disclosure sequence, minus the zero-tolerance total on the initial Loan Estimate, kept with its sign, so that it is negative when
      the latest total is the lower one; a total the file does not carry counts as 0.00.
    borrower_extension_cost: the borrower requested that extension and its dollar cost
    borrower_relock_cost: those relock fees, less such waivers and never below zero, are taken out
    extension_taken_out: >-
      where borrower-borne lock extension entries were booked on any rate lock of the customer less than cure_window_months whole months
      before the cure date, the borrower requested that extension and its dollar cost, less any lock cost waivers Larkspur booked on
      the customer's locks in that period and never below zero, is taken out of the measured increase; where no such extension entry
      was booked in that period but relock fee entries were, those relock fees, less such waivers and never below zero, are taken out;
      where neither was booked in that period, nothing is taken out.
    rush_wanted: where the borrower requested rush turn time on the file's live primary appraisal order
    rush_charged: a rush fee charge is booked on it
    rush_taken_out: >-
      where the borrower requested rush turn time on the file's live primary appraisal order (the order placed on the file with order
      reason standard_order, transferred_in or new_order_after_expiration that is not cancelled; a file carries at most one such order)
      and a rush fee charge is booked on it, the booked rush fee is taken out of the measured increase because the borrower asked for
      it; where the borrower requested rush turn time and no rush fee charge is booked, the report type's rush_fee is taken out; where
      rush turn time was not requested, or the file has no live primary appraisal order, nothing is taken out.
    converted_level: where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval
    underwriting_added_back: >-
      where the pre-approval the file was converted from is a Larkspur Underwritten Pre-Approval, a Larkspur Jumbo Underwritten Pre-Approval
      or a Larkspur Lock & Shop Pre-Approval, the program's underwriting_fee is added back to the measured increase; where it is a Larkspur
      Verified Pre-Approval, underwriting_addback_verified is added back; otherwise nothing is added back.
    heroes_credit_status: where the Hometown Heroes Credit reserved against the file is verified
    heroes_credit_job: for a firefighter, law enforcement or emergency medical occupation
    processing_added_back: >-
      where the Hometown Heroes Credit reserved against the file is verified for a firefighter, law enforcement or emergency medical
      occupation, the program's processing_fee is added back; where it is verified for an active military or veteran, k12 educator or
      nurse occupation, processing_addback_other_heroes is added back; otherwise nothing is added back.
    app_fee_paid: the amount collected
    app_fee_returned: and it has not been refunded
    fee_added_back: >-
      where an application fee collection entry is on the fee ledger, whatever its amount (a 0.00 collection included), and it has not
      been refunded, the difference between the program's application_fee and the amount collected is added back, which is nothing when
      the full program fee was collected; where the collection has been refunded in full, the program's application_fee is added back;
      where no application fee collection is on the ledger, as for a program that charges no application fee, nothing is added back.
    result: >-
      Each amount taken out or added back adjusts the signed measured increase once, in dollars; the cure is that adjusted increase
      where it is above zero and nothing otherwise, rounded to the cent.
    app_fee_collections: >-
      where an application fee collection entry is on the fee ledger, whatever its amount (a 0.00 collection included)
    borrower_extension_entries: >-
      where borrower-borne lock extension entries were booked on any rate lock of the customer less than cure_window_months whole months
      before the cure date
    borrower_relock_entries: where no such extension entry was booked in that period but relock fee entries were
    rush_charge_entries: a rush fee charge is booked on it
    standard_order: >-
      the file's live primary appraisal order (the order placed on the file with order reason standard_order, transferred_in or new_order_after_expiration
      that is not cancelled; a file carries at most one such order)
    latest_estimate_sequence: the latest Loan Estimate on the file, the one with the highest disclosure sequence
    waived_lock_cost: >-
      less any lock cost waivers Larkspur booked on the customer's locks in that period and never below zero
  factors:
  - id: extension_rebaseline
    effect: method
    decides: extension_taken_out
    bindings:
    - borrower_extension_entries
    - borrower_extension_cost
    - borrower_relock_entries
    - borrower_relock_cost
    - waived_lock_cost
    - extension_taken_out
    ladder:
    - when: >-
        borrower-borne lock extension entries were booked less than cure_window_months whole months before the cure date
      method: >-
        take their dollar cost, less lock cost waivers booked in the period (never below zero), out of the measured increase
    - when: no such extension entry, but relock fee entries were booked in that period
      method: take the relock fees, less such waivers (never below zero), out
    - when: otherwise
      method: take nothing out
    baseline:
      extension_taken_out: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: lock
  - id: rush_rebaseline
    effect: method
    decides: rush_taken_out
    bindings:
    - standard_order
    - rush_wanted
    - rush_charge_entries
    - rush_charged
    - rush_taken_out
    ladder:
    - when: the borrower requested rush turn time and a rush fee charge is booked
      method: take the booked rush fee out
    - when: the borrower requested rush turn time and no rush fee charge is booked
      method: take the report type's rush_fee out
    - when: otherwise (rush not requested, or no live primary appraisal order)
      method: take nothing out
    baseline:
      rush_taken_out: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: appraisal
  - id: underwriting_addback
    effect: parameter
    decides: underwriting_added_back
    bindings:
    - converted_level
    - underwriting_added_back
    ladder:
    - when: pre-approval the file was converted from is Underwritten, Jumbo Underwritten or Lock & Shop
      value: P('underwriting_fee')
    - when: pre-approval the file was converted from is Verified
      value: K('underwriting_addback_verified')
    - when: otherwise
      value: '0.0'
    baseline:
      underwriting_added_back: '0.0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: processing_addback
    effect: parameter
    decides: processing_added_back
    bindings:
    - heroes_credit_status
    - heroes_credit_job
    - processing_added_back
    ladder:
    - when: >-
        Hometown Heroes Credit reserved against the file verified for firefighter, law enforcement or emergency medical
      value: P('processing_fee')
    - when: >-
        Hometown Heroes Credit reserved against the file verified for active military or veteran, k12 educator or nurse
      value: K('processing_addback_other_heroes')
    - when: otherwise
      value: '0.0'
    baseline:
      processing_added_back: '0.0'
    evidence:
    - cross_category
    cross_difficulty: credit
  - id: collected_fee_addback
    effect: method
    decides: fee_added_back
    bindings:
    - app_fee_collections
    - app_fee_paid
    - app_fee_returned
    - fee_added_back
    ladder:
    - when: >-
        an application fee collection entry is on the fee ledger, whatever its amount, and it has not been refunded
      method: add back the difference between the program's application_fee and the amount collected
    - when: the collection has been refunded in full
      method: add back the program's application_fee
    - when: otherwise (no collection on the ledger, as for a program that charges no application fee)
      method: add back nothing
    baseline:
      fee_added_back: '0.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The measured increase of the cure is the zero-tolerance total on the latest Loan Estimate on the file, the one with the highest
      disclosure sequence, minus the zero-tolerance total on the initial Loan Estimate, kept with its sign, so that it is negative when
      the latest total is the lower one; a total the file does not carry counts as 0.00. The standard zero-tolerance cure is the measured
      increase where it is above zero, and nothing otherwise.
    params: []
  inputs:
    history:
    - table: loan_disclosures
      aggregate: latest
      field: zero_tolerance_total
      filters:
        disclosure_form: loan_estimate
    - category: lock
      table: lock_pricing_events
      aggregate: sum
      field: cost_amount
      within_months: 1
      filters:
        event_type: lock_extension_booked
        cost_bearer: borrower
    - table: loan_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: loan_application_fee_collected
    cross_category:
    - lock
    - appraisal
    - preapproval
    - credit
- id: loan_ext_closing_disclosure_lender_credit
  base_policy_refs:
  - loan_closing_disclosure_timing
  overwrite: []
  trigger: state_due
  subject:
  - loan_cd_issued
  computes: lender_credit_amount
  target_tool: issue_closing_disclosure_6debf4ff
  params:
    ron_closing_credit: 250.0
    hybrid_closing_credit: 150.0
    recent_returning_credit: 250.0
    earlier_returning_credit: 100.0
    returning_window_months: 36
    short_notice_days: 7
    late_notice_days: 10
    short_notice_credit: 100.0
    late_notice_credit: 50.0
  rule: >-
    Larkspur issues the initial Closing Disclosure of a file that is clear to close as the first Closing Disclosure on the file, sent
    through the e-sign portal, and fixes on it the total lender credits. A Closing Disclosure is never dated on a day on which a Loan
    Estimate was issued on the file: when a Loan Estimate was issued on the file on the day the Closing Disclosure is prepared, the
    Closing Disclosure is dated and delivered on the next business day, a business day being Monday through Friday excluding the US
    federal public holidays observed by the Federal Reserve Banks; otherwise it is dated and delivered on the day it is prepared. The
    standard lender credit on an initial Closing Disclosure is the application fee collected on the file where the program credits that
    fee at closing, plus the lender credit disclosed on the initial Loan Estimate (0.00 where the initial Loan Estimate shows none).
    Lock pricing credit on the Closing Disclosure, read from the file's rate lock in locked status: where that lock carries a negative
    net price, the credit from the lock is the lock's price points times the loan amount the lock was priced on, divided by 100, as
    a positive amount rounded to the cent, and it replaces the initial Loan Estimate's lender credit; where it carries a zero or positive
    net price, the lock gives no credit and the initial Loan Estimate's lender credit is dropped; where the file has no rate lock in
    locked status, the initial Loan Estimate's lender credit stays. Tolerance cure credit on the Closing Disclosure: where tolerance
    cures with cure method credit_at_closing are assessed on the file and not yet paid, their unpaid amount is added; where no such
    entry is open but tolerance cures with cure method post_closing_refund are assessed on the file and not yet paid, their unpaid amount
    is moved onto the Closing Disclosure and added; otherwise nothing is added. Digital closing credit on the Closing Disclosure, read
    from the file's closing in scheduled status: where that closing is a Larkspur Remote Online Notarization Closing, ron_closing_credit
    is added; where it is a Larkspur Hybrid eClosing, hybrid_closing_credit is added; for any other closing method, or where the file
    has no closing in scheduled status, nothing is added. Returning-borrower credit on the Closing Disclosure, read from the date of
    the most recent funding wire Larkspur sent on any closing of the customer: where that wire was sent less than returning_window_months
    whole months before the day the Closing Disclosure is prepared, recent_returning_credit is added; where it was sent returning_window_months
    or more whole months before the day the Closing Disclosure is prepared, earlier_returning_credit is added; where Larkspur has sent
    no funding wire on any closing of the customer, nothing is added. Short-notice credit on the Closing Disclosure: where the scheduled
    closing date is short_notice_days or fewer calendar days after the day the Closing Disclosure is prepared, short_notice_credit is
    added; where it is more than short_notice_days but no more than late_notice_days calendar days after, late_notice_credit is added;
    where it is later than that, or the file has no scheduled closing date on or after that day, nothing is added. Closing cost credit
    line on the Closing Disclosure: where award entries have been booked on the customer's closing cost credits, the standing balance
    of those credits is added, that is the award and guarantee payout entries less the entries that applied, reduced or forfeited them;
    where no award has been booked but closing cost credits against the file are in reserved status, the fixed_credit_amount of every
    program reserved against the file (one credit per program) is added up as an estimate, a percentage or guarantee program counting
    0.00; where neither holds, nothing is added. The short-notice and returning-borrower credits are counted from the day the Closing
    Disclosure is prepared, not from the later date it may carry under the dating rule. All the credits are added together once, in
    dollars, and the total is rounded to the cent. The lender credits on a Closing Disclosure are fixed only after the fee ledger carries
    the application fee collected on the file, wherever the program the file is in charges an application fee. The lender credits on
    a Closing Disclosure are not fixed until every zero-tolerance increase over the good-faith baseline has a cure entry assessed on
    the file.
  prerequisite:
  - problem: loan_ext_application_fee_due
    kind: value_input
    gate: fee_credit
    form: state
    policy_source: >-
      The lender credits on a Closing Disclosure are fixed only after the fee ledger carries the application fee collected on the file,
      wherever the program the file is in charges an application fee.
    condition: >-
      the loan file's fee ledger carries a loan_application_fee_collected entry, or the program the file is in has an application_fee
      of 0.00
    resolved_by: pay_application_fee_6c3f9eab
    effect: >-
      once the application fee is collected, the standard credit includes the amount collected, credited back at closing
  - problem: loan_ext_zero_tolerance_cure
    kind: value_input
    gate: cure_credit
    form: state
    policy_source: >-
      The lender credits on a Closing Disclosure are not fixed until every zero-tolerance increase over the good-faith baseline has
      a cure entry assessed on the file.
    condition: >-
      the loan file's tolerance cures carry an assessed zero_tolerance entry measured on the latest Loan Estimate for any adjusted increase
      above zero
    resolved_by: assess_tolerance_cure_d5e015cb
    effect: >-
      once the cure is assessed with cure method credit_at_closing, the tolerance cure credit adds its unpaid amount
  cross_category:
  - category: lock
    as: branch
    reads:
    - status
    - lock_price_points
    - loan_amount_at_lock
    note: the lock pricing credit reads the file's rate lock in locked status.
  - category: funding
    as: history
    reads:
    - variant_name
    - status
    - funding_wires.wire_date
    note: >-
      the digital closing credit reads the file's closing method and the returning-borrower credit the date of the customer's most recent
      funding wire.
  - category: credit
    as: history
    reads:
    - credit_ledger.entry_amount
    - credit_ledger.event_type
    - status
    - fixed_credit_amount
    note: >-
      the closing cost credit line adds the standing balance of the customer's credits from the credit ledger, or the reserved credit's
      fixed amount as an estimate.
  compute:
  - fee_credit: >-
      SUM('loan_fee_ledger', 'amount', event_type='loan_application_fee_collected') if P('application_fee_credited_at_closing') == True
      else 0.0
  - initial_estimate_credit: >-
      (LATEST('loan_disclosures', 'lender_credit_amount', date_field='issued_date', event_type='loan_le_issued') or 0.0)
  - lock_state: CFIELD('lock', 'status', loan_file_id=HID, status='locked')
  - lock_points: CFIELD('lock', 'lock_price_points', loan_file_id=HID, status='locked')
  - lock_credit: >-
      RND(0.0 - lock_points * CFIELD('lock', 'loan_amount_at_lock', loan_file_id=HID, status='locked') / 100, 2) if (lock_state == 'locked'
      and lock_points < 0) else (0.0 if lock_state == 'locked' else initial_estimate_credit)
  - open_cures: >-
      SUM('loan_tolerance_cures', 'cure_amount', event_type='loan_tolerance_cure_assessed', cure_method='credit_at_closing') - SUM('loan_tolerance_cures',
      'cure_amount', event_type='loan_tolerance_cure_paid', cure_method='credit_at_closing')
  - open_refund_cures: >-
      SUM('loan_tolerance_cures', 'cure_amount', event_type='loan_tolerance_cure_assessed', cure_method='post_closing_refund') - SUM('loan_tolerance_cures',
      'cure_amount', event_type='loan_tolerance_cure_paid', cure_method='post_closing_refund')
  - cure_credit: open_cures if open_cures > 0 else (open_refund_cures if open_refund_cures > 0 else 0.0)
  - closing_method: CFIELD('funding', 'variant_name', loan_file_id=HID, status='scheduled')
  - digital_credit: >-
      K('ron_closing_credit') if closing_method == 'Larkspur Remote Online Notarization Closing' else (K('hybrid_closing_credit') if
      closing_method == 'Larkspur Hybrid eClosing' else 0.0)
  - earlier_funding: >-
      XLATEST('funding', 'funding_wires', 'wire_date', date_field='wire_date', event_type='funding_wire_sent')
  - returning_credit: >-
      K('recent_returning_credit') if (earlier_funding and MONTHS(earlier_funding, NOW) < K('returning_window_months')) else (K('earlier_returning_credit')
      if earlier_funding else 0.0)
  - notice_days: DAYS(NOW, F('estimated_closing_date')) if F('estimated_closing_date') else -1
  - notice_credit: >-
      0.0 if notice_days < 0 else (K('short_notice_credit') if notice_days <= K('short_notice_days') else (K('late_notice_credit') if
      notice_days <= K('late_notice_days') else 0.0))
  - award_entries: XCOUNT('credit', 'credit_ledger', event_type='credit_award_booked')
  - standing_credit: >-
      XSUM('credit', 'credit_ledger', 'entry_amount', event_type='credit_award_booked') + XSUM('credit', 'credit_ledger', 'entry_amount',
      event_type='credit_guarantee_payout_booked') - XSUM('credit', 'credit_ledger', 'entry_amount', event_type='credit_applied_at_closing')
      - XSUM('credit', 'credit_ledger', 'entry_amount', event_type='credit_reduced') - XSUM('credit', 'credit_ledger', 'entry_amount',
      event_type='credit_balance_forfeited')
  - reserved_credit: CFIELD('credit', 'status', loan_file_id=HID, status='reserved')
  - reserved_estimate: >-
      (CPARAM('credit', 'fixed_credit_amount', loan_file_id=HID, status='reserved', variant_name='Larkspur Hometown Heroes Credit')
      or 0.0) + (CPARAM('credit', 'fixed_credit_amount', loan_file_id=HID, status='reserved', variant_name='Larkspur Returning Customer
      Credit') or 0.0) + (CPARAM('credit', 'fixed_credit_amount', loan_file_id=HID, status='reserved', variant_name='Larkspur First
      Home Credit') or 0.0) + (CPARAM('credit', 'fixed_credit_amount', loan_file_id=HID, status='reserved', variant_name='Larkspur On-Time
      Closing Guarantee') or 0.0) + (CPARAM('credit', 'fixed_credit_amount', loan_file_id=HID, status='reserved', variant_name='Larkspur
      Builder Partner Credit') or 0.0) + (CPARAM('credit', 'fixed_credit_amount', loan_file_id=HID, status='reserved', variant_name='Larkspur
      Neighborhood Access Grant') or 0.0) + (CPARAM('credit', 'fixed_credit_amount', loan_file_id=HID, status='reserved', variant_name='Larkspur
      Neighborhood Access Grant Plus') or 0.0)
  - award_credit: standing_credit if award_entries >= 1 else (reserved_estimate if reserved_credit else 0.0)
  - result: >-
      RND(fee_credit + lock_credit + cure_credit + digital_credit + returning_credit + notice_credit + award_credit, 2)
  compute_basis:
    fee_credit: >-
      The standard lender credit on an initial Closing Disclosure is the application fee collected on the file where the program credits
      that fee at closing, plus the lender credit disclosed on the initial Loan Estimate (0.00 where the initial Loan Estimate shows
      none).
    initial_estimate_credit: plus the lender credit disclosed on the initial Loan Estimate
    lock_state: read from the file's rate lock in locked status
    lock_points: >-
      the credit from the lock is the lock's price points times the loan amount the lock was priced on, divided by 100, as a positive
      amount rounded to the cent
    lock_credit: >-
      where that lock carries a negative net price, the credit from the lock is the lock's price points times the loan amount the lock
      was priced on, divided by 100, as a positive amount rounded to the cent, and it replaces the initial Loan Estimate's lender credit;
      where it carries a zero or positive net price, the lock gives no credit and the initial Loan Estimate's lender credit is dropped;
      where the file has no rate lock in locked status, the initial Loan Estimate's lender credit stays.
    open_cures: >-
      where tolerance cures with cure method credit_at_closing are assessed on the file and not yet paid, their unpaid amount is added
    cure_credit: >-
      where tolerance cures with cure method credit_at_closing are assessed on the file and not yet paid, their unpaid amount is added;
      where no such entry is open but tolerance cures with cure method post_closing_refund are assessed on the file and not yet paid,
      their unpaid amount is moved onto the Closing Disclosure and added; otherwise nothing is added.
    closing_method: read from the file's closing in scheduled status
    digital_credit: >-
      where that closing is a Larkspur Remote Online Notarization Closing, ron_closing_credit is added; where it is a Larkspur Hybrid
      eClosing, hybrid_closing_credit is added; for any other closing method, or where the file has no closing in scheduled status,
      nothing is added.
    earlier_funding: read from the date of the most recent funding wire Larkspur sent on any closing of the customer
    returning_credit: >-
      where that wire was sent less than returning_window_months whole months before the day the Closing Disclosure is prepared, recent_returning_credit
      is added; where it was sent returning_window_months or more whole months before the day the Closing Disclosure is prepared, earlier_returning_credit
      is added; where Larkspur has sent no funding wire on any closing of the customer, nothing is added.
    notice_days: >-
      where the scheduled closing date is short_notice_days or fewer calendar days after the day the Closing Disclosure is prepared
    notice_credit: >-
      where the scheduled closing date is short_notice_days or fewer calendar days after the day the Closing Disclosure is prepared,
      short_notice_credit is added; where it is more than short_notice_days but no more than late_notice_days calendar days after, late_notice_credit
      is added; where it is later than that, or the file has no scheduled closing date on or after that day, nothing is added.
    award_credit: >-
      where award entries have been booked on the customer's closing cost credits, the standing balance of those credits is added, that
      is the award and guarantee payout entries less the entries that applied, reduced or forfeited them; where no award has been booked
      but closing cost credits against the file are in reserved status, the fixed_credit_amount of every program reserved against the
      file (one credit per program) is added up as an estimate, a percentage or guarantee program counting 0.00; where neither holds,
      nothing is added.
    result: >-
      The short-notice and returning-borrower credits are counted from the day the Closing Disclosure is prepared, not from the later
      date it may carry under the dating rule. All the credits are added together once, in dollars, and the total is rounded to the
      cent.
    open_refund_cures: tolerance cures with cure method post_closing_refund are assessed on the file and not yet paid
    award_entries: where award entries have been booked on the customer's closing cost credits
    standing_credit: >-
      the standing balance of those credits is added, that is the award and guarantee payout entries less the entries that applied,
      reduced or forfeited them
    reserved_credit: where no award has been booked but closing cost credits against the file are in reserved status
    reserved_estimate: >-
      the fixed_credit_amount of every program reserved against the file (one credit per program) is added up as an estimate, a percentage
      or guarantee program counting 0.00
  factors:
  - id: lock_pricing_credit
    effect: method
    decides: lock_credit
    bindings:
    - lock_state
    - lock_points
    - lock_credit
    ladder:
    - when: the file's rate lock in locked status carries a negative net price
      method: >-
        credit from the lock: price points times the loan amount the lock was priced on, divided by 100, replacing the initial Loan
        Estimate's credit
    - when: it carries a zero or positive net price
      method: no credit from the lock; the initial Loan Estimate's credit is dropped
    - when: otherwise (no rate lock in locked status)
      method: the initial Loan Estimate's lender credit stays
    baseline:
      lock_credit: initial_estimate_credit
    evidence:
    - cross_category
    cross_difficulty: lock
  - id: open_cure_credit
    effect: method
    decides: cure_credit
    bindings:
    - open_cures
    - open_refund_cures
    - cure_credit
    ladder:
    - when: tolerance cures with cure method credit_at_closing are assessed on the file and not yet paid
      method: add their unpaid amount
    - when: >-
        no such entry is open but tolerance cures with cure method post_closing_refund are assessed and unpaid
      method: move their unpaid amount onto the Closing Disclosure and add it
    - when: otherwise
      method: add nothing
    baseline:
      cure_credit: '0.0'
    evidence:
    - history
    cross_difficulty: null
  - id: digital_closing_credit
    effect: parameter
    decides: digital_credit
    bindings:
    - closing_method
    - digital_credit
    ladder:
    - when: the file's closing in scheduled status is a Larkspur Remote Online Notarization Closing
      value: K('ron_closing_credit')
    - when: it is a Larkspur Hybrid eClosing
      value: K('hybrid_closing_credit')
    - when: otherwise (another method, or no closing in scheduled status)
      value: '0.0'
    baseline:
      digital_credit: '0.0'
    evidence:
    - cross_category
    cross_difficulty: funding
  - id: returning_borrower_credit
    effect: parameter
    decides: returning_credit
    bindings:
    - earlier_funding
    - returning_credit
    ladder:
    - when: >-
        the most recent funding wire Larkspur sent on any closing of the customer was sent less than returning_window_months whole months
        before the day the Closing Disclosure is prepared
      value: K('recent_returning_credit')
    - when: >-
        that wire was sent returning_window_months or more whole months before the day the Closing Disclosure is prepared
      value: K('earlier_returning_credit')
    - when: otherwise (no funding wire sent on any closing of the customer)
      value: '0.0'
    baseline:
      returning_credit: '0.0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: funding
  - id: notice_period_credit
    effect: parameter
    decides: notice_credit
    bindings:
    - notice_days
    - notice_credit
    ladder:
    - when: >-
        the scheduled closing date is short_notice_days or fewer calendar days after the day the Closing Disclosure is prepared
      value: K('short_notice_credit')
    - when: it is more than short_notice_days but no more than late_notice_days calendar days after
      value: K('late_notice_credit')
    - when: otherwise (later, or no scheduled closing date on or after the preparation day)
      value: '0.0'
    baseline:
      notice_credit: '0.0'
    evidence:
    - date
    cross_difficulty: null
  - id: reserved_award_line
    effect: method
    decides: award_credit
    bindings:
    - award_entries
    - standing_credit
    - reserved_credit
    - reserved_estimate
    - award_credit
    ladder:
    - when: award entries have been booked on the customer's closing cost credits
      method: >-
        add the standing balance: award and guarantee payout entries less applied, reduced and forfeited entries
    - when: no award booked, but closing cost credits against the file are in reserved status
      method: add up the fixed_credit_amount of every program reserved against the file as an estimate
    - when: otherwise
      method: add nothing
    baseline:
      award_credit: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: credit
  baseline:
    rule: >-
      The standard lender credit on an initial Closing Disclosure is the application fee collected on the file where the program credits
      that fee at closing, plus the lender credit disclosed on the initial Loan Estimate (0.00 where the initial Loan Estimate shows
      none).
    params:
    - application_fee_credited_at_closing
  inputs:
    history:
    - table: loan_fee_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: loan_application_fee_collected
    - table: loan_tolerance_cures
      aggregate: sum
      field: cure_amount
      filters:
        event_type: loan_tolerance_cure_assessed
        cure_method: credit_at_closing
    - category: funding
      table: funding_wires
      aggregate: latest
      field: wire_date
      filters:
        event_type: funding_wire_sent
    - category: credit
      table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_award_booked
    cross_category:
    - lock
    - funding
    - credit
