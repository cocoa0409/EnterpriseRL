  - rw_gap: DAYS(rw_ret_day, F('disbursement_date')) if rw_ret_day != None else 0
  - rw_end_off: rw_std_off if (rw_lark and rw_gap > rw_std_off) else ((rw_gap - 1) if (rw_lark and rw_gap <= rw_std_off)
