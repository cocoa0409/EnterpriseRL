  baseline:
    rule: A returned-wire refund returns the prepaid interest a funded closing collected for the lost days of a
      Larkspur-side return, the days the loan went unfunded because Larkspur's own wire came back. For a returned-wire
      refund, the charge collected at closing is the closing's prepaid interest charge booked on the signing date,
      and lost days are counted only within that charge's period. A returned-wire refund counts lost days only between
      a first lost day and a last lost day; without both there are no lost days and the refund is zero. Each lost
      day is refunded at the daily amount the charge collected at closing used. The returned-wire refund is the
      lost days times that daily amount, rounded half up to the cent.
    params: []
- id: funding_ext_funding_month_interest
  base_policy_refs:
  - funding_per_diem_interest
  overwrite:
  - base_policy: funding_per_diem_interest
    superseded_clause: daily_interest_amount is loan_amount times note_rate percent divided by per_diem_day_count_basis,
      rounded to per_diem_daily_rounding_decimals
    replaced_by: 'A prepaid interest entry other than a funding-month interest payment or a per diem shortfall payment,
      the charge collected at closing included, keeps the per diem policy''s daily amount: the closing''s loan amount
      times its note rate taken as a percent, divided by the per diem day-count basis, rounded to the per diem rounding
      decimals. For funding-month interest, and never for a per diem shortfall, the per diem is the loan file''s
      loan amount times the rate the closing''s lock holds, taken as a percent, divided by the per diem day-count
      basis, rounded half up to the cent.'
  - base_policy: funding_per_diem_interest
    superseded_clause: when disbursement moves into the next month, every day collected for the earlier month is
      refunded
    replaced_by: When disbursement moves into the next month, every day collected for the earlier month is refunded;
      an open earlier-month day is refunded by setoff against the funding-month interest when the borrower pays
      it.
  trigger: state_due
  subject:
  - funding_per_diem_charged
  computes: interest_amount
  target_tool: pay_funding_month_interest_3474c980
  params:
    card_convenience_pct: 2.5
    card_no_surcharge_states:
    - CT
    - MA
    - ME
    card_capped_states:
    - CO
    card_surcharge_cap_pct: 2.0
    debit_card_fee: 3.95
  rule: 'Funding-month interest is the prepaid interest a borrower pays after closing for the month in which the
    loan funded, where the disbursement date falls after the last day of the charge collected at closing, and the
    borrower pays it on their own instruction. For funding-month interest, the charge collected at closing is the
    closing''s prepaid interest charge booked on the signing date. The funding-month interest is fixed only after
    the closing''s prepaid interest ledger carries the returned-wire refund owed for the days a Larkspur-side return
    cost. The funding-month interest is fixed only after the closing''s fee ledger carries the redraw fee refund
    owed for a redraw charged above Larkspur''s redraw schedule. The funding-month interest runs from the disbursement
    date through the last day of the disbursement month, both days counted; the disbursement month''s last day is
    the day before the first day of the following month, February having 29 days in a year divisible by four and
    28 otherwise, April, June, September and November 30 and every other month 31; it is found as the days from
    the disbursement date to the first payment date, which falls on the first day of the second month after the
    disbursement month, less the days of the month in between. A prepaid interest entry other than a funding-month
    interest payment or a per diem shortfall payment, the charge collected at closing included, keeps the per diem
    policy''s daily amount: the closing''s loan amount times its note rate taken as a percent, divided by the per
    diem day-count basis, rounded to the per diem rounding decimals. For funding-month interest, and never for a
    per diem shortfall, the per diem is the loan file''s loan amount times the rate the closing''s lock holds, taken
    as a percent, divided by the per diem day-count basis, rounded half up to the cent. The funding-month interest
    is its days times that per diem, rounded half up to the cent. The open earlier-month days are the days of the
    charge collected at closing that no prepaid interest refund naming that charge has returned. When disbursement
    moves into the next month, every day collected for the earlier month is refunded; an open earlier-month day
    is refunded by setoff against the funding-month interest when the borrower pays it. The redraw fee refunds on
    the closing, the reversals of doc redraw fee charges for the part charged above Larkspur''s redraw schedule,
    are applied to the funding-month interest the borrower owes rather than paid out separately. The amount the
    borrower pays is the funding-month interest less the setoff and less the redraw fee refunds, rounded half up
    to the cent and never below zero, plus any payment channel charge. The standard funding-month payment carries
    no setoff and no payment channel charge. The setoff per diem of an open earlier-month day is set as follows:
    where open earlier-month days remain and the charge collected at closing used a daily amount above the funding-month
    per diem, it is the funding-month per diem, and the rest of that day''s daily amount is not set off and stays
    on the charge collected at closing; where open days remain and the charge''s daily amount is at or below the
    funding-month per diem, it is the charge''s daily amount; otherwise there is no setoff per diem. The setoff
    is worked out as follows: where open earlier-month days remain and those days at the setoff per diem come to
    no more than the funding-month interest, the setoff is those days times the setoff per diem; where they come
    to more, the setoff is the whole funding-month interest and the rest stays with the earlier-month refund; otherwise
    there is no setoff. Larkspur''s payment channel charge for funding-month interest follows the payment method
    on the borrower''s latest loan fee entry for the file: where it is a credit card, the charge is the card convenience
    percentage of the amount due before the channel charge, rounded half up to the cent; where it is a debit card,
    the charge is the flat debit_card_fee; otherwise, for an ACH debit or a Closing Disclosure credit, there is
    no channel charge. The channel charge is a payment processing charge, not a closing fee. The card convenience
    percentage follows Larkspur''s card surcharge schedule for the property''s state on the loan file: where the
    state is one of card_no_surcharge_states, where Larkspur adds no card surcharge, it is zero; where the state
    is one of card_capped_states, it is card_surcharge_cap_pct; otherwise it is card_convenience_pct. The payment
    is recorded as a prepaid interest charge for the funding-month interest days at the funding-month per diem,
    with the amount the borrower pays as its amount.'
  prerequisite:
  - problem: funding_ext_returned_wire_refund
    kind: value_input
    gate: fm_open_days
    form: state
    policy_source: The funding-month interest is fixed only after the closing's prepaid interest ledger carries
      the returned-wire refund owed for the days a Larkspur-side return cost.
    condition: the closing's funding_interest_ledger carries a funding_per_diem_refunded entry with refund_reason
      returned_wire_delay naming the charge collected at closing, for the lost days of the Larkspur-side return
    resolved_by: refund_returned_wire_interest_891dcbc9
    effect: the returned-wire refund's days stop being open earlier-month days, so only the remaining open days
      are set off against the funding-month interest
  - problem: funding_ext_redraw_fee_refund
    kind: value_input
    gate: fm_fee_credit
    form: state
    policy_source: The funding-month interest is fixed only after the closing's fee ledger carries the redraw fee
      refund owed for a redraw charged above Larkspur's redraw schedule.
    condition: the closing's funding_fee_ledger carries a funding_fee_reversed entry for doc_redraw_fee with reversal_reason
      not_in_fee_schedule naming the latest doc redraw fee charge, for the part charged above the redraw schedule
    resolved_by: refund_redraw_fee_excess_c6a6aba4
    effect: the redraw fee refund is applied to the funding-month interest, lowering the amount the borrower pays
      by it
  cross_category:
  - category: loan
    as: value
    reads:
    - loan_amount
    - property_state
    - loan_fee_ledger.payment_method
    note: the loan file's loan amount prices the funding-month per diem, its property state sets the card convenience
      percentage and its latest fee payment method sets the payment channel charge
  - category: lock
    as: value
    reads:
    - locked_rate
    note: the lock's rate prices the funding-month per diem
  inputs:
    history:
    - table: funding_interest_ledger
      aggregate: sum
      field: interest_days
      filters:
        event_type: funding_per_diem_refunded
    - category: loan
      table: loan_fee_ledger
      aggregate: latest
      field: payment_method
      filters: {}
    - table: funding_fee_ledger
