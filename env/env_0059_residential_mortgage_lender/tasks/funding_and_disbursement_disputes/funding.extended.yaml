    - dd_file_amt
    - dd_lock_rate
    - dd_rate
    ladder:
    - when: the closing record's loan amount or note rate differs from the loan file and the lock
      value: the rate the lock holds
    - when: no such difference and the decision comes later than the dispute response business days
      value: late_decision_interest_pct
    - when: otherwise
      value: no interest
    baseline:
      dd_rate: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: lock
  - id: dd_excess_interest_days
    effect: method
    decides: dd_idays
    bindings:
    - dd_filed_wd
    - dd_ack_off
    - dd_resp_off
    - dd_since
    - dd_idays
    ladder:
    - when: the decision comes later than the dispute response business days after the filing date
      method: count from the disbursement date up to the decision date
    - when: the decision comes later than the acknowledgment business days but no later than the response business
        days
      method: count from the filing date up to the decision date
    - when: otherwise
      method: count no interest days
    baseline:
      dd_idays: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: A prepaid interest dispute decision decides a borrower's pending per diem overcharge dispute on a funded
      closing by recomputing what the disputed charge still holds. In the standard recompute, the disputed charge
      is the closing's latest prepaid interest charge. In the standard recompute, the standing days are every day
      of the disputed charge. The excess is the standing days times the refund per standing day, rounded half up
      to the cent. In the standard recompute, the refund per standing day is zero. In the standard recompute, the
      excess carries no interest. A decision with a refund above zero is issued as refund_issued with the refund
      as its amount; a decision with nothing to refund is denied as correct as charged with an amount of zero.
    params: []
- id: funding_ext_redraw_fee_refund
  base_policy_refs:
  - funding_closing_fees
  - funding_document_package
  - funding_dispute_resolution
  overwrite:
  - base_policy: funding_document_package
    superseded_clause: the redraw is charged doc_redraw_fee when the reason is the borrower's (a borrower-requested
      change or a missed signing)
    replaced_by: A redraw whose reason is the borrower's (a borrower-requested change or a missed signing) is charged
      on the Closing Disclosure at no more than the scheduled redraw fee, and a redraw Larkspur caused stays free.
  - base_policy: funding_closing_fees
    superseded_clause: doc_redraw_fee once per borrower-caused redraw
    replaced_by: A doc redraw fee is charged once per borrower-caused redraw, on the Closing Disclosure; the part
      of it above the scheduled redraw fee is refunded after closing as a redraw fee refund, and no redraw fee is
      ever charged or raised after closing.
  trigger: state_due
  subject:
  - funding_fee_reversed
  computes: amount
  target_tool: refund_redraw_fee_excess_c6a6aba4
  params:
    enote_redraw_fee: 90.0
    hybrid_redraw_fee: 110.0
    rush_redraw_fee: 25.0
    next_day_redraw_fee: 15.0
    multi_unit_rider_fee: 30.0
    condo_pud_rider_fee: 15.0
    government_addenda_fee: 10.0
    homeready_addenda_fee: 5.0
    additional_signer_set_fee: 10.0
    second_redraw_fee: 20.0
    third_redraw_fee: 40.0
  rule: 'A redraw fee refund returns to the borrower the part of a closing''s latest doc redraw fee that the Closing
    Disclosure charged above Larkspur''s redraw schedule. The redraw fee a redraw fee refund looks at is the closing''s
    latest doc redraw fee charge; the redraws the schedule counts are every doc redraw fee charge on the closing,
    and the latest one is the redraw being priced. A doc redraw fee charge that a reversal already names is not
    reversed again, so once its refund is booked nothing further is owed on that redraw. A redraw whose reason is
    the borrower''s (a borrower-requested change or a missed signing) is charged on the Closing Disclosure at no
    more than the scheduled redraw fee, and a redraw Larkspur caused stays free. A doc redraw fee is charged once
    per borrower-caused redraw, on the Closing Disclosure; the part of it above the scheduled redraw fee is refunded
    after closing as a redraw fee refund, and no redraw fee is ever charged or raised after closing. The redraw
    package price is the redraw base price plus the rush, rider and program addenda add-ons. The scheduled redraw
    fee is the signer-set price of the redraw package price plus the repeat-redraw fee, rounded half up to the cent.
    The redraw fee refund is the amount charged for the redraw being priced less the scheduled redraw fee, never
    below zero. In the standard schedule, the redraw base price is the closing method''s doc redraw fee, the signer-set
    price is the redraw package price as it stands, and the rush, rider and program addenda add-ons and the repeat-redraw
    fee are zero. The redraw base price is set from the closing method''s package format and the borrower''s E-SIGN
    consent: where the method closes on an eNote and the closing carries an E-SIGN consent dated no later than the
    signing date, it is enote_redraw_fee; where the method uses electronic signing with a paper note and the closing
    carries such a consent, it is hybrid_redraw_fee; otherwise, for a paper package, it is the closing method''s
    doc redraw fee. The rush add-on is set from how close to the signing the redraw was booked: where it was booked
    exactly the closing method''s document draw lead business days before the signing date, the last day the package
    could be drawn, it is rush_redraw_fee; where it was booked one business day earlier than that, it is next_day_redraw_fee;
    otherwise there is none. Business days for the rush add-on are counted Monday through Friday, from the day after
    the booking date through the signing date. The rider add-on is set from the loan file''s property type: where
    it is a two-to-four unit property, it is multi_unit_rider_fee; where it is a condominium or a townhouse, it
    is condo_pud_rider_fee; otherwise there is none. The program addenda add-on is set from the loan file''s program:
    where it is the Larkspur FHA 30-Year Fixed or the Larkspur VA 30-Year Fixed, it is government_addenda_fee; where
    it is the Larkspur HomeReady 30-Year Fixed, it is homeready_addenda_fee; otherwise there is none. The signer-set
    price is set from the loan file''s borrower count: where more borrowers sign than the closing method seats in
    one session, the redraw package price is charged once for every session needed, the borrowers divided by the
    seats and rounded up; where two or more borrowers sign within one session, it is the redraw package price plus
    additional_signer_set_fee for each borrower beyond the first; otherwise it is the redraw package price as it
    stands. The repeat-redraw fee is set from the number of doc redraw fee charges on the closing: where the redraw
    being priced is the third or a later one, it is third_redraw_fee; where it is the second, it is second_redraw_fee;
    otherwise there is none. The refund is booked as a reversal of the redraw being priced, naming that charge,
    for the part above the schedule, marked as the part not in the fee schedule; a doc redraw fee is a fee the closing
    method''s schedule carries, so the reversal in full of a fee the schedule does not carry never applies to it.'
  prerequisite: []
  cross_category:
  - category: loan
    as: value
    reads:
    - property_type
    - variant_name
    - borrower_count
    note: the loan file's property type, program and borrower count set the rider, addenda and signer-set pricing
  inputs:
    history:
    - table: funding_fee_ledger
      aggregate: count
      field: closing_fee_entry_id
      filters:
        event_type: funding_fee_charged
        fee_code: doc_redraw_fee
    cross_category:
    - loan
  compute:
  - rd_id: LATEST('funding_fee_ledger', 'closing_fee_entry_id', date_field='entry_date', event_type='funding_fee_charged',
      fee_code='doc_redraw_fee')
  - rd_charged: LATEST('funding_fee_ledger', 'amount', date_field='entry_date', event_type='funding_fee_charged',
      fee_code='doc_redraw_fee')
  - rd_booked: LATEST('funding_fee_ledger', 'entry_date', date_field='entry_date', event_type='funding_fee_charged',
      fee_code='doc_redraw_fee')
  - rd_rev: COUNT('funding_fee_ledger', event_type='funding_fee_reversed', source_fee_entry_id=rd_id) if rd_id !=
      None else 0
  - rd_count: COUNT('funding_fee_ledger', event_type='funding_fee_charged', fee_code='doc_redraw_fee')
  - rd_consent: DAYS(F('esign_consent_date'), F('signing_date')) if F('esign_consent_date') else -1
  - rd_format: K('enote_redraw_fee') if (P('enote') == True and P('esign_consent_required') == True and rd_consent
      >= 0) else (K('hybrid_redraw_fee') if (P('enote') == False and P('esign_consent_required') == True and rd_consent
      >= 0) else P('doc_redraw_fee'))
  - rd_lead_days: ((DAYS(rd_booked, F('signing_date')) // 7) * 5 + MX(0, MN((DAYS(rd_booked, F('signing_date'))
      % 7), 4 - (DAYS('1970-01-05', rd_booked) % 7))) + MX(0, (DAYS(rd_booked, F('signing_date')) % 7) - (6 - (DAYS('1970-01-05',
      rd_booked) % 7)))) if rd_booked != None else -1
  - rd_rush: K('rush_redraw_fee') if (rd_booked != None and rd_lead_days == P('docs_draw_lead_business_days')) else
      (K('next_day_redraw_fee') if (rd_booked != None and rd_lead_days == P('docs_draw_lead_business_days') + 1)
      else 0)
  - rd_ptype: CFIELD('loan', 'property_type', loan_file_id=F('loan_file_id'))
  - rd_rider: K('multi_unit_rider_fee') if rd_ptype == 'two_to_four_unit' else (K('condo_pud_rider_fee') if (rd_ptype
      == 'condominium' or rd_ptype == 'townhouse') else 0)
  - rd_program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - rd_addenda: K('government_addenda_fee') if (rd_program == 'Larkspur FHA 30-Year Fixed' or rd_program == 'Larkspur
      VA 30-Year Fixed') else (K('homeready_addenda_fee') if rd_program == 'Larkspur HomeReady 30-Year Fixed' else
      0)
  - rd_sum: rd_format + rd_rush + rd_rider + rd_addenda
  - rd_borrowers: CFIELD('loan', 'borrower_count', loan_file_id=F('loan_file_id'))
  - rd_sets: (rd_sum * ((rd_borrowers + P('max_signers_per_session') - 1) // P('max_signers_per_session'))) if rd_borrowers
      > P('max_signers_per_session') else ((rd_sum + K('additional_signer_set_fee') * (rd_borrowers - 1)) if (rd_borrowers
      >= 2 and rd_borrowers <= P('max_signers_per_session')) else rd_sum)
  - rd_repeat: K('third_redraw_fee') if rd_count >= 3 else (K('second_redraw_fee') if rd_count == 2 else 0)
  - rd_scheduled: RND(rd_sets + rd_repeat, 2)
  - result: MX(0, RND(rd_charged - rd_scheduled, 2)) if (rd_id != None and rd_rev == 0) else 0
  compute_basis:
    rd_id: The redraw fee a redraw fee refund looks at is the closing's latest doc redraw fee charge; the redraws
      the schedule counts are every doc redraw fee charge on the closing, and the latest one is the redraw being
      priced.
    rd_charged: The redraw fee refund is the amount charged for the redraw being priced less the scheduled redraw
      fee, never below zero.
    rd_booked: 'The rush add-on is set from how close to the signing the redraw was booked: where it was booked
      exactly the closing method''s document draw lead business days before the signing date, the last day the package
      could be drawn, it is rush_redraw_fee; where it was booked one business day earlier than that, it is next_day_redraw_fee;
      otherwise there is none. Business days for the rush add-on are counted Monday through Friday, from the day
      after the booking date through the signing date.'
    rd_rev: A doc redraw fee charge that a reversal already names is not reversed again, so once its refund is booked
      nothing further is owed on that redraw.
    rd_count: 'The repeat-redraw fee is set from the number of doc redraw fee charges on the closing: where the
      redraw being priced is the third or a later one, it is third_redraw_fee; where it is the second, it is second_redraw_fee;
      otherwise there is none.'
    rd_consent: 'The redraw base price is set from the closing method''s package format and the borrower''s E-SIGN
      consent: where the method closes on an eNote and the closing carries an E-SIGN consent dated no later than
      the signing date, it is enote_redraw_fee; where the method uses electronic signing with a paper note and the
      closing carries such a consent, it is hybrid_redraw_fee; otherwise, for a paper package, it is the closing
      method''s doc redraw fee.'
    rd_format: 'The redraw base price is set from the closing method''s package format and the borrower''s E-SIGN
      consent: where the method closes on an eNote and the closing carries an E-SIGN consent dated no later than
      the signing date, it is enote_redraw_fee; where the method uses electronic signing with a paper note and the
      closing carries such a consent, it is hybrid_redraw_fee; otherwise, for a paper package, it is the closing
      method''s doc redraw fee.'
    rd_lead_days: 'The rush add-on is set from how close to the signing the redraw was booked: where it was booked
      exactly the closing method''s document draw lead business days before the signing date, the last day the package
      could be drawn, it is rush_redraw_fee; where it was booked one business day earlier than that, it is next_day_redraw_fee;
      otherwise there is none. Business days for the rush add-on are counted Monday through Friday, from the day
      after the booking date through the signing date.'
    rd_rush: 'The rush add-on is set from how close to the signing the redraw was booked: where it was booked exactly
      the closing method''s document draw lead business days before the signing date, the last day the package could
      be drawn, it is rush_redraw_fee; where it was booked one business day earlier than that, it is next_day_redraw_fee;
      otherwise there is none. Business days for the rush add-on are counted Monday through Friday, from the day
      after the booking date through the signing date.'
    rd_ptype: 'The rider add-on is set from the loan file''s property type: where it is a two-to-four unit property,
      it is multi_unit_rider_fee; where it is a condominium or a townhouse, it is condo_pud_rider_fee; otherwise
      there is none.'
    rd_rider: 'The rider add-on is set from the loan file''s property type: where it is a two-to-four unit property,
      it is multi_unit_rider_fee; where it is a condominium or a townhouse, it is condo_pud_rider_fee; otherwise
      there is none.'
    rd_program: 'The program addenda add-on is set from the loan file''s program: where it is the Larkspur FHA 30-Year
      Fixed or the Larkspur VA 30-Year Fixed, it is government_addenda_fee; where it is the Larkspur HomeReady 30-Year
      Fixed, it is homeready_addenda_fee; otherwise there is none.'
    rd_addenda: 'The program addenda add-on is set from the loan file''s program: where it is the Larkspur FHA 30-Year
      Fixed or the Larkspur VA 30-Year Fixed, it is government_addenda_fee; where it is the Larkspur HomeReady 30-Year
      Fixed, it is homeready_addenda_fee; otherwise there is none.'
    rd_sum: The redraw package price is the redraw base price plus the rush, rider and program addenda add-ons.
    rd_borrowers: 'The signer-set price is set from the loan file''s borrower count: where more borrowers sign than
      the closing method seats in one session, the redraw package price is charged once for every session needed,
      the borrowers divided by the seats and rounded up; where two or more borrowers sign within one session, it
      is the redraw package price plus additional_signer_set_fee for each borrower beyond the first; otherwise it
      is the redraw package price as it stands.'
    rd_sets: 'The signer-set price is set from the loan file''s borrower count: where more borrowers sign than the
      closing method seats in one session, the redraw package price is charged once for every session needed, the
      borrowers divided by the seats and rounded up; where two or more borrowers sign within one session, it is
      the redraw package price plus additional_signer_set_fee for each borrower beyond the first; otherwise it is
      the redraw package price as it stands.'
    rd_repeat: 'The repeat-redraw fee is set from the number of doc redraw fee charges on the closing: where the
      redraw being priced is the third or a later one, it is third_redraw_fee; where it is the second, it is second_redraw_fee;
      otherwise there is none.'
    rd_scheduled: The scheduled redraw fee is the signer-set price of the redraw package price plus the repeat-redraw
      fee, rounded half up to the cent.
    result: The redraw fee refund is the amount charged for the redraw being priced less the scheduled redraw fee,
      never below zero.
  factors:
  - id: rd_package_format
    effect: parameter
    decides: rd_format
    bindings:
    - rd_consent
    - rd_format
    ladder:
    - when: the closing method closes on an eNote and an E-SIGN consent dated no later than the signing is on the
        closing
      value: enote_redraw_fee
    - when: the closing method uses electronic signing with a paper note and such a consent is on the closing
      value: hybrid_redraw_fee
    - when: otherwise
      value: the closing method's doc redraw fee
    baseline:
      rd_format: P('doc_redraw_fee')
    evidence:
    - tier_param
    - date
    cross_difficulty: null
  - id: rd_rush_addon
    effect: parameter
    decides: rd_rush
    bindings:
    - rd_booked
    - rd_lead_days
    - rd_rush
    ladder:
    - when: the redraw was booked exactly the closing method's document draw lead business days before the signing
        date
      value: rush_redraw_fee
    - when: the redraw was booked one business day earlier than that
      value: next_day_redraw_fee
    - when: otherwise
      value: no rush add-on
    baseline:
      rd_rush: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: rd_rider_addon
    effect: parameter
    decides: rd_rider
    bindings:
    - rd_ptype
    - rd_rider
    ladder:
    - when: the property is a two-to-four unit property
      value: multi_unit_rider_fee
    - when: the property is a condominium or a townhouse
      value: condo_pud_rider_fee
    - when: otherwise
      value: no rider add-on
    baseline:
      rd_rider: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: rd_program_addenda
    effect: parameter
    decides: rd_addenda
    bindings:
    - rd_program
    - rd_addenda
    ladder:
    - when: the program is the Larkspur FHA 30-Year Fixed or the Larkspur VA 30-Year Fixed
      value: government_addenda_fee
    - when: the program is the Larkspur HomeReady 30-Year Fixed
      value: homeready_addenda_fee
    - when: otherwise
      value: no program addenda add-on
    baseline:
      rd_addenda: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: rd_signer_set_pricing
    effect: method
    decides: rd_sets
    bindings:
    - rd_borrowers
    - rd_sets
    ladder:
    - when: more borrowers sign than the closing method seats in one session
      method: charge the redraw package price once for every session needed (borrowers divided by seats, rounded
        up)
    - when: two or more borrowers sign within one session
      method: add additional_signer_set_fee to the redraw package price for each borrower beyond the first
    - when: otherwise
      method: take the redraw package price as it stands
    baseline:
      rd_sets: rd_sum
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loan
  - id: rd_repeat_fee
    effect: parameter
    decides: rd_repeat
    bindings:
    - rd_count
    - rd_repeat
    ladder:
    - when: the redraw being priced is the third or a later doc redraw fee charge on the closing
      value: third_redraw_fee
    - when: it is the second
      value: second_redraw_fee
    - when: otherwise
      value: no repeat-redraw fee
    baseline:
      rd_repeat: '0'
    evidence:
    - history
    cross_difficulty: null
