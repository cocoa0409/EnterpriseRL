    - rw_resend
    ladder:
    - when: a Larkspur-side return came in after the closing method's funding request cutoff time
      value: the method's returned-wire re-send business days plus one
    - when: a Larkspur-side return came in no later than that cutoff
      value: the method's returned-wire re-send business days
    - when: otherwise
