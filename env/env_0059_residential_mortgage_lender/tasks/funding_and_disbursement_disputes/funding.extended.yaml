      because a charge priced right at closing would have drawn on a credit left unused: where the Larkspur closing
      cost credit whose application at closing paid the largest amount of prepaid items (on whatever date the credit
      rules book that application, and, where two such applications paid the same amount, the later-booked one)
      was also cut back for exceeding the eligible costs on the date that application was booked, the cut-back booked
      with the credit''s application at closing, by at least the remainder after the record-error allowances, the
      cover is that whole remainder; where that credit was cut back on that date by less than that remainder, the
      cover is the amount cut back; otherwise there is no credit cover.'
    sf_cover: 'The credit cover of a per diem shortfall is set from the borrower''s Larkspur closing cost credits,
      because a charge priced right at closing would have drawn on a credit left unused: where the Larkspur closing
      cost credit whose application at closing paid the largest amount of prepaid items (on whatever date the credit
      rules book that application, and, where two such applications paid the same amount, the later-booked one)
      was also cut back for exceeding the eligible costs on the date that application was booked, the cut-back booked
      with the credit''s application at closing, by at least the remainder after the record-error allowances, the
      cover is that whole remainder; where that credit was cut back on that date by less than that remainder, the
      cover is the amount cut back; otherwise there is no credit cover.'
    result: Any record-error allowance comes off the per diem shortfall first, the remainder rounded half up to
      the cent and never below zero, and any credit cover then comes off that remainder, never below zero; what
      is left is what the borrower pays.
  factors:
  - id: sf_measured_days
    effect: method
    decides: sf_days
    bindings:
