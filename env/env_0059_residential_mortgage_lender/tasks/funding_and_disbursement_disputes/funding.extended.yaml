  baseline:
    rule: 'A per diem shortfall is the prepaid interest a borrower still owes on a funded closing whose charge collected
      at closing was priced below the per diem the note supports, and the borrower pays it on their own instruction.
      For a per diem shortfall, the charge collected at closing is the closing''s prepaid interest charge booked
      on the signing date. Every prepaid interest entry other than a per diem shortfall payment or a funding-month
      interest payment, the charge collected at closing included, keeps the per diem policy''s daily amount: the
      closing''s loan amount times its note rate taken as a percent, divided by the per diem day-count basis, rounded
      to the per diem rounding decimals. The shortfall per diem, which prices a per diem shortfall only and never
      funding-month interest, is the loan file''s loan amount times the rate the closing''s lock holds, taken as
      a percent, divided by the per diem day-count basis, rounded half up to the cent. The prepaid interest the
      closing holds for a per diem shortfall is the charge collected at closing less, for every late-funding refund
      that names it, the refunded days times the charge''s daily amount; interest Larkspur added to a refund for
      booking it late is not part of what the closing holds. In the standard measure, the shortfall days are every
      day of the charge collected at closing. The per diem shortfall is the shortfall days times the shortfall per
      diem less the prepaid interest the closing holds, rounded half up to the cent and never below zero.'
    params:
    - per_diem_day_count_basis
- id: funding_ext_returned_wire_refund
  base_policy_refs:
  - funding_per_diem_interest
  - funding_wire_returns
  - funding_dispute_resolution
  overwrite:
  - base_policy: funding_per_diem_interest
    superseded_clause: Interest for days lost to a wire returned for a Larkspur-side reason is refunded (returned_wire_delay)
      where returned_wire_interest_borne_by_larkspur is true.
    replaced_by: The refund is owed as soon as the loan has funded; interest for the lost days of a Larkspur-side
      return is refunded as a returned-wire refund where returned_wire_interest_borne_by_larkspur is true, and an
      unfunded day that is not a lost day is refunded under the rules for funding late, never as a returned-wire
      refund.
  trigger: state_due
  subject:
  - funding_per_diem_refunded
  computes: interest_amount
  target_tool: refund_returned_wire_interest_891dcbc9
  params: {}
  rule: 'A returned-wire refund returns the prepaid interest a funded closing collected for the lost days of a Larkspur-side
    return, the days the loan went unfunded because Larkspur''s own wire came back. For a returned-wire refund,
    the charge collected at closing is the closing''s prepaid interest charge booked on the signing date, and lost
    days are counted only within that charge''s period. The return a returned-wire refund looks at is the closing''s
    latest wire return; it is Larkspur-side when the settlement agent rejected a wire whose amount differs from
    the amount of the wire that funded the loan (Larkspur''s wrong amount) or when Larkspur recalled the wire because
    a prior-to-funding item was open. A returned-wire refund counts lost days only between a first lost day and
    a last lost day; without both there are no lost days and the refund is zero. Each lost day is refunded at the
    daily amount the charge collected at closing used. The returned-wire refund is the lost days times that daily
    amount, rounded half up to the cent. The first lost day is set from the kind of Larkspur-side return: where
    the settlement agent rejected Larkspur''s wrong amount, it is the date the rejected wire went out, since the
    agent could never disburse it; where Larkspur recalled the wire for an open prior-to-funding item, it is the
    recall date, since the funds were good until Larkspur pulled them back; otherwise there is no first lost day.
    The re-send days of Larkspur''s re-send standard are set from when the return came in: where a Larkspur-side
    return came in after the closing method''s funding request cutoff time, they are the method''s returned-wire
    re-send business days plus one; where it came in no later than that cutoff, they are the method''s returned-wire
    re-send business days; otherwise there are none. The re-review days of Larkspur''s re-send standard are set
    from the loan program: where the settlement agent rejected Larkspur''s wrong amount, they are the program''s
    condition review turn time in business days; where Larkspur recalled the wire for an open prior-to-funding item,
    they are the program''s underwriting turn time in business days; otherwise there are none. The relock days of
    Larkspur''s re-send standard are set from the rate lock: where the lock''s expiration before any relock, the
    new expiration date of its latest extension or its original expiration date where it was never extended, falls
    on or after the return date and no later than the last day of the re-send and re-review days, so that the re-send
    needed a relock, and the relock request was logged after the lock''s lock desk cutoff time, they are the lock''s
    confirmation business days plus one; where the lock lapsed in that span and the relock request was logged no
    later than the lock desk cutoff time, they are the lock''s confirmation business days; otherwise there are none.
    Larkspur''s re-send standard is the re-send days plus the re-review days plus the relock days, counted in business
    days Monday through Friday starting with the day after the return date; with no days the standard ends on the
    return date itself. The last lost day is set as follows: where a Larkspur-side return occurred and the wire
    that funded the loan went out later than the last day of Larkspur''s re-send standard, it is the last day of
    the standard, and the later unfunded days are not lost days; where a Larkspur-side return occurred and the wire
    that funded the loan went out no later than the last day of the standard, it is the day before the disbursement
    date; otherwise there is no last lost day. The lost days run from the first lost day through the last lost day,
    both counted, cut back to the last day of the charge collected at closing, and are never fewer than zero. The
    refund entry names the charge collected at closing, records the daily amount used and records its period as
    the lost days counted from the first lost day. A charge that already carries a returned-wire refund is not refunded
    again for a returned wire. The refund is owed as soon as the loan has funded; interest for the lost days of
    a Larkspur-side return is refunded as a returned-wire refund where returned_wire_interest_borne_by_larkspur
    is true, and an unfunded day that is not a lost day is refunded under the rules for funding late, never as a
    returned-wire refund.'
