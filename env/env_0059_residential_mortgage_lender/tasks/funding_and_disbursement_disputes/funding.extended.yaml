  compute:
  - fm_chg_id: LATEST('funding_interest_ledger', 'interest_entry_id', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - fm_chg_through: LATEST('funding_interest_ledger', 'interest_through_date', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - fm_chg_days: LATEST('funding_interest_ledger', 'interest_days', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - fm_chg_daily: LATEST('funding_interest_ledger', 'daily_interest_amount', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - fm_in_scope: F('disbursement_date') > fm_chg_through
  - fm_mbf: 31 if ('-01-' in F('first_payment_date') or '-02-' in F('first_payment_date') or '-04-' in F('first_payment_date')
      or '-06-' in F('first_payment_date') or '-08-' in F('first_payment_date') or '-09-' in F('first_payment_date')
      or '-11-' in F('first_payment_date')) else (30 if ('-05-' in F('first_payment_date') or '-07-' in F('first_payment_date')
      or '-10-' in F('first_payment_date') or '-12-' in F('first_payment_date')) else (29 if ((2000 + (DAYS('2000-03-01',
      F('first_payment_date')) + 182) // 365) % 4 == 0) else 28))
  - fm_days: DAYS(F('disbursement_date'), F('first_payment_date')) - fm_mbf
  - fm_file_amt: CFIELD('loan', 'loan_amount', loan_file_id=F('loan_file_id'))
  - fm_lock_rate: CFIELD('lock', 'locked_rate', lock_id=F('lock_id'))
  - fm_pd: RND(fm_file_amt * fm_lock_rate / 100 / P('per_diem_day_count_basis'), 2)
  - fm_interest: RND(fm_days * fm_pd, 2) if fm_in_scope else 0
  - fm_ref_days: SUM('funding_interest_ledger', 'interest_days', event_type='funding_per_diem_refunded', source_interest_entry_id=fm_chg_id)
  - fm_open_days: MX(0, fm_chg_days - fm_ref_days) if fm_in_scope else 0
  - fm_setoff_pd: fm_pd if (fm_open_days > 0 and fm_chg_daily > fm_pd) else (fm_chg_daily if (fm_open_days > 0 and
      fm_chg_daily <= fm_pd) else 0)
  - fm_setoff: RND(fm_open_days * fm_setoff_pd, 2) if (fm_open_days > 0 and fm_open_days * fm_setoff_pd <= fm_interest)
      else (fm_interest if (fm_open_days > 0 and fm_open_days * fm_setoff_pd > fm_interest) else 0)
  - fm_fee_credit: SUM('funding_fee_ledger', 'amount', event_type='funding_fee_reversed', fee_code='doc_redraw_fee',
      reversal_reason='not_in_fee_schedule') if fm_in_scope else 0
  - fm_base_due: MX(0, RND(fm_interest - fm_setoff - fm_fee_credit, 2))
  - fm_state: CFIELD('loan', 'property_state', loan_file_id=F('loan_file_id'))
  - fm_card_pct: 0 if fm_state in K('card_no_surcharge_states') else (K('card_surcharge_cap_pct') if fm_state in
      K('card_capped_states') else K('card_convenience_pct'))
  - fm_method: XLATEST('loan', 'loan_fee_ledger', 'payment_method', date_field='entry_date', loan_file_id=F('loan_file_id'))
  - fm_channel: RND(fm_base_due * fm_card_pct / 100, 2) if (fm_in_scope and fm_method == 'credit_card') else (K('debit_card_fee')
      if (fm_in_scope and fm_method == 'debit_card') else 0)
  - result: MX(0, RND(fm_base_due + fm_channel, 2))
