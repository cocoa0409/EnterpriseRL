  - rw_lock_exp: rw_ext_exp if rw_ext_exp else CFIELD('lock', 'original_expiration_date', lock_id=F('lock_id'))
  - rw_relock_time: XLATEST('lock', 'lock_requests', 'request_time', date_field='request_date', request_type='relock',
