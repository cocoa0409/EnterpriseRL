    - cross_category
    cross_difficulty: null
  - id: fm_setoff_rule
    effect: method
    decides: fm_setoff
    bindings:
    - fm_chg_days
    - fm_setoff
    ladder:
    - when: open earlier-month days remain and those days at the setoff per diem come to no more than the funding-month
        interest
      method: set off those days at the setoff per diem
    - when: open earlier-month days remain and those days at the setoff per diem come to more than the funding-month
        interest
