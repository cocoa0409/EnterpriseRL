    ladder:
    - when: the settlement agent rejected Larkspur's wrong amount
      value: the loan program's condition review turn time in business days
    - when: Larkspur recalled the wire for an open prior-to-funding item
      value: the loan program's underwriting turn time in business days
    - when: otherwise
      value: no re-review days
    baseline:
