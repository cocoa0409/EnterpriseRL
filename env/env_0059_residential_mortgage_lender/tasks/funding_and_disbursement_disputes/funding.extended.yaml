    - when: the lock's expiration before any relock falls within the return date and the last day of the re-send
        and re-review days, and the relock request was logged after the lock desk cutoff time
      value: the lock's confirmation business days plus one
    - when: the lock lapsed in that span and the relock request was logged no later than the lock desk cutoff time
