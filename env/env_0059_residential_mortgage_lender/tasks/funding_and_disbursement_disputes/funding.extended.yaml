    - tier_param
    cross_difficulty: null
  - id: lf_funds_out_rule
    effect: method
    decides: lf_out_days
    bindings:
    - lf_ret_src
    - lf_src_day
    - lf_est_wires
    - lf_out_days
    ladder:
    - when: the settlement agent returned through its own error the wire that went out on the estimated funding
        date, and the return came in after the funding request cutoff time
      method: take out the days from the estimated funding date through the return date, both counted
    - when: the settlement agent returned that wire through its own error, and the return came in no later than
        the funding request cutoff time
      method: take out the days from the estimated funding date up to the day before the return date
    - when: otherwise
      method: take out no day for funds that were out
    baseline:
      lf_out_days: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: lf_correction_window
    effect: method
    decides: lf_window_days
    bindings:
    - lf_return_wd
    - lf_window_offset
    - lf_resend_gap
    - lf_window_days
    ladder:
    - when: the settlement agent returned a wire through its own error and the wire that funded the loan went out
        later than the last day of the re-send allowance
      method: take out the days from the return date through the last day of the re-send allowance and keep the
        later days refunded
    - when: the settlement agent returned a wire through its own error and the wire that funded the loan went out
        no later than the last day of the re-send allowance
      method: take out every day from the return date up to the day before the disbursement date
    - when: otherwise
      method: take out no day after a return
    baseline:
      lf_window_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lf_late_booking_rate
    effect: parameter
    decides: lf_rate
    bindings:
    - lf_disb_wd
    - lf_deadline_offset
    - lf_late_by
    - lf_rate
    ladder:
    - when: the refund is booked after the refund deadline and the closing's property state is one of the states
        in statutory_refund_interest_states
      value: statutory_refund_interest_rate_pct percent a year
    - when: the refund is booked after the refund deadline and the property state is not one of those states
      value: larkspur_refund_interest_rate_pct percent a year
    - when: otherwise
      value: no late-booking interest rate (zero)
    baseline:
      lf_rate: '0'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: lf_late_booking_span
    effect: method
    decides: lf_int_days
    bindings:
    - lf_int_days
    ladder:
    - when: the refund is booked more than late_booking_escalation_calendar_days calendar days after the refund
        deadline
      method: count the days from the date the charge collected at closing was booked through the booking date,
        both counted
    - when: the refund is booked after the refund deadline but no more than that many calendar days after it
      method: count the days from the day after the refund deadline through the booking date, both counted
    - when: otherwise
      method: count no late-booking interest days
    baseline:
      lf_int_days: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: A late-funding refund returns the prepaid interest a funded closing collected for days on which its loan
      was not yet funded, where the disbursement date falls on or after the first day and on or before the last
      day of the prepaid interest charge collected at closing. For a late-funding refund, the charge collected at
      closing is the closing's prepaid interest charge booked on the signing date. The late days are the days from
      the estimated funding date up to the day before the disbursement date. In the standard refund, each late day
      is refunded at the same daily amount the charge collected at closing used. The late-funding refund is the
      refunded days times that daily amount, rounded half up to the cent.
    params:
    - per_diem_refund_business_days
- id: funding_ext_per_diem_shortfall
  base_policy_refs:
  - funding_per_diem_interest
  overwrite:
  - base_policy: funding_per_diem_interest
    superseded_clause: daily_interest_amount is loan_amount times note_rate percent divided by per_diem_day_count_basis,
      rounded to per_diem_daily_rounding_decimals
    replaced_by: 'Every prepaid interest entry other than a per diem shortfall payment or a funding-month interest
      payment, the charge collected at closing included, keeps the per diem policy''s daily amount: the closing''s
      loan amount times its note rate taken as a percent, divided by the per diem day-count basis, rounded to the
      per diem rounding decimals. The shortfall per diem, which prices a per diem shortfall only and never funding-month
      interest, is the loan file''s loan amount times the rate the closing''s lock holds, taken as a percent, divided
      by the per diem day-count basis, rounded half up to the cent.'
  trigger: on_request
  subject:
  - funding_per_diem_charged
  computes: interest_amount
  target_tool: pay_prepaid_interest_shortfall_7376ee5f
  params:
    absorb_financed_fee_omission: 10.0
    absorb_amount_error: 5.0
    absorb_relock_rate_error: 7.5
    absorb_rate_error: 5.0
  rule: 'A per diem shortfall is the prepaid interest a borrower still owes on a funded closing whose charge collected
    at closing was priced below the per diem the note supports, and the borrower pays it on their own instruction.
    For a per diem shortfall, the charge collected at closing is the closing''s prepaid interest charge booked on
    the signing date. A shortfall that comes only from funding earlier than estimated is never collected, so a day
    before the first day of the charge collected at closing never counts toward a per diem shortfall. The per diem
    shortfall is fixed only after the closing''s prepaid interest ledger carries the late-funding refund owed for
    the unfunded days that fall in the month the loan funded. Every prepaid interest entry other than a per diem
    shortfall payment or a funding-month interest payment, the charge collected at closing included, keeps the per
    diem policy''s daily amount: the closing''s loan amount times its note rate taken as a percent, divided by the
    per diem day-count basis, rounded to the per diem rounding decimals. The shortfall per diem, which prices a
    per diem shortfall only and never funding-month interest, is the loan file''s loan amount times the rate the
    closing''s lock holds, taken as a percent, divided by the per diem day-count basis, rounded half up to the cent.
    The prepaid interest the closing holds for a per diem shortfall is the charge collected at closing less, for
    every late-funding refund that names it, the refunded days times the charge''s daily amount; interest Larkspur
    added to a refund for booking it late is not part of what the closing holds. In the standard measure, the shortfall
    days are every day of the charge collected at closing. The per diem shortfall is the shortfall days times the
    shortfall per diem less the prepaid interest the closing holds, rounded half up to the cent and never below
    zero. Any record-error allowance comes off the per diem shortfall first, the remainder rounded half up to the
    cent and never below zero, and any credit cover then comes off that remainder, never below zero; what is left
    is what the borrower pays. The shortfall days are counted as follows: where a late-funding refund names the
    charge collected at closing, they are every day of that charge less every day those refunds return; where no
    such refund stands and the disbursement date falls on or after the first day and on or before the last day of
    that charge, they are the days from the disbursement date through the last day of the charge, both counted;
    otherwise they are every day of the charge. Larkspur absorbs part of a per diem shortfall that its closing record''s
    loan amount created: where the closing record''s loan amount equals the loan file''s base loan amount and the
    file''s program finances an upfront program fee from which the file is not exempt, so the financed fee was left
    off the record, it absorbs absorb_financed_fee_omission; where the closing record''s loan amount differs from
    both the loan file''s loan amount and its base loan amount, it absorbs absorb_amount_error; otherwise it absorbs
    nothing for the loan amount. Larkspur absorbs part of a per diem shortfall that its closing record''s note rate
    created: where the closing record''s note rate differs from the rate the lock holds and the lock carries a relock
    entry dated after the closing record was opened, it absorbs absorb_relock_rate_error; where the closing record''s
    note rate differs from the rate the lock holds and no such relock entry exists, it absorbs absorb_rate_error;
    otherwise it absorbs nothing for the rate. The credit cover of a per diem shortfall is set from the borrower''s
    Larkspur closing cost credits, because a charge priced right at closing would have drawn on a credit left unused:
    where the Larkspur closing cost credit whose application at closing paid the largest amount of prepaid items
    (on whatever date the credit rules book that application, and, where two such applications paid the same amount,
    the later-booked one) was also cut back for exceeding the eligible costs on the date that application was booked,
    the cut-back booked with the credit''s application at closing, by at least the remainder after the record-error
    allowances, the cover is that whole remainder; where that credit was cut back on that date by less than that
    remainder, the cover is the amount cut back; otherwise there is no credit cover. The payment is recorded as
    a prepaid interest charge for the period of the charge collected at closing, priced at the shortfall per diem,
    with what the borrower pays as its amount. A per diem shortfall payment carries no payment channel charge, Larkspur
    bearing the processing cost of a shortfall its own closing record created.'
  prerequisite:
  - problem: funding_ext_late_funding_refund
    kind: value_input
    gate: sf_days
    form: state
    policy_source: The per diem shortfall is fixed only after the closing's prepaid interest ledger carries the
      late-funding refund owed for the unfunded days that fall in the month the loan funded.
    condition: the closing's funding_interest_ledger carries a funding_per_diem_refunded entry with refund_reason
      funding_later_than_estimated naming the charge collected at closing, for the unfunded days of the disbursement
      month that the late-funding refund returns
    resolved_by: refund_late_funding_interest_1de244fe
    effect: the refund's days move the shortfall days from the days after the disbursement date to every day of
      the charge less the refunded days, and lower the prepaid interest the closing holds by those days at the charge's
      daily amount
  cross_category:
  - category: loan
    as: value
    reads:
    - loan_amount
    - base_loan_amount
    - funding_fee_exempt
    - upfront_program_fee_pct
    note: the loan file's loan amount prices the shortfall per diem, and its base amount and program fee decide
      the loan-amount allowance
  - category: lock
    as: value
    reads:
    - locked_rate
    - lock_pricing_events.event_date
    note: the lock's rate prices the shortfall per diem, and its relock entry decides the rate allowance
  - category: credit
    as: value
    reads:
    - credit_ledger.credit_award_id
    - credit_ledger.cost_category
    - credit_ledger.entry_amount
    - credit_ledger.reduction_reason
    note: the credit whose application at closing paid prepaid items, and its cut-back for exceeding the eligible
      costs, decide the credit cover
  inputs:
    history:
    - table: funding_interest_ledger
      aggregate: sum
      field: interest_days
      filters:
        event_type: funding_per_diem_refunded
        refund_reason: funding_later_than_estimated
    - table: funding_interest_ledger
      aggregate: latest
      field: interest_amount
      filters:
        event_type: funding_per_diem_charged
    - category: lock
      table: lock_pricing_events
      aggregate: latest
      field: event_date
      filters:
        event_type: lock_relock_fee_booked
    - category: credit
      table: credit_ledger
      aggregate: sum
      field: entry_amount
      filters:
        event_type: credit_reduced
        reduction_reason: exceeds_eligible_costs
    cross_category:
    - loan
    - lock
    - credit
  compute:
  - sf_chg_id: LATEST('funding_interest_ledger', 'interest_entry_id', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - sf_chg_from: LATEST('funding_interest_ledger', 'interest_from_date', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - sf_chg_through: LATEST('funding_interest_ledger', 'interest_through_date', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - sf_chg_amt: LATEST('funding_interest_ledger', 'interest_amount', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - sf_chg_daily: LATEST('funding_interest_ledger', 'daily_interest_amount', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - sf_chg_days: LATEST('funding_interest_ledger', 'interest_days', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - sf_ref_days: SUM('funding_interest_ledger', 'interest_days', event_type='funding_per_diem_refunded', refund_reason='funding_later_than_estimated',
      source_interest_entry_id=sf_chg_id)
  - sf_ref_count: COUNT('funding_interest_ledger', event_type='funding_per_diem_refunded', refund_reason='funding_later_than_estimated',
      source_interest_entry_id=sf_chg_id)
  - sf_held: RND(sf_chg_amt - sf_ref_days * sf_chg_daily, 2)
  - sf_days: (sf_chg_days - sf_ref_days) if sf_ref_count > 0 else ((DAYS(F('disbursement_date'), sf_chg_through)
      + 1) if (sf_ref_count == 0 and F('disbursement_date') >= sf_chg_from and F('disbursement_date') <= sf_chg_through)
      else sf_chg_days)
  - sf_file_amt: CFIELD('loan', 'loan_amount', loan_file_id=F('loan_file_id'))
  - sf_lock_rate: CFIELD('lock', 'locked_rate', lock_id=F('lock_id'))
  - sf_note_pd: RND(sf_file_amt * sf_lock_rate / 100 / P('per_diem_day_count_basis'), 2)
  - sf_raw: MX(0, RND(sf_days * sf_note_pd - sf_held, 2))
  - sf_file_base: CFIELD('loan', 'base_loan_amount', loan_file_id=F('loan_file_id'))
  - sf_fee_pct: CPARAM('loan', 'upfront_program_fee_pct', loan_file_id=F('loan_file_id'))
  - sf_fee_exempt: CFIELD('loan', 'funding_fee_exempt', loan_file_id=F('loan_file_id'))
  - sf_amount_allow: K('absorb_financed_fee_omission') if (F('loan_amount') == sf_file_base and sf_fee_pct > 0 and
      sf_fee_exempt == False) else (K('absorb_amount_error') if (F('loan_amount') != sf_file_amt and F('loan_amount')
      != sf_file_base) else 0)
  - sf_relock_day: XLATEST('lock', 'lock_pricing_events', 'event_date', date_field='event_date', event_type='lock_relock_fee_booked',
      lock_id=F('lock_id'))
  - sf_rate_allow: K('absorb_relock_rate_error') if (F('note_rate') != sf_lock_rate and sf_relock_day != None and
      sf_relock_day > F('opened_date')) else (K('absorb_rate_error') if (F('note_rate') != sf_lock_rate and (sf_relock_day
      == None or sf_relock_day <= F('opened_date'))) else 0)
  - sf_after: MX(0, RND(sf_raw - sf_amount_allow - sf_rate_allow, 2))
  - sf_pp_max: XMAX('credit', 'credit_ledger', 'entry_amount', event_type='credit_applied_at_closing', cost_category='prepaid_items')
  - sf_credit_id: XLATEST('credit', 'credit_ledger', 'credit_award_id', date_field='entry_date', event_type='credit_applied_at_closing',
      cost_category='prepaid_items', entry_amount=sf_pp_max) if sf_pp_max > 0 else None
  - sf_app_date: XLATEST('credit', 'credit_ledger', 'entry_date', date_field='entry_date', event_type='credit_applied_at_closing',
      cost_category='prepaid_items', credit_award_id=sf_credit_id) if sf_credit_id != None else None
  - sf_cutback: XSUM('credit', 'credit_ledger', 'entry_amount', event_type='credit_reduced', reduction_reason='exceeds_eligible_costs',
      credit_award_id=sf_credit_id, entry_date=sf_app_date) if sf_credit_id != None else 0
  - sf_cover: sf_after if (sf_credit_id != None and sf_cutback > 0 and sf_cutback >= sf_after) else (sf_cutback
      if (sf_credit_id != None and sf_cutback > 0 and sf_cutback < sf_after) else 0)
  - result: MX(0, RND(sf_after - sf_cover, 2))
