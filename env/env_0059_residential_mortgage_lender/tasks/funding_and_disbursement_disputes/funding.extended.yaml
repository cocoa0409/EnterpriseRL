  baseline:
    rule: 'Funding-month interest is the prepaid interest a borrower pays after closing for the month in which the
      loan funded, where the disbursement date falls after the last day of the charge collected at closing, and
      the borrower pays it on their own instruction. For funding-month interest, the charge collected at closing
      is the closing''s prepaid interest charge booked on the signing date. The funding-month interest runs from
      the disbursement date through the last day of the disbursement month, both days counted; the disbursement
      month''s last day is the day before the first day of the following month, February having 29 days in a year
      divisible by four and 28 otherwise, April, June, September and November 30 and every other month 31; it is
      found as the days from the disbursement date to the first payment date, which falls on the first day of the
      second month after the disbursement month, less the days of the month in between. A prepaid interest entry
      other than a funding-month interest payment or a per diem shortfall payment, the charge collected at closing
      included, keeps the per diem policy''s daily amount: the closing''s loan amount times its note rate taken
      as a percent, divided by the per diem day-count basis, rounded to the per diem rounding decimals. For funding-month
      interest, and never for a per diem shortfall, the per diem is the loan file''s loan amount times the rate
      the closing''s lock holds, taken as a percent, divided by the per diem day-count basis, rounded half up to
      the cent. The funding-month interest is its days times that per diem, rounded half up to the cent. The amount
      the borrower pays is the funding-month interest less the setoff and less the redraw fee refunds, rounded half
      up to the cent and never below zero, plus any payment channel charge. The standard funding-month payment carries
      no setoff and no payment channel charge.'
    params:
    - per_diem_day_count_basis
- id: funding_ext_interest_dispute_decision
  base_policy_refs:
  - funding_dispute_resolution
  - funding_per_diem_interest
  overwrite:
  - base_policy: funding_dispute_resolution
    superseded_clause: 'A per_diem_overcharge or late_funding dispute is decided by recomputing prepaid interest
      under the per diem policy from the recorded disbursement_date: any excess is refunded (refund_issued, refund_amount
      equal to the excess) and a correct charge is denied_correct_as_charged.'
    replaced_by: 'A per diem overcharge dispute is decided by the recompute below, any refund being issued as refund_issued
      with the refund amount below and a dispute with nothing to refund being denied as correct as charged. A late-funding
      dispute is decided, not by that recompute, but by recomputing prepaid interest under the per diem policy as
      the late-funding refund applies it, from the recorded disbursement date: any excess is refunded as refund_issued
      with the refund amount equal to the excess, and a correct charge is denied as correct as charged. Closing-fee
      and returned-wire disputes remain under the base dispute rule''s own sentences for them.'
  trigger: on_request
  subject:
  - funding_dispute_resolved
  computes: refund_amount
  target_tool: decide_prepaid_interest_dispute_44bdf39e
  params:
    late_decision_interest_pct: 2.0
  rule: 'A prepaid interest dispute decision decides a borrower''s pending per diem overcharge dispute on a funded
    closing by recomputing what the disputed charge still holds. A per diem overcharge dispute is decided by the
    recompute below, any refund being issued as refund_issued with the refund amount below and a dispute with nothing
    to refund being denied as correct as charged. A late-funding dispute is decided, not by that recompute, but
    by recomputing prepaid interest under the per diem policy as the late-funding refund applies it, from the recorded
    disbursement date: any excess is refunded as refund_issued with the refund amount equal to the excess, and a
    correct charge is denied as correct as charged. Closing-fee and returned-wire disputes remain under the base
    dispute rule''s own sentences for them. A prepaid interest dispute is not decided until the closing''s prepaid
    interest ledger carries a charge for the month in which the loan funded. The filing the recompute below decides
    is the closing''s latest per diem overcharge filing still marked pending; where none is pending nothing is decided,
    and a filing that a decision record already names is not decided again, nothing further being refunded for it.
    In the standard recompute, the disputed charge is the closing''s latest prepaid interest charge. The disputed
    charge is set from the filing: where the filing names a prepaid interest charge, it is that charge; where the
    filing names no entry, it is the charge collected at closing, the closing''s prepaid interest charge booked
    on the signing date; otherwise it is the closing''s latest prepaid interest charge. In the standard recompute,
    the standing days are every day of the disputed charge. The standing days are set from where the disbursement
    date falls: where it falls after the last day of the disputed charge, they are the charge''s days less every
    day that the prepaid interest refunds naming it return, never fewer than zero; where it falls on or after the
    charge''s first day and on or before its last day, they are the days from the disbursement date through the
    charge''s last day, both counted, the earlier days being late days that the late-funding refund deals with;
    otherwise, where it falls before the charge''s first day, they are every day of the charge. The excess is the
    standing days times the refund per standing day, rounded half up to the cent. In the standard recompute, the
    refund per standing day is zero. The per diem the note supports is the loan file''s loan amount times the rate
    the closing''s lock holds, taken as a percent, divided by the per diem day-count basis, rounded half up to the
    cent. The refund per standing day is set as follows: where the disbursement date falls after the last day of
    the disputed charge and the ledger carries no charge for the month in which the loan funded, it is the disputed
    charge''s whole daily amount, since none of those days was owed or set off; where that does not hold and the
    disputed charge used a daily amount above the per diem the note supports, it is the charge''s daily amount less
    that per diem; otherwise it is zero. In the standard recompute, the excess carries no interest. The interest
    rate on the excess is set as follows: where the closing record''s loan amount differs from the loan file''s
    loan amount or its note rate differs from the rate the lock holds, it is the rate the lock holds; where there
    is no such difference and the decision comes later than the dispute response business days after the filing
    date, it is late_decision_interest_pct; otherwise there is no interest. The interest days on the excess are
    set as follows: where the decision comes later than the dispute response business days after the filing date,
    they run from the disbursement date up to the decision date; where it comes later than the dispute acknowledgment
    business days but no later than the dispute response business days after the filing date, they run from the
    filing date up to the decision date; otherwise there are none. Business days for these deadlines are counted
    Monday through Friday starting with the day after the filing date, and the decision date is the day the decision
    is booked. The interest on the excess is the excess times the interest rate taken as a percent, times the interest
    days, divided by the per diem day-count basis, rounded half up to the cent, and the refund is the excess plus
    that interest. A decision with a refund above zero is issued as refund_issued with the refund as its amount;
    a decision with nothing to refund is denied as correct as charged with an amount of zero. The decision names
    the filing record and the disputed charge, and a refund is booked as a prepaid interest refund naming the disputed
    charge and recording its daily amount, with the refund as its amount.'
  prerequisite:
  - problem: funding_ext_funding_month_interest
    kind: value_input
    gate: dd_day
    form: state
    policy_source: A prepaid interest dispute is not decided until the closing's prepaid interest ledger carries
      a charge for the month in which the loan funded.
    condition: the closing's prepaid interest ledger carries a funding_per_diem_charged entry whose period starts
      on the disbursement date
    resolved_by: pay_funding_month_interest_3474c980
    effect: with a funding-month charge standing, each standing day of the disputed charge is refunded only at the
      gap between its daily amount and the funding-month per diem instead of its whole daily amount
  cross_category:
  - category: loan
    as: value
    reads:
    - loan_amount
    note: the loan file's loan amount prices the per diem the note supports and shows whether the closing record
      misstated the amount
  - category: lock
    as: value
    reads:
    - locked_rate
    note: the lock's rate prices the per diem the note supports, shows whether the record misstated the rate and
      prices the excess interest
  inputs:
    history:
    - table: funding_disputes
      aggregate: latest
      field: filed_date
      filters:
        event_type: funding_dispute_filed
    - table: funding_interest_ledger
      aggregate: sum
      field: interest_days
      filters:
        event_type: funding_per_diem_refunded
    cross_category:
    - loan
    - lock
  compute:
  - dd_fid: LATEST('funding_disputes', 'funding_dispute_id', date_field='filed_date', event_type='funding_dispute_filed',
      resolution='pending', dispute_type='per_diem_overcharge')
  - dd_done: COUNT('funding_disputes', event_type='funding_dispute_resolved', source_dispute_id=dd_fid) if dd_fid
      != None else 0
  - dd_filed: LATEST('funding_disputes', 'filed_date', date_field='filed_date', funding_dispute_id=dd_fid)
  - dd_named: LATEST('funding_disputes', 'disputed_entry_id', date_field='filed_date', funding_dispute_id=dd_fid)
  - dd_named_charges: COUNT('funding_interest_ledger', event_type='funding_per_diem_charged', interest_entry_id=dd_named)
      if dd_named != None else 0
  - dd_closing_charge: LATEST('funding_interest_ledger', 'interest_entry_id', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - dd_latest_charge: LATEST('funding_interest_ledger', 'interest_entry_id', date_field='interest_from_date', event_type='funding_per_diem_charged')
  - dd_sc: dd_named if (dd_named != None and dd_named_charges > 0) else (dd_closing_charge if dd_named == None else
      dd_latest_charge)
  - dd_sc_days: LATEST('funding_interest_ledger', 'interest_days', date_field='entry_date', interest_entry_id=dd_sc)
  - dd_sc_daily: LATEST('funding_interest_ledger', 'daily_interest_amount', date_field='entry_date', interest_entry_id=dd_sc)
  - dd_sc_through: LATEST('funding_interest_ledger', 'interest_through_date', date_field='entry_date', interest_entry_id=dd_sc)
  - dd_sc_from: LATEST('funding_interest_ledger', 'interest_from_date', date_field='entry_date', interest_entry_id=dd_sc)
  - dd_ref_days: SUM('funding_interest_ledger', 'interest_days', event_type='funding_per_diem_refunded', source_interest_entry_id=dd_sc)
  - dd_standing: MX(0, dd_sc_days - dd_ref_days) if F('disbursement_date') > dd_sc_through else ((DAYS(F('disbursement_date'),
      dd_sc_through) + 1) if F('disbursement_date') >= dd_sc_from else dd_sc_days)
  - dd_file_amt: CFIELD('loan', 'loan_amount', loan_file_id=F('loan_file_id'))
  - dd_lock_rate: CFIELD('lock', 'locked_rate', lock_id=F('lock_id'))
  - dd_note_pd: RND(dd_file_amt * dd_lock_rate / 100 / P('per_diem_day_count_basis'), 2)
  - dd_fmc: COUNT('funding_interest_ledger', event_type='funding_per_diem_charged', interest_from_date=F('disbursement_date'))
  - dd_day: dd_sc_daily if (F('disbursement_date') > dd_sc_through and dd_fmc == 0) else (RND(dd_sc_daily - dd_note_pd,
      2) if (not (F('disbursement_date') > dd_sc_through and dd_fmc == 0) and dd_sc_daily > dd_note_pd) else 0)
  - dd_excess: RND(dd_standing * dd_day, 2)
  - dd_filed_wd: (DAYS('1970-01-05', dd_filed) % 7) if dd_filed != None else 0
  - dd_ack_off: 0 if P('dispute_acknowledge_business_days') == 0 else ((P('dispute_acknowledge_business_days') +
      2 * ((dd_filed_wd + P('dispute_acknowledge_business_days')) // 5)) if dd_filed_wd <= 4 else ((P('dispute_acknowledge_business_days')
      + 1 + 2 * ((P('dispute_acknowledge_business_days') - 1) // 5)) if dd_filed_wd == 5 else (P('dispute_acknowledge_business_days')
      + 2 * ((P('dispute_acknowledge_business_days') - 1) // 5))))
  - dd_resp_off: 0 if P('dispute_response_business_days') == 0 else ((P('dispute_response_business_days') + 2 *
      ((dd_filed_wd + P('dispute_response_business_days')) // 5)) if dd_filed_wd <= 4 else ((P('dispute_response_business_days')
      + 1 + 2 * ((P('dispute_response_business_days') - 1) // 5)) if dd_filed_wd == 5 else (P('dispute_response_business_days')
      + 2 * ((P('dispute_response_business_days') - 1) // 5))))
  - dd_since: DAYS(dd_filed, NOW) if dd_filed != None else 0
  - dd_rate: dd_lock_rate if (F('loan_amount') != dd_file_amt or F('note_rate') != dd_lock_rate) else (K('late_decision_interest_pct')
      if (F('loan_amount') == dd_file_amt and F('note_rate') == dd_lock_rate and dd_since > dd_resp_off) else 0)
  - dd_idays: DAYS(F('disbursement_date'), NOW) if dd_since > dd_resp_off else (dd_since if (dd_since > dd_ack_off
      and dd_since <= dd_resp_off) else 0)
  - dd_interest: RND(dd_excess * dd_rate / 100 * dd_idays / P('per_diem_day_count_basis'), 2)
  - result: MX(0, RND(dd_excess + dd_interest, 2)) if (dd_fid != None and dd_done == 0) else 0
