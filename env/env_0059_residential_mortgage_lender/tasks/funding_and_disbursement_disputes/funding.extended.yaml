    - date
    cross_difficulty: lock
  - id: rw_last_lost_day
    effect: method
    decides: rw_end_off
    bindings:
    - rw_gap
    - rw_end_off
    ladder:
    - when: a Larkspur-side return occurred and the wire that funded the loan went out later than the last day of
        Larkspur's re-send standard
      method: end the lost days on the last day of the standard
    - when: a Larkspur-side return occurred and the wire that funded the loan went out no later than the last day
        of the standard
      method: end the lost days on the day before the disbursement date
    - when: otherwise
