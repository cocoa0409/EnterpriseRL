  - rw_lapsed: rw_lark and rw_lock_exp != None and rw_relock_time != None and rw_lock_exp >= rw_ret_day and DAYS(rw_ret_day,
      rw_lock_exp) <= rw_pre_off
  - rw_relock: (CPARAM('lock', 'confirmation_business_days', lock_id=F('lock_id')) + 1) if (rw_lapsed and rw_relock_time
      > CPARAM('lock', 'lock_desk_cutoff_time', lock_id=F('lock_id'))) else (CPARAM('lock', 'confirmation_business_days',
      lock_id=F('lock_id')) if (rw_lapsed and rw_relock_time <= CPARAM('lock', 'lock_desk_cutoff_time', lock_id=F('lock_id')))
      else 0)
  - rw_std_n: rw_resend + rw_review + rw_relock
  - rw_std_off: 0 if rw_std_n == 0 else ((rw_std_n + 2 * ((rw_ret_wd + rw_std_n) // 5)) if rw_ret_wd <= 4 else ((rw_std_n
