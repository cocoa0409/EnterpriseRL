      relock request was logged no later than the lock desk cutoff time, they are the lock''s confirmation business
      days; otherwise there are none.'
    rw_std_n: Larkspur's re-send standard is the re-send days plus the re-review days plus the relock days, counted
      in business days Monday through Friday starting with the day after the return date; with no days the standard
      ends on the return date itself.
    rw_std_off: Larkspur's re-send standard is the re-send days plus the re-review days plus the relock days, counted
      in business days Monday through Friday starting with the day after the return date; with no days the standard
      ends on the return date itself.
    rw_gap: 'The last lost day is set as follows: where a Larkspur-side return occurred and the wire that funded
      the loan went out later than the last day of Larkspur''s re-send standard, it is the last day of the standard,
      and the later unfunded days are not lost days; where a Larkspur-side return occurred and the wire that funded
      the loan went out no later than the last day of the standard, it is the day before the disbursement date;
      otherwise there is no last lost day.'
    rw_end_off: 'The last lost day is set as follows: where a Larkspur-side return occurred and the wire that funded
      the loan went out later than the last day of Larkspur''s re-send standard, it is the last day of the standard,
      and the later unfunded days are not lost days; where a Larkspur-side return occurred and the wire that funded
      the loan went out no later than the last day of the standard, it is the day before the disbursement date;
      otherwise there is no last lost day.'
    rw_first: The lost days run from the first lost day through the last lost day, both counted, cut back to the
      last day of the charge collected at closing, and are never fewer than zero.
    rw_lost: The lost days run from the first lost day through the last lost day, both counted, cut back to the
      last day of the charge collected at closing, and are never fewer than zero.
    result: The returned-wire refund is the lost days times that daily amount, rounded half up to the cent.
  factors:
  - id: rw_first_lost_day
    effect: method
    decides: rw_start
    bindings:
    - rw_ret_src
    - rw_src_day
    - rw_start
    ladder:
    - when: the closing's latest wire return is a settlement-agent rejection of a wire whose amount differs from
        the wire that funded the loan
      method: count lost days from the date the rejected wire went out
    - when: the latest return is a Larkspur recall for an open prior-to-funding item
      method: count lost days from the recall date
    - when: otherwise
      method: count no lost days
    baseline:
