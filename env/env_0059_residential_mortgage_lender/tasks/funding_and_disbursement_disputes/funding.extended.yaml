- id: funding_wire_returns
  subject:
  - funding_wire_returned
  - funding_wire_reversed
  rule: A wire the settlement agent returns before disbursing (settlement_agent_rejected) or that Larkspur recalls
    because a prior-to-funding item was open (funding_conditions_unmet) puts the closing back to signed; it is re-sent
    within returned_wire_resend_business_days business days of the cause being fixed, and the new wire date becomes
    the disbursement date. A Larkspur-side return (a wrong amount, wrong account or Larkspur's own open condition)
    is Larkspur's delay for interest purposes; a return caused by the settlement agent's or borrower's error is
    not. Wires returned because the borrower rescinded or the closing was cancelled end the funding.
  eligibility: []
- id: funding_dispute_resolution
  subject:
  - funding_dispute_filed
  - funding_dispute_resolved
  - funding_per_diem_refunded
  - funding_fee_reversed
  rule: 'A funding dispute is accepted only if it is filed no later than the end of the dispute window that starts
    on the disbursement date. Count calendar days forward from disbursement_date, which is day zero; a dispute filed
    on the last day of the window is accepted. A late dispute is resolved denied_untimely. Larkspur acknowledges
    within dispute_acknowledge_business_days and decides within dispute_response_business_days business days. A
    per_diem_overcharge or late_funding dispute is decided by recomputing prepaid interest under the per diem policy
    from the recorded disbursement_date: any excess is refunded (refund_issued, refund_amount equal to the excess)
    and a correct charge is denied_correct_as_charged. A late_funding dispute never earns compensation beyond the
    interest refund. A closing_fee_disputed dispute reverses the fee (fee_reversed) when the fee is outside the
    method''s schedule or the redraw was Larkspur-caused. A returned_wire_interest dispute is refunded only when
    the return was Larkspur-side. Each decision names the filing record and, where the dispute is about one entry,
    that entry.'
  eligibility:
  - id: dispute_within_window
    applies_to:
    - funding_dispute_filed
    kind: time
    condition: A funding dispute is accepted only if it is filed no later than the end of the dispute window that
      starts on the disbursement date.
    evidence_fields:
    - closings.disbursement_date
    - closings.closing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id007
      action_bindings: *id008
    temporal_basis:
      clock: frozen_time
      anchor_event: the disbursement date
      anchor_source: closings.disbursement_date
      relation: not_after
      duration_source: variants.dispute_window_calendar_days
      unit: calendar_days
      counting_rule: Count calendar days forward from disbursement_date, which is day zero; a dispute filed on the
        last day of the window is accepted.
      boundary: inclusive
- id: funding_cancellation
  subject:
  - funding_cancelled
  rule: Only the borrower can cancel a scheduled closing for their own reasons; the system cancels it when the loan
    file is withdrawn or denied. A closing that has been signed cannot be cancelled; a rescindable transaction ends
    only by rescission and any other signed transaction proceeds to funding. Cancellation stamps closed_date and
    voids any drawn package without a redraw fee.
  eligibility: []
extended_policies:
- id: funding_ext_late_funding_refund
  base_policy_refs:
  - funding_per_diem_interest
  - funding_wire_returns
  - funding_dispute_resolution
  overwrite:
  - base_policy: funding_per_diem_interest
    superseded_clause: the interest for the days from estimated_funding_date up to the day before disbursement_date
      is refunded (funding_later_than_estimated)
    replaced_by: In the standard refund, each late day is refunded at the same daily amount the charge collected
      at closing used. A late day that the treatment of funds that were out or the treatment of the days after a
      settlement-agent return takes out is not refunded, and the refunded days are never fewer than zero.
  - base_policy: funding_dispute_resolution
    superseded_clause: A late_funding dispute never earns compensation beyond the interest refund.
    replaced_by: Apart from the late-booking interest a late-funding refund carries, a late-funding dispute earns
      no compensation beyond the interest refund.
  trigger: state_due
  subject:
  - funding_per_diem_refunded
  computes: interest_amount
  target_tool: refund_late_funding_interest_1de244fe
  params:
    statutory_refund_interest_states:
    - CA
    - CT
    - IL
    - MD
    - NY
    statutory_refund_interest_rate_pct: 6.0
    larkspur_refund_interest_rate_pct: 4.0
    late_booking_escalation_calendar_days: 30
  rule: 'A late-funding refund returns the prepaid interest a funded closing collected for days on which its loan
    was not yet funded, where the disbursement date falls on or after the first day and on or before the last day
    of the prepaid interest charge collected at closing. For a late-funding refund, the charge collected at closing
    is the closing''s prepaid interest charge booked on the signing date. The late days are the days from the estimated
    funding date up to the day before the disbursement date. In the standard refund, each late day is refunded at
    the same daily amount the charge collected at closing used. A late day that the treatment of funds that were
    out or the treatment of the days after a settlement-agent return takes out is not refunded, and the refunded
    days are never fewer than zero. The late-funding refund is the refunded days times that daily amount, rounded
    half up to the cent. Any late-booking interest owed on a late-funding refund is added to it, the interest rounded
    half up to the cent on its own. A settlement-agent return is the settlement agent''s own error when the returned
    wire''s amount equals the amount of the wire that funded the loan; a returned wire whose amount differs carried
    Larkspur''s wrong amount, and its days are not taken out of a late-funding refund. The re-send allowance of
    a late-funding refund, in business days, is set from the closing''s wires and closing method: where the settlement
    agent returned a wire through its own error and the closing method funds only after the signed package is reviewed,
    it is the method''s package review business days plus its returned-wire re-send business days; where the settlement
    agent returned a wire through its own error and the closing method wires funds at signing, it is the method''s
    returned-wire re-send business days; otherwise there is no re-send allowance. Business days for the re-send
    allowance are counted Monday through Friday, starting with the day after the return date, and with no allowance
    the last day of the allowance is the return date itself. Days on which funds were out are treated as follows
    for a late-funding refund: where the settlement agent returned through its own error the wire that went out
    on the estimated funding date and the return came in after the closing method''s funding request cutoff time,
    the days from the estimated funding date through the return date, both counted, are taken out, because funds
    back after the cutoff could not be sent again that day; where the settlement agent returned that wire through
    its own error and the return came in no later than the funding request cutoff time, the days from the estimated
    funding date up to the day before the return date are taken out; otherwise no day is taken out for funds that
    were out. The days after a settlement-agent return are treated as follows for a late-funding refund: where the
    settlement agent returned a wire through its own error and the wire that funded the loan went out later than
    the last day of the re-send allowance, the days from the return date through the last day of the re-send allowance
    are taken out and the later days stay refunded; where the settlement agent returned a wire through its own error
    and the wire that funded the loan went out no later than the last day of the re-send allowance, every day from
    the return date up to the day before the disbursement date is taken out; otherwise no day after a return is
    taken out. A day the treatment of funds that were out already takes out is not taken out again. The refund deadline
    is the last of the closing method''s per diem refund business days, counted Monday through Friday starting with
    the day after the disbursement date, and a late-funding refund is booked late when its booking date falls after
    that deadline. The late-booking interest rate of a late-funding refund is set from the booking date and the
    closing''s property state: where the refund is booked late and the property state is one of the states in statutory_refund_interest_states,
    it is statutory_refund_interest_rate_pct percent a year; where the refund is booked late and the property state
    is not one of those states, it is larkspur_refund_interest_rate_pct percent a year; otherwise there is no late-booking
    interest rate. The late-booking interest days of a late-funding refund are counted as follows: where the refund
    is booked more than late_booking_escalation_calendar_days calendar days after the refund deadline, they run
    from the date the charge collected at closing was booked through the booking date, both counted; where the refund
    is booked late but no more than that many calendar days after the refund deadline, they run from the day after
    the refund deadline through the booking date, both counted; otherwise there are no late-booking interest days.
    The late-booking interest is the late-funding refund before interest times the late-booking interest rate taken
    as a percent, times the late-booking interest days, divided by the per diem day-count basis, rounded half up
    to the cent. The refund entry names the charge collected at closing that it corrects, records the daily amount
    used, records its period as the refunded days counted back from the day before the disbursement date, and carries
    the late-funding refund, late-booking interest included, as its amount. A charge that already carries a late-funding
    refund is not refunded again for funding late. The refund is owed as soon as the loan has funded and is booked
    within the per diem refund business days; its booking date is the day it is booked. Apart from the late-booking
    interest a late-funding refund carries, a late-funding dispute earns no compensation beyond the interest refund.'
  prerequisite: []
  cross_category: []
  inputs:
    history:
    - table: funding_wires
      aggregate: count
      field: funding_wire_id
      filters:
        event_type: funding_wire_returned
        return_reason: settlement_agent_rejected
    - table: funding_wires
      aggregate: latest
      field: wire_time
      filters:
        event_type: funding_wire_returned
    - table: funding_interest_ledger
      aggregate: latest
      field: daily_interest_amount
      filters:
        event_type: funding_per_diem_charged
    cross_category: []
  compute:
  - lf_charge_from: LATEST('funding_interest_ledger', 'interest_from_date', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - lf_charge_through: LATEST('funding_interest_ledger', 'interest_through_date', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - lf_chg_daily: LATEST('funding_interest_ledger', 'daily_interest_amount', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - lf_chg_booked: LATEST('funding_interest_ledger', 'entry_date', date_field='entry_date', event_type='funding_per_diem_charged',
      entry_date=F('signing_date'))
  - lf_late_days: MX(0, DAYS(F('estimated_funding_date'), F('disbursement_date')))
  - lf_fund_amt: LATEST('funding_wires', 'wire_amount', date_field='wire_date', event_type='funding_wire_sent',
      wire_date=F('disbursement_date'))
  - lf_own_returns: COUNT('funding_wires', event_type='funding_wire_returned', return_reason='settlement_agent_rejected',
      wire_amount=lf_fund_amt)
  - lf_return_day: LATEST('funding_wires', 'wire_date', date_field='wire_date', event_type='funding_wire_returned',
      return_reason='settlement_agent_rejected', wire_amount=lf_fund_amt)
  - lf_return_time: LATEST('funding_wires', 'wire_time', date_field='wire_date', event_type='funding_wire_returned',
      return_reason='settlement_agent_rejected', wire_amount=lf_fund_amt)
  - lf_allowance: P('closing_package_review_business_days') + P('returned_wire_resend_business_days') if (lf_own_returns
      > 0 and P('wet_funding') == False) else (P('returned_wire_resend_business_days') if (lf_own_returns > 0 and
      P('wet_funding') == True) else 0)
  - lf_ret_src: LATEST('funding_wires', 'source_wire_id', date_field='wire_date', event_type='funding_wire_returned',
      return_reason='settlement_agent_rejected', wire_amount=lf_fund_amt)
  - lf_src_day: LATEST('funding_wires', 'wire_date', date_field='wire_date', funding_wire_id=lf_ret_src) if lf_ret_src
      != None else None
  - lf_est_wires: 1 if (lf_src_day != None and lf_src_day == F('estimated_funding_date') and F('estimated_funding_date')
      < F('disbursement_date')) else 0
  - lf_out_days: (DAYS(F('estimated_funding_date'), lf_return_day) + 1) if (lf_own_returns > 0 and lf_est_wires
      > 0 and lf_return_time > P('funding_request_cutoff_time')) else (DAYS(F('estimated_funding_date'), lf_return_day)
      if (lf_own_returns > 0 and lf_est_wires > 0 and lf_return_time <= P('funding_request_cutoff_time')) else 0)
  - lf_return_wd: (DAYS('1970-01-05', lf_return_day) % 7) if lf_return_day != None else 0
  - lf_window_offset: 0 if lf_allowance == 0 else ((lf_allowance + 2 * ((lf_return_wd + lf_allowance) // 5)) if
      lf_return_wd <= 4 else ((lf_allowance + 1 + 2 * ((lf_allowance - 1) // 5)) if lf_return_wd == 5 else (lf_allowance
      + 2 * ((lf_allowance - 1) // 5))))
  - lf_resend_gap: DAYS(lf_return_day, F('disbursement_date')) if lf_return_day != None else 0
  - lf_window_days: (lf_window_offset + 1) if (lf_own_returns > 0 and lf_resend_gap > lf_window_offset) else (lf_resend_gap
      if (lf_own_returns > 0 and lf_resend_gap <= lf_window_offset) else 0)
  - lf_overlap: MN(lf_window_days, MX(0, lf_out_days - DAYS(F('estimated_funding_date'), lf_return_day))) if lf_return_day
      != None else 0
  - lf_refund_days: MX(0, lf_late_days - lf_out_days - (lf_window_days - lf_overlap)) if (F('disbursement_date')
      >= lf_charge_from and F('disbursement_date') <= lf_charge_through) else 0
  - lf_principal: RND(lf_refund_days * lf_chg_daily, 2)
  - lf_disb_wd: DAYS('1970-01-05', F('disbursement_date')) % 7
  - lf_deadline_offset: 0 if P('per_diem_refund_business_days') == 0 else ((P('per_diem_refund_business_days') +
      2 * ((lf_disb_wd + P('per_diem_refund_business_days')) // 5)) if lf_disb_wd <= 4 else ((P('per_diem_refund_business_days')
      + 1 + 2 * ((P('per_diem_refund_business_days') - 1) // 5)) if lf_disb_wd == 5 else (P('per_diem_refund_business_days')
      + 2 * ((P('per_diem_refund_business_days') - 1) // 5))))
  - lf_late_by: DAYS(F('disbursement_date'), NOW) - lf_deadline_offset
  - lf_rate: K('statutory_refund_interest_rate_pct') if (lf_late_by > 0 and F('property_state') in K('statutory_refund_interest_states'))
      else (K('larkspur_refund_interest_rate_pct') if (lf_late_by > 0 and F('property_state') not in K('statutory_refund_interest_states'))
      else 0)
  - lf_int_days: (DAYS(lf_chg_booked, NOW) + 1) if lf_late_by > K('late_booking_escalation_calendar_days') else
      (lf_late_by if (lf_late_by > 0 and lf_late_by <= K('late_booking_escalation_calendar_days')) else 0)
  - lf_interest: RND(lf_principal * lf_rate / 100 * lf_int_days / P('per_diem_day_count_basis'), 2)
  - result: RND(lf_principal + lf_interest, 2)
