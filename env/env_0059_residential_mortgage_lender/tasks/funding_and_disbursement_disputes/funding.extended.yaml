events:
- type: funding_closing_scheduled
  target: closings
  mutation: create
  meaning: a closing is scheduled for a cleared loan file by a chosen closing method
  grain: one row per closing
  fields:
    customer_id: borrower (foreign key -> customers)
    loan_file_id: loan file being closed (foreign key -> loan_files)
    lock_id: rate lock the loan closes under (foreign key -> rate_locks); empty when floating
    variant_name: closing method, written as the official closing method name
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    property_state: state of the subject property, which decides wet or dry funding and remote notarization availability
    settlement_agent_name: title or escrow company conducting the closing, as named on the closing instructions
    scheduled_closing_date: date the signing is scheduled
    estimated_funding_date: funding date assumed on the Closing Disclosure for prepaid interest
    rescission_applies: whether the transaction carries the three-day right of rescission
    loan_amount: total note amount being funded
    note_rate: note interest rate
    poa_approved_date: date Larkspur approved the power of attorney for a power of attorney closing; empty otherwise
    esign_consent_date: date the borrower gave E-SIGN consent for electronic closing documents; empty if none
    opened_date: date the closing record was opened
  triggers: []
- type: funding_closing_date_changed
  target: closings
  mutation: update
  meaning: the signing date (and the estimated funding date) moves
  grain: one row per closing
  fields:
    scheduled_closing_date: date the signing is scheduled
    estimated_funding_date: funding date assumed on the Closing Disclosure for prepaid interest
  triggers: []
- type: funding_docs_drawn
  target: closings
  mutation:
    transition:
      from: scheduled
      to: docs_out
  meaning: the closing package is drawn and sent
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    docs_drawn_date: date the closing package was drawn and sent; empty until then
    docs_expiration_date: last date the drawn package may be signed; empty until drawn
  triggers: []
- type: funding_docs_voided
  target: closings
  mutation:
    transition:
      from: docs_out
      to: scheduled
  meaning: the drawn package expired or was voided for a redraw
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    scheduled_closing_date: date the signing is scheduled
    estimated_funding_date: funding date assumed on the Closing Disclosure for prepaid interest
  triggers: []
- type: funding_signed
  target: closings
  mutation:
    transition:
      from: docs_out
      to: signed
  meaning: the borrower signs at closing
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    signing_date: date the borrower signed the note (consummation); empty until then
    rescission_expiration_date: last day of the rescission period (rescission is possible until midnight of this
      day); empty when rescission does not apply
  triggers:
  - event: loan:loan_consummated
  - event: funding:funding_per_diem_charged
    map:
      entry_date: signing_date
- type: funding_rescission_started
  target: closings
  mutation:
    transition:
      from: signed
      to: in_rescission
  meaning: the rescission period of a rescindable transaction begins
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
  triggers: []
- type: funding_completed
  target: closings
  mutation:
    transition:
    - from: signed
      to: funded
    - from: in_rescission
      to: funded
  meaning: the loan is funded
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    disbursement_date: date the funding wire was sent and interest began to accrue; empty until funded
    first_payment_date: due date of the first monthly payment; set at funding
    closed_date: date the closing reached funded, rescinded or cancelled; empty otherwise
  triggers: []
- type: funding_wire_reversed
  target: closings
  mutation:
    transition:
      from: funded
      to: signed
  meaning: a returned wire puts the closing back to signed
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    disbursement_date: date the funding wire was sent and interest began to accrue; empty until funded
  triggers: []
- type: funding_rescinded
  target: closings
  mutation:
    transition:
      from: in_rescission
      to: rescinded
  meaning: the borrower rescinds
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    closed_date: date the closing reached funded, rescinded or cancelled; empty otherwise
  triggers:
  - event: loan:loan_rescinded
- type: funding_cancelled
  target: closings
  mutation:
    transition:
    - from: scheduled
      to: cancelled
    - from: docs_out
      to: cancelled
  meaning: the closing is cancelled before signing
  grain: one row per closing
  fields:
    status: 'lifecycle status of the closing (basis: funding lifecycle.states)'
    closed_date: date the closing reached funded, rescinded or cancelled; empty otherwise
  triggers: []
- type: funding_wire_sent
  target: funding_wires
  meaning: loan proceeds are wired to the settlement agent
  grain: one row per outgoing wire
  distinguish_by:
  - wire_date
  - federal_reference_number
  fields:
    closing_id: closing funded (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    wire_amount: amount wired or returned, positive
    wire_date: date the wire was sent or the return received
    wire_time: time the wire was released or the return received
    federal_reference_number: Fedwire IMAD reference of the wire exactly as issued
    return_reason: why funds came back; none on outgoing wires
  account: disbursed_funds
  direction: in
  triggers:
  - event: funding:funding_completed
    map:
      disbursement_date: wire_date
  - event: lock:lock_delivered
- type: funding_wire_returned
  target: funding_wires
  meaning: the settlement agent returns a funding wire
  grain: one row per returned wire
  distinguish_by:
  - source_wire_id
  fields:
    closing_id: closing funded (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    wire_amount: amount wired or returned, positive
    wire_date: date the wire was sent or the return received
    wire_time: time the wire was released or the return received
    federal_reference_number: Fedwire IMAD reference of the wire exactly as issued
    return_reason: why funds came back; none on outgoing wires
    source_wire_id: for a return, the outgoing wire returned (foreign key -> funding_wires); empty otherwise
  account: disbursed_funds
  direction: out
  triggers:
  - event: funding:funding_wire_reversed
    when:
      return_reason:
      - settlement_agent_rejected
      - funding_conditions_unmet
- type: funding_per_diem_charged
  target: funding_interest_ledger
  meaning: prepaid interest from the estimated funding date to month end is collected at closing
  grain: one row per prepaid interest charge
  distinguish_by:
  - interest_from_date
  fields:
    closing_id: closing (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    interest_from_date: first day of interest covered by the entry
    interest_through_date: last day of interest covered by the entry
    interest_days: days of interest in the entry, both ends counted
    daily_interest_amount: 'per diem interest used: loan amount times note rate divided by the day-count basis,
      rounded to the cent'
    interest_amount: entry amount, positive; event_type gives the direction
    entry_date: date the entry was booked
    refund_reason: why a refund was issued; none on charges
  account: prepaid_interest
  direction: in
  triggers: []
- type: funding_per_diem_refunded
  target: funding_interest_ledger
  meaning: overcollected prepaid interest is refunded
  grain: one row per interest refund
  distinguish_by:
  - source_interest_entry_id
  - refund_reason
  fields:
    closing_id: closing (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    interest_from_date: first day of interest covered by the entry
    interest_through_date: last day of interest covered by the entry
    interest_days: days of interest in the entry, both ends counted
    daily_interest_amount: 'per diem interest used: loan amount times note rate divided by the day-count basis,
      rounded to the cent'
    interest_amount: entry amount, positive; event_type gives the direction
    entry_date: date the entry was booked
    refund_reason: why a refund was issued; none on charges
    source_interest_entry_id: for a refund, the charge entry corrected (foreign key -> funding_interest_ledger);
      empty on charges
  account: prepaid_interest
  direction: out
  triggers: []
- type: funding_fee_charged
  target: funding_fee_ledger
  meaning: a closing fee is charged to the borrower
  grain: one row per fee charged
  distinguish_by:
  - fee_code
  - entry_date
  fields:
    closing_id: closing (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    fee_code: which closing fee
    amount: entry amount, positive
    entry_date: date booked
    reversal_reason: why a fee was reversed; none on charges
  account: closing_fees
  direction: in
  triggers: []
- type: funding_fee_reversed
  target: funding_fee_ledger
  meaning: a closing fee is reversed
  grain: one row per fee reversed
  distinguish_by:
  - source_fee_entry_id
  fields:
    closing_id: closing (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    fee_code: which closing fee
    amount: entry amount, positive
    entry_date: date booked
    reversal_reason: why a fee was reversed; none on charges
    source_fee_entry_id: for a reversal, the fee entry reversed (foreign key -> funding_fee_ledger); empty on charges
  account: closing_fees
  direction: out
  triggers: []
- type: funding_dispute_filed
  target: funding_disputes
  meaning: the borrower disputes a funding outcome
  grain: one row per dispute filed
  distinguish_by:
  - dispute_type
  - filed_date
  fields:
    closing_id: closing disputed (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    dispute_type: what the borrower disputes
    filed_date: 'date the dispute was filed (on a resolution record: the filing date of the source dispute)'
    disputed_entry_id: interest or fee entry disputed, when the dispute is about one entry; empty otherwise
    resolution: outcome; pending on the filing record
  triggers: []
- type: funding_dispute_resolved
  target: funding_disputes
  meaning: a funding dispute is decided
  grain: one row per dispute decided
  distinguish_by:
  - source_dispute_id
  fields:
    closing_id: closing disputed (foreign key -> closings)
    customer_id: borrower (foreign key -> customers)
    dispute_type: what the borrower disputes
    filed_date: 'date the dispute was filed (on a resolution record: the filing date of the source dispute)'
    disputed_entry_id: interest or fee entry disputed, when the dispute is about one entry; empty otherwise
    resolution: outcome; pending on the filing record
    resolved_date: date decided; empty on the filing record
    refund_amount: amount refunded or reversed by the decision; 0.00 when denied
    source_dispute_id: on a resolution record, the filing record it decides (foreign key -> funding_disputes); empty
      on the filing record
  triggers:
  - event: funding:funding_per_diem_refunded
    when:
      resolution: refund_issued
    map:
      interest_amount: refund_amount
      source_interest_entry_id: disputed_entry_id
  - event: funding:funding_fee_reversed
    when:
      resolution: fee_reversed
    map:
      amount: refund_amount
      source_fee_entry_id: disputed_entry_id
      reversal_reason: dispute_upheld
measures:
- id: funding_msr_open_ptf_conditions
  window: the life of the closing's loan file up to frozen time
  measure: count of loan_condition_issued records on the closing's loan file with condition_class prior_to_funding
    that no loan_condition_cleared or loan_condition_waived record resolves
- id: funding_msr_redraws
  window: the life of the closing up to frozen time
  measure: count of funding_fee_charged records with fee_code doc_redraw_fee on the closing, plus count of redraws
    whose fee was reversed
policies:
- id: funding_agg_multi_holding
  subject:
  - funding_closing_scheduled
  rule: A customer may have closings on several loan files over time (max_per_customer is unlimited); each closing
    belongs to one loan file and the per-file closing policy governs how many may be open on one file.
  eligibility: []
  params:
    max_per_customer: null
- id: funding_agg_one_closing_per_file
  subject:
  - funding_closing_scheduled
  rule: A loan file may carry only one closing whose status is scheduled, docs_out, signed or in_rescission. Changing
    the closing method means cancelling the scheduled closing and scheduling a new one; changing only the date keeps
    the same closing. A funded, rescinded or cancelled closing does not block a new one, and a rescinded transaction
    needs a new application, not a new closing.
  eligibility:
  - id: one_open_closing
    applies_to:
    - funding_closing_scheduled
    kind: dedup
    condition: A loan file may carry only one closing whose status is scheduled, docs_out, signed or in_rescission.
    evidence_fields:
    - closings.loan_file_id
    - closings.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - closings.loan_file_id
      action_bindings:
        closings.loan_file_id: loan_file_id
    dedup_contract:
      table: closings
      mode: separate_record
      object_bindings:
        loan_file_id: loan_file_id
      duplicate_filters:
        status:
        - scheduled
        - docs_out
        - signed
        - in_rescission
      distinct_fields: []
- id: funding_method_eligibility
  subject:
  - funding_closing_scheduled
  - funding_closing_date_changed
  rule: 'A closing is scheduled only while the loan file status is conditionally_approved or clear_to_close. The
    closing method must fit the file: property_state in eligible_property_states, loan program in eligible_loan_programs
    and loan_purpose in eligible_loan_purposes. Where esign_consent_required is true, E-SIGN consent must be on
    file. A power of attorney closing needs the power of attorney approved no later than poa_approval_business_days_before_closing
    business days before the scheduled closing date. The settlement agent must be on Larkspur''s approved list with
    a closing protection letter. rescission_applies is true exactly when loan_purpose is in rescission_purposes
    and occupancy is rescission_occupancy. estimated_funding_date is the scheduled closing date moved forward by
    funding_business_days_after_signing business days, or, when rescission applies, the day after the rescission
    expiration date. Moving the signing date before documents are drawn costs reschedule_fee.'
  eligibility:
  - id: file_ready_to_schedule
    applies_to:
    - funding_closing_scheduled
    kind: state
    condition: A closing is scheduled only while the loan file status is conditionally_approved or clear_to_close.
    evidence_fields:
    - loan_files.status
    - loan_files.loan_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loan_files.loan_file_id
      action_bindings:
        loan_files.loan_file_id: loan_file_id
    state_contract:
      field: loan_files.status
      allowed:
      - conditionally_approved
      - clear_to_close
- id: funding_document_package
  subject:
  - funding_docs_drawn
  - funding_docs_voided
  - funding_signed
  rule: Closing documents are drawn only while the loan file status is clear_to_close. Documents are drawn at least
    docs_draw_lead_business_days business days before the scheduled closing date. A drawn package may be signed
    only on or before its expiration date, which ends the validity period that starts on the draw date. Count calendar
    days forward from docs_drawn_date, which is day zero; docs_expiration_date is the last day of the count and
    a signing on it is valid. A signing may be moved within the package's validity up to reschedules_before_redraw
    times without a redraw. A package that expires, or that must change because the rate, fees, loan amount or a
    borrower name changed, is voided and redrawn; the redraw is charged doc_redraw_fee when the reason is the borrower's
    (a borrower-requested change or a missed signing) and is free when Larkspur caused it (redraw_waived_when_larkspur_caused),
    including a changed circumstance that is Larkspur's own error.
  eligibility:
  - id: ctc_before_docs
    applies_to:
    - funding_docs_drawn
    kind: state
    condition: Closing documents are drawn only while the loan file status is clear_to_close.
    evidence_fields:
    - loan_files.status
    - loan_files.loan_file_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - loan_files.loan_file_id
      action_bindings:
        loan_files.loan_file_id: loan_file_id
    state_contract:
      field: loan_files.status
      allowed:
      - clear_to_close
  - id: sign_before_docs_expire
    applies_to:
    - funding_signed
    kind: time
    condition: A drawn package may be signed only on or before its expiration date, which ends the validity period
      that starts on the draw date.
    evidence_fields:
    - closings.docs_drawn_date
    - closings.closing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: &id007
      - - closings.closing_id
      action_bindings: &id008
        closings.closing_id: closing_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the draw date
      anchor_source: closings.docs_drawn_date
      relation: not_after
      duration_source: variants.docs_validity_calendar_days
      unit: calendar_days
      counting_rule: Count calendar days forward from docs_drawn_date, which is day zero; docs_expiration_date is
        the last day of the count and a signing on it is valid.
      boundary: inclusive
  measures:
  - funding_msr_redraws
- id: funding_rescission
  subject:
  - funding_rescission_started
  - funding_rescinded
  - funding_signed
  rule: Where rescission_applies is true the borrower may rescind for rescission_business_days specific business
    days after the latest of signing, delivery of the Notice of Right to Cancel and delivery of the material disclosures,
    where a specific business day is every calendar day except Sundays and the US federal public holidays. Count
    specific business days forward from the signing_date, which is day zero; the rescission_expiration_date is the
    third such day and rescission is possible until midnight of that day. Only the borrower (any one of the borrowers
    with an ownership interest) can rescind, in writing; Larkspur records it and returns the wire if one was sent.
    A rescission waiver is allowed only for a bona fide personal financial emergency stated in a dated, signed statement
    from every borrower (rescission_waiver_requires_emergency_statement); a printed waiver form is never accepted.
    Purchases, second homes and investment properties carry no rescission.
  eligibility: []
- id: funding_authorization
  subject:
  - funding_wire_sent
  - funding_completed
  rule: Funds are wired only while the closing status is signed or in_rescission. Where rescission applies, funds
    may be wired only on or after the first funding day that follows the rescission expiration date. Count calendar
    days forward from rescission_expiration_date, which is day zero; the wire_date must be on or after the day reached
    by the count. The wire is released only when every prior-to-funding condition is cleared or waived (funding_msr_open_ptf_conditions
    equals zero, ptf_conditions_clear_before_wire), the rate lock on the file is in force on the disbursement date
    (lock_must_cover_disbursement; an expired lock must be relocked first) and, for a dry or mail-away closing,
    the signed package has passed review within closing_package_review_business_days. A funding request received
    by funding_request_cutoff_time on a business day is wired that day by wire_cutoff_time; a later request is wired
    the next business day. When more than max_business_days_signing_to_funding business days pass between signing
    and funding, employment and credit verifications are redone before the wire. The disbursement_date is the wire
    date, and the first_payment_date is the first day of the month first_payment_month_offset months after the disbursement
    month.
  eligibility:
  - id: signed_before_wire
    applies_to:
    - funding_wire_sent
    kind: state
    condition: Funds are wired only while the closing status is signed or in_rescission.
    evidence_fields:
    - closings.status
    - closings.closing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id007
      action_bindings: *id008
    state_contract:
      field: closings.status
      allowed:
      - signed
      - in_rescission
  - id: after_rescission
    applies_to:
    - funding_wire_sent
    kind: time
    condition: Where rescission applies, funds may be wired only on or after the first funding day that follows
      the rescission expiration date.
    evidence_fields:
    - closings.rescission_expiration_date
    - closings.closing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id007
      action_bindings: *id008
    temporal_basis:
      clock: frozen_time
      anchor_event: the rescission expiration date
      anchor_source: closings.rescission_expiration_date
      relation: not_before
      duration_source: variants.funding_days_after_rescission_expiry
      unit: calendar_days
      counting_rule: Count calendar days forward from rescission_expiration_date, which is day zero; the wire_date
        must be on or after the day reached by the count.
      boundary: inclusive
  measures:
  - funding_msr_open_ptf_conditions
- id: funding_per_diem_interest
  subject:
  - funding_per_diem_charged
  - funding_per_diem_refunded
  rule: 'Interest accrues from the disbursement date. At closing prepaid interest is collected from estimated_funding_date
    through the last day of that month, both days counted: daily_interest_amount is loan_amount times note_rate
    percent divided by per_diem_day_count_basis, rounded to per_diem_daily_rounding_decimals, and interest_amount
    is daily_interest_amount times interest_days. When the actual disbursement_date is later than estimated_funding_date,
    the interest for the days from estimated_funding_date up to the day before disbursement_date is refunded (funding_later_than_estimated)
    at the same daily amount, within per_diem_refund_business_days business days; when disbursement moves into the
    next month, every day collected for the earlier month is refunded. When funding is earlier than estimated, the
    shortfall is never billed after closing (post_closing_interest_shortfall_collected is false). Interest for days
    lost to a wire returned for a Larkspur-side reason is refunded (returned_wire_delay) where returned_wire_interest_borne_by_larkspur
    is true. An arithmetic mistake is refunded as calculation_error. A prepaid interest refund corrects only a charge
    entry that has not already been refunded for the same reason. Each refund names the charge entry it corrects.'
  eligibility:
  - id: interest_refund_once
    applies_to:
    - funding_per_diem_refunded
    kind: dedup
    condition: A prepaid interest refund corrects only a charge entry that has not already been refunded for the
      same reason.
    evidence_fields:
    - funding_interest_ledger.source_interest_entry_id
    - funding_interest_ledger.refund_reason
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - funding_interest_ledger.source_interest_entry_id
      action_bindings:
        funding_interest_ledger.source_interest_entry_id: source_interest_entry_id
    dedup_contract:
      table: funding_interest_ledger
      mode: separate_record
      object_bindings:
        source_interest_entry_id: source_interest_entry_id
      duplicate_filters:
        event_type:
        - funding_per_diem_refunded
      distinct_fields:
      - refund_reason
  formula:
    daily_interest_amount: round(loan_amount * note_rate / 100 / per_diem_day_count_basis, 2)
    interest_amount: daily_interest_amount * interest_days
  params:
    per_tier:
      Larkspur Traditional Wet Closing:
        per_diem_day_count_basis: =per_diem_day_count_basis
      Larkspur Escrow Dry-Funding Closing:
        per_diem_day_count_basis: =per_diem_day_count_basis
      Larkspur Mobile Notary Closing:
        per_diem_day_count_basis: =per_diem_day_count_basis
      Larkspur Hybrid eClosing:
        per_diem_day_count_basis: =per_diem_day_count_basis
      Larkspur Remote Online Notarization Closing:
        per_diem_day_count_basis: =per_diem_day_count_basis
      Larkspur Power of Attorney Closing:
        per_diem_day_count_basis: =per_diem_day_count_basis
      Larkspur Mail-Away Closing:
        per_diem_day_count_basis: =per_diem_day_count_basis
- id: funding_closing_fees
  subject:
  - funding_fee_charged
  - funding_fee_reversed
  rule: 'Closing fees follow the closing method''s schedule and are charged on the Closing Disclosure: closing_method_fee
    once per closing; after_hours_signing_fee once when the signing is held on a weekday after 18:00 or on a Saturday
    or Sunday and after_hours_available is true; courier_fee once for a mail-away package; wire_fee once per outgoing
    funding wire (a wire re-sent after a Larkspur-side return is not charged again); poa_review_fee once per power
    of attorney reviewed; doc_redraw_fee once per borrower-caused redraw. A fee not in the method''s schedule, or
    a redraw Larkspur caused, is reversed in full. A fee reversal applies only to a fee entry that has not already
    been reversed. Cancelling a closing costs cancellation_fee.'
  eligibility:
  - id: fee_reversed_once
    applies_to:
    - funding_fee_reversed
    kind: dedup
    condition: A fee reversal applies only to a fee entry that has not already been reversed.
    evidence_fields:
    - funding_fee_ledger.source_fee_entry_id
    - funding_fee_ledger.closing_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - funding_fee_ledger.source_fee_entry_id
      action_bindings:
        funding_fee_ledger.source_fee_entry_id: source_fee_entry_id
    dedup_contract:
      table: funding_fee_ledger
      mode: separate_record
      object_bindings:
        source_fee_entry_id: source_fee_entry_id
      duplicate_filters:
        event_type:
        - funding_fee_reversed
      distinct_fields: []
  params:
    per_tier:
      Larkspur Traditional Wet Closing:
        closing_method_fee: =closing_method_fee
        courier_fee: =courier_fee
        doc_redraw_fee: =doc_redraw_fee
      Larkspur Escrow Dry-Funding Closing:
        closing_method_fee: =closing_method_fee
        courier_fee: =courier_fee
        doc_redraw_fee: =doc_redraw_fee
      Larkspur Mobile Notary Closing:
        closing_method_fee: =closing_method_fee
        courier_fee: =courier_fee
        doc_redraw_fee: =doc_redraw_fee
      Larkspur Hybrid eClosing:
        closing_method_fee: =closing_method_fee
        courier_fee: =courier_fee
        doc_redraw_fee: =doc_redraw_fee
      Larkspur Remote Online Notarization Closing:
        closing_method_fee: =closing_method_fee
        courier_fee: =courier_fee
        doc_redraw_fee: =doc_redraw_fee
      Larkspur Power of Attorney Closing:
        closing_method_fee: =closing_method_fee
        courier_fee: =courier_fee
        doc_redraw_fee: =doc_redraw_fee
      Larkspur Mail-Away Closing:
