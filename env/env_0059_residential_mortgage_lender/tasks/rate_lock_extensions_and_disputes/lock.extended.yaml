- id: lock_ext_extension_dispute_relief
  base_policy_refs:
  - lock_dispute_resolution
  - lock_extension
  overwrite:
  - base_policy: lock_dispute_resolution
    superseded_clause: For an extension_charge_disputed dispute, the charged extension is waived (extension_cost_waived)
      only when the appraisal-delay case of the extension policy covers it; otherwise it is denied_borrower_caused.
    replaced_by: A timely dispute against an extension charge is decided extension cost waived when its relief days are
      above zero, and denied as borrower caused when they are zero.
  - base_policy: lock_extension
    superseded_clause: Larkspur bears extension days in two cases only.
    replaced_by: When the lock desk decides a dispute against an extension charge, and only in that decision, Larkspur relieves
      the disputed extension of the days its own appraisal ordering cost the borrower, adjusted as set out below; this sits
      beside the two base cases in which Larkspur bears extension days, the complimentary days of a lock's first extension
      and the appraisal-delay days, which still govern every other situation, apart from the clear-to-close days an extension
      booking leaves uncharged and the goodwill Larkspur adds when it waives an appraisal-covered charge on its own initiative.
  trigger: state_due
  subject:
  - lock_dispute_resolved
  - lock_cost_waived
  computes: waived_amount
  target_tool: decide_extension_charge_dispute_a9bc145e
  params:
    rush_order_grace_days: 1
    complex_order_grace_days: 5
    standard_order_grace_days: 3
    long_wait_days: 10
    wait_days: 5
    long_wait_goodwill_days: 2
    wait_goodwill_days: 1
    verified_loyalty_goodwill_days: 2
    reserved_loyalty_goodwill_days: 1
    repeat_suspension_offset_days: 2
    suspension_offset_days: 1
    reference_monday: '2024-01-01'
  rule: 'A dispute the borrower filed against an extension charge is owed a decision by the lock desk, and the decision
    fixes how much of that extension''s charge Larkspur relieves. A timely dispute against an extension charge is decided
    extension cost waived when its relief days are above zero, and denied as borrower caused when they are zero. When the
    lock desk decides a dispute against an extension charge, and only in that decision, Larkspur relieves the disputed extension
    of the days its own appraisal ordering cost the borrower, adjusted as set out below; this sits beside the two base cases
    in which Larkspur bears extension days, the complimentary days of a lock''s first extension and the appraisal-delay
    days, which still govern every other situation, apart from the clear-to-close days an extension booking leaves uncharged
    and the goodwill Larkspur adds when it waives an appraisal-covered charge on its own initiative. The appraisal ordering
    days are the calendar days from the borrower''s intent to proceed on the loan file to the date the appraisal order was
    placed, less the standard order grace, never below zero. The relief days of a disputed extension are its appraisal ordering
    days, never more than the disputed extension''s charged days (its extension days less its Larkspur-borne days). The
    waived points are the relief days times the disputed extension''s per-day points (its cost points divided by its charged
    days), rounded to three decimal places, and the waived amount is the waived points times the lock''s loan amount at
    lock divided by 100, rounded to the cent. The ordering clock does not always start at the intent to proceed: when the
    appraisal order was transferred in from another lender, the clock starts on the date the order was placed, so no ordering
    days arise; when the order was not transferred in and the borrower gave the intent to proceed on a Saturday or a Sunday,
    the clock starts on the following Monday, because Larkspur''s appraisal desk places orders on business days; otherwise
    the clock starts on the intent-to-proceed date. The order grace depends on the order: an order placed with rush turn
    time has the rush order grace; an order without rush for a Larkspur Complex Property Appraisal (Form 1004 Jumbo) or
    a Larkspur Small Residential Income Appraisal (Form 1025) has the complex order grace; any other order has the standard
    order grace. Larkspur adds goodwill days for the time the dispute waited: when the decision is recorded more than the
    long-wait threshold of calendar days after the filing date, the long-wait goodwill days are added; when it is recorded
    more than the wait threshold but no more than the long-wait threshold of calendar days after filing, the wait goodwill
    days are added; otherwise none are added. Larkspur adds loyalty goodwill days for a borrower whose loan file carries
    a Larkspur Returning Customer Credit: when that credit is verified or applied and its award entry is booked on the credit
    ledger, the verified loyalty goodwill days are added; when it is only reserved, the reserved loyalty goodwill days are
    added; otherwise none are added. The borrower''s own suspensions offset the relief, because a file suspended for overdue
    conditions was held up by the borrower as well: when the loan file has been resubmitted from suspense two or more times,
    the repeat suspension offset days are subtracted; when it has been resubmitted once, the suspension offset days are
    subtracted; otherwise nothing is subtracted. With these, the relief days are the appraisal ordering days plus the goodwill
    and loyalty days less the suspension offset, never below zero and never more than the disputed extension''s charged
    days. A decision that waives books one waiver entry naming the disputed extension, borne by Larkspur, and lowers the
    lock''s lock cost balance by the waived amount.'
  prerequisite: []
  cross_category:
  - category: loan
    as: branch
    reads:
    - intent_to_proceed_date
    - resubmission_count
    note: the ordering clock starts from the intent-to-proceed date and the suspension offset reads the resubmission count
  - category: appraisal
    as: branch
    reads:
    - ordered_date
    - order_reason
    - rush_requested
    - variant_name
    note: the ordering clock and the order grace read the appraisal order
  - category: credit
    as: branch
    reads:
    - status
    - credit_award_id
    - credit_ledger.event_type
    note: the loyalty goodwill reads the status of the file's Returning Customer Credit and its award entry on the credit
      ledger
  compute:
  - disputed_entry: LATEST('lock_disputes', 'disputed_pricing_id', date_field='filed_date', event_type='lock_dispute_filed',
      dispute_reason='extension_charge_disputed', resolution='pending')
  - filed_on: LATEST('lock_disputes', 'filed_date', date_field='filed_date', event_type='lock_dispute_filed', dispute_reason='extension_charge_disputed',
      resolution='pending')
  - entry_points: MAX('lock_pricing_events', 'cost_points', lock_pricing_id=disputed_entry)
  - entry_charged: MAX('lock_pricing_events', 'extension_days', lock_pricing_id=disputed_entry) - MAX('lock_pricing_events',
      'larkspur_borne_days', lock_pricing_id=disputed_entry)
  - per_day_points: entry_points / entry_charged
  - itp_on: CFIELD('loan', 'intent_to_proceed_date', loan_file_id=F('loan_file_id'))
  - ordered_on: CFIELD('appraisal', 'ordered_date', loan_file_id=F('loan_file_id'))
  - order_reason: CFIELD('appraisal', 'order_reason', loan_file_id=F('loan_file_id'))
  - itp_weekday: DAYS(K('reference_monday'), itp_on) % 7
  - clock_days: 0 if order_reason == 'transferred_in' else (DAYS(itp_on, ordered_on) - (7 - itp_weekday) if itp_weekday
      >= 5 else DAYS(itp_on, ordered_on))
  - rush_flag: CFIELD('appraisal', 'rush_requested', loan_file_id=F('loan_file_id'))
  - report_type: CFIELD('appraisal', 'variant_name', loan_file_id=F('loan_file_id'))
  - order_grace: K('rush_order_grace_days') if rush_flag == True else (K('complex_order_grace_days') if (report_type ==
      'Larkspur Complex Property Appraisal (Form 1004 Jumbo)' or report_type == 'Larkspur Small Residential Income Appraisal
      (Form 1025)') else K('standard_order_grace_days'))
  - ordering_days: MX(0, clock_days - order_grace)
  - wait_days_open: DAYS(filed_on, NOW)
  - wait_goodwill: K('long_wait_goodwill_days') if wait_days_open > K('long_wait_days') else (K('wait_goodwill_days') if
      wait_days_open > K('wait_days') else 0)
  - loyalty_status: CFIELD('credit', 'status', loan_file_id=F('loan_file_id'), variant_name='Larkspur Returning Customer
      Credit')
  - loyalty_award_id: CFIELD('credit', 'credit_award_id', loan_file_id=F('loan_file_id'), variant_name='Larkspur Returning
      Customer Credit')
  - loyalty_awards: XCOUNT('credit', 'credit_ledger', event_type='credit_award_booked', credit_award_id=loyalty_award_id)
  - loyalty_goodwill: K('verified_loyalty_goodwill_days') if ((loyalty_status == 'verified' or loyalty_status == 'applied')
      and loyalty_awards > 0) else (K('reserved_loyalty_goodwill_days') if loyalty_status == 'reserved' else 0)
  - resubmissions: CFIELD('loan', 'resubmission_count', loan_file_id=F('loan_file_id'))
  - suspension_offset: K('repeat_suspension_offset_days') if resubmissions >= 2 else (K('suspension_offset_days') if resubmissions
      == 1 else 0)
  - relief_days: MN(entry_charged, MX(0, ordering_days + wait_goodwill + loyalty_goodwill - suspension_offset))
  - waived_points: RND(relief_days * per_day_points, 3)
  - result: RND(waived_points * F('loan_amount_at_lock') / 100, 2)
  compute_basis:
    disputed_entry: A decision that waives books one waiver entry naming the disputed extension, borne by Larkspur, and
      lowers the lock's lock cost balance by the waived amount.
    filed_on: when the decision is recorded more than the long-wait threshold of calendar days after the filing date, the
