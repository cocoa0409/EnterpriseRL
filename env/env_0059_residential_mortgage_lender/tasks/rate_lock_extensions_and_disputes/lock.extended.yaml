- id: lock_ext_extension_charge
  base_policy_refs:
  - lock_extension
  overwrite:
  - base_policy: lock_extension
    superseded_clause: The charged days are extension_days less larkspur_borne_days; cost_points is the charged days times
      extension_cost_bps_per_day divided by 100, and cost_amount is cost_points times loan_amount_at_lock divided by 100,
      rounded to the cent.
    replaced_by: For every extension this policy books, the cost points are its charged days, counted under the counting
      rule below, times its per-day cost after every adjustment below, divided by 100 and rounded to three decimal places,
      and its cost is the cost points times the loan amount at lock divided by 100, rounded to the cent.
  - base_policy: lock_extension
    superseded_clause: Larkspur bears extension days in two cases only.
    replaced_by: For a loan file that is clear to close, and only on an extension this policy books, Larkspur also bears
      every day of the new extension beyond the days counted to the file's funding or closing date under the counting rule;
      this sits beside the two base cases in which Larkspur bears extension days, the complimentary days of a lock's first
      extension and the appraisal-delay days, which still govern every other situation, apart from the relief a decided
      extension-charge dispute grants and the goodwill Larkspur adds when it waives an appraisal-covered charge on its own
      initiative.
  - base_policy: lock_extension
    superseded_clause: Second, when the loan's appraisal order was completed after its due_date, Larkspur bears as many
      extension days as the appraisal was late (completed_date minus due_date in calendar days), never more than lender_delay_waiver_max_days
      borne for this reason across the lock.
    replaced_by: For an extension booked under this policy, Larkspur bears as many appraisal-delay days as the appraisal
      report was late, never more than the lender-delay allowance across the lock, and every lender-delay day already relieved
      on the lock, for any reason, counts against that allowance, not only the days borne for the appraisal delay; a waiver
      Larkspur books on its own initiative and a decided extension-charge dispute measure their days under their own rules.
  trigger: on_request
  subject:
  - lock_extension_booked
  - lock_expiration_updated
  computes: cost_amount
  target_tool: book_lock_extension_178d685b
  params:
    repeat_step_bps: 0.5
    repeat_step_high_bps: 1.0
    early_notice_days: 7
    early_notice_credit_bps: 0.25
    same_day_surcharge_bps: 0.5
    recent_return_months: 36
    recent_return_credit_bps: 0.25
    return_credit_bps: 0.125
    jumbo_step_bps: 0.5
    high_balance_step_bps: 0.25
    investment_step_bps: 0.5
    second_home_step_bps: 0.25
  rule: 'A new extension on a locked lock is booked from the lock''s latest extension request, and its cost is worked out
    as follows. An extension is booked, and its cost fixed, only after the lock request log carries an extension request
    dated later than the lock''s latest extension entry and no later than the lock''s current expiration date. The cost
    of an extension is not fixed until every dispute filed on the lock against an earlier extension charge carries its decision
    record. The extension booked is the shortest of the lock''s sold extension lengths that is at least the days asked for
    on the lock''s latest extension request, never longer than the longest sold length; it is booked as the next extension
    in the lock''s sequence, and its new expiration date is set under the extension policy. The per-day cost of an extension
    is the lock''s extension cost per day in basis points. The Larkspur-borne days of an extension are the lock''s complimentary
    extension days when it is the lock''s first extension, plus the appraisal-delay days: the calendar days by which the
    file''s appraisal report was completed after its due date, never more than the lock''s lender-delay allowance, less
    the lender-delay days already relieved on the lock, never below zero and counted in whole days with any fraction of
    a day dropped; the days already relieved are the Larkspur-borne days booked on its earlier extensions beyond the complimentary
    days plus, for the lock''s waiver entries, their waived dollars divided by the dollar value of one day at the lock''s
    standard per-day cost. For an extension booked under this policy, Larkspur bears as many appraisal-delay days as the
    appraisal report was late, never more than the lender-delay allowance across the lock, and every lender-delay day already
    relieved on the lock, for any reason, counts against that allowance, not only the days borne for the appraisal delay;
    a waiver Larkspur books on its own initiative and a decided extension-charge dispute measure their days under their
    own rules. The charged days are the extension days less the Larkspur-borne days, never below zero. The cost points are
    the charged days times the per-day cost divided by 100, rounded to three decimal places, and the cost is the cost points
    times the loan amount at lock divided by 100, rounded to the cent. For every extension this policy books, the cost points
    are its charged days, counted under the counting rule below, times its per-day cost after every adjustment below, divided
    by 100 and rounded to three decimal places, and its cost is the cost points times the loan amount at lock divided by
    100, rounded to the cent. Each step below adds to or subtracts from the per-day cost, and the adjusted per-day cost
    is never below zero. The repeat step: when the lock''s earlier extension entries outnumber its waiver entries by two
    or more, or the lock has been relocked, the high repeat step is added; when they outnumber its waiver entries by exactly
    one and the lock has never been relocked, the repeat step is added; otherwise no repeat step is added. The notice adjustment:
    when the latest extension request was logged at least the early-notice days before the lock''s current expiration date,
    the early-notice credit is subtracted; when it was logged on the current expiration date itself or later, the same-day
    surcharge is added; otherwise no notice adjustment applies. The returning-borrower credit: when the customer holds another
    Larkspur loan file in consummated status that closed fewer than the recent-return months before today, the recent-return
    credit is subtracted; when that consummated file closed the recent-return months or more before today, the return credit
    is subtracted; otherwise no returning-borrower credit applies. The program step: a Larkspur Jumbo 30-Year Fixed file
    adds the jumbo step, a Larkspur High-Balance Conforming 30-Year Fixed file adds the high-balance step, and any other
    program adds none. The occupancy step: an investment property adds the investment step, a second home adds the second-home
    step, and a primary residence adds none. The counting rule: when the loan file is clear to close and a closing is scheduled
    on it (closing status scheduled or docs out), the days counted are the calendar days from the lock''s current expiration
    date to that closing''s estimated funding date, never more than the extension days; when the loan file is clear to close
    and no closing is scheduled, the days counted are the calendar days from the current expiration date to the file''s
    estimated closing date, never more than the extension days; otherwise the days counted are the extension days in full.
    For a loan file that is clear to close, and only on an extension this policy books, Larkspur also bears every day of
    the new extension beyond the days counted to the file''s funding or closing date under the counting rule; this sits
    beside the two base cases in which Larkspur bears extension days, the complimentary days of a lock''s first extension
    and the appraisal-delay days, which still govern every other situation, apart from the relief a decided extension-charge
    dispute grants and the goodwill Larkspur adds when it waives an appraisal-covered charge on its own initiative. The
    charged days are then the days counted less the Larkspur-borne days, never below zero, and the Larkspur-borne days booked
    on the entry are the extension days less the charged days. An extension with charged days is booked with the borrower
    as cost bearer; one with none is booked with Larkspur as cost bearer and a cost of 0.00. The cost is added to the lock''s
    lock cost balance.'
  prerequisite:
  - problem: lock_ext_extension_request_length
    kind: state_gate
    gate: lock_extension.requested_by_expiration
    form: state
    policy_source: An extension is booked, and its cost fixed, only after the lock request log carries an extension request
      dated later than the lock's latest extension entry and no later than the lock's current expiration date.
    condition: lock_requests holds a request of request_type extension for the lock whose request_date is later than the
      event_date of the lock's latest lock_extension_booked entry and on or before rate_locks.lock_expiration_date.
    resolved_by: submit_lock_extension_request_8348adff
    effect: the requested_by_expiration gate of the extension policy holds, and asked_days and ask_date read that request,
      so the extension length and the notice adjustment rest on it.
  - problem: lock_ext_extension_dispute_relief
    kind: value_input
    gate: repeat_step
    form: state
    policy_source: The cost of an extension is not fixed until every dispute filed on the lock against an earlier extension
      charge carries its decision record.
    condition: every lock_disputes filing record of dispute_reason extension_charge_disputed on the lock is named by a resolution
      record through source_dispute_id.
    resolved_by: decide_extension_charge_dispute_a9bc145e
    effect: a decision that waives books a lock_cost_waived entry naming the disputed extension; each such entry lowers
      unrelieved_ext by one, which can move repeat_step to a lower tier.
  cross_category:
  - category: loan
    as: branch
    reads:
    - closed_date
    - status
    - variant_name
    - occupancy
    - estimated_closing_date
    note: the returning-borrower credit, program step, occupancy step and counting rule read the customer's loan files
  - category: funding
    as: branch
    reads:
    - status
    - estimated_funding_date
    note: the counting rule reads the scheduled closing's status and estimated funding date
  - category: appraisal
    as: branch
    reads:
    - due_date
    - completed_date
    note: the appraisal-delay days read the appraisal order's due and completion dates
  compute:
  - asked_days: LATEST('lock_requests', 'requested_term_days', date_field='request_date', request_type='extension')
  - shortest_len: min(P('extension_increment_days'))
  - longest_len: max(P('extension_increment_days'))
  - ext_days: MN(longest_len, MX(shortest_len, -((-asked_days) // shortest_len) * shortest_len))
  - cur_exp: F('lock_expiration_date')
  - prior_ext: COUNT('lock_pricing_events', event_type='lock_extension_booked')
  - waiver_entries: COUNT('lock_pricing_events', event_type='lock_cost_waived')
  - unrelieved_ext: prior_ext - waiver_entries
  - prior_relocks: COUNT('lock_pricing_events', event_type='lock_relock_fee_booked')
  - repeat_step: K('repeat_step_high_bps') if (unrelieved_ext >= 2 or prior_relocks >= 1) else (K('repeat_step_bps') if
      (unrelieved_ext == 1 and prior_relocks == 0) else 0)
  - ask_date: LATEST('lock_requests', 'request_date', date_field='request_date', request_type='extension')
  - notice_days: DAYS(ask_date, cur_exp)
  - notice_adjust: 0 - K('early_notice_credit_bps') if notice_days >= K('early_notice_days') else (K('same_day_surcharge_bps')
      if notice_days <= 0 else 0)
  - prior_close: CFIELD('loan', 'closed_date', status='consummated')
  - returning_credit: K('recent_return_credit_bps') if (prior_close and MONTHS(prior_close, NOW) < K('recent_return_months'))
      else (K('return_credit_bps') if prior_close else 0)
  - program: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - program_step: K('jumbo_step_bps') if program == 'Larkspur Jumbo 30-Year Fixed' else (K('high_balance_step_bps') if program
      == 'Larkspur High-Balance Conforming 30-Year Fixed' else 0)
  - occupancy: CFIELD('loan', 'occupancy', loan_file_id=F('loan_file_id'))
  - occupancy_step: K('investment_step_bps') if occupancy == 'investment_property' else (K('second_home_step_bps') if occupancy
      == 'second_home' else 0)
  - per_day_bps: MX(0, P('extension_cost_bps_per_day') + repeat_step + notice_adjust + program_step + occupancy_step - returning_credit)
  - comp_days: P('complimentary_extension_days') if prior_ext == 0 else 0
  - appr_due: CFIELD('appraisal', 'due_date', loan_file_id=F('loan_file_id'))
  - appr_done: CFIELD('appraisal', 'completed_date', loan_file_id=F('loan_file_id'))
  - appraisal_late: MX(0, DAYS(appr_due, appr_done)) if appr_done else 0
  - borne_before: SUM('lock_pricing_events', 'larkspur_borne_days', event_type='lock_extension_booked')
  - waived_dollars: SUM('lock_pricing_events', 'cost_amount', event_type='lock_cost_waived')
  - relieved_days: MX(0, borne_before - P('complimentary_extension_days')) + waived_dollars / (F('loan_amount_at_lock')
      * P('extension_cost_bps_per_day') / 10000)
  - appraisal_borne: int(MX(0, MN(appraisal_late, P('lender_delay_waiver_max_days')) - relieved_days))
  - file_status: CFIELD('loan', 'status', loan_file_id=F('loan_file_id'))
  - closing_state: CFIELD('funding', 'status', loan_file_id=F('loan_file_id'))
  - closing_set: closing_state == 'scheduled' or closing_state == 'docs_out'
  - funding_on: CFIELD('funding', 'estimated_funding_date', loan_file_id=F('loan_file_id'))
  - file_close_on: CFIELD('loan', 'estimated_closing_date', loan_file_id=F('loan_file_id'))
  - counted_days: MN(ext_days, MX(0, DAYS(cur_exp, funding_on))) if (file_status == 'clear_to_close' and closing_set) else
      (MN(ext_days, MX(0, DAYS(cur_exp, file_close_on))) if (file_status == 'clear_to_close' and not closing_set) else ext_days)
  - charged_days: MX(0, counted_days - comp_days - appraisal_borne)
  - cost_points: RND(charged_days * per_day_bps / 100, 3)
  - result: RND(cost_points * F('loan_amount_at_lock') / 100, 2)
  compute_basis:
    asked_days: The extension booked is the shortest of the lock's sold extension lengths that is at least the days asked
      for on the lock's latest extension request, never longer than the longest sold length;
    shortest_len: The extension booked is the shortest of the lock's sold extension lengths that is at least the days asked
      for on the lock's latest extension request, never longer than the longest sold length;
    longest_len: never longer than the longest sold length;
    ext_days: The extension booked is the shortest of the lock's sold extension lengths that is at least the days asked
      for on the lock's latest extension request, never longer than the longest sold length;
    cur_exp: when the latest extension request was logged at least the early-notice days before the lock's current expiration
      date, the early-notice credit is subtracted;
    prior_ext: when the lock's earlier extension entries outnumber its waiver entries by two or more, or the lock has been
      relocked, the high repeat step is added;
    waiver_entries: when the lock's earlier extension entries outnumber its waiver entries by two or more, or the lock has
      been relocked, the high repeat step is added;
    unrelieved_ext: when they outnumber its waiver entries by exactly one and the lock has never been relocked, the repeat
      step is added;
    prior_relocks: or the lock has been relocked, the high repeat step is added;
    repeat_step: 'The repeat step: when the lock''s earlier extension entries outnumber its waiver entries by two or more,
      or the lock has been relocked, the high repeat step is added; when they outnumber its waiver entries by exactly one
      and the lock has never been relocked, the repeat step is added; otherwise no repeat step is added.'
    ask_date: when the latest extension request was logged at least the early-notice days before the lock's current expiration
      date, the early-notice credit is subtracted;
    notice_days: when the latest extension request was logged at least the early-notice days before the lock's current expiration
      date, the early-notice credit is subtracted;
    notice_adjust: 'The notice adjustment: when the latest extension request was logged at least the early-notice days before
      the lock''s current expiration date, the early-notice credit is subtracted; when it was logged on the current expiration
      date itself or later, the same-day surcharge is added; otherwise no notice adjustment applies.'
    prior_close: when the customer holds another Larkspur loan file in consummated status that closed fewer than the recent-return
      months before today, the recent-return credit is subtracted;
    returning_credit: 'The returning-borrower credit: when the customer holds another Larkspur loan file in consummated
      status that closed fewer than the recent-return months before today, the recent-return credit is subtracted; when
      that consummated file closed the recent-return months or more before today, the return credit is subtracted; otherwise
      no returning-borrower credit applies.'
    program: 'The program step: a Larkspur Jumbo 30-Year Fixed file adds the jumbo step, a Larkspur High-Balance Conforming
      30-Year Fixed file adds the high-balance step, and any other program adds none.'
    program_step: 'The program step: a Larkspur Jumbo 30-Year Fixed file adds the jumbo step, a Larkspur High-Balance Conforming
      30-Year Fixed file adds the high-balance step, and any other program adds none.'
    occupancy: 'The occupancy step: an investment property adds the investment step, a second home adds the second-home
      step, and a primary residence adds none.'
    occupancy_step: 'The occupancy step: an investment property adds the investment step, a second home adds the second-home
      step, and a primary residence adds none.'
    per_day_bps: Each step below adds to or subtracts from the per-day cost, and the adjusted per-day cost is never below
      zero.
    comp_days: The Larkspur-borne days of an extension are the lock's complimentary extension days when it is the lock's
      first extension,
    appr_due: the calendar days by which the file's appraisal report was completed after its due date, never more than the
      lock's lender-delay allowance,
    appr_done: the calendar days by which the file's appraisal report was completed after its due date, never more than
      the lock's lender-delay allowance,
    appraisal_late: the calendar days by which the file's appraisal report was completed after its due date, never more
      than the lock's lender-delay allowance,
    borne_before: the days already relieved are the Larkspur-borne days booked on its earlier extensions beyond the complimentary
      days plus,
    waived_dollars: for the lock's waiver entries, their waived dollars divided by the dollar value of one day at the lock's
      standard per-day cost.
    relieved_days: the days already relieved are the Larkspur-borne days booked on its earlier extensions beyond the complimentary
      days plus, for the lock's waiver entries, their waived dollars divided by the dollar value of one day at the lock's
      standard per-day cost.
    appraisal_borne: never more than the lock's lender-delay allowance, less the lender-delay days already relieved on the
      lock, never below zero and counted in whole days with any fraction of a day dropped;
    file_status: when the loan file is clear to close and a closing is scheduled on it (closing status scheduled or docs
      out),
    closing_state: when the loan file is clear to close and a closing is scheduled on it (closing status scheduled or docs
      out),
    closing_set: when the loan file is clear to close and a closing is scheduled on it (closing status scheduled or docs
      out),
    funding_on: the days counted are the calendar days from the lock's current expiration date to that closing's estimated
      funding date, never more than the extension days;
    file_close_on: the days counted are the calendar days from the current expiration date to the file's estimated closing
      date, never more than the extension days;
    counted_days: 'The counting rule: when the loan file is clear to close and a closing is scheduled on it (closing status
      scheduled or docs out), the days counted are the calendar days from the lock''s current expiration date to that closing''s
      estimated funding date, never more than the extension days; when the loan file is clear to close and no closing is
      scheduled, the days counted are the calendar days from the current expiration date to the file''s estimated closing
      date, never more than the extension days; otherwise the days counted are the extension days in full.'
    charged_days: The charged days are then the days counted less the Larkspur-borne days, never below zero,
    cost_points: The cost points are the charged days times the per-day cost divided by 100, rounded to three decimal places,
    result: and the cost is the cost points times the loan amount at lock divided by 100, rounded to the cent.
  factors:
  - id: repeat_step
    effect: parameter
    decides: repeat_step
    bindings:
    - prior_ext
    - waiver_entries
    - unrelieved_ext
    - prior_relocks
    - repeat_step
    ladder:
    - when: the lock's earlier extension entries outnumber its waiver entries by two or more, or the lock has been relocked
      value: K('repeat_step_high_bps')
    - when: the lock's earlier extension entries outnumber its waiver entries by exactly one and the lock has never been
        relocked
      value: K('repeat_step_bps')
    - when: otherwise
      value: '0'
    baseline:
      repeat_step: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: notice_adjust
    effect: parameter
    decides: notice_adjust
    bindings:
    - ask_date
    - notice_days
    - notice_adjust
    ladder:
    - when: the latest extension request was logged at least the early-notice days before the lock's current expiration
        date
      value: 0 - K('early_notice_credit_bps')
    - when: the latest extension request was logged on the current expiration date itself or later
      value: K('same_day_surcharge_bps')
    - when: otherwise
      value: '0'
    baseline:
      notice_adjust: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: returning_credit
    effect: parameter
    decides: returning_credit
    bindings:
    - prior_close
    - returning_credit
    ladder:
    - when: the customer holds another Larkspur loan file in consummated status that closed fewer than the recent-return
        months before today
      value: K('recent_return_credit_bps')
    - when: the customer's consummated Larkspur loan file closed the recent-return months or more before today
      value: K('return_credit_bps')
    - when: otherwise
      value: '0'
    baseline:
      returning_credit: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: loan
  - id: program_step
    effect: parameter
    decides: program_step
    bindings:
    - program
    - program_step
    ladder:
    - when: the loan file is a Larkspur Jumbo 30-Year Fixed file
      value: K('jumbo_step_bps')
    - when: the loan file is a Larkspur High-Balance Conforming 30-Year Fixed file
      value: K('high_balance_step_bps')
    - when: otherwise
      value: '0'
    baseline:
      program_step: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: occupancy_step
    effect: parameter
    decides: occupancy_step
    bindings:
    - occupancy
    - occupancy_step
    ladder:
    - when: the property is an investment property
      value: K('investment_step_bps')
    - when: the property is a second home
      value: K('second_home_step_bps')
    - when: otherwise
      value: '0'
    baseline:
      occupancy_step: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: counting_rule
    effect: method
    decides: counted_days
    bindings:
    - file_status
    - closing_state
    - closing_set
    - funding_on
    - file_close_on
    - counted_days
    ladder:
    - when: the loan file is clear to close and a closing is scheduled on it
      method: count the calendar days from the lock's current expiration date to the closing's estimated funding date, never
        more than the extension days
    - when: the loan file is clear to close and no closing is scheduled
      method: count the calendar days from the lock's current expiration date to the file's estimated closing date, never
        more than the extension days
    - when: otherwise
      method: count the extension days in full
    baseline:
      counted_days: ext_days
    evidence:
    - cross_category
    - date
    cross_difficulty: funding
  baseline:
    rule: 'The extension booked is the shortest of the lock''s sold extension lengths that is at least the days asked for
      on the lock''s latest extension request, never longer than the longest sold length; it is booked as the next extension
      in the lock''s sequence, and its new expiration date is set under the extension policy. The per-day cost of an extension
      is the lock''s extension cost per day in basis points. The Larkspur-borne days of an extension are the lock''s complimentary
      extension days when it is the lock''s first extension, plus the appraisal-delay days: the calendar days by which the
      file''s appraisal report was completed after its due date, never more than the lock''s lender-delay allowance, less
      the lender-delay days already relieved on the lock, never below zero and counted in whole days with any fraction of
      a day dropped; the days already relieved are the Larkspur-borne days booked on its earlier extensions beyond the complimentary
      days plus, for the lock''s waiver entries, their waived dollars divided by the dollar value of one day at the lock''s
      standard per-day cost. The charged days are the extension days less the Larkspur-borne days, never below zero. The
      cost points are the charged days times the per-day cost divided by 100, rounded to three decimal places, and the cost
      is the cost points times the loan amount at lock divided by 100, rounded to the cent.'
    params:
    - extension_cost_bps_per_day
    - extension_increment_days
    - complimentary_extension_days
    - lender_delay_waiver_max_days
  inputs:
    history:
    - table: lock_pricing_events
      aggregate: count
      field: lock_pricing_id
      filters:
        event_type: lock_extension_booked
    - table: lock_requests
      aggregate: latest
      field: requested_term_days
      filters:
        request_type: extension
    - table: lock_pricing_events
      aggregate: sum
      field: cost_amount
      filters:
        event_type: lock_cost_waived
    cross_category:
    - loan
    - funding
    - appraisal
- id: lock_ext_appraisal_delay_waiver
  base_policy_refs:
  - lock_extension
  - lock_dispute_resolution
  overwrite:
  - base_policy: lock_extension
    superseded_clause: Larkspur bears extension days in two cases only.
    replaced_by: When Larkspur waives on its own initiative an extension charge the appraisal-delay case covers, and only
      in such a waiver, it also bears the goodwill days set out below, and the waived amount is valued as set out below;
      this sits beside the two base cases in which Larkspur bears extension days, the complimentary days of a lock's first
      extension and the appraisal-delay days, which still govern every other situation, apart from the clear-to-close days
      an extension booking leaves uncharged and the relief a decided extension-charge dispute grants.
  - base_policy: lock_extension
    superseded_clause: Second, when the loan's appraisal order was completed after its due_date, Larkspur bears as many
      extension days as the appraisal was late (completed_date minus due_date in calendar days), never more than lender_delay_waiver_max_days
      borne for this reason across the lock.
    replaced_by: With these, for a waiver Larkspur books on its own initiative, and only for such a waiver, the covered
      days are the appraisal-delay days, as many as the appraisal report was late and within the lender-delay allowance
      across the lock, less the days already relieved, plus the goodwill days, less the builder-completion offset, never
      below zero and never more than the extension's charged days; an extension booking measures its appraisal-delay days
      under the extension-charge rules.
  trigger: state_due
  subject:
  - lock_cost_waived
  computes: waived_amount
  target_tool: waive_extension_charge_02e9996e
  params:
    late_correction_long_days: 21
    late_correction_days: 7
    late_correction_long_goodwill_days: 2
    late_correction_goodwill_days: 1
    unfinished_home_offset_days: 2
    completion_offset_days: 1
    moderate_income_ceiling_pct_ami: 100
    educated_moderate_goodwill_days: 2
    educated_goodwill_days: 1
  rule: 'Larkspur waives, on its own initiative, the cost of a borrower-borne extension that the appraisal-delay case covers
    when no dispute has been filed against that extension, with one waiver entry naming the lock''s most recent borrower-borne
    extension entry (the one with the highest extension number), and the waived amount is worked out as follows. The appraisal-delay
    days are the calendar days by which the file''s appraisal report was completed after its due date. The covered days
    of the extension are the appraisal-delay days, never more than the lock''s lender-delay allowance, less the lender-delay
    days already relieved on the lock before this waiver (the Larkspur-borne days booked on its extensions beyond the complimentary
    days, plus, for the lock''s waiver entries, their waived dollars divided by the dollar value of one day at the lock''s
    standard per-day cost), never below zero, counted in whole days with any fraction of a day dropped, and never more than
    the extension''s charged days (its extension days less its Larkspur-borne days). The waived amount is the covered days
    times the extension''s per-day points (its cost points divided by its charged days), rounded to three decimal places,
    times the loan amount at lock divided by 100, rounded to the cent. When Larkspur waives on its own initiative an extension
    charge the appraisal-delay case covers, and only in such a waiver, it also bears the goodwill days set out below, and
    the waived amount is valued as set out below; this sits beside the two base cases in which Larkspur bears extension
    days, the complimentary days of a lock''s first extension and the appraisal-delay days, which still govern every other
    situation, apart from the clear-to-close days an extension booking leaves uncharged and the relief a decided extension-charge
    dispute grants. The late-correction goodwill: when the waiver is booked more than the long late-correction days after
    the appraisal report was completed, the long late-correction goodwill days are added to the covered days; when it is
    booked more than the late-correction days but no more than the long late-correction days after completion, the late-correction
    goodwill days are added; otherwise none are added. The homebuyer-education goodwill: when a homebuyer education certificate
    is on the loan file and the file''s qualifying income is at or below the moderate-income ceiling, as a percentage of
    the area median income, the educated moderate-income goodwill days are added; when a certificate is on file and the
    qualifying income is above that ceiling, the educated goodwill days are added; otherwise none are added. The builder-completion
    offset, because a home the builder has not finished holds the closing up as well: when the appraisal report was made
    subject to completion and the loan file is not yet clear to close, the unfinished-home offset days are subtracted; when
    the report was made subject to completion and the file is clear to close, the completion offset days are subtracted;
    otherwise nothing is subtracted. With these, for a waiver Larkspur books on its own initiative, and only for such a
    waiver, the covered days are the appraisal-delay days, as many as the appraisal report was late and within the lender-delay
    allowance across the lock, less the days already relieved, plus the goodwill days, less the builder-completion offset,
    never below zero and never more than the extension''s charged days; an extension booking measures its appraisal-delay
    days under the extension-charge rules. The valuation, which fixes the waived points: when the lock''s loan amount at
    lock has risen since the extension was booked (the extension''s cost amount divided by its cost points times 100, rounded
    to the cent, is below the current loan amount at lock), the waived points are the extension''s cost amount times the
    covered days divided by its charged days, divided by the loan amount at lock and times 100, rounded to three decimal
    places; when the loan amount at lock has not risen and the extension''s per-day points are above the lock''s standard
    per-day cost in points, the waived points are the covered days times the lock''s standard per-day cost divided by 100,
    rounded to three decimal places; otherwise the waived points are the covered days times the extension''s per-day points,
    rounded to three decimal places, as stated above. In every case the waived amount is the waived points times the loan
    amount at lock divided by 100, rounded to the cent. The waiver entry is borne by Larkspur, names the extension entry,
    carries the waived points and the waived amount, and lowers the lock''s lock cost balance by the waived amount.'
  prerequisite: []
  cross_category:
  - category: appraisal
    as: history
    reads:
    - due_date
    - completed_date
    - subject_to_completion
    note: the appraisal-delay days, the late-correction goodwill and the builder-completion offset read the appraisal order
  - category: loan
    as: branch
    reads:
    - homebuyer_education_completed
    - qualifying_income_pct_ami
    - status
    note: the homebuyer-education goodwill reads the education flag and qualifying income; the completion offset reads the
      file status
  compute:
  - entry_seq: int(MAX('lock_pricing_events', 'extension_seq', event_type='lock_extension_booked', cost_bearer='borrower'))
  - entry_points: MAX('lock_pricing_events', 'cost_points', event_type='lock_extension_booked', extension_seq=entry_seq)
  - entry_days: MAX('lock_pricing_events', 'extension_days', event_type='lock_extension_booked', extension_seq=entry_seq)
  - entry_borne: MAX('lock_pricing_events', 'larkspur_borne_days', event_type='lock_extension_booked', extension_seq=entry_seq)
  - entry_charged: entry_days - entry_borne
  - entry_per_day: entry_points / entry_charged
  - appr_due: CFIELD('appraisal', 'due_date', loan_file_id=F('loan_file_id'))
  - appr_done: CFIELD('appraisal', 'completed_date', loan_file_id=F('loan_file_id'))
  - appraisal_delay: MX(0, DAYS(appr_due, appr_done)) if appr_done else 0
  - borne_total: SUM('lock_pricing_events', 'larkspur_borne_days', event_type='lock_extension_booked')
  - waived_before: SUM('lock_pricing_events', 'cost_amount', event_type='lock_cost_waived')
  - relieved_before: MX(0, borne_total - P('complimentary_extension_days')) + waived_before / (F('loan_amount_at_lock')
      * P('extension_cost_bps_per_day') / 10000)
  - base_covered: int(MX(0, MN(appraisal_delay, P('lender_delay_waiver_max_days')) - relieved_before))
  - days_since_report: DAYS(appr_done, NOW) if appr_done else 0
  - late_goodwill: K('late_correction_long_goodwill_days') if days_since_report > K('late_correction_long_days') else (K('late_correction_goodwill_days')
      if days_since_report > K('late_correction_days') else 0)
  - educated: CFIELD('loan', 'homebuyer_education_completed', loan_file_id=F('loan_file_id'))
  - income_pct: CFIELD('loan', 'qualifying_income_pct_ami', loan_file_id=F('loan_file_id'))
  - education_goodwill: K('educated_moderate_goodwill_days') if (educated == True and income_pct <= K('moderate_income_ceiling_pct_ami'))
      else (K('educated_goodwill_days') if educated == True else 0)
  - subject_completion: CFIELD('appraisal', 'subject_to_completion', loan_file_id=F('loan_file_id'))
  - file_cleared: CFIELD('loan', 'status', loan_file_id=F('loan_file_id')) == 'clear_to_close'
  - completion_offset: K('unfinished_home_offset_days') if (subject_completion == True and not file_cleared) else (K('completion_offset_days')
      if (subject_completion == True and file_cleared) else 0)
  - covered_days: MN(entry_charged, MX(0, base_covered + late_goodwill + education_goodwill - completion_offset))
  - entry_amount: MAX('lock_pricing_events', 'cost_amount', event_type='lock_extension_booked', extension_seq=entry_seq)
  - booked_basis: RND(entry_amount / entry_points * 100, 2)
  - amount_rose: booked_basis < F('loan_amount_at_lock')
  - waived_pts: RND(entry_amount * covered_days / entry_charged / F('loan_amount_at_lock') * 100, 3) if amount_rose else
      (RND(covered_days * P('extension_cost_bps_per_day') / 100, 3) if entry_per_day > P('extension_cost_bps_per_day') /
      100 else RND(covered_days * entry_per_day, 3))
  - result: RND(waived_pts * F('loan_amount_at_lock') / 100, 2)
  compute_basis:
    entry_seq: with one waiver entry naming the lock's most recent borrower-borne extension entry (the one with the highest
      extension number),
    entry_points: The waived amount is the covered days times the extension's per-day points (its cost points divided by
      its charged days), rounded to three decimal places, times the loan amount at lock divided by 100, rounded to the cent.
    entry_days: never more than the extension's charged days (its extension days less its Larkspur-borne days).
    entry_borne: never more than the extension's charged days (its extension days less its Larkspur-borne days).
    entry_charged: never more than the extension's charged days (its extension days less its Larkspur-borne days).
    entry_per_day: The waived amount is the covered days times the extension's per-day points (its cost points divided by
      its charged days), rounded to three decimal places, times the loan amount at lock divided by 100, rounded to the cent.
    appr_due: The appraisal-delay days are the calendar days by which the file's appraisal report was completed after its
      due date.
    appr_done: The appraisal-delay days are the calendar days by which the file's appraisal report was completed after its
      due date.
    appraisal_delay: The appraisal-delay days are the calendar days by which the file's appraisal report was completed after
      its due date.
    borne_total: less the lender-delay days already relieved on the lock before this waiver (the Larkspur-borne days booked
      on its extensions beyond the complimentary days, plus, for the lock's waiver entries, their waived dollars divided
      by the dollar value of one day at the lock's standard per-day cost),
    relieved_before: less the lender-delay days already relieved on the lock before this waiver (the Larkspur-borne days
      booked on its extensions beyond the complimentary days, plus, for the lock's waiver entries, their waived dollars
      divided by the dollar value of one day at the lock's standard per-day cost),
    base_covered: The covered days of the extension are the appraisal-delay days, never more than the lock's lender-delay
      allowance, less the lender-delay days already relieved on the lock before this waiver (the Larkspur-borne days booked
      on its extensions beyond the complimentary days, plus, for the lock's waiver entries, their waived dollars divided
      by the dollar value of one day at the lock's standard per-day cost), never below zero, counted in whole days with
      any fraction of a day dropped, and never more than the extension's charged days (its extension days less its Larkspur-borne
      days).
    days_since_report: when the waiver is booked more than the long late-correction days after the appraisal report was
      completed,
    late_goodwill: 'The late-correction goodwill: when the waiver is booked more than the long late-correction days after
      the appraisal report was completed, the long late-correction goodwill days are added to the covered days; when it
      is booked more than the late-correction days but no more than the long late-correction days after completion, the
      late-correction goodwill days are added; otherwise none are added.'
    educated: when a homebuyer education certificate is on the loan file and the file's qualifying income is at or below
      the moderate-income ceiling, as a percentage of the area median income,
    subject_completion: when the appraisal report was made subject to completion and the loan file is not yet clear to close,
      the unfinished-home offset days are subtracted;
    file_cleared: when the report was made subject to completion and the file is clear to close, the completion offset days
      are subtracted;
    completion_offset: 'The builder-completion offset, because a home the builder has not finished holds the closing up
      as well: when the appraisal report was made subject to completion and the loan file is not yet clear to close, the
      unfinished-home offset days are subtracted; when the report was made subject to completion and the file is clear to
      close, the completion offset days are subtracted; otherwise nothing is subtracted.'
    covered_days: With these, for a waiver Larkspur books on its own initiative, and only for such a waiver, the covered
      days are the appraisal-delay days, as many as the appraisal report was late and within the lender-delay allowance
      across the lock, less the days already relieved, plus the goodwill days, less the builder-completion offset, never
      below zero and never more than the extension's charged days; an extension booking measures its appraisal-delay days
      under the extension-charge rules.
    entry_amount: the waived points are the extension's cost amount times the covered days divided by its charged days,
      divided by the loan amount at lock and times 100, rounded to three decimal places;
    booked_basis: when the lock's loan amount at lock has risen since the extension was booked (the extension's cost amount
      divided by its cost points times 100, rounded to the cent, is below the current loan amount at lock),
    amount_rose: when the lock's loan amount at lock has risen since the extension was booked (the extension's cost amount
      divided by its cost points times 100, rounded to the cent, is below the current loan amount at lock),
    result: In every case the waived amount is the waived points times the loan amount at lock divided by 100, rounded to
      the cent.
    waived_before: plus, for the lock's waiver entries, their waived dollars divided by the dollar value of one day at the
      lock's standard per-day cost),
    income_pct: when a homebuyer education certificate is on the loan file and the file's qualifying income is at or below
      the moderate-income ceiling, as a percentage of the area median income,
    education_goodwill: 'The homebuyer-education goodwill: when a homebuyer education certificate is on the loan file and
      the file''s qualifying income is at or below the moderate-income ceiling, as a percentage of the area median income,
      the educated moderate-income goodwill days are added; when a certificate is on file and the qualifying income is above
      that ceiling, the educated goodwill days are added; otherwise none are added.'
    waived_pts: 'The valuation, which fixes the waived points: when the lock''s loan amount at lock has risen since the
      extension was booked (the extension''s cost amount divided by its cost points times 100, rounded to the cent, is below
      the current loan amount at lock), the waived points are the extension''s cost amount times the covered days divided
      by its charged days, divided by the loan amount at lock and times 100, rounded to three decimal places; when the loan
      amount at lock has not risen and the extension''s per-day points are above the lock''s standard per-day cost in points,
      the waived points are the covered days times the lock''s standard per-day cost divided by 100, rounded to three decimal
      places; otherwise the waived points are the covered days times the extension''s per-day points, rounded to three decimal
      places, as stated above. In every case the waived amount is the waived points times the loan amount at lock divided
      by 100, rounded to the cent.'
  factors:
  - id: correction_goodwill
    effect: parameter
    decides: late_goodwill
    bindings:
    - appr_done
    - days_since_report
    - late_goodwill
    ladder:
    - when: the waiver is booked more than the long late-correction days after the appraisal report was completed
      value: K('late_correction_long_goodwill_days')
    - when: the waiver is booked more than the late-correction days and no more than the long late-correction days after
        completion
      value: K('late_correction_goodwill_days')
    - when: otherwise
      value: '0'
    baseline:
      late_goodwill: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: appraisal
  - id: education_goodwill
    effect: parameter
    decides: education_goodwill
    bindings:
    - educated
    - income_pct
    - education_goodwill
    ladder:
    - when: a homebuyer education certificate is on the loan file and the qualifying income is at or below the moderate-income
        ceiling of area median income
      value: K('educated_moderate_goodwill_days')
    - when: a homebuyer education certificate is on the loan file and the qualifying income is above the moderate-income
        ceiling
      value: K('educated_goodwill_days')
    - when: otherwise
      value: '0'
    baseline:
      education_goodwill: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: completion_offset
    effect: parameter
    decides: completion_offset
    bindings:
    - subject_completion
    - file_cleared
    - completion_offset
    ladder:
    - when: the appraisal report was made subject to completion and the loan file is not yet clear to close
      value: K('unfinished_home_offset_days')
    - when: the appraisal report was made subject to completion and the loan file is clear to close
      value: K('completion_offset_days')
    - when: otherwise
      value: '0'
    baseline:
      completion_offset: '0'
    evidence:
    - cross_category
    cross_difficulty: appraisal
  - id: waiver_valuation
    effect: method
    decides: waived_pts
    bindings:
    - entry_amount
    - booked_basis
    - amount_rose
    - waived_pts
    ladder:
    - when: the lock's loan amount at lock has risen since the extension was booked
      method: take the extension's booked cost amount times the covered days divided by its charged days, expressed in points
        of the current loan amount at lock, rounded to three decimal places
    - when: the loan amount at lock has not risen and the extension's per-day points are above the lock's standard per-day
        cost
      method: price the covered days at the lock's standard per-day cost, in points rounded to three decimal places
    - when: otherwise
      method: price the covered days at the extension's own per-day points, in points rounded to three decimal places
    baseline:
      waived_pts: RND(covered_days * entry_per_day, 3)
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The appraisal-delay days are the calendar days by which the file's appraisal report was completed after its due
      date. The covered days of the extension are the appraisal-delay days, never more than the lock's lender-delay allowance,
      less the lender-delay days already relieved on the lock before this waiver (the Larkspur-borne days booked on its
      extensions beyond the complimentary days, plus, for the lock's waiver entries, their waived dollars divided by the
      dollar value of one day at the lock's standard per-day cost), never below zero, counted in whole days with any fraction
      of a day dropped, and never more than the extension's charged days (its extension days less its Larkspur-borne days).
      The waived amount is the covered days times the extension's per-day points (its cost points divided by its charged
      days), rounded to three decimal places, times the loan amount at lock divided by 100, rounded to the cent.
    params:
    - lender_delay_waiver_max_days
    - complimentary_extension_days
  inputs:
    history:
    - table: lock_pricing_events
      aggregate: max
      field: extension_seq
      filters:
        event_type: lock_extension_booked
        cost_bearer: borrower
    - table: lock_pricing_events
      aggregate: sum
      field: larkspur_borne_days
      filters:
        event_type: lock_extension_booked
    - table: lock_pricing_events
      aggregate: sum
      field: cost_amount
      filters:
        event_type: lock_cost_waived
    cross_category:
    - appraisal
    - loan
- id: lock_ext_relock_price
  base_policy_refs:
  - lock_relock
  - lock_dispute_resolution
  overwrite:
  - base_policy: lock_relock
    superseded_clause: 'The relocked rate and price are the worse for the borrower of the expired lock''s terms and the
      current rate-sheet terms on the relock pricing day: the locked_rate stays the expired rate unless the market rate
      is higher, and lock_price_points becomes the higher of the expired lock_price_points and the current rate-sheet price
      for that rate.'
    replaced_by: For every relock this policy prices (an expired lock relocked inside its relock window), the relocked rate
      stays the expired lock's rate unless the rate on its latest relock request is higher, and the relocked price is the
      pricing basis plus the staleness and fallout adders less the deposit relief, rounded to three decimal places; a lock
      past its relock window, or past its maximum relocks, remains under the base rule and takes a new lock at current market
      terms.
  - base_policy: lock_dispute_resolution
    superseded_clause: relock_pricing_disputed disputes are upheld only when the relock price is worse than the worst-case
      rule allows, by repricing to the rule's result.
    replaced_by: A relock pricing dispute on a relock priced under this policy is upheld only when the relocked rate or
      price is worse for the borrower than this policy gives, by repricing to this policy's result.
  trigger: state_due
  subject:
  - lock_relocked
  computes: relocked_price_points
  target_tool: relock_expired_rate_20a82baa
  params:
    grace_relock_days: 7
    second_relock_adder_points: 0.25
    long_staleness_days: 10
    staleness_days: 3
    long_staleness_adder_points: 0.25
    staleness_adder_points: 0.125
    open_file_fallout_points: 0.25
    cleared_file_fallout_points: 0.125
    full_deposit_relief_points: 0.25
    partial_deposit_relief_points: 0.125
  rule: 'An expired lock whose relock request stands on the request log within its relock window is owed its relock, booked
    from the lock''s latest relock request at the rate and price worked out as follows. The relock keeps the expired lock''s
    rate unless the rate on that relock request is higher, and its new expiration date is the relock date plus the lock''s
    relock term in calendar days. The current price of a relock is the rate-sheet price on the lock''s latest relock request
    plus the lock''s term price adjustment. The relocked price is the higher of the expired lock''s price and the current
    price, rounded to three decimal places. The lapsed days are the calendar days from the expiration date the expired lock
    carries to the date of its latest relock request. The pricing basis: when the lock has never been relocked (it carries
    no relock fee entry) and the lapsed days are no more than the grace days, the relock takes the lower of the expired
    lock''s price and the current price, so a borrower who relocks promptly keeps the benefit of an improved market; when
    the lock has been relocked before, the relock takes the current price plus the second-relock adder; otherwise the relock
    takes the higher of the two. The staleness adder: when the lapsed days are at least the long staleness days, the long
    staleness adder is added; when they are at least the staleness days but fewer than the long staleness days, the staleness
    adder is added; otherwise none is added. The fallout adder: when no closing is scheduled on the loan file and the file
    is still in processing, underwriting, conditional approval or suspense, the open-file fallout adder is added; when no
    closing is scheduled and the file is clear to close, the cleared-file fallout adder is added; otherwise none is added.
    The deposit relief: when the lock holds a deposit above zero (collected less credited, refunded or forfeited) that is
    at least the lock''s deposit percentage of the loan amount at lock, rounded to the cent, the full deposit relief is
    subtracted; when it holds a smaller deposit above zero, the partial deposit relief is subtracted; otherwise nothing
    is subtracted. For every relock this policy prices (an expired lock relocked inside its relock window), the relocked
    rate stays the expired lock''s rate unless the rate on its latest relock request is higher, and the relocked price is
    the pricing basis plus the staleness and fallout adders less the deposit relief, rounded to three decimal places; a
    lock past its relock window, or past its maximum relocks, remains under the base rule and takes a new lock at current
    market terms. The relock sets the lock back to locked with the relocked rate, the relocked price and the new expiration
    date. A relock pricing dispute on a relock priced under this policy is upheld only when the relocked rate or price is
    worse for the borrower than this policy gives, by repricing to this policy''s result.'
  prerequisite: []
  cross_category:
  - category: loan
    as: branch
    reads:
    - status
    note: the fallout adder reads the loan file's status
  - category: funding
    as: existence
    reads:
    - status
    note: the fallout adder reads whether a closing is scheduled on the file
  compute:
  - relock_sheet: LATEST('lock_requests', 'rate_sheet_price_points', date_field='request_date', request_type='relock')
  - current_price: relock_sheet + P('term_price_adjustment_points')
  - expired_price: F('lock_price_points')
  - prior_relocks: COUNT('lock_pricing_events', event_type='lock_relock_fee_booked')
  - relock_asked: LATEST('lock_requests', 'request_date', date_field='request_date', request_type='relock')
  - lapsed_days: DAYS(F('lock_expiration_date'), relock_asked)
  - price_basis: MN(expired_price, current_price) if (prior_relocks == 0 and lapsed_days <= K('grace_relock_days')) else
      (current_price + K('second_relock_adder_points') if prior_relocks >= 1 else MX(expired_price, current_price))
  - staleness_adder: K('long_staleness_adder_points') if lapsed_days >= K('long_staleness_days') else (K('staleness_adder_points')
      if lapsed_days >= K('staleness_days') else 0)
  - file_state: CFIELD('loan', 'status', loan_file_id=F('loan_file_id'))
  - closing_state: CFIELD('funding', 'status', loan_file_id=F('loan_file_id'))
  - closing_set: closing_state == 'scheduled' or closing_state == 'docs_out'
  - fallout_adder: K('open_file_fallout_points') if (not closing_set and (file_state == 'processing' or file_state == 'underwriting'
      or file_state == 'conditionally_approved' or file_state == 'suspended')) else (K('cleared_file_fallout_points') if
      (not closing_set and file_state == 'clear_to_close') else 0)
  - deposit_held: SUM('lock_deposits', 'amount', event_type='lock_deposit_collected') - SUM('lock_deposits', 'amount', event_type='lock_deposit_credited')
      - SUM('lock_deposits', 'amount', event_type='lock_deposit_refunded') - SUM('lock_deposits', 'amount', event_type='lock_deposit_forfeited')
  - deposit_due: RND(P('lock_deposit_pct') * F('loan_amount_at_lock') / 100, 2)
  - deposit_relief: K('full_deposit_relief_points') if (deposit_held > 0 and deposit_held >= deposit_due) else (K('partial_deposit_relief_points')
      if deposit_held > 0 else 0)
  - result: RND(price_basis + staleness_adder + fallout_adder - deposit_relief, 3)
  compute_basis:
    relock_sheet: The current price of a relock is the rate-sheet price on the lock's latest relock request plus the lock's
      term price adjustment.
    current_price: The current price of a relock is the rate-sheet price on the lock's latest relock request plus the lock's
      term price adjustment.
    expired_price: The relocked price is the higher of the expired lock's price and the current price, rounded to three
      decimal places.
    prior_relocks: when the lock has never been relocked (it carries no relock fee entry) and the lapsed days are no more
      than the grace days,
    relock_asked: The lapsed days are the calendar days from the expiration date the expired lock carries to the date of
      its latest relock request.
    lapsed_days: The lapsed days are the calendar days from the expiration date the expired lock carries to the date of
      its latest relock request.
    price_basis: 'The pricing basis: when the lock has never been relocked (it carries no relock fee entry) and the lapsed
      days are no more than the grace days, the relock takes the lower of the expired lock''s price and the current price,
      so a borrower who relocks promptly keeps the benefit of an improved market; when the lock has been relocked before,
      the relock takes the current price plus the second-relock adder; otherwise the relock takes the higher of the two.'
    staleness_adder: 'The staleness adder: when the lapsed days are at least the long staleness days, the long staleness
      adder is added; when they are at least the staleness days but fewer than the long staleness days, the staleness adder
      is added; otherwise none is added.'
    file_state: when no closing is scheduled on the loan file and the file is still in processing, underwriting, conditional
      approval or suspense, the open-file fallout adder is added;
    closing_state: when no closing is scheduled on the loan file and the file is still in processing, underwriting, conditional
      approval or suspense, the open-file fallout adder is added;
    closing_set: when no closing is scheduled on the loan file and the file is still in processing, underwriting, conditional
      approval or suspense, the open-file fallout adder is added;
    fallout_adder: 'The fallout adder: when no closing is scheduled on the loan file and the file is still in processing,
      underwriting, conditional approval or suspense, the open-file fallout adder is added; when no closing is scheduled
      and the file is clear to close, the cleared-file fallout adder is added; otherwise none is added.'
    deposit_held: when the lock holds a deposit above zero (collected less credited, refunded or forfeited) that is at least
      the lock's deposit percentage of the loan amount at lock, rounded to the cent, the full deposit relief is subtracted;
    deposit_due: when the lock holds a deposit above zero (collected less credited, refunded or forfeited) that is at least
      the lock's deposit percentage of the loan amount at lock, rounded to the cent, the full deposit relief is subtracted;
    deposit_relief: 'The deposit relief: when the lock holds a deposit above zero (collected less credited, refunded or
      forfeited) that is at least the lock''s deposit percentage of the loan amount at lock, rounded to the cent, the full
      deposit relief is subtracted; when it holds a smaller deposit above zero, the partial deposit relief is subtracted;
      otherwise nothing is subtracted.'
    result: For every relock this policy prices (an expired lock relocked inside its relock window), the relocked rate stays
      the expired lock's rate unless the rate on its latest relock request is higher, and the relocked price is the pricing
      basis plus the staleness and fallout adders less the deposit relief, rounded to three decimal places; a lock past
      its relock window, or past its maximum relocks, remains under the base rule and takes a new lock at current market
      terms.
  factors:
  - id: pricing_basis
    effect: method
    decides: price_basis
    bindings:
    - prior_relocks
    - price_basis
    ladder:
    - when: the lock has never been relocked and the lapsed days are no more than the grace days
      method: take the lower of the expired lock's price and the current price
    - when: the lock has been relocked before
      method: take the current price plus the second-relock adder
    - when: otherwise
      method: take the higher of the expired lock's price and the current price
    baseline:
      price_basis: MX(expired_price, current_price)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: staleness_adder
    effect: parameter
    decides: staleness_adder
    bindings:
    - relock_asked
    - lapsed_days
    - staleness_adder
    ladder:
    - when: the lapsed days are at least the long staleness days
      value: K('long_staleness_adder_points')
    - when: the lapsed days are at least the staleness days and fewer than the long staleness days
      value: K('staleness_adder_points')
    - when: otherwise
      value: '0'
    baseline:
      staleness_adder: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: fallout_adder
    effect: parameter
    decides: fallout_adder
    bindings:
    - file_state
    - closing_state
    - closing_set
    - fallout_adder
    ladder:
    - when: no closing is scheduled on the loan file and the file is still in processing, underwriting, conditional approval
        or suspense
      value: K('open_file_fallout_points')
    - when: no closing is scheduled on the loan file and the file is clear to close
      value: K('cleared_file_fallout_points')
    - when: otherwise
      value: '0'
    baseline:
      fallout_adder: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: deposit_relief
    effect: parameter
    decides: deposit_relief
    bindings:
    - deposit_held
    - deposit_due
    - deposit_relief
    ladder:
    - when: the lock holds a deposit above zero that is at least the lock's deposit percentage of the loan amount at lock
      value: K('full_deposit_relief_points')
    - when: the lock holds a smaller deposit above zero
      value: K('partial_deposit_relief_points')
    - when: otherwise
      value: '0'
    baseline:
      deposit_relief: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The relock keeps the expired lock's rate unless the rate on that relock request is higher, and its new expiration
      date is the relock date plus the lock's relock term in calendar days. The current price of a relock is the rate-sheet
      price on the lock's latest relock request plus the lock's term price adjustment. The relocked price is the higher
      of the expired lock's price and the current price, rounded to three decimal places.
    params:
    - term_price_adjustment_points
    - relock_term_days
  inputs:
    history:
    - table: lock_requests
      aggregate: latest
      field: rate_sheet_price_points
      filters:
        request_type: relock
    - table: lock_pricing_events
      aggregate: count
      field: lock_pricing_id
      filters:
        event_type: lock_relock_fee_booked
    - table: lock_deposits
      aggregate: sum
      field: amount
      filters:
        event_type: lock_deposit_collected
    cross_category:
    - loan
    - funding
- id: lock_ext_relock_fee
  base_policy_refs:
  - lock_relock
  overwrite:
  - base_policy: lock_relock
    superseded_clause: The relock fee is relock_fee_points, booked as a separate entry with cost_amount equal to relock_fee_points
      times loan_amount_at_lock divided by 100, rounded to the cent.
    replaced_by: The relock fee points are the fee basis plus the extension step less the builder-partner discount, never
      below zero, times the borrower's share, rounded to three decimal places, and the relock fee is booked as a separate
      entry with a cost of the relock fee points times the loan amount at lock divided by 100, rounded to the cent.
  trigger: state_due
  subject:
  - lock_relock_fee_booked
  computes: cost_amount
  target_tool: book_relock_fee_339fcee1
  params:
    backdate_grace_days: 7
    late_relock_days: 21
    late_relock_adder_points: 0.125
    prior_relock_step_points: 0.125
    long_extension_days: 30
    long_extension_step_points: 0.1
    full_relief_share: 0.25
    part_relief_share: 0.5
    verified_partner_discount_points: 0.05
    reserved_partner_discount_points: 0.025
  rule: 'Every relock carries a relock fee, booked on the lock as its own entry and worked out as follows. A relock fee
    is booked only after the lock''s record shows the relock, the lock back in locked status with a new expiration date.
    The relock fee is not fixed until every borrower-borne extension charge on the lock that the appraisal-delay case covers
    carries its waiver entry. The relock fee points are the lock''s relock fee points, and the relock fee is the relock
    fee points times the loan amount at lock divided by 100, rounded to the cent. The relock fee points are the fee basis
    plus the extension step less the builder-partner discount, never below zero, times the borrower''s share, rounded to
    three decimal places, and the relock fee is booked as a separate entry with a cost of the relock fee points times the
    loan amount at lock divided by 100, rounded to the cent. The fee basis: the lapsed days are the calendar days from the
    expiration date the lock carried when it expired (the new expiration date of its latest extension, or its original expiration
    date when it was never extended) to the date of its latest relock request; when the lapsed days are no more than the
    back-dating grace days and the lock still has extension days left under its cumulative extension limit, the fee basis
    is the lapsed days priced as an extension, the lapsed days times the lock''s extension cost per day divided by 100,
    rounded to three decimal places; when the lapsed days are more than the late-relock days, the fee basis is the lock''s
    relock fee points plus the late-relock adder; otherwise the fee basis is the lock''s relock fee points. The extension
    step: when the lock carries a relock fee entry from an earlier relock, the prior-relock step is added; when it carries
    none and its extension entries add up to at least the long-extension days, the long-extension step is added; otherwise
    none is added. The borrower''s share: when the lock''s waiver entries are at least as many as its borrower-borne extension
    entries and the file''s appraisal report was completed after its due date, the borrower pays the full-relief share of
    the fee; when the lock carries at least one waiver entry, or the appraisal report was completed after its due date,
    the borrower pays the part-relief share; otherwise the borrower pays the whole fee. The builder-partner discount: when
    the loan file carries a Larkspur Builder Partner Credit that is verified or applied with its award entry booked on the
    credit ledger, the verified partner discount is subtracted; when that credit is only reserved, the reserved partner
    discount is subtracted; otherwise nothing is subtracted. The entry carries the lock''s new expiration date and rate
    after the relock and the borrower as cost bearer, and the fee is added to the lock''s lock cost balance.'
  prerequisite:
  - problem: lock_ext_relock_price
    kind: state_gate
    gate: rate_locks.status
    form: state
    policy_source: A relock fee is booked only after the lock's record shows the relock, the lock back in locked status
      with a new expiration date.
    condition: rate_locks.status is locked and rate_locks.lock_expiration_date is later than the expiration date the lock
      carried when it expired, set by the relock.
    resolved_by: relock_expired_rate_20a82baa
    effect: the relock is on the lock's record, so the fee entry is owed and carries the new expiration date and rate.
  - problem: lock_ext_appraisal_delay_waiver
    kind: value_input
    gate: borrower_share
    form: state
    policy_source: The relock fee is not fixed until every borrower-borne extension charge on the lock that the appraisal-delay
      case covers carries its waiver entry.
    condition: every lock_pricing_events entry of event_type lock_extension_booked with cost_bearer borrower whose days
      the appraisal-delay case covers is named by a lock_cost_waived entry through source_pricing_id.
    resolved_by: waive_extension_charge_02e9996e
    effect: each waiver entry raises waiver_count; once the waiver entries are at least as many as the borrower-borne extension
      entries and the appraisal was late, borrower_share takes the full-relief share.
  cross_category:
  - category: appraisal
    as: branch
    reads:
    - due_date
    - completed_date
    note: the borrower's share reads whether the appraisal report was late
  - category: credit
    as: history
    reads:
    - status
    - credit_award_id
    - credit_ledger.event_type
    note: the builder-partner discount reads the file's Builder Partner Credit and its award entry
  compute:
  - ext_last_exp: LATEST('lock_pricing_events', 'new_expiration_date', date_field='event_date', event_type='lock_extension_booked')
  - expired_on: ext_last_exp if ext_last_exp else F('original_expiration_date')
  - relock_asked_on: LATEST('lock_requests', 'request_date', date_field='request_date', request_type='relock')
  - lapsed: DAYS(expired_on, relock_asked_on)
  - ext_days_total: SUM('lock_pricing_events', 'extension_days', event_type='lock_extension_booked')
  - ext_days_left: P('max_total_extension_days') - ext_days_total
  - fee_basis: RND(lapsed * P('extension_cost_bps_per_day') / 100, 3) if (lapsed <= K('backdate_grace_days') and ext_days_left
      > 0) else (P('relock_fee_points') + K('late_relock_adder_points') if lapsed > K('late_relock_days') else P('relock_fee_points'))
  - earlier_relock_fees: COUNT('lock_pricing_events', event_type='lock_relock_fee_booked')
  - extension_step: K('prior_relock_step_points') if earlier_relock_fees >= 1 else (K('long_extension_step_points') if ext_days_total
      >= K('long_extension_days') else 0)
  - borrower_ext: COUNT('lock_pricing_events', event_type='lock_extension_booked', cost_bearer='borrower')
  - waiver_count: COUNT('lock_pricing_events', event_type='lock_cost_waived')
  - appr_due: CFIELD('appraisal', 'due_date', loan_file_id=F('loan_file_id'))
  - appr_done: CFIELD('appraisal', 'completed_date', loan_file_id=F('loan_file_id'))
  - appraisal_was_late: (DAYS(appr_due, appr_done) > 0) if appr_done else False
  - borrower_share: K('full_relief_share') if (waiver_count >= borrower_ext and appraisal_was_late) else (K('part_relief_share')
      if (waiver_count >= 1 or appraisal_was_late) else 1)
  - partner_status: CFIELD('credit', 'status', loan_file_id=F('loan_file_id'), variant_name='Larkspur Builder Partner Credit')
  - partner_award_id: CFIELD('credit', 'credit_award_id', loan_file_id=F('loan_file_id'), variant_name='Larkspur Builder
      Partner Credit')
  - partner_awards: XCOUNT('credit', 'credit_ledger', event_type='credit_award_booked', credit_award_id=partner_award_id)
  - partner_discount: K('verified_partner_discount_points') if ((partner_status == 'verified' or partner_status == 'applied')
      and partner_awards > 0) else (K('reserved_partner_discount_points') if partner_status == 'reserved' else 0)
  - fee_points: RND(MX(0, fee_basis + extension_step - partner_discount) * borrower_share, 3)
  - result: RND(fee_points * F('loan_amount_at_lock') / 100, 2)
  compute_basis:
    ext_last_exp: the lapsed days are the calendar days from the expiration date the lock carried when it expired (the new
      expiration date of its latest extension, or its original expiration date when it was never extended) to the date of
      its latest relock request;
    expired_on: the lapsed days are the calendar days from the expiration date the lock carried when it expired (the new
      expiration date of its latest extension, or its original expiration date when it was never extended) to the date of
      its latest relock request;
    relock_asked_on: the lapsed days are the calendar days from the expiration date the lock carried when it expired (the
      new expiration date of its latest extension, or its original expiration date when it was never extended) to the date
      of its latest relock request;
    lapsed: the lapsed days are the calendar days from the expiration date the lock carried when it expired (the new expiration
      date of its latest extension, or its original expiration date when it was never extended) to the date of its latest
      relock request;
    ext_days_total: when it carries none and its extension entries add up to at least the long-extension days, the long-extension
      step is added;
    ext_days_left: and the lock still has extension days left under its cumulative extension limit,
    fee_basis: when the lapsed days are no more than the back-dating grace days and the lock still has extension days left
      under its cumulative extension limit, the fee basis is the lapsed days priced as an extension, the lapsed days times
      the lock's extension cost per day divided by 100, rounded to three decimal places; when the lapsed days are more than
      the late-relock days, the fee basis is the lock's relock fee points plus the late-relock adder; otherwise the fee
      basis is the lock's relock fee points.
    earlier_relock_fees: when the lock carries a relock fee entry from an earlier relock, the prior-relock step is added;
    extension_step: 'The extension step: when the lock carries a relock fee entry from an earlier relock, the prior-relock
      step is added; when it carries none and its extension entries add up to at least the long-extension days, the long-extension
      step is added; otherwise none is added.'
    borrower_ext: when the lock's waiver entries are at least as many as its borrower-borne extension entries and the file's
      appraisal report was completed after its due date, the borrower pays the full-relief share of the fee;
    waiver_count: when the lock's waiver entries are at least as many as its borrower-borne extension entries and the file's
      appraisal report was completed after its due date, the borrower pays the full-relief share of the fee;
    appr_due: and the file's appraisal report was completed after its due date,
    appr_done: and the file's appraisal report was completed after its due date,
    appraisal_was_late: and the file's appraisal report was completed after its due date,
    borrower_share: 'The borrower''s share: when the lock''s waiver entries are at least as many as its borrower-borne extension
      entries and the file''s appraisal report was completed after its due date, the borrower pays the full-relief share
      of the fee; when the lock carries at least one waiver entry, or the appraisal report was completed after its due date,
      the borrower pays the part-relief share; otherwise the borrower pays the whole fee.'
    partner_status: when the loan file carries a Larkspur Builder Partner Credit that is verified or applied with its award
      entry booked on the credit ledger, the verified partner discount is subtracted;
    partner_award_id: when the loan file carries a Larkspur Builder Partner Credit that is verified or applied with its
      award entry booked on the credit ledger, the verified partner discount is subtracted;
    partner_awards: when the loan file carries a Larkspur Builder Partner Credit that is verified or applied with its award
      entry booked on the credit ledger, the verified partner discount is subtracted;
    partner_discount: 'The builder-partner discount: when the loan file carries a Larkspur Builder Partner Credit that is
      verified or applied with its award entry booked on the credit ledger, the verified partner discount is subtracted;
      when that credit is only reserved, the reserved partner discount is subtracted; otherwise nothing is subtracted.'
    fee_points: The relock fee points are the fee basis plus the extension step less the builder-partner discount, never
      below zero, times the borrower's share, rounded to three decimal places,
    result: and the relock fee is booked as a separate entry with a cost of the relock fee points times the loan amount
      at lock divided by 100, rounded to the cent.
  factors:
  - id: fee_basis
    effect: method
    decides: fee_basis
    bindings:
    - ext_last_exp
    - expired_on
    - relock_asked_on
    - lapsed
    - ext_days_left
    - fee_basis
    ladder:
    - when: the lapsed days are no more than the back-dating grace days and the lock still has extension days left under
        its cumulative limit
      method: 'price the lapsed days as an extension: lapsed days times the lock''s extension cost per day divided by 100'
    - when: the lapsed days are more than the late-relock days
      method: take the lock's relock fee points plus the late-relock adder
    - when: otherwise
      method: take the lock's relock fee points
    baseline:
      fee_basis: P('relock_fee_points')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: extension_step
    effect: parameter
    decides: extension_step
    bindings:
    - earlier_relock_fees
    - ext_days_total
    - extension_step
    ladder:
    - when: the lock carries a relock fee entry from an earlier relock
      value: K('prior_relock_step_points')
    - when: the lock carries no relock fee entry and its extension entries add up to at least the long-extension days
      value: K('long_extension_step_points')
    - when: otherwise
      value: '0'
    baseline:
      extension_step: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: borrower_share
    effect: parameter
    decides: borrower_share
    bindings:
    - borrower_ext
    - waiver_count
    - appr_due
    - appr_done
    - appraisal_was_late
    - borrower_share
    ladder:
    - when: the lock's waiver entries are at least as many as its borrower-borne extension entries and the appraisal report
        was completed after its due date
      value: K('full_relief_share')
    - when: the lock carries at least one waiver entry, or the appraisal report was completed after its due date
      value: K('part_relief_share')
    - when: otherwise
      value: '1'
    baseline:
      borrower_share: '1'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: appraisal
  - id: partner_discount
    effect: parameter
    decides: partner_discount
    bindings:
    - partner_status
    - partner_award_id
    - partner_awards
    - partner_discount
    ladder:
    - when: the loan file's Larkspur Builder Partner Credit is verified or applied with its award entry booked on the credit
        ledger
      value: K('verified_partner_discount_points')
    - when: the loan file's Larkspur Builder Partner Credit is reserved
      value: K('reserved_partner_discount_points')
    - when: otherwise
      value: '0'
    baseline:
      partner_discount: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: credit
  baseline:
    rule: The relock fee points are the lock's relock fee points, and the relock fee is the relock fee points times the
      loan amount at lock divided by 100, rounded to the cent.
    params:
    - relock_fee_points
  inputs:
    history:
    - table: lock_pricing_events
      aggregate: latest
      field: new_expiration_date
      filters:
        event_type: lock_extension_booked
    - table: lock_pricing_events
      aggregate: sum
      field: extension_days
      filters:
        event_type: lock_extension_booked
    - table: lock_pricing_events
      aggregate: count
      field: lock_pricing_id
      filters:
        event_type: lock_cost_waived
    - category: credit
      table: credit_ledger
      aggregate: count
      field: credit_entry_id
      filters:
        event_type: credit_award_booked
    cross_category:
    - appraisal
    - credit
- id: lock_ext_float_down_fee
  base_policy_refs:
  - lock_float_down
  - lock_program_change_reprice
  - lock_dispute_resolution
  overwrite:
  - base_policy: lock_float_down
    superseded_clause: the new locked_rate is that current rate, the price is unchanged, the expiration date is unchanged,
      and the fee is float_down_fee_points times loan_amount_at_lock divided by 100, rounded to the cent.
    replaced_by: The new locked rate is the rate on the lock's latest float-down request, the price and the expiration date
      are unchanged, and the float-down fee is the float-down fee points after every adjustment below times the loan amount
      at lock divided by 100, rounded to the cent.
  trigger: on_request
  subject:
  - lock_float_down_fee_booked
  - lock_repriced
  computes: fee_amount
  target_tool: exercise_float_down_fc7d974d
  params:
    eighth_pct: 0.125
    deep_improvement_pct: 0.5
    mid_improvement_pct: 0.375
    per_eighth_points: 0.125
    mid_improvement_add_points: 0.125
    two_relock_surcharge_points: 0.25
    one_relock_surcharge_points: 0.125
    cleared_file_surcharge_points: 0.2
    approved_file_surcharge_points: 0.1
    government_program_credit_points: 0.125
    jumbo_program_surcharge_points: 0.125
    loyalty_window_months: 60
    loyalty_window_discount_points: 0.1
    loyalty_discount_points: 0.05
    heroes_verified_discount_points: 0.1
    heroes_reserved_discount_points: 0.05
  rule: 'The borrower exercises the lock''s one-time float-down in person, from the lock''s latest float-down request on
    the request log, and the float-down fee is worked out as follows. A float-down is exercised, and its fee fixed, only
    once the lock''s status reads locked. The float-down fee is not worked out until every relock requested on the lock''s
    request log carries its relock fee entry. The improvement is the lock''s locked rate less the rate on its latest float-down
    request, to three decimal places. The float-down fee points are the lock''s float-down fee points, and the float-down
    fee is the float-down fee points times the loan amount at lock divided by 100, rounded to the cent. The new locked rate
    is the rate on the lock''s latest float-down request, the price and the expiration date are unchanged, and the float-down
    fee is the float-down fee points after every adjustment below times the loan amount at lock divided by 100, rounded
    to the cent. The improvement pricing: when the improvement is at least the deep-improvement threshold, the fee points
    are priced per eighth of improvement, the per-eighth points times the improvement divided by one eighth of a percent,
    rounded to three decimal places; when the improvement is at least the mid-improvement threshold but below the deep-improvement
    threshold, the fee points are the lock''s float-down fee points plus the mid-improvement add; otherwise the fee points
    are the lock''s float-down fee points. The relocked-lock surcharge: when the lock carries two or more relock fee entries,
    the two-relock surcharge is added; when it carries exactly one, the one-relock surcharge is added; otherwise none is
    added. The stage surcharge: when the loan file is clear to close, the cleared-file surcharge is added; when it is conditionally
    approved, the approved-file surcharge is added; otherwise none is added. The program adjustment: a Larkspur VA 30-Year
    Fixed or Larkspur FHA 30-Year Fixed file subtracts the government-program credit, a Larkspur Jumbo 30-Year Fixed file
    adds the jumbo-program surcharge, and any other program has no adjustment. The loyalty discount on a float-down: when
    the customer holds another Larkspur loan file in consummated status whose closing falls within the float-down loyalty
    window of months before today, the loyalty-window discount is subtracted; when that consummated file closed before the
    loyalty window, the loyalty discount is subtracted; otherwise nothing is subtracted. The Hometown Heroes discount: when
    the loan file carries a Larkspur Hometown Heroes Credit that is verified or applied with its award entry booked on the
    credit ledger, the verified heroes discount is subtracted; when that credit is only reserved, the reserved heroes discount
    is subtracted; otherwise nothing is subtracted. The float-down fee points are the improvement pricing points plus the
    relocked-lock and stage surcharges, plus the program adjustment, less the loyalty and Hometown Heroes discounts, never
    below zero, rounded to three decimal places. The fee is booked to the borrower, the lock is repriced to the new rate
    with its float-down marked used, and the fee is added to the lock''s lock cost balance.'
  prerequisite:
  - problem: lock_ext_relock_price
    kind: state_gate
    gate: lock_float_down.float_lock_active
    form: state
    policy_source: A float-down is exercised, and its fee fixed, only once the lock's status reads locked.
    condition: rate_locks.status is locked for the lock at the moment the float-down is exercised.
    resolved_by: relock_expired_rate_20a82baa
    effect: the float_lock_active gate of the float-down policy holds once the expired lock is relocked.
  - problem: lock_ext_relock_fee
    kind: value_input
    gate: relocked_surcharge
    form: state
    policy_source: The float-down fee is not worked out until every relock requested on the lock's request log carries its
      relock fee entry.
    condition: every lock_requests row of request_type relock on the lock is matched by a lock_relock_fee_booked entry dated
      on or after that request's request_date.
    resolved_by: book_relock_fee_339fcee1
    effect: 'each relock fee entry adds one to relock_entries, which selects the relocked-lock surcharge tier (one entry:
      the one-relock surcharge; two or more: the two-relock surcharge).'
  cross_category:
  - category: loan
    as: branch
    reads:
    - status
    - variant_name
    - closed_date
    note: the stage surcharge, program adjustment and loyalty discount read the customer's loan files
  - category: credit
    as: history
    reads:
    - status
    - credit_award_id
    - credit_ledger.event_type
    note: the Hometown Heroes discount reads the file's Heroes credit and its award entry
  compute:
  - fd_rate: LATEST('lock_requests', 'requested_rate', date_field='request_date', request_type='float_down')
  - improvement: RND(F('locked_rate') - fd_rate, 3)
  - improvement_points: RND(K('per_eighth_points') * improvement / K('eighth_pct'), 3) if improvement >= K('deep_improvement_pct')
      else (P('float_down_fee_points') + K('mid_improvement_add_points') if improvement >= K('mid_improvement_pct') else
      P('float_down_fee_points'))
  - relock_entries: COUNT('lock_pricing_events', event_type='lock_relock_fee_booked')
  - relocked_surcharge: K('two_relock_surcharge_points') if relock_entries >= 2 else (K('one_relock_surcharge_points') if
      relock_entries == 1 else 0)
  - file_stage: CFIELD('loan', 'status', loan_file_id=F('loan_file_id'))
  - stage_surcharge: K('cleared_file_surcharge_points') if file_stage == 'clear_to_close' else (K('approved_file_surcharge_points')
      if file_stage == 'conditionally_approved' else 0)
  - program_name: CFIELD('loan', 'variant_name', loan_file_id=F('loan_file_id'))
  - program_adjustment: 0 - K('government_program_credit_points') if (program_name == 'Larkspur VA 30-Year Fixed' or program_name
      == 'Larkspur FHA 30-Year Fixed') else (K('jumbo_program_surcharge_points') if program_name == 'Larkspur Jumbo 30-Year
      Fixed' else 0)
  - consummated_on: CFIELD('loan', 'closed_date', status='consummated')
  - loyalty_discount: K('loyalty_window_discount_points') if (consummated_on and MONTHS(consummated_on, NOW) < K('loyalty_window_months'))
      else (K('loyalty_discount_points') if consummated_on else 0)
  - heroes_status: CFIELD('credit', 'status', loan_file_id=F('loan_file_id'), variant_name='Larkspur Hometown Heroes Credit')
  - heroes_award_id: CFIELD('credit', 'credit_award_id', loan_file_id=F('loan_file_id'), variant_name='Larkspur Hometown
      Heroes Credit')
  - heroes_awards: XCOUNT('credit', 'credit_ledger', event_type='credit_award_booked', credit_award_id=heroes_award_id)
  - heroes_discount: K('heroes_verified_discount_points') if ((heroes_status == 'verified' or heroes_status == 'applied')
      and heroes_awards > 0) else (K('heroes_reserved_discount_points') if heroes_status == 'reserved' else 0)
  - fee_points: RND(MX(0, improvement_points + relocked_surcharge + stage_surcharge + program_adjustment - loyalty_discount
      - heroes_discount), 3)
  - result: RND(fee_points * F('loan_amount_at_lock') / 100, 2)
  compute_basis:
    fd_rate: The improvement is the lock's locked rate less the rate on its latest float-down request, to three decimal
      places.
    improvement: The improvement is the lock's locked rate less the rate on its latest float-down request, to three decimal
      places.
    improvement_points: 'The improvement pricing: when the improvement is at least the deep-improvement threshold, the fee
      points are priced per eighth of improvement, the per-eighth points times the improvement divided by one eighth of
      a percent, rounded to three decimal places; when the improvement is at least the mid-improvement threshold but below
      the deep-improvement threshold, the fee points are the lock''s float-down fee points plus the mid-improvement add;
      otherwise the fee points are the lock''s float-down fee points.'
    relock_entries: when the lock carries two or more relock fee entries, the two-relock surcharge is added; when it carries
      exactly one, the one-relock surcharge is added;
    relocked_surcharge: 'The relocked-lock surcharge: when the lock carries two or more relock fee entries, the two-relock
      surcharge is added; when it carries exactly one, the one-relock surcharge is added; otherwise none is added.'
    file_stage: 'The stage surcharge: when the loan file is clear to close, the cleared-file surcharge is added; when it
      is conditionally approved, the approved-file surcharge is added; otherwise none is added.'
    stage_surcharge: 'The stage surcharge: when the loan file is clear to close, the cleared-file surcharge is added; when
      it is conditionally approved, the approved-file surcharge is added; otherwise none is added.'
    program_name: 'The program adjustment: a Larkspur VA 30-Year Fixed or Larkspur FHA 30-Year Fixed file subtracts the
      government-program credit, a Larkspur Jumbo 30-Year Fixed file adds the jumbo-program surcharge, and any other program
      has no adjustment.'
    program_adjustment: 'The program adjustment: a Larkspur VA 30-Year Fixed or Larkspur FHA 30-Year Fixed file subtracts
      the government-program credit, a Larkspur Jumbo 30-Year Fixed file adds the jumbo-program surcharge, and any other
      program has no adjustment.'
    consummated_on: when the customer holds another Larkspur loan file in consummated status whose closing falls within
      the float-down loyalty window of months before today, the loyalty-window discount is subtracted;
    loyalty_discount: 'The loyalty discount on a float-down: when the customer holds another Larkspur loan file in consummated
      status whose closing falls within the float-down loyalty window of months before today, the loyalty-window discount
      is subtracted; when that consummated file closed before the loyalty window, the loyalty discount is subtracted; otherwise
      nothing is subtracted.'
    heroes_status: when the loan file carries a Larkspur Hometown Heroes Credit that is verified or applied with its award
      entry booked on the credit ledger, the verified heroes discount is subtracted;
    heroes_award_id: when the loan file carries a Larkspur Hometown Heroes Credit that is verified or applied with its award
      entry booked on the credit ledger, the verified heroes discount is subtracted;
    heroes_awards: when the loan file carries a Larkspur Hometown Heroes Credit that is verified or applied with its award
      entry booked on the credit ledger, the verified heroes discount is subtracted;
    heroes_discount: 'The Hometown Heroes discount: when the loan file carries a Larkspur Hometown Heroes Credit that is
      verified or applied with its award entry booked on the credit ledger, the verified heroes discount is subtracted;
      when that credit is only reserved, the reserved heroes discount is subtracted; otherwise nothing is subtracted.'
    fee_points: The float-down fee points are the improvement pricing points plus the relocked-lock and stage surcharges,
      plus the program adjustment, less the loyalty and Hometown Heroes discounts, never below zero, rounded to three decimal
      places.
    result: and the float-down fee is the float-down fee points after every adjustment below times the loan amount at lock
      divided by 100, rounded to the cent.
  factors:
  - id: improvement_pricing
    effect: method
    decides: improvement_points
    bindings:
    - fd_rate
    - improvement
    - improvement_points
    ladder:
    - when: the improvement is at least the deep-improvement threshold
      method: 'price the fee per eighth of improvement: the per-eighth points times the improvement divided by one eighth
        of a percent'
    - when: the improvement is at least the mid-improvement threshold and below the deep-improvement threshold
      method: take the lock's float-down fee points plus the mid-improvement add
    - when: otherwise
      method: take the lock's float-down fee points
    baseline:
      improvement_points: P('float_down_fee_points')
    evidence:
    - history
    cross_difficulty: null
  - id: relocked_surcharge
    effect: parameter
    decides: relocked_surcharge
    bindings:
    - relock_entries
    - relocked_surcharge
    ladder:
    - when: the lock carries two or more relock fee entries
      value: K('two_relock_surcharge_points')
    - when: the lock carries exactly one relock fee entry
      value: K('one_relock_surcharge_points')
    - when: otherwise
      value: '0'
    baseline:
      relocked_surcharge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: stage_surcharge
    effect: parameter
    decides: stage_surcharge
    bindings:
    - file_stage
    - stage_surcharge
    ladder:
    - when: the loan file is clear to close
      value: K('cleared_file_surcharge_points')
    - when: the loan file is conditionally approved
      value: K('approved_file_surcharge_points')
    - when: otherwise
      value: '0'
    baseline:
      stage_surcharge: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: program_adjustment
    effect: parameter
    decides: program_adjustment
    bindings:
    - program_name
    - program_adjustment
    ladder:
    - when: the loan file is a Larkspur VA 30-Year Fixed or Larkspur FHA 30-Year Fixed file
      value: 0 - K('government_program_credit_points')
    - when: the loan file is a Larkspur Jumbo 30-Year Fixed file
      value: K('jumbo_program_surcharge_points')
    - when: otherwise
      value: '0'
    baseline:
      program_adjustment: '0'
    evidence:
    - cross_category
    cross_difficulty: loan
  - id: loyalty_discount
    effect: parameter
    decides: loyalty_discount
    bindings:
    - consummated_on
    - loyalty_discount
    ladder:
    - when: the customer's consummated Larkspur loan file closed within the float-down loyalty window of months before today
      value: K('loyalty_window_discount_points')
    - when: the customer's consummated Larkspur loan file closed before the float-down loyalty window
      value: K('loyalty_discount_points')
    - when: otherwise
      value: '0'
    baseline:
      loyalty_discount: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: loan
  - id: heroes_discount
    effect: parameter
    decides: heroes_discount
    bindings:
    - heroes_status
    - heroes_award_id
    - heroes_awards
    - heroes_discount
    ladder:
    - when: the loan file's Larkspur Hometown Heroes Credit is verified or applied with its award entry booked on the credit
        ledger
      value: K('heroes_verified_discount_points')
    - when: the loan file's Larkspur Hometown Heroes Credit is reserved
      value: K('heroes_reserved_discount_points')
    - when: otherwise
      value: '0'
    baseline:
      heroes_discount: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: credit
  baseline:
    rule: The improvement is the lock's locked rate less the rate on its latest float-down request, to three decimal places.
      The float-down fee points are the lock's float-down fee points, and the float-down fee is the float-down fee points
      times the loan amount at lock divided by 100, rounded to the cent.
    params:
    - float_down_fee_points
  inputs:
    history:
    - table: lock_requests
      aggregate: latest
      field: requested_rate
      filters:
        request_type: float_down
    - table: lock_pricing_events
      aggregate: count
      field: lock_pricing_id
      filters:
        event_type: lock_relock_fee_booked
    - category: credit
      table: credit_ledger
      aggregate: count
      field: credit_entry_id
      filters:
        event_type: credit_award_booked
    cross_category:
    - loan
    - credit
