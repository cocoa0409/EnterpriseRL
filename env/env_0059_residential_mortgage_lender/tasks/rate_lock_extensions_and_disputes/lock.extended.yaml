    result: and the waived amount is the waived points times the lock's loan amount at lock divided by 100, rounded to the
      cent.
    itp_weekday: when the order was not transferred in and the borrower gave the intent to proceed on a Saturday or a Sunday,
      the clock starts on the following Monday, because Larkspur's appraisal desk places orders on business days;
    clock_days: 'The ordering clock does not always start at the intent to proceed: when the appraisal order was transferred
      in from another lender, the clock starts on the date the order was placed, so no ordering days arise; when the order
      was not transferred in and the borrower gave the intent to proceed on a Saturday or a Sunday, the clock starts on
      the following Monday, because Larkspur''s appraisal desk places orders on business days; otherwise the clock starts
      on the intent-to-proceed date.'
  factors:
