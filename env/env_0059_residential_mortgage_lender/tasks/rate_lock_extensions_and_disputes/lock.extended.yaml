events:
- type: lock_requested
  target: rate_locks
  mutation: create
  meaning: a rate lock is requested on a loan file for a chosen term
  grain: one row per rate lock
  fields:
    customer_id: borrower who holds the lock (foreign key -> customers)
    loan_file_id: loan file the lock protects (foreign key -> loan_files)
    variant_name: lock product, written as the official lock name (its term)
    status: 'lifecycle status of the lock (basis: lock lifecycle.states)'
    lock_requested_date: date the initial lock request was logged
    locked_rate: note rate currently locked
    loan_amount_at_lock: >-
      total loan amount the lock was priced on; basis for every point-to-dollar conversion on the lock
    float_down_used: whether the one-time float-down has been exercised on this lock
    opened_date: date the lock record was opened
  triggers:
  - event: lock:lock_request_logged
    map: {request_type: initial_lock, requested_rate: locked_rate}
- type: lock_request_logged
  target: lock_requests
  meaning: the lock desk system time-stamps a borrower or loan officer request about the lock
  grain: one row per request received
  distinguish_by: [request_type, request_date, request_time]
  fields:
    lock_id: lock the request concerns (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    request_type: what was asked of the lock desk
    request_channel: how the request reached the lock desk
    request_date: date the request was time-stamped by the lock desk system
    request_time: time the request was time-stamped by the lock desk system
    requested_term_days: lock term or extension length asked for; 0 when not applicable
    requested_rate: note rate asked for
    rate_sheet_price_points: >-
      price of the requested rate on the Larkspur rate sheet in effect at the request time stamp, before
      any term adjustment
  triggers: []
- type: lock_confirmed
  target: rate_locks
  mutation:
    transition: {from: pending, to: locked}
  meaning: the lock desk confirms the lock and sets its price and expiration
  grain: one row per rate lock
  fields:
    status: 'lifecycle status of the lock (basis: lock lifecycle.states)'
    lock_date: date the lock desk confirmed the lock (the pricing date); empty while pending
    original_expiration_date: expiration date set at confirmation, before any extension; empty while pending
    lock_expiration_date: current expiration date after every extension or relock; empty while pending
    locked_rate: note rate currently locked
    lock_price_points: >-
      net price currently locked for the locked rate, including the term adjustment and any repricing
  triggers: []
- type: lock_extension_booked
  target: lock_pricing_events
  meaning: an extension of the lock is sold and its cost booked
  grain: one row per extension
  distinguish_by: [extension_seq]
  fields:
    lock_id: lock priced (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    event_date: date the entry was booked
    cost_points: cost of the entry in points of loan_amount_at_lock
    cost_amount: >-
      cost of the entry in dollars, positive; points times loan_amount_at_lock divided by 100, rounded
      to the cent
    cost_bearer: who bears the cost; larkspur-borne entries book 0.00
    extension_days: days added by an extension; 0 on other entries
    larkspur_borne_days: >-
      extension days whose cost Larkspur bears (complimentary or appraisal-delay days); 0 on other entries
    extension_seq: 1 for the first extension on the lock, 2 for the second, and so on; 0 on other entries
    new_expiration_date: lock expiration date after the entry; empty when the entry does not move it
  account: lock_cost
  direction: in
  triggers:
  - event: lock:lock_expiration_updated
    map: {lock_expiration_date: new_expiration_date}
- type: lock_expiration_updated
  target: rate_locks
  mutation: update
  meaning: the lock's current expiration date moves after an extension
  grain: one row per rate lock
  fields: {lock_expiration_date: current expiration date after every extension or relock; empty while
      pending}
  triggers: []
- type: lock_expired
  target: rate_locks
  mutation:
    transition: {from: locked, to: expired}
  meaning: the lock expires unfunded
  grain: one row per rate lock
  fields: {status: 'lifecycle status of the lock (basis: lock lifecycle.states)'}
  triggers: []
- type: lock_relocked
  target: rate_locks
  mutation:
    transition: {from: expired, to: locked}
  meaning: an expired lock is relocked at worst-case pricing
  grain: one row per rate lock
  fields:
    status: 'lifecycle status of the lock (basis: lock lifecycle.states)'
    lock_expiration_date: current expiration date after every extension or relock; empty while pending
    locked_rate: note rate currently locked
    lock_price_points: >-
      net price currently locked for the locked rate, including the term adjustment and any repricing
  triggers:
  - event: lock:lock_relock_fee_booked
    map: {new_expiration_date: lock_expiration_date, new_rate: locked_rate}
- type: lock_relock_fee_booked
  target: lock_pricing_events
  meaning: the relock fee for a relock is booked
  grain: one row per relock
  distinguish_by: [event_date]
  fields:
    lock_id: lock priced (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    event_date: date the entry was booked
    cost_points: cost of the entry in points of loan_amount_at_lock
    cost_amount: >-
      cost of the entry in dollars, positive; points times loan_amount_at_lock divided by 100, rounded
      to the cent
    cost_bearer: who bears the cost; larkspur-borne entries book 0.00
    new_expiration_date: lock expiration date after the entry; empty when the entry does not move it
    new_rate: note rate after a float-down or relock; empty otherwise
  account: lock_cost
  direction: in
  triggers: []
- type: lock_float_down_fee_booked
  target: lock_pricing_events
  meaning: the borrower exercises the float-down and its fee is booked
  grain: one row per float-down
  distinguish_by: [event_date]
  fields:
    lock_id: lock priced (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    event_date: date the entry was booked
    cost_points: cost of the entry in points of loan_amount_at_lock
    cost_amount: >-
      cost of the entry in dollars, positive; points times loan_amount_at_lock divided by 100, rounded
      to the cent
    cost_bearer: who bears the cost; larkspur-borne entries book 0.00
    new_rate: note rate after a float-down or relock; empty otherwise
  account: lock_cost
  direction: in
  triggers:
  - event: lock:lock_repriced
    map: {locked_rate: new_rate, float_down_used: true}
- type: lock_repriced
  target: rate_locks
  mutation: update
  meaning: >-
    the locked rate or price changes without a new term (float-down, program change, upheld dispute)
  grain: one row per rate lock
  fields:
    locked_rate: note rate currently locked
    lock_price_points: >-
      net price currently locked for the locked rate, including the term adjustment and any repricing
    loan_amount_at_lock: >-
      total loan amount the lock was priced on; basis for every point-to-dollar conversion on the lock
    float_down_used: whether the one-time float-down has been exercised on this lock
  triggers: []
- type: lock_cost_waived
  target: lock_pricing_events
  meaning: a booked lock cost is waived because Larkspur bears it
  grain: one row per pricing entry waived
  distinguish_by: [source_pricing_id]
  fields:
    lock_id: lock priced (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    event_date: date the entry was booked
    cost_points: cost of the entry in points of loan_amount_at_lock
    cost_amount: >-
      cost of the entry in dollars, positive; points times loan_amount_at_lock divided by 100, rounded
      to the cent
    cost_bearer: who bears the cost; larkspur-borne entries book 0.00
    source_pricing_id: >-
      for a waiver or closing settlement, the pricing entry it offsets (foreign key -> lock_pricing_events);
      empty otherwise
  account: lock_cost
  direction: out
  triggers: []
- type: lock_cost_settled_at_closing
  target: lock_pricing_events
  meaning: the outstanding lock cost is collected as a price adjustment on the Closing Disclosure
  grain: one row per pricing entry settled
  distinguish_by: [source_pricing_id]
  fields:
    lock_id: lock priced (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    event_date: date the entry was booked
    cost_points: cost of the entry in points of loan_amount_at_lock
    cost_amount: >-
      cost of the entry in dollars, positive; points times loan_amount_at_lock divided by 100, rounded
      to the cent
    cost_bearer: who bears the cost; larkspur-borne entries book 0.00
    source_pricing_id: >-
      for a waiver or closing settlement, the pricing entry it offsets (foreign key -> lock_pricing_events);
      empty otherwise
  account: lock_cost
  direction: out
  triggers: []
- type: lock_deposit_collected
  target: lock_deposits
  meaning: the deposit for an extended lock is received
  grain: one row per deposit received
  distinguish_by: [entry_date]
  fields: {lock_id: lock the deposit secures (foreign key -> rate_locks), customer_id: borrower (foreign
      key -> customers), amount: 'entry amount, positive', entry_date: date the entry was booked, payment_method: how
      the money moved}
  account: lock_deposit
  direction: in
  triggers: []
- type: lock_deposit_credited
  target: lock_deposits
  meaning: the deposit is credited to the borrower on the Closing Disclosure
  grain: one row per deposit credited
  distinguish_by: [source_deposit_entry_id]
  fields:
    lock_id: lock the deposit secures (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    amount: entry amount, positive
    entry_date: date the entry was booked
    payment_method: how the money moved
    source_deposit_entry_id: >-
      for a credit, refund or forfeiture, the collected deposit entry it disposes of (foreign key -> lock_deposits);
      empty on collection
  account: lock_deposit
  direction: out
  triggers: []
- type: lock_deposit_refunded
  target: lock_deposits
  meaning: the deposit is returned to the borrower
  grain: one row per deposit refunded
  distinguish_by: [source_deposit_entry_id]
  fields:
    lock_id: lock the deposit secures (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    amount: entry amount, positive
    entry_date: date the entry was booked
    payment_method: how the money moved
    source_deposit_entry_id: >-
      for a credit, refund or forfeiture, the collected deposit entry it disposes of (foreign key -> lock_deposits);
      empty on collection
  account: lock_deposit
  direction: out
  triggers: []
- type: lock_deposit_forfeited
  target: lock_deposits
  meaning: the deposit is retained by Larkspur
  grain: one row per deposit forfeited
  distinguish_by: [source_deposit_entry_id]
  fields:
    lock_id: lock the deposit secures (foreign key -> rate_locks)
    customer_id: borrower (foreign key -> customers)
    amount: entry amount, positive
    entry_date: date the entry was booked
    payment_method: how the money moved
    source_deposit_entry_id: >-
      for a credit, refund or forfeiture, the collected deposit entry it disposes of (foreign key -> lock_deposits);
      empty on collection
  account: lock_deposit
  direction: out
  triggers: []
- type: lock_cancelled
  target: rate_locks
  mutation:
    transition:
    - {from: pending, to: cancelled}
    - {from: locked, to: cancelled}
    - {from: expired, to: cancelled}
  meaning: the lock or lock request ends without funding
  grain: one row per rate lock
  fields: {status: 'lifecycle status of the lock (basis: lock lifecycle.states)', closed_date: date the
      lock reached cancelled or delivered; empty otherwise}
  triggers: []
- type: lock_delivered
  target: rate_locks
  mutation:
    transition: {from: locked, to: delivered}
  meaning: the loan funds under the lock
  grain: one row per rate lock
  fields: {status: 'lifecycle status of the lock (basis: lock lifecycle.states)', closed_date: date the
      lock reached cancelled or delivered; empty otherwise}
  triggers: []
- type: lock_dispute_filed
  target: lock_disputes
  meaning: the borrower disputes a lock outcome
  grain: one row per dispute filed
  distinguish_by: [dispute_reason, filed_date]
  fields:
    lock_id: lock disputed (foreign key -> rate_locks)
    customer_id: borrower who disputes (foreign key -> customers)
    dispute_reason: what the borrower disputes
    filed_date: 'date the dispute was filed (on a resolution record: the filing date of the source dispute)'
    claimed_request_date: date on which the borrower says the lock request was made; empty when not applicable
    claimed_rate: rate the borrower says was requested; empty when not applicable
    disputed_pricing_id: >-
      pricing entry the dispute is about, for extension or relock disputes (foreign key -> lock_pricing_events);
      empty otherwise
    resolution: outcome; pending on the filing record
  triggers: []
- type: lock_dispute_resolved
  target: lock_disputes
  meaning: the lock desk decides a filed dispute
  grain: one row per dispute decided
  distinguish_by: [source_dispute_id]
  fields:
    lock_id: lock disputed (foreign key -> rate_locks)
    customer_id: borrower who disputes (foreign key -> customers)
    dispute_reason: what the borrower disputes
    filed_date: 'date the dispute was filed (on a resolution record: the filing date of the source dispute)'
    disputed_pricing_id: >-
      pricing entry the dispute is about, for extension or relock disputes (foreign key -> lock_pricing_events);
      empty otherwise
    resolution: outcome; pending on the filing record
    resolved_date: date the dispute was decided; empty on the filing record
    matched_request_id: >-
      logged lock request relied on by the decision (foreign key -> lock_requests); empty when none
    source_dispute_id: >-
      on a resolution record, the filing record it decides (foreign key -> lock_disputes); empty on the
      filing record
  triggers:
  - event: lock:lock_repriced
    when: {resolution: honored_claimed_terms}
  - event: lock:lock_cost_waived
    when: {resolution: extension_cost_waived}
    map: {source_pricing_id: disputed_pricing_id, cost_bearer: larkspur}
measures:
- {id: lock_msr_extensions, window: the life of the lock up to frozen time, measure: 'count of lock_extension_booked
    records on the lock, and the sum of their extension_days'}
- {id: lock_msr_relocks, window: the life of the lock up to frozen time, measure: count of lock_relock_fee_booked
    records on the lock}
- id: lock_msr_recent_cancellation
  window: >-
    rolling cancellation_relock_cooling_days calendar days ending on the frozen-time date, per loan file
  measure: >-
    the latest closed_date among rate_locks of the same loan_file_id whose status is cancelled by the
    borrower, or empty if none falls in the window
policies:
- id: lock_agg_multi_holding
  subject: [lock_requested]
  rule: >-
    A customer may hold at most max_per_customer locks in pending, locked or expired status at once, one
    per in-process loan file. A loan file may carry only one lock whose status is pending, locked or expired.
    A request for a different term or rate on a file that already has such a lock is handled as an extension,
    relock, float-down or cancellation of the existing lock, never as a second lock.
  eligibility:
  - id: one_lock_per_file
    applies_to: [lock_requested]
    kind: dedup
    condition: A loan file may carry only one lock whose status is pending, locked or expired.
    evidence_fields: [rate_locks.loan_file_id, rate_locks.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rate_locks.loan_file_id]
      action_bindings: {rate_locks.loan_file_id: loan_file_id}
    dedup_contract:
      table: rate_locks
      mode: separate_record
      object_bindings: {loan_file_id: loan_file_id}
      duplicate_filters:
        status: [pending, locked, expired]
      distinct_fields: []
  params: {max_per_customer: 2}
- id: lock_agg_cancellation_cooling
  subject: [lock_requested, lock_confirmed]
  rule: >-
    Locks on the same loan file are read together. A new lock requested on a loan file within the cooling
    period that started when the borrower cancelled an earlier lock on the same file is priced at worst
    case. Count calendar days forward from the cancelled lock's closed_date, which is day zero; a request
    dated on the last day of the period is still inside it. Worst case means the higher of the cancelled
    lock's lock_price_points at its locked_rate and the current rate-sheet price for that rate plus the
    new term's adjustment. Locks cancelled by the system because the file was withdrawn, denied or closed
    do not start a cooling period, and a lock on a different loan file is never affected.
  eligibility: []
  measures: [lock_msr_recent_cancellation]
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {cooling_days: =cancellation_relock_cooling_days}
      Larkspur 30-Day Rate Lock: {cooling_days: =cancellation_relock_cooling_days}
      Larkspur 45-Day Rate Lock: {cooling_days: =cancellation_relock_cooling_days}
      Larkspur 60-Day Rate Lock: {cooling_days: =cancellation_relock_cooling_days}
      Larkspur 90-Day Rate Lock: {cooling_days: =cancellation_relock_cooling_days}
      Larkspur 120-Day Extended Rate Lock: {cooling_days: =cancellation_relock_cooling_days}
      Larkspur 180-Day New Construction Rate Lock: {cooling_days: =cancellation_relock_cooling_days}
- id: lock_eligibility
  subject: [lock_requested, lock_request_logged]
  rule: >-
    Every lock request, extension, relock, float-down, program change and cancellation request is time-stamped
    in the lock request log; the log, not anyone's recollection, is the record of when a request was made.
    A lock may be requested only while the loan file status is one of the lock's eligible_file_statuses.
    The term chosen must reach the file's estimated_closing_date: lock_term_days counted from the expected
    lock date must end on or after it. The file must also meet eligible_loan_purposes, requires_new_construction,
    min_credit_score_to_lock and max_ltv_to_lock_pct of the chosen lock. A request that fails any of these
    is not taken for that term; the borrower may choose a term whose requirements the file meets or keep
    floating.
  eligibility:
  - id: file_status_lockable
    applies_to: [lock_requested]
    kind: state
    condition: >-
      A lock may be requested only while the loan file status is one of the lock's eligible_file_statuses.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_files.loan_file_id]
      action_bindings: {loan_files.loan_file_id: loan_file_id}
    state_contract:
      field: loan_files.status
      allowed: *id004
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {lock_term_days: =lock_term_days, eligible_file_statuses: =eligible_file_statuses}
      Larkspur 30-Day Rate Lock: {lock_term_days: =lock_term_days, eligible_file_statuses: =eligible_file_statuses}
      Larkspur 45-Day Rate Lock: {lock_term_days: =lock_term_days, eligible_file_statuses: =eligible_file_statuses}
      Larkspur 60-Day Rate Lock: {lock_term_days: =lock_term_days, eligible_file_statuses: =eligible_file_statuses}
      Larkspur 90-Day Rate Lock: {lock_term_days: =lock_term_days, eligible_file_statuses: =eligible_file_statuses}
      Larkspur 120-Day Extended Rate Lock: {lock_term_days: =lock_term_days, eligible_file_statuses: =eligible_file_statuses}
      Larkspur 180-Day New Construction Rate Lock: {lock_term_days: =lock_term_days, eligible_file_statuses: =eligible_file_statuses}
- id: lock_confirmation_pricing
  subject: [lock_confirmed]
  rule: >-
    The lock desk confirms a lock within confirmation_business_days of the request. The pricing day of
    a lock is the request's own business day only when the request was time-stamped no later than the
    lock desk cutoff time on a business day. A request time-stamped after lock_desk_cutoff_time, or on
    a Saturday, Sunday or federal public holiday, is priced on the opening rate sheet of the next business
    day and that day becomes the lock_date. lock_price_points equals the request's rate_sheet_price_points
    plus term_price_adjustment_points of the lock, rounded to price_rounding_decimals. original_expiration_date
    and lock_expiration_date equal lock_date plus lock_term_days calendar days; when that date falls on
    a Saturday, Sunday or federal public holiday it rolls forward to the next business day at no cost.
    The lock expires at lock_expiration_time on lock_expiration_date.
  eligibility: []
  formula: {lock_price_points: 'round(rate_sheet_price_points + term_price_adjustment_points, 3)'}
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {term_price_adjustment_points: =term_price_adjustment_points}
      Larkspur 30-Day Rate Lock: {term_price_adjustment_points: =term_price_adjustment_points}
      Larkspur 45-Day Rate Lock: {term_price_adjustment_points: =term_price_adjustment_points}
      Larkspur 60-Day Rate Lock: {term_price_adjustment_points: =term_price_adjustment_points}
      Larkspur 90-Day Rate Lock: {term_price_adjustment_points: =term_price_adjustment_points}
      Larkspur 120-Day Extended Rate Lock: {term_price_adjustment_points: =term_price_adjustment_points}
      Larkspur 180-Day New Construction Rate Lock: {term_price_adjustment_points: =term_price_adjustment_points}
- id: lock_extension
  subject: [lock_extension_booked, lock_expiration_updated, lock_cost_waived]
  rule: >-
    An extension is booked only while the lock status is locked. An extension is booked only if the extension
    request was logged no later than the current lock expiration date. Compare the request_date of the
    extension request in the lock request log with the lock's lock_expiration_date; a request dated on
    the expiration date itself is on time and a request dated any later day is not. An extension is booked
    only while the loan file status is processing, underwriting, conditionally_approved, suspended or
    clear_to_close. An expired lock can never be extended; it can only be relocked. The extension length
    must be one of extension_increment_days; the lock may carry at most max_extensions extensions and
    max_total_extension_days extension days in total (lock_msr_extensions). The new expiration date is
    the current lock_expiration_date plus extension_days calendar days, rolled forward to the next business
    day when it lands on a Saturday, Sunday or federal public holiday; because extension_runs_from_current_expiration
    is true, days are always added to the current expiration date, never to the request date. The charged
    days are extension_days less larkspur_borne_days; cost_points is the charged days times extension_cost_bps_per_day
    divided by 100, and cost_amount is cost_points times loan_amount_at_lock divided by 100, rounded to
    the cent. Larkspur bears extension days in two cases only. First, the first extension on the lock
    carries up to complimentary_extension_days borne days. Second, when the loan's appraisal order was
    completed after its due_date, Larkspur bears as many extension days as the appraisal was late (completed_date
    minus due_date in calendar days), never more than lender_delay_waiver_max_days borne for this reason
    across the lock. When both apply, the complimentary days are counted first. An extension with no charged
    days is booked with cost_bearer larkspur and cost_amount 0.00; any other extension has cost_bearer
    borrower. Underwriting backlog, the borrower's late documents, seller or title delays never shift
    the cost. A cost booked to the borrower that is later found to qualify is waived with a lock_cost_waived
    entry naming the original extension entry, never by editing it.
  eligibility:
  - id: lock_active
    applies_to: [lock_extension_booked]
    kind: state
    condition: An extension is booked only while the lock status is locked.
    evidence_fields: [rate_locks.status, rate_locks.lock_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: &id006
      - [rate_locks.lock_id]
      action_bindings: &id007 {rate_locks.lock_id: lock_id}
    state_contract:
      field: rate_locks.status
      allowed: [locked]
  - id: requested_by_expiration
    applies_to: [lock_extension_booked]
    kind: time
    condition: >-
      An extension is booked only if the extension request was logged no later than the current lock expiration
      date.
    evidence_fields: [rate_locks.lock_expiration_date, lock_requests.request_date, rate_locks.lock_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    temporal_basis:
      clock: frozen_time
      anchor_event: the current lock expiration date
      anchor_source: rate_locks.lock_expiration_date
      relation: not_after
      duration_source: variants.extension_request_grace_days
      unit: calendar_days
      counting_rule: >-
        Compare the request_date of the extension request in the lock request log with the lock's lock_expiration_date;
        a request dated on the expiration date itself is on time and a request dated any later day is
        not.
      boundary: inclusive
  - id: file_open_for_extension
    applies_to: [lock_extension_booked]
    kind: state
    condition: >-
      An extension is booked only while the loan file status is processing, underwriting, conditionally_approved,
      suspended or clear_to_close.
    evidence_fields: [loan_files.status, loan_files.loan_file_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_files.loan_file_id]
      action_bindings: {loan_files.loan_file_id: loan_file_id}
    state_contract:
      field: loan_files.status
      allowed: *id002
  formula: {charged_days: extension_days - larkspur_borne_days, cost_points: charged_days * extension_cost_bps_per_day
      / 100, cost_amount: 'round(cost_points * loan_amount_at_lock / 100, 2)'}
  measures: [lock_msr_extensions]
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {extension_cost_bps_per_day: =extension_cost_bps_per_day, complimentary_extension_days: =complimentary_extension_days,
        lender_delay_waiver_max_days: =lender_delay_waiver_max_days}
      Larkspur 30-Day Rate Lock: {extension_cost_bps_per_day: =extension_cost_bps_per_day, complimentary_extension_days: =complimentary_extension_days,
        lender_delay_waiver_max_days: =lender_delay_waiver_max_days}
      Larkspur 45-Day Rate Lock: {extension_cost_bps_per_day: =extension_cost_bps_per_day, complimentary_extension_days: =complimentary_extension_days,
        lender_delay_waiver_max_days: =lender_delay_waiver_max_days}
      Larkspur 60-Day Rate Lock: {extension_cost_bps_per_day: =extension_cost_bps_per_day, complimentary_extension_days: =complimentary_extension_days,
        lender_delay_waiver_max_days: =lender_delay_waiver_max_days}
      Larkspur 90-Day Rate Lock: {extension_cost_bps_per_day: =extension_cost_bps_per_day, complimentary_extension_days: =complimentary_extension_days,
        lender_delay_waiver_max_days: =lender_delay_waiver_max_days}
      Larkspur 120-Day Extended Rate Lock: {extension_cost_bps_per_day: =extension_cost_bps_per_day, complimentary_extension_days: =complimentary_extension_days,
        lender_delay_waiver_max_days: =lender_delay_waiver_max_days}
      Larkspur 180-Day New Construction Rate Lock: {extension_cost_bps_per_day: =extension_cost_bps_per_day,
        complimentary_extension_days: =complimentary_extension_days, lender_delay_waiver_max_days: =lender_delay_waiver_max_days}
- id: lock_expiration
  subject: [lock_expired]
  rule: >-
    A lock whose loan has not funded by lock_expiration_time on lock_expiration_date expires. Expiration
    ends the protection of the locked rate and price; the borrower then floats until relocked. Extension
    requests logged after the expiration date are not extensions, they are relock requests. Expiration
    does not cancel the loan file and does not refund booked lock costs.
  eligibility: []
- id: lock_relock
  subject: [lock_relocked, lock_relock_fee_booked]
  rule: >-
    A relock at worst-case pricing is available only within the relock window that started on the lock
    expiration date. Count calendar days forward from the expired lock's lock_expiration_date, which is
    day zero; a relock request logged on the last day of the window is on time. The relocked rate and
    price are the worse for the borrower of the expired lock's terms and the current rate-sheet terms
    on the relock pricing day: the locked_rate stays the expired rate unless the market rate is higher,
    and lock_price_points becomes the higher of the expired lock_price_points and the current rate-sheet
    price for that rate. The relock fee is relock_fee_points, booked as a separate entry with cost_amount
    equal to relock_fee_points times loan_amount_at_lock divided by 100, rounded to the cent. The new
    expiration date is the relock date plus relock_term_days calendar days. A lock may be relocked at
    most max_relocks times (lock_msr_relocks). After the window, or once max_relocks is used, the lock
    is cancelled and the borrower takes a new lock at current market terms.
  eligibility:
  - id: relock_within_window
    applies_to: [lock_relocked]
    kind: time
    condition: >-
      A relock at worst-case pricing is available only within the relock window that started on the lock
      expiration date.
    evidence_fields: [rate_locks.lock_expiration_date, rate_locks.lock_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    temporal_basis:
      clock: frozen_time
      anchor_event: the lock expiration date
      anchor_source: rate_locks.lock_expiration_date
      relation: not_after
      duration_source: variants.relock_worst_case_window_days
      unit: calendar_days
      counting_rule: >-
        Count calendar days forward from the expired lock's lock_expiration_date, which is day zero; a
        relock request logged on the last day of the window is on time.
      boundary: inclusive
  formula: {cost_amount: 'round(relock_fee_points * loan_amount_at_lock / 100, 2)'}
  measures: [lock_msr_relocks]
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {relock_fee_points: =relock_fee_points, relock_term_days: =relock_term_days}
      Larkspur 30-Day Rate Lock: {relock_fee_points: =relock_fee_points, relock_term_days: =relock_term_days}
      Larkspur 45-Day Rate Lock: {relock_fee_points: =relock_fee_points, relock_term_days: =relock_term_days}
      Larkspur 60-Day Rate Lock: {relock_fee_points: =relock_fee_points, relock_term_days: =relock_term_days}
      Larkspur 90-Day Rate Lock: {relock_fee_points: =relock_fee_points, relock_term_days: =relock_term_days}
      Larkspur 120-Day Extended Rate Lock: {relock_fee_points: =relock_fee_points, relock_term_days: =relock_term_days}
      Larkspur 180-Day New Construction Rate Lock: {relock_fee_points: =relock_fee_points, relock_term_days: =relock_term_days}
- id: lock_float_down
  subject: [lock_float_down_fee_booked, lock_repriced]
  rule: >-
    Only locks whose float_down_allowed is true carry a float-down, and it may be used max_float_downs
    time. A float-down is accepted only while the lock status is locked. A float-down is accepted only
    while no Closing Disclosure has been issued on the loan file. That cutoff applies because float_down_requires_no_cd
    is true on every lock that offers a float-down. The current rate-sheet rate at the locked price must
    be at least float_down_min_rate_improvement_pct below the locked_rate; the new locked_rate is that
    current rate, the price is unchanged, the expiration date is unchanged, and the fee is float_down_fee_points
    times loan_amount_at_lock divided by 100, rounded to the cent. A borrower whose market improvement
    is smaller, or whose lock has no float-down, keeps the locked terms; Larkspur does not otherwise renegotiate
    a lock when the market improves.
  eligibility:
  - id: float_lock_active
    applies_to: [lock_float_down_fee_booked]
    kind: state
    condition: A float-down is accepted only while the lock status is locked.
    evidence_fields: [rate_locks.status, rate_locks.lock_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    state_contract:
      field: rate_locks.status
      allowed: [locked]
  - id: float_before_cd
    applies_to: [lock_float_down_fee_booked]
    kind: dedup
    condition: >-
      A float-down is accepted only while no Closing Disclosure has been issued on the loan file.
    evidence_fields: [loan_disclosures.loan_file_id, loan_disclosures.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [loan_disclosures.loan_file_id]
      action_bindings: {loan_disclosures.loan_file_id: loan_file_id}
    dedup_contract:
      table: loan_disclosures
      mode: separate_record
      object_bindings: {loan_file_id: loan_file_id}
      duplicate_filters:
        event_type: [loan_cd_issued]
      distinct_fields: []
  formula: {cost_amount: 'round(float_down_fee_points * loan_amount_at_lock / 100, 2)'}
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {float_down_allowed: =float_down_allowed, float_down_fee_points: =float_down_fee_points}
      Larkspur 30-Day Rate Lock: {float_down_allowed: =float_down_allowed, float_down_fee_points: =float_down_fee_points}
      Larkspur 45-Day Rate Lock: {float_down_allowed: =float_down_allowed, float_down_fee_points: =float_down_fee_points}
      Larkspur 60-Day Rate Lock: {float_down_allowed: =float_down_allowed, float_down_fee_points: =float_down_fee_points}
      Larkspur 90-Day Rate Lock: {float_down_allowed: =float_down_allowed, float_down_fee_points: =float_down_fee_points}
      Larkspur 120-Day Extended Rate Lock: {float_down_allowed: =float_down_allowed, float_down_fee_points: =float_down_fee_points}
      Larkspur 180-Day New Construction Rate Lock: {float_down_allowed: =float_down_allowed, float_down_fee_points: =float_down_fee_points}
- id: lock_program_change_reprice
  subject: [lock_repriced]
  rule: >-
    When the loan program or the loan amount changes on a locked file, the lock keeps its locked_rate
    and expiration date and is repriced: lock_price_points becomes the rate_sheet_price_points that the
    lock desk logs for the new program at the locked rate on the original lock_date, plus term_price_adjustment_points,
    plus program_change_fee_points when the program changed; loan_amount_at_lock becomes the new total
    loan amount. A move to a different property is allowed only where property_substitution_allowed is
    true, at property_substitution_fee_points; otherwise the lock is cancelled and the new property needs
    a new lock.
  eligibility: []
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {program_change_fee_points: =program_change_fee_points}
      Larkspur 30-Day Rate Lock: {program_change_fee_points: =program_change_fee_points}
      Larkspur 45-Day Rate Lock: {program_change_fee_points: =program_change_fee_points}
      Larkspur 60-Day Rate Lock: {program_change_fee_points: =program_change_fee_points}
      Larkspur 90-Day Rate Lock: {program_change_fee_points: =program_change_fee_points}
      Larkspur 120-Day Extended Rate Lock: {program_change_fee_points: =program_change_fee_points}
      Larkspur 180-Day New Construction Rate Lock: {program_change_fee_points: =program_change_fee_points}
- id: lock_deposit_handling
  subject: [lock_deposit_collected, lock_deposit_credited, lock_deposit_refunded, lock_deposit_forfeited]
  rule: >-
    Locks whose lock_deposit_pct is above 0.000 require a deposit of lock_deposit_pct of loan_amount_at_lock,
    rounded to the cent, received within deposit_due_business_days_after_lock business days of the lock
    date by one of deposit_payment_methods. A deposit refund or forfeiture disposes only of a deposit
    whose collected entry has not already been credited, refunded or forfeited. The deposit is credited
    on the Closing Disclosure when the loan closes under the lock; it is refunded in full to the original
    payment method when Larkspur denies the loan; it is forfeited when the borrower withdraws the file
    or cancels the lock, and when the lock expires and is not relocked within the relock window. Every
    disposition names the collected deposit entry and carries its full amount; partial refunds do not
    exist.
  eligibility:
  - id: deposit_not_disposed
    applies_to: [lock_deposit_credited, lock_deposit_refunded, lock_deposit_forfeited]
    kind: dedup
    condition: >-
      A deposit refund or forfeiture disposes only of a deposit whose collected entry has not already
      been credited, refunded or forfeited.
    evidence_fields: [lock_deposits.source_deposit_entry_id, lock_deposits.lock_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [lock_deposits.source_deposit_entry_id]
      action_bindings: {lock_deposits.source_deposit_entry_id: source_deposit_entry_id}
    dedup_contract:
      table: lock_deposits
      mode: separate_record
      object_bindings: {source_deposit_entry_id: source_deposit_entry_id}
      duplicate_filters:
        event_type: [lock_deposit_credited, lock_deposit_refunded, lock_deposit_forfeited]
      distinct_fields: []
  formula: {deposit: 'round(lock_deposit_pct * loan_amount_at_lock / 100, 2)'}
  params:
    per_tier:
      Larkspur 15-Day Rate Lock: {lock_deposit_pct: =lock_deposit_pct}
      Larkspur 30-Day Rate Lock: {lock_deposit_pct: =lock_deposit_pct}
      Larkspur 45-Day Rate Lock: {lock_deposit_pct: =lock_deposit_pct}
      Larkspur 60-Day Rate Lock: {lock_deposit_pct: =lock_deposit_pct}
      Larkspur 90-Day Rate Lock: {lock_deposit_pct: =lock_deposit_pct}
      Larkspur 120-Day Extended Rate Lock: {lock_deposit_pct: =lock_deposit_pct}
      Larkspur 180-Day New Construction Rate Lock: {lock_deposit_pct: =lock_deposit_pct}
- id: lock_cancellation
  subject: [lock_cancelled]
  rule: >-
    Only the borrower can cancel a lock or withdraw a lock request; the request is logged with request_type
    cancellation. The system cancels the lock when the loan file is withdrawn, denied or closed for incompleteness,
    and when an expired lock passes its relock window. Cancellation stamps closed_date, leaves booked
    lock costs to lapse with the file, and disposes of any deposit under the deposit policy.
  eligibility: []
- id: lock_dispute_resolution
  subject: [lock_dispute_filed, lock_dispute_resolved, lock_repriced, lock_cost_waived]
  rule: >-
    A lock dispute is accepted only if it is filed no later than the end of the dispute window that started
    on the disputed event. Count business days forward from the lock's lock_date for a lock request or
    rate dispute, or from the disputed pricing entry's event_date for an extension or relock dispute,
    which is day zero; filing on the last business day of the window is on time. A business day is Monday
    through Friday excluding the US federal public holidays observed by the Federal Reserve Banks; Saturdays,
    Sundays and those holidays are skipped when counting. A late dispute is resolved denied_untimely.
    The lock desk decides within dispute_response_business_days. For a lock_request_not_honored or wrong_rate_locked
    dispute, the claim is honored (honored_claimed_terms) only when the lock request log holds a request
    of request_type initial_lock or relock for this lock dated on the claimed request date, at the claimed
    rate, time-stamped no later than lock_desk_cutoff_time on a business day, and the loan file was in
    one of the lock's eligible_file_statuses that day; the lock is then repriced to the claimed rate at
    that request's rate_sheet_price_points plus term_price_adjustment_points, keeping the expiration date.
    A matching request time-stamped after the cutoff is resolved denied_after_cutoff (it was correctly
    priced on the next business day), and no matching request is denied_no_record; an email or call the
    log does not show does not count. For an extension_charge_disputed dispute, the charged extension
    is waived (extension_cost_waived) only when the appraisal-delay case of the extension policy covers
    it; otherwise it is denied_borrower_caused. relock_pricing_disputed disputes are upheld only when
    the relock price is worse than the worst-case rule allows, by repricing to the rule's result. Every
    decision names the filing record and the matched request where one exists.
  eligibility:
  - id: dispute_in_window
    applies_to: [lock_dispute_filed]
    kind: time
    condition: >-
      A lock dispute is accepted only if it is filed no later than the end of the dispute window that
      started on the disputed event.
    evidence_fields: [rate_locks.lock_date, lock_pricing_events.event_date, rate_locks.lock_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys: *id006
      action_bindings: *id007
    temporal_basis:
      clock: frozen_time
      anchor_event: the disputed event
      anchor_source: rate_locks.lock_date
      relation: not_after
      duration_source: variants.dispute_filing_window_business_days
      unit: business_days
      counting_rule: >-
        Count business days forward from the lock's lock_date for a lock request or rate dispute, or from
        the disputed pricing entry's event_date for an extension or relock dispute, which is day zero;
        filing on the last business day of the window is on time.
      boundary: inclusive
- id: lock_delivery_settlement
  subject: [lock_delivered, lock_cost_settled_at_closing]
  rule: >-
    A lock is delivered when its loan funds on or before lock_expiration_date; funding after expiration
    requires a relock first. At closing, each booked borrower-borne lock cost not waived is collected
    as a price adjustment on the Closing Disclosure (one settlement entry per pricing entry, same amount)
    where extension_cost_collected_at_closing is true; a lock that never closes never collects them.
  eligibility: []

extended_policies:
- id: lock_ext_extension_request_length
  base_policy_refs:
  - lock_eligibility
  - lock_extension
  overwrite: []
  trigger: on_request
  subject:
  - lock_request_logged
  computes: requested_term_days
  target_tool: submit_lock_extension_request_8348adff
  params:
    rescission_funding_lag_days: 4
    open_conditions_cushion_days: 3
    docs_pending_cushion_days: 1
    copy_undelivered_cushion_days: 2
    report_outstanding_cushion_days: 3
    mail_away_cushion_days: 1
    poa_cushion_days: 2
    no_cd_cushion_days: 2
    cd_unreceived_cushion_days: 1
  rule: 'An extension request asks the lock desk for a number of calendar days, and the number of days the request asks
    for is worked out before the request is logged, whether the borrower logs it in the borrower portal or a loan officer
    logs it for the borrower. The days an extension request asks for are the calendar days from the lock''s current expiration
    date to the loan file''s estimated closing date. A count below zero is taken as zero, because the lock already reaches
    that date. The date an extension request has to reach is read from the loan file''s closing record: when a closing is
    scheduled on the file (its closing status is scheduled or docs out), the date to reach is that closing''s estimated
    funding date, because the lock must be in force on the day the loan funds; when no closing is scheduled and the file
    is a rate-and-term or cash-out refinance of a primary residence, which carries a right of rescission, the date to reach
    is the file''s estimated closing date plus the rescission funding lag in calendar days; otherwise the date to reach
    is the file''s estimated closing date. Four settlement cushions are then added to the days counted to the date to reach.
    The file-stage cushion: when the file''s issued prior-to-documents conditions outnumber its cleared and waived prior-to-documents
    conditions, so one is still open, the open-conditions cushion is added; when no such condition is open and a closing
    is scheduled whose closing status is still scheduled (its documents not yet drawn), the documents-pending cushion is
    added; otherwise no file-stage cushion is added. The appraisal cushion: when the file''s appraisal report has been completed,
    the borrower''s copy has not been delivered and the borrower has signed no delivery-timing waiver, the copy-undelivered
    cushion is added; when the report has not been completed, the report-outstanding cushion is added; otherwise no appraisal
    cushion is added. The closing-method cushion: when a scheduled closing is a Larkspur Mail-Away Closing the mail-away
    cushion is added, when it is a Larkspur Power of Attorney Closing the power-of-attorney cushion is added, and any other
    closing method, or no scheduled closing, adds none. The disclosure cushion: when no Closing Disclosure has been issued
    on the file, the no-disclosure cushion is added; when a Closing Disclosure has been issued but the borrower has not
    yet received it, the unreceived-disclosure cushion is added; otherwise no disclosure cushion is added. The days the
    extension request asks for are the days counted to the date to reach, taken as zero when below zero, plus the file-stage,
    appraisal, closing-method and disclosure cushions, as a whole number of calendar days. The extension request carries
    the lock''s locked rate as its requested rate.'
  prerequisite: []
  cross_category:
  - category: funding
    as: branch
    reads:
    - status
    - estimated_funding_date
    - variant_name
    note: the date-to-reach factor and the closing-method cushion read the file's closing record
  - category: loan
    as: history
    reads:
    - estimated_closing_date
    - loan_purpose
    - occupancy
    - loan_conditions.condition_class
    - loan_disclosures.event_type
    - loan_disclosures.received_date
    note: the file-stage cushion counts open prior-to-documents conditions and the disclosure cushion reads the Closing
      Disclosure records
  - category: appraisal
    as: branch
    reads:
    - completed_date
    - delivered_to_borrower_date
    - timing_waiver_signed_date
    note: the appraisal cushion reads the appraisal order's completion, delivery and waiver dates
  compute:
  - cur_exp: F('lock_expiration_date')
  - file_close: CFIELD('loan', 'estimated_closing_date', loan_file_id=F('loan_file_id'))
  - closing_status: CFIELD('funding', 'status', loan_file_id=F('loan_file_id'))
  - closing_open: closing_status == 'scheduled' or closing_status == 'docs_out'
  - funding_date: CFIELD('funding', 'estimated_funding_date', loan_file_id=F('loan_file_id'))
  - file_purpose: CFIELD('loan', 'loan_purpose', loan_file_id=F('loan_file_id'))
  - file_occupancy: CFIELD('loan', 'occupancy', loan_file_id=F('loan_file_id'))
  - rescission_file: (file_purpose == 'rate_term_refinance' or file_purpose == 'cash_out_refinance') and file_occupancy
      == 'primary_residence'
  - days_to_target: DAYS(cur_exp, funding_date) if closing_open else (DAYS(cur_exp, file_close) + K('rescission_funding_lag_days')
      if rescission_file else DAYS(cur_exp, file_close))
  - ptd_issued: XCOUNT('loan', 'loan_conditions', event_type='loan_condition_issued', condition_class='prior_to_documents',
      loan_file_id=F('loan_file_id'))
  - ptd_resolved: XCOUNT('loan', 'loan_conditions', event_type='loan_condition_cleared', condition_class='prior_to_documents',
      loan_file_id=F('loan_file_id')) + XCOUNT('loan', 'loan_conditions', event_type='loan_condition_waived', condition_class='prior_to_documents',
      loan_file_id=F('loan_file_id'))
  - stage_cushion: K('open_conditions_cushion_days') if ptd_issued - ptd_resolved > 0 else (K('docs_pending_cushion_days')
      if closing_status == 'scheduled' else 0)
  - appr_completed: CFIELD('appraisal', 'completed_date', loan_file_id=F('loan_file_id'))
  - appr_delivered: CFIELD('appraisal', 'delivered_to_borrower_date', loan_file_id=F('loan_file_id'))
  - appr_waiver: CFIELD('appraisal', 'timing_waiver_signed_date', loan_file_id=F('loan_file_id'))
  - copy_cushion: K('copy_undelivered_cushion_days') if (appr_completed and not appr_delivered and not appr_waiver) else
      (K('report_outstanding_cushion_days') if not appr_completed else 0)
  - closing_method: CFIELD('funding', 'variant_name', loan_file_id=F('loan_file_id'))
  - method_cushion: K('mail_away_cushion_days') if (closing_open and closing_method == 'Larkspur Mail-Away Closing') else
      (K('poa_cushion_days') if (closing_open and closing_method == 'Larkspur Power of Attorney Closing') else 0)
  - cd_count: XCOUNT('loan', 'loan_disclosures', event_type='loan_cd_issued', loan_file_id=F('loan_file_id'))
  - cd_received_on: XLATEST('loan', 'loan_disclosures', 'received_date', date_field='issued_date', event_type='loan_cd_issued',
      loan_file_id=F('loan_file_id'))
  - cd_cushion: K('no_cd_cushion_days') if cd_count == 0 else (K('cd_unreceived_cushion_days') if (not cd_received_on or
      DAYS(NOW, cd_received_on) > 0) else 0)
  - result: int(MX(0, days_to_target) + stage_cushion + copy_cushion + method_cushion + cd_cushion)
  compute_basis:
    cur_exp: The days an extension request asks for are the calendar days from the lock's current expiration date to the
      loan file's estimated closing date.
    file_close: The days an extension request asks for are the calendar days from the lock's current expiration date to
      the loan file's estimated closing date.
    closing_status: 'The date an extension request has to reach is read from the loan file''s closing record: when a closing
      is scheduled on the file (its closing status is scheduled or docs out), the date to reach is that closing''s estimated
      funding date, because the lock must be in force on the day the loan funds;'
    closing_open: when a closing is scheduled on the file (its closing status is scheduled or docs out)
    funding_date: the date to reach is that closing's estimated funding date, because the lock must be in force on the day
      the loan funds;
    file_purpose: when no closing is scheduled and the file is a rate-and-term or cash-out refinance of a primary residence,
      which carries a right of rescission,
    file_occupancy: when no closing is scheduled and the file is a rate-and-term or cash-out refinance of a primary residence,
      which carries a right of rescission,
    rescission_file: when no closing is scheduled and the file is a rate-and-term or cash-out refinance of a primary residence,
      which carries a right of rescission,
    days_to_target: when a closing is scheduled on the file (its closing status is scheduled or docs out), the date to reach
      is that closing's estimated funding date, because the lock must be in force on the day the loan funds; when no closing
      is scheduled and the file is a rate-and-term or cash-out refinance of a primary residence, which carries a right of
      rescission, the date to reach is the file's estimated closing date plus the rescission funding lag in calendar days;
      otherwise the date to reach is the file's estimated closing date.
    ptd_issued: when the file's issued prior-to-documents conditions outnumber its cleared and waived prior-to-documents
      conditions, so one is still open, the open-conditions cushion is added;
    ptd_resolved: when the file's issued prior-to-documents conditions outnumber its cleared and waived prior-to-documents
      conditions, so one is still open, the open-conditions cushion is added;
    stage_cushion: 'The file-stage cushion: when the file''s issued prior-to-documents conditions outnumber its cleared
      and waived prior-to-documents conditions, so one is still open, the open-conditions cushion is added; when no such
      condition is open and a closing is scheduled whose closing status is still scheduled (its documents not yet drawn),
      the documents-pending cushion is added; otherwise no file-stage cushion is added.'
    appr_completed: when the file's appraisal report has been completed, the borrower's copy has not been delivered and
      the borrower has signed no delivery-timing waiver, the copy-undelivered cushion is added;
    appr_delivered: when the file's appraisal report has been completed, the borrower's copy has not been delivered and
      the borrower has signed no delivery-timing waiver, the copy-undelivered cushion is added;
    appr_waiver: when the file's appraisal report has been completed, the borrower's copy has not been delivered and the
      borrower has signed no delivery-timing waiver, the copy-undelivered cushion is added;
    copy_cushion: 'The appraisal cushion: when the file''s appraisal report has been completed, the borrower''s copy has
      not been delivered and the borrower has signed no delivery-timing waiver, the copy-undelivered cushion is added; when
      the report has not been completed, the report-outstanding cushion is added; otherwise no appraisal cushion is added.'
    closing_method: 'The closing-method cushion: when a scheduled closing is a Larkspur Mail-Away Closing the mail-away
      cushion is added, when it is a Larkspur Power of Attorney Closing the power-of-attorney cushion is added, and any
      other closing method, or no scheduled closing, adds none.'
    method_cushion: 'The closing-method cushion: when a scheduled closing is a Larkspur Mail-Away Closing the mail-away
      cushion is added, when it is a Larkspur Power of Attorney Closing the power-of-attorney cushion is added, and any
      other closing method, or no scheduled closing, adds none.'
    cd_count: when no Closing Disclosure has been issued on the file, the no-disclosure cushion is added;
    cd_received_on: when a Closing Disclosure has been issued but the borrower has not yet received it, the unreceived-disclosure
      cushion is added;
    cd_cushion: 'The disclosure cushion: when no Closing Disclosure has been issued on the file, the no-disclosure cushion
      is added; when a Closing Disclosure has been issued but the borrower has not yet received it, the unreceived-disclosure
      cushion is added; otherwise no disclosure cushion is added.'
    result: The days the extension request asks for are the days counted to the date to reach, taken as zero when below
      zero, plus the file-stage, appraisal, closing-method and disclosure cushions, as a whole number of calendar days.
  factors:
  - id: target_anchor
    effect: method
    decides: days_to_target
    bindings:
    - closing_status
    - closing_open
    - funding_date
    - file_purpose
    - file_occupancy
    - rescission_file
    - days_to_target
    ladder:
    - when: a closing is scheduled on the loan file (closing status scheduled or docs out)
      method: count calendar days from the lock's current expiration date to that closing's estimated funding date
    - when: no closing is scheduled and the file is a rate-and-term or cash-out refinance of a primary residence
      method: count calendar days from the lock's current expiration date to the file's estimated closing date, then add
        the rescission funding lag
    - when: otherwise
