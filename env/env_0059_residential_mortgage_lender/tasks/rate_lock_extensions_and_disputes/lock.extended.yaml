category: lock
display_name: Rate Lock Commitment
binding:
  holding_table: rate_locks
  event_tables: [lock_requests, lock_pricing_events, lock_deposits, lock_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {lock_cost_balance: lock_cost, deposit_balance: lock_deposit}
lifecycle:
  states: [pending, locked, expired, cancelled, delivered]
  transitions:
  - {from: pending, to: locked, by: agent, means: the lock desk confirms the requested lock at the price
      of the request's pricing day}
  - {from: pending, to: cancelled, by: user, means: the borrower withdraws the lock request before confirmation}
  - {from: pending, to: cancelled, by: system, means: 'the loan file is withdrawn, denied or closed before
      the lock is confirmed'}
  - {from: locked, to: expired, by: system, means: the expiration time passes on the expiration date without
      the loan funding}
  - {from: locked, to: cancelled, by: user, means: the borrower cancels the lock}
  - {from: locked, to: cancelled, by: system, means: 'the loan file is withdrawn, denied or closed while
      locked'}
  - {from: locked, to: delivered, by: system, means: the loan funds on or before the lock expiration date}
  - {from: expired, to: locked, by: agent, means: the expired lock is relocked at worst-case pricing within
      the relock window}
  - from: expired
    to: cancelled
    by: system
    means: >-
      the relock window passes, or the loan file is withdrawn, denied or closed, without a relock
accounts:
- key: lock_cost
  unit: USD
  meaning: >-
    extension, relock and float-down costs the borrower owes on the lock, to be collected as a price adjustment
    at closing
- {key: lock_deposit, unit: USD, meaning: lock deposit Larkspur holds for an extended lock}
parameter_schema:
  lock_term_days: calendar days from the lock date to the original expiration date; integer
  term_price_adjustment_points: price adjustment added to the rate-sheet price for this term; points,
    3 decimals
  eligible_file_statuses: loan file statuses in which this lock may be requested; list of loan_files.status
    values
  eligible_loan_purposes: loan purposes this lock may protect; list of loan_files.loan_purpose values
  requires_new_construction: whether the subject property must be a new-construction purchase from a builder;
    boolean
  min_credit_score_to_lock: minimum representative credit score on the file to take this lock; integer
  max_ltv_to_lock_pct: maximum base-loan-to-value on the file to take this lock; percent, 2 decimals
  lock_desk_open_time: time the lock desk starts pricing on a business day; HH:MM US Eastern
  lock_desk_cutoff_time: >-
    last time-stamp on a business day that is priced on that day's rate sheet; HH:MM US Eastern
  next_day_pricing_after_cutoff: >-
    whether a request time-stamped after the cutoff, or on a non-business day, is priced on the next business
    day's opening rate sheet; boolean
  confirmation_business_days: business days after the request within which the lock desk confirms a lock;
    integer
  lock_expiration_time: time of day on the expiration date at which the lock expires; HH:MM US Eastern
  expiration_roll_forward_to_business_day: >-
    whether an expiration date that falls on a non-business day rolls forward to the next business day
    at no cost; boolean
  extension_cost_bps_per_day: extension cost per calendar day extended; basis points of loan_amount_at_lock,
    1 decimal
  extension_increment_days: extension lengths the lock desk sells; list of integer days
  max_extensions: maximum number of extensions on one lock; integer
  max_total_extension_days: maximum cumulative extension days on one lock; integer
  extension_request_grace_days: >-
    calendar days after the current expiration date within which an extension request is still accepted;
    integer (0 = on or before the expiration date)
  extension_allowed_file_statuses: loan file statuses in which an extension may be booked; list of loan_files.status
    values
  complimentary_extension_days: days of the first extension Larkspur grants at no cost; integer (0 = none)
  lender_delay_waiver_max_days: maximum extension days whose cost Larkspur bears for a documented appraisal
    delay; integer
  extension_cost_collected_at_closing: >-
    whether booked extension, relock and float-down costs are collected as a price adjustment at closing
    rather than in advance; boolean
  relock_worst_case_window_days: >-
    calendar days after expiration during which the lock can be relocked at worst-case pricing; integer
  relock_fee_points: relock fee added to the worst-case price; points, 3 decimals
  relock_term_days: term of a relock counted from the relock date; integer days
  max_relocks: maximum relocks on one lock; integer
  relock_after_window_new_lock: >-
    whether a borrower past the relock window must take a new lock at current market terms; boolean
  float_down_allowed: whether the lock includes a one-time float-down option; boolean
  float_down_min_rate_improvement_pct: >-
    minimum drop of the current rate-sheet rate below the locked rate, at the same price, to exercise
    the float-down; percent, 3 decimals
  float_down_fee_points: fee to exercise the float-down; points, 3 decimals (0.000 where float-down is
    not offered)
  max_float_downs: float-downs allowed per lock; integer (0 where not offered)
  float_down_requires_no_cd: >-
    whether a float-down is refused once the initial Closing Disclosure has been issued; boolean
  float_down_keeps_expiration: whether a float-down leaves the lock expiration date unchanged; boolean
  lock_deposit_pct: lock deposit as a percent of loan_amount_at_lock; percent, 3 decimals (0.000 = no
    deposit)
  deposit_due_business_days_after_lock: business days after the lock date within which the deposit must
    be received; integer
  deposit_payment_methods: accepted ways to pay the deposit; list of payment_method values
  deposit_credited_at_closing: >-
    whether the deposit is credited on the Closing Disclosure when the loan closes under the lock; boolean
  deposit_refund_on_denial: whether the deposit is refunded when Larkspur denies the loan; boolean
  deposit_refund_on_borrower_withdrawal: whether the deposit is refunded when the borrower withdraws or
    cancels; boolean
  deposit_forfeit_on_expiry_without_relock: >-
    whether the deposit is forfeited when the lock expires and is not relocked within the relock window;
    boolean
  cancellation_relock_cooling_days: >-
    calendar days after a borrower cancels a lock during which a new lock on the same file is priced at
    worst case; integer
  program_change_fee_points: fee added when the loan program changes while locked; points, 3 decimals
  property_substitution_allowed: whether the lock may be moved to a different property for the same borrower;
    boolean
  property_substitution_fee_points: fee to move the lock to a different property; points, 3 decimals (0.000
    where not allowed)
  dispute_filing_window_business_days: >-
    business days after the disputed event (lock confirmation or the disputed pricing entry) within which
    a dispute is accepted; integer
  dispute_response_business_days: business days within which the lock desk decides a dispute; integer
  extension_runs_from_current_expiration: >-
    whether extension days are added to the current expiration date rather than to the request date; boolean
  price_rounding_decimals: decimal places to which point prices are rounded; integer
