    order_grace: 'The order grace depends on the order: an order placed with rush turn time has the rush order grace; an
      order without rush for a Larkspur Complex Property Appraisal (Form 1004 Jumbo) or a Larkspur Small Residential Income
      Appraisal (Form 1025) has the complex order grace; any other order has the standard order grace.'
    ordering_days: The appraisal ordering days are the calendar days from the borrower's intent to proceed on the loan file
      to the date the appraisal order was placed, less the standard order grace, never below zero.
    wait_days_open: when the decision is recorded more than the long-wait threshold of calendar days after the filing date,
      the long-wait goodwill days are added;
    wait_goodwill: 'Larkspur adds goodwill days for the time the dispute waited: when the decision is recorded more than
      the long-wait threshold of calendar days after the filing date, the long-wait goodwill days are added; when it is
      recorded more than the wait threshold but no more than the long-wait threshold of calendar days after filing, the
      wait goodwill days are added; otherwise none are added.'
    loyalty_status: 'Larkspur adds loyalty goodwill days for a borrower whose loan file carries a Larkspur Returning Customer
      Credit:'
    loyalty_award_id: 'Larkspur adds loyalty goodwill days for a borrower whose loan file carries a Larkspur Returning Customer
      Credit:'
    loyalty_awards: when that credit is verified or applied and its award entry is booked on the credit ledger, the verified
      loyalty goodwill days are added;
    loyalty_goodwill: 'Larkspur adds loyalty goodwill days for a borrower whose loan file carries a Larkspur Returning Customer
      Credit: when that credit is verified or applied and its award entry is booked on the credit ledger, the verified loyalty
      goodwill days are added; when it is only reserved, the reserved loyalty goodwill days are added; otherwise none are
      added.'
    resubmissions: when the loan file has been resubmitted from suspense two or more times, the repeat suspension offset
      days are subtracted;
    suspension_offset: 'The borrower''s own suspensions offset the relief, because a file suspended for overdue conditions
      was held up by the borrower as well: when the loan file has been resubmitted from suspense two or more times, the
      repeat suspension offset days are subtracted; when it has been resubmitted once, the suspension offset days are subtracted;
      otherwise nothing is subtracted.'
    relief_days: With these, the relief days are the appraisal ordering days plus the goodwill and loyalty days less the
      suspension offset, never below zero and never more than the disputed extension's charged days.
    waived_points: The waived points are the relief days times the disputed extension's per-day points (its cost points
