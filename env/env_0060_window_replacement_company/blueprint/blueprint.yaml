name: env_0060_window_replacement_company
company: Ridgeline Window & Door
background: |
  Ridgeline Window & Door is a regional, family-founded window and door replacement company headquartered in Columbus, Ohio, selling directly to homeowners from nine branch showrooms and warehouses across Ohio, Indiana and Kentucky.
  It measures, orders from its own fabrication plant, installs and services roughly 38,000 replacement windows and 4,600 entry and patio doors a year, and its customer care team speaks in a plain, patient, tradesperson's voice.
  Every project starts as a contract the homeowner signs for one product series, either at an in-home consultation, in a showroom or over a video consultation.
  Window Replacement Contracts are sold in six series: the Ridgeline 1100 Series Vinyl, Ridgeline 2200 Series Vinyl, Ridgeline 3300 Series Premium Vinyl, Ridgeline 4400 Series Composite, Ridgeline 5500 Series Fiberglass and Ridgeline 6600 Series Wood-Clad.
  Entry & Patio Door Contracts are sold as the Ridgeline Portal 310 Steel Entry Door, Ridgeline Portal 520 Smooth Fiberglass Entry Door, Ridgeline Glide 720 Vinyl Sliding Patio Door, Ridgeline Portal 640 Woodgrain Fiberglass Entry Door, Ridgeline Glide 840 Fiberglass Sliding Patio Door and Ridgeline Hinge 960 Wood-Clad French Patio Door.
  A contract accumulates a running record of booking deposits, measure appointments, change orders, credits, fees, refunds and the final balance until it is closed or cancelled.
  Once a contract is released, the plant builds it as a Factory Production Order in one of six build classes — Custom Size Build, Custom Color Build, Specialty Glass Build, Specialty Shape Build, Impact-Rated Build or Architectural Wood Build — logging checkpoints, delay notices, remakes, charges and on-time guarantee credits along the way.
  Delivered units become an Installation Job carried out as an Insert Pocket Installation, Full-Frame Installation, Full-Frame Installation with Exterior Trim Wrap, Masonry Opening Installation, Bay and Bow Installation or Door System Installation, with crew days, reschedules, job charges and punch items on record.
  Each completed contract is covered by a Warranty Coverage registration under the plan chosen at signing: the Ridgeline Limited Warranty, Ridgeline Limited Plus Warranty, Ridgeline Lifetime Limited Warranty, Ridgeline Lifetime Plus Warranty, Ridgeline Lifetime Premier Warranty or Ridgeline Owner-to-Owner Lifetime Warranty, which gathers claims, technician visits, charges and transfers over the years.
  Many homeowners pay through Ridgeline Home Improvement Financing on the Ridgeline Same-As-Cash 12, Ridgeline Same-As-Cash 18, Ridgeline Zero-Interest Equal Pay 24, Ridgeline Fixed-Rate 60, Ridgeline Fixed-Rate 120 or Ridgeline Low-Payment 144 plan, whose accounts post a funding followed by monthly payments, interest, fees and the occasional deferral.
  After installation some households keep an On-Call Service Account or join a CareLine Service Plan — the CareLine Basic Plan, CareLine Plus Plan, CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan — which books tune-ups, repair visits, plan fees and visit charges.
  Callers are mostly owner-occupants of houses built anywhere from the 1920s to the 2010s, along with some landlords replacing windows in rental homes and a steady number of sellers and buyers dealing with a home sale.
  A typical caller holds one window contract, often alongside a door contract signed the same season, a financing account funding one of them, a factory order and installation job in progress or finished, and one or two warranty registrations.
  They call while a project is moving — about deposits, measure appointments, order delays, crew dates and job charges — and for years afterwards about fogged glass, sticking sashes, warranty transfers, loan payments and service visits, so their records often span several years of history.
logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_records
difficulties:
  - name: window_contract_deposits_and_cancellations
    claim:
      categories: [window]
      event_types: [window_payment_received, window_refund_issued, window_change_order, window_price_credit, window_fee_assessed, window_measure_visit, window_order_released, window_contract_cancelled, window_series_changed]
    summary: >
      Homeowners call about a window replacement contract between signing and the final balance: paying or
      questioning the booking deposit, booking or missing a measure appointment, adding options or openings,
      switching series, asking whether their order has been released, claiming a bundle or referral credit,
      or cancelling — and the setting varies by series, by contract stage (signed, measured, ordered or
      installed), by sales channel, by payment method, by discount program, by a door contract or financing
      account held alongside, and by the history of payments, visits and change orders already on record.
      The governing rules sit in the window contract charter and its records: the required deposit differs
      for cash and financed contracts and by series (window_booking_deposit), missed appointments and
      remeasures are counted against per-series free allowances (window_measure_visits), change orders and
      series changes are open only before order release and carry per-series prices, counts and fees
      (window_change_orders, window_oversize_pricing, window_series_change), credits stack additively except
      that the door bundle discount excludes discount programs (window_price_credits), order release waits for
      the full deposit and, for in-home sales, the end of the cooling-off period (window_order_release), and a
      cancellation is settled either under the in-home cooling-off right or by the stage-based charges
      (window_cooling_off_cancellation, window_standard_cancellation), with refunds tied to their source
      payments (window_refunds, window_agg_payment_application). In the natural course of a contract the
      deposit precedes the final measure, the measure precedes order release, release precedes installation,
      and the final balance falls due after completion (window_final_balance). Recording payments, visits,
      change orders, credits, fees, refunds and order release are agent service actions, while a written
      notice of cancellation and a decision to pay are the customer's own acts that the agent hands over for
      the customer to perform. Requests no charter rule decides — such as a price match against another
      company's quote, a discount program added after signing, compensation for disruption, or relief beyond
      the published cancellation terms — have no covered path and go to a human representative as
      POLICY_NOT_COVERED.
  - name: factory_order_milestones_and_delays
    claim:
      categories: [order]
      event_types: [order_milestone_logged, order_delay_noticed, order_ship_date_revised, order_hold_placed, order_hold_released, order_remake_logged, order_charge_assessed, order_charge_waived, order_guarantee_credit_earned, order_guarantee_credit_applied]
    summary: >
      Customers call about the factory order behind their window or door contract: when it will ship, why the
      date moved, whether they can pause it while other work in the home finishes, whether a late shipment
      earns the on-time guarantee, who pays for a remade unit, whether they can still expedite, and why a
      storage fee appeared — and the setting varies by build class, order stage (entered, on hold, in
      production, shipped, delivered), unit count, the delay notices and remakes already recorded, the
      acknowledgment signature, and the state of the installation job and contract the order serves. The
      governing rules are per build class: the committed ship date and lead time (order_build_class), the
      acknowledgment and production start (order_acknowledgment_and_production), hold counts and lengths
      (order_holds), the guarantee benchmark, grace period, weekly credit and cap and which delay causes move
      the benchmark instead of earning credit (order_delays_and_guarantee), credit application to the
      contract the order builds (order_credit_application, order_agg_customer_orders), remake causes and
      charges (order_remakes), expedite availability, fees and waivers (order_expedite), storage after the
      free period (order_storage), and shipping, closure and cancellation (order_shipping_and_closure,
      order_cancellation). In the domain's natural course an order is entered after the contract's release,
      the customer signs the acknowledgment, production starts, the order ships and is delivered to the
      branch, and installation follows. Recording delay notices, holds and releases, remakes, charges,
      waivers and credits are agent service actions, while signing the order acknowledgment and asking for a
      hold or an expedite are the customer's own decisions that the agent hands over. Requests outside every
      rule — compensation beyond the guarantee for a class that carries none, a firm ship date beyond the
      recorded notices once an order is escalated, or splitting an oversized order — are POLICY_NOT_COVERED
      handoffs.
  - name: installation_scheduling_and_job_charges
    claim:
      categories: [install]
      event_types: [install_scheduled, install_reschedule_logged, install_date_changed, install_unscheduled, install_fee_assessed, install_credit_issued, install_punch_logged, install_punch_resolved]
    summary: >
      Homeowners call about their installation job: booking a first crew date, moving or cancelling a booked
      date, a crew that arrived late or a visit that failed for lack of access, charges for lead-safe work,
      permits, rot repair, trim, capping, storm window removal or upper-floor openings, and punch items left
      after the walkthrough — and the setting varies by installation method, job stage (opened, scheduled, in
      progress, completed, closed), the age of the home, whether the job is permitted, the reschedules and
      charges already on record, and whether the customer also has a door or window job running at the same
      time. The governing rules are per installation method: scheduling windows, arrival windows and late
      arrival credits (install_scheduling), notice hours, free and maximum reschedules, late reschedule and
      failed-access fees and company reschedule credits (install_reschedules), lead-safe practices for homes
      built before the stated year (install_lead_safe), permit administration and inspection
      (install_permits), site-condition charges (install_site_charges), punch items and closing
      (install_completion_and_punch), waivers and credits (install_credits_and_waivers), separate accounting
      for concurrent jobs (install_agg_concurrent_jobs) and cancellation after the contract
      (install_cancellation). In the natural course a job opens when the factory order reaches the branch, a
      crew date is booked, work starts, the customer signs the completion certificate at the walkthrough,
      and the job closes once punch items and any inspection clear. Booking, moving and releasing crew dates
      and recording charges, credits and punch items are agent service actions, while choosing to move a
      date and approving extra work on site are the customer's own decisions that the agent hands over or
      leaves to the crew. Situations the rules do not decide — a further reschedule beyond the maximum,
      hazardous materials uncovered on site, damage claims for the home's interior, or alarm and paint work
      outside the job — are POLICY_NOT_COVERED handoffs.
  - name: warranty_claims_and_transfers
    claim:
      categories: [warranty]
      event_types: [warranty_claim_decided, warranty_parts_shipped, warranty_service_visit, warranty_charge_assessed, warranty_charge_reversed, warranty_transfer_requested, warranty_transfer_withdrawn]
    summary: >
      Owners call years after installation about fogged glass, a broken pane, a sticking sash, a failed lock,
      a torn screen, faded exterior color or a leak around a unit, about the charges on a technician visit,
      and, when they sell the home, about passing the coverage to the buyer — and the setting varies by
      warranty plan, how many years have passed since the coverage start date, whether the home is owner
      occupied or rented, whether the registration was issued by transfer, which component failed and why,
      the claims, visits and charges already on record, and whether the customer holds a second
      registration for another contract. The governing rules are per plan: component, labor and workmanship
      terms with the rental cap and transferred caps (warranty_registration_and_terms), the claim decision,
      notice window, exclusions and proration trigger (warranty_claim_decision), accidental breakage with
      its yearly limit and deductible (warranty_glass_breakage), prorated sealed-unit shares
      (warranty_proration), labor, trip, no-show and shipping charges (warranty_service_charges), transfer
      eligibility, window, fee and capped terms (warranty_transfer), reversals (warranty_charge_reversals),
      separate handling per registration (warranty_agg_claims_per_registration) and void and expiry
      (warranty_void_and_expiry). In the natural course coverage is registered when the installation is
      completed, a claim is filed, decided, and remedied by a visit or a parts shipment, and a sale of the
      home may move the coverage to a buyer. Deciding claims, recording visits, shipments, charges and
      reversals, and withdrawing a failed transfer are agent service actions, while filing a claim and
      requesting a transfer are the owner's own assertions of their rights that the agent hands over. Requests
      no rule decides — consequential damage to floors or furnishings, a courtesy repair after every term
      has ended, a voided registration reinstated on the owner's word, or coverage for windows Ridgeline did
      not install — are POLICY_NOT_COVERED handoffs.
  - name: financing_payments_and_hardship
    claim:
      categories: [finance]
      event_types: [finance_payment_posted, finance_fee_assessed, finance_fee_reversed, finance_interest_assessed, finance_payment_deferred, finance_due_day_change_logged, finance_due_day_changed, finance_autopay_changed, finance_cancelled]
    summary: >
      Borrowers call about their Ridgeline financing account: making a payment, a late fee or a returned
      payment fee, a phone payment fee, deferred interest appearing after a same-as-cash promotion, why the
      zero-interest promotion stopped, enrolling in or stopping autopay, moving the due day, asking for a
      hardship deferral, or declining an approval before funding — and the setting varies by plan, account
      stage (approved, active, delinquent, paid off), the promotion's end date, autopay status, the payments,
      returns, fees, waivers and deferrals already posted, and whether the customer has a second account for
      another contract. The governing rules are per plan: origination and approval validity
      (finance_origination), funding at completion and the scheduled payment (finance_funding), payment
      allocation, posting and channel fees (finance_payments), monthly interest, the autopay rate override,
      deferred interest and promotion forfeiture (finance_interest), late fees, courtesy waivers and error
      reversals (finance_late_fees), returned payments and autopay suspension (finance_returned_payments),
      autopay and due day changes (finance_account_changes), hardship deferrals (finance_hardship),
      delinquency and closure (finance_delinquency_and_closure) and the per-customer limits
      (finance_agg_multi_holding, finance_agg_combined_exposure). In the natural course an account is approved,
      funded after the installation is completed, and then posts monthly statements, payments and any fees
      until it is paid off. Posting fees, interest, reversals, deferrals and due day changes are agent service
      actions, while authorizing a payment, autopay, a hardship request or declining the loan are the
      borrower's own acts that the agent hands over. Requests outside every rule — settling a charged-off
      account, waiving deferred interest that was correctly assessed, lowering a plan's rate, or deferring
      payments beyond a plan's limits — are POLICY_NOT_COVERED handoffs.
