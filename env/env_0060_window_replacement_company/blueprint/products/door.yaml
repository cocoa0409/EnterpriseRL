events:
- type: door_contract_signed
  target: door_contracts
  mutation: create
  meaning: The homeowner signs an entry or patio door contract for one door series.
  grain: One row per signed contract.
  fields:
    customer_id: The homeowner who signed.
    variant_name: The door series contracted, as its official full name.
    contract_number: The contract number printed on the signed agreement.
    signed_date: The date the agreement was signed.
    sales_channel: Where the sale was made (in_home, showroom or virtual_consultation).
    unit_count: Number of door units on the contract at signing.
    contract_price: Signed contract price after any discount program, including options chosen at signing.
    payment_method: Whether the contract is paid by cash, check or card or by Ridgeline financing.
    discount_program: The single discount program applied at signing, or none.
    warranty_plan: The warranty plan chosen at signing, as its official name.
  triggers: []
- type: door_payment_received
  target: door_transactions
  meaning: >-
    A payment toward the door contract is received, from the customer or from the financing lender.
  grain: One row per payment received.
  distinguish_by:
  - payment_kind
  - txn_date
  - amount
  - tender_type
  fields:
    txn_date: Date the payment was received.
    amount: Amount received (positive).
    payment_kind: booking_deposit, progress_payment, final_balance or lender_funding.
    tender_type: check, card, ach or lender_disbursement.
  account: customer_payments
  direction: in
  triggers: []
- type: door_refund_issued
  target: door_transactions
  meaning: >-
    Money is returned to the customer against one specific earlier payment on the door contract.
  grain: One row per refund of one source payment.
  distinguish_by:
  - refund_kind
  - source_door_txn_id
  - txn_date
  fields:
    txn_date: Date the refund was issued.
    amount: Amount refunded (positive).
    refund_kind: cooling_off_refund, cancellation_refund or overpayment_refund.
    source_door_txn_id: The payment record this refund returns money from.
  account: customer_payments
  direction: out
  triggers: []
- type: door_change_order
  target: door_transactions
  meaning: >-
    A priced addition to the door contract — an option, an added unit or a custom-size surcharge.
  grain: One row per change order line of one kind written on one date.
  distinguish_by:
  - change_kind
  - txn_date
  - units_affected
  fields:
    txn_date: Date the change order was written.
    amount: Price added to the contract (positive).
    change_kind: >-
      What was added (sidelite_added, transom_added, multipoint_lock, smart_lock_prep, decorative_glass,
      finish_upgrade, storm_door_added, low_profile_threshold, unit_added, custom_size_surcharge).
    units_affected: Number of door units the line prices.
  account: contract_charges
  direction: in
  triggers: []
- type: door_price_credit
  target: door_transactions
  meaning: A credit that reduces what the customer owes on the door contract.
  grain: One row per credit of one kind granted on one date for one source.
  distinguish_by:
  - credit_kind
  - txn_date
  - factory_order_id
  - referred_contract_number
  fields:
    txn_date: Date the credit was granted.
    amount: Credit amount (positive).
    credit_kind: unit_removed, window_bundle_discount, referral_credit or on_time_guarantee_credit.
    units_affected: Door units removed, for a unit_removed credit; 0 otherwise.
    factory_order_id: The factory order whose late shipment earned an on_time_guarantee_credit; empty
      otherwise.
    referred_contract_number: >-
      Contract number of the referred household's contract, for a referral_credit; empty otherwise.
  account: contract_charges
  direction: out
  triggers: []
- type: door_fee_assessed
  target: door_transactions
  meaning: A fee or charge is added to the door contract.
  grain: One row per fee of one kind assessed on one date.
  distinguish_by:
  - fee_kind
  - txn_date
  fields:
    txn_date: Date the fee was assessed.
    amount: Fee amount (positive).
    fee_kind: >-
      missed_measure_fee, remeasure_fee, change_order_fee, series_change_fee, late_balance_charge or cancellation_charge.
  account: contract_charges
  direction: in
  triggers: []
- type: door_measure_visit
  target: door_transactions
  meaning: A door measure appointment at the home is recorded with its outcome.
  grain: One row per measure appointment.
  distinguish_by:
  - visit_kind
  - txn_date
  fields:
    txn_date: Date of the appointment.
    visit_kind: final_measure, remeasure (customer-requested) or company_remeasure (ordered by Ridgeline).
    visit_outcome: completed, customer_no_show, late_reschedule or company_rescheduled.
    units_affected: Door units measured at a completed visit; 0 otherwise.
    custom_size_unit_count: Door units measured at a size outside the series' standard sizes; 0 otherwise.
  triggers:
  - event: door:door_measure_confirmed
    when:
      visit_kind: final_measure
      visit_outcome: completed
    map:
      measure_date: txn_date
      unit_count: units_affected
  - event: door:door_change_order
    when:
      visit_kind: final_measure
      visit_outcome: completed
      custom_size_unit_count:
        not: 0
    map:
      change_kind: custom_size_surcharge
      units_affected: custom_size_unit_count
      txn_date: txn_date
- type: door_measure_confirmed
  target: door_contracts
  mutation:
    transition:
      from: signed
      to: measured
  meaning: The final measure fixes the contract's door units, handing and sizes.
  grain: One row per transaction.
  fields:
    measure_date: Date of the completed final measure.
    unit_count: Door units confirmed at the final measure.
  triggers: []
- type: door_order_released
  target: door_contracts
  mutation:
    transition:
      from: measured
      to: ordered
  meaning: The confirmed door specifications are released to the factory.
  grain: One row per transaction.
  fields:
    order_release_date: Date the order was released to the factory.
  triggers:
  - event: order:order_entered
    map:
      door_contract_id: door_contract_id
      customer_id: customer_id
- type: door_installation_completed
  target: door_contracts
  mutation:
    transition:
      from: ordered
      to: installed
  meaning: The installation of the contracted doors is completed and signed off on site.
  grain: One row per transaction.
  fields:
    completion_date: Date the installation was completed.
  triggers: []
- type: door_contract_closed
  target: door_contracts
  mutation:
    transition:
      from: installed
      to: closed
  meaning: The installed door contract is paid in full and closed.
  grain: One row per transaction.
  fields:
    closed_date: Date the contract was closed.
  triggers: []
- type: door_contract_cancelled
  target: door_contracts
  mutation:
    transition:
    - from: signed
      to: cancelled
    - from: measured
      to: cancelled
    - from: ordered
      to: cancelled
  meaning: The door contract is cancelled on the customer's written notice.
  grain: One row per transaction.
  fields:
    cancelled_date: Date the written notice of cancellation was given.
  triggers: []
- type: door_series_changed
  target: door_contracts
  mutation: update
  meaning: The door contract is moved to another door series before order release and re-priced.
  grain: One row per transaction.
  fields:
    variant_name: The new door series.
    contract_price: The re-priced contract price.
  triggers: []
measures:
- id: door_msr_paid_to_date
  window: Contract lifetime up to the moment of handling.
  measure: >-
    Sum of amount over door_payment_received rows of the contract minus sum of amount over its door_refund_issued
    rows.
- id: door_msr_net_charges
  window: Contract lifetime up to the moment of handling.
  measure: >-
    Sum of amount over door_change_order and door_fee_assessed rows of the contract minus sum of amount
    over its door_price_credit rows.
- id: door_msr_open_contracts
  window: Portfolio state at the moment of handling.
  measure: >-
    Count of the customer's door contracts whose status is signed, measured, ordered or installed.
- id: door_msr_missed_measures
  window: Contract lifetime up to and including the appointment being handled.
  measure: >-
    Count of door_measure_visit rows of the contract whose visit_outcome is customer_no_show or late_reschedule.
- id: door_msr_customer_remeasures
  window: Contract lifetime up to and including the visit being handled.
  measure: >-
    Count of door_measure_visit rows of the contract with visit_kind remeasure and visit_outcome completed.
- id: door_msr_change_orders
  window: Contract lifetime up to and including the change order being handled.
  measure: >-
    Count of distinct txn_date values among door_change_order rows of the contract whose change_kind is
    not custom_size_surcharge (all lines written on one date form one change order).
- id: door_msr_referral_credits
  window: Contract lifetime up to the moment of handling.
  measure: Count of door_price_credit rows of the contract with credit_kind referral_credit.
policies:
- id: door_agg_multi_holding
  subject:
  - door_contract_signed
  rule: >-
    A customer may hold several door contracts over time, but no more than the cap in params may be open
    at the same time, where an open contract is one whose status is signed, measured, ordered or installed
    (door_msr_open_contracts); closed and cancelled door contracts do not count. A new door contract may
    be signed only when the customer's count of open door contracts is below the cap. When the cap is
    already reached, an additional door is added to an open door contract by change order before its order
    release, or the new contract waits until an open door contract closes. Window contracts are a separate
    product line and never count toward this cap.
  eligibility:
  - id: open_contract_cap
    applies_to:
    - door_contract_signed
    kind: authorization
    condition: >-
      A new door contract may be signed only when the customer's count of open door contracts is below
      the cap.
    evidence_fields:
    - door_contracts.customer_id
    - door_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.customer_id
      action_bindings:
        door_contracts.customer_id: customer_id
  params:
    max_per_customer: 2
  measures:
  - door_msr_open_contracts
- id: door_agg_payment_application
  subject:
  - door_payment_received
  - door_refund_issued
  rule: >-
    Every payment is applied to exactly one door contract and is never split across contracts. The payment
    goes to the contract whose contract number the customer gives; when the customer names no contract
    and holds more than one open door contract, it goes to the open door contract with the earliest signed
    date that still has a balance due. A payment intended for a window contract is never booked to a door
    contract. Lender funding is applied to the contract named on the funded financing account. A refund
    is always booked against the same door contract as the payment it returns and names that payment as
    its source.
  eligibility:
  - id: refund_same_contract
    applies_to:
    - door_refund_issued
    kind: authorization
    condition: >-
      A refund is always booked against the same door contract as the payment it returns and names that
      payment as its source.
    evidence_fields:
    - door_transactions.door_txn_id
    - door_transactions.door_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_transactions.door_txn_id
        - door_transactions.door_contract_id
      action_bindings:
        door_transactions.door_txn_id: source_door_txn_id
        door_transactions.door_contract_id: door_contract_id
  measures:
  - door_msr_open_contracts
- id: door_discount_programs
  subject:
  - door_contract_signed
  rule: >-
    At signing, the list price is the series base price per door unit times the number of units plus the
    options chosen. One discount program at most applies to a door contract: military (active duty or
    veteran, shown by military identification at signing), senior, or first responder (sworn police, fire
    or EMS, shown by department identification at signing). The senior program applies only when the customer
    is at least the minimum age on the contract signing date according to the date of birth on the customer
    profile. When the customer qualifies for more than one program, the single program with the highest
    rate for the series is applied; programs never add together. The program rate is applied to the list
    price and the result, rounded to the cent, is the signed contract price. A door contract may be signed
    only when the signed contract price reaches the series minimum contract amount and the unit count
    does not exceed the series maximum. Discount programs are chosen at signing only. The warranty plan
    is also fixed at signing: the series' included plan is the default, a higher plan is bought at signing
    for the warranty charter's upgrade price per door unit and is part of the signed contract price, a
    plan lower than the series' included plan cannot be chosen, and the plan never changes after signing.
  eligibility:
  - id: senior_age
    applies_to:
    - door_contract_signed
    kind: authorization
    condition: >-
      The senior program applies only when the customer is at least the minimum age on the contract signing
      date according to the date of birth on the customer profile.
    evidence_fields:
    - customers.customer_id
    - customers.date_of_birth
    - door_contracts.signed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: series_size_limits
    applies_to:
    - door_contract_signed
    kind: authorization
    condition: >-
      A door contract may be signed only when the signed contract price reaches the series minimum contract
      amount and the unit count does not exceed the series maximum.
    evidence_fields:
    - door_contracts.contract_price
    - door_contracts.unit_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.contract_price
        - door_contracts.unit_count
      action_bindings:
        door_contracts.contract_price: contract_price
        door_contracts.unit_count: unit_count
  params:
    per_tier:
      Ridgeline Portal 310 Steel Entry Door:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline Portal 520 Smooth Fiberglass Entry Door:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline Glide 720 Vinyl Sliding Patio Door:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline Portal 640 Woodgrain Fiberglass Entry Door:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline Glide 840 Fiberglass Sliding Patio Door:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline Hinge 960 Wood-Clad French Patio Door:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
    min_age: =senior_discount_min_age
- id: door_booking_deposit
  subject:
  - door_payment_received
  - door_measure_visit
  rule: >-
    Every door contract takes a booking deposit before the final measure. For a contract paid by cash,
    check or card, the required deposit is the larger of the series deposit percentage of the signed contract
    price and the series deposit minimum, but never more than the signed contract price. For a contract
    whose payment method is Ridgeline financing, the required deposit is the series financed deposit percentage
    of the signed contract price with no minimum, and is zero where that percentage is zero. Amounts are
    rounded to the cent. The deposit is due within the series deposit window, counted in calendar days
    from the day after the contract signing date. The final door measure visit is booked only after the
    required deposit has been received in full. The final measure is offered within the series measure
    booking window counted in business days (Monday through Friday, excluding U.S. federal holidays) from
    the day after the deposit is complete. Money received before order release up to the required deposit
    is recorded as booking_deposit and anything beyond it as progress_payment. A single card payment may
    not exceed the card limit. A deposit that has not arrived by the end of the deposit window does not
    cancel the contract by itself; the measure simply stays unbooked.
  eligibility:
  - id: deposit_before_measure
    applies_to:
    - door_measure_visit
    kind: authorization
    condition: >-
      The final door measure visit is booked only after the required deposit has been received in full.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_transactions.amount
    - door_transactions.payment_kind
    - door_contracts.contract_price
    - door_contracts.payment_method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
  params:
    deposit_pct: =booking_deposit_pct
    deposit_min: =booking_deposit_min
    financed_pct: =financed_deposit_pct
    due_days: =deposit_due_days
    measure_offer_days: =measure_booking_business_days
    card_limit: =card_payment_max_per_txn
  formula:
    required_deposit_cash: >-
      round(min(contract_price, max(contract_price * booking_deposit_pct, booking_deposit_min)), 2)
    required_deposit_financed: round(contract_price * financed_deposit_pct, 2)
- id: door_measure_visits
  subject:
  - door_measure_visit
  - door_measure_confirmed
  - door_fee_assessed
  rule: >-
    Door measure appointments are performed by a Ridgeline measure technician, who records the rough opening,
    handing and swing of each unit. A door measure visit can be booked only while the contract status
    is signed or measured. A completed final measure confirms the units and their sizes and moves the
    contract to measured with the measured unit count and the visit date. A customer_no_show (nobody gives
    access within 30 minutes of the appointment start) and a late_reschedule (a customer reschedule given
    with less than the series reschedule notice before the appointment start) are both missed appointments;
    a company_rescheduled appointment never is. The missed appointments of a contract are counted (door_msr_missed_measures);
    those up to the waived count carry no fee and each later one carries the series missed-appointment
    fee on the date of the missed appointment. A remeasure the customer asks for after the final measure
    is free up to the series free remeasure count (door_msr_customer_remeasures) and carries the series
    remeasure fee after that; a company_remeasure is always free and is not counted. A remeasure never
    changes the contract status.
  eligibility:
  - id: measure_status
    applies_to:
    - door_measure_visit
    kind: state
    condition: A door measure visit can be booked only while the contract status is signed or measured.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    state_contract:
      field: door_contracts.status
      allowed:
      - signed
      - measured
  params:
    notice_hours: =measure_reschedule_notice_hours
    waived_missed: =free_missed_measure_count
    missed_fee: =missed_measure_fee
    free_remeasures: =free_remeasure_count
    remeasure_charge: =remeasure_fee
  formula:
    missed_fee_due: missed_measure_fee if door_msr_missed_measures > free_missed_measure_count else 0
    remeasure_fee_due: remeasure_fee if door_msr_customer_remeasures > free_remeasure_count else 0
  measures:
  - door_msr_missed_measures
  - door_msr_customer_remeasures
- id: door_custom_size_pricing
  subject:
  - door_change_order
  - door_measure_visit
  rule: >-
    Each door unit is measured at the final measure and compared with the series standard sizes, width
    by height in inches. A unit that fits a standard size is priced in the base price. A unit at any other
    size is built to custom size and carries the series custom-size surcharge per unit, written as one
    change order line of kind custom_size_surcharge dated the final measure date for all such units together;
    this line is not a customer change order and never counts toward the free or maximum change-order
    counts. A remeasure that changes the custom-size count after the final measure is re-priced by a customer
    change order, never by a second automatic line.
  eligibility: []
  params:
    per_tier:
      Ridgeline Portal 310 Steel Entry Door:
        sizes: =standard_sizes
        surcharge: =custom_size_surcharge_per_unit
      Ridgeline Portal 520 Smooth Fiberglass Entry Door:
        sizes: =standard_sizes
        surcharge: =custom_size_surcharge_per_unit
      Ridgeline Glide 720 Vinyl Sliding Patio Door:
        sizes: =standard_sizes
        surcharge: =custom_size_surcharge_per_unit
      Ridgeline Portal 640 Woodgrain Fiberglass Entry Door:
        sizes: =standard_sizes
        surcharge: =custom_size_surcharge_per_unit
      Ridgeline Glide 840 Fiberglass Sliding Patio Door:
        sizes: =standard_sizes
        surcharge: =custom_size_surcharge_per_unit
      Ridgeline Hinge 960 Wood-Clad French Patio Door:
        sizes: =standard_sizes
        surcharge: =custom_size_surcharge_per_unit
  formula:
    custom_size_line_amount: round(custom_size_surcharge_per_unit * units_affected, 2)
- id: door_change_orders
  subject:
  - door_change_order
  - door_fee_assessed
  rule: >-
    A customer change order adds options or units to the door contract. A door change order can be written
    only while the contract status is signed or measured. Once the order is released, the door is in production
    and no change order is accepted. Each line is priced at the series price per unit for the option times
    the units affected; an added unit is priced at the series base price per unit. A sidelite, transom
    or storm door can be ordered only in a series where it is available, and a multipoint lock is never
    charged where it is standard. All lines written on the same date form one change order. A contract
    may carry no more customer change orders than the series maximum; a request beyond it is refused.
    The customer change orders of a contract are counted (door_msr_change_orders); those up to the series
    free count carry no fee, and each later change order carries the series change-order fee once, on
    the date it is written. Adding units may not take the contract above the series maximum unit count.
  eligibility:
  - id: change_order_status
    applies_to:
    - door_change_order
    kind: state
    condition: A door change order can be written only while the contract status is signed or measured.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    state_contract:
      field: door_contracts.status
      allowed:
      - signed
      - measured
  params:
    free_count: =change_order_free_count
    fee: =change_order_fee
    max_count: =change_order_max_count
    option_prices:
      sidelite_added: =sidelite_per_unit
      transom_added: =transom_per_unit
      multipoint_lock: =multipoint_lock_per_unit
      smart_lock_prep: =smart_lock_prep_per_unit
      decorative_glass: =decorative_glass_per_unit
      finish_upgrade: =finish_upgrade_per_unit
      storm_door_added: =storm_door_per_unit
      low_profile_threshold: =low_profile_threshold_per_unit
      unit_added: =base_price_per_unit
    availability:
      sidelite: =sidelite_available
      transom: =transom_available
      storm_door: =storm_door_available
      multipoint_standard: =multipoint_lock_standard
  formula:
    unit_added_amount: round(base_price_per_unit * units_affected, 2)
    change_order_fee_due: change_order_fee if door_msr_change_orders > change_order_free_count else 0
  measures:
  - door_msr_change_orders
- id: door_price_credits
  subject:
  - door_price_credit
  rule: >-
    Credits reduce what is owed on the door contract and are additive with one another, except as stated
    here. A unit_removed credit is granted only before order release (status signed or measured) and equals
    the series removal share of the base price per unit times the units removed; if the removal would
    leave fewer units than the minimum that must remain or bring the contract below the series minimum
    contract amount, the removal is not made and the cancellation terms apply instead. A window_bundle_discount
    credit equals the series bundle percentage of the signed door contract price; it is granted on the
    door contract when the customer signs a Ridgeline window contract within the bundle window of calendar
    days before or after this contract's signed date and neither contract is cancelled, once per pair
    of contracts. The window bundle discount is granted only when the door contract's discount program
    is none. A referral_credit of the series referral amount is granted when a household the customer
    referred signs its own Ridgeline contract and that contract reaches installed status, once per referred
    contract number and at most the series maximum per contract (door_msr_referral_credits). An on_time_guarantee_credit
    is the amount the factory order charter computes and is booked when that order's credit is applied.
    Credits are never paid out in cash while a balance is owed; a credit that takes the amount owed below
    zero becomes an overpayment refunded under the refund rules.
  eligibility:
  - id: bundle_vs_program
    applies_to:
    - door_price_credit
    kind: state
    condition: >-
      The window bundle discount is granted only when the door contract's discount program is none.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.discount_program
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    state_contract:
      field: door_contracts.discount_program
      allowed:
      - none
  params:
    removal_share: =unit_removed_credit_pct
    min_remaining: =min_units_after_removal
    bundle_days: =window_bundle_window_days
    per_tier:
      Ridgeline Portal 310 Steel Entry Door:
        bundle_pct: =window_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline Portal 520 Smooth Fiberglass Entry Door:
        bundle_pct: =window_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline Glide 720 Vinyl Sliding Patio Door:
        bundle_pct: =window_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline Portal 640 Woodgrain Fiberglass Entry Door:
        bundle_pct: =window_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline Glide 840 Fiberglass Sliding Patio Door:
        bundle_pct: =window_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline Hinge 960 Wood-Clad French Patio Door:
        bundle_pct: =window_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
  formula:
    unit_removed_credit: round(base_price_per_unit * unit_removed_credit_pct * units_affected, 2)
    window_bundle_credit: round(contract_price * window_bundle_discount_pct, 2)
  measures:
  - door_msr_referral_credits
- id: door_series_change
  subject:
  - door_series_changed
  - door_fee_assessed
  rule: >-
    A door contract may move to another door series only before order release, and only between series
    of the same door type (entry to entry, patio to patio), because the rough opening is built for one
    door type. A door series change can be made only while the contract status is signed or measured.
    The re-priced contract price is the current contract price plus the difference between the new and
    the old series base price per unit times the current unit count, before any discount program; where
    the contract carries a discount program, the program rate of the new series is applied to the re-priced
    list price instead. Option lines already written stay at the price they were written at; a series
    change cannot be made while the contract carries an option line the new series does not offer. A series
    change made while the contract is measured carries the series redesign fee of the new series; one
    made while it is signed carries none. If the new series raises the required deposit, the difference
    is due before order release.
  eligibility:
  - id: series_change_status
    applies_to:
    - door_series_changed
    kind: state
    condition: A door series change can be made only while the contract status is signed or measured.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    state_contract:
      field: door_contracts.status
      allowed:
      - signed
      - measured
  params:
    redesign_fee: =series_change_fee
- id: door_order_release
  subject:
  - door_order_released
  rule: >-
    The confirmed door specifications are released to the factory once the contract is measured. The door
    order may be released only after the required booking deposit has been received in full. For an in_home
    sale, the door order may be released only once the cooling-off period counted from the contract signing
    date has fully passed. Business days are counted starting the day after the contract signing date,
    skipping Sundays and U.S. federal holidays, so Saturdays count as business days. Release on the last
    day of the cooling-off period is too early; the first permitted release date is the next calendar
    day. Showroom and virtual_consultation sales carry no cooling-off wait. Release creates the factory
    production order for the contract.
  eligibility:
  - id: deposit_complete
    applies_to:
    - door_order_released
    kind: authorization
    condition: >-
      The door order may be released only after the required booking deposit has been received in full.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_transactions.amount
    - door_transactions.payment_kind
    - door_contracts.contract_price
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
  - id: cooling_off_elapsed
    applies_to:
    - door_order_released
    kind: time
    condition: >-
      For an in_home sale, the door order may be released only once the cooling-off period counted from
      the contract signing date has fully passed.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.signed_date
    - door_contracts.sales_channel
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contract signing date
      anchor_source: door_contracts.signed_date
      relation: not_before
      duration_source: variants.cooling_off_business_days
      unit: business_days
      counting_rule: >-
        Business days are counted starting the day after the contract signing date, skipping Sundays and
        U.S. federal holidays, so Saturdays count as business days.
      boundary: exclusive
  params:
    cooling_off_days: =cooling_off_business_days
- id: door_cooling_off_cancellation
  subject:
  - door_contract_cancelled
  - door_refund_issued
  rule: >-
    A door sale made in the customer's home carries the federal three-day cooling-off right printed on
    the contract. The cooling-off right applies only to door contracts whose sales channel is in_home.
    A door cancellation qualifies for the cooling-off terms only when the customer's written notice of
    cancellation is given no later than the end of the cooling-off period counted from the contract signing
    date. Business days are counted starting the day after the contract signing date, skipping Sundays
    and U.S. federal holidays, so Saturdays count as business days, and notice given on the last counted
    business day still qualifies. Written notice is the signed Notice of Cancellation form, an email to
    the contract inbox or a letter, dated the day it is given or postmarked, and is recorded as a cancellation
    request. A qualifying cancellation carries no fee or charge of any kind, and every payment received
    is refunded in full, each against its own source payment, within the refund window counted in business
    days from receipt of the notice. Notice given after the period ends, or on a showroom or virtual_consultation
    contract, is handled under the standard cancellation terms.
  eligibility:
  - id: in_home_only
    applies_to:
    - door_contract_cancelled
    - door_refund_issued
    kind: authorization
    condition: The cooling-off right applies only to door contracts whose sales channel is in_home.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.sales_channel
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
  - id: notice_in_period
    applies_to:
    - door_contract_cancelled
    kind: time
    condition: >-
      A door cancellation qualifies for the cooling-off terms only when the customer's written notice
      of cancellation is given no later than the end of the cooling-off period counted from the contract
      signing date.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.signed_date
    - door_cancellation_requests.notice_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contract signing date
      anchor_source: door_contracts.signed_date
      relation: not_after
      duration_source: variants.cooling_off_business_days
      unit: business_days
      counting_rule: >-
        Business days are counted starting the day after the contract signing date, skipping Sundays and
        U.S. federal holidays, so Saturdays count as business days, and notice given on the last counted
        business day still qualifies.
      boundary: inclusive
  params:
    period_days: =cooling_off_business_days
    refund_days: =cooling_off_refund_business_days
  formula:
    cooling_off_refund_total: door_msr_paid_to_date
    cooling_off_fee: 0
  measures:
  - door_msr_paid_to_date
- id: door_standard_cancellation
  subject:
  - door_contract_cancelled
  - door_fee_assessed
  - door_refund_issued
  rule: >-
    A door cancellation that does not qualify for the cooling-off terms is settled by the contract status
    on the date the written notice is given. In status signed the charge is the series pre-measure cancellation
    fee; in status measured it is the series measure-and-design charge; in status ordered it is the series
    product share of the adjusted contract value, which is the signed contract price plus the net contract
    charges (door_msr_net_charges) before the cancellation charge itself. A door contract that is installed
    or closed cannot be cancelled. The charge is booked as one cancellation_charge fee on the notice date.
    Payments received (door_msr_paid_to_date) are kept up to the charge; the excess is refunded as cancellation_refund
    within the refund window, taken from the most recent payments first, each refund naming its source
    payment. When payments received are below the charge, the difference stays owed. Once a door contract
    is cancelled, no further change order, measure visit, or price credit other than an on_time_guarantee_credit
    already earned is booked to it.
  eligibility: []
  params:
    per_tier:
      Ridgeline Portal 310 Steel Entry Door:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline Portal 520 Smooth Fiberglass Entry Door:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline Glide 720 Vinyl Sliding Patio Door:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline Portal 640 Woodgrain Fiberglass Entry Door:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline Glide 840 Fiberglass Sliding Patio Door:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline Hinge 960 Wood-Clad French Patio Door:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
    refund_days: =refund_business_days
  formula:
    charge_if_signed: pre_measure_cancellation_fee
    charge_if_measured: pre_release_cancellation_fee
    charge_if_ordered: round(post_release_product_share_pct * (contract_price + door_msr_net_charges),
      2)
    refund_if_ordered: max(0, door_msr_paid_to_date - charge_if_ordered)
  measures:
  - door_msr_net_charges
  - door_msr_paid_to_date
- id: door_final_balance
  subject:
  - door_installation_completed
  - door_payment_received
  - door_fee_assessed
  - door_contract_closed
  rule: >-
    The balance due on a door contract is the signed contract price plus the net contract charges (door_msr_net_charges)
    minus the payments received net of refunds (door_msr_paid_to_date). The net charges of the contract's
    installation job are collected with it, so the amount due at the end is the balance due plus those
    job charges. The remaining balance falls due on the final balance due date, the stated number of calendar
    days after the installation completion date, and is recorded as final_balance when paid. For a financed
    contract, the lender funding is recorded as lender_funding on the funding date and any remainder is
    paid by the customer. A door late balance charge applies only while the contract status is installed.
    A door late balance charge may be assessed only when the balance remains unpaid after the final balance
    due date, which falls the stated number of calendar days after the installation completion date. Calendar
    days are counted from the day after the installation completion date, and payment on the due date
    itself is on time. The late charge is the monthly rate times the unpaid balance for each full 30-day
    period after the due date, never less than the minimum charge, assessed once at the end of each such
    period. The contract closes once it is installed and the balance due is zero; an overpayment at that
    point is refunded as overpayment_refund.
  eligibility:
  - id: late_charge_status
    applies_to:
    - door_fee_assessed
    kind: state
    condition: A door late balance charge applies only while the contract status is installed.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    state_contract:
      field: door_contracts.status
      allowed:
      - installed
  - id: past_due_date
    applies_to:
    - door_fee_assessed
    kind: time
    condition: >-
      A door late balance charge may be assessed only when the balance remains unpaid after the final
      balance due date, which falls the stated number of calendar days after the installation completion
      date.
    evidence_fields:
    - door_contracts.door_contract_id
    - door_contracts.completion_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_contracts.door_contract_id
      action_bindings:
        door_contracts.door_contract_id: door_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the installation completion date
      anchor_source: door_contracts.completion_date
      relation: not_before
      duration_source: variants.final_balance_due_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the installation completion date, and payment on
        the due date itself is on time.
      boundary: exclusive
  params:
    due_days: =final_balance_due_days
    late_rate: =late_balance_monthly_rate
    late_min: =late_balance_min_charge
  formula:
    balance_due: round(contract_price + door_msr_net_charges - door_msr_paid_to_date, 2)
    late_charge_per_period: max(late_balance_min_charge, round(late_balance_monthly_rate * balance_due,
      2))
  measures:
  - door_msr_net_charges
  - door_msr_paid_to_date
- id: door_refunds
  subject:
  - door_refund_issued
  rule: >-
    A door refund returns money from one specific earlier payment and is never larger than what remains
    unrefunded of that payment. Refunds go back by the tender rule: to the card or bank account a card
    or ACH payment came from, and by mailed check for a check payment; lender funding is never refunded
    to the customer and is instead returned to the lender by the financing account's terms. A door payment
    that has already been refunded in full is never refunded again. A non-cooling-off refund is issued
    within the refund window counted in business days from the date it becomes due.
  eligibility:
  - id: no_double_refund
    applies_to:
    - door_refund_issued
    kind: dedup
    condition: A door payment that has already been refunded in full is never refunded again.
    evidence_fields:
    - door_transactions.source_door_txn_id
    - door_transactions.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - door_transactions.source_door_txn_id
      action_bindings:
        door_transactions.source_door_txn_id: source_door_txn_id
    dedup_contract:
      table: door_transactions
      mode: separate_record
      object_bindings:
        source_door_txn_id: source_door_txn_id
      duplicate_filters:
        event_type:
        - door_refund_issued
      distinct_fields:
      - refund_kind
      - txn_date
  params:
    tender_rule: =refund_tender_rule
    refund_days: =refund_business_days
