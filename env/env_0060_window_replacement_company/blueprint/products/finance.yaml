category: finance
display_name: Ridgeline Home Improvement Financing
binding:
  holding_table: finance_accounts
  event_tables:
  - finance_transactions
  intake_tables:
  - finance_hardship_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - approved
  - active
  - delinquent
  - paid_off
  - cancelled
  - charged_off
  transitions:
  - from: approved
    to: active
    by: system
    means: The loan is funded to the contract after the installation is completed.
  - from: approved
    to: cancelled
    by: user
    means: The customer declines the approved loan before funding, or the approval lapses unfunded.
  - from: active
    to: delinquent
    by: system
    means: A scheduled payment is 30 or more days past due.
  - from: delinquent
    to: active
    by: system
    means: Every past-due payment is brought current.
  - from: active
    to: paid_off
    by: system
    means: The balance reaches zero.
  - from: delinquent
    to: paid_off
    by: system
    means: The balance reaches zero while past due.
  - from: delinquent
    to: charged_off
    by: system
    means: The account reaches the charge-off point and moves to collections.
accounts:
- key: loan_balance
  unit: USD
  meaning: >-
    Amount owed on the financing account — funded principal plus interest and fees, net of payments and
    reversals.
parameter_schema:
  promo_months: >-
    Length of the promotional period from the funded date; 0 for plans without one (calendar months).
  promo_type: 'Kind of promotion: deferred_interest, zero_apr_equal_payment or none (enumeration).'
  purchase_apr: Annual percentage rate on the balance outside any promotion (decimal fraction).
  term_months: Number of scheduled monthly payments from funding (months).
  payment_factor_per_1000: Scheduled monthly payment per 1,000.00 financed (USD).
  min_monthly_payment: Floor of the scheduled monthly payment (USD).
  post_promo_term_months: >-
    Months over which a balance remaining after a deferred-interest promotion is re-amortized at the purchase
    APR; 0 for other plans (months).
  min_financed_amount: Smallest amount the plan finances (USD).
  max_financed_amount: Largest amount the plan finances (USD).
  min_credit_score: Lowest credit score accepted for the plan at application (score).
  financed_amount_basis: >-
    Most that may be financed on one contract: contract_price_minus_required_deposit (enumeration).
  max_combined_financed: Most a customer may have financed across all open accounts together (USD).
  approval_valid_days: Calendar days after the approval date within which the loan must fund (days).
  funding_requires_completion_certificate: >-
    Whether the loan funds only after the customer signs the installation completion certificate (boolean).
  funding_business_days_after_completion: Business days after installation completion within which the
    loan is funded (days).
  first_due_min_days: >-
    The first payment is due on the first payment due day that falls at least this many calendar days
    after funding (days).
  due_day_min: Earliest day of the month a payment may fall due (day).
  due_day_max: Latest day of the month a payment may fall due (day).
  due_day_change_max_per_12_months: Payment due day changes allowed in any rolling 365 days (count).
  payment_posting_cutoff: >-
    Payments received after this time Eastern on a business day post on the next business day (HH:MM).
  payment_allocation_order: Order in which a payment is applied (list).
  extra_payment_rule: >-
    How money beyond the scheduled payment is used: principal_reduction_no_due_date_advance (enumeration).
  prepayment_penalty: Charge for paying early or in full (USD).
  payoff_quote_valid_days: Calendar days a payoff quote stays valid (days).
  interest_basis: >-
    How monthly interest is figured: monthly_rate_on_period_start_balance applies one twelfth of the effective
    APR to the balance at the start of the statement period (enumeration).
  amount_rounding: 'Rounding of every computed amount: cent_half_up (enumeration).'
  autopay_apr_discount: Reduction of the effective APR while autopay is enrolled (decimal fraction).
  autopay_enrollment_lead_days: >-
    Calendar days before a due date by which autopay must be enrolled to draw that payment (days).
  autopay_suspend_after_returns: Returned payments in any rolling 365 days after which autopay is suspended
    (count).
  deferred_interest_basis: >-
    How deferred interest is figured: monthly accrual at the purchase APR on each promotional statement
    period's starting balance (enumeration).
  promo_forfeit_missed_payments: >-
    Consecutive statement periods ending delinquent after which a zero-APR promotion is forfeited; 0 where
    no forfeiture applies (count).
  promo_forfeit_apr: >-
    APR that replaces a forfeited zero-APR promotion from the next statement period; equals the purchase
    APR where no forfeiture applies (decimal fraction).
  late_fee_grace_days: Calendar days after a due date before an unpaid scheduled payment draws a late
    fee (days).
  late_fee_amount: Fixed late fee, before the percentage limit (USD).
  late_fee_cap_pct_of_payment: >-
    A late fee never exceeds this share of the scheduled payment that was late (decimal fraction).
  courtesy_late_fee_waivers_per_365_days: Late fees support may waive as a courtesy in any rolling 365
    days (count).
  courtesy_waiver_on_time_periods: >-
    Statement periods immediately before the late one that must have been paid on time for a courtesy
    waiver (count).
  returned_payment_fee: Fee for a payment returned unpaid by the bank (USD).
  phone_payment_fee: >-
    Fee for a payment made through a phone agent; autopay, online and mailed payments are free (USD).
  phone_fee_waived_in_hardship: >-
    Whether the phone payment fee is waived while an approved hardship deferral is in effect (boolean).
  delinquency_days: >-
    Days past due at which the account becomes delinquent and is reported to credit bureaus (days).
  charge_off_days: Days past due at which the account is charged off and moved to collections (days).
  hardship_deferral_max_months: >-
    Most months one hardship deferral may cover; 0 where hardship deferral is not offered (months).
  hardship_lifetime_max_months: Most months of hardship deferral over the life of the account (months).
  hardship_min_months_since_funding: >-
    Full calendar months since the funded date before a hardship deferral can be granted (months).
  hardship_max_days_past_due: Most days past due an account may be when a hardship deferral is granted
    (days).
  hardship_interest_continues: Whether interest keeps accruing on deferred payments (boolean).
  hardship_extends_promo: Whether a hardship deferral extends a promotional end date (boolean).
