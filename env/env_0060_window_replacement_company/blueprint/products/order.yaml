events:
- type: order_entered
  target: factory_orders
  mutation: create
  meaning: A released contract is entered at the factory as one production order.
  grain: One row per factory order.
  fields:
    customer_id: The customer whose contract the order builds.
    window_contract_id: The window contract built, or empty for a door order.
    door_contract_id: The door contract built, or empty for a window order.
    variant_name: The build class, as its official name.
    order_number: The factory order number.
    entered_date: Date of factory entry.
    unit_count: Units on the order.
    committed_ship_date: Ship date committed on the acknowledgment.
    current_ship_date: Projected ship date, equal to the committed date at entry.
  triggers: []
- type: order_milestone_logged
  target: order_milestones
  meaning: >-
    A production checkpoint is reached, including the customer's signature on the order acknowledgment.
  grain: One row per checkpoint of one kind reached on one date.
  distinguish_by:
  - milestone_kind
  - milestone_date
  fields:
    milestone_date: Date the checkpoint was reached.
    milestone_kind: >-
      acknowledgment_signed, template_received, glass_received, assembly_complete, quality_check_passed
      or quality_check_failed.
    unit_count: Units the checkpoint covers.
  triggers:
  - event: order:order_remake_logged
    when:
      milestone_kind: quality_check_failed
    map:
      remake_cause: factory_defect
      unit_count: unit_count
      milestone_date: milestone_date
- type: order_production_started
  target: factory_orders
  mutation:
    transition:
      from: entered
      to: in_production
  meaning: Production of the order starts.
  grain: One row per transaction.
  fields:
    production_start_date: Date production started.
  triggers: []
- type: order_delay_noticed
  target: order_milestones
  meaning: The projected ship date moves later, with its cause.
  grain: One row per delay notice.
  distinguish_by:
  - milestone_date
  - revised_ship_date
  - delay_cause
  fields:
    milestone_date: Date the delay was recorded.
    revised_ship_date: The new projected ship date.
    delay_cause: >-
      glass_supplier, factory_capacity, weather_freight, customer_hold, late_acknowledgment or customer_spec_remake.
  triggers:
  - event: order:order_ship_date_revised
    when:
      delay_cause:
        not: customer_hold
    map:
      current_ship_date: revised_ship_date
- type: order_ship_date_revised
  target: factory_orders
  mutation: update
  meaning: The order's current projected ship date is changed.
  grain: One row per transaction.
  fields:
    current_ship_date: The new projected ship date.
  triggers: []
- type: order_hold_placed
  target: factory_orders
  mutation:
    transition:
      from: entered
      to: on_hold
  meaning: The customer pauses the order before production starts.
  grain: One row per transaction.
  fields:
    hold_start_date: Date the hold began.
  triggers: []
- type: order_hold_released
  target: factory_orders
  mutation:
    transition:
      from: on_hold
      to: entered
  meaning: The hold ends and the order re-enters the production queue with a new projected ship date.
  grain: One row per transaction.
  fields:
    current_ship_date: The new projected ship date set at release.
  triggers:
  - event: order:order_delay_noticed
    map:
      delay_cause: customer_hold
      revised_ship_date: current_ship_date
- type: order_shipped
  target: factory_orders
  mutation:
    transition:
      from: in_production
      to: shipped
  meaning: The last unit of the order leaves the factory.
  grain: One row per transaction.
  fields:
    ship_date: Date the last unit shipped.
  triggers: []
- type: order_delivered
  target: factory_orders
  mutation:
    transition:
      from: shipped
      to: delivered
  meaning: The order is received at the Ridgeline branch warehouse.
  grain: One row per transaction.
  fields:
    delivered_date: Date of branch delivery.
  triggers:
  - event: install:install_job_opened
    map:
      factory_order_id: factory_order_id
      customer_id: customer_id
      window_contract_id: window_contract_id
      door_contract_id: door_contract_id
      unit_count: unit_count
      opened_date: delivered_date
- type: order_closed
  target: factory_orders
  mutation:
    transition:
      from: delivered
      to: closed
  meaning: The order's units are installed and the order is closed.
  grain: One row per transaction.
  fields:
    closed_date: Date the order was closed.
  triggers: []
- type: order_cancelled
  target: factory_orders
  mutation:
    transition:
    - from: entered
      to: cancelled
    - from: on_hold
      to: cancelled
    - from: in_production
      to: cancelled
  meaning: The order is cancelled after its contract is cancelled.
  grain: One row per transaction.
  fields:
    cancelled_date: Date the order was cancelled.
  triggers: []
- type: order_remake_logged
  target: order_milestones
  meaning: Units of the order are sent back to be rebuilt, with the cause.
  grain: One row per remake of one cause recorded on one date.
  distinguish_by:
  - remake_cause
  - milestone_date
  fields:
    milestone_date: Date the remake was recorded.
    remake_cause: factory_defect, freight_damage, company_mismeasure or customer_spec_error.
    unit_count: Units remade.
  triggers:
  - event: order:order_charge_assessed
    when:
      remake_cause: customer_spec_error
    map:
      charge_kind: remake_charge
      unit_count: unit_count
      milestone_date: milestone_date
- type: order_charge_assessed
  target: order_milestones
  meaning: An order-level charge is billed to the customer.
  grain: One row per charge of one kind assessed on one date.
  distinguish_by:
  - charge_kind
  - milestone_date
  fields:
    milestone_date: Date the charge was assessed (for an expedite fee, the request date).
    amount: Charge amount (positive).
    charge_kind: remake_charge, expedite_fee or storage_fee.
    unit_count: Units the charge is priced on.
    week_count: Billable storage weeks for a storage_fee; 0 otherwise.
  account: order_charges
  direction: in
  triggers: []
- type: order_charge_waived
  target: order_milestones
  meaning: An order-level charge is waived in full, reversing one specific charge.
  grain: One row per charge waived.
  distinguish_by:
  - source_order_milestone_id
  fields:
    milestone_date: Date of the waiver.
    amount: Amount waived (positive), equal to the charge reversed.
    charge_kind: The kind of the charge reversed.
    source_order_milestone_id: The charge record waived.
  account: order_charges
  direction: out
  triggers: []
- type: order_guarantee_credit_earned
  target: order_milestones
  meaning: A late shipment earns on-time guarantee credit.
  grain: One row per order shipment that earns credit.
  distinguish_by:
  - milestone_date
  fields:
    milestone_date: The ship date that earned the credit.
    amount: Credit earned (positive).
    week_count: Full calendar weeks late beyond the grace period.
    unit_count: Units counted for the credit.
  account: guarantee_credits
  direction: in
  triggers:
  - event: order:order_guarantee_credit_applied
    map:
      amount: amount
- type: order_guarantee_credit_applied
  target: order_milestones
  meaning: An earned guarantee credit is moved to the contract the order builds.
  grain: One row per earned credit applied.
  distinguish_by:
  - source_order_milestone_id
  fields:
    milestone_date: Date the credit was applied.
    amount: Amount applied (positive).
    source_order_milestone_id: The guarantee credit record applied.
    window_contract_id: The window contract credited, or empty.
    door_contract_id: The door contract credited, or empty.
  account: guarantee_credits
  direction: out
  triggers:
  - event: window:window_price_credit
    when:
      window_contract_id:
        not: ''
    map:
      credit_kind: on_time_guarantee_credit
      amount: amount
      factory_order_id: factory_order_id
      txn_date: milestone_date
  - event: door:door_price_credit
    when:
      door_contract_id:
        not: ''
    map:
      credit_kind: on_time_guarantee_credit
      amount: amount
      factory_order_id: factory_order_id
      txn_date: milestone_date
measures:
- id: order_msr_holds
  window: Order lifetime up to the moment of handling.
  measure: >-
    Count of order_delay_noticed rows of the order with delay_cause customer_hold (one is recorded at
    every hold release), plus 1 when the order status is on_hold.
- id: order_msr_delay_notices
  window: Order lifetime up to the moment of handling.
  measure: Count of order_delay_noticed rows of the order, all causes.
- id: order_msr_guarantee_benchmark
  window: Order lifetime up to the ship date.
  measure: >-
    The later of the order's committed_ship_date and the latest revised_ship_date among its order_delay_noticed
    rows whose delay_cause is one of the class's excluded causes.
- id: order_msr_remakes
  window: Order lifetime up to and including the remake being handled.
  measure: Count of order_remake_logged rows of the order, all causes.
- id: order_msr_billable_storage_days
  window: >-
    From the day after the branch delivery date to the earlier of the installation start date and the
    handling date.
  measure: >-
    Calendar days in the window minus the class free storage days, minus every day between previous_date
    and new_date of install_reschedule_logged rows of the order's installation job whose initiated_by
    is company or weather; never below zero.
policies:
- id: order_agg_multi_holding
  subject:
  - order_entered
  rule: >-
    A customer holds one factory order for every released contract, so the number of orders a customer
    may hold is not capped by itself; it follows from the contracts. Each order builds exactly one contract,
    a window contract or a door contract, never both. A contract that already has a factory order that
    is not cancelled never gets a second one. Units remade for any cause stay on the original order.
  eligibility:
  - id: one_order_per_contract
    applies_to:
    - order_entered
    kind: dedup
    condition: A contract that already has a factory order that is not cancelled never gets a second one.
    evidence_fields:
    - factory_orders.window_contract_id
    - factory_orders.door_contract_id
    - factory_orders.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.window_contract_id
        - factory_orders.door_contract_id
      action_bindings:
        factory_orders.window_contract_id: window_contract_id
        factory_orders.door_contract_id: door_contract_id
    dedup_contract:
      table: factory_orders
      mode: separate_record
      object_bindings:
        window_contract_id: window_contract_id
        door_contract_id: door_contract_id
      duplicate_filters:
        status:
        - entered
        - on_hold
        - in_production
        - shipped
        - delivered
        - closed
      distinct_fields:
      - order_number
  params:
    max_per_customer: null
- id: order_agg_customer_orders
  subject:
  - order_guarantee_credit_applied
  - order_charge_assessed
  rule: >-
    When a customer holds several factory orders, every limit, charge and credit is figured per order
    and never pooled: guarantee credit caps, storage caps, hold counts and remake counts belong to the
    order they arise on. A guarantee credit is applied only to the contract its own order builds, never
    to another contract of the same customer. An order-level charge is owed on the order that incurred
    it and is never offset against a credit earned on a different order.
  eligibility:
  - id: credit_to_own_contract
    applies_to:
    - order_guarantee_credit_applied
    kind: authorization
    condition: >-
      A guarantee credit is applied only to the contract its own order builds, never to another contract
      of the same customer.
    evidence_fields:
    - factory_orders.factory_order_id
    - factory_orders.window_contract_id
    - factory_orders.door_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
- id: order_build_class
  subject:
  - order_entered
  rule: >-
    An order takes the highest-ranked build class whose listed features it contains; for example a wood-clad
    order with laminated glass is an Architectural Wood Build, and a vinyl order with a single arched
    unit is a Specialty Shape Build. The order is entered within the stated business days after the contract's
    order release. The committed ship date is the order entry date plus the class standard lead time,
    plus the class large-order extension when the unit count exceeds the class large-order threshold,
    counted in business days (Monday through Friday, excluding U.S. federal holidays) starting the day
    after entry. The committed ship date is printed on the acknowledgment and never changes; later delays
    move only the current ship date. An order may not carry more units than the class maximum; a larger
    contract is split by the factory into consecutive orders only by engineering approval, which support
    cannot grant.
  eligibility: []
  params:
    per_tier:
      Custom Size Build:
        lead: =standard_lead_time_business_days
        large_threshold: =large_order_threshold_units
        large_extra: =large_order_extra_business_days
      Custom Color Build:
        lead: =standard_lead_time_business_days
        large_threshold: =large_order_threshold_units
        large_extra: =large_order_extra_business_days
      Specialty Glass Build:
        lead: =standard_lead_time_business_days
        large_threshold: =large_order_threshold_units
        large_extra: =large_order_extra_business_days
      Specialty Shape Build:
        lead: =standard_lead_time_business_days
        large_threshold: =large_order_threshold_units
        large_extra: =large_order_extra_business_days
      Impact-Rated Build:
        lead: =standard_lead_time_business_days
        large_threshold: =large_order_threshold_units
        large_extra: =large_order_extra_business_days
      Architectural Wood Build:
        lead: =standard_lead_time_business_days
        large_threshold: =large_order_threshold_units
        large_extra: =large_order_extra_business_days
    entry_days: =order_entry_business_days_after_release
    max_units: =unit_count_max_per_order
  formula:
    committed_lead_business_days: >-
      standard_lead_time_business_days + (large_order_extra_business_days if unit_count > large_order_threshold_units
      else 0)
- id: order_acknowledgment_and_production
  subject:
  - order_milestone_logged
  - order_production_started
  - order_delay_noticed
  rule: >-
    After entry the factory issues an order acknowledgment listing every unit's size, configuration, color
    and glass, and the customer signs it to confirm the specification; the signature is recorded as the
    acknowledgment_signed checkpoint. An acknowledgment counts as on time only when the customer signs
    it no later than the return window after the order entry date. Business days are counted starting
    the day after the order entry date, Monday through Friday excluding U.S. federal holidays, and a signature
    on the last day of the window is on time. Production can start only after the customer has signed
    the order acknowledgment. In the Specialty Shape Build class production additionally waits for the
    template_received checkpoint. Production starts within the class queue time after the later of those
    checkpoints. When the acknowledgment is signed late, a delay notice with cause late_acknowledgment
    moves the current ship date later by the number of business days the signature came after the window.
    A unit failing the factory quality check is remade as a factory_defect.
  eligibility:
  - id: ack_on_time
    applies_to:
    - order_milestone_logged
    kind: time
    condition: >-
      An acknowledgment counts as on time only when the customer signs it no later than the return window
      after the order entry date.
    evidence_fields:
    - factory_orders.factory_order_id
    - factory_orders.entered_date
    - order_milestones.milestone_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the order entry date
      anchor_source: factory_orders.entered_date
      relation: not_after
      duration_source: variants.acknowledgment_return_business_days
      unit: business_days
      counting_rule: >-
        Business days are counted starting the day after the order entry date, Monday through Friday excluding
        U.S. federal holidays, and a signature on the last day of the window is on time.
      boundary: inclusive
  - id: ack_before_production
    applies_to:
    - order_production_started
    kind: authorization
    condition: Production can start only after the customer has signed the order acknowledgment.
    evidence_fields:
    - factory_orders.factory_order_id
    - order_milestones.milestone_kind
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
  params:
    return_days: =acknowledgment_return_business_days
    queue_days: =production_queue_business_days
    template_required: =shape_template_required
    late_shift: =late_ack_shift_basis
    qc_remake: =qc_failure_remake
- id: order_holds
  subject:
  - order_hold_placed
  - order_hold_released
  - order_delay_noticed
  rule: >-
    A customer may pause an order before production starts, for example while finishing other work in
    the home; once production has started an order cannot be held. A hold can be placed only when the
    order has had fewer holds than the class maximum (order_msr_holds). A hold ends when the customer
    asks for release or, at the latest, when it reaches the class maximum hold length. A hold is released
    no later than the class maximum hold length after the hold start date. Calendar days are counted from
    the day after the hold start date, and release on the last day of the maximum length is still within
    it. At release the current ship date is reset to the release date plus the class standard lead time
    in business days, and a delay notice with cause customer_hold records the new date. A hold earns no
    guarantee credit; its delay notice moves the guarantee benchmark instead. Storage fees never apply
    to a held order, because nothing has been built.
  eligibility:
  - id: hold_count
    applies_to:
    - order_hold_placed
    kind: authorization
    condition: >-
      A hold can be placed only when the order has had fewer holds than the class maximum (order_msr_holds).
    evidence_fields:
    - factory_orders.factory_order_id
    - order_milestones.delay_cause
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
  - id: hold_length
    applies_to:
    - order_hold_released
    kind: time
    condition: A hold is released no later than the class maximum hold length after the hold start date.
    evidence_fields:
    - factory_orders.factory_order_id
    - factory_orders.hold_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold start date
      anchor_source: factory_orders.hold_start_date
      relation: not_after
      duration_source: variants.hold_max_calendar_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the hold start date, and release on the last day
        of the maximum length is still within it.
      boundary: inclusive
  params:
    per_tier:
      Custom Size Build:
        max_holds: =hold_max_count
        max_days: =hold_max_calendar_days
      Custom Color Build:
        max_holds: =hold_max_count
        max_days: =hold_max_calendar_days
      Specialty Glass Build:
        max_holds: =hold_max_count
        max_days: =hold_max_calendar_days
      Specialty Shape Build:
        max_holds: =hold_max_count
        max_days: =hold_max_calendar_days
      Impact-Rated Build:
        max_holds: =hold_max_count
        max_days: =hold_max_calendar_days
      Architectural Wood Build:
        max_holds: =hold_max_count
        max_days: =hold_max_calendar_days
    auto_release: =hold_auto_release
    requote: =hold_requote_basis
  measures:
  - order_msr_holds
- id: order_delays_and_guarantee
  subject:
  - order_delay_noticed
  - order_ship_date_revised
  - order_shipped
  - order_guarantee_credit_earned
  rule: >-
    Every change to the projected ship date is recorded as a delay notice with one cause, and the customer
    is told of it before the ship-notification lead time. When an order already carries the escalation
    number of delay notices (order_msr_delay_notices), a further delay is escalated to the production
    manager and no credit or date promise beyond the recorded notices is made by support. The on-time
    guarantee applies only to classes that carry it. An on-time guarantee credit is earned only by an
    order whose build class carries the guarantee. Lateness is measured from the guarantee benchmark date
    (order_msr_guarantee_benchmark), which is the committed ship date moved later only by delays with
    an excluded cause; delays from glass supply or factory capacity never move it. The order ships when
    its last unit ships. The full calendar weeks late are the calendar days from the benchmark date plus
    the class grace period (in business days) to the ship date, divided by seven and rounded down. When
    at least one full week late results, the order earns, on its ship date, the class credit per unit
    per week times the units on the order (units remade are counted once and earn nothing for their own
    remake time), never more than the class cap per order. Shipping on or before the end of the grace
    period earns nothing.
  eligibility:
  - id: guarantee_class
    applies_to:
    - order_guarantee_credit_earned
    kind: authorization
    condition: >-
      An on-time guarantee credit is earned only by an order whose build class carries the guarantee.
    evidence_fields:
    - factory_orders.factory_order_id
    - factory_orders.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
  params:
    per_tier:
      Custom Size Build:
        eligible: =guarantee_eligible
        grace: =guarantee_grace_business_days
        per_unit_week: =on_time_credit_per_unit_week
        cap: =on_time_credit_cap_per_order
      Custom Color Build:
        eligible: =guarantee_eligible
        grace: =guarantee_grace_business_days
        per_unit_week: =on_time_credit_per_unit_week
        cap: =on_time_credit_cap_per_order
      Specialty Glass Build:
        eligible: =guarantee_eligible
        grace: =guarantee_grace_business_days
        per_unit_week: =on_time_credit_per_unit_week
        cap: =on_time_credit_cap_per_order
      Specialty Shape Build:
        eligible: =guarantee_eligible
        grace: =guarantee_grace_business_days
        per_unit_week: =on_time_credit_per_unit_week
        cap: =on_time_credit_cap_per_order
      Impact-Rated Build:
        eligible: =guarantee_eligible
        grace: =guarantee_grace_business_days
        per_unit_week: =on_time_credit_per_unit_week
        cap: =on_time_credit_cap_per_order
      Architectural Wood Build:
        eligible: =guarantee_eligible
        grace: =guarantee_grace_business_days
        per_unit_week: =on_time_credit_per_unit_week
        cap: =on_time_credit_cap_per_order
    excluded: =guarantee_excluded_causes
    week_basis: =guarantee_week_basis
    remade_units: =remade_units_guaranteed
    ship_basis: =lateness_ship_basis
    escalate_after: =max_delay_notices_before_escalation
    notify_days: =ship_notification_business_days
  formula:
    guarantee_credit: >-
      min(on_time_credit_cap_per_order, round(on_time_credit_per_unit_week * unit_count * week_count,
      2))
  measures:
  - order_msr_guarantee_benchmark
  - order_msr_delay_notices
- id: order_credit_application
  subject:
  - order_guarantee_credit_applied
  rule: >-
    An earned guarantee credit is applied in full to the contract the order builds within the stated business
    days after the ship date, by one credit application that names the earned credit as its source; the
    contract records it as an on_time_guarantee_credit. An earned credit is applied to the contract only
    once. Where the credit exceeds what is owed on the contract, the excess is refunded under that contract's
    refund rules. A credit earned before the contract was cancelled is still applied to the cancelled
    contract's settlement.
  eligibility:
  - id: apply_once
    applies_to:
    - order_guarantee_credit_applied
    kind: dedup
    condition: An earned credit is applied to the contract only once.
    evidence_fields:
    - order_milestones.source_order_milestone_id
    - order_milestones.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - order_milestones.source_order_milestone_id
      action_bindings:
        order_milestones.source_order_milestone_id: source_order_milestone_id
    dedup_contract:
      table: order_milestones
      mode: separate_record
      object_bindings:
        source_order_milestone_id: source_order_milestone_id
      duplicate_filters:
        event_type:
        - order_guarantee_credit_applied
      distinct_fields:
      - milestone_date
  params:
    apply_days: =credit_to_contract_business_days
    application_rule: =credit_application_rule
- id: order_remakes
  subject:
  - order_remake_logged
  - order_charge_assessed
  - order_delay_noticed
  rule: >-
    A remake rebuilds units of an order and its cause decides who pays. Factory defects (including units
    failing quality check), freight damage found by the branch within the delivery inspection window,
    and a Ridgeline mismeasure are company causes and carry no charge. A remake is charged to the customer
    only when its cause is customer_spec_error and the order acknowledgment was signed by the customer.
    Without a signed acknowledgment the specification was never confirmed and the remake is treated as
    a company mismeasure. A customer remake is charged at the class charge per unit times the units remade,
    on the remake date. A remade unit is rebuilt within the class remake lead time from the remake date;
    a customer_spec_error remake that pushes the ship date is recorded as a delay notice with cause customer_spec_remake,
    and a company-cause remake that pushes it is recorded as factory_capacity. An order that already carries
    the maximum number of remakes (order_msr_remakes) is escalated to factory engineering for the next
    one. Where partial shipment is allowed and at least the class minimum share of units has passed quality
    check, the passed units may ship ahead, but the order's ship date for lateness is still the date its
    last unit ships.
  eligibility:
  - id: customer_charge_basis
    applies_to:
    - order_charge_assessed
    kind: authorization
    condition: >-
      A remake is charged to the customer only when its cause is customer_spec_error and the order acknowledgment
      was signed by the customer.
    evidence_fields:
    - factory_orders.factory_order_id
    - order_milestones.remake_cause
    - order_milestones.milestone_kind
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
  params:
    per_tier:
      Custom Size Build:
        charge: =remake_charge_per_unit
        lead: =remake_lead_time_business_days
        partial: =partial_shipment_allowed
        partial_share: =partial_shipment_min_share
      Custom Color Build:
        charge: =remake_charge_per_unit
        lead: =remake_lead_time_business_days
        partial: =partial_shipment_allowed
        partial_share: =partial_shipment_min_share
      Specialty Glass Build:
        charge: =remake_charge_per_unit
        lead: =remake_lead_time_business_days
        partial: =partial_shipment_allowed
        partial_share: =partial_shipment_min_share
      Specialty Shape Build:
        charge: =remake_charge_per_unit
        lead: =remake_lead_time_business_days
        partial: =partial_shipment_allowed
        partial_share: =partial_shipment_min_share
      Impact-Rated Build:
        charge: =remake_charge_per_unit
        lead: =remake_lead_time_business_days
        partial: =partial_shipment_allowed
        partial_share: =partial_shipment_min_share
      Architectural Wood Build:
        charge: =remake_charge_per_unit
        lead: =remake_lead_time_business_days
        partial: =partial_shipment_allowed
        partial_share: =partial_shipment_min_share
    company_free: =company_cause_remake_free
    ack_required: =spec_error_requires_signed_acknowledgment
    max_remakes: =max_remakes_per_order
    inspection_hours: =delivery_inspection_hours
  formula:
    remake_charge: round(remake_charge_per_unit * unit_count, 2)
  measures:
  - order_msr_remakes
- id: order_expedite
  subject:
  - order_charge_assessed
  - order_charge_waived
  - order_delay_noticed
  rule: >-
    In classes where it is available, a customer may buy an expedited build before production starts.
    An expedite can be requested only while the order status is entered. The expedite fee is the class
    fee per unit times the units on the order, never less than the class minimum fee, booked on the request
    date. The expedited target ship date is the request date plus the class expedite lead time in business
    days; it does not change the committed ship date or the guarantee benchmark. When the order ships
    after its expedited target date, the expedite fee is waived in full by a waiver naming the fee as
    its source. An expedite cannot be bought in a class where it is unavailable, and never for a held
    order.
  eligibility:
  - id: expedite_before_production
    applies_to:
    - order_charge_assessed
    kind: authorization
    condition: An expedite can be requested only while the order status is entered.
    evidence_fields:
    - factory_orders.factory_order_id
    - factory_orders.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
  params:
    per_tier:
      Custom Size Build:
        available: =expedite_available
        lead: =expedite_lead_time_business_days
        per_unit: =expedite_fee_per_unit
        minimum: =expedite_min_fee
      Custom Color Build:
        available: =expedite_available
        lead: =expedite_lead_time_business_days
        per_unit: =expedite_fee_per_unit
        minimum: =expedite_min_fee
      Specialty Glass Build:
        available: =expedite_available
        lead: =expedite_lead_time_business_days
        per_unit: =expedite_fee_per_unit
        minimum: =expedite_min_fee
      Specialty Shape Build:
        available: =expedite_available
        lead: =expedite_lead_time_business_days
        per_unit: =expedite_fee_per_unit
        minimum: =expedite_min_fee
      Impact-Rated Build:
        available: =expedite_available
        lead: =expedite_lead_time_business_days
        per_unit: =expedite_fee_per_unit
        minimum: =expedite_min_fee
      Architectural Wood Build:
        available: =expedite_available
        lead: =expedite_lead_time_business_days
        per_unit: =expedite_fee_per_unit
        minimum: =expedite_min_fee
    refund_if_missed: =expedite_fee_refund_if_missed
  formula:
    expedite_fee: max(expedite_min_fee, round(expedite_fee_per_unit * unit_count, 2))
- id: order_storage
  subject:
  - order_charge_assessed
  - order_charge_waived
  - order_delivered
  rule: >-
    Delivered units wait at the branch warehouse until installation. Storage is charged only for days
    after the free storage period counted from the branch delivery date. Calendar days are counted from
    the day after the branch delivery date, and the last free day carries no charge. Billable days (order_msr_billable_storage_days)
    exclude every day of delay caused by an installation reschedule initiated by the company or by weather,
    and stop on the day installation starts or the order is cancelled. Billable days become weeks by counting
    every started seven-day period as a full week, and the fee is the class fee per unit per week times
    the units on the order times the weeks, never more than the class cap per order. Storage is assessed
    once, on the day installation starts or the contract is cancelled. No storage is charged when the
    installation has never been offered to the customer inside the free period.
  eligibility:
  - id: after_free_period
    applies_to:
    - order_charge_assessed
    kind: time
    condition: >-
      Storage is charged only for days after the free storage period counted from the branch delivery
      date.
    evidence_fields:
    - factory_orders.factory_order_id
    - factory_orders.delivered_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the branch delivery date
      anchor_source: factory_orders.delivered_date
      relation: not_before
      duration_source: variants.free_storage_calendar_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the branch delivery date, and the last free day carries
        no charge.
      boundary: exclusive
  params:
    per_tier:
      Custom Size Build:
        free_days: =free_storage_calendar_days
        per_unit_week: =storage_fee_per_unit_week
        cap: =storage_fee_cap_per_order
      Custom Color Build:
        free_days: =free_storage_calendar_days
        per_unit_week: =storage_fee_per_unit_week
        cap: =storage_fee_cap_per_order
      Specialty Glass Build:
        free_days: =free_storage_calendar_days
        per_unit_week: =storage_fee_per_unit_week
        cap: =storage_fee_cap_per_order
      Specialty Shape Build:
        free_days: =free_storage_calendar_days
        per_unit_week: =storage_fee_per_unit_week
        cap: =storage_fee_cap_per_order
      Impact-Rated Build:
        free_days: =free_storage_calendar_days
        per_unit_week: =storage_fee_per_unit_week
        cap: =storage_fee_cap_per_order
      Architectural Wood Build:
        free_days: =free_storage_calendar_days
        per_unit_week: =storage_fee_per_unit_week
        cap: =storage_fee_cap_per_order
    rounding: =storage_week_rounding
    excludes_company_delays: =storage_excludes_company_delays
    job_open_days: =install_job_open_business_days
  formula:
    storage_fee: >-
      min(storage_fee_cap_per_order, round(storage_fee_per_unit_week * unit_count * week_count, 2))
  measures:
  - order_msr_billable_storage_days
- id: order_shipping_and_closure
  subject:
  - order_shipped
  - order_delivered
  - order_closed
  rule: >-
    The order ships when its last unit leaves the factory and is expected at the branch within the class
    transit time. The branch inspects delivered units within the inspection window; freight damage found
    in that window is remade as freight_damage at no charge. Branch delivery opens the installation job
    for the order. The order closes when the installation job for its contract is completed. An order
    that has shipped cannot be cancelled; if its contract is cancelled after shipment the units stay on
    the order and the contract's cancellation terms carry their cost.
  eligibility: []
  params:
    per_tier:
      Custom Size Build:
        transit: =transit_business_days
      Custom Color Build:
        transit: =transit_business_days
      Specialty Glass Build:
        transit: =transit_business_days
      Specialty Shape Build:
        transit: =transit_business_days
      Impact-Rated Build:
        transit: =transit_business_days
      Architectural Wood Build:
        transit: =transit_business_days
    inspection_hours: =delivery_inspection_hours
    post_ship_cancel: =post_ship_cancellation_allowed
- id: order_cancellation
  subject:
  - order_cancelled
  rule: >-
    A factory order is never cancelled on its own; it follows its contract. An order is cancelled only
    after its contract has been cancelled. An order that is entered or on hold is cancelled with nothing
    built; an order in production is stopped and the partly built units are scrapped; in both cases the
    contract's cancellation terms decide what the customer owes, and the order adds no charge of its own
    beyond an expedite fee already booked. A shipped or delivered order cannot be cancelled.
  eligibility:
  - id: contract_cancelled_first
    applies_to:
    - order_cancelled
    kind: authorization
    condition: An order is cancelled only after its contract has been cancelled.
    evidence_fields:
    - factory_orders.factory_order_id
    - window_contracts.status
    - door_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - factory_orders.factory_order_id
      action_bindings:
        factory_orders.factory_order_id: factory_order_id
  params:
    in_production: =cancel_in_production_allowed
