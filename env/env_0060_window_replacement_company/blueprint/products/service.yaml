events:
- type: service_plan_enrolled
  target: service_plans
  mutation: create
  meaning: A customer opens a service account or enrolls in a CareLine plan for the service address.
  grain: One row per plan.
  fields:
    customer_id: The plan holder.
    variant_name: The plan, as its official name.
    plan_number: The plan number.
    enrolled_date: First day of the first term.
    term_start_date: First day of the current term (the enrolled date for a new plan).
    term_end_date: Last day of the first term.
    covered_openings: Openings and door units enrolled.
    auto_renew: Whether the plan renews automatically.
  triggers: []
- type: service_visit_logged
  target: service_calls
  meaning: A service visit at the home is recorded with its kind and outcome.
  grain: One row per visit of one kind on one date.
  distinguish_by:
  - call_kind
  - call_date
  fields:
    call_date: Date of the visit.
    call_kind: annual_tune_up, repair_visit, glass_replacement or emergency_boardup.
    visit_outcome: completed, return_needed or customer_no_show.
    openings_serviced: Openings worked on.
    labor_hours: Hours on site.
    plan_year: Plan year of the visit.
  triggers: []
- type: service_charge_assessed
  target: service_calls
  meaning: A plan fee or a visit charge is billed to the plan holder.
  grain: One row per charge of one kind on one date.
  distinguish_by:
  - charge_kind
  - call_date
  fields:
    call_date: Date of the charge.
    amount: Charge (positive).
    charge_kind: plan_fee, trip_fee, labor_charge, parts_charge, emergency_surcharge or no_show_fee.
    openings_serviced: Openings or units priced.
    labor_hours: Billable labor hours for a labor charge.
    plan_year: Plan year charged.
  account: service_charges
  direction: in
  triggers: []
- type: service_credit_issued
  target: service_calls
  meaning: A charge is waived or a plan fee is refunded, naming the charge it concerns.
  grain: One row per credit for one source charge.
  distinguish_by:
  - credit_kind
  - source_service_call_id
  fields:
    call_date: Date of the credit.
    amount: Credit (positive).
    credit_kind: fee_waiver or cancellation_refund.
    source_service_call_id: The charge waived or the plan fee refunded.
    plan_year: Plan year credited.
  account: service_charges
  direction: out
  triggers: []
- type: service_plan_renewed
  target: service_plans
  mutation: update
  meaning: The plan rolls into a new term.
  grain: One row per transaction.
  fields:
    term_start_date: First day of the new term.
    term_end_date: Last day of the new term.
  triggers: []
- type: service_auto_renew_changed
  target: service_plans
  mutation: update
  meaning: Automatic renewal is turned on or off by the plan holder.
  grain: One row per transaction.
  fields:
    auto_renew: The new setting.
  triggers: []
- type: service_openings_changed
  target: service_plans
  mutation: update
  meaning: The number of covered openings changes mid-term.
  grain: One row per transaction.
  fields:
    covered_openings: The new count.
  triggers: []
- type: service_plan_past_due
  target: service_plans
  mutation:
    transition:
      from: active
      to: past_due
  meaning: The renewal fee is unpaid after renewal.
  grain: One row per transaction.
  fields:
    status: past_due.
  triggers: []
- type: service_plan_reinstated
  target: service_plans
  mutation:
    transition:
      from: past_due
      to: active
  meaning: The renewal fee is paid within the grace period.
  grain: One row per transaction.
  fields:
    status: active.
  triggers: []
- type: service_plan_cancelled
  target: service_plans
  mutation:
    transition:
    - from: active
      to: cancelled
    - from: past_due
      to: cancelled
  meaning: The plan holder cancels the plan.
  grain: One row per transaction.
  fields:
    cancelled_date: Date of cancellation.
  triggers: []
- type: service_plan_expired
  target: service_plans
  mutation:
    transition:
    - from: active
      to: expired
    - from: past_due
      to: expired
  meaning: The plan ends without renewal or after an unpaid grace period.
  grain: One row per transaction.
  fields:
    ended_date: Date the plan ended.
  triggers: []
measures:
- id: service_msr_tune_ups_used
  window: Current plan year.
  measure: >-
    Count of service_visit_logged rows of the plan with call_kind annual_tune_up and visit_outcome completed.
- id: service_msr_free_trips_used
  window: Current plan year.
  measure: >-
    Count of service_visit_logged rows of the plan with call_kind repair_visit, glass_replacement or emergency_boardup
    and visit_outcome other than customer_no_show, after the waiting period, that carried no trip_fee
    charge on the same date.
- id: service_msr_no_shows
  window: Current plan year, up to and including the visit being handled.
  measure: Count of service_visit_logged rows of the plan with visit_outcome customer_no_show.
- id: service_msr_visits_in_term
  window: Current term.
  measure: Count of service_visit_logged rows of the plan in the current term, any kind and outcome.
- id: service_msr_consecutive_years
  window: From the enrolled date to the renewal being handled.
  measure: Whole plan years the plan has been held without lapsing into expired or cancelled.
policies:
- id: service_agg_multi_holding
  subject:
  - service_plan_enrolled
  rule: >-
    A plan covers one service address, and each customer profile has one service address, so a customer
    holds one service account or plan at a time. A new plan can be opened only when the customer holds
    no plan that is active or past_due; to move to another plan, the holder cancels the current one first.
  eligibility:
  - id: one_plan
    applies_to:
    - service_plan_enrolled
    kind: dedup
    condition: >-
      A new plan can be opened only when the customer holds no plan that is active or past_due; to move
      to another plan, the holder cancels the current one first.
    evidence_fields:
    - service_plans.customer_id
    - service_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_plans.customer_id
      action_bindings:
        service_plans.customer_id: customer_id
    dedup_contract:
      table: service_plans
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - active
        - past_due
      distinct_fields:
      - plan_number
  params:
    max_per_customer: 1
- id: service_enrollment_pricing
  subject:
  - service_plan_enrolled
  - service_charge_assessed
  rule: >-
    The plan fee for a term is billed in advance on the first day of the term as one plan_fee charge.
    It is the plan's fee per term plus, for each covered opening above the base count, the yearly extra-opening
    fee for every plan year of the term. A plan cannot cover more than its maximum openings, and the service
    address must lie within the service radius of a Ridgeline branch. A customer whose Ridgeline window
    or door installation was completed within the new-customer window before the enrolled date receives
    the plan's new-customer discount on the first term's fee. The new-customer discount applies only when
    a Ridgeline installation completion date falls within the new-customer window before the enrolled
    date. Calendar days are counted from the day after the installation completion date, and enrolling
    on the last day of the window still qualifies. Discounts apply to the plan fee only, never to visit
    charges, and the new-customer and loyalty discounts never apply to the same term. Amounts are rounded
    to the cent.
  eligibility:
  - id: new_customer
    applies_to:
    - service_charge_assessed
    kind: time
    condition: >-
      The new-customer discount applies only when a Ridgeline installation completion date falls within
      the new-customer window before the enrolled date.
    evidence_fields:
    - service_plans.service_plan_id
    - window_contracts.completion_date
    - door_contracts.completion_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_plans.service_plan_id
      action_bindings:
        service_plans.service_plan_id: service_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: a Ridgeline installation completion date
      anchor_source: window_contracts.completion_date
      relation: not_after
      duration_source: variants.new_customer_window_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the installation completion date, and enrolling on
        the last day of the window still qualifies.
      boundary: inclusive
  params:
    per_tier:
      On-Call Service Account:
        fee: =plan_fee_per_term
        base: =base_covered_openings
        max: =max_covered_openings
        extra: =extra_opening_fee_per_year
        new_customer: =new_customer_first_term_discount_pct
        term: =term_months
      CareLine Basic Plan:
        fee: =plan_fee_per_term
        base: =base_covered_openings
        max: =max_covered_openings
        extra: =extra_opening_fee_per_year
        new_customer: =new_customer_first_term_discount_pct
        term: =term_months
      CareLine Plus Plan:
        fee: =plan_fee_per_term
        base: =base_covered_openings
        max: =max_covered_openings
        extra: =extra_opening_fee_per_year
        new_customer: =new_customer_first_term_discount_pct
        term: =term_months
      CareLine Premier Plan:
        fee: =plan_fee_per_term
        base: =base_covered_openings
        max: =max_covered_openings
        extra: =extra_opening_fee_per_year
        new_customer: =new_customer_first_term_discount_pct
        term: =term_months
      CareLine Premier 3-Year Plan:
        fee: =plan_fee_per_term
        base: =base_covered_openings
        max: =max_covered_openings
        extra: =extra_opening_fee_per_year
        new_customer: =new_customer_first_term_discount_pct
        term: =term_months
      CareLine Estate Plan:
        fee: =plan_fee_per_term
        base: =base_covered_openings
        max: =max_covered_openings
        extra: =extra_opening_fee_per_year
        new_customer: =new_customer_first_term_discount_pct
        term: =term_months
    window_days: =new_customer_window_days
    stacking: =discount_stacking_rule
    radius: =service_radius_miles
    billing: =plan_fee_billing
    year_basis: =plan_year_basis
  formula:
    first_term_fee_new_customer: round(plan_fee_per_term * (1 - new_customer_first_term_discount_pct),
      2)
- id: service_visits_and_charges
  subject:
  - service_visit_logged
  - service_charge_assessed
  rule: >-
    Tune-up visits are included up to the plan's count per plan year, cover the plan's tune-up scope,
    and do not carry over (service_msr_tune_ups_used); a tune-up beyond the count is billed as a repair
    visit. A repair or glass visit is offered within the plan's response window and carries one trip fee
    per visit however many openings are worked on, except that the plan's free trips per plan year (service_msr_free_trips_used)
    carry none. Labor is billed at the plan's hourly rate for the billable hours, which are the hours
    on site with the minimum applied and any time beyond it rounded up to the billing increment; parts
    carry the plan's discount off the published parts price. Glass replacement outside warranty is billed
    at the plan's flat charge per sealed unit, weatherstripping and rescreening per opening or screen,
    and caulk resealing per opening. Plan repair benefits (free trips, the parts discount, and included
    weatherstripping and rescreening) apply only after the waiting period counted from the enrolled date;
    before it the On-Call rates apply to repairs. Calendar days are counted from the day after the enrolled
    date, and benefits begin on the day after the last waiting day. Parts are not supplied for windows
    or doors of other makers, so only labor is offered on them.
  eligibility:
  - id: waiting_period
    applies_to:
    - service_charge_assessed
    kind: time
    condition: >-
      Plan repair benefits (free trips, the parts discount, and included weatherstripping and rescreening)
      apply only after the waiting period counted from the enrolled date; before it the On-Call rates
      apply to repairs.
    evidence_fields:
    - service_plans.service_plan_id
    - service_plans.enrolled_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_plans.service_plan_id
      action_bindings:
        service_plans.service_plan_id: service_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrolled date
      anchor_source: service_plans.enrolled_date
      relation: not_before
      duration_source: variants.waiting_period_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the enrolled date, and benefits begin on the day
        after the last waiting day.
      boundary: exclusive
  params:
    per_tier:
      On-Call Service Account:
        tune_ups: =tune_up_visits_per_year
        scope: =tune_up_scope
        trip: =trip_fee
        free_trips: =free_trip_visits_per_year
        rate: =labor_rate_per_hour
        parts_discount: =parts_discount_pct
        glass: =glass_replacement_per_unit
        weatherstrip: =weatherstrip_replacement_per_opening
        rescreen: =rescreen_per_screen
        caulk: =caulk_reseal_per_opening
        response: =response_business_days
        waiting: =waiting_period_days
        glass_lead: =glass_replacement_lead_business_days
      CareLine Basic Plan:
        tune_ups: =tune_up_visits_per_year
        scope: =tune_up_scope
        trip: =trip_fee
        free_trips: =free_trip_visits_per_year
        rate: =labor_rate_per_hour
        parts_discount: =parts_discount_pct
        glass: =glass_replacement_per_unit
        weatherstrip: =weatherstrip_replacement_per_opening
        rescreen: =rescreen_per_screen
        caulk: =caulk_reseal_per_opening
        response: =response_business_days
        waiting: =waiting_period_days
        glass_lead: =glass_replacement_lead_business_days
      CareLine Plus Plan:
        tune_ups: =tune_up_visits_per_year
        scope: =tune_up_scope
        trip: =trip_fee
        free_trips: =free_trip_visits_per_year
        rate: =labor_rate_per_hour
        parts_discount: =parts_discount_pct
        glass: =glass_replacement_per_unit
        weatherstrip: =weatherstrip_replacement_per_opening
        rescreen: =rescreen_per_screen
        caulk: =caulk_reseal_per_opening
        response: =response_business_days
        waiting: =waiting_period_days
        glass_lead: =glass_replacement_lead_business_days
      CareLine Premier Plan:
        tune_ups: =tune_up_visits_per_year
        scope: =tune_up_scope
        trip: =trip_fee
        free_trips: =free_trip_visits_per_year
        rate: =labor_rate_per_hour
        parts_discount: =parts_discount_pct
        glass: =glass_replacement_per_unit
        weatherstrip: =weatherstrip_replacement_per_opening
        rescreen: =rescreen_per_screen
        caulk: =caulk_reseal_per_opening
        response: =response_business_days
        waiting: =waiting_period_days
        glass_lead: =glass_replacement_lead_business_days
      CareLine Premier 3-Year Plan:
        tune_ups: =tune_up_visits_per_year
        scope: =tune_up_scope
        trip: =trip_fee
        free_trips: =free_trip_visits_per_year
        rate: =labor_rate_per_hour
        parts_discount: =parts_discount_pct
        glass: =glass_replacement_per_unit
        weatherstrip: =weatherstrip_replacement_per_opening
        rescreen: =rescreen_per_screen
        caulk: =caulk_reseal_per_opening
        response: =response_business_days
        waiting: =waiting_period_days
        glass_lead: =glass_replacement_lead_business_days
      CareLine Estate Plan:
        tune_ups: =tune_up_visits_per_year
        scope: =tune_up_scope
        trip: =trip_fee
        free_trips: =free_trip_visits_per_year
        rate: =labor_rate_per_hour
        parts_discount: =parts_discount_pct
        glass: =glass_replacement_per_unit
        weatherstrip: =weatherstrip_replacement_per_opening
        rescreen: =rescreen_per_screen
        caulk: =caulk_reseal_per_opening
        response: =response_business_days
        waiting: =waiting_period_days
        glass_lead: =glass_replacement_lead_business_days
    min_hours: =labor_min_hours
    increment: =labor_increment_hours
    carryover: =tune_up_carryover
    other_brands: =other_brand_parts_supported
    one_trip: =one_trip_per_visit
    window_hours: =visit_window_hours
  formula:
    labor_charge: round(labor_rate_per_hour * max(labor_min_hours, labor_hours), 2)
  measures:
  - service_msr_tune_ups_used
  - service_msr_free_trips_used
- id: service_emergency_boardup
  subject:
  - service_visit_logged
  - service_charge_assessed
  rule: >-
    An emergency board-up secures a broken opening until the glass can be replaced. The crew arrives within
    the plan's emergency response time, and the visit carries the trip fee (unless a free trip applies)
    plus the plan's emergency surcharge. When the breakage is covered by an active Ridgeline warranty
    plan that includes board-up, the board-up is handled under the warranty and the plan bills nothing
    for it.
  eligibility: []
  params:
    per_tier:
      On-Call Service Account:
        surcharge: =emergency_surcharge
        response_hours: =emergency_response_hours
      CareLine Basic Plan:
        surcharge: =emergency_surcharge
        response_hours: =emergency_response_hours
      CareLine Plus Plan:
        surcharge: =emergency_surcharge
        response_hours: =emergency_response_hours
      CareLine Premier Plan:
        surcharge: =emergency_surcharge
        response_hours: =emergency_response_hours
      CareLine Premier 3-Year Plan:
        surcharge: =emergency_surcharge
        response_hours: =emergency_response_hours
      CareLine Estate Plan:
        surcharge: =emergency_surcharge
        response_hours: =emergency_response_hours
    available: =emergency_boardup_available
- id: service_warranty_coordination
  subject:
  - service_visit_logged
  - service_charge_assessed
  rule: >-
    A plan and a Ridgeline warranty never pay for the same repair. A repair to a component that is inside
    the terms of an active Ridgeline warranty registration for the home is handled as a warranty claim,
    and the plan bills no trip, labor or parts charge for it. A plan visit is billed only for work no
    active warranty term covers. Work the warranty declines, or the parts of a warranty approval outside
    its labor term, may then be done as a plan visit at plan rates.
  eligibility:
  - id: not_under_warranty
    applies_to:
    - service_charge_assessed
    kind: authorization
    condition: A plan visit is billed only for work no active warranty term covers.
    evidence_fields:
    - service_plans.customer_id
    - warranty_registrations.status
    - warranty_registrations.coverage_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_plans.customer_id
      action_bindings:
        service_plans.customer_id: customer_id
  params:
    warranty_first: =warranty_first
- id: service_no_shows
  subject:
  - service_charge_assessed
  rule: >-
    A visit where nobody gives the technician access within the wait time is a no-show. The no-shows of
    a plan year up to the plan's free count (service_msr_no_shows) carry no fee, and each later one carries
    the plan's no-show fee on the visit date. A no-show never uses a tune-up or a free trip.
  eligibility: []
  params:
    per_tier:
      On-Call Service Account:
        fee: =no_show_fee
        free: =free_no_show_count
      CareLine Basic Plan:
        fee: =no_show_fee
        free: =free_no_show_count
      CareLine Plus Plan:
        fee: =no_show_fee
        free: =free_no_show_count
      CareLine Premier Plan:
        fee: =no_show_fee
        free: =free_no_show_count
      CareLine Premier 3-Year Plan:
        fee: =no_show_fee
        free: =free_no_show_count
      CareLine Estate Plan:
        fee: =no_show_fee
        free: =free_no_show_count
    wait: =no_show_wait_minutes
  measures:
  - service_msr_no_shows
- id: service_renewal
  subject:
  - service_plan_renewed
  - service_auto_renew_changed
  - service_plan_past_due
  - service_plan_reinstated
  - service_plan_expired
  - service_charge_assessed
  rule: >-
    A plan set to renew automatically rolls into a new term the day after its term end date, and the renewal
    fee is billed that day; the holder is told of the renewal and its fee by the renewal notice date.
    The renewal fee is the plan's current fee per term, never more than the renewal increase cap above
    the fee the holder last paid for a term before discounts. A plan held for at least the loyalty threshold
    of consecutive plan years (service_msr_consecutive_years) receives the plan's loyalty discount on
    the renewal fee. A renewal fee unpaid on the renewal date makes the plan past_due; paid within the
    grace period it returns to active, and unpaid at the end of the grace period the plan expires. A plan
    not set to renew expires at its term end date. The holder may turn automatic renewal on or off at
    any time before the term end date.
  eligibility: []
  params:
    per_tier:
      On-Call Service Account:
        loyalty: =loyalty_renewal_discount_pct
        default_renew: =auto_renew_default
      CareLine Basic Plan:
        loyalty: =loyalty_renewal_discount_pct
        default_renew: =auto_renew_default
      CareLine Plus Plan:
        loyalty: =loyalty_renewal_discount_pct
        default_renew: =auto_renew_default
      CareLine Premier Plan:
        loyalty: =loyalty_renewal_discount_pct
        default_renew: =auto_renew_default
      CareLine Premier 3-Year Plan:
        loyalty: =loyalty_renewal_discount_pct
        default_renew: =auto_renew_default
      CareLine Estate Plan:
        loyalty: =loyalty_renewal_discount_pct
        default_renew: =auto_renew_default
    loyalty_years: =loyalty_years
    increase_cap: =renewal_increase_cap_pct
    notice_days: =renewal_notice_days
    grace_days: =renewal_grace_days
  measures:
  - service_msr_consecutive_years
- id: service_cancellation
  subject:
  - service_plan_cancelled
  - service_credit_issued
  rule: >-
    The holder may cancel a plan at any time. A cancellation within the free-look period of the current
    term, when no visit was used in that term (service_msr_visits_in_term), refunds that term's plan fee
    in full. A full refund applies only when the plan is cancelled within the free-look period counted
    from the start of the current term. Calendar days are counted from the day after the term start date,
    and a cancellation on the last free-look day still qualifies. Any other cancellation refunds the term's
    plan fee times the full months remaining in the term over the months in the term, minus the plan's
    cancellation fee, never below zero. The refund names the plan fee charge it returns. Visit charges
    are never refunded on cancellation.
  eligibility:
  - id: free_look
    applies_to:
    - service_credit_issued
    kind: time
    condition: >-
      A full refund applies only when the plan is cancelled within the free-look period counted from the
      start of the current term.
    evidence_fields:
    - service_plans.service_plan_id
    - service_plans.term_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_plans.service_plan_id
      action_bindings:
        service_plans.service_plan_id: service_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the start of the current term
      anchor_source: service_plans.term_start_date
      relation: not_after
      duration_source: variants.free_look_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the term start date, and a cancellation on the last
        free-look day still qualifies.
      boundary: inclusive
  params:
    per_tier:
      On-Call Service Account:
        fee: =cancellation_fee
      CareLine Basic Plan:
        fee: =cancellation_fee
      CareLine Plus Plan:
        fee: =cancellation_fee
      CareLine Premier Plan:
        fee: =cancellation_fee
      CareLine Premier 3-Year Plan:
        fee: =cancellation_fee
      CareLine Estate Plan:
        fee: =cancellation_fee
    free_look: =free_look_days
    basis: =cancellation_refund_basis
  measures:
  - service_msr_visits_in_term
- id: service_credits
  subject:
  - service_credit_issued
  rule: >-
    A fee waiver reverses one specific charge in full when the records show it was not owed under these
    terms, such as a trip fee on a visit that should have used a free trip, or a no-show fee on a visit
    Ridgeline itself rescheduled. A charge is waived or refunded at most once. Charges correctly assessed
    are not waived by support as a courtesy.
  eligibility:
  - id: credit_once
    applies_to:
    - service_credit_issued
    kind: dedup
    condition: A charge is waived or refunded at most once.
    evidence_fields:
    - service_calls.source_service_call_id
    - service_calls.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - service_calls.source_service_call_id
      action_bindings:
        service_calls.source_service_call_id: source_service_call_id
    dedup_contract:
      table: service_calls
      mode: separate_record
      object_bindings:
        source_service_call_id: source_service_call_id
      duplicate_filters:
        event_type:
        - service_credit_issued
      distinct_fields:
      - call_date
- id: service_openings_change
  subject:
  - service_openings_changed
  - service_charge_assessed
  rule: >-
    The holder may change the number of covered openings during a term, within the plan's maximum. Openings
    added above the base count are billed at the yearly extra-opening fee prorated over the full months
    left in the current plan year, as a plan_fee charge on the change date. Removing openings mid-term
    refunds nothing; the lower count applies to the next renewal.
  eligibility: []
  params:
    proration: =openings_change_proration
