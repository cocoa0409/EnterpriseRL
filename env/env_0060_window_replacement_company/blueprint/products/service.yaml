category: service
display_name: CareLine Service Plans
binding:
  holding_table: service_plans
  event_tables:
  - service_calls
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - active
  - past_due
  - cancelled
  - expired
  transitions:
  - from: active
    to: past_due
    by: system
    means: The plan renewed but the renewal plan fee is unpaid.
  - from: past_due
    to: active
    by: system
    means: The renewal plan fee is paid within the renewal grace period.
  - from: past_due
    to: expired
    by: system
    means: The renewal grace period ends with the plan fee unpaid.
  - from: active
    to: expired
    by: system
    means: The term ends on a plan that does not renew automatically.
  - from: active
    to: cancelled
    by: user
    means: The plan holder cancels the plan.
  - from: past_due
    to: cancelled
    by: user
    means: The plan holder cancels a plan whose renewal fee is unpaid.
accounts:
- key: service_charges
  unit: USD
  meaning: >-
    Amounts billed to the plan holder (plan fees, trip fees, labor, parts, surcharges and no-show fees),
    net of credits, waivers and refunds.
parameter_schema:
  term_months: Length of one plan term (months).
  plan_fee_per_term: Plan fee billed in advance for each term; 0.00 for the pay-per-visit account (USD).
  base_covered_openings: Window openings and door units covered by the plan fee (count).
  max_covered_openings: Most openings and door units the plan can cover (count).
  extra_opening_fee_per_year: >-
    Yearly fee per covered opening above the base count; 0.00 where extra openings are not offered (USD).
  openings_change_proration: >-
    How a mid-term change in covered openings is billed: remaining_full_months prorates the yearly extra-opening
    fee over the full months left in the plan year (enumeration).
  tune_up_visits_per_year: Annual tune-up visits included per plan year (count).
  tune_up_scope: Work included in a tune-up visit (list).
  tune_up_carryover: Whether unused tune-ups carry into the next plan year (boolean).
  trip_fee: >-
    Trip fee per repair or glass visit, charged once per visit however many openings are worked on (USD).
  free_trip_visits_per_year: Repair or glass visits per plan year with the trip fee waived (count).
  labor_rate_per_hour: Hourly labor rate for repair work (USD).
  labor_min_hours: Minimum billable labor per repair visit (hours).
  labor_increment_hours: Billable labor beyond the minimum is rounded up to this increment (hours).
  parts_discount_pct: Discount on the published parts price for parts used in a repair (decimal fraction).
  glass_replacement_per_unit: >-
    Flat charge per sealed glass unit replaced outside warranty, parts and labor included (USD).
  glass_replacement_lead_business_days: Business days from order to installed replacement glass (days).
  weatherstrip_replacement_per_opening: Charge per opening to replace weatherstripping; 0.00 where included
    (USD).
  rescreen_per_screen: Charge per screen to replace screen mesh; 0.00 where included (USD).
  caulk_reseal_per_opening: Charge per opening to remove and replace exterior caulk (USD).
  response_business_days: Business days after a repair request within which a visit is offered (days).
  emergency_boardup_available: Whether emergency board-up of a broken opening is available (boolean).
  emergency_surcharge: Surcharge for an emergency board-up visit on top of the trip fee (USD).
  emergency_response_hours: Hours after the call within which an emergency board-up crew arrives (hours).
  visit_window_hours: Length of the technician arrival window (hours).
  no_show_wait_minutes: Minutes the technician waits for access before a visit counts as a no-show (minutes).
  no_show_fee: Fee for a no-show visit beyond the free count (USD).
  free_no_show_count: No-show visits per plan year without a fee (count).
  waiting_period_days: >-
    Calendar days after the enrolled date before plan repair benefits (free trips, parts discount, included
    weatherstrip and rescreen) apply; tune-ups are available at once (days).
  warranty_first: >-
    Whether a repair to a component inside an active Ridgeline warranty's terms is handled under the warranty
    instead of the plan (boolean).
  other_brand_parts_supported: >-
    Whether parts are supplied for windows and doors not made by Ridgeline; when false only labor is offered
    on them (boolean).
  covered_property: 'Which home a plan covers: service_address_only (enumeration).'
  service_radius_miles: Largest distance from the nearest Ridgeline branch the service address may lie
    (miles).
  plan_year_basis: >-
    How plan years are counted: enrolled_date_anniversary starts each plan year on the anniversary of
    the enrolled date (enumeration).
  plan_fee_billing: 'When the plan fee is billed: in_advance_each_term (enumeration).'
  new_customer_first_term_discount_pct: >-
    Discount on the first term's plan fee for a customer whose Ridgeline installation was completed within
    the new-customer window (decimal fraction).
  new_customer_window_days: >-
    Calendar days after a Ridgeline installation completion date within which enrolling earns the new-customer
    discount (days).
  loyalty_renewal_discount_pct: >-
    Discount on a renewal plan fee once the plan has been held for the loyalty threshold of consecutive
    years (decimal fraction).
  loyalty_years: Consecutive plan years held before the loyalty renewal discount applies (years).
  renewal_increase_cap_pct: >-
    Most a renewal plan fee can rise above the fee the holder last paid for a term, before discounts (decimal
    fraction).
  auto_renew_default: Whether a new plan is set to renew automatically (boolean).
  renewal_notice_days: >-
    Calendar days before the term end date by which the holder is told of the coming renewal and its fee
    (days).
  renewal_grace_days: >-
    Calendar days after renewal within which an unpaid renewal fee may be paid before the plan expires
    (days).
  free_look_days: >-
    Calendar days after the start of a term within which the plan can be cancelled for a full refund of
    that term's fee if no visit was used in it (days).
  cancellation_fee: >-
    Fee deducted from a prorated refund when a plan is cancelled after the free-look period (USD).
  cancellation_refund_basis: >-
    How the refund on a later cancellation is figured: unused_full_months refunds the term fee times full
    months remaining over months in the term (enumeration).
  discount_stacking_rule: >-
    How plan fee discounts combine: never_combined means at most one of the new-customer and loyalty discounts
    applies to a term (enumeration).
  one_trip_per_visit: Whether one trip fee covers every opening worked on during one visit (boolean).
