        ship_days: =parts_ship_business_days
        shipping: =parts_shipping_fee
      Ridgeline Owner-to-Owner Lifetime Warranty:
        rate: =labor_rate_per_hour
        trip_out_of_term: =trip_charge_out_of_labor_term
        trip_no_defect: =trip_charge_no_defect
        no_show: =no_show_fee
        free_no_shows: =free_no_show_count
        visit_days: =service_visit_business_days
        ship_days: =parts_ship_business_days
        shipping: =parts_shipping_fee
    min_hours: =labor_min_hours
    increment: =labor_billing_increment_hours
    wait_minutes: =no_show_wait_minutes
    window_hours: =service_visit_window_hours
    substitute: =discontinued_part_substitute
    color: =replacement_color_basis
  formula:
    labor_charge: round(labor_rate_per_hour * max(labor_min_hours, labor_hours), 2)
  measures:
