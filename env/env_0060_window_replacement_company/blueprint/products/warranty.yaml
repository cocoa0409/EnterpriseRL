category: warranty
display_name: Warranty Coverage
binding:
  holding_table: warranty_registrations
  event_tables:
  - warranty_activities
  intake_tables:
  - warranty_claims
  - warranty_transfer_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - active
  - transfer_pending
  - transferred
  - expired
  - voided
  transitions:
  - from: active
    to: transfer_pending
    by: user
    means: >-
      The registered owner, selling the home, asks for the coverage to be transferred to the buyer.
  - from: transfer_pending
    to: active
    by: agent
    means: >-
      A pending transfer is withdrawn or cannot be completed, and the seller's coverage continues.
  - from: transfer_pending
    to: transferred
    by: system
    means: The transfer is completed and a new registration is issued to the buyer.
  - from: active
    to: expired
    by: system
    means: Every coverage term of the registration has ended.
  - from: active
    to: voided
    by: system
    means: Coverage is voided because a void cause is recorded for the covered units.
accounts:
- key: warranty_charges
  unit: USD
  meaning: >-
    Charges owed by the registered owner under the warranty terms (labor and trip charges outside coverage,
    deductibles, prorated shares, shipping, transfer fees), net of reversals.
parameter_schema:
  frame_sash_term_years: >-
    Coverage term for frames and sashes against defects in material and workmanship, in years from the
    coverage start date, or lifetime (years or the word lifetime).
  insulated_glass_term_years: >-
    Coverage term for insulated glass seal failure, in years from the coverage start date, or lifetime
    (years or the word lifetime).
  hardware_term_years: Coverage term for locks, handles, balances and operators (years or the word lifetime).
  screen_term_years: Coverage term for screens and screen frames (years).
  weatherstrip_term_years: Coverage term for weatherstripping (years).
  exterior_finish_term_years: >-
    Coverage term for exterior color finish against peeling, blistering and fading beyond the published
    color-change limit (years).
  labor_term_years: >-
    Term during which Ridgeline labor to repair or replace a covered part is included (years or the word
    lifetime).
  workmanship_term_years: >-
    Coverage term for installation workmanship (leaks, sealing, trim and fastening by the Ridgeline crew)
    (years or the word lifetime).
  lifetime_definition: Meaning of a lifetime term (text).
  coverage_start_basis: 'The date every term is counted from: installation_completion_date (enumeration).'
  term_counting_basis: >-
    How a term in years is counted: anniversary_exclusive means coverage runs through the day before the
    anniversary that ends the term (enumeration).
  non_owner_occupied_term_cap_years: >-
    Cap on every term, lifetime included, while the home is used as a rental property, counted from the
    coverage start date (years).
  glass_breakage_covered: Whether accidental glass breakage is covered (boolean).
  glass_breakage_term_years: Coverage term for accidental glass breakage; 0 where not covered (years).
  glass_breakage_deductible: Deductible per approved glass breakage claim; 0.00 where not covered (USD).
  glass_breakage_claims_per_year: >-
    Approved glass breakage claims allowed per registration in any rolling 365 days; 0 where not covered
    (count).
  glass_breakage_boardup_included: >-
    Whether emergency board-up of a broken opening is included with an approved glass breakage claim (boolean).
  glass_breakage_cause_basis: What counts as accidental breakage (text).
  insulated_glass_proration: >-
    Customer share of the sealed-unit replacement charge for an approved seal-failure claim, by full years
    since the coverage start date: each step applies from after_year onward (ladder of after_year and
    customer_share).
  sealed_unit_replacement_charge: >-
    Published replacement charge per sealed glass unit used as the base of a prorated share (USD).
  seal_failure_definition: What counts as insulated glass seal failure (text).
  exclusions: Causes for which no claim is approved under any term (list).
  cosmetic_report_days: >-
    Calendar days after the coverage start date within which cosmetic defects (scratches, dents, finish
    blemishes) present at installation must be reported (days).
  claim_notice_days: >-
    Calendar days after the date the customer first noticed the problem within which the claim must be
    filed (days).
  claim_decision_business_days: Business days after filing within which a claim is decided (days).
  labor_rate_per_hour: Hourly labor rate for service outside the labor or workmanship term (USD).
  labor_min_hours: Minimum billable labor per visit outside the labor term (hours).
  labor_billing_increment_hours: Billable labor beyond the minimum is rounded up to this increment (hours).
  trip_charge_out_of_labor_term: Trip charge for a service visit made outside the labor term (USD).
  trip_charge_no_defect: >-
    Trip charge when the technician finds no covered defect, charged even inside the labor term; 0.00
    where waived (USD).
  no_show_fee: Fee when nobody gives the technician access within the wait time of a booked visit (USD).
  free_no_show_count: >-
    Missed service visits per registration that are waived before the no-show fee applies (count).
  no_show_wait_minutes: Minutes the technician waits for access before the visit counts as a no-show (minutes).
  service_visit_window_hours: Length of the technician arrival window (hours).
  service_visit_business_days: Business days after a claim is approved within which a service visit is
    offered (days).
  parts_ship_business_days: Business days after a parts-only approval within which parts ship (days).
  parts_shipping_fee: >-
    Shipping fee per shipment of covered parts sent to the customer for a parts-only remedy (USD).
  discontinued_part_substitute: >-
    Whether a discontinued part is replaced with the nearest current-production equivalent rather than
    an exact match (boolean).
  replacement_color_basis: >-
    How finish color is matched on replacement parts: nearest_current_production (enumeration).
  auto_registration: >-
    Whether coverage is registered automatically when the installation is completed, with no customer
    filing (boolean).
  transferable: Whether the registration can be transferred to a buyer of the home (boolean).
  transfer_max_count: >-
    Ownership transfers allowed over the life of the coverage; 0 where not transferable (count).
  transfer_request_window_days: >-
    Calendar days after the home sale closing date within which the transfer must be requested; 0 where
    not transferable (days).
  transfer_fee: Fee to transfer the registration, charged to the requesting seller (USD).
  transferred_product_term_years: >-
    Cap on every product component term for a later owner, counted from the original coverage start date;
    0 where not transferable (years).
  transferred_labor_term_years: >-
    Cap on the labor and workmanship terms for a later owner, counted from the original coverage start
    date; 0 where not transferable (years).
  transferred_glass_breakage: Whether glass breakage coverage carries over to a later owner (boolean).
  void_causes: Recorded causes that void a registration (list).
  upgrade_price_per_opening: >-
    Price per opening or door unit to buy this plan at signing instead of the series' included plan; 0.00
    where the plan is included (USD).
  included_with_series: Product series that include this plan at no charge (list of official series names).
