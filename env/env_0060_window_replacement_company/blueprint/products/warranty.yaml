events:
- type: warranty_registered
  target: warranty_registrations
  mutation: create
  meaning: Coverage is registered for an owner, at installation completion or on transfer to a buyer.
  grain: One row per registration.
  fields:
    customer_id: The registered owner.
    window_contract_id: The window contract covered, or empty.
    door_contract_id: The door contract covered, or empty.
    install_job_id: The installation job whose completion started coverage.
    variant_name: The warranty plan, as its official name.
    registration_number: The registration number on the certificate.
    coverage_start_date: The installation completion date every term is counted from.
    registration_kind: original_purchase or ownership_transfer.
    transfer_count: Transfers that preceded this registration.
  triggers: []
- type: warranty_claim_decided
  target: warranty_activities
  meaning: A filed warranty claim is decided.
  grain: One row per decision on one claim.
  distinguish_by:
  - warranty_claim_id
  - activity_date
  fields:
    activity_date: Date of the decision.
    warranty_claim_id: The claim decided.
    component: The component claimed.
    claim_decision: >-
      approved_parts_and_labor, approved_parts_only, approved_with_proration, denied_out_of_term or denied_excluded_cause.
    units: Units the decision covers.
  triggers:
  - event: warranty:warranty_charge_assessed
    when:
      claim_decision: approved_with_proration
    map:
      charge_kind: prorated_parts_share
      warranty_claim_id: warranty_claim_id
      activity_date: activity_date
      units: units
- type: warranty_parts_shipped
  target: warranty_activities
  meaning: Covered parts are shipped to the customer for a claim.
  grain: One row per shipment for one claim.
  distinguish_by:
  - warranty_claim_id
  - activity_date
  fields:
    activity_date: Ship date.
    warranty_claim_id: The claim.
    component: The component shipped.
    units: Units shipped.
  triggers: []
- type: warranty_service_visit
  target: warranty_activities
  meaning: A technician visit for a claim is recorded with its outcome.
  grain: One row per visit for one claim.
  distinguish_by:
  - warranty_claim_id
  - activity_date
  fields:
    activity_date: Date of the visit.
    warranty_claim_id: The claim.
    visit_outcome: repaired, part_on_order, no_defect_found or customer_no_show.
    labor_hours: Labor hours on site.
  triggers: []
- type: warranty_charge_assessed
  target: warranty_activities
  meaning: A charge under the warranty terms is billed to the registered owner.
  grain: One row per charge of one kind for one claim on one date.
  distinguish_by:
  - charge_kind
  - warranty_claim_id
  - activity_date
  fields:
    activity_date: Date of the charge.
    amount: Charge amount (positive).
    charge_kind: >-
      labor_charge, trip_charge, no_show_fee, parts_shipping_fee, glass_breakage_deductible, prorated_parts_share
      or transfer_fee.
    warranty_claim_id: The claim charged, or empty for a transfer fee.
    units: Units priced.
    labor_hours: Billable labor hours for a labor charge.
  account: warranty_charges
  direction: in
  triggers: []
- type: warranty_charge_reversed
  target: warranty_activities
  meaning: A warranty charge is reversed in full.
  grain: One row per charge reversed.
  distinguish_by:
  - source_warranty_activity_id
  fields:
    activity_date: Date of the reversal.
    amount: Amount reversed (positive), equal to the charge.
    charge_kind: The kind of the charge reversed.
    source_warranty_activity_id: The charge record reversed.
  account: warranty_charges
  direction: out
  triggers: []
- type: warranty_transfer_requested
  target: warranty_registrations
  mutation:
    transition:
      from: active
      to: transfer_pending
  meaning: The selling owner asks to transfer the coverage to the buyer.
  grain: One row per transaction.
  fields:
    transfer_requested_date: Date the transfer was requested.
  triggers: []
- type: warranty_transfer_withdrawn
  target: warranty_registrations
  mutation:
    transition:
      from: transfer_pending
      to: active
  meaning: A pending transfer is withdrawn or fails, and the seller's coverage continues.
  grain: One row per transaction.
  fields:
    transfer_requested_date: Cleared to empty.
  triggers: []
- type: warranty_transfer_completed
  target: warranty_registrations
  mutation:
    transition:
      from: transfer_pending
      to: transferred
  meaning: The transfer is completed and the buyer receives a new registration.
  grain: One row per transaction.
  fields:
    transferred_date: Date the transfer was completed.
    window_contract_id: The window contract covered (carried, not rewritten), or empty.
    door_contract_id: The door contract covered (carried, not rewritten), or empty.
    install_job_id: The installation job (carried, not rewritten).
    variant_name: The plan (carried, not rewritten).
    coverage_start_date: The original coverage start date (carried, not rewritten).
  triggers:
  - event: warranty:warranty_registered
    map:
      registration_kind: ownership_transfer
      window_contract_id: window_contract_id
      door_contract_id: door_contract_id
      install_job_id: install_job_id
      variant_name: variant_name
      coverage_start_date: coverage_start_date
- type: warranty_expired
  target: warranty_registrations
  mutation:
    transition:
      from: active
      to: expired
  meaning: Every term of the registration has ended.
  grain: One row per transaction.
  fields:
    closed_date: Date of expiry.
  triggers: []
- type: warranty_voided
  target: warranty_registrations
  mutation:
    transition:
      from: active
      to: voided
  meaning: The registration is voided for a recorded void cause.
  grain: One row per transaction.
  fields:
    closed_date: Date the registration was voided.
  triggers: []
measures:
- id: warranty_msr_breakage_claims_365d
  window: Rolling 365 calendar days ending on the claim being decided, excluding that claim.
  measure: >-
    Count of warranty_claim_decided rows of the registration with component glass_breakage and a claim_decision
    beginning with approved.
- id: warranty_msr_no_shows
  window: Registration lifetime up to and including the visit being handled.
  measure: >-
    Count of warranty_service_visit rows of the registration with visit_outcome customer_no_show.
- id: warranty_msr_full_years
  window: From the coverage start date to the claim filing date.
  measure: Whole years elapsed, counting a year only once its anniversary date has been reached.
policies:
- id: warranty_agg_multi_holding
  subject:
  - warranty_registered
  rule: >-
    A customer holds one registration for every completed contract, so a homeowner with a window contract
    and a door contract holds two registrations, each with its own plan. A contract's products have only
    one registration in force at a time; a transfer closes the seller's registration as transferred before
    the buyer's registration is issued. The number of registrations a customer holds is not capped.
  eligibility:
  - id: one_in_force
    applies_to:
    - warranty_registered
    kind: dedup
    condition: >-
      A contract's products have only one registration in force at a time; a transfer closes the seller's
      registration as transferred before the buyer's registration is issued.
    evidence_fields:
    - warranty_registrations.window_contract_id
    - warranty_registrations.door_contract_id
    - warranty_registrations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_registrations.window_contract_id
        - warranty_registrations.door_contract_id
      action_bindings:
        warranty_registrations.window_contract_id: window_contract_id
        warranty_registrations.door_contract_id: door_contract_id
    dedup_contract:
      table: warranty_registrations
      mode: separate_record
      object_bindings:
        window_contract_id: window_contract_id
        door_contract_id: door_contract_id
      duplicate_filters:
        status:
        - active
        - transfer_pending
      distinct_fields:
      - registration_number
  params:
    max_per_customer: null
- id: warranty_agg_claims_per_registration
  subject:
  - warranty_claim_decided
  - warranty_charge_assessed
  rule: >-
    Claims are kept apart when a customer holds several registrations. A claim is filed and decided under
    the registration that covers the unit claimed, never under another registration of the same customer
    even if its plan is richer. Breakage claim counts, no-show counts, deductibles and charges belong
    to the registration and claim they arise on and are never pooled. One claim covers one component;
    problems with two components are two claims, and each approved glass breakage claim carries its own
    deductible.
  eligibility:
  - id: covering_registration
    applies_to:
    - warranty_claim_decided
    kind: authorization
    condition: >-
      A claim is filed and decided under the registration that covers the unit claimed, never under another
      registration of the same customer even if its plan is richer.
    evidence_fields:
    - warranty_claims.warranty_claim_id
    - warranty_claims.warranty_registration_id
    - warranty_registrations.window_contract_id
    - warranty_registrations.door_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_claims.warranty_claim_id
      action_bindings:
        warranty_claims.warranty_claim_id: warranty_claim_id
- id: warranty_registration_and_terms
  subject:
  - warranty_registered
  - warranty_expired
  rule: >-
    Coverage is registered automatically on the date the installation is completed, under the plan chosen
    on the contract at signing; the series' included plan is the default and a higher plan is bought at
    signing for the upgrade price per unit, and the plan never changes after signing. Every term is counted
    from the coverage start date in whole years: coverage runs through the day before the anniversary
    that ends the term, and when that anniversary falls on a day the month lacks, it falls back to the
    last day of the month. A lifetime term lasts as long as the registered owner owns the home. While
    the home is used as a rental property according to the customer profile, every term, lifetime included,
    is capped at the rental cap counted from the coverage start date; the cap is an override that replaces
    any longer term and never lengthens a shorter one. A registration expires when every one of its terms
    has ended; a registration with any lifetime term does not expire while the registered owner owns the
    home.
  eligibility: []
  params:
    per_tier:
      Ridgeline Limited Warranty:
        frame: =frame_sash_term_years
        glass: =insulated_glass_term_years
        hardware: =hardware_term_years
        screen: =screen_term_years
        weatherstrip: =weatherstrip_term_years
        finish: =exterior_finish_term_years
        labor: =labor_term_years
        workmanship: =workmanship_term_years
        upgrade: =upgrade_price_per_opening
      Ridgeline Limited Plus Warranty:
        frame: =frame_sash_term_years
        glass: =insulated_glass_term_years
        hardware: =hardware_term_years
        screen: =screen_term_years
        weatherstrip: =weatherstrip_term_years
        finish: =exterior_finish_term_years
        labor: =labor_term_years
        workmanship: =workmanship_term_years
        upgrade: =upgrade_price_per_opening
      Ridgeline Lifetime Limited Warranty:
        frame: =frame_sash_term_years
        glass: =insulated_glass_term_years
        hardware: =hardware_term_years
        screen: =screen_term_years
        weatherstrip: =weatherstrip_term_years
        finish: =exterior_finish_term_years
        labor: =labor_term_years
        workmanship: =workmanship_term_years
        upgrade: =upgrade_price_per_opening
      Ridgeline Lifetime Plus Warranty:
        frame: =frame_sash_term_years
        glass: =insulated_glass_term_years
        hardware: =hardware_term_years
        screen: =screen_term_years
        weatherstrip: =weatherstrip_term_years
        finish: =exterior_finish_term_years
        labor: =labor_term_years
        workmanship: =workmanship_term_years
        upgrade: =upgrade_price_per_opening
      Ridgeline Lifetime Premier Warranty:
        frame: =frame_sash_term_years
        glass: =insulated_glass_term_years
        hardware: =hardware_term_years
        screen: =screen_term_years
        weatherstrip: =weatherstrip_term_years
        finish: =exterior_finish_term_years
        labor: =labor_term_years
        workmanship: =workmanship_term_years
        upgrade: =upgrade_price_per_opening
      Ridgeline Owner-to-Owner Lifetime Warranty:
        frame: =frame_sash_term_years
        glass: =insulated_glass_term_years
        hardware: =hardware_term_years
        screen: =screen_term_years
        weatherstrip: =weatherstrip_term_years
        finish: =exterior_finish_term_years
        labor: =labor_term_years
        workmanship: =workmanship_term_years
        upgrade: =upgrade_price_per_opening
    rental_cap: =non_owner_occupied_term_cap_years
    lifetime: =lifetime_definition
    start_basis: =coverage_start_basis
    counting: =term_counting_basis
    automatic: =auto_registration
    included: =included_with_series
- id: warranty_claim_decision
  subject:
  - warranty_claim_decided
  rule: >-
    A claim names one component and the units affected and is decided within the plan's decision window.
    A claim is decided only while the registration status is active or transfer_pending. A claim is considered
    under the terms only when it is filed no later than the notice window after the date the customer
    first noticed the problem. Calendar days are counted from the day after the date the customer first
    noticed the problem, and filing on the last day of the window is on time. The component's term and
    the labor term are each judged on the claim filing date against the coverage start date, with the
    rental cap and, for a transferred registration, the transferred caps applied first. A claim whose
    cause is one of the exclusions is denied_excluded_cause whatever the term; seal failure means visible
    fogging or film between the panes, and room-side condensation is never a defect. A cosmetic defect
    present at installation is considered only when reported within the cosmetic window after the coverage
    start date. Inside both the component and labor terms the decision is approved_parts_and_labor; inside
    the component term but past the labor term it is approved_parts_only; past the component term it is
    denied_out_of_term. An insulated glass claim whose full years since coverage start (warranty_msr_full_years)
    reach a proration step with a customer share above zero is approved_with_proration. Installation workmanship
    is judged on the workmanship term alone.
  eligibility:
  - id: registration_in_force
    applies_to:
    - warranty_claim_decided
    kind: state
    condition: A claim is decided only while the registration status is active or transfer_pending.
    evidence_fields:
    - warranty_registrations.warranty_registration_id
    - warranty_registrations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_registrations.warranty_registration_id
      action_bindings:
        warranty_registrations.warranty_registration_id: warranty_registration_id
    state_contract:
      field: warranty_registrations.status
      allowed:
      - active
      - transfer_pending
  - id: notice_window
    applies_to:
    - warranty_claim_decided
    kind: time
    condition: >-
      A claim is considered under the terms only when it is filed no later than the notice window after
      the date the customer first noticed the problem.
    evidence_fields:
    - warranty_claims.warranty_claim_id
    - warranty_claims.discovery_date
    - warranty_claims.created_at
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - warranty_claims.warranty_claim_id
      action_bindings:
        warranty_claims.warranty_claim_id: warranty_claim_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the date the customer first noticed the problem
      anchor_source: warranty_claims.discovery_date
      relation: not_after
      duration_source: variants.claim_notice_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the date the customer first noticed the problem,
        and filing on the last day of the window is on time.
      boundary: inclusive
  params:
    per_tier:
      Ridgeline Limited Warranty:
        notice_days: =claim_notice_days
        decision_days: =claim_decision_business_days
        proration: =insulated_glass_proration
      Ridgeline Limited Plus Warranty:
        notice_days: =claim_notice_days
        decision_days: =claim_decision_business_days
        proration: =insulated_glass_proration
      Ridgeline Lifetime Limited Warranty:
        notice_days: =claim_notice_days
        decision_days: =claim_decision_business_days
        proration: =insulated_glass_proration
      Ridgeline Lifetime Plus Warranty:
        notice_days: =claim_notice_days
        decision_days: =claim_decision_business_days
        proration: =insulated_glass_proration
      Ridgeline Lifetime Premier Warranty:
        notice_days: =claim_notice_days
        decision_days: =claim_decision_business_days
        proration: =insulated_glass_proration
      Ridgeline Owner-to-Owner Lifetime Warranty:
        notice_days: =claim_notice_days
        decision_days: =claim_decision_business_days
        proration: =insulated_glass_proration
    exclusions: =exclusions
    seal_failure: =seal_failure_definition
    cosmetic_days: =cosmetic_report_days
  measures:
  - warranty_msr_full_years
- id: warranty_glass_breakage
  subject:
  - warranty_claim_decided
  - warranty_charge_assessed
  rule: >-
    Accidental glass breakage is covered only in plans that include it, within the plan's breakage term,
    and only for sudden breakage from an accidental impact. A breakage claim is approved only when the
    registration has fewer approved breakage claims in the preceding 365 days than the plan allows (warranty_msr_breakage_claims_365d);
    otherwise it is denied_out_of_term. Every approved breakage claim carries the plan's deductible once,
    on the decision date, and is approved for parts and labor; plans that include it also board up the
    broken opening at no charge until the glass is replaced. For a transferred registration, breakage
    coverage continues only where the plan carries it over to a later owner.
  eligibility:
  - id: breakage_count
    applies_to:
    - warranty_claim_decided
    kind: authorization
    condition: >-
      A breakage claim is approved only when the registration has fewer approved breakage claims in the
      preceding 365 days than the plan allows (warranty_msr_breakage_claims_365d); otherwise it is denied_out_of_term.
    evidence_fields:
    - warranty_registrations.warranty_registration_id
    - warranty_activities.component
    - warranty_activities.claim_decision
    - warranty_activities.activity_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_registrations.warranty_registration_id
      action_bindings:
        warranty_registrations.warranty_registration_id: warranty_registration_id
  params:
    per_tier:
      Ridgeline Limited Warranty:
        covered: =glass_breakage_covered
        term: =glass_breakage_term_years
        deductible: =glass_breakage_deductible
        per_year: =glass_breakage_claims_per_year
        boardup: =glass_breakage_boardup_included
        transfers: =transferred_glass_breakage
      Ridgeline Limited Plus Warranty:
        covered: =glass_breakage_covered
        term: =glass_breakage_term_years
        deductible: =glass_breakage_deductible
        per_year: =glass_breakage_claims_per_year
        boardup: =glass_breakage_boardup_included
        transfers: =transferred_glass_breakage
      Ridgeline Lifetime Limited Warranty:
        covered: =glass_breakage_covered
        term: =glass_breakage_term_years
        deductible: =glass_breakage_deductible
        per_year: =glass_breakage_claims_per_year
        boardup: =glass_breakage_boardup_included
        transfers: =transferred_glass_breakage
      Ridgeline Lifetime Plus Warranty:
        covered: =glass_breakage_covered
        term: =glass_breakage_term_years
        deductible: =glass_breakage_deductible
        per_year: =glass_breakage_claims_per_year
        boardup: =glass_breakage_boardup_included
        transfers: =transferred_glass_breakage
      Ridgeline Lifetime Premier Warranty:
        covered: =glass_breakage_covered
        term: =glass_breakage_term_years
        deductible: =glass_breakage_deductible
        per_year: =glass_breakage_claims_per_year
        boardup: =glass_breakage_boardup_included
        transfers: =transferred_glass_breakage
      Ridgeline Owner-to-Owner Lifetime Warranty:
        covered: =glass_breakage_covered
        term: =glass_breakage_term_years
        deductible: =glass_breakage_deductible
        per_year: =glass_breakage_claims_per_year
        boardup: =glass_breakage_boardup_included
        transfers: =transferred_glass_breakage
    cause_basis: =glass_breakage_cause_basis
  measures:
  - warranty_msr_breakage_claims_365d
- id: warranty_proration
  subject:
  - warranty_charge_assessed
  rule: >-
    For an insulated glass claim approved with proration, the customer pays the share of the published
    sealed-unit replacement charge that the plan's proration ladder sets for the full years since the
    coverage start date (warranty_msr_full_years), times the units approved; Ridgeline pays the rest and
    the labor follows the labor term as for any other approval. The share is booked once as prorated_parts_share
    on the decision date. A share of zero books nothing.
  eligibility: []
  params:
    unit_charge: =sealed_unit_replacement_charge
  measures:
  - warranty_msr_full_years
- id: warranty_service_charges
  subject:
  - warranty_service_visit
  - warranty_parts_shipped
  - warranty_charge_assessed
  rule: >-
    An approved claim is remedied by a technician visit offered within the plan's visit window, or, for
    a parts-only approval the customer chooses to fit themselves, by shipping the parts within the plan's
    shipping window. A visit inside the labor term carries no labor or trip charge for the covered repair.
    A visit outside the labor term carries the plan's out-of-term trip charge plus labor at the plan's
    hourly rate for the billable hours, which are the hours on site with the minimum applied and any time
    beyond the minimum rounded up to the billing increment. When the technician finds no covered defect,
    the plan's no-defect trip charge applies even inside the labor term. A visit where nobody gives access
    within the wait time is a no-show; the no-shows of a registration up to the plan's free count (warranty_msr_no_shows)
    carry no fee and each later one carries the plan's no-show fee. A parts shipment to the customer carries
    the plan's shipping fee once per shipment. Discontinued parts are replaced with the nearest current-production
    equivalent.
  eligibility: []
  params:
    per_tier:
      Ridgeline Limited Warranty:
        rate: =labor_rate_per_hour
        trip_out_of_term: =trip_charge_out_of_labor_term
        trip_no_defect: =trip_charge_no_defect
        no_show: =no_show_fee
        free_no_shows: =free_no_show_count
        visit_days: =service_visit_business_days
        ship_days: =parts_ship_business_days
        shipping: =parts_shipping_fee
      Ridgeline Limited Plus Warranty:
        rate: =labor_rate_per_hour
        trip_out_of_term: =trip_charge_out_of_labor_term
        trip_no_defect: =trip_charge_no_defect
        no_show: =no_show_fee
        free_no_shows: =free_no_show_count
        visit_days: =service_visit_business_days
        ship_days: =parts_ship_business_days
        shipping: =parts_shipping_fee
      Ridgeline Lifetime Limited Warranty:
        rate: =labor_rate_per_hour
        trip_out_of_term: =trip_charge_out_of_labor_term
        trip_no_defect: =trip_charge_no_defect
        no_show: =no_show_fee
        free_no_shows: =free_no_show_count
        visit_days: =service_visit_business_days
        ship_days: =parts_ship_business_days
        shipping: =parts_shipping_fee
      Ridgeline Lifetime Plus Warranty:
        rate: =labor_rate_per_hour
        trip_out_of_term: =trip_charge_out_of_labor_term
        trip_no_defect: =trip_charge_no_defect
        no_show: =no_show_fee
        free_no_shows: =free_no_show_count
        visit_days: =service_visit_business_days
