category: window
display_name: Window Replacement Contracts
binding:
  holding_table: window_contracts
  event_tables:
  - window_transactions
  intake_tables:
  - window_cancellation_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - signed
  - measured
  - ordered
  - installed
  - closed
  - cancelled
  transitions:
  - from: signed
    to: measured
    by: system
    means: >-
      A completed final measure visit confirms the openings and sizes, so the contract specifications
      are fixed.
  - from: measured
    to: ordered
    by: agent
    means: The confirmed specifications are released to the factory as a production order.
  - from: ordered
    to: installed
    by: system
    means: The installation job for this contract is completed and signed off on site.
  - from: installed
    to: closed
    by: system
    means: The contract is paid in full after installation and is closed.
  - from: signed
    to: cancelled
    by: user
    means: The customer cancels in writing before the final measure.
  - from: measured
    to: cancelled
    by: user
    means: The customer cancels in writing after the final measure but before order release.
  - from: ordered
    to: cancelled
    by: user
    means: The customer cancels in writing after the custom product has been ordered.
accounts:
- key: customer_payments
  unit: USD
  meaning: >-
    Money the customer (or the financing lender on the customer's behalf) has paid toward this contract,
    net of refunds returned.
- key: contract_charges
  unit: USD
  meaning: >-
    Amounts added to the signed contract price after signing (change orders and fees), net of price credits
    granted against the contract.
parameter_schema:
  base_price_per_opening: >-
    Installed list price per standard-size window opening in this series, before any discount program
    (USD).
  min_contract_amount: Smallest signed contract price accepted for this series (USD).
  max_openings_per_contract: Largest number of window openings one contract in this series may carry (count).
  booking_deposit_pct: >-
    Booking deposit as a share of the contract price for cash, check or card contracts (decimal fraction).
  booking_deposit_min: Floor of the booking deposit for cash, check or card contracts (USD).
  financed_deposit_pct: >-
    Booking deposit as a share of the contract price when the contract's payment method is Ridgeline financing;
    no floor applies (decimal fraction).
  deposit_due_days: >-
    Calendar days after the contract signing date within which the booking deposit is due (days).
  measure_booking_business_days: >-
    Business days after the deposit is received in full within which a final measure appointment is offered
    (days).
  measure_reschedule_notice_hours: >-
    Minimum notice before a measure appointment's start for a customer reschedule to count as on-time
    rather than late (hours).
  free_missed_measure_count: >-
    Missed measure appointments (no-shows or late reschedules) per contract that are waived before the
    missed-appointment fee applies (count).
  missed_measure_fee: Fee for each missed measure appointment beyond the waived count (USD).
  free_remeasure_count: Customer-requested remeasure visits per contract that carry no fee (count).
  remeasure_fee: Fee for each customer-requested remeasure beyond the free count (USD).
  standard_ui_max: >-
    Largest united-inch size (width plus height, each rounded up to the next whole inch) an opening may
    measure and still be priced as standard in this series (inches).
  oversize_ui_max: >-
    Largest united-inch size this series can be built in at all; openings above it cannot be made in this
    series (inches).
  oversize_surcharge_per_opening: >-
    Surcharge per opening measured above the standard united-inch bracket but within the series maximum
    (USD).
  cooling_off_business_days: >-
    Business days after the contract signing date during which an in-home sale may be cancelled under
    the federal three-day cooling-off right printed on the contract (days).
  cooling_off_refund_business_days: >-
    Business days after receipt of a qualifying cooling-off notice within which every payment is refunded
    (days).
  pre_measure_cancellation_fee: >-
    Charge retained when a contract outside the cooling-off right is cancelled while still in status signed
    (USD).
  pre_release_cancellation_fee: >-
    Measure-and-design charge retained when a contract outside the cooling-off right is cancelled in status
    measured (USD).
  post_release_product_share_pct: >-
    Share of the adjusted contract value charged when a contract is cancelled after order release, representing
    the custom-built product (decimal fraction).
  change_order_free_count: Customer change orders per contract written without a change-order fee (count).
  change_order_fee: Administrative fee for each customer change order beyond the free count (USD).
  change_order_max_count: Most customer change orders a contract may carry; further changes are refused
    (count).
  premium_low_e_per_opening: >-
    Price per opening to upgrade from the series' standard Low-E coating to the premium triple-silver
    Low-E package; 0.00 where the premium package is already standard (USD).
  triple_pane_per_opening: Price per opening to upgrade to triple-pane insulated glass (USD).
  grilles_between_glass_per_opening: Price per opening for grilles sealed between the glass panes (USD).
  exterior_color_available: Whether a non-white exterior color can be ordered in this series (boolean).
  exterior_color_per_opening: >-
    Price per opening for a non-white exterior color where available; 0.00 where unavailable (USD).
  tempered_glass_per_opening: Price per opening for tempered safety glass (USD).
  laminated_glass_per_opening: Price per opening for laminated glass (USD).
  obscure_glass_per_opening: Price per opening for obscure (privacy) glass (USD).
  hardware_finish_per_opening: Price per opening for an upgraded lock and hardware finish (USD).
  opening_removed_credit_pct: >-
    Share of the series base price per opening credited for each opening removed before order release
    (decimal fraction).
  door_bundle_discount_pct: >-
    Discount on the contract price granted as a credit when the customer also signs a Ridgeline door contract
    within the bundle window (decimal fraction).
  door_bundle_window_days: >-
    Most calendar days that may separate the signing dates of the window contract and the door contract
    for the bundle discount (days).
  referral_credit_amount: >-
    Credit per referred household that signs and completes installation of its own Ridgeline contract
    (USD).
  referral_credit_max_per_contract: Most referral credits one contract can receive (count).
  military_discount_pct: Military discount program rate applied to the list price at signing (decimal
    fraction).
  senior_discount_pct: Senior discount program rate applied to the list price at signing (decimal fraction).
  first_responder_discount_pct: >-
    First-responder discount program rate applied to the list price at signing (decimal fraction).
  senior_discount_min_age: Minimum age in whole years on the contract signing date for the senior program
    (years).
  series_change_fee: >-
    Redesign fee for switching the contract to another series after the final measure and before order
    release (USD).
  final_balance_due_days: >-
    Calendar days after the installation completion date within which the remaining balance is due (days).
  late_balance_monthly_rate: >-
    Late charge rate applied to the unpaid balance for each full 30-day period after the final balance
    due date (decimal fraction per period).
  late_balance_min_charge: Smallest late balance charge assessed for a period (USD).
  card_payment_max_per_txn: Largest single card payment accepted toward the contract (USD).
  refund_business_days: >-
    Business days within which a non-cooling-off cancellation refund or an overpayment refund is issued
    after it becomes due (days).
  refund_tender_rule: >-
    Where a refund is returned: original_tender means to the card or account the payment came from, and
    a check is mailed for cash or check payments (enumeration).
  min_openings_after_removal: Fewest openings a contract may keep after openings are removed for credit
    (count).
