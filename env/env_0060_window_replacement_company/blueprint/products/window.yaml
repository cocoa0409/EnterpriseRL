events:
- type: window_contract_signed
  target: window_contracts
  mutation: create
  meaning: The homeowner signs a window replacement contract for one product series.
  grain: One row per signed contract.
  fields:
    customer_id: The homeowner who signed.
    variant_name: The product series contracted, as its official full name.
    contract_number: The contract number printed on the signed agreement.
    signed_date: The date the agreement was signed.
    sales_channel: Where the sale was made (in_home, showroom or virtual_consultation).
    opening_count: Number of window openings on the contract at signing.
    contract_price: Signed contract price after any discount program, including options chosen at signing.
    payment_method: Whether the contract is paid by cash, check or card or by Ridgeline financing.
    discount_program: The single discount program applied at signing, or none.
    warranty_plan: The warranty plan chosen at signing, as its official name.
  triggers: []
- type: window_payment_received
  target: window_transactions
  meaning: A payment toward the contract is received, from the customer or from the financing lender.
  grain: One row per payment received.
  distinguish_by:
  - payment_kind
  - txn_date
  - amount
  - tender_type
  fields:
    txn_date: Date the payment was received.
    amount: Amount received (positive).
    payment_kind: booking_deposit, progress_payment, final_balance or lender_funding.
    tender_type: check, card, ach or lender_disbursement.
  account: customer_payments
  direction: in
  triggers: []
- type: window_refund_issued
  target: window_transactions
  meaning: Money is returned to the customer against one specific earlier payment.
  grain: One row per refund of one source payment.
  distinguish_by:
  - refund_kind
  - source_window_txn_id
  - txn_date
  fields:
    txn_date: Date the refund was issued.
    amount: Amount refunded (positive).
    refund_kind: cooling_off_refund, cancellation_refund or overpayment_refund.
    source_window_txn_id: The payment record this refund returns money from.
  account: customer_payments
  direction: out
  triggers: []
- type: window_change_order
  target: window_transactions
  meaning: >-
    A priced addition to the contract — an option upgrade, an added opening or an oversize surcharge.
  grain: One row per change order line of one kind written on one date.
  distinguish_by:
  - change_kind
  - txn_date
  - openings_affected
  fields:
    txn_date: Date the change order was written.
    amount: Price added to the contract (positive).
    change_kind: >-
      What was added (premium_low_e, triple_pane, grilles_between_glass, exterior_color, tempered_glass,
      laminated_glass, obscure_glass, hardware_finish, opening_added, oversize_surcharge).
    openings_affected: Number of openings the line prices.
  account: contract_charges
  direction: in
  triggers: []
- type: window_price_credit
  target: window_transactions
  meaning: A credit that reduces what the customer owes on the contract.
  grain: One row per credit of one kind granted on one date for one source.
  distinguish_by:
  - credit_kind
  - txn_date
  - factory_order_id
  - referred_contract_number
  fields:
    txn_date: Date the credit was granted.
    amount: Credit amount (positive).
    credit_kind: opening_removed, door_bundle_discount, referral_credit or on_time_guarantee_credit.
    openings_affected: Openings removed, for an opening_removed credit; 0 otherwise.
    factory_order_id: The factory order whose late shipment earned an on_time_guarantee_credit; empty
      otherwise.
    referred_contract_number: >-
      Contract number of the referred household's contract, for a referral_credit; empty otherwise.
  account: contract_charges
  direction: out
  triggers: []
- type: window_fee_assessed
  target: window_transactions
  meaning: A fee or charge is added to the contract.
  grain: One row per fee of one kind assessed on one date.
  distinguish_by:
  - fee_kind
  - txn_date
  fields:
    txn_date: Date the fee was assessed.
    amount: Fee amount (positive).
    fee_kind: >-
      missed_measure_fee, remeasure_fee, change_order_fee, series_change_fee, late_balance_charge or cancellation_charge.
  account: contract_charges
  direction: in
  triggers: []
- type: window_measure_visit
  target: window_transactions
  meaning: A measure appointment at the home is recorded with its outcome.
  grain: One row per measure appointment.
  distinguish_by:
  - visit_kind
  - txn_date
  fields:
    txn_date: Date of the appointment.
    visit_kind: final_measure, remeasure (customer-requested) or company_remeasure (ordered by Ridgeline).
    visit_outcome: completed, customer_no_show, late_reschedule or company_rescheduled.
    openings_affected: Openings measured at a completed visit; 0 otherwise.
    oversize_opening_count: Openings measured above the series' standard united-inch bracket; 0 otherwise.
  triggers:
  - event: window:window_measure_confirmed
    when:
      visit_kind: final_measure
      visit_outcome: completed
    map:
      measure_date: txn_date
      opening_count: openings_affected
  - event: window:window_change_order
    when:
      visit_kind: final_measure
      visit_outcome: completed
      oversize_opening_count:
        not: 0
    map:
      change_kind: oversize_surcharge
      openings_affected: oversize_opening_count
      txn_date: txn_date
- type: window_measure_confirmed
  target: window_contracts
  mutation:
    transition:
      from: signed
      to: measured
  meaning: The final measure fixes the contract's openings and sizes.
  grain: One row per transaction.
  fields:
    measure_date: Date of the completed final measure.
    opening_count: Openings confirmed at the final measure.
  triggers: []
- type: window_order_released
  target: window_contracts
  mutation:
    transition:
      from: measured
      to: ordered
  meaning: The confirmed specifications are released to the factory.
  grain: One row per transaction.
  fields:
    order_release_date: Date the order was released to the factory.
  triggers:
  - event: order:order_entered
    map:
      window_contract_id: window_contract_id
      customer_id: customer_id
- type: window_installation_completed
  target: window_contracts
  mutation:
    transition:
      from: ordered
      to: installed
  meaning: The installation of the contracted windows is completed and signed off on site.
  grain: One row per transaction.
  fields:
    completion_date: Date the installation was completed.
  triggers: []
- type: window_contract_closed
  target: window_contracts
  mutation:
    transition:
      from: installed
      to: closed
  meaning: The installed contract is paid in full and closed.
  grain: One row per transaction.
  fields:
    closed_date: Date the contract was closed.
  triggers: []
- type: window_contract_cancelled
  target: window_contracts
  mutation:
    transition:
    - from: signed
      to: cancelled
    - from: measured
      to: cancelled
    - from: ordered
      to: cancelled
  meaning: The contract is cancelled on the customer's written notice.
  grain: One row per transaction.
  fields:
    cancelled_date: Date the written notice of cancellation was given.
  triggers: []
- type: window_series_changed
  target: window_contracts
  mutation: update
  meaning: The contract is moved to another product series before order release and re-priced.
  grain: One row per transaction.
  fields:
    variant_name: The new product series.
    contract_price: The re-priced contract price.
  triggers: []
measures:
- id: window_msr_paid_to_date
  window: Contract lifetime up to the moment of handling.
  measure: >-
    Sum of amount over window_payment_received rows of the contract minus sum of amount over its window_refund_issued
    rows.
- id: window_msr_net_charges
  window: Contract lifetime up to the moment of handling.
  measure: >-
    Sum of amount over window_change_order and window_fee_assessed rows of the contract minus sum of amount
    over its window_price_credit rows.
- id: window_msr_open_contracts
  window: Portfolio state at the moment of handling.
  measure: >-
    Count of the customer's window contracts whose status is signed, measured, ordered or installed.
- id: window_msr_missed_measures
  window: Contract lifetime up to and including the appointment being handled.
  measure: >-
    Count of window_measure_visit rows of the contract whose visit_outcome is customer_no_show or late_reschedule.
- id: window_msr_customer_remeasures
  window: Contract lifetime up to and including the visit being handled.
  measure: >-
    Count of window_measure_visit rows of the contract with visit_kind remeasure and visit_outcome completed.
- id: window_msr_change_orders
  window: Contract lifetime up to and including the change order being handled.
  measure: >-
    Count of distinct txn_date values among window_change_order rows of the contract whose change_kind
    is not oversize_surcharge (all lines written on one date form one change order).
- id: window_msr_referral_credits
  window: Contract lifetime up to the moment of handling.
  measure: Count of window_price_credit rows of the contract with credit_kind referral_credit.
policies:
- id: window_agg_multi_holding
  subject:
  - window_contract_signed
  rule: >-
    A customer may hold several window replacement contracts over time, but no more than the cap in params
    may be open at the same time, where an open contract is one whose status is signed, measured, ordered
    or installed (window_msr_open_contracts); closed and cancelled contracts do not count. A new contract
    may be signed only when the customer's count of open window replacement contracts is below the cap.
    When the cap is already reached, the additional openings are added to an open contract by change order
    before its order release, or the new contract waits until an open contract closes. Door contracts
    are a separate product line and never count toward this cap.
  eligibility:
  - id: open_contract_cap
    applies_to:
    - window_contract_signed
    kind: authorization
    condition: >-
      A new contract may be signed only when the customer's count of open window replacement contracts
      is below the cap.
    evidence_fields:
    - window_contracts.customer_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.customer_id
      action_bindings:
        window_contracts.customer_id: customer_id
  params:
    max_per_customer: 2
  measures:
  - window_msr_open_contracts
- id: window_agg_payment_application
  subject:
  - window_payment_received
  - window_refund_issued
  rule: >-
    Every payment is applied to exactly one contract and is never split across contracts. The payment
    goes to the contract whose contract number the customer gives; when the customer names no contract
    and holds more than one open window replacement contract, it goes to the open contract with the earliest
    signed date that still has a balance due, and to the next one only once a new payment is made. Lender
    funding is applied to the contract named on the funded financing account. A refund is always booked
    against the same contract as the payment it returns and names that payment as its source. It never
    draws on a payment recorded on another contract.
  eligibility:
  - id: refund_same_contract
    applies_to:
    - window_refund_issued
    kind: authorization
    condition: >-
      A refund is always booked against the same contract as the payment it returns and names that payment
      as its source.
    evidence_fields:
    - window_transactions.window_txn_id
    - window_transactions.window_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_transactions.window_txn_id
        - window_transactions.window_contract_id
      action_bindings:
        window_transactions.window_txn_id: source_window_txn_id
        window_transactions.window_contract_id: window_contract_id
  measures:
  - window_msr_open_contracts
- id: window_discount_programs
  subject:
  - window_contract_signed
  rule: >-
    At signing, the list price is the series base price per opening times the number of openings plus
    the options chosen. One discount program at most applies to a contract: military (active duty or veteran,
    shown by military identification at signing), senior, or first responder (sworn police, fire or EMS,
    shown by department identification at signing). The senior program applies only when the customer
    is at least the minimum age on the contract signing date according to the date of birth on the customer
    profile. When the customer qualifies for more than one program, the single program with the highest
    rate for the series is applied; programs never add together. The program rate is applied to the list
    price and the result, rounded to the cent, is the signed contract price. A contract may be signed
    only when the signed contract price reaches the series minimum contract amount and the opening count
    does not exceed the series maximum. Discount programs are chosen at signing only and are never added
    afterwards. The warranty plan is also fixed at signing: the series' included plan is the default,
    a higher plan is bought at signing for the warranty charter's upgrade price per opening and is part
    of the signed contract price, a plan lower than the series' included plan cannot be chosen, and the
    plan never changes after signing.
  eligibility:
  - id: senior_age
    applies_to:
    - window_contract_signed
    kind: authorization
    condition: >-
      The senior program applies only when the customer is at least the minimum age on the contract signing
      date according to the date of birth on the customer profile.
    evidence_fields:
    - customers.customer_id
    - customers.date_of_birth
    - window_contracts.signed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: series_size_limits
    applies_to:
    - window_contract_signed
    kind: authorization
    condition: >-
      A contract may be signed only when the signed contract price reaches the series minimum contract
      amount and the opening count does not exceed the series maximum.
    evidence_fields:
    - window_contracts.contract_price
    - window_contracts.opening_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.contract_price
        - window_contracts.opening_count
      action_bindings:
        window_contracts.contract_price: contract_price
        window_contracts.opening_count: opening_count
  params:
    per_tier:
      Ridgeline 1100 Series Vinyl:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 2200 Series Vinyl:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 3300 Series Premium Vinyl:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 4400 Series Composite:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 5500 Series Fiberglass:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 6600 Series Wood-Clad:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
    min_age: =senior_discount_min_age
- id: window_booking_deposit
  subject:
  - window_payment_received
  - window_measure_visit
  rule: >-
    Every contract takes a booking deposit before the final measure. For a contract paid by cash, check
    or card, the required deposit is the larger of the series deposit percentage of the signed contract
    price and the series deposit minimum, but never more than the signed contract price. For a contract
    whose payment method is Ridgeline financing, the required deposit is the series financed deposit percentage
    of the signed contract price with no minimum, and is zero where that percentage is zero. Amounts are
    rounded to the cent. The deposit is due within the series deposit window, counted in calendar days
    from the day after the contract signing date. The final measure visit is booked only after the required
    deposit has been received in full. The final measure is offered within the series measure booking
    window counted in business days (Monday through Friday, excluding U.S. federal holidays) from the
    day after the deposit is complete. Money received before order release up to the required deposit
    is recorded as booking_deposit and anything beyond it as progress_payment. A single card payment may
    not exceed the card limit; a larger amount is split into separate card payments on different dates
    or paid by check or ACH. A deposit that has not arrived by the end of the deposit window does not
    cancel the contract by itself; the measure simply stays unbooked.
  eligibility:
  - id: deposit_before_measure
    applies_to:
    - window_measure_visit
    kind: authorization
    condition: >-
      The final measure visit is booked only after the required deposit has been received in full.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_transactions.amount
    - window_transactions.payment_kind
    - window_contracts.contract_price
    - window_contracts.payment_method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
  params:
    deposit_pct: =booking_deposit_pct
    deposit_min: =booking_deposit_min
    financed_pct: =financed_deposit_pct
    due_days: =deposit_due_days
    measure_offer_days: =measure_booking_business_days
    card_limit: =card_payment_max_per_txn
  formula:
    required_deposit_cash: >-
      round(min(contract_price, max(contract_price * booking_deposit_pct, booking_deposit_min)), 2)
    required_deposit_financed: round(contract_price * financed_deposit_pct, 2)
- id: window_measure_visits
  subject:
  - window_measure_visit
  - window_measure_confirmed
  - window_fee_assessed
  rule: >-
    Measure appointments are performed by a Ridgeline measure technician at the home. A measure visit
    can be booked only while the contract status is signed or measured. A completed final measure confirms
    the openings and their sizes and moves the contract to measured with the measured opening count and
    the visit date. A customer_no_show (nobody gives access within 30 minutes of the appointment start)
    and a late_reschedule (a customer reschedule given with less than the series reschedule notice before
    the appointment start) are both missed appointments; a company_rescheduled appointment is never a
    missed appointment. The missed appointments of a contract are counted (window_msr_missed_measures);
    those up to the waived count carry no fee and each later one carries the series missed-appointment
    fee, assessed on the date of the missed appointment. A remeasure the customer asks for after the final
    measure is free up to the series free remeasure count (window_msr_customer_remeasures) and carries
    the series remeasure fee after that; a company_remeasure ordered by Ridgeline is always free and is
    not counted. A remeasure never changes the contract status.
  eligibility:
  - id: measure_status
    applies_to:
    - window_measure_visit
    kind: state
    condition: A measure visit can be booked only while the contract status is signed or measured.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - signed
      - measured
  params:
    notice_hours: =measure_reschedule_notice_hours
    waived_missed: =free_missed_measure_count
    missed_fee: =missed_measure_fee
    free_remeasures: =free_remeasure_count
    remeasure_charge: =remeasure_fee
  formula:
    missed_fee_due: missed_measure_fee if window_msr_missed_measures > free_missed_measure_count else
      0
    remeasure_fee_due: remeasure_fee if window_msr_customer_remeasures > free_remeasure_count else 0
  measures:
  - window_msr_missed_measures
  - window_msr_customer_remeasures
- id: window_oversize_pricing
  subject:
  - window_change_order
  - window_measure_visit
  rule: >-
    Each opening is sized in united inches, the measured width plus the measured height with each rounded
    up to the next whole inch, at the final measure. An opening up to the series standard bracket is priced
    in the base price. An opening above the standard bracket and up to the series maximum carries the
    series oversize surcharge per opening, written as one change order line of kind oversize_surcharge
    dated the final measure date for all such openings together; this line is not a customer change order
    and never counts toward the free or maximum change-order counts. An opening above the series maximum
    cannot be built in the series: before order release the customer either moves the contract to a series
    whose maximum covers it or removes that opening for credit.
  eligibility: []
  params:
    per_tier:
      Ridgeline 1100 Series Vinyl:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 2200 Series Vinyl:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 3300 Series Premium Vinyl:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 4400 Series Composite:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 5500 Series Fiberglass:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 6600 Series Wood-Clad:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
  formula:
    oversize_line_amount: round(oversize_surcharge_per_opening * openings_affected, 2)
- id: window_change_orders
  subject:
  - window_change_order
  - window_fee_assessed
  rule: >-
    A customer change order adds options or openings to the contract. A change order can be written only
    while the contract status is signed or measured. Once the order is released, the custom product is
    in production and no change order is accepted. Each line is priced at the series price per opening
    for the option times the openings affected; an added opening is priced at the series base price per
    opening, and options for an added opening are separate lines. Exterior color can be ordered only in
    a series where it is available. All lines written on the same date form one change order. A contract
    may carry no more customer change orders than the series maximum; a request beyond it is refused.
    The customer change orders of a contract are counted (window_msr_change_orders); those up to the series
    free count carry no fee, and each later change order carries the series change-order fee once, on
    the date it is written. Adding openings may not take the contract above the series maximum opening
    count.
  eligibility:
  - id: change_order_status
    applies_to:
    - window_change_order
    kind: state
    condition: A change order can be written only while the contract status is signed or measured.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - signed
      - measured
  params:
    free_count: =change_order_free_count
    fee: =change_order_fee
    max_count: =change_order_max_count
    option_prices:
      premium_low_e: =premium_low_e_per_opening
      triple_pane: =triple_pane_per_opening
      grilles_between_glass: =grilles_between_glass_per_opening
      exterior_color: =exterior_color_per_opening
      tempered_glass: =tempered_glass_per_opening
      laminated_glass: =laminated_glass_per_opening
      obscure_glass: =obscure_glass_per_opening
      hardware_finish: =hardware_finish_per_opening
      opening_added: =base_price_per_opening
    color_available: =exterior_color_available
  formula:
    opening_added_amount: round(base_price_per_opening * openings_affected, 2)
    change_order_fee_due: change_order_fee if window_msr_change_orders > change_order_free_count else
      0
  measures:
  - window_msr_change_orders
- id: window_price_credits
  subject:
  - window_price_credit
  rule: >-
    Credits reduce what is owed and are additive with one another, except as stated here. An opening_removed
    credit is granted only before order release (status signed or measured) and equals the series removal
    share of the base price per opening times the openings removed; if the removal would leave fewer openings
    than the minimum that must remain or bring the contract below the series minimum contract amount,
    the removal is not made and the cancellation terms apply instead. A door_bundle_discount credit equals
    the series bundle percentage of the signed contract price; it is granted on the window contract when
    the customer signs a Ridgeline door contract within the bundle window of calendar days before or after
    this contract's signed date and neither contract is cancelled, and once per pair of contracts. The
    door bundle discount is granted only when the contract's discount program is none. A referral_credit
    of the series referral amount is granted when a household the customer referred signs its own Ridgeline
    contract and that contract reaches installed status, once per referred contract number and at most
    the series maximum per contract (window_msr_referral_credits). An on_time_guarantee_credit is the
    amount the factory order charter computes and is booked when that order's credit is applied. Credits
    are never paid out in cash while a balance is owed; a credit that takes the amount owed below zero
    becomes an overpayment refunded under the refund rules.
  eligibility:
  - id: bundle_vs_program
    applies_to:
    - window_price_credit
    kind: state
    condition: The door bundle discount is granted only when the contract's discount program is none.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.discount_program
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.discount_program
      allowed:
      - none
  params:
    removal_share: =opening_removed_credit_pct
    min_remaining: =min_openings_after_removal
    bundle_window: =door_bundle_window_days
    per_tier:
      Ridgeline 1100 Series Vinyl:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 2200 Series Vinyl:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 3300 Series Premium Vinyl:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 4400 Series Composite:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 5500 Series Fiberglass:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 6600 Series Wood-Clad:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
  formula:
    opening_removed_credit: round(base_price_per_opening * opening_removed_credit_pct * openings_affected,
      2)
    door_bundle_credit: round(contract_price * door_bundle_discount_pct, 2)
  measures:
  - window_msr_referral_credits
- id: window_series_change
  subject:
  - window_series_changed
  - window_fee_assessed
  rule: >-
    A contract may move to another product series, up or down, only before order release. A series change
    can be made only while the contract status is signed or measured. The re-priced contract price is
    the current contract price plus the difference between the new and the old series base price per opening
    times the current opening count, before any discount program; where the contract carries a discount
    program, the program rate of the new series is applied to the re-priced list price instead. Option
    lines already written stay at the price they were written at. A change into a series where exterior
    color is unavailable cannot be made while the contract carries an exterior_color line. A series change
    made while the contract is measured carries the series redesign fee of the new series; one made while
    it is signed carries none. If the new series raises the required deposit, the difference is due before
    order release.
  eligibility:
  - id: series_change_status
    applies_to:
    - window_series_changed
    kind: state
    condition: A series change can be made only while the contract status is signed or measured.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - signed
      - measured
  params:
    redesign_fee: =series_change_fee
- id: window_order_release
  subject:
  - window_order_released
  rule: >-
    The confirmed specifications are released to the factory once the contract is measured. The order
    may be released only after the required booking deposit has been received in full. For an in_home
    sale, the order may be released only once the cooling-off period counted from the contract signing
    date has fully passed. Business days are counted starting the day after the contract signing date,
    skipping Sundays and U.S. federal holidays, so Saturdays count as business days. Release on the last
    day of the cooling-off period is too early; the first permitted release date is the next calendar
    day. Showroom and virtual_consultation sales carry no cooling-off wait. Release creates the factory
    production order for the contract.
  eligibility:
  - id: deposit_complete
    applies_to:
    - window_order_released
    kind: authorization
    condition: >-
      The order may be released only after the required booking deposit has been received in full.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_transactions.amount
    - window_transactions.payment_kind
    - window_contracts.contract_price
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
  - id: cooling_off_elapsed
    applies_to:
    - window_order_released
    kind: time
    condition: >-
      For an in_home sale, the order may be released only once the cooling-off period counted from the
      contract signing date has fully passed.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.signed_date
    - window_contracts.sales_channel
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contract signing date
      anchor_source: window_contracts.signed_date
      relation: not_before
      duration_source: variants.cooling_off_business_days
      unit: business_days
      counting_rule: >-
        Business days are counted starting the day after the contract signing date, skipping Sundays and
        U.S. federal holidays, so Saturdays count as business days.
      boundary: exclusive
  params:
    cooling_off_days: =cooling_off_business_days
- id: window_cooling_off_cancellation
  subject:
  - window_contract_cancelled
  - window_refund_issued
  rule: >-
    A sale made in the customer's home carries the federal three-day cooling-off right printed on the
    contract. The cooling-off right applies only to contracts whose sales channel is in_home. A cancellation
    qualifies for the cooling-off terms only when the customer's written notice of cancellation is given
    no later than the end of the cooling-off period counted from the contract signing date. Business days
    are counted starting the day after the contract signing date, skipping Sundays and U.S. federal holidays,
    so Saturdays count as business days, and notice given on the last counted business day still qualifies.
    Written notice is the signed Notice of Cancellation form, an email to the contract inbox or a letter,
    dated the day it is given or postmarked, and is recorded as a cancellation request. A qualifying cancellation
    carries no fee or charge of any kind, and every payment received is refunded in full, each against
    its own source payment, within the refund window counted in business days from receipt of the notice.
    Notice given after the period ends, or on a showroom or virtual_consultation contract, is handled
    under the standard cancellation terms.
  eligibility:
  - id: in_home_only
    applies_to:
    - window_contract_cancelled
    - window_refund_issued
    kind: authorization
    condition: The cooling-off right applies only to contracts whose sales channel is in_home.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.sales_channel
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
  - id: notice_in_period
    applies_to:
    - window_contract_cancelled
    kind: time
    condition: >-
      A cancellation qualifies for the cooling-off terms only when the customer's written notice of cancellation
      is given no later than the end of the cooling-off period counted from the contract signing date.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.signed_date
    - window_cancellation_requests.notice_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contract signing date
      anchor_source: window_contracts.signed_date
      relation: not_after
      duration_source: variants.cooling_off_business_days
      unit: business_days
      counting_rule: >-
        Business days are counted starting the day after the contract signing date, skipping Sundays and
        U.S. federal holidays, so Saturdays count as business days, and notice given on the last counted
        business day still qualifies.
      boundary: inclusive
  params:
    period_days: =cooling_off_business_days
    refund_days: =cooling_off_refund_business_days
  formula:
    cooling_off_refund_total: window_msr_paid_to_date
    cooling_off_fee: 0
  measures:
  - window_msr_paid_to_date
- id: window_standard_cancellation
  subject:
  - window_contract_cancelled
  - window_fee_assessed
  - window_refund_issued
  rule: >-
    A cancellation that does not qualify for the cooling-off terms is settled by the contract status on
    the date the written notice is given. In status signed the charge is the series pre-measure cancellation
    fee; in status measured it is the series measure-and-design charge; in status ordered it is the series
    product share of the adjusted contract value, which is the signed contract price plus the net contract
    charges (window_msr_net_charges) before the cancellation charge itself. A contract that is installed
    or closed cannot be cancelled; the customer's remedies after installation run through the service
    and warranty terms. The charge is booked as one cancellation_charge fee on the notice date. Payments
    received (window_msr_paid_to_date) are kept up to the charge; the excess is refunded as cancellation_refund
    within the refund window, taken from the most recent payments first, each refund naming its source
    payment. When payments received are below the charge, the difference stays owed. Once a contract is
    cancelled, no further change order, measure visit, or price credit other than an on_time_guarantee_credit
    already earned is booked to it.
  eligibility: []
  params:
    per_tier:
      Ridgeline 1100 Series Vinyl:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 2200 Series Vinyl:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 3300 Series Premium Vinyl:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 4400 Series Composite:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 5500 Series Fiberglass:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 6600 Series Wood-Clad:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
    refund_days: =refund_business_days
  formula:
    charge_if_signed: pre_measure_cancellation_fee
    charge_if_measured: pre_release_cancellation_fee
    charge_if_ordered: round(post_release_product_share_pct * (contract_price + window_msr_net_charges),
      2)
    refund_if_ordered: max(0, window_msr_paid_to_date - charge_if_ordered)
  measures:
  - window_msr_net_charges
  - window_msr_paid_to_date
- id: window_final_balance
  subject:
  - window_installation_completed
  - window_payment_received
  - window_fee_assessed
  - window_contract_closed
  rule: >-
    The balance due on a contract is the signed contract price plus the net contract charges (window_msr_net_charges)
    minus the payments received net of refunds (window_msr_paid_to_date). The net charges of the contract's
    installation job are collected with it, so the amount due at the end is the balance due plus those
    job charges. The remaining balance falls due on the final balance due date, the stated number of calendar
    days after the installation completion date, and is recorded as final_balance when paid. For a financed
    contract, the lender funding is recorded as lender_funding on the funding date and any remainder is
    paid by the customer. A late balance charge applies only while the contract status is installed. A
    late balance charge may be assessed only when the balance remains unpaid after the final balance due
    date, which falls the stated number of calendar days after the installation completion date. Calendar
    days are counted from the day after the installation completion date, and payment on the due date
    itself is on time. The late charge is the monthly rate times the unpaid balance for each full 30-day
    period after the due date, never less than the minimum charge, assessed once at the end of each such
    period. The contract closes once it is installed and the balance due is zero; an overpayment at that
    point is refunded as overpayment_refund.
  eligibility:
  - id: late_charge_status
    applies_to:
    - window_fee_assessed
    kind: state
    condition: A late balance charge applies only while the contract status is installed.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - installed
  - id: past_due_date
    applies_to:
    - window_fee_assessed
    kind: time
    condition: >-
      A late balance charge may be assessed only when the balance remains unpaid after the final balance
      due date, which falls the stated number of calendar days after the installation completion date.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.completion_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the installation completion date
      anchor_source: window_contracts.completion_date
      relation: not_before
      duration_source: variants.final_balance_due_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the installation completion date, and payment on
        the due date itself is on time.
      boundary: exclusive
  params:
    due_days: =final_balance_due_days
    late_rate: =late_balance_monthly_rate
    late_min: =late_balance_min_charge
  formula:
    balance_due: round(contract_price + window_msr_net_charges - window_msr_paid_to_date, 2)
    late_charge_per_period: max(late_balance_min_charge, round(late_balance_monthly_rate * balance_due,
      2))
  measures:
  - window_msr_net_charges
  - window_msr_paid_to_date
- id: window_refunds
  subject:
  - window_refund_issued
  rule: >-
    A refund returns money from one specific earlier payment and is never larger than what remains unrefunded
    of that payment. Refunds go back by the tender rule: to the card or bank account a card or ACH payment
    came from, and by mailed check for a check payment; lender funding is never refunded to the customer
    and is instead returned to the lender by the financing account's terms. A payment that has already
    been refunded in full is never refunded again. A non-cooling-off refund is issued within the refund
    window counted in business days from the date it becomes due.
  eligibility:
  - id: no_double_refund
    applies_to:
    - window_refund_issued
    kind: dedup
    condition: A payment that has already been refunded in full is never refunded again.
    evidence_fields:
    - window_transactions.source_window_txn_id
    - window_transactions.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_transactions.source_window_txn_id
      action_bindings:
        window_transactions.source_window_txn_id: source_window_txn_id
    dedup_contract:
      table: window_transactions
      mode: separate_record
      object_bindings:
        source_window_txn_id: source_window_txn_id
      duplicate_filters:
        event_type:
        - window_refund_issued
      distinct_fields:
      - refund_kind
      - txn_date
  params:
    tender_rule: =refund_tender_rule
    refund_days: =refund_business_days
