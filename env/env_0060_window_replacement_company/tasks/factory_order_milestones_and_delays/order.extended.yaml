  - result: RND(credit if elig else 0, 2)
  compute_basis:
    elig: When at least one full week late results, the order earns, dated its ship date, the weekly credit rate
      set below times the units on the order (units remade are counted once and earn nothing for their own remake
      time) times the credited weeks as the escalation schedule pays them, with the glass-supplier share then applied,
      never more than the class cap per order.
    ship_t: The standard full weeks late are the calendar days from the end of the grace period to the order's ship
      date, divided by seven and rounded down; shipping on or before the end of the grace period earns nothing.
    bm_date: Lateness is measured from the guarantee benchmark date, which is the later of the committed ship date
      and the latest revised ship date among the order's delay notices whose cause is customer hold, late acknowledgment,
      customer specification remake or weather and freight.
    bm_t: Lateness is measured from the guarantee benchmark date, which is the later of the committed ship date
      and the latest revised ship date among the order's delay notices whose cause is customer hold, late acknowledgment,
      customer specification remake or weather and freight.
    cap_n: 'The grace period follows the factory-capacity delay notices on the order: two or more such notices shorten
      it to half the class guarantee grace business days, rounded down to a whole business day; exactly one shortens
      it to the class guarantee grace business days less 2; none leaves the class guarantee grace business days.'
    grace: 'The grace period follows the factory-capacity delay notices on the order: two or more such notices shorten
      it to half the class guarantee grace business days, rounded down to a whole business day; exactly one shortens
      it to the class guarantee grace business days less 2; none leaves the class guarantee grace business days.'
    gr_t: The standard grace period ends the class guarantee grace business days after the benchmark date, counted
      starting the day after the benchmark date, Monday through Friday excluding U.S. federal holidays.
    exp_t: 'The lateness end date is set by how the units reached the branch: when the order was delivered to the
      branch later than its ship date plus the class transit time in business days, it is the branch delivery date;
      when it was delivered on or before that expected arrival, it is the expected arrival date, the ship date plus
      the class transit time in business days; when it has not been delivered, it is the ship date.'
    deliv_t: 'The lateness end date is set by how the units reached the branch: when the order was delivered to
      the branch later than its ship date plus the class transit time in business days, it is the branch delivery
      date; when it was delivered on or before that expected arrival, it is the expected arrival date, the ship
      date plus the class transit time in business days; when it has not been delivered, it is the ship date.'
    end_t: 'The lateness end date is set by how the units reached the branch: when the order was delivered to the
      branch later than its ship date plus the class transit time in business days, it is the branch delivery date;
      when it was delivered on or before that expected arrival, it is the expected arrival date, the ship date plus
      the class transit time in business days; when it has not been delivered, it is the ship date.'
    weeks_late: The full weeks late are the calendar days from the end of the grace period set below to the lateness
      end date set below, divided by seven and rounded down.
    rem_charge_n: 'The weekly credit rate per unit follows the remakes on the order: when a remake charge stands
      on the order without a waiver reversing it, the rate is half the class credit per unit per week; when no remake
      charge stands and at least one remake on the order has a company cause (factory defect, freight damage or
      company mismeasure), the rate is 1.2 times the class credit per unit per week; otherwise it is the class credit
      per unit per week.'
    rem_waived_n: 'The weekly credit rate per unit follows the remakes on the order: when a remake charge stands
      on the order without a waiver reversing it, the rate is half the class credit per unit per week; when no remake
      charge stands and at least one remake on the order has a company cause (factory defect, freight damage or
      company mismeasure), the rate is 1.2 times the class credit per unit per week; otherwise it is the class credit
      per unit per week.'
    co_remake_n: 'The weekly credit rate per unit follows the remakes on the order: when a remake charge stands
      on the order without a waiver reversing it, the rate is half the class credit per unit per week; when no remake
      charge stands and at least one remake on the order has a company cause (factory defect, freight damage or
      company mismeasure), the rate is 1.2 times the class credit per unit per week; otherwise it is the class credit
      per unit per week.'
    rate: 'The weekly credit rate per unit follows the remakes on the order: when a remake charge stands on the
      order without a waiver reversing it, the rate is half the class credit per unit per week; when no remake charge
      stands and at least one remake on the order has a company cause (factory defect, freight damage or company
      mismeasure), the rate is 1.2 times the class credit per unit per week; otherwise it is the class credit per
      unit per week.'
    notice_n: 'The escalation schedule follows the delay notices on the order, of every cause: with more notices
      than the class escalation count, the first 2 credited weeks are paid at the weekly credit rate and every credited
      week beyond 2 at 1.5 times that rate; with exactly the escalation count, one more credited week is added and
      every credited week is paid at the weekly credit rate; with fewer, every credited week is paid at the weekly
      credit rate.'
    cap_last: 'Late-notice weeks are added as well by when the most recent factory-capacity delay notice was recorded:
      after the committed ship date adds 2 weeks, on one of the three calendar days before the committed ship date
      or on it adds 1 week, and earlier or never adds none.'
    told_weeks: 'Late-notice weeks are added as well by when the most recent factory-capacity delay notice was recorded:
      after the committed ship date adds 2 weeks, on one of the three calendar days before the committed ship date
      or on it adds 1 week, and earlier or never adds none.'
    gs_n: 'A glass-supplier share is applied to the credit by the glass-supplier delay notices on the order: two
      or more such notices leave 80 percent of the credit, exactly one leaves 90 percent, and none leaves the full
      credit.'
    glass_share: 'A glass-supplier share is applied to the credit by the glass-supplier delay notices on the order:
      two or more such notices leave 80 percent of the credit, exactly one leaves 90 percent, and none leaves the
      full credit.'
    credited_weeks: The credited weeks are the full weeks late plus the late-notice weeks, counted only when at
      least one full week late results; the rate times the units times the credited weeks as the escalation schedule
      pays them is taken first, the glass-supplier share is applied to that amount, the class cap per order is applied
      after the share, and the credit is rounded to the cent once, at the end.
    credit: The credited weeks are the full weeks late plus the late-notice weeks, counted only when at least one
      full week late results; the rate times the units times the credited weeks as the escalation schedule pays
      them is taken first, the glass-supplier share is applied to that amount, the class cap per order is applied
      after the share, and the credit is rounded to the cent once, at the end.
    result: The credited weeks are the full weeks late plus the late-notice weeks, counted only when at least one
      full week late results; the rate times the units times the credited weeks as the escalation schedule pays
      them is taken first, the glass-supplier share is applied to that amount, the class cap per order is applied
      after the share, and the credit is rounded to the cent once, at the end.
    paid_weeks: 'The escalation schedule follows the delay notices on the order, of every cause: with more notices
      than the class escalation count, the first 2 credited weeks are paid at the weekly credit rate and every credited
      week beyond 2 at 1.5 times that rate; with exactly the escalation count, one more credited week is added and
      every credited week is paid at the weekly credit rate; with fewer, every credited week is paid at the weekly
      credit rate.'
  factors:
  - id: remake_rate
    effect: parameter
    decides: rate
    bindings:
    - rem_charge_n
    - rem_waived_n
    - co_remake_n
    - rate
    ladder:
    - when: a remake charge stands on the order without a waiver reversing it
      value: P('on_time_credit_per_unit_week') x K('customer_remake_share') = half the class credit per unit per
        week
    - when: no such charge, and at least one company-cause remake on the order
      value: P('on_time_credit_per_unit_week') x K('company_remake_share') = 1.2 times the class credit per unit
        per week
    - when: otherwise
      value: P('on_time_credit_per_unit_week')
    baseline:
      rate: P('on_time_credit_per_unit_week')
    evidence:
    - history
    cross_difficulty: null
  - id: lateness_end_basis
    effect: parameter
    decides: end_t
    bindings:
    - deliv_t
    - end_t
    ladder:
    - when: delivered to the branch later than the ship date plus the class transit time
      value: lateness measured to the branch delivery date
    - when: delivered on or before that expected arrival
      value: lateness measured to the expected arrival date (ship date plus class transit business days)
    - when: otherwise (not delivered)
      value: lateness measured to the ship date
    baseline:
      end_t: ship_t
    evidence:
    - date
    cross_difficulty: null
  - id: capacity_grace
    effect: parameter
    decides: grace
    bindings:
    - cap_n
    - grace
    ladder:
    - when: two or more factory-capacity delay notices
      value: P('guarantee_grace_business_days') // 2 (half the class grace, rounded down)
    - when: exactly one
      value: P('guarantee_grace_business_days') - K('grace_one_notice_less') (class grace less 2 business days)
    - when: otherwise
      value: P('guarantee_grace_business_days')
    baseline:
      grace: P('guarantee_grace_business_days')
    evidence:
    - history
    cross_difficulty: null
  - id: escalation_schedule
    effect: method
    decides: paid_weeks
    bindings:
    - notice_n
    - paid_weeks
    ladder:
    - when: more delay notices than the class escalation count
      method: first 2 credited weeks at the weekly credit rate, every credited week beyond 2 at 1.5 times that rate
    - when: exactly the escalation count
      method: one more credited week added, every credited week at the weekly credit rate
    - when: otherwise
      method: every credited week at the weekly credit rate
    baseline:
      paid_weeks: credited_weeks
    evidence:
    - history
    cross_difficulty: null
  - id: late_notice_weeks
    effect: parameter
    decides: told_weeks
    bindings:
    - cap_last
    - told_weeks
    ladder:
    - when: the most recent factory-capacity notice recorded after the committed ship date
      value: K('late_notice_after_weeks') = 2 weeks
    - when: recorded on the committed ship date or one of the three calendar days before it
      value: K('late_notice_near_weeks') = 1 week
    - when: otherwise
      value: '0'
    baseline:
      told_weeks: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: glass_supplier_share
    effect: parameter
    decides: glass_share
    bindings:
    - gs_n
    - glass_share
    ladder:
    - when: two or more glass-supplier delay notices
      value: K('glass_two_share') = 80 percent
    - when: exactly one
      value: K('glass_one_share') = 90 percent
    - when: otherwise
      value: '1.0'
    baseline:
      glass_share: '1.0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: Lateness is measured from the guarantee benchmark date, which is the later of the committed ship date
      and the latest revised ship date among the order's delay notices whose cause is customer hold, late acknowledgment,
      customer specification remake or weather and freight. The standard grace period ends the class guarantee grace
      business days after the benchmark date, counted starting the day after the benchmark date, Monday through
      Friday excluding U.S. federal holidays. The standard full weeks late are the calendar days from the end of
      the grace period to the order's ship date, divided by seven and rounded down; shipping on or before the end
      of the grace period earns nothing. The standard credit is the class credit per unit per week times the units
      on the order times the full weeks late, never more than the class cap per order, rounded to the cent.
    params:
    - guarantee_grace_business_days
    - on_time_credit_per_unit_week
    - on_time_credit_cap_per_order
  inputs:
    history:
    - table: order_milestones
      aggregate: latest
      field: revised_ship_date
      filters:
        event_type: order_delay_noticed
    - table: order_milestones
      aggregate: count
      field: order_milestone_id
      filters:
        event_type: order_delay_noticed
    - table: order_milestones
      aggregate: count
      field: order_milestone_id
      filters:
        event_type: order_charge_assessed
        charge_kind: remake_charge
    - table: order_milestones
      aggregate: count
      field: order_milestone_id
      filters:
        event_type: order_remake_logged
    cross_category: []
- id: order_ext_branch_storage_fee
  base_policy_refs:
  - order_agg_customer_orders
  - order_remakes
  - order_expedite
  - order_storage
  overwrite:
  - base_policy: order_storage
    superseded_clause: Billable days (order_msr_billable_storage_days) exclude every day of delay caused by an installation
      reschedule initiated by the company or by weather, and stop on the day installation starts or the order is
      cancelled.
    replaced_by: Billable days stop on the day installation starts or the order is cancelled, and in place of counting
      each day of delay caused by an installation reschedule initiated by the company or by weather, the free storage
      period is lengthened by 7 calendar days for every such reschedule recorded on the order's installation job,
      and the billable days are then adjusted as set below.
  - base_policy: order_storage
    superseded_clause: Billable days become weeks by counting every started seven-day period as a full week, and
      the fee is the class fee per unit per week times the units on the order times the weeks, never more than the
      class cap per order.
    replaced_by: Billable days become weeks by counting every started seven-day period as a full week, and the fee
      is the storage schedule set below applied to the weekly storage rate set below and the units on the order
      over those weeks, never more than the class cap per order, rounded to the cent.
  - base_policy: order_remakes
    superseded_clause: A remake is charged to the customer only when its cause is customer_spec_error and the order
      acknowledgment was signed by the customer.
    replaced_by: 'The condition that a remake is charged to the customer only when its cause is a customer specification
      error and the customer signed the order acknowledgment governs remake charges alone: a storage fee, which
      this policy prices, does not fall under it, nor does an expedite fee, and every remake charge remains under
      it.'
  - base_policy: order_expedite
    superseded_clause: An expedite can be requested only while the order status is entered.
    replaced_by: 'The condition that an expedite can be requested only while the order status is entered governs
      expedite fees alone: a storage fee, which this policy prices, does not fall under it, nor does a remake charge,
      and every expedite fee remains under it.'
  trigger: state_due
  subject:
  - order_charge_assessed
  computes: fee_amount
  target_tool: assess_branch_storage_97307cec
  params:
    reschedule_free_days: 7
    ext_long_days: 14
    ext_short_days: 7
    ext_long_weeks: 3
    permit_large_days: 10
    permit_days: 5
    permit_large_crew_days: 3
    bulk_units: 12
    small_units: 6
    bulk_share: 0.85
    small_share: 1.25
    band_weeks: 4
    band_rate: 1.5
    bay_units: 4
  rule: 'Billable days stop on the day installation starts or the order is cancelled, and in place of counting each
    day of delay caused by an installation reschedule initiated by the company or by weather, the free storage period
    is lengthened by 7 calendar days for every such reschedule recorded on the order''s installation job, and the
    billable days are then adjusted as set below. Billable days become weeks by counting every started seven-day
    period as a full week, and the fee is the storage schedule set below applied to the weekly storage rate set
    below and the units on the order over those weeks, never more than the class cap per order, rounded to the cent.
    The standard storage count runs over the calendar days from the day after the branch delivery date up to and
    including the day before the installation start date, or up to and including the handling date while installation
    has not started. The standard billable days are those calendar days less the class free storage days and less
    7 calendar days for each installation reschedule initiated by the company or by weather on the order''s installation
    job, never below zero. The standard storage fee is the class storage fee per unit per week times the units on
    the order times the billable days counted in started seven-day weeks, never more than the class cap per order,
    rounded to the cent. A late-shipment extension lengthens the free storage period by the full weeks late recorded
    on the on-time guarantee credit the order earned: 3 or more full weeks late add 14 calendar days, 1 or 2 full
    weeks late add 7 calendar days, and an order without an earned guarantee credit gets no extension. A permit
    wait allowance comes off the billable days by the installation job''s permit and its planned crew days: a permitted
    job with 3 or more crew days planned has 10 calendar days taken off, a permitted job with fewer than 3 crew
    days planned has 5 taken off, and a job that is not permitted has none taken off. The weekly storage rate per
    unit follows the units the installation job installs: 12 or more units are stored at 85 percent of the class
    storage fee per unit per week, 6 or fewer at 125 percent of it, and anything in between at the class storage
    fee per unit per week. The storage schedule prices the started weeks: more than 4 billable weeks are charged
    at the weekly storage rate per unit for the first 4 weeks and at 1.5 times that rate for every later week; a
    single billable week is charged for at least one full bay, the weekly storage rate times the larger of 4 units
    and the units on the order; any other number of weeks is charged at the weekly storage rate per unit for every
    week. The condition that a remake is charged to the customer only when its cause is a customer specification
    error and the customer signed the order acknowledgment governs remake charges alone: a storage fee, which this
    policy prices, does not fall under it, nor does an expedite fee, and every remake charge remains under it. The
    condition that an expedite can be requested only while the order status is entered governs expedite fees alone:
    a storage fee, which this policy prices, does not fall under it, nor does a remake charge, and every expedite
    fee remains under it. The storage fee is fixed only after the order carries the on-time guarantee credit it
    has earned whenever its shipment came in later than the guarantee grace period allows. The class billable-storage-days
    measure is read with the free-period lengthening set out here in place of its day-by-day reschedule exclusion.'
  prerequisite:
  - problem: order_ext_on_time_guarantee_claim
    kind: value_input
    gate: credit_weeks
    form: state
    policy_source: The storage fee is fixed only after the order carries the on-time guarantee credit it has earned
      whenever its shipment came in later than the guarantee grace period allows.
    condition: Whenever the order shipped later than the end of its guarantee grace period, order_milestones carries
      the order_guarantee_credit_earned row for the order with its week_count of full weeks late.
    resolved_by: file_on_time_claim_fe24f9ef
    effect: Booking the guarantee credit puts week_count on the order's earned credit; credit_weeks moves from 0
      to the full weeks late, which lengthens the free storage period and lowers the billable days.
  cross_category:
  - category: install
    as: history
    reads:
    - install_job_id
    - started_date
    - unit_count
    - permit_required
    - crew_days_planned
    - install_activities.initiated_by
    note: The storage window ends at the installation job's start, its company and weather reschedules lengthen
      the free period, and the permit allowance and weekly rate take their tiers from the installation job.
  compute:
  - start_date: CFIELD('install', 'started_date', factory_order_id=HID) or ''
  - job_id: CFIELD('install', 'install_job_id', factory_order_id=HID)
  - span_days: DAYS(F('delivered_date'), start_date) - 1 if start_date != '' else DAYS(F('delivered_date'), NOW)
  - restarts: XCOUNT('install', 'install_activities', date_field='activity_date', event_type='install_reschedule_logged',
      install_job_id=job_id, initiated_by='company') + XCOUNT('install', 'install_activities', date_field='activity_date',
      event_type='install_reschedule_logged', install_job_id=job_id, initiated_by='weather')
  - credit_n: COUNT('order_milestones', event_type='order_guarantee_credit_earned')
  - credit_weeks: (LATEST('order_milestones', 'week_count', date_field='milestone_date', event_type='order_guarantee_credit_earned')
      or 0) if credit_n > 0 else 0
  - ext_days: K('ext_long_days') if credit_weeks >= K('ext_long_weeks') else (K('ext_short_days') if credit_weeks
      >= 1 else 0)
  - permit: CFIELD('install', 'permit_required', factory_order_id=HID)
  - crew_days: CFIELD('install', 'crew_days_planned', factory_order_id=HID) or 0
  - permit_off: K('permit_large_days') if permit == True and crew_days >= K('permit_large_crew_days') else (K('permit_days')
      if permit == True and crew_days < K('permit_large_crew_days') else 0)
  - raw_days: MX(0, span_days - P('free_storage_calendar_days') - K('reschedule_free_days') * restarts - ext_days
      - permit_off)
  - weeks: -((-raw_days) // 7)
  - job_units: CFIELD('install', 'unit_count', factory_order_id=HID) or 0
  - rate: P('storage_fee_per_unit_week') * K('bulk_share') if job_units >= K('bulk_units') else (P('storage_fee_per_unit_week')
      * K('small_share') if job_units <= K('small_units') else P('storage_fee_per_unit_week'))
  - storage_charge: K('band_weeks') * rate * F('unit_count') + (weeks - K('band_weeks')) * rate * F('unit_count')
      * K('band_rate') if weeks > K('band_weeks') else (rate * MX(K('bay_units'), F('unit_count')) if weeks == 1
      else weeks * rate * F('unit_count'))
  - result: RND(MN(P('storage_fee_cap_per_order'), storage_charge), 2)
  compute_basis:
    start_date: The standard storage count runs over the calendar days from the day after the branch delivery date
      up to and including the day before the installation start date, or up to and including the handling date while
      installation has not started.
    span_days: The standard storage count runs over the calendar days from the day after the branch delivery date
      up to and including the day before the installation start date, or up to and including the handling date while
      installation has not started.
    restarts: Billable days stop on the day installation starts or the order is cancelled, and in place of counting
      each day of delay caused by an installation reschedule initiated by the company or by weather, the free storage
      period is lengthened by 7 calendar days for every such reschedule recorded on the order's installation job,
      and the billable days are then adjusted as set below.
    credit_n: 'A late-shipment extension lengthens the free storage period by the full weeks late recorded on the
      on-time guarantee credit the order earned: 3 or more full weeks late add 14 calendar days, 1 or 2 full weeks
      late add 7 calendar days, and an order without an earned guarantee credit gets no extension.'
    credit_weeks: 'A late-shipment extension lengthens the free storage period by the full weeks late recorded on
      the on-time guarantee credit the order earned: 3 or more full weeks late add 14 calendar days, 1 or 2 full
      weeks late add 7 calendar days, and an order without an earned guarantee credit gets no extension.'
    ext_days: 'A late-shipment extension lengthens the free storage period by the full weeks late recorded on the
      on-time guarantee credit the order earned: 3 or more full weeks late add 14 calendar days, 1 or 2 full weeks
      late add 7 calendar days, and an order without an earned guarantee credit gets no extension.'
    permit: 'A permit wait allowance comes off the billable days by the installation job''s permit and its planned
      crew days: a permitted job with 3 or more crew days planned has 10 calendar days taken off, a permitted job
      with fewer than 3 crew days planned has 5 taken off, and a job that is not permitted has none taken off.'
    crew_days: 'A permit wait allowance comes off the billable days by the installation job''s permit and its planned
      crew days: a permitted job with 3 or more crew days planned has 10 calendar days taken off, a permitted job
      with fewer than 3 crew days planned has 5 taken off, and a job that is not permitted has none taken off.'
    permit_off: 'A permit wait allowance comes off the billable days by the installation job''s permit and its planned
      crew days: a permitted job with 3 or more crew days planned has 10 calendar days taken off, a permitted job
      with fewer than 3 crew days planned has 5 taken off, and a job that is not permitted has none taken off.'
    raw_days: The standard billable days are those calendar days less the class free storage days and less 7 calendar
      days for each installation reschedule initiated by the company or by weather on the order's installation job,
      never below zero.
    weeks: Billable days become weeks by counting every started seven-day period as a full week, and the fee is
      the storage schedule set below applied to the weekly storage rate set below and the units on the order over
      those weeks, never more than the class cap per order, rounded to the cent.
    job_units: 'The weekly storage rate per unit follows the units the installation job installs: 12 or more units
      are stored at 85 percent of the class storage fee per unit per week, 6 or fewer at 125 percent of it, and
      anything in between at the class storage fee per unit per week.'
    rate: 'The weekly storage rate per unit follows the units the installation job installs: 12 or more units are
      stored at 85 percent of the class storage fee per unit per week, 6 or fewer at 125 percent of it, and anything
      in between at the class storage fee per unit per week.'
    result: Billable days become weeks by counting every started seven-day period as a full week, and the fee is
      the storage schedule set below applied to the weekly storage rate set below and the units on the order over
      those weeks, never more than the class cap per order, rounded to the cent.
    job_id: The standard storage count runs over the calendar days from the day after the branch delivery date up
      to and including the day before the installation start date, or up to and including the handling date while
      installation has not started.
    storage_charge: 'The storage schedule prices the started weeks: more than 4 billable weeks are charged at the
      weekly storage rate per unit for the first 4 weeks and at 1.5 times that rate for every later week; a single
      billable week is charged for at least one full bay, the weekly storage rate times the larger of 4 units and
      the units on the order; any other number of weeks is charged at the weekly storage rate per unit for every
      week.'
  factors:
  - id: late_shipment_extension
    effect: parameter
    decides: ext_days
    bindings:
    - credit_n
    - credit_weeks
    - ext_days
    ladder:
    - when: an earned on-time guarantee credit recording 3 or more full weeks late
      value: K('ext_long_days') = 14 calendar days
    - when: an earned credit recording 1 or 2 full weeks late
      value: K('ext_short_days') = 7 calendar days
    - when: otherwise
      value: '0'
    baseline:
      ext_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: permit_wait_allowance
    effect: parameter
    decides: permit_off
    bindings:
    - permit
    - crew_days
    - permit_off
    ladder:
    - when: a permitted installation job with 3 or more crew days planned
      value: K('permit_large_days') = 10 calendar days
    - when: a permitted job with fewer than 3 crew days planned
      value: K('permit_days') = 5 calendar days
    - when: otherwise
      value: '0'
    baseline:
      permit_off: '0'
    evidence:
    - cross_category
    cross_difficulty: install
  - id: order_size_rate
    effect: parameter
    decides: rate
    bindings:
    - job_units
    - rate
    ladder:
    - when: the installation job installs 12 or more units
      value: P('storage_fee_per_unit_week') x K('bulk_share') = 85 percent of the class rate
    - when: 6 or fewer units
      value: P('storage_fee_per_unit_week') x K('small_share') = 125 percent of the class rate
    - when: otherwise
      value: P('storage_fee_per_unit_week')
    baseline:
      rate: P('storage_fee_per_unit_week')
    evidence:
    - cross_category
    cross_difficulty: install
  - id: long_storage_schedule
    effect: method
    decides: storage_charge
    bindings:
    - span_days
    - weeks
    - storage_charge
    ladder:
    - when: more than 4 billable weeks
      method: first 4 weeks at the weekly rate per unit, every later week at 1.5 times that rate
    - when: a single billable week
      method: 'one-bay minimum: the weekly rate times the larger of 4 units and the units on the order'
    - when: otherwise
      method: the weekly rate per unit for every week
    baseline:
      storage_charge: weeks * rate * F('unit_count')
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  baseline:
    rule: The standard storage count runs over the calendar days from the day after the branch delivery date up
      to and including the day before the installation start date, or up to and including the handling date while
      installation has not started. The standard billable days are those calendar days less the class free storage
      days and less 7 calendar days for each installation reschedule initiated by the company or by weather on the
      order's installation job, never below zero. The standard storage fee is the class storage fee per unit per
      week times the units on the order times the billable days counted in started seven-day weeks, never more than
      the class cap per order, rounded to the cent.
    params:
    - free_storage_calendar_days
    - storage_fee_per_unit_week
    - storage_fee_cap_per_order
  inputs:
    history:
    - table: order_milestones
      aggregate: latest
      field: week_count
      filters:
        event_type: order_guarantee_credit_earned
    - category: install
      table: install_activities
      aggregate: count
      field: install_activity_id
      filters:
        event_type: install_reschedule_logged
    cross_category:
    - install
