  compute_basis:
    ent_t: The return window closes on the last of the class acknowledgment return business days, counted starting
      the day after the order entry date, Monday through Friday excluding U.S. federal holidays.
    win_t: The return window closes on the last of the class acknowledgment return business days, counted starting
      the day after the order entry date, Monday through Friday excluding U.S. federal holidays.
    sig_date: The standard late-acknowledgment shift is the business days of signature lateness, counted from the
      day after the return window closes up to and including the date the acknowledgment was signed.
    ack_n: The standard late-acknowledgment shift is the business days of signature lateness, counted from the day
      after the return window closes up to and including the date the acknowledgment was signed.
    sig_t: The standard late-acknowledgment shift is the business days of signature lateness, counted from the day
      after the return window closes up to and including the date the acknowledgment was signed.
    cur_t: The late-acknowledgment revised ship date is the current ship date moved later by the late-acknowledgment
      shift, counted in business days starting the day after the current ship date.
    hold_t: 'The business days of signature lateness stop at an end date set by how the signature came in: when
      the acknowledgment was signed while the order was on a customer hold (its hold start date falls on or before
      the signature date and no hold release was recorded from the hold start date up to the day before the signature),
      they are counted up to and including the hold start date; when it was not signed during a hold and the most
      recent factory-capacity or glass-supplier delay notice on the order is dated after the return window closed
      and on or before the signature date, they are counted up to and including the date of that notice; otherwise
      they are counted up to and including the signature date.'
    rel_last: 'The business days of signature lateness stop at an end date set by how the signature came in: when
      the acknowledgment was signed while the order was on a customer hold (its hold start date falls on or before
      the signature date and no hold release was recorded from the hold start date up to the day before the signature),
      they are counted up to and including the hold start date; when it was not signed during a hold and the most
      recent factory-capacity or glass-supplier delay notice on the order is dated after the return window closed
      and on or before the signature date, they are counted up to and including the date of that notice; otherwise
      they are counted up to and including the signature date.'
    held_at_sig: 'The business days of signature lateness stop at an end date set by how the signature came in:
      when the acknowledgment was signed while the order was on a customer hold (its hold start date falls on or
      before the signature date and no hold release was recorded from the hold start date up to the day before the
      signature), they are counted up to and including the hold start date; when it was not signed during a hold
      and the most recent factory-capacity or glass-supplier delay notice on the order is dated after the return
      window closed and on or before the signature date, they are counted up to and including the date of that notice;
      otherwise they are counted up to and including the signature date.'
    fac_last: 'The business days of signature lateness stop at an end date set by how the signature came in: when
      the acknowledgment was signed while the order was on a customer hold (its hold start date falls on or before
      the signature date and no hold release was recorded from the hold start date up to the day before the signature),
      they are counted up to and including the hold start date; when it was not signed during a hold and the most
      recent factory-capacity or glass-supplier delay notice on the order is dated after the return window closed
      and on or before the signature date, they are counted up to and including the date of that notice; otherwise
      they are counted up to and including the signature date.'
    fac_t: 'The business days of signature lateness stop at an end date set by how the signature came in: when the
      acknowledgment was signed while the order was on a customer hold (its hold start date falls on or before the
      signature date and no hold release was recorded from the hold start date up to the day before the signature),
      they are counted up to and including the hold start date; when it was not signed during a hold and the most
      recent factory-capacity or glass-supplier delay notice on the order is dated after the return window closed
      and on or before the signature date, they are counted up to and including the date of that notice; otherwise
      they are counted up to and including the signature date.'
    end_t: 'The business days of signature lateness stop at an end date set by how the signature came in: when the
      acknowledgment was signed while the order was on a customer hold (its hold start date falls on or before the
      signature date and no hold release was recorded from the hold start date up to the day before the signature),
      they are counted up to and including the hold start date; when it was not signed during a hold and the most
      recent factory-capacity or glass-supplier delay notice on the order is dated after the return window closed
      and on or before the signature date, they are counted up to and including the date of that notice; otherwise
      they are counted up to and including the signature date.'
    lat_n: 'The business days of signature lateness stop at an end date set by how the signature came in: when the
      acknowledgment was signed while the order was on a customer hold (its hold start date falls on or before the
      signature date and no hold release was recorded from the hold start date up to the day before the signature),
      they are counted up to and including the hold start date; when it was not signed during a hold and the most
      recent factory-capacity or glass-supplier delay notice on the order is dated after the return window closed
      and on or before the signature date, they are counted up to and including the date of that notice; otherwise
      they are counted up to and including the signature date.'
    colored: 'Paint-line rebooking then adds business days to the late-acknowledgment shift according to the openings
      priced on the exterior color change orders of the window contract the order builds: openings numbering at
      least half of the units on the order add 2 business days, at least one opening but fewer than half adds 1
      business day, and no such opening adds nothing.'
    paint_days: 'Paint-line rebooking then adds business days to the late-acknowledgment shift according to the
      openings priced on the exterior color change orders of the window contract the order builds: openings numbering
      at least half of the units on the order add 2 business days, at least one opening but fewer than half adds
      1 business day, and no such opening adds nothing.'
    grilles: 'Insert and hardware reordering adds business days to the late-acknowledgment shift as well: a grilles-between-glass
      change order on that window contract adds 2 business days, a hardware finish change order without any grilles-between-glass
      change order adds 1 business day, and neither adds nothing.'
    hardware: 'Insert and hardware reordering adds business days to the late-acknowledgment shift as well: a grilles-between-glass
      change order on that window contract adds 2 business days, a hardware finish change order without any grilles-between-glass
      change order adds 1 business day, and neither adds nothing.'
    insert_days: 'Insert and hardware reordering adds business days to the late-acknowledgment shift as well: a
      grilles-between-glass change order on that window contract adds 2 business days, a hardware finish change
      order without any grilles-between-glass change order adds 1 business day, and neither adds nothing.'
    raw_n: 'Cut-list regeneration adds business days to the late-acknowledgment shift by how far the signature date
      itself missed the window, taken as the business days from the day after the window closes up to and including
      the signature date: when it missed by more than 5 such business days, the order waits for the plant''s next
      weekly cut-list run on a Friday and adds the business days from the day after the signature date up to and
      including the first Friday after the signature date; when it missed by 3 to 5, it adds 1 business day; when
      it missed by fewer than 3, it adds nothing.'
    cut_days: 'Cut-list regeneration adds business days to the late-acknowledgment shift by how far the signature
      date itself missed the window, taken as the business days from the day after the window closes up to and including
      the signature date: when it missed by more than 5 such business days, the order waits for the plant''s next
      weekly cut-list run on a Friday and adds the business days from the day after the signature date up to and
      including the first Friday after the signature date; when it missed by 3 to 5, it adds 1 business day; when
      it missed by fewer than 3, it adds nothing.'
    shift: The late-acknowledgment shift is the business days of signature lateness plus the paint-line, insert
      and cut-list days, all added as whole business days before the late-acknowledgment revised ship date is counted.
    rev_t: The late-acknowledgment revised ship date is the current ship date moved later by the late-acknowledgment
      shift, counted in business days starting the day after the current ship date.
    result: The figure recorded with the late-acknowledgment notice is the late-acknowledgment revised ship date
      written as the number of calendar days from the handling date to that date.
    cut_k: 'Cut-list regeneration adds business days to the late-acknowledgment shift by how far the signature date
      itself missed the window, taken as the business days from the day after the window closes up to and including
      the signature date: when it missed by more than 5 such business days, the order waits for the plant''s next
      weekly cut-list run on a Friday and adds the business days from the day after the signature date up to and
      including the first Friday after the signature date; when it missed by 3 to 5, it adds 1 business day; when
      it missed by fewer than 3, it adds nothing.'
    cutrun_n: 'Cut-list regeneration adds business days to the late-acknowledgment shift by how far the signature
      date itself missed the window, taken as the business days from the day after the window closes up to and including
      the signature date: when it missed by more than 5 such business days, the order waits for the plant''s next
      weekly cut-list run on a Friday and adds the business days from the day after the signature date up to and
      including the first Friday after the signature date; when it missed by 3 to 5, it adds 1 business day; when
      it missed by fewer than 3, it adds nothing.'
  factors:
  - id: signature_count_endpoint
    effect: parameter
    decides: end_t
    bindings:
    - hold_t
    - rel_last
    - held_at_sig
    - fac_last
    - fac_t
    - end_t
    ladder:
    - when: the acknowledgment was signed while the order was on a customer hold (hold start date on or before the
        signature date, no hold release recorded in between)
      value: business days of signature lateness counted up to and including the hold start date
    - when: not signed during a hold, and the most recent factory-capacity or glass-supplier delay notice is dated
        after the window closed and on or before the signature date
      value: business days of signature lateness counted up to and including that notice's date
    - when: otherwise
      value: business days of signature lateness counted up to and including the signature date
    baseline:
      end_t: sig_t
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: paint_line_rebooking
    effect: parameter
    decides: paint_days
    bindings:
    - colored
    - paint_days
    ladder:
    - when: exterior color change orders price openings numbering at least half of the order's units
      value: K('paint_major_days') = 2 business days
    - when: at least one such opening but fewer than half of the units
      value: K('paint_minor_days') = 1 business day
    - when: otherwise
      value: '0'
    baseline:
      paint_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: window
  - id: insert_hardware_reorder
    effect: parameter
    decides: insert_days
    bindings:
    - grilles
    - hardware
    - insert_days
    ladder:
    - when: a grilles-between-glass change order on the window contract
      value: K('grilles_days') = 2 business days
    - when: a hardware finish change order and no grilles-between-glass change order
      value: K('hardware_days') = 1 business day
    - when: otherwise
      value: '0'
    baseline:
      insert_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: window
  - id: cut_list_regeneration
    effect: method
    decides: cut_days
    bindings:
    - raw_n
    - cut_days
    ladder:
    - when: the signature date came more than 5 business days after the window closed
      method: add the business days from the day after the signature date up to and including the first Friday after
        it (the next weekly cut-list run)
    - when: 3 to 5 business days after the window closed
      method: add a fixed K('cutlist_mid_days') = 1 business day
    - when: otherwise
      method: add nothing
    baseline:
      cut_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The return window closes on the last of the class acknowledgment return business days, counted starting
      the day after the order entry date, Monday through Friday excluding U.S. federal holidays. The standard late-acknowledgment
      shift is the business days of signature lateness, counted from the day after the return window closes up to
      and including the date the acknowledgment was signed. The late-acknowledgment revised ship date is the current
      ship date moved later by the late-acknowledgment shift, counted in business days starting the day after the
      current ship date. The figure recorded with the late-acknowledgment notice is the late-acknowledgment revised
      ship date written as the number of calendar days from the handling date to that date.
    params:
    - acknowledgment_return_business_days
  inputs:
    history:
    - table: order_milestones
      aggregate: latest
      field: milestone_date
      filters:
        event_type: order_milestone_logged
        milestone_kind: acknowledgment_signed
    - table: order_milestones
      aggregate: latest
      field: milestone_date
      filters:
        event_type: order_delay_noticed
    - category: window
      table: window_transactions
      aggregate: sum
      field: openings_affected
      filters:
        event_type: window_change_order
        change_kind: exterior_color
    - category: window
      table: window_transactions
      aggregate: count
      field: window_txn_id
      filters:
        event_type: window_change_order
    cross_category:
    - window
- id: order_ext_hold_release_requote
  base_policy_refs:
  - order_holds
  overwrite:
  - base_policy: order_holds
    superseded_clause: At release the current ship date is reset to the release date plus the class standard lead
      time in business days, and a delay notice with cause customer_hold records the new date.
    replaced_by: At release the current ship date is reset to the requoted ship date worked out below, and a delay
      notice with cause customer hold records that new date.
  trigger: on_request
  subject:
  - order_hold_released
  computes: days_to_new_ship_date
  target_tool: release_customer_hold_268345ec
  params:
    short_hold_days: 30
    summer_days: 3
    shoulder_days: 1
    capacity_two_days: 3
    capacity_one_days: 2
    glass_notice_days: 2
    glass_received_days: 1
    capacity_window_months: 3
  rule: 'At release the current ship date is reset to the requoted ship date worked out below, and a delay notice
    with cause customer hold records that new date. The standard requoted ship date is the release date plus the
    class standard lead time in business days, counted starting the day after the release date, Monday through Friday
    excluding U.S. federal holidays. The release date is the handling date on which the hold is released. The figure
    recorded at release is the requoted ship date written as the number of calendar days from the release date to
    that date. How the requoted ship date is first set depends on how long the hold ran, counted in calendar days
    from the hold start date to the release date, and on whether the order acknowledgment has been signed: a hold
    of at most 30 calendar days on an order whose acknowledgment is signed keeps its production slot, so the current
    ship date is moved later by the business days of the hold, counted from the day after the hold start date up
    to and including the release date; a hold longer than 30 calendar days but within the class maximum hold length
    on an order whose acknowledgment is signed is requoted from the release date by the business days of lead that
    remained when the hold began (counted from the day after the hold start date up to and including the current
    ship date) plus the class production queue days; any other hold is requoted from the release date by the class
    standard lead time. Seasonal reloading then adds business days by the month of the release date: a release in
    June, July or August adds 3 business days, a release in April, May, September or October adds 1 business day,
    and a release in any other month adds nothing. Capacity resequencing adds business days by the factory-capacity
    delay notices recorded on the order less than three whole calendar months before the release date (a notice
    dated three or more whole months before it does not count): two or more such notices add 3 business days, one
    adds 2 business days, and none adds nothing. Glass re-reservation adds business days as well: an order carrying
    a glass-supplier delay notice adds 2 business days, an order without one whose glass received checkpoint is
    on record adds 1 business day, and any other order adds nothing. The seasonal, capacity and glass days are added
    together and counted in business days starting the day after the date first set, and the result is the requoted
    ship date. The ship date set at a hold''s release is worked out only after the order carries a delay notice
    with cause late acknowledgment whenever its acknowledgment was signed after the return window. The class parameter
    naming the hold requote basis (release date plus standard lead) describes only the standard requote above; the
    requote set out here governs the ship date set at release.'
  prerequisite:
  - problem: order_ext_late_acknowledgment_shift
    kind: value_input
    gate: cur_t
    form: state
    policy_source: The ship date set at a hold's release is worked out only after the order carries a delay notice
      with cause late acknowledgment whenever its acknowledgment was signed after the return window.
    condition: Whenever the order's acknowledgment_signed checkpoint is dated after the return window, order_milestones
      carries an order_delay_noticed row with delay_cause late_acknowledgment for the order, and factory_orders.current_ship_date
      already reflects that notice's revised_ship_date.
    resolved_by: record_late_acknowledgment_notice_952cb75c
    effect: Recording the late-acknowledgment notice moves factory_orders.current_ship_date later; cur_t, the current
      ship date that a slot-keeping or remaining-lead requote starts from, changes, and the requoted date moves
      with it.
  cross_category: []
  compute:
