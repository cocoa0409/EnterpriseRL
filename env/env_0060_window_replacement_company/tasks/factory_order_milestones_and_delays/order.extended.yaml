      the current ship date) plus the class production queue days; any other hold is requoted from the release date
      by the class standard lead time.'
    req_t: 'How the requoted ship date is first set depends on how long the hold ran, counted in calendar days from
      the hold start date to the release date, and on whether the order acknowledgment has been signed: a hold of
      at most 30 calendar days on an order whose acknowledgment is signed keeps its production slot, so the current
      ship date is moved later by the business days of the hold, counted from the day after the hold start date
      up to and including the release date; a hold longer than 30 calendar days but within the class maximum hold
      length on an order whose acknowledgment is signed is requoted from the release date by the business days of
      lead that remained when the hold began (counted from the day after the hold start date up to and including
      the current ship date) plus the class production queue days; any other hold is requoted from the release date
      by the class standard lead time.'
    rel_month: 'Seasonal reloading then adds business days by the month of the release date: a release in June,
      July or August adds 3 business days, a release in April, May, September or October adds 1 business day, and
      a release in any other month adds nothing.'
    season_days: 'Seasonal reloading then adds business days by the month of the release date: a release in June,
      July or August adds 3 business days, a release in April, May, September or October adds 1 business day, and
      a release in any other month adds nothing.'
    cap_n: 'Capacity resequencing adds business days by the factory-capacity delay notices recorded on the order
      less than three whole calendar months before the release date (a notice dated three or more whole months before
      it does not count): two or more such notices add 3 business days, one adds 2 business days, and none adds
      nothing.'
    cap_days: 'Capacity resequencing adds business days by the factory-capacity delay notices recorded on the order
      less than three whole calendar months before the release date (a notice dated three or more whole months before
      it does not count): two or more such notices add 3 business days, one adds 2 business days, and none adds
      nothing.'
    glass_notice_n: 'Glass re-reservation adds business days as well: an order carrying a glass-supplier delay notice
      adds 2 business days, an order without one whose glass received checkpoint is on record adds 1 business day,
      and any other order adds nothing.'
    glass_recv_n: 'Glass re-reservation adds business days as well: an order carrying a glass-supplier delay notice
      adds 2 business days, an order without one whose glass received checkpoint is on record adds 1 business day,
      and any other order adds nothing.'
    glass_days: 'Glass re-reservation adds business days as well: an order carrying a glass-supplier delay notice
      adds 2 business days, an order without one whose glass received checkpoint is on record adds 1 business day,
      and any other order adds nothing.'
    extra: The seasonal, capacity and glass days are added together and counted in business days starting the day
      after the date first set, and the result is the requoted ship date.
    fin_t: The seasonal, capacity and glass days are added together and counted in business days starting the day
      after the date first set, and the result is the requoted ship date.
    result: The figure recorded at release is the requoted ship date written as the number of calendar days from
      the release date to that date.
  factors:
  - id: requote_basis
    effect: method
    decides: req_t
    bindings:
    - hold_days
    - ack_signed
    - req_t
    ladder:
    - when: hold of at most 30 calendar days AND the acknowledgment is signed
      method: 'slot kept: current ship date moved later by the business days of the hold'
    - when: hold longer than 30 calendar days but within the class maximum hold length AND the acknowledgment is
        signed
      method: release date plus the business days of lead remaining at the hold start plus the class production
        queue days
    - when: otherwise
      method: release date plus the class standard lead time
    baseline:
      req_t: std_t
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: seasonal_reload
    effect: parameter
    decides: season_days
    bindings:
    - rel_month
    - season_days
    ladder:
    - when: release in June, July or August
      value: K('summer_days') = 3 business days
    - when: release in April, May, September or October
      value: K('shoulder_days') = 1 business day
    - when: otherwise
      value: '0'
    baseline:
      season_days: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: capacity_resequencing
    effect: parameter
    decides: cap_days
    bindings:
    - cap_n
    - cap_days
    ladder:
    - when: two or more factory-capacity delay notices on the order dated less than three whole calendar months
        before the release date
      value: K('capacity_two_days') = 3 business days
    - when: exactly one such notice
      value: K('capacity_one_days') = 2 business days
    - when: otherwise
      value: '0'
    baseline:
      cap_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: glass_rereservation
    effect: parameter
    decides: glass_days
    bindings:
    - glass_notice_n
    - glass_recv_n
    - glass_days
    ladder:
    - when: a glass-supplier delay notice on the order
      value: K('glass_notice_days') = 2 business days
    - when: no glass-supplier delay notice and a glass received checkpoint on record
      value: K('glass_received_days') = 1 business day
    - when: otherwise
      value: '0'
    baseline:
      glass_days: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The standard requoted ship date is the release date plus the class standard lead time in business days,
      counted starting the day after the release date, Monday through Friday excluding U.S. federal holidays. The
      release date is the handling date on which the hold is released. The figure recorded at release is the requoted
      ship date written as the number of calendar days from the release date to that date.
    params:
    - standard_lead_time_business_days
  inputs:
    history:
    - table: order_milestones
      aggregate: count
      field: order_milestone_id
      within_months: 3
      filters:
        event_type: order_delay_noticed
        delay_cause: factory_capacity
    - table: order_milestones
      aggregate: count
      field: order_milestone_id
      filters:
        event_type: order_delay_noticed
        delay_cause: glass_supplier
    - table: order_milestones
      aggregate: count
      field: order_milestone_id
      filters:
        event_type: order_milestone_logged
    cross_category: []
- id: order_ext_expedite_fee
  base_policy_refs:
  - order_agg_customer_orders
  - order_remakes
  - order_expedite
  - order_storage
  overwrite:
  - base_policy: order_expedite
    superseded_clause: The expedite fee is the class fee per unit times the units on the order, never less than
      the class minimum fee, booked on the request date.
    replaced_by: In classes where it is available, the expedite fee is booked on the request date as the per-unit
      charge plus the paint-line, oversize and holiday add-ons, never less than the class minimum expedite fee,
      with the program discount then taken off that amount.
  - base_policy: order_remakes
    superseded_clause: A remake is charged to the customer only when its cause is customer_spec_error and the order
      acknowledgment was signed by the customer.
    replaced_by: 'The condition that a remake is charged to the customer only when its cause is a customer specification
      error and the customer signed the order acknowledgment governs remake charges alone: neither an expedite fee,
      which this policy prices, nor a storage fee falls under it, and every remake charge remains under it.'
  - base_policy: order_storage
    superseded_clause: Storage is charged only for days after the free storage period counted from the branch delivery
      date.
    replaced_by: 'The condition that storage is charged only for days after the free storage period counted from
      the branch delivery date governs storage fees alone: neither an expedite fee, which this policy prices, nor
      a remake charge falls under it, and every storage fee remains under it.'
  trigger: on_request
  subject:
  - order_charge_assessed
  computes: fee_amount
  target_tool: request_expedited_build_5d45bf5f
  params:
    rate_deep: 70.0
    rate_shallow: 40.0
    deep_from_days: 15
    shallow_to_days: 5
    volume_first_units: 10
    volume_beyond_share: 0.5
    flat_max_units: 3
    paint_major_per_opening: 20.0
    paint_minor_per_opening: 10.0
    oversize_major_per_opening: 30.0
    oversize_minor_per_opening: 20.0
    oversize_major_from: 3
    holiday_two_per_unit: 15.0
    holiday_one_per_unit: 8.0
    discount_service: 0.15
    discount_senior: 0.1
  rule: 'In classes where it is available, the expedite fee is booked on the request date as the per-unit charge
    plus the paint-line, oversize and holiday add-ons, never less than the class minimum expedite fee, with the
    program discount then taken off that amount. The standard expedite fee is the class expedite fee per unit times
    the units on the order, never less than the class minimum expedite fee, booked on the request date and rounded
    to the cent. The expedited target ship date is the request date plus the class expedite lead time in business
    days, counted starting the day after the request date, Monday through Friday excluding U.S. federal holidays.
    The per-unit rate depends on how far the expedite pulls the order in, taken as the business days counted from
    the day after the expedited target ship date up to and including the order''s current ship date: 15 or more
    such business days are charged at 70 dollars per unit, 5 or fewer at 40 dollars per unit, and anything in between
    at the class expedite fee per unit. The per-unit charge applies that rate according to the units on the signed
    order acknowledgment that covers the most units: when more than 10 units are acknowledged, the first 10 are
    charged at the full rate and every unit beyond 10 at half the rate; when 3 or fewer are acknowledged, the per-unit
    charge is the class minimum expedite fee as one flat amount; otherwise every unit on the order is charged at
    the rate. A paint-line priority add-on is charged on the openings priced on the exterior color change orders
    of the window contract the order builds: when those openings number at least half of the units on the order,
    20 dollars per such opening; when there is at least one but fewer than half of the units, 10 dollars per such
    opening; when there is none, nothing. An oversize handling add-on is charged on the oversize openings recorded
    at the most recent completed measure visit of that window contract: 3 or more oversize openings are charged
    30 dollars each, 1 or 2 are charged 20 dollars each, and none adds nothing. A holiday overtime add-on is charged
    per unit on the order by the U.S. federal holidays that fall on weekdays after the request date up to and including
    the expedited target ship date: two or more such holidays add 15 dollars per unit, one adds 8 dollars per unit,
    and none adds nothing. The program discount follows the discount program on that window contract: a military
    or first responder program takes 15 percent off, a senior program takes 10 percent off, and no program takes
    nothing off. The per-unit charge and the three add-ons are summed first, that sum is raised to the class minimum
    expedite fee when it falls below it, the program discount is taken off the resulting amount, and the fee is
    rounded to the cent once, at the end. The condition that a remake is charged to the customer only when its cause
    is a customer specification error and the customer signed the order acknowledgment governs remake charges alone:
    neither an expedite fee, which this policy prices, nor a storage fee falls under it, and every remake charge
    remains under it. The condition that storage is charged only for days after the free storage period counted
    from the branch delivery date governs storage fees alone: neither an expedite fee, which this policy prices,
    nor a remake charge falls under it, and every storage fee remains under it. The expedite fee is not fixed until
    the order''s status reads entered and, where the order was put on hold, a delay notice with cause customer hold
    records the ship date set when that hold was released.'
