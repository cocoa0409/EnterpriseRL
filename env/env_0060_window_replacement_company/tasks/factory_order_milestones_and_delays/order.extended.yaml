    - corr_t
    - glass_after
    - glass_t
    - start_t
    ladder:
    - when: an acknowledgment signature dated after the remake (the corrected acknowledgment)
      value: the date of the most recent such signature
    - when: no such signature, and the most recent glass received checkpoint is dated after the remake
      value: that glass received date
    - when: otherwise
      value: the remake date
    baseline:
      start_t: rmk_t
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: glass_recutting
    effect: method
    decides: frame_lead
    bindings:
    - glass_n
    - lowe_n
    - frame_lead
    ladder:
    - when: a triple-pane or laminated glass change order on the window contract
      method: 'sealed units reordered alongside the frame rebuild: the longer of the class remake lead time and
        the 35-business-day sealed-unit lead'
    - when: a premium low-E change order and neither of those
      method: 'glass cut in-house after the frame: the class remake lead time plus K(''low_e_days'') = 2 business
        days'
    - when: otherwise
      method: the class remake lead time
    baseline:
      frame_lead: P('remake_lead_time_business_days')
    evidence:
    - cross_category
    - history
    cross_difficulty: window
  - id: finish_matching
    effect: parameter
    decides: finish_days
    bindings:
    - colored
    - finish_days
    ladder:
    - when: exterior color openings at least half of the units on the order
      value: K('finish_major_days') = 3 business days
    - when: at least one but fewer than half
      value: K('finish_minor_days') = 2 business days
    - when: otherwise
      value: '0'
    baseline:
      finish_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: window
  - id: line_requeue
    effect: parameter
    decides: requeue_days
    bindings:
    - earlier_n
    - requeue_days
    ladder:
    - when: two or more company-cause remakes on the order
      value: P('production_queue_business_days') + K('requeue_extra_days')
    - when: exactly one company-cause remake
      value: P('production_queue_business_days')
    - when: otherwise
      value: '0'
    baseline:
      requeue_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: seasonal_line_load
    effect: parameter
    decides: season_days
    bindings:
    - rmk_month
    - season_days
    ladder:
    - when: remake in April, May or June
      value: K('spring_days') = 3 business days
    - when: remake in July, August or September
      value: K('summer_days') = 2 business days
    - when: otherwise
      value: '0'
    baseline:
      season_days: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: insert_matching
    effect: parameter
    decides: insert_days
    bindings:
    - grilles
    - hardware
    - insert_days
    ladder:
    - when: a grilles-between-glass change order on the window contract
      value: K('grilles_days') = 2 business days
    - when: a hardware finish change order and no grilles-between-glass change order
      value: K('hardware_days') = 1 business day
    - when: otherwise
      value: '0'
    baseline:
      insert_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: window
  baseline:
    rule: As the standard rule, the rebuild of a customer specification remake starts on the date of the most recent
      remake on the order recorded with cause customer specification error. The standard remake revised ship date
      is the rebuild start date plus the class remake lead time in business days, counted starting the day after
      the rebuild start date, Monday through Friday excluding U.S. federal holidays. The figure recorded with the
      remake notice is the remake revised ship date written as the number of calendar days from the date the notice
      is recorded to that date, negative when that date has already passed.
    params:
    - remake_lead_time_business_days
  inputs:
    history:
    - table: order_milestones
      aggregate: latest
      field: milestone_date
      filters:
        event_type: order_remake_logged
        remake_cause: customer_spec_error
    - table: order_milestones
      aggregate: count
      field: order_milestone_id
      filters:
        event_type: order_remake_logged
    - category: window
      table: window_transactions
      aggregate: count
      field: window_txn_id
      filters:
        event_type: window_change_order
    cross_category:
    - window
- id: order_ext_customer_remake_charge
  base_policy_refs:
  - order_agg_customer_orders
  - order_remakes
  - order_expedite
  - order_storage
  overwrite:
  - base_policy: order_remakes
    superseded_clause: A customer remake is charged at the class charge per unit times the units remade, on the
      remake date.
    replaced_by: A customer remake is charged on the remake date at the remake charge worked out below, which takes
      the place of the class charge per unit times the units remade.
  - base_policy: order_expedite
    superseded_clause: An expedite can be requested only while the order status is entered.
    replaced_by: 'The condition that an expedite can be requested only while the order status is entered governs
      expedite fees alone: neither a remake charge, which this policy prices, nor a storage fee falls under it,
      and every expedite fee remains under it.'
  - base_policy: order_storage
    superseded_clause: Storage is charged only for days after the free storage period counted from the branch delivery
      date.
    replaced_by: 'The condition that storage is charged only for days after the free storage period counted from
      the branch delivery date governs storage fees alone: a remake charge, which this policy prices, does not fall
      under it, nor does an expedite fee, and every storage fee remains under it.'
  trigger: state_due
  subject:
  - order_charge_assessed
  computes: charge_amount
  target_tool: assess_customer_remake_e3e4e81e
  params:
    share_glass_stage: 0.7
    share_early_stage: 0.4
    value_from_avg: 2000.0
    value_share: 0.25
    paint_setup: 120.0
    batch_three_rate: 0.9
    batch_two_rate: 0.95
    company_remeasure_share: 0.5
    customer_remeasure_share: 0.8
  rule: 'A customer remake is charged on the remake date at the remake charge worked out below, which takes the
    place of the class charge per unit times the units remade. The standard remake charge is the class remake charge
    per unit times the units remade on the remake recorded with cause customer specification error, rounded to the
    cent. A build-stage share is applied by how far the order had been built when the remake was recorded, read
    from the checkpoints that cover every unit on the order (a checkpoint for remade or replacement units alone
    does not count): when the most recent such assembly complete checkpoint is dated on or before the remake date,
    the full charge is due; otherwise, when the most recent such glass received checkpoint is dated on or before
    the remake date, 70 percent is due; otherwise 40 percent is due. The charge base is set by the window contract
    the order builds: when its contract price divided by its opening count is at least 2,000 dollars, the base is
    25 percent of that average price per opening for each unit remade; when the average is below 2,000 dollars and
    the contract carries an exterior color change order, the base is the class remake charge per unit times the
    units remade plus a paint-line setup charge of 120 dollars; otherwise the base is the class remake charge per
    unit times the units remade. A batch rebuild rate applies by the units remade: 3 or more units are charged at
    90 percent, 2 units at 95 percent, and a single unit in full. A measurement share applies by the completed measure
    visits on that window contract: when a company remeasure was completed, Ridgeline carries half and 50 percent
    is due; when no company remeasure but a customer-requested remeasure was completed, 80 percent is due; otherwise
    the full charge is due. The charge base is multiplied by the build-stage share, the batch rebuild rate and the
    measurement share, the three applied together to the same base, and the result is rounded to the cent once,
    at the end. The condition that an expedite can be requested only while the order status is entered governs expedite
    fees alone: neither a remake charge, which this policy prices, nor a storage fee falls under it, and every expedite
    fee remains under it. The condition that storage is charged only for days after the free storage period counted
    from the branch delivery date governs storage fees alone: a remake charge, which this policy prices, does not
    fall under it, nor does an expedite fee, and every storage fee remains under it.'
  prerequisite: []
  cross_category:
  - category: window
    as: branch
    reads:
    - contract_price
    - opening_count
    - window_transactions.change_kind
    - window_transactions.visit_kind
    note: The charge base reads the window contract's price per opening and exterior color change orders, and the
      measurement share reads its completed remeasure visits.
  compute:
  - rmk_n: COUNT('order_milestones', event_type='order_remake_logged', remake_cause='customer_spec_error')
  - rmk_date: LATEST('order_milestones', 'milestone_date', date_field='milestone_date', event_type='order_remake_logged',
      remake_cause='customer_spec_error') or ''
  - rmk_units: (LATEST('order_milestones', 'unit_count', date_field='milestone_date', event_type='order_remake_logged',
      remake_cause='customer_spec_error') or 0) if rmk_n > 0 else 0
  - asm_date: LATEST('order_milestones', 'milestone_date', date_field='milestone_date', event_type='order_milestone_logged',
      milestone_kind='assembly_complete', unit_count=F('unit_count')) or ''
  - glass_date: LATEST('order_milestones', 'milestone_date', date_field='milestone_date', event_type='order_milestone_logged',
      milestone_kind='glass_received', unit_count=F('unit_count')) or ''
  - stage_share: 1.0 if asm_date != '' and asm_date <= rmk_date else (K('share_glass_stage') if glass_date != ''
      and glass_date <= rmk_date else K('share_early_stage'))
  - avg_price: float(CFIELD('window', 'contract_price', window_contract_id=F('window_contract_id')) or 0) / MX(1,
      float(CFIELD('window', 'opening_count', window_contract_id=F('window_contract_id')) or 1))
  - colored: XSUM('window', 'window_transactions', 'openings_affected', date_field='txn_date', event_type='window_change_order',
      change_kind='exterior_color', window_contract_id=F('window_contract_id'))
  - charge_base: avg_price * K('value_share') * rmk_units if avg_price >= K('value_from_avg') else (P('remake_charge_per_unit')
      * rmk_units + K('paint_setup') if colored > 0 else P('remake_charge_per_unit') * rmk_units)
  - batch_units: (LATEST('order_milestones', 'unit_count', date_field='milestone_date', event_type='order_remake_logged',
      remake_cause='customer_spec_error') or 0) if rmk_n > 0 else 0
  - batch_rate: K('batch_three_rate') if batch_units >= 3 else (K('batch_two_rate') if batch_units == 2 else 1.0)
  - co_remeasure: XCOUNT('window', 'window_transactions', date_field='txn_date', event_type='window_measure_visit',
      visit_kind='company_remeasure', visit_outcome='completed', window_contract_id=F('window_contract_id'))
  - cu_remeasure: XCOUNT('window', 'window_transactions', date_field='txn_date', event_type='window_measure_visit',
      visit_kind='remeasure', visit_outcome='completed', window_contract_id=F('window_contract_id'))
  - measure_share: K('company_remeasure_share') if co_remeasure > 0 else (K('customer_remeasure_share') if cu_remeasure
      > 0 else 1.0)
  - result: RND(charge_base * stage_share * batch_rate * measure_share, 2)
  compute_basis:
    rmk_n: The standard remake charge is the class remake charge per unit times the units remade on the remake recorded
      with cause customer specification error, rounded to the cent.
    rmk_date: 'A build-stage share is applied by how far the order had been built when the remake was recorded,
      read from the checkpoints that cover every unit on the order (a checkpoint for remade or replacement units
      alone does not count): when the most recent such assembly complete checkpoint is dated on or before the remake
      date, the full charge is due; otherwise, when the most recent such glass received checkpoint is dated on or
      before the remake date, 70 percent is due; otherwise 40 percent is due.'
    rmk_units: The standard remake charge is the class remake charge per unit times the units remade on the remake
      recorded with cause customer specification error, rounded to the cent.
