- id: order_ext_on_time_guarantee_claim
  base_policy_refs:
  - order_delays_and_guarantee
  overwrite:
  - base_policy: order_delays_and_guarantee
    superseded_clause: The full calendar weeks late are the calendar days from the benchmark date plus the class
      grace period (in business days) to the ship date, divided by seven and rounded down.
    replaced_by: The full weeks late are the calendar days from the end of the grace period set below to the lateness
      end date set below, divided by seven and rounded down.
  - base_policy: order_delays_and_guarantee
    superseded_clause: When at least one full week late results, the order earns, on its ship date, the class credit
      per unit per week times the units on the order (units remade are counted once and earn nothing for their own
      remake time), never more than the class cap per order.
    replaced_by: When at least one full week late results, the order earns, dated its ship date, the weekly credit
      rate set below times the units on the order (units remade are counted once and earn nothing for their own
      remake time) times the credited weeks as the escalation schedule pays them, with the glass-supplier share
      then applied, never more than the class cap per order.
  trigger: on_request
  subject:
  - order_guarantee_credit_earned
  computes: credit_amount
  target_tool: file_on_time_claim_fe24f9ef
  params:
    escalation_at_weeks: 1
    late_notice_after_weeks: 2
    late_notice_near_weeks: 1
    late_notice_near_days: 3
    glass_two_share: 0.8
    glass_one_share: 0.9
    customer_remake_share: 0.5
    company_remake_share: 1.2
    grace_one_notice_less: 2
    band_weeks: 2
    band_rate: 1.5
  rule: 'A homeowner whose order earns the on-time guarantee credit files the on-time guarantee claim, and that
    claim books the credit on the order, dated the order''s ship date, with the full weeks late and the units counted
    recorded on it. Lateness is measured from the guarantee benchmark date, which is the later of the committed
    ship date and the latest revised ship date among the order''s delay notices whose cause is customer hold, late
    acknowledgment, customer specification remake or weather and freight. The standard grace period ends the class
    guarantee grace business days after the benchmark date, counted starting the day after the benchmark date, Monday
    through Friday excluding U.S. federal holidays. The standard full weeks late are the calendar days from the
    end of the grace period to the order''s ship date, divided by seven and rounded down; shipping on or before
    the end of the grace period earns nothing. The standard credit is the class credit per unit per week times the
    units on the order times the full weeks late, never more than the class cap per order, rounded to the cent.
    The full weeks late are the calendar days from the end of the grace period set below to the lateness end date
    set below, divided by seven and rounded down. When at least one full week late results, the order earns, dated
    its ship date, the weekly credit rate set below times the units on the order (units remade are counted once
    and earn nothing for their own remake time) times the credited weeks as the escalation schedule pays them, with
    the glass-supplier share then applied, never more than the class cap per order. The lateness end date is set
    by how the units reached the branch: when the order was delivered to the branch later than its ship date plus
    the class transit time in business days, it is the branch delivery date; when it was delivered on or before
    that expected arrival, it is the expected arrival date, the ship date plus the class transit time in business
    days; when it has not been delivered, it is the ship date. The grace period follows the factory-capacity delay
    notices on the order: two or more such notices shorten it to half the class guarantee grace business days, rounded
    down to a whole business day; exactly one shortens it to the class guarantee grace business days less 2; none
    leaves the class guarantee grace business days. The weekly credit rate per unit follows the remakes on the order:
    when a remake charge stands on the order without a waiver reversing it, the rate is half the class credit per
    unit per week; when no remake charge stands and at least one remake on the order has a company cause (factory
    defect, freight damage or company mismeasure), the rate is 1.2 times the class credit per unit per week; otherwise
    it is the class credit per unit per week. The escalation schedule follows the delay notices on the order, of
    every cause: with more notices than the class escalation count, the first 2 credited weeks are paid at the weekly
    credit rate and every credited week beyond 2 at 1.5 times that rate; with exactly the escalation count, one
    more credited week is added and every credited week is paid at the weekly credit rate; with fewer, every credited
    week is paid at the weekly credit rate. Late-notice weeks are added as well by when the most recent factory-capacity
    delay notice was recorded: after the committed ship date adds 2 weeks, on one of the three calendar days before
    the committed ship date or on it adds 1 week, and earlier or never adds none. A glass-supplier share is applied
    to the credit by the glass-supplier delay notices on the order: two or more such notices leave 80 percent of
    the credit, exactly one leaves 90 percent, and none leaves the full credit. The credited weeks are the full
    weeks late plus the late-notice weeks, counted only when at least one full week late results; the rate times
    the units times the credited weeks as the escalation schedule pays them is taken first, the glass-supplier share
    is applied to that amount, the class cap per order is applied after the share, and the credit is rounded to
    the cent once, at the end. The guarantee credit is not booked until every remake on the order recorded with
    cause customer specification error has its delay notice with cause customer specification remake on record.
    The guarantee credit is booked only after each remake on the order recorded with cause customer specification
    error carries its remake charge. The class parameter naming the lateness ship basis (last unit shipped) fixes
    the ship date the expected arrival is counted from; the lateness end date set out here governs where lateness
    is measured to.'
  prerequisite:
  - problem: order_ext_remake_delay_notice
    kind: value_input
    gate: bm_t
    form: state
    policy_source: The guarantee credit is not booked until every remake on the order recorded with cause customer
      specification error has its delay notice with cause customer specification remake on record.
    condition: For every order_remake_logged row of the order with remake_cause customer_spec_error, order_milestones
      carries an order_delay_noticed row with delay_cause customer_spec_remake whose revised_ship_date marks the
      end of that remake's rebuild lead.
    resolved_by: record_remake_delay_notice_f2496c0b
    effect: Recording the remake delay notice adds an excluded-cause revised ship date later than the committed
      ship date, so the guarantee benchmark bm_t moves later and the full weeks late fall; the notice also raises
      the delay-notice count the escalation weeks read.
  - problem: order_ext_customer_remake_charge
    kind: value_input
    gate: rate
    form: state
    policy_source: The guarantee credit is booked only after each remake on the order recorded with cause customer
      specification error carries its remake charge.
    condition: For every order_remake_logged row of the order with remake_cause customer_spec_error, order_milestones
      carries an order_charge_assessed row with charge_kind remake_charge that no order_charge_waived row reverses.
    resolved_by: assess_customer_remake_e3e4e81e
    effect: Booking the remake charge puts an unwaived remake charge on the order, so the weekly credit rate moves
      from 1.2 times the class credit per unit per week (the company-remake tier) to half of it (the customer-remake
      tier).
  cross_category: []
  compute:
  - elig: P('guarantee_eligible')
  - ship_t: DAYS(NOW, F('ship_date')) if F('ship_date') else 0
