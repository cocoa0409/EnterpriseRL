category: order
display_name: Factory Production Orders
binding:
  holding_table: factory_orders
  event_tables:
  - order_milestones
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - entered
  - on_hold
  - in_production
  - shipped
  - delivered
  - closed
  - cancelled
  transitions:
  - from: entered
    to: in_production
    by: system
    means: >-
      The factory starts building the units once the signed acknowledgment (and, for specialty shapes,
      the template) is in hand.
  - from: entered
    to: on_hold
    by: agent
    means: Production is paused before it starts at the customer's request.
  - from: on_hold
    to: entered
    by: agent
    means: >-
      The hold ends, on the customer's request or automatically at the class hold limit, and the order
      re-enters the production queue.
  - from: in_production
    to: shipped
    by: system
    means: The finished units leave the factory.
  - from: shipped
    to: delivered
    by: system
    means: The units are received and inspected at the Ridgeline branch warehouse.
  - from: delivered
    to: closed
    by: system
    means: The units are installed and the order is closed.
  - from: entered
    to: cancelled
    by: system
    means: The order is cancelled because its contract was cancelled before production started.
  - from: on_hold
    to: cancelled
    by: system
    means: The order is cancelled because its contract was cancelled while the order was on hold.
  - from: in_production
    to: cancelled
    by: system
    means: Production is stopped because the contract was cancelled after production started.
accounts:
- key: order_charges
  unit: USD
  meaning: >-
    Order-level charges owed by the customer (customer-caused remakes, expedite fees, storage fees), net
    of charges waived.
- key: guarantee_credits
  unit: USD
  meaning: >-
    On-time guarantee credit earned by the order and not yet applied to the contract it builds.
parameter_schema:
  standard_lead_time_business_days: >-
    Standard production lead time from order entry to committed ship date (business days, Monday through
    Friday excluding U.S. federal holidays).
  large_order_threshold_units: Unit count above which the large-order extension is added to the lead time
    (count).
  large_order_extra_business_days: Business days added to the lead time for an order above the large-order
    threshold (days).
  order_entry_business_days_after_release: >-
    Business days after the contract's order release within which the factory enters the order (days).
  acknowledgment_return_business_days: >-
    Business days after the order entry date within which the customer signs and returns the order acknowledgment
    (days).
  production_queue_business_days: >-
    Business days from the signed acknowledgment (and template, where required) to production start (days).
  shape_template_required: >-
    Whether a full-size template of each opening must be received at the factory before production can
    start (boolean).
  class_features: >-
    Features that place an order in this build class; an order takes the highest-ranked class whose features
    it contains (list of strings).
  unit_count_max_per_order: Most units one factory order may carry (count).
  guarantee_eligible: Whether orders in this class carry the on-time shipping guarantee (boolean).
  guarantee_grace_business_days: Business days after the guarantee benchmark date before a shipment counts
    as late (days).
  on_time_credit_per_unit_week: >-
    Guarantee credit per unit for each full calendar week the shipment is late beyond the grace period;
    0.00 where the class carries no guarantee (USD).
  on_time_credit_cap_per_order: Most guarantee credit one order can earn; 0.00 where the class carries
    no guarantee (USD).
  guarantee_excluded_causes: >-
    Delay causes whose revised ship date moves the guarantee benchmark instead of earning credit (list
    of delay_cause values).
  guarantee_week_basis: >-
    How lateness is counted for the credit: full_calendar_weeks counts only complete 7-day periods (enumeration).
  remade_units_guaranteed: >-
    Whether units that are remade earn guarantee credit for their own remake lead time (boolean).
  credit_to_contract_business_days: >-
    Business days after the ship date within which an earned guarantee credit is applied to the contract
    (days).
  credit_application_rule: >-
    Where an earned credit goes: contract_balance_then_refund applies it to the contract the order builds,
    and refunds any part exceeding the amount owed under the contract's refund rules (enumeration).
  max_delay_notices_before_escalation: >-
    Delay notices on one order after which the next delay is escalated to the production manager instead
    of handled by support (count).
  hold_max_count: Customer holds one order may receive (count).
  hold_max_calendar_days: Longest a single hold may last, counted from the hold start date (calendar days).
  hold_auto_release: >-
    Whether a hold that reaches its maximum length is released automatically into the production queue
    (boolean).
  free_storage_calendar_days: >-
    Calendar days after branch delivery during which delivered units are stored free of charge (days).
  storage_fee_per_unit_week: Storage fee per unit for each billable week after the free period (USD).
  storage_fee_cap_per_order: Most storage fee one order can be charged in total (USD).
  storage_week_rounding: >-
    How billable storage days become weeks: started_week counts any started 7-day period as a full week
    (enumeration).
  storage_excludes_company_delays: >-
    Whether days of delay caused by a company- or weather-initiated installation reschedule are excluded
    from billable storage days (boolean).
  expedite_available: Whether an expedited build can be requested in this class (boolean).
  expedite_lead_time_business_days: >-
    Lead time from the expedite request date to the expedited target ship date; equals the standard lead
    time where expedite is unavailable (business days).
  expedite_fee_per_unit: Expedite fee per unit where available; 0.00 where unavailable (USD).
  expedite_min_fee: Smallest expedite fee per order where available; 0.00 where unavailable (USD).
  expedite_fee_refund_if_missed: >-
    Whether the expedite fee is waived when the order ships after its expedited target date (boolean).
  remake_charge_per_unit: Charge per unit remade because of a customer specification error (USD).
  remake_lead_time_business_days: Lead time to rebuild a remade unit, from the remake date (business days).
  company_cause_remake_free: >-
    Whether remakes caused by a factory defect, freight damage or a Ridgeline mismeasure carry no customer
    charge (boolean).
  spec_error_requires_signed_acknowledgment: >-
    Whether a remake may be charged as a customer specification error only when the customer signed the
    acknowledgment showing the specification (boolean).
  max_remakes_per_order: >-
    Remakes one order may receive before a further remake is escalated to factory engineering (count).
  qc_failure_remake: >-
    Whether units failing the factory quality check are remade as factory defects rather than repaired
    (boolean).
  partial_shipment_allowed: Whether passed units may ship ahead of units being remade (boolean).
  partial_shipment_min_share: >-
    Smallest share of the order's units that must have passed quality check for a partial shipment; 0.00
    where partial shipment is not allowed (decimal fraction).
  lateness_ship_basis: >-
    Which shipment dates the order for lateness: last_unit_shipped uses the date the final unit of the
    order shipped (enumeration).
  transit_business_days: Expected business days from factory ship date to branch delivery (days).
  delivery_inspection_hours: >-
    Hours after branch delivery within which the branch inspects the units; freight damage found inside
    this window is a freight_damage remake (hours).
  ship_notification_business_days: >-
    Business days before the current ship date by which the customer is told the order is on schedule
    or delayed (days).
  install_job_open_business_days: Business days after branch delivery within which the installation job
    is opened (days).
  cancel_in_production_allowed: >-
    Whether an order whose contract is cancelled after production starts is stopped and closed as cancelled
    (boolean).
  post_ship_cancellation_allowed: >-
    Whether an order that has shipped can be cancelled; when false the units stay on the order and the
    contract's cancellation terms carry the cost (boolean).
  hold_requote_basis: >-
    How the ship date is set when a hold ends: release_date_plus_standard_lead adds the class standard
    lead time in business days to the release date (enumeration).
  late_ack_shift_basis: >-
    How a late acknowledgment moves the ship date: business_days_late moves the current ship date later
    by the number of business days the signature came after the return window (enumeration).
