    - cu_remeasure
    - measure_share
    ladder:
    - when: a completed company remeasure on the window contract
      value: K('company_remeasure_share') = 50 percent
    - when: no company remeasure, a completed customer-requested remeasure
      value: K('customer_remeasure_share') = 80 percent
    - when: otherwise
