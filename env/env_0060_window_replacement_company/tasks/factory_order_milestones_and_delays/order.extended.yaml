- id: order_ext_late_acknowledgment_shift
  base_policy_refs:
  - order_acknowledgment_and_production
  - order_holds
  - order_delays_and_guarantee
  - order_remakes
  - order_expedite
  overwrite:
  - base_policy: order_acknowledgment_and_production
    superseded_clause: When the acknowledgment is signed late, a delay notice with cause late_acknowledgment moves
      the current ship date later by the number of business days the signature came after the window.
    replaced_by: When the order acknowledgment is signed after its return window, a delay notice with cause late
      acknowledgment moves the current ship date later by the late-acknowledgment shift worked out below, and the
      revised ship date it records becomes the order's current ship date.
  trigger: state_due
  subject:
  - order_delay_noticed
  computes: days_to_revised_ship_date
  target_tool: record_late_acknowledgment_notice_952cb75c
  params:
    paint_major_days: 2
    paint_minor_days: 1
    grilles_days: 2
    hardware_days: 1
    cutlist_mid_days: 1
    cutlist_long_after: 5
    cutlist_mid_from: 3
  rule: 'When the order acknowledgment is signed after its return window, a delay notice with cause late acknowledgment
    moves the current ship date later by the late-acknowledgment shift worked out below, and the revised ship date
    it records becomes the order''s current ship date. The return window closes on the last of the class acknowledgment
    return business days, counted starting the day after the order entry date, Monday through Friday excluding U.S.
    federal holidays. The standard late-acknowledgment shift is the business days of signature lateness, counted
    from the day after the return window closes up to and including the date the acknowledgment was signed. The
    late-acknowledgment revised ship date is the current ship date moved later by the late-acknowledgment shift,
    counted in business days starting the day after the current ship date. The figure recorded with the late-acknowledgment
    notice is the late-acknowledgment revised ship date written as the number of calendar days from the handling
    date to that date. The business days of signature lateness stop at an end date set by how the signature came
    in: when the acknowledgment was signed while the order was on a customer hold (its hold start date falls on
    or before the signature date and no hold release was recorded from the hold start date up to the day before
    the signature), they are counted up to and including the hold start date; when it was not signed during a hold
    and the most recent factory-capacity or glass-supplier delay notice on the order is dated after the return window
    closed and on or before the signature date, they are counted up to and including the date of that notice; otherwise
    they are counted up to and including the signature date. Paint-line rebooking then adds business days to the
    late-acknowledgment shift according to the openings priced on the exterior color change orders of the window
    contract the order builds: openings numbering at least half of the units on the order add 2 business days, at
    least one opening but fewer than half adds 1 business day, and no such opening adds nothing. Insert and hardware
    reordering adds business days to the late-acknowledgment shift as well: a grilles-between-glass change order
    on that window contract adds 2 business days, a hardware finish change order without any grilles-between-glass
    change order adds 1 business day, and neither adds nothing. Cut-list regeneration adds business days to the
    late-acknowledgment shift by how far the signature date itself missed the window, taken as the business days
    from the day after the window closes up to and including the signature date: when it missed by more than 5 such
    business days, the order waits for the plant''s next weekly cut-list run on a Friday and adds the business days
    from the day after the signature date up to and including the first Friday after the signature date; when it
    missed by 3 to 5, it adds 1 business day; when it missed by fewer than 3, it adds nothing. The late-acknowledgment
    shift is the business days of signature lateness plus the paint-line, insert and cut-list days, all added as
    whole business days before the late-acknowledgment revised ship date is counted. The class parameter naming
    the late-acknowledgment shift basis (business days late) describes only the standard count above; the end date
