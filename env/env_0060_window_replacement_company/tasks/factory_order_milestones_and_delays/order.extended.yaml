  compute_basis:
    cur_t: 'The per-unit rate depends on how far the expedite pulls the order in, taken as the business days counted
      from the day after the expedited target ship date up to and including the order''s current ship date: 15 or
      more such business days are charged at 70 dollars per unit, 5 or fewer at 40 dollars per unit, and anything
      in between at the class expedite fee per unit.'
    tgt_t: The expedited target ship date is the request date plus the class expedite lead time in business days,
      counted starting the day after the request date, Monday through Friday excluding U.S. federal holidays.
    pull_n: 'The per-unit rate depends on how far the expedite pulls the order in, taken as the business days counted
      from the day after the expedited target ship date up to and including the order''s current ship date: 15 or
      more such business days are charged at 70 dollars per unit, 5 or fewer at 40 dollars per unit, and anything
      in between at the class expedite fee per unit.'
    rate: 'The per-unit rate depends on how far the expedite pulls the order in, taken as the business days counted
      from the day after the expedited target ship date up to and including the order''s current ship date: 15 or
      more such business days are charged at 70 dollars per unit, 5 or fewer at 40 dollars per unit, and anything
      in between at the class expedite fee per unit.'
    ack_n: 'The per-unit charge applies that rate according to the units on the signed order acknowledgment that
      covers the most units: when more than 10 units are acknowledged, the first 10 are charged at the full rate
      and every unit beyond 10 at half the rate; when 3 or fewer are acknowledged, the per-unit charge is the class
      minimum expedite fee as one flat amount; otherwise every unit on the order is charged at the rate.'
    ack_units: 'The per-unit charge applies that rate according to the units on the signed order acknowledgment
      that covers the most units: when more than 10 units are acknowledged, the first 10 are charged at the full
      rate and every unit beyond 10 at half the rate; when 3 or fewer are acknowledged, the per-unit charge is the
      class minimum expedite fee as one flat amount; otherwise every unit on the order is charged at the rate.'
    unit_charge: 'The per-unit charge applies that rate according to the units on the signed order acknowledgment
      that covers the most units: when more than 10 units are acknowledged, the first 10 are charged at the full
      rate and every unit beyond 10 at half the rate; when 3 or fewer are acknowledged, the per-unit charge is the
      class minimum expedite fee as one flat amount; otherwise every unit on the order is charged at the rate.'
    colored: 'A paint-line priority add-on is charged on the openings priced on the exterior color change orders
      of the window contract the order builds: when those openings number at least half of the units on the order,
      20 dollars per such opening; when there is at least one but fewer than half of the units, 10 dollars per such
      opening; when there is none, nothing.'
    paint_add: 'A paint-line priority add-on is charged on the openings priced on the exterior color change orders
      of the window contract the order builds: when those openings number at least half of the units on the order,
      20 dollars per such opening; when there is at least one but fewer than half of the units, 10 dollars per such
      opening; when there is none, nothing.'
    oversize_n: 'An oversize handling add-on is charged on the oversize openings recorded at the most recent completed
      measure visit of that window contract: 3 or more oversize openings are charged 30 dollars each, 1 or 2 are
      charged 20 dollars each, and none adds nothing.'
    oversize_add: 'An oversize handling add-on is charged on the oversize openings recorded at the most recent completed
      measure visit of that window contract: 3 or more oversize openings are charged 30 dollars each, 1 or 2 are
      charged 20 dollars each, and none adds nothing.'
    hol_n: 'A holiday overtime add-on is charged per unit on the order by the U.S. federal holidays that fall on
      weekdays after the request date up to and including the expedited target ship date: two or more such holidays
      add 15 dollars per unit, one adds 8 dollars per unit, and none adds nothing.'
    holiday_add: 'A holiday overtime add-on is charged per unit on the order by the U.S. federal holidays that fall
      on weekdays after the request date up to and including the expedited target ship date: two or more such holidays
      add 15 dollars per unit, one adds 8 dollars per unit, and none adds nothing.'
    subtotal: The per-unit charge and the three add-ons are summed first, that sum is raised to the class minimum
      expedite fee when it falls below it, the program discount is taken off the resulting amount, and the fee is
      rounded to the cent once, at the end.
    floored: The per-unit charge and the three add-ons are summed first, that sum is raised to the class minimum
      expedite fee when it falls below it, the program discount is taken off the resulting amount, and the fee is
      rounded to the cent once, at the end.
    program: 'The program discount follows the discount program on that window contract: a military or first responder
      program takes 15 percent off, a senior program takes 10 percent off, and no program takes nothing off.'
    discount: 'The program discount follows the discount program on that window contract: a military or first responder
      program takes 15 percent off, a senior program takes 10 percent off, and no program takes nothing off.'
    result: The per-unit charge and the three add-ons are summed first, that sum is raised to the class minimum
      expedite fee when it falls below it, the program discount is taken off the resulting amount, and the fee is
      rounded to the cent once, at the end.
  factors:
  - id: pull_in_rate
    effect: parameter
    decides: rate
    bindings:
    - pull_n
    - rate
    ladder:
    - when: the expedite pulls the order in by 15 or more business days
      value: K('rate_deep') = 70 dollars per unit
    - when: it pulls the order in by 5 or fewer business days
      value: K('rate_shallow') = 40 dollars per unit
    - when: otherwise
      value: P('expedite_fee_per_unit')
    baseline:
      rate: P('expedite_fee_per_unit')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: volume_structure
    effect: method
    decides: unit_charge
    bindings:
    - ack_n
    - ack_units
    - unit_charge
    ladder:
    - when: more than 10 units on the signed acknowledgment covering the most units
      method: first 10 units at the full rate, each unit beyond 10 at half the rate
    - when: 3 or fewer units on that acknowledgment
      method: one flat amount equal to the class minimum expedite fee
    - when: otherwise
      method: every unit on the order at the rate
    baseline:
      unit_charge: F('unit_count') * rate
    evidence:
    - history
    cross_difficulty: null
  - id: paint_line_priority
    effect: parameter
    decides: paint_add
    bindings:
    - colored
    - paint_add
    ladder:
    - when: exterior color openings number at least half of the order's units
      value: K('paint_major_per_opening') = 20 dollars per colored opening
    - when: at least one but fewer than half
      value: K('paint_minor_per_opening') = 10 dollars per colored opening
    - when: otherwise
      value: '0'
    baseline:
      paint_add: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: window
  - id: oversize_handling
    effect: parameter
    decides: oversize_add
    bindings:
    - oversize_n
    - oversize_add
    ladder:
    - when: 3 or more oversize openings at the most recent completed measure visit
      value: K('oversize_major_per_opening') = 30 dollars each
    - when: 1 or 2 oversize openings
      value: K('oversize_minor_per_opening') = 20 dollars each
    - when: otherwise
      value: '0'
    baseline:
      oversize_add: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: window
  - id: holiday_overtime
    effect: parameter
    decides: holiday_add
    bindings:
    - hol_n
    - holiday_add
    ladder:
    - when: two or more weekday federal holidays after the request date through the expedited target ship date
      value: K('holiday_two_per_unit') = 15 dollars per unit
    - when: exactly one such holiday
      value: K('holiday_one_per_unit') = 8 dollars per unit
    - when: otherwise
      value: '0'
    baseline:
      holiday_add: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: program_discount
    effect: parameter
    decides: discount
    bindings:
    - program
    - discount
    ladder:
    - when: military or first responder discount program on the window contract
      value: K('discount_service') = 15 percent
    - when: senior discount program
      value: K('discount_senior') = 10 percent
    - when: otherwise
      value: '0'
    baseline:
      discount: '0'
    evidence:
    - cross_category
    cross_difficulty: window
  baseline:
    rule: The standard expedite fee is the class expedite fee per unit times the units on the order, never less
      than the class minimum expedite fee, booked on the request date and rounded to the cent.
    params:
    - expedite_fee_per_unit
    - expedite_min_fee
  inputs:
    history:
    - table: order_milestones
      aggregate: max
      field: unit_count
      filters:
        event_type: order_milestone_logged
        milestone_kind: acknowledgment_signed
    - category: window
      table: window_transactions
      aggregate: sum
      field: openings_affected
      filters:
        event_type: window_change_order
        change_kind: exterior_color
    - category: window
      table: window_transactions
      aggregate: latest
      field: oversize_opening_count
      filters:
        event_type: window_measure_visit
        visit_outcome: completed
    cross_category:
    - window
- id: order_ext_remake_delay_notice
  base_policy_refs:
  - order_acknowledgment_and_production
  - order_holds
  - order_delays_and_guarantee
  - order_remakes
  - order_expedite
  overwrite:
  - base_policy: order_remakes
    superseded_clause: A remade unit is rebuilt within the class remake lead time from the remake date; a customer_spec_error
      remake that pushes the ship date is recorded as a delay notice with cause customer_spec_remake, and a company-cause
      remake that pushes it is recorded as factory_capacity.
    replaced_by: A unit remade for a customer specification error is rebuilt within the remake lead worked out below,
      counted from the rebuild start date, and a unit remade for a company cause is rebuilt within the class remake
      lead time from the remake date; a customer specification remake that pushes the ship date is recorded as a
      delay notice with cause customer specification remake whose revised ship date is the end of that lead, and
      a company-cause remake that pushes it is recorded as factory capacity.
  trigger: state_due
  subject:
  - order_delay_noticed
  computes: days_to_revised_ship_date
  target_tool: record_remake_delay_notice_f2496c0b
  params:
    low_e_days: 2
    finish_major_days: 3
    finish_minor_days: 2
    requeue_extra_days: 3
    spring_days: 3
    summer_days: 2
    grilles_days: 2
    hardware_days: 1
    sealed_unit_lead_days: 35
  rule: 'A unit remade for a customer specification error is rebuilt within the remake lead worked out below, counted
    from the rebuild start date, and a unit remade for a company cause is rebuilt within the class remake lead time
    from the remake date; a customer specification remake that pushes the ship date is recorded as a delay notice
    with cause customer specification remake whose revised ship date is the end of that lead, and a company-cause
    remake that pushes it is recorded as factory capacity. As the standard rule, the rebuild of a customer specification
    remake starts on the date of the most recent remake on the order recorded with cause customer specification
    error. The standard remake revised ship date is the rebuild start date plus the class remake lead time in business
    days, counted starting the day after the rebuild start date, Monday through Friday excluding U.S. federal holidays.
    The figure recorded with the remake notice is the remake revised ship date written as the number of calendar
    days from the date the notice is recorded to that date, negative when that date has already passed. The rebuild
    start date is set by when the corrected specification was confirmed: when the order carries an acknowledgment
    signature dated after that remake (the corrected acknowledgment for the remade units), the rebuild starts on
    the date of the most recent such signature; when there is none and the most recent glass received checkpoint
    on the order is dated after the remake (replacement glass for the remade units), the rebuild starts on that
    glass received date; otherwise it starts on the remake date. Glass recutting sets how the class remake lead
    time runs, by the glass options on the change orders of the window contract the order builds: with a triple-pane
    or laminated glass change order the sealed units are reordered from the glass supplier, whose sealed-unit lead
    of 35 business days runs alongside the frame rebuild, so the glass-and-frame lead is the longer of the class
    remake lead time and 35 business days; with a premium low-E change order and neither of those, the glass is
    cut in-house after the frame is rebuilt, so the glass-and-frame lead is the class remake lead time plus 2 business
    days; with none of them it is the class remake lead time. Finish matching adds business days by the openings
    priced on that contract''s exterior color change orders: openings numbering at least half of the units on the
    order add 3 business days, at least one opening but fewer than half adds 2 business days, and no such opening
    adds nothing. Line requeueing adds business days by the company-cause remakes (factory defect, freight damage
    or company mismeasure) recorded on the order: two or more such remakes add the class production queue days plus
    3 business days, exactly one adds the class production queue days, and none adds nothing. Seasonal line load
    adds business days by the month of the remake: a remake in April, May or June adds 3 business days, a remake
    in July, August or September adds 2 business days, and a remake in any other month adds nothing. Insert matching
    adds business days as well: a grilles-between-glass change order on that window contract adds 2 business days,
    a hardware finish change order without any grilles-between-glass change order adds 1 business day, and neither
    adds nothing. The remake lead is the glass-and-frame lead plus the finish, requeue, seasonal and insert days,
    all whole business days counted together from the rebuild start date, and the remake revised ship date is the
    end of that lead. Whether a customer specification remake pushed the ship date is judged against the projected
    ship date on record when the remake was recorded, so its notice is owed even when it is entered after the order
    has shipped; such a late-entered notice records the end of the remake lead as its revised ship date for the
    guarantee benchmark but never moves the order''s current ship date earlier than it already stands. A notice
    entered late for a remake that came before the order''s later delay notices records an earlier delay, not a
    further delay.'
  prerequisite: []
  cross_category:
  - category: window
    as: history
    reads:
    - window_transactions.change_kind
    - window_transactions.openings_affected
    note: The glass recutting, finish matching and insert matching factors take their tier from the change orders
