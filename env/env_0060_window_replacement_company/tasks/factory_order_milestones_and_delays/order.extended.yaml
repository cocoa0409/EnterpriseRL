    batch_units: 'A batch rebuild rate applies by the units remade: 3 or more units are charged at 90 percent, 2
      units at 95 percent, and a single unit in full.'
    batch_rate: 'A batch rebuild rate applies by the units remade: 3 or more units are charged at 90 percent, 2
      units at 95 percent, and a single unit in full.'
    co_remeasure: 'A measurement share applies by the completed measure visits on that window contract: when a company
      remeasure was completed, Ridgeline carries half and 50 percent is due; when no company remeasure but a customer-requested
      remeasure was completed, 80 percent is due; otherwise the full charge is due.'
    cu_remeasure: 'A measurement share applies by the completed measure visits on that window contract: when a company
      remeasure was completed, Ridgeline carries half and 50 percent is due; when no company remeasure but a customer-requested
      remeasure was completed, 80 percent is due; otherwise the full charge is due.'
    measure_share: 'A measurement share applies by the completed measure visits on that window contract: when a
      company remeasure was completed, Ridgeline carries half and 50 percent is due; when no company remeasure but
      a customer-requested remeasure was completed, 80 percent is due; otherwise the full charge is due.'
    result: The charge base is multiplied by the build-stage share, the batch rebuild rate and the measurement share,
      the three applied together to the same base, and the result is rounded to the cent once, at the end.
  factors:
  - id: build_stage_share
    effect: parameter
    decides: stage_share
    bindings:
    - asm_date
    - glass_date
    - stage_share
    ladder:
    - when: the most recent assembly complete checkpoint covering every unit on the order is dated after the remake
        date or absent, and the most recent such glass received checkpoint is dated on or before the remake date
      value: K('share_glass_stage') = 70 percent
    - when: neither full-order checkpoint is dated on or before the remake date
      value: K('share_early_stage') = 40 percent
    - when: otherwise (the most recent full-order assembly complete checkpoint is dated on or before the remake
        date)
      value: 1.0 (full charge)
    baseline:
      stage_share: '1.0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: contract_charge_base
    effect: method
