    bindings:
    - avg_price
    - colored
    - charge_base
    ladder:
    - when: contract price per opening at least 2,000 dollars
      method: 25 percent of the average price per opening for each unit remade
    - when: average below 2,000 dollars and an exterior color change order on the contract
      method: class remake charge per unit times units remade plus a 120-dollar paint-line setup charge
    - when: otherwise
