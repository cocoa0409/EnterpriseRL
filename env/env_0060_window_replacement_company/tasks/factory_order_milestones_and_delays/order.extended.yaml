  compute_basis:
    rmk_n: As the standard rule, the rebuild of a customer specification remake starts on the date of the most recent
      remake on the order recorded with cause customer specification error.
    rmk_date: As the standard rule, the rebuild of a customer specification remake starts on the date of the most
      recent remake on the order recorded with cause customer specification error.
    rmk_t: As the standard rule, the rebuild of a customer specification remake starts on the date of the most recent
      remake on the order recorded with cause customer specification error.
    corr_date: 'The rebuild start date is set by when the corrected specification was confirmed: when the order
      carries an acknowledgment signature dated after that remake (the corrected acknowledgment for the remade units),
      the rebuild starts on the date of the most recent such signature; when there is none and the most recent glass
      received checkpoint on the order is dated after the remake (replacement glass for the remade units), the rebuild
      starts on that glass received date; otherwise it starts on the remake date.'
    corr_t: 'The rebuild start date is set by when the corrected specification was confirmed: when the order carries
      an acknowledgment signature dated after that remake (the corrected acknowledgment for the remade units), the
      rebuild starts on the date of the most recent such signature; when there is none and the most recent glass
      received checkpoint on the order is dated after the remake (replacement glass for the remade units), the rebuild
      starts on that glass received date; otherwise it starts on the remake date.'
    start_t: 'The rebuild start date is set by when the corrected specification was confirmed: when the order carries
      an acknowledgment signature dated after that remake (the corrected acknowledgment for the remade units), the
      rebuild starts on the date of the most recent such signature; when there is none and the most recent glass
      received checkpoint on the order is dated after the remake (replacement glass for the remade units), the rebuild
      starts on that glass received date; otherwise it starts on the remake date.'
    glass_n: 'Glass recutting sets how the class remake lead time runs, by the glass options on the change orders
      of the window contract the order builds: with a triple-pane or laminated glass change order the sealed units
      are reordered from the glass supplier, whose sealed-unit lead of 35 business days runs alongside the frame
      rebuild, so the glass-and-frame lead is the longer of the class remake lead time and 35 business days; with
      a premium low-E change order and neither of those, the glass is cut in-house after the frame is rebuilt, so
      the glass-and-frame lead is the class remake lead time plus 2 business days; with none of them it is the class
      remake lead time.'
    lowe_n: 'Glass recutting sets how the class remake lead time runs, by the glass options on the change orders
      of the window contract the order builds: with a triple-pane or laminated glass change order the sealed units
      are reordered from the glass supplier, whose sealed-unit lead of 35 business days runs alongside the frame
      rebuild, so the glass-and-frame lead is the longer of the class remake lead time and 35 business days; with
      a premium low-E change order and neither of those, the glass is cut in-house after the frame is rebuilt, so
      the glass-and-frame lead is the class remake lead time plus 2 business days; with none of them it is the class
      remake lead time.'
    colored: 'Finish matching adds business days by the openings priced on that contract''s exterior color change
      orders: openings numbering at least half of the units on the order add 3 business days, at least one opening
      but fewer than half adds 2 business days, and no such opening adds nothing.'
    finish_days: 'Finish matching adds business days by the openings priced on that contract''s exterior color change
      orders: openings numbering at least half of the units on the order add 3 business days, at least one opening
      but fewer than half adds 2 business days, and no such opening adds nothing.'
    earlier_n: 'Line requeueing adds business days by the company-cause remakes (factory defect, freight damage
      or company mismeasure) recorded on the order: two or more such remakes add the class production queue days
      plus 3 business days, exactly one adds the class production queue days, and none adds nothing.'
    requeue_days: 'Line requeueing adds business days by the company-cause remakes (factory defect, freight damage
      or company mismeasure) recorded on the order: two or more such remakes add the class production queue days
      plus 3 business days, exactly one adds the class production queue days, and none adds nothing.'
    rmk_month: 'Seasonal line load adds business days by the month of the remake: a remake in April, May or June
      adds 3 business days, a remake in July, August or September adds 2 business days, and a remake in any other
      month adds nothing.'
    season_days: 'Seasonal line load adds business days by the month of the remake: a remake in April, May or June
      adds 3 business days, a remake in July, August or September adds 2 business days, and a remake in any other
      month adds nothing.'
    grilles: 'Insert matching adds business days as well: a grilles-between-glass change order on that window contract
      adds 2 business days, a hardware finish change order without any grilles-between-glass change order adds 1
      business day, and neither adds nothing.'
    hardware: 'Insert matching adds business days as well: a grilles-between-glass change order on that window contract
      adds 2 business days, a hardware finish change order without any grilles-between-glass change order adds 1
      business day, and neither adds nothing.'
    insert_days: 'Insert matching adds business days as well: a grilles-between-glass change order on that window
      contract adds 2 business days, a hardware finish change order without any grilles-between-glass change order
      adds 1 business day, and neither adds nothing.'
    lead: The remake lead is the glass-and-frame lead plus the finish, requeue, seasonal and insert days, all whole
      business days counted together from the rebuild start date, and the remake revised ship date is the end of
      that lead.
    rev_t: The standard remake revised ship date is the rebuild start date plus the class remake lead time in business
      days, counted starting the day after the rebuild start date, Monday through Friday excluding U.S. federal
      holidays.
    result: The figure recorded with the remake notice is the remake revised ship date written as the number of
      calendar days from the date the notice is recorded to that date, negative when that date has already passed.
    glass_after: 'The rebuild start date is set by when the corrected specification was confirmed: when the order
      carries an acknowledgment signature dated after that remake (the corrected acknowledgment for the remade units),
      the rebuild starts on the date of the most recent such signature; when there is none and the most recent glass
      received checkpoint on the order is dated after the remake (replacement glass for the remade units), the rebuild
      starts on that glass received date; otherwise it starts on the remake date.'
    glass_t: 'The rebuild start date is set by when the corrected specification was confirmed: when the order carries
      an acknowledgment signature dated after that remake (the corrected acknowledgment for the remade units), the
      rebuild starts on the date of the most recent such signature; when there is none and the most recent glass
      received checkpoint on the order is dated after the remake (replacement glass for the remade units), the rebuild
      starts on that glass received date; otherwise it starts on the remake date.'
    frame_lead: 'Glass recutting sets how the class remake lead time runs, by the glass options on the change orders
      of the window contract the order builds: with a triple-pane or laminated glass change order the sealed units
      are reordered from the glass supplier, whose sealed-unit lead of 35 business days runs alongside the frame
      rebuild, so the glass-and-frame lead is the longer of the class remake lead time and 35 business days; with
      a premium low-E change order and neither of those, the glass is cut in-house after the frame is rebuilt, so
      the glass-and-frame lead is the class remake lead time plus 2 business days; with none of them it is the class
      remake lead time.'
