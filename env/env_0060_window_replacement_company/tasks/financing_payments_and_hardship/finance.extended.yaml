events:
- type: finance_account_opened
  target: finance_accounts
  mutation: create
  meaning: A credit application for a contract is approved and the financing account is opened.
  grain: One row per financing account.
  fields:
    customer_id: The borrower.
    window_contract_id: The window contract financed, or empty.
    door_contract_id: The door contract financed, or empty.
    variant_name: The financing plan, as its official name.
    account_number: The financing account number.
    approved_date: Date of approval.
    financed_amount: Amount approved for funding.
    payment_due_day: Day of the month payments fall due.
    autopay_enrolled: Whether autopay was set up at approval.
  triggers: []
- type: finance_funded
  target: finance_accounts
  mutation:
    transition:
      from: approved
      to: active
  meaning: The approved loan is funded to the contract after the installation is completed.
  grain: One row per transaction.
  fields:
    funded_date: Date of funding.
    promo_end_date: Last day of the promotional period, or empty.
    financed_amount: The amount funded (carried, not rewritten).
    window_contract_id: The window contract funded (carried, not rewritten), or empty.
    door_contract_id: The door contract funded (carried, not rewritten), or empty.
  triggers:
  - event: finance:finance_loan_disbursed
    map:
      amount: financed_amount
      txn_date: funded_date
  - event: window:window_payment_received
    when:
      window_contract_id:
        not: ''
    map:
      payment_kind: lender_funding
      tender_type: lender_disbursement
      amount: financed_amount
      txn_date: funded_date
  - event: door:door_payment_received
    when:
      door_contract_id:
        not: ''
    map:
      payment_kind: lender_funding
      tender_type: lender_disbursement
      amount: financed_amount
      txn_date: funded_date
- type: finance_loan_disbursed
  target: finance_transactions
  meaning: The funded principal is booked to the account.
  grain: One row per funding.
  distinguish_by:
  - txn_date
  fields:
    txn_date: Funding date.
    amount: Principal funded (positive).
  account: loan_balance
  direction: in
  triggers: []
- type: finance_payment_posted
  target: finance_transactions
  meaning: A payment from the borrower posts to the account.
  grain: One row per payment.
  distinguish_by:
  - txn_date
  - payment_channel
  - amount
  - payment_kind
  fields:
    txn_date: Posting date.
    amount: Amount paid (positive).
    payment_channel: autopay, online_portal, phone_agent or mail_check.
    payment_kind: scheduled_payment, extra_principal or payoff.
    statement_period: Statement period the payment is credited to.
  account: loan_balance
  direction: out
  triggers: []
- type: finance_interest_assessed
  target: finance_transactions
  meaning: >-
    Interest is charged for a statement period, or deferred interest is assessed at the end of a promotion.
  grain: One row per interest kind per statement period.
  distinguish_by:
  - interest_kind
  - statement_period
  fields:
    txn_date: Posting date.
    amount: Interest charged (positive).
    interest_kind: monthly_interest or deferred_interest_assessment.
    statement_period: Statement period charged.
  account: loan_balance
  direction: in
  triggers: []
- type: finance_fee_assessed
  target: finance_transactions
  meaning: A late, returned-payment or phone-payment fee is charged.
  grain: One row per fee of one kind per statement period and date.
  distinguish_by:
  - fee_kind
  - statement_period
  - txn_date
  fields:
    txn_date: Posting date.
    amount: Fee (positive).
    fee_kind: late_fee, returned_payment_fee or phone_payment_fee.
    statement_period: Statement period the fee belongs to.
    source_finance_txn_id: >-
      For a returned-payment or phone-payment fee, the payment it concerns; empty for a late fee.
  account: loan_balance
  direction: in
  triggers: []
- type: finance_fee_reversed
  target: finance_transactions
  meaning: A fee is reversed in full.
  grain: One row per fee reversed.
  distinguish_by:
  - source_finance_txn_id
  fields:
    txn_date: Posting date.
    amount: Amount reversed (positive), equal to the fee.
    fee_kind: The kind of the fee reversed.
    source_finance_txn_id: The fee record reversed.
  account: loan_balance
  direction: out
  triggers: []
- type: finance_payment_returned
  target: finance_transactions
  meaning: A posted payment is returned unpaid by the bank and added back to the balance.
  grain: One row per payment returned.
  distinguish_by:
  - source_finance_txn_id
  fields:
    txn_date: Date of the return.
    amount: Amount added back (positive), equal to the payment.
    source_finance_txn_id: The payment returned.
    statement_period: Statement period of the returned payment.
  account: loan_balance
  direction: in
  triggers:
  - event: finance:finance_fee_assessed
    map:
      fee_kind: returned_payment_fee
      txn_date: txn_date
      statement_period: statement_period
      source_finance_txn_id: source_finance_txn_id
- type: finance_payment_deferred
  target: finance_transactions
  meaning: Scheduled payments are deferred under an approved hardship request.
  grain: One row per hardship deferral, starting with one statement period.
  distinguish_by:
  - statement_period
  fields:
    txn_date: Date the deferral was granted.
    statement_period: First statement period deferred.
    deferral_months: Consecutive months deferred.
  triggers: []
- type: finance_due_day_change_logged
  target: finance_transactions
  meaning: A change of the monthly payment due day is recorded.
  grain: One row per due day change.
  distinguish_by:
  - txn_date
  fields:
    txn_date: Date of the change.
    new_due_day: The new due day.
    statement_period: First statement period with the new due day.
  triggers:
  - event: finance:finance_due_day_changed
    map:
      payment_due_day: new_due_day
- type: finance_due_day_changed
  target: finance_accounts
  mutation: update
  meaning: The account's payment due day is changed.
  grain: One row per transaction.
  fields:
    payment_due_day: The new due day.
  triggers: []
- type: finance_autopay_changed
  target: finance_accounts
  mutation: update
  meaning: Autopay is enrolled, cancelled or suspended.
  grain: One row per transaction.
  fields:
    autopay_enrolled: The new autopay setting.
  triggers: []
- type: finance_became_delinquent
  target: finance_accounts
  mutation:
    transition:
      from: active
      to: delinquent
  meaning: A scheduled payment reaches the delinquency point.
  grain: One row per transaction.
  fields:
    status: delinquent.
  triggers: []
- type: finance_cured
  target: finance_accounts
  mutation:
    transition:
      from: delinquent
      to: active
  meaning: The account is brought current.
  grain: One row per transaction.
  fields:
    status: active.
  triggers: []
- type: finance_paid_off
  target: finance_accounts
  mutation:
    transition:
    - from: active
      to: paid_off
    - from: delinquent
      to: paid_off
  meaning: The balance reaches zero.
  grain: One row per transaction.
  fields:
    closed_date: Date the balance reached zero.
  triggers: []
- type: finance_cancelled
  target: finance_accounts
  mutation:
    transition:
      from: approved
      to: cancelled
  meaning: An approved loan is declined by the customer or lapses before funding.
  grain: One row per transaction.
  fields:
    closed_date: Date of cancellation.
  triggers: []
- type: finance_charged_off
  target: finance_accounts
  mutation:
    transition:
      from: delinquent
      to: charged_off
  meaning: The account is charged off and moved to collections.
  grain: One row per transaction.
  fields:
    closed_date: Date of charge-off.
  triggers: []
measures:
- id: finance_msr_balance
  window: Account lifetime up to the moment of handling.
  measure: >-
    Sum of amount over finance_loan_disbursed, finance_interest_assessed, finance_fee_assessed and finance_payment_returned
    rows minus sum of amount over finance_payment_posted and finance_fee_reversed rows of the account.
- id: finance_msr_courtesy_waivers_365d
  window: Rolling 365 calendar days ending on the handling date.
  measure: >-
    Count of finance_fee_reversed rows of the account with fee_kind late_fee granted as a courtesy (the
    reversed fee was correctly assessed).
- id: finance_msr_returned_payments_365d
  window: Rolling 365 calendar days ending on the handling date.
  measure: Count of finance_payment_returned rows of the account.
- id: finance_msr_due_day_changes_365d
  window: Rolling 365 calendar days ending on the handling date.
  measure: Count of finance_due_day_change_logged rows of the account.
- id: finance_msr_deferral_months_used
  window: Account lifetime up to the moment of handling.
  measure: Sum of deferral_months over finance_payment_deferred rows of the account.
- id: finance_msr_on_time_streak
  window: Statement periods before the period being handled, most recent first.
  measure: >-
    Number of consecutive statement periods immediately before the one handled in which the scheduled
    payment posted in full by its due date, with no late fee assessed.
- id: finance_msr_accrued_promo_interest
  window: Every statement period from the funded date through the promotional end date.
  measure: >-
    Sum over those periods of the balance at the start of the period times the purchase APR divided by
    twelve, each period rounded to the cent.
- id: finance_msr_combined_financed
  window: Portfolio state at the moment of handling.
  measure: >-
    Sum of financed_amount over the customer's financing accounts whose status is approved, active or
    delinquent.
policies:
- id: finance_agg_multi_holding
  subject:
  - finance_account_opened
  rule: >-
    A customer may hold up to the cap in params of open financing accounts (approved, active or delinquent)
    at once, one per contract. A contract is financed by one account at most; an account finances exactly
    one contract, a window contract or a door contract. A contract that already has an open or paid-off
    financing account is never financed a second time.
  eligibility:
  - id: one_account_per_contract
    applies_to:
    - finance_account_opened
    kind: dedup
    condition: >-
      A contract that already has an open or paid-off financing account is never financed a second time.
    evidence_fields:
    - finance_accounts.window_contract_id
    - finance_accounts.door_contract_id
    - finance_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.window_contract_id
        - finance_accounts.door_contract_id
      action_bindings:
        finance_accounts.window_contract_id: window_contract_id
        finance_accounts.door_contract_id: door_contract_id
    dedup_contract:
      table: finance_accounts
      mode: separate_record
      object_bindings:
        window_contract_id: window_contract_id
        door_contract_id: door_contract_id
      duplicate_filters:
        status:
        - approved
        - active
        - delinquent
        - paid_off
      distinct_fields:
      - account_number
  params:
    max_per_customer: 2
- id: finance_agg_combined_exposure
  subject:
  - finance_account_opened
  - finance_payment_posted
  rule: >-
    Financing is limited across the customer's whole portfolio as well as per plan. A new account is opened
    only when the customer's combined financed amount across open accounts, including the new one, stays
    within the combined limit (finance_msr_combined_financed). A payment is applied to the account whose
    account number the customer gives and is never split across accounts; when the customer does not name
    one, it is applied to the account with the earliest past-due payment, and otherwise to the account
    with the earliest next due date.
  eligibility:
  - id: combined_limit
    applies_to:
    - finance_account_opened
    kind: authorization
    condition: >-
      A new account is opened only when the customer's combined financed amount across open accounts,
      including the new one, stays within the combined limit (finance_msr_combined_financed).
    evidence_fields:
    - finance_accounts.customer_id
    - finance_accounts.financed_amount
    - finance_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.customer_id
      action_bindings:
        finance_accounts.customer_id: customer_id
  params:
    combined_limit: =max_combined_financed
  measures:
  - finance_msr_combined_financed
- id: finance_origination
  subject:
  - finance_account_opened
  - finance_cancelled
  rule: >-
    A plan is offered only to an applicant whose credit score at application meets the plan's minimum,
    and the financed amount must fall between the plan's minimum and maximum. The financed amount may
    not exceed the contract price less the contract's required booking deposit. An approval is recorded
    with its approval date and the plan; the customer may decline it at any time before funding. An approval
    can be funded only within the approval validity period counted from the approval date. Calendar days
    are counted from the day after the approval date, and funding on the last day of the period is still
    within it. An approval that reaches the end of the period unfunded is cancelled, and the customer
    reapplies if the work is still ahead; a cancelled approval carries no charge.
  eligibility:
  - id: approval_valid
    applies_to:
    - finance_cancelled
    kind: time
    condition: >-
      An approval can be funded only within the approval validity period counted from the approval date.
    evidence_fields:
    - finance_accounts.finance_account_id
    - finance_accounts.approved_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.finance_account_id
      action_bindings:
        finance_accounts.finance_account_id: finance_account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the approval date
      anchor_source: finance_accounts.approved_date
      relation: not_after
      duration_source: variants.approval_valid_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the approval date, and funding on the last day of
        the period is still within it.
      boundary: inclusive
  params:
    per_tier:
      Ridgeline Same-As-Cash 12:
        score: =min_credit_score
        min_amount: =min_financed_amount
        max_amount: =max_financed_amount
      Ridgeline Same-As-Cash 18:
        score: =min_credit_score
        min_amount: =min_financed_amount
        max_amount: =max_financed_amount
      Ridgeline Zero-Interest Equal Pay 24:
        score: =min_credit_score
        min_amount: =min_financed_amount
        max_amount: =max_financed_amount
      Ridgeline Fixed-Rate 60:
        score: =min_credit_score
        min_amount: =min_financed_amount
        max_amount: =max_financed_amount
      Ridgeline Fixed-Rate 120:
        score: =min_credit_score
        min_amount: =min_financed_amount
        max_amount: =max_financed_amount
      Ridgeline Low-Payment 144:
        score: =min_credit_score
        min_amount: =min_financed_amount
        max_amount: =max_financed_amount
    amount_basis: =financed_amount_basis
    valid_days: =approval_valid_days
- id: finance_funding
  subject:
  - finance_funded
  - finance_loan_disbursed
  rule: >-
    A loan is funded only after the customer has signed the installation completion certificate for the
    financed contract. Funding happens within the stated business days after completion and pays the financed
    amount to the contract as lender funding. The promotional end date is the funded date plus the plan's
    promotional months, counted in calendar months; when the same day does not exist in the end month
    it falls back to the last day of that month. The first payment is due on the account's due day that
    falls at least the stated number of days after funding, and the scheduled monthly payment is the plan's
    payment factor per 1,000.00 times the financed amount, rounded to the cent, never below the plan minimum
    payment.
  eligibility:
  - id: completion_signed
    applies_to:
    - finance_funded
    kind: authorization
    condition: >-
      A loan is funded only after the customer has signed the installation completion certificate for
      the financed contract.
    evidence_fields:
    - finance_accounts.finance_account_id
    - install_jobs.completed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.finance_account_id
      action_bindings:
        finance_accounts.finance_account_id: finance_account_id
  params:
    per_tier:
      Ridgeline Same-As-Cash 12:
        promo: =promo_months
        factor: =payment_factor_per_1000
        min_payment: =min_monthly_payment
        term: =term_months
      Ridgeline Same-As-Cash 18:
        promo: =promo_months
        factor: =payment_factor_per_1000
        min_payment: =min_monthly_payment
        term: =term_months
      Ridgeline Zero-Interest Equal Pay 24:
        promo: =promo_months
        factor: =payment_factor_per_1000
        min_payment: =min_monthly_payment
        term: =term_months
      Ridgeline Fixed-Rate 60:
        promo: =promo_months
        factor: =payment_factor_per_1000
        min_payment: =min_monthly_payment
        term: =term_months
      Ridgeline Fixed-Rate 120:
        promo: =promo_months
        factor: =payment_factor_per_1000
        min_payment: =min_monthly_payment
        term: =term_months
      Ridgeline Low-Payment 144:
        promo: =promo_months
        factor: =payment_factor_per_1000
        min_payment: =min_monthly_payment
        term: =term_months
    certificate: =funding_requires_completion_certificate
    fund_days: =funding_business_days_after_completion
    first_due: =first_due_min_days
  formula:
    scheduled_payment: max(min_monthly_payment, round(financed_amount * payment_factor_per_1000 / 1000,
      2))
- id: finance_payments
  subject:
  - finance_payment_posted
  - finance_fee_assessed
  rule: >-
    Payments are applied first to fees, then to interest, then to principal. Money beyond the scheduled
    payment reduces principal and never moves the next due date forward. A payment received after the
    posting cutoff on a business day, or on a weekend or holiday, posts on the next business day, and
    its timeliness is judged on its posting date. Autopay, online portal and mailed payments are free.
    A payment made through a phone agent carries the plan's phone payment fee once per payment, on the
    posting date and naming that payment. The phone payment fee is not charged while an approved hardship
    deferral is in effect. There is no prepayment penalty, and a payoff quote stays valid for the stated
    days; a payoff payment is recorded as payoff.
  eligibility:
  - id: phone_fee_hardship
    applies_to:
    - finance_fee_assessed
    kind: authorization
    condition: The phone payment fee is not charged while an approved hardship deferral is in effect.
    evidence_fields:
    - finance_accounts.finance_account_id
    - finance_transactions.deferral_months
    - finance_transactions.statement_period
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.finance_account_id
      action_bindings:
        finance_accounts.finance_account_id: finance_account_id
  params:
    per_tier:
      Ridgeline Same-As-Cash 12:
        phone_fee: =phone_payment_fee
      Ridgeline Same-As-Cash 18:
        phone_fee: =phone_payment_fee
      Ridgeline Zero-Interest Equal Pay 24:
        phone_fee: =phone_payment_fee
      Ridgeline Fixed-Rate 60:
        phone_fee: =phone_payment_fee
      Ridgeline Fixed-Rate 120:
        phone_fee: =phone_payment_fee
      Ridgeline Low-Payment 144:
        phone_fee: =phone_payment_fee
    allocation: =payment_allocation_order
    extra: =extra_payment_rule
    cutoff: =payment_posting_cutoff
    prepayment: =prepayment_penalty
    payoff_days: =payoff_quote_valid_days
    hardship_waiver: =phone_fee_waived_in_hardship
    rounding: =amount_rounding
- id: finance_interest
  subject:
  - finance_interest_assessed
  rule: >-
    Monthly interest for a statement period is the balance at the start of the period times one twelfth
    of the effective APR, rounded to the cent. The effective APR is the plan's purchase APR, reduced by
    the plan's autopay discount while autopay is enrolled at the start of the period; the discount is
    an override of the rate and never makes it negative. A zero-APR equal payment plan charges no interest
    unless its promotion is forfeited: after the stated number of consecutive statement periods ending
    delinquent, the forfeit APR replaces it from the next period on, and the autopay discount applies
    to the forfeit APR. A deferred-interest plan charges no monthly interest during its promotion. Deferred
    interest is assessed only when a balance remains after the promotional end date. Calendar days are
    counted from the day after the promotional end date, and a balance paid off on the end date itself
    carries no deferred interest. When it applies, the accrued promotional interest (finance_msr_accrued_promo_interest)
    is assessed once as deferred_interest_assessment on the day after the promotional end date, and the
    remaining balance is re-amortized over the plan's post-promotion term at the purchase APR.
  eligibility:
  - id: balance_after_promo
    applies_to:
    - finance_interest_assessed
    kind: time
    condition: Deferred interest is assessed only when a balance remains after the promotional end date.
    evidence_fields:
    - finance_accounts.finance_account_id
    - finance_accounts.promo_end_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.finance_account_id
      action_bindings:
        finance_accounts.finance_account_id: finance_account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the promotional end date
      anchor_source: finance_accounts.promo_end_date
      relation: not_before
      duration_source: params.grace_days_after_promo
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the promotional end date, and a balance paid off
        on the end date itself carries no deferred interest.
      boundary: exclusive
  params:
    per_tier:
      Ridgeline Same-As-Cash 12:
        apr: =purchase_apr
        autopay_discount: =autopay_apr_discount
        promo_type: =promo_type
        forfeit_after: =promo_forfeit_missed_payments
        forfeit_apr: =promo_forfeit_apr
        post_promo_term: =post_promo_term_months
      Ridgeline Same-As-Cash 18:
        apr: =purchase_apr
        autopay_discount: =autopay_apr_discount
        promo_type: =promo_type
        forfeit_after: =promo_forfeit_missed_payments
        forfeit_apr: =promo_forfeit_apr
        post_promo_term: =post_promo_term_months
      Ridgeline Zero-Interest Equal Pay 24:
        apr: =purchase_apr
        autopay_discount: =autopay_apr_discount
        promo_type: =promo_type
        forfeit_after: =promo_forfeit_missed_payments
        forfeit_apr: =promo_forfeit_apr
        post_promo_term: =post_promo_term_months
      Ridgeline Fixed-Rate 60:
        apr: =purchase_apr
        autopay_discount: =autopay_apr_discount
        promo_type: =promo_type
        forfeit_after: =promo_forfeit_missed_payments
        forfeit_apr: =promo_forfeit_apr
        post_promo_term: =post_promo_term_months
      Ridgeline Fixed-Rate 120:
        apr: =purchase_apr
        autopay_discount: =autopay_apr_discount
        promo_type: =promo_type
        forfeit_after: =promo_forfeit_missed_payments
        forfeit_apr: =promo_forfeit_apr
        post_promo_term: =post_promo_term_months
      Ridgeline Low-Payment 144:
        apr: =purchase_apr
        autopay_discount: =autopay_apr_discount
        promo_type: =promo_type
        forfeit_after: =promo_forfeit_missed_payments
        forfeit_apr: =promo_forfeit_apr
        post_promo_term: =post_promo_term_months
    grace_days_after_promo: 0
    interest: =interest_basis
    deferred: =deferred_interest_basis
    promo_extension: =hardship_extends_promo
  formula:
    effective_apr: max(0, purchase_apr - autopay_apr_discount)
  measures:
  - finance_msr_accrued_promo_interest
  - finance_msr_balance
- id: finance_late_fees
  subject:
  - finance_fee_assessed
  - finance_fee_reversed
  rule: >-
    A scheduled payment not posted in full by the end of the plan's grace period draws one late fee for
    that statement period. A late fee may be assessed only when the scheduled payment is still unpaid
    after the grace period that follows its due date. Calendar days are counted from the day after the
    due date, and a payment posted on the last grace day is on time. The late fee is the plan's fixed
    fee or the stated share of the scheduled payment, whichever is lower, rounded to the cent. No late
    fee applies to a period covered by an approved hardship deferral. A correctly assessed late fee may
    be waived once as a courtesy when the account paid on time for at least the stated number of periods
    immediately before (finance_msr_on_time_streak) and the plan's courtesy limit in the preceding 365
    days has not been used (finance_msr_courtesy_waivers_365d); a late fee assessed in error, such as
    one on a period whose payment posted on time, is reversed whatever the courtesy count. A fee is reversed
    at most once, in full, by a reversal naming it.
  eligibility:
  - id: past_grace
    applies_to:
    - finance_fee_assessed
    kind: time
    condition: >-
      A late fee may be assessed only when the scheduled payment is still unpaid after the grace period
      that follows its due date.
    evidence_fields:
    - finance_accounts.finance_account_id
    - finance_accounts.payment_due_day
    - finance_transactions.statement_period
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.finance_account_id
      action_bindings:
        finance_accounts.finance_account_id: finance_account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its due date
      anchor_source: finance_accounts.payment_due_day
      relation: not_before
      duration_source: variants.late_fee_grace_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the due date, and a payment posted on the last grace
        day is on time.
      boundary: exclusive
  - id: reverse_once
    applies_to:
    - finance_fee_reversed
    kind: dedup
    condition: A fee is reversed at most once, in full, by a reversal naming it.
    evidence_fields:
    - finance_transactions.source_finance_txn_id
    - finance_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_transactions.source_finance_txn_id
      action_bindings:
        finance_transactions.source_finance_txn_id: source_finance_txn_id
    dedup_contract:
      table: finance_transactions
      mode: separate_record
      object_bindings:
        source_finance_txn_id: source_finance_txn_id
      duplicate_filters:
        event_type:
        - finance_fee_reversed
      distinct_fields:
      - txn_date
  params:
    per_tier:
      Ridgeline Same-As-Cash 12:
        grace: =late_fee_grace_days
        fee: =late_fee_amount
        courtesy: =courtesy_late_fee_waivers_per_365_days
      Ridgeline Same-As-Cash 18:
        grace: =late_fee_grace_days
        fee: =late_fee_amount
        courtesy: =courtesy_late_fee_waivers_per_365_days
      Ridgeline Zero-Interest Equal Pay 24:
        grace: =late_fee_grace_days
        fee: =late_fee_amount
        courtesy: =courtesy_late_fee_waivers_per_365_days
      Ridgeline Fixed-Rate 60:
        grace: =late_fee_grace_days
        fee: =late_fee_amount
        courtesy: =courtesy_late_fee_waivers_per_365_days
      Ridgeline Fixed-Rate 120:
        grace: =late_fee_grace_days
        fee: =late_fee_amount
        courtesy: =courtesy_late_fee_waivers_per_365_days
      Ridgeline Low-Payment 144:
        grace: =late_fee_grace_days
        fee: =late_fee_amount
        courtesy: =courtesy_late_fee_waivers_per_365_days
    cap_pct: =late_fee_cap_pct_of_payment
    on_time_periods: =courtesy_waiver_on_time_periods
  formula:
    late_fee: >-
      min(late_fee_amount, round(late_fee_cap_pct_of_payment * max(min_monthly_payment, round(financed_amount
      * payment_factor_per_1000 / 1000, 2)), 2))
  measures:
  - finance_msr_on_time_streak
  - finance_msr_courtesy_waivers_365d
- id: finance_returned_payments
  subject:
  - finance_payment_returned
  - finance_fee_assessed
  - finance_autopay_changed
  rule: >-
    A payment the bank returns unpaid is added back to the balance on the return date, naming the payment,
    and draws the plan's returned payment fee once. A returned payment does not count as paid, so the
    period's late fee rules apply to it as if it had never posted. When an account reaches the stated
    number of returned payments in the preceding 365 days (finance_msr_returned_payments_365d), autopay
    is suspended and the autopay rate discount stops from the next statement period; the customer may
    enroll again once a later payment posts without being returned.
  eligibility: []
  params:
    per_tier:
      Ridgeline Same-As-Cash 12:
        returned_fee: =returned_payment_fee
      Ridgeline Same-As-Cash 18:
        returned_fee: =returned_payment_fee
      Ridgeline Zero-Interest Equal Pay 24:
        returned_fee: =returned_payment_fee
      Ridgeline Fixed-Rate 60:
        returned_fee: =returned_payment_fee
      Ridgeline Fixed-Rate 120:
        returned_fee: =returned_payment_fee
      Ridgeline Low-Payment 144:
        returned_fee: =returned_payment_fee
    suspend_after: =autopay_suspend_after_returns
  measures:
  - finance_msr_returned_payments_365d
- id: finance_account_changes
  subject:
  - finance_autopay_changed
  - finance_due_day_change_logged
  - finance_due_day_changed
  rule: >-
    Autopay is set up or cancelled only on the borrower's own authorization. Enrollment draws a payment
    only when it is in place at least the stated days before that payment's due date; an earlier due date
    is paid by another channel. The payment due day may be moved to any day from the earliest to the latest
    allowed day of the month. A due day change can be made only when no other due day change was made
    in the preceding 365 days (finance_msr_due_day_changes_365d). A due day change takes effect from the
    next statement period and never skips or delays a payment already due.
  eligibility:
  - id: due_day_change_limit
    applies_to:
    - finance_due_day_change_logged
    kind: authorization
    condition: >-
      A due day change can be made only when no other due day change was made in the preceding 365 days
      (finance_msr_due_day_changes_365d).
    evidence_fields:
    - finance_accounts.finance_account_id
    - finance_transactions.txn_date
    - finance_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.finance_account_id
      action_bindings:
        finance_accounts.finance_account_id: finance_account_id
  params:
    lead_days: =autopay_enrollment_lead_days
    day_min: =due_day_min
    day_max: =due_day_max
    changes_per_year: =due_day_change_max_per_12_months
  measures:
  - finance_msr_due_day_changes_365d
- id: finance_hardship
  subject:
  - finance_payment_deferred
  rule: >-
    A borrower facing job loss, medical hardship, a natural disaster or reduced income may ask to defer
    scheduled payments; the request is the borrower's own and is recorded as a hardship request. A deferral
    is granted only when the account was funded at least the stated number of full calendar months before
    the request. Calendar months are counted from the funded date, and when the same day does not exist
    in a month the last day of that month is used. In addition the plan must offer deferral, the account
    must be no more than the stated days past due, the months requested may not exceed the plan's maximum
    per deferral, and the months already used (finance_msr_deferral_months_used) plus those requested
    must stay within the plan's lifetime maximum. Deferred payments move to the end of the term; interest
    keeps accruing and a promotional end date is never extended. A request that fails any condition is
    declined.
  eligibility:
  - id: seasoned_account
    applies_to:
    - finance_payment_deferred
    kind: time
    condition: >-
      A deferral is granted only when the account was funded at least the stated number of full calendar
      months before the request.
    evidence_fields:
    - finance_accounts.finance_account_id
    - finance_accounts.funded_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - finance_accounts.finance_account_id
      action_bindings:
        finance_accounts.finance_account_id: finance_account_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the account was funded
      anchor_source: finance_accounts.funded_date
      relation: not_before
      duration_source: variants.hardship_min_months_since_funding
      unit: calendar_months
      counting_rule: >-
        Calendar months are counted from the funded date, and when the same day does not exist in a month
        the last day of that month is used.
      boundary: inclusive
  params:
    per_tier:
      Ridgeline Same-As-Cash 12:
        per_request: =hardship_deferral_max_months
        lifetime: =hardship_lifetime_max_months
      Ridgeline Same-As-Cash 18:
        per_request: =hardship_deferral_max_months
        lifetime: =hardship_lifetime_max_months
      Ridgeline Zero-Interest Equal Pay 24:
        per_request: =hardship_deferral_max_months
        lifetime: =hardship_lifetime_max_months
      Ridgeline Fixed-Rate 60:
        per_request: =hardship_deferral_max_months
        lifetime: =hardship_lifetime_max_months
      Ridgeline Fixed-Rate 120:
        per_request: =hardship_deferral_max_months
        lifetime: =hardship_lifetime_max_months
      Ridgeline Low-Payment 144:
        per_request: =hardship_deferral_max_months
        lifetime: =hardship_lifetime_max_months
    seasoning: =hardship_min_months_since_funding
    max_past_due: =hardship_max_days_past_due
    interest_continues: =hardship_interest_continues
    extends_promo: =hardship_extends_promo
  measures:
  - finance_msr_deferral_months_used
- id: finance_delinquency_and_closure
  subject:
  - finance_became_delinquent
  - finance_cured
  - finance_charged_off
  - finance_paid_off
  - finance_cancelled
  rule: >-
    An account becomes delinquent when a scheduled payment reaches the stated days past due and is reported
    to the credit bureaus from then on; it returns to active once every past-due payment is brought current.
    An account that reaches the charge-off point is charged off and moved to collections, which support
    does not handle. An account is paid off when its balance (finance_msr_balance) reaches zero, and an
    approved account the customer declines before funding is cancelled without charge.
  eligibility: []
  params:
    delinquent_at: =delinquency_days
    charge_off_at: =charge_off_days
  measures:
  - finance_msr_balance

extended_policies:
- id: finance_ext_late_fee_assessment
  base_policy_refs:
  - finance_payments
  - finance_late_fees
  - finance_returned_payments
  overwrite:
  - base_policy: finance_late_fees
    superseded_clause: >-
      The late fee is the plan's fixed fee or the stated share of the scheduled payment, whichever is lower, rounded
      to the cent.
    replaced_by: >-
      For every late fee assessed on a financing account whose plan carries no promotion (a fixed-rate or low-payment
      plan), and only for such a fee, the plain lower of the plan's fixed fee and the stated share is replaced by
      the fixed late fee, the share figure, the way the two are combined and the courtesy shares set out in this
      policy; the grace period, the one-fee-per-period limit, the hardship exclusion, the courtesy waiver and the
      error reversal of the base late fee rules stay as they are; a late fee on an account whose plan carries a
      promotion remains under the base late fee rules.
  trigger: state_due
  subject:
  - finance_fee_assessed
  computes: amount
  target_tool: post_finance_late_fee_832dc831
  params:
    first_late_fee: 15.0
    repeat_late_fee: 39.0
    large_project_price: 30000.0
    large_project_share: 0.035
    small_project_price: 15000.0
    small_project_share: 0.08
    service_courtesy_share: 0.8
    senior_courtesy_share: 0.9
    door_customer_share: 0.85
    careline_share: 0.95
    long_tenure_payments: 36
    mid_tenure_payments: 24
    long_tenure_share: 0.9
    mid_tenure_share: 0.95
  rule: >-
    A late fee is assessed once for a statement period whose scheduled payment is still unpaid after the plan's
    grace period that follows its due date, and it is posted as a late-fee entry naming that statement period on
    the day it is assessed. The late fee for a statement period is the plan's fixed late fee or the plan's stated
    share of the period's scheduled payment, whichever is lower, rounded to the cent. The scheduled payment is the
    plan's payment factor per 1,000.00 times the financed amount, rounded to the cent, never below the plan's minimum
    monthly payment. For every late fee assessed on a financing account whose plan carries no promotion (a fixed-rate
    or low-payment plan), and only for such a fee, the plain lower of the plan's fixed fee and the stated share
    is replaced by the fixed late fee, the share figure, the way the two are combined and the courtesy shares set
    out in this policy; the grace period, the one-fee-per-period limit, the hardship exclusion, the courtesy waiver
    and the error reversal of the base late fee rules stay as they are; a late fee on an account whose plan carries
    a promotion remains under the base late fee rules. The fixed late fee follows the late fees already standing
    on the account, counting the late-fee entries posted in the six months before the assessment date less the late-fee
    reversals posted in those same six months: none standing takes the schedule's first-late fee; two or more standing
    takes the schedule's repeat-late fee; exactly one standing takes the plan's fixed late fee. The share of the
    scheduled payment follows the size of the project the account finances, read from the signed contract price
    of the window or door contract it funds: a contract price at or above the schedule's large-project price takes
    the large-project share; a contract price below the schedule's small-project price takes the small-project share;
    any other contract price takes the plan's stated share. The share figure is that share times the scheduled payment,
    rounded to the cent. How the fixed late fee and the share figure are combined follows how far behind the account
    stands on the assessment date, counting as payments behind the scheduled payments that have fallen due (one
    for each statement period that carries a monthly-interest entry, less the months deferred under hardship deferrals)
    minus the whole scheduled payments covered by scheduled-payment entries net of returned payments: two or more
    payments behind takes the higher of the fixed late fee and the share figure; fewer than two payments behind,
    on an account that has never left a late fee standing unreversed and has never had a payment returned, takes
    the share figure alone; every other account takes the lower of the two. The combined figure is then multiplied
    by the program courtesy share for the discount program on the financed contract: the military or first-responder
    program takes the service courtesy share; the senior program takes the senior courtesy share; no program leaves
    the figure whole. It is then multiplied by the tenure share for the borrower's record, counting the whole scheduled
    payments covered by scheduled-payment entries net of returned payments: at least the long-tenure count takes
    the long-tenure share; at least the mid-tenure count but under the long-tenure count takes the mid-tenure share;
    fewer leaves the figure whole. It is then multiplied by the relationship share: a customer whose entry or patio
    door contract was paid by cash, check or card and is closed takes the door-customer share; otherwise a customer
    with an active CareLine service plan takes the CareLine share; any other customer leaves the figure whole. The
    three shares are applied one after another to the combined figure, and only the final result is rounded to the
    cent. Every amount this policy rounds to the cent goes to the nearest cent, and an exact half cent rounds up.
    A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
    status; an On-Call Service Account is not a CareLine plan. No late fee applies to a period covered by an approved
    hardship deferral, and a period whose payment posted on or before its last grace day draws none. An account
    paid ahead of its schedule counts as no scheduled payments behind. The plan attributes that call the fixed late
    fee the figure before the percentage limit and say a late fee never exceeds the stated share of the scheduled
    payment describe the base late fee; for an account this policy covers, the fixed late fee, the share figure,
    the way they are combined and the courtesy shares set out in this policy govern, and the late fee may exceed
    the stated share.
  prerequisite: []
  cross_category:
  - category: window
    as: branch
    reads:
    - contract_price
    - discount_program
    note: >-
      The financed window contract's signed price decides the share tier and its discount program decides the courtesy
      share.
  - category: door
    as: branch
    reads:
    - contract_price
    - discount_program
    - status
    - payment_method
    note: >-
      A door contract funded by the account supplies price and program; a closed cash-paid door contract decides
      the relationship share.
  - category: service
    as: existence
    reads:
    - status
    note: >-
      An active CareLine service plan decides the relationship share when no closed cash door contract exists.
  compute:
  - sched_payment: >-
      MX(P('min_monthly_payment'), int(F('financed_amount') * P('payment_factor_per_1000') / 1000 * 100 + 0.5 +
      1e-06) / 100)
  - late_fees_6m: >-
      COUNT('finance_transactions', within_months=6, date_field='txn_date', event_type='finance_fee_assessed', fee_kind='late_fee')
      - COUNT('finance_transactions', within_months=6, date_field='txn_date', event_type='finance_fee_reversed',
      fee_kind='late_fee')
  - fixed_late_fee: >-
      K('first_late_fee') if late_fees_6m <= 0 else K('repeat_late_fee') if late_fees_6m >= 2 else P('late_fee_amount')
  - project_price: >-
      CFIELD('window', 'contract_price', window_contract_id=F('window_contract_id')) if F('window_contract_id')
      else CFIELD('door', 'contract_price', door_contract_id=F('door_contract_id'))
  - share_rate: >-
      K('large_project_share') if project_price >= K('large_project_price') else K('small_project_share') if project_price
      < K('small_project_price') else P('late_fee_cap_pct_of_payment')
  - share_figure: int(share_rate * sched_payment * 100 + 0.5 + 1e-06) / 100
  - periods_due: >-
      COUNT('finance_transactions', event_type='finance_interest_assessed', interest_kind='monthly_interest') -
      SUM('finance_transactions', 'deferral_months', event_type='finance_payment_deferred')
  - payments_covered: >-
      int((SUM('finance_transactions', 'amount', event_type='finance_payment_posted', payment_kind='scheduled_payment')
      - SUM('finance_transactions', 'amount', event_type='finance_payment_returned')) / sched_payment + 1e-06)
  - payments_behind: MX(0, periods_due - payments_covered)
  - late_fees_ever: >-
      COUNT('finance_transactions', event_type='finance_fee_assessed', fee_kind='late_fee') - COUNT('finance_transactions',
      event_type='finance_fee_reversed', fee_kind='late_fee')
  - returns_ever: COUNT('finance_transactions', event_type='finance_payment_returned')
  - combined_fee: >-
      MX(fixed_late_fee, share_figure) if payments_behind >= 2 else share_figure if late_fees_ever <= 0 and returns_ever
      == 0 else MN(fixed_late_fee, share_figure)
  - program: >-
      CFIELD('window', 'discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id')
      else CFIELD('door', 'discount_program', door_contract_id=F('door_contract_id'))
  - program_share: >-
      K('service_courtesy_share') if program == 'military' or program == 'first_responder' else K('senior_courtesy_share')
      if program == 'senior' else 1.0
  - tenure_share: >-
      K('long_tenure_share') if payments_covered >= K('long_tenure_payments') else K('mid_tenure_share') if payments_covered
      >= K('mid_tenure_payments') else 1.0
  - door_cash_closed: EXISTS('door', status='closed', payment_method='cash_check_card')
  - careline_active: >-
      EXISTS('service', status='active', variant_name='CareLine Basic Plan') or EXISTS('service', status='active',
      variant_name='CareLine Plus Plan') or EXISTS('service', status='active', variant_name='CareLine Premier Plan')
      or EXISTS('service', status='active', variant_name='CareLine Premier 3-Year Plan') or EXISTS('service', status='active',
      variant_name='CareLine Estate Plan')
  - relationship_share: >-
      K('door_customer_share') if door_cash_closed else K('careline_share') if careline_active else 1.0
  - result: >-
      int(combined_fee * program_share * tenure_share * relationship_share * 100 + 0.5 + 1e-06) / 100
  compute_basis:
    sched_payment: >-
      The scheduled payment is the plan's payment factor per 1,000.00 times the financed amount, rounded to the
      cent, never below the plan's minimum monthly payment.
    late_fees_6m: >-
      counting the late-fee entries posted in the six months before the assessment date less the late-fee reversals
      posted in those same six months
    fixed_late_fee: >-
      none standing takes the schedule's first-late fee; two or more standing takes the schedule's repeat-late fee;
      exactly one standing takes the plan's fixed late fee.
    project_price: read from the signed contract price of the window or door contract it funds
    share_rate: >-
      a contract price at or above the schedule's large-project price takes the large-project share; a contract
      price below the schedule's small-project price takes the small-project share; any other contract price takes
      the plan's stated share.
    share_figure: The share figure is that share times the scheduled payment, rounded to the cent.
    periods_due: >-
      the scheduled payments that have fallen due (one for each statement period that carries a monthly-interest
      entry, less the months deferred under hardship deferrals)
    payments_covered: >-
      counting the whole scheduled payments covered by scheduled-payment entries net of returned payments
    payments_behind: An account paid ahead of its schedule counts as no scheduled payments behind.
    late_fees_ever: >-
      on an account that has never left a late fee standing unreversed and has never had a payment returned
    returns_ever: >-
      on an account that has never left a late fee standing unreversed and has never had a payment returned
    combined_fee: >-
      two or more payments behind takes the higher of the fixed late fee and the share figure; fewer than two payments
      behind, on an account that has never left a late fee standing unreversed and has never had a payment returned,
      takes the share figure alone; every other account takes the lower of the two.
    program: the program courtesy share for the discount program on the financed contract
    program_share: >-
      the military or first-responder program takes the service courtesy share; the senior program takes the senior
      courtesy share; no program leaves the figure whole.
    door_cash_closed: >-
      a customer whose entry or patio door contract was paid by cash, check or card and is closed takes the door-customer
      share
    careline_active: >-
      A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
      status; an On-Call Service Account is not a CareLine plan.
    relationship_share: >-
      a customer whose entry or patio door contract was paid by cash, check or card and is closed takes the door-customer
      share; otherwise a customer with an active CareLine service plan takes the CareLine share; any other customer
      leaves the figure whole.
    result: >-
      The three shares are applied one after another to the combined figure, and only the final result is rounded
      to the cent. Every amount this policy rounds to the cent goes to the nearest cent, and an exact half cent
      rounds up.
    tenure_share: >-
      at least the long-tenure count takes the long-tenure share; at least the mid-tenure count but under the long-tenure
      count takes the mid-tenure share; fewer leaves the figure whole.
  factors:
  - id: standing_late_count
    effect: parameter
    decides: fixed_late_fee
    bindings:
    - late_fees_6m
    - fixed_late_fee
    ladder:
    - when: no late-fee entry posted in the six months before the assessment date remains unreversed
      value: K('first_late_fee')
    - when: two or more late-fee entries posted in those six months remain unreversed
      value: K('repeat_late_fee')
    - when: otherwise (exactly one stands)
      value: P('late_fee_amount')
    baseline:
      fixed_late_fee: P('late_fee_amount')
    evidence:
    - history
    cross_difficulty: null
  - id: project_size_share
    effect: parameter
    decides: share_rate
    bindings:
    - project_price
    - share_rate
    ladder:
    - when: >-
        the signed contract price of the financed window or door contract is at or above the large-project price
      value: K('large_project_share')
    - when: the signed contract price is below the small-project price
      value: K('small_project_share')
    - when: otherwise
      value: P('late_fee_cap_pct_of_payment')
    baseline:
      share_rate: P('late_fee_cap_pct_of_payment')
    evidence:
    - cross_category
    cross_difficulty: window
  - id: arrears_combination
    effect: method
    decides: combined_fee
    bindings:
    - periods_due
    - payments_behind
    - late_fees_ever
    - returns_ever
    - combined_fee
    ladder:
    - when: two or more scheduled payments behind on the assessment date
      method: take the higher of the fixed late fee and the share figure
    - when: >-
        fewer than two payments behind, no late fee ever left standing unreversed and no payment ever returned
      method: take the share figure alone, ignoring the fixed late fee
    - when: otherwise
      method: take the lower of the fixed late fee and the share figure
    baseline:
      combined_fee: MN(fixed_late_fee, share_figure)
    evidence:
    - history
    cross_difficulty: null
  - id: program_courtesy
    effect: parameter
    decides: program_share
    bindings:
    - program
    - program_share
    ladder:
    - when: the financed contract carries the military or first-responder discount program
      value: K('service_courtesy_share')
    - when: the financed contract carries the senior discount program
      value: K('senior_courtesy_share')
    - when: otherwise (no program)
      value: '1.0'
    baseline:
      program_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: window
  - id: payment_tenure_courtesy
    effect: parameter
    decides: tenure_share
    bindings:
    - payments_covered
    - tenure_share
    ladder:
    - when: whole scheduled payments covered reach the long-tenure count
      value: K('long_tenure_share')
    - when: they reach the mid-tenure count but not the long-tenure count
      value: K('mid_tenure_share')
    - when: fewer
      value: '1.0'
    baseline:
      tenure_share: '1.0'
    evidence:
    - history
    cross_difficulty: null
  - id: household_relationship
    effect: parameter
    decides: relationship_share
    bindings:
    - door_cash_closed
    - careline_active
    - relationship_share
    ladder:
    - when: the customer's entry or patio door contract was paid by cash, check or card and is closed
      value: K('door_customer_share')
    - when: no such door contract, and the customer holds an active CareLine service plan
      value: K('careline_share')
    - when: otherwise
      value: '1.0'
    baseline:
      relationship_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      The late fee for a statement period is the plan's fixed late fee or the plan's stated share of the period's
      scheduled payment, whichever is lower, rounded to the cent. The scheduled payment is the plan's payment factor
      per 1,000.00 times the financed amount, rounded to the cent, never below the plan's minimum monthly payment.
    params:
    - late_fee_amount
    - late_fee_cap_pct_of_payment
    - payment_factor_per_1000
    - min_monthly_payment
  inputs:
    history:
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 6
      filters:
        event_type: finance_fee_assessed
        fee_kind: late_fee
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      filters:
        event_type: finance_interest_assessed
        interest_kind: monthly_interest
    - table: finance_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: finance_payment_posted
        payment_kind: scheduled_payment
    cross_category:
    - window
    - door
    - service
- id: finance_ext_hardship_request_months
  base_policy_refs:
  - finance_hardship
  overwrite:
  - base_policy: finance_hardship
    superseded_clause: >-
      In addition the plan must offer deferral, the account must be no more than the stated days past due, the months
      requested may not exceed the plan's maximum per deferral, and the months already used (finance_msr_deferral_months_used)
      plus those requested must stay within the plan's lifetime maximum.
    replaced_by: >-
      For a hardship request the borrower files on an account whose plan carries no promotion (a fixed-rate or low-payment
      plan), and only for such a request, the plan must still offer deferral and the account must still be no more
      than the stated days past due, while the months the borrower may ask for are the hardship offer set out in
      this policy in place of the plan's maximum per deferral and the lifetime maximum less the months already used;
      how many of those months are granted, and how a request that fails a condition is declined, remain with the
      hardship deferral rules; a request on an account whose plan carries a promotion remains under the base hardship
      rules.
  trigger: on_request
  subject:
  - finance_payment_deferred
  computes: requested_months
  target_tool: submit_finance_hardship_request_30b3e3a9
  params:
    damage_extension: 1
    double_damage_extension: 2
    long_tenure_payments: 36
    short_tenure_payments: 12
    tenure_extension: 2
    recent_deferral_cut: 1
    first_request_bonus: 1
    relationship_extension: 1
    double_relationship_extension: 2
    short_tenure_cut: 1
  rule: >-
    A borrower facing job loss, medical hardship, a natural disaster or reduced income files the hardship request
    themselves, stating the reason and the months of payment deferral asked for; a borrower who asks for the longest
    deferral available asks for the hardship offer, and the request records that number. For a hardship request
    the borrower files on an account whose plan carries no promotion (a fixed-rate or low-payment plan), and only
    for such a request, the plan must still offer deferral and the account must still be no more than the stated
    days past due, while the months the borrower may ask for are the hardship offer set out in this policy in place
    of the plan's maximum per deferral and the lifetime maximum less the months already used; how many of those
    months are granted, and how a request that fails a condition is declined, remain with the hardship deferral
    rules; a request on an account whose plan carries a promotion remains under the base hardship rules. The hardship
    offer is the plan's maximum months per deferral or the plan's lifetime maximum less the months already deferred,
    whichever is lower. The per-request cap of the hardship offer adds a storm-damage extension to the plan's maximum
    months per deferral, read from the customer's warranty claims discovered in the three months before the request:
    a glass-breakage claim and a frame-and-sash claim both on file add the double damage extension; a glass-breakage
    claim or a frame-and-sash claim, but not both, adds the damage extension; neither adds nothing. The lifetime
    room of the hardship offer is the plan's lifetime maximum plus a tenure extension, less the months already deferred:
    whole scheduled payments covered net of returned payments of at least the long-tenure count add the tenure extension;
    fewer than the short-tenure count take the short-tenure cut off; any other count changes nothing. Whole scheduled
    payments are counted against the scheduled monthly payment, which is the plan's payment factor per 1,000.00
    times the financed amount, rounded to the cent and not below the plan's minimum monthly payment. The months
    already deferred are counted according to the account's hardship history: an account carrying approved natural-disaster
    hardship requests counts every deferred month except the months asked on those natural-disaster requests; an
    account with none and funded at least sixty months before the request counts only the months deferred in the
    thirty-six months before the request; every other account counts every deferred month. The lower of the per-request
    cap and the lifetime room is then adjusted, one month at a time, for the deferral history: an account that has
    never had a deferral adds the first-request month; an account granted a deferral in the twenty-four months before
    the request loses the recent-deferral month; any other account is not adjusted. It is adjusted again for the
    household's other Ridgeline business: a customer whose entry or patio door contract was paid by cash, check
    or card and is closed and who also holds an active CareLine service plan adds the double relationship extension;
    a customer with one of the two adds the relationship extension; a customer with neither is not adjusted. The
    adjustments are added together to the lower figure; the offer is never more than the lifetime room and never
    below zero. The months asked on a request filed under this policy never exceed the hardship offer: a borrower
    who wants more is told the offer, and the request is filed for the offer. A CareLine service plan here means
    a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active status; an On-Call Service Account
    is not a CareLine plan. Every amount this policy rounds to the cent goes to the nearest cent, and an exact half
    cent rounds up. The plan attributes that give the most months one hardship deferral may cover and the most months
    of deferral over the life of the account describe the base hardship rules; for a request this policy covers,
    the per-request cap and the lifetime room set out in this policy govern.
  prerequisite: []
  cross_category:
  - category: warranty
    as: history
    reads:
    - warranty_claims.component
    - warranty_claims.discovery_date
    note: >-
      Storm-damage warranty claims discovered in the three months before the request decide the per-request extension.
  - category: door
    as: branch
    reads:
    - status
    - payment_method
    note: A closed cash-paid door contract counts toward the relationship extension.
  - category: service
    as: existence
    reads:
    - status
    note: An active CareLine service plan counts toward the relationship extension.
  compute:
  - sched_payment: >-
      MX(P('min_monthly_payment'), int(F('financed_amount') * P('payment_factor_per_1000') / 1000 * 100 + 0.5 +
      1e-06) / 100)
  - glass_claims: >-
      XCOUNT('warranty', 'warranty_claims', within_months=3, date_field='discovery_date', component='glass_breakage')
  - frame_claims: >-
      XCOUNT('warranty', 'warranty_claims', within_months=3, date_field='discovery_date', component='frame_sash')
  - damage_ext: >-
      K('double_damage_extension') if glass_claims >= 1 and frame_claims >= 1 else K('damage_extension') if glass_claims
      >= 1 or frame_claims >= 1 else 0
  - request_cap: P('hardship_deferral_max_months') + damage_ext
  - payments_covered: >-
      int((SUM('finance_transactions', 'amount', event_type='finance_payment_posted', payment_kind='scheduled_payment')
      - SUM('finance_transactions', 'amount', event_type='finance_payment_returned')) / sched_payment + 1e-06)
  - tenure_ext: >-
      K('tenure_extension') if payments_covered >= K('long_tenure_payments') else (0 - K('short_tenure_cut') if
      payments_covered < K('short_tenure_payments') else 0)
  - months_all: SUM('finance_transactions', 'deferral_months', event_type='finance_payment_deferred')
  - months_disaster: >-
      SUM('finance_hardship_requests', 'requested_months', request_status='approved', hardship_reason='natural_disaster')
  - months_recent: >-
      SUM('finance_transactions', 'deferral_months', within_months=36, date_field='txn_date', event_type='finance_payment_deferred')
  - months_deferred: >-
      months_all - months_disaster if months_disaster > 0 else months_recent if months_disaster <= 0 and MONTHS(F('funded_date'),
      NOW) >= 60 else months_all
  - lifetime_room: P('hardship_lifetime_max_months') + tenure_ext - months_deferred
  - lower_figure: MN(request_cap, lifetime_room)
  - deferral_count: COUNT('finance_transactions', event_type='finance_payment_deferred')
  - last_deferral: >-
      LATEST('finance_transactions', 'txn_date', date_field='txn_date', event_type='finance_payment_deferred')
  - history_adj: >-
      K('first_request_bonus') if deferral_count <= 0 else 0 - K('recent_deferral_cut') if MONTHS(last_deferral,
      NOW) < 24 else 0
  - door_cash_closed: EXISTS('door', status='closed', payment_method='cash_check_card')
  - careline_active: >-
      EXISTS('service', status='active', variant_name='CareLine Basic Plan') or EXISTS('service', status='active',
      variant_name='CareLine Plus Plan') or EXISTS('service', status='active', variant_name='CareLine Premier Plan')
      or EXISTS('service', status='active', variant_name='CareLine Premier 3-Year Plan') or EXISTS('service', status='active',
      variant_name='CareLine Estate Plan')
  - relationship_adj: >-
      K('double_relationship_extension') if door_cash_closed and careline_active else K('relationship_extension')
      if door_cash_closed or careline_active else 0
  - result: MX(0, MN(lifetime_room, lower_figure + history_adj + relationship_adj))
  compute_basis:
    sched_payment: >-
      Whole scheduled payments are counted against the scheduled monthly payment, which is the plan's payment factor
      per 1,000.00 times the financed amount, rounded to the cent and not below the plan's minimum monthly payment.
    glass_claims: read from the customer's warranty claims discovered in the three months before the request
    frame_claims: read from the customer's warranty claims discovered in the three months before the request
    damage_ext: >-
      a glass-breakage claim and a frame-and-sash claim both on file add the double damage extension; a glass-breakage
      claim or a frame-and-sash claim, but not both, adds the damage extension; neither adds nothing.
    request_cap: >-
      The per-request cap of the hardship offer adds a storm-damage extension to the plan's maximum months per deferral
    payments_covered: whole scheduled payments covered net of returned payments
    tenure_ext: >-
      whole scheduled payments covered net of returned payments of at least the long-tenure count add the tenure
      extension; fewer than the short-tenure count take the short-tenure cut off; any other count changes nothing.
    months_all: every other account counts every deferred month.
    months_disaster: >-
      an account carrying approved natural-disaster hardship requests counts every deferred month except the months
      asked on those natural-disaster requests
    months_recent: >-
      an account with none and funded at least sixty months before the request counts only the months deferred in
      the thirty-six months before the request
    months_deferred: >-
      an account carrying approved natural-disaster hardship requests counts every deferred month except the months
      asked on those natural-disaster requests; an account with none and funded at least sixty months before the
      request counts only the months deferred in the thirty-six months before the request; every other account counts
      every deferred month.
    lifetime_room: >-
      The lifetime room of the hardship offer is the plan's lifetime maximum plus a tenure extension, less the months
      already deferred
    lower_figure: >-
      The hardship offer is the plan's maximum months per deferral or the plan's lifetime maximum less the months
      already deferred, whichever is lower.
    deferral_count: an account that has never had a deferral adds the first-request month
    last_deferral: >-
      an account granted a deferral in the twenty-four months before the request loses the recent-deferral month
    history_adj: >-
      an account that has never had a deferral adds the first-request month; an account granted a deferral in the
      twenty-four months before the request loses the recent-deferral month; any other account is not adjusted.
    door_cash_closed: >-
      a customer whose entry or patio door contract was paid by cash, check or card and is closed and who also holds
      an active CareLine service plan adds the double relationship extension
    careline_active: >-
      A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
      status; an On-Call Service Account is not a CareLine plan.
    relationship_adj: >-
      a customer whose entry or patio door contract was paid by cash, check or card and is closed and who also holds
      an active CareLine service plan adds the double relationship extension; a customer with one of the two adds
      the relationship extension; a customer with neither is not adjusted.
    result: >-
      The adjustments are added together to the lower figure; the offer is never more than the lifetime room and
      never below zero.
  factors:
  - id: storm_damage_extension
    effect: parameter
    decides: damage_ext
    bindings:
    - glass_claims
    - frame_claims
    - damage_ext
    ladder:
    - when: >-
        a glass-breakage claim and a frame-and-sash claim were both discovered in the three months before the request
      value: K('double_damage_extension')
    - when: >-
        a glass-breakage claim or a frame-and-sash claim, but not both, was discovered in those three months
      value: K('damage_extension')
    - when: otherwise
      value: '0'
    baseline:
      damage_ext: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: warranty
  - id: tenure_room
    effect: parameter
    decides: tenure_ext
    bindings:
    - payments_covered
    - tenure_ext
    ladder:
    - when: whole scheduled payments covered net of returned payments reach the long-tenure count
      value: K('tenure_extension')
    - when: they fall short of the short-tenure count
      value: 0 - K('short_tenure_cut')
    - when: otherwise
      value: '0'
    baseline:
      tenure_ext: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: deferred_month_count
    effect: method
    decides: months_deferred
    bindings:
    - months_all
    - months_disaster
    - months_recent
    - months_deferred
    ladder:
    - when: the account carries approved natural-disaster hardship requests
      method: count every deferred month except the months asked on those natural-disaster requests
    - when: >-
        no approved natural-disaster request and the account was funded at least sixty months before the request
      method: count only the months deferred in the thirty-six months before the request
    - when: otherwise
      method: count every deferred month on the account
    baseline:
      months_deferred: months_all
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: deferral_history_adjustment
    effect: parameter
    decides: history_adj
    bindings:
    - deferral_count
    - last_deferral
    - history_adj
    ladder:
    - when: the account has never had a deferral
      value: K('first_request_bonus')
    - when: a deferral was granted in the twenty-four months before the request
      value: 0 - K('recent_deferral_cut')
    - when: otherwise
      value: '0'
    baseline:
      history_adj: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: household_relationship_months
    effect: parameter
    decides: relationship_adj
    bindings:
    - door_cash_closed
    - careline_active
    - relationship_adj
    ladder:
    - when: a closed door contract paid by cash, check or card and an active CareLine service plan
      value: K('double_relationship_extension')
    - when: one of the two
      value: K('relationship_extension')
    - when: neither
      value: '0'
    baseline:
      relationship_adj: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      The hardship offer is the plan's maximum months per deferral or the plan's lifetime maximum less the months
      already deferred, whichever is lower.
    params:
    - hardship_deferral_max_months
    - hardship_lifetime_max_months
  inputs:
    history:
    - table: finance_transactions
      aggregate: sum
      field: deferral_months
      filters:
        event_type: finance_payment_deferred
    - table: finance_hardship_requests
      aggregate: sum
      field: requested_months
      filters:
        request_status: approved
        hardship_reason: natural_disaster
    - table: finance_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: finance_payment_posted
        payment_kind: scheduled_payment
    - category: warranty
      table: warranty_claims
      aggregate: count
      field: warranty_claim_id
      within_months: 3
      filters:
        component: glass_breakage
    cross_category:
    - warranty
    - door
    - service
- id: finance_ext_hardship_deferral_grant
  base_policy_refs:
  - finance_hardship
  overwrite:
  - base_policy: finance_hardship
    superseded_clause: A request that fails any condition is declined.
    replaced_by: >-
      For a hardship request on an account whose plan carries no promotion (a fixed-rate or low-payment plan) that
      this policy decides, and only for such a request, a request that fails the seasoning, plan-offer or days-past-due
      condition is declined, and a request that meets them is granted for the months set out in this policy even
      where they differ from the months asked; how many months a borrower may ask for remains with the hardship
      request rules; a request on an account whose plan carries a promotion remains under the base hardship rules.
  trigger: on_request
  subject:
  - finance_payment_deferred
  computes: deferral_months
  target_tool: post_finance_hardship_deferral_5a1cdd93
  params:
    month_step: 1
    record_step: 2
    returned_limit: 2
    steady_record: 16
    thin_record: 6
    full_window_months: 12
    late_heavy: 3
    late_two: 2
  rule: >-
    A deferral answers a hardship request the borrower has filed, is booked on the account dated the day it is granted,
    names the first statement period it covers and the consecutive months it covers, and marks the request approved.
    The request answered is the most recent hardship request on the account whose status is submitted. The months
    granted are fixed only after the account carries a submitted hardship request from the borrower stating the
    months asked for. A deferral is not granted until the account carries a monthly-interest entry for every statement
    period whose due date has passed. A deferral is granted only when the account was funded at least the stated
    number of full calendar months before the request. For a hardship request on an account whose plan carries no
    promotion (a fixed-rate or low-payment plan) that this policy decides, and only for such a request, a request
    that fails the seasoning, plan-offer or days-past-due condition is declined, and a request that meets them is
    granted for the months set out in this policy even where they differ from the months asked; how many months
    a borrower may ask for remains with the hardship request rules; a request on an account whose plan carries a
    promotion remains under the base hardship rules. The months granted start from the months asked on the request,
    and the deferral covers as many consecutive statement periods as the months granted, starting with the first
    statement period whose due date has not yet passed. Scheduled payments whose due date has already passed stay
    due: a deferral never covers such a period, and those payments keep their own grace periods and late fee rules.
    The months granted are the months asked, adjusted for the account's record, and never more than the months asked
    nor below zero. The account's payment record adjusts the months: a record of sixteen or more adds two months,
    a record under six takes two months away, and any other record leaves the months alone. The payment record is
    the scheduled-payment entries posted in the twelve months before the grant less the payments returned unpaid
    in those twelve months. The span the payment record is read over follows the account's history: an account granted
    an earlier deferral reads its record over the whole calendar months from the latest earlier deferral's grant
    date to the grant date less the months that deferral covered; an account with no earlier deferral funded fewer
    than twelve whole months before the grant reads it over the whole months since funding plus one; every other
    account reads it over the twelve months before the grant. When the span so counted is zero months or less, no
    payment falls inside it and the payment record is zero. What the payment record counts follows how the borrower
    has been paying: an account that made an extra-principal payment within the span its record is read over counts
    whole scheduled payments' worth of money, the scheduled-payment and extra-principal amounts posted in that span
    less the amounts returned unpaid in it, divided by the scheduled monthly payment and rounded down; an account
    with no such payment that is enrolled in autopay counts its autopay draws in that span less the payments returned
    unpaid in it; every other account counts its scheduled-payment entries in that span less the payments returned
    unpaid in it. Payments returned unpaid in the twelve months before the grant also adjust the months: two or
    more take two months away; exactly one takes a month away; none, on an account still enrolled in autopay, adds
    a month; anything else leaves the months alone. Late fees standing from the six months before the grant, counting
    late-fee entries less late-fee reversals, also adjust the months: three or more take two months away; exactly
    two take a month away; fewer leave the months alone. Each scheduled monthly payment is the plan's payment factor
    per 1,000.00 times the financed amount, rounded to the cent, and never under the plan's minimum monthly payment.
    The adjustments are added together. Deferred payments move to the end of the term; interest keeps accruing and
    a promotional end date is never extended. The plan attributes that give the most months one hardship deferral
    may cover and the most months of deferral over the life of the account describe the base hardship rules; for
    a request this policy decides, the months granted are bounded by the months asked, which the hardship request
    rules bound by the hardship offer. Every amount this policy rounds to the cent goes to the nearest cent, and
    an exact half cent rounds up.
  prerequisite:
  - problem: finance_ext_hardship_request_months
    kind: value_input
    gate: months_asked
    form: state
    policy_source: >-
      The months granted are fixed only after the account carries a submitted hardship request from the borrower
      stating the months asked for.
    condition: >-
      The financing account carries a hardship request with request status submitted, recording the reason and the
      months of deferral the borrower asked for.
    resolved_by: submit_finance_hardship_request_30b3e3a9
    effect: >-
      The months asked, read from the submitted request, become the figure the adjustments start from and the cap
      the months granted never exceed.
  - problem: finance_ext_period_interest
    kind: state_gate
    gate: finance_transactions.interest_kind
    form: state
    policy_source: >-
      A deferral is not granted until the account carries a monthly-interest entry for every statement period whose
      due date has passed.
    condition: >-
      Every statement period whose due date has passed carries a monthly-interest entry on the account.
    resolved_by: post_finance_period_interest_067abc59
    effect: >-
      Once every passed period carries its monthly-interest entry the account's charges are current and the deferral
      may be granted; until then the grant is not made.
  cross_category: []
  compute:
  - sched_payment: >-
      MX(P('min_monthly_payment'), int(F('financed_amount') * P('payment_factor_per_1000') / 1000 * 100 + 0.5 +
      1e-06) / 100)
  - months_asked: >-
      LATEST('finance_hardship_requests', 'requested_months', date_field='created_at', request_status='submitted')
  - deferral_count: COUNT('finance_transactions', event_type='finance_payment_deferred')
  - last_grant: >-
      LATEST('finance_transactions', 'txn_date', date_field='txn_date', event_type='finance_payment_deferred')
  - last_months: >-
      LATEST('finance_transactions', 'deferral_months', date_field='txn_date', event_type='finance_payment_deferred')
  - record_window_months: >-
      MONTHS(last_grant, NOW) - last_months if deferral_count >= 1 else (MONTHS(F('funded_date'), NOW) + 1 if MONTHS(F('funded_date'),
      NOW) < K('full_window_months') else K('full_window_months'))
  - extra_payments: >-
      COUNT('finance_transactions', within_months=record_window_months, date_field='txn_date', event_type='finance_payment_posted',
      payment_kind='extra_principal')
  - returned_window: >-
      COUNT('finance_transactions', within_months=record_window_months, date_field='txn_date', event_type='finance_payment_returned')
  - measured_record: >-
      int((SUM('finance_transactions', 'amount', within_months=record_window_months, date_field='txn_date', event_type='finance_payment_posted',
      payment_kind='scheduled_payment') + SUM('finance_transactions', 'amount', within_months=record_window_months,
      date_field='txn_date', event_type='finance_payment_posted', payment_kind='extra_principal') - SUM('finance_transactions',
      'amount', within_months=record_window_months, date_field='txn_date', event_type='finance_payment_returned'))
      / sched_payment + 1e-06) if extra_payments >= 1 else (COUNT('finance_transactions', within_months=record_window_months,
      date_field='txn_date', event_type='finance_payment_posted', payment_channel='autopay') - returned_window if
      F('autopay_enrolled') == True else COUNT('finance_transactions', within_months=record_window_months, date_field='txn_date',
      event_type='finance_payment_posted', payment_kind='scheduled_payment') - returned_window)
  - record_adj: >-
      2 * K('month_step') if measured_record >= K('steady_record') else (0 - K('record_step') if measured_record
      < K('thin_record') else 0)
  - returns_12m: >-
      COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')
  - returns_adj: >-
      0 - 2 * K('month_step') if returns_12m >= K('returned_limit') else (0 - K('month_step') if returns_12m ==
      1 else (K('month_step') if F('autopay_enrolled') == True else 0))
  - late_6m: >-
      COUNT('finance_transactions', within_months=6, date_field='txn_date', event_type='finance_fee_assessed', fee_kind='late_fee')
      - COUNT('finance_transactions', within_months=6, date_field='txn_date', event_type='finance_fee_reversed',
      fee_kind='late_fee')
  - late_adj: >-
      0 - K('record_step') if late_6m >= K('late_heavy') else (0 - K('month_step') if late_6m == K('late_two') else
      0)
  - result: MX(0, MN(months_asked, months_asked + record_adj + returns_adj + late_adj))
  compute_basis:
    sched_payment: >-
      Each scheduled monthly payment is the plan's payment factor per 1,000.00 times the financed amount, rounded
      to the cent, and never under the plan's minimum monthly payment.
    months_asked: >-
      The request answered is the most recent hardship request on the account whose status is submitted.
    deferral_count: >-
      an account granted an earlier deferral reads its record over the whole calendar months from the latest earlier
      deferral's grant date to the grant date less the months that deferral covered
    last_grant: from the latest earlier deferral's grant date to the grant date
    last_months: less the months that deferral covered
    record_window_months: >-
      The span the payment record is read over follows the account's history: an account granted an earlier deferral
      reads its record over the whole calendar months from the latest earlier deferral's grant date to the grant
      date less the months that deferral covered; an account with no earlier deferral funded fewer than twelve whole
      months before the grant reads it over the whole months since funding plus one; every other account reads it
      over the twelve months before the grant. When the span so counted is zero months or less, no payment falls
      inside it and the payment record is zero.
    extra_payments: >-
      an account that made an extra-principal payment within the span its record is read over counts whole scheduled
      payments' worth of money
    returned_window: less the payments returned unpaid in it
    measured_record: >-
      What the payment record counts follows how the borrower has been paying: an account that made an extra-principal
      payment within the span its record is read over counts whole scheduled payments' worth of money, the scheduled-payment
      and extra-principal amounts posted in that span less the amounts returned unpaid in it, divided by the scheduled
      monthly payment and rounded down; an account with no such payment that is enrolled in autopay counts its autopay
      draws in that span less the payments returned unpaid in it; every other account counts its scheduled-payment
      entries in that span less the payments returned unpaid in it.
    record_adj: >-
      The account's payment record adjusts the months: a record of sixteen or more adds two months, a record under
      six takes two months away, and any other record leaves the months alone. The payment record is the scheduled-payment
      entries posted in the twelve months before the grant less the payments returned unpaid in those twelve months.
    returns_12m: Payments returned unpaid in the twelve months before the grant also adjust the months
    returns_adj: >-
      Payments returned unpaid in the twelve months before the grant also adjust the months: two or more take two
      months away; exactly one takes a month away; none, on an account still enrolled in autopay, adds a month;
      anything else leaves the months alone.
    late_6m: >-
      Late fees standing from the six months before the grant, counting late-fee entries less late-fee reversals
    late_adj: >-
      Late fees standing from the six months before the grant, counting late-fee entries less late-fee reversals,
      also adjust the months: three or more take two months away; exactly two take a month away; fewer leave the
      months alone.
    result: >-
      The months granted are the months asked, adjusted for the account's record, and never more than the months
      asked nor below zero.
  factors:
  - id: record_window_anchor
    effect: parameter
    decides: record_window_months
    bindings:
    - deferral_count
    - last_grant
    - last_months
    - record_window_months
    ladder:
    - when: the account was granted an earlier deferral
      value: >-
        the whole calendar months from the latest earlier deferral's grant date to the grant date less the months
        it covered
    - when: no earlier deferral and funded fewer than twelve whole months before the grant
      value: the whole months since funding plus one
    - when: otherwise
      value: K('full_window_months')
    baseline:
      record_window_months: K('full_window_months')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: record_measure
    effect: method
    decides: measured_record
    bindings:
    - extra_payments
    - returned_window
    - measured_record
    ladder:
    - when: an extra-principal payment was posted in the window
      method: >-
        sum the scheduled-payment and extra-principal money in the window less the returned money, divide by the
        scheduled monthly payment and round down
    - when: no extra-principal payment in the window and autopay enrolled
      method: count the autopay draws in the window less the returned payments
    - when: otherwise
      method: count the scheduled-payment entries in the window less the returned payments
    baseline:
      measured_record: >-
        COUNT('finance_transactions', within_months=record_window_months, date_field='txn_date', event_type='finance_payment_posted',
        payment_kind='scheduled_payment') - returned_window
    evidence:
    - history
    cross_difficulty: null
  - id: returned_payment_record
    effect: parameter
    decides: returns_adj
    bindings:
    - returns_12m
    - returns_adj
    ladder:
    - when: two or more payments returned unpaid in the twelve months before the grant
      value: 0 - 2 * K('month_step')
    - when: exactly one returned
      value: 0 - K('month_step')
    - when: none returned and autopay still enrolled
      value: K('month_step')
    - when: otherwise
      value: '0'
    baseline:
      returns_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: standing_late_record
    effect: parameter
    decides: late_adj
    bindings:
    - late_6m
    - late_adj
    ladder:
    - when: three or more late fees standing from the six months before the grant
      value: 0 - K('record_step')
    - when: exactly two standing
      value: 0 - K('month_step')
    - when: fewer
      value: '0'
    baseline:
      late_adj: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The months granted start from the months asked on the request, and the deferral covers as many consecutive
      statement periods as the months granted, starting with the first statement period whose due date has not yet
      passed. The months granted are the months asked, adjusted for the account's record, and never more than the
      months asked nor below zero. The account's payment record adjusts the months: a record of sixteen or more
      adds two months, a record under six takes two months away, and any other record leaves the months alone. The
      payment record is the scheduled-payment entries posted in the twelve months before the grant less the payments
      returned unpaid in those twelve months.
    params: []
  inputs:
    history:
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 12
      filters:
        event_type: finance_payment_returned
    - table: finance_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: finance_payment_posted
    - table: finance_transactions
      aggregate: latest
      field: txn_date
      filters:
        event_type: finance_payment_deferred
    - table: finance_hardship_requests
      aggregate: latest
      field: requested_months
      filters:
        request_status: submitted
    cross_category: []
- id: finance_ext_period_interest
  base_policy_refs:
  - finance_interest
  overwrite:
  - base_policy: finance_interest
    superseded_clause: >-
      Monthly interest for a statement period is the balance at the start of the period times one twelfth of the
      effective APR, rounded to the cent. The effective APR is the plan's purchase APR, reduced by the plan's autopay
      discount while autopay is enrolled at the start of the period; the discount is an override of the rate and
      never makes it negative.
    replaced_by: >-
      For an account whose plan carries no promotion, and only for such an account, the interest for a statement
      period is figured on the balance the account carries on the day the interest is posted, at the annual rate
      and in the manner set out in this policy, in place of the balance at the start of the period and the autopay
      enrollment at the start of the period; every promotional plan account remains under the base interest rules,
      and the discount still never makes the rate negative.
  trigger: state_due
  subject:
  - finance_interest_assessed
  computes: amount
  target_tool: post_finance_period_interest_067abc59
  params:
    loyalty_discount: 0.005
    loyal_payments: 24
    returned_premium: 0.01
    returned_count: 2
    late_posting_days: 35
    service_rate_courtesy: 0.005
    senior_rate_courtesy: 0.0025
    door_customer_rate_courtesy: 0.0025
    careline_rate_courtesy: 0.00125
    two_behind_margin: 0.02
    one_behind_margin: 0.005
    large_project_price: 45000.0
    large_project_rate_cut: 0.0025
    small_project_price: 15000.0
    small_project_rate_add: 0.0025
  rule: >-
    Monthly interest on an account whose plan carries no promotion is posted once for each statement period whose
    due date has passed, as a monthly-interest entry naming that period, on the day it is posted. For an account
    whose plan carries no promotion, and only for such an account, the interest for a statement period is figured
    on the balance the account carries on the day the interest is posted, at the annual rate and in the manner set
    out in this policy, in place of the balance at the start of the period and the autopay enrollment at the start
    of the period; every promotional plan account remains under the base interest rules, and the discount still
    never makes the rate negative. The monthly interest for a statement period is the account balance carried on
    the day the interest is posted times one twelfth of the annual rate, rounded to the cent. The annual rate is
    the plan's purchase APR, reduced by the plan's autopay discount while autopay is enrolled on that day. The balance
    carried is the funded principal plus every interest, fee and returned-payment entry, less every payment and
    fee reversal. The plan's autopay discount gives way to the account's payment standing: an account enrolled in
    autopay with no payment returned in the twelve months before the posting and at least the loyalty count of whole
    scheduled payments covered takes the loyalty discount off the purchase APR instead; an account not enrolled
    in autopay with at least the returned count of payments returned in those twelve months adds the returned-payment
    premium to the purchase APR; any other account takes the plan's autopay discount off while enrolled and nothing
    otherwise. Whole scheduled payments covered are scheduled-payment entries net of returned payments, divided
    by the scheduled monthly payment of the plan's payment factor per 1,000.00 times the financed amount, rounded
    to the cent and at least the plan's minimum monthly payment, and rounded down to a whole number. The discount
    program on the financed contract adjusts the rate: the military or first-responder program takes the service
    rate courtesy off; the senior program takes the senior rate courtesy off; no program leaves it. The household's
    other Ridgeline business adjusts it again: a closed entry or patio door contract paid by cash, check or card
    takes the door-customer rate courtesy off; otherwise an active CareLine service plan takes the CareLine rate
    courtesy off; otherwise it is left. Arrears add a margin, counting the scheduled payments behind on the posting
    day as the statement periods already carrying a monthly-interest entry, less the months deferred under hardship
    deferrals, minus the whole scheduled payments covered: two or more behind adds the two-behind margin; exactly
    one behind adds the one-behind margin; none behind adds nothing. The size of the financed project sets a pricing
    tier fixed when the loan was made, read from the signed contract price of the window or door contract the account
    funds: a contract price at or above the large-project price takes the large-project rate cut off; a contract
    price below the small-project price adds the small-project rate addition; any other contract price leaves the
    rate. All of these adjustments are added to the purchase APR together, and the annual rate never falls below
    zero. How the annual rate is applied follows the timing of the posting: interest posted more than the late-posting
    count of days after the previous monthly-interest entry, or after the funded date where there is none, is figured
    day by day as the balance times the annual rate times those days over 365; on an account funded before 1 January
    2023 whose interest is posted within that count, it is figured day by day as the balance times the annual rate
    times the days since the previous monthly-interest entry, or since the funded date where there is none, over
    360; on every other account it is the balance times one twelfth of the annual rate. Only the interest is rounded
    to the cent. Every amount this policy rounds to the cent goes to the nearest cent, and an exact half cent rounds
    up. A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
    status; an On-Call Service Account is not a CareLine plan. An account paid ahead of its schedule counts as no
    scheduled payments behind. The plan attributes that describe monthly interest as one twelfth of the effective
    APR applied to the balance at the start of the statement period, and the autopay discount as a reduction of
    the effective APR while autopay is enrolled, describe the base interest rules; for an account this policy covers,
    the balance carried on the posting day, the annual rate and the manner set out in this policy govern.
  prerequisite: []
  cross_category:
  - category: window
    as: branch
    reads:
    - discount_program
    - contract_price
    note: >-
      The financed window contract's discount program and signed price decide the program courtesy and the project-size
      pricing tier.
  - category: door
    as: branch
    reads:
    - discount_program
    - contract_price
    - status
    - payment_method
    note: >-
      A financed door contract supplies the program; a closed cash-paid door contract decides the relationship courtesy.
  - category: service
    as: existence
    reads:
    - status
    note: >-
      An active CareLine service plan decides the relationship courtesy when no closed cash door contract exists.
  compute:
  - balance_carried: >-
      SUM('finance_transactions', 'amount', event_type='finance_loan_disbursed') + SUM('finance_transactions', 'amount',
      event_type='finance_interest_assessed') + SUM('finance_transactions', 'amount', event_type='finance_fee_assessed')
      + SUM('finance_transactions', 'amount', event_type='finance_payment_returned') - SUM('finance_transactions',
      'amount', event_type='finance_payment_posted') - SUM('finance_transactions', 'amount', event_type='finance_fee_reversed')
  - sched_payment: >-
      MX(P('min_monthly_payment'), int(F('financed_amount') * P('payment_factor_per_1000') / 1000 * 100 + 0.5 +
      1e-06) / 100)
  - payments_covered: >-
      int((SUM('finance_transactions', 'amount', event_type='finance_payment_posted', payment_kind='scheduled_payment')
      - SUM('finance_transactions', 'amount', event_type='finance_payment_returned')) / sched_payment + 1e-06)
  - returns_12m: >-
      COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')
  - standing_adj: >-
      0 - K('loyalty_discount') if F('autopay_enrolled') == True and returns_12m <= 0 and (payments_covered >= K('loyal_payments'))
      else K('returned_premium') if F('autopay_enrolled') != True and returns_12m >= K('returned_count') else 0
      - P('autopay_apr_discount') if F('autopay_enrolled') == True else 0
  - program: >-
      CFIELD('window', 'discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id')
      else CFIELD('door', 'discount_program', door_contract_id=F('door_contract_id'))
  - program_adj: >-
      0 - K('service_rate_courtesy') if program == 'military' or program == 'first_responder' else 0 - K('senior_rate_courtesy')
      if program == 'senior' else 0
  - door_cash_closed: EXISTS('door', status='closed', payment_method='cash_check_card')
  - careline_active: >-
      EXISTS('service', status='active', variant_name='CareLine Basic Plan') or EXISTS('service', status='active',
      variant_name='CareLine Plus Plan') or EXISTS('service', status='active', variant_name='CareLine Premier Plan')
      or EXISTS('service', status='active', variant_name='CareLine Premier 3-Year Plan') or EXISTS('service', status='active',
      variant_name='CareLine Estate Plan')
  - relationship_adj: >-
      0 - K('door_customer_rate_courtesy') if door_cash_closed else 0 - K('careline_rate_courtesy') if careline_active
      else 0
  - periods_posted: >-
      COUNT('finance_transactions', event_type='finance_interest_assessed', interest_kind='monthly_interest') -
      SUM('finance_transactions', 'deferral_months', event_type='finance_payment_deferred')
  - payments_behind: MX(0, periods_posted - payments_covered)
  - arrears_margin: >-
      K('two_behind_margin') if payments_behind >= 2 else K('one_behind_margin') if payments_behind == 1 else 0
  - project_price: >-
      CFIELD('window', 'contract_price', window_contract_id=F('window_contract_id')) if F('window_contract_id')
      else CFIELD('door', 'contract_price', door_contract_id=F('door_contract_id'))
  - project_rate: >-
      0 - K('large_project_rate_cut') if project_price >= K('large_project_price') else K('small_project_rate_add')
      if project_price < K('small_project_price') else 0
  - annual_rate: >-
      MX(0, P('purchase_apr') + standing_adj + program_adj + relationship_adj + arrears_margin + project_rate)
  - previous_posting: >-
      LATEST('finance_transactions', 'txn_date', date_field='txn_date', event_type='finance_interest_assessed',
      interest_kind='monthly_interest')
  - accrual_days: DAYS(previous_posting if previous_posting else F('funded_date'), NOW)
  - period_interest: >-
      int(balance_carried * annual_rate * accrual_days / 365 * 100 + 0.5 + 1e-06) / 100 if accrual_days > K('late_posting_days')
      else int(balance_carried * annual_rate * accrual_days / 360 * 100 + 0.5 + 1e-06) / 100 if DAYS(F('funded_date'),
      '2023-01-01') > 0 else int(balance_carried * annual_rate / 12 * 100 + 0.5 + 1e-06) / 100
  - result: period_interest
  compute_basis:
    balance_carried: >-
      The balance carried is the funded principal plus every interest, fee and returned-payment entry, less every
      payment and fee reversal.
    sched_payment: >-
      divided by the scheduled monthly payment of the plan's payment factor per 1,000.00 times the financed amount,
      rounded to the cent and at least the plan's minimum monthly payment
    payments_covered: >-
      Whole scheduled payments covered are scheduled-payment entries net of returned payments, divided by the scheduled
      monthly payment of the plan's payment factor per 1,000.00 times the financed amount, rounded to the cent and
      at least the plan's minimum monthly payment, and rounded down to a whole number.
    returns_12m: >-
      an account enrolled in autopay with no payment returned in the twelve months before the posting
    standing_adj: >-
      an account enrolled in autopay with no payment returned in the twelve months before the posting and at least
      the loyalty count of whole scheduled payments covered takes the loyalty discount off the purchase APR instead;
      an account not enrolled in autopay with at least the returned count of payments returned in those twelve months
      adds the returned-payment premium to the purchase APR; any other account takes the plan's autopay discount
      off while enrolled and nothing otherwise.
    program: The discount program on the financed contract adjusts the rate
    program_adj: >-
      the military or first-responder program takes the service rate courtesy off; the senior program takes the
      senior rate courtesy off; no program leaves it.
    door_cash_closed: >-
      a closed entry or patio door contract paid by cash, check or card takes the door-customer rate courtesy off
    careline_active: >-
      A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
      status; an On-Call Service Account is not a CareLine plan.
    relationship_adj: >-
      a closed entry or patio door contract paid by cash, check or card takes the door-customer rate courtesy off;
      otherwise an active CareLine service plan takes the CareLine rate courtesy off; otherwise it is left.
    periods_posted: >-
      counting the scheduled payments behind on the posting day as the statement periods already carrying a monthly-interest
      entry, less the months deferred under hardship deferrals, minus the whole scheduled payments covered
    payments_behind: An account paid ahead of its schedule counts as no scheduled payments behind.
    arrears_margin: >-
      two or more behind adds the two-behind margin; exactly one behind adds the one-behind margin; none behind
      adds nothing.
    annual_rate: >-
      All of these adjustments are added to the purchase APR together, and the annual rate never falls below zero.
    previous_posting: >-
      interest posted more than the late-posting count of days after the previous monthly-interest entry, or after
      the funded date where there is none
    accrual_days: >-
      the days since the previous monthly-interest entry, or since the funded date where there is none
    period_interest: >-
      interest posted more than the late-posting count of days after the previous monthly-interest entry, or after
      the funded date where there is none, is figured day by day as the balance times the annual rate times those
      days over 365; on an account funded before 1 January 2023 whose interest is posted within that count, it is
      figured day by day as the balance times the annual rate times the days since the previous monthly-interest
      entry, or since the funded date where there is none, over 360; on every other account it is the balance times
      one twelfth of the annual rate.
    result: >-
      Only the interest is rounded to the cent. Every amount this policy rounds to the cent goes to the nearest
      cent, and an exact half cent rounds up.
    project_price: read from the signed contract price of the window or door contract the account funds
    project_rate: >-
      a contract price at or above the large-project price takes the large-project rate cut off; a contract price
      below the small-project price adds the small-project rate addition; any other contract price leaves the rate.
  factors:
  - id: payment_standing_rate
    effect: parameter
    decides: standing_adj
    bindings:
    - returns_12m
    - standing_adj
    ladder:
    - when: >-
        enrolled in autopay, no payment returned in the twelve months before the posting and at least the loyalty
        count of whole scheduled payments covered
      value: 0 - K('loyalty_discount')
    - when: >-
        not enrolled in autopay and at least the returned count of payments returned in those twelve months
      value: K('returned_premium')
    - when: otherwise
      value: 0 - P('autopay_apr_discount') while enrolled, else 0
    baseline:
      standing_adj: 0 - P('autopay_apr_discount') if F('autopay_enrolled') == True else 0
    evidence:
    - history
    cross_difficulty: null
  - id: posting_timing_basis
    effect: method
    decides: period_interest
    bindings:
    - previous_posting
    - accrual_days
    - period_interest
    ladder:
    - when: >-
        posted more than the late-posting count of days after the previous monthly-interest entry (or the funded
        date)
      method: 'day by day: balance times annual rate times the elapsed days over 365'
    - when: funded before 1 January 2023 and posted within that count
      method: >-
        day by day on a 360-day year: balance times annual rate times the days since the previous entry over 360
    - when: otherwise
      method: balance times one twelfth of the annual rate
    baseline:
      period_interest: int(balance_carried * annual_rate / 12 * 100 + 0.5 + 1e-06) / 100
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: program_rate_courtesy
    effect: parameter
    decides: program_adj
    bindings:
    - program
    - program_adj
    ladder:
    - when: the financed contract carries the military or first-responder program
      value: 0 - K('service_rate_courtesy')
    - when: the financed contract carries the senior program
      value: 0 - K('senior_rate_courtesy')
    - when: otherwise
      value: '0'
    baseline:
      program_adj: '0'
    evidence:
    - cross_category
    cross_difficulty: window
  - id: household_rate_courtesy
    effect: parameter
    decides: relationship_adj
    bindings:
    - door_cash_closed
    - careline_active
    - relationship_adj
    ladder:
    - when: a closed entry or patio door contract paid by cash, check or card
      value: 0 - K('door_customer_rate_courtesy')
    - when: otherwise an active CareLine service plan
      value: 0 - K('careline_rate_courtesy')
    - when: otherwise
      value: '0'
    baseline:
      relationship_adj: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: arrears_rate_margin
    effect: parameter
    decides: arrears_margin
    bindings:
    - periods_posted
    - payments_behind
    - arrears_margin
    ladder:
    - when: two or more scheduled payments behind on the posting day
      value: K('two_behind_margin')
    - when: exactly one behind
      value: K('one_behind_margin')
    - when: none behind
      value: '0'
    baseline:
      arrears_margin: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: project_size_rate
    effect: parameter
    decides: project_rate
    bindings:
    - project_price
    - project_rate
    ladder:
    - when: >-
        the signed contract price of the financed window or door contract is at or above the large-project price
      value: 0 - K('large_project_rate_cut')
    - when: the signed contract price is below the small-project price
      value: K('small_project_rate_add')
    - when: otherwise
      value: '0'
    baseline:
      project_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: window
  baseline:
    rule: >-
      The monthly interest for a statement period is the account balance carried on the day the interest is posted
      times one twelfth of the annual rate, rounded to the cent. The annual rate is the plan's purchase APR, reduced
      by the plan's autopay discount while autopay is enrolled on that day. The balance carried is the funded principal
      plus every interest, fee and returned-payment entry, less every payment and fee reversal.
    params:
    - purchase_apr
    - autopay_apr_discount
  inputs:
    history:
    - table: finance_transactions
      aggregate: sum
      field: amount
      filters: {}
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 12
      filters:
        event_type: finance_payment_returned
    - table: finance_transactions
      aggregate: latest
      field: txn_date
      filters:
        event_type: finance_interest_assessed
    cross_category:
    - window
    - door
    - service
- id: finance_ext_phone_payment_fee
  base_policy_refs:
  - finance_payments
  - finance_late_fees
  - finance_returned_payments
  overwrite:
  - base_policy: finance_payments
    superseded_clause: >-
      A payment made through a phone agent carries the plan's phone payment fee once per payment, on the posting
      date and naming that payment.
    replaced_by: >-
      For a payment taken through a phone agent, and only for such a payment, the fee it carries is the agent-assisted
      fee set out in this policy in place of the plan's flat phone payment fee; it is still charged once per payment,
      on the payment's posting date and naming that payment, and autopay, online portal and mailed payments stay
      free.
  trigger: state_due
  subject:
  - finance_fee_assessed
  computes: amount
  target_tool: post_finance_phone_fee_cbbb3871
  params:
    frequent_phone_fee: 12.95
    courtesy_phone_fee: 4.95
    frequent_phone_count: 3
    small_payment_share: 0.03
    large_payment_share: 0.005
    service_phone_share: 0.8
    senior_phone_share: 0.9
    door_customer_phone_share: 0.85
    careline_phone_share: 0.95
  rule: >-
    For a payment taken through a phone agent, and only for such a payment, the fee it carries is the agent-assisted
    fee set out in this policy in place of the plan's flat phone payment fee; it is still charged once per payment,
    on the payment's posting date and naming that payment, and autopay, online portal and mailed payments stay free.
    The phone payment fee is not charged while an approved hardship deferral is in effect. The agent-assisted fee
    for a payment is the plan's phone payment fee, charged as a flat amount and rounded to the cent. The fee follows
    how often the borrower relies on agents: a borrower not enrolled in autopay whose payments taken through a phone
    agent in the twelve months before the day the fee is entered on the account, the named payment included, reach
    the frequent-caller count pays the frequent-caller fee; a borrower enrolled in autopay with at most one such
    payment in those twelve months pays the courtesy fee; every other borrower pays the plan's phone payment fee.
    The size of the named payment then decides how that fee is charged, measured against the scheduled monthly payment
    (the plan's payment factor per 1,000.00 times the financed amount, rounded to the cent, never below the plan's
    minimum monthly payment): a payment smaller than the scheduled monthly payment is charged the lower of the fee
    and the small-payment share of the payment, rounded to the cent; a payment of at least twice the scheduled monthly
    payment is charged the higher of the fee and the large-payment share of the payment, rounded to the cent; any
    other payment is charged the fee as a flat amount. The fee so charged is then multiplied by the program share
    for the discount program on the financed contract: the military or first-responder program takes the service
    phone share; the senior program takes the senior phone share; no program leaves it whole. It is then multiplied
    by the household share: a closed entry or patio door contract paid by cash, check or card takes the door-customer
    phone share; otherwise an active CareLine service plan takes the CareLine phone share; otherwise it is left
    whole. The two shares apply one after the other and only the final fee is rounded to the cent. Every amount
    this policy rounds to the cent goes to the nearest cent, and an exact half cent rounds up. The payment named
    is the most recent payment taken through a phone agent; when that payment already carries its phone payment
    fee, nothing more is charged. The twelve months are counted back from the day the fee is entered on the account,
    whatever earlier posting date the fee itself carries. A CareLine service plan here means a CareLine Basic, Plus,
    Premier, Premier 3-Year or Estate plan in active status; an On-Call Service Account is not a CareLine plan.
    The plan attribute that gives a flat phone payment fee for a payment made through a phone agent describes the
    base fee; for a payment this policy covers, the agent-assisted fee set out in this policy governs, and the flat
    fee is its standard amount.
  prerequisite: []
  cross_category:
  - category: window
    as: branch
    reads:
    - discount_program
    note: The financed window contract's discount program decides the program share.
  - category: door
    as: branch
    reads:
    - discount_program
    - status
    - payment_method
    note: >-
      A financed door contract supplies the program; a closed cash-paid door contract decides the household share.
  - category: service
    as: existence
    reads:
    - status
    note: >-
      An active CareLine service plan decides the household share when no closed cash door contract exists.
  compute:
  - phone_calls_12m: >-
      COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_posted',
      payment_channel='phone_agent')
  - caller_fee: >-
      K('frequent_phone_fee') if phone_calls_12m >= K('frequent_phone_count') and F('autopay_enrolled') != True
      else K('courtesy_phone_fee') if phone_calls_12m <= 1 and F('autopay_enrolled') == True else P('phone_payment_fee')
  - sched_payment: >-
      MX(P('min_monthly_payment'), int(F('financed_amount') * P('payment_factor_per_1000') / 1000 * 100 + 0.5 +
      1e-06) / 100)
  - named_payment: >-
      LATEST('finance_transactions', 'amount', date_field='txn_date', event_type='finance_payment_posted', payment_channel='phone_agent')
  - named_payment_id: >-
      LATEST('finance_transactions', 'finance_txn_id', date_field='txn_date', event_type='finance_payment_posted',
      payment_channel='phone_agent')
  - latest_fee_source: >-
      LATEST('finance_transactions', 'source_finance_txn_id', date_field='txn_date', event_type='finance_fee_assessed',
      fee_kind='phone_payment_fee')
  - charged_fee: >-
      MN(caller_fee, int(K('small_payment_share') * named_payment * 100 + 0.5 + 1e-06) / 100) if named_payment <
      sched_payment else MX(caller_fee, int(K('large_payment_share') * named_payment * 100 + 0.5 + 1e-06) / 100)
      if named_payment >= 2 * sched_payment else caller_fee
  - program: >-
      CFIELD('window', 'discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id')
      else CFIELD('door', 'discount_program', door_contract_id=F('door_contract_id'))
  - program_share: >-
      K('service_phone_share') if program == 'military' or program == 'first_responder' else K('senior_phone_share')
      if program == 'senior' else 1.0
  - door_cash_closed: EXISTS('door', status='closed', payment_method='cash_check_card')
  - careline_active: >-
      EXISTS('service', status='active', variant_name='CareLine Basic Plan') or EXISTS('service', status='active',
      variant_name='CareLine Plus Plan') or EXISTS('service', status='active', variant_name='CareLine Premier Plan')
      or EXISTS('service', status='active', variant_name='CareLine Premier 3-Year Plan') or EXISTS('service', status='active',
      variant_name='CareLine Estate Plan')
  - household_share: >-
      K('door_customer_phone_share') if door_cash_closed else K('careline_phone_share') if careline_active else
      1.0
  - result: >-
      0 if latest_fee_source == named_payment_id else int(charged_fee * program_share * household_share * 100 +
      0.5 + 1e-06) / 100
  compute_basis:
    phone_calls_12m: >-
      whose payments taken through a phone agent in the twelve months before the day the fee is entered on the account,
      the named payment included, reach the frequent-caller count
    caller_fee: >-
      a borrower not enrolled in autopay whose payments taken through a phone agent in the twelve months before
      the day the fee is entered on the account, the named payment included, reach the frequent-caller count pays
      the frequent-caller fee; a borrower enrolled in autopay with at most one such payment in those twelve months
      pays the courtesy fee; every other borrower pays the plan's phone payment fee.
    sched_payment: >-
      measured against the scheduled monthly payment (the plan's payment factor per 1,000.00 times the financed
      amount, rounded to the cent, never below the plan's minimum monthly payment)
    named_payment: >-
      The payment named is the most recent payment taken through a phone agent; when that payment already carries
      its phone payment fee, nothing more is charged.
    charged_fee: >-
      a payment smaller than the scheduled monthly payment is charged the lower of the fee and the small-payment
      share of the payment, rounded to the cent; a payment of at least twice the scheduled monthly payment is charged
      the higher of the fee and the large-payment share of the payment, rounded to the cent; any other payment is
      charged the fee as a flat amount.
    program: the program share for the discount program on the financed contract
    program_share: >-
      the military or first-responder program takes the service phone share; the senior program takes the senior
      phone share; no program leaves it whole.
    door_cash_closed: >-
      a closed entry or patio door contract paid by cash, check or card takes the door-customer phone share
    careline_active: >-
      A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
      status; an On-Call Service Account is not a CareLine plan.
    household_share: >-
      a closed entry or patio door contract paid by cash, check or card takes the door-customer phone share; otherwise
      an active CareLine service plan takes the CareLine phone share; otherwise it is left whole.
    result: >-
      The two shares apply one after the other and only the final fee is rounded to the cent. Every amount this
      policy rounds to the cent goes to the nearest cent, and an exact half cent rounds up.
    named_payment_id: The payment named is the most recent payment taken through a phone agent
    latest_fee_source: when that payment already carries its phone payment fee, nothing more is charged.
  factors:
  - id: agent_reliance_tier
    effect: parameter
    decides: caller_fee
    bindings:
    - phone_calls_12m
    - caller_fee
    ladder:
    - when: >-
        not enrolled in autopay and phone-agent payments in the twelve months reach the frequent-caller count
      value: K('frequent_phone_fee')
    - when: enrolled in autopay and at most one phone-agent payment in those twelve months
      value: K('courtesy_phone_fee')
    - when: otherwise
      value: P('phone_payment_fee')
    baseline:
      caller_fee: P('phone_payment_fee')
    evidence:
    - history
    cross_difficulty: null
  - id: payment_size_basis
    effect: method
    decides: charged_fee
    bindings:
    - named_payment
    - charged_fee
    ladder:
    - when: the named payment is smaller than the scheduled monthly payment
      method: charge the lower of the fee and the small-payment share of the payment
    - when: the named payment is at least twice the scheduled monthly payment
      method: charge the higher of the fee and the large-payment share of the payment
    - when: otherwise
      method: charge the fee as a flat amount
    baseline:
      charged_fee: caller_fee
    evidence:
    - history
    cross_difficulty: null
  - id: program_phone_share
    effect: parameter
    decides: program_share
    bindings:
    - program
    - program_share
    ladder:
    - when: the financed contract carries the military or first-responder program
      value: K('service_phone_share')
    - when: the financed contract carries the senior program
      value: K('senior_phone_share')
    - when: otherwise
      value: '1.0'
    baseline:
      program_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: window
  - id: household_phone_share
    effect: parameter
    decides: household_share
    bindings:
    - door_cash_closed
    - careline_active
    - household_share
    ladder:
    - when: a closed entry or patio door contract paid by cash, check or card
      value: K('door_customer_phone_share')
    - when: otherwise an active CareLine service plan
      value: K('careline_phone_share')
    - when: otherwise
      value: '1.0'
    baseline:
      household_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      The agent-assisted fee for a payment is the plan's phone payment fee, charged as a flat amount and rounded
      to the cent.
    params:
    - phone_payment_fee
  inputs:
    history:
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 12
      filters:
        event_type: finance_payment_posted
        payment_channel: phone_agent
    - table: finance_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: finance_payment_posted
        payment_channel: phone_agent
    cross_category:
    - window
    - door
    - service
- id: finance_ext_catch_up_payment
  base_policy_refs:
  - finance_payments
  - finance_agg_combined_exposure
  overwrite: []
  trigger: on_request
  subject:
  - finance_payment_posted
  computes: amount
  target_tool: submit_finance_portal_payment_b662a17f
  params:
    service_relief_share: 0.35
    senior_relief_share: 0.25
    door_customer_relief_share: 0.2
    careline_relief_share: 0.15
    long_tenure_count: 36
    mid_tenure_count: 24
    long_tenure_relief_share: 0.1
    mid_tenure_relief_share: 0.05
    clean_record_relief_share: 0.1
    single_return_relief_share: 0.05
  rule: >-
    This policy figures the catch-up payment on an account whose plan carries no promotion (a fixed-rate or low-payment
    plan). No catch-up figure is quoted for an account on a promotional plan: such an account is brought current
    only by paying its scheduled payments as they are shown on the account, each applied first to fees, then to
    interest, then to principal under the base payment rules, and a borrower on such a plan who asks for a single
    catch-up figure is referred to a representative. A borrower who is behind may bring the account back toward
    the plan's schedule by paying a catch-up payment themselves through the online portal; it is recorded as a scheduled
    payment, free of any phone fee, credited to the oldest statement period it brings current, and it is applied
    first to fees, then to interest, then to principal. A catch-up payment is fixed only after the account carries
    the late fee owed for every statement period whose scheduled payment stayed unpaid past its grace period. A
    catch-up payment is not figured until the most recent payment taken through a phone agent carries its phone
    payment fee. A catch-up payment brings the account back to the plan's schedule through its oldest scheduled
    payment behind: it is the balance on the account less the scheduled balance after the scheduled payments already
    covered plus one, but never beyond the scheduled payments that have fallen due, rounded to the cent and never
    below zero. The balance on the account is the funded principal with every interest, fee and returned-payment
    entry added and every payment and fee reversal taken off. The scheduled balance after a number of scheduled
    payments is the financed amount grown at one twelfth of the plan's purchase APR for that many months, less the
    scheduled monthly payment times that growth less one, divided by one twelfth of the purchase APR, rounded to
    the cent; on a plan whose purchase APR is zero it is the financed amount less that many scheduled monthly payments.
    The scheduled monthly payment is the plan's payment factor per 1,000.00 applied to the financed amount, rounded
    to the cent and at least the plan's minimum monthly payment. The scheduled payments already covered are the
    scheduled-payment entries less the returned payments, divided by the scheduled monthly payment and rounded down
    to a whole number, and the scheduled payments behind are the statement periods carrying a monthly-interest entry,
    less months deferred under hardship deferrals, minus the payments covered. How the catch-up figure is worked
    out depends on the arrears: an account two or more scheduled payments behind pays the unpaid part of the scheduled
    payments that have fallen due, being the scheduled monthly payment times the statement periods fallen due less
    the scheduled-payment money already paid net of returned payments, plus the fee pool; an account exactly one
    payment behind and enrolled in autopay pays the fee pool alone, leaving the next draw to collect the payment
    behind; every other account pays the balance on the account less the scheduled balance after the scheduled payments
    already covered plus one, but never beyond the scheduled payments that have fallen due. Part of the fee pool,
    being the late fees, returned-payment fees and phone payment fees posted in the three months before the payment
    less the fee reversals posted in those months (a pool below zero counts as zero), is left on the balance instead
    of being collected in the catch-up payment, at the sum of four relief shares. The discount program on the financed
    contract gives the program relief share: the military or first-responder program takes the service relief share;
    the senior program takes the senior relief share; no program gives none. The household's other Ridgeline business
    gives the household relief share: a closed entry or patio door contract paid by cash, check or card takes the
    door-customer relief share; otherwise an active CareLine service plan takes the CareLine relief share; otherwise
    none. The borrower's tenure gives the tenure relief share: payments covered reaching the long-tenure count take
    the long-tenure relief share; payments covered reaching the mid-tenure count but not the long-tenure count take
    the mid-tenure relief share; fewer take none. The borrower's returned-payment record gives the record relief
    share, counting payments returned unpaid in the twelve months before the payment: none returned takes the clean-record
    relief share; exactly one returned takes the single-return relief share; two or more give none. The four shares
    are added together, the relief is that sum times the fee pool, rounded to the cent and never more than the fee
    pool, and the catch-up payment is the figure so worked out less the relief, rounded to the cent and never below
    zero. Every amount this policy rounds to the cent goes to the nearest cent, and an exact half cent rounds up.
    A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
    status; an On-Call Service Account is not a CareLine plan. An account paid ahead of its schedule counts as no
    scheduled payments behind.
  prerequisite:
  - problem: finance_ext_late_fee_assessment
    kind: value_input
    gate: fee_pool
    form: state
    policy_source: >-
      A catch-up payment is fixed only after the account carries the late fee owed for every statement period whose
      scheduled payment stayed unpaid past its grace period.
    condition: >-
      Every statement period whose scheduled payment was still unpaid after its grace period carries a late-fee
      entry on the account.
    resolved_by: post_finance_late_fee_832dc831
    effect: >-
      The posted late fee joins the fee pool of the last three months (and the balance), so the catch-up figure
      and its relief move.
  - problem: finance_ext_phone_payment_fee
    kind: value_input
    gate: fee_pool
    form: state
    policy_source: >-
      A catch-up payment is not figured until the most recent payment taken through a phone agent carries its phone
      payment fee.
    condition: >-
      The most recent payment entry taken through a phone agent is named by a phone-payment-fee entry on the account.
    resolved_by: post_finance_phone_fee_cbbb3871
    effect: >-
      The posted phone payment fee joins the fee pool of the last three months (and the balance), moving the catch-up
      and its relief.
  cross_category:
  - category: window
    as: branch
    reads:
    - discount_program
    note: The financed window contract's discount program decides the program relief share.
  - category: door
    as: branch
    reads:
    - discount_program
    - status
    - payment_method
    note: >-
      A financed door contract supplies the program; a closed cash-paid door contract decides the household relief
      share.
  - category: service
    as: existence
    reads:
    - status
    note: An active CareLine service plan decides the household relief share.
  compute:
  - balance_on_account: >-
      SUM('finance_transactions', 'amount', event_type='finance_loan_disbursed') + SUM('finance_transactions', 'amount',
      event_type='finance_interest_assessed') + SUM('finance_transactions', 'amount', event_type='finance_fee_assessed')
      + SUM('finance_transactions', 'amount', event_type='finance_payment_returned') - SUM('finance_transactions',
      'amount', event_type='finance_payment_posted') - SUM('finance_transactions', 'amount', event_type='finance_fee_reversed')
  - sched_payment: >-
      MX(P('min_monthly_payment'), int(F('financed_amount') * P('payment_factor_per_1000') / 1000 * 100 + 0.5 +
      1e-06) / 100)
  - payments_covered: >-
      int((SUM('finance_transactions', 'amount', event_type='finance_payment_posted', payment_kind='scheduled_payment')
      - SUM('finance_transactions', 'amount', event_type='finance_payment_returned')) / sched_payment + 1e-06)
  - periods_due: >-
      COUNT('finance_transactions', event_type='finance_interest_assessed', interest_kind='monthly_interest') -
      SUM('finance_transactions', 'deferral_months', event_type='finance_payment_deferred')
  - payments_behind: MX(0, periods_due - payments_covered)
  - schedule_reach: MN(periods_due, payments_covered + 1)
  - monthly_rate: P('purchase_apr') / 12
  - scheduled_balance: >-
      int((F('financed_amount') * (1 + monthly_rate) ** schedule_reach - sched_payment * ((1 + monthly_rate) **
      schedule_reach - 1) / monthly_rate) * 100 + 0.5 + 1e-06) / 100 if monthly_rate > 0 else int((F('financed_amount')
      - sched_payment * schedule_reach) * 100 + 0.5 + 1e-06) / 100
  - paid_net: >-
      SUM('finance_transactions', 'amount', event_type='finance_payment_posted', payment_kind='scheduled_payment')
      - SUM('finance_transactions', 'amount', event_type='finance_payment_returned')
  - unpaid_installments: MX(0, periods_due * sched_payment - paid_net)
  - fee_pool: >-
      MX(0, SUM('finance_transactions', 'amount', within_months=3, date_field='txn_date', event_type='finance_fee_assessed')
      - SUM('finance_transactions', 'amount', within_months=3, date_field='txn_date', event_type='finance_fee_reversed'))
  - program: >-
      CFIELD('window', 'discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id')
      else CFIELD('door', 'discount_program', door_contract_id=F('door_contract_id'))
  - program_relief: >-
      K('service_relief_share') if program == 'military' or program == 'first_responder' else K('senior_relief_share')
      if program == 'senior' else 0
  - door_cash_closed: EXISTS('door', status='closed', payment_method='cash_check_card')
  - careline_active: >-
      EXISTS('service', status='active', variant_name='CareLine Basic Plan') or EXISTS('service', status='active',
      variant_name='CareLine Plus Plan') or EXISTS('service', status='active', variant_name='CareLine Premier Plan')
      or EXISTS('service', status='active', variant_name='CareLine Premier 3-Year Plan') or EXISTS('service', status='active',
      variant_name='CareLine Estate Plan')
  - household_relief: >-
      K('door_customer_relief_share') if door_cash_closed else K('careline_relief_share') if careline_active else
      0
  - tenure_relief: >-
      K('long_tenure_relief_share') if payments_covered >= K('long_tenure_count') else K('mid_tenure_relief_share')
      if payments_covered >= K('mid_tenure_count') else 0
  - returns_12m: >-
      COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')
  - record_relief: >-
      K('clean_record_relief_share') if returns_12m <= 0 else K('single_return_relief_share') if returns_12m ==
      1 else 0
  - fee_relief: >-
      MN(fee_pool, int(fee_pool * (program_relief + household_relief + tenure_relief + record_relief) * 100 + 0.5
      + 1e-06) / 100)
  - catch_up_figure: >-
      unpaid_installments + fee_pool if payments_behind >= 2 else (fee_pool if (payments_behind == 1 and F('autopay_enrolled')
      == True) else balance_on_account - scheduled_balance)
  - result: MX(0, int((catch_up_figure - fee_relief) * 100 + 0.5 + 1e-06) / 100)
  compute_basis:
    balance_on_account: >-
      The balance on the account is the funded principal with every interest, fee and returned-payment entry added
      and every payment and fee reversal taken off.
    sched_payment: >-
      The scheduled monthly payment is the plan's payment factor per 1,000.00 applied to the financed amount, rounded
      to the cent and at least the plan's minimum monthly payment.
    payments_covered: >-
      The scheduled payments already covered are the scheduled-payment entries less the returned payments, divided
      by the scheduled monthly payment and rounded down to a whole number
    periods_due: >-
      the scheduled payments behind are the statement periods carrying a monthly-interest entry, less months deferred
      under hardship deferrals, minus the payments covered.
    payments_behind: An account paid ahead of its schedule counts as no scheduled payments behind.
    monthly_rate: the financed amount grown at one twelfth of the plan's purchase APR for that many months
    scheduled_balance: >-
      The scheduled balance after a number of scheduled payments is the financed amount grown at one twelfth of
      the plan's purchase APR for that many months, less the scheduled monthly payment times that growth less one,
      divided by one twelfth of the purchase APR, rounded to the cent; on a plan whose purchase APR is zero it is
      the financed amount less that many scheduled monthly payments.
    fee_pool: >-
      the fee pool, being the late fees, returned-payment fees and phone payment fees posted in the three months
      before the payment less the fee reversals posted in those months (a pool below zero counts as zero)
    program: The discount program on the financed contract gives the program relief share
    program_relief: >-
      the military or first-responder program takes the service relief share; the senior program takes the senior
      relief share; no program gives none.
    door_cash_closed: >-
      a closed entry or patio door contract paid by cash, check or card takes the door-customer relief share
    careline_active: >-
      A CareLine service plan here means a CareLine Basic, Plus, Premier, Premier 3-Year or Estate plan in active
      status; an On-Call Service Account is not a CareLine plan.
    household_relief: >-
      a closed entry or patio door contract paid by cash, check or card takes the door-customer relief share; otherwise
      an active CareLine service plan takes the CareLine relief share; otherwise none.
    tenure_relief: >-
      payments covered reaching the long-tenure count take the long-tenure relief share; payments covered reaching
      the mid-tenure count but not the long-tenure count take the mid-tenure relief share; fewer take none.
    fee_relief: >-
      The four shares are added together, the relief is that sum times the fee pool, rounded to the cent and never
      more than the fee pool
    result: >-
      the catch-up payment is the figure so worked out less the relief, rounded to the cent and never below zero.
      Every amount this policy rounds to the cent goes to the nearest cent, and an exact half cent rounds up.
    returns_12m: counting payments returned unpaid in the twelve months before the payment
    record_relief: >-
      none returned takes the clean-record relief share; exactly one returned takes the single-return relief share;
      two or more give none.
    schedule_reach: >-
      every other account pays the balance on the account less the scheduled balance after the scheduled payments
      already covered plus one, but never beyond the scheduled payments that have fallen due.
    paid_net: less the scheduled-payment money already paid net of returned payments
    unpaid_installments: >-
      the unpaid part of the scheduled payments that have fallen due, being the scheduled monthly payment times
      the statement periods fallen due less the scheduled-payment money already paid net of returned payments
    catch_up_figure: >-
      How the catch-up figure is worked out depends on the arrears: an account two or more scheduled payments behind
      pays the unpaid part of the scheduled payments that have fallen due, being the scheduled monthly payment times
      the statement periods fallen due less the scheduled-payment money already paid net of returned payments, plus
      the fee pool; an account exactly one payment behind and enrolled in autopay pays the fee pool alone, leaving
      the next draw to collect the payment behind; every other account pays the balance on the account less the
      scheduled balance after the scheduled payments already covered plus one, but never beyond the scheduled payments
      that have fallen due.
  factors:
  - id: arrears_amount_basis
    effect: method
    decides: catch_up_figure
    bindings:
    - periods_due
    - payments_behind
    - paid_net
    - unpaid_installments
    - catch_up_figure
    ladder:
    - when: two or more scheduled payments behind
      method: >-
        the unpaid part of the scheduled payments fallen due (scheduled payment times periods fallen due less money
        paid net of returns) plus the fee pool
    - when: exactly one payment behind and enrolled in autopay
      method: the fee pool alone
    - when: otherwise
      method: >-
        the balance less the scheduled balance after the payments covered plus one, never beyond the payments fallen
        due
    baseline:
      catch_up_figure: balance_on_account - scheduled_balance
    evidence:
    - history
    cross_difficulty: null
  - id: program_fee_relief
    effect: parameter
    decides: program_relief
    bindings:
    - program
    - program_relief
    ladder:
    - when: the financed contract carries the military or first-responder program
      value: K('service_relief_share')
    - when: the financed contract carries the senior program
      value: K('senior_relief_share')
    - when: otherwise
      value: '0'
    baseline:
      program_relief: '0'
    evidence:
    - cross_category
    cross_difficulty: window
  - id: household_fee_relief
    effect: parameter
    decides: household_relief
    bindings:
    - door_cash_closed
    - careline_active
    - household_relief
    ladder:
    - when: a closed entry or patio door contract paid by cash, check or card
      value: K('door_customer_relief_share')
    - when: otherwise an active CareLine service plan
      value: K('careline_relief_share')
    - when: otherwise
      value: '0'
    baseline:
      household_relief: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: tenure_fee_relief
    effect: parameter
    decides: tenure_relief
    bindings:
    - payments_covered
    - tenure_relief
    ladder:
    - when: payments covered reach the long-tenure count
      value: K('long_tenure_relief_share')
    - when: payments covered reach the mid-tenure count but not the long-tenure count
      value: K('mid_tenure_relief_share')
    - when: fewer
      value: '0'
    baseline:
      tenure_relief: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: returned_record_relief
    effect: parameter
    decides: record_relief
    bindings:
    - returns_12m
    - record_relief
    ladder:
    - when: no payment returned unpaid in the twelve months before the payment
      value: K('clean_record_relief_share')
    - when: exactly one returned
      value: K('single_return_relief_share')
    - when: two or more returned
      value: '0'
    baseline:
      record_relief: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      A catch-up payment brings the account back to the plan's schedule through its oldest scheduled payment behind:
      it is the balance on the account less the scheduled balance after the scheduled payments already covered plus
      one, but never beyond the scheduled payments that have fallen due, rounded to the cent and never below zero.
      The balance on the account is the funded principal with every interest, fee and returned-payment entry added
      and every payment and fee reversal taken off. The scheduled balance after a number of scheduled payments is
      the financed amount grown at one twelfth of the plan's purchase APR for that many months, less the scheduled
      monthly payment times that growth less one, divided by one twelfth of the purchase APR, rounded to the cent;
      on a plan whose purchase APR is zero it is the financed amount less that many scheduled monthly payments.
      The scheduled monthly payment is the plan's payment factor per 1,000.00 applied to the financed amount, rounded
      to the cent and at least the plan's minimum monthly payment.
    params:
    - purchase_apr
    - payment_factor_per_1000
    - min_monthly_payment
  inputs:
    history:
    - table: finance_transactions
      aggregate: sum
      field: amount
      filters: {}
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      filters:
        event_type: finance_interest_assessed
        interest_kind: monthly_interest
    - table: finance_transactions
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: finance_fee_assessed
    cross_category:
    - window
    - door
    - service
