events:
- type: install_job_opened
  target: install_jobs
  mutation: create
  meaning: An installation job is opened when the factory order arrives at the branch.
  grain: One row per installation job.
  fields:
    customer_id: The customer.
    window_contract_id: The window contract installed, or empty.
    door_contract_id: The door contract installed, or empty.
    factory_order_id: The factory order whose units are installed.
    variant_name: The installation method, as its official name.
    job_number: The installation job number.
    opened_date: Date the job was opened.
    unit_count: Openings or door units to install.
    permit_required: Whether the job is permitted and inspected.
  triggers: []
- type: install_scheduled
  target: install_jobs
  mutation:
    transition:
      from: opened
      to: scheduled
  meaning: A crew date is booked with the customer.
  grain: One row per transaction.
  fields:
    scheduled_date: The first crew day booked.
    crew_days_planned: Crew days booked.
  triggers: []
- type: install_reschedule_logged
  target: install_activities
  meaning: A booked crew date is moved or released, with who caused it and how much notice was given.
  grain: One row per change of one booked crew date.
  distinguish_by:
  - activity_date
  - previous_date
  fields:
    activity_date: Date the reschedule was requested or the failed visit happened.
    initiated_by: customer, company or weather.
    notice_hours: Whole hours of notice before 08:00 on the booked crew date (0 for a failed-access visit).
    previous_date: The crew date being moved.
    new_date: The new crew date, or empty when the job is left unscheduled.
  triggers:
  - event: install:install_date_changed
    when:
      new_date:
        not: ''
    map:
      scheduled_date: new_date
  - event: install:install_unscheduled
    when:
      new_date: ''
    map:
      scheduled_date: new_date
- type: install_date_changed
  target: install_jobs
  mutation: update
  meaning: The job's booked crew date is changed to a new date.
  grain: One row per transaction.
  fields:
    scheduled_date: The new first crew day.
  triggers: []
- type: install_unscheduled
  target: install_jobs
  mutation:
    transition:
      from: scheduled
      to: opened
  meaning: The booked crew date is released and the job waits for a new date.
  grain: One row per transaction.
  fields:
    scheduled_date: Cleared to empty.
  triggers: []
- type: install_started
  target: install_jobs
  mutation:
    transition:
      from: scheduled
      to: in_progress
  meaning: The crew starts work at the home.
  grain: One row per transaction.
  fields:
    started_date: Date work started.
  triggers: []
- type: install_crew_day_logged
  target: install_activities
  meaning: A crew day at the home is recorded with the units installed and the crew's arrival.
  grain: One row per crew day.
  distinguish_by:
  - crew_day_number
  fields:
    activity_date: Date of the crew day.
    crew_day_number: Sequence number of the crew day on the job.
    units: Units installed that day.
    arrival_minutes_late: Minutes the crew arrived after the end of the arrival window (0 when on time).
  triggers: []
- type: install_completed
  target: install_jobs
  mutation:
    transition:
      from: in_progress
      to: completed
  meaning: The customer signs the completion certificate at the final walkthrough.
  grain: One row per transaction.
  fields:
    completed_date: Date the completion certificate was signed.
    window_contract_id: The window contract installed (carried from the job, not rewritten), or empty.
    door_contract_id: The door contract installed (carried from the job, not rewritten), or empty.
  triggers:
  - event: window:window_installation_completed
    when:
      window_contract_id:
        not: ''
    map:
      completion_date: completed_date
  - event: door:door_installation_completed
    when:
      door_contract_id:
        not: ''
    map:
      completion_date: completed_date
  - event: order:order_closed
    map:
      closed_date: completed_date
  - event: warranty:warranty_registered
    map:
      customer_id: customer_id
      window_contract_id: window_contract_id
      door_contract_id: door_contract_id
      install_job_id: install_job_id
      coverage_start_date: completed_date
      registration_kind: original_purchase
      transfer_count: 0
- type: install_fee_assessed
  target: install_activities
  meaning: A job charge or fee is billed to the customer.
  grain: One row per charge of one kind assessed on one date.
  distinguish_by:
  - fee_kind
  - activity_date
  fields:
    activity_date: Date the charge was assessed.
    amount: Charge amount (positive).
    fee_kind: >-
      late_reschedule_fee, failed_access_fee, lead_safe_fee, permit_admin_fee, rot_repair_charge, interior_trim_charge,
      exterior_capping_charge, stucco_patch_charge, storm_window_removal_fee, treatment_removal_fee or
      upper_story_surcharge.
    units: Openings priced, or linear feet for rot repair.
  account: job_charges
  direction: in
  triggers: []
- type: install_credit_issued
  target: install_activities
  meaning: A credit or a fee waiver reduces the job charges owed.
  grain: One row per credit of one kind for one source.
  distinguish_by:
  - credit_kind
  - activity_date
  - source_install_activity_id
  fields:
    activity_date: Date of the credit.
    amount: Credit amount (positive).
    credit_kind: fee_waiver, late_arrival_credit or company_reschedule_credit.
    source_install_activity_id: The fee waived, the crew day arrived late, or the company reschedule credited.
  account: job_charges
  direction: out
  triggers: []
- type: install_punch_logged
  target: install_activities
  meaning: An item to finish or correct is recorded at the final walkthrough or after it.
  grain: One row per punch item kind recorded on one date.
  distinguish_by:
  - punch_kind
  - activity_date
  fields:
    activity_date: Date the item was recorded.
    punch_kind: >-
      caulk_touch_up, screen_missing, hardware_adjustment, trim_damage, glass_scratch or cleanup.
    units: Openings affected.
  triggers: []
- type: install_punch_resolved
  target: install_activities
  meaning: A recorded punch item is resolved.
  grain: One row per punch item resolved.
  distinguish_by:
  - source_install_activity_id
  fields:
    activity_date: Date the item was resolved.
    source_install_activity_id: The punch item resolved.
  triggers: []
- type: install_closed
  target: install_jobs
  mutation:
    transition:
      from: completed
      to: closed
  meaning: The job is closed after punch items and any inspection clear.
  grain: One row per transaction.
  fields:
    closed_date: Date the job was closed.
  triggers: []
- type: install_cancelled
  target: install_jobs
  mutation:
    transition:
    - from: opened
      to: cancelled
    - from: scheduled
      to: cancelled
  meaning: The job is cancelled after its contract is cancelled.
  grain: One row per transaction.
  fields:
    cancelled_date: Date the job was cancelled.
  triggers: []
measures:
- id: install_msr_customer_reschedules
  window: Job lifetime up to and including the reschedule being handled.
  measure: >-
    Count of install_reschedule_logged rows of the job with initiated_by customer, including failed-access
    visits.
- id: install_msr_net_charges
  window: Job lifetime up to the moment of handling.
  measure: >-
    Sum of amount over install_fee_assessed rows of the job minus sum of amount over its install_credit_issued
    rows.
- id: install_msr_open_punch_items
  window: Job lifetime up to the moment of handling.
  measure: >-
    Count of install_punch_logged rows of the job that no install_punch_resolved row names as its source.
policies:
- id: install_agg_multi_holding
  subject:
  - install_job_opened
  rule: >-
    A customer holds one installation job for every factory order delivered to the branch, so the number
    of jobs is not capped by itself. A factory order that already has an installation job that is not
    cancelled never gets a second one. Units remade after delivery are installed on the same job.
  eligibility:
  - id: one_job_per_order
    applies_to:
    - install_job_opened
    kind: dedup
    condition: >-
      A factory order that already has an installation job that is not cancelled never gets a second one.
    evidence_fields:
    - install_jobs.factory_order_id
    - install_jobs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - install_jobs.factory_order_id
      action_bindings:
        install_jobs.factory_order_id: factory_order_id
    dedup_contract:
      table: install_jobs
      mode: separate_record
      object_bindings:
        factory_order_id: factory_order_id
      duplicate_filters:
        status:
        - opened
        - scheduled
        - in_progress
        - completed
        - closed
      distinct_fields:
      - job_number
  params:
    max_per_customer: null
- id: install_agg_concurrent_jobs
  subject:
  - install_scheduled
  - install_fee_assessed
  rule: >-
    When a customer has a window job and a door job open at the same time, the two may be booked on consecutive
    crew days or on the same day by separate crews, but each job keeps its own crew days, reschedule counts,
    fees, credits and punch list. A per-job fee or minimum is charged once on each job it applies to;
    a per-opening fee is charged on the job that installs those openings. A fee is never charged on one
    job for openings installed by another job.
  eligibility: []
  measures:
  - install_msr_net_charges
- id: install_scheduling
  subject:
  - install_scheduled
  - install_started
  - install_crew_day_logged
  - install_credit_issued
  rule: >-
    A first crew date is offered within the method's offer window, counted in business days (Monday through
    Friday, excluding U.S. federal holidays) from the day after the job was opened. Crew days planned
    are the job's units divided by the method's units per crew day, rounded up to a whole day. Homeowners-association
    or historic-district approval is obtained by the customer before a date is booked. On every crew day
    the crew arrives inside the arrival window that starts at the stated time; a crew arriving more than
    the grace minutes after the window ends earns the customer the method's late-arrival credit once for
    that crew day. Before the crew arrives the customer clears the stated space in front of each opening
    and takes down window treatments; the crew removes and hauls away the old units. Alarm sensor reconnection
    and interior painting are not part of the job. When suspected asbestos or mold is uncovered the crew
    stops work and the branch manager takes the job over, and support makes no commitment on dates or
    charges for it.
  eligibility: []
  params:
    per_tier:
      Insert Pocket Installation:
        per_day: =openings_per_crew_day
        offer_days: =schedule_offer_business_days
        late_credit: =late_arrival_credit
      Full-Frame Installation:
        per_day: =openings_per_crew_day
        offer_days: =schedule_offer_business_days
        late_credit: =late_arrival_credit
      Full-Frame Installation with Exterior Trim Wrap:
        per_day: =openings_per_crew_day
        offer_days: =schedule_offer_business_days
        late_credit: =late_arrival_credit
      Masonry Opening Installation:
        per_day: =openings_per_crew_day
        offer_days: =schedule_offer_business_days
        late_credit: =late_arrival_credit
      Bay and Bow Installation:
        per_day: =openings_per_crew_day
        offer_days: =schedule_offer_business_days
        late_credit: =late_arrival_credit
      Door System Installation:
        per_day: =openings_per_crew_day
        offer_days: =schedule_offer_business_days
        late_credit: =late_arrival_credit
    window_start: =arrival_window_start
    window_hours: =arrival_window_hours
    grace: =late_arrival_grace_minutes
    clearance: =customer_clearance_feet
    haul_away: =haul_away_included
    alarm: =alarm_sensor_reconnect_included
    paint: =interior_paint_included
    hoa: =hoa_approval_customer_responsible
    hazard: =hazard_stop_work
    max_units: =max_units_per_job
- id: install_reschedules
  subject:
  - install_reschedule_logged
  - install_date_changed
  - install_unscheduled
  - install_fee_assessed
  - install_credit_issued
  rule: >-
    Every change to a booked crew date is recorded as one reschedule with who caused it and the whole
    hours of notice before 08:00 on the booked crew date. A crew date can be changed only while the job
    status is scheduled. A customer reschedule is on time only when it is requested at least the method's
    notice hours before the booked crew arrival. The notice is measured in whole hours backward from 08:00
    on the booked crew date, and a request made exactly at the notice limit is on time. On-time customer
    reschedules up to the free count carry no fee; a customer reschedule that is late or beyond the free
    count (install_msr_customer_reschedules) carries the method's late reschedule fee. A failed-access
    visit, when nobody gives the crew access within the stated wait or the work area is not cleared, is
    recorded as a customer reschedule with zero notice and carries the failed-access fee instead of the
    late reschedule fee. When the job already carries the maximum number of customer reschedules, a further
    one needs branch manager approval and is not booked by support. A company reschedule given with less
    than the company notice earns the method's company reschedule credit; with enough notice it earns
    nothing. A weather reschedule, called when the forecast is below the minimum temperature or above
    the maximum wind, carries neither fee nor credit. A new date is offered within the method's reschedule
    window; a reschedule with no new date returns the job to opened.
  eligibility:
  - id: reschedule_status
    applies_to:
    - install_reschedule_logged
    kind: state
    condition: A crew date can be changed only while the job status is scheduled.
    evidence_fields:
    - install_jobs.install_job_id
    - install_jobs.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - install_jobs.install_job_id
      action_bindings:
        install_jobs.install_job_id: install_job_id
    state_contract:
      field: install_jobs.status
      allowed:
      - scheduled
  - id: customer_notice
    applies_to:
    - install_reschedule_logged
    kind: time
    condition: >-
      A customer reschedule is on time only when it is requested at least the method's notice hours before
      the booked crew arrival.
    evidence_fields:
    - install_jobs.install_job_id
    - install_jobs.scheduled_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - install_jobs.install_job_id
      action_bindings:
        install_jobs.install_job_id: install_job_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the booked crew arrival
      anchor_source: install_jobs.scheduled_date
      relation: not_after
      duration_source: variants.reschedule_notice_hours
      unit: elapsed_hours
      counting_rule: >-
        The notice is measured in whole hours backward from 08:00 on the booked crew date, and a request
        made exactly at the notice limit is on time.
      boundary: inclusive
  params:
    per_tier:
      Insert Pocket Installation:
        notice: =reschedule_notice_hours
        late_fee: =late_reschedule_fee
        access_fee: =failed_access_fee
        company_credit: =company_reschedule_credit
        offer_days: =reschedule_offer_business_days
      Full-Frame Installation:
        notice: =reschedule_notice_hours
        late_fee: =late_reschedule_fee
        access_fee: =failed_access_fee
        company_credit: =company_reschedule_credit
        offer_days: =reschedule_offer_business_days
      Full-Frame Installation with Exterior Trim Wrap:
        notice: =reschedule_notice_hours
        late_fee: =late_reschedule_fee
        access_fee: =failed_access_fee
        company_credit: =company_reschedule_credit
        offer_days: =reschedule_offer_business_days
      Masonry Opening Installation:
        notice: =reschedule_notice_hours
        late_fee: =late_reschedule_fee
        access_fee: =failed_access_fee
        company_credit: =company_reschedule_credit
        offer_days: =reschedule_offer_business_days
      Bay and Bow Installation:
        notice: =reschedule_notice_hours
        late_fee: =late_reschedule_fee
        access_fee: =failed_access_fee
        company_credit: =company_reschedule_credit
        offer_days: =reschedule_offer_business_days
      Door System Installation:
        notice: =reschedule_notice_hours
        late_fee: =late_reschedule_fee
        access_fee: =failed_access_fee
        company_credit: =company_reschedule_credit
        offer_days: =reschedule_offer_business_days
    free_reschedules: =free_customer_reschedules
    max_reschedules: =max_customer_reschedules
    company_notice: =company_reschedule_notice_hours
    wait_minutes: =no_access_wait_minutes
    access_counts: =failed_access_counts_as_reschedule
    weather_free: =weather_reschedule_no_charge
    min_temp: =weather_min_temp_f
    max_wind: =weather_max_wind_mph
  measures:
  - install_msr_customer_reschedules
- id: install_lead_safe
  subject:
  - install_fee_assessed
  rule: >-
    Replacing windows or doors disturbs painted surfaces, so in older homes the crew follows lead-safe
    work practices under the EPA Renovation, Repair and Painting rule, led by a certified renovator, with
    containment, cleanup and cleaning verification. Lead-safe work practices and their fee apply only
    when the home at the service address was built before the stated year according to the customer profile.
    The fee is the method's lead-safe fee per opening times the openings on the job, never less than the
    method's minimum per job, assessed once on the first crew day. A home built in or after the stated
    year carries no lead-safe fee, whatever the customer asks.
  eligibility:
  - id: pre_1978_home
    applies_to:
    - install_fee_assessed
    kind: authorization
    condition: >-
      Lead-safe work practices and their fee apply only when the home at the service address was built
      before the stated year according to the customer profile.
    evidence_fields:
    - customers.customer_id
    - customers.home_year_built
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  params:
    per_tier:
      Insert Pocket Installation:
        per_opening: =lead_safe_fee_per_opening
        minimum: =lead_safe_min_fee_per_job
      Full-Frame Installation:
        per_opening: =lead_safe_fee_per_opening
        minimum: =lead_safe_min_fee_per_job
      Full-Frame Installation with Exterior Trim Wrap:
        per_opening: =lead_safe_fee_per_opening
        minimum: =lead_safe_min_fee_per_job
      Masonry Opening Installation:
        per_opening: =lead_safe_fee_per_opening
        minimum: =lead_safe_min_fee_per_job
      Bay and Bow Installation:
        per_opening: =lead_safe_fee_per_opening
        minimum: =lead_safe_min_fee_per_job
      Door System Installation:
        per_opening: =lead_safe_fee_per_opening
        minimum: =lead_safe_min_fee_per_job
    year_before: =lead_safe_year_built_before
  formula:
    lead_safe_fee: max(lead_safe_min_fee_per_job, round(lead_safe_fee_per_opening * unit_count, 2))
- id: install_permits
  subject:
  - install_fee_assessed
  - install_closed
  rule: >-
    A job is permitted when its permit flag is set, which follows the method's default unless the local
    building department's requirement recorded on the job says otherwise. For a permitted job Ridgeline
    files the permit and books the final inspection, and charges the method's permit administration fee
    once per job on the job's opened date; the municipal permit fee itself is included in the contract
    price. A job that is not permitted carries no permit administration fee. The final inspection is booked
    within the method's inspection window counted in business days from the day after completion. A permitted
    job closes only after its final inspection has passed.
  eligibility:
  - id: permitted_job
    applies_to:
    - install_fee_assessed
    kind: state
    condition: A job that is not permitted carries no permit administration fee.
    evidence_fields:
    - install_jobs.install_job_id
    - install_jobs.permit_required
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - install_jobs.install_job_id
      action_bindings:
        install_jobs.install_job_id: install_job_id
    state_contract:
      field: install_jobs.permit_required
      allowed:
      - true
  params:
    per_tier:
      Insert Pocket Installation:
        default: =permit_required_default
        admin_fee: =permit_admin_fee
        inspection_days: =final_inspection_business_days
      Full-Frame Installation:
        default: =permit_required_default
        admin_fee: =permit_admin_fee
        inspection_days: =final_inspection_business_days
      Full-Frame Installation with Exterior Trim Wrap:
        default: =permit_required_default
        admin_fee: =permit_admin_fee
        inspection_days: =final_inspection_business_days
      Masonry Opening Installation:
        default: =permit_required_default
        admin_fee: =permit_admin_fee
        inspection_days: =final_inspection_business_days
      Bay and Bow Installation:
        default: =permit_required_default
        admin_fee: =permit_admin_fee
        inspection_days: =final_inspection_business_days
      Door System Installation:
        default: =permit_required_default
        admin_fee: =permit_admin_fee
        inspection_days: =final_inspection_business_days
- id: install_site_charges
  subject:
  - install_fee_assessed
  rule: >-
    Conditions found or requested at the home are charged on the job, each at the method's rate, on the
    date the work is done. Rot repair beyond the included footage (the method's included feet per opening
    times the openings on the job) is charged per linear foot. Rot repair beyond the included footage
    is done and charged only after the customer approves it on site with the crew lead; support never
    books rot repair itself. New interior casing is charged per opening only where the method does not
    include it; exterior trim capping is charged per opening only where the method offers it and does
    not include it; stucco or mortar patching applies to masonry openings only. Storm window removal,
    taking down window treatments the customer left up, and work on openings above the first floor are
    charged per opening affected. Each charge kind is booked once per date with the openings or feet it
    covers.
  eligibility: []
  params:
    per_tier:
      Insert Pocket Installation:
        rot_included: =rot_included_linear_feet_per_opening
        rot_rate: =rot_repair_per_linear_foot
        trim_included: =interior_trim_included
        trim: =interior_trim_per_opening
        capping_available: =exterior_capping_available
        capping_included: =exterior_capping_included
        capping: =exterior_capping_per_opening
        stucco: =stucco_patch_per_opening
        storm_removal: =storm_window_removal_per_opening
        upper_story: =upper_story_surcharge_per_opening
      Full-Frame Installation:
        rot_included: =rot_included_linear_feet_per_opening
        rot_rate: =rot_repair_per_linear_foot
        trim_included: =interior_trim_included
        trim: =interior_trim_per_opening
        capping_available: =exterior_capping_available
        capping_included: =exterior_capping_included
        capping: =exterior_capping_per_opening
        stucco: =stucco_patch_per_opening
        storm_removal: =storm_window_removal_per_opening
        upper_story: =upper_story_surcharge_per_opening
      Full-Frame Installation with Exterior Trim Wrap:
        rot_included: =rot_included_linear_feet_per_opening
        rot_rate: =rot_repair_per_linear_foot
        trim_included: =interior_trim_included
        trim: =interior_trim_per_opening
        capping_available: =exterior_capping_available
        capping_included: =exterior_capping_included
        capping: =exterior_capping_per_opening
        stucco: =stucco_patch_per_opening
        storm_removal: =storm_window_removal_per_opening
        upper_story: =upper_story_surcharge_per_opening
      Masonry Opening Installation:
        rot_included: =rot_included_linear_feet_per_opening
        rot_rate: =rot_repair_per_linear_foot
        trim_included: =interior_trim_included
        trim: =interior_trim_per_opening
        capping_available: =exterior_capping_available
        capping_included: =exterior_capping_included
        capping: =exterior_capping_per_opening
        stucco: =stucco_patch_per_opening
        storm_removal: =storm_window_removal_per_opening
        upper_story: =upper_story_surcharge_per_opening
      Bay and Bow Installation:
        rot_included: =rot_included_linear_feet_per_opening
        rot_rate: =rot_repair_per_linear_foot
        trim_included: =interior_trim_included
        trim: =interior_trim_per_opening
        capping_available: =exterior_capping_available
        capping_included: =exterior_capping_included
        capping: =exterior_capping_per_opening
        stucco: =stucco_patch_per_opening
        storm_removal: =storm_window_removal_per_opening
        upper_story: =upper_story_surcharge_per_opening
      Door System Installation:
        rot_included: =rot_included_linear_feet_per_opening
        rot_rate: =rot_repair_per_linear_foot
        trim_included: =interior_trim_included
        trim: =interior_trim_per_opening
        capping_available: =exterior_capping_available
        capping_included: =exterior_capping_included
        capping: =exterior_capping_per_opening
        stucco: =stucco_patch_per_opening
        storm_removal: =storm_window_removal_per_opening
        upper_story: =upper_story_surcharge_per_opening
    treatment_removal: =treatment_removal_fee_per_opening
    rot_approval: =rot_repair_requires_customer_approval
  formula:
    rot_repair_charge: >-
      round(rot_repair_per_linear_foot * max(0, units - rot_included_linear_feet_per_opening * unit_count),
      2)
- id: install_completion_and_punch
  subject:
  - install_completed
  - install_punch_logged
  - install_punch_resolved
  - install_closed
  rule: >-
    At the end of the last crew day the crew lead and the customer walk every opening, record any item
    still to finish or correct as a punch item, and the customer signs the completion certificate; the
    job is completed on the date of that signature. Completion starts warranty coverage for the contract,
    closes the factory order, starts the contract's final balance clock and is the document the financing
    lender needs to fund. Punch items are resolved within the method's response window counted in business
    days from the day after completion; a punch item never delays completion. A job is closed only when
    every punch item logged on it has been resolved (install_msr_open_punch_items). A permitted job also
    waits for its final inspection to pass before it closes.
  eligibility:
  - id: punch_cleared
    applies_to:
    - install_closed
    kind: authorization
    condition: >-
      A job is closed only when every punch item logged on it has been resolved (install_msr_open_punch_items).
    evidence_fields:
    - install_jobs.install_job_id
    - install_activities.source_install_activity_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - install_jobs.install_job_id
      action_bindings:
        install_jobs.install_job_id: install_job_id
  params:
    per_tier:
      Insert Pocket Installation:
        punch_days: =punch_list_response_business_days
      Full-Frame Installation:
        punch_days: =punch_list_response_business_days
      Full-Frame Installation with Exterior Trim Wrap:
        punch_days: =punch_list_response_business_days
      Masonry Opening Installation:
        punch_days: =punch_list_response_business_days
      Bay and Bow Installation:
        punch_days: =punch_list_response_business_days
      Door System Installation:
        punch_days: =punch_list_response_business_days
    walkthrough: =completion_walkthrough_required
    certificate: =completion_certificate_required
  measures:
  - install_msr_open_punch_items
- id: install_credits_and_waivers
  subject:
  - install_credit_issued
  rule: >-
    Job charges are collected with the contract's final balance, so the amount owed on the job (install_msr_net_charges)
    is added to the contract balance due. A fee waiver reverses one specific fee in full and names it
    as its source; a fee is waived when the job records show it was not owed under these terms, for example
    a late reschedule fee on a reschedule recorded with enough notice, a fee charged twice for the same
    openings on the same date, or a lead-safe fee on a home built in or after the stated year. A fee is
    waived at most once. A late-arrival credit names the crew day it is for and a company reschedule credit
    names the reschedule it is for, each granted once. A credit never exceeds the job charges owed; any
    excess is applied to the contract balance due.
  eligibility:
  - id: waive_once
    applies_to:
    - install_credit_issued
    kind: dedup
    condition: A fee is waived at most once.
    evidence_fields:
    - install_activities.source_install_activity_id
    - install_activities.credit_kind
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - install_activities.source_install_activity_id
      action_bindings:
        install_activities.source_install_activity_id: source_install_activity_id
    dedup_contract:
      table: install_activities
      mode: separate_record
      object_bindings:
        source_install_activity_id: source_install_activity_id
      duplicate_filters:
        event_type:
        - install_credit_issued
      distinct_fields:
      - activity_date
  params:
    waiver_limit: =fee_waiver_limit_per_fee
    collection: =job_charges_collection
  measures:
  - install_msr_net_charges
- id: install_cancellation
  subject:
  - install_cancelled
  rule: >-
    An installation job is cancelled only after its contract has been cancelled. A job that is opened
    or scheduled is cancelled and any booked crew date is released without a reschedule fee. A job whose
    work has started cannot be cancelled; once the crew is on site the job runs to completion. Job charges
    already assessed before cancellation stay owed and are settled with the contract's cancellation.
  eligibility:
  - id: contract_cancelled_first
    applies_to:
    - install_cancelled
    kind: authorization
    condition: An installation job is cancelled only after its contract has been cancelled.
    evidence_fields:
    - install_jobs.install_job_id
    - window_contracts.status
    - door_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - install_jobs.install_job_id
      action_bindings:
        install_jobs.install_job_id: install_job_id
extended_policies:
- id: install_ext_customer_reschedule_fee
  base_policy_refs: [install_reschedules, install_agg_concurrent_jobs, install_lead_safe, install_permits, install_site_charges]
  overwrite:
  - base_policy: install_reschedules
    superseded_clause: >-
      a customer reschedule that is late or beyond the free count (install_msr_customer_reschedules) carries
      the method's late reschedule fee.
    replaced_by: >-
      A customer reschedule that is late or beyond the free count still carries a late reschedule fee, but
      its amount is the figure worked out below rather than the method's flat late reschedule fee; a
      failed-access visit keeps the failed-access fee, and an on-time customer reschedule within the free
      count carries no fee.
  trigger: state_due
  subject: [install_fee_assessed]
  computes: amount
  target_tool: assess_reschedule_fee_4c3399da
  params:
    size_large_openings: 20
    size_mid_openings: 10
    size_adder_large: 50.0
    size_adder_mid: 25.0
    day_ahead_hours: 24
    on_time_extra_share: 0.4
    company_moves_many: 2
    moved_many_share: 0.0
    moved_once_share: 0.5
    repeat_many_factor: 1.5
    repeat_once_factor: 1.25
    release_factor: 1.2
    far_move_factor: 1.1
    far_move_days: 21
  rule: >-
    This rule prices the late reschedule fee for the most recent customer reschedule recorded on an
    installation job, the reschedule being charged. A customer reschedule that is late or beyond the free
    count still carries a late reschedule fee, but its amount is the figure worked out below rather than
    the method's flat late reschedule fee; a failed-access visit keeps the failed-access fee, and an
    on-time customer reschedule within the free count carries no fee. The standard late reschedule fee is
    the method's late reschedule fee, charged in full and dated the day the reschedule was requested. The
    late reschedule fee base is the method's late reschedule fee plus a job-size adder set by the openings
    on the contract the job installs (the window contract's openings for a window job, the door
    contract's units for a door job): more than 20 openings adds $50.00, 11 to 20 openings adds $25.00,
    and 10 or fewer openings adds nothing. How much notice the reschedule gave decides how the late
    reschedule fee base is turned into the notice-adjusted late reschedule fee: a reschedule requested with
    at least 24 hours of notice but fewer than the method's notice hours is pro-rated by the hours it fell
    short, that is the late reschedule fee base times the method's notice hours less the hours of notice
    given, divided by the method's notice hours, rounded to the cent; a reschedule requested with at least
    the method's notice hours, when the job's customer reschedules (failed-access visits included) exceed
    the method's free count, is charged 40 percent of the late reschedule fee base, rounded to the cent; a
    reschedule requested with fewer than 24 hours of notice is charged the whole late reschedule fee base.
    Ridgeline's own moves of the job lower the late reschedule fee: when Ridgeline has moved a crew date of
    the job two or more times the share charged is zero, so nothing is owed; when it has moved one once the
    share charged is one half; when it has never moved one the share charged is one. Earlier late
    reschedule fees raise it: when the job already carries two or more late reschedule fees the repeat
    factor is 1.5; when it carries exactly one the repeat factor is 1.25; when it carries none the repeat
    factor is one. What the reschedule did with the crew date also counts: a reschedule that released the
    crew date with no new date takes a release factor of 1.2; a reschedule that moved the crew date to a
    new date more than 21 days after the date it moved takes a release factor of 1.1; a reschedule that
    moved the crew date by 21 days or fewer takes a release factor of one. The late reschedule fee charged
    is the notice-adjusted late reschedule fee multiplied by the share charged, by the repeat factor and by
    the release factor, all three acting on that one figure, and that product is rounded to the nearest cent. The fee is dated the day the reschedule being charged was requested.
  prerequisite: []
  cross_category:
  - category: window
    as: branch
    reads: [opening_count]
    note: The job-size adder of the late reschedule fee base reads the openings on the window contract a window job installs.
  - category: door
    as: branch
    reads: [unit_count]
    note: The same adder reads the units on the door contract a door job installs.
  compute:
  - contract_openings: "CFIELD('window','opening_count', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','unit_count', door_contract_id=F('door_contract_id'))"
  - size_adder: "K('size_adder_large') if contract_openings > K('size_large_openings') else (K('size_adder_mid') if contract_openings > K('size_mid_openings') else 0)"
  - fee_base: "P('late_reschedule_fee') + size_adder"
  - cust_notice: "LATEST('install_activities','notice_hours', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='customer')"
  - cust_count: "COUNT('install_activities', event_type='install_reschedule_logged', initiated_by='customer')"
  - notice_fee: "RND(fee_base * (P('reschedule_notice_hours') - cust_notice) / P('reschedule_notice_hours'), 2) if cust_notice >= K('day_ahead_hours') and cust_notice < P('reschedule_notice_hours') else (RND(fee_base * K('on_time_extra_share'), 2) if cust_notice >= P('reschedule_notice_hours') and cust_count > P('free_customer_reschedules') else fee_base)"
  - company_moves: "COUNT('install_activities', event_type='install_reschedule_logged', initiated_by='company')"
  - move_share: "K('moved_many_share') if company_moves >= K('company_moves_many') else (K('moved_once_share') if company_moves == 1 else 1)"
  - late_fees_on_job: "COUNT('install_activities', event_type='install_fee_assessed', fee_kind='late_reschedule_fee')"
  - repeat_factor: "K('repeat_many_factor') if late_fees_on_job >= 2 else (K('repeat_once_factor') if late_fees_on_job == 1 else 1)"
  - cust_new_date: "LATEST('install_activities','new_date', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='customer')"
  - cust_prev_date: "LATEST('install_activities','previous_date', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='customer')"
  - release_factor: "K('release_factor') if not cust_new_date else (K('far_move_factor') if DAYS(cust_prev_date, cust_new_date) > K('far_move_days') else 1)"
  - result: "RND(notice_fee * move_share * repeat_factor * release_factor, 2)"
  compute_basis:
    contract_openings: "set by the openings on the contract the job installs (the window contract's openings for a window job, the door contract's units for a door job)"
    size_adder: "more than 20 openings adds $50.00, 11 to 20 openings adds $25.00, and 10 or fewer openings adds nothing"
    fee_base: "The late reschedule fee base is the method's late reschedule fee plus a job-size adder"
    cust_notice: "This rule prices the late reschedule fee for the most recent customer reschedule recorded on an installation job, the reschedule being charged."
    cust_count: "when the job's customer reschedules (failed-access visits included) exceed the method's free count"
    notice_fee: "a reschedule requested with at least 24 hours of notice but fewer than the method's notice hours is pro-rated by the hours it fell short, that is the late reschedule fee base times the method's notice hours less the hours of notice given, divided by the method's notice hours, rounded to the cent; a reschedule requested with at least the method's notice hours, when the job's customer reschedules (failed-access visits included) exceed the method's free count, is charged 40 percent of the late reschedule fee base, rounded to the cent; a reschedule requested with fewer than 24 hours of notice is charged the whole late reschedule fee base."
    company_moves: "when Ridgeline has moved a crew date of the job two or more times"
    move_share: "when Ridgeline has moved a crew date of the job two or more times the share charged is zero, so nothing is owed; when it has moved one once the share charged is one half; when it has never moved one the share charged is one."
    late_fees_on_job: "when the job already carries two or more late reschedule fees"
    repeat_factor: "when the job already carries two or more late reschedule fees the repeat factor is 1.5; when it carries exactly one the repeat factor is 1.25; when it carries none the repeat factor is one."
    cust_new_date: "a reschedule that released the crew date with no new date takes a release factor of 1.2"
    cust_prev_date: "a reschedule that moved the crew date to a new date more than 21 days after the date it moved takes a release factor of 1.1"
    release_factor: "a reschedule that released the crew date with no new date takes a release factor of 1.2; a reschedule that moved the crew date to a new date more than 21 days after the date it moved takes a release factor of 1.1; a reschedule that moved the crew date by 21 days or fewer takes a release factor of one."
    result: "The late reschedule fee charged is the notice-adjusted late reschedule fee multiplied by the share charged, by the repeat factor and by the release factor, all three acting on that one figure, and that product is rounded to the nearest cent."
  factors:
  - id: contract_size_adder
    effect: parameter
    decides: size_adder
    bindings: [contract_openings, size_adder]
    ladder:
    - when: "the contract the job installs has more than 20 openings"
      value: "K('size_adder_large')"
    - when: "the contract the job installs has 11 to 20 openings"
      value: "K('size_adder_mid')"
    - when: "otherwise (10 or fewer openings)"
      value: "0"
    baseline:
      size_adder: "0"
    evidence: [cross_category]
    cross_difficulty: window
  - id: notice_proration
    effect: method
    decides: notice_fee
    bindings: [cust_notice, cust_count, notice_fee]
    ladder:
    - when: "the reschedule gave at least 24 hours of notice and fewer than the method's notice hours"
      method: "the late reschedule fee base pro-rated by the hours short: base times (notice hours less hours given) divided by notice hours, rounded to the cent"
    - when: "the reschedule gave at least the method's notice hours and the job's customer reschedules exceed the free count"
      method: "40 percent of the late reschedule fee base, rounded to the cent"
    - when: "otherwise (fewer than 24 hours of notice)"
      method: "the whole late reschedule fee base"
    baseline:
      notice_fee: "fee_base"
    evidence: [history]
    cross_difficulty: null
  - id: ridgeline_move_share
    effect: parameter
    decides: move_share
    bindings: [company_moves, move_share]
    ladder:
    - when: "Ridgeline has moved a crew date of the job two or more times"
      value: "K('moved_many_share')"
    - when: "Ridgeline has moved a crew date of the job exactly once"
      value: "K('moved_once_share')"
    - when: "otherwise (Ridgeline never moved one)"
      value: "1"
    baseline:
      move_share: "1"
    evidence: [history]
    cross_difficulty: null
  - id: repeat_late_factor
    effect: parameter
    decides: repeat_factor
    bindings: [late_fees_on_job, repeat_factor]
    ladder:
    - when: "the job already carries two or more late reschedule fees"
      value: "K('repeat_many_factor')"
    - when: "the job already carries exactly one late reschedule fee"
      value: "K('repeat_once_factor')"
    - when: "otherwise (none)"
      value: "1"
    baseline:
      repeat_factor: "1"
    evidence: [history]
    cross_difficulty: null
  - id: crew_date_release_factor
    effect: parameter
    decides: release_factor
    bindings: [cust_new_date, cust_prev_date, release_factor]
    ladder:
    - when: "the reschedule released the crew date with no new date"
      value: "K('release_factor')"
    - when: "the reschedule moved the crew date to a new date more than 21 days after the date it moved"
      value: "K('far_move_factor')"
    - when: "otherwise (moved by 21 days or fewer)"
      value: "1"
    baseline:
      release_factor: "1"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard late reschedule fee is the method's late reschedule fee, charged in full and dated the
      day the reschedule was requested.
    params: [late_reschedule_fee]
  inputs:
    history:
    - {table: install_activities, aggregate: latest, field: notice_hours, filters: {event_type: install_reschedule_logged, initiated_by: customer}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_reschedule_logged, initiated_by: customer}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_reschedule_logged, initiated_by: company}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_fee_assessed, fee_kind: late_reschedule_fee}}
    - {table: install_activities, aggregate: latest, field: new_date, filters: {event_type: install_reschedule_logged, initiated_by: customer}}
    cross_category: [window, door]
- id: install_ext_permit_filing_fee
  base_policy_refs: [install_permits, install_agg_concurrent_jobs, install_reschedules, install_lead_safe, install_site_charges]
  overwrite:
  - base_policy: install_permits
    superseded_clause: >-
      charges the method's permit administration fee once per job on the job's opened date
    replaced_by: >-
      A permitted job is still charged its permit administration fee once per job on the job's opened
      date, but the amount is the figure worked out below rather than the method's flat permit
      administration fee.
  trigger: state_due
  subject: [install_fee_assessed]
  computes: amount
  target_tool: assess_permit_admin_fee_bf2a1df3
  params:
    flat_openings: 12
    large_openings: 20
    extra_opening_rate: 4.0
    large_opening_rate: 6.5
    valuation_high: 25000
    valuation_mid: 15000
    valuation_adder_high: 60.0
    valuation_adder_mid: 30.0
    glazing_many: 4
    glazing_adder_many: 35.0
    glazing_adder_few: 20.0
    combined_window_days: 30
    combined_share: 0.6
    amendment_share: 0.8
  rule: >-
    This rule prices the permit administration fee of a permitted installation job; a job that is not
    permitted carries no permit administration fee. A permitted job is still charged its permit
    administration fee once per job on the job's opened date, but the amount is the figure worked out below
    rather than the method's flat permit administration fee. The standard permit administration fee is the
    method's permit administration fee, charged once per permitted job and dated the job's opened date. The
    permit filing carries an energy-code window schedule that lists every opening on the contract the job
    installs (the window contract's openings for a window job, the door contract's units for a door job),
    and the length of that schedule decides how the filing base is priced: a schedule of more than 20
    openings is priced at $6.50 per opening listed; a schedule of 13 to 20 openings is priced at the
    method's permit administration fee plus $4.00 for each opening beyond the twelfth; a schedule of 12 or
    fewer openings is priced at the method's permit administration fee. The valuation adder follows the
    price of the contract the job installs: above $25,000.00 it is $60.00; above $15,000.00 up to
    $25,000.00 it is $30.00; at $15,000.00 or less it is nothing. The safety-glazing adder follows the
    openings the window contract orders with tempered or laminated glass by change order, which the
    building department checks against the safety-glazing schedule: 4 or more such openings add $35.00; 1
    to 3 such openings add $20.00; none adds nothing. The filing share depends on whether the customer's
    other contract shares the filing: when the customer also holds a contract of the other product (a door
    contract for a window job, a window contract for a door job) that has been released to the factory and
    not yet installed, and it was signed within 30 days of the contract this job installs, both jobs go on
    one combined filing and this job pays a filing share of 0.6; when such a contract was signed more than
    30 days apart from the contract this job installs, it is added as a permit amendment and this job pays
    a filing share of 0.8; when the customer holds no such contract the filing share is one. The permit
    administration fee charged is the filing base plus the valuation adder plus the safety-glazing adder,
    that sum multiplied once by the filing share, and rounded to the nearest cent.
  prerequisite: []
  cross_category:
  - category: window
    as: branch
    reads: [opening_count, contract_price, signed_date, status, window_transactions.openings_affected]
    note: The window schedule, valuation band and safety-glazing schedule read the window contract a window job installs and its change orders; a door job reads the window contract as its filing partner.
  - category: door
    as: branch
    reads: [unit_count, contract_price, signed_date, status]
    note: The filing share reads the customer's door contract as the filing partner of a window job.
  compute:
  - schedule_openings: "CFIELD('window','opening_count', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','unit_count', door_contract_id=F('door_contract_id'))"
  - filing_base: "K('large_opening_rate') * schedule_openings if schedule_openings > K('large_openings') else (P('permit_admin_fee') + K('extra_opening_rate') * (schedule_openings - K('flat_openings')) if schedule_openings > K('flat_openings') else P('permit_admin_fee'))"
  - contract_value: "CFIELD('window','contract_price', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','contract_price', door_contract_id=F('door_contract_id'))"
  - valuation_adder: "K('valuation_adder_high') if contract_value > K('valuation_high') else (K('valuation_adder_mid') if contract_value > K('valuation_mid') else 0)"
  - safety_glazed: "XSUM('window','window_transactions','openings_affected', event_type='window_change_order', change_kind='tempered_glass', window_contract_id=F('window_contract_id')) + XSUM('window','window_transactions','openings_affected', event_type='window_change_order', change_kind='laminated_glass', window_contract_id=F('window_contract_id'))"
  - glazing_adder: "K('glazing_adder_many') if safety_glazed >= K('glazing_many') else (K('glazing_adder_few') if safety_glazed >= 1 else 0)"
  - own_signed: "(F('window_contract_id') and CFIELD('window','signed_date', window_contract_id=F('window_contract_id'))) or (F('door_contract_id') and CFIELD('door','signed_date', door_contract_id=F('door_contract_id')))"
  - partner_signed: "(F('window_contract_id') and CFIELD('door','signed_date', status='ordered')) or (F('door_contract_id') and CFIELD('window','signed_date', status='ordered'))"
  - filing_share: "K('combined_share') if partner_signed and ABS(DAYS(own_signed, partner_signed)) <= K('combined_window_days') else (K('amendment_share') if partner_signed and ABS(DAYS(own_signed, partner_signed)) > K('combined_window_days') else 1)"
  - result: "RND((filing_base + valuation_adder + glazing_adder) * filing_share, 2)"
  compute_basis:
    schedule_openings: "lists every opening on the contract the job installs (the window contract's openings for a window job, the door contract's units for a door job)"
    filing_base: "a schedule of more than 20 openings is priced at $6.50 per opening listed; a schedule of 13 to 20 openings is priced at the method's permit administration fee plus $4.00 for each opening beyond the twelfth; a schedule of 12 or fewer openings is priced at the method's permit administration fee."
    contract_value: "The valuation adder follows the price of the contract the job installs"
    valuation_adder: "above $25,000.00 it is $60.00; above $15,000.00 up to $25,000.00 it is $30.00; at $15,000.00 or less it is nothing."
    safety_glazed: "The safety-glazing adder follows the openings the window contract orders with tempered or laminated glass by change order"
    glazing_adder: "4 or more such openings add $35.00; 1 to 3 such openings add $20.00; none adds nothing."
    own_signed: "signed within 30 days of the contract this job installs"
    partner_signed: "when the customer also holds a contract of the other product (a door contract for a window job, a window contract for a door job) that has been released to the factory and not yet installed"
    filing_share: "when the customer also holds a contract of the other product (a door contract for a window job, a window contract for a door job) that has been released to the factory and not yet installed, and it was signed within 30 days of the contract this job installs, both jobs go on one combined filing and this job pays a filing share of 0.6; when such a contract was signed more than 30 days apart from the contract this job installs, it is added as a permit amendment and this job pays a filing share of 0.8; when the customer holds no such contract the filing share is one."
    result: "The permit administration fee charged is the filing base plus the valuation adder plus the safety-glazing adder, that sum multiplied once by the filing share, and rounded to the nearest cent."
  factors:
  - id: window_schedule_basis
    effect: method
    decides: filing_base
    bindings: [schedule_openings, filing_base]
    ladder:
    - when: "the energy-code window schedule lists more than 20 openings"
      method: "priced per opening listed at $6.50 each"
    - when: "the schedule lists 13 to 20 openings"
      method: "the method's permit administration fee plus $4.00 for each opening beyond the twelfth"
    - when: "otherwise (12 or fewer openings)"
      method: "the method's permit administration fee as a flat amount"
    baseline:
      filing_base: "P('permit_admin_fee')"
    evidence: [cross_category]
    cross_difficulty: window
  - id: contract_valuation_band
    effect: parameter
    decides: valuation_adder
    bindings: [contract_value, valuation_adder]
    ladder:
    - when: "the contract the job installs is priced above $25,000.00"
      value: "K('valuation_adder_high')"
    - when: "it is priced above $15,000.00 up to $25,000.00"
      value: "K('valuation_adder_mid')"
    - when: "otherwise ($15,000.00 or less)"
      value: "0"
    baseline:
      valuation_adder: "0"
    evidence: [cross_category]
    cross_difficulty: window
  - id: safety_glazing_count
    effect: parameter
    decides: glazing_adder
    bindings: [safety_glazed, glazing_adder]
    ladder:
    - when: "the window contract orders 4 or more openings with tempered or laminated glass by change order"
      value: "K('glazing_adder_many')"
    - when: "it orders 1 to 3 such openings"
      value: "K('glazing_adder_few')"
    - when: "otherwise (none)"
      value: "0"
    baseline:
      glazing_adder: "0"
    evidence: [cross_category, history]
    cross_difficulty: window
  - id: shared_filing_share
    effect: parameter
    decides: filing_share
    bindings: [own_signed, partner_signed, filing_share]
    ladder:
    - when: "the customer holds a contract of the other product released to the factory and not yet installed AND it was signed within 30 days of this job's contract"
      value: "K('combined_share')"
    - when: "the customer holds such a contract AND it was signed more than 30 days apart"
      value: "K('amendment_share')"
    - when: "otherwise (no such contract)"
      value: "1"
    baseline:
      filing_share: "1"
    evidence: [cross_category, date]
    cross_difficulty: door
  baseline:
    rule: >-
      The standard permit administration fee is the method's permit administration fee, charged once per
      permitted job and dated the job's opened date.
    params: [permit_admin_fee]
  inputs:
    history:
    - {category: window, table: window_transactions, aggregate: sum, field: openings_affected, filters: {event_type: window_change_order, change_kind: tempered_glass}}
    - {category: window, table: window_transactions, aggregate: sum, field: openings_affected, filters: {event_type: window_change_order, change_kind: laminated_glass}}
    cross_category: [window, door]
- id: install_ext_crew_date_booking
  base_policy_refs: [install_scheduling, install_agg_concurrent_jobs]
  overwrite:
  - base_policy: install_scheduling
    superseded_clause: >-
      Crew days planned are the job's units divided by the method's units per crew day, rounded up to a
      whole day.
    replaced_by: >-
      Crew days planned for a crew date booked under this rule are worked out as below rather than as the
      job's units divided by the method's units per crew day; they are still rounded up to whole days.
  trigger: on_request
  subject: [install_scheduled]
  computes: crew_days_planned
  target_tool: book_crew_date_2f98f590
  params:
    class_cut_heavy: 2
    class_cut_light: 1
    series_cut_heavy: 2
    series_cut_light: 1
    min_per_day: 1
    oversize_split_min: 4
    oversize_per_day: 2
    oversize_weight: 1.5
    inspection_units: 15
    inspection_hold_large: 2
    inspection_hold_small: 1
  rule: >-
    This rule fixes the crew days booked when a crew date is booked for an installation job that is
    waiting to be scheduled. Crew days planned for a crew date booked under this rule are worked out as
    below rather than as the job's units divided by the method's units per crew day; they are still
    rounded up to whole days. The standard crew-day plan is the units the crew plans for, which are the job's units, divided by the crew's daily pace, which is the method's openings per crew day, rounded up to a whole day. The crew's daily pace starts from the method's
    openings per crew day and is lowered by the build class of the factory order the job installs: a
    Specialty Shape Build or Architectural Wood Build lowers it by 2 openings a day; a Custom Color Build,
    Specialty Glass Build or Impact-Rated Build lowers it by 1 opening a day; a Custom Size Build leaves
    it unchanged. The daily pace is lowered again by the frame of the window series the job installs: the
    Ridgeline 6600 Series Wood-Clad lowers it by 2 openings a day; the Ridgeline 5500 Series Fiberglass or
    the Ridgeline 4400 Series Composite lowers it by 1 opening a day; a vinyl series, or a door job, leaves
    it unchanged. The daily pace never falls below 1 opening a day. For the mid-job flashing inspection of a permitted job the crew holds back capacity, counted in openings that join the units the crew plans for: when the job's charges carry the
    permit administration fee and the job installs more than 15 units the inspection hold-back is 2
    openings; when they carry it and the job installs 15 units or fewer the inspection hold-back is 1
    opening; when they do not carry it there is no inspection hold-back. The oversize openings recorded at
    the latest completed measure of the window contract the job installs decide how the crew days are
    counted: with 4 or more oversize openings, the units the crew plans for other than the oversize openings are divided by the daily pace and rounded up to whole days, the oversize openings are set on days of their own at 2 a day, rounded up to whole days, and the two day counts are added; with 1 to 3 oversize openings, each oversize opening counts as one and a half units, and the units the crew plans for, so weighted, are divided by the daily pace and rounded up to a whole day; with no oversize opening, the units the crew plans for are divided by the daily pace and rounded up to a whole day. For a permitted
    job, the crew days booked are fixed only after the job's charges carry the permit administration fee.
    A crew date for a job whose earlier crew date the customer moved or released is not booked until the
    job's charges carry the late reschedule fee owed for every such customer reschedule that was late or
    beyond the free count.
  prerequisite:
  - problem: install_ext_permit_filing_fee
    kind: value_input
    gate: inspection_hold
    form: state
    policy_source: >-
      For a permitted job, the crew days booked are fixed only after the job's charges carry the permit
      administration fee.
    condition: >-
      For a job whose permit flag is set, install_activities holds an install_fee_assessed row of the job
      with fee_kind permit_admin_fee.
    resolved_by: assess_permit_admin_fee_bf2a1df3
    effect: >-
      The inspection hold-back moves from none to 1 opening (15 units or fewer) or 2 openings (more than 15
      units), which raises the crew days booked wherever the extra openings cross a whole day.
  - problem: install_ext_customer_reschedule_fee
    kind: state_gate
    gate: install_activities.fee_kind
    form: state
    policy_source: >-
      A crew date for a job whose earlier crew date the customer moved or released is not booked until the
      job's charges carry the late reschedule fee owed for every such customer reschedule that was late or
      beyond the free count.
    condition: >-
      Every install_reschedule_logged row of the job with initiated_by customer that was late or beyond
      the free count (other than a failed-access visit) has an install_fee_assessed row of the job with
      fee_kind late_reschedule_fee dated that reschedule's activity_date.
    resolved_by: assess_reschedule_fee_4c3399da
    effect: >-
      The booking gate holds: the late reschedule fee owed on the latest customer reschedule stands on the
      job, so a new crew date may be booked.
  cross_category:
  - category: order
    as: branch
    reads: [variant_name]
    note: The build-class pace cut reads the build class of the factory order the job installs.
  - category: window
    as: branch
    reads: [variant_name, window_transactions.oversize_opening_count]
    note: The series pace cut reads the window series, and the oversize counting method reads the latest completed measure visit of the window contract.
  compute:
  - build_class: "CFIELD('order','variant_name', factory_order_id=F('factory_order_id'))"
  - class_cut: "K('class_cut_heavy') if build_class == 'Specialty Shape Build' or build_class == 'Architectural Wood Build' else (K('class_cut_light') if build_class == 'Custom Color Build' or build_class == 'Specialty Glass Build' or build_class == 'Impact-Rated Build' else 0)"
  - window_series: "CFIELD('window','variant_name', window_contract_id=F('window_contract_id'))"
  - series_cut: "K('series_cut_heavy') if window_series == 'Ridgeline 6600 Series Wood-Clad' else (K('series_cut_light') if window_series == 'Ridgeline 5500 Series Fiberglass' or window_series == 'Ridgeline 4400 Series Composite' else 0)"
  - daily_pace: "MX(K('min_per_day'), P('openings_per_crew_day') - class_cut - series_cut)"
  - permit_filings: "COUNT('install_activities', event_type='install_fee_assessed', fee_kind='permit_admin_fee')"
  - inspection_hold: "K('inspection_hold_large') if permit_filings > 0 and F('unit_count') > K('inspection_units') else (K('inspection_hold_small') if permit_filings > 0 and F('unit_count') <= K('inspection_units') else 0)"
  - plan_units: "F('unit_count') + inspection_hold"
  - oversize_openings: "XLATEST('window','window_transactions','oversize_opening_count', date_field='txn_date', event_type='window_measure_visit', visit_outcome='completed', window_contract_id=F('window_contract_id')) or 0"
  - plan_days: "(-((-(plan_units - oversize_openings)) // daily_pace) - ((-oversize_openings) // K('oversize_per_day'))) if oversize_openings >= K('oversize_split_min') else (-((-(plan_units + oversize_openings * (K('oversize_weight') - 1))) // daily_pace) if oversize_openings >= 1 else -((-plan_units) // daily_pace))"
  - result: "int(plan_days)"
  compute_basis:
    build_class: "is lowered by the build class of the factory order the job installs"
    class_cut: "a Specialty Shape Build or Architectural Wood Build lowers it by 2 openings a day; a Custom Color Build, Specialty Glass Build or Impact-Rated Build lowers it by 1 opening a day; a Custom Size Build leaves it unchanged."
    window_series: "The daily pace is lowered again by the frame of the window series the job installs"
    series_cut: "the Ridgeline 6600 Series Wood-Clad lowers it by 2 openings a day; the Ridgeline 5500 Series Fiberglass or the Ridgeline 4400 Series Composite lowers it by 1 opening a day; a vinyl series, or a door job, leaves it unchanged."
    daily_pace: "The crew's daily pace starts from the method's openings per crew day"
    permit_filings: "when the job's charges carry the permit administration fee"
    inspection_hold: "when the job's charges carry the permit administration fee and the job installs more than 15 units the inspection hold-back is 2 openings; when they carry it and the job installs 15 units or fewer the inspection hold-back is 1 opening; when they do not carry it there is no inspection hold-back."
    plan_units: "counted in openings that join the units the crew plans for"
    oversize_openings: "The oversize openings recorded at the latest completed measure of the window contract the job installs decide how the crew days are counted"
    plan_days: "with 4 or more oversize openings, the units the crew plans for other than the oversize openings are divided by the daily pace and rounded up to whole days, the oversize openings are set on days of their own at 2 a day, rounded up to whole days, and the two day counts are added; with 1 to 3 oversize openings, each oversize opening counts as one and a half units, and the units the crew plans for, so weighted, are divided by the daily pace and rounded up to a whole day; with no oversize opening, the units the crew plans for are divided by the daily pace and rounded up to a whole day."
    result: "they are still rounded up to whole days."
  factors:
  - id: build_class_pace
    effect: parameter
    decides: class_cut
    bindings: [build_class, class_cut]
    ladder:
    - when: "the factory order is a Specialty Shape Build or an Architectural Wood Build"
      value: "K('class_cut_heavy')"
    - when: "the factory order is a Custom Color Build, Specialty Glass Build or Impact-Rated Build"
      value: "K('class_cut_light')"
    - when: "otherwise (a Custom Size Build)"
      value: "0"
    baseline:
      class_cut: "0"
    evidence: [cross_category]
    cross_difficulty: order
  - id: series_frame_pace
    effect: parameter
    decides: series_cut
    bindings: [window_series, series_cut]
    ladder:
    - when: "the window series is the Ridgeline 6600 Series Wood-Clad"
      value: "K('series_cut_heavy')"
    - when: "the window series is the Ridgeline 5500 Series Fiberglass or the Ridgeline 4400 Series Composite"
      value: "K('series_cut_light')"
    - when: "otherwise (a vinyl series, or a door job)"
      value: "0"
    baseline:
      series_cut: "0"
    evidence: [cross_category]
    cross_difficulty: window
  - id: inspection_hold_back
    effect: parameter
    decides: inspection_hold
    bindings: [permit_filings, inspection_hold]
    ladder:
    - when: "the job's charges carry the permit administration fee AND the job installs more than 15 units"
      value: "K('inspection_hold_large')"
    - when: "the job's charges carry the permit administration fee AND the job installs 15 units or fewer"
      value: "K('inspection_hold_small')"
    - when: "otherwise (no permit administration fee on the job)"
      value: "0"
    baseline:
      inspection_hold: "0"
    evidence: [history]
    cross_difficulty: null
  - id: oversize_day_count
    effect: method
    decides: plan_days
    bindings: [oversize_openings, plan_days]
    ladder:
    - when: "the latest completed measure recorded 4 or more oversize openings"
      method: "the units the crew plans for other than the oversize openings over the daily pace rounded up, plus the oversize openings on their own days at 2 a day rounded up"
    - when: "it recorded 1 to 3 oversize openings"
      method: "each oversize opening weighted as one and a half units; the units the crew plans for, so weighted, over the daily pace, rounded up"
    - when: "otherwise (no oversize opening)"
      method: "the units the crew plans for over the daily pace, rounded up"
    baseline:
      plan_days: "-((-plan_units) // daily_pace)"
    evidence: [cross_category, history]
    cross_difficulty: window
  baseline:
    rule: >-
      The standard crew-day plan is the units the crew plans for, which are the job's units, divided by the crew's daily pace, which is the method's openings per crew day, rounded up to a whole day.
    params: [openings_per_crew_day]
  inputs:
    history:
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_fee_assessed, fee_kind: permit_admin_fee}}
    - {category: window, table: window_transactions, aggregate: latest, field: oversize_opening_count, filters: {event_type: window_measure_visit, visit_outcome: completed}}
    cross_category: [order, window]
- id: install_ext_trim_capping_charge
  base_policy_refs: [install_site_charges, install_agg_concurrent_jobs, install_reschedules, install_lead_safe, install_permits]
  overwrite:
  - base_policy: install_site_charges
    superseded_clause: >-
      exterior trim capping is charged per opening only where the method offers it and does not include it
    replaced_by: >-
      Exterior trim capping is still charged only where the method offers it and does not include it,
      and it is still charged on the job on the date the work is done; for exterior trim capping that
      the customer approves, and only for such capping, the charge is the amount worked out below, built
      from the method's exterior capping charge per opening, rather than that charge times the openings;
      new interior casing is not priced by this rule, and every other charge kind keeps its base basis.
  trigger: on_request
  subject: [install_fee_assessed]
  computes: amount
  target_tool: approve_trim_capping_649df03e
  params:
    oversize_split: 4
    oversize_weight_many: 2.0
    oversize_weight_few: 1.5
    volume_full_openings: 10
    volume_large_min: 12
    volume_tail_share: 0.75
    volume_mid_min: 6
    volume_mid_share: 0.9
    color_premium_adder: 22.0
    color_standard_adder: 14.0
    rush_days: 7
    rush_color_adder: 120.0
    rush_stock_adder: 45.0
  rule: >-
    This rule prices exterior aluminum trim capping that the customer approves for an installation job
    whose method offers capping and does not include it; capping is approved for every opening on the
    contract the job installs, so the exterior trim of the whole job matches. Exterior trim capping is
    still charged only where the method offers it and does not include it, and it is still charged on
    the job on the date the work is done; for exterior trim capping that the customer approves, and only
    for such capping, the charge is the amount worked out below, built from the method's exterior
    capping charge per opening, rather than that charge times the openings; new interior casing is not
    priced by this rule, and every other charge kind keeps its base basis. The standard trim capping charge is the method's exterior capping charge per opening times the priced openings, which are the openings on the contract the job installs, dated the job's booked crew date, the day the capping is done. The trim
    capping charge is fixed only once the job record carries a booked crew date. Oversize openings take more coil and add to the priced openings: when the latest completed measure of the window contract recorded 4 or more openings above the series' standard size, each of those openings counts as two priced openings; when it recorded 1 to 3, each of them counts as one and a half priced openings; when it recorded none, every opening counts as one priced opening. How the capping price is built depends on the priced openings: with 12
    or more priced openings, the first 10 are priced at the method's exterior capping charge per opening and
    every priced opening beyond 10 at 75 percent of it; with 6 or more but fewer than 12 priced openings,
    every priced opening is priced at 90 percent of the method's exterior capping charge per opening; with
    fewer than 6 priced openings, every priced opening is priced at the method's exterior capping charge per
    opening. Color-matched coil is added for every priced opening: when the window contract carries an
    exterior color change order and its series is the Ridgeline 5500 Series Fiberglass or the Ridgeline
    6600 Series Wood-Clad, the color-matched coil adder is $22.00 per priced opening; when it carries an
    exterior color change order and is any other series, it is $14.00 per priced opening; when it carries no
    exterior color change order, there is no color-matched coil adder. The discount program on the contract
    the job installs carries over to the capping at the rate that contract's series sets for that program:
    a military program at the series military rate, a first-responder program at the series
    first-responder rate, a senior program at the series senior rate, and no program at nothing. A
    customer holding an active CareLine plan gets that plan's parts discount on the capping: an active
    CareLine Estate Plan, an active CareLine Premier Plan or CareLine Premier 3-Year Plan, an active
    CareLine Plus Plan and an active CareLine Basic Plan each give their own plan's parts discount, and a
    customer with no active CareLine plan, or only an On-Call Service Account, gets nothing. The program
    rate and the CareLine parts discount are added into one capping discount rate that is applied once,
    never one after the other. The short-lead coil adder applies once per job when the booked crew date is
    fewer than 7 days after the day the capping is approved: it is $120.00 when the window contract carries
    an exterior color change order and $45.00 when it does not; with 7 or more days of lead there is no
    short-lead coil adder. The trim capping charge is the capping price plus the color-matched coil adder
    times the priced openings, that sum reduced once by the capping discount rate, with the short-lead coil
    adder then added undiscounted, rounded to the nearest cent at the end.
  prerequisite:
  - problem: install_ext_crew_date_booking
    kind: value_input
    gate: lead_days
    form: state
    policy_source: >-
      The trim capping charge is fixed only once the job record carries a booked crew date.
    condition: >-
      install_jobs.scheduled_date of the job is a booked date (status scheduled).
    resolved_by: book_crew_date_2f98f590
    effect: >-
      The lead from the approval day to the booked crew date becomes a definite count of days, which
      decides whether the short-lead coil adder applies, and the booked crew date becomes the date the
      charge is dated.
  cross_category:
  - category: window
    as: branch
    reads: [opening_count, variant_name, discount_program, window_transactions.oversize_opening_count, window_transactions.change_kind]
    note: Priced openings, the oversize weight, the color-matched coil adder and the program rate read the window contract a window job installs, its latest completed measure and its change orders.
  - category: door
    as: branch
    reads: [unit_count, discount_program]
    note: For a door job the openings and the program rate come from the door contract.
  - category: service
    as: branch
    reads: [variant_name, status]
    note: The CareLine parts discount reads the customer's active service plan and its parts discount.
  compute:
  - cap_oversize: "XLATEST('window','window_transactions','oversize_opening_count', date_field='txn_date', event_type='window_measure_visit', visit_outcome='completed', window_contract_id=F('window_contract_id')) or 0"
  - oversize_weight: "K('oversize_weight_many') if cap_oversize >= K('oversize_split') else (K('oversize_weight_few') if cap_oversize >= 1 else 1)"
  - priced_openings: "(CFIELD('window','opening_count', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','unit_count', door_contract_id=F('door_contract_id'))) + cap_oversize * (oversize_weight - 1)"
  - capping_price: "P('exterior_capping_per_opening') * K('volume_full_openings') + P('exterior_capping_per_opening') * K('volume_tail_share') * (priced_openings - K('volume_full_openings')) if priced_openings >= K('volume_large_min') else (P('exterior_capping_per_opening') * priced_openings * K('volume_mid_share') if priced_openings >= K('volume_mid_min') else P('exterior_capping_per_opening') * priced_openings)"
  - color_orders: "XCOUNT('window','window_transactions', event_type='window_change_order', change_kind='exterior_color', window_contract_id=F('window_contract_id'))"
  - cap_series: "CFIELD('window','variant_name', window_contract_id=F('window_contract_id'))"
  - coil_adder: "K('color_premium_adder') if color_orders > 0 and (cap_series == 'Ridgeline 5500 Series Fiberglass' or cap_series == 'Ridgeline 6600 Series Wood-Clad') else (K('color_standard_adder') if color_orders > 0 and not (cap_series == 'Ridgeline 5500 Series Fiberglass' or cap_series == 'Ridgeline 6600 Series Wood-Clad') else 0)"
  - program: "CFIELD('window','discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','discount_program', door_contract_id=F('door_contract_id'))"
  - program_rate: "(CPARAM('window','military_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CPARAM('door','military_discount_pct', door_contract_id=F('door_contract_id'))) if program == 'military' else ((CPARAM('window','first_responder_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CPARAM('door','first_responder_discount_pct', door_contract_id=F('door_contract_id'))) if program == 'first_responder' else ((CPARAM('window','senior_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CPARAM('door','senior_discount_pct', door_contract_id=F('door_contract_id'))) if program == 'senior' else 0))"
  - member_plan: "CFIELD('service','variant_name', status='active')"
  - member_rate: "CPARAM('service','parts_discount_pct', status='active') if member_plan == 'CareLine Estate Plan' else (CPARAM('service','parts_discount_pct', status='active') if member_plan == 'CareLine Premier Plan' or member_plan == 'CareLine Premier 3-Year Plan' else (CPARAM('service','parts_discount_pct', status='active') if member_plan == 'CareLine Plus Plan' else (CPARAM('service','parts_discount_pct', status='active') if member_plan == 'CareLine Basic Plan' else 0)))"
  - lead_days: "DAYS(NOW, F('scheduled_date'))"
  - rush_adder: "K('rush_color_adder') if lead_days < K('rush_days') and color_orders > 0 else (K('rush_stock_adder') if lead_days < K('rush_days') and color_orders == 0 else 0)"
  - result: "RND((capping_price + coil_adder * priced_openings) * (1 - (program_rate + member_rate)) + rush_adder, 2)"
  compute_basis:
    cap_oversize: "when the latest completed measure of the window contract recorded 4 or more openings above the series' standard size"
    oversize_weight: "when the latest completed measure of the window contract recorded 4 or more openings above the series' standard size, each of those openings counts as two priced openings; when it recorded 1 to 3, each of them counts as one and a half priced openings; when it recorded none, every opening counts as one priced opening."
    priced_openings: "the priced openings, which are the openings on the contract the job installs"
    capping_price: "with 12 or more priced openings, the first 10 are priced at the method's exterior capping charge per opening and every priced opening beyond 10 at 75 percent of it; with 6 or more but fewer than 12 priced openings, every priced opening is priced at 90 percent of the method's exterior capping charge per opening; with fewer than 6 priced openings, every priced opening is priced at the method's exterior capping charge per opening."
    color_orders: "when the window contract carries an exterior color change order"
    cap_series: "and its series is the Ridgeline 5500 Series Fiberglass or the Ridgeline 6600 Series Wood-Clad"
    coil_adder: "when the window contract carries an exterior color change order and its series is the Ridgeline 5500 Series Fiberglass or the Ridgeline 6600 Series Wood-Clad, the color-matched coil adder is $22.00 per priced opening; when it carries an exterior color change order and is any other series, it is $14.00 per priced opening; when it carries no exterior color change order, there is no color-matched coil adder."
    program: "The discount program on the contract the job installs carries over to the capping"
    program_rate: "a military program at the series military rate, a first-responder program at the series first-responder rate, a senior program at the series senior rate, and no program at nothing."
    member_plan: "A customer holding an active CareLine plan gets that plan's parts discount on the capping"
    member_rate: "an active CareLine Estate Plan, an active CareLine Premier Plan or CareLine Premier 3-Year Plan, an active CareLine Plus Plan and an active CareLine Basic Plan each give their own plan's parts discount, and a customer with no active CareLine plan, or only an On-Call Service Account, gets nothing."
    lead_days: "when the booked crew date is fewer than 7 days after the day the capping is approved"
    rush_adder: "The short-lead coil adder applies once per job when the booked crew date is fewer than 7 days after the day the capping is approved: it is $120.00 when the window contract carries an exterior color change order and $45.00 when it does not; with 7 or more days of lead there is no short-lead coil adder."
    result: "The trim capping charge is the capping price plus the color-matched coil adder times the priced openings, that sum reduced once by the capping discount rate, with the short-lead coil adder then added undiscounted, rounded to the nearest cent at the end."
  factors:
  - id: oversize_coil_weight
    effect: parameter
    decides: oversize_weight
    bindings: [cap_oversize, oversize_weight]
    ladder:
    - when: "the latest completed measure recorded 4 or more oversize openings"
      value: "K('oversize_weight_many')"
    - when: "it recorded 1 to 3 oversize openings"
      value: "K('oversize_weight_few')"
    - when: "otherwise (none)"
      value: "1"
    baseline:
      oversize_weight: "1"
    evidence: [cross_category, history]
    cross_difficulty: window
  - id: priced_opening_tiers
    effect: method
    decides: capping_price
    bindings: [priced_openings, capping_price]
    ladder:
    - when: "12 or more priced openings"
      method: "first 10 priced openings at the method's charge per opening, every one beyond 10 at 75 percent of it"
    - when: "6 or more but fewer than 12 priced openings"
      method: "every priced opening at 90 percent of the method's charge per opening"
    - when: "otherwise (fewer than 6 priced openings)"
      method: "every priced opening at the method's charge per opening"
    baseline:
      capping_price: "P('exterior_capping_per_opening') * priced_openings"
    evidence: [cross_category]
    cross_difficulty: window
  - id: color_matched_coil
    effect: parameter
    decides: coil_adder
    bindings: [color_orders, cap_series, coil_adder]
    ladder:
    - when: "the window contract carries an exterior color change order AND its series is the 5500 Series Fiberglass or the 6600 Series Wood-Clad"
      value: "K('color_premium_adder')"
    - when: "the window contract carries an exterior color change order AND it is any other series"
      value: "K('color_standard_adder')"
    - when: "otherwise (no exterior color change order)"
      value: "0"
    baseline:
      coil_adder: "0"
    evidence: [cross_category, history]
    cross_difficulty: window
  - id: short_lead_coil_order
    effect: parameter
    decides: rush_adder
    bindings: [lead_days, rush_adder]
    ladder:
    - when: "the booked crew date is fewer than 7 days after the approval day AND the window contract carries an exterior color change order"
      value: "K('rush_color_adder')"
    - when: "the booked crew date is fewer than 7 days after the approval day AND it carries no exterior color change order"
      value: "K('rush_stock_adder')"
    - when: "otherwise (7 or more days of lead)"
      value: "0"
    baseline:
      rush_adder: "0"
    evidence: [date]
    cross_difficulty: null
  - id: contract_program_carryover
    effect: parameter
    decides: program_rate
    bindings: [program, program_rate]
    ladder:
    - when: "the contract the job installs carries the military program"
      value: "the series military rate (military_discount_pct)"
    - when: "it carries the first-responder program"
      value: "the series first-responder rate (first_responder_discount_pct)"
    - when: "it carries the senior program"
      value: "the series senior rate (senior_discount_pct)"
    - when: "otherwise (no program)"
      value: "0"
    baseline:
      program_rate: "0"
    evidence: [cross_category, tier_param]
    cross_difficulty: window
  - id: careline_parts_discount
    effect: parameter
    decides: member_rate
    bindings: [member_plan, member_rate]
    ladder:
    - when: "the customer holds an active CareLine Estate Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "the customer holds an active CareLine Premier Plan or CareLine Premier 3-Year Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "the customer holds an active CareLine Plus Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "the customer holds an active CareLine Basic Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "otherwise (no active CareLine plan, or only an On-Call Service Account)"
      value: "0"
    baseline:
      member_rate: "0"
    evidence: [cross_category, tier_param]
    cross_difficulty: service
  baseline:
    rule: >-
      The standard trim capping charge is the method's exterior capping charge per opening times the priced openings, which are the openings on the contract the job installs, dated the job's booked crew date, the day the capping is done.
    params: [exterior_capping_per_opening]
  inputs:
    history:
    - {category: window, table: window_transactions, aggregate: latest, field: oversize_opening_count, filters: {event_type: window_measure_visit, visit_outcome: completed}}
    - {category: window, table: window_transactions, aggregate: count, field: window_txn_id, filters: {event_type: window_change_order, change_kind: exterior_color}}
    cross_category: [window, door, service]
- id: install_ext_company_reschedule_credit
  base_policy_refs: [install_reschedules, install_scheduling, install_credits_and_waivers]
  overwrite:
  - base_policy: install_reschedules
    superseded_clause: >-
      A company reschedule given with less than the company notice earns the method's company reschedule
      credit
    replaced_by: >-
      A company reschedule given with less than the company notice still earns a company reschedule credit,
      but its amount is the figure worked out below rather than the method's flat company reschedule
      credit; with enough notice it earns nothing.
  trigger: state_due
  subject: [install_credit_issued]
  computes: amount
  target_tool: issue_company_reschedule_credit_53c525ee
  params:
    severe_notice_hours: 24
    mid_notice_hours: 36
    severe_multiplier: 2.0
    mid_multiplier: 1.5
    long_move_days: 14
    week_rate: 60.0
    release_adder: 25.0
    long_wait_days: 14
    mid_wait_days: 4
    wait_adder_long: 40.0
    wait_adder_mid: 15.0
    delay_adder_many: 30.0
    delay_adder_one: 15.0
    loyalty_high: 1.25
    loyalty_basic: 1.1
    own_share_many: 0.8
    own_share_one: 0.9
  rule: >-
    This rule prices the company reschedule credit for the most recent crew date Ridgeline itself moved or
    released on an installation job, the company reschedule being credited; the credit names that
    reschedule and is granted once. A company reschedule given with less than the company notice still
    earns a company reschedule credit, but its amount is the figure worked out below rather than the
    method's flat company reschedule credit; with enough notice it earns nothing. The standard company
    reschedule credit is the method's company reschedule credit, granted once for the reschedule and never
    more than the job charges owed. What the reschedule did with the crew date decides how the move credit
    is worked out: a reschedule that moved the crew date more than 14 days later earns $60.00 for every
    started week of the move (the days moved divided by 7 and rounded up); a reschedule that released the
    crew date with no new date earns the method's company reschedule credit plus $25.00 for rebooking; a
    reschedule that moved the crew date by 14 days or fewer earns the method's company reschedule credit.
    The shorter the notice, the larger the credit: with fewer than 24 hours of notice the move credit is
    doubled; with 24 to fewer than 36 hours it is multiplied by 1.5; with 36 hours or more it is taken
    once. The wait adder follows the days from the crew date Ridgeline gave up to the crew date the job is
    now booked for: more than 14 days adds $40.00; 4 to 14 days adds $15.00; fewer than 4 days, or no crew date booked for the job yet, adds nothing. The factory-delay adder follows the delay notices recorded on the factory order the job
    installs: two or more add $30.00; one adds $15.00; none adds nothing. A customer with an active
    CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan has the credit multiplied
    by a loyalty factor of 1.25; one with an active CareLine Basic Plan or CareLine Plus Plan by 1.1; a
    customer with no active CareLine plan, or only an On-Call Service Account, by one. The customer's own
    reschedules of the job, failed-access visits included, set the share granted: two or more give a
    share of 0.8; exactly one gives 0.9; none gives one. The company reschedule credit worked out is the
    move credit multiplied by the notice multiplier, plus the wait adder and the factory-delay adder, that
    sum multiplied by the loyalty factor and by the share granted, rounded to the nearest cent; the credit
    granted is that figure, or the job charges owed (the job's charges less its credits, never below zero)
    when they are smaller.
  prerequisite: []
  cross_category:
  - category: order
    as: history
    reads: [order_milestones.event_type]
    note: The factory-delay adder counts the delay notices on the factory order the job installs.
  - category: service
    as: branch
    reads: [variant_name, status]
    note: The loyalty factor reads the customer's active service plan.
  compute:
  - co_notice: "LATEST('install_activities','notice_hours', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='company')"
  - co_prev: "LATEST('install_activities','previous_date', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='company')"
  - co_new: "LATEST('install_activities','new_date', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='company')"
  - move_credit: "K('week_rate') * (-((-DAYS(co_prev, co_new)) // 7)) if co_new and DAYS(co_prev, co_new) > K('long_move_days') else (P('company_reschedule_credit') + K('release_adder') if not co_new else P('company_reschedule_credit'))"
  - notice_multiplier: "K('severe_multiplier') if co_notice < K('severe_notice_hours') else (K('mid_multiplier') if co_notice < K('mid_notice_hours') else 1)"
  - wait_days: "DAYS(co_prev, F('scheduled_date')) if F('scheduled_date') else 0"
  - wait_adder: "K('wait_adder_long') if wait_days > K('long_wait_days') else (K('wait_adder_mid') if wait_days >= K('mid_wait_days') else 0)"
  - delay_notices: "XCOUNT('order','order_milestones', event_type='order_delay_noticed', factory_order_id=F('factory_order_id'))"
  - delay_adder: "K('delay_adder_many') if delay_notices >= 2 else (K('delay_adder_one') if delay_notices == 1 else 0)"
  - loyalty_plan: "CFIELD('service','variant_name', status='active')"
  - loyalty_factor: "K('loyalty_high') if loyalty_plan == 'CareLine Premier Plan' or loyalty_plan == 'CareLine Premier 3-Year Plan' or loyalty_plan == 'CareLine Estate Plan' else (K('loyalty_basic') if loyalty_plan == 'CareLine Basic Plan' or loyalty_plan == 'CareLine Plus Plan' else 1)"
  - own_reschedules: "COUNT('install_activities', event_type='install_reschedule_logged', initiated_by='customer')"
  - own_share: "K('own_share_many') if own_reschedules >= 2 else (K('own_share_one') if own_reschedules == 1 else 1)"
  - credit_worked: "RND((move_credit * notice_multiplier + wait_adder + delay_adder) * loyalty_factor * own_share, 2)"
  - charges_owed: "MX(0, SUM('install_activities','amount', event_type='install_fee_assessed') - SUM('install_activities','amount', event_type='install_credit_issued'))"
  - result: "RND(MN(credit_worked, charges_owed), 2)"
  compute_basis:
    co_notice: "This rule prices the company reschedule credit for the most recent crew date Ridgeline itself moved or released on an installation job, the company reschedule being credited"
    co_prev: "the days moved divided by 7 and rounded up"
    co_new: "a reschedule that released the crew date with no new date"
    move_credit: "a reschedule that moved the crew date more than 14 days later earns $60.00 for every started week of the move (the days moved divided by 7 and rounded up); a reschedule that released the crew date with no new date earns the method's company reschedule credit plus $25.00 for rebooking; a reschedule that moved the crew date by 14 days or fewer earns the method's company reschedule credit."
    notice_multiplier: "with fewer than 24 hours of notice the move credit is doubled; with 24 to fewer than 36 hours it is multiplied by 1.5; with 36 hours or more it is taken once."
    wait_days: "The wait adder follows the days from the crew date Ridgeline gave up to the crew date the job is now booked for"
    wait_adder: "more than 14 days adds $40.00; 4 to 14 days adds $15.00; fewer than 4 days, or no crew date booked for the job yet, adds nothing."
    delay_notices: "The factory-delay adder follows the delay notices recorded on the factory order the job installs"
    delay_adder: "two or more add $30.00; one adds $15.00; none adds nothing."
    loyalty_plan: "A customer with an active CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan"
    loyalty_factor: "A customer with an active CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan has the credit multiplied by a loyalty factor of 1.25; one with an active CareLine Basic Plan or CareLine Plus Plan by 1.1; a customer with no active CareLine plan, or only an On-Call Service Account, by one."
    own_reschedules: "The customer's own reschedules of the job, failed-access visits included, set the share granted"
    own_share: "two or more give a share of 0.8; exactly one gives 0.9; none gives one."
    credit_worked: "The company reschedule credit worked out is the move credit multiplied by the notice multiplier, plus the wait adder and the factory-delay adder, that sum multiplied by the loyalty factor and by the share granted, rounded to the nearest cent"
    charges_owed: "the job charges owed (the job's charges less its credits, never below zero)"
    result: "the credit granted is that figure, or the job charges owed (the job's charges less its credits, never below zero) when they are smaller."
  factors:
  - id: move_length_basis
    effect: method
    decides: move_credit
    bindings: [co_prev, co_new, move_credit]
    ladder:
    - when: "the company reschedule moved the crew date more than 14 days later"
      method: "$60.00 for every started week of the move (days moved over 7, rounded up)"
    - when: "the company reschedule released the crew date with no new date"
      method: "the method's company reschedule credit plus $25.00 for rebooking"
    - when: "otherwise (moved by 14 days or fewer)"
      method: "the method's company reschedule credit"
    baseline:
      move_credit: "P('company_reschedule_credit')"
    evidence: [history, date]
    cross_difficulty: null
  - id: short_notice_multiplier
    effect: parameter
    decides: notice_multiplier
    bindings: [co_notice, notice_multiplier]
    ladder:
    - when: "fewer than 24 hours of notice"
      value: "K('severe_multiplier')"
    - when: "24 to fewer than 36 hours of notice"
      value: "K('mid_multiplier')"
    - when: "otherwise (36 hours or more)"
      value: "1"
    baseline:
      notice_multiplier: "1"
    evidence: [history]
    cross_difficulty: null
  - id: rebook_wait_adder
    effect: parameter
    decides: wait_adder
    bindings: [wait_days, wait_adder]
    ladder:
    - when: "more than 14 days from the crew date given up to the crew date now booked"
      value: "K('wait_adder_long')"
    - when: "4 to 14 days"
      value: "K('wait_adder_mid')"
    - when: "otherwise (fewer than 4 days, or no crew date booked for the job yet)"
      value: "0"
    baseline:
      wait_adder: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: factory_delay_adder
    effect: parameter
    decides: delay_adder
    bindings: [delay_notices, delay_adder]
    ladder:
    - when: "two or more delay notices on the factory order the job installs"
      value: "K('delay_adder_many')"
    - when: "exactly one delay notice"
      value: "K('delay_adder_one')"
    - when: "otherwise (none)"
      value: "0"
    baseline:
      delay_adder: "0"
    evidence: [cross_category, history]
    cross_difficulty: order
  - id: careline_loyalty_factor
    effect: parameter
    decides: loyalty_factor
    bindings: [loyalty_plan, loyalty_factor]
    ladder:
    - when: "an active CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan"
      value: "K('loyalty_high')"
    - when: "an active CareLine Basic Plan or CareLine Plus Plan"
      value: "K('loyalty_basic')"
    - when: "otherwise (no active CareLine plan, or only an On-Call Service Account)"
      value: "1"
    baseline:
      loyalty_factor: "1"
    evidence: [cross_category]
    cross_difficulty: service
  - id: customer_reschedule_share
    effect: parameter
    decides: own_share
    bindings: [own_reschedules, own_share]
    ladder:
    - when: "the customer has rescheduled the job two or more times, failed-access visits included"
      value: "K('own_share_many')"
    - when: "exactly once"
      value: "K('own_share_one')"
    - when: "otherwise (never)"
      value: "1"
    baseline:
      own_share: "1"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard company reschedule credit is the method's company reschedule credit, granted once for the
      reschedule and never more than the job charges owed.
    params: [company_reschedule_credit]
  inputs:
    history:
    - {table: install_activities, aggregate: latest, field: notice_hours, filters: {event_type: install_reschedule_logged, initiated_by: company}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_reschedule_logged, initiated_by: customer}}
    - {table: install_activities, aggregate: sum, field: amount, filters: {event_type: install_fee_assessed}}
    - {table: install_activities, aggregate: sum, field: amount, filters: {event_type: install_credit_issued}}
    - {category: order, table: order_milestones, aggregate: count, field: order_milestone_id, filters: {event_type: order_delay_noticed}}
    cross_category: [order, service]
- id: install_ext_failed_access_fee
  base_policy_refs: [install_reschedules, install_agg_concurrent_jobs, install_lead_safe, install_permits, install_site_charges]
  overwrite:
  - base_policy: install_reschedules
    superseded_clause: >-
      carries the failed-access fee instead of the late reschedule fee
    replaced_by: >-
      A failed-access visit still carries a failed-access fee instead of the late reschedule fee, but its
      amount is the figure worked out below rather than the method's flat failed-access fee.
  trigger: state_due
  subject: [install_fee_assessed]
  computes: amount
  target_tool: assess_failed_access_fee_5745b419
  params:
    long_booking_days: 3
    failed_many: 3
    repeat_many: 1.5
    repeat_two: 1.25
    credit_share_many: 0.5
    credit_share_one: 0.75
    delay_share_many: 0.6
    delay_share_one: 0.8
    courtesy_high: 0.75
    courtesy_basic: 0.9
    quick_rebook_days: 3
    week_rebook_days: 7
    quick_share: 0.8
    week_share: 0.9
  rule: >-
    This rule prices the failed-access fee for the most recent failed-access visit recorded on an
    installation job, the visit being charged; a failed-access visit is the customer reschedule recorded
    with zero notice when nobody gave the crew access within the stated wait or the work area was not
    cleared. A failed-access visit still carries a failed-access fee instead of the late reschedule fee,
    but its amount is the figure worked out below rather than the method's flat failed-access fee. The
    standard failed-access fee is the method's failed-access fee, charged once for the visit and dated the
    day of the visit. The crew days held for the job, taken as the crew days booked or the crew days
    already worked if more, decide how the visit basis is worked out: with 3 or more crew days held, the
    whole block is lost and the visit basis is the method's late reschedule fee times the crew days held;
    with 2 crew days held, the visit basis is the method's failed-access fee plus the method's late
    reschedule fee; with 1 crew day held, or none, the visit basis is the method's failed-access fee. Repeated
    failed-access visits raise it: when the job has had three or more failed-access visits the repeat
    factor is 1.5; when it has had exactly two the repeat factor is 1.25; when this is its only one the
    repeat factor is one. Ridgeline's own failures on the job lower it: when the job carries two or more
    company reschedule credits the credit share is 0.5; when it carries exactly one the credit share is
    0.75; when it carries none the credit share is one. A delayed factory order lowers it too: two or more
    delay notices on the factory order the job installs give a delay share of 0.6; one gives 0.8; none
    gives one. A customer with an active CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine
    Estate Plan gets a courtesy share of 0.75; one with an active CareLine Basic Plan or CareLine Plus Plan
    0.9; a customer with no active CareLine plan, or only an On-Call Service Account, one. A visit that was
    rebooked quickly costs Ridgeline less: rebooked to a date 3 days or fewer after the failed visit gives
    a rebooking share of 0.8; 4 to 7 days after gives 0.9; more than 7 days after, or with no new date,
    gives one. The failed-access fee charged is the visit basis multiplied by the repeat factor, the credit
    share, the delay share, the courtesy share and the rebooking share, all applied together to that one
    figure, and rounded to the nearest cent at the end; it is dated the day of the visit. On a job where
    Ridgeline itself moved or released a crew date with less than its notice, the failed-access fee is
    fixed only after the job carries the company reschedule credit owed for every such crew date.
  prerequisite:
  - problem: install_ext_company_reschedule_credit
    kind: value_input
    gate: credit_share
    form: state
    policy_source: >-
      On a job where Ridgeline itself moved or released a crew date with less than its notice, the
      failed-access fee is fixed only after the job carries the company reschedule credit owed for every
      such crew date.
    condition: >-
      Every install_reschedule_logged row of the job with initiated_by company and notice_hours below the
      method's company notice is named by an install_credit_issued row with credit_kind
      company_reschedule_credit.
    resolved_by: issue_company_reschedule_credit_53c525ee
    effect: >-
      The company reschedule credits counted on the job rise from none to one, so the credit share moves
      from one to 0.75 and the failed-access fee falls accordingly.
  cross_category:
  - category: order
    as: history
    reads: [order_milestones.event_type]
    note: The delay share counts the delay notices on the factory order the job installs.
  - category: service
    as: branch
    reads: [variant_name, status]
    note: The courtesy share reads the customer's active service plan.
  compute:
  - crew_days_held: "MX(F('crew_days_planned'), COUNT('install_activities', event_type='install_crew_day_logged'))"
  - visit_basis: "P('late_reschedule_fee') * crew_days_held if crew_days_held >= K('long_booking_days') else (P('failed_access_fee') + P('late_reschedule_fee') if crew_days_held == 2 else P('failed_access_fee'))"
  - failed_visits: "COUNT('install_activities', event_type='install_reschedule_logged', initiated_by='customer', notice_hours=0)"
  - repeat_factor: "K('repeat_many') if failed_visits >= K('failed_many') else (K('repeat_two') if failed_visits == 2 else 1)"
  - company_credits: "COUNT('install_activities', event_type='install_credit_issued', credit_kind='company_reschedule_credit')"
  - credit_share: "K('credit_share_many') if company_credits >= 2 else (K('credit_share_one') if company_credits == 1 else 1)"
  - order_delays: "XCOUNT('order','order_milestones', event_type='order_delay_noticed', factory_order_id=F('factory_order_id'))"
  - delay_share: "K('delay_share_many') if order_delays >= 2 else (K('delay_share_one') if order_delays == 1 else 1)"
  - courtesy_plan: "CFIELD('service','variant_name', status='active')"
  - courtesy_share: "K('courtesy_high') if courtesy_plan == 'CareLine Premier Plan' or courtesy_plan == 'CareLine Premier 3-Year Plan' or courtesy_plan == 'CareLine Estate Plan' else (K('courtesy_basic') if courtesy_plan == 'CareLine Basic Plan' or courtesy_plan == 'CareLine Plus Plan' else 1)"
  - visit_prev: "LATEST('install_activities','previous_date', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='customer', notice_hours=0)"
  - visit_new: "LATEST('install_activities','new_date', date_field='activity_date', event_type='install_reschedule_logged', initiated_by='customer', notice_hours=0)"
  - rebook_share: "K('quick_share') if visit_new and DAYS(visit_prev, visit_new) <= K('quick_rebook_days') else (K('week_share') if visit_new and DAYS(visit_prev, visit_new) <= K('week_rebook_days') else 1)"
  - result: "RND(visit_basis * repeat_factor * credit_share * delay_share * courtesy_share * rebook_share, 2)"
  compute_basis:
    crew_days_held: "The crew days held for the job, taken as the crew days booked or the crew days already worked if more"
    visit_basis: "with 3 or more crew days held, the whole block is lost and the visit basis is the method's late reschedule fee times the crew days held; with 2 crew days held, the visit basis is the method's failed-access fee plus the method's late reschedule fee; with 1 crew day held, or none, the visit basis is the method's failed-access fee."
    failed_visits: "a failed-access visit is the customer reschedule recorded with zero notice"
    repeat_factor: "when the job has had three or more failed-access visits the repeat factor is 1.5; when it has had exactly two the repeat factor is 1.25; when this is its only one the repeat factor is one."
    company_credits: "when the job carries two or more company reschedule credits"
    credit_share: "when the job carries two or more company reschedule credits the credit share is 0.5; when it carries exactly one the credit share is 0.75; when it carries none the credit share is one."
    order_delays: "delay notices on the factory order the job installs"
    delay_share: "two or more delay notices on the factory order the job installs give a delay share of 0.6; one gives 0.8; none gives one."
    courtesy_plan: "A customer with an active CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan gets a courtesy share of 0.75"
    courtesy_share: "A customer with an active CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan gets a courtesy share of 0.75; one with an active CareLine Basic Plan or CareLine Plus Plan 0.9; a customer with no active CareLine plan, or only an On-Call Service Account, one."
    visit_prev: "This rule prices the failed-access fee for the most recent failed-access visit recorded on an installation job, the visit being charged"
    visit_new: "rebooked to a date 3 days or fewer after the failed visit"
    rebook_share: "rebooked to a date 3 days or fewer after the failed visit gives a rebooking share of 0.8; 4 to 7 days after gives 0.9; more than 7 days after, or with no new date, gives one."
    result: "The failed-access fee charged is the visit basis multiplied by the repeat factor, the credit share, the delay share, the courtesy share and the rebooking share, all applied together to that one figure, and rounded to the nearest cent at the end"
  factors:
  - id: held_block_basis
    effect: method
    decides: visit_basis
    bindings: [crew_days_held, visit_basis]
    ladder:
    - when: "3 or more crew days held for the job"
      method: "the method's late reschedule fee times the crew days held"
    - when: "exactly 2 crew days held"
      method: "the method's failed-access fee plus the method's late reschedule fee"
    - when: "otherwise (1 crew day held, or none)"
      method: "the method's failed-access fee"
    baseline:
      visit_basis: "P('failed_access_fee')"
    evidence: [history]
    cross_difficulty: null
  - id: repeat_failed_visits
    effect: parameter
    decides: repeat_factor
    bindings: [failed_visits, repeat_factor]
    ladder:
    - when: "three or more failed-access visits on the job"
      value: "K('repeat_many')"
    - when: "exactly two"
      value: "K('repeat_two')"
    - when: "otherwise (this is the only one)"
      value: "1"
    baseline:
      repeat_factor: "1"
    evidence: [history]
    cross_difficulty: null
  - id: ridgeline_credit_share
    effect: parameter
    decides: credit_share
    bindings: [company_credits, credit_share]
    ladder:
    - when: "the job carries two or more company reschedule credits"
      value: "K('credit_share_many')"
    - when: "it carries exactly one"
      value: "K('credit_share_one')"
    - when: "otherwise (none)"
      value: "1"
    baseline:
      credit_share: "1"
    evidence: [history]
    cross_difficulty: null
  - id: order_delay_share
    effect: parameter
    decides: delay_share
    bindings: [order_delays, delay_share]
    ladder:
    - when: "two or more delay notices on the factory order the job installs"
      value: "K('delay_share_many')"
    - when: "exactly one"
      value: "K('delay_share_one')"
    - when: "otherwise (none)"
      value: "1"
    baseline:
      delay_share: "1"
    evidence: [cross_category, history]
    cross_difficulty: order
  - id: careline_courtesy_share
    effect: parameter
    decides: courtesy_share
    bindings: [courtesy_plan, courtesy_share]
    ladder:
    - when: "an active CareLine Premier Plan, CareLine Premier 3-Year Plan or CareLine Estate Plan"
      value: "K('courtesy_high')"
    - when: "an active CareLine Basic Plan or CareLine Plus Plan"
      value: "K('courtesy_basic')"
    - when: "otherwise (no active CareLine plan, or only an On-Call Service Account)"
      value: "1"
    baseline:
      courtesy_share: "1"
    evidence: [cross_category]
    cross_difficulty: service
  - id: quick_rebook_share
    effect: parameter
    decides: rebook_share
    bindings: [visit_prev, visit_new, rebook_share]
    ladder:
    - when: "the visit was rebooked to a date 3 days or fewer after it"
      value: "K('quick_share')"
    - when: "rebooked to a date 4 to 7 days after it"
      value: "K('week_share')"
    - when: "otherwise (more than 7 days after, or no new date)"
      value: "1"
    baseline:
      rebook_share: "1"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard failed-access fee is the method's failed-access fee, charged once for the visit and dated
      the day of the visit.
    params: [failed_access_fee]
  inputs:
    history:
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_reschedule_logged, initiated_by: customer, notice_hours: 0}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_credit_issued, credit_kind: company_reschedule_credit}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_crew_day_logged}}
    - {category: order, table: order_milestones, aggregate: count, field: order_milestone_id, filters: {event_type: order_delay_noticed}}
    cross_category: [order, service]
- id: install_ext_lead_safe_fee
  base_policy_refs: [install_lead_safe, install_agg_concurrent_jobs, install_reschedules, install_permits, install_site_charges]
  overwrite:
  - base_policy: install_lead_safe
    superseded_clause: >-
      The fee is the method's lead-safe fee per opening times the openings on the job, never less than the
      method's minimum per job, assessed once on the first crew day.
    replaced_by: >-
      The lead-safe fee is still assessed once and dated the job's first crew day, but its amount is the
      figure worked out below rather than simply the method's lead-safe fee per opening times the openings
      on the job held to the method's minimum per job.
  trigger: state_due
  subject: [install_fee_assessed]
  computes: amount
  target_tool: assess_lead_safe_fee_cf2f582a
  params:
    multi_day_min: 3
    reset_charge: 60.0
    shape_adder: 12.0
    wood_adder: 8.0
    oversize_many: 4
    oversize_adder_many: 90.0
    oversize_adder_few: 45.0
    restage_many: 120.0
    restage_one: 60.0
    rot_many_feet: 10
    rot_adder_many: 60.0
    rot_adder_few: 30.0
    volume_large: 24
    volume_mid: 12
    stepdown_large: 5.0
    stepdown_mid: 2.0
  rule: >-
    This rule prices the lead-safe fee of an installation job worked under lead-safe practices; lead-safe
    work practices and their fee apply only when the home at the service address was built before the
    stated year according to the customer profile. The lead-safe fee is still assessed once and dated the
    job's first crew day, but its amount is the figure worked out below rather than simply the method's
    lead-safe fee per opening times the openings on the job held to the method's minimum per job. The
    standard lead-safe fee is the method's lead-safe fee per opening times the openings on the job, never
    less than the method's minimum per job, assessed once and dated the job's first crew day. Containment is
    set up afresh on every crew day, so the containment days are whichever is larger of the crew days on the
    job's booking and the crew days already logged, and they decide how the containment charge is worked
    out: with 3 or more containment days, the containment charge is the method's lead-safe fee per opening
    times the openings on the job, never less than the method's minimum per job times the containment days;
    with 2 containment days, it is the method's lead-safe fee per opening times the openings on the job plus
    a $60.00 containment re-set, never less than the method's minimum per job; with 1 containment day, it is
    the method's lead-safe fee per opening times the openings on the job, never less than the method's
    minimum per job. Shaped units carry more painted trim to work: when the factory order the job installs
    is a Specialty Shape Build the shaped-trim adder is $12.00 per opening on the job; when it is an
    Architectural Wood Build it is $8.00 per opening; any other build class has no shaped-trim adder. Larger
    openings disturb more paint: when the latest completed measure of the window contract recorded 4 or more
    openings above the series' standard size the large-opening adder is $90.00; when it recorded 1 to 3 it
    is $45.00; when it recorded none there is no large-opening adder. Containment staged for a visit the
    customer did not give access to is staged again: when the job's charges carry two or more failed-access
    fees the re-staging charge is $120.00; when they carry one it is $60.00; when they carry none there is
    no re-staging charge. Rotted sills cut out on the job disturb painted framing: when the rot repair
    charged on the job covers more than 10 linear feet the sill adder is $60.00; when it covers 10
    linear feet or less it is $30.00; when there is no rot repair there is no sill adder. Containment material is
    bought by the job, so a larger contract earns a step-down: more than 24 openings on the contract the job
    installs takes $5.00 per opening on the job off the fee; 13 to 24 openings takes $2.00 per opening off;
    12 or fewer takes nothing off. The lead-safe fee charged is the containment charge, plus the
    shaped-trim adder times the openings on the job, plus the large-opening adder, the re-staging charge and
    the sill adder, less the step-down times the openings on the job, rounded to the nearest cent. On a job
    that has had a failed-access visit, the lead-safe fee is not worked out until the job's charges carry
    the failed-access fee for every such visit.
  prerequisite:
  - problem: install_ext_failed_access_fee
    kind: value_input
    gate: restage
    form: state
    policy_source: >-
      On a job that has had a failed-access visit, the lead-safe fee is not worked out until the job's
      charges carry the failed-access fee for every such visit.
    condition: >-
      Every install_reschedule_logged row of the job with initiated_by customer and notice_hours 0 has an
      install_fee_assessed row of the job with fee_kind failed_access_fee dated that visit's activity_date.
    resolved_by: assess_failed_access_fee_5745b419
    effect: >-
      The failed-access fees counted on the job rise by the one for the latest visit, which moves the
      re-staging charge up a tier (from $60.00 to $120.00 when the job then carries two).
  cross_category:
  - category: order
    as: branch
    reads: [variant_name]
    note: The shaped-trim adder reads the build class of the factory order the job installs.
  - category: window
    as: branch
    reads: [opening_count, window_transactions.oversize_opening_count]
    note: The large-opening adder reads the latest completed measure, and the step-down reads the window contract's openings.
  - category: door
    as: branch
    reads: [unit_count]
    note: For a door job the step-down reads the door contract's units.
  compute:
  - containment_days: "MX(F('crew_days_planned'), COUNT('install_activities', event_type='install_crew_day_logged'))"
  - containment_charge: "MX(P('lead_safe_fee_per_opening') * F('unit_count'), P('lead_safe_min_fee_per_job') * containment_days) if containment_days >= K('multi_day_min') else (MX(P('lead_safe_fee_per_opening') * F('unit_count') + K('reset_charge'), P('lead_safe_min_fee_per_job')) if containment_days == 2 else MX(P('lead_safe_fee_per_opening') * F('unit_count'), P('lead_safe_min_fee_per_job')))"
  - lead_build: "CFIELD('order','variant_name', factory_order_id=F('factory_order_id'))"
  - shaped_trim_adder: "K('shape_adder') if lead_build == 'Specialty Shape Build' else (K('wood_adder') if lead_build == 'Architectural Wood Build' else 0)"
  - lead_oversize: "XLATEST('window','window_transactions','oversize_opening_count', date_field='txn_date', event_type='window_measure_visit', visit_outcome='completed', window_contract_id=F('window_contract_id')) or 0"
  - large_opening_adder: "K('oversize_adder_many') if lead_oversize >= K('oversize_many') else (K('oversize_adder_few') if lead_oversize >= 1 else 0)"
  - failed_fees: "COUNT('install_activities', event_type='install_fee_assessed', fee_kind='failed_access_fee')"
  - restage: "K('restage_many') if failed_fees >= 2 else (K('restage_one') if failed_fees == 1 else 0)"
  - rot_feet: "SUM('install_activities','units', event_type='install_fee_assessed', fee_kind='rot_repair_charge')"
  - sill_adder: "K('rot_adder_many') if rot_feet > K('rot_many_feet') else (K('rot_adder_few') if rot_feet > 0 else 0)"
  - lead_openings: "CFIELD('window','opening_count', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','unit_count', door_contract_id=F('door_contract_id'))"
  - step_down: "K('stepdown_large') if lead_openings > K('volume_large') else (K('stepdown_mid') if lead_openings > K('volume_mid') else 0)"
  - result: "RND(containment_charge + shaped_trim_adder * F('unit_count') + large_opening_adder + restage + sill_adder - step_down * F('unit_count'), 2)"
  compute_basis:
    containment_days: "the containment days are whichever is larger of the crew days on the job's booking and the crew days already logged"
    containment_charge: "with 3 or more containment days, the containment charge is the method's lead-safe fee per opening times the openings on the job, never less than the method's minimum per job times the containment days; with 2 containment days, it is the method's lead-safe fee per opening times the openings on the job plus a $60.00 containment re-set, never less than the method's minimum per job; with 1 containment day, it is the method's lead-safe fee per opening times the openings on the job, never less than the method's minimum per job."
    lead_build: "when the factory order the job installs is a Specialty Shape Build"
    shaped_trim_adder: "when the factory order the job installs is a Specialty Shape Build the shaped-trim adder is $12.00 per opening on the job; when it is an Architectural Wood Build it is $8.00 per opening; any other build class has no shaped-trim adder."
    lead_oversize: "when the latest completed measure of the window contract recorded 4 or more openings above the series' standard size"
    large_opening_adder: "when the latest completed measure of the window contract recorded 4 or more openings above the series' standard size the large-opening adder is $90.00; when it recorded 1 to 3 it is $45.00; when it recorded none there is no large-opening adder."
    failed_fees: "when the job's charges carry two or more failed-access fees"
    restage: "when the job's charges carry two or more failed-access fees the re-staging charge is $120.00; when they carry one it is $60.00; when they carry none there is no re-staging charge."
    rot_feet: "when the rot repair charged on the job covers more than 10 linear feet"
    sill_adder: "when the rot repair charged on the job covers more than 10 linear feet the sill adder is $60.00; when it covers 10 linear feet or less it is $30.00; when there is no rot repair there is no sill adder."
    lead_openings: "more than 24 openings on the contract the job installs"
    step_down: "more than 24 openings on the contract the job installs takes $5.00 per opening on the job off the fee; 13 to 24 openings takes $2.00 per opening off; 12 or fewer takes nothing off."
    result: "The lead-safe fee charged is the containment charge, plus the shaped-trim adder times the openings on the job, plus the large-opening adder, the re-staging charge and the sill adder, less the step-down times the openings on the job, rounded to the nearest cent."
  factors:
  - id: containment_day_basis
    effect: method
    decides: containment_charge
    bindings: [containment_days, containment_charge]
    ladder:
    - when: "3 or more containment days"
      method: "per-opening fee times openings, never less than the minimum per job times the containment days"
    - when: "exactly 2 containment days"
      method: "per-opening fee times openings plus a $60.00 containment re-set, never less than the minimum per job"
    - when: "otherwise (1 containment day)"
      method: "per-opening fee times openings, never less than the minimum per job"
    baseline:
      containment_charge: "MX(P('lead_safe_fee_per_opening') * F('unit_count'), P('lead_safe_min_fee_per_job'))"
    evidence: [history]
    cross_difficulty: null
  - id: shaped_trim_work
    effect: parameter
    decides: shaped_trim_adder
    bindings: [lead_build, shaped_trim_adder]
    ladder:
    - when: "the factory order is a Specialty Shape Build"
      value: "K('shape_adder')"
    - when: "the factory order is an Architectural Wood Build"
      value: "K('wood_adder')"
    - when: "otherwise (any other build class)"
      value: "0"
    baseline:
      shaped_trim_adder: "0"
    evidence: [cross_category]
    cross_difficulty: order
  - id: large_opening_paint
    effect: parameter
    decides: large_opening_adder
    bindings: [lead_oversize, large_opening_adder]
    ladder:
    - when: "the latest completed measure recorded 4 or more oversize openings"
      value: "K('oversize_adder_many')"
    - when: "it recorded 1 to 3"
      value: "K('oversize_adder_few')"
    - when: "otherwise (none)"
      value: "0"
    baseline:
      large_opening_adder: "0"
    evidence: [cross_category, history]
    cross_difficulty: window
  - id: containment_restaging
    effect: parameter
    decides: restage
    bindings: [failed_fees, restage]
    ladder:
    - when: "the job's charges carry two or more failed-access fees"
      value: "K('restage_many')"
    - when: "they carry exactly one"
      value: "K('restage_one')"
    - when: "otherwise (none)"
      value: "0"
    baseline:
      restage: "0"
    evidence: [history]
    cross_difficulty: null
  - id: rotted_sill_disturbance
    effect: parameter
    decides: sill_adder
    bindings: [rot_feet, sill_adder]
    ladder:
    - when: "rot repair charged on the job covers more than 10 linear feet"
      value: "K('rot_adder_many')"
    - when: "it covers 10 linear feet or less (any rot repair up to 10 linear feet)"
      value: "K('rot_adder_few')"
    - when: "otherwise (no rot repair)"
      value: "0"
    baseline:
      sill_adder: "0"
    evidence: [history]
    cross_difficulty: null
  - id: containment_material_stepdown
    effect: parameter
    decides: step_down
    bindings: [lead_openings, step_down]
    ladder:
    - when: "more than 24 openings on the contract the job installs"
      value: "K('stepdown_large')"
    - when: "13 to 24 openings"
      value: "K('stepdown_mid')"
    - when: "otherwise (12 or fewer)"
      value: "0"
    baseline:
      step_down: "0"
    evidence: [cross_category]
    cross_difficulty: window
  baseline:
    rule: >-
      The standard lead-safe fee is the method's lead-safe fee per opening times the openings on the job,
      never less than the method's minimum per job, assessed once and dated the job's first crew day.
    params: [lead_safe_fee_per_opening, lead_safe_min_fee_per_job]
  inputs:
    history:
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_crew_day_logged}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_fee_assessed, fee_kind: failed_access_fee}}
    - {table: install_activities, aggregate: sum, field: units, filters: {event_type: install_fee_assessed, fee_kind: rot_repair_charge}}
    - {category: window, table: window_transactions, aggregate: latest, field: oversize_opening_count, filters: {event_type: window_measure_visit, visit_outcome: completed}}
    cross_category: [order, window, door]
- id: install_ext_interior_casing_charge
  base_policy_refs: [install_site_charges, install_agg_concurrent_jobs, install_reschedules, install_lead_safe, install_permits]
  overwrite:
  - base_policy: install_site_charges
    superseded_clause: >-
      New interior casing is charged per opening only where the method does not include it
    replaced_by: >-
      New interior casing is still charged only where the method does not include it, and it is still
      charged on the job on the date the work is done; for new interior casing that the customer
      approves, and only for such casing, the charge is the amount worked out below, built from the
      method's interior trim charge per opening, rather than that charge times the openings; exterior
      trim capping is not priced by this rule, and every other charge kind keeps its base basis.
  trigger: on_request
  subject: [install_fee_assessed]
  computes: amount
  target_tool: approve_interior_casing_01c7ec6d
  params:
    oversize_split: 4
    casing_weight_many: 2.0
    casing_weight_few: 1.5
    volume_full_openings: 10
    volume_large_min: 12
    volume_tail_share: 0.8
    volume_mid_min: 6
    volume_mid_share: 0.9
    prep_with_sill: 18.0
    prep_plain: 12.0
    stock_stain_grade: 28.0
    stock_matched: 12.0
  rule: >-
    This rule prices new interior casing that the customer approves for an installation job whose method
    does not include interior casing; casing is approved for every opening on the contract the job installs,
    so the trim inside the whole house matches. New interior casing is still charged only where the
    method does not include it, and it is still charged on the job on the date the work is done; for new
    interior casing that the customer approves, and only for such casing, the charge is the amount
    worked out below, built from the method's interior trim charge per opening, rather than that charge
    times the openings; exterior trim capping is not priced by this rule, and every other charge kind
    keeps its base basis. The standard interior casing charge is the method's interior trim charge per opening times the casing openings, which are the openings on the contract the job installs, dated the crew day the casing is fitted. In a home built before the stated year, the interior casing charge is
    fixed only after the job's charges carry the lead-safe fee. Oversize openings need longer casing legs and add to the casing openings: when the latest completed measure of the window contract recorded 4 or more openings above the series' standard size, each of those openings counts as two casing openings; when it recorded 1 to 3, each of them counts as one and a half casing openings; when it recorded none, every opening counts as one casing opening. How the casing price is built depends on the casing
    openings: with 12 or more casing openings, the first 10 are priced at the method's interior trim charge
    per opening and every casing opening beyond 10 at 80 percent of it; with 6 or more but fewer than 12
    casing openings, every casing opening is priced at 90 percent of the method's interior trim charge per
    opening; with fewer than 6 casing openings, every casing opening is priced at the method's interior trim
    charge per opening. Removing old painted casing in a lead-safe job needs wall preparation around each
    opening: when the job's charges carry a lead-safe fee and a rot repair charge, the wall-preparation
    adder is $18.00 per casing opening; when they carry a lead-safe fee and no rot repair charge, it is
    $12.00 per casing opening; when they carry no lead-safe fee, there is no wall-preparation adder. The
    casing stock follows the interior of the window series: the Ridgeline 6600 Series Wood-Clad takes
    stain-grade casing at $28.00 per casing opening; the Ridgeline 3300 Series Premium Vinyl, Ridgeline 4400
    Series Composite or Ridgeline 5500 Series Fiberglass takes finish-matched casing at $12.00 per casing
    opening; any other series takes standard paint-grade casing with no stock adder. The discount program on
    the contract the job installs carries over to the casing at the rate that contract's series sets for
    that program: a military program at the series military rate, a first-responder program at the series
    first-responder rate, a senior program at the series senior rate, and no program at nothing. A customer
    holding an active CareLine plan gets that plan's parts discount on the casing: an active CareLine Estate
    Plan, an active CareLine Premier Plan or CareLine Premier 3-Year Plan, an active CareLine Plus Plan and an
    active CareLine Basic Plan each give their own plan's parts discount, and a customer with no active
    CareLine plan, or only an On-Call Service Account, gets nothing. The program rate and the CareLine parts
    discount are added into one casing discount rate that is applied once, never one after the other. The
    interior casing charge is the casing price plus the wall-preparation adder and the stock adder times the
    casing openings, that sum reduced once by the casing discount rate, rounded to the nearest cent.
  prerequisite:
  - problem: install_ext_lead_safe_fee
    kind: value_input
    gate: prep_adder
    form: state
    policy_source: >-
      In a home built before the stated year, the interior casing charge is fixed only after the job's
      charges carry the lead-safe fee.
    condition: >-
      For a job whose customer profile shows a home built before the method's lead-safe year,
      install_activities holds an install_fee_assessed row of the job with fee_kind lead_safe_fee.
    resolved_by: assess_lead_safe_fee_cf2f582a
    effect: >-
      The wall-preparation adder moves from none to $18.00 per casing opening (a rot repair charge also
      stands) or $12.00 (no rot repair), raising the interior casing charge.
  cross_category:
  - category: window
    as: branch
    reads: [opening_count, variant_name, discount_program, window_transactions.oversize_opening_count]
    note: Casing openings, the oversize weight, the stock adder and the program rate read the window contract a window job installs and its latest completed measure.
  - category: door
    as: branch
    reads: [unit_count, discount_program]
    note: For a door job the openings and the program rate come from the door contract.
  - category: service
    as: branch
    reads: [variant_name, status]
    note: The CareLine parts discount reads the customer's active service plan and its parts discount.
  compute:
  - casing_oversize: "XLATEST('window','window_transactions','oversize_opening_count', date_field='txn_date', event_type='window_measure_visit', visit_outcome='completed', window_contract_id=F('window_contract_id')) or 0"
  - casing_weight: "K('casing_weight_many') if casing_oversize >= K('oversize_split') else (K('casing_weight_few') if casing_oversize >= 1 else 1)"
  - casing_openings: "(CFIELD('window','opening_count', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','unit_count', door_contract_id=F('door_contract_id'))) + casing_oversize * (casing_weight - 1)"
  - casing_price: "P('interior_trim_per_opening') * K('volume_full_openings') + P('interior_trim_per_opening') * K('volume_tail_share') * (casing_openings - K('volume_full_openings')) if casing_openings >= K('volume_large_min') else (P('interior_trim_per_opening') * casing_openings * K('volume_mid_share') if casing_openings >= K('volume_mid_min') else P('interior_trim_per_opening') * casing_openings)"
  - lead_safe_on_job: "COUNT('install_activities', event_type='install_fee_assessed', fee_kind='lead_safe_fee')"
  - rot_on_job: "COUNT('install_activities', event_type='install_fee_assessed', fee_kind='rot_repair_charge')"
  - prep_adder: "K('prep_with_sill') if lead_safe_on_job > 0 and rot_on_job > 0 else (K('prep_plain') if lead_safe_on_job > 0 and rot_on_job == 0 else 0)"
  - casing_series: "CFIELD('window','variant_name', window_contract_id=F('window_contract_id'))"
  - stock_adder: "K('stock_stain_grade') if casing_series == 'Ridgeline 6600 Series Wood-Clad' else (K('stock_matched') if casing_series == 'Ridgeline 3300 Series Premium Vinyl' or casing_series == 'Ridgeline 4400 Series Composite' or casing_series == 'Ridgeline 5500 Series Fiberglass' else 0)"
  - casing_program: "CFIELD('window','discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CFIELD('door','discount_program', door_contract_id=F('door_contract_id'))"
  - casing_program_rate: "(CPARAM('window','military_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CPARAM('door','military_discount_pct', door_contract_id=F('door_contract_id'))) if casing_program == 'military' else ((CPARAM('window','first_responder_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CPARAM('door','first_responder_discount_pct', door_contract_id=F('door_contract_id'))) if casing_program == 'first_responder' else ((CPARAM('window','senior_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') else CPARAM('door','senior_discount_pct', door_contract_id=F('door_contract_id'))) if casing_program == 'senior' else 0))"
  - casing_plan: "CFIELD('service','variant_name', status='active')"
  - casing_member_rate: "CPARAM('service','parts_discount_pct', status='active') if casing_plan == 'CareLine Estate Plan' else (CPARAM('service','parts_discount_pct', status='active') if casing_plan == 'CareLine Premier Plan' or casing_plan == 'CareLine Premier 3-Year Plan' else (CPARAM('service','parts_discount_pct', status='active') if casing_plan == 'CareLine Plus Plan' else (CPARAM('service','parts_discount_pct', status='active') if casing_plan == 'CareLine Basic Plan' else 0)))"
  - result: "RND((casing_price + (prep_adder + stock_adder) * casing_openings) * (1 - (casing_program_rate + casing_member_rate)), 2)"
  compute_basis:
    casing_oversize: "when the latest completed measure of the window contract recorded 4 or more openings above the series' standard size"
    casing_weight: "each of those openings counts as two casing openings; when it recorded 1 to 3, each of them counts as one and a half casing openings; when it recorded none, every opening counts as one casing opening."
    casing_openings: "the casing openings, which are the openings on the contract the job installs"
    casing_price: "with 12 or more casing openings, the first 10 are priced at the method's interior trim charge per opening and every casing opening beyond 10 at 80 percent of it; with 6 or more but fewer than 12 casing openings, every casing opening is priced at 90 percent of the method's interior trim charge per opening; with fewer than 6 casing openings, every casing opening is priced at the method's interior trim charge per opening."
    lead_safe_on_job: "when the job's charges carry a lead-safe fee and a rot repair charge"
    rot_on_job: "when they carry a lead-safe fee and no rot repair charge"
    prep_adder: "when the job's charges carry a lead-safe fee and a rot repair charge, the wall-preparation adder is $18.00 per casing opening; when they carry a lead-safe fee and no rot repair charge, it is $12.00 per casing opening; when they carry no lead-safe fee, there is no wall-preparation adder."
    casing_series: "The casing stock follows the interior of the window series"
    stock_adder: "the Ridgeline 6600 Series Wood-Clad takes stain-grade casing at $28.00 per casing opening; the Ridgeline 3300 Series Premium Vinyl, Ridgeline 4400 Series Composite or Ridgeline 5500 Series Fiberglass takes finish-matched casing at $12.00 per casing opening; any other series takes standard paint-grade casing with no stock adder."
    casing_program: "The discount program on the contract the job installs carries over to the casing"
    casing_program_rate: "a military program at the series military rate, a first-responder program at the series first-responder rate, a senior program at the series senior rate, and no program at nothing."
    casing_plan: "A customer holding an active CareLine plan gets that plan's parts discount on the casing"
    casing_member_rate: "an active CareLine Estate Plan, an active CareLine Premier Plan or CareLine Premier 3-Year Plan, an active CareLine Plus Plan and an active CareLine Basic Plan each give their own plan's parts discount, and a customer with no active CareLine plan, or only an On-Call Service Account, gets nothing."
    result: "The interior casing charge is the casing price plus the wall-preparation adder and the stock adder times the casing openings, that sum reduced once by the casing discount rate, rounded to the nearest cent."
  factors:
  - id: casing_leg_weight
    effect: parameter
    decides: casing_weight
    bindings: [casing_oversize, casing_weight]
    ladder:
    - when: "the latest completed measure recorded 4 or more oversize openings"
      value: "K('casing_weight_many')"
    - when: "it recorded 1 to 3 oversize openings"
      value: "K('casing_weight_few')"
    - when: "otherwise (none)"
      value: "1"
    baseline:
      casing_weight: "1"
    evidence: [cross_category, history]
    cross_difficulty: window
  - id: casing_opening_tiers
    effect: method
    decides: casing_price
    bindings: [casing_openings, casing_price]
    ladder:
    - when: "12 or more casing openings"
      method: "first 10 casing openings at the method's interior trim charge, every one beyond 10 at 80 percent of it"
    - when: "6 or more but fewer than 12 casing openings"
      method: "every casing opening at 90 percent of the method's interior trim charge"
    - when: "otherwise (fewer than 6 casing openings)"
      method: "every casing opening at the method's interior trim charge"
    baseline:
      casing_price: "P('interior_trim_per_opening') * casing_openings"
    evidence: [cross_category]
    cross_difficulty: window
  - id: lead_safe_wall_prep
    effect: parameter
    decides: prep_adder
    bindings: [lead_safe_on_job, rot_on_job, prep_adder]
    ladder:
    - when: "the job's charges carry a lead-safe fee AND a rot repair charge"
      value: "K('prep_with_sill')"
    - when: "the job's charges carry a lead-safe fee AND no rot repair charge"
      value: "K('prep_plain')"
    - when: "otherwise (no lead-safe fee)"
      value: "0"
    baseline:
      prep_adder: "0"
    evidence: [history]
    cross_difficulty: null
  - id: series_casing_stock
    effect: parameter
    decides: stock_adder
    bindings: [casing_series, stock_adder]
    ladder:
    - when: "the window series is the Ridgeline 6600 Series Wood-Clad"
      value: "K('stock_stain_grade')"
    - when: "the window series is the 3300 Series Premium Vinyl, 4400 Series Composite or 5500 Series Fiberglass"
      value: "K('stock_matched')"
    - when: "otherwise (any other series)"
      value: "0"
    baseline:
      stock_adder: "0"
    evidence: [cross_category]
    cross_difficulty: window
  - id: casing_program_carryover
    effect: parameter
    decides: casing_program_rate
    bindings: [casing_program, casing_program_rate]
    ladder:
    - when: "the contract the job installs carries the military program"
      value: "the series military rate (military_discount_pct)"
    - when: "it carries the first-responder program"
      value: "the series first-responder rate (first_responder_discount_pct)"
    - when: "it carries the senior program"
      value: "the series senior rate (senior_discount_pct)"
    - when: "otherwise (no program)"
      value: "0"
    baseline:
      casing_program_rate: "0"
    evidence: [cross_category, tier_param]
    cross_difficulty: window
  - id: careline_casing_discount
    effect: parameter
    decides: casing_member_rate
    bindings: [casing_plan, casing_member_rate]
    ladder:
    - when: "the customer holds an active CareLine Estate Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "the customer holds an active CareLine Premier Plan or CareLine Premier 3-Year Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "the customer holds an active CareLine Plus Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "the customer holds an active CareLine Basic Plan"
      value: "that plan's parts discount (parts_discount_pct)"
    - when: "otherwise (no active CareLine plan, or only an On-Call Service Account)"
      value: "0"
    baseline:
      casing_member_rate: "0"
    evidence: [cross_category, tier_param]
    cross_difficulty: service
  baseline:
    rule: >-
      The standard interior casing charge is the method's interior trim charge per opening times the casing openings, which are the openings on the contract the job installs, dated the crew day the casing is fitted.
    params: [interior_trim_per_opening]
  inputs:
    history:
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_fee_assessed, fee_kind: lead_safe_fee}}
    - {table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_fee_assessed, fee_kind: rot_repair_charge}}
    - {category: window, table: window_transactions, aggregate: latest, field: oversize_opening_count, filters: {event_type: window_measure_visit, visit_outcome: completed}}
    cross_category: [window, door, service]
