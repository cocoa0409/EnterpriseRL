category: install
display_name: Installation Jobs
binding:
  holding_table: install_jobs
  event_tables:
  - install_activities
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - opened
  - scheduled
  - in_progress
  - completed
  - closed
  - cancelled
  transitions:
  - from: opened
    to: scheduled
    by: agent
    means: A crew date is booked with the customer.
  - from: scheduled
    to: opened
    by: agent
    means: >-
      The booked crew date is released without a new date, so the job waits to be scheduled again.
  - from: scheduled
    to: in_progress
    by: system
    means: The crew starts work at the home.
  - from: in_progress
    to: completed
    by: system
    means: The customer signs the completion certificate at the final walkthrough.
  - from: completed
    to: closed
    by: system
    means: Every punch item is resolved and any required final inspection has passed.
  - from: opened
    to: cancelled
    by: system
    means: The job is cancelled because its contract was cancelled before scheduling.
  - from: scheduled
    to: cancelled
    by: system
    means: The job is cancelled because its contract was cancelled while a crew date was booked.
accounts:
- key: job_charges
  unit: USD
  meaning: >-
    Installation job charges owed by the customer beyond the contract price (site conditions, compliance,
    reschedule and access fees), net of credits and waivers; collected with the contract's final balance.
parameter_schema:
  openings_per_crew_day: >-
    Openings (or door units) one crew installs per crew day with this method; crew days planned are the
    units divided by this, rounded up (count).
  max_units_per_job: Most openings or door units one installation job may carry with this method (count).
  schedule_offer_business_days: Business days after the job is opened within which a first crew date is
    offered (days).
  reschedule_offer_business_days: Business days after a reschedule within which a new crew date is offered
    (days).
  arrival_window_start: Start of the crew arrival window on each crew day, local time (HH:MM).
  arrival_window_hours: Length of the crew arrival window (hours).
  late_arrival_grace_minutes: >-
    Minutes after the end of the arrival window before a crew arrival counts as late (minutes).
  late_arrival_credit: Credit per crew day on which the crew arrived late (USD).
  no_access_wait_minutes: >-
    Minutes the crew waits for access after arriving before the visit counts as failed access (minutes).
  failed_access_fee: Fee when the crew cannot get access or the work area is not cleared (USD).
  customer_clearance_feet: Clear space the customer must leave in front of every opening inside the home
    (feet).
  reschedule_notice_hours: >-
    Notice before the booked crew arrival for a customer reschedule to count as on time (hours).
  free_customer_reschedules: On-time customer reschedules per job without a fee (count).
  late_reschedule_fee: >-
    Fee for a customer reschedule given with less than the notice, or beyond the free count (USD).
  max_customer_reschedules: >-
    Customer reschedules one job may receive before a further one needs branch manager approval (count).
  company_reschedule_notice_hours: >-
    Notice Ridgeline gives before the booked crew arrival when it moves a crew date; less notice earns
    the customer a credit (hours).
  company_reschedule_credit: Credit when Ridgeline moves a crew date with less than its notice (USD).
  weather_reschedule_no_charge: Whether a weather reschedule carries neither a fee nor a credit (boolean).
  weather_min_temp_f: >-
    Lowest forecast temperature at which exterior sealing is done; below it the crew day is moved for
    weather (degrees Fahrenheit).
  weather_max_wind_mph: >-
    Highest sustained forecast wind at which ladder and large-unit work is done; above it the crew day
    is moved for weather (miles per hour).
  lead_safe_year_built_before: >-
    Homes built before this year get lead-safe work practices under the EPA Renovation, Repair and Painting
    rule (year).
  lead_safe_fee_per_opening: Lead-safe work practice fee per opening (USD).
  lead_safe_min_fee_per_job: Smallest lead-safe fee per job (USD).
  permit_required_default: Whether jobs with this method are permitted and inspected by default (boolean).
  permit_admin_fee: >-
    Administration fee once per permitted job for filing the permit and booking the inspection; 0.00 where
    no permit is filed (USD).
  final_inspection_business_days: >-
    Business days after completion within which the final inspection is booked for a permitted job; 0
    where none (days).
  rot_included_linear_feet_per_opening: Linear feet of rotted framing or sill replaced per opening at
    no charge (feet).
  rot_repair_per_linear_foot: >-
    Charge per linear foot of rotted framing or sill replaced beyond the included footage (USD).
  rot_repair_requires_customer_approval: >-
    Whether rot repair beyond the included footage is done only after the customer approves it on site
    (boolean).
  interior_trim_included: Whether new interior casing is included with the method (boolean).
  interior_trim_per_opening: Charge per opening for new interior casing where not included; 0.00 where
    included (USD).
  exterior_capping_available: Whether exterior aluminum trim capping can be applied with the method (boolean).
  exterior_capping_included: Whether exterior trim capping is included with the method (boolean).
  exterior_capping_per_opening: >-
    Charge per opening for exterior trim capping where available and not included; 0.00 otherwise (USD).
  stucco_patch_per_opening: >-
    Charge per opening to patch stucco or mortar around a masonry opening; 0.00 for other methods (USD).
  storm_window_removal_per_opening: Charge per opening to remove and dispose of an existing storm window
    (USD).
  treatment_removal_fee_per_opening: >-
    Charge per opening when the crew must take down blinds, shades or curtains the customer left up (USD).
  upper_story_surcharge_per_opening: Surcharge per opening above the first floor reached by ladder or
    lift (USD).
  haul_away_included: Whether removal and disposal of the old units is included (boolean).
  alarm_sensor_reconnect_included: >-
    Whether reconnecting security alarm sensors is included; when false the customer's alarm company reconnects
    them (boolean).
  interior_paint_included: Whether painting or staining of new interior trim is included (boolean).
  hoa_approval_customer_responsible: >-
    Whether homeowners-association or historic-district approval is obtained by the customer before scheduling
    (boolean).
  completion_walkthrough_required: >-
    Whether the crew lead and customer walk every opening before the completion certificate is signed
    (boolean).
  completion_certificate_required: >-
    Whether a signed completion certificate is required to complete the job, start warranty coverage and
    release financing funds (boolean).
  punch_list_response_business_days: Business days after completion within which every punch item is resolved
    (days).
  hazard_stop_work: >-
    Whether the crew stops work and the branch manager takes over when suspected asbestos or mold is uncovered
    (boolean).
  failed_access_counts_as_reschedule: >-
    Whether a failed-access visit is counted as a customer reschedule toward the free and maximum reschedule
    counts (boolean).
  job_charges_collection: >-
    When job charges are collected: with_contract_final_balance adds the net job charges to the contract's
    balance due (enumeration).
  fee_waiver_limit_per_fee: Times one fee may be waived (count).
