- id: warranty_ext_visit_labor_billing
  base_policy_refs:
  - warranty_agg_claims_per_registration
  - warranty_glass_breakage
  - warranty_proration
  - warranty_service_charges
  - warranty_transfer
  overwrite:
  - base_policy: warranty_service_charges
    superseded_clause: >-
      A visit outside the labor term carries the plan's out-of-term trip charge plus labor at the plan's
      hourly rate for the billable hours, which are the hours on site with the minimum applied and any
      time beyond the minimum rounded up to the billing increment.
    replaced_by: >-
      For the labor on a technician visit this policy prices, and only for that labor, the billable labor
      hours and the labor rate follow the paragraphs below in place of the plan's hourly rate on the hours
      on site with the plan's minimum applied and any time beyond it rounded up to the billing increment;
      the trip charge on such a visit is not set by this policy, and a visit inside the labor term still
      carries no labor charge for the covered repair.
  trigger: state_due
  subject:
  - warranty_charge_assessed
  computes: amount
  target_tool: bill_visit_labor_b6354c72
  params:
    ref_sunday: '2026-01-04'
    saturday_labor_rate: 1.25
    sunday_labor_rate: 1.5
    two_technician_labor_crew: 2.0
    three_technician_labor_crew: 3.0
    six_unit_minimum_hours: 2.0
    three_unit_minimum_hours: 1.5
    lead_safe_full_allowance_hours: 1.0
    lead_safe_glass_allowance_hours: 0.5
  rule: >-
    This policy prices the labor for a completed technician visit on a warranty claim that the warranty
    terms bill labor for, which is a visit outside the labor term, and books it on the warranty charges of
    the registration with its billable labor hours, dated with the date of the visit and tied to the claim
    the visit served. For the labor on a technician visit this policy prices, and only for that labor, the
    billable labor hours and the labor rate follow the paragraphs below in place of the plan's hourly rate
    on the hours on site with the plan's minimum applied and any time beyond it rounded up to the billing
    increment; the trip charge on such a visit is not set by this policy, and a visit inside the labor
    term still carries no labor charge for the covered repair.
    The method hours of a visit are the hours on site with the labor minimum applied: a visit shorter
    than the labor minimum is billed for the minimum, and any time beyond the minimum is rounded up to the
    plan's billing increment. The labor minimum is the plan's minimum billable labor per visit. The billable labor hours of a visit start from its method hours and are booked on the labor charge to one decimal place, and the labor charge is the billable labor hours times the warranty plan's hourly labor rate. The
    labor charge is worked out in this order: the method hours the labor-hours method gives are raised by
    the lead-safe allowance and the sum is multiplied by the labor crew rate, giving the billable labor
    hours, which are booked on the labor charge to one decimal place; the plan's hourly labor rate is
    reduced by the labor program discount; the billable labor hours are multiplied by that rate and then
    by the labor day rate; and the result is rounded half up to the cent once, at the end, an amount
    exactly halfway between two cents going to the higher cent. The lead-safe allowance and the labor
    program discount are zero, and the labor crew rate and the labor day rate are one, unless a paragraph
    below sets them.
    Labor-hours method. A repaired visit on a claim that already carries a labor charge entry continues
    the job: its method hours are its hours on site rounded up to the billing increment with no minimum.
    A visit at which the technician only diagnosed or measured and left the repair for parts on order
    takes the labor minimum as its method hours, whatever the hours on site. Any other visit takes its
    method hours by the minimum-then-increment method above.
    Labor minimum. The units a claim covers are the units approved on its decision. A visit on a claim covering six or more units takes the six-unit labor minimum; a visit
    on a claim covering three to five units takes the three-unit labor minimum; a visit on a claim
    covering fewer units takes the plan's minimum billable labor.
    Lead-safe allowance. When the installation job of the covered openings carried a lead-safe fee, the
    home was worked under lead-safe practices: a visit on a frame and sash, exterior finish or
    installation workmanship claim then adds the full lead-safe allowance in hours, and a visit on a claim
    for any other component adds the glass and hardware lead-safe allowance in hours; a visit to openings
    whose job carried no lead-safe fee adds no allowance.
    Labor crew rate. Labor on openings whose installation job used the Bay and Bow Installation method is
    done by three technicians and takes the three-technician labor crew rate; labor on openings whose job
    used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening Installation
    method is done by two technicians and takes the two-technician labor crew rate; labor on openings
    installed by any other method takes a labor crew rate of one.
    Labor day rate. Labor done on a Sunday takes the Sunday labor rate, labor done on a Saturday takes the
    Saturday labor rate, and labor done on a weekday takes a labor day rate of one.
    Labor program discount. When the contract the registration covers was signed under the military
    discount program, the labor program discount is that contract series' military discount rate; under
    the first-responder program it is the series' first-responder discount rate; under the senior program
    it is the series' senior discount rate; with no discount program there is no labor program discount.
  prerequisite: []
  cross_category:
  - category: install
    as: history
    reads: [variant_name, install_activities.fee_kind]
    note: Decides the labor crew rate from the installation method and the lead-safe allowance from the lead-safe fees booked on the installation job.
  - category: window
    as: branch
    reads: [discount_program, military_discount_pct, first_responder_discount_pct, senior_discount_pct]
    note: Decides the labor program discount for window coverage.
  - category: door
    as: branch
    reads: [discount_program, military_discount_pct, first_responder_discount_pct, senior_discount_pct]
    note: Decides the labor program discount for door coverage.
  compute:
  - claim_id: "LATEST('warranty_claims', 'warranty_claim_id', date_field='created_at')"
  - claim_units: "SUM('warranty_activities', 'units', event_type='warranty_claim_decided', warranty_claim_id=claim_id)"
  - claim_component: "LATEST('warranty_claims', 'component', date_field='created_at')"
  - visit_date: "LATEST('warranty_activities', 'activity_date', date_field='activity_date', event_type='warranty_service_visit', warranty_claim_id=claim_id)"
  - visit_outcome: "LATEST('warranty_activities', 'visit_outcome', date_field='activity_date', event_type='warranty_service_visit', warranty_claim_id=claim_id)"
  - hours_on_site: "LATEST('warranty_activities', 'labor_hours', date_field='activity_date', event_type='warranty_service_visit', warranty_claim_id=claim_id)"
  - prior_labor_entries: "COUNT('warranty_activities', event_type='warranty_charge_assessed', charge_kind='labor_charge', warranty_claim_id=claim_id)"
  - labor_minimum: "K('six_unit_minimum_hours') if claim_units >= 6 else (K('three_unit_minimum_hours') if claim_units >= 3 else P('labor_min_hours'))"
  - method_hours: "(-((-hours_on_site) // P('labor_billing_increment_hours')) * P('labor_billing_increment_hours')) if visit_outcome == 'repaired' and prior_labor_entries >= 1 else (labor_minimum if visit_outcome == 'part_on_order' else labor_minimum + MX(0, -((labor_minimum - hours_on_site) // P('labor_billing_increment_hours')) * P('labor_billing_increment_hours')))"
  - lead_safe_fees: "XCOUNT('install', 'install_activities', install_job_id=F('install_job_id'), fee_kind='lead_safe_fee')"
  - lead_safe_allowance: "K('lead_safe_full_allowance_hours') if lead_safe_fees > 0 and (claim_component == 'frame_sash' or claim_component == 'exterior_finish' or claim_component == 'installation_workmanship') else (K('lead_safe_glass_allowance_hours') if lead_safe_fees > 0 and claim_component != 'frame_sash' and claim_component != 'exterior_finish' and claim_component != 'installation_workmanship' else 0.0)"
  - install_method: "CFIELD('install', 'variant_name', install_job_id=F('install_job_id'))"
  - labor_crew_rate: "K('three_technician_labor_crew') if install_method == 'Bay and Bow Installation' else (K('two_technician_labor_crew') if install_method == 'Full-Frame Installation with Exterior Trim Wrap' or install_method == 'Masonry Opening Installation' else 1.0)"
  - billable_labor_hours: "RND((method_hours + lead_safe_allowance) * labor_crew_rate, 1)"
  - program: "CFIELD('window', 'discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CFIELD('door', 'discount_program', door_contract_id=F('door_contract_id'))"
  - military_rate: "CPARAM('window', 'military_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'military_discount_pct', door_contract_id=F('door_contract_id'))"
  - responder_rate: "CPARAM('window', 'first_responder_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'first_responder_discount_pct', door_contract_id=F('door_contract_id'))"
  - senior_rate: "CPARAM('window', 'senior_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'senior_discount_pct', door_contract_id=F('door_contract_id'))"
  - labor_program_discount: "military_rate if program == 'military' else (responder_rate if program == 'first_responder' else (senior_rate if program == 'senior' else 0.0))"
  - weekday_index: "DAYS(K('ref_sunday'), visit_date) % 7"
  - labor_day_rate: "K('sunday_labor_rate') if weekday_index == 0 else (K('saturday_labor_rate') if weekday_index == 6 else 1.0)"
  - result: "int((billable_labor_hours * P('labor_rate_per_hour') * (1 - labor_program_discount) * labor_day_rate) * 100 + 0.5 + 0.000001) / 100"
  compute_basis:
    claim_id: "This policy prices the labor for a completed technician visit on a warranty claim"
    claim_units: "The units a claim covers are the units approved on its decision."
    claim_component: "a visit on a frame and sash, exterior finish or installation workmanship claim"
    visit_date: "dated with the date of the visit and tied to the claim the visit served"
    visit_outcome: "A visit at which the technician only diagnosed or measured and left the repair for parts on order takes the labor minimum as its method hours, whatever the hours on site."
    hours_on_site: "The method hours of a visit are the hours on site with the labor minimum applied"
    prior_labor_entries: "A repaired visit on a claim that already carries a labor charge entry continues the job"
    labor_minimum: "A visit on a claim covering six or more units takes the six-unit labor minimum; a visit on a claim covering three to five units takes the three-unit labor minimum; a visit on a claim covering fewer units takes the plan's minimum billable labor."
    method_hours: "A repaired visit on a claim that already carries a labor charge entry continues the job: its method hours are its hours on site rounded up to the billing increment with no minimum. A visit at which the technician only diagnosed or measured and left the repair for parts on order takes the labor minimum as its method hours, whatever the hours on site. Any other visit takes its method hours by the minimum-then-increment method above."
    lead_safe_fees: "When the installation job of the covered openings carried a lead-safe fee"
    lead_safe_allowance: "When the installation job of the covered openings carried a lead-safe fee, the home was worked under lead-safe practices: a visit on a frame and sash, exterior finish or installation workmanship claim then adds the full lead-safe allowance in hours, and a visit on a claim for any other component adds the glass and hardware lead-safe allowance in hours; a visit to openings whose job carried no lead-safe fee adds no allowance."
    install_method: "Labor on openings whose installation job used the Bay and Bow Installation method"
    labor_crew_rate: "Labor on openings whose installation job used the Bay and Bow Installation method is done by three technicians and takes the three-technician labor crew rate; labor on openings whose job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening Installation method is done by two technicians and takes the two-technician labor crew rate; labor on openings installed by any other method takes a labor crew rate of one."
    billable_labor_hours: "the method hours the labor-hours method gives are raised by the lead-safe allowance and the sum is multiplied by the labor crew rate, giving the billable labor hours, which are booked on the labor charge to one decimal place"
    program: "When the contract the registration covers was signed under the military discount program"
    military_rate: "the labor program discount is that contract series' military discount rate"
    responder_rate: "under the first-responder program it is the series' first-responder discount rate"
    senior_rate: "under the senior program it is the series' senior discount rate"
    labor_program_discount: "When the contract the registration covers was signed under the military discount program, the labor program discount is that contract series' military discount rate; under the first-responder program it is the series' first-responder discount rate; under the senior program it is the series' senior discount rate; with no discount program there is no labor program discount."
    weekday_index: "Labor done on a Sunday takes the Sunday labor rate, labor done on a Saturday takes the Saturday labor rate, and labor done on a weekday takes a labor day rate of one."
    labor_day_rate: "Labor done on a Sunday takes the Sunday labor rate, labor done on a Saturday takes the Saturday labor rate, and labor done on a weekday takes a labor day rate of one."
    result: "the plan's hourly labor rate is reduced by the labor program discount; the billable labor hours are multiplied by that rate and then by the labor day rate; and the result is rounded half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent."
  factors:
  - id: labor_hours_method
    effect: method
    decides: method_hours
    bindings: [visit_outcome, hours_on_site, prior_labor_entries, method_hours]
    ladder:
    - when: the visit was a repair on a claim that already carries a labor charge entry
      method: the method hours are the hours on site rounded up to the billing increment with no minimum
    - when: the technician only diagnosed or measured and left the repair for parts on order
      method: the method hours are the labor minimum whatever the hours on site
    - when: otherwise
      method: the method hours are the hours on site with the labor minimum applied and any time beyond it rounded up to the billing increment
    baseline:
      method_hours: "labor_minimum + MX(0, -((labor_minimum - hours_on_site) // P('labor_billing_increment_hours')) * P('labor_billing_increment_hours'))"
    evidence: [history]
    cross_difficulty: null
  - id: unit_count_minimum
    effect: parameter
    decides: labor_minimum
    bindings: [claim_units, labor_minimum]
    ladder:
    - when: the claim covers six or more units
      value: K('six_unit_minimum_hours')
    - when: the claim covers three to five units
      value: K('three_unit_minimum_hours')
    - when: otherwise
      value: P('labor_min_hours')
    baseline:
      labor_minimum: "P('labor_min_hours')"
    evidence: [history]
    cross_difficulty: null
  - id: lead_safe_hours
    effect: parameter
    decides: lead_safe_allowance
    bindings: [claim_component, lead_safe_fees, lead_safe_allowance]
    ladder:
    - when: the installation job carried a lead-safe fee and the claim is on frame and sash, exterior finish or installation workmanship
      value: K('lead_safe_full_allowance_hours')
    - when: the installation job carried a lead-safe fee and the claim is on any other component
      value: K('lead_safe_glass_allowance_hours')
    - when: otherwise
      value: '0.0'
    baseline:
      lead_safe_allowance: "0.0"
    evidence: [cross_category, history]
