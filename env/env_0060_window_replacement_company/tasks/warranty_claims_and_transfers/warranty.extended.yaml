- id: warranty_ext_prorated_share_acceptance
  base_policy_refs:
  - warranty_agg_claims_per_registration
  - warranty_glass_breakage
  - warranty_proration
  - warranty_service_charges
  - warranty_transfer
  overwrite:
  - base_policy: warranty_proration
    superseded_clause: >-
      For an insulated glass claim approved with proration, the customer pays the share of the published
      sealed-unit replacement charge that the plan's proration ladder sets for the full years since the
      coverage start date (warranty_msr_full_years), times the units approved; Ridgeline pays the rest and
      the labor follows the labor term as for any other approval.
    replaced_by: >-
      For an insulated glass claim approved with proration that this policy prices, and only for such a
      claim, the owner pays the share the plan's proration ladder sets for the full years since the
      coverage start date of the replacement charge per sealed unit set below, times the units approved,
      adjusted by the paragraphs below; Ridgeline pays the rest and the labor follows the labor term as
      for any other approval.
  - base_policy: warranty_proration
    superseded_clause: The share is booked once as prorated_parts_share on the decision date.
    replaced_by: >-
      The share is booked once as a prorated parts share on the date the owner accepts the prorated
      replacement, not on the decision date, and an owner who has not accepted it owes no share.
  trigger: on_request
  subject:
  - warranty_charge_assessed
  computes: share_amount
  target_tool: accept_prorated_glass_share_5fbbc0c6
  params:
    limited_step_years: 5
    limited_plus_step_years: 10
    lifetime_limited_step_years: 10
    half_share: 0.5
    quarter_share: 0.25
    specialty_unit_charge: 395.0
    impact_unit_charge: 480.0
    triple_pane_unit_addon: 95.0
    premium_low_e_unit_addon: 40.0
    laminated_unit_addon: 70.0
    grilles_unit_addon: 30.0
    three_unit_volume_rate: 0.05
    six_unit_volume_rate: 0.1
    full_credit_days: 30
    trip_credit_days: 60
  rule: >-
    This policy prices the owner's share when the owner accepts the prorated replacement of sealed glass
    units approved with proration on a seal-failure claim, and books it on the warranty charges of the
    registration with the units accepted. For an insulated glass claim approved with proration that this
    policy prices, and only for such a claim, the owner pays the share the plan's proration ladder sets
    for the full years since the coverage start date of the replacement charge per sealed unit set below,
    times the units approved, adjusted by the paragraphs below; Ridgeline pays the rest and the labor
    follows the labor term as for any other approval. The share is booked once as a prorated parts share
    on the date the owner accepts the prorated replacement, not on the decision date, and an owner who
    has not accepted it owes no share. A share of zero books nothing.
    The proration share is the share the plan's proration ladder sets for the full years from the
    coverage start date to the claim filing date, counting a year only once its anniversary has been reached, an anniversary that falls on a day the month lacks falling back to the last day of that month: one half for the Ridgeline Limited Warranty once five full years have been reached and for the Ridgeline Limited Plus Warranty once ten full years have been reached, one quarter for the Ridgeline Lifetime Limited Warranty once ten full years have been reached, and nothing in any other case. The replacement charge per sealed unit is the published sealed-unit
    replacement charge. The owner's share is the proration share times the replacement charge per sealed
    unit times the units approved on the claim's decision. The owner's share of a prorated replacement is
    fixed only after the records carry a labor charge entry for every technician visit on the claim that
    the warranty terms bill labor for. The owner's share is worked out in this order: the replacement
    charge per sealed unit is the glass build charge plus the insulating upgrade and the glazing upgrade;
    the proration share of it times the units approved gives the gross share; the gross share is reduced
    by the volume rate and the result is then reduced by the owner discount; the visit credit is deducted
    from what remains, never below zero; and the share is rounded half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent.
    The glass build charge is the published sealed-unit replacement charge, and the upgrades, the volume
    rate, the owner discount and the visit credit are zero, unless a paragraph below sets them.
    Glass build charge. Sealed units built by the factory as an Impact-Rated Build take the impact
    sealed-unit charge; units built as a Specialty Glass Build or a Specialty Shape Build take the
    specialty sealed-unit charge; units of any other build class take the published sealed-unit
    replacement charge.
    Insulating upgrade. When the window contract the registration covers carries triple-pane change
    orders covering every opening on the contract, each sealed unit adds the triple-pane unit add-on; when
    it instead carries premium Low-E change orders covering every opening, each unit adds the premium
    Low-E unit add-on; otherwise there is no insulating upgrade.
    Glazing upgrade. When the window contract carries laminated glass change orders covering every
    opening, each sealed unit adds the laminated unit add-on; when it carries grilles-between-glass change
    orders covering every opening and laminated glass on fewer than every opening, each unit adds the
    grilles unit add-on; otherwise there is no glazing upgrade. Change orders covering only some openings
    never count, because the replaced units cannot be told apart.
    Volume rate. Six or more units approved take the six-unit volume rate; three to five units approved
    take the three-unit volume rate; fewer units take no volume rate.
    A CareLine plan in this policy is any plan of the CareLine Service Plans other than the On-Call Service Account.
    Owner discount. For an owner who holds an active CareLine plan whose waiting period had ended by the
    acceptance date, the owner discount is that plan's parts discount; for any other owner whose covered
    contract was signed under a discount program, it is that contract series' rate for the program; for
    every other owner there is no owner discount.
    Visit credit. When the owner accepts no more than the full-credit window in days after the decision
    date, the trip and labor charges booked on the claim's visits are credited; when the owner accepts
    later but no more than the trip-credit window in days after the decision date, only the trip charges
    booked on the claim's visits are credited; an owner who accepts later receives no visit credit.
    Charges on other claims are never credited.
  prerequisite:
  - problem: warranty_ext_visit_labor_billing
    kind: value_input
    gate: visit_credit
    form: state
    policy_source: >-
      The owner's share of a prorated replacement is fixed only after the records carry a labor charge
      entry for every technician visit on the claim that the warranty terms bill labor for.
    condition: >-
      Every technician visit on the claim made outside the labor term has a labor charge entry on the claim
      dated with the date of that visit.
    resolved_by: bill_visit_labor_b6354c72
    effect: >-
      Once the labor charge entry of the claim's visit stands, the visit credit includes that labor amount
      when the owner accepts within the full-credit window, and the owner's share falls by that amount,
      never below zero.
  cross_category:
  - category: order
    as: branch
    reads: [variant_name]
    note: Decides the glass build charge from the build class of the factory order that built the covered units.
  - category: window
    as: history
    reads: [opening_count, discount_program, military_discount_pct, first_responder_discount_pct, senior_discount_pct, window_transactions.change_kind, window_transactions.openings_affected]
    note: Decides the insulating and glazing upgrades from the contract's change orders and the owner discount from its discount program.
  - category: door
    as: branch
    reads: [discount_program, military_discount_pct, first_responder_discount_pct, senior_discount_pct]
    note: Decides the owner discount for door coverage from the door contract's discount program.
  - category: service
    as: branch
    reads: [status, variant_name, enrolled_date, waiting_period_days, parts_discount_pct]
    note: Decides the owner discount from the owner's active CareLine plan and its parts discount.
  compute:
  - claim_id: "LATEST('warranty_claims', 'warranty_claim_id', date_field='created_at')"
  - filing_date: "LATEST('warranty_claims', 'created_at', date_field='created_at')"
  - decision_date: "LATEST('warranty_activities', 'activity_date', date_field='activity_date', event_type='warranty_claim_decided', warranty_claim_id=claim_id, claim_decision='approved_with_proration')"
  - units_approved: "LATEST('warranty_activities', 'units', date_field='activity_date', event_type='warranty_claim_decided', warranty_claim_id=claim_id, claim_decision='approved_with_proration')"
  - start_ordinal: "DAYS('1600-03-01', F('coverage_start_date'))"
  - start_day_of_era: "start_ordinal - (start_ordinal // 146097) * 146097"
  - start_year_of_era: "(start_day_of_era - start_day_of_era // 1460 + start_day_of_era // 36524 - start_day_of_era // 146096) // 365"
  - start_day_of_year: "start_day_of_era - (365 * start_year_of_era + start_year_of_era // 4 - start_year_of_era // 100)"
  - start_month_index: "(5 * start_day_of_year + 2) // 153"
  - start_day: "start_day_of_year - (153 * start_month_index + 2) // 5 + 1"
  - filing_ordinal: "DAYS('1600-03-01', filing_date)"
  - filing_day_of_era: "filing_ordinal - (filing_ordinal // 146097) * 146097"
  - filing_year_of_era: "(filing_day_of_era - filing_day_of_era // 1460 + filing_day_of_era // 36524 - filing_day_of_era // 146096) // 365"
  - filing_day_of_year: "filing_day_of_era - (365 * filing_year_of_era + filing_year_of_era // 4 - filing_year_of_era // 100)"
  - filing_month_index: "(5 * filing_day_of_year + 2) // 153"
  - filing_day: "filing_day_of_year - (153 * filing_month_index + 2) // 5 + 1"
  - filing_month: "filing_month_index + 3 if filing_month_index < 10 else filing_month_index - 9"
  - filing_year: "1600 + filing_year_of_era + (filing_ordinal // 146097) * 400 + (1 if filing_month <= 2 else 0)"
  - filing_month_days: "(30 if filing_month == 4 or filing_month == 6 or filing_month == 9 or filing_month == 11 else 31) if filing_month != 2 else (29 if (filing_year % 4 == 0 and filing_year % 100 != 0) or filing_year % 400 == 0 else 28)"
  - full_years: "(MONTHS(F('coverage_start_date'), filing_date) + (1 if filing_day < start_day and filing_day == filing_month_days else 0)) // 12"
  - proration_share: "K('half_share') if (F('variant_name') == 'Ridgeline Limited Warranty' and full_years >= K('limited_step_years')) or (F('variant_name') == 'Ridgeline Limited Plus Warranty' and full_years >= K('limited_plus_step_years')) else (K('quarter_share') if F('variant_name') == 'Ridgeline Lifetime Limited Warranty' and full_years >= K('lifetime_limited_step_years') else 0.0)"
  - build_class: "CFIELD('order', 'variant_name', window_contract_id=F('window_contract_id'), door_contract_id=F('door_contract_id'))"
  - glass_build_charge: "K('impact_unit_charge') if build_class == 'Impact-Rated Build' else (K('specialty_unit_charge') if build_class == 'Specialty Glass Build' or build_class == 'Specialty Shape Build' else P('sealed_unit_replacement_charge'))"
  - contract_openings: "CFIELD('window', 'opening_count', window_contract_id=F('window_contract_id'))"
  - triple_pane_openings: "XSUM('window', 'window_transactions', 'openings_affected', window_contract_id=F('window_contract_id'), event_type='window_change_order', change_kind='triple_pane')"
  - low_e_openings: "XSUM('window', 'window_transactions', 'openings_affected', window_contract_id=F('window_contract_id'), event_type='window_change_order', change_kind='premium_low_e')"
  - insulating_upgrade: "K('triple_pane_unit_addon') if contract_openings != None and triple_pane_openings >= contract_openings else (K('premium_low_e_unit_addon') if contract_openings != None and triple_pane_openings < contract_openings and low_e_openings >= contract_openings else 0.0)"
  - laminated_openings: "XSUM('window', 'window_transactions', 'openings_affected', window_contract_id=F('window_contract_id'), event_type='window_change_order', change_kind='laminated_glass')"
  - grilles_openings: "XSUM('window', 'window_transactions', 'openings_affected', window_contract_id=F('window_contract_id'), event_type='window_change_order', change_kind='grilles_between_glass')"
  - glazing_upgrade: "K('laminated_unit_addon') if contract_openings != None and laminated_openings >= contract_openings else (K('grilles_unit_addon') if contract_openings != None and laminated_openings < contract_openings and grilles_openings >= contract_openings else 0.0)"
  - volume_rate: "K('six_unit_volume_rate') if units_approved >= 6 else (K('three_unit_volume_rate') if units_approved >= 3 else 0.0)"
  - plan_name: "CFIELD('service', 'variant_name', status='active')"
  - member_ready: "plan_name != None and plan_name != 'On-Call Service Account' and DAYS(CFIELD('service', 'enrolled_date', status='active'), NOW) > CPARAM('service', 'waiting_period_days', status='active')"
  - program: "CFIELD('window', 'discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CFIELD('door', 'discount_program', door_contract_id=F('door_contract_id'))"
  - program_rate: "(CPARAM('window', 'military_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'military_discount_pct', door_contract_id=F('door_contract_id'))) if program == 'military' else ((CPARAM('window', 'first_responder_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'first_responder_discount_pct', door_contract_id=F('door_contract_id'))) if program == 'first_responder' else ((CPARAM('window', 'senior_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'senior_discount_pct', door_contract_id=F('door_contract_id'))) if program == 'senior' else 0.0))"
  - owner_discount: "CPARAM('service', 'parts_discount_pct', status='active') if member_ready else (program_rate if program != None and program != 'none' else 0.0)"
  - days_since_decision: "DAYS(decision_date, NOW)"
  - trip_on_claim: "SUM('warranty_activities', 'amount', event_type='warranty_charge_assessed', charge_kind='trip_charge', warranty_claim_id=claim_id)"
  - labor_on_claim: "SUM('warranty_activities', 'amount', event_type='warranty_charge_assessed', charge_kind='labor_charge', warranty_claim_id=claim_id)"
  - visit_credit: "trip_on_claim + labor_on_claim if days_since_decision <= K('full_credit_days') else (trip_on_claim if days_since_decision <= K('trip_credit_days') else 0.0)"
  - gross_share: "proration_share * (glass_build_charge + insulating_upgrade + glazing_upgrade) * units_approved"
  - result: "int((MX(0, gross_share * (1 - volume_rate) * (1 - owner_discount) - visit_credit)) * 100 + 0.5 + 0.000001) / 100"
  compute_basis:
    claim_id: "This policy prices the owner's share when the owner accepts the prorated replacement of sealed glass units approved with proration on a seal-failure claim"
    filing_date: "for the full years from the coverage start date to the claim filing date"
    decision_date: "after the decision date"
    units_approved: "times the units approved on the claim's decision"
    full_years: "for the full years from the coverage start date to the claim filing date, counting a year only once its anniversary has been reached, an anniversary that falls on a day the month lacks falling back to the last day of that month"
    start_ordinal: "counting a year only once its anniversary has been reached, an anniversary that falls on a day the month lacks falling back to the last day of that month"
    filing_ordinal: "counting a year only once its anniversary has been reached, an anniversary that falls on a day the month lacks falling back to the last day of that month"
    proration_share: "one half for the Ridgeline Limited Warranty once five full years have been reached and for the Ridgeline Limited Plus Warranty once ten full years have been reached, one quarter for the Ridgeline Lifetime Limited Warranty once ten full years have been reached, and nothing in any other case"
    build_class: "Sealed units built by the factory as an Impact-Rated Build take the impact sealed-unit charge"
    glass_build_charge: "Sealed units built by the factory as an Impact-Rated Build take the impact sealed-unit charge; units built as a Specialty Glass Build or a Specialty Shape Build take the specialty sealed-unit charge; units of any other build class take the published sealed-unit replacement charge."
    contract_openings: "covering every opening on the contract"
    triple_pane_openings: "When the window contract the registration covers carries triple-pane change orders covering every opening on the contract"
    low_e_openings: "when it instead carries premium Low-E change orders covering every opening"
    insulating_upgrade: "When the window contract the registration covers carries triple-pane change orders covering every opening on the contract, each sealed unit adds the triple-pane unit add-on; when it instead carries premium Low-E change orders covering every opening, each unit adds the premium Low-E unit add-on; otherwise there is no insulating upgrade."
    laminated_openings: "When the window contract carries laminated glass change orders covering every opening"
    grilles_openings: "when it carries grilles-between-glass change orders covering every opening and laminated glass on fewer than every opening"
    glazing_upgrade: "When the window contract carries laminated glass change orders covering every opening, each sealed unit adds the laminated unit add-on; when it carries grilles-between-glass change orders covering every opening and laminated glass on fewer than every opening, each unit adds the grilles unit add-on; otherwise there is no glazing upgrade."
    volume_rate: "Six or more units approved take the six-unit volume rate; three to five units approved take the three-unit volume rate; fewer units take no volume rate."
    plan_name: "For an owner who holds an active CareLine plan whose waiting period had ended by the acceptance date"
    member_ready: "For an owner who holds an active CareLine plan whose waiting period had ended by the acceptance date"
    program: "for any other owner whose covered contract was signed under a discount program"
    program_rate: "it is that contract series' rate for the program"
    owner_discount: "For an owner who holds an active CareLine plan whose waiting period had ended by the acceptance date, the owner discount is that plan's parts discount; for any other owner whose covered contract was signed under a discount program, it is that contract series' rate for the program; for every other owner there is no owner discount."
    days_since_decision: "When the owner accepts no more than the full-credit window in days after the decision date"
    trip_on_claim: "only the trip charges booked on the claim's visits are credited"
    labor_on_claim: "the trip and labor charges booked on the claim's visits are credited"
    visit_credit: "When the owner accepts no more than the full-credit window in days after the decision date, the trip and labor charges booked on the claim's visits are credited; when the owner accepts later but no more than the trip-credit window in days after the decision date, only the trip charges booked on the claim's visits are credited; an owner who accepts later receives no visit credit."
    gross_share: "the proration share of it times the units approved gives the gross share"
    result: "the gross share is reduced by the volume rate and the result is then reduced by the owner discount; the visit credit is deducted from what remains, never below zero; and the share is rounded half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent."
  factors:
  - id: glass_build_charge_tier
    effect: parameter
    decides: glass_build_charge
    bindings: [build_class, glass_build_charge]
    ladder:
    - when: the sealed units were built as an Impact-Rated Build
      value: K('impact_unit_charge')
    - when: the sealed units were built as a Specialty Glass Build or a Specialty Shape Build
      value: K('specialty_unit_charge')
    - when: otherwise
      value: P('sealed_unit_replacement_charge')
    baseline:
      glass_build_charge: "P('sealed_unit_replacement_charge')"
    evidence: [cross_category]
    cross_difficulty: order
  - id: insulating_upgrade_tier
    effect: parameter
    decides: insulating_upgrade
    bindings: [contract_openings, triple_pane_openings, low_e_openings, insulating_upgrade]
    ladder:
    - when: the window contract carries triple-pane change orders covering every opening
      value: K('triple_pane_unit_addon')
    - when: the window contract carries premium Low-E change orders covering every opening and triple pane on fewer than every opening
      value: K('premium_low_e_unit_addon')
    - when: otherwise
      value: '0.0'
    baseline:
      insulating_upgrade: "0.0"
    evidence: [cross_category, history]
    cross_difficulty: window
  - id: glazing_upgrade_tier
    effect: parameter
    decides: glazing_upgrade
    bindings: [laminated_openings, grilles_openings, glazing_upgrade]
    ladder:
    - when: the window contract carries laminated glass change orders covering every opening
      value: K('laminated_unit_addon')
    - when: the window contract carries grilles-between-glass change orders covering every opening and laminated glass on fewer than every opening
      value: K('grilles_unit_addon')
    - when: otherwise
      value: '0.0'
    baseline:
      glazing_upgrade: "0.0"
    evidence: [cross_category, history]
    cross_difficulty: window
  - id: replacement_volume_tier
    effect: parameter
    decides: volume_rate
    bindings: [units_approved, volume_rate]
    ladder:
    - when: six or more units are approved
      value: K('six_unit_volume_rate')
    - when: three to five units are approved
      value: K('three_unit_volume_rate')
    - when: otherwise
      value: '0.0'
    baseline:
      volume_rate: "0.0"
    evidence: [history]
    cross_difficulty: null
  - id: owner_discount_tier
    effect: parameter
    decides: owner_discount
    bindings: [plan_name, member_ready, program, program_rate, owner_discount]
    ladder:
    - when: the owner holds an active CareLine plan whose waiting period had ended by the acceptance date
      value: the CareLine plan's parts discount
    - when: the owner holds no such plan and the covered contract was signed under a discount program
      value: the contract series' rate for that program
    - when: otherwise
      value: '0.0'
    baseline:
      owner_discount: "0.0"
    evidence: [cross_category, date]
    cross_difficulty: service
  - id: inspection_credit_window
    effect: method
    decides: visit_credit
    bindings: [decision_date, days_since_decision, trip_on_claim, labor_on_claim, visit_credit]
    ladder:
    - when: the owner accepts no more than the full-credit window in days after the decision date
      method: the trip and labor charges booked on the claim's visits are deducted
    - when: the owner accepts later but within the trip-credit window
      method: only the trip charges booked on the claim's visits are deducted
    - when: otherwise
      method: nothing is deducted
    baseline:
      visit_credit: "0.0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The proration share is the share the plan's proration ladder sets for the full years from the
      coverage start date to the claim filing date, counting a year only once its anniversary has been reached, an anniversary that falls on a day the month lacks falling back to the last day of that month: one half for the Ridgeline Limited Warranty once five full years have been reached and for the Ridgeline Limited Plus Warranty once ten full years have been reached, one quarter for the Ridgeline Lifetime Limited Warranty once ten full years have been reached, and nothing in any other case. The replacement charge per sealed unit is the published
      sealed-unit replacement charge. The owner's share is the proration share times the replacement
      charge per sealed unit times the units approved on the claim's decision. A share of zero books
      nothing.
    params: [sealed_unit_replacement_charge, half_share, quarter_share, limited_step_years, limited_plus_step_years, lifetime_limited_step_years]
  inputs:
    history:
    - {table: warranty_activities, aggregate: latest, field: units, filters: {event_type: warranty_claim_decided, claim_decision: approved_with_proration}}
    - {table: warranty_activities, aggregate: sum, field: amount, filters: {event_type: warranty_charge_assessed, charge_kind: labor_charge}}
    - {table: warranty_activities, aggregate: sum, field: amount, filters: {event_type: warranty_charge_assessed, charge_kind: trip_charge}}
    - {category: window, table: window_transactions, aggregate: sum, field: openings_affected, filters: {event_type: window_change_order}}
    cross_category: [order, window, door, service]
