- id: warranty_transfer
  subject:
  - warranty_transfer_requested
  - warranty_transfer_withdrawn
  - warranty_transfer_completed
  - warranty_registered
  - warranty_charge_assessed
  rule: >-
    When the registered owner sells the home, the coverage may pass to the buyer if the plan allows it.
    A registration can be transferred only when its plan is transferable and it was preceded by fewer
    transfers than the plan allows. The seller requests the transfer, giving the buyer's name and email
    and the home sale closing date from the closing documents. A transfer is accepted only when it is
    requested no later than the transfer window after the home sale closing date. Calendar days are counted
    from the day after the home sale closing date, and a request on the last day of the window is accepted.
    The plan's transfer fee is charged to the seller on the request date. On completion the seller's registration
    becomes transferred and the buyer, under the buyer's own customer profile (opened from the buyer's
    name and email when the buyer has none), receives a new registration under the same plan with the
    original coverage start date, one more prior transfer, and every product term capped at the plan's
    transferred product term and the labor and workmanship terms capped at the plan's transferred labor
    term, all counted from the original coverage start date. A request that misses the window or exceeds
    the transfer limit is not accepted, and a pending transfer the seller withdraws returns the registration
    to active with its fee reversed.
  eligibility:
  - id: transferable_plan
    applies_to:
    - warranty_transfer_requested
    kind: authorization
    condition: >-
      A registration can be transferred only when its plan is transferable and it was preceded by fewer
      transfers than the plan allows.
    evidence_fields:
    - warranty_registrations.warranty_registration_id
    - warranty_registrations.variant_name
    - warranty_registrations.transfer_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_registrations.warranty_registration_id
      action_bindings:
        warranty_registrations.warranty_registration_id: warranty_registration_id
  - id: transfer_window
    applies_to:
    - warranty_transfer_requested
    kind: time
    condition: >-
      A transfer is accepted only when it is requested no later than the transfer window after the home
      sale closing date.
    evidence_fields:
    - warranty_transfer_requests.warranty_transfer_request_id
    - warranty_transfer_requests.home_sale_closing_date
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - - warranty_transfer_requests.warranty_transfer_request_id
      action_bindings:
        warranty_transfer_requests.warranty_transfer_request_id: warranty_transfer_request_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the home sale closing date
      anchor_source: warranty_transfer_requests.home_sale_closing_date
      relation: not_after
      duration_source: variants.transfer_request_window_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the home sale closing date, and a request on the
        last day of the window is accepted.
      boundary: inclusive
  params:
    per_tier:
      Ridgeline Limited Warranty:
        transferable: =transferable
        max_transfers: =transfer_max_count
        window: =transfer_request_window_days
        fee: =transfer_fee
        product_cap: =transferred_product_term_years
        labor_cap: =transferred_labor_term_years
      Ridgeline Limited Plus Warranty:
        transferable: =transferable
        max_transfers: =transfer_max_count
        window: =transfer_request_window_days
        fee: =transfer_fee
        product_cap: =transferred_product_term_years
        labor_cap: =transferred_labor_term_years
      Ridgeline Lifetime Limited Warranty:
        transferable: =transferable
        max_transfers: =transfer_max_count
        window: =transfer_request_window_days
        fee: =transfer_fee
        product_cap: =transferred_product_term_years
        labor_cap: =transferred_labor_term_years
      Ridgeline Lifetime Plus Warranty:
        transferable: =transferable
        max_transfers: =transfer_max_count
        window: =transfer_request_window_days
        fee: =transfer_fee
        product_cap: =transferred_product_term_years
        labor_cap: =transferred_labor_term_years
      Ridgeline Lifetime Premier Warranty:
        transferable: =transferable
