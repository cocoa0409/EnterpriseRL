  - id: technician_crew
    effect: parameter
    decides: labor_crew_rate
    bindings: [install_method, labor_crew_rate]
    ladder:
    - when: the installation job used the Bay and Bow Installation method
      value: K('three_technician_labor_crew')
    - when: the installation job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening Installation method
      value: K('two_technician_labor_crew')
    - when: otherwise
