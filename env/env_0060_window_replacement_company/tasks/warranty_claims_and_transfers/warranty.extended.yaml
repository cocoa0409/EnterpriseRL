- id: warranty_charge_reversals
  subject:
  - warranty_charge_reversed
  rule: >-
    A warranty charge is reversed in full, by one reversal that names it as its source, when the records
    show it was not owed under these terms: a no-defect trip charge on a claim later approved for the
    same component after a return visit, a no-show fee on a visit Ridgeline itself rescheduled, a fee
    charged twice for the same visit, or a transfer fee on a transfer the seller withdrew before completion.
    A warranty charge is reversed at most once. Charges correctly assessed are never reversed as a courtesy
    by support.
  eligibility:
  - id: reverse_once
    applies_to:
    - warranty_charge_reversed
    kind: dedup
    condition: A warranty charge is reversed at most once.
    evidence_fields:
    - warranty_activities.source_warranty_activity_id
    - warranty_activities.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_activities.source_warranty_activity_id
      action_bindings:
        warranty_activities.source_warranty_activity_id: source_warranty_activity_id
    dedup_contract:
      table: warranty_activities
      mode: separate_record
      object_bindings:
        source_warranty_activity_id: source_warranty_activity_id
      duplicate_filters:
        event_type:
        - warranty_charge_reversed
      distinct_fields:
      - activity_date
- id: warranty_void_and_expiry
  subject:
  - warranty_voided
  - warranty_expired
  rule: >-
    A registration is voided when a void cause is recorded for the covered units: the units were removed
    from the home, the opening was structurally altered by others, or the home was destroyed. A registration
    is voided only on a recorded void cause, never on a customer's statement alone. Aftermarket glass
    film is an exclusion for glass claims, not a void cause. Voided and expired registrations accept no
    further claims, and charges already owed on them stay owed.
  eligibility:
  - id: recorded_void_cause
    applies_to:
    - warranty_voided
    kind: authorization
    condition: >-
      A registration is voided only on a recorded void cause, never on a customer's statement alone.
    evidence_fields:
    - warranty_registrations.warranty_registration_id
    - warranty_registrations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - warranty_registrations.warranty_registration_id
      action_bindings:
        warranty_registrations.warranty_registration_id: warranty_registration_id
  params:
    causes: =void_causes
extended_policies:
- id: warranty_ext_missed_visit_fee
  base_policy_refs:
  - warranty_agg_claims_per_registration
  - warranty_glass_breakage
  - warranty_proration
  - warranty_service_charges
  - warranty_transfer
  overwrite:
  - base_policy: warranty_service_charges
    superseded_clause: >-
      A visit where nobody gives access within the wait time is a no-show; the no-shows of a registration
      up to the plan's free count (warranty_msr_no_shows) carry no fee and each later one carries the
      plan's no-show fee.
    replaced_by: >-
      For a missed technician visit this policy prices, and only for such a visit, which missed visits
      are counted against the plan's free no-show count and what fee a chargeable missed visit carries
      follow the paragraphs below in place of the registration's lifetime count and the plan's flat
      no-show fee; a visit where nobody gives access within the wait time is still the no-show, and the
      plan's free no-show count still applies.
  trigger: state_due
  subject:
  - warranty_charge_assessed
  computes: amount
  target_tool: bill_missed_visit_fee_18fefa1f
  params:
    ref_sunday: '2026-01-04'
    member_window_months: 12
    service_account_window_months: 24
    second_repeat_rate: 1.25
    third_repeat_rate: 1.5
    saturday_rate: 1.25
    sunday_rate: 1.5
    two_technician_crew: 2.0
    three_technician_crew: 3.0
  rule: >-
    This policy prices the no-show fee for a missed technician visit booked on a warranty claim and books
    it on the warranty charges of the registration, dated with the date of the missed visit and tied to
    the claim the visit was booked for. For a missed technician visit this policy prices, and only for
    such a visit, which missed visits are counted against the plan's free no-show count and what fee a
    chargeable missed visit carries follow the paragraphs below in place of the registration's lifetime
    count and the plan's flat no-show fee; a visit where nobody gives access within the wait time is
    still the no-show, and the plan's free no-show count still applies.
    The missed visits counted for a missed visit are all the no-show visits recorded on the
    registration, the missed visit being billed included. The no-show fee of a chargeable missed visit is the warranty plan's no-show fee, charged once for
    that visit. A missed visit is chargeable only when the missed visits counted are more than the plan's free no-show count; a missed visit that is not chargeable carries no fee and nothing is booked. The fee is the no-show fee the fee basis selects, multiplied by the
    repeat rate, the day rate and the crew rate, each of which is one unless a paragraph below sets it;
    the product is rounded half up to the cent once, at the end, an amount exactly halfway between two
    cents going to the higher cent. A chargeable missed visit whose fee works out to zero books nothing and owes no fee entry.
    A CareLine plan in this policy is any plan of the CareLine Service Plans other than the On-Call Service Account.
    Counting window. For an owner who holds an active CareLine plan whose waiting period had ended by the
    date of the missed visit, the missed visits counted are only the no-show visits on the registration
    dated less than the member counting window in whole months before the date the fee is billed; for an
    owner who holds an active On-Call Service Account, they are only the no-show visits dated less than
    the service-account counting window in whole months before the date the fee is billed; for every
    other owner they are all the no-show visits of the registration.
    Repeat rate. The missed visits counted minus the plan's free no-show count gives the place of the
    missed visit among the chargeable ones: the third or a later chargeable missed visit takes the third
    repeat rate, the second chargeable missed visit takes the second repeat rate, and the first
    chargeable missed visit takes a repeat rate of one.
    Fee basis. For an owner who holds an active CareLine plan whose waiting period had ended by the date of the missed visit, the fee is the lower of the CareLine plan's own no-show fee and the warranty plan's no-show fee; for an owner who holds an active On-Call Service Account, the fee is the On-Call Service Account's no-show fee; for every other owner it is the warranty plan's no-show fee.
    Day rate. A missed visit booked on a Sunday takes the Sunday rate, a missed visit booked on a Saturday
    takes the Saturday rate, and a missed visit booked on a weekday takes a day rate of one.
    Crew rate. A missed visit to openings whose installation job used the Bay and Bow Installation method
    was booked for three technicians and takes the three-technician crew rate; a missed visit to openings
    whose installation job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry
    Opening Installation method was booked for two technicians and takes the two-technician crew rate;
    a missed visit to openings installed by any other method takes a crew rate of one.
  prerequisite: []
  cross_category:
  - category: service
    as: branch
    reads: [status, variant_name, enrolled_date, no_show_fee, waiting_period_days]
    note: Decides the counting window and the fee basis from the owner's active service plan, its enrolled date and its tier parameters.
  - category: install
    as: branch
    reads: [variant_name]
    note: Decides the crew rate from the installation method of the job that installed the covered units.
  compute:
  - claim_id: "LATEST('warranty_claims', 'warranty_claim_id', date_field='created_at')"
  - missed_date: "LATEST('warranty_activities', 'activity_date', date_field='activity_date', event_type='warranty_service_visit', warranty_claim_id=claim_id, visit_outcome='customer_no_show')"
  - plan_name: "CFIELD('service', 'variant_name', status='active')"
  - plan_enrolled: "CFIELD('service', 'enrolled_date', status='active')"
  - plan_wait: "CPARAM('service', 'waiting_period_days', status='active')"
  - member_ready: "plan_name != None and plan_name != 'On-Call Service Account' and DAYS(plan_enrolled, missed_date) > plan_wait"
  - account_holder: "plan_name == 'On-Call Service Account'"
  - lifetime_missed: "COUNT('warranty_activities', event_type='warranty_service_visit', visit_outcome='customer_no_show')"
  - member_window_missed: "COUNT('warranty_activities', within_months=K('member_window_months'), date_field='activity_date', event_type='warranty_service_visit', visit_outcome='customer_no_show')"
  - account_window_missed: "COUNT('warranty_activities', within_months=K('service_account_window_months'), date_field='activity_date', event_type='warranty_service_visit', visit_outcome='customer_no_show')"
  - missed_counted: "member_window_missed if member_ready else (account_window_missed if account_holder else lifetime_missed)"
  - chargeable_place: "missed_counted - P('free_no_show_count')"
  - repeat_rate: "K('third_repeat_rate') if chargeable_place >= 3 else (K('second_repeat_rate') if chargeable_place == 2 else 1.0)"
  - schedule_fee: "MN(CPARAM('service', 'no_show_fee', status='active'), P('no_show_fee')) if member_ready else (CPARAM('service', 'no_show_fee', status='active') if account_holder else P('no_show_fee'))"
  - weekday_index: "DAYS(K('ref_sunday'), missed_date) % 7"
  - day_rate: "K('sunday_rate') if weekday_index == 0 else (K('saturday_rate') if weekday_index == 6 else 1.0)"
  - install_method: "CFIELD('install', 'variant_name', install_job_id=F('install_job_id'))"
  - crew_rate: "K('three_technician_crew') if install_method == 'Bay and Bow Installation' else (K('two_technician_crew') if install_method == 'Full-Frame Installation with Exterior Trim Wrap' or install_method == 'Masonry Opening Installation' else 1.0)"
  - result: "int(schedule_fee * repeat_rate * day_rate * crew_rate * 100 + 0.5 + 0.000001) / 100 if chargeable_place >= 1 else 0.0"
  compute_basis:
    claim_id: "This policy prices the no-show fee for a missed technician visit booked on a warranty claim"
    missed_date: "dated with the date of the missed visit and tied to the claim the visit was booked for"
    plan_name: "For an owner who holds an active CareLine plan whose waiting period had ended by the date of the missed visit"
    plan_enrolled: "whose waiting period had ended by the date of the missed visit"
    plan_wait: "whose waiting period had ended by the date of the missed visit"
    member_ready: "For an owner who holds an active CareLine plan whose waiting period had ended by the date of the missed visit"
    account_holder: "for an owner who holds an active On-Call Service Account"
    lifetime_missed: "The missed visits counted for a missed visit are all the no-show visits recorded on the registration, the missed visit being billed included."
    member_window_missed: "the missed visits counted are only the no-show visits on the registration dated less than the member counting window in whole months before the date the fee is billed"
    account_window_missed: "they are only the no-show visits dated less than the service-account counting window in whole months before the date the fee is billed"
    missed_counted: "For an owner who holds an active CareLine plan whose waiting period had ended by the date of the missed visit, the missed visits counted are only the no-show visits on the registration dated less than the member counting window in whole months before the date the fee is billed; for an owner who holds an active On-Call Service Account, they are only the no-show visits dated less than the service-account counting window in whole months before the date the fee is billed; for every other owner they are all the no-show visits of the registration."
    chargeable_place: "The missed visits counted minus the plan's free no-show count gives the place of the missed visit among the chargeable ones"
    repeat_rate: "the third or a later chargeable missed visit takes the third repeat rate, the second chargeable missed visit takes the second repeat rate, and the first chargeable missed visit takes a repeat rate of one."
    schedule_fee: "For an owner who holds an active CareLine plan whose waiting period had ended by the date of the missed visit, the fee is the lower of the CareLine plan's own no-show fee and the warranty plan's no-show fee; for an owner who holds an active On-Call Service Account, the fee is the On-Call Service Account's no-show fee; for every other owner it is the warranty plan's no-show fee."
    weekday_index: "A missed visit booked on a Sunday takes the Sunday rate, a missed visit booked on a Saturday takes the Saturday rate, and a missed visit booked on a weekday takes a day rate of one."
    day_rate: "A missed visit booked on a Sunday takes the Sunday rate, a missed visit booked on a Saturday takes the Saturday rate, and a missed visit booked on a weekday takes a day rate of one."
    install_method: "A missed visit to openings whose installation job used the Bay and Bow Installation method"
    crew_rate: "A missed visit to openings whose installation job used the Bay and Bow Installation method was booked for three technicians and takes the three-technician crew rate; a missed visit to openings whose installation job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening Installation method was booked for two technicians and takes the two-technician crew rate; a missed visit to openings installed by any other method takes a crew rate of one."
    result: "A missed visit is chargeable only when the missed visits counted are more than the plan's free no-show count; a missed visit that is not chargeable carries no fee and nothing is booked. The fee is the no-show fee the fee basis selects, multiplied by the repeat rate, the day rate and the crew rate, each of which is one unless a paragraph below sets it; the product is rounded half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent. A chargeable missed visit whose fee works out to zero books nothing and owes no fee entry."
  factors:
  - id: counting_window
    effect: parameter
    decides: missed_counted
    bindings: [plan_name, plan_enrolled, plan_wait, member_ready, account_holder, member_window_missed, account_window_missed, missed_counted]
    ladder:
    - when: the owner holds an active CareLine plan whose waiting period had ended by the date of the missed visit
      value: the no-show visits on the registration dated less than K('member_window_months') whole months before the billing date
    - when: the owner holds an active On-Call Service Account
      value: the no-show visits dated less than K('service_account_window_months') whole months before the billing date
    - when: otherwise
      value: every no-show visit recorded on the registration
    baseline:
      missed_counted: "lifetime_missed"
    evidence: [cross_category, history, date]
    cross_difficulty: service
  - id: repeat_rate_ladder
    effect: parameter
    decides: repeat_rate
    bindings: [lifetime_missed, chargeable_place, repeat_rate]
    ladder:
    - when: the missed visit is the third or a later chargeable one among the missed visits counted
      value: K('third_repeat_rate')
    - when: the missed visit is the second chargeable one among the missed visits counted
      value: K('second_repeat_rate')
    - when: otherwise
      value: '1.0'
    baseline:
      repeat_rate: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: missed_visit_fee_basis
    effect: method
    decides: schedule_fee
    bindings: [schedule_fee]
    ladder:
    - when: the owner holds an active CareLine plan past its waiting period on the missed-visit date
      method: the fee is the lower of the CareLine plan's own no-show fee and the warranty plan's no-show fee
    - when: the owner holds an active On-Call Service Account
      method: the fee is the On-Call Service Account's no-show fee
    - when: otherwise
      method: the fee is the warranty plan's no-show fee
    baseline:
      schedule_fee: "P('no_show_fee')"
    evidence: [cross_category]
    cross_difficulty: service
  - id: weekend_day_rate
    effect: parameter
    decides: day_rate
    bindings: [missed_date, weekday_index, day_rate]
    ladder:
    - when: the missed visit was booked on a Sunday
      value: K('sunday_rate')
    - when: the missed visit was booked on a Saturday
      value: K('saturday_rate')
    - when: otherwise
      value: '1.0'
    baseline:
      day_rate: "1.0"
    evidence: [history, date]
    cross_difficulty: null
  - id: crew_rate_ladder
    effect: parameter
    decides: crew_rate
    bindings: [install_method, crew_rate]
    ladder:
    - when: the installation job used the Bay and Bow Installation method
      value: K('three_technician_crew')
    - when: the installation job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening Installation method
      value: K('two_technician_crew')
    - when: otherwise
      value: '1.0'
    baseline:
      crew_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: install
  baseline:
    rule: >-
      The missed visits counted for a missed visit are all the no-show visits recorded on the
      registration, the missed visit being billed included. The no-show fee of a chargeable missed visit
      is the warranty plan's no-show fee, charged once for that visit. A missed visit is chargeable only when the missed visits counted are more than the plan's free no-show count; a missed visit that is not chargeable carries no fee and nothing is booked.
    params: [free_no_show_count, no_show_fee]
  inputs:
    history:
    - {table: warranty_activities, aggregate: count, field: warranty_activity_id, filters: {event_type: warranty_service_visit, visit_outcome: customer_no_show}}
    - {table: warranty_activities, aggregate: latest, field: activity_date, filters: {event_type: warranty_service_visit, visit_outcome: customer_no_show}}
    cross_category: [service, install]
- id: warranty_ext_visit_trip_billing
  base_policy_refs:
  - warranty_agg_claims_per_registration
  - warranty_glass_breakage
  - warranty_proration
  - warranty_service_charges
  - warranty_transfer
  overwrite:
  - base_policy: warranty_service_charges
    superseded_clause: >-
      A visit outside the labor term carries the plan's out-of-term trip charge plus labor at the plan's
      hourly rate for the billable hours, which are the hours on site with the minimum applied and any
      time beyond the minimum rounded up to the billing increment.
    replaced_by: >-
      For the trip charge on a technician visit this policy prices, and only for that trip charge, the
      amount follows the paragraphs below in place of the plan's flat out-of-term or no-defect trip
      charge; the labor billed on such a visit is not set by this policy, and a visit inside the labor
      term at which a covered defect is repaired still carries no trip charge.
  - base_policy: warranty_service_charges
    superseded_clause: >-
      When the technician finds no covered defect, the plan's no-defect trip charge applies even inside
      the labor term.
    replaced_by: >-
      For the trip charge on a technician visit this policy prices, and only for that trip charge, the
      amount follows the paragraphs below in place of the plan's flat out-of-term or no-defect trip
      charge; the labor billed on such a visit is not set by this policy, and a visit inside the labor
      term at which a covered defect is repaired still carries no trip charge.
  trigger: state_due
  subject:
  - warranty_charge_assessed
  computes: amount
  target_tool: bill_visit_trip_5cd049ac
  params:
    ref_sunday: '2026-01-04'
    saturday_rate: 1.25
    sunday_rate: 1.5
    two_technician_crew: 2.0
    three_technician_crew: 3.0
    ladder_access_surcharge: 35.0
    lift_access_surcharge: 95.0
    specialty_handling_surcharge: 25.0
    impact_handling_surcharge: 45.0
    rebook_credit_days: 30
  rule: >-
    This policy prices the trip charge for a completed technician visit on a warranty claim that the
    warranty terms bill a trip for, which is a visit outside the labor term or a visit at which the
    technician found no covered defect, and books it on the warranty charges of the registration, dated
    with the date of the visit and tied to the claim the visit served. For the trip charge on a technician
    visit this policy prices, and only for that trip charge, the amount follows the paragraphs below in
    place of the plan's flat out-of-term or no-defect trip charge; the labor billed on such a visit is not
    set by this policy, and a visit inside the labor term at which a covered defect is repaired still
    carries no trip charge.
    The standard trip charge of a visit is the warranty plan's no-defect trip charge when the technician
    found no covered defect, and the warranty plan's out-of-term trip charge for any other visit this
    policy prices, charged once for the visit. When the visit rebooks a missed visit on the same claim
    dated no more than the rebooking credit window in days earlier, the no-show fee booked on that missed
    visit is credited against the trip charge, which never goes below zero; a no-show fee on an earlier
    missed visit, or on another claim, is not credited. The trip charge of a visit that rebooks a chargeable missed visit on the same claim is fixed only after the records carry the no-show fee entry owed for that missed visit, a missed visit whose fee works out to zero owing none. The trip charge is worked out in this order: the trip rate is multiplied by the
    crew rate and then by the day rate; the access surcharge and the handling surcharge are added to that
    product; the program discount is taken off that sum; the missed-visit credit is deducted from what
    remains, never below zero; and the result is rounded half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent. A trip charge that works out to zero books nothing and owes no trip charge entry. The trip
    rate is the standard trip charge, the crew rate and the day rate are one, the surcharges and the
    program discount are zero, unless a paragraph below sets them.
    A CareLine plan in this policy is any plan of the CareLine Service Plans other than the On-Call Service Account.
    Trip rate. For an owner who holds an active CareLine plan whose waiting period had ended by the date
    of the visit and whose plan has free trips left in the plan year of the visit, meaning fewer repair
    and glass replacement visits logged in that plan year than the plan's free trips per plan year, the
    visit uses one of those free trips and the trip rate is zero; for an owner who holds such a CareLine
    plan with no free trips left in that plan year, the trip rate is the lower of the CareLine plan's own
    trip fee and the standard trip charge; for every other owner the trip rate is the standard trip
    charge. Plan years are counted from the CareLine plan's enrolled date, the first twelve months being
    plan year one.
    Crew rate. A visit to openings whose installation job used the Bay and Bow Installation method needs
    three technicians and takes the three-technician crew rate; a visit to openings whose installation
    job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening
    Installation method needs two technicians and takes the two-technician crew rate; a visit to openings
    installed by any other method takes a crew rate of one.
    Day rate. A visit made on a Sunday takes the Sunday rate, a visit made on a Saturday takes the
    Saturday rate, and a visit made on a weekday takes a day rate of one.
    Access surcharge. When the installation job of the covered openings carried an upper-story surcharge
    and used the Bay and Bow Installation method, the visit needs a lift and takes the lift access
    surcharge; when that job carried an upper-story surcharge and used any other method, the visit needs
    ladders and takes the ladder access surcharge; a visit to openings whose job carried no upper-story
    surcharge takes no access surcharge.
    Handling surcharge. When the covered units were built by the factory as an Impact-Rated Build, the
    visit takes the impact handling surcharge; when they were built as a Specialty Shape Build or an
    Architectural Wood Build, it takes the specialty handling surcharge; units of any other build class
    take no handling surcharge.
    Program discount. When the contract the registration covers was signed under the military discount
    program, the program discount is that contract series' military discount rate; under the
    first-responder program it is the series' first-responder discount rate; under the senior program it
    is the series' senior discount rate; a contract signed with no discount program takes no program
    discount.
  prerequisite:
  - problem: warranty_ext_missed_visit_fee
    kind: value_input
    gate: missed_visit_credit
    form: state
    policy_source: >-
      The trip charge of a visit that rebooks a chargeable missed visit on the same claim is fixed only after the records carry the no-show fee entry owed for that missed visit, a missed visit whose fee works out to zero owing none.
    condition: >-
      The warranty charges of the registration carry a no-show fee entry on the claim dated with the date of the chargeable missed visit on the same claim that the visit being billed rebooks, unless that missed visit's fee works out to zero.
    resolved_by: bill_missed_visit_fee_18fefa1f
    effect: >-
      Once the no-show fee entry of the rebooked missed visit stands, the missed-visit credit takes that
      fee's amount instead of zero, and the trip charge falls by that amount, never below zero.
  cross_category:
  - category: service
    as: history
    reads: [status, variant_name, enrolled_date, waiting_period_days, free_trip_visits_per_year, trip_fee, service_calls.call_kind, service_calls.plan_year]
    note: Decides the trip rate from the owner's active CareLine plan, its tier parameters and the repair and glass visits logged in the plan year of the visit.
  - category: install
    as: history
    reads: [variant_name, install_activities.fee_kind]
    note: Decides the crew rate from the installation method and the access surcharge from the upper-story surcharges booked on the installation job.
  - category: order
    as: branch
    reads: [variant_name]
    note: Decides the handling surcharge from the build class of the factory order that built the covered units.
  - category: window
    as: branch
    reads: [discount_program, military_discount_pct, first_responder_discount_pct, senior_discount_pct]
    note: Decides the program discount for window coverage from the contract's discount program and series rates.
  - category: door
    as: branch
    reads: [discount_program, military_discount_pct, first_responder_discount_pct, senior_discount_pct]
    note: Decides the program discount for door coverage from the contract's discount program and series rates.
  compute:
  - claim_id: "LATEST('warranty_claims', 'warranty_claim_id', date_field='created_at')"
  - visit_date: "LATEST('warranty_activities', 'activity_date', date_field='activity_date', event_type='warranty_service_visit', warranty_claim_id=claim_id)"
  - visit_outcome: "LATEST('warranty_activities', 'visit_outcome', date_field='activity_date', event_type='warranty_service_visit', warranty_claim_id=claim_id)"
  - standard_trip: "P('trip_charge_no_defect') if visit_outcome == 'no_defect_found' else P('trip_charge_out_of_labor_term')"
  - plan_name: "CFIELD('service', 'variant_name', status='active')"
  - plan_enrolled: "CFIELD('service', 'enrolled_date', status='active')"
  - member_ready: "plan_name != None and plan_name != 'On-Call Service Account' and DAYS(plan_enrolled, visit_date) > CPARAM('service', 'waiting_period_days', status='active')"
  - visit_plan_year: "(MONTHS(plan_enrolled, visit_date) // 12 + 1) if plan_name != None else 0"
  - trips_used: "XCOUNT('service', 'service_calls', event_type='service_visit_logged', call_kind='repair_visit', plan_year=visit_plan_year) + XCOUNT('service', 'service_calls', event_type='service_visit_logged', call_kind='glass_replacement', plan_year=visit_plan_year)"
  - free_trips: "CPARAM('service', 'free_trip_visits_per_year', status='active') if plan_name != None else 0"
  - trip_rate: "0.0 if member_ready and trips_used < free_trips else (MN(CPARAM('service', 'trip_fee', status='active'), standard_trip) if member_ready and trips_used >= free_trips else standard_trip)"
  - install_method: "CFIELD('install', 'variant_name', install_job_id=F('install_job_id'))"
  - crew_rate: "K('three_technician_crew') if install_method == 'Bay and Bow Installation' else (K('two_technician_crew') if install_method == 'Full-Frame Installation with Exterior Trim Wrap' or install_method == 'Masonry Opening Installation' else 1.0)"
  - weekday_index: "DAYS(K('ref_sunday'), visit_date) % 7"
  - day_rate: "K('sunday_rate') if weekday_index == 0 else (K('saturday_rate') if weekday_index == 6 else 1.0)"
  - upper_story_fees: "XCOUNT('install', 'install_activities', install_job_id=F('install_job_id'), fee_kind='upper_story_surcharge')"
  - access_surcharge: "K('lift_access_surcharge') if upper_story_fees > 0 and install_method == 'Bay and Bow Installation' else (K('ladder_access_surcharge') if upper_story_fees > 0 and install_method != 'Bay and Bow Installation' else 0.0)"
  - build_class: "CFIELD('order', 'variant_name', window_contract_id=F('window_contract_id'), door_contract_id=F('door_contract_id'))"
  - handling_surcharge: "K('impact_handling_surcharge') if build_class == 'Impact-Rated Build' else (K('specialty_handling_surcharge') if build_class == 'Specialty Shape Build' or build_class == 'Architectural Wood Build' else 0.0)"
  - program: "CFIELD('window', 'discount_program', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CFIELD('door', 'discount_program', door_contract_id=F('door_contract_id'))"
  - military_rate: "CPARAM('window', 'military_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'military_discount_pct', door_contract_id=F('door_contract_id'))"
  - responder_rate: "CPARAM('window', 'first_responder_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'first_responder_discount_pct', door_contract_id=F('door_contract_id'))"
  - senior_rate: "CPARAM('window', 'senior_discount_pct', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CPARAM('door', 'senior_discount_pct', door_contract_id=F('door_contract_id'))"
  - program_discount: "military_rate if program == 'military' else (responder_rate if program == 'first_responder' else (senior_rate if program == 'senior' else 0.0))"
  - last_missed_date: "LATEST('warranty_activities', 'activity_date', date_field='activity_date', event_type='warranty_service_visit', warranty_claim_id=claim_id, visit_outcome='customer_no_show')"
  - missed_fee: "SUM('warranty_activities', 'amount', event_type='warranty_charge_assessed', charge_kind='no_show_fee', warranty_claim_id=claim_id, activity_date=last_missed_date)"
  - missed_visit_credit: "missed_fee if last_missed_date != None and DAYS(last_missed_date, visit_date) > 0 and DAYS(last_missed_date, visit_date) <= K('rebook_credit_days') else 0.0"
  - result: "int((MX(0, (trip_rate * crew_rate * day_rate + access_surcharge + handling_surcharge) * (1 - program_discount) - missed_visit_credit)) * 100 + 0.5 + 0.000001) / 100"
  compute_basis:
    claim_id: "This policy prices the trip charge for a completed technician visit on a warranty claim"
    visit_date: "dated with the date of the visit and tied to the claim the visit served"
    visit_outcome: "a visit at which the technician found no covered defect"
    standard_trip: "The standard trip charge of a visit is the warranty plan's no-defect trip charge when the technician found no covered defect, and the warranty plan's out-of-term trip charge for any other visit this policy prices, charged once for the visit."
    plan_name: "For an owner who holds an active CareLine plan whose waiting period had ended by the date of the visit"
    plan_enrolled: "Plan years are counted from the CareLine plan's enrolled date, the first twelve months being plan year one."
    member_ready: "For an owner who holds an active CareLine plan whose waiting period had ended by the date of the visit"
    visit_plan_year: "Plan years are counted from the CareLine plan's enrolled date, the first twelve months being plan year one."
    trips_used: "meaning fewer repair and glass replacement visits logged in that plan year than the plan's free trips per plan year"
    free_trips: "than the plan's free trips per plan year"
    trip_rate: "For an owner who holds an active CareLine plan whose waiting period had ended by the date of the visit and whose plan has free trips left in the plan year of the visit, meaning fewer repair and glass replacement visits logged in that plan year than the plan's free trips per plan year, the visit uses one of those free trips and the trip rate is zero; for an owner who holds such a CareLine plan with no free trips left in that plan year, the trip rate is the lower of the CareLine plan's own trip fee and the standard trip charge; for every other owner the trip rate is the standard trip charge."
    install_method: "A visit to openings whose installation job used the Bay and Bow Installation method"
    crew_rate: "A visit to openings whose installation job used the Bay and Bow Installation method needs three technicians and takes the three-technician crew rate; a visit to openings whose installation job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening Installation method needs two technicians and takes the two-technician crew rate; a visit to openings installed by any other method takes a crew rate of one."
    weekday_index: "A visit made on a Sunday takes the Sunday rate, a visit made on a Saturday takes the Saturday rate, and a visit made on a weekday takes a day rate of one."
    day_rate: "A visit made on a Sunday takes the Sunday rate, a visit made on a Saturday takes the Saturday rate, and a visit made on a weekday takes a day rate of one."
    upper_story_fees: "When the installation job of the covered openings carried an upper-story surcharge"
    access_surcharge: "When the installation job of the covered openings carried an upper-story surcharge and used the Bay and Bow Installation method, the visit needs a lift and takes the lift access surcharge; when that job carried an upper-story surcharge and used any other method, the visit needs ladders and takes the ladder access surcharge; a visit to openings whose job carried no upper-story surcharge takes no access surcharge."
    build_class: "When the covered units were built by the factory as an Impact-Rated Build"
    handling_surcharge: "When the covered units were built by the factory as an Impact-Rated Build, the visit takes the impact handling surcharge; when they were built as a Specialty Shape Build or an Architectural Wood Build, it takes the specialty handling surcharge; units of any other build class take no handling surcharge."
    program: "When the contract the registration covers was signed under the military discount program"
    military_rate: "the program discount is that contract series' military discount rate"
    responder_rate: "under the first-responder program it is the series' first-responder discount rate"
    senior_rate: "under the senior program it is the series' senior discount rate"
    program_discount: "When the contract the registration covers was signed under the military discount program, the program discount is that contract series' military discount rate; under the first-responder program it is the series' first-responder discount rate; under the senior program it is the series' senior discount rate; a contract signed with no discount program takes no program discount."
    last_missed_date: "When the visit rebooks a missed visit on the same claim dated no more than the rebooking credit window in days earlier"
    missed_fee: "the no-show fee booked on that missed visit is credited against the trip charge"
    missed_visit_credit: "When the visit rebooks a missed visit on the same claim dated no more than the rebooking credit window in days earlier, the no-show fee booked on that missed visit is credited against the trip charge, which never goes below zero; a no-show fee on an earlier missed visit, or on another claim, is not credited."
    result: "The trip charge is worked out in this order: the trip rate is multiplied by the crew rate and then by the day rate; the access surcharge and the handling surcharge are added to that product; the program discount is taken off that sum; the missed-visit credit is deducted from what remains, never below zero; and the result is rounded half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent."
  factors:
  - id: member_trip_rate
    effect: method
    decides: trip_rate
    bindings: [plan_name, plan_enrolled, member_ready, visit_plan_year, trips_used, free_trips, trip_rate]
    ladder:
    - when: the owner holds an active CareLine plan past its waiting period on the visit date and has free trips left in that plan year
      method: the visit is drawn from the plan's free trips and the trip rate is zero
    - when: the owner holds an active CareLine plan past its waiting period on the visit date and has no free trips left in that plan year
      method: the trip rate is the lower of the CareLine plan's own trip fee and the standard trip charge
    - when: otherwise
      method: the trip rate is the standard trip charge
    baseline:
      trip_rate: "standard_trip"
    evidence: [cross_category, history, date]
    cross_difficulty: service
  - id: crew_size_rate
    effect: parameter
    decides: crew_rate
    bindings: [install_method, crew_rate]
    ladder:
    - when: the installation job used the Bay and Bow Installation method
      value: K('three_technician_crew')
    - when: the installation job used the Full-Frame Installation with Exterior Trim Wrap method or the Masonry Opening Installation method
      value: K('two_technician_crew')
    - when: otherwise
      value: '1.0'
    baseline:
      crew_rate: "1.0"
    evidence: [cross_category]
    cross_difficulty: install
  - id: weekend_visit_rate
    effect: parameter
    decides: day_rate
    bindings: [weekday_index, day_rate]
    ladder:
    - when: the visit was made on a Sunday
      value: K('sunday_rate')
    - when: the visit was made on a Saturday
      value: K('saturday_rate')
    - when: otherwise
      value: '1.0'
    baseline:
      day_rate: "1.0"
    evidence: [history, date]
    cross_difficulty: null
  - id: upper_story_access
    effect: parameter
    decides: access_surcharge
    bindings: [upper_story_fees, access_surcharge]
    ladder:
    - when: the installation job carried an upper-story surcharge and used the Bay and Bow Installation method
      value: K('lift_access_surcharge')
    - when: the installation job carried an upper-story surcharge and used any other method
      value: K('ladder_access_surcharge')
    - when: otherwise
      value: '0.0'
    baseline:
      access_surcharge: "0.0"
    evidence: [cross_category, history]
    cross_difficulty: install
  - id: build_class_handling
    effect: parameter
    decides: handling_surcharge
    bindings: [build_class, handling_surcharge]
    ladder:
    - when: the covered units were built as an Impact-Rated Build
      value: K('impact_handling_surcharge')
    - when: the covered units were built as a Specialty Shape Build or an Architectural Wood Build
      value: K('specialty_handling_surcharge')
    - when: otherwise
      value: '0.0'
    baseline:
      handling_surcharge: "0.0"
    evidence: [cross_category]
    cross_difficulty: order
  - id: signing_program_discount
    effect: parameter
    decides: program_discount
    bindings: [program, military_rate, responder_rate, senior_rate, program_discount]
    ladder:
    - when: the covered contract was signed under the military discount program
      value: the contract series' military discount rate
    - when: the covered contract was signed under the first-responder discount program
      value: the contract series' first-responder discount rate
    - when: the covered contract was signed under the senior discount program
      value: the contract series' senior discount rate
    - when: otherwise
      value: '0.0'
    baseline:
      program_discount: "0.0"
    evidence: [cross_category]
    cross_difficulty: window
  baseline:
    rule: >-
      The standard trip charge of a visit is the warranty plan's no-defect trip charge when the
      technician found no covered defect, and the warranty plan's out-of-term trip charge for any other
      visit this policy prices, charged once for the visit. When the visit rebooks a missed visit on the
      same claim dated no more than the rebooking credit window in days earlier, the no-show fee booked on
      that missed visit is credited against the trip charge, which never goes below zero; a no-show fee on
      an earlier missed visit, or on another claim, is not credited.
    params: [trip_charge_no_defect, trip_charge_out_of_labor_term, rebook_credit_days]
  inputs:
    history:
    - {table: warranty_activities, aggregate: latest, field: activity_date, filters: {event_type: warranty_service_visit}}
    - {table: warranty_activities, aggregate: latest, field: amount, filters: {event_type: warranty_charge_assessed, charge_kind: no_show_fee}}
    - {category: service, table: service_calls, aggregate: count, field: service_call_id, filters: {event_type: service_visit_logged, call_kind: repair_visit}}
    - {category: install, table: install_activities, aggregate: count, field: install_activity_id, filters: {fee_kind: upper_story_surcharge}}
    cross_category: [service, install, order, window, door]
- id: warranty_ext_transfer_fee_confirmation
  base_policy_refs:
  - warranty_agg_claims_per_registration
  - warranty_glass_breakage
  - warranty_proration
  - warranty_service_charges
  - warranty_transfer
  overwrite:
  - base_policy: warranty_transfer
    superseded_clause: The plan's transfer fee is charged to the seller on the request date.
    replaced_by: >-
      For a transfer request this policy prices, and only for such a request, the fee charged to the
      seller on the request date is the plan's transfer fee adjusted by the paragraphs below rather than
      the plan's transfer fee alone; every other condition of a transfer stays as the warranty terms set
      it.
  trigger: on_request
  subject:
  - warranty_charge_assessed
  computes: transfer_fee
  target_tool: confirm_coverage_transfer_ce1107bd
  params:
    prompt_request_days: 10
    prompt_request_rate: 0.8
    late_request_days: 30
    late_request_handling: 25.0
    large_home_units: 20
    small_home_units: 5
    large_home_rate: 1.25
    small_home_rate: 0.75
    member_waiver_months: 12
    new_member_rate: 0.5
    proration_horizon_months: 24
  rule: >-
    This policy prices the transfer fee for a transfer request the selling owner confirms in person for a
    transfer request already on file that names the buyer and the home sale closing date; the confirmation
    places the registration in transfer pending with the confirmation date as the date the transfer was
    requested and books the fee as a transfer fee on the warranty charges of the registration. For a
    transfer request this policy prices, and only for such a request, the fee charged to the seller on the
    request date is the plan's transfer fee adjusted by the paragraphs below rather than the plan's
    transfer fee alone; every other condition of a transfer stays as the warranty terms set it.
    The standard transfer fee is the plan's transfer fee, charged once to the seller on the request date.
    A transfer request is not placed in transfer pending, and its fee is not charged, until every
    completed technician visit on the registration that the warranty terms bill a trip charge for carries its trip charge entry on the warranty charges of the registration, a visit whose trip charge works out to zero owing none. A fee is charged only when a
    submitted transfer request naming the buyer is on file for the registration; with none on file nothing
    is charged. The fee is worked out in this order: the request timing sets the timed fee from the plan's transfer fee; the timed fee is multiplied
    by the size rate, then by the member rate, then by the remaining-term share; and the result is rounded
    half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent. The timed fee is the plan's transfer fee, and the size rate, the
    member rate and the remaining-term share are one, unless a paragraph below sets them.
    Request timing. Calendar days are counted from the day after the home sale closing date on the
    transfer request to the confirmation date. A request confirmed no more than the prompt-request window
    in days after the closing date takes the prompt-request rate on the plan's transfer fee; a request
    confirmed more than the late-request threshold in days after the closing date carries the plan's
    transfer fee plus the late-request handling charge; any other request carries the plan's transfer fee.
    Size rate. Coverage of a contract with at least the large-home unit count of window openings or door
    units takes the large-home rate; coverage of a contract with no more than the small-home unit count
    takes the small-home rate; coverage of any other contract takes a size rate of one.
    A CareLine plan in this policy is any plan of the CareLine Service Plans other than the On-Call Service Account.
    Member rate. A seller who holds an active CareLine plan enrolled at least the member waiver term in
    whole months before the confirmation date pays no transfer fee; a seller who holds an active CareLine
    plan enrolled less than that before the confirmation date takes the new-member rate; any other seller
    takes a member rate of one.
    Remaining-term share. The months of transferable product coverage remaining are the plan's transferred product term in months less the whole months elapsed from the original coverage start date to the confirmation date, a month being complete once the day of the month of the original coverage start date is reached and, in a month that lacks that day, on the last day of that month. When none remain, nothing is left to pass to the buyer and the
    remaining-term share is zero; when fewer than the proration horizon in months remain, the fee is
    prorated and the remaining-term share is the months remaining divided by the proration horizon; when
    at least the proration horizon remains, the share is one.
  prerequisite:
  - problem: warranty_ext_visit_trip_billing
    kind: state_gate
    gate: warranty_activities.charge_kind
    form: state
    policy_source: >-
      A transfer request is not placed in transfer pending, and its fee is not charged, until every
      completed technician visit on the registration that the warranty terms bill a trip charge for
      carries its trip charge entry on the warranty charges of the registration, a visit whose trip charge works out to zero owing none.
    condition: >-
      Every completed technician visit on the registration that the warranty terms bill a trip charge for has a trip charge entry on the claim dated with the date of that visit, unless its trip charge works out to zero.
    resolved_by: bill_visit_trip_5cd049ac
    effect: >-
      Once the trip charge entry of the last unbilled visit stands, the condition on which the transfer
      request and its fee wait holds, and the request can be placed in transfer pending with its fee.
  cross_category:
  - category: window
    as: branch
    reads: [opening_count]
    note: Decides the size rate from the number of openings on the window contract the registration covers.
  - category: door
    as: branch
    reads: [unit_count]
    note: Decides the size rate from the number of door units when the registration covers a door contract.
  - category: service
    as: branch
    reads: [status, variant_name, enrolled_date]
    note: Decides the member rate from the seller's active CareLine plan and how long before the confirmation it was enrolled.
  compute:
  - requests_on_file: "COUNT('warranty_transfer_requests', request_status='submitted')"
  - closing_date: "LATEST('warranty_transfer_requests', 'home_sale_closing_date', date_field='created_at', request_status='submitted')"
  - days_after_closing: "DAYS(closing_date, NOW)"
  - timed_fee: "P('transfer_fee') * K('prompt_request_rate') if days_after_closing <= K('prompt_request_days') else (P('transfer_fee') + K('late_request_handling') if days_after_closing > K('late_request_days') else P('transfer_fee'))"
  - covered_units: "CFIELD('window', 'opening_count', window_contract_id=F('window_contract_id')) if F('window_contract_id') != None else CFIELD('door', 'unit_count', door_contract_id=F('door_contract_id'))"
  - size_rate: "K('large_home_rate') if covered_units >= K('large_home_units') else (K('small_home_rate') if covered_units <= K('small_home_units') else 1.0)"
  - plan_name: "CFIELD('service', 'variant_name', status='active')"
  - plan_enrolled: "CFIELD('service', 'enrolled_date', status='active')"
  - member_months: "MONTHS(plan_enrolled, NOW) if plan_name != None else 0"
  - member_rate: "0.0 if plan_name != None and plan_name != 'On-Call Service Account' and member_months >= K('member_waiver_months') else (K('new_member_rate') if plan_name != None and plan_name != 'On-Call Service Account' and member_months < K('member_waiver_months') else 1.0)"
  - start_ordinal: "DAYS('1600-03-01', F('coverage_start_date'))"
  - start_day_of_era: "start_ordinal - (start_ordinal // 146097) * 146097"
  - start_year_of_era: "(start_day_of_era - start_day_of_era // 1460 + start_day_of_era // 36524 - start_day_of_era // 146096) // 365"
  - start_day_of_year: "start_day_of_era - (365 * start_year_of_era + start_year_of_era // 4 - start_year_of_era // 100)"
  - start_month_index: "(5 * start_day_of_year + 2) // 153"
  - start_day: "start_day_of_year - (153 * start_month_index + 2) // 5 + 1"
  - confirm_ordinal: "DAYS('1600-03-01', NOW)"
  - confirm_day_of_era: "confirm_ordinal - (confirm_ordinal // 146097) * 146097"
  - confirm_year_of_era: "(confirm_day_of_era - confirm_day_of_era // 1460 + confirm_day_of_era // 36524 - confirm_day_of_era // 146096) // 365"
  - confirm_day_of_year: "confirm_day_of_era - (365 * confirm_year_of_era + confirm_year_of_era // 4 - confirm_year_of_era // 100)"
  - confirm_month_index: "(5 * confirm_day_of_year + 2) // 153"
  - confirm_day: "confirm_day_of_year - (153 * confirm_month_index + 2) // 5 + 1"
  - confirm_month: "confirm_month_index + 3 if confirm_month_index < 10 else confirm_month_index - 9"
  - confirm_year: "1600 + confirm_year_of_era + (confirm_ordinal // 146097) * 400 + (1 if confirm_month <= 2 else 0)"
  - confirm_month_days: "(30 if confirm_month == 4 or confirm_month == 6 or confirm_month == 9 or confirm_month == 11 else 31) if confirm_month != 2 else (29 if (confirm_year % 4 == 0 and confirm_year % 100 != 0) or confirm_year % 400 == 0 else 28)"
  - months_elapsed: "MONTHS(F('coverage_start_date'), NOW) + (1 if confirm_day < start_day and confirm_day == confirm_month_days else 0)"
  - months_remaining: "P('transferred_product_term_years') * 12 - months_elapsed"
  - term_share: "0.0 if months_remaining <= 0 else (months_remaining / K('proration_horizon_months') if months_remaining < K('proration_horizon_months') else 1.0)"
  - result: "int((timed_fee * size_rate * member_rate * term_share) * 100 + 0.5 + 0.000001) / 100 if requests_on_file >= 1 else 0.0"
  compute_basis:
    requests_on_file: "A fee is charged only when a submitted transfer request naming the buyer is on file for the registration; with none on file nothing is charged."
    closing_date: "for a transfer request already on file that names the buyer and the home sale closing date"
    days_after_closing: "Calendar days are counted from the day after the home sale closing date on the transfer request to the confirmation date."
    timed_fee: "A request confirmed no more than the prompt-request window in days after the closing date takes the prompt-request rate on the plan's transfer fee; a request confirmed more than the late-request threshold in days after the closing date carries the plan's transfer fee plus the late-request handling charge; any other request carries the plan's transfer fee."
    covered_units: "Coverage of a contract with at least the large-home unit count of window openings or door units"
    size_rate: "Coverage of a contract with at least the large-home unit count of window openings or door units takes the large-home rate; coverage of a contract with no more than the small-home unit count takes the small-home rate; coverage of any other contract takes a size rate of one."
    plan_name: "A seller who holds an active CareLine plan enrolled at least the member waiver term in whole months before the confirmation date"
    plan_enrolled: "enrolled at least the member waiver term in whole months before the confirmation date"
    member_months: "enrolled at least the member waiver term in whole months before the confirmation date"
    member_rate: "A seller who holds an active CareLine plan enrolled at least the member waiver term in whole months before the confirmation date pays no transfer fee; a seller who holds an active CareLine plan enrolled less than that before the confirmation date takes the new-member rate; any other seller takes a member rate of one."
    months_remaining: "The months of transferable product coverage remaining are the plan's transferred product term in months less the whole months elapsed from the original coverage start date to the confirmation date, a month being complete once the day of the month of the original coverage start date is reached and, in a month that lacks that day, on the last day of that month."
    start_ordinal: "a month being complete once the day of the month of the original coverage start date is reached and, in a month that lacks that day, on the last day of that month."
    confirm_ordinal: "a month being complete once the day of the month of the original coverage start date is reached and, in a month that lacks that day, on the last day of that month."
    months_elapsed: "less the whole months elapsed from the original coverage start date to the confirmation date, a month being complete once the day of the month of the original coverage start date is reached and, in a month that lacks that day, on the last day of that month."
    term_share: "When none remain, nothing is left to pass to the buyer and the remaining-term share is zero; when fewer than the proration horizon in months remain, the fee is prorated and the remaining-term share is the months remaining divided by the proration horizon; when at least the proration horizon remains, the share is one."
    result: "A fee is charged only when a submitted transfer request naming the buyer is on file for the registration; with none on file nothing is charged. The fee is worked out in this order: the request timing sets the timed fee from the plan's transfer fee; the timed fee is multiplied by the size rate, then by the member rate, then by the remaining-term share; and the result is rounded half up to the cent once, at the end, an amount exactly halfway between two cents going to the higher cent."
  factors:
  - id: request_timing_rate
    effect: parameter
    decides: timed_fee
    bindings: [closing_date, days_after_closing, timed_fee]
    ladder:
    - when: the request is confirmed no more than the prompt-request window in days after the home sale closing date
      value: P('transfer_fee') * K('prompt_request_rate')
    - when: the request is confirmed more than the late-request threshold in days after the home sale closing date
      value: P('transfer_fee') + K('late_request_handling')
    - when: otherwise
      value: P('transfer_fee')
    baseline:
