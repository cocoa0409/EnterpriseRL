events:
- type: window_contract_signed
  target: window_contracts
  mutation: create
  meaning: The homeowner signs a window replacement contract for one product series.
  grain: One row per signed contract.
  fields:
    customer_id: The homeowner who signed.
    variant_name: The product series contracted, as its official full name.
    contract_number: The contract number printed on the signed agreement.
    signed_date: The date the agreement was signed.
    sales_channel: Where the sale was made (in_home, showroom or virtual_consultation).
    opening_count: Number of window openings on the contract at signing.
    contract_price: Signed contract price after any discount program, including options chosen at signing.
    payment_method: Whether the contract is paid by cash, check or card or by Ridgeline financing.
    discount_program: The single discount program applied at signing, or none.
    warranty_plan: The warranty plan chosen at signing, as its official name.
  triggers: []
- type: window_payment_received
  target: window_transactions
  meaning: A payment toward the contract is received, from the customer or from the financing lender.
  grain: One row per payment received.
  distinguish_by:
  - payment_kind
  - txn_date
  - amount
  - tender_type
  fields:
    txn_date: Date the payment was received.
    amount: Amount received (positive).
    payment_kind: booking_deposit, progress_payment, final_balance or lender_funding.
    tender_type: check, card, ach or lender_disbursement.
  account: customer_payments
  direction: in
  triggers: []
- type: window_refund_issued
  target: window_transactions
  meaning: Money is returned to the customer against one specific earlier payment.
  grain: One row per refund of one source payment.
  distinguish_by:
  - refund_kind
  - source_window_txn_id
  - txn_date
  fields:
    txn_date: Date the refund was issued.
    amount: Amount refunded (positive).
    refund_kind: cooling_off_refund, cancellation_refund or overpayment_refund.
    source_window_txn_id: The payment record this refund returns money from.
  account: customer_payments
  direction: out
  triggers: []
- type: window_change_order
  target: window_transactions
  meaning: >-
    A priced addition to the contract — an option upgrade, an added opening or an oversize surcharge.
  grain: One row per change order line of one kind written on one date.
  distinguish_by:
  - change_kind
  - txn_date
  - openings_affected
  fields:
    txn_date: Date the change order was written.
    amount: Price added to the contract (positive).
    change_kind: >-
      What was added (premium_low_e, triple_pane, grilles_between_glass, exterior_color, tempered_glass,
      laminated_glass, obscure_glass, hardware_finish, opening_added, oversize_surcharge).
    openings_affected: Number of openings the line prices.
  account: contract_charges
  direction: in
  triggers: []
- type: window_price_credit
  target: window_transactions
  meaning: A credit that reduces what the customer owes on the contract.
  grain: One row per credit of one kind granted on one date for one source.
  distinguish_by:
  - credit_kind
  - txn_date
  - factory_order_id
  - referred_contract_number
  fields:
    txn_date: Date the credit was granted.
    amount: Credit amount (positive).
    credit_kind: opening_removed, door_bundle_discount, referral_credit or on_time_guarantee_credit.
    openings_affected: Openings removed, for an opening_removed credit; 0 otherwise.
    factory_order_id: The factory order whose late shipment earned an on_time_guarantee_credit; empty
      otherwise.
    referred_contract_number: >-
      Contract number of the referred household's contract, for a referral_credit; empty otherwise.
  account: contract_charges
  direction: out
  triggers: []
- type: window_fee_assessed
  target: window_transactions
  meaning: A fee or charge is added to the contract.
  grain: One row per fee of one kind assessed on one date.
  distinguish_by:
  - fee_kind
  - txn_date
  fields:
    txn_date: Date the fee was assessed.
    amount: Fee amount (positive).
    fee_kind: >-
      missed_measure_fee, remeasure_fee, change_order_fee, series_change_fee, late_balance_charge or cancellation_charge.
  account: contract_charges
  direction: in
  triggers: []
- type: window_measure_visit
  target: window_transactions
  meaning: A measure appointment at the home is recorded with its outcome.
  grain: One row per measure appointment.
  distinguish_by:
  - visit_kind
  - txn_date
  fields:
    txn_date: Date of the appointment.
    visit_kind: final_measure, remeasure (customer-requested) or company_remeasure (ordered by Ridgeline).
    visit_outcome: completed, customer_no_show, late_reschedule or company_rescheduled.
    openings_affected: Openings measured at a completed visit; 0 otherwise.
    oversize_opening_count: Openings measured above the series' standard united-inch bracket; 0 otherwise.
  triggers:
  - event: window:window_measure_confirmed
    when:
      visit_kind: final_measure
      visit_outcome: completed
    map:
      measure_date: txn_date
      opening_count: openings_affected
  - event: window:window_change_order
    when:
      visit_kind: final_measure
      visit_outcome: completed
      oversize_opening_count:
        not: 0
    map:
      change_kind: oversize_surcharge
      openings_affected: oversize_opening_count
      txn_date: txn_date
- type: window_measure_confirmed
  target: window_contracts
  mutation:
    transition:
      from: signed
      to: measured
  meaning: The final measure fixes the contract's openings and sizes.
  grain: One row per transaction.
  fields:
    measure_date: Date of the completed final measure.
    opening_count: Openings confirmed at the final measure.
  triggers: []
- type: window_order_released
  target: window_contracts
  mutation:
    transition:
      from: measured
      to: ordered
  meaning: The confirmed specifications are released to the factory.
  grain: One row per transaction.
  fields:
    order_release_date: Date the order was released to the factory.
  triggers:
  - event: order:order_entered
    map:
      window_contract_id: window_contract_id
      customer_id: customer_id
- type: window_installation_completed
  target: window_contracts
  mutation:
    transition:
      from: ordered
      to: installed
  meaning: The installation of the contracted windows is completed and signed off on site.
  grain: One row per transaction.
  fields:
    completion_date: Date the installation was completed.
  triggers: []
- type: window_contract_closed
  target: window_contracts
  mutation:
    transition:
      from: installed
      to: closed
  meaning: The installed contract is paid in full and closed.
  grain: One row per transaction.
  fields:
    closed_date: Date the contract was closed.
  triggers: []
- type: window_contract_cancelled
  target: window_contracts
  mutation:
    transition:
    - from: signed
      to: cancelled
    - from: measured
      to: cancelled
    - from: ordered
      to: cancelled
  meaning: The contract is cancelled on the customer's written notice.
  grain: One row per transaction.
  fields:
    cancelled_date: Date the written notice of cancellation was given.
  triggers: []
- type: window_series_changed
  target: window_contracts
  mutation: update
  meaning: The contract is moved to another product series before order release and re-priced.
  grain: One row per transaction.
  fields:
    variant_name: The new product series.
    contract_price: The re-priced contract price.
  triggers: []
measures:
- id: window_msr_paid_to_date
  window: Contract lifetime up to the moment of handling.
  measure: >-
    Sum of amount over window_payment_received rows of the contract minus sum of amount over its window_refund_issued
    rows.
- id: window_msr_net_charges
  window: Contract lifetime up to the moment of handling.
  measure: >-
    Sum of amount over window_change_order and window_fee_assessed rows of the contract minus sum of amount
    over its window_price_credit rows.
- id: window_msr_open_contracts
  window: Portfolio state at the moment of handling.
  measure: >-
    Count of the customer's window contracts whose status is signed, measured, ordered or installed.
- id: window_msr_missed_measures
  window: Contract lifetime up to and including the appointment being handled.
  measure: >-
    Count of window_measure_visit rows of the contract whose visit_outcome is customer_no_show or late_reschedule.
- id: window_msr_customer_remeasures
  window: Contract lifetime up to and including the visit being handled.
  measure: >-
    Count of window_measure_visit rows of the contract with visit_kind remeasure and visit_outcome completed.
- id: window_msr_change_orders
  window: Contract lifetime up to and including the change order being handled.
  measure: >-
    Count of distinct txn_date values among window_change_order rows of the contract whose change_kind
    is not oversize_surcharge (all lines written on one date form one change order).
- id: window_msr_referral_credits
  window: Contract lifetime up to the moment of handling.
  measure: Count of window_price_credit rows of the contract with credit_kind referral_credit.
policies:
- id: window_agg_multi_holding
  subject:
  - window_contract_signed
  rule: >-
    A customer may hold several window replacement contracts over time, but no more than the cap in params
    may be open at the same time, where an open contract is one whose status is signed, measured, ordered
    or installed (window_msr_open_contracts); closed and cancelled contracts do not count. A new contract
    may be signed only when the customer's count of open window replacement contracts is below the cap.
    When the cap is already reached, the additional openings are added to an open contract by change order
    before its order release, or the new contract waits until an open contract closes. Door contracts
    are a separate product line and never count toward this cap.
  eligibility:
  - id: open_contract_cap
    applies_to:
    - window_contract_signed
    kind: authorization
    condition: >-
      A new contract may be signed only when the customer's count of open window replacement contracts
      is below the cap.
    evidence_fields:
    - window_contracts.customer_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.customer_id
      action_bindings:
        window_contracts.customer_id: customer_id
  params:
    max_per_customer: 2
  measures:
  - window_msr_open_contracts
- id: window_agg_payment_application
  subject:
  - window_payment_received
  - window_refund_issued
  rule: >-
    Every payment is applied to exactly one contract and is never split across contracts. The payment
    goes to the contract whose contract number the customer gives; when the customer names no contract
    and holds more than one open window replacement contract, it goes to the open contract with the earliest
    signed date that still has a balance due, and to the next one only once a new payment is made. Lender
    funding is applied to the contract named on the funded financing account. A refund is always booked
    against the same contract as the payment it returns and names that payment as its source. It never
    draws on a payment recorded on another contract.
  eligibility:
  - id: refund_same_contract
    applies_to:
    - window_refund_issued
    kind: authorization
    condition: >-
      A refund is always booked against the same contract as the payment it returns and names that payment
      as its source.
    evidence_fields:
    - window_transactions.window_txn_id
    - window_transactions.window_contract_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_transactions.window_txn_id
        - window_transactions.window_contract_id
      action_bindings:
        window_transactions.window_txn_id: source_window_txn_id
        window_transactions.window_contract_id: window_contract_id
  measures:
  - window_msr_open_contracts
- id: window_discount_programs
  subject:
  - window_contract_signed
  rule: >-
    At signing, the list price is the series base price per opening times the number of openings plus
    the options chosen. One discount program at most applies to a contract: military (active duty or veteran,
    shown by military identification at signing), senior, or first responder (sworn police, fire or EMS,
    shown by department identification at signing). The senior program applies only when the customer
    is at least the minimum age on the contract signing date according to the date of birth on the customer
    profile. When the customer qualifies for more than one program, the single program with the highest
    rate for the series is applied; programs never add together. The program rate is applied to the list
    price and the result, rounded to the cent, is the signed contract price. A contract may be signed
    only when the signed contract price reaches the series minimum contract amount and the opening count
    does not exceed the series maximum. Discount programs are chosen at signing only and are never added
    afterwards. The warranty plan is also fixed at signing: the series' included plan is the default,
    a higher plan is bought at signing for the warranty charter's upgrade price per opening and is part
    of the signed contract price, a plan lower than the series' included plan cannot be chosen, and the
    plan never changes after signing.
  eligibility:
  - id: senior_age
    applies_to:
    - window_contract_signed
    kind: authorization
    condition: >-
      The senior program applies only when the customer is at least the minimum age on the contract signing
      date according to the date of birth on the customer profile.
    evidence_fields:
    - customers.customer_id
    - customers.date_of_birth
    - window_contracts.signed_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - customers.customer_id
      action_bindings:
        customers.customer_id: customer_id
  - id: series_size_limits
    applies_to:
    - window_contract_signed
    kind: authorization
    condition: >-
      A contract may be signed only when the signed contract price reaches the series minimum contract
      amount and the opening count does not exceed the series maximum.
    evidence_fields:
    - window_contracts.contract_price
    - window_contracts.opening_count
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.contract_price
        - window_contracts.opening_count
      action_bindings:
        window_contracts.contract_price: contract_price
        window_contracts.opening_count: opening_count
  params:
    per_tier:
      Ridgeline 1100 Series Vinyl:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 2200 Series Vinyl:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 3300 Series Premium Vinyl:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 4400 Series Composite:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 5500 Series Fiberglass:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
      Ridgeline 6600 Series Wood-Clad:
        military: =military_discount_pct
        senior: =senior_discount_pct
        first_responder: =first_responder_discount_pct
    min_age: =senior_discount_min_age
- id: window_booking_deposit
  subject:
  - window_payment_received
  - window_measure_visit
  rule: >-
    Every contract takes a booking deposit before the final measure. For a contract paid by cash, check
    or card, the required deposit is the larger of the series deposit percentage of the signed contract
    price and the series deposit minimum, but never more than the signed contract price. For a contract
    whose payment method is Ridgeline financing, the required deposit is the series financed deposit percentage
    of the signed contract price with no minimum, and is zero where that percentage is zero. Amounts are
    rounded to the cent. The deposit is due within the series deposit window, counted in calendar days
    from the day after the contract signing date. The final measure visit is booked only after the required
    deposit has been received in full. The final measure is offered within the series measure booking
    window counted in business days (Monday through Friday, excluding U.S. federal holidays) from the
    day after the deposit is complete. Money received before order release up to the required deposit
    is recorded as booking_deposit and anything beyond it as progress_payment. A single card payment may
    not exceed the card limit; a larger amount is split into separate card payments on different dates
    or paid by check or ACH. A deposit that has not arrived by the end of the deposit window does not
    cancel the contract by itself; the measure simply stays unbooked.
  eligibility:
  - id: deposit_before_measure
    applies_to:
    - window_measure_visit
    kind: authorization
    condition: >-
      The final measure visit is booked only after the required deposit has been received in full.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_transactions.amount
    - window_transactions.payment_kind
    - window_contracts.contract_price
    - window_contracts.payment_method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
  params:
    deposit_pct: =booking_deposit_pct
    deposit_min: =booking_deposit_min
    financed_pct: =financed_deposit_pct
    due_days: =deposit_due_days
    measure_offer_days: =measure_booking_business_days
    card_limit: =card_payment_max_per_txn
  formula:
    required_deposit_cash: >-
      round(min(contract_price, max(contract_price * booking_deposit_pct, booking_deposit_min)), 2)
    required_deposit_financed: round(contract_price * financed_deposit_pct, 2)
- id: window_measure_visits
  subject:
  - window_measure_visit
  - window_measure_confirmed
  - window_fee_assessed
  rule: >-
    Measure appointments are performed by a Ridgeline measure technician at the home. A measure visit
    can be booked only while the contract status is signed or measured. A completed final measure confirms
    the openings and their sizes and moves the contract to measured with the measured opening count and
    the visit date. A customer_no_show (nobody gives access within 30 minutes of the appointment start)
    and a late_reschedule (a customer reschedule given with less than the series reschedule notice before
    the appointment start) are both missed appointments; a company_rescheduled appointment is never a
    missed appointment. The missed appointments of a contract are counted (window_msr_missed_measures);
    those up to the waived count carry no fee and each later one carries the series missed-appointment
    fee, assessed on the date of the missed appointment. A remeasure the customer asks for after the final
    measure is free up to the series free remeasure count (window_msr_customer_remeasures) and carries
    the series remeasure fee after that; a company_remeasure ordered by Ridgeline is always free and is
    not counted. A remeasure never changes the contract status.
  eligibility:
  - id: measure_status
    applies_to:
    - window_measure_visit
    kind: state
    condition: A measure visit can be booked only while the contract status is signed or measured.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - signed
      - measured
  params:
    notice_hours: =measure_reschedule_notice_hours
    waived_missed: =free_missed_measure_count
    missed_fee: =missed_measure_fee
    free_remeasures: =free_remeasure_count
    remeasure_charge: =remeasure_fee
  formula:
    missed_fee_due: missed_measure_fee if window_msr_missed_measures > free_missed_measure_count else
      0
    remeasure_fee_due: remeasure_fee if window_msr_customer_remeasures > free_remeasure_count else 0
  measures:
  - window_msr_missed_measures
  - window_msr_customer_remeasures
- id: window_oversize_pricing
  subject:
  - window_change_order
  - window_measure_visit
  rule: >-
    Each opening is sized in united inches, the measured width plus the measured height with each rounded
    up to the next whole inch, at the final measure. An opening up to the series standard bracket is priced
    in the base price. An opening above the standard bracket and up to the series maximum carries the
    series oversize surcharge per opening, written as one change order line of kind oversize_surcharge
    dated the final measure date for all such openings together; this line is not a customer change order
    and never counts toward the free or maximum change-order counts. An opening above the series maximum
    cannot be built in the series: before order release the customer either moves the contract to a series
    whose maximum covers it or removes that opening for credit.
  eligibility: []
  params:
    per_tier:
      Ridgeline 1100 Series Vinyl:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 2200 Series Vinyl:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 3300 Series Premium Vinyl:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 4400 Series Composite:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 5500 Series Fiberglass:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
      Ridgeline 6600 Series Wood-Clad:
        standard_bracket: =standard_ui_max
        series_max: =oversize_ui_max
        surcharge: =oversize_surcharge_per_opening
  formula:
    oversize_line_amount: round(oversize_surcharge_per_opening * openings_affected, 2)
- id: window_change_orders
  subject:
  - window_change_order
  - window_fee_assessed
  rule: >-
    A customer change order adds options or openings to the contract. A change order can be written only
    while the contract status is signed or measured. Once the order is released, the custom product is
    in production and no change order is accepted. Each line is priced at the series price per opening
    for the option times the openings affected; an added opening is priced at the series base price per
    opening, and options for an added opening are separate lines. Exterior color can be ordered only in
    a series where it is available. All lines written on the same date form one change order. A contract
    may carry no more customer change orders than the series maximum; a request beyond it is refused.
    The customer change orders of a contract are counted (window_msr_change_orders); those up to the series
    free count carry no fee, and each later change order carries the series change-order fee once, on
    the date it is written. Adding openings may not take the contract above the series maximum opening
    count.
  eligibility:
  - id: change_order_status
    applies_to:
    - window_change_order
    kind: state
    condition: A change order can be written only while the contract status is signed or measured.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - signed
      - measured
  params:
    free_count: =change_order_free_count
    fee: =change_order_fee
    max_count: =change_order_max_count
    option_prices:
      premium_low_e: =premium_low_e_per_opening
      triple_pane: =triple_pane_per_opening
      grilles_between_glass: =grilles_between_glass_per_opening
      exterior_color: =exterior_color_per_opening
      tempered_glass: =tempered_glass_per_opening
      laminated_glass: =laminated_glass_per_opening
      obscure_glass: =obscure_glass_per_opening
      hardware_finish: =hardware_finish_per_opening
      opening_added: =base_price_per_opening
    color_available: =exterior_color_available
  formula:
    opening_added_amount: round(base_price_per_opening * openings_affected, 2)
    change_order_fee_due: change_order_fee if window_msr_change_orders > change_order_free_count else
      0
  measures:
  - window_msr_change_orders
- id: window_price_credits
  subject:
  - window_price_credit
  rule: >-
    Credits reduce what is owed and are additive with one another, except as stated here. An opening_removed
    credit is granted only before order release (status signed or measured) and equals the series removal
    share of the base price per opening times the openings removed; if the removal would leave fewer openings
    than the minimum that must remain or bring the contract below the series minimum contract amount,
    the removal is not made and the cancellation terms apply instead. A door_bundle_discount credit equals
    the series bundle percentage of the signed contract price; it is granted on the window contract when
    the customer signs a Ridgeline door contract within the bundle window of calendar days before or after
    this contract's signed date and neither contract is cancelled, and once per pair of contracts. The
    door bundle discount is granted only when the contract's discount program is none. A referral_credit
    of the series referral amount is granted when a household the customer referred signs its own Ridgeline
    contract and that contract reaches installed status, once per referred contract number and at most
    the series maximum per contract (window_msr_referral_credits). An on_time_guarantee_credit is the
    amount the factory order charter computes and is booked when that order's credit is applied. Credits
    are never paid out in cash while a balance is owed; a credit that takes the amount owed below zero
    becomes an overpayment refunded under the refund rules.
  eligibility:
  - id: bundle_vs_program
    applies_to:
    - window_price_credit
    kind: state
    condition: The door bundle discount is granted only when the contract's discount program is none.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.discount_program
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.discount_program
      allowed:
      - none
  params:
    removal_share: =opening_removed_credit_pct
    min_remaining: =min_openings_after_removal
    bundle_window: =door_bundle_window_days
    per_tier:
      Ridgeline 1100 Series Vinyl:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 2200 Series Vinyl:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 3300 Series Premium Vinyl:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 4400 Series Composite:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 5500 Series Fiberglass:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
      Ridgeline 6600 Series Wood-Clad:
        bundle_pct: =door_bundle_discount_pct
        referral_amount: =referral_credit_amount
        referral_max: =referral_credit_max_per_contract
  formula:
    opening_removed_credit: round(base_price_per_opening * opening_removed_credit_pct * openings_affected,
      2)
    door_bundle_credit: round(contract_price * door_bundle_discount_pct, 2)
  measures:
  - window_msr_referral_credits
- id: window_series_change
  subject:
  - window_series_changed
  - window_fee_assessed
  rule: >-
    A contract may move to another product series, up or down, only before order release. A series change
    can be made only while the contract status is signed or measured. The re-priced contract price is
    the current contract price plus the difference between the new and the old series base price per opening
    times the current opening count, before any discount program; where the contract carries a discount
    program, the program rate of the new series is applied to the re-priced list price instead. Option
    lines already written stay at the price they were written at. A change into a series where exterior
    color is unavailable cannot be made while the contract carries an exterior_color line. A series change
    made while the contract is measured carries the series redesign fee of the new series; one made while
    it is signed carries none. If the new series raises the required deposit, the difference is due before
    order release.
  eligibility:
  - id: series_change_status
    applies_to:
    - window_series_changed
    kind: state
    condition: A series change can be made only while the contract status is signed or measured.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - signed
      - measured
  params:
    redesign_fee: =series_change_fee
- id: window_order_release
  subject:
  - window_order_released
  rule: >-
    The confirmed specifications are released to the factory once the contract is measured. The order
    may be released only after the required booking deposit has been received in full. For an in_home
    sale, the order may be released only once the cooling-off period counted from the contract signing
    date has fully passed. Business days are counted starting the day after the contract signing date,
    skipping Sundays and U.S. federal holidays, so Saturdays count as business days. Release on the last
    day of the cooling-off period is too early; the first permitted release date is the next calendar
    day. Showroom and virtual_consultation sales carry no cooling-off wait. Release creates the factory
    production order for the contract.
  eligibility:
  - id: deposit_complete
    applies_to:
    - window_order_released
    kind: authorization
    condition: >-
      The order may be released only after the required booking deposit has been received in full.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_transactions.amount
    - window_transactions.payment_kind
    - window_contracts.contract_price
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
  - id: cooling_off_elapsed
    applies_to:
    - window_order_released
    kind: time
    condition: >-
      For an in_home sale, the order may be released only once the cooling-off period counted from the
      contract signing date has fully passed.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.signed_date
    - window_contracts.sales_channel
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contract signing date
      anchor_source: window_contracts.signed_date
      relation: not_before
      duration_source: variants.cooling_off_business_days
      unit: business_days
      counting_rule: >-
        Business days are counted starting the day after the contract signing date, skipping Sundays and
        U.S. federal holidays, so Saturdays count as business days.
      boundary: exclusive
  params:
    cooling_off_days: =cooling_off_business_days
- id: window_cooling_off_cancellation
  subject:
  - window_contract_cancelled
  - window_refund_issued
  rule: >-
    A sale made in the customer's home carries the federal three-day cooling-off right printed on the
    contract. The cooling-off right applies only to contracts whose sales channel is in_home. A cancellation
    qualifies for the cooling-off terms only when the customer's written notice of cancellation is given
    no later than the end of the cooling-off period counted from the contract signing date. Business days
    are counted starting the day after the contract signing date, skipping Sundays and U.S. federal holidays,
    so Saturdays count as business days, and notice given on the last counted business day still qualifies.
    Written notice is the signed Notice of Cancellation form, an email to the contract inbox or a letter,
    dated the day it is given or postmarked, and is recorded as a cancellation request. A qualifying cancellation
    carries no fee or charge of any kind, and every payment received is refunded in full, each against
    its own source payment, within the refund window counted in business days from receipt of the notice.
    Notice given after the period ends, or on a showroom or virtual_consultation contract, is handled
    under the standard cancellation terms.
  eligibility:
  - id: in_home_only
    applies_to:
    - window_contract_cancelled
    - window_refund_issued
    kind: authorization
    condition: The cooling-off right applies only to contracts whose sales channel is in_home.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.sales_channel
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
  - id: notice_in_period
    applies_to:
    - window_contract_cancelled
    kind: time
    condition: >-
      A cancellation qualifies for the cooling-off terms only when the customer's written notice of cancellation
      is given no later than the end of the cooling-off period counted from the contract signing date.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.signed_date
    - window_cancellation_requests.notice_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the contract signing date
      anchor_source: window_contracts.signed_date
      relation: not_after
      duration_source: variants.cooling_off_business_days
      unit: business_days
      counting_rule: >-
        Business days are counted starting the day after the contract signing date, skipping Sundays and
        U.S. federal holidays, so Saturdays count as business days, and notice given on the last counted
        business day still qualifies.
      boundary: inclusive
  params:
    period_days: =cooling_off_business_days
    refund_days: =cooling_off_refund_business_days
  formula:
    cooling_off_refund_total: window_msr_paid_to_date
    cooling_off_fee: 0
  measures:
  - window_msr_paid_to_date
- id: window_standard_cancellation
  subject:
  - window_contract_cancelled
  - window_fee_assessed
  - window_refund_issued
  rule: >-
    A cancellation that does not qualify for the cooling-off terms is settled by the contract status on
    the date the written notice is given. In status signed the charge is the series pre-measure cancellation
    fee; in status measured it is the series measure-and-design charge; in status ordered it is the series
    product share of the adjusted contract value, which is the signed contract price plus the net contract
    charges (window_msr_net_charges) before the cancellation charge itself. A contract that is installed
    or closed cannot be cancelled; the customer's remedies after installation run through the service
    and warranty terms. The charge is booked as one cancellation_charge fee on the notice date. Payments
    received (window_msr_paid_to_date) are kept up to the charge; the excess is refunded as cancellation_refund
    within the refund window, taken from the most recent payments first, each refund naming its source
    payment. When payments received are below the charge, the difference stays owed. Once a contract is
    cancelled, no further change order, measure visit, or price credit other than an on_time_guarantee_credit
    already earned is booked to it.
  eligibility: []
  params:
    per_tier:
      Ridgeline 1100 Series Vinyl:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 2200 Series Vinyl:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 3300 Series Premium Vinyl:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 4400 Series Composite:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 5500 Series Fiberglass:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
      Ridgeline 6600 Series Wood-Clad:
        signed: =pre_measure_cancellation_fee
        measured: =pre_release_cancellation_fee
        ordered_share: =post_release_product_share_pct
    refund_days: =refund_business_days
  formula:
    charge_if_signed: pre_measure_cancellation_fee
    charge_if_measured: pre_release_cancellation_fee
    charge_if_ordered: round(post_release_product_share_pct * (contract_price + window_msr_net_charges),
      2)
    refund_if_ordered: max(0, window_msr_paid_to_date - charge_if_ordered)
  measures:
  - window_msr_net_charges
  - window_msr_paid_to_date
- id: window_final_balance
  subject:
  - window_installation_completed
  - window_payment_received
  - window_fee_assessed
  - window_contract_closed
  rule: >-
    The balance due on a contract is the signed contract price plus the net contract charges (window_msr_net_charges)
    minus the payments received net of refunds (window_msr_paid_to_date). The net charges of the contract's
    installation job are collected with it, so the amount due at the end is the balance due plus those
    job charges. The remaining balance falls due on the final balance due date, the stated number of calendar
    days after the installation completion date, and is recorded as final_balance when paid. For a financed
    contract, the lender funding is recorded as lender_funding on the funding date and any remainder is
    paid by the customer. A late balance charge applies only while the contract status is installed. A
    late balance charge may be assessed only when the balance remains unpaid after the final balance due
    date, which falls the stated number of calendar days after the installation completion date. Calendar
    days are counted from the day after the installation completion date, and payment on the due date
    itself is on time. The late charge is the monthly rate times the unpaid balance for each full 30-day
    period after the due date, never less than the minimum charge, assessed once at the end of each such
    period. The contract closes once it is installed and the balance due is zero; an overpayment at that
    point is refunded as overpayment_refund.
  eligibility:
  - id: late_charge_status
    applies_to:
    - window_fee_assessed
    kind: state
    condition: A late balance charge applies only while the contract status is installed.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    state_contract:
      field: window_contracts.status
      allowed:
      - installed
  - id: past_due_date
    applies_to:
    - window_fee_assessed
    kind: time
    condition: >-
      A late balance charge may be assessed only when the balance remains unpaid after the final balance
      due date, which falls the stated number of calendar days after the installation completion date.
    evidence_fields:
    - window_contracts.window_contract_id
    - window_contracts.completion_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_contracts.window_contract_id
      action_bindings:
        window_contracts.window_contract_id: window_contract_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the installation completion date
      anchor_source: window_contracts.completion_date
      relation: not_before
      duration_source: variants.final_balance_due_days
      unit: calendar_days
      counting_rule: >-
        Calendar days are counted from the day after the installation completion date, and payment on
        the due date itself is on time.
      boundary: exclusive
  params:
    due_days: =final_balance_due_days
    late_rate: =late_balance_monthly_rate
    late_min: =late_balance_min_charge
  formula:
    balance_due: round(contract_price + window_msr_net_charges - window_msr_paid_to_date, 2)
    late_charge_per_period: max(late_balance_min_charge, round(late_balance_monthly_rate * balance_due,
      2))
  measures:
  - window_msr_net_charges
  - window_msr_paid_to_date
- id: window_refunds
  subject:
  - window_refund_issued
  rule: >-
    A refund returns money from one specific earlier payment and is never larger than what remains unrefunded
    of that payment. Refunds go back by the tender rule: to the card or bank account a card or ACH payment
    came from, and by mailed check for a check payment; lender funding is never refunded to the customer
    and is instead returned to the lender by the financing account's terms. A payment that has already
    been refunded in full is never refunded again. A non-cooling-off refund is issued within the refund
    window counted in business days from the date it becomes due.
  eligibility:
  - id: no_double_refund
    applies_to:
    - window_refund_issued
    kind: dedup
    condition: A payment that has already been refunded in full is never refunded again.
    evidence_fields:
    - window_transactions.source_window_txn_id
    - window_transactions.amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - window_transactions.source_window_txn_id
      action_bindings:
        window_transactions.source_window_txn_id: source_window_txn_id
    dedup_contract:
      table: window_transactions
      mode: separate_record
      object_bindings:
        source_window_txn_id: source_window_txn_id
      duplicate_filters:
        event_type:
        - window_refund_issued
      distinct_fields:
      - refund_kind
      - txn_date
  params:
    tender_rule: =refund_tender_rule
    refund_days: =refund_business_days

extended_policies:
- id: window_ext_remeasure_fee
  base_policy_refs: [window_measure_visits, window_change_orders, window_series_change, window_standard_cancellation, window_final_balance, window_oversize_pricing]
  overwrite:
  - base_policy: window_measure_visits
    superseded_clause: >-
      carries the series remeasure fee after that
    replaced_by: >-
      For a customer-requested remeasure beyond the series free remeasure count, and only for such a remeasure, the remeasure fee is the amount figured under these terms instead of the series remeasure fee as it stands; remeasures within the free count stay free, and a company remeasure ordered by Ridgeline stays free and uncounted under the base rule.
  trigger: state_due
  subject: [window_fee_assessed]
  computes: amount
  target_tool: post_remeasure_fee_bdabfe19
  params:
    quick_check_openings: 2
    late_remeasure_days: 10
    early_remeasure_days: 3
    late_remeasure_share: 1.25
    early_remeasure_share: 0.75
    same_trip_days: 3
    recent_check_days: 14
    same_trip_share: 0.75
    recent_check_share: 0.9
    many_oversize_count: 3
    many_oversize_share: 1.25
    some_oversize_share: 1.1
  rule: >-
    A remeasure the customer asks for after the final measure is free up to the series free remeasure count.
    For a customer-requested remeasure beyond the series free remeasure count, and only for such a remeasure, the remeasure fee is the amount figured under these terms instead of the series remeasure fee as it stands; remeasures within the free count stay free, and a company remeasure ordered by Ridgeline stays free and uncounted under the base rule.
    The remeasure fee is booked as one remeasure fee entry dated the day of the remeasure it charges.
    The remeasure fee is figured for the most recent customer-requested remeasure recorded as completed on the contract.
    The standard remeasure fee is the series remeasure fee.
    How the remeasure fee is figured depends on how many openings that remeasure covered: a remeasure of no more than the quick-check opening limit is charged the lesser of the series remeasure fee and the series missed-appointment fee; a remeasure of more than the quick-check opening limit but of fewer than half of the openings on the contract is charged the series remeasure fee times the openings remeasured divided by the openings on the contract; any other remeasure, covering half or more of the openings on the contract, is charged the series remeasure fee.
    The remeasure fee is multiplied by a remeasure timing share set by the calendar days from the final measure date to the remeasure date: a remeasure more than the late-remeasure day count after the final measure takes the late-remeasure share; a remeasure no more than the early-remeasure day count after the final measure takes the early-remeasure share; any other remeasure takes a share of one.
    The remeasure fee is also multiplied by a company-check share set by the calendar days from the latest completed company remeasure ordered by Ridgeline on the contract to the remeasure date: when that company remeasure took place on the remeasure date or no more than the same-trip day count before it, the same-trip share; more than the same-trip day count but no more than the recent-check day count before it, the recent-check share; a contract with no completed company remeasure, or whose latest one took place after the remeasure date or further before it, takes a share of one.
    The remeasure fee is further multiplied by an oversize review share set by the openings the completed final measure recorded above the series standard united-inch bracket: at least the many-oversize count takes the many-oversize share, at least one but fewer than the many-oversize count takes the some-oversize share, and none takes a share of one.
    The three shares are applied together to the amount the opening coverage gives, and the product is rounded to the cent once, at the end.
  prerequisite: []
  cross_category: []
  compute:
  - last_remeasure_date: "LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_measure_visit', visit_kind='remeasure', visit_outcome='completed')"
  - remeasured_openings: "LATEST('window_transactions', 'openings_affected', date_field='txn_date', event_type='window_measure_visit', visit_kind='remeasure', visit_outcome='completed')"
  - contract_openings: "F('opening_count')"
  - remeasure_scope_amount: "MN(P('remeasure_fee'), P('missed_measure_fee')) if remeasured_openings <= K('quick_check_openings') else (P('remeasure_fee') * remeasured_openings / contract_openings if remeasured_openings * 2 < contract_openings else P('remeasure_fee'))"
  - days_after_final_measure: "DAYS(F('measure_date'), last_remeasure_date)"
  - remeasure_timing_share: "K('late_remeasure_share') if days_after_final_measure > K('late_remeasure_days') else (K('early_remeasure_share') if days_after_final_measure <= K('early_remeasure_days') else 1.0)"
  - last_company_check: "LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_measure_visit', visit_kind='company_remeasure', visit_outcome='completed')"
  - days_after_company_check: "DAYS(last_company_check, last_remeasure_date) if last_company_check != None else -1"
  - company_check_share: "K('same_trip_share') if (last_company_check != None and 0 <= days_after_company_check <= K('same_trip_days')) else (K('recent_check_share') if (last_company_check != None and K('same_trip_days') < days_after_company_check <= K('recent_check_days')) else 1.0)"
  - final_measure_oversize: "MAX('window_transactions', 'oversize_opening_count', event_type='window_measure_visit', visit_kind='final_measure', visit_outcome='completed')"
  - oversize_review_share: "K('many_oversize_share') if final_measure_oversize >= K('many_oversize_count') else (K('some_oversize_share') if final_measure_oversize >= 1 else 1.0)"
  - result: "RND(remeasure_scope_amount * remeasure_timing_share * company_check_share * oversize_review_share, 2)"
  compute_basis:
    last_remeasure_date: "The remeasure fee is figured for the most recent customer-requested remeasure recorded as completed on the contract."
    remeasured_openings: "How the remeasure fee is figured depends on how many openings that remeasure covered"
    contract_openings: "a remeasure of more than the quick-check opening limit but of fewer than half of the openings on the contract is charged the series remeasure fee times the openings remeasured divided by the openings on the contract"
    remeasure_scope_amount: "How the remeasure fee is figured depends on how many openings that remeasure covered: a remeasure of no more than the quick-check opening limit is charged the lesser of the series remeasure fee and the series missed-appointment fee; a remeasure of more than the quick-check opening limit but of fewer than half of the openings on the contract is charged the series remeasure fee times the openings remeasured divided by the openings on the contract; any other remeasure, covering half or more of the openings on the contract, is charged the series remeasure fee."
    days_after_final_measure: "The remeasure fee is multiplied by a remeasure timing share set by the calendar days from the final measure date to the remeasure date"
    remeasure_timing_share: "a remeasure more than the late-remeasure day count after the final measure takes the late-remeasure share; a remeasure no more than the early-remeasure day count after the final measure takes the early-remeasure share; any other remeasure takes a share of one."
    last_company_check: "The remeasure fee is also multiplied by a company-check share set by the calendar days from the latest completed company remeasure ordered by Ridgeline on the contract to the remeasure date"
    days_after_company_check: "set by the calendar days from the latest completed company remeasure ordered by Ridgeline on the contract to the remeasure date"
    company_check_share: "when that company remeasure took place on the remeasure date or no more than the same-trip day count before it, the same-trip share; more than the same-trip day count but no more than the recent-check day count before it, the recent-check share; a contract with no completed company remeasure, or whose latest one took place after the remeasure date or further before it, takes a share of one."
    final_measure_oversize: "The remeasure fee is further multiplied by an oversize review share set by the openings the completed final measure recorded above the series standard united-inch bracket"
    oversize_review_share: "at least the many-oversize count takes the many-oversize share, at least one but fewer than the many-oversize count takes the some-oversize share, and none takes a share of one."
    result: "The three shares are applied together to the amount the opening coverage gives, and the product is rounded to the cent once, at the end."
  factors:
  - id: remeasure_opening_coverage
    effect: method
    decides: remeasure_scope_amount
    bindings: [remeasured_openings, contract_openings, remeasure_scope_amount]
    ladder:
    - when: "the most recent completed customer-requested remeasure covered no more than the quick-check opening limit"
      method: "the remeasure fee is the lesser of the series remeasure fee and the series missed-appointment fee"
    - when: "it covered more than the quick-check opening limit but fewer than half of the openings on the contract"
      method: "the remeasure fee is prorated: the series remeasure fee times the openings remeasured divided by the openings on the contract"
    - when: "otherwise (it covered half or more of the openings on the contract)"
      method: "the remeasure fee is the series remeasure fee, charged flat"
    baseline:
      remeasure_scope_amount: "P('remeasure_fee')"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: remeasure_timing_share
    effect: parameter
    decides: remeasure_timing_share
    bindings: [last_remeasure_date, days_after_final_measure, remeasure_timing_share]
    ladder:
    - when: "the remeasure took place more than the late-remeasure day count after the final measure date"
      value: "K('late_remeasure_share')"
    - when: "the remeasure took place no more than the early-remeasure day count after the final measure date"
      value: "K('early_remeasure_share')"
    - when: "otherwise"
      value: "1.0"
    baseline:
      remeasure_timing_share: "1.0"
    evidence: [history, date]
    cross_difficulty: null
  - id: company_check_share
    effect: parameter
    decides: company_check_share
    bindings: [last_company_check, days_after_company_check, company_check_share]
    ladder:
    - when: "the contract's latest completed company remeasure ordered by Ridgeline took place on the remeasure date or no more than the same-trip day count before it"
      value: "K('same_trip_share')"
    - when: "that latest company remeasure took place more than the same-trip day count but no more than the recent-check day count before the remeasure date"
      value: "K('recent_check_share')"
    - when: "otherwise (no completed company remeasure, or the latest one is after the remeasure date or further before it)"
      value: "1.0"
    baseline:
      company_check_share: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: oversize_review_share
    effect: parameter
    decides: oversize_review_share
    bindings: [final_measure_oversize, oversize_review_share]
    ladder:
    - when: "the completed final measure recorded at least the many-oversize count of openings above the series standard bracket"
      value: "K('many_oversize_share')"
    - when: "it recorded at least one such opening but fewer than the many-oversize count"
      value: "K('some_oversize_share')"
    - when: "otherwise (no oversize opening)"
      value: "1.0"
    baseline:
      oversize_review_share: "1.0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The remeasure fee is figured for the most recent customer-requested remeasure recorded as completed on the contract.
      The standard remeasure fee is the series remeasure fee.
    params: [remeasure_fee]
  inputs:
    history:
    - {table: window_transactions, aggregate: latest, field: openings_affected, filters: {event_type: window_measure_visit, visit_kind: remeasure, visit_outcome: completed}}
    - {table: window_transactions, aggregate: latest, field: txn_date, filters: {event_type: window_measure_visit, visit_kind: company_remeasure, visit_outcome: completed}}
    - {table: window_transactions, aggregate: max, field: oversize_opening_count, filters: {event_type: window_measure_visit, visit_kind: final_measure, visit_outcome: completed}}
    cross_category: []
- id: window_ext_change_order_fee
  base_policy_refs: [window_change_orders, window_measure_visits, window_series_change, window_standard_cancellation, window_final_balance]
  overwrite:
  - base_policy: window_change_orders
    superseded_clause: >-
      each later change order carries the series change-order fee once, on the date it is written
    replaced_by: >-
      For a customer change order beyond the series free count, and only for such a change order, the change-order fee is the amount figured under these terms instead of the series change-order fee as it stands, still charged once and dated the day the change order was written; change orders within the free count stay free under the base rule.
  trigger: state_due
  subject: [window_fee_assessed]
  computes: amount
  target_tool: post_change_order_fee_bcbd2cec
  params:
    per_added_opening_charge: 40
    extra_line_charge: 20
    late_change_days: 10
    late_change_share: 1.5
    pre_measure_change_share: 0.5
    factory_paint_share: 1.5
    specialty_glass_share: 1.25
    many_openings_count: 10
    few_openings_count: 3
    many_openings_share: 1.25
    few_openings_share: 0.75
    promotional_plan_share: 1.5
    term_plan_share: 1.25
    long_standing_months: 60
    long_standing_share: 0.5
    recent_standing_share: 0.75
  rule: >-
    For a customer change order beyond the series free count, and only for such a change order, the change-order fee is the amount figured under these terms instead of the series change-order fee as it stands, still charged once and dated the day the change order was written; change orders within the free count stay free under the base rule.
    The change-order fee is figured for the most recent customer change order on the contract, that is every customer change-order line written on the latest date that carries customer change-order lines; an oversize surcharge line is never a customer change-order line.
    The standard change-order fee is the series change-order fee.
    How the change-order fee is figured depends on what the change order does: a change order that adds openings is charged the per-added-opening charge times the openings it adds, never less than the series change-order fee; a change order that adds no opening but writes two or more lines is charged the series change-order fee plus the extra-line charge for each line beyond the first; any other change order is charged the series change-order fee.
    The change-order fee is multiplied by a change timing share: a change order written before the final measure, or on a contract not yet measured, takes the pre-measure change share; a change order written more than the late-change day count after the final measure date, counted in calendar days, takes the late-change share; any other change order takes a share of one.
    The change-order fee is multiplied by a special-order share: a change order with an exterior color line takes the factory-paint share; a change order with a laminated glass or obscure glass line and no exterior color line takes the specialty-glass share; any other change order takes a share of one.
    The change-order fee is multiplied by a change size share set by the openings priced across all customer lines of the change order: at least the many-openings count takes the many-openings share; fewer than the few-openings count takes the few-openings share; any other change order takes a share of one.
    The contract's financing plan is the plan of its Ridgeline financing account in force (approved, active, delinquent or paid off); a cancelled or charged-off account is never read.
    The change-order fee is multiplied by a lender paperwork share: a contract paid by Ridgeline financing whose financing plan carries a promotional period takes the promotional-plan share; a contract paid by Ridgeline financing on a plan without a promotional period takes the term-plan share; any other contract, whether paid by cash, check or card or carrying no financing plan on record, takes a share of one.
    The change-order fee is multiplied by a returning-household share: a household whose most recently closed Ridgeline door contract was closed at least the long-standing month count of whole months before the change order date takes the long-standing share; a household whose most recently closed door contract was closed before the change order date but fewer whole months before it takes the recent-standing share; any other household, including one with no closed door contract, takes a share of one.
    The five shares are applied together to the amount the change order's scope gives, and the product is rounded to the cent once, at the end.
  prerequisite: []
  cross_category:
  - category: finance
    as: branch
    reads: [promo_months]
    note: The lender paperwork share is decided from the promotional period of the financing plan held on this window contract.
  - category: door
    as: branch
    reads: [door_contracts.closed_date, status]
    note: The returning-household share is decided from the closing date of the household's most recently closed Ridgeline door contract.
  compute:
  - last_change_date: "MX(LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='premium_low_e') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='triple_pane') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='grilles_between_glass') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='exterior_color') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='tempered_glass') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='laminated_glass') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='obscure_glass') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='hardware_finish') or '', LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_change_order', change_kind='opening_added') or '')"
  - change_lines: "COUNT('window_transactions', event_type='window_change_order', txn_date=last_change_date) - COUNT('window_transactions', event_type='window_change_order', change_kind='oversize_surcharge', txn_date=last_change_date)"
  - openings_added: "SUM('window_transactions', 'openings_affected', event_type='window_change_order', change_kind='opening_added', txn_date=last_change_date)"
  - change_scope_amount: "MX(P('change_order_fee'), K('per_added_opening_charge') * openings_added) if openings_added > 0 else (P('change_order_fee') + K('extra_line_charge') * (change_lines - 1) if change_lines >= 2 else P('change_order_fee'))"
  - change_timing_share: "K('pre_measure_change_share') if (F('measure_date') == '' or last_change_date < F('measure_date')) else (K('late_change_share') if DAYS(F('measure_date'), last_change_date) > K('late_change_days') else 1.0)"
  - paint_lines: "COUNT('window_transactions', event_type='window_change_order', change_kind='exterior_color', txn_date=last_change_date)"
  - specialty_glass_lines: "COUNT('window_transactions', event_type='window_change_order', change_kind='laminated_glass', txn_date=last_change_date) + COUNT('window_transactions', event_type='window_change_order', change_kind='obscure_glass', txn_date=last_change_date)"
  - special_order_share: "K('factory_paint_share') if paint_lines > 0 else (K('specialty_glass_share') if specialty_glass_lines > 0 else 1.0)"
  - openings_priced: "SUM('window_transactions', 'openings_affected', event_type='window_change_order', txn_date=last_change_date) - SUM('window_transactions', 'openings_affected', event_type='window_change_order', change_kind='oversize_surcharge', txn_date=last_change_date)"
  - change_size_share: "K('many_openings_share') if openings_priced >= K('many_openings_count') else (K('few_openings_share') if openings_priced < K('few_openings_count') else 1.0)"
  - plan_promo_months: "CPARAM('finance', 'promo_months', finance_account_id=(CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='active') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='approved') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='delinquent') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='paid_off')))"
  - lender_paperwork_share: "K('promotional_plan_share') if (F('payment_method') == 'ridgeline_financing' and plan_promo_months != None and plan_promo_months > 0) else (K('term_plan_share') if (F('payment_method') == 'ridgeline_financing' and plan_promo_months != None) else 1.0)"
  - last_door_closed: "XLATEST('door', 'door_contracts', 'closed_date', date_field='closed_date', status='closed')"
  - returning_household_share: "K('long_standing_share') if (last_door_closed != None and last_door_closed < last_change_date and MONTHS(last_door_closed, last_change_date) >= K('long_standing_months')) else (K('recent_standing_share') if (last_door_closed != None and last_door_closed < last_change_date) else 1.0)"
  - result: "RND(change_scope_amount * change_timing_share * special_order_share * change_size_share * lender_paperwork_share * returning_household_share, 2)"
  compute_basis:
    last_change_date: "The change-order fee is figured for the most recent customer change order on the contract, that is every customer change-order line written on the latest date that carries customer change-order lines; an oversize surcharge line is never a customer change-order line."
    change_lines: "a change order that adds no opening but writes two or more lines is charged the series change-order fee plus the extra-line charge for each line beyond the first"
    openings_added: "a change order that adds openings is charged the per-added-opening charge times the openings it adds, never less than the series change-order fee"
    change_scope_amount: "How the change-order fee is figured depends on what the change order does: a change order that adds openings is charged the per-added-opening charge times the openings it adds, never less than the series change-order fee; a change order that adds no opening but writes two or more lines is charged the series change-order fee plus the extra-line charge for each line beyond the first; any other change order is charged the series change-order fee."
    change_timing_share: "The change-order fee is multiplied by a change timing share: a change order written before the final measure, or on a contract not yet measured, takes the pre-measure change share; a change order written more than the late-change day count after the final measure date, counted in calendar days, takes the late-change share; any other change order takes a share of one."
    paint_lines: "a change order with an exterior color line takes the factory-paint share"
    specialty_glass_lines: "a change order with a laminated glass or obscure glass line and no exterior color line takes the specialty-glass share"
    special_order_share: "The change-order fee is multiplied by a special-order share: a change order with an exterior color line takes the factory-paint share; a change order with a laminated glass or obscure glass line and no exterior color line takes the specialty-glass share; any other change order takes a share of one."
    openings_priced: "The change-order fee is multiplied by a change size share set by the openings priced across all customer lines of the change order"
    change_size_share: "at least the many-openings count takes the many-openings share; fewer than the few-openings count takes the few-openings share; any other change order takes a share of one."
    plan_promo_months: "The contract's financing plan is the plan of its Ridgeline financing account in force (approved, active, delinquent or paid off); a cancelled or charged-off account is never read."
    lender_paperwork_share: "The change-order fee is multiplied by a lender paperwork share: a contract paid by Ridgeline financing whose financing plan carries a promotional period takes the promotional-plan share; a contract paid by Ridgeline financing on a plan without a promotional period takes the term-plan share; any other contract, whether paid by cash, check or card or carrying no financing plan on record, takes a share of one."
    last_door_closed: "a household whose most recently closed Ridgeline door contract was closed at least the long-standing month count of whole months before the change order date takes the long-standing share"
    returning_household_share: "The change-order fee is multiplied by a returning-household share: a household whose most recently closed Ridgeline door contract was closed at least the long-standing month count of whole months before the change order date takes the long-standing share; a household whose most recently closed door contract was closed before the change order date but fewer whole months before it takes the recent-standing share; any other household, including one with no closed door contract, takes a share of one."
    result: "The five shares are applied together to the amount the change order's scope gives, and the product is rounded to the cent once, at the end."
  factors:
  - id: change_scope_method
    effect: method
    decides: change_scope_amount
    bindings: [change_lines, openings_added, change_scope_amount]
    ladder:
    - when: "the most recent customer change order adds openings"
      method: "the change-order fee is the per-added-opening charge times the openings added, never less than the series change-order fee"
    - when: "it adds no opening but writes two or more lines"
      method: "the change-order fee is the series change-order fee plus the extra-line charge for each line beyond the first"
    - when: "otherwise (a single line that adds no opening)"
      method: "the change-order fee is the series change-order fee, charged flat"
    baseline:
      change_scope_amount: "P('change_order_fee')"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: change_timing_share
    effect: parameter
    decides: change_timing_share
    bindings: [last_change_date, change_timing_share]
    ladder:
    - when: "the change order was written before the final measure date, or the contract has no final measure yet"
      value: "K('pre_measure_change_share')"
    - when: "the change order was written more than the late-change day count after the final measure date"
      value: "K('late_change_share')"
    - when: "otherwise"
      value: "1.0"
    baseline:
      change_timing_share: "1.0"
    evidence: [history, date]
    cross_difficulty: null
  - id: special_order_change_share
    effect: parameter
    decides: special_order_share
    bindings: [paint_lines, specialty_glass_lines, special_order_share]
    ladder:
    - when: "the change order carries an exterior color line"
      value: "K('factory_paint_share')"
    - when: "the change order carries a laminated glass or obscure glass line and no exterior color line"
      value: "K('specialty_glass_share')"
    - when: "otherwise"
      value: "1.0"
    baseline:
      special_order_share: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: change_size_share
    effect: parameter
    decides: change_size_share
    bindings: [openings_priced, change_size_share]
    ladder:
    - when: "the change order's lines price at least the many-openings count of openings in total"
      value: "K('many_openings_share')"
    - when: "they price fewer than the few-openings count of openings in total"
      value: "K('few_openings_share')"
    - when: "otherwise"
      value: "1.0"
    baseline:
      change_size_share: "1.0"
    evidence: [history]
    cross_difficulty: null
  - id: lender_paperwork_share
    effect: parameter
    decides: lender_paperwork_share
    bindings: [plan_promo_months, lender_paperwork_share]
    ladder:
    - when: "the contract is paid by Ridgeline financing and its financing plan carries a promotional period"
      value: "K('promotional_plan_share')"
    - when: "the contract is paid by Ridgeline financing and its financing plan carries no promotional period"
      value: "K('term_plan_share')"
    - when: "otherwise (paid by cash, check or card, or no financing plan on record)"
      value: "1.0"
    baseline:
      lender_paperwork_share: "1.0"
    evidence: [cross_category, tier_param]
    cross_difficulty: finance
  - id: returning_household_share
    effect: parameter
    decides: returning_household_share
    bindings: [last_door_closed, returning_household_share]
    ladder:
    - when: "the household's most recently closed Ridgeline door contract was closed at least the long-standing month count of whole months before the change order date"
      value: "K('long_standing_share')"
    - when: "that most recently closed door contract was closed before the change order date but fewer whole months before it"
      value: "K('recent_standing_share')"
    - when: "otherwise: any other household, including one with no closed door contract and one whose most recently closed door contract closed on or after the change order date"
      value: "1.0"
    baseline:
      returning_household_share: "1.0"
    evidence: [cross_category, date]
    cross_difficulty: door
  baseline:
    rule: >-
      The change-order fee is figured for the most recent customer change order on the contract, that is every customer change-order line written on the latest date that carries customer change-order lines; an oversize surcharge line is never a customer change-order line.
      The standard change-order fee is the series change-order fee.
    params: [change_order_fee]
  inputs:
    history:
    - {table: window_transactions, aggregate: latest, field: txn_date, filters: {event_type: window_change_order, change_kind: [premium_low_e, triple_pane, grilles_between_glass, exterior_color, tempered_glass, laminated_glass, obscure_glass, hardware_finish, opening_added]}}
    - {table: window_transactions, aggregate: count, field: window_txn_id, filters: {event_type: window_change_order}}
    - {table: window_transactions, aggregate: count, field: window_txn_id, filters: {event_type: window_change_order, change_kind: oversize_surcharge}}
    - {table: window_transactions, aggregate: sum, field: openings_affected, filters: {event_type: window_change_order}}
    - {table: window_transactions, aggregate: sum, field: openings_affected, filters: {event_type: window_change_order, change_kind: oversize_surcharge}}
    cross_category: [finance, door]
- id: window_ext_late_balance_charge
  base_policy_refs: [window_final_balance, window_measure_visits, window_change_orders, window_series_change, window_standard_cancellation]
  overwrite:
  - base_policy: window_final_balance
    superseded_clause: >-
      The late charge is the monthly rate times the unpaid balance for each full 30-day period after the due date, never less than the minimum charge, assessed once at the end of each such period.
    replaced_by: >-
      For a late balance charge on an installed contract, and only for such a charge, the late charge is figured under these terms instead: each full 30-day late period is charged the late-rate amount, which is the series monthly rate times the account-standing share times the catch-up share times the late-charge balance rounded to the cent, combined with the series minimum charge as the minimum-charge terms below set out; full periods are counted from the late-charge start date rather than from the final balance due date, and every full period that has ended without a late balance charge is charged in one late balance charge entry dated the day it is booked, so a full period counts as already charged when it ended on or before the date of the contract's latest late balance charge entry; the final balance due date itself, and the rule that no late balance charge is assessed before it, stay as the base rule states them.
  trigger: state_due
  subject: [window_fee_assessed]
  computes: amount
  target_tool: post_late_balance_charge_0f8afea0
  params:
    autopay_grace_days: 10
    manual_pay_grace_days: 5
    goodwill_both_days: 14
    goodwill_one_days: 7
    period_days: 30
    clean_paying_share: 0.5
    clean_new_share: 0.8
    stale_period_days: 30
    aging_period_days: 15
    stale_period_share: 0.5
    aging_period_share: 0.75
  rule: >-
    For a late balance charge on an installed contract, and only for such a charge, the late charge is figured under these terms instead: each full 30-day late period is charged the late-rate amount, which is the series monthly rate times the account-standing share times the catch-up share times the late-charge balance rounded to the cent, combined with the series minimum charge as the minimum-charge terms below set out; full periods are counted from the late-charge start date rather than from the final balance due date, and every full period that has ended without a late balance charge is charged in one late balance charge entry dated the day it is booked, so a full period counts as already charged when it ended on or before the date of the contract's latest late balance charge entry; the final balance due date itself, and the rule that no late balance charge is assessed before it, stay as the base rule states them.
    The late-charge balance is the signed contract price plus the change-order lines less the price credits, less the payments received net of refunds; fees, earlier late balance charges included, and the installation job's charges bear no late charge.
    The standard late charge is the series monthly rate times the late-charge balance for each full 30-day period counted from the day after the installation completion date plus the series final-balance due days, never less than the series minimum charge, less the periods already carrying a late balance charge.
    Throughout these terms the contract's financing account is its Ridgeline financing account in force (approved, active, delinquent or paid off), its installation job is the one not cancelled, its factory order is the one not cancelled, and its warranty registration is the one in force (active or transfer pending); a cancelled, charged-off, voided, expired or transferred record is never read. Where the contract has no such record, the terms read it as absent: no lender funding date and no financing account, no installation reschedule, punch item or closing date, no factory delay when there is no order or the order has not shipped, and no warranty part awaiting.
    The late-charge clock starts on the installation completion date, except as follows: for a contract paid by Ridgeline financing whose lender funding posted after the installation completion date, the clock starts on the lender funding date; for any other contract whose installation job closed after the installation completion date, the clock starts on the date the installation job closed.
    The late-charge start date is the clock start plus the series final-balance due days plus a payment grace and a company-delay goodwill, all counted in calendar days, and full 30-day periods are counted from that start date to the day the charge is figured.
    The payment grace is the autopay grace days when the Ridgeline financing account on the contract has autopay enrolled, the manual-pay grace days when the contract has a Ridgeline financing account without autopay, and no grace days when it has none.
    The company-delay goodwill is the both-delays goodwill days when the contract's installation job carries a company-initiated reschedule and its factory order shipped after its committed ship date, the one-delay goodwill days when only one of those two happened, and no goodwill days when neither did.
    How the minimum charge combines with the late-rate amount depends on the job: while Ridgeline still owes work on the contract's installation, meaning a punch item logged on the installation job and not yet resolved or a warranty part left on order at a service visit under this contract's warranty registration and not yet recorded as repaired, the period amount is the late-rate amount alone, with no minimum; otherwise, when the contract already carries a late balance charge for an earlier period, the period amount is the series minimum charge plus the late-rate amount; otherwise the period amount is the larger of the late-rate amount and the series minimum charge.
    The account-standing share comes from the contract's financing account in force: with no late fee and no returned payment posted on it in the last twelve months and at least one payment posted on it, it is the clean-paying share; with no late fee and no returned payment in the last twelve months and no payment posted on it yet, it is the clean-new share; otherwise, including a contract with no financing account in force, it is one.
    The catch-up share comes from the calendar days between the end of the first full period not yet charged and the day the charge is figured: more than the stale-period day count takes the stale-period share; at least the aging-period day count and no more than the stale-period day count takes the aging-period share; fewer than the aging-period day count takes a share of one.
    The series monthly rate, the account-standing share and the catch-up share are multiplied together with the late-charge balance and the product, rounded to the cent, is the late-rate amount for one period; the minimum-charge terms then give the period amount, and the period amount is multiplied by the number of full periods not yet charged.
  prerequisite: []
  cross_category:
  - category: finance
    as: history
    reads: [funded_date, autopay_enrolled, finance_transactions.event_type, finance_transactions.fee_kind]
    note: The late-charge clock, the payment grace and the account-standing share are decided from the financing account on the contract and its posted payments, late fees and returned payments.
  - category: install
    as: history
    reads: [install_job_id, closed_date, install_activities.initiated_by, install_activities.event_type]
    note: The late-charge clock, the company-delay goodwill and the minimum-charge terms are decided from the installation job's closing date, its company-initiated reschedules and its open punch items.
  - category: order
    as: branch
    reads: [committed_ship_date, ship_date]
    note: The company-delay goodwill is decided in part from whether the factory order shipped after its committed ship date.
  - category: warranty
    as: history
    reads: [warranty_activities.visit_outcome, warranty_activities.units]
    note: The minimum-charge terms ask whether a warranty part left on order at a service visit is still awaiting repair.
  compute:
  - live_finance_account: "CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='active') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='approved') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='delinquent') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='paid_off')"
  - live_install_job: "CFIELD('install', 'install_job_id', window_contract_id=HID, status='closed') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='completed') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='in_progress') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='scheduled') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='opened')"
  - live_factory_order: "CFIELD('order', 'factory_order_id', window_contract_id=HID, status='closed') or CFIELD('order', 'factory_order_id', window_contract_id=HID, status='delivered') or CFIELD('order', 'factory_order_id', window_contract_id=HID, status='shipped') or CFIELD('order', 'factory_order_id', window_contract_id=HID, status='in_production') or CFIELD('order', 'factory_order_id', window_contract_id=HID, status='on_hold') or CFIELD('order', 'factory_order_id', window_contract_id=HID, status='entered')"
  - live_registration: "CFIELD('warranty', 'warranty_registration_id', window_contract_id=HID, status='active') or CFIELD('warranty', 'warranty_registration_id', window_contract_id=HID, status='transfer_pending')"
  - funded_on: "CFIELD('finance', 'funded_date', finance_account_id=live_finance_account)"
  - job_closed_on: "CFIELD('install', 'closed_date', install_job_id=live_install_job)"
  - late_clock_start: "funded_on if (F('payment_method') == 'ridgeline_financing' and funded_on != None and funded_on != '' and funded_on > F('completion_date')) else (job_closed_on if (job_closed_on != None and job_closed_on != '' and job_closed_on > F('completion_date')) else F('completion_date'))"
  - autopay_on: "CFIELD('finance', 'autopay_enrolled', finance_account_id=live_finance_account)"
  - payment_grace_days: "K('autopay_grace_days') if (live_finance_account != None and autopay_on == True) else (K('manual_pay_grace_days') if live_finance_account != None else 0)"
  - company_install_reschedules: "XCOUNT('install', 'install_activities', event_type='install_reschedule_logged', initiated_by='company', install_job_id=live_install_job)"
  - order_committed_ship: "CFIELD('order', 'committed_ship_date', factory_order_id=live_factory_order)"
  - order_actual_ship: "CFIELD('order', 'ship_date', factory_order_id=live_factory_order)"
  - factory_ship_slip_days: "DAYS(order_committed_ship, order_actual_ship) if (order_committed_ship != None and order_committed_ship != '' and order_actual_ship != None and order_actual_ship != '') else 0"
  - company_delay_goodwill_days: "K('goodwill_both_days') if (company_install_reschedules > 0 and factory_ship_slip_days > 0) else (K('goodwill_one_days') if (company_install_reschedules > 0 or factory_ship_slip_days > 0) else 0)"
  - days_after_start: "DAYS(late_clock_start, NOW) - P('final_balance_due_days') - payment_grace_days - company_delay_goodwill_days"
  - full_periods: "MX(0, days_after_start // K('period_days'))"
  - last_late_entry: "LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_fee_assessed', fee_kind='late_balance_charge')"
  - periods_charged: "MX(0, (DAYS(late_clock_start, last_late_entry) - P('final_balance_due_days') - payment_grace_days - company_delay_goodwill_days) // K('period_days')) if last_late_entry != None else 0"
  - periods_due: "MX(0, full_periods - periods_charged)"
  - finance_late_fees_12m: "XCOUNT('finance', 'finance_transactions', within_months=12, date_field='txn_date', event_type='finance_fee_assessed', fee_kind='late_fee', finance_account_id=live_finance_account)"
  - finance_returns_12m: "XCOUNT('finance', 'finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned', finance_account_id=live_finance_account)"
  - finance_payments_posted: "XCOUNT('finance', 'finance_transactions', event_type='finance_payment_posted', finance_account_id=live_finance_account)"
  - account_standing_share: "K('clean_paying_share') if (finance_late_fees_12m + finance_returns_12m == 0 and finance_payments_posted >= 1) else (K('clean_new_share') if (finance_late_fees_12m + finance_returns_12m == 0 and live_finance_account != None) else 1.0)"
  - days_since_open_period_end: "DAYS(late_clock_start, NOW) - P('final_balance_due_days') - payment_grace_days - company_delay_goodwill_days - K('period_days') * (periods_charged + 1)"
  - catch_up_share: "K('stale_period_share') if days_since_open_period_end > K('stale_period_days') else (K('aging_period_share') if days_since_open_period_end >= K('aging_period_days') else 1.0)"
  - change_order_lines: "SUM('window_transactions', 'amount', event_type='window_change_order')"
  - price_credits: "SUM('window_transactions', 'amount', event_type='window_price_credit')"
  - payments_received: "SUM('window_transactions', 'amount', event_type='window_payment_received')"
  - refunds_issued: "SUM('window_transactions', 'amount', event_type='window_refund_issued')"
  - late_charge_balance: "F('contract_price') + change_order_lines - price_credits - (payments_received - refunds_issued)"
  - late_rate_amount: "RND(P('late_balance_monthly_rate') * account_standing_share * catch_up_share * late_charge_balance, 2)"
  - open_job_items: "XCOUNT('install', 'install_activities', event_type='install_punch_logged', install_job_id=live_install_job) - XCOUNT('install', 'install_activities', event_type='install_punch_resolved', install_job_id=live_install_job)"
  - warranty_parts_awaiting: "XSUM('warranty', 'warranty_activities', 'units', event_type='warranty_service_visit', visit_outcome='part_on_order', warranty_registration_id=live_registration) - XSUM('warranty', 'warranty_activities', 'units', event_type='warranty_service_visit', visit_outcome='repaired', warranty_registration_id=live_registration)"
  - period_charge: "late_rate_amount if (open_job_items > 0 or warranty_parts_awaiting > 0) else (P('late_balance_min_charge') + late_rate_amount if periods_charged > 0 else MX(late_rate_amount, P('late_balance_min_charge')))"
  - result: "RND(periods_due * period_charge, 2)"
  compute_basis:
    live_finance_account: "Throughout these terms the contract's financing account is its Ridgeline financing account in force (approved, active, delinquent or paid off), its installation job is the one not cancelled, its factory order is the one not cancelled, and its warranty registration is the one in force (active or transfer pending)"
    live_install_job: "Throughout these terms the contract's financing account is its Ridgeline financing account in force (approved, active, delinquent or paid off), its installation job is the one not cancelled, its factory order is the one not cancelled, and its warranty registration is the one in force (active or transfer pending)"
    live_factory_order: "Throughout these terms the contract's financing account is its Ridgeline financing account in force (approved, active, delinquent or paid off), its installation job is the one not cancelled, its factory order is the one not cancelled, and its warranty registration is the one in force (active or transfer pending)"
    live_registration: "Throughout these terms the contract's financing account is its Ridgeline financing account in force (approved, active, delinquent or paid off), its installation job is the one not cancelled, its factory order is the one not cancelled, and its warranty registration is the one in force (active or transfer pending)"
    order_committed_ship: "no factory delay when there is no order or the order has not shipped"
    order_actual_ship: "no factory delay when there is no order or the order has not shipped"
    funded_on: "for a contract paid by Ridgeline financing whose lender funding posted after the installation completion date, the clock starts on the lender funding date"
    job_closed_on: "for any other contract whose installation job closed after the installation completion date, the clock starts on the date the installation job closed."
    late_clock_start: "The late-charge clock starts on the installation completion date, except as follows: for a contract paid by Ridgeline financing whose lender funding posted after the installation completion date, the clock starts on the lender funding date; for any other contract whose installation job closed after the installation completion date, the clock starts on the date the installation job closed."
    autopay_on: "the autopay grace days when the Ridgeline financing account on the contract has autopay enrolled"
    payment_grace_days: "The payment grace is the autopay grace days when the Ridgeline financing account on the contract has autopay enrolled, the manual-pay grace days when the contract has a Ridgeline financing account without autopay, and no grace days when it has none."
    company_install_reschedules: "when the contract's installation job carries a company-initiated reschedule"
    factory_ship_slip_days: "its factory order shipped after its committed ship date"
    company_delay_goodwill_days: "The company-delay goodwill is the both-delays goodwill days when the contract's installation job carries a company-initiated reschedule and its factory order shipped after its committed ship date, the one-delay goodwill days when only one of those two happened, and no goodwill days when neither did."
    days_after_start: "The late-charge start date is the clock start plus the series final-balance due days plus a payment grace and a company-delay goodwill, all counted in calendar days, and full 30-day periods are counted from that start date to the day the charge is figured."
    full_periods: "each full 30-day late period is charged"
    last_late_entry: "a full period counts as already charged when it ended on or before the date of the contract's latest late balance charge entry"
    periods_charged: "every full period that has ended without a late balance charge is charged in one late balance charge entry dated the day it is booked, so a full period counts as already charged when it ended on or before the date of the contract's latest late balance charge entry"
    periods_due: "the period amount is multiplied by the number of full periods not yet charged."
    finance_late_fees_12m: "with no late fee and no returned payment posted on it in the last twelve months"
    finance_returns_12m: "with no late fee and no returned payment posted on it in the last twelve months"
    finance_payments_posted: "at least one payment posted on it, it is the clean-paying share"
    account_standing_share: "The account-standing share comes from the contract's financing account in force: with no late fee and no returned payment posted on it in the last twelve months and at least one payment posted on it, it is the clean-paying share; with no late fee and no returned payment in the last twelve months and no payment posted on it yet, it is the clean-new share; otherwise, including a contract with no financing account in force, it is one."
    days_since_open_period_end: "The catch-up share comes from the calendar days between the end of the first full period not yet charged and the day the charge is figured"
    catch_up_share: "more than the stale-period day count takes the stale-period share; at least the aging-period day count and no more than the stale-period day count takes the aging-period share; fewer than the aging-period day count takes a share of one."
    change_order_lines: "The late-charge balance is the signed contract price plus the change-order lines less the price credits, less the payments received net of refunds"
    price_credits: "The late-charge balance is the signed contract price plus the change-order lines less the price credits, less the payments received net of refunds"
    payments_received: "less the payments received net of refunds"
    refunds_issued: "less the payments received net of refunds"
    late_charge_balance: "The late-charge balance is the signed contract price plus the change-order lines less the price credits, less the payments received net of refunds; fees, earlier late balance charges included, and the installation job's charges bear no late charge."
    late_rate_amount: "The series monthly rate, the account-standing share and the catch-up share are multiplied together with the late-charge balance and the product, rounded to the cent, is the late-rate amount for one period"
    open_job_items: "a punch item logged on the installation job and not yet resolved"
    warranty_parts_awaiting: "a warranty part left on order at a service visit under this contract's warranty registration and not yet recorded as repaired"
    period_charge: "How the minimum charge combines with the late-rate amount depends on the job: while Ridgeline still owes work on the contract's installation, meaning a punch item logged on the installation job and not yet resolved or a warranty part left on order at a service visit under this contract's warranty registration and not yet recorded as repaired, the period amount is the late-rate amount alone, with no minimum; otherwise, when the contract already carries a late balance charge for an earlier period, the period amount is the series minimum charge plus the late-rate amount; otherwise the period amount is the larger of the late-rate amount and the series minimum charge."
    result: "the period amount is multiplied by the number of full periods not yet charged."
  factors:
  - id: late_clock_anchor
    effect: parameter
    decides: late_clock_start
    bindings: [funded_on, job_closed_on, late_clock_start]
    ladder:
    - when: "the contract is paid by Ridgeline financing and its lender funding posted after the installation completion date"
      value: "the lender funding date (the financing account's funded date)"
    - when: "the contract is not under the first tier and its installation job closed after the installation completion date"
      value: "the date the installation job closed"
    - when: "otherwise"
      value: "the installation completion date"
    baseline:
      late_clock_start: "F('completion_date')"
    evidence: [cross_category, date]
    cross_difficulty: finance
  - id: payment_grace_days
    effect: parameter
    decides: payment_grace_days
    bindings: [autopay_on, payment_grace_days]
    ladder:
    - when: "the Ridgeline financing account on the contract has autopay enrolled"
      value: "K('autopay_grace_days')"
    - when: "the contract has a Ridgeline financing account without autopay"
      value: "K('manual_pay_grace_days')"
    - when: "otherwise (no financing account on the contract)"
      value: "0"
    baseline:
      payment_grace_days: "0"
    evidence: [cross_category]
    cross_difficulty: finance
  - id: company_delay_goodwill
    effect: parameter
    decides: company_delay_goodwill_days
    bindings: [company_install_reschedules, factory_ship_slip_days, company_delay_goodwill_days]
    ladder:
    - when: "the installation job carries a company-initiated reschedule and the factory order shipped after its committed ship date"
      value: "K('goodwill_both_days')"
    - when: "exactly one of those two happened: a company-initiated installation reschedule or a factory shipment after the committed ship date"
      value: "K('goodwill_one_days')"
    - when: "otherwise (neither)"
      value: "0"
    baseline:
      company_delay_goodwill_days: "0"
    evidence: [cross_category, history]
    cross_difficulty: install
  - id: minimum_charge_method
    effect: method
    decides: period_charge
    bindings: [open_job_items, warranty_parts_awaiting, period_charge]
    ladder:
    - when: "Ridgeline still owes work on the installation: a punch item logged on the installation job and not yet resolved, or a warranty part left on order under this contract's warranty registration and not yet recorded as repaired"
      method: "the period amount is the late-rate amount alone, with no minimum charge"
    - when: "no such work is owed and the contract already carries a late balance charge for an earlier period"
      method: "the period amount is the series minimum charge plus the late-rate amount"
    - when: "otherwise"
      method: "the period amount is the larger of the late-rate amount and the series minimum charge"
    baseline:
      period_charge: "MX(late_rate_amount, P('late_balance_min_charge'))"
    evidence: [cross_category, history]
    cross_difficulty: install
  - id: account_standing_share
    effect: parameter
    decides: account_standing_share
    bindings: [finance_late_fees_12m, finance_returns_12m, finance_payments_posted, account_standing_share]
    ladder:
    - when: "no late fee and no returned payment were posted on the contract's financing account in force in the last twelve months, and at least one payment was posted on it"
      value: "K('clean_paying_share')"
    - when: "no late fee and no returned payment on the contract's financing account in force in the last twelve months, and no payment posted on it yet"
      value: "K('clean_new_share')"
    - when: "otherwise (including no financing account in force on the contract)"
      value: "1.0"
    baseline:
      account_standing_share: "1.0"
    evidence: [cross_category, history]
    cross_difficulty: finance
  - id: catch_up_share
    effect: parameter
    decides: catch_up_share
    bindings: [days_since_open_period_end, catch_up_share]
    ladder:
    - when: "the first full period not yet charged ended more than the stale-period day count before the charge is figured"
      value: "K('stale_period_share')"
    - when: "it ended at least the aging-period day count and no more than the stale-period day count before"
      value: "K('aging_period_share')"
    - when: "otherwise (fewer than the aging-period day count before)"
      value: "1.0"
    baseline:
      catch_up_share: "1.0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The late-charge balance is the signed contract price plus the change-order lines less the price credits, less the payments received net of refunds; fees, earlier late balance charges included, and the installation job's charges bear no late charge.
      The standard late charge is the series monthly rate times the late-charge balance for each full 30-day period counted from the day after the installation completion date plus the series final-balance due days, never less than the series minimum charge, less the periods already carrying a late balance charge.
    params: [late_balance_monthly_rate, late_balance_min_charge, final_balance_due_days]
  inputs:
    history:
    - {table: window_transactions, aggregate: sum, field: amount, filters: {event_type: window_change_order}}
    - {table: window_transactions, aggregate: sum, field: amount, filters: {event_type: window_payment_received}}
    - {table: window_transactions, aggregate: latest, field: txn_date, filters: {event_type: window_fee_assessed, fee_kind: late_balance_charge}}
    - {category: finance, table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_fee_assessed, fee_kind: late_fee, finance_account_id: the contract account in force}}
    - {category: install, table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_reschedule_logged, initiated_by: company}}
    - {category: install, table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_punch_logged}}
    - {category: install, table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_punch_resolved}}
    - {category: warranty, table: warranty_activities, aggregate: sum, field: units, filters: {event_type: warranty_service_visit, visit_outcome: part_on_order}}
    cross_category: [finance, install, order, warranty]
- id: window_ext_final_balance_payoff
  base_policy_refs: [window_agg_payment_application, window_booking_deposit, window_final_balance]
  overwrite:
  - base_policy: window_final_balance
    superseded_clause: >-
      The net charges of the contract's installation job are collected with it, so the amount due at the end is the balance due plus those job charges.
    replaced_by: >-
      For a payoff of an installed contract, and only for such a payoff, the amount collected is the balance due plus the installation job's net charges less the job charges held for the job's open closeout items; the held job charges stay owed and are collected once the item that held them clears, and every other collection of job charges remains under the base rule.
  trigger: on_request
  subject: [window_payment_received]
  computes: amount
  target_tool: pay_final_balance_39e93918
  params:
    per_item_retainage: 150
    inspection_large_units: 15
    inspection_large_hold: 200
    inspection_small_hold: 100
    warranty_multi_unit_hold: 400
    warranty_single_unit_hold: 200
    lead_large_openings: 10
    lead_large_hold: 200
    lead_small_hold: 100
  rule: >-
    For a payoff of an installed contract, and only for such a payoff, the amount collected is the balance due plus the installation job's net charges less the job charges held for the job's open closeout items; the held job charges stay owed and are collected once the item that held them clears, and every other collection of job charges remains under the base rule.
    The balance due is the signed contract price plus the change-order lines and the fees on the contract, late balance charges included, less the price credits, less the payments received net of refunds.
    The installation job's net charges are the charges billed on the contract's installation job less the credits issued on it.
    The contract's installation job is its installation job that is not cancelled; a contract with no such job has no job charges, holds or punch items.
    The payoff amount is fixed only after the contract's ledger carries a late balance charge for every full late period that has ended under the late-charge terms.
    The payoff amount is not quoted until the ledger carries a change-order fee for the latest customer change order whenever that change order falls beyond the series free count.
    Before the payoff amount is worked out, the ledger must carry a remeasure fee for the latest completed customer-requested remeasure whenever that remeasure falls beyond the series free remeasure count.
    The standard payoff is the balance due plus all of the installation job's net charges, rounded to the cent, and it is paid as a final-balance payment.
    The punch retainage is held from the job charges by the number of punch items logged on the installation job and not yet resolved: with three or more open items, all of the job's net charges are held; with one or two open items, the per-item retainage is held for each open item; with none, nothing is held.
    The inspection hold applies to a permitted installation job that is not yet closed: such a job covering at least the large-job unit count holds the large inspection hold; such a job covering fewer units holds the small inspection hold; any other job holds nothing.
    The warranty repair hold comes from the warranty service visits on the household's registrations: when the units left with a part on order, less the units later recorded as repaired, come to two or more, the multi-unit warranty hold is held; when they come to one, the single-unit warranty hold is held; otherwise nothing is held.
    The lead-safe verification hold applies while the installation job is not yet closed: lead-safe work charged on at least the large lead-safe opening count holds the large lead-safe hold; lead-safe work charged on fewer openings holds the small lead-safe hold; a job with no lead-safe work, or a closed job, holds nothing.
    The four holds are added together and never exceed the job's net charges, and the total held is subtracted from the balance due plus the job's net charges; the payoff is rounded to the cent once, at the end.
  prerequisite:
  - problem: window_ext_late_balance_charge
    kind: value_input
    gate: fees_on_contract
    form: state
    policy_source: >-
      The payoff amount is fixed only after the contract's ledger carries a late balance charge for every full late period that has ended under the late-charge terms.
    condition: >-
      The contract's ledger carries a late balance charge for every full late period that has ended under the late-charge terms.
    resolved_by: post_late_balance_charge_0f8afea0
    effect: >-
      Once the late balance charge is booked, the fees on the contract, and with them the balance due that the payoff collects, rise by the late charge amount.
  - problem: window_ext_change_order_fee
    kind: value_input
    gate: fees_on_contract
    form: state
    policy_source: >-
      The payoff amount is not quoted until the ledger carries a change-order fee for the latest customer change order whenever that change order falls beyond the series free count.
    condition: >-
      The contract's window ledger carries a change-order fee for the latest customer change order whenever that change order falls beyond the series free count.
    resolved_by: post_change_order_fee_bcbd2cec
    effect: >-
      Once the change-order fee is booked, the fees on the contract, and with them the balance due that the payoff collects, rise by that fee.
  - problem: window_ext_remeasure_fee
    kind: value_input
    gate: fees_on_contract
    form: state
    policy_source: >-
      Before the payoff amount is worked out, the ledger must carry a remeasure fee for the latest completed customer-requested remeasure whenever that remeasure falls beyond the series free remeasure count.
    condition: >-
      The contract's window ledger carries a remeasure fee for the latest completed customer-requested remeasure whenever that remeasure falls beyond the series free remeasure count.
    resolved_by: post_remeasure_fee_bdabfe19
    effect: >-
      Once the remeasure fee is booked, the fees on the contract, and with them the balance due that the payoff collects, rise by that fee.
  cross_category:
  - category: install
    as: history
    reads: [install_job_id, status, permit_required, unit_count, install_activities.amount, install_activities.units]
    note: The punch retainage, the inspection hold and the lead-safe verification hold are decided from the installation job and its charges, credits and punch items.
  - category: warranty
    as: history
    reads: [warranty_activities.visit_outcome, warranty_activities.units]
    note: The warranty repair hold is decided from the household's warranty service visits that left a part on order.
  compute:
  - change_order_lines: "SUM('window_transactions', 'amount', event_type='window_change_order')"
  - fees_on_contract: "SUM('window_transactions', 'amount', event_type='window_fee_assessed')"
  - price_credits: "SUM('window_transactions', 'amount', event_type='window_price_credit')"
  - payments_received: "SUM('window_transactions', 'amount', event_type='window_payment_received')"
  - refunds_issued: "SUM('window_transactions', 'amount', event_type='window_refund_issued')"
  - balance_due: "F('contract_price') + change_order_lines + fees_on_contract - price_credits - (payments_received - refunds_issued)"
  - install_job: "CFIELD('install', 'install_job_id', window_contract_id=HID, status='closed') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='completed') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='in_progress') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='scheduled') or CFIELD('install', 'install_job_id', window_contract_id=HID, status='opened')"
  - job_charges: "XSUM('install', 'install_activities', 'amount', event_type='install_fee_assessed', install_job_id=install_job)"
  - job_credits: "XSUM('install', 'install_activities', 'amount', event_type='install_credit_issued', install_job_id=install_job)"
  - job_net_charges: "job_charges - job_credits"
  - open_punch_items: "XCOUNT('install', 'install_activities', event_type='install_punch_logged', install_job_id=install_job) - XCOUNT('install', 'install_activities', event_type='install_punch_resolved', install_job_id=install_job)"
  - punch_retainage: "job_net_charges if open_punch_items >= 3 else (K('per_item_retainage') * open_punch_items if open_punch_items >= 1 else 0)"
  - job_status: "CFIELD('install', 'status', install_job_id=install_job)"
  - job_permitted: "CFIELD('install', 'permit_required', install_job_id=install_job)"
  - job_units: "CFIELD('install', 'unit_count', install_job_id=install_job)"
  - inspection_hold: "K('inspection_large_hold') if (job_permitted == True and job_status != 'closed' and job_units >= K('inspection_large_units')) else (K('inspection_small_hold') if (job_permitted == True and job_status != 'closed') else 0)"
  - warranty_units_awaiting: "XSUM('warranty', 'warranty_activities', 'units', event_type='warranty_service_visit', visit_outcome='part_on_order') - XSUM('warranty', 'warranty_activities', 'units', event_type='warranty_service_visit', visit_outcome='repaired')"
  - warranty_repair_hold: "K('warranty_multi_unit_hold') if warranty_units_awaiting >= 2 else (K('warranty_single_unit_hold') if warranty_units_awaiting >= 1 else 0)"
  - lead_safe_openings: "XSUM('install', 'install_activities', 'units', event_type='install_fee_assessed', fee_kind='lead_safe_fee', install_job_id=install_job)"
  - lead_safe_hold: "K('lead_large_hold') if (lead_safe_openings >= K('lead_large_openings') and job_status != 'closed') else (K('lead_small_hold') if (lead_safe_openings >= 1 and job_status != 'closed') else 0)"
  - total_held: "MN(job_net_charges, punch_retainage + inspection_hold + warranty_repair_hold + lead_safe_hold)"
  - result: "RND(balance_due + job_net_charges - total_held, 2)"
  compute_basis:
