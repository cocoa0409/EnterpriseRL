  factors:
  - id: deposit_method
    effect: method
    decides: required_deposit
    bindings: [special_order_or_oversize_lines, required_deposit]
    ladder:
    - when: "the contract is paid by Ridgeline financing"
      method: "the required deposit is the series financed deposit percentage of the measured contract value, with no minimum"
    - when: "the contract is paid by cash, check or card and carries exterior color, laminated glass or oversize surcharge lines"
      method: "the required deposit is the deposit percentage of the measured contract value plus each special-order and oversize line group's upfront share of the part the percentage leaves uncovered, capped at the measured contract value"
    - when: "otherwise"
      method: "the required deposit is the larger of the deposit percentage of the measured contract value and the series deposit minimum, capped at the measured contract value"
    baseline:
      required_deposit: "MN(measured_value, MX(RND(cash_deposit_pct * measured_value, 2), P('booking_deposit_min')))"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: deposit_size_step
    effect: parameter
    decides: deposit_pct_step
    bindings: [change_order_lines, fees_on_contract, price_credits, measured_value, deposit_pct_step]
    ladder:
    - when: "the measured contract value is at least the large-project value"
      value: "K('large_project_step')"
    - when: "it is at least the mid-project value but less than the large-project value"
      value: "K('mid_project_step')"
    - when: "otherwise"
      value: "0"
    baseline:
      deposit_pct_step: "0"
    evidence: [history]
    cross_difficulty: null
  - id: special_order_upfront_share
    effect: parameter
    decides: special_order_upfront_share
    bindings: [paint_line_value, laminated_line_value, special_order_upfront_share]
    ladder:
    - when: "the contract carries an exterior color line"
      value: "K('paint_upfront_share')"
    - when: "it carries a laminated glass line and no exterior color line"
      value: "K('glass_upfront_share')"
    - when: "otherwise"
      value: "0"
    baseline:
      special_order_upfront_share: "0"
    evidence: [history]
    cross_difficulty: null
  - id: oversize_upfront_share
    effect: parameter
    decides: oversize_upfront_share
    bindings: [oversize_line_value, final_measure_oversize, oversize_upfront_share]
    ladder:
    - when: "the completed final measure recorded at least the many-oversize opening count above the standard bracket"
      value: "K('many_oversize_upfront_share')"
    - when: "it recorded at least one such opening but fewer"
      value: "K('some_oversize_upfront_share')"
    - when: "otherwise"
      value: "0"
    baseline:
      oversize_upfront_share: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The measured contract value is the signed contract price plus the change-order lines and the fees on the contract, less the price credits.
      The deposit balance is the required deposit less the payments received toward the contract net of refunds, never below zero, rounded to the cent, and it is paid as a booking deposit.
      The standard required deposit is the larger of the series deposit percentage of the measured contract value, rounded to the cent, and the series deposit minimum, but never more than the measured contract value.
    params: [booking_deposit_pct, booking_deposit_min]
