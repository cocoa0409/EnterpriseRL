    fees_on_contract: "The balance due is the signed contract price plus the change-order lines and the fees on the contract, late balance charges included, less the price credits, less the payments received net of refunds."
    price_credits: "The balance due is the signed contract price plus the change-order lines and the fees on the contract, late balance charges included, less the price credits, less the payments received net of refunds."
    payments_received: "The balance due is the signed contract price plus the change-order lines and the fees on the contract, late balance charges included, less the price credits, less the payments received net of refunds."
