    balance_due: "The balance due is the signed contract price plus the change-order lines and the fees on the contract, late balance charges included, less the price credits, less the payments received net of refunds."
    install_job: "The contract's installation job is its installation job that is not cancelled; a contract with no such job has no job charges, holds or punch items."
    job_charges: "The installation job's net charges are the charges billed on the contract's installation job less the credits issued on it."
    job_credits: "The installation job's net charges are the charges billed on the contract's installation job less the credits issued on it."
    open_punch_items: "The punch retainage is held from the job charges by the number of punch items logged on the installation job and not yet resolved"
    punch_retainage: "with three or more open items, all of the job's net charges are held; with one or two open items, the per-item retainage is held for each open item; with none, nothing is held."
    job_status: "The inspection hold applies to a permitted installation job that is not yet closed"
    job_permitted: "The inspection hold applies to a permitted installation job that is not yet closed"
    job_units: "such a job covering at least the large-job unit count holds the large inspection hold; such a job covering fewer units holds the small inspection hold; any other job holds nothing."
    inspection_hold: "The inspection hold applies to a permitted installation job that is not yet closed: such a job covering at least the large-job unit count holds the large inspection hold; such a job covering fewer units holds the small inspection hold; any other job holds nothing."
    warranty_units_awaiting: "when the units left with a part on order, less the units later recorded as repaired, come to two or more"
    warranty_repair_hold: "The warranty repair hold comes from the warranty service visits on the household's registrations: when the units left with a part on order, less the units later recorded as repaired, come to two or more, the multi-unit warranty hold is held; when they come to one, the single-unit warranty hold is held; otherwise nothing is held."
    lead_safe_openings: "lead-safe work charged on at least the large lead-safe opening count holds the large lead-safe hold"
    lead_safe_hold: "The lead-safe verification hold applies while the installation job is not yet closed: lead-safe work charged on at least the large lead-safe opening count holds the large lead-safe hold; lead-safe work charged on fewer openings holds the small lead-safe hold; a job with no lead-safe work, or a closed job, holds nothing."
    total_held: "The four holds are added together and never exceed the job's net charges"
    result: "the total held is subtracted from the balance due plus the job's net charges; the payoff is rounded to the cent once, at the end."
  factors:
  - id: punch_retainage
    effect: method
    decides: punch_retainage
    bindings: [open_punch_items, punch_retainage]
    ladder:
    - when: "three or more punch items logged on the installation job are not yet resolved"
      method: "all of the job's net charges are held back from the payoff"
    - when: "one or two punch items are not yet resolved"
      method: "the per-item retainage is held for each open item"
    - when: "otherwise (no open punch item)"
      method: "nothing is held for punch items"
    baseline:
      punch_retainage: "0"
    evidence: [cross_category, history]
    cross_difficulty: install
  - id: inspection_hold
    effect: parameter
    decides: inspection_hold
    bindings: [job_status, job_permitted, job_units, inspection_hold]
    ladder:
    - when: "the installation job is permitted, not yet closed, and covers at least the large-job unit count"
      value: "K('inspection_large_hold')"
    - when: "the installation job is permitted, not yet closed, and covers fewer units"
      value: "K('inspection_small_hold')"
    - when: "otherwise"
      value: "0"
    baseline:
      inspection_hold: "0"
    evidence: [cross_category]
    cross_difficulty: install
  - id: warranty_repair_hold
    effect: parameter
    decides: warranty_repair_hold
    bindings: [warranty_units_awaiting, warranty_repair_hold]
    ladder:
    - when: "two or more units are left with a warranty part on order and not yet recorded as repaired"
      value: "K('warranty_multi_unit_hold')"
    - when: "exactly one such unit"
      value: "K('warranty_single_unit_hold')"
    - when: "otherwise"
      value: "0"
    baseline:
      warranty_repair_hold: "0"
    evidence: [cross_category, history]
    cross_difficulty: warranty
  - id: lead_safe_verification_hold
    effect: parameter
    decides: lead_safe_hold
    bindings: [lead_safe_openings, lead_safe_hold]
    ladder:
    - when: "the installation job is not yet closed and lead-safe work was charged on at least the large lead-safe opening count"
      value: "K('lead_large_hold')"
    - when: "the installation job is not yet closed and lead-safe work was charged on fewer openings"
      value: "K('lead_small_hold')"
    - when: "otherwise"
      value: "0"
    baseline:
      lead_safe_hold: "0"
    evidence: [cross_category, history]
    cross_difficulty: install
  baseline:
    rule: >-
      The balance due is the signed contract price plus the change-order lines and the fees on the contract, late balance charges included, less the price credits, less the payments received net of refunds.
      The installation job's net charges are the charges billed on the contract's installation job less the credits issued on it.
      The standard payoff is the balance due plus all of the installation job's net charges, rounded to the cent, and it is paid as a final-balance payment.
    params: []
  inputs:
    history:
    - {table: window_transactions, aggregate: sum, field: amount, filters: {event_type: window_fee_assessed}}
    - {table: window_transactions, aggregate: sum, field: amount, filters: {event_type: window_payment_received}}
    - {category: install, table: install_activities, aggregate: sum, field: amount, filters: {event_type: install_fee_assessed}}
    - {category: install, table: install_activities, aggregate: count, field: install_activity_id, filters: {event_type: install_punch_logged}}
    - {category: warranty, table: warranty_activities, aggregate: sum, field: units, filters: {event_type: warranty_service_visit, visit_outcome: part_on_order}}
    cross_category: [install, warranty]
- id: window_ext_door_bundle_credit
  base_policy_refs: [window_price_credits, window_discount_programs]
  overwrite:
  - base_policy: window_price_credits
    superseded_clause: >-
      it is granted on the window contract when the customer signs a Ridgeline door contract within the bundle window of calendar days before or after this contract's signed date and neither contract is cancelled, and once per pair of contracts
    replaced_by: >-
      For a household holding exactly one Ridgeline door contract that is not cancelled, and only for such a household, the door bundle discount is granted on this window contract once, paired with that door contract, when that door contract was signed within the bundle window of calendar days before or after this contract's signed date, its discount program is none and this contract's discount program is none; otherwise such a household's window contract earns no door bundle discount; every other household remains under the base rule for when and how often the credit is granted and for its amount, and this policy figures no credit for it.
  - base_policy: window_price_credits
    superseded_clause: >-
      A door_bundle_discount credit equals the series bundle percentage of the signed contract price
    replaced_by: >-
      For a door bundle discount credit on the window contract of a household holding exactly one Ridgeline door contract that is not cancelled, and only for such a credit, the credit is the bundle rate figured under these terms times the credit basis figured under these terms instead of the series bundle percentage of the signed contract price; the rule that it needs a discount program of none stays as the base rule states it, when and how often it is granted for such a household is set out below, and the credit of every other household remains under the base rule.
  trigger: state_due
  subject: [window_price_credit]
  computes: amount
  target_tool: post_door_bundle_credit_ed16c33c
  params:
    large_door_price: 8000
    mid_door_price: 4000
    large_door_step: 0.02
    mid_door_step: 0.01
    large_window_openings: 20
    mid_window_openings: 10
    large_window_step: 0.01
    mid_window_step: 0.005
    late_addon_days: 30
    prompt_days: 14
    late_addon_share: 0.7
    mid_addon_share: 0.9
    deferred_interest_share: 0.5
    equal_pay_share: 0.75
    unmeasured_door_share: 0.5
    measured_door_share: 0.8
  rule: >-
    For a door bundle discount credit on the window contract of a household holding exactly one Ridgeline door contract that is not cancelled, and only for such a credit, the credit is the bundle rate figured under these terms times the credit basis figured under these terms instead of the series bundle percentage of the signed contract price; the rule that it needs a discount program of none stays as the base rule states it, when and how often it is granted for such a household is set out below, and the credit of every other household remains under the base rule.
    The standard door bundle credit is the window series bundle percentage times the signed contract price, rounded to the cent, booked as one door bundle discount credit dated the day it is granted.
    For a household holding exactly one Ridgeline door contract that is not cancelled, and only for such a household, the door bundle discount is granted on this window contract once, paired with that door contract, when that door contract was signed within the bundle window of calendar days before or after this contract's signed date, its discount program is none and this contract's discount program is none; otherwise such a household's window contract earns no door bundle discount; every other household remains under the base rule for when and how often the credit is granted and for its amount, and this policy figures no credit for it.
    The credit basis depends on which contract began the project: when the door contract was signed before this window contract, the door was the first purchase and the credit is figured on the window product only, the series base price per opening times the openings the completed final measure confirmed (the largest count should more than one completed final measure be recorded, and the contract's openings while it is not yet measured), with no credit on options; when both were signed on the same day, the two were bought as one project and the credit is figured on the signed contract price plus the customer change-order lines on the contract; when the window contract was signed before the door contract, the credit is figured on the signed contract price.
    A door-project step is added to the window series bundle percentage by the door contract's signed price: at least the large door-project price adds the large door step; at least the mid door-project price but less than the large one adds the mid door step; a lower price adds nothing.
    A window-project step is also added by the openings the completed final measure confirmed on this contract (the largest count should more than one completed final measure be recorded): at least the large window-project opening count adds the large window step; at least the mid window-project opening count but fewer than the large one adds the mid window step; fewer openings, or a contract not yet measured, adds nothing.
    The rate after both steps is multiplied by a timing share set by the calendar days between the two signing dates: more than the late add-on day count takes the late add-on share; more than the prompt day count but no more than the late add-on day count takes the mid add-on share; no more than the prompt day count takes a share of one.
    A financing account is read only while it is in force, that is approved, active, delinquent or paid off; a cancelled or charged-off account is never read, and a contract with no account in force counts as not financed on a promotional plan.
    It is multiplied by a promotional-financing share: when either contract of the pair is financed on a Ridgeline plan with a deferred-interest promotion, the deferred-interest share; otherwise, when either is financed on a zero-interest equal-payment plan, the equal-payment share; otherwise a share of one.
    It is multiplied by a door-commitment share set by the door contract's stage: a door contract still signed and not yet measured takes the unmeasured-door share; a measured door contract takes the measured-door share; a door contract that is ordered or further along takes a share of one.
    The window series bundle percentage and the two steps are added first, the three shares are then applied to that sum, the result is multiplied by the credit basis, and the credit is rounded to the cent once, at the end.
  prerequisite: []
  cross_category:
  - category: door
    as: branch
    reads: [signed_date, contract_price, status, discount_program, door_contract_id]
    note: The policy applies to a household holding exactly one door contract that is not cancelled, which is the paired door; the credit basis, the door-project step, the timing share and the door-commitment share are decided from it.
  - category: finance
    as: branch
    reads: [promo_type]
    note: The promotional-financing share is decided from the plans financing the window contract and the door contract.
  compute:
  - live_door_count: "XCOUNT('door', 'door_contracts', status='signed') + XCOUNT('door', 'door_contracts', status='measured') + XCOUNT('door', 'door_contracts', status='ordered') + XCOUNT('door', 'door_contracts', status='installed') + XCOUNT('door', 'door_contracts', status='closed')"
  - single_door: "(CFIELD('door', 'door_contract_id', status='signed') or CFIELD('door', 'door_contract_id', status='measured') or CFIELD('door', 'door_contract_id', status='ordered') or CFIELD('door', 'door_contract_id', status='installed') or CFIELD('door', 'door_contract_id', status='closed')) if live_door_count == 1 else None"
  - single_door_signed: "CFIELD('door', 'signed_date', door_contract_id=single_door)"
  - single_door_program: "CFIELD('door', 'discount_program', door_contract_id=single_door)"
  - paired_door: "single_door if (single_door != None and single_door_program == 'none' and F('discount_program') == 'none' and single_door_signed != None and ABS(DAYS(F('signed_date'), single_door_signed)) <= P('door_bundle_window_days')) else None"
  - door_signed: "CFIELD('door', 'signed_date', door_contract_id=paired_door)"
  - customer_change_lines: "SUM('window_transactions', 'amount', event_type='window_change_order') - SUM('window_transactions', 'amount', event_type='window_change_order', change_kind='oversize_surcharge')"
  - final_measure_on: "LATEST('window_transactions', 'txn_date', date_field='txn_date', event_type='window_measure_visit', visit_kind='final_measure', visit_outcome='completed')"
  - measured_openings: "MAX('window_transactions', 'openings_affected', event_type='window_measure_visit', visit_kind='final_measure', visit_outcome='completed')"
  - credit_basis: "P('base_price_per_opening') * (measured_openings if final_measure_on != None else F('opening_count')) if (door_signed != None and door_signed < F('signed_date')) else (F('contract_price') + customer_change_lines if door_signed == F('signed_date') else F('contract_price'))"
  - door_price: "CFIELD('door', 'contract_price', door_contract_id=paired_door)"
  - door_project_step: "K('large_door_step') if (door_price != None and door_price >= K('large_door_price')) else (K('mid_door_step') if (door_price != None and door_price >= K('mid_door_price')) else 0)"
  - project_openings: "MAX('window_transactions', 'openings_affected', event_type='window_measure_visit', visit_kind='final_measure', visit_outcome='completed')"
  - window_project_step: "K('large_window_step') if project_openings >= K('large_window_openings') else (K('mid_window_step') if project_openings >= K('mid_window_openings') else 0)"
  - signing_gap_days: "ABS(DAYS(F('signed_date'), door_signed)) if door_signed != None else 0"
  - bundle_timing_share: "K('late_addon_share') if signing_gap_days > K('late_addon_days') else (K('mid_addon_share') if signing_gap_days > K('prompt_days') else 1.0)"
  - window_plan_promo: "CPARAM('finance', 'promo_type', finance_account_id=(CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='active') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='approved') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='delinquent') or CFIELD('finance', 'finance_account_id', window_contract_id=HID, status='paid_off')))"
  - door_plan_promo: "CPARAM('finance', 'promo_type', finance_account_id=(CFIELD('finance', 'finance_account_id', door_contract_id=paired_door, status='active') or CFIELD('finance', 'finance_account_id', door_contract_id=paired_door, status='approved') or CFIELD('finance', 'finance_account_id', door_contract_id=paired_door, status='delinquent') or CFIELD('finance', 'finance_account_id', door_contract_id=paired_door, status='paid_off')))"
  - promo_financing_share: "K('deferred_interest_share') if (window_plan_promo == 'deferred_interest' or door_plan_promo == 'deferred_interest') else (K('equal_pay_share') if (window_plan_promo == 'zero_apr_equal_payment' or door_plan_promo == 'zero_apr_equal_payment') else 1.0)"
  - door_stage: "CFIELD('door', 'status', door_contract_id=paired_door)"
  - door_commitment_share: "K('unmeasured_door_share') if door_stage == 'signed' else (K('measured_door_share') if door_stage == 'measured' else 1.0)"
  - result: "RND((P('door_bundle_discount_pct') + door_project_step + window_project_step) * bundle_timing_share * promo_financing_share * door_commitment_share * credit_basis, 2) if paired_door != None else 0"
  compute_basis:
    live_door_count: "For a household holding exactly one Ridgeline door contract that is not cancelled, and only for such a household"
    single_door: "paired with that door contract"
    single_door_signed: "when that door contract was signed within the bundle window of calendar days before or after this contract's signed date, its discount program is none and this contract's discount program is none"
    single_door_program: "when that door contract was signed within the bundle window of calendar days before or after this contract's signed date, its discount program is none and this contract's discount program is none"
    paired_door: "when that door contract was signed within the bundle window of calendar days before or after this contract's signed date, its discount program is none and this contract's discount program is none; otherwise such a household's window contract earns no door bundle discount"
    door_signed: "The credit basis depends on which contract began the project"
    customer_change_lines: "the credit is figured on the signed contract price plus the customer change-order lines on the contract"
    final_measure_on: "and the contract's openings while it is not yet measured)"
    measured_openings: "the series base price per opening times the openings the completed final measure confirmed (the largest count should more than one completed final measure be recorded, and the contract's openings while it is not yet measured)"
    credit_basis: "The credit basis depends on which contract began the project: when the door contract was signed before this window contract, the door was the first purchase and the credit is figured on the window product only, the series base price per opening times the openings the completed final measure confirmed (the largest count should more than one completed final measure be recorded, and the contract's openings while it is not yet measured), with no credit on options; when both were signed on the same day, the two were bought as one project and the credit is figured on the signed contract price plus the customer change-order lines on the contract; when the window contract was signed before the door contract, the credit is figured on the signed contract price."
    door_price: "A door-project step is added to the window series bundle percentage by the door contract's signed price"
    door_project_step: "at least the large door-project price adds the large door step; at least the mid door-project price but less than the large one adds the mid door step; a lower price adds nothing."
    project_openings: "A window-project step is also added by the openings the completed final measure confirmed on this contract (the largest count should more than one completed final measure be recorded)"
    window_project_step: "at least the large window-project opening count adds the large window step; at least the mid window-project opening count but fewer than the large one adds the mid window step; fewer openings, or a contract not yet measured, adds nothing."
    signing_gap_days: "The rate after both steps is multiplied by a timing share set by the calendar days between the two signing dates"
    bundle_timing_share: "more than the late add-on day count takes the late add-on share; more than the prompt day count but no more than the late add-on day count takes the mid add-on share; no more than the prompt day count takes a share of one."
    window_plan_promo: "A financing account is read only while it is in force, that is approved, active, delinquent or paid off; a cancelled or charged-off account is never read, and a contract with no account in force counts as not financed on a promotional plan."
    door_plan_promo: "when either contract of the pair is financed on a Ridgeline plan with a deferred-interest promotion, the deferred-interest share"
    promo_financing_share: "It is multiplied by a promotional-financing share: when either contract of the pair is financed on a Ridgeline plan with a deferred-interest promotion, the deferred-interest share; otherwise, when either is financed on a zero-interest equal-payment plan, the equal-payment share; otherwise a share of one."
    door_stage: "It is multiplied by a door-commitment share set by the door contract's stage"
    door_commitment_share: "a door contract still signed and not yet measured takes the unmeasured-door share; a measured door contract takes the measured-door share; a door contract that is ordered or further along takes a share of one."
    result: "The window series bundle percentage and the two steps are added first, the three shares are then applied to that sum, the result is multiplied by the credit basis, and the credit is rounded to the cent once, at the end."
  factors:
  - id: bundle_credit_basis
    effect: method
    decides: credit_basis
    bindings: [door_signed, customer_change_lines, final_measure_on, measured_openings, credit_basis]
    ladder:
    - when: "the door contract was signed before this window contract"
      method: "the credit is figured on the window product only: the series base price per opening times the openings the completed final measure confirmed (the largest count should more than one be recorded; the contract's openings while unmeasured), options excluded"
    - when: "both contracts were signed on the same day"
      method: "the credit is figured on the signed contract price plus the customer change-order lines on the contract"
    - when: "otherwise (the window contract was signed first)"
      method: "the credit is figured on the signed contract price"
    baseline:
      credit_basis: "F('contract_price')"
    evidence: [cross_category, date]
    cross_difficulty: door
  - id: door_project_step
    effect: parameter
    decides: door_project_step
    bindings: [door_price, door_project_step]
    ladder:
    - when: "the door contract's signed price is at least the large door-project price"
      value: "K('large_door_step')"
    - when: "it is at least the mid door-project price but less than the large one"
      value: "K('mid_door_step')"
    - when: "otherwise"
      value: "0"
    baseline:
      door_project_step: "0"
    evidence: [cross_category]
    cross_difficulty: door
  - id: window_project_step
    effect: parameter
    decides: window_project_step
    bindings: [project_openings, window_project_step]
    ladder:
    - when: "the completed final measure confirmed at least the large window-project opening count on this contract"
      value: "K('large_window_step')"
    - when: "it confirmed at least the mid window-project opening count but fewer than the large one"
      value: "K('mid_window_step')"
    - when: "otherwise (fewer openings, or not yet measured)"
      value: "0"
    baseline:
      window_project_step: "0"
    evidence: [history]
    cross_difficulty: null
  - id: bundle_timing_share
    effect: parameter
    decides: bundle_timing_share
    bindings: [signing_gap_days, bundle_timing_share]
    ladder:
    - when: "the two signing dates are more than the late add-on day count apart"
      value: "K('late_addon_share')"
    - when: "they are more than the prompt day count but no more than the late add-on day count apart"
      value: "K('mid_addon_share')"
    - when: "otherwise (no more than the prompt day count apart)"
      value: "1.0"
    baseline:
      bundle_timing_share: "1.0"
    evidence: [cross_category, date]
    cross_difficulty: null
  - id: promo_financing_share
    effect: parameter
    decides: promo_financing_share
    bindings: [window_plan_promo, door_plan_promo, promo_financing_share]
    ladder:
    - when: "the window contract or the door contract is financed on a Ridgeline plan with a deferred-interest promotion"
      value: "K('deferred_interest_share')"
    - when: "neither is, but one of them is financed on a zero-interest equal-payment plan"
      value: "K('equal_pay_share')"
    - when: "otherwise"
      value: "1.0"
    baseline:
      promo_financing_share: "1.0"
    evidence: [cross_category, tier_param]
    cross_difficulty: finance
  - id: door_commitment_share
    effect: parameter
    decides: door_commitment_share
    bindings: [door_stage, door_commitment_share]
    ladder:
    - when: "the door contract is still signed and not yet measured"
      value: "K('unmeasured_door_share')"
    - when: "the door contract is measured"
      value: "K('measured_door_share')"
    - when: "otherwise (ordered or further along)"
      value: "1.0"
    baseline:
      door_commitment_share: "1.0"
    evidence: [cross_category]
    cross_difficulty: door
  baseline:
    rule: >-
      The standard door bundle credit is the window series bundle percentage times the signed contract price, rounded to the cent, booked as one door bundle discount credit dated the day it is granted.
    params: [door_bundle_discount_pct]
  inputs:
    history:
    - {table: window_transactions, aggregate: sum, field: amount, filters: {event_type: window_change_order}}
    - {table: window_transactions, aggregate: max, field: openings_affected, filters: {event_type: window_measure_visit, visit_kind: final_measure, visit_outcome: completed}}
    - {category: door, table: door_contracts, aggregate: count, field: door_contract_id, filters: {status: [signed, measured, ordered, installed, closed]}}
    cross_category: [door, finance]
- id: window_ext_deposit_balance
  base_policy_refs: [window_agg_payment_application, window_booking_deposit, window_final_balance, window_price_credits, window_oversize_pricing, window_change_orders]
  overwrite:
  - base_policy: window_booking_deposit
    superseded_clause: >-
      For a contract paid by cash, check or card, the required deposit is the larger of the series deposit percentage of the signed contract price and the series deposit minimum, but never more than the signed contract price.
    replaced_by: >-
      For the required booking deposit of a contract not yet released to the factory, and only for it, the required deposit is figured on the measured contract value under these terms instead of on the signed contract price alone; the deposit window, the booking of the final measure, the card limit and the recording of money as booking deposit or progress payment stay as the base rule states them.
  - base_policy: window_booking_deposit
    superseded_clause: >-
      For a contract whose payment method is Ridgeline financing, the required deposit is the series financed deposit percentage of the signed contract price with no minimum, and is zero where that percentage is zero.
    replaced_by: >-
      For a contract paid by Ridgeline financing and not yet released to the factory, and only for such a contract, the required deposit is the series financed deposit percentage of the measured contract value, with no minimum, and nothing where that percentage is zero; a financed contract already released stays under the base rule.
  trigger: on_request
  subject: [window_payment_received]
  computes: amount
  target_tool: pay_deposit_balance_19bfa79b
  params:
    large_project_value: 25000
    mid_project_value: 15000
    large_project_step: 0.1
    mid_project_step: 0.05
    paint_upfront_share: 1.0
    glass_upfront_share: 0.5
    many_oversize_openings: 3
    many_oversize_upfront_share: 1.0
    some_oversize_upfront_share: 0.5
  rule: >-
    For the required booking deposit of a contract not yet released to the factory, and only for it, the required deposit is figured on the measured contract value under these terms instead of on the signed contract price alone; the deposit window, the booking of the final measure, the card limit and the recording of money as booking deposit or progress payment stay as the base rule states them.
    For a contract paid by Ridgeline financing and not yet released to the factory, and only for such a contract, the required deposit is the series financed deposit percentage of the measured contract value, with no minimum, and nothing where that percentage is zero; a financed contract already released stays under the base rule.
    The measured contract value is the signed contract price plus the change-order lines and the fees on the contract, less the price credits.
    For a household holding exactly one Ridgeline door contract that is not cancelled, the deposit balance is not worked out until the ledger carries this contract's door bundle discount credit whenever that door contract was signed within the bundle window of this contract and the discount programs of both contracts are none; for every other household the deposit balance is worked out on the credits already on the ledger.
    The deposit balance is the required deposit less the payments received toward the contract net of refunds, never below zero, rounded to the cent, and it is paid as a booking deposit.
    The standard required deposit is the larger of the series deposit percentage of the measured contract value, rounded to the cent, and the series deposit minimum, but never more than the measured contract value.
    The deposit percentage used for a contract paid by cash, check or card steps down with the measured contract value: at least the large-project value takes the series deposit percentage less the large-project step; at least the mid-project value but less than the large-project value takes the series deposit percentage less the mid-project step; a lower value takes the series deposit percentage.
    How the required deposit is figured depends on how the contract is paid and what it carries: a contract paid by Ridgeline financing requires the series financed deposit percentage of the measured contract value, with no minimum, and nothing where that percentage is zero; a contract paid by cash, check or card that carries exterior color, laminated glass or oversize surcharge lines requires the deposit percentage of the measured contract value plus, for the special-order lines (exterior color and laminated glass) and for the oversize surcharge lines, their upfront share of the part of those lines the percentage leaves uncovered, the sum rounded to the cent and never more than the measured contract value; any other contract requires the standard required deposit.
    The special-order upfront share is the paint upfront share when the contract carries an exterior color line, the glass upfront share when it carries a laminated glass line and no exterior color line, and nothing otherwise.
    The oversize upfront share is set by the openings the completed final measure recorded above the series standard united-inch bracket: at least the many-oversize opening count takes the many-oversize upfront share, at least one but fewer takes the some-oversize upfront share, and none takes nothing.
  prerequisite:
  - problem: window_ext_door_bundle_credit
    kind: value_input
    gate: measured_value
    form: state
    policy_source: >-
      For a household holding exactly one Ridgeline door contract that is not cancelled, the deposit balance is not worked out until the ledger carries this contract's door bundle discount credit whenever that door contract was signed within the bundle window of this contract and the discount programs of both contracts are none; for every other household the deposit balance is worked out on the credits already on the ledger.
    condition: >-
      For a household holding exactly one Ridgeline door contract that is not cancelled, the deposit balance is not worked out until the ledger carries this contract's door bundle discount credit whenever that door contract was signed within the bundle window of this contract and the discount programs of both contracts are none; for every other household the deposit balance is worked out on the credits already on the ledger.
    resolved_by: post_door_bundle_credit_ed16c33c
    effect: >-
      Once the door bundle discount credit is booked, the price credits on the contract rise by that credit, so the measured contract value, and with it the required deposit and the deposit balance, fall.
  cross_category: []
  compute:
  - change_order_lines: "SUM('window_transactions', 'amount', event_type='window_change_order')"
  - fees_on_contract: "SUM('window_transactions', 'amount', event_type='window_fee_assessed')"
  - price_credits: "SUM('window_transactions', 'amount', event_type='window_price_credit')"
  - measured_value: "F('contract_price') + change_order_lines + fees_on_contract - price_credits"
  - deposit_pct_step: "K('large_project_step') if measured_value >= K('large_project_value') else (K('mid_project_step') if measured_value >= K('mid_project_value') else 0)"
  - cash_deposit_pct: "P('booking_deposit_pct') - deposit_pct_step"
  - paint_line_value: "SUM('window_transactions', 'amount', event_type='window_change_order', change_kind='exterior_color')"
  - laminated_line_value: "SUM('window_transactions', 'amount', event_type='window_change_order', change_kind='laminated_glass')"
  - special_order_upfront_share: "K('paint_upfront_share') if paint_line_value > 0 else (K('glass_upfront_share') if laminated_line_value > 0 else 0)"
  - oversize_line_value: "SUM('window_transactions', 'amount', event_type='window_change_order', change_kind='oversize_surcharge')"
  - final_measure_oversize: "MAX('window_transactions', 'oversize_opening_count', event_type='window_measure_visit', visit_kind='final_measure', visit_outcome='completed')"
  - oversize_upfront_share: "K('many_oversize_upfront_share') if final_measure_oversize >= K('many_oversize_openings') else (K('some_oversize_upfront_share') if final_measure_oversize >= 1 else 0)"
  - special_order_or_oversize_lines: "COUNT('window_transactions', event_type='window_change_order', change_kind='exterior_color') + COUNT('window_transactions', event_type='window_change_order', change_kind='laminated_glass') + COUNT('window_transactions', event_type='window_change_order', change_kind='oversize_surcharge')"
  - required_deposit: "RND(P('financed_deposit_pct') * measured_value, 2) if F('payment_method') == 'ridgeline_financing' else (MN(measured_value, RND(cash_deposit_pct * measured_value + special_order_upfront_share * (1 - cash_deposit_pct) * (paint_line_value + laminated_line_value) + oversize_upfront_share * (1 - cash_deposit_pct) * oversize_line_value, 2)) if (F('payment_method') == 'cash_check_card' and special_order_or_oversize_lines > 0) else MN(measured_value, MX(RND(cash_deposit_pct * measured_value, 2), P('booking_deposit_min'))))"
  - payments_received: "SUM('window_transactions', 'amount', event_type='window_payment_received')"
  - refunds_issued: "SUM('window_transactions', 'amount', event_type='window_refund_issued')"
  - result: "MX(0, RND(required_deposit - (payments_received - refunds_issued), 2))"
