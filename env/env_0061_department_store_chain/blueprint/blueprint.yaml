name: env_0061_department_store_chain
company: Marlowe & Finch

background: |
  Marlowe & Finch is a national department store chain founded in Philadelphia in 1891, operating 118 full-line stores in 31 states together with mfinch.com and the Marlowe & Finch app, and selling apparel, shoes, beauty, home, furniture, fine jewelry and designer collections. Its customer care center serves shoppers by phone and chat in a warm, precise and unhurried voice, the way a long-established specialty floor would.
  Every purchase is kept as a purchase record per unit under its order or receipt number, and the merchandise class of the item is one of Apparel, Shoes & Accessories; Beauty & Fragrance; Home & Kitchen; Electronics & Small Appliances; Fine Jewelry & Watches; Designer Handbags & Luxury; or Furniture & Mattresses, each record carrying its payments, price adjustments, returns and refunds over its life.
  The Marlowe & Finch credit card program is issued by Northgate Retail Bank, N.A. and offers the private-label Marlowe & Finch Store Card, Store Card Plus and Store Card Elite and the co-brand Marlowe & Finch Mastercard, Platinum Mastercard and World Elite Mastercard; each account books purchases, payments, fees, interest, credits and monthly statements, and records billing disputes.
  Finch Circle is the free loyalty program, held by most regular shoppers at one of six tiers - Finch Circle Member, Silver, Gold, Platinum, Diamond and Icon - and each membership keeps a ledger of points earned and deducted, Finch Notes issued, redeemed and lapsed, and complimentary alteration credit.
  The Marlowe & Finch Gift Registry offers the Celebration, Graduation, Housewarming, Baby, Anniversary and Wedding Registry; a registrant's registry records the items requested, the gifts guests buy from it, completion purchases, registry rewards and registry credit from returned gifts.
  Marlowe & Finch Alterations runs a tailoring shop in every full-line store, opening one ticket per garment in the Express Hem & Cuff, Standard Alterations, Tailored Suiting, Formal & Evening Wear, Bridal Alterations or Leather & Specialty service class, with charges, waivers, payments and refunds booked on the ticket.
  Marlowe & Finch Home Delivery brings furniture, mattresses and rugs to the home as Curbside Delivery, Threshold Delivery, Room of Choice Delivery, White Glove Delivery, White Glove Delivery with Assembly or Premier White Glove with Haul-Away, billing charges and credits on each booking.
  Marlowe & Finch Gift Cards cover the Marlowe & Finch Gift Card, the Marlowe & Finch eGift Card, the Merchandise Credit Card, the Registry Reward Card, the Corporate Gift Card and the Marlowe & Finch Bonus Card, each card number holding a balance moved by issues, reloads, redemptions and transfers.
  Each customer has one profile with a registered mobile number and email, date of birth, billing ZIP code and mailing address, and card customers also have the last four digits of their Social Security number on file.
  Typical callers are long-time shoppers who carry a store card or Mastercard alongside a Finch Circle membership, often with a recent online order, a return in progress, a garment at the alterations shop or a registry for an upcoming wedding or baby.
  They bring months of history with them: statements and payments, a late fee or an unfamiliar charge, points from purchases and returns, notes nearing their expiry, gifts bought from or returned to a registry, and tickets and deliveries in various stages.
  Many calls touch several of these at once, because a single purchase can be charged to a card, earn points, come from a registry, be altered and later be returned or price-adjusted.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoffs

difficulties:
  - name: card_billing_and_disputes
    claim:
      categories: [card]
      event_types: [card_dispute_filed, card_dispute_withdrawn, card_fee_reversal, card_fee, card_autopay_change, card_credit_limit_change, card_reissue, card_closure, card_credit_balance_refund, card_payment]
    summary: >
      Cardmembers of any of the six Marlowe & Finch cards call about their bill: a late fee they want waived, a charge
      they do not recognize or that posted twice, a return credit that never appeared, a payment that came back from
      their bank, AutoPay that drafted the wrong amount, a higher credit line, a lost card, a credit balance left after a
      refund, or closing the account, and the setting varies with the card held, the account status (active, restricted,
      closed), whether a second account on the other network is held, and the history of statements, payments, late fees
      and earlier courtesy waivers. The governing records are the card account, its transactions, statements, disputes and
      service requests, read together with Marlowe & Finch purchase, return and delivery records when the charge in
      question is a store purchase; the rules are a mix of gates and computations, such as the dispute notice window
      counted from the first statement showing the charge and the open-dispute check in card_billing_dispute, the late fee
      choice and its cap at the minimum due in card_evt_late_fee, the per-card courtesy allowance and on-time history in
      card_courtesy_fee_waiver, the account age, on-time streak and per-card increase ceilings in card_credit_line_increase
      within card_agg_combined_credit_line, the expedited replacement fee per card in card_replacement, and the payment
      cut-off and returned-payment rules in card_evt_payment_crediting and card_evt_returned_payment. In the domain a
      statement is issued, its due date passes, payments are credited, fees and interest post, and a notice of error is
      investigated and resolved within the card program's schedule; the order a particular conversation must follow is
      never set by these base rules. Customer care reverses fees, records credit line changes, AutoPay instructions,
      replacement cards, payments by phone and credit balance refunds, while giving notice of a billing error, withdrawing
      it, and asking to close the account are the cardmember's own acts that the agent hands over for the cardmember to
      perform. Requests no card rule decides, such as refunding interest outside a dispute, lowering the APR, a hardship
      payment plan, a quality complaint about an outside merchant's goods, or correcting a credit bureau report, can only
      be transferred as POLICY_NOT_COVERED.

  - name: finch_circle_rewards
    claim:
      categories: [loyalty]
      event_types: [loyalty_enrollment, loyalty_tier_change, loyalty_points_adjustment, loyalty_points_reversal, loyalty_note_issue, loyalty_cancellation]
    summary: >
      Finch Circle members at every tier call because points from a purchase never posted, a return took more points than
      expected, a Finch Note expired days ago, a note used on an order that was later returned has not come back, their
      tier did not move up after a large purchase or moved down at the review, a store card upgrade should have lifted
      their tier, or they want to join or leave the program; settings differ by tier held, membership status, the store or
      co-brand card status they hold, and the history of earn, reversal, conversion, redemption and lapse entries. The
      records are the membership, its points, note and benefit ledgers and its service requests, read alongside purchase
      and return records and card accounts; the rules include the missing-points claim window and waiting period per tier
      in loyalty_missing_points, the proportional deduction in loyalty_evt_points_reversal, the note value attributable to
      returned merchandise and its minimum validity per tier in loyalty_note_reinstatement, the per-tier courtesy reissue
      allowance and reissue window in loyalty_expired_note_courtesy, the qualifying-spend thresholds, soft landing and card
      status floor in loyalty_tier_qualification, and the enrollment gates and one-membership rule in
      loyalty_enrollment_rules and loyalty_agg_multi_holding. In the domain purchases post points, blocks of points convert
      to notes, notes are redeemed or lapse, returns take points back, and tiers move at upgrades and at the annual review;
      the order a particular conversation must follow is never set by these base rules. Customer care credits missing
      points, reissues and reinstates notes, applies tier changes and enrolls members, while cancelling a membership is the
      member's own act that the agent hands over for the member to confirm. Requests no rule decides, such as moving points
      to a spouse's membership, matching a tier from another retailer, restoring points forfeited for inactivity or
      reversing a program-abuse suspension, can only be transferred as POLICY_NOT_COVERED.

  - name: purchases_returns_and_price_adjustments
    claim:
      categories: [order]
      event_types: [order_return_start, order_refund, order_price_adjustment, order_cancellation, order_comfort_exchange]
    summary: >
      Shoppers call about units they bought in store, online, in the app or by phone: returning something past what they
      think the deadline is, a refund smaller than expected, an item that went on sale a week after they bought it, an
      order line they want cancelled before it ships, a gift they received, or a mattress that is not comfortable; the
      setting varies by merchandise class, purchase and price type, fulfilment, tender (including a Marlowe & Finch card
      and Finch Notes), whether the unit was a registry gift or came with a gift receipt, the shopper's Finch Circle tier,
      and the unit's history of adjustments and earlier returns. The records are purchase records, their payment,
      adjustment and refund entries and return records, read with card accounts, memberships and registries; the rules are
      the per-class return deadline with the tier extension and the holiday "later of" deadline in order_return_eligibility,
      the restocking, label and gift-with-purchase deductions and their waivers in order_evt_refund, the per-class
      adjustment window with the tier extension, exclusions and per-unit limit in order_price_adjustment_rules, the
      no-receipt limits in order_agg_no_receipt_returns, the comfort window in order_mattress_comfort_exchange, and the gift
      and registry destinations in order_gift_and_registry_returns. In the domain a unit is ordered, shipped and completed,
      may be put into return and received back, and is refunded to its tender, while card credits, points deductions and
      note reinstatements follow in the other programs; the order a particular conversation must follow is never set by
      these base rules. Customer care grants price adjustments, cancels unshipped units and books comfort exchanges, while
      starting a return of the customer's own merchandise is the customer's act that the agent hands over. Requests no rule
      decides, such as matching a competitor's price, returning an item bought at another retailer, or compensation for a
      late parcel beyond the return terms, can only be transferred as POLICY_NOT_COVERED.

  - name: gift_registry_services
    claim:
      categories: [registry]
      event_types: [registry_return_credit, registry_completion_purchase, registry_event_date_change, registry_visibility_change, registry_cancel, registry_gift_purchase, registry_item_add]
    summary: >
      Registrants of all six registry types call to return duplicate gifts, to use the completion discount on what guests
      did not buy, to move their event date, to make the registry private, to link a gift a guest bought without
      selecting the registry, to ask about registry rewards, or to cancel a registry for an event that will not happen;
      the setting varies with the registry type and status, the event date and how often it has moved, the registrant's
      Finch Circle tier and Marlowe & Finch card, and the history of items, guest gifts, completion purchases, rewards and
      credit. The records are the registry, its entries and its service requests, read with the guests' purchase and return
      records; the rules include the "later of" return deadline counted from the event date in registry_gift_returns, the
      completion window per type in registry_completion_period, the completion percent, card and tier bonuses, minimum days
      on the registry and cap in registry_completion_discount, the change count and shift limit in registry_event_date_rules,
      the rewards percent, minimum and cap per type in registry_rewards_rules, the link window in registry_gift_linking, and
      the one-registry-per-type rule in registry_agg_multi_holding. In the domain a registry is created, items are added,
      guests buy gifts, the completion period opens on its date and closes, rewards are paid out and remaining credit is
      converted; the order a particular conversation must follow is never set by these base rules. Customer care books
      registry credit for returned gifts, records completion purchases, date and visibility changes, items and gift links,
      while cancelling the registry is the registrant's own act that the agent hands over for confirmation. Requests no rule
      decides, such as transferring rewards to another person, merging two registries, reopening a closed completion period
      or a registry for a business event, can only be transferred as POLICY_NOT_COVERED.

  - name: alterations_and_tailoring
    claim:
      categories: [alteration]
      event_types: [alteration_dropoff, alteration_charge, alteration_charge_waiver, alteration_service_change, alteration_cancel, alteration_remake, alteration_payment, alteration_refund]
    summary: >
      Customers call about garments at the alterations shop: whether hemming the trousers they just bought is free, why a
      ticket shows a charge, upgrading to rush before an event, paying with their Finch Circle alteration credit, cancelling
      a ticket, a suit that still does not fit after pickup, or a damaged garment; the setting varies with the service class,
      whether the garment was bought at Marlowe & Finch and at what price type and when, the customer's Finch Circle tier
      and alteration credit balance, and the ticket's status, quote, charges, waivers, payments and remakes. The records are
      the ticket and its charge entries, read with purchase records and the membership's benefit ledger; the rules include
      the complimentary operations, purchase window and per-purchase limit in alteration_complimentary_basic and
      alteration_agg_complimentary_per_purchase, operation prices, lined surcharge and rush fee in alteration_pricing, rush
      availability and the tier waiver in alteration_rush_service, credit and tender use in alteration_payment_rules, the
      before-work cancellation in alteration_cancellation_rules, the remake window and count per class in
      alteration_remake_rules, and the lead-time and deposit rules in alteration_intake_rules. In the domain a garment is
      dropped off, worked on, made ready and collected, possibly brought back for a remake or left unclaimed; the order a
      particular conversation must follow is never set by these base rules. Customer care opens tickets, books charges and
      waivers, upgrades to rush, records payments and refunds, cancels tickets before work and accepts remakes, while the
      customer alone decides to spend their own alteration credit or pay, which the agent records only on the customer's
      instruction. Requests no rule decides, such as compensation for an event missed because a garment was late, altering
      a rented garment, or alterations at a store without a tailoring shop, can only be transferred as POLICY_NOT_COVERED.
