# ---- events (every write of this category) ----
events:
  - type: alteration_dropoff
    target: alteration_tickets
    mutation: create
    meaning: "A customer drops off a garment at a store alterations shop and an alteration ticket is opened with the agreed operations and quote."
    grain: "One row per garment ticket."
    fields:
      variant_name: "Service class of the work, as the official class name."
      status: "dropped_off at creation."
      ticket_number: "Alteration ticket number printed on the claim stub."
      garment_description: "Garment as described on the ticket."
      purchase_id: "Marlowe & Finch purchase record of the garment, when bought at Marlowe & Finch."
      dropoff_date: "Date of drop-off."
      promised_date: "Date the garment is promised ready."
      needed_by_date: "Date the customer needs the garment (event date), when recorded."
      rush_service: "Whether rush service was bought."
      quoted_total: "Total of the quoted operation charges, USD."
    triggers: []
  - type: alteration_work_start
    target: alteration_tickets
    mutation: {transition: {from: dropped_off, to: in_progress}}
    meaning: "The tailor starts the work."
    grain: "One transition per ticket."
    fields:
      status: "Set to in_progress."
    triggers: []
  - type: alteration_ready
    target: alteration_tickets
    mutation: {transition: {from: in_progress, to: ready}}
    meaning: "The work is finished and the garment is ready for pickup."
    grain: "One transition per completion of work (again after a remake)."
    fields:
      status: "Set to ready."
      ready_date: "Date the garment became ready."
    triggers: []
  - type: alteration_pickup
    target: alteration_tickets
    mutation: {transition: {from: ready, to: picked_up}}
    meaning: "The customer collects the garment."
    grain: "One transition per collection."
    fields:
      status: "Set to picked_up."
      pickup_date: "Date of collection."
    triggers: []
  - type: alteration_cancel
    target: alteration_tickets
    mutation: {transition: {from: dropped_off, to: cancelled}}
    meaning: "The ticket is cancelled at the customer's request before work starts."
    grain: "One transition per cancelled ticket."
    fields:
      status: "Set to cancelled."
      cancelled_date: "Date of cancellation."
    triggers:
      - event: "alteration:alteration_charge_waiver"
        map: {waiver_reason: cancellation_before_work}
  - type: alteration_disposal
    target: alteration_tickets
    mutation: {transition: {from: ready, to: disposed}}
    meaning: "A garment unclaimed past the hold period is donated."
    grain: "One transition per disposed ticket."
    fields:
      status: "Set to disposed."
    triggers: []
  - type: alteration_remake
    target: alteration_tickets
    mutation: {transition: {from: picked_up, to: in_progress}}
    meaning: "A remake of unsatisfactory work is accepted and the garment goes back into work."
    grain: "One transition per remake."
    fields:
      status: "Set to in_progress."
      remake_count: "Number of remakes on the ticket, including this one."
      promised_date: "New promised date for the corrected work."
    triggers: []
  - type: alteration_service_change
    target: alteration_tickets
    mutation: update
    meaning: "The customer upgrades an open ticket to rush service, or the promised date is moved."
    grain: "One update per change."
    fields:
      rush_service: "Whether rush service applies after the change."
      promised_date: "Promised date after the change."
    triggers:
      - event: "alteration:alteration_charge"
        when: {rush_service: true}
        map: {charge_type: rush_fee}
  - type: alteration_charge
    target: alteration_charges
    meaning: "A charge is booked on the ticket: an operation, a lined-garment surcharge, a rush fee or an extra fitting."
    grain: "One row per operation per ticket, one rush fee per ticket, one row per extra fitting."
    distinguish_by: [charge_type, operation_code, fitting_number]
    fields:
      charge_date: "Date the charge was booked."
      amount: "Charge amount, positive USD."
      charge_type: "operation, lined_surcharge, rush_fee or extra_fitting_fee."
      operation_code: "Operation charged (for operation and lined_surcharge rows); not_applicable otherwise."
      fitting_number: "Ordinal of the extra fitting charged; 0 for other rows."
    account: ticket_balance
    direction: in
    triggers: []
  - type: alteration_charge_waiver
    target: alteration_charges
    meaning: "A charge is waived: complimentary basic work, a Finch Circle rush fee waiver, cancellation before work, a remake, or charges above the quote tolerance."
    grain: "One row per charge waived."
    distinguish_by: [original_alteration_charge_id]
    fields:
      charge_date: "Date of the waiver."
      amount: "Amount waived, positive USD, equal to the charge or the part of it waived."
      waiver_reason: "complimentary_basic, loyalty_rush_waiver, cancellation_before_work, remake_no_charge or quote_overrun."
      original_alteration_charge_id: "The charge row being waived."
    account: ticket_balance
    direction: out
    triggers: []
  - type: alteration_payment
    target: alteration_charges
    meaning: "The customer pays a deposit at drop-off or the balance at pickup, with a tender or Finch Circle alteration credit."
    grain: "One row per payment kind per tender per ticket."
    distinguish_by: [payment_kind, tender_type]
    fields:
      charge_date: "Date of payment."
      amount: "Amount paid, positive USD."
      payment_kind: "deposit or balance."
      tender_type: "mf_card, bank_card, debit, cash, gift_card or alteration_credit."
    account: ticket_balance
    direction: out
    triggers:
      - event: "loyalty:loyalty_alteration_credit_use"
        when: {tender_type: alteration_credit}
        map: {ticket_id: ticket_id, amount: amount}
  - type: alteration_refund
    target: alteration_charges
    meaning: "A payment is refunded because the ticket was cancelled before work or charges were waived after payment."
    grain: "One row per payment refunded."
    distinguish_by: [original_alteration_charge_id]
    fields:
      charge_date: "Date of the refund."
      amount: "Amount refunded, positive USD."
      tender_type: "Tender refunded, the same as the payment refunded."
      original_alteration_charge_id: "The payment row being refunded."
    account: ticket_balance
    direction: in
    triggers:
      - event: "loyalty:loyalty_alteration_credit_restore"
        when: {tender_type: alteration_credit}
        map: {ticket_id: ticket_id, amount: amount}
  - type: alteration_damage_settlement
    target: alteration_charges
    meaning: "Compensation is settled for a garment damaged or lost while in the alterations shop."
    grain: "One row per ticket settled."
    distinguish_by: [charge_type]
    fields:
      charge_date: "Date of the settlement."
      amount: "Compensation paid, positive USD."
      charge_type: "damage_compensation."
    triggers:
      - event: "giftcard:giftcard_issue"
        map: {amount: amount, issue_reason: alteration_damage_settlement}

# ---- derived measures ----
measures:
  - id: alteration_msr_operation_charges
    window: "All history of the ticket."
    measure: "Sum of amount of alteration_charge rows of the ticket with charge_type operation or lined_surcharge."
  - id: alteration_msr_complimentary_ops_on_purchase
    window: "All tickets naming the same purchase_id."
    measure: "Count of alteration_charge_waiver rows with waiver_reason complimentary_basic on tickets whose purchase_id is the purchase concerned."

# ---- policies ----
policies:
  - id: alteration_agg_multi_holding
    subject: [alteration_dropoff]
    rule: >-
      A customer may have any number of alteration tickets (max_per_customer null); each ticket covers one garment
      (garments_per_ticket), and a suit jacket and its trousers are two tickets. Prices, turnaround, deposits, fittings,
      remakes and complimentary work are decided per ticket.
    eligibility: []
    params:
      max_per_customer: null

  - id: alteration_agg_complimentary_per_purchase
    subject: [alteration_charge_waiver]
    rule: >-
      Complimentary basic work is counted per purchase record across all tickets: the complimentary operations granted on
      every ticket that names the same purchase_id (alteration_msr_complimentary_ops_on_purchase) never exceed the class's
      complimentary_max_operations in total, so a garment brought back on a second ticket receives only what remains of
      that allowance. Finch Circle alteration credit is counted per membership and benefit year under the Finch Circle
      rules, not per ticket.
    eligibility: []
    params: {}
    measures: [alteration_msr_complimentary_ops_on_purchase]

  - id: alteration_intake_rules
    subject: [alteration_dropoff]
    rule: >-
      A garment is accepted in the service class that covers it (service_scope). Garments not bought at Marlowe & Finch are
      accepted only where non_mf_items_accepted is true. Where measuring_appointment_required is true the tailor measures
      the customer at drop-off, and where needed_by_date_required is true the needed_by_date is recorded. When the
      needed_by_date is fewer than min_lead_days_before_needed calendar days after the dropoff_date, the ticket is accepted
      only with rush service, and declined when rush service is not available or its turnaround would miss the date. The
      quote uses the price list in force on the dropoff_date (price_list_effective_basis) and a written quote is honored for
      quote_validity_days. The promised_date is the dropoff_date plus turnaround_business_days business days, plus
      peak_season_extra_days when the dropoff_date falls in peak_season_months, plus outsourced_extra_business_days for
      outsourced work; with rush service it is the dropoff_date plus rush_turnaround_business_days business days. A deposit
      of deposit_pct of the quoted_total, but at least deposit_min_usd and never more than the quoted_total, is taken at
      drop-off where deposit_pct is above 0. Altering a Marlowe & Finch purchase ends its eligibility for return or
      exchange (altered_item_returnable false) except for a defect unrelated to the alteration.
    eligibility: []
    params: {}

  - id: alteration_pricing
    subject: [alteration_charge]
    rule: >-
      Each operation on the ticket is charged at the class's operation_prices; when the garment is lined, a lined_surcharge
      row adds lined_garment_surcharge_pct of that operation's price, rounded half up to the cent. A rush fee row charges
      rush_fee_pct of alteration_msr_operation_charges, rounded half up to the cent, once per ticket. Each fitting beyond
      fittings_included is charged extra_fitting_fee_usd. Operations beyond the quote are added only after the customer
      approves them (additional_work_approval); when the final operation charges exceed the quoted_total by more than
      quote_overrun_tolerance_pct without such approval, the excess is waived with waiver_reason quote_overrun. Pressing is
      included (pressing_included) and never charged.
      Sales tax on alteration charges follows tax_on_alterations: it is included in the listed prices and never added on top.
    eligibility: []
    params: {}
    formula:
      rush_fee_amount: "round(alteration_msr_operation_charges * rush_fee_pct / 100, 2)"
    measures: [alteration_msr_operation_charges]

  - id: alteration_complimentary_basic
    subject: [alteration_charge_waiver]
    rule: >-
      Basic operations are complimentary (waiver_reason complimentary_basic) when all of the following hold: the class's
      complimentary_basic_eligible is true; the ticket names a Marlowe & Finch purchase record in the customer's own name
      whose price_type is one of complimentary_price_types (sale, clearance, doorbuster and final sale items are charged,
      sale_item_complimentary false); and the operation is one of the class's complimentary_operations. The garment is
      dropped off within the complimentary window after the purchase's completed_date. The window counts calendar days
      starting the day after the completed_date as day 1, and a drop-off on the last day of
      complimentary_purchase_window_days is in time. At most complimentary_max_operations operations are complimentary
      (see alteration_agg_complimentary_per_purchase), taken from the qualifying operations with the highest price first.
      Lined surcharges on a complimentary operation are complimentary too; rush fees and extra fittings never are. A
      gift with a gift receipt counts as the recipient's purchase only when the purchase record is in the recipient's name.
    eligibility:
      - id: complimentary_window
        applies_to: [alteration_charge_waiver]
        kind: time
        condition: "The garment is dropped off within the complimentary window after the purchase's completed_date."
        evidence_fields: [purchases.completed_date, alteration_tickets.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.purchase_id]
          action_bindings:
            alteration_tickets.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase's completed_date"
          anchor_source: purchases.completed_date
          relation: not_after
          duration_source: variants.complimentary_purchase_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the completed_date as day 1, and a drop-off on the last day of complimentary_purchase_window_days is in time."
          boundary: inclusive
    params:
      per_tier:
        "Express Hem & Cuff": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Standard Alterations": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Tailored Suiting": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Formal & Evening Wear": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Bridal Alterations": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Leather & Specialty": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}

  - id: alteration_rush_service
    subject: [alteration_service_change, alteration_charge, alteration_charge_waiver]
    rule: >-
      Rush service is offered only where rush_available is true and the shop has capacity on the day (rush_capacity_note).
      A ticket can be upgraded to rush while the work has not finished. The ticket is in dropped_off or in_progress status.
      The upgrade moves the promised_date to the date of the upgrade plus rush_turnaround_business_days business days and
      books the rush fee under alteration_pricing. A Finch Circle member whose tier held on the ticket's dropoff_date has
      alteration_rush_fee_waived true has the rush fee waived (waiver_reason loyalty_rush_waiver) when the class's
      loyalty_rush_waiver_applies is true. A rush fee is not refunded when the garment is ready on the rush promised date,
      and is waived in full when the shop misses that date.
    eligibility:
      - id: rush_open_ticket
        applies_to: [alteration_service_change]
        kind: state
        condition: "The ticket is in dropped_off or in_progress status."
        evidence_fields: [alteration_tickets.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.status]
          action_bindings:
            alteration_tickets.status: status
        state_contract:
          field: alteration_tickets.status
          allowed: [dropped_off, in_progress]
    params:
      per_tier:
        "Express Hem & Cuff": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Standard Alterations": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Tailored Suiting": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Formal & Evening Wear": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Bridal Alterations": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Leather & Specialty": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}

  - id: alteration_payment_rules
    subject: [alteration_payment, alteration_refund]
    rule: >-
      The deposit is paid at drop-off and the balance_due at pickup (payment_due), with any of tenders_accepted. Finch
      Circle alteration credit (tender_type alteration_credit) can pay only operation and lined-surcharge charges, only on
      a ticket that names a Marlowe & Finch purchase record, and only where the class's loyalty_credit_applicable is true;
      it is applied up to the lower of those charges remaining after waivers and the member's alteration_credit_balance,
      and the membership must be active. Rush fees, extra fittings and garments not bought at Marlowe & Finch are paid with
      other tenders. A refund always goes back to the tender of the payment it refunds and names that payment as
      original_alteration_charge_id; refunded alteration credit is restored under the Finch Circle rules. A garment is
      released only when balance_due is 0.00.
    eligibility: []
    params: {}

  - id: alteration_cancellation_rules
    subject: [alteration_cancel, alteration_charge_waiver, alteration_refund]
    rule: >-
      A ticket can be cancelled at the customer's request only before the work starts, while it is in dropped_off status.
      On cancellation every charge on the ticket is waived (waiver_reason cancellation_before_work) and every payment,
      including the deposit (deposit_refundable_before_work), is refunded to its tender. Once work has started the ticket
      cannot be cancelled: if the customer takes the garment back unfinished, the operations already completed are charged
      at the price list (cancellation_after_start_charge) and the deposit is applied to them.
    eligibility: []
    params: {}

  - id: alteration_remake_rules
    subject: [alteration_remake, alteration_charge_waiver]
    rule: >-
      When the customer reports that completed work does not fit as agreed, a remake is accepted free of charge. The remake
      is requested within the remake window after the pickup_date. The window counts calendar days starting the day after
      the pickup_date as day 1, and a request on the last day of remake_window_days is in time. The ticket's remake_count
      must be below the class's remake_count_max. The remake corrects the agreed operations only: correction charges are
      waived with waiver_reason remake_no_charge, and any new operation the customer asks for is charged under
      alteration_pricing. A garment worn, washed or altered elsewhere after pickup is not remade.
    eligibility:
      - id: remake_window
        applies_to: [alteration_remake]
        kind: time
        condition: "The remake is requested within the remake window after the pickup_date."
        evidence_fields: [alteration_tickets.pickup_date, alteration_tickets.ticket_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.ticket_id]
          action_bindings:
            alteration_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pickup_date"
          anchor_source: alteration_tickets.pickup_date
          relation: not_after
          duration_source: variants.remake_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the pickup_date as day 1, and a request on the last day of remake_window_days is in time."
          boundary: inclusive
    params:
      per_tier:
        "Express Hem & Cuff": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Standard Alterations": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Tailored Suiting": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Formal & Evening Wear": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Bridal Alterations": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Leather & Specialty": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}

  - id: alteration_unclaimed_garments
    subject: [alteration_disposal]
    rule: >-
      A ready garment is held for pickup_hold_days calendar days after its ready_date; a reminder goes out on day
      unclaimed_reminder_days. A garment not collected by the end of the hold period is donated
      (unclaimed_disposition); the deposit and any payment are kept, the unpaid balance is not pursued, and no compensation
      is owed. A customer who calls before the hold period ends can collect the garment on the ordinary terms.
    eligibility: []
    params: {}

  - id: alteration_damage_rules
    subject: [alteration_damage_settlement]
    rule: >-
      When a garment is damaged or lost while in the shop, Marlowe & Finch compensates the customer. The damage is
      reported within the damage window after the pickup_date. The window counts calendar days starting the day after the
      pickup_date as day 1, and a report on the last day of damage_report_window_days is in time; a lost garment is
      reported any time after its promised_date. Compensation is the net amount paid for the garment on its Marlowe & Finch
      purchase record (or the customer's documented purchase price for other garments), at most the class's
      damage_liability_cap_usd, settled once per ticket as a merchandise credit card (damage_settlement_form), and every
      charge on the ticket is waived. Damage from fabric defects disclosed and accepted at drop-off is not compensated.
    eligibility:
      - id: damage_window
        applies_to: [alteration_damage_settlement]
        kind: time
        condition: "The damage is reported within the damage window after the pickup_date."
        evidence_fields: [alteration_tickets.pickup_date, alteration_tickets.ticket_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.ticket_id]
          action_bindings:
            alteration_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pickup_date"
          anchor_source: alteration_tickets.pickup_date
          relation: not_after
          duration_source: variants.damage_report_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the pickup_date as day 1, and a report on the last day of damage_report_window_days is in time; a lost garment is reported any time after its promised_date."
          boundary: inclusive
    params:
      per_tier:
        "Express Hem & Cuff": {liability_cap: "=damage_liability_cap_usd"}
        "Standard Alterations": {liability_cap: "=damage_liability_cap_usd"}
        "Tailored Suiting": {liability_cap: "=damage_liability_cap_usd"}
        "Formal & Evening Wear": {liability_cap: "=damage_liability_cap_usd"}
        "Bridal Alterations": {liability_cap: "=damage_liability_cap_usd"}
        "Leather & Specialty": {liability_cap: "=damage_liability_cap_usd"}

  - id: alteration_shop_workflow
    subject: [alteration_work_start, alteration_ready, alteration_pickup]
    rule: >-
      Work start, ready and pickup are recorded by the alterations shop; customer care never records them. Specialty work
      (specialty_partner_outsourced) is sent to the partner workshop. A garment is handed over at pickup only after
      balance_due reaches 0.00 under alteration_payment_rules. When the garment is not ready on the promised_date the
      customer is told the new date; a missed rush date waives the rush fee under alteration_rush_service.
    eligibility: []
    params: {}
