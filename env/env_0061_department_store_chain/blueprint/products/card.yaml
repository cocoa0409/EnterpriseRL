# ---- events (every write of this category) ----
events:
  - type: card_application
    target: card_accounts
    mutation: create
    meaning: "A customer applies for a Marlowe & Finch card (store card or Mastercard) in store, online or in the app; the account record opens in applied status pending the credit decision."
    grain: "One row per application for one card product by one primary applicant."
    fields:
      variant_name: "The card applied for, written as its official card name."
      status: "Always applied at creation."
      application_date: "Date the application was submitted."
    triggers: []
  - type: card_approval
    target: card_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: "Northgate Retail Bank approves the application and the account opens with a credit line and a statement closing day."
    grain: "One transition per approved application."
    fields:
      status: "Set to active."
      opened_date: "Approval date; day 1 of the welcome window and the anchor of card-year and account-age counts."
      credit_limit: "Initial credit line assigned within the card's initial credit line range."
      card_last4: "Last four digits of the card number issued."
      statement_closing_day: "Day of the month (1-28) on which each billing cycle closes."
    triggers: []
  - type: card_decline
    target: card_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The application fails the card's credit criteria and is declined."
    grain: "One transition per declined application."
    fields:
      status: "Set to declined."
      closed_date: "Date of the credit decision."
    triggers: []
  - type: card_restriction
    target: card_accounts
    mutation: {transition: {from: active, to: restricted}}
    meaning: "Charging privileges are suspended after consecutive missed minimum payments."
    grain: "One transition per suspension."
    fields:
      status: "Set to restricted."
    triggers: []
  - type: card_reinstatement
    target: card_accounts
    mutation: {transition: {from: restricted, to: active}}
    meaning: "Charging privileges are restored once the past-due amount is paid in full."
    grain: "One transition per reinstatement."
    fields:
      status: "Set to active."
    triggers: []
  - type: card_closure
    target: card_accounts
    mutation: {transition: [{from: active, to: closed}, {from: restricted, to: closed}]}
    meaning: "The cardmember's own request to close the account takes effect."
    grain: "One transition per closed account."
    fields:
      status: "Set to closed."
      closed_date: "Date the closure took effect."
    triggers: []
  - type: card_charge_off
    target: card_accounts
    mutation: {transition: {from: restricted, to: charged_off}}
    meaning: "A restricted account reaches the charge-off day count past due and is charged off."
    grain: "One transition per charged-off account."
    fields:
      status: "Set to charged_off."
      closed_date: "Charge-off date."
    triggers: []
  - type: card_credit_limit_change
    target: card_accounts
    mutation: update
    meaning: "The credit line of an open account is raised on review or at the cardmember's request."
    grain: "One update per credit line change."
    fields:
      credit_limit: "The new credit line in USD."
      last_credit_limit_change_date: "Date the new credit line took effect."
    triggers: []
  - type: card_autopay_change
    target: card_accounts
    mutation: update
    meaning: "The cardmember enrolls in, changes or cancels AutoPay."
    grain: "One update per AutoPay instruction change."
    fields:
      autopay_option: "The AutoPay amount chosen (minimum_due, statement_balance, fixed_amount) or none when cancelled."
      autopay_fixed_amount: "The fixed AutoPay amount when autopay_option is fixed_amount; 0.00 otherwise."
    triggers: []
  - type: card_status_change
    target: card_accounts
    mutation: update
    meaning: "The annual status review moves the account to another card status of the same network (store card ladder or Mastercard ladder)."
    grain: "One update per status change."
    fields:
      variant_name: "The new card status, as the official card name."
      status_review_date: "Date of the status review that made the change."
    triggers: []
  - type: card_reissue
    target: card_accounts
    mutation: update
    meaning: "A replacement card with a new number is issued after a lost, stolen or damaged card report."
    grain: "One update per replacement card number."
    fields:
      card_last4: "Last four digits of the replacement card number."
    triggers: []
  - type: card_purchase
    target: card_transactions
    meaning: "A purchase charged to the card posts to the account, at Marlowe & Finch or (for a Mastercard) at any other merchant."
    grain: "One row per posted purchase authorization."
    distinguish_by: [txn_date, amount, merchant_name, order_number]
    fields:
      txn_date: "Date the purchase was made."
      post_date: "Date the purchase posted to the account."
      amount: "Purchase amount charged after any welcome discount, positive USD."
      merchant_name: "Merchant name as it appears on the statement."
      merchant_category: "marlowe_finch, supermarket, gas_station or other_merchant."
      order_number: "Marlowe & Finch order or receipt number charged (one charge per order or register transaction); empty for outside merchants."
      statement_period: "Billing period (YYYY-MM of the closing date) the purchase belongs to."
      promo_plan: "Special financing plan placed on the purchase (deferred_interest_12, deferred_interest_18) or none."
      welcome_discount_amount: "Welcome discount taken off this purchase in USD; 0.00 when none."
    account: revolving_balance
    direction: in
    triggers:
      - event: "loyalty:loyalty_points_earn"
        when: {merchant_category: marlowe_finch}
        map: {card_txn_id: card_txn_id, earn_source: card_bonus}
      - event: "loyalty:loyalty_points_earn"
        when: {merchant_category: [supermarket, gas_station, other_merchant]}
        map: {card_txn_id: card_txn_id, earn_source: card_outside_spend}
  - type: card_payment
    target: card_transactions
    meaning: "A payment from the cardmember is credited to the account."
    grain: "One row per payment credited."
    distinguish_by: [txn_date, amount, payment_channel]
    fields:
      txn_date: "Date the payment was received, after applying the payment cut-off time."
      post_date: "Date the payment posted."
      amount: "Payment amount, positive USD."
      payment_channel: "Channel of the payment (online, mobile_app, phone_automated, phone_agent, mail, in_store, autopay)."
      statement_period: "Billing period in which the payment was received."
    account: revolving_balance
    direction: out
    triggers: []
  - type: card_payment_returned
    target: card_transactions
    meaning: "A payment is returned unpaid by the cardmember's bank and its credit is reversed."
    grain: "One row per returned payment."
    distinguish_by: [original_card_txn_id]
    fields:
      txn_date: "Date the bank returned the payment."
      post_date: "Date the reversal posted."
      amount: "Amount of the returned payment, positive USD."
      original_card_txn_id: "Reference of the payment that was returned."
      statement_period: "Billing period in which the reversal posted."
    account: revolving_balance
    direction: in
    triggers: []
  - type: card_merchandise_credit
    target: card_transactions
    meaning: "A Marlowe & Finch refund (a return refund, an order cancellation refund or a price adjustment) on a purchase charged to the card posts as a credit."
    grain: "One row per Marlowe & Finch refund or price adjustment record settled to the card."
    distinguish_by: [order_event_id]
    fields:
      txn_date: "Date the return was processed."
      post_date: "Date the credit posted."
      amount: "Credit amount, positive USD."
      merchant_name: "Merchant name as it appears on the statement."
      purchase_id: "Reference of the purchase record whose merchandise was returned."
      return_id: "Reference of the return record being refunded; empty for a cancellation refund or price adjustment."
      order_event_id: "Reference of the Marlowe & Finch refund or price adjustment record this credit settles."
      original_card_txn_id: "Reference of the card purchase transaction originally charged for this purchase."
      statement_period: "Billing period in which the credit posted."
    account: revolving_balance
    direction: out
    triggers: []
  - type: card_fee
    target: card_transactions
    meaning: "A fee is assessed on the account (late fee, returned payment fee, annual fee, expedited replacement fee, foreign transaction fee)."
    grain: "One row per fee assessed for one cause in one billing period."
    distinguish_by: [fee_type, statement_period, original_card_txn_id]
    fields:
      txn_date: "Date the fee was assessed."
      post_date: "Date the fee posted."
      amount: "Fee amount, positive USD."
      fee_type: "late_fee, returned_payment_fee, annual_fee, expedited_replacement_fee or foreign_transaction_fee."
      statement_period: "Billing period the fee belongs to (for a late fee, the period of the statement whose due date was missed)."
      original_card_txn_id: "The transaction that caused the fee (the returned payment or the foreign purchase); empty for late, annual and replacement fees."
    account: revolving_balance
    direction: in
    triggers: []
  - type: card_fee_reversal
    target: card_transactions
    meaning: "A previously assessed fee is reversed, as a courtesy or because it was assessed in error."
    grain: "One row per reversed fee."
    distinguish_by: [original_card_txn_id]
    fields:
      txn_date: "Date the reversal was granted."
      post_date: "Date the reversal posted."
      amount: "Amount reversed, positive USD, equal to the fee reversed."
      fee_type: "Type of the fee reversed."
      original_card_txn_id: "Reference of the fee transaction being reversed."
      reversal_reason: "courtesy_waiver, assessed_in_error or annual_fee_refund."
      statement_period: "Billing period in which the reversal posted."
    account: revolving_balance
    direction: out
    triggers: []
  - type: card_interest_charge
    target: card_transactions
    meaning: "Interest for a billing cycle posts on the statement closing date, including deferred interest assessed when a special financing balance is not paid in full by the promotion end."
    grain: "One row per interest type per billing period (deferred interest one row per promotional purchase)."
    distinguish_by: [interest_type, statement_period, original_card_txn_id]
    fields:
      post_date: "Statement closing date on which the interest posted."
      amount: "Interest amount, positive USD."
      interest_type: "purchase_interest, deferred_interest or minimum_interest_charge."
      statement_period: "Billing period the interest belongs to."
      original_card_txn_id: "For deferred interest, the promotional purchase whose promotion expired unpaid; empty otherwise."
    account: revolving_balance
    direction: in
    triggers: []
  - type: card_dispute_credit
    target: card_transactions
    meaning: "A credit for a disputed charge posts, either as a temporary (provisional) credit during the investigation or as the final credit when the dispute is resolved for the cardmember."
    grain: "One row per credit kind per disputed charge."
    distinguish_by: [original_card_txn_id, dispute_credit_kind]
    fields:
      txn_date: "Date the credit was granted."
      post_date: "Date the credit posted."
      amount: "Credited amount, positive USD, equal to the disputed amount."
      original_card_txn_id: "Reference of the disputed charge."
      dispute_credit_kind: "provisional or final."
      statement_period: "Billing period in which the credit posted."
    account: revolving_balance
    direction: out
    triggers: []
  - type: card_dispute_rebill
    target: card_transactions
    meaning: "A provisional dispute credit is reversed because the charge was found correct as billed or the dispute was withdrawn."
    grain: "One row per reversed provisional credit."
    distinguish_by: [original_card_txn_id]
    fields:
      txn_date: "Date of the rebill."
      post_date: "Date the rebill posted."
      amount: "Rebilled amount, positive USD, equal to the provisional credit."
      original_card_txn_id: "Reference of the disputed charge."
      statement_period: "Billing period in which the rebill posted."
    account: revolving_balance
    direction: in
    triggers: []
  - type: card_credit_balance_refund
    target: card_transactions
    meaning: "A credit balance on the account is refunded to the cardmember by check or to the bank account on file."
    grain: "One row per refund issued."
    distinguish_by: [txn_date, amount]
    fields:
      txn_date: "Date the refund was issued."
      post_date: "Date the refund posted."
      amount: "Refund amount, positive USD, equal to the credit balance refunded."
      refund_method: "check or ach_to_bank_on_file."
      statement_period: "Billing period in which the refund posted."
    account: revolving_balance
    direction: in
    triggers: []
  - type: card_statement_issued
    target: card_statements
    meaning: "The monthly statement closes and is issued, fixing the statement balance, the minimum payment due and the payment due date."
    grain: "One row per account per billing period."
    distinguish_by: [statement_period]
    fields:
      statement_period: "Billing period (YYYY-MM of the closing date)."
      statement_date: "Statement closing date."
      payment_due_date: "Payment due date of this statement."
      statement_balance: "New balance at the closing date in USD."
      minimum_payment_due: "Minimum payment due in USD."
      past_due_amount: "Unpaid minimum payments from earlier statements included in the minimum due, USD."
      disputed_amount_excluded: "Amount under an open billing dispute excluded from the minimum payment, USD."
      promo_balance: "Remaining balance of special financing purchases in USD."
    triggers: []
  - type: card_dispute_filed
    target: card_disputes
    meaning: "The cardmember gives notice of a billing error on one posted transaction and a dispute is opened."
    grain: "One row per billing-error notice for one transaction."
    distinguish_by: [disputed_card_txn_id, notice_date]
    fields:
      disputed_card_txn_id: "Reference of the posted transaction disputed."
      dispute_reason: "unauthorized_charge, duplicate_charge, amount_incorrect, credit_not_posted, merchandise_not_received or payment_not_credited."
      disputed_amount: "Amount the cardmember says is in error, positive USD."
      notice_date: "Date the notice was received."
      notice_channel: "online_form, mail or phone."
      first_statement_date: "Statement date of the first statement on which the disputed transaction appeared."
      outcome: "pending at filing."
    triggers:
      - event: "card:card_dispute_credit"
        when: {dispute_reason: [unauthorized_charge, duplicate_charge]}
        map: {original_card_txn_id: disputed_card_txn_id, amount: disputed_amount, dispute_credit_kind: provisional}
  - type: card_dispute_resolved
    target: card_disputes
    meaning: "The investigation of a dispute concludes, either in the cardmember's favor or with the charge found correct as billed."
    grain: "One row per resolution of one disputed transaction."
    distinguish_by: [disputed_card_txn_id, resolution_date]
    fields:
      disputed_card_txn_id: "Reference of the disputed transaction."
      dispute_reason: "Reason recorded at filing."
      disputed_amount: "Amount in dispute, positive USD."
      notice_date: "Date the original notice was received."
      outcome: "resolved_in_cardmember_favor or correct_as_billed."
      resolution_date: "Date the resolution letter was sent."
    triggers:
      - event: "card:card_dispute_credit"
        when: {outcome: resolved_in_cardmember_favor, dispute_reason: {not: [unauthorized_charge, duplicate_charge]}}
        map: {original_card_txn_id: disputed_card_txn_id, amount: disputed_amount, dispute_credit_kind: final}
      - event: "card:card_dispute_rebill"
        when: {outcome: correct_as_billed, dispute_reason: [unauthorized_charge, duplicate_charge]}
        map: {original_card_txn_id: disputed_card_txn_id, amount: disputed_amount}
  - type: card_dispute_withdrawn
    target: card_disputes
    meaning: "The cardmember withdraws an open dispute, for example after recognizing the charge."
    grain: "One row per withdrawal of one dispute."
    distinguish_by: [disputed_card_txn_id, resolution_date]
    fields:
      disputed_card_txn_id: "Reference of the disputed transaction."
      dispute_reason: "Reason recorded at filing."
      disputed_amount: "Amount that was in dispute, positive USD."
      notice_date: "Date the original notice was received."
      outcome: "withdrawn."
      resolution_date: "Date of the withdrawal."
    triggers:
      - event: "card:card_dispute_rebill"
        when: {dispute_reason: [unauthorized_charge, duplicate_charge]}
        map: {original_card_txn_id: disputed_card_txn_id, amount: disputed_amount}

# ---- derived measures ----
measures:
  - id: card_msr_calendar_year_card_spend
    window: "One calendar year, 1 January through 31 December, by txn_date (the current year to date when evaluated mid-year)."
    measure: "Sum of amount of card_purchase rows with merchant_category marlowe_finch, minus the sum of amount of card_merchandise_credit rows, on the account in the window."
  - id: card_msr_card_year_spend
    window: "The card year ending the day before the account anniversary of opened_date, by txn_date."
    measure: "Sum of amount of all card_purchase rows on the account in the window, minus card_merchandise_credit rows in the window."
  - id: card_msr_late_fees_in_lookback
    window: "The late_fee_repeat_lookback_cycles statement periods immediately preceding the statement period of the missed payment (that period itself excluded)."
    measure: "Count of card_fee rows with fee_type late_fee whose statement_period is in the window and which have no card_fee_reversal with reversal_reason assessed_in_error."
  - id: card_msr_courtesy_waivers_rolling_12m
    window: "Rolling 12 calendar months ending on the handling date, by txn_date."
    measure: "Count of card_fee_reversal rows with reversal_reason courtesy_waiver on the account in the window."
  - id: card_msr_on_time_statement_streak
    window: "Statements of the account, walking backward from the most recent statement whose payment due date has passed (or from the statement immediately before a named statement)."
    measure: "Number of consecutive statements, counted backward, for which the card_payment amounts with txn_date on or after the statement_date and on or before the payment_due_date add up to at least minimum_payment_due; a statement with minimum_payment_due 0.00 counts as on time."
  - id: card_msr_consecutive_missed_minimums
    window: "Statements of the account whose payment due date has passed, walking backward from the most recent one."
    measure: "Number of consecutive statements, counted backward, for which card_payment amounts with txn_date on or after the statement_date and on or before the payment_due_date add up to less than minimum_payment_due."
  - id: card_msr_cycle_interest_and_fees
    window: "One billing period (statement_period)."
    measure: "Sum of amount of card_interest_charge and card_fee rows with that statement_period, minus card_fee_reversal rows with that statement_period."

# ---- policies ----
policies:
  - id: card_agg_multi_holding
    subject: [card_application]
    rule: >-
      A customer may hold at most max_per_customer card accounts at the same time, and at most one of them on each network:
      one private-label account (Marlowe & Finch Store Card, Store Card Plus or Store Card Elite) and one co-brand account
      (Marlowe & Finch Mastercard, Platinum Mastercard or World Elite Mastercard). An account counts as held while its status
      is applied, active or restricted; closed, charged_off and declined accounts do not count. The customer holds no other
      card account of the same network in applied, active or restricted status. When the customer already holds an account
      on the requested network, a new application is not taken; moving up that network's ladder happens only through the
      status review, and moving to the other network is a new application for the other network's card. A customer with a
      charged_off card account whose closed_date is within charge_off_reapply_wait_months full calendar months before the
      application date is not taken for any card.
      The network of a card is its card_network value, and only a card whose acceptance_scope is mastercard_network can be used outside Marlowe & Finch.
    eligibility:
      - id: one_open_account_per_network
        applies_to: [card_application]
        kind: dedup
        condition: "The customer holds no other card account of the same network in applied, active or restricted status."
        evidence_fields: [card_accounts.customer_id, card_accounts.variant_name, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.customer_id]
          action_bindings:
            card_accounts.customer_id: customer_id
        dedup_contract:
          table: card_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, restricted]}
          distinct_fields: [variant_name]
    params:
      max_per_customer: 2
      charge_off_reapply_wait_months: 84

  - id: card_agg_combined_credit_line
    subject: [card_approval, card_credit_limit_change]
    rule: >-
      The credit lines of all of a customer's card accounts in active or restricted status are aggregated. Neither an approval
      nor a credit line change may bring the sum of those credit lines above combined_credit_line_cap_usd; when the full
      amount the card's own rules would allow does not fit, the new or increased line is reduced to the amount that fits,
      and when less than cli_min_increment_usd fits, no increase is made. Closed, charged_off and declined accounts do not
      count toward the sum. Holding both a private-label and a co-brand account changes nothing else in either account's
      terms: each account keeps its own APR, fees, statement and status ladder.
    eligibility: []
    params:
      combined_credit_line_cap_usd: 60000.00
      cli_min_increment_usd: 100.00

  - id: card_underwriting
    subject: [card_application, card_approval, card_decline]
    rule: >-
      Only cards whose application_open value is true can be applied for: Marlowe & Finch Store Card, Marlowe & Finch
      Mastercard and Marlowe & Finch World Elite Mastercard. The requested card is open to direct application. Store Card Plus,
      Store Card Elite and Platinum Mastercard are reached only through the status review. Northgate Retail Bank approves an
      application when the applicant meets the card's min_credit_score, min_applicant_age and min_annual_income_usd, and
      declines it otherwise; an applicant who fails the co-brand card's criteria is not converted automatically to a store
      card and must apply for it separately. On approval the account opens in active status with a credit line between the
      card's initial_credit_line_min_usd and initial_credit_line_max_usd (subject to card_agg_combined_credit_line), a
      statement_closing_day, and card_last4 of the plastic issued. The credit decision is the bank's and is
      never made or overridden by customer care.
    eligibility:
      - id: card_open_to_application
        applies_to: [card_application]
        kind: authorization
        condition: "The requested card is open to direct application."
        evidence_fields: [card_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.variant_name]
          action_bindings:
            card_accounts.variant_name: variant_name
    params: {}

  - id: card_welcome_discount
    subject: [card_purchase]
    rule: >-
      A newly approved Marlowe & Finch Store Card, Marlowe & Finch Mastercard or Marlowe & Finch World Elite Mastercard
      account receives the card's welcome_discount_pct off Marlowe & Finch purchases charged to it. The purchase txn_date falls
      within the welcome window that starts on the account opened_date. The window runs from the opened_date (day 1) through
      the day before the opened_date plus welcome_discount_window_days calendar days, so that a purchase dated on that later
      day is outside it. The discount is taken on the pre-discount purchase amount, rounded half up to the cent, and the
      discounts across all purchases in the window together never exceed the card's welcome_discount_cap_usd; the purchase that
      reaches the cap receives only the remainder. The discount is recorded on the purchase as welcome_discount_amount and the
      amount charged is the pre-discount amount less that discount. It does not apply to outside-merchant purchases, gift
      card purchases, or purchases on an account reached by status upgrade. It is a new-cardmember offer: it is not given
      when the customer held another Marlowe & Finch card account in active or restricted status on the application date
      (combination exclusion between the two networks). A later return of a discounted purchase refunds only the amount
      actually charged; the discount is never re-granted.
    eligibility:
      - id: within_welcome_window
        applies_to: [card_purchase]
        kind: time
        condition: "The purchase txn_date falls within the welcome window that starts on the account opened_date."
        evidence_fields: [card_accounts.opened_date, card_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.opened_date]
          action_bindings:
            card_accounts.opened_date: opened_date
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account opened_date"
          anchor_source: card_accounts.opened_date
          relation: not_after
          duration_source: variants.welcome_discount_window_days
          unit: calendar_days
          counting_rule: "The window runs from the opened_date (day 1) through the day before the opened_date plus welcome_discount_window_days calendar days, so that a purchase dated on that later day is outside it."
          boundary: exclusive
    params: {}

  - id: card_status_review
    subject: [card_status_change]
    rule: >-
      Card status moves only within a network's ladder: Store Card, Store Card Plus, Store Card Elite on the private-label
      ladder, and Mastercard, Platinum Mastercard on the co-brand ladder (World Elite Mastercard is held by application only
      and never changes status). Upgrade during the year: as soon as card_msr_calendar_year_card_spend for the current year
      reaches the status_entry_annual_card_spend_usd of a higher status on the same ladder, the account moves to the highest
      status reached within midyear_upgrade_business_days business days. Annual review: on the annual_review_day each year
      the status for the new year is set to the highest status of the ladder whose status_entry_annual_card_spend_usd the
      previous calendar year's card_msr_calendar_year_card_spend meets, or the ladder's base card when none is met; this is
      the only occasion on which a status moves down. The account is in active status. A restricted account keeps its
      current status until it is reinstated and the next review runs. Status changes never change the credit line, APR or
      card number.
      A status upgrade is made only from a card listed in the higher status's status_upgrade_from.
    eligibility:
      - id: active_account_only
        applies_to: [card_status_change]
        kind: state
        condition: "The account is in active status."
        evidence_fields: [card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.status]
          action_bindings:
            card_accounts.status: status
        state_contract:
          field: card_accounts.status
          allowed: [active]
    params:
      midyear_upgrade_business_days: 3
      annual_review_day: "January 15"
      per_tier:
        "Marlowe & Finch Store Card": {status_threshold_usd: "=status_entry_annual_card_spend_usd"}
        "Marlowe & Finch Store Card Plus": {status_threshold_usd: "=status_entry_annual_card_spend_usd"}
        "Marlowe & Finch Store Card Elite": {status_threshold_usd: "=status_entry_annual_card_spend_usd"}
        "Marlowe & Finch Mastercard": {status_threshold_usd: "=status_entry_annual_card_spend_usd"}
        "Marlowe & Finch Platinum Mastercard": {status_threshold_usd: "=status_entry_annual_card_spend_usd"}
        "Marlowe & Finch World Elite Mastercard": {status_threshold_usd: "=status_entry_annual_card_spend_usd"}
    measures: [card_msr_calendar_year_card_spend]

  - id: card_evt_payment_crediting
    subject: [card_payment]
    rule: >-
      A payment is credited as of the day it is received when it arrives through online, mobile_app, phone_automated,
      phone_agent or autopay by the payment_cutoff_time_et on a business day (Monday to Friday except Federal Reserve
      holidays); a payment received after the cut-off or on a non-business day is credited on the next business day. A
      mail payment is credited on the business day it is received at the payment address, and an in_store payment at a
      Marlowe & Finch register is credited on the day it is made. The credited date is recorded as txn_date and is the only
      date compared with a payment due date. Payment amounts up to the minimum payment due are applied as the bank chooses;
      any amount above the minimum payment due is applied first to the balance with the highest APR, except that during the
      last promo_last_cycles_paydown billing cycles before a special financing promotion expires, the excess is applied first
      to that promotional balance. A payment never needs to be applied to an amount under open billing dispute. A payment
      larger than the balance leaves a credit balance that is handled under card_evt_credit_balance_refund. Payments are taken
      on accounts in any status other than applied and declined.
      Payments are accepted only through the card's payment_channels.
    eligibility: []
    params:
      promo_last_cycles_paydown: 2

  - id: card_evt_returned_payment
    subject: [card_payment_returned]
    rule: >-
      When the cardmember's bank returns a payment unpaid, the payment's credit is reversed with a card_payment_returned row
      pointing to the original payment through original_card_txn_id, and that payment no longer counts toward any minimum
      payment. A returned payment fee is assessed as a card_fee row with fee_type returned_payment_fee, equal to the lower of
      the card's returned_payment_fee_usd and the minimum payment due on the statement immediately before the return. No
      returned payment fee is assessed when a late fee was already assessed for the same missed minimum payment, because
      one event may not draw both fees; and none is assessed when the returned payment was itself made after the due date
      it would have satisfied. The payment returned has not been reversed before.
    eligibility:
      - id: payment_not_already_reversed
        applies_to: [card_payment_returned]
        kind: dedup
        condition: "The payment returned has not been reversed before."
        evidence_fields: [card_transactions.original_card_txn_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.original_card_txn_id]
          action_bindings:
            card_transactions.original_card_txn_id: original_card_txn_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {original_card_txn_id: original_card_txn_id}
          duplicate_filters: {event_type: [card_payment_returned]}
          distinct_fields: []
    params: {}

  - id: card_autopay
    subject: [card_autopay_change]
    rule: >-
      A cardmember can enroll in AutoPay with one of the card's autopay_options, change the option or the fixed amount, or
      cancel it by setting autopay_option to none. A change made at least autopay_change_lead_business_days business days
      before a payment due date applies to that due date; a later change applies from the following due date, and the
      instruction already scheduled for the nearer due date runs unchanged. AutoPay pays on the payment due date the minimum
      payment due, the statement balance, or the fixed amount; when the fixed amount is below the minimum payment due, the
      minimum payment due is paid instead, and when the statement balance or minimum due is 0.00 nothing is drafted. Amounts
      under open billing dispute are excluded from the AutoPay draft. The account is not in declined or charged_off status.
      AutoPay stays in force after an account is closed until the balance is paid in full.
    eligibility:
      - id: autopay_account_state
        applies_to: [card_autopay_change]
        kind: state
        condition: "The account is not in declined or charged_off status."
        evidence_fields: [card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.status]
          action_bindings:
            card_accounts.status: status
        state_contract:
          field: card_accounts.status
          allowed: [active, restricted, closed]
    params: {}

  - id: card_evt_statement_minimum_payment
    subject: [card_statement_issued]
    rule: >-
      A statement is issued for every billing period on the account's statement_closing_day in which the account has a
      non-zero balance or any transaction. The payment_due_date is the statement_date plus the card's grace_period_days
      calendar days. Amounts under open billing dispute on the closing date are recorded as disputed_amount_excluded and are
      left out of the minimum payment calculation. The minimum payment due is the full statement balance (less the excluded
      disputed amount) when that is at or below the card's min_payment_floor_usd; otherwise it is the greater of
      min_payment_floor_usd and min_payment_principal_pct percent of that balance plus the interest and fees of the period
      (card_msr_cycle_interest_and_fees), rounded half up to the cent, and in every case past_due_amount is added on top. A
      credit or zero balance has a minimum payment due of 0.00. The promo_balance shows the remaining special financing
      balance and the statement shows the promotion's end date.
    eligibility: []
    params: {}
    formula:
      minimum_payment_due: "round(max(min_payment_floor_usd, (statement_balance - disputed_amount_excluded) * min_payment_principal_pct / 100 + card_msr_cycle_interest_and_fees), 2) + past_due_amount"
    measures: [card_msr_cycle_interest_and_fees]

  - id: card_evt_late_fee
    subject: [card_fee]
    rule: >-
      A late fee (fee_type late_fee) is assessed when the card_payment amounts credited with txn_date on or after the
      statement_date and on or before the payment_due_date add up to less than that statement's minimum_payment_due. The
      payment due date of the statement has passed. The fee is assessed on the calendar day after the payment_due_date, which
      is the first day on which the minimum can no longer be met on time; a payment credited on the due date itself is on
      time. The base fee is the card's late_fee_repeat_usd when card_msr_late_fees_in_lookback is at least one, and the card's
      late_fee_first_usd otherwise; the fee charged is the lower of that base fee and the minimum_payment_due of the missed
      statement. No late fee is assessed when the minimum payment due was 0.00, when the only shortfall is an amount under
      open billing dispute, or when a returned payment fee was already assessed for the same missed minimum payment. The fee
      belongs to the statement_period of the missed statement.
    eligibility:
      - id: due_date_passed
        applies_to: [card_fee]
        kind: time
        condition: "The payment due date of the statement has passed."
        evidence_fields: [card_statements.payment_due_date, card_statements.statement_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_statements.statement_period]
          action_bindings:
            card_statements.statement_period: statement_period
        temporal_basis:
          clock: frozen_time
          anchor_event: "The payment due date of the statement"
          anchor_source: card_statements.payment_due_date
          relation: not_before
          duration_source: params.late_fee_assessment_offset_days
          unit: calendar_days
          counting_rule: "The fee is assessed on the calendar day after the payment_due_date, which is the first day on which the minimum can no longer be met on time; a payment credited on the due date itself is on time."
          boundary: inclusive
    params:
      late_fee_assessment_offset_days: 1
      per_tier:
        "Marlowe & Finch Store Card": {first_fee: "=late_fee_first_usd", repeat_fee: "=late_fee_repeat_usd"}
        "Marlowe & Finch Store Card Plus": {first_fee: "=late_fee_first_usd", repeat_fee: "=late_fee_repeat_usd"}
        "Marlowe & Finch Store Card Elite": {first_fee: "=late_fee_first_usd", repeat_fee: "=late_fee_repeat_usd"}
        "Marlowe & Finch Mastercard": {first_fee: "=late_fee_first_usd", repeat_fee: "=late_fee_repeat_usd"}
        "Marlowe & Finch Platinum Mastercard": {first_fee: "=late_fee_first_usd", repeat_fee: "=late_fee_repeat_usd"}
        "Marlowe & Finch World Elite Mastercard": {first_fee: "=late_fee_first_usd", repeat_fee: "=late_fee_repeat_usd"}
    formula:
      late_fee_amount: "min(late_fee_repeat_usd if card_msr_late_fees_in_lookback >= 1 else late_fee_first_usd, minimum_payment_due)"
    measures: [card_msr_late_fees_in_lookback]

  - id: card_courtesy_fee_waiver
    subject: [card_fee_reversal]
    rule: >-
      A late fee may be reversed as a courtesy (reversal_reason courtesy_waiver) when all of the following hold: the
      card_msr_courtesy_waivers_rolling_12m count is below the card's courtesy_late_fee_waivers_per_12_months; the
      card_msr_on_time_statement_streak counted from the statement immediately before the missed statement reaches the card's
      courtesy_waiver_on_time_statements_required; and payments credited since the missed due date add up to at least the
      missed minimum payment due. Only late fees are reversed as a courtesy; returned payment, annual, expedited replacement
      and foreign transaction fees are not. Any fee assessed contrary to this charter (for example a late fee on a minimum
      that was met on time, a fee above the minimum payment due, or both a late fee and a returned payment fee for one
      missed payment) is reversed in full with reversal_reason assessed_in_error, does not count toward the courtesy
      allowance, and needs no on-time history. The fee being reversed has not been reversed before. A reversal always equals
      the full amount of the fee reversed and points to it through original_card_txn_id; partial reversals are not made.
    eligibility:
      - id: fee_not_already_reversed
        applies_to: [card_fee_reversal]
        kind: dedup
        condition: "The fee being reversed has not been reversed before."
        evidence_fields: [card_transactions.original_card_txn_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.original_card_txn_id]
          action_bindings:
            card_transactions.original_card_txn_id: original_card_txn_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {original_card_txn_id: original_card_txn_id}
          duplicate_filters: {event_type: [card_fee_reversal]}
          distinct_fields: []
    params:
      per_tier:
        "Marlowe & Finch Store Card": {waivers_allowed: "=courtesy_late_fee_waivers_per_12_months", streak_required: "=courtesy_waiver_on_time_statements_required"}
        "Marlowe & Finch Store Card Plus": {waivers_allowed: "=courtesy_late_fee_waivers_per_12_months", streak_required: "=courtesy_waiver_on_time_statements_required"}
        "Marlowe & Finch Store Card Elite": {waivers_allowed: "=courtesy_late_fee_waivers_per_12_months", streak_required: "=courtesy_waiver_on_time_statements_required"}
        "Marlowe & Finch Mastercard": {waivers_allowed: "=courtesy_late_fee_waivers_per_12_months", streak_required: "=courtesy_waiver_on_time_statements_required"}
        "Marlowe & Finch Platinum Mastercard": {waivers_allowed: "=courtesy_late_fee_waivers_per_12_months", streak_required: "=courtesy_waiver_on_time_statements_required"}
        "Marlowe & Finch World Elite Mastercard": {waivers_allowed: "=courtesy_late_fee_waivers_per_12_months", streak_required: "=courtesy_waiver_on_time_statements_required"}
    formula:
      courtesy_eligible: "card_msr_courtesy_waivers_rolling_12m < courtesy_late_fee_waivers_per_12_months and card_msr_on_time_statement_streak >= courtesy_waiver_on_time_statements_required"
    measures: [card_msr_courtesy_waivers_rolling_12m, card_msr_on_time_statement_streak]

  - id: card_evt_interest
    subject: [card_interest_charge]
    rule: >-
      Purchase interest (interest_type purchase_interest) is computed by the average daily balance method (including new
      purchases) at the card's purchase_apr_pct divided by daily_periodic_rate_divisor for each day, and posts on the
      statement closing date. Grace period: no purchase interest is charged in a billing period when the statement balance of
      the previous statement was paid in full by its payment due date (or was 0.00 or a credit). Amounts under open billing
      dispute accrue no interest while the dispute is open and none is charged afterward if the dispute is resolved in the
      cardmember's favor. When the interest computed for a period is above 0.00 but below the card's
      minimum_interest_charge_usd, the minimum_interest_charge_usd is charged instead with interest_type
      minimum_interest_charge. Special financing purchases are governed by card_promo_financing and accrue no purchase interest
      while their promotion runs.
    eligibility: []
    params: {}

  - id: card_promo_financing
    subject: [card_purchase, card_interest_charge]
    rule: >-
      A Marlowe & Finch card_purchase (one order_number) is placed on special financing (promo_plan deferred_interest_12 or
      deferred_interest_18, matching the card's promo_financing_months) when the merchandise in that order whose purchase
      records' merchandise class is one of the card's promo_financing_eligible_classes totals at least the card's
      promo_financing_min_purchase_usd; the whole charge is then promotional, and separate orders are never combined to reach
      the minimum. The account is in active status. During the promotion no interest is charged on that purchase. If the
      promotional purchase is paid in full by the end of the promotion, which is the payment due date of the statement for
      the billing period that closes promo_financing_months full calendar months after the purchase txn_date (the same day of
      the month, or the last day of a shorter month), no interest is ever charged on it. If any of it remains unpaid after
      that date, deferred interest (interest_type deferred_interest) is charged on the next statement closing date for the
      whole promotional amount from the purchase txn_date, at the card's purchase_apr_pct, with original_card_txn_id pointing
      to the promotional purchase. A merchandise credit for the promotional purchase reduces the promotional balance first and
      is treated as paid. Gift card, beauty and fragrance, and outside-merchant purchases never qualify.
    eligibility:
      - id: promo_requires_active_account
        applies_to: [card_purchase]
        kind: state
        condition: "The account is in active status."
        evidence_fields: [card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.status]
          action_bindings:
            card_accounts.status: status
        state_contract:
          field: card_accounts.status
          allowed: [active]
    params:
      per_tier:
        "Marlowe & Finch Store Card": {promo_months: "=promo_financing_months", promo_min_usd: "=promo_financing_min_purchase_usd"}
        "Marlowe & Finch Store Card Plus": {promo_months: "=promo_financing_months", promo_min_usd: "=promo_financing_min_purchase_usd"}
        "Marlowe & Finch Store Card Elite": {promo_months: "=promo_financing_months", promo_min_usd: "=promo_financing_min_purchase_usd"}
        "Marlowe & Finch Mastercard": {promo_months: "=promo_financing_months", promo_min_usd: "=promo_financing_min_purchase_usd"}
        "Marlowe & Finch Platinum Mastercard": {promo_months: "=promo_financing_months", promo_min_usd: "=promo_financing_min_purchase_usd"}
        "Marlowe & Finch World Elite Mastercard": {promo_months: "=promo_financing_months", promo_min_usd: "=promo_financing_min_purchase_usd"}

  - id: card_billing_dispute
    subject: [card_dispute_filed, card_dispute_resolved, card_dispute_withdrawn, card_dispute_credit, card_dispute_rebill]
    rule: >-
      A cardmember may dispute one posted transaction as a billing error for one of the dispute_reason values. The notice
      is received within the dispute notice window after the statement date of the first statement on which the disputed
      transaction appeared. The window counts calendar days starting the day after that statement date as day 1, and a
      notice received on the last day of dispute_notice_window_days is timely. A notice received later is not opened as a
      billing dispute. The disputed transaction has no other dispute that is still open. A dispute is open from its
      card_dispute_filed row until a card_dispute_resolved or card_dispute_withdrawn row for the same disputed_card_txn_id;
      a resolved dispute is not reopened for the same transaction and reason. Notices by online_form, mail or phone are all
      handled on this schedule. The dispute is acknowledged within dispute_ack_days and resolved within
      dispute_resolution_max_billing_cycles complete billing cycles and never later than dispute_resolution_max_days after the
      notice_date. While it is open, the disputed amount is excluded from the minimum payment, accrues no interest, draws no
      late fee and is not reported as delinquent, and the account may not be restricted for not paying it. For
      unauthorized_charge and duplicate_charge disputes a provisional credit of the disputed amount posts within the card's
      dispute_provisional_credit_business_days business days. Resolution in the cardmember's favor makes a provisional credit
      final with no further row, and for the other reasons posts a final credit of the disputed amount. A charge found
      correct as billed, or a dispute withdrawn by the cardmember, reverses any provisional credit with a card_dispute_rebill;
      the rebilled amount is not payment-due before grace_period_days calendar days after the resolution_date. Unauthorized
      use never costs the cardmember more than unauthorized_use_liability_usd. A credit_not_posted dispute for a Marlowe &
      Finch return is resolved in the cardmember's favor only when the purchase's return record shows the merchandise was
      received back, and a merchandise_not_received dispute only when the delivery record shows no completed delivery.
    eligibility:
      - id: notice_within_window
        applies_to: [card_dispute_filed]
        kind: time
        condition: "The notice is received within the dispute notice window after the statement date of the first statement on which the disputed transaction appeared."
        evidence_fields: [card_statements.statement_date, card_statements.statement_period, card_transactions.statement_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.statement_period, card_statements.statement_period]
          action_bindings:
            card_transactions.statement_period: statement_period
            card_statements.statement_period: statement_period
        temporal_basis:
          clock: frozen_time
          anchor_event: "the statement date of the first statement on which the disputed transaction appeared"
          anchor_source: card_statements.statement_date
          relation: not_after
          duration_source: variants.dispute_notice_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after that statement date as day 1, and a notice received on the last day of dispute_notice_window_days is timely."
          boundary: inclusive
      - id: no_open_dispute_on_txn
        applies_to: [card_dispute_filed]
        kind: dedup
        condition: "The disputed transaction has no other dispute that is still open."
        evidence_fields: [card_disputes.disputed_card_txn_id, card_disputes.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_disputes.disputed_card_txn_id]
          action_bindings:
            card_disputes.disputed_card_txn_id: disputed_card_txn_id
        dedup_contract:
          table: card_disputes
          mode: separate_record
          object_bindings: {disputed_card_txn_id: disputed_card_txn_id}
          duplicate_filters: {event_type: [card_dispute_filed]}
          distinct_fields: [notice_date]
    params:
      per_tier:
        "Marlowe & Finch Store Card": {provisional_credit_days: "=dispute_provisional_credit_business_days"}
        "Marlowe & Finch Store Card Plus": {provisional_credit_days: "=dispute_provisional_credit_business_days"}
        "Marlowe & Finch Store Card Elite": {provisional_credit_days: "=dispute_provisional_credit_business_days"}
        "Marlowe & Finch Mastercard": {provisional_credit_days: "=dispute_provisional_credit_business_days"}
        "Marlowe & Finch Platinum Mastercard": {provisional_credit_days: "=dispute_provisional_credit_business_days"}
        "Marlowe & Finch World Elite Mastercard": {provisional_credit_days: "=dispute_provisional_credit_business_days"}

  - id: card_evt_merchandise_credit
    subject: [card_merchandise_credit]
    rule: >-
      The refund of a Marlowe & Finch return whose purchase was charged to a card is credited to that same card account,
      never to another card, a gift card or cash, whatever the account's status (active, restricted, closed or charged_off).
      The same applies to a refund for an order cancelled before shipment and to a price adjustment. The credit names the
      order_event_id of the refund or price adjustment record, the purchase_id and (for a return) the return_id, and points
      to the original card_purchase of that order through original_card_txn_id. The credit equals the amount that record
      settles to the card, which can never exceed the amount actually charged for the merchandise (after any welcome
      discount). It posts within merchandise_credit_post_business_days business days of the refund or adjustment. No card
      credit has already posted for the same refund or price adjustment record. A credit for a special financing purchase reduces that promotional balance first. A credit that
      leaves the account with a credit balance is handled under card_evt_credit_balance_refund.
    eligibility:
      - id: one_credit_per_return
        applies_to: [card_merchandise_credit]
        kind: dedup
        condition: "No card credit has already posted for the same refund or price adjustment record."
        evidence_fields: [card_transactions.order_event_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.order_event_id]
          action_bindings:
            card_transactions.order_event_id: order_event_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {order_event_id: order_event_id}
          duplicate_filters: {event_type: [card_merchandise_credit]}
          distinct_fields: []
    params:
      merchandise_credit_post_business_days: 3

  - id: card_evt_credit_balance_refund
    subject: [card_credit_balance_refund]
    rule: >-
      A credit balance is the negative current_balance left when payments and credits exceed the amount owed. When the
      cardmember asks for a refund (a card_service_requests record with request_type credit_balance_refund), the whole
      credit balance is refunded within credit_balance_refund_business_days business days of the request when it is at least
      credit_balance_refund_min_usd. The account carries a credit balance of at least credit_balance_refund_min_usd on the
      request date. A credit balance that has remained on the account for credit_balance_auto_refund_months months is
      refunded without a request. The refund is made by check to the mailing address on file unless the cardmember asks for
      ach_to_bank_on_file, and it is booked as a card_credit_balance_refund that brings the balance back to 0.00. Refunds are
      made in every account status, including closed and charged_off; a credit balance is never moved to a gift card or to
      another card account.
    eligibility:
      - id: credit_balance_present
        applies_to: [card_credit_balance_refund]
        kind: authorization
        condition: "The account carries a credit balance of at least credit_balance_refund_min_usd on the request date."
        evidence_fields: [card_accounts.current_balance, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
    params: {}

  - id: card_delinquency_restriction
    subject: [card_restriction, card_reinstatement, card_charge_off]
    rule: >-
      Charging privileges are suspended (active to restricted) when card_msr_consecutive_missed_minimums reaches the
      card's restriction_consecutive_missed_payments; a shortfall consisting only of an amount under open billing dispute
      does not count as missed. A restricted account is reinstated (restricted to active) on the business day after
      payments credited since the restriction cover the entire past_due_amount of the latest statement; a payment that is
      later returned undoes that reinstatement test. A restricted account is charged off when its oldest unpaid minimum
      payment is charge_off_days_past_due days past its payment due date. Restriction, reinstatement and charge-off are made
      by the bank's systems; customer care can explain them but never applies or lifts them. While restricted, the account
      still receives statements, payments, merchandise credits, dispute handling and AutoPay, but no new purchases and no
      credit line increases.
    eligibility: []
    params: {}
    measures: [card_msr_consecutive_missed_minimums]

  - id: card_account_closure
    subject: [card_closure, card_fee_reversal]
    rule: >-
      Only the cardmember can close the account; customer care records the cardmember's request as a card_service_requests
      record with request_type account_closure and the closure takes effect once the cardmember confirms it. The cardmember's
      closure request is recorded as submitted. An account in active or restricted status can be closed at any time,
      whatever its balance. After closure the remaining balance stays payable under the existing terms, including any special
      financing promotion until its own end, open billing disputes continue to their resolution, merchandise credits and
      credit balance refunds keep posting, and the Finch Circle membership is not affected. When an annual fee posted within
      annual_fee_refund_window_days calendar days before the closure takes effect, that annual fee is reversed in full with
      reversal_reason annual_fee_refund. A closed account is never reopened; the customer applies again under
      card_underwriting.
    eligibility:
      - id: closure_request_on_file
        applies_to: [card_closure]
        kind: state
        condition: "The cardmember's closure request is recorded as submitted."
        evidence_fields: [card_service_requests.request_status, card_service_requests.request_type, card_service_requests.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_service_requests.card_account_id]
          action_bindings:
            card_service_requests.card_account_id: card_account_id
        state_contract:
          field: card_service_requests.request_status
          allowed: [submitted]
    params:
      annual_fee_refund_window_days: 30

  - id: card_credit_line_increase
    subject: [card_credit_limit_change]
    rule: >-
      A credit line increase, whether requested by the cardmember or offered on review, requires all of the following. The
      account is in active status. At least cli_min_months_since_open full calendar months have passed since the account
      opened_date. Full months are counted from the opened_date to the same day of a later month (the last day of the month
      when that day does not exist), and the increase is allowed on that day. At least cli_min_months_since_last_change full
      calendar months have passed since last_credit_limit_change_date when it is not empty, counted the same way. The
      card_msr_on_time_statement_streak reaches cli_on_time_statements_required. The new credit line is at most the current
      credit line plus cli_max_increase_pct percent of it, at most the card's max_credit_line_usd, and within
      card_agg_combined_credit_line; it is rounded down to a multiple of cli_min_increment_usd. A request that fails any test
      is declined and the credit line is unchanged. Credit lines are never decreased at the cardmember's request through
      customer care.
    eligibility:
      - id: cli_active_only
        applies_to: [card_credit_limit_change]
        kind: state
        condition: "The account is in active status."
        evidence_fields: [card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.status]
          action_bindings:
            card_accounts.status: status
        state_contract:
          field: card_accounts.status
          allowed: [active]
      - id: cli_account_age
        applies_to: [card_credit_limit_change]
        kind: time
        condition: "At least cli_min_months_since_open full calendar months have passed since the account opened_date."
        evidence_fields: [card_accounts.opened_date, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_account_id]
          action_bindings:
            card_accounts.card_account_id: card_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account opened_date"
          anchor_source: card_accounts.opened_date
          relation: not_before
          duration_source: variants.cli_min_months_since_open
          unit: calendar_months
          counting_rule: "Full months are counted from the opened_date to the same day of a later month (the last day of the month when that day does not exist), and the increase is allowed on that day."
          boundary: inclusive
    params:
      cli_min_increment_usd: 100.00
      per_tier:
        "Marlowe & Finch Store Card": {max_increase_pct: "=cli_max_increase_pct", max_line_usd: "=max_credit_line_usd"}
        "Marlowe & Finch Store Card Plus": {max_increase_pct: "=cli_max_increase_pct", max_line_usd: "=max_credit_line_usd"}
        "Marlowe & Finch Store Card Elite": {max_increase_pct: "=cli_max_increase_pct", max_line_usd: "=max_credit_line_usd"}
        "Marlowe & Finch Mastercard": {max_increase_pct: "=cli_max_increase_pct", max_line_usd: "=max_credit_line_usd"}
        "Marlowe & Finch Platinum Mastercard": {max_increase_pct: "=cli_max_increase_pct", max_line_usd: "=max_credit_line_usd"}
        "Marlowe & Finch World Elite Mastercard": {max_increase_pct: "=cli_max_increase_pct", max_line_usd: "=max_credit_line_usd"}
    formula:
      max_new_credit_limit: "min(credit_limit + credit_limit * cli_max_increase_pct / 100, max_credit_line_usd)"
    measures: [card_msr_on_time_statement_streak]

  - id: card_evt_annual_and_foreign_fees
    subject: [card_fee]
    rule: >-
      The annual fee (fee_type annual_fee) is the card's annual_fee_usd, billed on the statement whose billing period
      contains the anniversary of the opened_date. It is not billed on a card whose annual_fee_usd is 0.00, not billed for
      the first card year when annual_fee_first_year_waived is true, and not billed when card_msr_card_year_spend for the
      card year just ended reaches the card's annual_fee_waiver_spend_usd. The foreign transaction fee (fee_type
      foreign_transaction_fee) is the card's foreign_transaction_fee_pct of a purchase made in a foreign currency or processed
      outside the United States, rounded half up to the cent, with original_card_txn_id pointing to that purchase; a card
      whose value is 0.00 or not_applicable charges none. The expedited replacement fee is governed by card_replacement.
    eligibility: []
    params: {}
    formula:
      foreign_fee_amount: "round(amount * foreign_transaction_fee_pct / 100, 2)"
    measures: [card_msr_card_year_spend]

  - id: card_replacement
    subject: [card_reissue, card_fee]
    rule: >-
      When a cardmember reports the card lost, stolen or damaged, customer care records a card_service_requests record with
      request_type card_replacement and the replacement_speed the cardmember chooses. For a lost or stolen card the old card
      number is blocked at once and the replacement carries a new card_last4; a damaged card is replaced with a new card_last4
      as well. A standard replacement costs card_replacement_standard_fee_usd and arrives within
      card_replacement_standard_business_days business days; an expedited replacement costs the card's
      card_replacement_expedited_fee_usd (fee_type expedited_replacement_fee) and arrives within
      card_replacement_expedited_business_days business days. Charges the cardmember did not make that posted before or after
      the report are handled as unauthorized_charge disputes under card_billing_dispute. A replacement is not issued on an
      account in declined, closed or charged_off status. Replacing the card never changes the credit line, balance, AutoPay or
      status.
    eligibility: []
    params:
      per_tier:
        "Marlowe & Finch Store Card": {expedited_fee: "=card_replacement_expedited_fee_usd"}
        "Marlowe & Finch Store Card Plus": {expedited_fee: "=card_replacement_expedited_fee_usd"}
        "Marlowe & Finch Store Card Elite": {expedited_fee: "=card_replacement_expedited_fee_usd"}
        "Marlowe & Finch Mastercard": {expedited_fee: "=card_replacement_expedited_fee_usd"}
        "Marlowe & Finch Platinum Mastercard": {expedited_fee: "=card_replacement_expedited_fee_usd"}
        "Marlowe & Finch World Elite Mastercard": {expedited_fee: "=card_replacement_expedited_fee_usd"}
