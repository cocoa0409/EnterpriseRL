# Policy charter: Marlowe & Finch Home Delivery for furniture, mattresses, rugs and other large
# items. The holding is one delivery booking for one order to one address; the service level is
# the tier and fixes fees, placement, assembly, haul-away, windows and service credits.

category: delivery
display_name: Marlowe & Finch Home Delivery

binding:
  holding_table: deliveries
  event_tables: [delivery_events]
  intake_tables: [delivery_claims]
  status_field: status
  variant_field: variant_name
  quantity_fields: {charges_balance: delivery_charges}

lifecycle:
  states: [scheduled, out_for_delivery, delivered, failed_attempt, cancelled]
  transitions:
    - {from: scheduled, to: out_for_delivery, by: system, means: "The truck is loaded and dispatched on the scheduled date."}
    - {from: out_for_delivery, to: delivered, by: system, means: "The team completes the delivery and the customer signs or confirms."}
    - {from: out_for_delivery, to: failed_attempt, by: system, means: "The delivery cannot be completed: nobody is home after the wait time, or the item cannot be brought in."}
    - {from: failed_attempt, to: scheduled, by: agent, means: "A new delivery date is booked after a failed attempt."}
    - {from: scheduled, to: cancelled, by: agent, means: "The booking is cancelled before dispatch at the customer's request or because the order is cancelled."}
    - {from: failed_attempt, to: cancelled, by: system, means: "The booking is cancelled after the last allowed attempt fails or the goods are not rebooked within the storage hold."}

accounts:
  - key: delivery_charges
    unit: USD
    meaning: "Net delivery charges billed on the booking: fees and surcharges in, discounts, refunds and service credits out."

parameter_schema:
  delivery_fee_usd: "Base fee for the booking, covering up to included_items items; USD, 2 decimals."
  included_items: "Items covered by the base fee; integer."
  extra_item_fee_usd: "Fee for each item beyond included_items; USD, 2 decimals."
  placement: "Where items are placed; string enum (curb, first_door, room_of_choice)."
  packaging_removal: "Whether the team unpacks and removes packaging; boolean."
  assembly_included: "Whether basic assembly is included; boolean."
  assembly_max_minutes: "Assembly time included per booking; integer minutes, or not_applicable."
  haul_away_included: "Whether removal of old furniture or a mattress is included; boolean."
  haul_away_fee_usd: "Fee for haul-away when not included; USD, 2 decimals, or not_applicable when not offered."
  haul_away_items_max: "Items that can be hauled away per booking; integer, or not_applicable."
  stairs_flights_included: "Flights of stairs included in the fee; integer."
  extra_flight_fee_usd: "Fee per flight of stairs beyond those included; USD, 2 decimals, or not_applicable when stairs are not served."
  service_area_miles: "Road miles from the delivery center covered without surcharge; integer."
  out_of_area_surcharge_per_mile_usd: "Surcharge per road mile beyond service_area_miles; USD, 2 decimals."
  max_service_miles: "Road miles beyond which delivery is not offered; integer."
  booking_lead_business_days: "Business days between booking and the earliest delivery date; integer."
  time_window_hours: "Length of the arrival window given to the customer; integer hours."
  call_ahead_minutes: "Minutes before arrival the team calls; integer."
  weekend_available: "Whether Saturday delivery is offered; boolean."
  weekend_surcharge_usd: "Surcharge for a Saturday delivery; USD, 2 decimals, or not_applicable."
  free_reschedule_notice_hours: "Hours before the start of the scheduled window by which a reschedule is free; integer."
  reschedule_fee_usd: "Fee for a reschedule made inside the free notice period; USD, 2 decimals."
  reschedule_max: "Customer reschedules allowed per booking; integer."
  customer_wait_minutes: "Minutes the team waits at the address before recording a failed attempt; integer."
  redelivery_fee_usd: "Fee to rebook after a failed attempt caused by the customer; USD, 2 decimals."
  redelivery_attempts_max: "Delivery attempts allowed before the booking is cancelled; integer."
  storage_hold_days: "Calendar days goods are held after a failed attempt awaiting a rebooking; integer."
  late_arrival_credit_usd: "Service credit when the team arrives more than late_threshold_minutes after the window ends; USD, 2 decimals, or not_applicable."
  late_threshold_minutes: "Minutes after the window end beyond which an arrival is late; integer."
  missed_day_fee_refund: "Whether the delivery fee is refunded in full when Marlowe & Finch misses the scheduled date; boolean."
  inspection_at_delivery: "Whether the team inspects items with the customer before leaving; boolean."
  signature_required: "Whether a signature is collected on delivery; boolean."
  property_damage_report_hours: "Hours after delivery within which damage to the home must be reported; integer."
  property_damage_liability_cap_usd: "Maximum compensation for damage to the home; USD, 2 decimals, or not_applicable."
  claim_resolution_business_days: "Business days to resolve a delivery claim; integer."
  cancellation_full_refund_cutoff: "Last status in which a cancellation refunds all delivery charges; string rule key."
  loyalty_discount_applies: "Whether the customer's Finch Circle home_delivery_discount_pct applies to this service level's fees; boolean."
  free_delivery_threshold_usd: "Order merchandise subtotal at or above which this service level's base fee is waived; USD, 2 decimals, or not_applicable."
  upgrade_credit_on_free_threshold: "Whether an order that qualifies for free Threshold Delivery gets the Threshold base fee credited toward this higher service level; boolean."
  floor_protection: "Whether floor coverings are used inside the home; boolean."
  max_item_weight_lbs: "Heaviest single item the service level handles; integer pounds."
  two_person_team: "Whether a two-person team is sent; boolean."
  contactless_option: "Whether the customer can choose contactless drop-off; boolean."
  weather_reschedule_free: "Whether reschedules forced by severe weather are free and not counted; boolean."
  rescheduling_channels: "Channels through which a reschedule can be made; list."
  item_types_served: "Item types the service level delivers; list."
  fee_basis: "How the fee is charged; string rule key (per booking, one order to one address)."
  service_upgrade_allowed_until: "Last status in which the service level can be upgraded; string rule key."

