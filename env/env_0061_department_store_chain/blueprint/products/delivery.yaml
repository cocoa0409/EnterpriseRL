# ---- events (every write of this category) ----
events:
  - type: delivery_booking
    target: deliveries
    mutation: create
    meaning: "A home delivery is booked for the large items of one order to one address."
    grain: "One row per booking."
    fields:
      variant_name: "Service level, as the official service level name."
      status: "scheduled at creation."
      order_number: "Order number whose items are delivered."
      delivery_address: "Delivery address, verbatim."
      booked_date: "Date the booking was made."
      scheduled_date: "Delivery date."
      time_window: "Arrival window."
      items_count: "Items on the booking."
      stairs_flights: "Flights of stairs at the address."
      distance_miles: "Road miles from the delivery center."
      haul_away_items: "Items to haul away."
    triggers:
      - event: "delivery:delivery_charge"
        map: {charge_type: delivery_fee}
  - type: delivery_dispatch
    target: deliveries
    mutation: {transition: {from: scheduled, to: out_for_delivery}}
    meaning: "The truck leaves for the scheduled delivery."
    grain: "One transition per attempt."
    fields:
      status: "Set to out_for_delivery."
      attempt_count: "Attempts made including this one."
    triggers: []
  - type: delivery_complete
    target: deliveries
    mutation: {transition: {from: out_for_delivery, to: delivered}}
    meaning: "The delivery is completed."
    grain: "One transition per booking."
    fields:
      status: "Set to delivered."
      delivered_date: "Date of delivery."
      arrival_time: "Time the team arrived."
    triggers: []
  - type: delivery_failed
    target: deliveries
    mutation: {transition: {from: out_for_delivery, to: failed_attempt}}
    meaning: "An attempt fails."
    grain: "One transition per failed attempt."
    fields:
      status: "Set to failed_attempt."
      failure_cause: "customer_not_home, access_problem, mf_missed_date or item_damaged_on_truck."
    triggers: []
  - type: delivery_rebook
    target: deliveries
    mutation: {transition: {from: failed_attempt, to: scheduled}}
    meaning: "A new date is booked after a failed attempt."
    grain: "One transition per rebooking."
    fields:
      status: "Set to scheduled."
      scheduled_date: "New delivery date."
      time_window: "New arrival window."
    triggers: []
  - type: delivery_cancel
    target: deliveries
    mutation: {transition: [{from: scheduled, to: cancelled}, {from: failed_attempt, to: cancelled}]}
    meaning: "The booking is cancelled."
    grain: "One transition per booking."
    fields:
      status: "Set to cancelled."
      cancelled_date: "Date of cancellation."
      cancellation_cause: "customer_request, order_cancelled, attempts_exhausted or storage_hold_expired."
    triggers:
      - event: "delivery:delivery_credit"
        when: {cancellation_cause: [customer_request, order_cancelled]}
        map: {credit_reason: cancellation_refund}
  - type: delivery_reschedule
    target: deliveries
    mutation: update
    meaning: "The customer moves a scheduled delivery to another date or window."
    grain: "One update per reschedule."
    fields:
      scheduled_date: "New delivery date."
      time_window: "New arrival window."
      reschedule_count: "Customer reschedules so far, including this one."
    triggers: []
  - type: delivery_service_change
    target: deliveries
    mutation: update
    meaning: "The service level of a scheduled booking is changed."
    grain: "One update per change."
    fields:
      variant_name: "New service level."
    triggers: []
  - type: delivery_charge
    target: delivery_events
    meaning: "A delivery charge is billed: base fee, extra items, stairs, out-of-area, Saturday, haul-away, reschedule or redelivery."
    grain: "One row per charge type per day billed."
    distinguish_by: [charge_type, event_date]
    fields:
      event_date: "Date billed."
      amount: "Charge, positive USD."
      charge_type: "delivery_fee, extra_item_fee, stairs_fee, out_of_area_surcharge, weekend_surcharge, haul_away_fee, reschedule_fee or redelivery_fee."
    account: delivery_charges
    direction: in
    triggers: []
  - type: delivery_credit
    target: delivery_events
    meaning: "A delivery charge is reduced or refunded: Finch Circle discount, free-delivery threshold, late arrival credit, missed-date refund or cancellation refund."
    grain: "One row per credit reason per charge."
    distinguish_by: [credit_reason, original_delivery_event_id]
    fields:
      event_date: "Date credited."
      amount: "Credit, positive USD."
      credit_reason: "loyalty_discount, free_delivery_threshold, late_arrival, missed_date_refund or cancellation_refund."
      original_delivery_event_id: "The charge credited; empty for a late arrival credit."
    account: delivery_charges
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: delivery_msr_order_merchandise_subtotal
    window: "All purchase records sharing the booking's order_number."
    measure: "Sum of unit_price of the purchase records of the order_number that are not cancelled."

# ---- policies ----
policies:
  - id: delivery_agg_multi_holding
    subject: [delivery_booking]
    rule: >-
      A customer may have any number of bookings (max_per_customer null), but the large items of one order going to one
      address travel on one booking (fee_basis); items of separate orders, or one order split to two addresses at the
      customer's request, are separate bookings each paying its own fee.
    eligibility: []
    params:
      max_per_customer: null

  - id: delivery_agg_order_threshold
    subject: [delivery_booking, delivery_credit]
    rule: >-
      The free-delivery test reads the whole order: when delivery_msr_order_merchandise_subtotal reaches the Threshold
      Delivery free_delivery_threshold_usd, a Threshold Delivery booking for that order has its base fee credited in full
      (credit_reason free_delivery_threshold), and a booking at a higher service level whose upgrade_credit_on_free_threshold
      is true has the Threshold Delivery delivery_fee_usd credited against its base fee. Extra item, stairs, out-of-area,
      Saturday, haul-away, reschedule and redelivery charges are never covered by the threshold. Cancelling items so that the
      subtotal falls below the threshold before dispatch reverses the threshold credit.
    eligibility: []
    params: {}
    measures: [delivery_msr_order_merchandise_subtotal]

  - id: delivery_booking_rules
    subject: [delivery_booking, delivery_charge]
    rule: >-
      A service level can be booked only for item_types_served and items up to max_item_weight_lbs, at an address within
      max_service_miles. The earliest date is booking_lead_business_days business days after the booked_date; Saturday is
      offered only where weekend_available is true. Charges are billed at booking: delivery_fee_usd for up to included_items
      items, extra_item_fee_usd for each further item, extra_flight_fee_usd for each flight beyond stairs_flights_included
      (a level whose value is not_applicable does not carry items up stairs), out_of_area_surcharge_per_mile_usd for each mile
      beyond service_area_miles, weekend_surcharge_usd for a Saturday date, and haul_away_fee_usd when haul-away is requested
      and not included (up to haul_away_items_max items). Where loyalty_discount_applies is true, the customer's Finch Circle
      home_delivery_discount_pct (tier held on the booked_date) is credited on each charge billed at booking, rounded half up
      to the cent (credit_reason loyalty_discount), after the free-delivery threshold credit.
      The arrival window given is time_window_hours long.
    eligibility: []
    params:
      per_tier:
        "Curbside Delivery": {base_fee: "=delivery_fee_usd", extra_item: "=extra_item_fee_usd"}
        "Threshold Delivery": {base_fee: "=delivery_fee_usd", extra_item: "=extra_item_fee_usd"}
        "Room of Choice Delivery": {base_fee: "=delivery_fee_usd", extra_item: "=extra_item_fee_usd"}
        "White Glove Delivery": {base_fee: "=delivery_fee_usd", extra_item: "=extra_item_fee_usd"}
        "White Glove Delivery with Assembly": {base_fee: "=delivery_fee_usd", extra_item: "=extra_item_fee_usd"}
        "Premier White Glove with Haul-Away": {base_fee: "=delivery_fee_usd", extra_item: "=extra_item_fee_usd"}
    formula:
      extra_items_charge: "max(items_count - included_items, 0) * extra_item_fee_usd"

  - id: delivery_reschedule_rules
    subject: [delivery_reschedule, delivery_charge]
    rule: >-
      The customer can move a scheduled delivery through rescheduling_channels. The booking is in scheduled status. A
      reschedule made at least free_reschedule_notice_hours hours before the start of the scheduled window is free; a later
      one is billed reschedule_fee_usd (charge_type reschedule_fee). At most reschedule_max customer reschedules are made per
      booking; reschedules forced by severe weather or by Marlowe & Finch are free and not counted
      (weather_reschedule_free). The new date respects booking_lead_business_days from the reschedule date.
    eligibility:
      - id: reschedule_scheduled_only
        applies_to: [delivery_reschedule]
        kind: state
        condition: "The booking is in scheduled status."
        evidence_fields: [deliveries.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deliveries.status]
          action_bindings:
            deliveries.status: status
        state_contract:
          field: deliveries.status
          allowed: [scheduled]
    params: {}

  - id: delivery_failed_attempt_rules
    subject: [delivery_failed, delivery_rebook]
    rule: >-
      The team waits customer_wait_minutes at the address before recording customer_not_home. After a failed attempt the
      goods are held storage_hold_days calendar days for a rebooking. A rebooking after customer_not_home or access_problem
      is billed redelivery_fee_usd; after mf_missed_date or item_damaged_on_truck it is free and the missed date is handled
      under delivery_service_credits. After redelivery_attempts_max failed attempts, or when no rebooking is made within the
      storage hold, the booking is cancelled (attempts_exhausted or storage_hold_expired), delivery charges already billed are
      kept, and the merchandise is refunded under the order rules for a cancelled unit.
    eligibility: []
    params: {}

  - id: delivery_cancellation_rules
    subject: [delivery_cancel, delivery_credit]
    rule: >-
      A booking in scheduled status (cancellation_full_refund_cutoff) can be cancelled at the customer's request or because
      its order is cancelled, and every charge billed on it is credited in full (credit_reason cancellation_refund). Once
      the truck is dispatched the booking cannot be cancelled by the customer; a booking cancelled after failed attempts
      keeps its charges.
    eligibility: []
    params: {}

  - id: delivery_service_credits
    subject: [delivery_credit]
    rule: >-
      When the team arrives more than late_threshold_minutes after the end of the time_window, a late_arrival credit of the
      level's late_arrival_credit_usd is given once per booking (not_applicable means none). When Marlowe & Finch misses the
      scheduled date (failure_cause mf_missed_date), the base delivery fee is refunded in full (missed_day_fee_refund,
      credit_reason missed_date_refund) and the rebooking is free. No credit of the same reason has already been given for
      the same charge. Credits never exceed the charges billed on the booking.
    eligibility:
      - id: one_credit_per_reason
        applies_to: [delivery_credit]
        kind: dedup
        condition: "No credit of the same reason has already been given for the same charge."
        evidence_fields: [delivery_events.original_delivery_event_id, delivery_events.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_events.original_delivery_event_id]
          action_bindings:
            delivery_events.original_delivery_event_id: original_delivery_event_id
        dedup_contract:
          table: delivery_events
          mode: separate_record
          object_bindings: {original_delivery_event_id: original_delivery_event_id}
          duplicate_filters: {event_type: [delivery_credit]}
          distinct_fields: [credit_reason]
    params:
      per_tier:
        "Curbside Delivery": {late_credit: "=late_arrival_credit_usd"}
        "Threshold Delivery": {late_credit: "=late_arrival_credit_usd"}
        "Room of Choice Delivery": {late_credit: "=late_arrival_credit_usd"}
        "White Glove Delivery": {late_credit: "=late_arrival_credit_usd"}
        "White Glove Delivery with Assembly": {late_credit: "=late_arrival_credit_usd"}
        "Premier White Glove with Haul-Away": {late_credit: "=late_arrival_credit_usd"}

  - id: delivery_completion_rules
    subject: [delivery_dispatch, delivery_complete]
    rule: >-
      Dispatch and completion are recorded by the delivery team. The team calls call_ahead_minutes before arrival, places
      items at the level's placement, removes packaging where packaging_removal is true, assembles within
      assembly_max_minutes where assembly_included is true, hauls away where included or bought, uses floor protection where
      floor_protection is true, inspects items with the customer where inspection_at_delivery is true, and collects a
      signature where signature_required is true. Damage to the home is claimed as a delivery_claims record within
      property_damage_report_hours hours of delivery and compensated by the claims team up to
      property_damage_liability_cap_usd within claim_resolution_business_days; damaged or missing merchandise is handled
      under the order return rules for damage in transit.
      Haul-away is part of the service where haul_away_included is true; a two-person team is sent where two_person_team is true; contactless drop-off is offered only where contactless_option is true, and then no signature or inspection is taken.
    eligibility: []
    params: {}

  - id: delivery_service_change_rules
    subject: [delivery_service_change, delivery_charge, delivery_credit]
    rule: >-
      The service level can be changed while the booking is in scheduled status (service_upgrade_allowed_until), provided
      the new level serves the items. The base fee of the old level is credited and the new level's charges are billed under
      delivery_booking_rules, including any free-threshold and Finch Circle credit due at the new level.
    eligibility: []
    params: {}
