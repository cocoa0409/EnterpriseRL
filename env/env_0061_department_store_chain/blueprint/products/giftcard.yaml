# Policy charter: Marlowe & Finch Gift Cards and store-value cards (purchased gift cards, eGift
# cards, merchandise credit cards, registry reward cards, corporate cards and promotional bonus
# cards). The holding is one card number; its value lives in the card_balance account.

category: giftcard
display_name: Marlowe & Finch Gift Cards

binding:
  holding_table: gift_cards
  event_tables: [gift_card_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance: card_balance}

lifecycle:
  states: [inactive, active, frozen, expired, closed]
  transitions:
    - {from: inactive, to: active, by: system, means: "The card is activated: at the register when sold, on delivery of an eGift card, or on issue for a store-issued card."}
    - {from: active, to: frozen, by: agent, means: "The registered holder reports the card lost or stolen and the remaining balance is frozen."}
    - {from: frozen, to: active, by: agent, means: "The registered holder finds the card before a replacement is issued and asks to unfreeze it."}
    - {from: frozen, to: closed, by: system, means: "The frozen balance is moved to a replacement card and the old number is closed."}
    - {from: active, to: closed, by: system, means: "The balance is paid out in cash under a state cash-out rule or the card is consolidated into another card."}
    - {from: active, to: expired, by: system, means: "A promotional card reaches the end of its validity and its remaining value lapses."}

accounts:
  - key: card_balance
    unit: USD
    meaning: "Value available on the card; issues, reloads, refunds and transfers in raise it; redemptions, transfers out, cash-outs, expiry and bonus forfeiture lower it."

parameter_schema:
  card_form: "Physical plastic or digital; string enum (plastic, digital)."
  how_obtained: "How the card comes into existence; string rule key."
  purchasable: "Whether the card is sold for money; boolean."
  min_load_usd: "Smallest value a card can be issued or loaded with; USD, 2 decimals."
  max_load_usd: "Largest value of one card; USD, 2 decimals."
  max_balance_usd: "Largest balance the card may hold after reloads; USD, 2 decimals."
  purchase_fee_usd: "Fee charged to buy the card; USD, 2 decimals."
  reloadable: "Whether value can be added to the card later; boolean."
  expires: "Whether the card's value expires; boolean."
  validity_days: "Calendar days from activation (day 1) through which a card that expires can be used; integer, or not_applicable."
  valid_from_offset_days: "Calendar days after issue before a promotional card can first be redeemed; integer, or not_applicable."
  dormancy_fee_usd: "Monthly inactivity fee; USD, 2 decimals."
  min_purchase_to_redeem_usd: "Merchandise subtotal required in the transaction for the card to be redeemed; USD, 2 decimals."
  redemption_exclusions: "Purchases the card cannot pay for; list."
  online_redeemable: "Whether the card can be used on mfinch.com and in the app; boolean."
  cards_per_transaction_max: "Cards of this kind that can be used in one transaction; integer."
  registration_allowed: "Whether the holder can register the card to a profile for balance protection; boolean."
  lost_card_protection: "Whether a registered lost or stolen card's balance can be moved to a replacement; boolean."
  replacement_fee_usd: "Fee for a replacement card; USD, 2 decimals."
  replacement_business_days: "Business days for a replacement card to be issued; integer."
  balance_protection_basis: "Balance protected on a lost card; string rule key (balance at the time of the report)."
  cash_out_allowed: "Whether a small remaining balance is paid out in cash on request; boolean."
  cash_out_threshold_usd: "Balance below which a cash-out is made on request where state law requires it; USD, 2 decimals, or not_applicable."
  cash_out_states: "States whose law requires cash-out of small balances; list of two-letter codes, or not_applicable."
  consolidation_allowed: "Whether the balance can be moved onto another card of the holder; boolean."
  transferable: "Whether the card can be given to another person; boolean."
  balance_inquiry_channels: "Channels where the balance can be checked; list."
  refund_to_card_on_return: "Whether a return of a purchase paid with this card is refunded back onto a card of this kind; boolean."
  return_refund_card_kind: "Card kind a return refund of a purchase paid with this card is placed on; string."
  bonus_forfeit_on_qualifying_return: "Whether an unused bonus card is forfeited, or a used one deducted from the refund, when its qualifying purchase is returned; boolean."
  qualifying_purchase_min_usd: "Purchase amount that earned the promotional card; USD, 2 decimals, or not_applicable."
  bonus_value_usd: "Value of the promotional card per qualifying purchase step; USD, 2 decimals, or not_applicable."
  issued_in_name_of: "Whose name the card is issued in; string rule key."
  id_required_to_redeem: "Whether a photo ID is required to redeem; boolean."
  corporate_min_cards_per_order: "Minimum cards in one corporate order; integer, or not_applicable."
  corporate_volume_discount_pct: "Discount on corporate orders at or above the volume threshold; percent, or not_applicable."
  corporate_volume_threshold_usd: "Corporate order value at which the volume discount applies; USD, 2 decimals, or not_applicable."
  egift_delivery_channels: "How an eGift card is delivered; list, or not_applicable."
  egift_scheduled_delivery_max_days: "Calendar days ahead an eGift delivery can be scheduled; integer, or not_applicable."
  egift_resend_allowed: "Whether an undelivered eGift email can be resent to a corrected address; boolean."
  activation_hold_hours: "Hours after activation before the card can be redeemed online (fraud hold); integer."
  fraud_review_trigger_usd: "Single-transaction card purchase value that triggers a fraud review hold; USD, 2 decimals, or not_applicable."
  points_on_purchase: "Whether buying this card earns Finch Circle points; boolean."
  notes_payable: "Whether Finch Notes can pay for this card; boolean."
  escheat_reporting: "Whether unused balances are reported as unclaimed property; string rule key."
  merchandise_credit_id_record: "Whether the government ID recorded at a no-receipt return is linked to the credit card issued; boolean."
  combine_with_promotions: "Whether the card can be used together with percent-off promotions; boolean."
  card_number_format: "Format of the card number; string."

