# ---- events (every write of this category) ----
events:
  - type: giftcard_create
    target: gift_cards
    mutation: create
    meaning: "A card number is created: sold at a register or online, issued by the store for a refund, reward or settlement, or issued by a promotion."
    grain: "One row per card number."
    fields:
      variant_name: "Card kind, as the official card name."
      status: "inactive at creation."
      card_number: "Card number printed on the card or in the eGift email."
      issue_date: "Date the card was created."
      expiry_date: "Last day a card that expires can be redeemed; empty for cards that do not expire."
    triggers: []
  - type: giftcard_activate
    target: gift_cards
    mutation: {transition: {from: inactive, to: active}}
    meaning: "The card is activated and can be used after any activation hold."
    grain: "One transition per card."
    fields:
      status: "Set to active."
      activation_date: "Date of activation."
    triggers: []
  - type: giftcard_freeze
    target: gift_cards
    mutation: {transition: {from: active, to: frozen}}
    meaning: "The registered holder reports the card lost or stolen and its balance is frozen."
    grain: "One transition per report."
    fields:
      status: "Set to frozen."
      frozen_date: "Date of the report."
    triggers: []
  - type: giftcard_unfreeze
    target: gift_cards
    mutation: {transition: {from: frozen, to: active}}
    meaning: "The holder recovers the card before a replacement is issued and it is unfrozen."
    grain: "One transition per recovery."
    fields:
      status: "Set to active."
    triggers: []
  - type: giftcard_close
    target: gift_cards
    mutation: {transition: [{from: frozen, to: closed}, {from: active, to: closed}]}
    meaning: "The card number is closed after its balance moves to a replacement or another card, or is cashed out."
    grain: "One transition per card."
    fields:
      status: "Set to closed."
      closed_date: "Date of closure."
    triggers: []
  - type: giftcard_expire
    target: gift_cards
    mutation: {transition: {from: active, to: expired}}
    meaning: "A promotional or reward card reaches the end of its validity."
    grain: "One transition per card."
    fields:
      status: "Set to expired."
    triggers:
      - event: "giftcard:giftcard_expiry_writeoff"
        map: {}
  - type: giftcard_register
    target: gift_cards
    mutation: update
    meaning: "The holder registers the card to their profile for balance protection."
    grain: "One update per registration."
    fields:
      registered: "Set to true."
    triggers: []
  - type: giftcard_issue
    target: gift_card_ledger
    meaning: "The initial value is loaded on a new card: the purchase amount, a return refund, a registry payout or conversion, an alteration damage settlement, or a promotional bonus."
    grain: "One row per card issued."
    distinguish_by: [issue_reason, txn_date]
    fields:
      txn_date: "Date of the issue."
      amount: "Value loaded, positive USD."
      issue_reason: "purchase, corporate_order, return_refund, registry_rewards, registry_credit_conversion, alteration_damage_settlement or promotional_bonus."
      return_id: "Return record refunded onto the card, for return_refund; empty otherwise."
      registry_id: "Registry paid out or converted, for registry_rewards and registry_credit_conversion; empty otherwise."
      purchase_id: "Qualifying purchase record, for promotional_bonus; empty otherwise."
    account: card_balance
    direction: in
    triggers: []
  - type: giftcard_reload
    target: gift_card_ledger
    meaning: "The holder adds value to a reloadable card."
    grain: "One row per reload."
    distinguish_by: [txn_date, amount]
    fields:
      txn_date: "Date of the reload."
      amount: "Value added, positive USD."
    account: card_balance
    direction: in
    triggers: []
  - type: giftcard_redeem
    target: gift_card_ledger
    meaning: "Card value is applied to a Marlowe & Finch purchase."
    grain: "One row per card per purchase record paid."
    distinguish_by: [purchase_id]
    fields:
      txn_date: "Date of the purchase."
      amount: "Value applied, positive USD."
      purchase_id: "Purchase record paid."
    account: card_balance
    direction: out
    triggers: []
  - type: giftcard_transfer_out
    target: gift_card_ledger
    meaning: "The balance leaves the card for a replacement card or for consolidation onto another card."
    grain: "One row per transfer."
    distinguish_by: [counterpart_gift_card_id]
    fields:
      txn_date: "Date of the transfer."
      amount: "Value moved, positive USD."
      counterpart_gift_card_id: "Card receiving the balance."
    account: card_balance
    direction: out
    triggers:
      - event: "giftcard:giftcard_transfer_in"
        map: {amount: amount}
  - type: giftcard_transfer_in
    target: gift_card_ledger
    meaning: "A balance arrives from a lost or consolidated card."
    grain: "One row per transfer received."
    distinguish_by: [counterpart_gift_card_id]
    fields:
      txn_date: "Date of the transfer."
      amount: "Value received, positive USD."
      counterpart_gift_card_id: "Card the balance came from."
    account: card_balance
    direction: in
    triggers: []
  - type: giftcard_cash_out
    target: gift_card_ledger
    meaning: "A small remaining balance is paid out in cash where state law requires it."
    grain: "One row per cash-out."
    distinguish_by: [txn_date]
    fields:
      txn_date: "Date of the cash-out."
      amount: "Value paid out, positive USD."
    account: card_balance
    direction: out
    triggers:
      - event: "giftcard:giftcard_close"
        map: {}
  - type: giftcard_expiry_writeoff
    target: gift_card_ledger
    meaning: "The remaining value of an expired promotional or reward card lapses."
    grain: "One row per expired card."
    distinguish_by: [txn_date]
    fields:
      txn_date: "Date of the lapse."
      amount: "Value lapsed, positive USD."
    account: card_balance
    direction: out
    triggers: []
  - type: giftcard_bonus_forfeit
    target: gift_card_ledger
    meaning: "An unused bonus card's value is forfeited because its qualifying purchase was returned."
    grain: "One row per bonus card forfeited."
    distinguish_by: [return_id]
    fields:
      txn_date: "Date of the forfeiture."
      amount: "Value forfeited, positive USD."
      return_id: "Return record of the qualifying purchase."
    account: card_balance
    direction: out
    triggers: []

# ---- derived measures ----
measures: []

# ---- policies ----
policies:
  - id: giftcard_agg_multi_holding
    subject: [giftcard_create]
    rule: >-
      A customer may hold any number of cards (max_per_customer null). Each card number keeps its own balance, expiry and
      rules; a balance moves between cards only by a transfer under giftcard_consolidation or giftcard_lost_stolen.
    eligibility: []
    params:
      max_per_customer: null

  - id: giftcard_agg_combined_redemption
    subject: [giftcard_redeem]
    rule: >-
      Several cards can pay one transaction, up to each kind's cards_per_transaction_max. Finch Notes are applied before
      any card, and then cards are applied in this order: Marlowe & Finch Bonus Card, then cards with an expiry_date by
      the earliest expiry_date, then every other card by the lowest balance first. Each card pays at most its balance and
      only toward merchandise outside its redemption_exclusions. A card's redemption is recorded against each purchase record
      it pays, allocated in proportion to the records' amounts due and rounded half up to the cent with any remainder on
      the highest-priced record.
    eligibility: []
    params: {}

  - id: giftcard_issuance
    subject: [giftcard_create, giftcard_issue, giftcard_activate]
    rule: >-
      A purchasable card is sold for a value between min_load_usd and max_load_usd with purchase_fee_usd; it earns no Finch
      Circle points (points_on_purchase false) and cannot be paid with Finch Notes (notes_payable false). A card purchase
      at or above fraud_review_trigger_usd in one transaction is held for review before activation. Plastic cards activate
      at the register; eGift cards activate when delivered by an egift_delivery_channels channel, on a date up to
      egift_scheduled_delivery_max_days ahead; online redemption opens activation_hold_hours after activation. Store-issued
      cards (Merchandise Credit Card, Registry Reward Card) and Bonus Cards are created in the customer's name
      (issued_in_name_of), loaded once by a giftcard_issue for the exact amount the issuing rule settles, and activated on
      issue. A return refund placed on a card always uses a new Merchandise Credit Card (return_refund_card_kind). A
      corporate order needs at least corporate_min_cards_per_order cards and receives corporate_volume_discount_pct off at
      or above corporate_volume_threshold_usd. Each card gets an expiry_date only when expires is true: the issue date plus
      validity_days minus one day.
      Each kind comes in its card_form and comes into existence as stated in how_obtained, with a card number in card_number_format. A Merchandise Credit Card issued for a no-receipt return records the returning customer's identification where merchandise_credit_id_record is true. A return of a purchase paid with a card is refunded onto a new card only where refund_to_card_on_return is true. An eGift email that did not arrive can be resent to a corrected address where egift_resend_allowed is true. Balances can be checked through balance_inquiry_channels.
    eligibility: []
    params: {}

  - id: giftcard_redemption
    subject: [giftcard_redeem]
    rule: >-
      A card is redeemed for Marlowe & Finch merchandise in store, and online where online_redeemable is true. The card is
      in active status. For a card that expires, the purchase date is on or before the card's expiry_date. A Bonus Card is
      redeemable only from valid_from_offset_days after issue, only on a transaction with a merchandise subtotal of at least
      min_purchase_to_redeem_usd, never on redemption_exclusions, and never together with another percent-off promotion
      (combine_with_promotions false). No card pays for gift cards or Marlowe & Finch card payments. Unused value stays on
      the card; no change is given in cash except under giftcard_cash_out.
      No photo ID is asked for at redemption where id_required_to_redeem is false.
    eligibility:
      - id: card_active
        applies_to: [giftcard_redeem]
        kind: state
        condition: "The card is in active status."
        evidence_fields: [gift_cards.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_cards.status]
          action_bindings:
            gift_cards.status: status
        state_contract:
          field: gift_cards.status
          allowed: [active]
      - id: before_expiry
        applies_to: [giftcard_redeem]
        kind: time
        condition: "For a card that expires, the purchase date is on or before the card's expiry_date."
        evidence_fields: [gift_cards.expiry_date, gift_cards.gift_card_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_cards.gift_card_id]
          action_bindings:
            gift_cards.gift_card_id: gift_card_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the card's expiry_date"
          anchor_source: gift_cards.expiry_date
          relation: not_after
          duration_source: params.expiry_grace_days
          unit: calendar_days
          counting_rule: "For a card that expires, the purchase date is on or before the card's expiry_date."
          boundary: inclusive
    params:
      expiry_grace_days: 0
      per_tier:
        "Marlowe & Finch Gift Card": {min_purchase: "=min_purchase_to_redeem_usd", max_cards: "=cards_per_transaction_max"}
        "Marlowe & Finch eGift Card": {min_purchase: "=min_purchase_to_redeem_usd", max_cards: "=cards_per_transaction_max"}
        "Merchandise Credit Card": {min_purchase: "=min_purchase_to_redeem_usd", max_cards: "=cards_per_transaction_max"}
        "Registry Reward Card": {min_purchase: "=min_purchase_to_redeem_usd", max_cards: "=cards_per_transaction_max"}
        "Corporate Gift Card": {min_purchase: "=min_purchase_to_redeem_usd", max_cards: "=cards_per_transaction_max"}
        "Marlowe & Finch Bonus Card": {min_purchase: "=min_purchase_to_redeem_usd", max_cards: "=cards_per_transaction_max"}

  - id: giftcard_reload_rules
    subject: [giftcard_reload]
    rule: >-
      Only a card whose reloadable value is true can be reloaded, by at least min_load_usd each time, and never above
      max_balance_usd after the reload. A reload is paid like a card purchase and earns no points. The card is in active
      status.
    eligibility:
      - id: reload_active
        applies_to: [giftcard_reload]
        kind: state
        condition: "The card is in active status."
        evidence_fields: [gift_cards.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_cards.status]
          action_bindings:
            gift_cards.status: status
        state_contract:
          field: gift_cards.status
          allowed: [active]
    params: {}

  - id: giftcard_lost_stolen
    subject: [giftcard_freeze, giftcard_unfreeze, giftcard_close, giftcard_register]
    rule: >-
      Balance protection exists only for a card that was registered to the holder's profile before it was lost
      (registration_allowed and lost_card_protection true). The card is registered to the caller's profile. On the report the
      card is frozen and the balance at the time of the report (balance_protection_basis) is moved within
      replacement_business_days to a replacement card of the same kind for replacement_fee_usd, after which the old number
      closes; value spent before the report is not restored. An unregistered, corporate or bonus card is treated as cash
      and is not replaced. A frozen card found before the replacement is issued can be unfrozen at the holder's request.
    eligibility:
      - id: registered_card
        applies_to: [giftcard_freeze]
        kind: authorization
        condition: "The card is registered to the caller's profile."
        evidence_fields: [gift_cards.registered, gift_cards.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_cards.customer_id]
          action_bindings:
            gift_cards.customer_id: customer_id
    params: {}

  - id: giftcard_consolidation
    subject: [giftcard_transfer_out, giftcard_transfer_in]
    rule: >-
      A transfer always moves the whole balance of one card onto another card of the same customer, booked as a
      giftcard_transfer_out on the source and a giftcard_transfer_in of the same amount on the receiving card naming each
      other as counterpart. Consolidation onto a reloadable Marlowe & Finch Gift Card is allowed only where both kinds have
      consolidation_allowed true and the result stays within the receiving card's max_balance_usd; Registry Reward Cards and
      Bonus Cards are never consolidated. The receiving card keeps its own rules, so value from a card that would expire
      never gains an expiry by consolidation.
      A card can be given to someone else only where transferable is true; a Registry Reward Card and a Bonus Card stay with the customer named on them.
    eligibility: []
    params: {}

  - id: giftcard_cash_out_rules
    subject: [giftcard_cash_out]
    rule: >-
      Where the card kind's cash_out_allowed is true and the customer's billing address on file is in one of
      cash_out_states, a remaining balance below cash_out_threshold_usd is paid out in cash at a register on request, and the
      card closes. In other states, and for balances at or above the threshold, no cash is paid.
    eligibility: []
    params: {}

  - id: giftcard_expiry_rules
    subject: [giftcard_expire, giftcard_expiry_writeoff]
    rule: >-
      Purchased cards and Merchandise Credit Cards never expire and carry no dormancy fee (dormancy_fee_usd). A card whose
      expires value is true (Registry Reward Card, Bonus Card) expires the day after its expiry_date and its remaining
      value lapses in full with a giftcard_expiry_writeoff; an expired card is never reissued or extended.
      Balances of cards that do not expire are kept indefinitely (escheat_reporting).
    eligibility: []
    params: {}

  - id: giftcard_bonus_return
    subject: [giftcard_bonus_forfeit]
    rule: >-
      A Bonus Card was earned by a qualifying purchase of at least qualifying_purchase_min_usd. When that qualifying purchase
      is returned so that the kept merchandise falls below qualifying_purchase_min_usd, an unused Bonus Card is forfeited in
      full with a giftcard_bonus_forfeit naming the return_id, and a Bonus Card already used has the value used deducted from
      the refund of the return. No forfeiture has already been booked for the same return.
      The Bonus Card value issued per qualifying purchase step is bonus_value_usd, and the forfeiture rule applies only to a kind whose bonus_forfeit_on_qualifying_return is true.
    eligibility:
      - id: one_forfeit_per_return
        applies_to: [giftcard_bonus_forfeit]
        kind: dedup
        condition: "No forfeiture has already been booked for the same return."
        evidence_fields: [gift_card_ledger.return_id, gift_card_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gift_card_ledger.return_id]
          action_bindings:
            gift_card_ledger.return_id: return_id
        dedup_contract:
          table: gift_card_ledger
          mode: separate_record
          object_bindings: {return_id: return_id}
          duplicate_filters: {event_type: [giftcard_bonus_forfeit]}
          distinct_fields: []
    params: {}
