# ---- events (every write of this category) ----
events:
  - type: loyalty_enrollment
    target: loyalty_memberships
    mutation: create
    meaning: "A customer joins Finch Circle in store, online or in the app and receives a member number."
    grain: "One row per membership."
    fields:
      variant_name: "Finch Circle Member at enrollment, or the card-floor tier when the customer already holds a qualifying card status."
      status: "active at enrollment."
      enrolled_date: "Date the membership was created."
      member_number: "Finch Circle member number issued."
    triggers:
      - event: "loyalty:loyalty_points_earn"
        map: {earn_source: enrollment_bonus}
  - type: loyalty_tier_change
    target: loyalty_memberships
    mutation: update
    meaning: "The member's tier changes by a mid-year upgrade, the annual review, or a card status floor."
    grain: "One update per tier change."
    fields:
      variant_name: "The new tier, as the official tier name."
      tier_valid_through: "Last date the new tier is held without requalifying."
      last_tier_change_date: "Date the change took effect."
      last_tier_change_type: "upgrade, downgrade or card_floor."
    triggers:
      - event: "loyalty:loyalty_points_earn"
        when: {last_tier_change_type: upgrade}
        map: {earn_source: tier_bonus}
      - event: "loyalty:loyalty_alteration_credit_grant"
        when: {last_tier_change_type: [upgrade, card_floor], variant_name: ["Finch Circle Gold", "Finch Circle Platinum", "Finch Circle Diamond", "Finch Circle Icon"]}
        map: {grant_reason: tier_upgrade_top_up}
  - type: loyalty_suspension
    target: loyalty_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The membership is frozen for a program-abuse review."
    grain: "One transition per suspension."
    fields:
      status: "Set to suspended."
    triggers: []
  - type: loyalty_reinstatement
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A review clears the member and the membership is active again."
    grain: "One transition per reinstatement."
    fields:
      status: "Set to active."
    triggers: []
  - type: loyalty_cancellation
    target: loyalty_memberships
    mutation: {transition: {from: active, to: closed}}
    meaning: "The member's own cancellation of the membership takes effect."
    grain: "One transition per cancelled membership."
    fields:
      status: "Set to closed."
      closed_date: "Date the cancellation took effect."
    triggers:
      - event: "loyalty:loyalty_points_expiry"
        map: {expiry_reason: membership_closed}
      - event: "loyalty:loyalty_note_expire"
        map: {expire_reason: membership_closed}
      - event: "loyalty:loyalty_alteration_credit_expire"
        map: {}
  - type: loyalty_termination
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "A suspended membership is terminated after the review confirms program abuse."
    grain: "One transition per terminated membership."
    fields:
      status: "Set to closed."
      closed_date: "Date of termination."
    triggers:
      - event: "loyalty:loyalty_points_expiry"
        map: {expiry_reason: membership_closed}
      - event: "loyalty:loyalty_note_expire"
        map: {expire_reason: membership_closed}
      - event: "loyalty:loyalty_alteration_credit_expire"
        map: {}
  - type: loyalty_points_earn
    target: loyalty_points_ledger
    meaning: "Points post to the membership for a qualifying purchase, a card bonus, a bonus event, a tier upgrade or enrollment."
    grain: "One row per earn source per purchase (or per card transaction, or per bonus occasion)."
    distinguish_by: [earn_source, purchase_id, card_txn_id, entry_date]
    fields:
      entry_date: "Date the points posted."
      points: "Points posted, positive whole number."
      earn_source: "purchase_base, card_bonus, card_outside_spend, bonus_event, tier_bonus or enrollment_bonus."
      purchase_id: "Purchase record the points were earned on; empty for card_outside_spend, tier_bonus and enrollment_bonus."
      card_txn_id: "Card transaction the card bonus or outside-spend points were earned on; empty otherwise."
      qualifying_amount: "Net qualifying dollars the points were computed on, USD; 0.00 for fixed bonuses."
    account: points
    direction: in
    triggers: []
  - type: loyalty_points_adjustment
    target: loyalty_points_ledger
    meaning: "Points for a purchase that was not credited at the time (the member's identifier was not given at checkout) are credited after a missing-points request."
    grain: "One row per purchase credited after a request."
    distinguish_by: [purchase_id, earn_source]
    fields:
      entry_date: "Date the points posted."
      points: "Points credited, positive whole number."
      earn_source: "missing_points_credit."
      purchase_id: "Purchase record credited."
      qualifying_amount: "Net qualifying dollars of the purchase, USD."
    account: points
    direction: in
    triggers: []
  - type: loyalty_points_reversal
    target: loyalty_points_ledger
    meaning: "Points earned on merchandise that is returned are deducted."
    grain: "One row per return per original earn row."
    distinguish_by: [return_id, original_loyalty_entry_id]
    fields:
      entry_date: "Date the deduction posted."
      points: "Points deducted, positive whole number."
      return_id: "Return record that caused the deduction."
      purchase_id: "Purchase record the returned merchandise came from."
      original_loyalty_entry_id: "The earn or adjustment row whose points are being taken back."
      qualifying_amount: "Refunded qualifying dollars of the returned merchandise attributable to that earn row, USD."
    account: points
    direction: out
    triggers: []
  - type: loyalty_points_conversion
    target: loyalty_points_ledger
    meaning: "A block of points is converted into one Finch Note."
    grain: "One row per note created from points."
    distinguish_by: [note_code]
    fields:
      entry_date: "Date of the conversion."
      points: "Points converted, positive whole number equal to points_per_note."
      note_code: "Code of the Finch Note created."
    account: points
    direction: out
    triggers:
      - event: "loyalty:loyalty_note_issue"
        map: {note_code: note_code, issue_reason: points_conversion}
  - type: loyalty_points_expiry
    target: loyalty_points_ledger
    meaning: "The points balance is forfeited for inactivity or because the membership closed."
    grain: "One row per forfeiture of the balance."
    distinguish_by: [entry_date, expiry_reason]
    fields:
      entry_date: "Date of the forfeiture."
      points: "Points forfeited, positive whole number."
      expiry_reason: "inactivity or membership_closed."
    account: points
    direction: out
    triggers: []
  - type: loyalty_note_issue
    target: loyalty_note_ledger
    meaning: "A Finch Note is issued to the member from points, as a birthday reward, as a reinstatement after a return, or as a courtesy reissue of an expired note."
    grain: "One row per note issued."
    distinguish_by: [note_code]
    fields:
      note_code: "Unique code of the note issued."
      note_amount: "Value of the note, USD."
      issue_reason: "points_conversion, birthday, return_reinstatement or courtesy_reissue."
      issue_date: "Date the note was issued."
      expiry_date: "Last day the note can be redeemed."
      original_note_code: "For a reinstatement or courtesy reissue, the code of the note it replaces; empty otherwise."
      return_id: "For a reinstatement, the return record that triggered it; empty otherwise."
    account: finch_notes
    direction: in
    triggers: []
  - type: loyalty_note_redeem
    target: loyalty_note_ledger
    meaning: "A Finch Note is applied to a purchase."
    grain: "One row per note redeemed."
    distinguish_by: [note_code]
    fields:
      note_code: "Code of the note redeemed."
      note_amount: "Full value of the note consumed, USD."
      txn_date: "Date of the purchase the note was applied to."
      purchase_id: "Purchase record the note was applied to."
    account: finch_notes
    direction: out
    triggers: []
  - type: loyalty_note_expire
    target: loyalty_note_ledger
    meaning: "An unredeemed Finch Note lapses at the end of its expiry date or because the membership closed."
    grain: "One row per note lapsed."
    distinguish_by: [note_code]
    fields:
      note_code: "Code of the note that lapsed."
      note_amount: "Value lapsed, USD."
      txn_date: "Date the note lapsed."
      expire_reason: "validity_ended or membership_closed."
    account: finch_notes
    direction: out
    triggers: []
  - type: loyalty_alteration_credit_grant
    target: loyalty_benefit_ledger
    meaning: "Complimentary alteration credit is granted for the calendar year, or topped up after an upgrade during the year."
    grain: "One row per grant occasion per benefit year."
    distinguish_by: [benefit_year, grant_reason, txn_date]
    fields:
      benefit_year: "Calendar year the credit belongs to."
      amount: "Credit granted, USD."
      txn_date: "Date of the grant."
      grant_reason: "annual_grant or tier_upgrade_top_up."
    account: alteration_credit
    direction: in
    triggers: []
  - type: loyalty_alteration_credit_use
    target: loyalty_benefit_ledger
    meaning: "Alteration credit is applied to the charge of an alteration ticket."
    grain: "One row per alteration ticket paid with credit."
    distinguish_by: [ticket_id]
    fields:
      amount: "Credit applied, USD."
      txn_date: "Date the credit was applied."
      ticket_id: "Alteration ticket the credit paid for."
      benefit_year: "Calendar year of the credit used."
    account: alteration_credit
    direction: out
    triggers: []
  - type: loyalty_alteration_credit_restore
    target: loyalty_benefit_ledger
    meaning: "Alteration credit applied to a ticket is restored because the ticket was cancelled before work began or the charge was refunded."
    grain: "One row per ticket whose credit is restored."
    distinguish_by: [ticket_id]
    fields:
      amount: "Credit restored, USD."
      txn_date: "Date of the restoration."
      ticket_id: "Alteration ticket whose credit is restored."
      benefit_year: "Calendar year the restored credit belongs to."
    account: alteration_credit
    direction: in
    triggers: []
  - type: loyalty_alteration_credit_expire
    target: loyalty_benefit_ledger
    meaning: "Unused alteration credit lapses at the end of its calendar year or when the membership closes."
    grain: "One row per benefit year lapsed."
    distinguish_by: [benefit_year]
    fields:
      amount: "Credit lapsed, USD."
      txn_date: "Date of the lapse."
      benefit_year: "Calendar year of the credit that lapsed."
    account: alteration_credit
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: loyalty_msr_calendar_year_qualifying_spend
    window: "One calendar year, 1 January through 31 December, by entry_date (year to date when evaluated mid-year)."
    measure: "Sum of qualifying_amount of loyalty_points_earn rows with earn_source purchase_base and of loyalty_points_adjustment rows, minus the sum of qualifying_amount of loyalty_points_reversal rows, on the membership in the window."
  - id: loyalty_msr_courtesy_reissues_rolling_12m
    window: "Rolling 12 calendar months ending on the handling date, by issue_date."
    measure: "Count of loyalty_note_issue rows with issue_reason courtesy_reissue on the membership in the window."
  - id: loyalty_msr_last_activity_date
    window: "All history of the membership."
    measure: "Latest of the entry_date of any loyalty_points_earn or loyalty_points_adjustment row and the txn_date of any loyalty_note_redeem row; the enrolled_date when there is none."
  - id: loyalty_msr_return_ratio_12m
    window: "Trailing 12 calendar months ending on the review date, by entry_date."
    measure: "Sum of qualifying_amount of loyalty_points_reversal rows divided by the sum of qualifying_amount of loyalty_points_earn rows with earn_source purchase_base, as a percent, together with the count of distinct return_id values on the reversal rows."

# ---- policies ----
policies:
  - id: loyalty_agg_multi_holding
    subject: [loyalty_enrollment]
    rule: >-
      A customer holds at most max_per_customer Finch Circle membership. The customer has no other membership in active or
      suspended status. A closed membership is never reopened: a customer whose membership was cancelled may enroll again
      and starts a new membership as Finch Circle Member (or at a card-floor tier) with zero points, no notes and no
      enrollment bonus, while a customer whose membership was closed by loyalty_termination may not enroll again. Points,
      notes and alteration credit never move between memberships or between members, and household members each hold
      their own membership.
    eligibility:
      - id: one_membership
        applies_to: [loyalty_enrollment]
        kind: dedup
        condition: "The customer has no other membership in active or suspended status."
        evidence_fields: [loyalty_memberships.customer_id, loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.customer_id]
          action_bindings:
            loyalty_memberships.customer_id: customer_id
        dedup_contract:
          table: loyalty_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: loyalty_enrollment_rules
    subject: [loyalty_enrollment, loyalty_points_earn]
    rule: >-
      Finch Circle membership is free. The applicant is at least min_member_age years old on the enrollment date, and the
      customer profile carries every identifier in enrollment_identifiers_required. A membership starts as Finch Circle
      Member, or at the card-floor tier of loyalty_tier_qualification when the customer holds a qualifying card status on
      the enrollment date. The tier's enrollment_bonus_points (Finch Circle Member value) post once, on the enrollment date,
      as a loyalty_points_earn with earn_source enrollment_bonus; a customer who has held any earlier membership receives no
      enrollment bonus. Purchases made before the enrolled_date earn no points, not even through a missing-points request.
    eligibility:
      - id: profile_identifiers_present
        applies_to: [loyalty_enrollment]
        kind: caller_fact
        condition: "The applicant is at least min_member_age years old on the enrollment date, and the customer profile carries every identifier in enrollment_identifiers_required."
        evidence_fields: [customers.date_of_birth, customers.phone_number, customers.email, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params: {}

  - id: loyalty_tier_qualification
    subject: [loyalty_tier_change]
    rule: >-
      Tiers are earned on loyalty_msr_calendar_year_qualifying_spend: net merchandise dollars after discounts and Finch Notes
      and before tax, with any tender, excluding points_excluded_items, less returns. Mid-year upgrade: when the year-to-date
      measure reaches the qualifying_spend_threshold_usd of a higher tier, the membership moves to the highest tier reached
      within midyear_upgrade_business_days business days (last_tier_change_type upgrade), and tier_valid_through becomes 31
      December of the following calendar year. Annual review on 1 January: a member whose tier_valid_through has passed is
      set to the highest tier whose threshold the previous year's measure meets, but never more than
      max_tier_drop_per_review tiers below the tier held (last_tier_change_type downgrade when lower); a member whose
      tier_valid_through has not passed keeps the tier. Card status floor (combination with Marlowe & Finch Credit Cards):
      while the customer holds a card account in active status at Marlowe & Finch Store Card Elite or Marlowe & Finch
      Platinum Mastercard the membership is at least Finch Circle Gold, and at Marlowe & Finch World Elite Mastercard at least
      Finch Circle Platinum (last_tier_change_type card_floor); when that card account leaves active status the floor stops
      and the next annual review applies the spend rule alone. A floor never lowers a higher earned tier. The membership is
      in active status. A suspended membership changes tier only after reinstatement, at the next upgrade test or review.
      A card floor can only grant a tier whose card_status_floor_eligible is true.
    eligibility:
      - id: tier_change_active_only
        applies_to: [loyalty_tier_change]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      card_floor_map:
        "Marlowe & Finch Store Card Elite": "Finch Circle Gold"
        "Marlowe & Finch Platinum Mastercard": "Finch Circle Gold"
        "Marlowe & Finch World Elite Mastercard": "Finch Circle Platinum"
      per_tier:
        "Finch Circle Member": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Silver": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Gold": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Platinum": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Diamond": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Icon": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
    measures: [loyalty_msr_calendar_year_qualifying_spend]

  - id: loyalty_tier_benefits
    subject: [loyalty_tier_change]
    rule: >-
      A member's service benefits are read from the tier held on the date of the occurrence they apply to (the return date for
      return windows and return shipping, the price-adjustment request date, the delivery booking date, the alteration
      ticket date, the registry completion purchase date): free_return_shipping, extended_return_days, price_adjustment_extension_days, restocking_fee_waived,
      home_delivery_discount_pct, alteration_rush_fee_waived and registry_completion_bonus_pct. A suspended or closed
      membership gives no benefit, and a customer who is not a member is treated as having none. Benefits attach to the
      member's own transactions only and are not lent to a guest, a registry giver or another household member. A tier
      upgrade (last_tier_change_type upgrade) also posts the new tier's tier_upgrade_bonus_points once as a
      loyalty_points_earn with earn_source tier_bonus; a downgrade or card floor posts no bonus.
    eligibility: []
    params: {}

  - id: loyalty_evt_points_earn
    subject: [loyalty_points_earn]
    rule: >-
      The membership is in active status. Points post within points_posting_business_days business days of the purchase
      date (in store) or ship date (online). For each purchase record in the member's name: purchase_base points equal the
      member's base_points_per_dollar on the purchase date times the purchase's net qualifying amount, and on a bonus event
      day the member was invited to, a separate bonus_event row adds (bonus_event_multiplier minus 1) times those base
      points. When the purchase was charged to a Marlowe & Finch card, a card_bonus row adds the card's
      mf_bonus_points_per_dollar times the amount charged for it. Mastercard purchases outside Marlowe & Finch earn
      card_outside_spend points at the card's grocery_gas_points_per_dollar for supermarket and gas_station merchants and its
      outside_points_per_dollar for other merchants. Every row is rounded down to whole points (points_rounding). Gift cards,
      sales tax, delivery, alteration and shipping fees (points_excluded_items) earn nothing. A purchase made while the
      membership was suspended earns nothing and is never credited later.
      A member is invited to the tier's bonus_event_days_per_year bonus event days in a calendar year.
    eligibility:
      - id: earn_active_only
        applies_to: [loyalty_points_earn]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      per_tier:
        "Finch Circle Member": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Silver": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Gold": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Platinum": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Diamond": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Icon": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}

  - id: loyalty_evt_points_reversal
    subject: [loyalty_points_reversal]
    rule: >-
      When a return of merchandise from a purchase is refunded, every purchase_base, bonus_event, card_bonus and
      missing_points_credit row of that purchase is reduced in proportion to the refunded qualifying amount: the points
      deducted for one earn row are that row's points times the refunded qualifying amount divided by the row's
      qualifying_amount, rounded half up to whole points, booked as one loyalty_points_reversal per earn row naming the
      return_id and the original_loyalty_entry_id. The deduction applies even when the balance goes negative
      (negative_points_balance_allowed); Finch Notes already issued are never taken back, and a negative balance is simply
      offset by later earning. No reversal has already been booked for the same return and earn row. Tier upgrade and
      enrollment bonuses are never reversed.
      Deductions are made because points_return_clawback is true.
    eligibility:
      - id: one_reversal_per_return_row
        applies_to: [loyalty_points_reversal]
        kind: dedup
        condition: "No reversal has already been booked for the same return and earn row."
        evidence_fields: [loyalty_points_ledger.return_id, loyalty_points_ledger.original_loyalty_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_points_ledger.return_id, loyalty_points_ledger.original_loyalty_entry_id]
          action_bindings:
            loyalty_points_ledger.return_id: return_id
            loyalty_points_ledger.original_loyalty_entry_id: original_loyalty_entry_id
        dedup_contract:
          table: loyalty_points_ledger
          mode: separate_record
          object_bindings: {return_id: return_id, original_loyalty_entry_id: original_loyalty_entry_id}
          duplicate_filters: {event_type: [loyalty_points_reversal]}
          distinct_fields: []
    params: {}

  - id: loyalty_note_conversion
    subject: [loyalty_points_conversion, loyalty_note_issue]
    rule: >-
      Whenever the points balance is at or above points_per_note, one block of points_per_note points is converted into one
      Finch Note of note_value_usd (issue_reason points_conversion), repeated block by block until the balance is below
      points_per_note; conversion happens within note_issue_business_days business days and cannot be requested early or
      postponed. Each note gets its own note_code. Its expiry_date is the issue_date plus note_validity_days of the tier held
      on the issue date minus one day (the issue date is day 1). Notes are issued only while the membership is active; a
      suspended membership accrues points without conversion until it is reinstated. Notes are digital, are held in the
      member's account and cannot be transferred.
    eligibility: []
    params:
      per_tier:
        "Finch Circle Member": {validity_days: "=note_validity_days"}
        "Finch Circle Silver": {validity_days: "=note_validity_days"}
        "Finch Circle Gold": {validity_days: "=note_validity_days"}
        "Finch Circle Platinum": {validity_days: "=note_validity_days"}
        "Finch Circle Diamond": {validity_days: "=note_validity_days"}
        "Finch Circle Icon": {validity_days: "=note_validity_days"}

  - id: loyalty_evt_note_redemption
    subject: [loyalty_note_redeem]
    rule: >-
      A Finch Note is applied to a Marlowe & Finch purchase in store, online or in the app. The purchase txn_date is on or
      before the note's expiry_date. The note has not already been redeemed or lapsed. The membership is in active status.
      A note is consumed whole (note_single_use): when it is larger than the eligible amount the rest is forfeited, it never
      gives change and has no cash value (note_cash_value). At most the tier's notes_per_transaction_max notes are applied to
      one purchase transaction, and notes never apply to note_redemption_exclusions (gift cards, alteration, delivery and
      shipping fees, sales tax). The amount paid with notes is not qualifying spend and earns no points.
    eligibility:
      - id: note_unexpired
        applies_to: [loyalty_note_redeem]
        kind: time
        condition: "The purchase txn_date is on or before the note's expiry_date."
        evidence_fields: [loyalty_note_ledger.expiry_date, loyalty_note_ledger.note_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.note_code]
          action_bindings:
            loyalty_note_ledger.note_code: note_code
        temporal_basis:
          clock: frozen_time
          anchor_event: "the note's expiry_date"
          anchor_source: loyalty_note_ledger.expiry_date
          relation: not_after
          duration_source: params.redemption_grace_days
          unit: calendar_days
          counting_rule: "The purchase txn_date is on or before the note's expiry_date."
          boundary: inclusive
      - id: note_not_used
        applies_to: [loyalty_note_redeem]
        kind: dedup
        condition: "The note has not already been redeemed or lapsed."
        evidence_fields: [loyalty_note_ledger.note_code, loyalty_note_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.note_code]
          action_bindings:
            loyalty_note_ledger.note_code: note_code
        dedup_contract:
          table: loyalty_note_ledger
          mode: separate_record
          object_bindings: {note_code: note_code}
          duplicate_filters: {event_type: [loyalty_note_redeem, loyalty_note_expire]}
          distinct_fields: []
      - id: redeem_active_only
        applies_to: [loyalty_note_redeem]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      redemption_grace_days: 0
      per_tier:
        "Finch Circle Member": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Silver": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Gold": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Platinum": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Diamond": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Icon": {max_notes: "=notes_per_transaction_max"}

  - id: loyalty_note_reinstatement
    subject: [loyalty_note_issue]
    rule: >-
      The value of Finch Notes applied to a purchase is never refunded to a card, cash or gift card. When merchandise from
      a purchase paid in part with notes is returned and refunded, a new note (issue_reason return_reinstatement) is issued
      for the note value attributable to the returned merchandise: the whole note value applied to the purchase when every
      item is returned, otherwise that value times the returned merchandise's share of the purchase's merchandise subtotal
      before notes, rounded half up to the cent. The new note names the return_id and the original_note_code. Its
      expiry_date is the later of the original note's expiry_date and the reinstatement date plus the tier's
      reinstated_note_min_validity_days minus one day (the reinstatement date is day 1). No reinstatement note has already
      been issued for the same return and original note. A reinstated note that later expires follows the ordinary expiry
      rules.
    eligibility:
      - id: one_reinstatement_per_return
        applies_to: [loyalty_note_issue]
        kind: dedup
        condition: "No reinstatement note has already been issued for the same return and original note."
        evidence_fields: [loyalty_note_ledger.return_id, loyalty_note_ledger.original_note_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.return_id, loyalty_note_ledger.original_note_code]
          action_bindings:
            loyalty_note_ledger.return_id: return_id
            loyalty_note_ledger.original_note_code: original_note_code
        dedup_contract:
          table: loyalty_note_ledger
          mode: separate_record
          object_bindings: {return_id: return_id, original_note_code: original_note_code}
          duplicate_filters: {issue_reason: [return_reinstatement]}
          distinct_fields: []
    params:
      per_tier:
        "Finch Circle Member": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Silver": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Gold": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Platinum": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Diamond": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Icon": {min_validity_days: "=reinstated_note_min_validity_days"}

  - id: loyalty_expired_note_courtesy
    subject: [loyalty_note_issue]
    rule: >-
      A Finch Note that lapsed with expire_reason validity_ended may be reissued once as a courtesy (issue_reason
      courtesy_reissue) at the member's request, recorded as a loyalty_requests record with request_type
      expired_note_reissue. The request is made within the reissue window after the note's expiry_date. The window counts
      calendar days starting the day after the expiry_date as day 1, and a request on the last day of
      expired_note_reissue_window_days is in time. The loyalty_msr_courtesy_reissues_rolling_12m count is below the tier's
      expired_note_courtesy_reissues_per_12_months, read for the tier held on the request date. The reissued note has the
      original note_amount, names the original_note_code, and its expiry_date is the reissue date plus
      courtesy_note_validity_days minus one day. A note that lapsed because the membership closed, a note already reissued
      once, and a birthday note are never reissued.
    eligibility:
      - id: within_reissue_window
        applies_to: [loyalty_note_issue]
        kind: time
        condition: "The request is made within the reissue window after the note's expiry_date."
        evidence_fields: [loyalty_note_ledger.expiry_date, loyalty_note_ledger.note_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.note_code]
          action_bindings:
            loyalty_note_ledger.note_code: original_note_code
        temporal_basis:
          clock: frozen_time
          anchor_event: "the note's expiry_date"
          anchor_source: loyalty_note_ledger.expiry_date
          relation: not_after
          duration_source: variants.expired_note_reissue_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the expiry_date as day 1, and a request on the last day of expired_note_reissue_window_days is in time."
          boundary: inclusive
    params:
      per_tier:
        "Finch Circle Member": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Silver": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Gold": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Platinum": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Diamond": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Icon": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
    formula:
      courtesy_allowed: "loyalty_msr_courtesy_reissues_rolling_12m < expired_note_courtesy_reissues_per_12_months"
    measures: [loyalty_msr_courtesy_reissues_rolling_12m]

  - id: loyalty_evt_note_expiry
    subject: [loyalty_note_expire]
    rule: >-
      A Finch Note not redeemed by the end of its expiry_date lapses on the following day with expire_reason
      validity_ended, for its full note_amount. When the membership closes, every unredeemed note lapses on the closed_date
      with expire_reason membership_closed. A note lapses only once; a lapsed note can come back only as a new note under
      loyalty_expired_note_courtesy.
    eligibility: []
    params: {}

  - id: loyalty_points_expiry_rules
    subject: [loyalty_points_expiry]
    rule: >-
      When loyalty_msr_last_activity_date is points_inactivity_expiry_months full calendar months or more before the
      handling date (read for the tier held on that date), a positive points balance is forfeited in full with expiry_reason
      inactivity; a zero or negative balance is left as it is. Earning points or redeeming a note is activity; a points
      reversal, a note issue or a tier change is not. When the membership closes, a positive balance is forfeited on the
      closed_date with expiry_reason membership_closed. Forfeited points are never restored.
    eligibility: []
    params: {}
    measures: [loyalty_msr_last_activity_date]

  - id: loyalty_missing_points
    subject: [loyalty_points_adjustment]
    rule: >-
      A member whose Finch Circle number was not captured at checkout may ask for the points of that purchase through a
      loyalty_requests record with request_type missing_points naming the purchase_id. The purchase record is in the
      member's name (its customer_id is the member's) and its purchase date is on or after the enrolled_date. The request is
      made no later than the claim window after the purchase date. The window counts calendar days starting the day after
      the purchase date as day 1, and a request on the last day of missing_points_claim_window_days for the tier held on
      the request date is in time. The request is made no earlier than the waiting period after the purchase date, which
      ends on the purchase date plus missing_points_wait_days calendar days. The purchase has no purchase_base earn row and
      no earlier missing_points_credit row. The credit is one loyalty_points_adjustment row equal to the purchase_base and
      bonus_event points that purchase would have earned at the tier and rates in effect on the purchase date, on the
      qualifying amount still kept after any refunded return. A purchase fully returned before the request earns nothing.
      The purchase is identified by its purchase record (missing_points_proof); a receipt photo or a statement line alone is not enough.
    eligibility:
      - id: claim_window
        applies_to: [loyalty_points_adjustment]
        kind: time
        condition: "The request is made no later than the claim window after the purchase date."
        evidence_fields: [purchases.purchase_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase date"
          anchor_source: purchases.purchase_date
          relation: not_after
          duration_source: variants.missing_points_claim_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the purchase date as day 1, and a request on the last day of missing_points_claim_window_days for the tier held on the request date is in time."
          boundary: inclusive
      - id: waiting_period
        applies_to: [loyalty_points_adjustment]
        kind: time
        condition: "The request is made no earlier than the waiting period after the purchase date, which ends on the purchase date plus missing_points_wait_days calendar days."
        evidence_fields: [purchases.purchase_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase date"
          anchor_source: purchases.purchase_date
          relation: not_before
          duration_source: variants.missing_points_wait_days
          unit: calendar_days
          counting_rule: "The request is made no earlier than the waiting period after the purchase date, which ends on the purchase date plus missing_points_wait_days calendar days."
          boundary: inclusive
      - id: not_already_credited
        applies_to: [loyalty_points_adjustment]
        kind: dedup
        condition: "The purchase has no purchase_base earn row and no earlier missing_points_credit row."
        evidence_fields: [loyalty_points_ledger.purchase_id, loyalty_points_ledger.earn_source]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_points_ledger.purchase_id]
          action_bindings:
            loyalty_points_ledger.purchase_id: purchase_id
        dedup_contract:
          table: loyalty_points_ledger
          mode: separate_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {earn_source: [purchase_base, missing_points_credit]}
          distinct_fields: []
    params:
      per_tier:
        "Finch Circle Member": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Silver": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Gold": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Platinum": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Diamond": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Icon": {claim_window_days: "=missing_points_claim_window_days"}

  - id: loyalty_alteration_credit_rules
    subject: [loyalty_alteration_credit_grant, loyalty_alteration_credit_use, loyalty_alteration_credit_restore, loyalty_alteration_credit_expire]
    rule: >-
      On 1 January each membership in active status receives the alteration_credit_annual_usd of the tier held that day
      for the new benefit_year (grant_reason annual_grant); a tier with 0.00 receives no grant. After an upgrade or card
      floor during the year, a top-up (grant_reason tier_upgrade_top_up) equal to the new tier's annual amount minus the
      amounts already granted for that benefit_year posts on the change date; nothing is taken back after a downgrade.
      Alteration credit pays only for alterations to items purchased at Marlowe & Finch (alteration_credit_eligible_items:
      the alteration ticket names a purchase record) and is applied to the ticket's alteration charges up to the lower of
      the charge and the credit balance; it never pays a rush fee, a delivery fee or a non-Marlowe & Finch item. The
      membership is in active status. When a ticket paid with credit is cancelled before work began or its charge is
      refunded, the credit used is restored to the benefit_year it came from, unless that year has already ended, in which
      case nothing is restored. Unused credit lapses on 31 December (alteration_credit_carryover false) or on the
      closed_date when the membership closes.
    eligibility:
      - id: credit_use_active_only
        applies_to: [loyalty_alteration_credit_use]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      per_tier:
        "Finch Circle Member": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Silver": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Gold": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Platinum": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Diamond": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Icon": {annual_credit_usd: "=alteration_credit_annual_usd"}

  - id: loyalty_birthday_reward
    subject: [loyalty_note_issue]
    rule: >-
      On the first day of the member's birth month (the month of customers.date_of_birth) a birthday Finch Note
      (issue_reason birthday) of the tier's birthday_note_usd is issued, valid for birthday_note_validity_days counting the
      issue date as day 1, for the tier held on that day. The membership has existed for at least birthday_min_membership_days
      calendar days before the first day of the birth month. A tier whose birthday_note_usd is not_applicable receives no
      birthday note; one birthday note is issued per calendar year; a missed birthday note (membership suspended on that day)
      is not issued later; the member's date of birth cannot be changed to move the birthday note.
    eligibility:
      - id: membership_age_for_birthday
        applies_to: [loyalty_note_issue]
        kind: time
        condition: "The membership has existed for at least birthday_min_membership_days calendar days before the first day of the birth month."
        evidence_fields: [loyalty_memberships.enrolled_date, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "The membership has existed"
          anchor_source: loyalty_memberships.enrolled_date
          relation: not_before
          duration_source: variants.birthday_min_membership_days
          unit: calendar_days
          counting_rule: "The membership has existed for at least birthday_min_membership_days calendar days before the first day of the birth month."
          boundary: inclusive
    params:
      per_tier:
        "Finch Circle Member": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Silver": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Gold": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Platinum": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Diamond": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Icon": {birthday_note: "=birthday_note_usd"}

  - id: loyalty_program_integrity
    subject: [loyalty_suspension, loyalty_reinstatement, loyalty_termination]
    rule: >-
      A membership is suspended for review when, over the trailing 12 months, the count of distinct returns in
      loyalty_msr_return_ratio_12m is at least suspension_min_returns and the returned share of purchases exceeds
      suspension_return_ratio_pct. While suspended no points post, no notes convert or redeem, no alteration credit is used
      and no tier benefit applies; points, notes and credit already held are kept. The Finch Circle program team decides
      the review: reinstatement returns the membership to active, and termination closes it with every points, note and
      credit balance forfeited. Customer care cannot suspend, reinstate or terminate a membership, and cannot shorten a
      review.
    eligibility: []
    params: {}
    measures: [loyalty_msr_return_ratio_12m]

  - id: loyalty_cancellation_rules
    subject: [loyalty_cancellation]
    rule: >-
      Only the member can cancel a Finch Circle membership; customer care records the request as a loyalty_requests record
      with request_type membership_cancellation and the cancellation takes effect when the member confirms it. The member's
      cancellation request is recorded as submitted. On the closed_date the positive points balance, every unredeemed note
      and the remaining alteration credit are forfeited. Cancelling the membership does not close a Marlowe & Finch card
      account, and closing a card account does not cancel the membership. A suspended membership cannot be cancelled by the
      member while the review is open.
    eligibility:
      - id: cancellation_request_on_file
        applies_to: [loyalty_cancellation]
        kind: state
        condition: "The member's cancellation request is recorded as submitted."
        evidence_fields: [loyalty_requests.request_status, loyalty_requests.request_type, loyalty_requests.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_requests.membership_id]
          action_bindings:
            loyalty_requests.membership_id: membership_id
        state_contract:
          field: loyalty_requests.request_status
          allowed: [submitted]
    params: {}
