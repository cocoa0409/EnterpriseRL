    gift_receipt_refund_destination: merchandise_credit_card
    refund_tender_priority: [mf_card, bank_card, debit, cash, gift_card]
    cash_refund_check_threshold_usd: 500.00
    sales_tax_refund_basis: proportional_to_refunded_merchandise
    gift_with_purchase_rule: false
    gift_with_purchase_value_usd: not_applicable
    personalized_items_returnable: false
    exchange_window_days: 30
    order_cancellation_cutoff: before_shipment
    store_pickup_hold_days: not_applicable
    mattress_comfort_exchange_nights: 120
    mattress_comfort_min_nights: 30
    mattress_comfort_exchanges_max: 1
    mattress_comfort_exchange_fee_usd: 0.00
    points_and_spend_on_return: true
    registry_gift_return_destination: registrant_credit
    warranty_referral_after_window: true
    id_required_no_receipt: true
    discount_allocation_basis: pro_rata_by_unit_price_before_discount

# ---- events (every write of this category) ----
events:
  - type: order_purchase
    target: purchases
    mutation: create
    meaning: "A customer buys an item in store, online, in the app or by phone; one purchase record is created per unit."
    grain: "One row per unit of one item in one order or register transaction."
    fields:
      variant_name: "Merchandise class of the item, as the official class name."
      status: "ordered at creation."
      order_number: "Order or register receipt number shared by the purchase records of the transaction."
      purchase_date: "Date of the order or register transaction."
      channel: "in_store, online, app or phone_order."
      fulfillment: "carry_out, ship_to_home, store_pickup or home_delivery."
      item_description: "Item name as printed on the receipt."
      sku: "Item number."
      regular_price: "Ticketed regular price of the unit, USD."
      unit_price: "Selling price of the unit after promotions and coupons allocated to it, before Finch Notes and tax, USD."
      price_type: "regular, sale, clearance, doorbuster or final_sale."
      tax_amount: "Sales tax charged on the unit, USD."
      finch_notes_applied: "Finch Note value allocated to the unit, USD."
      tender_type: "mf_card, bank_card, debit, cash, gift_card or mixed."
      card_account_id: "Marlowe & Finch card account charged, when the tender includes a Marlowe & Finch card."
      registry_id: "Gift registry the unit was bought from, when bought as a registry gift."
      gift_receipt: "Whether a gift receipt was issued for the unit."
      membership_linked: "Whether a Finch Circle number was captured on the transaction."
    triggers:
      - event: "order:order_payment"
        map: {tender_type: tender_type}
      - event: "registry:registry_gift_purchase"
        when: {registry_id: {not: ""}}
        map: {purchase_id: purchase_id, sku: sku}
  - type: order_shipment
    target: purchases
    mutation: {transition: {from: ordered, to: shipped}}
    meaning: "The order line ships from a fulfilment center or store."
    grain: "One transition per shipped unit."
    fields:
      status: "Set to shipped."
      ship_date: "Date the unit shipped."
    triggers: []
  - type: order_completion
    target: purchases
    mutation: {transition: [{from: shipped, to: completed}, {from: ordered, to: completed}]}
    meaning: "The unit reaches the customer: delivered, collected at a store, or carried out at the register."
    grain: "One transition per unit completed."
    fields:
      status: "Set to completed."
      completed_date: "Delivery date, pickup date or carry-out date; the anchor of the return window."
    triggers: []
  - type: order_cancellation
    target: purchases
    mutation: {transition: {from: ordered, to: cancelled}}
    meaning: "An order line that has not shipped is cancelled at the customer's request, or a store pickup order is not collected in time."
    grain: "One transition per unit cancelled."
    fields:
      status: "Set to cancelled."
      cancelled_date: "Date of the cancellation."
      cancellation_reason: "customer_request or pickup_not_collected."
    triggers:
      - event: "order:order_refund"
        when: {cancellation_reason: customer_request}
        map: {refund_trigger: cancellation}
      - event: "order:order_refund"
        when: {cancellation_reason: pickup_not_collected}
        map: {refund_trigger: pickup_not_collected}
  - type: order_return_start
    target: purchases
    mutation: {transition: {from: completed, to: return_pending}}
    meaning: "The customer starts a return of a completed unit by an authorized return method."
    grain: "One transition per unit put into return."
    fields:
      status: "Set to return_pending."
    triggers: []
  - type: order_return_receipt
    target: purchases
    mutation: {transition: {from: return_pending, to: returned}}
    meaning: "The returned unit is received and accepted."
    grain: "One transition per unit received back."
    fields:
      status: "Set to returned."
      returned_date: "Date the unit was received and accepted."
    triggers:
      - event: "order:order_refund"
        map: {refund_trigger: return}
  - type: order_return_lapse
    target: purchases
    mutation: {transition: {from: return_pending, to: completed}}
    meaning: "A started return lapses unused or the unit is rejected on inspection and sent back."
    grain: "One transition per lapsed or rejected return."
    fields:
      status: "Set back to completed."
    triggers: []
  - type: order_payment
    target: order_events
    meaning: "Payment for the unit is captured at purchase."
    grain: "One row per tender captured for one unit."
    distinguish_by: [event_date, tender_type]
    fields:
      event_date: "Date the payment was captured."
      amount: "Amount captured for the unit (unit price plus tax, less Finch Notes), positive USD."
      tender_type: "Tender captured."
    account: net_paid
    direction: in
    triggers: []
  - type: order_price_adjustment
    target: order_events
    meaning: "The difference between the price paid and a lower Marlowe & Finch price is refunded for a unit."
    grain: "One row per price adjustment granted on one unit."
    distinguish_by: [event_date, new_unit_price]
    fields:
      event_date: "Date the adjustment was granted."
      amount: "Amount refunded, positive USD: the per-unit price difference plus the sales tax on it."
      new_unit_price: "The lower Marlowe & Finch selling price the adjustment is based on, USD."
      adjustment_reason: "mf_price_drop or register_price_error."
      refund_tender_type: "Tender the adjustment was refunded to."
    account: net_paid
    direction: out
    triggers:
      - event: "card:card_merchandise_credit"
        when: {refund_tender_type: mf_card}
        map: {purchase_id: purchase_id, order_event_id: order_event_id, amount: amount}
  - type: order_refund
    target: order_events
    meaning: "Money is refunded for a unit after a return is received, an order line is cancelled, or a pickup order is not collected."
    grain: "One row per refund of one unit per refund trigger."
    distinguish_by: [return_id, refund_trigger]
    fields:
      event_date: "Date the refund was issued."
      amount: "Amount refunded, positive USD, after any restocking, label or pickup fee and gift-with-purchase deduction."
      return_id: "Return record refunded; empty for a cancellation or uncollected pickup."
      refund_trigger: "return, cancellation or pickup_not_collected."
      refund_destination: "original_tender, merchandise_credit_card, registrant_credit or check."
      refund_tender_type: "Tender refunded when the destination is original_tender; not_applicable otherwise."
      restocking_fee_amount: "Restocking fee deducted, USD."
      return_fee_amount: "Prepaid label or carrier pickup fee deducted, USD."
      gwp_deduction_amount: "Kept gift-with-purchase value deducted, USD."
      tax_refunded: "Sales tax included in the refund, USD."
    account: net_paid
    direction: out
    triggers:
      - event: "card:card_merchandise_credit"
        when: {refund_destination: original_tender, refund_tender_type: mf_card}
        map: {purchase_id: purchase_id, return_id: return_id, order_event_id: order_event_id, amount: amount}
      - event: "loyalty:loyalty_points_reversal"
        when: {refund_trigger: return}
        map: {return_id: return_id, purchase_id: purchase_id}
      - event: "giftcard:giftcard_issue"
        when: {refund_destination: merchandise_credit_card}
        map: {return_id: return_id, amount: amount}
      - event: "registry:registry_return_credit"
        when: {refund_destination: registrant_credit}
        map: {return_id: return_id, purchase_id: purchase_id, amount: amount}
  - type: order_comfort_exchange
    target: order_events
    meaning: "A mattress is exchanged once for comfort; the replacement is a new purchase record and the original is returned without restocking fee."
    grain: "One row per comfort exchange of one mattress unit."
    distinguish_by: [replacement_purchase_id]
    fields:
      event_date: "Date the exchange was booked."
      replacement_purchase_id: "Purchase record of the replacement mattress."
      return_id: "Return record of the original mattress."
    triggers: []

# ---- derived measures ----
measures:
  - id: order_msr_no_receipt_returns_12m
    window: "Rolling 12 calendar months ending on the return date, by the date part of return_requests.created_at."
    measure: "Count of return_requests records of the customer with receipt_type no_receipt and return_status received or refunded."
  - id: order_msr_price_adjustments_on_unit
    window: "All history of the purchase record."
    measure: "Count of order_price_adjustment rows of the purchase record with adjustment_reason mf_price_drop."
  - id: order_msr_effective_unit_price
    window: "All history of the purchase record."
    measure: "The new_unit_price of the latest order_price_adjustment row of the purchase record, or its unit_price when it has none."

# ---- policies ----
policies:
  - id: order_agg_multi_holding
    subject: [order_purchase]
    rule: >-
      A customer may hold any number of purchase records (max_per_customer null): every unit bought is its own record, and
      the units of one order or register transaction share its order_number. Each record keeps its own merchandise class,
      return window, price adjustments and refund; a return, cancellation or adjustment always names the single purchase
      record it concerns and never applies to an order_number as a whole.
    eligibility: []
    params:
      max_per_customer: null

  - id: order_agg_order_allocation
    subject: [order_purchase, order_payment, order_refund]
    rule: >-
      Order-level amounts are spread over the purchase records of the order_number: a coupon or order-level promotion is
      allocated by discount_allocation_basis (in proportion to each unit's price before the discount, rounded half up to
      the cent with any rounding remainder on the highest-priced unit) and is already reflected in each unit_price; Finch
      Notes applied to the order are allocated the same way into finch_notes_applied. A mixed-tender transaction is
      recorded with tender_type mixed on its purchase records and one order_payment row per tender per unit, allocated the
      same way. A refund of one unit returns only that unit's allocated amounts; when a coupon required a minimum purchase
      that the kept units no longer meet, the coupon is not taken back.
    eligibility: []
    params: {}

  - id: order_agg_no_receipt_returns
    subject: [order_return_start, order_refund]
    rule: >-
      Across all of a customer's returns, at most no_receipt_returns_per_12_months returns without receipt are accepted in
      a rolling 12 months (order_msr_no_receipt_returns_12m). A purchase made with a Marlowe & Finch card or with the
      Finch Circle number linked within the last purchase_lookup_months months is found from those records and is an
      order_record return, not a no-receipt return. A no-receipt return is possible only for a class whose
      no_receipt_return_allowed is true, requires the customer's government photo ID to be recorded (id_required_no_receipt),
      and is refunded as a merchandise credit card at the lowest selling price of that item in the
      no_receipt_price_lookback_days before the return date (no_receipt_refund_basis), never to a card or in cash.
    eligibility: []
    params: {}
    measures: [order_msr_no_receipt_returns_12m]

  - id: order_payment_capture
    subject: [order_payment, order_purchase]
    rule: >-
      Payment for a carry-out or store pickup purchase is captured on the purchase_date; payment for a shipped or home
      delivery unit is authorized at order and captured on the ship_date (home delivery: the scheduled delivery date). The
      amount captured for a unit is its unit_price plus tax_amount minus finch_notes_applied. A unit charged to a Marlowe &
      Finch card names the card_account_id; the card charge itself posts on the card account per order_number. Finch Notes
      are not a tender and are never refunded as money.
    eligibility: []
    params: {}
    formula:
      amount: "unit_price + tax_amount - finch_notes_applied"

  - id: order_return_eligibility
    subject: [order_return_start]
    rule: >-
      A completed unit can be put into return when its return date (the date the return is authorized) is on or before its
      return deadline. The return is started no later than the return deadline counted from the completed_date of the unit. The ordinary deadline is the
      completed_date plus the class's return_window_days plus the extended_return_days of the customer's Finch Circle tier
      held on the return date, counted in calendar days with the completed_date as day 0, and a return authorized on the
      deadline is in time. For a class whose holiday_extension_applies is true, a unit whose purchase_date falls from
      holiday_purchase_window_start through holiday_purchase_window_end has as its deadline the later of the ordinary deadline
      and holiday_return_deadline of the following calendar year. After the deadline a unit can still be returned only when
      it is defective, until the completed_date plus defective_return_window_days, or damaged in transit and reported within
      damage_report_window_days of the completed_date; after those, a class whose warranty_referral_after_window is true is
      referred to the manufacturer warranty and no return is started. Final sale units (final_sale_returnable false) and
      monogrammed or engraved units (personalized_items_returnable false) are returned only as defective. The unit must meet
      the class's return_condition_required; a used or damaged unit returned as changed_mind or wrong_size_or_fit is rejected
      on inspection. The return method must be one of the class's return_methods_allowed. Starting a return is the
      customer's own act: the customer authorizes it, a return_requests record is created with return_status authorized, and
      the unit moves to return_pending. The same unit has no other return that is authorized, received or refunded.
      The return window starts at the return_window_anchor (completed_date). An even exchange of the unit for the same item in another size or color is made within exchange_window_days of the completed_date on the same terms, without refund and new purchase.
    eligibility:
      - id: within_return_deadline
        applies_to: [order_return_start]
        kind: time
        condition: "The return is started no later than the return deadline counted from the completed_date of the unit."
        evidence_fields: [purchases.completed_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the completed_date of the unit"
          anchor_source: purchases.completed_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: "The ordinary deadline is the completed_date plus the class's return_window_days plus the extended_return_days of the customer's Finch Circle tier held on the return date, counted in calendar days with the completed_date as day 0, and a return authorized on the deadline is in time."
          boundary: inclusive
      - id: one_open_return_per_unit
        applies_to: [order_return_start]
        kind: dedup
        condition: "The same unit has no other return that is authorized, received or refunded."
        evidence_fields: [return_requests.purchase_id, return_requests.return_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_requests.purchase_id]
          action_bindings:
            return_requests.purchase_id: purchase_id
        dedup_contract:
          table: return_requests
          mode: separate_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {return_status: [authorized, received, refunded]}
          distinct_fields: []
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Beauty & Fragrance": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Home & Kitchen": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Electronics & Small Appliances": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Fine Jewelry & Watches": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Designer Handbags & Luxury": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Furniture & Mattresses": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}

  - id: order_evt_refund
    subject: [order_refund]
    rule: >-
      A received return is refunded within the class's return_refund_business_days. The refund of a returned unit is its
      net_paid_amount (which already reflects price adjustments, and excludes Finch Notes, which come back only as a
      reinstated note under the Finch Circle rules) minus the restocking fee, the return fee and the gift-with-purchase
      deduction, and includes the unit's remaining sales tax as tax_refunded. The restocking fee is the class's
      restocking_fee_pct of the refunded merchandise (net_paid_amount minus tax_refunded), rounded half up to the cent,
      charged on all returns when restocking_fee_applies_to is all_items and on returns with item_condition opened_unused
      when it is opened_items. The return fee is the class's prepaid_label_fee_usd for mail_prepaid_label and its
      carrier_pickup_fee_usd for carrier_pickup; in_store and mail_own_postage returns have none. No restocking fee and no
      return fee is charged when the return_reason is one of fee_waiver_reasons. A Finch Circle member whose tier held on the
      return date has restocking_fee_waived true pays no restocking fee, and one whose tier has free_return_shipping true
      pays no prepaid label fee (the carrier pickup fee still applies). For a class whose gift_with_purchase_rule is true,
      gift_with_purchase_value_usd is deducted when a gift received with the unit is not returned with it. The home
      delivery fee of the unit is not refunded unless the return_reason is a fee-waiver reason. Destination: with an
      original receipt or order record the refund goes to the original tender (refund_tender_priority for mixed tender; a
      cash refund above cash_refund_check_threshold_usd is mailed as a check); a gift_receipt return goes to a merchandise
      credit card; a no-receipt return follows order_agg_no_receipt_returns; a registry gift returned by the registrant
      follows order_gift_and_registry_returns. A cancellation or uncollected pickup refund is the full net_paid_amount to
      the original tender with no fee. No refund has already been issued for the same return. Price adjustments, points
      and qualifying spend follow their own rules.
      Sales tax is refunded per sales_tax_refund_basis. The home delivery fee is refunded only where delivery_fee_refundable_on_return is true or the return_reason is a fee-waiver reason. Finch Circle points and qualifying spend are reduced for the return where points_and_spend_on_return is true.
    eligibility:
      - id: one_refund_per_return
        applies_to: [order_refund]
        kind: dedup
        condition: "No refund has already been issued for the same return."
        evidence_fields: [order_events.return_id, order_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_events.return_id]
          action_bindings:
            order_events.return_id: return_id
        dedup_contract:
          table: order_events
          mode: separate_record
          object_bindings: {return_id: return_id}
          duplicate_filters: {event_type: [order_refund]}
          distinct_fields: [refund_trigger]
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Beauty & Fragrance": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Home & Kitchen": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Electronics & Small Appliances": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Fine Jewelry & Watches": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Designer Handbags & Luxury": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Furniture & Mattresses": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
    formula:
      restocking_fee_amount: "round((net_paid_amount - tax_refunded) * restocking_fee_pct / 100, 2)"
      amount: "net_paid_amount - restocking_fee_amount - return_fee_amount - gwp_deduction_amount"

  - id: order_price_adjustment_rules
    subject: [order_price_adjustment]
    rule: >-
      When Marlowe & Finch (any store, mfinch.com or the app) sells the identical item (same sku) at a lower price within the
      price-adjustment window, the customer may ask for the difference. The request date is no later than the price
      adjustment window after the purchase_date. The window is the class's price_adjustment_window_days plus the
      price_adjustment_extension_days of the customer's Finch Circle tier held on the request date, counted in calendar days
      with the purchase_date as day 0, and a request on the last day is in time. The class must have price_adjustment_eligible
      true. Lower prices in price_adjustment_exclusions never qualify (clearance markdowns, doorbusters, coupons or promo
      codes, competitor prices, final sale, bonus card offers), and a unit bought as clearance or final_sale is never
      adjusted. The unit is in ordered, shipped or completed status. The order_msr_price_adjustments_on_unit count is below
      the class's price_adjustments_per_item_max, and the per-unit difference between order_msr_effective_unit_price and the
      new_unit_price is at least price_adjustment_min_difference_usd. The adjustment refunds that difference plus the sales
      tax charged on it (the unit's tax_amount times the difference divided by unit_price, rounded half up to the cent) to
      the original tender (price_adjustment_refund_tender), never as a gift card. A register_price_error adjustment (the unit
      was charged above its ticketed or advertised price on the purchase date) is made at any time while the unit is not
      returned, refunds the overcharge, and counts toward no limit. A price adjustment does not change Finch Circle points
      or qualifying spend.
    eligibility:
      - id: within_adjustment_window
        applies_to: [order_price_adjustment]
        kind: time
        condition: "The request date is no later than the price adjustment window after the purchase_date."
        evidence_fields: [purchases.purchase_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase_date"
          anchor_source: purchases.purchase_date
          relation: not_after
          duration_source: variants.price_adjustment_window_days
          unit: calendar_days
          counting_rule: "The window is the class's price_adjustment_window_days plus the price_adjustment_extension_days of the customer's Finch Circle tier held on the request date, counted in calendar days with the purchase_date as day 0, and a request on the last day is in time."
          boundary: inclusive
      - id: unit_not_returned
        applies_to: [order_price_adjustment]
        kind: state
        condition: "The unit is in ordered, shipped or completed status."
        evidence_fields: [purchases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.status]
          action_bindings:
            purchases.status: status
        state_contract:
          field: purchases.status
          allowed: [ordered, shipped, completed]
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Beauty & Fragrance": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Home & Kitchen": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Electronics & Small Appliances": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Fine Jewelry & Watches": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Designer Handbags & Luxury": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Furniture & Mattresses": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
    formula:
      amount: "round((order_msr_effective_unit_price - new_unit_price) * (1 + tax_amount / unit_price), 2)"
    measures: [order_msr_price_adjustments_on_unit, order_msr_effective_unit_price]

  - id: order_cancellation_rules
    subject: [order_cancellation]
    rule: >-
      A unit can be cancelled only while it is in ordered status (order_cancellation_cutoff before shipment); once it has
      shipped or been completed, the customer returns it instead. Cancellation at the customer's request
      (cancellation_reason customer_request) is made by customer care on the customer's word and needs no proof. A store
      pickup unit not collected within the class's store_pickup_hold_days after it is ready is cancelled with
      cancellation_reason pickup_not_collected. Either way the full net_paid_amount is refunded to the original tender with
      no fee, a card charge that has not yet been captured is simply released, and Finch Notes allocated to the unit are
      reinstated under the Finch Circle rules. Cancelling one unit never cancels the other units of its order_number unless
      the customer asks for each.
    eligibility: []
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {hold_days: "=store_pickup_hold_days"}
        "Beauty & Fragrance": {hold_days: "=store_pickup_hold_days"}
        "Home & Kitchen": {hold_days: "=store_pickup_hold_days"}
        "Electronics & Small Appliances": {hold_days: "=store_pickup_hold_days"}
        "Fine Jewelry & Watches": {hold_days: "=store_pickup_hold_days"}
        "Designer Handbags & Luxury": {hold_days: "=store_pickup_hold_days"}
        "Furniture & Mattresses": {hold_days: "=store_pickup_hold_days"}

  - id: order_mattress_comfort_exchange
    subject: [order_comfort_exchange]
    rule: >-
      A mattress bought as a Furniture & Mattresses unit can be exchanged once (mattress_comfort_exchanges_max) for a
      different mattress for comfort. The exchange is booked no earlier than mattress_comfort_min_nights nights after the
      completed_date (delivery date) and no later than mattress_comfort_exchange_nights nights after it, counting the night
      of the delivery date as night 1. The exchange is booked within the comfort window after the completed_date. The original
      mattress is collected and returned with return_reason changed_mind but without restocking fee or carrier pickup fee,
      and with a comfort exchange fee of mattress_comfort_exchange_fee_usd; the replacement is a new purchase record at its
      current selling price, and the difference between the replacement price and the refunded net_paid_amount is charged or
      refunded to the original tender. The delivery fee of the replacement is charged under the home delivery rules. The
      mattress has not been comfort-exchanged before; a replacement mattress received through a comfort exchange can only be
      returned under the ordinary return rules counted from its own completed_date and is never comfort-exchanged. Bed
      frames, headboards, adjustable bases and furniture have no comfort exchange.
    eligibility:
      - id: comfort_window
        applies_to: [order_comfort_exchange]
        kind: time
        condition: "The exchange is booked within the comfort window after the completed_date."
        evidence_fields: [purchases.completed_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the completed_date"
          anchor_source: purchases.completed_date
          relation: not_after
          duration_source: variants.mattress_comfort_exchange_nights
          unit: calendar_days
          counting_rule: "The exchange is booked no earlier than mattress_comfort_min_nights nights after the completed_date (delivery date) and no later than mattress_comfort_exchange_nights nights after it, counting the night of the delivery date as night 1."
          boundary: inclusive
      - id: not_exchanged_before
        applies_to: [order_comfort_exchange]
        kind: dedup
        condition: "The mattress has not been comfort-exchanged before; a replacement mattress received through a comfort exchange can only be returned under the ordinary return rules counted from its own completed_date and is never comfort-exchanged."
        evidence_fields: [order_events.purchase_id, order_events.event_type, order_events.replacement_purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_events.purchase_id]
          action_bindings:
            order_events.purchase_id: purchase_id
        dedup_contract:
          table: order_events
          mode: separate_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {event_type: [order_comfort_exchange]}
          distinct_fields: []
    params: {}

  - id: order_gift_and_registry_returns
    subject: [order_refund, order_return_start]
    rule: >-
      A gift is returned by the person holding it, never refunded to the giver's tender. A unit returned with a gift receipt
      (receipt_type gift_receipt) is refunded to a new merchandise credit card in the returning customer's name
      (gift_receipt_refund_destination), at the net amount the giver paid for the unit, within the class's ordinary return
      window counted from the completed_date of the giver's purchase. A unit bought from a gift registry (registry_id not
      empty) and returned by that registry's registrant is refunded as registrant credit on the registry
      (registry_gift_return_destination); the window and the rules for registry gifts are those of the gift registry
      charter, which take precedence over the ordinary return window for such units. A giver who returns a gift they still
      hold (the purchase is in their own name and they present the receipt or order record) is refunded to their original
      tender under order_evt_refund.
    eligibility: []
    params: {}

  - id: order_fulfilment_lifecycle
    subject: [order_shipment, order_completion, order_return_receipt, order_return_lapse]
    rule: >-
      Shipment, delivery, pickup, receipt of returns and lapse of returns are recorded by Marlowe & Finch systems from
      carrier scans, register transactions and returns-center inspection; customer care never records them. The
      completed_date is the carrier delivery date for ship_to_home, the date of collection for store_pickup, the completed
      delivery date for home_delivery, and the purchase_date for carry_out. A return_pending unit becomes returned when it is
      received at a store or the returns center in the condition the class requires; it goes back to completed when the
      class's return_label_validity_days pass after the return was authorized without the label being used or the pickup
      completed (return_status expired), or when inspection rejects it (return_status rejected) and it is shipped back to the
      customer. A rejected or expired return can be started again only while the unit is still within its return deadline.
    eligibility: []
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {label_validity_days: "=return_label_validity_days"}
        "Beauty & Fragrance": {label_validity_days: "=return_label_validity_days"}
        "Home & Kitchen": {label_validity_days: "=return_label_validity_days"}
        "Electronics & Small Appliances": {label_validity_days: "=return_label_validity_days"}
        "Fine Jewelry & Watches": {label_validity_days: "=return_label_validity_days"}
        "Designer Handbags & Luxury": {label_validity_days: "=return_label_validity_days"}
        "Furniture & Mattresses": {label_validity_days: "=return_label_validity_days"}
