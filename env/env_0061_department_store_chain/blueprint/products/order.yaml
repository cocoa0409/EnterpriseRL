# Policy charter: Merchandise Purchases (store, online and app purchases, returns, cancellations and
# price adjustments). The holding is one purchase record: one unit of one item bought in one order
# or register transaction; units of an order share its order_number. The merchandise class of the
# item is the tier and fixes its return, price-adjustment and restocking terms.

category: order
display_name: Merchandise Purchases

binding:
  holding_table: purchases
  event_tables: [order_events]
  intake_tables: [return_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {net_paid_amount: net_paid}

lifecycle:
  states: [ordered, shipped, completed, cancelled, return_pending, returned]
  transitions:
    - {from: ordered, to: shipped, by: system, means: "An online, app or phone order line leaves the fulfilment center or store."}
    - {from: shipped, to: completed, by: system, means: "The shipped item is delivered (carrier delivery scan or completed home delivery)."}
    - {from: ordered, to: completed, by: system, means: "A carry-out purchase is completed at the register, or a store pickup order is collected."}
    - {from: ordered, to: cancelled, by: agent, means: "An order line not yet shipped is cancelled at the customer's request, or a store pickup order is not collected within the hold period."}
    - {from: completed, to: return_pending, by: user, means: "The customer starts a return of the item (return authorization, mail label or pickup booked)."}
    - {from: return_pending, to: returned, by: system, means: "The returned item is received and accepted at a store or the returns center."}
    - {from: return_pending, to: completed, by: system, means: "The return lapses (the label or pickup window passes unused) or the item is rejected on inspection and sent back to the customer."}

accounts:
  - key: net_paid
    unit: USD
    meaning: "The amount the customer has paid for the purchase record and not had refunded: payment captured at purchase, less price adjustments and refunds. It caps every later refund and adjustment of that purchase."

parameter_schema:
  return_window_days: "Calendar days after the completed_date (delivery, pickup or carry-out date) within which an item of this class can be returned for a refund; integer."
  return_window_anchor: "The purchase field that starts the return window; string rule key (completed_date)."
  holiday_extension_applies: "Whether purchases made in the holiday purchase window get the holiday return deadline when it is later than the ordinary deadline; boolean."
  holiday_purchase_window_start: "First month-day of the holiday purchase window; MM-DD."
  holiday_purchase_window_end: "Last month-day of the holiday purchase window; MM-DD."
  holiday_return_deadline: "Month-day of the following year by which holiday purchases can be returned; MM-DD."
  return_condition_required: "Condition the item must be in to be accepted; string rule key."
  no_receipt_return_allowed: "Whether an item of this class can be returned without a receipt or order record; boolean."
  no_receipt_refund_basis: "Price refunded on a no-receipt return; string rule key (lowest selling price in the lookback)."
  no_receipt_price_lookback_days: "Calendar days before the return date searched for the lowest selling price on a no-receipt return; integer."
  no_receipt_returns_per_12_months: "Maximum no-receipt returns a customer can make in a rolling 12 months; integer."
  purchase_lookup_months: "Months back a purchase can be found by the Marlowe & Finch card or Finch Circle number and then treated as an order record; integer."
  restocking_fee_pct: "Restocking fee deducted from the refund, percent of the net paid amount of the returned item; percent."
  restocking_fee_applies_to: "Which returns of this class draw the restocking fee - none, opened_items or all_items; string enum."
  fee_waiver_reasons: "Return reasons for which restocking and return label fees are never charged; list."
  return_methods_allowed: "Return methods accepted for this class; list of return_method values."
  prepaid_label_fee_usd: "Fee deducted from the refund for a Marlowe & Finch prepaid mail-return label; USD, 2 decimals, or not_applicable."
  carrier_pickup_fee_usd: "Fee deducted from the refund for a scheduled carrier pickup of a large item; USD, 2 decimals, or not_applicable."
  return_label_validity_days: "Calendar days after the return is authorized within which a mail label must be used or a pickup completed; integer."
  return_refund_business_days: "Business days after the returned item is received within which the refund is issued; integer."
  delivery_fee_refundable_on_return: "Whether the home delivery fee paid for the item is refunded when it is returned for a reason other than a fee-waiver reason; boolean."
  damage_report_window_days: "Calendar days after the completed_date within which damage in transit must be reported for a damaged_in_transit return outside the ordinary window; integer."
  defective_return_window_days: "Calendar days after the completed_date within which a defective item can still be returned once the ordinary window has passed; integer."
  price_adjustment_eligible: "Whether items of this class can receive a price adjustment; boolean."
  price_adjustment_window_days: "Calendar days after the purchase_date within which a lower Marlowe & Finch price qualifies for a price adjustment; integer, or not_applicable."
  price_adjustments_per_item_max: "Maximum price adjustments one purchase record can receive; integer, or not_applicable."
  price_adjustment_min_difference_usd: "Smallest per-unit price difference refunded as a price adjustment; USD, 2 decimals."
  price_adjustment_exclusions: "Kinds of lower price that never qualify for a price adjustment; list."
  price_adjustment_refund_tender: "Where a price adjustment is refunded; string rule key (original tender)."
  final_sale_returnable: "Whether items sold as final sale can be returned; boolean."
  gift_receipt_refund_destination: "Where a gift-receipt return is refunded; string rule key."
  refund_tender_priority: "Order in which a refund is spread over the tenders of a mixed-tender purchase; list."
  cash_refund_check_threshold_usd: "Refund amount on a cash purchase above which the refund is mailed as a check instead of paid in cash; USD, 2 decimals."
  sales_tax_refund_basis: "How sales tax is refunded; string rule key (proportional to the refunded merchandise amount)."
  gift_with_purchase_rule: "Whether the value of a gift with purchase kept by the customer is deducted from the refund; boolean."
  gift_with_purchase_value_usd: "Value deducted for a kept gift with purchase; USD, 2 decimals, or not_applicable."
  personalized_items_returnable: "Whether monogrammed, engraved or made-to-order items can be returned for reasons other than defect; boolean."
  exchange_window_days: "Calendar days after the completed_date within which an even exchange (same item, other size or color) is made; integer."
  order_cancellation_cutoff: "Last fulfilment state in which an order line can be cancelled; string rule key (before shipment)."
  store_pickup_hold_days: "Calendar days a store pickup order is held after it is ready before it is cancelled and refunded; integer, or not_applicable."
  mattress_comfort_exchange_nights: "Nights after delivery within which a mattress can be exchanged once for comfort; integer, or not_applicable."
  mattress_comfort_min_nights: "Nights a mattress must be slept on before a comfort exchange; integer, or not_applicable."
  mattress_comfort_exchanges_max: "Comfort exchanges allowed per mattress purchase record; integer, or not_applicable."
  mattress_comfort_exchange_fee_usd: "Fee for a comfort exchange, excluding the delivery fee of the replacement; USD, 2 decimals, or not_applicable."
  points_and_spend_on_return: "Whether Finch Circle points and qualifying spend are reduced for a return of this class; boolean."
  registry_gift_return_destination: "Where the return of an item bought from a gift registry by a guest is refunded when returned by the registrant; string rule key."
  warranty_referral_after_window: "Whether a defect reported after the defective return window is referred to the manufacturer warranty instead of returned; boolean."
  id_required_no_receipt: "Whether a government photo ID is recorded for a no-receipt return; boolean."
  discount_allocation_basis: "How an order-level promotion or coupon is spread over the purchase records of an order; string rule key."

