# Policy charter: Marlowe & Finch Alterations. The holding is one alteration ticket for one garment,
# opened at a store alterations shop; the service class of the work is the tier and fixes prices,
# turnaround, rush, complimentary eligibility, deposits, fittings and remakes.

category: alteration
display_name: Marlowe & Finch Alterations

binding:
  holding_table: alteration_tickets
  event_tables: [alteration_charges]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: ticket_balance}

lifecycle:
  states: [dropped_off, in_progress, ready, picked_up, cancelled, disposed]
  transitions:
    - {from: dropped_off, to: in_progress, by: system, means: "The tailor starts the work (first cut or first fitting)."}
    - {from: in_progress, to: ready, by: system, means: "The work is finished and pressed and the garment is ready for pickup."}
    - {from: ready, to: picked_up, by: system, means: "The customer collects the garment and settles the balance."}
    - {from: dropped_off, to: cancelled, by: agent, means: "The ticket is cancelled at the customer's request before work starts."}
    - {from: ready, to: disposed, by: system, means: "A garment left unclaimed past the hold period is donated."}
    - {from: picked_up, to: in_progress, by: agent, means: "A remake is accepted: the garment is brought back and the work is corrected."}

accounts:
  - key: ticket_balance
    unit: USD
    meaning: "Amount owed on the alteration ticket: charges for operations, rush and extra fittings, less waivers and payments (including Finch Circle alteration credit); refunds of payments raise it back."

parameter_schema:
  service_scope: "Kind of work the service class covers; string."
  operation_prices: "Price of each alteration operation of the class; mapping operation_code -> USD."
  lined_garment_surcharge_pct: "Surcharge on operation prices when the garment is lined; percent."
  turnaround_business_days: "Business days from drop-off (or the last fitting) to ready under standard service; integer."
  peak_season_months: "Calendar months in which peak-season extra days apply; list of month numbers."
  peak_season_extra_days: "Business days added to the standard turnaround in peak season; integer."
  rush_available: "Whether rush service can be bought for the class; boolean."
  rush_turnaround_business_days: "Business days to ready under rush service; integer, or not_applicable."
  rush_fee_pct: "Rush fee as a percent of the ticket's operation charges; percent, or not_applicable."
  complimentary_basic_eligible: "Whether basic operations are complimentary for an eligible Marlowe & Finch purchase in this class; boolean."
  complimentary_operations: "Operations that are complimentary when the ticket qualifies; list of operation codes."
  complimentary_purchase_window_days: "Calendar days after the purchase's completed_date within which the garment must be dropped off for complimentary basic work; integer, or not_applicable."
  complimentary_price_types: "Price types of the purchase that qualify for complimentary basic work; list."
  complimentary_max_operations: "Maximum complimentary operations on one ticket; integer, or not_applicable."
  non_mf_items_accepted: "Whether garments not bought at Marlowe & Finch are accepted; boolean."
  deposit_pct: "Deposit taken at drop-off, percent of the quoted total; percent."
  deposit_min_usd: "Minimum deposit when a deposit is taken; USD, 2 decimals, or not_applicable."
  deposit_refundable_before_work: "Whether the deposit is refunded when the ticket is cancelled before work starts; boolean."
  fittings_included: "Fittings included in the price; integer."
  extra_fitting_fee_usd: "Fee for each fitting beyond those included; USD, 2 decimals, or not_applicable."
  measuring_appointment_required: "Whether a measuring appointment with the tailor is required at drop-off; boolean."
  needed_by_date_required: "Whether the ticket must record the date the garment is needed (event date); boolean."
  min_lead_days_before_needed: "Calendar days between drop-off and the needed-by date below which the ticket is accepted only with rush service; integer, or not_applicable."
  quote_validity_days: "Calendar days a written quote stays valid before drop-off; integer."
  quote_overrun_tolerance_pct: "Percent by which final operation charges may exceed the quote without new customer approval; percent."
  additional_work_approval: "Whether operations beyond the quote require the customer's approval before work; boolean."
  payment_due: "When the balance is due; string rule key (at pickup)."
  tenders_accepted: "Tenders accepted for alteration charges; list."
  loyalty_credit_applicable: "Whether Finch Circle alteration credit can pay this class's operation charges; boolean."
  loyalty_rush_waiver_applies: "Whether a Finch Circle tier's alteration_rush_fee_waived waives this class's rush fee; boolean."
  pickup_hold_days: "Calendar days after the ready_date a garment is held for pickup before it is donated; integer."
  unclaimed_reminder_days: "Calendar days after the ready_date on which an unclaimed-garment reminder is sent; integer."
  unclaimed_disposition: "What happens to a garment not collected in the hold period; string rule key."
  remake_window_days: "Calendar days after the pickup_date within which a remake of unsatisfactory work is accepted free of charge; integer."
  remake_count_max: "Maximum free remakes per ticket; integer."
  damage_liability_cap_usd: "Maximum compensation for a garment damaged or lost during alteration; USD, 2 decimals."
  damage_report_window_days: "Calendar days after the pickup_date within which damage must be reported; integer."
  damage_settlement_form: "Form in which damage compensation is paid; string rule key (merchandise credit card)."
  specialty_partner_outsourced: "Whether the work is sent to a specialty partner workshop; boolean."
  outsourced_extra_business_days: "Business days added to the turnaround for outsourced work; integer."
  pressing_included: "Whether final pressing is included; boolean."
  altered_item_returnable: "Whether merchandise that has been altered can still be returned for a refund; boolean."
  cancellation_after_start_charge: "What is charged when a ticket is ended after work began; string rule key (completed operations)."
  garments_per_ticket: "Garments covered by one ticket; integer."
  rush_capacity_note: "Whether rush service depends on shop capacity on the drop-off date; boolean."
  sale_item_complimentary: "Whether sale-priced Marlowe & Finch items receive complimentary basic work; boolean."
  tax_on_alterations: "Sales tax treatment of alteration charges; string rule key."
  price_list_effective_basis: "Which price list applies to a ticket; string rule key (price list on the drop-off date)."

