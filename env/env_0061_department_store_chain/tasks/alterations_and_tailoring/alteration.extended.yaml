  compute:
  - qualifying_top: "MX(MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', operation_code='hem_plain'), MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', operation_code='hem_cuffed'), MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', operation_code='hem_blind_stitch'), MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', operation_code='sleeve_shorten_plain'), MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', operation_code='waist_take_in'), MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', operation_code='trouser_hem_cuffed'), MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', operation_code='jacket_sleeve_shorten'))"
  - first_on_ticket: "COUNT('alteration_charges', event_type='alteration_charge_waiver', waiver_reason='complimentary_basic') == 0"
  - class_eligible: P('complimentary_basic_eligible')
  - p_type: "CFIELD('order', 'price_type', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - member_threshold: "(CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0)"
  - sale_allowance: "K('diamond_allow') if member_threshold >= K('diamond_threshold') else (K('platinum_allow') if member_threshold >= K('platinum_threshold') else (K('gold_allow') if member_threshold >= K('gold_threshold') else 0))"
  - p_regular: "CFIELD('order', 'regular_price', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - premium_addition: "K('premium_high_add') if (p_regular != None and p_regular >= K('premium_high_price')) else (K('premium_mid_add') if (p_regular != None and p_regular >= K('premium_mid_price')) else 0)"
  - complimentary_form: "'whole_charge' if p_type == 'regular' else ('allowance' if (p_type == 'sale' and (CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0) >= K('gold_threshold')) else 'no_waiver')"
  - tier_extension: "K('diamond_window_add') if (CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0) >= K('diamond_threshold') else (K('platinum_window_add') if (CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0) >= K('platinum_threshold') else 0)"
  - p_card: "CFIELD('order', 'card_account_id', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - charged_to_active: "EXISTS('card', status='active', card_account_id=p_card) if p_card else False"
