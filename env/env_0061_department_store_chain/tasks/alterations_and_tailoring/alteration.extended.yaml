    cross_difficulty: card
  baseline:
    rule: "Complimentary basic work is waived on a ticket in a class whose complimentary_basic_eligible is true and that names the customer's own Marlowe & Finch purchase record; the qualifying operations are hem_plain, hem_cuffed, hem_blind_stitch, sleeve_shorten_plain, waist_take_in, trouser_hem_cuffed and jacket_sleeve_shorten, and one complimentary waiver is booked per ticket, for the highest-priced qualifying operation charge of a ticket on which no complimentary waiver stands yet. Under the standard method a purchase at regular price has that whole operation charge waived and any other price type has nothing waived, when the drop-off falls in the complimentary window of the class's complimentary_purchase_window_days counted from the purchase's completed_date, and the waiver is rounded half up to the cent. The complimentary window counts calendar days starting the day after the completed_date as day 1, and a drop-off on the last day of the window is in time."
    params:
