  factors:
  - id: deposit_form_by_record
    effect: method
    decides: deposit_form
    bindings:
    - deposit_form
    ladder:
    - when: "three or more uncollected-pickup refunds in the last 24 whole months"
      method: "40.00 USD per operation charge, at least deposit_min_usd and at most the standing charges"
    - when: "fewer such refunds and standing charges of 250.00 USD or more"
      method: "two-part: deposit_min_usd plus the deposit percentage of the standing charges above 250.00 USD"
    - when: otherwise
      method: "the deposit percentage of the standing charges, at least deposit_min_usd and at most the standing charges"
    baseline:
      deposit_form: '''percentage'''
    evidence:
    - history
    cross_difficulty: null
  - id: finch_circle_deposit_rate
    effect: parameter
    decides: deposit_rate
    bindings:
    - member_threshold
    - deposit_rate
    ladder:
    - when: active member at Finch Circle Platinum or above
      value: K('platinum_rate') = 30 percent
    - when: active Finch Circle Gold member
      value: K('gold_rate') = 40 percent
    - when: otherwise
      value: P('deposit_pct')
    baseline:
      deposit_rate: P('deposit_pct')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loyalty
  - id: uncollected_order_addition
    effect: parameter
    decides: uncollected_addition
    bindings:
    - uncollected_refunds
    - uncollected_addition
    ladder:
    - when: two uncollected-pickup refunds in the last 24 whole months
      value: K('uncollected_two_add') = 20 points
    - when: one uncollected-pickup refund in the last 24 whole months
      value: K('uncollected_one_add') = 10 points
    - when: otherwise (none, or three or more)
      value: '0'
    baseline:
      uncollected_addition: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: order
  - id: garment_tender_reduction
    effect: parameter
    decides: tender_reduction
    bindings:
    - garment_tender
    - tender_reduction
    ladder:
    - when: "the ticket names the customer's purchase record paid with a Marlowe & Finch card"
      value: K('tender_card_red') = 10 points
    - when: "the ticket names the customer's purchase record paid with any other tender"
      value: K('tender_other_red') = 5 points
    - when: otherwise
      value: '0'
    baseline:
      tender_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: order
  - id: frequent_shopper_reduction
    effect: parameter
    decides: frequency_reduction
    bindings:
    - order_payments
    - frequency_reduction
    ladder:
    - when: five or more order payments in the last 12 whole months
      value: K('freq_high_red') = 5 points
    - when: two to four order payments in the last 12 whole months
      value: K('freq_mid_red') = 2 points
    - when: otherwise
      value: '0'
    baseline:
      frequency_reduction: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: order
  - id: cardmember_deposit_reduction
    effect: parameter
    decides: card_reduction
    bindings:
    - elite_card
    - card_reduction
    ladder:
    - when: active Store Card Elite or World Elite Mastercard
      value: K('elite_card_red') = 5 points
    - when: "active Marlowe & Finch card accounts, none an Elite or World Elite"
      value: K('other_card_red') = 2 points
    - when: otherwise
      value: '0'
    baseline:
      card_reduction: '0'
    evidence:
    - cross_category
    cross_difficulty: card
  baseline:
    rule: "A ticket in a class whose deposit_pct is above 0 owes a deposit before the tailor starts the work. The deposit is worked out on the ticket's standing charges, which are every charge booked on the ticket (operations, lined surcharges, the rush fee and extra fittings) less every waiver booked on it. Under the standard method the deposit is the class's deposit_pct of the standing charges, rounded half up to the cent, but at least deposit_min_usd and never more than the standing charges."
