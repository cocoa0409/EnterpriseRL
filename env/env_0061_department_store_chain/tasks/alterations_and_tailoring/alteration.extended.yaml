- id: alteration_ext_added_work_lining
  base_policy_refs:
  - alteration_pricing
  - alteration_rush_service
  overwrite:
  - base_policy: alteration_pricing
    superseded_clause: "Each operation on the ticket is charged at the class's operation_prices; when the garment is lined, a lined_surcharge row adds lined_garment_surcharge_pct of that operation's price, rounded half up to the cent."
    replaced_by: "For a lined surcharge this policy prices, and only for such a surcharge on an operation added after drop-off, the lined-work basis and discounts set out here replace lined_garment_surcharge_pct of the operation's price; each operation is still charged at the class's operation_prices, and every other lined surcharge remains under the base pricing rule."
  trigger: state_due
  subject:
  - alteration_charge
  computes: amount
  target_tool: book_lined_surcharge_bf0414f9
  params:
    flat_below: 40.0
    flat_lining: 5.0
    per_lined_op: 2.0
    rework_from: 2
    platinum_threshold: 2500.0
    silver_threshold: 500.0
    platinum_disc: 10
    silver_gold_disc: 5
    recent_days: 120
    recent_disc: 10
    older_disc: 5
    size_high: 100.0
    size_mid: 60.0
    size_high_disc: 10
    size_mid_disc: 5
    half_up_offset: 1.0e-06
  rule: "In a class whose lined_garment_surcharge_pct is above 0, a lined surcharge is owed for an operation added to a lined garment's ticket after its dropoff_date that does not yet carry one, and the lined surcharge for added work is priced on the most recently booked operation charge on the ticket, the higher one where several share that latest date; a ticket with no operation charge owes none. Under the standard method the lined surcharge for added work is the class's lined_garment_surcharge_pct of that operation charge, with no discount, rounded half up to the cent. The lined-work basis takes exactly one of three forms set by that operation charge and the lining work already on the ticket: an operation charged under 40.00 USD carries a flat lining charge of 5.00 USD; an operation charged 40.00 USD or more on a ticket that already carries two or more lined surcharge charges carries 2.00 USD for each lined operation the lining is reworked around, that is 2.00 USD times one more than the lined surcharge charges already standing; an operation charged 40.00 USD or more on a ticket carrying fewer than two lined surcharge charges carries lined_garment_surcharge_pct of its charge. A member lining discount applies when the ticket names the customer's own Marlowe & Finch purchase record: 10 percent for an active member at Finch Circle Platinum or above, 5 percent for an active Finch Circle Silver or Gold member, and none for anyone else or for a ticket that names no such purchase record. A recent-purchase lining discount applies from the calendar days between the completed_date of the purchase record the ticket names and the date the operation was booked: 10 percent for 120 days or fewer, 5 percent for more than 120 days, and none when the ticket names no completed Marlowe & Finch purchase record. A ticket-size lining discount applies from the total of the operation charges booked on the ticket: 10 percent for 100.00 USD or more, 5 percent for 60.00 to 99.99 USD, and none under 60.00 USD. The lined surcharge for added work is the lined-work basis times one hundred less the member, recent-purchase and ticket-size lining discounts, divided by one hundred, rounded half up to the cent once at the end. For a lined surcharge this policy prices, and only for such a surcharge on an operation added after drop-off, the lined-work basis and discounts set out here replace lined_garment_surcharge_pct of the operation's price; each operation is still charged at the class's operation_prices, and every other lined surcharge remains under the base pricing rule."
  prerequisite: []
  cross_category:
  - category: order
    as: branch
    reads:
    - purchase_id
    - completed_date
    note: "The ticket's own purchase record and its completion date decide the member and recent-purchase discount tiers."
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    note: The tier held decides the member lining discount tier.
  compute:
  - latest_op_date: "LATEST('alteration_charges', 'charge_date', date_field='charge_date', event_type='alteration_charge', charge_type='operation')"
  - latest_op_amount: "MAX('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation', charge_date=latest_op_date) if latest_op_date else 0"
  - lined_standing: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='lined_surcharge')"
  - lining_basis: "0 if not latest_op_date else (K('flat_lining') if latest_op_amount < K('flat_below') else (K('per_lined_op') * (lined_standing + 1) if (latest_op_amount >= K('flat_below') and lined_standing >= K('rework_from')) else P('lined_garment_surcharge_pct') * latest_op_amount / 100))"
  - own_purchase: "CFIELD('order', 'purchase_id', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - member_threshold: "(CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0)"
  - member_disc: "K('platinum_disc') if (own_purchase != None and member_threshold >= K('platinum_threshold')) else (K('silver_gold_disc') if (own_purchase != None and member_threshold >= K('silver_threshold') and member_threshold < K('platinum_threshold')) else 0)"
  - purchase_done: "CFIELD('order', 'completed_date', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - recent_disc: "K('recent_disc') if (purchase_done and latest_op_date and DAYS(purchase_done, latest_op_date) <= K('recent_days')) else (K('older_disc') if (purchase_done and latest_op_date and DAYS(purchase_done, latest_op_date) > K('recent_days')) else 0)"
  - ticket_ops_total: "SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation')"
  - size_disc: "K('size_high_disc') if ticket_ops_total >= K('size_high') else (K('size_mid_disc') if ticket_ops_total >= K('size_mid') else 0)"
  - surcharge_owed: "latest_op_date != None and latest_op_date > F('dropoff_date') and COUNT('alteration_charges', event_type='alteration_charge', charge_type='lined_surcharge') < COUNT('alteration_charges', event_type='alteration_charge', charge_type='operation')"
  - result: "RND(lining_basis * (100 - member_disc - recent_disc - size_disc) / 100 + K('half_up_offset'), 2) if (P('lined_garment_surcharge_pct') > 0 and surcharge_owed) else 0"
  compute_basis:
    latest_op_amount: "In a class whose lined_garment_surcharge_pct is above 0, a lined surcharge is owed for an operation added to a lined garment's ticket after its dropoff_date that does not yet carry one, and the lined surcharge for added work is priced on the most recently booked operation charge on the ticket, the higher one where several share that latest date; a ticket with no operation charge owes none."
