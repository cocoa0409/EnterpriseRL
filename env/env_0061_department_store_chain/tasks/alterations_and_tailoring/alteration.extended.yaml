  compute:
  - charges_booked: "SUM('alteration_charges', 'amount', event_type='alteration_charge')"
  - waivers_booked: "SUM('alteration_charges', 'amount', event_type='alteration_charge_waiver')"
  - standing_charges: "RND(charges_booked - waivers_booked + K('half_up_offset'), 2)"
  - class_owes: P('deposit_pct') > 0
  - member_threshold: "(CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0)"
  - deposit_rate: "K('platinum_rate') if member_threshold >= K('platinum_threshold') else (K('gold_rate') if member_threshold >= K('gold_threshold') else P('deposit_pct'))"
  - uncollected_refunds: "XCOUNT('order', 'order_events', within_months=24, date_field='event_date', event_type='order_refund', refund_trigger='pickup_not_collected')"
  - uncollected_addition: "K('uncollected_two_add') if uncollected_refunds == 2 else (K('uncollected_one_add') if uncollected_refunds == 1 else 0)"
  - garment_tender: "CFIELD('order', 'tender_type', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - tender_reduction: "K('tender_card_red') if garment_tender == 'mf_card' else (K('tender_other_red') if garment_tender != None else 0)"
  - order_payments: "XCOUNT('order', 'order_events', within_months=12, date_field='event_date', event_type='order_payment')"
  - frequency_reduction: "K('freq_high_red') if order_payments >= K('freq_high') else (K('freq_mid_red') if order_payments >= K('freq_mid') else 0)"
  - elite_card: "EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite') or EXISTS('card', status='active', variant_name='Marlowe & Finch World Elite Mastercard')"
  - card_reduction: "K('elite_card_red') if elite_card else (K('other_card_red') if EXISTS('card', status='active') else 0)"
  - deposit_pct_total: "MX(0, deposit_rate + uncollected_addition - tender_reduction - frequency_reduction - card_reduction)"
  - deposit_form: "'per_operation' if XCOUNT('order', 'order_events', within_months=24, date_field='event_date', event_type='order_refund', refund_trigger='pickup_not_collected') >= K('full_prepay_from') else ('two_part' if standing_charges >= K('two_part_from') else 'percentage')"
  - op_rows: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='operation')"
  - result: "(MN(standing_charges, MX(P('deposit_min_usd'), K('per_op_deposit') * op_rows)) if deposit_form == 'per_operation' else (RND(P('deposit_min_usd') + (standing_charges - K('two_part_from')) * deposit_pct_total / 100 + K('half_up_offset'), 2) if deposit_form == 'two_part' else MN(standing_charges, MX(P('deposit_min_usd'), RND(standing_charges * deposit_pct_total / 100 + K('half_up_offset'), 2))))) if class_owes else 0"
