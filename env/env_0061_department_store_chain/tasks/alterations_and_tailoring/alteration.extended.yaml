  rule: "A ticket in a class whose deposit_pct is above 0 owes a deposit before the tailor starts the work. The deposit is worked out on the ticket's standing charges, which are every charge booked on the ticket (operations, lined surcharges, the rush fee and extra fittings) less every waiver booked on it. Under the standard method the deposit is the class's deposit_pct of the standing charges, rounded half up to the cent, but at least deposit_min_usd and never more than the standing charges. The deposit on a ticket accepted with rush service is worked out only after that ticket carries its rush fee. A deposit is not taken until any Finch Circle rush fee waiver the ticket is owed stands on it. The deposit form is set by the customer's record and the ticket, and exactly one of three forms applies: a customer with three or more Marlowe & Finch refunds made because a store pickup order was never collected, dated less than 24 whole months before today, takes the per-operation form; any other customer whose ticket's standing charges are 250.00 USD or more takes the two-part form; any other ticket takes the percentage form. The deposit rate is 30 percent for an active member at Finch Circle Platinum or above, 40 percent for an active Finch Circle Gold member, and the class's deposit_pct for anyone else. An uncollected-order addition is made to the deposit rate from the customer's Marlowe & Finch refunds made because a store pickup order was never collected, dated less than 24 whole months before today: 20 percentage points for two such refunds, 10 percentage points for one, and none for none or for three or more, since three or more such refunds put the deposit in the per-operation form, which uses no deposit rate. A garment-tender deposit reduction is taken off the deposit rate when the ticket names the customer's Marlowe & Finch purchase record: 10 percentage points when that purchase was paid with a Marlowe & Finch card, 5 percentage points when it was paid with any other tender, and none when the ticket names no Marlowe & Finch purchase record. A frequent-shopper deposit reduction is taken off the deposit rate from the customer's Marlowe & Finch order payments dated less than 12 whole months before today: 5 percentage points for five or more, 2 percentage points for two to four, and none for one or none. A cardmember deposit reduction is taken off the deposit rate: 5 percentage points for a customer holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard account, 2 percentage points for a customer holding active Marlowe & Finch card accounts none of which is one of those two, and none for a customer with no active Marlowe & Finch card account. The deposit percentage is the deposit rate plus the uncollected-order addition less the garment-tender, frequent-shopper and cardmember reductions, never below 0. The deposit is assembled from its form: under the per-operation form it is 40.00 USD for each operation charge on the ticket, at least deposit_min_usd and never more than the standing charges; under the two-part form it is deposit_min_usd plus the deposit percentage of the standing charges above 250.00 USD; under the percentage form it is the deposit percentage of the standing charges, at least deposit_min_usd and never more than the standing charges; the deposit is rounded half up to the cent once, on that final figure, and a class whose deposit_pct is not above 0 takes no deposit. For a deposit this policy works out, and only for such a deposit, the deposit is taken after drop-off and before the tailor starts the work, on the ticket's standing charges in the form and at the deposit percentage set out here, at least deposit_min_usd and never more than the standing charges, in place of deposit_pct of the quoted_total at drop-off; a deposit already taken at drop-off remains under the base intake rule. For a deposit this policy works out, and only for such a deposit, the deposit is paid after drop-off and before the work starts with any of tenders_accepted other than Finch Circle alteration credit, while the balance_due is still paid at pickup (payment_due) with any of tenders_accepted; every other payment remains under the base payment rule."
