    evidence:
    - history
    - date
    cross_difficulty: null
  - id: standing_quote_tolerance
    effect: parameter
    decides: tolerance_pct
    bindings:
    - member_threshold
    - active_card
    - tolerance_pct
    ladder:
    - when: "active member at Finch Circle Platinum or above and an active Marlowe & Finch card account"
      value: K('both_pct') = 5 percent
    - when: either such a member or such a cardholder but not both
      value: K('either_pct') = 8 percent
    - when: otherwise
      value: P('quote_overrun_tolerance_pct')
    baseline:
      tolerance_pct: P('quote_overrun_tolerance_pct')
    evidence:
    - cross_category
