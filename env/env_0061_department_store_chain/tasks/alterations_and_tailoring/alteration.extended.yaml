    tolerance_pct: "The quote tolerance percentage is 5 percent for an active member at Finch Circle Platinum or above who also holds an active Marlowe & Finch card account, 8 percent for a customer who is either such a member or such a cardholder but not both, and the class's quote_overrun_tolerance_pct for anyone else."
