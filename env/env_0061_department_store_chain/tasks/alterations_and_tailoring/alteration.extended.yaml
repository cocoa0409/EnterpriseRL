- id: alteration_ext_extra_fitting_fee
  base_policy_refs:
  - alteration_pricing
  - alteration_rush_service
  overwrite:
  - base_policy: alteration_pricing
    superseded_clause: "Each fitting beyond fittings_included is charged extra_fitting_fee_usd."
    replaced_by: "For an extra fitting fee this policy books, and only for such a fee, the fee basis, rate, surcharges and credits set out here replace the flat extra_fitting_fee_usd per fitting; a fitting within the class's fittings_included is still never charged, and every other charge remains under the base pricing rule."
  trigger: on_request
  subject:
  - alteration_charge
  computes: amount
  target_tool: book_extra_fitting_87db3b08
  params:
    platinum_threshold: 2500.0
    gold_threshold: 1200.0
    platinum_fee_rate: 50
    gold_fee_rate: 75
    full_fee_rate: 100
    near_need_days: 14
    near_need_pct: 10
    near_event_days: 21
    mid_event_days: 45
    near_event_add: 5.0
    mid_event_add: 3.0
    small_job_low: 75.0
    small_job_mid: 100.0
    half_up_offset: 1.0e-06
    small_job_low_add: 4.0
    small_job_mid_add: 2.0
    wedding_credit: 4.0
    other_registry_credit: 2.0
    elite_card_credit: 3.0
    other_card_credit: 1.0
  rule: "Each fitting beyond the class's fittings_included is an extra fitting, numbered in order among the extra fittings already charged on the ticket, and the customer is charged an extra fitting fee when booking it. Under the standard method the extra fitting fee is the class's extra_fitting_fee_usd for every extra fitting, with no rate, surcharge or credit, rounded half up to the cent. The fee for an extra fitting is fixed only after the ticket carries the complimentary waiver owed on its qualifying operations. An extra fitting fee is not booked until any operation charges running past the honored quote stand waived on the ticket. The extra fitting fee rate is 50 percent for an active member at Finch Circle Platinum or above, 75 percent for an active Finch Circle Gold member, and 100 percent for anyone else. The extra fitting fee basis takes exactly one of three forms set by the ticket's needed_by_date: a ticket with no needed_by_date has open-ended fitting rounds, so each extra fitting costs extra_fitting_fee_usd times the fitting's number among the extra fittings; a ticket whose needed_by_date is today or 1 to 14 calendar days after today pays extra_fitting_fee_usd plus 10 percent of the ticket's operation charges, because a fitting that close to the date re-checks the whole job; a ticket whose needed_by_date is more than 14 days after today, or has already passed, pays extra_fitting_fee_usd. An event-proximity surcharge is added for a fitting booked close to the event of the customer's active Wedding Registry, counted in calendar days from today to its event_date: 5.00 USD for 0 to 21 days, 3.00 USD for 22 to 45 days, and none otherwise or when the customer holds no active Wedding Registry. A small-job surcharge is added from the ticket's chargeable work, which is its operation charges less every waiver booked on the ticket: 4.00 USD when the chargeable work is under 75.00 USD, 2.00 USD when it is 75.00 to 99.99 USD, and none at 100.00 USD or more. A wedding-party credit is taken off: 4.00 USD for a customer whose active Wedding Registry has its event_date today or later, 2.00 USD for a customer without such a Wedding Registry who holds an active Anniversary or Celebration Registry, and none otherwise. A cardmember fitting credit is taken off: 3.00 USD for a customer holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard account, 1.00 USD for a customer holding active Marlowe & Finch card accounts none of which is one of those two, and none for a customer with no active Marlowe & Finch card account. The extra fitting fee is the fee basis times the extra fitting fee rate percent, plus the event-proximity and small-job surcharges, less the wedding-party and cardmember credits, rounded half up to the cent once at the end and never below zero. For an extra fitting fee this policy books, and only for such a fee, the fee basis, rate, surcharges and credits set out here replace the flat extra_fitting_fee_usd per fitting; a fitting within the class's fittings_included is still never charged, and every other charge remains under the base pricing rule."
  prerequisite:
  - problem: alteration_ext_complimentary_work
    kind: value_input
    gate: chargeable_work
    form: state
    policy_source: "The fee for an extra fitting is fixed only after the ticket carries the complimentary waiver owed on its qualifying operations."
    condition: "Every qualifying operation charge owed complimentary work under the complimentary policy has a complimentary_basic waiver row against it."
    resolved_by: waive_complimentary_work_96f02105
    effect: "Once the complimentary waiver stands, the ticket's chargeable work falls by the amount waived, which can move the small-job surcharge to a higher tier."
  - problem: alteration_ext_quote_overrun
    kind: value_input
    gate: chargeable_work
    form: state
    policy_source: "An extra fitting fee is not booked until any operation charges running past the honored quote stand waived on the ticket."
    condition: "Where the overrun charges run past the honored amount, a quote_overrun waiver row stands on the ticket for the excess."
    resolved_by: waive_quote_overrun_938dcea5
    effect: "Once the quote overrun waiver stands, the ticket's chargeable work falls by the amount waived, which can move the small-job surcharge to a higher tier."
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    note: The tier held decides the extra fitting fee rate.
  - category: registry
    as: branch
    reads:
    - status
    - variant_name
    - event_date
    note: "The active registry's type and event date decide the event-proximity surcharge and the wedding-party credit."
  - category: card
    as: branch
    reads:
    - status
    - variant_name
    note: The active card held decides the cardmember fitting credit.
  compute:
  - base_fee: P('extra_fitting_fee_usd')
  - fitting_number: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='extra_fitting_fee') + 1"
  - days_to_need: "DAYS(NOW, F('needed_by_date')) if F('needed_by_date') else None"
  - fee_basis: "base_fee * fitting_number if days_to_need == None else (base_fee + SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation') * K('near_need_pct') / 100 if (days_to_need >= 0 and days_to_need <= K('near_need_days')) else base_fee)"
  - member_threshold: "(CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0)"
  - fee_rate: "K('platinum_fee_rate') if member_threshold >= K('platinum_threshold') else (K('gold_fee_rate') if member_threshold >= K('gold_threshold') else K('full_fee_rate'))"
  - event_date: "CFIELD('registry', 'event_date', status='active', variant_name='Wedding Registry')"
  - days_to_event: DAYS(NOW, event_date) if event_date else -1
  - event_surcharge: "K('near_event_add') if (days_to_event >= 0 and days_to_event <= K('near_event_days')) else (K('mid_event_add') if (days_to_event > K('near_event_days') and days_to_event <= K('mid_event_days')) else 0)"
  - chargeable_work: "SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation') - SUM('alteration_charges', 'amount', event_type='alteration_charge_waiver')"
  - small_job_surcharge: "K('small_job_low_add') if chargeable_work < K('small_job_low') else (K('small_job_mid_add') if chargeable_work < K('small_job_mid') else 0)"
  - other_occasion: "EXISTS('registry', status='active', variant_name='Anniversary Registry') or EXISTS('registry', status='active', variant_name='Celebration Registry')"
  - wedding_event: "CFIELD('registry', 'event_date', status='active', variant_name='Wedding Registry')"
  - party_credit: "K('wedding_credit') if (wedding_event and DAYS(NOW, wedding_event) >= 0) else (K('other_registry_credit') if other_occasion else 0)"
  - elite_card: "EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite') or EXISTS('card', status='active', variant_name='Marlowe & Finch World Elite Mastercard')"
  - card_credit: "K('elite_card_credit') if elite_card else (K('other_card_credit') if EXISTS('card', status='active') else 0)"
  - result: "MX(0, RND(fee_basis * fee_rate / 100 + event_surcharge + small_job_surcharge - party_credit - card_credit + K('half_up_offset'), 2))"
  compute_basis:
    base_fee: "Under the standard method the extra fitting fee is the class's extra_fitting_fee_usd for every extra fitting, with no rate, surcharge or credit, rounded half up to the cent."
    fitting_number: "Each fitting beyond the class's fittings_included is an extra fitting, numbered in order among the extra fittings already charged on the ticket, and the customer is charged an extra fitting fee when booking it."
    days_to_need: "The extra fitting fee basis takes exactly one of three forms set by the ticket's needed_by_date: a ticket with no needed_by_date has open-ended fitting rounds, so each extra fitting costs extra_fitting_fee_usd times the fitting's number among the extra fittings; a ticket whose needed_by_date is today or 1 to 14 calendar days after today pays extra_fitting_fee_usd plus 10 percent of the ticket's operation charges, because a fitting that close to the date re-checks the whole job; a ticket whose needed_by_date is more than 14 days after today, or has already passed, pays extra_fitting_fee_usd."
    fee_basis: "The extra fitting fee basis takes exactly one of three forms set by the ticket's needed_by_date: a ticket with no needed_by_date has open-ended fitting rounds, so each extra fitting costs extra_fitting_fee_usd times the fitting's number among the extra fittings; a ticket whose needed_by_date is today or 1 to 14 calendar days after today pays extra_fitting_fee_usd plus 10 percent of the ticket's operation charges, because a fitting that close to the date re-checks the whole job; a ticket whose needed_by_date is more than 14 days after today, or has already passed, pays extra_fitting_fee_usd."
    member_threshold: "The extra fitting fee rate is 50 percent for an active member at Finch Circle Platinum or above, 75 percent for an active Finch Circle Gold member, and 100 percent for anyone else."
    fee_rate: "The extra fitting fee rate is 50 percent for an active member at Finch Circle Platinum or above, 75 percent for an active Finch Circle Gold member, and 100 percent for anyone else."
    event_date: "An event-proximity surcharge is added for a fitting booked close to the event of the customer's active Wedding Registry, counted in calendar days from today to its event_date: 5.00 USD for 0 to 21 days, 3.00 USD for 22 to 45 days, and none otherwise or when the customer holds no active Wedding Registry."
    days_to_event: "An event-proximity surcharge is added for a fitting booked close to the event of the customer's active Wedding Registry, counted in calendar days from today to its event_date: 5.00 USD for 0 to 21 days, 3.00 USD for 22 to 45 days, and none otherwise or when the customer holds no active Wedding Registry."
    event_surcharge: "An event-proximity surcharge is added for a fitting booked close to the event of the customer's active Wedding Registry, counted in calendar days from today to its event_date: 5.00 USD for 0 to 21 days, 3.00 USD for 22 to 45 days, and none otherwise or when the customer holds no active Wedding Registry."
    chargeable_work: "A small-job surcharge is added from the ticket's chargeable work, which is its operation charges less every waiver booked on the ticket: 4.00 USD when the chargeable work is under 75.00 USD, 2.00 USD when it is 75.00 to 99.99 USD, and none at 100.00 USD or more."
    small_job_surcharge: "A small-job surcharge is added from the ticket's chargeable work, which is its operation charges less every waiver booked on the ticket: 4.00 USD when the chargeable work is under 75.00 USD, 2.00 USD when it is 75.00 to 99.99 USD, and none at 100.00 USD or more."
    other_occasion: "A wedding-party credit is taken off: 4.00 USD for a customer whose active Wedding Registry has its event_date today or later, 2.00 USD for a customer without such a Wedding Registry who holds an active Anniversary or Celebration Registry, and none otherwise."
    wedding_event: "A wedding-party credit is taken off: 4.00 USD for a customer whose active Wedding Registry has its event_date today or later, 2.00 USD for a customer without such a Wedding Registry who holds an active Anniversary or Celebration Registry, and none otherwise."
    party_credit: "A wedding-party credit is taken off: 4.00 USD for a customer whose active Wedding Registry has its event_date today or later, 2.00 USD for a customer without such a Wedding Registry who holds an active Anniversary or Celebration Registry, and none otherwise."
    elite_card: "A cardmember fitting credit is taken off: 3.00 USD for a customer holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard account, 1.00 USD for a customer holding active Marlowe & Finch card accounts none of which is one of those two, and none for a customer with no active Marlowe & Finch card account."
    card_credit: "A cardmember fitting credit is taken off: 3.00 USD for a customer holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard account, 1.00 USD for a customer holding active Marlowe & Finch card accounts none of which is one of those two, and none for a customer with no active Marlowe & Finch card account."
    result: "The extra fitting fee is the fee basis times the extra fitting fee rate percent, plus the event-proximity and small-job surcharges, less the wedding-party and cardmember credits, rounded half up to the cent once at the end and never below zero."
  factors:
  - id: member_fitting_rate
    effect: parameter
    decides: fee_rate
    bindings:
    - member_threshold
    - fee_rate
    ladder:
    - when: active member at Finch Circle Platinum or above
      value: K('platinum_fee_rate') = 50 percent
    - when: active Finch Circle Gold member
      value: K('gold_fee_rate') = 75 percent
    - when: otherwise
      value: K('full_fee_rate') = 100 percent
    baseline:
      fee_rate: K('full_fee_rate')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loyalty
  - id: fitting_number_basis
    effect: method
    decides: fee_basis
    bindings:
    - fitting_number
    - days_to_need
    - fee_basis
    ladder:
    - when: ticket with no needed_by_date
      method: "extra_fitting_fee_usd times the fitting's number among the extra fittings"
    - when: needed_by_date today or 1 to 14 calendar days after today
      method: "extra_fitting_fee_usd plus 10 percent of the ticket's operation charges"
    - when: "otherwise (needed_by_date more than 14 days after today, or already passed)"
      method: extra_fitting_fee_usd
    baseline:
      fee_basis: base_fee
    evidence:
    - history
    cross_difficulty: null
  - id: event_proximity_surcharge
    effect: parameter
    decides: event_surcharge
    bindings:
    - event_date
    - days_to_event
    - event_surcharge
    ladder:
    - when: active Wedding Registry event_date 0 to 21 days from today
      value: K('near_event_add') = 5.00 USD
    - when: active Wedding Registry event_date 22 to 45 days from today
      value: K('mid_event_add') = 3.00 USD
    - when: otherwise
      value: '0'
    baseline:
      event_surcharge: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: registry
  - id: small_job_fitting_surcharge
    effect: parameter
    decides: small_job_surcharge
    bindings:
    - chargeable_work
    - small_job_surcharge
    ladder:
    - when: chargeable work under 75.00 USD
      value: K('small_job_low_add') = 4.00 USD
    - when: chargeable work 75.00 to 99.99 USD
      value: K('small_job_mid_add') = 2.00 USD
    - when: otherwise
      value: '0'
    baseline:
      small_job_surcharge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: wedding_party_credit
    effect: parameter
    decides: party_credit
    bindings:
    - other_occasion
    - wedding_event
    - party_credit
    ladder:
    - when: active Wedding Registry and its event_date today or later
      value: K('wedding_credit') = 4.00 USD
    - when: "no such Wedding Registry and an active Anniversary or Celebration Registry"
      value: K('other_registry_credit') = 2.00 USD
    - when: otherwise
      value: '0'
    baseline:
      party_credit: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: registry
  - id: cardmember_fitting_credit
    effect: parameter
    decides: card_credit
    bindings:
    - elite_card
    - card_credit
    ladder:
    - when: active Store Card Elite or World Elite Mastercard
      value: K('elite_card_credit') = 3.00 USD
    - when: "active Marlowe & Finch card accounts, none an Elite or World Elite"
      value: K('other_card_credit') = 1.00 USD
    - when: otherwise
      value: '0'
    baseline:
      card_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: card
  baseline:
    rule: "Each fitting beyond the class's fittings_included is an extra fitting, numbered in order among the extra fittings already charged on the ticket, and the customer is charged an extra fitting fee when booking it. Under the standard method the extra fitting fee is the class's extra_fitting_fee_usd for every extra fitting, with no rate, surcharge or credit, rounded half up to the cent."
    params:
    - extra_fitting_fee_usd
    - fittings_included
  inputs:
    history:
    - table: alteration_charges
      aggregate: count
      field: alteration_charge_id
      filters:
        event_type: alteration_charge
        charge_type: extra_fitting_fee
    - table: alteration_charges
      aggregate: sum
      field: amount
      filters:
        event_type: alteration_charge_waiver
    cross_category:
    - loyalty
    - registry
    - card
