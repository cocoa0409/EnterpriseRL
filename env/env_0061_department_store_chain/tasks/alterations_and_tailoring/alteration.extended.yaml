# ---- events (every write of this category) ----
events:
  - type: alteration_dropoff
    target: alteration_tickets
    mutation: create
    meaning: "A customer drops off a garment at a store alterations shop and an alteration ticket is opened with the agreed operations and quote."
    grain: "One row per garment ticket."
    fields:
      variant_name: "Service class of the work, as the official class name."
      status: "dropped_off at creation."
      ticket_number: "Alteration ticket number printed on the claim stub."
      garment_description: "Garment as described on the ticket."
      purchase_id: "Marlowe & Finch purchase record of the garment, when bought at Marlowe & Finch."
      dropoff_date: "Date of drop-off."
      promised_date: "Date the garment is promised ready."
      needed_by_date: "Date the customer needs the garment (event date), when recorded."
      rush_service: "Whether rush service was bought."
      quoted_total: "Total of the quoted operation charges, USD."
    triggers: []
  - type: alteration_work_start
    target: alteration_tickets
    mutation: {transition: {from: dropped_off, to: in_progress}}
    meaning: "The tailor starts the work."
    grain: "One transition per ticket."
    fields:
      status: "Set to in_progress."
    triggers: []
  - type: alteration_ready
    target: alteration_tickets
    mutation: {transition: {from: in_progress, to: ready}}
    meaning: "The work is finished and the garment is ready for pickup."
    grain: "One transition per completion of work (again after a remake)."
    fields:
      status: "Set to ready."
      ready_date: "Date the garment became ready."
    triggers: []
  - type: alteration_pickup
    target: alteration_tickets
    mutation: {transition: {from: ready, to: picked_up}}
    meaning: "The customer collects the garment."
    grain: "One transition per collection."
    fields:
      status: "Set to picked_up."
      pickup_date: "Date of collection."
    triggers: []
  - type: alteration_cancel
    target: alteration_tickets
    mutation: {transition: {from: dropped_off, to: cancelled}}
    meaning: "The ticket is cancelled at the customer's request before work starts."
    grain: "One transition per cancelled ticket."
    fields:
      status: "Set to cancelled."
      cancelled_date: "Date of cancellation."
    triggers:
      - event: "alteration:alteration_charge_waiver"
        map: {waiver_reason: cancellation_before_work}
  - type: alteration_disposal
    target: alteration_tickets
    mutation: {transition: {from: ready, to: disposed}}
    meaning: "A garment unclaimed past the hold period is donated."
    grain: "One transition per disposed ticket."
    fields:
      status: "Set to disposed."
    triggers: []
  - type: alteration_remake
    target: alteration_tickets
    mutation: {transition: {from: picked_up, to: in_progress}}
    meaning: "A remake of unsatisfactory work is accepted and the garment goes back into work."
    grain: "One transition per remake."
    fields:
      status: "Set to in_progress."
      remake_count: "Number of remakes on the ticket, including this one."
      promised_date: "New promised date for the corrected work."
    triggers: []
  - type: alteration_service_change
    target: alteration_tickets
    mutation: update
    meaning: "The customer upgrades an open ticket to rush service, or the promised date is moved."
    grain: "One update per change."
    fields:
      rush_service: "Whether rush service applies after the change."
      promised_date: "Promised date after the change."
    triggers:
      - event: "alteration:alteration_charge"
        when: {rush_service: true}
        map: {charge_type: rush_fee}
  - type: alteration_charge
    target: alteration_charges
    meaning: "A charge is booked on the ticket: an operation, a lined-garment surcharge, a rush fee or an extra fitting."
    grain: "One row per operation per ticket, one rush fee per ticket, one row per extra fitting."
    distinguish_by: [charge_type, operation_code, fitting_number]
    fields:
      charge_date: "Date the charge was booked."
      amount: "Charge amount, positive USD."
      charge_type: "operation, lined_surcharge, rush_fee or extra_fitting_fee."
      operation_code: "Operation charged (for operation and lined_surcharge rows); not_applicable otherwise."
      fitting_number: "Ordinal of the extra fitting charged; 0 for other rows."
    account: ticket_balance
    direction: in
    triggers: []
  - type: alteration_charge_waiver
    target: alteration_charges
    meaning: "A charge is waived: complimentary basic work, a Finch Circle rush fee waiver, cancellation before work, a remake, or charges above the quote tolerance."
    grain: "One row per charge waived."
    distinguish_by: [original_alteration_charge_id]
    fields:
      charge_date: "Date of the waiver."
      amount: "Amount waived, positive USD, equal to the charge or the part of it waived."
      waiver_reason: "complimentary_basic, loyalty_rush_waiver, cancellation_before_work, remake_no_charge or quote_overrun."
      original_alteration_charge_id: "The charge row being waived."
    account: ticket_balance
    direction: out
    triggers: []
  - type: alteration_payment
    target: alteration_charges
    meaning: "The customer pays a deposit at drop-off or the balance at pickup, with a tender or Finch Circle alteration credit."
    grain: "One row per payment kind per tender per ticket."
    distinguish_by: [payment_kind, tender_type]
    fields:
      charge_date: "Date of payment."
      amount: "Amount paid, positive USD."
      payment_kind: "deposit or balance."
      tender_type: "mf_card, bank_card, debit, cash, gift_card or alteration_credit."
    account: ticket_balance
    direction: out
    triggers:
      - event: "loyalty:loyalty_alteration_credit_use"
        when: {tender_type: alteration_credit}
        map: {ticket_id: ticket_id, amount: amount}
  - type: alteration_refund
    target: alteration_charges
    meaning: "A payment is refunded because the ticket was cancelled before work or charges were waived after payment."
    grain: "One row per payment refunded."
    distinguish_by: [original_alteration_charge_id]
    fields:
      charge_date: "Date of the refund."
      amount: "Amount refunded, positive USD."
      tender_type: "Tender refunded, the same as the payment refunded."
      original_alteration_charge_id: "The payment row being refunded."
    account: ticket_balance
    direction: in
    triggers:
      - event: "loyalty:loyalty_alteration_credit_restore"
        when: {tender_type: alteration_credit}
        map: {ticket_id: ticket_id, amount: amount}
  - type: alteration_damage_settlement
    target: alteration_charges
    meaning: "Compensation is settled for a garment damaged or lost while in the alterations shop."
    grain: "One row per ticket settled."
    distinguish_by: [charge_type]
    fields:
      charge_date: "Date of the settlement."
      amount: "Compensation paid, positive USD."
      charge_type: "damage_compensation."
    triggers:
      - event: "giftcard:giftcard_issue"
        map: {amount: amount, issue_reason: alteration_damage_settlement}

# ---- derived measures ----
measures:
  - id: alteration_msr_operation_charges
    window: "All history of the ticket."
    measure: "Sum of amount of alteration_charge rows of the ticket with charge_type operation or lined_surcharge."
  - id: alteration_msr_complimentary_ops_on_purchase
    window: "All tickets naming the same purchase_id."
    measure: "Count of alteration_charge_waiver rows with waiver_reason complimentary_basic on tickets whose purchase_id is the purchase concerned."

# ---- policies ----
policies:
  - id: alteration_agg_multi_holding
    subject: [alteration_dropoff]
    rule: >-
      A customer may have any number of alteration tickets (max_per_customer null); each ticket covers one garment
      (garments_per_ticket), and a suit jacket and its trousers are two tickets. Prices, turnaround, deposits, fittings,
      remakes and complimentary work are decided per ticket.
    eligibility: []
    params:
      max_per_customer: null

  - id: alteration_agg_complimentary_per_purchase
    subject: [alteration_charge_waiver]
    rule: >-
      Complimentary basic work is counted per purchase record across all tickets: the complimentary operations granted on
      every ticket that names the same purchase_id (alteration_msr_complimentary_ops_on_purchase) never exceed the class's
      complimentary_max_operations in total, so a garment brought back on a second ticket receives only what remains of
      that allowance. Finch Circle alteration credit is counted per membership and benefit year under the Finch Circle
      rules, not per ticket.
    eligibility: []
    params: {}
    measures: [alteration_msr_complimentary_ops_on_purchase]

  - id: alteration_intake_rules
    subject: [alteration_dropoff]
    rule: >-
      A garment is accepted in the service class that covers it (service_scope). Garments not bought at Marlowe & Finch are
      accepted only where non_mf_items_accepted is true. Where measuring_appointment_required is true the tailor measures
      the customer at drop-off, and where needed_by_date_required is true the needed_by_date is recorded. When the
      needed_by_date is fewer than min_lead_days_before_needed calendar days after the dropoff_date, the ticket is accepted
      only with rush service, and declined when rush service is not available or its turnaround would miss the date. The
      quote uses the price list in force on the dropoff_date (price_list_effective_basis) and a written quote is honored for
      quote_validity_days. The promised_date is the dropoff_date plus turnaround_business_days business days, plus
      peak_season_extra_days when the dropoff_date falls in peak_season_months, plus outsourced_extra_business_days for
      outsourced work; with rush service it is the dropoff_date plus rush_turnaround_business_days business days. A deposit
      of deposit_pct of the quoted_total, but at least deposit_min_usd and never more than the quoted_total, is taken at
      drop-off where deposit_pct is above 0. Altering a Marlowe & Finch purchase ends its eligibility for return or
      exchange (altered_item_returnable false) except for a defect unrelated to the alteration.
    eligibility: []
    params: {}

  - id: alteration_pricing
    subject: [alteration_charge]
    rule: >-
      Each operation on the ticket is charged at the class's operation_prices; when the garment is lined, a lined_surcharge
      row adds lined_garment_surcharge_pct of that operation's price, rounded half up to the cent. A rush fee row charges
      rush_fee_pct of alteration_msr_operation_charges, rounded half up to the cent, once per ticket. Each fitting beyond
      fittings_included is charged extra_fitting_fee_usd. Operations beyond the quote are added only after the customer
      approves them (additional_work_approval); when the final operation charges exceed the quoted_total by more than
      quote_overrun_tolerance_pct without such approval, the excess is waived with waiver_reason quote_overrun. Pressing is
      included (pressing_included) and never charged.
      Sales tax on alteration charges follows tax_on_alterations: it is included in the listed prices and never added on top.
    eligibility: []
    params: {}
    formula:
      rush_fee_amount: "round(alteration_msr_operation_charges * rush_fee_pct / 100, 2)"
    measures: [alteration_msr_operation_charges]

  - id: alteration_complimentary_basic
    subject: [alteration_charge_waiver]
    rule: >-
      Basic operations are complimentary (waiver_reason complimentary_basic) when all of the following hold: the class's
      complimentary_basic_eligible is true; the ticket names a Marlowe & Finch purchase record in the customer's own name
      whose price_type is one of complimentary_price_types (sale, clearance, doorbuster and final sale items are charged,
      sale_item_complimentary false); and the operation is one of the class's complimentary_operations. The garment is
      dropped off within the complimentary window after the purchase's completed_date. The window counts calendar days
      starting the day after the completed_date as day 1, and a drop-off on the last day of
      complimentary_purchase_window_days is in time. At most complimentary_max_operations operations are complimentary
      (see alteration_agg_complimentary_per_purchase), taken from the qualifying operations with the highest price first.
      Lined surcharges on a complimentary operation are complimentary too; rush fees and extra fittings never are. A
      gift with a gift receipt counts as the recipient's purchase only when the purchase record is in the recipient's name.
    eligibility:
      - id: complimentary_window
        applies_to: [alteration_charge_waiver]
        kind: time
        condition: "The garment is dropped off within the complimentary window after the purchase's completed_date."
        evidence_fields: [purchases.completed_date, alteration_tickets.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.purchase_id]
          action_bindings:
            alteration_tickets.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase's completed_date"
          anchor_source: purchases.completed_date
          relation: not_after
          duration_source: variants.complimentary_purchase_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the completed_date as day 1, and a drop-off on the last day of complimentary_purchase_window_days is in time."
          boundary: inclusive
    params:
      per_tier:
        "Express Hem & Cuff": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Standard Alterations": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Tailored Suiting": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Formal & Evening Wear": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Bridal Alterations": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}
        "Leather & Specialty": {complimentary: "=complimentary_basic_eligible", max_ops: "=complimentary_max_operations"}

  - id: alteration_rush_service
    subject: [alteration_service_change, alteration_charge, alteration_charge_waiver]
    rule: >-
      Rush service is offered only where rush_available is true and the shop has capacity on the day (rush_capacity_note).
      A ticket can be upgraded to rush while the work has not finished. The ticket is in dropped_off or in_progress status.
      The upgrade moves the promised_date to the date of the upgrade plus rush_turnaround_business_days business days and
      books the rush fee under alteration_pricing. A Finch Circle member whose tier held on the ticket's dropoff_date has
      alteration_rush_fee_waived true has the rush fee waived (waiver_reason loyalty_rush_waiver) when the class's
      loyalty_rush_waiver_applies is true. A rush fee is not refunded when the garment is ready on the rush promised date,
      and is waived in full when the shop misses that date.
    eligibility:
      - id: rush_open_ticket
        applies_to: [alteration_service_change]
        kind: state
        condition: "The ticket is in dropped_off or in_progress status."
        evidence_fields: [alteration_tickets.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.status]
          action_bindings:
            alteration_tickets.status: status
        state_contract:
          field: alteration_tickets.status
          allowed: [dropped_off, in_progress]
    params:
      per_tier:
        "Express Hem & Cuff": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Standard Alterations": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Tailored Suiting": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Formal & Evening Wear": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Bridal Alterations": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}
        "Leather & Specialty": {rush_fee_pct: "=rush_fee_pct", rush_days: "=rush_turnaround_business_days"}

  - id: alteration_payment_rules
    subject: [alteration_payment, alteration_refund]
    rule: >-
      The deposit is paid at drop-off and the balance_due at pickup (payment_due), with any of tenders_accepted. Finch
      Circle alteration credit (tender_type alteration_credit) can pay only operation and lined-surcharge charges, only on
      a ticket that names a Marlowe & Finch purchase record, and only where the class's loyalty_credit_applicable is true;
      it is applied up to the lower of those charges remaining after waivers and the member's alteration_credit_balance,
      and the membership must be active. Rush fees, extra fittings and garments not bought at Marlowe & Finch are paid with
      other tenders. A refund always goes back to the tender of the payment it refunds and names that payment as
      original_alteration_charge_id; refunded alteration credit is restored under the Finch Circle rules. A garment is
      released only when balance_due is 0.00.
    eligibility: []
    params: {}

  - id: alteration_cancellation_rules
    subject: [alteration_cancel, alteration_charge_waiver, alteration_refund]
    rule: >-
      A ticket can be cancelled at the customer's request only before the work starts, while it is in dropped_off status.
      On cancellation every charge on the ticket is waived (waiver_reason cancellation_before_work) and every payment,
      including the deposit (deposit_refundable_before_work), is refunded to its tender. Once work has started the ticket
      cannot be cancelled: if the customer takes the garment back unfinished, the operations already completed are charged
      at the price list (cancellation_after_start_charge) and the deposit is applied to them.
    eligibility: []
    params: {}

  - id: alteration_remake_rules
    subject: [alteration_remake, alteration_charge_waiver]
    rule: >-
      When the customer reports that completed work does not fit as agreed, a remake is accepted free of charge. The remake
      is requested within the remake window after the pickup_date. The window counts calendar days starting the day after
      the pickup_date as day 1, and a request on the last day of remake_window_days is in time. The ticket's remake_count
      must be below the class's remake_count_max. The remake corrects the agreed operations only: correction charges are
      waived with waiver_reason remake_no_charge, and any new operation the customer asks for is charged under
      alteration_pricing. A garment worn, washed or altered elsewhere after pickup is not remade.
    eligibility:
      - id: remake_window
        applies_to: [alteration_remake]
        kind: time
        condition: "The remake is requested within the remake window after the pickup_date."
        evidence_fields: [alteration_tickets.pickup_date, alteration_tickets.ticket_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.ticket_id]
          action_bindings:
            alteration_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pickup_date"
          anchor_source: alteration_tickets.pickup_date
          relation: not_after
          duration_source: variants.remake_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the pickup_date as day 1, and a request on the last day of remake_window_days is in time."
          boundary: inclusive
    params:
      per_tier:
        "Express Hem & Cuff": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Standard Alterations": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Tailored Suiting": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Formal & Evening Wear": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Bridal Alterations": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}
        "Leather & Specialty": {window_days: "=remake_window_days", max_remakes: "=remake_count_max"}

  - id: alteration_unclaimed_garments
    subject: [alteration_disposal]
    rule: >-
      A ready garment is held for pickup_hold_days calendar days after its ready_date; a reminder goes out on day
      unclaimed_reminder_days. A garment not collected by the end of the hold period is donated
      (unclaimed_disposition); the deposit and any payment are kept, the unpaid balance is not pursued, and no compensation
      is owed. A customer who calls before the hold period ends can collect the garment on the ordinary terms.
    eligibility: []
    params: {}

  - id: alteration_damage_rules
    subject: [alteration_damage_settlement]
    rule: >-
      When a garment is damaged or lost while in the shop, Marlowe & Finch compensates the customer. The damage is
      reported within the damage window after the pickup_date. The window counts calendar days starting the day after the
      pickup_date as day 1, and a report on the last day of damage_report_window_days is in time; a lost garment is
      reported any time after its promised_date. Compensation is the net amount paid for the garment on its Marlowe & Finch
      purchase record (or the customer's documented purchase price for other garments), at most the class's
      damage_liability_cap_usd, settled once per ticket as a merchandise credit card (damage_settlement_form), and every
      charge on the ticket is waived. Damage from fabric defects disclosed and accepted at drop-off is not compensated.
    eligibility:
      - id: damage_window
        applies_to: [alteration_damage_settlement]
        kind: time
        condition: "The damage is reported within the damage window after the pickup_date."
        evidence_fields: [alteration_tickets.pickup_date, alteration_tickets.ticket_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [alteration_tickets.ticket_id]
          action_bindings:
            alteration_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pickup_date"
          anchor_source: alteration_tickets.pickup_date
          relation: not_after
          duration_source: variants.damage_report_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the pickup_date as day 1, and a report on the last day of damage_report_window_days is in time; a lost garment is reported any time after its promised_date."
          boundary: inclusive
    params:
      per_tier:
        "Express Hem & Cuff": {liability_cap: "=damage_liability_cap_usd"}
        "Standard Alterations": {liability_cap: "=damage_liability_cap_usd"}
        "Tailored Suiting": {liability_cap: "=damage_liability_cap_usd"}
        "Formal & Evening Wear": {liability_cap: "=damage_liability_cap_usd"}
        "Bridal Alterations": {liability_cap: "=damage_liability_cap_usd"}
        "Leather & Specialty": {liability_cap: "=damage_liability_cap_usd"}

  - id: alteration_shop_workflow
    subject: [alteration_work_start, alteration_ready, alteration_pickup]
    rule: >-
      Work start, ready and pickup are recorded by the alterations shop; customer care never records them. Specialty work
      (specialty_partner_outsourced) is sent to the partner workshop. A garment is handed over at pickup only after
      balance_due reaches 0.00 under alteration_payment_rules. When the garment is not ready on the promised_date the
      customer is told the new date; a missed rush date waives the rush fee under alteration_rush_service.
    eligibility: []
    params: {}

# ---- extended policies (alterations_and_tailoring) ----
extended_policies:
- id: alteration_ext_rush_fee
  base_policy_refs:
  - alteration_pricing
  - alteration_rush_service
  overwrite:
  - base_policy: alteration_pricing
    superseded_clause: "A rush fee row charges rush_fee_pct of alteration_msr_operation_charges, rounded half up to the cent, once per ticket."
    replaced_by: "For a rush fee this policy books, and only for such a rush fee, the rush charge basis, multiplier, premium and discounts set out here replace the flat rush_fee_pct of the operation charges; the fee is still booked once per ticket and rounded half up to the cent, and every other charge on the ticket remains under the base pricing rule."
  trigger: state_due
  subject:
  - alteration_charge
  computes: amount
  target_tool: book_rush_fee_44a954b1
  params:
    per_operation_rush: 30.0
    per_operation_from: 3
    flat_rush: 25.0
    flat_rush_below: 80.0
    express_lead_days: 7
    express_mult: 150
    short_lead_days: 14
    short_mult: 125
    standard_mult: 100
    lining_premium_multi: 15
    lining_premium_single: 10
    elite_card_disc: 10
    other_card_disc: 5
    new_purchase_days: 30
    new_purchase_disc: 10
    linked_purchase_disc: 5
    wedding_occasion_disc: 10
    other_occasion_disc: 5
    half_up_offset: 1.0e-06
  rule: "A ticket accepted with rush service owes one rush fee, booked once per ticket. The rush-fee operation base is the total of every operation charge and every lined surcharge charge booked on the ticket. Under the standard method the rush fee is the class's rush_fee_pct of the rush-fee operation base, with no lead-time multiplier, premium or discount, rounded half up to the cent. The rush charge basis depends on the work on the ticket, and exactly one of three forms applies: a ticket carrying three or more operation charges is charged per operation, the basis being the number of operation charges times 30.00 USD; a ticket carrying one or two operation charges whose rush-fee operation base is under 80.00 USD is charged a flat rush basis of 25.00 USD; a ticket carrying one or two operation charges whose rush-fee operation base is 80.00 USD or more is charged the class's rush_fee_pct of the rush-fee operation base. A lead-time multiplier applies to the rush charge basis, read from the calendar days between the dropoff_date and the needed_by_date: 150 percent for 7 days or fewer, 125 percent for 8 to 14 days, and 100 percent for 15 days or more or for a ticket with no needed_by_date. A lined-work rush premium applies: 15 percent when the ticket carries two or more lined surcharge charges, 10 percent when it carries exactly one, and none when it carries no lined surcharge charge. A cardmember rush discount applies: 10 percent for a customer holding an active Marlowe & Finch Store Card Elite or Marlowe & Finch World Elite Mastercard account, 5 percent for a customer holding active Marlowe & Finch card accounts none of which is one of those two, and none for a customer with no active Marlowe & Finch card account. A new-purchase rush discount applies: 10 percent when the ticket names the customer's own Marlowe & Finch purchase record at regular price whose completed_date is 30 or fewer calendar days before the dropoff_date; 5 percent when the ticket names any other Marlowe & Finch purchase record of the customer (a price type other than regular, or completed more than 30 days before the dropoff_date, or not yet completed); none when the ticket names no Marlowe & Finch purchase record. An occasion rush discount applies to a customer with an active gift registry whose event_date is the ticket's needed_by_date: 10 percent when such a registry is a Wedding Registry, 5 percent when such registries exist and none is a Wedding Registry; a customer with no such registry, or a ticket with no needed_by_date, has no occasion rush discount. The rush fee is the rush charge basis times the lead-time multiplier percent, times one hundred plus the lined-work premium less the cardmember, new-purchase and occasion discounts, divided by one hundred; it is rounded half up to the cent once, on that final figure. For a rush fee this policy books, and only for such a rush fee, the rush charge basis, multiplier, premium and discounts set out here replace the flat rush_fee_pct of the operation charges; the fee is still booked once per ticket and rounded half up to the cent, and every other charge on the ticket remains under the base pricing rule."
  prerequisite: []
  cross_category:
  - category: card
    as: branch
    reads:
    - status
    - variant_name
    note: "The active card held decides the cardmember rush discount tier."
  - category: order
    as: branch
    reads:
    - price_type
    - completed_date
    note: "The garment's purchase record decides the new-purchase rush discount tier."
  - category: registry
    as: branch
    reads:
    - status
    - variant_name
    - event_date
    note: "An active registry whose event date is the needed-by date decides the occasion discount tier."
  compute:
  - op_charges: "SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation')"
  - lined_charges: "SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='lined_surcharge')"
  - operation_base: op_charges + lined_charges
  - op_rows: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='operation')"
  - rush_basis: "op_rows * K('per_operation_rush') if op_rows >= K('per_operation_from') else (K('flat_rush') if (op_rows < K('per_operation_from') and operation_base < K('flat_rush_below')) else operation_base * P('rush_fee_pct') / 100)"
  - lead_days: "DAYS(F('dropoff_date'), F('needed_by_date')) if F('needed_by_date') else 9999"
  - lead_mult: "K('express_mult') if lead_days <= K('express_lead_days') else (K('short_mult') if lead_days <= K('short_lead_days') else K('standard_mult'))"
  - lined_rows: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='lined_surcharge')"
  - lining_premium: "K('lining_premium_multi') if lined_rows >= 2 else (K('lining_premium_single') if lined_rows == 1 else 0)"
  - elite_card: "EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite') or EXISTS('card', status='active', variant_name='Marlowe & Finch World Elite Mastercard')"
  - card_discount: "K('elite_card_disc') if elite_card else (K('other_card_disc') if EXISTS('card', status='active') else 0)"
  - purchase_type: "CFIELD('order', 'price_type', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - purchase_done: "CFIELD('order', 'completed_date', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - purchase_age_days: "DAYS(purchase_done, F('dropoff_date')) if purchase_done else 9999"
  - purchase_discount: "K('new_purchase_disc') if (purchase_type == 'regular' and purchase_age_days <= K('new_purchase_days')) else (K('linked_purchase_disc') if (purchase_type != None and (purchase_type != 'regular' or purchase_age_days > K('new_purchase_days'))) else 0)"
  - occasion_wedding: "EXISTS('registry', status='active', variant_name='Wedding Registry', event_date=F('needed_by_date')) if F('needed_by_date') else False"
  - occasion_discount: "K('wedding_occasion_disc') if occasion_wedding else (K('other_occasion_disc') if (F('needed_by_date') and EXISTS('registry', status='active', event_date=F('needed_by_date'))) else 0)"
  - adjustment_pct: "100 + lining_premium - card_discount - purchase_discount - occasion_discount"
  - rush_ticket: F('rush_service') == True
  - result: "RND(rush_basis * lead_mult / 100 * adjustment_pct / 100 + K('half_up_offset'), 2) if rush_ticket else 0"
  compute_basis:
    op_charges: "The rush-fee operation base is the total of every operation charge and every lined surcharge charge booked on the ticket."
    lined_charges: "The rush-fee operation base is the total of every operation charge and every lined surcharge charge booked on the ticket."
    operation_base: "The rush-fee operation base is the total of every operation charge and every lined surcharge charge booked on the ticket."
    op_rows: "The rush charge basis depends on the work on the ticket, and exactly one of three forms applies: a ticket carrying three or more operation charges is charged per operation, the basis being the number of operation charges times 30.00 USD; a ticket carrying one or two operation charges whose rush-fee operation base is under 80.00 USD is charged a flat rush basis of 25.00 USD; a ticket carrying one or two operation charges whose rush-fee operation base is 80.00 USD or more is charged the class's rush_fee_pct of the rush-fee operation base."
    rush_basis: "The rush charge basis depends on the work on the ticket, and exactly one of three forms applies: a ticket carrying three or more operation charges is charged per operation, the basis being the number of operation charges times 30.00 USD; a ticket carrying one or two operation charges whose rush-fee operation base is under 80.00 USD is charged a flat rush basis of 25.00 USD; a ticket carrying one or two operation charges whose rush-fee operation base is 80.00 USD or more is charged the class's rush_fee_pct of the rush-fee operation base."
    lead_days: "A lead-time multiplier applies to the rush charge basis, read from the calendar days between the dropoff_date and the needed_by_date: 150 percent for 7 days or fewer, 125 percent for 8 to 14 days, and 100 percent for 15 days or more or for a ticket with no needed_by_date."
    lead_mult: "A lead-time multiplier applies to the rush charge basis, read from the calendar days between the dropoff_date and the needed_by_date: 150 percent for 7 days or fewer, 125 percent for 8 to 14 days, and 100 percent for 15 days or more or for a ticket with no needed_by_date."
    lined_rows: "A lined-work rush premium applies: 15 percent when the ticket carries two or more lined surcharge charges, 10 percent when it carries exactly one, and none when it carries no lined surcharge charge."
    lining_premium: "A lined-work rush premium applies: 15 percent when the ticket carries two or more lined surcharge charges, 10 percent when it carries exactly one, and none when it carries no lined surcharge charge."
    elite_card: "A cardmember rush discount applies: 10 percent for a customer holding an active Marlowe & Finch Store Card Elite or Marlowe & Finch World Elite Mastercard account, 5 percent for a customer holding active Marlowe & Finch card accounts none of which is one of those two, and none for a customer with no active Marlowe & Finch card account."
    card_discount: "A cardmember rush discount applies: 10 percent for a customer holding an active Marlowe & Finch Store Card Elite or Marlowe & Finch World Elite Mastercard account, 5 percent for a customer holding active Marlowe & Finch card accounts none of which is one of those two, and none for a customer with no active Marlowe & Finch card account."
    purchase_type: "A new-purchase rush discount applies: 10 percent when the ticket names the customer's own Marlowe & Finch purchase record at regular price whose completed_date is 30 or fewer calendar days before the dropoff_date; 5 percent when the ticket names any other Marlowe & Finch purchase record of the customer (a price type other than regular, or completed more than 30 days before the dropoff_date, or not yet completed); none when the ticket names no Marlowe & Finch purchase record."
    purchase_done: "A new-purchase rush discount applies: 10 percent when the ticket names the customer's own Marlowe & Finch purchase record at regular price whose completed_date is 30 or fewer calendar days before the dropoff_date; 5 percent when the ticket names any other Marlowe & Finch purchase record of the customer (a price type other than regular, or completed more than 30 days before the dropoff_date, or not yet completed); none when the ticket names no Marlowe & Finch purchase record."
    purchase_age_days: "A new-purchase rush discount applies: 10 percent when the ticket names the customer's own Marlowe & Finch purchase record at regular price whose completed_date is 30 or fewer calendar days before the dropoff_date; 5 percent when the ticket names any other Marlowe & Finch purchase record of the customer (a price type other than regular, or completed more than 30 days before the dropoff_date, or not yet completed); none when the ticket names no Marlowe & Finch purchase record."
    purchase_discount: "A new-purchase rush discount applies: 10 percent when the ticket names the customer's own Marlowe & Finch purchase record at regular price whose completed_date is 30 or fewer calendar days before the dropoff_date; 5 percent when the ticket names any other Marlowe & Finch purchase record of the customer (a price type other than regular, or completed more than 30 days before the dropoff_date, or not yet completed); none when the ticket names no Marlowe & Finch purchase record."
    occasion_wedding: "An occasion rush discount applies to a customer with an active gift registry whose event_date is the ticket's needed_by_date: 10 percent when such a registry is a Wedding Registry, 5 percent when such registries exist and none is a Wedding Registry; a customer with no such registry, or a ticket with no needed_by_date, has no occasion rush discount."
    occasion_discount: "An occasion rush discount applies to a customer with an active gift registry whose event_date is the ticket's needed_by_date: 10 percent when such a registry is a Wedding Registry, 5 percent when such registries exist and none is a Wedding Registry; a customer with no such registry, or a ticket with no needed_by_date, has no occasion rush discount."
    adjustment_pct: "The rush fee is the rush charge basis times the lead-time multiplier percent, times one hundred plus the lined-work premium less the cardmember, new-purchase and occasion discounts, divided by one hundred; it is rounded half up to the cent once, on that final figure."
    rush_ticket: "A ticket accepted with rush service owes one rush fee, booked once per ticket."
    result: "The rush fee is the rush charge basis times the lead-time multiplier percent, times one hundred plus the lined-work premium less the cardmember, new-purchase and occasion discounts, divided by one hundred; it is rounded half up to the cent once, on that final figure."
  factors:
  - id: rush_charge_basis_form
    effect: method
    decides: rush_basis
    bindings:
    - op_rows
    - rush_basis
    ladder:
    - when: three or more operation charges on the ticket
      method: 'per operation: number of operation charges times 30.00 USD'
    - when: "one or two operation charges and a rush-fee operation base under 80.00 USD"
      method: flat rush basis of 25.00 USD
    - when: "otherwise (one or two operation charges and a base of 80.00 USD or more)"
      method: rush_fee_pct of the rush-fee operation base
    baseline:
      rush_basis: operation_base * P('rush_fee_pct') / 100
    evidence:
    - history
    cross_difficulty: null
  - id: rush_lead_time_multiplier
    effect: parameter
    decides: lead_mult
    bindings:
    - lead_days
    - lead_mult
    ladder:
    - when: 7 days or fewer from drop-off to needed-by
      value: K('express_mult') = 150 percent
    - when: 8 to 14 days from drop-off to needed-by
      value: K('short_mult') = 125 percent
    - when: otherwise (15 days or more, or no needed-by date)
      value: K('standard_mult') = 100 percent
    baseline:
      lead_mult: K('standard_mult')
    evidence:
    - date
    cross_difficulty: null
  - id: lined_work_rush_premium
    effect: parameter
    decides: lining_premium
    bindings:
    - lined_rows
    - lining_premium
    ladder:
    - when: two or more lined surcharge charges
      value: K('lining_premium_multi') = 15 percent
    - when: exactly one lined surcharge charge
      value: K('lining_premium_single') = 10 percent
    - when: otherwise (no lined surcharge charge)
      value: '0'
    baseline:
      lining_premium: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: cardmember_rush_discount
    effect: parameter
    decides: card_discount
    bindings:
    - elite_card
    - card_discount
    ladder:
    - when: active Store Card Elite or World Elite Mastercard
      value: K('elite_card_disc') = 10 percent
    - when: "active Marlowe & Finch card accounts, none an Elite or World Elite"
      value: K('other_card_disc') = 5 percent
    - when: otherwise (no active Marlowe & Finch card)
      value: '0'
    baseline:
      card_discount: '0'
    evidence:
    - cross_category
    cross_difficulty: card
  - id: new_purchase_rush_discount
    effect: parameter
    decides: purchase_discount
    bindings:
    - purchase_type
    - purchase_done
    - purchase_age_days
    - purchase_discount
    ladder:
    - when: "own regular-price purchase completed 30 or fewer days before drop-off"
      value: K('new_purchase_disc') = 10 percent
    - when: any other own Marlowe & Finch purchase record
      value: K('linked_purchase_disc') = 5 percent
    - when: otherwise (no Marlowe & Finch purchase record)
      value: '0'
    baseline:
      purchase_discount: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: order
  - id: registry_occasion_discount
    effect: parameter
    decides: occasion_discount
    bindings:
    - occasion_wedding
    - occasion_discount
    ladder:
    - when: "an active Wedding Registry with its event date on the needed-by date"
      value: K('wedding_occasion_disc') = 10 percent
    - when: "active registries with their event date on the needed-by date, none a Wedding Registry"
      value: K('other_occasion_disc') = 5 percent
    - when: otherwise
      value: '0'
    baseline:
      occasion_discount: '0'
    evidence:
    - cross_category
    cross_difficulty: registry
  baseline:
    rule: "A ticket accepted with rush service owes one rush fee, booked once per ticket. The rush-fee operation base is the total of every operation charge and every lined surcharge charge booked on the ticket. Under the standard method the rush fee is the class's rush_fee_pct of the rush-fee operation base, with no lead-time multiplier, premium or discount, rounded half up to the cent."
    params:
    - rush_fee_pct
  inputs:
    history:
    - table: alteration_charges
      aggregate: sum
      field: amount
      filters:
        event_type: alteration_charge
        charge_type: operation
    - table: alteration_charges
      aggregate: count
      field: alteration_charge_id
      filters:
        event_type: alteration_charge
        charge_type: lined_surcharge
    cross_category:
    - card
    - order
    - registry
- id: alteration_ext_rush_fee_waiver
  base_policy_refs:
  - alteration_agg_complimentary_per_purchase
  - alteration_complimentary_basic
  - alteration_rush_service
  - alteration_cancellation_rules
  - alteration_remake_rules
  overwrite:
  - base_policy: alteration_rush_service
    superseded_clause: "A Finch Circle member whose tier held on the ticket's dropoff_date has alteration_rush_fee_waived true has the rush fee waived (waiver_reason loyalty_rush_waiver) when the class's loyalty_rush_waiver_applies is true."
    replaced_by: "For a rush fee waiver this policy books, and only for such a waiver, the member's tier is the tier the membership holds when the waiver is booked, a member whose tier carries alteration_rush_fee_waived true keeps the whole waiver where the class's loyalty_rush_waiver_applies is true, and the co-pay and per-operation forms set out here extend the waiver to Gold and Platinum members; the waiver of a rush fee whose promised date the shop misses remains under the base rush service rule."
  trigger: state_due
  subject:
  - alteration_charge_waiver
  computes: amount
  target_tool: waive_rush_fee_f377d7ac
  params:
    gold_threshold: 1200.0
    platinum_threshold: 2500.0
    diamond_threshold: 5000.0
    per_op_waiver: 8.0
    platinum_copay: 30.0
    gold_regular_copay: 40.0
    gold_copay: 45.0
    tenure_long_months: 120
    tenure_mid_months: 60
    tenure_long_pct: 10
    tenure_mid_pct: 5
    points_high: 3000
    points_mid: 1500
    points_high_pct: 10
    points_mid_pct: 5
    half_up_offset: 1.0e-06
  rule: "A Finch Circle rush fee waiver is booked against the rush fee standing on a ticket, and none is owed in a class whose loyalty_rush_waiver_applies is not true. Under the standard method an active Finch Circle member whose tier carries alteration_rush_fee_waived true has the whole rush fee standing on the ticket waived and anyone else has nothing waived. A rush fee waiver is booked only after the ticket carries the rush fee it waives. The waiver form is set by the member and the ticket, and exactly one of three forms applies: an active Finch Circle Gold or Platinum member whose ticket names the member's own Marlowe & Finch purchase record takes the co-pay form; an active Finch Circle Gold or Platinum member whose ticket names no purchase record of the member takes the per-operation form; any other customer is treated under the standard method. The member rush co-pay is 30.00 USD for an active Finch Circle Platinum member, 40.00 USD for an active Finch Circle Gold member whose ticket names the member's own purchase record at regular price, 45.00 USD for any other active Finch Circle Gold member, and the whole rush fee standing for anyone else, so that nothing is waived for them. A tenure relief raises a co-pay waiver: by 10 percent of the amount the co-pay form waives for a membership enrolled 120 or more whole months before today, by 5 percent for one enrolled 60 to 119 whole months before today, and not at all for a shorter membership. A points relief raises a co-pay waiver from the Finch Circle points earned in earn entries dated less than 12 whole months before today: by 10 percent of the amount the co-pay form waives for 3000 points or more, by 5 percent for 1500 to 2999 points, and not at all below 1500 points. The rush fee waiver is assembled from its form: under the co-pay form it is the rush fee standing less the member rush co-pay, never below zero, raised by the tenure and points reliefs added together; under the per-operation form it is 8.00 USD for each operation charge on the ticket; under the standard method it is the whole rush fee standing for an active member whose tier carries alteration_rush_fee_waived true and nothing for anyone else; the waiver is never more than the rush fee standing and is rounded half up to the cent once, on that final figure. For a rush fee waiver this policy books, and only for such a waiver, the member's tier is the tier the membership holds when the waiver is booked, a member whose tier carries alteration_rush_fee_waived true keeps the whole waiver where the class's loyalty_rush_waiver_applies is true, and the co-pay and per-operation forms set out here extend the waiver to Gold and Platinum members; the waiver of a rush fee whose promised date the shop misses remains under the base rush service rule."
  prerequisite:
  - problem: alteration_ext_rush_fee
    kind: value_input
    gate: rush_standing
    form: state
    policy_source: "A rush fee waiver is booked only after the ticket carries the rush fee it waives."
    condition: "The ticket's charges include a rush_fee charge row (alteration_charges with event_type alteration_charge and charge_type rush_fee)."
    resolved_by: book_rush_fee_44a954b1
    effect: "Once the rush fee charge stands, the rush fee standing that the waiver form acts on rises from 0.00 to the booked rush fee."
  cross_category:
  - category: loyalty
    as: history
    reads:
    - status
    - variant_name
    - enrolled_date
    - loyalty_points_ledger.points
    note: "The tier held decides the waiver form and the co-pay; the enrolment date and the points earned over 12 months decide the two reliefs."
  - category: order
    as: existence
    reads:
    - purchase_id
    note: "Whether the ticket names the member's own purchase record decides between the co-pay and share forms."
  compute:
  - rush_standing: "SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='rush_fee')"
  - class_applies: P('loyalty_rush_waiver_applies')
  - member_flag: "CPARAM('loyalty', 'alteration_rush_fee_waived', status='active')"
  - member_threshold: "(CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0)"
  - own_purchase: "CFIELD('order', 'purchase_id', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - own_price_type: "CFIELD('order', 'price_type', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - member_copay: "K('platinum_copay') if (member_threshold >= K('platinum_threshold') and member_threshold < K('diamond_threshold')) else (K('gold_regular_copay') if (member_threshold >= K('gold_threshold') and member_threshold < K('platinum_threshold') and own_price_type == 'regular') else (K('gold_copay') if (member_threshold >= K('gold_threshold') and member_threshold < K('platinum_threshold')) else rush_standing))"
  - enrolled: CFIELD('loyalty', 'enrolled_date', status='active')
  - tenure_relief_pct: "K('tenure_long_pct') if (enrolled and MONTHS(enrolled, NOW) >= K('tenure_long_months')) else (K('tenure_mid_pct') if (enrolled and MONTHS(enrolled, NOW) >= K('tenure_mid_months')) else 0)"
  - points_earned: "XSUM('loyalty', 'loyalty_points_ledger', 'points', within_months=12, date_field='entry_date', event_type='loyalty_points_earn')"
  - points_relief_pct: "K('points_high_pct') if points_earned >= K('points_high') else (K('points_mid_pct') if points_earned >= K('points_mid') else 0)"
  - waiver_form: "'co_pay' if ((member_flag != True and member_threshold >= K('gold_threshold') and member_threshold < K('diamond_threshold')) and own_purchase != None) else ('per_operation' if ((member_flag != True and member_threshold >= K('gold_threshold') and member_threshold < K('diamond_threshold')) and own_purchase == None) else 'standard')"
  - op_rows: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='operation')"
  - result: "RND(MN(rush_standing, MX(0, rush_standing - member_copay) * (100 + tenure_relief_pct + points_relief_pct) / 100 if waiver_form == 'co_pay' else (MN(rush_standing, K('per_op_waiver') * op_rows) if waiver_form == 'per_operation' else (rush_standing if member_flag == True else 0))) + K('half_up_offset'), 2) if class_applies == True else 0"
  compute_basis:
    rush_standing: "A rush fee waiver is booked only after the ticket carries the rush fee it waives."
    class_applies: "A Finch Circle rush fee waiver is booked against the rush fee standing on a ticket, and none is owed in a class whose loyalty_rush_waiver_applies is not true."
    member_flag: "The rush fee waiver is assembled from its form: under the co-pay form it is the rush fee standing less the member rush co-pay, never below zero, raised by the tenure and points reliefs added together; under the per-operation form it is 8.00 USD for each operation charge on the ticket; under the standard method it is the whole rush fee standing for an active member whose tier carries alteration_rush_fee_waived true and nothing for anyone else; the waiver is never more than the rush fee standing and is rounded half up to the cent once, on that final figure."
    member_threshold: "The waiver form is set by the member and the ticket, and exactly one of three forms applies: an active Finch Circle Gold or Platinum member whose ticket names the member's own Marlowe & Finch purchase record takes the co-pay form; an active Finch Circle Gold or Platinum member whose ticket names no purchase record of the member takes the per-operation form; any other customer is treated under the standard method."
    own_purchase: "The waiver form is set by the member and the ticket, and exactly one of three forms applies: an active Finch Circle Gold or Platinum member whose ticket names the member's own Marlowe & Finch purchase record takes the co-pay form; an active Finch Circle Gold or Platinum member whose ticket names no purchase record of the member takes the per-operation form; any other customer is treated under the standard method."
    waiver_form: "The waiver form is set by the member and the ticket, and exactly one of three forms applies: an active Finch Circle Gold or Platinum member whose ticket names the member's own Marlowe & Finch purchase record takes the co-pay form; an active Finch Circle Gold or Platinum member whose ticket names no purchase record of the member takes the per-operation form; any other customer is treated under the standard method."
    op_rows: "The rush fee waiver is assembled from its form: under the co-pay form it is the rush fee standing less the member rush co-pay, never below zero, raised by the tenure and points reliefs added together; under the per-operation form it is 8.00 USD for each operation charge on the ticket; under the standard method it is the whole rush fee standing for an active member whose tier carries alteration_rush_fee_waived true and nothing for anyone else; the waiver is never more than the rush fee standing and is rounded half up to the cent once, on that final figure."
    own_price_type: "The member rush co-pay is 30.00 USD for an active Finch Circle Platinum member, 40.00 USD for an active Finch Circle Gold member whose ticket names the member's own purchase record at regular price, 45.00 USD for any other active Finch Circle Gold member, and the whole rush fee standing for anyone else, so that nothing is waived for them."
    member_copay: "The member rush co-pay is 30.00 USD for an active Finch Circle Platinum member, 40.00 USD for an active Finch Circle Gold member whose ticket names the member's own purchase record at regular price, 45.00 USD for any other active Finch Circle Gold member, and the whole rush fee standing for anyone else, so that nothing is waived for them."
    enrolled: "A tenure relief raises a co-pay waiver: by 10 percent of the amount the co-pay form waives for a membership enrolled 120 or more whole months before today, by 5 percent for one enrolled 60 to 119 whole months before today, and not at all for a shorter membership."
    tenure_relief_pct: "A tenure relief raises a co-pay waiver: by 10 percent of the amount the co-pay form waives for a membership enrolled 120 or more whole months before today, by 5 percent for one enrolled 60 to 119 whole months before today, and not at all for a shorter membership."
    points_earned: "A points relief raises a co-pay waiver from the Finch Circle points earned in earn entries dated less than 12 whole months before today: by 10 percent of the amount the co-pay form waives for 3000 points or more, by 5 percent for 1500 to 2999 points, and not at all below 1500 points."
    points_relief_pct: "A points relief raises a co-pay waiver from the Finch Circle points earned in earn entries dated less than 12 whole months before today: by 10 percent of the amount the co-pay form waives for 3000 points or more, by 5 percent for 1500 to 2999 points, and not at all below 1500 points."
    result: "The rush fee waiver is assembled from its form: under the co-pay form it is the rush fee standing less the member rush co-pay, never below zero, raised by the tenure and points reliefs added together; under the per-operation form it is 8.00 USD for each operation charge on the ticket; under the standard method it is the whole rush fee standing for an active member whose tier carries alteration_rush_fee_waived true and nothing for anyone else; the waiver is never more than the rush fee standing and is rounded half up to the cent once, on that final figure."
  factors:
  - id: member_waiver_form
    effect: method
    decides: waiver_form
    bindings:
    - own_purchase
    - waiver_form
    ladder:
    - when: "active Gold or Platinum member and the ticket names the member's own purchase record"
      method: waive the rush fee standing less the member rush co-pay
    - when: "active Gold or Platinum member and the ticket names no purchase record of the member"
