- id: alteration_ext_quote_overrun
  base_policy_refs:
  - alteration_agg_complimentary_per_purchase
  - alteration_complimentary_basic
  - alteration_rush_service
  - alteration_cancellation_rules
  - alteration_remake_rules
  - alteration_pricing
  overwrite:
  - base_policy: alteration_pricing
    superseded_clause: "when the final operation charges exceed the quoted_total by more than quote_overrun_tolerance_pct without such approval, the excess is waived with waiver_reason quote_overrun."
    replaced_by: "For a quote overrun waiver this policy books, and only for such a waiver, the waiver is the overrun charges less the honored amount set out here, booked with waiver_reason quote_overrun, in place of the excess over quote_overrun_tolerance_pct of the quoted_total; operations beyond the quote are still added only after the customer approves them, and every other charge remains under the base pricing rule."
  trigger: state_due
  subject:
  - alteration_charge_waiver
  computes: amount
  target_tool: waive_quote_overrun_938dcea5
  params:
    per_op_from: 2
    per_op_tolerance: 5.0
    platinum_threshold: 2500.0
    both_pct: 5
    either_pct: 8
    two_fitting_allow: 10.0
    one_fitting_allow: 5.0
    regular_credit: 3.0
    other_credit: 1.0
    tenure_long_months: 120
    tenure_mid_months: 60
    tenure_long_credit: 2.0
    tenure_mid_credit: 1.0
    half_up_offset: 1.0e-06
  rule: "Work the customer approves is added to the ticket's quoted_total, so the overrun charges that run past the honored amount are unapproved work and are waived as a quote overrun. The overrun charges compared with the quote are every operation charge and every lined surcharge charge booked on the ticket. Under the standard method the honored amount is the quoted_total plus the class's quote_overrun_tolerance_pct of the quoted_total, and the quote overrun waiver is the overrun charges less the honored amount, rounded half up to the cent, never below zero. The quote overrun waiver is worked out only after every operation added to a lined garment's ticket after its drop-off carries its lined surcharge, in a class that charges one. The tolerance form is set by the operations booked on the ticket after its dropoff_date, and exactly one of three forms applies: two or more such operations take the per-operation form; exactly one such operation, on the ticket of an active member at Finch Circle Platinum or above, takes the excess form; any other ticket (one such operation for a customer below Finch Circle Platinum, or none) takes the quote form. The quote tolerance percentage is 5 percent for an active member at Finch Circle Platinum or above who also holds an active Marlowe & Finch card account, 8 percent for a customer who is either such a member or such a cardholder but not both, and the class's quote_overrun_tolerance_pct for anyone else. A fitting allowance is added to the honored amount for adjustments agreed at extra fittings: 10.00 USD when the ticket carries two or more extra fitting fee charges, 5.00 USD when it carries one, and none when it carries none. A purchase credit is taken off the honored amount when the ticket names the customer's own Marlowe & Finch purchase record: 3.00 USD for a purchase at regular price, 1.00 USD for any other price type, and none when it names no such record. A membership tenure credit is taken off the honored amount: 2.00 USD for an active Finch Circle membership enrolled 120 or more whole months before today, 1.00 USD for one enrolled 60 to 119 whole months before today, and none otherwise. The quote tolerance is assembled from its form: under the per-operation form it is a flat 5.00 USD for each operation booked after the dropoff_date; under the excess form it is the quote tolerance percentage of the overrun charges above the quoted_total; under the quote form it is the quote tolerance percentage of the quoted_total. The honored amount is the quoted_total plus that quote tolerance plus the fitting allowance, less the purchase and tenure credits, and never less than the quoted_total, so the waiver never reaches approved work; the quote overrun waiver is the overrun charges less the honored amount, rounded half up to the cent once at the end, and nothing when that is not above zero. For a quote overrun waiver this policy books, and only for such a waiver, the waiver is the overrun charges less the honored amount set out here, booked with waiver_reason quote_overrun, in place of the excess over quote_overrun_tolerance_pct of the quoted_total; operations beyond the quote are still added only after the customer approves them, and every other charge remains under the base pricing rule."
  prerequisite:
  - problem: alteration_ext_added_work_lining
    kind: value_input
    gate: overrun_charges
    form: state
    policy_source: "The quote overrun waiver is worked out only after every operation added to a lined garment's ticket after its drop-off carries its lined surcharge, in a class that charges one."
    condition: "In a class whose lined_garment_surcharge_pct is above 0, every operation charge booked after the dropoff_date on a lined garment's ticket has a lined_surcharge charge row for its operation_code."
    resolved_by: book_lined_surcharge_bf0414f9
    effect: "Once the added operation's lined surcharge stands, the overrun charges compared with the quote rise by that surcharge, so the quote overrun waiver rises with them."
  cross_category:
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    - enrolled_date
    note: "The tier held decides the quote tolerance tier; the enrolment date decides the tenure credit."
  - category: card
    as: branch
    reads:
    - status
    note: Holding an active card decides the quote tolerance tier.
  - category: order
    as: branch
    reads:
    - purchase_id
    - price_type
    note: "The ticket's own purchase record and its price type decide the purchase credit."
  compute:
  - op_charges: "SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='operation')"
  - lined_charges: "SUM('alteration_charges', 'amount', event_type='alteration_charge', charge_type='lined_surcharge')"
  - overrun_charges: op_charges + lined_charges
  - quoted: F('quoted_total')
  - added_ops: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='operation') - COUNT('alteration_charges', event_type='alteration_charge', charge_type='operation', charge_date=F('dropoff_date'))"
  - member_threshold: "(CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0)"
  - active_card: EXISTS('card', status='active')
  - tolerance_pct: "K('both_pct') if (member_threshold >= K('platinum_threshold') and active_card) else (K('either_pct') if ((member_threshold >= K('platinum_threshold') and not active_card) or (member_threshold < K('platinum_threshold') and active_card)) else P('quote_overrun_tolerance_pct'))"
  - tolerance_form: "'per_operation' if added_ops >= K('per_op_from') else ('excess' if (added_ops == 1 and (CPARAM('loyalty', 'qualifying_spend_threshold_usd', status='active') or 0) >= K('platinum_threshold')) else 'quote')"
  - tolerance_amount: "K('per_op_tolerance') * added_ops if tolerance_form == 'per_operation' else (tolerance_pct / 100 * MX(0, overrun_charges - quoted) if tolerance_form == 'excess' else tolerance_pct / 100 * quoted)"
  - extra_fittings: "COUNT('alteration_charges', event_type='alteration_charge', charge_type='extra_fitting_fee')"
  - fitting_allowance: "K('two_fitting_allow') if extra_fittings >= 2 else (K('one_fitting_allow') if extra_fittings == 1 else 0)"
  - purchase_type: "CFIELD('order', 'price_type', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - purchase_credit: "K('regular_credit') if purchase_type == 'regular' else (K('other_credit') if purchase_type != None else 0)"
  - enrolled: CFIELD('loyalty', 'enrolled_date', status='active')
  - tenure_credit: "K('tenure_long_credit') if (enrolled and MONTHS(enrolled, NOW) >= K('tenure_long_months')) else (K('tenure_mid_credit') if (enrolled and MONTHS(enrolled, NOW) >= K('tenure_mid_months')) else 0)"
  - honored_amount: "MX(quoted, quoted + tolerance_amount + fitting_allowance - purchase_credit - tenure_credit)"
  - result: "RND(MX(0, overrun_charges - honored_amount) + K('half_up_offset'), 2) if overrun_charges > honored_amount else 0"
  compute_basis:
    op_charges: "The overrun charges compared with the quote are every operation charge and every lined surcharge charge booked on the ticket."
    lined_charges: "The overrun charges compared with the quote are every operation charge and every lined surcharge charge booked on the ticket."
    overrun_charges: "The overrun charges compared with the quote are every operation charge and every lined surcharge charge booked on the ticket."
    quoted: "Work the customer approves is added to the ticket's quoted_total, so the overrun charges that run past the honored amount are unapproved work and are waived as a quote overrun."
    added_ops: "The tolerance form is set by the operations booked on the ticket after its dropoff_date, and exactly one of three forms applies: two or more such operations take the per-operation form; exactly one such operation, on the ticket of an active member at Finch Circle Platinum or above, takes the excess form; any other ticket (one such operation for a customer below Finch Circle Platinum, or none) takes the quote form."
