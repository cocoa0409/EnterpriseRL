    - recent_disc
    ladder:
    - when: "purchase completed 120 or fewer days before the operation was booked"
      value: K('recent_disc') = 10 percent
    - when: "purchase completed more than 120 days before the operation was booked"
      value: K('older_disc') = 5 percent
    - when: otherwise (no completed purchase record named)
      value: '0'
    baseline:
