    replaced_by: "For a complimentary waiver this policy books, and only for such a waiver, the allowance is counted on the ticket, one complimentary waiver per ticket for its highest-priced qualifying operation, in place of the count of complimentary operations across every ticket naming the same purchase; any further qualifying operation on that ticket stays chargeable, and every other complimentary waiver remains under the base allowance rule."
