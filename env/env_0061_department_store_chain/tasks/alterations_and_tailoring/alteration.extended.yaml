  - p_done: "CFIELD('order', 'completed_date', purchase_id=F('purchase_id')) if F('purchase_id') else None"
  - window_days: "P('complimentary_purchase_window_days') + tier_extension + card_extension if class_eligible == True else 0"
  - in_window: "DAYS(p_done, F('dropoff_date')) <= window_days if (p_done and class_eligible == True) else False"
  - result: "RND((qualifying_top if complimentary_form == 'whole_charge' else (MN(qualifying_top, sale_allowance + premium_addition) if (complimentary_form == 'allowance' and sale_allowance > 0) else 0)) + K('half_up_offset'), 2) if (in_window and first_on_ticket and p_type != None) else 0"
  compute_basis:
    qualifying_top: "Complimentary basic work is waived on a ticket in a class whose complimentary_basic_eligible is true and that names the customer's own Marlowe & Finch purchase record; the qualifying operations are hem_plain, hem_cuffed, hem_blind_stitch, sleeve_shorten_plain, waist_take_in, trouser_hem_cuffed and jacket_sleeve_shorten, and one complimentary waiver is booked per ticket, for the highest-priced qualifying operation charge of a ticket on which no complimentary waiver stands yet."
