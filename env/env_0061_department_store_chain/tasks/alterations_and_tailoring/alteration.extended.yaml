    tolerance_amount: "The quote tolerance is assembled from its form: under the per-operation form it is a flat 5.00 USD for each operation booked after the dropoff_date; under the excess form it is the quote tolerance percentage of the overrun charges above the quoted_total; under the quote form it is the quote tolerance percentage of the quoted_total. The honored amount is the quoted_total plus that quote tolerance plus the fitting allowance, less the purchase and tenure credits, and never less than the quoted_total, so the waiver never reaches approved work; the quote overrun waiver is the overrun charges less the honored amount, rounded half up to the cent once at the end, and nothing when that is not above zero."
    extra_fittings: "A fitting allowance is added to the honored amount for adjustments agreed at extra fittings: 10.00 USD when the ticket carries two or more extra fitting fee charges, 5.00 USD when it carries one, and none when it carries none."
    fitting_allowance: "A fitting allowance is added to the honored amount for adjustments agreed at extra fittings: 10.00 USD when the ticket carries two or more extra fitting fee charges, 5.00 USD when it carries one, and none when it carries none."
    purchase_type: "A purchase credit is taken off the honored amount when the ticket names the customer's own Marlowe & Finch purchase record: 3.00 USD for a purchase at regular price, 1.00 USD for any other price type, and none when it names no such record."
    purchase_credit: "A purchase credit is taken off the honored amount when the ticket names the customer's own Marlowe & Finch purchase record: 3.00 USD for a purchase at regular price, 1.00 USD for any other price type, and none when it names no such record."
    enrolled: "A membership tenure credit is taken off the honored amount: 2.00 USD for an active Finch Circle membership enrolled 120 or more whole months before today, 1.00 USD for one enrolled 60 to 119 whole months before today, and none otherwise."
    tenure_credit: "A membership tenure credit is taken off the honored amount: 2.00 USD for an active Finch Circle membership enrolled 120 or more whole months before today, 1.00 USD for one enrolled 60 to 119 whole months before today, and none otherwise."
    honored_amount: "The quote tolerance is assembled from its form: under the per-operation form it is a flat 5.00 USD for each operation booked after the dropoff_date; under the excess form it is the quote tolerance percentage of the overrun charges above the quoted_total; under the quote form it is the quote tolerance percentage of the quoted_total. The honored amount is the quoted_total plus that quote tolerance plus the fitting allowance, less the purchase and tenure credits, and never less than the quoted_total, so the waiver never reaches approved work; the quote overrun waiver is the overrun charges less the honored amount, rounded half up to the cent once at the end, and nothing when that is not above zero."
    result: "The quote tolerance is assembled from its form: under the per-operation form it is a flat 5.00 USD for each operation booked after the dropoff_date; under the excess form it is the quote tolerance percentage of the overrun charges above the quoted_total; under the quote form it is the quote tolerance percentage of the quoted_total. The honored amount is the quoted_total plus that quote tolerance plus the fitting allowance, less the purchase and tenure credits, and never less than the quoted_total, so the waiver never reaches approved work; the quote overrun waiver is the overrun charges less the honored amount, rounded half up to the cent once at the end, and nothing when that is not above zero."
  factors:
  - id: quote_tolerance_form
    effect: method
    decides: tolerance_form
    bindings:
    - added_ops
    - tolerance_form
    ladder:
    - when: two or more operations booked after the dropoff_date
      method: a flat 5.00 USD tolerance for each of those operations
    - when: "exactly one operation booked after the dropoff_date and an active member at Finch Circle Platinum or above"
      method: "the quote tolerance percentage of the overrun charges above the quoted_total"
    - when: "otherwise (one operation booked after the dropoff_date for a customer below Platinum, or none)"
      method: the quote tolerance percentage of the quoted_total
    baseline:
