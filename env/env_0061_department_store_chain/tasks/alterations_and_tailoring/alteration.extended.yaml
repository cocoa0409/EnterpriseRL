    ladder:
    - when: active member at Finch Circle Diamond or Icon
      value: K('diamond_window_add') = 60 days
    - when: active Finch Circle Platinum member
      value: K('platinum_window_add') = 30 days
    - when: otherwise
      value: '0'
    baseline:
      tier_extension: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loyalty
  - id: card_charged_window_extension
