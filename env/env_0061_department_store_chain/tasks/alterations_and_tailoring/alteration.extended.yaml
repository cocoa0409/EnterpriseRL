    lined_standing: "The lined-work basis takes exactly one of three forms set by that operation charge and the lining work already on the ticket: an operation charged under 40.00 USD carries a flat lining charge of 5.00 USD; an operation charged 40.00 USD or more on a ticket that already carries two or more lined surcharge charges carries 2.00 USD for each lined operation the lining is reworked around, that is 2.00 USD times one more than the lined surcharge charges already standing; an operation charged 40.00 USD or more on a ticket carrying fewer than two lined surcharge charges carries lined_garment_surcharge_pct of its charge."
    lining_basis: "The lined-work basis takes exactly one of three forms set by that operation charge and the lining work already on the ticket: an operation charged under 40.00 USD carries a flat lining charge of 5.00 USD; an operation charged 40.00 USD or more on a ticket that already carries two or more lined surcharge charges carries 2.00 USD for each lined operation the lining is reworked around, that is 2.00 USD times one more than the lined surcharge charges already standing; an operation charged 40.00 USD or more on a ticket carrying fewer than two lined surcharge charges carries lined_garment_surcharge_pct of its charge."
    own_purchase: "A member lining discount applies when the ticket names the customer's own Marlowe & Finch purchase record: 10 percent for an active member at Finch Circle Platinum or above, 5 percent for an active Finch Circle Silver or Gold member, and none for anyone else or for a ticket that names no such purchase record."
    member_threshold: "A member lining discount applies when the ticket names the customer's own Marlowe & Finch purchase record: 10 percent for an active member at Finch Circle Platinum or above, 5 percent for an active Finch Circle Silver or Gold member, and none for anyone else or for a ticket that names no such purchase record."
    member_disc: "A member lining discount applies when the ticket names the customer's own Marlowe & Finch purchase record: 10 percent for an active member at Finch Circle Platinum or above, 5 percent for an active Finch Circle Silver or Gold member, and none for anyone else or for a ticket that names no such purchase record."
    purchase_done: "A recent-purchase lining discount applies from the calendar days between the completed_date of the purchase record the ticket names and the date the operation was booked: 10 percent for 120 days or fewer, 5 percent for more than 120 days, and none when the ticket names no completed Marlowe & Finch purchase record."
    recent_disc: "A recent-purchase lining discount applies from the calendar days between the completed_date of the purchase record the ticket names and the date the operation was booked: 10 percent for 120 days or fewer, 5 percent for more than 120 days, and none when the ticket names no completed Marlowe & Finch purchase record."
    ticket_ops_total: "A ticket-size lining discount applies from the total of the operation charges booked on the ticket: 10 percent for 100.00 USD or more, 5 percent for 60.00 to 99.99 USD, and none under 60.00 USD."
    size_disc: "A ticket-size lining discount applies from the total of the operation charges booked on the ticket: 10 percent for 100.00 USD or more, 5 percent for 60.00 to 99.99 USD, and none under 60.00 USD."
    surcharge_owed: "In a class whose lined_garment_surcharge_pct is above 0, a lined surcharge is owed for an operation added to a lined garment's ticket after its dropoff_date that does not yet carry one, and the lined surcharge for added work is priced on the most recently booked operation charge on the ticket, the higher one where several share that latest date; a ticket with no operation charge owes none."
    result: "The lined surcharge for added work is the lined-work basis times one hundred less the member, recent-purchase and ticket-size lining discounts, divided by one hundred, rounded half up to the cent once at the end."
  factors:
  - id: lined_work_basis_form
    effect: method
    decides: lining_basis
    bindings:
    - latest_op_amount
    - lined_standing
    - lining_basis
    ladder:
    - when: operation charged under 40.00 USD
      method: flat lining charge of 5.00 USD
    - when: "operation charged 40.00 USD or more and two or more lined surcharge charges already standing"
      method: "2.00 USD times one more than the lined surcharge charges standing"
    - when: "otherwise (40.00 USD or more and fewer than two lined surcharge charges standing)"
      method: lined_garment_surcharge_pct of the whole charge
    baseline:
      lining_basis: "P('lined_garment_surcharge_pct') * latest_op_amount / 100 if latest_op_date else 0"
    evidence:
    - history
    cross_difficulty: null
  - id: member_lining_discount
    effect: parameter
    decides: member_disc
    bindings:
    - own_purchase
    - member_threshold
    - member_disc
    ladder:
    - when: "own purchase record named and active member at Finch Circle Platinum or above"
      value: K('platinum_disc') = 10 percent
    - when: "own purchase record named and active Finch Circle Silver or Gold member"
      value: K('silver_gold_disc') = 5 percent
    - when: otherwise
      value: '0'
    baseline:
      member_disc: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loyalty
  - id: recent_purchase_lining_discount
    effect: parameter
    decides: recent_disc
    bindings:
