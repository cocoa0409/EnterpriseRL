  rule: "Complimentary basic work is waived on a ticket in a class whose complimentary_basic_eligible is true and that names the customer's own Marlowe & Finch purchase record; the qualifying operations are hem_plain, hem_cuffed, hem_blind_stitch, sleeve_shorten_plain, waist_take_in, trouser_hem_cuffed and jacket_sleeve_shorten, and one complimentary waiver is booked per ticket, for the highest-priced qualifying operation charge of a ticket on which no complimentary waiver stands yet. Under the standard method a purchase at regular price has that whole operation charge waived and any other price type has nothing waived, when the drop-off falls in the complimentary window of the class's complimentary_purchase_window_days counted from the purchase's completed_date, and the waiver is rounded half up to the cent. The complimentary window counts calendar days starting the day after the completed_date as day 1, and a drop-off on the last day of the window is in time. The complimentary form is set by the purchase's price type and the membership, and exactly one of three forms applies: a purchase at regular price takes the whole-charge form; a purchase at sale price made by an active member at Finch Circle Gold or above takes the allowance form; any other purchase (clearance, doorbuster, final sale, or a sale price without such a membership) takes the no-waiver form. The member's sale-work allowance is 20.00 USD for an active member at Finch Circle Diamond or Icon, 14.00 USD for an active Finch Circle Platinum member, 8.00 USD for an active Finch Circle Gold member, and nothing for anyone else, so that nothing is waived for them. A premium-garment addition is read from the purchase's regular_price: 6.00 USD for a regular_price of 500.00 USD or more, 3.00 USD for 250.00 to 499.99 USD, and none below 250.00 USD. A Finch Circle window extension is added to the complimentary window: 60 calendar days for an active member at Finch Circle Diamond or Icon, 30 calendar days for an active Finch Circle Platinum member, and none for anyone else. A card window extension is added to the complimentary window: 15 calendar days when the purchase was charged to the customer's Marlowe & Finch card account that is active today, 5 calendar days when the customer holds an active Marlowe & Finch card account but the purchase was not charged to it, and none when the customer holds no active Marlowe & Finch card account. The complimentary waiver is assembled from its form: under the whole-charge form it is the whole operation charge; under the allowance form it is the lesser of the operation charge and the sale-work allowance plus the premium-garment addition, and nothing when the sale-work allowance is nothing; under the no-waiver form it is nothing. It is rounded half up to the cent once on that final figure and is owed only when the dropoff_date falls within the class's complimentary_purchase_window_days plus both window extensions counted from the completed_date; when it falls outside, nothing is waived. For a complimentary waiver this policy books, and only for such a waiver, the waiver covers the operation charge only and the lined surcharge of the operation stays chargeable whether the operation is waived in full or in part; rush fees and extra fittings are never complimentary, and every other complimentary waiver remains under the base rule. For a complimentary waiver this policy books, and only for such a waiver, the allowance is counted on the ticket, one complimentary waiver per ticket for its highest-priced qualifying operation, in place of the count of complimentary operations across every ticket naming the same purchase; any further qualifying operation on that ticket stays chargeable, and every other complimentary waiver remains under the base allowance rule. For a complimentary waiver this policy books, and only for such a waiver, the drop-off must fall within the complimentary window with both window extensions, in place of the window of complimentary_purchase_window_days alone; every other complimentary window remains under the base rule. For a complimentary waiver this policy books, and only for such a waiver, the ticket must still name a Marlowe & Finch purchase record in the customer's own name, a regular-price purchase still has the operation waived in full, a sale-price purchase of an active Finch Circle Gold, Platinum, Diamond or Icon member has the sale-work allowance set out here waived instead of being charged in full, and clearance, doorbuster and final sale purchases stay charged; every other waiver remains under the base rule."
  prerequisite: []
  cross_category:
