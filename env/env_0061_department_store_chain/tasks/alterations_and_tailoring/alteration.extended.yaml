  - base_policy: alteration_complimentary_basic
    superseded_clause: "the ticket names a Marlowe & Finch purchase record in the customer's own name whose price_type is one of complimentary_price_types (sale, clearance, doorbuster and final sale items are charged, sale_item_complimentary false)"
    replaced_by: "For a complimentary waiver this policy books, and only for such a waiver, the ticket must still name a Marlowe & Finch purchase record in the customer's own name, a regular-price purchase still has the operation waived in full, a sale-price purchase of an active Finch Circle Gold, Platinum, Diamond or Icon member has the sale-work allowance set out here waived instead of being charged in full, and clearance, doorbuster and final sale purchases stay charged; every other waiver remains under the base rule."
  - base_policy: alteration_complimentary_basic
    superseded_clause: "Lined surcharges on a complimentary operation are complimentary too; rush fees and extra fittings never are."
    replaced_by: "For a complimentary waiver this policy books, and only for such a waiver, the waiver covers the operation charge only and the lined surcharge of the operation stays chargeable whether the operation is waived in full or in part; rush fees and extra fittings are never complimentary, and every other complimentary waiver remains under the base rule."
  - base_policy: alteration_complimentary_basic
    superseded_clause: "At most complimentary_max_operations operations are complimentary (see alteration_agg_complimentary_per_purchase), taken from the qualifying operations with the highest price first."
    replaced_by: "For a complimentary waiver this policy books, and only for such a waiver, the allowance is counted on the ticket, one complimentary waiver per ticket for its highest-priced qualifying operation, in place of the count of complimentary operations across every ticket naming the same purchase; any further qualifying operation on that ticket stays chargeable, and every other complimentary waiver remains under the base allowance rule."
