    result: "The complimentary waiver is assembled from its form: under the whole-charge form it is the whole operation charge; under the allowance form it is the lesser of the operation charge and the sale-work allowance plus the premium-garment addition, and nothing when the sale-work allowance is nothing; under the no-waiver form it is nothing. It is rounded half up to the cent once on that final figure and is owed only when the dropoff_date falls within the class's complimentary_purchase_window_days plus both window extensions counted from the completed_date; when it falls outside, nothing is waived."
  factors:
  - id: complimentary_waiver_form
    effect: method
    decides: complimentary_form
    bindings:
    - p_type
    - complimentary_form
    ladder:
    - when: purchase at regular price
      method: waive the whole operation charge
    - when: "purchase at sale price and active member at Finch Circle Gold or above"
      method: "waive the lesser of the operation charge and the sale-work allowance"
    - when: otherwise
      method: waive nothing
    baseline:
      complimentary_form: '''whole_charge'' if p_type == ''regular'' else ''no_waiver'''
    evidence:
    - cross_category
    cross_difficulty: order
  - id: member_sale_work_allowance
    effect: parameter
    decides: sale_allowance
    bindings:
    - member_threshold
    - sale_allowance
    ladder:
    - when: active member at Finch Circle Diamond or Icon
      value: K('diamond_allow') = 20.00 USD
    - when: active Finch Circle Platinum member
      value: K('platinum_allow') = 14.00 USD
    - when: active Finch Circle Gold member
      value: K('gold_allow') = 8.00 USD
    - when: otherwise
      value: 0 (nothing waived)
    baseline:
      sale_allowance: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loyalty
  - id: premium_garment_addition
    effect: parameter
    decides: premium_addition
    bindings:
    - p_regular
    - premium_addition
    ladder:
    - when: regular_price of 500.00 USD or more
      value: K('premium_high_add') = 6.00 USD
    - when: regular_price of 250.00 to 499.99 USD
      value: K('premium_mid_add') = 3.00 USD
    - when: otherwise
      value: '0'
    baseline:
      premium_addition: '0'
    evidence:
    - cross_category
    cross_difficulty: order
  - id: finch_circle_window_extension
