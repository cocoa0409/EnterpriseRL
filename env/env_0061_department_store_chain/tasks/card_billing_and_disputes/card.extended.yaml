        foreign_transaction_fee_pct percent of the smaller amount, the posting in error is the larger posting; when their
        amounts differ by more than that, the posting in error is the smaller posting; when their amounts are equal, the
        posting in error is the later-posted one. The foreign transaction fee posted against the posting in error, when one
        has posted, is the related fee.
        The related billed interest is the related interest base times the posting in error plus the related fee, divided
        by the interest-bearing balance, times the billing-time fraction, rounded half up to the cent, and zero when the
        interest-bearing balance is not above zero; as standard the related interest base is zero, the interest-bearing
        balance is the latest statement balance and the billing-time fraction is one.
        The related unbilled interest is the posting in error times the card's daily periodic rate, which is
        purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor, times the accrual days, rounded half up to the
        cent; as standard the accrual days are zero.
        The amount in dispute is the posting in error plus the related fee, the related billed interest, the related
        unbilled interest and the related other charge, rounded half up to the cent; as standard the related other charge
