  - id: card_ext_double_posting_notice
    base_policy_refs: [card_billing_dispute]
    overwrite: []
    trigger: on_request
    subject: [card_dispute_filed]
    computes: disputed_amount
    target_tool: file_double_posting_notice_03ed3b71
    params:
      proration_days: 30
    rule: >-
      A cardmember who gives notice that a purchase processed in a foreign currency or outside the United States posted
      to the account twice states as the amount in dispute the posting in error together with the finance and other
      charges imposed as a result of it.
      The notice concerns the purchase posting against which the account's most recently posted foreign transaction fee
      was assessed (the fee-bearing posting) and the other purchase posting from the same merchant with the same
      transaction date; together they are the twin postings. When no foreign transaction fee has posted to the account,
      or the fee-bearing posting has no such twin, there are no twin postings, the notice does not apply and the amount
      in dispute is zero.
      The posting in error is chosen by comparing the twin postings: when their amounts differ by no more than the card's
      foreign_transaction_fee_pct percent of the smaller amount, the posting in error is the larger posting; when their
      amounts differ by more than that, the posting in error is the smaller posting; when their amounts are equal, the
      posting in error is the later-posted one. The foreign transaction fee posted against the posting in error, when one
      has posted, is the related fee.
      The related billed interest is the related interest base times the posting in error plus the related fee, divided
      by the interest-bearing balance, times the billing-time fraction, rounded half up to the cent, and zero when the
      interest-bearing balance is not above zero; as standard the related interest base is zero, the interest-bearing
      balance is the latest statement balance and the billing-time fraction is one.
      The related unbilled interest is the posting in error times the card's daily periodic rate, which is
      purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor, times the accrual days, rounded half up to the
      cent; as standard the accrual days are zero.
      The amount in dispute is the posting in error plus the related fee, the related billed interest, the related
      unbilled interest and the related other charge, rounded half up to the cent; as standard the related other charge
      is zero.
      In place of zero, the related interest base is the purchase interest charged on the latest statement when that
      statement charged purchase interest, and the minimum interest charge when the latest statement charged only the
      minimum interest charge; when the latest statement charged no interest, it stays zero.
      In place of the latest statement balance, the interest-bearing balance is the latest statement balance less its
      promotional balance and less any disputed amount it excluded when the latest statement shows a promotional
      balance, and the latest statement balance less the disputed amount it excluded when it shows no promotional
      balance but excluded a disputed amount; otherwise it stays the latest statement balance; a balance so reduced is
      rounded half up to the cent.
      In place of one, the billing-time fraction follows the posting in error's own posting date, from which the
      erroneous charge was on the balance: when the posting in error belongs to the latest billing period, the fraction
      is the calendar days from its posting date to the latest statement date divided by proration_days; when its posting
      date is after the latest statement date, the fraction is zero; otherwise it stays one.
      In place of zero, the accrual days follow the latest statement and the posting in error's own posting date: when
      the latest statement charged purchase interest and the posting in error posted on or before the latest statement
      date, they are the calendar days from the latest statement date to the notice date; when the latest statement
      charged purchase interest and the posting in error posted after the latest statement date, they are the calendar
      days from its posting date to the notice date; when the latest statement charged no purchase interest, so that the
      grace period holds, they stay zero.
      In place of zero, the related other charge is the fee the posting in error caused: when a returned payment fee was
      assessed after the latest statement date for a payment of at least the latest statement balance, and the posting in
      error posted on or before the latest statement date (the returned payment carried the posting in error), it is that
      returned payment fee; when no such returned payment fee was assessed but a late fee was assessed for the billing
      period in which the posting in error posted, it is that late fee; otherwise it stays zero.
    prerequisite: []
    cross_category: []
    compute:
      - fx_anchor: "LATEST('card_transactions','original_card_txn_id', date_field='post_date', event_type='card_fee', fee_type='foreign_transaction_fee')"
      - twin_merchant: "LATEST('card_transactions','merchant_name', date_field='post_date', card_txn_id=fx_anchor)"
      - twin_date: "LATEST('card_transactions','txn_date', date_field='post_date', card_txn_id=fx_anchor)"
      - later_amt: "LATEST('card_transactions','amount', date_field='post_date', event_type='card_purchase', merchant_name=twin_merchant, txn_date=twin_date) or 0"
      - pair_total: "SUM('card_transactions','amount', event_type='card_purchase', merchant_name=twin_merchant, txn_date=twin_date)"
      - other_amt: "RND(pair_total - later_amt, 2)"
      - err_amt: "(MX(later_amt, other_amt) if ABS(later_amt - other_amt) <= MN(later_amt, other_amt) * P('foreign_transaction_fee_pct') / 100 else MN(later_amt, other_amt)) if ABS(later_amt - other_amt) >= 0.01 else later_amt"
      - err_id: "LATEST('card_transactions','card_txn_id', date_field='post_date', event_type='card_purchase', merchant_name=twin_merchant, txn_date=twin_date, amount=err_amt)"
      - err_post: "LATEST('card_transactions','post_date', date_field='post_date', card_txn_id=err_id) or ''"
      - err_period: "LATEST('card_transactions','statement_period', date_field='post_date', card_txn_id=err_id) or ''"
      - related_fee: "SUM('card_transactions','amount', event_type='card_fee', fee_type='foreign_transaction_fee', original_card_txn_id=err_id)"
      - last_period: "LATEST('card_statements','statement_period', date_field='statement_date')"
      - last_stmt_date: "LATEST('card_statements','statement_date', date_field='statement_date') or ''"
      - last_stmt_bal: "LATEST('card_statements','statement_balance', date_field='statement_date') or 0"
      - pi_last: "SUM('card_transactions','amount', event_type='card_interest_charge', interest_type='purchase_interest', statement_period=last_period)"
      - mic_last: "SUM('card_transactions','amount', event_type='card_interest_charge', interest_type='minimum_interest_charge', statement_period=last_period)"
      - int_base: "pi_last if pi_last > 0 else (mic_last if mic_last > 0 else 0)"
      - last_stmt_promo: "LATEST('card_statements','promo_balance', date_field='statement_date') or 0"
      - last_stmt_excl: "LATEST('card_statements','disputed_amount_excluded', date_field='statement_date') or 0"
      - ib_bal: "RND(last_stmt_bal - last_stmt_promo - last_stmt_excl, 2) if last_stmt_promo > 0 else (RND(last_stmt_bal - last_stmt_excl, 2) if last_stmt_excl > 0 else last_stmt_bal)"
      - err_lead_days: "DAYS(err_post, last_stmt_date) if (err_post != '' and last_stmt_date != '') else 0"
      - time_frac: "err_lead_days / K('proration_days') if (err_period != '' and err_period == last_period) else (0 if (err_post != '' and err_post > last_stmt_date) else 1)"
      - pi_check: "SUM('card_transactions','amount', event_type='card_interest_charge', interest_type='purchase_interest', statement_period=last_period)"
      - acc_days: "(DAYS(last_stmt_date, NOW) if err_post <= last_stmt_date else DAYS(err_post, NOW)) if (pi_check > 0 and err_post != '' and last_stmt_date != '') else 0"
      - rpf_amt: "LATEST('card_transactions','amount', date_field='txn_date', event_type='card_fee', fee_type='returned_payment_fee') or 0"
      - rpf_date: "LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_fee', fee_type='returned_payment_fee') or ''"
      - rpf_payment: "LATEST('card_transactions','original_card_txn_id', date_field='txn_date', event_type='card_fee', fee_type='returned_payment_fee')"
      - rpf_payment_amt: "LATEST('card_transactions','amount', date_field='txn_date', event_type='card_payment', card_txn_id=rpf_payment) or 0"
      - err_period_late_fee: "SUM('card_transactions','amount', event_type='card_fee', fee_type='late_fee', statement_period=err_period)"
      - other_charge: "rpf_amt if (rpf_amt > 0 and rpf_date > last_stmt_date and rpf_payment_amt >= last_stmt_bal and err_post != '' and err_post <= last_stmt_date) else (err_period_late_fee if err_period_late_fee > 0 else 0)"
      - daily_rate: "P('purchase_apr_pct') / 100 / P('daily_periodic_rate_divisor')"
      - billed_int: "RND(int_base * (err_amt + related_fee) / ib_bal * time_frac, 2) if ib_bal > 0 else 0"
      - unbilled_int: "RND(err_amt * daily_rate * acc_days, 2)"
      - result: "RND(err_amt + related_fee + billed_int + unbilled_int + other_charge, 2) if pair_total > later_amt else 0"
    compute_basis:
      fx_anchor: "the purchase posting against which the account's most recently posted foreign transaction fee was assessed (the fee-bearing posting)"
      twin_merchant: "the other purchase posting from the same merchant with the same transaction date; together they are the twin postings."
      twin_date: "the other purchase posting from the same merchant with the same transaction date"
      later_amt: "when their amounts are equal, the posting in error is the later-posted one."
      pair_total: "When no foreign transaction fee has posted to the account, or the fee-bearing posting has no such twin, there are no twin postings, the notice does not apply and the amount in dispute is zero."
      other_amt: "the other purchase posting from the same merchant with the same transaction date"
      err_amt: "The posting in error is chosen by comparing the twin postings: when their amounts differ by no more than the card's foreign_transaction_fee_pct percent of the smaller amount, the posting in error is the larger posting; when their amounts differ by more than that, the posting in error is the smaller posting; when their amounts are equal, the posting in error is the later-posted one."
      err_id: "the posting in error"
      err_post: "the posting in error's own posting date, from which the erroneous charge was on the balance"
      err_period: "when the posting in error belongs to the latest billing period"
      related_fee: "The foreign transaction fee posted against the posting in error, when one has posted, is the related fee."
      last_period: "the purchase interest charged on the latest statement"
      last_stmt_date: "to the latest statement date"
      last_stmt_bal: "the interest-bearing balance is the latest statement balance"
      pi_last: "the related interest base is the purchase interest charged on the latest statement when that statement charged purchase interest"
      mic_last: "and the minimum interest charge when the latest statement charged only the minimum interest charge"
      int_base: "In place of zero, the related interest base is the purchase interest charged on the latest statement when that statement charged purchase interest, and the minimum interest charge when the latest statement charged only the minimum interest charge; when the latest statement charged no interest, it stays zero."
      last_stmt_promo: "less its promotional balance"
      last_stmt_excl: "and less any disputed amount it excluded"
      ib_bal: "In place of the latest statement balance, the interest-bearing balance is the latest statement balance less its promotional balance and less any disputed amount it excluded when the latest statement shows a promotional balance, and the latest statement balance less the disputed amount it excluded when it shows no promotional balance but excluded a disputed amount; otherwise it stays the latest statement balance; a balance so reduced is rounded half up to the cent."
      err_lead_days: "the calendar days from its posting date to the latest statement date divided by proration_days"
      time_frac: "In place of one, the billing-time fraction follows the posting in error's own posting date, from which the erroneous charge was on the balance: when the posting in error belongs to the latest billing period, the fraction is the calendar days from its posting date to the latest statement date divided by proration_days; when its posting date is after the latest statement date, the fraction is zero; otherwise it stays one."
      pi_check: "when the latest statement charged purchase interest"
      acc_days: "In place of zero, the accrual days follow the latest statement and the posting in error's own posting date: when the latest statement charged purchase interest and the posting in error posted on or before the latest statement date, they are the calendar days from the latest statement date to the notice date; when the latest statement charged purchase interest and the posting in error posted after the latest statement date, they are the calendar days from its posting date to the notice date; when the latest statement charged no purchase interest, so that the grace period holds, they stay zero."
      rpf_amt: "it is that returned payment fee"
      rpf_date: "when a returned payment fee was assessed after the latest statement date"
      rpf_payment: "for a payment of at least the latest statement balance"
      rpf_payment_amt: "for a payment of at least the latest statement balance"
      err_period_late_fee: "a late fee was assessed for the billing period in which the posting in error posted"
      other_charge: "In place of zero, the related other charge is the fee the posting in error caused: when a returned payment fee was assessed after the latest statement date for a payment of at least the latest statement balance, and the posting in error posted on or before the latest statement date (the returned payment carried the posting in error), it is that returned payment fee; when no such returned payment fee was assessed but a late fee was assessed for the billing period in which the posting in error posted, it is that late fee; otherwise it stays zero."
      daily_rate: "the card's daily periodic rate, which is purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor"
      billed_int: "The related billed interest is the related interest base times the posting in error plus the related fee, divided by the interest-bearing balance, times the billing-time fraction, rounded half up to the cent, and zero when the interest-bearing balance is not above zero"
      unbilled_int: "The related unbilled interest is the posting in error times the card's daily periodic rate, which is purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor, times the accrual days, rounded half up to the cent"
      result: "The amount in dispute is the posting in error plus the related fee, the related billed interest, the related unbilled interest and the related other charge, rounded half up to the cent"
    factors:
      - id: interest_base_pick
        effect: parameter
        decides: int_base
        bindings: [pi_last, mic_last, int_base]
        ladder:
          - when: "the latest statement charged purchase interest"
            value: "that purchase interest"
          - when: "the latest statement charged only the minimum interest charge"
            value: "that minimum interest charge"
          - when: "otherwise"
            value: "0"
        baseline:
          int_base: "0"
        evidence: [history]
        cross_difficulty: null
      - id: interest_bearing_balance
        effect: parameter
        decides: ib_bal
        bindings: [last_stmt_promo, last_stmt_excl, ib_bal]
        ladder:
          - when: "the latest statement shows a promotional balance"
            value: "the latest statement balance less its promotional balance and any disputed amount it excluded"
          - when: "no promotional balance but a disputed amount excluded on the latest statement"
            value: "the latest statement balance less that excluded amount"
          - when: "otherwise"
            value: "the latest statement balance"
        baseline:
          ib_bal: "last_stmt_bal"
        evidence: [history]
        cross_difficulty: null
      - id: billing_time_fraction
        effect: method
        decides: time_frac
        bindings: [err_lead_days, time_frac]
        ladder:
          - when: "the posting in error belongs to the latest billing period"
            method: "calendar days from its own posting date to the latest statement date divided by proration_days"
          - when: "the posting in error posted after the latest statement date"
            method: "zero"
          - when: "otherwise"
            method: "one (the whole billing period)"
        baseline:
          time_frac: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: accrual_days
        effect: method
        decides: acc_days
        bindings: [pi_check, acc_days]
        ladder:
          - when: "the latest statement charged purchase interest and the posting in error posted on or before the latest statement date"
            method: "calendar days from the latest statement date to the notice date"
          - when: "the latest statement charged purchase interest and the posting in error posted after the latest statement date"
            method: "calendar days from its own posting date to the notice date"
          - when: "otherwise (no purchase interest on the latest statement; grace period holds)"
            method: "zero"
        baseline:
          acc_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: related_other_charge
        effect: parameter
        decides: other_charge
        bindings: [rpf_amt, rpf_date, rpf_payment, rpf_payment_amt, err_period_late_fee, other_charge]
        ladder:
          - when: "a returned payment fee assessed after the latest statement date for a payment of at least the latest statement balance that carried the posting in error"
            value: "that returned payment fee"
          - when: "no such returned payment fee, but a late fee for the billing period in which the posting in error posted"
            value: "that late fee"
          - when: "otherwise"
            value: "0"
        baseline:
          other_charge: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
