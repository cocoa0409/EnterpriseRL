  - id: card_ext_missing_credit_notice
    base_policy_refs: [card_billing_dispute]
    overwrite: []
    trigger: on_request
    subject: [card_dispute_filed]
    computes: disputed_amount
    target_tool: file_missing_credit_notice_85b33449
    params:
      proration_days: 30
    rule: >-
      A cardmember who gives notice that a Marlowe & Finch refund settled to the card has not been credited to the
      account states as the amount in dispute the credit owed together with the interest the missing credit caused.
      The notice concerns the cardmember's most recent Marlowe & Finch refund record settled to the Marlowe & Finch card
      tender, and the card purchase posting of the order it refunds is the transaction the notice names; a refund whose
      card credits already total at least the refund, or a cardmember with no such refund record, is not the subject of
      such a notice, and the amount in dispute is then zero.
      The credit owed is the amount of that refund record.
      The missing-credit billed interest is the missing-credit interest base times the credit owed, divided by the latest
      statement balance, times the missing-credit time fraction, rounded half up to the cent, and zero when the latest
      statement balance is not above zero; as standard the missing-credit interest base is zero and the missing-credit
      time fraction is one.
      The missing-credit unbilled interest is the credit owed times the card's daily periodic rate, which is
      purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor, times the missing-credit accrual days, rounded
      half up to the cent; as standard the missing-credit accrual days are zero.
      The amount in dispute is the credit owed plus the missing-credit billed interest and the missing-credit unbilled
      interest, rounded half up to the cent.
      In place of the amount of the refund record, the credit owed is set by comparing the refund record with the card:
      when card credits that name the refund record have posted but total less than the refund, the credit owed is the
      refund less those credits; when no card credit names it and the refund is larger than the card purchase postings of
      the refunded order, the credit owed is those purchase postings; in every other case the credit owed stays the
      amount of the refund record.
      In place of zero, the missing-credit interest base is the purchase interest charged on the latest statement when
      that statement charged purchase interest, and the minimum interest charge when the latest statement charged only
      the minimum interest charge; when the latest statement charged no interest, it stays zero.
      In place of one, the missing-credit time fraction follows the refund date: when the refund was issued on the latest
      statement date or within the proration_days calendar days before it, the fraction is the calendar days from the
      refund date to the latest statement date divided by proration_days; when the refund was issued after the latest
      statement date, the fraction is zero; when it was issued more than proration_days calendar days before the latest
      statement date, it stays one.
      In place of zero, the missing-credit accrual days follow the latest statement and the refund date: when the latest
      statement charged purchase interest and the refund was issued on or before the latest statement date, they are the
      calendar days from the latest statement date to the notice date; when the latest statement charged purchase
      interest and the refund was issued after the latest statement date, they are the calendar days from the refund date
      to the notice date; when the latest statement charged no purchase interest, they stay zero.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_events.order_event_id, order_events.amount, order_events.event_date, order_events.purchase_id, order_number]
        note: The credit owed, the time fraction and the accrual days read the store's refund record settled to the card and the order number of the refunded purchase.
    compute:
      - refund_id: "XLATEST('order','order_events','order_event_id', date_field='event_date', event_type='order_refund', refund_tender_type='mf_card')"
      - refund_amt: "XLATEST('order','order_events','amount', date_field='event_date', event_type='order_refund', refund_tender_type='mf_card')"
      - refund_purchase: "XLATEST('order','order_events','purchase_id', date_field='event_date', event_type='order_refund', refund_tender_type='mf_card')"
      - credited: "SUM('card_transactions','amount', event_type='card_merchandise_credit', order_event_id=refund_id)"
      - refunded_order: "CFIELD('order','order_number', purchase_id=refund_purchase)"
      - order_charged: "SUM('card_transactions','amount', event_type='card_purchase', order_number=refunded_order)"
      - credit_owed: "0 if (not refund_amt or credited >= refund_amt) else (RND(refund_amt - credited, 2) if credited > 0 else (order_charged if refund_amt > order_charged else refund_amt))"
      - last_period: "LATEST('card_statements','statement_period', date_field='statement_date')"
      - last_stmt_date: "LATEST('card_statements','statement_date', date_field='statement_date') or ''"
      - last_stmt_bal: "LATEST('card_statements','statement_balance', date_field='statement_date') or 0"
      - pi_last: "SUM('card_transactions','amount', event_type='card_interest_charge', interest_type='purchase_interest', statement_period=last_period)"
      - mic_last: "SUM('card_transactions','amount', event_type='card_interest_charge', interest_type='minimum_interest_charge', statement_period=last_period)"
      - mc_int_base: "pi_last if pi_last > 0 else (mic_last if mic_last > 0 else 0)"
      - refund_date: "XLATEST('order','order_events','event_date', date_field='event_date', event_type='order_refund', refund_tender_type='mf_card') or ''"
      - refund_lead_days: "DAYS(refund_date, last_stmt_date) if (refund_date != '' and last_stmt_date != '') else -1"
      - mc_time_frac: "refund_lead_days / K('proration_days') if (refund_lead_days >= 0 and refund_lead_days <= K('proration_days')) else (0 if refund_lead_days < 0 else 1)"
      - acc_refund_date: "XLATEST('order','order_events','event_date', date_field='event_date', event_type='order_refund', refund_tender_type='mf_card') or ''"
      - acc_pi_check: "SUM('card_transactions','amount', event_type='card_interest_charge', interest_type='purchase_interest', statement_period=last_period)"
      - mc_acc_days: "(DAYS(last_stmt_date, NOW) if acc_refund_date <= last_stmt_date else DAYS(acc_refund_date, NOW)) if (acc_pi_check > 0 and acc_refund_date != '' and last_stmt_date != '') else 0"
      - mc_daily_rate: "P('purchase_apr_pct') / 100 / P('daily_periodic_rate_divisor')"
      - mc_billed: "RND(mc_int_base * credit_owed / last_stmt_bal * mc_time_frac, 2) if last_stmt_bal > 0 else 0"
      - mc_unbilled: "RND(credit_owed * mc_daily_rate * mc_acc_days, 2)"
      - result: "RND(credit_owed + mc_billed + mc_unbilled, 2) if credit_owed > 0 else 0"
    compute_basis:
      refund_id: "The notice concerns the cardmember's most recent Marlowe & Finch refund record settled to the Marlowe & Finch card tender, and the card purchase posting of the order it refunds is the transaction the notice names; a refund whose card credits already total at least the refund, or a cardmember with no such refund record, is not the subject of such a notice, and the amount in dispute is then zero."
      refund_amt: "The credit owed is the amount of that refund record."
      refund_purchase: "the card purchase posting of the order it refunds is the transaction the notice names"
      credited: "when card credits that name the refund record have posted but total less than the refund"
      refunded_order: "the card purchase postings of the refunded order"
      order_charged: "when no card credit names it and the refund is larger than the card purchase postings of the refunded order, the credit owed is those purchase postings"
      credit_owed: "In place of the amount of the refund record, the credit owed is set by comparing the refund record with the card: when card credits that name the refund record have posted but total less than the refund, the credit owed is the refund less those credits; when no card credit names it and the refund is larger than the card purchase postings of the refunded order, the credit owed is those purchase postings; in every other case the credit owed stays the amount of the refund record."
      last_period: "the purchase interest charged on the latest statement"
      last_stmt_date: "to the latest statement date"
      last_stmt_bal: "divided by the latest statement balance"
      pi_last: "the missing-credit interest base is the purchase interest charged on the latest statement when that statement charged purchase interest"
      mic_last: "and the minimum interest charge when the latest statement charged only the minimum interest charge"
      mc_int_base: "In place of zero, the missing-credit interest base is the purchase interest charged on the latest statement when that statement charged purchase interest, and the minimum interest charge when the latest statement charged only the minimum interest charge; when the latest statement charged no interest, it stays zero."
      refund_date: "the missing-credit time fraction follows the refund date"
      refund_lead_days: "the calendar days from the refund date to the latest statement date divided by proration_days"
      mc_time_frac: "In place of one, the missing-credit time fraction follows the refund date: when the refund was issued on the latest statement date or within the proration_days calendar days before it, the fraction is the calendar days from the refund date to the latest statement date divided by proration_days; when the refund was issued after the latest statement date, the fraction is zero; when it was issued more than proration_days calendar days before the latest statement date, it stays one."
      acc_refund_date: "the missing-credit accrual days follow the latest statement and the refund date"
      acc_pi_check: "when the latest statement charged purchase interest"
      mc_acc_days: "In place of zero, the missing-credit accrual days follow the latest statement and the refund date: when the latest statement charged purchase interest and the refund was issued on or before the latest statement date, they are the calendar days from the latest statement date to the notice date; when the latest statement charged purchase interest and the refund was issued after the latest statement date, they are the calendar days from the refund date to the notice date; when the latest statement charged no purchase interest, they stay zero."
      mc_daily_rate: "the card's daily periodic rate, which is purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor"
      mc_billed: "The missing-credit billed interest is the missing-credit interest base times the credit owed, divided by the latest statement balance, times the missing-credit time fraction, rounded half up to the cent, and zero when the latest statement balance is not above zero"
      mc_unbilled: "The missing-credit unbilled interest is the credit owed times the card's daily periodic rate, which is purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor, times the missing-credit accrual days, rounded half up to the cent"
      result: "The amount in dispute is the credit owed plus the missing-credit billed interest and the missing-credit unbilled interest, rounded half up to the cent."
    factors:
      - id: owed_comparison
        effect: parameter
        decides: credit_owed
        bindings: [refund_id, refund_amt, refund_purchase, credited, refunded_order, order_charged, credit_owed]
        ladder:
          - when: "card credits naming the refund record have posted but total less than the refund"
            value: "the refund less those credits"
          - when: "no card credit names it and the refund is larger than the refunded order's card purchase postings"
            value: "those purchase postings"
          - when: "otherwise"
            value: "the refund amount"
        baseline:
          credit_owed: "0 if (not refund_amt or credited >= refund_amt) else refund_amt"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: missing_credit_interest_base
        effect: parameter
        decides: mc_int_base
        bindings: [pi_last, mic_last, mc_int_base]
        ladder:
          - when: "the latest statement charged purchase interest"
            value: "that purchase interest"
          - when: "the latest statement charged only the minimum interest charge"
            value: "that minimum interest charge"
          - when: "otherwise"
            value: "0"
        baseline:
          mc_int_base: "0"
        evidence: [history]
        cross_difficulty: null
      - id: missing_credit_time_fraction
        effect: method
        decides: mc_time_frac
        bindings: [refund_date, refund_lead_days, mc_time_frac]
        ladder:
          - when: "the refund was issued on the latest statement date or within proration_days calendar days before it"
            method: "calendar days from the refund date to the latest statement date divided by proration_days"
          - when: "the refund was issued after the latest statement date"
            method: "zero"
          - when: "otherwise (more than proration_days days before)"
            method: "one (the whole billing period)"
        baseline:
          mc_time_frac: "1"
        evidence: [cross_category, date]
        cross_difficulty: order
      - id: missing_credit_accrual_days
        effect: method
        decides: mc_acc_days
        bindings: [acc_refund_date, acc_pi_check, mc_acc_days]
        ladder:
          - when: "the latest statement charged purchase interest and the refund was issued on or before the latest statement date"
            method: "calendar days from the latest statement date to the notice date"
          - when: "the latest statement charged purchase interest and the refund was issued after the latest statement date"
            method: "calendar days from the refund date to the notice date"
          - when: "otherwise"
            method: "zero"
        baseline:
          mc_acc_days: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: order
    baseline:
      rule: >-
        The notice concerns the cardmember's most recent Marlowe & Finch refund record settled to the Marlowe & Finch card
        tender, and the card purchase posting of the order it refunds is the transaction the notice names; a refund whose
        card credits already total at least the refund, or a cardmember with no such refund record, is not the subject of
        such a notice, and the amount in dispute is then zero.
        The credit owed is the amount of that refund record.
        The missing-credit billed interest is the missing-credit interest base times the credit owed, divided by the latest
        statement balance, times the missing-credit time fraction, rounded half up to the cent, and zero when the latest
        statement balance is not above zero; as standard the missing-credit interest base is zero and the missing-credit
        time fraction is one.
        The missing-credit unbilled interest is the credit owed times the card's daily periodic rate, which is
        purchase_apr_pct divided by 100 and by daily_periodic_rate_divisor, times the missing-credit accrual days, rounded
        half up to the cent; as standard the missing-credit accrual days are zero.
        The amount in dispute is the credit owed plus the missing-credit billed interest and the missing-credit unbilled
        interest, rounded half up to the cent.
      params: [purchase_apr_pct, daily_periodic_rate_divisor]
    inputs:
      history:
        - {category: order, table: order_events, aggregate: latest, field: amount, filters: {event_type: order_refund, refund_tender_type: mf_card}}
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: [card_merchandise_credit, card_purchase, card_interest_charge]}}
        - {table: card_statements, aggregate: latest, field: statement_balance}
      cross_category: [order]
  - id: card_ext_catch_up_payment
    base_policy_refs: [card_evt_payment_crediting]
    overwrite: []
    trigger: on_request
    subject: [card_payment]
    computes: amount
    target_tool: take_phone_payment_161e7e24
    params:
      coverage_window_days: 21
      promo_window_months: 2
    rule: >-
      When a cardmember who has missed a minimum payment pays by phone to bring the account current, customer care takes
      the catch-up amount worked out as follows.
      The missed statement is the statement of the billing period that the most recent late fee on the account belongs
      to; its minimum payment due is the missed minimum and its payment due date is the missed due date; an account with
      no late fee has no missed statement and no catch-up amount is taken.
      The catch-up coverage is the missed minimum, and the dispute relief is zero.
      The catch-up amount is the larger of the missed minimum and the catch-up coverage less the dispute relief, plus the
      returned-payment add-back and the promotional add-on, less the most recent payment credited after the missed due
      date, never below zero, rounded half up to the cent; as standard the returned-payment add-back and the promotional
      add-on are zero.
      In place of the missed minimum, the catch-up coverage follows the statements issued since: when the latest
      statement is for a later billing period than the missed statement and its payment due date falls no later than
      coverage_window_days calendar days after the day of the catch-up payment (a due date already passed included), the
      coverage is the minimum payment due shown on the latest statement; when the latest statement is for a later billing
      period and its payment due date is later than that, the coverage is the past-due amount shown on the latest
      statement; when no later statement has been issued, the coverage stays the missed minimum.
      In place of zero, the dispute relief follows the amount under open billing dispute on the account (the disputed
      amounts of the account's dispute filings less those of its resolutions and withdrawals), because a payment never
      needs to be applied to an amount under open billing dispute: when an amount is under open billing dispute and
      min_payment_principal_pct percent of the latest statement balance less that amount, plus the interest and fees of
      the latest billing period (less fee reversals of that period), is above the card's min_payment_floor_usd, the relief
      is the latest statement's minimum payment due less that sum rounded half up to the cent and less the latest
      statement's past-due amount; when an amount is under open billing dispute and that sum is not above the floor, the
      relief is the latest statement's minimum payment due less the smaller of the floor and the reduced balance and less
      the past-due amount; when nothing is under open billing dispute, it stays zero; a relief is never below zero.
      In place of zero, the promotional add-on is set by the special financing still running: when the latest statement
      shows a promotional balance and no more than promo_window_months full calendar months of the promotion remain, it is
      the whole promotional balance; when it shows a promotional balance and more months remain, it is the promotional
      balance divided by the full calendar months remaining, rounded half up to the cent; when there is no promotional
      balance it stays zero; the months remaining are the card's promo_financing_months less the full calendar months
      since the transaction date of the most recent special financing purchase.
      In place of zero, the returned-payment add-back is set by what became of the most recent payment credited after the
      missed due date: when it was returned unpaid and a returned payment fee was assessed for it, the add-back is the
      returned amount plus that fee; when it was returned unpaid with no such fee, the add-back is the returned amount;
      otherwise it stays zero.
      The catch-up amount is not set until the cardmember's most recent Marlowe & Finch refund to the card tender, if it
      lacks its full card credit, is under an open credit-not-posted dispute.
    prerequisite:
      - problem: card_ext_missing_credit_notice
        kind: value_input
        gate: cu_open_disputed
        form: state
        policy_source: >-
          The catch-up amount is not set until the cardmember's most recent Marlowe & Finch refund to the card tender, if it lacks its full card credit, is under an open credit-not-posted dispute.
        condition: >-
          When the card credits naming the cardmember's most recent order_refund record with refund_tender_type mf_card total less than that refund, card_disputes holds a card_dispute_filed row with dispute_reason credit_not_posted on the card purchase posting of the refunded order and no later resolution or withdrawal row for it.
        resolved_by: file_missing_credit_notice_85b33449
        effect: >-
          The notice's disputed amount becomes the amount under open billing dispute, so the dispute relief is worked
          out on the latest statement balance less that amount and the catch-up amount falls.
    cross_category: []
    compute:
      - cu_missed_period: "LATEST('card_transactions','statement_period', date_field='txn_date', event_type='card_fee', fee_type='late_fee')"
      - cu_missed_min: "LATEST('card_statements','minimum_payment_due', date_field='statement_date', statement_period=cu_missed_period) or 0"
      - cu_missed_due: "LATEST('card_statements','payment_due_date', date_field='statement_date', statement_period=cu_missed_period) or ''"
      - cu_last_min: "LATEST('card_statements','minimum_payment_due', date_field='statement_date') or 0"
      - cu_last_past_due: "LATEST('card_statements','past_due_amount', date_field='statement_date') or 0"
      - cu_last_bal: "LATEST('card_statements','statement_balance', date_field='statement_date') or 0"
      - cu_last_promo: "LATEST('card_statements','promo_balance', date_field='statement_date') or 0"
      - cu_last_period: "LATEST('card_statements','statement_period', date_field='statement_date')"
      - cu_last_due: "LATEST('card_statements','payment_due_date', date_field='statement_date') or NOW"
      - cu_coverage: "cu_last_min if (cu_last_period != cu_missed_period and DAYS(NOW, cu_last_due) <= K('coverage_window_days')) else (cu_last_past_due if cu_last_period != cu_missed_period else cu_missed_min)"
      - cu_int_fees: "SUM('card_transactions','amount', event_type='card_interest_charge', statement_period=cu_last_period) + SUM('card_transactions','amount', event_type='card_fee', statement_period=cu_last_period) - SUM('card_transactions','amount', event_type='card_fee_reversal', statement_period=cu_last_period)"
      - cu_open_disputed: "SUM('card_disputes','disputed_amount', event_type='card_dispute_filed') - SUM('card_disputes','disputed_amount', event_type='card_dispute_resolved') - SUM('card_disputes','disputed_amount', event_type='card_dispute_withdrawn')"
      - cu_reduced_bal: "cu_last_bal - cu_open_disputed"
      - cu_relief: "0 if cu_open_disputed <= 0 else (MX(0, RND(cu_last_min - RND(cu_reduced_bal * P('min_payment_principal_pct') / 100 + cu_int_fees, 2) - cu_last_past_due, 2)) if (cu_reduced_bal * P('min_payment_principal_pct') / 100 + cu_int_fees > P('min_payment_floor_usd')) else MX(0, RND(cu_last_min - MN(P('min_payment_floor_usd'), cu_reduced_bal) - cu_last_past_due, 2)))"
      - cu_due_part: "MX(cu_missed_min, cu_coverage - cu_relief)"
      - cu_promo_12: "LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_interest_12')"
      - cu_promo_18: "LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_interest_18')"
      - cu_promo_start: "cu_promo_18 if (cu_promo_18 and (not cu_promo_12 or cu_promo_18 >= cu_promo_12)) else cu_promo_12"
      - cu_months_left: "(P('promo_financing_months') - MONTHS(cu_promo_start, NOW)) if cu_promo_start else 0"
      - cu_promo_add: "cu_last_promo if (cu_last_promo > 0 and cu_months_left <= K('promo_window_months')) else (RND(cu_last_promo / cu_months_left, 2) if cu_last_promo > 0 else 0)"
      - cu_pay_id: "LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_payment')"
      - cu_pay_date: "LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_payment')"
      - cu_pay_amt: "LATEST('card_transactions','amount', date_field='txn_date', event_type='card_payment')"
      - cu_counted: "cu_pay_amt if (cu_pay_date or '') > cu_missed_due else 0"
      - cu_returned: "SUM('card_transactions','amount', event_type='card_payment_returned', original_card_txn_id=cu_pay_id)"
      - cu_rpf: "SUM('card_transactions','amount', event_type='card_fee', fee_type='returned_payment_fee', original_card_txn_id=cu_pay_id)"
      - cu_addback: "RND(cu_returned + cu_rpf, 2) if ((cu_pay_date or '') > cu_missed_due and cu_returned > 0 and cu_rpf > 0) else (cu_returned if ((cu_pay_date or '') > cu_missed_due and cu_returned > 0) else 0)"
      - result: "RND(MX(0, cu_due_part + cu_addback + cu_promo_add - cu_counted), 2) if cu_missed_period else 0"
    compute_basis:
      cu_missed_period: "The missed statement is the statement of the billing period that the most recent late fee on the account belongs to"
      cu_missed_min: "its minimum payment due is the missed minimum"
      cu_missed_due: "its payment due date is the missed due date; an account with no late fee has no missed statement and no catch-up amount is taken."
      cu_last_min: "the coverage is the minimum payment due shown on the latest statement"
      cu_last_past_due: "the coverage is the past-due amount shown on the latest statement"
      cu_last_bal: "min_payment_principal_pct percent of the latest statement balance less that amount"
      cu_last_promo: "when the latest statement shows a promotional balance"
      cu_last_period: "when the latest statement is for a later billing period than the missed statement"
      cu_last_due: "its payment due date falls no later than coverage_window_days calendar days after the day of the catch-up payment (a due date already passed included)"
      cu_coverage: "In place of the missed minimum, the catch-up coverage follows the statements issued since: when the latest statement is for a later billing period than the missed statement and its payment due date falls no later than coverage_window_days calendar days after the day of the catch-up payment (a due date already passed included), the coverage is the minimum payment due shown on the latest statement; when the latest statement is for a later billing period and its payment due date is later than that, the coverage is the past-due amount shown on the latest statement; when no later statement has been issued, the coverage stays the missed minimum."
      cu_int_fees: "plus the interest and fees of the latest billing period (less fee reversals of that period)"
      cu_open_disputed: "the amount under open billing dispute on the account (the disputed amounts of the account's dispute filings less those of its resolutions and withdrawals)"
      cu_reduced_bal: "the latest statement balance less that amount"
      cu_relief: "when an amount is under open billing dispute and min_payment_principal_pct percent of the latest statement balance less that amount, plus the interest and fees of the latest billing period (less fee reversals of that period), is above the card's min_payment_floor_usd, the relief is the latest statement's minimum payment due less that sum rounded half up to the cent and less the latest statement's past-due amount; when an amount is under open billing dispute and that sum is not above the floor, the relief is the latest statement's minimum payment due less the smaller of the floor and the reduced balance and less the past-due amount; when nothing is under open billing dispute, it stays zero; a relief is never below zero."
      cu_due_part: "The catch-up amount is the larger of the missed minimum and the catch-up coverage less the dispute relief"
      cu_promo_12: "the transaction date of the most recent special financing purchase."
      cu_promo_18: "the transaction date of the most recent special financing purchase."
      cu_promo_start: "the most recent special financing purchase"
      cu_months_left: "the months remaining are the card's promo_financing_months less the full calendar months since the transaction date of the most recent special financing purchase."
      cu_promo_add: "when the latest statement shows a promotional balance and no more than promo_window_months full calendar months of the promotion remain, it is the whole promotional balance; when it shows a promotional balance and more months remain, it is the promotional balance divided by the full calendar months remaining, rounded half up to the cent; when there is no promotional balance it stays zero"
      cu_pay_id: "the most recent payment credited after the missed due date"
      cu_pay_date: "the most recent payment credited after the missed due date"
      cu_pay_amt: "less the most recent payment credited after the missed due date"
      cu_counted: "less the most recent payment credited after the missed due date, never below zero, rounded half up to the cent"
      cu_returned: "when it was returned unpaid with no such fee, the add-back is the returned amount"
      cu_rpf: "when it was returned unpaid and a returned payment fee was assessed for it, the add-back is the returned amount plus that fee"
      cu_addback: "In place of zero, the returned-payment add-back is set by what became of the most recent payment credited after the missed due date: when it was returned unpaid and a returned payment fee was assessed for it, the add-back is the returned amount plus that fee; when it was returned unpaid with no such fee, the add-back is the returned amount; otherwise it stays zero."
      result: "The catch-up amount is the larger of the missed minimum and the catch-up coverage less the dispute relief, plus the returned-payment add-back and the promotional add-on, less the most recent payment credited after the missed due date, never below zero, rounded half up to the cent"
    factors:
      - id: coverage_follow
        effect: method
        decides: cu_coverage
        bindings: [cu_last_due, cu_coverage]
        ladder:
          - when: "a later statement has been issued and its payment due date falls no later than coverage_window_days days after the catch-up payment (a passed due date included)"
            method: "the coverage is the latest statement's minimum payment due"
          - when: "a later statement has been issued and its due date is later than that"
            method: "the coverage is the latest statement's past-due amount"
          - when: "otherwise (no later statement)"
            method: "the coverage is the missed minimum"
        baseline:
          cu_coverage: "cu_missed_min"
        evidence: [history, date]
        cross_difficulty: null
      - id: dispute_relief
        effect: method
        decides: cu_relief
        bindings: [cu_int_fees, cu_open_disputed, cu_reduced_bal, cu_relief]
        ladder:
          - when: "an amount is under open billing dispute and the reduced-balance percentage plus interest and fees is above the card's floor"
            method: "the latest minimum less (the statement formula on the reduced balance, rounded half up) less the past-due amount, never below zero"
          - when: "an amount is under open billing dispute and that sum is not above the floor"
            method: "the latest minimum less the smaller of the floor and the reduced balance less the past-due amount, never below zero"
          - when: "otherwise (nothing under open dispute)"
            method: "zero"
        baseline:
          cu_relief: "0"
        evidence: [history]
        cross_difficulty: null
      - id: promo_paydown_addon
        effect: parameter
        decides: cu_promo_add
        bindings: [cu_last_promo, cu_promo_12, cu_promo_18, cu_promo_start, cu_months_left, cu_promo_add]
        ladder:
          - when: "a promotional balance with no more than promo_window_months full months of the promotion left"
            value: "the whole promotional balance"
          - when: "a promotional balance with more months left"
            value: "the promotional balance divided by the full months left, rounded half up"
          - when: "otherwise"
            value: "0"
        baseline:
          cu_promo_add: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: returned_payment_addback
        effect: parameter
        decides: cu_addback
        bindings: [cu_returned, cu_rpf, cu_addback]
        ladder:
          - when: "the most recent payment after the missed due date was returned unpaid and drew a returned payment fee"
            value: "the returned amount plus that fee"
          - when: "it was returned unpaid with no returned payment fee"
            value: "the returned amount"
          - when: "otherwise"
            value: "0"
        baseline:
          cu_addback: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The missed statement is the statement of the billing period that the most recent late fee on the account belongs
        to; its minimum payment due is the missed minimum and its payment due date is the missed due date; an account with
        no late fee has no missed statement and no catch-up amount is taken.
        The catch-up coverage is the missed minimum, and the dispute relief is zero.
        The catch-up amount is the larger of the missed minimum and the catch-up coverage less the dispute relief, plus the
        returned-payment add-back and the promotional add-on, less the most recent payment credited after the missed due
        date, never below zero, rounded half up to the cent; as standard the returned-payment add-back and the promotional
        add-on are zero.
      params: []
    inputs:
      history:
        - {table: card_statements, aggregate: latest, field: minimum_payment_due}
        - {table: card_transactions, aggregate: latest, field: amount, filters: {event_type: card_payment}}
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: [card_interest_charge, card_fee, card_fee_reversal, card_payment_returned]}}
        - {table: card_disputes, aggregate: sum, field: disputed_amount}
      cross_category: []
  - id: card_ext_courtesy_credit
    base_policy_refs: [card_courtesy_fee_waiver, card_account_closure]
    overwrite:
      - base_policy: card_courtesy_fee_waiver
        superseded_clause: >-
          A reversal always equals the full amount of the fee reversed and points to it through original_card_txn_id;
          partial reversals are not made.
        replaced_by: >-
          For a courtesy reversal of a late fee this policy handles, and only for such a reversal, the amount reversed is
          the courtesy credit worked out below, which may be less than the fee, and it points to the fee through
          original_card_txn_id; every other reversal, including a reversal of a fee assessed in error and an annual fee
          refund on closure, remains the full amount of the fee reversed, points to it through original_card_txn_id and
          is never partial.
      - base_policy: card_courtesy_fee_waiver
        superseded_clause: >-
          and payments credited since the missed due date add up to at least the missed minimum payment due.
        replaced_by: >-
          For a courtesy reversal of a late fee this policy handles, and only for such a reversal, the payment test is
          met when the most recent payment credited after the missed due date has not been returned unpaid and is at
          least the missed minimum; the other tests of the base courtesy rule, the courtesy allowance and the on-time
          statements, remain in force.
    trigger: on_request
    subject: [card_fee_reversal]
    computes: amount
    target_tool: grant_courtesy_credit_38b9fa68
    params:
      standard_share: 0.4
      tenure_long_months: 120
      tenure_mid_months: 60
      tenure_long_share: 0.6
      tenure_mid_share: 0.5
      rel_top_bonus: 0.15
      rel_mid_bonus: 0.08
      rel_top_spend: 1000.00
      rel_mid_spend: 400.00
      err_full_bonus: 0.3
      err_part_bonus: 0.15
      cure_fast_days: 21
      cure_step: 0.01
      cure_slow_days: 45
      cure_late_penalty: 0.1
      hist_two_penalty: 0.3
      hist_one_penalty: 0.15
      waiver_recent_penalty: 0.25
      waiver_older_penalty: 0.1
      share_cap: 1.0
    rule: >-
      A late fee that qualifies for a courtesy reversal under the base courtesy rule is reversed by the courtesy credit
      worked out as follows.
      The late fee being reversed is the most recent late fee on the account; the missed statement is the statement of the billing period that fee belongs to, its minimum payment due is the missed minimum and its payment due date is the missed due date; an account with no late fee has no courtesy credit.
      The courtesy credit is the late fee being reversed times standard_share, rounded half up to the cent.
      For a courtesy reversal of a late fee this policy handles, and only for such a reversal, the amount reversed is
      the courtesy credit worked out below, which may be less than the fee, and it points to the fee through
      original_card_txn_id; every other reversal, including a reversal of a fee assessed in error and an annual fee
      refund on closure, remains the full amount of the fee reversed, points to it through original_card_txn_id and
      is never partial.
      For a courtesy reversal of a late fee this policy handles, and only for such a reversal, the payment test is
      met when the most recent payment credited after the missed due date has not been returned unpaid and is at
      least the missed minimum; the other tests of the base courtesy rule, the courtesy allowance and the on-time
      statements, remain in force.
      In place of standard_share, the courtesy share is the tenure share plus the courtesy relationship bonus, the
      dispute allowance, the cure adjustment, the lateness adjustment and the prior-courtesy adjustment, never below zero
      and never above share_cap.
      The tenure share is tenure_long_share for an account open at least tenure_long_months full calendar months since
      its opened_date, tenure_mid_share for one open at least tenure_mid_months but fewer than tenure_long_months full
      calendar months, and standard_share for any other account.
      The courtesy relationship bonus is rel_top_bonus for a cardmember whose Finch Circle membership is active at Finch
      Circle Platinum, Finch Circle Diamond or Finch Circle Icon and whose Marlowe & Finch purchases charged to the account with a transaction date fewer than 12 full calendar months before today total at least rel_top_spend dollars,
      rel_mid_bonus for a cardmember whose active membership is at Finch Circle Silver or Finch Circle Gold with such
      purchases of at least rel_mid_spend dollars, and zero for every other cardmember.
      The dispute allowance is err_full_bonus when the amount under open billing dispute on the account (the disputed
      amounts of its dispute filings less those of its resolutions and withdrawals) is at least the missed minimum,
      err_part_bonus when it is above zero but less than the missed minimum, and zero when nothing is under open billing
      dispute.
      The cure adjustment is measured on the calendar days from the missed due date to the credited date of the most
      recent payment: when those days are no more than cure_fast_days, it is cure_step times cure_fast_days less those days; when they are more than cure_slow_days, it is minus cure_late_penalty; when they are more than cure_fast_days but no more than cure_slow_days, there is no cure adjustment.
      The lateness adjustment is minus hist_two_penalty when the late fees assessed on the account with a transaction date fewer than 12 full calendar months before today, other than the fee being reversed and less the late fee reversals with reversal_reason assessed_in_error dated fewer than 12 full calendar months before today, number two or more, minus hist_one_penalty when they number
      exactly one, and zero when they number none.
      The prior-courtesy adjustment is minus waiver_recent_penalty when a fee reversal with reversal_reason
      courtesy_waiver has a transaction date fewer than 6 full calendar months before today, minus waiver_older_penalty when there is
      such a reversal dated fewer than 12 full calendar months before today but none dated fewer than 6, and zero when there is none dated fewer than 12 full calendar months before today.
      The courtesy credit is not granted until the most recent payment credited after the missed payment due date stands
      unreturned at no less than the minimum payment due that was missed.
      The courtesy credit is worked out only after the cardmember's most recent Marlowe & Finch refund settled to the card tender, when its card credits fall short of it, carries an open credit-not-posted dispute on the refunded purchase.
    prerequisite:
      - problem: card_ext_catch_up_payment
        kind: value_input
        gate: ct_cured
        form: state
        policy_source: >-
          The courtesy credit is not granted until the most recent payment credited after the missed payment due date
          stands unreturned at no less than the minimum payment due that was missed.
        condition: >-
          The latest card_payment row of the account has a txn_date after the payment_due_date of the statement whose
          statement_period the latest late fee belongs to, an amount at least that statement's minimum_payment_due, and no
          card_payment_returned row pointing to it.
        resolved_by: take_phone_payment_161e7e24
        effect: >-
          Once the catch-up payment is credited the payment test is met, the courtesy credit becomes payable instead of
          nil, and the cure adjustment is measured on that payment's credited date.
      - problem: card_ext_missing_credit_notice
        kind: value_input
        gate: ct_open_disputed
        form: state
        policy_source: >-
          The courtesy credit is worked out only after the cardmember's most recent Marlowe & Finch refund settled to the card tender, when its card credits fall short of it, carries an open credit-not-posted dispute on the refunded purchase.
        condition: >-
          When the card credits naming the cardmember's most recent order_refund record with refund_tender_type mf_card total less than that refund, card_disputes holds an open card_dispute_filed row with dispute_reason credit_not_posted on the card purchase posting of the refunded order.
        resolved_by: file_missing_credit_notice_85b33449
        effect: >-
          The notice's disputed amount becomes the amount under open billing dispute, which sets the dispute allowance of
          the courtesy share.
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, status]
        note: The courtesy relationship bonus reads the tier of the cardmember's active Finch Circle membership.
    compute:
      - ct_fee_id: "LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_fee', fee_type='late_fee')"
      - ct_fee_amt: "LATEST('card_transactions','amount', date_field='txn_date', event_type='card_fee', fee_type='late_fee') or 0"
      - ct_missed_period: "LATEST('card_transactions','statement_period', date_field='txn_date', event_type='card_fee', fee_type='late_fee')"
      - ct_missed_min: "LATEST('card_statements','minimum_payment_due', date_field='statement_date', statement_period=ct_missed_period) or 0"
      - ct_missed_due: "LATEST('card_statements','payment_due_date', date_field='statement_date', statement_period=ct_missed_period) or ''"
      - ct_pay_id: "LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_payment')"
      - ct_pay_date: "LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_payment')"
      - ct_pay_amt: "LATEST('card_transactions','amount', date_field='txn_date', event_type='card_payment')"
      - ct_pay_returned: "SUM('card_transactions','amount', event_type='card_payment_returned', original_card_txn_id=ct_pay_id)"
      - ct_cured: "(ct_pay_date or '') > ct_missed_due and (ct_pay_amt or 0) >= ct_missed_min and ct_pay_returned == 0"
      - ct_tenure_months: "MONTHS(F('opened_date'), NOW)"
      - ct_tenure_share: "K('tenure_long_share') if ct_tenure_months >= K('tenure_long_months') else (K('tenure_mid_share') if ct_tenure_months >= K('tenure_mid_months') else K('standard_share'))"
      - ct_loyalty_tier: "CFIELD('loyalty','variant_name', status='active')"
      - ct_mf_spend_12m: "SUM('card_transactions','amount', within_months=12, date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch')"
      - ct_rel_bonus: "K('rel_top_bonus') if ((ct_loyalty_tier == 'Finch Circle Platinum' or ct_loyalty_tier == 'Finch Circle Diamond' or ct_loyalty_tier == 'Finch Circle Icon') and ct_mf_spend_12m >= K('rel_top_spend')) else (K('rel_mid_bonus') if ((ct_loyalty_tier == 'Finch Circle Silver' or ct_loyalty_tier == 'Finch Circle Gold') and ct_mf_spend_12m >= K('rel_mid_spend')) else 0)"
      - ct_open_disputed: "SUM('card_disputes','disputed_amount', event_type='card_dispute_filed') - SUM('card_disputes','disputed_amount', event_type='card_dispute_resolved') - SUM('card_disputes','disputed_amount', event_type='card_dispute_withdrawn')"
      - ct_err_bonus: "K('err_full_bonus') if ct_open_disputed >= ct_missed_min else (K('err_part_bonus') if ct_open_disputed > 0 else 0)"
      - ct_cure_days: "DAYS(ct_missed_due, ct_pay_date) if (ct_pay_date and ct_missed_due) else 0"
      - ct_cure_adj: "K('cure_step') * (K('cure_fast_days') - ct_cure_days) if ct_cure_days <= K('cure_fast_days') else ((0 - K('cure_late_penalty')) if ct_cure_days > K('cure_slow_days') else 0)"
      - ct_late_others: "COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_fee', fee_type='late_fee') - COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_fee_reversal', fee_type='late_fee', reversal_reason='assessed_in_error') - 1"
      - ct_hist_adj: "(0 - K('hist_two_penalty')) if ct_late_others >= 2 else ((0 - K('hist_one_penalty')) if ct_late_others == 1 else 0)"
      - ct_waivers_6m: "COUNT('card_transactions', within_months=6, date_field='txn_date', event_type='card_fee_reversal', reversal_reason='courtesy_waiver')"
      - ct_waivers_12m: "COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_fee_reversal', reversal_reason='courtesy_waiver')"
      - ct_waiver_adj: "(0 - K('waiver_recent_penalty')) if ct_waivers_6m >= 1 else ((0 - K('waiver_older_penalty')) if ct_waivers_12m >= 1 else 0)"
      - ct_share: "MX(0, MN(K('share_cap'), ct_tenure_share + ct_rel_bonus + ct_err_bonus + ct_cure_adj + ct_hist_adj + ct_waiver_adj))"
      - result: "RND(ct_fee_amt * ct_share, 2) if (ct_cured and ct_fee_amt > 0) else 0"
    compute_basis:
      ct_fee_id: "The late fee being reversed is the most recent late fee on the account"
      ct_fee_amt: "The late fee being reversed is the most recent late fee on the account"
      ct_missed_period: "the missed statement is the statement of the billing period that fee belongs to"
      ct_missed_min: "its minimum payment due is the missed minimum"
      ct_missed_due: "its payment due date is the missed due date; an account with no late fee has no courtesy credit."
      ct_pay_id: "the most recent payment credited after the missed due date"
      ct_pay_date: "the credited date of the most recent payment"
      ct_pay_amt: "is at least the missed minimum"
      ct_pay_returned: "has not been returned unpaid"
      ct_cured: "the payment test is met when the most recent payment credited after the missed due date has not been returned unpaid and is at least the missed minimum"
      ct_tenure_months: "full calendar months since its opened_date"
      ct_tenure_share: "The tenure share is tenure_long_share for an account open at least tenure_long_months full calendar months since its opened_date, tenure_mid_share for one open at least tenure_mid_months but fewer than tenure_long_months full calendar months, and standard_share for any other account."
      ct_loyalty_tier: "a cardmember whose Finch Circle membership is active at Finch Circle Platinum, Finch Circle Diamond or Finch Circle Icon"
      ct_mf_spend_12m: "whose Marlowe & Finch purchases charged to the account with a transaction date fewer than 12 full calendar months before today total at least rel_top_spend dollars"
      ct_rel_bonus: "The courtesy relationship bonus is rel_top_bonus for a cardmember whose Finch Circle membership is active at Finch Circle Platinum, Finch Circle Diamond or Finch Circle Icon and whose Marlowe & Finch purchases charged to the account with a transaction date fewer than 12 full calendar months before today total at least rel_top_spend dollars, rel_mid_bonus for a cardmember whose active membership is at Finch Circle Silver or Finch Circle Gold with such purchases of at least rel_mid_spend dollars, and zero for every other cardmember."
      ct_open_disputed: "the amount under open billing dispute on the account (the disputed amounts of its dispute filings less those of its resolutions and withdrawals)"
      ct_err_bonus: "The dispute allowance is err_full_bonus when the amount under open billing dispute on the account (the disputed amounts of its dispute filings less those of its resolutions and withdrawals) is at least the missed minimum, err_part_bonus when it is above zero but less than the missed minimum, and zero when nothing is under open billing dispute."
      ct_cure_days: "The cure adjustment is measured on the calendar days from the missed due date to the credited date of the most recent payment"
      ct_cure_adj: "when those days are no more than cure_fast_days, it is cure_step times cure_fast_days less those days; when they are more than cure_slow_days, it is minus cure_late_penalty; when they are more than cure_fast_days but no more than cure_slow_days, there is no cure adjustment."
      ct_late_others: "the late fees assessed on the account with a transaction date fewer than 12 full calendar months before today, other than the fee being reversed and less the late fee reversals with reversal_reason assessed_in_error dated fewer than 12 full calendar months before today"
      ct_hist_adj: "The lateness adjustment is minus hist_two_penalty when the late fees assessed on the account with a transaction date fewer than 12 full calendar months before today, other than the fee being reversed and less the late fee reversals with reversal_reason assessed_in_error dated fewer than 12 full calendar months before today, number two or more, minus hist_one_penalty when they number exactly one, and zero when they number none."
      ct_waivers_6m: "a fee reversal with reversal_reason courtesy_waiver has a transaction date fewer than 6 full calendar months before today"
      ct_waivers_12m: "such a reversal dated fewer than 12 full calendar months before today but none dated fewer than 6"
      ct_waiver_adj: "The prior-courtesy adjustment is minus waiver_recent_penalty when a fee reversal with reversal_reason courtesy_waiver has a transaction date fewer than 6 full calendar months before today, minus waiver_older_penalty when there is such a reversal dated fewer than 12 full calendar months before today but none dated fewer than 6, and zero when there is none dated fewer than 12 full calendar months before today."
      ct_share: "In place of standard_share, the courtesy share is the tenure share plus the courtesy relationship bonus, the dispute allowance, the cure adjustment, the lateness adjustment and the prior-courtesy adjustment, never below zero and never above share_cap."
      result: "The courtesy credit is the late fee being reversed times standard_share, rounded half up to the cent."
    factors:
      - id: tenure_share
        effect: parameter
        decides: ct_tenure_share
        bindings: [ct_tenure_months, ct_tenure_share]
        ladder:
          - when: "account open at least tenure_long_months full months"
            value: "K('tenure_long_share')"
          - when: "open at least tenure_mid_months but fewer than tenure_long_months"
            value: "K('tenure_mid_share')"
          - when: "otherwise"
            value: "K('standard_share')"
        baseline:
          ct_tenure_share: "K('standard_share')"
        evidence: [date]
        cross_difficulty: null
      - id: courtesy_relationship_bonus
        effect: parameter
        decides: ct_rel_bonus
        bindings: [ct_loyalty_tier, ct_mf_spend_12m, ct_rel_bonus]
        ladder:
          - when: "active Finch Circle Platinum, Diamond or Icon membership AND Marlowe & Finch card purchases dated fewer than 12 full calendar months before today of at least rel_top_spend"
            value: "K('rel_top_bonus')"
          - when: "active Finch Circle Silver or Gold membership AND such purchases of at least rel_mid_spend"
            value: "K('rel_mid_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          ct_rel_bonus: "0"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: dispute_allowance
        effect: parameter
        decides: ct_err_bonus
        bindings: [ct_open_disputed, ct_err_bonus]
        ladder:
          - when: "amount under open billing dispute at least the missed minimum"
            value: "K('err_full_bonus')"
          - when: "amount under open billing dispute above zero but less than the missed minimum"
            value: "K('err_part_bonus')"
          - when: "otherwise (nothing under open dispute)"
            value: "0"
        baseline:
          ct_err_bonus: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cure_speed
        effect: method
        decides: ct_cure_adj
        bindings: [ct_cure_days, ct_cure_adj]
        ladder:
          - when: "no more than cure_fast_days days from the missed due date to the most recent payment"
            method: "a sliding adjustment: cure_step times (cure_fast_days less the days taken)"
          - when: "more than cure_slow_days days"
            method: "a flat deduction of cure_late_penalty"
          - when: "otherwise (more than cure_fast_days but no more than cure_slow_days days)"
            method: "no cure adjustment"
        baseline:
          ct_cure_adj: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: lateness_record
        effect: parameter
        decides: ct_hist_adj
        bindings: [ct_late_others, ct_hist_adj]
        ladder:
          - when: "two or more other late fees dated fewer than 12 full calendar months before today, net of assessed-in-error reversals"
            value: "minus K('hist_two_penalty')"
          - when: "exactly one"
            value: "minus K('hist_one_penalty')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          ct_hist_adj: "0"
        evidence: [history]
        cross_difficulty: null
      - id: prior_courtesy
        effect: parameter
        decides: ct_waiver_adj
        bindings: [ct_waivers_6m, ct_waivers_12m, ct_waiver_adj]
        ladder:
          - when: "a courtesy reversal dated fewer than 6 full calendar months before today"
            value: "minus K('waiver_recent_penalty')"
          - when: "a courtesy reversal dated fewer than 12 but none fewer than 6 full calendar months before today"
            value: "minus K('waiver_older_penalty')"
          - when: "otherwise"
            value: "0"
        baseline:
          ct_waiver_adj: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The late fee being reversed is the most recent late fee on the account; the missed statement is the statement of the billing period that fee belongs to, its minimum payment due is the missed minimum and its payment due date is the missed due date; an account with no late fee has no courtesy credit.
        The courtesy credit is the late fee being reversed times standard_share, rounded half up to the cent.
      params: [standard_share]
    inputs:
      history:
        - {table: card_transactions, aggregate: latest, field: amount, filters: {event_type: [card_fee, card_payment]}}
        - {table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: [card_fee, card_fee_reversal]}}
        - {table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase, merchant_category: marlowe_finch}}
        - {table: card_disputes, aggregate: sum, field: disputed_amount}
      cross_category: [loyalty]
