# Policy charter: Marlowe & Finch Credit Cards (store card and co-brand Mastercard program,
# issued by Northgate Retail Bank, N.A.). Single registry of every card number in the scenario.

category: card
display_name: Marlowe & Finch Credit Cards

binding:
  holding_table: card_accounts
  event_tables: [card_transactions, card_statements, card_disputes]
  intake_tables: [card_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: revolving_balance}

lifecycle:
  states: [applied, active, restricted, closed, charged_off, declined]
  transitions:
    - {from: applied, to: active, by: system, means: "Northgate Retail Bank approves the application, assigns the credit line and the statement closing day, and the account opens."}
    - {from: applied, to: declined, by: system, means: "The application does not meet the credit criteria of the requested card and is declined; an adverse action notice is mailed."}
    - {from: active, to: restricted, by: system, means: "Charging privileges are suspended because the account has missed the configured number of consecutive minimum payments."}
    - {from: restricted, to: active, by: system, means: "Charging privileges are restored after the full past-due amount has been paid."}
    - {from: active, to: closed, by: user, means: "The cardmember asks to close the account; any remaining balance stays payable under the existing terms."}
    - {from: restricted, to: closed, by: user, means: "The cardmember closes a restricted account; the remaining balance stays payable under the existing terms."}
    - {from: restricted, to: charged_off, by: system, means: "The account reaches the charge-off day count past due and is charged off and placed with recovery."}

accounts:
  - key: revolving_balance
    unit: USD
    meaning: "The amount the cardmember owes on the card account; purchases, fees, interest, returned payments, dispute rebills and credit-balance refunds raise it, and payments, merchandise return credits, fee reversals and dispute credits lower it. A negative value is a credit balance owed to the cardmember."

parameter_schema:
  card_network: "Card network of the product - private_label (accepted only at Marlowe & Finch) or mastercard (co-brand, accepted wherever Mastercard is); string enum."
  acceptance_scope: "Where the card can be used - marlowe_finch_only (stores, mfinch.com and the app) or mastercard_network; string enum."
  application_open: "Whether a new applicant can apply directly for this card (true) or reaches it only by a status upgrade from a lower card of the same network (false); boolean."
  min_credit_score: "Minimum FICO Score 8 at the moment of application for the card to be approved; integer points."
  min_applicant_age: "Minimum age of the primary applicant on the application date, in whole years; integer."
  min_annual_income_usd: "Minimum stated gross annual income on the application; USD, 2 decimals; 0.00 means no income floor beyond ability-to-pay."
  status_entry_annual_card_spend_usd: "Net Marlowe & Finch purchases charged to the card in one calendar year (card_msr_calendar_year_card_spend) that earns this card status at the next status review; USD, 2 decimals; 0.00 for a card opened by application."
  status_upgrade_from: "The card from which a status upgrade into this card is made (official card name), or not_applicable for a card opened by application; string."
  initial_credit_line_min_usd: "Lowest credit line assigned at approval; USD, 2 decimals."
  initial_credit_line_max_usd: "Highest credit line assigned at approval; USD, 2 decimals."
  max_credit_line_usd: "Highest credit line the account can reach through credit line increases; USD, 2 decimals."
  purchase_apr_pct: "Variable purchase Annual Percentage Rate applied to the average daily purchase balance; percent, 2 decimals."
  daily_periodic_rate_divisor: "Number of days the APR is divided by to obtain the daily periodic rate; integer days."
  minimum_interest_charge_usd: "Smallest interest charge assessed in a billing cycle in which any interest is due; USD, 2 decimals."
  grace_period_days: "Days from the statement closing date to the payment due date, during which new purchases accrue no interest when the previous statement balance was paid in full; integer calendar days."
  late_fee_first_usd: "Late fee for a missed minimum payment when no late fee was assessed in the lookback window; USD, 2 decimals."
  late_fee_repeat_usd: "Late fee for a missed minimum payment when another late fee was assessed within the lookback window; USD, 2 decimals."
  late_fee_repeat_lookback_cycles: "Number of preceding billing cycles searched for an earlier late fee to decide between the first and the repeat late fee; integer cycles."
  returned_payment_fee_usd: "Fee for a payment returned unpaid by the cardmember's bank; USD, 2 decimals."
  min_payment_floor_usd: "Dollar floor of the minimum payment due (or the full statement balance when that is lower); USD, 2 decimals."
  min_payment_principal_pct: "Percent of the statement balance (excluding interest and fees of the cycle) included in the minimum payment before interest and fees are added; percent."
  annual_fee_usd: "Annual fee billed on the account anniversary statement; USD, 2 decimals; 0.00 means no annual fee."
  annual_fee_first_year_waived: "Whether the annual fee is waived for the first card year; boolean, or not_applicable when the card has no annual fee."
  annual_fee_waiver_spend_usd: "Card spend in the preceding card year (all merchants) at or above which the annual fee is waived; USD, 2 decimals, or not_applicable when the card has no annual fee."
  foreign_transaction_fee_pct: "Fee on purchases made in a foreign currency or processed outside the United States, as a percent of the U.S. dollar amount; percent, or not_applicable for a store-only card."
  welcome_discount_pct: "Percent taken off Marlowe & Finch purchases charged to a newly approved account inside the welcome window; percent, or not_applicable for a card reached by status upgrade."
  welcome_discount_window_days: "Calendar days, counting the approval date as day 1, during which the welcome discount applies; integer, or not_applicable."
  welcome_discount_cap_usd: "Maximum total welcome discount across all purchases in the window; USD, 2 decimals, or not_applicable."
  mf_bonus_points_per_dollar: "Finch Circle bonus points per net dollar of Marlowe & Finch purchases charged to the card, added on top of the member's base earn; number per USD."
  outside_points_per_dollar: "Finch Circle points per dollar of purchases charged outside Marlowe & Finch; number per USD, or not_applicable for a store-only card."
  grocery_gas_points_per_dollar: "Finch Circle points per dollar charged at supermarkets and gas stations (Mastercard merchant category codes 5411 and 5541/5542); number per USD, or not_applicable."
  card_replacement_standard_fee_usd: "Fee for a replacement card sent by standard mail; USD, 2 decimals."
  card_replacement_expedited_fee_usd: "Fee for a replacement card sent by expedited courier; USD, 2 decimals."
  card_replacement_standard_business_days: "Business days for a standard replacement card to arrive; integer."
  card_replacement_expedited_business_days: "Business days for an expedited replacement card to arrive; integer."
  unauthorized_use_liability_usd: "Cardmember liability for unauthorized charges posted to the account; USD, 2 decimals."
  cli_min_months_since_open: "Full calendar months that must have passed since the account opened_date before a credit line increase is considered; integer months."
  cli_min_months_since_last_change: "Full calendar months that must have passed since the last credit line change before another increase is considered; integer months."
  cli_on_time_statements_required: "Number of most recent consecutive statements whose minimum payment must have been received by the due date for an increase; integer statements."
  cli_max_increase_pct: "Largest single credit line increase as a percent of the current credit line; percent."
  dispute_notice_window_days: "Calendar days after the statement date of the first statement on which a charge appeared within which a billing-error notice must be received; integer days."
  dispute_ack_days: "Calendar days after the notice is received within which the dispute is acknowledged in writing; integer days."
  dispute_resolution_max_billing_cycles: "Maximum number of complete billing cycles after the notice within which the dispute is resolved; integer cycles."
  dispute_resolution_max_days: "Absolute maximum calendar days after the notice within which the dispute is resolved; integer days."
  dispute_provisional_credit_business_days: "Business days after the notice within which a temporary credit for the disputed amount posts on unauthorized-charge and duplicate-charge disputes; integer."
  restriction_consecutive_missed_payments: "Consecutive statements whose minimum payment was not received by the due date that cause charging privileges to be suspended; integer."
  charge_off_days_past_due: "Days past due at which a restricted account is charged off; integer days."
  credit_balance_refund_business_days: "Business days after a cardmember's refund request within which a credit balance is refunded; integer."
  credit_balance_auto_refund_months: "Months a credit balance may remain on the account before it is refunded without a request; integer months."
  credit_balance_refund_min_usd: "Smallest credit balance refunded on request; USD, 2 decimals."
  payment_cutoff_time_et: "Eastern Time cut-off on a business day after which a payment is credited the next business day; HH:MM."
  payment_channels: "Channels through which a payment can be made; list of payment_channel enum values."
  autopay_options: "AutoPay amounts the cardmember can choose; list of autopay_option enum values."
  autopay_change_lead_business_days: "Business days before a payment due date by which an AutoPay change must be made to apply to that due date; integer."
  courtesy_late_fee_waivers_per_12_months: "Number of late fees that may be reversed as a courtesy in any rolling 12-month window; integer."
  courtesy_waiver_on_time_statements_required: "Number of statements immediately before the late one whose minimum payment arrived on time, required for a courtesy waiver; integer."
  promo_financing_min_purchase_usd: "Smallest single eligible purchase (one purchase record) that qualifies for special financing; USD, 2 decimals."
  promo_financing_months: "Length of the deferred-interest special financing promotion in months; integer."
  promo_financing_eligible_classes: "Merchandise classes (official Merchandise Purchases class names) whose purchases qualify for special financing; list."

