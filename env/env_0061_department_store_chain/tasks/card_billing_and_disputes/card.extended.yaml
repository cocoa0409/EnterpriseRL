    annual_fee_usd: 79.00
    annual_fee_first_year_waived: true
    annual_fee_waiver_spend_usd: 15000.00
    foreign_transaction_fee_pct: 0.00
    welcome_discount_pct: 25
    welcome_discount_window_days: 2
    welcome_discount_cap_usd: 150.00
    mf_bonus_points_per_dollar: 3
    outside_points_per_dollar: 1.50
    grocery_gas_points_per_dollar: 3
    card_replacement_standard_fee_usd: 0.00
    card_replacement_expedited_fee_usd: 0.00
    card_replacement_standard_business_days: 7
    card_replacement_expedited_business_days: 2
    unauthorized_use_liability_usd: 0.00
    cli_min_months_since_open: 6
    cli_min_months_since_last_change: 6
    cli_on_time_statements_required: 6
    cli_max_increase_pct: 50
    dispute_notice_window_days: 60
    dispute_ack_days: 30
    dispute_resolution_max_billing_cycles: 2
    dispute_resolution_max_days: 90
    dispute_provisional_credit_business_days: 5
