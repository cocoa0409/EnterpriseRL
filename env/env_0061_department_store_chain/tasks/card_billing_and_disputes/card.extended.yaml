      params: [foreign_transaction_fee_pct, purchase_apr_pct, daily_periodic_rate_divisor]
    inputs:
      history:
        - {table: card_transactions, aggregate: latest, field: original_card_txn_id, filters: {event_type: card_fee, fee_type: foreign_transaction_fee}}
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: [card_purchase, card_fee, card_interest_charge]}}
        - {table: card_transactions, aggregate: latest, field: amount, filters: {event_type: card_fee, fee_type: returned_payment_fee}}
