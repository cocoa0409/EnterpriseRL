  - id: loyalty_ext_note_reinstatement
    base_policy_refs: [loyalty_note_reinstatement, loyalty_note_conversion, loyalty_expired_note_courtesy, loyalty_birthday_reward]
    overwrite:
      - base_policy: loyalty_note_reinstatement
        superseded_clause: >-
          When merchandise from a purchase paid in part with notes is returned and refunded, a new note
          (issue_reason return_reinstatement) is issued for the note value attributable to the returned
          merchandise: the whole note value applied to the purchase when every item is returned, otherwise
          that value times the returned merchandise's share of the purchase's merchandise subtotal before
          notes, rounded half up to the cent.
        replaced_by: >-
          For a refunded return this policy handles, and only for such a return of merchandise paid in part
          with Finch Notes, one new reinstatement note naming the return and the original note is issued for
          the reinstated note value worked out below, rounded half up to the cent; the original note's
          expiry rule for the new note, the one reinstatement per return and original note, and every other
          note rule remain under the base rules.
    trigger: state_due
    subject: [loyalty_note_issue]
    computes: note_amount
    target_tool: reinstate_returned_note_1c0adac4
    params:
      half_share: 0.5
      expired_share: 0.8
      expiring_share: 0.9
      expiring_days: 14
      slow_return_days: 30
      prompt_return_days: 14
      slow_share: 0.9
      late_share: 0.95
      top_card_uplift: 1.0
      card_uplift: 0.5
    rule: >-
      The returned unit is the member's purchase record most recently received back in returned status, and the
      original note is the Finch Note redeemed on that unit. For a refunded return this policy handles, and only
      for such a return of merchandise paid in part with Finch Notes, one new reinstatement note naming the
      return and the original note is issued for the reinstated note value worked out below, rounded half up to
      the cent; the original note's expiry rule for the new note, the one reinstatement per return and original
      note, and every other note rule remain under the base rules. The reinstated note value is the
      reinstatement base value times one minus the reinstatement fee share, times the reinstatement lapse share,
      times the reinstatement return-timing share, plus the reinstatement card uplift, rounded half up to the
      cent once, at the end. The reinstatement base value is the whole Finch Note value applied to the returned
      unit's order. The reinstatement fee share is none (0). The reinstatement lapse share and the reinstatement
      return-timing share are the whole (1). The reinstatement card uplift is 0.00. When other units of the
      order are kept and a Finch Note allocation is recorded on the returned unit, the reinstatement base value
      is the Finch Note value allocated to the returned unit; when other units of the order are kept and no
      allocation is recorded on it, it is the order's Finch Note value times the returned unit's unit price
      divided by the order's merchandise subtotal; otherwise it stays the whole Finch Note value applied to the
      order. The reinstatement fee share is the restocking fee deducted from the refund divided by the refunded
      merchandise before that fee (the refund amount plus the fee, less the sales tax refunded) when a
      restocking fee was deducted, one half of the prepaid label or carrier pickup fee deducted divided by the
      refunded merchandise before that fee (the refund amount plus the fee, less the sales tax refunded) when
      such a fee was deducted, and none (0) otherwise. The reinstatement lapse share is 0.80 when the original
      note's issue entry on the membership shows an expiry date that has passed on the reinstatement date, 0.90
      when that issue entry shows an expiry date falling 0 to 14 calendar days after the reinstatement date, and
      1 otherwise. The reinstatement return-timing share is 0.90 when the return was authorized more than 30
      calendar days after the unit was completed, 0.95 when it was authorized more than 14 and up to 30 days
      after, and 1 otherwise. The reinstatement card uplift is 1.00 when the card account charged for the unit
      is active and is a Store Card Elite or a World Elite Mastercard, 0.50 when it is active and is any other
      Marlowe & Finch card, and 0.00 otherwise.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [purchase_id, order_number, unit_price, finch_notes_applied, status, returned_date, completed_date, card_account_id, order_events.restocking_fee_amount, order_events.return_fee_amount, return_requests.created_at]
        note: "The returned unit and its order decide share_basis; its refund decides fee_share; its return record decides return_speed."
      - category: card
        as: branch
        reads: [variant_name, status]
        note: "The charged card's kind and status decide cardmember_uplift."
    compute:
      - ret_pid: "XLATEST('order', 'purchases', 'purchase_id', date_field='returned_date', status='returned')"
      - ret_order: "XLATEST('order', 'purchases', 'order_number', date_field='returned_date', status='returned')"
      - ret_unit_price: "XLATEST('order', 'purchases', 'unit_price', date_field='returned_date', status='returned')"
      - order_notes: "XSUM('order', 'purchases', 'finch_notes_applied', order_number=ret_order)"
      - order_subtotal: "XSUM('order', 'purchases', 'unit_price', order_number=ret_order)"
      - kept_units: "XCOUNT('order', 'purchases', order_number=ret_order, status='completed')"
      - ret_alloc: "XLATEST('order', 'purchases', 'finch_notes_applied', date_field='returned_date', status='returned')"
      - note_base: "ret_alloc if (kept_units > 0 and ret_alloc > 0) else (order_notes * ret_unit_price / order_subtotal if (kept_units > 0 and order_subtotal > 0) else order_notes)"
      - refund_fee: "XLATEST('order', 'order_events', 'restocking_fee_amount', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - refund_label: "XLATEST('order', 'order_events', 'return_fee_amount', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - refund_amt: "XLATEST('order', 'order_events', 'amount', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - refund_tax: "XLATEST('order', 'order_events', 'tax_refunded', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - fee_pct: "refund_fee / (refund_amt + refund_fee - refund_tax) if (refund_fee and refund_fee > 0) else (K('half_share') * refund_label / (refund_amt + refund_label - refund_tax) if (refund_label and refund_label > 0) else 0)"
      - orig_code: "LATEST('loyalty_note_ledger', 'note_code', date_field='txn_date', event_type='loyalty_note_redeem', purchase_id=ret_pid)"
      - orig_expiry: "LATEST('loyalty_note_ledger', 'expiry_date', date_field='issue_date', event_type='loyalty_note_issue', note_code=orig_code)"
      - orig_issued: "COUNT('loyalty_note_ledger', event_type='loyalty_note_issue', note_code=orig_code)"
      - expiry_gap: "DAYS(NOW, orig_expiry) if orig_expiry else 9999"
      - lapse_share: "K('expired_share') if (orig_issued > 0 and expiry_gap < 0) else (K('expiring_share') if (orig_issued > 0 and expiry_gap <= K('expiring_days')) else 1)"
      - ret_completed: "XLATEST('order', 'purchases', 'completed_date', date_field='returned_date', status='returned')"
      - ret_authorized: "XLATEST('order', 'return_requests', 'created_at', date_field='created_at', purchase_id=ret_pid)"
      - return_gap: "DAYS(ret_completed, ret_authorized) if (ret_completed and ret_authorized) else 0"
      - timing_share: "K('slow_share') if return_gap > K('slow_return_days') else (K('late_share') if return_gap > K('prompt_return_days') else 1)"
      - ret_card: "XLATEST('order', 'purchases', 'card_account_id', date_field='returned_date', status='returned')"
      - uplift_card: "CFIELD('card', 'variant_name', card_account_id=ret_card)"
      - uplift_status: "CFIELD('card', 'status', card_account_id=ret_card)"
      - uplift: "K('top_card_uplift') if (uplift_status == 'active' and (uplift_card == 'Marlowe & Finch Store Card Elite' or uplift_card == 'Marlowe & Finch World Elite Mastercard')) else (K('card_uplift') if (uplift_status == 'active' and uplift_card != None) else 0)"
      - result: "int((note_base * (1 - fee_pct) * lapse_share * timing_share + uplift) * 100 + 0.5) / 100"
    compute_basis:
      ret_pid: "The returned unit is the member's purchase record most recently received back in returned status"
      ret_order: "The reinstatement base value is the whole Finch Note value applied to the returned unit's order."
      ret_unit_price: "it is the order's Finch Note value times the returned unit's unit price divided by the order's merchandise subtotal"
      order_notes: "The reinstatement base value is the whole Finch Note value applied to the returned unit's order."
      order_subtotal: "it is the order's Finch Note value times the returned unit's unit price divided by the order's merchandise subtotal"
      kept_units: "When other units of the order are kept and a Finch Note allocation is recorded on the returned unit"
      ret_alloc: "the reinstatement base value is the Finch Note value allocated to the returned unit"
      note_base: "When other units of the order are kept and a Finch Note allocation is recorded on the returned unit, the reinstatement base value is the Finch Note value allocated to the returned unit; when other units of the order are kept and no allocation is recorded on it, it is the order's Finch Note value times the returned unit's unit price divided by the order's merchandise subtotal; otherwise it stays the whole Finch Note value applied to the order."
      refund_fee: "The reinstatement fee share is the restocking fee deducted from the refund divided by the refunded merchandise before that fee (the refund amount plus the fee, less the sales tax refunded) when a restocking fee was deducted"
      refund_label: "one half of the prepaid label or carrier pickup fee deducted divided by the refunded merchandise before that fee (the refund amount plus the fee, less the sales tax refunded) when such a fee was deducted"
      fee_pct: "The reinstatement fee share is the restocking fee deducted from the refund divided by the refunded merchandise before that fee (the refund amount plus the fee, less the sales tax refunded) when a restocking fee was deducted, one half of the prepaid label or carrier pickup fee deducted divided by the refunded merchandise before that fee (the refund amount plus the fee, less the sales tax refunded) when such a fee was deducted, and none (0) otherwise."
      refund_amt: "the refund amount plus the fee, less the sales tax refunded"
      refund_tax: "the refund amount plus the fee, less the sales tax refunded"
      orig_code: "the original note is the Finch Note redeemed on that unit."
      orig_expiry: "The reinstatement lapse share is 0.80 when the original note's issue entry on the membership shows an expiry date that has passed on the reinstatement date"
      orig_issued: "The reinstatement lapse share is 0.80 when the original note's issue entry on the membership shows an expiry date that has passed on the reinstatement date"
      expiry_gap: "0.90 when that issue entry shows an expiry date falling 0 to 14 calendar days after the reinstatement date"
      lapse_share: "The reinstatement lapse share is 0.80 when the original note's issue entry on the membership shows an expiry date that has passed on the reinstatement date, 0.90 when that issue entry shows an expiry date falling 0 to 14 calendar days after the reinstatement date, and 1 otherwise."
      ret_completed: "The reinstatement return-timing share is 0.90 when the return was authorized more than 30 calendar days after the unit was completed"
      ret_authorized: "The reinstatement return-timing share is 0.90 when the return was authorized more than 30 calendar days after the unit was completed"
      return_gap: "The reinstatement return-timing share is 0.90 when the return was authorized more than 30 calendar days after the unit was completed"
      timing_share: "The reinstatement return-timing share is 0.90 when the return was authorized more than 30 calendar days after the unit was completed, 0.95 when it was authorized more than 14 and up to 30 days after, and 1 otherwise."
      ret_card: "The reinstatement card uplift is 1.00 when the card account charged for the unit is active and is a Store Card Elite or a World Elite Mastercard"
      uplift_card: "The reinstatement card uplift is 1.00 when the card account charged for the unit is active and is a Store Card Elite or a World Elite Mastercard"
      uplift_status: "0.50 when it is active and is any other Marlowe & Finch card, and 0.00 otherwise."
      uplift: "The reinstatement card uplift is 1.00 when the card account charged for the unit is active and is a Store Card Elite or a World Elite Mastercard, 0.50 when it is active and is any other Marlowe & Finch card, and 0.00 otherwise."
      result: "The reinstated note value is the reinstatement base value times one minus the reinstatement fee share, times the reinstatement lapse share, times the reinstatement return-timing share, plus the reinstatement card uplift, rounded half up to the cent once, at the end."
    factors:
      - id: share_basis
        effect: method
        decides: note_base
        bindings: [ret_order, order_notes, order_subtotal, kept_units, ret_alloc, note_base]
        ladder:
          - when: "other units of the order are kept AND a Finch Note allocation is recorded on the returned unit"
            method: "the base value is the Finch Note value allocated to the returned unit"
          - when: "other units of the order are kept and no allocation is recorded on the returned unit"
            method: "the base value is the order's Finch Note value times the unit price over the order's merchandise subtotal"
          - when: "otherwise"
            method: "the base value is the whole Finch Note value applied to the order"
        baseline:
          note_base: "order_notes"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: fee_share
        effect: parameter
        decides: fee_pct
        bindings: [refund_fee, refund_label, refund_amt, refund_tax, fee_pct]
        ladder:
          - when: "a restocking fee was deducted from the refund"
            value: "restocking fee / refunded merchandise before the fee"
          - when: "a prepaid label or carrier pickup fee was deducted"
            value: "K('half_share') x fee / refunded merchandise before the fee"
          - when: "otherwise"
            value: "0"
        baseline:
          fee_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: expired_original
        effect: parameter
        decides: lapse_share
        bindings: [orig_code, orig_expiry, orig_issued, expiry_gap, lapse_share]
        ladder:
          - when: "the original note's issue entry shows an expiry date that has passed on the reinstatement date"
            value: "K('expired_share')"
          - when: "that issue entry shows an expiry date falling 0 to 14 calendar days after the reinstatement date"
            value: "K('expiring_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          lapse_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: return_speed
        effect: parameter
        decides: timing_share
        bindings: [ret_completed, ret_authorized, return_gap, timing_share]
        ladder:
          - when: "the return was authorized more than 30 calendar days after the unit was completed"
            value: "K('slow_share')"
          - when: "more than 14 and up to 30 days after"
            value: "K('late_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          timing_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: order
      - id: cardmember_uplift
        effect: parameter
        decides: uplift
        bindings: [uplift_card, uplift_status, uplift]
        ladder:
          - when: "the charged card account is active AND is a Store Card Elite or a World Elite Mastercard"
            value: "K('top_card_uplift')"
          - when: "the charged card account is active AND is any other Marlowe & Finch card"
            value: "K('card_uplift')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          uplift: "0"
        evidence: [cross_category]
        cross_difficulty: card
    baseline:
      rule: >-
        The reinstated note value is the reinstatement base value times one minus the reinstatement fee share,
        times the reinstatement lapse share, times the reinstatement return-timing share, plus the
        reinstatement card uplift, rounded half up to the cent once, at the end. The reinstatement base value
        is the whole Finch Note value applied to the returned unit's order. The reinstatement fee share is
        none (0). The reinstatement lapse share and the reinstatement return-timing share are the whole (1).
        The reinstatement card uplift is 0.00.
      params: []
    inputs:
      history:
        - {"table": "loyalty_note_ledger", "aggregate": "latest", "field": "note_code", "filters": {"event_type": "loyalty_note_redeem"}}
        - {"category": "order", "table": "purchases", "aggregate": "sum", "field": "finch_notes_applied", "filters": {}}
        - {"category": "order", "table": "order_events", "aggregate": "latest", "field": "restocking_fee_amount", "filters": {"event_type": "order_refund"}}
      cross_category: [order, card]
  - id: loyalty_ext_courtesy_note_reissue
    base_policy_refs: [loyalty_expired_note_courtesy, loyalty_note_conversion, loyalty_note_reinstatement, loyalty_birthday_reward]
    overwrite:
      - base_policy: loyalty_expired_note_courtesy
        superseded_clause: >-
          The reissued note has the original note_amount, names the original_note_code, and its expiry_date
          is the reissue date plus courtesy_note_validity_days minus one day.
        replaced_by: >-
          For a courtesy reissue this policy handles, and only for such a reissue, the reissued note keeps
          the original note's value and names the original note, and its expiry date is the reissue date
          plus the courtesy validity days worked out below minus one day; every other note keeps its base
          expiry rule.
      - base_policy: loyalty_expired_note_courtesy
        superseded_clause: >-
          A Finch Note that lapsed with expire_reason validity_ended may be reissued once as a courtesy
          (issue_reason courtesy_reissue) at the member's request, recorded as a loyalty_requests record
          with request_type expired_note_reissue.
        replaced_by: >-
          For a courtesy reissue this policy handles, and only for such a reissue, the note that may be
          reissued once as a courtesy at the member's request is the member's most recently lapsed note, and
          only when it lapsed with its validity ended; the request is recorded as an expired note reissue
          request, and a birthday note, a note that lapsed because the membership closed and a note already
          reissued are still never reissued.
    trigger: on_request
    subject: [loyalty_note_issue]
    computes: validity_days
    target_tool: request_courtesy_note_reissue_8b12a7a8
    params:
      top_tier_validity: 120
      mid_tier_validity: 90
      top_tier_days: 30
      mid_tier_days: 21
      card_recent_months: 3
      card_active_recent_days: 7
      card_active_days: 3
      lapse_long_days: 21
      lapse_mid_days: 11
      lapse_long_cut: 7
      lapse_mid_cut: 3
      registry_near_days: 90
      registry_far_days: 180
      registry_near_bonus: 14
      registry_far_bonus: 7
      recent_shop_days: 30
      some_shop_days: 90
      recent_shop_bonus: 7
      some_shop_bonus: 3
      share_lookback_months: 12
      high_return_pct: 40
      mid_return_pct: 25
      mid_return_cut: 5
    rule: >-
      A member asks in person for the courtesy reissue of a Finch Note. For a courtesy reissue this policy
      handles, and only for such a reissue, the note that may be reissued once as a courtesy at the member's
      request is the member's most recently lapsed note, and only when it lapsed with its validity ended; the
      request is recorded as an expired note reissue request, and a birthday note, a note that lapsed because
      the membership closed and a note already reissued are still never reissued. For a courtesy reissue this
      policy handles, and only for such a reissue, the reissued note keeps the original note's value and names
      the original note, and its expiry date is the reissue date plus the courtesy validity days worked out
      below minus one day; every other note keeps its base expiry rule. A courtesy reissue is not granted until
      every refunded return of merchandise paid in part with a Finch Note shows its reinstatement note on the
      membership. The courtesy note's validity is fixed only after every refunded return of a purchase that
      earned points shows its return deduction entry on the membership's points history. The courtesy validity
      days are the courtesy day count adjusted by the courtesy returned-share method, where the courtesy day
      count is the tier courtesy days plus the courtesy card days, plus the courtesy registry days, plus the
      courtesy shopping days, less the courtesy lapse cut: under the halving method the courtesy validity days
      are half the courtesy day count, rounded down to whole days; under the reduction method they are the
      courtesy day count less 5; under the standard method they are the courtesy day count. The tier courtesy
      days are the standard courtesy note validity of the tier on the membership record. The courtesy card days,
      the courtesy registry days and the courtesy shopping days are 0, the courtesy lapse cut is 0, and the
      courtesy returned-share method is the standard method. When the lapsed note had been issued with a
      validity of 120 days or more (its issue date to its expiry date, both counted) the tier courtesy days are
      30, when that validity was 90 days or more but less than 120 they are 21, and otherwise they stay the
      standard courtesy note validity of the tier on the membership record. The courtesy card days are 7 when
      the customer holds an active Marlowe & Finch card account and a Marlowe & Finch purchase was charged to a
      Marlowe & Finch card within the last 3 whole months, 3 when the customer holds an active card account and
      no such purchase was charged, and 0 when the customer holds no active card account. The courtesy lapse cut
      is 7 days when the note lapsed 21 or more calendar days before the request date, 3 days when it lapsed 11
      to 20 days before, and 0 otherwise. The courtesy registry days are 14 when the customer has an active
      Wedding Registry whose event date falls 0 to 90 calendar days after the request date, 7 when it falls more
      than 90 and up to 180 days after, and 0 otherwise. The courtesy shopping days are 7 when the customer's
      latest completed Marlowe & Finch purchase was completed 30 calendar days or fewer before the request date,
      3 when 31 to 90 days before, and 0 otherwise. The courtesy returned share is the qualifying amount on
      return deduction entries dated within the last 12 whole months, as a percent of the qualifying amount on
      purchase points entries dated within those months. The courtesy returned-share method is the halving
      method when the courtesy returned share is 40 percent or more, the reduction method when it is 25 percent
      or more but less than 40 percent, and the standard method otherwise.
    prerequisite:
      - problem: loyalty_ext_return_points_deduction
        kind: value_input
        gate: return_pct
        form: state
        policy_source: >-
          The courtesy note's validity is fixed only after every refunded return of a purchase that earned
          points shows its return deduction entry on the membership's points history.
        condition: >-
          Every return record in refunded status on a purchase record of the member that earned points has a
          loyalty_points_reversal entry on the membership naming that return.
        resolved_by: book_return_points_deduction_52e06983
        effect: >-
          The deduction entry adds the refunded qualifying amount to the return deduction entries of the
          last 12 months, which raises return_pct and can move the courtesy validity days to a lower
          returned-share tier.
      - problem: loyalty_ext_note_reinstatement
        kind: state_gate
        gate: loyalty_note_ledger.issue_reason
        form: state
        policy_source: >-
          A courtesy reissue is not granted until every refunded return of merchandise paid in part with a
          Finch Note shows its reinstatement note on the membership.
        condition: >-
          Every return record in refunded status on a purchase record on which a Finch Note was redeemed has
          a loyalty_note_issue entry with issue_reason return_reinstatement naming that return and the
          redeemed note.
        resolved_by: reinstate_returned_note_1c0adac4
        effect: >-
          Once the reinstatement note stands on the membership, the courtesy reissue may be granted; without
          it the courtesy reissue is not granted.
    cross_category:
      - category: card
        as: history
        reads: [status, card_transactions.event_type, card_transactions.merchant_category]
        note: "An active card and recent Marlowe & Finch card purchases decide card_days."
      - category: registry
        as: branch
        reads: [variant_name, status, event_date]
        note: "An active Wedding Registry's event date decides registry_days."
      - category: order
        as: history
        reads: [completed_date, status]
        note: "The latest completed purchase decides shopper_recency_days."
    compute:
      - lapsed_code: "LATEST('loyalty_note_ledger', 'note_code', date_field='txn_date', event_type='loyalty_note_expire', expire_reason='validity_ended')"
      - lapsed_issued: "LATEST('loyalty_note_ledger', 'issue_date', date_field='issue_date', event_type='loyalty_note_issue', note_code=lapsed_code)"
      - lapsed_expiry: "LATEST('loyalty_note_ledger', 'expiry_date', date_field='issue_date', event_type='loyalty_note_issue', note_code=lapsed_code)"
      - tier_validity: "DAYS(lapsed_issued, lapsed_expiry) + 1 if (lapsed_issued and lapsed_expiry) else 0"
      - base_courtesy: "P('courtesy_note_validity_days')"
      - tier_days: "K('top_tier_days') if tier_validity >= K('top_tier_validity') else (K('mid_tier_days') if tier_validity >= K('mid_tier_validity') else base_courtesy)"
      - active_card: "CFIELD('card', 'status', status='active')"
      - recent_card_buys: "XCOUNT('card', 'card_transactions', within_months=K('card_recent_months'), date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch')"
      - card_days: "K('card_active_recent_days') if (active_card == 'active' and recent_card_buys > 0) else (K('card_active_days') if (active_card == 'active' and recent_card_buys == 0) else 0)"
      - lapse_day: "LATEST('loyalty_note_ledger', 'txn_date', date_field='txn_date', event_type='loyalty_note_expire', expire_reason='validity_ended')"
      - lapse_age: "DAYS(lapse_day, NOW) if lapse_day else 0"
      - lapse_cut: "K('lapse_long_cut') if lapse_age >= K('lapse_long_days') else (K('lapse_mid_cut') if lapse_age >= K('lapse_mid_days') else 0)"
      - registry_event: "CFIELD('registry', 'event_date', status='active', variant_name='Wedding Registry')"
      - registry_gap: "DAYS(NOW, registry_event) if registry_event else -1"
      - registry_days: "K('registry_near_bonus') if (registry_gap >= 0 and registry_gap <= K('registry_near_days')) else (K('registry_far_bonus') if (registry_gap > K('registry_near_days') and registry_gap <= K('registry_far_days')) else 0)"
      - last_completed: "XLATEST('order', 'purchases', 'completed_date', date_field='completed_date', status='completed')"
      - shop_gap: "DAYS(last_completed, NOW) if last_completed else 9999"
      - shopping_days: "K('recent_shop_bonus') if shop_gap <= K('recent_shop_days') else (K('some_shop_bonus') if shop_gap <= K('some_shop_days') else 0)"
      - returned_q: "SUM('loyalty_points_ledger', 'qualifying_amount', within_months=K('share_lookback_months'), date_field='entry_date', event_type='loyalty_points_reversal')"
      - earned_q: "SUM('loyalty_points_ledger', 'qualifying_amount', within_months=K('share_lookback_months'), date_field='entry_date', event_type='loyalty_points_earn', earn_source='purchase_base')"
      - return_pct: "returned_q * 100 / earned_q if earned_q > 0 else 0"
      - share_mode: "'halving' if return_pct >= K('high_return_pct') else ('reduction' if return_pct >= K('mid_return_pct') else 'standard')"
      - result: "int((tier_days + card_days + registry_days + shopping_days - lapse_cut) / 2) if share_mode == 'halving' else ((tier_days + card_days + registry_days + shopping_days - lapse_cut) - K('mid_return_cut') if share_mode == 'reduction' else (tier_days + card_days + registry_days + shopping_days - lapse_cut))"
    compute_basis:
      lapsed_code: "the note that may be reissued once as a courtesy at the member's request is the member's most recently lapsed note"
      lapsed_issued: "When the lapsed note had been issued with a validity of 120 days or more (its issue date to its expiry date, both counted) the tier courtesy days are 30"
      lapsed_expiry: "When the lapsed note had been issued with a validity of 120 days or more (its issue date to its expiry date, both counted) the tier courtesy days are 30"
      tier_validity: "When the lapsed note had been issued with a validity of 120 days or more (its issue date to its expiry date, both counted) the tier courtesy days are 30"
      base_courtesy: "The tier courtesy days are the standard courtesy note validity of the tier on the membership record."
      tier_days: "When the lapsed note had been issued with a validity of 120 days or more (its issue date to its expiry date, both counted) the tier courtesy days are 30, when that validity was 90 days or more but less than 120 they are 21, and otherwise they stay the standard courtesy note validity of the tier on the membership record."
      active_card: "The courtesy card days are 7 when the customer holds an active Marlowe & Finch card account"
      recent_card_buys: "a Marlowe & Finch purchase was charged to a Marlowe & Finch card within the last 3 whole months"
      card_days: "The courtesy card days are 7 when the customer holds an active Marlowe & Finch card account and a Marlowe & Finch purchase was charged to a Marlowe & Finch card within the last 3 whole months, 3 when the customer holds an active card account and no such purchase was charged, and 0 when the customer holds no active card account."
      lapse_day: "The courtesy lapse cut is 7 days when the note lapsed 21 or more calendar days before the request date"
      lapse_age: "The courtesy lapse cut is 7 days when the note lapsed 21 or more calendar days before the request date"
      lapse_cut: "The courtesy lapse cut is 7 days when the note lapsed 21 or more calendar days before the request date, 3 days when it lapsed 11 to 20 days before, and 0 otherwise."
      registry_event: "The courtesy registry days are 14 when the customer has an active Wedding Registry whose event date falls 0 to 90 calendar days after the request date"
      registry_gap: "The courtesy registry days are 14 when the customer has an active Wedding Registry whose event date falls 0 to 90 calendar days after the request date"
      registry_days: "The courtesy registry days are 14 when the customer has an active Wedding Registry whose event date falls 0 to 90 calendar days after the request date, 7 when it falls more than 90 and up to 180 days after, and 0 otherwise."
      last_completed: "The courtesy shopping days are 7 when the customer's latest completed Marlowe & Finch purchase was completed 30 calendar days or fewer before the request date"
      shop_gap: "The courtesy shopping days are 7 when the customer's latest completed Marlowe & Finch purchase was completed 30 calendar days or fewer before the request date"
      shopping_days: "The courtesy shopping days are 7 when the customer's latest completed Marlowe & Finch purchase was completed 30 calendar days or fewer before the request date, 3 when 31 to 90 days before, and 0 otherwise."
      returned_q: "The courtesy returned share is the qualifying amount on return deduction entries dated within the last 12 whole months, as a percent of the qualifying amount on purchase points entries dated within those months."
      earned_q: "The courtesy returned share is the qualifying amount on return deduction entries dated within the last 12 whole months, as a percent of the qualifying amount on purchase points entries dated within those months."
      return_pct: "The courtesy returned share is the qualifying amount on return deduction entries dated within the last 12 whole months, as a percent of the qualifying amount on purchase points entries dated within those months."
      share_mode: "The courtesy returned-share method is the halving method when the courtesy returned share is 40 percent or more, the reduction method when it is 25 percent or more but less than 40 percent, and the standard method otherwise."
      result: "The courtesy validity days are the courtesy day count adjusted by the courtesy returned-share method, where the courtesy day count is the tier courtesy days plus the courtesy card days, plus the courtesy registry days, plus the courtesy shopping days, less the courtesy lapse cut: under the halving method the courtesy validity days are half the courtesy day count, rounded down to whole days; under the reduction method they are the courtesy day count less 5; under the standard method they are the courtesy day count."
    factors:
      - id: tier_days
        effect: parameter
        decides: tier_days
        bindings: [lapsed_code, lapsed_issued, lapsed_expiry, tier_validity, base_courtesy, tier_days]
        ladder:
          - when: "the lapsed note had been issued with a validity of 120 days or more"
            value: "K('top_tier_days')"
          - when: "it had been issued with a validity of 90 days or more but less than 120"
            value: "K('mid_tier_days')"
          - when: "otherwise"
            value: "the standard courtesy note validity of the tier on the membership record"
        baseline:
          tier_days: "base_courtesy"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: card_days
        effect: parameter
        decides: card_days
        bindings: [active_card, recent_card_buys, card_days]
        ladder:
          - when: "an active Marlowe & Finch card account AND a Marlowe & Finch purchase charged to a Marlowe & Finch card within the last 3 whole months"
            value: "K('card_active_recent_days')"
          - when: "an active card account AND no such purchase"
            value: "K('card_active_days')"
          - when: "otherwise (no active card account)"
            value: "0"
        baseline:
          card_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: lapse_cut
        effect: parameter
        decides: lapse_cut
        bindings: [lapse_day, lapse_age, lapse_cut]
        ladder:
          - when: "the note lapsed 21 or more calendar days before the request date"
            value: "K('lapse_long_cut')"
          - when: "it lapsed 11 to 20 days before"
            value: "K('lapse_mid_cut')"
          - when: "otherwise"
            value: "0"
        baseline:
          lapse_cut: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: registry_days
        effect: parameter
        decides: registry_days
        bindings: [registry_event, registry_gap, registry_days]
        ladder:
          - when: "an active Wedding Registry whose event date falls 0 to 90 calendar days after the request date"
            value: "K('registry_near_bonus')"
          - when: "it falls more than 90 and up to 180 days after"
            value: "K('registry_far_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          registry_days: "0"
        evidence: [cross_category, date]
        cross_difficulty: registry
      - id: shopping_days
        effect: parameter
        decides: shopping_days
        bindings: [last_completed, shop_gap, shopping_days]
        ladder:
          - when: "the latest completed Marlowe & Finch purchase was completed 30 calendar days or fewer before the request date"
            value: "K('recent_shop_bonus')"
          - when: "31 to 90 days before"
            value: "K('some_shop_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          shopping_days: "0"
        evidence: [cross_category, date]
        cross_difficulty: order
      - id: return_share_rule
        effect: method
        decides: share_mode
        bindings: [returned_q, earned_q, return_pct, share_mode]
        ladder:
          - when: "the courtesy returned share is 40 percent or more"
            method: "halving method: the validity days are half the courtesy day count, rounded down to whole days"
          - when: "it is 25 percent or more but less than 40 percent"
            method: "reduction method: the validity days are the courtesy day count less 5"
          - when: "otherwise"
            method: "standard method: the validity days are the courtesy day count"
        baseline:
          share_mode: "'standard'"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The courtesy validity days are the courtesy day count adjusted by the courtesy returned-share method,
        where the courtesy day count is the tier courtesy days plus the courtesy card days, plus the courtesy
        registry days, plus the courtesy shopping days, less the courtesy lapse cut: under the halving method
        the courtesy validity days are half the courtesy day count, rounded down to whole days; under the
        reduction method they are the courtesy day count less 5; under the standard method they are the
        courtesy day count. The tier courtesy days are the standard courtesy note validity of the tier on the
        membership record. The courtesy card days, the courtesy registry days and the courtesy shopping days
        are 0, the courtesy lapse cut is 0, and the courtesy returned-share method is the standard method.
      params: [courtesy_note_validity_days]
    inputs:
      history:
        - {"table": "loyalty_points_ledger", "aggregate": "sum", "field": "qualifying_amount", "within_months": 12, "filters": {"event_type": "loyalty_points_reversal"}}
        - {"table": "loyalty_points_ledger", "aggregate": "sum", "field": "qualifying_amount", "within_months": 12, "filters": {"event_type": "loyalty_points_earn", "earn_source": "purchase_base"}}
        - {"table": "loyalty_note_ledger", "aggregate": "latest", "field": "txn_date", "filters": {"event_type": "loyalty_note_expire", "expire_reason": "validity_ended"}}
        - {"category": "card", "table": "card_transactions", "aggregate": "count", "field": "txn_date", "within_months": 3, "filters": {"event_type": "card_purchase", "merchant_category": "marlowe_finch"}}
        - {"category": "order", "table": "purchases", "aggregate": "latest", "field": "completed_date", "filters": {"status": "completed"}}
      cross_category: [card, registry, order]
