# ---- events (every write of this category) ----
events:
  - type: loyalty_enrollment
    target: loyalty_memberships
    mutation: create
    meaning: "A customer joins Finch Circle in store, online or in the app and receives a member number."
    grain: "One row per membership."
    fields:
      variant_name: "Finch Circle Member at enrollment, or the card-floor tier when the customer already holds a qualifying card status."
      status: "active at enrollment."
      enrolled_date: "Date the membership was created."
      member_number: "Finch Circle member number issued."
    triggers:
      - event: "loyalty:loyalty_points_earn"
        map: {earn_source: enrollment_bonus}
  - type: loyalty_tier_change
    target: loyalty_memberships
    mutation: update
    meaning: "The member's tier changes by a mid-year upgrade, the annual review, or a card status floor."
    grain: "One update per tier change."
    fields:
      variant_name: "The new tier, as the official tier name."
      tier_valid_through: "Last date the new tier is held without requalifying."
      last_tier_change_date: "Date the change took effect."
      last_tier_change_type: "upgrade, downgrade or card_floor."
    triggers:
      - event: "loyalty:loyalty_points_earn"
        when: {last_tier_change_type: upgrade}
        map: {earn_source: tier_bonus}
      - event: "loyalty:loyalty_alteration_credit_grant"
        when: {last_tier_change_type: [upgrade, card_floor], variant_name: ["Finch Circle Gold", "Finch Circle Platinum", "Finch Circle Diamond", "Finch Circle Icon"]}
        map: {grant_reason: tier_upgrade_top_up}
  - type: loyalty_suspension
    target: loyalty_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The membership is frozen for a program-abuse review."
    grain: "One transition per suspension."
    fields:
      status: "Set to suspended."
    triggers: []
  - type: loyalty_reinstatement
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A review clears the member and the membership is active again."
    grain: "One transition per reinstatement."
    fields:
      status: "Set to active."
    triggers: []
  - type: loyalty_cancellation
    target: loyalty_memberships
    mutation: {transition: {from: active, to: closed}}
    meaning: "The member's own cancellation of the membership takes effect."
    grain: "One transition per cancelled membership."
    fields:
      status: "Set to closed."
      closed_date: "Date the cancellation took effect."
    triggers:
      - event: "loyalty:loyalty_points_expiry"
        map: {expiry_reason: membership_closed}
      - event: "loyalty:loyalty_note_expire"
        map: {expire_reason: membership_closed}
      - event: "loyalty:loyalty_alteration_credit_expire"
        map: {}
  - type: loyalty_termination
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "A suspended membership is terminated after the review confirms program abuse."
    grain: "One transition per terminated membership."
    fields:
      status: "Set to closed."
      closed_date: "Date of termination."
    triggers:
      - event: "loyalty:loyalty_points_expiry"
        map: {expiry_reason: membership_closed}
      - event: "loyalty:loyalty_note_expire"
        map: {expire_reason: membership_closed}
      - event: "loyalty:loyalty_alteration_credit_expire"
        map: {}
  - type: loyalty_points_earn
    target: loyalty_points_ledger
    meaning: "Points post to the membership for a qualifying purchase, a card bonus, a bonus event, a tier upgrade or enrollment."
    grain: "One row per earn source per purchase (or per card transaction, or per bonus occasion)."
    distinguish_by: [earn_source, purchase_id, card_txn_id, entry_date]
    fields:
      entry_date: "Date the points posted."
      points: "Points posted, positive whole number."
      earn_source: "purchase_base, card_bonus, card_outside_spend, bonus_event, tier_bonus or enrollment_bonus."
      purchase_id: "Purchase record the points were earned on; empty for card_outside_spend, tier_bonus and enrollment_bonus."
      card_txn_id: "Card transaction the card bonus or outside-spend points were earned on; empty otherwise."
      qualifying_amount: "Net qualifying dollars the points were computed on, USD; 0.00 for fixed bonuses."
    account: points
    direction: in
    triggers: []
  - type: loyalty_points_adjustment
    target: loyalty_points_ledger
    meaning: "Points for a purchase that was not credited at the time (the member's identifier was not given at checkout) are credited after a missing-points request."
    grain: "One row per purchase credited after a request."
    distinguish_by: [purchase_id, earn_source]
    fields:
      entry_date: "Date the points posted."
      points: "Points credited, positive whole number."
      earn_source: "missing_points_credit."
      purchase_id: "Purchase record credited."
      qualifying_amount: "Net qualifying dollars of the purchase, USD."
    account: points
    direction: in
    triggers: []
  - type: loyalty_points_reversal
    target: loyalty_points_ledger
    meaning: "Points earned on merchandise that is returned are deducted."
    grain: "One row per return per original earn row."
    distinguish_by: [return_id, original_loyalty_entry_id]
    fields:
      entry_date: "Date the deduction posted."
      points: "Points deducted, positive whole number."
      return_id: "Return record that caused the deduction."
      purchase_id: "Purchase record the returned merchandise came from."
      original_loyalty_entry_id: "The earn or adjustment row whose points are being taken back."
      qualifying_amount: "Refunded qualifying dollars of the returned merchandise attributable to that earn row, USD."
    account: points
    direction: out
    triggers: []
  - type: loyalty_points_conversion
    target: loyalty_points_ledger
    meaning: "A block of points is converted into one Finch Note."
    grain: "One row per note created from points."
    distinguish_by: [note_code]
    fields:
      entry_date: "Date of the conversion."
      points: "Points converted, positive whole number equal to points_per_note."
      note_code: "Code of the Finch Note created."
    account: points
    direction: out
    triggers:
      - event: "loyalty:loyalty_note_issue"
        map: {note_code: note_code, issue_reason: points_conversion}
  - type: loyalty_points_expiry
    target: loyalty_points_ledger
    meaning: "The points balance is forfeited for inactivity or because the membership closed."
    grain: "One row per forfeiture of the balance."
    distinguish_by: [entry_date, expiry_reason]
    fields:
      entry_date: "Date of the forfeiture."
      points: "Points forfeited, positive whole number."
      expiry_reason: "inactivity or membership_closed."
    account: points
    direction: out
    triggers: []
  - type: loyalty_note_issue
    target: loyalty_note_ledger
    meaning: "A Finch Note is issued to the member from points, as a birthday reward, as a reinstatement after a return, or as a courtesy reissue of an expired note."
    grain: "One row per note issued."
    distinguish_by: [note_code]
    fields:
      note_code: "Unique code of the note issued."
      note_amount: "Value of the note, USD."
      issue_reason: "points_conversion, birthday, return_reinstatement or courtesy_reissue."
      issue_date: "Date the note was issued."
      expiry_date: "Last day the note can be redeemed."
      original_note_code: "For a reinstatement or courtesy reissue, the code of the note it replaces; empty otherwise."
      return_id: "For a reinstatement, the return record that triggered it; empty otherwise."
    account: finch_notes
    direction: in
    triggers: []
  - type: loyalty_note_redeem
    target: loyalty_note_ledger
    meaning: "A Finch Note is applied to a purchase."
    grain: "One row per note redeemed."
    distinguish_by: [note_code]
    fields:
      note_code: "Code of the note redeemed."
      note_amount: "Full value of the note consumed, USD."
      txn_date: "Date of the purchase the note was applied to."
      purchase_id: "Purchase record the note was applied to."
    account: finch_notes
    direction: out
    triggers: []
  - type: loyalty_note_expire
    target: loyalty_note_ledger
    meaning: "An unredeemed Finch Note lapses at the end of its expiry date or because the membership closed."
    grain: "One row per note lapsed."
    distinguish_by: [note_code]
    fields:
      note_code: "Code of the note that lapsed."
      note_amount: "Value lapsed, USD."
      txn_date: "Date the note lapsed."
      expire_reason: "validity_ended or membership_closed."
    account: finch_notes
    direction: out
    triggers: []
  - type: loyalty_alteration_credit_grant
    target: loyalty_benefit_ledger
    meaning: "Complimentary alteration credit is granted for the calendar year, or topped up after an upgrade during the year."
    grain: "One row per grant occasion per benefit year."
    distinguish_by: [benefit_year, grant_reason, txn_date]
    fields:
      benefit_year: "Calendar year the credit belongs to."
      amount: "Credit granted, USD."
      txn_date: "Date of the grant."
      grant_reason: "annual_grant or tier_upgrade_top_up."
    account: alteration_credit
    direction: in
    triggers: []
  - type: loyalty_alteration_credit_use
    target: loyalty_benefit_ledger
    meaning: "Alteration credit is applied to the charge of an alteration ticket."
    grain: "One row per alteration ticket paid with credit."
    distinguish_by: [ticket_id]
    fields:
      amount: "Credit applied, USD."
      txn_date: "Date the credit was applied."
      ticket_id: "Alteration ticket the credit paid for."
      benefit_year: "Calendar year of the credit used."
    account: alteration_credit
    direction: out
    triggers: []
  - type: loyalty_alteration_credit_restore
    target: loyalty_benefit_ledger
    meaning: "Alteration credit applied to a ticket is restored because the ticket was cancelled before work began or the charge was refunded."
    grain: "One row per ticket whose credit is restored."
    distinguish_by: [ticket_id]
    fields:
      amount: "Credit restored, USD."
      txn_date: "Date of the restoration."
      ticket_id: "Alteration ticket whose credit is restored."
      benefit_year: "Calendar year the restored credit belongs to."
    account: alteration_credit
    direction: in
    triggers: []
  - type: loyalty_alteration_credit_expire
    target: loyalty_benefit_ledger
    meaning: "Unused alteration credit lapses at the end of its calendar year or when the membership closes."
    grain: "One row per benefit year lapsed."
    distinguish_by: [benefit_year]
    fields:
      amount: "Credit lapsed, USD."
      txn_date: "Date of the lapse."
      benefit_year: "Calendar year of the credit that lapsed."
    account: alteration_credit
    direction: out
    triggers: []

# ---- derived measures ----
measures:
  - id: loyalty_msr_calendar_year_qualifying_spend
    window: "One calendar year, 1 January through 31 December, by entry_date (year to date when evaluated mid-year)."
    measure: "Sum of qualifying_amount of loyalty_points_earn rows with earn_source purchase_base and of loyalty_points_adjustment rows, minus the sum of qualifying_amount of loyalty_points_reversal rows, on the membership in the window."
  - id: loyalty_msr_courtesy_reissues_rolling_12m
    window: "Rolling 12 calendar months ending on the handling date, by issue_date."
    measure: "Count of loyalty_note_issue rows with issue_reason courtesy_reissue on the membership in the window."
  - id: loyalty_msr_last_activity_date
    window: "All history of the membership."
    measure: "Latest of the entry_date of any loyalty_points_earn or loyalty_points_adjustment row and the txn_date of any loyalty_note_redeem row; the enrolled_date when there is none."
  - id: loyalty_msr_return_ratio_12m
    window: "Trailing 12 calendar months ending on the review date, by entry_date."
    measure: "Sum of qualifying_amount of loyalty_points_reversal rows divided by the sum of qualifying_amount of loyalty_points_earn rows with earn_source purchase_base, as a percent, together with the count of distinct return_id values on the reversal rows."

# ---- policies ----
policies:
  - id: loyalty_agg_multi_holding
    subject: [loyalty_enrollment]
    rule: >-
      A customer holds at most max_per_customer Finch Circle membership. The customer has no other membership in active or
      suspended status. A closed membership is never reopened: a customer whose membership was cancelled may enroll again
      and starts a new membership as Finch Circle Member (or at a card-floor tier) with zero points, no notes and no
      enrollment bonus, while a customer whose membership was closed by loyalty_termination may not enroll again. Points,
      notes and alteration credit never move between memberships or between members, and household members each hold
      their own membership.
    eligibility:
      - id: one_membership
        applies_to: [loyalty_enrollment]
        kind: dedup
        condition: "The customer has no other membership in active or suspended status."
        evidence_fields: [loyalty_memberships.customer_id, loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.customer_id]
          action_bindings:
            loyalty_memberships.customer_id: customer_id
        dedup_contract:
          table: loyalty_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: loyalty_enrollment_rules
    subject: [loyalty_enrollment, loyalty_points_earn]
    rule: >-
      Finch Circle membership is free. The applicant is at least min_member_age years old on the enrollment date, and the
      customer profile carries every identifier in enrollment_identifiers_required. A membership starts as Finch Circle
      Member, or at the card-floor tier of loyalty_tier_qualification when the customer holds a qualifying card status on
      the enrollment date. The tier's enrollment_bonus_points (Finch Circle Member value) post once, on the enrollment date,
      as a loyalty_points_earn with earn_source enrollment_bonus; a customer who has held any earlier membership receives no
      enrollment bonus. Purchases made before the enrolled_date earn no points, not even through a missing-points request.
    eligibility:
      - id: profile_identifiers_present
        applies_to: [loyalty_enrollment]
        kind: caller_fact
        condition: "The applicant is at least min_member_age years old on the enrollment date, and the customer profile carries every identifier in enrollment_identifiers_required."
        evidence_fields: [customers.date_of_birth, customers.phone_number, customers.email, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params: {}

  - id: loyalty_tier_qualification
    subject: [loyalty_tier_change]
    rule: >-
      Tiers are earned on loyalty_msr_calendar_year_qualifying_spend: net merchandise dollars after discounts and Finch Notes
      and before tax, with any tender, excluding points_excluded_items, less returns. Mid-year upgrade: when the year-to-date
      measure reaches the qualifying_spend_threshold_usd of a higher tier, the membership moves to the highest tier reached
      within midyear_upgrade_business_days business days (last_tier_change_type upgrade), and tier_valid_through becomes 31
      December of the following calendar year. Annual review on 1 January: a member whose tier_valid_through has passed is
      set to the highest tier whose threshold the previous year's measure meets, but never more than
      max_tier_drop_per_review tiers below the tier held (last_tier_change_type downgrade when lower); a member whose
      tier_valid_through has not passed keeps the tier. Card status floor (combination with Marlowe & Finch Credit Cards):
      while the customer holds a card account in active status at Marlowe & Finch Store Card Elite or Marlowe & Finch
      Platinum Mastercard the membership is at least Finch Circle Gold, and at Marlowe & Finch World Elite Mastercard at least
      Finch Circle Platinum (last_tier_change_type card_floor); when that card account leaves active status the floor stops
      and the next annual review applies the spend rule alone. A floor never lowers a higher earned tier. The membership is
      in active status. A suspended membership changes tier only after reinstatement, at the next upgrade test or review.
      A card floor can only grant a tier whose card_status_floor_eligible is true.
    eligibility:
      - id: tier_change_active_only
        applies_to: [loyalty_tier_change]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      card_floor_map:
        "Marlowe & Finch Store Card Elite": "Finch Circle Gold"
        "Marlowe & Finch Platinum Mastercard": "Finch Circle Gold"
        "Marlowe & Finch World Elite Mastercard": "Finch Circle Platinum"
      per_tier:
        "Finch Circle Member": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Silver": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Gold": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Platinum": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Diamond": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
        "Finch Circle Icon": {threshold_usd: "=qualifying_spend_threshold_usd", upgrade_bonus: "=tier_upgrade_bonus_points"}
    measures: [loyalty_msr_calendar_year_qualifying_spend]

  - id: loyalty_tier_benefits
    subject: [loyalty_tier_change]
    rule: >-
      A member's service benefits are read from the tier held on the date of the occurrence they apply to (the return date for
      return windows and return shipping, the price-adjustment request date, the delivery booking date, the alteration
      ticket date, the registry completion purchase date): free_return_shipping, extended_return_days, price_adjustment_extension_days, restocking_fee_waived,
      home_delivery_discount_pct, alteration_rush_fee_waived and registry_completion_bonus_pct. A suspended or closed
      membership gives no benefit, and a customer who is not a member is treated as having none. Benefits attach to the
      member's own transactions only and are not lent to a guest, a registry giver or another household member. A tier
      upgrade (last_tier_change_type upgrade) also posts the new tier's tier_upgrade_bonus_points once as a
      loyalty_points_earn with earn_source tier_bonus; a downgrade or card floor posts no bonus.
    eligibility: []
    params: {}

  - id: loyalty_evt_points_earn
    subject: [loyalty_points_earn]
    rule: >-
      The membership is in active status. Points post within points_posting_business_days business days of the purchase
      date (in store) or ship date (online). For each purchase record in the member's name: purchase_base points equal the
      member's base_points_per_dollar on the purchase date times the purchase's net qualifying amount, and on a bonus event
      day the member was invited to, a separate bonus_event row adds (bonus_event_multiplier minus 1) times those base
      points. When the purchase was charged to a Marlowe & Finch card, a card_bonus row adds the card's
      mf_bonus_points_per_dollar times the amount charged for it. Mastercard purchases outside Marlowe & Finch earn
      card_outside_spend points at the card's grocery_gas_points_per_dollar for supermarket and gas_station merchants and its
      outside_points_per_dollar for other merchants. Every row is rounded down to whole points (points_rounding). Gift cards,
      sales tax, delivery, alteration and shipping fees (points_excluded_items) earn nothing. A purchase made while the
      membership was suspended earns nothing and is never credited later.
      A member is invited to the tier's bonus_event_days_per_year bonus event days in a calendar year.
    eligibility:
      - id: earn_active_only
        applies_to: [loyalty_points_earn]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      per_tier:
        "Finch Circle Member": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Silver": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Gold": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Platinum": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Diamond": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}
        "Finch Circle Icon": {points_per_dollar: "=base_points_per_dollar", event_multiplier: "=bonus_event_multiplier"}

  - id: loyalty_evt_points_reversal
    subject: [loyalty_points_reversal]
    rule: >-
      When a return of merchandise from a purchase is refunded, every purchase_base, bonus_event, card_bonus and
      missing_points_credit row of that purchase is reduced in proportion to the refunded qualifying amount: the points
      deducted for one earn row are that row's points times the refunded qualifying amount divided by the row's
      qualifying_amount, rounded half up to whole points, booked as one loyalty_points_reversal per earn row naming the
      return_id and the original_loyalty_entry_id. The deduction applies even when the balance goes negative
      (negative_points_balance_allowed); Finch Notes already issued are never taken back, and a negative balance is simply
      offset by later earning. No reversal has already been booked for the same return and earn row. Tier upgrade and
      enrollment bonuses are never reversed.
      Deductions are made because points_return_clawback is true.
    eligibility:
      - id: one_reversal_per_return_row
        applies_to: [loyalty_points_reversal]
        kind: dedup
        condition: "No reversal has already been booked for the same return and earn row."
        evidence_fields: [loyalty_points_ledger.return_id, loyalty_points_ledger.original_loyalty_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_points_ledger.return_id, loyalty_points_ledger.original_loyalty_entry_id]
          action_bindings:
            loyalty_points_ledger.return_id: return_id
            loyalty_points_ledger.original_loyalty_entry_id: original_loyalty_entry_id
        dedup_contract:
          table: loyalty_points_ledger
          mode: separate_record
          object_bindings: {return_id: return_id, original_loyalty_entry_id: original_loyalty_entry_id}
          duplicate_filters: {event_type: [loyalty_points_reversal]}
          distinct_fields: []
    params: {}

  - id: loyalty_note_conversion
    subject: [loyalty_points_conversion, loyalty_note_issue]
    rule: >-
      Whenever the points balance is at or above points_per_note, one block of points_per_note points is converted into one
      Finch Note of note_value_usd (issue_reason points_conversion), repeated block by block until the balance is below
      points_per_note; conversion happens within note_issue_business_days business days and cannot be requested early or
      postponed. Each note gets its own note_code. Its expiry_date is the issue_date plus note_validity_days of the tier held
      on the issue date minus one day (the issue date is day 1). Notes are issued only while the membership is active; a
      suspended membership accrues points without conversion until it is reinstated. Notes are digital, are held in the
      member's account and cannot be transferred.
    eligibility: []
    params:
      per_tier:
        "Finch Circle Member": {validity_days: "=note_validity_days"}
        "Finch Circle Silver": {validity_days: "=note_validity_days"}
        "Finch Circle Gold": {validity_days: "=note_validity_days"}
        "Finch Circle Platinum": {validity_days: "=note_validity_days"}
        "Finch Circle Diamond": {validity_days: "=note_validity_days"}
        "Finch Circle Icon": {validity_days: "=note_validity_days"}

  - id: loyalty_evt_note_redemption
    subject: [loyalty_note_redeem]
    rule: >-
      A Finch Note is applied to a Marlowe & Finch purchase in store, online or in the app. The purchase txn_date is on or
      before the note's expiry_date. The note has not already been redeemed or lapsed. The membership is in active status.
      A note is consumed whole (note_single_use): when it is larger than the eligible amount the rest is forfeited, it never
      gives change and has no cash value (note_cash_value). At most the tier's notes_per_transaction_max notes are applied to
      one purchase transaction, and notes never apply to note_redemption_exclusions (gift cards, alteration, delivery and
      shipping fees, sales tax). The amount paid with notes is not qualifying spend and earns no points.
    eligibility:
      - id: note_unexpired
        applies_to: [loyalty_note_redeem]
        kind: time
        condition: "The purchase txn_date is on or before the note's expiry_date."
        evidence_fields: [loyalty_note_ledger.expiry_date, loyalty_note_ledger.note_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.note_code]
          action_bindings:
            loyalty_note_ledger.note_code: note_code
        temporal_basis:
          clock: frozen_time
          anchor_event: "the note's expiry_date"
          anchor_source: loyalty_note_ledger.expiry_date
          relation: not_after
          duration_source: params.redemption_grace_days
          unit: calendar_days
          counting_rule: "The purchase txn_date is on or before the note's expiry_date."
          boundary: inclusive
      - id: note_not_used
        applies_to: [loyalty_note_redeem]
        kind: dedup
        condition: "The note has not already been redeemed or lapsed."
        evidence_fields: [loyalty_note_ledger.note_code, loyalty_note_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.note_code]
          action_bindings:
            loyalty_note_ledger.note_code: note_code
        dedup_contract:
          table: loyalty_note_ledger
          mode: separate_record
          object_bindings: {note_code: note_code}
          duplicate_filters: {event_type: [loyalty_note_redeem, loyalty_note_expire]}
          distinct_fields: []
      - id: redeem_active_only
        applies_to: [loyalty_note_redeem]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      redemption_grace_days: 0
      per_tier:
        "Finch Circle Member": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Silver": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Gold": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Platinum": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Diamond": {max_notes: "=notes_per_transaction_max"}
        "Finch Circle Icon": {max_notes: "=notes_per_transaction_max"}

  - id: loyalty_note_reinstatement
    subject: [loyalty_note_issue]
    rule: >-
      The value of Finch Notes applied to a purchase is never refunded to a card, cash or gift card. When merchandise from
      a purchase paid in part with notes is returned and refunded, a new note (issue_reason return_reinstatement) is issued
      for the note value attributable to the returned merchandise: the whole note value applied to the purchase when every
      item is returned, otherwise that value times the returned merchandise's share of the purchase's merchandise subtotal
      before notes, rounded half up to the cent. The new note names the return_id and the original_note_code. Its
      expiry_date is the later of the original note's expiry_date and the reinstatement date plus the tier's
      reinstated_note_min_validity_days minus one day (the reinstatement date is day 1). No reinstatement note has already
      been issued for the same return and original note. A reinstated note that later expires follows the ordinary expiry
      rules.
    eligibility:
      - id: one_reinstatement_per_return
        applies_to: [loyalty_note_issue]
        kind: dedup
        condition: "No reinstatement note has already been issued for the same return and original note."
        evidence_fields: [loyalty_note_ledger.return_id, loyalty_note_ledger.original_note_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.return_id, loyalty_note_ledger.original_note_code]
          action_bindings:
            loyalty_note_ledger.return_id: return_id
            loyalty_note_ledger.original_note_code: original_note_code
        dedup_contract:
          table: loyalty_note_ledger
          mode: separate_record
          object_bindings: {return_id: return_id, original_note_code: original_note_code}
          duplicate_filters: {issue_reason: [return_reinstatement]}
          distinct_fields: []
    params:
      per_tier:
        "Finch Circle Member": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Silver": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Gold": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Platinum": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Diamond": {min_validity_days: "=reinstated_note_min_validity_days"}
        "Finch Circle Icon": {min_validity_days: "=reinstated_note_min_validity_days"}

  - id: loyalty_expired_note_courtesy
    subject: [loyalty_note_issue]
    rule: >-
      A Finch Note that lapsed with expire_reason validity_ended may be reissued once as a courtesy (issue_reason
      courtesy_reissue) at the member's request, recorded as a loyalty_requests record with request_type
      expired_note_reissue. The request is made within the reissue window after the note's expiry_date. The window counts
      calendar days starting the day after the expiry_date as day 1, and a request on the last day of
      expired_note_reissue_window_days is in time. The loyalty_msr_courtesy_reissues_rolling_12m count is below the tier's
      expired_note_courtesy_reissues_per_12_months, read for the tier held on the request date. The reissued note has the
      original note_amount, names the original_note_code, and its expiry_date is the reissue date plus
      courtesy_note_validity_days minus one day. A note that lapsed because the membership closed, a note already reissued
      once, and a birthday note are never reissued.
    eligibility:
      - id: within_reissue_window
        applies_to: [loyalty_note_issue]
        kind: time
        condition: "The request is made within the reissue window after the note's expiry_date."
        evidence_fields: [loyalty_note_ledger.expiry_date, loyalty_note_ledger.note_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_note_ledger.note_code]
          action_bindings:
            loyalty_note_ledger.note_code: original_note_code
        temporal_basis:
          clock: frozen_time
          anchor_event: "the note's expiry_date"
          anchor_source: loyalty_note_ledger.expiry_date
          relation: not_after
          duration_source: variants.expired_note_reissue_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the expiry_date as day 1, and a request on the last day of expired_note_reissue_window_days is in time."
          boundary: inclusive
    params:
      per_tier:
        "Finch Circle Member": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Silver": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Gold": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Platinum": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Diamond": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
        "Finch Circle Icon": {reissues_allowed: "=expired_note_courtesy_reissues_per_12_months"}
    formula:
      courtesy_allowed: "loyalty_msr_courtesy_reissues_rolling_12m < expired_note_courtesy_reissues_per_12_months"
    measures: [loyalty_msr_courtesy_reissues_rolling_12m]

  - id: loyalty_evt_note_expiry
    subject: [loyalty_note_expire]
    rule: >-
      A Finch Note not redeemed by the end of its expiry_date lapses on the following day with expire_reason
      validity_ended, for its full note_amount. When the membership closes, every unredeemed note lapses on the closed_date
      with expire_reason membership_closed. A note lapses only once; a lapsed note can come back only as a new note under
      loyalty_expired_note_courtesy.
    eligibility: []
    params: {}

  - id: loyalty_points_expiry_rules
    subject: [loyalty_points_expiry]
    rule: >-
      When loyalty_msr_last_activity_date is points_inactivity_expiry_months full calendar months or more before the
      handling date (read for the tier held on that date), a positive points balance is forfeited in full with expiry_reason
      inactivity; a zero or negative balance is left as it is. Earning points or redeeming a note is activity; a points
      reversal, a note issue or a tier change is not. When the membership closes, a positive balance is forfeited on the
      closed_date with expiry_reason membership_closed. Forfeited points are never restored.
    eligibility: []
    params: {}
    measures: [loyalty_msr_last_activity_date]

  - id: loyalty_missing_points
    subject: [loyalty_points_adjustment]
    rule: >-
      A member whose Finch Circle number was not captured at checkout may ask for the points of that purchase through a
      loyalty_requests record with request_type missing_points naming the purchase_id. The purchase record is in the
      member's name (its customer_id is the member's) and its purchase date is on or after the enrolled_date. The request is
      made no later than the claim window after the purchase date. The window counts calendar days starting the day after
      the purchase date as day 1, and a request on the last day of missing_points_claim_window_days for the tier held on
      the request date is in time. The request is made no earlier than the waiting period after the purchase date, which
      ends on the purchase date plus missing_points_wait_days calendar days. The purchase has no purchase_base earn row and
      no earlier missing_points_credit row. The credit is one loyalty_points_adjustment row equal to the purchase_base and
      bonus_event points that purchase would have earned at the tier and rates in effect on the purchase date, on the
      qualifying amount still kept after any refunded return. A purchase fully returned before the request earns nothing.
      The purchase is identified by its purchase record (missing_points_proof); a receipt photo or a statement line alone is not enough.
    eligibility:
      - id: claim_window
        applies_to: [loyalty_points_adjustment]
        kind: time
        condition: "The request is made no later than the claim window after the purchase date."
        evidence_fields: [purchases.purchase_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase date"
          anchor_source: purchases.purchase_date
          relation: not_after
          duration_source: variants.missing_points_claim_window_days
          unit: calendar_days
          counting_rule: "The window counts calendar days starting the day after the purchase date as day 1, and a request on the last day of missing_points_claim_window_days for the tier held on the request date is in time."
          boundary: inclusive
      - id: waiting_period
        applies_to: [loyalty_points_adjustment]
        kind: time
        condition: "The request is made no earlier than the waiting period after the purchase date, which ends on the purchase date plus missing_points_wait_days calendar days."
        evidence_fields: [purchases.purchase_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase date"
          anchor_source: purchases.purchase_date
          relation: not_before
          duration_source: variants.missing_points_wait_days
          unit: calendar_days
          counting_rule: "The request is made no earlier than the waiting period after the purchase date, which ends on the purchase date plus missing_points_wait_days calendar days."
          boundary: inclusive
      - id: not_already_credited
        applies_to: [loyalty_points_adjustment]
        kind: dedup
        condition: "The purchase has no purchase_base earn row and no earlier missing_points_credit row."
        evidence_fields: [loyalty_points_ledger.purchase_id, loyalty_points_ledger.earn_source]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_points_ledger.purchase_id]
          action_bindings:
            loyalty_points_ledger.purchase_id: purchase_id
        dedup_contract:
          table: loyalty_points_ledger
          mode: separate_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {earn_source: [purchase_base, missing_points_credit]}
          distinct_fields: []
    params:
      per_tier:
        "Finch Circle Member": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Silver": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Gold": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Platinum": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Diamond": {claim_window_days: "=missing_points_claim_window_days"}
        "Finch Circle Icon": {claim_window_days: "=missing_points_claim_window_days"}

  - id: loyalty_alteration_credit_rules
    subject: [loyalty_alteration_credit_grant, loyalty_alteration_credit_use, loyalty_alteration_credit_restore, loyalty_alteration_credit_expire]
    rule: >-
      On 1 January each membership in active status receives the alteration_credit_annual_usd of the tier held that day
      for the new benefit_year (grant_reason annual_grant); a tier with 0.00 receives no grant. After an upgrade or card
      floor during the year, a top-up (grant_reason tier_upgrade_top_up) equal to the new tier's annual amount minus the
      amounts already granted for that benefit_year posts on the change date; nothing is taken back after a downgrade.
      Alteration credit pays only for alterations to items purchased at Marlowe & Finch (alteration_credit_eligible_items:
      the alteration ticket names a purchase record) and is applied to the ticket's alteration charges up to the lower of
      the charge and the credit balance; it never pays a rush fee, a delivery fee or a non-Marlowe & Finch item. The
      membership is in active status. When a ticket paid with credit is cancelled before work began or its charge is
      refunded, the credit used is restored to the benefit_year it came from, unless that year has already ended, in which
      case nothing is restored. Unused credit lapses on 31 December (alteration_credit_carryover false) or on the
      closed_date when the membership closes.
    eligibility:
      - id: credit_use_active_only
        applies_to: [loyalty_alteration_credit_use]
        kind: state
        condition: "The membership is in active status."
        evidence_fields: [loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.status]
          action_bindings:
            loyalty_memberships.status: status
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      per_tier:
        "Finch Circle Member": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Silver": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Gold": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Platinum": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Diamond": {annual_credit_usd: "=alteration_credit_annual_usd"}
        "Finch Circle Icon": {annual_credit_usd: "=alteration_credit_annual_usd"}

  - id: loyalty_birthday_reward
    subject: [loyalty_note_issue]
    rule: >-
      On the first day of the member's birth month (the month of customers.date_of_birth) a birthday Finch Note
      (issue_reason birthday) of the tier's birthday_note_usd is issued, valid for birthday_note_validity_days counting the
      issue date as day 1, for the tier held on that day. The membership has existed for at least birthday_min_membership_days
      calendar days before the first day of the birth month. A tier whose birthday_note_usd is not_applicable receives no
      birthday note; one birthday note is issued per calendar year; a missed birthday note (membership suspended on that day)
      is not issued later; the member's date of birth cannot be changed to move the birthday note.
    eligibility:
      - id: membership_age_for_birthday
        applies_to: [loyalty_note_issue]
        kind: time
        condition: "The membership has existed for at least birthday_min_membership_days calendar days before the first day of the birth month."
        evidence_fields: [loyalty_memberships.enrolled_date, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "The membership has existed"
          anchor_source: loyalty_memberships.enrolled_date
          relation: not_before
          duration_source: variants.birthday_min_membership_days
          unit: calendar_days
          counting_rule: "The membership has existed for at least birthday_min_membership_days calendar days before the first day of the birth month."
          boundary: inclusive
    params:
      per_tier:
        "Finch Circle Member": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Silver": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Gold": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Platinum": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Diamond": {birthday_note: "=birthday_note_usd"}
        "Finch Circle Icon": {birthday_note: "=birthday_note_usd"}

  - id: loyalty_program_integrity
    subject: [loyalty_suspension, loyalty_reinstatement, loyalty_termination]
    rule: >-
      A membership is suspended for review when, over the trailing 12 months, the count of distinct returns in
      loyalty_msr_return_ratio_12m is at least suspension_min_returns and the returned share of purchases exceeds
      suspension_return_ratio_pct. While suspended no points post, no notes convert or redeem, no alteration credit is used
      and no tier benefit applies; points, notes and credit already held are kept. The Finch Circle program team decides
      the review: reinstatement returns the membership to active, and termination closes it with every points, note and
      credit balance forfeited. Customer care cannot suspend, reinstate or terminate a membership, and cannot shorten a
      review.
    eligibility: []
    params: {}
    measures: [loyalty_msr_return_ratio_12m]

  - id: loyalty_cancellation_rules
    subject: [loyalty_cancellation]
    rule: >-
      Only the member can cancel a Finch Circle membership; customer care records the request as a loyalty_requests record
      with request_type membership_cancellation and the cancellation takes effect when the member confirms it. The member's
      cancellation request is recorded as submitted. On the closed_date the positive points balance, every unredeemed note
      and the remaining alteration credit are forfeited. Cancelling the membership does not close a Marlowe & Finch card
      account, and closing a card account does not cancel the membership. A suspended membership cannot be cancelled by the
      member while the review is open.
    eligibility:
      - id: cancellation_request_on_file
        applies_to: [loyalty_cancellation]
        kind: state
        condition: "The member's cancellation request is recorded as submitted."
        evidence_fields: [loyalty_requests.request_status, loyalty_requests.request_type, loyalty_requests.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_requests.membership_id]
          action_bindings:
            loyalty_requests.membership_id: membership_id
        state_contract:
          field: loyalty_requests.request_status
          allowed: [submitted]
    params: {}

extended_policies:
  - id: loyalty_ext_missing_points_credit
    base_policy_refs: [loyalty_missing_points, loyalty_evt_points_earn]
    overwrite:
      - base_policy: loyalty_missing_points
        superseded_clause: >-
          The credit is one loyalty_points_adjustment row equal to the purchase_base and bonus_event points
          that purchase would have earned at the tier and rates in effect on the purchase date, on the
          qualifying amount still kept after any refunded return.
        replaced_by: >-
          For a missing-points request this policy handles, and only for such a request, the credit is one
          points adjustment entry made of the late-credit purchase points, the late-credit bonus event
          points and the late-credit card bonus points of the claimed unit worked out below, on the
          qualifying amount of a unit the member still keeps, read at the tier on the membership record on
          the request date; every other points entry remains under the base earning rules.
      - base_policy: loyalty_missing_points
        superseded_clause: >-
          A member whose Finch Circle number was not captured at checkout may ask for the points of that
          purchase through a loyalty_requests record with request_type missing_points naming the
          purchase_id.
        replaced_by: >-
          For a missing-points request this policy handles, and only for such a request, the purchase whose
          points are asked for is the member's most recent purchase record, by purchase date, on which no
          Finch Circle number was captured and which is kept, that is, in completed status, and the request
          names that purchase record; a request for any other purchase is not one this policy handles and
          stays under the base missing-points rule.
      - base_policy: loyalty_evt_points_earn
        superseded_clause: >-
          For each purchase record in the member's name: purchase_base points equal the member's
          base_points_per_dollar on the purchase date times the purchase's net qualifying amount, and on a
          bonus event day the member was invited to, a separate bonus_event row adds (bonus_event_multiplier
          minus 1) times those base points.
        replaced_by: >-
          For the claimed unit of a missing-points request this policy handles, and only for that unit, the
          purchase points and the bonus event points are not posted as purchase points and bonus event
          entries at the purchase-date rate but are the late-credit purchase points and the late-credit
          bonus event points worked out below, folded into the one credit; every other purchase earns its
          purchase points and bonus event points under the base earning rule.
      - base_policy: loyalty_evt_points_earn
        superseded_clause: >-
          When the purchase was charged to a Marlowe & Finch card, a card_bonus row adds the card's
          mf_bonus_points_per_dollar times the amount charged for it.
        replaced_by: >-
          For the claimed unit of a missing-points request this policy handles, and only for that unit, a
          charge to a Marlowe & Finch card earns no separate card bonus entry: its card bonus is the
          late-credit card bonus points worked out below, folded into the one credit; every other purchase
          charged to a Marlowe & Finch card earns its card bonus entry under the base earning rule.
    trigger: on_request
    subject: [loyalty_points_adjustment]
    computes: points
    target_tool: file_missing_points_claim_8cff3bd6
    params:
      late_event_cutoff_days: 60
      late_event_half_days: 30
      half_share: 0.5
      standing_lookback_months: 6
    rule: >-
      A member whose Finch Circle number was not captured at checkout files the missing-points request for one
      purchase record. For a missing-points request this policy handles, and only for such a request, the
      purchase whose points are asked for is the member's most recent purchase record, by purchase date, on
      which no Finch Circle number was captured and which is kept, that is, in completed status, and the request
      names that purchase record; a request for any other purchase is not one this policy handles and stays
      under the base missing-points rule. The claimed unit is that purchase record. For a missing-points request
      this policy handles, and only for such a request, the credit is one points adjustment entry made of the
      late-credit purchase points, the late-credit bonus event points and the late-credit card bonus points of
      the claimed unit worked out below, on the qualifying amount of a unit the member still keeps, read at the
      tier on the membership record on the request date; every other points entry remains under the base earning
      rules. For the claimed unit of a missing-points request this policy handles, and only for that unit, the
      purchase points and the bonus event points are not posted as purchase points and bonus event entries at
      the purchase-date rate but are the late-credit purchase points and the late-credit bonus event points
      worked out below, folded into the one credit; every other purchase earns its purchase points and bonus
      event points under the base earning rule. For the claimed unit of a missing-points request this policy
      handles, and only for that unit, a charge to a Marlowe & Finch card earns no separate card bonus entry:
      its card bonus is the late-credit card bonus points worked out below, folded into the one credit; every
      other purchase charged to a Marlowe & Finch card earns its card bonus entry under the base earning rule.
      The late-credit qualifying amount is the claimed unit's unit price less the Finch Notes applied to it. The
      late-credit purchase points are the late-credit qualifying amount times the base points per dollar of the
      tier on the membership record on the request date, rounded down to whole points. The credit is the
      late-credit purchase points, plus the late-credit bonus event points, plus the late-credit card bonus
      points. The late-credit bonus event points are the late-credit purchase points times the tier's bonus
      event multiplier minus one, times the bonus event indicator, times the late-claim event share, times the
      price-type event share, rounded down to whole points. The late-credit card bonus points are the
      late-credit qualifying amount times the late-credit card bonus rate, times the late-credit financing
      share, times the late-credit standing share, rounded down to whole points. The missing-points credit is
      fixed only after the membership record shows at least the Finch Circle tier that an active Marlowe & Finch
      card status floor grants the member. The bonus event indicator is 1 when the membership carries a bonus
      event points entry posted on the claimed unit's purchase date, and 0 otherwise. The late-claim event share
      is the whole (1). The price-type event share is the whole (1). The late-credit card bonus rate is 0. The
      late-credit financing share is the whole (1). The late-credit standing share is none (0). The day tested
      for the bonus event indicator depends on how the unit was bought: an online, app or phone order that was
      not collected by store pickup is tested on its ship date; a store pickup order is tested on its pickup
      date (its completed date); any other purchase is tested on its purchase date; the indicator is 1 when a
      bonus event points entry is posted on the day tested and 0 otherwise. The late-claim event share is read
      from the calendar days from the claimed unit's purchase date to the request date: more than 60 days gives
      none (0), more than 30 and up to 60 days gives one half (0.5), and 30 days or fewer gives the whole (1).
      The price-type event share is none (0) when the claimed unit was bought at a doorbuster or final sale
      price, one half (0.5) when it was bought at a clearance price, and the whole (1) at any other price. The
      late-credit card bonus rate is 3 points per dollar when the unit was charged to a Marlowe & Finch card
      whose Marlowe & Finch bonus is 3 points per dollar, 2 when it was charged to a card whose bonus is 2
      points per dollar, 1 when it was charged to a card whose bonus is 1 point per dollar, and 0 when the unit
      was not charged to a Marlowe & Finch card. The late-credit financing share is 0 when the card purchase
      charged for the unit's order carries an 18-month deferred interest plan, one half (0.5) when it carries a
      12-month deferred interest plan, and the whole (1) when it carries no special financing plan. The
      late-credit standing share is the whole (1) when the charged card account is active and shows no returned
      payment dated within the last 6 whole months before the request date, one half (0.5) when the account is
      active and shows such a returned payment, and none (0) when the account is not active.
    prerequisite:
      - problem: loyalty_ext_card_floor_tier
        kind: value_input
        gate: earn_rate
        form: state
        policy_source: >-
          The missing-points credit is fixed only after the membership record shows at least the Finch
          Circle tier that an active Marlowe & Finch card status floor grants the member.
        condition: >-
          The membership's variant_name is at least the floor tier that the member's active card grants
          (Finch Circle Gold for an active Store Card Elite or Platinum Mastercard, Finch Circle Platinum
          for an active World Elite Mastercard), with last_tier_change_type card_floor where the floor
          lifted the tier.
        resolved_by: apply_card_status_floor_f82dd75f
        effect: >-
          Once the floor tier is on the membership record, earn_rate reads that tier's base points per
          dollar and tier_event_multiplier reads that tier's bonus event multiplier, so the purchase points
          and the bonus event points are figured at the floor tier's rates instead of the lower tier's.
    cross_category:
      - category: order
        as: branch
        reads: [unit_price, finch_notes_applied, channel, fulfillment, ship_date, completed_date, purchase_date, price_type, tender_type, card_account_id, order_number, membership_linked, status]
        note: "The claimed unit's purchase record supplies the qualifying amount, the day tested (event_day_anchor), its age (late_event_share), its price type (price_type_share) and the card charged."
      - category: card
        as: history
        reads: [mf_bonus_points_per_dollar, status, card_transactions.promo_plan, card_transactions.event_type]
        note: "The charged card's bonus rate, its special financing plan and its returned payments decide card_bonus_rate, financing_share and card_standing_share."
    compute:
      - claim_price: "XLATEST('order', 'purchases', 'unit_price', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_notes: "XLATEST('order', 'purchases', 'finch_notes_applied', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_amount: "claim_price - claim_notes"
      - earn_rate: "P('base_points_per_dollar')"
      - purchase_points: "int(claim_amount * earn_rate)"
      - tier_event_multiplier: "P('bonus_event_multiplier')"
      - claim_date: "XLATEST('order', 'purchases', 'purchase_date', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_channel: "XLATEST('order', 'purchases', 'channel', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_fulfillment: "XLATEST('order', 'purchases', 'fulfillment', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_ship: "XLATEST('order', 'purchases', 'ship_date', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_pickup: "XLATEST('order', 'purchases', 'completed_date', date_field='purchase_date', membership_linked=False, status='completed')"
      - event_indicator: "(1 if COUNT('loyalty_points_ledger', event_type='loyalty_points_earn', earn_source='bonus_event', entry_date=claim_ship) > 0 else 0) if ((claim_channel == 'online' or claim_channel == 'app' or claim_channel == 'phone_order') and claim_fulfillment != 'store_pickup') else ((1 if COUNT('loyalty_points_ledger', event_type='loyalty_points_earn', earn_source='bonus_event', entry_date=claim_pickup) > 0 else 0) if claim_fulfillment == 'store_pickup' else (1 if COUNT('loyalty_points_ledger', event_type='loyalty_points_earn', earn_source='bonus_event', entry_date=claim_date) > 0 else 0))"
      - claim_age: "DAYS(claim_date, NOW) if claim_date else 0"
      - late_event_share: "0 if claim_age > K('late_event_cutoff_days') else (K('half_share') if claim_age > K('late_event_half_days') else 1)"
      - claim_price_type: "XLATEST('order', 'purchases', 'price_type', date_field='purchase_date', membership_linked=False, status='completed')"
      - price_share: "0 if (claim_price_type == 'doorbuster' or claim_price_type == 'final_sale') else (K('half_share') if claim_price_type == 'clearance' else 1)"
      - claim_tender: "XLATEST('order', 'purchases', 'tender_type', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_card: "XLATEST('order', 'purchases', 'card_account_id', date_field='purchase_date', membership_linked=False, status='completed')"
      - claim_order: "XLATEST('order', 'purchases', 'order_number', date_field='purchase_date', membership_linked=False, status='completed')"
      - card_rate_param: "CPARAM('card', 'mf_bonus_points_per_dollar', card_account_id=claim_card)"
      - card_bonus_rate: "3 if (claim_tender == 'mf_card' and card_rate_param == 3) else (2 if (claim_tender == 'mf_card' and card_rate_param == 2) else (1 if (claim_tender == 'mf_card' and card_rate_param == 1) else 0))"
      - claim_plan: "XLATEST('card', 'card_transactions', 'promo_plan', date_field='txn_date', event_type='card_purchase', order_number=claim_order)"
      - financing_share: "0 if claim_plan == 'deferred_interest_18' else (K('half_share') if claim_plan == 'deferred_interest_12' else 1)"
      - card_state: "CFIELD('card', 'status', card_account_id=claim_card)"
      - returned_payments: "XCOUNT('card', 'card_transactions', within_months=K('standing_lookback_months'), date_field='txn_date', event_type='card_payment_returned', card_account_id=claim_card)"
      - standing_share: "1 if (card_state == 'active' and returned_payments == 0) else (K('half_share') if (card_state == 'active' and returned_payments > 0) else 0)"
      - result: "purchase_points + int(purchase_points * (tier_event_multiplier - 1) * event_indicator * late_event_share * price_share) + int(claim_amount * card_bonus_rate * financing_share * standing_share)"
    compute_basis:
      claim_price: "The late-credit qualifying amount is the claimed unit's unit price less the Finch Notes applied to it."
      claim_notes: "The late-credit qualifying amount is the claimed unit's unit price less the Finch Notes applied to it."
      claim_amount: "the purchase whose points are asked for is the member's most recent purchase record, by purchase date, on which no Finch Circle number was captured and which is kept, that is, in completed status"
      earn_rate: "The late-credit purchase points are the late-credit qualifying amount times the base points per dollar of the tier on the membership record on the request date, rounded down to whole points."
      purchase_points: "The late-credit purchase points are the late-credit qualifying amount times the base points per dollar of the tier on the membership record on the request date, rounded down to whole points."
      tier_event_multiplier: "The late-credit bonus event points are the late-credit purchase points times the tier's bonus event multiplier minus one"
      claim_date: "any other purchase is tested on its purchase date"
      claim_channel: "an online, app or phone order that was not collected by store pickup is tested on its ship date"
      claim_fulfillment: "a store pickup order is tested on its pickup date (its completed date)"
      claim_ship: "an online, app or phone order that was not collected by store pickup is tested on its ship date"
      claim_pickup: "a store pickup order is tested on its pickup date (its completed date)"
      event_indicator: "The day tested for the bonus event indicator depends on how the unit was bought: an online, app or phone order that was not collected by store pickup is tested on its ship date; a store pickup order is tested on its pickup date (its completed date); any other purchase is tested on its purchase date; the indicator is 1 when a bonus event points entry is posted on the day tested and 0 otherwise."
      claim_age: "The late-claim event share is read from the calendar days from the claimed unit's purchase date to the request date"
      late_event_share: "more than 60 days gives none (0), more than 30 and up to 60 days gives one half (0.5), and 30 days or fewer gives the whole (1)."
      claim_price_type: "The price-type event share is none (0) when the claimed unit was bought at a doorbuster or final sale price"
      price_share: "The price-type event share is none (0) when the claimed unit was bought at a doorbuster or final sale price, one half (0.5) when it was bought at a clearance price, and the whole (1) at any other price."
      claim_tender: "and 0 when the unit was not charged to a Marlowe & Finch card."
      claim_card: "The late-credit card bonus rate is 3 points per dollar when the unit was charged to a Marlowe & Finch card whose Marlowe & Finch bonus is 3 points per dollar"
      claim_order: "The late-credit financing share is 0 when the card purchase charged for the unit's order carries an 18-month deferred interest plan"
      card_rate_param: "2 when it was charged to a card whose bonus is 2 points per dollar, 1 when it was charged to a card whose bonus is 1 point per dollar"
      card_bonus_rate: "The late-credit card bonus rate is 3 points per dollar when the unit was charged to a Marlowe & Finch card whose Marlowe & Finch bonus is 3 points per dollar, 2 when it was charged to a card whose bonus is 2 points per dollar, 1 when it was charged to a card whose bonus is 1 point per dollar, and 0 when the unit was not charged to a Marlowe & Finch card."
      claim_plan: "The late-credit financing share is 0 when the card purchase charged for the unit's order carries an 18-month deferred interest plan"
      financing_share: "The late-credit financing share is 0 when the card purchase charged for the unit's order carries an 18-month deferred interest plan, one half (0.5) when it carries a 12-month deferred interest plan, and the whole (1) when it carries no special financing plan."
      card_state: "The late-credit standing share is the whole (1) when the charged card account is active"
      returned_payments: "shows no returned payment dated within the last 6 whole months before the request date"
      standing_share: "The late-credit standing share is the whole (1) when the charged card account is active and shows no returned payment dated within the last 6 whole months before the request date, one half (0.5) when the account is active and shows such a returned payment, and none (0) when the account is not active."
      result: "The credit is the late-credit purchase points, plus the late-credit bonus event points, plus the late-credit card bonus points. The late-credit bonus event points are the late-credit purchase points times the tier's bonus event multiplier minus one, times the bonus event indicator, times the late-claim event share, times the price-type event share, rounded down to whole points. The late-credit card bonus points are the late-credit qualifying amount times the late-credit card bonus rate, times the late-credit financing share, times the late-credit standing share, rounded down to whole points."
    factors:
      - id: event_day_anchor
        effect: method
        decides: event_indicator
        bindings: [claim_channel, claim_fulfillment, claim_ship, claim_pickup, event_indicator]
        ladder:
          - when: "an online, app or phone order that was not collected by store pickup"
            method: "a bonus event entry is looked for on the ship date"
          - when: "a store pickup order"
            method: "a bonus event entry is looked for on the pickup date (the completed date)"
          - when: "otherwise"
            method: "a bonus event entry is looked for on the purchase date"
        baseline:
          event_indicator: "1 if COUNT('loyalty_points_ledger', event_type='loyalty_points_earn', earn_source='bonus_event', entry_date=claim_date) > 0 else 0"
        evidence: [cross_category, history, date]
        cross_difficulty: order
      - id: late_event_share
        effect: parameter
        decides: late_event_share
        bindings: [claim_age, late_event_share]
        ladder:
          - when: "more than 60 calendar days from the purchase date to the request date"
            value: "0"
          - when: "more than 30 and up to 60 days"
            value: "K('half_share')"
          - when: "otherwise (30 days or fewer)"
            value: "1"
        baseline:
          late_event_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: price_type_share
        effect: parameter
        decides: price_share
        bindings: [claim_price_type, price_share]
        ladder:
          - when: "the claimed unit was bought at a doorbuster or final sale price"
            value: "0"
          - when: "it was bought at a clearance price"
            value: "K('half_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          price_share: "1"
        evidence: [cross_category]
        cross_difficulty: order
      - id: card_bonus_rate
        effect: parameter
        decides: card_bonus_rate
        bindings: [claim_tender, card_rate_param, card_bonus_rate]
        ladder:
          - when: "charged to a Marlowe & Finch card whose bonus is 3 points per dollar"
            value: "3"
          - when: "charged to a Marlowe & Finch card whose bonus is 2 points per dollar"
            value: "2"
          - when: "charged to a Marlowe & Finch card whose bonus is 1 point per dollar"
            value: "1"
          - when: "otherwise (not charged to a Marlowe & Finch card)"
            value: "0"
        baseline:
          card_bonus_rate: "0"
        evidence: [cross_category]
        cross_difficulty: card
      - id: financing_share
        effect: parameter
        decides: financing_share
        bindings: [claim_plan, financing_share]
        ladder:
          - when: "the card purchase charged for the unit's order carries an 18-month deferred interest plan"
            value: "0"
          - when: "it carries a 12-month deferred interest plan"
            value: "K('half_share')"
          - when: "otherwise (no special financing plan)"
            value: "1"
        baseline:
          financing_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: card_standing_share
        effect: parameter
        decides: standing_share
        bindings: [card_state, returned_payments, standing_share]
        ladder:
          - when: "the charged card account is active AND shows no returned payment within the last 6 whole months"
            value: "1"
          - when: "the charged card account is active AND shows a returned payment within the last 6 whole months"
            value: "K('half_share')"
          - when: "otherwise (the account is not active)"
            value: "0"
        baseline:
          standing_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
    baseline:
      rule: >-
        The late-credit qualifying amount is the claimed unit's unit price less the Finch Notes applied to it.
        The late-credit purchase points are the late-credit qualifying amount times the base points per dollar
        of the tier on the membership record on the request date, rounded down to whole points. The credit is
        the late-credit purchase points, plus the late-credit bonus event points, plus the late-credit card
        bonus points. The late-credit bonus event points are the late-credit purchase points times the tier's
        bonus event multiplier minus one, times the bonus event indicator, times the late-claim event share,
        times the price-type event share, rounded down to whole points. The late-credit card bonus points are
        the late-credit qualifying amount times the late-credit card bonus rate, times the late-credit
        financing share, times the late-credit standing share, rounded down to whole points. The bonus event
        indicator is 1 when the membership carries a bonus event points entry posted on the claimed unit's
        purchase date, and 0 otherwise. The late-claim event share is the whole (1). The price-type event
        share is the whole (1). The late-credit card bonus rate is 0. The late-credit financing share is the
        whole (1). The late-credit standing share is none (0).
      params: [base_points_per_dollar, bonus_event_multiplier]
    inputs:
      history:
        - {"table": "loyalty_points_ledger", "aggregate": "count", "field": "entry_date", "filters": {"event_type": "loyalty_points_earn", "earn_source": "bonus_event"}}
        - {"category": "card", "table": "card_transactions", "aggregate": "latest", "field": "promo_plan", "filters": {"event_type": "card_purchase"}}
        - {"category": "card", "table": "card_transactions", "aggregate": "count", "field": "txn_date", "within_months": 6, "filters": {"event_type": "card_payment_returned"}}
      cross_category: [order, card]
  - id: loyalty_ext_card_floor_tier
    base_policy_refs: [loyalty_tier_qualification, loyalty_tier_benefits, loyalty_alteration_credit_rules]
    overwrite:
      - base_policy: loyalty_alteration_credit_rules
        superseded_clause: >-
          After an upgrade or card floor during the year, a top-up (grant_reason tier_upgrade_top_up) equal
          to the new tier's annual amount minus the amounts already granted for that benefit_year posts on
          the change date; nothing is taken back after a downgrade.
        replaced_by: >-
          For a card floor this policy handles, and only for such a tier change, the alteration credit
          top-up posted on the change date is the floor top-up worked out below; a top-up after an upgrade
          or any other tier change remains under the base alteration credit rule, and nothing is taken back
          after a downgrade.
    trigger: state_due
    subject: [loyalty_tier_change]
    computes: top_up_amount
    target_tool: apply_card_status_floor_f82dd75f
    params:
      platinum_floor_credit: 100.0
      gold_floor_credit: 50.0
      goodwill_year_days: 365
      goodwill_long_days: 180
      goodwill_short_days: 90
      goodwill_year_usd: 25.0
      goodwill_long_usd: 15.0
      goodwill_short_usd: 10.0
      spend_high_usd: 3000.0
      spend_low_usd: 1500.0
      allowance_high_usd: 20.0
      allowance_low_usd: 10.0
      lookback_months: 12
      half_share: 0.5
      late_fee_cutoff: 2
      tailoring_many: 3
      tailoring_many_usd: 10.0
      tailoring_some_usd: 5.0
      bridal_near_days: 120
      bridal_far_days: 365
      bridal_near_usd: 20.0
      bridal_far_usd: 10.0
      apparel_many: 3
      apparel_many_usd: 10.0
      apparel_some_usd: 5.0
    rule: >-
      When the customer holds a Marlowe & Finch card account in active status whose card grants a higher Finch
      Circle tier than the membership record shows (Finch Circle Gold for a Store Card Elite or a Platinum
      Mastercard, Finch Circle Platinum for a World Elite Mastercard), the membership is moved to that floor
      tier as a card floor, and the change posts no points bonus. The floor card is the active card that grants
      the floor: an active World Elite Mastercard when the customer holds one, otherwise an active Store Card
      Elite, otherwise an active Platinum Mastercard. For a card floor this policy handles, and only for such a
      tier change, the alteration credit top-up posted on the change date is the floor top-up worked out below;
      a top-up after an upgrade or any other tier change remains under the base alteration credit rule, and
      nothing is taken back after a downgrade. The floor top-up is the floor credit gap, plus the floor goodwill
      credit, plus the floor card spend allowance times the floor allowance standing share, plus the floor
      tailoring allowance, plus the floor bridal allowance, plus the floor apparel allowance, rounded half up to
      the cent once, at the end. The floor credit gap is the annual alteration credit of the floor tier (100.00
      for Finch Circle Platinum, 50.00 for Finch Circle Gold) less the alteration credit balance the membership
      already holds, never below zero. The floor goodwill credit is counted on the days from the date the floor
      card account was opened to the change date: 25.00 when they run more than 365 calendar days, 15.00 when
      more than 180 and up to 365 days, 10.00 when more than 90 and up to 180 days, and 0.00 otherwise. The
      floor allowance standing share is none (0). The floor card spend allowance, the floor tailoring allowance,
      the floor bridal allowance and the floor apparel allowance are 0.00. The floor goodwill credit is counted,
      on the same scale, on the days from the membership's enrolled date to the change date when the membership
      was enrolled after the floor card reached its current card (its status review date, or its opened date
      when it has no status review date); on the days from the floor card's status review date when the card
      reached its current card at a card status review and the membership is older; and otherwise on the days
      from the date the floor card account was opened. The floor card spend allowance is 20.00 when the Marlowe
      & Finch purchases charged to the customer's Marlowe & Finch cards in the last 12 whole months, less the
      Marlowe & Finch merchandise credits posted to them in that time, total 3,000.00 or more, 10.00 when they
      total 1,500.00 or more but less than 3,000.00, and 0.00 otherwise. The floor allowance standing share is
      the whole (1) when no late fee was charged on the customer's Marlowe & Finch card accounts within the last
      12 whole months, one half (0.5) when exactly one was, and none (0) when two or more were. The floor
      tailoring allowance is 10.00 when the customer has dropped off three or more alteration tickets in the
      last 12 whole months, 5.00 when one or two, and 0.00 when none. The floor bridal allowance is 20.00 when
      the customer has an active Wedding Registry whose event date falls 0 to 120 calendar days after the change
      date, 10.00 when it falls more than 120 and up to 365 days after, and 0.00 otherwise. The floor apparel
      allowance is 10.00 when the customer has three or more completed Apparel, Shoes & Accessories purchase
      records dated within the last 12 whole months, 5.00 when one or two, and 0.00 when none.
    prerequisite: []
    cross_category:
      - category: card
        as: history
        reads: [variant_name, status, status_review_date, opened_date, card_transactions.amount, card_transactions.fee_type]
        note: "The floor card's dates decide goodwill_anchor; Marlowe & Finch card purchases, credits and late fees decide card_spend_allowance and allowance_standing."
      - category: alteration
        as: history
        reads: [dropoff_date]
        note: "Alteration tickets dropped off in the last 12 whole months decide tailoring_allowance."
      - category: registry
        as: branch
        reads: [variant_name, status, event_date]
        note: "An active Wedding Registry's event date decides bridal_allowance."
      - category: order
        as: history
        reads: [variant_name, status, purchase_date]
        note: "Completed apparel purchase records in the last 12 whole months decide apparel_allowance."
    compute:
      - has_world_elite: "EXISTS('card', status='active', variant_name='Marlowe & Finch World Elite Mastercard')"
      - has_store_elite: "EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite')"
      - has_platinum_mc: "EXISTS('card', status='active', variant_name='Marlowe & Finch Platinum Mastercard')"
      - floor_card: "'Marlowe & Finch World Elite Mastercard' if has_world_elite else ('Marlowe & Finch Store Card Elite' if has_store_elite else ('Marlowe & Finch Platinum Mastercard' if has_platinum_mc else None))"
      - floor_credit: "K('platinum_floor_credit') if floor_card == 'Marlowe & Finch World Elite Mastercard' else K('gold_floor_credit')"
      - held_credit: "F('alteration_credit_balance')"
      - credit_gap: "MX(0, floor_credit - held_credit)"
      - card_review: "CFIELD('card', 'status_review_date', status='active', variant_name=floor_card)"
      - card_opened: "CFIELD('card', 'opened_date', status='active', variant_name=floor_card)"
      - enrolled_on: "F('enrolled_date')"
      - goodwill: "(K('goodwill_year_usd') if DAYS(enrolled_on, NOW) > K('goodwill_year_days') else (K('goodwill_long_usd') if DAYS(enrolled_on, NOW) > K('goodwill_long_days') else (K('goodwill_short_usd') if DAYS(enrolled_on, NOW) > K('goodwill_short_days') else 0))) if ((card_review or card_opened) and enrolled_on > (card_review if card_review else card_opened)) else ((K('goodwill_year_usd') if DAYS(card_review, NOW) > K('goodwill_year_days') else (K('goodwill_long_usd') if DAYS(card_review, NOW) > K('goodwill_long_days') else (K('goodwill_short_usd') if DAYS(card_review, NOW) > K('goodwill_short_days') else 0))) if card_review else (K('goodwill_year_usd') if DAYS(card_opened, NOW) > K('goodwill_year_days') else (K('goodwill_long_usd') if DAYS(card_opened, NOW) > K('goodwill_long_days') else (K('goodwill_short_usd') if DAYS(card_opened, NOW) > K('goodwill_short_days') else 0))))"
      - card_spend: "XSUM('card', 'card_transactions', 'amount', within_months=K('lookback_months'), date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch') - XSUM('card', 'card_transactions', 'amount', within_months=K('lookback_months'), date_field='txn_date', event_type='card_merchandise_credit')"
      - spend_allowance: "K('allowance_high_usd') if card_spend >= K('spend_high_usd') else (K('allowance_low_usd') if card_spend >= K('spend_low_usd') else 0)"
      - late_fees: "XCOUNT('card', 'card_transactions', within_months=K('lookback_months'), date_field='txn_date', event_type='card_fee', fee_type='late_fee')"
      - allowance_share: "1 if late_fees == 0 else (K('half_share') if late_fees < K('late_fee_cutoff') else 0)"
      - tickets: "XCOUNT('alteration', 'alteration_tickets', within_months=K('lookback_months'), date_field='dropoff_date')"
      - tailoring: "K('tailoring_many_usd') if tickets >= K('tailoring_many') else (K('tailoring_some_usd') if tickets >= 1 else 0)"
      - wedding_date: "CFIELD('registry', 'event_date', status='active', variant_name='Wedding Registry')"
      - wedding_gap: "DAYS(NOW, wedding_date) if wedding_date else -1"
      - bridal: "K('bridal_near_usd') if (wedding_gap >= 0 and wedding_gap <= K('bridal_near_days')) else (K('bridal_far_usd') if (wedding_gap > K('bridal_near_days') and wedding_gap <= K('bridal_far_days')) else 0)"
      - apparel_buys: "XCOUNT('order', 'purchases', within_months=K('lookback_months'), date_field='purchase_date', variant_name='Apparel, Shoes & Accessories', status='completed')"
      - apparel: "K('apparel_many_usd') if apparel_buys >= K('apparel_many') else (K('apparel_some_usd') if apparel_buys >= 1 else 0)"
      - result: "int((credit_gap + goodwill + spend_allowance * allowance_share + tailoring + bridal + apparel) * 100 + 0.5) / 100"
    compute_basis:
      has_world_elite: "The floor card is the active card that grants the floor: an active World Elite Mastercard when the customer holds one, otherwise an active Store Card Elite, otherwise an active Platinum Mastercard."
      has_store_elite: "The floor card is the active card that grants the floor: an active World Elite Mastercard when the customer holds one, otherwise an active Store Card Elite, otherwise an active Platinum Mastercard."
      has_platinum_mc: "The floor card is the active card that grants the floor: an active World Elite Mastercard when the customer holds one, otherwise an active Store Card Elite, otherwise an active Platinum Mastercard."
      floor_card: "The floor card is the active card that grants the floor: an active World Elite Mastercard when the customer holds one, otherwise an active Store Card Elite, otherwise an active Platinum Mastercard."
      floor_credit: "The floor credit gap is the annual alteration credit of the floor tier (100.00 for Finch Circle Platinum, 50.00 for Finch Circle Gold) less the alteration credit balance the membership already holds, never below zero."
      held_credit: "The floor credit gap is the annual alteration credit of the floor tier (100.00 for Finch Circle Platinum, 50.00 for Finch Circle Gold) less the alteration credit balance the membership already holds, never below zero."
      credit_gap: "The floor credit gap is the annual alteration credit of the floor tier (100.00 for Finch Circle Platinum, 50.00 for Finch Circle Gold) less the alteration credit balance the membership already holds, never below zero."
      card_review: "on the days from the floor card's status review date when the card reached its current card at a card status review and the membership is older"
      card_opened: "The floor goodwill credit is counted on the days from the date the floor card account was opened to the change date"
      enrolled_on: "on the days from the membership's enrolled date to the change date when the membership was enrolled after the floor card reached its current card (its status review date, or its opened date when it has no status review date)"
      goodwill: "The floor goodwill credit is counted, on the same scale, on the days from the membership's enrolled date to the change date when the membership was enrolled after the floor card reached its current card (its status review date, or its opened date when it has no status review date); on the days from the floor card's status review date when the card reached its current card at a card status review and the membership is older; and otherwise on the days from the date the floor card account was opened."
      card_spend: "when the Marlowe & Finch purchases charged to the customer's Marlowe & Finch cards in the last 12 whole months, less the Marlowe & Finch merchandise credits posted to them in that time, total 3,000.00 or more"
      spend_allowance: "The floor card spend allowance is 20.00 when the Marlowe & Finch purchases charged to the customer's Marlowe & Finch cards in the last 12 whole months, less the Marlowe & Finch merchandise credits posted to them in that time, total 3,000.00 or more, 10.00 when they total 1,500.00 or more but less than 3,000.00, and 0.00 otherwise."
      late_fees: "when no late fee was charged on the customer's Marlowe & Finch card accounts within the last 12 whole months"
      allowance_share: "The floor allowance standing share is the whole (1) when no late fee was charged on the customer's Marlowe & Finch card accounts within the last 12 whole months, one half (0.5) when exactly one was, and none (0) when two or more were."
      tickets: "when the customer has dropped off three or more alteration tickets in the last 12 whole months"
      tailoring: "The floor tailoring allowance is 10.00 when the customer has dropped off three or more alteration tickets in the last 12 whole months, 5.00 when one or two, and 0.00 when none."
      wedding_date: "when the customer has an active Wedding Registry whose event date falls 0 to 120 calendar days after the change date"
      wedding_gap: "when the customer has an active Wedding Registry whose event date falls 0 to 120 calendar days after the change date"
      bridal: "The floor bridal allowance is 20.00 when the customer has an active Wedding Registry whose event date falls 0 to 120 calendar days after the change date, 10.00 when it falls more than 120 and up to 365 days after, and 0.00 otherwise."
      apparel_buys: "when the customer has three or more completed Apparel, Shoes & Accessories purchase records dated within the last 12 whole months"
      apparel: "The floor apparel allowance is 10.00 when the customer has three or more completed Apparel, Shoes & Accessories purchase records dated within the last 12 whole months, 5.00 when one or two, and 0.00 when none."
      result: "The floor top-up is the floor credit gap, plus the floor goodwill credit, plus the floor card spend allowance times the floor allowance standing share, plus the floor tailoring allowance, plus the floor bridal allowance, plus the floor apparel allowance, rounded half up to the cent once, at the end."
    factors:
      - id: goodwill_anchor
        effect: method
        decides: goodwill
        bindings: [card_review, card_opened, enrolled_on, goodwill]
        ladder:
          - when: "the membership was enrolled after the floor card reached its current card"
            method: "the goodwill scale is applied to the days from the membership's enrolled date"
          - when: "the floor card reached its current card at a card status review and the membership is older"
            method: "the goodwill scale is applied to the days from the floor card's status review date"
          - when: "otherwise"
            method: "the goodwill scale is applied to the days from the date the floor card account was opened"
        baseline:
          goodwill: "K('goodwill_year_usd') if DAYS(card_opened, NOW) > K('goodwill_year_days') else (K('goodwill_long_usd') if DAYS(card_opened, NOW) > K('goodwill_long_days') else (K('goodwill_short_usd') if DAYS(card_opened, NOW) > K('goodwill_short_days') else 0))"
        evidence: [cross_category, date]
        cross_difficulty: card
      - id: card_spend_allowance
        effect: parameter
        decides: spend_allowance
        bindings: [card_spend, spend_allowance]
        ladder:
          - when: "Marlowe & Finch card purchases less Marlowe & Finch merchandise credits in the last 12 whole months total 3,000.00 or more"
            value: "K('allowance_high_usd')"
          - when: "they total 1,500.00 or more but less than 3,000.00"
            value: "K('allowance_low_usd')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          spend_allowance: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: allowance_standing
        effect: parameter
        decides: allowance_share
        bindings: [late_fees, allowance_share]
        ladder:
          - when: "no late fee charged on the customer's card accounts within the last 12 whole months"
            value: "1"
          - when: "exactly one late fee in that time"
            value: "K('half_share')"
          - when: "otherwise (two or more)"
            value: "0"
        baseline:
          allowance_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: tailoring_allowance
        effect: parameter
        decides: tailoring
        bindings: [tickets, tailoring]
        ladder:
          - when: "three or more alteration tickets dropped off in the last 12 whole months"
            value: "K('tailoring_many_usd')"
          - when: "one or two"
            value: "K('tailoring_some_usd')"
          - when: "otherwise (none)"
            value: "0.00"
        baseline:
          tailoring: "0"
        evidence: [cross_category, history]
        cross_difficulty: alteration
      - id: bridal_allowance
        effect: parameter
        decides: bridal
        bindings: [wedding_date, wedding_gap, bridal]
        ladder:
          - when: "an active Wedding Registry whose event date falls 0 to 120 calendar days after the change date"
            value: "K('bridal_near_usd')"
          - when: "it falls more than 120 and up to 365 days after"
            value: "K('bridal_far_usd')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          bridal: "0"
        evidence: [cross_category, date]
        cross_difficulty: registry
      - id: apparel_allowance
        effect: parameter
        decides: apparel
        bindings: [apparel_buys, apparel]
        ladder:
          - when: "three or more completed Apparel, Shoes & Accessories purchase records within the last 12 whole months"
            value: "K('apparel_many_usd')"
          - when: "one or two"
            value: "K('apparel_some_usd')"
          - when: "otherwise (none)"
            value: "0.00"
        baseline:
          apparel: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
    baseline:
      rule: >-
        The floor top-up is the floor credit gap, plus the floor goodwill credit, plus the floor card spend
        allowance times the floor allowance standing share, plus the floor tailoring allowance, plus the floor
        bridal allowance, plus the floor apparel allowance, rounded half up to the cent once, at the end. The
        floor credit gap is the annual alteration credit of the floor tier (100.00 for Finch Circle Platinum,
        50.00 for Finch Circle Gold) less the alteration credit balance the membership already holds, never
        below zero. The floor goodwill credit is counted on the days from the date the floor card account was
        opened to the change date: 25.00 when they run more than 365 calendar days, 15.00 when more than 180
        and up to 365 days, 10.00 when more than 90 and up to 180 days, and 0.00 otherwise. The floor
        allowance standing share is none (0). The floor card spend allowance, the floor tailoring allowance,
        the floor bridal allowance and the floor apparel allowance are 0.00.
      params: [platinum_floor_credit, gold_floor_credit, goodwill_year_usd, goodwill_long_usd, goodwill_short_usd]
    inputs:
      history:
        - {"category": "card", "table": "card_transactions", "aggregate": "sum", "field": "amount", "within_months": 12, "filters": {"event_type": "card_purchase", "merchant_category": "marlowe_finch"}}
        - {"category": "card", "table": "card_transactions", "aggregate": "sum", "field": "amount", "within_months": 12, "filters": {"event_type": "card_merchandise_credit"}}
        - {"category": "card", "table": "card_transactions", "aggregate": "count", "field": "txn_date", "within_months": 12, "filters": {"event_type": "card_fee", "fee_type": "late_fee"}}
        - {"category": "alteration", "table": "alteration_tickets", "aggregate": "count", "field": "dropoff_date", "within_months": 12, "filters": {}}
        - {"category": "order", "table": "purchases", "aggregate": "count", "field": "purchase_date", "within_months": 12, "filters": {"variant_name": "Apparel, Shoes & Accessories", "status": "completed"}}
      cross_category: [card, alteration, registry, order]
  - id: loyalty_ext_return_points_deduction
    base_policy_refs: [loyalty_evt_points_reversal]
    overwrite:
      - base_policy: loyalty_evt_points_reversal
        superseded_clause: >-
          When a return of merchandise from a purchase is refunded, every purchase_base, bonus_event,
          card_bonus and missing_points_credit row of that purchase is reduced in proportion to the refunded
          qualifying amount: the points deducted for one earn row are that row's points times the refunded
          qualifying amount divided by the row's qualifying_amount, rounded half up to whole points, booked
          as one loyalty_points_reversal per earn row naming the return_id and the
          original_loyalty_entry_id.
        replaced_by: >-
          For a refunded return this policy handles, and only for such a return, the points taken back for
          the returned unit are booked as one return deduction entry naming the return and the unit's
          purchase points entry (or its missing-points credit entry), made of the return purchase points,
          the return bonus event points and the return card bonus points, each taken in proportion to the
          refunded amount that applies to it, multiplied by the return share that applies to it and rounded
          half up to whole points, the sum then multiplied by the return frequency cushion and the return
          balance relief and rounded half up once more; no other deduction entry is booked for that return.
    trigger: state_due
    subject: [loyalty_points_reversal]
    computes: points
    target_tool: book_return_points_deduction_52e06983
    params:
      half_share: 0.5
      exchange_days: 14
      lookback_months: 12
      first_return_cushion: 0.95
      second_return_cushion: 0.98
      gold_relief: 0.9
      entry_relief: 0.95
    rule: >-
      The returned unit is the member's purchase record most recently received back in returned status, and the
      refunded return is its refund record. For a refunded return this policy handles, and only for such a
      return, the points taken back for the returned unit are booked as one return deduction entry naming the
      return and the unit's purchase points entry (or its missing-points credit entry), made of the return
      purchase points, the return bonus event points and the return card bonus points, each taken in proportion
      to the refunded amount that applies to it, multiplied by the return share that applies to it and rounded
      half up to whole points, the sum then multiplied by the return frequency cushion and the return balance
      relief and rounded half up once more; no other deduction entry is booked for that return. Finch Notes
      already issued are never taken back, and tier upgrade and enrollment bonuses are never taken back; the
      deduction applies even when it takes the balance below zero. The return deduction is the return purchase
      points plus the return bonus event points plus the return card bonus points, times the return frequency
      cushion, times the return balance relief, rounded half up to whole points. The return purchase points are
      the returned unit's purchase points (its purchase points entry plus any missing-points credit entry) times
      the refunded qualifying amount divided by the qualifying amount on the unit's purchase points entries,
      times the return exchange share, rounded half up to whole points. The return bonus event points are the
      unit's bonus event points times the refunded qualifying amount divided by the qualifying amount on the
      unit's purchase points entries, times the return event share, rounded half up to whole points. The return
      card bonus points are the unit's card bonus points times the card refunded amount divided by the
      qualifying amount on the unit's purchase points entries, rounded half up to whole points. Each of these
      proportions is none (0) when the unit's purchase points entries carry no qualifying amount. The refunded
      qualifying amount is the qualifying amount on the unit's purchase points entries. The card refunded amount
      is the qualifying amount on the unit's purchase points entries. The return exchange share, the return
      event share, the return frequency cushion and the return balance relief are the whole (1). When the refund
      deducted a restocking fee, the refunded qualifying amount is the refund amount less the sales tax
      refunded; when the refund was issued to a Merchandise Credit Card, it is the refund amount; otherwise it
      stays the qualifying amount on the unit's purchase points entries. When a merchandise credit for the unit
      was posted to the member's Marlowe & Finch card, the card refunded amount is that credit less the sales
      tax refunded; when the refund was issued to a Merchandise Credit Card, it is none (0); otherwise it stays
      the qualifying amount on the unit's purchase points entries. The return event share is none (0) when the
      return reason is defective, damaged in transit or not as described, one half (0.5) when it is wrong size
      or fit or an unwanted gift, and the whole (1) otherwise. The return exchange share is none (0) when a
      completed purchase in the same merchandise class dated 0 to 14 calendar days after the returned unit was
      received has a unit price at least the returned unit's, one half (0.5) when such a purchase dated 0 to 14
      days after it has a lower unit price, and the whole (1) otherwise; the latest completed purchase in that
      class is the one compared. The return frequency cushion is 0.95 when the membership shows no other return
      deduction entry dated within the last 12 whole months, 0.98 when it shows exactly one, and 1 when it shows
      two or more. The return balance relief is 0.90 when the points the returned unit earned (its purchase
      points, bonus event and card bonus entries) are more than the points balance (the sum of the membership's
      points history) and the membership is Finch Circle Gold, Platinum, Diamond or Icon, 0.95 when they are
      more than the points balance and the membership is Finch Circle Member or Silver, and 1 when they are not
      more than the points balance.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [purchase_id, returned_date, status, variant_name, unit_price, order_events.amount, order_events.tax_refunded, order_events.restocking_fee_amount, order_events.refund_destination, return_requests.return_reason]
        note: "The returned unit, its refund and its return reason decide refund_basis and event_clawback; the later completed purchase in its class decides exchange_relief."
      - category: card
        as: history
        reads: [card_transactions.amount]
        note: "The merchandise credit posted to the card decides card_basis."
    compute:
      - ret_pid: "XLATEST('order', 'purchases', 'purchase_id', date_field='returned_date', status='returned')"
      - base_pts: "SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_earn', earn_source='purchase_base', purchase_id=ret_pid) + SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_adjustment', earn_source='missing_points_credit', purchase_id=ret_pid)"
      - base_q: "SUM('loyalty_points_ledger', 'qualifying_amount', event_type='loyalty_points_earn', earn_source='purchase_base', purchase_id=ret_pid) + SUM('loyalty_points_ledger', 'qualifying_amount', event_type='loyalty_points_adjustment', earn_source='missing_points_credit', purchase_id=ret_pid)"
      - event_pts: "SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_earn', earn_source='bonus_event', purchase_id=ret_pid)"
      - card_pts: "SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_earn', earn_source='card_bonus', purchase_id=ret_pid)"
      - refund_amt: "XLATEST('order', 'order_events', 'amount', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - refund_tax: "XLATEST('order', 'order_events', 'tax_refunded', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - refund_fee: "XLATEST('order', 'order_events', 'restocking_fee_amount', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - refund_dest: "XLATEST('order', 'order_events', 'refund_destination', date_field='event_date', event_type='order_refund', purchase_id=ret_pid)"
      - refunded_q: "refund_amt - refund_tax if (refund_fee and refund_fee > 0) else (refund_amt if refund_dest == 'merchandise_credit_card' else base_q)"
      - card_credit: "XLATEST('card', 'card_transactions', 'amount', date_field='txn_date', event_type='card_merchandise_credit', purchase_id=ret_pid)"
      - card_refunded: "card_credit - refund_tax if card_credit else (0 if refund_dest == 'merchandise_credit_card' else base_q)"
      - ret_reason: "XLATEST('order', 'return_requests', 'return_reason', date_field='created_at', purchase_id=ret_pid)"
      - event_claw: "0 if (ret_reason == 'defective' or ret_reason == 'damaged_in_transit' or ret_reason == 'not_as_described') else (K('half_share') if (ret_reason == 'wrong_size_or_fit' or ret_reason == 'unwanted_gift') else 1)"
      - ret_class: "XLATEST('order', 'purchases', 'variant_name', date_field='returned_date', status='returned')"
      - ret_price: "XLATEST('order', 'purchases', 'unit_price', date_field='returned_date', status='returned')"
      - ret_received: "XLATEST('order', 'purchases', 'returned_date', date_field='returned_date', status='returned')"
      - repl_price: "XLATEST('order', 'purchases', 'unit_price', date_field='purchase_date', variant_name=ret_class, status='completed')"
      - repl_date: "XLATEST('order', 'purchases', 'purchase_date', date_field='purchase_date', variant_name=ret_class, status='completed')"
      - repl_gap: "DAYS(ret_received, repl_date) if (repl_date and ret_received) else -1"
      - exchange_share: "0 if (repl_gap >= 0 and repl_gap <= K('exchange_days') and repl_price >= ret_price) else (K('half_share') if (repl_gap >= 0 and repl_gap <= K('exchange_days') and repl_price < ret_price) else 1)"
      - other_deductions: "COUNT('loyalty_points_ledger', within_months=K('lookback_months'), date_field='entry_date', event_type='loyalty_points_reversal')"
      - cushion: "K('first_return_cushion') if other_deductions == 0 else (K('second_return_cushion') if other_deductions == 1 else 1)"
      - unit_earned: "base_pts + event_pts + card_pts"
      - balance_now: "SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_earn') + SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_adjustment') - SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_reversal') - SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_conversion') - SUM('loyalty_points_ledger', 'points', event_type='loyalty_points_expiry')"
      - tier_name: "F('variant_name')"
      - relief: "K('gold_relief') if (unit_earned > balance_now and (tier_name == 'Finch Circle Gold' or tier_name == 'Finch Circle Platinum' or tier_name == 'Finch Circle Diamond' or tier_name == 'Finch Circle Icon')) else (K('entry_relief') if (unit_earned > balance_now and (tier_name == 'Finch Circle Member' or tier_name == 'Finch Circle Silver')) else 1)"
      - result: "int((int(base_pts * (refunded_q / base_q if base_q > 0 else 0) * exchange_share + 0.5) + int(event_pts * (refunded_q / base_q if base_q > 0 else 0) * event_claw + 0.5) + int(card_pts * (card_refunded / base_q if base_q > 0 else 0) + 0.5)) * cushion * relief + 0.5)"
    compute_basis:
      ret_pid: "The returned unit is the member's purchase record most recently received back in returned status, and the refunded return is its refund record."
      base_pts: "The return purchase points are the returned unit's purchase points (its purchase points entry plus any missing-points credit entry)"
      base_q: "Each of these proportions is none (0) when the unit's purchase points entries carry no qualifying amount."
      event_pts: "The return bonus event points are the unit's bonus event points times the refunded qualifying amount divided by the qualifying amount on the unit's purchase points entries, times the return event share, rounded half up to whole points."
      card_pts: "The return card bonus points are the unit's card bonus points times the card refunded amount divided by the qualifying amount on the unit's purchase points entries, rounded half up to whole points."
      refund_amt: "When the refund deducted a restocking fee, the refunded qualifying amount is the refund amount less the sales tax refunded"
      refund_tax: "the refunded qualifying amount is the refund amount less the sales tax refunded"
      refund_fee: "When the refund deducted a restocking fee, the refunded qualifying amount is the refund amount less the sales tax refunded"
      refund_dest: "when the refund was issued to a Merchandise Credit Card, it is the refund amount"
      refunded_q: "When the refund deducted a restocking fee, the refunded qualifying amount is the refund amount less the sales tax refunded; when the refund was issued to a Merchandise Credit Card, it is the refund amount; otherwise it stays the qualifying amount on the unit's purchase points entries."
      card_credit: "When a merchandise credit for the unit was posted to the member's Marlowe & Finch card, the card refunded amount is that credit less the sales tax refunded"
      card_refunded: "When a merchandise credit for the unit was posted to the member's Marlowe & Finch card, the card refunded amount is that credit less the sales tax refunded; when the refund was issued to a Merchandise Credit Card, it is none (0); otherwise it stays the qualifying amount on the unit's purchase points entries."
      ret_reason: "The return event share is none (0) when the return reason is defective, damaged in transit or not as described"
      event_claw: "The return event share is none (0) when the return reason is defective, damaged in transit or not as described, one half (0.5) when it is wrong size or fit or an unwanted gift, and the whole (1) otherwise."
      ret_class: "a completed purchase in the same merchandise class dated 0 to 14 calendar days after the returned unit was received"
      ret_price: "has a unit price at least the returned unit's"
      ret_received: "dated 0 to 14 calendar days after the returned unit was received"
      repl_price: "the latest completed purchase in that class is the one compared."
      repl_date: "the latest completed purchase in that class is the one compared."
      repl_gap: "dated 0 to 14 calendar days after the returned unit was received"
      exchange_share: "The return exchange share is none (0) when a completed purchase in the same merchandise class dated 0 to 14 calendar days after the returned unit was received has a unit price at least the returned unit's, one half (0.5) when such a purchase dated 0 to 14 days after it has a lower unit price, and the whole (1) otherwise; the latest completed purchase in that class is the one compared."
      other_deductions: "The return frequency cushion is 0.95 when the membership shows no other return deduction entry dated within the last 12 whole months"
      cushion: "The return frequency cushion is 0.95 when the membership shows no other return deduction entry dated within the last 12 whole months, 0.98 when it shows exactly one, and 1 when it shows two or more."
      unit_earned: "the points the returned unit earned (its purchase points, bonus event and card bonus entries)"
      balance_now: "are more than the points balance (the sum of the membership's points history)"
      tier_name: "the membership is Finch Circle Gold, Platinum, Diamond or Icon"
      relief: "The return balance relief is 0.90 when the points the returned unit earned (its purchase points, bonus event and card bonus entries) are more than the points balance (the sum of the membership's points history) and the membership is Finch Circle Gold, Platinum, Diamond or Icon, 0.95 when they are more than the points balance and the membership is Finch Circle Member or Silver, and 1 when they are not more than the points balance."
      result: "The return deduction is the return purchase points plus the return bonus event points plus the return card bonus points, times the return frequency cushion, times the return balance relief, rounded half up to whole points. The return purchase points are the returned unit's purchase points (its purchase points entry plus any missing-points credit entry) times the refunded qualifying amount divided by the qualifying amount on the unit's purchase points entries, times the return exchange share, rounded half up to whole points."
    factors:
      - id: refund_basis
        effect: method
        decides: refunded_q
        bindings: [refund_amt, refund_fee, refunded_q]
        ladder:
          - when: "the refund deducted a restocking fee"
            method: "the refunded qualifying amount is the refund amount less the sales tax refunded"
          - when: "the refund was issued to a Merchandise Credit Card"
            method: "the refunded qualifying amount is the refund amount"
          - when: "otherwise"
            method: "the refunded qualifying amount is the qualifying amount on the unit's purchase points entries"
        baseline:
          refunded_q: "base_q"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: card_basis
        effect: method
        decides: card_refunded
        bindings: [card_credit, card_refunded]
        ladder:
          - when: "a merchandise credit for the unit was posted to the member's Marlowe & Finch card"
            method: "the card refunded amount is that credit less the sales tax refunded"
          - when: "the refund was issued to a Merchandise Credit Card"
            method: "the card refunded amount is none (0)"
          - when: "otherwise"
            method: "the card refunded amount is the qualifying amount on the unit's purchase points entries"
        baseline:
          card_refunded: "base_q"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: event_clawback
        effect: parameter
        decides: event_claw
        bindings: [ret_reason, event_claw]
        ladder:
          - when: "the return reason is defective, damaged in transit or not as described"
            value: "0"
          - when: "the return reason is wrong size or fit or an unwanted gift"
            value: "K('half_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          event_claw: "1"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: exchange_relief
        effect: parameter
        decides: exchange_share
        bindings: [ret_class, ret_price, ret_received, repl_price, repl_date, repl_gap, exchange_share]
        ladder:
          - when: "the latest completed purchase in the same merchandise class is dated 0 to 14 calendar days after the unit was received AND its unit price is at least the returned unit's"
            value: "0"
          - when: "it is dated 0 to 14 calendar days after AND its unit price is lower"
            value: "K('half_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          exchange_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: order
      - id: frequency_cushion
        effect: parameter
        decides: cushion
        bindings: [other_deductions, cushion]
        ladder:
          - when: "no other return deduction entry within the last 12 whole months"
            value: "K('first_return_cushion')"
          - when: "exactly one other"
            value: "K('second_return_cushion')"
          - when: "otherwise (two or more)"
            value: "1"
        baseline:
          cushion: "1"
        evidence: [history]
        cross_difficulty: null
      - id: balance_relief
        effect: parameter
        decides: relief
        bindings: [unit_earned, balance_now, tier_name, relief]
        ladder:
          - when: "the points the returned unit earned are more than the points balance AND the membership is Gold, Platinum, Diamond or Icon"
            value: "K('gold_relief')"
          - when: "they are more than the points balance AND the membership is Member or Silver"
            value: "K('entry_relief')"
          - when: "otherwise (not more than the balance)"
            value: "1"
