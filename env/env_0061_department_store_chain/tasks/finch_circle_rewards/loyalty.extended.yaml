        purchase points entries carry no qualifying amount. The refunded qualifying amount is the qualifying
        amount on the unit's purchase points entries. The card refunded amount is the qualifying amount on the
        unit's purchase points entries. The return exchange share, the return event share, the return
        frequency cushion and the return balance relief are the whole (1).
      params: []
