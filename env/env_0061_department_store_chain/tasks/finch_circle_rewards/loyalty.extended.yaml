# Policy charter: Finch Circle, the Marlowe & Finch loyalty program (free membership, tiered by
# calendar-year qualifying spend; points convert to Finch Notes).

category: loyalty
display_name: Finch Circle Loyalty Program

binding:
  holding_table: loyalty_memberships
  event_tables: [loyalty_points_ledger, loyalty_note_ledger, loyalty_benefit_ledger]
  intake_tables: [loyalty_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {points_balance: points, notes_balance: finch_notes, alteration_credit_balance: alteration_credit}

lifecycle:
  states: [active, suspended, closed]
  transitions:
    - {from: active, to: suspended, by: system, means: "Earning and redemption are frozen while the Finch Circle program team reviews the membership for program abuse."}
    - {from: suspended, to: active, by: system, means: "The review clears the member and earning and redemption resume."}
    - {from: active, to: closed, by: user, means: "The member asks to cancel the Finch Circle membership."}
    - {from: suspended, to: closed, by: system, means: "The review confirms program abuse and the membership is terminated."}

accounts:
  - key: points
    unit: points
    meaning: "Finch Circle points held by the member; earned on qualifying purchases and bonuses, deducted when merchandise is returned, converted into Finch Notes, and forfeited at expiry or closure. The balance may go negative after a return."
  - key: finch_notes
    unit: USD
    meaning: "Value of unexpired, unredeemed Finch Notes (reward certificates) held by the member."
  - key: alteration_credit
    unit: USD
    meaning: "Complimentary alteration credit available to the member for the current calendar year."

parameter_schema:
  qualifying_spend_threshold_usd: "Calendar-year net qualifying spend (loyalty_msr_calendar_year_qualifying_spend) that earns the tier; USD, 2 decimals."
  tier_valid_through: "How long an earned tier is held: through 31 December of the calendar year after the year in which it was earned; string rule key."
  max_tier_drop_per_review: "Largest number of tiers a member can move down at one annual review; integer tiers."
  midyear_upgrade_business_days: "Business days after the qualifying purchase posts within which a mid-year tier upgrade is applied; integer."
  tier_upgrade_bonus_points: "Bonus points posted once when a member is upgraded into this tier during a calendar year; integer points."
  base_points_per_dollar: "Points per net qualifying dollar spent at Marlowe & Finch with any tender; number per USD."
  points_rounding: "How fractional points on one purchase line are handled; string rule key (round_down_whole_points)."
  points_posting_business_days: "Business days after the purchase date (in-store) or ship date (online) within which points post; integer."
  points_excluded_items: "Purchase types that earn no points and count as no qualifying spend; list."
  bonus_event_days_per_year: "Number of Double Points / Triple Points days the tier is invited to per calendar year; integer."
  bonus_event_multiplier: "Multiplier applied to base points on a bonus event day; number."
  points_per_note: "Points converted into one Finch Note; integer points."
  note_value_usd: "Value of one Finch Note issued from points; USD, 2 decimals."
  note_issue_business_days: "Business days after the points balance reaches points_per_note within which the note is issued; integer."
  note_validity_days: "Calendar days a points-conversion or birthday Finch Note stays valid, counting the issue date as day 1; integer."
  notes_per_transaction_max: "Maximum number of Finch Notes that can be applied to one purchase transaction; integer."
  note_redemption_exclusions: "Purchase types toward which Finch Notes cannot be applied; list."
  note_cash_value: "Whether a Finch Note can be exchanged for cash or give change; boolean."
  note_single_use: "Whether a Finch Note is consumed whole in one transaction, any unused value being forfeited; boolean."
  reinstated_note_min_validity_days: "Minimum calendar days of validity, counting the reinstatement date as day 1, given to a note reinstated after a return; integer."
  expired_note_courtesy_reissues_per_12_months: "Number of expired Finch Notes that can be reissued as a courtesy in a rolling 12 months; integer."
  expired_note_reissue_window_days: "Calendar days after a note's expiry_date within which a courtesy reissue can still be granted; integer."
  courtesy_note_validity_days: "Calendar days of validity of a courtesy-reissued note, counting the reissue date as day 1; integer."
  points_inactivity_expiry_months: "Full calendar months without any points earned or note redeemed after which the whole points balance expires; integer."
  birthday_note_usd: "Value of the birthday Finch Note issued in the member's birth month; USD, 2 decimals, or not_applicable when the tier has no birthday reward."
  birthday_note_validity_days: "Calendar days of validity of the birthday note, counting the issue date as day 1; integer, or not_applicable."
  birthday_min_membership_days: "Calendar days the membership must have existed before the first day of the birth month for a birthday note; integer."
  enrollment_bonus_points: "Points posted once at enrollment; integer."
  missing_points_wait_days: "Calendar days after the purchase date before which a missing-points request is not accepted; integer."
  missing_points_claim_window_days: "Calendar days after the purchase date within which a missing-points request must be made; integer."
  missing_points_proof: "What identifies the purchase in a missing-points request; string rule key (purchase_record)."
  points_return_clawback: "Whether points earned on returned merchandise are deducted; boolean."
  negative_points_balance_allowed: "Whether a points deduction may take the balance below zero; boolean."
  alteration_credit_annual_usd: "Complimentary alteration credit granted for each calendar year the tier is held; USD, 2 decimals."
  alteration_credit_carryover: "Whether unused alteration credit carries over into the next calendar year; boolean."
  alteration_credit_eligible_items: "Which alterations the credit can pay for; string rule key (items purchased at Marlowe & Finch)."
  free_return_shipping: "Whether the prepaid mail-return label fee is waived for the member; boolean."
  extended_return_days: "Calendar days added to the merchandise class return window for the member; integer."
  price_adjustment_extension_days: "Calendar days added to the merchandise class price-adjustment window for the member; integer."
  restocking_fee_waived: "Whether the furniture and mattress restocking fee is waived for the member; boolean."
  home_delivery_discount_pct: "Percent off home delivery service fees for the member; percent."
  alteration_rush_fee_waived: "Whether the rush alteration fee is waived for the member; boolean."
  registry_completion_bonus_pct: "Extra percent added to the registry completion discount for a registrant who is a member of this tier; percent."
  card_status_floor_eligible: "Whether this tier can be granted as a floor by holding a qualifying Marlowe & Finch card status; boolean."
  suspension_return_ratio_pct: "Returned value as a percent of gross purchase value over the trailing 12 months above which a membership is suspended for review; percent."
  suspension_min_returns: "Minimum number of returns in the trailing 12 months before the return ratio is applied; integer."
  min_member_age: "Minimum age to enroll, in whole years; integer."
  enrollment_identifiers_required: "Profile identifiers required to enroll; list."

