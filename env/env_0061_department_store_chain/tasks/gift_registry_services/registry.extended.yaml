# ---- events (every write of this category) ----
events:
  - type: registry_create
    target: registries
    mutation: create
    meaning: "A registrant creates a registry for an occasion and receives a registry number."
    grain: "One row per registry."
    fields:
      variant_name: "Registry type, as the official registry type name."
      status: "active at creation."
      registry_number: "Public registry number guests search by."
      event_date: "Date of the occasion (for a baby registry, the due or arrival date)."
      original_event_date: "Event date first registered; never changes."
      created_date: "Date the registry was created."
      co_registrant_name: "Name of the co-registrant, verbatim; empty when none."
      visibility: "public or private."
    triggers: []
  - type: registry_completion_open
    target: registries
    mutation: {transition: {from: active, to: completion}}
    meaning: "The completion period of the registry opens."
    grain: "One transition per registry."
    fields:
      status: "Set to completion."
    triggers: []
  - type: registry_close
    target: registries
    mutation: {transition: {from: completion, to: closed}}
    meaning: "The completion period ends and the registry closes."
    grain: "One transition per registry."
    fields:
      status: "Set to closed."
      closed_date: "Date the registry closed."
    triggers: []
  - type: registry_cancel
    target: registries
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The registrant's own cancellation of the registry takes effect."
    grain: "One transition per cancelled registry."
    fields:
      status: "Set to cancelled."
      closed_date: "Date of the cancellation."
    triggers: []
  - type: registry_event_date_change
    target: registries
    mutation: update
    meaning: "The registrant moves the event date."
    grain: "One update per event date change."
    fields:
      event_date: "The new event date."
      event_date_change_count: "Number of event date changes made so far, including this one."
    triggers: []
  - type: registry_visibility_change
    target: registries
    mutation: update
    meaning: "The registrant makes the registry public or private."
    grain: "One update per visibility change."
    fields:
      visibility: "public or private."
    triggers: []
  - type: registry_item_add
    target: registry_events
    meaning: "The registrant adds an item to the registry or raises its requested quantity."
    grain: "One row per sku per day it is added or its quantity is changed."
    distinguish_by: [sku, entry_date]
    fields:
      sku: "Item number added."
      requested_quantity: "Requested quantity of the sku after this change."
      entry_date: "Date of the change."
    triggers: []
  - type: registry_gift_purchase
    target: registry_events
    meaning: "A guest's purchase of a registry item is recorded against the registry."
    grain: "One row per guest purchase record linked to the registry."
    distinguish_by: [purchase_id]
    fields:
      purchase_id: "Guest's purchase record of the gift."
      sku: "Item number of the gift."
      amount: "Net price the guest paid for the gift (unit price less the guest's Finch Notes, before tax), USD."
      entry_date: "Date the gift was linked to the registry (purchase date, or the later link date)."
    triggers: []
  - type: registry_completion_purchase
    target: registry_events
    meaning: "The registrant or co-registrant buys a registry item at the completion discount."
    grain: "One row per purchase record bought with the completion discount."
    distinguish_by: [purchase_id]
    fields:
      purchase_id: "Registrant's purchase record."
      sku: "Item number bought."
      entry_date: "Purchase date."
      completion_discount_pct: "Total completion percent applied (base, card bonus and Finch Circle bonus)."
      amount: "Completion discount taken on the unit, USD."
    triggers: []
  - type: registry_rewards_accrual
    target: registry_events
    meaning: "Registry rewards accrue on a guest's purchase from the registry."
    grain: "One row per guest purchase record."
    distinguish_by: [purchase_id]
    fields:
      purchase_id: "Guest's purchase record."
      amount: "Rewards accrued, USD."
      entry_date: "Date of accrual."
    account: registry_rewards
    direction: in
    triggers: []
  - type: registry_rewards_reversal
    target: registry_events
    meaning: "Rewards accrued on a guest's gift are reversed because the gift was returned before payout."
    grain: "One row per returned gift."
    distinguish_by: [return_id]
    fields:
      return_id: "Return record of the gift."
      purchase_id: "Guest's purchase record of the gift."
      amount: "Rewards reversed, USD."
      entry_date: "Date of reversal."
    account: registry_rewards
    direction: out
    triggers: []
  - type: registry_rewards_payout
    target: registry_events
    meaning: "Accrued registry rewards are paid out to the registrant as a Registry Reward Card."
    grain: "One row per payout (one per registry)."
    distinguish_by: [entry_date]
    fields:
      amount: "Rewards paid out, USD."
      entry_date: "Date of payout."
    account: registry_rewards
    direction: out
    triggers:
      - event: "giftcard:giftcard_issue"
        map: {amount: amount, issue_reason: registry_rewards}
  - type: registry_rewards_forfeit
    target: registry_events
    meaning: "Accrued registry rewards lapse without payout because the payout minimum was not met or the registry was cancelled."
    grain: "One row per forfeiture (one per registry)."
    distinguish_by: [entry_date]
    fields:
      amount: "Rewards forfeited, USD."
      entry_date: "Date of forfeiture."
    account: registry_rewards
    direction: out
    triggers: []
  - type: registry_return_credit
    target: registry_events
    meaning: "A registry gift returned by the registrant is credited to the registry as registry credit."
    grain: "One row per returned registry gift."
    distinguish_by: [return_id]
    fields:
      return_id: "Return record of the gift."
      purchase_id: "Guest's purchase record of the gift."
      amount: "Credit added, USD."
      entry_date: "Date of the credit."
    account: registry_credit
    direction: in
    triggers: []
  - type: registry_credit_use
    target: registry_events
    meaning: "Registry credit is spent on a Marlowe & Finch purchase by the registrant."
    grain: "One row per purchase record paid partly or fully with registry credit."
    distinguish_by: [purchase_id]
    fields:
      purchase_id: "Purchase record paid with the credit."
      amount: "Credit used, USD."
      entry_date: "Date of use."
    account: registry_credit
    direction: out
    triggers: []
  - type: registry_credit_conversion
    target: registry_events
    meaning: "Registry credit remaining when the registry closes or is cancelled is converted to a merchandise credit card."
    grain: "One row per conversion (one per registry)."
    distinguish_by: [entry_date]
    fields:
      amount: "Credit converted, USD."
      entry_date: "Date of conversion."
    account: registry_credit
    direction: out
    triggers:
      - event: "giftcard:giftcard_issue"
        map: {amount: amount, issue_reason: registry_credit_conversion}

# ---- derived measures ----
measures:
  - id: registry_msr_net_guest_purchases
    window: "From the registry's created_date to the handling date, by entry_date."
    measure: "Sum of amount of registry_gift_purchase rows of the registry whose purchase record is not in returned status, excluding registry_rewards_excluded_items."
  - id: registry_msr_completion_discount_used
    window: "The registry's completion period, by entry_date."
    measure: "Sum of amount of registry_completion_purchase rows of the registry."
  - id: registry_msr_remaining_requested_quantity
    window: "All history of the registry, per sku."
    measure: "requested_quantity of the latest registry_item_add row for the sku, minus the count of registry_gift_purchase rows for that sku whose purchase is not returned or cancelled, minus the count of registry_completion_purchase rows for that sku."

# ---- policies ----
policies:
  - id: registry_agg_multi_holding
    subject: [registry_create]
    rule: >-
      A customer may hold several registries (max_per_customer null) for different occasions, but at most
      max_registries_same_type registry of one registry type in active or completion status at a time. The customer holds
      no other registry of the same type in active or completion status. A second registry for the same occasion is never
      opened to restart a completion period or a rewards payout.
    eligibility:
      - id: one_open_registry_per_type
        applies_to: [registry_create]
        kind: dedup
        condition: "The customer holds no other registry of the same type in active or completion status."
        evidence_fields: [registries.customer_id, registries.variant_name, registries.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registries.customer_id, registries.variant_name]
          action_bindings:
            registries.customer_id: customer_id
            registries.variant_name: variant_name
        dedup_contract:
          table: registries
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [active, completion]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: registry_agg_per_registry_balances
    subject: [registry_rewards_payout, registry_credit_use, registry_completion_purchase]
    rule: >-
      When a customer holds several registries, completion discounts, the completion discount cap, registry rewards, the
      rewards minimum and cap, and registry credit are each counted per registry and never pooled: a completion purchase
      uses the discount of the registry the item is on, registry credit from one registry may be spent on any purchase but
      is drawn only from that registry's balance, and a guest gift counts only for the registry it is linked to. An item on
      two registries of the same customer is completed under one of them, chosen by the registrant at purchase.
    eligibility: []
    params: {}

  - id: registry_creation_rules
    subject: [registry_create, registry_item_add]
    rule: >-
      A registry can be created when the event_date is no more than the type's max_months_before_event_to_create full
      calendar months after the creation date and no more than max_days_after_event_to_create calendar days before it. The
      registrant is at least the type's min_registrant_age, and a co-registrant is named only when co_registrant_allowed is
      true. The registrant chooses a visibility from visibility_options. Items are added while the registry is in active or
      completion status, up to max_items_on_registry distinct skus and item_requested_quantity_max units per sku; gift cards
      are never registry items.
      Each type is offered for its occasion_scope, and the registry number follows registry_number_format.
    eligibility: []
    params: {}

  - id: registry_completion_period
    subject: [registry_completion_open, registry_close]
    rule: >-
      The completion period opens on the event_date minus completion_start_days_before_event calendar days and ends at the
      end of the event_date plus completion_window_days_after_event calendar days, after which the registry closes
      (registry_closure_basis). Both dates follow the current event_date; a registry whose period has opened keeps the dates
      it opened with. Opening and closing are made by the registry system; customer care never opens a period early or
      extends it.
    eligibility: []
    params:
      per_tier:
        "Celebration Registry": {start_days_before: "=completion_start_days_before_event", window_days_after: "=completion_window_days_after_event"}
        "Graduation Registry": {start_days_before: "=completion_start_days_before_event", window_days_after: "=completion_window_days_after_event"}
        "Housewarming Registry": {start_days_before: "=completion_start_days_before_event", window_days_after: "=completion_window_days_after_event"}
        "Baby Registry": {start_days_before: "=completion_start_days_before_event", window_days_after: "=completion_window_days_after_event"}
        "Anniversary Registry": {start_days_before: "=completion_start_days_before_event", window_days_after: "=completion_window_days_after_event"}
        "Wedding Registry": {start_days_before: "=completion_start_days_before_event", window_days_after: "=completion_window_days_after_event"}

  - id: registry_completion_discount
    subject: [registry_completion_purchase]
    rule: >-
      During the completion period the registrant or co-registrant (completion_purchaser) may buy items still on the
      registry at the completion discount, in the completion_channels. The registry is in completion status. The item was
      added to the registry at least completion_item_min_days_on_registry calendar days before the purchase date, and the
      discount covers at most registry_msr_remaining_requested_quantity units of the sku. Items of
      completion_excluded_classes, items at completion_excluded_price_types and gift cards are never discounted. The
      completion percent is the type's completion_discount_pct, plus completion_card_bonus_pct when the purchase is charged
      to a Marlowe & Finch card, plus the registrant's Finch Circle registry_completion_bonus_pct (tier held on the
      purchase date) when the type's loyalty_bonus_applies is true. It is taken on the unit's selling price and rounded half
      up to the cent; when a percent-off coupon also applies, the better of the two is taken, never both
      (completion_coupon_stacking). The completion discounts of the registry together never exceed the type's
      completion_discount_cap_usd (registry_msr_completion_discount_used); the purchase that reaches the cap receives only
      the remainder. A completion purchase is an ordinary purchase record for returns, but a return refunds only the price
      paid and does not restore the discount or the cap.
      Completion quantity follows completion_quantity_basis, and the discount never applies to gift cards (completion_discount_on_gift_cards false).
    eligibility:
      - id: completion_status
        applies_to: [registry_completion_purchase]
        kind: state
        condition: "The registry is in completion status."
        evidence_fields: [registries.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registries.status]
          action_bindings:
            registries.status: status
        state_contract:
          field: registries.status
          allowed: [completion]
    params:
      per_tier:
        "Celebration Registry": {completion_pct: "=completion_discount_pct", cap_usd: "=completion_discount_cap_usd"}
        "Graduation Registry": {completion_pct: "=completion_discount_pct", cap_usd: "=completion_discount_cap_usd"}
        "Housewarming Registry": {completion_pct: "=completion_discount_pct", cap_usd: "=completion_discount_cap_usd"}
        "Baby Registry": {completion_pct: "=completion_discount_pct", cap_usd: "=completion_discount_cap_usd"}
        "Anniversary Registry": {completion_pct: "=completion_discount_pct", cap_usd: "=completion_discount_cap_usd"}
        "Wedding Registry": {completion_pct: "=completion_discount_pct", cap_usd: "=completion_discount_cap_usd"}
    measures: [registry_msr_completion_discount_used, registry_msr_remaining_requested_quantity]

  - id: registry_rewards_rules
    subject: [registry_rewards_accrual, registry_rewards_reversal, registry_rewards_payout, registry_rewards_forfeit]
    rule: >-
      Each guest gift linked to the registry accrues the type's registry_rewards_pct of its registry_gift_purchase amount,
      rounded half up to the cent; a type whose registry_rewards_pct is 0 accrues nothing. When a linked gift is returned
      (by the guest or by the registrant) before the payout, its accrual is reversed in full (registry_rewards_reversal_on_return);
      a return after the payout changes nothing. On the event_date plus registry_rewards_issue_days_after_event calendar days
      the registry is tested: the registry is in completion or closed status, and when registry_msr_net_guest_purchases is at
      least registry_rewards_min_net_guest_purchases_usd the accrued balance is paid out once, capped at
      registry_rewards_cap_usd, as a Registry Reward Card in the registrant's name (registry_rewards_payout_form); any accrued
      amount above the cap and any balance that misses the minimum is forfeited. A cancelled registry forfeits its accrued
      balance on the cancellation date. Payout is made by the registry system and is never advanced.
      The payout is made only in the statuses of rewards_payout_requires_active_status.
    eligibility:
      - id: payout_status
        applies_to: [registry_rewards_payout]
        kind: state
        condition: "the registry is in completion or closed status"
        evidence_fields: [registries.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registries.status]
          action_bindings:
            registries.status: status
        state_contract:
          field: registries.status
          allowed: [completion, closed]
    params:
      per_tier:
        "Celebration Registry": {rewards_pct: "=registry_rewards_pct", rewards_cap: "=registry_rewards_cap_usd"}
        "Graduation Registry": {rewards_pct: "=registry_rewards_pct", rewards_cap: "=registry_rewards_cap_usd"}
        "Housewarming Registry": {rewards_pct: "=registry_rewards_pct", rewards_cap: "=registry_rewards_cap_usd"}
        "Baby Registry": {rewards_pct: "=registry_rewards_pct", rewards_cap: "=registry_rewards_cap_usd"}
        "Anniversary Registry": {rewards_pct: "=registry_rewards_pct", rewards_cap: "=registry_rewards_cap_usd"}
        "Wedding Registry": {rewards_pct: "=registry_rewards_pct", rewards_cap: "=registry_rewards_cap_usd"}
    formula:
      accrual_amount: "round(amount * registry_rewards_pct / 100, 2)"
    measures: [registry_msr_net_guest_purchases]

  - id: registry_gift_returns
    subject: [registry_return_credit]
    rule: >-
      The registrant can return a gift that a guest bought from the registry (a purchase record whose registry_id is this
      registry) without a receipt (registry_gift_return_proof). The return is authorized no later than the registry gift
      return deadline counted from the event_date. That deadline is the later of the event_date plus the type's
      registry_gift_return_window_days_after_event calendar days and the ordinary return deadline of the gift's merchandise
      class counted from the guest's completed_date (registry_gift_return_deadline_rule); a return authorized on the deadline
      is in time. The return follows the class's condition, method and fee rules, and is credited to the registry as
      registry credit equal to the price the guest paid (registry_gift_return_price_basis), less any fee the class rules
      deduct, never to the guest's tender or in cash; the registrant may instead exchange it for another item
      (registry_gift_exchange_allowed). No registry credit has already been booked for the same return. A gift the
      registrant bought with the completion discount is the registrant's own purchase and is refunded under the ordinary
      order rules.
    eligibility:
      - id: registry_return_deadline
        applies_to: [registry_return_credit]
        kind: time
        condition: "The return is authorized no later than the registry gift return deadline counted from the event_date."
        evidence_fields: [registries.event_date, registries.registry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registries.registry_id]
          action_bindings:
            registries.registry_id: registry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the event_date"
          anchor_source: registries.event_date
          relation: not_after
          duration_source: variants.registry_gift_return_window_days_after_event
          unit: calendar_days
          counting_rule: "That deadline is the later of the event_date plus the type's registry_gift_return_window_days_after_event calendar days and the ordinary return deadline of the gift's merchandise class counted from the guest's completed_date (registry_gift_return_deadline_rule); a return authorized on the deadline is in time."
          boundary: inclusive
      - id: one_credit_per_return
        applies_to: [registry_return_credit]
        kind: dedup
        condition: "No registry credit has already been booked for the same return."
        evidence_fields: [registry_events.return_id, registry_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registry_events.return_id]
          action_bindings:
            registry_events.return_id: return_id
        dedup_contract:
          table: registry_events
          mode: separate_record
          object_bindings: {return_id: return_id}
          duplicate_filters: {event_type: [registry_return_credit]}
          distinct_fields: []
    params:
      per_tier:
        "Celebration Registry": {return_window_days: "=registry_gift_return_window_days_after_event"}
        "Graduation Registry": {return_window_days: "=registry_gift_return_window_days_after_event"}
        "Housewarming Registry": {return_window_days: "=registry_gift_return_window_days_after_event"}
        "Baby Registry": {return_window_days: "=registry_gift_return_window_days_after_event"}
        "Anniversary Registry": {return_window_days: "=registry_gift_return_window_days_after_event"}
        "Wedding Registry": {return_window_days: "=registry_gift_return_window_days_after_event"}

  - id: registry_credit_rules
    subject: [registry_credit_use, registry_credit_conversion]
    rule: >-
      Registry credit can be spent by the registrant on any Marlowe & Finch merchandise purchase (registry_credit_usable_for)
      while the registry is active or in completion, up to the registry_credit_balance. Within
      registry_credit_conversion_days_after_close calendar days after the registry closes or is cancelled, the whole
      remaining balance is converted once into a merchandise credit card in the registrant's name
      (registry_credit_conversion_form). Registry credit is never paid out in cash or to a card account.
    eligibility: []
    params: {}

  - id: registry_event_date_rules
    subject: [registry_event_date_change]
    rule: >-
      The registrant can move the event_date while the registry is in active status (event_date_change_cutoff). The
      registry is in active status. At most event_date_changes_max changes are made over the registry's life
      (event_date_change_count), and the new event_date is no more than event_date_max_shift_months full calendar months
      before or after the original_event_date. The completion period, rewards payout date and registry return window follow
      the new date. Once the completion period has opened, the date can no longer change, and a moved date never reopens a
      closed period.
    eligibility:
      - id: date_change_active
        applies_to: [registry_event_date_change]
        kind: state
        condition: "The registry is in active status."
        evidence_fields: [registries.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registries.status]
          action_bindings:
            registries.status: status
        state_contract:
          field: registries.status
          allowed: [active]
    params:
      per_tier:
        "Celebration Registry": {max_changes: "=event_date_changes_max"}
        "Graduation Registry": {max_changes: "=event_date_changes_max"}
        "Housewarming Registry": {max_changes: "=event_date_changes_max"}
        "Baby Registry": {max_changes: "=event_date_changes_max"}
        "Anniversary Registry": {max_changes: "=event_date_changes_max"}
        "Wedding Registry": {max_changes: "=event_date_changes_max"}

  - id: registry_visibility_rules
    subject: [registry_visibility_change]
    rule: >-
      The registrant can switch the registry between public and private (visibility_options) at any time while it is open.
      The registry is in active or completion status. A private registry is still found by its registry_number, and gifts
      bought before a change stay linked.
    eligibility:
      - id: visibility_open_registry
        applies_to: [registry_visibility_change]
        kind: state
        condition: "The registry is in active or completion status."
        evidence_fields: [registries.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registries.status]
          action_bindings:
            registries.status: status
        state_contract:
          field: registries.status
          allowed: [active, completion]
    params: {}

  - id: registry_cancellation_rules
    subject: [registry_cancel]
    rule: >-
      Only the registrant can cancel a registry, and only before its completion period opens
      (cancellation_allowed_status); customer care records a registry_requests record with request_type
      registry_cancellation and the cancellation takes effect when the registrant confirms it. The registrant's cancellation
      request is recorded as submitted. On cancellation the accrued registry rewards are forfeited, the registry credit is
      converted under registry_credit_rules, gifts already bought stay the guests' purchases and can still be returned by
      the registrant under registry_gift_returns until their deadline, and the registry is never reactivated
      (cancelled_registry_reactivation false).
    eligibility:
      - id: cancellation_request
        applies_to: [registry_cancel]
        kind: state
        condition: "The registrant's cancellation request is recorded as submitted."
        evidence_fields: [registry_requests.request_status, registry_requests.registry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registry_requests.registry_id]
          action_bindings:
            registry_requests.registry_id: registry_id
        state_contract:
          field: registry_requests.request_status
          allowed: [submitted]
    params: {}

  - id: registry_gift_linking
    subject: [registry_gift_purchase]
    rule: >-
      A guest purchase is linked to the registry when the guest selects the registry at purchase (the purchase record
      carries the registry_id). A gift of an item on the registry bought without selecting it can be linked later at the
      registrant's or guest's request (registry_requests request_type gift_link naming the purchase_id) within
      guest_purchase_link_window_days calendar days after its purchase date, counting the day after the purchase date as
      day 1. The purchase has not already been linked to a registry. Gifts of items not on the registry are linked but
      never reduce a requested quantity, and gift cards are never linked.
      The later link is made on the purchase record (guest_purchase_link_proof).
    eligibility:
      - id: not_already_linked
        applies_to: [registry_gift_purchase]
        kind: dedup
        condition: "The purchase has not already been linked to a registry."
        evidence_fields: [registry_events.purchase_id, registry_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [registry_events.purchase_id]
          action_bindings:
            registry_events.purchase_id: purchase_id
        dedup_contract:
          table: registry_events
          mode: separate_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {event_type: [registry_gift_purchase]}
          distinct_fields: []
    params: {}

# ============================================================================
# extended_policies (gift_registry_services)
# ============================================================================
extended_policies:
- id: registry_ext_completion_redemption
  base_policy_refs:
  - registry_completion_discount
  - registry_agg_per_registry_balances
  overwrite:
  - base_policy: registry_completion_discount
    superseded_clause: >-
      The completion percent is the type's completion_discount_pct, plus completion_card_bonus_pct when the purchase is
      charged to a Marlowe & Finch card, plus the registrant's Finch Circle registry_completion_bonus_pct (tier held on
      the purchase date) when the type's loyalty_bonus_applies is true.
    replaced_by: >-
      For an order line this policy handles, and only for such a line, the completion percent is the completion type percent
      plus the completion card bonus, the completion Finch Circle bonus, the completion registry perk and the early-completion
      bonus, the five added together as percentage points, and it is nil whenever the completion type percent is nil; every
      other completion purchase keeps the base completion percent.
  - base_policy: registry_completion_discount
    superseded_clause: >-
      It is taken on the unit's selling price and rounded half up to the cent; when a percent-off coupon also applies, the
      better of the two is taken, never both (completion_coupon_stacking).
    replaced_by: >-
      For an order line this policy handles, and only for such a line, the completion percent turns into a discount according
      to the line's price: a line at a clearance, doorbuster or final-sale price, or of the Fine Jewelry & Watches or Designer
      Handbags & Luxury merchandise class, receives no completion discount; any other line at a sale price, or whose selling
      price sits below its regular price for any reason such as a coupon or promotion allocated to it, has the completion
      percent taken on its regular price less the markdown it already carries (its regular price less its selling price),
      never below zero, so that the better of the markdown and the completion discount applies and never both; any other
      line has the completion percent taken on its selling price; the completion discount so found is rounded half up to
      the cent once, on the final amount; every other completion purchase remains under the base price rule.
  - base_policy: registry_completion_discount
    superseded_clause: >-
      The item was added to the registry at least completion_item_min_days_on_registry calendar days before the purchase
      date, and the discount covers at most registry_msr_remaining_requested_quantity units of the sku.
    replaced_by: >-
      For an order line this policy handles, and only for such a line, the completion type percent is read from the item's
      most recent item entry, whether that entry added the item or changed its requested quantity: when that entry falls
      fewer calendar days before the line's purchase date than the registry type's minimum days on the registry, no percent
      applies; when that entry falls after the registry's event date and not fewer than those minimum days before the purchase
      date, the post-event item share of the registry type's completion discount percent applies; otherwise the registry
      type's completion discount percent applies; every other completion purchase remains under the base timing rule. The
      completion discount covers the line only while the item still has at least one requested unit left, that is the requested
      quantity of the item's most recent item entry less the guest gift entries and the completion purchase entries for
      that item; when no unit is left the completion discount is nil.
  trigger: on_request
  subject:
  - registry_completion_purchase
  computes: discount_amount
  target_tool: redeem_completion_discount_f7189a88
  params:
    elite_card_bonus_pct: 8
    perk_rewards_high_usd: 550.0
    perk_pct_high: 4
    perk_rewards_low_usd: 300.0
    perk_pct_low: 2
    early_days_first: 30
    early_pct_first: 4
    early_days_second: 60
    early_pct_second: 2
    post_event_item_share_pct: 50
    standard_card_bonus_pct: 3
  rule: >-
    This policy works out the completion discount a registrant redeems on her or his own order line of a registry item,
    which is the registrant's purchase record of that item still in ordered status, while the registry is in completion
    status. For an order line this policy handles, and only for such a line, the completion type percent is read from the
    item's most recent item entry, whether that entry added the item or changed its requested quantity: when that entry
    falls fewer calendar days before the line's purchase date than the registry type's minimum days on the registry, no
    percent applies; when that entry falls after the registry's event date and not fewer than those minimum days before
    the purchase date, the post-event item share of the registry type's completion discount percent applies; otherwise the
    registry type's completion discount percent applies; every other completion purchase remains under the base timing rule.
    The completion discount covers the line only while the item still has at least one requested unit left, that is the
    requested quantity of the item's most recent item entry less the guest gift entries and the completion purchase entries
    for that item; when no unit is left the completion discount is nil. The completion discount on an order line is the
    registry type's completion discount percent taken on the line's selling price. The completion discounts recorded on
    a registry together never exceed the registry type's completion discount cap, and a line that would pass the cap receives
    only the part of the cap still unused. The completion discount is rounded half up to the cent once, on the final amount.
    The completion discount on an order line is fixed only after every guest gift entry on a registry whose type earns registry
    rewards carries its registry rewards accrual entry. The completion card bonus follows the Marlowe & Finch card account
    the order line is charged to: when that account is active on the date the discount is redeemed and is a Marlowe & Finch
    Store Card Elite or a Marlowe & Finch World Elite Mastercard, the elite card completion bonus applies; when that account
    is any other active Marlowe & Finch card account, the greater of the registry type's completion card bonus percent and
    the standard card completion bonus applies; otherwise no completion card bonus is added. The completion Finch Circle
    bonus follows the registrant's Finch Circle membership and the tier it holds on the date the completion discount is
    redeemed, which is the date of the completion purchase entry, and is added only for a registry type that grants the
    Finch Circle completion bonus: when the membership is active at Finch Circle Icon, that tier's registry completion bonus
    percent applies; when the membership is active at Finch Circle Platinum or Finch Circle Diamond, that tier's registry
    completion bonus percent applies; otherwise no completion Finch Circle bonus is added. The completion registry perk
    follows the registry's net registry rewards, its rewards accrual entries less its rewards reversal entries: net rewards
    of at least the upper perk threshold add the upper perk percent; net rewards of at least the lower perk threshold but
    below the upper perk threshold add the lower perk percent; otherwise no completion registry perk is added. The early-completion
    bonus follows the calendar days from the registry's event date to the line's purchase date: at most the first early
    window, a line bought before the event date included, adds the first early-completion percent; more than the first early
    window but at most the second early window adds the second early-completion percent; otherwise no early-completion bonus
    is added. For an order line this policy handles, and only for such a line, the completion percent is the completion
    type percent plus the completion card bonus, the completion Finch Circle bonus, the completion registry perk and the
    early-completion bonus, the five added together as percentage points, and it is nil whenever the completion type percent
    is nil; every other completion purchase keeps the base completion percent. For an order line this policy handles, and
    only for such a line, the completion percent turns into a discount according to the line's price: a line at a clearance,
    doorbuster or final-sale price, or of the Fine Jewelry & Watches or Designer Handbags & Luxury merchandise class, receives
    no completion discount; any other line at a sale price, or whose selling price sits below its regular price for any
    reason such as a coupon or promotion allocated to it, has the completion percent taken on its regular price less the
    markdown it already carries (its regular price less its selling price), never below zero, so that the better of the
    markdown and the completion discount applies and never both; any other line has the completion percent taken on its
    selling price; the completion discount so found is rounded half up to the cent once, on the final amount; every other
    completion purchase remains under the base price rule. The amount found is kept only when the item still has a requested
    unit left, and the unused part of the cap is applied to it before the rounding, which is done once, half up to the cent,
    on the final amount.
  prerequisite:
  - problem: registry_ext_missed_rewards_accrual
    kind: value_input
    gate: perk_pct
    form: state
    policy_source: >-
      The completion discount on an order line is fixed only after every guest gift entry on a registry whose type earns
      registry rewards carries its registry rewards accrual entry.
    condition: >-
      On a registry whose type has a registry rewards percent above zero, every registry_gift_purchase entry has a registry_rewards_accrual
      entry carrying the same purchase_id.
    resolved_by: book_rewards_accrual_4ec6fd92
    effect: >-
      The missing accrual entry raises the registry's net registry rewards (accruals less reversals), which the completion
      registry perk reads, so the perk percent in perk_pct can move to a higher step.
  cross_category:
  - category: order
    as: branch
    reads:
    - unit_price
    - regular_price
    - price_type
    - sku
    - purchase_date
    - card_account_id
    - status
    - variant_name
    note: >-
      The registrant's order line in ordered status gives the price, the price type and merchandise class (markdown method
      factor), the item and the purchase date.
  - category: card
    as: branch
    reads:
    - status
    - variant_name
    note: The card account the order line is charged to decides the completion card bonus tier.
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    - registry_completion_bonus_pct
    note: The registrant's Finch Circle membership status and tier decide the completion Finch Circle bonus.
  compute:
  - line_price: CFIELD('order', 'unit_price', status='ordered')
  - line_regular: CFIELD('order', 'regular_price', status='ordered')
  - line_price_type: CFIELD('order', 'price_type', status='ordered')
  - line_sku: CFIELD('order', 'sku', status='ordered')
  - line_date: CFIELD('order', 'purchase_date', status='ordered')
  - line_card: CFIELD('order', 'card_account_id', status='ordered')
  - item_entry_date: >-
      LATEST('registry_events', 'entry_date', date_field='entry_date', event_type='registry_item_add', sku=line_sku)
  - item_requested: >-
      LATEST('registry_events', 'requested_quantity', date_field='entry_date', event_type='registry_item_add', sku=line_sku)
  - item_gifts: COUNT('registry_events', event_type='registry_gift_purchase', sku=line_sku)
  - item_completed: COUNT('registry_events', event_type='registry_completion_purchase', sku=line_sku)
  - units_left: int(item_requested or 0) - item_gifts - item_completed
  - days_on_registry: DAYS(item_entry_date, line_date)
  - type_pct: >-
      0 if days_on_registry < P('completion_item_min_days_on_registry') else (P('completion_discount_pct') * K('post_event_item_share_pct')
      / 100 if item_entry_date > F('event_date') else P('completion_discount_pct'))
  - card_status: CFIELD('card', 'status', card_account_id=line_card)
  - card_kind: CFIELD('card', 'variant_name', card_account_id=line_card)
  - card_pct: >-
      K('elite_card_bonus_pct') if (card_status == 'active' and (card_kind == 'Marlowe & Finch Store Card Elite' or card_kind
      == 'Marlowe & Finch World Elite Mastercard')) else (MX(P('completion_card_bonus_pct'), K('standard_card_bonus_pct'))
      if (card_status == 'active' and line_card != '') else 0)
  - circle_status: CFIELD('loyalty', 'status')
  - circle_tier: CFIELD('loyalty', 'variant_name')
  - circle_pct: >-
      CPARAM('loyalty', 'registry_completion_bonus_pct') if (P('loyalty_bonus_applies') and circle_status == 'active' and
      circle_tier == 'Finch Circle Icon') else (CPARAM('loyalty', 'registry_completion_bonus_pct') if (P('loyalty_bonus_applies')
      and circle_status == 'active' and (circle_tier == 'Finch Circle Platinum' or circle_tier == 'Finch Circle Diamond'))
      else 0)
  - net_rewards: >-
      SUM('registry_events', 'amount', event_type='registry_rewards_accrual') - SUM('registry_events', 'amount', event_type='registry_rewards_reversal')
  - perk_pct: >-
      K('perk_pct_high') if net_rewards >= K('perk_rewards_high_usd') else (K('perk_pct_low') if net_rewards >= K('perk_rewards_low_usd')
      else 0)
  - days_after_event: DAYS(F('event_date'), line_date)
  - early_pct: >-
      K('early_pct_first') if days_after_event <= K('early_days_first') else (K('early_pct_second') if days_after_event
      <= K('early_days_second') else 0)
  - line_pct: (type_pct + card_pct + circle_pct + perk_pct + early_pct) if type_pct > 0 else 0
  - markdown: line_regular - line_price
  - line_class: CFIELD('order', 'variant_name', status='ordered')
  - discount_found: >-
      0 if (line_price_type == 'clearance' or line_price_type == 'doorbuster' or line_price_type == 'final_sale' or line_class
      == 'Fine Jewelry & Watches' or line_class == 'Designer Handbags & Luxury') else (MX(0, line_regular * line_pct / 100
      - markdown) if (line_price_type == 'sale' or line_price < line_regular) else line_price * line_pct / 100)
  - cap_left: >-
      P('completion_discount_cap_usd') - SUM('registry_events', 'amount', event_type='registry_completion_purchase')
  - result: RND(MN(discount_found if units_left >= 1 else 0, MX(0, cap_left)), 2)
  compute_basis:
    line_price: >-
      This policy works out the completion discount a registrant redeems on her or his own order line of a registry item,
      which is the registrant's purchase record of that item still in ordered status, while the registry is in completion
      status.
    line_regular: >-
      any other line at a sale price, or whose selling price sits below its regular price for any reason such as a coupon
      or promotion allocated to it, has the completion percent taken on its regular price
    line_price_type: >-
      a line at a clearance, doorbuster or final-sale price, or of the Fine Jewelry & Watches or Designer Handbags & Luxury
      merchandise class, receives no completion discount
    line_class: >-
      or of the Fine Jewelry & Watches or Designer Handbags & Luxury merchandise class, receives no completion discount
    line_sku: the completion type percent is read from the item's most recent item entry
    line_date: >-
      when that entry falls fewer calendar days before the line's purchase date than the registry type's minimum days on
      the registry, no percent applies
    line_card: The completion card bonus follows the Marlowe & Finch card account the order line is charged to
    item_entry_date: >-
      the completion type percent is read from the item's most recent item entry, whether that entry added the item or changed
      its requested quantity
    item_requested: >-
      that is the requested quantity of the item's most recent item entry less the guest gift entries and the completion
      purchase entries for that item
    item_gifts: >-
      that is the requested quantity of the item's most recent item entry less the guest gift entries and the completion
      purchase entries for that item
    item_completed: >-
      that is the requested quantity of the item's most recent item entry less the guest gift entries and the completion
      purchase entries for that item
    units_left: >-
      The completion discount covers the line only while the item still has at least one requested unit left
    days_on_registry: >-
      when that entry falls fewer calendar days before the line's purchase date than the registry type's minimum days on
      the registry, no percent applies
    type_pct: >-
      when that entry falls fewer calendar days before the line's purchase date than the registry type's minimum days on
      the registry, no percent applies; when that entry falls after the registry's event date and not fewer than those minimum
      days before the purchase date, the post-event item share of the registry type's completion discount percent applies;
      otherwise the registry type's completion discount percent applies
    card_status: >-
      when that account is active on the date the discount is redeemed and is a Marlowe & Finch Store Card Elite or a Marlowe
      & Finch World Elite Mastercard, the elite card completion bonus applies
    card_kind: >-
      when that account is active on the date the discount is redeemed and is a Marlowe & Finch Store Card Elite or a Marlowe
      & Finch World Elite Mastercard, the elite card completion bonus applies
    card_pct: >-
      when that account is active on the date the discount is redeemed and is a Marlowe & Finch Store Card Elite or a Marlowe
      & Finch World Elite Mastercard, the elite card completion bonus applies; when that account is any other active Marlowe
      & Finch card account, the greater of the registry type's completion card bonus percent and the standard card completion
      bonus applies; otherwise no completion card bonus is added.
    circle_status: >-
      The completion Finch Circle bonus follows the registrant's Finch Circle membership and the tier it holds on the date
      the completion discount is redeemed, which is the date of the completion purchase entry
    circle_tier: >-
      The completion Finch Circle bonus follows the registrant's Finch Circle membership and the tier it holds on the date
      the completion discount is redeemed, which is the date of the completion purchase entry
    circle_pct: >-
      and is added only for a registry type that grants the Finch Circle completion bonus: when the membership is active
      at Finch Circle Icon, that tier's registry completion bonus percent applies; when the membership is active at Finch
      Circle Platinum or Finch Circle Diamond, that tier's registry completion bonus percent applies; otherwise no completion
      Finch Circle bonus is added.
    net_rewards: >-
      The completion registry perk follows the registry's net registry rewards, its rewards accrual entries less its rewards
      reversal entries
    perk_pct: >-
      net rewards of at least the upper perk threshold add the upper perk percent; net rewards of at least the lower perk
      threshold but below the upper perk threshold add the lower perk percent; otherwise no completion registry perk is
      added.
    days_after_event: >-
      The early-completion bonus follows the calendar days from the registry's event date to the line's purchase date
    early_pct: >-
      at most the first early window, a line bought before the event date included, adds the first early-completion percent;
      more than the first early window but at most the second early window adds the second early-completion percent; otherwise
      no early-completion bonus is added.
    line_pct: >-
      the completion percent is the completion type percent plus the completion card bonus, the completion Finch Circle
      bonus, the completion registry perk and the early-completion bonus, the five added together as percentage points,
      and it is nil whenever the completion type percent is nil
    markdown: less the markdown it already carries (its regular price less its selling price), never below zero
    discount_found: >-
      a line at a clearance, doorbuster or final-sale price, or of the Fine Jewelry & Watches or Designer Handbags & Luxury
      merchandise class, receives no completion discount; any other line at a sale price, or whose selling price sits below
      its regular price for any reason such as a coupon or promotion allocated to it, has the completion percent taken on
      its regular price less the markdown it already carries (its regular price less its selling price), never below zero,
      so that the better of the markdown and the completion discount applies and never both; any other line has the completion
      percent taken on its selling price
    cap_left: >-
      The completion discounts recorded on a registry together never exceed the registry type's completion discount cap,
      and a line that would pass the cap receives only the part of the cap still unused.
    result: >-
      The amount found is kept only when the item still has a requested unit left, and the unused part of the cap is applied
      to it before the rounding, which is done once, half up to the cent, on the final amount.
  factors:
  - id: item_entry_percent
    effect: parameter
    decides: type_pct
    bindings:
    - item_entry_date
    - days_on_registry
    - type_pct
    ladder:
    - when: >-
        the item's most recent item entry falls fewer calendar days before the line's purchase date than the registry type's
        minimum days on the registry
      value: no percent (the line receives no completion discount)
    - when: >-
        the item's most recent item entry falls after the registry's event date and not fewer than the minimum days before
        the line's purchase date
      value: >-
        P('completion_discount_pct') x K('post_event_item_share_pct') / 100, the post-event item share of the type's completion
        discount percent
    - when: >-
        otherwise (the most recent item entry falls on or before the event date and not fewer than the minimum days before
        the purchase date)
      value: P('completion_discount_pct'), the registry type's completion discount percent
    baseline:
      type_pct: P('completion_discount_pct')
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: elite_card_tier_bonus
    effect: parameter
    decides: card_pct
    bindings:
    - card_status
    - card_kind
    - card_pct
    ladder:
    - when: >-
        the order line is charged to a card account that is active on the date the discount is redeemed and is a Marlowe
        & Finch Store Card Elite or a Marlowe & Finch World Elite Mastercard
      value: K('elite_card_bonus_pct'), the elite card completion bonus
    - when: the order line is charged to any other active Marlowe & Finch card account
      value: >-
        MX(P('completion_card_bonus_pct'), K('standard_card_bonus_pct')), the greater of the type's completion card bonus
        percent and the standard card completion bonus
    - when: otherwise
      value: '0'
    baseline:
      card_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: card
  - id: circle_tier_bonus
    effect: parameter
    decides: circle_pct
    bindings:
    - circle_status
    - circle_tier
    - circle_pct
    ladder:
    - when: >-
        the registry type grants the Finch Circle completion bonus and the registrant's membership is active at Finch Circle
        Icon on the date the discount is redeemed
      value: CPARAM('loyalty', 'registry_completion_bonus_pct') of Finch Circle Icon
    - when: >-
        the registry type grants the Finch Circle completion bonus and the membership is active at Finch Circle Platinum
        or Finch Circle Diamond on that date
      value: CPARAM('loyalty', 'registry_completion_bonus_pct') of that tier
    - when: >-
        otherwise (another tier, an inactive membership, no membership, or a type that does not grant the bonus)
      value: '0'
    baseline:
      circle_pct: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loyalty
  - id: net_rewards_perk
    effect: parameter
    decides: perk_pct
    bindings:
    - net_rewards
    - perk_pct
    ladder:
    - when: >-
        the registry's rewards accrual entries less its rewards reversal entries reach the upper perk threshold
      value: K('perk_pct_high')
    - when: they reach the lower perk threshold but stay below the upper perk threshold
      value: K('perk_pct_low')
    - when: otherwise (net rewards below the lower perk threshold)
      value: '0'
    baseline:
      perk_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: early_window_bonus
    effect: parameter
    decides: early_pct
    bindings:
    - days_after_event
    - early_pct
    ladder:
    - when: >-
        the line's purchase date is at most the first early window of calendar days after the registry's event date, a line
        bought before the event date included
      value: K('early_pct_first')
    - when: it is more than the first early window but at most the second early window after the event date
      value: K('early_pct_second')
    - when: otherwise (more than the second early window after the event date)
      value: '0'
    baseline:
      early_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: markdown_better_of
    effect: method
    decides: discount_found
    bindings:
    - line_price_type
    - line_class
    - markdown
    - discount_found
    ladder:
    - when: >-
        the line is at a clearance, doorbuster or final-sale price, or is of the Fine Jewelry & Watches or Designer Handbags
        & Luxury class
      method: no completion discount is given
    - when: >-
        the line is not in the first case and is at a sale price, or its selling price sits below its regular price for
        any reason
      method: >-
        the completion percent is taken on the regular price and the markdown already carried (regular price less selling
        price) is subtracted, never below zero (the better of the two, never both)
    - when: otherwise (a regular-priced line sold at its regular price, not of an excluded class)
      method: the completion percent is taken on the line's selling price
    baseline:
      discount_found: line_price * line_pct / 100
    evidence:
    - cross_category
    cross_difficulty: order
  baseline:
    rule: >-
      The completion discount covers the line only while the item still has at least one requested unit left, that is the
      requested quantity of the item's most recent item entry less the guest gift entries and the completion purchase entries
      for that item; when no unit is left the completion discount is nil. The completion discount on an order line is the
      registry type's completion discount percent taken on the line's selling price. The completion discounts recorded on
      a registry together never exceed the registry type's completion discount cap, and a line that would pass the cap receives
      only the part of the cap still unused. The completion discount is rounded half up to the cent once, on the final amount.
    params:
    - completion_discount_pct
    - completion_discount_cap_usd
  inputs:
    history:
    - table: registry_events
      aggregate: latest
      field: entry_date
      filters:
        event_type: registry_item_add
    - table: registry_events
      aggregate: count
      field: registry_event_id
      filters:
        event_type: registry_gift_purchase
    - table: registry_events
      aggregate: sum
      field: amount
      filters:
        event_type: registry_rewards_accrual
    - table: registry_events
      aggregate: sum
      field: amount
      filters:
        event_type: registry_completion_purchase
    cross_category:
    - order
    - card
    - loyalty
- id: registry_ext_missed_rewards_accrual
  base_policy_refs:
  - registry_rewards_rules
  overwrite:
  - base_policy: registry_rewards_rules
    superseded_clause: >-
      Each guest gift linked to the registry accrues the type's registry_rewards_pct of its registry_gift_purchase amount,
      rounded half up to the cent; a type whose registry_rewards_pct is 0 accrues nothing.
    replaced_by: >-
      Every guest gift linked to a registry accrues at the gift's rewards percent, which is the gift's rewards type percent
      plus the rewards card holder bonus and the rewards guest gift total bonus added together as percentage points, taken
      on the gift entry's amount as the gift size requires and rounded half up to the cent once, on the final amount; a
      registry type whose registry rewards percent is zero accrues nothing.
  trigger: state_due
  subject:
  - registry_rewards_accrual
  computes: rewards_amount
  target_tool: book_rewards_accrual_4ec6fd92
  params:
    late_gift_days: 30
    late_gift_cut_pts: 5
    post_event_cut_pts: 2
    elite_holder_bonus_pct: 2
    holder_bonus_pct: 1
    gift_total_upper_usd: 4500.0
    gift_total_upper_pct: 2
    gift_total_lower_usd: 2000.0
    gift_total_lower_pct: 1
    taper_threshold_usd: 500.0
    small_gift_floor_usd: 25.0
  rule: >-
    This policy books the registry rewards accrual owed on a registry's most recent guest gift entry when that entry carries
    no registry rewards accrual entry; the accrual is worked out on that entry's amount and entry date. A guest gift entry
    whose gift already carries a registry rewards reversal entry is not accrued by this policy, since an accrual on a gift
    returned before the payout is reversed in full. The registry rewards accrual on a guest gift is the registry type's
    registry rewards percent taken on the gift entry's amount, rounded half up to the cent once, on the final amount. A
    registry type whose registry rewards percent is zero accrues nothing. The gift's rewards type percent follows the calendar
    days from the registry's event date to the gift entry's date: more than the late-gift window after the event date gives
    the registry type's registry rewards percent less the late-gift cut; after the event date but within the late-gift window
    gives the registry type's registry rewards percent less the post-event cut; otherwise, for a gift entered on or before
    the event date, the registry type's registry rewards percent applies; a cut never takes the percent below zero. The
    rewards card holder bonus follows the registrant's active Marlowe & Finch card account when the accrual is booked: an
    active Marlowe & Finch Store Card Elite or Marlowe & Finch World Elite Mastercard adds the elite holder rewards bonus;
    any other active Marlowe & Finch card account, where no elite account is held, adds the holder rewards bonus; otherwise
    no rewards card holder bonus is added. The rewards guest gift total bonus follows the sum of the amounts of all guest
    gift entries on the registry, the gift being accrued included: a total of at least the upper guest gift total adds the
    upper guest gift rewards bonus; a total of at least the lower guest gift total but below the upper one adds the lower
    guest gift rewards bonus; otherwise no rewards guest gift total bonus is added. Every guest gift linked to a registry
    accrues at the gift's rewards percent, which is the gift's rewards type percent plus the rewards card holder bonus and
    the rewards guest gift total bonus added together as percentage points, taken on the gift entry's amount as the gift
    size requires and rounded half up to the cent once, on the final amount; a registry type whose registry rewards percent
    is zero accrues nothing. The gift size decides how the gift's rewards percent is taken: a gift entry of at least the
    taper threshold earns the full percent on the taper threshold and half the percent on the part above it; a gift entry
    below the small-gift floor earns no rewards; any other gift entry earns the percent on its whole amount.
  prerequisite: []
  cross_category:
  - category: card
    as: branch
    reads:
    - status
    - variant_name
    note: The registrant's active Marlowe & Finch card account decides the rewards card holder bonus.
  compute:
  - gift_amount: LATEST('registry_events', 'amount', date_field='entry_date', event_type='registry_gift_purchase')
  - gift_date: >-
      LATEST('registry_events', 'entry_date', date_field='entry_date', event_type='registry_gift_purchase')
  - gift_days_after_event: DAYS(F('event_date'), gift_date)
  - gift_type_pct: >-
      MX(0, P('registry_rewards_pct') - K('late_gift_cut_pts')) if gift_days_after_event > K('late_gift_days') else (MX(0,
      P('registry_rewards_pct') - K('post_event_cut_pts')) if gift_days_after_event > 0 else P('registry_rewards_pct'))
  - elite_held: >-
      EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite') or EXISTS('card', status='active',
      variant_name='Marlowe & Finch World Elite Mastercard')
  - card_held: EXISTS('card', status='active')
  - holder_pct: K('elite_holder_bonus_pct') if elite_held else (K('holder_bonus_pct') if card_held else 0)
  - gift_total: SUM('registry_events', 'amount', event_type='registry_gift_purchase')
  - gift_total_pct: >-
      K('gift_total_upper_pct') if gift_total >= K('gift_total_upper_usd') else (K('gift_total_lower_pct') if gift_total
      >= K('gift_total_lower_usd') else 0)
  - gift_pct: (gift_type_pct + holder_pct + gift_total_pct) if P('registry_rewards_pct') > 0 else 0
  - accrual_found: >-
      (gift_pct / 100 * K('taper_threshold_usd') + gift_pct / 200 * (gift_amount - K('taper_threshold_usd'))) if gift_amount
      >= K('taper_threshold_usd') else (0 if gift_amount < K('small_gift_floor_usd') else gift_pct / 100 * gift_amount)
  - result: RND(accrual_found, 2)
  compute_basis:
    gift_amount: >-
      This policy books the registry rewards accrual owed on a registry's most recent guest gift entry when that entry carries
      no registry rewards accrual entry; the accrual is worked out on that entry's amount and entry date.
    gift_date: >-
      This policy books the registry rewards accrual owed on a registry's most recent guest gift entry when that entry carries
      no registry rewards accrual entry; the accrual is worked out on that entry's amount and entry date.
    gift_days_after_event: >-
      The gift's rewards type percent follows the calendar days from the registry's event date to the gift entry's date
    gift_type_pct: >-
      more than the late-gift window after the event date gives the registry type's registry rewards percent less the late-gift
      cut; after the event date but within the late-gift window gives the registry type's registry rewards percent less
      the post-event cut; otherwise, for a gift entered on or before the event date, the registry type's registry rewards
      percent applies; a cut never takes the percent below zero.
    elite_held: >-
      an active Marlowe & Finch Store Card Elite or Marlowe & Finch World Elite Mastercard adds the elite holder rewards
      bonus
    card_held: >-
      any other active Marlowe & Finch card account, where no elite account is held, adds the holder rewards bonus
    holder_pct: >-
      an active Marlowe & Finch Store Card Elite or Marlowe & Finch World Elite Mastercard adds the elite holder rewards
      bonus; any other active Marlowe & Finch card account, where no elite account is held, adds the holder rewards bonus;
      otherwise no rewards card holder bonus is added.
    gift_total: >-
      The rewards guest gift total bonus follows the sum of the amounts of all guest gift entries on the registry, the gift
      being accrued included
    gift_total_pct: >-
      a total of at least the upper guest gift total adds the upper guest gift rewards bonus; a total of at least the lower
      guest gift total but below the upper one adds the lower guest gift rewards bonus; otherwise no rewards guest gift
      total bonus is added.
    gift_pct: >-
      which is the gift's rewards type percent plus the rewards card holder bonus and the rewards guest gift total bonus
      added together as percentage points
    accrual_found: >-
      a gift entry of at least the taper threshold earns the full percent on the taper threshold and half the percent on
      the part above it; a gift entry below the small-gift floor earns no rewards; any other gift entry earns the percent
      on its whole amount.
    result: rounded half up to the cent once, on the final amount
  factors:
  - id: post_event_gift_cut
    effect: parameter
    decides: gift_type_pct
    bindings:
    - gift_date
    - gift_days_after_event
    - gift_type_pct
    ladder:
    - when: >-
        the gift entry's date is more than the late-gift window of calendar days after the registry's event date
      value: P('registry_rewards_pct') less K('late_gift_cut_pts'), never below zero
    - when: the gift entry's date is after the event date but within the late-gift window
      value: P('registry_rewards_pct') less K('post_event_cut_pts'), never below zero
    - when: otherwise (a gift entered on or before the event date)
      value: P('registry_rewards_pct')
    baseline:
      gift_type_pct: P('registry_rewards_pct')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cardholder_rewards_bonus
    effect: parameter
    decides: holder_pct
    bindings:
    - elite_held
    - card_held
    - holder_pct
    ladder:
    - when: >-
        the registrant holds an active Marlowe & Finch Store Card Elite or Marlowe & Finch World Elite Mastercard account
      value: K('elite_holder_bonus_pct')
    - when: >-
        the registrant holds no active Store Card Elite or World Elite Mastercard account but holds another active Marlowe
        & Finch card account
      value: K('holder_bonus_pct')
    - when: otherwise (no active Marlowe & Finch card account)
      value: '0'
    baseline:
      holder_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: card
  - id: guest_gift_total_bonus
    effect: parameter
    decides: gift_total_pct
    bindings:
    - gift_total
    - gift_total_pct
    ladder:
    - when: >-
        the sum of all guest gift entries on the registry, the gift being accrued included, is at least the upper guest
        gift total
      value: K('gift_total_upper_pct')
    - when: that sum is at least the lower guest gift total but below the upper one
      value: K('gift_total_lower_pct')
    - when: otherwise
      value: '0'
    baseline:
      gift_total_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: large_gift_taper
    effect: method
    decides: accrual_found
    bindings:
    - gift_amount
    - accrual_found
    ladder:
    - when: the gift entry's amount is at least the taper threshold
      method: >-
        the full rewards percent on the taper threshold plus half the percent on the part of the amount above it
    - when: the gift entry's amount is below the small-gift floor
      method: no rewards are earned
    - when: otherwise
      method: the rewards percent on the gift entry's whole amount
    baseline:
      accrual_found: gift_pct / 100 * gift_amount
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The registry rewards accrual on a guest gift is the registry type's registry rewards percent taken on the gift entry's
      amount, rounded half up to the cent once, on the final amount. A registry type whose registry rewards percent is zero
      accrues nothing.
    params:
    - registry_rewards_pct
  inputs:
    history:
    - table: registry_events
      aggregate: latest
      field: amount
      filters:
        event_type: registry_gift_purchase
    - table: registry_events
      aggregate: sum
      field: amount
      filters:
        event_type: registry_gift_purchase
    cross_category:
    - card
- id: registry_ext_gift_return_credit
  base_policy_refs:
  - registry_gift_returns
  overwrite:
  - base_policy: registry_gift_returns
    superseded_clause: >-
      The return follows the class's condition, method and fee rules, and is credited to the registry as registry credit
      equal to the price the guest paid (registry_gift_return_price_basis), less any fee the class rules deduct, never to
      the guest's tender or in cash; the registrant may instead exchange it for another item (registry_gift_exchange_allowed).
    replaced_by: >-
      For a registry gift return this policy credits, and only for such a return, the credit is the amount of the gift's
      guest gift entry less the registry return deductions set out here instead of the fee rules of the gift's merchandise
      class, the return still follows the class's condition and method rules, and it is credited to the registry as registry
      credit, never to the guest's tender or in cash; the registrant may instead exchange the gift for another item; every
      other return of a registry gift remains under the base fee rule.
  trigger: state_due
  subject:
  - registry_return_credit
  computes: credit_amount
  target_tool: book_return_credit_c9fb6682
  params:
    label_fee_usd: 9.95
    pickup_fee_usd: 99.0
    damaged_restock_pct: 25
    opened_restock_pct: 15
    grace_restock_pct: 5
    open_box_grace_days: 30
    insured_upper_usd: 750.0
    insured_upper_fee_usd: 15.0
    insured_lower_usd: 300.0
    insured_lower_fee_usd: 5.0
    restock_taper_threshold_usd: 750.0
  rule: >-
    This policy credits to the registry the registry credit owed for a registry gift the registrant has returned and the
    store has received, which is the registrant's most recently authorized return record in received status; the credit
    is worked out on the guest gift entry of the returned gift. The registry credit for a returned registry gift is the
    amount of the gift's guest gift entry, the price the guest paid net of the guest's Finch Notes, rounded half up to the
    cent once, on the final amount. For a registry gift return this policy credits, and only for such a return, the credit
    is the amount of the gift's guest gift entry less the registry return deductions set out here instead of the fee rules
    of the gift's merchandise class, the return still follows the class's condition and method rules, and it is credited
    to the registry as registry credit, never to the guest's tender or in cash; the registrant may instead exchange the
    gift for another item; every other return of a registry gift remains under the base fee rule. The fee-waiver reasons
    are defective, damaged in transit and not as described. The registry return fee follows the return record: a return
    by mail with a prepaid label, when the registrant has no active Finch Circle membership or the tier that membership
    holds when the credit is booked does not include free return shipping and the return reason is not a fee-waiver reason,
    carries the registry label fee; a return by carrier pickup whose return reason is not a fee-waiver reason carries the
    registry pickup fee; otherwise no registry return fee is charged. The registry restocking percent follows the gift's
    condition on the return record and, for an opened gift, the calendar days from the registry's event date to the date
    the return was authorized, because a registry gift is usually opened only once the occasion has passed: a gift returned
    damaged, for a reason that is not a fee-waiver reason, takes the damaged restocking percent; a gift returned opened
    and unused, for a reason that is not a fee-waiver reason, more than the open-box grace days after the event date takes
    the opened restocking percent; a gift returned opened and unused, for a reason that is not a fee-waiver reason, at most
    the open-box grace days after the event date, a return authorized before the event date included, takes the grace restocking
    percent; otherwise no registry restocking percent applies. The insured return surcharge covers carrier insurance on
    valuable gifts sent back through Marlowe & Finch: a gift entry of at least the upper insured amount returned with a
    prepaid label or by carrier pickup carries the upper insured surcharge; a gift entry of at least the lower insured amount
    but below the upper insured amount returned with a prepaid label or by carrier pickup carries the lower insured surcharge;
    otherwise no insured return surcharge is charged. The registry restocking charge applies the registry restocking percent
    according to the gift: a gift that is a duplicate, because the guest gift entries of its item outnumber the requested
    quantity of the item's most recent item entry (an item without an item entry counting as requesting none), carries no
    restocking charge; a gift that is not a duplicate and whose entry amount is at least the restocking taper threshold
    carries the full percent on the taper threshold plus half the percent on the part of the amount above it; any other
    gift carries the percent on its whole entry amount. The registry return deductions are the registry restocking charge,
    the registry return fee and the insured return surcharge added together, and the registry credit is the gift entry's
    amount less those deductions, never below zero.
  prerequisite: []
  cross_category:
  - category: order
    as: history
    reads:
    - return_requests.purchase_id
    - return_requests.return_method
    - return_requests.return_reason
    - return_requests.item_condition
    - return_requests.created_at
    note: >-
      The registrant's return record in received status names the gift and decides the return fee, the restocking percent
      and the insured surcharge tiers.
  - category: loyalty
    as: branch
    reads:
    - free_return_shipping
    note: The registrant's active Finch Circle tier decides whether the label fee applies.
  compute:
  - ret_pid: >-
      XLATEST('order', 'return_requests', 'purchase_id', date_field='created_at', return_status='received')
  - ret_method: >-
      XLATEST('order', 'return_requests', 'return_method', date_field='created_at', return_status='received')
  - ret_reason: >-
      XLATEST('order', 'return_requests', 'return_reason', date_field='created_at', return_status='received')
  - ret_condition: >-
      XLATEST('order', 'return_requests', 'item_condition', date_field='created_at', return_status='received')
  - ret_date: XLATEST('order', 'return_requests', 'created_at', date_field='created_at', return_status='received')
  - gift_amt: SUM('registry_events', 'amount', event_type='registry_gift_purchase', purchase_id=ret_pid)
  - gift_sku: >-
      LATEST('registry_events', 'sku', date_field='entry_date', event_type='registry_gift_purchase', purchase_id=ret_pid)
  - sku_requested: >-
      LATEST('registry_events', 'requested_quantity', date_field='entry_date', event_type='registry_item_add', sku=gift_sku)
  - sku_gifts: COUNT('registry_events', event_type='registry_gift_purchase', sku=gift_sku)
  - waiver_reason: ret_reason == 'defective' or ret_reason == 'damaged_in_transit' or ret_reason == 'not_as_described'
  - free_ship: CPARAM('loyalty', 'free_return_shipping', status='active')
  - return_fee: >-
      K('label_fee_usd') if (ret_method == 'mail_prepaid_label' and not free_ship and not waiver_reason) else (K('pickup_fee_usd')
      if (ret_method == 'carrier_pickup' and not waiver_reason) else 0)
  - return_days: DAYS(F('event_date'), ret_date)
  - restock_pct: >-
      K('damaged_restock_pct') if (ret_condition == 'damaged' and not waiver_reason) else (K('opened_restock_pct') if (ret_condition
      == 'opened_unused' and not waiver_reason and return_days > K('open_box_grace_days')) else (K('grace_restock_pct')
      if (ret_condition == 'opened_unused' and not waiver_reason and return_days <= K('open_box_grace_days')) else 0))
  - insured_fee: >-
      K('insured_upper_fee_usd') if ((ret_method == 'mail_prepaid_label' or ret_method == 'carrier_pickup') and gift_amt
      >= K('insured_upper_usd')) else (K('insured_lower_fee_usd') if ((ret_method == 'mail_prepaid_label' or ret_method
      == 'carrier_pickup') and gift_amt >= K('insured_lower_usd')) else 0)
  - restock_charge: >-
      0 if sku_gifts > int(sku_requested or 0) else ((restock_pct / 100 * K('restock_taper_threshold_usd') + restock_pct
      / 200 * (gift_amt - K('restock_taper_threshold_usd'))) if gift_amt >= K('restock_taper_threshold_usd') else restock_pct
      / 100 * gift_amt)
  - result: RND(MX(0, gift_amt - (restock_charge + return_fee + insured_fee)), 2)
  compute_basis:
    ret_pid: >-
      This policy credits to the registry the registry credit owed for a registry gift the registrant has returned and the
      store has received, which is the registrant's most recently authorized return record in received status; the credit
      is worked out on the guest gift entry of the returned gift.
    ret_method: The registry return fee follows the return record
    ret_reason: The fee-waiver reasons are defective, damaged in transit and not as described.
    ret_condition: The registry restocking percent follows the gift's condition on the return record
    ret_date: the calendar days from the registry's event date to the date the return was authorized
    gift_amt: >-
      The registry credit for a returned registry gift is the amount of the gift's guest gift entry, the price the guest
      paid net of the guest's Finch Notes
    gift_sku: >-
      because the guest gift entries of its item outnumber the requested quantity of the item's most recent item entry (an
      item without an item entry counting as requesting none)
    sku_requested: >-
      because the guest gift entries of its item outnumber the requested quantity of the item's most recent item entry (an
      item without an item entry counting as requesting none)
    sku_gifts: >-
      because the guest gift entries of its item outnumber the requested quantity of the item's most recent item entry (an
      item without an item entry counting as requesting none)
    waiver_reason: The fee-waiver reasons are defective, damaged in transit and not as described.
    free_ship: >-
      when the registrant has no active Finch Circle membership or the tier that membership holds when the credit is booked
      does not include free return shipping
    return_fee: >-
      a return by mail with a prepaid label, when the registrant has no active Finch Circle membership or the tier that
      membership holds when the credit is booked does not include free return shipping and the return reason is not a fee-waiver
      reason, carries the registry label fee; a return by carrier pickup whose return reason is not a fee-waiver reason
      carries the registry pickup fee; otherwise no registry return fee is charged.
    return_days: the calendar days from the registry's event date to the date the return was authorized
    restock_pct: >-
      a gift returned damaged, for a reason that is not a fee-waiver reason, takes the damaged restocking percent; a gift
      returned opened and unused, for a reason that is not a fee-waiver reason, more than the open-box grace days after
      the event date takes the opened restocking percent; a gift returned opened and unused, for a reason that is not a
      fee-waiver reason, at most the open-box grace days after the event date, a return authorized before the event date
      included, takes the grace restocking percent; otherwise no registry restocking percent applies.
    insured_fee: >-
      a gift entry of at least the upper insured amount returned with a prepaid label or by carrier pickup carries the upper
      insured surcharge; a gift entry of at least the lower insured amount but below the upper insured amount returned with
      a prepaid label or by carrier pickup carries the lower insured surcharge; otherwise no insured return surcharge is
      charged.
    restock_charge: >-
      a gift that is a duplicate, because the guest gift entries of its item outnumber the requested quantity of the item's
      most recent item entry (an item without an item entry counting as requesting none), carries no restocking charge;
      a gift that is not a duplicate and whose entry amount is at least the restocking taper threshold carries the full
      percent on the taper threshold plus half the percent on the part of the amount above it; any other gift carries the
      percent on its whole entry amount.
    result: >-
      The registry return deductions are the registry restocking charge, the registry return fee and the insured return
      surcharge added together, and the registry credit is the gift entry's amount less those deductions, never below zero.
  factors:
  - id: registry_return_fee
    effect: parameter
    decides: return_fee
    bindings:
    - ret_method
    - free_ship
    - return_fee
    ladder:
    - when: >-
        the return is by mail with a prepaid label, the registrant has no active Finch Circle membership or its tier when
        the credit is booked does not include free return shipping, and the return reason is not a fee-waiver reason
      value: K('label_fee_usd'), the registry label fee
    - when: the return is by carrier pickup and the return reason is not a fee-waiver reason
      value: K('pickup_fee_usd'), the registry pickup fee
    - when: otherwise
      value: '0'
    baseline:
      return_fee: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: loyalty
  - id: registry_restock_percent
    effect: parameter
    decides: restock_pct
    bindings:
    - ret_condition
    - return_days
    - restock_pct
    ladder:
    - when: the gift was returned damaged and the return reason is not a fee-waiver reason
      value: K('damaged_restock_pct')
    - when: >-
        the gift was returned opened and unused, the reason is not a fee-waiver reason, and the return was authorized more
        than the open-box grace days after the event date
      value: K('opened_restock_pct')
    - when: >-
        the gift was returned opened and unused, the reason is not a fee-waiver reason, and the return was authorized at
        most the open-box grace days after the event date (a return before the event date included)
      value: K('grace_restock_pct')
    - when: otherwise
      value: '0'
    baseline:
      restock_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: order
  - id: insured_return_surcharge
    effect: parameter
    decides: insured_fee
    bindings:
    - gift_amt
    - insured_fee
    ladder:
    - when: >-
        the gift entry is at least the upper insured amount and the return is by prepaid label or carrier pickup
      value: K('insured_upper_fee_usd')
    - when: >-
        the gift entry is at least the lower insured amount but below the upper one and the return is by prepaid label or
        carrier pickup
      value: K('insured_lower_fee_usd')
    - when: otherwise
      value: '0'
    baseline:
      insured_fee: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  - id: restock_taper_shape
    effect: method
    decides: restock_charge
    bindings:
    - sku_requested
    - sku_gifts
    - restock_charge
    ladder:
    - when: >-
        the gift is a duplicate: the guest gift entries of its item outnumber the requested quantity of the item's most
        recent item entry (none if the item has no item entry)
      method: no restocking charge is taken
    - when: the gift is not a duplicate and its entry amount is at least the restocking taper threshold
      method: >-
        a marginal schedule: the full restocking percent on the taper threshold plus half the percent on the part above
        it
    - when: otherwise
      method: the restocking percent on the whole gift entry amount
    baseline:
      restock_charge: restock_pct / 100 * gift_amt
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The registry credit for a returned registry gift is the amount of the gift's guest gift entry, the price the guest
      paid net of the guest's Finch Notes, rounded half up to the cent once, on the final amount.
    params: []
  inputs:
    history:
    - table: registry_events
      aggregate: sum
      field: amount
      filters:
        event_type: registry_gift_purchase
    - table: registry_events
      aggregate: count
      field: registry_event_id
      filters:
        event_type: registry_gift_purchase
    - category: order
      table: return_requests
      aggregate: latest
      field: purchase_id
      filters:
        return_status: received
    cross_category:
    - order
    - loyalty
- id: registry_ext_credit_redemption
  base_policy_refs:
  - registry_credit_rules
  - registry_agg_per_registry_balances
  overwrite:
  - base_policy: registry_credit_rules
    superseded_clause: >-
      Registry credit can be spent by the registrant on any Marlowe & Finch merchandise purchase (registry_credit_usable_for)
      while the registry is active or in completion, up to the registry_credit_balance.
    replaced_by: >-
      For an order line this policy handles, and only for such a line, registry credit is spent while the registry is active
      or in completion on the amount of the line still to be paid, in the form the registry credit bonus takes, and never
      more than the registry credit available; every other spending of registry credit remains under the base credit rule.
  trigger: on_request
  subject:
  - registry_credit_use
  computes: credit_amount
  target_tool: apply_registry_credit_10dfa5f2
  params:
    upper_circle_bonus_pct: 3
    lower_circle_bonus_pct: 1
    early_credit_days: 30
    early_credit_bonus_pct: 2
    completion_credit_bonus_pct: 1
    given_item_bonus_base_usd: 200.0
  rule: >-
    This policy works out the registry credit a registrant applies from a registry to her or his own order line, which is
    the registrant's purchase record still in ordered status. The registry credit applied to an order line is the line's
    selling price, never more than the registry credit available, that is the registry's credit entries for returned gifts
    less its registry credit used and converted entries; it is rounded half up to the cent once, on the final amount. Registry
    credit is not applied to a purchase until every registry gift the registrant has returned and the store has received
    stands on the registry as a registry credit entry. For an order line this policy handles, and only for such a line,
    registry credit is spent while the registry is active or in completion on the amount of the line still to be paid, in
    the form the registry credit bonus takes, and never more than the registry credit available; every other spending of
    registry credit remains under the base credit rule. The amount of an order line still to be paid depends on what the
    line already carries: a line with a completion purchase entry on the registry is still to be paid at its selling price
    less that completion discount; a line without one that carries Finch Notes is still to be paid at its selling price
    less the Finch Notes; any other line is still to be paid at its selling price. The registry credit bonus percent is
    the Finch Circle credit bonus and the registry period credit bonus added together as percentage points. The Finch Circle
    credit bonus follows the registrant's Finch Circle membership and the tier it holds when the credit is applied: active
    at Finch Circle Diamond or Finch Circle Icon adds the upper circle credit bonus; active at Finch Circle Silver, Finch
    Circle Gold or Finch Circle Platinum adds the lower circle credit bonus; otherwise, for another tier or an inactive
    or absent membership, no Finch Circle credit bonus is added. The registry period credit bonus follows the calendar days
    from the registry's event date to the line's purchase date: a line bought on or after the event date and at most the
    early credit days after it adds the early credit bonus; a line bought more than the early credit days after the event
    date and within the registry type's completion window adds the completion credit bonus; otherwise, for a line bought
    before the event date or more than the registry type's completion window after it, no registry period credit bonus is
    added. The registry credit bonus takes its form from the line's item on the registry: for an item with an item entry
    whose most recent item entry's requested quantity is above the number of its guest gift entries, the bonus stretches
    the credit, so the credit drawn is the amount still to be paid divided by one plus the bonus percent; for an item with
    an item entry whose guest gift entries reach the requested quantity of its most recent item entry, the bonus is a reduction
    on at most the bonus base, so the credit drawn is the amount still to be paid less the bonus percent of the smaller
    of that amount and the bonus base; for an item without an item entry there is no bonus and the credit drawn is the amount
    still to be paid.
  prerequisite:
  - problem: registry_ext_gift_return_credit
    kind: value_input
    gate: available
    form: state
    policy_source: >-
      Registry credit is not applied to a purchase until every registry gift the registrant has returned and the store has
      received stands on the registry as a registry credit entry.
    condition: >-
      Every return record of the registrant in received status for a purchase linked to the registry has a registry_return_credit
      entry carrying its return_id.
    resolved_by: book_return_credit_c9fb6682
    effect: >-
      The registry credit entry for the received return raises the registry credit available, which bounds the credit applied
      in the binding available.
  cross_category:
  - category: order
    as: branch
    reads:
    - purchase_id
    - unit_price
    - finch_notes_applied
    - sku
    - purchase_date
    - status
    note: >-
      The registrant's order line in ordered status gives the price, Finch Notes, item and purchase date the credit is applied
      to.
  - category: loyalty
    as: branch
    reads:
    - status
    - variant_name
    note: The registrant's Finch Circle status and tier decide the Finch Circle credit bonus.
  compute:
  - line_pid: CFIELD('order', 'purchase_id', status='ordered')
  - line_price: CFIELD('order', 'unit_price', status='ordered')
  - line_notes: CFIELD('order', 'finch_notes_applied', status='ordered')
  - line_sku: CFIELD('order', 'sku', status='ordered')
  - line_date: CFIELD('order', 'purchase_date', status='ordered')
  - line_completion: >-
      LATEST('registry_events', 'amount', date_field='entry_date', event_type='registry_completion_purchase', purchase_id=line_pid)
  - payable: >-
      (line_price - line_completion) if line_completion != None else ((line_price - line_notes) if (line_notes or 0) > 0
      else line_price)
  - member_status: CFIELD('loyalty', 'status')
  - member_tier: CFIELD('loyalty', 'variant_name')
  - circle_bonus: >-
      K('upper_circle_bonus_pct') if (member_status == 'active' and (member_tier == 'Finch Circle Diamond' or member_tier
      == 'Finch Circle Icon')) else (K('lower_circle_bonus_pct') if (member_status == 'active' and (member_tier == 'Finch
      Circle Silver' or member_tier == 'Finch Circle Gold' or member_tier == 'Finch Circle Platinum')) else 0)
  - days_from_event: DAYS(F('event_date'), line_date)
  - period_bonus: >-
      K('early_credit_bonus_pct') if (days_from_event >= 0 and days_from_event <= K('early_credit_days')) else (K('completion_credit_bonus_pct')
      if (days_from_event > K('early_credit_days') and days_from_event <= P('completion_window_days_after_event')) else
      0)
  - bonus_pct: circle_bonus + period_bonus
  - item_entries: COUNT('registry_events', event_type='registry_item_add', sku=line_sku)
  - item_requested: >-
      LATEST('registry_events', 'requested_quantity', date_field='entry_date', event_type='registry_item_add', sku=line_sku)
  - item_gifts: COUNT('registry_events', event_type='registry_gift_purchase', sku=line_sku)
  - credit_drawn: >-
      (payable / (1 + bonus_pct / 100)) if (item_entries > 0 and int(item_requested or 0) > item_gifts) else ((payable -
      bonus_pct / 100 * MN(payable, K('given_item_bonus_base_usd'))) if (item_entries > 0 and int(item_requested or 0) <=
      item_gifts) else payable)
  - available: >-
      SUM('registry_events', 'amount', event_type='registry_return_credit') - SUM('registry_events', 'amount', event_type='registry_credit_use')
      - SUM('registry_events', 'amount', event_type='registry_credit_conversion')
  - result: RND(MN(MX(0, available), credit_drawn), 2)
  compute_basis:
    line_pid: >-
      This policy works out the registry credit a registrant applies from a registry to her or his own order line, which
      is the registrant's purchase record still in ordered status.
    line_price: The registry credit applied to an order line is the line's selling price
    line_notes: >-
      a line without one that carries Finch Notes is still to be paid at its selling price less the Finch Notes
    line_sku: The registry credit bonus takes its form from the line's item on the registry
    line_date: >-
      The registry period credit bonus follows the calendar days from the registry's event date to the line's purchase date
    line_completion: >-
      a line with a completion purchase entry on the registry is still to be paid at its selling price less that completion
      discount
    payable: >-
      a line with a completion purchase entry on the registry is still to be paid at its selling price less that completion
      discount; a line without one that carries Finch Notes is still to be paid at its selling price less the Finch Notes;
      any other line is still to be paid at its selling price.
    member_status: The Finch Circle credit bonus follows the registrant's Finch Circle membership
    member_tier: The Finch Circle credit bonus follows the registrant's Finch Circle membership
    circle_bonus: >-
      active at Finch Circle Diamond or Finch Circle Icon adds the upper circle credit bonus; active at Finch Circle Silver,
      Finch Circle Gold or Finch Circle Platinum adds the lower circle credit bonus; otherwise, for another tier or an inactive
      or absent membership, no Finch Circle credit bonus is added.
    days_from_event: >-
      The registry period credit bonus follows the calendar days from the registry's event date to the line's purchase date
    period_bonus: >-
      a line bought on or after the event date and at most the early credit days after it adds the early credit bonus; a
      line bought more than the early credit days after the event date and within the registry type's completion window
      adds the completion credit bonus; otherwise, for a line bought before the event date or more than the registry type's
      completion window after it, no registry period credit bonus is added.
    bonus_pct: >-
      The registry credit bonus percent is the Finch Circle credit bonus and the registry period credit bonus added together
      as percentage points.
    item_entries: >-
      for an item with an item entry whose most recent item entry's requested quantity is above the number of its guest
      gift entries
    item_requested: >-
      for an item with an item entry whose most recent item entry's requested quantity is above the number of its guest
      gift entries
    item_gifts: >-
      for an item with an item entry whose guest gift entries reach the requested quantity of its most recent item entry
    credit_drawn: >-
      for an item with an item entry whose most recent item entry's requested quantity is above the number of its guest
      gift entries, the bonus stretches the credit, so the credit drawn is the amount still to be paid divided by one plus
      the bonus percent; for an item with an item entry whose guest gift entries reach the requested quantity of its most
      recent item entry, the bonus is a reduction on at most the bonus base, so the credit drawn is the amount still to
      be paid less the bonus percent of the smaller of that amount and the bonus base; for an item without an item entry
      there is no bonus and the credit drawn is the amount still to be paid.
    available: >-
      never more than the registry credit available, that is the registry's credit entries for returned gifts less its registry
      credit used and converted entries
    result: >-
      and never more than the registry credit available; every other spending of registry credit remains under the base
      credit rule
  factors:
  - id: credit_payable_amount
    effect: parameter
    decides: payable
    bindings:
    - line_completion
    - payable
    ladder:
    - when: the order line has a completion purchase entry on the registry
      value: the selling price less that completion discount
    - when: the line has no completion purchase entry and carries Finch Notes
      value: the selling price less the Finch Notes
    - when: otherwise
      value: the selling price
    baseline:
      payable: line_price
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  - id: circle_credit_bonus
    effect: parameter
    decides: circle_bonus
    bindings:
    - member_status
    - member_tier
    - circle_bonus
    ladder:
    - when: >-
        the registrant's membership is active at Finch Circle Diamond or Finch Circle Icon when the credit is applied
      value: K('upper_circle_bonus_pct')
    - when: the membership is active at Finch Circle Silver, Gold or Platinum
      value: K('lower_circle_bonus_pct')
    - when: otherwise (no active membership, or Finch Circle Member)
      value: '0'
    baseline:
      circle_bonus: '0'
    evidence:
    - cross_category
    cross_difficulty: loyalty
  - id: period_credit_bonus
    effect: parameter
    decides: period_bonus
    bindings:
    - days_from_event
    - period_bonus
    ladder:
    - when: the line was bought on or after the event date and at most the early credit days after it
      value: K('early_credit_bonus_pct')
    - when: >-
        the line was bought more than the early credit days after the event date and within the registry type's completion
        window
      value: K('completion_credit_bonus_pct')
    - when: otherwise (a line bought before the event date, or more than the completion window after it)
      value: '0'
    baseline:
      period_bonus: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: credit_bonus_form
    effect: method
    decides: credit_drawn
    bindings:
    - item_entries
    - item_requested
    - item_gifts
    - credit_drawn
    ladder:
    - when: >-
        the line's item has an item entry and the requested quantity of its most recent item entry is above the number of
        its guest gift entries
      method: 'the bonus stretches the credit: the amount still to be paid divided by one plus the bonus percent'
    - when: >-
        the item has an item entry and its guest gift entries reach the requested quantity of its most recent item entry
      method: >-
        the bonus is a reduction on at most the bonus base: the amount still to be paid less the bonus percent of the smaller
        of that amount and the bonus base
    - when: otherwise (no item entry)
      method: 'no bonus: the credit drawn is the amount still to be paid'
    baseline:
      credit_drawn: payable
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The registry credit applied to an order line is the line's selling price, never more than the registry credit available,
      that is the registry's credit entries for returned gifts less its registry credit used and converted entries; it is
      rounded half up to the cent once, on the final amount.
    params: []
  inputs:
    history:
    - table: registry_events
      aggregate: sum
      field: amount
      filters:
        event_type: registry_return_credit
    - table: registry_events
      aggregate: count
      field: registry_event_id
      filters:
        event_type: registry_gift_purchase
    - table: registry_events
      aggregate: latest
      field: amount
      filters:
        event_type: registry_completion_purchase
    cross_category:
    - order
    - loyalty
