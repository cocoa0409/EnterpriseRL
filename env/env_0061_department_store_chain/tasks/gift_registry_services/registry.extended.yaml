# Policy charter: Marlowe & Finch Gift Registry. The holding is one registry created by a
# registrant for one occasion; guests buy registry gifts as ordinary Merchandise Purchases linked to
# the registry, and the registry books completion purchases, registry rewards and registry credit.

category: registry
display_name: Marlowe & Finch Gift Registry

binding:
  holding_table: registries
  event_tables: [registry_events]
  intake_tables: [registry_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {registry_rewards_balance: registry_rewards, registry_credit_balance: registry_credit}

lifecycle:
  states: [active, completion, closed, cancelled]
  transitions:
    - {from: active, to: completion, by: system, means: "The completion period opens on the completion start date of the registry type."}
    - {from: completion, to: closed, by: system, means: "The completion period ends and the registry closes; remaining registry credit is converted."}
    - {from: active, to: cancelled, by: user, means: "The registrant cancels the registry before its completion period opens (for example a called-off wedding)."}

accounts:
  - key: registry_rewards
    unit: USD
    meaning: "Registry rewards accrued for the registrant on guests' net purchases from the registry and not yet paid out as a Registry Reward Card."
  - key: registry_credit
    unit: USD
    meaning: "Registry credit held on the registry from registry gifts the registrant returned, not yet spent or converted to a merchandise credit card."

parameter_schema:
  occasion_scope: "Occasions the registry type is offered for; string."
  max_months_before_event_to_create: "Full calendar months before the event_date beyond which a registry of this type cannot yet be created; integer."
  max_days_after_event_to_create: "Calendar days after the event_date up to which a registry of this type can still be created; integer."
  min_registrant_age: "Minimum age of the registrant in whole years; integer."
  co_registrant_allowed: "Whether a co-registrant can be named; boolean."
  max_registries_same_type: "Registries of this type a customer may hold in active or completion status at once; integer."
  completion_discount_pct: "Completion discount off items on the registry bought by the registrant or co-registrant during the completion period; percent."
  completion_start_days_before_event: "Calendar days before the event_date on which the completion period opens; integer (0 means it opens on the event_date)."
  completion_window_days_after_event: "Calendar days after the event_date on which the completion period ends (inclusive); integer."
  completion_quantity_basis: "How many units of an item the completion discount covers; string rule key (requested quantity not yet purchased by guests)."
  completion_excluded_classes: "Merchandise classes (official class names) never eligible for the completion discount; list."
  completion_excluded_price_types: "Price types never eligible for the completion discount; list."
  completion_item_min_days_on_registry: "Calendar days an item must have been on the registry before the completion purchase date; integer."
  completion_discount_cap_usd: "Maximum total completion discount for the registry; USD, 2 decimals."
  completion_coupon_stacking: "How the completion discount combines with a percent-off coupon on the same item; string rule key (take_better_of)."
  completion_card_bonus_pct: "Extra completion discount points of percent when the completion purchase is charged to a Marlowe & Finch card; percent."
  completion_channels: "Channels where the completion discount can be used; list."
  completion_purchaser: "Who can use the completion discount; string rule key (registrant or co-registrant)."
  registry_rewards_pct: "Percent of guests' net purchases from the registry accrued as registry rewards; percent."
  registry_rewards_min_net_guest_purchases_usd: "Net guest purchases from the registry required for any payout; USD, 2 decimals, or not_applicable."
  registry_rewards_cap_usd: "Maximum registry rewards paid out for one registry; USD, 2 decimals, or not_applicable."
  registry_rewards_issue_days_after_event: "Calendar days after the event_date on which accrued registry rewards are paid out; integer, or not_applicable."
  registry_rewards_excluded_items: "Guest purchases that accrue no registry rewards; list."
  registry_rewards_payout_form: "Form of the payout; string rule key (Registry Reward Card)."
  registry_rewards_reversal_on_return: "Whether rewards accrued on a guest purchase are reversed when that gift is returned before payout; boolean."
  registry_gift_return_window_days_after_event: "Calendar days after the event_date within which the registrant can return registry gifts; integer."
  registry_gift_return_deadline_rule: "Selection rule between the registry window and the merchandise class window for a registry gift; string rule key (later_of)."
  registry_gift_return_price_basis: "Amount credited for a returned registry gift; string rule key (price the guest paid, net of the guest's notes)."
  registry_gift_return_proof: "Proof needed by the registrant to return a registry gift; string rule key (the registry gift record)."
  registry_gift_exchange_allowed: "Whether the registrant can exchange a registry gift for another item instead of taking credit; boolean."
  registry_credit_usable_for: "What registry credit can be spent on; string rule key."
  registry_credit_conversion_form: "What remaining registry credit is converted into when the registry closes or is cancelled; string rule key (merchandise credit card)."
  registry_credit_conversion_days_after_close: "Calendar days after the registry closes or is cancelled within which remaining credit is converted; integer."
  event_date_changes_max: "Maximum changes of the event_date over the registry's life; integer."
  event_date_max_shift_months: "Maximum full calendar months the event_date can move from the date first registered; integer."
  event_date_change_cutoff: "Last status in which the event_date can still be changed; string rule key (active)."
  visibility_options: "Visibility settings the registrant can choose; list."
  cancellation_allowed_status: "Statuses in which the registrant can cancel the registry; list."
  cancelled_registry_reactivation: "Whether a cancelled registry can be reactivated; boolean."
  guest_purchase_link_window_days: "Calendar days after a guest's purchase within which a gift bought without selecting the registry can still be linked to it; integer."
  guest_purchase_link_proof: "What a guest or registrant needs to link an unlinked gift; string rule key (purchase record)."
  loyalty_bonus_applies: "Whether the registrant's Finch Circle registry_completion_bonus_pct is added to the completion discount; boolean."
  max_items_on_registry: "Maximum distinct items (skus) on one registry; integer."
  item_requested_quantity_max: "Maximum requested quantity of one sku; integer."
  rewards_payout_requires_active_status: "Statuses in which the rewards payout is made; list."
  registry_number_format: "Format of the public registry number; string."
  completion_discount_on_gift_cards: "Whether the completion discount applies to gift cards; boolean."
  registry_closure_basis: "When the registry closes; string rule key (end of completion period)."

