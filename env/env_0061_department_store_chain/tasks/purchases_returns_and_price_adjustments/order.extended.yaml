    gift_receipt_refund_destination: merchandise_credit_card
    refund_tender_priority: [mf_card, bank_card, debit, cash, gift_card]
    cash_refund_check_threshold_usd: 500.00
    sales_tax_refund_basis: proportional_to_refunded_merchandise
    gift_with_purchase_rule: false
    gift_with_purchase_value_usd: not_applicable
    personalized_items_returnable: false
    exchange_window_days: 30
    order_cancellation_cutoff: before_shipment
    store_pickup_hold_days: not_applicable
    mattress_comfort_exchange_nights: 120
    mattress_comfort_min_nights: 30
    mattress_comfort_exchanges_max: 1
    mattress_comfort_exchange_fee_usd: 0.00
    points_and_spend_on_return: true
    registry_gift_return_destination: registrant_credit
    warranty_referral_after_window: true
    id_required_no_receipt: true
    discount_allocation_basis: pro_rata_by_unit_price_before_discount

# ---- events (every write of this category) ----
events:
  - type: order_purchase
    target: purchases
    mutation: create
    meaning: "A customer buys an item in store, online, in the app or by phone; one purchase record is created per unit."
    grain: "One row per unit of one item in one order or register transaction."
    fields:
      variant_name: "Merchandise class of the item, as the official class name."
      status: "ordered at creation."
      order_number: "Order or register receipt number shared by the purchase records of the transaction."
      purchase_date: "Date of the order or register transaction."
      channel: "in_store, online, app or phone_order."
      fulfillment: "carry_out, ship_to_home, store_pickup or home_delivery."
      item_description: "Item name as printed on the receipt."
      sku: "Item number."
      regular_price: "Ticketed regular price of the unit, USD."
      unit_price: "Selling price of the unit after promotions and coupons allocated to it, before Finch Notes and tax, USD."
      price_type: "regular, sale, clearance, doorbuster or final_sale."
      tax_amount: "Sales tax charged on the unit, USD."
      finch_notes_applied: "Finch Note value allocated to the unit, USD."
      tender_type: "mf_card, bank_card, debit, cash, gift_card or mixed."
      card_account_id: "Marlowe & Finch card account charged, when the tender includes a Marlowe & Finch card."
      registry_id: "Gift registry the unit was bought from, when bought as a registry gift."
      gift_receipt: "Whether a gift receipt was issued for the unit."
      membership_linked: "Whether a Finch Circle number was captured on the transaction."
    triggers:
      - event: "order:order_payment"
        map: {tender_type: tender_type}
      - event: "registry:registry_gift_purchase"
        when: {registry_id: {not: ""}}
        map: {purchase_id: purchase_id, sku: sku}
  - type: order_shipment
    target: purchases
    mutation: {transition: {from: ordered, to: shipped}}
    meaning: "The order line ships from a fulfilment center or store."
    grain: "One transition per shipped unit."
    fields:
      status: "Set to shipped."
      ship_date: "Date the unit shipped."
    triggers: []
  - type: order_completion
    target: purchases
    mutation: {transition: [{from: shipped, to: completed}, {from: ordered, to: completed}]}
    meaning: "The unit reaches the customer: delivered, collected at a store, or carried out at the register."
    grain: "One transition per unit completed."
    fields:
      status: "Set to completed."
      completed_date: "Delivery date, pickup date or carry-out date; the anchor of the return window."
    triggers: []
  - type: order_cancellation
    target: purchases
    mutation: {transition: {from: ordered, to: cancelled}}
    meaning: "An order line that has not shipped is cancelled at the customer's request, or a store pickup order is not collected in time."
    grain: "One transition per unit cancelled."
    fields:
      status: "Set to cancelled."
      cancelled_date: "Date of the cancellation."
      cancellation_reason: "customer_request or pickup_not_collected."
    triggers:
      - event: "order:order_refund"
        when: {cancellation_reason: customer_request}
        map: {refund_trigger: cancellation}
      - event: "order:order_refund"
        when: {cancellation_reason: pickup_not_collected}
        map: {refund_trigger: pickup_not_collected}
  - type: order_return_start
    target: purchases
    mutation: {transition: {from: completed, to: return_pending}}
    meaning: "The customer starts a return of a completed unit by an authorized return method."
    grain: "One transition per unit put into return."
    fields:
      status: "Set to return_pending."
    triggers: []
  - type: order_return_receipt
    target: purchases
    mutation: {transition: {from: return_pending, to: returned}}
    meaning: "The returned unit is received and accepted."
    grain: "One transition per unit received back."
    fields:
      status: "Set to returned."
      returned_date: "Date the unit was received and accepted."
    triggers:
      - event: "order:order_refund"
        map: {refund_trigger: return}
  - type: order_return_lapse
    target: purchases
    mutation: {transition: {from: return_pending, to: completed}}
    meaning: "A started return lapses unused or the unit is rejected on inspection and sent back."
    grain: "One transition per lapsed or rejected return."
    fields:
      status: "Set back to completed."
    triggers: []
  - type: order_payment
    target: order_events
    meaning: "Payment for the unit is captured at purchase."
    grain: "One row per tender captured for one unit."
    distinguish_by: [event_date, tender_type]
    fields:
      event_date: "Date the payment was captured."
      amount: "Amount captured for the unit (unit price plus tax, less Finch Notes), positive USD."
      tender_type: "Tender captured."
    account: net_paid
    direction: in
    triggers: []
  - type: order_price_adjustment
    target: order_events
    meaning: "The difference between the price paid and a lower Marlowe & Finch price is refunded for a unit."
    grain: "One row per price adjustment granted on one unit."
    distinguish_by: [event_date, new_unit_price]
    fields:
      event_date: "Date the adjustment was granted."
      amount: "Amount refunded, positive USD: the per-unit price difference plus the sales tax on it."
      new_unit_price: "The lower Marlowe & Finch selling price the adjustment is based on, USD."
      adjustment_reason: "mf_price_drop or register_price_error."
      refund_tender_type: "Tender the adjustment was refunded to."
    account: net_paid
    direction: out
    triggers:
      - event: "card:card_merchandise_credit"
        when: {refund_tender_type: mf_card}
        map: {purchase_id: purchase_id, order_event_id: order_event_id, amount: amount}
  - type: order_refund
    target: order_events
    meaning: "Money is refunded for a unit after a return is received, an order line is cancelled, or a pickup order is not collected."
    grain: "One row per refund of one unit per refund trigger."
    distinguish_by: [return_id, refund_trigger]
    fields:
      event_date: "Date the refund was issued."
      amount: "Amount refunded, positive USD, after any restocking, label or pickup fee and gift-with-purchase deduction."
      return_id: "Return record refunded; empty for a cancellation or uncollected pickup."
      refund_trigger: "return, cancellation or pickup_not_collected."
      refund_destination: "original_tender, merchandise_credit_card, registrant_credit or check."
      refund_tender_type: "Tender refunded when the destination is original_tender; not_applicable otherwise."
      restocking_fee_amount: "Restocking fee deducted, USD."
      return_fee_amount: "Prepaid label or carrier pickup fee deducted, USD."
      gwp_deduction_amount: "Kept gift-with-purchase value deducted, USD."
      tax_refunded: "Sales tax included in the refund, USD."
    account: net_paid
    direction: out
    triggers:
      - event: "card:card_merchandise_credit"
        when: {refund_destination: original_tender, refund_tender_type: mf_card}
        map: {purchase_id: purchase_id, return_id: return_id, order_event_id: order_event_id, amount: amount}
      - event: "loyalty:loyalty_points_reversal"
        when: {refund_trigger: return}
        map: {return_id: return_id, purchase_id: purchase_id}
      - event: "giftcard:giftcard_issue"
        when: {refund_destination: merchandise_credit_card}
        map: {return_id: return_id, amount: amount}
      - event: "registry:registry_return_credit"
        when: {refund_destination: registrant_credit}
        map: {return_id: return_id, purchase_id: purchase_id, amount: amount}
  - type: order_comfort_exchange
    target: order_events
    meaning: "A mattress is exchanged once for comfort; the replacement is a new purchase record and the original is returned without restocking fee."
    grain: "One row per comfort exchange of one mattress unit."
    distinguish_by: [replacement_purchase_id]
    fields:
      event_date: "Date the exchange was booked."
      replacement_purchase_id: "Purchase record of the replacement mattress."
      return_id: "Return record of the original mattress."
    triggers: []

# ---- derived measures ----
measures:
  - id: order_msr_no_receipt_returns_12m
    window: "Rolling 12 calendar months ending on the return date, by the date part of return_requests.created_at."
    measure: "Count of return_requests records of the customer with receipt_type no_receipt and return_status received or refunded."
  - id: order_msr_price_adjustments_on_unit
    window: "All history of the purchase record."
    measure: "Count of order_price_adjustment rows of the purchase record with adjustment_reason mf_price_drop."
  - id: order_msr_effective_unit_price
    window: "All history of the purchase record."
    measure: "The new_unit_price of the latest order_price_adjustment row of the purchase record, or its unit_price when it has none."

# ---- policies ----
policies:
  - id: order_agg_multi_holding
    subject: [order_purchase]
    rule: >-
      A customer may hold any number of purchase records (max_per_customer null): every unit bought is its own record, and
      the units of one order or register transaction share its order_number. Each record keeps its own merchandise class,
      return window, price adjustments and refund; a return, cancellation or adjustment always names the single purchase
      record it concerns and never applies to an order_number as a whole.
    eligibility: []
    params:
      max_per_customer: null

  - id: order_agg_order_allocation
    subject: [order_purchase, order_payment, order_refund]
    rule: >-
      Order-level amounts are spread over the purchase records of the order_number: a coupon or order-level promotion is
      allocated by discount_allocation_basis (in proportion to each unit's price before the discount, rounded half up to
      the cent with any rounding remainder on the highest-priced unit) and is already reflected in each unit_price; Finch
      Notes applied to the order are allocated the same way into finch_notes_applied. A mixed-tender transaction is
      recorded with tender_type mixed on its purchase records and one order_payment row per tender per unit, allocated the
      same way. A refund of one unit returns only that unit's allocated amounts; when a coupon required a minimum purchase
      that the kept units no longer meet, the coupon is not taken back.
    eligibility: []
    params: {}

  - id: order_agg_no_receipt_returns
    subject: [order_return_start, order_refund]
    rule: >-
      Across all of a customer's returns, at most no_receipt_returns_per_12_months returns without receipt are accepted in
      a rolling 12 months (order_msr_no_receipt_returns_12m). A purchase made with a Marlowe & Finch card or with the
      Finch Circle number linked within the last purchase_lookup_months months is found from those records and is an
      order_record return, not a no-receipt return. A no-receipt return is possible only for a class whose
      no_receipt_return_allowed is true, requires the customer's government photo ID to be recorded (id_required_no_receipt),
      and is refunded as a merchandise credit card at the lowest selling price of that item in the
      no_receipt_price_lookback_days before the return date (no_receipt_refund_basis), never to a card or in cash.
    eligibility: []
    params: {}
    measures: [order_msr_no_receipt_returns_12m]

  - id: order_payment_capture
    subject: [order_payment, order_purchase]
    rule: >-
      Payment for a carry-out or store pickup purchase is captured on the purchase_date; payment for a shipped or home
      delivery unit is authorized at order and captured on the ship_date (home delivery: the scheduled delivery date). The
      amount captured for a unit is its unit_price plus tax_amount minus finch_notes_applied. A unit charged to a Marlowe &
      Finch card names the card_account_id; the card charge itself posts on the card account per order_number. Finch Notes
      are not a tender and are never refunded as money.
    eligibility: []
    params: {}
    formula:
      amount: "unit_price + tax_amount - finch_notes_applied"

  - id: order_return_eligibility
    subject: [order_return_start]
    rule: >-
      A completed unit can be put into return when its return date (the date the return is authorized) is on or before its
      return deadline. The return is started no later than the return deadline counted from the completed_date of the unit. The ordinary deadline is the
      completed_date plus the class's return_window_days plus the extended_return_days of the customer's Finch Circle tier
      held on the return date, counted in calendar days with the completed_date as day 0, and a return authorized on the
      deadline is in time. For a class whose holiday_extension_applies is true, a unit whose purchase_date falls from
      holiday_purchase_window_start through holiday_purchase_window_end has as its deadline the later of the ordinary deadline
      and holiday_return_deadline of the following calendar year. After the deadline a unit can still be returned only when
      it is defective, until the completed_date plus defective_return_window_days, or damaged in transit and reported within
      damage_report_window_days of the completed_date; after those, a class whose warranty_referral_after_window is true is
      referred to the manufacturer warranty and no return is started. Final sale units (final_sale_returnable false) and
      monogrammed or engraved units (personalized_items_returnable false) are returned only as defective. The unit must meet
      the class's return_condition_required; a used or damaged unit returned as changed_mind or wrong_size_or_fit is rejected
      on inspection. The return method must be one of the class's return_methods_allowed. Starting a return is the
      customer's own act: the customer authorizes it, a return_requests record is created with return_status authorized, and
      the unit moves to return_pending. The same unit has no other return that is authorized, received or refunded.
      The return window starts at the return_window_anchor (completed_date). An even exchange of the unit for the same item in another size or color is made within exchange_window_days of the completed_date on the same terms, without refund and new purchase.
    eligibility:
      - id: within_return_deadline
        applies_to: [order_return_start]
        kind: time
        condition: "The return is started no later than the return deadline counted from the completed_date of the unit."
        evidence_fields: [purchases.completed_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the completed_date of the unit"
          anchor_source: purchases.completed_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: "The ordinary deadline is the completed_date plus the class's return_window_days plus the extended_return_days of the customer's Finch Circle tier held on the return date, counted in calendar days with the completed_date as day 0, and a return authorized on the deadline is in time."
          boundary: inclusive
      - id: one_open_return_per_unit
        applies_to: [order_return_start]
        kind: dedup
        condition: "The same unit has no other return that is authorized, received or refunded."
        evidence_fields: [return_requests.purchase_id, return_requests.return_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_requests.purchase_id]
          action_bindings:
            return_requests.purchase_id: purchase_id
        dedup_contract:
          table: return_requests
          mode: separate_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {return_status: [authorized, received, refunded]}
          distinct_fields: []
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Beauty & Fragrance": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Home & Kitchen": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Electronics & Small Appliances": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Fine Jewelry & Watches": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Designer Handbags & Luxury": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}
        "Furniture & Mattresses": {window_days: "=return_window_days", holiday: "=holiday_extension_applies"}

  - id: order_evt_refund
    subject: [order_refund]
    rule: >-
      A received return is refunded within the class's return_refund_business_days. The refund of a returned unit is its
      net_paid_amount (which already reflects price adjustments, and excludes Finch Notes, which come back only as a
      reinstated note under the Finch Circle rules) minus the restocking fee, the return fee and the gift-with-purchase
      deduction, and includes the unit's remaining sales tax as tax_refunded. The restocking fee is the class's
      restocking_fee_pct of the refunded merchandise (net_paid_amount minus tax_refunded), rounded half up to the cent,
      charged on all returns when restocking_fee_applies_to is all_items and on returns with item_condition opened_unused
      when it is opened_items. The return fee is the class's prepaid_label_fee_usd for mail_prepaid_label and its
      carrier_pickup_fee_usd for carrier_pickup; in_store and mail_own_postage returns have none. No restocking fee and no
      return fee is charged when the return_reason is one of fee_waiver_reasons. A Finch Circle member whose tier held on the
      return date has restocking_fee_waived true pays no restocking fee, and one whose tier has free_return_shipping true
      pays no prepaid label fee (the carrier pickup fee still applies). For a class whose gift_with_purchase_rule is true,
      gift_with_purchase_value_usd is deducted when a gift received with the unit is not returned with it. The home
      delivery fee of the unit is not refunded unless the return_reason is a fee-waiver reason. Destination: with an
      original receipt or order record the refund goes to the original tender (refund_tender_priority for mixed tender; a
      cash refund above cash_refund_check_threshold_usd is mailed as a check); a gift_receipt return goes to a merchandise
      credit card; a no-receipt return follows order_agg_no_receipt_returns; a registry gift returned by the registrant
      follows order_gift_and_registry_returns. A cancellation or uncollected pickup refund is the full net_paid_amount to
      the original tender with no fee. No refund has already been issued for the same return. Price adjustments, points
      and qualifying spend follow their own rules.
      Sales tax is refunded per sales_tax_refund_basis. The home delivery fee is refunded only where delivery_fee_refundable_on_return is true or the return_reason is a fee-waiver reason. Finch Circle points and qualifying spend are reduced for the return where points_and_spend_on_return is true.
    eligibility:
      - id: one_refund_per_return
        applies_to: [order_refund]
        kind: dedup
        condition: "No refund has already been issued for the same return."
        evidence_fields: [order_events.return_id, order_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_events.return_id]
          action_bindings:
            order_events.return_id: return_id
        dedup_contract:
          table: order_events
          mode: separate_record
          object_bindings: {return_id: return_id}
          duplicate_filters: {event_type: [order_refund]}
          distinct_fields: [refund_trigger]
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Beauty & Fragrance": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Home & Kitchen": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Electronics & Small Appliances": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Fine Jewelry & Watches": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Designer Handbags & Luxury": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
        "Furniture & Mattresses": {restocking_pct: "=restocking_fee_pct", label_fee: "=prepaid_label_fee_usd"}
    formula:
      restocking_fee_amount: "round((net_paid_amount - tax_refunded) * restocking_fee_pct / 100, 2)"
      amount: "net_paid_amount - restocking_fee_amount - return_fee_amount - gwp_deduction_amount"

  - id: order_price_adjustment_rules
    subject: [order_price_adjustment]
    rule: >-
      When Marlowe & Finch (any store, mfinch.com or the app) sells the identical item (same sku) at a lower price within the
      price-adjustment window, the customer may ask for the difference. The request date is no later than the price
      adjustment window after the purchase_date. The window is the class's price_adjustment_window_days plus the
      price_adjustment_extension_days of the customer's Finch Circle tier held on the request date, counted in calendar days
      with the purchase_date as day 0, and a request on the last day is in time. The class must have price_adjustment_eligible
      true. Lower prices in price_adjustment_exclusions never qualify (clearance markdowns, doorbusters, coupons or promo
      codes, competitor prices, final sale, bonus card offers), and a unit bought as clearance or final_sale is never
      adjusted. The unit is in ordered, shipped or completed status. The order_msr_price_adjustments_on_unit count is below
      the class's price_adjustments_per_item_max, and the per-unit difference between order_msr_effective_unit_price and the
      new_unit_price is at least price_adjustment_min_difference_usd. The adjustment refunds that difference plus the sales
      tax charged on it (the unit's tax_amount times the difference divided by unit_price, rounded half up to the cent) to
      the original tender (price_adjustment_refund_tender), never as a gift card. A register_price_error adjustment (the unit
      was charged above its ticketed or advertised price on the purchase date) is made at any time while the unit is not
      returned, refunds the overcharge, and counts toward no limit. A price adjustment does not change Finch Circle points
      or qualifying spend.
    eligibility:
      - id: within_adjustment_window
        applies_to: [order_price_adjustment]
        kind: time
        condition: "The request date is no later than the price adjustment window after the purchase_date."
        evidence_fields: [purchases.purchase_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase_date"
          anchor_source: purchases.purchase_date
          relation: not_after
          duration_source: variants.price_adjustment_window_days
          unit: calendar_days
          counting_rule: "The window is the class's price_adjustment_window_days plus the price_adjustment_extension_days of the customer's Finch Circle tier held on the request date, counted in calendar days with the purchase_date as day 0, and a request on the last day is in time."
          boundary: inclusive
      - id: unit_not_returned
        applies_to: [order_price_adjustment]
        kind: state
        condition: "The unit is in ordered, shipped or completed status."
        evidence_fields: [purchases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.status]
          action_bindings:
            purchases.status: status
        state_contract:
          field: purchases.status
          allowed: [ordered, shipped, completed]
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Beauty & Fragrance": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Home & Kitchen": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Electronics & Small Appliances": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Fine Jewelry & Watches": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Designer Handbags & Luxury": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
        "Furniture & Mattresses": {window_days: "=price_adjustment_window_days", max_adjustments: "=price_adjustments_per_item_max"}
    formula:
      amount: "round((order_msr_effective_unit_price - new_unit_price) * (1 + tax_amount / unit_price), 2)"
    measures: [order_msr_price_adjustments_on_unit, order_msr_effective_unit_price]

  - id: order_cancellation_rules
    subject: [order_cancellation]
    rule: >-
      A unit can be cancelled only while it is in ordered status (order_cancellation_cutoff before shipment); once it has
      shipped or been completed, the customer returns it instead. Cancellation at the customer's request
      (cancellation_reason customer_request) is made by customer care on the customer's word and needs no proof. A store
      pickup unit not collected within the class's store_pickup_hold_days after it is ready is cancelled with
      cancellation_reason pickup_not_collected. Either way the full net_paid_amount is refunded to the original tender with
      no fee, a card charge that has not yet been captured is simply released, and Finch Notes allocated to the unit are
      reinstated under the Finch Circle rules. Cancelling one unit never cancels the other units of its order_number unless
      the customer asks for each.
    eligibility: []
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {hold_days: "=store_pickup_hold_days"}
        "Beauty & Fragrance": {hold_days: "=store_pickup_hold_days"}
        "Home & Kitchen": {hold_days: "=store_pickup_hold_days"}
        "Electronics & Small Appliances": {hold_days: "=store_pickup_hold_days"}
        "Fine Jewelry & Watches": {hold_days: "=store_pickup_hold_days"}
        "Designer Handbags & Luxury": {hold_days: "=store_pickup_hold_days"}
        "Furniture & Mattresses": {hold_days: "=store_pickup_hold_days"}

  - id: order_mattress_comfort_exchange
    subject: [order_comfort_exchange]
    rule: >-
      A mattress bought as a Furniture & Mattresses unit can be exchanged once (mattress_comfort_exchanges_max) for a
      different mattress for comfort. The exchange is booked no earlier than mattress_comfort_min_nights nights after the
      completed_date (delivery date) and no later than mattress_comfort_exchange_nights nights after it, counting the night
      of the delivery date as night 1. The exchange is booked within the comfort window after the completed_date. The original
      mattress is collected and returned with return_reason changed_mind but without restocking fee or carrier pickup fee,
      and with a comfort exchange fee of mattress_comfort_exchange_fee_usd; the replacement is a new purchase record at its
      current selling price, and the difference between the replacement price and the refunded net_paid_amount is charged or
      refunded to the original tender. The delivery fee of the replacement is charged under the home delivery rules. The
      mattress has not been comfort-exchanged before; a replacement mattress received through a comfort exchange can only be
      returned under the ordinary return rules counted from its own completed_date and is never comfort-exchanged. Bed
      frames, headboards, adjustable bases and furniture have no comfort exchange.
    eligibility:
      - id: comfort_window
        applies_to: [order_comfort_exchange]
        kind: time
        condition: "The exchange is booked within the comfort window after the completed_date."
        evidence_fields: [purchases.completed_date, purchases.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchases.purchase_id]
          action_bindings:
            purchases.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the completed_date"
          anchor_source: purchases.completed_date
          relation: not_after
          duration_source: variants.mattress_comfort_exchange_nights
          unit: calendar_days
          counting_rule: "The exchange is booked no earlier than mattress_comfort_min_nights nights after the completed_date (delivery date) and no later than mattress_comfort_exchange_nights nights after it, counting the night of the delivery date as night 1."
          boundary: inclusive
      - id: not_exchanged_before
        applies_to: [order_comfort_exchange]
        kind: dedup
        condition: "The mattress has not been comfort-exchanged before; a replacement mattress received through a comfort exchange can only be returned under the ordinary return rules counted from its own completed_date and is never comfort-exchanged."
        evidence_fields: [order_events.purchase_id, order_events.event_type, order_events.replacement_purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_events.purchase_id]
          action_bindings:
            order_events.purchase_id: purchase_id
        dedup_contract:
          table: order_events
          mode: separate_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {event_type: [order_comfort_exchange]}
          distinct_fields: []
    params: {}

  - id: order_gift_and_registry_returns
    subject: [order_refund, order_return_start]
    rule: >-
      A gift is returned by the person holding it, never refunded to the giver's tender. A unit returned with a gift receipt
      (receipt_type gift_receipt) is refunded to a new merchandise credit card in the returning customer's name
      (gift_receipt_refund_destination), at the net amount the giver paid for the unit, within the class's ordinary return
      window counted from the completed_date of the giver's purchase. A unit bought from a gift registry (registry_id not
      empty) and returned by that registry's registrant is refunded as registrant credit on the registry
      (registry_gift_return_destination); the window and the rules for registry gifts are those of the gift registry
      charter, which take precedence over the ordinary return window for such units. A giver who returns a gift they still
      hold (the purchase is in their own name and they present the receipt or order record) is refunded to their original
      tender under order_evt_refund.
    eligibility: []
    params: {}

  - id: order_fulfilment_lifecycle
    subject: [order_shipment, order_completion, order_return_receipt, order_return_lapse]
    rule: >-
      Shipment, delivery, pickup, receipt of returns and lapse of returns are recorded by Marlowe & Finch systems from
      carrier scans, register transactions and returns-center inspection; customer care never records them. The
      completed_date is the carrier delivery date for ship_to_home, the date of collection for store_pickup, the completed
      delivery date for home_delivery, and the purchase_date for carry_out. A return_pending unit becomes returned when it is
      received at a store or the returns center in the condition the class requires; it goes back to completed when the
      class's return_label_validity_days pass after the return was authorized without the label being used or the pickup
      completed (return_status expired), or when inspection rejects it (return_status rejected) and it is shipped back to the
      customer. A rejected or expired return can be started again only while the unit is still within its return deadline.
    eligibility: []
    params:
      per_tier:
        "Apparel, Shoes & Accessories": {label_validity_days: "=return_label_validity_days"}
        "Beauty & Fragrance": {label_validity_days: "=return_label_validity_days"}
        "Home & Kitchen": {label_validity_days: "=return_label_validity_days"}
        "Electronics & Small Appliances": {label_validity_days: "=return_label_validity_days"}
        "Fine Jewelry & Watches": {label_validity_days: "=return_label_validity_days"}
        "Designer Handbags & Luxury": {label_validity_days: "=return_label_validity_days"}
        "Furniture & Mattresses": {label_validity_days: "=return_label_validity_days"}

# ============================================================================
# extended_policies (difficulty: purchases_returns_and_price_adjustments)
# ============================================================================
extended_policies:
  - id: order_ext_shelf_price_correction
    base_policy_refs: [order_price_adjustment_rules]
    overwrite:
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          A register_price_error adjustment (the unit was charged above its ticketed or advertised price on the purchase
          date) is made at any time while the unit is not returned, refunds the overcharge, and counts toward no limit.
        replaced_by: >-
          For a unit rung above its shelf ticket that this policy handles, and only for such a unit, the register-error
          adjustment is still made at any time while the unit is not returned and still counts toward no limit, and it
          refunds the shelf overcharge with its sales tax together with the price-accuracy credit; every other register error, including registry credit recorded as spent but left undeducted; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; gift card or Bonus Card value recorded as redeemed but left undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it.
    trigger: on_request
    subject: [order_price_adjustment]
    computes: amount
    target_tool: correct_shelf_price_8a80c6f7
    params:
      rate_top: 0.50
      rate_mid: 0.35
      rate_std: 0.20
      cap_premium: 40.00
      cap_card: 25.00
      cap_std: 15.00
      spend_high: 2500.00
      spend_mid: 1000.00
      bonus_high: 10.00
      bonus_mid: 5.00
      bonus_std: 0.00
      per_day: 0.50
    rule: >-
      A unit of regular price type whose selling price on the purchase record is above its shelf ticket price (the
      regular price on the same record) was rung above its shelf ticket, and the Price Accuracy Promise corrects it as a
      register-error price adjustment refunded to the unit's original tender. For a unit rung above its shelf ticket
      that this policy handles, and only for such a unit, the register-error adjustment is still made at any time while
      the unit is not returned and still counts toward no limit, and it refunds the shelf overcharge with its sales tax
      together with the price-accuracy credit; every other register error, including registry credit recorded as spent but left undeducted; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; gift card or Bonus Card value recorded as redeemed but left undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it. The new unit price recorded on the correction is the shelf ticket
      price. The shelf overcharge is the unit's selling price less its shelf ticket price. The sales tax on the shelf overcharge is the unit's tax amount times the shelf overcharge divided by the unit's selling price, rounded half up to the cent. The price-accuracy credit is the accuracy share of the shelf overcharge plus the standing accrual
      plus the accuracy spend bonus, and the price-accuracy credit never exceeds the accuracy credit cap; the cap is
      compared with that sum after all three parts are added and before the credit is joined to the shelf overcharge
      and its tax. The standing accrual is the per-day standing accrual times the standing days. The correction amount
      is the shelf overcharge plus the sales tax on the shelf overcharge plus the capped price-accuracy credit, rounded
      half up to the cent. The accuracy share is the standard accuracy share, the accuracy credit cap is the standard
      accuracy credit cap, the accuracy spend bonus is the standard accuracy spend bonus, and the standing days are the
      calendar days from the purchase date to the request date, not counting the purchase date, rounded down to a whole
      number of weeks and multiplied by seven. A customer whose active Finch Circle membership is at the Platinum,
      Diamond or Icon tier and whose Finch Circle number was captured on the transaction receives the premium accuracy
      share; one whose active membership is at the Silver or Gold tier and whose Finch Circle number was captured on the
      transaction receives the member accuracy share; every other customer receives the standard accuracy share. A
      customer holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard has the premium accuracy
      credit cap; one holding any other active Marlowe & Finch card has the cardmember accuracy credit cap; every other
      customer has the standard accuracy credit cap. A customer whose Finch Circle qualifying spend posted in the twelve
      calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months
      before it) reaches the upper spend threshold receives the upper accuracy spend bonus; one whose spend reaches the
      middle spend threshold but not the upper receives the middle accuracy spend bonus; every other customer receives
      the standard accuracy spend bonus. For a unit paid by debit card or cash, whose money left the customer's account
      on the purchase date, the standing days are the calendar days from the purchase date to the request date counting
      both dates; for a unit paid by bank credit card the standing days are the calendar days from the purchase date to
      the request date, not counting the purchase date; for any other tender the standing days are those calendar days
      rounded down to a whole number of weeks and multiplied by seven.
    compute:
      - t0_overcharge: "F('unit_price') - F('regular_price')"
      - t0_overcharge_tax: "RND(F('tax_amount') * t0_overcharge / F('unit_price'), 2)"
      - t0_member_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - t0_credit_rate: "K('rate_top') if ((t0_member_tier == 'Finch Circle Platinum' or t0_member_tier == 'Finch Circle Diamond' or t0_member_tier == 'Finch Circle Icon') and F('membership_linked') == True) else (K('rate_mid') if ((t0_member_tier == 'Finch Circle Silver' or t0_member_tier == 'Finch Circle Gold') and F('membership_linked') == True) else K('rate_std'))"
      - t0_premium_card: "EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite') or EXISTS('card', status='active', variant_name='Marlowe & Finch World Elite Mastercard')"
      - t0_any_card: "EXISTS('card', status='active')"
      - t0_credit_cap: "K('cap_premium') if t0_premium_card else (K('cap_card') if t0_any_card else K('cap_std'))"
      - t0_member_spend: "XSUM('loyalty', 'loyalty_points_ledger', 'qualifying_amount', within_months=12, date_field='entry_date', event_type='loyalty_points_earn', earn_source='purchase_base')"
      - t0_spend_bonus: "K('bonus_high') if t0_member_spend >= K('spend_high') else (K('bonus_mid') if t0_member_spend >= K('spend_mid') else K('bonus_std'))"
      - t0_standing_days: "DAYS(F('purchase_date'), NOW) + 1 if (F('tender_type') == 'debit' or F('tender_type') == 'cash') else (DAYS(F('purchase_date'), NOW) if F('tender_type') == 'bank_card' else int(DAYS(F('purchase_date'), NOW) / 7) * 7)"
      - t0_standing_accrual: "K('per_day') * t0_standing_days"
      - t0_credit: "MN(t0_credit_cap, t0_credit_rate * t0_overcharge + t0_standing_accrual + t0_spend_bonus)"
      - result: "RND(t0_overcharge + t0_overcharge_tax + t0_credit, 2)"
    compute_basis:
      t0_overcharge: "The shelf overcharge is the unit's selling price less its shelf ticket price."
      t0_overcharge_tax: "The sales tax on the shelf overcharge is the unit's tax amount times the shelf overcharge divided by the unit's selling price, rounded half up to the cent."
      t0_member_tier: "A customer whose active Finch Circle membership is at the Platinum, Diamond or Icon tier and whose Finch Circle number was captured on the transaction receives the premium accuracy share"
      t0_credit_rate: "A customer whose active Finch Circle membership is at the Platinum, Diamond or Icon tier and whose Finch Circle number was captured on the transaction receives the premium accuracy share; one whose active membership is at the Silver or Gold tier and whose Finch Circle number was captured on the transaction receives the member accuracy share; every other customer receives the standard accuracy share."
      t0_premium_card: "A customer holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard has the premium accuracy credit cap"
      t0_any_card: "one holding any other active Marlowe & Finch card has the cardmember accuracy credit cap"
      t0_credit_cap: "A customer holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard has the premium accuracy credit cap; one holding any other active Marlowe & Finch card has the cardmember accuracy credit cap; every other customer has the standard accuracy credit cap."
      t0_member_spend: "A customer whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper spend threshold receives the upper accuracy spend bonus"
      t0_spend_bonus: "A customer whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper spend threshold receives the upper accuracy spend bonus; one whose spend reaches the middle spend threshold but not the upper receives the middle accuracy spend bonus; every other customer receives the standard accuracy spend bonus."
      t0_standing_days: "For a unit paid by debit card or cash, whose money left the customer's account on the purchase date, the standing days are the calendar days from the purchase date to the request date counting both dates; for a unit paid by bank credit card the standing days are the calendar days from the purchase date to the request date, not counting the purchase date; for any other tender the standing days are those calendar days rounded down to a whole number of weeks and multiplied by seven."
      t0_standing_accrual: "The standing accrual is the per-day standing accrual times the standing days."
      t0_credit: "The price-accuracy credit is the accuracy share of the shelf overcharge plus the standing accrual plus the accuracy spend bonus, and the price-accuracy credit never exceeds the accuracy credit cap; the cap is compared with that sum after all three parts are added and before the credit is joined to the shelf overcharge and its tax."
      result: "The correction amount is the shelf overcharge plus the sales tax on the shelf overcharge plus the capped price-accuracy credit, rounded half up to the cent."
    factors:
      - id: shelf_accuracy_share
        effect: parameter
        decides: t0_credit_rate
        bindings: [t0_member_tier, t0_credit_rate]
        ladder:
          - when: "active Finch Circle membership at the Platinum, Diamond or Icon tier and the Finch Circle number captured on the transaction"
            value: "K('rate_top')"
          - when: "active Finch Circle membership at the Silver or Gold tier and the Finch Circle number captured on the transaction"
            value: "K('rate_mid')"
          - when: "otherwise"
            value: "K('rate_std')"
        baseline:
          t0_credit_rate: "K('rate_std')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: shelf_accuracy_cap
        effect: parameter
        decides: t0_credit_cap
        bindings: [t0_premium_card, t0_any_card, t0_credit_cap]
        ladder:
          - when: "an active Marlowe & Finch Store Card Elite or World Elite Mastercard"
            value: "K('cap_premium')"
          - when: "any other active Marlowe & Finch card"
            value: "K('cap_card')"
          - when: "otherwise"
            value: "K('cap_std')"
        baseline:
          t0_credit_cap: "K('cap_std')"
        evidence: [cross_category]
        cross_difficulty: card
      - id: shelf_accuracy_spend_bonus
        effect: parameter
        decides: t0_spend_bonus
        bindings: [t0_member_spend, t0_spend_bonus]
        ladder:
          - when: "Finch Circle qualifying spend of the past twelve months at or above the upper spend threshold"
            value: "K('bonus_high')"
          - when: "that spend at or above the middle spend threshold and below the upper"
            value: "K('bonus_mid')"
          - when: "otherwise"
            value: "K('bonus_std')"
        baseline:
          t0_spend_bonus: "K('bonus_std')"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: shelf_standing_day_count
        effect: method
        decides: t0_standing_days
        bindings: [t0_standing_days]
        ladder:
          - when: "unit paid by debit card or cash"
            method: "calendar days from the purchase date to the request date counting both dates"
          - when: "unit paid by bank credit card"
            method: "calendar days from the purchase date to the request date, not counting the purchase date"
          - when: "otherwise"
            method: "those calendar days rounded down to whole weeks and multiplied by seven"
        baseline:
          t0_standing_days: "int(DAYS(F('purchase_date'), NOW) / 7) * 7"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The shelf overcharge is the unit's selling price less its shelf ticket price. The sales tax on the shelf overcharge is the unit's tax amount times the shelf overcharge divided by the unit's selling price, rounded half up to the cent. The price-accuracy credit is the accuracy share of the shelf overcharge plus the standing accrual
        plus the accuracy spend bonus, and the price-accuracy credit never exceeds the accuracy credit cap; the cap is
        compared with that sum after all three parts are added and before the credit is joined to the shelf overcharge
        and its tax. The standing accrual is the per-day standing accrual times the standing days. The correction amount
        is the shelf overcharge plus the sales tax on the shelf overcharge plus the capped price-accuracy credit, rounded
        half up to the cent. The accuracy share is the standard accuracy share, the accuracy credit cap is the standard
        accuracy credit cap, the accuracy spend bonus is the standard accuracy spend bonus, and the standing days are the
        calendar days from the purchase date to the request date, not counting the purchase date, rounded down to a whole
        number of weeks and multiplied by seven.
      params: [rate_std, cap_std, bonus_std, per_day]
    prerequisite: []
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, status, loyalty_points_ledger.qualifying_amount]
        note: "The membership tier decides the accuracy share; the qualifying spend of the past twelve months decides the accuracy spend bonus."
      - category: card
        as: branch
        reads: [variant_name, status]
        note: "The active card product decides the accuracy credit cap."
    inputs:
      history:
        - {category: loyalty, table: loyalty_points_ledger, aggregate: sum, field: qualifying_amount, within_months: 12, filters: {event_type: loyalty_points_earn, earn_source: purchase_base}}
      cross_category: [loyalty, card]
  - id: order_ext_registry_credit_shortfall_refund
    base_policy_refs: [order_price_adjustment_rules]
    overwrite:
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          A register_price_error adjustment (the unit was charged above its ticketed or advertised price on the purchase
          date) is made at any time while the unit is not returned, refunds the overcharge, and counts toward no limit.
        replaced_by: >-
          For registry credit recorded as spent on a unit but left undeducted that this policy handles, and only for such
          credit, the register-error adjustment is still made at any time while the unit is not returned and still counts
          toward no limit, and it refunds the card money captured for the part the credit had paid together with the
          held-funds credit and the registrant courtesies; every other register error, including a unit rung above its shelf ticket; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; gift card or Bonus Card value recorded as redeemed but left undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it.
    trigger: on_request
    subject: [order_price_adjustment]
    computes: amount
    target_tool: refund_registry_credit_shortfall_17a5cd98
    params:
      rate_completion: 0.60
      rate_active: 0.30
      rate_std: 0.10
      spend_high: 3000.00
      spend_mid: 1000.00
      cap_high: 15.00
      cap_mid: 8.00
      cap_std: 3.00
      courtesy_icon: 10
      courtesy_plus: 5
      courtesy_std: 0
      months_long: 120
      months_mid: 60
      tenure_long: 12.00
      tenure_mid: 6.00
      tenure_std: 0.00
    rule: >-
      When the registry's ledger shows registry credit spent on a purchase record but the unit's payment was captured
      in full on the customer's card, as if no credit had been used, the card was charged for the part the credit had
      already paid. For registry credit recorded as spent on a unit but left undeducted that this policy handles, and
      only for such credit, the register-error adjustment is still made at any time while the unit is not returned and
      still counts toward no limit, and it refunds the card money captured for the part the credit had paid together
      with the held-funds credit and the registrant courtesies; every other register error, including a unit rung above its shelf ticket; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; gift card or Bonus Card value recorded as redeemed but left undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it. The registry credit itself
      stays spent and is never paid out in cash or to a card account; only the card money captured for the part it had
      paid is returned, to the unit's original tender, and the correction records no new unit price. The registry
      credit shortfall is the total of the registry's credit-use entries naming the unit, but never more than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid (the registry-credit due amount less that credit), and never below zero. The registry-credit due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent. The held-funds
      credit is the daily held-funds rate times the held-funds days, and it never exceeds the held-funds cap. The
      registrant courtesy is the registry credit shortfall times the registrant courtesy percent, rounded half up to the
      cent. The shortfall refund is the registry credit shortfall plus the capped held-funds credit plus the registrant
      courtesy plus the registrant tenure courtesy, rounded half up to the cent. The daily held-funds rate is the
      standard daily held-funds rate, the held-funds cap is the standard held-funds cap, the registrant courtesy percent
      is the standard registrant courtesy percent, the registrant tenure courtesy is the standard registrant tenure
      courtesy, and the held-funds days are the calendar days from the date the unit's payment was last captured to the
      request date, not counting the capture date, rounded down to a whole number of weeks and multiplied by seven. A
      registrant whose registry holding the spent credit is in its completion period and who holds an active Marlowe &
      Finch card receives the completion daily held-funds rate; one whose registry holding the spent credit is still
      active before its completion period and who holds an active Marlowe & Finch card receives the pre-event daily
      held-funds rate; every other registrant receives the standard daily held-funds rate. For a unit paid by debit card
      or cash, whose money left the customer on the capture date, the held-funds days are the calendar days from the
      last capture date to the request date counting both dates; for a unit paid by bank credit card they are those
      calendar days not counting the capture date; for any other tender they are those calendar days rounded down to a
      whole number of weeks and multiplied by seven. A registrant whose Marlowe & Finch purchases charged to a
      Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date
      falls less than twelve whole months before it) reach the upper card-spend threshold has the upper held-funds cap;
      one whose such purchases reach the middle card-spend threshold but not the upper has the middle held-funds cap;
      every other registrant has the standard held-funds cap. A registrant whose registry type carries the Finch Circle
      registry bonus and whose active Finch Circle membership is at the Icon tier receives the Icon registrant courtesy
      percent; one whose registry type carries that bonus and whose active membership is at the Platinum or Diamond tier
      receives the premier registrant courtesy percent; every other registrant receives the standard registrant
      courtesy percent. A registrant whose active Finch Circle membership was enrolled at least the long-tenure months
      before the request date (whole months) receives the long registrant tenure courtesy; one enrolled at least the
      middle-tenure months but fewer than the long-tenure months receives the middle registrant tenure courtesy; every
      other registrant receives the standard registrant tenure courtesy.
    compute:
      - r0_credit_used: "XSUM('registry', 'registry_events', 'amount', date_field='entry_date', event_type='registry_credit_use', purchase_id=HID)"
      - r0_card_captured: "SUM('order_events', 'amount', event_type='order_payment') - SUM('order_events', 'amount', event_type='order_payment', tender_type='gift_card')"
      - r0_notes_on_unit: "MX(F('finch_notes_applied'), XSUM('loyalty', 'loyalty_note_ledger', 'note_amount', date_field='txn_date', event_type='loyalty_note_redeem', purchase_id=HID))"
      - r0_undeducted: "r0_notes_on_unit - F('finch_notes_applied')"
      - r0_undeducted_tax: "RND(F('tax_amount') * r0_undeducted / F('unit_price'), 2)"
      - r0_due: "F('unit_price') + F('tax_amount') - r0_notes_on_unit - r0_undeducted_tax"
      - r0_credit_shortfall: "MX(0, MN(r0_credit_used, r0_card_captured - (r0_due - r0_credit_used)))"
      - r0_credit_registry: "XLATEST('registry', 'registry_events', 'registry_id', date_field='entry_date', event_type='registry_credit_use', purchase_id=HID)"
      - r0_registry_status: "CFIELD('registry', 'status', registry_id=r0_credit_registry)"
      - r0_any_card: "EXISTS('card', status='active')"
      - r0_held_rate: "K('rate_completion') if (r0_registry_status == 'completion' and r0_any_card) else (K('rate_active') if (r0_registry_status == 'active' and r0_any_card) else K('rate_std'))"
      - r0_capture_date: "LATEST('order_events', 'event_date', event_type='order_payment')"
      - r0_held_days: "DAYS(r0_capture_date, NOW) + 1 if (F('tender_type') == 'debit' or F('tender_type') == 'cash') else (DAYS(r0_capture_date, NOW) if F('tender_type') == 'bank_card' else int(DAYS(r0_capture_date, NOW) / 7) * 7)"
      - r0_card_spend: "XSUM('card', 'card_transactions', 'amount', within_months=12, date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch')"
      - r0_held_cap: "K('cap_high') if r0_card_spend >= K('spend_high') else (K('cap_mid') if r0_card_spend >= K('spend_mid') else K('cap_std'))"
      - r0_held_credit: "MN(r0_held_cap, r0_held_rate * r0_held_days)"
      - r0_bonus_applies: "CPARAM('registry', 'loyalty_bonus_applies', registry_id=r0_credit_registry)"
      - r0_member_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - r0_courtesy_pct: "K('courtesy_icon') if (r0_bonus_applies == True and r0_member_tier == 'Finch Circle Icon') else (K('courtesy_plus') if (r0_bonus_applies == True and (r0_member_tier == 'Finch Circle Platinum' or r0_member_tier == 'Finch Circle Diamond')) else K('courtesy_std'))"
      - r0_courtesy: "RND(r0_credit_shortfall * r0_courtesy_pct / 100, 2)"
      - r0_member_months: "MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW) if CFIELD('loyalty', 'enrolled_date', status='active') != None else 0"
      - r0_tenure_courtesy: "K('tenure_long') if r0_member_months >= K('months_long') else (K('tenure_mid') if r0_member_months >= K('months_mid') else K('tenure_std'))"
      - result: "RND(r0_credit_shortfall + r0_held_credit + r0_courtesy + r0_tenure_courtesy, 2)"
    compute_basis:
      r0_credit_used: "The registry credit shortfall is the total of the registry's credit-use entries naming the unit"
      r0_card_captured: "money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card)"
      r0_notes_on_unit: "The registry-credit due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      r0_undeducted: "The registry-credit due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      r0_undeducted_tax: "The registry-credit due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      r0_due: "The registry-credit due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      r0_credit_shortfall: "The registry credit shortfall is the total of the registry's credit-use entries naming the unit, but never more than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid (the registry-credit due amount less that credit), and never below zero."
      r0_credit_registry: "A registrant whose registry holding the spent credit is in its completion period and who holds an active Marlowe & Finch card receives the completion daily held-funds rate"
      r0_registry_status: "A registrant whose registry holding the spent credit is in its completion period and who holds an active Marlowe & Finch card receives the completion daily held-funds rate"
      r0_any_card: "one whose registry holding the spent credit is still active before its completion period and who holds an active Marlowe & Finch card receives the pre-event daily held-funds rate"
      r0_held_rate: "A registrant whose registry holding the spent credit is in its completion period and who holds an active Marlowe & Finch card receives the completion daily held-funds rate; one whose registry holding the spent credit is still active before its completion period and who holds an active Marlowe & Finch card receives the pre-event daily held-funds rate; every other registrant receives the standard daily held-funds rate."
      r0_capture_date: "the held-funds days are the calendar days from the date the unit's payment was last captured to the request date, not counting the capture date, rounded down to a whole number of weeks and multiplied by seven."
      r0_held_days: "For a unit paid by debit card or cash, whose money left the customer on the capture date, the held-funds days are the calendar days from the last capture date to the request date counting both dates; for a unit paid by bank credit card they are those calendar days not counting the capture date; for any other tender they are those calendar days rounded down to a whole number of weeks and multiplied by seven."
      r0_card_spend: "A registrant whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper card-spend threshold has the upper held-funds cap"
      r0_held_cap: "A registrant whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper card-spend threshold has the upper held-funds cap; one whose such purchases reach the middle card-spend threshold but not the upper has the middle held-funds cap; every other registrant has the standard held-funds cap."
      r0_held_credit: "The held-funds credit is the daily held-funds rate times the held-funds days, and it never exceeds the held-funds cap."
      r0_bonus_applies: "A registrant whose registry type carries the Finch Circle registry bonus and whose active Finch Circle membership is at the Icon tier receives the Icon registrant courtesy percent"
      r0_member_tier: "one whose registry type carries that bonus and whose active membership is at the Platinum or Diamond tier receives the premier registrant courtesy percent"
      r0_courtesy_pct: "A registrant whose registry type carries the Finch Circle registry bonus and whose active Finch Circle membership is at the Icon tier receives the Icon registrant courtesy percent; one whose registry type carries that bonus and whose active membership is at the Platinum or Diamond tier receives the premier registrant courtesy percent; every other registrant receives the standard registrant courtesy percent."
      r0_courtesy: "The registrant courtesy is the registry credit shortfall times the registrant courtesy percent, rounded half up to the cent."
      r0_member_months: "A registrant whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long registrant tenure courtesy"
      r0_tenure_courtesy: "A registrant whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long registrant tenure courtesy; one enrolled at least the middle-tenure months but fewer than the long-tenure months receives the middle registrant tenure courtesy; every other registrant receives the standard registrant tenure courtesy."
      result: "The shortfall refund is the registry credit shortfall plus the capped held-funds credit plus the registrant courtesy plus the registrant tenure courtesy, rounded half up to the cent."
    factors:
      - id: rcs_daily_rate
        effect: parameter
        decides: r0_held_rate
        bindings: [r0_registry_status, r0_any_card, r0_held_rate]
        ladder:
          - when: "registry holding the spent credit in its completion period and an active Marlowe & Finch card held"
            value: "K('rate_completion')"
          - when: "registry holding the spent credit still active before its completion period and an active Marlowe & Finch card held"
            value: "K('rate_active')"
          - when: "otherwise"
            value: "K('rate_std')"
        baseline:
          r0_held_rate: "K('rate_std')"
        evidence: [cross_category, history]
        cross_difficulty: registry
      - id: rcs_held_day_count
        effect: method
        decides: r0_held_days
        bindings: [r0_held_days]
        ladder:
          - when: "unit paid by debit card or cash"
            method: "calendar days from the last capture date to the request date counting both dates"
          - when: "unit paid by bank credit card"
            method: "those calendar days not counting the capture date"
          - when: "otherwise"
            method: "those calendar days rounded down to whole weeks and multiplied by seven"
        baseline:
          r0_held_days: "int(DAYS(r0_capture_date, NOW) / 7) * 7"
        evidence: [date, history]
        cross_difficulty: null
      - id: rcs_held_cap
        effect: parameter
        decides: r0_held_cap
        bindings: [r0_card_spend, r0_held_cap]
        ladder:
          - when: "Marlowe & Finch card purchases of the past twelve months at or above the upper card-spend threshold"
            value: "K('cap_high')"
          - when: "such purchases at or above the middle card-spend threshold and below the upper"
            value: "K('cap_mid')"
          - when: "otherwise"
            value: "K('cap_std')"
        baseline:
          r0_held_cap: "K('cap_std')"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: rcs_registrant_courtesy
        effect: parameter
        decides: r0_courtesy_pct
        bindings: [r0_bonus_applies, r0_member_tier, r0_courtesy_pct]
        ladder:
          - when: "registry type carrying the Finch Circle registry bonus and active membership at the Icon tier"
            value: "K('courtesy_icon')"
          - when: "registry type carrying that bonus and active membership at the Platinum or Diamond tier"
            value: "K('courtesy_plus')"
          - when: "otherwise"
            value: "K('courtesy_std')"
        baseline:
          r0_courtesy_pct: "K('courtesy_std')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: rcs_tenure_courtesy
        effect: parameter
        decides: r0_tenure_courtesy
        bindings: [r0_member_months, r0_tenure_courtesy]
        ladder:
          - when: "active Finch Circle membership enrolled at least the long-tenure months ago"
            value: "K('tenure_long')"
          - when: "enrolled at least the middle-tenure months ago but fewer than the long-tenure months"
            value: "K('tenure_mid')"
          - when: "otherwise"
            value: "K('tenure_std')"
        baseline:
          r0_tenure_courtesy: "K('tenure_std')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The registry credit shortfall is the total of the registry's credit-use entries naming the unit, but never more
        than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid
        (the registry-credit due amount less that credit), and never below zero. The registry-credit due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent. The
        held-funds credit is the daily held-funds rate times the held-funds days, and it never exceeds the held-funds cap.
        The registrant courtesy is the registry credit shortfall times the registrant courtesy percent, rounded half up to
        the cent. The shortfall refund is the registry credit shortfall plus the capped held-funds credit plus the
        registrant courtesy plus the registrant tenure courtesy, rounded half up to the cent. The daily held-funds rate is
        the standard daily held-funds rate, the held-funds cap is the standard held-funds cap, the registrant courtesy
        percent is the standard registrant courtesy percent, the registrant tenure courtesy is the standard registrant
        tenure courtesy, and the held-funds days are the calendar days from the date the unit's payment was last captured
        to the request date, not counting the capture date, rounded down to a whole number of weeks and multiplied by
        seven.
      params: [rate_std, cap_std, courtesy_std, tenure_std]
    prerequisite: []
    cross_category:
      - category: registry
        as: history
        reads: [status, loyalty_bonus_applies, registry_events.amount, registry_events.registry_id]
        note: "The registry's credit-use entries give the shortfall and the registry; its status decides the daily rate and its type the courtesy."
      - category: loyalty
        as: branch
        reads: [variant_name, status, enrolled_date, loyalty_note_ledger.note_amount]
        note: "The membership tier joins the registry type in the courtesy percent; the enrollment date decides the tenure courtesy; notes redeemed on the unit lower its taxed price."
      - category: card
        as: history
        reads: [status, card_transactions.amount]
        note: "An active card joins the registry status in the daily rate; the card's Marlowe & Finch purchases of the past year decide the cap."
    inputs:
      history:
        - {table: order_events, aggregate: latest, field: event_date, filters: {event_type: order_payment}}
        - {table: order_events, aggregate: sum, field: amount, filters: {event_type: order_payment}}
        - {category: registry, table: registry_events, aggregate: sum, field: amount, filters: {event_type: registry_credit_use}}
        - {category: card, table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase, merchant_category: marlowe_finch}}
      cross_category: [registry, loyalty, card]
  - id: order_ext_registry_price_protection_claim
    base_policy_refs: [order_price_adjustment_rules]
    overwrite:
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          The adjustment refunds that difference plus the sales tax charged on it (the unit's tax_amount times the
          difference divided by unit_price, rounded half up to the cent) to the original tender
          (price_adjustment_refund_tender), never as a gift card.
        replaced_by: >-
          For a registry price protection claim this policy handles, and only for such a claim, the refund is the
          protected difference, capped, plus the sales tax on it, plus the registrant goodwill amounts, paid to the
          unit's original tender and never as a gift card; every other price-drop adjustment remains under the base rule.
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          The order_msr_price_adjustments_on_unit count is below the class's price_adjustments_per_item_max, and the
          per-unit difference between order_msr_effective_unit_price and the new_unit_price is at least
          price_adjustment_min_difference_usd.
        replaced_by: >-
          For a registry price protection claim this policy handles, and only for such a claim, the unit's earlier
          price-drop adjustments still number fewer than the class's per-unit limit, and the protection difference,
          measured from the protection base price rather than from the latest adjustment entry, is at least the class's
          smallest refundable difference; every other price-drop adjustment remains under the base rule.
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          The unit is in ordered, shipped or completed status.
        replaced_by: >-
          For a registry price protection claim this policy handles, and only for such a claim, the unit is in
          completed status, received by the registrant and not put into return; every other price adjustment keeps the
          base status condition.
    trigger: on_request
    subject: [order_price_adjustment]
    computes: amount
    target_tool: claim_registry_price_protection_38d04d45
    params:
      months_long: 120
      months_mid: 60
      uplift_long: 1.10
      uplift_mid: 1.05
      uplift_std: 1.00
      spend_card_high: 3000.00
      spend_card_mid: 1000.00
      cap_high: 120.00
      cap_mid: 60.00
      cap_std: 30.00
      goodwill_premium_card: 10.00
      goodwill_card: 5.00
      goodwill_no_card: 0.00
      registry_completion: 15.00
      registry_active: 5.00
      registry_std: 0.00
      spend_member_high: 2500.00
      spend_member_mid: 1000.00
      bonus_high: 8.00
      bonus_mid: 4.00
      bonus_std: 0.00
    rule: >-
      A registrant who bought an item that is listed on her own gift registry, and whose registry afterwards records a
      guest gift of the identical item (same item number) at a lower net price within the class's price-adjustment
      window, may claim registry price protection on that unit. The claim is the registrant's own act: she files it in
      person through the price protection claim on her order, with the amount this rule gives, as a price-drop
      adjustment refunded to the unit's original tender, and the new unit price recorded on it is the protection lower
      price. For a registry price protection claim this policy handles, and only for such a claim, the refund is the
      protected difference, capped, plus the sales tax on it, plus the registrant goodwill amounts, paid to the unit's
      original tender and never as a gift card; every other price-drop adjustment remains under the base rule. For a
      registry price protection claim this policy handles, and only for such a claim, the unit's earlier price-drop
      adjustments still number fewer than the class's per-unit limit, and the protection difference, measured from the
      protection base price rather than from the latest adjustment entry, is at least the class's smallest refundable
      difference; every other price-drop adjustment remains under the base rule. For a registry price protection claim
      this policy handles, and only for such a claim, the unit is in completed status, received by the registrant and not
      put into return; every other price adjustment keeps the base status condition. The registry price protection refund
      on a unit is fixed only after the unit's records carry a register-error correction to its shelf ticket price for
      any amount the unit was rung above that ticket. The registry price protection refund is not worked out until the
      unit's records carry a register-error correction recording no new unit price for any registry credit spent on the
      unit and left undeducted. The protection base price is the new unit price of the unit's latest earlier price-drop
      adjustment when it has one; otherwise it is the shelf ticket price when the unit carries a register-error
      correction to that ticket; otherwise it is the unit's selling price. The protection lower price is the net price
      of the latest guest gift of the identical item recorded on the registrant's registry. The protection difference is
      the protection base price less the protection lower price, and never below zero. The store value on the unit is
      the Finch Notes shown applied on the purchase record plus, once the unit's records carry a register-error
      correction recording no new unit price, the registry credit spent on the unit. The protected difference is the
      paid-share difference multiplied by the protection tenure uplift and rounded half up to the cent, and it never
      exceeds the protection cap. The sales tax on the protected difference is the unit's tax amount times the capped protected difference divided by the unit's selling price, rounded half up to the cent. The registry price
      protection refund is the capped protected difference plus its sales tax plus the protection card goodwill plus the
      registry status goodwill plus the protection spend bonus, rounded half up to the cent. The paid-share difference is
      the protection difference less the whole store value, and never below zero; the protection tenure uplift is the
      standard protection tenure uplift, the protection cap is the standard protection cap, the protection card goodwill
      is the standard protection card goodwill, the registry status goodwill is the standard registry status goodwill,
      and the protection spend bonus is the standard protection spend bonus. For a registrant whose active Finch Circle
      membership is at the Platinum, Diamond or Icon tier and whose unit carries store value, the paid-share difference
      is the protection difference times the share of the protection base price not covered by store value (the
      protection base price less the store value, divided by the protection base price); for one whose active membership
      is at the Silver or Gold tier and whose unit carries store value, it is the protection difference less half the
      store value, never below zero; for every other registrant it is the protection difference less the whole store
      value, never below zero. A registrant whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long protection tenure uplift; one enrolled at least the
      middle-tenure months but fewer than the long-tenure months receives the middle protection tenure uplift; every
      other registrant receives the standard protection tenure uplift. A registrant whose Marlowe & Finch purchases
      charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose
      transaction date falls less than twelve whole months before it) reach the upper protection card-spend threshold
      has the upper protection cap; one whose such purchases reach the middle protection card-spend threshold but not
      the upper has the middle protection cap; every other registrant has the standard protection cap. A registrant
      holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard receives the premium protection card
      goodwill; one holding any other active Marlowe & Finch card receives the cardmember protection card goodwill;
      every other registrant receives the standard protection card goodwill. A registrant whose registry recording the guest gift is in its completion period receives the completion registry status goodwill; one whose registry recording the guest gift is still active before its completion period receives the pre-event registry status goodwill; every other registrant receives the standard registry status goodwill. A registrant whose Finch Circle qualifying
      spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less
      than twelve whole months before it) reaches the upper protection spend threshold receives the upper protection
      spend bonus; one whose such spend reaches the middle protection spend threshold but not the upper receives the
      middle protection spend bonus; every other registrant receives the standard protection spend bonus.
    compute:
      - d0_drop_count: "COUNT('order_events', event_type='order_price_adjustment', adjustment_reason='mf_price_drop')"
      - d0_shelf_count: "COUNT('order_events', event_type='order_price_adjustment', adjustment_reason='register_price_error', new_unit_price=F('regular_price'))"
      - d0_base_price: "LATEST('order_events', 'new_unit_price', event_type='order_price_adjustment', adjustment_reason='mf_price_drop') if d0_drop_count > 0 else (F('regular_price') if d0_shelf_count > 0 else F('unit_price'))"
      - d0_lower_price: "XLATEST('registry', 'registry_events', 'amount', date_field='entry_date', event_type='registry_gift_purchase', sku=F('sku'))"
      - d0_difference: "MX(0, d0_base_price - d0_lower_price)"
      - d0_correction_count: "COUNT('order_events', event_type='order_price_adjustment', adjustment_reason='register_price_error', new_unit_price=None)"
      - d0_store_value: "F('finch_notes_applied') + (XSUM('registry', 'registry_events', 'amount', date_field='entry_date', event_type='registry_credit_use', purchase_id=HID) if d0_correction_count > 0 else 0)"
      - d0_member_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - d0_money_difference: "d0_difference * (d0_base_price - d0_store_value) / d0_base_price if ((d0_member_tier == 'Finch Circle Platinum' or d0_member_tier == 'Finch Circle Diamond' or d0_member_tier == 'Finch Circle Icon') and d0_store_value > 0) else (MX(0, d0_difference - d0_store_value / 2) if ((d0_member_tier == 'Finch Circle Silver' or d0_member_tier == 'Finch Circle Gold') and d0_store_value > 0) else MX(0, d0_difference - d0_store_value))"
      - d0_member_months: "MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW) if CFIELD('loyalty', 'enrolled_date', status='active') != None else 0"
      - d0_uplift: "K('uplift_long') if d0_member_months >= K('months_long') else (K('uplift_mid') if d0_member_months >= K('months_mid') else K('uplift_std'))"
      - d0_adjusted: "RND(d0_money_difference * d0_uplift, 2)"
      - d0_card_spend: "XSUM('card', 'card_transactions', 'amount', within_months=12, date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch')"
      - d0_cap: "K('cap_high') if d0_card_spend >= K('spend_card_high') else (K('cap_mid') if d0_card_spend >= K('spend_card_mid') else K('cap_std'))"
      - d0_capped: "MN(d0_cap, d0_adjusted)"
      - d0_drop_tax: "RND(F('tax_amount') * d0_capped / F('unit_price'), 2)"
      - d0_premium_card: "EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite') or EXISTS('card', status='active', variant_name='Marlowe & Finch World Elite Mastercard')"
      - d0_any_card: "EXISTS('card', status='active')"
      - d0_card_goodwill: "K('goodwill_premium_card') if d0_premium_card else (K('goodwill_card') if d0_any_card else K('goodwill_no_card'))"
      - d0_gift_registry: "XLATEST('registry', 'registry_events', 'registry_id', date_field='entry_date', event_type='registry_gift_purchase', sku=F('sku'))"
      - d0_registry_status: "CFIELD('registry', 'status', registry_id=d0_gift_registry)"
      - d0_registry_goodwill: "K('registry_completion') if d0_registry_status == 'completion' else (K('registry_active') if d0_registry_status == 'active' else K('registry_std'))"
      - d0_member_spend: "XSUM('loyalty', 'loyalty_points_ledger', 'qualifying_amount', within_months=12, date_field='entry_date', event_type='loyalty_points_earn', earn_source='purchase_base')"
      - d0_spend_bonus: "K('bonus_high') if d0_member_spend >= K('spend_member_high') else (K('bonus_mid') if d0_member_spend >= K('spend_member_mid') else K('bonus_std'))"
      - result: "RND(d0_capped + d0_drop_tax + d0_card_goodwill + d0_registry_goodwill + d0_spend_bonus, 2)"
    compute_basis:
      d0_drop_count: "The protection base price is the new unit price of the unit's latest earlier price-drop adjustment when it has one"
      d0_shelf_count: "otherwise it is the shelf ticket price when the unit carries a register-error correction to that ticket"
      d0_base_price: "The protection base price is the new unit price of the unit's latest earlier price-drop adjustment when it has one; otherwise it is the shelf ticket price when the unit carries a register-error correction to that ticket; otherwise it is the unit's selling price."
      d0_lower_price: "The protection lower price is the net price of the latest guest gift of the identical item recorded on the registrant's registry."
      d0_difference: "The protection difference is the protection base price less the protection lower price, and never below zero."
      d0_correction_count: "once the unit's records carry a register-error correction recording no new unit price, the registry credit spent on the unit"
      d0_store_value: "The store value on the unit is the Finch Notes shown applied on the purchase record plus, once the unit's records carry a register-error correction recording no new unit price, the registry credit spent on the unit."
      d0_member_tier: "For a registrant whose active Finch Circle membership is at the Platinum, Diamond or Icon tier and whose unit carries store value"
      d0_money_difference: "For a registrant whose active Finch Circle membership is at the Platinum, Diamond or Icon tier and whose unit carries store value, the paid-share difference is the protection difference times the share of the protection base price not covered by store value (the protection base price less the store value, divided by the protection base price); for one whose active membership is at the Silver or Gold tier and whose unit carries store value, it is the protection difference less half the store value, never below zero; for every other registrant it is the protection difference less the whole store value, never below zero."
      d0_member_months: "A registrant whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long protection tenure uplift"
      d0_uplift: "A registrant whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long protection tenure uplift; one enrolled at least the middle-tenure months but fewer than the long-tenure months receives the middle protection tenure uplift; every other registrant receives the standard protection tenure uplift."
      d0_adjusted: "The protected difference is the paid-share difference multiplied by the protection tenure uplift and rounded half up to the cent, and it never exceeds the protection cap."
      d0_card_spend: "A registrant whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper protection card-spend threshold has the upper protection cap"
      d0_cap: "A registrant whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper protection card-spend threshold has the upper protection cap; one whose such purchases reach the middle protection card-spend threshold but not the upper has the middle protection cap; every other registrant has the standard protection cap."
      d0_capped: "The protected difference is the paid-share difference multiplied by the protection tenure uplift and rounded half up to the cent, and it never exceeds the protection cap."
      d0_drop_tax: "The sales tax on the protected difference is the unit's tax amount times the capped protected difference divided by the unit's selling price, rounded half up to the cent."
      d0_premium_card: "A registrant holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard receives the premium protection card goodwill"
      d0_any_card: "one holding any other active Marlowe & Finch card receives the cardmember protection card goodwill"
      d0_card_goodwill: "A registrant holding an active Marlowe & Finch Store Card Elite or World Elite Mastercard receives the premium protection card goodwill; one holding any other active Marlowe & Finch card receives the cardmember protection card goodwill; every other registrant receives the standard protection card goodwill."
      d0_registry_status: "A registrant whose registry recording the guest gift is in its completion period receives the completion registry status goodwill"
      d0_gift_registry: "A registrant whose registry recording the guest gift is in its completion period receives the completion registry status goodwill"
      d0_registry_goodwill: "A registrant whose registry recording the guest gift is in its completion period receives the completion registry status goodwill; one whose registry recording the guest gift is still active before its completion period receives the pre-event registry status goodwill; every other registrant receives the standard registry status goodwill."
      d0_member_spend: "A registrant whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper protection spend threshold receives the upper protection spend bonus"
      d0_spend_bonus: "A registrant whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper protection spend threshold receives the upper protection spend bonus; one whose such spend reaches the middle protection spend threshold but not the upper receives the middle protection spend bonus; every other registrant receives the standard protection spend bonus."
      result: "The registry price protection refund is the capped protected difference plus its sales tax plus the protection card goodwill plus the registry status goodwill plus the protection spend bonus, rounded half up to the cent."
    factors:
      - id: rpp_paid_share_method
        effect: method
        decides: d0_money_difference
        bindings: [d0_member_tier, d0_money_difference]
        ladder:
          - when: "active Finch Circle membership at the Platinum, Diamond or Icon tier and store value on the unit"
            method: "the protection difference times the share of the protection base price not covered by store value"
          - when: "active membership at the Silver or Gold tier and store value on the unit"
            method: "the protection difference less half the store value, never below zero"
          - when: "otherwise"
            method: "the protection difference less the whole store value, never below zero"
        baseline:
          d0_money_difference: "MX(0, d0_difference - d0_store_value)"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: rpp_tenure_uplift
        effect: parameter
        decides: d0_uplift
        bindings: [d0_member_months, d0_uplift]
        ladder:
          - when: "Finch Circle membership enrolled at least the long-tenure months ago"
            value: "K('uplift_long')"
          - when: "enrolled at least the middle-tenure months ago but fewer than the long-tenure months"
            value: "K('uplift_mid')"
          - when: "otherwise"
            value: "K('uplift_std')"
        baseline:
          d0_uplift: "K('uplift_std')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: rpp_card_spend_cap
        effect: parameter
        decides: d0_cap
        bindings: [d0_card_spend, d0_cap]
        ladder:
          - when: "Marlowe & Finch card purchases of the past twelve months at or above the upper protection card-spend threshold"
            value: "K('cap_high')"
          - when: "such purchases at or above the middle protection card-spend threshold and below the upper"
            value: "K('cap_mid')"
          - when: "otherwise"
            value: "K('cap_std')"
        baseline:
          d0_cap: "K('cap_std')"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: rpp_card_goodwill
        effect: parameter
        decides: d0_card_goodwill
        bindings: [d0_premium_card, d0_any_card, d0_card_goodwill]
        ladder:
          - when: "an active Marlowe & Finch Store Card Elite or World Elite Mastercard"
            value: "K('goodwill_premium_card')"
          - when: "any other active Marlowe & Finch card"
            value: "K('goodwill_card')"
          - when: "otherwise"
            value: "K('goodwill_no_card')"
        baseline:
          d0_card_goodwill: "K('goodwill_no_card')"
        evidence: [cross_category]
        cross_difficulty: card
      - id: rpp_registry_status_goodwill
        effect: parameter
        decides: d0_registry_goodwill
        bindings: [d0_gift_registry, d0_registry_status, d0_registry_goodwill]
        ladder:
          - when: "the registry recording the guest gift in its completion period"
            value: "K('registry_completion')"
          - when: "the registry recording the guest gift still active before its completion period"
            value: "K('registry_active')"
          - when: "otherwise"
            value: "K('registry_std')"
        baseline:
          d0_registry_goodwill: "K('registry_std')"
        evidence: [cross_category, history]
        cross_difficulty: registry
      - id: rpp_member_spend_bonus
        effect: parameter
        decides: d0_spend_bonus
        bindings: [d0_member_spend, d0_spend_bonus]
        ladder:
          - when: "Finch Circle qualifying spend of the past twelve months at or above the upper protection spend threshold"
            value: "K('bonus_high')"
          - when: "that spend at or above the middle protection spend threshold and below the upper"
            value: "K('bonus_mid')"
          - when: "otherwise"
            value: "K('bonus_std')"
        baseline:
          d0_spend_bonus: "K('bonus_std')"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The protection base price is the new unit price of the unit's latest earlier price-drop adjustment when it has
        one; otherwise it is the shelf ticket price when the unit carries a register-error correction to that ticket;
        otherwise it is the unit's selling price. The protection lower price is the net price of the latest guest gift of
        the identical item recorded on the registrant's registry. The protection difference is the protection base price
        less the protection lower price, and never below zero. The store value on the unit is the Finch Notes shown
        applied on the purchase record plus, once the unit's records carry a register-error correction recording no new
        unit price, the registry credit spent on the unit. The protected difference is the paid-share difference
        multiplied by the protection tenure uplift and rounded half up to the cent, and it never exceeds the protection
        cap. The sales tax on the protected difference is the unit's tax amount times the capped protected difference divided by the unit's selling price, rounded half up to the cent. The registry price protection refund is the
        capped protected difference plus its sales tax plus the protection card goodwill plus the registry status
        goodwill plus the protection spend bonus, rounded half up to the cent. The paid-share difference is the protection
        difference less the whole store value, and never below zero; the protection tenure uplift is the standard
        protection tenure uplift, the protection cap is the standard protection cap, the protection card goodwill is the
        standard protection card goodwill, the registry status goodwill is the standard registry status goodwill, and the
        protection spend bonus is the standard protection spend bonus.
      params: [uplift_std, cap_std, goodwill_no_card, registry_std, bonus_std]
    prerequisite:
      - problem: order_ext_shelf_price_correction
        kind: value_input
        gate: d0_base_price
        form: state
        policy_source: >-
          The registry price protection refund on a unit is fixed only after the unit's records carry a register-error
          correction to its shelf ticket price for any amount the unit was rung above that ticket.
        condition: >-
          Whenever the unit's unit_price exceeds its regular_price, its order_events carry an order_price_adjustment with adjustment_reason register_price_error whose new_unit_price equals the regular_price.
        resolved_by: correct_shelf_price_8a80c6f7
        effect: >-
          The shelf-price correction records the shelf ticket price as the new unit price on its entry, so the protection base price
          moves from the selling price as rung to the shelf ticket price and the protection difference shrinks by the
          shelf overcharge.
      - problem: order_ext_registry_credit_shortfall_refund
        kind: value_input
        gate: d0_store_value
        form: state
        policy_source: >-
          The registry price protection refund is not worked out until the unit's records carry a register-error
          correction recording no new unit price for any registry credit spent on the unit and left undeducted.
        condition: >-
          Whenever the registry's ledger carries registry_credit_use entries naming the unit and the unit's order_payment captures exceed its unit_price plus tax_amount, less its finch_notes_applied and less that credit (the credit left undeducted), the unit's order_events carry an order_price_adjustment with adjustment_reason register_price_error and no new_unit_price.
        resolved_by: refund_registry_credit_shortfall_17a5cd98
        effect: >-
          Once the registry credit shortfall correction stands, the registry credit spent on the unit counts as store
          value, and the paid-share difference is taken on the share of the base price not covered by it.
    cross_category:
      - category: registry
        as: history
        reads: [status, registry_events.amount, registry_events.sku]
        note: "Guest gift entries give the protection lower price; credit-use entries give store value; status and item entries decide the registry status goodwill."
      - category: loyalty
        as: branch
        reads: [variant_name, status, enrolled_date, loyalty_points_ledger.qualifying_amount]
        note: "The tier decides the paid-share method, enrollment the uplift, qualifying spend the spend bonus."
      - category: card
        as: history
        reads: [variant_name, status, card_transactions.amount]
        note: "Card product decides the card goodwill; the card's Marlowe & Finch purchases of the past year decide the cap."
    inputs:
      history:
        - {table: order_events, aggregate: count, field: order_event_id, filters: {event_type: order_price_adjustment}}
        - {category: registry, table: registry_events, aggregate: latest, field: amount, filters: {event_type: registry_gift_purchase}}
        - {category: registry, table: registry_events, aggregate: sum, field: amount, filters: {event_type: registry_credit_use}}
        - {category: card, table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase, merchant_category: marlowe_finch}}
        - {category: loyalty, table: loyalty_points_ledger, aggregate: sum, field: qualifying_amount, within_months: 12, filters: {event_type: loyalty_points_earn, earn_source: purchase_base}}
      cross_category: [registry, loyalty, card]
  - id: order_ext_note_shortfall_refund
    base_policy_refs: [order_price_adjustment_rules]
    overwrite:
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          A register_price_error adjustment (the unit was charged above its ticketed or advertised price on the purchase
          date) is made at any time while the unit is not returned, refunds the overcharge, and counts toward no limit.
        replaced_by: >-
          For a Finch Note recorded as redeemed on a unit but left undeducted that this policy handles, and only for such a
          note, the register-error adjustment is still made at any time while the unit is not returned and still counts
          toward no limit, and it refunds the card money captured for the part the note had paid together with the note service credit and courtesies; every other register error, including a unit rung above its shelf ticket; registry credit recorded as spent but left undeducted; sales tax charged on the part a Finch Note paid; gift card or Bonus Card value recorded as redeemed but left undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it.
    trigger: on_request
    subject: [order_price_adjustment]
    computes: amount
    target_tool: refund_note_shortfall_1f084e1e
    params:
      months_veteran: 60
      rate_veteran: 0.50
      rate_linked: 0.25
      rate_std: 0.10
      spend_high: 2000.00
      spend_mid: 750.00
      cap_high: 12.00
      cap_mid: 6.00
      cap_std: 3.00
      lapse_card: 10.00
      lapse_no_card: 5.00
      lapse_std: 0.00
      courtesy_top: 10.00
      courtesy_mid: 5.00
      courtesy_std: 0.00
    rule: >-
      When the Finch Note ledger shows a note redeemed on a purchase record while the purchase record shows no Finch Notes
      applied and the unit's card was captured as if no note had been used, the card was charged for the part the note
      had already paid. For a Finch Note recorded as redeemed on a unit but left undeducted that this policy handles, and
      only for such a note, the register-error adjustment is still made at any time while the unit is not returned and
      still counts toward no limit, and it refunds the card money captured for the part the note had paid together with the note service credit and courtesies; every other register error, including a unit rung above its shelf ticket; registry credit recorded as spent but left undeducted; sales tax charged on the part a Finch Note paid; gift card or Bonus Card value recorded as redeemed but left undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it. The note itself is not
      refunded, reinstated or paid out in money; only the card money captured for the part it had paid is returned, to the
      unit's original tender, and the correction records no new unit price. The note shortfall is the total value of the
      notes the ledger shows redeemed on the unit less the Finch Notes the purchase record shows applied, but never more
      than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid
      (the note due amount), and never below zero. The note due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent.   The note service credit is the daily note service rate times the note
      service days, and it never exceeds the note service cap. The note shortfall refund is the note shortfall plus the capped note service credit plus the lapsed-note goodwill plus the member note courtesy, rounded
      half up to the cent. The daily note service rate is the standard daily note service rate, the note service cap is
      the standard note service cap, the lapsed-note goodwill is the standard lapsed-note goodwill, the member note
      courtesy is the standard member note courtesy, and the note service days are the calendar days from the purchase
      date to the request date, not counting the purchase date, rounded down to a whole number of weeks and multiplied by
      seven. A member whose Finch Circle number was captured on the transaction and whose active membership was enrolled
      at least the veteran months before the request date (whole months) receives the veteran daily note service rate;
      one whose number was captured on the transaction and whose active membership was enrolled fewer than the veteran
      months before it receives the linked daily note service rate; every other customer receives the standard daily
      note service rate. For a unit paid by debit card or cash, whose money left the customer on the purchase date, the
      note service days are the calendar days from the purchase date to the request date counting both dates; for a unit
      paid by bank credit card they are those calendar days not counting the purchase date; for any other tender they are
      those calendar days rounded down to a whole number of weeks and multiplied by seven. A customer whose Marlowe &
      Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases
      whose transaction date falls less than twelve whole months before it) reach the upper note card-spend threshold has
      the upper note service cap; one whose such purchases reach the middle note card-spend threshold but not the upper
      has the middle note service cap; every other customer has the standard note service cap. A customer whose redeemed
      note had passed its expiry date by the request date and who holds an active Marlowe & Finch card receives the card
      lapsed-note goodwill; one whose redeemed note had passed its expiry date and who holds no active Marlowe & Finch
      card receives the no-card lapsed-note goodwill; every other customer receives the standard lapsed-note goodwill. A
      member whose active Finch Circle membership is at the Diamond or Icon tier receives the top member note courtesy;
      one whose active membership is at the Gold or Platinum tier receives the middle member note courtesy; every other
      customer receives the standard member note courtesy.
    compute:
      - n1_note_value: "XSUM('loyalty', 'loyalty_note_ledger', 'note_amount', date_field='txn_date', event_type='loyalty_note_redeem', purchase_id=HID)"
      - n1_card_captured: "SUM('order_events', 'amount', event_type='order_payment') - SUM('order_events', 'amount', event_type='order_payment', tender_type='gift_card')"
      - n1_notes_on_unit: "MX(F('finch_notes_applied'), n1_note_value)"
      - n1_undeducted: "n1_notes_on_unit - F('finch_notes_applied')"
      - n1_undeducted_tax: "RND(F('tax_amount') * n1_undeducted / F('unit_price'), 2)"
      - n1_due: "F('unit_price') + F('tax_amount') - n1_notes_on_unit - n1_undeducted_tax"
      - n1_shortfall: "MX(0, MN(n1_note_value - F('finch_notes_applied'), n1_card_captured - n1_due))"
      - n1_member_months: "MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW) if CFIELD('loyalty', 'enrolled_date', status='active') != None else 0"
      - n1_rate: "K('rate_veteran') if (F('membership_linked') == True and n1_member_months >= K('months_veteran')) else (K('rate_linked') if (F('membership_linked') == True and EXISTS('loyalty', status='active') and n1_member_months < K('months_veteran')) else K('rate_std'))"
      - n1_service_days: "DAYS(F('purchase_date'), NOW) + 1 if (F('tender_type') == 'debit' or F('tender_type') == 'cash') else (DAYS(F('purchase_date'), NOW) if F('tender_type') == 'bank_card' else int(DAYS(F('purchase_date'), NOW) / 7) * 7)"
      - n1_card_spend: "XSUM('card', 'card_transactions', 'amount', within_months=12, date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch')"
      - n1_cap: "K('cap_high') if n1_card_spend >= K('spend_high') else (K('cap_mid') if n1_card_spend >= K('spend_mid') else K('cap_std'))"
      - n1_service_credit: "MN(n1_cap, n1_rate * n1_service_days)"
      - n1_note_expiry: "XLATEST('loyalty', 'loyalty_note_ledger', 'expiry_date', date_field='issue_date', event_type='loyalty_note_issue', note_code=XLATEST('loyalty', 'loyalty_note_ledger', 'note_code', date_field='txn_date', event_type='loyalty_note_redeem', purchase_id=HID))"
      - n1_active_card: "EXISTS('card', status='active')"
      - n1_lapse_goodwill: "K('lapse_card') if ((n1_note_expiry != None and n1_note_expiry < NOW) and n1_active_card) else (K('lapse_no_card') if ((n1_note_expiry != None and n1_note_expiry < NOW) and not n1_active_card) else K('lapse_std'))"
      - n1_member_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - n1_member_courtesy: "K('courtesy_top') if (n1_member_tier == 'Finch Circle Diamond' or n1_member_tier == 'Finch Circle Icon') else (K('courtesy_mid') if (n1_member_tier == 'Finch Circle Gold' or n1_member_tier == 'Finch Circle Platinum') else K('courtesy_std'))"
      - result: "RND(n1_shortfall + n1_service_credit + n1_lapse_goodwill + n1_member_courtesy, 2)"
    compute_basis:
      n1_note_value: "The note shortfall is the total value of the notes the ledger shows redeemed on the unit less the Finch Notes the purchase record shows applied"
      n1_card_captured: "money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card)"
      n1_notes_on_unit: "The note due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      n1_undeducted: "The note due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      n1_undeducted_tax: "The note due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      n1_due: "The note due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      n1_shortfall: "The note shortfall is the total value of the notes the ledger shows redeemed on the unit less the Finch Notes the purchase record shows applied, but never more than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid (the note due amount), and never below zero."
      n1_member_months: "A member whose Finch Circle number was captured on the transaction and whose active membership was enrolled at least the veteran months before the request date (whole months) receives the veteran daily note service rate"
      n1_rate: "A member whose Finch Circle number was captured on the transaction and whose active membership was enrolled at least the veteran months before the request date (whole months) receives the veteran daily note service rate; one whose number was captured on the transaction and whose active membership was enrolled fewer than the veteran months before it receives the linked daily note service rate; every other customer receives the standard daily note service rate."
      n1_service_days: "For a unit paid by debit card or cash, whose money left the customer on the purchase date, the note service days are the calendar days from the purchase date to the request date counting both dates; for a unit paid by bank credit card they are those calendar days not counting the purchase date; for any other tender they are those calendar days rounded down to a whole number of weeks and multiplied by seven."
      n1_card_spend: "A customer whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper note card-spend threshold has the upper note service cap"
      n1_cap: "A customer whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper note card-spend threshold has the upper note service cap; one whose such purchases reach the middle note card-spend threshold but not the upper has the middle note service cap; every other customer has the standard note service cap."
      n1_service_credit: "The note service credit is the daily note service rate times the note service days, and it never exceeds the note service cap."
      n1_note_expiry: "A customer whose redeemed note had passed its expiry date by the request date and who holds an active Marlowe & Finch card receives the card lapsed-note goodwill"
      n1_active_card: "one whose redeemed note had passed its expiry date and who holds no active Marlowe & Finch card receives the no-card lapsed-note goodwill"
      n1_lapse_goodwill: "A customer whose redeemed note had passed its expiry date by the request date and who holds an active Marlowe & Finch card receives the card lapsed-note goodwill; one whose redeemed note had passed its expiry date and who holds no active Marlowe & Finch card receives the no-card lapsed-note goodwill; every other customer receives the standard lapsed-note goodwill."
      n1_member_tier: "A member whose active Finch Circle membership is at the Diamond or Icon tier receives the top member note courtesy"
      n1_member_courtesy: "A member whose active Finch Circle membership is at the Diamond or Icon tier receives the top member note courtesy; one whose active membership is at the Gold or Platinum tier receives the middle member note courtesy; every other customer receives the standard member note courtesy."
      result: "The note shortfall refund is the note shortfall plus the capped note service credit plus the lapsed-note goodwill plus the member note courtesy, rounded half up to the cent."
    factors:
      - id: nsr_service_rate
        effect: parameter
        decides: n1_rate
        bindings: [n1_member_months, n1_rate]
        ladder:
          - when: "Finch Circle number captured on the transaction and active membership enrolled at least the veteran months ago"
            value: "K('rate_veteran')"
          - when: "Finch Circle number captured on the transaction and active membership enrolled fewer than the veteran months ago"
            value: "K('rate_linked')"
          - when: "otherwise"
            value: "K('rate_std')"
        baseline:
          n1_rate: "K('rate_std')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: nsr_service_day_count
        effect: method
        decides: n1_service_days
        bindings: [n1_service_days]
        ladder:
          - when: "unit paid by debit card or cash"
            method: "calendar days from the purchase date to the request date counting both dates"
          - when: "unit paid by bank credit card"
            method: "those calendar days not counting the purchase date"
          - when: "otherwise"
            method: "those calendar days rounded down to whole weeks and multiplied by seven"
        baseline:
          n1_service_days: "int(DAYS(F('purchase_date'), NOW) / 7) * 7"
        evidence: [date]
        cross_difficulty: null
      - id: nsr_service_cap
        effect: parameter
        decides: n1_cap
        bindings: [n1_card_spend, n1_cap]
        ladder:
          - when: "Marlowe & Finch card purchases of the past twelve months at or above the upper note card-spend threshold"
            value: "K('cap_high')"
          - when: "such purchases at or above the middle note card-spend threshold and below the upper"
            value: "K('cap_mid')"
          - when: "otherwise"
            value: "K('cap_std')"
        baseline:
          n1_cap: "K('cap_std')"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: nsr_lapsed_goodwill
        effect: parameter
        decides: n1_lapse_goodwill
