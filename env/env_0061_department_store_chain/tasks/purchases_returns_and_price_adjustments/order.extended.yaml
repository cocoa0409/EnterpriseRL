        ladder:
          - when: "the redeemed note past its expiry date by the request date and an active Marlowe & Finch card held"
            value: "K('lapse_card')"
          - when: "the redeemed note past its expiry date and no active Marlowe & Finch card held"
            value: "K('lapse_no_card')"
          - when: "otherwise"
            value: "K('lapse_std')"
        baseline:
          n1_lapse_goodwill: "K('lapse_std')"
        evidence: [cross_category, history, date]
        cross_difficulty: loyalty
      - id: nsr_member_courtesy
        effect: parameter
        decides: n1_member_courtesy
        bindings: [n1_member_tier, n1_member_courtesy]
        ladder:
          - when: "active Finch Circle membership at the Diamond or Icon tier"
            value: "K('courtesy_top')"
          - when: "active membership at the Gold or Platinum tier"
            value: "K('courtesy_mid')"
          - when: "otherwise"
            value: "K('courtesy_std')"
        baseline:
          n1_member_courtesy: "K('courtesy_std')"
        evidence: [cross_category]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The note shortfall is the total value of the notes the ledger shows redeemed on the unit less the Finch Notes the
        purchase record shows applied, but never more than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid (the note due amount), and never below zero. The note due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent.   The note service credit
        is the daily note service rate times the note service days, and it never exceeds the note service cap. The note shortfall refund is the note shortfall plus the capped note service credit plus the lapsed-note
        goodwill plus the member note courtesy, rounded half up to the cent. The daily note service rate is the standard
        daily note service rate, the note service cap is the standard note service cap, the lapsed-note goodwill is the
        standard lapsed-note goodwill, the member note courtesy is the standard member note courtesy, and the note service
        days are the calendar days from the purchase date to the request date, not counting the purchase date, rounded
        down to a whole number of weeks and multiplied by seven.
      params: [rate_std, cap_std, lapse_std, courtesy_std]
    prerequisite: []
    cross_category:
      - category: loyalty
        as: history
        reads: [variant_name, status, enrolled_date, loyalty_note_ledger.note_amount, loyalty_note_ledger.expiry_date, loyalty_note_ledger.note_code]
        note: "The note ledger gives the redeemed note and its expiry; the tier decides the member courtesy and enrollment the rate."
      - category: card
        as: history
        reads: [status, card_transactions.amount]
        note: "An active card decides the lapsed-note goodwill; the card's Marlowe & Finch purchases of the past year decide the cap."
    inputs:
      history:
        - {table: order_events, aggregate: sum, field: amount, filters: {event_type: order_payment}}
        - {category: loyalty, table: loyalty_note_ledger, aggregate: sum, field: note_amount, filters: {event_type: loyalty_note_redeem}}
        - {category: card, table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase, merchant_category: marlowe_finch}}
      cross_category: [loyalty, card]
  - id: order_ext_note_tax_refund
    base_policy_refs: [order_price_adjustment_rules]
    overwrite:
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          A register_price_error adjustment (the unit was charged above its ticketed or advertised price on the purchase
          date) is made at any time while the unit is not returned, refunds the overcharge, and counts toward no limit.
        replaced_by: >-
          For sales tax charged on the part a Finch Note paid, where the note was recorded as redeemed on a unit but
          left undeducted, that this policy handles, and only for such tax, the register-error adjustment is still
          made at any time while the unit is not returned and still counts toward no limit, and it refunds that tax
          together with the tax service credit and goodwill; every other register error, including a unit rung above
          its shelf ticket; registry credit recorded as spent but left undeducted; the card money taken for a Finch
          Note recorded as redeemed but left undeducted; gift card or Bonus Card value recorded as redeemed but left
          undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it.
    trigger: on_request
    subject: [order_price_adjustment]
    computes: amount
    target_tool: refund_note_tax_482f19cd
    params:
      rate_mastercard: 0.10
      rate_store_card: 0.05
      rate_std: 0.02
      card_spend_high: 1500.00
      card_spend_mid: 500.00
      cap_high: 1.00
      cap_mid: 0.50
      cap_std: 0.25
      member_spend_high: 2000.00
      member_spend_mid: 1000.00
      goodwill_high: 1.00
      goodwill_mid: 0.50
      goodwill_std: 0.00
    rule: >-
      When a note recorded as redeemed on a purchase record was left undeducted at the register, the unit was charged sales tax on the part of its price the note had already paid; with the correction this policy refunds the tax recorded on that part, apportioned the way price adjustments apportion tax. For sales tax charged on the part a Finch Note paid, where the note was recorded as redeemed
      on a unit but left undeducted, that this policy handles, and only for such tax, the register-error adjustment is
      still made at any time while the unit is not returned and still counts toward no limit, and it refunds that tax
      together with the tax service credit and goodwill; every other register error, including a unit rung above its
      shelf ticket; registry credit recorded as spent but left undeducted; the card money taken for a Finch Note
      recorded as redeemed but left undeducted; gift card or Bonus Card value recorded as redeemed but left
      undeducted; and a second capture of the same tender, stays under the base rule or the rule written for it. The
      refund goes to the unit's original tender and the correction records no new unit price; the note itself and the
      money taken for its part are not dealt with here. The undeducted note value is the larger of the Finch Notes applied on the unit's purchase record and the notes the ledger shows redeemed on it, less the Finch Notes applied.
      The note tax refunded is the tax recorded on the unit times the undeducted note value divided by the unit's selling price, rounded half up to the cent. The tax service credit is the daily tax service rate times the tax service
      days, and it never exceeds the tax service cap. The note tax refund is the note tax refunded plus the capped tax
      service credit plus the tax member spend goodwill, rounded half up to the cent. The daily tax service rate is
      the standard daily tax service rate, the tax service cap is the standard tax service cap, the tax member spend
      goodwill is the standard tax member spend goodwill, and the tax service days are the calendar days from the
      purchase date to the request date, not counting the purchase date, rounded down to a whole number of weeks and
      multiplied by seven. A customer holding an active Marlowe & Finch Mastercard, Platinum Mastercard or World Elite
      Mastercard whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier receives the
      Mastercard daily tax service rate; one holding an active Marlowe & Finch Store Card, Store Card Plus or Store
      Card Elite and no active Marlowe & Finch Mastercard whose active membership is at the Gold, Platinum, Diamond or
      Icon tier receives the store-card daily tax service rate; every other customer receives the standard daily tax
      service rate. For a unit paid by debit card or cash, whose money left the customer on the purchase date, the tax
      service days are the calendar days from the purchase date to the request date counting both dates; for a unit
      paid by bank credit card they are those calendar days not counting the purchase date; for any other tender they
      are those calendar days rounded down to a whole number of weeks and multiplied by seven. A customer whose
      Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request
      date (purchases whose transaction date falls less than twelve whole months before it) reach the upper tax
      card-spend threshold has the upper tax service cap; one whose such purchases reach the middle tax card-spend
      threshold but not the upper has the middle tax service cap; every other customer has the standard tax service
      cap. A member whose Finch Circle qualifying spend posted in the twelve calendar months before the request date
      (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper tax
      member spend threshold receives the upper tax member spend goodwill; one whose such spend reaches the middle tax
      member spend threshold but not the upper receives the middle tax member spend goodwill; every other customer
      receives the standard tax member spend goodwill.
    compute:
      - x1_undeducted: "MX(F('finch_notes_applied'), XSUM('loyalty', 'loyalty_note_ledger', 'note_amount', date_field='txn_date', event_type='loyalty_note_redeem', purchase_id=HID)) - F('finch_notes_applied')"
      - x1_note_tax: "RND(F('tax_amount') * x1_undeducted / F('unit_price'), 2)"
      - x1_mastercard: "EXISTS('card', status='active', variant_name='Marlowe & Finch Mastercard') or EXISTS('card', status='active', variant_name='Marlowe & Finch Platinum Mastercard') or EXISTS('card', status='active', variant_name='Marlowe & Finch World Elite Mastercard')"
      - x1_store_card: "EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card') or EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Plus') or EXISTS('card', status='active', variant_name='Marlowe & Finch Store Card Elite')"
      - x1_member_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - x1_rate: "K('rate_mastercard') if (x1_mastercard and (x1_member_tier == 'Finch Circle Gold' or x1_member_tier == 'Finch Circle Platinum' or x1_member_tier == 'Finch Circle Diamond' or x1_member_tier == 'Finch Circle Icon')) else (K('rate_store_card') if ((x1_store_card and not x1_mastercard) and (x1_member_tier == 'Finch Circle Gold' or x1_member_tier == 'Finch Circle Platinum' or x1_member_tier == 'Finch Circle Diamond' or x1_member_tier == 'Finch Circle Icon')) else K('rate_std'))"
      - x1_service_days: "DAYS(F('purchase_date'), NOW) + 1 if (F('tender_type') == 'debit' or F('tender_type') == 'cash') else (DAYS(F('purchase_date'), NOW) if F('tender_type') == 'bank_card' else int(DAYS(F('purchase_date'), NOW) / 7) * 7)"
      - x1_card_spend: "XSUM('card', 'card_transactions', 'amount', within_months=12, date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch')"
      - x1_cap: "K('cap_high') if x1_card_spend >= K('card_spend_high') else (K('cap_mid') if x1_card_spend >= K('card_spend_mid') else K('cap_std'))"
      - x1_service_credit: "MN(x1_cap, x1_rate * x1_service_days)"
      - x1_member_spend: "XSUM('loyalty', 'loyalty_points_ledger', 'qualifying_amount', within_months=12, date_field='entry_date', event_type='loyalty_points_earn', earn_source='purchase_base')"
      - x1_spend_goodwill: "K('goodwill_high') if x1_member_spend >= K('member_spend_high') else (K('goodwill_mid') if x1_member_spend >= K('member_spend_mid') else K('goodwill_std'))"
      - result: "RND(x1_note_tax + x1_service_credit + x1_spend_goodwill, 2)"
    compute_basis:
      x1_undeducted: "The undeducted note value is the larger of the Finch Notes applied on the unit's purchase record and the notes the ledger shows redeemed on it, less the Finch Notes applied."
      x1_note_tax: "The note tax refunded is the tax recorded on the unit times the undeducted note value divided by the unit's selling price, rounded half up to the cent."
      x1_mastercard: "A customer holding an active Marlowe & Finch Mastercard, Platinum Mastercard or World Elite Mastercard whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier receives the Mastercard daily tax service rate"
      x1_store_card: "one holding an active Marlowe & Finch Store Card, Store Card Plus or Store Card Elite and no active Marlowe & Finch Mastercard whose active membership is at the Gold, Platinum, Diamond or Icon tier receives the store-card daily tax service rate"
      x1_member_tier: "A customer holding an active Marlowe & Finch Mastercard, Platinum Mastercard or World Elite Mastercard whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier receives the Mastercard daily tax service rate"
      x1_rate: "A customer holding an active Marlowe & Finch Mastercard, Platinum Mastercard or World Elite Mastercard whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier receives the Mastercard daily tax service rate; one holding an active Marlowe & Finch Store Card, Store Card Plus or Store Card Elite and no active Marlowe & Finch Mastercard whose active membership is at the Gold, Platinum, Diamond or Icon tier receives the store-card daily tax service rate; every other customer receives the standard daily tax service rate."
      x1_service_days: "For a unit paid by debit card or cash, whose money left the customer on the purchase date, the tax service days are the calendar days from the purchase date to the request date counting both dates; for a unit paid by bank credit card they are those calendar days not counting the purchase date; for any other tender they are those calendar days rounded down to a whole number of weeks and multiplied by seven."
      x1_card_spend: "A customer whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper tax card-spend threshold has the upper tax service cap"
      x1_cap: "A customer whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper tax card-spend threshold has the upper tax service cap; one whose such purchases reach the middle tax card-spend threshold but not the upper has the middle tax service cap; every other customer has the standard tax service cap."
      x1_service_credit: "The tax service credit is the daily tax service rate times the tax service days, and it never exceeds the tax service cap."
      x1_member_spend: "A member whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper tax member spend threshold receives the upper tax member spend goodwill"
      x1_spend_goodwill: "A member whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper tax member spend threshold receives the upper tax member spend goodwill; one whose such spend reaches the middle tax member spend threshold but not the upper receives the middle tax member spend goodwill; every other customer receives the standard tax member spend goodwill."
      result: "The note tax refund is the note tax refunded plus the capped tax service credit plus the tax member spend goodwill, rounded half up to the cent."
    factors:
      - id: ntr_service_rate
        effect: parameter
        decides: x1_rate
        bindings: [x1_mastercard, x1_store_card, x1_member_tier, x1_rate]
        ladder:
          - when: "an active Marlowe & Finch Mastercard, Platinum Mastercard or World Elite Mastercard and active Finch Circle membership at the Gold, Platinum, Diamond or Icon tier"
            value: "K('rate_mastercard')"
          - when: "an active Marlowe & Finch Store Card, Store Card Plus or Store Card Elite, no active Marlowe & Finch Mastercard, and active membership at the Gold, Platinum, Diamond or Icon tier"
            value: "K('rate_store_card')"
          - when: "otherwise"
            value: "K('rate_std')"
        baseline:
          x1_rate: "K('rate_std')"
        evidence: [cross_category]
        cross_difficulty: card
      - id: ntr_service_day_count
        effect: method
        decides: x1_service_days
        bindings: [x1_service_days]
        ladder:
          - when: "unit paid by debit card or cash"
            method: "calendar days from the purchase date to the request date counting both dates"
          - when: "unit paid by bank credit card"
            method: "those calendar days not counting the purchase date"
          - when: "otherwise"
            method: "those calendar days rounded down to whole weeks and multiplied by seven"
        baseline:
          x1_service_days: "int(DAYS(F('purchase_date'), NOW) / 7) * 7"
        evidence: [date]
        cross_difficulty: null
      - id: ntr_service_cap
        effect: parameter
        decides: x1_cap
        bindings: [x1_card_spend, x1_cap]
        ladder:
          - when: "Marlowe & Finch card purchases of the past twelve months at or above the upper tax card-spend threshold"
            value: "K('cap_high')"
          - when: "such purchases at or above the middle tax card-spend threshold and below the upper"
            value: "K('cap_mid')"
          - when: "otherwise"
            value: "K('cap_std')"
        baseline:
          x1_cap: "K('cap_std')"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: ntr_member_spend_goodwill
        effect: parameter
        decides: x1_spend_goodwill
        bindings: [x1_member_spend, x1_spend_goodwill]
        ladder:
          - when: "Finch Circle qualifying spend of the past twelve months at or above the upper tax member spend threshold"
            value: "K('goodwill_high')"
          - when: "that spend at or above the middle tax member spend threshold and below the upper"
            value: "K('goodwill_mid')"
          - when: "otherwise"
