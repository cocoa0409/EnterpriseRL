  - id: order_ext_duplicate_capture_refund
    base_policy_refs: [order_price_adjustment_rules]
    overwrite:
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          A register_price_error adjustment (the unit was charged above its ticketed or advertised price on the purchase
          date) is made at any time while the unit is not returned, refunds the overcharge, and counts toward no limit.
        replaced_by: >-
          For a second capture of a unit's payment that this policy handles, and only for such a capture, the
          register-error adjustment is still made at any time while the unit is not returned and still counts toward no
          limit, and it refunds the second capture together with the held-capture credit and goodwill amounts; every other register error, including a unit rung above its shelf ticket; registry credit recorded as spent but left undeducted; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; and gift card or Bonus Card value recorded as redeemed but left undeducted, stays under the base rule or the rule written for it.
    trigger: on_request
    subject: [order_price_adjustment]
    computes: amount
    target_tool: refund_duplicate_capture_6e7f744e
    params:
      rate_top: 0.75
      rate_base: 0.40
      rate_std: 0.25
      spend_high: 1500.00
      spend_mid: 500.00
      cap_high: 10.00
      cap_mid: 5.00
      cap_std: 2.00
      fee_days: 3
      fee_debit: 35.00
      fee_credit: 15.00
      fee_std: 0.00
      member_spend_high: 1200.00
      member_spend_mid: 500.00
      spend_goodwill_high: 10.00
      spend_goodwill_mid: 5.00
      spend_goodwill_std: 0.00
      size_large: 500.00
      size_mid: 100.00
      band_large: 10.00
      band_mid: 5.00
      band_std: 2.00
    rule: >-
      A unit whose payment records show the tender of its latest payment capture captured more than once for the unit carries a second capture: the customer paid twice with that tender for one unit, whereas the one capture per tender recorded for a mixed-tender unit is a single payment. For a second capture of a unit's payment that this policy handles, and only for such a
      capture, the register-error adjustment is still made at any time while the unit is not returned and still counts
      toward no limit, and it refunds the second capture together with the held-capture credit and goodwill amounts;
      every other register error, including a unit rung above its shelf ticket; registry credit recorded as spent but left undeducted; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; and gift card or Bonus Card value recorded as redeemed but left undeducted, stays under the base rule or the rule written for it.
      The refund goes to the unit's original tender and the correction records no new unit price. The second capture refunded is the amount of the unit's latest payment capture when the tender of that capture was captured more than once for the unit, and nothing otherwise. The held-capture credit is the daily held-capture rate times the held-capture days, and it never
      exceeds the held-capture cap. The duplicate-capture refund is the second capture plus the capped held-capture credit
      plus the bank-fee allowance plus the member spend goodwill plus the capture-size goodwill, rounded half up to the
      cent. The daily held-capture rate is the standard daily held-capture rate, the held-capture cap is the standard
      held-capture cap, the bank-fee allowance is the standard bank-fee allowance, the member spend goodwill is the
      standard member spend goodwill, the capture-size goodwill is the standard capture-size goodwill, and the held-capture
      days are the calendar days from the date of the latest capture to the request date, not counting the capture date,
      rounded down to a whole number of weeks and multiplied by seven. A customer whose active Finch Circle membership is
      at the Gold, Platinum, Diamond or Icon tier and who holds an active Marlowe & Finch card receives the top daily
      held-capture rate; one whose active membership is at the Member or Silver tier and who holds an active Marlowe &
      Finch card receives the base daily held-capture rate; every other customer receives the standard daily
      held-capture rate. For a second capture made by debit card or cash, whose money left the customer on the capture date, the held-capture days are the calendar days from the latest capture date to the request date counting both dates; for a second capture made by bank credit card they are those calendar days not counting the capture date; in every other case, including a unit with no second capture, they are those calendar days rounded down to a whole number of weeks and multiplied by seven. A customer whose Marlowe &
      Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases
      whose transaction date falls less than twelve whole months before it) reach the upper held-capture spend threshold
      has the upper held-capture cap; one whose such purchases reach the middle held-capture spend threshold but not the
      upper has the middle held-capture cap; every other customer has the standard held-capture cap. A second capture made by debit card, which drew on the customer's bank account, and at least the bank-fee days old on the request date earns the debit bank-fee allowance; a second capture made by bank credit card and at least the bank-fee days old earns the credit-card bank-fee allowance; every other case, including a unit with no second capture, earns the standard bank-fee allowance. A member whose Finch Circle qualifying spend posted in the twelve calendar months before the
      request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the
      upper member spend threshold receives the upper member spend goodwill; one whose such spend reaches the middle member
      spend threshold but not the upper receives the middle member spend goodwill; every other customer receives the
      standard member spend goodwill. A unit whose largest payment capture reaches the large capture size receives the
      large capture-size goodwill; one whose largest capture reaches the middle capture size but not the large receives
      the middle capture-size goodwill; every other unit receives the standard capture-size goodwill.
    compute:
      - dc_capture_tender: "LATEST('order_events', 'tender_type', event_type='order_payment')"
      - dc_captures: "COUNT('order_events', event_type='order_payment', tender_type=dc_capture_tender)"
      - dc_latest_capture: "LATEST('order_events', 'amount', event_type='order_payment')"
      - dc_second_capture: "dc_latest_capture if dc_captures > 1 else 0"
      - dc_capture_date: "LATEST('order_events', 'event_date', event_type='order_payment')"
      - dc_member_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - dc_any_card: "EXISTS('card', status='active')"
      - dc_rate: "K('rate_top') if ((dc_member_tier == 'Finch Circle Gold' or dc_member_tier == 'Finch Circle Platinum' or dc_member_tier == 'Finch Circle Diamond' or dc_member_tier == 'Finch Circle Icon') and dc_any_card) else (K('rate_base') if ((dc_member_tier == 'Finch Circle Member' or dc_member_tier == 'Finch Circle Silver') and dc_any_card) else K('rate_std'))"
      - dc_held_days: "DAYS(dc_capture_date, NOW) + 1 if ((dc_capture_tender == 'debit' or dc_capture_tender == 'cash') and dc_captures > 1) else (DAYS(dc_capture_date, NOW) if (dc_capture_tender == 'bank_card' and dc_captures > 1) else int(DAYS(dc_capture_date, NOW) / 7) * 7)"
      - dc_card_spend: "XSUM('card', 'card_transactions', 'amount', within_months=12, date_field='txn_date', event_type='card_purchase', merchant_category='marlowe_finch')"
      - dc_cap: "K('cap_high') if dc_card_spend >= K('spend_high') else (K('cap_mid') if dc_card_spend >= K('spend_mid') else K('cap_std'))"
      - dc_held_credit: "MN(dc_cap, dc_rate * dc_held_days)"
      - dc_fee: "K('fee_debit') if (LATEST('order_events', 'tender_type', event_type='order_payment') == 'debit' and dc_captures > 1 and DAYS(LATEST('order_events', 'event_date', event_type='order_payment'), NOW) >= K('fee_days')) else (K('fee_credit') if (LATEST('order_events', 'tender_type', event_type='order_payment') == 'bank_card' and dc_captures > 1 and DAYS(LATEST('order_events', 'event_date', event_type='order_payment'), NOW) >= K('fee_days')) else K('fee_std'))"
      - dc_member_spend: "XSUM('loyalty', 'loyalty_points_ledger', 'qualifying_amount', within_months=12, date_field='entry_date', event_type='loyalty_points_earn', earn_source='purchase_base')"
      - dc_spend_goodwill: "K('spend_goodwill_high') if dc_member_spend >= K('member_spend_high') else (K('spend_goodwill_mid') if dc_member_spend >= K('member_spend_mid') else K('spend_goodwill_std'))"
      - dc_largest_capture: "MAX('order_events', 'amount', event_type='order_payment')"
      - dc_size_band: "K('band_large') if dc_largest_capture >= K('size_large') else (K('band_mid') if dc_largest_capture >= K('size_mid') else K('band_std'))"
      - result: "RND(dc_second_capture + dc_held_credit + dc_fee + dc_spend_goodwill + dc_size_band, 2)"
    compute_basis:
      dc_capture_tender: "when the tender of that capture was captured more than once for the unit"
      dc_captures: "The second capture refunded is the amount of the unit's latest payment capture when the tender of that capture was captured more than once for the unit, and nothing otherwise."
      dc_latest_capture: "The second capture refunded is the amount of the unit's latest payment capture when the tender of that capture was captured more than once for the unit"
      dc_second_capture: "The second capture refunded is the amount of the unit's latest payment capture when the tender of that capture was captured more than once for the unit, and nothing otherwise."
      dc_capture_date: "the held-capture days are the calendar days from the date of the latest capture to the request date, not counting the capture date, rounded down to a whole number of weeks and multiplied by seven."
      dc_member_tier: "A customer whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier and who holds an active Marlowe & Finch card receives the top daily held-capture rate"
      dc_any_card: "one whose active membership is at the Member or Silver tier and who holds an active Marlowe & Finch card receives the base daily held-capture rate"
      dc_rate: "A customer whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier and who holds an active Marlowe & Finch card receives the top daily held-capture rate; one whose active membership is at the Member or Silver tier and who holds an active Marlowe & Finch card receives the base daily held-capture rate; every other customer receives the standard daily held-capture rate."
      dc_held_days: "For a second capture made by debit card or cash, whose money left the customer on the capture date, the held-capture days are the calendar days from the latest capture date to the request date counting both dates; for a second capture made by bank credit card they are those calendar days not counting the capture date; in every other case, including a unit with no second capture, they are those calendar days rounded down to a whole number of weeks and multiplied by seven."
      dc_card_spend: "A customer whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper held-capture spend threshold has the upper held-capture cap"
      dc_cap: "A customer whose Marlowe & Finch purchases charged to a Marlowe & Finch card in the twelve calendar months before the request date (purchases whose transaction date falls less than twelve whole months before it) reach the upper held-capture spend threshold has the upper held-capture cap; one whose such purchases reach the middle held-capture spend threshold but not the upper has the middle held-capture cap; every other customer has the standard held-capture cap."
      dc_held_credit: "The held-capture credit is the daily held-capture rate times the held-capture days, and it never exceeds the held-capture cap."
      dc_fee: "A second capture made by debit card, which drew on the customer's bank account, and at least the bank-fee days old on the request date earns the debit bank-fee allowance; a second capture made by bank credit card and at least the bank-fee days old earns the credit-card bank-fee allowance; every other case, including a unit with no second capture, earns the standard bank-fee allowance."
      dc_member_spend: "A member whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper member spend threshold receives the upper member spend goodwill"
      dc_spend_goodwill: "A member whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper member spend threshold receives the upper member spend goodwill; one whose such spend reaches the middle member spend threshold but not the upper receives the middle member spend goodwill; every other customer receives the standard member spend goodwill."
      dc_largest_capture: "A unit whose largest payment capture reaches the large capture size receives the large capture-size goodwill"
      dc_size_band: "A unit whose largest payment capture reaches the large capture size receives the large capture-size goodwill; one whose largest capture reaches the middle capture size but not the large receives the middle capture-size goodwill; every other unit receives the standard capture-size goodwill."
      result: "The duplicate-capture refund is the second capture plus the capped held-capture credit plus the bank-fee allowance plus the member spend goodwill plus the capture-size goodwill, rounded half up to the cent."
    factors:
      - id: dcr_held_rate
        effect: parameter
        decides: dc_rate
        bindings: [dc_member_tier, dc_any_card, dc_rate]
        ladder:
          - when: "active Finch Circle membership at the Gold, Platinum, Diamond or Icon tier and an active Marlowe & Finch card held"
            value: "K('rate_top')"
          - when: "active membership at the Member or Silver tier and an active Marlowe & Finch card held"
            value: "K('rate_base')"
          - when: "otherwise"
            value: "K('rate_std')"
        baseline:
          dc_rate: "K('rate_std')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: dcr_held_day_count
        effect: method
        decides: dc_held_days
        bindings: [dc_held_days]
        ladder:
          - when: "second capture made by debit card or cash"
            method: "calendar days from the latest capture date to the request date counting both dates"
          - when: "second capture made by bank credit card"
            method: "those calendar days not counting the capture date"
          - when: "otherwise"
            method: "those calendar days rounded down to whole weeks and multiplied by seven"
        baseline:
          dc_held_days: "int(DAYS(dc_capture_date, NOW) / 7) * 7"
        evidence: [date, history]
        cross_difficulty: null
      - id: dcr_held_cap
        effect: parameter
        decides: dc_cap
        bindings: [dc_card_spend, dc_cap]
        ladder:
          - when: "Marlowe & Finch card purchases of the past twelve months at or above the upper held-capture spend threshold"
            value: "K('cap_high')"
          - when: "such purchases at or above the middle held-capture spend threshold and below the upper"
            value: "K('cap_mid')"
          - when: "otherwise"
            value: "K('cap_std')"
        baseline:
          dc_cap: "K('cap_std')"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: dcr_bank_fee_allowance
        effect: parameter
        decides: dc_fee
        bindings: [dc_fee]
        ladder:
          - when: "second capture made by debit card and at least the bank-fee days old"
            value: "K('fee_debit')"
          - when: "second capture made by bank credit card and at least the bank-fee days old"
            value: "K('fee_credit')"
          - when: "otherwise"
            value: "K('fee_std')"
        baseline:
          dc_fee: "K('fee_std')"
        evidence: [history, date]
        cross_difficulty: null
      - id: dcr_member_spend_goodwill
        effect: parameter
        decides: dc_spend_goodwill
        bindings: [dc_member_spend, dc_spend_goodwill]
        ladder:
          - when: "Finch Circle qualifying spend of the past twelve months at or above the upper member spend threshold"
            value: "K('spend_goodwill_high')"
          - when: "that spend at or above the middle member spend threshold and below the upper"
            value: "K('spend_goodwill_mid')"
          - when: "otherwise"
            value: "K('spend_goodwill_std')"
        baseline:
          dc_spend_goodwill: "K('spend_goodwill_std')"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: dcr_capture_size_goodwill
        effect: parameter
        decides: dc_size_band
        bindings: [dc_largest_capture, dc_size_band]
        ladder:
          - when: "largest payment capture at or above the large capture size"
            value: "K('band_large')"
          - when: "largest capture at or above the middle capture size and below the large"
            value: "K('band_mid')"
          - when: "otherwise"
            value: "K('band_std')"
        baseline:
          dc_size_band: "K('band_std')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The second capture refunded is the amount of the unit's latest payment capture when the tender of that capture was captured more than once for the unit, and nothing otherwise. The held-capture credit is the daily held-capture rate times the held-capture days,
        and it never exceeds the held-capture cap. The duplicate-capture refund is the second capture plus the capped
        held-capture credit plus the bank-fee allowance plus the member spend goodwill plus the capture-size goodwill,
        rounded half up to the cent. The daily held-capture rate is the standard daily held-capture rate, the held-capture
        cap is the standard held-capture cap, the bank-fee allowance is the standard bank-fee allowance, the member spend
        goodwill is the standard member spend goodwill, the capture-size goodwill is the standard capture-size goodwill, and
        the held-capture days are the calendar days from the date of the latest capture to the request date, not counting
        the capture date, rounded down to a whole number of weeks and multiplied by seven.
      params: [rate_std, cap_std, fee_std, spend_goodwill_std, band_std]
    prerequisite: []
    cross_category:
      - category: loyalty
        as: history
        reads: [variant_name, status, loyalty_points_ledger.qualifying_amount]
        note: "The tier joins an active card in the daily rate; the year's qualifying spend decides the member spend goodwill."
      - category: card
        as: history
        reads: [status, card_transactions.amount]
        note: "An active card joins the tier in the daily rate; the card's Marlowe & Finch purchases of the past year decide the cap."
    inputs:
      history:
        - {table: order_events, aggregate: count, field: order_event_id, filters: {event_type: order_payment}}
        - {table: order_events, aggregate: latest, field: tender_type, filters: {event_type: order_payment}}
        - {table: order_events, aggregate: latest, field: amount, filters: {event_type: order_payment}}
        - {table: order_events, aggregate: max, field: amount, filters: {event_type: order_payment}}
        - {category: card, table: card_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: card_purchase, merchant_category: marlowe_finch}}
        - {category: loyalty, table: loyalty_points_ledger, aggregate: sum, field: qualifying_amount, within_months: 12, filters: {event_type: loyalty_points_earn, earn_source: purchase_base}}
      cross_category: [loyalty, card]
  - id: order_ext_gift_card_shortfall_claim
    base_policy_refs: [order_price_adjustment_rules]
    overwrite:
      - base_policy: order_price_adjustment_rules
        superseded_clause: >-
          A register_price_error adjustment (the unit was charged above its ticketed or advertised price on the purchase
          date) is made at any time while the unit is not returned, refunds the overcharge, and counts toward no limit.
        replaced_by: >-
          For gift card or Bonus Card value recorded as redeemed on a unit but left undeducted that this policy handles, and only for such value, the register-error adjustment is still made at any time while the unit is not returned and still
          counts toward no limit, and it refunds the card money captured for the part the gift card had paid together with
          the incident escalation credit, the gift card service credit and the goodwill amounts; every other register error, including a unit rung above its shelf ticket; registry credit recorded as spent but left undeducted; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; and a second capture of the same tender, stays under the base rule or the rule written for it.
    trigger: on_request
    subject: [order_price_adjustment]
    computes: amount
    target_tool: claim_gift_card_shortfall_5b13f7c5
    params:
      esc_high_count: 3
      esc_mid_count: 2
      esc_low_count: 1
      esc_high: 25.00
      esc_mid: 15.00
      esc_low: 5.00
      esc_std: 0.00
      rate_top: 0.60
      rate_base: 0.30
      rate_std: 0.10
      member_spend_high: 1200.00
      member_spend_mid: 500.00
      cap_high: 10.00
      cap_mid: 5.00
      cap_std: 2.00
      months_long: 84
      months_mid: 36
      tenure_long: 8.00
      tenure_mid: 4.00
      tenure_std: 0.00
      size_large: 100.00
      size_mid: 25.00
      size_large_goodwill: 6.00
      size_mid_goodwill: 3.00
      size_std_goodwill: 0.00
    rule: >-
      When the gift card ledger shows any Marlowe & Finch gift card, Bonus Card included, redeemed on a purchase record but the unit's payment was captured as if the card had not been used, the customer was charged for the part the card had already paid. The claim is the customer's own act: the customer files it in person through the gift card claim on the order,
      with the amount this rule gives, as a register-error adjustment refunded to the unit's original tender; the gift
      card value is not put back on the gift card, and the correction records no new unit price. For gift card or Bonus Card value recorded as redeemed on a unit but left undeducted that this policy handles, and only for such value, the
      register-error adjustment is still made at any time while the unit is not returned and still counts toward no limit,
      and it refunds the card money captured for the part the gift card had paid together with the incident escalation
      credit, the gift card service credit and the goodwill amounts; every other register error, including a unit rung above its shelf ticket; registry credit recorded as spent but left undeducted; the card money taken for a Finch Note recorded as redeemed but left undeducted; sales tax charged on the part a Finch Note paid; and a second capture of the same tender, stays under the base rule or the rule written for it. The incident escalation
      credit is set once for the whole incident, on the gift card claim, from the register-error corrections standing on
      the unit. The gift card shortfall refund is fixed only after the unit's records carry a register-error correction for
      every Finch Note recorded as redeemed on the unit but left undeducted. The gift card shortfall refund is not settled until the sales tax charged on the part paid by every Finch Note recorded as redeemed on the unit but left undeducted carries its register-error correction on the unit's records. Before the gift card shortfall refund is fixed, every second capture of the unit's payment
      must carry its register-error correction on the unit's records. The gift card shortfall is the total of the gift card redemption entries naming the unit, Bonus Card entries included, but never more than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid (the gift card due amount less that gift card value), and never below zero. The gift card due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent. The gift card service credit
      is the daily gift card service rate times the gift card service days, and it never exceeds the gift card service
      cap. The gift card shortfall refund is the gift card shortfall plus the incident escalation credit plus the capped
      gift card service credit plus the gift card tenure courtesy plus the redemption-size goodwill, rounded half up to the
      cent. The incident escalation credit is the standard incident escalation credit, the daily gift card service rate is
      the standard daily gift card service rate, the gift card service cap is the standard gift card service cap, the
      gift card tenure courtesy is the standard gift card tenure courtesy, the redemption-size goodwill is the standard
      redemption-size goodwill, and the gift card service days are the calendar days from the purchase date to the request
      date, not counting the purchase date, rounded down to a whole number of weeks and multiplied by seven. A unit whose
      records carry at least the high correction count of register-error corrections receives the high incident
      escalation credit; one carrying exactly the middle correction count receives the middle incident escalation credit;
      one carrying exactly the low correction count receives the low incident escalation credit; every other unit receives
      the standard incident escalation credit. For a unit paid by debit card or cash, whose money left the customer on the purchase date, the gift card service days are the calendar days from the purchase date to the request date counting both dates; for a unit paid by bank credit card they are those calendar days not counting the purchase date; for any other tender they are those calendar days rounded down to a whole number of weeks and multiplied by seven. A customer whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier and who
      holds an active Marlowe & Finch card receives the top daily gift card service rate; one whose active membership is
      at the Member or Silver tier and who holds an active Marlowe & Finch card receives the base daily gift card service
      rate; every other customer receives the standard daily gift card service rate. A member whose Finch Circle qualifying
      spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls
      less than twelve whole months before it) reaches the upper gift card spend threshold has the upper gift card service
      cap; one whose such spend reaches the middle gift card spend threshold but not the upper has the middle gift card
      service cap; every other customer has the standard gift card service cap. A member whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long gift card tenure courtesy; one enrolled at least the middle-tenure months but fewer than the long-tenure months receives the middle
      gift card tenure courtesy; every other customer receives the standard gift card tenure courtesy. A unit whose largest gift card redemption entry naming it, Bonus Card entries included, reaches the large redemption size receives the large redemption-size goodwill;
      one whose largest such entry reaches the middle redemption size but not the large receives the middle
      redemption-size goodwill; every other unit receives the standard redemption-size goodwill.
    compute:
      - g1_all_redeemed: "XSUM('giftcard', 'gift_card_ledger', 'amount', date_field='txn_date', event_type='giftcard_redeem', purchase_id=HID)"
      - g1_gift_value: "g1_all_redeemed"
      - g1_card_captured: "SUM('order_events', 'amount', event_type='order_payment') - SUM('order_events', 'amount', event_type='order_payment', tender_type='gift_card')"
      - g1_notes_on_unit: "MX(F('finch_notes_applied'), XSUM('loyalty', 'loyalty_note_ledger', 'note_amount', date_field='txn_date', event_type='loyalty_note_redeem', purchase_id=HID))"
      - g1_undeducted: "g1_notes_on_unit - F('finch_notes_applied')"
      - g1_undeducted_tax: "RND(F('tax_amount') * g1_undeducted / F('unit_price'), 2)"
      - g1_due: "F('unit_price') + F('tax_amount') - g1_notes_on_unit - g1_undeducted_tax"
      - g1_shortfall: "MX(0, MN(g1_gift_value, g1_card_captured - (g1_due - g1_gift_value)))"
      - g1_corrections: "COUNT('order_events', event_type='order_price_adjustment', adjustment_reason='register_price_error')"
      - g1_escalation: "K('esc_high') if g1_corrections >= K('esc_high_count') else (K('esc_mid') if g1_corrections == K('esc_mid_count') else (K('esc_low') if g1_corrections == K('esc_low_count') else K('esc_std')))"
      - g1_service_days: "DAYS(F('purchase_date'), NOW) + 1 if (F('tender_type') == 'debit' or F('tender_type') == 'cash') else (DAYS(F('purchase_date'), NOW) if F('tender_type') == 'bank_card' else int(DAYS(F('purchase_date'), NOW) / 7) * 7)"
      - g1_member_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - g1_active_card: "EXISTS('card', status='active')"
      - g1_rate: "K('rate_top') if ((g1_member_tier == 'Finch Circle Gold' or g1_member_tier == 'Finch Circle Platinum' or g1_member_tier == 'Finch Circle Diamond' or g1_member_tier == 'Finch Circle Icon') and g1_active_card) else (K('rate_base') if ((g1_member_tier == 'Finch Circle Member' or g1_member_tier == 'Finch Circle Silver') and g1_active_card) else K('rate_std'))"
      - g1_member_spend: "XSUM('loyalty', 'loyalty_points_ledger', 'qualifying_amount', within_months=12, date_field='entry_date', event_type='loyalty_points_earn', earn_source='purchase_base')"
      - g1_cap: "K('cap_high') if g1_member_spend >= K('member_spend_high') else (K('cap_mid') if g1_member_spend >= K('member_spend_mid') else K('cap_std'))"
      - g1_service_credit: "MN(g1_cap, g1_rate * g1_service_days)"
      - g1_member_months: "MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW) if CFIELD('loyalty', 'enrolled_date', status='active') != None else 0"
      - g1_tenure: "K('tenure_long') if g1_member_months >= K('months_long') else (K('tenure_mid') if g1_member_months >= K('months_mid') else K('tenure_std'))"
      - g1_largest_redemption: "XMAX('giftcard', 'gift_card_ledger', 'amount', event_type='giftcard_redeem', purchase_id=HID)"
      - g1_size_goodwill: "K('size_large_goodwill') if g1_largest_redemption >= K('size_large') else (K('size_mid_goodwill') if g1_largest_redemption >= K('size_mid') else K('size_std_goodwill'))"
      - result: "RND(g1_shortfall + g1_escalation + g1_service_credit + g1_tenure + g1_size_goodwill, 2)"
    compute_basis:
      g1_all_redeemed: "The gift card shortfall is the total of the gift card redemption entries naming the unit, Bonus Card entries included"
      g1_gift_value: "The gift card shortfall is the total of the gift card redemption entries naming the unit, Bonus Card entries included"
      g1_card_captured: "money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card)"
      g1_notes_on_unit: "The gift card due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      g1_undeducted: "The gift card due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      g1_undeducted_tax: "The gift card due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      g1_due: "The gift card due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent."
      g1_shortfall: "The gift card shortfall is the total of the gift card redemption entries naming the unit, Bonus Card entries included, but never more than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid (the gift card due amount less that gift card value), and never below zero."
      g1_corrections: "The incident escalation credit is set once for the whole incident, on the gift card claim, from the register-error corrections standing on the unit."
      g1_escalation: "A unit whose records carry at least the high correction count of register-error corrections receives the high incident escalation credit; one carrying exactly the middle correction count receives the middle incident escalation credit; one carrying exactly the low correction count receives the low incident escalation credit; every other unit receives the standard incident escalation credit."
      g1_service_days: "For a unit paid by debit card or cash, whose money left the customer on the purchase date, the gift card service days are the calendar days from the purchase date to the request date counting both dates; for a unit paid by bank credit card they are those calendar days not counting the purchase date; for any other tender they are those calendar days rounded down to a whole number of weeks and multiplied by seven."
      g1_member_tier: "A customer whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier and who holds an active Marlowe & Finch card receives the top daily gift card service rate"
      g1_active_card: "one whose active membership is at the Member or Silver tier and who holds an active Marlowe & Finch card receives the base daily gift card service rate"
      g1_rate: "A customer whose active Finch Circle membership is at the Gold, Platinum, Diamond or Icon tier and who holds an active Marlowe & Finch card receives the top daily gift card service rate; one whose active membership is at the Member or Silver tier and who holds an active Marlowe & Finch card receives the base daily gift card service rate; every other customer receives the standard daily gift card service rate."
      g1_member_spend: "A member whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper gift card spend threshold has the upper gift card service cap"
      g1_cap: "A member whose Finch Circle qualifying spend posted in the twelve calendar months before the request date (purchase earn entries whose posting date falls less than twelve whole months before it) reaches the upper gift card spend threshold has the upper gift card service cap; one whose such spend reaches the middle gift card spend threshold but not the upper has the middle gift card service cap; every other customer has the standard gift card service cap."
      g1_service_credit: "The gift card service credit is the daily gift card service rate times the gift card service days, and it never exceeds the gift card service cap."
      g1_member_months: "A member whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long gift card tenure courtesy"
      g1_tenure: "A member whose active Finch Circle membership was enrolled at least the long-tenure months before the request date (whole months) receives the long gift card tenure courtesy; one enrolled at least the middle-tenure months but fewer than the long-tenure months receives the middle gift card tenure courtesy; every other customer receives the standard gift card tenure courtesy."
      g1_largest_redemption: "A unit whose largest gift card redemption entry naming it, Bonus Card entries included, reaches the large redemption size receives the large redemption-size goodwill"
      g1_size_goodwill: "A unit whose largest gift card redemption entry naming it, Bonus Card entries included, reaches the large redemption size receives the large redemption-size goodwill; one whose largest such entry reaches the middle redemption size but not the large receives the middle redemption-size goodwill; every other unit receives the standard redemption-size goodwill."
      result: "The gift card shortfall refund is the gift card shortfall plus the incident escalation credit plus the capped gift card service credit plus the gift card tenure courtesy plus the redemption-size goodwill, rounded half up to the cent."
    factors:
      - id: gcs_incident_escalation
        effect: parameter
        decides: g1_escalation
        bindings: [g1_corrections, g1_escalation]
        ladder:
          - when: "at least the high correction count of register-error corrections on the unit"
            value: "K('esc_high')"
          - when: "exactly the middle correction count"
            value: "K('esc_mid')"
          - when: "exactly the low correction count"
            value: "K('esc_low')"
          - when: "otherwise"
            value: "K('esc_std')"
        baseline:
          g1_escalation: "K('esc_std')"
        evidence: [history]
        cross_difficulty: null
      - id: gcs_service_day_count
        effect: method
        decides: g1_service_days
        bindings: [g1_service_days]
        ladder:
          - when: "unit paid by debit card or cash"
            method: "calendar days from the purchase date to the request date counting both dates"
          - when: "unit paid by bank credit card"
            method: "those calendar days not counting the purchase date"
          - when: "otherwise"
            method: "those calendar days rounded down to whole weeks and multiplied by seven"
        baseline:
          g1_service_days: "int(DAYS(F('purchase_date'), NOW) / 7) * 7"
        evidence: [date]
        cross_difficulty: null
      - id: gcs_service_rate
        effect: parameter
        decides: g1_rate
        bindings: [g1_member_tier, g1_active_card, g1_rate]
        ladder:
          - when: "active Finch Circle membership at the Gold, Platinum, Diamond or Icon tier and an active Marlowe & Finch card"
            value: "K('rate_top')"
          - when: "active membership at the Member or Silver tier and an active Marlowe & Finch card"
            value: "K('rate_base')"
          - when: "otherwise"
            value: "K('rate_std')"
        baseline:
          g1_rate: "K('rate_std')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: gcs_service_cap
        effect: parameter
        decides: g1_cap
        bindings: [g1_member_spend, g1_cap]
        ladder:
          - when: "Finch Circle qualifying spend of the past twelve months at or above the upper gift card spend threshold"
            value: "K('cap_high')"
          - when: "that spend at or above the middle gift card spend threshold and below the upper"
            value: "K('cap_mid')"
          - when: "otherwise"
            value: "K('cap_std')"
        baseline:
          g1_cap: "K('cap_std')"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: gcs_tenure_courtesy
        effect: parameter
        decides: g1_tenure
        bindings: [g1_member_months, g1_tenure]
        ladder:
          - when: "Finch Circle membership enrolled at least the long-tenure months ago"
            value: "K('tenure_long')"
          - when: "enrolled at least the middle-tenure months ago but fewer than the long-tenure months"
            value: "K('tenure_mid')"
          - when: "otherwise"
            value: "K('tenure_std')"
        baseline:
          g1_tenure: "K('tenure_std')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: gcs_redemption_size_goodwill
        effect: parameter
        decides: g1_size_goodwill
        bindings: [g1_largest_redemption, g1_size_goodwill]
        ladder:
          - when: "largest gift card redemption entry on the unit at or above the large redemption size"
            value: "K('size_large_goodwill')"
          - when: "largest entry at or above the middle redemption size and below the large"
            value: "K('size_mid_goodwill')"
          - when: "otherwise"
            value: "K('size_std_goodwill')"
        baseline:
          g1_size_goodwill: "K('size_std_goodwill')"
        evidence: [cross_category, history]
        cross_difficulty: giftcard
    baseline:
      rule: >-
        The gift card shortfall is the total of the gift card redemption entries naming the unit, Bonus Card entries included, but never more than the money captured on the unit by tenders other than gift cards (its payment captures less those made by gift card) less what those tenders should have paid (the gift card due amount less that gift card value), and never below zero. The gift card due amount is the unit's selling price plus the tax recorded on it, less the larger of the Finch Notes applied on its purchase record and the notes the ledger shows redeemed on it, and less the tax recorded on the part of the price paid by redeemed notes beyond those applied, which is the tax recorded on the unit times that part divided by the unit's selling price, rounded half up to the cent. The gift card service credit is the daily gift card service rate times the gift
        card service days, and it never exceeds the gift card service cap. The gift card shortfall refund is the gift card
        shortfall plus the incident escalation credit plus the capped gift card service credit plus the gift card tenure
        courtesy plus the redemption-size goodwill, rounded half up to the cent. The incident escalation credit is the
        standard incident escalation credit, the daily gift card service rate is the standard daily gift card service rate,
        the gift card service cap is the standard gift card service cap, the gift card tenure courtesy is the standard gift
        card tenure courtesy, the redemption-size goodwill is the standard redemption-size goodwill, and the gift card
        service days are the calendar days from the purchase date to the request date, not counting the purchase date,
        rounded down to a whole number of weeks and multiplied by seven.
      params: [esc_std, rate_std, cap_std, tenure_std, size_std_goodwill]
    prerequisite:
      - problem: order_ext_note_shortfall_refund
        kind: value_input
        gate: g1_corrections
        form: state
        policy_source: >-
          The gift card shortfall refund is fixed only after the unit's records carry a register-error correction for every
          Finch Note recorded as redeemed on the unit but left undeducted.
        condition: >-
          Whenever the loyalty note ledger carries a loyalty_note_redeem entry naming the unit while the unit's
          finch_notes_applied is below that value, the unit's order_events carry an order_price_adjustment with
          adjustment_reason register_price_error for it.
        resolved_by: refund_note_shortfall_1f084e1e
        effect: >-
          The note shortfall refund adds one register-error correction to the unit, raising the count the incident
          escalation credit is set from.
      - problem: order_ext_note_tax_refund
        kind: value_input
        gate: g1_corrections
        form: state
        policy_source: >-
          The gift card shortfall refund is not settled until the sales tax charged on the part paid by every Finch Note recorded as redeemed on the unit but left undeducted carries its register-error correction on the unit's records.
        condition: >-
          Whenever the loyalty note ledger carries loyalty_note_redeem entries naming the unit whose value exceeds the
          unit's finch_notes_applied, the unit's order_events carry an order_price_adjustment with adjustment_reason
          register_price_error refunding the sales tax charged on that excess.
        resolved_by: refund_note_tax_482f19cd
        effect: >-
          The note tax refund adds one register-error correction to the unit, raising the count the incident escalation
          credit is set from.
      - problem: order_ext_duplicate_capture_refund
        kind: value_input
        gate: g1_corrections
        form: state
        policy_source: >-
          Before the gift card shortfall refund is fixed, every second capture of the unit's payment must carry its
          register-error correction on the unit's records.
        condition: >-
          Whenever the tender of the unit's latest order_payment was captured more than once for the unit, its order_events also carry an order_price_adjustment with adjustment_reason register_price_error refunding that second capture.
        resolved_by: refund_duplicate_capture_6e7f744e
        effect: >-
          The duplicate-capture refund adds one register-error correction to the unit, raising the count the incident
          escalation credit is set from.
    cross_category:
      - category: giftcard
        as: history
        reads: [gift_card_ledger.amount]
        note: "The redemption entries naming the unit, Bonus Card entries included, give the shortfall and the largest entry."
      - category: loyalty
        as: history
        reads: [variant_name, status, enrolled_date, loyalty_points_ledger.qualifying_amount, loyalty_note_ledger.note_amount]
        note: "Tier joins the card in the rate; qualifying spend decides the cap; enrollment decides the tenure courtesy; notes redeemed on the unit lower its taxed price."
      - category: card
        as: branch
        reads: [variant_name, status]
        note: "An active Marlowe & Finch card joins the tier in the daily rate."
    inputs:
      history:
        - {table: order_events, aggregate: sum, field: amount, filters: {event_type: order_payment}}
        - {table: order_events, aggregate: count, field: order_event_id, filters: {event_type: order_price_adjustment, adjustment_reason: register_price_error}}
        - {category: giftcard, table: gift_card_ledger, aggregate: sum, field: amount, filters: {event_type: giftcard_redeem}}
        - {category: loyalty, table: loyalty_points_ledger, aggregate: sum, field: qualifying_amount, within_months: 12, filters: {event_type: loyalty_points_earn, earn_source: purchase_base}}
      cross_category: [giftcard, loyalty, card]
