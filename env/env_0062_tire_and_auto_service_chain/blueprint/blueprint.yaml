name: env_0062_tire_and_auto_service_chain
company: Crestline Tire & Auto Care

background: |
  Crestline Tire & Auto Care is a US tire and automotive service chain headquartered in Columbus, Ohio, operating about 640 company-owned stores across sixteen states from the Great Lakes to the Mountain West, each with six to twelve service bays and a customer care center that handles calls for every store.
  Crestline sells its own house-brand tires and the services that go with them, and its customer care team speaks in a plain, practical, neighborly voice to drivers, small business owners and fleet managers alike.
  Tires are sold one ticket per vehicle as a tire set carrying the treadwear limited warranty of its line: Crestline Value Touring 40K Treadwear Warranty, Crestline All-Season 50K Treadwear Warranty, Crestline Grand Touring 60K Treadwear Warranty, Crestline Highway Terrain LT 65K Treadwear Warranty, Crestline Premium Touring 75K Treadwear Warranty and Crestline Ultra Touring 85K Treadwear Warranty; each set records its installation, rotations, tread inspections, adjustments and refunds.
  Road Hazard Protection is bought for a Crestline tire set as a certificate: Crestline Road Hazard 12-Month Protection, Crestline Road Hazard 24-Month Protection, Crestline Road Hazard 36-Month Protection, Crestline Road Hazard Plus 36-Month Protection, Crestline Road Hazard Life-of-Tread Protection and Crestline Road Hazard Commercial LT Protection, and each certificate books its repairs, replacements, reimbursements, roadside calls and refunds.
  The Crestline Credit Card is issued by Northgate Bank, N.A. as the Crestline Auto Care Card Starter, Crestline Auto Care Card, Crestline Auto Care Card Preferred, Crestline Auto Care Mastercard, Crestline Auto Care Mastercard Preferred and Crestline Auto Care World Mastercard, and each account carries purchases with or without promotional financing, monthly statements, payments and their allocation, interest, fees and merchandise credits.
  Businesses and public agencies hold a Crestline Fleet Account as Crestline Fleet Starter, Crestline Fleet Business, Crestline Fleet Commercial, Crestline Fleet National, Crestline Fleet Enterprise or Crestline Fleet Public Sector, with a roster of enrolled vehicles and a ledger of invoices, remittances, discounts, late charges and credit memos.
  Alignment Services & Plans are sold per vehicle as the Crestline Two-Wheel Alignment, Crestline Four-Wheel Alignment, Crestline 1-Year Alignment Plan, Crestline 3-Year Alignment Plan, Crestline Lifetime Alignment Plan and Crestline Lifetime Alignment Plan Truck & Performance, each recording its booked visits, alignments, readjustments and refunds.
  Brake Service Warranties cover one brake job on one axle under the Crestline Value Brake Service 12-Month/12,000-Mile Warranty, Crestline Standard Brake Service 24-Month/24,000-Mile Warranty, Crestline Ceramic Brake Service 36-Month/36,000-Mile Warranty, Crestline Premium Ceramic Lifetime Pad Warranty, Crestline Complete Brake Service Lifetime Pad Warranty and Crestline Severe-Duty Brake Service 12-Month/12,000-Mile Warranty, with inspections and warranty visits booked against the job.
  Battery Replacement Warranties come with every battery sold, as the Crestline Standard 24-Month Battery, Crestline Plus 30-Month Battery, Crestline Gold 36-Month Battery, Crestline AGM 36-Month Battery, Crestline Platinum AGM 48-Month Battery and Crestline Commercial Heavy-Duty 18-Month Battery, and each one books its core deposit, tests, replacements and adjustments.
  Every purchase is rung up on a store ticket, and a ticket paid with the Crestline card posts to the card account while a ticket charged to a fleet account posts as a fleet invoice.
  Most callers are households with one to three vehicles who bought a set of tires with road hazard protection, often an alignment plan, and sometimes paid with the Crestline card on a promotional plan.
  They call about worn or damaged tires, flats far from home, appointments, refunds, promotional balances and statements, and they bring years of service history on their profile.
  Business callers are owners of small service companies, office managers of regional delivery and contracting fleets, and purchasing staff of municipalities, who manage rosters of vans and pickups and call about invoices, purchase orders, payments and credits.
  Many customers hold several products at once, so a single vehicle may carry a tire set, a road hazard certificate, an alignment plan, a brake warranty and a battery warranty, paid for partly on a card and partly on a fleet account.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_log

difficulties:
  - name: tire_treadwear_warranty
    claim:
      categories: [tires]
      event_types: [tires_installation_booked, tires_installation_completed, tires_tread_inspection, tires_treadwear_adjustment, tires_workmanship_replacement, tires_adjustment_credit_applied, tires_satisfaction_return, tires_order_cancellation, tires_refund, tires_worn_out_closure, tires_set_retirement]
    summary: >
      Callers are drivers, and sometimes the owner of a small business vehicle, who bought a Crestline tire set and now
      want it installed, returned under the satisfaction trial, cancelled before installation, or adjusted because the
      tires wore out early or failed from a defect; the setting varies with the tire line held, whether the set is still
      ordered or already active, how many miles and months the set has run, whether rotations were documented, whether
      the vehicle sits on a fleet roster, and whether earlier adjustments, credits or a trial return already exist for the
      set or the vehicle. The records involved are the tire set, its installation, rotation, inspection, adjustment,
      credit and refund history, the vehicle record and any fleet roster rows, governed by tires_evt_treadwear_adjustment,
      tires_commercial_use_coverage, tires_treadwear_workmanship_exclusion, tires_evt_workmanship_replacement,
      tires_evt_credit_redemption, tires_evt_satisfaction_trial, tires_evt_order_cancellation, tires_refund_tender and
      tires_agg_vehicle_tire_count, whose state gates, term and inspection windows, per-tier warranted miles, price bases,
      rounding and minimum percentages decide whether and how much is credited or refunded; in the business itself a set is
      bought, installed, rotated and inspected before any adjustment, and an adjustment issues a credit before it can be
      spent. The agent books appointments, records adjustments and workmanship replacements, applies or lapses credits and
      writes refunds and closures on a verified customer's records, while a satisfaction-trial return is the customer's
      own decision about their tires and can only be confirmed by the customer through a request the agent registers.
      Requests that rest on rotation receipts from another shop, on damage the customer attributes to a Crestline
      installation error, or on a goodwill credit outside the warranty terms are not decided by any policy here and go to
      a human representative as POLICY_NOT_COVERED.

  - name: road_hazard_claims
    claim:
      categories: [hazard]
      event_types: [hazard_purchase, hazard_repair, hazard_replacement, hazard_third_party_reimbursement, hazard_roadside_service, hazard_cancellation, hazard_void, hazard_cancellation_refund, hazard_expiration]
    summary: >
      Callers are certificate holders who picked up a nail, cut a sidewall, broke a tire on a pothole, had a flat far from
      any store, used a tow, or want to buy, cancel or understand a road hazard certificate; their situation differs by
      plan, by certificate status, by how long ago coverage started and how much tread was left, by the repairs,
      replacements and roadside calls already used on each position, and by whether the covered tire set is still active
      or the vehicle has entered a fleet roster. The records involved are the certificate, the covered tire set and its
      tire line, the vehicle and fleet roster, and the certificate's claim, allowance and refund history, governed by
      hazard_purchase_eligibility, hazard_agg_one_per_set, hazard_evt_activation, hazard_claim_coverage,
      hazard_evt_repair, hazard_evt_replacement, hazard_evt_third_party_reimbursement, hazard_evt_roadside,
      hazard_evt_cancellation_refund, hazard_commercial_use_exclusion and hazard_defect_exclusion, which fix per-plan
      terms, full-replacement periods, tread-based proration, per-position and per-certificate limits, reimbursement
      caps and the ordered cancellation refund bases; in the business a certificate is sold on a tire set, starts when the
      set is installed, and only then pays claims. The agent books repairs, replacements, reimbursements and roadside calls
      and voids certificates of cancelled sets for a verified holder, while cancelling an active certificate is the
      holder's own decision confirmed by the holder through a request the agent registers. Claims for wheel or rim damage, a
      holder's dispute of the damage or cause the technician recorded, and requests to extend or reinstate an expired
      certificate are not decided by any policy here and are handed to a human representative as POLICY_NOT_COVERED.

  - name: credit_card_promotions
    claim:
      categories: [card]
      event_types: [card_purchase, card_payment, card_payment_allocation, card_deferred_interest_assessed, card_late_fee, card_returned_payment_fee, card_merchandise_credit, card_fee_reversal, card_closure]
    summary: >
      Callers are Crestline cardholders who financed tires or repairs on a promotional plan, were charged deferred
      interest, see a late or returned payment fee, returned merchandise bought on the card, want a payment directed to a
      promotional balance, or want to close the account; their setting varies with the card product, account status, the
      plans attached to each ticket and their expiration dates, the payment, allocation and fee history over recent
      statements, and whether a Crestline refund or a fleet charge is involved. The records involved are the card account,
      its purchases, statements, payments, allocations, accruals, fees, credits and reversals, and the store tickets behind
      them, governed by card_evt_purchase_promo, card_promo_stacking, card_evt_statement, card_evt_payment_allocation,
      card_evt_deferred_interest, card_evt_late_fee, card_evt_returned_payment, card_evt_fee_reversal,
      card_evt_merchandise_credit and card_evt_account_status, with per-product APRs, promo minimums and terms, repeat-fee
      windows and courtesy-waiver allowances; in the business an account is approved before any purchase, a promotional
      purchase posts before it accrues and expires, and a statement precedes the due date a fee depends on. The agent posts
      corrections, allocations, credits and fee reversals on a verified cardholder's account, while applying for a card,
      instructing allocation to a deferred balance, disputing a charge and closing the account are the cardholder's own
      requests confirmed by the cardholder. Credit decisions, limit changes and the outcome of a billing-error dispute
      belong to Northgate Bank, and requests such as re-aging a delinquent account, waiving assessed interest as goodwill,
      or extending a promotional period are not covered by any policy here and go to a human representative as
      POLICY_NOT_COVERED.

  - name: fleet_invoicing
    claim:
      categories: [fleet]
      event_types: [fleet_vehicle_enrolled, fleet_vehicle_removed, fleet_invoice_posted, fleet_payment_received, fleet_early_pay_discount, fleet_late_charge, fleet_credit_memo, fleet_terms_change, fleet_closure]
    summary: >
      Callers are fleet managers, office managers and agency purchasing staff who need a vehicle added to or moved between
      rosters, an invoice priced with the right program discount or purchase order, a remittance applied with or without
      the early-pay discount, a late charge explained, a duplicate or mispriced invoice credited, or their terms changed;
      their setting varies with the fleet program, account status, billing cycle, PO and approval settings, the roster on
      the invoice date, the age and payment state of every invoice, and whether the business holds several fleet
      accounts. The records involved are the fleet account, its roster rows, invoices, remittances, discounts, late
      charges, credit memos and disputes, and the vehicles and store tickets behind them, governed by
      fleet_agg_single_roster, fleet_agg_combined_limit, fleet_evt_roster, fleet_evt_invoice, fleet_evt_payment,
      fleet_evt_late_charge, fleet_evt_credit_memo, fleet_evt_account_status, fleet_evt_terms_change and
      fleet_commercial_use_interplay, with per-program discounts by service category, PO thresholds, net terms, early-pay
      and late-charge rates, dispute windows and desk credit limits; in the business an account is approved and a vehicle
      enrolled before work on it is invoiced, and an invoice exists before a payment, discount or credit applies to it. The
      agent maintains the roster, posts and corrects invoices, applies remittances and discounts, assesses late charges and
      issues credits within the desk limit for a verified authorized contact, while closing the account is the business's
      own decision confirmed by its contact. Credit limit decisions, credits above the desk limit, an agency's own
      prompt-payment interest claims and payment plans for past-due balances are not decided by any policy here and go to
      a human representative as POLICY_NOT_COVERED.

  - name: alignment_plan_service
    claim:
      categories: [alignment]
      event_types: [alignment_purchase, alignment_appointment_booked, alignment_service_performed, alignment_readjustment, alignment_cancellation, alignment_refund, alignment_vehicle_retirement]
    summary: >
      Callers are drivers who want to buy an alignment or plan, book an alignment, know whether a visit is included or
      charged, have a recent alignment readjusted, cancel a plan for a refund, or end a plan because they sold the
      vehicle; their setting varies with the service or plan held, its status and term, the date and odometer of the last
      included alignment, the guarantee left on the latest alignment, any tire set recently installed on the same vehicle,
      and whether the vehicle is now in commercial use. The records involved are the alignment plan, its bookings,
      alignments, readjustments and refunds, the vehicle and its tire sets and fleet roster rows, governed by
      alignment_agg_one_per_vehicle, alignment_purchase_pricing, alignment_evt_booking, alignment_evt_service,
      alignment_evt_readjustment, alignment_evt_cancellation_refund, alignment_evt_plan_end and
      alignment_commercial_use_exclusion, with per-tier prices, intervals, member prices, guarantee periods, cancellation
      windows and per-alignment deductions; in the business a plan is bought with its first alignment, later alignments
      follow by interval, and a readjustment follows the alignment it corrects. The agent sells plans, books and records
      alignments and readjustments and ends plans for a verified customer, while cancelling a plan for a refund is the
      holder's own decision confirmed through a request the agent registers. Complaints of steering or suspension
      damage the customer attributes to a Crestline alignment, and reimbursement for alignment work done at another shop,
      are not covered by any policy here and go to a human representative as POLICY_NOT_COVERED.
