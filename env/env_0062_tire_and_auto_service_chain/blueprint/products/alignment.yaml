# ---- data flow ----
events:
  - type: alignment_purchase
    target: alignment_plans
    mutation: create
    meaning: A customer buys a single alignment or an alignment plan for one vehicle; the first alignment is done on the same visit.
    grain: one row per service or plan sold
    fields:
      customer_id: purchaser
      vehicle_id: vehicle the plan is valid on
      store_id: selling store
      variant_name: service or plan sold
      purchase_date: ticket date
      purchase_odometer: odometer on the work order
      expiration_date: end of the term (empty for lifetime)
      purchase_price: price paid after any bundle discount
      purchase_ticket_number: ticket number
      payment_method: tender used
    triggers:
      - event: alignment:alignment_service_performed
        map: {event_date: purchase_date, store_id: store_id, odometer: purchase_odometer, service_basis: plan_included}

  - type: alignment_appointment_booked
    target: alignment_events
    meaning: An alignment appointment is booked (or moved) under the plan.
    grain: one row per appointment slot booked; a reschedule is a new row with the new slot
    distinguish_by: [appointment_date, appointment_time]
    fields:
      event_date: date the booking was made
      store_id: store booked
      appointment_date: appointment date
      appointment_time: slot start
      alignment_type: alignment booked
    triggers: []

  - type: alignment_service_performed
    target: alignment_events
    meaning: An alignment is performed and the work order is closed.
    grain: one row per alignment work order
    distinguish_by: [event_date, odometer]
    fields:
      event_date: work order date
      store_id: servicing store
      odometer: odometer on the work order
      alignment_type: alignment performed
      service_basis: plan_included or member_early_price
      charge_amount: labor charged for the alignment
      parts_charge: parts, sensor reset and recalibration charged
    triggers: []

  - type: alignment_readjustment
    target: alignment_events
    meaning: An alignment measured out of specification within the guarantee is readjusted free.
    grain: one row per readjustment work order
    distinguish_by: [source_alignment_event_id, event_date]
    fields:
      event_date: work order date
      store_id: servicing store
      odometer: odometer on the work order
      alignment_type: alignment readjusted
      service_basis: always guarantee_readjustment
      charge_amount: always 0.00
      parts_charge: parts charged (parts are not covered by the readjustment guarantee)
      source_alignment_event_id: the alignment being corrected
    triggers: []

  - type: alignment_cancellation
    target: alignment_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The holder confirms cancellation of a plan inside the cancellation window.
    grain: one row per transaction
    fields:
      closed_date: cancellation date
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: alignment:alignment_refund
        map: {event_date: closed_date, payment_method: payment_method}

  - type: alignment_refund
    target: alignment_events
    meaning: The refund of a cancelled plan is paid.
    grain: one row per cancelled plan
    distinguish_by: [event_date]
    fields:
      event_date: refund date
      amount: refund paid
      payment_method: tender refunded
    triggers:
      - event: card:card_merchandise_credit
        when: {payment_method: crestline_card}
        map: {txn_date: event_date, amount: amount}

  - type: alignment_expiration
    target: alignment_plans
    mutation: {transition: {from: active, to: expired}}
    meaning: A month-based plan or a single service's guarantee reaches its expiration date.
    grain: one row per transaction
    fields:
      closed_date: day after expiration_date
    triggers: []

  - type: alignment_vehicle_retirement
    target: alignment_plans
    mutation: {transition: {from: active, to: vehicle_retired}}
    meaning: The plan ends because the purchaser no longer owns the vehicle.
    grain: one row per transaction
    fields:
      closed_date: date recorded
    triggers: []

measures:
  - id: alignment_msr_last_interval_alignment
    window: life of the plan up to the date of the event
    measure: event_date and odometer of the most recent alignment_service_performed row whose service_basis is plan_included, or member_early_price when early_price_counts_as_interval is true
  - id: alignment_msr_interval_reached
    window: from alignment_msr_last_interval_alignment to the date of the event
    measure: true when the event date is on or after the last interval alignment's date plus min_interval_months (calendar months, same day of month, falling back to the last day of the month) or the event odometer is at least the last interval alignment's odometer plus min_interval_miles; otherwise false
  - id: alignment_msr_included_alignments
    window: life of the plan up to the date of the event
    measure: count of alignment_service_performed rows on the plan with service_basis plan_included (the purchase-day alignment included)
  - id: alignment_msr_booking_count
    window: one appointment chain, from its first booking to the visit
    measure: count of alignment_appointment_booked rows made for the same visit (the original booking and each reschedule)
  - id: alignment_msr_tire_bundle
    window: tire_bundle_window_days before the plan purchase_date
    measure: true when the same vehicle has a Crestline tire set whose install_date falls within tire_bundle_window_days before the plan's purchase_date (purchase_date itself included); otherwise false
  - id: alignment_msr_commercial_use
    window: portfolio state on the date of the event
    measure: true when the vehicle's usage_class is commercial or its latest fleet roster row is fleet_vehicle_enrolled; otherwise false

# ---- policies ----
policies:
  - id: alignment_agg_multi_holding
    subject: [alignment_purchase]
    rule: >-
      A customer may hold any number of alignment services and plans, one per vehicle they own, and a plan is valid only
      on the vehicle it was bought for. Plans of different vehicles never share alignments, intervals or refunds. How
      many plans one vehicle may carry is governed by alignment_agg_one_per_vehicle.
    eligibility: []
    params: {max_per_customer: null}

  - id: alignment_agg_one_per_vehicle
    subject: [alignment_purchase]
    rule: >-
      Alignment holdings are aggregated per vehicle. A vehicle may carry only one active alignment service or plan at a
      time. The cap is holdings_per_vehicle_max. A customer who wants to move from a single service or a shorter plan to a longer
      one while the first is active buys the new plan only after the first has expired or been cancelled; a single
      service still inside its readjustment guarantee is not cancellable and runs to its expiration_date.
    eligibility:
      - id: one_active_per_vehicle
        applies_to: [alignment_purchase]
        kind: dedup
        condition: A vehicle may carry only one active alignment service or plan at a time.
        evidence_fields: [alignment_plans.vehicle_id, alignment_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.vehicle_id]]
          action_bindings: {alignment_plans.vehicle_id: vehicle_id}
        dedup_contract:
          table: alignment_plans
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [active]}
          distinct_fields: [purchase_date]

  - id: alignment_purchase_pricing
    subject: [alignment_purchase]
    rule: >-
      An alignment service or plan is sold for one vehicle whose class is in the tier's entry_gate list. A plan whose
      commercial_use_eligible is false is never sold for a vehicle in commercial use (alignment_msr_commercial_use).
      purchase_price is plan_price minus tire_bundle_discount when alignment_msr_tire_bundle is true, and plan_price
      otherwise; the bundle discount is never combined with a fleet discount, and when the ticket is charged to a fleet
      account the fleet discount applies only where fleet_discount_applicable is true. expiration_date is purchase_date
      plus plan_term_months, counted as calendar months to the same day of the month (falling back to the last day of
      that month); lifetime plans have no expiration_date. The plan is a line on a store ticket, often the tire ticket;
      when that ticket is paid with the Crestline card or charged to a fleet account, the ticket total posts once, as one
      card purchase or one fleet invoice per service category. The first alignment is performed on the purchase visit as an
      included alignment.
    eligibility: []
    formula:
      purchase_price: "plan_price - tire_bundle_discount if alignment_msr_tire_bundle else plan_price"
    measures: [alignment_msr_tire_bundle, alignment_msr_commercial_use]

  - id: alignment_evt_booking
    subject: [alignment_appointment_booked]
    rule: >-
      Appointments are booked only on a plan that is in force. The plan must be in status active when an appointment is
      booked. The slot must start at least booking_min_lead_hours after the booking and no more than booking_horizon_days
      after the booking date, for booking_slot_minutes of bay time, and for an alignment_type in alignment_types_covered.
      Moving an appointment books a new row; alignment_msr_booking_count may not exceed one plus reschedules_max. A
      customer who has not arrived late_release_minutes after the slot start loses the slot; no_show_fee is charged for it.
      Booking does not decide the price: whether the visit is included, at the member early price or a free readjustment
      is decided on the visit date under alignment_evt_service and alignment_evt_readjustment.
    eligibility:
      - id: plan_active_booking
        applies_to: [alignment_appointment_booked]
        kind: state
        condition: The plan must be in status active when an appointment is booked.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]
    measures: [alignment_msr_booking_count]

  - id: alignment_evt_service
    subject: [alignment_service_performed]
    rule: >-
      An alignment on a plan vehicle is performed and priced under the plan. The plan must be in status active when an
      alignment is performed under it. The alignment must be performed no later than the end of the plan term counted
      from the purchase of the plan. Months are counted as calendar months from the anchor date to the same day of the
      month, falling back to the last day of that month when that day does not exist. Lifetime plans have no term end and
      run while the purchaser owns the vehicle. A single service includes only its purchase-day alignment; any later
      alignment on it is charged member_early_alignment_price. On a plan the alignment is plan_included, with
      charge_amount 0.00, when alignment_msr_interval_reached is true (interval_basis whichever_comes_first) or it is the
      purchase-day alignment; before the interval is reached it is charged member_early_alignment_price as
      member_early_price, which restarts the interval when early_price_counts_as_interval is true. Only an alignment_type
      in alignment_types_covered is performed under the holding. When pre_alignment_inspection finds worn steering or
      suspension parts the alignment is not performed until they are repaired (worn_parts_block_alignment), and the
      visit uses nothing (blocked_visit_counts_as_used). parts_charge carries any of parts_charged_list the vehicle
      needed, plus steering_angle_reset_charge, plus adas_recalibration_charge when the vehicle requires a recalibration.
    eligibility:
      - id: plan_active_service
        applies_to: [alignment_service_performed]
        kind: state
        condition: The plan must be in status active when an alignment is performed under it.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]
      - id: within_plan_term
        applies_to: [alignment_service_performed]
        kind: time
        condition: The alignment must be performed no later than the end of the plan term counted from the purchase of the plan.
        evidence_fields: [alignment_plans.purchase_date, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase of the plan
          anchor_source: alignment_plans.purchase_date
          relation: not_after
          duration_source: variants.plan_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    params:
      per_tier:
        Crestline Two-Wheel Alignment: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline Four-Wheel Alignment: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline 1-Year Alignment Plan: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline 3-Year Alignment Plan: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline Lifetime Alignment Plan: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline Lifetime Alignment Plan Truck & Performance: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
    formula:
      charge_amount: "0 if alignment_msr_interval_reached else member_early_alignment_price"
    measures: [alignment_msr_interval_reached, alignment_msr_last_interval_alignment]

  - id: alignment_evt_readjustment
    subject: [alignment_readjustment]
    rule: >-
      Every alignment carries a readjustment guarantee. The readjustment must be performed no later than the end of the
      guarantee period counted from the alignment being corrected. Months are counted as calendar months from the anchor
      date to the same day of the month, falling back to the last day of that month when that day does not exist. The
      period is readjustment_guarantee_months, and the vehicle must also have run no more than
      readjustment_guarantee_miles since that alignment's odometer; whichever limit is reached first ends the guarantee.
      The vehicle must be measured out of specification (readjustment_condition) and the cause must not be one of
      readjustment_exclusions, as recorded by the technician. The readjustment labor is free (charge_amount 0.00); parts
      needed are charged as parts_charge under the parts warranty only when the part itself failed within
      parts_warranty_months and parts_warranty_miles. A readjustment cites the alignment it corrects and never counts as
      an included alignment or restarts the plan interval. The guarantee applies on any holding status the alignment was
      performed under, including a single service whose expiration_date is its guarantee end.
    eligibility:
      - id: within_guarantee
        applies_to: [alignment_readjustment]
        kind: time
        condition: The readjustment must be performed no later than the end of the guarantee period counted from the alignment being corrected.
        evidence_fields: [alignment_events.event_date, alignment_events.alignment_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_events.alignment_event_id]]
          action_bindings: {alignment_events.alignment_event_id: source_alignment_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the alignment being corrected
          anchor_source: alignment_events.event_date
          relation: not_after
          duration_source: variants.readjustment_guarantee_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive

  - id: alignment_evt_cancellation_refund
    subject: [alignment_cancellation, alignment_refund]
    rule: >-
      A plan may be cancelled for a refund only inside its cancellation window, and cancelling is the holder's own
      decision: the agent registers the request and the holder confirms it. The plan must be in status active when the
      cancellation is completed. The cancellation must be completed no later than the end of the cancellation window
      counted from the purchase of the plan. Calendar days are counted from the day after the anchor date, so the anchor
      date plus the number of days is the last qualifying date. The window is cancellation_window_days; a tier whose
      window is 0 (a single service) is never cancelled, and after the window nothing is refunded
      (cancellation_after_window). The refund is purchase_price minus used_alignment_deduction for each included
      alignment already performed (alignment_msr_included_alignments, the purchase-day alignment included), never below
      0.00; alignments charged at the member early price and readjustments are not deducted. The refund goes to the
      tender that paid for the plan (refund_tender).
    eligibility:
      - id: plan_active_cancel
        applies_to: [alignment_cancellation]
        kind: state
        condition: The plan must be in status active when the cancellation is completed.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]
      - id: within_cancellation_window
        applies_to: [alignment_cancellation]
        kind: time
        condition: The cancellation must be completed no later than the end of the cancellation window counted from the purchase of the plan.
        evidence_fields: [alignment_plans.purchase_date, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase of the plan
          anchor_source: alignment_plans.purchase_date
          relation: not_after
          duration_source: variants.cancellation_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    formula:
      amount: "max(purchase_price - used_alignment_deduction * alignment_msr_included_alignments, 0)"
    measures: [alignment_msr_included_alignments]

  - id: alignment_evt_plan_end
    subject: [alignment_expiration, alignment_vehicle_retirement]
    rule: >-
      A holding ends without a refund in two ways. The plan must be in status active when it ends. A month-based plan or
      single service expires the day after its expiration_date. Any plan ends as vehicle_retired on the date Crestline
      records that the purchaser no longer owns the vehicle (lifetime_ownership_proof: the vehicle is no longer on the
      purchaser's profile, or the customer reports the sale); because transferable is false and ends_on_vehicle_sale is
      true, the plan never moves to the buyer or to the purchaser's replacement vehicle. A readjustment owed on an
      alignment performed before the end remains available under alignment_evt_readjustment.
    eligibility:
      - id: plan_active_end
        applies_to: [alignment_expiration, alignment_vehicle_retirement]
        kind: state
        condition: The plan must be in status active when it ends.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]

  - id: alignment_commercial_use_exclusion
    subject: [alignment_service_performed, alignment_purchase]
    rule: >-
      Holding a Crestline fleet account changes what an alignment plan covers on the fleet's vehicles. A plan whose
      commercial_use_eligible is false gives no included alignment on a date when alignment_msr_commercial_use is true;
      the alignment is charged member_early_alignment_price instead, and the plan's interval is not restarted. The plan
      is not cancelled or refunded for this reason, and included alignments resume once the vehicle is back in personal
      use. Single services (commercial_use_eligible true) are unaffected and may be charged to a fleet account.
    eligibility: []
    measures: [alignment_msr_commercial_use]
