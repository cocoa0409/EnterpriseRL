# Policy charter: Battery Replacement Warranties (category key: battery)
# One holding = one Crestline battery sold (installed or carry-out) and its free-replacement and
# prorated warranty. Core deposits, free battery tests, free replacements, prorated adjustments
# and carry-out returns run against that holding.

category: battery
display_name: Battery Replacement Warranties

binding:
  holding_table: battery_warranties
  event_tables: [battery_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {core_deposit_balance: core_deposit}

lifecycle:
  states: [active, adjusted, expired, returned, removed]
  transitions:
    - {from: active, to: adjusted, by: agent, means: "A failed battery in the prorated period is adjusted and the customer's new battery opens its own warranty."}
    - {from: active, to: expired, by: system, means: "The warranty reaches the end of its prorated period (or its free period, for lines without proration)."}
    - {from: active, to: returned, by: user, means: "The customer returns an unused carry-out battery for a refund."}
    - {from: active, to: removed, by: agent, means: "The battery leaves the purchaser's vehicle for a reason other than a warranty claim (vehicle sold, battery removed)."}

accounts:
  - key: core_deposit
    unit: USD
    meaning: Refundable core deposit held when a battery is sold without the old battery being handed in; refunded when the core is returned in time, forfeited when it is not.

# ---- category-level parameter dictionary ----
parameter_schema:
  battery_price: Shelf price of the line in the most common group sizes, USD
  free_replacement_months: Months from purchase_date during which a failed battery is replaced free
  prorated_through_months: Months from purchase_date through which a failed battery earns a prorated credit after
    the free period (equal to free_replacement_months when there is no proration)
  proration_basis: How the prorated credit percentage is computed, enum text
  proration_price_basis: Price the credit percentage is applied to, enum text
  proration_pct_rounding: Rounding of the credit percentage, enum text
  months_in_service_basis: How months in service are counted, enum text
  free_replacements_max: Free replacements allowed during the free period, integer
  free_replacement_carries_original_warranty: Whether a free replacement keeps the original purchase_date and warranty,
    boolean
  free_replacement_installation_free: Whether installation of a free replacement is free, boolean
  prorated_installation_charge: Installation charge on the new battery bought with a prorated credit, USD (0.00
    = free)
  rated_cca: Rated cold cranking amps of the line's most common group size
  replace_threshold_pct_of_rated_cca: Measured CCA as a percentage of rated CCA at or below which a fully charged
    battery fails, percent
  reserve_capacity_minutes: Rated reserve capacity of the line's most common group size, minutes
  charge_and_retest_required: Whether a battery testing charge_and_retest must be charged and retested before any
    warranty decision, boolean
  charging_system_test_required: Whether the alternator and starter are tested before a warranty replacement, boolean
  charging_system_fault_voids_claim: Whether a failure caused by a faulty charging system is excluded until the
    fault is repaired, boolean
  excluded_causes: Failure causes not covered, list
  test_validity_days: Calendar days a test result remains usable as the basis of a replacement or adjustment
  free_battery_test: Whether battery and charging-system tests are free at any store, boolean
  installation_fee_standard: Installation fee for an under-hood battery, USD
  installation_fee_complex: Installation fee for a battery under a seat, in the trunk or requiring component removal,
    USD
  bms_registration_charge: Charge to register a new battery with the vehicle's battery management system where the
    vehicle requires it, USD
  terminal_service_included: Whether terminal cleaning and anti-corrosion treatment is included in installation,
    boolean
  memory_saver_used: Whether a memory saver is connected during installation, boolean
  core_charge: Refundable core deposit when no old battery is handed in on the ticket, USD
  core_return_window_days: Calendar days after purchase_date to return a core for the deposit refund
  core_refund_tender: Where a core refund goes, enum text
  core_acceptance: Which cores are accepted, enum text
  carry_out_return_days: Calendar days after purchase_date within which an unused carry-out battery may be returned
  carry_out_return_condition: Condition a returned carry-out battery must be in, enum text
  carry_out_restocking_fee_pct: Restocking fee on a carry-out return, percent of purchase_price
  installed_battery_returnable: Whether a battery Crestline installed can be returned for a refund outside a warranty
    claim, boolean
  commercial_use_free_months: Free replacement months that replace free_replacement_months when the vehicle is in
    commercial use
  commercial_use_prorated_through_months: Prorated months that replace prorated_through_months when the vehicle
    is in commercial use
  start_stop_compatible: Whether the line may be fitted to a start-stop vehicle, boolean
  transferable: Whether the warranty follows the battery to a new owner, boolean
  proof_of_purchase: How the original purchase is proven, enum text
  warranty_service_scope: Where a warranty claim may be made, enum text
  recharge_service_charge: Charge for slow-charging a discharged battery before a retest, USD (0.00 = free)
  claim_requires_original_vehicle: Whether a warranty claim is accepted only for the battery in the vehicle it was
    sold for, boolean
  holdings_per_vehicle_max: Active battery warranties one vehicle may carry (dual-battery trucks may carry two),
    integer
  recycling_fee: Crestline battery recycling handling fee per old battery taken, USD
  fleet_discount_applicable: Whether a fleet account's battery discount applies when the battery is charged to a
    fleet account, boolean
  replacement_same_line_required: Whether a free replacement must be the same line and group, boolean
  credit_applies_to: What a prorated credit may be spent on, enum text
  credit_cash_value: Whether a prorated credit has cash value, boolean
  min_credit_pct: Smallest prorated percentage issued; below it nothing is issued, integer percent

