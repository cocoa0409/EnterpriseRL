# ---- data flow ----
events:
  - type: battery_purchase
    target: battery_warranties
    mutation: create
    meaning: A Crestline battery is sold, installed in the vehicle or carried out, and its warranty starts.
    grain: one row per battery sold
    fields:
      customer_id: purchaser
      vehicle_id: vehicle it is for
      store_id: selling store
      variant_name: battery line
      purchase_date: ticket date
      install_type: installed or carry_out
      battery_group_size: BCI group
      purchase_price: battery price paid
      purchase_ticket_number: ticket number
      payment_method: tender used
      core_returned_at_purchase: whether a core was handed in
    triggers:
      - event: battery:battery_core_charge
        when: {core_returned_at_purchase: false}
        map: {event_date: purchase_date, store_id: store_id, ticket_number: purchase_ticket_number}
      - event: card:card_purchase
        when: {payment_method: crestline_card}
        map: {txn_date: purchase_date, store_id: store_id, source_ticket_number: purchase_ticket_number}
      - event: fleet:fleet_invoice_posted
        when: {payment_method: fleet_account}
        map: {txn_date: purchase_date, store_id: store_id, vehicle_id: vehicle_id, service_category: battery}

  - type: battery_core_charge
    target: battery_events
    meaning: A core deposit is collected because no old battery was handed in.
    grain: one row per battery sold without a core
    distinguish_by: [ticket_number]
    fields:
      event_date: ticket date
      store_id: selling store
      amount: deposit charged
      ticket_number: purchase ticket
    account: core_deposit
    direction: in
    triggers: []

  - type: battery_core_refund
    target: battery_events
    meaning: The core deposit is refunded when the old battery is brought back in time.
    grain: one row per core deposit refunded
    distinguish_by: [source_battery_event_id]
    fields:
      event_date: date the core was returned
      store_id: receiving store
      amount: deposit refunded
      source_battery_event_id: the core charge settled
      payment_method: tender refunded
    account: core_deposit
    direction: out
    triggers:
      - event: card:card_merchandise_credit
        when: {payment_method: crestline_card}
        map: {txn_date: event_date, amount: amount, store_id: store_id}

  - type: battery_core_forfeit
    target: battery_events
    meaning: The core deposit is forfeited when no core is returned within the window.
    grain: one row per core deposit forfeited
    distinguish_by: [source_battery_event_id]
    fields:
      event_date: day after the window ends
      amount: deposit forfeited
      source_battery_event_id: the core charge settled
    account: core_deposit
    direction: out
    triggers: []

  - type: battery_test
    target: battery_events
    meaning: A battery and charging-system test is performed and its printed result recorded.
    grain: one row per test printout
    distinguish_by: [event_date, test_result]
    fields:
      event_date: test date
      store_id: testing store
      test_result: tester result
      cca_measured: measured cold cranking amps
      months_in_service: whole months since purchase_date
    triggers: []

  - type: battery_free_replacement
    target: battery_events
    meaning: A failed battery in the free period is replaced with a new battery of the same line at no charge.
    grain: one row per free replacement
    distinguish_by: [source_battery_event_id]
    fields:
      event_date: replacement date
      store_id: replacing store
      months_in_service: whole months since purchase_date
      source_battery_event_id: the failed test it rests on
    triggers: []

  - type: battery_prorated_adjustment
    target: battery_events
    meaning: A failed battery in the prorated period earns a credit applied to a new Crestline battery on the same visit.
    grain: one row per prorated adjustment
    distinguish_by: [source_battery_event_id]
    fields:
      event_date: adjustment date
      store_id: adjusting store
      months_in_service: whole months since purchase_date
      credit_pct: prorated percentage
      replacement_price: current selling price of the same line
      amount: credit applied to the new battery
      source_battery_event_id: the failed test it rests on
      ticket_number: ticket of the new battery
    triggers:
      - event: battery:battery_adjusted_closure
        map: {closed_date: event_date}

  - type: battery_adjusted_closure
    target: battery_warranties
    mutation: {transition: {from: active, to: adjusted}}
    meaning: The adjusted battery's warranty closes; the new battery bought with the credit opens its own warranty.
    grain: one row per transaction
    fields:
      closed_date: adjustment date
    triggers: []

  - type: battery_carry_out_return
    target: battery_warranties
    mutation: {transition: {from: active, to: returned}}
    meaning: The customer returns an unused carry-out battery.
    grain: one row per transaction
    fields:
      closed_date: return date
      payment_method: original tender
    triggers:
      - event: battery:battery_return_refund
        map: {event_date: closed_date, payment_method: payment_method}

  - type: battery_return_refund
    target: battery_events
    meaning: The refund of a returned carry-out battery is paid.
    grain: one row per returned battery
    distinguish_by: [ticket_number]
    fields:
      event_date: refund date
      store_id: refunding store
      amount: refund paid
      ticket_number: original ticket
      payment_method: tender refunded
    triggers:
      - event: card:card_merchandise_credit
        when: {payment_method: crestline_card}
        map: {txn_date: event_date, amount: amount, source_ticket_number: ticket_number}
      - event: fleet:fleet_credit_memo
        when: {payment_method: fleet_account}
        map: {txn_date: event_date, amount: amount}

  - type: battery_expiration
    target: battery_warranties
    mutation: {transition: {from: active, to: expired}}
    meaning: The warranty reaches the end of its last covered month.
    grain: one row per transaction
    fields:
      closed_date: day after the last covered month ends
    triggers: []

  - type: battery_removal
    target: battery_warranties
    mutation: {transition: {from: active, to: removed}}
    meaning: The battery leaves the purchaser's vehicle for another reason (vehicle sold, battery removed).
    grain: one row per transaction
    fields:
      closed_date: date recorded
    triggers: []

measures:
  - id: battery_msr_months_in_service
    window: from purchase_date to the event date
    measure: whole calendar months elapsed from purchase_date to the event date (a month is complete on the same day of a later month, falling back to the last day of a shorter month)
  - id: battery_msr_free_replacements
    window: life of the warranty
    measure: count of battery_free_replacement rows on the warranty
  - id: battery_msr_commercial_use
    window: portfolio state on the date of the claim
    measure: true when the vehicle's usage_class is commercial or its latest fleet roster row is fleet_vehicle_enrolled; otherwise false
  - id: battery_msr_vehicle_active_batteries
    window: portfolio state on the purchase date
    measure: count of the vehicle's battery_warranties rows in status active

# ---- policies ----
policies:
  - id: battery_agg_multi_holding
    subject: [battery_purchase]
    rule: >-
      A customer may hold any number of battery warranties: each battery sold opens its own warranty with its own
      purchase date, core deposit and claim history, and warranties never pool free replacements or credits. How many
      active batteries one vehicle may carry is governed by battery_agg_vehicle_batteries.
    eligibility: []
    params: {max_per_customer: null}

  - id: battery_agg_vehicle_batteries
    subject: [battery_purchase, battery_removal]
    rule: >-
      Battery warranties are aggregated per vehicle. battery_msr_vehicle_active_batteries plus the new battery may not
      exceed holdings_per_vehicle_max of the new battery's line (two only for the dual-battery Commercial Heavy-Duty
      application). When a paid battery purchase replaces a battery whose warranty is still active outside any warranty
      claim, the old warranty is closed as removed first and only then is the new battery sold; a free replacement or a
      prorated adjustment closes or continues the old warranty under its own policy instead.
    eligibility: []
    measures: [battery_msr_vehicle_active_batteries]

  - id: battery_purchase_pricing
    subject: [battery_purchase]
    rule: >-
      A battery is sold in a BCI group listed for the vehicle, and a start-stop vehicle is fitted only with a line whose
      start_stop_compatible is true. The ticket is battery_price for the line, plus installation_fee_standard for an
      under-hood battery or installation_fee_complex for a battery under a seat, in the trunk or behind components, plus
      bms_registration_charge when the vehicle requires battery registration, plus recycling_fee, plus core_charge when
      no core is handed in on the ticket. Carry-out sales carry no installation fee or registration charge. Terminal
      service and a memory saver are part of every installation.
    eligibility: []
    formula:
      ticket_before_core: "battery_price + (0 if install_type == 'carry_out' else installation_fee_standard)"

  - id: battery_evt_core_deposit
    subject: [battery_core_charge, battery_core_refund, battery_core_forfeit]
    rule: >-
      A core deposit of core_charge is collected on every battery sold without an old battery handed in, and the core
      deposit is the only money the account holds. The core must be returned no later than the end of the core return
      window counted from the battery purchase on the original ticket. Calendar days are counted from the day after the
      anchor date, so the anchor date plus the number of days is the last qualifying date. The window is
      core_return_window_days; any lead-acid automotive battery is accepted as the core (core_acceptance). A core
      returned in time refunds the full deposit to the original tender (core_refund_tender); on the day after the window
      ends the deposit is forfeited in full. Each deposit is settled once, by a refund or a forfeit, citing the core charge
      it settles.
    eligibility:
      - id: within_core_window
        applies_to: [battery_core_refund]
        kind: time
        condition: The core must be returned no later than the end of the core return window counted from the battery purchase on the original ticket.
        evidence_fields: [battery_warranties.purchase_date, battery_warranties.battery_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[battery_warranties.battery_warranty_id]]
          action_bindings: {battery_warranties.battery_warranty_id: battery_warranty_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the battery purchase on the original ticket
          anchor_source: battery_warranties.purchase_date
          relation: not_after
          duration_source: variants.core_return_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
      - id: deposit_settled_once
        applies_to: [battery_core_refund, battery_core_forfeit]
        kind: dedup
        condition: Each deposit is settled once, by a refund or a forfeit, citing the core charge it settles.
        evidence_fields: [battery_events.source_battery_event_id, battery_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[battery_events.source_battery_event_id]]
          action_bindings: {battery_events.source_battery_event_id: source_battery_event_id}
        dedup_contract:
          table: battery_events
          mode: separate_record
          object_bindings: {source_battery_event_id: source_battery_event_id}
          duplicate_filters: {event_type: [battery_core_refund, battery_core_forfeit]}
          distinct_fields: [event_date]

  - id: battery_evt_test
    subject: [battery_test]
    rule: >-
      Battery and charging-system tests are free at any store (free_battery_test) and are the evidence of every warranty
      decision. A battery testing charge_and_retest is charged (at recharge_service_charge) and tested again before any
      decision, and only the retest counts. A fully charged battery fails when the tester shows replace or bad_cell, or
      when cca_measured is at or below replace_threshold_pct_of_rated_cca percent of rated_cca. When
      charging_system_test_required is true the alternator and starter are tested on the same visit; a
      charging_system_fault result means the battery failure is not decided until the fault is repaired
      (charging_system_fault_voids_claim). A warranty decision may rest only on a test no older than test_validity_days.
    eligibility: []

  - id: battery_evt_free_replacement
    subject: [battery_free_replacement]
    rule: >-
      A battery that fails inside its free period is replaced free with the same line and group
      (replacement_same_line_required), installed free (free_replacement_installation_free). The warranty must be in
      status active when a free replacement is made. The replacement must be made no later than the end of the free
      replacement period counted from the battery purchase on the original ticket. Months are counted as calendar months
      from the anchor date to the same day of the month, falling back to the last day of that month when that day does not
      exist. The period is free_replacement_months, or commercial_use_free_months under battery_commercial_use_coverage.
      The failure must be shown by a test under battery_evt_test, its cause must not be one of excluded_causes, and
      battery_msr_free_replacements must be below free_replacements_max; a further failure in the free period is handled
      as a prorated adjustment. The replacement keeps the original purchase_date and warranty
      (free_replacement_carries_original_warranty), so the holding stays active. When claim_requires_original_vehicle is
      true the claim is accepted only for the battery in the vehicle it was sold for.
    eligibility:
      - id: warranty_active_free
        applies_to: [battery_free_replacement]
        kind: state
        condition: The warranty must be in status active when a free replacement is made.
        evidence_fields: [battery_warranties.status, battery_warranties.battery_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[battery_warranties.battery_warranty_id]]
          action_bindings: {battery_warranties.battery_warranty_id: battery_warranty_id}
        state_contract:
          field: battery_warranties.status
          allowed: [active]
      - id: within_free_period
        applies_to: [battery_free_replacement]
        kind: time
        condition: The replacement must be made no later than the end of the free replacement period counted from the battery purchase on the original ticket.
        evidence_fields: [battery_warranties.purchase_date, battery_warranties.battery_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[battery_warranties.battery_warranty_id]]
          action_bindings: {battery_warranties.battery_warranty_id: battery_warranty_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the battery purchase on the original ticket
          anchor_source: battery_warranties.purchase_date
          relation: not_after
          duration_source: variants.free_replacement_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    params:
      per_tier:
        Crestline Standard 24-Month Battery: {free_months: "=free_replacement_months", prorated_months: "=prorated_through_months"}
        Crestline Plus 30-Month Battery: {free_months: "=free_replacement_months", prorated_months: "=prorated_through_months"}
        Crestline Gold 36-Month Battery: {free_months: "=free_replacement_months", prorated_months: "=prorated_through_months"}
        Crestline AGM 36-Month Battery: {free_months: "=free_replacement_months", prorated_months: "=prorated_through_months"}
        Crestline Platinum AGM 48-Month Battery: {free_months: "=free_replacement_months", prorated_months: "=prorated_through_months"}
        Crestline Commercial Heavy-Duty 18-Month Battery: {free_months: "=free_replacement_months", prorated_months: "=prorated_through_months"}
    measures: [battery_msr_free_replacements]

  - id: battery_evt_prorated_adjustment
    subject: [battery_prorated_adjustment, battery_adjusted_closure]
    rule: >-
      A battery that fails after its free period but within prorated_through_months of purchase_date (or the commercial
      figures under battery_commercial_use_coverage) earns a prorated credit toward a new Crestline battery bought on the
      same visit. The warranty must be in status active when the adjustment is made. months_in_service is
      battery_msr_months_in_service. credit_pct is the months remaining in the prorated period (prorated_through_months
      minus months_in_service) divided by prorated_through_months, times 100, rounded down to a whole percent; when it is
      below min_credit_pct nothing is issued, and a line whose proration_basis is not_applicable has no prorated period.
      The credit is credit_pct percent of replacement_price, the current selling price of the same line, rounded half up
      to the cent, and it is spent only on a same-or-higher line battery on the same visit (credit_applies_to); it has no
      cash value. The new battery is a new sale with its own warranty, installation charged at prorated_installation_charge,
      and the adjusted warranty closes as adjusted.
    eligibility:
      - id: warranty_active_adjust
        applies_to: [battery_prorated_adjustment]
        kind: state
        condition: The warranty must be in status active when the adjustment is made.
        evidence_fields: [battery_warranties.status, battery_warranties.battery_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[battery_warranties.battery_warranty_id]]
          action_bindings: {battery_warranties.battery_warranty_id: battery_warranty_id}
        state_contract:
          field: battery_warranties.status
          allowed: [active]
    formula:
      credit_pct: "(prorated_through_months - months_in_service) * 100 // prorated_through_months"
      amount: "round(replacement_price * credit_pct / 100, 2)"
    measures: [battery_msr_months_in_service]

  - id: battery_evt_carry_out_return
    subject: [battery_carry_out_return, battery_return_refund]
    rule: >-
      Only a carry-out battery can be returned for a refund; a battery Crestline installed is never returned outside a
      warranty claim (installed_battery_returnable). The battery must have been sold as carry-out and still be active when
      it is returned. The return is the customer's own decision and is confirmed by the customer. It must be completed
      within carry_out_return_days of purchase_date, counted in calendar days from the day after purchase_date, and the
      battery must be unused and fully charged (carry_out_return_condition) as checked by a test at the store. The refund
      is purchase_price minus carry_out_restocking_fee_pct percent of it, rounded half up to the cent, paid to the original
      tender; any core deposit still held is settled separately under battery_evt_core_deposit.
    eligibility:
      - id: carry_out_active
        applies_to: [battery_carry_out_return]
        kind: state
        condition: The battery must have been sold as carry-out and still be active when it is returned.
        evidence_fields: [battery_warranties.status, battery_warranties.install_type, battery_warranties.battery_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[battery_warranties.battery_warranty_id]]
          action_bindings: {battery_warranties.battery_warranty_id: battery_warranty_id}
        state_contract:
          field: battery_warranties.status
          allowed: [active]
    formula:
      amount: "round(purchase_price * (100 - carry_out_restocking_fee_pct) / 100, 2)"

  - id: battery_evt_warranty_end
    subject: [battery_expiration, battery_removal]
    rule: >-
      A battery warranty ends without a claim in two ways. The warranty must be in status active when it ends. It expires
      on the day after the last covered month, prorated_through_months after purchase_date. It is removed when Crestline
      records that the battery has left the purchaser's vehicle for any other reason, including the sale of the vehicle,
      since transferable is false. A core deposit still held at the end is settled under battery_evt_core_deposit.
    eligibility:
      - id: warranty_active_end
        applies_to: [battery_expiration, battery_removal]
        kind: state
        condition: The warranty must be in status active when it ends.
        evidence_fields: [battery_warranties.status, battery_warranties.battery_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[battery_warranties.battery_warranty_id]]
          action_bindings: {battery_warranties.battery_warranty_id: battery_warranty_id}
        state_contract:
          field: battery_warranties.status
          allowed: [active]

  - id: battery_commercial_use_coverage
    subject: [battery_free_replacement, battery_prorated_adjustment]
    rule: >-
      Holding a Crestline fleet account changes battery warranty terms on the fleet's vehicles. When
      battery_msr_commercial_use is true on the claim date, the free period is commercial_use_free_months and the prorated
      period is commercial_use_prorated_through_months in place of the line's personal-use figures, and credit_pct is
      computed on the commercial prorated period. The Commercial Heavy-Duty line has the same figures for both uses. When
      a battery is charged to a fleet account the fleet battery discount applies where fleet_discount_applicable is true.
    eligibility: []
    measures: [battery_msr_commercial_use]
