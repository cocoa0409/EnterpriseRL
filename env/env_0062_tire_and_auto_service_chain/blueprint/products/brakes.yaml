# Policy charter: Brake Service Warranties (category key: brakes)
# One holding = one brake job on one axle of one vehicle and the warranty of its pad line.
# Brake inspections, booked visits, warranty pad replacements, noise services and rotor work run
# against that holding.

category: brakes
display_name: Brake Service Warranties

binding:
  holding_table: brake_warranties
  event_tables: [brake_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [active, expired, superseded, voided]
  transitions:
    - {from: active, to: expired, by: system, means: "A limited warranty reaches its month or mile limit, whichever comes first."}
    - {from: active, to: superseded, by: agent, means: "A new paid brake job on the same axle replaces the warranty with the new job's warranty."}
    - {from: active, to: voided, by: agent, means: "The warranty ends because the purchaser no longer owns the vehicle or the vehicle entered a use the line does not cover."}

# Brake warranties carry no balance, allowance or deposit: entitlements are decided per visit from
# the job's date, odometer and the inspection, not drawn from a counted stock.
accounts: []

# ---- category-level parameter dictionary ----
parameter_schema:
  pads_price_per_axle: Price of the pad set for one axle, USD
  labor_price_per_axle: Labor for a pad replacement on one axle, USD
  hardware_kit_included: Whether new clips and shims are included, boolean
  hardware_kit_price: Price of a hardware kit when not included, USD per axle
  rotor_resurface_price_per_rotor: Price to resurface one rotor, USD
  rotor_replacement_price_per_rotor: Price of one new rotor installed, USD
  rotors_included: Whether new rotors are part of the job price, boolean
  complete_job_price_per_axle: Package price of the job per axle when rotors_included is true, USD (0.00 = not a
    package)
  caliper_service_included: Whether caliper slide pins are cleaned and lubricated in the job, boolean
  brake_fluid_exchange_price: Price of a brake fluid exchange added to the job, USD
  warranty_months: Pad warranty length, calendar months from service_date (0 = no month limit for lifetime pads)
  warranty_miles: Pad warranty length, miles from service_odometer (0 = no mile limit for lifetime pads)
  warranty_type: 'What the pad warranty covers, enum: defects_only, defects_and_wear (pads replaced when worn to
    minimum)'
  lifetime_pads: Whether pads are replaced for wear for as long as the purchaser owns the vehicle, boolean
  wear_replacement_parts_free: Whether the pads of a wear replacement are free, boolean
  wear_replacement_labor_charge: Labor charged for a warranty wear replacement, USD per axle (0.00 = free)
  defect_labor_covered_months: Calendar months from service_date within which labor for a defect replacement is
    free
  defect_labor_covered_miles: Miles from service_odometer within which labor for a defect replacement is free
  pad_minimum_thickness_mm: Pad thickness at or below which the pads are worn to minimum and must be replaced, millimetres
  premature_wear_threshold_pct: Share of the warranty miles below which wear to minimum is premature wear for a
    limited warranty, percent
  premature_wear_credit: What premature wear on a limited warranty earns, enum text
  noise_service_days: Calendar days after service_date within which a squeal or noise complaint is serviced free
  noise_services_max: Free noise services per warranty, integer
  rotor_warranty_months: Warranty on rotors installed on the job against warping or cracking, calendar months
  rotor_warranty_resurface_free: Whether resurfacing for vibration within the rotor warranty is free, boolean
  rotor_discard_rule: When a rotor must be replaced instead of resurfaced, enum text
  excluded_causes: Causes that void warranty coverage of a visit, list
  commercial_use_covered: Whether the warranty applies on a vehicle in commercial use, boolean
  transferable: Whether the warranty follows the vehicle to a new owner, boolean
  free_brake_inspection: Whether a brake inspection is free at any Crestline store, boolean
  inspection_required_before_claim: Whether every warranty visit starts with a measured inspection, boolean
  inspection_validity_days: Calendar days an inspection remains usable as the basis of a warranty visit
  booking_slot_minutes: Bay time reserved for a brake appointment, minutes
  booking_horizon_days: How far ahead a brake visit can be booked, calendar days
  booking_min_lead_hours: Minimum hours between booking and the appointment start
  reschedules_max: Times one brake appointment may be moved, integer
  store_scope: Where warranty work may be done, enum text
  proof_of_purchase: How the original job is proven, enum text
  replacement_carries_original_warranty: Whether pads installed under warranty keep the original job's warranty
    dates, boolean
  warranty_holdings_per_axle: Active brake warranties one axle of a vehicle may carry, integer
  shop_supplies_fee_pct: Shop supplies fee on labor of a paid visit, percent
  shop_supplies_fee_cap: Highest shop supplies fee per repair order, USD
  shop_supplies_on_warranty_visit: Whether shop supplies are charged on a visit where all labor is covered, boolean
  wear_replacements_max: Warranty wear replacements allowed per job, integer or unlimited (0 = wear not covered)
  brake_fluid_test_included: Whether a brake fluid moisture test is part of every inspection, boolean
  parking_brake_adjustment_included: Whether rear jobs include a parking brake adjustment, boolean
  ends_on_vehicle_sale: Whether the warranty ends when the purchaser no longer owns the vehicle, boolean
  fleet_discount_applicable: Whether a fleet account's brakes discount applies when the job is charged to a fleet
    account, boolean

