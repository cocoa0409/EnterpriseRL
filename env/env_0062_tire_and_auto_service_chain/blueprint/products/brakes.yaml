# ---- data flow ----
events:
  - type: brakes_service
    target: brake_warranties
    mutation: create
    meaning: A paid brake job is completed on one axle and its pad warranty starts.
    grain: one row per brake job per axle
    fields:
      customer_id: paying customer
      vehicle_id: vehicle serviced
      store_id: servicing store
      variant_name: brake service line
      service_date: repair order date
      service_odometer: odometer on the repair order
      axle: front or rear
      repair_order_number: repair order number
      pads_price: pad set price charged
      labor_charge: labor charged
      rotor_service: rotor work on the job
      payment_method: tender used
    triggers:
      - event: card:card_purchase
        when: {payment_method: crestline_card}
        map: {txn_date: service_date, store_id: store_id}
      - event: fleet:fleet_invoice_posted
        when: {payment_method: fleet_account}
        map: {txn_date: service_date, store_id: store_id, vehicle_id: vehicle_id, service_category: brakes}

  - type: brakes_appointment_booked
    target: brake_events
    meaning: A brake inspection or warranty visit is booked.
    grain: one row per appointment slot booked; a reschedule is a new row
    distinguish_by: [appointment_date, appointment_time]
    fields:
      event_date: booking date
      store_id: store booked
      appointment_date: appointment date
      appointment_time: slot start
    triggers: []

  - type: brakes_inspection
    target: brake_events
    meaning: A technician measures the pads on the warranted axle and records the finding.
    grain: one row per inspection repair order
    distinguish_by: [repair_order_number]
    fields:
      event_date: inspection date
      store_id: inspecting store
      odometer: odometer at inspection
      pad_thickness_mm: thinnest pad measured
      finding: technician's finding
      repair_order_number: inspection repair order
    triggers: []

  - type: brakes_warranty_pad_replacement
    target: brake_events
    meaning: Pads on the warranted axle are replaced under the warranty for wear or a defect.
    grain: one row per warranty replacement repair order
    distinguish_by: [repair_order_number]
    fields:
      event_date: replacement date
      store_id: servicing store
      odometer: odometer at replacement
      finding: worn_to_minimum, premature_wear or pad_defect
      repair_order_number: repair order of the replacement
      parts_charge: pads charged (0.00 when covered)
      labor_charge: labor charged (0.00 when covered)
      source_brake_event_id: the inspection it rests on
    triggers: []

  - type: brakes_noise_service
    target: brake_events
    meaning: A squeal or noise complaint after the job is serviced (pads cleaned, shims and lubrication renewed).
    grain: one row per noise service repair order
    distinguish_by: [repair_order_number]
    fields:
      event_date: service date
      store_id: servicing store
      odometer: odometer at service
      finding: always noise_squeal
      repair_order_number: repair order
      labor_charge: labor charged (0.00 when within the noise service period)
      source_brake_event_id: the inspection that confirmed the noise
    triggers: []

  - type: brakes_rotor_service
    target: brake_events
    meaning: Rotors on the warranted axle are resurfaced or replaced after an inspection finding.
    grain: one row per rotor service repair order
    distinguish_by: [repair_order_number]
    fields:
      event_date: service date
      store_id: servicing store
      odometer: odometer at service
      finding: rotor_below_discard or the vibration finding
      repair_order_number: repair order
      rotor_action: resurfaced or replaced
      parts_charge: rotors charged
      labor_charge: labor charged
      source_brake_event_id: the inspection it rests on
    triggers: []

  - type: brakes_expiration
    target: brake_warranties
    mutation: {transition: {from: active, to: expired}}
    meaning: A limited warranty reaches its month or mile limit.
    grain: one row per transaction
    fields:
      closed_date: date the limit was reached or recorded
    triggers: []

  - type: brakes_supersede
    target: brake_warranties
    mutation: {transition: {from: active, to: superseded}}
    meaning: A new paid brake job on the same axle replaces this warranty.
    grain: one row per transaction
    fields:
      closed_date: date of the new job
    triggers: []

  - type: brakes_void
    target: brake_warranties
    mutation: {transition: {from: active, to: voided}}
    meaning: The warranty ends because the vehicle was sold or entered a use the line does not cover.
    grain: one row per transaction
    fields:
      closed_date: date recorded
    triggers: []

measures:
  - id: brakes_msr_miles_since_job
    window: from the original job to the visit
    measure: odometer of the visit minus service_odometer
  - id: brakes_msr_wear_replacements
    window: life of the warranty
    measure: count of brakes_warranty_pad_replacement rows with finding worn_to_minimum or premature_wear
  - id: brakes_msr_noise_services
    window: life of the warranty
    measure: count of brakes_noise_service rows
  - id: brakes_msr_commercial_use
    window: portfolio state on the date of the visit
    measure: true when the vehicle's usage_class is commercial or its latest fleet roster row is fleet_vehicle_enrolled; otherwise false

# ---- policies ----
policies:
  - id: brakes_agg_multi_holding
    subject: [brakes_service]
    rule: >-
      A customer may hold any number of brake warranties: each brake job on each axle of each vehicle opens its own
      warranty, with its own dates, odometer and replacement history. Warranties never share replacements or noise
      services. How many warranties one axle may carry is governed by brakes_agg_one_per_axle.
    eligibility: []
    params: {max_per_customer: null}

  - id: brakes_agg_one_per_axle
    subject: [brakes_service, brakes_supersede]
    rule: >-
      Brake warranties are aggregated per axle of a vehicle. An axle may carry only one active brake warranty at a time.
      The cap is warranty_holdings_per_axle. When a new paid brake job is done on an axle that already has an active
      warranty, the older warranty is superseded on the date of the new job and the new job's warranty starts; a warranty
      replacement is not a new paid job and never supersedes anything (replacement_carries_original_warranty).
    eligibility:
      - id: one_active_per_axle
        applies_to: [brakes_service]
        kind: dedup
        condition: An axle may carry only one active brake warranty at a time.
        evidence_fields: [brake_warranties.vehicle_id, brake_warranties.axle, brake_warranties.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[brake_warranties.vehicle_id, brake_warranties.axle]]
          action_bindings: {brake_warranties.vehicle_id: vehicle_id, brake_warranties.axle: axle}
        dedup_contract:
          table: brake_warranties
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id, axle: axle}
          duplicate_filters: {status: [active]}
          distinct_fields: [service_date]

  - id: brakes_service_pricing
    subject: [brakes_service]
    rule: >-
      A brake job is priced per axle for a vehicle whose class is in the line's entry_gate. When rotors_included is true
      the job is sold at complete_job_price_per_axle, which includes new rotors, pads, hardware and labor. Otherwise the
      job is pads_price_per_axle plus labor_price_per_axle plus hardware_kit_price when hardware_kit_included is false,
      plus rotor_resurface_price_per_rotor or rotor_replacement_price_per_rotor for each of the axle's two rotors as the
      inspection requires under rotor_discard_rule, plus brake_fluid_exchange_price when the fluid test fails and the
      customer accepts the exchange. A shop supplies fee of shop_supplies_fee_pct percent of labor, capped at
      shop_supplies_fee_cap, is added to every paid repair order. The lifetime lines are sold only for a vehicle in
      personal use.
    eligibility: []
    formula:
      job_price: "complete_job_price_per_axle if rotors_included else pads_price_per_axle + labor_price_per_axle + (0 if hardware_kit_included else hardware_kit_price)"

  - id: brakes_evt_booking
    subject: [brakes_appointment_booked]
    rule: >-
      Brake visits are booked at any Crestline store (store_scope). The slot must start at least booking_min_lead_hours
      after the booking and no more than booking_horizon_days after the booking date, for booking_slot_minutes of bay
      time; one appointment may be moved reschedules_max times, each move booked as a new row. A booking does not decide
      coverage; every warranty visit begins with an inspection.
    eligibility: []

  - id: brakes_evt_inspection
    subject: [brakes_inspection]
    rule: >-
      Brake inspections are free at any store (free_brake_inspection) and are the evidence every warranty visit rests on.
      The warranty must be in status active when an inspection is recorded against it. The technician records the
      thinnest pad thickness and one finding; when brake_fluid_test_included is true the fluid is tested on the same
      visit. A warranty visit may rest only on an inspection no older than inspection_validity_days, counted in calendar
      days from the day after the inspection date. A thickness the customer measured, or a finding from another shop, is
      not an inspection.
    eligibility:
      - id: warranty_active_inspection
        applies_to: [brakes_inspection]
        kind: state
        condition: The warranty must be in status active when an inspection is recorded against it.
        evidence_fields: [brake_warranties.status, brake_warranties.brake_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[brake_warranties.brake_warranty_id]]
          action_bindings: {brake_warranties.brake_warranty_id: brake_warranty_id}
        state_contract:
          field: brake_warranties.status
          allowed: [active]

  - id: brakes_evt_warranty_replacement
    subject: [brakes_warranty_pad_replacement]
    rule: >-
      Pads are replaced under the warranty for a defect or for wear, as the line covers. The warranty must be in status
      active when a warranty replacement is made. A limited warranty covers a replacement made no later than the end of
      the warranty months counted from the original brake job, and only while brakes_msr_miles_since_job is within
      warranty_miles; lifetime lines (lifetime_pads true, warranty_months 0) have no month or mile limit while the
      purchaser owns the vehicle. Months are counted as calendar months from the anchor date to the same day of the
      month, falling back to the last day of that month when that day does not exist. A pad_defect is replaced with
      pads free, and labor free while within defect_labor_covered_months and defect_labor_covered_miles. Wear
      (worn_to_minimum: pad_thickness_mm at or below pad_minimum_thickness_mm) is covered only when warranty_type is
      defects_and_wear and brakes_msr_wear_replacements is below wear_replacements_max; the pads are free when
      wear_replacement_parts_free is true and labor is wear_replacement_labor_charge. On a defects_only line, wear to
      minimum before premature_wear_threshold_pct percent of warranty_miles is premature_wear and earns
      premature_wear_credit; later wear is not covered. A finding among excluded_causes is never covered. Pads installed
      under warranty keep the original job's dates and odometer.
    eligibility:
      - id: warranty_active_replacement
        applies_to: [brakes_warranty_pad_replacement]
        kind: state
        condition: The warranty must be in status active when a warranty replacement is made.
        evidence_fields: [brake_warranties.status, brake_warranties.brake_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[brake_warranties.brake_warranty_id]]
          action_bindings: {brake_warranties.brake_warranty_id: brake_warranty_id}
        state_contract:
          field: brake_warranties.status
          allowed: [active]
      - id: within_warranty_months
        applies_to: [brakes_warranty_pad_replacement]
        kind: time
        condition: A limited warranty covers a replacement made no later than the end of the warranty months counted from the original brake job, and only while brakes_msr_miles_since_job is within warranty_miles; lifetime lines (lifetime_pads true, warranty_months 0) have no month or mile limit while the purchaser owns the vehicle.
        evidence_fields: [brake_warranties.service_date, brake_warranties.brake_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[brake_warranties.brake_warranty_id]]
          action_bindings: {brake_warranties.brake_warranty_id: brake_warranty_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the original brake job
          anchor_source: brake_warranties.service_date
          relation: not_after
          duration_source: variants.warranty_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    params:
      per_tier:
        Crestline Value Brake Service 12-Month/12,000-Mile Warranty: {wear_parts_free: "=wear_replacement_parts_free", wear_labor: "=wear_replacement_labor_charge", wear_max: "=wear_replacements_max"}
        Crestline Standard Brake Service 24-Month/24,000-Mile Warranty: {wear_parts_free: "=wear_replacement_parts_free", wear_labor: "=wear_replacement_labor_charge", wear_max: "=wear_replacements_max"}
        Crestline Ceramic Brake Service 36-Month/36,000-Mile Warranty: {wear_parts_free: "=wear_replacement_parts_free", wear_labor: "=wear_replacement_labor_charge", wear_max: "=wear_replacements_max"}
        Crestline Premium Ceramic Lifetime Pad Warranty: {wear_parts_free: "=wear_replacement_parts_free", wear_labor: "=wear_replacement_labor_charge", wear_max: "=wear_replacements_max"}
        Crestline Complete Brake Service Lifetime Pad Warranty: {wear_parts_free: "=wear_replacement_parts_free", wear_labor: "=wear_replacement_labor_charge", wear_max: "=wear_replacements_max"}
        Crestline Severe-Duty Brake Service 12-Month/12,000-Mile Warranty: {wear_parts_free: "=wear_replacement_parts_free", wear_labor: "=wear_replacement_labor_charge", wear_max: "=wear_replacements_max"}
    measures: [brakes_msr_miles_since_job, brakes_msr_wear_replacements]

  - id: brakes_evt_noise_service
    subject: [brakes_noise_service]
    rule: >-
      A squeal or grinding noise soon after a brake job is serviced free when it is confirmed at inspection as
      noise_squeal. The noise service must be performed no later than the end of the noise service period counted from
      the original brake job. Calendar days are counted from the day after the anchor date, so the anchor date plus the
      number of days is the last qualifying date. The period is noise_service_days, and brakes_msr_noise_services must be
      below noise_services_max; after either limit the service is charged at labor_price_per_axle. Noise from worn pads,
      a seized caliper or contamination is not a noise service and follows its own finding.
    eligibility:
      - id: within_noise_period
        applies_to: [brakes_noise_service]
        kind: time
        condition: The noise service must be performed no later than the end of the noise service period counted from the original brake job.
        evidence_fields: [brake_warranties.service_date, brake_warranties.brake_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[brake_warranties.brake_warranty_id]]
          action_bindings: {brake_warranties.brake_warranty_id: brake_warranty_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the original brake job
          anchor_source: brake_warranties.service_date
          relation: not_after
          duration_source: variants.noise_service_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [brakes_msr_noise_services]

  - id: brakes_evt_rotor_service
    subject: [brakes_rotor_service]
    rule: >-
      Rotor work follows the inspection finding. A rotor measured below its OEM minimum thickness is replaced
      (rotor_discard_rule), never resurfaced. Rotors installed or resurfaced on the original job carry
      rotor_warranty_months from service_date against warping and cracking: within that period a vibration finding is
      resurfaced free when rotor_warranty_resurface_free is true and a cracked rotor is replaced free; outside it, or on a
      line whose rotor_warranty_months is 0, rotor work is charged at rotor_resurface_price_per_rotor or
      rotor_replacement_price_per_rotor per rotor. Rotors worn below minimum by normal wear are never covered.
    eligibility: []

  - id: brakes_evt_warranty_end
    subject: [brakes_expiration, brakes_supersede, brakes_void]
    rule: >-
      A brake warranty ends in three ways, and the warranty must be in status active when it ends. A limited warranty
      expires when warranty_months from service_date or warranty_miles from service_odometer is reached, whichever comes
      first; a lifetime warranty never expires on time or mileage. It is superseded when a new paid job is done on the
      same axle (brakes_agg_one_per_axle). It is voided when the purchaser no longer owns the vehicle
      (ends_on_vehicle_sale, transferable false), or when a lifetime line's vehicle enters commercial use under
      brakes_commercial_use_exclusion.
    eligibility:
      - id: warranty_active_end
        applies_to: [brakes_expiration, brakes_supersede, brakes_void]
        kind: state
        condition: the warranty must be in status active when it ends.
        evidence_fields: [brake_warranties.status, brake_warranties.brake_warranty_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[brake_warranties.brake_warranty_id]]
          action_bindings: {brake_warranties.brake_warranty_id: brake_warranty_id}
        state_contract:
          field: brake_warranties.status
          allowed: [active]

  - id: brakes_commercial_use_exclusion
    subject: [brakes_warranty_pad_replacement, brakes_void]
    rule: >-
      Holding a Crestline fleet account changes brake warranty coverage on the fleet's vehicles. A line whose
      commercial_use_covered is false (the lifetime lines) covers nothing on a date when brakes_msr_commercial_use is true,
      and its warranty is voided once the vehicle is recorded in commercial use; the limited lines and the Severe-Duty line
      cover commercial vehicles on their own terms. When a brake job is charged to a fleet account the fleet brakes
      discount applies only where fleet_discount_applicable is true.
    eligibility: []
    measures: [brakes_msr_commercial_use]
