    - 10
    - 17
    - 24
    payment_channels:
    - online
    - phone
    - mail
    - autopay
    payment_by_phone_fee: 0.0
    closure_balance_terms: existing_terms_and_promos_continue
    merchandise_credit_target: balance_of_original_ticket
    accounts_per_customer: 1

# ---- data flow ----
events:
  - type: card_application
    target: card_accounts
    mutation: create
    meaning: A customer applies for a Crestline credit card in store or online; the application goes to Northgate Bank for a decision.
    grain: one row per application
    fields:
      customer_id: applicant
      store_id: store taking the application (empty online)
      variant_name: product applied for
      application_date: submission date
      application_channel: in_store or online
      statement_closing_day: closing day chosen
      autopay_enrolled: whether autopay was chosen
    triggers: []

  - type: card_approval
    target: card_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: The bank approves the application and opens the account.
    grain: one row per transaction
    fields:
      open_date: approval date
      variant_name: product approved (may be a different product from the one applied for)
      credit_limit: limit assigned
      purchase_apr_pct: purchase APR assigned
      card_last4: last four digits of the new card
    triggers: []

  - type: card_decline
    target: card_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: The bank declines the application.
    grain: one row per transaction
    fields:
      closed_date: decision date
    triggers: []

  - type: card_purchase
    target: card_transactions
    meaning: A purchase posts to the card, at a Crestline store (optionally on a promotional plan) or, for Mastercard products, at another merchant.
    grain: one row per ticket (or outside merchant reference) posted
    distinguish_by: [source_ticket_number, promo_plan]
    fields:
      txn_date: posting date
      amount: purchase amount
      store_id: Crestline store (empty outside Crestline)
      source_ticket_number: ticket or merchant reference
      promo_plan: plan attached (none for a standard purchase)
      promo_expiration_date: last day of the plan (empty for none)
    account: card_balance
    direction: in
    triggers: []

  - type: card_payment
    target: card_transactions
    meaning: A payment is received on the account.
    grain: one row per payment confirmation number
    distinguish_by: [payment_reference]
    fields:
      txn_date: date the payment posted
      amount: payment amount
      payment_channel: channel used
      payment_reference: confirmation number
    account: card_balance
    direction: out
    triggers: []

  - type: card_payment_allocation
    target: card_transactions
    meaning: Part of a payment is allocated to a specific promotional purchase balance.
    grain: one row per payment per promo purchase it was allocated to
    distinguish_by: [payment_reference, source_card_txn_id]
    fields:
      txn_date: date the payment posted
      amount: part of the payment allocated to the promo purchase
      payment_reference: the payment allocated
      source_card_txn_id: the promo purchase receiving the allocation
    triggers: []

  - type: card_statement_issued
    target: card_transactions
    meaning: A billing cycle closes and a statement is produced with the new balance, minimum payment due and due date.
    grain: one row per billing cycle
    distinguish_by: [statement_date]
    fields:
      txn_date: statement closing date
      statement_date: statement closing date
      amount: new balance on the statement
      min_payment_due: minimum payment due
      payment_due_date: payment due date
    triggers: []

  - type: card_interest_charge
    target: card_transactions
    meaning: Standard interest for a billing cycle posts at statement closing.
    grain: one row per billing cycle
    distinguish_by: [statement_date]
    fields:
      txn_date: posting date
      statement_date: cycle the interest belongs to
      amount: interest charged
    account: card_balance
    direction: in
    triggers: []

  - type: card_deferred_interest_accrual
    target: card_transactions
    meaning: Interest accrued but not charged on a deferred-interest purchase during one billing cycle, shown on the statement.
    grain: one row per deferred-interest purchase per billing cycle
    distinguish_by: [statement_date, source_card_txn_id]
    fields:
      txn_date: statement closing date
      statement_date: cycle of the accrual
      amount: interest accrued in the cycle
      source_card_txn_id: the deferred-interest purchase
    triggers: []

  - type: card_deferred_interest_assessed
    target: card_transactions
    meaning: A deferred-interest purchase not paid in full by its expiration date is charged all interest accrued since the purchase date.
    grain: one row per deferred-interest purchase
    distinguish_by: [source_card_txn_id]
    fields:
      txn_date: posting date (the statement closing date following expiration)
      amount: accrued interest charged
      source_card_txn_id: the deferred-interest purchase
    account: card_balance
    direction: in
    triggers: []

  - type: card_late_fee
    target: card_transactions
    meaning: A late fee posts when the minimum payment was not received by the due date.
    grain: one row per statement whose minimum was missed
    distinguish_by: [statement_date]
    fields:
      txn_date: posting date (the day after the due date)
      statement_date: statement whose minimum was missed
      amount: late fee charged
    account: card_balance
    direction: in
    triggers: []

  - type: card_returned_payment
    target: card_transactions
    meaning: A payment is returned unpaid by the cardholder's bank and the payment amount is added back.
    grain: one row per returned payment
    distinguish_by: [payment_reference]
    fields:
      txn_date: date the return posted
      amount: payment amount added back
      payment_reference: the returned payment
    account: card_balance
    direction: in
    triggers: []

  - type: card_returned_payment_fee
    target: card_transactions
    meaning: A returned payment fee posts for a returned payment, unless the same event already triggers a late fee.
    grain: one row per returned payment
    distinguish_by: [payment_reference]
    fields:
      txn_date: posting date
      amount: fee charged
      payment_reference: the returned payment
    account: card_balance
    direction: in
    triggers: []

  - type: card_merchandise_credit
    target: card_transactions
    meaning: A Crestline refund on a ticket paid with the card posts as a credit.
    grain: one row per refunded ticket per posting date
    distinguish_by: [source_ticket_number, txn_date]
    fields:
      txn_date: posting date
      amount: credit amount
      store_id: refunding store
      source_ticket_number: original ticket refunded
    account: card_balance
    direction: out
    triggers: []

  - type: card_fee_reversal
    target: card_transactions
    meaning: A late fee or returned payment fee is reversed as a courtesy, as a billing-error correction, or because it was not permitted.
    grain: one row per fee reversed
    distinguish_by: [source_card_txn_id]
    fields:
      txn_date: posting date
      amount: amount reversed
      source_card_txn_id: the fee row reversed
      reversal_reason: why it was reversed
    account: card_balance
    direction: out
    triggers: []

  - type: card_credit_limit_change
    target: card_accounts
    mutation: update
    meaning: The bank changes the credit limit after an increase request or an account review.
    grain: one row per transaction
    fields:
      credit_limit: new limit
    triggers: []

  - type: card_product_change
    target: card_accounts
    mutation: update
    meaning: The account is moved to its upgrade product after an on-time payment review.
    grain: one row per transaction
    fields:
      variant_name: new product
      purchase_apr_pct: new purchase APR
      credit_limit: limit after the upgrade
    triggers: []

  - type: card_suspension
    target: card_accounts
    mutation: {transition: {from: active, to: suspended}}
    meaning: Charging privileges are suspended for a seriously past-due account.
    grain: one row per transaction
    fields: {status: suspended}
    triggers: []

  - type: card_reinstatement
    target: card_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: Charging privileges are restored once the past-due amount is paid.
    grain: one row per transaction
    fields: {status: active}
    triggers: []

  - type: card_closure
    target: card_accounts
    mutation: {transition: {from: active, to: closed}}
    meaning: The cardholder confirms closure of the account.
    grain: one row per transaction
    fields:
      closed_date: closure date
    triggers: []

  - type: card_bank_closure
    target: card_accounts
    mutation: {transition: {from: suspended, to: closed}}
    meaning: The bank closes a suspended account at the charge-off threshold.
    grain: one row per transaction
    fields:
      closed_date: closure date
    triggers: []

measures:
  - id: card_msr_promo_remaining
    window: one promo purchase, from its txn_date to the present
    measure: amount of the promo card_purchase row minus the sum of amount of card_payment_allocation rows whose source_card_txn_id is that purchase, minus the sum of card_merchandise_credit rows with the same source_ticket_number posted on or after the purchase
  - id: card_msr_accrued_deferred_interest
    window: one deferred-interest purchase, from its txn_date to its promo_expiration_date
    measure: sum of amount of card_deferred_interest_accrual rows whose source_card_txn_id is that purchase
  - id: card_msr_prior_late_fees
    window: the late_fee_repeat_window_cycles statements before the statement whose minimum was missed
    measure: count of card_late_fee rows (not reversed by a card_fee_reversal) whose statement_date falls on one of those statements
  - id: card_msr_prior_returned_fees
    window: the late_fee_repeat_window_cycles statements before the posting date
    measure: count of card_returned_payment_fee rows not reversed whose txn_date falls in those cycles
  - id: card_msr_courtesy_waivers_12m
    window: rolling 12 calendar months ending on the reversal date
    measure: count of card_fee_reversal rows with reversal_reason courtesy_waiver
  - id: card_msr_paid_by_due_date
    window: from the statement_date to the payment_due_date of one statement
    measure: sum of card_payment amounts posted after the statement_date and on or before the payment_due_date, less card_returned_payment amounts for those payments
  - id: card_msr_days_past_due
    window: from the earliest statement whose minimum remains unpaid to the present
    measure: calendar days since that statement's payment_due_date, 0 when every minimum due is paid
  - id: card_msr_on_time_streak
    window: consecutive statements ending with the latest one
    measure: number of consecutive statements, counted back from the latest, whose minimum payment was paid in full by the payment_due_date

# ---- policies ----
policies:
  - id: card_agg_multi_holding
    subject: [card_application]
    rule: >-
      A person may hold only one Crestline credit card account. A new application cannot be submitted while the applicant
      has another card account in status applied, active or suspended. A declined or closed account does not block a new
      application; the bank decides the new application on its own merits. Authorized users are added by the bank and
      are not separate accounts. Because the cap is one account, nothing is aggregated across card accounts.
    eligibility:
      - id: no_open_card_account
        applies_to: [card_application]
        kind: dedup
        condition: A new application cannot be submitted while the applicant has another card account in status applied, active or suspended.
        evidence_fields: [card_accounts.customer_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.customer_id]]
          action_bindings: {card_accounts.customer_id: customer_id}
        dedup_contract:
          table: card_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, suspended]}
          distinct_fields: [application_date]
    params: {max_per_customer: 1}

  - id: card_application_decision
    subject: [card_application, card_approval, card_decline]
    rule: >-
      A credit card application is the applicant's own credit request: it is submitted only on the applicant's own
      confirmation, never by the agent on the applicant's behalf, and Crestline staff never decide it. Northgate Bank
      underwrites every application against the product's entry_gate. The bank may approve the product applied for,
      approve a different product of the program (for example a Starter card when the Mastercard was requested), or
      decline. On approval the account opens with the approved product as variant_name, a credit_limit between that
      product's credit_limit_min and credit_limit_max, purchase_apr_pct equal to that product's purchase_apr_pct, and the
      statement_closing_day chosen from statement_closing_day_options. The agent never states a decision, a limit or a
      reason for decline before the bank's decision is on the account; the bank mails its own adverse action notice.
    eligibility: []

  - id: card_evt_purchase_promo
    subject: [card_purchase]
    rule: >-
      A purchase posts only while charging privileges are open. The account must be in status active when a purchase
      posts. A purchase that would take current_balance above credit_limit is declined at the register
      (over_limit_handling) and never posts; no over-limit fee exists. Products whose accepted_outside_crestline is false
      post Crestline tickets only. A promotional plan attaches to a purchase only when all of these hold: the plan is in
      the product's promo_plans_available; the purchase is a Crestline ticket (promo_eligible_merchants); the posted
      amount is at least promo_min_purchase for that plan; and, when promo_requires_account_current is true,
      card_msr_days_past_due is 0 on the purchase date. A purchase that misses any condition posts with promo_plan none
      as a standard purchase; it is never moved onto a plan later. promo_expiration_date is the purchase txn_date plus
      the plan's promo_term_months, counted as calendar months to the same day of the month (falling back to the last day
      of that month), minus one day. A Mastercard purchase outside Crestline in a foreign currency adds
      foreign_transaction_fee_pct percent of the amount to the same purchase row.
    eligibility:
      - id: account_active_purchase
        applies_to: [card_purchase]
        kind: state
        condition: The account must be in status active when a purchase posts.
        evidence_fields: [card_accounts.status, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
        state_contract:
          field: card_accounts.status
          allowed: [active]
    measures: [card_msr_days_past_due]

  - id: card_promo_stacking
    subject: [card_purchase]
    rule: >-
      A ticket carries at most one promotional plan (promos_per_ticket), so a deferred-interest plan and an equal-payment
      plan are mutually exclusive on the same ticket and the cardholder chooses one among those the purchase qualifies
      for. Crestline instant savings and set savings are taken off the ticket before it posts, so the promo minimum is
      compared with the posted amount after those savings; the two benefits stack in that order and never the other way
      round. Two tickets cannot be combined to reach a promo minimum, and one ticket cannot be split to place part on a
      plan and part as a standard purchase. A ticket charged to a Crestline fleet account never posts to a personal card,
      and a personal card ticket is never re-billed to a fleet account.
    eligibility: []

  - id: card_evt_statement
    subject: [card_statement_issued, card_interest_charge]
    rule: >-
      Each billing cycle closes on statement_closing_day and produces one statement. payment_due_date is the statement
      date plus grace_period_days. The minimum payment is the larger of min_payment_floor and min_payment_pct_of_balance
      percent of the new balance excluding equal-payment plan balances, rounded up to the whole dollar
      (min_payment_rounding), plus every amount listed in min_payment_includes (the fixed monthly payment of each
      equal-payment plan, any past-due amount and a late fee posted in the cycle); when the new balance is below
      min_payment_floor the minimum is the whole new balance; while a billing-error dispute is open the disputed amount
      is left out when disputed_amount_excluded_from_min is true. Standard interest is charged at purchase_apr_pct on the
      average daily standard balance using a daily periodic rate of purchase_apr_pct divided by
      daily_periodic_rate_basis_days; no interest is charged on standard purchases when the previous statement's new
      balance was paid in full by its due date. Deferred-interest balances are not charged interest during the plan;
      their interest is recorded as an accrual under card_evt_deferred_interest. Equal-payment balances carry interest at
      the plan's equal_pay_apr_pct, which is already inside the fixed monthly payment. When any interest is due in a
      cycle it is at least min_interest_charge.
    eligibility: []
    formula:
      pct_minimum: "max(min_payment_floor, amount * min_payment_pct_of_balance / 100)"

  - id: card_evt_payment_allocation
    subject: [card_payment, card_payment_allocation]
    rule: >-
      Payments are received through payment_channels with no fee (payment_by_phone_fee) and post the day they are
      received when received by payment_cutoff_time on a business day. The minimum payment is allocated under
      min_payment_allocation. Any amount above the minimum is allocated under payment_allocation_order, the balance with
      the highest APR first, except in two situations. First, during the promo_allocation_window_cycles billing cycles
      immediately before a deferred-interest plan expires, the amount above the minimum goes first to that plan's
      balance. Second, a cardholder may instruct that amounts above the minimum go to a particular deferred-interest
      plan; the instruction is the cardholder's own request and applies from the next payment that posts after it is
      submitted. Each part of a payment that reaches a promo purchase is recorded as an allocation row citing the
      payment and the purchase; allocation to a purchase never exceeds card_msr_promo_remaining for it.
    eligibility: []
    measures: [card_msr_promo_remaining]

  - id: card_evt_deferred_interest
    subject: [card_deferred_interest_accrual, card_deferred_interest_assessed]
    rule: >-
      Interest on a deferred-interest purchase accrues from the purchase date at purchase_apr_pct on the plan's
      remaining balance (deferred_interest_basis) and is shown each cycle as an accrual; it is not charged while the plan
      runs. Accrued interest may be assessed only after the promotional period counted from the promotional purchase has ended. The plan
      period is the plan's promo_term_months counted from the promotional purchase. Months are counted as calendar
      months from the anchor date to the same day of the month, falling back to the last day of that month when that
      day does not exist. When card_msr_promo_remaining is above 0.00 at the end of promo_expiration_date, all interest
      accrued since the purchase date, card_msr_accrued_deferred_interest, is assessed in one row at the next statement
      closing and the unpaid balance becomes a standard balance. When the balance is paid in full by
      promo_expiration_date nothing is assessed and the accruals lapse. A merchandise credit on the ticket reduces the
      remaining balance but never reverses an accrual already recorded. Equal-payment plans have no deferred interest.
    eligibility:
      - id: promo_period_ended
        applies_to: [card_deferred_interest_assessed]
        kind: time
        condition: Accrued interest may be assessed only after the promotional period counted from the promotional purchase has ended.
        evidence_fields: [card_transactions.txn_date, card_transactions.promo_expiration_date, card_transactions.card_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.card_txn_id]]
          action_bindings: {card_transactions.card_txn_id: source_card_txn_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the promotional purchase
          anchor_source: card_transactions.txn_date
          relation: not_before
          duration_source: variants.promo_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    formula:
      amount: "card_msr_accrued_deferred_interest if card_msr_promo_remaining > 0 else 0"
    measures: [card_msr_promo_remaining, card_msr_accrued_deferred_interest]

  - id: card_evt_late_fee
    subject: [card_late_fee]
    rule: >-
      A late fee is charged when the minimum payment due on a statement has not been received by its payment_due_date at
      payment_cutoff_time, measured by card_msr_paid_by_due_date. One late fee at most may be charged for each
      statement. No late fee is charged when the minimum payment due was 0.00 or when the payments received by the due
      date equal or exceed it. The fee is late_fee_repeat when card_msr_prior_late_fees is at least one, and
      late_fee_first otherwise; in either case it never exceeds the minimum payment due on that statement
      (late_fee_cap_basis). A late fee and a returned payment fee are never both charged for the same missed payment:
      when a returned payment is what made the minimum unpaid, only the late fee is charged.
    eligibility:
      - id: one_late_fee_per_statement
        applies_to: [card_late_fee]
        kind: dedup
        condition: One late fee at most may be charged for each statement.
        evidence_fields: [card_transactions.card_account_id, card_transactions.statement_date, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.card_account_id, card_transactions.statement_date]]
          action_bindings: {card_transactions.card_account_id: card_account_id, card_transactions.statement_date: statement_date}
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {card_account_id: card_account_id, statement_date: statement_date}
          duplicate_filters: {event_type: [card_late_fee]}
          distinct_fields: [txn_date]
    formula:
      amount: "min(late_fee_repeat if card_msr_prior_late_fees >= 1 else late_fee_first, min_payment_due)"
    measures: [card_msr_paid_by_due_date, card_msr_prior_late_fees]

  - id: card_evt_returned_payment
    subject: [card_returned_payment, card_returned_payment_fee]
    rule: >-
      A payment returned unpaid by the cardholder's bank is added back to the balance for its full amount and stops
      counting toward any minimum payment. A returned payment fee is charged for it at returned_payment_fee_repeat when
      card_msr_prior_returned_fees is at least one and at returned_payment_fee_first otherwise, never exceeding the
      minimum payment due on the most recent statement. When the returned payment leaves that statement's minimum unpaid
      after its due date has passed, a late fee is charged for the missed minimum and no returned payment fee is charged
      for the same event. A payment returned before the due date of the statement it was meant for, and replaced by
      another payment by that due date, carries the returned payment fee only.
    eligibility: []
    formula:
      fee: "returned_payment_fee_repeat if card_msr_prior_returned_fees >= 1 else returned_payment_fee_first"
    measures: [card_msr_prior_returned_fees]

  - id: card_evt_fee_reversal
    subject: [card_fee_reversal]
    rule: >-
      A late fee or returned payment fee can be reversed for one of three reasons, and each fee is reversed at most once.
      Each fee row may be reversed only once. courtesy_waiver: a late fee may be reversed as a courtesy when
      card_msr_courtesy_waivers_12m is below courtesy_late_fee_waivers_per_12_months and, when
      courtesy_waiver_requires_payment is true, the minimum payment that was missed has since been paid in full; a
      product whose courtesy_late_fee_waivers_per_12_months is 0 never reverses as a courtesy. billing_error: the bank
      found the fee resulted from its own error (a payment posted late, a misapplied payment). fee_not_permitted: the fee
      should never have posted under card_evt_late_fee or card_evt_returned_payment (a second fee for one event, a fee
      above the minimum due, a late fee on a statement whose minimum was met). The reversal is always the full amount of
      the fee row and cites it in source_card_txn_id. Interest is never reversed as a courtesy.
    eligibility:
      - id: one_reversal_per_fee
        applies_to: [card_fee_reversal]
        kind: dedup
        condition: Each fee row may be reversed only once.
        evidence_fields: [card_transactions.source_card_txn_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_transactions.source_card_txn_id]]
          action_bindings: {card_transactions.source_card_txn_id: source_card_txn_id}
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {source_card_txn_id: source_card_txn_id}
          duplicate_filters: {event_type: [card_fee_reversal]}
          distinct_fields: [txn_date]
    measures: [card_msr_courtesy_waivers_12m]
    params:
      per_tier:
        Crestline Auto Care Card Starter: {courtesy_waivers: "=courtesy_late_fee_waivers_per_12_months"}
        Crestline Auto Care Card: {courtesy_waivers: "=courtesy_late_fee_waivers_per_12_months"}
        Crestline Auto Care Card Preferred: {courtesy_waivers: "=courtesy_late_fee_waivers_per_12_months"}
        Crestline Auto Care Mastercard: {courtesy_waivers: "=courtesy_late_fee_waivers_per_12_months"}
        Crestline Auto Care Mastercard Preferred: {courtesy_waivers: "=courtesy_late_fee_waivers_per_12_months"}
        Crestline Auto Care World Mastercard: {courtesy_waivers: "=courtesy_late_fee_waivers_per_12_months"}

  - id: card_evt_merchandise_credit
    subject: [card_merchandise_credit]
    rule: >-
      A Crestline refund on a ticket that was paid with the card posts as a merchandise credit for the refund amount,
      also on a suspended or closed account. Under merchandise_credit_target the credit reduces the balance of the
      original ticket: when that ticket is on a promotional plan the credit reduces the plan's remaining balance
      (card_msr_promo_remaining) and is not available to pay other balances; when the credit exceeds what remains on the
      plan, the excess reduces the standard balance. A merchandise credit is never a payment: it does not count toward the
      minimum payment due and does not stop a late fee for a missed minimum.
    eligibility: []
    measures: [card_msr_promo_remaining]

  - id: card_billing_dispute
    subject: [card_fee_reversal, card_merchandise_credit]
    rule: >-
      A cardholder who believes a charge on a statement is wrong may dispute it with the bank. The dispute must reach the
      bank within dispute_window_days after the statement on which the charge first appeared, and it is the cardholder's
      own claim, registered as a request and confirmed by the cardholder before it is submitted. While it is open the
      disputed amount is handled under disputed_amount_excluded_from_min and the bank resolves it within
      dispute_resolution_max_days. The outcome posts only as the bank decides it: a merchandise credit when a Crestline
      store agrees the ticket was wrong, or a fee reversal with reversal_reason billing_error for a fee; a dispute lost
      by the cardholder posts nothing. The agent never posts a credit for a disputed charge before the bank's outcome.
    eligibility: []

  - id: card_evt_limit_and_product
    subject: [card_credit_limit_change, card_product_change]
    rule: >-
      Credit limit increases are requested by the cardholder and decided by the bank. An increase may be requested only
      after the account has been open for credit_line_increase_min_months_open calendar months counted from open_date,
      at least credit_line_increase_cooldown_months after the last limit change, with card_msr_days_past_due at 0 and no
      late fee in the last late_fee_repeat_window_cycles statements; the new limit is at most the current limit plus
      credit_line_increase_max_pct percent and never above credit_limit_max. An account whose card_msr_on_time_streak
      reaches upgrade_on_time_months is moved to upgrade_target_product; the purchase APR becomes the target product's
      purchase_apr_pct and the credit limit is kept, or raised to the target product's credit_limit_min when it is lower.
      A product with upgrade_target_product none is never moved. Promotional plans already on the account keep their
      terms through a product change.
    eligibility: []
    measures: [card_msr_on_time_streak, card_msr_days_past_due]

  - id: card_evt_account_status
    subject: [card_suspension, card_reinstatement, card_closure, card_bank_closure]
    rule: >-
      Account status follows the payment record. Charging privileges are suspended when card_msr_days_past_due exceeds
      suspension_days_past_due, restored when every past-due minimum is paid, and the bank closes a suspended account when
      card_msr_days_past_due reaches charge_off_days_past_due. Closing an account is the cardholder's own decision: the
      agent registers the closure request and the cardholder confirms it. The account must be in status active when the
      cardholder's closure is completed. A suspended account cannot be closed at the cardholder's request until it is
      reinstated. After closure no purchase posts; the remaining balance, including any promotional plan, is repaid under
      closure_balance_terms, and statements, interest, accruals, late fees and merchandise credits continue until the
      balance is zero.
    eligibility:
      - id: account_active_closure
        applies_to: [card_closure]
        kind: state
        condition: The account must be in status active when the cardholder's closure is completed.
        evidence_fields: [card_accounts.status, card_accounts.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[card_accounts.card_account_id]]
          action_bindings: {card_accounts.card_account_id: card_account_id}
        state_contract:
          field: card_accounts.status
          allowed: [active]
    measures: [card_msr_days_past_due]
