# Policy charter: Crestline Credit Card (category key: card)
# One holding = one Crestline Auto Care credit card account, issued by Northgate Bank, N.A. under
# Crestline's private-label and co-brand program. The ledger carries purchases (standard and
# promotional financing), statements, payments and their allocation, interest, deferred interest,
# fees, merchandise credits and fee reversals.

category: card
display_name: Crestline Credit Card

binding:
  holding_table: card_accounts
  event_tables: [card_transactions]
  intake_tables: [card_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: card_balance}

lifecycle:
  states: [applied, active, suspended, declined, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "Northgate Bank approves the application, assigns the product, credit limit and APR, and opens the account."}
    - {from: applied, to: declined, by: system, means: "Northgate Bank declines the application; an adverse action notice is mailed by the bank."}
    - {from: active, to: suspended, by: system, means: "The account is past due beyond the suspension threshold and charging privileges are blocked."}
    - {from: suspended, to: active, by: system, means: "The past-due amount is paid and charging privileges are restored."}
    - {from: active, to: closed, by: user, means: "The cardholder confirms closure; no new purchases are allowed and any balance is repaid under the existing terms."}
    - {from: suspended, to: closed, by: system, means: "The bank closes the account at the charge-off threshold."}

accounts:
  - key: card_balance
    unit: USD
    meaning: Total owed on the card account, including promotional balances; purchases, interest and fees add to it, payments, merchandise credits and fee reversals reduce it.

# ---- category-level parameter dictionary ----
parameter_schema:
  purchase_apr_pct: Standard variable purchase APR assigned at approval, percent
  daily_periodic_rate_basis_days: Days in the year used to turn the APR into a daily periodic rate
  credit_limit_min: Lowest credit limit the bank assigns on the product, USD
  credit_limit_max: Highest credit limit the product carries, USD
  annual_fee: Annual fee, USD
  min_interest_charge: Smallest interest charge assessed in a cycle in which any interest is due, USD
  grace_period_days: Days from the statement closing date to the payment due date; standard purchases paid in full
    by the due date incur no interest
  payment_cutoff_time: Time on the due date by which a payment must be received to be on time
  min_payment_floor: Lower bound of the minimum payment, USD (or the full new balance when that is less)
  min_payment_pct_of_balance: Percentage of the new balance (excluding equal-payment promo balances) that sets the
    minimum payment when it exceeds the floor, percent
  min_payment_rounding: Rounding of the percentage-based minimum payment, enum text
  min_payment_includes: Amounts added on top of the computed minimum, list
  late_fee_first: Late fee when no late fee was charged in the previous late_fee_repeat_window_cycles billing cycles,
    USD
  late_fee_repeat: Late fee when another late fee was charged within the previous late_fee_repeat_window_cycles
    billing cycles, USD
  late_fee_repeat_window_cycles: Billing cycles looked back to decide whether a late fee is a repeat
  late_fee_cap_basis: A late fee may not exceed this amount, enum text
  returned_payment_fee_first: Returned payment fee when none was charged in the previous late_fee_repeat_window_cycles
    cycles, USD
  returned_payment_fee_repeat: Returned payment fee when another was charged within the previous late_fee_repeat_window_cycles
    cycles, USD
  courtesy_late_fee_waivers_per_12_months: Late fees that may be reversed as a courtesy in any rolling 12 months,
    integer
  courtesy_waiver_requires_payment: Whether a courtesy waiver needs the missed minimum to have been paid in full
    before the reversal, boolean
  over_limit_handling: What happens to a purchase that would exceed the credit limit, enum text (no over-limit fee
    is ever charged)
  accepted_outside_crestline: Whether the card can be used at merchants other than Crestline, boolean
  foreign_transaction_fee_pct: Fee on purchases made in a foreign currency or processed outside the US, percent
  promo_plans_available: Promotional financing plans the product can receive on a Crestline purchase, list of promo_plan
    values
  promo_min_purchase: Smallest posted purchase amount that qualifies for each plan, USD by promo_plan
  promo_term_months: Length of each plan, calendar months from the purchase txn_date
  equal_pay_apr_pct: Reduced fixed APR of each equal-payment plan, percent by promo_plan
  equal_pay_payment_rounding: Rounding of the fixed monthly payment of an equal-payment plan, enum text
  deferred_interest_basis: How interest on a deferred-interest plan accrues, enum text
  promo_eligible_merchants: Where a purchase must be made to receive a promotional plan, enum text
  promo_requires_account_current: Whether the account must have no past-due amount on the purchase date to receive
    a plan, boolean
  promos_per_ticket: Promotional plans one ticket may carry, integer
  promo_allocation_window_cycles: Billing cycles before a deferred-interest plan expires during which payment above
    the minimum is allocated to that plan first
  payment_allocation_order: Order in which payment above the minimum is allocated outside the promo window, enum
    text
  min_payment_allocation: How the minimum payment itself is allocated, enum text
  credit_line_increase_min_months_open: Months the account must have been open before a credit limit increase request,
    calendar months from open_date
  credit_line_increase_cooldown_months: Months that must pass after a credit limit change before another increase
    request
  credit_line_increase_max_pct: Largest single increase as a percentage of the current limit, percent (never above
    credit_limit_max)
  upgrade_on_time_months: Consecutive on-time statements after which the account is reviewed for a product upgrade
    (0 = no upgrade path)
  upgrade_target_product: Product an eligible account is upgraded to, official tier name or none
  suspension_days_past_due: Days past the earliest unpaid due date after which charging privileges are suspended
  charge_off_days_past_due: Days past due at which the bank closes and charges off the account
  dispute_window_days: Days after the statement showing a charge within which a written billing-error dispute must
    reach the bank
  dispute_resolution_max_days: Longest time the bank takes to resolve a billing-error dispute, days
  disputed_amount_excluded_from_min: Whether the disputed amount and its finance charges are excluded from the minimum
    due while the dispute is open, boolean
  statement_closing_day_options: Statement closing days a cardholder may choose, list of days of month
  payment_channels: Channels accepted for payments, list
  payment_by_phone_fee: Fee for a payment made through a live phone representative, USD (automated phone payments
    are free)
  closure_balance_terms: How a balance left on a closed account is repaid, enum text
  merchandise_credit_target: Which balance a merchandise credit reduces, enum text
  accounts_per_customer: Crestline card accounts one person may hold, integer

