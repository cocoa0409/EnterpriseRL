# ---- data flow ----
events:
  - type: hazard_purchase
    target: hazard_certificates
    mutation: create
    meaning: A road hazard certificate is sold for a Crestline tire set and opened as pending until the set is installed.
    grain: one row per certificate sold
    fields:
      customer_id: certificate holder
      tire_set_id: covered tire set
      vehicle_id: vehicle of the covered set
      store_id: selling store
      variant_name: plan sold
      purchase_date: ticket date
      covered_tire_count: tires covered
      price_per_tire: certificate price per tire
      certificate_number: certificate number
      purchase_ticket_number: ticket the certificate was sold on
      payment_method: tender used
    triggers: []

  - type: hazard_activation
    target: hazard_certificates
    mutation: {transition: {from: pending, to: active}}
    meaning: The covered set is installed and coverage begins.
    grain: one row per transaction
    fields:
      effective_date: install_date of the covered set
      expiration_date: effective_date plus coverage_term_months
      variant_name: plan held (read to decide whether roadside calls are granted; not changed)
    triggers:
      - event: hazard:hazard_roadside_allowance_granted
        when: {variant_name: [Crestline Road Hazard Plus 36-Month Protection, Crestline Road Hazard Life-of-Tread Protection, Crestline Road Hazard Commercial LT Protection]}
        map: {event_date: effective_date}

  - type: hazard_roadside_allowance_granted
    target: hazard_events
    meaning: The plan's roadside service calls are credited when coverage starts.
    grain: one row per certificate activation
    distinguish_by: [event_date]
    fields:
      event_date: activation date
      service_units: calls granted
    account: roadside_allowance
    direction: in
    triggers: []

  - type: hazard_repair
    target: hazard_events
    meaning: A covered puncture is repaired free at a Crestline store.
    grain: one row per tire position repaired under one claim number
    distinguish_by: [claim_number, tire_position]
    fields:
      event_date: date booked
      service_date: date repaired
      store_id: repairing store
      claim_number: claim number
      odometer: odometer at repair
      tire_position: position repaired
      damage_type: damage found
      remaining_tread_32nds: tread measured
    triggers: []

  - type: hazard_replacement
    target: hazard_events
    meaning: A tire damaged beyond repair is replaced at a Crestline store with the plan paying its coverage share.
    grain: one row per tire position replaced under one claim number
    distinguish_by: [claim_number, tire_position]
    fields:
      event_date: date booked
      service_date: date replaced
      store_id: replacing store
      claim_number: claim number
      odometer: odometer at replacement
      tire_position: position replaced
      damage_type: damage found
      remaining_tread_32nds: tread measured on the damaged tire
      coverage_pct: share paid by the plan
      replacement_price: current selling price of the replacement tire
      amount: plan's share of the tire price
      customer_paid_amount: what the customer paid on the replacement ticket
    triggers: []

  - type: hazard_third_party_reimbursement
    target: hazard_events
    meaning: The holder is reimbursed for a covered repair, replacement or tow bought from another shop while out of the area.
    grain: one row per reimbursement type under one claim number
    distinguish_by: [claim_number, reimbursement_type]
    fields:
      event_date: date the reimbursement is approved
      service_date: date on the third-party receipt
      claim_number: claim number
      tire_position: position concerned (none for a tow)
      damage_type: damage on the receipt (none for a tow)
      remaining_tread_32nds: tread reported on the receipt or measured on the surrendered tire
      coverage_pct: share applied to a replacement (100 for a repair or tow)
      replacement_price: receipt amount
      amount: amount reimbursed
      reimbursement_type: repair, replacement or tow
      payment_method: tender the reimbursement goes to
    triggers: []

  - type: hazard_roadside_service
    target: hazard_events
    meaning: A roadside flat-tire change or tow is dispatched under the plan and one call is used.
    grain: one row per dispatched roadside call
    distinguish_by: [claim_number]
    fields:
      event_date: date booked
      service_date: date of the dispatch
      claim_number: claim number of the call
      roadside_service_type: flat_tire_change or tow
      service_units: calls used (always 1)
      tow_miles: towing distance
      amount: amount paid to the roadside provider
    account: roadside_allowance
    direction: out
    triggers: []

  - type: hazard_cancellation
    target: hazard_certificates
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The holder confirms cancellation of an active certificate.
    grain: one row per transaction
    fields:
      closed_date: cancellation date
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: hazard:hazard_cancellation_refund
        map: {event_date: closed_date, payment_method: payment_method}

  - type: hazard_void
    target: hazard_certificates
    mutation: {transition: {from: pending, to: cancelled}}
    meaning: A pending certificate is voided because its tire set was cancelled before installation.
    grain: one row per transaction
    fields:
      closed_date: void date
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: hazard:hazard_cancellation_refund
        map: {event_date: closed_date, payment_method: payment_method, refund_basis: void_before_install}

  - type: hazard_cancellation_refund
    target: hazard_events
    meaning: The certificate price, or its unexpired share, is refunded on cancellation or void.
    grain: one row per cancelled certificate
    distinguish_by: [refund_basis]
    fields:
      event_date: refund date
      amount: refund paid
      refund_basis: rule the refund was computed under
      payment_method: tender refunded
    triggers:
      - event: card:card_merchandise_credit
        when: {payment_method: crestline_card}
        map: {txn_date: event_date, amount: amount}
      - event: fleet:fleet_credit_memo
        when: {payment_method: fleet_account}
        map: {txn_date: event_date, amount: amount}

  - type: hazard_expiration
    target: hazard_certificates
    mutation: {transition: {from: active, to: expired}}
    meaning: Coverage ends at the expiration date or when the covered set closes.
    grain: one row per transaction
    fields:
      closed_date: date coverage ended
    triggers: []

measures:
  - id: hazard_msr_position_repairs
    window: the certificate term
    measure: count of hazard_repair rows on the certificate with the same tire_position
  - id: hazard_msr_position_replacements
    window: the certificate term
    measure: count of hazard_replacement rows plus hazard_third_party_reimbursement rows with reimbursement_type replacement on the certificate with the same tire_position
  - id: hazard_msr_claim_count
    window: the certificate term
    measure: count of distinct claim_number values on the certificate's hazard_repair, hazard_replacement, hazard_third_party_reimbursement and hazard_roadside_service rows
  - id: hazard_msr_benefits_paid
    window: the certificate term up to the cancellation date
    measure: sum of amount on the certificate's hazard_replacement, hazard_third_party_reimbursement and hazard_roadside_service rows
  - id: hazard_msr_original_tread
    window: static, read from the covered set's tier
    measure: original_tread_depth_32nds of the covered tire set's tier in the tires charter
  - id: hazard_msr_unexpired_months
    window: from the cancellation date to expiration_date
    measure: whole calendar months remaining in the term, counting only full months between the cancellation date and expiration_date (a partial month is not counted)
  - id: hazard_msr_commercial_use
    window: the certificate term up to the claim date
    measure: true when the vehicle's usage_class is commercial, or the vehicle was on a Crestline fleet account roster (a fleet_vehicle_enrolled row not ended by a later fleet_vehicle_removed row) at any time between effective_date and the claim date; otherwise false
  - id: hazard_msr_within_full_months
    window: from effective_date to the service_date of the claim
    measure: true when the service_date is on or before effective_date plus full_replacement_months, counted as calendar months to the same day of the month (falling back to the last day of that month); otherwise false
  - id: hazard_msr_set_unit_price
    window: static, read from the covered tire set
    measure: unit_price of the covered tire set (tire_sets.unit_price) on its original ticket

# ---- policies ----
policies:
  - id: hazard_agg_multi_holding
    subject: [hazard_purchase]
    rule: >-
      A customer may hold any number of road hazard certificates, one for each Crestline tire set they own; a
      household with three vehicles may carry three certificates of different plans. Certificates never pool repairs,
      replacements, roadside calls or claim counts with one another. How many certificates one tire set may carry is
      governed by hazard_agg_one_per_set.
    eligibility: []
    params: {max_per_customer: null}

  - id: hazard_agg_one_per_set
    subject: [hazard_purchase]
    rule: >-
      Certificates are aggregated per covered tire set. A tire set may carry only one certificate in status pending or
      active. A second plan for the same set is never sold alongside the first; a holder who wants a longer plan
      cancels the first certificate under hazard_evt_cancellation_refund and buys the new one, inside the new plan's
      purchase window. Because covers_whole_set_only is true, covered_tire_count equals the covered set's tire_count,
      less one when the set includes a full-size spare and spare_tire_covered is false.
    eligibility:
      - id: one_open_certificate_per_set
        applies_to: [hazard_purchase]
        kind: dedup
        condition: A tire set may carry only one certificate in status pending or active.
        evidence_fields: [hazard_certificates.tire_set_id, hazard_certificates.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hazard_certificates.tire_set_id]]
          action_bindings: {hazard_certificates.tire_set_id: tire_set_id}
        dedup_contract:
          table: hazard_certificates
          mode: separate_record
          object_bindings: {tire_set_id: tire_set_id}
          duplicate_filters: {status: [pending, active]}
          distinct_fields: [purchase_date]

  - id: hazard_purchase_eligibility
    subject: [hazard_purchase]
    rule: >-
      Road hazard protection is sold only on tires bought from Crestline. The covered tire set must be in status ordered
      or active when the certificate is sold. The certificate must be sold no later than the end of the purchase window
      counted from the purchase of the covered tire set. Calendar days are counted from the day after the anchor date,
      so the anchor date plus the number of days is the last qualifying date. The window is purchase_window_days, where
      0 means the certificate can only be sold on the same ticket as the tires. The vehicle's class must be in the plan's
      entry_gate list, and the plan's usage class must match the vehicle: the Commercial LT plan is sold only for a
      vehicle in commercial use (usage_class commercial or on a fleet account roster), and every other plan only for a
      vehicle in personal use. The price per tire is price_pct_of_tire_price percent of the covered set's unit_price,
      rounded half up to the cent, then raised to min_price_per_tire or lowered to max_price_per_tire when it falls
      outside them; the certificate price is price_per_tire times covered_tire_count. The certificate is a line on a
      store ticket, usually the tire ticket itself; when that ticket is paid with the Crestline card or charged to a fleet
      account, the ticket total including the certificate posts once, as one card purchase or one fleet invoice.
    eligibility:
      - id: covered_set_open
        applies_to: [hazard_purchase]
        kind: state
        condition: The covered tire set must be in status ordered or active when the certificate is sold.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [ordered, active]
      - id: within_purchase_window
        applies_to: [hazard_purchase]
        kind: time
        condition: The certificate must be sold no later than the end of the purchase window counted from the purchase of the covered tire set.
        evidence_fields: [tire_sets.purchase_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase of the covered tire set
          anchor_source: tire_sets.purchase_date
          relation: not_after
          duration_source: variants.purchase_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    formula:
      price_per_tire: "min(max(round(hazard_msr_set_unit_price * price_pct_of_tire_price / 100, 2), min_price_per_tire), max_price_per_tire)"
    measures: [hazard_msr_set_unit_price]

  - id: hazard_evt_activation
    subject: [hazard_activation, hazard_roadside_allowance_granted]
    rule: >-
      Coverage starts when the covered tires go on the vehicle, never on the sale date. The certificate must be in status
      pending when it is activated. effective_date is the covered set's install_date and expiration_date is
      effective_date plus coverage_term_months, counted as calendar months to the same day of the month (falling back to
      the last day of that month); for the Life-of-Tread plan coverage also ends earlier for any tire whose tread reaches
      coverage_min_tread_32nds. On activation a plan with roadside_calls_per_term above zero is credited that many
      roadside calls in one allowance row; a plan with zero is credited nothing. Unused calls never carry past the term
      (roadside_call_unused_carryover).
    eligibility:
      - id: certificate_pending
        applies_to: [hazard_activation]
        kind: state
        condition: The certificate must be in status pending when it is activated.
        evidence_fields: [hazard_certificates.status, hazard_certificates.hazard_certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hazard_certificates.hazard_certificate_id]]
          action_bindings: {hazard_certificates.hazard_certificate_id: hazard_certificate_id}
        state_contract:
          field: hazard_certificates.status
          allowed: [pending]

  - id: hazard_claim_coverage
    subject: [hazard_repair, hazard_replacement, hazard_third_party_reimbursement, hazard_roadside_service]
    rule: >-
      Every road hazard claim is first tested against the plan's coverage. The certificate must be in status active
      when a claim is paid. The service must be performed no later than the end of the plan term counted from the start
      of coverage on the covered set's installation. Months are counted as calendar months from the anchor date to the
      same day of the month, falling back to the last day of that month when that day does not exist. The damage must be
      one of covered_damage_types and its cause must not be one of excluded_causes; a Crestline technician inspects the
      tire before a repair or replacement when claim_inspection_required is true, and the recorded damage_type is the
      authority, not the holder's description. Commercial use is decided by hazard_commercial_use_exclusion. hazard_msr_claim_count, including the claim being opened, may not exceed
      certificate_claims_cap; a claim beyond the cap is not covered and the holder pays the store's regular price. A
      spare is covered only when spare_tire_covered is true. A position whose tire reached coverage_min_tread_32nds is
      no longer covered.
    eligibility:
      - id: certificate_active
        applies_to: [hazard_repair, hazard_replacement, hazard_third_party_reimbursement, hazard_roadside_service]
        kind: state
        condition: The certificate must be in status active when a claim is paid.
        evidence_fields: [hazard_certificates.status, hazard_certificates.hazard_certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hazard_certificates.hazard_certificate_id]]
          action_bindings: {hazard_certificates.hazard_certificate_id: hazard_certificate_id}
        state_contract:
          field: hazard_certificates.status
          allowed: [active]
      - id: within_plan_term
        applies_to: [hazard_repair, hazard_replacement, hazard_third_party_reimbursement, hazard_roadside_service]
        kind: time
        condition: The service must be performed no later than the end of the plan term counted from the start of coverage on the covered set's installation.
        evidence_fields: [hazard_certificates.effective_date, hazard_certificates.hazard_certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hazard_certificates.hazard_certificate_id]]
          action_bindings: {hazard_certificates.hazard_certificate_id: hazard_certificate_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the start of coverage on the covered set's installation
          anchor_source: hazard_certificates.effective_date
          relation: not_after
          duration_source: variants.coverage_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    measures: [hazard_msr_claim_count]

  - id: hazard_evt_repair
    subject: [hazard_repair]
    rule: >-
      A covered puncture that can be safely repaired is repaired free; a tire that cannot is replaced under
      hazard_evt_replacement. A puncture is repairable only when it is a puncture_tread in the repairable_zone, no
      larger than max_repairable_puncture_inches, and the tire's remaining tread is above min_tread_for_repair_32nds;
      a puncture_shoulder, a sidewall_cut, an impact_break or bead_damage is never repaired. The repair uses
      repair_method, including dismount, patch-plug, remount and balance, at no charge. hazard_msr_position_repairs,
      including this repair, may not exceed repairs_per_tire_max; a further puncture on that position after the limit
      is handled as a replacement when the plan still has a replacement for the position, and otherwise is repaired at
      the store's regular price outside the plan. Each repaired position under one claim_number is its own row.
    eligibility: []
    measures: [hazard_msr_position_repairs]

  - id: hazard_evt_replacement
    subject: [hazard_replacement]
    rule: >-
      A covered tire that cannot be repaired is replaced with the same tire at a Crestline store and the plan pays a
      share of the replacement tire's price. Each wheel position may be replaced only as many times as the plan
      allows. The limit is replacements_per_tire_max, counted by hazard_msr_position_replacements including
      out-of-area replacements. The plan pays 100 percent while both hold: hazard_msr_within_full_months is true and
      the tread worn (hazard_msr_original_tread minus remaining_tread_32nds) is at most full_replacement_wear_32nds.
      Otherwise coverage_pct is the remaining usable tread (remaining_tread_32nds minus coverage_min_tread_32nds)
      divided by the original usable tread (hazard_msr_original_tread minus coverage_min_tread_32nds), times 100,
      rounded down to a whole percent. amount is coverage_pct percent of replacement_price (the current selling price of
      the same tire on the service date), rounded half up to the cent. The customer pays replacement_price minus amount,
      plus the replacement tire's mounting and balancing unless replacement_includes_mounting is true, plus its valve
      stem or TPMS kit and disposal fee unless replacement_includes_valve_and_disposal is true, those charges being the
      ones of the tire's line in the tires charter; when tpms_sensor_damage_covered is true a sensor destroyed by the
      same hazard is replaced free. The damaged tire is kept by Crestline (damaged_tire_surrendered). When
      replacement_tire_carries_remaining_term is true the new tire stays covered to expiration_date; otherwise the
      position is no longer covered.
    eligibility: []
    params:
      per_tier:
        Crestline Road Hazard 12-Month Protection: {replacements_per_position: "=replacements_per_tire_max", full_replacement_months: "=full_replacement_months", full_replacement_wear: "=full_replacement_wear_32nds"}
        Crestline Road Hazard 24-Month Protection: {replacements_per_position: "=replacements_per_tire_max", full_replacement_months: "=full_replacement_months", full_replacement_wear: "=full_replacement_wear_32nds"}
        Crestline Road Hazard 36-Month Protection: {replacements_per_position: "=replacements_per_tire_max", full_replacement_months: "=full_replacement_months", full_replacement_wear: "=full_replacement_wear_32nds"}
        Crestline Road Hazard Plus 36-Month Protection: {replacements_per_position: "=replacements_per_tire_max", full_replacement_months: "=full_replacement_months", full_replacement_wear: "=full_replacement_wear_32nds"}
        Crestline Road Hazard Life-of-Tread Protection: {replacements_per_position: "=replacements_per_tire_max", full_replacement_months: "=full_replacement_months", full_replacement_wear: "=full_replacement_wear_32nds"}
        Crestline Road Hazard Commercial LT Protection: {replacements_per_position: "=replacements_per_tire_max", full_replacement_months: "=full_replacement_months", full_replacement_wear: "=full_replacement_wear_32nds"}
    formula:
      coverage_pct: "100 if hazard_msr_within_full_months and hazard_msr_original_tread - remaining_tread_32nds <= full_replacement_wear_32nds else (remaining_tread_32nds - coverage_min_tread_32nds) * 100 // (hazard_msr_original_tread - coverage_min_tread_32nds)"
      amount: "round(replacement_price * coverage_pct / 100, 2)"
    measures: [hazard_msr_position_replacements, hazard_msr_original_tread, hazard_msr_within_full_months]

  - id: hazard_evt_third_party_reimbursement
    subject: [hazard_third_party_reimbursement]
    rule: >-
      When a covered tire is damaged far from any Crestline store, the holder may pay another shop and be reimbursed.
      The damage must have occurred more than the out-of-area distance from the nearest Crestline store. The distance
      threshold is out_of_area_distance_miles; inside it the holder must use a Crestline store and nothing is
      reimbursed. The itemized receipt and the damaged tire or a photo of it (reimbursement_documents_required) must
      be submitted within reimbursement_claim_window_days of the service_date on the receipt, counted in calendar days
      from the day after that date. A repair is reimbursed at the receipt amount up to
      third_party_repair_reimbursement_cap. A replacement is reimbursed at coverage_pct, computed exactly as in
      hazard_evt_replacement from the tread on the receipt or on the surrendered tire, applied to the lower of the
      receipt amount and third_party_replacement_reimbursement_cap, rounded half up to the cent; a cap of 0.00 means the
      plan does not reimburse out-of-area replacements. A tow is reimbursed up to tow_reimbursement_cap only on plans
      whose roadside_service_types include tow, and it uses one roadside call. The reimbursement is paid to the
      tender the certificate was bought with.
    eligibility:
      - id: out_of_area
        applies_to: [hazard_third_party_reimbursement]
        kind: caller_fact
        condition: The damage must have occurred more than the out-of-area distance from the nearest Crestline store.
        evidence_fields: [hazard_certificates.hazard_certificate_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[hazard_certificates.hazard_certificate_id]]
          action_bindings: {hazard_certificates.hazard_certificate_id: hazard_certificate_id}
    formula:
      repair_amount: "min(replacement_price, third_party_repair_reimbursement_cap)"
      replacement_amount: "round(min(replacement_price, third_party_replacement_reimbursement_cap) * coverage_pct / 100, 2)"

  - id: hazard_evt_roadside
    subject: [hazard_roadside_service]
    rule: >-
      Roadside calls are dispatched through the plan's roadside_dispatch_channel only on plans that list the service in
      roadside_service_types. The certificate must have a roadside call remaining when a roadside service is dispatched.
      Each dispatched call uses one call whether it was a flat-tire change or a tow. A flat-tire change is paid up to
      flat_change_cap and a tow up to tow_reimbursement_cap, to the tow_destination; any amount above the cap is billed
      by the provider to the holder. A call requested after the allowance is used up is not covered.
    eligibility:
      - id: call_remaining
        applies_to: [hazard_roadside_service]
        kind: state
        condition: The certificate must have a roadside call remaining when a roadside service is dispatched.
        evidence_fields: [hazard_certificates.status, hazard_certificates.roadside_calls_remaining, hazard_certificates.hazard_certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hazard_certificates.hazard_certificate_id]]
          action_bindings: {hazard_certificates.hazard_certificate_id: hazard_certificate_id}
        state_contract:
          field: hazard_certificates.status
          allowed: [active]

  - id: hazard_evt_cancellation_refund
    subject: [hazard_cancellation, hazard_void, hazard_cancellation_refund]
    rule: >-
      A certificate can be cancelled by its holder at any time while active, and a pending certificate is voided when
      its tire set is cancelled. The cancellation is the holder's own decision: the agent registers the request and the
      holder confirms it. The certificate must be in status active when the holder's cancellation is completed. The
      refund is chosen by the first rule that applies, in this order. void_before_install: a pending certificate whose
      set was cancelled is refunded its full price. covered_set_returned: an active certificate whose covered set was
      returned under the satisfaction trial is refunded its full price. full_refund_window: a cancellation completed
      within cancellation_full_refund_days of purchase_date, counted in calendar days from the day after purchase_date,
      on a certificate with no claim number at all, is refunded its full price. pro_rata: otherwise the refund is the
      certificate price (price_per_tire times covered_tire_count) times hazard_msr_unexpired_months divided by
      coverage_term_months, rounded half up to the cent, minus cancellation_admin_fee, minus hazard_msr_benefits_paid
      when refund_reduced_by_claims is true, and never below 0.00. The refund goes to the tender that paid for the
      certificate. Remaining roadside calls lapse with the certificate.
    eligibility:
      - id: certificate_active_cancel
        applies_to: [hazard_cancellation]
        kind: state
        condition: The certificate must be in status active when the holder's cancellation is completed.
        evidence_fields: [hazard_certificates.status, hazard_certificates.hazard_certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hazard_certificates.hazard_certificate_id]]
          action_bindings: {hazard_certificates.hazard_certificate_id: hazard_certificate_id}
        state_contract:
          field: hazard_certificates.status
          allowed: [active]
    formula:
      pro_rata_refund: "max(round(price_per_tire * covered_tire_count * hazard_msr_unexpired_months / coverage_term_months, 2) - cancellation_admin_fee - (hazard_msr_benefits_paid if refund_reduced_by_claims else 0), 0)"
    measures: [hazard_msr_unexpired_months, hazard_msr_benefits_paid]

  - id: hazard_evt_expiration
    subject: [hazard_expiration]
    rule: >-
      Coverage ends on its own; the holder does nothing. The certificate must be in status active when it expires. It
      expires on the day after expiration_date, or earlier on the date the covered tire set closes as worn_out or
      retired, because the tires it covers are no longer in service. A covered set closed as returned does not expire the
      certificate; the certificate is cancelled with a covered_set_returned refund instead. Unused roadside calls and
      unused repairs or replacements lapse at expiry without any refund.
    eligibility:
      - id: certificate_active_expire
        applies_to: [hazard_expiration]
        kind: state
        condition: The certificate must be in status active when it expires.
        evidence_fields: [hazard_certificates.status, hazard_certificates.hazard_certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[hazard_certificates.hazard_certificate_id]]
          action_bindings: {hazard_certificates.hazard_certificate_id: hazard_certificate_id}
        state_contract:
          field: hazard_certificates.status
          allowed: [active]

  - id: hazard_commercial_use_exclusion
    subject: [hazard_repair, hazard_replacement, hazard_third_party_reimbursement, hazard_roadside_service]
    rule: >-
      Holding a Crestline fleet account changes what road hazard protection pays on the fleet's vehicles. When
      hazard_msr_commercial_use is true on the claim date, only a plan whose commercial_use_covered is true (the
      Commercial LT plan) pays the claim; every consumer plan pays nothing on a vehicle in commercial use, and the
      claim is serviced at the store's regular price. When hazard_msr_commercial_use is false every plan pays under
      its own terms. The holder's statement that a vehicle is used privately does not override a fleet roster record
      or a commercial usage_class.
    eligibility: []
    measures: [hazard_msr_commercial_use]

  - id: hazard_defect_exclusion
    subject: [hazard_repair, hazard_replacement]
    rule: >-
      Road hazard protection and the treadwear warranty's workmanship replacement are mutually exclusive for the same
      tire failure. A tire that failed from a manufacturing defect (tread separation, out-of-round, belt shift, a bead
      leak on a sound wheel) has not met a road hazard; it is handled under the tires charter's workmanship replacement
      and uses none of the certificate's repairs, replacements or claim count. Only damage the technician records as
      one of covered_damage_types is a road hazard.
    eligibility: []
