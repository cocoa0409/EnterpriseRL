# Policy charter: Road Hazard Protection (category key: hazard)
# One holding = one road hazard certificate sold on (or shortly after) a Crestline tire ticket,
# covering the tires of that set against non-repairable road damage: free repairs, prorated
# replacements, out-of-area reimbursements and, on the Plus, Life-of-Tread and Commercial plans,
# roadside service calls.

category: hazard
display_name: Road Hazard Protection

binding:
  holding_table: hazard_certificates
  event_tables: [hazard_events]
  intake_tables: [hazard_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {roadside_calls_remaining: roadside_allowance}

lifecycle:
  states: [pending, active, expired, cancelled]
  transitions:
    - {from: pending, to: active, by: system, means: "The covered tire set is installed; coverage starts on the install date and the expiration date is set."}
    - {from: pending, to: cancelled, by: agent, means: "The covered set is cancelled before installation, so the certificate is voided and refunded in full."}
    - {from: active, to: cancelled, by: user, means: "The holder confirms cancellation of the certificate and the refund is computed."}
    - {from: active, to: expired, by: system, means: "Coverage ends on the expiration date, or earlier when the covered set closes."}

accounts:
  - key: roadside_allowance
    unit: roadside service calls
    meaning: Roadside service calls available under the certificate for its term; granted when coverage starts and used one per dispatched service.

# ---- category-level parameter dictionary ----
parameter_schema:
  coverage_term_months: Plan term, calendar months from effective_date (Life-of-Tread runs until the tire reaches
    coverage_min_tread_32nds or this many months, whichever comes first)
  coverage_min_tread_32nds: Tread depth at or below which a tire is no longer covered, integer 32nds of an inch
  price_pct_of_tire_price: Certificate price per tire as a percentage of the tire set's unit_price, before the minimum
    and maximum are applied
  min_price_per_tire: Lowest certificate price per tire, USD
  max_price_per_tire: Highest certificate price per tire, USD
  price_rounding: How the percentage price per tire is rounded before the minimum and maximum, enum text
  purchase_window_days: Calendar days after the covered set's purchase_date during which the certificate may still
    be bought (0 = only on the tire ticket itself)
  covers_whole_set_only: Whether the certificate must cover every tire on the covered set's ticket, boolean
  full_replacement_months: Months from effective_date during which a covered replacement is paid at 100 percent,
    calendar months
  full_replacement_wear_32nds: Tread worn (original depth minus measured depth) up to which a replacement is paid
    at 100 percent, integer 32nds; full replacement ends when either this or full_replacement_months is passed
  proration_basis: How coverage_pct is computed after full replacement ends, enum text
  coverage_pct_rounding: Rounding of the prorated coverage percentage, enum text
  replacement_price_basis: Price the coverage percentage is applied to, enum text
  replacements_per_tire_max: Covered replacements allowed per wheel position over the term, integer
  repairs_per_tire_max: Covered repairs allowed per wheel position over the term, integer
  certificate_claims_cap: Claim numbers (repairs, replacements, reimbursements and roadside services together) allowed
    per certificate over the term, integer
  max_repairable_puncture_inches: Largest puncture diameter repaired rather than replaced, inches (industry patch-plug
    standard)
  repairable_zone: Part of the tire where a puncture may be repaired, enum text
  repair_method: Repair method used on a covered puncture, enum text
  covered_damage_types: Damage types the plan covers, list of hazard_events.damage_type values
  excluded_causes: Causes that void a claim whatever the damage, list
  replacement_includes_mounting: Whether mounting and balancing of a covered replacement is free, boolean
  replacement_includes_valve_and_disposal: Whether the valve stem (or TPMS kit) and disposal fee on a covered replacement
    are free, boolean
  replacement_tire_carries_remaining_term: Whether the replacement tire stays covered for the rest of the term,
    boolean (false = the position is no longer covered)
  spare_tire_covered: Whether a matching full-size spare on the set is covered, boolean
  roadside_calls_per_term: Roadside service calls granted when coverage starts, integer
  roadside_service_types: Roadside services the plan dispatches, list of roadside_service_type values
  tow_reimbursement_cap: Most the plan pays for one tow, USD
  tow_destination: Where a covered tow goes, enum text
  flat_change_cap: Most the plan pays for one roadside flat-tire change, USD
  out_of_area_distance_miles: Distance from the nearest Crestline store beyond which a third-party repair or replacement
    may be reimbursed, miles
  third_party_repair_reimbursement_cap: Most reimbursed for one out-of-area repair, USD
  third_party_replacement_reimbursement_cap: Most reimbursed for one out-of-area replacement before coverage_pct
    is applied, USD (0.00 = not reimbursed)
  reimbursement_claim_window_days: Calendar days after the third-party service date within which the receipt must
    be submitted
  reimbursement_documents_required: Documents a reimbursement needs, list
  damaged_tire_surrendered: Whether a damaged tire replaced at a Crestline store is kept by Crestline, boolean
  cancellation_full_refund_days: Calendar days after purchase_date within which a cancellation with no claim is
    refunded in full
  cancellation_admin_fee: Fee withheld from a pro-rata cancellation refund, USD
  cancellation_refund_method: How a refund after the full-refund window is computed, enum text
  refund_reduced_by_claims: Whether plan benefits already paid are deducted from a pro-rata refund, boolean
  transferable: Whether the certificate follows the vehicle to a new owner, boolean
  commercial_use_covered: Whether damage on a vehicle in commercial use is covered, boolean
  tpms_sensor_damage_covered: Whether a TPMS sensor destroyed by the same road hazard is replaced free, boolean
  min_tread_for_repair_32nds: Tread depth at or below which a puncture is not repaired, integer 32nds
  coverage_start_event: Event that starts coverage, enum text
  claim_inspection_required: Whether a Crestline technician must inspect the tire before a repair or replacement
    claim, boolean
  roadside_dispatch_channel: How a roadside call is requested, enum text
  roadside_call_unused_carryover: Whether unused roadside calls carry to anything after the term, boolean
  certificate_price_basis_tire_count: Which tire count the certificate price is multiplied by, enum text

