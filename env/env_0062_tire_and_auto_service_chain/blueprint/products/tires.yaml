# ---- data flow ----
events:
  - type: tires_purchase
    target: tire_sets
    mutation: create
    meaning: A customer buys a ticket of Crestline house-brand tires for one vehicle; the set is opened in the ordered state until it is mounted.
    grain: one row per sales ticket of tires for one vehicle
    fields:
      customer_id: the buying customer
      vehicle_id: the vehicle the tires are fitted to
      store_id: the selling and installing store
      variant_name: official tire line and warranty class
      purchase_date: ticket date
      tire_count: tires on the ticket
      tire_size: size of the tires
      unit_price: selling price per tire before installation charges
      purchase_ticket_number: ticket number
      payment_method: tender used on the ticket
    triggers:
      - event: card:card_purchase
        when: {payment_method: crestline_card}
        map: {txn_date: purchase_date, store_id: store_id, source_ticket_number: purchase_ticket_number}
      - event: fleet:fleet_invoice_posted
        when: {payment_method: fleet_account}
        map: {txn_date: purchase_date, store_id: store_id, vehicle_id: vehicle_id, service_category: tires}

  - type: tires_installation_booked
    target: tire_events
    meaning: An installation appointment is booked (or moved) for an ordered set at a store bay.
    grain: one row per appointment slot booked for the set; a reschedule is a new row with the new slot
    distinguish_by: [appointment_date, appointment_time]
    fields:
      event_date: date the booking was made
      store_id: store whose bay is booked
      appointment_date: date of the appointment
      appointment_time: slot start time
      service_code: always tire_installation
    triggers: []

  - type: tires_installation_completed
    target: tire_sets
    mutation: {transition: {from: ordered, to: active}}
    meaning: The tires are mounted and the installation work order is closed with the odometer reading.
    grain: one row per transaction
    fields:
      install_date: date the work order closed
      install_odometer: odometer on the installation work order
      store_id: installing store
    triggers: []

  - type: tires_rotation_service
    target: tire_events
    meaning: A rotation (with or without balancing) is performed on an active set and documented on a work order.
    grain: one row per rotation work order on the set
    distinguish_by: [event_date, odometer, service_code]
    fields:
      event_date: work order date
      store_id: servicing store
      odometer: odometer on the work order
      tire_position: always ALL
      service_code: rotation_and_balance or rotation_only
      charge_amount: price charged for the service under the line's rotation pricing
    triggers: []

  - type: tires_tread_inspection
    target: tire_events
    meaning: A technician measures one tire's tread depth and records its wear pattern, the evidence an adjustment or workmanship replacement rests on.
    grain: one row per tire position measured on one inspection date
    distinguish_by: [event_date, tire_position]
    fields:
      event_date: inspection date
      store_id: inspecting store
      odometer: odometer at inspection
      tire_position: wheel position inspected
      min_tread_depth_32nds: lowest main-groove depth
      wear_pattern: recorded wear pattern
    triggers: []

  - type: tires_treadwear_adjustment
    target: tire_events
    meaning: A tire worn out before its warranted miles is adjusted and a prorated credit is issued on the set.
    grain: one row per tire position adjusted
    distinguish_by: [source_tire_event_id, tire_position]
    fields:
      event_date: adjustment date
      store_id: adjusting store (empty when processed by the customer care desk)
      odometer: odometer of the inspection the adjustment rests on
      tire_position: position adjusted
      current_selling_price: store price of the same tire on the adjustment date
      miles_driven: inspection odometer minus install_odometer
      credit_pct: prorated percentage granted
      amount: credit issued
      source_tire_event_id: the tread inspection the adjustment rests on
    account: adjustment_credit
    direction: in
    triggers: []

  - type: tires_workmanship_replacement
    target: tire_events
    meaning: A tire with a manufacturing defect is replaced, free inside the free-replacement period and at the customer's prorated share after it.
    grain: one row per defective tire position replaced
    distinguish_by: [source_tire_event_id, tire_position]
    fields:
      event_date: replacement date
      store_id: replacing store
      odometer: odometer at replacement
      tire_position: position replaced
      defect_code: defect found
      current_selling_price: store price of the same tire on the replacement date
      source_tire_event_id: the inspection that found the defect
      charge_amount: customer's share charged (0.00 when free)
    triggers: []

  - type: tires_adjustment_credit_applied
    target: tire_events
    meaning: An adjustment credit is applied toward the purchase of replacement tires.
    grain: one row per credit applied to one replacement ticket
    distinguish_by: [source_tire_event_id, ticket_number]
    fields:
      event_date: date of the replacement ticket
      store_id: store of the replacement ticket
      amount: credit used
      source_tire_event_id: the adjustment that issued the credit
      ticket_number: replacement ticket the credit was applied to
    account: adjustment_credit
    direction: out
    triggers: []

  - type: tires_adjustment_credit_expired
    target: tire_events
    meaning: The unused part of an adjustment credit is forfeited when its validity period lapses.
    grain: one row per adjustment credit lapsing
    distinguish_by: [source_tire_event_id]
    fields:
      event_date: date the lapse is booked
      amount: unused credit forfeited
      source_tire_event_id: the adjustment whose credit lapsed
    account: adjustment_credit
    direction: out
    triggers: []

  - type: tires_refund
    target: tire_events
    meaning: Money is returned to the customer on a tire ticket, for a satisfaction-trial return or an order cancellation.
    grain: one row per refund reason per ticket
    distinguish_by: [refund_reason, ticket_number]
    fields:
      event_date: refund date
      store_id: refunding store
      amount: refund paid
      ticket_number: the original purchase ticket refunded
      payment_method: tender the refund goes back to
      refund_reason: why the refund is paid
    triggers:
      - event: card:card_merchandise_credit
        when: {payment_method: crestline_card}
        map: {txn_date: event_date, amount: amount, source_ticket_number: ticket_number}
      - event: fleet:fleet_credit_memo
        when: {payment_method: fleet_account}
        map: {txn_date: event_date, amount: amount}

  - type: tires_satisfaction_return
    target: tire_sets
    mutation: {transition: {from: active, to: returned}}
    meaning: The customer confirms a satisfaction-trial return and the set comes off the vehicle.
    grain: one row per transaction
    fields:
      closed_date: date the return was completed
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: tires:tires_refund
        map: {refund_reason: satisfaction_trial_return}

  - type: tires_order_cancellation
    target: tire_sets
    mutation: {transition: {from: ordered, to: cancelled}}
    meaning: An ordered set that was never installed is cancelled, on the customer's request or when the hold period lapses.
    grain: one row per transaction
    fields:
      closed_date: cancellation date
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: tires:tires_refund
        map: {refund_reason: order_cancellation}

  - type: tires_worn_out_closure
    target: tire_sets
    mutation: {transition: {from: active, to: worn_out}}
    meaning: The last warranted tire of the set has been adjusted or replaced, so the set closes as worn out.
    grain: one row per transaction
    fields:
      closed_date: date of the last adjustment or replacement
    triggers: []

  - type: tires_set_retirement
    target: tire_sets
    mutation: {transition: {from: active, to: retired}}
    meaning: The set leaves service for any other reason (vehicle sold, tires removed, term or mileage exhausted).
    grain: one row per transaction
    fields:
      closed_date: retirement date
    triggers: []

measures:
  - id: tires_msr_rotation_max_gap
    window: life of the set, from install_odometer to the odometer of the inspection an adjustment rests on
    measure: largest odometer difference between consecutive points of the sequence install_odometer, each tires_rotation_service odometer in ascending order, and the inspection odometer
  - id: tires_msr_position_adjustments
    window: life of the set
    measure: count of tires_treadwear_adjustment rows on the set with the same tire_position
  - id: tires_msr_vehicle_trial_returns
    window: all tire sets ever sold for the same vehicle_id
    measure: count of tire_sets rows of that vehicle with status returned
  - id: tires_msr_credit_remaining
    window: one adjustment credit, from its issuing adjustment row to the present
    measure: amount of the tires_treadwear_adjustment row minus the sum of amount of tires_adjustment_credit_applied and tires_adjustment_credit_expired rows whose source_tire_event_id is that adjustment
  - id: tires_msr_commercial_use
    window: the set's active life, from install_date to the adjustment date
    measure: true when the set's vehicle has usage_class commercial, or when the vehicle has a fleet_vehicle_enrolled row dated on or before the adjustment date whose enrollment was not ended by a fleet_vehicle_removed row for the same vehicle dated before the set's install_date; otherwise false
  - id: tires_msr_vehicle_tires_open
    window: portfolio state on the date of the purchase
    measure: sum of tire_count over the vehicle's tire_sets rows in status ordered or active
  - id: tires_msr_booking_count
    window: life of the ordered set
    measure: count of tires_installation_booked rows on the set
  - id: tires_msr_direct_tpms
    window: vehicle record on the purchase date
    measure: true when the vehicle's tpms_type is direct, otherwise false

# ---- policies ----
policies:
  - id: tires_agg_multi_holding
    subject: [tires_purchase]
    rule: >-
      A customer may hold any number of tire sets: every sales ticket of tires for one vehicle opens its own set,
      so a household with several vehicles, or a vehicle that received two tires on one ticket and two on a later
      ticket, carries several sets at once. Each set keeps its own tier, its own install odometer, its own warranty
      clock and its own adjustment credit; nothing is pooled across sets. How many tires may be open on one vehicle
      at the same time is governed by tires_agg_vehicle_tire_count.
    eligibility: []
    params: {max_per_customer: null}

  - id: tires_agg_vehicle_tire_count
    subject: [tires_purchase]
    rule: >-
      The tires already open on a vehicle are aggregated across all of its sets before a new ticket is written.
      The basis is tires_msr_vehicle_tires_open, the sum of tire_count over the vehicle's sets in status ordered
      or active on the purchase date. The open tires plus the new ticket's tire_count must not exceed the
      vehicle-class limit in max_tires_on_vehicle. Tires being taken off the vehicle in exchange for the new ones
      still count until the set they belong to is closed, so when a purchase replaces every tire of an older set
      that older set is retired first and only then is the new ticket opened; when a purchase replaces only some
      positions of an older set, the older set stays active and the limit is checked on the sum. Tires on returned,
      cancelled, worn_out or retired sets never count.
    eligibility: []
    params:
      max_tires_on_vehicle: {passenger_car: 4, suv_cuv: 5, minivan: 4, light_truck: 5, commercial_van: 5, medium_duty_truck: 6}
    measures: [tires_msr_vehicle_tires_open]

  - id: tires_purchase_ticket
    subject: [tires_purchase]
    rule: >-
      A tire ticket is written only for a line whose entry gate lists the vehicle's class. The vehicle's class must be
      one of the classes the tire line is sold for. Each tier's eligible classes are its entry_gate.eligible_vehicle_classes;
      a fitment outside them (for example a passenger line on a light truck) is not sold. The pre-tax ticket total is
      tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the
      tpms_service_kit_charge_per_tire when the vehicle's tpms_type is direct or otherwise the valve_stem_charge_per_tire,
      plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when
      tire_count is at least set_instant_savings_min_tires. tire_count may not exceed max_tires_per_ticket. Sales tax
      is calculated by the store's point-of-sale system as a separate tax line and is never part of a charter
      computation. A ticket paid with the Crestline credit card posts to the card account and a ticket charged to a
      fleet account posts as a fleet invoice; cash, debit and bank-card tickets post nowhere else.
    eligibility:
      - id: fitment_class
        applies_to: [tires_purchase]
        kind: state
        condition: The vehicle's class must be one of the classes the tire line is sold for.
        evidence_fields: [vehicles.vehicle_class, vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vehicles.vehicle_id]]
          action_bindings: {vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: vehicles.vehicle_class
          allowed: [passenger_car, suv_cuv, minivan, light_truck, commercial_van]
    formula:
      ticket_total: "tire_count * unit_price + tire_count * mounting_balancing_charge_per_tire + tire_count * (tpms_service_kit_charge_per_tire if tires_msr_direct_tpms else valve_stem_charge_per_tire) + tire_count * tire_disposal_fee_per_tire - (set_instant_savings if tire_count >= set_instant_savings_min_tires else 0)"
    measures: [tires_msr_direct_tpms]

  - id: tires_evt_installation_booking
    subject: [tires_installation_booked]
    rule: >-
      Installation appointments are booked only for a set that has been bought and not yet mounted. The set must be
      in status ordered when an installation appointment is booked. The appointment must fall no later than the end
      of the order hold period counted from the purchase of the ordered set. Calendar days are counted from the day
      after the anchor date, so the anchor date plus the number of days is the last qualifying date. The slot must
      start at least installation_min_lead_hours after the booking is made and no more than
      installation_booking_horizon_days after the booking date, at a store whose bays are open at that time; the bay
      is reserved for installation_slot_minutes. A special-order size cannot be booked earlier than
      special_order_lead_days business days (Monday to Friday, excluding the store's published holidays) after
      purchase_date. Moving an appointment books a new slot as a new row; tires_msr_booking_count may not exceed one
      plus appointment_reschedules_max, after which the order is cancelled and re-bought as a new ticket. A customer
      who has not arrived appointment_late_release_minutes after the slot start loses the slot, which counts as used.
    eligibility:
      - id: set_ordered
        applies_to: [tires_installation_booked]
        kind: state
        condition: The set must be in status ordered when an installation appointment is booked.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [ordered]
      - id: within_hold_period
        applies_to: [tires_installation_booked]
        kind: time
        condition: The appointment must fall no later than the end of the order hold period counted from the purchase of the ordered set.
        evidence_fields: [tire_sets.purchase_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase of the ordered set
          anchor_source: tire_sets.purchase_date
          relation: not_after
          duration_source: variants.order_hold_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [tires_msr_booking_count]

  - id: tires_evt_installation_completion
    subject: [tires_installation_completed]
    rule: >-
      Installation closes the work order and starts the warranty. The set must be in status ordered when the
      installation is recorded. install_date is the work-order date and install_odometer is the odometer written on
      the installation work order; both are copied from the work order and never estimated. Miles driven for every
      later warranty decision are measured from install_odometer. When alignment_check_included is true the work order
      also carries a complimentary alignment check, which records nothing on the set. A road hazard certificate sold
      on the same ticket starts its coverage on the installation, as its own charter sets out.
    eligibility:
      - id: set_ordered_install
        applies_to: [tires_installation_completed]
        kind: state
        condition: The set must be in status ordered when the installation is recorded.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [ordered]

  - id: tires_evt_rotation_service
    subject: [tires_rotation_service]
    rule: >-
      Rotations keep the set wearing evenly and are the documentation the treadwear warranty relies on. The set must
      be in status active when a rotation is recorded. The price of the visit depends on the tier and on the service
      performed: a rotation_and_balance visit is charged rotation_and_balance_charge and a rotation_only visit is
      charged rotation_only_charge, where 0.00 means the service is included for the life of the tires. When
      spare_included_in_rotation is true the matching full-size spare is moved into the pattern at no extra charge.
      The row records the odometer from the work order; a rotation performed at another shop is not a Crestline
      rotation record and is never booked here.
    eligibility:
      - id: set_active_rotation
        applies_to: [tires_rotation_service]
        kind: state
        condition: The set must be in status active when a rotation is recorded.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
    params:
      per_tier:
        Crestline Value Touring 40K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline All-Season 50K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Grand Touring 60K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Highway Terrain LT 65K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Premium Touring 75K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Ultra Touring 85K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
    formula:
      charge_amount: "rotation_and_balance_charge if service_code == 'rotation_and_balance' else rotation_only_charge"

  - id: tires_evt_tread_inspection
    subject: [tires_tread_inspection]
    rule: >-
      A tread inspection is the measured evidence for every warranty decision on a tire. The set must be in status
      active when a tread inspection is recorded. One row is written per wheel position measured; the depth is the
      lowest reading in any main groove (tread_measurement_point), in whole 32nds, and the wear_pattern is the one
      the technician records (even, irregular_alignment, irregular_inflation or damage). The inspection is performed
      by a Crestline technician at a store; a depth the customer measured at home, or a reading from another shop,
      is not an inspection and is never recorded as one. An inspection supports a warranty decision only for the
      period set in tires_evt_treadwear_adjustment; after that a new inspection is needed.
    eligibility:
      - id: set_active_inspection
        applies_to: [tires_tread_inspection]
        kind: state
        condition: The set must be in status active when a tread inspection is recorded.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]

  - id: tires_evt_treadwear_adjustment
    subject: [tires_treadwear_adjustment]
    rule: >-
      A tire that wears out before its warranted miles is adjusted on a prorated basis and the credit is issued on
      the set. The set must be in status active when the adjustment is issued. The adjustment must be issued no
      later than the end of the warranty term counted from the tire purchase recorded on the original sales ticket.
      Months are counted as calendar months from the anchor date to the same day of the month, falling back to the
      last day of that month when that day does not exist. The adjustment must be issued no later than the end of
      the inspection validity period counted from the tread inspection the adjustment rests on. Calendar days are
      counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying
      date. Each wheel position of a set may be adjusted only once. The warranty term is warranty_term_months, or
      commercial_use_term_months under commercial use (tires_commercial_use_coverage). The tire is worn out only
      when the inspection's min_tread_depth_32nds is at or below wear_out_tread_depth_32nds; a tire above that depth
      is not adjustable however many miles it has run. The inspection's wear_pattern must not be one of
      claim_excluded_wear_patterns, because irregular wear and damage are not treadwear. When rotation_records_required
      is true, tires_msr_rotation_max_gap must not exceed rotation_interval_max_miles plus rotation_grace_miles; only
      Crestline rotation records count. miles_driven is the inspection odometer minus install_odometer. When
      miles_driven is at or above the effective warranted miles the tire has delivered its warranty and nothing is
      issued. Otherwise credit_pct is the share of the effective warranted miles not received, times 100, rounded
      down to a whole percent (proration_pct_rounding); when credit_pct is below min_claim_credit_pct nothing is
      issued. The credit amount is credit_pct percent of the per-tire price named by proration_price_basis (the
      set's unit_price, or current_selling_price on the adjustment date), rounded half up to the cent. Installation
      charges, fees and tax are never part of the credit. One row is booked per adjusted position, citing the
      inspection in source_tire_event_id; the credit is used as tires_evt_credit_redemption sets out.
    eligibility:
      - id: set_active_adjustment
        applies_to: [tires_treadwear_adjustment]
        kind: state
        condition: The set must be in status active when the adjustment is issued.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
      - id: within_warranty_term
        applies_to: [tires_treadwear_adjustment]
        kind: time
        condition: The adjustment must be issued no later than the end of the warranty term counted from the tire purchase recorded on the original sales ticket.
        evidence_fields: [tire_sets.purchase_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the tire purchase recorded on the original sales ticket
          anchor_source: tire_sets.purchase_date
          relation: not_after
          duration_source: variants.warranty_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
      - id: inspection_fresh
        applies_to: [tires_treadwear_adjustment]
        kind: time
        condition: The adjustment must be issued no later than the end of the inspection validity period counted from the tread inspection the adjustment rests on.
        evidence_fields: [tire_events.event_date, tire_events.tire_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.tire_event_id]]
          action_bindings: {tire_events.tire_event_id: source_tire_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the tread inspection the adjustment rests on
          anchor_source: tire_events.event_date
          relation: not_after
          duration_source: variants.claim_inspection_validity_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
      - id: one_adjustment_per_position
        applies_to: [tires_treadwear_adjustment]
        kind: dedup
        condition: Each wheel position of a set may be adjusted only once.
        evidence_fields: [tire_events.tire_set_id, tire_events.tire_position, tire_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.tire_set_id, tire_events.tire_position]]
          action_bindings: {tire_events.tire_set_id: tire_set_id, tire_events.tire_position: tire_position}
        dedup_contract:
          table: tire_events
          mode: separate_record
          object_bindings: {tire_set_id: tire_set_id, tire_position: tire_position}
          duplicate_filters: {event_type: [tires_treadwear_adjustment]}
          distinct_fields: [event_date]
    formula:
      effective_warranted_miles: "warranted_miles * commercial_use_mileage_pct // 100 if tires_msr_commercial_use else warranted_miles"
      credit_pct: "(effective_warranted_miles - miles_driven) * 100 // effective_warranted_miles"
      amount: "round((current_selling_price if proration_price_basis == 'current_selling_price' else unit_price) * credit_pct / 100, 2)"
    measures: [tires_msr_rotation_max_gap, tires_msr_position_adjustments, tires_msr_commercial_use]

  - id: tires_commercial_use_coverage
    subject: [tires_treadwear_adjustment]
    rule: >-
      Holding a Crestline fleet account changes the treadwear coverage of the tires on the fleet's vehicles.
      Commercial use is read from tires_msr_commercial_use: a vehicle whose usage_class is commercial, or that sat on
      a fleet account roster at any point of the set's active life, is in commercial use even if it is a personal
      vehicle today. Under commercial use the effective warranted miles are warranted_miles times
      commercial_use_mileage_pct percent, rounded down to a whole mile, and the warranty term is
      commercial_use_term_months in place of warranty_term_months. Where commercial_use_mileage_pct is 0 the line
      carries no treadwear coverage at all for commercial use and no adjustment is issued, though workmanship
      replacement still applies. Commercial use never changes the satisfaction trial, rotation pricing or
      installation charges. Without commercial use the effective warranted miles are warranted_miles.
    eligibility: []
    formula:
      effective_warranted_miles: "warranted_miles * commercial_use_mileage_pct // 100 if tires_msr_commercial_use else warranted_miles"
    measures: [tires_msr_commercial_use]

  - id: tires_treadwear_workmanship_exclusion
    subject: [tires_treadwear_adjustment, tires_workmanship_replacement]
    rule: >-
      Treadwear adjustment and workmanship replacement are mutually exclusive for the same tire. One inspection
      supports either a treadwear adjustment or a workmanship replacement for its position, never both. When the
      technician has identified a manufacturing defect, the tire is handled as a workmanship replacement even if it
      is also worn, because the defect, not the mileage, ended its life. A position already adjusted for treadwear
      is out of the warranty and cannot later be replaced for workmanship, and a position replaced for workmanship
      carries the replacement tire forward on the same set with the set's original purchase_date, install_odometer
      and warranted miles, so a later treadwear adjustment of that position measures miles from install_odometer
      exactly as before.
    eligibility: []

  - id: tires_evt_workmanship_replacement
    subject: [tires_workmanship_replacement]
    rule: >-
      A tire with a manufacturing defect (tread separation, out-of-round, belt shift or a bead that will not seal on
      a sound wheel) is replaced on the set. The set must be in status active when a workmanship replacement is
      made. The replacement must be made no later than the end of the warranty term counted from the tire purchase
      recorded on the original sales ticket. Months are counted as calendar months from the anchor date to the same
      day of the month, falling back to the last day of that month when that day does not exist. Replacement is free,
      with free mounting and balancing, while both of these hold: the replacement date is within
      workmanship_free_replacement_months of purchase_date, and the tread worn (original_tread_depth_32nds minus the
      inspection's min_tread_depth_32nds) is at most workmanship_free_replacement_wear_32nds. Once either limit is
      passed the customer pays the tread_worn_share of the current_selling_price, which is the tread worn divided by
      the usable tread (original_tread_depth_32nds minus wear_out_tread_depth_32nds), rounded half up to the cent,
      plus mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true. A tire
      damaged by a road hazard, curb impact or under-inflation has no defect and is not a workmanship replacement.
    eligibility:
      - id: set_active_workmanship
        applies_to: [tires_workmanship_replacement]
        kind: state
        condition: The set must be in status active when a workmanship replacement is made.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
      - id: workmanship_within_term
        applies_to: [tires_workmanship_replacement]
        kind: time
        condition: The replacement must be made no later than the end of the warranty term counted from the tire purchase recorded on the original sales ticket.
        evidence_fields: [tire_sets.purchase_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the tire purchase recorded on the original sales ticket
          anchor_source: tire_sets.purchase_date
          relation: not_after
          duration_source: variants.warranty_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    formula:
      customer_share: "round(current_selling_price * (original_tread_depth_32nds - min_tread_depth_32nds) / (original_tread_depth_32nds - wear_out_tread_depth_32nds), 2)"

  - id: tires_evt_credit_redemption
    subject: [tires_adjustment_credit_applied, tires_adjustment_credit_expired]
    rule: >-
      An adjustment credit is spent only on replacement tires. The credit must be applied no later than the end of
      the credit validity period counted from the treadwear adjustment that issued the credit. Calendar days are
      counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying
      date. The validity period is adjustment_credit_validity_days. The amount applied may not exceed
      tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket,
      never installation charges, fees or tax. When adjustment_same_line_required is true the replacement tire must
      be of the same tier as the adjusted set; otherwise any Crestline tire line may be bought. When
      adjustment_mounting_included is true the replacement tire's mounting and balancing is not charged on the
      replacement ticket. Several credits of one set may go on one replacement ticket, each as its own row citing its
      own adjustment. A credit is never paid out in cash, moved to another set or another customer, or combined with
      a satisfaction-trial refund of the same set. The day after the validity period ends, whatever remains of the
      credit lapses and is booked as an expiry for exactly tires_msr_credit_remaining; a credit fully applied lapses
      nothing. Closing the set does not cancel a credit that is still within its validity period.
    eligibility:
      - id: credit_within_validity
        applies_to: [tires_adjustment_credit_applied]
        kind: time
        condition: The credit must be applied no later than the end of the credit validity period counted from the treadwear adjustment that issued the credit.
        evidence_fields: [tire_events.event_date, tire_events.tire_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.tire_event_id]]
          action_bindings: {tire_events.tire_event_id: source_tire_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the treadwear adjustment that issued the credit
          anchor_source: tire_events.event_date
          relation: not_after
          duration_source: variants.adjustment_credit_validity_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [tires_msr_credit_remaining]

  - id: tires_evt_satisfaction_trial
    subject: [tires_satisfaction_return, tires_refund]
    rule: >-
      A customer who is not satisfied with the ride of a new set may return it within the satisfaction trial. The set
      must be in status active when a trial return is completed. The return must be completed no later than the end
      of the trial period counted from the installation of the set. Calendar days are counted from the day after the
      anchor date, so the anchor date plus the number of days is the last qualifying date. The trial period is
      satisfaction_trial_days. The miles driven since installation, read at the store when the tires come off, must
      not exceed satisfaction_trial_max_miles. tires_msr_vehicle_trial_returns must be below
      satisfaction_returns_per_vehicle; a vehicle that has already used its trial return gets none on a later set. A
      set with any treadwear adjustment or workmanship replacement is past the trial. The return is the customer's
      own decision about their tires: the agent registers the request and the customer confirms it, and only the
      confirmation returns the set. Where satisfaction_remedy is exchange_only the money is returned as store credit
      toward another Crestline tire line; otherwise the customer chooses refund or exchange. The amount returned is
      tire_count times unit_price, less any set_instant_savings the ticket received, plus the mounting, valve-stem or
      TPMS-kit charges per tire when satisfaction_refund_includes_installation is true; disposal fees and any
      rotation charges are never returned.
    eligibility:
      - id: set_active_trial
        applies_to: [tires_satisfaction_return]
        kind: state
        condition: The set must be in status active when a trial return is completed.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
      - id: within_trial_period
        applies_to: [tires_satisfaction_return]
        kind: time
        condition: The return must be completed no later than the end of the trial period counted from the installation of the set.
        evidence_fields: [tire_sets.install_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the installation of the set
          anchor_source: tire_sets.install_date
          relation: not_after
          duration_source: variants.satisfaction_trial_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [tires_msr_vehicle_trial_returns]

  - id: tires_evt_order_cancellation
    subject: [tires_order_cancellation, tires_refund]
    rule: >-
      An ordered set that has not been mounted can be cancelled. The set must be in status ordered when it is
      cancelled. A set still ordered after order_hold_days counted from purchase_date is cancelled by the store
      without a request. The refund is the pre-tax ticket total computed under tires_purchase_ticket, less a
      restocking fee of special_order_restocking_fee_pct percent of tire_count times unit_price, rounded half up to the
      cent; the restocking fee applies both to a customer-requested cancellation and to a hold-period lapse, and is
      not withheld when the line's special_order_restocking_fee_pct is 0. An installed set is never cancelled; it can
      only be returned under the satisfaction trial.
    eligibility:
      - id: set_ordered_cancel
        applies_to: [tires_order_cancellation]
        kind: state
        condition: The set must be in status ordered when it is cancelled.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [ordered]
    formula:
      restocking_fee: "round(tire_count * unit_price * special_order_restocking_fee_pct / 100, 2)"

  - id: tires_refund_tender
    subject: [tires_refund]
    rule: >-
      A refund on a tire ticket goes back to the tender that paid the ticket. A ticket may receive only one refund per
      refund reason. A Crestline credit card ticket is refunded as a merchandise credit on the card account, a fleet
      ticket as a credit memo on the fleet account, a bank-card ticket to the same bank card, and a cash or debit ticket
      in cash or to the same debit card; an exchange-only satisfaction return is refunded as store_credit. The refund
      row carries the original purchase_ticket_number in ticket_number and the refund_reason it was paid for. A refund
      is never split across tenders and never paid to a tender other than the original one.
    eligibility:
      - id: one_refund_per_reason
        applies_to: [tires_refund]
        kind: dedup
        condition: A ticket may receive only one refund per refund reason.
        evidence_fields: [tire_events.ticket_number, tire_events.refund_reason, tire_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.ticket_number, tire_events.refund_reason]]
          action_bindings: {tire_events.ticket_number: ticket_number, tire_events.refund_reason: refund_reason}
        dedup_contract:
          table: tire_events
          mode: separate_record
          object_bindings: {ticket_number: ticket_number, refund_reason: refund_reason}
          duplicate_filters: {event_type: [tires_refund]}
          distinct_fields: [event_date]

  - id: tires_evt_closure
    subject: [tires_worn_out_closure, tires_set_retirement]
    rule: >-
      An active set closes when no warranted tire of it remains in service. The set must be in status active when it
      is closed. It closes as worn_out on the date its last position is adjusted for treadwear, once every one of its
      tire_count positions carries an adjustment. It closes as retired on the date Crestline records that the
      vehicle was sold or the tires were taken off for any reason other than adjustment, or on the date an inspection
      shows the warranty term or the effective warranted miles have run out; because warranty_transferable is false,
      a sold vehicle's set is retired and never transferred to the buyer. Closing the set ends its warranty and its
      rotation pricing, but an adjustment credit still within its validity period remains usable.
    eligibility:
      - id: set_active_close
        applies_to: [tires_worn_out_closure, tires_set_retirement]
        kind: state
        condition: The set must be in status active when it is closed.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
