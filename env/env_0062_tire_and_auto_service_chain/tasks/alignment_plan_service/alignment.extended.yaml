# ---- data flow ----
events:
  - type: alignment_purchase
    target: alignment_plans
    mutation: create
    meaning: A customer buys a single alignment or an alignment plan for one vehicle; the first alignment is done on the same visit.
    grain: one row per service or plan sold
    fields:
      customer_id: purchaser
      vehicle_id: vehicle the plan is valid on
      store_id: selling store
      variant_name: service or plan sold
      purchase_date: ticket date
      purchase_odometer: odometer on the work order
      expiration_date: end of the term (empty for lifetime)
      purchase_price: price paid after any bundle discount
      purchase_ticket_number: ticket number
      payment_method: tender used
    triggers:
      - event: alignment:alignment_service_performed
        map: {event_date: purchase_date, store_id: store_id, odometer: purchase_odometer, service_basis: plan_included}

  - type: alignment_appointment_booked
    target: alignment_events
    meaning: An alignment appointment is booked (or moved) under the plan.
    grain: one row per appointment slot booked; a reschedule is a new row with the new slot
    distinguish_by: [appointment_date, appointment_time]
    fields:
      event_date: date the booking was made
      store_id: store booked
      appointment_date: appointment date
      appointment_time: slot start
      alignment_type: alignment booked
    triggers: []

  - type: alignment_service_performed
    target: alignment_events
    meaning: An alignment is performed and the work order is closed.
    grain: one row per alignment work order
    distinguish_by: [event_date, odometer]
    fields:
      event_date: work order date
      store_id: servicing store
      odometer: odometer on the work order
      alignment_type: alignment performed
      service_basis: plan_included or member_early_price
      charge_amount: labor charged for the alignment
      parts_charge: parts, sensor reset and recalibration charged
    triggers: []

  - type: alignment_readjustment
    target: alignment_events
    meaning: An alignment measured out of specification within the guarantee is readjusted free.
    grain: one row per readjustment work order
    distinguish_by: [source_alignment_event_id, event_date]
    fields:
      event_date: work order date
      store_id: servicing store
      odometer: odometer on the work order
      alignment_type: alignment readjusted
      service_basis: always guarantee_readjustment
      charge_amount: always 0.00
      parts_charge: parts charged (parts are not covered by the readjustment guarantee)
      source_alignment_event_id: the alignment being corrected
    triggers: []

  - type: alignment_cancellation
    target: alignment_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The holder confirms cancellation of a plan inside the cancellation window.
    grain: one row per transaction
    fields:
      closed_date: cancellation date
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: alignment:alignment_refund
        map: {event_date: closed_date, payment_method: payment_method}

  - type: alignment_refund
    target: alignment_events
    meaning: The refund of a cancelled plan is paid.
    grain: one row per cancelled plan
    distinguish_by: [event_date]
    fields:
      event_date: refund date
      amount: refund paid
      payment_method: tender refunded
    triggers:
      - event: card:card_merchandise_credit
        when: {payment_method: crestline_card}
        map: {txn_date: event_date, amount: amount}

  - type: alignment_expiration
    target: alignment_plans
    mutation: {transition: {from: active, to: expired}}
    meaning: A month-based plan or a single service's guarantee reaches its expiration date.
    grain: one row per transaction
    fields:
      closed_date: day after expiration_date
    triggers: []

  - type: alignment_vehicle_retirement
    target: alignment_plans
    mutation: {transition: {from: active, to: vehicle_retired}}
    meaning: The plan ends because the purchaser no longer owns the vehicle.
    grain: one row per transaction
    fields:
      closed_date: date recorded
    triggers: []

measures:
  - id: alignment_msr_last_interval_alignment
    window: life of the plan up to the date of the event
    measure: event_date and odometer of the most recent alignment_service_performed row whose service_basis is plan_included, or member_early_price when early_price_counts_as_interval is true
  - id: alignment_msr_interval_reached
    window: from alignment_msr_last_interval_alignment to the date of the event
    measure: true when the event date is on or after the last interval alignment's date plus min_interval_months (calendar months, same day of month, falling back to the last day of the month) or the event odometer is at least the last interval alignment's odometer plus min_interval_miles; otherwise false
  - id: alignment_msr_included_alignments
    window: life of the plan up to the date of the event
    measure: count of alignment_service_performed rows on the plan with service_basis plan_included (the purchase-day alignment included)
  - id: alignment_msr_booking_count
    window: one appointment chain, from its first booking to the visit
    measure: count of alignment_appointment_booked rows made for the same visit (the original booking and each reschedule)
  - id: alignment_msr_tire_bundle
    window: tire_bundle_window_days before the plan purchase_date
    measure: true when the same vehicle has a Crestline tire set whose install_date falls within tire_bundle_window_days before the plan's purchase_date (purchase_date itself included); otherwise false
  - id: alignment_msr_commercial_use
    window: portfolio state on the date of the event
    measure: true when the vehicle's usage_class is commercial or its latest fleet roster row is fleet_vehicle_enrolled; otherwise false

# ---- policies ----
policies:
  - id: alignment_agg_multi_holding
    subject: [alignment_purchase]
    rule: >-
      A customer may hold any number of alignment services and plans, one per vehicle they own, and a plan is valid only
      on the vehicle it was bought for. Plans of different vehicles never share alignments, intervals or refunds. How
      many plans one vehicle may carry is governed by alignment_agg_one_per_vehicle.
    eligibility: []
    params: {max_per_customer: null}

  - id: alignment_agg_one_per_vehicle
    subject: [alignment_purchase]
    rule: >-
      Alignment holdings are aggregated per vehicle. A vehicle may carry only one active alignment service or plan at a
      time. The cap is holdings_per_vehicle_max. A customer who wants to move from a single service or a shorter plan to a longer
      one while the first is active buys the new plan only after the first has expired or been cancelled; a single
      service still inside its readjustment guarantee is not cancellable and runs to its expiration_date.
    eligibility:
      - id: one_active_per_vehicle
        applies_to: [alignment_purchase]
        kind: dedup
        condition: A vehicle may carry only one active alignment service or plan at a time.
        evidence_fields: [alignment_plans.vehicle_id, alignment_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.vehicle_id]]
          action_bindings: {alignment_plans.vehicle_id: vehicle_id}
        dedup_contract:
          table: alignment_plans
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [active]}
          distinct_fields: [purchase_date]

  - id: alignment_purchase_pricing
    subject: [alignment_purchase]
    rule: >-
      An alignment service or plan is sold for one vehicle whose class is in the tier's entry_gate list. A plan whose
      commercial_use_eligible is false is never sold for a vehicle in commercial use (alignment_msr_commercial_use).
      purchase_price is plan_price minus tire_bundle_discount when alignment_msr_tire_bundle is true, and plan_price
      otherwise; the bundle discount is never combined with a fleet discount, and when the ticket is charged to a fleet
      account the fleet discount applies only where fleet_discount_applicable is true. expiration_date is purchase_date
      plus plan_term_months, counted as calendar months to the same day of the month (falling back to the last day of
      that month); lifetime plans have no expiration_date. The plan is a line on a store ticket, often the tire ticket;
      when that ticket is paid with the Crestline card or charged to a fleet account, the ticket total posts once, as one
      card purchase or one fleet invoice per service category. The first alignment is performed on the purchase visit as an
      included alignment.
    eligibility: []
    formula:
      purchase_price: "plan_price - tire_bundle_discount if alignment_msr_tire_bundle else plan_price"
    measures: [alignment_msr_tire_bundle, alignment_msr_commercial_use]

  - id: alignment_evt_booking
    subject: [alignment_appointment_booked]
    rule: >-
      Appointments are booked only on a plan that is in force. The plan must be in status active when an appointment is
      booked. The slot must start at least booking_min_lead_hours after the booking and no more than booking_horizon_days
      after the booking date, for booking_slot_minutes of bay time, and for an alignment_type in alignment_types_covered.
      Moving an appointment books a new row; alignment_msr_booking_count may not exceed one plus reschedules_max. A
      customer who has not arrived late_release_minutes after the slot start loses the slot; no_show_fee is charged for it.
      Booking does not decide the price: whether the visit is included, at the member early price or a free readjustment
      is decided on the visit date under alignment_evt_service and alignment_evt_readjustment.
    eligibility:
      - id: plan_active_booking
        applies_to: [alignment_appointment_booked]
        kind: state
        condition: The plan must be in status active when an appointment is booked.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]
    measures: [alignment_msr_booking_count]

  - id: alignment_evt_service
    subject: [alignment_service_performed]
    rule: >-
      An alignment on a plan vehicle is performed and priced under the plan. The plan must be in status active when an
      alignment is performed under it. The alignment must be performed no later than the end of the plan term counted
      from the purchase of the plan. Months are counted as calendar months from the anchor date to the same day of the
      month, falling back to the last day of that month when that day does not exist. Lifetime plans have no term end and
      run while the purchaser owns the vehicle. A single service includes only its purchase-day alignment; any later
      alignment on it is charged member_early_alignment_price. On a plan the alignment is plan_included, with
      charge_amount 0.00, when alignment_msr_interval_reached is true (interval_basis whichever_comes_first) or it is the
      purchase-day alignment; before the interval is reached it is charged member_early_alignment_price as
      member_early_price, which restarts the interval when early_price_counts_as_interval is true. Only an alignment_type
      in alignment_types_covered is performed under the holding. When pre_alignment_inspection finds worn steering or
      suspension parts the alignment is not performed until they are repaired (worn_parts_block_alignment), and the
      visit uses nothing (blocked_visit_counts_as_used). parts_charge carries any of parts_charged_list the vehicle
      needed, plus steering_angle_reset_charge, plus adas_recalibration_charge when the vehicle requires a recalibration.
    eligibility:
      - id: plan_active_service
        applies_to: [alignment_service_performed]
        kind: state
        condition: The plan must be in status active when an alignment is performed under it.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]
      - id: within_plan_term
        applies_to: [alignment_service_performed]
        kind: time
        condition: The alignment must be performed no later than the end of the plan term counted from the purchase of the plan.
        evidence_fields: [alignment_plans.purchase_date, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase of the plan
          anchor_source: alignment_plans.purchase_date
          relation: not_after
          duration_source: variants.plan_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    params:
      per_tier:
        Crestline Two-Wheel Alignment: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline Four-Wheel Alignment: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline 1-Year Alignment Plan: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline 3-Year Alignment Plan: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline Lifetime Alignment Plan: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
        Crestline Lifetime Alignment Plan Truck & Performance: {early_price: "=member_early_alignment_price", interval_months: "=min_interval_months", interval_miles: "=min_interval_miles"}
    formula:
      charge_amount: "0 if alignment_msr_interval_reached else member_early_alignment_price"
    measures: [alignment_msr_interval_reached, alignment_msr_last_interval_alignment]

  - id: alignment_evt_readjustment
    subject: [alignment_readjustment]
    rule: >-
      Every alignment carries a readjustment guarantee. The readjustment must be performed no later than the end of the
      guarantee period counted from the alignment being corrected. Months are counted as calendar months from the anchor
      date to the same day of the month, falling back to the last day of that month when that day does not exist. The
      period is readjustment_guarantee_months, and the vehicle must also have run no more than
      readjustment_guarantee_miles since that alignment's odometer; whichever limit is reached first ends the guarantee.
      The vehicle must be measured out of specification (readjustment_condition) and the cause must not be one of
      readjustment_exclusions, as recorded by the technician. The readjustment labor is free (charge_amount 0.00); parts
      needed are charged as parts_charge under the parts warranty only when the part itself failed within
      parts_warranty_months and parts_warranty_miles. A readjustment cites the alignment it corrects and never counts as
      an included alignment or restarts the plan interval. The guarantee applies on any holding status the alignment was
      performed under, including a single service whose expiration_date is its guarantee end.
    eligibility:
      - id: within_guarantee
        applies_to: [alignment_readjustment]
        kind: time
        condition: The readjustment must be performed no later than the end of the guarantee period counted from the alignment being corrected.
        evidence_fields: [alignment_events.event_date, alignment_events.alignment_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_events.alignment_event_id]]
          action_bindings: {alignment_events.alignment_event_id: source_alignment_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the alignment being corrected
          anchor_source: alignment_events.event_date
          relation: not_after
          duration_source: variants.readjustment_guarantee_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive

  - id: alignment_evt_cancellation_refund
    subject: [alignment_cancellation, alignment_refund]
    rule: >-
      A plan may be cancelled for a refund only inside its cancellation window, and cancelling is the holder's own
      decision: the agent registers the request and the holder confirms it. The plan must be in status active when the
      cancellation is completed. The cancellation must be completed no later than the end of the cancellation window
      counted from the purchase of the plan. Calendar days are counted from the day after the anchor date, so the anchor
      date plus the number of days is the last qualifying date. The window is cancellation_window_days; a tier whose
      window is 0 (a single service) is never cancelled, and after the window nothing is refunded
      (cancellation_after_window). The refund is purchase_price minus used_alignment_deduction for each included
      alignment already performed (alignment_msr_included_alignments, the purchase-day alignment included), never below
      0.00; alignments charged at the member early price and readjustments are not deducted. The refund goes to the
      tender that paid for the plan (refund_tender).
    eligibility:
      - id: plan_active_cancel
        applies_to: [alignment_cancellation]
        kind: state
        condition: The plan must be in status active when the cancellation is completed.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]
      - id: within_cancellation_window
        applies_to: [alignment_cancellation]
        kind: time
        condition: The cancellation must be completed no later than the end of the cancellation window counted from the purchase of the plan.
        evidence_fields: [alignment_plans.purchase_date, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase of the plan
          anchor_source: alignment_plans.purchase_date
          relation: not_after
          duration_source: variants.cancellation_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    formula:
      amount: "max(purchase_price - used_alignment_deduction * alignment_msr_included_alignments, 0)"
    measures: [alignment_msr_included_alignments]

  - id: alignment_evt_plan_end
    subject: [alignment_expiration, alignment_vehicle_retirement]
    rule: >-
      A holding ends without a refund in two ways. The plan must be in status active when it ends. A month-based plan or
      single service expires the day after its expiration_date. Any plan ends as vehicle_retired on the date Crestline
      records that the purchaser no longer owns the vehicle (lifetime_ownership_proof: the vehicle is no longer on the
      purchaser's profile, or the customer reports the sale); because transferable is false and ends_on_vehicle_sale is
      true, the plan never moves to the buyer or to the purchaser's replacement vehicle. A readjustment owed on an
      alignment performed before the end remains available under alignment_evt_readjustment.
    eligibility:
      - id: plan_active_end
        applies_to: [alignment_expiration, alignment_vehicle_retirement]
        kind: state
        condition: The plan must be in status active when it ends.
        evidence_fields: [alignment_plans.status, alignment_plans.alignment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[alignment_plans.alignment_plan_id]]
          action_bindings: {alignment_plans.alignment_plan_id: alignment_plan_id}
        state_contract:
          field: alignment_plans.status
          allowed: [active]

  - id: alignment_commercial_use_exclusion
    subject: [alignment_service_performed, alignment_purchase]
    rule: >-
      Holding a Crestline fleet account changes what an alignment plan covers on the fleet's vehicles. A plan whose
      commercial_use_eligible is false gives no included alignment on a date when alignment_msr_commercial_use is true;
      the alignment is charged member_early_alignment_price instead, and the plan's interval is not restarted. The plan
      is not cancelled or refunded for this reason, and included alignments resume once the vehicle is back in personal
      use. Single services (commercial_use_eligible true) are unaffected and may be charged to a fleet account.
    eligibility: []
    measures: [alignment_msr_commercial_use]

# ---- extended policies (alignment_plan_service) ----
extended_policies:
  - id: alignment_ext_open_visit_labor
    base_policy_refs: [alignment_evt_service, alignment_commercial_use_exclusion]
    overwrite:
      - base_policy: alignment_evt_service
        superseded_clause: >-
          On a plan the alignment is plan_included, with charge_amount 0.00, when alignment_msr_interval_reached is true
          (interval_basis whichever_comes_first) or it is the purchase-day alignment; before the interval is reached it is
          charged member_early_alignment_price as member_early_price, which restarts the interval when
          early_price_counts_as_interval is true.
        replaced_by: >-
          For the open work order of a plan that this policy prices, and only for such a work order, the labor charged is
          the amount worked out below and the work order is booked as plan_included when that amount is 0.00 and as
          member_early_price otherwise, a member_early_price alignment restarting the interval when
          early_price_counts_as_interval is true; the purchase-day alignment is plan_included with charge_amount 0.00, and every other alignment that is not priced as an open work order is plan_included, with charge_amount 0.00, when alignment_msr_interval_reached is true (interval_basis whichever_comes_first) and is charged member_early_alignment_price as member_early_price before the interval is reached, which restarts the interval when early_price_counts_as_interval is true.
    trigger: state_due
    subject: [alignment_service_performed]
    computes: charge_amount
    target_tool: price_alignment_work_order_228c355b
    params:
      standard_alignment_labor: 109.99
      thrust_cut: 0.20
      two_wheel_cut: 0.10
      check_line_credit: 15.00
      plain_line_credit: 10.00
      impact_replacement_credit: 10.00
      other_replacement_credit: 5.00
      impact_window_days: 7
      card_clean_rate: 0.10
      card_late_rate: 0.05
      advance_booking_days: 2
      advance_booking_credit: 5.00
      short_notice_booking_credit: 2.00
    rule: >-
      A store that performs an alignment on a plan vehicle posts the work order on the plan with its work-order date,
      odometer and alignment type and leaves its service basis open (none) together with a labor charge of 0.00; that
      work order is the open work order of the plan, and the plan desk sets its labor and its service basis. This policy
      prices the open work order of a 1-Year, 3-Year or lifetime plan whose vehicle is in personal use on the visit date;
      a vehicle in commercial use on the visit date is priced under the commercial-use rule, and a later alignment on a
      single service is charged under the base single-service rule, both outside this policy. For the open work order of
      a plan that this policy prices, and only for such a work order, the labor charged is the amount worked out below
      and the work order is booked as plan_included when that amount is 0.00 and as member_early_price otherwise, a
      member_early_price alignment restarting the interval when early_price_counts_as_interval is true; the purchase-day alignment is plan_included with charge_amount 0.00, and every other alignment that is not priced as an open work order is plan_included, with charge_amount 0.00, when alignment_msr_interval_reached is true (interval_basis whichever_comes_first) and is charged member_early_alignment_price as member_early_price before the interval is reached, which restarts the interval when early_price_counts_as_interval is true.
      The labor of an open work order is worked out from the visit's work-order date, odometer and alignment type. The
      interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price
      alignment when that one is later and the tier's early_price_counts_as_interval is true. The interval is reached
      when at least min_interval_months whole calendar months have passed from the anchor's date to the visit's date, or
      when the visit's odometer is at least min_interval_miles above the anchor's odometer, whichever comes first. The
      pricing base of the visit is 0.00 when the interval is reached and the tier's member_early_alignment_price
      otherwise. The labor charged is the pricing base rounded to the nearest cent and never below 0.00.
      The pricing base follows the plan's standing. On a plan that has a cancellation request awaiting the holder's confirmation, member pricing is suspended and the pricing base is the standard single-alignment labor, standard_alignment_labor, whether or not the interval is reached. On a lifetime plan (term_basis vehicle_ownership) with no cancellation request awaiting confirmation, the pricing base follows the lifetime sliding scale: 0.00 when the interval is reached, and otherwise the tier's member_early_alignment_price times the whole calendar months still to run until min_interval_months, divided by min_interval_months. On a month-based plan with no cancellation request awaiting confirmation, the pricing base is as stated above.
      An alignment-type reduction takes a percentage of the pricing base off the labor charged: thrust_cut for a thrust alignment, two_wheel_cut for a two-wheel alignment, and 0 for a four-wheel alignment.
      A cardholder labor reduction takes a percentage of the pricing base off the labor charged: card_clean_rate when the customer has an active Crestline credit card account with no late fee posted to it
      in the 12 calendar months up to the plan desk's pricing, card_late_rate when that active account has had a late
      fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account.
      A new-tire visit credit is taken off the labor charged: check_line_credit when the
      vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the
      visit and its tire line includes a complimentary alignment check, plain_line_credit when that set was installed
      within those days and its tire line does not include one, and 0.00 when the vehicle has no active Crestline tire
      set installed within those days.
      A road hazard impact credit is taken off the labor charged: impact_replacement_credit when the vehicle's active road hazard
      certificate paid a replacement for impact_break damage with a service date no more than impact_window_days calendar
      days before the visit, other_replacement_credit when that certificate paid a replacement for other damage within
      those days and none for impact_break damage, and 0.00 when it paid no replacement within those days or the vehicle
      has no active certificate.
      An advance-booking credit is taken off the labor charged, read from the latest appointment booked on the plan for the visit's
      date: advance_booking_credit when that appointment was booked at least advance_booking_days calendar days before
      the visit, short_notice_booking_credit when it was booked fewer than advance_booking_days days before the visit,
      and 0.00 when no appointment was booked on the plan for that date.
      Every reduction and credit this policy states is worked out on its own and taken off the pricing base; the labor charged is what remains, rounded to the nearest cent and never below 0.00, so a visit whose pricing base is 0.00 stays at 0.00.
    prerequisite: []
    cross_category:
      - category: tires
        as: branch
        reads: [install_date, status, variant_name]
        note: The new-tire visit credit reads the vehicle's active Crestline tire set, its install date and its line's alignment-check parameter.
      - category: hazard
        as: history
        reads: [hazard_certificate_id, status, hazard_events.service_date, hazard_events.damage_type]
        note: The road hazard impact credit reads the replacements paid on the vehicle's active certificate.
      - category: card
        as: history
        reads: [card_account_id, status, card_transactions.event_type]
        note: The cardholder labor rate reads the active card account and its late fees in the last 12 months.
    compute:
      - wo_date: "LATEST('alignment_events','event_date', event_type='alignment_service_performed', service_basis='none')"
      - wo_odo: "LATEST('alignment_events','odometer', event_type='alignment_service_performed', service_basis='none')"
      - inc_date: "LATEST('alignment_events','event_date', event_type='alignment_service_performed', service_basis='plan_included')"
      - inc_odo: "LATEST('alignment_events','odometer', event_type='alignment_service_performed', service_basis='plan_included')"
      - early_date: "LATEST('alignment_events','event_date', event_type='alignment_service_performed', service_basis='member_early_price')"
      - early_odo: "LATEST('alignment_events','odometer', event_type='alignment_service_performed', service_basis='member_early_price')"
      - use_early: "early_date != None and P('early_price_counts_as_interval') == True and early_date > inc_date"
      - anchor_date: "early_date if use_early else inc_date"
      - anchor_odo: "early_odo if use_early else inc_odo"
      - months_since_anchor: "MONTHS(anchor_date, wo_date)"
      - interval_reached: "months_since_anchor >= P('min_interval_months') or wo_odo - anchor_odo >= P('min_interval_miles')"
      - pending_requests: "COUNT('alignment_cancellation_requests', request_status='pending_customer_confirmation')"
      - lifetime_plan: "P('term_basis') == 'vehicle_ownership'"
      - labor_path_base: "K('standard_alignment_labor') if pending_requests > 0 else ((0 if interval_reached else P('member_early_alignment_price') * (P('min_interval_months') - months_since_anchor) / P('min_interval_months')) if lifetime_plan else (0 if interval_reached else P('member_early_alignment_price')))"
      - wo_type: "LATEST('alignment_events','alignment_type', event_type='alignment_service_performed', service_basis='none')"
      - type_cut: "K('thrust_cut') if wo_type == 'thrust' else (K('two_wheel_cut') if wo_type == 'two_wheel' else 0)"
      - card_open: "CFIELD('card','card_account_id', status='active')"
      - card_late12: "XCOUNT('card','card_transactions', within_months=12, date_field='txn_date', event_type='card_late_fee', card_account_id=card_open)"
      - card_labor_rate: "K('card_clean_rate') if (card_open != None and card_late12 == 0) else (K('card_late_rate') if (card_open != None and card_late12 > 0) else 0)"
      - t_install: "CFIELD('tires','install_date', vehicle_id=F('vehicle_id'), status='active')"
      - t_check: "CPARAM('tires','alignment_check_included', vehicle_id=F('vehicle_id'), status='active')"
      - t_days: "DAYS(t_install, wo_date) if t_install != None else 9999"
      - tire_visit_credit: "K('check_line_credit') if (t_days >= 0 and t_days <= P('tire_bundle_window_days') and t_check == True) else (K('plain_line_credit') if (t_days >= 0 and t_days <= P('tire_bundle_window_days') and t_check == False) else 0)"
      - hz_cert: "CFIELD('hazard','hazard_certificate_id', vehicle_id=F('vehicle_id'), status='active')"
      - hz_impact_date: "XLATEST('hazard','hazard_events','service_date', date_field='service_date', event_type='hazard_replacement', damage_type='impact_break', hazard_certificate_id=hz_cert)"
      - hz_any_date: "XLATEST('hazard','hazard_events','service_date', date_field='service_date', event_type='hazard_replacement', hazard_certificate_id=hz_cert)"
      - hz_impact_days: "DAYS(hz_impact_date, wo_date) if hz_impact_date != None else 9999"
      - hz_any_days: "DAYS(hz_any_date, wo_date) if hz_any_date != None else 9999"
      - impact_credit: "K('impact_replacement_credit') if (hz_impact_days >= 0 and hz_impact_days <= K('impact_window_days')) else (K('other_replacement_credit') if (hz_any_days >= 0 and hz_any_days <= K('impact_window_days')) else 0)"
      - bk_made: "LATEST('alignment_events','event_date', event_type='alignment_appointment_booked', appointment_date=wo_date)"
      - bk_lead: "DAYS(bk_made, wo_date) if bk_made != None else -1"
      - booking_credit: "K('advance_booking_credit') if bk_lead >= K('advance_booking_days') else (K('short_notice_booking_credit') if bk_lead >= 0 else 0)"
      - reductions: "labor_path_base * (type_cut + card_labor_rate)"
      - result: "RND(MX(labor_path_base - reductions - tire_visit_credit - impact_credit - booking_credit, 0), 2)"
    compute_basis:
      wo_date: "The labor of an open work order is worked out from the visit's work-order date, odometer and alignment type."
      wo_odo: "The labor of an open work order is worked out from the visit's work-order date, odometer and alignment type."
      inc_date: "The interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price alignment when that one is later and the tier's early_price_counts_as_interval is true."
      inc_odo: "The interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price alignment when that one is later and the tier's early_price_counts_as_interval is true."
      early_date: "The interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price alignment when that one is later and the tier's early_price_counts_as_interval is true."
      early_odo: "The interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price alignment when that one is later and the tier's early_price_counts_as_interval is true."
      use_early: "The interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price alignment when that one is later and the tier's early_price_counts_as_interval is true."
      anchor_date: "The interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price alignment when that one is later and the tier's early_price_counts_as_interval is true."
      anchor_odo: "The interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price alignment when that one is later and the tier's early_price_counts_as_interval is true."
      months_since_anchor: "The interval is reached when at least min_interval_months whole calendar months have passed from the anchor's date to the visit's date"
      interval_reached: "The interval is reached when at least min_interval_months whole calendar months have passed from the anchor's date to the visit's date, or when the visit's odometer is at least min_interval_miles above the anchor's odometer, whichever comes first."
      pending_requests: "On a plan that has a cancellation request awaiting the holder's confirmation, member pricing is suspended and the pricing base is the standard single-alignment labor, standard_alignment_labor, whether or not the interval is reached."
      lifetime_plan: "On a lifetime plan (term_basis vehicle_ownership) with no cancellation request awaiting confirmation, the pricing base follows the lifetime sliding scale"
      labor_path_base: "The pricing base follows the plan's standing. On a plan that has a cancellation request awaiting the holder's confirmation, member pricing is suspended and the pricing base is the standard single-alignment labor, standard_alignment_labor, whether or not the interval is reached. On a lifetime plan (term_basis vehicle_ownership) with no cancellation request awaiting confirmation, the pricing base follows the lifetime sliding scale: 0.00 when the interval is reached, and otherwise the tier's member_early_alignment_price times the whole calendar months still to run until min_interval_months, divided by min_interval_months. On a month-based plan with no cancellation request awaiting confirmation, the pricing base is as stated above."
      wo_type: "The labor of an open work order is worked out from the visit's work-order date, odometer and alignment type."
      type_cut: "An alignment-type reduction takes a percentage of the pricing base off the labor charged: thrust_cut for a thrust alignment, two_wheel_cut for a two-wheel alignment, and 0 for a four-wheel alignment."
      card_open: "card_clean_rate when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the plan desk's pricing"
      card_late12: "card_late_rate when that active account has had a late fee posted in those 12 months"
      card_labor_rate: "A cardholder labor reduction takes a percentage of the pricing base off the labor charged: card_clean_rate when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the plan desk's pricing, card_late_rate when that active account has had a late fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account."
      t_install: "check_line_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check"
      t_check: "check_line_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check"
      t_days: "check_line_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check"
      tire_visit_credit: "A new-tire visit credit is taken off the labor charged: check_line_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check, plain_line_credit when that set was installed within those days and its tire line does not include one, and 0.00 when the vehicle has no active Crestline tire set installed within those days."
      hz_cert: "impact_replacement_credit when the vehicle's active road hazard certificate paid a replacement for impact_break damage with a service date no more than impact_window_days calendar days before the visit"
      hz_impact_date: "impact_replacement_credit when the vehicle's active road hazard certificate paid a replacement for impact_break damage with a service date no more than impact_window_days calendar days before the visit"
      hz_any_date: "other_replacement_credit when that certificate paid a replacement for other damage within those days and none for impact_break damage"
      hz_impact_days: "impact_replacement_credit when the vehicle's active road hazard certificate paid a replacement for impact_break damage with a service date no more than impact_window_days calendar days before the visit"
      hz_any_days: "other_replacement_credit when that certificate paid a replacement for other damage within those days and none for impact_break damage"
      impact_credit: "A road hazard impact credit is taken off the labor charged: impact_replacement_credit when the vehicle's active road hazard certificate paid a replacement for impact_break damage with a service date no more than impact_window_days calendar days before the visit, other_replacement_credit when that certificate paid a replacement for other damage within those days and none for impact_break damage, and 0.00 when it paid no replacement within those days or the vehicle has no active certificate."
      bk_made: "read from the latest appointment booked on the plan for the visit's date"
      bk_lead: "advance_booking_credit when that appointment was booked at least advance_booking_days calendar days before the visit"
      booking_credit: "An advance-booking credit is taken off the labor charged, read from the latest appointment booked on the plan for the visit's date: advance_booking_credit when that appointment was booked at least advance_booking_days calendar days before the visit, short_notice_booking_credit when it was booked fewer than advance_booking_days days before the visit, and 0.00 when no appointment was booked on the plan for that date."
      reductions: "Every reduction and credit this policy states is worked out on its own and taken off the pricing base"
      result: "Every reduction and credit this policy states is worked out on its own and taken off the pricing base; the labor charged is what remains, rounded to the nearest cent and never below 0.00, so a visit whose pricing base is 0.00 stays at 0.00."
    factors:
      - id: member_pricing_path
        effect: method
        decides: labor_path_base
        bindings: [pending_requests, lifetime_plan, labor_path_base]
        ladder:
          - when: "the plan has a cancellation request awaiting the holder's confirmation"
            method: "member pricing suspended: the standard single-alignment labor (standard_alignment_labor), no interval test"
          - when: "a lifetime plan (term_basis vehicle_ownership) with no request awaiting confirmation"
            method: "lifetime sliding scale: 0.00 when the interval is reached, otherwise member_early_alignment_price x whole months still to run until min_interval_months / min_interval_months"
          - when: "otherwise (a month-based plan with no request awaiting confirmation)"
            method: "the pricing base as the computation states it: 0.00 when the interval is reached, the flat member_early_alignment_price otherwise"
        baseline:
          labor_path_base: "0 if interval_reached else P('member_early_alignment_price')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: alignment_type_reduction
        effect: parameter
        decides: type_cut
        bindings: [wo_type, type_cut]
        ladder:
          - when: "the visit's alignment is a thrust alignment"
            value: "K('thrust_cut')"
          - when: "the visit's alignment is a two-wheel alignment"
            value: "K('two_wheel_cut')"
          - when: "otherwise (a four-wheel alignment)"
            value: "0"
        baseline:
          type_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cardholder_labor_rate
        effect: parameter
        decides: card_labor_rate
        bindings: [card_open, card_late12, card_labor_rate]
        ladder:
          - when: "the customer has an active Crestline card account AND no late fee posted to it in the last 12 months"
            value: "K('card_clean_rate')"
          - when: "the customer has an active Crestline card account AND a late fee posted to it in the last 12 months"
            value: "K('card_late_rate')"
          - when: "otherwise (no active Crestline card account)"
            value: "0"
        baseline:
          card_labor_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: new_tire_visit_credit
        effect: parameter
        decides: tire_visit_credit
        bindings: [t_install, t_check, t_days, tire_visit_credit]
        ladder:
          - when: "the vehicle's active Crestline tire set was installed within tire_bundle_window_days before the visit AND its line includes a complimentary alignment check"
            value: "K('check_line_credit')"
          - when: "the vehicle's active Crestline tire set was installed within tire_bundle_window_days before the visit AND its line does not include one"
            value: "K('plain_line_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          tire_visit_credit: "0"
        evidence: [cross_category, date]
        cross_difficulty: tires
      - id: road_hazard_impact_credit
        effect: parameter
        decides: impact_credit
        bindings: [hz_cert, hz_impact_date, hz_any_date, hz_impact_days, hz_any_days, impact_credit]
        ladder:
          - when: "the vehicle's active road hazard certificate paid an impact_break replacement within impact_window_days before the visit"
            value: "K('impact_replacement_credit')"
          - when: "that certificate paid a replacement for other damage within those days and none for impact_break"
            value: "K('other_replacement_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          impact_credit: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: hazard
      - id: advance_booking_credit
        effect: parameter
        decides: booking_credit
        bindings: [bk_made, bk_lead, booking_credit]
        ladder:
          - when: "the latest appointment booked on the plan for the visit's date was booked at least advance_booking_days days before it"
            value: "K('advance_booking_credit')"
          - when: "it was booked fewer than advance_booking_days days before the visit"
            value: "K('short_notice_booking_credit')"
          - when: "otherwise (no appointment booked for that date)"
            value: "0.00"
        baseline:
          booking_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The labor of an open work order is worked out from the visit's work-order date, odometer and alignment type. The
        interval anchor of the visit is the plan's latest plan_included alignment, or the plan's latest member_early_price
        alignment when that one is later and the tier's early_price_counts_as_interval is true. The interval is reached
        when at least min_interval_months whole calendar months have passed from the anchor's date to the visit's date, or
        when the visit's odometer is at least min_interval_miles above the anchor's odometer, whichever comes first. The
        pricing base of the visit is 0.00 when the interval is reached and the tier's member_early_alignment_price
        otherwise. The labor charged is the pricing base rounded to the nearest cent and never below 0.00.
      params: [member_early_alignment_price, min_interval_months, min_interval_miles, early_price_counts_as_interval]
    inputs:
      history:
        - {table: alignment_events, aggregate: latest, field: event_date, filters: {event_type: alignment_service_performed}}
        - {table: alignment_cancellation_requests, aggregate: count, field: alignment_cancel_request_id, filters: {request_status: pending_customer_confirmation}}
        - {table: alignment_events, aggregate: latest, field: event_date, filters: {event_type: alignment_appointment_booked}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_late_fee}}
        - {category: hazard, table: hazard_events, aggregate: latest, field: service_date, filters: {event_type: hazard_replacement}}
      cross_category: [tires, hazard, card]

  - id: alignment_ext_open_visit_parts
    base_policy_refs: [alignment_evt_service, alignment_commercial_use_exclusion]
    overwrite:
      - base_policy: alignment_evt_service
        superseded_clause: >-
          parts_charge carries any of parts_charged_list the vehicle needed, plus steering_angle_reset_charge, plus
          adas_recalibration_charge when the vehicle requires a recalibration.
        replaced_by: >-
          For the latest work order of a plan whose adjustment parts the plan desk prices under this policy, and only for
          such a work order, the parts charge is the amount worked out below from the adjustment parts of
          parts_charged_list the store listed on it, and the tier's steering_angle_reset_charge is added to it; a work
          order on which the vehicle requires a recalibration carries any of parts_charged_list the vehicle needed, plus
          steering_angle_reset_charge, plus adas_recalibration_charge under the base rule, and so does every other work
          order.
    trigger: state_due
    subject: [alignment_service_performed]
    computes: parts_charge
    target_tool: price_work_order_parts_2c1ce050
    params:
      kit_lock_days: 90
      kit_reference_days: 365
      front_kit_install: 25.00
      both_axle_install: 45.00
      check_line_parts_rate: 0.10
      plain_line_parts_rate: 0.05
      card_parts_clean_rate: 0.05
      card_parts_late_rate: 0.02
    rule: >-
      A store that performs an alignment on a plan vehicle lists on the work order, as its parts charge, the adjustment
      parts it installed at their list price; the plan desk then prices the parts of the plan's latest work order, the
      alignment work order with the latest work-order date on the plan. For the latest work order of a plan whose
      adjustment parts the plan desk prices under this policy, and only for such a work order, the parts charge is the
      amount worked out below from the adjustment parts of parts_charged_list the store listed on it, and the tier's
      steering_angle_reset_charge is added to it; a work order on which the vehicle requires a recalibration carries any
      of parts_charged_list the vehicle needed, plus steering_angle_reset_charge, plus adas_recalibration_charge under the
      base rule, and so does every other work order.
      The kit charge of a work order is the parts the store listed on it at their list price, and the parts charge is the kit charge plus the tier's steering_angle_reset_charge, rounded to the nearest cent.
      The kit charge follows the plan's purchase-visit kit price, the parts charge of the plan's
      plan_included alignment dated on the plan's purchase date: when the store listed parts on the visit, the
      purchase-visit kit price is above 0.00 and no more than kit_lock_days calendar days separate the purchase date from
      the visit, the kit charge is the lower of the listed price and the purchase-visit kit price; when the store
      listed parts, the purchase-visit kit price is above 0.00 and more than kit_lock_days but no more than
      kit_reference_days calendar days separate them, the kit charge is the listed price less half of any amount by which the listed price exceeds the purchase-visit kit price; in every other case the kit charge is the listed price.
      Kit installation labor is charged on the work order as part of the parts charge: front_kit_install when the store listed parts and the visit's
      alignment is a thrust or two-wheel alignment, both_axle_install when the store listed parts and the visit's
      alignment is a four-wheel alignment, and 0.00 when the store listed no parts.
      A new-set parts reduction takes a percentage of the kit charge off the parts charge:
      check_line_parts_rate when the vehicle's active Crestline tire set was installed no more than
      tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check,
      plain_line_parts_rate when that set was installed within those days and its line does not include one, and 0 when
      the vehicle has no active Crestline tire set installed within those days.
      A cardholder parts reduction takes a percentage of the kit charge off the parts charge:
      card_parts_clean_rate when the customer has an active Crestline credit card account with no late fee posted to it
      in the 12 calendar months up to the pricing, card_parts_late_rate when that active account has had a late fee
      posted in those 12 months, and 0 when the customer has no active Crestline credit card account.
      Every charge and reduction this policy states is worked out on its own; the parts charge is the kit charge plus the steering angle reset charge, plus every charge and less every reduction that applies, rounded to the nearest cent.
    prerequisite: []
    cross_category:
      - category: tires
        as: branch
        reads: [install_date, status, variant_name]
        note: The new-set parts rate reads the vehicle's active Crestline tire set, its install date and its line's alignment-check parameter.
      - category: card
        as: history
        reads: [card_account_id, status, card_transactions.event_type]
        note: The cardholder parts rate reads the active card account and its late fees in the last 12 months.
    compute:
      - wo_date: "LATEST('alignment_events','event_date', event_type='alignment_service_performed')"
      - listed_parts: "LATEST('alignment_events','parts_charge', event_type='alignment_service_performed')"
      - purchase_kit: "MAX('alignment_events','parts_charge', event_type='alignment_service_performed', service_basis='plan_included', event_date=F('purchase_date'))"
      - kit_age_days: "DAYS(F('purchase_date'), wo_date)"
      - kit_price: "MN(listed_parts, purchase_kit) if (listed_parts > 0 and purchase_kit > 0 and kit_age_days <= K('kit_lock_days')) else ((listed_parts - MX(listed_parts - purchase_kit, 0) / 2) if (listed_parts > 0 and purchase_kit > 0 and kit_age_days <= K('kit_reference_days')) else listed_parts)"
      - wo_type: "LATEST('alignment_events','alignment_type', event_type='alignment_service_performed')"
      - install_labor: "K('front_kit_install') if (listed_parts > 0 and (wo_type == 'thrust' or wo_type == 'two_wheel')) else (K('both_axle_install') if (listed_parts > 0 and wo_type == 'four_wheel') else 0)"
      - t_install: "CFIELD('tires','install_date', vehicle_id=F('vehicle_id'), status='active')"
      - t_check: "CPARAM('tires','alignment_check_included', vehicle_id=F('vehicle_id'), status='active')"
      - t_days: "DAYS(t_install, wo_date) if t_install != None else 9999"
      - set_parts_rate: "K('check_line_parts_rate') if (t_days >= 0 and t_days <= P('tire_bundle_window_days') and t_check == True) else (K('plain_line_parts_rate') if (t_days >= 0 and t_days <= P('tire_bundle_window_days') and t_check == False) else 0)"
      - card_open: "CFIELD('card','card_account_id', status='active')"
      - card_late12: "XCOUNT('card','card_transactions', within_months=12, date_field='txn_date', event_type='card_late_fee', card_account_id=card_open)"
      - card_parts_rate: "K('card_parts_clean_rate') if (card_open != None and card_late12 == 0) else (K('card_parts_late_rate') if (card_open != None and card_late12 > 0) else 0)"
      - reductions: "kit_price * (set_parts_rate + card_parts_rate)"
      - result: "RND(kit_price + install_labor - reductions + P('steering_angle_reset_charge'), 2)"
    compute_basis:
      wo_date: "the plan desk then prices the parts of the plan's latest work order, the alignment work order with the latest work-order date on the plan."
      listed_parts: "The kit charge of a work order is the parts the store listed on it at their list price, and the parts charge is the kit charge plus the tier's steering_angle_reset_charge, rounded to the nearest cent."
      purchase_kit: "The kit charge follows the plan's purchase-visit kit price, the parts charge of the plan's plan_included alignment dated on the plan's purchase date"
      kit_age_days: "no more than kit_lock_days calendar days separate the purchase date from the visit"
      kit_price: "when the store listed parts on the visit, the purchase-visit kit price is above 0.00 and no more than kit_lock_days calendar days separate the purchase date from the visit, the kit charge is the lower of the listed price and the purchase-visit kit price; when the store listed parts, the purchase-visit kit price is above 0.00 and more than kit_lock_days but no more than kit_reference_days calendar days separate them, the kit charge is the listed price less half of any amount by which the listed price exceeds the purchase-visit kit price; in every other case the kit charge is the listed price."
      wo_type: "Kit installation labor is charged on the work order as part of the parts charge: front_kit_install when the store listed parts and the visit's alignment is a thrust or two-wheel alignment, both_axle_install when the store listed parts and the visit's alignment is a four-wheel alignment, and 0.00 when the store listed no parts."
      install_labor: "Kit installation labor is charged on the work order as part of the parts charge: front_kit_install when the store listed parts and the visit's alignment is a thrust or two-wheel alignment, both_axle_install when the store listed parts and the visit's alignment is a four-wheel alignment, and 0.00 when the store listed no parts."
      t_install: "check_line_parts_rate when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check"
      t_check: "check_line_parts_rate when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check"
      t_days: "check_line_parts_rate when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check"
      set_parts_rate: "A new-set parts reduction takes a percentage of the kit charge off the parts charge: check_line_parts_rate when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the visit and its tire line includes a complimentary alignment check, plain_line_parts_rate when that set was installed within those days and its line does not include one, and 0 when the vehicle has no active Crestline tire set installed within those days."
      card_open: "card_parts_clean_rate when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the pricing"
      card_late12: "card_parts_late_rate when that active account has had a late fee posted in those 12 months"
      card_parts_rate: "A cardholder parts reduction takes a percentage of the kit charge off the parts charge: card_parts_clean_rate when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the pricing, card_parts_late_rate when that active account has had a late fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account."
      reductions: "Every charge and reduction this policy states is worked out on its own"
      result: "Every charge and reduction this policy states is worked out on its own; the parts charge is the kit charge plus the steering angle reset charge, plus every charge and less every reduction that applies, rounded to the nearest cent."
    factors:
      - id: purchase_kit_reference
        effect: method
        decides: kit_price
        bindings: [purchase_kit, kit_age_days, kit_price]
        ladder:
          - when: "parts were listed AND the purchase-visit kit price is above 0.00 AND the visit is no more than kit_lock_days after the purchase date"
            method: "the kit charge is the lower of the listed price and the purchase-visit kit price"
          - when: "parts were listed AND the purchase-visit kit price is above 0.00 AND the visit is more than kit_lock_days but no more than kit_reference_days after the purchase date"
            method: "the kit charge is the listed price less half of any excess of the listed price over the purchase-visit kit price"
          - when: "otherwise"
            method: "the kit charge is the listed price"
        baseline:
          kit_price: "listed_parts"
        evidence: [history, date]
        cross_difficulty: null
      - id: kit_installation_labor
        effect: parameter
        decides: install_labor
        bindings: [wo_type, install_labor]
        ladder:
          - when: "parts were listed AND the visit's alignment is a thrust or two-wheel alignment"
            value: "K('front_kit_install')"
          - when: "parts were listed AND the visit's alignment is a four-wheel alignment"
            value: "K('both_axle_install')"
          - when: "otherwise (no parts listed)"
            value: "0.00"
        baseline:
          install_labor: "0"
        evidence: [history]
        cross_difficulty: null
      - id: new_set_parts_rate
        effect: parameter
        decides: set_parts_rate
        bindings: [t_install, t_check, t_days, set_parts_rate]
        ladder:
          - when: "the vehicle's active Crestline tire set was installed within tire_bundle_window_days before the visit AND its line includes a complimentary alignment check"
            value: "K('check_line_parts_rate')"
          - when: "installed within those days AND its line does not include one"
            value: "K('plain_line_parts_rate')"
          - when: "otherwise"
            value: "0"
        baseline:
          set_parts_rate: "0"
        evidence: [cross_category, date]
        cross_difficulty: tires
      - id: cardholder_parts_rate
        effect: parameter
        decides: card_parts_rate
        bindings: [card_open, card_late12, card_parts_rate]
        ladder:
          - when: "the customer has an active Crestline card account AND no late fee posted to it in the last 12 months"
            value: "K('card_parts_clean_rate')"
          - when: "the customer has an active Crestline card account AND a late fee posted to it in the last 12 months"
            value: "K('card_parts_late_rate')"
          - when: "otherwise (no active Crestline card account)"
            value: "0"
        baseline:
          card_parts_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
    baseline:
      rule: >-
        The kit charge of a work order is the parts the store listed on it at their list price, and the parts charge is the kit charge plus the tier's steering_angle_reset_charge, rounded to the nearest cent.
      params: [steering_angle_reset_charge]
    inputs:
      history:
        - {table: alignment_events, aggregate: latest, field: parts_charge, filters: {event_type: alignment_service_performed}}
        - {table: alignment_events, aggregate: max, field: parts_charge, filters: {event_type: alignment_service_performed, service_basis: plan_included}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_late_fee}}
      cross_category: [tires, card]

  - id: alignment_ext_cancellation_settlement
    base_policy_refs: [alignment_evt_cancellation_refund]
    overwrite:
      - base_policy: alignment_evt_cancellation_refund
        superseded_clause: >-
          The refund is purchase_price minus used_alignment_deduction for each included alignment already performed
          (alignment_msr_included_alignments, the purchase-day alignment included), never below 0.00; alignments charged
          at the member early price and readjustments are not deducted.
        replaced_by: >-
          For a plan whose cancellation the holder confirms under this policy, and only for such a plan, the refund is
          the amount worked out below: every included alignment already performed, the purchase-day alignment included,
          is deducted at the value this policy gives it, the charges of the plan's work orders dated the cancellation day
          are settled from it, and it is never below 0.00; alignments charged at the member early price and
          readjustments are not deducted.
    trigger: on_request
    subject: [alignment_cancellation, alignment_refund]
    computes: refund_amount
    target_tool: confirm_alignment_cancellation_b0865de9
    params:
      tire_day_check_value: 54.99
      tire_day_plain_value: 89.99
      thrust_share: 0.80
      two_wheel_share: 0.90
      fee_mid_from_days: 11
      fee_late_from_days: 21
      fee_mid: 10.00
      fee_late: 20.00
      request_hold_days: 7
      card_fee_clean_share: 0.50
      card_fee_late_share: 0.75
      usage_mid_from_miles: 500
      usage_high_from_miles: 2000
      usage_mid_fee: 7.50
      usage_high_fee: 15.00
    rule: >-
      A plan cancellation is completed when the holder confirms the cancellation request the agent registered on the
      plan, and the refund is booked with it. For a plan whose cancellation the holder confirms under this policy, and
      only for such a plan, the refund is the amount worked out below: every included alignment already performed, the
      purchase-day alignment included, is deducted at the value this policy gives it, the charges of the plan's work
      orders dated the cancellation day are settled from it, and it is never below 0.00; alignments charged at the
      member early price and readjustments are not deducted.
      The refund of a cancelled plan is fixed only after every work order on the plan dated the cancellation day carries
      its service basis.
      The refund of a cancelled plan is not paid until the parts on the plan's work orders of the cancellation day have
      been priced by the plan desk.
      The refund starts from the plan's purchase_price. Each plan_included alignment already performed on the plan, the
      purchase-day alignment included, is deducted at the tier's used_alignment_deduction. A processing fee is deducted
      by the plan's cancellation age, the calendar days from the purchase_date to the cancellation date: fee_late when
      the age is at least fee_late_from_days days, fee_mid when it is at least fee_mid_from_days days and below
      fee_late_from_days days, and 0.00 when it is below fee_mid_from_days days. The labor and parts charges of the plan's
      alignment work orders dated the cancellation day are open on that day's ticket and are settled from the refund.
      The refund is the purchase_price less the deductions, the processing fee and those open charges, rounded to the
      nearest cent and never below 0.00.
      A plan_included alignment performed on the install date of the vehicle's active Crestline tire set is valued, in
      place of used_alignment_deduction, at tire_day_check_value when that set's tire line includes a complimentary
      alignment check and at tire_day_plain_value when it does not; every other plan_included alignment keeps
      used_alignment_deduction, and so does every alignment when the vehicle has no active Crestline tire set.
      Each deducted alignment's value is multiplied by the deduction type share of the alignment performed: thrust_share
      for a thrust alignment, two_wheel_share for a two-wheel alignment, and 1.00 for a four-wheel alignment.
      The date the cancellation age runs to follows the plan's request history: when the request awaiting the holder's
      confirmation was registered no more than request_hold_days calendar days before the cancellation date and the plan also has a withdrawn request registered on or before the day the request awaiting confirmation was registered, the age runs to the registration date of the latest such withdrawn request; when the request awaiting confirmation was registered no more than request_hold_days days before the
      cancellation date and the plan has no such withdrawn request, the age runs to the registration date of the request awaiting confirmation; when the request awaiting confirmation was registered more than request_hold_days days
      before the cancellation date, the age runs to the cancellation date. The processing fee is read from the same age
      bands at whichever date applies.
      The processing fee is multiplied by the cardholder fee share: card_fee_clean_share when the customer has an active
      Crestline credit card account with no late fee posted to it in the 12 calendar months up to the cancellation,
      card_fee_late_share when that active account has had a late fee posted in those 12 months, and 1.00 when the
      customer has no active Crestline credit card account.
      A usage charge is deducted for the miles the vehicle has run under the plan, from the plan's purchase odometer to
      the odometer of its latest alignment work order: usage_high_fee when that is more than usage_high_from_miles miles,
      usage_mid_fee when it is at least usage_mid_from_miles and no more than usage_high_from_miles miles, and 0.00 when
      it is below usage_mid_from_miles miles.
      Every deduction, fee and charge this policy states is worked out on its own and taken from the purchase_price before the single rounding to the nearest cent, and the refund is never below 0.00.
    prerequisite:
      - problem: alignment_ext_open_visit_labor
        kind: value_input
        gate: open_labor
        form: state
        policy_source: >-
          The refund of a cancelled plan is fixed only after every work order on the plan dated the cancellation day
          carries its service basis.
        condition: >-
          No alignment work order on the plan dated the cancellation day carries service basis none; each carries
          plan_included or member_early_price with its labor charge.
        resolved_by: price_alignment_work_order_228c355b
        effect: >-
          Once the open work order of the cancellation day carries its basis and labor, that labor is among the open
          charges settled from the refund, lowering it by the labor amount booked.
      - problem: alignment_ext_open_visit_parts
        kind: value_input
        gate: open_parts
        form: action
        policy_source: >-
          The refund of a cancelled plan is not paid until the parts on the plan's work orders of the cancellation day
          have been priced by the plan desk.
        fallback_reason: >-
          Pricing the parts only replaces the figure in the same parts charge field that the store had already filled
          with its listed price; no status, basis or other record field shows whether that figure is the listed price
          or the priced amount, so no record-visible state singles out the pricing write.
        condition: >-
          The parts charge of the plan's work order dated the cancellation day holds the amount the plan desk priced
          for it, not the store's listed price.
        resolved_by: price_work_order_parts_2c1ce050
        effect: >-
          Once the parts are priced, the parts charge settled from the refund changes from the store's listed figure to
          the priced amount.
    cross_category:
      - category: tires
        as: branch
        reads: [install_date, status, variant_name]
        note: The tire-day alignment value reads the vehicle's active Crestline tire set, its install date and its line's alignment-check parameter.
      - category: card
        as: history
        reads: [card_account_id, status, card_transactions.event_type]
        note: The cardholder fee share reads the active card account and its late fees in the last 12 months.
    compute:
      - n_inc: "COUNT('alignment_events', event_type='alignment_service_performed', service_basis='plan_included')"
      - t_install: "CFIELD('tires','install_date', vehicle_id=F('vehicle_id'), status='active')"
      - t_check: "CPARAM('tires','alignment_check_included', vehicle_id=F('vehicle_id'), status='active')"
      - n_td: "COUNT('alignment_events', event_type='alignment_service_performed', service_basis='plan_included', event_date=t_install)"
      - td_value: "K('tire_day_check_value') if (n_td > 0 and t_check == True) else (K('tire_day_plain_value') if (n_td > 0 and t_check == False) else P('used_alignment_deduction'))"
      - n_thrust_inc: "COUNT('alignment_events', event_type='alignment_service_performed', service_basis='plan_included', alignment_type='thrust')"
      - n_two_inc: "COUNT('alignment_events', event_type='alignment_service_performed', service_basis='plan_included', alignment_type='two_wheel')"
      - n_td_thrust: "COUNT('alignment_events', event_type='alignment_service_performed', service_basis='plan_included', event_date=t_install, alignment_type='thrust')"
      - n_td_two: "COUNT('alignment_events', event_type='alignment_service_performed', service_basis='plan_included', event_date=t_install, alignment_type='two_wheel')"
      - share_sum: "n_inc - (n_thrust_inc * (1 - K('thrust_share')) if n_thrust_inc > 0 else 0) - (n_two_inc * (1 - K('two_wheel_share')) if n_two_inc > 0 else 0)"
      - td_share_sum: "K('thrust_share') * n_td_thrust + K('two_wheel_share') * n_td_two + (n_td - n_td_thrust - n_td_two)"
      - deduction: "P('used_alignment_deduction') * (share_sum - td_share_sum) + td_value * td_share_sum"
      - pending_at: "LATEST('alignment_cancellation_requests','created_at', date_field='created_at', request_status='pending_customer_confirmation')"
      - withdrawn_at: "LATEST('alignment_cancellation_requests','created_at', date_field='created_at', request_status='withdrawn')"
      - age_now: "DAYS(F('purchase_date'), NOW)"
      - age_pending: "DAYS(F('purchase_date'), pending_at) if pending_at != None else age_now"
      - age_withdrawn: "DAYS(F('purchase_date'), withdrawn_at) if withdrawn_at != None else age_now"
      - fee_now: "K('fee_late') if age_now >= K('fee_late_from_days') else (K('fee_mid') if age_now >= K('fee_mid_from_days') else 0)"
      - fee_pending: "K('fee_late') if age_pending >= K('fee_late_from_days') else (K('fee_mid') if age_pending >= K('fee_mid_from_days') else 0)"
      - fee_withdrawn: "K('fee_late') if age_withdrawn >= K('fee_late_from_days') else (K('fee_mid') if age_withdrawn >= K('fee_mid_from_days') else 0)"
      - pending_hold: "DAYS(pending_at, NOW) if pending_at != None else 9999"
      - processing_fee: "fee_withdrawn if (pending_hold <= K('request_hold_days') and withdrawn_at != None and pending_at != None and DAYS(withdrawn_at, pending_at) >= 0) else (fee_pending if pending_hold <= K('request_hold_days') else fee_now)"
      - card_open: "CFIELD('card','card_account_id', status='active')"
      - card_late12: "XCOUNT('card','card_transactions', within_months=12, date_field='txn_date', event_type='card_late_fee', card_account_id=card_open)"
      - card_fee_share: "K('card_fee_clean_share') if (card_open != None and card_late12 == 0) else (K('card_fee_late_share') if (card_open != None and card_late12 > 0) else 1.0)"
      - plan_odo_now: "LATEST('alignment_events','odometer', event_type='alignment_service_performed')"
      - plan_miles: "plan_odo_now - F('purchase_odometer')"
      - usage_fee: "K('usage_high_fee') if plan_miles > K('usage_high_from_miles') else (K('usage_mid_fee') if plan_miles >= K('usage_mid_from_miles') else 0)"
      - open_labor: "SUM('alignment_events','charge_amount', event_type='alignment_service_performed', event_date=NOW)"
      - open_parts: "SUM('alignment_events','parts_charge', event_type='alignment_service_performed', event_date=NOW)"
      - result: "RND(MX(F('purchase_price') - deduction - processing_fee * card_fee_share - usage_fee - open_labor - open_parts, 0), 2)"
    compute_basis:
      n_inc: "Each plan_included alignment already performed on the plan, the purchase-day alignment included, is deducted at the tier's used_alignment_deduction."
      t_install: "A plan_included alignment performed on the install date of the vehicle's active Crestline tire set is valued, in place of used_alignment_deduction"
      t_check: "at tire_day_check_value when that set's tire line includes a complimentary alignment check and at tire_day_plain_value when it does not"
      n_td: "A plan_included alignment performed on the install date of the vehicle's active Crestline tire set is valued, in place of used_alignment_deduction"
      td_value: "A plan_included alignment performed on the install date of the vehicle's active Crestline tire set is valued, in place of used_alignment_deduction, at tire_day_check_value when that set's tire line includes a complimentary alignment check and at tire_day_plain_value when it does not; every other plan_included alignment keeps used_alignment_deduction, and so does every alignment when the vehicle has no active Crestline tire set."
      n_thrust_inc: "Each deducted alignment's value is multiplied by the deduction type share of the alignment performed: thrust_share for a thrust alignment, two_wheel_share for a two-wheel alignment, and 1.00 for a four-wheel alignment."
      n_two_inc: "Each deducted alignment's value is multiplied by the deduction type share of the alignment performed: thrust_share for a thrust alignment, two_wheel_share for a two-wheel alignment, and 1.00 for a four-wheel alignment."
      n_td_thrust: "Each deducted alignment's value is multiplied by the deduction type share of the alignment performed"
      n_td_two: "Each deducted alignment's value is multiplied by the deduction type share of the alignment performed"
      share_sum: "Each deducted alignment's value is multiplied by the deduction type share of the alignment performed: thrust_share for a thrust alignment, two_wheel_share for a two-wheel alignment, and 1.00 for a four-wheel alignment."
      td_share_sum: "Each deducted alignment's value is multiplied by the deduction type share of the alignment performed: thrust_share for a thrust alignment, two_wheel_share for a two-wheel alignment, and 1.00 for a four-wheel alignment."
      deduction: "Each plan_included alignment already performed on the plan, the purchase-day alignment included, is deducted at the tier's used_alignment_deduction."
      pending_at: "the age runs to the registration date of the request awaiting confirmation"
      withdrawn_at: "the age runs to the registration date of the latest such withdrawn request"
      age_now: "A processing fee is deducted by the plan's cancellation age, the calendar days from the purchase_date to the cancellation date"
      age_pending: "the age runs to the registration date of the request awaiting confirmation"
      age_withdrawn: "the age runs to the registration date of the latest such withdrawn request"
      fee_now: "A processing fee is deducted by the plan's cancellation age, the calendar days from the purchase_date to the cancellation date: fee_late when the age is at least fee_late_from_days days, fee_mid when it is at least fee_mid_from_days days and below fee_late_from_days days, and 0.00 when it is below fee_mid_from_days days."
      fee_pending: "The processing fee is read from the same age bands at whichever date applies."
      fee_withdrawn: "The processing fee is read from the same age bands at whichever date applies."
      pending_hold: "when the request awaiting the holder's confirmation was registered no more than request_hold_days calendar days before the cancellation date"
      processing_fee: "The date the cancellation age runs to follows the plan's request history: when the request awaiting the holder's confirmation was registered no more than request_hold_days calendar days before the cancellation date and the plan also has a withdrawn request registered on or before the day the request awaiting confirmation was registered, the age runs to the registration date of the latest such withdrawn request; when the request awaiting confirmation was registered no more than request_hold_days days before the cancellation date and the plan has no such withdrawn request, the age runs to the registration date of the request awaiting confirmation; when the request awaiting confirmation was registered more than request_hold_days days before the cancellation date, the age runs to the cancellation date."
      card_open: "card_fee_clean_share when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the cancellation"
      card_late12: "card_fee_late_share when that active account has had a late fee posted in those 12 months"
      card_fee_share: "The processing fee is multiplied by the cardholder fee share: card_fee_clean_share when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the cancellation, card_fee_late_share when that active account has had a late fee posted in those 12 months, and 1.00 when the customer has no active Crestline credit card account."
      plan_odo_now: "from the plan's purchase odometer to the odometer of its latest alignment work order"
      plan_miles: "A usage charge is deducted for the miles the vehicle has run under the plan, from the plan's purchase odometer to the odometer of its latest alignment work order"
      usage_fee: "A usage charge is deducted for the miles the vehicle has run under the plan, from the plan's purchase odometer to the odometer of its latest alignment work order: usage_high_fee when that is more than usage_high_from_miles miles, usage_mid_fee when it is at least usage_mid_from_miles and no more than usage_high_from_miles miles, and 0.00 when it is below usage_mid_from_miles miles."
      open_labor: "The labor and parts charges of the plan's alignment work orders dated the cancellation day are open on that day's ticket and are settled from the refund."
      open_parts: "The labor and parts charges of the plan's alignment work orders dated the cancellation day are open on that day's ticket and are settled from the refund."
      result: "Every deduction, fee and charge this policy states is worked out on its own and taken from the purchase_price before the single rounding to the nearest cent, and the refund is never below 0.00."
    factors:
      - id: tire_day_alignment_value
        effect: parameter
        decides: td_value
        bindings: [t_check, td_value]
        ladder:
          - when: "a plan_included alignment was performed on the install date of the vehicle's active Crestline tire set AND that line includes a complimentary alignment check"
            value: "K('tire_day_check_value')"
          - when: "a plan_included alignment was performed on that install date AND the line does not include one"
            value: "K('tire_day_plain_value')"
          - when: "otherwise"
            value: "P('used_alignment_deduction')"
        baseline:
          td_value: "P('used_alignment_deduction')"
        evidence: [cross_category, history, date]
        cross_difficulty: tires
      - id: deduction_type_share
        effect: parameter
        decides: td_share_sum
        bindings: [n_thrust_inc, n_two_inc, n_td_thrust, n_td_two, share_sum, td_share_sum]
        ladder:
          - when: "the deducted alignment is a thrust alignment"
            value: "K('thrust_share')"
          - when: "the deducted alignment is a two-wheel alignment"
            value: "K('two_wheel_share')"
          - when: "otherwise (a four-wheel alignment)"
            value: "1.00"
        baseline:
          share_sum: "n_inc"
          td_share_sum: "n_td"
        evidence: [history]
        cross_difficulty: null
      - id: request_age_anchor
        effect: method
        decides: processing_fee
        bindings: [pending_hold, processing_fee]
        ladder:
          - when: "the request awaiting confirmation was registered no more than request_hold_days days before the cancellation date AND the plan has a withdrawn request registered on or before that registration day"
            method: "the cancellation age runs to the registration date of the latest withdrawn request and the fee is read at that age"
          - when: "the request awaiting confirmation was registered no more than request_hold_days days before the cancellation date AND the plan has no such withdrawn request"
            method: "the cancellation age runs to the registration date of the request awaiting confirmation and the fee is read at that age"
          - when: "otherwise (the request awaiting confirmation was registered more than request_hold_days days before the cancellation date)"
            method: "the cancellation age runs to the cancellation date and the fee is read at that age"
        baseline:
          processing_fee: "fee_now"
        evidence: [history, date]
        cross_difficulty: null
      - id: cardholder_fee_share
        effect: parameter
        decides: card_fee_share
        bindings: [card_open, card_late12, card_fee_share]
        ladder:
          - when: "an active Crestline card account AND no late fee posted to it in the last 12 months"
            value: "K('card_fee_clean_share')"
          - when: "an active Crestline card account AND a late fee posted to it in the last 12 months"
            value: "K('card_fee_late_share')"
          - when: "otherwise (no active Crestline card account)"
            value: "1.00"
        baseline:
          card_fee_share: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: plan_mileage_usage_charge
        effect: parameter
        decides: usage_fee
        bindings: [plan_odo_now, plan_miles, usage_fee]
        ladder:
          - when: "the vehicle has run more than usage_high_from_miles miles under the plan"
            value: "K('usage_high_fee')"
          - when: "it has run at least usage_mid_from_miles and no more than usage_high_from_miles miles"
            value: "K('usage_mid_fee')"
          - when: "otherwise (below usage_mid_from_miles miles)"
            value: "0.00"
        baseline:
          usage_fee: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The refund starts from the plan's purchase_price. Each plan_included alignment already performed on the plan, the
        purchase-day alignment included, is deducted at the tier's used_alignment_deduction. A processing fee is deducted
        by the plan's cancellation age, the calendar days from the purchase_date to the cancellation date: fee_late when
        the age is at least fee_late_from_days days, fee_mid when it is at least fee_mid_from_days days and below
        fee_late_from_days days, and 0.00 when it is below fee_mid_from_days days. The labor and parts charges of the
        plan's alignment work orders dated the cancellation day are open on that day's ticket and are settled from the
        refund. The refund is the purchase_price less the deductions, the processing fee and those open charges, rounded
        to the nearest cent and never below 0.00.
      params: [used_alignment_deduction, fee_mid, fee_late, fee_mid_from_days, fee_late_from_days]
    inputs:
      history:
        - {table: alignment_events, aggregate: count, field: alignment_event_id, filters: {event_type: alignment_service_performed, service_basis: plan_included}}
        - {table: alignment_events, aggregate: sum, field: charge_amount, filters: {event_type: alignment_service_performed}}
        - {table: alignment_cancellation_requests, aggregate: latest, field: created_at, filters: {request_status: pending_customer_confirmation}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_late_fee}}
      cross_category: [tires, card]

  - id: alignment_ext_household_enrollment
    base_policy_refs: [alignment_agg_multi_holding, alignment_agg_one_per_vehicle, alignment_purchase_pricing, alignment_commercial_use_exclusion]
    overwrite:
      - base_policy: alignment_purchase_pricing
        superseded_clause: >-
          purchase_price is plan_price minus tire_bundle_discount when alignment_msr_tire_bundle is true, and plan_price
          otherwise; the bundle discount is never combined with a fleet discount, and when the ticket is charged to a
          fleet account the fleet discount applies only where fleet_discount_applicable is true.
        replaced_by: >-
          For a household plan sold under this policy, and only for such a plan, purchase_price is the household price
          worked out below in place of the tire bundle price, a household plan is never charged to a fleet account, and
          no tire bundle or fleet discount is combined with the household price; every plan that is neither a household
          plan nor a renewal of an expired month-based plan is priced at plan_price less tire_bundle_discount when
          alignment_msr_tire_bundle is true and at plan_price otherwise, the bundle discount never combined with a fleet
          discount and the fleet discount applying on a fleet ticket only where fleet_discount_applicable is true.
      - base_policy: alignment_purchase_pricing
        superseded_clause: >-
          The first alignment is performed on the purchase visit as an included alignment.
        replaced_by: >-
          For a household plan sold under this policy, and only for such a plan, the first alignment is performed on the
          purchase visit as an included alignment unless the vehicle has already been aligned that day under the holding
          the plan replaces, in which case no second alignment is performed on that visit; every plan that is neither a
          household plan nor a renewal of an expired month-based plan keeps its purchase-visit alignment.
    trigger: on_request
    subject: [alignment_purchase]
    computes: purchase_price
    target_tool: enroll_household_alignment_plan_f0fe3800
    params:
      household_rate_standard: 0.10
      loyal_rate_top: 0.25
      loyal_rate_mid: 0.18
      top_tenure_months: 24
      mid_tenure_months: 12
      top_count: 3
      mid_count: 2
      card_household_clean: 0.05
      card_household_late: 0.02
      per_tire_protection_credit: 5.00
      flat_protection_credit: 10.00
      full_price_credit: 15.00
      bundle_price_credit: 5.00
      recent_service_months: 6
      lapsing_service_months: 12
      recent_service_credit: 10.00
      lapsing_service_credit: 5.00
    rule: >-
      A customer who holds an active lifetime alignment plan (Crestline Lifetime Alignment Plan or Crestline Lifetime
      Alignment Plan Truck & Performance) may buy a plan of the same tier for another vehicle they own at the household
      price; the plan they already hold is the household plan, and the new plan is a household plan. The vehicle's class
      must be in the tier's entry_gate list and the vehicle must be in personal use, and the household plan is valid only
      on the vehicle it is bought for. For a household plan sold under this policy, and only for such a plan,
      purchase_price is the household price worked out below in place of the tire bundle price, a household plan is
      never charged to a fleet account, and no tire bundle or fleet discount is combined with the household price; every
      plan that is neither a household plan nor a renewal of an expired month-based plan is priced at plan_price less
      tire_bundle_discount when alignment_msr_tire_bundle is true and at plan_price otherwise, the bundle discount never
      combined with a fleet discount and the fleet discount applying on a fleet ticket only where
      fleet_discount_applicable is true. For a household plan sold under this policy, and only for such a plan, the first
      alignment is performed on the purchase visit as an included alignment unless the vehicle has already been aligned
      that day under the holding the plan replaces, in which case no second alignment is performed on that visit; every
      plan that is neither a household plan nor a renewal of an expired month-based plan keeps its purchase-visit
      alignment.
      A household plan is sold only after the vehicle it is bought for carries no active alignment service or plan.
      The household price is the tier's plan_price reduced by the standard household rate of household_rate_standard,
      rounded to the nearest cent.
      The household rate depends on the household plan's loyalty, read from its tenure and from its loyalty count, the
      number of plan_included alignments on the household plan in the trailing 24 calendar months: loyal_rate_top when
      the household plan has been held at least top_tenure_months whole calendar months and its loyalty count is at
      least top_count, loyal_rate_mid when it has been held at least mid_tenure_months whole calendar months with a
      loyalty count of at least mid_count and does not reach the top tier, and household_rate_standard otherwise.
      A cardholder household reduction takes a percentage of plan_price off the household price: card_household_clean when the customer has an active
      Crestline credit card account with no late fee posted to it in the last 12 calendar months, card_household_late
      when that active account has had a late fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account.
      A protection credit is taken off the household price, computed by the road hazard protection the customer holds: when the
      customer holds an active Crestline Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread
      Protection certificate, the credit is per_tire_protection_credit for each tire that certificate covers, the Plus 36-Month certificate's tires counting when the customer holds both kinds; when the
      customer holds only another active road hazard certificate, the credit is the flat flat_protection_credit; when the
      customer holds no active road hazard certificate, no protection credit is given.
      A household plan purchase credit is taken off the household price: full_price_credit when the household plan was itself
      bought at its tier's full plan_price, bundle_price_credit when it was bought at plan_price less exactly its tier's
      tire_bundle_discount, and 0.00 when it was bought at any other price.
      A service-currency credit is taken off the household price, by the household plan's latest plan_included alignment:
      recent_service_credit when it is no more than recent_service_months whole calendar months before the purchase,
      lapsing_service_credit when it is more than recent_service_months but no more than lapsing_service_months whole
      calendar months before it, and 0.00 when it is older.
      Every rate and credit this policy states is worked out on its own and taken off plan_price; the household price is what remains, rounded to the nearest cent and never below 0.00.
    prerequisite:
      - problem: alignment_ext_cancellation_settlement
        kind: state_gate
        gate: alignment_agg_one_per_vehicle.one_active_per_vehicle
        form: state
        policy_source: >-
          A household plan is sold only after the vehicle it is bought for carries no active alignment service or plan.
        condition: >-
          No alignment plan on the vehicle the household plan is bought for is in status active.
        resolved_by: confirm_alignment_cancellation_b0865de9
        effect: >-
          Once the holding on that vehicle is cancelled its status is cancelled, the one-active-plan-per-vehicle gate of
          the purchase holds, and the household plan may be sold.
    cross_category:
      - category: card
        as: history
        reads: [card_account_id, status, card_transactions.event_type]
        note: The cardholder household rate reads the active card account and its late fees in the last 12 months.
      - category: hazard
        as: branch
        reads: [status, variant_name, covered_tire_count]
        note: The protection credit reads which active road hazard certificate the customer holds and how many tires it covers.
    compute:
      - tenure_months: "MONTHS(F('purchase_date'), NOW)"
      - loyalty_count: "COUNT('alignment_events', within_months=24, event_type='alignment_service_performed', service_basis='plan_included')"
      - loyalty_rate: "K('loyal_rate_top') if (tenure_months >= K('top_tenure_months') and loyalty_count >= K('top_count')) else (K('loyal_rate_mid') if (tenure_months >= K('mid_tenure_months') and loyalty_count >= K('mid_count')) else K('household_rate_standard'))"
      - card_open: "CFIELD('card','card_account_id', status='active')"
      - card_late12: "XCOUNT('card','card_transactions', within_months=12, date_field='txn_date', event_type='card_late_fee', card_account_id=card_open)"
      - card_household_rate: "K('card_household_clean') if (card_open != None and card_late12 == 0) else (K('card_household_late') if (card_open != None and card_late12 > 0) else 0)"
      - plus_tires: "CFIELD('hazard','covered_tire_count', status='active', variant_name='Crestline Road Hazard Plus 36-Month Protection')"
      - lot_tires: "CFIELD('hazard','covered_tire_count', status='active', variant_name='Crestline Road Hazard Life-of-Tread Protection')"
      - hz_any: "EXISTS('hazard', status='active')"
      - protection_credit: "K('per_tire_protection_credit') * (plus_tires if plus_tires != None else lot_tires) if (plus_tires != None or lot_tires != None) else (K('flat_protection_credit') if hz_any else 0)"
      - household_paid: "LATEST('alignment_plans','purchase_price', date_field='purchase_date')"
      - household_purchase_credit: "K('full_price_credit') if household_paid == P('plan_price') else (K('bundle_price_credit') if RND(P('plan_price') - household_paid, 2) == P('tire_bundle_discount') else 0)"
      - last_included: "LATEST('alignment_events','event_date', event_type='alignment_service_performed', service_basis='plan_included')"
      - service_age_months: "MONTHS(last_included, NOW) if last_included != None else 9999"
      - service_credit: "K('recent_service_credit') if service_age_months <= K('recent_service_months') else (K('lapsing_service_credit') if service_age_months <= K('lapsing_service_months') else 0)"
      - reductions: "P('plan_price') * (loyalty_rate + card_household_rate)"
      - result: "RND(MX(P('plan_price') - reductions - protection_credit - household_purchase_credit - service_credit, 0), 2)"
    compute_basis:
      tenure_months: "loyal_rate_top when the household plan has been held at least top_tenure_months whole calendar months and its loyalty count is at least top_count"
      loyalty_count: "The household rate depends on the household plan's loyalty, read from its tenure and from its loyalty count, the number of plan_included alignments on the household plan in the trailing 24 calendar months"
      loyalty_rate: "The household rate depends on the household plan's loyalty, read from its tenure and from its loyalty count, the number of plan_included alignments on the household plan in the trailing 24 calendar months: loyal_rate_top when the household plan has been held at least top_tenure_months whole calendar months and its loyalty count is at least top_count, loyal_rate_mid when it has been held at least mid_tenure_months whole calendar months with a loyalty count of at least mid_count and does not reach the top tier, and household_rate_standard otherwise."
      card_open: "card_household_clean when the customer has an active Crestline credit card account with no late fee posted to it in the last 12 calendar months"
      card_late12: "card_household_late when that active account has had a late fee posted in those 12 months"
      card_household_rate: "A cardholder household reduction takes a percentage of plan_price off the household price: card_household_clean when the customer has an active Crestline credit card account with no late fee posted to it in the last 12 calendar months, card_household_late when that active account has had a late fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account."
      plus_tires: "the credit is per_tire_protection_credit for each tire that certificate covers"
      lot_tires: "the credit is per_tire_protection_credit for each tire that certificate covers"
      hz_any: "when the customer holds only another active road hazard certificate, the credit is the flat flat_protection_credit"
      protection_credit: "A protection credit is taken off the household price, computed by the road hazard protection the customer holds: when the customer holds an active Crestline Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread Protection certificate, the credit is per_tire_protection_credit for each tire that certificate covers, the Plus 36-Month certificate's tires counting when the customer holds both kinds; when the customer holds only another active road hazard certificate, the credit is the flat flat_protection_credit; when the customer holds no active road hazard certificate, no protection credit is given."
      household_paid: "full_price_credit when the household plan was itself bought at its tier's full plan_price"
      household_purchase_credit: "A household plan purchase credit is taken off the household price: full_price_credit when the household plan was itself bought at its tier's full plan_price, bundle_price_credit when it was bought at plan_price less exactly its tier's tire_bundle_discount, and 0.00 when it was bought at any other price."
      last_included: "A service-currency credit is taken off the household price, by the household plan's latest plan_included alignment"
      service_age_months: "recent_service_credit when it is no more than recent_service_months whole calendar months before the purchase"
      service_credit: "A service-currency credit is taken off the household price, by the household plan's latest plan_included alignment: recent_service_credit when it is no more than recent_service_months whole calendar months before the purchase, lapsing_service_credit when it is more than recent_service_months but no more than lapsing_service_months whole calendar months before it, and 0.00 when it is older."
      reductions: "Every rate and credit this policy states is worked out on its own and taken off plan_price"
      result: "Every rate and credit this policy states is worked out on its own and taken off plan_price; the household price is what remains, rounded to the nearest cent and never below 0.00."
    factors:
      - id: household_loyalty_rate
        effect: parameter
        decides: loyalty_rate
        bindings: [tenure_months, loyalty_count, loyalty_rate]
        ladder:
          - when: "the household plan has been held at least top_tenure_months months AND its loyalty count is at least top_count"
            value: "K('loyal_rate_top')"
          - when: "the household plan has been held at least mid_tenure_months months AND its loyalty count is at least mid_count, short of the top tier"
            value: "K('loyal_rate_mid')"
          - when: "otherwise"
            value: "K('household_rate_standard')"
        baseline:
          loyalty_rate: "K('household_rate_standard')"
        evidence: [history, date]
        cross_difficulty: null
      - id: cardholder_household_rate
        effect: parameter
        decides: card_household_rate
        bindings: [card_open, card_late12, card_household_rate]
        ladder:
          - when: "an active Crestline card account AND no late fee posted to it in the last 12 months"
            value: "K('card_household_clean')"
          - when: "an active Crestline card account AND a late fee posted to it in the last 12 months"
            value: "K('card_household_late')"
          - when: "otherwise (no active Crestline card account)"
            value: "0"
        baseline:
          card_household_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: protection_credit_basis
        effect: method
        decides: protection_credit
        bindings: [plus_tires, lot_tires, hz_any, protection_credit]
        ladder:
          - when: "the customer holds an active Road Hazard Plus 36-Month or Life-of-Tread certificate"
            method: "per covered tire: per_tire_protection_credit times the number of tires that certificate covers"
          - when: "the customer holds only another active road hazard certificate"
            method: "a flat flat_protection_credit"
          - when: "otherwise (no active certificate)"
            method: "no protection credit"
        baseline:
          protection_credit: "0"
        evidence: [cross_category]
        cross_difficulty: hazard
      - id: household_plan_price_credit
        effect: parameter
        decides: household_purchase_credit
        bindings: [household_paid, household_purchase_credit]
        ladder:
          - when: "the household plan was bought at its tier's full plan_price"
            value: "K('full_price_credit')"
          - when: "the household plan was bought at plan_price less exactly its tier's tire_bundle_discount"
            value: "K('bundle_price_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          household_purchase_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: household_service_currency
        effect: parameter
        decides: service_credit
        bindings: [last_included, service_age_months, service_credit]
        ladder:
          - when: "the household plan's latest plan_included alignment is no more than recent_service_months months before the purchase"
            value: "K('recent_service_credit')"
          - when: "it is more than recent_service_months but no more than lapsing_service_months months before"
            value: "K('lapsing_service_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          service_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The household price is the tier's plan_price reduced by the standard household rate of household_rate_standard,
        rounded to the nearest cent.
      params: [plan_price, household_rate_standard]
    inputs:
      history:
        - {table: alignment_events, aggregate: count, field: alignment_event_id, within_months: 24, filters: {event_type: alignment_service_performed, service_basis: plan_included}}
        - {table: alignment_events, aggregate: latest, field: event_date, filters: {event_type: alignment_service_performed, service_basis: plan_included}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_late_fee}}
      cross_category: [card, hazard]

  - id: alignment_ext_term_renewal
    base_policy_refs: [alignment_agg_multi_holding, alignment_agg_one_per_vehicle, alignment_purchase_pricing, alignment_commercial_use_exclusion]
    overwrite:
      - base_policy: alignment_purchase_pricing
        superseded_clause: >-
          purchase_price is plan_price minus tire_bundle_discount when alignment_msr_tire_bundle is true, and plan_price
          otherwise; the bundle discount is never combined with a fleet discount, and when the ticket is charged to a
          fleet account the fleet discount applies only where fleet_discount_applicable is true.
        replaced_by: >-
          For a renewal of an expired month-based plan sold under this policy, and only for such a renewal,
          purchase_price is the renewal price worked out below in place of the tire bundle price, a renewal is never charged to a fleet account, and no fleet discount is combined with
          it; every plan that is neither a renewal nor a household plan is priced at plan_price less tire_bundle_discount
          when alignment_msr_tire_bundle is true and at plan_price otherwise, the bundle discount never combined with a
          fleet discount and the fleet discount applying on a fleet ticket only where fleet_discount_applicable is true.
      - base_policy: alignment_purchase_pricing
        superseded_clause: >-
          The first alignment is performed on the purchase visit as an included alignment.
        replaced_by: >-
          For a renewal sold under this policy, and only for such a renewal, the first alignment is performed on the
          purchase visit as an included alignment unless the vehicle received a guarantee readjustment under the expired
          plan on the renewal date, in which case that readjustment stands as the visit's alignment and no second
          alignment is performed; every plan that is neither a renewal nor a household plan keeps its purchase-visit
          alignment.
    trigger: on_request
    subject: [alignment_purchase]
    computes: purchase_price
    target_tool: renew_alignment_plan_418ab11e
    params:
      grace_window_months: 7
      grace_days_after_expiry: 30
      reinstatement_charge: 20.00
      final_stretch_months: 6
      renewal_rate_top: 0.15
      renewal_rate_base: 0.10
      top_included_count: 5
      mid_included_count: 3
      same_day_readjustment_credit: 25.00
      recent_readjustment_credit: 12.50
      recent_readjustment_days: 30
      card_renewal_clean: 0.05
      card_renewal_late: 0.02
      plus_renewal_credit: 15.00
      renewal_protection_credit: 7.50
      extended_bundle_days: 60
      extended_bundle_credit: 15.00
    rule: >-
      A customer whose month-based alignment plan (Crestline 1-Year Alignment Plan or Crestline 3-Year Alignment Plan)
      has expired may renew it: a renewal is a new plan of the same tier for the same vehicle, bought by the customer at
      the renewal price, with expiration_date the purchase_date plus plan_term_months counted as calendar months to the
      same day of the month (falling back to the last day of that month). The vehicle must still be inside the tier's
      entry_gate list and in personal use. For a renewal of an expired month-based plan sold under this policy, and only
      for such a renewal, purchase_price is the renewal price worked out below in place of the tire bundle price, a renewal is never charged to a fleet account, and no fleet discount is
      combined with it; every plan that is neither a renewal nor a household plan is priced at plan_price less
      tire_bundle_discount when alignment_msr_tire_bundle is true and at plan_price otherwise, the bundle discount never
      combined with a fleet discount and the fleet discount applying on a fleet ticket only where
      fleet_discount_applicable is true. For a renewal sold under this policy, and only for such a renewal, the first
      alignment is performed on the purchase visit as an included alignment unless the vehicle received a guarantee
      readjustment under the expired plan on the renewal date, in which case that readjustment stands as the visit's
      alignment and no second alignment is performed; every plan that is neither a renewal nor a household plan keeps
      its purchase-visit alignment.
      A renewal is priced only after every readjustment under the expired plan dated the renewal day carries its
      guarantee basis.
      The renewal price is the tier's plan_price, plus a reinstatement charge of reinstatement_charge when the renewal comes more than grace_days_after_expiry calendar days after the expiration_date, rounded to the nearest cent.
      A renewal-rate reduction takes a percentage of plan_price off the renewal price, set by the plan_included alignments the expired plan recorded over its term: renewal_rate_top when at least top_included_count, renewal_rate_base when at least mid_included_count but fewer than top_included_count, and 0 when fewer than mid_included_count.
      The grace period is anchored on the expired plan's service history: when its latest plan_included alignment fell
      within the final final_stretch_months whole calendar months of its term, the grace period runs from that alignment
      and the renewal must come fewer than grace_window_months whole calendar months after it; when no plan_included
      alignment but a member_early_price alignment fell within that final stretch, the grace period runs from the latest
      such alignment in the same way; in every other case the grace period runs from the expiration_date and the renewal must come no more than grace_days_after_expiry calendar days after it. A renewal inside its grace period carries no reinstatement charge, and a renewal outside it carries reinstatement_charge.
      A cardholder renewal reduction takes a percentage of plan_price off the renewal price: card_renewal_clean when the customer has an active
      Crestline credit card account with no late fee posted to it in the last 12 calendar months, card_renewal_late when
      that active account has had a late fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account.
      A readjustment-day credit is taken off the renewal price: same_day_readjustment_credit when the vehicle received a guarantee
      readjustment under the expired plan on the renewal date, recent_readjustment_credit when its latest guarantee
      readjustment under the expired plan came within recent_readjustment_days calendar days before the renewal date but
      not on it, and 0.00 otherwise.
      A road hazard renewal credit is taken off the renewal price: plus_renewal_credit when the vehicle's tires carry an active Crestline
      Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread Protection certificate,
      renewal_protection_credit when they carry another active road hazard certificate, and 0.00 when they carry none.
      A renewal tire bundle is taken off the renewal price: the tier's tire_bundle_discount when the vehicle's active Crestline
      tire set was installed no more than tire_bundle_window_days calendar days before the renewal date,
      extended_bundle_credit when it was installed more than tire_bundle_window_days but no more than
      extended_bundle_days calendar days before it, and 0.00 when it was installed earlier or the vehicle has no active
      Crestline tire set.
      Every reduction, credit and charge this policy states is worked out on its own and applied to plan_price; the renewal price is what results, rounded to the nearest cent and never below 0.00.
    prerequisite:
      - problem: alignment_ext_readjustment_parts
        kind: value_input
        gate: readjustment_day_credit
        form: state
        policy_source: >-
          A renewal is priced only after every readjustment under the expired plan dated the renewal day carries its
          guarantee basis.
        condition: >-
          No readjustment on the expired plan dated the renewal date carries service basis none; each carries
          guarantee_readjustment.
        resolved_by: price_alignment_readjustment_e00d4c5e
        effect: >-
          Once the renewal-day readjustment carries guarantee_readjustment, the readjustment-day credit moves from 0.00
          to same_day_readjustment_credit, lowering the renewal price.
    cross_category:
      - category: card
        as: history
        reads: [card_account_id, status, card_transactions.event_type]
        note: The cardholder renewal rate reads the active card account and its late fees in the last 12 months.
      - category: hazard
        as: existence
        reads: [status, variant_name, vehicle_id]
        note: The road hazard renewal credit reads which active certificate the vehicle's tires carry.
      - category: tires
        as: branch
        reads: [install_date, status, vehicle_id]
        note: The renewal tire bundle reads the install date of the vehicle's active Crestline tire set.
    compute:
      - inc_term: "COUNT('alignment_events', event_type='alignment_service_performed', service_basis='plan_included')"
      - last_inc: "LATEST('alignment_events','event_date', event_type='alignment_service_performed', service_basis='plan_included')"
      - last_early: "LATEST('alignment_events','event_date', event_type='alignment_service_performed', service_basis='member_early_price')"
      - inc_in_stretch: "last_inc != None and MONTHS(last_inc, F('expiration_date')) < K('final_stretch_months')"
      - early_in_stretch: "last_early != None and MONTHS(last_early, F('expiration_date')) < K('final_stretch_months')"
      - reinstatement: "(0 if MONTHS(last_inc, NOW) < K('grace_window_months') else K('reinstatement_charge')) if inc_in_stretch else ((0 if MONTHS(last_early, NOW) < K('grace_window_months') else K('reinstatement_charge')) if early_in_stretch else (0 if DAYS(F('expiration_date'), NOW) <= K('grace_days_after_expiry') else K('reinstatement_charge')))"
      - renewal_rate: "K('renewal_rate_top') if inc_term >= K('top_included_count') else (K('renewal_rate_base') if inc_term >= K('mid_included_count') else 0)"
      - card_open: "CFIELD('card','card_account_id', status='active')"
      - card_late12: "XCOUNT('card','card_transactions', within_months=12, date_field='txn_date', event_type='card_late_fee', card_account_id=card_open)"
      - card_renewal_rate: "K('card_renewal_clean') if (card_open != None and card_late12 == 0) else (K('card_renewal_late') if (card_open != None and card_late12 > 0) else 0)"
      - readj_today: "COUNT('alignment_events', event_type='alignment_readjustment', service_basis='guarantee_readjustment', event_date=NOW)"
      - readj_last: "LATEST('alignment_events','event_date', event_type='alignment_readjustment', service_basis='guarantee_readjustment')"
      - readj_last_days: "DAYS(readj_last, NOW) if readj_last != None else 9999"
      - readjustment_day_credit: "K('same_day_readjustment_credit') if readj_today > 0 else (K('recent_readjustment_credit') if (readj_last_days > 0 and readj_last_days <= K('recent_readjustment_days')) else 0)"
      - hz_plus: "EXISTS('hazard', status='active', vehicle_id=F('vehicle_id'), variant_name='Crestline Road Hazard Plus 36-Month Protection') or EXISTS('hazard', status='active', vehicle_id=F('vehicle_id'), variant_name='Crestline Road Hazard Life-of-Tread Protection')"
      - hz_any: "EXISTS('hazard', status='active', vehicle_id=F('vehicle_id'))"
      - hazard_renewal_credit: "K('plus_renewal_credit') if hz_plus else (K('renewal_protection_credit') if hz_any else 0)"
      - t_install: "CFIELD('tires','install_date', vehicle_id=F('vehicle_id'), status='active')"
      - t_days: "DAYS(t_install, NOW) if t_install != None else 9999"
      - renewal_tire_bundle: "P('tire_bundle_discount') if (t_days >= 0 and t_days <= P('tire_bundle_window_days')) else (K('extended_bundle_credit') if (t_days > P('tire_bundle_window_days') and t_days <= K('extended_bundle_days')) else 0)"
      - reductions: "P('plan_price') * (renewal_rate + card_renewal_rate)"
      - result: "RND(MX(P('plan_price') - reductions + reinstatement - readjustment_day_credit - hazard_renewal_credit - renewal_tire_bundle, 0), 2)"
    compute_basis:
      inc_term: "set by the plan_included alignments the expired plan recorded over its term"
      last_inc: "when its latest plan_included alignment fell within the final final_stretch_months whole calendar months of its term, the grace period runs from that alignment and the renewal must come fewer than grace_window_months whole calendar months after it"
      last_early: "when no plan_included alignment but a member_early_price alignment fell within that final stretch, the grace period runs from the latest such alignment in the same way"
      inc_in_stretch: "when its latest plan_included alignment fell within the final final_stretch_months whole calendar months of its term"
      early_in_stretch: "when no plan_included alignment but a member_early_price alignment fell within that final stretch"
      reinstatement: "The grace period is anchored on the expired plan's service history: when its latest plan_included alignment fell within the final final_stretch_months whole calendar months of its term, the grace period runs from that alignment and the renewal must come fewer than grace_window_months whole calendar months after it; when no plan_included alignment but a member_early_price alignment fell within that final stretch, the grace period runs from the latest such alignment in the same way; in every other case the grace period runs from the expiration_date and the renewal must come no more than grace_days_after_expiry calendar days after it. A renewal inside its grace period carries no reinstatement charge, and a renewal outside it carries reinstatement_charge."
      renewal_rate: "A renewal-rate reduction takes a percentage of plan_price off the renewal price, set by the plan_included alignments the expired plan recorded over its term: renewal_rate_top when at least top_included_count, renewal_rate_base when at least mid_included_count but fewer than top_included_count, and 0 when fewer than mid_included_count."
      card_open: "card_renewal_clean when the customer has an active Crestline credit card account with no late fee posted to it in the last 12 calendar months"
      card_late12: "card_renewal_late when that active account has had a late fee posted in those 12 months"
      card_renewal_rate: "A cardholder renewal reduction takes a percentage of plan_price off the renewal price: card_renewal_clean when the customer has an active Crestline credit card account with no late fee posted to it in the last 12 calendar months, card_renewal_late when that active account has had a late fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account."
      readj_today: "same_day_readjustment_credit when the vehicle received a guarantee readjustment under the expired plan on the renewal date"
      readj_last: "recent_readjustment_credit when its latest guarantee readjustment under the expired plan came within recent_readjustment_days calendar days before the renewal date but not on it"
      readj_last_days: "recent_readjustment_credit when its latest guarantee readjustment under the expired plan came within recent_readjustment_days calendar days before the renewal date but not on it"
      readjustment_day_credit: "A readjustment-day credit is taken off the renewal price: same_day_readjustment_credit when the vehicle received a guarantee readjustment under the expired plan on the renewal date, recent_readjustment_credit when its latest guarantee readjustment under the expired plan came within recent_readjustment_days calendar days before the renewal date but not on it, and 0.00 otherwise."
      hz_plus: "plus_renewal_credit when the vehicle's tires carry an active Crestline Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread Protection certificate"
      hz_any: "renewal_protection_credit when they carry another active road hazard certificate"
      hazard_renewal_credit: "A road hazard renewal credit is taken off the renewal price: plus_renewal_credit when the vehicle's tires carry an active Crestline Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread Protection certificate, renewal_protection_credit when they carry another active road hazard certificate, and 0.00 when they carry none."
      t_install: "the tier's tire_bundle_discount when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the renewal date"
      t_days: "the tier's tire_bundle_discount when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the renewal date"
      renewal_tire_bundle: "A renewal tire bundle is taken off the renewal price: the tier's tire_bundle_discount when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the renewal date, extended_bundle_credit when it was installed more than tire_bundle_window_days but no more than extended_bundle_days calendar days before it, and 0.00 when it was installed earlier or the vehicle has no active Crestline tire set."
      reductions: "Every reduction, credit and charge this policy states is worked out on its own and applied to plan_price"
      result: "Every reduction, credit and charge this policy states is worked out on its own and applied to plan_price; the renewal price is what results, rounded to the nearest cent and never below 0.00."
    factors:
      - id: renewal_usage_rate
        effect: parameter
        decides: renewal_rate
        bindings: [inc_term, renewal_rate]
        ladder:
          - when: "the expired plan recorded at least top_included_count plan_included alignments over its term"
            value: "K('renewal_rate_top')"
          - when: "it recorded at least mid_included_count but fewer than top_included_count"
            value: "K('renewal_rate_base')"
          - when: "otherwise (fewer than mid_included_count)"
            value: "0"
        baseline:
          renewal_rate: "0"
        evidence: [history]
        cross_difficulty: null
      - id: grace_period_anchor
        effect: method
        decides: reinstatement
        bindings: [last_inc, last_early, inc_in_stretch, early_in_stretch, reinstatement]
        ladder:
          - when: "the expired plan's latest plan_included alignment fell within the final final_stretch_months months of its term"
            method: "grace runs from that alignment: no reinstatement charge when the renewal comes fewer than grace_window_months whole months after it, reinstatement_charge otherwise"
          - when: "no plan_included but a member_early_price alignment fell within that final stretch"
            method: "grace runs from the latest such alignment: no reinstatement charge when the renewal comes fewer than grace_window_months whole months after it, reinstatement_charge otherwise"
          - when: "otherwise"
            method: "grace runs from the expiration_date: no reinstatement charge when the renewal comes no more than grace_days_after_expiry calendar days after it, reinstatement_charge otherwise"
        baseline:
          reinstatement: "0 if DAYS(F('expiration_date'), NOW) <= K('grace_days_after_expiry') else K('reinstatement_charge')"
        evidence: [history, date]
        cross_difficulty: null
      - id: readjustment_day_credit
        effect: parameter
        decides: readjustment_day_credit
        bindings: [readj_today, readj_last, readj_last_days, readjustment_day_credit]
        ladder:
          - when: "a guarantee readjustment under the expired plan is dated the renewal date"
            value: "K('same_day_readjustment_credit')"
          - when: "the latest guarantee readjustment came within recent_readjustment_days days before the renewal date"
            value: "K('recent_readjustment_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          readjustment_day_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cardholder_renewal_rate
        effect: parameter
        decides: card_renewal_rate
        bindings: [card_open, card_late12, card_renewal_rate]
        ladder:
          - when: "an active Crestline card account AND no late fee posted to it in the last 12 months"
            value: "K('card_renewal_clean')"
          - when: "an active Crestline card account AND a late fee posted to it in the last 12 months"
            value: "K('card_renewal_late')"
          - when: "otherwise (no active Crestline card account)"
            value: "0"
        baseline:
          card_renewal_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: road_hazard_renewal_credit
        effect: parameter
        decides: hazard_renewal_credit
        bindings: [hz_plus, hz_any, hazard_renewal_credit]
        ladder:
          - when: "the vehicle's tires carry an active Plus 36-Month or Life-of-Tread certificate"
            value: "K('plus_renewal_credit')"
          - when: "they carry another active road hazard certificate"
            value: "K('renewal_protection_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          hazard_renewal_credit: "0"
        evidence: [cross_category]
        cross_difficulty: hazard
      - id: renewal_tire_bundle
        effect: parameter
        decides: renewal_tire_bundle
        bindings: [t_install, t_days, renewal_tire_bundle]
        ladder:
          - when: "the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days days before the renewal"
            value: "P('tire_bundle_discount')"
          - when: "it was installed more than tire_bundle_window_days but no more than extended_bundle_days days before"
            value: "K('extended_bundle_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          renewal_tire_bundle: "0"
        evidence: [cross_category, date]
        cross_difficulty: tires
    baseline:
      rule: >-
        The renewal price is the tier's plan_price, plus a reinstatement charge of reinstatement_charge when the renewal comes more than grace_days_after_expiry calendar days after the expiration_date, rounded to the nearest cent.
      params: [plan_price, reinstatement_charge, grace_days_after_expiry]
    inputs:
      history:
        - {table: alignment_events, aggregate: count, field: alignment_event_id, filters: {event_type: alignment_service_performed, service_basis: plan_included}}
        - {table: alignment_events, aggregate: count, field: alignment_event_id, filters: {event_type: alignment_readjustment, service_basis: guarantee_readjustment}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_late_fee}}
      cross_category: [card, hazard, tires]

  - id: alignment_ext_readjustment_parts
    base_policy_refs: [alignment_evt_readjustment]
    overwrite:
      - base_policy: alignment_evt_readjustment
        superseded_clause: >-
          The readjustment labor is free (charge_amount 0.00); parts needed are charged as parts_charge under the parts
          warranty only when the part itself failed within parts_warranty_months and parts_warranty_miles.
        replaced_by: >-
          For an open readjustment that the plan desk books under this policy, and only for such a readjustment, the
          readjustment labor is free (charge_amount 0.00) and the parts charge is the amount worked out below from the parts the store listed; every other readjustment has free labor (charge_amount 0.00) and charges the parts it needs as parts_charge, under the parts warranty only when the part itself failed within parts_warranty_months and parts_warranty_miles.
    trigger: state_due
    subject: [alignment_readjustment]
    computes: parts_charge
    target_tool: price_alignment_readjustment_e00d4c5e
    params:
      free_replacement_miles: 2000
      card_readjust_clean: 0.06
      card_readjust_late: 0.03
      check_line_readjust_credit: 5.00
      plain_line_readjust_credit: 2.50
      plus_cert_readjust_credit: 4.00
      cert_readjust_credit: 2.00
      early_slip_days: 60
      mid_slip_days: 120
      early_slip_cut: 0.20
      mid_slip_cut: 0.10
    rule: >-
      A store that readjusts an alignment measured out of specification posts the readjustment on the plan with the
      alignment it corrects, its date and odometer, the replacement parts it installed at their list price as the parts
      charge, and its service basis left open (none); that readjustment is the open readjustment, and the plan desk books
      it as a guarantee readjustment when the guarantee conditions of the base rule hold. For an open readjustment that
      the plan desk books under this policy, and only for such a readjustment, the readjustment labor is free
      (charge_amount 0.00) and the parts charge is the amount worked out below from the parts the store listed; every other readjustment has free labor (charge_amount 0.00) and charges the parts it needs as parts_charge, under the parts warranty only when the part itself failed within parts_warranty_months and parts_warranty_miles.
      The parts amount of a readjustment is the parts the store listed on it at their list price, and the parts charge is the parts amount, rounded to the nearest cent.
      The parts warranty sets the parts amount by the corrected alignment's work order: when
      that work order installed parts (a parts charge above 0.00) and fewer than parts_warranty_months whole calendar
      months and no more than free_replacement_miles miles separate it from the readjustment, the listed parts are
      replaced free; when that work order installed parts and fewer than parts_warranty_months whole calendar months and
      more than free_replacement_miles but no more than parts_warranty_miles miles separate them, the listed parts are
      prorated and the customer pays the listed price times the miles run since the corrected alignment divided by
      parts_warranty_miles; in every other case the listed parts are charged at the listed price.
      A guarantee slip reduction takes a percentage of the parts amount off the parts charge, by the calendar days from the corrected alignment to the readjustment: early_slip_cut when they are no more than early_slip_days days, mid_slip_cut when they are more than early_slip_days but no more than mid_slip_days days, and 0 when they are more.
      A cardholder readjustment parts reduction takes a percentage of the parts amount off the parts charge:
      card_readjust_clean when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the plan desk's booking of the readjustment, card_readjust_late when that active account has had a late fee
      posted in those 12 months, and 0 when the customer has no active Crestline credit card account.
      A new-tire readjustment credit is taken off the parts charge: check_line_readjust_credit when the vehicle's active Crestline tire
      set was installed no more than tire_bundle_window_days calendar days before the readjustment and its line includes
      a complimentary alignment check, plain_line_readjust_credit when that set was installed within those days and its
      line does not include one, and 0.00 otherwise.
      A road hazard readjustment credit is taken off the parts charge: plus_cert_readjust_credit when the vehicle's tires carry an
      active Crestline Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread Protection
      certificate, cert_readjust_credit when they carry another active road hazard certificate, and 0.00 when they carry
      none.
      Every reduction and credit this policy states is worked out on its own and taken off the parts amount; the parts charge is what remains, rounded to the nearest cent and never below 0.00.
    prerequisite: []
    cross_category:
      - category: card
        as: history
        reads: [card_account_id, status, card_transactions.event_type]
        note: The cardholder readjustment parts rate reads the active card account and its late fees in the last 12 months.
      - category: tires
        as: branch
        reads: [install_date, status, vehicle_id]
        note: The new-tire readjustment credit reads the vehicle's active Crestline tire set and its line.
      - category: hazard
        as: existence
        reads: [status, variant_name, vehicle_id]
        note: The road hazard readjustment credit reads which active certificate the vehicle's tires carry.
    compute:
      - rj_date: "LATEST('alignment_events','event_date', event_type='alignment_readjustment', service_basis='none')"
      - rj_odo: "LATEST('alignment_events','odometer', event_type='alignment_readjustment', service_basis='none')"
      - rj_src: "LATEST('alignment_events','source_alignment_event_id', event_type='alignment_readjustment', service_basis='none')"
      - rj_listed: "LATEST('alignment_events','parts_charge', event_type='alignment_readjustment', service_basis='none')"
      - src_parts: "MAX('alignment_events','parts_charge', alignment_event_id=rj_src)"
      - src_date: "LATEST('alignment_events','event_date', alignment_event_id=rj_src)"
      - src_odo: "LATEST('alignment_events','odometer', alignment_event_id=rj_src)"
      - miles_since: "rj_odo - src_odo"
      - months_since: "MONTHS(src_date, rj_date)"
      - warranted_parts: "0 if (src_parts > 0 and months_since < P('parts_warranty_months') and miles_since <= K('free_replacement_miles')) else (rj_listed * miles_since / P('parts_warranty_miles') if (src_parts > 0 and months_since < P('parts_warranty_months') and miles_since > K('free_replacement_miles') and miles_since <= P('parts_warranty_miles')) else rj_listed)"
      - slip_days: "DAYS(src_date, rj_date)"
      - slip_cut: "K('early_slip_cut') if slip_days <= K('early_slip_days') else (K('mid_slip_cut') if slip_days <= K('mid_slip_days') else 0)"
      - card_open: "CFIELD('card','card_account_id', status='active')"
      - card_late12: "XCOUNT('card','card_transactions', within_months=12, date_field='txn_date', event_type='card_late_fee', card_account_id=card_open)"
      - card_readjust_rate: "K('card_readjust_clean') if (card_open != None and card_late12 == 0) else (K('card_readjust_late') if (card_open != None and card_late12 > 0) else 0)"
      - t_install: "CFIELD('tires','install_date', vehicle_id=F('vehicle_id'), status='active')"
      - t_check: "CPARAM('tires','alignment_check_included', vehicle_id=F('vehicle_id'), status='active')"
      - t_days: "DAYS(t_install, rj_date) if t_install != None else 9999"
      - tire_readjust_credit: "K('check_line_readjust_credit') if (t_days >= 0 and t_days <= P('tire_bundle_window_days') and t_check == True) else (K('plain_line_readjust_credit') if (t_days >= 0 and t_days <= P('tire_bundle_window_days') and t_check == False) else 0)"
      - hz_plus: "EXISTS('hazard', status='active', vehicle_id=F('vehicle_id'), variant_name='Crestline Road Hazard Plus 36-Month Protection') or EXISTS('hazard', status='active', vehicle_id=F('vehicle_id'), variant_name='Crestline Road Hazard Life-of-Tread Protection')"
      - hz_any: "EXISTS('hazard', status='active', vehicle_id=F('vehicle_id'))"
      - hazard_readjust_credit: "K('plus_cert_readjust_credit') if hz_plus else (K('cert_readjust_credit') if hz_any else 0)"
      - reductions: "warranted_parts * (slip_cut + card_readjust_rate)"
      - result: "RND(MX(warranted_parts - reductions - tire_readjust_credit - hazard_readjust_credit, 0), 2)"
    compute_basis:
      rj_date: "that readjustment is the open readjustment, and the plan desk books it as a guarantee readjustment when the guarantee conditions of the base rule hold"
      rj_odo: "posts the readjustment on the plan with the alignment it corrects, its date and odometer, the replacement parts it installed at their list price as the parts charge, and its service basis left open (none)"
      rj_src: "posts the readjustment on the plan with the alignment it corrects, its date and odometer, the replacement parts it installed at their list price as the parts charge, and its service basis left open (none)"
      rj_listed: "The parts amount of a readjustment is the parts the store listed on it at their list price, and the parts charge is the parts amount, rounded to the nearest cent."
      src_parts: "when that work order installed parts (a parts charge above 0.00)"
      src_date: "fewer than parts_warranty_months whole calendar months and no more than free_replacement_miles miles separate it from the readjustment"
      src_odo: "fewer than parts_warranty_months whole calendar months and no more than free_replacement_miles miles separate it from the readjustment"
      miles_since: "the customer pays the listed price times the miles run since the corrected alignment divided by parts_warranty_miles"
      months_since: "fewer than parts_warranty_months whole calendar months and no more than free_replacement_miles miles separate it from the readjustment"
      warranted_parts: "The parts warranty sets the parts amount by the corrected alignment's work order: when that work order installed parts (a parts charge above 0.00) and fewer than parts_warranty_months whole calendar months and no more than free_replacement_miles miles separate it from the readjustment, the listed parts are replaced free; when that work order installed parts and fewer than parts_warranty_months whole calendar months and more than free_replacement_miles but no more than parts_warranty_miles miles separate them, the listed parts are prorated and the customer pays the listed price times the miles run since the corrected alignment divided by parts_warranty_miles; in every other case the listed parts are charged at the listed price."
      slip_days: "by the calendar days from the corrected alignment to the readjustment"
      slip_cut: "A guarantee slip reduction takes a percentage of the parts amount off the parts charge, by the calendar days from the corrected alignment to the readjustment: early_slip_cut when they are no more than early_slip_days days, mid_slip_cut when they are more than early_slip_days but no more than mid_slip_days days, and 0 when they are more."
      card_open: "card_readjust_clean when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the plan desk's booking of the readjustment"
      card_late12: "card_readjust_late when that active account has had a late fee posted in those 12 months"
      card_readjust_rate: "A cardholder readjustment parts reduction takes a percentage of the parts amount off the parts charge: card_readjust_clean when the customer has an active Crestline credit card account with no late fee posted to it in the 12 calendar months up to the plan desk's booking of the readjustment, card_readjust_late when that active account has had a late fee posted in those 12 months, and 0 when the customer has no active Crestline credit card account."
      t_install: "check_line_readjust_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the readjustment and its line includes a complimentary alignment check"
      t_check: "check_line_readjust_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the readjustment and its line includes a complimentary alignment check"
      t_days: "check_line_readjust_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the readjustment and its line includes a complimentary alignment check"
      tire_readjust_credit: "A new-tire readjustment credit is taken off the parts charge: check_line_readjust_credit when the vehicle's active Crestline tire set was installed no more than tire_bundle_window_days calendar days before the readjustment and its line includes a complimentary alignment check, plain_line_readjust_credit when that set was installed within those days and its line does not include one, and 0.00 otherwise."
      hz_plus: "plus_cert_readjust_credit when the vehicle's tires carry an active Crestline Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread Protection certificate"
      hz_any: "cert_readjust_credit when they carry another active road hazard certificate"
      hazard_readjust_credit: "A road hazard readjustment credit is taken off the parts charge: plus_cert_readjust_credit when the vehicle's tires carry an active Crestline Road Hazard Plus 36-Month Protection or Crestline Road Hazard Life-of-Tread Protection certificate, cert_readjust_credit when they carry another active road hazard certificate, and 0.00 when they carry none."
      reductions: "Every reduction and credit this policy states is worked out on its own and taken off the parts amount"
      result: "Every reduction and credit this policy states is worked out on its own and taken off the parts amount; the parts charge is what remains, rounded to the nearest cent and never below 0.00."
    factors:
      - id: parts_warranty_path
        effect: method
        decides: warranted_parts
        bindings: [src_parts, src_odo, miles_since, months_since, warranted_parts]
        ladder:
          - when: "the corrected alignment's work order installed parts AND fewer than parts_warranty_months months AND no more than free_replacement_miles miles separate it from the readjustment"
            method: "the listed parts are replaced free"
          - when: "that work order installed parts AND fewer than parts_warranty_months months AND more than free_replacement_miles but no more than parts_warranty_miles miles separate them"
            method: "prorated: listed price x miles since the corrected alignment / parts_warranty_miles"
          - when: "otherwise"
            method: "the listed parts are charged at the listed price"
        baseline:
          warranted_parts: "rj_listed"
        evidence: [history, date]
        cross_difficulty: null
      - id: guarantee_slip_reduction
        effect: parameter
        decides: slip_cut
        bindings: [slip_days, slip_cut]
        ladder:
          - when: "the readjustment is no more than early_slip_days days after the corrected alignment"
            value: "K('early_slip_cut')"
          - when: "more than early_slip_days but no more than mid_slip_days days after it"
            value: "K('mid_slip_cut')"
          - when: "otherwise"
            value: "0"
        baseline:
          slip_cut: "0"
        evidence: [date]
        cross_difficulty: null
      - id: cardholder_readjust_rate
        effect: parameter
        decides: card_readjust_rate
        bindings: [card_open, card_late12, card_readjust_rate]
        ladder:
          - when: "an active Crestline card account AND no late fee posted to it in the last 12 months"
            value: "K('card_readjust_clean')"
          - when: "an active Crestline card account AND a late fee posted to it in the last 12 months"
            value: "K('card_readjust_late')"
          - when: "otherwise (no active Crestline card account)"
            value: "0"
        baseline:
          card_readjust_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: new_tire_readjust_credit
        effect: parameter
        decides: tire_readjust_credit
        bindings: [t_install, t_check, t_days, tire_readjust_credit]
        ladder:
          - when: "the vehicle's active Crestline tire set was installed within tire_bundle_window_days before the readjustment AND its line includes a complimentary alignment check"
            value: "K('check_line_readjust_credit')"
          - when: "installed within those days AND its line does not include one"
            value: "K('plain_line_readjust_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          tire_readjust_credit: "0"
        evidence: [cross_category, date]
        cross_difficulty: tires
      - id: road_hazard_readjust_credit
        effect: parameter
        decides: hazard_readjust_credit
        bindings: [hz_plus, hz_any, hazard_readjust_credit]
        ladder:
          - when: "the vehicle's tires carry an active Plus 36-Month or Life-of-Tread certificate"
            value: "K('plus_cert_readjust_credit')"
          - when: "they carry another active road hazard certificate"
            value: "K('cert_readjust_credit')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          hazard_readjust_credit: "0"
        evidence: [cross_category]
        cross_difficulty: hazard
    baseline:
      rule: >-
        The parts amount of a readjustment is the parts the store listed on it at their list price, and the parts charge is the parts amount, rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: alignment_events, aggregate: latest, field: parts_charge, filters: {event_type: alignment_readjustment, service_basis: none}}
        - {table: alignment_events, aggregate: max, field: parts_charge, filters: {event_type: alignment_service_performed}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_late_fee}}
      cross_category: [card, tires, hazard]
