# Policy charter: Alignment Services & Plans (category key: alignment)
# One holding = one alignment service or prepaid alignment plan bought for one vehicle. The first
# alignment is performed on the purchase visit; later visits are booked as appointments and
# performed under the plan's interval rules, the readjustment guarantee, or at the member price.

category: alignment
display_name: Alignment Services & Plans

binding:
  holding_table: alignment_plans
  event_tables: [alignment_events]
  intake_tables: [alignment_cancellation_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [active, expired, cancelled, vehicle_retired]
  transitions:
    - {from: active, to: expired, by: system, means: "The plan term (or a single service's readjustment guarantee) ends on its expiration date."}
    - {from: active, to: cancelled, by: user, means: "The holder confirms cancellation of a plan inside the cancellation window and the refund is paid."}
    - {from: active, to: vehicle_retired, by: agent, means: "The plan ends because the holder no longer owns the vehicle it is valid on."}

# Alignment plans are prepaid service contracts with no running balance or allowance that rises and
# falls: a plan entitles the vehicle to alignments by interval, not from a counted stock.
accounts: []

# ---- category-level parameter dictionary ----
parameter_schema:
  plan_price: Price of the service or plan before any tire bundle discount and tax, USD
  term_basis: 'What the term is measured in, enum: calendar_months or vehicle_ownership (lifetime: as long as the
    purchaser owns the vehicle)'
  plan_term_months: Term in calendar months from purchase_date for month-based plans (for single services, the readjustment
    guarantee period); not_applicable for lifetime plans
  service_entitlement: 'What the holding entitles the vehicle to, enum: single_service (one alignment plus guarantee
    readjustments) or unlimited_within_interval'
  min_interval_months: Calendar months after the last plan alignment after which the next included alignment is
    available (0 = not applicable)
  min_interval_miles: Miles after the last plan alignment's odometer after which the next included alignment is
    available (0 = not applicable)
  interval_basis: How the month and mile intervals combine, enum text
  member_early_alignment_price: Labor price for an alignment a plan holder wants before the interval is reached,
    USD
  readjustment_guarantee_months: Calendar months after any alignment within which it is readjusted free if measured
    out of specification
  readjustment_guarantee_miles: Miles after any alignment's odometer within which it is readjusted free if measured
    out of specification
  readjustment_condition: What must be shown for a guarantee readjustment, enum text
  readjustment_exclusions: Causes that void the readjustment guarantee, list
  alignment_types_covered: Alignment types the holding includes, list of alignment_type values
  first_alignment_at_purchase: Whether the first alignment is performed on the purchase visit, boolean
  commercial_use_eligible: Whether the holding may be sold for or used on a vehicle in commercial use, boolean
  spec_source: Specification the alignment is set to, enum text
  parts_included: Whether adjustment parts are included in the price, boolean
  parts_charged_list: Adjustment parts charged separately when the vehicle needs them, list
  parts_warranty_months: Warranty on adjustment parts installed, calendar months
  parts_warranty_miles: Warranty on adjustment parts installed, miles
  pre_alignment_inspection: Whether steering and suspension are inspected before every alignment, boolean
  worn_parts_block_alignment: Whether worn steering or suspension parts must be repaired before an alignment is
    performed, boolean
  blocked_visit_counts_as_used: Whether a visit where worn parts blocked the alignment uses the interval, boolean
  steering_angle_reset_charge: Charge for a steering angle sensor reset after the alignment, USD (0.00 = included)
  adas_recalibration_charge: Charge for a forward camera or radar recalibration when the vehicle requires one after
    an alignment, USD
  cancellation_window_days: Calendar days after purchase_date within which a plan may be cancelled for a refund
    (0 = not cancellable)
  used_alignment_deduction: Amount deducted from a cancellation refund for each included alignment already performed
    (including the purchase-day alignment), USD
  cancellation_after_window: Refund after the cancellation window, enum text
  refund_tender: Where a cancellation refund goes, enum text
  transferable: Whether the holding can be moved to another vehicle or owner, boolean
  ends_on_vehicle_sale: Whether the holding ends when the purchaser no longer owns the vehicle, boolean
  tire_bundle_discount: Discount on the plan price when it is bought within tire_bundle_window_days of a Crestline
    tire set installed on the same vehicle, USD
  tire_bundle_window_days: Calendar days after the tire set's install_date during which the tire bundle discount
    applies
  store_scope: Where included alignments may be performed, enum text
  booking_slot_minutes: Bay time reserved for an alignment appointment, minutes
  booking_horizon_days: How far ahead an alignment can be booked, calendar days after the booking date
  booking_min_lead_hours: Minimum hours between booking and the appointment start
  reschedules_max: Times one appointment may be moved before it must be booked as new, integer
  late_release_minutes: Minutes after the slot start after which an absent customer's slot is released
  no_show_fee: Fee for a missed appointment, USD
  alignment_report_provided: Whether a before-and-after measurement printout is given with every alignment, boolean
  odometer_required: Whether the work order odometer must be recorded for every alignment, boolean
  plan_proof: How a plan holder proves the plan at the counter, enum text
  fleet_discount_applicable: Whether a fleet account's alignment discount applies when the holding is charged to
    a fleet account, boolean
  alignments_per_visit_max: Alignments performed on one vehicle per visit, integer
  holdings_per_vehicle_max: Active alignment plans one vehicle may carry at the same time, integer
  lifetime_ownership_proof: What shows the purchaser still owns the vehicle for a lifetime plan, enum text
  early_price_counts_as_interval: Whether an alignment at the member early price restarts the interval, boolean

