    r_ref: 'The window reallocation applies the rule that, during a deferred-interest plan''s last promo_allocation_window_cycles billing cycles, the amount paid above the minimum goes to that plan first: an allocation recorded for a payment made toward the statement of the plan''s last recorded accrual that went instead to another deferred-interest plan whose period ends after this plan''s period is misdirected, and the allocation of the most recent returned payment is left out of the misdirected total; when misdirected allocations exist and no other deferred-interest plan''s period ended after that statement closed and before this plan''s period ended, their total is reallocated to this plan and taken off its balance left, never more than its recorded balance; when such other plans'' periods did end in between, only the part of that total beyond those plans'' recorded balances is reallocated, again never more than this plan''s recorded balance; otherwise nothing is reallocated. Because the misdirected amount should have reduced this plan from the day it was allocated, interest on the reallocated amount at the daily rate is taken off for each day from the date of the latest allocation recorded toward that statement to such a later-ending plan through the last day of the period, and nothing is taken off when that date falls after the last day of the period.'
