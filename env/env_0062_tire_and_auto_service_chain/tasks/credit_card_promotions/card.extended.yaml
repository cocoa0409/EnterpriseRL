      filters:
        event_type: card_returned_payment_fee
    - table: card_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: card_purchase
    cross_category:
    - hazard
    - battery
- id: card_ext_deferred_interest_assessment
  base_policy_refs:
  - card_evt_deferred_interest
  overwrite:
  - base_policy: card_evt_deferred_interest
    superseded_clause: When card_msr_promo_remaining is above 0.00 at the end of promo_expiration_date, all interest accrued since the purchase date, card_msr_accrued_deferred_interest, is assessed in one row at the next statement closing and the unpaid balance becomes a standard balance.
    replaced_by: For a plan whose period ended with a balance left, and only for such a plan, the interest assessed in one row on the closing date of the next statement is the figure worked out here, and the unpaid balance then becomes a standard balance; a plan whose balance left, as figured here, is not above zero is assessed nothing and its accruals lapse.
  trigger: state_due
  subject:
  - card_deferred_interest_assessed
  computes: amount
  target_tool: assess_deferred_interest_7b31b265
  params: {}
  rule: 'On the closing date of the statement that follows the end of a deferred-interest plan''s promotional period, Northgate assesses in one row the interest the plan accrued since the purchase date when a balance was left on it at the end of the period, and the assessment may be posted at any time on that closing date. This schedule figures that assessment for an account carrying at most one purchase on each deferred-interest plan, and the plan assessed is the one whose period has ended and that carries no assessment yet. For a plan whose period ended with a balance left, and only for such a plan, the interest assessed in one row on the closing date of the next statement is the figure worked out here, and the unpaid balance then becomes a standard balance; a plan whose balance left, as figured here, is not above zero is assessed nothing and its accruals lapse. The deferred interest assessed is the sum of the accruals recorded for the plan on its statements, rounded half up to the cent; the plan''s balance left is its recorded balance, and nothing is assessed when it is not above zero. The plan''s recorded balance is its purchase amount less the payment allocations recorded for it and less the merchandise credits that carry its ticket number; the daily rate is the account''s purchase rate divided by daily_periodic_rate_basis_days, and the stub days are the days from the day after the closing date of the plan''s last recorded accrual through the last day of its period. The stub accrual covers the days no statement has recorded yet: when the period ended after the closing date of the plan''s last recorded accrual, interest on the recorded balance at the daily rate for each stub day is added; when the period ended on that closing date, nothing is added; when no accrual has been recorded for the plan, interest on the recorded balance for each day from the purchase date through the last day of the period is added. A refund Crestline paid back to the card for a road hazard certificate sold on the plan''s ticket reaches the card without the ticket number, so it is matched to the plan through the certificate record and taken off the plan''s balance left; because an accrual already recorded is never reversed for a credit, its interest effect depends on when it was paid: when it was paid on or before the closing date of the plan''s last recorded accrual, interest on it at the daily rate for each stub day is taken off; when it was paid after that closing date, interest on it for each day from its payment date through the last day of the period, both days counted, is taken off; otherwise nothing is taken off. An allocation to the plan from a payment later returned unpaid never reduced the plan, so it is added back to the plan''s balance left; this is figured for an account on which no payment returned unpaid before the most recent returned payment carried an allocation to the plan, and only the most recent returned payment is looked at: when its allocation to the plan was recorded on or before the closing date of the plan''s last recorded accrual, interest on it at the daily rate for each day from its allocation date through the last day of the period, both days counted, is added; when it was recorded after that closing date, interest on it for each stub day is added; otherwise nothing is added. The window reallocation applies the rule that, during a deferred-interest plan''s last promo_allocation_window_cycles billing cycles, the amount paid above the minimum goes to that plan first: an allocation recorded for a payment made toward the statement of the plan''s last recorded accrual that went instead to another deferred-interest plan whose period ends after this plan''s period is misdirected, and the allocation of the most recent returned payment is left out of the misdirected total; when misdirected allocations exist and no other deferred-interest plan''s period ended after that statement closed and before this plan''s period ended, their total is reallocated to this plan and taken off its balance left, never more than its recorded balance; when such other plans'' periods did end in between, only the part of that total beyond those plans'' recorded balances is reallocated, again never more than this plan''s recorded balance; otherwise nothing is reallocated. Because the misdirected amount should have reduced this plan from the day it was allocated, interest on the reallocated amount at the daily rate is taken off for each day from the date of the latest allocation recorded toward that statement to such a later-ending plan through the last day of the period, and nothing is taken off when that date falls after the last day of the period. The assessment is the recorded accruals with every amount of interest a rule of this schedule adds or takes off, rounded half up to the cent once, on the final figure; it is zero when the plan''s balance left, the recorded balance with every amount a rule of this schedule adds to it or takes off it, is not above zero.'
