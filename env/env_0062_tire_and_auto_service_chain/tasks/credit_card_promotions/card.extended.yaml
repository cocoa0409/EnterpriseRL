    - when: an open dispute on a purchase posted on or before the closing date, or on another fee in the balance with no reversal standing against it
      value: min_payment_pct_of_balance percent of the charge, rounded up to the cent
    - when: an open dispute on the late fee posted in the statement's cycle with no reversal standing against it
