  - p12_exp: LATEST('card_transactions','promo_expiration_date', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12')
  - p12_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12')
  - p18_exp: LATEST('card_transactions','promo_expiration_date', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18')
  - p18_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18')
  - p6_di: SUM('card_transactions','amount', event_type='card_deferred_interest_assessed', source_card_txn_id=p6_id)
  - p12_di: SUM('card_transactions','amount', event_type='card_deferred_interest_assessed', source_card_txn_id=p12_id)
  - p18_di: SUM('card_transactions','amount', event_type='card_deferred_interest_assessed', source_card_txn_id=p18_id)
  - ended: '''deferred_6'' if (p6_exp != None and DAYS(p6_exp, NOW) > 0 and p6_di == 0) else (''deferred_12'' if (p12_exp != None and DAYS(p12_exp, NOW) > 0 and p12_di == 0) else (''deferred_18'' if (p18_exp != None and DAYS(p18_exp, NOW) > 0 and p18_di == 0) else ''none''))'
  - p_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan=ended) if ended != 'none' else None
  - p_amt: LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan=ended) if ended != 'none' else 0
  - p_start: LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_purchase', promo_plan=ended) if ended != 'none' else None
  - p_end: LATEST('card_transactions','promo_expiration_date', date_field='txn_date', event_type='card_purchase', promo_plan=ended) if ended != 'none' else None
  - p_ticket: LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan=ended) if ended != 'none' else None
  - ledger_left: p_amt - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=p_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=p_ticket)
  - acc_sum: SUM('card_transactions','amount', event_type='card_deferred_interest_accrual', source_card_txn_id=p_id)
  - last_close: LATEST('card_transactions','statement_date', date_field='txn_date', event_type='card_deferred_interest_accrual', source_card_txn_id=p_id)
  - daily_rate: F('purchase_apr_pct') / 100 / P('daily_periodic_rate_basis_days')
  - stub_days: DAYS(last_close, p_end) if (last_close != None and p_end != None) else 0
  - acc_rows: COUNT('card_transactions', event_type='card_deferred_interest_accrual', source_card_txn_id=p_id)
  - stub_int: 0 if p_end == None else (ledger_left * daily_rate * stub_days if (acc_rows >= 1 and stub_days > 0) else (0 if acc_rows >= 1 else ledger_left * daily_rate * (DAYS(p_start, p_end) + 1)))
  - cert_id: CFIELD('hazard','hazard_certificate_id', purchase_ticket_number=p_ticket, payment_method='crestline_card')
  - hz_ref: XSUM('hazard','hazard_events','amount', event_type='hazard_cancellation_refund', payment_method='crestline_card', hazard_certificate_id=cert_id)
  - hz_date: XLATEST('hazard','hazard_events','event_date', event_type='hazard_cancellation_refund', payment_method='crestline_card', hazard_certificate_id=cert_id)
  - refund_int: (hz_ref * daily_rate * stub_days) if (hz_ref > 0 and last_close != None and DAYS(hz_date, last_close) >= 0) else ((hz_ref * daily_rate * (DAYS(hz_date, p_end) + 1)) if (hz_ref > 0 and p_end != None and DAYS(hz_date, p_end) >= 0) else 0)
  - refund_bal: hz_ref
  - v_ref: LATEST('card_transactions','payment_reference', date_field='txn_date', event_type='card_returned_payment')
  - v_alloc: SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=p_id, payment_reference=v_ref)
  - v_date: LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_payment_allocation', source_card_txn_id=p_id, payment_reference=v_ref)
  - void_int: (v_alloc * daily_rate * (DAYS(v_date, p_end) + 1)) if (v_alloc > 0 and p_end != None and last_close != None and DAYS(v_date, last_close) >= 0) else ((v_alloc * daily_rate * stub_days) if v_alloc > 0 else 0)
  - void_bal: v_alloc
  - r_ref: LATEST('card_transactions','payment_reference', date_field='txn_date', event_type='card_returned_payment')
  - m6: (SUM('card_transactions','amount', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p6_id) - SUM('card_transactions','amount', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p6_id, payment_reference=r_ref)) if (ended != 'deferred_6' and p6_id != None and p_end != None and last_close != None and DAYS(p_end, p6_exp) > 0) else 0
  - d6: LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p6_id) if (ended != 'deferred_6' and p6_id != None and p_end != None and last_close != None and DAYS(p_end, p6_exp) > 0) else None
  - m12: (SUM('card_transactions','amount', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p12_id) - SUM('card_transactions','amount', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p12_id, payment_reference=r_ref)) if (ended != 'deferred_12' and p12_id != None and p_end != None and last_close != None and DAYS(p_end, p12_exp) > 0) else 0
  - d12: LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p12_id) if (ended != 'deferred_12' and p12_id != None and p_end != None and last_close != None and DAYS(p_end, p12_exp) > 0) else None
  - m18: (SUM('card_transactions','amount', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p18_id) - SUM('card_transactions','amount', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p18_id, payment_reference=r_ref)) if (ended != 'deferred_18' and p18_id != None and p_end != None and last_close != None and DAYS(p_end, p18_exp) > 0) else 0
  - d18: LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_payment_allocation', statement_date=last_close, source_card_txn_id=p18_id) if (ended != 'deferred_18' and p18_id != None and p_end != None and last_close != None and DAYS(p_end, p18_exp) > 0) else None
  - m_tot: m6 + m12 + m18
  - m_date: d18 if (d18 != None and (d12 == None or DAYS(d12, d18) >= 0) and (d6 == None or DAYS(d6, d18) >= 0)) else (d12 if (d12 != None and (d6 == None or DAYS(d6, d12) >= 0)) else d6)
  - o6_rem: ((LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_6') - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=p6_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_6'))) if p6_id != None else 0) if (ended != 'deferred_6' and p6_exp != None and p_end != None and last_close != None and DAYS(p6_exp, p_end) > 0 and DAYS(last_close, p6_exp) > 0) else 0
  - o12_rem: ((LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12') - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=p12_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12'))) if p12_id != None else 0) if (ended != 'deferred_12' and p12_exp != None and p_end != None and last_close != None and DAYS(p12_exp, p_end) > 0 and DAYS(last_close, p12_exp) > 0) else 0
  - o18_rem: ((LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18') - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=p18_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18'))) if p18_id != None else 0) if (ended != 'deferred_18' and p18_exp != None and p_end != None and last_close != None and DAYS(p18_exp, p_end) > 0 and DAYS(last_close, p18_exp) > 0) else 0
