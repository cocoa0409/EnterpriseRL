    - o6_rem
    - o12_rem
    - o18_rem
    - realloc_amt
    - realloc_int
    ladder:
    - when: allocations toward the statement of the last accrual misdirected to a later-ending deferred plan and no other deferred plan ended in between
      value: their total, never more than the recorded balance
    - when: such misdirected allocations and another deferred plan whose period ended in between
      value: the part beyond those plans' recorded balances, never more than the recorded balance
