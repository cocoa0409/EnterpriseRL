    rev_off: 'A fee reversal posted since the statement closed is reflected according to the fee it reverses: when it reverses the late fee posted in the statement''s cycle, the reversed amount is taken off and so is min_payment_pct_of_balance percent of it, rounded up to the cent; when it reverses another fee posted on or before the statement''s closing date, the reversed amount is taken off the past-due amount, never more than that amount; otherwise nothing is taken off for reversals. This is figured for an account on which at most one fee reversal has posted since the statement closed.'
    longer_plans: On every statement the printed minimum payment is the larger of min_payment_floor and min_payment_pct_of_balance percent of the new balance excluding equal-payment plan balances, rounded up to the whole dollar (min_payment_rounding), plus every amount listed in min_payment_includes (the fixed monthly payment of each equal-payment plan, any past-due amount and a late fee posted in the cycle); when the new balance is below min_payment_floor the printed minimum is the whole new balance; while a billing-error dispute is open the disputed amount is left out of the printed minimum when disputed_amount_excluded_from_min is true. The minimum payment the desk takes on the latest statement, and only that payment, is figured on the day it is taken as set out here, except that on an account carrying a 36-month or 48-month equal-payment plan, or more than one 24-month plan, the desk takes the minimum printed on the statement less the payments made toward that statement since it closed.
    result: Every amount a rule of this schedule adds to or takes off the minimum enters it that way, and a core a rule sets replaces the payment floor; where a rule makes the core the whole minimum, nothing else is added to it or taken off it but the payments made toward the statement since it closed; the minimum is never less than zero and is rounded half up to the cent once, on the final figure.
  factors:
  - id: minimum_basis
    effect: method
    decides: core
    bindings:
    - st_nb
    - pct_raw
    - pct_up
    - core
    ladder:
    - when: the new balance is below the payment floor
      method: the core is the whole new balance and it is the whole minimum, with nothing added or taken off but the payments made toward the statement since it closed
    - when: the rounded percentage of the new balance less the equal-payment balance is above the floor
      method: the core is that rounded percentage
    - when: otherwise
      method: the core is the payment floor
    baseline:
      core: P('min_payment_floor')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: installment_component
    effect: parameter
    decides: installment
    bindings:
