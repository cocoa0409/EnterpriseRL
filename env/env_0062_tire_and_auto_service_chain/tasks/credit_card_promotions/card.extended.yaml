    w18_rem: 'The order the amount available goes in follows the rule for a deferred-interest plan''s last promo_allocation_window_cycles billing cycles, read here as a period ending no more than window_days days after today: when another deferred-interest plan with a recorded balance is in that window, its recorded balance is served first and only the rest reaches the named plan; when the named plan itself is in that window, the minimum still unpaid also goes to it, so the amount available plus that minimum reaches it; otherwise the whole amount available reaches the named plan.'
    to_target: 'The order the amount available goes in follows the rule for a deferred-interest plan''s last promo_allocation_window_cycles billing cycles, read here as a period ending no more than window_days days after today: when another deferred-interest plan with a recorded balance is in that window, its recorded balance is served first and only the rest reaches the named plan; when the named plan itself is in that window, the minimum still unpaid also goes to it, so the amount available plus that minimum reaches it; otherwise the whole amount available reaches the named plan.'
    rp_6m: 'A returned-payment hold keeps back a share of the amount reaching the plan for a few days: when two or more payments were returned unpaid fewer than 6 whole months before today, hold_high is added to the held share; when exactly one was, hold_low is added; otherwise nothing is added.'
    hold: 'A returned-payment hold keeps back a share of the amount reaching the plan for a few days: when two or more payments were returned unpaid fewer than 6 whole months before today, hold_high is added to the held share; when exactly one was, hold_low is added; otherwise nothing is added.'
    today_channel: 'A channel hold also applies to today''s payment: when it came in online, channel_online is added to the held share; when it came in by phone, channel_phone is added; otherwise nothing is added.'
    channel_hold: 'A channel hold also applies to today''s payment: when it came in online, channel_online is added to the held share; when it came in by phone, channel_phone is added; otherwise nothing is added.'
    months_open: 'The tenure release eases the hold for a long account without repeated returns: when the account was opened 36 whole months or more before today and at most two payments were returned fewer than 24 whole months before today, release_tenure_long of the held share is taken off it; when it was opened 12 whole months or more before today and at most one payment was returned fewer than 12 whole months before today, release_tenure_short of the held share is taken off it; otherwise nothing is taken off.'
    rp_24m: 'The tenure release eases the hold for a long account without repeated returns: when the account was opened 36 whole months or more before today and at most two payments were returned fewer than 24 whole months before today, release_tenure_long of the held share is taken off it; when it was opened 12 whole months or more before today and at most one payment was returned fewer than 12 whole months before today, release_tenure_short of the held share is taken off it; otherwise nothing is taken off.'
    rp_12m: 'The tenure release eases the hold for a long account without repeated returns: when the account was opened 36 whole months or more before today and at most two payments were returned fewer than 24 whole months before today, release_tenure_long of the held share is taken off it; when it was opened 12 whole months or more before today and at most one payment was returned fewer than 12 whole months before today, release_tenure_short of the held share is taken off it; otherwise nothing is taken off.'
    tenure_release: 'The tenure release eases the hold for a long account without repeated returns: when the account was opened 36 whole months or more before today and at most two payments were returned fewer than 24 whole months before today, release_tenure_long of the held share is taken off it; when it was opened 12 whole months or more before today and at most one payment was returned fewer than 12 whole months before today, release_tenure_short of the held share is taken off it; otherwise nothing is taken off.'
    tires_tender: 'The relationship release eases the hold for a cardholder with Crestline service bought on the card: for a cardholder who holds an active Crestline tire set paid with the Crestline card and an active Crestline alignment plan paid with the Crestline card, release_relationship_both of the held share is taken off it; for one who holds exactly one of the two, active and paid with the card, release_relationship_one of it is taken off; otherwise nothing is taken off.'
    alignment_tender: 'The relationship release eases the hold for a cardholder with Crestline service bought on the card: for a cardholder who holds an active Crestline tire set paid with the Crestline card and an active Crestline alignment plan paid with the Crestline card, release_relationship_both of the held share is taken off it; for one who holds exactly one of the two, active and paid with the card, release_relationship_one of it is taken off; otherwise nothing is taken off.'
    relationship_release: 'The relationship release eases the hold for a cardholder with Crestline service bought on the card: for a cardholder who holds an active Crestline tire set paid with the Crestline card and an active Crestline alignment plan paid with the Crestline card, release_relationship_both of the held share is taken off it; for one who holds exactly one of the two, active and paid with the card, release_relationship_one of it is taken off; otherwise nothing is taken off.'
    net_hold: Every share a rule of this schedule adds to the held share is added in full, the held share never above one; every fraction a rule takes off it is a fraction of that held share, and together they never take off more than the whole of it, so the held share is multiplied by one less their total, that total never above one; the part directed is what reaches the named plan less the held share of it, never more than the named plan's recorded balance, rounded half up to the cent once, on the final figure.
    result: Every share a rule of this schedule adds to the held share is added in full, the held share never above one; every fraction a rule takes off it is a fraction of that held share, and together they never take off more than the whole of it, so the held share is multiplied by one less their total, that total never above one; the part directed is what reaches the named plan less the held share of it, never more than the named plan's recorded balance, rounded half up to the cent once, on the final figure.
  factors:
  - id: window_route
    effect: method
    decides: to_target
    bindings:
    - q6_id
    - q12_id
    - q18_id
    - t_exp
    - w12_rem
    - w6_rem
    - w18_rem
    - to_target
    ladder:
    - when: another deferred-interest plan with a recorded balance ends within window_days days
      method: that plan's recorded balance is served first and only the rest reaches the named plan
    - when: the named plan itself ends within window_days days
      method: the amount available plus the minimum still unpaid reaches the named plan
    - when: otherwise
      method: the whole amount available reaches the named plan
    baseline:
      to_target: available
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: returned_hold
    effect: parameter
    decides: hold
    bindings:
    - rp_6m
    - hold
    ladder:
    - when: two or more payments returned unpaid in the last 6 months
      value: K('hold_high')
    - when: exactly one in the last 6 months
      value: K('hold_low')
    - when: otherwise
      value: '0'
    baseline:
      hold: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: channel_hold
    effect: parameter
    decides: channel_hold
    bindings:
    - today_channel
    - channel_hold
    ladder:
    - when: today's payment came in online
      value: K('channel_online')
    - when: today's payment came in by phone
      value: K('channel_phone')
    - when: otherwise
      value: '0'
    baseline:
      channel_hold: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_release
    effect: parameter
    decides: tenure_release
    bindings:
    - months_open
    - rp_24m
    - rp_12m
    - tenure_release
    ladder:
    - when: opened 36 whole months or more before today and at most two returned payments in 24 months
      value: K('release_tenure_long')
    - when: opened 12 whole months or more before today and at most one returned payment in 12 months
      value: K('release_tenure_short')
    - when: otherwise
      value: '0'
    baseline:
      tenure_release: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: relationship_release
    effect: parameter
    decides: relationship_release
    bindings:
    - tires_tender
    - alignment_tender
    - relationship_release
    ladder:
    - when: an active tire set and an active alignment plan, both paid with the Crestline card
      value: K('release_relationship_both')
    - when: exactly one of the two, active and paid with the Crestline card
      value: K('release_relationship_one')
    - when: otherwise
      value: '0'
    baseline:
      relationship_release: '0'
    evidence:
    - cross_category
    cross_difficulty: tires
  baseline:
    rule: The part directed is the amount available to direct, all of which reaches the named plan with no share of it held back, never more than the named plan's recorded balance, rounded half up to the cent.
    params: []
  inputs:
    history:
    - table: card_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: card_payment
    - table: card_transactions
      aggregate: count
      field: card_txn_id
      within_months: 6
      filters:
        event_type: card_returned_payment
    - table: card_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: card_deferred_interest_assessed
    - table: card_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: card_payment_allocation
    cross_category:
    - tires
    - alignment
