    available: 'A plan''s recorded balance is its purchase amount less the payment allocations recorded for it and less the merchandise credits that carry its ticket number. Today''s payments first cover the latest statement''s minimum still unpaid by the payments made toward it before today (less any returned unpaid), then the fees charged for that statement and still owed, which are a late fee charged for its missed minimum and the returned payment fee charged for a payment made toward it and returned unpaid (figured for an account on which at most one payment made toward the latest statement was returned unpaid), each less any fee reversal standing against it, and then the deferred interest of a plan whose period ended since that statement closed: the assessment when one stands, or, while none stands and the plan ended with a recorded balance, the accruals recorded for it; what is left is the amount available to direct.'
    t_plan: A cardholder who has made a payment today may direct it, before the day's allocation runs, to the deferred-interest plan whose period ends last on the account, the longer plan where two end on the same day; this rule figures the part of today's payments the direction sends to that plan, for an account carrying at most one purchase on each deferred-interest plan.
    t_id: A cardholder who has made a payment today may direct it, before the day's allocation runs, to the deferred-interest plan whose period ends last on the account, the longer plan where two end on the same day; this rule figures the part of today's payments the direction sends to that plan, for an account carrying at most one purchase on each deferred-interest plan.
    t_exp: 'The order the amount available goes in follows the rule for a deferred-interest plan''s last promo_allocation_window_cycles billing cycles, read here as a period ending no more than window_days days after today: when another deferred-interest plan with a recorded balance is in that window, its recorded balance is served first and only the rest reaches the named plan; when the named plan itself is in that window, the minimum still unpaid also goes to it, so the amount available plus that minimum reaches it; otherwise the whole amount available reaches the named plan.'
    t_ticket: The part directed is the amount available to direct, all of which reaches the named plan with no share of it held back, never more than the named plan's recorded balance, rounded half up to the cent.
    t_left: The part directed is the amount available to direct, all of which reaches the named plan with no share of it held back, never more than the named plan's recorded balance, rounded half up to the cent.
