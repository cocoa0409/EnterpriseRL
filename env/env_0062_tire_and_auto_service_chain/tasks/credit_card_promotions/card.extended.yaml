    - ep_fixed
    - ep_count
    - installment
    ladder:
    - when: a 24-month plan whose balance at closing is more than its fixed monthly payment
      value: the fixed monthly payment is added
    - when: a 24-month plan whose balance at closing is above zero but no more than the fixed monthly payment
      value: that balance is added
    - when: otherwise
