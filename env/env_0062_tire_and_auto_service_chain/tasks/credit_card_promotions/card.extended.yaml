  rule: 'A cardholder who has made a payment today may direct it, before the day''s allocation runs, to the deferred-interest plan whose period ends last on the account, the longer plan where two end on the same day; this rule figures the part of today''s payments the direction sends to that plan, for an account carrying at most one purchase on each deferred-interest plan. Second, a cardholder may instruct that amounts above the minimum go to a particular deferred-interest plan; the instruction is the cardholder''s own request and applies from the next payment that posts after it is submitted, except that a direction the cardholder gives on the day a payment posts, before that day''s allocation runs, applies to that day''s payments and sends to the named plan the part figured here. A payment direction is not fixed until the returned payment fee charged for a payment made toward the latest statement, when it meets the returned-payment courtesy conditions, carries its courtesy credit. A payment direction is not fixed until the deferred interest owed on a plan whose promotional period ended since the latest statement closed stands assessed on the account. The part directed is the amount available to direct, all of which reaches the named plan with no share of it held back, never more than the named plan''s recorded balance, rounded half up to the cent. A plan''s recorded balance is its purchase amount less the payment allocations recorded for it and less the merchandise credits that carry its ticket number. Today''s payments first cover the latest statement''s minimum still unpaid by the payments made toward it before today (less any returned unpaid), then the fees charged for that statement and still owed, which are a late fee charged for its missed minimum and the returned payment fee charged for a payment made toward it and returned unpaid (figured for an account on which at most one payment made toward the latest statement was returned unpaid), each less any fee reversal standing against it, and then the deferred interest of a plan whose period ended since that statement closed: the assessment when one stands, or, while none stands and the plan ended with a recorded balance, the accruals recorded for it; what is left is the amount available to direct. The order the amount available goes in follows the rule for a deferred-interest plan''s last promo_allocation_window_cycles billing cycles, read here as a period ending no more than window_days days after today: when another deferred-interest plan with a recorded balance is in that window, its recorded balance is served first and only the rest reaches the named plan; when the named plan itself is in that window, the minimum still unpaid also goes to it, so the amount available plus that minimum reaches it; otherwise the whole amount available reaches the named plan. A returned-payment hold keeps back a share of the amount reaching the plan for a few days: when two or more payments were returned unpaid fewer than 6 whole months before today, hold_high is added to the held share; when exactly one was, hold_low is added; otherwise nothing is added. A channel hold also applies to today''s payment: when it came in online, channel_online is added to the held share; when it came in by phone, channel_phone is added; otherwise nothing is added. The tenure release eases the hold for a long account without repeated returns: when the account was opened 36 whole months or more before today and at most two payments were returned fewer than 24 whole months before today, release_tenure_long of the held share is taken off it; when it was opened 12 whole months or more before today and at most one payment was returned fewer than 12 whole months before today, release_tenure_short of the held share is taken off it; otherwise nothing is taken off. The relationship release eases the hold for a cardholder with Crestline service bought on the card: for a cardholder who holds an active Crestline tire set paid with the Crestline card and an active Crestline alignment plan paid with the Crestline card, release_relationship_both of the held share is taken off it; for one who holds exactly one of the two, active and paid with the card, release_relationship_one of it is taken off; otherwise nothing is taken off. Every share a rule of this schedule adds to the held share is added in full, the held share never above one; every fraction a rule takes off it is a fraction of that held share, and together they never take off more than the whole of it, so the held share is multiplied by one less their total, that total never above one; the part directed is what reaches the named plan less the held share of it, never more than the named plan''s recorded balance, rounded half up to the cent once, on the final figure.'
  prerequisite:
  - problem: card_ext_returned_fee_courtesy
    kind: value_input
    gate: fees_owed
    form: state
    policy_source: A payment direction is not fixed until the returned payment fee charged for a payment made toward the latest statement, when it meets the returned-payment courtesy conditions, carries its courtesy credit.
    condition: The card_returned_payment_fee row charged for the payment made toward the latest statement and returned unpaid, when it meets the returned-payment courtesy conditions, has a card_fee_reversal row with reversal_reason courtesy_waiver citing it.
    resolved_by: credit_returned_payment_fee_d3814d72
    effect: Once the courtesy credit stands on that fee, the fee still owed falls by the credit, so the amount available to direct rises by the same amount.
  - problem: card_ext_deferred_interest_assessment
    kind: value_input
    gate: charges
    form: state
    policy_source: A payment direction is not fixed until the deferred interest owed on a plan whose promotional period ended since the latest statement closed stands assessed on the account.
    condition: A card_deferred_interest_assessed row cites the deferred-interest purchase whose period ended since the latest statement closed with a balance left.
    resolved_by: assess_deferred_interest_7b31b265
    effect: Once the assessment stands, charges changes from the plan's recorded accruals to the assessed interest, so the amount available changes.
  cross_category:
  - category: tires
    as: branch
    reads:
    - status
    - payment_method
    note: 'relationship_release: an active tire set paid with the Crestline card.'
  - category: alignment
    as: branch
    reads:
    - status
    - payment_method
    note: 'relationship_release: an active alignment plan paid with the Crestline card.'
  compute:
  - q6_exp: LATEST('card_transactions','promo_expiration_date', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_6')
  - q6_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_6')
  - q12_exp: LATEST('card_transactions','promo_expiration_date', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12')
  - q12_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12')
  - q18_exp: LATEST('card_transactions','promo_expiration_date', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18')
  - q18_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18')
  - st_date: LATEST('card_transactions','statement_date', date_field='txn_date', event_type='card_statement_issued')
  - st_min: LATEST('card_transactions','min_payment_due', date_field='txn_date', event_type='card_statement_issued')
  - pay_today: SUM('card_transactions','amount', event_type='card_payment', txn_date=NOW)
  - paid_before: SUM('card_transactions','amount', event_type='card_payment', statement_date=st_date) - SUM('card_transactions','amount', event_type='card_payment', statement_date=st_date, txn_date=NOW) - SUM('card_transactions','amount', event_type='card_returned_payment', statement_date=st_date)
  - unpaid: MX(0, st_min - paid_before)
  - rf_ref: LATEST('card_transactions','payment_reference', date_field='txn_date', event_type='card_returned_payment', statement_date=st_date)
  - rf_amt: SUM('card_transactions','amount', event_type='card_returned_payment_fee', payment_reference=rf_ref) if rf_ref != None else 0
  - rf_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_returned_payment_fee', payment_reference=rf_ref) if rf_ref != None else None
  - rf_cr: SUM('card_transactions','amount', event_type='card_fee_reversal', source_card_txn_id=rf_id) if rf_id != None else 0
  - lf_amt: SUM('card_transactions','amount', event_type='card_late_fee', statement_date=st_date)
  - lf_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_late_fee', statement_date=st_date)
  - lf_cr: SUM('card_transactions','amount', event_type='card_fee_reversal', source_card_txn_id=lf_id) if lf_id != None else 0
  - fees_owed: MX(0, rf_amt - rf_cr) + MX(0, lf_amt - lf_cr)
  - ended_since: '''deferred_6'' if (q6_exp != None and DAYS(q6_exp, NOW) > 0 and DAYS(st_date, q6_exp) > 0) else (''deferred_12'' if (q12_exp != None and DAYS(q12_exp, NOW) > 0 and DAYS(st_date, q12_exp) > 0) else (''deferred_18'' if (q18_exp != None and DAYS(q18_exp, NOW) > 0 and DAYS(st_date, q18_exp) > 0) else ''none''))'
  - e_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan=ended_since) if ended_since != 'none' else None
  - e_di: SUM('card_transactions','amount', event_type='card_deferred_interest_assessed', source_card_txn_id=e_id)
  - e_left: (LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan=ended_since) - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=e_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan=ended_since))) if ended_since != 'none' else 0
  - e_acc: SUM('card_transactions','amount', event_type='card_deferred_interest_accrual', source_card_txn_id=e_id)
  - charges: e_di if e_di > 0 else (e_acc if (ended_since != 'none' and e_left > 0) else 0)
  - available: MX(0, pay_today - unpaid - fees_owed - charges)
  - t_plan: '''deferred_18'' if ((q18_exp != None and DAYS(NOW, q18_exp) >= 0) and (not (q12_exp != None and DAYS(NOW, q12_exp) >= 0) or DAYS(q12_exp, q18_exp) >= 0) and (not (q6_exp != None and DAYS(NOW, q6_exp) >= 0) or DAYS(q6_exp, q18_exp) >= 0)) else (''deferred_12'' if ((q12_exp != None and DAYS(NOW, q12_exp) >= 0) and (not (q6_exp != None and DAYS(NOW, q6_exp) >= 0) or DAYS(q6_exp, q12_exp) >= 0)) else (''deferred_6'' if (q6_exp != None and DAYS(NOW, q6_exp) >= 0) else ''none''))'
  - t_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan=t_plan) if t_plan != 'none' else None
  - t_exp: LATEST('card_transactions','promo_expiration_date', date_field='txn_date', event_type='card_purchase', promo_plan=t_plan) if t_plan != 'none' else None
  - t_ticket: LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan=t_plan) if t_plan != 'none' else None
  - t_left: (LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan=t_plan) - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=t_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=t_ticket)) if t_plan != 'none' else 0
  - w12_rem: ((LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12') - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=q12_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_12'))) if q12_id != None else 0) if (t_plan != 'deferred_12' and q12_exp != None and DAYS(NOW, q12_exp) >= 0 and DAYS(NOW, q12_exp) <= K('window_days')) else 0
  - w6_rem: ((LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_6') - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=q6_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_6'))) if q6_id != None else 0) if (t_plan != 'deferred_6' and q6_exp != None and DAYS(NOW, q6_exp) >= 0 and DAYS(NOW, q6_exp) <= K('window_days')) else 0
  - w18_rem: ((LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18') - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=q18_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan='deferred_18'))) if q18_id != None else 0) if (t_plan != 'deferred_18' and q18_exp != None and DAYS(NOW, q18_exp) >= 0 and DAYS(NOW, q18_exp) <= K('window_days')) else 0
  - to_target: MX(0, available - w12_rem - w6_rem - w18_rem) if (w12_rem + w6_rem + w18_rem > 0) else ((available + unpaid) if (t_exp != None and DAYS(NOW, t_exp) <= K('window_days')) else available)
  - rp_6m: COUNT('card_transactions', within_months=6, date_field='txn_date', event_type='card_returned_payment')
  - hold: K('hold_high') if rp_6m >= 2 else (K('hold_low') if rp_6m == 1 else 0)
  - today_channel: LATEST('card_transactions','payment_channel', date_field='txn_date', event_type='card_payment', txn_date=NOW)
  - channel_hold: K('channel_online') if today_channel == 'online' else (K('channel_phone') if today_channel == 'phone' else 0)
  - months_open: MONTHS(F('open_date'), NOW)
  - rp_24m: COUNT('card_transactions', within_months=24, date_field='txn_date', event_type='card_returned_payment')
  - rp_12m: COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_returned_payment')
  - tenure_release: K('release_tenure_long') if (months_open >= K('tenure_long_months') and rp_24m <= 2) else (K('release_tenure_short') if (months_open >= K('tenure_short_months') and rp_12m <= 1) else 0)
  - tires_tender: CFIELD('tires','payment_method', status='active', payment_method='crestline_card')
  - alignment_tender: CFIELD('alignment','payment_method', status='active', payment_method='crestline_card')
  - relationship_release: K('release_relationship_both') if (tires_tender == 'crestline_card' and alignment_tender == 'crestline_card') else (K('release_relationship_one') if (tires_tender == 'crestline_card' or alignment_tender == 'crestline_card') else 0)
  - net_hold: MN(1, hold + channel_hold) * (1 - MN(1, tenure_release + relationship_release))
  - result: int((MN(MX(0, t_left), to_target * (1 - net_hold))) * 100 + 0.5) / 100
