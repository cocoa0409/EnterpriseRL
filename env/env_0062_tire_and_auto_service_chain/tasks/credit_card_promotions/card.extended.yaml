    - v_alloc
    - v_date
    - void_int
    - void_bal
    ladder:
    - when: the most recent returned payment had an allocation to the plan recorded on or before the last accrual closing
      value: interest on it from its allocation date through the end of the period, both days counted
    - when: its allocation to the plan was recorded after the last accrual closing
      value: interest on it for the stub days
    - when: otherwise
      value: '0'
    baseline:
      void_int: '0'
      void_bal: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: window_reallocation
    effect: parameter
    decides: realloc_amt
    bindings:
    - r_ref
    - m6
