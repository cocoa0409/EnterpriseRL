- id: card_ext_statement_minimum_payment
  base_policy_refs:
  - card_evt_payment_allocation
  - card_evt_statement
  - card_evt_late_fee
  overwrite:
  - base_policy: card_evt_statement
    superseded_clause: The minimum payment is the larger of min_payment_floor and min_payment_pct_of_balance percent of the new balance excluding equal-payment plan balances, rounded up to the whole dollar (min_payment_rounding), plus every amount listed in min_payment_includes (the fixed monthly payment of each equal-payment plan, any past-due amount and a late fee posted in the cycle); when the new balance is below min_payment_floor the minimum is the whole new balance; while a billing-error dispute is open the disputed amount is left out when disputed_amount_excluded_from_min is true.
    replaced_by: On every statement the printed minimum payment is the larger of min_payment_floor and min_payment_pct_of_balance percent of the new balance excluding equal-payment plan balances, rounded up to the whole dollar (min_payment_rounding), plus every amount listed in min_payment_includes (the fixed monthly payment of each equal-payment plan, any past-due amount and a late fee posted in the cycle); when the new balance is below min_payment_floor the printed minimum is the whole new balance; while a billing-error dispute is open the disputed amount is left out of the printed minimum when disputed_amount_excluded_from_min is true. The minimum payment the desk takes on the latest statement, and only that payment, is figured on the day it is taken as set out here, except that on an account carrying a 36-month or 48-month equal-payment plan, or more than one 24-month plan, the desk takes the minimum printed on the statement less the payments made toward that statement since it closed.
  trigger: on_request
  subject:
  - card_payment
  computes: amount
  target_tool: pay_statement_minimum_b2a1a039
  params:
    ep24_term: 24
    ep24_rate_world: 7.99
    ep24_rate_mc_preferred: 8.99
    ep24_rate_program: 9.99
    cycle_max_days: 31
  rule: 'When a cardholder pays the minimum payment of the latest statement through the care desk, the desk works out that minimum on the day the payment is taken, from the ledger as it then stands. The minimum payment the desk takes on a statement is not fixed until every late fee posted in that statement''s cycle that meets the courtesy credit conditions carries its courtesy credit. On every statement the printed minimum payment is the larger of min_payment_floor and min_payment_pct_of_balance percent of the new balance excluding equal-payment plan balances, rounded up to the whole dollar (min_payment_rounding), plus every amount listed in min_payment_includes (the fixed monthly payment of each equal-payment plan, any past-due amount and a late fee posted in the cycle); when the new balance is below min_payment_floor the printed minimum is the whole new balance; while a billing-error dispute is open the disputed amount is left out of the printed minimum when disputed_amount_excluded_from_min is true. The minimum payment the desk takes on the latest statement, and only that payment, is figured on the day it is taken as set out here, except that on an account carrying a 36-month or 48-month equal-payment plan, or more than one 24-month plan, the desk takes the minimum printed on the statement less the payments made toward that statement since it closed. The minimum the desk takes is a core, which is the product''s payment floor (min_payment_floor), plus any past-due amount, plus the late fee posted in the statement''s cycle, less the payments made toward that statement since it closed, never less than zero, rounded half up to the cent. The late fee posted in the statement''s cycle is the most recent late fee, when it was posted on or before the statement''s closing date and charged for the statement that closed immediately before it, no more than cycle_max_days days earlier; one late fee at most is charged for each statement. The past-due amount is that earlier statement''s minimum less the payments made toward it and not returned, never less than zero, and it is zero when no late fee was posted in the cycle. Payments made toward a statement are the payments recorded against that statement''s closing date, less any of them returned unpaid. The equal-payment balance at closing is the 24-month plan''s purchase amount less the payment allocations recorded for it and the merchandise credits on its ticket, with the allocations of payments made toward the latest statement added back. The core of the minimum follows the statement''s new balance: when the new balance is below the payment floor, the core is the whole new balance and it is the whole minimum, with nothing added to it and nothing taken off it but the payments made toward the statement since it closed; when min_payment_pct_of_balance percent of the new balance less the equal-payment balance at closing, rounded up to the whole dollar, is above the payment floor, the core is that rounded figure; otherwise the core is the payment floor. The plan''s fixed monthly payment is the purchase amount repaid in ep24_term equal monthly payments at the product''s 24-month equal_pay_apr_pct divided by twelve (ep24_rate_world on a World Mastercard, ep24_rate_mc_preferred on a Mastercard Preferred, ep24_rate_program on any other product), rounded up to the cent. An installment for the 24-month equal-payment plan is added to the minimum: when the account holds such a plan and its balance at closing is more than the fixed monthly payment, the fixed monthly payment is added to the minimum; when it holds one whose balance at closing is above zero but no more than the fixed monthly payment, that balance is added; otherwise nothing is added for the plan. A charge under an open billing-error dispute is left out of the minimum: when a dispute submitted to the bank is open on a charge carried in the statement''s balance, that is a purchase posted on or before the statement''s closing date, whatever cycle it posted in, or a fee posted on or before that date other than the late fee posted in the statement''s cycle and with no fee reversal standing against it, min_payment_pct_of_balance percent of that charge, rounded up to the cent, is taken off; when the open dispute is on the late fee posted in the statement''s cycle and no fee reversal stands against that fee, the fee is taken off; otherwise nothing is taken off for disputes. This is figured for an account with at most one billing-error dispute open. A fee reversal posted since the statement closed is reflected according to the fee it reverses: when it reverses the late fee posted in the statement''s cycle, the reversed amount is taken off and so is min_payment_pct_of_balance percent of it, rounded up to the cent; when it reverses another fee posted on or before the statement''s closing date, the reversed amount is taken off the past-due amount, never more than that amount; otherwise nothing is taken off for reversals. This is figured for an account on which at most one fee reversal has posted since the statement closed. Every amount a rule of this schedule adds to or takes off the minimum enters it that way, and a core a rule sets replaces the payment floor; where a rule makes the core the whole minimum, nothing else is added to it or taken off it but the payments made toward the statement since it closed; the minimum is never less than zero and is rounded half up to the cent once, on the final figure.'
  prerequisite:
  - problem: card_ext_courtesy_fee_credit
    kind: value_input
    gate: rev_off
    form: state
    policy_source: The minimum payment the desk takes on a statement is not fixed until every late fee posted in that statement's cycle that meets the courtesy credit conditions carries its courtesy credit.
    condition: Every card_late_fee row posted in the latest statement cycle that meets the courtesy credit conditions has a card_fee_reversal row with reversal_reason courtesy_waiver citing it in source_card_txn_id.
    resolved_by: apply_courtesy_fee_credit_68b22b43
    effect: Once the courtesy credit posts against the cycle's late fee, rev_off becomes the credit plus its percentage share, so the re-figured minimum falls by that much.
  cross_category: []
  compute:
  - st_date: LATEST('card_transactions','statement_date', date_field='txn_date', event_type='card_statement_issued')
  - st_min: LATEST('card_transactions','min_payment_due', date_field='txn_date', event_type='card_statement_issued')
  - lf_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_late_fee')
  - lf_amt: LATEST('card_transactions','amount', date_field='txn_date', event_type='card_late_fee')
  - lf_date: LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_late_fee')
  - lf_stmt: LATEST('card_transactions','statement_date', date_field='txn_date', event_type='card_late_fee')
  - fee_in_cycle: lf_stmt != None and lf_stmt != st_date and DAYS(lf_date, st_date) >= 0 and DAYS(lf_stmt, st_date) <= K('cycle_max_days')
  - fee_cycle: lf_amt if fee_in_cycle else 0
  - missed_min: LATEST('card_transactions','min_payment_due', date_field='txn_date', event_type='card_statement_issued', statement_date=lf_stmt) if fee_in_cycle else 0
  - paid_toward_missed: SUM('card_transactions','amount', event_type='card_payment', statement_date=lf_stmt) - SUM('card_transactions','amount', event_type='card_returned_payment', statement_date=lf_stmt) if fee_in_cycle else 0
  - past_due: MX(0, missed_min - paid_toward_missed) if fee_in_cycle else 0
  - paid_since: SUM('card_transactions','amount', event_type='card_payment', statement_date=st_date) - SUM('card_transactions','amount', event_type='card_returned_payment', statement_date=st_date)
  - ep_plans: COUNT('card_transactions', event_type='card_purchase', promo_plan='equal_pay_24')
  - ep_rate: K('ep24_rate_world') if F('variant_name') == 'Crestline Auto Care World Mastercard' else (K('ep24_rate_mc_preferred') if F('variant_name') == 'Crestline Auto Care Mastercard Preferred' else K('ep24_rate_program'))
  - ep_id: LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase', promo_plan='equal_pay_24')
  - ep_amt: LATEST('card_transactions','amount', date_field='txn_date', event_type='card_purchase', promo_plan='equal_pay_24') if ep_plans >= 1 else 0
  - ep_ticket: LATEST('card_transactions','source_ticket_number', date_field='txn_date', event_type='card_purchase', promo_plan='equal_pay_24')
  - ep_at_stmt: (ep_amt - SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=ep_id) - SUM('card_transactions','amount', event_type='card_merchandise_credit', source_ticket_number=ep_ticket) + SUM('card_transactions','amount', event_type='card_payment_allocation', source_card_txn_id=ep_id, statement_date=st_date)) if ep_plans >= 1 else 0
  - ep_mrate: ep_rate / 100 / 12
  - ep_fixed: (-((-((ep_amt * ep_mrate / (1 - (1 + ep_mrate) ** (-K('ep24_term')))) * 100)) // 1) / 100) if ep_plans >= 1 else 0
  - st_nb: LATEST('card_transactions','amount', date_field='txn_date', event_type='card_statement_issued')
  - pct_raw: int((st_nb - ep_at_stmt) * 100 + 0.5) * P('min_payment_pct_of_balance')
  - pct_up: -((-pct_raw) // 10000)
  - core: st_nb if st_nb < P('min_payment_floor') else (pct_up if pct_up > P('min_payment_floor') else P('min_payment_floor'))
  - ep_count: COUNT('card_transactions', event_type='card_purchase', promo_plan='equal_pay_24')
  - installment: ep_fixed if (ep_count >= 1 and ep_at_stmt > ep_fixed) else (ep_at_stmt if (ep_count >= 1 and ep_at_stmt > 0) else 0)
  - d_txn: LATEST('card_requests','source_card_txn_id', date_field='created_at', request_type='billing_dispute', request_status='submitted')
  - d_type: LATEST('card_transactions','event_type', date_field='txn_date', card_txn_id=d_txn)
  - d_amt: SUM('card_transactions','amount', card_txn_id=d_txn)
  - d_date: LATEST('card_transactions','txn_date', date_field='txn_date', card_txn_id=d_txn)
  - d_rev: SUM('card_transactions','amount', event_type='card_fee_reversal', source_card_txn_id=d_txn)
  - dispute_off: ((-((-(int((d_amt) * 100 + 0.5) * P('min_payment_pct_of_balance'))) // 100) / 100)) if (d_date != None and DAYS(d_date, st_date) >= 0 and (d_type == 'card_purchase' or ((d_type == 'card_late_fee' or d_type == 'card_returned_payment_fee') and d_rev == 0 and not (d_txn == lf_id and fee_in_cycle)))) else (d_amt if (d_date != None and d_type == 'card_late_fee' and d_txn == lf_id and fee_in_cycle and d_rev == 0) else 0)
  - r_src: LATEST('card_transactions','source_card_txn_id', date_field='txn_date', event_type='card_fee_reversal')
  - r_amt: LATEST('card_transactions','amount', date_field='txn_date', event_type='card_fee_reversal')
  - r_date: LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_fee_reversal')
  - r_fdate: LATEST('card_transactions','txn_date', date_field='txn_date', card_txn_id=r_src) if r_src != None else None
  - rev_off: (r_amt + (-((-(int((r_amt) * 100 + 0.5) * P('min_payment_pct_of_balance'))) // 100) / 100)) if (r_date != None and DAYS(st_date, r_date) > 0 and r_src == lf_id and fee_in_cycle) else ((MN(r_amt, past_due)) if (r_date != None and DAYS(st_date, r_date) > 0 and r_fdate != None and DAYS(r_fdate, st_date) >= 0) else 0)
  - longer_plans: COUNT('card_transactions', event_type='card_purchase', promo_plan='equal_pay_36') + COUNT('card_transactions', event_type='card_purchase', promo_plan='equal_pay_48')
  - result: int((MX(0, (st_min if (longer_plans >= 1 or ep_plans >= 2) else (core if st_nb < P('min_payment_floor') else core + installment + past_due + fee_cycle - dispute_off - rev_off)) - paid_since)) * 100 + 0.5) / 100
