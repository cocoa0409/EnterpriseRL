  factors:
  - id: stub_period
    effect: method
    decides: stub_int
    bindings:
    - p_start
    - acc_rows
    - stub_int
    ladder:
    - when: the period ended after the closing date of the plan's last recorded accrual
      method: interest on the recorded balance for each stub day is added
    - when: the period ended on that closing date
      method: nothing is added
    - when: no accrual has been recorded for the plan
      method: interest on the recorded balance from the purchase date through the end of the period is added
    baseline:
      stub_int: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: ticket_refund_link
    effect: parameter
    decides: refund_int
    bindings:
    - cert_id
    - hz_ref
    - hz_date
    - refund_int
    - refund_bal
    ladder:
    - when: a certificate refund on the plan's ticket paid to the card on or before the last accrual closing
      value: interest on the refund for the stub days
    - when: such a refund paid after the last accrual closing
      value: interest on the refund from its payment date through the end of the period, both days counted
    - when: otherwise
      value: '0'
    baseline:
      refund_int: '0'
      refund_bal: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: hazard
  - id: voided_allocation
