- id: card_ext_returned_fee_courtesy
  base_policy_refs:
  - card_evt_fee_reversal
  - card_billing_dispute
  - card_evt_returned_payment
  overwrite:
  - base_policy: card_evt_fee_reversal
    superseded_clause: 'courtesy_waiver: a late fee may be reversed as a courtesy when card_msr_courtesy_waivers_12m is below courtesy_late_fee_waivers_per_12_months and, when courtesy_waiver_requires_payment is true, the minimum payment that was missed has since been paid in full; a product whose courtesy_late_fee_waivers_per_12_months is 0 never reverses as a courtesy.'
    replaced_by: Under the returned-payment courtesy schedule Northgate posts a courtesy credit, whether or not the cardholder asks for it, on the most recent returned payment fee when fewer courtesy credits have posted to the account in the rolling 12 calendar months than the product's courtesy allowance (courtesy_late_fee_waivers_per_12_months), the returned payment was replaced by another payment made toward the same statement by that statement's due date, and the fee carries no reversal; a product whose courtesy allowance is 0 never gives one; late fees and returned payment fees draw on that one allowance in the order they posted, so that when fees of both kinds meet their schedules' conditions and the allowance left covers fewer of them, the fee posted first takes it; a late fee is credited as a courtesy only under the late-fee courtesy schedule, and no other fee is credited as a courtesy.
  - base_policy: card_evt_fee_reversal
    superseded_clause: The reversal is always the full amount of the fee row and cites it in source_card_txn_id.
    replaced_by: A courtesy credit under the returned-payment courtesy schedule, and only such a credit, is the figure worked out here and cites the returned payment fee row it credits in source_card_txn_id; a late fee credited under the late-fee courtesy schedule takes that schedule's figure, and a billing_error or fee_not_permitted reversal remains the full amount of the fee row it cites.
  trigger: state_due
  subject:
  - card_fee_reversal
  computes: amount
  target_tool: credit_returned_payment_fee_d3814d72
  params:
    rpf_share_full: 1.0
    rpf_share_new: 0.4
    rpf_share_seasoned: 0.55
    rpf_seasoned_months: 36
    weight_low_ratio: 3
    weight_high_ratio: 10
    weight_bonus_high: 0.15
    weight_bonus_mid: 0.05
    protection_bonus_both: 0.1
    protection_bonus_one: 0.05
    rpf_spend_high: 1500.0
    rpf_spend_mid: 750.0
    rpf_spend_bonus_high: 0.1
    rpf_spend_bonus_mid: 0.05
    record_bonus_long: 0.1
    record_bonus_short: 0.05
  rule: 'Northgate''s returned-payment courtesy schedule figures the courtesy credit on the most recent returned payment fee posted to a Crestline credit card account. Under the returned-payment courtesy schedule Northgate posts a courtesy credit, whether or not the cardholder asks for it, on the most recent returned payment fee when fewer courtesy credits have posted to the account in the rolling 12 calendar months than the product''s courtesy allowance (courtesy_late_fee_waivers_per_12_months), the returned payment was replaced by another payment made toward the same statement by that statement''s due date, and the fee carries no reversal; a product whose courtesy allowance is 0 never gives one; late fees and returned payment fees draw on that one allowance in the order they posted, so that when fees of both kinds meet their schedules'' conditions and the allowance left covers fewer of them, the fee posted first takes it; a late fee is credited as a courtesy only under the late-fee courtesy schedule, and no other fee is credited as a courtesy. A returned-fee courtesy credit returns the returned payment fee in full: nothing is credited outright, the credit basis is the whole fee and the share applied to it is rpf_share_full, so the credit equals the amount of the most recent returned payment fee on the account, rounded half up to the cent. The share''s starting point depends on the account''s returned-payment record and age, with months counted as whole calendar months up to today: when at least one returned payment fee besides the one being credited was posted fewer than 12 months before today (two or more returned payment fees in that time, the credited one included) and the account was opened fewer than rpf_seasoned_months months before today, the share starts from rpf_share_new in place of rpf_share_full; when such another fee exists and the account was opened rpf_seasoned_months months or more before today, it starts from rpf_share_seasoned in place of rpf_share_full; otherwise it starts from rpf_share_full. The payment weight bonus eases a returned payment fee that is heavy against the payment that came back: when the returned payment was less than weight_low_ratio times the fee, weight_bonus_high is added to the share; when it was at least weight_low_ratio times but less than weight_high_ratio times the fee, weight_bonus_mid is added; otherwise nothing is added. The protection plan bonus recognizes Crestline coverage bought with the card: a cardholder who holds an active Crestline road hazard certificate paid with the Crestline card and an active Crestline battery warranty paid with the Crestline card adds protection_bonus_both to the share; one who holds exactly one of the two, active and paid with the card, adds protection_bonus_one; otherwise nothing is added. The returned-fee spend bonus recognizes use of the card: when the purchases posted to the account fewer than 12 months before today total at least rpf_spend_high and at least one of them carries a promotional plan, rpf_spend_bonus_high is added to the share; when they total at least rpf_spend_mid without meeting that test, rpf_spend_bonus_mid is added; otherwise nothing is added. The courtesy record bonus recognizes an account that has not leaned on courtesy credits: when no courtesy credit of any kind was posted to the account fewer than 24 whole months before today, record_bonus_long is added to the share; when none was posted fewer than 12 whole months before today but one was posted fewer than 24, record_bonus_short is added; otherwise nothing is added. The returned-fee courtesy credit is the part credited outright plus the share of the credit basis, the share never above rpf_share_full however much is added to it, rounded half up to the cent once, on the final figure. The returned-fee credit basis depends on the level the fee was charged at: when the fee was charged at the repeat amount (returned_payment_fee_repeat) and no returned payment fee besides it was posted fewer than 3 months before today, the part of the fee above the first-violation amount (returned_payment_fee_first) is credited outright and the share is applied to the first-violation amount; when the fee was charged at the repeat amount and another returned payment fee was posted fewer than 3 months before today, nothing is credited outright and the share is applied to the first-violation amount only; otherwise nothing is credited outright and the share is applied to the whole fee. A courtesy credit under the returned-payment courtesy schedule, and only such a credit, is the figure worked out here and cites the returned payment fee row it credits in source_card_txn_id; a late fee credited under the late-fee courtesy schedule takes that schedule''s figure, and a billing_error or fee_not_permitted reversal remains the full amount of the fee row it cites.'
  prerequisite: []
  cross_category:
  - category: hazard
    as: branch
    reads:
    - status
    - payment_method
    note: 'protection_plan_bonus: an active road hazard certificate paid with the Crestline card.'
  - category: battery
    as: branch
    reads:
    - status
    - payment_method
    note: 'protection_plan_bonus: an active battery warranty paid with the Crestline card.'
  compute:
  - fee_amt: (LATEST('card_transactions','amount', date_field='txn_date', event_type='card_returned_payment_fee') or 0)
  - fee_ref: LATEST('card_transactions','payment_reference', date_field='txn_date', event_type='card_returned_payment_fee')
  - rpf_12m: COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_returned_payment_fee')
  - months_open: MONTHS(F('open_date'), NOW)
  - return_share: K('rpf_share_new') if (rpf_12m >= 2 and months_open < K('rpf_seasoned_months')) else (K('rpf_share_seasoned') if (rpf_12m >= 2 and months_open >= K('rpf_seasoned_months')) else K('rpf_share_full'))
  - ret_amt: (LATEST('card_transactions','amount', date_field='txn_date', event_type='card_returned_payment', payment_reference=fee_ref) or 0)
  - weight_bonus: K('weight_bonus_high') if ret_amt < K('weight_low_ratio') * fee_amt else (K('weight_bonus_mid') if ret_amt < K('weight_high_ratio') * fee_amt else 0)
  - hazard_tender: CFIELD('hazard','payment_method', status='active', payment_method='crestline_card')
  - battery_tender: CFIELD('battery','payment_method', status='active', payment_method='crestline_card')
  - protection_bonus: K('protection_bonus_both') if (hazard_tender == 'crestline_card' and battery_tender == 'crestline_card') else (K('protection_bonus_one') if (hazard_tender == 'crestline_card' or battery_tender == 'crestline_card') else 0)
  - spend_12m: SUM('card_transactions','amount', within_months=12, date_field='txn_date', event_type='card_purchase')
  - promo_buys_12m: COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_purchase') - COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_purchase', promo_plan='none')
  - rpf_spend_bonus: K('rpf_spend_bonus_high') if (spend_12m >= K('rpf_spend_high') and promo_buys_12m >= 1) else (K('rpf_spend_bonus_mid') if spend_12m >= K('rpf_spend_mid') else 0)
  - cc_24m: COUNT('card_transactions', within_months=24, date_field='txn_date', event_type='card_fee_reversal', reversal_reason='courtesy_waiver')
  - cc_12m: COUNT('card_transactions', within_months=12, date_field='txn_date', event_type='card_fee_reversal', reversal_reason='courtesy_waiver')
  - record_bonus: K('record_bonus_long') if cc_24m == 0 else (K('record_bonus_short') if (cc_12m == 0 and cc_24m >= 1) else 0)
  - rpf_3m: COUNT('card_transactions', within_months=3, date_field='txn_date', event_type='card_returned_payment_fee')
  - outright_part: (fee_amt - P('returned_payment_fee_first')) if (fee_amt == P('returned_payment_fee_repeat') and rpf_3m < 2) else 0
  - share_base: P('returned_payment_fee_first') if (fee_amt == P('returned_payment_fee_repeat') and rpf_3m < 2) else (P('returned_payment_fee_first') if (fee_amt == P('returned_payment_fee_repeat') and rpf_3m >= 2) else fee_amt)
  - combined_share: MN(K('rpf_share_full'), return_share + weight_bonus + protection_bonus + rpf_spend_bonus + record_bonus)
  - result: int((outright_part + combined_share * share_base) * 100 + 0.5) / 100
  compute_basis:
    fee_amt: Northgate's returned-payment courtesy schedule figures the courtesy credit on the most recent returned payment fee posted to a Crestline credit card account.
    fee_ref: 'The payment weight bonus eases a returned payment fee that is heavy against the payment that came back: when the returned payment was less than weight_low_ratio times the fee, weight_bonus_high is added to the share; when it was at least weight_low_ratio times but less than weight_high_ratio times the fee, weight_bonus_mid is added; otherwise nothing is added.'
    rpf_12m: 'The share''s starting point depends on the account''s returned-payment record and age, with months counted as whole calendar months up to today: when at least one returned payment fee besides the one being credited was posted fewer than 12 months before today (two or more returned payment fees in that time, the credited one included) and the account was opened fewer than rpf_seasoned_months months before today, the share starts from rpf_share_new in place of rpf_share_full; when such another fee exists and the account was opened rpf_seasoned_months months or more before today, it starts from rpf_share_seasoned in place of rpf_share_full; otherwise it starts from rpf_share_full.'
    months_open: 'The share''s starting point depends on the account''s returned-payment record and age, with months counted as whole calendar months up to today: when at least one returned payment fee besides the one being credited was posted fewer than 12 months before today (two or more returned payment fees in that time, the credited one included) and the account was opened fewer than rpf_seasoned_months months before today, the share starts from rpf_share_new in place of rpf_share_full; when such another fee exists and the account was opened rpf_seasoned_months months or more before today, it starts from rpf_share_seasoned in place of rpf_share_full; otherwise it starts from rpf_share_full.'
    return_share: 'The share''s starting point depends on the account''s returned-payment record and age, with months counted as whole calendar months up to today: when at least one returned payment fee besides the one being credited was posted fewer than 12 months before today (two or more returned payment fees in that time, the credited one included) and the account was opened fewer than rpf_seasoned_months months before today, the share starts from rpf_share_new in place of rpf_share_full; when such another fee exists and the account was opened rpf_seasoned_months months or more before today, it starts from rpf_share_seasoned in place of rpf_share_full; otherwise it starts from rpf_share_full.'
    ret_amt: 'The payment weight bonus eases a returned payment fee that is heavy against the payment that came back: when the returned payment was less than weight_low_ratio times the fee, weight_bonus_high is added to the share; when it was at least weight_low_ratio times but less than weight_high_ratio times the fee, weight_bonus_mid is added; otherwise nothing is added.'
    weight_bonus: 'The payment weight bonus eases a returned payment fee that is heavy against the payment that came back: when the returned payment was less than weight_low_ratio times the fee, weight_bonus_high is added to the share; when it was at least weight_low_ratio times but less than weight_high_ratio times the fee, weight_bonus_mid is added; otherwise nothing is added.'
    hazard_tender: 'The protection plan bonus recognizes Crestline coverage bought with the card: a cardholder who holds an active Crestline road hazard certificate paid with the Crestline card and an active Crestline battery warranty paid with the Crestline card adds protection_bonus_both to the share; one who holds exactly one of the two, active and paid with the card, adds protection_bonus_one; otherwise nothing is added.'
    battery_tender: 'The protection plan bonus recognizes Crestline coverage bought with the card: a cardholder who holds an active Crestline road hazard certificate paid with the Crestline card and an active Crestline battery warranty paid with the Crestline card adds protection_bonus_both to the share; one who holds exactly one of the two, active and paid with the card, adds protection_bonus_one; otherwise nothing is added.'
    protection_bonus: 'The protection plan bonus recognizes Crestline coverage bought with the card: a cardholder who holds an active Crestline road hazard certificate paid with the Crestline card and an active Crestline battery warranty paid with the Crestline card adds protection_bonus_both to the share; one who holds exactly one of the two, active and paid with the card, adds protection_bonus_one; otherwise nothing is added.'
    spend_12m: 'The returned-fee spend bonus recognizes use of the card: when the purchases posted to the account fewer than 12 months before today total at least rpf_spend_high and at least one of them carries a promotional plan, rpf_spend_bonus_high is added to the share; when they total at least rpf_spend_mid without meeting that test, rpf_spend_bonus_mid is added; otherwise nothing is added.'
    promo_buys_12m: 'The returned-fee spend bonus recognizes use of the card: when the purchases posted to the account fewer than 12 months before today total at least rpf_spend_high and at least one of them carries a promotional plan, rpf_spend_bonus_high is added to the share; when they total at least rpf_spend_mid without meeting that test, rpf_spend_bonus_mid is added; otherwise nothing is added.'
    rpf_spend_bonus: 'The returned-fee spend bonus recognizes use of the card: when the purchases posted to the account fewer than 12 months before today total at least rpf_spend_high and at least one of them carries a promotional plan, rpf_spend_bonus_high is added to the share; when they total at least rpf_spend_mid without meeting that test, rpf_spend_bonus_mid is added; otherwise nothing is added.'
    cc_24m: 'The courtesy record bonus recognizes an account that has not leaned on courtesy credits: when no courtesy credit of any kind was posted to the account fewer than 24 whole months before today, record_bonus_long is added to the share; when none was posted fewer than 12 whole months before today but one was posted fewer than 24, record_bonus_short is added; otherwise nothing is added.'
    cc_12m: 'The courtesy record bonus recognizes an account that has not leaned on courtesy credits: when no courtesy credit of any kind was posted to the account fewer than 24 whole months before today, record_bonus_long is added to the share; when none was posted fewer than 12 whole months before today but one was posted fewer than 24, record_bonus_short is added; otherwise nothing is added.'
    record_bonus: 'The courtesy record bonus recognizes an account that has not leaned on courtesy credits: when no courtesy credit of any kind was posted to the account fewer than 24 whole months before today, record_bonus_long is added to the share; when none was posted fewer than 12 whole months before today but one was posted fewer than 24, record_bonus_short is added; otherwise nothing is added.'
    rpf_3m: 'The returned-fee credit basis depends on the level the fee was charged at: when the fee was charged at the repeat amount (returned_payment_fee_repeat) and no returned payment fee besides it was posted fewer than 3 months before today, the part of the fee above the first-violation amount (returned_payment_fee_first) is credited outright and the share is applied to the first-violation amount; when the fee was charged at the repeat amount and another returned payment fee was posted fewer than 3 months before today, nothing is credited outright and the share is applied to the first-violation amount only; otherwise nothing is credited outright and the share is applied to the whole fee.'
    outright_part: 'The returned-fee credit basis depends on the level the fee was charged at: when the fee was charged at the repeat amount (returned_payment_fee_repeat) and no returned payment fee besides it was posted fewer than 3 months before today, the part of the fee above the first-violation amount (returned_payment_fee_first) is credited outright and the share is applied to the first-violation amount; when the fee was charged at the repeat amount and another returned payment fee was posted fewer than 3 months before today, nothing is credited outright and the share is applied to the first-violation amount only; otherwise nothing is credited outright and the share is applied to the whole fee.'
    share_base: 'The returned-fee credit basis depends on the level the fee was charged at: when the fee was charged at the repeat amount (returned_payment_fee_repeat) and no returned payment fee besides it was posted fewer than 3 months before today, the part of the fee above the first-violation amount (returned_payment_fee_first) is credited outright and the share is applied to the first-violation amount; when the fee was charged at the repeat amount and another returned payment fee was posted fewer than 3 months before today, nothing is credited outright and the share is applied to the first-violation amount only; otherwise nothing is credited outright and the share is applied to the whole fee.'
    combined_share: The returned-fee courtesy credit is the part credited outright plus the share of the credit basis, the share never above rpf_share_full however much is added to it, rounded half up to the cent once, on the final figure.
    result: The returned-fee courtesy credit is the part credited outright plus the share of the credit basis, the share never above rpf_share_full however much is added to it, rounded half up to the cent once, on the final figure.
  factors:
  - id: return_history_share
    effect: parameter
    decides: return_share
    bindings:
    - rpf_12m
    - months_open
    - return_share
    ladder:
    - when: another returned payment fee within 12 months and the account opened fewer than rpf_seasoned_months months before today
      value: K('rpf_share_new')
    - when: another returned payment fee within 12 months and the account opened rpf_seasoned_months months or more before today
      value: K('rpf_share_seasoned')
    - when: otherwise
      value: K('rpf_share_full')
    baseline:
      return_share: K('rpf_share_full')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: payment_weight_bonus
    effect: parameter
    decides: weight_bonus
    bindings:
    - fee_ref
    - ret_amt
    - weight_bonus
    ladder:
    - when: the returned payment was less than weight_low_ratio times the fee
      value: K('weight_bonus_high')
    - when: at least weight_low_ratio times but less than weight_high_ratio times the fee
      value: K('weight_bonus_mid')
    - when: otherwise
      value: '0'
    baseline:
      weight_bonus: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: protection_plan_bonus
    effect: parameter
    decides: protection_bonus
    bindings:
    - hazard_tender
    - battery_tender
    - protection_bonus
    ladder:
    - when: an active road hazard certificate and an active battery warranty, both paid with the Crestline card
      value: K('protection_bonus_both')
    - when: exactly one of the two, active and paid with the Crestline card
      value: K('protection_bonus_one')
    - when: otherwise
      value: '0'
    baseline:
      protection_bonus: '0'
    evidence:
    - cross_category
    cross_difficulty: hazard
  - id: returned_fee_spend_bonus
    effect: parameter
    decides: rpf_spend_bonus
    bindings:
    - spend_12m
    - promo_buys_12m
    - rpf_spend_bonus
    ladder:
    - when: purchases in the last 12 months total at least rpf_spend_high and one carries a promotional plan
      value: K('rpf_spend_bonus_high')
    - when: those purchases total at least rpf_spend_mid without meeting the first test
      value: K('rpf_spend_bonus_mid')
    - when: otherwise
      value: '0'
    baseline:
      rpf_spend_bonus: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: courtesy_record_bonus
    effect: parameter
    decides: record_bonus
    bindings:
    - cc_24m
    - cc_12m
    - record_bonus
    ladder:
    - when: no courtesy credit posted in the last 24 months
      value: K('record_bonus_long')
    - when: none in the last 12 months but one within 24 months
      value: K('record_bonus_short')
    - when: otherwise
      value: '0'
    baseline:
      record_bonus: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: returned_fee_basis
    effect: method
    decides: share_base
    bindings:
    - rpf_3m
    - outright_part
    - share_base
    ladder:
    - when: repeat amount and no other returned payment fee within 3 months
      method: the step above returned_payment_fee_first is credited outright and the share applies to returned_payment_fee_first
    - when: repeat amount and another returned payment fee within 3 months
      method: nothing is credited outright and the share applies to returned_payment_fee_first only
    - when: otherwise
      method: nothing is credited outright and the share applies to the whole fee
    baseline:
      outright_part: '0'
      share_base: fee_amt
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: 'A returned-fee courtesy credit returns the returned payment fee in full: nothing is credited outright, the credit basis is the whole fee and the share applied to it is rpf_share_full, so the credit equals the amount of the most recent returned payment fee on the account, rounded half up to the cent.'
    params:
    - rpf_share_full
  inputs:
    history:
    - table: card_transactions
