    - rev_off
    ladder:
    - when: a fee reversal since the statement closed against the late fee posted in the statement's cycle
      value: the reversed amount and its percentage share are taken off the minimum
    - when: a fee reversal since the statement closed against another fee posted on or before the closing date
      value: the reversed amount is taken off the past-due amount, never more than that amount
    - when: otherwise
      value: nothing is taken off
    baseline:
      rev_off: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The minimum the desk takes is a core, which is the product's payment floor (min_payment_floor), plus any past-due amount, plus the late fee posted in the statement's cycle, less the payments made toward that statement since it closed, never less than zero, rounded half up to the cent.
    params:
    - min_payment_floor
  inputs:
