    - table: card_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: card_late_fee
    - table: card_transactions
      aggregate: count
      field: card_txn_id
      within_months: 12
      filters:
        event_type: card_late_fee
    - table: card_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: card_purchase
