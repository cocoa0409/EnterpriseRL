      value: 0 - K('remittance_record_high_adjust')
    - when: 12 to 23 such entries
      value: 0 - K('remittance_record_mid_adjust')
    - when: otherwise
      value: '0'
    baseline:
      remittance_record_adjust: '0'
    evidence:
    - history
    cross_difficulty: null
