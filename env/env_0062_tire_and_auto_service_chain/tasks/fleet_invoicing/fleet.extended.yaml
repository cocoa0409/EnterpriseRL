    - when: invoices posted less than twelve whole months before today total 40,000.00 or more
      value: K('volume_high_points')
    - when: they total 20,000.00 to 39,999.99
      value: K('volume_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      volume_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: remit_channel_points
    effect: parameter
    decides: channel_points
    bindings:
    - remit_reference
    - channel_points
    ladder:
    - when: the remittance reference carries ACH or WIRE, whether or not it also carries CHK
      value: K('electronic_points')
    - when: the reference carries CHK and neither ACH nor WIRE
      value: 0 - K('check_points')
    - when: otherwise (none of them)
      value: '0'
    baseline:
      channel_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: disputed_invoice_base
    effect: method
    decides: discount_base
    bindings:
    - open_dispute_rows
    - discount_base
    ladder:
    - when: the amount under open dispute for the invoice is more than half of the invoice amount
      method: the invoice earns no early-pay discount (the discount base is nil)
    - when: some amount but no more than half of the invoice amount is under open dispute
      method: the discount base is the invoice amount less the amount under open dispute
    - when: otherwise (nothing under open dispute)
      method: the discount base is the whole invoice amount
    baseline:
      discount_base: pay_invoice_amount
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The early-pay discount is credited on the invoice the most recent remittance was applied to when that remittance arrived
      no later than the end of the early-pay period and, together with the payments, early-pay discounts and credit memos
      already applied to the invoice, leaves nothing open on it beyond the amount under an open dispute registered for that
      invoice and the early-pay discount itself (a remittance that already deducted the discount pays the invoice in full);
      every other invoice remains under the base rule. The discount is the early-pay rate in percent applied once to the
      discount base, rounded half up to the cent only on that final product. The early-pay rate is the program's early_pay_discount_pct,
      and the discount base is the invoice amount.
    params:
    - early_pay_discount_pct
    - early_pay_discount_days
  inputs:
    history:
    - table: fleet_transactions
      aggregate: latest
      field: source_fleet_txn_id
      filters:
        event_type: fleet_payment_received
    - table: fleet_transactions
      aggregate: count
      field: fleet_txn_id
      within_months: 12
      filters:
        event_type: fleet_late_charge
    - table: fleet_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: fleet_invoice_posted
    - table: fleet_invoice_disputes
      aggregate: sum
      field: disputed_amount
      filters:
        dispute_status: open
    - category: tires
      table: tire_events
      aggregate: count
      field: tire_event_id
      within_months: 12
      filters:
        event_type: tires_rotation_service
    cross_category:
    - tires
- id: fleet_ext_trip_fee_dispute
  base_policy_refs:
  - fleet_evt_credit_memo
  - fleet_evt_invoice
  overwrite:
  - base_policy: fleet_evt_invoice
    superseded_clause: >-
      A mobile service visit adds one mobile_service_call invoice of mobile_service_fee when that fee is above 0.00.
    replaced_by: >-
      For a visit fee a business contests through this dispute, and only for such a fee, the fee the visit owes is the fee
      this rule works out from the program's mobile_service_fee; every other mobile service visit is invoiced under the
      base rule
  trigger: on_request
  subject:
  - fleet_credit_memo
  computes: disputed_amount
  target_tool: file_fleet_trip_fee_dispute_f6605125
  params:
    slide_per_vehicle: 12.0
    saturday_surcharge: 8.0
    sunday_surcharge: 12.0
    tire_credit_high: 10.0
    tire_credit_mid: 5.0
    visits_high: 6
    visits_mid: 3
    route_credit_high: 5.0
    route_credit_mid: 2.5
    fleet_size_high: 50
    fleet_size_mid: 30
    fleet_credit_high: 5.0
    fleet_credit_mid: 2.5
    tire_invoices_visit_high: 4
    tire_invoices_visit_mid: 2
  rule: >-
    A business that contests the fee of its most recent mobile service visit files a dispute on that visit fee invoice;
    this rule fixes the amount the dispute carries. For a visit fee a business contests through this dispute, and only for
    such a fee, the fee the visit owes is the fee this rule works out from the program's mobile_service_fee; every other
    mobile service visit is invoiced under the base rule. The fee a visit owes is the program's mobile_service_fee for the
    visit, and the amount in dispute is the fee charged less that fee owed, never below 0.00, rounded half up to the cent.
    The vehicles served on a visit are counted as the invoices dated the visit day from the store that sent the crew, other
    than mobile service visit fee invoices, so a vehicle invoiced for two kinds of work counts twice. The fee owed starts
    from an amount set by the number of vehicles served: when the visit served at least twice the program's mobile_service_min_vehicles
    it starts from nothing; when it served more than mobile_service_min_vehicles but fewer than twice that number it starts
    from the program's mobile_service_fee less 12.00 for each vehicle beyond mobile_service_min_vehicles, never below 0.00;
    and otherwise it starts from the program's mobile_service_fee. A weekend surcharge is added to the fee owed: 12.00 for
    a visit on a Sunday, 8.00 for a visit on a Saturday, and nothing for a visit Monday through Friday. A tire work credit
    is taken off the fee owed: 10.00 when four or more tire invoices are dated the visit day from the store that sent the
    crew, 5.00 when two or three are, and nothing when fewer are. A route credit is taken off the fee owed: 5.00 when the
    account has 6 or more mobile service visit fee invoices dated less than twelve whole months before today, 2.50 when
    it has 3 to 5, and nothing when it has fewer. A fleet size credit is taken off the fee owed: 5.00 when the account's
    roster shows 50 or more enrollments beyond its removals, 2.50 when it shows 30 to 49 more, and nothing when it shows
    fewer. The fee owed is never below 0.00, the floor being applied once after every addition and credit, and the amount
    in dispute is the fee charged less the fee owed, never below 0.00, rounded half up to the cent once at the end.
  prerequisite: []
  cross_category: []
  compute:
  - fee_invoice: >-
      LATEST('fleet_transactions','fleet_txn_id', date_field='txn_date', event_type='fleet_invoice_posted', service_category='mobile_service_call')
  - fee_charged: LATEST('fleet_transactions','amount', date_field='txn_date', fleet_txn_id=fee_invoice)
  - visit_date: LATEST('fleet_transactions','txn_date', date_field='txn_date', fleet_txn_id=fee_invoice)
  - visit_store: LATEST('fleet_transactions','store_id', date_field='txn_date', fleet_txn_id=fee_invoice)
  - program_fee: P('mobile_service_fee')
  - program_min_vehicles: P('mobile_service_min_vehicles')
  - vehicles_served: >-
      COUNT('fleet_transactions', event_type='fleet_invoice_posted', txn_date=visit_date, store_id=visit_store) - COUNT('fleet_transactions',
      event_type='fleet_invoice_posted', txn_date=visit_date, store_id=visit_store, service_category='mobile_service_call')
  - schedule_part: >-
      0 if vehicles_served >= 2 * program_min_vehicles else (MX(0, program_fee - K('slide_per_vehicle') * (vehicles_served
      - program_min_vehicles)) if vehicles_served > program_min_vehicles else program_fee)
  - visit_weekday: DAYS('2026-01-03', visit_date) % 7
  - weekend_surcharge: >-
      K('sunday_surcharge') if visit_weekday == 1 else (K('saturday_surcharge') if visit_weekday == 0 else 0)
  - visit_tire_invoices: >-
      COUNT('fleet_transactions', event_type='fleet_invoice_posted', txn_date=visit_date, store_id=visit_store, service_category='tires')
  - tire_work_credit: >-
      K('tire_credit_high') if visit_tire_invoices >= K('tire_invoices_visit_high') else (K('tire_credit_mid') if visit_tire_invoices
      >= K('tire_invoices_visit_mid') else 0)
  - visit_fees_12m: >-
      COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_invoice_posted', service_category='mobile_service_call')
  - route_credit: >-
      K('route_credit_high') if visit_fees_12m >= K('visits_high') else (K('route_credit_mid') if visit_fees_12m >= K('visits_mid')
      else 0)
  - roster_net_enrolled: >-
      COUNT('fleet_roster_events', event_type='fleet_vehicle_enrolled') - COUNT('fleet_roster_events', event_type='fleet_vehicle_removed')
  - fleet_size_credit: >-
      K('fleet_credit_high') if roster_net_enrolled >= K('fleet_size_high') else (K('fleet_credit_mid') if roster_net_enrolled
      >= K('fleet_size_mid') else 0)
  - fee_owed: MX(0, schedule_part + weekend_surcharge - tire_work_credit - route_credit - fleet_size_credit)
  - result: RND(MX(0, fee_charged - fee_owed), 2)
  compute_basis:
    fee_invoice: >-
      A business that contests the fee of its most recent mobile service visit files a dispute on that visit fee invoice;
      this rule fixes the amount the dispute carries.
    fee_charged: >-
      The fee a visit owes is the program's mobile_service_fee for the visit, and the amount in dispute is the fee charged
      less that fee owed, never below 0.00, rounded half up to the cent.
    visit_date: >-
      The vehicles served on a visit are counted as the invoices dated the visit day from the store that sent the crew,
