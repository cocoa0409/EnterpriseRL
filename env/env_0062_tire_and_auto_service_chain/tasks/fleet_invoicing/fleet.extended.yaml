- id: fleet_ext_month_end_late_charge
  base_policy_refs:
  - fleet_evt_late_charge
  overwrite:
  - base_policy: fleet_evt_late_charge
    superseded_clause: >-
      At each month-end the past-due balance (fleet_msr_past_due_balance as of the last day of the month, late_charge_basis)
      is charged late_charge_monthly_pct percent, rounded half up to the cent, and never less than late_charge_min when
      any past-due balance exists.
    replaced_by: >-
      The late charge for a statement month is assessed on the last day of that month, and every date test in this rule
      counts from the day the charge is assessed: the past-due balance is every invoice whose due date is before that day,
      leaving out an invoice whose due date is 240 whole months or more before it, plus every late charge already assessed,
      less every remittance, early-pay discount and credit memo applied to the account, and less the amounts under open
      dispute, never below 0.00; the charge is the late-charge rate in percent of the balance the rate applies to, rounded
      half up to the cent, and never less than late_charge_min when any past-due balance exists
  trigger: state_due
  subject:
  - fleet_late_charge
  computes: amount
  target_tool: assess_fleet_late_charge_341e13fe
  params:
    tier_breakpoint: 1000.0
    small_balance_allowance: 250.0
    seasoned_months: 60
    late_charges_seasoned_max: 1
    low_utilization_share: 0.25
    high_utilization_share: 0.75
    low_utilization_adjust: 0.25
    high_utilization_adjust: 0.25
    relief_high: 2500.0
    relief_mid: 1000.0
    relief_high_adjust: 0.25
    relief_mid_adjust: 0.1
    volume_high_total: 50000.0
    volume_mid_total: 25000.0
    volume_high_adjust: 0.2
    volume_mid_adjust: 0.1
    remittances_high: 24
    remittances_mid: 12
    remittance_record_high_adjust: 0.1
    remittance_record_mid_adjust: 0.05
    due_lookback_months: 240
  rule: >-
    The late charge for a statement month is assessed on the last day of that month, and every date test in this rule counts
    from the day the charge is assessed: the past-due balance is every invoice whose due date is before that day, leaving
    out an invoice whose due date is 240 whole months or more before it, plus every late charge already assessed, less every
    remittance, early-pay discount and credit memo applied to the account, and less the amounts under open dispute, never
    below 0.00; the charge is the late-charge rate in percent of the balance the rate applies to, rounded half up to the
    cent, and never less than late_charge_min when any past-due balance exists. The balance the rate applies to is the whole
    past-due balance, and the late-charge rate is the program's late_charge_monthly_pct. The late charge of a statement
    month is not assessed until the account's most recent tire invoice posted with no fleet discount, when it is past due
    on the day the charge is assessed on an account invoiced without sales tax, carries a pricing correction credit memo.
    Before the late charge of a statement month is fixed, the account's most recent brake invoice posted with no fleet discount,
    when it is past due on the day the charge is assessed on an account invoiced without sales tax, must carry its own pricing
    correction credit memo as well. The late charge of a statement month is fixed only after the mobile service visit fee
    the business contests stands under an open dispute registered on that fee invoice. A program whose late_charge_monthly_pct
    is 0 charges nothing, whatever is added to the late-charge rate, and this prevails over late_charge_min. A credit utilization
    adjustment is added to the late-charge rate: minus 0.25 when the account's balance (all invoices and late charges less
    all remittances, early-pay discounts and credit memos) is no more than a quarter of its credit limit, plus 0.25 when
    it is more than three quarters of the limit, and nothing otherwise. A closing-month remittance adjustment is added to
    the late-charge rate: minus 0.25 when the remittances received less than one whole month before the day the charge is
    assessed total 2,500.00 or more, minus 0.10 when they total 1,000.00 to 2,499.99, and nothing when they total less.
    An invoiced volume adjustment is added to the late-charge rate: minus 0.20 when the invoices posted less than twelve
    whole months before the day the charge is assessed total 50,000.00 or more, minus 0.10 when they total 25,000.00 to
    49,999.99, and nothing when they total less. A remittance record adjustment is added to the late-charge rate: minus
    0.10 when 24 or more remittance entries were applied to the account less than twelve whole months before the day the
    charge is assessed, minus 0.05 when 12 to 23 were, and nothing when fewer were. How the rate meets the balance depends
    on the account's seasoning: for an account approved 60 or more whole months before the day the charge is assessed with
    at most one late charge assessed less than twelve whole months before that day, the balance the rate applies to is the
    first 1,000.00 of the past-due balance plus half of the part above 1,000.00; for an account approved fewer than 60 whole
    months before that day with no late charge assessed less than twelve whole months before it, it is the past-due balance
    less a 250.00 small-balance allowance, never below 0.00; and for every other account it is the whole past-due balance.
    Only one late charge is assessed for each statement month, and none on a Public Sector account.
  prerequisite:
  - problem: fleet_ext_tire_discount_restore
    kind: value_input
    gate: credit_memo_total
    form: state
    policy_source: >-
      The late charge of a statement month is not assessed until the account's most recent tire invoice posted with no fleet
      discount, when it is past due on the day the charge is assessed on an account invoiced without sales tax, carries
      a pricing correction credit memo.
    condition: >-
      On a tax-exempt account, the latest fleet_invoice_posted row with service_category tires and discount_amount 0.00,
      when its due_date is before the day the charge is assessed, has a fleet_credit_memo row with credit_reason pricing_correction
      whose source_fleet_txn_id is that invoice.
    resolved_by: credit_fleet_tire_discount_840e1cf3
    effect: >-
      The pricing correction on the tire invoice adds its amount to credit_memo_total, lowering the past-due balance and
      the late charge with it.
  - problem: fleet_ext_brake_discount_restore
    kind: value_input
    gate: credit_memo_total
    form: state
    policy_source: >-
      Before the late charge of a statement month is fixed, the account's most recent brake invoice posted with no fleet
      discount, when it is past due on the day the charge is assessed on an account invoiced without sales tax, must carry
      its own pricing correction credit memo as well.
    condition: >-
      On a tax-exempt account, the latest fleet_invoice_posted row with service_category brakes and discount_amount 0.00,
