      whose source_fleet_txn_id is that invoice.
    resolved_by: credit_fleet_brake_discount_3a9816af
    effect: >-
      The pricing correction on the brake invoice adds its amount to credit_memo_total, lowering the past-due balance and
      the late charge with it.
  - problem: fleet_ext_trip_fee_dispute
    kind: value_input
    gate: open_disputed
    form: state
    policy_source: >-
      The late charge of a statement month is fixed only after the mobile service visit fee the business contests stands
      under an open dispute registered on that fee invoice.
    condition: >-
      fleet_invoice_disputes carries an open row whose fleet_txn_id is the mobile_service_call invoice the business contests.
    resolved_by: file_fleet_trip_fee_dispute_f6605125
    effect: >-
      The disputed amount enters open_disputed and is set aside from the past-due balance, lowering the late charge.
  cross_category: []
  compute:
  - due_total: >-
      SUM('fleet_transactions','amount', within_months=K('due_lookback_months'), date_field='due_date', event_type='fleet_invoice_posted')
      - SUM('fleet_transactions','amount', event_type='fleet_invoice_posted', due_date=NOW)
  - late_total: SUM('fleet_transactions','amount', event_type='fleet_late_charge')
  - payments_total: SUM('fleet_transactions','amount', event_type='fleet_payment_received')
  - discounts_total: SUM('fleet_transactions','amount', event_type='fleet_early_pay_discount')
  - credit_memo_total: SUM('fleet_transactions','amount', event_type='fleet_credit_memo')
  - open_disputed: SUM('fleet_invoice_disputes','disputed_amount', dispute_status='open')
  - past_due_basis: MX(0, due_total + late_total - payments_total - discounts_total - credit_memo_total - open_disputed)
  - account_balance: >-
      SUM('fleet_transactions','amount', event_type='fleet_invoice_posted') + late_total - payments_total - discounts_total
      - credit_memo_total
  - utilization_adjust: >-
      (0 - K('low_utilization_adjust')) if account_balance <= K('low_utilization_share') * F('credit_limit') else (K('high_utilization_adjust')
      if account_balance > K('high_utilization_share') * F('credit_limit') else 0)
  - closing_month_remittances: >-
      SUM('fleet_transactions','amount', within_months=1, date_field='txn_date', event_type='fleet_payment_received')
  - remittance_adjust: >-
      (0 - K('relief_high_adjust')) if closing_month_remittances >= K('relief_high') else ((0 - K('relief_mid_adjust'))
      if closing_month_remittances >= K('relief_mid') else 0)
  - invoiced_12m_total: >-
      SUM('fleet_transactions','amount', within_months=12, date_field='txn_date', event_type='fleet_invoice_posted')
  - volume_adjust: >-
      (0 - K('volume_high_adjust')) if invoiced_12m_total >= K('volume_high_total') else ((0 - K('volume_mid_adjust')) if
      invoiced_12m_total >= K('volume_mid_total') else 0)
  - remittance_entries_12m: >-
      COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_payment_received')
  - remittance_record_adjust: >-
      (0 - K('remittance_record_high_adjust')) if remittance_entries_12m >= K('remittances_high') else ((0 - K('remittance_record_mid_adjust'))
      if remittance_entries_12m >= K('remittances_mid') else 0)
  - late_rate: >-
      0 if P('late_charge_monthly_pct') == 0 else P('late_charge_monthly_pct') + utilization_adjust + remittance_adjust
      + volume_adjust + remittance_record_adjust
  - months_since_approval: MONTHS(F('approval_date'), NOW)
  - late_charges_12m_prior: COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_late_charge')
  - rated_balance: >-
      (MN(past_due_basis, K('tier_breakpoint')) + MX(0, past_due_basis - K('tier_breakpoint')) / 2) if (months_since_approval
      >= K('seasoned_months') and late_charges_12m_prior <= K('late_charges_seasoned_max')) else (MX(0, past_due_basis -
      K('small_balance_allowance')) if (months_since_approval < K('seasoned_months') and late_charges_12m_prior == 0) else
      past_due_basis)
  - result: >-
      RND(MX(rated_balance * late_rate / 100, P('late_charge_min')), 2) if (past_due_basis > 0 and late_rate > 0) else 0
  compute_basis:
    due_total: >-
      every invoice whose due date is before that day, leaving out an invoice whose due date is 240 whole months or more
      before it
    late_total: plus every late charge already assessed
    payments_total: less every remittance, early-pay discount and credit memo applied to the account
    discounts_total: less every remittance, early-pay discount and credit memo applied to the account
    credit_memo_total: less every remittance, early-pay discount and credit memo applied to the account
    open_disputed: and less the amounts under open dispute, never below 0.00
    past_due_basis: >-
      The late charge for a statement month is assessed on the last day of that month, and every date test in this rule
      counts from the day the charge is assessed: the past-due balance is every invoice whose due date is before that day,
      leaving out an invoice whose due date is 240 whole months or more before it, plus every late charge already assessed,
      less every remittance, early-pay discount and credit memo applied to the account, and less the amounts under open
      dispute, never below 0.00; the charge is the late-charge rate in percent of the balance the rate applies to, rounded
      half up to the cent, and never less than late_charge_min when any past-due balance exists
    account_balance: >-
      the account's balance (all invoices and late charges less all remittances, early-pay discounts and credit memos)
    utilization_adjust: >-
      A credit utilization adjustment is added to the late-charge rate: minus 0.25 when the account's balance (all invoices
      and late charges less all remittances, early-pay discounts and credit memos) is no more than a quarter of its credit
      limit, plus 0.25 when it is more than three quarters of the limit, and nothing otherwise.
    closing_month_remittances: >-
      A closing-month remittance adjustment is added to the late-charge rate: minus 0.25 when the remittances received less
      than one whole month before the day the charge is assessed total 2,500.00 or more, minus 0.10 when they total 1,000.00
      to 2,499.99, and nothing when they total less.
    remittance_adjust: >-
      A closing-month remittance adjustment is added to the late-charge rate: minus 0.25 when the remittances received less
      than one whole month before the day the charge is assessed total 2,500.00 or more, minus 0.10 when they total 1,000.00
      to 2,499.99, and nothing when they total less.
    invoiced_12m_total: >-
      An invoiced volume adjustment is added to the late-charge rate: minus 0.20 when the invoices posted less than twelve
      whole months before the day the charge is assessed total 50,000.00 or more, minus 0.10 when they total 25,000.00 to
      49,999.99, and nothing when they total less.
    volume_adjust: >-
      An invoiced volume adjustment is added to the late-charge rate: minus 0.20 when the invoices posted less than twelve
      whole months before the day the charge is assessed total 50,000.00 or more, minus 0.10 when they total 25,000.00 to
      49,999.99, and nothing when they total less.
    remittance_entries_12m: >-
      A remittance record adjustment is added to the late-charge rate: minus 0.10 when 24 or more remittance entries were
      applied to the account less than twelve whole months before the day the charge is assessed, minus 0.05 when 12 to
      23 were, and nothing when fewer were.
    remittance_record_adjust: >-
      A remittance record adjustment is added to the late-charge rate: minus 0.10 when 24 or more remittance entries were
      applied to the account less than twelve whole months before the day the charge is assessed, minus 0.05 when 12 to
      23 were, and nothing when fewer were.
    late_rate: >-
      A program whose late_charge_monthly_pct is 0 charges nothing, whatever is added to the late-charge rate, and this
      prevails over late_charge_min.
    months_since_approval: >-
      How the rate meets the balance depends on the account's seasoning: for an account approved 60 or more whole months
      before the day the charge is assessed with at most one late charge assessed less than twelve whole months before that
      day, the balance the rate applies to is the first 1,000.00 of the past-due balance plus half of the part above 1,000.00;
      for an account approved fewer than 60 whole months before that day with no late charge assessed less than twelve whole
      months before it, it is the past-due balance less a 250.00 small-balance allowance, never below 0.00; and for every
      other account it is the whole past-due balance.
    late_charges_12m_prior: >-
      How the rate meets the balance depends on the account's seasoning: for an account approved 60 or more whole months
      before the day the charge is assessed with at most one late charge assessed less than twelve whole months before that
      day, the balance the rate applies to is the first 1,000.00 of the past-due balance plus half of the part above 1,000.00;
      for an account approved fewer than 60 whole months before that day with no late charge assessed less than twelve whole
      months before it, it is the past-due balance less a 250.00 small-balance allowance, never below 0.00; and for every
      other account it is the whole past-due balance.
    rated_balance: >-
      How the rate meets the balance depends on the account's seasoning: for an account approved 60 or more whole months
      before the day the charge is assessed with at most one late charge assessed less than twelve whole months before that
      day, the balance the rate applies to is the first 1,000.00 of the past-due balance plus half of the part above 1,000.00;
      for an account approved fewer than 60 whole months before that day with no late charge assessed less than twelve whole
      months before it, it is the past-due balance less a 250.00 small-balance allowance, never below 0.00; and for every
      other account it is the whole past-due balance.
    result: >-
      A program whose late_charge_monthly_pct is 0 charges nothing, whatever is added to the late-charge rate, and this
      prevails over late_charge_min.
  factors:
  - id: seasoned_account_tiering
    effect: method
    decides: rated_balance
    bindings:
    - months_since_approval
    - late_charges_12m_prior
    - rated_balance
    ladder:
    - when: >-
        the account was approved 60 or more whole months before the day the charge is assessed and at most one late charge
        was assessed less than twelve whole months before that day
      method: >-
        the balance the rate applies to is the first 1,000.00 of the past-due balance plus half of the part above 1,000.00
    - when: >-
        the account was approved fewer than 60 whole months before the day the charge is assessed and no late charge was
        assessed less than twelve whole months before that day
      method: >-
        the balance the rate applies to is the past-due balance less a 250.00 small-balance allowance, never below 0.00
    - when: otherwise
      method: the balance the rate applies to is the whole past-due balance
    baseline:
      rated_balance: past_due_basis
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: utilization_rate_adjust
    effect: parameter
    decides: utilization_adjust
    bindings:
    - account_balance
    - utilization_adjust
    ladder:
    - when: the account's balance is no more than a quarter of its credit limit
      value: 0 - K('low_utilization_adjust')
    - when: the balance is more than three quarters of the limit
      value: K('high_utilization_adjust')
    - when: otherwise
      value: '0'
    baseline:
      utilization_adjust: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: closing_remittance_relief
    effect: parameter
    decides: remittance_adjust
    bindings:
    - closing_month_remittances
    - remittance_adjust
    ladder:
    - when: >-
        remittances received less than one whole month before the day the charge is assessed total 2,500.00 or more
      value: 0 - K('relief_high_adjust')
    - when: they total 1,000.00 to 2,499.99
      value: 0 - K('relief_mid_adjust')
    - when: otherwise
      value: '0'
    baseline:
      remittance_adjust: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: invoiced_volume_rate_adjust
    effect: parameter
    decides: volume_adjust
    bindings:
    - invoiced_12m_total
    - volume_adjust
    ladder:
    - when: >-
        invoices posted less than twelve whole months before the day the charge is assessed total 50,000.00 or more
      value: 0 - K('volume_high_adjust')
    - when: they total 25,000.00 to 49,999.99
      value: 0 - K('volume_mid_adjust')
    - when: otherwise
      value: '0'
    baseline:
      volume_adjust: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: remittance_record_rate_adjust
