      its removals, 2.50 when it shows 30 to 49 more, and nothing when it shows fewer.
    fee_owed: >-
      The fee owed is never below 0.00, the floor being applied once after every addition and credit, and the amount in
      dispute is the fee charged less the fee owed, never below 0.00, rounded half up to the cent once at the end.
    result: >-
      The fee owed is never below 0.00, the floor being applied once after every addition and credit, and the amount in
      dispute is the fee charged less the fee owed, never below 0.00, rounded half up to the cent once at the end.
    visit_tire_invoices: >-
      A tire work credit is taken off the fee owed: 10.00 when four or more tire invoices are dated the visit day from the
      store that sent the crew, 5.00 when two or three are, and nothing when fewer are.
    tire_work_credit: >-
      A tire work credit is taken off the fee owed: 10.00 when four or more tire invoices are dated the visit day from the
      store that sent the crew, 5.00 when two or three are, and nothing when fewer are.
  factors:
  - id: visit_size_schedule
    effect: method
    decides: schedule_part
    bindings:
    - vehicles_served
    - schedule_part
    ladder:
    - when: the visit served at least twice the program's minimum number of vehicles
      method: the fee owed starts from nothing
    - when: the visit served more than the minimum but fewer than twice the minimum
      method: >-
        the fee owed starts from the program's visit fee less 12.00 for each vehicle beyond the minimum, never below 0.00
    - when: otherwise
      method: the fee owed starts from the program's visit fee
    baseline:
      schedule_part: program_fee
    evidence:
