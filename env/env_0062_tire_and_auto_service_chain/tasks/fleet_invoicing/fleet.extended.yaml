    cross_difficulty: tires
  - id: repeat_billing_error_credit
    effect: parameter
    decides: repeat_error_credit
    bindings:
    - prior_corrections
    - repeat_error_credit
    ladder:
    - when: >-
        two or more pricing correction credit memos booked before today and less than twelve whole months before today
