# ---- data flow ----
events:
  - type: fleet_application
    target: fleet_accounts
    mutation: create
    meaning: A business or public agency submits a fleet credit application.
    grain: one row per application
    fields:
      customer_id: business customer profile
      store_id: home store
      variant_name: program applied for, by roster size and entity type
      business_legal_name: legal name
      application_date: date received
      billing_cycle: cycle requested
      tax_exempt: whether an exemption certificate was provided
      po_required_all: whether the business wants a PO on every ticket
    triggers: []

  - type: fleet_approval
    target: fleet_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: Crestline Fleet Credit approves the account and sets its terms.
    grain: one row per transaction
    fields:
      approval_date: approval date
      credit_limit: limit approved
      ticket_approval_limit: program default ticket approval limit
    triggers: []

  - type: fleet_decline
    target: fleet_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: Crestline Fleet Credit declines the application.
    grain: one row per transaction
    fields:
      closed_date: decision date
    triggers: []

  - type: fleet_vehicle_enrolled
    target: fleet_roster_events
    meaning: A vehicle of the business is added to the account's roster so drivers can charge work on it.
    grain: one row per vehicle per enrollment date
    distinguish_by: [vehicle_id, event_date]
    fields:
      vehicle_id: vehicle added
      event_date: effective date
      unit_number: fleet unit number
    triggers: []

  - type: fleet_vehicle_removed
    target: fleet_roster_events
    meaning: A vehicle is taken off the account's roster (sold, retired or moved to another account).
    grain: one row per vehicle per removal date
    distinguish_by: [vehicle_id, event_date]
    fields:
      vehicle_id: vehicle removed
      event_date: effective date
      unit_number: fleet unit number
    triggers: []

  - type: fleet_invoice_posted
    target: fleet_transactions
    meaning: A ticket for work on a rostered vehicle is charged to the account as a fleet invoice.
    grain: one row per invoice
    distinguish_by: [invoice_number]
    fields:
      txn_date: invoice date
      invoice_number: invoice number
      po_number: purchase order given
      vehicle_id: vehicle serviced
      store_id: servicing store
      service_category: category of work
      amount: invoice total after discount
      discount_amount: fleet discount taken
      due_date: due date
    account: fleet_receivable
    direction: in
    triggers: []

  - type: fleet_payment_received
    target: fleet_transactions
    meaning: A remittance from the business is applied to an invoice.
    grain: one row per remittance per invoice it is applied to
    distinguish_by: [payment_reference, source_fleet_txn_id]
    fields:
      txn_date: date applied
      amount: amount applied to the invoice
      payment_reference: check, ACH or wire reference
      source_fleet_txn_id: invoice paid
    account: fleet_receivable
    direction: out
    triggers: []

  - type: fleet_early_pay_discount
    target: fleet_transactions
    meaning: The early-pay discount is credited on an invoice paid in full within the discount period.
    grain: one row per invoice
    distinguish_by: [source_fleet_txn_id]
    fields:
      txn_date: date credited
      amount: discount credited
      source_fleet_txn_id: invoice discounted
    account: fleet_receivable
    direction: out
    triggers: []

  - type: fleet_late_charge
    target: fleet_transactions
    meaning: A late charge is assessed at month-end on the past-due balance.
    grain: one row per month-end statement
    distinguish_by: [statement_month]
    fields:
      txn_date: month-end date
      amount: late charge
      statement_month: month assessed
    account: fleet_receivable
    direction: in
    triggers: []

  - type: fleet_credit_memo
    target: fleet_transactions
    meaning: A credit memo reduces what is owed on an invoice, for a return, a pricing correction, a resolved dispute or a duplicate invoice.
    grain: one row per invoice per credit reason
    distinguish_by: [source_fleet_txn_id, credit_reason]
    fields:
      txn_date: date issued
      amount: credit amount
      source_fleet_txn_id: invoice credited
      credit_reason: reason for the credit
    account: fleet_receivable
    direction: out
    triggers: []

  - type: fleet_terms_change
    target: fleet_accounts
    mutation: update
    meaning: Account terms change at a credit review or at the fleet manager's request.
    grain: one row per transaction
    fields:
      credit_limit: new limit
      ticket_approval_limit: new ticket approval limit
      billing_cycle: new billing cycle
      po_required_all: new PO requirement
    triggers: []

  - type: fleet_credit_hold
    target: fleet_accounts
    mutation: {transition: {from: active, to: credit_hold}}
    meaning: The account goes on credit hold.
    grain: one row per transaction
    fields: {status: credit_hold}
    triggers: []

  - type: fleet_hold_release
    target: fleet_accounts
    mutation: {transition: {from: credit_hold, to: active}}
    meaning: The credit hold is released.
    grain: one row per transaction
    fields: {status: active}
    triggers: []

  - type: fleet_closure
    target: fleet_accounts
    mutation: {transition: {from: active, to: closed}}
    meaning: The business's authorized contact confirms closure of the account.
    grain: one row per transaction
    fields:
      closed_date: closure date
    triggers: []

  - type: fleet_collections_closure
    target: fleet_accounts
    mutation: {transition: {from: credit_hold, to: closed}}
    meaning: A held account is closed and referred to collections.
    grain: one row per transaction
    fields:
      closed_date: closure date
    triggers: []

measures:
  - id: fleet_msr_roster_vehicles
    window: roster state on the date of the event
    measure: count of vehicles whose latest fleet_roster_events row on the account (dated on or before the date) is fleet_vehicle_enrolled
  - id: fleet_msr_vehicle_on_other_roster
    window: roster state on the date of the event, across all fleet accounts
    measure: true when the vehicle's latest roster row on any other fleet account is fleet_vehicle_enrolled
  - id: fleet_msr_invoice_open
    window: one invoice, from its txn_date to the present
    measure: amount of the invoice minus the sum of amount of fleet_payment_received, fleet_early_pay_discount and fleet_credit_memo rows whose source_fleet_txn_id is that invoice
  - id: fleet_msr_past_due_balance
    window: as of a given date
    measure: sum of fleet_msr_invoice_open over invoices whose due_date is before that date, plus unpaid late charges
  - id: fleet_msr_days_past_due
    window: as of the present
    measure: calendar days since the due_date of the oldest invoice with fleet_msr_invoice_open above 0.00; 0 when none is past due
  - id: fleet_msr_combined_credit_limit
    window: portfolio state on the date of the event
    measure: sum of credit_limit over the business customer's fleet accounts in status applied, active or credit_hold
  - id: fleet_msr_open_accounts
    window: portfolio state on the date of the event
    measure: count of the business customer's fleet accounts in status applied, active or credit_hold

# ---- policies ----
policies:
  - id: fleet_agg_multi_holding
    subject: [fleet_application]
    rule: >-
      A business may hold more than one fleet account, typically one per division or branch, each with its own roster,
      terms and invoices. The number of open accounts (fleet_msr_open_accounts, counting the new application) may not
      exceed accounts_per_business_max of the program applied for. How the accounts are combined is governed by
      fleet_agg_combined_limit and fleet_agg_single_roster; nothing else is pooled, so discounts, PO thresholds and late
      charges are always those of the account the invoice is on.
    eligibility: []
    params: {max_per_customer: null}
    measures: [fleet_msr_open_accounts]

  - id: fleet_agg_combined_limit
    subject: [fleet_application, fleet_approval, fleet_terms_change]
    rule: >-
      Credit exposure is aggregated across all of a business's fleet accounts. fleet_msr_combined_credit_limit,
      including the limit being approved or raised, may not exceed combined_credit_limit_max of the highest-ranked
      program the business holds. When an approval or increase would pass that figure, the new limit is reduced to fit,
      and when even credit_limit_min of the program would not fit, the application is declined. A closed or declined
      account's limit is not counted.
    eligibility: []
    measures: [fleet_msr_combined_credit_limit]

  - id: fleet_agg_single_roster
    subject: [fleet_vehicle_enrolled]
    rule: >-
      A vehicle can be charged to only one fleet account at a time. A vehicle may be enrolled only when it is not on
      another fleet account's roster. To move a unit between two accounts of the same business, it is first removed
      from the old roster and then enrolled on the new one, with its unit number. Only vehicles recorded to the business
      customer on the vehicle record may be enrolled; an employee's personal vehicle is never put on a roster.
    eligibility:
      - id: not_on_other_roster
        applies_to: [fleet_vehicle_enrolled]
        kind: dedup
        condition: A vehicle may be enrolled only when it is not on another fleet account's roster.
        evidence_fields: [fleet_roster_events.vehicle_id, fleet_roster_events.event_type, fleet_roster_events.fleet_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_roster_events.vehicle_id]]
          action_bindings: {fleet_roster_events.vehicle_id: vehicle_id}
        dedup_contract:
          table: fleet_roster_events
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {event_type: [fleet_vehicle_enrolled]}
          distinct_fields: [event_date]
    measures: [fleet_msr_vehicle_on_other_roster]

  - id: fleet_application_approval
    subject: [fleet_application, fleet_approval, fleet_decline]
    rule: >-
      The program applied for is set by the roster the business intends to enroll and by its entity type: the roster
      size must fall between roster_vehicles_min and roster_vehicles_max, and only a government or public agency may hold
      the Public Sector program. The application carries application_documents, and a personal guarantee when
      personal_guarantee_required is true. Crestline Fleet Credit, not customer care, decides the application; on
      approval it sets a credit_limit between credit_limit_min and credit_limit_max, ticket_approval_limit equal to
      ticket_approval_limit_default, and a billing_cycle from billing_cycle_options. tax_exempt is true only when a valid
      exemption certificate is on file (tax_exemption_certificate_required).
    eligibility: []

  - id: fleet_evt_roster
    subject: [fleet_vehicle_enrolled, fleet_vehicle_removed]
    rule: >-
      The fleet manager keeps the roster current. The account must be in status active when a vehicle is enrolled.
      Removals are accepted in any status. Changes take effect on the date given (roster_change_effective). A roster that
      grows above roster_vehicles_max or falls below roster_vehicles_min does not change the program immediately; the
      program is reviewed at the next credit review (program_review_on_roster_change). Removing a vehicle does not
      cancel open invoices for work already done on it.
    eligibility:
      - id: account_active_enroll
        applies_to: [fleet_vehicle_enrolled]
        kind: state
        condition: The account must be in status active when a vehicle is enrolled.
        evidence_fields: [fleet_accounts.status, fleet_accounts.fleet_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_accounts.fleet_account_id]]
          action_bindings: {fleet_accounts.fleet_account_id: fleet_account_id}
        state_contract:
          field: fleet_accounts.status
          allowed: [active]
    measures: [fleet_msr_roster_vehicles]

  - id: fleet_evt_invoice
    subject: [fleet_invoice_posted]
    rule: >-
      Work charged to a fleet account becomes one invoice per ticket and service category, so a ticket with tires and an
      alignment produces two invoices with their own invoice numbers; a road hazard certificate sold with tires is part of
      the tires invoice. The account must be in status active when a ticket
      is charged to it. The vehicle must be on the account's roster on the invoice date. The discount_amount is
      category_discount_pct for the invoice's service_category, applied to the ticket's pre-tax price excluding
      discount_excluded_items, rounded half up to the cent; where national_price_file is true, tire prices are taken
      from the national fleet price file before the discount. amount is the ticket after the discount, plus the
      excluded items, plus sales tax unless tax_exempt is true. A purchase order number is required when po_required_all
      is true or when the amount before tax is at or above po_required_threshold; a ticket that needs a PO and has none
      cannot be charged. A ticket above the account's ticket_approval_limit needs the fleet manager's approval before
      work starts. The ticket cannot be charged when it would take outstanding_balance above credit_limit plus
      over_limit_tolerance_pct percent of it. due_date is txn_date plus net_terms_days under per_invoice billing, or the
      month-end statement date plus net_terms_days under monthly_statement billing. A mobile service visit adds one
      mobile_service_call invoice of mobile_service_fee when that fee is above 0.00.
    eligibility:
      - id: account_active_invoice
        applies_to: [fleet_invoice_posted]
        kind: state
        condition: The account must be in status active when a ticket is charged to it.
        evidence_fields: [fleet_accounts.status, fleet_accounts.fleet_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_accounts.fleet_account_id]]
          action_bindings: {fleet_accounts.fleet_account_id: fleet_account_id}
        state_contract:
          field: fleet_accounts.status
          allowed: [active]
      - id: vehicle_on_roster
        applies_to: [fleet_invoice_posted]
        kind: authorization
        condition: The vehicle must be on the account's roster on the invoice date.
        evidence_fields: [fleet_roster_events.vehicle_id, fleet_roster_events.fleet_account_id, fleet_roster_events.event_type, fleet_roster_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_roster_events.fleet_account_id, fleet_roster_events.vehicle_id]]
          action_bindings: {fleet_roster_events.fleet_account_id: fleet_account_id, fleet_roster_events.vehicle_id: vehicle_id}
    params:
      per_tier:
        Crestline Fleet Starter: {discounts: "=category_discount_pct", po_threshold: "=po_required_threshold", terms: "=net_terms_days"}
        Crestline Fleet Business: {discounts: "=category_discount_pct", po_threshold: "=po_required_threshold", terms: "=net_terms_days"}
        Crestline Fleet Commercial: {discounts: "=category_discount_pct", po_threshold: "=po_required_threshold", terms: "=net_terms_days"}
        Crestline Fleet National: {discounts: "=category_discount_pct", po_threshold: "=po_required_threshold", terms: "=net_terms_days"}
        Crestline Fleet Enterprise: {discounts: "=category_discount_pct", po_threshold: "=po_required_threshold", terms: "=net_terms_days"}
        Crestline Fleet Public Sector: {discounts: "=category_discount_pct", po_threshold: "=po_required_threshold", terms: "=net_terms_days"}

  - id: fleet_evt_payment
    subject: [fleet_payment_received, fleet_early_pay_discount]
    rule: >-
      A remittance is applied to the invoices it names; when remittance_advice_required is true a remittance that names
      no invoice is held unapplied until the business identifies the invoices, and otherwise it is applied under
      payment_application_order, oldest invoice first. Each part applied to one invoice is its own row and never exceeds
      fleet_msr_invoice_open for that invoice; a short payment leaves the difference open on the invoice
      (short_pay_handling). The early-pay discount is credited on an invoice only when the remittance pays it in full. The
      payment must be received no later than the end of the early-pay period counted from the invoice date of the invoice
      paid. Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is
      the last qualifying date. The discount is early_pay_discount_pct percent of the invoice amount, rounded half up to
      the cent; a program whose early_pay_discount_pct is 0 gives none, and a full payment that already deducted the
      discount is applied as payment plus the discount row. Credit memos already on the invoice reduce what must be paid
      in full but not the discount base.
    eligibility:
      - id: within_early_pay_period
        applies_to: [fleet_early_pay_discount]
        kind: time
        condition: The payment must be received no later than the end of the early-pay period counted from the invoice date of the invoice paid.
        evidence_fields: [fleet_transactions.txn_date, fleet_transactions.fleet_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_transactions.fleet_txn_id]]
          action_bindings: {fleet_transactions.fleet_txn_id: source_fleet_txn_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date of the invoice paid
          anchor_source: fleet_transactions.txn_date
          relation: not_after
          duration_source: variants.early_pay_discount_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    formula:
      early_pay_discount: "round(amount * early_pay_discount_pct / 100, 2)"
    measures: [fleet_msr_invoice_open]

  - id: fleet_evt_late_charge
    subject: [fleet_late_charge]
    rule: >-
      At each month-end the past-due balance (fleet_msr_past_due_balance as of the last day of the month, late_charge_basis)
      is charged late_charge_monthly_pct percent, rounded half up to the cent, and never less than late_charge_min when
      any past-due balance exists. Only one late charge may be assessed for each statement month. No late charge is
      assessed when nothing is past due, on a program whose late_charge_monthly_pct is 0, or on an amount under an open
      invoice dispute. A Public Sector account is never charged late charges (government_prompt_pay); questions about an
      agency's own prompt-payment interest are not decided by this charter.
    eligibility:
      - id: one_charge_per_month
        applies_to: [fleet_late_charge]
        kind: dedup
        condition: Only one late charge may be assessed for each statement month.
        evidence_fields: [fleet_transactions.fleet_account_id, fleet_transactions.statement_month, fleet_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_transactions.fleet_account_id, fleet_transactions.statement_month]]
          action_bindings: {fleet_transactions.fleet_account_id: fleet_account_id, fleet_transactions.statement_month: statement_month}
        dedup_contract:
          table: fleet_transactions
          mode: separate_record
          object_bindings: {fleet_account_id: fleet_account_id, statement_month: statement_month}
          duplicate_filters: {event_type: [fleet_late_charge]}
          distinct_fields: [txn_date]
    formula:
      amount: "max(round(fleet_msr_past_due_balance * late_charge_monthly_pct / 100, 2), late_charge_min) if fleet_msr_past_due_balance > 0 and late_charge_monthly_pct > 0 else 0"
    measures: [fleet_msr_past_due_balance]

  - id: fleet_evt_credit_memo
    subject: [fleet_credit_memo]
    rule: >-
      A credit memo corrects one invoice. An invoice dispute must be raised no later than the end of the dispute window
      counted from the invoice date of the disputed invoice. Calendar days are counted from the day after the anchor
      date, so the anchor date plus the number of days is the last qualifying date. The window is dispute_window_days and
      applies to pricing_correction and dispute_resolution credits; a return credit (from a refunded ticket) and a
      duplicate_invoice credit are not limited by it. A pricing_correction restores the category_discount_pct the
      invoice should have received; a duplicate_invoice credit is the full amount of the second of two invoices matching
      on duplicate_invoice_check; a dispute_resolution credit is the disputed amount the business is found to be owed.
      The credit never exceeds fleet_msr_invoice_open plus the payments already applied to the invoice. Customer care may
      issue a credit up to credit_memo_desk_limit per invoice; a larger credit is decided by Crestline Fleet Credit.
    eligibility:
      - id: within_dispute_window
        applies_to: [fleet_credit_memo]
        kind: time
        condition: An invoice dispute must be raised no later than the end of the dispute window counted from the invoice date of the disputed invoice.
        evidence_fields: [fleet_transactions.txn_date, fleet_transactions.fleet_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_transactions.fleet_txn_id]]
          action_bindings: {fleet_transactions.fleet_txn_id: source_fleet_txn_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the invoice date of the disputed invoice
          anchor_source: fleet_transactions.txn_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [fleet_msr_invoice_open]

  - id: fleet_evt_account_status
    subject: [fleet_credit_hold, fleet_hold_release, fleet_closure, fleet_collections_closure]
    rule: >-
      Credit status follows the payment record. The account goes on credit hold when fleet_msr_days_past_due reaches
      credit_hold_days_past_due, or when outstanding_balance exceeds credit_limit by more than over_limit_tolerance_pct
      percent. The hold is released when nothing is past due and the balance is within the limit. A held account is closed
      and referred to collections when fleet_msr_days_past_due reaches collections_referral_days_past_due. Closing an
      account is the business's own decision, confirmed by its authorized contact. The account must be in status active
      when the business's closure is completed. After closure no ticket is charged, the roster is closed, and the remaining
      balance stays due on account_closure_balance_terms.
    eligibility:
      - id: account_active_close
        applies_to: [fleet_closure]
        kind: state
        condition: The account must be in status active when the business's closure is completed.
        evidence_fields: [fleet_accounts.status, fleet_accounts.fleet_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[fleet_accounts.fleet_account_id]]
          action_bindings: {fleet_accounts.fleet_account_id: fleet_account_id}
        state_contract:
          field: fleet_accounts.status
          allowed: [active]
    measures: [fleet_msr_days_past_due]

  - id: fleet_evt_terms_change
    subject: [fleet_terms_change]
    rule: >-
      Terms change in two ways. At the fleet manager's request, ticket_approval_limit may be set lower than (never above)
      ticket_approval_limit_default (approval_limit_override), po_required_all may be switched, and billing_cycle may move
      to another of billing_cycle_options from the next month. At a credit review every credit_review_months, Crestline
      Fleet Credit may raise credit_limit by up to credit_limit_increase_max_pct percent, never above credit_limit_max and
      within fleet_agg_combined_limit, or lower it. Customer care never changes a credit limit itself.
    eligibility: []

  - id: fleet_commercial_use_interplay
    subject: [fleet_invoice_posted, fleet_vehicle_enrolled]
    rule: >-
      Enrolling a vehicle on a fleet roster makes it a vehicle in commercial use for the other Crestline products: tire
      treadwear coverage and road hazard protection on its tires follow their commercial-use rules for as long as the
      vehicle was on a roster during the coverage. The only road hazard plan that may be charged to a fleet account is
      road_hazard_plan_for_fleet; a consumer plan is never put on a fleet invoice. A fleet invoice is never paid with a
      personal Crestline credit card, and work on a vehicle not on the roster is never charged to the account.
    eligibility: []

# ============================================================================
# extended_policies (fleet_invoicing difficulty)
# ============================================================================
extended_policies:
- id: fleet_ext_overlimit_dispute
  base_policy_refs:
  - fleet_evt_credit_memo
  - fleet_evt_invoice
  overwrite:
  - base_policy: fleet_evt_invoice
    superseded_clause: >-
      A ticket above the account's ticket_approval_limit needs the fleet manager's approval before work starts.
    replaced_by: >-
      A ticket above the account's ticket approval limit needs the fleet manager's approval before work starts, except work
      that a driver may authorize alone in an emergency on a ticket a business disputes under this rule; every other ticket
      remains under the base rule
  trigger: on_request
  subject:
  - fleet_credit_memo
  computes: disputed_amount
  target_tool: file_fleet_overlimit_dispute_8d937b85
  params:
    safety_tire_brake: 100.0
    safety_battery: 50.0
    sunday_allowance: 75.0
    saturday_allowance: 50.0
    repeat_one: 50.0
    repeat_two: 100.0
  rule: >-
    A business that pays an invoice but holds back the part of the ticket that went above its ticket approval limit without
    the fleet manager's approval contests that part by filing a dispute of an unapproved over-limit ticket on the invoice
    its most recent remittance was applied to; this rule fixes the amount that dispute carries. A ticket above the account's
    ticket approval limit needs the fleet manager's approval before work starts, except work that a driver may authorize
    alone in an emergency on a ticket a business disputes under this rule; every other ticket remains under the base rule.
    The amount a business may place in dispute as an unapproved over-limit ticket is the invoice amount less the account's
    ticket approval limit, never below 0.00 and never more than the invoice amount, rounded half up to the cent. The ticket
    amount measured against the authorized amount depends on how the ticket was invoiced: when the vehicle has two or more
    invoices dated the same day from the same store, the ticket was split by service category and the measured amount is
    the combined amount of those invoices; when the vehicle has only that invoice that day from that store and credit memos
    already stand on it, the measured amount is the invoice amount less those credit memos; and otherwise the measured amount
    is the invoice amount. The authorized amount is the account's ticket approval limit. A safety allowance is added to
    the authorized amount, because Crestline's fleet programs let a driver authorize safety work alone when a vehicle cannot
    safely wait: 100.00 when the ticket includes tire or brake work, 50.00 when it includes battery work but no tire or
    brake work, and nothing when it includes none of these. A weekend allowance is added to the authorized amount, because
    the fleet desk that takes approval calls is closed on weekends: 75.00 for a ticket dated on a Sunday, 50.00 for a ticket
    dated on a Saturday, and nothing for a ticket dated Monday through Friday. The unapproved part is the measured amount
    less the authorized amount, never below 0.00. A repeat deductible is taken off the unapproved part: 100.00 when the
    account has two or more earlier disputes of unapproved over-limit tickets that were resolved with a credit and registered
    less than twelve whole months before today, 50.00 when it has exactly one such dispute, and nothing when it has none.
    The disputed amount is the unapproved part less what is taken off it, never below 0.00 and never more than the invoice
    amount, rounded half up to the cent once.
  prerequisite: []
  cross_category: []
  compute:
  - disp_invoice: >-
      LATEST('fleet_transactions','source_fleet_txn_id', date_field='txn_date', event_type='fleet_payment_received')
  - disp_invoice_amount: LATEST('fleet_transactions','amount', date_field='txn_date', fleet_txn_id=disp_invoice)
  - ticket_date: LATEST('fleet_transactions','txn_date', date_field='txn_date', fleet_txn_id=disp_invoice)
  - ticket_vehicle: LATEST('fleet_transactions','vehicle_id', date_field='txn_date', fleet_txn_id=disp_invoice)
  - ticket_store: LATEST('fleet_transactions','store_id', date_field='txn_date', fleet_txn_id=disp_invoice)
  - approval_limit: F('ticket_approval_limit')
  - ticket_invoice_count: >-
      COUNT('fleet_transactions', event_type='fleet_invoice_posted', vehicle_id=ticket_vehicle, txn_date=ticket_date, store_id=ticket_store)
  - ticket_combined: >-
      SUM('fleet_transactions','amount', event_type='fleet_invoice_posted', vehicle_id=ticket_vehicle, txn_date=ticket_date,
      store_id=ticket_store)
  - credits_on_invoice: SUM('fleet_transactions','amount', event_type='fleet_credit_memo', source_fleet_txn_id=disp_invoice)
  - measured_ticket: >-
      ticket_combined if ticket_invoice_count >= 2 else ((disp_invoice_amount - credits_on_invoice) if credits_on_invoice
      > 0 else disp_invoice_amount)
  - tire_brake_lines: >-
      COUNT('fleet_transactions', event_type='fleet_invoice_posted', vehicle_id=ticket_vehicle, txn_date=ticket_date, store_id=ticket_store,
      service_category='tires') + COUNT('fleet_transactions', event_type='fleet_invoice_posted', vehicle_id=ticket_vehicle,
      txn_date=ticket_date, store_id=ticket_store, service_category='brakes')
  - battery_lines: >-
      COUNT('fleet_transactions', event_type='fleet_invoice_posted', vehicle_id=ticket_vehicle, txn_date=ticket_date, store_id=ticket_store,
      service_category='battery')
  - safety_allowance: >-
      K('safety_tire_brake') if tire_brake_lines >= 1 else (K('safety_battery') if battery_lines >= 1 else 0)
  - ticket_weekday: DAYS('2026-01-03', ticket_date) % 7
  - weekend_allowance: >-
      K('sunday_allowance') if ticket_weekday == 1 else (K('saturday_allowance') if ticket_weekday == 0 else 0)
  - authorized_amount: approval_limit + safety_allowance + weekend_allowance
  - prior_unapproved_disputes: >-
      COUNT('fleet_invoice_disputes', within_months=12, date_field='created_at', dispute_reason='unauthorized_purchase',
      dispute_status='resolved_credit')
  - repeat_deductible: >-
      K('repeat_two') if prior_unapproved_disputes >= 2 else (K('repeat_one') if prior_unapproved_disputes == 1 else 0)
  - unapproved_part: MX(0, measured_ticket - authorized_amount)
  - result: RND(MN(disp_invoice_amount, MX(0, unapproved_part - repeat_deductible)), 2)
  compute_basis:
    disp_invoice: >-
      A business that pays an invoice but holds back the part of the ticket that went above its ticket approval limit without
      the fleet manager's approval contests that part by filing a dispute of an unapproved over-limit ticket on the invoice
      its most recent remittance was applied to; this rule fixes the amount that dispute carries.
    disp_invoice_amount: >-
      The amount a business may place in dispute as an unapproved over-limit ticket is the invoice amount less the account's
      ticket approval limit, never below 0.00 and never more than the invoice amount, rounded half up to the cent.
    ticket_date: when the vehicle has two or more invoices dated the same day from the same store
    ticket_vehicle: when the vehicle has two or more invoices dated the same day from the same store
    ticket_store: when the vehicle has two or more invoices dated the same day from the same store
    approval_limit: The authorized amount is the account's ticket approval limit.
    ticket_invoice_count: >-
      The ticket amount measured against the authorized amount depends on how the ticket was invoiced: when the vehicle
      has two or more invoices dated the same day from the same store, the ticket was split by service category and the
      measured amount is the combined amount of those invoices; when the vehicle has only that invoice that day from that
      store and credit memos already stand on it, the measured amount is the invoice amount less those credit memos; and
      otherwise the measured amount is the invoice amount.
    ticket_combined: >-
      The ticket amount measured against the authorized amount depends on how the ticket was invoiced: when the vehicle
      has two or more invoices dated the same day from the same store, the ticket was split by service category and the
      measured amount is the combined amount of those invoices; when the vehicle has only that invoice that day from that
      store and credit memos already stand on it, the measured amount is the invoice amount less those credit memos; and
      otherwise the measured amount is the invoice amount.
    credits_on_invoice: >-
      The ticket amount measured against the authorized amount depends on how the ticket was invoiced: when the vehicle
      has two or more invoices dated the same day from the same store, the ticket was split by service category and the
      measured amount is the combined amount of those invoices; when the vehicle has only that invoice that day from that
      store and credit memos already stand on it, the measured amount is the invoice amount less those credit memos; and
      otherwise the measured amount is the invoice amount.
    measured_ticket: >-
      The ticket amount measured against the authorized amount depends on how the ticket was invoiced: when the vehicle
      has two or more invoices dated the same day from the same store, the ticket was split by service category and the
      measured amount is the combined amount of those invoices; when the vehicle has only that invoice that day from that
      store and credit memos already stand on it, the measured amount is the invoice amount less those credit memos; and
      otherwise the measured amount is the invoice amount.
    tire_brake_lines: >-
      A safety allowance is added to the authorized amount, because Crestline's fleet programs let a driver authorize safety
      work alone when a vehicle cannot safely wait: 100.00 when the ticket includes tire or brake work, 50.00 when it includes
      battery work but no tire or brake work, and nothing when it includes none of these.
    battery_lines: >-
      A safety allowance is added to the authorized amount, because Crestline's fleet programs let a driver authorize safety
      work alone when a vehicle cannot safely wait: 100.00 when the ticket includes tire or brake work, 50.00 when it includes
      battery work but no tire or brake work, and nothing when it includes none of these.
    safety_allowance: >-
      A safety allowance is added to the authorized amount, because Crestline's fleet programs let a driver authorize safety
      work alone when a vehicle cannot safely wait: 100.00 when the ticket includes tire or brake work, 50.00 when it includes
      battery work but no tire or brake work, and nothing when it includes none of these.
    ticket_weekday: >-
      A weekend allowance is added to the authorized amount, because the fleet desk that takes approval calls is closed
      on weekends: 75.00 for a ticket dated on a Sunday, 50.00 for a ticket dated on a Saturday, and nothing for a ticket
      dated Monday through Friday.
    weekend_allowance: >-
      A weekend allowance is added to the authorized amount, because the fleet desk that takes approval calls is closed
      on weekends: 75.00 for a ticket dated on a Sunday, 50.00 for a ticket dated on a Saturday, and nothing for a ticket
      dated Monday through Friday.
    authorized_amount: The authorized amount is the account's ticket approval limit.
    prior_unapproved_disputes: >-
      A repeat deductible is taken off the unapproved part: 100.00 when the account has two or more earlier disputes of
      unapproved over-limit tickets that were resolved with a credit and registered less than twelve whole months before
      today, 50.00 when it has exactly one such dispute, and nothing when it has none.
    repeat_deductible: >-
      A repeat deductible is taken off the unapproved part: 100.00 when the account has two or more earlier disputes of
      unapproved over-limit tickets that were resolved with a credit and registered less than twelve whole months before
      today, 50.00 when it has exactly one such dispute, and nothing when it has none.
    unapproved_part: The unapproved part is the measured amount less the authorized amount, never below 0.00.
    result: >-
      The disputed amount is the unapproved part less what is taken off it, never below 0.00 and never more than the invoice
      amount, rounded half up to the cent once.
  factors:
  - id: ticket_measure
    effect: method
    decides: measured_ticket
    bindings:
    - ticket_invoice_count
    - ticket_combined
    - credits_on_invoice
    - measured_ticket
    ladder:
    - when: the vehicle has two or more invoices dated the same day from the same store
      method: the measured amount is the combined amount of those invoices
    - when: the vehicle has only that invoice that day from that store and credit memos already stand on it
      method: the measured amount is the invoice amount less those credit memos
    - when: otherwise
      method: the measured amount is the invoice amount
    baseline:
      measured_ticket: disp_invoice_amount
    evidence:
    - history
    cross_difficulty: null
  - id: safety_work_allowance
    effect: parameter
    decides: safety_allowance
    bindings:
    - tire_brake_lines
    - battery_lines
    - safety_allowance
    ladder:
    - when: the ticket includes tire or brake work
      value: K('safety_tire_brake')
    - when: the ticket includes battery work but no tire or brake work
      value: K('safety_battery')
    - when: otherwise
      value: '0'
    baseline:
      safety_allowance: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: weekend_ticket_allowance
    effect: parameter
    decides: weekend_allowance
    bindings:
    - ticket_weekday
    - weekend_allowance
    ladder:
    - when: the ticket is dated on a Sunday
      value: K('sunday_allowance')
    - when: the ticket is dated on a Saturday
      value: K('saturday_allowance')
    - when: otherwise (Monday through Friday)
      value: '0'
    baseline:
      weekend_allowance: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: repeat_unapproved_deductible
    effect: parameter
    decides: repeat_deductible
    bindings:
    - prior_unapproved_disputes
    - repeat_deductible
    ladder:
    - when: >-
        two or more earlier disputes of unapproved over-limit tickets resolved with a credit, registered less than twelve
        whole months before today
      value: K('repeat_two')
    - when: exactly one such dispute
      value: K('repeat_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      repeat_deductible: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The amount a business may place in dispute as an unapproved over-limit ticket is the invoice amount less the account's
      ticket approval limit, never below 0.00 and never more than the invoice amount, rounded half up to the cent.
    params: []
  inputs:
    history:
    - table: fleet_transactions
      aggregate: latest
      field: source_fleet_txn_id
      filters:
        event_type: fleet_payment_received
    - table: fleet_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: fleet_invoice_posted
    - table: fleet_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: fleet_credit_memo
    - table: fleet_invoice_disputes
      aggregate: count
      field: fleet_dispute_id
      within_months: 12
      filters:
        dispute_reason: unauthorized_purchase
        dispute_status: resolved_credit
    cross_category: []
- id: fleet_ext_early_pay_credit
  base_policy_refs:
  - fleet_evt_payment
  - fleet_evt_credit_memo
  - fleet_evt_late_charge
  overwrite:
  - base_policy: fleet_evt_payment
    superseded_clause: The early-pay discount is credited on an invoice only when the remittance pays it in full.
    replaced_by: >-
      The early-pay discount is credited on the invoice the most recent remittance was applied to when that remittance arrived
      no later than the end of the early-pay period and, together with the payments, early-pay discounts and credit memos
      already applied to the invoice, leaves nothing open on it beyond the amount under an open dispute registered for that
      invoice and the early-pay discount itself (a remittance that already deducted the discount pays the invoice in full);
      every other invoice remains under the base rule
  - base_policy: fleet_evt_payment
    superseded_clause: The discount is early_pay_discount_pct percent of the invoice amount, rounded half up to the cent
    replaced_by: >-
      The discount is the early-pay rate in percent applied once to the discount base, rounded half up to the cent only
      on that final product
  trigger: state_due
  subject:
  - fleet_early_pay_discount
  computes: amount
  target_tool: credit_fleet_early_pay_23cbfed3
  params:
    swift_days: 3
    quick_days: 6
    swift_points: 0.5
    quick_points: 0.25
    tenure_long_months: 60
    tenure_mid_months: 36
    tenure_long_points: 0.25
    tenure_mid_points: 0.1
    volume_high: 40000.0
    volume_mid: 20000.0
    volume_high_points: 0.25
    volume_mid_points: 0.1
    electronic_points: 0.25
    check_points: 0.25
    mostly_disputed_share: 0.5
    rotations_high: 6
    rotations_mid: 3
    tire_care_high_points: 0.25
    tire_care_mid_points: 0.1
  rule: >-
    The early-pay discount is credited on the invoice the most recent remittance was applied to when that remittance arrived
    no later than the end of the early-pay period and, together with the payments, early-pay discounts and credit memos
    already applied to the invoice, leaves nothing open on it beyond the amount under an open dispute registered for that
    invoice and the early-pay discount itself (a remittance that already deducted the discount pays the invoice in full);
    every other invoice remains under the base rule. The discount is the early-pay rate in percent applied once to the discount
    base, rounded half up to the cent only on that final product. The early-pay rate is the program's early_pay_discount_pct,
    and the discount base is the invoice amount. The early-pay discount on an invoice that a remittance has paid only in
    part is credited only after an open dispute of an unapproved over-limit ticket registered for that invoice covers the
    part left unpaid. A program whose early_pay_discount_pct is 0 gives no discount, whatever is added to the early-pay
    rate. Remittance speed points are added to the early-pay rate, counted in calendar days from the invoice date to the
    date of the remittance: 0.50 when the remittance arrived within 3 days and no late charge was assessed on the account
    less than twelve whole months before today, 0.25 when it arrived 4 to 6 days after the invoice date and no such late
    charge was assessed, and none otherwise. Tenure points are added to the early-pay rate: 0.25 when the account was approved
    60 or more whole months before today, 0.10 when it was approved 36 to 59 whole months before today, and none when it
    was approved more recently. Tire care points are added to the early-pay rate: 0.25 when six or more tire rotations were
    performed on the business's vehicles at Crestline stores less than twelve whole months before today, 0.10 when three
    to five were, and none when fewer were. Invoiced volume points are added to the early-pay rate: 0.25 when the invoices
    posted to the account less than twelve whole months before today total 40,000.00 or more, 0.10 when they total 20,000.00
    to 39,999.99, and none when they total less. Remittance channel points are added to the early-pay rate: 0.25 when the
    remittance reference carries ACH or WIRE, whether or not it also carries CHK; minus 0.25 when it carries CHK and neither
    ACH nor WIRE; and none when it carries none of them. The discount base depends on the dispute standing on the invoice:
    when the amount under open dispute for the invoice is more than half of the invoice amount the invoice earns no early-pay
    discount at all; when some amount but no more than half is under open dispute the discount base is the invoice amount
    less the amount under open dispute; and when nothing is under open dispute the discount base is the whole invoice amount.
  prerequisite:
  - problem: fleet_ext_overlimit_dispute
    kind: value_input
    gate: disputed_open
    form: state
    policy_source: >-
      The early-pay discount on an invoice that a remittance has paid only in part is credited only after an open dispute
      of an unapproved over-limit ticket registered for that invoice covers the part left unpaid.
    condition: >-
      fleet_invoice_disputes carries a row with dispute_status open and dispute_reason unauthorized_purchase whose fleet_txn_id
      is the invoice the most recent remittance was applied to, and its disputed_amount is at least the amount the remittances,
      discounts and credit memos leave open on that invoice.
    resolved_by: file_fleet_overlimit_dispute_8d937b85
    effect: >-
      disputed_open takes the disputed amount filed, so the open amount less the disputed amount falls to 0.00 or below,
      the paid-in-full test passes and the result moves from 0.00 to the discount on the undisputed part of the invoice.
  cross_category:
  - category: tires
    as: history
    reads:
    - tire_events.event_type
    - tire_events.event_date
    note: >-
      The tire care points tier is decided from the tire rotations recorded on the business's tire sets in the tires ledger.
  compute:
  - pay_invoice: >-
      LATEST('fleet_transactions','source_fleet_txn_id', date_field='txn_date', event_type='fleet_payment_received')
  - pay_invoice_amount: LATEST('fleet_transactions','amount', date_field='txn_date', fleet_txn_id=pay_invoice)
  - pay_invoice_date: LATEST('fleet_transactions','txn_date', date_field='txn_date', fleet_txn_id=pay_invoice)
  - remit_date: >-
      LATEST('fleet_transactions','txn_date', date_field='txn_date', event_type='fleet_payment_received', source_fleet_txn_id=pay_invoice)
  - remit_days: DAYS(pay_invoice_date, remit_date)
  - late_charges_12m: COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_late_charge')
  - speed_points: >-
      K('swift_points') if (remit_days <= K('swift_days') and late_charges_12m == 0) else (K('quick_points') if (remit_days
      > K('swift_days') and remit_days <= K('quick_days') and late_charges_12m == 0) else 0)
  - months_approved: MONTHS(F('approval_date'), NOW)
  - tenure_points: >-
      K('tenure_long_points') if months_approved >= K('tenure_long_months') else (K('tenure_mid_points') if months_approved
      >= K('tenure_mid_months') else 0)
  - tire_rotations_12m: >-
      XCOUNT('tires','tire_events', within_months=12, date_field='event_date', event_type='tires_rotation_service')
  - tire_care_points: >-
      K('tire_care_high_points') if tire_rotations_12m >= K('rotations_high') else (K('tire_care_mid_points') if tire_rotations_12m
      >= K('rotations_mid') else 0)
  - invoiced_12m: >-
      SUM('fleet_transactions','amount', within_months=12, date_field='txn_date', event_type='fleet_invoice_posted')
  - volume_points: >-
      K('volume_high_points') if invoiced_12m >= K('volume_high') else (K('volume_mid_points') if invoiced_12m >= K('volume_mid')
      else 0)
  - remit_reference: >-
      LATEST('fleet_transactions','payment_reference', date_field='txn_date', event_type='fleet_payment_received', source_fleet_txn_id=pay_invoice)
  - channel_points: >-
      K('electronic_points') if (remit_reference != None and ('ACH' in remit_reference or 'WIRE' in remit_reference)) else
      ((0 - K('check_points')) if (remit_reference != None and 'CHK' in remit_reference) else 0)
  - disputed_open: SUM('fleet_invoice_disputes','disputed_amount', dispute_status='open', fleet_txn_id=pay_invoice)
  - open_dispute_rows: COUNT('fleet_invoice_disputes', dispute_status='open', fleet_txn_id=pay_invoice)
  - discount_base: >-
      0 if disputed_open > K('mostly_disputed_share') * pay_invoice_amount else ((pay_invoice_amount - disputed_open) if
      open_dispute_rows > 0 else pay_invoice_amount)
  - applied_to_invoice: >-
      SUM('fleet_transactions','amount', event_type='fleet_payment_received', source_fleet_txn_id=pay_invoice) + SUM('fleet_transactions','amount',
      event_type='fleet_early_pay_discount', source_fleet_txn_id=pay_invoice) + SUM('fleet_transactions','amount', event_type='fleet_credit_memo',
      source_fleet_txn_id=pay_invoice)
  - left_open_beyond_dispute: pay_invoice_amount - applied_to_invoice - disputed_open
  - in_period: remit_days <= P('early_pay_discount_days')
  - early_pay_rate: >-
      0 if P('early_pay_discount_pct') == 0 else P('early_pay_discount_pct') + speed_points + tenure_points + tire_care_points
      + volume_points + channel_points
  - discount_due: RND(discount_base * early_pay_rate / 100, 2)
  - result: discount_due if (in_period and left_open_beyond_dispute <= discount_due + 0.005) else 0
  compute_basis:
