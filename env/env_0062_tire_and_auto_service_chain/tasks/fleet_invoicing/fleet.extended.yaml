    cross_difficulty: null
  - id: weekend_visit_surcharge
    effect: parameter
    decides: weekend_surcharge
    bindings:
    - visit_weekday
    - weekend_surcharge
    ladder:
    - when: the visit was on a Sunday
      value: K('sunday_surcharge')
    - when: the visit was on a Saturday
      value: K('saturday_surcharge')
    - when: otherwise (Monday through Friday)
      value: '0'
    baseline:
