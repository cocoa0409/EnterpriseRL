    schedule_part: >-
      The fee owed starts from an amount set by the number of vehicles served: when the visit served at least twice the
      program's mobile_service_min_vehicles it starts from nothing; when it served more than mobile_service_min_vehicles
      but fewer than twice that number it starts from the program's mobile_service_fee less 12.00 for each vehicle beyond
      mobile_service_min_vehicles, never below 0.00; and otherwise it starts from the program's mobile_service_fee.
    visit_weekday: >-
      A weekend surcharge is added to the fee owed: 12.00 for a visit on a Sunday, 8.00 for a visit on a Saturday, and nothing
      for a visit Monday through Friday.
    weekend_surcharge: >-
      A weekend surcharge is added to the fee owed: 12.00 for a visit on a Sunday, 8.00 for a visit on a Saturday, and nothing
      for a visit Monday through Friday.
    visit_fees_12m: >-
      A route credit is taken off the fee owed: 5.00 when the account has 6 or more mobile service visit fee invoices dated
