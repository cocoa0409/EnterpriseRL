- id: fleet_ext_tire_discount_restore
  base_policy_refs:
  - fleet_evt_credit_memo
  - fleet_evt_invoice
  overwrite:
  - base_policy: fleet_evt_credit_memo
    superseded_clause: A pricing_correction restores the category_discount_pct the invoice should have received
    replaced_by: >-
      For a tire invoice that an account invoiced without sales tax received with no fleet discount at all, and only for
      such a tire invoice, the pricing correction credits what this rule works out for the billing error, which is at least
      the fleet discount the ticket should have carried less the discount the invoice already carried, except that it never
      exceeds the invoice amount less the credit memos and early-pay discounts already on the invoice, that limit prevailing;
      every other pricing correction, including one on a brake invoice, remains under the base rule or its own rule
  trigger: state_due
  subject:
  - fleet_credit_memo
  computes: amount
  target_tool: credit_fleet_tire_discount_840e1cf3
  params:
    tires_pct_starter: 5
    tires_pct_business: 8
    tires_pct_commercial: 10
    tires_pct_national: 12
    tires_pct_enterprise: 15
    tires_pct_public: 12
    full_set_tires: 4
    partial_share: 0.1
    repeat_two_credit: 25.0
    repeat_one_credit: 10.0
    allowances_high: 8
    allowances_mid: 4
    hazard_high_credit: 15.0
    hazard_mid_credit: 7.5
    tire_invoices_high: 10
    tire_invoices_mid: 5
    tire_volume_high_credit: 20.0
    tire_volume_mid_credit: 10.0
  rule: >-
    For a tire invoice that an account invoiced without sales tax received with no fleet discount at all, and only for such
    a tire invoice, the pricing correction credits what this rule works out for the billing error, which is at least the
    fleet discount the ticket should have carried less the discount the invoice already carried, except that it never exceeds
    the invoice amount less the credit memos and early-pay discounts already on the invoice, that limit prevailing; every
    other pricing correction, including one on a brake invoice, remains under the base rule or its own rule. The correction
    is made on the account's most recent tire invoice of that kind; on an account invoiced with sales tax this rule credits
    nothing and the base rule governs. The discount the ticket should have carried is the program's tires discount (category_discount_pct
    for tires) applied to the ticket's discountable tire price, which is the invoice amount plus any discount already taken,
    less the disposal fees of the tire set bought on that ticket (its tire_count times the line's tire_disposal_fee_per_tire)
    and less the road hazard certificate sold on that ticket (its price_per_tire times covered_tire_count); it is rounded
    half up to the cent, the correction is that discount less the discount already taken, never below 0.00, and it never
    exceeds the invoice amount less the credit memos and early-pay discounts already on the invoice. Because a fleet invoice
    posted without the program discount is Crestline's billing error, make-good amounts are added to the correction; the
    limit of the invoice amount less the credit memos and early-pay discounts already on the invoice is applied last, after
    every make-good amount, and prevails over every other part of this rule, so a correction can fall below the restored
    discount only when that limit is lower; the correction is rounded half up to the cent once, after the limit. The make-good
    line depends on the tire set bought on the ticket: when the set has four or more tires, the mounting and balancing of
    every tire on the set is added to the correction (its tire_count times the line's mounting_balancing_charge_per_tire);
    when it has one to three tires, one tenth of the restored discount is added, rounded half up to the cent; and when no
    tire set was bought on the ticket nothing is added. A repeat-error credit is added to the correction: 25.00 when two
    or more pricing correction credit memos were booked on the account before today and less than twelve whole months before
    today, 10.00 when exactly one was, and nothing when none was. A road hazard program credit is added to the correction:
    15.00 when eight or more roadside allowances were granted on the business's road hazard certificates less than twenty-four
    whole months before today, 7.50 when four to seven were, and nothing when fewer were. A tire volume credit is added
    to the correction: 20.00 when ten or more tire invoices were posted to the account less than twelve whole months before
    today, 10.00 when five to nine were, and nothing when fewer were.
  prerequisite: []
  cross_category:
  - category: tires
    as: branch
    reads:
    - tire_count
    - tire_disposal_fee_per_tire
    - mounting_balancing_charge_per_tire
    note: >-
      The make-good line method is decided from the tire set bought on the ticket and its line's mounting charge.
  - category: hazard
    as: history
    reads:
    - price_per_tire
    - covered_tire_count
    - hazard_events.event_type
    note: >-
      The road hazard program credit tier is decided from the roadside allowances granted on the business's certificates;
      the certificate sold on the ticket is excluded from the discountable price.
  compute:
  - tr_invoice: >-
      LATEST('fleet_transactions','fleet_txn_id', date_field='txn_date', event_type='fleet_invoice_posted', service_category='tires',
      discount_amount=0.0)
  - tr_amount: LATEST('fleet_transactions','amount', date_field='txn_date', fleet_txn_id=tr_invoice)
  - tr_discount_taken: LATEST('fleet_transactions','discount_amount', date_field='txn_date', fleet_txn_id=tr_invoice)
  - tr_date: LATEST('fleet_transactions','txn_date', date_field='txn_date', fleet_txn_id=tr_invoice)
  - tr_vehicle: LATEST('fleet_transactions','vehicle_id', date_field='txn_date', fleet_txn_id=tr_invoice)
  - tax_free_account: F('tax_exempt') == True
  - set_on_ticket: EXISTS('tires', vehicle_id=tr_vehicle, purchase_date=tr_date)
  - set_tire_count: CFIELD('tires','tire_count', vehicle_id=tr_vehicle, purchase_date=tr_date) if set_on_ticket else 0
  - disposal_on_ticket: >-
      (set_tire_count * CPARAM('tires','tire_disposal_fee_per_tire', vehicle_id=tr_vehicle, purchase_date=tr_date)) if set_on_ticket
      else 0
  - hazard_on_ticket: >-
      (CFIELD('hazard','price_per_tire', vehicle_id=tr_vehicle, purchase_date=tr_date) * CFIELD('hazard','covered_tire_count',
      vehicle_id=tr_vehicle, purchase_date=tr_date)) if EXISTS('hazard', vehicle_id=tr_vehicle, purchase_date=tr_date) else
      0
  - discountable_tire_price: tr_amount + tr_discount_taken - disposal_on_ticket - hazard_on_ticket
  - program_tire_pct: >-
      K('tires_pct_starter') if F('variant_name') == 'Crestline Fleet Starter' else (K('tires_pct_business') if F('variant_name')
      == 'Crestline Fleet Business' else (K('tires_pct_commercial') if F('variant_name') == 'Crestline Fleet Commercial'
      else (K('tires_pct_national') if F('variant_name') == 'Crestline Fleet National' else (K('tires_pct_enterprise') if
      F('variant_name') == 'Crestline Fleet Enterprise' else K('tires_pct_public')))))
  - restored_discount: MX(0, RND(discountable_tire_price * program_tire_pct / 100, 2) - tr_discount_taken)
  - makegood_line: >-
      (set_tire_count * CPARAM('tires','mounting_balancing_charge_per_tire', vehicle_id=tr_vehicle, purchase_date=tr_date))
      if set_tire_count >= K('full_set_tires') else (RND(restored_discount * K('partial_share'), 2) if set_tire_count >=
      1 else 0)
  - prior_corrections: >-
      COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_credit_memo', credit_reason='pricing_correction')
      - COUNT('fleet_transactions', event_type='fleet_credit_memo', credit_reason='pricing_correction', txn_date=NOW)
  - repeat_error_credit: >-
      K('repeat_two_credit') if prior_corrections >= 2 else (K('repeat_one_credit') if prior_corrections == 1 else 0)
  - allowances_24m: >-
      XCOUNT('hazard','hazard_events', within_months=24, date_field='event_date', event_type='hazard_roadside_allowance_granted')
  - hazard_program_credit: >-
      K('hazard_high_credit') if allowances_24m >= K('allowances_high') else (K('hazard_mid_credit') if allowances_24m >=
      K('allowances_mid') else 0)
  - tire_invoices_12m: >-
      COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_invoice_posted', service_category='tires')
  - tire_volume_credit: >-
      K('tire_volume_high_credit') if tire_invoices_12m >= K('tire_invoices_high') else (K('tire_volume_mid_credit') if
      tire_invoices_12m >= K('tire_invoices_mid') else 0)
  - tire_makegood: makegood_line + repeat_error_credit + hazard_program_credit + tire_volume_credit
  - tr_credit_room: >-
      tr_amount - SUM('fleet_transactions','amount', event_type='fleet_credit_memo', source_fleet_txn_id=tr_invoice) - SUM('fleet_transactions','amount',
      event_type='fleet_early_pay_discount', source_fleet_txn_id=tr_invoice)
  - result: RND(MN(tr_credit_room, restored_discount + tire_makegood), 2) if tax_free_account else 0
  compute_basis:
    tr_invoice: The correction is made on the account's most recent tire invoice of that kind
    tr_amount: which is the invoice amount plus any discount already taken
    tr_discount_taken: the correction is that discount less the discount already taken, never below 0.00
    tr_date: the tire set bought on that ticket
    tr_vehicle: the tire set bought on that ticket
    tax_free_account: on an account invoiced with sales tax this rule credits nothing and the base rule governs.
    set_on_ticket: and when no tire set was bought on the ticket nothing is added.
    set_tire_count: >-
      less the disposal fees of the tire set bought on that ticket (its tire_count times the line's tire_disposal_fee_per_tire)
    disposal_on_ticket: >-
      less the disposal fees of the tire set bought on that ticket (its tire_count times the line's tire_disposal_fee_per_tire)
    hazard_on_ticket: less the road hazard certificate sold on that ticket (its price_per_tire times covered_tire_count)
    discountable_tire_price: >-
      the ticket's discountable tire price, which is the invoice amount plus any discount already taken, less the disposal
      fees of the tire set bought on that ticket (its tire_count times the line's tire_disposal_fee_per_tire) and less the
      road hazard certificate sold on that ticket (its price_per_tire times covered_tire_count)
    program_tire_pct: >-
      The discount the ticket should have carried is the program's tires discount (category_discount_pct for tires) applied
      to the ticket's discountable tire price
    restored_discount: >-
      it is rounded half up to the cent, the correction is that discount less the discount already taken, never below 0.00
    makegood_line: >-
      The make-good line depends on the tire set bought on the ticket: when the set has four or more tires, the mounting
      and balancing of every tire on the set is added to the correction (its tire_count times the line's mounting_balancing_charge_per_tire);
      when it has one to three tires, one tenth of the restored discount is added, rounded half up to the cent; and when
      no tire set was bought on the ticket nothing is added.
    prior_corrections: >-
      A repeat-error credit is added to the correction: 25.00 when two or more pricing correction credit memos were booked
      on the account before today and less than twelve whole months before today, 10.00 when exactly one was, and nothing
      when none was.
    repeat_error_credit: >-
      A repeat-error credit is added to the correction: 25.00 when two or more pricing correction credit memos were booked
      on the account before today and less than twelve whole months before today, 10.00 when exactly one was, and nothing
      when none was.
    allowances_24m: >-
      A road hazard program credit is added to the correction: 15.00 when eight or more roadside allowances were granted
      on the business's road hazard certificates less than twenty-four whole months before today, 7.50 when four to seven
      were, and nothing when fewer were.
    hazard_program_credit: >-
      A road hazard program credit is added to the correction: 15.00 when eight or more roadside allowances were granted
      on the business's road hazard certificates less than twenty-four whole months before today, 7.50 when four to seven
      were, and nothing when fewer were.
    tire_invoices_12m: >-
      A tire volume credit is added to the correction: 20.00 when ten or more tire invoices were posted to the account less
      than twelve whole months before today, 10.00 when five to nine were, and nothing when fewer were.
    tire_volume_credit: >-
      A tire volume credit is added to the correction: 20.00 when ten or more tire invoices were posted to the account less
      than twelve whole months before today, 10.00 when five to nine were, and nothing when fewer were.
    tire_makegood: >-
      Because a fleet invoice posted without the program discount is Crestline's billing error, make-good amounts are added
      to the correction; the limit of the invoice amount less the credit memos and early-pay discounts already on the invoice
      is applied last, after every make-good amount, and prevails over every other part of this rule, so a correction can
      fall below the restored discount only when that limit is lower; the correction is rounded half up to the cent once,
      after the limit.
    tr_credit_room: >-
      it never exceeds the invoice amount less the credit memos and early-pay discounts already on the invoice.
    result: >-
      Because a fleet invoice posted without the program discount is Crestline's billing error, make-good amounts are added
      to the correction; the limit of the invoice amount less the credit memos and early-pay discounts already on the invoice
      is applied last, after every make-good amount, and prevails over every other part of this rule, so a correction can
      fall below the restored discount only when that limit is lower; the correction is rounded half up to the cent once,
      after the limit.
  factors:
  - id: tire_makegood_line
    effect: method
    decides: makegood_line
    bindings:
    - makegood_line
    ladder:
    - when: the tire set bought on the ticket has four or more tires
      method: >-
        the set's tire count times the line's mounting and balancing charge per tire is added to the correction
    - when: the set has one to three tires
      method: one tenth of the restored discount is added, rounded half up to the cent
    - when: otherwise (no tire set bought on the ticket)
      method: nothing is added
    baseline:
      makegood_line: '0'
