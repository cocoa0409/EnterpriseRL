- id: fleet_ext_brake_discount_restore
  base_policy_refs:
  - fleet_evt_credit_memo
  - fleet_evt_invoice
  overwrite:
  - base_policy: fleet_evt_credit_memo
    superseded_clause: A pricing_correction restores the category_discount_pct the invoice should have received
    replaced_by: >-
      For a brake invoice that an account invoiced without sales tax received with no fleet discount at all, and only for
      such a brake invoice, the pricing correction credits what this rule works out for the billing error, which is at least
      the fleet discount the brake jobs should have carried less the discount the invoice already carried, except that it
      never exceeds the invoice amount less the credit memos and early-pay discounts already on the invoice, that limit
      prevailing; every other pricing correction, including one on a tire invoice, remains under the base rule or its own
      rule
  trigger: state_due
  subject:
  - fleet_credit_memo
  computes: amount
  target_tool: credit_fleet_brake_discount_3a9816af
  params:
    brakes_pct_starter: 5
    brakes_pct_business: 10
    brakes_pct_commercial: 12
    brakes_pct_national: 15
    brakes_pct_enterprise: 18
    brakes_pct_public: 15
    one_axle_courtesy: 10.0
    brake_invoices_high: 6
    brake_invoices_mid: 3
    brake_volume_high_credit: 20.0
    brake_volume_mid_credit: 10.0
    tenure_long_months: 60
    tenure_mid_months: 36
    tenure_long_credit: 15.0
    tenure_mid_credit: 7.5
    clean_record_credit: 10.0
    one_late_credit: 5.0
  rule: >-
    For a brake invoice that an account invoiced without sales tax received with no fleet discount at all, and only for
    such a brake invoice, the pricing correction credits what this rule works out for the billing error, which is at least
    the fleet discount the brake jobs should have carried less the discount the invoice already carried, except that it
    never exceeds the invoice amount less the credit memos and early-pay discounts already on the invoice, that limit prevailing;
    every other pricing correction, including one on a tire invoice, remains under the base rule or its own rule. The correction
    is made on the account's most recent brake invoice of that kind, and the brake jobs behind it are the brake warranties
    of that vehicle with a service date equal to the invoice date, one per axle; on an account invoiced with sales tax this
    rule credits nothing and the base rule governs. The discount the brake jobs should have carried is the program's brakes
    discount (category_discount_pct for brakes) applied to the ticket's discountable brake price, which is the invoice amount
    plus any discount already taken, less the shop supplies fee of the repair order (shop_supplies_fee_pct percent of the
    labor charged on its brake jobs, capped at shop_supplies_fee_cap, rounded half up to the cent), and it is nothing when
    a brake job on the ticket is on a line whose fleet_discount_applicable is false; the discount is rounded half up to
    the cent, the correction is that discount less the discount already taken, never below 0.00, and it never exceeds the
    invoice amount less the credit memos and early-pay discounts already on the invoice. Because a fleet invoice posted
    without the program discount is Crestline's billing error, make-good amounts are added to the correction; the limit
    of the invoice amount less the credit memos and early-pay discounts already on the invoice is applied last, after every
    make-good amount, and prevails over every other part of this rule, so a correction can fall below the restored discount
    only when that limit is lower; the correction is rounded half up to the cent once, after the limit. The make-good line
    depends on the brake jobs on the ticket: when the ticket carried jobs on both axles, the repair order's shop supplies
    fee is added to the correction; when it carried a job on one axle, a courtesy amount of 10.00 is added; and when no
    brake job is recorded for that vehicle on the invoice date nothing is added. A brake volume credit is added to the correction:
    20.00 when six or more brake invoices were posted to the account less than twelve whole months before today, 10.00 when
    three to five were, and nothing when fewer were. A tenure credit is added to the correction: 15.00 when the account
    was approved 60 or more whole months before today, 7.50 when it was approved 36 to 59 whole months before today, and
    nothing when it was approved more recently. A standing credit is added to the correction: 10.00 when no late charge
    was assessed on the account less than twelve whole months before today, 5.00 when exactly one was, and nothing when
    two or more were.
  prerequisite: []
  cross_category:
  - category: brakes
    as: branch
    reads:
    - axle
    - service_date
    - labor_charge
    - fleet_discount_applicable
    - shop_supplies_fee_pct
    - shop_supplies_fee_cap
    note: >-
      The make-good line method is decided from the brake jobs recorded for the vehicle on the invoice date.
  compute:
  - br_invoice: >-
      LATEST('fleet_transactions','fleet_txn_id', date_field='txn_date', event_type='fleet_invoice_posted', service_category='brakes',
      discount_amount=0.0)
  - br_amount: LATEST('fleet_transactions','amount', date_field='txn_date', fleet_txn_id=br_invoice)
  - br_discount_taken: LATEST('fleet_transactions','discount_amount', date_field='txn_date', fleet_txn_id=br_invoice)
  - br_date: LATEST('fleet_transactions','txn_date', date_field='txn_date', fleet_txn_id=br_invoice)
  - br_vehicle: LATEST('fleet_transactions','vehicle_id', date_field='txn_date', fleet_txn_id=br_invoice)
  - tax_free_brake_account: F('tax_exempt') == True
  - front_job: EXISTS('brakes', vehicle_id=br_vehicle, service_date=br_date, axle='front')
  - rear_job: EXISTS('brakes', vehicle_id=br_vehicle, service_date=br_date, axle='rear')
  - labor_on_ticket: >-
      (CFIELD('brakes','labor_charge', vehicle_id=br_vehicle, service_date=br_date, axle='front') if front_job else 0) +
      (CFIELD('brakes','labor_charge', vehicle_id=br_vehicle, service_date=br_date, axle='rear') if rear_job else 0)
  - shop_supplies_fee: >-
      RND(MN(CPARAM('brakes','shop_supplies_fee_pct', vehicle_id=br_vehicle, service_date=br_date) * labor_on_ticket / 100,
      CPARAM('brakes','shop_supplies_fee_cap', vehicle_id=br_vehicle, service_date=br_date)), 2) if (front_job or rear_job)
      else 0
  - discountable_brake_price: br_amount + br_discount_taken - shop_supplies_fee
  - non_applicable_line: >-
      (front_job and CPARAM('brakes','fleet_discount_applicable', vehicle_id=br_vehicle, service_date=br_date, axle='front')
      == False) or (rear_job and CPARAM('brakes','fleet_discount_applicable', vehicle_id=br_vehicle, service_date=br_date,
      axle='rear') == False)
  - program_brake_pct: >-
      K('brakes_pct_starter') if F('variant_name') == 'Crestline Fleet Starter' else (K('brakes_pct_business') if F('variant_name')
      == 'Crestline Fleet Business' else (K('brakes_pct_commercial') if F('variant_name') == 'Crestline Fleet Commercial'
      else (K('brakes_pct_national') if F('variant_name') == 'Crestline Fleet National' else (K('brakes_pct_enterprise')
      if F('variant_name') == 'Crestline Fleet Enterprise' else K('brakes_pct_public')))))
  - restored_brake_discount: >-
      0 if non_applicable_line else MX(0, RND(discountable_brake_price * program_brake_pct / 100, 2) - br_discount_taken)
  - axles_with_jobs: >-
      (1 if EXISTS('brakes', vehicle_id=br_vehicle, service_date=br_date, axle='front') else 0) + (1 if EXISTS('brakes',
      vehicle_id=br_vehicle, service_date=br_date, axle='rear') else 0)
  - brake_makegood_line: >-
      shop_supplies_fee if axles_with_jobs == 2 else (K('one_axle_courtesy') if axles_with_jobs == 1 else 0)
  - brake_invoices_12m: >-
      COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_invoice_posted', service_category='brakes')
  - brake_volume_credit: >-
      K('brake_volume_high_credit') if brake_invoices_12m >= K('brake_invoices_high') else (K('brake_volume_mid_credit')
      if brake_invoices_12m >= K('brake_invoices_mid') else 0)
  - months_approved_brake: MONTHS(F('approval_date'), NOW)
  - brake_tenure_credit: >-
      K('tenure_long_credit') if months_approved_brake >= K('tenure_long_months') else (K('tenure_mid_credit') if months_approved_brake
      >= K('tenure_mid_months') else 0)
  - late_charges_brake_12m: COUNT('fleet_transactions', within_months=12, date_field='txn_date', event_type='fleet_late_charge')
  - brake_standing_credit: >-
      K('clean_record_credit') if late_charges_brake_12m == 0 else (K('one_late_credit') if late_charges_brake_12m == 1
      else 0)
  - brake_makegood: brake_makegood_line + brake_volume_credit + brake_tenure_credit + brake_standing_credit
  - br_credit_room: >-
      br_amount - SUM('fleet_transactions','amount', event_type='fleet_credit_memo', source_fleet_txn_id=br_invoice) - SUM('fleet_transactions','amount',
      event_type='fleet_early_pay_discount', source_fleet_txn_id=br_invoice)
  - result: >-
      RND(MN(br_credit_room, restored_brake_discount + brake_makegood), 2) if tax_free_brake_account else 0
