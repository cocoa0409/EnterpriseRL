    - when: exactly one such credit memo
      value: K('repeat_one_credit')
    - when: otherwise (none)
      value: '0'
    baseline:
      repeat_error_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: road_hazard_program_credit
    effect: parameter
    decides: hazard_program_credit
    bindings:
    - allowances_24m
    - hazard_program_credit
    ladder:
    - when: >-
        eight or more roadside allowances granted on the business's road hazard certificates less than twenty-four whole
        months before today
      value: K('hazard_high_credit')
    - when: four to seven such allowances
      value: K('hazard_mid_credit')
    - when: otherwise
      value: '0'
    baseline:
      hazard_program_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: hazard
  - id: tire_invoice_volume_credit
    effect: parameter
    decides: tire_volume_credit
    bindings:
    - tire_invoices_12m
    - tire_volume_credit
    ladder:
    - when: ten or more tire invoices posted less than twelve whole months before today
      value: K('tire_volume_high_credit')
    - when: five to nine such invoices
      value: K('tire_volume_mid_credit')
    - when: otherwise
      value: '0'
    baseline:
      tire_volume_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The discount the ticket should have carried is the program's tires discount (category_discount_pct for tires) applied
      to the ticket's discountable tire price, which is the invoice amount plus any discount already taken, less the disposal
      fees of the tire set bought on that ticket (its tire_count times the line's tire_disposal_fee_per_tire) and less the
      road hazard certificate sold on that ticket (its price_per_tire times covered_tire_count); it is rounded half up to
      the cent, the correction is that discount less the discount already taken, never below 0.00, and it never exceeds
      the invoice amount less the credit memos and early-pay discounts already on the invoice.
    params:
    - category_discount_pct
    - tires_pct_commercial
  inputs:
