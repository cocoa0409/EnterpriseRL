# Policy charter: Crestline Fleet Account (category key: fleet)
# One holding = one business (or public agency) charge account with net terms. Enrolled vehicles
# are serviced at any Crestline store under the program's discounts; every ticket becomes a fleet
# invoice (with a purchase order where required), and the account is settled by remittances,
# early-pay discounts, credit memos and late charges.

category: fleet
display_name: Crestline Fleet Account

binding:
  holding_table: fleet_accounts
  event_tables: [fleet_transactions, fleet_roster_events]
  intake_tables: [fleet_invoice_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {outstanding_balance: fleet_receivable}

lifecycle:
  states: [applied, active, credit_hold, declined, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "Crestline Fleet Credit approves the application and sets the credit limit and terms."}
    - {from: applied, to: declined, by: system, means: "Crestline Fleet Credit declines the application."}
    - {from: active, to: credit_hold, by: system, means: "The account is past due or over limit beyond the program's threshold and stores stop charging to it."}
    - {from: credit_hold, to: active, by: system, means: "The past-due amount is paid and the balance is back within the limit, so charging resumes."}
    - {from: active, to: closed, by: user, means: "The business's authorized contact confirms closure of the account; the remaining balance stays due on its terms."}
    - {from: credit_hold, to: closed, by: system, means: "A held account is closed and referred to collections at the referral threshold."}

accounts:
  - key: fleet_receivable
    unit: USD
    meaning: Amount the business owes Crestline on the account; invoices and late charges add to it, remittances, early-pay discounts and credit memos reduce it.

# ---- category-level parameter dictionary ----
parameter_schema:
  roster_vehicles_min: Fewest vehicles the program is for, integer
  roster_vehicles_max: Most vehicles the program is for, integer or no_maximum
  net_terms_days: Days after the invoice date (per-invoice billing) or after the statement date (monthly statement
    billing) that payment is due
  credit_limit_min: Smallest credit limit approved on the program, USD
  credit_limit_max: Largest credit limit approved on the program, USD
  category_discount_pct: Fleet discount off the store's posted price by service_category, percent
  discount_excluded_items: Ticket items the fleet discount never applies to, list
  discount_rounding: Rounding of the discount amount on an invoice, enum text
  national_price_file: Whether tire prices come from the Crestline national fleet price file instead of the store's
    posted price before the discount, boolean
  po_required_threshold: Ticket amount (pre-tax, after discount) at or above which a purchase order number is required,
    USD (0.00 = every ticket)
  ticket_approval_limit_default: Program default for the largest ticket completed without the fleet manager's approval,
    USD
  approval_limit_override: How the account-level ticket_approval_limit relates to the default, enum text
  driver_authorization: What a driver must give at the counter to charge the account, enum text
  billing_cycle_options: Billing cycles the account may use, list
  statement_closing: When a monthly statement closes, enum text
  early_pay_discount_pct: Discount for paying an invoice in full within early_pay_discount_days of the invoice date,
    percent of the invoice amount (0 = none)
  early_pay_discount_days: Calendar days after the invoice date within which payment in full earns the early-pay
    discount (0 = none)
  late_charge_monthly_pct: Late charge on the past-due balance at each month-end, percent per month (0 = none)
  late_charge_min: Smallest late charge assessed when any is due, USD
  late_charge_basis: Balance the late charge applies to, enum text
  credit_hold_days_past_due: Days past the oldest unpaid invoice's due date at which the account goes on credit
    hold
  over_limit_tolerance_pct: How far above the credit limit the balance may run before credit hold, percent of the
    limit
  collections_referral_days_past_due: Days past due at which a held account is closed and referred to collections
  dispute_window_days: Calendar days after the invoice date within which an invoice can be disputed
  credit_memo_desk_limit: Largest credit memo customer care may issue on one invoice; larger credits go to Crestline
    Fleet Credit, USD
  duplicate_invoice_check: Fields that identify a duplicate invoice, list
  payment_application_order: How a remittance that names no invoice is applied, enum text
  short_pay_handling: What happens to the unpaid difference when a remittance pays less than an invoice, enum text
  payment_methods: Ways the business may pay, list
  mobile_service_available: Whether on-site mobile tire service can be dispatched to the fleet's yard, boolean
  mobile_service_fee: Fee per on-site mobile service visit, USD (0.00 = no fee)
  mobile_service_min_vehicles: Vehicles to be serviced on one visit for mobile service to be dispatched, integer
  personal_guarantee_required: Whether an owner's personal guarantee is required on the application, boolean
  application_documents: Documents the credit application needs, list
  tax_exemption_certificate_required: Whether a tax-exempt invoice needs a valid certificate on file, boolean
  credit_review_months: Months between scheduled credit reviews of the account
  credit_limit_increase_max_pct: Largest increase granted at one credit review, percent of the current limit
  roster_change_effective: When an added or removed vehicle takes effect, enum text
  vehicles_per_roster_max_basis: How roster size is compared with the program limits, enum text
  program_review_on_roster_change: Whether a roster outside the program's range triggers a program change at the
    next credit review rather than immediately, boolean
  road_hazard_plan_for_fleet: Road hazard plan that may be charged to the account, official tier name
  invoice_delivery: How invoices and statements are delivered, enum text
  statement_reprint_fee: Fee for a mailed paper copy of an invoice or statement, USD
  account_closure_balance_terms: How a balance on a closed account is settled, enum text
  accounts_per_business_max: Fleet accounts one business profile may hold (for divisions or branches), integer
  combined_credit_limit_max: Highest total of credit limits across all fleet accounts of one business, USD
  remittance_advice_required: Whether a remittance must name the invoice numbers it pays to be applied to them,
    boolean
  government_prompt_pay: Whether the account is invoiced under the agency's own prompt-payment schedule instead
    of late charges, boolean

