  factors:
  - id: refund_clock_start_fx
    effect: method
    decides: refund_count_from
    bindings:
    - roster_enrolled_on
    - roster_removed_on
    - pending_request_on
    - refund_count_from
    ladder:
    - when: the covered vehicle has a fleet roster enrollment that no later removal has ended
      method: the unused share is counted from the enrollment date
    - when: no such open enrollment and a cancellation request on the certificate still awaits the holder's confirmation
      method: the unused share is counted from the date that request was registered
    - when: otherwise
      method: the unused share is counted from the cancellation date
    baseline:
      refund_count_from: NOW
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: fleet
  - id: refund_day_count_fx
    effect: method
    decides: refund_day_basis
    bindings:
    - refund_months_in_force
    - refund_day_basis
    ladder:
    - when: fewer than day_basis_months whole months from effective_date to the cancellation date
      method: actual days remaining over actual days in the term
    - when: at least day_basis_months but fewer than thirty_day_basis_months whole months to the cancellation date
      method: whole 30-day periods remaining over coverage_term_months
    - when: otherwise
      method: whole calendar months remaining over coverage_term_months
    baseline:
      refund_day_basis: '''months'''
    evidence:
    - date
    cross_difficulty: null
  - id: refund_tread_life_fx
    effect: parameter
    decides: refund_tread_factor
    bindings:
    - routine_reading
    - routine_reading_date
    - line_new_tread
    - usable_tread_share
    - refund_tread_factor
    ladder:
    - when: a routine reading fewer than tread_reading_months months old and a usable-tread share at most low_tread_share
      value: K('low_tread_factor')
    - when: a routine reading fewer than tread_reading_months months old and a usable-tread share above low_tread_share and at most mid_tread_share
      value: K('mid_tread_factor')
    - when: otherwise
      value: '1'
    baseline:
      refund_tread_factor: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: tires
  - id: refund_fee_schedule_fx
    effect: parameter
    decides: refund_fee
    bindings:
    - active_card
    - card_late_fees
    - refund_fee
    ladder:
    - when: an active Crestline card account and no late fee in the last late_fee_lookback_months months
      value: '0'
    - when: an active Crestline card account and one or more late fees in that period
      value: K('cardholder_fee')
    - when: otherwise
      value: P('cancellation_admin_fee')
    baseline:
      refund_fee: P('cancellation_admin_fee')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: refund_call_credit_fx
    effect: parameter
    decides: refund_call_credit
    bindings:
    - roadside_calls_used
    - refund_call_credit
    ladder:
    - when: roadside calls remaining and no roadside service entry ever booked
      value: roadside_calls_remaining times K('unused_call_credit')
    - when: roadside calls remaining and at least one roadside service entry booked
      value: roadside_calls_remaining times K('partly_used_call_credit')
    - when: otherwise
      value: '0'
    baseline:
      refund_call_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: refund_bundle_clawback_fx
    effect: parameter
    decides: refund_bundle_clawback
    bindings:
    - active_alignment_ticket
    - active_alignment_bought_on
    - refund_bundle_clawback
    ladder:
    - when: an active alignment plan on the vehicle sold on the certificate's own purchase ticket
      value: K('ticket_bundle_clawback')
    - when: an active alignment plan sold on another ticket dated within linked_bundle_days days of the certificate's purchase_date
      value: K('linked_bundle_clawback')
    - when: otherwise
      value: '0'
    baseline:
      refund_bundle_clawback: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: alignment
  baseline:
    rule: The Life-of-Tread counting date is the cancellation date, and the Life-of-Tread unused share is the whole calendar months remaining from the counting date to expiration_date, a partial month not counted, divided by coverage_term_months. The Life-of-Tread prorated amount is the certificate price (price_per_tire times covered_tire_count) times the Life-of-Tread unused share, rounded half up to the cent. The Life-of-Tread cancellation fee is cancellation_admin_fee. The Life-of-Tread cancellation refund is the Life-of-Tread prorated amount minus the Life-of-Tread cancellation fee minus every benefit paid on the certificate (the amounts of its replacement, out-of-area reimbursement and roadside service entries); after every addition to it and deduction from it that applies, it is rounded half up to the cent and held at 0.00 or more, and it is paid to the tender the certificate was bought with.
    params:
    - coverage_term_months
    - cancellation_admin_fee
  inputs:
    history:
    - table: hazard_events
      aggregate: sum
      field: amount
      filters:
        event_type: hazard_replacement
    - table: hazard_events
      aggregate: sum
      field: amount
      filters:
        event_type: hazard_third_party_reimbursement
    - table: hazard_events
      aggregate: sum
      field: amount
      filters:
        event_type: hazard_roadside_service
    - category: fleet
      table: fleet_roster_events
      aggregate: latest
      field: event_date
      filters:
        event_type: fleet_vehicle_enrolled
    - category: tires
      table: tire_events
      aggregate: latest
      field: min_tread_depth_32nds
      filters:
        event_type: tires_tread_inspection
        wear_pattern: even
    - category: card
      table: card_transactions
      aggregate: count
      field: card_txn_id
      within_months: 12
      filters:
        event_type: card_late_fee
    cross_category:
    - fleet
    - tires
    - card
    - alignment
- id: hazard_ext_counter_replacement_posting
  base_policy_refs:
  - hazard_claim_coverage
  - hazard_evt_replacement
  - hazard_commercial_use_exclusion
  - hazard_defect_exclusion
  overwrite:
  - base_policy: hazard_evt_replacement
    superseded_clause: amount is coverage_pct percent of replacement_price (the current selling price of the same tire on the service date), rounded half up to the cent.
    replaced_by: For every replacement other than a counter replacement this policy handles and a replacement the holder authorizes in person at the store, coverage_pct, when the plan does not pay 100 percent, is the remaining usable tread (remaining_tread_32nds minus coverage_min_tread_32nds) divided by the original usable tread (hazard_msr_original_tread minus coverage_min_tread_32nds), times 100, rounded down to a whole percent, and amount is coverage_pct percent of replacement_price (the current selling price of the same tire on the service date), rounded half up to the cent; the counter replacement this policy handles, and only it, is a covered replacement that a Crestline store has already carried out at its counter on a certificate whose claim history does not yet carry it, the technician's damage reading being dated before the posting day, and the plan's share of it is the plan's share of the counter replacement, the replacement being posted as a replacement entry under a new claim number; a replacement the holder authorizes in person at the store is figured under the store-replacement authorization schedule, and the eligibility of every claim (certificate active, service within the plan term, covered damage, claims cap, commercial use, defect exclusion) stays as the base claim rules state it, commercial use being judged on the service date.
  - base_policy: hazard_evt_replacement
    superseded_clause: Otherwise coverage_pct is the remaining usable tread (remaining_tread_32nds minus coverage_min_tread_32nds) divided by the original usable tread (hazard_msr_original_tread minus coverage_min_tread_32nds), times 100, rounded down to a whole percent.
    replaced_by: For every replacement other than a counter replacement this policy handles and a replacement the holder authorizes in person at the store, coverage_pct, when the plan does not pay 100 percent, is the remaining usable tread (remaining_tread_32nds minus coverage_min_tread_32nds) divided by the original usable tread (hazard_msr_original_tread minus coverage_min_tread_32nds), times 100, rounded down to a whole percent, and amount is coverage_pct percent of replacement_price (the current selling price of the same tire on the service date), rounded half up to the cent; the counter replacement this policy handles, and only it, is a covered replacement that a Crestline store has already carried out at its counter on a certificate whose claim history does not yet carry it, the technician's damage reading being dated before the posting day, and the plan's share of it is the plan's share of the counter replacement, the replacement being posted as a replacement entry under a new claim number; a replacement the holder authorizes in person at the store is figured under the store-replacement authorization schedule, and the eligibility of every claim (certificate active, service within the plan term, covered damage, claims cap, commercial use, defect exclusion) stays as the base claim rules state it, commercial use being judged on the service date.
  trigger: state_due
  subject:
  - hazard_replacement
  computes: amount
  target_tool: post_hazard_counter_replacement_324c4972
  params:
    late_fee_lookback_months: 12
    card_points: 5
    card_points_late: 2
    rotation_lookback_months: 12
    recent_rotation_months: 6
    care_points: 3
    care_points_partial: 1
    bundle_points: 4
    plan_points: 2
    repaired_once_points: 4
    repaired_twice_points: 8
  rule: 'For every replacement other than a counter replacement this policy handles and a replacement the holder authorizes in person at the store, coverage_pct, when the plan does not pay 100 percent, is the remaining usable tread (remaining_tread_32nds minus coverage_min_tread_32nds) divided by the original usable tread (hazard_msr_original_tread minus coverage_min_tread_32nds), times 100, rounded down to a whole percent, and amount is coverage_pct percent of replacement_price (the current selling price of the same tire on the service date), rounded half up to the cent; the counter replacement this policy handles, and only it, is a covered replacement that a Crestline store has already carried out at its counter on a certificate whose claim history does not yet carry it, the technician''s damage reading being dated before the posting day, and the plan''s share of it is the plan''s share of the counter replacement, the replacement being posted as a replacement entry under a new claim number; a replacement the holder authorizes in person at the store is figured under the store-replacement authorization schedule, and the eligibility of every claim (certificate active, service within the plan term, covered damage, claims cap, commercial use, defect exclusion) stays as the base claim rules state it, commercial use being judged on the service date. The service date, wheel position, store, odometer and measured tread of the posted replacement are those of the most recent Crestline tread inspection of the covered set recorded with the wear pattern damage, which is the technician''s reading of the replaced tire. The replacement falls in the full-replacement period when, counting calendar months to the same day of the month, at least coverage_term_months minus full_replacement_months whole months remain from the service date to expiration_date, which is the same as the service date falling on or before effective_date plus full_replacement_months. The counter-replacement coverage percentage is 100 when the replacement falls in the full-replacement period and the tread worn (the tire line''s original_tread_depth_32nds in the tires charter minus the measured tread) is at most full_replacement_wear_32nds; otherwise it is the measured tread minus coverage_min_tread_32nds, times 100, divided by the tire line''s original_tread_depth_32nds minus coverage_min_tread_32nds, rounded down to a whole percent. The counter-replacement price is the covered set''s unit_price on its original tire ticket. The plan''s share of the counter replacement is the counter-replacement coverage percentage times the counter-replacement price, divided by 100 and rounded half up to the cent, rounding only this final figure. Counter-replacement price: when the covered set''s ticket was charged to a Crestline fleet account and the fleet invoice posted for the vehicle on the set''s purchase date with service category tires shows a program discount, the counter-replacement price is the unit_price less that discount divided by the ticket''s tire_count (the whole tires-invoice discount, mounting and kits included, spread over the ticket''s tires), rounded half up to the cent; when the ticket was not charged to a fleet account and carried at least the line''s set_instant_savings_min_tires tires of a line whose set_instant_savings is above zero, it is the unit_price less set_instant_savings divided by the tire_count, rounded half up to the cent; otherwise it is the covered set''s unit_price. Points added to or taken from the counter-replacement coverage percentage apply only to a prorated percentage, and a prorated percentage with every point that applies is held between 0 and 100; a counter-replacement coverage percentage of 100 under the full-replacement test stays 100. Counter-replacement card points: a holder who has a Crestline credit card account in status active and no late fee posted on their Crestline card accounts in the last late_fee_lookback_months whole calendar months
    adds card_points to the counter-replacement coverage percentage; a holder with an active Crestline card account and one or more such late fees in that period adds card_points_late; any other holder adds no card points. Counter-replacement tire-care points: a covered set with two or more Crestline rotation services in the last rotation_lookback_months whole calendar months and its most recent rotation fewer than recent_rotation_months whole months ago adds care_points to the counter-replacement coverage percentage; a set with at least one rotation in that period that has fewer than two of them or whose most recent rotation is recent_rotation_months or more whole months ago adds care_points_partial; a set with no rotation in that period adds no tire-care points. Counter-replacement bundle points: a vehicle with a Crestline alignment plan in status active that was sold on the certificate''s own purchase ticket adds bundle_points to the counter-replacement coverage percentage; a vehicle with an active Crestline alignment plan sold on a different ticket adds plan_points; a vehicle with no active alignment plan adds no bundle points. Counter-replacement repair points: a wheel position whose covered repairs (its repair entries plus its out-of-area repair reimbursement entries on the certificate) number two or more subtracts repaired_twice_points from the counter-replacement coverage percentage; a position with exactly one covered repair subtracts repaired_once_points; a position with no covered repair subtracts nothing.'
  prerequisite: []
  cross_category:
  - category: tires
    as: history
    reads:
    - tire_sets.unit_price
    - tire_sets.tire_count
    - original_tread_depth_32nds
    - set_instant_savings
    - set_instant_savings_min_tires
    - tire_events.min_tread_depth_32nds
    - tire_events.event_date
    - tire_events.tire_position
    - tire_sets.payment_method
    - tire_sets.purchase_date
    note: The technician's damage reading, the line's new tread, the ticket price and the rotation history decide the coverage percentage, the price rule and the tire-care points.
  - category: card
    as: history
    reads:
    - card_accounts.status
    - card_transactions.event_type
    note: The holder's active Crestline card and its late fees decide the card points.
  - category: alignment
    as: branch
    reads:
    - alignment_plans.status
    - alignment_plans.purchase_ticket_number
    note: An active alignment plan and the ticket it was sold on decide the bundle points.
  - category: fleet
    as: history
    reads:
    - fleet_transactions.discount_amount
    note: A fleet tires invoice discount on the set's purchase date selects the fleet net price tier of the price rule.
  compute:
  - dmg_reading: XLATEST('tires','tire_events','min_tread_depth_32nds', event_type='tires_tread_inspection', wear_pattern='damage', tire_set_id=F('tire_set_id'))
  - dmg_date: XLATEST('tires','tire_events','event_date', event_type='tires_tread_inspection', wear_pattern='damage', tire_set_id=F('tire_set_id'))
  - dmg_position: XLATEST('tires','tire_events','tire_position', event_type='tires_tread_inspection', wear_pattern='damage', tire_set_id=F('tire_set_id'))
  - line_new_tread: CPARAM('tires','original_tread_depth_32nds', tire_set_id=F('tire_set_id'))
  - ticket_unit_price: CFIELD('tires','unit_price', tire_set_id=F('tire_set_id'))
  - ticket_tire_count: CFIELD('tires','tire_count', tire_set_id=F('tire_set_id'))
  - ticket_tender: CFIELD('tires','payment_method', tire_set_id=F('tire_set_id'))
  - ticket_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', date_field='txn_date', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=CFIELD('tires','purchase_date', tire_set_id=F('tire_set_id')))
  - line_set_savings: CPARAM('tires','set_instant_savings', tire_set_id=F('tire_set_id'))
  - line_savings_min_tires: CPARAM('tires','set_instant_savings_min_tires', tire_set_id=F('tire_set_id'))
  - counter_price: RND(ticket_unit_price - ticket_fleet_discount / ticket_tire_count, 2) if (ticket_tender == 'fleet_account' and ticket_fleet_discount != None and ticket_fleet_discount > 0) else (RND(ticket_unit_price - line_set_savings / ticket_tire_count, 2) if (ticket_tender != 'fleet_account' and ticket_tire_count >= line_savings_min_tires and line_set_savings > 0) else ticket_unit_price)
  - counter_in_full_window: MONTHS(dmg_date, F('expiration_date')) >= P('coverage_term_months') - P('full_replacement_months')
  - counter_base_pct: 100 if (counter_in_full_window and line_new_tread - dmg_reading <= P('full_replacement_wear_32nds')) else (dmg_reading - P('coverage_min_tread_32nds')) * 100 // (line_new_tread - P('coverage_min_tread_32nds'))
  - active_card: CFIELD('card','card_account_id', status='active')
  - card_late_fees: XCOUNT('card','card_transactions', within_months=K('late_fee_lookback_months'), date_field='txn_date', event_type='card_late_fee')
  - counter_card_points: K('card_points') if (active_card != None and card_late_fees == 0) else (K('card_points_late') if (active_card != None and card_late_fees > 0) else 0)
  - rotations_in_lookback: XCOUNT('tires','tire_events', within_months=K('rotation_lookback_months'), event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - last_rotation: XLATEST('tires','tire_events','event_date', event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - counter_care_points: K('care_points') if (rotations_in_lookback >= 2 and MONTHS(last_rotation, NOW) < K('recent_rotation_months')) else (K('care_points_partial') if (rotations_in_lookback >= 1 and (rotations_in_lookback < 2 or MONTHS(last_rotation, NOW) >= K('recent_rotation_months'))) else 0)
  - active_alignment_ticket: CFIELD('alignment','purchase_ticket_number', vehicle_id=F('vehicle_id'), status='active')
  - counter_bundle_points: K('bundle_points') if (active_alignment_ticket != None and active_alignment_ticket == F('purchase_ticket_number')) else (K('plan_points') if (active_alignment_ticket != None and active_alignment_ticket != F('purchase_ticket_number')) else 0)
  - position_repairs: COUNT('hazard_events', event_type='hazard_repair', tire_position=dmg_position) + COUNT('hazard_events', event_type='hazard_third_party_reimbursement', reimbursement_type='repair', tire_position=dmg_position)
  - counter_repair_points: 0 - K('repaired_twice_points') if position_repairs >= 2 else (0 - K('repaired_once_points') if position_repairs == 1 else 0)
  - counter_pct: 100 if counter_base_pct == 100 else MX(0, MN(100, counter_base_pct + counter_card_points + counter_care_points + counter_bundle_points + counter_repair_points))
  - result: RND(counter_price * counter_pct / 100, 2)
  compute_basis:
    dmg_reading: The service date, wheel position, store, odometer and measured tread of the posted replacement are those of the most recent Crestline tread inspection of the covered set recorded with the wear pattern damage, which is the technician's reading of the replaced tire.
