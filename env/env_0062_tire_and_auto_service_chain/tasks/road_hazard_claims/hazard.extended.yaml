  factors:
  - id: auth_repair_route_fx
    effect: method
    decides: auth_route
    bindings:
    - position_covered_repairs
    - auth_route
    ladder:
    - when: the position's covered repairs have reached repairs_per_tire_max
      method: 'no full-replacement period: tread proration alone'
    - when: at least one covered repair on the position but fewer than repairs_per_tire_max
      method: full-replacement period cut to full_replacement_months divided by 2, rounded down
    - when: otherwise
      method: the full-replacement period of full_replacement_months
    baseline:
      auth_route: '''full'''
    evidence:
    - history
    cross_difficulty: null
  - id: auth_price_rule_fx
    effect: method
    decides: auth_price
    bindings:
    - ticket_tire_count
    - ticket_tender
    - ticket_fleet_discount
    - line_set_savings
    - line_savings_min_tires
    - auth_price
    ladder:
    - when: the ticket was charged to a Crestline fleet account and its tires invoice shows a program discount
      method: unit_price less that discount divided by tire_count, rounded half up to the cent
    - when: the ticket was not charged to a fleet account and qualified for instant savings
      method: unit_price less set_instant_savings divided by tire_count, rounded half up to the cent
    - when: otherwise
      method: the covered set's unit_price
    baseline:
      auth_price: ticket_unit_price
    evidence:
    - cross_category
    - history
    cross_difficulty: fleet
  - id: auth_fleet_points_fx
    effect: parameter
    decides: auth_fleet_points
    bindings:
    - roster_enrolled_on
    - roster_removed_on
    - roster_account
    - roster_account_status
    - fleet_price_file
    - auth_fleet_points
    ladder:
    - when: the vehicle is on the roster of an active fleet account whose program carries a national price file
      value: K('national_program_points')
    - when: the vehicle is on the roster of an active fleet account whose program has no national price file
      value: K('program_points')
    - when: otherwise
      value: '0'
    baseline:
      auth_fleet_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: fleet
  - id: auth_care_points_fx
    effect: parameter
    decides: auth_care_points
    bindings:
    - rotations_in_lookback
    - last_rotation
    - auth_care_points
    ladder:
    - when: two or more Crestline rotations in the last rotation_lookback_months months and the latest fewer than recent_rotation_months months ago
      value: K('care_points')
    - when: at least one rotation in that period but fewer than two, or the latest recent_rotation_months or more months ago
      value: K('care_points_partial')
    - when: otherwise
      value: '0'
    baseline:
      auth_care_points: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: tires
  - id: auth_card_points_fx
    effect: parameter
    decides: auth_card_points
    bindings:
    - active_card
    - card_late_fees
    - auth_card_points
    ladder:
    - when: an active Crestline card account and no late fee in the last late_fee_lookback_months months
      value: K('card_points')
    - when: an active Crestline card account and one or more late fees in that period
      value: K('card_points_late')
    - when: otherwise
      value: '0'
    baseline:
      auth_card_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  baseline:
    rule: The service date, wheel position, store, odometer and measured tread of the authorized replacement are those of the Crestline tread inspection of the covered set recorded today with the wear pattern damage. The authorized replacement falls in the full-replacement period when at least coverage_term_months minus full_replacement_months whole calendar months remain from the service date to expiration_date, counting to the same day of the month, which is the same as the service date falling on or before effective_date plus full_replacement_months. The authorization coverage percentage is 100 when the replacement falls in the full-replacement period and the tread worn (the tire line's original_tread_depth_32nds in the tires charter minus the measured tread) is at most full_replacement_wear_32nds; otherwise it is the measured tread minus coverage_min_tread_32nds, times 100, divided by original_tread_depth_32nds minus coverage_min_tread_32nds, rounded down to a whole percent. Points added to the authorization coverage percentage apply only to a prorated percentage, and a prorated percentage with every point that applies is held between 0 and 100; an authorization coverage percentage of 100 stays 100. The authorization price is the covered set's unit_price on its original tire ticket. The plan's share of the authorized replacement is the authorization coverage percentage times the authorization price, divided by 100 and rounded half up to the cent, rounding only this final figure.
    params:
    - coverage_term_months
    - full_replacement_months
    - full_replacement_wear_32nds
    - coverage_min_tread_32nds
  inputs:
    history:
    - table: hazard_events
      aggregate: count
      field: hazard_event_id
      filters:
        event_type: hazard_repair
    - table: hazard_events
      aggregate: count
      field: hazard_event_id
      filters:
        event_type: hazard_third_party_reimbursement
        reimbursement_type: repair
    - category: tires
      table: tire_events
      aggregate: latest
      field: min_tread_depth_32nds
      filters:
        event_type: tires_tread_inspection
        wear_pattern: damage
    - category: tires
      table: tire_events
      aggregate: count
      field: tire_event_id
      within_months: 12
      filters:
        event_type: tires_rotation_service
    - category: fleet
      table: fleet_transactions
      aggregate: latest
      field: discount_amount
      filters:
        event_type: fleet_invoice_posted
        service_category: tires
    - category: card
      table: card_transactions
      aggregate: count
      field: card_txn_id
      within_months: 12
      filters:
        event_type: card_late_fee
    cross_category:
    - tires
    - fleet
    - card
- id: hazard_ext_outside_repair_reimbursement
  base_policy_refs:
  - hazard_claim_coverage
  - hazard_evt_third_party_reimbursement
  - hazard_commercial_use_exclusion
  overwrite:
  - base_policy: hazard_evt_third_party_reimbursement
    superseded_clause: A repair is reimbursed at the receipt amount up to third_party_repair_reimbursement_cap.
    replaced_by: For every out-of-area repair other than the one this policy handles, the repair is reimbursed at the receipt amount up to third_party_repair_reimbursement_cap; the out-of-area repair this policy handles, and only it, is a covered tire repair the holder paid a shop outside the Crestline network for, with the damage more than out_of_area_distance_miles from the nearest Crestline store and a repair receipt that covers the out-of-area repair reimbursement, and it is reimbursed at the out-of-area repair reimbursement, commercial use being judged on the service date.
  - base_policy: hazard_evt_third_party_reimbursement
    superseded_clause: The damage must have occurred more than the out-of-area distance from the nearest Crestline store.
    replaced_by: For every out-of-area claim other than an out-of-area tire replacement reimbursed at the out-of-area reimbursement, an out-of-area tire repair reimbursed at the out-of-area repair reimbursement and an out-of-area tow reimbursed at the out-of-area tow reimbursement, the damage must have occurred more than the out-of-area distance from the nearest Crestline store; for the out-of-area tire repair this policy handles, and only for it, the damage counts as out of area when the place of the repair, as the holder reads it from the shop's receipt, lies more than out_of_area_distance_miles from the nearest Crestline store, while the out-of-area tire replacement and the out-of-area tow reimbursed that way state their own out-of-area condition.
  trigger: on_request
  subject:
  - hazard_third_party_reimbursement
  computes: amount
  target_tool: reimburse_hazard_outside_repair_444e27b0
  params:
    late_fee_lookback_months: 12
    card_uplift: 10
    card_uplift_late: 5
    national_fleet_uplift: 15
    fleet_uplift: 10
  rule: 'For every out-of-area repair other than the one this policy handles, the repair is reimbursed at the receipt amount up to third_party_repair_reimbursement_cap; the out-of-area repair this policy handles, and only it, is a covered tire repair the holder paid a shop outside the Crestline network for, with the damage more than out_of_area_distance_miles from the nearest Crestline store and a repair receipt that covers the out-of-area repair reimbursement, and it is reimbursed at the out-of-area repair reimbursement, commercial use being judged on the service date. For every out-of-area claim other than an out-of-area tire replacement reimbursed at the out-of-area reimbursement, an out-of-area tire repair reimbursed at the out-of-area repair reimbursement and an out-of-area tow reimbursed at the out-of-area tow reimbursement, the damage must have occurred more than the out-of-area distance from the nearest Crestline store; for the out-of-area tire repair this policy handles, and only for it, the damage counts as out of area when the place of the repair, as the holder reads it from the shop''s receipt, lies more than out_of_area_distance_miles from the nearest Crestline store, while the out-of-area tire replacement and the out-of-area tow reimbursed that way state their own out-of-area condition. The repair receipt covers the out-of-area repair reimbursement when the amount the holder paid the outside shop on it is at least the out-of-area repair reimbursement. An out-of-area repair is reimbursed only after the tow of the same breakdown carries its out-of-area tow reimbursement entry on the certificate, and the repair entry is booked under that tow entry''s claim number. The repair part of the out-of-area repair reimbursement is third_party_repair_reimbursement_cap. The out-of-area repair reimbursement is the repair part, held at 0.00 or more, plus every allowance and uplift that applies to it; only that sum is rounded half up to the cent, it is never below 0.00, and it is paid to the tender the certificate was bought with. Repair breakdown limit: when the most recent out-of-area tow reimbursement on the certificate by service date is dated no more than reimbursement_claim_window_days days before the reimbursement date (the tow of the same breakdown), the repair part is the lower of third_party_repair_reimbursement_cap and tow_reimbursement_cap plus third_party_repair_reimbursement_cap less the amounts of the out-of-area tow reimbursement entries on that tow''s claim number (a Crestline dispatch paid on the same claim number is not counted here); when there is no such tow but the most recent Crestline roadside service entry on the certificate by service date is dated within that window, the repair part is the lower of third_party_repair_reimbursement_cap and flat_change_cap plus third_party_repair_reimbursement_cap less the amounts of the Crestline roadside service entries on that dispatch''s claim number; otherwise the repair part stays third_party_repair_reimbursement_cap. Repair labor allowance: on a plan whose tpms_sensor_damage_covered is true, the dismount, remount and balance on the receipt are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tpms_service_kit_charge_per_tire, added to the out-of-area repair reimbursement; on a plan whose tpms_sensor_damage_covered is false and whose replacement_includes_mounting is true, at mounting_balancing_charge_per_tire; on any other plan no labor allowance is paid. Repair card uplift: a holder who has a Crestline credit card account in status active and no late fee posted on their Crestline card accounts in the last late_fee_lookback_months whole calendar months adds card_uplift to the out-of-area repair reimbursement; a holder with an active Crestline card account and one or more such late fees in that period adds card_uplift_late; any other holder adds nothing. Repair fleet uplift: a vehicle whose latest fleet_vehicle_enrolled entry has no later fleet_vehicle_removed
    entry, on a Crestline fleet account in status active whose program carries a national price file, adds national_fleet_uplift to the out-of-area repair reimbursement; such a vehicle on an active fleet account whose program has no national price file adds fleet_uplift; any other vehicle adds nothing.'
  prerequisite:
  - problem: hazard_ext_outside_tow_reimbursement
    kind: value_input
    gate: repair_part
    form: state
    policy_source: An out-of-area repair is reimbursed only after the tow of the same breakdown carries its out-of-area tow reimbursement entry on the certificate, and the repair entry is booked under that tow entry's claim number.
    condition: the certificate carries a hazard_third_party_reimbursement entry of reimbursement_type tow for the breakdown the repair belongs to, and its claim number is the one the repair entry is booked under
    resolved_by: reimburse_hazard_outside_tow_3bff1c36
    effect: the tow's reimbursed amount enters the breakdown limit the repair is held to, and the tow entry's claim number is the one the repair is booked under
  cross_category:
  - category: tires
    as: branch
    reads:
    - mounting_balancing_charge_per_tire
    - tpms_service_kit_charge_per_tire
    note: The covered line's mounting and TPMS kit charges decide the labor allowance.
  - category: card
    as: history
    reads:
    - card_accounts.status
    - card_transactions.event_type
    note: An active Crestline card and its late fees decide the card uplift.
  - category: fleet
    as: history
    reads:
    - fleet_roster_events.event_type
    - fleet_roster_events.event_date
    - fleet_roster_events.fleet_account_id
    - fleet_accounts.status
    - national_price_file
    note: The vehicle's open roster entry, its account's status and program decide the fleet uplift.
  compute:
  - line_mounting_charge: CPARAM('tires','mounting_balancing_charge_per_tire', tire_set_id=F('tire_set_id'))
  - line_tpms_kit_charge: CPARAM('tires','tpms_service_kit_charge_per_tire', tire_set_id=F('tire_set_id'))
  - repair_labor_allowance: line_mounting_charge + line_tpms_kit_charge if P('tpms_sensor_damage_covered') == True else (line_mounting_charge if (P('tpms_sensor_damage_covered') == False and P('replacement_includes_mounting') == True) else 0)
  - active_card: CFIELD('card','card_account_id', status='active')
  - card_late_fees: XCOUNT('card','card_transactions', within_months=K('late_fee_lookback_months'), date_field='txn_date', event_type='card_late_fee')
  - repair_card_uplift: K('card_uplift') if (active_card != None and card_late_fees == 0) else (K('card_uplift_late') if (active_card != None and card_late_fees > 0) else 0)
  - roster_enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
  - roster_removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
  - roster_account: XLATEST('fleet','fleet_roster_events','fleet_account_id', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
  - roster_account_status: CFIELD('fleet','status', fleet_account_id=roster_account)
  - roster_price_file: CPARAM('fleet','national_price_file', fleet_account_id=roster_account)
  - repair_fleet_uplift: K('national_fleet_uplift') if ((roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on) and roster_account_status == 'active') and roster_price_file == True) else (K('fleet_uplift') if ((roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on) and roster_account_status == 'active') and roster_price_file == False) else 0)
  - last_tow_date: LATEST('hazard_events','service_date', date_field='service_date', event_type='hazard_third_party_reimbursement', reimbursement_type='tow')
  - last_tow_claim: LATEST('hazard_events','claim_number', date_field='service_date', event_type='hazard_third_party_reimbursement', reimbursement_type='tow')
  - last_tow_paid: SUM('hazard_events','amount', event_type='hazard_third_party_reimbursement', reimbursement_type='tow', claim_number=last_tow_claim)
  - last_dispatch_date: LATEST('hazard_events','service_date', date_field='service_date', event_type='hazard_roadside_service')
  - last_dispatch_claim: LATEST('hazard_events','claim_number', date_field='service_date', event_type='hazard_roadside_service')
  - last_dispatch_paid: SUM('hazard_events','amount', event_type='hazard_roadside_service', claim_number=last_dispatch_claim)
  - repair_limit_mode: '''tow'' if (last_tow_date != None and DAYS(last_tow_date, NOW) <= P(''reimbursement_claim_window_days'')) else (''dispatch'' if (last_dispatch_date != None and DAYS(last_dispatch_date, NOW) <= P(''reimbursement_claim_window_days'')) else ''none'')'
  - repair_part: MN(P('third_party_repair_reimbursement_cap'), P('tow_reimbursement_cap') + P('third_party_repair_reimbursement_cap') - last_tow_paid) if repair_limit_mode == 'tow' else (MN(P('third_party_repair_reimbursement_cap'), P('flat_change_cap') + P('third_party_repair_reimbursement_cap') - last_dispatch_paid) if repair_limit_mode == 'dispatch' else P('third_party_repair_reimbursement_cap'))
  - result: MX(0, RND(MX(0, repair_part) + repair_labor_allowance + repair_card_uplift + repair_fleet_uplift, 2))
  compute_basis:
    line_mounting_charge: 'Repair labor allowance: on a plan whose tpms_sensor_damage_covered is true, the dismount, remount and balance on the receipt are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tpms_service_kit_charge_per_tire, added to the out-of-area repair reimbursement; on a plan whose tpms_sensor_damage_covered is false and whose replacement_includes_mounting is true, at mounting_balancing_charge_per_tire; on any other plan no labor allowance is paid.'
    line_tpms_kit_charge: 'Repair labor allowance: on a plan whose tpms_sensor_damage_covered is true, the dismount, remount and balance on the receipt are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tpms_service_kit_charge_per_tire, added to the out-of-area repair reimbursement; on a plan whose tpms_sensor_damage_covered is false and whose replacement_includes_mounting is true, at mounting_balancing_charge_per_tire; on any other plan no labor allowance is paid.'
    repair_labor_allowance: 'Repair labor allowance: on a plan whose tpms_sensor_damage_covered is true, the dismount, remount and balance on the receipt are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tpms_service_kit_charge_per_tire, added to the out-of-area repair reimbursement; on a plan whose tpms_sensor_damage_covered is false and whose replacement_includes_mounting is true, at mounting_balancing_charge_per_tire; on any other plan no labor allowance is paid.'
