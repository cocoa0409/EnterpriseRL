- id: hazard_ext_outside_tow_reimbursement
  base_policy_refs:
  - hazard_claim_coverage
  - hazard_evt_third_party_reimbursement
  - hazard_commercial_use_exclusion
  overwrite:
  - base_policy: hazard_evt_third_party_reimbursement
    superseded_clause: A tow is reimbursed up to tow_reimbursement_cap only on plans whose roadside_service_types include tow, and it uses one roadside call.
    replaced_by: For every tow other than the out-of-area tow this policy handles, a tow is reimbursed up to tow_reimbursement_cap only on plans whose roadside_service_types include tow, and it uses one roadside call; the out-of-area tow this policy handles, and only it, is a tow by an operator outside the Crestline network on a plan whose roadside_service_types include tow, with the breakdown more than out_of_area_distance_miles from the nearest Crestline store, a roadside call remaining on the certificate and a tow receipt that covers the out-of-area tow reimbursement, and it is reimbursed at the out-of-area tow reimbursement and uses one roadside call, commercial use being judged on the service date.
  - base_policy: hazard_evt_third_party_reimbursement
    superseded_clause: The damage must have occurred more than the out-of-area distance from the nearest Crestline store.
    replaced_by: For every out-of-area claim other than an out-of-area tire replacement reimbursed at the out-of-area reimbursement, an out-of-area tire repair reimbursed at the out-of-area repair reimbursement and an out-of-area tow reimbursed at the out-of-area tow reimbursement, the damage must have occurred more than the out-of-area distance from the nearest Crestline store; for the out-of-area tow this policy handles, and only for it, the damage counts as out of area when the place of the breakdown, as the holder reads it from the tow operator's receipt, lies more than out_of_area_distance_miles from the nearest Crestline store, while the out-of-area tire replacement and the out-of-area tire repair reimbursed that way state their own out-of-area condition.
  trigger: on_request
  subject:
  - hazard_third_party_reimbursement
  computes: amount
  target_tool: reimburse_hazard_outside_tow_3bff1c36
  params:
    lt_tread_32nds: 13
    lt_commercial_multiplier: 1.25
    lt_personal_multiplier: 1.1
    late_fee_lookback_months: 12
    card_uplift: 10
    card_uplift_late: 5
    national_fleet_uplift: 15
    fleet_uplift: 10
  rule: 'For every tow other than the out-of-area tow this policy handles, a tow is reimbursed up to tow_reimbursement_cap only on plans whose roadside_service_types include tow, and it uses one roadside call; the out-of-area tow this policy handles, and only it, is a tow by an operator outside the Crestline network on a plan whose roadside_service_types include tow, with the breakdown more than out_of_area_distance_miles from the nearest Crestline store, a roadside call remaining on the certificate and a tow receipt that covers the out-of-area tow reimbursement, and it is reimbursed at the out-of-area tow reimbursement and uses one roadside call, commercial use being judged on the service date. For every out-of-area claim other than an out-of-area tire replacement reimbursed at the out-of-area reimbursement, an out-of-area tire repair reimbursed at the out-of-area repair reimbursement and an out-of-area tow reimbursed at the out-of-area tow reimbursement, the damage must have occurred more than the out-of-area distance from the nearest Crestline store; for the out-of-area tow this policy handles, and only for it, the damage counts as out of area when the place of the breakdown, as the holder reads it from the tow operator''s receipt, lies more than out_of_area_distance_miles from the nearest Crestline store, while the out-of-area tire replacement and the out-of-area tire repair reimbursed that way state their own out-of-area condition. The tow receipt covers the out-of-area tow reimbursement when the amount the holder paid the tow operator on it is at least the out-of-area tow reimbursement. The tow rate is 1, and the tow allowance is tow_reimbursement_cap times the tow rate, plus every uplift that applies to it, rounded half up to the cent. The out-of-area tow reimbursement is the tow allowance less every deduction that applies to it, kept within every limit that applies to it; it is then rounded half up to the cent and held at 0.00 or more. It is paid to the tender the certificate was bought with, and the certificate''s remaining roadside calls go down by one. Tow breakdown limit: the dispatch of the same breakdown is the certificate''s most recent claim entry by service date when that entry is a Crestline roadside service entry whose service date is no more than reimbursement_claim_window_days days before the reimbursement date, and the tow is booked under that dispatch''s claim number, while a tow with no such dispatch on file opens a new claim number of its own; when that dispatch was a flat_tire_change, the amount paid on that dispatch''s claim number is deducted from the out-of-area tow reimbursement, the breakdown receiving one roadside benefit in all; when that dispatch was a tow, the out-of-area tow reimbursement is kept within tow_reimbursement_cap less the amount paid on that Crestline tow''s claim number, the breakdown receiving one tow cap in all; when there is no such dispatch, nothing is deducted and no such limit applies. Tow light-truck rate: on a Commercial LT plan (commercial_use_covered true) for a covered set of a line whose original_tread_depth_32nds is at least lt_tread_32nds (a light-truck line), the tow rate is lt_commercial_multiplier; on any other plan for a set of such a light-truck line, the tow rate is lt_personal_multiplier; on a set of any other line the tow rate stays 1. Tow card uplift: a holder who has a Crestline credit card account in status active and no late fee posted on their Crestline card accounts in the last late_fee_lookback_months whole calendar months adds card_uplift to the tow allowance; a holder with an active Crestline card account and one or more such late fees in that period adds card_uplift_late; any other holder adds nothing. Tow fleet uplift: a vehicle whose latest fleet_vehicle_enrolled entry has no later fleet_vehicle_removed entry, on a Crestline fleet account in status active whose program carries a national price file, adds national_fleet_uplift to the tow allowance;
    such a vehicle on an active fleet account whose program has no national price file adds fleet_uplift; any other vehicle adds nothing.'
  prerequisite: []
  cross_category:
  - category: tires
    as: branch
    reads:
    - original_tread_depth_32nds
    note: A light-truck line on the covered set decides the light-truck rate.
  - category: card
    as: history
    reads:
    - card_accounts.status
    - card_transactions.event_type
    note: An active Crestline card and its late fees decide the card uplift.
  - category: fleet
    as: history
    reads:
    - fleet_roster_events.event_type
    - fleet_roster_events.event_date
    - fleet_roster_events.fleet_account_id
    - fleet_accounts.status
    - national_price_file
    note: The vehicle's open roster entry, its account's status and program decide the fleet uplift.
  compute:
  - line_new_tread: CPARAM('tires','original_tread_depth_32nds', tire_set_id=F('tire_set_id'))
  - tow_rate: K('lt_commercial_multiplier') if (P('commercial_use_covered') == True and line_new_tread >= K('lt_tread_32nds')) else (K('lt_personal_multiplier') if (P('commercial_use_covered') == False and line_new_tread >= K('lt_tread_32nds')) else 1)
  - active_card: CFIELD('card','card_account_id', status='active')
  - card_late_fees: XCOUNT('card','card_transactions', within_months=K('late_fee_lookback_months'), date_field='txn_date', event_type='card_late_fee')
  - tow_card_uplift: K('card_uplift') if (active_card != None and card_late_fees == 0) else (K('card_uplift_late') if (active_card != None and card_late_fees > 0) else 0)
  - roster_enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
  - roster_removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
  - roster_account: XLATEST('fleet','fleet_roster_events','fleet_account_id', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
  - roster_account_status: CFIELD('fleet','status', fleet_account_id=roster_account)
  - roster_price_file: CPARAM('fleet','national_price_file', fleet_account_id=roster_account)
  - tow_fleet_uplift: K('national_fleet_uplift') if ((roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on) and roster_account_status == 'active') and roster_price_file == True) else (K('fleet_uplift') if ((roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on) and roster_account_status == 'active') and roster_price_file == False) else 0)
  - tow_allowance: RND(P('tow_reimbursement_cap') * tow_rate + tow_card_uplift + tow_fleet_uplift, 2)
  - last_claim_entry_type: LATEST('hazard_events','event_type', date_field='service_date')
  - last_dispatch_date: LATEST('hazard_events','service_date', date_field='service_date')
  - last_dispatch_claim: LATEST('hazard_events','claim_number', date_field='service_date')
  - last_dispatch_paid: SUM('hazard_events','amount', event_type='hazard_roadside_service', claim_number=last_dispatch_claim)
  - last_dispatch_type: LATEST('hazard_events','roadside_service_type', date_field='service_date')
  - tow_limit_mode: ('after_flat_change' if last_dispatch_type == 'flat_tire_change' else ('after_crestline_tow' if last_dispatch_type == 'tow' else 'none')) if (last_claim_entry_type == 'hazard_roadside_service' and last_dispatch_date != None and DAYS(last_dispatch_date, NOW) <= P('reimbursement_claim_window_days')) else 'none'
  - tow_deduction: last_dispatch_paid if tow_limit_mode == 'after_flat_change' else 0
  - tow_ceiling: P('tow_reimbursement_cap') - last_dispatch_paid if tow_limit_mode == 'after_crestline_tow' else None
  - result: MX(0, RND(tow_allowance - tow_deduction if tow_ceiling == None else MN(tow_allowance - tow_deduction, tow_ceiling), 2))
  compute_basis:
