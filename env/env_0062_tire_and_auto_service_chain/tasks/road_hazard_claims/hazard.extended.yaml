    rotations_in_lookback: 'Out-of-area tire-care points: a covered set with two or more Crestline rotation services in the last rotation_lookback_months whole calendar months and its most recent rotation fewer than recent_rotation_months whole months ago adds care_points to the out-of-area coverage percentage; a set with at least one rotation in that period that has fewer than two of them or whose most recent rotation is recent_rotation_months or more whole months ago adds care_points_partial; a set with no rotation in that period adds no out-of-area tire-care points.'
    care_last_rotation: 'Out-of-area tire-care points: a covered set with two or more Crestline rotation services in the last rotation_lookback_months whole calendar months and its most recent rotation fewer than recent_rotation_months whole months ago adds care_points to the out-of-area coverage percentage; a set with at least one rotation in that period that has fewer than two of them or whose most recent rotation is recent_rotation_months or more whole months ago adds care_points_partial; a set with no rotation in that period adds no out-of-area tire-care points.'
    outside_care_points: 'Out-of-area tire-care points: a covered set with two or more Crestline rotation services in the last rotation_lookback_months whole calendar months and its most recent rotation fewer than recent_rotation_months whole months ago adds care_points to the out-of-area coverage percentage; a set with at least one rotation in that period that has fewer than two of them or whose most recent rotation is recent_rotation_months or more whole months ago adds care_points_partial; a set with no rotation in that period adds no out-of-area tire-care points.'
    active_alignment_ticket: 'Out-of-area bundle points: a vehicle with a Crestline alignment plan in status active that was sold on the certificate''s own purchase ticket adds bundle_points to the out-of-area coverage percentage; a vehicle with an active Crestline alignment plan sold on a different ticket adds plan_points; a vehicle with no active alignment plan adds no out-of-area bundle points.'
    outside_bundle_points: 'Out-of-area bundle points: a vehicle with a Crestline alignment plan in status active that was sold on the certificate''s own purchase ticket adds bundle_points to the out-of-area coverage percentage; a vehicle with an active Crestline alignment plan sold on a different ticket adds plan_points; a vehicle with no active alignment plan adds no out-of-area bundle points.'
    line_mounting_charge: 'Out-of-area service allowance: on a plan whose replacement_includes_mounting and replacement_includes_valve_and_disposal are both true, the receipt''s mounting and disposal are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tire_disposal_fee_per_tire, added to the out-of-area reimbursement; on a plan whose replacement_includes_mounting is true and replacement_includes_valve_and_disposal is false, the mounting is reimbursed at mounting_balancing_charge_per_tire; on a plan that includes neither, no service allowance is paid.'
    line_disposal_fee: 'Out-of-area service allowance: on a plan whose replacement_includes_mounting and replacement_includes_valve_and_disposal are both true, the receipt''s mounting and disposal are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tire_disposal_fee_per_tire, added to the out-of-area reimbursement; on a plan whose replacement_includes_mounting is true and replacement_includes_valve_and_disposal is false, the mounting is reimbursed at mounting_balancing_charge_per_tire; on a plan that includes neither, no service allowance is paid.'
    outside_service_allowance: 'Out-of-area service allowance: on a plan whose replacement_includes_mounting and replacement_includes_valve_and_disposal are both true, the receipt''s mounting and disposal are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tire_disposal_fee_per_tire, added to the out-of-area reimbursement; on a plan whose replacement_includes_mounting is true and replacement_includes_valve_and_disposal is false, the mounting is reimbursed at mounting_balancing_charge_per_tire; on a plan that includes neither, no service allowance is paid.'
    outside_pct: Points added to the out-of-area coverage percentage apply only to a prorated percentage, and a prorated percentage with every point that applies is held between 0 and 100; an out-of-area coverage percentage of 100 stays 100.
    result: The out-of-area reimbursement is the out-of-area coverage percentage times the out-of-area reimbursement base, divided by 100, plus every allowance that applies to it, and only that sum is rounded half up to the cent; it is paid to the tender the certificate was bought with.
  factors:
  - id: outside_proration_measure_fx
    effect: method
    decides: outside_base_pct
    bindings:
    - last_rotation_odometer
    - last_rotation_date
    - set_install_odometer
    - line_warranted_miles
    - line_new_tread
    - outside_miles_pct
    - outside_base_pct
    ladder:
    - when: the covered set's most recent Crestline rotation is no more than recent_reading_days days old
      method: 'percentage figured on miles: 100 inside the period while miles driven are within the wear allowance in miles, otherwise unused warranted miles over warranted miles, rounded down'
    - when: that rotation is older than recent_reading_days days but no more than older_reading_days days
      method: the lower of the percentage figured by months and the percentage figured on miles
    - when: otherwise
      method: the percentage figured by months
    baseline:
      outside_base_pct: outside_months_basis
    evidence:
    - cross_category
    - date
    cross_difficulty: tires
  - id: outside_card_uplift_fx
    effect: parameter
    decides: outside_cap
    bindings:
    - active_card
    - card_late_fees
    - outside_cap
    ladder:
    - when: an active Crestline card account and no late fee in the last late_fee_lookback_months months
      value: P('third_party_replacement_reimbursement_cap') + K('card_cap_uplift')
    - when: an active Crestline card account and one or more late fees in that period
      value: P('third_party_replacement_reimbursement_cap') + K('card_cap_uplift_late')
    - when: otherwise
      value: P('third_party_replacement_reimbursement_cap')
    baseline:
      outside_cap: P('third_party_replacement_reimbursement_cap')
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: outside_own_price_fx
    effect: method
    decides: crestline_own_price
    bindings:
    - ticket_tire_count
    - ticket_tender
    - ticket_fleet_discount
    - line_set_savings
    - line_savings_min_tires
    - crestline_own_price
    ladder:
    - when: the ticket was charged to a Crestline fleet account and its tires invoice on the set's purchase date shows a program discount
      method: unit_price less that discount divided by tire_count, rounded half up to the cent
    - when: the ticket was not charged to a fleet account and carried at least set_instant_savings_min_tires tires of a line with set_instant_savings above zero
      method: unit_price less set_instant_savings divided by tire_count, rounded half up to the cent
    - when: otherwise
      method: the covered set's unit_price
    baseline:
      crestline_own_price: ticket_unit_price
    evidence:
    - cross_category
    cross_difficulty: tires
  - id: outside_care_points_fx
    effect: parameter
    decides: outside_care_points
    bindings:
    - rotations_in_lookback
    - care_last_rotation
    - outside_care_points
    ladder:
    - when: two or more Crestline rotations in the last rotation_lookback_months months and the latest fewer than recent_rotation_months months ago
      value: K('care_points')
    - when: at least one rotation in that period but fewer than two, or the latest recent_rotation_months or more months ago
      value: K('care_points_partial')
    - when: otherwise
      value: '0'
    baseline:
      outside_care_points: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: tires
  - id: outside_bundle_points_fx
    effect: parameter
    decides: outside_bundle_points
    bindings:
    - active_alignment_ticket
    - outside_bundle_points
    ladder:
    - when: an active Crestline alignment plan on the vehicle sold on the certificate's own purchase ticket
      value: K('bundle_points')
    - when: an active Crestline alignment plan on the vehicle sold on a different ticket
      value: K('plan_points')
    - when: otherwise
      value: '0'
    baseline:
      outside_bundle_points: '0'
    evidence:
    - cross_category
    cross_difficulty: alignment
  - id: outside_service_allowance_fx
    effect: parameter
    decides: outside_service_allowance
    bindings:
    - line_mounting_charge
    - line_disposal_fee
    - outside_service_allowance
    ladder:
    - when: the plan includes mounting and includes valve and disposal on a replacement
      value: mounting_balancing_charge_per_tire plus tire_disposal_fee_per_tire of the tire line
    - when: the plan includes mounting but not valve and disposal
      value: mounting_balancing_charge_per_tire of the tire line
    - when: otherwise
      value: '0'
    baseline:
      outside_service_allowance: '0'
    evidence:
    - tier_param
    cross_difficulty: null
  baseline:
    rule: 'The out-of-area full-replacement period is judged on the reimbursement date: the replacement is in it while fewer than full_replacement_months whole calendar months have passed from effective_date to the reimbursement date, counting to the same day of the month. The out-of-area coverage percentage is 100 inside the out-of-area full-replacement period; outside it, it is the whole calendar months remaining from the reimbursement date to expiration_date, times 100, divided by coverage_term_months, rounded down to a whole percent. Points added to the out-of-area coverage percentage apply only to a prorated percentage, and a prorated percentage with every point that applies is held between 0 and 100; an out-of-area coverage percentage of 100 stays 100. The out-of-area reimbursement base is the lower of the out-of-area cap and Crestline''s own price for the same tire; the out-of-area cap is third_party_replacement_reimbursement_cap, and Crestline''s own price for the same tire is the covered set''s unit_price on its original tire ticket. The out-of-area reimbursement is the out-of-area coverage percentage times the out-of-area reimbursement base, divided by 100, plus every allowance that applies to it, and only that sum is rounded half up to the cent; it is paid to the tender the certificate was bought with.'
    params:
    - full_replacement_months
    - coverage_term_months
    - third_party_replacement_reimbursement_cap
  inputs:
    history:
    - category: tires
      table: tire_events
      aggregate: latest
      field: odometer
      filters:
        event_type: tires_rotation_service
    - category: tires
      table: tire_events
      aggregate: count
      field: tire_event_id
      within_months: 12
      filters:
        event_type: tires_rotation_service
    - category: card
      table: card_transactions
      aggregate: count
      field: card_txn_id
      within_months: 12
      filters:
        event_type: card_late_fee
    cross_category:
    - card
    - alignment
    - tires
    - fleet
