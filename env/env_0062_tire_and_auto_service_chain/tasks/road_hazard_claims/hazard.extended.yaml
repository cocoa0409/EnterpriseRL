  rule: 'For every replacement other than the one this policy handles, the plan pays 100 percent while both hold: hazard_msr_within_full_months is true and the tread worn (hazard_msr_original_tread minus remaining_tread_32nds) is at most full_replacement_wear_32nds; for every replacement other than the one this policy handles and a counter replacement figured under the counter-posting schedule, coverage_pct, when the plan does not pay 100 percent, is the remaining usable tread (remaining_tread_32nds minus coverage_min_tread_32nds) divided by the original usable tread (hazard_msr_original_tread minus coverage_min_tread_32nds), times 100, rounded down to a whole percent, and amount is coverage_pct percent of replacement_price (the current selling price of the same tire on the service date), rounded half up to the cent; the replacement this policy handles, and only it, is a covered replacement at a Crestline store that the holder authorizes in person on the day the store''s technician inspects the damaged tire, its plan''s share being the plan''s share of the authorized replacement and it being booked as a replacement entry under a new claim number; a replacement already carried out at the counter and not yet posted is figured under the counter-posting schedule, and the eligibility of every claim (certificate active, service within the plan term, covered damage, claims cap, commercial use, defect exclusion) stays as the base claim rules state it, commercial use being judged on the service date. The holder authorizes the replacement in person through the authorization the agent hands over, at the plan''s share and coverage percentage the agent quotes. The plan''s share of an authorized store replacement is fixed only after every repair of the same wheel position that the holder paid an outside shop for and can still claim within the receipt window carries its out-of-area repair reimbursement entry on the certificate. The service date, wheel position, store, odometer and measured tread of the authorized replacement are those of the Crestline tread inspection of the covered set recorded today with the wear pattern damage. The authorized replacement falls in the full-replacement period when at least coverage_term_months minus full_replacement_months whole calendar months remain from the service date to expiration_date, counting to the same day of the month, which is the same as the service date falling on or before effective_date plus full_replacement_months. The authorization coverage percentage is 100 when the replacement falls in the full-replacement period and the tread worn (the tire line''s original_tread_depth_32nds in the tires charter minus the measured tread) is at most full_replacement_wear_32nds; otherwise it is the measured tread minus coverage_min_tread_32nds, times 100, divided by original_tread_depth_32nds minus coverage_min_tread_32nds, rounded down to a whole percent. The authorization price is the covered set''s unit_price on its original tire ticket. The plan''s share of the authorized replacement is the authorization coverage percentage times the authorization price, divided by 100 and rounded half up to the cent, rounding only this final figure. Authorization repair route: when the wheel position''s covered repairs (its repair entries plus its out-of-area repair reimbursement entries on the certificate) have reached repairs_per_tire_max, the full-replacement period does not apply and the authorization coverage percentage is the tread proration alone; when the position has at least one covered repair but fewer than repairs_per_tire_max, the full-replacement period is cut to full_replacement_months divided by 2, rounded down to whole months, so the replacement is in it only while at least coverage_term_months minus that shortened period whole months remain to expiration_date; a position with no covered repair keeps the full-replacement period unchanged. Authorization price: when the covered set''s ticket was charged
    to a Crestline fleet account and the fleet invoice posted for the vehicle on the set''s purchase date with service category tires shows a program discount, the authorization price is the unit_price less that discount divided by the ticket''s tire_count (the whole tires-invoice discount, mounting and kits included, spread over the ticket''s tires), rounded half up to the cent; when the ticket was not charged to a fleet account and carried at least the line''s set_instant_savings_min_tires tires of a line whose set_instant_savings is above zero, it is the unit_price less set_instant_savings divided by the tire_count, rounded half up to the cent; otherwise it is the covered set''s unit_price. Points added to the authorization coverage percentage apply only to a prorated percentage, and a prorated percentage with every point that applies is held between 0 and 100; an authorization coverage percentage of 100 stays 100. Authorization fleet-program points: a vehicle whose latest fleet_vehicle_enrolled entry has no later fleet_vehicle_removed entry, on a Crestline fleet account in status active whose program carries a national price file, adds national_program_points to the authorization coverage percentage; such a vehicle on an active fleet account whose program has no national price file adds program_points; any other vehicle adds no fleet-program points. Authorization tire-care points: a covered set with two or more Crestline rotation services in the last rotation_lookback_months whole calendar months and its most recent rotation fewer than recent_rotation_months whole months ago adds care_points to the authorization coverage percentage; a set with at least one rotation in that period that has fewer than two of them or whose most recent rotation is recent_rotation_months or more whole months ago adds care_points_partial; a set with no rotation in that period adds no authorization tire-care points. Authorization card points: a holder who has a Crestline credit card account in status active and no late fee posted on their Crestline card accounts in the last late_fee_lookback_months whole calendar months adds card_points to the authorization coverage percentage; a holder with an active Crestline card account and one or more such late fees in that period adds card_points_late; any other holder adds no authorization card points.'
  prerequisite:
  - problem: hazard_ext_outside_repair_reimbursement
    kind: value_input
    gate: position_covered_repairs
    form: state
    policy_source: The plan's share of an authorized store replacement is fixed only after every repair of the same wheel position that the holder paid an outside shop for and can still claim within the receipt window carries its out-of-area repair reimbursement entry on the certificate.
    condition: the certificate carries a hazard_third_party_reimbursement entry of reimbursement_type repair on the wheel position for every outside repair of that position the holder can still claim within reimbursement_claim_window_days
    resolved_by: reimburse_hazard_outside_repair_444e27b0
    effect: the reimbursed repair adds one covered repair to the position, which moves the repair route to its first tier when the position reaches repairs_per_tire_max
  cross_category:
  - category: tires
    as: history
    reads:
    - tire_sets.unit_price
    - tire_sets.tire_count
    - tire_sets.payment_method
    - tire_sets.purchase_date
    - original_tread_depth_32nds
    - set_instant_savings
    - set_instant_savings_min_tires
    - tire_events.min_tread_depth_32nds
    - tire_events.tire_position
    note: Today's damage reading, the line's new tread, the ticket and the rotation history decide the coverage, the price rule and the tire-care points.
  - category: fleet
    as: history
    reads:
    - fleet_transactions.discount_amount
    - fleet_roster_events.event_type
    - fleet_roster_events.fleet_account_id
    - fleet_accounts.status
    - national_price_file
    note: The fleet tires invoice discount decides the price rule; the roster and the program's national price file decide the fleet-program points.
  - category: card
    as: history
    reads:
    - card_accounts.status
    - card_transactions.event_type
    note: An active Crestline card and its late fees decide the authorization card points.
  compute:
  - auth_reading: XLATEST('tires','tire_events','min_tread_depth_32nds', event_type='tires_tread_inspection', wear_pattern='damage', tire_set_id=F('tire_set_id'), event_date=NOW)
  - auth_position: XLATEST('tires','tire_events','tire_position', event_type='tires_tread_inspection', wear_pattern='damage', tire_set_id=F('tire_set_id'), event_date=NOW)
  - line_new_tread: CPARAM('tires','original_tread_depth_32nds', tire_set_id=F('tire_set_id'))
  - position_covered_repairs: COUNT('hazard_events', event_type='hazard_repair', tire_position=auth_position) + COUNT('hazard_events', event_type='hazard_third_party_reimbursement', reimbursement_type='repair', tire_position=auth_position)
  - auth_route: '''none'' if position_covered_repairs >= P(''repairs_per_tire_max'') else (''half'' if position_covered_repairs >= 1 else ''full'')'
  - auth_full_months: -1 if auth_route == 'none' else (P('full_replacement_months') // 2 if auth_route == 'half' else P('full_replacement_months'))
  - auth_in_full_window: auth_full_months >= 0 and MONTHS(NOW, F('expiration_date')) >= P('coverage_term_months') - auth_full_months
  - auth_base_pct: 100 if (auth_in_full_window and line_new_tread - auth_reading <= P('full_replacement_wear_32nds')) else (auth_reading - P('coverage_min_tread_32nds')) * 100 // (line_new_tread - P('coverage_min_tread_32nds'))
  - ticket_unit_price: CFIELD('tires','unit_price', tire_set_id=F('tire_set_id'))
  - ticket_tire_count: CFIELD('tires','tire_count', tire_set_id=F('tire_set_id'))
  - ticket_tender: CFIELD('tires','payment_method', tire_set_id=F('tire_set_id'))
  - ticket_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', date_field='txn_date', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=CFIELD('tires','purchase_date', tire_set_id=F('tire_set_id')))
  - line_set_savings: CPARAM('tires','set_instant_savings', tire_set_id=F('tire_set_id'))
  - line_savings_min_tires: CPARAM('tires','set_instant_savings_min_tires', tire_set_id=F('tire_set_id'))
  - auth_price: RND(ticket_unit_price - ticket_fleet_discount / ticket_tire_count, 2) if (ticket_tender == 'fleet_account' and ticket_fleet_discount != None and ticket_fleet_discount > 0) else (RND(ticket_unit_price - line_set_savings / ticket_tire_count, 2) if (ticket_tender != 'fleet_account' and ticket_tire_count >= line_savings_min_tires and line_set_savings > 0) else ticket_unit_price)
  - roster_enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
  - roster_removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
  - roster_account: XLATEST('fleet','fleet_roster_events','fleet_account_id', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
  - roster_account_status: CFIELD('fleet','status', fleet_account_id=roster_account)
  - fleet_price_file: CPARAM('fleet','national_price_file', fleet_account_id=roster_account)
  - auth_fleet_points: K('national_program_points') if ((roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on) and roster_account_status == 'active') and fleet_price_file == True) else (K('program_points') if ((roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on) and roster_account_status == 'active') and fleet_price_file == False) else 0)
  - rotations_in_lookback: XCOUNT('tires','tire_events', within_months=K('rotation_lookback_months'), event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - last_rotation: XLATEST('tires','tire_events','event_date', event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - auth_care_points: K('care_points') if (rotations_in_lookback >= 2 and MONTHS(last_rotation, NOW) < K('recent_rotation_months')) else (K('care_points_partial') if (rotations_in_lookback >= 1 and (rotations_in_lookback < 2 or MONTHS(last_rotation, NOW) >= K('recent_rotation_months'))) else 0)
  - active_card: CFIELD('card','card_account_id', status='active')
  - card_late_fees: XCOUNT('card','card_transactions', within_months=K('late_fee_lookback_months'), date_field='txn_date', event_type='card_late_fee')
  - auth_card_points: K('card_points') if (active_card != None and card_late_fees == 0) else (K('card_points_late') if (active_card != None and card_late_fees > 0) else 0)
  - auth_pct: 100 if auth_base_pct == 100 else MX(0, MN(100, auth_base_pct + auth_fleet_points + auth_care_points + auth_card_points))
  - result: RND(auth_price * auth_pct / 100, 2)
