    - line_set_savings
    - line_savings_min_tires
    - counter_price
    ladder:
    - when: the ticket was charged to a Crestline fleet account and its tires invoice on the set's purchase date shows a program discount
      method: unit_price less that discount divided by tire_count, rounded half up to the cent
    - when: the ticket was not charged to a fleet account and carried at least set_instant_savings_min_tires tires of a line with set_instant_savings above zero
      method: unit_price less set_instant_savings divided by tire_count, rounded half up to the cent
    - when: otherwise
      method: the covered set's unit_price
    baseline:
      counter_price: ticket_unit_price
    evidence:
    - cross_category
    cross_difficulty: tires
  - id: counter_card_points_fx
    effect: parameter
    decides: counter_card_points
    bindings:
    - active_card
    - card_late_fees
    - counter_card_points
    ladder:
    - when: an active Crestline card account and no late fee in the last late_fee_lookback_months months
      value: K('card_points')
    - when: an active Crestline card account and one or more late fees in that period
      value: K('card_points_late')
    - when: otherwise
      value: '0'
    baseline:
      counter_card_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: counter_care_points_fx
    effect: parameter
    decides: counter_care_points
    bindings:
    - rotations_in_lookback
    - last_rotation
    - counter_care_points
    ladder:
    - when: two or more Crestline rotations in the last rotation_lookback_months months and the latest fewer than recent_rotation_months months ago
      value: K('care_points')
    - when: at least one rotation in that period but fewer than two, or the latest recent_rotation_months or more months ago
      value: K('care_points_partial')
    - when: otherwise
      value: '0'
    baseline:
      counter_care_points: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: tires
  - id: counter_bundle_points_fx
    effect: parameter
    decides: counter_bundle_points
    bindings:
    - active_alignment_ticket
    - counter_bundle_points
    ladder:
    - when: an active Crestline alignment plan on the vehicle sold on the certificate's own purchase ticket
      value: K('bundle_points')
    - when: an active Crestline alignment plan on the vehicle sold on a different ticket
      value: K('plan_points')
    - when: otherwise
      value: '0'
    baseline:
      counter_bundle_points: '0'
    evidence:
    - cross_category
    cross_difficulty: alignment
  - id: counter_repair_points_fx
    effect: parameter
    decides: counter_repair_points
    bindings:
    - position_repairs
    - counter_repair_points
    ladder:
    - when: two or more covered repairs on the wheel position (repair entries plus out-of-area repair reimbursement entries)
      value: 0 - K('repaired_twice_points')
    - when: exactly one covered repair on the wheel position
      value: 0 - K('repaired_once_points')
    - when: otherwise
      value: '0'
    baseline:
      counter_repair_points: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The service date, wheel position, store, odometer and measured tread of the posted replacement are those of the most recent Crestline tread inspection of the covered set recorded with the wear pattern damage, which is the technician's reading of the replaced tire. The replacement falls in the full-replacement period when, counting calendar months to the same day of the month, at least coverage_term_months minus full_replacement_months whole months remain from the service date to expiration_date, which is the same as the service date falling on or before effective_date plus full_replacement_months. The counter-replacement coverage percentage is 100 when the replacement falls in the full-replacement period and the tread worn (the tire line's original_tread_depth_32nds in the tires charter minus the measured tread) is at most full_replacement_wear_32nds; otherwise it is the measured tread minus coverage_min_tread_32nds, times 100, divided by the tire line's original_tread_depth_32nds minus coverage_min_tread_32nds, rounded down to a whole percent. Points added to or taken from the counter-replacement coverage percentage apply only to a prorated percentage, and a prorated percentage with every point that applies is held between 0 and 100; a counter-replacement coverage percentage of 100 under the full-replacement test stays 100. The counter-replacement price is the covered set's unit_price on its original tire ticket. The plan's share of the counter replacement is the counter-replacement coverage percentage times the counter-replacement price, divided by 100 and rounded half up to the cent, rounding only this final figure.
    params:
    - coverage_term_months
    - full_replacement_months
    - full_replacement_wear_32nds
    - coverage_min_tread_32nds
  inputs:
    history:
    - table: hazard_events
      aggregate: count
      field: hazard_event_id
      filters:
        event_type: hazard_repair
    - category: tires
      table: tire_events
      aggregate: latest
      field: min_tread_depth_32nds
      filters:
        event_type: tires_tread_inspection
        wear_pattern: damage
    - category: tires
      table: tire_events
      aggregate: count
      field: tire_event_id
      within_months: 12
      filters:
        event_type: tires_rotation_service
    - category: card
      table: card_transactions
      aggregate: count
      field: card_txn_id
      within_months: 12
      filters:
        event_type: card_late_fee
    - table: hazard_events
      aggregate: count
      field: hazard_event_id
      filters:
        event_type: hazard_third_party_reimbursement
        reimbursement_type: repair
    cross_category:
    - tires
    - card
    - alignment
    - fleet
- id: hazard_ext_outside_replacement_reimbursement
  base_policy_refs:
  - hazard_claim_coverage
  - hazard_evt_third_party_reimbursement
  - hazard_commercial_use_exclusion
  overwrite:
  - base_policy: hazard_evt_third_party_reimbursement
    superseded_clause: A replacement is reimbursed at coverage_pct, computed exactly as in hazard_evt_replacement from the tread on the receipt or on the surrendered tire, applied to the lower of the receipt amount and third_party_replacement_reimbursement_cap, rounded half up to the cent; a cap of 0.00 means the plan does not reimburse out-of-area replacements.
    replaced_by: For every out-of-area replacement other than the one this policy handles, the replacement is reimbursed at coverage_pct, computed exactly as in hazard_evt_replacement from the tread on the receipt or on the surrendered tire, applied to the lower of the receipt amount and third_party_replacement_reimbursement_cap, rounded half up to the cent; for every out-of-area replacement a cap of 0.00 means the plan does not reimburse out-of-area replacements; the out-of-area replacement this policy handles, and only it, is a covered tire replacement the holder bought from a shop outside the Crestline network, with the damage more than out_of_area_distance_miles from the nearest Crestline store, whose damaged tire was not surrendered to a Crestline store (a photo of it was submitted instead) and whose receipt covers the out-of-area reimbursement, and it is reimbursed at the out-of-area reimbursement, commercial use being judged on the service date.
  - base_policy: hazard_evt_third_party_reimbursement
    superseded_clause: The damage must have occurred more than the out-of-area distance from the nearest Crestline store.
    replaced_by: For every out-of-area claim other than an out-of-area tire replacement reimbursed at the out-of-area reimbursement, an out-of-area tire repair reimbursed at the out-of-area repair reimbursement and an out-of-area tow reimbursed at the out-of-area tow reimbursement, the damage must have occurred more than the out-of-area distance from the nearest Crestline store; for the out-of-area tire replacement this policy handles, and only for it, the damage counts as out of area when the place of the damage, as the holder reads it from the outside shop's receipt, lies more than out_of_area_distance_miles from the nearest Crestline store, while the out-of-area tire repair and the out-of-area tow reimbursed that way state their own out-of-area condition.
  trigger: on_request
  subject:
  - hazard_third_party_reimbursement
  computes: amount
  target_tool: reimburse_hazard_outside_replacement_5f5d3272
  params:
    recent_reading_days: 120
    older_reading_days: 365
    late_fee_lookback_months: 12
    card_cap_uplift: 50
    card_cap_uplift_late: 25
    rotation_lookback_months: 12
    recent_rotation_months: 6
    care_points: 3
    care_points_partial: 1
    bundle_points: 4
    plan_points: 2
  rule: 'For every out-of-area replacement other than the one this policy handles, the replacement is reimbursed at coverage_pct, computed exactly as in hazard_evt_replacement from the tread on the receipt or on the surrendered tire, applied to the lower of the receipt amount and third_party_replacement_reimbursement_cap, rounded half up to the cent; for every out-of-area replacement a cap of 0.00 means the plan does not reimburse out-of-area replacements; the out-of-area replacement this policy handles, and only it, is a covered tire replacement the holder bought from a shop outside the Crestline network, with the damage more than out_of_area_distance_miles from the nearest Crestline store, whose damaged tire was not surrendered to a Crestline store (a photo of it was submitted instead) and whose receipt covers the out-of-area reimbursement, and it is reimbursed at the out-of-area reimbursement, commercial use being judged on the service date. For every out-of-area claim other than an out-of-area tire replacement reimbursed at the out-of-area reimbursement, an out-of-area tire repair reimbursed at the out-of-area repair reimbursement and an out-of-area tow reimbursed at the out-of-area tow reimbursement, the damage must have occurred more than the out-of-area distance from the nearest Crestline store; for the out-of-area tire replacement this policy handles, and only for it, the damage counts as out of area when the place of the damage, as the holder reads it from the outside shop''s receipt, lies more than out_of_area_distance_miles from the nearest Crestline store, while the out-of-area tire repair and the out-of-area tow reimbursed that way state their own out-of-area condition. The receipt covers the out-of-area reimbursement when the amount the holder paid the outside shop on it is at least the out-of-area reimbursement. The out-of-area full-replacement period is judged on the reimbursement date: the replacement is in it while fewer than full_replacement_months whole calendar months have passed from effective_date to the reimbursement date, counting to the same day of the month. The out-of-area coverage percentage is 100 inside the out-of-area full-replacement period; outside it, it is the whole calendar months remaining from the reimbursement date to expiration_date, times 100, divided by coverage_term_months, rounded down to a whole percent. The out-of-area reimbursement base is the lower of the out-of-area cap and Crestline''s own price for the same tire; the out-of-area cap is third_party_replacement_reimbursement_cap, and Crestline''s own price for the same tire is the covered set''s unit_price on its original tire ticket. The out-of-area reimbursement is the out-of-area coverage percentage times the out-of-area reimbursement base, divided by 100, plus every allowance that applies to it, and only that sum is rounded half up to the cent; it is paid to the tender the certificate was bought with. Out-of-area proration measure: when the covered set''s most recent Crestline rotation service is dated no more than recent_reading_days days before the reimbursement date, the out-of-area coverage percentage is instead figured on miles, the miles driven being that rotation''s odometer less the set''s install_odometer: it is 100 inside the out-of-area full-replacement period while the miles driven are at most the tire line''s warranted_miles times full_replacement_wear_32nds divided by (original_tread_depth_32nds minus coverage_min_tread_32nds), and otherwise the warranted_miles less the miles driven, held at 0 or more, times 100, divided by warranted_miles, rounded down to a whole percent; when that rotation is older than recent_reading_days days but no more than older_reading_days days, the out-of-area coverage percentage is the lower of the percentage figured by months and the percentage figured on miles; when the set has no rotation within older_reading_days days the percentage stays as figured by months. Out-of-area card cap
    uplift: a holder who has a Crestline credit card account in status active and no late fee posted on their Crestline card accounts in the last late_fee_lookback_months whole calendar months raises the out-of-area cap by card_cap_uplift; a holder with an active Crestline card account and one or more such late fees in that period raises it by card_cap_uplift_late; any other holder keeps the out-of-area cap at third_party_replacement_reimbursement_cap. Out-of-area own-price schedule: Crestline''s own price for the same tire is the unit_price less the tires invoice discount divided by the ticket''s tire_count (the whole tires-invoice discount, mounting and kits included, spread over the ticket''s tires), rounded half up to the cent, when the covered set''s ticket was charged to a Crestline fleet account and the fleet invoice posted for the vehicle on the set''s purchase date with service category tires shows a program discount; it is the unit_price less set_instant_savings divided by the tire_count, rounded half up to the cent, when the ticket was not charged to a fleet account and carried at least the line''s set_instant_savings_min_tires tires of a line whose set_instant_savings is above zero; otherwise it is the covered set''s unit_price. Points added to the out-of-area coverage percentage apply only to a prorated percentage, and a prorated percentage with every point that applies is held between 0 and 100; an out-of-area coverage percentage of 100 stays 100. Out-of-area tire-care points: a covered set with two or more Crestline rotation services in the last rotation_lookback_months whole calendar months and its most recent rotation fewer than recent_rotation_months whole months ago adds care_points to the out-of-area coverage percentage; a set with at least one rotation in that period that has fewer than two of them or whose most recent rotation is recent_rotation_months or more whole months ago adds care_points_partial; a set with no rotation in that period adds no out-of-area tire-care points. Out-of-area bundle points: a vehicle with a Crestline alignment plan in status active that was sold on the certificate''s own purchase ticket adds bundle_points to the out-of-area coverage percentage; a vehicle with an active Crestline alignment plan sold on a different ticket adds plan_points; a vehicle with no active alignment plan adds no out-of-area bundle points. Out-of-area service allowance: on a plan whose replacement_includes_mounting and replacement_includes_valve_and_disposal are both true, the receipt''s mounting and disposal are reimbursed at the tire line''s mounting_balancing_charge_per_tire plus its tire_disposal_fee_per_tire, added to the out-of-area reimbursement; on a plan whose replacement_includes_mounting is true and replacement_includes_valve_and_disposal is false, the mounting is reimbursed at mounting_balancing_charge_per_tire; on a plan that includes neither, no service allowance is paid.'
  prerequisite: []
  cross_category:
  - category: card
    as: history
    reads:
    - card_accounts.status
    - card_transactions.event_type
    note: An active Crestline card and its late fees decide the card cap uplift.
  - category: alignment
    as: branch
    reads:
    - alignment_plans.status
    - alignment_plans.purchase_ticket_number
    note: An active alignment plan and its ticket decide the bundle points.
  - category: tires
    as: history
    reads:
    - tire_sets.unit_price
    - tire_sets.tire_count
    - tire_sets.payment_method
    - tire_sets.purchase_date
    - tire_sets.install_odometer
    - original_tread_depth_32nds
    - warranted_miles
    - set_instant_savings
    - set_instant_savings_min_tires
    - mounting_balancing_charge_per_tire
    - tire_disposal_fee_per_tire
    - tire_events.odometer
    - tire_events.event_date
    note: The set's latest rotation odometer against the line's warranted miles decides the proration measure; the ticket decides Crestline's own price; the line's charges decide the service allowance; the rotation history decides the tire-care points.
  - category: fleet
    as: history
    reads:
    - fleet_transactions.discount_amount
    note: A fleet tires invoice discount on the set's purchase date selects the fleet net own price.
  compute:
  - outside_in_full_window: MONTHS(F('effective_date'), NOW) < P('full_replacement_months')
  - outside_months_pct: MONTHS(NOW, F('expiration_date')) * 100 // P('coverage_term_months')
  - outside_months_basis: 100 if outside_in_full_window else outside_months_pct
  - last_rotation_odometer: XLATEST('tires','tire_events','odometer', event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - last_rotation_date: XLATEST('tires','tire_events','event_date', event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - set_install_odometer: CFIELD('tires','install_odometer', tire_set_id=F('tire_set_id'))
  - line_warranted_miles: CPARAM('tires','warranted_miles', tire_set_id=F('tire_set_id'))
  - line_new_tread: CPARAM('tires','original_tread_depth_32nds', tire_set_id=F('tire_set_id'))
  - outside_miles_pct: (100 if (outside_in_full_window and last_rotation_odometer - set_install_odometer <= line_warranted_miles * P('full_replacement_wear_32nds') / (line_new_tread - P('coverage_min_tread_32nds'))) else MX(0, line_warranted_miles - (last_rotation_odometer - set_install_odometer)) * 100 // line_warranted_miles) if last_rotation_odometer != None else outside_months_basis
  - outside_base_pct: outside_miles_pct if (last_rotation_date != None and DAYS(last_rotation_date, NOW) <= K('recent_reading_days')) else (MN(outside_months_basis, outside_miles_pct) if (last_rotation_date != None and DAYS(last_rotation_date, NOW) > K('recent_reading_days') and DAYS(last_rotation_date, NOW) <= K('older_reading_days')) else outside_months_basis)
  - active_card: CFIELD('card','card_account_id', status='active')
  - card_late_fees: XCOUNT('card','card_transactions', within_months=K('late_fee_lookback_months'), date_field='txn_date', event_type='card_late_fee')
  - outside_cap: P('third_party_replacement_reimbursement_cap') + K('card_cap_uplift') if (active_card != None and card_late_fees == 0) else (P('third_party_replacement_reimbursement_cap') + K('card_cap_uplift_late') if (active_card != None and card_late_fees > 0) else P('third_party_replacement_reimbursement_cap'))
  - ticket_unit_price: CFIELD('tires','unit_price', tire_set_id=F('tire_set_id'))
  - ticket_tire_count: CFIELD('tires','tire_count', tire_set_id=F('tire_set_id'))
  - ticket_tender: CFIELD('tires','payment_method', tire_set_id=F('tire_set_id'))
  - ticket_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', date_field='txn_date', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=CFIELD('tires','purchase_date', tire_set_id=F('tire_set_id')))
  - line_set_savings: CPARAM('tires','set_instant_savings', tire_set_id=F('tire_set_id'))
  - line_savings_min_tires: CPARAM('tires','set_instant_savings_min_tires', tire_set_id=F('tire_set_id'))
  - crestline_own_price: RND(ticket_unit_price - ticket_fleet_discount / ticket_tire_count, 2) if (ticket_tender == 'fleet_account' and ticket_fleet_discount != None and ticket_fleet_discount > 0) else (RND(ticket_unit_price - line_set_savings / ticket_tire_count, 2) if (ticket_tender != 'fleet_account' and ticket_tire_count >= line_savings_min_tires and line_set_savings > 0) else ticket_unit_price)
  - outside_price_basis: MN(outside_cap, crestline_own_price)
  - rotations_in_lookback: XCOUNT('tires','tire_events', within_months=K('rotation_lookback_months'), event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - care_last_rotation: XLATEST('tires','tire_events','event_date', event_type='tires_rotation_service', tire_set_id=F('tire_set_id'))
  - outside_care_points: K('care_points') if (rotations_in_lookback >= 2 and MONTHS(care_last_rotation, NOW) < K('recent_rotation_months')) else (K('care_points_partial') if (rotations_in_lookback >= 1 and (rotations_in_lookback < 2 or MONTHS(care_last_rotation, NOW) >= K('recent_rotation_months'))) else 0)
  - active_alignment_ticket: CFIELD('alignment','purchase_ticket_number', vehicle_id=F('vehicle_id'), status='active')
  - outside_bundle_points: K('bundle_points') if (active_alignment_ticket != None and active_alignment_ticket == F('purchase_ticket_number')) else (K('plan_points') if (active_alignment_ticket != None and active_alignment_ticket != F('purchase_ticket_number')) else 0)
  - line_mounting_charge: CPARAM('tires','mounting_balancing_charge_per_tire', tire_set_id=F('tire_set_id'))
  - line_disposal_fee: CPARAM('tires','tire_disposal_fee_per_tire', tire_set_id=F('tire_set_id'))
  - outside_service_allowance: line_mounting_charge + line_disposal_fee if (P('replacement_includes_mounting') == True and P('replacement_includes_valve_and_disposal') == True) else (line_mounting_charge if (P('replacement_includes_mounting') == True and P('replacement_includes_valve_and_disposal') == False) else 0)
  - outside_pct: 100 if outside_base_pct == 100 else MX(0, MN(100, outside_base_pct + outside_care_points + outside_bundle_points))
  - result: RND(outside_price_basis * outside_pct / 100 + outside_service_allowance, 2)
  compute_basis:
    outside_in_full_window: 'The out-of-area full-replacement period is judged on the reimbursement date: the replacement is in it while fewer than full_replacement_months whole calendar months have passed from effective_date to the reimbursement date, counting to the same day of the month.'
    outside_months_pct: The out-of-area coverage percentage is 100 inside the out-of-area full-replacement period; outside it, it is the whole calendar months remaining from the reimbursement date to expiration_date, times 100, divided by coverage_term_months, rounded down to a whole percent.
    outside_months_basis: The out-of-area coverage percentage is 100 inside the out-of-area full-replacement period; outside it, it is the whole calendar months remaining from the reimbursement date to expiration_date, times 100, divided by coverage_term_months, rounded down to a whole percent.
    last_rotation_odometer: 'Out-of-area proration measure: when the covered set''s most recent Crestline rotation service is dated no more than recent_reading_days days before the reimbursement date, the out-of-area coverage percentage is instead figured on miles, the miles driven being that rotation''s odometer less the set''s install_odometer: it is 100 inside the out-of-area full-replacement period while the miles driven are at most the tire line''s warranted_miles times full_replacement_wear_32nds divided by (original_tread_depth_32nds minus coverage_min_tread_32nds), and otherwise the warranted_miles less the miles driven, held at 0 or more, times 100, divided by warranted_miles, rounded down to a whole percent; when that rotation is older than recent_reading_days days but no more than older_reading_days days, the out-of-area coverage percentage is the lower of the percentage figured by months and the percentage figured on miles; when the set has no rotation within older_reading_days days the percentage stays as figured by months.'
    last_rotation_date: 'Out-of-area proration measure: when the covered set''s most recent Crestline rotation service is dated no more than recent_reading_days days before the reimbursement date, the out-of-area coverage percentage is instead figured on miles, the miles driven being that rotation''s odometer less the set''s install_odometer: it is 100 inside the out-of-area full-replacement period while the miles driven are at most the tire line''s warranted_miles times full_replacement_wear_32nds divided by (original_tread_depth_32nds minus coverage_min_tread_32nds), and otherwise the warranted_miles less the miles driven, held at 0 or more, times 100, divided by warranted_miles, rounded down to a whole percent; when that rotation is older than recent_reading_days days but no more than older_reading_days days, the out-of-area coverage percentage is the lower of the percentage figured by months and the percentage figured on miles; when the set has no rotation within older_reading_days days the percentage stays as figured by months.'
    set_install_odometer: 'Out-of-area proration measure: when the covered set''s most recent Crestline rotation service is dated no more than recent_reading_days days before the reimbursement date, the out-of-area coverage percentage is instead figured on miles, the miles driven being that rotation''s odometer less the set''s install_odometer: it is 100 inside the out-of-area full-replacement period while the miles driven are at most the tire line''s warranted_miles times full_replacement_wear_32nds divided by (original_tread_depth_32nds minus coverage_min_tread_32nds), and otherwise the warranted_miles less the miles driven, held at 0 or more, times 100, divided by warranted_miles, rounded down to a whole percent; when that rotation is older than recent_reading_days days but no more than older_reading_days days, the out-of-area coverage percentage is the lower of the percentage figured by months and the percentage figured on miles; when the set has no rotation within older_reading_days days the percentage stays as figured by months.'
    line_warranted_miles: 'Out-of-area proration measure: when the covered set''s most recent Crestline rotation service is dated no more than recent_reading_days days before the reimbursement date, the out-of-area coverage percentage is instead figured on miles, the miles driven being that rotation''s odometer less the set''s install_odometer: it is 100 inside the out-of-area full-replacement period while the miles driven are at most the tire line''s warranted_miles times full_replacement_wear_32nds divided by (original_tread_depth_32nds minus coverage_min_tread_32nds), and otherwise the warranted_miles less the miles driven, held at 0 or more, times 100, divided by warranted_miles, rounded down to a whole percent; when that rotation is older than recent_reading_days days but no more than older_reading_days days, the out-of-area coverage percentage is the lower of the percentage figured by months and the percentage figured on miles; when the set has no rotation within older_reading_days days the percentage stays as figured by months.'
    line_new_tread: 'Out-of-area proration measure: when the covered set''s most recent Crestline rotation service is dated no more than recent_reading_days days before the reimbursement date, the out-of-area coverage percentage is instead figured on miles, the miles driven being that rotation''s odometer less the set''s install_odometer: it is 100 inside the out-of-area full-replacement period while the miles driven are at most the tire line''s warranted_miles times full_replacement_wear_32nds divided by (original_tread_depth_32nds minus coverage_min_tread_32nds), and otherwise the warranted_miles less the miles driven, held at 0 or more, times 100, divided by warranted_miles, rounded down to a whole percent; when that rotation is older than recent_reading_days days but no more than older_reading_days days, the out-of-area coverage percentage is the lower of the percentage figured by months and the percentage figured on miles; when the set has no rotation within older_reading_days days the percentage stays as figured by months.'
