    replaced_by: For every holder's cancellation that falls to the pro_rata basis other than the one this policy handles, the refund is the certificate price (price_per_tire times covered_tire_count) times hazard_msr_unexpired_months divided by coverage_term_months, rounded half up to the cent, minus cancellation_admin_fee, minus hazard_msr_benefits_paid when refund_reduced_by_claims is true, and never below 0.00; the cancellation this policy handles, and only it, is a holder's cancellation of an active Crestline Road Hazard Life-of-Tread Protection certificate bought in cash, by debit card or on a bank credit card that falls to the pro_rata basis (no void_before_install, covered_set_returned or full_refund_window refund applies), and its refund is the Life-of-Tread cancellation refund.
  trigger: on_request
  subject:
  - hazard_cancellation
  - hazard_cancellation_refund
  computes: refund_amount
  target_tool: confirm_life_of_tread_cancellation_58ab2fcf
  params:
    day_basis_months: 12
    thirty_day_basis_months: 36
    tread_reading_months: 6
    low_tread_share: 0.2
    mid_tread_share: 0.4
    low_tread_factor: 0.7
    mid_tread_factor: 0.9
    late_fee_lookback_months: 12
    cardholder_fee: 12.5
    unused_call_credit: 10
    partly_used_call_credit: 5
    ticket_bundle_clawback: 20
    linked_bundle_clawback: 10
    linked_bundle_days: 30
  rule: 'For every holder''s cancellation that falls to the pro_rata basis other than the one this policy handles, the refund is the certificate price (price_per_tire times covered_tire_count) times hazard_msr_unexpired_months divided by coverage_term_months, rounded half up to the cent, minus cancellation_admin_fee, minus hazard_msr_benefits_paid when refund_reduced_by_claims is true, and never below 0.00; the cancellation this policy handles, and only it, is a holder''s cancellation of an active Crestline Road Hazard Life-of-Tread Protection certificate bought in cash, by debit card or on a bank credit card that falls to the pro_rata basis (no void_before_install, covered_set_returned or full_refund_window refund applies), and its refund is the Life-of-Tread cancellation refund. For every cancellation other than a Life-of-Tread cancellation this policy handles, the cancellation is the holder''s own decision: the agent registers the request and the holder confirms it; for a Life-of-Tread cancellation this policy handles, and only for it, the holder confirms in person through the confirmation the agent hands over, which confirms the cancellation request awaiting the holder''s confirmation on the certificate, or records one as confirmed when none is on file, and completes the cancellation at once, the certificate''s status becoming cancelled with the confirmation date as closed_date. The Life-of-Tread cancellation refund is fixed only after every tire that a Crestline technician''s inspection recorded as damaged on the covered set during the term carries its replacement entry on the certificate. The Life-of-Tread cancellation refund is not paid until every out-of-area tire replacement that the holder can still claim within the receipt window carries its out-of-area replacement reimbursement entry on the certificate. The Life-of-Tread counting date is the cancellation date, and the Life-of-Tread unused share is the whole calendar months remaining from the counting date to expiration_date, a partial month not counted, divided by coverage_term_months. The Life-of-Tread prorated amount is the certificate price (price_per_tire times covered_tire_count) times the Life-of-Tread unused share, rounded half up to the cent. The Life-of-Tread cancellation fee is cancellation_admin_fee. The Life-of-Tread cancellation refund is the Life-of-Tread prorated amount minus the Life-of-Tread cancellation fee minus every benefit paid on the certificate (the amounts of its replacement, out-of-area reimbursement and roadside service entries); after every addition to it and deduction from it that applies, it is rounded half up to the cent and held at 0.00 or more, and it is paid to the tender the certificate was bought with. Life-of-Tread clock start: when the covered vehicle has a fleet_vehicle_enrolled entry on a Crestline fleet account roster that no later fleet_vehicle_removed entry has ended, the Life-of-Tread counting date is instead that enrollment date, the day the consumer plan stopped covering a vehicle in commercial use; when the vehicle has no such open enrollment and the certificate carries a cancellation request still awaiting the holder''s confirmation, it is the date that request was registered; otherwise it stays the cancellation date. Life-of-Tread day count: when fewer than day_basis_months whole calendar months have passed from effective_date to the cancellation date, the Life-of-Tread unused share is the actual days from the counting date to expiration_date divided by the actual days from effective_date to expiration_date; when at least day_basis_months but fewer than thirty_day_basis_months whole months have passed to the cancellation date, it is the whole 30-day periods from the counting date to expiration_date divided by coverage_term_months; otherwise it is the whole calendar months from the counting date to expiration_date divided by coverage_term_months. Life-of-Tread tread-life factor: when the covered set''s most recent Crestline
    routine tread inspection (wear pattern even) is fewer than tread_reading_months whole calendar months old and its usable-tread share (the reading minus coverage_min_tread_32nds, divided by the tire line''s original_tread_depth_32nds minus coverage_min_tread_32nds) is at most low_tread_share, the Life-of-Tread unused share is multiplied by low_tread_factor in the prorated amount; when such a recent reading has a usable-tread share above low_tread_share and at most mid_tread_share, it is multiplied by mid_tread_factor; otherwise it is multiplied by 1. Life-of-Tread cancellation fee schedule: a holder who has a Crestline credit card account in status active and no late fee posted on their Crestline card accounts in the last late_fee_lookback_months whole calendar months pays no Life-of-Tread cancellation fee; a holder with an active Crestline card account and one or more such late fees pays cardholder_fee; any other holder pays cancellation_admin_fee. Life-of-Tread unused-call credit: when the certificate still has roadside calls remaining and no roadside service entry was ever booked on it, each remaining call is credited at unused_call_credit and the credit is added to the Life-of-Tread cancellation refund; when calls remain and at least one roadside service entry was booked, each remaining call is credited at partly_used_call_credit and added the same way; with no call remaining there is no credit; the calls themselves still lapse with the certificate. Life-of-Tread bundle clawback: when the vehicle has a Crestline alignment plan in status active that was sold on the certificate''s own purchase ticket, ticket_bundle_clawback is taken back from the refund; when the active alignment plan was sold on another ticket dated no more than linked_bundle_days days from the certificate''s purchase_date, linked_bundle_clawback is taken back; otherwise nothing is taken back.'
  prerequisite:
  - problem: hazard_ext_counter_replacement_posting
    kind: value_input
    gate: benefits_paid
    form: state
    policy_source: The Life-of-Tread cancellation refund is fixed only after every tire that a Crestline technician's inspection recorded as damaged on the covered set during the term carries its replacement entry on the certificate.
    condition: every tires_tread_inspection with wear_pattern damage recorded on the covered set during the term is matched by a hazard_replacement entry on the certificate
    resolved_by: post_hazard_counter_replacement_324c4972
    effect: the posted replacement's plan share enters the benefits paid that the Life-of-Tread cancellation refund deducts
  - problem: hazard_ext_outside_replacement_reimbursement
    kind: value_input
    gate: benefits_paid
    form: state
    policy_source: The Life-of-Tread cancellation refund is not paid until every out-of-area tire replacement that the holder can still claim within the receipt window carries its out-of-area replacement reimbursement entry on the certificate.
    condition: every out-of-area tire replacement the holder can still claim within reimbursement_claim_window_days carries a hazard_third_party_reimbursement entry of reimbursement_type replacement on the certificate
    resolved_by: reimburse_hazard_outside_replacement_5f5d3272
    effect: the reimbursed amount enters the benefits paid that the Life-of-Tread cancellation refund deducts
  cross_category:
  - category: fleet
    as: history
    reads:
    - fleet_roster_events.event_type
    - fleet_roster_events.event_date
    note: An open fleet roster enrollment of the covered vehicle decides the clock start.
  - category: tires
    as: history
    reads:
    - tire_events.min_tread_depth_32nds
    - tire_events.event_date
    - original_tread_depth_32nds
    note: The set's latest routine tread reading against the line's new tread decides the tread-life factor.
  - category: card
    as: history
    reads:
    - card_accounts.status
    - card_transactions.event_type
    note: An active Crestline card and its late fees decide the cancellation fee.
  - category: alignment
    as: branch
    reads:
    - alignment_plans.status
    - alignment_plans.purchase_ticket_number
    - alignment_plans.purchase_date
    note: An active alignment plan sold with the certificate decides the bundle clawback.
  compute:
  - certificate_price: F('price_per_tire') * F('covered_tire_count')
  - roster_enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
  - roster_removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
  - pending_request_on: LATEST('hazard_cancellation_requests','created_at', date_field='created_at', request_status='pending_customer_confirmation')
  - refund_count_from: roster_enrolled_on if (roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on)) else (pending_request_on if (pending_request_on != None and not (roster_enrolled_on != None and (roster_removed_on == None or roster_removed_on < roster_enrolled_on))) else NOW)
  - refund_months_in_force: MONTHS(F('effective_date'), NOW)
  - refund_day_basis: '''days'' if refund_months_in_force < K(''day_basis_months'') else (''thirty_day'' if refund_months_in_force < K(''thirty_day_basis_months'') else ''months'')'
  - refund_unused_share: DAYS(refund_count_from, F('expiration_date')) / DAYS(F('effective_date'), F('expiration_date')) if refund_day_basis == 'days' else ((DAYS(refund_count_from, F('expiration_date')) // 30) / P('coverage_term_months') if refund_day_basis == 'thirty_day' else MONTHS(refund_count_from, F('expiration_date')) / P('coverage_term_months'))
  - routine_reading: XLATEST('tires','tire_events','min_tread_depth_32nds', event_type='tires_tread_inspection', wear_pattern='even', tire_set_id=F('tire_set_id'))
  - routine_reading_date: XLATEST('tires','tire_events','event_date', event_type='tires_tread_inspection', wear_pattern='even', tire_set_id=F('tire_set_id'))
  - line_new_tread: CPARAM('tires','original_tread_depth_32nds', tire_set_id=F('tire_set_id'))
  - usable_tread_share: (routine_reading - P('coverage_min_tread_32nds')) / (line_new_tread - P('coverage_min_tread_32nds')) if routine_reading != None else 1
  - refund_tread_factor: K('low_tread_factor') if (routine_reading != None and MONTHS(routine_reading_date, NOW) < K('tread_reading_months') and usable_tread_share <= K('low_tread_share')) else (K('mid_tread_factor') if (routine_reading != None and MONTHS(routine_reading_date, NOW) < K('tread_reading_months') and usable_tread_share > K('low_tread_share') and usable_tread_share <= K('mid_tread_share')) else 1)
  - refund_prorated: RND(certificate_price * refund_unused_share * refund_tread_factor, 2)
  - active_card: CFIELD('card','card_account_id', status='active')
  - card_late_fees: XCOUNT('card','card_transactions', within_months=K('late_fee_lookback_months'), date_field='txn_date', event_type='card_late_fee')
  - refund_fee: 0 if (active_card != None and card_late_fees == 0) else (K('cardholder_fee') if (active_card != None and card_late_fees > 0) else P('cancellation_admin_fee'))
  - benefits_paid: SUM('hazard_events','amount', event_type='hazard_replacement') + SUM('hazard_events','amount', event_type='hazard_third_party_reimbursement') + SUM('hazard_events','amount', event_type='hazard_roadside_service')
  - roadside_calls_used: COUNT('hazard_events', event_type='hazard_roadside_service')
  - refund_call_credit: F('roadside_calls_remaining') * K('unused_call_credit') if (F('roadside_calls_remaining') > 0 and roadside_calls_used == 0) else (F('roadside_calls_remaining') * K('partly_used_call_credit') if (F('roadside_calls_remaining') > 0 and roadside_calls_used > 0) else 0)
  - active_alignment_ticket: CFIELD('alignment','purchase_ticket_number', vehicle_id=F('vehicle_id'), status='active')
  - active_alignment_bought_on: CFIELD('alignment','purchase_date', vehicle_id=F('vehicle_id'), status='active')
  - refund_bundle_clawback: K('ticket_bundle_clawback') if (active_alignment_ticket != None and active_alignment_ticket == F('purchase_ticket_number')) else (K('linked_bundle_clawback') if (active_alignment_ticket != None and active_alignment_ticket != F('purchase_ticket_number') and ABS(DAYS(F('purchase_date'), active_alignment_bought_on)) <= K('linked_bundle_days')) else 0)
  - result: MX(0, RND(refund_prorated - refund_fee - benefits_paid + refund_call_credit - refund_bundle_clawback, 2))
