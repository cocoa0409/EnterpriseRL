extended_policies:
- id: hazard_ext_lot_cancellation_refund
  base_policy_refs:
  - hazard_evt_cancellation_refund
  overwrite:
  - base_policy: hazard_evt_cancellation_refund
    superseded_clause: 'The cancellation is the holder''s own decision: the agent registers the request and the holder confirms it.'
    replaced_by: 'For every cancellation other than a Life-of-Tread cancellation this policy handles, the cancellation is the holder''s own decision: the agent registers the request and the holder confirms it; for a Life-of-Tread cancellation this policy handles, and only for it, the holder confirms in person through the confirmation the agent hands over, which confirms the cancellation request awaiting the holder''s confirmation on the certificate, or records one as confirmed when none is on file, and completes the cancellation at once, the certificate''s status becoming cancelled with the confirmation date as closed_date.'
  - base_policy: hazard_evt_cancellation_refund
