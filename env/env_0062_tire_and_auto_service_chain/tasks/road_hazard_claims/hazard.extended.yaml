    line_set_savings: 'Out-of-area own-price schedule: Crestline''s own price for the same tire is the unit_price less the tires invoice discount divided by the ticket''s tire_count (the whole tires-invoice discount, mounting and kits included, spread over the ticket''s tires), rounded half up to the cent, when the covered set''s ticket was charged to a Crestline fleet account and the fleet invoice posted for the vehicle on the set''s purchase date with service category tires shows a program discount; it is the unit_price less set_instant_savings divided by the tire_count, rounded half up to the cent, when the ticket was not charged to a fleet account and carried at least the line''s set_instant_savings_min_tires tires of a line whose set_instant_savings is above zero; otherwise it is the covered set''s unit_price.'
