      rule: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set. The tire line is the store's selling price of the same tire recorded on the set's latest treadwear adjustment. The credit applied is the smaller of the credit remaining and the tire line; a set with no treadwear adjustment entry has no credit and no recorded selling price, and both count as 0. The mounting line is mounting_balancing_charge_per_tire. The replacement ticket balance is the tire line less the credit applied, plus the mounting line, plus tire_disposal_fee_per_tire, rounded half up to the cent; it is figured before tax.
