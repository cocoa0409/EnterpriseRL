  - id: tires_ext_lapsed_order_refund
    base_policy_refs:
      - tires_evt_order_cancellation
      - tires_evt_satisfaction_trial
      - tires_refund_tender
      - tires_purchase_ticket
      - tires_evt_installation_booking
    overwrite:
      - base_policy: tires_evt_order_cancellation
        superseded_clause: The refund is the pre-tax ticket total computed under tires_purchase_ticket, less a restocking fee of special_order_restocking_fee_pct percent of tire_count times unit_price, rounded half up to the cent; the restocking fee applies both to a customer-requested cancellation and to a hold-period lapse, and is not withheld when the line's special_order_restocking_fee_pct is 0.
        replaced_by: The refund is the pre-tax ticket total computed under tires_purchase_ticket, less a restocking fee of special_order_restocking_fee_pct percent of tire_count times unit_price, rounded half up to the cent, for a customer-requested cancellation, and the restocking fee is not withheld when the line's special_order_restocking_fee_pct is 0; for a lapsed-order refund this policy pays on an ordered set the store cancels because its hold period lapsed, the refund is the tire price paid less the restocking fee, less every other charge this policy states and plus every relief it gives, each worked out on its own, the restocking fee less its reliefs never below 0, rounded half up to the cent.
      - base_policy: tires_purchase_ticket
        superseded_clause: The pre-tax ticket total is tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the tpms_service_kit_charge_per_tire when the vehicle's tpms_type is direct or otherwise the valve_stem_charge_per_tire, plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when tire_count is at least set_instant_savings_min_tires.
        replaced_by: The pre-tax ticket total is tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the tpms_service_kit_charge_per_tire when the vehicle's tpms_type is direct or otherwise the valve_stem_charge_per_tire, plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when tire_count is at least set_instant_savings_min_tires, for every ticket other than the ticket of an ordered set the store cancels because its hold period lapsed and other than a one-tire replacement ticket written against a treadwear adjustment credit; the ticket of an ordered set this policy cancels because its hold period lapsed carries the tire price paid alone, because the mounting, the valve-stem or TPMS-kit charge and the disposal fee are rung when the tires are mounted; a one-tire replacement ticket written against a treadwear adjustment credit carries the balance figured under that ticket's own rule.
    trigger: state_due
    subject:
      - tires_order_cancellation
      - tires_refund
    computes: amount
    target_tool: cancel_lapsed_tire_order_8987209f
    params:
      fleet_active_relief_pct: 20
      fleet_inactive_relief_pct: 10
      long_storage_days: 6
      truck_line_min_depth_32nds: 14
      long_hold_overrun_days: 28
      truck_storage_surcharge_per_tire: 2.0
      long_hold_storage_surcharge_per_tire: 1.0
      standard_weekly_storage_per_tire: 2.0
      single_missed_slot_charge: 10.0
      repeat_missed_slot_charge: 20.0
    rule: 'A lapsed-order refund is worked out for an ordered set the store cancels because it was still not mounted after order_hold_days counted from purchase_date, from the set''s ticket, its installation bookings and the vehicle''s fleet enrollment. The tire price paid is tire_count times unit_price, less set_instant_savings when tire_count is at least set_instant_savings_min_tires, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date when the ticket was charged to a fleet account. The restocking fee is special_order_restocking_fee_pct percent of the tire price paid. The days past hold are the calendar days from purchase_date plus order_hold_days to today. The storage charge is standard_weekly_storage_per_tire times tire_count for every whole week past hold. The lapsed-order refund is the tire price paid less the restocking fee and the storage charge, rounded half up to the cent, and goes back to the tender that paid the ticket. The fleet discount on a tires invoice is one percentage taken on every discountable line of the ticket, the tire price, the mounting and the valve-stem or TPMS-kit lines alike; wherever the tire price paid takes it off, the whole discount_amount of that invoice is counted against the tire price, the part taken on the mounting and kit lines included, because those lines are never figured below the line''s own charges here, and a ticket of an ordered set carries the tire price alone. The refund is the pre-tax ticket total computed under tires_purchase_ticket, less a restocking fee of special_order_restocking_fee_pct percent of tire_count times unit_price, rounded half up to the cent, for a customer-requested cancellation, and the restocking fee is not withheld when the line''s special_order_restocking_fee_pct is 0; for a lapsed-order refund this policy pays on an ordered set the store cancels because its hold period lapsed, the refund is the tire price paid less the restocking fee, less every other charge this policy states and plus every relief it gives, each worked out on its own, the restocking fee less its reliefs never below 0, rounded half up to the cent. The pre-tax ticket total is tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the tpms_service_kit_charge_per_tire when the vehicle''s tpms_type is direct or otherwise the valve_stem_charge_per_tire, plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when tire_count is at least set_instant_savings_min_tires, for every ticket other than the ticket of an ordered set the store cancels because its hold period lapsed and other than a one-tire replacement ticket written against a treadwear adjustment credit; the ticket of an ordered set this policy cancels because its hold period lapsed carries the tire price paid alone, because the mounting, the valve-stem or TPMS-kit charge and the disposal fee are rung when the tires are mounted; a one-tire replacement ticket written against a treadwear adjustment credit carries the balance figured under that ticket''s own rule. The restocking rate follows the order''s installation bookings: an order for which no installation appointment was ever booked pays no restocking fee; an order with exactly one booked appointment pays half of special_order_restocking_fee_pct; an order booked more than once pays special_order_restocking_fee_pct; the restocking fee is that rate percent of the tire price paid. The fleet restocking relief follows the vehicle''s fleet enrollment: an order for a vehicle enrolled today on the roster of an active Crestline fleet account is relieved of fleet_active_relief_pct percent of the line''s full restocking fee, special_order_restocking_fee_pct percent of the tire price paid; an order for a vehicle enrolled today on the roster of a fleet account that is not active is relieved of fleet_inactive_relief_pct percent of it; any other order is relieved of nothing. The storage charge follows how long the order sat past its hold, at standard_weekly_storage_per_tire times tire_count a week: an order 1 to long_storage_days days past hold pays one week of storage, however few days it sat; an order more than long_hold_overrun_days days past hold pays a flat three weeks of storage, however long it sat; any other order pays every whole week past hold. The storage surcharge follows the line and the time past hold, charged per tire for every started week past hold: a line whose original_tread_depth_32nds is at least truck_line_min_depth_32nds pays truck_storage_surcharge_per_tire; any other line held more than long_hold_overrun_days days past hold pays long_hold_storage_surcharge_per_tire; any other order pays no surcharge. The missed-slot charge follows the order''s bookings: the missed slots are every booking made for the order when the latest booked appointment date has passed, and every booking but the latest when it has not; one missed slot costs single_missed_slot_charge, two or more cost repeat_missed_slot_charge, and none costs nothing. No intermediate figure is rounded; the lapsed-order refund is rounded half up to the cent once, at the end, and goes back to the tender that paid the ticket.'
    prerequisite: []
    cross_category:
      - category: fleet
        as: history
        reads:
          - status
          - fleet_roster_events.event_type
          - fleet_roster_events.event_date
          - fleet_roster_events.vehicle_id
          - fleet_transactions.discount_amount
          - fleet_transactions.event_type
          - fleet_transactions.vehicle_id
          - fleet_transactions.service_category
          - fleet_transactions.txn_date
        note: decides the fleet restocking relief from the vehicle's roster enrollment and the fleet account status. It also reads the fleet discount on the tires invoice of a fleet-charged ticket for the price paid.
    compute:
      - paid_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=F('purchase_date'), date_field='txn_date')
      - tire_price_paid: F('tire_count') * F('unit_price') - (P('set_instant_savings') if F('tire_count') >= P('set_instant_savings_min_tires') else 0) - ((0 if paid_fleet_discount == None else paid_fleet_discount) if F('payment_method') == 'fleet_account' else 0)
      - bookings: COUNT('tire_events', event_type='tires_installation_booked')
      - restock_bookings: COUNT('tire_events', event_type='tires_installation_booked')
      - restock_rate: 0 if restock_bookings == 0 else (P('special_order_restocking_fee_pct') / 2 if restock_bookings == 1 else P('special_order_restocking_fee_pct'))
      - enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
      - removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
      - fleet_status: CFIELD('fleet','status')
      - fleet_relief: tire_price_paid * P('special_order_restocking_fee_pct') / 100 * K('fleet_active_relief_pct') / 100 if (enrolled_on != None and (removed_on == None or removed_on < enrolled_on) and fleet_status == 'active') else (tire_price_paid * P('special_order_restocking_fee_pct') / 100 * K('fleet_inactive_relief_pct') / 100 if (enrolled_on != None and (removed_on == None or removed_on < enrolled_on) and fleet_status != 'active') else 0)
      - overrun_days: DAYS(F('purchase_date'), NOW) - P('order_hold_days')
      - rate_overrun_days: DAYS(F('purchase_date'), NOW) - P('order_hold_days')
      - started_weeks: (rate_overrun_days + 6) // 7 if rate_overrun_days > 0 else 0
      - surcharge: K('truck_storage_surcharge_per_tire') * F('tire_count') * started_weeks if P('original_tread_depth_32nds') >= K('truck_line_min_depth_32nds') else (K('long_hold_storage_surcharge_per_tire') * F('tire_count') * started_weeks if (P('original_tread_depth_32nds') < K('truck_line_min_depth_32nds') and rate_overrun_days > K('long_hold_overrun_days')) else 0)
      - storage_weeks: overrun_days // 7 if overrun_days > 0 else 0
      - storage_basis: '''one_week'' if (overrun_days >= 1 and overrun_days <= K(''long_storage_days'')) else (''three_weeks'' if overrun_days > K(''long_hold_overrun_days'') else ''weekly'')'
      - storage_charge: K('standard_weekly_storage_per_tire') * F('tire_count') * (1 if storage_basis == 'one_week' else (3 if storage_basis == 'three_weeks' else storage_weeks))
      - last_appt: LATEST('tire_events','appointment_date', event_type='tires_installation_booked')
      - missed_count: bookings if (last_appt != None and last_appt < NOW) else MX(0, bookings - 1)
      - missed_charge: K('repeat_missed_slot_charge') if missed_count >= 2 else (K('single_missed_slot_charge') if missed_count == 1 else 0)
      - restock_fee: tire_price_paid * restock_rate / 100
      - result: RND(tire_price_paid - MX(0, restock_fee - fleet_relief) - storage_charge - surcharge - missed_charge, 2)
    compute_basis:
      paid_fleet_discount: less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date when the ticket was charged to a fleet account
      tire_price_paid: The tire price paid is tire_count times unit_price, less set_instant_savings when tire_count is at least set_instant_savings_min_tires, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date when the ticket was charged to a fleet account.
      bookings: the missed slots are every booking made for the order when the latest booked appointment date has passed, and every booking but the latest when it has not
      restock_bookings: The restocking rate follows the order's installation bookings
      restock_rate: an order for which no installation appointment was ever booked pays no restocking fee; an order with exactly one booked appointment pays half of special_order_restocking_fee_pct; an order booked more than once pays special_order_restocking_fee_pct
      enrolled_on: an order for a vehicle enrolled today on the roster of an active Crestline fleet account
      removed_on: an order for a vehicle enrolled today on the roster of an active Crestline fleet account
      fleet_status: an order for a vehicle enrolled today on the roster of a fleet account that is not active
      overrun_days: The days past hold are the calendar days from purchase_date plus order_hold_days to today.
      rate_overrun_days: any other line held more than long_hold_overrun_days days past hold pays long_hold_storage_surcharge_per_tire
      storage_weeks: any other order pays every whole week past hold.
      storage_basis: an order 1 to long_storage_days days past hold pays one week of storage, however few days it sat; an order more than long_hold_overrun_days days past hold pays a flat three weeks of storage, however long it sat; any other order pays every whole week past hold.
      storage_charge: at standard_weekly_storage_per_tire times tire_count a week
      last_appt: when the latest booked appointment date has passed
      missed_count: the missed slots are every booking made for the order when the latest booked appointment date has passed, and every booking but the latest when it has not
      missed_charge: one missed slot costs single_missed_slot_charge, two or more cost repeat_missed_slot_charge, and none costs nothing.
      restock_fee: the restocking fee is that rate percent of the tire price paid.
      result: the refund is the tire price paid less the restocking fee, less every other charge this policy states and plus every relief it gives, each worked out on its own, the restocking fee less its reliefs never below 0, rounded half up to the cent.
      fleet_relief: an order for a vehicle enrolled today on the roster of an active Crestline fleet account is relieved of fleet_active_relief_pct percent of the line's full restocking fee, special_order_restocking_fee_pct percent of the tire price paid; an order for a vehicle enrolled today on the roster of a fleet account that is not active is relieved of fleet_inactive_relief_pct percent of it; any other order is relieved of nothing.
      started_weeks: charged per tire for every started week past hold
      surcharge: a line whose original_tread_depth_32nds is at least truck_line_min_depth_32nds pays truck_storage_surcharge_per_tire; any other line held more than long_hold_overrun_days days past hold pays long_hold_storage_surcharge_per_tire; any other order pays no surcharge.
    factors:
      - id: restocking_rate_by_bookings
        effect: parameter
        decides: restock_rate
        bindings:
          - restock_bookings
          - restock_rate
        ladder:
          - when: no installation appointment was ever booked for the order
            value: '0'
          - when: exactly one booked appointment
            value: half of special_order_restocking_fee_pct
          - when: otherwise (booked more than once)
            value: P('special_order_restocking_fee_pct')
        baseline:
          restock_rate: P('special_order_restocking_fee_pct')
        evidence:
          - history
        cross_difficulty: null
      - id: fleet_restocking_relief
        effect: parameter
        decides: fleet_relief
        bindings:
          - enrolled_on
          - removed_on
          - fleet_status
          - fleet_relief
        ladder:
          - when: the vehicle is enrolled today on the roster of an active Crestline fleet account
            value: fleet_active_relief_pct percent of the line's full restocking fee
          - when: the vehicle is enrolled today on the roster of a fleet account that is not active
            value: fleet_inactive_relief_pct percent of the line's full restocking fee
          - when: otherwise
            value: '0'
        baseline:
          fleet_relief: '0'
        evidence:
          - cross_category
          - history
        cross_difficulty: fleet
      - id: storage_basis_method
        effect: method
        decides: storage_basis
        bindings:
          - overrun_days
          - storage_basis
        ladder:
          - when: 1 to long_storage_days days past hold
            method: one week of storage at the standard weekly rate, whatever the days
          - when: more than long_hold_overrun_days days past hold
            method: a flat three weeks of storage at the standard weekly rate, whatever the days
          - when: otherwise
            method: every whole week past hold at the standard weekly rate
        baseline:
          storage_basis: '''weekly'''
        evidence:
          - date
        cross_difficulty: null
      - id: storage_surcharge
        effect: parameter
        decides: surcharge
        bindings:
          - rate_overrun_days
          - started_weeks
          - surcharge
        ladder:
          - when: a line whose original_tread_depth_32nds is at least truck_line_min_depth_32nds
            value: truck_storage_surcharge_per_tire per tire for every started week past hold
          - when: any other line held more than long_hold_overrun_days days past hold
            value: long_hold_storage_surcharge_per_tire per tire for every started week past hold
          - when: otherwise
            value: '0'
        baseline:
          surcharge: '0'
        evidence:
          - tier_param
          - date
        cross_difficulty: null
      - id: missed_slot_charge
        effect: parameter
        decides: missed_charge
        bindings:
          - bookings
          - last_appt
          - missed_count
          - missed_charge
        ladder:
          - when: two or more missed slots
            value: K('repeat_missed_slot_charge')
          - when: exactly one missed slot
            value: K('single_missed_slot_charge')
          - when: otherwise
            value: '0'
        baseline:
          missed_charge: '0'
        evidence:
          - history
          - date
        cross_difficulty: null
    baseline:
