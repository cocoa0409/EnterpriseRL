# ---- data flow ----
events:
  - type: tires_purchase
    target: tire_sets
    mutation: create
    meaning: A customer buys a ticket of Crestline house-brand tires for one vehicle; the set is opened in the ordered state until it is mounted.
    grain: one row per sales ticket of tires for one vehicle
    fields:
      customer_id: the buying customer
      vehicle_id: the vehicle the tires are fitted to
      store_id: the selling and installing store
      variant_name: official tire line and warranty class
      purchase_date: ticket date
      tire_count: tires on the ticket
      tire_size: size of the tires
      unit_price: selling price per tire before installation charges
      purchase_ticket_number: ticket number
      payment_method: tender used on the ticket
    triggers:
      - event: card:card_purchase
        when: {payment_method: crestline_card}
        map: {txn_date: purchase_date, store_id: store_id, source_ticket_number: purchase_ticket_number}
      - event: fleet:fleet_invoice_posted
        when: {payment_method: fleet_account}
        map: {txn_date: purchase_date, store_id: store_id, vehicle_id: vehicle_id, service_category: tires}

  - type: tires_installation_booked
    target: tire_events
    meaning: An installation appointment is booked (or moved) for an ordered set at a store bay.
    grain: one row per appointment slot booked for the set; a reschedule is a new row with the new slot
    distinguish_by: [appointment_date, appointment_time]
    fields:
      event_date: date the booking was made
      store_id: store whose bay is booked
      appointment_date: date of the appointment
      appointment_time: slot start time
      service_code: always tire_installation
    triggers: []

  - type: tires_installation_completed
    target: tire_sets
    mutation: {transition: {from: ordered, to: active}}
    meaning: The tires are mounted and the installation work order is closed with the odometer reading.
    grain: one row per transaction
    fields:
      install_date: date the work order closed
      install_odometer: odometer on the installation work order
      store_id: installing store
    triggers: []

  - type: tires_rotation_service
    target: tire_events
    meaning: A rotation (with or without balancing) is performed on an active set and documented on a work order.
    grain: one row per rotation work order on the set
    distinguish_by: [event_date, odometer, service_code]
    fields:
      event_date: work order date
      store_id: servicing store
      odometer: odometer on the work order
      tire_position: always ALL
      service_code: rotation_and_balance or rotation_only
      charge_amount: price charged for the service under the line's rotation pricing
    triggers: []

  - type: tires_tread_inspection
    target: tire_events
    meaning: A technician measures one tire's tread depth and records its wear pattern, the evidence an adjustment or workmanship replacement rests on.
    grain: one row per tire position measured on one inspection date
    distinguish_by: [event_date, tire_position]
    fields:
      event_date: inspection date
      store_id: inspecting store
      odometer: odometer at inspection
      tire_position: wheel position inspected
      min_tread_depth_32nds: lowest main-groove depth
      wear_pattern: recorded wear pattern
    triggers: []

  - type: tires_treadwear_adjustment
    target: tire_events
    meaning: A tire worn out before its warranted miles is adjusted and a prorated credit is issued on the set.
    grain: one row per tire position adjusted
    distinguish_by: [source_tire_event_id, tire_position]
    fields:
      event_date: adjustment date
      store_id: adjusting store (empty when processed by the customer care desk)
      odometer: odometer of the inspection the adjustment rests on
      tire_position: position adjusted
      current_selling_price: store price of the same tire on the adjustment date
      miles_driven: inspection odometer minus install_odometer
      credit_pct: prorated percentage granted
      amount: credit issued
      source_tire_event_id: the tread inspection the adjustment rests on
    account: adjustment_credit
    direction: in
    triggers: []

  - type: tires_workmanship_replacement
    target: tire_events
    meaning: A tire with a manufacturing defect is replaced, free inside the free-replacement period and at the customer's prorated share after it.
    grain: one row per defective tire position replaced
    distinguish_by: [source_tire_event_id, tire_position]
    fields:
      event_date: replacement date
      store_id: replacing store
      odometer: odometer at replacement
      tire_position: position replaced
      defect_code: defect found
      current_selling_price: store price of the same tire on the replacement date
      source_tire_event_id: the inspection that found the defect
      charge_amount: customer's share charged (0.00 when free)
    triggers: []

  - type: tires_adjustment_credit_applied
    target: tire_events
    meaning: An adjustment credit is applied toward the purchase of replacement tires.
    grain: one row per credit applied to one replacement ticket
    distinguish_by: [source_tire_event_id, ticket_number]
    fields:
      event_date: date of the replacement ticket
      store_id: store of the replacement ticket
      amount: credit used
      source_tire_event_id: the adjustment that issued the credit
      ticket_number: replacement ticket the credit was applied to
    account: adjustment_credit
    direction: out
    triggers: []

  - type: tires_adjustment_credit_expired
    target: tire_events
    meaning: The unused part of an adjustment credit is forfeited when its validity period lapses.
    grain: one row per adjustment credit lapsing
    distinguish_by: [source_tire_event_id]
    fields:
      event_date: date the lapse is booked
      amount: unused credit forfeited
      source_tire_event_id: the adjustment whose credit lapsed
    account: adjustment_credit
    direction: out
    triggers: []

  - type: tires_refund
    target: tire_events
    meaning: Money is returned to the customer on a tire ticket, for a satisfaction-trial return or an order cancellation.
    grain: one row per refund reason per ticket
    distinguish_by: [refund_reason, ticket_number]
    fields:
      event_date: refund date
      store_id: refunding store
      amount: refund paid
      ticket_number: the original purchase ticket refunded
      payment_method: tender the refund goes back to
      refund_reason: why the refund is paid
    triggers:
      - event: card:card_merchandise_credit
        when: {payment_method: crestline_card}
        map: {txn_date: event_date, amount: amount, source_ticket_number: ticket_number}
      - event: fleet:fleet_credit_memo
        when: {payment_method: fleet_account}
        map: {txn_date: event_date, amount: amount}

  - type: tires_satisfaction_return
    target: tire_sets
    mutation: {transition: {from: active, to: returned}}
    meaning: The customer confirms a satisfaction-trial return and the set comes off the vehicle.
    grain: one row per transaction
    fields:
      closed_date: date the return was completed
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: tires:tires_refund
        map: {refund_reason: satisfaction_trial_return}

  - type: tires_order_cancellation
    target: tire_sets
    mutation: {transition: {from: ordered, to: cancelled}}
    meaning: An ordered set that was never installed is cancelled, on the customer's request or when the hold period lapses.
    grain: one row per transaction
    fields:
      closed_date: cancellation date
      payment_method: original tender, which decides where the refund goes
    triggers:
      - event: tires:tires_refund
        map: {refund_reason: order_cancellation}

  - type: tires_worn_out_closure
    target: tire_sets
    mutation: {transition: {from: active, to: worn_out}}
    meaning: The last warranted tire of the set has been adjusted or replaced, so the set closes as worn out.
    grain: one row per transaction
    fields:
      closed_date: date of the last adjustment or replacement
    triggers: []

  - type: tires_set_retirement
    target: tire_sets
    mutation: {transition: {from: active, to: retired}}
    meaning: The set leaves service for any other reason (vehicle sold, tires removed, term or mileage exhausted).
    grain: one row per transaction
    fields:
      closed_date: retirement date
    triggers: []

measures:
  - id: tires_msr_rotation_max_gap
    window: life of the set, from install_odometer to the odometer of the inspection an adjustment rests on
    measure: largest odometer difference between consecutive points of the sequence install_odometer, each tires_rotation_service odometer in ascending order, and the inspection odometer
  - id: tires_msr_position_adjustments
    window: life of the set
    measure: count of tires_treadwear_adjustment rows on the set with the same tire_position
  - id: tires_msr_vehicle_trial_returns
    window: all tire sets ever sold for the same vehicle_id
    measure: count of tire_sets rows of that vehicle with status returned
  - id: tires_msr_credit_remaining
    window: one adjustment credit, from its issuing adjustment row to the present
    measure: amount of the tires_treadwear_adjustment row minus the sum of amount of tires_adjustment_credit_applied and tires_adjustment_credit_expired rows whose source_tire_event_id is that adjustment
  - id: tires_msr_commercial_use
    window: the set's active life, from install_date to the adjustment date
    measure: true when the set's vehicle has usage_class commercial, or when the vehicle has a fleet_vehicle_enrolled row dated on or before the adjustment date whose enrollment was not ended by a fleet_vehicle_removed row for the same vehicle dated before the set's install_date; otherwise false
  - id: tires_msr_vehicle_tires_open
    window: portfolio state on the date of the purchase
    measure: sum of tire_count over the vehicle's tire_sets rows in status ordered or active
  - id: tires_msr_booking_count
    window: life of the ordered set
    measure: count of tires_installation_booked rows on the set
  - id: tires_msr_direct_tpms
    window: vehicle record on the purchase date
    measure: true when the vehicle's tpms_type is direct, otherwise false

# ---- policies ----
policies:
  - id: tires_agg_multi_holding
    subject: [tires_purchase]
    rule: >-
      A customer may hold any number of tire sets: every sales ticket of tires for one vehicle opens its own set,
      so a household with several vehicles, or a vehicle that received two tires on one ticket and two on a later
      ticket, carries several sets at once. Each set keeps its own tier, its own install odometer, its own warranty
      clock and its own adjustment credit; nothing is pooled across sets. How many tires may be open on one vehicle
      at the same time is governed by tires_agg_vehicle_tire_count.
    eligibility: []
    params: {max_per_customer: null}

  - id: tires_agg_vehicle_tire_count
    subject: [tires_purchase]
    rule: >-
      The tires already open on a vehicle are aggregated across all of its sets before a new ticket is written.
      The basis is tires_msr_vehicle_tires_open, the sum of tire_count over the vehicle's sets in status ordered
      or active on the purchase date. The open tires plus the new ticket's tire_count must not exceed the
      vehicle-class limit in max_tires_on_vehicle. Tires being taken off the vehicle in exchange for the new ones
      still count until the set they belong to is closed, so when a purchase replaces every tire of an older set
      that older set is retired first and only then is the new ticket opened; when a purchase replaces only some
      positions of an older set, the older set stays active and the limit is checked on the sum. Tires on returned,
      cancelled, worn_out or retired sets never count.
    eligibility: []
    params:
      max_tires_on_vehicle: {passenger_car: 4, suv_cuv: 5, minivan: 4, light_truck: 5, commercial_van: 5, medium_duty_truck: 6}
    measures: [tires_msr_vehicle_tires_open]

  - id: tires_purchase_ticket
    subject: [tires_purchase]
    rule: >-
      A tire ticket is written only for a line whose entry gate lists the vehicle's class. The vehicle's class must be
      one of the classes the tire line is sold for. Each tier's eligible classes are its entry_gate.eligible_vehicle_classes;
      a fitment outside them (for example a passenger line on a light truck) is not sold. The pre-tax ticket total is
      tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the
      tpms_service_kit_charge_per_tire when the vehicle's tpms_type is direct or otherwise the valve_stem_charge_per_tire,
      plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when
      tire_count is at least set_instant_savings_min_tires. tire_count may not exceed max_tires_per_ticket. Sales tax
      is calculated by the store's point-of-sale system as a separate tax line and is never part of a charter
      computation. A ticket paid with the Crestline credit card posts to the card account and a ticket charged to a
      fleet account posts as a fleet invoice; cash, debit and bank-card tickets post nowhere else.
    eligibility:
      - id: fitment_class
        applies_to: [tires_purchase]
        kind: state
        condition: The vehicle's class must be one of the classes the tire line is sold for.
        evidence_fields: [vehicles.vehicle_class, vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[vehicles.vehicle_id]]
          action_bindings: {vehicles.vehicle_id: vehicle_id}
        state_contract:
          field: vehicles.vehicle_class
          allowed: [passenger_car, suv_cuv, minivan, light_truck, commercial_van]
    formula:
      ticket_total: "tire_count * unit_price + tire_count * mounting_balancing_charge_per_tire + tire_count * (tpms_service_kit_charge_per_tire if tires_msr_direct_tpms else valve_stem_charge_per_tire) + tire_count * tire_disposal_fee_per_tire - (set_instant_savings if tire_count >= set_instant_savings_min_tires else 0)"
    measures: [tires_msr_direct_tpms]

  - id: tires_evt_installation_booking
    subject: [tires_installation_booked]
    rule: >-
      Installation appointments are booked only for a set that has been bought and not yet mounted. The set must be
      in status ordered when an installation appointment is booked. The appointment must fall no later than the end
      of the order hold period counted from the purchase of the ordered set. Calendar days are counted from the day
      after the anchor date, so the anchor date plus the number of days is the last qualifying date. The slot must
      start at least installation_min_lead_hours after the booking is made and no more than
      installation_booking_horizon_days after the booking date, at a store whose bays are open at that time; the bay
      is reserved for installation_slot_minutes. A special-order size cannot be booked earlier than
      special_order_lead_days business days (Monday to Friday, excluding the store's published holidays) after
      purchase_date. Moving an appointment books a new slot as a new row; tires_msr_booking_count may not exceed one
      plus appointment_reschedules_max, after which the order is cancelled and re-bought as a new ticket. A customer
      who has not arrived appointment_late_release_minutes after the slot start loses the slot, which counts as used.
    eligibility:
      - id: set_ordered
        applies_to: [tires_installation_booked]
        kind: state
        condition: The set must be in status ordered when an installation appointment is booked.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [ordered]
      - id: within_hold_period
        applies_to: [tires_installation_booked]
        kind: time
        condition: The appointment must fall no later than the end of the order hold period counted from the purchase of the ordered set.
        evidence_fields: [tire_sets.purchase_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase of the ordered set
          anchor_source: tire_sets.purchase_date
          relation: not_after
          duration_source: variants.order_hold_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [tires_msr_booking_count]

  - id: tires_evt_installation_completion
    subject: [tires_installation_completed]
    rule: >-
      Installation closes the work order and starts the warranty. The set must be in status ordered when the
      installation is recorded. install_date is the work-order date and install_odometer is the odometer written on
      the installation work order; both are copied from the work order and never estimated. Miles driven for every
      later warranty decision are measured from install_odometer. When alignment_check_included is true the work order
      also carries a complimentary alignment check, which records nothing on the set. A road hazard certificate sold
      on the same ticket starts its coverage on the installation, as its own charter sets out.
    eligibility:
      - id: set_ordered_install
        applies_to: [tires_installation_completed]
        kind: state
        condition: The set must be in status ordered when the installation is recorded.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [ordered]

  - id: tires_evt_rotation_service
    subject: [tires_rotation_service]
    rule: >-
      Rotations keep the set wearing evenly and are the documentation the treadwear warranty relies on. The set must
      be in status active when a rotation is recorded. The price of the visit depends on the tier and on the service
      performed: a rotation_and_balance visit is charged rotation_and_balance_charge and a rotation_only visit is
      charged rotation_only_charge, where 0.00 means the service is included for the life of the tires. When
      spare_included_in_rotation is true the matching full-size spare is moved into the pattern at no extra charge.
      The row records the odometer from the work order; a rotation performed at another shop is not a Crestline
      rotation record and is never booked here.
    eligibility:
      - id: set_active_rotation
        applies_to: [tires_rotation_service]
        kind: state
        condition: The set must be in status active when a rotation is recorded.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
    params:
      per_tier:
        Crestline Value Touring 40K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline All-Season 50K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Grand Touring 60K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Highway Terrain LT 65K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Premium Touring 75K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
        Crestline Ultra Touring 85K Treadwear Warranty: {rotation_and_balance: "=rotation_and_balance_charge", rotation_only: "=rotation_only_charge"}
    formula:
      charge_amount: "rotation_and_balance_charge if service_code == 'rotation_and_balance' else rotation_only_charge"

  - id: tires_evt_tread_inspection
    subject: [tires_tread_inspection]
    rule: >-
      A tread inspection is the measured evidence for every warranty decision on a tire. The set must be in status
      active when a tread inspection is recorded. One row is written per wheel position measured; the depth is the
      lowest reading in any main groove (tread_measurement_point), in whole 32nds, and the wear_pattern is the one
      the technician records (even, irregular_alignment, irregular_inflation or damage). The inspection is performed
      by a Crestline technician at a store; a depth the customer measured at home, or a reading from another shop,
      is not an inspection and is never recorded as one. An inspection supports a warranty decision only for the
      period set in tires_evt_treadwear_adjustment; after that a new inspection is needed.
    eligibility:
      - id: set_active_inspection
        applies_to: [tires_tread_inspection]
        kind: state
        condition: The set must be in status active when a tread inspection is recorded.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]

  - id: tires_evt_treadwear_adjustment
    subject: [tires_treadwear_adjustment]
    rule: >-
      A tire that wears out before its warranted miles is adjusted on a prorated basis and the credit is issued on
      the set. The set must be in status active when the adjustment is issued. The adjustment must be issued no
      later than the end of the warranty term counted from the tire purchase recorded on the original sales ticket.
      Months are counted as calendar months from the anchor date to the same day of the month, falling back to the
      last day of that month when that day does not exist. The adjustment must be issued no later than the end of
      the inspection validity period counted from the tread inspection the adjustment rests on. Calendar days are
      counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying
      date. Each wheel position of a set may be adjusted only once. The warranty term is warranty_term_months, or
      commercial_use_term_months under commercial use (tires_commercial_use_coverage). The tire is worn out only
      when the inspection's min_tread_depth_32nds is at or below wear_out_tread_depth_32nds; a tire above that depth
      is not adjustable however many miles it has run. The inspection's wear_pattern must not be one of
      claim_excluded_wear_patterns, because irregular wear and damage are not treadwear. When rotation_records_required
      is true, tires_msr_rotation_max_gap must not exceed rotation_interval_max_miles plus rotation_grace_miles; only
      Crestline rotation records count. miles_driven is the inspection odometer minus install_odometer. When
      miles_driven is at or above the effective warranted miles the tire has delivered its warranty and nothing is
      issued. Otherwise credit_pct is the share of the effective warranted miles not received, times 100, rounded
      down to a whole percent (proration_pct_rounding); when credit_pct is below min_claim_credit_pct nothing is
      issued. The credit amount is credit_pct percent of the per-tire price named by proration_price_basis (the
      set's unit_price, or current_selling_price on the adjustment date), rounded half up to the cent. Installation
      charges, fees and tax are never part of the credit. One row is booked per adjusted position, citing the
      inspection in source_tire_event_id; the credit is used as tires_evt_credit_redemption sets out.
    eligibility:
      - id: set_active_adjustment
        applies_to: [tires_treadwear_adjustment]
        kind: state
        condition: The set must be in status active when the adjustment is issued.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
      - id: within_warranty_term
        applies_to: [tires_treadwear_adjustment]
        kind: time
        condition: The adjustment must be issued no later than the end of the warranty term counted from the tire purchase recorded on the original sales ticket.
        evidence_fields: [tire_sets.purchase_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the tire purchase recorded on the original sales ticket
          anchor_source: tire_sets.purchase_date
          relation: not_after
          duration_source: variants.warranty_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
      - id: inspection_fresh
        applies_to: [tires_treadwear_adjustment]
        kind: time
        condition: The adjustment must be issued no later than the end of the inspection validity period counted from the tread inspection the adjustment rests on.
        evidence_fields: [tire_events.event_date, tire_events.tire_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.tire_event_id]]
          action_bindings: {tire_events.tire_event_id: source_tire_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the tread inspection the adjustment rests on
          anchor_source: tire_events.event_date
          relation: not_after
          duration_source: variants.claim_inspection_validity_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
      - id: one_adjustment_per_position
        applies_to: [tires_treadwear_adjustment]
        kind: dedup
        condition: Each wheel position of a set may be adjusted only once.
        evidence_fields: [tire_events.tire_set_id, tire_events.tire_position, tire_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.tire_set_id, tire_events.tire_position]]
          action_bindings: {tire_events.tire_set_id: tire_set_id, tire_events.tire_position: tire_position}
        dedup_contract:
          table: tire_events
          mode: separate_record
          object_bindings: {tire_set_id: tire_set_id, tire_position: tire_position}
          duplicate_filters: {event_type: [tires_treadwear_adjustment]}
          distinct_fields: [event_date]
    formula:
      effective_warranted_miles: "warranted_miles * commercial_use_mileage_pct // 100 if tires_msr_commercial_use else warranted_miles"
      credit_pct: "(effective_warranted_miles - miles_driven) * 100 // effective_warranted_miles"
      amount: "round((current_selling_price if proration_price_basis == 'current_selling_price' else unit_price) * credit_pct / 100, 2)"
    measures: [tires_msr_rotation_max_gap, tires_msr_position_adjustments, tires_msr_commercial_use]

  - id: tires_commercial_use_coverage
    subject: [tires_treadwear_adjustment]
    rule: >-
      Holding a Crestline fleet account changes the treadwear coverage of the tires on the fleet's vehicles.
      Commercial use is read from tires_msr_commercial_use: a vehicle whose usage_class is commercial, or that sat on
      a fleet account roster at any point of the set's active life, is in commercial use even if it is a personal
      vehicle today. Under commercial use the effective warranted miles are warranted_miles times
      commercial_use_mileage_pct percent, rounded down to a whole mile, and the warranty term is
      commercial_use_term_months in place of warranty_term_months. Where commercial_use_mileage_pct is 0 the line
      carries no treadwear coverage at all for commercial use and no adjustment is issued, though workmanship
      replacement still applies. Commercial use never changes the satisfaction trial, rotation pricing or
      installation charges. Without commercial use the effective warranted miles are warranted_miles.
    eligibility: []
    formula:
      effective_warranted_miles: "warranted_miles * commercial_use_mileage_pct // 100 if tires_msr_commercial_use else warranted_miles"
    measures: [tires_msr_commercial_use]

  - id: tires_treadwear_workmanship_exclusion
    subject: [tires_treadwear_adjustment, tires_workmanship_replacement]
    rule: >-
      Treadwear adjustment and workmanship replacement are mutually exclusive for the same tire. One inspection
      supports either a treadwear adjustment or a workmanship replacement for its position, never both. When the
      technician has identified a manufacturing defect, the tire is handled as a workmanship replacement even if it
      is also worn, because the defect, not the mileage, ended its life. A position already adjusted for treadwear
      is out of the warranty and cannot later be replaced for workmanship, and a position replaced for workmanship
      carries the replacement tire forward on the same set with the set's original purchase_date, install_odometer
      and warranted miles, so a later treadwear adjustment of that position measures miles from install_odometer
      exactly as before.
    eligibility: []

  - id: tires_evt_workmanship_replacement
    subject: [tires_workmanship_replacement]
    rule: >-
      A tire with a manufacturing defect (tread separation, out-of-round, belt shift or a bead that will not seal on
      a sound wheel) is replaced on the set. The set must be in status active when a workmanship replacement is
      made. The replacement must be made no later than the end of the warranty term counted from the tire purchase
      recorded on the original sales ticket. Months are counted as calendar months from the anchor date to the same
      day of the month, falling back to the last day of that month when that day does not exist. Replacement is free,
      with free mounting and balancing, while both of these hold: the replacement date is within
      workmanship_free_replacement_months of purchase_date, and the tread worn (original_tread_depth_32nds minus the
      inspection's min_tread_depth_32nds) is at most workmanship_free_replacement_wear_32nds. Once either limit is
      passed the customer pays the tread_worn_share of the current_selling_price, which is the tread worn divided by
      the usable tread (original_tread_depth_32nds minus wear_out_tread_depth_32nds), rounded half up to the cent,
      plus mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true. A tire
      damaged by a road hazard, curb impact or under-inflation has no defect and is not a workmanship replacement.
    eligibility:
      - id: set_active_workmanship
        applies_to: [tires_workmanship_replacement]
        kind: state
        condition: The set must be in status active when a workmanship replacement is made.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
      - id: workmanship_within_term
        applies_to: [tires_workmanship_replacement]
        kind: time
        condition: The replacement must be made no later than the end of the warranty term counted from the tire purchase recorded on the original sales ticket.
        evidence_fields: [tire_sets.purchase_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the tire purchase recorded on the original sales ticket
          anchor_source: tire_sets.purchase_date
          relation: not_after
          duration_source: variants.warranty_term_months
          unit: calendar_months
          counting_rule: Months are counted as calendar months from the anchor date to the same day of the month, falling back to the last day of that month when that day does not exist.
          boundary: inclusive
    formula:
      customer_share: "round(current_selling_price * (original_tread_depth_32nds - min_tread_depth_32nds) / (original_tread_depth_32nds - wear_out_tread_depth_32nds), 2)"

  - id: tires_evt_credit_redemption
    subject: [tires_adjustment_credit_applied, tires_adjustment_credit_expired]
    rule: >-
      An adjustment credit is spent only on replacement tires. The credit must be applied no later than the end of
      the credit validity period counted from the treadwear adjustment that issued the credit. Calendar days are
      counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying
      date. The validity period is adjustment_credit_validity_days. The amount applied may not exceed
      tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket,
      never installation charges, fees or tax. When adjustment_same_line_required is true the replacement tire must
      be of the same tier as the adjusted set; otherwise any Crestline tire line may be bought. When
      adjustment_mounting_included is true the replacement tire's mounting and balancing is not charged on the
      replacement ticket. Several credits of one set may go on one replacement ticket, each as its own row citing its
      own adjustment. A credit is never paid out in cash, moved to another set or another customer, or combined with
      a satisfaction-trial refund of the same set. The day after the validity period ends, whatever remains of the
      credit lapses and is booked as an expiry for exactly tires_msr_credit_remaining; a credit fully applied lapses
      nothing. Closing the set does not cancel a credit that is still within its validity period.
    eligibility:
      - id: credit_within_validity
        applies_to: [tires_adjustment_credit_applied]
        kind: time
        condition: The credit must be applied no later than the end of the credit validity period counted from the treadwear adjustment that issued the credit.
        evidence_fields: [tire_events.event_date, tire_events.tire_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.tire_event_id]]
          action_bindings: {tire_events.tire_event_id: source_tire_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the treadwear adjustment that issued the credit
          anchor_source: tire_events.event_date
          relation: not_after
          duration_source: variants.adjustment_credit_validity_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [tires_msr_credit_remaining]

  - id: tires_evt_satisfaction_trial
    subject: [tires_satisfaction_return, tires_refund]
    rule: >-
      A customer who is not satisfied with the ride of a new set may return it within the satisfaction trial. The set
      must be in status active when a trial return is completed. The return must be completed no later than the end
      of the trial period counted from the installation of the set. Calendar days are counted from the day after the
      anchor date, so the anchor date plus the number of days is the last qualifying date. The trial period is
      satisfaction_trial_days. The miles driven since installation, read at the store when the tires come off, must
      not exceed satisfaction_trial_max_miles. tires_msr_vehicle_trial_returns must be below
      satisfaction_returns_per_vehicle; a vehicle that has already used its trial return gets none on a later set. A
      set with any treadwear adjustment or workmanship replacement is past the trial. The return is the customer's
      own decision about their tires: the agent registers the request and the customer confirms it, and only the
      confirmation returns the set. Where satisfaction_remedy is exchange_only the money is returned as store credit
      toward another Crestline tire line; otherwise the customer chooses refund or exchange. The amount returned is
      tire_count times unit_price, less any set_instant_savings the ticket received, plus the mounting, valve-stem or
      TPMS-kit charges per tire when satisfaction_refund_includes_installation is true; disposal fees and any
      rotation charges are never returned.
    eligibility:
      - id: set_active_trial
        applies_to: [tires_satisfaction_return]
        kind: state
        condition: The set must be in status active when a trial return is completed.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]
      - id: within_trial_period
        applies_to: [tires_satisfaction_return]
        kind: time
        condition: The return must be completed no later than the end of the trial period counted from the installation of the set.
        evidence_fields: [tire_sets.install_date, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the installation of the set
          anchor_source: tire_sets.install_date
          relation: not_after
          duration_source: variants.satisfaction_trial_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the anchor date, so the anchor date plus the number of days is the last qualifying date.
          boundary: inclusive
    measures: [tires_msr_vehicle_trial_returns]

  - id: tires_evt_order_cancellation
    subject: [tires_order_cancellation, tires_refund]
    rule: >-
      An ordered set that has not been mounted can be cancelled. The set must be in status ordered when it is
      cancelled. A set still ordered after order_hold_days counted from purchase_date is cancelled by the store
      without a request. The refund is the pre-tax ticket total computed under tires_purchase_ticket, less a
      restocking fee of special_order_restocking_fee_pct percent of tire_count times unit_price, rounded half up to the
      cent; the restocking fee applies both to a customer-requested cancellation and to a hold-period lapse, and is
      not withheld when the line's special_order_restocking_fee_pct is 0. An installed set is never cancelled; it can
      only be returned under the satisfaction trial.
    eligibility:
      - id: set_ordered_cancel
        applies_to: [tires_order_cancellation]
        kind: state
        condition: The set must be in status ordered when it is cancelled.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [ordered]
    formula:
      restocking_fee: "round(tire_count * unit_price * special_order_restocking_fee_pct / 100, 2)"

  - id: tires_refund_tender
    subject: [tires_refund]
    rule: >-
      A refund on a tire ticket goes back to the tender that paid the ticket. A ticket may receive only one refund per
      refund reason. A Crestline credit card ticket is refunded as a merchandise credit on the card account, a fleet
      ticket as a credit memo on the fleet account, a bank-card ticket to the same bank card, and a cash or debit ticket
      in cash or to the same debit card; an exchange-only satisfaction return is refunded as store_credit. The refund
      row carries the original purchase_ticket_number in ticket_number and the refund_reason it was paid for. A refund
      is never split across tenders and never paid to a tender other than the original one.
    eligibility:
      - id: one_refund_per_reason
        applies_to: [tires_refund]
        kind: dedup
        condition: A ticket may receive only one refund per refund reason.
        evidence_fields: [tire_events.ticket_number, tire_events.refund_reason, tire_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_events.ticket_number, tire_events.refund_reason]]
          action_bindings: {tire_events.ticket_number: ticket_number, tire_events.refund_reason: refund_reason}
        dedup_contract:
          table: tire_events
          mode: separate_record
          object_bindings: {ticket_number: ticket_number, refund_reason: refund_reason}
          duplicate_filters: {event_type: [tires_refund]}
          distinct_fields: [event_date]

  - id: tires_evt_closure
    subject: [tires_worn_out_closure, tires_set_retirement]
    rule: >-
      An active set closes when no warranted tire of it remains in service. The set must be in status active when it
      is closed. It closes as worn_out on the date its last position is adjusted for treadwear, once every one of its
      tire_count positions carries an adjustment. It closes as retired on the date Crestline records that the
      vehicle was sold or the tires were taken off for any reason other than adjustment, or on the date an inspection
      shows the warranty term or the effective warranted miles have run out; because warranty_transferable is false,
      a sold vehicle's set is retired and never transferred to the buyer. Closing the set ends its warranty and its
      rotation pricing, but an adjustment credit still within its validity period remains usable.
    eligibility:
      - id: set_active_close
        applies_to: [tires_worn_out_closure, tires_set_retirement]
        kind: state
        condition: The set must be in status active when it is closed.
        evidence_fields: [tire_sets.status, tire_sets.tire_set_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[tire_sets.tire_set_id]]
          action_bindings: {tire_sets.tire_set_id: tire_set_id}
        state_contract:
          field: tire_sets.status
          allowed: [active]



extended_policies:
  - id: tires_ext_treadwear_credit
    base_policy_refs:
      - tires_evt_treadwear_adjustment
      - tires_commercial_use_coverage
      - tires_treadwear_workmanship_exclusion
      - tires_evt_tread_inspection
      - tires_evt_credit_redemption
      - tires_purchase_ticket
    overwrite:
      - base_policy: tires_evt_treadwear_adjustment
        superseded_clause: miles_driven is the inspection odometer minus install_odometer.
        replaced_by: miles_driven is the inspection odometer minus install_odometer, the inspection being the tread inspection the adjustment rests on; a treadwear adjustment credit this policy computes rests on the set's latest tread inspection, so its miles run are the odometer of that inspection minus install_odometer.
      - base_policy: tires_commercial_use_coverage
        superseded_clause: 'Commercial use is read from tires_msr_commercial_use: a vehicle whose usage_class is commercial, or that sat on a fleet account roster at any point of the set''s active life, is in commercial use even if it is a personal vehicle today.'
        replaced_by: 'Commercial use is read from tires_msr_commercial_use: a vehicle whose usage_class is commercial, or that sat on a fleet account roster at any point of the set''s active life, is in commercial use even if it is a personal vehicle today; for a treadwear adjustment credit this policy computes, which is worked out only for a vehicle whose usage_class is personal, the roster part of that reading is counted in whole calendar months of enrollment on a Crestline fleet account roster, from the later of the enrollment date and install_date to the removal date, or to today while the vehicle is still enrolled.'
      - base_policy: tires_commercial_use_coverage
        superseded_clause: Under commercial use the effective warranted miles are warranted_miles times commercial_use_mileage_pct percent, rounded down to a whole mile, and the warranty term is commercial_use_term_months in place of warranty_term_months. Where commercial_use_mileage_pct is 0 the line carries no treadwear coverage at all for commercial use and no adjustment is issued, though workmanship replacement still applies.
        replaced_by: Under commercial use the effective warranted miles are warranted_miles times commercial_use_mileage_pct percent, rounded down to a whole mile, and the warranty term is commercial_use_term_months in place of warranty_term_months; where commercial_use_mileage_pct is 0 the line carries no treadwear coverage at all for commercial use and no adjustment is issued, though workmanship replacement still applies; for a treadwear adjustment credit this policy computes, the commercial-use cut stated below takes the place of that reading of the effective warranted miles, and the warranty term is commercial_use_term_months only for a vehicle enrolled for at least half of the set's active-life months.
      - base_policy: tires_commercial_use_coverage
        superseded_clause: Without commercial use the effective warranted miles are warranted_miles.
        replaced_by: Without commercial use the effective warranted miles are warranted_miles; for a treadwear adjustment credit this policy computes, with or without commercial use, the covered miles are warranted_miles times the covered-mileage percentage divided by 100, rounded down to a whole mile, the covered-mileage percentage being 100, plus every point addition and less every point reduction this policy states, each worked out on its own.
      - base_policy: tires_evt_treadwear_adjustment
        superseded_clause: Otherwise credit_pct is the share of the effective warranted miles not received, times 100, rounded down to a whole percent (proration_pct_rounding); when credit_pct is below min_claim_credit_pct nothing is issued.
        replaced_by: Otherwise credit_pct is the share of the effective warranted miles not received, times 100, rounded down to a whole percent (proration_pct_rounding), and when credit_pct is below min_claim_credit_pct nothing is issued; for a treadwear adjustment credit this policy computes, the share not received is the unreceived share measured on the covered miles, the age deduction stated below is taken off it, never below 0, before it is rounded down to a whole percent, and the credit is 0.00 when that whole percent is below min_claim_credit_pct.
      - base_policy: tires_evt_treadwear_adjustment
        superseded_clause: The credit amount is credit_pct percent of the per-tire price named by proration_price_basis (the set's unit_price, or current_selling_price on the adjustment date), rounded half up to the cent.
        replaced_by: The credit amount is credit_pct percent of the per-tire price named by proration_price_basis (the set's unit_price, or current_selling_price on the adjustment date), rounded half up to the cent, for every adjustment that is not a treadwear adjustment credit this policy computes; for such a credit the percentage is taken of the price paid per tire on the set's own ticket for every tire line, and the store's selling price on the adjustment date does not enter it.
    trigger: on_request
    subject:
      - tires_treadwear_adjustment
    computes: amount
    target_tool: issue_treadwear_adjustment_f769c805
    params:
      care_alignment_window_months: 12
      lifetime_care_points: 10
      plan_care_points: 5
      recommended_rotation_miles: 5000
      rotation_record_points_full: 5
      rotation_record_points_basic: 2
      even_wear_points_full: 5
      even_wear_points_basic: 2
      age_step_points_per_month: 1
      age_flat_points: 4
    rule: 'A treadwear adjustment credit is worked out for one worn wheel position of an active set on a vehicle whose usage_class is personal, from the set''s records, the vehicle''s fleet enrollment and its Crestline alignment plan; a set on a vehicle whose usage_class is commercial is adjusted under the base rule alone. The miles run are the odometer of the set''s latest tread inspection minus the set''s install_odometer. The covered-mileage percentage is 100. The covered miles are warranted_miles times the covered-mileage percentage divided by 100, rounded down to a whole mile. The unreceived share is the covered miles minus the miles run, times 100, divided by the covered miles, and is 0 when the miles run are at or above the covered miles. The adjustment''s credit percentage is the unreceived share rounded down to a whole percent, and the credit is 0.00 when that percentage is below min_claim_credit_pct. The price paid per tire is the set''s unit_price. The treadwear adjustment credit is the price paid per tire times the adjustment''s credit percentage divided by 100, rounded half up to the cent; installation charges, fees and tax never enter it. miles_driven is the inspection odometer minus install_odometer, the inspection being the tread inspection the adjustment rests on; a treadwear adjustment credit this policy computes rests on the set''s latest tread inspection, so its miles run are the odometer of that inspection minus install_odometer. Commercial use is read from tires_msr_commercial_use: a vehicle whose usage_class is commercial, or that sat on a fleet account roster at any point of the set''s active life, is in commercial use even if it is a personal vehicle today; for a treadwear adjustment credit this policy computes, which is worked out only for a vehicle whose usage_class is personal, the roster part of that reading is counted in whole calendar months of enrollment on a Crestline fleet account roster, from the later of the enrollment date and install_date to the removal date, or to today while the vehicle is still enrolled. Under commercial use the effective warranted miles are warranted_miles times commercial_use_mileage_pct percent, rounded down to a whole mile, and the warranty term is commercial_use_term_months in place of warranty_term_months; where commercial_use_mileage_pct is 0 the line carries no treadwear coverage at all for commercial use and no adjustment is issued, though workmanship replacement still applies; for a treadwear adjustment credit this policy computes, the commercial-use cut stated below takes the place of that reading of the effective warranted miles, and the warranty term is commercial_use_term_months only for a vehicle enrolled for at least half of the set''s active-life months. Without commercial use the effective warranted miles are warranted_miles; for a treadwear adjustment credit this policy computes, with or without commercial use, the covered miles are warranted_miles times the covered-mileage percentage divided by 100, rounded down to a whole mile, the covered-mileage percentage being 100, plus every point addition and less every point reduction this policy states, each worked out on its own. Otherwise credit_pct is the share of the effective warranted miles not received, times 100, rounded down to a whole percent (proration_pct_rounding), and when credit_pct is below min_claim_credit_pct nothing is issued; for a treadwear adjustment credit this policy computes, the share not received is the unreceived share measured on the covered miles, the age deduction stated below is taken off it, never below 0, before it is rounded down to a whole percent, and the credit is 0.00 when that whole percent is below min_claim_credit_pct. The credit amount is credit_pct percent of the per-tire price named by proration_price_basis (the set''s unit_price, or current_selling_price on the adjustment date), rounded half up to the cent, for every adjustment that is not a treadwear adjustment credit this policy computes; for such a credit the percentage is taken of the price paid per tire on the set''s own ticket for every tire line, and the store''s selling price on the adjustment date does not enter it. The set''s active-life months are the whole calendar months from install_date to today. The commercial-use cut follows the vehicle''s enrollment during the set''s active life: a vehicle enrolled for at least one whole month and for at least half of the set''s active-life months has 100 less commercial_use_mileage_pct points taken off the covered-mileage percentage; a vehicle enrolled for at least one whole month but for less than half of the set''s active-life months has 100 less the midpoint of 100 and commercial_use_mileage_pct, that midpoint rounded down to a whole percent, taken off; a vehicle enrolled for less than one whole month of the set''s active life, or never enrolled during it, has nothing taken off. The care-package points, added to the covered-mileage percentage, follow the vehicle''s Crestline alignment plan: a vehicle with an active lifetime alignment plan whose latest performed alignment is fewer than care_alignment_window_months months old earns lifetime_care_points; a vehicle with an active 1-year or 3-year alignment plan whose latest performed alignment is fewer than care_alignment_window_months months old earns plan_care_points; any other vehicle earns 0. The rotation-record points, added to the covered-mileage percentage, follow the set''s Crestline rotation records: a set with at least one rotation and at least as many rotations as the miles run divided by recommended_rotation_miles, rounded down, earns rotation_record_points_full; a set with at least one rotation and fewer rotations than that but at least as many as the miles run divided by rotation_interval_max_miles, rounded down, earns rotation_record_points_basic; any other set earns 0. The even-wear points, added to the covered-mileage percentage, follow the set''s inspection history: a set none of whose tread inspection entries records irregular_alignment or irregular_inflation wear and that carries at least two inspection readings per tire earns even_wear_points_full; a set with no such irregular entry and fewer readings than that earns even_wear_points_basic; a set with any irregular entry earns 0. The age deduction, taken off the unreceived share, follows the set''s age and use: for a set whose whole months since purchase_date are at least half of warranty_term_months and whose miles run are below half of warranted_miles, the deduction is age_step_points_per_month for every month elapsed beyond half of warranty_term_months; for a set at least half its term old whose miles run are at least half of warranted_miles, the deduction is the flat age_flat_points; a set younger than half its term has no age deduction. The price paid per tire follows the set''s ticket: a ticket charged to a fleet account pays unit_price, less set_instant_savings divided by tire_count when the ticket had at least set_instant_savings_min_tires tires, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count; a ticket paid by any other tender that had at least set_instant_savings_min_tires tires and received set_instant_savings pays unit_price less set_instant_savings divided by tire_count; any other ticket pays the unit_price. The fleet discount on a tires invoice is one percentage taken on every discountable line of the ticket, the tire price, the mounting and the valve-stem or TPMS-kit lines alike; wherever the tire price paid takes it off, the whole discount_amount of that invoice is counted against the tire price, the part taken on the mounting and kit lines included, because those lines are never figured below the line''s own charges here, and a ticket of an ordered set carries the tire price alone. The credit percentage is rounded down to a whole percent before the min_claim_credit_pct test; no other intermediate figure is rounded, and the treadwear adjustment credit is rounded half up to the cent once, at the end.'
    prerequisite: []
    cross_category:
      - category: fleet
        as: history
        reads:
          - fleet_roster_events.event_date
          - fleet_roster_events.event_type
          - fleet_roster_events.vehicle_id
          - fleet_transactions.discount_amount
          - fleet_transactions.event_type
          - fleet_transactions.vehicle_id
          - fleet_transactions.service_category
          - fleet_transactions.txn_date
        note: decides the commercial-use share from the vehicle's roster enrollment and removal dates. It also reads the fleet discount on the tires invoice of a fleet-charged ticket for the price paid.
      - category: alignment
        as: branch
        reads:
          - status
          - alignment_plan_id
          - alignment_events.event_date
        note: decides the care-package points from the vehicle's alignment plan and its latest performed alignment.
    compute:
      - insp_odo: LATEST('tire_events','odometer', event_type='tires_tread_inspection')
      - miles_run: insp_odo - F('install_odometer')
      - life_months: MONTHS(F('install_date'), NOW)
      - enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
      - removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
      - roster_months: 0 if (enrolled_on == None or (removed_on != None and removed_on >= enrolled_on and removed_on < F('install_date'))) else MX(0, MONTHS(MX(enrolled_on, F('install_date')), NOW if (removed_on == None or removed_on < enrolled_on) else removed_on))
      - commercial_cut: (100 - P('commercial_use_mileage_pct')) if (roster_months >= 1 and roster_months * 2 >= life_months) else ((100 - (100 + P('commercial_use_mileage_pct')) // 2) if (roster_months >= 1 and roster_months * 2 < life_months) else 0)
      - plan_id: CFIELD('alignment','alignment_plan_id', vehicle_id=F('vehicle_id'), status='active')
      - plan_term_basis: CPARAM('alignment','term_basis', vehicle_id=F('vehicle_id'), status='active')
      - plan_entitlement: CPARAM('alignment','service_entitlement', vehicle_id=F('vehicle_id'), status='active')
      - last_alignment: XLATEST('alignment','alignment_events','event_date', event_type='alignment_service_performed', alignment_plan_id=plan_id)
      - alignment_age: 999 if last_alignment == None else MONTHS(last_alignment, NOW)
      - care_points: K('lifetime_care_points') if (plan_term_basis == 'vehicle_ownership' and alignment_age < K('care_alignment_window_months')) else (K('plan_care_points') if (plan_term_basis == 'calendar_months' and plan_entitlement == 'unlimited_within_interval' and alignment_age < K('care_alignment_window_months')) else 0)
      - rotations: COUNT('tire_events', event_type='tires_rotation_service')
      - rotation_points: K('rotation_record_points_full') if (rotations >= 1 and rotations >= miles_run // K('recommended_rotation_miles')) else (K('rotation_record_points_basic') if (rotations >= 1 and rotations >= miles_run // P('rotation_interval_max_miles')) else 0)
      - irregular_readings: COUNT('tire_events', event_type='tires_tread_inspection', wear_pattern='irregular_alignment') + COUNT('tire_events', event_type='tires_tread_inspection', wear_pattern='irregular_inflation')
      - all_readings: COUNT('tire_events', event_type='tires_tread_inspection')
      - even_points: K('even_wear_points_full') if (irregular_readings == 0 and all_readings >= 2 * F('tire_count')) else (K('even_wear_points_basic') if (irregular_readings == 0 and all_readings < 2 * F('tire_count')) else 0)
      - covered_pct: 100 - commercial_cut + care_points + rotation_points + even_points
      - covered_miles: P('warranted_miles') * covered_pct // 100
      - unreceived_share: (covered_miles - miles_run) * 100 / covered_miles if covered_miles > miles_run else 0
      - term_used: MONTHS(F('purchase_date'), NOW)
      - age_deduction: (term_used - P('warranty_term_months') / 2) * K('age_step_points_per_month') if (term_used * 2 >= P('warranty_term_months') and miles_run * 2 < P('warranted_miles')) else (K('age_flat_points') if (term_used * 2 >= P('warranty_term_months') and miles_run * 2 >= P('warranted_miles')) else 0)
      - credit_pct_raw: int(MX(0, unreceived_share - age_deduction))
      - credit_pct: credit_pct_raw if credit_pct_raw >= P('min_claim_credit_pct') else 0
      - pp_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=F('purchase_date'), date_field='txn_date')
      - price_paid: (F('unit_price') - (P('set_instant_savings') / F('tire_count') if F('tire_count') >= P('set_instant_savings_min_tires') else 0) - (0 if pp_fleet_discount == None else pp_fleet_discount) / F('tire_count')) if F('payment_method') == 'fleet_account' else ((F('unit_price') - P('set_instant_savings') / F('tire_count')) if (F('tire_count') >= P('set_instant_savings_min_tires') and P('set_instant_savings') > 0) else F('unit_price'))
      - result: RND(price_paid * credit_pct / 100, 2)
    compute_basis:
      insp_odo: a treadwear adjustment credit this policy computes rests on the set's latest tread inspection, so its miles run are the odometer of that inspection minus install_odometer
      miles_run: The miles run are the odometer of the set's latest tread inspection minus the set's install_odometer.
      life_months: The set's active-life months are the whole calendar months from install_date to today.
      enrolled_on: the roster part of that reading is counted in whole calendar months of enrollment on a Crestline fleet account roster
      removed_on: from the later of the enrollment date and install_date to the removal date, or to today while the vehicle is still enrolled
      roster_months: counted in whole calendar months of enrollment on a Crestline fleet account roster, from the later of the enrollment date and install_date to the removal date, or to today while the vehicle is still enrolled
      plan_id: follow the vehicle's Crestline alignment plan
      plan_term_basis: a vehicle with an active lifetime alignment plan whose latest performed alignment is fewer than care_alignment_window_months months old earns lifetime_care_points
      plan_entitlement: a vehicle with an active 1-year or 3-year alignment plan whose latest performed alignment is fewer than care_alignment_window_months months old earns plan_care_points
      last_alignment: whose latest performed alignment is fewer than care_alignment_window_months months old
      alignment_age: whose latest performed alignment is fewer than care_alignment_window_months months old
      care_points: a vehicle with an active lifetime alignment plan whose latest performed alignment is fewer than care_alignment_window_months months old earns lifetime_care_points; a vehicle with an active 1-year or 3-year alignment plan whose latest performed alignment is fewer than care_alignment_window_months months old earns plan_care_points; any other vehicle earns 0.
      rotations: follow the set's Crestline rotation records
      rotation_points: a set with at least one rotation and at least as many rotations as the miles run divided by recommended_rotation_miles, rounded down, earns rotation_record_points_full; a set with at least one rotation and fewer rotations than that but at least as many as the miles run divided by rotation_interval_max_miles, rounded down, earns rotation_record_points_basic; any other set earns 0.
      irregular_readings: a set none of whose tread inspection entries records irregular_alignment or irregular_inflation wear
      all_readings: carries at least two inspection readings per tire
      even_points: a set none of whose tread inspection entries records irregular_alignment or irregular_inflation wear and that carries at least two inspection readings per tire earns even_wear_points_full; a set with no such irregular entry and fewer readings than that earns even_wear_points_basic; a set with any irregular entry earns 0.
      covered_pct: the covered-mileage percentage being 100, plus every point addition and less every point reduction this policy states, each worked out on its own.
      covered_miles: The covered miles are warranted_miles times the covered-mileage percentage divided by 100, rounded down to a whole mile.
      unreceived_share: The unreceived share is the covered miles minus the miles run, times 100, divided by the covered miles, and is 0 when the miles run are at or above the covered miles.
      term_used: for a set whose whole months since purchase_date are at least half of warranty_term_months
      age_deduction: for a set whose whole months since purchase_date are at least half of warranty_term_months and whose miles run are below half of warranted_miles, the deduction is age_step_points_per_month for every month elapsed beyond half of warranty_term_months; for a set at least half its term old whose miles run are at least half of warranted_miles, the deduction is the flat age_flat_points; a set younger than half its term has no age deduction.
      credit_pct_raw: the age deduction stated below is taken off it, never below 0, before it is rounded down to a whole percent
      credit_pct: the credit is 0.00 when that whole percent is below min_claim_credit_pct
      pp_fleet_discount: less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count
      price_paid: a ticket charged to a fleet account pays unit_price, less set_instant_savings divided by tire_count when the ticket had at least set_instant_savings_min_tires tires, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count; a ticket paid by any other tender that had at least set_instant_savings_min_tires tires and received set_instant_savings pays unit_price less set_instant_savings divided by tire_count; any other ticket pays the unit_price.
      result: The treadwear adjustment credit is the price paid per tire times the adjustment's credit percentage divided by 100, rounded half up to the cent; installation charges, fees and tax never enter it.
      commercial_cut: a vehicle enrolled for at least one whole month and for at least half of the set's active-life months has 100 less commercial_use_mileage_pct points taken off the covered-mileage percentage; a vehicle enrolled for at least one whole month but for less than half of the set's active-life months has 100 less the midpoint of 100 and commercial_use_mileage_pct, that midpoint rounded down to a whole percent, taken off; a vehicle enrolled for less than one whole month of the set's active life, or never enrolled during it, has nothing taken off.
    factors:
      - id: commercial_use_share
        effect: parameter
        decides: commercial_cut
        bindings:
          - life_months
          - enrolled_on
          - removed_on
          - roster_months
          - commercial_cut
        ladder:
          - when: the vehicle was enrolled on a Crestline fleet account roster for at least one whole month and for at least half of the set's active-life months
            value: 100 less P('commercial_use_mileage_pct') points off
          - when: the vehicle was enrolled for at least one whole month but for less than half of the set's active-life months
            value: 100 less the midpoint of 100 and P('commercial_use_mileage_pct'), rounded down, points off
          - when: otherwise (enrolled for less than one whole month of the set's active life, or never)
            value: '0'
        baseline:
          commercial_cut: '0'
        evidence:
          - cross_category
          - date
          - tier_param
        cross_difficulty: fleet
      - id: care_package_points
        effect: parameter
        decides: care_points
        bindings:
          - plan_id
          - plan_term_basis
          - plan_entitlement
          - last_alignment
          - alignment_age
          - care_points
        ladder:
          - when: an active lifetime alignment plan on the vehicle and its latest performed alignment fewer than care_alignment_window_months months old
            value: K('lifetime_care_points')
          - when: an active 1-year or 3-year alignment plan on the vehicle and its latest performed alignment fewer than care_alignment_window_months months old
            value: K('plan_care_points')
          - when: otherwise
            value: '0'
        baseline:
          care_points: '0'
        evidence:
          - cross_category
          - date
        cross_difficulty: alignment
      - id: rotation_record_points
        effect: parameter
        decides: rotation_points
        bindings:
          - rotations
          - rotation_points
        ladder:
          - when: at least one Crestline rotation and at least the miles run divided by recommended_rotation_miles rotations
            value: K('rotation_record_points_full')
          - when: at least one rotation, fewer than that, but at least the miles run divided by rotation_interval_max_miles rotations
            value: K('rotation_record_points_basic')
          - when: otherwise
            value: '0'
        baseline:
          rotation_points: '0'
        evidence:
          - history
        cross_difficulty: null
      - id: even_wear_points
        effect: parameter
        decides: even_points
        bindings:
          - irregular_readings
          - all_readings
          - even_points
        ladder:
          - when: no inspection entry of the set records irregular_alignment or irregular_inflation wear and the set carries at least two readings per tire
            value: K('even_wear_points_full')
          - when: no such irregular entry and fewer than two readings per tire
            value: K('even_wear_points_basic')
          - when: otherwise (an irregular entry on record)
            value: '0'
        baseline:
          even_points: '0'
        evidence:
          - history
        cross_difficulty: null
      - id: age_deduction_method
        effect: method
        decides: age_deduction
        bindings:
          - term_used
          - age_deduction
        ladder:
          - when: months since purchase_date at least half of warranty_term_months and miles run below half of warranted_miles
            method: 'linear in age: age_step_points_per_month times the months elapsed beyond half of the term'
          - when: months since purchase_date at least half of warranty_term_months and miles run at least half of warranted_miles
            method: 'flat: age_flat_points, whatever the age'
          - when: otherwise (younger than half the term)
            method: no deduction
        baseline:
          age_deduction: '0'
        evidence:
          - date
          - history
        cross_difficulty: null
      - id: price_paid_basis
        effect: parameter
        decides: price_paid
        bindings:
          - pp_fleet_discount
          - price_paid
        ladder:
          - when: a ticket charged to a fleet account
            value: unit_price less set_instant_savings divided by tire_count when received, less the fleet discount on the tires invoice divided by tire_count
          - when: a ticket paid by any other tender with at least set_instant_savings_min_tires tires that received set_instant_savings
            value: unit_price less set_instant_savings divided by tire_count
          - when: otherwise
            value: the unit_price
        baseline:
          price_paid: F('unit_price')
        evidence:
          - tier_param
          - cross_category
        cross_difficulty: fleet
    baseline:
      rule: The miles run are the odometer of the set's latest tread inspection minus the set's install_odometer. The covered-mileage percentage is 100. The covered miles are warranted_miles times the covered-mileage percentage divided by 100, rounded down to a whole mile. The unreceived share is the covered miles minus the miles run, times 100, divided by the covered miles, and is 0 when the miles run are at or above the covered miles. The adjustment's credit percentage is the unreceived share rounded down to a whole percent, and the credit is 0.00 when that percentage is below min_claim_credit_pct. The price paid per tire is the set's unit_price. The treadwear adjustment credit is the price paid per tire times the adjustment's credit percentage divided by 100, rounded half up to the cent; installation charges, fees and tax never enter it.
      params:
        - warranted_miles
        - min_claim_credit_pct
    inputs:
      history:
        - table: tire_events
          aggregate: latest
          field: odometer
          filters:
            event_type: tires_tread_inspection
        - table: tire_events
          aggregate: count
          field: tire_event_id
          filters:
            event_type: tires_rotation_service
        - table: tire_events
          aggregate: count
          field: tire_event_id
          filters:
            event_type: tires_tread_inspection
        - category: fleet
          table: fleet_roster_events
          aggregate: latest
          field: event_date
          filters:
            event_type: fleet_vehicle_enrolled
        - category: alignment
          table: alignment_events
          aggregate: latest
          field: event_date
          filters:
            event_type: alignment_service_performed
      cross_category:
        - fleet
        - alignment
  - id: tires_ext_share_settlement
    base_policy_refs:
      - tires_evt_credit_redemption
      - tires_evt_workmanship_replacement
      - tires_treadwear_workmanship_exclusion
    overwrite:
      - base_policy: tires_evt_credit_redemption
        superseded_clause: The amount applied may not exceed tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket, never installation charges, fees or tax.
        replaced_by: The amount applied may not exceed tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket, never installation charges, fees or tax, for every credit applied other than one toward a workmanship share charged on the same set or toward a one-tire replacement ticket written against a treadwear adjustment credit; for a share settlement this policy books, the credit settles only the tire part of a workmanship share charged on the same set, because that share pays for a replacement tire, never more than the credit remaining and never the share's mounting part, and a credit applied toward a one-tire replacement ticket written against a treadwear adjustment credit is settled under that ticket's own rule.
    trigger: on_request
    subject:
      - tires_adjustment_credit_applied
    computes: amount
    target_tool: apply_credit_to_workmanship_share_57ed5afc
    params:
      fleet_relief_pct_active: 15
      fleet_relief_pct_inactive: 5
      lifetime_member_relief_pct: 10
      plan_member_relief_pct: 5
    rule: 'A share settlement applies the treadwear adjustment credit of a set toward the tire part of a workmanship share charged on the same set, when the credit must also meet the replacement ticket written for the adjusted tire; it is worked out from the set''s adjustment, workmanship and credit entries, the set''s ticket, the road hazard certificate on the set, the vehicle''s fleet enrollment and its Crestline alignment plan. The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set. The share owed is the share charged on the set''s latest workmanship replacement entry. The share''s mounting part is mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, and 0 otherwise. The settleable part is the share owed less the share''s mounting part, never below 0. The apportioning tire line is the store''s selling price of the same tire recorded on the set''s latest treadwear adjustment, counted as 0 while the set has no adjustment entry. The replacement ticket''s mounting charge is mounting_balancing_charge_per_tire, or 0 on a line whose adjustment_mounting_included is true. The replacement ticket''s apportioning base is the apportioning tire line plus that mounting charge. The share settlement follows when the share was charged: a share recorded at the inspection visit the latest treadwear adjustment rests on, that is with the same odometer, is settled first, the share settlement being the smaller of the credit remaining and the settleable part; a share recorded at an earlier visit is apportioned with the replacement ticket, the share settlement being the credit remaining times the settleable part divided by the settleable part plus the apportioning base, never above the settleable part; any other share waits behind the replacement ticket, the share settlement being the credit remaining less the apportioning base, never below 0 and never above the settleable part. The share settlement is rounded half up to the cent. The amount applied may not exceed tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket, never installation charges, fees or tax, for every credit applied other than one toward a workmanship share charged on the same set or toward a one-tire replacement ticket written against a treadwear adjustment credit; for a share settlement this policy books, the credit settles only the tire part of a workmanship share charged on the same set, because that share pays for a replacement tire, never more than the credit remaining and never the share''s mounting part, and a credit applied toward a one-tire replacement ticket written against a treadwear adjustment credit is settled under that ticket''s own rule. For a share settlement this policy books, the settleable part is the share owed less the part of it this policy holds back from settlement, never below 0, and the apportioning base is the apportioning tire line plus the replacement ticket''s mounting charge less every relief on that mounting this policy states, each worked out on its own, the mounting never below 0. The credit settled on a workmanship share is not fixed until the set carries a treadwear adjustment entry for every position that the latest inspection of the set measured at or below the line''s wear-out depth without a recorded defect. The share''s mounting part, held back from settlement, follows the road hazard certificate on the set: an active certificate whose plan includes mounting on replacements leaves no mounting part in the share; an active certificate whose plan does not include it leaves half of the line''s mounting part stated above; any other set leaves the mounting part as stated above. The apportioning tire line follows the set''s age and the line''s price basis: for a set still within workmanship_free_replacement_months whole months of purchase_date, it is the set''s unit_price; for an older set on a line prorated on the original unit price, it is the lower of the recorded selling price and the price paid per tire on the set''s ticket (unit_price, less set_instant_savings divided by tire_count when the ticket received it, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count when the ticket was charged to a fleet account); any other set keeps the recorded selling price. The fleet discount on a tires invoice is one percentage taken on every discountable line of the ticket, the tire price, the mounting and the valve-stem or TPMS-kit lines alike; wherever the tire price paid takes it off, the whole discount_amount of that invoice is counted against the tire price, the part taken on the mounting and kit lines included, because those lines are never figured below the line''s own charges here, and a ticket of an ordered set carries the tire price alone. The fleet labor relief on the replacement ticket''s mounting follows the vehicle''s fleet enrollment: a vehicle enrolled today on the roster of an active Crestline fleet account has fleet_relief_pct_active percent of mounting_balancing_charge_per_tire relieved; a vehicle enrolled today on the roster of an account that is not active has fleet_relief_pct_inactive percent of it relieved; any other vehicle has nothing relieved. The member labor relief on the replacement ticket''s mounting follows the vehicle''s Crestline alignment plan: an active lifetime alignment plan has lifetime_member_relief_pct percent of mounting_balancing_charge_per_tire relieved; an active 1-year or 3-year alignment plan has plan_member_relief_pct percent of it relieved; any other vehicle has nothing relieved. No intermediate figure is rounded; the share settlement is rounded half up to the cent once, at the end.'
    prerequisite:
      - problem: tires_ext_treadwear_credit
        kind: value_input
        gate: credit_remaining
        form: state
        policy_source: The credit settled on a workmanship share is not fixed until the set carries a treadwear adjustment entry for every position that the latest inspection of the set measured at or below the line's wear-out depth without a recorded defect.
        condition: for every tire_events tread inspection entry of the set at its latest inspection date whose min_tread_depth_32nds is at or below wear_out_tread_depth_32nds and whose defect_code is none, a tires_treadwear_adjustment entry of the set cites it (source_tire_event_id).
        resolved_by: issue_treadwear_adjustment_f769c805
        effect: the adjustment entry issues its credit and records the store's selling price, so the credit remaining rises from 0.00 to the credit issued and the apportioning price is on record.
    cross_category:
      - category: hazard
        as: branch
        reads:
          - status
          - tire_set_id
        note: decides the share's mounting part from the certificate covering the set.
      - category: fleet
        as: history
        reads:
          - status
          - fleet_roster_events.event_type
          - fleet_roster_events.event_date
          - fleet_roster_events.vehicle_id
          - fleet_transactions.discount_amount
          - fleet_transactions.event_type
          - fleet_transactions.vehicle_id
          - fleet_transactions.service_category
          - fleet_transactions.txn_date
        note: decides the fleet labor relief on the replacement ticket's mounting from the vehicle's roster enrollment and the account status, and reads the fleet discount on the tires invoice of a fleet-charged ticket for the price paid.
      - category: alignment
        as: branch
        reads:
          - status
          - variant_name
        note: decides the member labor relief on the replacement ticket's mounting from the alignment plan held on the vehicle.
    compute:
      - credit_issued: SUM('tire_events','amount', event_type='tires_treadwear_adjustment')
      - credit_spent: SUM('tire_events','amount', event_type='tires_adjustment_credit_applied')
      - credit_lapsed: SUM('tire_events','amount', event_type='tires_adjustment_credit_expired')
      - credit_remaining: credit_issued - credit_spent - credit_lapsed
      - share_owed: LATEST('tire_events','charge_amount', event_type='tires_workmanship_replacement')
      - adj_odo: LATEST('tire_events','odometer', event_type='tires_treadwear_adjustment')
      - share_odo: LATEST('tire_events','odometer', event_type='tires_workmanship_replacement')
      - settlement_order: '''share_first'' if (share_odo != None and adj_odo != None and share_odo == adj_odo) else (''apportion'' if (share_odo != None and adj_odo != None and share_odo < adj_odo) else ''ticket_first'')'
      - line_mount: P('mounting_balancing_charge_per_tire') if P('workmanship_mounting_charged_after_free_period') else 0
      - haz_mount: CPARAM('hazard','replacement_includes_mounting', tire_set_id=HID, status='active')
      - share_mount_part: 0 if haz_mount == True else (line_mount / 2 if haz_mount == False else line_mount)
      - apportion_ref_price: (LATEST('tire_events','current_selling_price', event_type='tires_treadwear_adjustment') or 0)
      - set_age_months: MONTHS(F('purchase_date'), NOW)
      - tl_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=F('purchase_date'), date_field='txn_date')
      - apportion_tire_line: F('unit_price') if set_age_months < P('workmanship_free_replacement_months') else (MN(apportion_ref_price, F('unit_price') - (P('set_instant_savings') / F('tire_count') if (F('tire_count') >= P('set_instant_savings_min_tires') and P('set_instant_savings') > 0) else 0) - ((0 if tl_fleet_discount == None else tl_fleet_discount) / F('tire_count') if F('payment_method') == 'fleet_account' else 0)) if (set_age_months >= P('workmanship_free_replacement_months') and P('proration_price_basis') == 'original_unit_price') else apportion_ref_price)
      - ticket_mount: 0 if P('adjustment_mounting_included') else P('mounting_balancing_charge_per_tire')
      - enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
      - removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
      - fleet_status: CFIELD('fleet','status')
      - fleet_relief: P('mounting_balancing_charge_per_tire') * K('fleet_relief_pct_active') / 100 if (enrolled_on != None and (removed_on == None or removed_on < enrolled_on) and fleet_status == 'active') else (P('mounting_balancing_charge_per_tire') * K('fleet_relief_pct_inactive') / 100 if (enrolled_on != None and (removed_on == None or removed_on < enrolled_on) and fleet_status != 'active') else 0)
      - plan_term_basis: CPARAM('alignment','term_basis', vehicle_id=F('vehicle_id'), status='active')
      - plan_entitlement: CPARAM('alignment','service_entitlement', vehicle_id=F('vehicle_id'), status='active')
      - member_relief: P('mounting_balancing_charge_per_tire') * K('lifetime_member_relief_pct') / 100 if plan_term_basis == 'vehicle_ownership' else (P('mounting_balancing_charge_per_tire') * K('plan_member_relief_pct') / 100 if (plan_term_basis == 'calendar_months' and plan_entitlement == 'unlimited_within_interval') else 0)
      - settleable: MX(0, (0 if share_owed == None else share_owed) - share_mount_part)
      - apportion_base: apportion_tire_line + MX(0, ticket_mount - fleet_relief - member_relief)
      - result: RND(MN(credit_remaining, settleable) if settlement_order == 'share_first' else (MN(settleable, credit_remaining * settleable / (settleable + apportion_base)) if (settlement_order == 'apportion' and settleable + apportion_base > 0) else MN(settleable, MX(0, credit_remaining - apportion_base))), 2)
    compute_basis:
      credit_issued: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      credit_spent: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      credit_lapsed: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      credit_remaining: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      share_owed: The share owed is the share charged on the set's latest workmanship replacement entry.
      adj_odo: a share recorded at the inspection visit the latest treadwear adjustment rests on, that is with the same odometer
      share_odo: a share recorded at an earlier visit
      settlement_order: The share settlement follows when the share was charged
      line_mount: The share's mounting part is mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, and 0 otherwise.
      haz_mount: follows the road hazard certificate on the set
      share_mount_part: an active certificate whose plan includes mounting on replacements leaves no mounting part in the share; an active certificate whose plan does not include it leaves half of the line's mounting part stated above; any other set leaves the mounting part as stated above.
      apportion_ref_price: The apportioning tire line is the store's selling price of the same tire recorded on the set's latest treadwear adjustment, counted as 0 while the set has no adjustment entry.
      set_age_months: for a set still within workmanship_free_replacement_months whole months of purchase_date
      tl_fleet_discount: less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count when the ticket was charged to a fleet account
      apportion_tire_line: for a set still within workmanship_free_replacement_months whole months of purchase_date, it is the set's unit_price; for an older set on a line prorated on the original unit price, it is the lower of the recorded selling price and the price paid per tire on the set's ticket (unit_price, less set_instant_savings divided by tire_count when the ticket received it, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count when the ticket was charged to a fleet account); any other set keeps the recorded selling price.
      ticket_mount: The replacement ticket's mounting charge is mounting_balancing_charge_per_tire, or 0 on a line whose adjustment_mounting_included is true.
      enrolled_on: a vehicle enrolled today on the roster of an active Crestline fleet account
      removed_on: a vehicle enrolled today on the roster of an active Crestline fleet account
      fleet_status: a vehicle enrolled today on the roster of an account that is not active
      fleet_relief: a vehicle enrolled today on the roster of an active Crestline fleet account has fleet_relief_pct_active percent of mounting_balancing_charge_per_tire relieved; a vehicle enrolled today on the roster of an account that is not active has fleet_relief_pct_inactive percent of it relieved; any other vehicle has nothing relieved.
      plan_term_basis: an active lifetime alignment plan has lifetime_member_relief_pct percent of mounting_balancing_charge_per_tire relieved
      plan_entitlement: an active 1-year or 3-year alignment plan has plan_member_relief_pct percent of it relieved
      member_relief: an active lifetime alignment plan has lifetime_member_relief_pct percent of mounting_balancing_charge_per_tire relieved; an active 1-year or 3-year alignment plan has plan_member_relief_pct percent of it relieved; any other vehicle has nothing relieved.
      settleable: the settleable part is the share owed less the part of it this policy holds back from settlement, never below 0
      apportion_base: the apportioning base is the apportioning tire line plus the replacement ticket's mounting charge less every relief on that mounting this policy states, each worked out on its own, the mounting never below 0.
      result: a share recorded at the inspection visit the latest treadwear adjustment rests on, that is with the same odometer, is settled first, the share settlement being the smaller of the credit remaining and the settleable part; a share recorded at an earlier visit is apportioned with the replacement ticket, the share settlement being the credit remaining times the settleable part divided by the settleable part plus the apportioning base, never above the settleable part; any other share waits behind the replacement ticket, the share settlement being the credit remaining less the apportioning base, never below 0 and never above the settleable part.
    factors:
      - id: apportioning_tire_line
        effect: method
        decides: apportion_tire_line
        bindings:
          - apportion_ref_price
          - set_age_months
          - tl_fleet_discount
          - apportion_tire_line
        ladder:
          - when: the set is still within workmanship_free_replacement_months whole months of purchase_date
            method: 'like for like: the set''s unit_price'
          - when: an older set on a line prorated on the original unit price
            method: the lower of the recorded selling price and the price paid per tire on the set's ticket
          - when: otherwise
            method: the recorded selling price
        baseline:
          apportion_tire_line: apportion_ref_price
        evidence:
          - history
          - date
          - tier_param
        cross_difficulty: null
      - id: share_mounting_part
        effect: parameter
        decides: share_mount_part
        bindings:
          - haz_mount
          - share_mount_part
        ladder:
          - when: an active road hazard certificate on the set whose plan includes mounting on replacements
            value: '0'
          - when: an active road hazard certificate on the set whose plan does not include mounting on replacements
            value: half of the line's mounting part
          - when: otherwise
            value: the line's mounting part
        baseline:
          share_mount_part: line_mount
        evidence:
          - cross_category
        cross_difficulty: hazard
      - id: apportioning_fleet_relief
        effect: parameter
        decides: fleet_relief
        bindings:
          - enrolled_on
          - removed_on
          - fleet_status
          - fleet_relief
        ladder:
          - when: the vehicle is enrolled today on the roster of an active Crestline fleet account
            value: fleet_relief_pct_active percent of mounting_balancing_charge_per_tire
          - when: the vehicle is enrolled today on the roster of an account that is not active
            value: fleet_relief_pct_inactive percent of mounting_balancing_charge_per_tire
          - when: otherwise
            value: '0'
        baseline:
          fleet_relief: '0'
        evidence:
          - cross_category
          - history
        cross_difficulty: fleet
      - id: apportioning_member_relief
        effect: parameter
        decides: member_relief
        bindings:
          - plan_term_basis
          - plan_entitlement
          - member_relief
        ladder:
          - when: an active lifetime alignment plan on the vehicle
            value: lifetime_member_relief_pct percent of mounting_balancing_charge_per_tire
          - when: an active 1-year or 3-year alignment plan on the vehicle
            value: plan_member_relief_pct percent of mounting_balancing_charge_per_tire
          - when: otherwise
            value: '0'
        baseline:
          member_relief: '0'
        evidence:
          - cross_category
        cross_difficulty: alignment
    baseline:
      rule: 'The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set. The share owed is the share charged on the set''s latest workmanship replacement entry. The share''s mounting part is mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, and 0 otherwise. The settleable part is the share owed less the share''s mounting part, never below 0. The apportioning tire line is the store''s selling price of the same tire recorded on the set''s latest treadwear adjustment, counted as 0 while the set has no adjustment entry. The replacement ticket''s mounting charge is mounting_balancing_charge_per_tire, or 0 on a line whose adjustment_mounting_included is true. The replacement ticket''s apportioning base is the apportioning tire line plus that mounting charge. The share settlement follows when the share was charged: a share recorded at the inspection visit the latest treadwear adjustment rests on, that is with the same odometer, is settled first, the share settlement being the smaller of the credit remaining and the settleable part; a share recorded at an earlier visit is apportioned with the replacement ticket, the share settlement being the credit remaining times the settleable part divided by the settleable part plus the apportioning base, never above the settleable part; any other share waits behind the replacement ticket, the share settlement being the credit remaining less the apportioning base, never below 0 and never above the settleable part. The share settlement is rounded half up to the cent.'
      params:
        - adjustment_mounting_included
        - mounting_balancing_charge_per_tire
        - workmanship_mounting_charged_after_free_period
    inputs:
      history:
        - table: tire_events
          aggregate: sum
          field: amount
          filters:
            event_type: tires_treadwear_adjustment
        - table: tire_events
          aggregate: sum
          field: amount
          filters:
            event_type: tires_adjustment_credit_applied
        - table: tire_events
          aggregate: latest
          field: charge_amount
          filters:
            event_type: tires_workmanship_replacement
        - category: fleet
          table: fleet_roster_events
          aggregate: latest
          field: event_date
          filters:
            event_type: fleet_vehicle_enrolled
      cross_category:
        - hazard
        - fleet
        - alignment
  - id: tires_ext_ticket_redemption
    base_policy_refs:
      - tires_evt_credit_redemption
      - tires_evt_treadwear_adjustment
      - tires_evt_order_cancellation
      - tires_purchase_ticket
    overwrite:
      - base_policy: tires_evt_credit_redemption
        superseded_clause: The amount applied may not exceed tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket, never installation charges, fees or tax.
        replaced_by: The amount applied may not exceed tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket, never installation charges, fees or tax, for every credit applied other than one toward a one-tire replacement ticket this policy settles or toward a workmanship share charged on the same set; for a one-tire replacement ticket this policy settles, the credit applied is the smaller of the credit remaining and the ticket's tire line and reduces only that tire line, never installation charges, fees or tax, and a credit applied toward a workmanship share charged on the same set settles only the tire part of that share and never more than the credit remaining.
      - base_policy: tires_purchase_ticket
        superseded_clause: The pre-tax ticket total is tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the tpms_service_kit_charge_per_tire when the vehicle's tpms_type is direct or otherwise the valve_stem_charge_per_tire, plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when tire_count is at least set_instant_savings_min_tires.
        replaced_by: The pre-tax ticket total is tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the tpms_service_kit_charge_per_tire when the vehicle's tpms_type is direct or otherwise the valve_stem_charge_per_tire, plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when tire_count is at least set_instant_savings_min_tires, for every ticket other than a one-tire replacement ticket written against a treadwear adjustment credit and other than the ticket of an ordered set the store cancels because its hold period lapsed; for a one-tire replacement ticket written against a treadwear adjustment credit, the balance is the tire line less the credit applied, plus the line's mounting charge, plus tire_disposal_fee_per_tire, plus every line this policy adds and less every relief it takes off, each worked out on its own, the mounting charge less its reliefs never below 0, rounded half up to the cent and figured before tax, and the valve-stem or TPMS-kit line is rung from the vehicle record when the tire is mounted and is not part of this balance; the ticket of an ordered set the store cancels because its hold period lapsed carries the tire price paid alone, because the mounting, the valve-stem or TPMS-kit charge and the disposal fee are rung when the tires are mounted.
    trigger: on_request
    subject:
      - tires_adjustment_credit_applied
    computes: balance_due
    target_tool: apply_credit_to_replacement_ticket_eafdabc1
    params:
      balance_program_relief_pct: 40
      fleet_relief_pct_active: 15
      fleet_relief_pct_inactive: 5
      lifetime_member_relief_pct: 10
      plan_member_relief_pct: 5
    rule: 'A replacement ticket balance is worked out for the one-tire replacement ticket written for an adjusted tire of a set, settled when the tire is mounted, from the set''s adjustment and credit entries, its rotation records, the vehicle''s fleet enrollment, its Crestline alignment plan and the road hazard certificate on the set. The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set. The tire line is the store''s selling price of the same tire recorded on the set''s latest treadwear adjustment. The credit applied is the smaller of the credit remaining and the tire line; a set with no treadwear adjustment entry has no credit and no recorded selling price, and both count as 0. The mounting line is mounting_balancing_charge_per_tire. The replacement ticket balance is the tire line less the credit applied, plus the mounting line, plus tire_disposal_fee_per_tire, rounded half up to the cent; it is figured before tax. The amount applied may not exceed tires_msr_credit_remaining for that adjustment, and it reduces only the tire price on the replacement ticket, never installation charges, fees or tax, for every credit applied other than one toward a one-tire replacement ticket this policy settles or toward a workmanship share charged on the same set; for a one-tire replacement ticket this policy settles, the credit applied is the smaller of the credit remaining and the ticket''s tire line and reduces only that tire line, never installation charges, fees or tax, and a credit applied toward a workmanship share charged on the same set settles only the tire part of that share and never more than the credit remaining. The pre-tax ticket total is tire_count times unit_price, plus tire_count times mounting_balancing_charge_per_tire, plus tire_count times the tpms_service_kit_charge_per_tire when the vehicle''s tpms_type is direct or otherwise the valve_stem_charge_per_tire, plus tire_count times tire_disposal_fee_per_tire for the old tires taken off, minus set_instant_savings when tire_count is at least set_instant_savings_min_tires, for every ticket other than a one-tire replacement ticket written against a treadwear adjustment credit and other than the ticket of an ordered set the store cancels because its hold period lapsed; for a one-tire replacement ticket written against a treadwear adjustment credit, the balance is the tire line less the credit applied, plus the line''s mounting charge, plus tire_disposal_fee_per_tire, plus every line this policy adds and less every relief it takes off, each worked out on its own, the mounting charge less its reliefs never below 0, rounded half up to the cent and figured before tax, and the valve-stem or TPMS-kit line is rung from the vehicle record when the tire is mounted and is not part of this balance; the ticket of an ordered set the store cancels because its hold period lapsed carries the tire price paid alone, because the mounting, the valve-stem or TPMS-kit charge and the disposal fee are rung when the tires are mounted. The balance on a replacement ticket is fixed only after the set carries a treadwear adjustment entry for every position that its latest tread inspection measured at or below the line''s wear-out depth without a recorded defect. The balance on a replacement ticket is fixed only after every workmanship share charged on the set within thirty days before its latest treadwear adjustment carries a credit-applied entry naming that share''s wheel position. Before the balance on a replacement ticket is fixed, no tire order on the customer''s profile may stand in status ordered past the end of its hold period counted from its purchase date. The tire line follows the set''s age and the line''s price basis: for a set still within workmanship_free_replacement_months whole months of purchase_date, the replacement is like for like at the set''s unit_price; for an older set on a line prorated on the original unit price, the tire line is the lower of the recorded selling price and the price paid per tire on the set''s ticket (unit_price, less set_instant_savings divided by tire_count when the ticket received it, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count when the ticket was charged to a fleet account); any other set keeps the recorded selling price. The fleet discount on a tires invoice is one percentage taken on every discountable line of the ticket, the tire price, the mounting and the valve-stem or TPMS-kit lines alike; wherever the tire price paid takes it off, the whole discount_amount of that invoice is counted against the tire price, the part taken on the mounting and kit lines included, because those lines are never figured below the line''s own charges here, and a ticket of an ordered set carries the tire price alone. The balancing relief, taken off the line''s mounting charge, follows the line and the set''s balancing records: on a line whose adjustment_mounting_included is true the whole mounting_balancing_charge_per_tire is relieved; on a line whose rotation_and_balance_charge is 0.00, for a set that carries at least one Crestline rotation-and-balance record, balancing is already part of the set''s lifetime service and balance_program_relief_pct percent of mounting_balancing_charge_per_tire is relieved; any other set has nothing relieved. The fleet labor relief, taken off the line''s mounting charge, follows the vehicle''s fleet enrollment: a vehicle enrolled today on the roster of an active Crestline fleet account has fleet_relief_pct_active percent of mounting_balancing_charge_per_tire relieved; a vehicle enrolled today on the roster of an account that is not active has fleet_relief_pct_inactive percent of it relieved; any other vehicle has nothing relieved. The member labor relief, taken off the line''s mounting charge, follows the vehicle''s Crestline alignment plan: an active lifetime alignment plan has lifetime_member_relief_pct percent of mounting_balancing_charge_per_tire relieved; an active 1-year or 3-year alignment plan has plan_member_relief_pct percent of it relieved; any other vehicle has nothing relieved. The road hazard line, added to the balance, follows the certificate on the set, because a certificate covers the whole set and a tire added to a covered set is added to its certificate: an active certificate whose plan does not carry its remaining term to replacement tires and that has more than half of its coverage_term_months left adds the plan''s price for one tire, price_pct_of_tire_price percent of the recorded selling price kept between min_price_per_tire and max_price_per_tire; such a certificate with half or less of its term left adds half of that price; any other set adds nothing. No intermediate figure is rounded; the replacement ticket balance is rounded half up to the cent once, at the end.'
    prerequisite:
      - problem: tires_ext_treadwear_credit
        kind: value_input
        gate: credit_issued
        form: state
        policy_source: The balance on a replacement ticket is fixed only after the set carries a treadwear adjustment entry for every position that its latest tread inspection measured at or below the line's wear-out depth without a recorded defect.
        condition: every tire_events tread inspection entry of the set at its latest inspection date with min_tread_depth_32nds at or below wear_out_tread_depth_32nds and defect_code none is cited by a tires_treadwear_adjustment entry of the set.
        resolved_by: issue_treadwear_adjustment_f769c805
        effect: the adjustment entry issues its credit and records the store's selling price, so the credit applied and the tire line both come from it.
      - problem: tires_ext_share_settlement
        kind: value_input
        gate: credit_remaining
        form: state
        policy_source: The balance on a replacement ticket is fixed only after every workmanship share charged on the set within thirty days before its latest treadwear adjustment carries a credit-applied entry naming that share's wheel position.
        condition: every tires_workmanship_replacement entry of the set dated no more than 30 days before the latest tires_treadwear_adjustment entry has a tires_adjustment_credit_applied entry of the set with the same tire_position and an empty ticket_number.
        resolved_by: apply_credit_to_workmanship_share_57ed5afc
        effect: the share settlement lowers the credit remaining, so less credit is applied to the tire line and the balance rises by the amount settled.
      - problem: tires_ext_lapsed_order_refund
        kind: state_gate
        gate: tire_sets.status
        form: state
        policy_source: Before the balance on a replacement ticket is fixed, no tire order on the customer's profile may stand in status ordered past the end of its hold period counted from its purchase date.
        condition: no tire_sets row of the customer has status ordered with today later than purchase_date plus the line's order_hold_days.
        resolved_by: cancel_lapsed_tire_order_8987209f
        effect: the lapsed order moves to status cancelled, so no order of the profile stands past its hold period and the replacement ticket balance may be fixed.
    cross_category:
      - category: fleet
        as: history
        reads:
          - status
          - fleet_roster_events.event_type
          - fleet_roster_events.event_date
          - fleet_roster_events.vehicle_id
          - fleet_transactions.discount_amount
          - fleet_transactions.event_type
          - fleet_transactions.vehicle_id
          - fleet_transactions.service_category
          - fleet_transactions.txn_date
        note: decides the fleet labor relief from the vehicle's roster enrollment and the account status. It also reads the fleet discount on the tires invoice of a fleet-charged ticket for the price paid.
      - category: alignment
        as: branch
        reads:
          - status
          - variant_name
        note: decides the member labor relief from the alignment plan held on the vehicle.
      - category: hazard
        as: branch
        reads:
          - status
          - variant_name
          - expiration_date
          - tire_set_id
        note: decides the road hazard line from the certificate covering the set and its remaining term.
    compute:
      - credit_issued: SUM('tire_events','amount', event_type='tires_treadwear_adjustment')
      - credit_spent: SUM('tire_events','amount', event_type='tires_adjustment_credit_applied')
      - credit_lapsed: SUM('tire_events','amount', event_type='tires_adjustment_credit_expired')
      - credit_remaining: credit_issued - credit_spent - credit_lapsed
      - recorded_price: (LATEST('tire_events','current_selling_price', event_type='tires_treadwear_adjustment') or 0)
      - line_tire_price: (LATEST('tire_events','current_selling_price', event_type='tires_treadwear_adjustment') or 0)
      - set_age_months: MONTHS(F('purchase_date'), NOW)
      - line_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=F('purchase_date'), date_field='txn_date')
      - tire_line: F('unit_price') if set_age_months < P('workmanship_free_replacement_months') else (MN(line_tire_price, F('unit_price') - (P('set_instant_savings') / F('tire_count') if (F('tire_count') >= P('set_instant_savings_min_tires') and P('set_instant_savings') > 0) else 0) - ((0 if line_fleet_discount == None else line_fleet_discount) / F('tire_count') if F('payment_method') == 'fleet_account' else 0)) if (set_age_months >= P('workmanship_free_replacement_months') and P('proration_price_basis') == 'original_unit_price') else line_tire_price)
      - balance_records: COUNT('tire_events', event_type='tires_rotation_service', service_code='rotation_and_balance')
      - balance_relief: P('mounting_balancing_charge_per_tire') if P('adjustment_mounting_included') else (P('mounting_balancing_charge_per_tire') * K('balance_program_relief_pct') / 100 if (P('rotation_and_balance_charge') == 0 and balance_records >= 1) else 0)
      - enrolled_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_enrolled', vehicle_id=F('vehicle_id'))
      - removed_on: XLATEST('fleet','fleet_roster_events','event_date', event_type='fleet_vehicle_removed', vehicle_id=F('vehicle_id'))
      - fleet_status: CFIELD('fleet','status')
      - fleet_relief: P('mounting_balancing_charge_per_tire') * K('fleet_relief_pct_active') / 100 if (enrolled_on != None and (removed_on == None or removed_on < enrolled_on) and fleet_status == 'active') else (P('mounting_balancing_charge_per_tire') * K('fleet_relief_pct_inactive') / 100 if (enrolled_on != None and (removed_on == None or removed_on < enrolled_on) and fleet_status != 'active') else 0)
      - plan_term_basis: CPARAM('alignment','term_basis', vehicle_id=F('vehicle_id'), status='active')
      - plan_entitlement: CPARAM('alignment','service_entitlement', vehicle_id=F('vehicle_id'), status='active')
      - member_relief: P('mounting_balancing_charge_per_tire') * K('lifetime_member_relief_pct') / 100 if plan_term_basis == 'vehicle_ownership' else (P('mounting_balancing_charge_per_tire') * K('plan_member_relief_pct') / 100 if (plan_term_basis == 'calendar_months' and plan_entitlement == 'unlimited_within_interval') else 0)
      - haz_carry: CPARAM('hazard','replacement_tire_carries_remaining_term', tire_set_id=HID, status='active')
      - haz_term: CPARAM('hazard','coverage_term_months', tire_set_id=HID, status='active')
      - haz_expiry: CFIELD('hazard','expiration_date', tire_set_id=HID, status='active')
      - haz_pct: CPARAM('hazard','price_pct_of_tire_price', tire_set_id=HID, status='active')
      - haz_min: CPARAM('hazard','min_price_per_tire', tire_set_id=HID, status='active')
      - haz_max: CPARAM('hazard','max_price_per_tire', tire_set_id=HID, status='active')
      - haz_months_left: 0 if (haz_expiry == None or haz_expiry == '') else MONTHS(NOW, haz_expiry)
      - hazard_line: MN(MX(haz_pct * recorded_price / 100, haz_min), haz_max) if (haz_carry == False and haz_months_left * 2 > haz_term) else (MN(MX(haz_pct * recorded_price / 100, haz_min), haz_max) / 2 if (haz_carry == False and haz_months_left * 2 <= haz_term) else 0)
      - credit_used: MN(credit_remaining, tire_line)
      - mounting_net: MX(0, P('mounting_balancing_charge_per_tire') - balance_relief - fleet_relief - member_relief)
      - result: RND(MX(0, tire_line - credit_used) + mounting_net + hazard_line + P('tire_disposal_fee_per_tire'), 2)
    compute_basis:
      credit_issued: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      credit_spent: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      credit_lapsed: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      credit_remaining: The credit remaining is the credit issued by every treadwear adjustment entry of the set less every credit-applied and credit-expired entry of the set.
      recorded_price: price_pct_of_tire_price percent of the recorded selling price
      line_tire_price: any other set keeps the recorded selling price.
      set_age_months: for a set still within workmanship_free_replacement_months whole months of purchase_date
      line_fleet_discount: less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count when the ticket was charged to a fleet account
      tire_line: for a set still within workmanship_free_replacement_months whole months of purchase_date, the replacement is like for like at the set's unit_price; for an older set on a line prorated on the original unit price, the tire line is the lower of the recorded selling price and the price paid per tire on the set's ticket (unit_price, less set_instant_savings divided by tire_count when the ticket received it, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date divided by tire_count when the ticket was charged to a fleet account); any other set keeps the recorded selling price.
      balance_records: for a set that carries at least one Crestline rotation-and-balance record
      enrolled_on: a vehicle enrolled today on the roster of an active Crestline fleet account
      removed_on: a vehicle enrolled today on the roster of an active Crestline fleet account
      fleet_status: a vehicle enrolled today on the roster of an account that is not active
      plan_term_basis: an active lifetime alignment plan has lifetime_member_relief_pct percent of mounting_balancing_charge_per_tire relieved
      plan_entitlement: an active 1-year or 3-year alignment plan has plan_member_relief_pct percent of it relieved
      haz_carry: an active certificate whose plan does not carry its remaining term to replacement tires
      haz_term: that has more than half of its coverage_term_months left
      haz_expiry: that has more than half of its coverage_term_months left
      haz_pct: price_pct_of_tire_price percent of the recorded selling price kept between min_price_per_tire and max_price_per_tire
      haz_min: kept between min_price_per_tire and max_price_per_tire
      haz_max: kept between min_price_per_tire and max_price_per_tire
      haz_months_left: that has more than half of its coverage_term_months left
      hazard_line: an active certificate whose plan does not carry its remaining term to replacement tires and that has more than half of its coverage_term_months left adds the plan's price for one tire, price_pct_of_tire_price percent of the recorded selling price kept between min_price_per_tire and max_price_per_tire; such a certificate with half or less of its term left adds half of that price; any other set adds nothing.
      credit_used: The credit applied is the smaller of the credit remaining and the tire line; a set with no treadwear adjustment entry has no credit and no recorded selling price, and both count as 0.
      result: the balance is the tire line less the credit applied, plus the line's mounting charge, plus tire_disposal_fee_per_tire, plus every line this policy adds and less every relief it takes off, each worked out on its own
      balance_relief: on a line whose adjustment_mounting_included is true the whole mounting_balancing_charge_per_tire is relieved; on a line whose rotation_and_balance_charge is 0.00, for a set that carries at least one Crestline rotation-and-balance record, balancing is already part of the set's lifetime service and balance_program_relief_pct percent of mounting_balancing_charge_per_tire is relieved; any other set has nothing relieved.
      fleet_relief: a vehicle enrolled today on the roster of an active Crestline fleet account has fleet_relief_pct_active percent of mounting_balancing_charge_per_tire relieved; a vehicle enrolled today on the roster of an account that is not active has fleet_relief_pct_inactive percent of it relieved; any other vehicle has nothing relieved.
      member_relief: an active lifetime alignment plan has lifetime_member_relief_pct percent of mounting_balancing_charge_per_tire relieved; an active 1-year or 3-year alignment plan has plan_member_relief_pct percent of it relieved; any other vehicle has nothing relieved.
      mounting_net: the mounting charge less its reliefs never below 0
    factors:
      - id: tire_line_basis
        effect: method
        decides: tire_line
        bindings:
          - line_tire_price
          - set_age_months
          - line_fleet_discount
          - tire_line
        ladder:
          - when: the set is still within workmanship_free_replacement_months whole months of purchase_date
            method: 'like for like: the set''s unit_price'
          - when: an older set on a line prorated on the original unit price
