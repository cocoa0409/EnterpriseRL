        replaced_by: Once either limit is passed the customer pays the tread_worn_share of the current_selling_price, which is the tread worn divided by the usable tread (original_tread_depth_32nds minus wear_out_tread_depth_32nds), rounded half up to the cent, plus mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, for every workmanship replacement this policy does not charge; for a workmanship share this policy charges, the share is taken of the unit_price on the set's own ticket, the store's selling price on the replacement date not entering it, the workmanship share percentage being the prorated share less every part of it this policy takes off, each a percentage of the prorated share worked out on its own, never below 0, and the workmanship share being the unit_price times that percentage divided by 100, rounded half up to the cent, plus the mounting part.
