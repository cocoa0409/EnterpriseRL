# Policy charter: Tire Sets & Treadwear Limited Warranty (category key: tires)
# One holding = one ticket of Crestline house-brand tires sold for one vehicle, carrying the
# treadwear limited warranty of its tire line. Bookings for installation, rotation services,
# tread inspections, prorated treadwear adjustments, workmanship replacements, the satisfaction
# trial and order cancellations all run against this holding.

category: tires
display_name: Tire Sets & Treadwear Limited Warranty

binding:
  holding_table: tire_sets
  event_tables: [tire_events]
  intake_tables: [tire_return_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {adjustment_credit_balance: adjustment_credit}

lifecycle:
  states: [ordered, active, returned, cancelled, worn_out, retired]
  transitions:
    - {from: ordered, to: active, by: agent, means: "The tires are mounted on the vehicle and the installation work order is closed; the treadwear warranty starts counting miles from the installation odometer."}
    - {from: ordered, to: cancelled, by: agent, means: "An ordered set that has not been installed is cancelled at the customer's request or because the hold period lapsed, and the ticket is refunded."}
    - {from: active, to: returned, by: user, means: "The customer confirms a satisfaction-trial return; the tires come off the vehicle and the set's warranty ends."}
    - {from: active, to: worn_out, by: agent, means: "Every tire of the set has been adjusted under the treadwear warranty or replaced, so no warranted tire remains in service."}
    - {from: active, to: retired, by: agent, means: "The set leaves service for any other reason (vehicle sold, tires removed, warranty term or mileage exhausted) and the warranty ends."}

accounts:
  - key: adjustment_credit
    unit: USD
    meaning: Treadwear adjustment credit issued on a set that the customer can apply toward replacement tires; issued by an adjustment, used up by a replacement purchase, or forfeited when its validity lapses.

# ---- category-level parameter dictionary ----
parameter_schema:
  warranted_miles: Treadwear mileage warranted for personal-use vehicles, integer miles counted from the installation
    odometer
  warranty_term_months: Maximum age of the treadwear warranty, integer calendar months counted from purchase_date;
    the warranty ends at the earlier of this term or the warranted miles
  original_tread_depth_32nds: New-tire tread depth of the line, integer 32nds of an inch
  wear_out_tread_depth_32nds: Tread depth at which a tire is worn out for warranty purposes, integer 32nds of an
    inch (measured at the lowest main groove)
  tread_measurement_point: Where the warranty tread depth is read, enum text
  commercial_use_mileage_pct: Share of warranted_miles that applies when the vehicle's usage_class is commercial
    or the vehicle is enrolled on an open Crestline fleet account, integer percent; 0 means no treadwear coverage
    for commercial use
  commercial_use_term_months: Warranty term that replaces warranty_term_months under commercial use, integer calendar
    months from purchase_date; 0 where commercial use has no treadwear coverage
  proration_price_basis: 'Which per-tire price the adjustment percentage is applied to, enum: original_unit_price
    (tire_sets.unit_price) or current_selling_price (the store''s price on the adjustment date)'
  proration_pct_rounding: How the adjustment percentage is rounded, enum text
  min_claim_credit_pct: Smallest adjustment percentage that may be issued; a computed percentage below it is not
    adjustable, integer percent
  adjustment_credit_validity_days: Days an issued adjustment credit stays usable toward replacement tires, calendar
    days counted from the adjustment event_date
  adjustment_same_line_required: Whether the credit may only be applied to the same tire line (true) or to any tire
    line sold by Crestline (false), boolean
  adjustment_mounting_included: Whether mounting and balancing of the replacement tire bought with an adjustment
    credit is free, boolean
  claim_inspection_validity_days: Days a tread inspection remains usable as the basis of an adjustment, calendar
    days from the inspection event_date
  claim_excluded_wear_patterns: Recorded wear patterns that exclude a treadwear adjustment, list of tire_events.wear_pattern
    values
  claim_documents_required: Records that must be on file for an adjustment, list
  adjustments_per_tire_max: Treadwear adjustments allowed per wheel position of a set over the life of the warranty,
    integer
  rotation_interval_max_miles: Largest allowed gap between consecutive documented rotations (and from installation
    to the first rotation), integer miles
  rotation_grace_miles: Tolerance added to rotation_interval_max_miles before a gap breaks the rotation requirement,
    integer miles
  rotation_records_required: Whether documented rotations are a condition of the treadwear adjustment, boolean
  rotation_and_balance_charge: Price of a rotation-and-balance service on this set, USD per visit (0.00 = included
    for the life of the tires)
  rotation_only_charge: Price of a rotation without balancing on this set, USD per visit (0.00 = included)
  spare_included_in_rotation: Whether a matching full-size spare is part of the rotation pattern (five-tire rotation),
    boolean
  workmanship_free_replacement_wear_32nds: Tread worn (original depth minus measured depth) up to which a tire with
    a manufacturing defect is replaced free, integer 32nds of an inch
  workmanship_free_replacement_months: Months from purchase_date within which a defective tire is replaced free
    (together with the wear limit, whichever comes first ends free replacement), calendar months
  workmanship_proration_basis: After free replacement ends, how the customer's share of a defective tire's replacement
    is computed, enum text
  workmanship_mounting_charged_after_free_period: Whether mounting and balancing is charged on a prorated (after
    free period) workmanship replacement, boolean
  satisfaction_trial_days: Satisfaction trial window, calendar days counted from install_date
  satisfaction_trial_max_miles: Miles the set may have been driven since installation and still be returned under
    the trial, integer miles
  satisfaction_remedy: 'What the trial offers, enum: exchange_only (credit toward another Crestline line) or refund_or_exchange'
  satisfaction_refund_includes_installation: Whether the mounting, valve-stem and TPMS kit charges are refunded
    with the tires on a trial return, boolean
  satisfaction_returns_per_vehicle: Trial returns allowed per vehicle over all tire sets bought for it, integer
  mounting_balancing_charge_per_tire: Mount-and-balance installation charge, USD per tire
  valve_stem_charge_per_tire: New rubber valve stem charge, USD per tire (not charged where a TPMS service kit is
    used)
  tpms_service_kit_charge_per_tire: TPMS sensor service kit charge for vehicles with direct TPMS, USD per tire
  tire_disposal_fee_per_tire: Crestline scrap tire handling fee for each old tire taken off, USD per tire
  set_instant_savings: Instant savings taken off the ticket when at least set_instant_savings_min_tires tires of
    the line are bought on one ticket, USD per ticket
  set_instant_savings_min_tires: Tires of the same line needed on one ticket for set_instant_savings, integer
  max_tires_per_ticket: Most tires of the line sold for one vehicle on one ticket (a matching full-size spare counts),
    integer
  special_order_lead_days: Business days a size not in store stock takes to arrive from the distribution center
  order_hold_days: Calendar days an ordered set is held after purchase_date awaiting installation before it is cancelled
    and refunded
  special_order_restocking_fee_pct: Restocking fee withheld from the tire price when a customer cancels an ordered
    set, integer percent of unit_price x tire_count
  installation_slot_minutes: Bay time reserved for an installation appointment, minutes
  installation_booking_horizon_days: How far ahead an installation can be booked, calendar days after the booking
    date
  installation_min_lead_hours: Minimum hours between booking and the appointment start
  appointment_late_release_minutes: Minutes after the slot start after which an absent customer's bay slot is released
  appointment_reschedules_max: Times one installation appointment may be moved before the order must be re-booked
    as new, integer
  alignment_check_included: Whether a complimentary alignment check is part of installation, boolean
  nitrogen_inflation_included: Whether nitrogen inflation and top-offs are included for the life of the tires, boolean
  warranty_transferable: Whether the treadwear warranty follows the vehicle to a new owner, boolean

