    overwrite:
      - base_policy: tires_evt_workmanship_replacement
        superseded_clause: 'Replacement is free, with free mounting and balancing, while both of these hold: the replacement date is within workmanship_free_replacement_months of purchase_date, and the tread worn (original_tread_depth_32nds minus the inspection''s min_tread_depth_32nds) is at most workmanship_free_replacement_wear_32nds.'
        replaced_by: The replacement is free, and the workmanship share is 0.00, while fewer than workmanship_free_replacement_months whole calendar months have elapsed from purchase_date to the replacement visit and the tread worn is at most workmanship_free_replacement_wear_32nds.
      - base_policy: tires_evt_workmanship_replacement
