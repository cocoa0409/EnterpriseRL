      lifetime_alignment_discount: 15
      plan_alignment_discount: 10
    rule: 'A workmanship share is worked out for the one tire of an active set that a Crestline store found defective at a tread inspection and replaced at that visit, from the inspection, the set''s records, the road hazard certificate on the set and the vehicle''s Crestline alignment plan. The inspection entry that records the defect is chosen among the set''s inspection entries carrying a defect in this order: a tread separation, then a belt shift, then a bead leak, then an out-of-round tire, the latest entry of the first defect found; the replacement visit is that entry''s date. A set with no inspection entry recording any of these defects has no workmanship share to work out, and its share is 0.00. The defective tire''s tread worn is original_tread_depth_32nds minus that entry''s min_tread_depth_32nds, and the usable tread is original_tread_depth_32nds minus wear_out_tread_depth_32nds. The replacement is free, and the workmanship share is 0.00, while fewer than workmanship_free_replacement_months whole calendar months have elapsed from purchase_date to the replacement visit and the tread worn is at most workmanship_free_replacement_wear_32nds. Otherwise the prorated share is the tread worn times 100 divided by the usable tread. The workmanship share percentage is the prorated share. The mounting part is mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, and 0 otherwise. The workmanship share is the unit_price times the workmanship share percentage divided by 100, rounded half up to the cent, plus the mounting part. Once either limit is passed the customer pays the tread_worn_share of the current_selling_price, which is the tread worn divided by the usable tread (original_tread_depth_32nds minus wear_out_tread_depth_32nds), rounded half up to the cent, plus mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, for every workmanship replacement this policy does not charge; for a workmanship share this policy charges, the share is taken of the unit_price on the set''s own ticket, the store''s selling price on the replacement date not entering it, the workmanship share percentage being the prorated share less every part of it this policy takes off, each a percentage of the prorated share worked out on its own, never below 0, and the workmanship share being the unit_price times that percentage divided by 100, rounded half up to the cent, plus the mounting part. The prorated share depends on when and how the free period ended: for a defect found while the set is inside its satisfaction trial, that is no more than satisfaction_trial_days calendar days after install_date, the tread on a tire that new reflects the defect rather than use, so the prorated share is the miles run, that entry''s odometer minus install_odometer, times 100 divided by warranted_miles; for a defect found after the trial on a set whose free period ended by time alone, that is at least workmanship_free_replacement_months whole months after purchase_date with tread worn of at most workmanship_free_replacement_wear_32nds, the prorated share is the whole months elapsed times 100 divided by warranty_term_months; any other defect keeps the tread worn times 100 divided by the usable tread. The defect-class cut follows the defect recorded: a tread separation or a belt shift takes structural_defect_cut_pct percent of the prorated share off; a bead leak takes bead_leak_cut_pct percent of it off; an out-of-round tire takes nothing off. The maintained-set discount follows the set''s Crestline rotation records: a set with at least one rotation and at least as many rotations as its miles run, that entry''s odometer minus install_odometer, divided by recommended_rotation_miles, rounded down, takes maintained_set_discount_full percent of the prorated share off; a set with at least one rotation and fewer than that but at least as many as its miles run divided by rotation_interval_max_miles, rounded down, takes maintained_set_discount_basic percent of it off; any other set takes nothing off. The alignment-maintained discount follows the vehicle''s Crestline alignment plan: an active lifetime alignment plan whose latest performed alignment is fewer than alignment_window_months months before the replacement visit takes lifetime_alignment_discount percent of the prorated share off; an active 1-year or 3-year alignment plan with such an alignment takes plan_alignment_discount percent of it off; any other vehicle takes nothing off. The replacement mounting part follows the road hazard certificate on the set: an active certificate whose plan includes mounting on replacements waives the mounting part; an active certificate whose plan does not include it halves the mounting part; a set with no active certificate keeps the mounting part as set by the line. The workmanship share percentage is never rounded; the unit_price times it divided by 100 is rounded half up to the cent, and the mounting part is added after that rounding.'
    prerequisite: []
    cross_category:
      - category: hazard
        as: branch
        reads:
          - status
          - variant_name
          - tire_set_id
        note: decides the replacement mounting part from the road hazard certificate covering the set.
      - category: alignment
        as: branch
        reads:
          - status
          - alignment_plan_id
          - alignment_events.event_date
        note: decides the alignment-maintained discount from the vehicle's plan and its latest performed alignment.
    compute:
      - sep_count: COUNT('tire_events', event_type='tires_tread_inspection', defect_code='tread_separation')
      - belt_count: COUNT('tire_events', event_type='tires_tread_inspection', defect_code='belt_shift')
      - bead_count: COUNT('tire_events', event_type='tires_tread_inspection', defect_code='bead_leak')
      - oor_count: COUNT('tire_events', event_type='tires_tread_inspection', defect_code='out_of_round')
      - defect_code_found: '''tread_separation'' if sep_count > 0 else (''belt_shift'' if belt_count > 0 else (''bead_leak'' if bead_count > 0 else (''out_of_round'' if oor_count > 0 else ''none'')))'
      - def_depth: LATEST('tire_events','min_tread_depth_32nds', event_type='tires_tread_inspection', defect_code=defect_code_found)
      - def_odo: LATEST('tire_events','odometer', event_type='tires_tread_inspection', defect_code=defect_code_found)
      - def_date: LATEST('tire_events','event_date', event_type='tires_tread_inspection', defect_code=defect_code_found)
      - tread_worn: 0 if def_depth == None else P('original_tread_depth_32nds') - def_depth
      - usable_tread: P('original_tread_depth_32nds') - P('wear_out_tread_depth_32nds')
      - miles_run: 0 if def_odo == None else def_odo - F('install_odometer')
      - months_at_visit: 0 if def_date == None else MONTHS(F('purchase_date'), def_date)
      - is_free: months_at_visit < P('workmanship_free_replacement_months') and tread_worn <= P('workmanship_free_replacement_wear_32nds')
      - days_after_install: 0 if def_date == None else DAYS(F('install_date'), def_date)
      - prorated_share: miles_run * 100 / P('warranted_miles') if days_after_install <= P('satisfaction_trial_days') else (months_at_visit * 100 / P('warranty_term_months') if (days_after_install > P('satisfaction_trial_days') and months_at_visit >= P('workmanship_free_replacement_months') and tread_worn <= P('workmanship_free_replacement_wear_32nds')) else tread_worn * 100 / usable_tread)
      - defect_readings: COUNT('tire_events', event_type='tires_tread_inspection', defect_code=defect_code_found)
      - class_cut: K('structural_defect_cut_pct') if (defect_readings >= 1 and (defect_code_found == 'tread_separation' or defect_code_found == 'belt_shift')) else (K('bead_leak_cut_pct') if (defect_readings >= 1 and defect_code_found == 'bead_leak') else 0)
      - rotations: COUNT('tire_events', event_type='tires_rotation_service')
      - maint_odo: LATEST('tire_events','odometer', event_type='tires_tread_inspection', defect_code=defect_code_found)
      - maint_miles: 0 if maint_odo == None else maint_odo - F('install_odometer')
      - maint_disc: K('maintained_set_discount_full') if (rotations >= 1 and rotations >= maint_miles // K('recommended_rotation_miles')) else (K('maintained_set_discount_basic') if (rotations >= 1 and rotations >= maint_miles // P('rotation_interval_max_miles')) else 0)
      - plan_id: CFIELD('alignment','alignment_plan_id', vehicle_id=F('vehicle_id'), status='active')
      - plan_term_basis: CPARAM('alignment','term_basis', vehicle_id=F('vehicle_id'), status='active')
      - plan_entitlement: CPARAM('alignment','service_entitlement', vehicle_id=F('vehicle_id'), status='active')
      - last_alignment: XLATEST('alignment','alignment_events','event_date', event_type='alignment_service_performed', alignment_plan_id=plan_id)
      - alignment_age: 999 if (last_alignment == None or def_date == None) else MONTHS(last_alignment, def_date)
      - align_disc: K('lifetime_alignment_discount') if (plan_term_basis == 'vehicle_ownership' and alignment_age < K('alignment_window_months')) else (K('plan_alignment_discount') if (plan_term_basis == 'calendar_months' and plan_entitlement == 'unlimited_within_interval' and alignment_age < K('alignment_window_months')) else 0)
      - share_pct: prorated_share * MX(0, 100 - class_cut - maint_disc - align_disc) / 100
      - line_mount: P('mounting_balancing_charge_per_tire') if P('workmanship_mounting_charged_after_free_period') else 0
      - haz_mount: CPARAM('hazard','replacement_includes_mounting', tire_set_id=HID, status='active')
      - mount_part: 0 if haz_mount == True else (line_mount / 2 if haz_mount == False else line_mount)
      - result: 0.0 if (is_free or defect_code_found == 'none') else RND(RND(F('unit_price') * share_pct / 100, 2) + mount_part, 2)
    compute_basis:
      sep_count: a tread separation, then a belt shift, then a bead leak, then an out-of-round tire, the latest entry of the first defect found
      belt_count: a tread separation, then a belt shift, then a bead leak, then an out-of-round tire, the latest entry of the first defect found
      bead_count: a tread separation, then a belt shift, then a bead leak, then an out-of-round tire, the latest entry of the first defect found
      defect_code_found: the latest entry of the first defect found
      def_depth: The defective tire's tread worn is original_tread_depth_32nds minus that entry's min_tread_depth_32nds
      def_odo: the miles run, that entry's odometer minus install_odometer
      def_date: the replacement visit is that entry's date.
      tread_worn: The defective tire's tread worn is original_tread_depth_32nds minus that entry's min_tread_depth_32nds
      usable_tread: the usable tread is original_tread_depth_32nds minus wear_out_tread_depth_32nds.
      miles_run: the prorated share is the miles run, that entry's odometer minus install_odometer, times 100 divided by warranted_miles
      months_at_visit: whole calendar months have elapsed from purchase_date to the replacement visit
      is_free: The replacement is free, and the workmanship share is 0.00, while fewer than workmanship_free_replacement_months whole calendar months have elapsed from purchase_date to the replacement visit and the tread worn is at most workmanship_free_replacement_wear_32nds.
      days_after_install: that is no more than satisfaction_trial_days calendar days after install_date
      prorated_share: for a defect found while the set is inside its satisfaction trial, that is no more than satisfaction_trial_days calendar days after install_date, the tread on a tire that new reflects the defect rather than use, so the prorated share is the miles run, that entry's odometer minus install_odometer, times 100 divided by warranted_miles; for a defect found after the trial on a set whose free period ended by time alone, that is at least workmanship_free_replacement_months whole months after purchase_date with tread worn of at most workmanship_free_replacement_wear_32nds, the prorated share is the whole months elapsed times 100 divided by warranty_term_months; any other defect keeps the tread worn times 100 divided by the usable tread.
      defect_readings: The defect-class cut follows the defect recorded
      rotations: The maintained-set discount follows the set's Crestline rotation records
      maint_disc: a set with at least one rotation and at least as many rotations as its miles run, that entry's odometer minus install_odometer, divided by recommended_rotation_miles, rounded down, takes maintained_set_discount_full percent of the prorated share off; a set with at least one rotation and fewer than that but at least as many as its miles run divided by rotation_interval_max_miles, rounded down, takes maintained_set_discount_basic percent of it off; any other set takes nothing off.
      plan_id: The alignment-maintained discount follows the vehicle's Crestline alignment plan
      plan_term_basis: an active lifetime alignment plan whose latest performed alignment is fewer than alignment_window_months months before the replacement visit takes lifetime_alignment_discount percent of the prorated share off
      plan_entitlement: an active 1-year or 3-year alignment plan with such an alignment takes plan_alignment_discount percent of it off
      last_alignment: whose latest performed alignment is fewer than alignment_window_months months before the replacement visit
      alignment_age: whose latest performed alignment is fewer than alignment_window_months months before the replacement visit
      align_disc: an active lifetime alignment plan whose latest performed alignment is fewer than alignment_window_months months before the replacement visit takes lifetime_alignment_discount percent of the prorated share off; an active 1-year or 3-year alignment plan with such an alignment takes plan_alignment_discount percent of it off; any other vehicle takes nothing off.
      share_pct: the workmanship share percentage being the prorated share less every part of it this policy takes off, each a percentage of the prorated share worked out on its own, never below 0
      line_mount: The mounting part is mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, and 0 otherwise.
      haz_mount: The replacement mounting part follows the road hazard certificate on the set
      mount_part: an active certificate whose plan includes mounting on replacements waives the mounting part; an active certificate whose plan does not include it halves the mounting part; a set with no active certificate keeps the mounting part as set by the line.
      result: A set with no inspection entry recording any of these defects has no workmanship share to work out, and its share is 0.00.
      oor_count: then an out-of-round tire
      class_cut: a tread separation or a belt shift takes structural_defect_cut_pct percent of the prorated share off; a bead leak takes bead_leak_cut_pct percent of it off; an out-of-round tire takes nothing off.
      maint_odo: its miles run, that entry's odometer minus install_odometer
      maint_miles: its miles run, that entry's odometer minus install_odometer, divided by recommended_rotation_miles
    factors:
      - id: proration_basis_method
        effect: method
        decides: prorated_share
        bindings:
          - def_odo
          - miles_run
          - days_after_install
          - prorated_share
        ladder:
          - when: the defect is found no more than satisfaction_trial_days days after install_date
            method: 'mileage share: miles run times 100 divided by warranted_miles'
          - when: found after the trial, at least workmanship_free_replacement_months months after purchase, with tread worn at most workmanship_free_replacement_wear_32nds
            method: 'time share: whole months elapsed times 100 divided by warranty_term_months'
          - when: otherwise
            method: 'tread share: tread worn times 100 divided by the usable tread'
        baseline:
          prorated_share: tread_worn * 100 / usable_tread
        evidence:
          - date
          - history
        cross_difficulty: null
      - id: defect_class_cut
        effect: parameter
        decides: class_cut
        bindings:
          - defect_readings
          - class_cut
        ladder:
          - when: the inspection entry records a tread separation or a belt shift
            value: K('structural_defect_cut_pct') percent of the prorated share off
          - when: the inspection entry records a bead leak
            value: K('bead_leak_cut_pct') percent of the prorated share off
          - when: otherwise (out of round)
            value: '0'
        baseline:
          class_cut: '0'
        evidence:
          - history
        cross_difficulty: null
      - id: maintained_set_discount
        effect: parameter
        decides: maint_disc
        bindings:
          - maint_odo
          - maint_miles
          - rotations
          - maint_disc
        ladder:
          - when: at least one rotation and at least the miles run divided by recommended_rotation_miles rotations
            value: K('maintained_set_discount_full') percent of the prorated share off
          - when: at least one rotation, fewer than that, but at least the miles run divided by rotation_interval_max_miles rotations
            value: K('maintained_set_discount_basic') percent of the prorated share off
          - when: otherwise
            value: '0'
        baseline:
          maint_disc: '0'
        evidence:
          - history
        cross_difficulty: null
      - id: alignment_maintained_discount
        effect: parameter
        decides: align_disc
        bindings:
          - plan_id
          - plan_term_basis
          - plan_entitlement
          - last_alignment
          - alignment_age
          - align_disc
        ladder:
          - when: an active lifetime alignment plan whose latest alignment is fewer than alignment_window_months months before the visit
            value: K('lifetime_alignment_discount') percent of the prorated share off
          - when: an active 1-year or 3-year alignment plan with such an alignment
            value: K('plan_alignment_discount') percent of the prorated share off
          - when: otherwise
            value: '0'
        baseline:
          align_disc: '0'
        evidence:
          - cross_category
          - date
        cross_difficulty: alignment
      - id: replacement_mounting_waiver
        effect: parameter
        decides: mount_part
        bindings:
          - haz_mount
          - mount_part
        ladder:
          - when: an active road hazard certificate on the set whose plan includes mounting on replacements
            value: '0'
          - when: an active road hazard certificate on the set whose plan does not include mounting on replacements
            value: half of the line's mounting part
          - when: otherwise
            value: the line's mounting part
        baseline:
          mount_part: line_mount
        evidence:
          - cross_category
        cross_difficulty: hazard
    baseline:
      rule: The defective tire's tread worn is original_tread_depth_32nds minus that entry's min_tread_depth_32nds, and the usable tread is original_tread_depth_32nds minus wear_out_tread_depth_32nds. The replacement is free, and the workmanship share is 0.00, while fewer than workmanship_free_replacement_months whole calendar months have elapsed from purchase_date to the replacement visit and the tread worn is at most workmanship_free_replacement_wear_32nds. Otherwise the prorated share is the tread worn times 100 divided by the usable tread. The workmanship share percentage is the prorated share. The mounting part is mounting_balancing_charge_per_tire when workmanship_mounting_charged_after_free_period is true, and 0 otherwise. The workmanship share is the unit_price times the workmanship share percentage divided by 100, rounded half up to the cent, plus the mounting part.
      params:
        - original_tread_depth_32nds
        - wear_out_tread_depth_32nds
        - workmanship_free_replacement_months
        - workmanship_free_replacement_wear_32nds
        - mounting_balancing_charge_per_tire
        - workmanship_mounting_charged_after_free_period
    inputs:
      history:
        - table: tire_events
          aggregate: latest
          field: min_tread_depth_32nds
          filters:
            event_type: tires_tread_inspection
        - table: tire_events
          aggregate: count
          field: tire_event_id
          filters:
            event_type: tires_rotation_service
        - category: alignment
          table: alignment_events
          aggregate: latest
          field: event_date
          filters:
            event_type: alignment_service_performed
      cross_category:
        - hazard
        - alignment
  - id: tires_ext_trial_refund
    base_policy_refs:
      - tires_evt_satisfaction_trial
      - tires_evt_order_cancellation
      - tires_refund_tender
      - tires_treadwear_workmanship_exclusion
      - tires_purchase_ticket
    overwrite:
      - base_policy: tires_evt_satisfaction_trial
        superseded_clause: A set with any treadwear adjustment or workmanship replacement is past the trial.
        replaced_by: For a trial refund this policy pays, and only for such a refund, a set whose only warranty entries are workmanship replacements recorded while the set was inside its trial stays in the trial; every other set with a treadwear adjustment or a workmanship replacement remains past the trial.
      - base_policy: tires_evt_satisfaction_trial
        superseded_clause: 'The return is the customer''s own decision about their tires: the agent registers the request and the customer confirms it, and only the confirmation returns the set.'
        replaced_by: 'The return is the customer''s own decision about their tires: the agent registers the request and the customer confirms it, and only the confirmation returns the set, for every return request this policy does not pay; for a trial refund this policy pays, the customer confirms the return in person, and that confirmation records the confirmed request and returns the set.'
      - base_policy: tires_evt_satisfaction_trial
        superseded_clause: The amount returned is tire_count times unit_price, less any set_instant_savings the ticket received, plus the mounting, valve-stem or TPMS-kit charges per tire when satisfaction_refund_includes_installation is true; disposal fees and any rotation charges are never returned.
        replaced_by: The amount returned is tire_count times unit_price, less any set_instant_savings the ticket received, plus the mounting, valve-stem or TPMS-kit charges per tire when satisfaction_refund_includes_installation is true, on every trial return this policy does not pay, and disposal fees and any rotation charges are never returned; for a trial refund this policy pays, the trial refund on the set's ticket is the tire price paid, plus every part this policy returns and less every charge it takes, each worked out on its own, valve stems and TPMS service kits stay on the vehicle's wheels and are not refunded, and disposal fees and any rotation charges are never returned.
    trigger: on_request
    subject:
      - tires_satisfaction_return
      - tires_refund
    computes: amount
    target_tool: confirm_trial_return_33503dcd
    params:
      per_mile_usage_rate: 0.005
      flat_usage_fee_per_tire: 6.0
      truck_line_min_depth_32nds: 14
      truck_restock_late_pct: 5
      truck_restock_early_pct: 2
    rule: 'A trial refund is worked out for an active set returned inside its satisfaction trial from the set''s ticket, its activity history and the alignment plan on its vehicle. The tire price paid is tire_count times unit_price, less set_instant_savings when the ticket had at least set_instant_savings_min_tires tires, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date when the ticket was charged to a fleet account. The refunded installation part is tire_count times mounting_balancing_charge_per_tire when satisfaction_refund_includes_installation is true, and 0 otherwise. The trial refund on the set''s ticket is the tire price paid plus the refunded installation part, rounded half up to the cent; disposal fees and any rotation charges are never returned. The fleet discount on a tires invoice is one percentage taken on every discountable line of the ticket, the tire price, the mounting and the valve-stem or TPMS-kit lines alike; wherever the tire price paid takes it off, the whole discount_amount of that invoice is counted against the tire price, the part taken on the mounting and kit lines included, because those lines are never figured below the line''s own charges here, and a ticket of an ordered set carries the tire price alone. The amount returned is tire_count times unit_price, less any set_instant_savings the ticket received, plus the mounting, valve-stem or TPMS-kit charges per tire when satisfaction_refund_includes_installation is true, on every trial return this policy does not pay, and disposal fees and any rotation charges are never returned; for a trial refund this policy pays, the trial refund on the set''s ticket is the tire price paid, plus every part this policy returns and less every charge it takes, each worked out on its own, valve stems and TPMS service kits stay on the vehicle''s wheels and are not refunded, and disposal fees and any rotation charges are never returned. For a trial refund this policy pays, and only for such a refund, a set whose only warranty entries are workmanship replacements recorded while the set was inside its trial stays in the trial; every other set with a treadwear adjustment or a workmanship replacement remains past the trial. The trial refund is figured from the set''s warranty ledger: the installation part it returns depends on the workmanship replacement entries of the set, and every share the customer paid for a tire the store replaced under the workmanship warranty is refunded, in the amount recorded on its workmanship replacement entry, on the counter ticket it was paid on and to the tender that paid that ticket, never added to the refund on the set''s ticket; sales tax on either ticket is returned by the point-of-sale tax line and is never part of these amounts. The trial refund is not paid until every manufacturing defect recorded on an inspection entry of the set carries a workmanship replacement entry on the set. The return is the customer''s own decision about their tires: the agent registers the request and the customer confirms it, and only the confirmation returns the set, for every return request this policy does not pay; for a trial refund this policy pays, the customer confirms the return in person, and that confirmation records the confirmed request and returns the set. The refunded installation part, returned with the refund, follows how the set leaves the trial: a set with a workmanship replacement entry gets tire_count times mounting_balancing_charge_per_tire back; a set with no workmanship replacement entry returned within half of satisfaction_trial_days, its days kept being the calendar days from install_date to today, gets half of that back; any other set gets the installation part as the line sets it. The usage charge, taken from the refund, follows how far and how long the set was used, the miles run being the odometer of the set''s latest tread inspection entry minus install_odometer, or 0 for a set with no tread inspection entry, and the days kept the calendar days from install_date to today: a set whose miles run exceed two thirds of satisfaction_trial_max_miles and whose days kept exceed half of satisfaction_trial_days is charged its miles run times per_mile_usage_rate times tire_count; a set that does not meet both of those conditions but whose miles run exceed one third of satisfaction_trial_max_miles is charged flat_usage_fee_per_tire times tire_count; any other set is charged nothing. The bundle recapture, taken from the refund, follows the alignment plan on the vehicle: when an active alignment plan on the vehicle was bought no more than its tire_bundle_window_days after the set''s install_date at a purchase_price below its plan_price, so that the tire bundle discount was given, and has been used for more than the one alignment of its purchase visit, its full tire_bundle_discount is recaptured; when such a plan has been used for exactly the alignment of its purchase visit, half of its tire_bundle_discount is recaptured; otherwise nothing is recaptured. The truck-size restocking fee, taken from the refund, follows the line and the days kept: a line whose original_tread_depth_32nds is at least truck_line_min_depth_32nds returned more than half of satisfaction_trial_days calendar days after install_date pays truck_restock_late_pct percent of the tire price paid; such a line returned within half of satisfaction_trial_days pays truck_restock_early_pct percent of it; any other line pays nothing. None of these parts is rounded on its own; the trial refund is rounded half up to the cent once, at the end, and is returned to the tender that paid the set''s ticket, or as store credit for an exchange.'
    prerequisite:
      - problem: tires_ext_workmanship_share
        kind: value_input
        gate: install_part
        form: state
        policy_source: The trial refund is not paid until every manufacturing defect recorded on an inspection entry of the set carries a workmanship replacement entry on the set.
        condition: every tire_events tread inspection entry of the set whose defect_code is not none is cited by a tires_workmanship_replacement entry of the set (source_tire_event_id).
        resolved_by: record_workmanship_replacement_cc1528ea
        effect: the workmanship replacement entry books the share charged for the defective tire, so the refunded installation part moves to the full mounting charge per tire and the share becomes refundable on its own counter ticket.
    cross_category:
      - category: alignment
        as: branch
        reads:
          - status
          - alignment_plan_id
          - purchase_date
          - variant_name
          - alignment_events.event_type
        note: decides the bundle recapture from the vehicle's alignment plan, its bundle discount and its performed alignments.
      - category: fleet
        as: value
        reads:
          - fleet_transactions.discount_amount
          - fleet_transactions.event_type
          - fleet_transactions.vehicle_id
          - fleet_transactions.service_category
          - fleet_transactions.txn_date
        note: takes the fleet discount on the tires invoice off the tire price paid when the ticket was charged to a fleet account.
    compute:
      - paid_fleet_discount: XLATEST('fleet','fleet_transactions','discount_amount', event_type='fleet_invoice_posted', vehicle_id=F('vehicle_id'), service_category='tires', txn_date=F('purchase_date'), date_field='txn_date')
      - tire_price_paid: F('tire_count') * F('unit_price') - (P('set_instant_savings') if F('tire_count') >= P('set_instant_savings_min_tires') else 0) - ((0 if paid_fleet_discount == None else paid_fleet_discount) if F('payment_method') == 'fleet_account' else 0)
      - line_install: F('tire_count') * P('mounting_balancing_charge_per_tire') if P('satisfaction_refund_includes_installation') else 0
      - wrk_count: COUNT('tire_events', event_type='tires_workmanship_replacement')
      - days_kept: DAYS(F('install_date'), NOW)
      - install_part: F('tire_count') * P('mounting_balancing_charge_per_tire') if wrk_count >= 1 else (F('tire_count') * P('mounting_balancing_charge_per_tire') / 2 if (wrk_count == 0 and days_kept * 2 <= P('satisfaction_trial_days')) else line_install)
      - last_odo: LATEST('tire_events','odometer', event_type='tires_tread_inspection')
      - miles_run: 0 if last_odo == None else last_odo - F('install_odometer')
      - usage_days: DAYS(F('install_date'), NOW)
      - usage_charge: miles_run * K('per_mile_usage_rate') * F('tire_count') if (miles_run * 3 > P('satisfaction_trial_max_miles') * 2 and usage_days * 2 > P('satisfaction_trial_days')) else (K('flat_usage_fee_per_tire') * F('tire_count') if (miles_run * 3 > P('satisfaction_trial_max_miles') and not (miles_run * 3 > P('satisfaction_trial_max_miles') * 2 and usage_days * 2 > P('satisfaction_trial_days'))) else 0)
      - plan_id: CFIELD('alignment','alignment_plan_id', vehicle_id=F('vehicle_id'), status='active')
      - plan_date: CFIELD('alignment','purchase_date', vehicle_id=F('vehicle_id'), status='active')
      - plan_disc: CPARAM('alignment','tire_bundle_discount', vehicle_id=F('vehicle_id'), status='active')
      - plan_window: CPARAM('alignment','tire_bundle_window_days', vehicle_id=F('vehicle_id'), status='active')
      - plan_alignments: XCOUNT('alignment','alignment_events', event_type='alignment_service_performed', alignment_plan_id=plan_id)
      - plan_paid: CFIELD('alignment','purchase_price', vehicle_id=F('vehicle_id'), status='active')
      - plan_list: CPARAM('alignment','plan_price', vehicle_id=F('vehicle_id'), status='active')
      - bundled: plan_date != None and plan_disc > 0 and DAYS(F('install_date'), plan_date) >= 0 and DAYS(F('install_date'), plan_date) <= plan_window and plan_paid < plan_list
      - recapture: plan_disc if (bundled and plan_alignments >= 2) else (plan_disc / 2 if (bundled and plan_alignments == 1) else 0)
      - restock_days: DAYS(F('install_date'), NOW)
      - restock_fee: tire_price_paid * K('truck_restock_late_pct') / 100 if (P('original_tread_depth_32nds') >= K('truck_line_min_depth_32nds') and restock_days * 2 > P('satisfaction_trial_days')) else (tire_price_paid * K('truck_restock_early_pct') / 100 if (P('original_tread_depth_32nds') >= K('truck_line_min_depth_32nds') and restock_days * 2 <= P('satisfaction_trial_days')) else 0)
      - result: RND(tire_price_paid + install_part - usage_charge - recapture - restock_fee, 2)
    compute_basis:
      paid_fleet_discount: less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date when the ticket was charged to a fleet account
      tire_price_paid: The tire price paid is tire_count times unit_price, less set_instant_savings when the ticket had at least set_instant_savings_min_tires tires, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date when the ticket was charged to a fleet account.
      line_install: The refunded installation part is tire_count times mounting_balancing_charge_per_tire when satisfaction_refund_includes_installation is true, and 0 otherwise.
      wrk_count: a set with a workmanship replacement entry gets tire_count times mounting_balancing_charge_per_tire back
      days_kept: its days kept being the calendar days from install_date to today
      install_part: a set with a workmanship replacement entry gets tire_count times mounting_balancing_charge_per_tire back; a set with no workmanship replacement entry returned within half of satisfaction_trial_days, its days kept being the calendar days from install_date to today, gets half of that back; any other set gets the installation part as the line sets it.
      last_odo: the miles run being the odometer of the set's latest tread inspection entry minus install_odometer, or 0 for a set with no tread inspection entry
      miles_run: the miles run being the odometer of the set's latest tread inspection entry minus install_odometer, or 0 for a set with no tread inspection entry
      usage_charge: a set whose miles run exceed two thirds of satisfaction_trial_max_miles and whose days kept exceed half of satisfaction_trial_days is charged its miles run times per_mile_usage_rate times tire_count; a set that does not meet both of those conditions but whose miles run exceed one third of satisfaction_trial_max_miles is charged flat_usage_fee_per_tire times tire_count; any other set is charged nothing.
      plan_id: follows the alignment plan on the vehicle
      plan_date: was bought no more than its tire_bundle_window_days after the set's install_date
      plan_disc: its full tire_bundle_discount is recaptured
      plan_window: no more than its tire_bundle_window_days after the set's install_date
      plan_alignments: has been used for more than the one alignment of its purchase visit
      plan_paid: at a purchase_price below its plan_price, so that the tire bundle discount was given
      plan_list: at a purchase_price below its plan_price, so that the tire bundle discount was given
      bundled: when an active alignment plan on the vehicle was bought no more than its tire_bundle_window_days after the set's install_date at a purchase_price below its plan_price, so that the tire bundle discount was given
      recapture: when an active alignment plan on the vehicle was bought no more than its tire_bundle_window_days after the set's install_date at a purchase_price below its plan_price, so that the tire bundle discount was given, and has been used for more than the one alignment of its purchase visit, its full tire_bundle_discount is recaptured; when such a plan has been used for exactly the alignment of its purchase visit, half of its tire_bundle_discount is recaptured; otherwise nothing is recaptured.
      restock_days: returned more than half of satisfaction_trial_days calendar days after install_date
      restock_fee: a line whose original_tread_depth_32nds is at least truck_line_min_depth_32nds returned more than half of satisfaction_trial_days calendar days after install_date pays truck_restock_late_pct percent of the tire price paid; such a line returned within half of satisfaction_trial_days pays truck_restock_early_pct percent of it; any other line pays nothing.
      result: None of these parts is rounded on its own; the trial refund is rounded half up to the cent once, at the end, and is returned to the tender that paid the set's ticket, or as store credit for an exchange.
      usage_days: and the days kept the calendar days from install_date to today
    factors:
      - id: refunded_installation_part
        effect: parameter
        decides: install_part
        bindings:
          - days_kept
          - wrk_count
          - install_part
        ladder:
          - when: the set carries a workmanship replacement entry
            value: tire_count times mounting_balancing_charge_per_tire
          - when: no workmanship replacement entry and returned within half of satisfaction_trial_days
            value: half of tire_count times mounting_balancing_charge_per_tire
          - when: otherwise
            value: the installation part as the line sets it
        baseline:
          install_part: line_install
        evidence:
          - history
          - date
        cross_difficulty: null
      - id: trial_usage_charge
        effect: method
        decides: usage_charge
        bindings:
          - last_odo
          - miles_run
          - usage_days
          - usage_charge
        ladder:
          - when: miles run above two thirds of satisfaction_trial_max_miles and days kept above half of satisfaction_trial_days
            method: 'per-mile charge: miles run times per_mile_usage_rate times tire_count'
          - when: not both of those, but miles run above one third of satisfaction_trial_max_miles
            method: 'flat charge: flat_usage_fee_per_tire times tire_count'
          - when: otherwise
            method: no usage charge
        baseline:
          usage_charge: '0'
        evidence:
          - history
          - date
        cross_difficulty: null
      - id: alignment_bundle_recapture
        effect: parameter
        decides: recapture
        bindings:
          - plan_id
          - plan_date
          - plan_disc
          - plan_window
          - plan_paid
          - plan_list
          - plan_alignments
          - bundled
          - recapture
        ladder:
          - when: an active alignment plan on the vehicle bought within its bundle window after the set's install_date with the bundle discount given, used for more than its purchase-visit alignment
            value: the plan's full tire_bundle_discount
          - when: such a bundled plan used for exactly its purchase-visit alignment
            value: half of the plan's tire_bundle_discount
          - when: otherwise
            value: '0'
        baseline:
          recapture: '0'
        evidence:
          - cross_category
          - date
        cross_difficulty: alignment
      - id: truck_size_restock
        effect: parameter
        decides: restock_fee
        bindings:
          - restock_days
          - restock_fee
        ladder:
          - when: original_tread_depth_32nds at least truck_line_min_depth_32nds and returned more than half of satisfaction_trial_days days after install_date
            value: K('truck_restock_late_pct') percent of the tire price paid
          - when: original_tread_depth_32nds at least truck_line_min_depth_32nds and returned within half of satisfaction_trial_days days after install_date
            value: K('truck_restock_early_pct') percent of the tire price paid
          - when: otherwise
            value: '0'
        baseline:
          restock_fee: '0'
        evidence:
          - tier_param
          - date
        cross_difficulty: null
    baseline:
      rule: The tire price paid is tire_count times unit_price, less set_instant_savings when the ticket had at least set_instant_savings_min_tires tires, less the fleet discount taken on the tires invoice posted for the vehicle on purchase_date when the ticket was charged to a fleet account. The refunded installation part is tire_count times mounting_balancing_charge_per_tire when satisfaction_refund_includes_installation is true, and 0 otherwise. The trial refund on the set's ticket is the tire price paid plus the refunded installation part, rounded half up to the cent; disposal fees and any rotation charges are never returned.
      params:
        - set_instant_savings
        - set_instant_savings_min_tires
        - mounting_balancing_charge_per_tire
        - satisfaction_refund_includes_installation
    inputs:
      history:
        - table: tire_events
          aggregate: latest
          field: odometer
          filters:
            event_type: tires_tread_inspection
        - category: alignment
          table: alignment_events
          aggregate: count
          field: alignment_event_id
          filters:
            event_type: alignment_service_performed
      cross_category:
        - alignment
        - fleet
