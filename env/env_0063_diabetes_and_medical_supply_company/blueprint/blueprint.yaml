# Blueprint - Larkfield Medical Supply (diabetes and chronic care home supplies, patient services).
name: env_0063_diabetes_and_medical_supply_company
company: Larkfield Medical Supply
background: |
  Larkfield Medical Supply is a national mail-order supplier of diabetes and chronic care products, accredited as a Medicare DMEPOS supplier and licensed as a mail-order pharmacy, shipping from two distribution centers in Ohio and Nevada to about 214,000 patients in all fifty states.
  It is paid mostly by insurers rather than by patients: Original Medicare through the DME contractors, Medicare Advantage and Part D plans, state Medicaid programs and commercial HMO and PPO plans, with a cash channel for patients who pay for themselves, and its patient services desk speaks in a calm, plain-language tone with callers who are often older, managing several conditions, or calling for a family member.
  Patients hold supply programs, each opened from a prescriber's referral and bound to the insurance coverage it bills, and each program's tier is the payer program that coverage belongs to.
  The Continuous Glucose Monitoring Supply Program is offered as the CGM Self-Pay Program, CGM Commercial HMO Program, CGM Commercial PPO Program, CGM Medicare Advantage Program, CGM Original Medicare Program and CGM Medicaid Program, and ships Dexcom and FreeStyle Libre sensors and receivers.
  The Blood Glucose Testing Supply Program is offered as the Testing Supplies Self-Pay Program, Testing Supplies Commercial HMO Program, Testing Supplies Commercial PPO Program, Testing Supplies Medicare Advantage Program, Testing Supplies Original Medicare Program and Testing Supplies Medicaid Program, and ships meters, test strips, lancets and control solution.
  The Insulin Pump Program is offered as the Insulin Pump Self-Pay Program, Insulin Pump Commercial HMO Program, Insulin Pump Commercial PPO Program, Insulin Pump Medicare Advantage Program, Insulin Pump Original Medicare Program and Insulin Pump Medicaid Program, and supplies Tandem, Medtronic MiniMed and Beta Bionics pumps with their infusion sets, cartridges and reservoirs.
  The Insulin and Injection Supply Pharmacy Program is offered as the Insulin Pharmacy Self-Pay Program, Insulin Pharmacy Commercial HMO Program, Insulin Pharmacy Commercial PPO Program, Insulin Pharmacy Medicare Advantage Prescription Drug Program, Insulin Pharmacy Medicare Part D Program, Insulin Pharmacy Medicare Part B Pump Insulin Program and Insulin Pharmacy Medicaid Program, and dispenses insulin vials and pens, pen needles and syringes in cold-chain shippers.
  The Ostomy Supply Program is offered as the Ostomy Self-Pay Program, Ostomy Commercial HMO Program, Ostomy Commercial PPO Program, Ostomy Medicare Advantage Program, Ostomy Original Medicare Program and Ostomy Medicaid Program, and ships one-piece and two-piece barriers, pouches and accessories.
  The Urology and Continence Supply Program is offered as the Continence Self-Pay Program, Continence Commercial HMO Program, Continence Commercial PPO Program, Continence Medicare Advantage Program, Continence Original Medicare Program and Continence Medicaid Program, and ships intermittent, external and indwelling catheters, drainage bags and absorbent products.
  The Wound Care Supply Program is offered as the Wound Care Self-Pay Program, Wound Care Commercial HMO Program, Wound Care Commercial PPO Program, Wound Care Medicare Advantage Program, Wound Care Original Medicare Program and Wound Care Medicaid Program, and ships alginate, foam, hydrocolloid, hydrogel, film, composite and gauze dressings for each wound.
  Every program keeps a running record of what happens to it: written orders, prior authorization requests and payer decisions, clinical visit notes, and liability notices the patient signs; refill, replacement and sample shipments with their carrier proofs of delivery, return authorizations and returns; and claims, remittances, denials, appeals, patient charges, payments, adjustments and refunds.
  Each program also carries the billing units still authorized to ship and the patient's balance on it, both kept as the running total of those records.
  The people who call are patients, spouses and adult children acting as caregivers, most of them on Medicare or Medicaid, and a typical caller holds two or three programs at once - a CGM program with a testing supplies program and an insulin pharmacy program, a pump program beside its CGM, or an ostomy program together with a continence program.
  They bring histories of quarterly refills, insurance changes at the turn of the year, expiring prescriptions and authorizations, hospital stays, lost or damaged packages, denied claims and small balances, and they usually remember the product and the problem better than the dates and reference numbers on their account.
logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs
difficulties:
  - name: cgm_sensor_supply_services
    claim:
      categories: [cgm]
      event_types: [cgm_program_enroll, cgm_program_change, cgm_program_hold, cgm_program_resume, cgm_program_discontinue, cgm_prior_auth_request, cgm_authorization_grant, cgm_medical_record_receipt, cgm_liability_notice_signed, cgm_refill_shipment, cgm_replacement_shipment, cgm_return_authorization, cgm_claim_submission, cgm_appeal_filing, cgm_patient_charge, cgm_balance_adjustment]
    summary: >-
      Callers are CGM users or their caregivers on any of the six CGM tiers, asking for a sensor refill, a new receiver, a model change, a pause during a hospital stay, help with a package that never arrived or a box of sensors they no longer need, or an explanation of a denied claim or a balance; their situation differs by tier, by whether the program is referral_received, pending_authorization, active or on_hold, by their insulin regimen and CGM model, by whether they also hold a pump program, and by a history of previous refills, visits, authorizations and claims.
      The records involved are the CGM program with its tier, coverage, model, regimen, authorized units and balance; its written orders, authorization grants, prior authorization requests and denials and visit notes; its refill, replacement, delivery and return records; its claims, remittances, denials and patient-account postings; the coverage records; and the customer's pump program, read for compatibility.
      The governing rules are state and authorization gates (an active program and a valid authorization drawn under cgm_evt_refill_shipment), time windows that vary by tier (the refill-too-soon limit and coverage reverification in cgm_evt_refill_shipment, the follow-up visit interval in cgm_continued_coverage_visits, the receiver replacement interval in cgm_evt_quantity_limits, the damage, return, appeal and filing windows in cgm_evt_replacement_and_delivery, cgm_evt_returns, cgm_evt_denials_and_appeals and cgm_evt_claims), quantity rules that convert supply days into allowance units and sensors per model (cgm_evt_quantity_limits), the pump compatibility and duplicate-sensor exclusion (cgm_combo_pump_compatibility), and the money rules for patient responsibility, liability notices, charges and adjustments (cgm_evt_claims, cgm_liability_notice, cgm_evt_patient_account); in the domain's natural order a program is enrolled, documented and authorized before it is activated, refills follow confirmation, and claims follow shipments.
      Refills, replacements, return authorizations, holds, authorization requests, claims, appeals and adjustments are agent service actions on a verified account, while signing a liability notice, accepting a payment plan and confirming a cancellation can only be done by the customer and are handed to them through the customer-side tools.
      Requests no CGM policy decides - a sensor model Larkfield does not carry, an implantable sensor, a dispute about the clinical judgement in a visit note, or a request to ship to an address other than the one on the customer's profile - can only be routed to a human with POLICY_NOT_COVERED.
  - name: insulin_pump_program_services
    claim:
      categories: [pump]
      event_types: [pump_program_enroll, pump_program_change, pump_program_hold, pump_program_resume, pump_program_discontinue, pump_prior_auth_request, pump_medical_record_receipt, pump_liability_notice_signed, pump_refill_shipment, pump_replacement_shipment, pump_defective_device_return, pump_return_authorization, pump_rental_claim, pump_ownership_transfer, pump_claim_submission, pump_appeal_filing, pump_patient_charge, pump_balance_adjustment]
    summary: >-
      Callers are insulin pump users and caregivers on the six pump tiers, calling about a pump that alarms or stops, a replacement pump at the end of its life, infusion set and cartridge refills, rental months and ownership of a Medicare pump, sensors for an integrated system, or a denied pump claim; their setting varies by tier and acquisition method, pump model and its age against the warranty and the payer's replacement interval, program status, whether a CGM program is also held, and the history of warranty claims, exchanges, rental claims and supply refills.
      The records involved are the pump program with model, serial number, original delivery date, ownership status, authorized units and balance; its orders, authorizations, training and visit records; refill, exchange, delivery and defective-device return records; rental claims, claims, remittances, denials and patient-account postings; coverage records; and the customer's CGM and insulin pharmacy programs, read for the sensor source and the Part B pump insulin benefit.
      The governing rules are the warranty window and manufacturer exchange procedure (pump_warranty_and_defects), the payer replacement interval, per-model supply quantities and training gate (pump_evt_quantity_limits), the capped rental count and ownership transfer that differ by tier (pump_capped_rental), the sensor-source and Part B insulin interplay (pump_combo_sensor_and_insulin), and the shared refill, replacement, return, claim, denial, liability and account rules (pump_evt_refill_shipment, pump_evt_replacement_and_delivery, pump_evt_returns, pump_evt_claims, pump_evt_denials_and_appeals, pump_liability_notice, pump_evt_patient_account); in the domain's natural order a malfunction is logged and troubleshot before an exchange ships, and an exchange ships before the malfunctioning pump comes back.
      Logging warranty claims, recording exchanges and returns, refills, rental claims, ownership changes, holds, claims and appeals are agent service actions, while a liability notice for an early pump, acceptance of a payment plan and confirmation of a cancellation belong to the customer and are handed to them.
      Situations the pump rules do not decide - a lost, stolen or accidentally damaged pump, a pump model Larkfield does not supply, a request to buy out a capped-rental pump before ownership transfers, or a dispute over a manufacturer's invoice for an unreturned pump - can only be routed to a human with POLICY_NOT_COVERED.
  - name: testing_supply_program_services
    claim:
      categories: [bgm]
      event_types: [bgm_program_enroll, bgm_program_change, bgm_program_hold, bgm_program_resume, bgm_program_discontinue, bgm_prior_auth_request, bgm_medical_record_receipt, bgm_liability_notice_signed, bgm_refill_shipment, bgm_replacement_shipment, bgm_return_authorization, bgm_claim_submission, bgm_appeal_filing, bgm_patient_charge, bgm_balance_adjustment]
    summary: >-
      Callers are people who test with a meter, often alongside a CGM, asking for more strips, a new meter, a different brand, a refill before they run out, a replacement for expired strips, or help with a denied strip claim or a small balance; their setting varies by the six testing supplies tiers, by treatment class (insulin-treated or not), by the meter model against the tier's preferred list, by program status, by whether a CGM program is active, and by the strips already shipped in the rolling window and the documentation on file.
      The records involved are the testing supplies program with tier, meter model, treatment class, meter ship date, authorized units and balance; its orders, formulary exceptions, testing-frequency records and liability notices; refill, replacement, delivery and return records; claims and patient-account postings; coverage records; and the customer's CGM program, read for the backup-testing reduction.
      The governing rules are the rolling strip and lancet allowances that differ by tier and treatment class, the above-allowance documentation route, and the control solution, lancing device and meter intervals (bgm_evt_quantity_limits, measured by bgm_msr_strips_shipped_90d), the preferred-meter and exception rule (bgm_preferred_meter), the CGM backup reduction (bgm_combo_cgm_backup), and the shared refill, replacement, return, claim, denial, liability and account rules (bgm_evt_refill_shipment, bgm_evt_replacement_and_delivery, bgm_evt_returns, bgm_evt_claims, bgm_evt_denials_and_appeals, bgm_liability_notice, bgm_evt_patient_account); in the domain's natural order a written order and its authorization come before refills, and a refill's quantity is fixed before it is billed.
      Refills, replacements, return authorizations, exception requests, holds, claims, appeals and adjustments are agent service actions, while signing a liability notice for strips above the allowance or for a non-preferred meter, accepting a payment plan and confirming a cancellation are the customer's own acts.
      Requests no testing supplies rule decides - a meter brand Larkfield does not carry, a demand for strips for a meter not on the program, or a complaint about a meter's accuracy beyond a defect as shipped - can only be routed to a human with POLICY_NOT_COVERED.
  - name: ostomy_supply_program_services
    claim:
      categories: [ostomy]
      event_types: [ostomy_program_enroll, ostomy_program_change, ostomy_program_hold, ostomy_program_resume, ostomy_program_discontinue, ostomy_prior_auth_request, ostomy_medical_record_receipt, ostomy_liability_notice_signed, ostomy_refill_shipment, ostomy_replacement_shipment, ostomy_sample_shipment, ostomy_return_authorization, ostomy_claim_submission, ostomy_appeal_filing, ostomy_patient_charge, ostomy_balance_adjustment]
    summary: >-
      Callers are people living with a colostomy, ileostomy or urostomy, and sometimes two stomas, and their caregivers, asking for a refill, more barriers because of leaks, a convex barrier, samples of a different system, a replacement for the wrong size, the return of unopened boxes after a product change, or help with a denial; their setting varies by the six ostomy tiers, ostomy type, one-piece or two-piece system, convexity, program status, whether a second ostomy program or a continence program is held, and the history of shipments, samples, records and claims.
      The records involved are each ostomy program with tier, ostomy type, appliance system, convexity, surgery date, authorized units and balance; its orders, authorizations, clinical records and liability notices; refill, replacement, sample, delivery and return records; claims and patient-account postings; and the coverage records.
      The governing rules are the per-item monthly allowances that differ by tier, the system and stoma-type item eligibility, the convexity and above-allowance documentation routes (ostomy_evt_quantity_limits), the one-program-per-stoma charter and the per-customer accessory and consolidated-shipping basis for two stomas (ostomy_agg_multi_holding, ostomy_agg_dual_stoma_accessories), the sample limit (ostomy_samples), and the shared refill, replacement, return, claim, denial, liability and account rules (ostomy_evt_refill_shipment, ostomy_evt_replacement_and_delivery, ostomy_evt_returns, ostomy_evt_claims, ostomy_evt_denials_and_appeals, ostomy_liability_notice, ostomy_evt_patient_account); in the domain's natural order a written order names a product before it is supplied, and documentation is on file before an above-allowance quantity ships.
      Refills, samples, replacements, return authorizations, holds, authorization requests, claims, appeals and adjustments are agent service actions, while a liability notice for an above-allowance quantity, a payment plan and a cancellation are confirmed by the customer themselves.
      Requests no ostomy rule decides - clinical advice about skin or stoma problems, a product Larkfield does not carry, or a request to be supplied for a stoma that has been reversed - can only be routed to a human with POLICY_NOT_COVERED.
  - name: continence_supply_program_services
    claim:
      categories: [continence]
      event_types: [continence_program_enroll, continence_program_change, continence_program_hold, continence_program_resume, continence_program_discontinue, continence_prior_auth_request, continence_medical_record_receipt, continence_liability_notice_signed, continence_refill_shipment, continence_replacement_shipment, continence_sample_shipment, continence_return_authorization, continence_claim_submission, continence_appeal_filing, continence_patient_charge, continence_balance_adjustment]
    summary: >-
      Callers are people who catheterize or manage incontinence, and the family members who order for them, asking for catheter refills, coude or closed-system catheters, briefs and underpads, a switch between catheter types, samples, a replacement for the wrong French size, or help with a denied claim or a charge for products their plan does not cover; their setting varies by the six continence tiers, the product lines held (up to two at a time), catheter tip, program status, whether absorbent products are covered on the tier, and the history of shipments, records and claims.
      The records involved are each continence program with tier, product line, catheter tip, authorized units and balance; its orders, authorizations, qualification records and liability notices; refill, replacement, sample, delivery and return records; claims and patient-account postings; and the coverage records.
      The governing rules are the per-item allowances and combined absorbent cap that differ by tier, the coude, closed-system and incontinence-assessment documentation gates and the above-allowance route (continence_evt_quantity_limits), the two-line charter and the shared-drainage-bag and consolidated-shipping basis (continence_agg_multi_holding, continence_agg_consolidated_supply), the indwelling exclusion (continence_combo_indwelling_exclusion), the sample limit (continence_samples), and the shared refill, replacement, return, claim, denial, liability and account rules (continence_evt_refill_shipment, continence_evt_replacement_and_delivery, continence_evt_returns, continence_evt_claims, continence_evt_denials_and_appeals, continence_liability_notice, continence_evt_patient_account); in the domain's natural order a product line excluded by another must be closed before the new line's first refill, and documentation precedes a special catheter.
      Refills, samples, replacements, return authorizations, holds, authorization requests, claims, appeals and adjustments are agent service actions, while a liability notice for products the tier does not cover, a payment plan and a cancellation can only be accepted by the customer.
      Requests no continence rule decides - clinical questions about catheterization technique or infections, a product Larkfield does not carry, or a request to deliver supplies to a care facility or any address other than the one on the customer's profile - can only be routed to a human with POLICY_NOT_COVERED.
