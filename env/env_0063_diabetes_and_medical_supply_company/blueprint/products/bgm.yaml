    standard_shipping_fee_usd: 0.0
    free_shipping_threshold_usd: 0.0
    expedited_shipping_fee_usd: 24.5
    carrier_trace_business_days: 3
    courtesy_reships_per_12_months: 1
    damage_report_days: 7
    return_window_days: 30
    restocking_fee_pct: 0
    opened_returnable: false
    inpatient_hold_required: true
    hold_max_days: 60
