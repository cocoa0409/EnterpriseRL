# Product charter - Insulin Pump Program (pump). Larkfield Medical Supply.
category: pump
display_name: Insulin Pump Program
binding:
  holding_table: pump_programs
  event_tables: [pump_orders, pump_shipments, pump_billing]
  intake_tables: [pump_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {authorized_units_remaining: authorized_units, patient_balance_due: patient_balance}
lifecycle:
  states: [referral_received, pending_authorization, active, on_hold, closed]
  transitions:
  - from: referral_received
    to: pending_authorization
    by: agent
    means: >-
      The written order is on file on a tier that requires prior authorization, and Larkfield submits the request
      to the payer.
  - from: referral_received
    to: active
    by: agent
    means: >-
      On a tier without prior authorization the written order is on file and its order-based authorization grant
      is recorded, so the program is activated.
  - from: pending_authorization
    to: active
    by: system
    means: >-
      The payer approves the prior authorization and the approval is recorded as an authorization grant, which activates
      the program.
  - {from: active, to: on_hold, by: agent, means: Shipments are suspended for one recorded hold reason.}
  - {from: on_hold, to: active, by: agent, means: The recorded hold reason has cleared and shipments may resume.}
  - {from: active, to: closed, by: user, means: The customer personally confirms the cancellation request for the
      program.}
  - {from: referral_received, to: closed, by: system, means: The referral documentation was not completed within
      the referral window.}
  - {from: pending_authorization, to: closed, by: system, means: 'The payer''s prior authorization denial stands,
      or the referral window lapsed while waiting.'}
  - from: on_hold
    to: closed
    by: system
    means: >-
      The hold limit was reached, coverage ended without replacement, a cancellation of the held program was confirmed,
      or the customer's death was recorded.
accounts:
- key: authorized_units
  unit: >-
    billing units (E0784 - one pump; A4224 - one week of infusion catheter supplies; A4225 or A4232 - one cartridge
    or reservoir; A4239 - one 30-day sensor supply allowance for a pump-integrated sensor)
  meaning: >-
    Billing units still available to ship under the program's authorization grants - credited by each grant and
    by accepted returns, debited by each refill shipment.
- key: patient_balance
  unit: USD
  meaning: >-
    The amount the customer owes Larkfield on this program - increased by remittance patient responsibility, patient
    charges and refunds of credits, reduced by payments and balance adjustments; negative is a credit balance.
parameter_schema:
  coinsurance_pct: >-
    Patient coinsurance as a percent of the payer-allowed amount on each claim line after any deductible (self-pay
    tier - the share of the Larkfield cash price the customer pays); integer percent
  copay_per_30_day_supply_usd: >-
    Flat patient copay the plan applies per 30-day supply on a claim line, in USD (0.00 = the plan applies no copay);
    informs the expected patient responsibility the payer remittance confirms
  deductible_applies: >-
    Whether the plan's annual deductible applies to this product line before coinsurance (boolean); the deductible
    amount itself is the payer's and arrives on the remittance
  crossover_to_secondary: >-
    Whether the patient responsibility left by the primary payer is automatically crossed over to an in-effect secondary
    coverage before any patient statement (boolean)
  timely_filing_days: >-
    Payer timely-filing limit for an original claim, in calendar days counted from the date of service (the ship
    date); 0 = no payer claim is filed on this tier
  corrected_claim_window_days: >-
    Window for submitting a corrected claim after an unprocessable (CO-16) denial, in calendar days counted from
    the posting date of that denial; 0 = not applicable
  appeal_window_days: >-
    Window for filing the first-level appeal (commercial internal appeal, Medicare Advantage reconsideration, Medicare
    redetermination, Medicaid plan appeal), in calendar days counted from the posting date of the denial; 0 = no
    payer appeal exists
  second_level_appeal_window_days: >-
    Window for filing the second-level appeal (commercial external review, Medicare QIC reconsideration, Medicaid
    state fair hearing), in calendar days counted from the posting date of the first-level appeal decision; 0 =
    no customer-filed second level (self-pay - none; Medicare Advantage - the plan forwards an upheld denial to
    the independent review entity automatically)
  liability_notice_type: >-
    The advance notice of financial liability a customer must sign before an item or quantity expected to be denied
    can be billed to them (enum - not_applicable, plan_member_waiver, organization_determination_required, abn_cms_r_131,
    medicaid_non_covered_agreement)
  payment_plan_min_balance_usd: Smallest patient balance, in USD, for which an interest-free payment plan may be
    requested
  payment_plan_max_months: Longest interest-free payment plan, in monthly installments; 0 = payment plans are not
    offered on this tier
  payment_plan_min_monthly_usd: Smallest monthly installment accepted on a payment plan, in USD
  past_due_hold_days: >-
    Age, in calendar days after its posting date, at which an unpaid patient-balance posting becomes past due for
    the shipment hold test; 0 = shipments are never held for a past-due balance on this tier
  past_due_hold_min_usd: Past-due amount, in USD, at or above which further shipments are held under the past-due
    rule
  small_balance_writeoff_usd: >-
    Largest remaining patient balance, in USD, that is written off as a small balance instead of being statemented;
    0.00 = no small-balance write-off on this tier
  hardship_waiver_allowed: Whether a documented financial-hardship waiver of patient cost share may be granted case
    by case on this tier (boolean)
  hardship_income_fpl_pct: >-
    Household income ceiling for a financial-hardship waiver, as a percent of the current HHS federal poverty guideline
    for the household size; integer percent
  credit_balance_refund_days: >-
    Time limit for refunding a customer credit balance (overpayment), in calendar days counted from the posting
    date of the entry that created the credit
  order_validity_months: Validity of the prescriber's written order, in calendar months counted from the order date
  prior_auth_required: Whether the payer requires prior authorization before this product line ships (boolean)
  prior_auth_validity_months: >-
    Validity of a payer prior authorization, in calendar months counted from the payer decision date, unless the
    payer's approval states an earlier valid-through date; 0 = no prior authorization on this tier
  pa_renewal_lead_days: >-
    Earliest point for submitting a prior authorization renewal, in calendar days before the valid-through date
    of the authorization being renewed; 0 = no prior authorization on this tier
  pa_standard_decision_days: >-
    Payer's decision time for a standard prior authorization request, in calendar days counted from the request
    date; 0 = no prior authorization
  pa_expedited_decision_hours: >-
    Payer's decision time for an expedited prior authorization request, in hours counted from submission; 0 = no
    prior authorization
  supply_days_per_shipment: Standard days of supply in one refill shipment, in calendar days (a multiple of 30)
  refill_contact_lead_days: Earliest point for Larkfield's refill-reminder contact, in calendar days before the
    planned ship date
  refill_ship_lead_days: >-
    Earliest point a refill may ship, in calendar days before the end of the supply of the previous refill shipment
    of the same item
  refill_confirmation_required: >-
    Whether each refill requires the customer's own confirmation of continued use and quantity on hand before it
    ships (boolean); false = subscription shipping on schedule
  standard_shipping_fee_usd: Fee for standard ground shipping of a refill below the free-shipping threshold, in
    USD
  free_shipping_threshold_usd: Shipment cash-price total, in USD, at or above which standard shipping is free; 0.00
    = standard shipping is always free
  expedited_shipping_fee_usd: Fee for customer-requested expedited (two-day) shipping, in USD; never billed to a
    payer
  carrier_trace_business_days: >-
    Carrier trace period, in business days (Monday-Friday excluding US federal holidays) after the carrier's expected
    delivery date, after which an undelivered package is declared lost in transit
  courtesy_reships_per_12_months: >-
    Number of no-charge courtesy reships per program for packages the carrier shows as delivered but the customer
    did not receive, counted over the rolling 12 months ending on the reship date
  damage_report_days: Window for reporting a package damaged in transit, in calendar days counted from the carrier
    delivery date
  return_window_days: >-
    Window for requesting the return of unopened, sealed items, in calendar days counted from the carrier delivery
    date of the shipment
  restocking_fee_pct: >-
    Restocking fee withheld from the credit for an accepted return, as a percent of the amount the customer paid
    for the returned units; integer percent
  opened_returnable: Whether opened medical supplies may be returned for credit (boolean)
  inpatient_hold_required: >-
    Whether shipments must be held while the customer is an inpatient in a hospital or skilled nursing facility,
    because the payer does not pay home supplies during a covered stay (boolean)
  hold_max_days: >-
    Longest time a program may remain on hold, in calendar days counted from the hold start date, before it is closed
    administratively
  referral_docs_window_days: >-
    Time allowed to complete the referral documentation (written order on file and, where required, the prior authorization
    decided), in calendar days counted from the program's enrolled date
  coverage_reverification_months: >-
    How recently the coverage record must have been verified with the payer before a refill ships, in calendar months
    counted back from the ship date; 0 = no coverage to verify
  signature_required_on_delivery: >-
    Whether the carrier must obtain the customer's signature on delivery of a pump (E0784) package (boolean); supply
    packages are delivered on carrier scan
  defect_report_days: >-
    Window for reporting supplies that were defective as shipped (wrong item, expired, damaged sterile packaging,
    recalled lot), in calendar days counted from the carrier delivery date
  pump_acquisition_method: How the payer pays for the pump (enum - purchase, capped_rental)
  capped_rental_months: >-
    Number of paid monthly rental claims after which ownership of a capped-rental pump transfers to the customer;
    0 = the pump is purchased
  pump_warranty_months_by_model: >-
    Mapping of pump model -> manufacturer limited warranty, in calendar months counted from the delivery date of
    the pump originally supplied on the program
  pump_replacement_interval_months: >-
    Minimum time before the payer covers a new pump, in calendar months counted from the delivery date of the pump
    originally supplied on the program; 0 = no payer interval (self-pay)
  defective_pump_return_days: >-
    Time allowed to return a malfunctioning pump after its warranty replacement is delivered, in calendar days counted
    from that delivery date
  pump_cash_price_by_model: Mapping of pump model -> Larkfield cash purchase price, in USD
  a4224_days_per_unit: >-
    Days of supply per A4224 billing unit (one unit = one week of infusion catheter supplies); a shipment's A4224
    units are its supply days divided by this figure, rounded up
  reservoir_item_by_model: Mapping of pump model -> the cartridge or reservoir item code that pump uses
  reservoirs_per_30_days: Cartridges or reservoirs covered per 30 days of supply
  supply_cash_price_by_item: Mapping of supply item code -> Larkfield cash price per billing unit, in USD
  pump_sensor_units_per_30_days: A4239 billing units per 30 days of supply for a pump-integrated sensor (MiniMed
    780G only)
  minimed_sensors_per_30_days: Physical pump-integrated sensors shipped per 30 days of supply for a MiniMed 780G
    program
  pump_training_required: >-
    Whether a pump start training session with a certified pump trainer must be documented before supply refills
    ship (boolean)
