events:
- type: pump_program_enroll
  target: pump_programs
  mutation: create
  meaning: >-
    A referral for the insulin pump product line is accepted and the customer's program record is opened in referral_received,
    bound to the coverage it will bill.
  grain: one row per program opened for one customer on one coverage
  fields: {customer_id: the customer the program belongs to, coverage_id: the coverage record the program bills;
      empty only on the self-pay tier, variant_name: the official tier located from the coverage record, enrolled_date: the
      date the referral was accepted (ctx.now date), prescriber_npi: the 10-digit NPI of the treating prescriber
      on the referral, pump_model: the pump model on the written order, ownership_status: 'purchased or capped_rental,
      from the tier''s pump_acquisition_method'}
  triggers: []
- type: pump_program_submit_authorization
  target: pump_programs
  mutation:
    transition: {from: referral_received, to: pending_authorization}
  meaning: >-
    The written order is on file and a prior authorization request has gone to the payer, so the program waits on
    the payer decision.
  grain: one row per transaction
  fields: {status: set to pending_authorization}
  triggers: []
- type: pump_program_activate
  target: pump_programs
  mutation:
    transition:
    - {from: referral_received, to: active}
    - {from: pending_authorization, to: active}
  meaning: The program becomes active because a valid authorization grant is on file, so refills may ship.
  grain: one row per transaction
  fields: {status: set to active, activated_date: the date the program became active (ctx.now date)}
  triggers: []
- type: pump_program_hold
  target: pump_programs
  mutation:
    transition: {from: active, to: on_hold}
  meaning: Shipments on an active program are suspended for a recorded hold reason.
  grain: one row per transaction
  fields: {status: set to on_hold, hold_reason: the controlled hold reason, hold_start_date: the date the hold starts
      (ctx.now date)}
  triggers: []
- type: pump_program_resume
  target: pump_programs
  mutation:
    transition: {from: on_hold, to: active}
  meaning: The hold reason has cleared and the program returns to active.
  grain: one row per transaction
  fields: {status: set to active, hold_reason: reset to none, hold_start_date: cleared to empty}
  triggers: []
- type: pump_program_discontinue
  target: pump_programs
  mutation:
    transition: {from: active, to: closed}
  meaning: The customer has confirmed that they are ending the program, which closes it.
  grain: one row per transaction
  fields: {status: set to closed, closed_date: the date the program closed (ctx.now date), closure_reason: 'customer_discontinued
      or changed_supplier, as the customer confirms'}
  triggers: []
- type: pump_program_administrative_close
  target: pump_programs
  mutation:
    transition:
    - {from: referral_received, to: closed}
    - {from: pending_authorization, to: closed}
    - {from: on_hold, to: closed}
  meaning: >-
    Larkfield closes a program that cannot proceed - documentation never completed, authorization finally denied,
    hold limit reached, coverage ended, a confirmed cancellation of a program on hold, or the customer's death.
  grain: one row per transaction
  fields: {status: set to closed, closed_date: the date the program closed (ctx.now date), closure_reason: the controlled
      closure reason}
  triggers: []
- type: pump_program_change
  target: pump_programs
  mutation: update
  meaning: >-
    Program details change - the coverage and tier after an insurance change, the prescriber, or product fields
    after a new written order.
  grain: one row per transaction
  fields: {coverage_id: the newly verified coverage record the program bills, variant_name: the tier located from
      that coverage record, prescriber_npi: the NPI of the prescriber on the newest written order, pump_model: the
      pump model on the newest written order (a new pump only), pump_serial_number: the serial number of the pump
      the customer now holds, pump_delivery_date: the delivery date of a new (not warranty-exchanged) pump}
  triggers: []
- type: pump_order_receipt
  target: pump_orders
  meaning: A written order (standard written order or prescription) from the treating prescriber is received for
    one item.
  grain: one row per written order received for one item
  distinguish_by: [order_reference, item_code]
  fields: {order_reference: the order or prescription number printed on the written order, prescriber_npi: the NPI
      of the ordering prescriber, item_code: the item ordered, order_date: the date the prescriber signed the order,
    quantity_per_30_days: the billing units ordered per 30 days, valid_through: the last date the order is valid}
  triggers: []
- type: pump_prior_auth_request
  target: pump_orders
  meaning: Larkfield submits a prior authorization request (initial or renewal) to the payer for one item on one
    written order.
  grain: one row per prior authorization request submitted
  distinguish_by: [related_pump_order_id, request_date]
  fields: {related_pump_order_id: the written order the request is based on, item_code: the item requested, request_priority: standard
      or expedited, request_date: the date the request was submitted (ctx.now date)}
  triggers: []
- type: pump_authorization_grant
  target: pump_orders
  meaning: >-
    Authorization to supply one item for a date span is recorded - a payer prior authorization approval, or on tiers
    without prior authorization the written order itself - and its approved units are credited.
  grain: one row per authorization granted for one item and one date span
  distinguish_by: [related_pump_order_id, valid_from]
  fields: {related_pump_order_id: 'the written order (or, for a payer approval, the order the request was based
      on)', authorization_basis: 'payer_prior_authorization, written_order or self_pay_order', pa_reference: the
      payer's prior authorization number; empty when the basis is not a payer approval, item_code: the item authorized,
    units_authorized: the billing units authorized for the span (credited to authorized units), valid_from: the
      first date the authorization covers, valid_through: the last date the authorization covers, decision_date: 'the
      payer decision date, or the date Larkfield recorded the order-based authorization'}
  account: authorized_units
  direction: in
  triggers: []
- type: pump_prior_auth_denial
  target: pump_orders
  meaning: >-
    The payer denies a prior authorization request (for Medicare Advantage this is the plan's pre-service organization
    determination denial).
  grain: one row per payer denial decision
  distinguish_by: [related_pump_order_id, decision_date]
  fields: {related_pump_order_id: the written order the denied request was based on, pa_reference: the payer's reference
      for the denied request, item_code: the item denied, denial_reason: the payer's controlled denial reason, decision_date: the
      payer decision date}
  triggers: []
- type: pump_medical_record_receipt
  target: pump_orders
  meaning: >-
    Clinical documentation from the treating practitioner is received - a visit note or record that supports qualification,
    continued need or a quantity above the usual limit.
  grain: one row per clinical document received for one purpose and one visit
  distinguish_by: [record_purpose, visit_date]
  fields: {record_purpose: what the document supports, visit_date: the date of the practitioner visit the document
      records, visit_type: in_person or telehealth, prescriber_npi: the NPI of the practitioner who conducted the
      visit}
  triggers: []
- type: pump_liability_notice_signed
  target: pump_orders
  meaning: >-
    The customer signs the tier's advance notice of financial liability for an item or quantity expected not to
    be paid by the payer.
  grain: one row per notice signed for one item on one date
  distinguish_by: [item_code, notice_date]
  fields: {notice_type: the notice form signed (the tier's liability_notice_type), item_code: the item the notice
      covers, notice_units: the billing units the notice covers, notice_date: the date the customer signed (ctx.now
      date)}
  triggers: []
- type: pump_refill_shipment
  target: pump_shipments
  meaning: >-
    One package of a supply refill (or the first fill) leaves the warehouse for the customer, drawing billing units
    from one authorization.
  grain: one row per item per package shipped
  distinguish_by: [item_code, ship_date]
  fields: {pump_order_id: the authorization grant the shipment draws on, item_code: the item shipped, units: billing
      units shipped (debited from authorized units), pieces: physical pieces in the package, supply_days: days of
      supply the shipment covers, ship_date: 'the ship date, which is also the date of service on the claim (ctx.now
      date)', shipping_method: 'standard, expedited or expedited_no_charge', billing_route: payer_claim or self_pay,
    refill_confirmed_date: the date the customer confirmed continued use and quantity on hand; empty on tiers without
      refill confirmation}
  account: authorized_units
  direction: out
  triggers:
  - event: pump:pump_claim_submission
    when: {billing_route: payer_claim}
    map: {pump_shipment_id: pump_shipment_id, submission_type: original}
  - event: pump:pump_patient_charge
    when: {billing_route: self_pay}
    map: {pump_shipment_id: pump_shipment_id, charge_type: self_pay_price}
  - event: pump:pump_patient_charge
    when: {shipping_method: expedited}
    map: {pump_shipment_id: pump_shipment_id, charge_type: expedited_shipping}
- type: pump_replacement_shipment
  target: pump_shipments
  meaning: >-
    A no-charge replacement package ships for an original shipment that was lost, damaged, not received or defective;
    it draws no authorized units and is not billed.
  grain: one row per replacement package for one original shipment and one item
  distinguish_by: [original_pump_shipment_id, item_code, ship_date]
  fields: {original_pump_shipment_id: the original shipment being replaced, replacement_reason: the controlled replacement
      reason, item_code: the item replaced, units: billing units replaced, pieces: physical pieces in the package,
    ship_date: the ship date of the replacement (ctx.now date), shipping_method: standard or expedited_no_charge}
  triggers:
  - event: pump:pump_program_change
    when: {replacement_reason: manufacturer_warranty_exchange}
    map: {pump_serial_number: device_serial_number}
- type: pump_delivery_confirmation
  target: pump_shipments
  meaning: The carrier's proof of delivery for one package is received.
  grain: one row per proof of delivery for one package
  distinguish_by: [original_pump_shipment_id]
  fields: {original_pump_shipment_id: the package delivered, delivery_date: the delivery date on the proof of delivery,
    pod_type: signature or carrier_scan}
  triggers: []
- type: pump_return_authorization
  target: pump_shipments
  meaning: Larkfield issues a return authorization and prepaid label for unopened, sealed units from one delivered
    shipment.
  grain: one row per return authorization for one original shipment and one item
  distinguish_by: [original_pump_shipment_id, item_code]
  fields: {original_pump_shipment_id: the delivered shipment the units came from, item_code: the item to be returned,
    units: billing units authorized for return, rma_issue_date: the date the return authorization was issued (ctx.now
      date)}
  triggers: []
- type: pump_return_receipt
  target: pump_shipments
  meaning: The warehouse receives and accepts returned unopened, sealed units, restoring them to the authorization.
  grain: one row per accepted return receipt for one original shipment and one item
  distinguish_by: [original_pump_shipment_id, item_code]
  fields: {original_pump_shipment_id: the shipment the returned units came from, item_code: the item returned, units: billing
      units accepted (credited back to authorized units), receipt_date: the date the warehouse accepted the return,
    billing_route: how the original shipment was billed - payer_claim or self_pay}
  account: authorized_units
  direction: in
  triggers:
  - event: pump:pump_claim_submission
    when: {billing_route: payer_claim}
    map: {pump_shipment_id: original_pump_shipment_id, submission_type: void}
  - event: pump:pump_balance_adjustment
    when: {billing_route: self_pay}
    map: {adjustment_reason: return_credit}
- type: pump_claim_submission
  target: pump_billing
  meaning: A claim (original, corrected or void) for one shipment is sent to the payer.
  grain: one row per claim submission for one shipment
  distinguish_by: [pump_shipment_id, submission_type, posting_date]
  fields: {pump_shipment_id: the shipment (date of service) the claim bills, claim_number: Larkfield's claim number
      as transmitted, submission_type: 'original, corrected or void', billed_amount: the billed charge, posting_date: the
      date the claim was transmitted (ctx.now date)}
  triggers: []
- type: pump_claim_adjudication
  target: pump_billing
  meaning: >-
    The payer's remittance for a claim is posted and the patient responsibility it leaves is added to the customer's
    balance.
  grain: one row per remittance posting for one claim
  distinguish_by: [original_pump_ledger_id, posting_date]
  fields: {original_pump_ledger_id: the claim submission the remittance answers, claim_number: the payer's claim
      control number on the remittance, allowed_amount: the payer-allowed amount, payer_paid_amount: the amount
      the payer paid, amount: 'the patient responsibility (deductible, coinsurance and copay) posted to the balance',
    posting_date: the remittance posting date}
  account: patient_balance
  direction: in
  triggers: []
- type: pump_claim_denial
  target: pump_billing
  meaning: The payer denies a claim line with a claim adjustment reason code.
  grain: one row per denial posting for one claim
  distinguish_by: [original_pump_ledger_id, posting_date]
  fields: {original_pump_ledger_id: the claim submission denied, claim_number: the payer's claim control number
      on the denial, denial_code: the controlled denial reason code, posting_date: the denial posting date}
  triggers: []
- type: pump_appeal_filing
  target: pump_billing
  meaning: An appeal of one denial (or of the first-level appeal decision) is filed with the payer.
  grain: one row per appeal filed at one level for one denial
  distinguish_by: [original_pump_ledger_id, appeal_level]
  fields: {original_pump_ledger_id: the denial appealed, appeal_level: first_level or second_level, posting_date: the
      filing date (ctx.now date)}
  triggers: []
- type: pump_patient_charge
  target: pump_billing
  meaning: >-
    An amount the customer owes directly is posted - a self-pay price, an expedited shipping fee, a non-covered
    item under a signed liability notice, or a standard shipping fee on the self-pay tier.
  grain: one row per charge type for one shipment
  distinguish_by: [pump_shipment_id, charge_type]
  fields: {pump_shipment_id: the shipment the charge relates to, charge_type: the controlled charge type, amount: the
      charge (added to the balance), posting_date: the posting date (ctx.now date)}
  account: patient_balance
  direction: in
  triggers: []
- type: pump_patient_payment
  target: pump_billing
  meaning: A payment from the customer (or their HSA/FSA card) is applied to the balance.
  grain: one row per payment received
  distinguish_by: [posting_date, payment_method, amount]
  fields: {amount: the payment (deducted from the balance), payment_method: the controlled payment method, posting_date: the
      date the payment posted}
  account: patient_balance
  direction: out
  triggers: []
- type: pump_balance_adjustment
  target: pump_billing
  meaning: >-
    A credit adjustment reduces the customer's balance against one posting - a return credit, secondary payer payment,
    hardship waiver, small-balance write-off or billing correction.
  grain: one row per adjustment against one posting
  distinguish_by: [original_pump_ledger_id, adjustment_reason]
  fields: {original_pump_ledger_id: the charge or remittance posting adjusted, adjustment_reason: the controlled
      adjustment reason, amount: the adjustment (deducted from the balance), posting_date: the posting date (ctx.now
      date)}
  account: patient_balance
  direction: out
  triggers: []
- type: pump_patient_refund
  target: pump_billing
  meaning: A credit balance created by an overpayment or a post-payment credit is refunded to the customer.
  grain: one row per refund issued against one credit-creating posting
  distinguish_by: [original_pump_ledger_id]
  fields: {original_pump_ledger_id: the posting that created the credit balance, amount: 'the refund (adds back
      to the balance, bringing a credit toward zero)', payment_method: the method the refund is returned to, posting_date: the
      refund date (ctx.now date)}
  account: patient_balance
  direction: in
  triggers: []
- type: pump_rental_claim
  target: pump_billing
  meaning: The monthly rental claim for a capped-rental pump is sent to the payer for one rental month.
  grain: one row per rental month billed for the pump
  distinguish_by: [rental_month_number]
  fields: {pump_shipment_id: the pump (E0784) shipment being rented, rental_month_number: the rental month billed,
    claim_number: Larkfield's claim number as transmitted, billed_amount: the billed monthly rental charge, posting_date: the
      date the claim was transmitted (ctx.now date)}
  triggers: []
- type: pump_ownership_transfer
  target: pump_programs
  mutation: update
  meaning: Ownership of a capped-rental pump passes to the customer after the last paid rental month.
  grain: one row per transaction
  fields: {ownership_status: set to owned}
  triggers: []
- type: pump_defective_device_return
  target: pump_shipments
  meaning: The malfunctioning pump replaced under warranty is received back for the manufacturer.
  grain: one row per malfunctioning pump returned for one warranty exchange
  distinguish_by: [original_pump_shipment_id]
  fields: {original_pump_shipment_id: the warranty exchange shipment the returned pump answers, device_serial_number: the
      serial number of the returned pump, receipt_date: the date the returned pump was received}
  triggers: []
measures:
- id: pump_msr_courtesy_reships_12m
  window: the 365 calendar days ending on and including the reship date being considered
  measure: >-
    count of pump_replacement_shipment rows of the program whose replacement_reason is delivered_not_received and
    whose ship_date falls in the window
- id: pump_msr_past_due_amount
  window: patient-balance postings of the program dated on or before the date of the test
  measure: >-
    the greater of 0.00 and (the sum of amount over pump_claim_adjudication, pump_patient_charge and pump_patient_refund
    rows whose posting_date is more than past_due_hold_days calendar days before the test date, minus the sum of
    amount over all pump_patient_payment and pump_balance_adjustment rows posted on or before the test date), in
    USD - payments and credits applied to the oldest postings first
- {id: pump_msr_rental_months_billed, window: 'the life of the program, through the date of the test', measure: count
    of pump_rental_claim rows of the program (each rental month is billed once)}
policies:
- id: pump_enrollment_and_tier
  subject: [pump_program_enroll, pump_program_change]
  rule: >-
    A insulin pump program is opened when Larkfield accepts a referral for this product line, and the tier written
    on the program is fixed by the coverage the program bills, never by the customer's preference. The tier is located
    from the coverage record named on the program: the coverage record's plan type and coverage order must equal
    the tier's entry gate, and the self-pay tier is used only when no coverage record is named. The coverage record
    named on the program must be in effect on the date of the write: its effective date is on or before that date
    and its termination date is empty or on or after that date. A customer with an in-effect Original Medicare Part
    B coverage record cannot be enrolled on the self-pay tier for an item Medicare covers, because Larkfield submits
    a claim for every Medicare-covered item it supplies to a Medicare beneficiary; that customer is enrolled on
    the Original Medicare tier, and an item or quantity Medicare will not pay is handled under pump_liability_notice.
    When a customer has two in-effect coverage records, the one whose coverage order is primary fixes the tier and
    the secondary coverage only receives crossover or secondary claims; a coverage record whose coverage order is
    secondary never fixes the tier. Any clinical qualification in the tier's entry gate is read from the program's
    own clinical fields as documented on the prescriber's written order and medical records, never from the customer's
    description alone. A program change rewrites the coverage reference and the tier together when the customer's
    insurance changes, and rewrites prescriber or product fields when a newer written order changes them; a change
    never rewrites status, and after a tier change the next refill may draw only on an authorization grant recorded
    under the new tier. A coverage the customer reports that is not on file cannot be written onto a program, because
    coverage records are created only by Larkfield's benefits verification team after the payer confirms eligibility.
  eligibility:
  - id: coverage_in_effect
    applies_to: [pump_program_enroll, pump_program_change]
    kind: authorization
    condition: >-
      The coverage record named on the program must be in effect on the date of the write: its effective date is
      on or before that date and its termination date is empty or on or after that date.
    evidence_fields: [coverages.coverage_id, coverages.effective_date, coverages.termination_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [coverages.coverage_id]
      action_bindings: {coverages.coverage_id: coverage_id}
  - id: tier_matches_coverage
    applies_to: [pump_program_enroll, pump_program_change]
    kind: authorization
    condition: >-
      the coverage record's plan type and coverage order must equal the tier's entry gate, and the self-pay tier
      is used only when no coverage record is named.
    evidence_fields: [coverages.coverage_id, coverages.plan_type, coverages.coverage_order, coverages.includes_drug_coverage]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [coverages.coverage_id]
      action_bindings: {coverages.coverage_id: coverage_id}
  - id: coverage_on_file
    applies_to: [pump_program_change]
    kind: authorization
    condition: >-
      A coverage the customer reports that is not on file cannot be written onto a program, because coverage records
      are created only by Larkfield's benefits verification team after the payer confirms eligibility.
    evidence_fields: [coverages.coverage_id, coverages.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [coverages.coverage_id]
      action_bindings: {coverages.coverage_id: coverage_id}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {prior_auth_required: =prior_auth_required, coinsurance_pct: =coinsurance_pct}
      Insulin Pump Commercial HMO Program: {prior_auth_required: =prior_auth_required, coinsurance_pct: =coinsurance_pct}
      Insulin Pump Commercial PPO Program: {prior_auth_required: =prior_auth_required, coinsurance_pct: =coinsurance_pct}
      Insulin Pump Medicare Advantage Program: {prior_auth_required: =prior_auth_required, coinsurance_pct: =coinsurance_pct}
      Insulin Pump Original Medicare Program: {prior_auth_required: =prior_auth_required, coinsurance_pct: =coinsurance_pct}
      Insulin Pump Medicaid Program: {prior_auth_required: =prior_auth_required, coinsurance_pct: =coinsurance_pct}
- id: pump_documentation_and_authorization
  subject: [pump_order_receipt, pump_prior_auth_request, pump_authorization_grant, pump_prior_auth_denial, pump_medical_record_receipt,
    pump_program_submit_authorization, pump_program_activate]
  rule: >-
    Every shipment rests on a written order from the treating prescriber that names the item, the billing units
    per 30 days, the order date and the prescriber's NPI; the order is valid for order_validity_months calendar
    months counted from its order date, the valid-through date being the day before the same calendar day order_validity_months
    months later (falling back to the last day of the month when that day does not exist), and Larkfield records
    that valid-through date when the order is received. On tiers where prior_auth_required is true, Larkfield submits
    a prior authorization request to the payer once the written order is on file and moves the program from referral_received
    to pending_authorization; the payer's approval is recorded as an authorization grant with basis payer_prior_authorization,
    carrying the payer's PA reference, the approved units and the approved span, which runs prior_auth_validity_months
    calendar months from the decision date unless the payer's approval states an earlier valid-through date, in
    which case the payer's date governs. On tiers where prior_auth_required is false, Larkfield records the authorization
    grant itself on the basis of the written order (basis written_order, or self_pay_order on the self-pay tier),
    valid from the order date through the order's valid-through date, for the billing units the order covers within
    that span. A prior authorization request is submitted as expedited only when the prescriber states on the order
    that waiting the standard decision time could seriously jeopardize the patient's life or health; otherwise it
    is standard, and the payer is expected to decide within pa_standard_decision_days calendar days of a standard
    request or pa_expedited_decision_hours hours of an expedited one. A renewal request for a prior authorization
    may be submitted no earlier than pa_renewal_lead_days calendar days before the valid-through date of the authorization
    it renews, counted backward in calendar days from that valid-through date with the earliest submission day itself
    allowed, and it requires a written order that is valid beyond that valid-through date. A program is activated
    only when an authorization grant on file for the program is valid on the activation date. A payer denial of
    a prior authorization is recorded with the payer's denial reason; the program stays in pending_authorization
    while the prescriber supplies further documentation or a new request is made, and it closes only under pump_holds_and_closure.
    Clinical documents are recorded with the purpose they serve and the visit date they document, and a document
    serves only the purpose recorded on it.
  eligibility:
  - id: written_order_on_file
    applies_to: [pump_prior_auth_request, pump_authorization_grant]
    kind: authorization
    condition: >-
      Every shipment rests on a written order from the treating prescriber that names the item, the billing units
      per 30 days, the order date and the prescriber's NPI
    evidence_fields: [pump_orders.pump_order_id, pump_orders.event_type, pump_orders.item_code, pump_orders.valid_through]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_orders.pump_order_id]
      action_bindings: {pump_orders.pump_order_id: related_pump_order_id}
  - id: renewal_lead_window
    applies_to: [pump_prior_auth_request]
    kind: time
    condition: >-
      A renewal request for a prior authorization may be submitted no earlier than pa_renewal_lead_days calendar
      days before the valid-through date of the authorization it renews
    evidence_fields: [pump_orders.pump_order_id, pump_orders.valid_through]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_orders.pump_order_id]
      action_bindings: {pump_orders.pump_order_id: related_pump_order_id}
    temporal_basis: {clock: frozen_time, anchor_event: the valid-through date of the authorization it renews, anchor_source: pump_orders.valid_through,
      relation: not_before, duration_source: variants.pa_renewal_lead_days, unit: calendar_days, counting_rule: counted
        backward in calendar days from that valid-through date with the earliest submission day itself allowed,
      boundary: inclusive}
  - id: activation_grant_valid
    applies_to: [pump_program_activate]
    kind: authorization
    condition: A program is activated only when an authorization grant on file for the program is valid on the activation
      date.
    evidence_fields: [pump_orders.pump_program_id, pump_orders.event_type, pump_orders.valid_from, pump_orders.valid_through]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_orders.pump_program_id]
      action_bindings: {pump_orders.pump_program_id: pump_program_id}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {order_validity_months: =order_validity_months, prior_auth_required: =prior_auth_required,
        prior_auth_validity_months: =prior_auth_validity_months, pa_renewal_lead_days: =pa_renewal_lead_days, pa_standard_decision_days: =pa_standard_decision_days,
        pa_expedited_decision_hours: =pa_expedited_decision_hours}
      Insulin Pump Commercial HMO Program: {order_validity_months: =order_validity_months, prior_auth_required: =prior_auth_required,
        prior_auth_validity_months: =prior_auth_validity_months, pa_renewal_lead_days: =pa_renewal_lead_days, pa_standard_decision_days: =pa_standard_decision_days,
        pa_expedited_decision_hours: =pa_expedited_decision_hours}
      Insulin Pump Commercial PPO Program: {order_validity_months: =order_validity_months, prior_auth_required: =prior_auth_required,
        prior_auth_validity_months: =prior_auth_validity_months, pa_renewal_lead_days: =pa_renewal_lead_days, pa_standard_decision_days: =pa_standard_decision_days,
        pa_expedited_decision_hours: =pa_expedited_decision_hours}
      Insulin Pump Medicare Advantage Program: {order_validity_months: =order_validity_months, prior_auth_required: =prior_auth_required,
        prior_auth_validity_months: =prior_auth_validity_months, pa_renewal_lead_days: =pa_renewal_lead_days, pa_standard_decision_days: =pa_standard_decision_days,
        pa_expedited_decision_hours: =pa_expedited_decision_hours}
      Insulin Pump Original Medicare Program: {order_validity_months: =order_validity_months, prior_auth_required: =prior_auth_required,
        prior_auth_validity_months: =prior_auth_validity_months, pa_renewal_lead_days: =pa_renewal_lead_days, pa_standard_decision_days: =pa_standard_decision_days,
        pa_expedited_decision_hours: =pa_expedited_decision_hours}
      Insulin Pump Medicaid Program: {order_validity_months: =order_validity_months, prior_auth_required: =prior_auth_required,
        prior_auth_validity_months: =prior_auth_validity_months, pa_renewal_lead_days: =pa_renewal_lead_days, pa_standard_decision_days: =pa_standard_decision_days,
        pa_expedited_decision_hours: =pa_expedited_decision_hours}
- id: pump_evt_refill_shipment
  subject: [pump_refill_shipment]
  rule: >-
    A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
    or closed receives no refill. Each refill draws on one authorization grant of the program, recorded on the shipment,
    and the ship date must be on or before the valid-through date on the authorization being drawn. The units shipped
    may not exceed the program's authorized units remaining, and the supply days of a shipment are the tier's supply_days_per_shipment,
    shortened to the whole 30-day blocks that remain before the authorization's valid-through date when fewer remain;
    the units and pieces follow from the supply days under pump_evt_quantity_limits. On tiers where refill_confirmation_required
    is true, the refill ships only after the customer personally confirms, for this shipment, that they are still
    using the item and how much supply they have on hand; the confirmation date is recorded on the shipment, Larkfield
    never ships those tiers automatically, and Larkfield's own refill reminder for those tiers is made no sooner
    than refill_contact_lead_days calendar days before the planned ship date. On the self-pay tier refills ship
    on the subscription schedule without a per-shipment confirmation. The next refill of the same item ships no
    earlier than refill_ship_lead_days calendar days before the end of the supply of the previous refill shipment
    of that item, counted in calendar days: the previous refill's ship date plus its supply days gives the end of
    its supply, the earliest permitted ship date is refill_ship_lead_days calendar days before that end date, and
    shipping on that earliest date is allowed. A replacement shipment never counts as the previous refill. The coverage
    record the program bills must have been verified with the payer within coverage_reverification_months calendar
    months before the ship date, as shown by the coverage record's last verified date; the self-pay tier has no
    coverage to verify. Standard ground shipping is free on insured tiers; on the self-pay tier standard shipping
    costs standard_shipping_fee_usd, posted as a patient charge, unless the shipment's cash-price total reaches
    free_shipping_threshold_usd. Expedited shipping is provided on the customer's request for expedited_shipping_fee_usd,
    posted as a patient charge because no payer covers delivery speed, and is recorded as expedited_no_charge when
    the expedite only makes up for a delay Larkfield caused. A refill on a payer tier is billed to the payer by
    claim with the ship date as the date of service; a refill on the self-pay tier is charged to the customer at
    the Larkfield cash price. On tiers where inpatient_hold_required is true, nothing ships while the customer is
    an inpatient in a hospital or skilled nursing facility; the program is held under pump_holds_and_closure.
  eligibility:
  - id: program_active
    applies_to: [pump_refill_shipment]
    kind: state
    condition: >-
      A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
      or closed receives no refill.
    evidence_fields: [pump_programs.pump_program_id, pump_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
    state_contract:
      field: pump_programs.status
      allowed: [active]
  - id: authorization_valid_on_ship_date
    applies_to: [pump_refill_shipment]
    kind: authorization
    condition: the ship date must be on or before the valid-through date on the authorization being drawn.
    evidence_fields: [pump_orders.pump_order_id, pump_orders.event_type, pump_orders.valid_from, pump_orders.valid_through]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_orders.pump_order_id]
      action_bindings: {pump_orders.pump_order_id: pump_order_id}
  - id: units_within_authorization
    applies_to: [pump_refill_shipment]
    kind: authorization
    condition: The units shipped may not exceed the program's authorized units remaining
    evidence_fields: [pump_programs.pump_program_id, pump_programs.authorized_units_remaining]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
  - id: customer_confirmation
    applies_to: [pump_refill_shipment]
    kind: caller_fact
    condition: >-
      On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms,
      for this shipment, that they are still using the item and how much supply they have on hand
    evidence_fields: [pump_programs.pump_program_id, pump_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
  - id: refill_not_too_early
    applies_to: [pump_refill_shipment]
    kind: time
    condition: >-
      The next refill of the same item ships no earlier than refill_ship_lead_days calendar days before the end
      of the supply of the previous refill shipment of that item
    evidence_fields: [pump_shipments.pump_shipment_id, pump_shipments.ship_date, pump_shipments.supply_days, pump_shipments.item_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_shipments.pump_shipment_id]
      action_bindings: {pump_shipments.pump_shipment_id: previous_pump_shipment_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the end of the supply of the previous refill shipment of that item
      anchor_source: pump_shipments.ship_date
      relation: not_before
      duration_source: variants.refill_ship_lead_days
      unit: calendar_days
      counting_rule: >-
        the previous refill's ship date plus its supply days gives the end of its supply, the earliest permitted
        ship date is refill_ship_lead_days calendar days before that end date, and shipping on that earliest date
        is allowed.
      boundary: inclusive
  - id: coverage_recently_verified
    applies_to: [pump_refill_shipment]
    kind: time
    condition: >-
      The coverage record the program bills must have been verified with the payer within coverage_reverification_months
      calendar months before the ship date, as shown by the coverage record's last verified date
    evidence_fields: [coverages.coverage_id, coverages.last_verified_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [coverages.coverage_id]
      action_bindings: {coverages.coverage_id: coverage_id}
    temporal_basis: {clock: frozen_time, anchor_event: the coverage record's last verified date, anchor_source: coverages.last_verified_date,
      relation: not_after, duration_source: variants.coverage_reverification_months, unit: calendar_months, counting_rule: within
        coverage_reverification_months calendar months before the ship date, boundary: inclusive}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Insulin Pump Commercial HMO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Insulin Pump Commercial PPO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Insulin Pump Medicare Advantage Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Insulin Pump Original Medicare Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Insulin Pump Medicaid Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
  formula: {earliest_ship_date_offset_days: supply_days - refill_ship_lead_days}
- id: pump_evt_replacement_and_delivery
  subject: [pump_replacement_shipment, pump_delivery_confirmation]
  rule: >-
    A replacement ships at no charge, draws no authorized units and is never billed to a payer; it is recorded against
    the original shipment it replaces, and its quantity never exceeds the units of that original shipment that were
    lost, damaged, not received or defective. A package is lost in transit when no proof of delivery is on file
    for it and carrier_trace_business_days business days (Monday to Friday, excluding US federal holidays) have
    passed after the carrier's expected delivery date; a package lost in transit is always replaced, expedited at
    no charge, and does not count toward any courtesy limit, because Larkfield bears the risk until delivery. A
    package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
    calendar days after the delivery date on the proof of delivery for that package, counted in calendar days from
    that delivery date with the last day allowed; a later damage report is not replaced. A package the proof of
    delivery shows as delivered but the customer reports not received is replaced as a courtesy only while the program's
    courtesy reships over the rolling 12 months ending on the reship date, counted by pump_msr_courtesy_reships_12m,
    are fewer than courtesy_reships_per_12_months; beyond that the customer may buy the item at the cash price or
    wait for the next eligible refill. A pump that malfunctions is handled under pump_warranty_and_defects as a
    manufacturer warranty exchange, never as a Larkfield product_defect replacement. Larkfield replaces as product_defect
    only supplies that were defective as shipped - the wrong item, expired product, damaged sterile packaging or
    a recalled lot - reported no later than defect_report_days calendar days after the delivery date. A proof of
    delivery is recorded as received from the carrier, with a signature where the tier or item requires signature_required_on_delivery,
    and it fixes the delivery date that return, damage and warranty windows count from; a package without a proof
    of delivery has no delivery date.
  eligibility:
  - id: damage_report_window
    applies_to: [pump_replacement_shipment]
    kind: time
    condition: >-
      A package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
      calendar days after the delivery date on the proof of delivery for that package
    evidence_fields: [pump_shipments.original_pump_shipment_id, pump_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_shipments.original_pump_shipment_id]
      action_bindings: {pump_shipments.original_pump_shipment_id: original_pump_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that package,
      anchor_source: pump_shipments.delivery_date, relation: not_after, duration_source: variants.damage_report_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: courtesy_limit
    applies_to: [pump_replacement_shipment]
    kind: dedup
    condition: >-
      A package the proof of delivery shows as delivered but the customer reports not received is replaced as a
      courtesy only while the program's courtesy reships over the rolling 12 months ending on the reship date, counted
      by pump_msr_courtesy_reships_12m, are fewer than courtesy_reships_per_12_months
    evidence_fields: [pump_shipments.pump_program_id, pump_shipments.replacement_reason, pump_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_shipments.pump_program_id]
      action_bindings: {pump_shipments.pump_program_id: pump_program_id}
    dedup_contract:
      table: pump_shipments
      mode: separate_record
      object_bindings: {pump_program_id: pump_program_id}
      duplicate_filters:
        replacement_reason: [delivered_not_received]
      distinct_fields: [ship_date]
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Insulin Pump Commercial HMO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Insulin Pump Commercial PPO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Insulin Pump Medicare Advantage Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Insulin Pump Original Medicare Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Insulin Pump Medicaid Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
  measures: [pump_msr_courtesy_reships_12m]
- id: pump_evt_returns
  subject: [pump_return_authorization, pump_return_receipt]
  rule: >-
    Larkfield accepts a return only of items that are unopened and in their original sealed packaging; opened medical
    supplies are never returned to stock or credited on any tier where opened_returnable is false, because a supply
    that has left Larkfield's control cannot be re-dispensed to another patient. A return is authorized only when
    the customer asks for it no later than return_window_days calendar days after the delivery date on the proof
    of delivery for that shipment, counted in calendar days from that delivery date with the last day allowed; a
    shipment without a proof of delivery cannot be returned, and a package damaged in transit is handled as a replacement,
    not a return. The units authorized for return never exceed the units of that shipment, less any units of it
    already authorized for return. When the warehouse accepts the returned units as unopened_sealed, the units are
    credited back to the authorization they were drawn from; a payer-billed shipment is then re-billed by a void
    claim (all units returned) or a corrected claim (some units returned), and a self-pay shipment is credited to
    the customer's balance at the price paid for the returned units less restocking_fee_pct percent. Returned units
    the warehouse finds opened are not accepted and no receipt is recorded. An insulin pump removed from its sealed
    packaging is opened and never returnable; a malfunctioning pump goes back to its manufacturer only as part of
    a warranty exchange.
  eligibility:
  - id: return_window
    applies_to: [pump_return_authorization]
    kind: time
    condition: >-
      A return is authorized only when the customer asks for it no later than return_window_days calendar days after
      the delivery date on the proof of delivery for that shipment
    evidence_fields: [pump_shipments.original_pump_shipment_id, pump_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_shipments.original_pump_shipment_id]
      action_bindings: {pump_shipments.original_pump_shipment_id: original_pump_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that shipment,
      anchor_source: pump_shipments.delivery_date, relation: not_after, duration_source: variants.return_window_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: unopened_only
    applies_to: [pump_return_authorization]
    kind: caller_fact
    condition: Larkfield accepts a return only of items that are unopened and in their original sealed packaging
    evidence_fields: [pump_shipments.pump_shipment_id, pump_shipments.item_code]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [pump_shipments.pump_shipment_id]
      action_bindings: {pump_shipments.pump_shipment_id: original_pump_shipment_id}
  - id: no_double_return
    applies_to: [pump_return_authorization]
    kind: dedup
    condition: >-
      The units authorized for return never exceed the units of that shipment, less any units of it already authorized
      for return.
    evidence_fields: [pump_shipments.original_pump_shipment_id, pump_shipments.event_type, pump_shipments.units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_shipments.original_pump_shipment_id]
      action_bindings: {pump_shipments.original_pump_shipment_id: original_pump_shipment_id}
    dedup_contract:
      table: pump_shipments
      mode: separate_record
      object_bindings: {original_pump_shipment_id: original_pump_shipment_id, item_code: item_code}
      duplicate_filters:
        event_type: [pump_return_authorization]
      distinct_fields: [rma_issue_date]
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Insulin Pump Commercial HMO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Insulin Pump Commercial PPO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Insulin Pump Medicare Advantage Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Insulin Pump Original Medicare Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Insulin Pump Medicaid Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
- id: pump_evt_claims
  subject: [pump_claim_submission, pump_claim_adjudication]
  rule: >-
    Every refill shipped on a payer tier is billed to the payer named by the program's coverage record by one original
    claim per shipment, with the ship date as the date of service; the self-pay tier files no claims. An original
    claim must be transmitted no later than timely_filing_days calendar days after the date of service of the shipment
    it bills, counted in calendar days from that ship date with the last day allowed; a shipment whose filing limit
    has passed is billed to neither the payer nor the customer and is written off by Larkfield. A corrected claim
    replaces an original claim when the units, item or dates billed were wrong or some of the units were returned,
    and a void claim withdraws an original claim when all of its units were returned; both reference the same shipment
    as the original. When a remittance posts, the patient responsibility added to the customer's balance is the
    allowed amount less the amount the payer paid, which the remittance itemizes as deductible, coinsurance and
    copay; Larkfield never posts more than that and never bills the customer the difference between its billed charge
    and the allowed amount on a payer tier. On tiers where crossover_to_secondary is true and the customer has an
    in-effect secondary coverage record, the patient responsibility is crossed over to the secondary payer, and
    the secondary payer's payment is posted as a balance adjustment with reason secondary_payer_payment against
    that remittance before any amount is statemented; on other tiers a secondary coverage is billed by Larkfield's
    billing team only after the primary remittance posts. On the Medicaid tier a customer is never billed for a
    Medicaid-covered item beyond the patient responsibility the Medicaid remittance shows.
  eligibility:
  - id: timely_filing
    applies_to: [pump_claim_submission]
    kind: time
    condition: >-
      An original claim must be transmitted no later than timely_filing_days calendar days after the date of service
      of the shipment it bills
    evidence_fields: [pump_shipments.pump_shipment_id, pump_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_shipments.pump_shipment_id]
      action_bindings: {pump_shipments.pump_shipment_id: pump_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the date of service of the shipment it bills, anchor_source: pump_shipments.ship_date,
      relation: not_after, duration_source: variants.timely_filing_days, unit: calendar_days, counting_rule: counted
        in calendar days from that ship date with the last day allowed, boundary: inclusive}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Insulin Pump Commercial HMO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Insulin Pump Commercial PPO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Insulin Pump Medicare Advantage Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Insulin Pump Original Medicare Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Insulin Pump Medicaid Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
  formula: {amount: allowed_amount - payer_paid_amount}
- id: pump_evt_denials_and_appeals
  subject: [pump_claim_denial, pump_appeal_filing]
  rule: >-
    A denial is worked by its denial code, and the code alone decides the route; the self-pay tier has no denials
    or appeals. CO-16 (claim lacks information) is unprocessable and is never appealed: it is cured only by a corrected
    claim transmitted no later than corrected_claim_window_days calendar days after the denial's posting date. CO-50
    (not medically necessary), CO-151 (frequency or quantity not supported) and CO-197 (authorization absent) are
    appealable. A first-level appeal may be filed no later than appeal_window_days calendar days after the posting
    date of the denial it appeals, counted in calendar days from that posting date with the last day allowed; a
    CO-197 denial is appealed only when an authorization grant valid on the date of service is on file, and a CO-151
    denial only when a medical record supporting the quantity, dated on or before the date of service, is on file;
    otherwise the denial is not appealed and is handled as a non-covered amount under pump_liability_notice. An
    appeal decision that upholds the denial posts as a new denial whose original posting is the appeal filing. A
    second-level appeal may be filed only against such an upheld first-level decision, no later than second_level_appeal_window_days
    calendar days after its posting date; where second_level_appeal_window_days is 0 there is no customer-filed
    second level on the tier, and on the Medicare Advantage tier the plan forwards an upheld denial to the independent
    review entity itself. One appeal is filed per level per denial; a denial already appealed at a level is not
    appealed again at that level. CO-29 (timely filing expired) is never appealed and never billed to the customer;
    Larkfield writes it off with a billing_correction adjustment. PR-204 (not covered under the plan) becomes the
    customer's responsibility only under pump_liability_notice; otherwise Larkfield absorbs it.
  eligibility:
  - id: appeal_window
    applies_to: [pump_appeal_filing]
    kind: time
    condition: >-
      A first-level appeal may be filed no later than appeal_window_days calendar days after the posting date of
      the denial it appeals
    evidence_fields: [pump_billing.pump_ledger_id, pump_billing.posting_date, pump_billing.denial_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_billing.pump_ledger_id]
      action_bindings: {pump_billing.pump_ledger_id: original_pump_ledger_id}
    temporal_basis: {clock: frozen_time, anchor_event: the posting date of the denial it appeals, anchor_source: pump_billing.posting_date,
      relation: not_after, duration_source: variants.appeal_window_days, unit: calendar_days, counting_rule: counted
        in calendar days from that posting date with the last day allowed, boundary: inclusive}
  - id: one_appeal_per_level
    applies_to: [pump_appeal_filing]
    kind: dedup
    condition: One appeal is filed per level per denial; a denial already appealed at a level is not appealed again
      at that level.
    evidence_fields: [pump_billing.original_pump_ledger_id, pump_billing.appeal_level, pump_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_billing.original_pump_ledger_id]
      action_bindings: {pump_billing.original_pump_ledger_id: original_pump_ledger_id}
    dedup_contract:
      table: pump_billing
      mode: separate_record
      object_bindings: {original_pump_ledger_id: original_pump_ledger_id, appeal_level: appeal_level}
      duplicate_filters:
        event_type: [pump_appeal_filing]
      distinct_fields: [posting_date]
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Insulin Pump Commercial HMO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Insulin Pump Commercial PPO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Insulin Pump Medicare Advantage Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Insulin Pump Original Medicare Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Insulin Pump Medicaid Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
- id: pump_liability_notice
  subject: [pump_liability_notice_signed, pump_patient_charge]
  rule: >-
    When an item or quantity the customer wants is expected not to be paid by the payer - above the tier's allowance
    without supporting documentation, an item the tier does not cover, or a replacement before the payer's replacement
    interval - Larkfield supplies it billable to the customer only after the customer signs the tier's liability
    notice (liability_notice_type) for that item and quantity before the ship date; the customer signs it personally,
    and no Larkfield representative can sign it for them. On the Original Medicare tier the notice is the CMS Advance
    Beneficiary Notice of Noncoverage (form CMS-R-131); the claim is still submitted to Medicare with the notice
    on file, and the customer becomes liable only for a line Medicare denies. On the Medicare Advantage tier no
    notice can make the member liable; the member becomes liable only for an item for which the plan has issued
    a pre-service organization determination denial, recorded as a prior authorization denial for that item. On
    the self-pay tier no notice applies, because every item is priced at the Larkfield cash price. A patient charge
    is posted only as one of these charge types: self_pay_price (a self-pay refill at the cash price), standard_shipping
    (a self-pay shipment below the free-shipping threshold), expedited_shipping (a customer-requested expedite),
    or non_covered_item (an item or quantity covered by a signed liability notice, or by a Medicare Advantage organization
    determination denial, that the payer denied, charged at the Larkfield cash price of the units concerned). A
    non_covered_item charge requires a liability notice signed on or before the ship date covering that item and
    at least those units, or on the Medicare Advantage tier the plan's organization determination denial for that
    item; without it the amount is Larkfield's write-off and is never billed to the customer.
  eligibility:
  - id: notice_before_charge
    applies_to: [pump_patient_charge]
    kind: authorization
    condition: >-
      A non_covered_item charge requires a liability notice signed on or before the ship date covering that item
      and at least those units, or on the Medicare Advantage tier the plan's organization determination denial for
      that item
    evidence_fields: [pump_orders.pump_program_id, pump_orders.item_code, pump_orders.event_type, pump_orders.notice_date,
      pump_orders.notice_units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_orders.pump_program_id, pump_orders.item_code]
      action_bindings: {pump_orders.pump_program_id: pump_program_id, pump_orders.item_code: item_code}
  - id: customer_signs
    applies_to: [pump_liability_notice_signed]
    kind: caller_fact
    condition: the customer signs it personally, and no Larkfield representative can sign it for them.
    evidence_fields: [pump_programs.pump_program_id, pump_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Insulin Pump Commercial HMO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Insulin Pump Commercial PPO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Insulin Pump Medicare Advantage Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Insulin Pump Original Medicare Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Insulin Pump Medicaid Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
- id: pump_evt_patient_account
  subject: [pump_patient_payment, pump_balance_adjustment, pump_patient_refund]
  rule: >-
    The customer's balance on the program is the running total of its patient-balance postings: remittance patient
    responsibility, patient charges and refunds add to it, and payments and balance adjustments reduce it; a payment
    is applied to the oldest unpaid posting first. A balance adjustment is posted only for one of these reasons,
    each against the one posting it adjusts and never for more than that posting's unpaid remainder: return_credit
    (an accepted self-pay return, for the price paid for the returned units less restocking_fee_pct percent); secondary_payer_payment
    (the amount a secondary payer paid against a remittance's patient responsibility); hardship_waiver; small_balance_writeoff;
    billing_correction (a posting made in error, or a timely-filing write-off). A hardship waiver is granted only
    on tiers where hardship_waiver_allowed is true, only for postings named on a hardship application whose request
    status is approved, and only after Larkfield's financial counseling team confirms household income at or below
    hardship_income_fpl_pct percent of the HHS poverty guideline; it is never granted routinely, never advertised
    and never granted on the customer's statement alone. A small-balance write-off is made only when the whole remaining
    balance of the program is greater than 0.00 and no more than small_balance_writeoff_usd; on tiers where small_balance_writeoff_usd
    is 0.00 no write-off is made and the balance is statemented. A credit balance - a balance below zero - is refunded
    to the original payment method no later than credit_balance_refund_days calendar days after the posting date
    of the entry that created it, unless the customer asks in writing to keep it on account; a refund never exceeds
    the credit. A payment plan is offered only on tiers where payment_plan_max_months is greater than 0, for a balance
    of at least payment_plan_min_balance_usd, in no more than payment_plan_max_months monthly installments of at
    least payment_plan_min_monthly_usd; it is created as a payment plan request the customer accepts, and while
    an approved plan's installments are current the balance it covers is left out of the past-due test measured
    by pump_msr_past_due_amount.
  eligibility:
  - id: hardship_approved
    applies_to: [pump_balance_adjustment]
    kind: authorization
    condition: >-
      A hardship waiver is granted only on tiers where hardship_waiver_allowed is true, only for postings named
      on a hardship application whose request status is approved
    evidence_fields: [pump_requests.pump_request_id, pump_requests.request_type, pump_requests.request_status, pump_requests.pump_ledger_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_requests.pump_ledger_id]
      action_bindings: {pump_requests.pump_ledger_id: original_pump_ledger_id}
  - id: small_balance_ceiling
    applies_to: [pump_balance_adjustment]
    kind: authorization
    condition: >-
      A small-balance write-off is made only when the whole remaining balance of the program is greater than 0.00
      and no more than small_balance_writeoff_usd
    evidence_fields: [pump_programs.pump_program_id, pump_programs.patient_balance_due]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Insulin Pump Commercial HMO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Insulin Pump Commercial PPO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Insulin Pump Medicare Advantage Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Insulin Pump Original Medicare Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Insulin Pump Medicaid Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
  measures: [pump_msr_past_due_amount]
- id: pump_holds_and_closure
  subject: [pump_program_hold, pump_program_resume, pump_program_administrative_close]
  rule: >-
    An active program is placed on hold for exactly one recorded reason: inpatient_stay (the customer or caregiver
    reports a current inpatient admission to a hospital or skilled nursing facility, on tiers where inpatient_hold_required
    is true); coverage_lapse (the coverage record the program bills has a termination date earlier than the date
    of the write and no other in-effect coverage on file fixes the program's tier); documentation_lapse (no authorization
    grant of the program is valid on the date of the write); past_due_balance (on tiers where past_due_hold_days
    is greater than 0, the past-due amount measured by pump_msr_past_due_amount is at least past_due_hold_min_usd
    and no approved payment plan covers it); or customer_request (the customer asks to pause shipments). A hold
    is placed only for a reason that is true on the date of the write. A program on hold resumes only when its recorded
    hold reason has cleared: discharge reported for inpatient_stay; an in-effect coverage on file and written onto
    the program for coverage_lapse; an authorization grant valid on the date of the write for documentation_lapse;
    a past-due amount below past_due_hold_min_usd or an approved payment plan for past_due_balance; the customer's
    own request for customer_request. A program closes administratively, with the matching closure reason, in exactly
    these cases: documentation_not_received, for a program still in referral_received or pending_authorization once
    the date of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior
    authorization decision pending; authorization_denied, when a payer prior authorization denial stands and no
    new request is pending; hold_limit_reached, for a program on hold once the date of the write is later than the
    hold start date plus hold_max_days calendar days; coverage_ended, for a program on hold for coverage_lapse whose
    customer reports no replacement coverage; customer_discontinued, when the customer confirms the cancellation
    of a program on hold; deceased, when Larkfield's records team has recorded the customer's death. Day counts
    in this policy are calendar days counted from the named date, and a closure is made only on a day strictly later
    than the named date plus the stated days.
  eligibility:
  - id: inpatient_reported
    applies_to: [pump_program_hold]
    kind: caller_fact
    condition: >-
      the customer or caregiver reports a current inpatient admission to a hospital or skilled nursing facility,
      on tiers where inpatient_hold_required is true
    evidence_fields: [pump_programs.pump_program_id, pump_programs.variant_name]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
  - id: hold_reason_true
    applies_to: [pump_program_hold]
    kind: authorization
    condition: A hold is placed only for a reason that is true on the date of the write.
    evidence_fields: [pump_programs.pump_program_id, pump_programs.coverage_id, coverages.termination_date, pump_orders.valid_through,
      pump_programs.patient_balance_due]
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
  - id: hold_limit_elapsed
    applies_to: [pump_program_administrative_close]
    kind: time
    condition: >-
      hold_limit_reached, for a program on hold once the date of the write is later than the hold start date plus
      hold_max_days calendar days
    evidence_fields: [pump_programs.pump_program_id, pump_programs.hold_start_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold start date
      anchor_source: pump_programs.hold_start_date
      relation: not_before
      duration_source: variants.hold_max_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  - id: referral_window_elapsed
    applies_to: [pump_program_administrative_close]
    kind: time
    condition: >-
      documentation_not_received, for a program still in referral_received or pending_authorization once the date
      of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior authorization
      decision pending
    evidence_fields: [pump_programs.pump_program_id, pump_programs.enrolled_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrolled date
      anchor_source: pump_programs.enrolled_date
      relation: not_before
      duration_source: variants.referral_docs_window_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Insulin Pump Commercial HMO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Insulin Pump Commercial PPO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Insulin Pump Medicare Advantage Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Insulin Pump Original Medicare Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Insulin Pump Medicaid Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
  measures: [pump_msr_past_due_amount]
- id: pump_discontinuation
  subject: [pump_program_discontinue]
  rule: >-
    Only the customer can end an active program: Larkfield records the cancellation as a program cancellation request,
    and the program closes only when the customer personally confirms that request. A confirmed cancellation closes
    the program with closure_reason customer_discontinued, or changed_supplier when the customer states they are
    moving these supplies to another supplier; a cancellation of a program on hold is closed under pump_holds_and_closure.
    Ending a program carries no fee and cancels nothing the customer already owes: the balance stays payable, credit
    balances are still refunded under pump_evt_patient_account, and unopened items delivered within the return window
    stay returnable under pump_evt_returns. Authorized units remaining on a closed program lapse and are never shipped;
    a later restart needs a new referral and a new program. A package already shipped is not recalled.
  eligibility:
  - id: cancellation_confirmed
    applies_to: [pump_program_discontinue]
    kind: authorization
    condition: >-
      Larkfield records the cancellation as a program cancellation request, and the program closes only when the
      customer personally confirms that request.
    evidence_fields: [pump_requests.pump_request_id, pump_requests.pump_program_id, pump_requests.request_type,
      pump_requests.request_status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_requests.pump_program_id]
      action_bindings: {pump_requests.pump_program_id: pump_program_id}
- id: pump_agg_multi_holding
  subject: [pump_program_enroll]
  rule: >-
    A customer holds at most max_per_customer insulin pump program at a time across every tier, because a person
    uses one insulin pump and a payer covers one pump and one set of pump supplies. A new pump program is opened
    only when the customer has no pump program in referral_received, pending_authorization, active or on_hold; a
    new pump, a new model or a new insurance for a customer with such a program is written as a program change on
    that program, and a closed program does not count.
  eligibility:
  - id: one_open_program
    applies_to: [pump_program_enroll]
    kind: dedup
    condition: >-
      A new pump program is opened only when the customer has no pump program in referral_received, pending_authorization,
      active or on_hold
    evidence_fields: [pump_programs.customer_id, pump_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.customer_id]
      action_bindings: {pump_programs.customer_id: customer_id}
    dedup_contract:
      table: pump_programs
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [referral_received, pending_authorization, active, on_hold]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: pump_evt_quantity_limits
  subject: [pump_refill_shipment, pump_replacement_shipment, pump_program_change]
  rule: >-
    The pump itself (E0784) ships as one billing unit, once per program, signed for on delivery; a second pump ships
    on the same program only as a manufacturer warranty exchange or as a new pump under the replacement interval
    below. A payer covers a new pump only once pump_replacement_interval_months calendar months have passed since
    the delivery date of the pump originally supplied on the program, counted in calendar months from that delivery
    date with the same calendar day allowed (the last day of the month when that day does not exist); an earlier
    new pump is supplied only at pump_cash_price_by_model under pump_liability_notice, and on the self-pay tier
    every pump is sold at that price. Supply refills follow the pump model on the program: infusion catheter supplies
    (A4224) ship one billing unit per a4224_days_per_unit days of supply, rounded up; cartridges or reservoirs ship
    as the item reservoir_item_by_model names for the model, reservoirs_per_30_days for every 30 days of supply;
    and a MiniMed 780G program also ships pump-integrated sensors (A4239) at pump_sensor_units_per_30_days billing
    unit and minimed_sensors_per_30_days sensors per 30 days of supply. No other model receives sensors under the
    pump program. On tiers where pump_training_required is true, supply refills ship only after a medical record
    with purpose pump_training_completed is on file for the program. On the self-pay tier supplies are charged at
    supply_cash_price_by_item per billing unit. A new (not warranty-exchanged) pump is written onto the program
    by a program change that records its model, serial number and delivery date; a warranty exchange changes only
    the serial number.
  eligibility:
  - id: replacement_interval
    applies_to: [pump_refill_shipment]
    kind: time
    condition: >-
      A payer covers a new pump only once pump_replacement_interval_months calendar months have passed since the
      delivery date of the pump originally supplied on the program
    evidence_fields: [pump_programs.pump_program_id, pump_programs.pump_delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the delivery date of the pump originally supplied on the program
      anchor_source: pump_programs.pump_delivery_date
      relation: not_before
      duration_source: variants.pump_replacement_interval_months
      unit: calendar_months
      counting_rule: >-
        counted in calendar months from that delivery date with the same calendar day allowed (the last day of the
        month when that day does not exist)
      boundary: inclusive
  - id: training_on_file
    applies_to: [pump_refill_shipment]
    kind: authorization
    condition: >-
      On tiers where pump_training_required is true, supply refills ship only after a medical record with purpose
      pump_training_completed is on file for the program.
    evidence_fields: [pump_orders.pump_program_id, pump_orders.record_purpose]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_orders.pump_program_id]
      action_bindings: {pump_orders.pump_program_id: pump_program_id}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {pump_replacement_interval_months: =pump_replacement_interval_months, reservoirs_per_30_days: =reservoirs_per_30_days}
      Insulin Pump Commercial HMO Program: {pump_replacement_interval_months: =pump_replacement_interval_months,
        reservoirs_per_30_days: =reservoirs_per_30_days}
      Insulin Pump Commercial PPO Program: {pump_replacement_interval_months: =pump_replacement_interval_months,
        reservoirs_per_30_days: =reservoirs_per_30_days}
      Insulin Pump Medicare Advantage Program: {pump_replacement_interval_months: =pump_replacement_interval_months,
        reservoirs_per_30_days: =reservoirs_per_30_days}
      Insulin Pump Original Medicare Program: {pump_replacement_interval_months: =pump_replacement_interval_months,
        reservoirs_per_30_days: =reservoirs_per_30_days}
      Insulin Pump Medicaid Program: {pump_replacement_interval_months: =pump_replacement_interval_months, reservoirs_per_30_days: =reservoirs_per_30_days}
  formula: {when: item_code == "A4225" or item_code == "A4232", units: supply_days / 30 * reservoirs_per_30_days}
- id: pump_capped_rental
  subject: [pump_rental_claim, pump_ownership_transfer, pump_claim_submission]
  rule: >-
    On tiers whose pump_acquisition_method is purchase, the pump is billed once, by an original claim for its E0784
    shipment, and the program records ownership_status purchased. On tiers whose pump_acquisition_method is capped_rental,
    the pump is never billed as a purchase: Larkfield bills one rental claim per rental month - rental months run
    from the delivery date of the pump, each starting on that same calendar day of the month (the last day of the
    month when that day does not exist) - numbered 1 upward in the order billed, for each rental month the program
    is active on its first day; a month in which the program is on hold for its whole length is neither billed nor
    counted, and a rental month already billed is never billed again. A rental claim is billed only while the number
    of rental months already billed on the program is less than capped_rental_months; after the claim for rental
    month capped_rental_months is paid, ownership of the pump transfers to the customer, the program records ownership_status
    owned, and no further rental is billed for that pump. Ownership does not change the supplies benefit, which
    continues under pump_evt_refill_shipment and pump_evt_quantity_limits, and a pump owned or purchased by the
    customer is never taken back when the program closes; when a capped-rental program closes before ownership transfers,
    rental billing stops with the last month the program was active, and recovery of the rented pump is arranged
    by Larkfield's equipment team.
  eligibility:
  - id: rental_months_left
    applies_to: [pump_rental_claim]
    kind: dedup
    condition: >-
      A rental claim is billed only while the number of rental months already billed on the program is less than
      capped_rental_months
    evidence_fields: [pump_billing.pump_program_id, pump_billing.event_type, pump_billing.rental_month_number]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_billing.pump_program_id]
      action_bindings: {pump_billing.pump_program_id: pump_program_id}
    dedup_contract:
      table: pump_billing
      mode: separate_record
      object_bindings: {pump_program_id: pump_program_id, rental_month_number: rental_month_number}
      duplicate_filters:
        event_type: [pump_rental_claim]
      distinct_fields: [posting_date]
  - id: ownership_after_last_month
    applies_to: [pump_ownership_transfer]
    kind: authorization
    condition: after the claim for rental month capped_rental_months is paid, ownership of the pump transfers to
      the customer
    evidence_fields: [pump_billing.pump_program_id, pump_billing.rental_month_number, pump_billing.event_type, pump_billing.original_pump_ledger_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_billing.pump_program_id]
      action_bindings: {pump_billing.pump_program_id: pump_program_id}
  params:
    per_tier:
      Insulin Pump Self-Pay Program: {pump_acquisition_method: =pump_acquisition_method, capped_rental_months: =capped_rental_months}
      Insulin Pump Commercial HMO Program: {pump_acquisition_method: =pump_acquisition_method, capped_rental_months: =capped_rental_months}
      Insulin Pump Commercial PPO Program: {pump_acquisition_method: =pump_acquisition_method, capped_rental_months: =capped_rental_months}
      Insulin Pump Medicare Advantage Program: {pump_acquisition_method: =pump_acquisition_method, capped_rental_months: =capped_rental_months}
      Insulin Pump Original Medicare Program: {pump_acquisition_method: =pump_acquisition_method, capped_rental_months: =capped_rental_months}
      Insulin Pump Medicaid Program: {pump_acquisition_method: =pump_acquisition_method, capped_rental_months: =capped_rental_months}
  measures: [pump_msr_rental_months_billed]
- id: pump_warranty_and_defects
  subject: [pump_replacement_shipment, pump_defective_device_return]
  rule: >-
    A pump that alarms, fails a self-test or stops delivering insulin is first logged as a manufacturer warranty
    claim request and troubleshot with the manufacturer's technical support; Larkfield never ships a pump of its
    own stock to replace a malfunctioning one. While the pump is in warranty - no later than pump_warranty_months_by_model
    calendar months after the delivery date of the pump originally supplied on the program, counted in calendar
    months from that delivery date with that date itself allowed - and the manufacturer confirms a malfunction,
    the replacement pump ships at no charge as a manufacturer_warranty_exchange, expedited_no_charge, recorded against
    the original pump shipment and drawing no authorized units; the replacement carries only the remainder of the
    original warranty, so the warranty and the payer replacement interval keep counting from the original delivery
    date. The malfunctioning pump must be sent back in the prepaid box no later than defective_pump_return_days
    calendar days after the replacement's delivery date; when it is received its return is recorded against the
    exchange shipment, and a pump not received in time is invoiced to the customer by its manufacturer, not by Larkfield.
    A malfunction after the warranty is not a warranty exchange: a new pump is supplied only under pump_evt_quantity_limits,
    and until then the customer is told to use the backup insulin pens or syringes their prescriber ordered. A pump
    lost, stolen or damaged by accident is not covered by the manufacturer warranty and is not replaced by Larkfield
    at no charge.
  eligibility:
  - id: in_warranty
    applies_to: [pump_replacement_shipment]
    kind: time
    condition: >-
      While the pump is in warranty - no later than pump_warranty_months_by_model calendar months after the delivery
      date of the pump originally supplied on the program
    evidence_fields: [pump_programs.pump_program_id, pump_programs.pump_delivery_date, pump_programs.pump_model]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.pump_program_id]
      action_bindings: {pump_programs.pump_program_id: pump_program_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date of the pump originally supplied on the
        program, anchor_source: pump_programs.pump_delivery_date, relation: not_after, duration_source: variants.pump_warranty_months_by_model,
      unit: calendar_months, counting_rule: counted in calendar months from that delivery date with that date itself
        allowed, boundary: inclusive}
  - id: warranty_claim_logged
    applies_to: [pump_replacement_shipment]
    kind: authorization
    condition: >-
      A pump that alarms, fails a self-test or stops delivering insulin is first logged as a manufacturer warranty
      claim request and troubleshot with the manufacturer's technical support
    evidence_fields: [pump_requests.pump_program_id, pump_requests.request_type, pump_requests.request_status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_requests.pump_program_id]
      action_bindings: {pump_requests.pump_program_id: pump_program_id}
  params: {pump_warranty_months_by_model: =pump_warranty_months_by_model, defective_pump_return_days: =defective_pump_return_days}
- id: pump_combo_sensor_and_insulin
  subject: [pump_program_enroll, pump_program_change, pump_refill_shipment]
  rule: >-
    Holding a CGM program changes what the pump program may carry, and the pump program changes how pump insulin
    is supplied. A pump program on a pump whose list under the CGM program's pump_cgm_compatibility table names
    CGM models uses the customer's CGM program as its sensor source, and the pump model written on the program must
    accept the CGM model on the customer's CGM program that is not closed; a MiniMed 780G program, whose list is
    empty, takes its sensors under this program. A MiniMed 780G sensor refill (A4239) ships only when the customer
    holds no CGM program in active status, because a payer pays only one CGM supply allowance per month; a customer
    moving to the 780G ends or holds the CGM program first. On the Original Medicare tier the insulin used in the
    pump is a Part B benefit supplied with the pump, so the customer's pump insulin is dispensed under the Insulin
    Pharmacy Medicare Part B Pump Insulin Program rather than under Part D.
  eligibility:
  - id: no_active_cgm_program
    applies_to: [pump_refill_shipment]
    kind: authorization
    condition: A MiniMed 780G sensor refill (A4239) ships only when the customer holds no CGM program in active
      status
    evidence_fields: [cgm_programs.customer_id, cgm_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.customer_id]
      action_bindings: {cgm_programs.customer_id: customer_id}
