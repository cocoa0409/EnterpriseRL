      the payer authorization are, when the delivery draws on a grant other than the one the latest refill drew on, the delivery's
      units beyond that authorization's units left, and none otherwise.
    frequency_blocks: >-
      When the paid-supply end is after today, every 30-day block of the delivery is at risk, and the units at risk are the
      at-risk blocks times the tier's allowance per 30 days.
    excepted_blocks: >-
      Each adjustment set out below changes the standard shipment as that adjustment states, in this order: the earliest ship
      date and the paid-supply end are moved or replaced first, the at-risk blocks are then marked against the paid-supply
      end as moved, blocks are then taken off those at-risk blocks, and the waiting rule replaced last; the refill ships a
      whole number of units, never below zero, and nothing when the delivery cannot ship today.
    excess_units: >-
      The latest refill is the latest refill shipment of the item, read for its ship date, supply days, billing route and
