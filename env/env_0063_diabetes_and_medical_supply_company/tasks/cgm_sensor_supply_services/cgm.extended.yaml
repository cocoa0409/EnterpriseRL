    prior_auth_required: true
    prior_auth_validity_months: 6
    pa_renewal_lead_days: 21
    pa_standard_decision_days: 7
    pa_expedited_decision_hours: 72
    supply_days_per_shipment: 30
    refill_contact_lead_days: 14
    refill_ship_lead_days: 7
    refill_confirmation_required: true
    standard_shipping_fee_usd: 0.0
    free_shipping_threshold_usd: 0.0
    expedited_shipping_fee_usd: 24.5
    carrier_trace_business_days: 3
    courtesy_reships_per_12_months: 1
    damage_report_days: 7
    return_window_days: 30
    restocking_fee_pct: 0
    opened_returnable: false
    inpatient_hold_required: true
    hold_max_days: 60
    referral_docs_window_days: 30
    coverage_reverification_months: 1
    signature_required_on_delivery: true
    defect_report_days: 30
    sensor_allowance_units_per_30_days: 1
    sensors_per_30_days_by_model: *id001
    g6_transmitter_replacement_days: 90
    receiver_covered: true
    receiver_replacement_months: 36
    receiver_warranty_months: 12
    initial_visit_lookback_months: 6
    followup_visit_interval_months: 6
    cash_price_30_day_by_model: *id002
    receiver_cash_price_by_model: *id003
