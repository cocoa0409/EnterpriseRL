- id: cgm_ext_plan_member_waiver_units
  base_policy_refs:
  - cgm_liability_notice
  - cgm_evt_refill_shipment
  - cgm_evt_quantity_limits
  - cgm_holds_and_closure
  overwrite:
  - base_policy: cgm_holds_and_closure
    superseded_clause: >-
      past_due_balance (on tiers where past_due_hold_days is greater than 0, the past-due amount measured by cgm_msr_past_due_amount
      is at least past_due_hold_min_usd and no approved payment plan covers it)
    replaced_by: >-
      For the ship-time past-due test of the refill count for a delivery drawing on the grant resting on the newest written
      order and of the plan member waiver count, and only for that test, a posting counts as past due once the whole calendar
      months given by the tier's past_due_hold_days divided by 30, rounded down, have passed from its posting date to today,
      no posting counts on a tier whose past_due_hold_days is 0, the past-due remittance patient responsibility, other than
      a posting named on a hardship application, counts as covered while an approved payment plan's installments are current,
      and a posting named on a hardship application is set aside as this policy's hardship rules state; every program hold
      for past_due_balance still rests on past_due_balance (on tiers where past_due_hold_days is greater than 0, the past-due
      amount measured by cgm_msr_past_due_amount is at least past_due_hold_min_usd and no approved payment plan covers it).
  trigger: state_due
  subject:
  - cgm_liability_notice_signed
  computes: notice_units
  target_tool: sign_plan_member_waiver_eca832b6
  params: {}
  rule: >-
    This policy counts the billing units of the CGM supply allowance (A4239) that a plan member waiver, the liability notice
    of a commercial tier, must cover for the delivery of the item that can ship today when the payer is expected not to pay
    all of it because the delivery begins while the supply of the program's latest refill of the item is still running. For
    the ship-time past-due test of the refill count for a delivery drawing on the grant resting on the newest written order
    and of the plan member waiver count, and only for that test, a posting counts as past due once the whole calendar months
    given by the tier's past_due_hold_days divided by 30, rounded down, have passed from its posting date to today, no posting
    counts on a tier whose past_due_hold_days is 0, the past-due remittance patient responsibility, other than a posting named
    on a hardship application, counts as covered while an approved payment plan's installments are current, and a posting
    named on a hardship application is set aside as this policy's hardship rules state; every program hold for past_due_balance
    still rests on past_due_balance (on tiers where past_due_hold_days is greater than 0, the past-due amount measured by
    cgm_msr_past_due_amount is at least past_due_hold_min_usd and no approved payment plan covers it). The units the waiver
    covers are fixed only once the newest written order of the item stands recorded as an authorization grant. The units the
    waiver covers are fixed only once the program's past-due amount, after the balance an approved payment plan on the program
    covers is left out, is below the tier's past-due hold minimum. The next delivery draws on the authorization grant resting
    on the newest written order of the item and carries the fewer of the 30-day blocks of one standard shipment and the whole
    30-day blocks from today through that grant's valid-through date, both days counted, never more than the program's authorized
    units remaining allow at the tier's allowance per 30 days; with no such grant it carries nothing. The latest refill is
    the latest refill shipment of the item, read for its ship date, supply days, billing route and claim; its supply counts
    as paid by the payer for its supply days when it was billed by payer claim, from its ship date, and the paid-supply end
    is its ship date plus those paid supply days; the payer authorization is the grant the latest refill drew on, its units
    left being its units less the units of refills drawn on it, never below zero; the units beyond the payer authorization
    are, when the delivery draws on a grant other than the one the latest refill drew on, the delivery's units beyond that
    authorization's units left, and none otherwise. The pump delivery is the pump delivery date recorded on the customer's
    insulin pump program, and the over-limit justification is the latest medical record on the CGM program with purpose over-limit
    justification. The past-due amount is the remittance patient responsibility, patient charges and refunds posted on the
    program, less those posted fewer than the tier's past_due_hold_days divided by 30, rounded down, whole calendar months
    before today, less every payment and balance adjustment posted on it; while an approved payment plan's installments are
    current, the program's patient payments posted fewer whole calendar months before today than one more than the whole calendar
    months since it was logged, reaching its monthly amount for each whole calendar month since it was logged, it covers the
    past-due remittance patient responsibility left after those credits, other than the posting named on the latest hardship
    application. The earliest permitted ship date is refill_ship_lead_days calendar days before the latest refill's ship date
    plus its supply days. When the paid-supply end is after today, every 30-day block of the delivery is at risk, and the
    units at risk are the at-risk blocks times the tier's allowance per 30 days. The delivery ships only when its earliest
    permitted ship date is not after today and the uncovered past-due amount, the past-due amount less the covered amount,
    is below past_due_hold_min_usd or the tier's past_due_hold_days is 0. The waiver lists the units at risk. Whole calendar
    months from one date to a later date are the difference in calendar months between them, less one when the later date's
    calendar day is earlier than the earlier date's calendar day. Each adjustment set out below changes the standard count
    as that adjustment states, in this order: the earliest ship date and the paid-supply end are moved or replaced first,
    the at-risk blocks are then marked against the paid-supply end as moved, blocks are then taken off those at-risk blocks,
    and the listing replaced last; the waiver covers a whole number of units, never below zero, and nothing when the delivery
    cannot ship today. The ship-timing adjustment replaces the standard earliest permitted ship date: when the customer's
    insulin pump program is not closed and the pump delivery falls after the latest refill shipped and on or before the newest
    written order's date, the latest refill does not count and the delivery may ship today; when the latest refill shipped
    as expedited_no_charge, because Larkfield delayed it, the earliest date is refill_ship_lead_days calendar days before
    its proof-of-delivery date, or its ship date when no proof of delivery is recorded, plus its supply days; otherwise the
    standard earliest date applies. The hardship adjustment takes a posting under a hardship application off the past-due
    amount: when the latest hardship application on the program names a posting and is still awaiting decision, that posting's
    amount is taken off; when it is approved, that posting's amount less the balance adjustments posted against it is taken
    off; otherwise nothing is taken off. The early-refill adjustment moves the paid-supply end earlier by the payer's early-refill
    allowance: when the latest refill carried at least one standard shipment's supply days, by one fifth of those days, rounded
    down; when it carried at least 30 but fewer days, by the tier's refill lead days; otherwise it does not move. The frequency-edit
    adjustment replaces which blocks of the delivery are at risk against the paid-supply end: when the payer paid any amount
    on the latest refill's claim, every 30-day block that begins before the paid-supply end is at risk; when a remittance
    for that claim posted with no payer payment, only the delivery's first block is at risk, and only when the paid-supply
    end is after today; otherwise the standard at-risk blocks apply. The documented-change adjustment takes at-risk blocks
    off: when the customer's insulin pump program is not closed, the pump delivery falls after the latest refill shipped and
    the over-limit justification is dated on or after the pump delivery, up to the first two at-risk blocks come off, the
    payer being expected to pay them as the transition to the model the pump requires; when the over-limit justification is
    dated after the latest refill shipped and the pump delivery does not fall after it, the first at-risk block comes off,
    the documented clinical change being expected to be paid for it only; otherwise no block comes off. The listing adjustment
    replaces what the waiver lists: when the delivery draws on a grant other than the one the latest refill drew on and the
    payer authorization has fewer units left than the delivery carries, the waiver lists the units at risk and the units beyond
    the payer authorization, never more than the delivery's units; when refills of the item are on record but the latest carries
    no refill confirmation date, so continued use is not confirmed, the waiver lists every unit of the delivery; otherwise
    the standard listing applies.
  prerequisite:
  - problem: cgm_ext_model_change_authorization_units
    kind: value_input
    gate: delivery_blocks
    form: state
    policy_source: >-
      The units the waiver covers are fixed only once the newest written order of the item stands recorded as an authorization
      grant.
    condition: >-
      A cgm_authorization_grant row of item A4239 on the program has related_cgm_order_id equal to the newest cgm_order_receipt
      row of the item.
    resolved_by: record_model_change_authorization_2da97677
    effect: >-
      Once the grant resting on the newest written order is recorded, delivery_blocks rises from zero to the blocks the delivery
      carries, and the at-risk and excess units follow from it.
  - problem: cgm_ext_payment_plan_installment
    kind: state_gate
    gate: uncovered_past_due
    form: state
    policy_source: >-
      The units the waiver covers are fixed only once the program's past-due amount, after the balance an approved payment
      plan on the program covers is left out, is below the tier's past-due hold minimum.
    condition: >-
      A cgm_requests row of request_type payment_plan with request_status approved and installments current is on the program,
      and the uncovered past-due amount (aged postings less credits, the hardship set-aside and the covered remittance patient
      responsibility) is below the tier's past-due hold minimum.
    resolved_by: accept_payment_plan_9d194c19
    effect: >-
      Once the plan is approved, plan_covered takes in the past-due remittance patient responsibility, uncovered_past_due
      falls below the hold minimum and the waiver covers the listed units instead of nothing.
  cross_category:
  - category: pump
    as: history
    reads:
    - status
    - pump_delivery_date
    note: >-
      waiver_refill_timing and documented_change_exception read whether the insulin pump program is open and when its pump
      was delivered
  compute:
  - newest_order_id: >-
      LATEST('cgm_orders','cgm_order_id', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239') or ''
  - newest_order_date: >-
      LATEST('cgm_orders','order_date', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239') or NOW
  - drawn_grant_id: >-
      LATEST('cgm_orders','cgm_order_id', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239',
      related_cgm_order_id=newest_order_id) or ''
  - drawn_end_offset: >-
      DAYS(NOW, LATEST('cgm_orders','valid_through', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239',
      cgm_order_id=drawn_grant_id) or NOW)
  - allowance: P('sensor_allowance_units_per_30_days')
  - blocks_per_shipment: P('supply_days_per_shipment') // 30
  - delivery_blocks: >-
      MN(blocks_per_shipment, MX(0, drawn_end_offset + 1) // 30, MX(0, F('authorized_units_remaining')) // allowance) if drawn_grant_id
      else 0
  - latest_refill_id: >-
      LATEST('cgm_shipments','cgm_shipment_id', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      or ''
  - latest_refill_ship: >-
      LATEST('cgm_shipments','ship_date', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      NOW
  - latest_refill_days: >-
      LATEST('cgm_shipments','supply_days', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      0
  - latest_refill_route: >-
      LATEST('cgm_shipments','billing_route', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      or ''
  - pa_grant_id: >-
      LATEST('cgm_shipments','cgm_order_id', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      or ''
  - pa_left: >-
      MX(0, SUM('cgm_orders','units_authorized', event_type='cgm_authorization_grant', item_code='A4239', cgm_order_id=pa_grant_id)
      - SUM('cgm_shipments','units', event_type='cgm_refill_shipment', item_code='A4239', cgm_order_id=pa_grant_id))
  - paid_supply_days: latest_refill_days if latest_refill_route == 'payer_claim' else 0
  - latest_claim_id: >-
      LATEST('cgm_billing','cgm_ledger_id', date_field='posting_date', event_type='cgm_claim_submission', cgm_shipment_id=latest_refill_id)
      or ''
  - hold_months: P('past_due_hold_days') // 30
  - aged_postings: >-
      SUM('cgm_billing','amount', event_type='cgm_claim_adjudication') + SUM('cgm_billing','amount', event_type='cgm_patient_charge')
      + SUM('cgm_billing','amount', event_type='cgm_patient_refund') - SUM('cgm_billing','amount', within_months=hold_months,
      date_field='posting_date', event_type='cgm_claim_adjudication') - SUM('cgm_billing','amount', within_months=hold_months,
      date_field='posting_date', event_type='cgm_patient_charge') - SUM('cgm_billing','amount', within_months=hold_months,
      date_field='posting_date', event_type='cgm_patient_refund')
  - aged_remittances: >-
      SUM('cgm_billing','amount', event_type='cgm_claim_adjudication') - SUM('cgm_billing','amount', within_months=hold_months,
      date_field='posting_date', event_type='cgm_claim_adjudication')
  - credits_posted: >-
      SUM('cgm_billing','amount', event_type='cgm_patient_payment') + SUM('cgm_billing','amount', event_type='cgm_balance_adjustment')
  - hardship_posting_amount: >-
      SUM('cgm_billing','amount', cgm_ledger_id=(LATEST('cgm_requests','cgm_ledger_id', date_field='received_at', request_type='hardship_application')
      or ''))
  - plan_covered: >-
      MX(0, aged_remittances - credits_posted - hardship_posting_amount) if COUNT('cgm_requests', request_type='payment_plan',
      request_status='approved') > 0 and SUM('cgm_billing','amount', within_months=MONTHS((LATEST('cgm_requests','received_at',
      date_field='received_at', request_type='payment_plan', request_status='approved') or NOW), NOW) + 1, date_field='posting_date',
      event_type='cgm_patient_payment') >= MONTHS((LATEST('cgm_requests','received_at', date_field='received_at', request_type='payment_plan',
      request_status='approved') or NOW), NOW) * (LATEST('cgm_requests','monthly_amount_usd', date_field='received_at', request_type='payment_plan',
      request_status='approved') or 0) else 0
  - pump_delivery_date: CFIELD('pump','pump_delivery_date') or '0000-00-00'
  - justification_date: >-
      LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt', record_purpose='over_limit_justification')
      or '0000-00-00'
  - latest_refill_delivered: >-
      LATEST('cgm_shipments','delivery_date', date_field='delivery_date', event_type='cgm_delivery_confirmation', original_cgm_shipment_id=latest_refill_id)
      or latest_refill_ship
  - earliest_ship_offset: >-
      0 if (CFIELD('pump','status') or 'closed') != 'closed' and pump_delivery_date > latest_refill_ship and pump_delivery_date
      <= newest_order_date else ((DAYS(NOW, latest_refill_delivered) + latest_refill_days - P('refill_ship_lead_days')) if
      LATEST('cgm_shipments','shipping_method', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      == 'expedited_no_charge' else (DAYS(NOW, latest_refill_ship) + latest_refill_days - P('refill_ship_lead_days')))
  - hardship_status: >-
      LATEST('cgm_requests','request_status', date_field='received_at', request_type='hardship_application') or ''
  - hardship_excluded: >-
      hardship_posting_amount if hardship_status == 'received' else ((hardship_posting_amount - SUM('cgm_billing','amount',
      event_type='cgm_balance_adjustment', original_cgm_ledger_id=(LATEST('cgm_requests','cgm_ledger_id', date_field='received_at',
      request_type='hardship_application') or ''))) if hardship_status == 'approved' else 0)
  - early_basis_days: >-
      LATEST('cgm_shipments','supply_days', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      0
  - early_refill_days: >-
      early_basis_days // 5 if early_basis_days >= P('supply_days_per_shipment') else (P('refill_ship_lead_days') if early_basis_days
      >= 30 else 0)
  - counting_rule: >-
      'block_start' if COUNT('cgm_billing', event_type='cgm_claim_adjudication', original_cgm_ledger_id=latest_claim_id) >
      0 and SUM('cgm_billing','payer_paid_amount', event_type='cgm_claim_adjudication', original_cgm_ledger_id=latest_claim_id)
      > 0 else ('first_block' if COUNT('cgm_billing', event_type='cgm_claim_adjudication', original_cgm_ledger_id=latest_claim_id)
      > 0 else 'whole_delivery')
  - exception_mode: >-
      'pump_transition' if (CFIELD('pump','status') or 'closed') != 'closed' and pump_delivery_date > latest_refill_ship and
      justification_date >= pump_delivery_date else ('clinical_change' if justification_date > latest_refill_ship and pump_delivery_date
      <= latest_refill_ship else 'none')
  - listed_scope: >-
      'with_excess' if drawn_grant_id and drawn_grant_id != pa_grant_id and pa_left < delivery_blocks * allowance else ('whole_delivery'
      if COUNT('cgm_shipments', event_type='cgm_refill_shipment', item_code='A4239') > 0 and not (LATEST('cgm_shipments','refill_confirmed_date',
      date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or '') else 'risk_only')
  - uncovered_past_due: >-
      0 if P('past_due_hold_days') == 0 else MX(0, aged_postings - credits_posted - hardship_excluded - plan_covered)
  - ship_allowed: earliest_ship_offset <= 0 and uncovered_past_due < P('past_due_hold_min_usd')
  - paid_end_offset: DAYS(NOW, latest_refill_ship) + paid_supply_days - early_refill_days
  - frequency_blocks: >-
      (MN(delivery_blocks, MX(0, (paid_end_offset + 29) // 30)) if counting_rule == 'block_start' else (MN(delivery_blocks,
      1) if counting_rule == 'first_block' and paid_end_offset > 0 else (delivery_blocks if paid_end_offset > 0 else 0)))
  - excepted_blocks: >-
      MN(frequency_blocks, 2) if exception_mode == 'pump_transition' else (MN(frequency_blocks, 1) if exception_mode == 'clinical_change'
      else 0)
  - excess_units: >-
      MX(0, delivery_blocks * allowance - pa_left) if drawn_grant_id and drawn_grant_id != pa_grant_id else 0
  - risk_units: (frequency_blocks - excepted_blocks) * allowance
  - listed_units: >-
      MN(delivery_blocks * allowance, risk_units + excess_units) if listed_scope == 'with_excess' else (delivery_blocks *
      allowance if listed_scope == 'whole_delivery' else risk_units)
  - result: int(MX(0, listed_units)) if ship_allowed else 0
