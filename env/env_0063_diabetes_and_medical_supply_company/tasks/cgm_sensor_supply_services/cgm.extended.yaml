      prescriber_npi=order_signer) or '0000-00-00'), (LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt',
      record_purpose='initial_qualification', prescriber_npi=order_signer) or '0000-00-00')) if signer_visits > 0 else MX((LATEST('cgm_orders','visit_date',
      date_field='visit_date', event_type='cgm_medical_record_receipt', record_purpose='continued_need_followup') or '0000-00-00'),
