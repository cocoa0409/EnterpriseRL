      as earlier than every record when no such record exists; and the months left are the review length less the whole calendar
      months from the review start to the grant's anchor date, counted as zero when the review start falls after the anchor
      date, and never below zero.
    result: >-
      Each adjustment set out below changes the standard grant as that adjustment states, in this order: replacements of a
      standard quantity are applied first, so the span's blocks and the anchor date are those as replaced; the coverage-review
      limit is then applied to the span's blocks so replaced, counting the months left to the anchor date so replaced; blocks
      added on top of the span come last and are not limited by the coverage review; the blocks are settled before they are
      multiplied by the units per 30 days, and the grant then carries a whole number of units.
  factors:
  - id: span_start_anchor
    effect: >-
      method
    decides: span_blocks
    bindings:
    - span_blocks
    - review_anchor_date
    ladder:
    - when: a grant of the item is still valid on the order date
      method: blocks from the day after that grant's valid-through date, anchored to that valid-through date
    - when: no grant is still valid and the latest refill's supply runs past the order date
      method: blocks from the end of that supply, anchored to the order date
    - when: otherwise
      method: the standard blocks and anchor
    baseline:
      span_blocks: (DAYS(order_date, order_valid_through) + 1) // 30
      review_anchor_date: order_date
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: order_quantity_convention
    effect: >-
      method
    decides: units_per_block
    bindings:
    - order_quantity
    - allowance
    - units_per_block
    ladder:
    - when: the order's quantity per 30 days equals the allowance times the blocks of one standard shipment
      method: that quantity divided by the blocks of one standard shipment
    - when: the order's quantity per 30 days is any other quantity above the allowance
      method: no units until the prescriber corrects the order
    - when: otherwise
      method: the order's quantity as written
    baseline:
      units_per_block: order_quantity
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: coverage_review_length
    effect: >-
      parameter
    decides: review_length_months
    bindings:
    - insulin_supply_end_offset
    - insulin_closed_date
    - review_length_months
    ladder:
    - when: >-
        the insulin pharmacy program closed the follow-up visit interval or more whole calendar months before the order date
      value: 0 months
    - when: >-
        the latest insulin supply ended on or before the order date (no insulin refill on record counting as ended on the
        order date)
      value: the tier's follow-up visit interval in months
    - when: otherwise
      value: the standard review length
    baseline:
      review_length_months: blocks_per_shipment
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: insulin
  - id: review_visit_practitioner
    effect: >-
      method
    decides: review_visit_date
    bindings:
    - order_signer
    - treating_visits
    - signer_visits
    - review_visit_date
    ladder:
    - when: the treating prescriber has a qualifying visit
      method: the treating prescriber's latest qualifying visit
    - when: the treating prescriber has none and the order's signer has one
      method: the signer's latest qualifying visit
    - when: otherwise
      method: the standard review visit
    baseline:
      review_visit_date: >-
        MX((LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt', record_purpose='continued_need_followup')
        or '0000-00-00'), (LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt',
        record_purpose='initial_qualification') or '0000-00-00'))
    evidence:
    - history
    cross_difficulty: null
  - id: regimen_change_record
    effect: >-
      parameter
    decides: regimen_change_date
    bindings:
    - testing_class
    - testing_order_date
    - regimen_change_date
    ladder:
    - when: the testing-supplies program documents non-insulin treatment and has a written order
      value: that program's newest written order date
    - when: it documents non-insulin treatment with no written order
      value: the date that program was activated
    - when: otherwise
      value: the standard regimen change date
    baseline:
      regimen_change_date: >-
        XLATEST('insulin','insulin_shipments','ship_date', date_field='ship_date', event_type='insulin_refill_shipment') or
        '0000-00-00'
    evidence:
    - cross_category
    - date
    cross_difficulty: bgm
  - id: refill_bridge
    effect: >-
      parameter
    decides: bridge_blocks
    bindings:
    - previous_units_left
    - next_refill_offset
    - bridge_blocks
    ladder:
    - when: >-
        the grant still valid on the order date has no units left and the next refill date falls on or before its valid-through
        date
      value: adds the whole blocks from the next refill date through that valid-through date
    - when: that grant still has units left and the next refill date falls on or before its valid-through date
      value: adds those whole blocks less the units left, never below zero
    - when: otherwise
      value: adds no blocks
    baseline:
      bridge_blocks: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
