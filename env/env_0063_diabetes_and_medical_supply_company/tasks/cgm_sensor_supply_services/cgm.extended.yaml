      The delivery-charge adjustment takes charges for delivery off the plan balance: when the program carries expedited shipping
      charges, their total is taken off; when it carries no expedited shipping charge but carries standard shipping charges,
      their total is taken off; otherwise nothing is taken off.
    pump_balance: >-
      The program's unpaid balance is the remittance patient responsibility, patient charges and refunds posted on it less
      the payments and balance adjustments posted on it; recent postings are those posted less than one whole calendar month
      before today; the customer's insulin pump program bills the same coverage record when it is not closed and its coverage
      record is the one the CGM program bills.
    pump_same_coverage: >-
      The program's unpaid balance is the remittance patient responsibility, patient charges and refunds posted on it less
      the payments and balance adjustments posted on it; recent postings are those posted less than one whole calendar month
      before today; the customer's insulin pump program bills the same coverage record when it is not closed and its coverage
      record is the one the CGM program bills.
    statement_mode: >-
      The statement adjustment takes postings not yet statemented off the plan balance: when a remittance has posted on the
      program less than one whole calendar month before today, the program's recent remittances and recent patient charges
      come off, together with the insulin pump program's recent remittances and recent patient charges when it bills the same
      coverage record; when no remittance but a patient charge has posted less than one whole calendar month before today,
      only the recent patient charges of the program, and of the insulin pump program when it bills the same coverage record,
      come off; otherwise nothing comes off.
    statement_wait: >-
      The statement adjustment takes postings not yet statemented off the plan balance: when a remittance has posted on the
      program less than one whole calendar month before today, the program's recent remittances and recent patient charges
      come off, together with the insulin pump program's recent remittances and recent patient charges when it bills the same
      coverage record; when no remittance but a patient charge has posted less than one whole calendar month before today,
      only the recent patient charges of the program, and of the insulin pump program when it bills the same coverage record,
      come off; otherwise nothing comes off.
    pump_taken_in: >-
      The pump-balance adjustment adds the customer's insulin pump program balance to the plan balance: when that program
      bills the same coverage record, its whole patient balance is added; when it is not closed but bills another coverage
      record, only its patient charges are added, never more than its balance, its remittance patient responsibility staying
      with that payer's statement; otherwise nothing is added.
    pump_plan_age: >-
      The pump-plan adjustment takes off what the insulin pump program's own approved payment plan still covers, only when
      that program bills the same coverage record: when the pump payments posted fewer whole calendar months before today
      than one more than the whole calendar months since that plan was logged reach its monthly amount for each whole calendar
      month since it was logged, the installments it still has to collect, its installments times its monthly amount less
      those payments, are taken off; when that plan is behind, only its installments not yet due, the installments beyond
      the whole calendar months since it was logged times its monthly amount, are taken off; otherwise nothing is taken off.
    pump_plan_paid: >-
      The pump-plan adjustment takes off what the insulin pump program's own approved payment plan still covers, only when
      that program bills the same coverage record: when the pump payments posted fewer whole calendar months before today
      than one more than the whole calendar months since that plan was logged reach its monthly amount for each whole calendar
      month since it was logged, the installments it still has to collect, its installments times its monthly amount less
      those payments, are taken off; when that plan is behind, only its installments not yet due, the installments beyond
      the whole calendar months since it was logged times its monthly amount, are taken off; otherwise nothing is taken off.
    pump_plan_carve: >-
      The pump-plan adjustment takes off what the insulin pump program's own approved payment plan still covers, only when
      that program bills the same coverage record: when the pump payments posted fewer whole calendar months before today
      than one more than the whole calendar months since that plan was logged reach its monthly amount for each whole calendar
      month since it was logged, the installments it still has to collect, its installments times its monthly amount less
      those payments, are taken off; when that plan is behind, only its installments not yet due, the installments beyond
      the whole calendar months since it was logged times its monthly amount, are taken off; otherwise nothing is taken off.
    last_payment_method: >-
      The rounding adjustment replaces the standard rounding of each installment by the way the customer pays: when the program's
      latest payment was made by debit card, credit card or HSA/FSA card, each installment is rounded up to the next cent;
      when it was made by check or bank transfer, each installment is rounded up to the next whole dollar; otherwise the standard
      rounding applies.
    rounding_rule: >-
      The rounding adjustment replaces the standard rounding of each installment by the way the customer pays: when the program's
      latest payment was made by debit card, credit card or HSA/FSA card, each installment is rounded up to the next cent;
      when it was made by check or bank transfer, each installment is rounded up to the next whole dollar; otherwise the standard
      rounding applies.
    covered_balance: >-
      The plan balance is the program's unpaid balance, never below zero, rounded to the nearest cent, a half cent going to
      the even cent, and each installment is the plan balance divided by the installments, rounded to the nearest cent, a
      half cent going to the even cent.
    covered_cents: >-
      The plan balance is the program's unpaid balance, never below zero, rounded to the nearest cent, a half cent going to
      the even cent, and each installment is the plan balance divided by the installments, rounded to the nearest cent, a
      half cent going to the even cent.
    monthly_cents: >-
      The plan balance is the program's unpaid balance, never below zero, rounded to the nearest cent, a half cent going to
      the even cent, and each installment is the plan balance divided by the installments, rounded to the nearest cent, a
      half cent going to the even cent.
    result: >-
      Each adjustment set out below changes the standard plan balance or installment as that adjustment states, in this order:
      amounts taken off another program's postings come off only the amount added from that program, never taking it below
      zero, every other addition and deduction is then applied to the plan balance, and the installment is figured and rounded
      last; no plan is priced, and the installment is 0.00, when the adjusted plan balance is below payment_plan_min_balance_usd
      or the installment would be below payment_plan_min_monthly_usd; amounts are in USD with 2 decimal places.
    statement_wait_pump: >-
      The statement adjustment takes postings not yet statemented off the plan balance: when a remittance has posted on the
      program less than one whole calendar month before today, the program's recent remittances and recent patient charges
      come off, together with the insulin pump program's recent remittances and recent patient charges when it bills the same
      coverage record; when no remittance but a patient charge has posted less than one whole calendar month before today,
      only the recent patient charges of the program, and of the insulin pump program when it bills the same coverage record,
      come off; otherwise nothing comes off.
  factors:
  - id: hardship_pending_carve_out
    effect: >-
      parameter
    decides: hardship_excluded
    bindings:
    - hardship_ledger_id
    - hardship_status
    - hardship_excluded
    ladder:
    - when: the latest hardship application names a posting and is awaiting decision
      value: takes that posting's amount off
    - when: it is approved
      value: takes that posting's amount less the adjustments against it off
    - when: otherwise
      value: takes nothing off
    baseline:
      hardship_excluded: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: convenience_charge_carve_out
    effect: >-
      parameter
    decides: charge_excluded
    bindings:
    - speed_charges
    - shipping_charges
    - charge_excluded
    ladder:
    - when: the program carries expedited shipping charges
      value: takes their total off
    - when: no expedited charge but standard shipping charges
      value: takes their total off
    - when: otherwise
      value: takes nothing off
    baseline:
      charge_excluded: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: statement_cycle_window
    effect: >-
      method
    decides: statement_mode
    bindings:
    - statement_mode
    - statement_wait
    - statement_wait_pump
    ladder:
    - when: a remittance posted on the program less than one whole calendar month before today
      method: >-
        recent remittances and charges come off (the pump program's too when it bills the same coverage record)
    - when: no such remittance but a patient charge posted less than one whole calendar month before today
      method: only recent charges come off
    - when: otherwise
      method: nothing comes off
    baseline:
      statement_mode: '''none'''
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: pump_balance_fold
    effect: >-
      parameter
    decides: pump_taken_in
    bindings:
    - pump_taken_in
    ladder:
    - when: the pump program bills the same coverage record
      value: adds its whole patient balance
    - when: it is not closed but bills another coverage record
      value: adds its patient charges, never more than its balance
    - when: otherwise
      value: adds nothing
    baseline:
      pump_taken_in: '0'
    evidence:
    - cross_category
    cross_difficulty: pump
  - id: pump_plan_carve_out
    effect: >-
      parameter
    decides: pump_plan_carve
    bindings:
    - pump_plan_total
    - pump_plan_age
    - pump_plan_paid
    - pump_plan_carve
    ladder:
    - when: the pump program's approved plan is current and the pump program bills the same coverage record
      value: takes off the installments it still has to collect
    - when: that plan is behind and the pump program bills the same coverage record
      value: takes off its installments not yet due
    - when: otherwise
      value: takes nothing off
    baseline:
      pump_plan_carve: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: pump
  - id: installment_rounding
    effect: >-
      method
    decides: rounding_rule
    bindings:
    - last_payment_method
    - rounding_rule
    ladder:
    - when: the latest payment was by debit, credit or HSA/FSA card
      method: round each installment up to the next cent
    - when: it was by check or bank transfer
      method: round each installment up to the next whole dollar
    - when: otherwise
      method: the standard rounding (nearest cent, half to even)
    baseline:
      rounding_rule: '''nearest_cent'''
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The program's unpaid balance is the remittance patient responsibility, patient charges and refunds posted on it less
      the payments and balance adjustments posted on it; recent postings are those posted less than one whole calendar month
      before today; the customer's insulin pump program bills the same coverage record when it is not closed and its coverage
      record is the one the CGM program bills. The plan balance is the program's unpaid balance, never below zero, rounded
      to the nearest cent, a half cent going to the even cent, and each installment is the plan balance divided by the installments,
      rounded to the nearest cent, a half cent going to the even cent.
    params:
    - payment_plan_max_months
    - payment_plan_min_balance_usd
    - payment_plan_min_monthly_usd
  inputs:
    history:
    - table: cgm_billing
      aggregate: sum
      field: amount
      filters: {}
    - table: cgm_requests
      aggregate: latest
      field: request_status
      filters:
        request_type: hardship_application
    - category: pump
      table: pump_billing
      aggregate: sum
      field: amount
      filters:
        event_type: pump_patient_payment
    cross_category:
    - pump
- id: cgm_ext_model_change_refill_units
  base_policy_refs:
  - cgm_evt_refill_shipment
  - cgm_evt_quantity_limits
  - cgm_continued_coverage_visits
  - cgm_evt_patient_account
  - cgm_combo_pump_compatibility
  - cgm_holds_and_closure
  overwrite:
  - base_policy: cgm_evt_refill_shipment
    superseded_clause: >-
      The next refill of the same item ships no earlier than refill_ship_lead_days calendar days before the end of the supply
      of the previous refill shipment of that item, counted in calendar days: the previous refill's ship date plus its supply
      days gives the end of its supply, the earliest permitted ship date is refill_ship_lead_days calendar days before that
      end date, and shipping on that earliest date is allowed.
    replaced_by: >-
      For a refill this policy counts, and only for such a refill, the earliest permitted ship date is set by the timing rules
      of this policy; every other refill of the item ships no earlier than refill_ship_lead_days calendar days before the
      end of the supply of the previous refill shipment of that item, counted in calendar days: the previous refill's ship
      date plus its supply days gives the end of its supply, the earliest permitted ship date is refill_ship_lead_days calendar
      days before that end date, and shipping on that earliest date is allowed.
  - base_policy: cgm_evt_refill_shipment
    superseded_clause: >-
      On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms, for
      this shipment, that they are still using the item and how much supply they have on hand; the confirmation date is recorded
      on the shipment, Larkfield never ships those tiers automatically, and Larkfield's own refill reminder for those tiers
      is made no sooner than refill_contact_lead_days calendar days before the planned ship date.
    replaced_by: >-
      For a refill this policy counts, the customer confirms in the call in which they ask for it that they are still using
      the item and how much supply they have on hand, and that confirmation is recorded as the shipment's refill confirmation
      date, the ship date; every other refill on tiers where refill_confirmation_required is true ships only after the customer
      personally confirms, for that shipment, that they are still using the item and how much supply they have on hand, with
      the confirmation date recorded on the shipment; Larkfield never ships those tiers automatically, and Larkfield's own
      refill reminder for those tiers is made no sooner than refill_contact_lead_days calendar days before the planned ship
      date.
  - base_policy: cgm_evt_refill_shipment
    superseded_clause: >-
      the supply days of a shipment are the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that remain
      before the authorization's valid-through date when fewer remain
    replaced_by: >-
      For a refill this policy counts, and only for such a refill, the supply days of the shipment are 30 days for each billing
      unit that ships under this policy at the tier's allowance, out of the tier's supply_days_per_shipment shortened to the
      whole 30-day blocks that remain before the authorization's valid-through date when fewer remain; for every other refill
      the supply days of a shipment are the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that remain
      before the authorization's valid-through date when fewer remain.
  - base_policy: cgm_holds_and_closure
    superseded_clause: >-
      past_due_balance (on tiers where past_due_hold_days is greater than 0, the past-due amount measured by cgm_msr_past_due_amount
      is at least past_due_hold_min_usd and no approved payment plan covers it)
    replaced_by: >-
      For the ship-time past-due test of the refill count for a delivery drawing on the grant resting on the newest written
      order and of the plan member waiver count, and only for that test, a posting counts as past due once the whole calendar
      months given by the tier's past_due_hold_days divided by 30, rounded down, have passed from its posting date to today,
      no posting counts on a tier whose past_due_hold_days is 0, the past-due remittance patient responsibility, other than
      a posting named on a hardship application, counts as covered while an approved payment plan's installments are current,
      and a posting named on a hardship application is set aside as this policy's hardship rules state; every program hold
      for past_due_balance still rests on past_due_balance (on tiers where past_due_hold_days is greater than 0, the past-due
      amount measured by cgm_msr_past_due_amount is at least past_due_hold_min_usd and no approved payment plan covers it).
  trigger: on_request
  subject:
  - cgm_refill_shipment
  computes: units
  target_tool: ship_sensor_refill_e9d57917
  params: {}
  rule: >-
    This policy counts the billing units of a sensor refill (A4239) on a tier where refill_confirmation_required is true that
    draws on the authorization grant resting on the newest written order of the item. For the ship-time past-due test of the
    refill count for a delivery drawing on the grant resting on the newest written order and of the plan member waiver count,
    and only for that test, a posting counts as past due once the whole calendar months given by the tier's past_due_hold_days
    divided by 30, rounded down, have passed from its posting date to today, no posting counts on a tier whose past_due_hold_days
    is 0, the past-due remittance patient responsibility, other than a posting named on a hardship application, counts as
    covered while an approved payment plan's installments are current, and a posting named on a hardship application is set
    aside as this policy's hardship rules state; every program hold for past_due_balance still rests on past_due_balance (on
    tiers where past_due_hold_days is greater than 0, the past-due amount measured by cgm_msr_past_due_amount is at least
    past_due_hold_min_usd and no approved payment plan covers it). For a refill this policy counts, and only for such a refill,
    the earliest permitted ship date is set by the timing rules of this policy; every other refill of the item ships no earlier
    than refill_ship_lead_days calendar days before the end of the supply of the previous refill shipment of that item, counted
    in calendar days: the previous refill's ship date plus its supply days gives the end of its supply, the earliest permitted
    ship date is refill_ship_lead_days calendar days before that end date, and shipping on that earliest date is allowed.
    For a refill this policy counts, the customer confirms in the call in which they ask for it that they are still using
    the item and how much supply they have on hand, and that confirmation is recorded as the shipment's refill confirmation
    date, the ship date; every other refill on tiers where refill_confirmation_required is true ships only after the customer
    personally confirms, for that shipment, that they are still using the item and how much supply they have on hand, with
    the confirmation date recorded on the shipment; Larkfield never ships those tiers automatically, and Larkfield's own refill
    reminder for those tiers is made no sooner than refill_contact_lead_days calendar days before the planned ship date. For
    a refill this policy counts, and only for such a refill, the supply days of the shipment are 30 days for each billing
    unit that ships under this policy at the tier's allowance, out of the tier's supply_days_per_shipment shortened to the
    whole 30-day blocks that remain before the authorization's valid-through date when fewer remain; for every other refill
    the supply days of a shipment are the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that remain
    before the authorization's valid-through date when fewer remain. A refill draws no units until the newest written order
    of the item stands recorded as an authorization grant resting on that order. Blocks of a refill that begin before the
    latest refill's supply ends ship only after a plan member waiver for the item, dated on or after the newest written order,
    stands signed on the program. A refill does not ship until the program's past-due amount, once the balance an approved
    payment plan on the program covers is left out, is below the tier's past-due hold minimum. The next delivery draws on
    the authorization grant resting on the newest written order of the item and carries the fewer of the 30-day blocks of
    one standard shipment and the whole 30-day blocks from today through that grant's valid-through date, both days counted,
    never more than the program's authorized units remaining allow at the tier's allowance per 30 days; with no such grant
    it carries nothing. The latest refill is the latest refill shipment of the item, read for its ship date, supply days,
    billing route and claim; its supply counts as paid by the payer for its supply days when it was billed by payer claim,
    from its ship date, and the paid-supply end is its ship date plus those paid supply days; the payer authorization is the
    grant the latest refill drew on, its units left being its units less the units of refills drawn on it, never below zero;
    the units beyond the payer authorization are, when the delivery draws on a grant other than the one the latest refill
    drew on, the delivery's units beyond that authorization's units left, and none otherwise. The pump delivery is the pump
    delivery date recorded on the customer's insulin pump program, and the over-limit justification is the latest medical
    record on the CGM program with purpose over-limit justification. The past-due amount is the remittance patient responsibility,
    patient charges and refunds posted on the program, less those posted fewer than the tier's past_due_hold_days divided
    by 30, rounded down, whole calendar months before today, less every payment and balance adjustment posted on it; while
    an approved payment plan's installments are current, the program's patient payments posted fewer whole calendar months
    before today than one more than the whole calendar months since it was logged, reaching its monthly amount for each whole
    calendar month since it was logged, it covers the past-due remittance patient responsibility left after those credits,
    other than the posting named on the latest hardship application. The earliest permitted ship date is refill_ship_lead_days
    calendar days before the latest refill's ship date plus its supply days. When the paid-supply end is after today, every
    30-day block of the delivery is at risk, and the units at risk are the at-risk blocks times the tier's allowance per 30
    days. The delivery ships only when its earliest permitted ship date is not after today and the uncovered past-due amount,
    the past-due amount less the covered amount, is below past_due_hold_min_usd or the tier's past_due_hold_days is 0. The
    delivery ships in full when it has no exposed units, the units at risk plus the units beyond the payer authorization,
    and otherwise waits. Whole calendar months from one date to a later date are the difference in calendar months between
    them, less one when the later date's calendar day is earlier than the earlier date's calendar day. Each adjustment set
    out below changes the standard shipment as that adjustment states, in this order: the earliest ship date and the paid-supply
    end are moved or replaced first, the at-risk blocks are then marked against the paid-supply end as moved, blocks are then
    taken off those at-risk blocks, and the waiting rule replaced last; the refill ships a whole number of units, never below
    zero, and nothing when the delivery cannot ship today. The ship-timing adjustment replaces the standard earliest permitted
    ship date: when the customer's insulin pump program is not closed and the pump delivery falls after the latest refill
    shipped and on or before the newest written order's date, the latest refill does not count and the delivery may ship today;
    when the latest refill shipped as expedited_no_charge, because Larkfield delayed it, the earliest date is refill_ship_lead_days
    calendar days before its proof-of-delivery date, or its ship date when no proof of delivery is recorded, plus its supply
    days; otherwise the standard earliest date applies. The hardship adjustment takes a posting under a hardship application
    off the past-due amount: when the latest hardship application on the program names a posting and is still awaiting decision,
    that posting's amount is taken off; when it is approved, that posting's amount less the balance adjustments posted against
    it is taken off; otherwise nothing is taken off. The early-refill adjustment moves the paid-supply end earlier by the
    payer's early-refill allowance: when the latest refill carried at least one standard shipment's supply days, by one fifth
    of those days, rounded down; when it carried at least 30 but fewer days, by the tier's refill lead days; otherwise it
    does not move. The frequency-edit adjustment replaces which blocks of the delivery are at risk against the paid-supply
    end: when the payer paid any amount on the latest refill's claim, every 30-day block that begins before the paid-supply
    end is at risk; when a remittance for that claim posted with no payer payment, only the delivery's first block is at risk,
    and only when the paid-supply end is after today; otherwise the standard at-risk blocks apply. The documented-change adjustment
    takes at-risk blocks off: when the customer's insulin pump program is not closed, the pump delivery falls after the latest
    refill shipped and the over-limit justification is dated on or after the pump delivery, up to the first two at-risk blocks
    come off, the payer being expected to pay them as the transition to the model the pump requires; when the over-limit justification
    is dated after the latest refill shipped and the pump delivery does not fall after it, the first at-risk block comes off,
    the documented clinical change being expected to be paid for it only; otherwise no block comes off. The waiver-coverage
    adjustment replaces the standard waiting rule by the plan member waiver on file: when a plan member waiver for the item
    is dated on or after the newest written order's date, the delivery ships less any exposed units beyond the waiver's units;
    when the latest plan member waiver is dated earlier, it covers the superseded supply, not this delivery, so the delivery
    ships less its exposed units; otherwise the standard waiting rule applies.
  prerequisite:
  - problem: cgm_ext_model_change_authorization_units
    kind: value_input
    gate: drawn_grant_id
    form: state
    policy_source: >-
      A refill draws no units until the newest written order of the item stands recorded as an authorization grant resting
      on that order.
    condition: >-
      A cgm_authorization_grant row of item A4239 on the program has related_cgm_order_id equal to the newest cgm_order_receipt
      row of the item.
    resolved_by: record_model_change_authorization_2da97677
    effect: >-
      Once that grant is recorded, drawn_grant_id names it instead of no grant, and the delivery's blocks rise from zero to
      the blocks that grant supports.
  - problem: cgm_ext_plan_member_waiver_units
    kind: value_input
    gate: coverage_rule
    form: state
    policy_source: >-
      Blocks of a refill that begin before the latest refill's supply ends ship only after a plan member waiver for the item,
      dated on or after the newest written order, stands signed on the program.
    condition: >-
      A cgm_liability_notice_signed row of item A4239 with notice_type plan_member_waiver is on the program with a notice_date
      on or after the order_date of the newest cgm_order_receipt row of the item.
    resolved_by: sign_plan_member_waiver_eca832b6
    effect: >-
      Once the waiver is signed, coverage_rule moves to covered and the at-risk units it covers ship with the delivery.
  - problem: cgm_ext_payment_plan_installment
    kind: state_gate
    gate: uncovered_past_due
    form: state
    policy_source: >-
      A refill does not ship until the program's past-due amount, once the balance an approved payment plan on the program
      covers is left out, is below the tier's past-due hold minimum.
    condition: >-
      A cgm_requests row of request_type payment_plan with request_status approved and installments current is on the program,
      and the uncovered past-due amount (aged postings less credits, the hardship set-aside and the covered remittance patient
      responsibility) is below the tier's past-due hold minimum.
    resolved_by: accept_payment_plan_9d194c19
    effect: >-
      Once the plan is approved, plan_covered takes in the past-due remittance patient responsibility and uncovered_past_due
      falls below the hold minimum, so the refill ships instead of shipping nothing.
  cross_category:
  - category: pump
    as: history
    reads:
    - status
    - pump_delivery_date
    note: >-
      superseded_refill_timing and refill_change_exception read whether the insulin pump program is open and when its pump
      was delivered
  compute:
  - newest_order_id: >-
      LATEST('cgm_orders','cgm_order_id', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239') or ''
  - newest_order_date: >-
      LATEST('cgm_orders','order_date', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239') or NOW
  - drawn_grant_id: >-
      LATEST('cgm_orders','cgm_order_id', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239',
      related_cgm_order_id=newest_order_id) or ''
  - drawn_end_offset: >-
      DAYS(NOW, LATEST('cgm_orders','valid_through', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239',
      cgm_order_id=drawn_grant_id) or NOW)
  - allowance: P('sensor_allowance_units_per_30_days')
  - blocks_per_shipment: P('supply_days_per_shipment') // 30
  - delivery_blocks: >-
      MN(blocks_per_shipment, MX(0, drawn_end_offset + 1) // 30, MX(0, F('authorized_units_remaining')) // allowance) if drawn_grant_id
      else 0
