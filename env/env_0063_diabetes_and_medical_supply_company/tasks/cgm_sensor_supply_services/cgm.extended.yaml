    supply_end_offset: >-
      The standard grant carries, for each whole 30-day block of its span, both days counted, the billing units per 30 days
      written on the order, less one block for each whole 30-day block of the latest refill's supply, its ship date plus its
      supply days, that runs past the order date.
    per_period_approval: >-
      The order is the newest written order of the item; the payer authorization is the authorization grant the program's
      latest refill of the item drew on, and its units left are the units it authorized less the units of refills of the item
      drawn on it, never below zero; that authorization is a per-period approval when its units equal the whole 30-day blocks
