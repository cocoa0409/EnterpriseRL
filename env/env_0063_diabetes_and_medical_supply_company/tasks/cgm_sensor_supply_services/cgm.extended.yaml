  overwrite:
  - base_policy: cgm_evt_patient_account
    superseded_clause: >-
      A payment plan is offered only on tiers where payment_plan_max_months is greater than 0, for a balance of at least payment_plan_min_balance_usd,
      in no more than payment_plan_max_months monthly installments of at least payment_plan_min_monthly_usd; it is created
      as a payment plan request the customer accepts, and while an approved plan's installments are current the balance it
