      date_field='ship_date', event_type='insulin_refill_shipment') or '0000-00-00'))
  - previous_units_left: >-
      SUM('cgm_orders','units_authorized', event_type='cgm_authorization_grant', item_code='A4239') - SUM('cgm_shipments','units',
      event_type='cgm_refill_shipment', item_code='A4239') + SUM('cgm_shipments','units', event_type='cgm_return_receipt',
