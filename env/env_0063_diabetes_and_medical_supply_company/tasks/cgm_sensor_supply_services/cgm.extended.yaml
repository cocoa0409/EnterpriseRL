- id: cgm_ext_medicare_advance_notice_units
  base_policy_refs:
  - cgm_liability_notice
  - cgm_evt_refill_shipment
  overwrite:
  - base_policy: cgm_liability_notice
    superseded_clause: >-
      Larkfield supplies it billable to the customer only after the customer signs the tier's liability notice (liability_notice_type)
      for that item and quantity before the ship date
    replaced_by: >-
      For a supply on the Original Medicare tier that this policy counts, and only for such a supply, Larkfield supplies the
      counted units billable to the customer only after the customer signs the advance notice for the item and those units
      before the ship date; every other supply, including a commercial-tier supply covered by a plan member waiver, remains
      under the base rule.
  - base_policy: cgm_liability_notice
    superseded_clause: >-
      the customer signs it personally, and no Larkfield representative can sign it for them.
    replaced_by: >-
      For a notice this policy counts, the customer signs it personally through their own signing step on the enrollment the
      representative identifies, which records the signed notice and its date on the account in place of the customer's word
      that they signed; no Larkfield representative can sign it for them; every other notice remains under the base rule,
      the customer signing it personally, and no Larkfield representative can sign it for them.
  trigger: on_request
  subject:
  - cgm_liability_notice_signed
  computes: notice_units
  target_tool: sign_medicare_advance_notice_77a558d1
  params: {}
  rule: >-
    This policy counts the billing units of the CGM supply allowance (A4239) that the customer's Medicare advance beneficiary
    notice (form CMS-R-131) must cover on the Original Medicare tier when the customer's coverage conditions for the CGM are
    in doubt. For a supply on the Original Medicare tier that this policy counts, and only for such a supply, Larkfield supplies
    the counted units billable to the customer only after the customer signs the advance notice for the item and those units
    before the ship date; every other supply, including a commercial-tier supply covered by a plan member waiver, remains
    under the base rule. For a notice this policy counts, the customer signs it personally through their own signing step
    on the enrollment the representative identifies, which records the signed notice and its date on the account in place
    of the customer's word that they signed; no Larkfield representative can sign it for them; every other notice remains
    under the base rule, the customer signing it personally, and no Larkfield representative can sign it for them. The units
    the advance notice lists are fixed only after every written order on file for the item stands recorded as an authorization
    grant. The latest refill is the latest refill shipment of the item, read for its ship date, supply days, units, refill
    confirmation date and the authorization grant it drew on; the next delivery date is that refill's ship date plus its supply
    days less the tier's refill lead days; the next delivery draws on the grant the latest refill drew on, its units left
    being the units it authorized less the units of refills of the item drawn on it, and carries the fewest of the tier's
    standard supply blocks times the tier's allowance per 30 days, the whole 30-day blocks from the next delivery date through
    that grant's valid-through date, both days counted, times that allowance, and that grant's units left. The notice lists
    one standard shipment of the item, the 30-day blocks of the tier's standard supply times the tier's allowance per 30 days.
    The notice covers the listed units Medicare is expected to deny, and Medicare is expected to pay every listed unit. The
    customer has stopped insulin when the customer's insulin pharmacy program is closed with closure reason customer_discontinued,
    the customer having stopped insulin rather than moved the prescription to another supplier. The program's unpaid balance
    is the remittance patient responsibility, patient charges and refunds posted on it less the payments and balance adjustments
    posted on it. Whole calendar months from one date to a later date are the difference in calendar months between them,
    less one when the later date's calendar day is earlier than the earlier date's calendar day. Each adjustment set out below
    changes the standard notice as that adjustment states, in this order: replacements of the grant drawn on, the supply blocks
    and the listing first, then the replacement of the payment expectation applied to the units so listed, and units taken
    off last; the notice covers a whole number of units, never below zero. The authorization adjustment replaces the grant
    the next delivery draws on: when the grant the latest refill drew on has no units left or its valid-through date falls
    before the end of the next delivery's first 30-day block, and the newest grant of the item, the one with the latest valid-through
    date, is another grant valid on the next delivery date, the delivery draws on that newest grant, its units left being
    the units it authorized less the units of refills drawn on it, no other newer grant being considered; when the latest
    refill's grant is spent in this way and the newest grant is not such a grant, the delivery has nothing to draw on and
    carries no units; otherwise the standard grant applies. The exposure adjustment replaces the tier's standard supply blocks
    in the next delivery: when the CGM program carries an unpaid balance above 0.00, the delivery carries one 30-day block;
    when it carries none and the customer holds an active testing-supplies program for backup fingerstick testing, it carries
    the fewer of two blocks and the tier's standard supply blocks; otherwise the tier's standard supply blocks apply. The
    listing adjustment replaces what the notice lists by how the program's refills ship: when the latest refill carries the
    customer's refill confirmation date, the notice lists the next delivery; when refills of the item are on record but the
    latest carries no confirmation date, the notice lists every unit left on the grant the next delivery draws on; otherwise
    the standard listing applies. The insulin-record adjustment replaces the expectation that Medicare pays every listed unit:
    when the customer has stopped insulin and the latest insulin refill's supply on the customer's insulin pharmacy program,
    its ship date plus its supply days, ends before the next delivery date, an insulin pharmacy program with no insulin refill
    on record counting as a supply that ended before it, Medicare is expected to deny every listed unit; when the customer
    has stopped insulin but that supply still runs on or after the next delivery date, it is expected to deny the listed units
    less one 30-day block's allowance, never fewer than zero; otherwise the standard expectation applies. The prior-notice
    adjustment takes off the notice the units an earlier advance notice (form CMS-R-131) for the item already covers, only
    when the customer has stopped insulin and the insulin pharmacy program carries a closed date, a liability notice of any
    other type never being credited: when the latest such notice was signed after the latest refill of the item shipped and
    on or after that closed date, its units are taken off; when it was signed on or after that closed date but on or before
    the latest refill shipped, fewer than 12 whole calendar months before today, its units beyond that refill's units are
    taken off; otherwise, and whenever the customer has not stopped insulin or the closed date is not recorded, nothing is
    taken off.
  prerequisite:
  - problem: cgm_ext_renewal_authorization_units
    kind: value_input
    gate: drawn_units_left
    form: state
    policy_source: >-
      The units the advance notice lists are fixed only after every written order on file for the item stands recorded as
      an authorization grant.
    condition: >-
      Every cgm_order_receipt row of item A4239 on the program has a cgm_authorization_grant row whose related_cgm_order_id
      is that order.
    resolved_by: record_order_authorization_630fe26e
    effect: >-
      Once the renewal order's grant is recorded, the newest grant valid on the next delivery date carries units, so drawn_units_left
      and the next delivery's units rise from zero to the grant's units, which the notice then lists.
  cross_category:
  - category: insulin
    as: history
    reads:
    - closed_date
    - closure_reason
    - insulin_shipments.ship_date
    - insulin_shipments.supply_days
    - status
    note: >-
      coverage_risk_scope and prior_notice_credit read the insulin pharmacy status, closed date and latest insulin refill
      supply
  - category: bgm
    as: existence
    reads:
    - status
    note: exposure_limited_delivery reads whether an active testing-supplies program provides backup testing
  compute:
  - latest_refill_ship: >-
      LATEST('cgm_shipments','ship_date', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      NOW
  - latest_refill_days: >-
      LATEST('cgm_shipments','supply_days', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      0
  - latest_refill_units: >-
      LATEST('cgm_shipments','units', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or 0
  - latest_refill_grant: >-
      LATEST('cgm_shipments','cgm_order_id', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      or ''
  - latest_refill_confirmed: >-
      LATEST('cgm_shipments','refill_confirmed_date', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      or ''
  - refill_on_record: COUNT('cgm_shipments', event_type='cgm_refill_shipment', item_code='A4239') > 0
  - next_delivery_offset: DAYS(NOW, latest_refill_ship) + latest_refill_days - P('refill_ship_lead_days')
  - blocks_per_shipment: P('supply_days_per_shipment') // 30
  - allowance: P('sensor_allowance_units_per_30_days')
  - prior_grant_left: >-
      SUM('cgm_orders','units_authorized', event_type='cgm_authorization_grant', item_code='A4239', cgm_order_id=latest_refill_grant)
      - SUM('cgm_shipments','units', event_type='cgm_refill_shipment', item_code='A4239', cgm_order_id=latest_refill_grant)
  - prior_grant_end_offset: >-
      DAYS(NOW, LATEST('cgm_orders','valid_through', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239',
      cgm_order_id=latest_refill_grant) or NOW)
  - insulin_stopped: >-
      CFIELD('insulin','status') == 'closed' and CFIELD('insulin','closure_reason') == 'customer_discontinued'
  - newest_grant_id: >-
      LATEST('cgm_orders','cgm_order_id', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239')
      or ''
  - newest_grant_left: >-
      SUM('cgm_orders','units_authorized', event_type='cgm_authorization_grant', item_code='A4239', cgm_order_id=newest_grant_id)
      - SUM('cgm_shipments','units', event_type='cgm_refill_shipment', item_code='A4239', cgm_order_id=newest_grant_id)
  - newest_grant_start_offset: >-
      DAYS(NOW, LATEST('cgm_orders','valid_from', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239')
      or NOW)
  - newest_grant_end_offset: >-
      DAYS(NOW, LATEST('cgm_orders','valid_through', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239')
      or NOW)
  - prior_grant_spent: prior_grant_left <= 0 or prior_grant_end_offset < next_delivery_offset + 29
  - newer_grant_covers: >-
      newest_grant_id != latest_refill_grant and newest_grant_start_offset <= next_delivery_offset and newest_grant_end_offset
      >= next_delivery_offset
  - drawn_units_left: >-
      newest_grant_left if prior_grant_spent and newer_grant_covers else (0 if prior_grant_spent and not newer_grant_covers
      else prior_grant_left)
  - drawn_end_offset: newest_grant_end_offset if prior_grant_spent and newer_grant_covers else prior_grant_end_offset
  - program_balance: >-
      SUM('cgm_billing','amount', event_type='cgm_claim_adjudication') + SUM('cgm_billing','amount', event_type='cgm_patient_charge')
      + SUM('cgm_billing','amount', event_type='cgm_patient_refund') - SUM('cgm_billing','amount', event_type='cgm_patient_payment')
      - SUM('cgm_billing','amount', event_type='cgm_balance_adjustment')
  - testing_program_active: EXISTS('bgm', status='active')
  - risk_delivery_blocks: >-
      1 if program_balance > 0 else (MN(2, blocks_per_shipment) if testing_program_active else blocks_per_shipment)
  - listed_basis: >-
      'next_delivery' if refill_on_record and latest_refill_confirmed else ('authorization' if refill_on_record else 'standard_supply')
  - insulin_cover_end_offset: >-
      (DAYS(NOW, XLATEST('insulin','insulin_shipments','ship_date', date_field='ship_date', event_type='insulin_refill_shipment'))
      + XLATEST('insulin','insulin_shipments','supply_days', date_field='ship_date', event_type='insulin_refill_shipment'))
      if XLATEST('insulin','insulin_shipments','ship_date', date_field='ship_date', event_type='insulin_refill_shipment')
      else -9999
  - risk_scope: >-
      'every_unit' if insulin_stopped and insulin_cover_end_offset < next_delivery_offset else ('after_first_block' if insulin_stopped
      and insulin_cover_end_offset >= next_delivery_offset else 'none')
  - insulin_closed_date: (CFIELD('insulin','closed_date') or '9999-12-31') if insulin_stopped else '9999-12-31'
  - prior_notice_date: >-
      LATEST('cgm_orders','notice_date', date_field='notice_date', event_type='cgm_liability_notice_signed', item_code='A4239',
      notice_type='abn_cms_r_131') or ''
  - prior_notice_units: >-
      LATEST('cgm_orders','notice_units', date_field='notice_date', event_type='cgm_liability_notice_signed', item_code='A4239',
      notice_type='abn_cms_r_131') or 0
  - notice_credit: >-
      prior_notice_units if prior_notice_date > latest_refill_ship and prior_notice_date >= insulin_closed_date else (MX(0,
      prior_notice_units - latest_refill_units) if prior_notice_date >= insulin_closed_date and prior_notice_date > '' and
      MONTHS(prior_notice_date, NOW) < 12 else 0)
  - next_delivery_units: >-
      MN(risk_delivery_blocks * allowance, MX(0, (drawn_end_offset - next_delivery_offset + 1) // 30) * allowance, drawn_units_left)
  - listed_units: >-
      next_delivery_units if listed_basis == 'next_delivery' else (drawn_units_left if listed_basis == 'authorization' else
      blocks_per_shipment * allowance)
  - at_risk_units: >-
      listed_units if risk_scope == 'every_unit' else (MX(0, listed_units - allowance) if risk_scope == 'after_first_block'
      else 0)
  - result: int(MX(0, at_risk_units - notice_credit))
