      The listing adjustment replaces what the notice lists by how the program's refills ship: when the latest refill carries
      the customer's refill confirmation date, the notice lists the next delivery; when refills of the item are on record
      but the latest carries no confirmation date, the notice lists every unit left on the grant the next delivery draws on;
      otherwise the standard listing applies.
    insulin_cover_end_offset: >-
      The insulin-record adjustment replaces the expectation that Medicare pays every listed unit: when the customer has stopped
      insulin and the latest insulin refill's supply on the customer's insulin pharmacy program, its ship date plus its supply
      days, ends before the next delivery date, an insulin pharmacy program with no insulin refill on record counting as a
      supply that ended before it, Medicare is expected to deny every listed unit; when the customer has stopped insulin but
      that supply still runs on or after the next delivery date, it is expected to deny the listed units less one 30-day block's
      allowance, never fewer than zero; otherwise the standard expectation applies.
    risk_scope: >-
      The insulin-record adjustment replaces the expectation that Medicare pays every listed unit: when the customer has stopped
      insulin and the latest insulin refill's supply on the customer's insulin pharmacy program, its ship date plus its supply
      days, ends before the next delivery date, an insulin pharmacy program with no insulin refill on record counting as a
      supply that ended before it, Medicare is expected to deny every listed unit; when the customer has stopped insulin but
      that supply still runs on or after the next delivery date, it is expected to deny the listed units less one 30-day block's
      allowance, never fewer than zero; otherwise the standard expectation applies.
    insulin_closed_date: >-
      The prior-notice adjustment takes off the notice the units an earlier advance notice (form CMS-R-131) for the item already
      covers, only when the customer has stopped insulin and the insulin pharmacy program carries a closed date, a liability
      notice of any other type never being credited: when the latest such notice was signed after the latest refill of the
      item shipped and on or after that closed date, its units are taken off; when it was signed on or after that closed date
      but on or before the latest refill shipped, fewer than 12 whole calendar months before today, its units beyond that
      refill's units are taken off; otherwise, and whenever the customer has not stopped insulin or the closed date is not
      recorded, nothing is taken off.
    prior_notice_date: >-
      The prior-notice adjustment takes off the notice the units an earlier advance notice (form CMS-R-131) for the item already
      covers, only when the customer has stopped insulin and the insulin pharmacy program carries a closed date, a liability
      notice of any other type never being credited: when the latest such notice was signed after the latest refill of the
      item shipped and on or after that closed date, its units are taken off; when it was signed on or after that closed date
      but on or before the latest refill shipped, fewer than 12 whole calendar months before today, its units beyond that
      refill's units are taken off; otherwise, and whenever the customer has not stopped insulin or the closed date is not
      recorded, nothing is taken off.
    prior_notice_units: >-
      The prior-notice adjustment takes off the notice the units an earlier advance notice (form CMS-R-131) for the item already
      covers, only when the customer has stopped insulin and the insulin pharmacy program carries a closed date, a liability
      notice of any other type never being credited: when the latest such notice was signed after the latest refill of the
      item shipped and on or after that closed date, its units are taken off; when it was signed on or after that closed date
      but on or before the latest refill shipped, fewer than 12 whole calendar months before today, its units beyond that
      refill's units are taken off; otherwise, and whenever the customer has not stopped insulin or the closed date is not
      recorded, nothing is taken off.
    notice_credit: >-
      The prior-notice adjustment takes off the notice the units an earlier advance notice (form CMS-R-131) for the item already
      covers, only when the customer has stopped insulin and the insulin pharmacy program carries a closed date, a liability
      notice of any other type never being credited: when the latest such notice was signed after the latest refill of the
      item shipped and on or after that closed date, its units are taken off; when it was signed on or after that closed date
      but on or before the latest refill shipped, fewer than 12 whole calendar months before today, its units beyond that
      refill's units are taken off; otherwise, and whenever the customer has not stopped insulin or the closed date is not
      recorded, nothing is taken off.
    next_delivery_units: >-
      The latest refill is the latest refill shipment of the item, read for its ship date, supply days, units, refill confirmation
      date and the authorization grant it drew on; the next delivery date is that refill's ship date plus its supply days
      less the tier's refill lead days; the next delivery draws on the grant the latest refill drew on, its units left being
      the units it authorized less the units of refills of the item drawn on it, and carries the fewest of the tier's standard
      supply blocks times the tier's allowance per 30 days, the whole 30-day blocks from the next delivery date through that
      grant's valid-through date, both days counted, times that allowance, and that grant's units left.
    listed_units: >-
      The notice lists one standard shipment of the item, the 30-day blocks of the tier's standard supply times the tier's
      allowance per 30 days.
    at_risk_units: >-
      The notice covers the listed units Medicare is expected to deny, and Medicare is expected to pay every listed unit.
    result: >-
      Each adjustment set out below changes the standard notice as that adjustment states, in this order: replacements of
      the grant drawn on, the supply blocks and the listing first, then the replacement of the payment expectation applied
      to the units so listed, and units taken off last; the notice covers a whole number of units, never below zero.
  factors:
  - id: drawn_authorization
    effect: >-
      method
    decides: drawn_units_left
    bindings:
    - newest_grant_id
    - newest_grant_left
    - newest_grant_start_offset
    - newest_grant_end_offset
    - prior_grant_spent
    - newer_grant_covers
    - drawn_units_left
    - drawn_end_offset
    ladder:
    - when: >-
        the latest refill's grant has no units left or ends before the next delivery's first block ends, and the newest grant
        (latest valid-through date) is another grant valid on the next delivery date
      method: the newest grant
    - when: >-
        the latest refill's grant is spent that way and the newest grant is not another grant valid on the next delivery date
      method: nothing to draw on, no units
    - when: otherwise
      method: the standard grant
    baseline:
      drawn_units_left: prior_grant_left
      drawn_end_offset: prior_grant_end_offset
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: exposure_limited_delivery
    effect: >-
      parameter
    decides: risk_delivery_blocks
    bindings:
    - program_balance
    - testing_program_active
    - risk_delivery_blocks
    ladder:
    - when: the CGM program carries an unpaid balance above 0.00
      value: one 30-day block
    - when: no unpaid balance and an active testing-supplies program
      value: the fewer of two blocks and the standard supply blocks
    - when: otherwise
      value: the tier's standard supply blocks
    baseline:
      risk_delivery_blocks: blocks_per_shipment
    evidence:
    - history
    - cross_category
    - tier_param
    cross_difficulty: bgm
  - id: listed_delivery_basis
    effect: >-
      method
    decides: listed_basis
    bindings:
    - latest_refill_confirmed
    - refill_on_record
    - listed_basis
    ladder:
    - when: the latest refill carries a refill confirmation date
      method: the next delivery
    - when: refills are on record but the latest carries no confirmation date
      method: every unit left on the grant the next delivery draws on
    - when: otherwise
      method: the standard listing (one standard shipment)
    baseline:
      listed_basis: '''standard_supply'''
    evidence:
    - history
    cross_difficulty: null
  - id: coverage_risk_scope
    effect: >-
      method
    decides: risk_scope
    bindings:
    - insulin_cover_end_offset
    - risk_scope
    ladder:
    - when: >-
        the customer stopped insulin and the latest insulin supply ends before the next delivery date (no insulin refill on
        record counting as ended before it)
      method: every listed unit expected denied
    - when: the customer stopped insulin and that supply runs on or after the next delivery date
      method: the listed units less one block's allowance
    - when: otherwise
      method: the standard expectation (Medicare pays every listed unit)
    baseline:
      risk_scope: '''none'''
    evidence:
    - cross_category
    - date
    cross_difficulty: insulin
  - id: prior_notice_credit
    effect: >-
      parameter
    decides: notice_credit
    bindings:
    - insulin_closed_date
    - prior_notice_date
    - prior_notice_units
    - notice_credit
    ladder:
    - when: >-
        the customer stopped insulin, the pharmacy closed date is recorded, and the latest CMS-R-131 notice was signed after
        the latest refill shipped and on or after that date
      value: its units
    - when: >-
        such a notice signed on or after that closed date, on or before the latest refill, fewer than 12 whole months before
        today
      value: its units beyond that refill's units
    - when: otherwise, or the customer has not stopped insulin, or no closed date is recorded
      value: '0'
    baseline:
      notice_credit: '0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: null
  baseline:
