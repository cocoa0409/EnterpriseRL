    pump_delivery_date: >-
      The pump delivery is the pump delivery date recorded on the customer's insulin pump program, and the over-limit justification
      is the latest medical record on the CGM program with purpose over-limit justification.
    justification_date: >-
      The pump delivery is the pump delivery date recorded on the customer's insulin pump program, and the over-limit justification
      is the latest medical record on the CGM program with purpose over-limit justification.
    latest_refill_delivered: >-
      The ship-timing adjustment replaces the standard earliest permitted ship date: when the customer's insulin pump program
      is not closed and the pump delivery falls after the latest refill shipped and on or before the newest written order's
      date, the latest refill does not count and the delivery may ship today; when the latest refill shipped as expedited_no_charge,
      because Larkfield delayed it, the earliest date is refill_ship_lead_days calendar days before its proof-of-delivery
      date, or its ship date when no proof of delivery is recorded, plus its supply days; otherwise the standard earliest
      date applies.
    earliest_ship_offset: >-
      The ship-timing adjustment replaces the standard earliest permitted ship date: when the customer's insulin pump program
      is not closed and the pump delivery falls after the latest refill shipped and on or before the newest written order's
      date, the latest refill does not count and the delivery may ship today; when the latest refill shipped as expedited_no_charge,
      because Larkfield delayed it, the earliest date is refill_ship_lead_days calendar days before its proof-of-delivery
      date, or its ship date when no proof of delivery is recorded, plus its supply days; otherwise the standard earliest
      date applies.
    hardship_status: >-
      The hardship adjustment takes a posting under a hardship application off the past-due amount: when the latest hardship
      application on the program names a posting and is still awaiting decision, that posting's amount is taken off; when
      it is approved, that posting's amount less the balance adjustments posted against it is taken off; otherwise nothing
      is taken off.
    hardship_excluded: >-
      The hardship adjustment takes a posting under a hardship application off the past-due amount: when the latest hardship
      application on the program names a posting and is still awaiting decision, that posting's amount is taken off; when
      it is approved, that posting's amount less the balance adjustments posted against it is taken off; otherwise nothing
      is taken off.
    early_basis_days: >-
      The early-refill adjustment moves the paid-supply end earlier by the payer's early-refill allowance: when the latest
      refill carried at least one standard shipment's supply days, by one fifth of those days, rounded down; when it carried
      at least 30 but fewer days, by the tier's refill lead days; otherwise it does not move.
    early_refill_days: >-
      The early-refill adjustment moves the paid-supply end earlier by the payer's early-refill allowance: when the latest
      refill carried at least one standard shipment's supply days, by one fifth of those days, rounded down; when it carried
      at least 30 but fewer days, by the tier's refill lead days; otherwise it does not move.
    counting_rule: >-
      The frequency-edit adjustment replaces which blocks of the delivery are at risk against the paid-supply end: when the
      payer paid any amount on the latest refill's claim, every 30-day block that begins before the paid-supply end is at
      risk; when a remittance for that claim posted with no payer payment, only the delivery's first block is at risk, and
      only when the paid-supply end is after today; otherwise the standard at-risk blocks apply.
    exception_mode: >-
      The documented-change adjustment takes at-risk blocks off: when the customer's insulin pump program is not closed, the
      pump delivery falls after the latest refill shipped and the over-limit justification is dated on or after the pump delivery,
      up to the first two at-risk blocks come off, the payer being expected to pay them as the transition to the model the
      pump requires; when the over-limit justification is dated after the latest refill shipped and the pump delivery does
      not fall after it, the first at-risk block comes off, the documented clinical change being expected to be paid for it
      only; otherwise no block comes off.
    listed_scope: >-
      The listing adjustment replaces what the waiver lists: when the delivery draws on a grant other than the one the latest
      refill drew on and the payer authorization has fewer units left than the delivery carries, the waiver lists the units
      at risk and the units beyond the payer authorization, never more than the delivery's units; when refills of the item
      are on record but the latest carries no refill confirmation date, so continued use is not confirmed, the waiver lists
      every unit of the delivery; otherwise the standard listing applies.
    uncovered_past_due: >-
      The delivery ships only when its earliest permitted ship date is not after today and the uncovered past-due amount,
      the past-due amount less the covered amount, is below past_due_hold_min_usd or the tier's past_due_hold_days is 0.
    ship_allowed: >-
      The delivery ships only when its earliest permitted ship date is not after today and the uncovered past-due amount,
      the past-due amount less the covered amount, is below past_due_hold_min_usd or the tier's past_due_hold_days is 0.
    paid_end_offset: >-
      The latest refill is the latest refill shipment of the item, read for its ship date, supply days, billing route and
      claim; its supply counts as paid by the payer for its supply days when it was billed by payer claim, from its ship date,
      and the paid-supply end is its ship date plus those paid supply days; the payer authorization is the grant the latest
      refill drew on, its units left being its units less the units of refills drawn on it, never below zero; the units beyond
      the payer authorization are, when the delivery draws on a grant other than the one the latest refill drew on, the delivery's
      units beyond that authorization's units left, and none otherwise.
    frequency_blocks: >-
      When the paid-supply end is after today, every 30-day block of the delivery is at risk, and the units at risk are the
      at-risk blocks times the tier's allowance per 30 days.
    excepted_blocks: >-
      Each adjustment set out below changes the standard count as that adjustment states, in this order: the earliest ship
      date and the paid-supply end are moved or replaced first, the at-risk blocks are then marked against the paid-supply
      end as moved, blocks are then taken off those at-risk blocks, and the listing replaced last; the waiver covers a whole
      number of units, never below zero, and nothing when the delivery cannot ship today.
    excess_units: >-
      The latest refill is the latest refill shipment of the item, read for its ship date, supply days, billing route and
      claim; its supply counts as paid by the payer for its supply days when it was billed by payer claim, from its ship date,
      and the paid-supply end is its ship date plus those paid supply days; the payer authorization is the grant the latest
      refill drew on, its units left being its units less the units of refills drawn on it, never below zero; the units beyond
      the payer authorization are, when the delivery draws on a grant other than the one the latest refill drew on, the delivery's
      units beyond that authorization's units left, and none otherwise.
    risk_units: >-
      Each adjustment set out below changes the standard count as that adjustment states, in this order: the earliest ship
      date and the paid-supply end are moved or replaced first, the at-risk blocks are then marked against the paid-supply
      end as moved, blocks are then taken off those at-risk blocks, and the listing replaced last; the waiver covers a whole
      number of units, never below zero, and nothing when the delivery cannot ship today.
    listed_units: >-
      Each adjustment set out below changes the standard count as that adjustment states, in this order: the earliest ship
      date and the paid-supply end are moved or replaced first, the at-risk blocks are then marked against the paid-supply
      end as moved, blocks are then taken off those at-risk blocks, and the listing replaced last; the waiver covers a whole
      number of units, never below zero, and nothing when the delivery cannot ship today.
    result: >-
      Each adjustment set out below changes the standard count as that adjustment states, in this order: the earliest ship
      date and the paid-supply end are moved or replaced first, the at-risk blocks are then marked against the paid-supply
      end as moved, blocks are then taken off those at-risk blocks, and the listing replaced last; the waiver covers a whole
      number of units, never below zero, and nothing when the delivery cannot ship today.
  factors:
  - id: waiver_refill_timing
    effect: >-
      method
    decides: earliest_ship_offset
    bindings:
    - latest_refill_delivered
    - earliest_ship_offset
    ladder:
    - when: >-
        the pump program is open and a pump was delivered after the latest refill shipped and on or before the newest order's
        date
      method: the latest refill does not count; the delivery may ship today
    - when: the latest refill shipped as expedited_no_charge
      method: >-
        lead days before its proof-of-delivery date (its ship date when no proof of delivery is recorded) plus its supply
        days
    - when: otherwise
      method: the standard earliest date
    baseline:
      earliest_ship_offset: DAYS(NOW, latest_refill_ship) + latest_refill_days - P('refill_ship_lead_days')
    evidence:
    - cross_category
    - history
    - date
    - tier_param
    cross_difficulty: pump
  - id: waiver_hardship_set_aside
    effect: >-
      parameter
    decides: hardship_excluded
    bindings:
    - hardship_status
    - hardship_excluded
    ladder:
    - when: the latest hardship application names a posting and is awaiting decision
      value: takes that posting's amount off
    - when: it is approved
      value: takes that posting's amount less the adjustments against it off
    - when: otherwise
      value: takes nothing off
    baseline:
      hardship_excluded: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: early_refill_allowance
    effect: >-
      parameter
    decides: early_refill_days
    bindings:
    - early_basis_days
    - early_refill_days
    ladder:
    - when: the latest refill carried at least one standard shipment's supply days
      value: moves the paid-supply end earlier by one fifth of those days, rounded down
    - when: it carried at least 30 but fewer days
      value: moves it earlier by the tier's refill lead days
    - when: otherwise
      value: no move
    baseline:
      early_refill_days: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: frequency_edit_rule
    effect: >-
      method
    decides: counting_rule
    bindings:
    - counting_rule
    ladder:
    - when: the payer paid any amount on the latest refill's claim
      method: every block beginning before the paid-supply end
    - when: a remittance posted with no payer payment
      method: the first block only, when the paid-supply end is after today
    - when: otherwise
      method: the standard at-risk blocks
    baseline:
      counting_rule: '''whole_delivery'''
    evidence:
    - history
    cross_difficulty: null
  - id: documented_change_exception
    effect: >-
      method
    decides: exception_mode
    bindings:
    - exception_mode
    ladder:
    - when: >-
        the pump program is open, the pump delivery falls after the latest refill shipped and the over-limit justification
        is dated on or after it
      method: up to the first two at-risk blocks come off
    - when: >-
        the over-limit justification is dated after the latest refill shipped and the pump delivery does not fall after it
      method: the first at-risk block comes off
    - when: otherwise
      method: no block comes off
    baseline:
      exception_mode: '''none'''
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: pump
  - id: waiver_listing_scope
    effect: >-
      method
    decides: listed_scope
    bindings:
    - listed_scope
    ladder:
    - when: >-
        the delivery draws on a grant other than the latest refill's and the payer authorization has fewer units left than
        the delivery
      method: the units at risk and the units beyond the payer authorization, never more than the delivery
    - when: refills are on record but the latest carries no refill confirmation date
      method: every unit of the delivery
    - when: otherwise
      method: the standard listing (the units at risk)
    baseline:
      listed_scope: '''risk_only'''
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The next delivery draws on the authorization grant resting on the newest written order of the item and carries the fewer
      of the 30-day blocks of one standard shipment and the whole 30-day blocks from today through that grant's valid-through
      date, both days counted, never more than the program's authorized units remaining allow at the tier's allowance per
      30 days; with no such grant it carries nothing. The latest refill is the latest refill shipment of the item, read for
      its ship date, supply days, billing route and claim; its supply counts as paid by the payer for its supply days when
      it was billed by payer claim, from its ship date, and the paid-supply end is its ship date plus those paid supply days;
      the payer authorization is the grant the latest refill drew on, its units left being its units less the units of refills
      drawn on it, never below zero; the units beyond the payer authorization are, when the delivery draws on a grant other
      than the one the latest refill drew on, the delivery's units beyond that authorization's units left, and none otherwise.
      The pump delivery is the pump delivery date recorded on the customer's insulin pump program, and the over-limit justification
      is the latest medical record on the CGM program with purpose over-limit justification. The past-due amount is the remittance
      patient responsibility, patient charges and refunds posted on the program, less those posted fewer than the tier's past_due_hold_days
      divided by 30, rounded down, whole calendar months before today, less every payment and balance adjustment posted on
      it; while an approved payment plan's installments are current, the program's patient payments posted fewer whole calendar
      months before today than one more than the whole calendar months since it was logged, reaching its monthly amount for
      each whole calendar month since it was logged, it covers the past-due remittance patient responsibility left after those
      credits, other than the posting named on the latest hardship application. The earliest permitted ship date is refill_ship_lead_days
      calendar days before the latest refill's ship date plus its supply days. When the paid-supply end is after today, every
      30-day block of the delivery is at risk, and the units at risk are the at-risk blocks times the tier's allowance per
      30 days. The delivery ships only when its earliest permitted ship date is not after today and the uncovered past-due
      amount, the past-due amount less the covered amount, is below past_due_hold_min_usd or the tier's past_due_hold_days
      is 0. The waiver lists the units at risk.
    params:
    - supply_days_per_shipment
    - sensor_allowance_units_per_30_days
    - refill_ship_lead_days
    - past_due_hold_min_usd
  inputs:
    history:
    - table: cgm_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: cgm_refill_shipment
    - table: cgm_billing
      aggregate: sum
      field: amount
      filters: {}
    - table: cgm_orders
      aggregate: latest
      field: visit_date
      filters:
        event_type: cgm_medical_record_receipt
    - table: cgm_requests
      aggregate: latest
      field: request_status
      filters:
        request_type: hardship_application
    cross_category:
    - pump
- id: cgm_ext_payment_plan_installment
  base_policy_refs:
