- id: cgm_evt_refill_shipment
  subject: [cgm_refill_shipment]
  rule: >-
    A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
    or closed receives no refill. Each refill draws on one authorization grant of the program, recorded on the shipment,
    and the ship date must be on or before the valid-through date on the authorization being drawn. The units shipped
    may not exceed the program's authorized units remaining, and the supply days of a shipment are the tier's supply_days_per_shipment,
    shortened to the whole 30-day blocks that remain before the authorization's valid-through date when fewer remain;
    the units and pieces follow from the supply days under cgm_evt_quantity_limits. On tiers where refill_confirmation_required
    is true, the refill ships only after the customer personally confirms, for this shipment, that they are still
    using the item and how much supply they have on hand; the confirmation date is recorded on the shipment, Larkfield
    never ships those tiers automatically, and Larkfield's own refill reminder for those tiers is made no sooner
    than refill_contact_lead_days calendar days before the planned ship date. On the self-pay tier refills ship
    on the subscription schedule without a per-shipment confirmation. The next refill of the same item ships no
    earlier than refill_ship_lead_days calendar days before the end of the supply of the previous refill shipment
    of that item, counted in calendar days: the previous refill's ship date plus its supply days gives the end of
    its supply, the earliest permitted ship date is refill_ship_lead_days calendar days before that end date, and
    shipping on that earliest date is allowed. A replacement shipment never counts as the previous refill. The coverage
    record the program bills must have been verified with the payer within coverage_reverification_months calendar
    months before the ship date, as shown by the coverage record's last verified date; the self-pay tier has no
    coverage to verify. Standard ground shipping is free on insured tiers; on the self-pay tier standard shipping
    costs standard_shipping_fee_usd, posted as a patient charge, unless the shipment's cash-price total reaches
    free_shipping_threshold_usd. Expedited shipping is provided on the customer's request for expedited_shipping_fee_usd,
    posted as a patient charge because no payer covers delivery speed, and is recorded as expedited_no_charge when
    the expedite only makes up for a delay Larkfield caused. A refill on a payer tier is billed to the payer by
    claim with the ship date as the date of service; a refill on the self-pay tier is charged to the customer at
    the Larkfield cash price. On tiers where inpatient_hold_required is true, nothing ships while the customer is
    an inpatient in a hospital or skilled nursing facility; the program is held under cgm_holds_and_closure.
  eligibility:
  - id: program_active
    applies_to: [cgm_refill_shipment]
    kind: state
    condition: >-
      A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
      or closed receives no refill.
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
    state_contract:
      field: cgm_programs.status
      allowed: [active]
  - id: authorization_valid_on_ship_date
    applies_to: [cgm_refill_shipment]
    kind: authorization
    condition: the ship date must be on or before the valid-through date on the authorization being drawn.
    evidence_fields: [cgm_orders.cgm_order_id, cgm_orders.event_type, cgm_orders.valid_from, cgm_orders.valid_through]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_orders.cgm_order_id]
      action_bindings: {cgm_orders.cgm_order_id: cgm_order_id}
  - id: units_within_authorization
    applies_to: [cgm_refill_shipment]
    kind: authorization
    condition: The units shipped may not exceed the program's authorized units remaining
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.authorized_units_remaining]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
  - id: customer_confirmation
    applies_to: [cgm_refill_shipment]
    kind: caller_fact
    condition: >-
      On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms,
      for this shipment, that they are still using the item and how much supply they have on hand
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
  - id: refill_not_too_early
    applies_to: [cgm_refill_shipment]
    kind: time
    condition: >-
      The next refill of the same item ships no earlier than refill_ship_lead_days calendar days before the end
      of the supply of the previous refill shipment of that item
    evidence_fields: [cgm_shipments.cgm_shipment_id, cgm_shipments.ship_date, cgm_shipments.supply_days, cgm_shipments.item_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_shipments.cgm_shipment_id]
      action_bindings: {cgm_shipments.cgm_shipment_id: previous_cgm_shipment_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the end of the supply of the previous refill shipment of that item
      anchor_source: cgm_shipments.ship_date
      relation: not_before
      duration_source: variants.refill_ship_lead_days
      unit: calendar_days
      counting_rule: >-
        the previous refill's ship date plus its supply days gives the end of its supply, the earliest permitted
        ship date is refill_ship_lead_days calendar days before that end date, and shipping on that earliest date
        is allowed.
      boundary: inclusive
  - id: coverage_recently_verified
    applies_to: [cgm_refill_shipment]
    kind: time
    condition: >-
      The coverage record the program bills must have been verified with the payer within coverage_reverification_months
      calendar months before the ship date, as shown by the coverage record's last verified date
    evidence_fields: [coverages.coverage_id, coverages.last_verified_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [coverages.coverage_id]
      action_bindings: {coverages.coverage_id: coverage_id}
    temporal_basis: {clock: frozen_time, anchor_event: the coverage record's last verified date, anchor_source: coverages.last_verified_date,
      relation: not_after, duration_source: variants.coverage_reverification_months, unit: calendar_months, counting_rule: within
        coverage_reverification_months calendar months before the ship date, boundary: inclusive}
  params:
    per_tier:
      CGM Self-Pay Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      CGM Commercial HMO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      CGM Commercial PPO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      CGM Medicare Advantage Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      CGM Original Medicare Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      CGM Medicaid Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
  formula: {earliest_ship_date_offset_days: supply_days - refill_ship_lead_days}
- id: cgm_evt_replacement_and_delivery
  subject: [cgm_replacement_shipment, cgm_delivery_confirmation]
  rule: >-
    A replacement ships at no charge, draws no authorized units and is never billed to a payer; it is recorded against
    the original shipment it replaces, and its quantity never exceeds the units of that original shipment that were
    lost, damaged, not received or defective. A package is lost in transit when no proof of delivery is on file
    for it and carrier_trace_business_days business days (Monday to Friday, excluding US federal holidays) have
    passed after the carrier's expected delivery date; a package lost in transit is always replaced, expedited at
    no charge, and does not count toward any courtesy limit, because Larkfield bears the risk until delivery. A
    package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
    calendar days after the delivery date on the proof of delivery for that package, counted in calendar days from
    that delivery date with the last day allowed; a later damage report is not replaced. A package the proof of
    delivery shows as delivered but the customer reports not received is replaced as a courtesy only while the program's
    courtesy reships over the rolling 12 months ending on the reship date, counted by cgm_msr_courtesy_reships_12m,
    are fewer than courtesy_reships_per_12_months; beyond that the customer may buy the item at the cash price or
    wait for the next eligible refill. A sensor that fails, errors or falls off before the end of its wear period
    is replaced by its manufacturer directly, because supplier_replaces_failed_sensors is false: Larkfield ships
    no replacement for it, the failed sensor does not count against the allowance, and the customer is referred
    to the manufacturer's support line. A receiver or reader that fails within receiver_warranty_months calendar
    months of its delivery date is replaced by its manufacturer under warranty; after the warranty a covered replacement
    receiver ships only under cgm_evt_quantity_limits. Larkfield replaces as product_defect only an item that was
    defective as shipped - the wrong model, an expired or short-dated box, or a manufacturer-recalled lot - reported
    no later than defect_report_days calendar days after the delivery date. A proof of delivery is recorded as received
    from the carrier, with a signature where the tier or item requires signature_required_on_delivery, and it fixes
    the delivery date that return, damage and warranty windows count from; a package without a proof of delivery
    has no delivery date.
  eligibility:
  - id: damage_report_window
    applies_to: [cgm_replacement_shipment]
    kind: time
    condition: >-
      A package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
      calendar days after the delivery date on the proof of delivery for that package
    evidence_fields: [cgm_shipments.original_cgm_shipment_id, cgm_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_shipments.original_cgm_shipment_id]
      action_bindings: {cgm_shipments.original_cgm_shipment_id: original_cgm_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that package,
      anchor_source: cgm_shipments.delivery_date, relation: not_after, duration_source: variants.damage_report_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: courtesy_limit
    applies_to: [cgm_replacement_shipment]
    kind: dedup
    condition: >-
      A package the proof of delivery shows as delivered but the customer reports not received is replaced as a
      courtesy only while the program's courtesy reships over the rolling 12 months ending on the reship date, counted
      by cgm_msr_courtesy_reships_12m, are fewer than courtesy_reships_per_12_months
    evidence_fields: [cgm_shipments.cgm_program_id, cgm_shipments.replacement_reason, cgm_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_shipments.cgm_program_id]
      action_bindings: {cgm_shipments.cgm_program_id: cgm_program_id}
    dedup_contract:
      table: cgm_shipments
      mode: separate_record
      object_bindings: {cgm_program_id: cgm_program_id}
      duplicate_filters:
        replacement_reason: [delivered_not_received]
      distinct_fields: [ship_date]
  params:
    per_tier:
      CGM Self-Pay Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      CGM Commercial HMO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      CGM Commercial PPO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      CGM Medicare Advantage Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      CGM Original Medicare Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      CGM Medicaid Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
  measures: [cgm_msr_courtesy_reships_12m]
- id: cgm_evt_returns
  subject: [cgm_return_authorization, cgm_return_receipt]
  rule: >-
    Larkfield accepts a return only of items that are unopened and in their original sealed packaging; opened medical
    supplies are never returned to stock or credited on any tier where opened_returnable is false, because a supply
    that has left Larkfield's control cannot be re-dispensed to another patient. A return is authorized only when
    the customer asks for it no later than return_window_days calendar days after the delivery date on the proof
    of delivery for that shipment, counted in calendar days from that delivery date with the last day allowed; a
    shipment without a proof of delivery cannot be returned, and a package damaged in transit is handled as a replacement,
    not a return. The units authorized for return never exceed the units of that shipment, less any units of it
    already authorized for return. When the warehouse accepts the returned units as unopened_sealed, the units are
    credited back to the authorization they were drawn from; a payer-billed shipment is then re-billed by a void
    claim (all units returned) or a corrected claim (some units returned), and a self-pay shipment is credited to
    the customer's balance at the price paid for the returned units less restocking_fee_pct percent. Returned units
    the warehouse finds opened are not accepted and no receipt is recorded. A sensor box whose seal is broken, or
    a receiver or reader that has been powered on or paired, is opened and is not returnable.
  eligibility:
  - id: return_window
    applies_to: [cgm_return_authorization]
    kind: time
    condition: >-
      A return is authorized only when the customer asks for it no later than return_window_days calendar days after
      the delivery date on the proof of delivery for that shipment
    evidence_fields: [cgm_shipments.original_cgm_shipment_id, cgm_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_shipments.original_cgm_shipment_id]
      action_bindings: {cgm_shipments.original_cgm_shipment_id: original_cgm_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that shipment,
      anchor_source: cgm_shipments.delivery_date, relation: not_after, duration_source: variants.return_window_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: unopened_only
    applies_to: [cgm_return_authorization]
    kind: caller_fact
    condition: Larkfield accepts a return only of items that are unopened and in their original sealed packaging
    evidence_fields: [cgm_shipments.cgm_shipment_id, cgm_shipments.item_code]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [cgm_shipments.cgm_shipment_id]
      action_bindings: {cgm_shipments.cgm_shipment_id: original_cgm_shipment_id}
  - id: no_double_return
    applies_to: [cgm_return_authorization]
    kind: dedup
    condition: >-
      The units authorized for return never exceed the units of that shipment, less any units of it already authorized
      for return.
    evidence_fields: [cgm_shipments.original_cgm_shipment_id, cgm_shipments.event_type, cgm_shipments.units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_shipments.original_cgm_shipment_id]
      action_bindings: {cgm_shipments.original_cgm_shipment_id: original_cgm_shipment_id}
    dedup_contract:
      table: cgm_shipments
      mode: separate_record
      object_bindings: {original_cgm_shipment_id: original_cgm_shipment_id, item_code: item_code}
      duplicate_filters:
        event_type: [cgm_return_authorization]
      distinct_fields: [rma_issue_date]
  params:
    per_tier:
      CGM Self-Pay Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct, opened_returnable: =opened_returnable}
      CGM Commercial HMO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      CGM Commercial PPO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      CGM Medicare Advantage Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      CGM Original Medicare Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      CGM Medicaid Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct, opened_returnable: =opened_returnable}
- id: cgm_evt_claims
  subject: [cgm_claim_submission, cgm_claim_adjudication]
  rule: >-
    Every refill shipped on a payer tier is billed to the payer named by the program's coverage record by one original
    claim per shipment, with the ship date as the date of service; the self-pay tier files no claims. An original
    claim must be transmitted no later than timely_filing_days calendar days after the date of service of the shipment
    it bills, counted in calendar days from that ship date with the last day allowed; a shipment whose filing limit
    has passed is billed to neither the payer nor the customer and is written off by Larkfield. A corrected claim
    replaces an original claim when the units, item or dates billed were wrong or some of the units were returned,
    and a void claim withdraws an original claim when all of its units were returned; both reference the same shipment
    as the original. When a remittance posts, the patient responsibility added to the customer's balance is the
    allowed amount less the amount the payer paid, which the remittance itemizes as deductible, coinsurance and
    copay; Larkfield never posts more than that and never bills the customer the difference between its billed charge
    and the allowed amount on a payer tier. On tiers where crossover_to_secondary is true and the customer has an
    in-effect secondary coverage record, the patient responsibility is crossed over to the secondary payer, and
    the secondary payer's payment is posted as a balance adjustment with reason secondary_payer_payment against
    that remittance before any amount is statemented; on other tiers a secondary coverage is billed by Larkfield's
    billing team only after the primary remittance posts. On the Medicaid tier a customer is never billed for a
    Medicaid-covered item beyond the patient responsibility the Medicaid remittance shows.
  eligibility:
  - id: timely_filing
    applies_to: [cgm_claim_submission]
    kind: time
    condition: >-
      An original claim must be transmitted no later than timely_filing_days calendar days after the date of service
      of the shipment it bills
    evidence_fields: [cgm_shipments.cgm_shipment_id, cgm_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_shipments.cgm_shipment_id]
      action_bindings: {cgm_shipments.cgm_shipment_id: cgm_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the date of service of the shipment it bills, anchor_source: cgm_shipments.ship_date,
      relation: not_after, duration_source: variants.timely_filing_days, unit: calendar_days, counting_rule: counted
        in calendar days from that ship date with the last day allowed, boundary: inclusive}
  params:
    per_tier:
      CGM Self-Pay Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct, copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd,
        deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      CGM Commercial HMO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct, copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd,
        deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      CGM Commercial PPO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct, copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd,
        deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      CGM Medicare Advantage Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      CGM Original Medicare Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      CGM Medicaid Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct, copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd,
        deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
  formula: {amount: allowed_amount - payer_paid_amount}
- id: cgm_evt_denials_and_appeals
  subject: [cgm_claim_denial, cgm_appeal_filing]
  rule: >-
    A denial is worked by its denial code, and the code alone decides the route; the self-pay tier has no denials
    or appeals. CO-16 (claim lacks information) is unprocessable and is never appealed: it is cured only by a corrected
    claim transmitted no later than corrected_claim_window_days calendar days after the denial's posting date. CO-50
    (not medically necessary), CO-151 (frequency or quantity not supported) and CO-197 (authorization absent) are
    appealable. A first-level appeal may be filed no later than appeal_window_days calendar days after the posting
    date of the denial it appeals, counted in calendar days from that posting date with the last day allowed; a
    CO-197 denial is appealed only when an authorization grant valid on the date of service is on file, and a CO-151
    denial only when a medical record supporting the quantity, dated on or before the date of service, is on file;
    otherwise the denial is not appealed and is handled as a non-covered amount under cgm_liability_notice. An appeal
    decision that upholds the denial posts as a new denial whose original posting is the appeal filing. A second-level
    appeal may be filed only against such an upheld first-level decision, no later than second_level_appeal_window_days
    calendar days after its posting date; where second_level_appeal_window_days is 0 there is no customer-filed
    second level on the tier, and on the Medicare Advantage tier the plan forwards an upheld denial to the independent
    review entity itself. One appeal is filed per level per denial; a denial already appealed at a level is not
    appealed again at that level. CO-29 (timely filing expired) is never appealed and never billed to the customer;
    Larkfield writes it off with a billing_correction adjustment. PR-204 (not covered under the plan) becomes the
    customer's responsibility only under cgm_liability_notice; otherwise Larkfield absorbs it.
  eligibility:
  - id: appeal_window
    applies_to: [cgm_appeal_filing]
    kind: time
    condition: >-
      A first-level appeal may be filed no later than appeal_window_days calendar days after the posting date of
      the denial it appeals
    evidence_fields: [cgm_billing.cgm_ledger_id, cgm_billing.posting_date, cgm_billing.denial_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_billing.cgm_ledger_id]
      action_bindings: {cgm_billing.cgm_ledger_id: original_cgm_ledger_id}
    temporal_basis: {clock: frozen_time, anchor_event: the posting date of the denial it appeals, anchor_source: cgm_billing.posting_date,
      relation: not_after, duration_source: variants.appeal_window_days, unit: calendar_days, counting_rule: counted
        in calendar days from that posting date with the last day allowed, boundary: inclusive}
  - id: one_appeal_per_level
    applies_to: [cgm_appeal_filing]
    kind: dedup
    condition: One appeal is filed per level per denial; a denial already appealed at a level is not appealed again
      at that level.
    evidence_fields: [cgm_billing.original_cgm_ledger_id, cgm_billing.appeal_level, cgm_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_billing.original_cgm_ledger_id]
      action_bindings: {cgm_billing.original_cgm_ledger_id: original_cgm_ledger_id}
    dedup_contract:
      table: cgm_billing
      mode: separate_record
      object_bindings: {original_cgm_ledger_id: original_cgm_ledger_id, appeal_level: appeal_level}
      duplicate_filters:
        event_type: [cgm_appeal_filing]
      distinct_fields: [posting_date]
  params:
    per_tier:
      CGM Self-Pay Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      CGM Commercial HMO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      CGM Commercial PPO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      CGM Medicare Advantage Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      CGM Original Medicare Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      CGM Medicaid Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
- id: cgm_liability_notice
  subject: [cgm_liability_notice_signed, cgm_patient_charge]
  rule: >-
    When an item or quantity the customer wants is expected not to be paid by the payer - above the tier's allowance
    without supporting documentation, an item the tier does not cover, or a replacement before the payer's replacement
    interval - Larkfield supplies it billable to the customer only after the customer signs the tier's liability
    notice (liability_notice_type) for that item and quantity before the ship date; the customer signs it personally,
    and no Larkfield representative can sign it for them. On the Original Medicare tier the notice is the CMS Advance
    Beneficiary Notice of Noncoverage (form CMS-R-131); the claim is still submitted to Medicare with the notice
    on file, and the customer becomes liable only for a line Medicare denies. On the Medicare Advantage tier no
    notice can make the member liable; the member becomes liable only for an item for which the plan has issued
    a pre-service organization determination denial, recorded as a prior authorization denial for that item. On
    the self-pay tier no notice applies, because every item is priced at the Larkfield cash price. A patient charge
    is posted only as one of these charge types: self_pay_price (a self-pay refill at the cash price), standard_shipping
    (a self-pay shipment below the free-shipping threshold), expedited_shipping (a customer-requested expedite),
    or non_covered_item (an item or quantity covered by a signed liability notice, or by a Medicare Advantage organization
    determination denial, that the payer denied, charged at the Larkfield cash price of the units concerned). A
    non_covered_item charge requires a liability notice signed on or before the ship date covering that item and
    at least those units, or on the Medicare Advantage tier the plan's organization determination denial for that
    item; without it the amount is Larkfield's write-off and is never billed to the customer.
  eligibility:
  - id: notice_before_charge
    applies_to: [cgm_patient_charge]
    kind: authorization
    condition: >-
      A non_covered_item charge requires a liability notice signed on or before the ship date covering that item
      and at least those units, or on the Medicare Advantage tier the plan's organization determination denial for
      that item
    evidence_fields: [cgm_orders.cgm_program_id, cgm_orders.item_code, cgm_orders.event_type, cgm_orders.notice_date,
      cgm_orders.notice_units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_orders.cgm_program_id, cgm_orders.item_code]
      action_bindings: {cgm_orders.cgm_program_id: cgm_program_id, cgm_orders.item_code: item_code}
  - id: customer_signs
    applies_to: [cgm_liability_notice_signed]
    kind: caller_fact
    condition: the customer signs it personally, and no Larkfield representative can sign it for them.
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
  params:
    per_tier:
      CGM Self-Pay Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      CGM Commercial HMO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      CGM Commercial PPO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      CGM Medicare Advantage Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      CGM Original Medicare Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      CGM Medicaid Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
- id: cgm_evt_patient_account
  subject: [cgm_patient_payment, cgm_balance_adjustment, cgm_patient_refund]
  rule: >-
    The customer's balance on the program is the running total of its patient-balance postings: remittance patient
    responsibility, patient charges and refunds add to it, and payments and balance adjustments reduce it; a payment
    is applied to the oldest unpaid posting first. A balance adjustment is posted only for one of these reasons,
    each against the one posting it adjusts and never for more than that posting's unpaid remainder: return_credit
    (an accepted self-pay return, for the price paid for the returned units less restocking_fee_pct percent); secondary_payer_payment
    (the amount a secondary payer paid against a remittance's patient responsibility); hardship_waiver; small_balance_writeoff;
    billing_correction (a posting made in error, or a timely-filing write-off). A hardship waiver is granted only
    on tiers where hardship_waiver_allowed is true, only for postings named on a hardship application whose request
    status is approved, and only after Larkfield's financial counseling team confirms household income at or below
    hardship_income_fpl_pct percent of the HHS poverty guideline; it is never granted routinely, never advertised
    and never granted on the customer's statement alone. A small-balance write-off is made only when the whole remaining
    balance of the program is greater than 0.00 and no more than small_balance_writeoff_usd; on tiers where small_balance_writeoff_usd
    is 0.00 no write-off is made and the balance is statemented. A credit balance - a balance below zero - is refunded
    to the original payment method no later than credit_balance_refund_days calendar days after the posting date
    of the entry that created it, unless the customer asks in writing to keep it on account; a refund never exceeds
    the credit. A payment plan is offered only on tiers where payment_plan_max_months is greater than 0, for a balance
    of at least payment_plan_min_balance_usd, in no more than payment_plan_max_months monthly installments of at
    least payment_plan_min_monthly_usd; it is created as a payment plan request the customer accepts, and while
    an approved plan's installments are current the balance it covers is left out of the past-due test measured
    by cgm_msr_past_due_amount.
  eligibility:
  - id: hardship_approved
    applies_to: [cgm_balance_adjustment]
    kind: authorization
    condition: >-
      A hardship waiver is granted only on tiers where hardship_waiver_allowed is true, only for postings named
      on a hardship application whose request status is approved
    evidence_fields: [cgm_requests.cgm_request_id, cgm_requests.request_type, cgm_requests.request_status, cgm_requests.cgm_ledger_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_requests.cgm_ledger_id]
      action_bindings: {cgm_requests.cgm_ledger_id: original_cgm_ledger_id}
  - id: small_balance_ceiling
    applies_to: [cgm_balance_adjustment]
    kind: authorization
    condition: >-
      A small-balance write-off is made only when the whole remaining balance of the program is greater than 0.00
      and no more than small_balance_writeoff_usd
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.patient_balance_due]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
  params:
    per_tier:
      CGM Self-Pay Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      CGM Commercial HMO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      CGM Commercial PPO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      CGM Medicare Advantage Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      CGM Original Medicare Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      CGM Medicaid Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
  measures: [cgm_msr_past_due_amount]
- id: cgm_holds_and_closure
  subject: [cgm_program_hold, cgm_program_resume, cgm_program_administrative_close]
  rule: >-
    An active program is placed on hold for exactly one recorded reason: inpatient_stay (the customer or caregiver
    reports a current inpatient admission to a hospital or skilled nursing facility, on tiers where inpatient_hold_required
    is true); coverage_lapse (the coverage record the program bills has a termination date earlier than the date
    of the write and no other in-effect coverage on file fixes the program's tier); documentation_lapse (no authorization
    grant of the program is valid on the date of the write); past_due_balance (on tiers where past_due_hold_days
    is greater than 0, the past-due amount measured by cgm_msr_past_due_amount is at least past_due_hold_min_usd
    and no approved payment plan covers it); or customer_request (the customer asks to pause shipments). A hold
    is placed only for a reason that is true on the date of the write. A program on hold resumes only when its recorded
    hold reason has cleared: discharge reported for inpatient_stay; an in-effect coverage on file and written onto
    the program for coverage_lapse; an authorization grant valid on the date of the write for documentation_lapse;
    a past-due amount below past_due_hold_min_usd or an approved payment plan for past_due_balance; the customer's
    own request for customer_request. A program closes administratively, with the matching closure reason, in exactly
    these cases: documentation_not_received, for a program still in referral_received or pending_authorization once
    the date of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior
    authorization decision pending; authorization_denied, when a payer prior authorization denial stands and no
    new request is pending; hold_limit_reached, for a program on hold once the date of the write is later than the
    hold start date plus hold_max_days calendar days; coverage_ended, for a program on hold for coverage_lapse whose
    customer reports no replacement coverage; customer_discontinued, when the customer confirms the cancellation
    of a program on hold; deceased, when Larkfield's records team has recorded the customer's death. Day counts
    in this policy are calendar days counted from the named date, and a closure is made only on a day strictly later
    than the named date plus the stated days.
  eligibility:
  - id: inpatient_reported
    applies_to: [cgm_program_hold]
    kind: caller_fact
    condition: >-
      the customer or caregiver reports a current inpatient admission to a hospital or skilled nursing facility,
      on tiers where inpatient_hold_required is true
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.variant_name]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
  - id: hold_reason_true
    applies_to: [cgm_program_hold]
    kind: authorization
    condition: A hold is placed only for a reason that is true on the date of the write.
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.coverage_id, coverages.termination_date, cgm_orders.valid_through,
      cgm_programs.patient_balance_due]
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
  - id: hold_limit_elapsed
    applies_to: [cgm_program_administrative_close]
    kind: time
    condition: >-
      hold_limit_reached, for a program on hold once the date of the write is later than the hold start date plus
      hold_max_days calendar days
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.hold_start_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold start date
      anchor_source: cgm_programs.hold_start_date
      relation: not_before
      duration_source: variants.hold_max_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  - id: referral_window_elapsed
    applies_to: [cgm_program_administrative_close]
    kind: time
    condition: >-
      documentation_not_received, for a program still in referral_received or pending_authorization once the date
      of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior authorization
      decision pending
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.enrolled_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrolled date
      anchor_source: cgm_programs.enrolled_date
      relation: not_before
      duration_source: variants.referral_docs_window_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  params:
    per_tier:
      CGM Self-Pay Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      CGM Commercial HMO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      CGM Commercial PPO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      CGM Medicare Advantage Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      CGM Original Medicare Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      CGM Medicaid Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
  measures: [cgm_msr_past_due_amount]
- id: cgm_discontinuation
  subject: [cgm_program_discontinue]
  rule: >-
    Only the customer can end an active program: Larkfield records the cancellation as a program cancellation request,
    and the program closes only when the customer personally confirms that request. A confirmed cancellation closes
    the program with closure_reason customer_discontinued, or changed_supplier when the customer states they are
    moving these supplies to another supplier; a cancellation of a program on hold is closed under cgm_holds_and_closure.
    Ending a program carries no fee and cancels nothing the customer already owes: the balance stays payable, credit
    balances are still refunded under cgm_evt_patient_account, and unopened items delivered within the return window
    stay returnable under cgm_evt_returns. Authorized units remaining on a closed program lapse and are never shipped;
    a later restart needs a new referral and a new program. A package already shipped is not recalled.
  eligibility:
  - id: cancellation_confirmed
    applies_to: [cgm_program_discontinue]
    kind: authorization
    condition: >-
      Larkfield records the cancellation as a program cancellation request, and the program closes only when the
      customer personally confirms that request.
    evidence_fields: [cgm_requests.cgm_request_id, cgm_requests.cgm_program_id, cgm_requests.request_type, cgm_requests.request_status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_requests.cgm_program_id]
      action_bindings: {cgm_requests.cgm_program_id: cgm_program_id}
- id: cgm_agg_multi_holding
  subject: [cgm_program_enroll]
  rule: >-
    A customer holds at most max_per_customer CGM program at a time across every tier, because a payer pays one
    CGM supply allowance per beneficiary per month. A new CGM program is opened only when the customer has no CGM
    program in referral_received, pending_authorization, active or on_hold; a new referral, a new model or a new
    insurance for a customer with such a program is written as a program change on that program, and a closed program
    does not count.
  eligibility:
  - id: one_open_program
    applies_to: [cgm_program_enroll]
    kind: dedup
    condition: >-
      A new CGM program is opened only when the customer has no CGM program in referral_received, pending_authorization,
      active or on_hold
    evidence_fields: [cgm_programs.customer_id, cgm_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.customer_id]
      action_bindings: {cgm_programs.customer_id: customer_id}
    dedup_contract:
      table: cgm_programs
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [referral_received, pending_authorization, active, on_hold]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: cgm_evt_quantity_limits
  subject: [cgm_refill_shipment, cgm_replacement_shipment]
  rule: >-
    A sensor refill (A4239) ships sensor_allowance_units_per_30_days billing unit for every 30 days of supply, so
    its units are its supply days divided by 30 times that figure, and its pieces are the supply days divided by
    30 times the sensors the program's CGM model uses per 30 days (sensors_per_30_days_by_model); a Dexcom G6 program
    also receives one transmitter for every g6_transmitter_replacement_days days of supply inside the same allowance,
    and no other model receives a transmitter. The sensors shipped follow the CGM model on the program, never a
    model the customer names that is not on the newest written order. A receiver or reader (E2103) ships as one
    billing unit and only on tiers where receiver_covered is true, and a covered replacement receiver ships no earlier
    than receiver_replacement_months calendar months after the ship date of the previous receiver recorded on the
    program, counted in calendar months from that ship date with the same calendar day allowed (the last day of
    the month when that day does not exist); within receiver_warranty_months of the previous receiver's delivery
    a failed receiver is the manufacturer's warranty replacement instead. A customer who uses the smartphone app
    receives no receiver, and a receiver on a tier where receiver_covered is false, or one requested before the
    replacement interval, is supplied only at receiver_cash_price_by_model under cgm_liability_notice. On the self-pay
    tier the refill is charged at cash_price_30_day_by_model for the program's model per 30 days of supply. A replacement
    never exceeds the units and pieces of the shipment it replaces.
  eligibility:
  - id: receiver_interval
    applies_to: [cgm_refill_shipment]
    kind: time
    condition: >-
      a covered replacement receiver ships no earlier than receiver_replacement_months calendar months after the
      ship date of the previous receiver recorded on the program
    evidence_fields: [cgm_programs.cgm_program_id, cgm_programs.receiver_ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.cgm_program_id]
      action_bindings: {cgm_programs.cgm_program_id: cgm_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the ship date of the previous receiver recorded on the program
      anchor_source: cgm_programs.receiver_ship_date
      relation: not_before
      duration_source: variants.receiver_replacement_months
      unit: calendar_months
      counting_rule: >-
        counted in calendar months from that ship date with the same calendar day allowed (the last day of the month
        when that day does not exist)
      boundary: inclusive
  params:
    per_tier:
      CGM Self-Pay Program: {receiver_covered: =receiver_covered, receiver_replacement_months: =receiver_replacement_months,
        supply_days_per_shipment: =supply_days_per_shipment}
      CGM Commercial HMO Program: {receiver_covered: =receiver_covered, receiver_replacement_months: =receiver_replacement_months,
        supply_days_per_shipment: =supply_days_per_shipment}
      CGM Commercial PPO Program: {receiver_covered: =receiver_covered, receiver_replacement_months: =receiver_replacement_months,
        supply_days_per_shipment: =supply_days_per_shipment}
      CGM Medicare Advantage Program: {receiver_covered: =receiver_covered, receiver_replacement_months: =receiver_replacement_months,
        supply_days_per_shipment: =supply_days_per_shipment}
      CGM Original Medicare Program: {receiver_covered: =receiver_covered, receiver_replacement_months: =receiver_replacement_months,
        supply_days_per_shipment: =supply_days_per_shipment}
      CGM Medicaid Program: {receiver_covered: =receiver_covered, receiver_replacement_months: =receiver_replacement_months,
        supply_days_per_shipment: =supply_days_per_shipment}
  formula: {when: item_code == "A4239", units: supply_days / 30 * sensor_allowance_units_per_30_days}
- id: cgm_continued_coverage_visits
  subject: [cgm_authorization_grant, cgm_refill_shipment, cgm_medical_record_receipt]
  rule: >-
    On tiers where initial_visit_lookback_months is greater than 0, the first authorization grant of a CGM program
    is recorded only when a medical record with purpose initial_qualification documents an in-person or telehealth
    visit with the treating practitioner dated no more than initial_visit_lookback_months calendar months before
    the order date of the written order it rests on. On tiers where followup_visit_interval_months is greater than
    0, a refill ships only when the most recent visit date on the program's medical records with purpose continued_need_followup
    or initial_qualification is no more than followup_visit_interval_months calendar months before the ship date,
    counted in calendar months back from the ship date with the same calendar day allowed (the last day of the month
    when that day does not exist); the visit documents that the customer is using the CGM and following the diabetes
    treatment plan. A missing or out-of-date follow-up visit is not cured by the customer's statement that a visit
    took place: Larkfield requests the visit note from the practitioner and records it when received, and until
    then the refill does not ship and the program may be held for documentation_lapse under cgm_holds_and_closure
    only when its authorization has also lapsed. On the self-pay tier no visit requirement applies.
  eligibility:
  - id: initial_visit_on_file
    applies_to: [cgm_authorization_grant]
    kind: authorization
    condition: >-
      On tiers where initial_visit_lookback_months is greater than 0, the first authorization grant of a CGM program
      is recorded only when a medical record with purpose initial_qualification documents an in-person or telehealth
      visit with the treating practitioner dated no more than initial_visit_lookback_months calendar months before
      the order date of the written order it rests on.
    evidence_fields: [cgm_orders.cgm_program_id, cgm_orders.record_purpose, cgm_orders.visit_date, cgm_orders.order_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_orders.cgm_program_id]
      action_bindings: {cgm_orders.cgm_program_id: cgm_program_id}
  - id: followup_visit_current
    applies_to: [cgm_refill_shipment]
    kind: time
    condition: >-
      On tiers where followup_visit_interval_months is greater than 0, a refill ships only when the most recent
      visit date on the program's medical records with purpose continued_need_followup or initial_qualification
      is no more than followup_visit_interval_months calendar months before the ship date
    evidence_fields: [cgm_orders.cgm_program_id, cgm_orders.record_purpose, cgm_orders.visit_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_orders.cgm_program_id]
      action_bindings: {cgm_orders.cgm_program_id: cgm_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: >-
        the most recent visit date on the program's medical records with purpose continued_need_followup or initial_qualification
      anchor_source: cgm_orders.visit_date
      relation: not_after
      duration_source: variants.followup_visit_interval_months
      unit: calendar_months
      counting_rule: >-
        counted in calendar months back from the ship date with the same calendar day allowed (the last day of the
        month when that day does not exist)
      boundary: inclusive
  params:
    per_tier:
      CGM Self-Pay Program: {initial_visit_lookback_months: =initial_visit_lookback_months, followup_visit_interval_months: =followup_visit_interval_months}
      CGM Commercial HMO Program: {initial_visit_lookback_months: =initial_visit_lookback_months, followup_visit_interval_months: =followup_visit_interval_months}
      CGM Commercial PPO Program: {initial_visit_lookback_months: =initial_visit_lookback_months, followup_visit_interval_months: =followup_visit_interval_months}
      CGM Medicare Advantage Program: {initial_visit_lookback_months: =initial_visit_lookback_months, followup_visit_interval_months: =followup_visit_interval_months}
      CGM Original Medicare Program: {initial_visit_lookback_months: =initial_visit_lookback_months, followup_visit_interval_months: =followup_visit_interval_months}
      CGM Medicaid Program: {initial_visit_lookback_months: =initial_visit_lookback_months, followup_visit_interval_months: =followup_visit_interval_months}
- id: cgm_combo_pump_compatibility
  subject: [cgm_program_enroll, cgm_program_change, cgm_refill_shipment]
  rule: >-
    Holding an insulin pump program changes what the CGM program may carry. When the customer holds a pump program
    that is not closed, the CGM model written on the CGM program must be one that pump model accepts under pump_cgm_compatibility,
    so that the pump's automated insulin delivery keeps its sensor source; a model change to a model the pump does
    not accept is not made, and the customer is told the prescriber must order a compatible model. A customer whose
    pump program that is not closed is on a pump whose compatibility list is empty (the MiniMed 780G) receives that
    manufacturer's sensors under the pump program, and a CGM program sensor refill (A4239) is not shipped to that
    customer, because a payer pays only one CGM supply allowance per month; the CGM program may be discontinued
    by the customer or held at the customer's request. A customer with no pump program, or whose pump program is
    closed, may hold any model the written order names.
  eligibility:
  - id: no_duplicate_sensor_source
    applies_to: [cgm_refill_shipment]
    kind: authorization
    condition: >-
      A customer whose pump program that is not closed is on a pump whose compatibility list is empty (the MiniMed
      780G) receives that manufacturer's sensors under the pump program, and a CGM program sensor refill (A4239)
      is not shipped to that customer
    evidence_fields: [pump_programs.customer_id, pump_programs.pump_model, pump_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.customer_id]
      action_bindings: {pump_programs.customer_id: customer_id}
  - id: compatible_model
    applies_to: [cgm_program_enroll, cgm_program_change]
    kind: authorization
    condition: >-
      When the customer holds a pump program that is not closed, the CGM model written on the CGM program must be
      one that pump model accepts under pump_cgm_compatibility
    evidence_fields: [pump_programs.customer_id, pump_programs.pump_model, pump_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pump_programs.customer_id]
      action_bindings: {pump_programs.customer_id: customer_id}
  params: {pump_cgm_compatibility: =pump_cgm_compatibility}
extended_policies:
- id: cgm_ext_renewal_authorization_units
  base_policy_refs:
  - cgm_documentation_and_authorization
  - cgm_continued_coverage_visits
  - cgm_evt_refill_shipment
  overwrite:
  - base_policy: cgm_documentation_and_authorization
    superseded_clause: >-
      On tiers where prior_auth_required is false, Larkfield records the authorization grant itself on the basis of the written
      order (basis written_order, or self_pay_order on the self-pay tier), valid from the order date through the order's valid-through
      date, for the billing units the order covers within that span.
    replaced_by: >-
      For such a renewal, and only for such a renewal, Larkfield still records the grant on the basis of the written order,
      valid from the order date through the order's valid-through date, but it carries the billing units counted under this
      policy in place of the billing units the order covers within that span; every other authorization grant remains under
      the base rule.
  trigger: state_due
  subject:
  - cgm_authorization_grant
  computes: units_authorized
  target_tool: record_order_authorization_630fe26e
  params: {}
  rule: >-
    This policy counts the billing units Larkfield records on the authorization grant it writes from a renewal written order
    for the CGM supply allowance (A4239) on the Original Medicare tier, the tier on which Larkfield records the grant itself
    from the order. For such a renewal, and only for such a renewal, Larkfield still records the grant on the basis of the
    written order, valid from the order date through the order's valid-through date, but it carries the billing units counted
    under this policy in place of the billing units the order covers within that span; every other authorization grant remains
    under the base rule. The standard grant carries the order's billing units per 30 days times the whole 30-day blocks from
    the order date through the order's valid-through date, both days counted, and is anchored to the order date; the order
    is the newest written order of the item on the program. When the customer has stopped insulin, that is when the customer's
    insulin pharmacy program is closed with closure reason customer_discontinued, and the CGM program documents an insulin
    regimen (multiple daily injections, an insulin pump or basal insulin only), the grant's counted blocks, the blocks of
    its span, never exceed the months left of a coverage review, blocks added on top of the span not counting toward that
    limit: the review length is the 30-day blocks of one standard shipment, in months; the review starts on the later of the
    review visit, the latest visit on the program's medical records with purpose continued-need follow-up or initial qualification
    by any practitioner, and the regimen change date, the ship date of the latest insulin refill on the customer's insulin
    pharmacy program, either date counting as earlier than every record when no such record exists; and the months left are
    the review length less the whole calendar months from the review start to the grant's anchor date, counted as zero when
    the review start falls after the anchor date, and never below zero. The grant still valid on the order date is the authorization
    grant of the item with the latest valid-through date when that date is on or after the order date; the latest refill is
    the latest refill shipment of the item, read for its ship date and supply days, and with no refill on record its ship
    date counts as the order date and its supply days as 0. Whole calendar months from one date to a later date are the difference
    in calendar months between them, less one when the later date's calendar day is earlier than the earlier date's calendar
    day. Each adjustment set out below changes the standard grant as that adjustment states, in this order: replacements of
    a standard quantity are applied first, so the span's blocks and the anchor date are those as replaced; the coverage-review
    limit is then applied to the span's blocks so replaced, counting the months left to the anchor date so replaced; blocks
    added on top of the span come last and are not limited by the coverage review; the blocks are settled before they are
    multiplied by the units per 30 days, and the grant then carries a whole number of units. The block-start adjustment replaces
    the standard blocks and anchor: when a grant of the item is still valid on the order date, the blocks are counted from
    the day after that grant's valid-through date through the order's valid-through date, and the grant is anchored to that
    valid-through date; when no grant is still valid but the latest refill's supply, its ship date plus its supply days, runs
    past the order date, the blocks are counted from the end of that supply through the order's valid-through date, both days
    counted, the grant staying anchored to the order date; otherwise the standard blocks and anchor apply. The quantity-reading
    adjustment replaces the order's units per 30 days by the convention the prescriber used: when the order states exactly
    the tier's allowance per 30 days times the 30-day blocks of one standard shipment, it is a per-shipment count and the
    units per 30 days are that quantity divided by those blocks; when it states any other quantity above the tier's allowance
    per 30 days, the quantity cannot be read and the grant carries no units until the prescriber corrects the order; otherwise
    the order's quantity as written applies. The review-length adjustment replaces the standard review length from the customer's
    insulin record: when the customer's insulin pharmacy program closed the tier's follow-up visit interval or more whole
    calendar months before the order date, the review length is 0 months; when the latest insulin refill on that program,
    its ship date plus its supply days, ended on or before the order date, an insulin pharmacy program with no insulin refill
    on record counting as ended on the order date, the review length is the tier's follow-up visit interval in months; otherwise
    the standard review length applies. The review-visit adjustment replaces the standard review visit by practitioner: when
    the program's treating prescriber has a visit on the program's medical records with purpose continued-need follow-up or
    initial qualification, the review visit is that prescriber's latest such visit; when the treating prescriber has none
    but the practitioner who signed the order has one, it is the signer's latest such visit; otherwise the standard review
    visit applies. The regimen-change adjustment replaces the standard regimen change date from the customer's testing-supplies
    record: when the customer's testing-supplies program documents non-insulin treatment and has a written order on file,
    the regimen change date is that program's newest written order date; when it documents non-insulin treatment with no written
    order on file, it is the date that program was activated; otherwise the standard regimen change date applies. The bridge
    adjustment adds blocks for a refill due while the grant still valid on the order date is in force, the next refill date
    being the latest refill's ship date plus its supply days less the tier's refill lead days and that grant's units left
    being the units the grants of the item authorized less the units of refills of the item, plus units of the item accepted
    back on returns: when that grant has no units left and the next refill date falls on or before its valid-through date,
    it adds the whole 30-day blocks from the next refill date through that valid-through date, both days counted; when it
    still has units left and the next refill date falls on or before its valid-through date, it adds those whole blocks less
    the units left, never below zero; otherwise it adds no blocks.
  prerequisite: []
  cross_category:
  - category: insulin
    as: history
    reads:
    - status
    - closure_reason
    - closed_date
    - insulin_shipments.ship_date
    - insulin_shipments.supply_days
    note: >-
      the standard coverage review and coverage_review_length read the insulin pharmacy status, closure reason, closed date
      and latest insulin refill
  - category: bgm
    as: branch
    reads:
    - treatment_class
    - activated_date
    - bgm_orders.order_date
    note: >-
      regimen_change_record reads the testing-supplies treatment class, activation date and newest written order date
  compute:
  - order_date: >-
      LATEST('cgm_orders','order_date', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239')
  - order_valid_through: >-
      LATEST('cgm_orders','valid_through', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239')
  - previous_valid_through: >-
      LATEST('cgm_orders','valid_through', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239')
      or '0000-00-00'
  - previous_still_valid: previous_valid_through >= order_date
  - latest_refill_ship: >-
      LATEST('cgm_shipments','ship_date', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      order_date
  - latest_refill_days: >-
      LATEST('cgm_shipments','supply_days', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      0
  - blocks_per_shipment: P('supply_days_per_shipment') // 30
  - insulin_stopped: >-
      CFIELD('insulin','status') == 'closed' and CFIELD('insulin','closure_reason') == 'customer_discontinued'
  - insulin_regimen_on_file: >-
      F('insulin_regimen') == 'multiple_daily_injections' or F('insulin_regimen') == 'insulin_pump' or F('insulin_regimen')
      == 'basal_insulin_only'
  - review_applies: insulin_stopped and insulin_regimen_on_file
  - span_blocks: >-
      (DAYS(previous_valid_through, order_valid_through)) // 30 if previous_still_valid else ((DAYS(order_date, order_valid_through)
      + 1 - (DAYS(order_date, latest_refill_ship) + latest_refill_days)) // 30 if DAYS(order_date, latest_refill_ship) + latest_refill_days
      > 0 else (DAYS(order_date, order_valid_through) + 1) // 30)
  - review_anchor_date: previous_valid_through if previous_still_valid else order_date
  - order_quantity: >-
      LATEST('cgm_orders','quantity_per_30_days', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239')
  - allowance: P('sensor_allowance_units_per_30_days')
  - units_per_block: >-
      order_quantity // blocks_per_shipment if order_quantity > allowance and order_quantity == allowance * blocks_per_shipment
      else (0 if order_quantity > allowance else order_quantity)
  - insulin_supply_end_offset: >-
      (DAYS(order_date, XLATEST('insulin','insulin_shipments','ship_date', date_field='ship_date', event_type='insulin_refill_shipment'))
      + XLATEST('insulin','insulin_shipments','supply_days', date_field='ship_date', event_type='insulin_refill_shipment'))
      if XLATEST('insulin','insulin_shipments','ship_date', date_field='ship_date', event_type='insulin_refill_shipment')
      else 0
  - insulin_closed_date: CFIELD('insulin','closed_date') or '9999-12-31'
  - review_length_months: >-
      0 if MONTHS(insulin_closed_date, order_date) >= P('followup_visit_interval_months') else (P('followup_visit_interval_months')
      if insulin_supply_end_offset <= 0 else blocks_per_shipment)
  - order_signer: >-
      LATEST('cgm_orders','prescriber_npi', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239')
  - treating_visits: >-
      COUNT('cgm_orders', event_type='cgm_medical_record_receipt', record_purpose='continued_need_followup', prescriber_npi=F('prescriber_npi'))
      + COUNT('cgm_orders', event_type='cgm_medical_record_receipt', record_purpose='initial_qualification', prescriber_npi=F('prescriber_npi'))
  - signer_visits: >-
      COUNT('cgm_orders', event_type='cgm_medical_record_receipt', record_purpose='continued_need_followup', prescriber_npi=order_signer)
      + COUNT('cgm_orders', event_type='cgm_medical_record_receipt', record_purpose='initial_qualification', prescriber_npi=order_signer)
  - review_visit_date: >-
      MX((LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt', record_purpose='continued_need_followup',
      prescriber_npi=F('prescriber_npi')) or '0000-00-00'), (LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt',
      record_purpose='initial_qualification', prescriber_npi=F('prescriber_npi')) or '0000-00-00')) if treating_visits > 0
