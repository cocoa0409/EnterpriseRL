      units left being the units the grants of the item authorized less the units of refills of the item, plus units of the
      item accepted back on returns: when that grant has no units left and the next refill date falls on or before its valid-through
      date, it adds the whole 30-day blocks from the next refill date through that valid-through date, both days counted;
      when it still has units left and the next refill date falls on or before its valid-through date, it adds those whole
      blocks less the units left, never below zero; otherwise it adds no blocks.
    next_refill_offset: >-
