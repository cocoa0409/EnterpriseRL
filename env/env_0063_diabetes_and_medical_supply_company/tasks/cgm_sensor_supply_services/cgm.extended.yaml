  trigger: state_due
  subject:
  - cgm_patient_payment
  computes: monthly_amount_usd
  target_tool: accept_payment_plan_9d194c19
  params: {}
  rule: >-
    This policy prices the monthly installment of an interest-free payment plan the customer accepts on a CGM program whose
    tier offers payment plans. A payment plan is offered only on tiers where payment_plan_max_months is greater than 0, for
    a balance of at least payment_plan_min_balance_usd, in no more than payment_plan_max_months monthly installments of at
    least payment_plan_min_monthly_usd; it is created as a payment plan request the customer accepts, and while an approved
    plan's installments are current the balance it covers is left out of the past-due test measured by cgm_msr_past_due_amount;
    for a plan this policy prices, and only for such a plan, the balance it covers is the plan balance this policy counts,
    while every other plan covers the program's own balance. A plan this policy prices runs for the tier's payment_plan_max_months
    monthly installments. The program's unpaid balance is the remittance patient responsibility, patient charges and refunds
    posted on it less the payments and balance adjustments posted on it; recent postings are those posted less than one whole
    calendar month before today; the customer's insulin pump program bills the same coverage record when it is not closed
    and its coverage record is the one the CGM program bills. The plan balance is the program's unpaid balance, never below
    zero, rounded to the nearest cent, a half cent going to the even cent, and each installment is the plan balance divided
    by the installments, rounded to the nearest cent, a half cent going to the even cent. Whole calendar months from one date
    to a later date are the difference in calendar months between them, less one when the later date's calendar day is earlier
    than the earlier date's calendar day. Each adjustment set out below changes the standard plan balance or installment as
    that adjustment states, in this order: amounts taken off another program's postings come off only the amount added from
    that program, never taking it below zero, every other addition and deduction is then applied to the plan balance, and
    the installment is figured and rounded last; no plan is priced, and the installment is 0.00, when the adjusted plan balance
    is below payment_plan_min_balance_usd or the installment would be below payment_plan_min_monthly_usd; amounts are in USD
    with 2 decimal places. The hardship adjustment takes a posting under a hardship application off the plan balance: when
    the latest hardship application on the program names a posting and is still awaiting decision, that posting's amount is
    taken off; when it is approved, that posting's amount less the balance adjustments posted against it is taken off; otherwise
    nothing is taken off. The delivery-charge adjustment takes charges for delivery off the plan balance: when the program
    carries expedited shipping charges, their total is taken off; when it carries no expedited shipping charge but carries
    standard shipping charges, their total is taken off; otherwise nothing is taken off. The statement adjustment takes postings
    not yet statemented off the plan balance: when a remittance has posted on the program less than one whole calendar month
    before today, the program's recent remittances and recent patient charges come off, together with the insulin pump program's
    recent remittances and recent patient charges when it bills the same coverage record; when no remittance but a patient
    charge has posted less than one whole calendar month before today, only the recent patient charges of the program, and
    of the insulin pump program when it bills the same coverage record, come off; otherwise nothing comes off. The pump-balance
    adjustment adds the customer's insulin pump program balance to the plan balance: when that program bills the same coverage
    record, its whole patient balance is added; when it is not closed but bills another coverage record, only its patient
    charges are added, never more than its balance, its remittance patient responsibility staying with that payer's statement;
    otherwise nothing is added. The pump-plan adjustment takes off what the insulin pump program's own approved payment plan
    still covers, only when that program bills the same coverage record: when the pump payments posted fewer whole calendar
    months before today than one more than the whole calendar months since that plan was logged reach its monthly amount for
    each whole calendar month since it was logged, the installments it still has to collect, its installments times its monthly
    amount less those payments, are taken off; when that plan is behind, only its installments not yet due, the installments
    beyond the whole calendar months since it was logged times its monthly amount, are taken off; otherwise nothing is taken
    off. The rounding adjustment replaces the standard rounding of each installment by the way the customer pays: when the
    program's latest payment was made by debit card, credit card or HSA/FSA card, each installment is rounded up to the next
    cent; when it was made by check or bank transfer, each installment is rounded up to the next whole dollar; otherwise the
    standard rounding applies.
  prerequisite: []
  cross_category:
  - category: pump
    as: history
    reads:
    - status
    - coverage_id
    - patient_balance_due
    - pump_billing.amount
    - pump_requests.plan_months
    - pump_requests.monthly_amount_usd
    note: >-
      pump_balance_fold and pump_plan_carve_out read the pump program, its balance, its postings and its own payment plan
  compute:
  - cgm_unpaid: >-
      SUM('cgm_billing','amount', event_type='cgm_claim_adjudication') + SUM('cgm_billing','amount', event_type='cgm_patient_charge')
      + SUM('cgm_billing','amount', event_type='cgm_patient_refund') - SUM('cgm_billing','amount', event_type='cgm_patient_payment')
      - SUM('cgm_billing','amount', event_type='cgm_balance_adjustment')
  - plan_months: P('payment_plan_max_months')
  - cgm_recent_remits: >-
      SUM('cgm_billing','amount', within_months=1, date_field='posting_date', event_type='cgm_claim_adjudication')
  - cgm_recent_charges: >-
      SUM('cgm_billing','amount', within_months=1, date_field='posting_date', event_type='cgm_patient_charge')
  - pump_recent_remits: >-
      XSUM('pump','pump_billing','amount', within_months=1, date_field='posting_date', event_type='pump_claim_adjudication')
  - pump_recent_charges: >-
      XSUM('pump','pump_billing','amount', within_months=1, date_field='posting_date', event_type='pump_patient_charge')
  - pump_plan_total: >-
      (XLATEST('pump','pump_requests','plan_months', date_field='received_at', request_type='payment_plan', request_status='approved')
      or 0) * (XLATEST('pump','pump_requests','monthly_amount_usd', date_field='received_at', request_type='payment_plan',
      request_status='approved') or 0)
  - hardship_ledger_id: >-
      LATEST('cgm_requests','cgm_ledger_id', date_field='received_at', request_type='hardship_application') or ''
  - hardship_status: >-
      LATEST('cgm_requests','request_status', date_field='received_at', request_type='hardship_application') or ''
  - hardship_excluded: >-
      SUM('cgm_billing','amount', cgm_ledger_id=hardship_ledger_id) if hardship_status == 'received' and hardship_ledger_id
      else ((SUM('cgm_billing','amount', cgm_ledger_id=hardship_ledger_id) - SUM('cgm_billing','amount', event_type='cgm_balance_adjustment',
      original_cgm_ledger_id=hardship_ledger_id)) if hardship_status == 'approved' and hardship_ledger_id else 0)
  - speed_charges: SUM('cgm_billing','amount', event_type='cgm_patient_charge', charge_type='expedited_shipping')
  - shipping_charges: SUM('cgm_billing','amount', event_type='cgm_patient_charge', charge_type='standard_shipping')
  - charge_excluded: speed_charges if speed_charges > 0 else (shipping_charges if shipping_charges > 0 else 0)
  - pump_balance: CFIELD('pump','patient_balance_due') or 0
  - pump_same_coverage: >-
      (CFIELD('pump','status') or 'closed') != 'closed' and CFIELD('pump','coverage_id') == F('coverage_id')
  - statement_mode: >-
      'all_recent' if COUNT('cgm_billing', within_months=1, date_field='posting_date', event_type='cgm_claim_adjudication')
      > 0 else ('charges_recent' if COUNT('cgm_billing', within_months=1, date_field='posting_date', event_type='cgm_patient_charge')
      > 0 else 'none')
  - statement_wait: >-
      (cgm_recent_remits + cgm_recent_charges) if statement_mode == 'all_recent' else (cgm_recent_charges if statement_mode
      == 'charges_recent' else 0)
  - statement_wait_pump: >-
      (pump_recent_remits + pump_recent_charges if pump_same_coverage else 0) if statement_mode == 'all_recent' else ((pump_recent_charges
      if pump_same_coverage else 0) if statement_mode == 'charges_recent' else 0)
  - pump_taken_in: >-
      pump_balance if pump_same_coverage else (MN(pump_balance, MX(0, XSUM('pump','pump_billing','amount', event_type='pump_patient_charge')))
      if (CFIELD('pump','status') or 'closed') != 'closed' else 0)
  - pump_plan_age: >-
      MONTHS(XLATEST('pump','pump_requests','received_at', date_field='received_at', request_type='payment_plan', request_status='approved')
      or NOW, NOW)
  - pump_plan_paid: >-
      XSUM('pump','pump_billing','amount', within_months=pump_plan_age + 1, date_field='posting_date', event_type='pump_patient_payment')
  - pump_plan_carve: >-
      (MX(0, pump_plan_total - pump_plan_paid) if pump_plan_total > 0 and pump_plan_paid >= pump_plan_age * (XLATEST('pump','pump_requests','monthly_amount_usd',
      date_field='received_at', request_type='payment_plan', request_status='approved') or 0) else (MX(0, (XLATEST('pump','pump_requests','plan_months',
      date_field='received_at', request_type='payment_plan', request_status='approved') or 0) - pump_plan_age) * (XLATEST('pump','pump_requests','monthly_amount_usd',
      date_field='received_at', request_type='payment_plan', request_status='approved') or 0) if pump_plan_total > 0 else
      0)) if pump_same_coverage else 0
  - last_payment_method: >-
      LATEST('cgm_billing','payment_method', date_field='posting_date', event_type='cgm_patient_payment') or ''
  - rounding_rule: >-
      'cent_up' if last_payment_method == 'debit_card' or last_payment_method == 'credit_card' or last_payment_method == 'hsa_fsa_card'
      else ('dollar_up' if last_payment_method else 'nearest_cent')
  - covered_balance: >-
      RND(MX(0, cgm_unpaid - hardship_excluded - charge_excluded - statement_wait + MX(0, pump_taken_in - statement_wait_pump
      - pump_plan_carve)), 2)
  - covered_cents: int(RND(covered_balance * 100, 0))
  - monthly_cents: >-
      (-((-covered_cents) // plan_months)) if rounding_rule == 'cent_up' else ((-((-covered_cents) // (plan_months * 100)))
      * 100 if rounding_rule == 'dollar_up' else int(RND(covered_cents / plan_months, 0)))
  - result: >-
      RND(monthly_cents / 100, 2) if plan_months > 0 and covered_balance >= P('payment_plan_min_balance_usd') and monthly_cents
      >= P('payment_plan_min_monthly_usd') * 100 else 0.0
