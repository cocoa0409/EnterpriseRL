      or basal insulin only), the grant's counted blocks, the blocks of its span, never exceed the months left of a coverage
      review, blocks added on top of the span not counting toward that limit: the review length is the 30-day blocks of one
      standard shipment, in months; the review starts on the later of the review visit, the latest visit on the program's
      medical records with purpose continued-need follow-up or initial qualification by any practitioner, and the regimen
      change date, the ship date of the latest insulin refill on the customer's insulin pharmacy program, either date counting
      as earlier than every record when no such record exists; and the months left are the review length less the whole calendar
      months from the review start to the grant's anchor date, counted as zero when the review start falls after the anchor
      date, and never below zero.
    authorized_blocks: >-
      When the customer has stopped insulin, that is when the customer's insulin pharmacy program is closed with closure reason
      customer_discontinued, and the CGM program documents an insulin regimen (multiple daily injections, an insulin pump
      or basal insulin only), the grant's counted blocks, the blocks of its span, never exceed the months left of a coverage
