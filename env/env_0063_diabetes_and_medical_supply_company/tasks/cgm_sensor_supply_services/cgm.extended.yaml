    pump_delivery_date: >-
      The superseded-supply adjustment replaces the standard deduction for the latest refill's supply that runs past the order
      date: when the customer's insulin pump program is not closed, a pump was delivered on it after that refill shipped,
      and an over-limit justification record is dated on or after that pump delivery, no block is deducted, the justification
