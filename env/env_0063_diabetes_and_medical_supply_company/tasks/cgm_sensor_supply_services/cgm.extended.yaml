- id: cgm_ext_model_change_authorization_units
  base_policy_refs:
  - cgm_documentation_and_authorization
  - cgm_continued_coverage_visits
  - cgm_evt_refill_shipment
  overwrite:
  - base_policy: cgm_documentation_and_authorization
    superseded_clause: >-
      the payer's approval is recorded as an authorization grant with basis payer_prior_authorization, carrying the payer's
      PA reference, the approved units and the approved span, which runs prior_auth_validity_months calendar months from the
      decision date unless the payer's approval states an earlier valid-through date, in which case the payer's date governs.
    replaced_by: >-
      For a new written order of the item that changes the CGM model while the payer authorization the program's latest refill
      of the item drew on is still in force, and only for such an order, Larkfield records the grant itself under that authorization's
      PA reference with basis payer_prior_authorization, valid from the order date and carrying the units this policy counts,
      without a new payer approval; every other payer approval is recorded as an authorization grant with basis payer_prior_authorization,
      carrying the payer's PA reference, the approved units and the approved span, which runs prior_auth_validity_months calendar
      months from the decision date unless the payer's approval states an earlier valid-through date, in which case the payer's
      date governs.
  trigger: state_due
  subject:
  - cgm_authorization_grant
  computes: units_authorized
  target_tool: record_model_change_authorization_2da97677
  params: {}
  rule: >-
    This policy counts the billing units of the CGM supply allowance (A4239) carried by the authorization grant Larkfield
    records for a new written order of the item that changes the CGM model, on a tier where prior authorization is required,
    while the payer authorization the program's latest refill of the item drew on is still in force. For a new written order
    of the item that changes the CGM model while the payer authorization the program's latest refill of the item drew on is
    still in force, and only for such an order, Larkfield records the grant itself under that authorization's PA reference
    with basis payer_prior_authorization, valid from the order date and carrying the units this policy counts, without a new
    payer approval; every other payer approval is recorded as an authorization grant with basis payer_prior_authorization,
    carrying the payer's PA reference, the approved units and the approved span, which runs prior_auth_validity_months calendar
    months from the decision date unless the payer's approval states an earlier valid-through date, in which case the payer's
    date governs. The order is the newest written order of the item; the payer authorization is the authorization grant the
    program's latest refill of the item drew on, and its units left are the units it authorized less the units of refills
    of the item drawn on it, never below zero; that authorization is a per-period approval when its units equal the whole
    30-day blocks of its span, both dates counted, times the tier's allowance per 30 days; the latest refill is the latest
    refill shipment of the item, read for its ship date and supply days. The grant is valid from the order date through the
    earlier of the payer authorization's valid-through date and the order's valid-through date. The standard grant carries,
    for each whole 30-day block of its span, both days counted, the billing units per 30 days written on the order, less one
    block for each whole 30-day block of the latest refill's supply, its ship date plus its supply days, that runs past the
    order date. Whole calendar months from one date to a later date are the difference in calendar months between them, less
    one when the later date's calendar day is earlier than the earlier date's calendar day. Each adjustment set out below
    changes the standard grant as that adjustment states, in this order: replacements of a standard count, deduction or quantity
    first, then blocks taken off, the blocks being settled before they are multiplied by the units per 30 days; the grant
    carries a whole number of units, never below zero. The quantity-reading adjustment replaces the units per 30 days written
    on the order: when the order's quantity per 30 days is above the tier's allowance and equals the allowance times the 30-day
    blocks of one standard shipment, it is read as a per-shipment count and divided by those blocks; when it is any other
    quantity above the allowance, the order supports only the tier's allowance; otherwise the quantity as written applies.
    The superseded-supply adjustment replaces the standard deduction for the latest refill's supply that runs past the order
    date: when the customer's insulin pump program is not closed, a pump was delivered on it after that refill shipped, and
    an over-limit justification record is dated on or after that pump delivery, no block is deducted, the justification being
    the record of the change and the superseded supply being unusable with the new pump; when the payer authorization is a
    per-period approval and that supply runs past the order date, one block is deducted for every 30-day block from the order
    date into which it runs, a part block counted whole; otherwise the standard deduction applies. The approval-period adjustment
    replaces the standard count of whole blocks of the span by the kind of payer approval: when the payer authorization is
    a per-period approval, every 30-day block begun from the order date through the grant's valid-through date counts, a part
    block counted whole; when it approved fewer units than the whole blocks of its span times the tier's allowance, the whole
    blocks count, never more than its units left; otherwise, when it approved more units than the whole blocks of its span
    times the tier's allowance, the standard count applies. The follow-up adjustment takes blocks off the grant by the follow-up
    visit, the most recent visit date on the program's medical records with purpose continued_need_followup or initial_qualification,
    a visit counting as current on a date when it is no more than the tier's followup_visit_interval_months calendar months
    before that date, counted back with the same calendar day allowed (the last day of the month when that day does not exist),
    as the base follow-up requirement counts it: when the follow-up visit is current on the order date and is no longer current
    on the grant's valid-through date, it takes off one block for each whole calendar month from the follow-up visit date
    to the valid-through date beyond the interval; when the follow-up visit is no longer current on the order date, or no
    qualifying visit is on file at all, the grant carries no units until a new visit note is recorded; otherwise it takes
    off no block.
  prerequisite: []
  cross_category:
  - category: pump
    as: history
    reads:
    - status
    - pump_delivery_date
    note: >-
      superseded_supply_overlap reads whether the insulin pump program is open and when its pump was delivered
  compute:
  - order_date: >-
      LATEST('cgm_orders','order_date', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239')
  - order_valid_through: >-
      LATEST('cgm_orders','valid_through', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239')
  - latest_refill_ship: >-
      LATEST('cgm_shipments','ship_date', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      order_date
  - latest_refill_days: >-
      LATEST('cgm_shipments','supply_days', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239') or
      0
  - pa_grant_id: >-
      LATEST('cgm_shipments','cgm_order_id', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      or ''
  - pa_valid_from: >-
      LATEST('cgm_orders','valid_from', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239',
      cgm_order_id=pa_grant_id) or order_date
  - pa_valid_through: >-
      LATEST('cgm_orders','valid_through', date_field='valid_through', event_type='cgm_authorization_grant', item_code='A4239',
      cgm_order_id=pa_grant_id) or order_date
  - pa_units: >-
      SUM('cgm_orders','units_authorized', event_type='cgm_authorization_grant', item_code='A4239', cgm_order_id=pa_grant_id)
  - pa_drawn: >-
      SUM('cgm_shipments','units', event_type='cgm_refill_shipment', item_code='A4239', cgm_order_id=pa_grant_id)
  - pa_left: MX(0, pa_units - pa_drawn)
  - allowance: P('sensor_allowance_units_per_30_days')
  - blocks_per_shipment: P('supply_days_per_shipment') // 30
  - supply_end_offset: DAYS(order_date, latest_refill_ship) + latest_refill_days
  - per_period_approval: pa_units == (DAYS(pa_valid_from, pa_valid_through) + 1) // 30 * allowance
  - carry_end_date: pa_valid_through if pa_valid_through < order_valid_through else order_valid_through
  - last_visit_date: >-
      MX((LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt', record_purpose='continued_need_followup')
      or '0000-00-00'), (LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt',
      record_purpose='initial_qualification') or '0000-00-00'))
  - order_quantity: >-
      LATEST('cgm_orders','quantity_per_30_days', date_field='order_date', event_type='cgm_order_receipt', item_code='A4239')
  - units_per_block: >-
      order_quantity // blocks_per_shipment if order_quantity > allowance and order_quantity == allowance * blocks_per_shipment
      else (allowance if order_quantity > allowance else order_quantity)
  - pump_delivery_date: CFIELD('pump','pump_delivery_date') or '0000-00-00'
  - justification_date: >-
      LATEST('cgm_orders','visit_date', date_field='visit_date', event_type='cgm_medical_record_receipt', record_purpose='over_limit_justification')
      or '0000-00-00'
  - overlap_days: MX(0, supply_end_offset)
  - overlap_blocks: >-
      0 if (CFIELD('pump','status') or 'closed') != 'closed' and pump_delivery_date > latest_refill_ship and justification_date
      >= pump_delivery_date and overlap_days > 0 else ((overlap_days + 29) // 30 if per_period_approval and overlap_days >
      0 else overlap_days // 30)
  - span_count_rule: >-
      'started' if per_period_approval else ('capped' if pa_units < (DAYS(pa_valid_from, pa_valid_through) + 1) // 30 * allowance
      else 'whole')
  - visit_month_index: MONTHS('2000-01-01', last_visit_date)
  - visit_month_last_day: >-
      (29 if (2000 + visit_month_index // 12) % 4 == 0 and ((2000 + visit_month_index // 12) % 100 != 0 or (2000 + visit_month_index
      // 12) % 400 == 0) else 28) if visit_month_index % 12 == 1 else (30 if visit_month_index % 12 == 3 or visit_month_index
      % 12 == 5 or visit_month_index % 12 == 8 or visit_month_index % 12 == 10 else 31)
  - visit_month_end: >-
      visit_month_index - (MONTHS('2000-01-28', last_visit_date) if visit_month_last_day == 28 else (MONTHS('2000-01-29',
      last_visit_date) if visit_month_last_day == 29 else (MONTHS('2000-01-30', last_visit_date) if visit_month_last_day ==
      30 else MONTHS('2000-01-31', last_visit_date)))) == 0
  - order_months: MONTHS('2000-01-01', order_date) - MONTHS('2000-01-01', last_visit_date)
  - order_day_later: -MONTHS(order_date, last_visit_date) - order_months
  - order_visit_current: >-
      order_months < P('followup_visit_interval_months') or (order_months == P('followup_visit_interval_months') and (order_day_later
      == 0 or visit_month_end))
  - end_months: MONTHS('2000-01-01', carry_end_date) - MONTHS('2000-01-01', last_visit_date)
  - end_day_later: -MONTHS(carry_end_date, last_visit_date) - end_months
  - end_visit_current: >-
      end_months < P('followup_visit_interval_months') or (end_months == P('followup_visit_interval_months') and (end_day_later
      == 0 or visit_month_end))
  - lapse_cut_blocks: >-
      MX(0, MONTHS(last_visit_date, carry_end_date) - P('followup_visit_interval_months')) if order_visit_current and not
      end_visit_current else (999 if not order_visit_current else 0)
  - span_days: MX(0, DAYS(order_date, carry_end_date) + 1)
  - span_blocks: >-
      (span_days + 29) // 30 if span_count_rule == 'started' else (MN(span_days // 30, pa_left) if span_count_rule == 'capped'
      else span_days // 30)
  - result: int(MX(0, units_per_block * (span_blocks - overlap_blocks - lapse_cut_blocks)))
