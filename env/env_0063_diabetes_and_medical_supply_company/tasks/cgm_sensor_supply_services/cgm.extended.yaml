  factors:
  - id: prescribed_quantity_reading
    effect: >-
      method
    decides: units_per_block
    bindings:
    - order_quantity
    - units_per_block
    ladder:
    - when: >-
        the quantity per 30 days is above the allowance and equals the allowance times the blocks of one standard shipment
      method: that quantity divided by the blocks of one standard shipment
    - when: the quantity per 30 days is any other quantity above the allowance
      method: the tier's allowance
    - when: otherwise
      method: the quantity as written
    baseline:
      units_per_block: order_quantity
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: superseded_supply_overlap
    effect: >-
      parameter
    decides: overlap_blocks
    bindings:
    - pump_delivery_date
    - justification_date
    - overlap_blocks
    ladder:
    - when: >-
        the pump program is open, a pump was delivered after the latest refill shipped, and an over-limit justification is
        dated on or after that delivery
      value: no block deducted
    - when: >-
        the payer authorization is a per-period approval and the latest refill's supply runs past the order date
      value: >-
        one block per 30-day block from the order date into which that supply runs, a part block counted whole
    - when: otherwise
      value: the standard deduction (each whole block of that supply after the order date)
    baseline:
      overlap_blocks: overlap_days // 30
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: pump
  - id: approval_period_count
    effect: >-
      method
    decides: span_count_rule
    bindings:
    - span_count_rule
    ladder:
    - when: the payer authorization is a per-period approval
      method: every block begun through the valid-through date, a part block counted whole
    - when: it approved fewer units than the whole blocks of its span times the allowance
      method: the whole blocks, never more than its units left
    - when: otherwise (it approved more units than the whole blocks of its span times the allowance)
      method: the standard count (whole blocks)
    baseline:
      span_count_rule: '''whole'''
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: follow_up_lapse_cut
    effect: >-
      parameter
    decides: lapse_cut_blocks
    bindings:
    - last_visit_date
    - visit_month_index
    - visit_month_last_day
    - visit_month_end
    - order_months
    - order_day_later
    - order_visit_current
    - end_months
    - end_day_later
    - end_visit_current
    - lapse_cut_blocks
    ladder:
    - when: >-
        the follow-up visit is current on the order date and no longer current on the grant's valid-through date
      value: one block per whole calendar month beyond the interval
    - when: the follow-up visit is no longer current on the order date, or no qualifying visit is on file at all
      value: every block (no units)
    - when: otherwise (the visit stays current through the valid-through date)
      value: no block
    baseline:
      lapse_cut_blocks: '0'
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      The order is the newest written order of the item; the payer authorization is the authorization grant the program's
      latest refill of the item drew on, and its units left are the units it authorized less the units of refills of the item
      drawn on it, never below zero; that authorization is a per-period approval when its units equal the whole 30-day blocks
      of its span, both dates counted, times the tier's allowance per 30 days; the latest refill is the latest refill shipment
      of the item, read for its ship date and supply days. The grant is valid from the order date through the earlier of the
      payer authorization's valid-through date and the order's valid-through date. The standard grant carries, for each whole
      30-day block of its span, both days counted, the billing units per 30 days written on the order, less one block for
      each whole 30-day block of the latest refill's supply, its ship date plus its supply days, that runs past the order
