    carry_end_date: >-
      The grant is valid from the order date through the earlier of the payer authorization's valid-through date and the order's
      valid-through date.
    last_visit_date: >-
      The follow-up adjustment takes blocks off the grant by the follow-up visit, the most recent visit date on the program's
      medical records with purpose continued_need_followup or initial_qualification, a visit counting as current on a date
      when it is no more than the tier's followup_visit_interval_months calendar months before that date, counted back with
      the same calendar day allowed (the last day of the month when that day does not exist), as the base follow-up requirement
      counts it: when the follow-up visit is current on the order date and is no longer current on the grant's valid-through
      date, it takes off one block for each whole calendar month from the follow-up visit date to the valid-through date beyond
      the interval; when the follow-up visit is no longer current on the order date, or no qualifying visit is on file at
      all, the grant carries no units until a new visit note is recorded; otherwise it takes off no block.
    order_quantity: >-
      The quantity-reading adjustment replaces the units per 30 days written on the order: when the order's quantity per 30
      days is above the tier's allowance and equals the allowance times the 30-day blocks of one standard shipment, it is
      read as a per-shipment count and divided by those blocks; when it is any other quantity above the allowance, the order
      supports only the tier's allowance; otherwise the quantity as written applies.
    units_per_block: >-
      The quantity-reading adjustment replaces the units per 30 days written on the order: when the order's quantity per 30
      days is above the tier's allowance and equals the allowance times the 30-day blocks of one standard shipment, it is
      read as a per-shipment count and divided by those blocks; when it is any other quantity above the allowance, the order
