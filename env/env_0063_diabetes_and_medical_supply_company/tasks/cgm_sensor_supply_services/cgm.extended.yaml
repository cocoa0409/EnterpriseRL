    pump_delivery_date: >-
      The pump delivery is the pump delivery date recorded on the customer's insulin pump program, and the over-limit justification
      is the latest medical record on the CGM program with purpose over-limit justification.
    justification_date: >-
      The pump delivery is the pump delivery date recorded on the customer's insulin pump program, and the over-limit justification
      is the latest medical record on the CGM program with purpose over-limit justification.
    latest_refill_delivered: >-
      The ship-timing adjustment replaces the standard earliest permitted ship date: when the customer's insulin pump program
      is not closed and the pump delivery falls after the latest refill shipped and on or before the newest written order's
      date, the latest refill does not count and the delivery may ship today; when the latest refill shipped as expedited_no_charge,
      because Larkfield delayed it, the earliest date is refill_ship_lead_days calendar days before its proof-of-delivery
      date, or its ship date when no proof of delivery is recorded, plus its supply days; otherwise the standard earliest
      date applies.
    earliest_ship_offset: >-
      The ship-timing adjustment replaces the standard earliest permitted ship date: when the customer's insulin pump program
      is not closed and the pump delivery falls after the latest refill shipped and on or before the newest written order's
      date, the latest refill does not count and the delivery may ship today; when the latest refill shipped as expedited_no_charge,
      because Larkfield delayed it, the earliest date is refill_ship_lead_days calendar days before its proof-of-delivery
      date, or its ship date when no proof of delivery is recorded, plus its supply days; otherwise the standard earliest
      date applies.
    hardship_status: >-
      The hardship adjustment takes a posting under a hardship application off the past-due amount: when the latest hardship
      application on the program names a posting and is still awaiting decision, that posting's amount is taken off; when
      it is approved, that posting's amount less the balance adjustments posted against it is taken off; otherwise nothing
      is taken off.
    hardship_excluded: >-
      The hardship adjustment takes a posting under a hardship application off the past-due amount: when the latest hardship
      application on the program names a posting and is still awaiting decision, that posting's amount is taken off; when
      it is approved, that posting's amount less the balance adjustments posted against it is taken off; otherwise nothing
      is taken off.
    early_basis_days: >-
      The early-refill adjustment moves the paid-supply end earlier by the payer's early-refill allowance: when the latest
      refill carried at least one standard shipment's supply days, by one fifth of those days, rounded down; when it carried
      at least 30 but fewer days, by the tier's refill lead days; otherwise it does not move.
    early_refill_days: >-
      The early-refill adjustment moves the paid-supply end earlier by the payer's early-refill allowance: when the latest
      refill carried at least one standard shipment's supply days, by one fifth of those days, rounded down; when it carried
      at least 30 but fewer days, by the tier's refill lead days; otherwise it does not move.
    counting_rule: >-
      The frequency-edit adjustment replaces which blocks of the delivery are at risk against the paid-supply end: when the
      payer paid any amount on the latest refill's claim, every 30-day block that begins before the paid-supply end is at
      risk; when a remittance for that claim posted with no payer payment, only the delivery's first block is at risk, and
      only when the paid-supply end is after today; otherwise the standard at-risk blocks apply.
    exception_mode: >-
      The documented-change adjustment takes at-risk blocks off: when the customer's insulin pump program is not closed, the
      pump delivery falls after the latest refill shipped and the over-limit justification is dated on or after the pump delivery,
      up to the first two at-risk blocks come off, the payer being expected to pay them as the transition to the model the
      pump requires; when the over-limit justification is dated after the latest refill shipped and the pump delivery does
      not fall after it, the first at-risk block comes off, the documented clinical change being expected to be paid for it
      only; otherwise no block comes off.
    waiver_date: >-
      The waiver-coverage adjustment replaces the standard waiting rule by the plan member waiver on file: when a plan member
      waiver for the item is dated on or after the newest written order's date, the delivery ships less any exposed units
      beyond the waiver's units; when the latest plan member waiver is dated earlier, it covers the superseded supply, not
      this delivery, so the delivery ships less its exposed units; otherwise the standard waiting rule applies.
    waiver_units: >-
      The waiver-coverage adjustment replaces the standard waiting rule by the plan member waiver on file: when a plan member
      waiver for the item is dated on or after the newest written order's date, the delivery ships less any exposed units
      beyond the waiver's units; when the latest plan member waiver is dated earlier, it covers the superseded supply, not
      this delivery, so the delivery ships less its exposed units; otherwise the standard waiting rule applies.
    coverage_rule: >-
      The waiver-coverage adjustment replaces the standard waiting rule by the plan member waiver on file: when a plan member
      waiver for the item is dated on or after the newest written order's date, the delivery ships less any exposed units
      beyond the waiver's units; when the latest plan member waiver is dated earlier, it covers the superseded supply, not
      this delivery, so the delivery ships less its exposed units; otherwise the standard waiting rule applies.
    uncovered_past_due: >-
      The delivery ships only when its earliest permitted ship date is not after today and the uncovered past-due amount,
      the past-due amount less the covered amount, is below past_due_hold_min_usd or the tier's past_due_hold_days is 0.
    ship_allowed: >-
      The delivery ships only when its earliest permitted ship date is not after today and the uncovered past-due amount,
      the past-due amount less the covered amount, is below past_due_hold_min_usd or the tier's past_due_hold_days is 0.
    paid_end_offset: >-
      The latest refill is the latest refill shipment of the item, read for its ship date, supply days, billing route and
      claim; its supply counts as paid by the payer for its supply days when it was billed by payer claim, from its ship date,
      and the paid-supply end is its ship date plus those paid supply days; the payer authorization is the grant the latest
