    span_blocks: >-
      The block-start adjustment replaces the standard blocks and anchor: when a grant of the item is still valid on the order
      date, the blocks are counted from the day after that grant's valid-through date through the order's valid-through date,
      and the grant is anchored to that valid-through date; when no grant is still valid but the latest refill's supply, its
      ship date plus its supply days, runs past the order date, the blocks are counted from the end of that supply through
      the order's valid-through date, both days counted, the grant staying anchored to the order date; otherwise the standard
      blocks and anchor apply.
    review_anchor_date: >-
      The block-start adjustment replaces the standard blocks and anchor: when a grant of the item is still valid on the order
      date, the blocks are counted from the day after that grant's valid-through date through the order's valid-through date,
      and the grant is anchored to that valid-through date; when no grant is still valid but the latest refill's supply, its
      ship date plus its supply days, runs past the order date, the blocks are counted from the end of that supply through
      the order's valid-through date, both days counted, the grant staying anchored to the order date; otherwise the standard
      blocks and anchor apply.
    order_quantity: >-
      The quantity-reading adjustment replaces the order's units per 30 days by the convention the prescriber used: when the
      order states exactly the tier's allowance per 30 days times the 30-day blocks of one standard shipment, it is a per-shipment
      count and the units per 30 days are that quantity divided by those blocks; when it states any other quantity above the
      tier's allowance per 30 days, the quantity cannot be read and the grant carries no units until the prescriber corrects
