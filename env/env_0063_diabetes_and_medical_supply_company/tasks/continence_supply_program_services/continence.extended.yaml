        opened_returnable: =opened_returnable}
- id: continence_evt_claims
  subject: [continence_claim_submission, continence_claim_adjudication]
  rule: >-
    Every refill shipped on a payer tier is billed to the payer named by the program's coverage record by one original
    claim per shipment, with the ship date as the date of service; the self-pay tier files no claims. An original
    claim must be transmitted no later than timely_filing_days calendar days after the date of service of the shipment
    it bills, counted in calendar days from that ship date with the last day allowed; a shipment whose filing limit
    has passed is billed to neither the payer nor the customer and is written off by Larkfield. A corrected claim
    replaces an original claim when the units, item or dates billed were wrong or some of the units were returned,
    and a void claim withdraws an original claim when all of its units were returned; both reference the same shipment
    as the original. When a remittance posts, the patient responsibility added to the customer's balance is the
    allowed amount less the amount the payer paid, which the remittance itemizes as deductible, coinsurance and
    copay; Larkfield never posts more than that and never bills the customer the difference between its billed charge
    and the allowed amount on a payer tier. On tiers where crossover_to_secondary is true and the customer has an
    in-effect secondary coverage record, the patient responsibility is crossed over to the secondary payer, and
    the secondary payer's payment is posted as a balance adjustment with reason secondary_payer_payment against
    that remittance before any amount is statemented; on other tiers a secondary coverage is billed by Larkfield's
    billing team only after the primary remittance posts. On the Medicaid tier a customer is never billed for a
    Medicaid-covered item beyond the patient responsibility the Medicaid remittance shows.
  eligibility:
  - id: timely_filing
    applies_to: [continence_claim_submission]
    kind: time
    condition: >-
      An original claim must be transmitted no later than timely_filing_days calendar days after the date of service
      of the shipment it bills
    evidence_fields: [continence_shipments.continence_shipment_id, continence_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_shipments.continence_shipment_id]
      action_bindings: {continence_shipments.continence_shipment_id: continence_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the date of service of the shipment it bills, anchor_source: continence_shipments.ship_date,
      relation: not_after, duration_source: variants.timely_filing_days, unit: calendar_days, counting_rule: counted
        in calendar days from that ship date with the last day allowed, boundary: inclusive}
  params:
    per_tier:
      Continence Self-Pay Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Continence Commercial HMO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Continence Commercial PPO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Continence Medicare Advantage Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Continence Original Medicare Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Continence Medicaid Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
  formula: {amount: allowed_amount - payer_paid_amount}
- id: continence_evt_denials_and_appeals
  subject: [continence_claim_denial, continence_appeal_filing]
  rule: >-
    A denial is worked by its denial code, and the code alone decides the route; the self-pay tier has no denials
    or appeals. CO-16 (claim lacks information) is unprocessable and is never appealed: it is cured only by a corrected
    claim transmitted no later than corrected_claim_window_days calendar days after the denial's posting date. CO-50
    (not medically necessary), CO-151 (frequency or quantity not supported) and CO-197 (authorization absent) are
    appealable. A first-level appeal may be filed no later than appeal_window_days calendar days after the posting
    date of the denial it appeals, counted in calendar days from that posting date with the last day allowed; a
    CO-197 denial is appealed only when an authorization grant valid on the date of service is on file, and a CO-151
    denial only when a medical record supporting the quantity, dated on or before the date of service, is on file;
    otherwise the denial is not appealed and is handled as a non-covered amount under continence_liability_notice.
    An appeal decision that upholds the denial posts as a new denial whose original posting is the appeal filing.
    A second-level appeal may be filed only against such an upheld first-level decision, no later than second_level_appeal_window_days
    calendar days after its posting date; where second_level_appeal_window_days is 0 there is no customer-filed
    second level on the tier, and on the Medicare Advantage tier the plan forwards an upheld denial to the independent
    review entity itself. One appeal is filed per level per denial; a denial already appealed at a level is not
    appealed again at that level. CO-29 (timely filing expired) is never appealed and never billed to the customer;
    Larkfield writes it off with a billing_correction adjustment. PR-204 (not covered under the plan) becomes the
    customer's responsibility only under continence_liability_notice; otherwise Larkfield absorbs it.
  eligibility:
  - id: appeal_window
    applies_to: [continence_appeal_filing]
    kind: time
    condition: >-
      A first-level appeal may be filed no later than appeal_window_days calendar days after the posting date of
      the denial it appeals
    evidence_fields: [continence_billing.continence_ledger_id, continence_billing.posting_date, continence_billing.denial_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_billing.continence_ledger_id]
      action_bindings: {continence_billing.continence_ledger_id: original_continence_ledger_id}
    temporal_basis: {clock: frozen_time, anchor_event: the posting date of the denial it appeals, anchor_source: continence_billing.posting_date,
      relation: not_after, duration_source: variants.appeal_window_days, unit: calendar_days, counting_rule: counted
        in calendar days from that posting date with the last day allowed, boundary: inclusive}
  - id: one_appeal_per_level
    applies_to: [continence_appeal_filing]
    kind: dedup
    condition: One appeal is filed per level per denial; a denial already appealed at a level is not appealed again
      at that level.
    evidence_fields: [continence_billing.original_continence_ledger_id, continence_billing.appeal_level, continence_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_billing.original_continence_ledger_id]
      action_bindings: {continence_billing.original_continence_ledger_id: original_continence_ledger_id}
    dedup_contract:
      table: continence_billing
      mode: separate_record
      object_bindings: {original_continence_ledger_id: original_continence_ledger_id, appeal_level: appeal_level}
      duplicate_filters:
        event_type: [continence_appeal_filing]
      distinct_fields: [posting_date]
  params:
    per_tier:
      Continence Self-Pay Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Continence Commercial HMO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Continence Commercial PPO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Continence Medicare Advantage Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Continence Original Medicare Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Continence Medicaid Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
- id: continence_liability_notice
  subject: [continence_liability_notice_signed, continence_patient_charge]
  rule: >-
    When an item or quantity the customer wants is expected not to be paid by the payer - above the tier's allowance
    without supporting documentation, an item the tier does not cover, or a replacement before the payer's replacement
    interval - Larkfield supplies it billable to the customer only after the customer signs the tier's liability
    notice (liability_notice_type) for that item and quantity before the ship date; the customer signs it personally,
    and no Larkfield representative can sign it for them. On the Original Medicare tier the notice is the CMS Advance
    Beneficiary Notice of Noncoverage (form CMS-R-131); the claim is still submitted to Medicare with the notice
    on file, and the customer becomes liable only for a line Medicare denies. On the Medicare Advantage tier no
    notice can make the member liable; the member becomes liable only for an item for which the plan has issued
    a pre-service organization determination denial, recorded as a prior authorization denial for that item. On
    the self-pay tier no notice applies, because every item is priced at the Larkfield cash price. A patient charge
    is posted only as one of these charge types: self_pay_price (a self-pay refill at the cash price), standard_shipping
    (a self-pay shipment below the free-shipping threshold), expedited_shipping (a customer-requested expedite),
    or non_covered_item (an item or quantity covered by a signed liability notice, or by a Medicare Advantage organization
    determination denial, that the payer denied, charged at the Larkfield cash price of the units concerned). A
    non_covered_item charge requires a liability notice signed on or before the ship date covering that item and
    at least those units, or on the Medicare Advantage tier the plan's organization determination denial for that
    item; without it the amount is Larkfield's write-off and is never billed to the customer.
  eligibility:
  - id: notice_before_charge
    applies_to: [continence_patient_charge]
    kind: authorization
    condition: >-
      A non_covered_item charge requires a liability notice signed on or before the ship date covering that item
      and at least those units, or on the Medicare Advantage tier the plan's organization determination denial for
      that item
    evidence_fields: [continence_orders.continence_program_id, continence_orders.item_code, continence_orders.event_type,
      continence_orders.notice_date, continence_orders.notice_units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_orders.continence_program_id, continence_orders.item_code]
      action_bindings: {continence_orders.continence_program_id: continence_program_id, continence_orders.item_code: item_code}
  - id: customer_signs
    applies_to: [continence_liability_notice_signed]
    kind: caller_fact
    condition: the customer signs it personally, and no Larkfield representative can sign it for them.
    evidence_fields: [continence_programs.continence_program_id, continence_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [continence_programs.continence_program_id]
      action_bindings: {continence_programs.continence_program_id: continence_program_id}
  params:
    per_tier:
      Continence Self-Pay Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Continence Commercial HMO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Continence Commercial PPO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Continence Medicare Advantage Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Continence Original Medicare Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Continence Medicaid Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
- id: continence_evt_patient_account
  subject: [continence_patient_payment, continence_balance_adjustment, continence_patient_refund]
  rule: >-
    The customer's balance on the program is the running total of its patient-balance postings: remittance patient
    responsibility, patient charges and refunds add to it, and payments and balance adjustments reduce it; a payment
    is applied to the oldest unpaid posting first. A balance adjustment is posted only for one of these reasons,
    each against the one posting it adjusts and never for more than that posting's unpaid remainder: return_credit
    (an accepted self-pay return, for the price paid for the returned units less restocking_fee_pct percent); secondary_payer_payment
    (the amount a secondary payer paid against a remittance's patient responsibility); hardship_waiver; small_balance_writeoff;
    billing_correction (a posting made in error, or a timely-filing write-off). A hardship waiver is granted only
    on tiers where hardship_waiver_allowed is true, only for postings named on a hardship application whose request
    status is approved, and only after Larkfield's financial counseling team confirms household income at or below
    hardship_income_fpl_pct percent of the HHS poverty guideline; it is never granted routinely, never advertised
    and never granted on the customer's statement alone. A small-balance write-off is made only when the whole remaining
    balance of the program is greater than 0.00 and no more than small_balance_writeoff_usd; on tiers where small_balance_writeoff_usd
    is 0.00 no write-off is made and the balance is statemented. A credit balance - a balance below zero - is refunded
    to the original payment method no later than credit_balance_refund_days calendar days after the posting date
    of the entry that created it, unless the customer asks in writing to keep it on account; a refund never exceeds
    the credit. A payment plan is offered only on tiers where payment_plan_max_months is greater than 0, for a balance
    of at least payment_plan_min_balance_usd, in no more than payment_plan_max_months monthly installments of at
    least payment_plan_min_monthly_usd; it is created as a payment plan request the customer accepts, and while
    an approved plan's installments are current the balance it covers is left out of the past-due test measured
    by continence_msr_past_due_amount.
  eligibility:
  - id: hardship_approved
    applies_to: [continence_balance_adjustment]
    kind: authorization
    condition: >-
      A hardship waiver is granted only on tiers where hardship_waiver_allowed is true, only for postings named
      on a hardship application whose request status is approved
    evidence_fields: [continence_requests.continence_request_id, continence_requests.request_type, continence_requests.request_status,
      continence_requests.continence_ledger_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_requests.continence_ledger_id]
      action_bindings: {continence_requests.continence_ledger_id: original_continence_ledger_id}
  - id: small_balance_ceiling
    applies_to: [continence_balance_adjustment]
    kind: authorization
    condition: >-
      A small-balance write-off is made only when the whole remaining balance of the program is greater than 0.00
      and no more than small_balance_writeoff_usd
    evidence_fields: [continence_programs.continence_program_id, continence_programs.patient_balance_due]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_programs.continence_program_id]
      action_bindings: {continence_programs.continence_program_id: continence_program_id}
  params:
    per_tier:
      Continence Self-Pay Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Continence Commercial HMO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Continence Commercial PPO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Continence Medicare Advantage Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Continence Original Medicare Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Continence Medicaid Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
  measures: [continence_msr_past_due_amount]
- id: continence_holds_and_closure
  subject: [continence_program_hold, continence_program_resume, continence_program_administrative_close]
  rule: >-
    An active program is placed on hold for exactly one recorded reason: inpatient_stay (the customer or caregiver
    reports a current inpatient admission to a hospital or skilled nursing facility, on tiers where inpatient_hold_required
    is true); coverage_lapse (the coverage record the program bills has a termination date earlier than the date
    of the write and no other in-effect coverage on file fixes the program's tier); documentation_lapse (no authorization
    grant of the program is valid on the date of the write); past_due_balance (on tiers where past_due_hold_days
    is greater than 0, the past-due amount measured by continence_msr_past_due_amount is at least past_due_hold_min_usd
    and no approved payment plan covers it); or customer_request (the customer asks to pause shipments). A hold
    is placed only for a reason that is true on the date of the write. A program on hold resumes only when its recorded
    hold reason has cleared: discharge reported for inpatient_stay; an in-effect coverage on file and written onto
    the program for coverage_lapse; an authorization grant valid on the date of the write for documentation_lapse;
    a past-due amount below past_due_hold_min_usd or an approved payment plan for past_due_balance; the customer's
    own request for customer_request. A program closes administratively, with the matching closure reason, in exactly
    these cases: documentation_not_received, for a program still in referral_received or pending_authorization once
    the date of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior
    authorization decision pending; authorization_denied, when a payer prior authorization denial stands and no
    new request is pending; hold_limit_reached, for a program on hold once the date of the write is later than the
    hold start date plus hold_max_days calendar days; coverage_ended, for a program on hold for coverage_lapse whose
    customer reports no replacement coverage; customer_discontinued, when the customer confirms the cancellation
    of a program on hold; deceased, when Larkfield's records team has recorded the customer's death. Day counts
    in this policy are calendar days counted from the named date, and a closure is made only on a day strictly later
    than the named date plus the stated days.
  eligibility:
  - id: inpatient_reported
    applies_to: [continence_program_hold]
    kind: caller_fact
    condition: >-
      the customer or caregiver reports a current inpatient admission to a hospital or skilled nursing facility,
      on tiers where inpatient_hold_required is true
    evidence_fields: [continence_programs.continence_program_id, continence_programs.variant_name]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [continence_programs.continence_program_id]
      action_bindings: {continence_programs.continence_program_id: continence_program_id}
  - id: hold_reason_true
    applies_to: [continence_program_hold]
    kind: authorization
    condition: A hold is placed only for a reason that is true on the date of the write.
    evidence_fields: [continence_programs.continence_program_id, continence_programs.coverage_id, coverages.termination_date,
      continence_orders.valid_through, continence_programs.patient_balance_due]
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - [continence_programs.continence_program_id]
      action_bindings: {continence_programs.continence_program_id: continence_program_id}
  - id: hold_limit_elapsed
    applies_to: [continence_program_administrative_close]
    kind: time
    condition: >-
      hold_limit_reached, for a program on hold once the date of the write is later than the hold start date plus
      hold_max_days calendar days
    evidence_fields: [continence_programs.continence_program_id, continence_programs.hold_start_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_programs.continence_program_id]
      action_bindings: {continence_programs.continence_program_id: continence_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold start date
      anchor_source: continence_programs.hold_start_date
      relation: not_before
      duration_source: variants.hold_max_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  - id: referral_window_elapsed
    applies_to: [continence_program_administrative_close]
    kind: time
    condition: >-
      documentation_not_received, for a program still in referral_received or pending_authorization once the date
      of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior authorization
      decision pending
    evidence_fields: [continence_programs.continence_program_id, continence_programs.enrolled_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_programs.continence_program_id]
      action_bindings: {continence_programs.continence_program_id: continence_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrolled date
      anchor_source: continence_programs.enrolled_date
      relation: not_before
      duration_source: variants.referral_docs_window_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  params:
    per_tier:
      Continence Self-Pay Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Continence Commercial HMO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Continence Commercial PPO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Continence Medicare Advantage Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Continence Original Medicare Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Continence Medicaid Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
  measures: [continence_msr_past_due_amount]
- id: continence_discontinuation
  subject: [continence_program_discontinue]
  rule: >-
    Only the customer can end an active program: Larkfield records the cancellation as a program cancellation request,
    and the program closes only when the customer personally confirms that request. A confirmed cancellation closes
    the program with closure_reason customer_discontinued, or changed_supplier when the customer states they are
    moving these supplies to another supplier; a cancellation of a program on hold is closed under continence_holds_and_closure.
    Ending a program carries no fee and cancels nothing the customer already owes: the balance stays payable, credit
    balances are still refunded under continence_evt_patient_account, and unopened items delivered within the return
    window stay returnable under continence_evt_returns. Authorized units remaining on a closed program lapse and
    are never shipped; a later restart needs a new referral and a new program. A package already shipped is not
    recalled.
  eligibility:
  - id: cancellation_confirmed
    applies_to: [continence_program_discontinue]
    kind: authorization
    condition: >-
      Larkfield records the cancellation as a program cancellation request, and the program closes only when the
      customer personally confirms that request.
    evidence_fields: [continence_requests.continence_request_id, continence_requests.continence_program_id, continence_requests.request_type,
      continence_requests.request_status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_requests.continence_program_id]
      action_bindings: {continence_requests.continence_program_id: continence_program_id}
- id: continence_agg_multi_holding
  subject: [continence_program_enroll]
  rule: >-
    A customer may hold up to max_per_customer continence programs at the same time, each for a different product
    line - for example intermittent catheters together with absorbent products where the tier covers them. A new
    continence program is opened only when the customer has no continence program of the same product line in referral_received,
    pending_authorization, active or on_hold, and never for a product line that mutually_exclusive_product_lines
    pairs with a product line the customer already holds in one of those statuses, under continence_combo_indwelling_exclusion;
    a closed program does not count.
  eligibility:
  - id: one_program_per_line
    applies_to: [continence_program_enroll]
    kind: dedup
    condition: >-
      A new continence program is opened only when the customer has no continence program of the same product line
      in referral_received, pending_authorization, active or on_hold
    evidence_fields: [continence_programs.customer_id, continence_programs.product_line, continence_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_programs.customer_id, continence_programs.product_line]
      action_bindings: {continence_programs.customer_id: customer_id, continence_programs.product_line: product_line}
    dedup_contract:
      table: continence_programs
      mode: separate_record
      object_bindings: {customer_id: customer_id, product_line: product_line}
      duplicate_filters:
        status: [referral_received, pending_authorization, active, on_hold]
      distinct_fields: []
  params: {max_per_customer: 2}
- id: continence_agg_consolidated_supply
  subject: [continence_refill_shipment]
  rule: >-
    For a customer holding two continence programs, each program keeps its own allowance, but drainage bags (A4357
    and A4358) are allowed once per customer: they ship only on the program with the earlier enrolled date that
    is not closed and whose product line lists them, and the other program receives none. When the earliest permitted
    ship dates of the two programs fall within shipment_consolidation_days calendar days of each other, both refills
    ship together on the later of the two dates.
  eligibility:
  - id: bags_on_one_program
    applies_to: [continence_refill_shipment]
    kind: authorization
    condition: >-
      drainage bags (A4357 and A4358) are allowed once per customer: they ship only on the program with the earlier
      enrolled date that is not closed and whose product line lists them, and the other program receives none.
    evidence_fields: [continence_programs.customer_id, continence_programs.enrolled_date, continence_programs.status,
      continence_programs.product_line]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_programs.customer_id]
      action_bindings: {continence_programs.customer_id: customer_id}
  params:
    per_tier:
      Continence Self-Pay Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Continence Commercial HMO Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Continence Commercial PPO Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Continence Medicare Advantage Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Continence Original Medicare Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Continence Medicaid Program: {shipment_consolidation_days: =shipment_consolidation_days}
- id: continence_evt_quantity_limits
  subject: [continence_refill_shipment, continence_replacement_shipment]
  rule: >-
    A refill may carry only items that items_by_product_line lists for the program's product line, and an intermittent
    catheter program receives only the tip written on the program. The units of each item are the tier's monthly_allowance_by_item
    for that item times the supply days divided by 30, or the written order's quantity when that is lower; an item
    whose allowance is 0 is not covered on the tier. Absorbent products are covered only on tiers where absorbent_products_covered
    is true, and the briefs and liners of all sizes together may not exceed absorbent_units_per_30_days per 30 days
    of supply; on other tiers a customer may buy them at cash_price_by_item under continence_liability_notice, and
    on the Original Medicare tier they are never billed to Medicare because Medicare does not cover them. On tiers
    where coude_documentation_required is true, a coude-tip catheter (A4352) ships only when a medical record with
    purpose coude_tip_justification is on file; on tiers where closed_system_criteria_required is true, a closed-system
    catheter (A4353) ships only when a medical record with purpose closed_system_qualification is on file; on the
    Medicaid tier absorbent products ship only when a medical record with purpose incontinence_assessment is on
    file. A quantity above the allowance is covered only when a medical record with purpose over_limit_justification
    is dated no more than over_limit_record_months calendar months before the ship date; without it the extra quantity
    ships only under continence_liability_notice. On the self-pay tier every item is sold at cash_price_by_item
    up to the written order's quantity. A replacement never exceeds the units of the shipment it replaces.
  eligibility:
  - id: items_match_line
    applies_to: [continence_refill_shipment]
    kind: authorization
    condition: >-
      A refill may carry only items that items_by_product_line lists for the program's product line, and an intermittent
      catheter program receives only the tip written on the program.
    evidence_fields: [continence_programs.continence_program_id, continence_programs.product_line, continence_programs.catheter_tip]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_programs.continence_program_id]
      action_bindings: {continence_programs.continence_program_id: continence_program_id}
  - id: special_catheter_documented
    applies_to: [continence_refill_shipment]
    kind: authorization
    condition: >-
      On tiers where coude_documentation_required is true, a coude-tip catheter (A4352) ships only when a medical
      record with purpose coude_tip_justification is on file
    evidence_fields: [continence_orders.continence_program_id, continence_orders.record_purpose]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_orders.continence_program_id]
      action_bindings: {continence_orders.continence_program_id: continence_program_id}
  params:
    per_tier:
      Continence Self-Pay Program: {monthly_allowance_by_item: =monthly_allowance_by_item, absorbent_products_covered: =absorbent_products_covered,
        absorbent_units_per_30_days: =absorbent_units_per_30_days, coude_documentation_required: =coude_documentation_required,
        closed_system_criteria_required: =closed_system_criteria_required, over_limit_record_months: =over_limit_record_months}
      Continence Commercial HMO Program: {monthly_allowance_by_item: =monthly_allowance_by_item, absorbent_products_covered: =absorbent_products_covered,
        absorbent_units_per_30_days: =absorbent_units_per_30_days, coude_documentation_required: =coude_documentation_required,
        closed_system_criteria_required: =closed_system_criteria_required, over_limit_record_months: =over_limit_record_months}
      Continence Commercial PPO Program: {monthly_allowance_by_item: =monthly_allowance_by_item, absorbent_products_covered: =absorbent_products_covered,
        absorbent_units_per_30_days: =absorbent_units_per_30_days, coude_documentation_required: =coude_documentation_required,
        closed_system_criteria_required: =closed_system_criteria_required, over_limit_record_months: =over_limit_record_months}
      Continence Medicare Advantage Program: {monthly_allowance_by_item: =monthly_allowance_by_item, absorbent_products_covered: =absorbent_products_covered,
        absorbent_units_per_30_days: =absorbent_units_per_30_days, coude_documentation_required: =coude_documentation_required,
        closed_system_criteria_required: =closed_system_criteria_required, over_limit_record_months: =over_limit_record_months}
      Continence Original Medicare Program: {monthly_allowance_by_item: =monthly_allowance_by_item, absorbent_products_covered: =absorbent_products_covered,
        absorbent_units_per_30_days: =absorbent_units_per_30_days, coude_documentation_required: =coude_documentation_required,
        closed_system_criteria_required: =closed_system_criteria_required, over_limit_record_months: =over_limit_record_months}
      Continence Medicaid Program: {monthly_allowance_by_item: =monthly_allowance_by_item, absorbent_products_covered: =absorbent_products_covered,
        absorbent_units_per_30_days: =absorbent_units_per_30_days, coude_documentation_required: =coude_documentation_required,
        closed_system_criteria_required: =closed_system_criteria_required, over_limit_record_months: =over_limit_record_months}
  formula: {units: monthly_allowance_by_item * supply_days / 30}
- id: continence_combo_indwelling_exclusion
  subject: [continence_program_enroll, continence_refill_shipment]
  rule: >-
    Holding an indwelling catheter program excludes intermittent and external catheters, and holding either of those
    excludes an indwelling catheter program, because a customer with an indwelling catheter in place does not also
    catheterize intermittently or wear an external catheter. No product line is supplied to a customer who holds
    a program in active or on_hold status of a product line that mutually_exclusive_product_lines pairs with it;
    when the prescriber changes the customer from one to the other, the earlier program is closed before the new
    program's first refill ships, and a referral for the new line is accepted but its program is not activated until
    then. Absorbent products combine with any catheter product line.
  eligibility:
  - id: no_excluded_line_open
    applies_to: [continence_refill_shipment]
    kind: authorization
    condition: >-
      No product line is supplied to a customer who holds a program in active or on_hold status of a product line
      that mutually_exclusive_product_lines pairs with it
    evidence_fields: [continence_programs.customer_id, continence_programs.product_line, continence_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_programs.customer_id]
      action_bindings: {continence_programs.customer_id: customer_id}
  params: {mutually_exclusive_product_lines: =mutually_exclusive_product_lines}
- id: continence_samples
  subject: [continence_sample_shipment]
  rule: >-
    When a customer's current catheter or absorbent product does not suit them, Larkfield may send a no-charge manufacturer
    sample kit of an alternative item of the program's product line so the customer can choose a new product with
    their practitioner; a sample is never billed, draws no authorized units and does not count toward the allowance.
    A sample kit is sent only while the program's sample kits over the rolling 12 months ending on the sample ship
    date, counted by continence_msr_samples_12m, are fewer than sample_kits_per_12_months. A product the customer
    chooses after a trial is supplied only after a new written order names it.
  eligibility:
  - id: sample_limit
    applies_to: [continence_sample_shipment]
    kind: dedup
    condition: >-
      A sample kit is sent only while the program's sample kits over the rolling 12 months ending on the sample
      ship date, counted by continence_msr_samples_12m, are fewer than sample_kits_per_12_months.
    evidence_fields: [continence_shipments.continence_program_id, continence_shipments.event_type, continence_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [continence_shipments.continence_program_id]
      action_bindings: {continence_shipments.continence_program_id: continence_program_id}
    dedup_contract:
      table: continence_shipments
      mode: separate_record
      object_bindings: {continence_program_id: continence_program_id}
      duplicate_filters:
        event_type: [continence_sample_shipment]
      distinct_fields: [ship_date, item_code]
  params:
    per_tier:
      Continence Self-Pay Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Continence Commercial HMO Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Continence Commercial PPO Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Continence Medicare Advantage Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Continence Original Medicare Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Continence Medicaid Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
  measures: [continence_msr_samples_12m]

# ============================================================================
# extended_policies (continence_supply_program_services)
# ============================================================================
extended_policies:
- id: continence_ext_straight_catheter_refill
  base_policy_refs:
  - continence_evt_refill_shipment
  - continence_agg_consolidated_supply
  - continence_evt_quantity_limits
  - continence_combo_indwelling_exclusion
  - continence_liability_notice
  - continence_evt_patient_account
  overwrite:
  - base_policy: continence_evt_refill_shipment
    superseded_clause: >-
      the supply days of a shipment are the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that
      remain before the authorization's valid-through date when fewer remain
    replaced_by: >-
      For a straight-tip intermittent catheter refill on the Original Medicare tier, and only for such a refill, the supply
      days of the refill are set by the supply-span rule of this policy; every other refill keeps the base supply days.
  - base_policy: continence_evt_quantity_limits
    superseded_clause: >-
      The units of each item are the tier's monthly_allowance_by_item for that item times the supply days divided by 30,
      or the written order's quantity when that is lower
    replaced_by: >-
      For a straight-tip intermittent catheter refill on the Original Medicare tier, and only for such a refill, the units
      are those this policy states; every other refill keeps the base units.
  - base_policy: continence_evt_refill_shipment
    superseded_clause: >-
      On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms,
      for this shipment, that they are still using the item and how much supply they have on hand
    replaced_by: >-
      For a straight-tip intermittent catheter refill on the Original Medicare tier, and only for such a refill, the customer
      personally confirms in the call that they are still using the catheters, and the supply they hold is counted from
      the records by this policy's unused-supply rule rather than from their own count; every other refill keeps the base
      confirmation rule.
  trigger: on_request
  subject:
  - continence_refill_shipment
  computes: units
  target_tool: ship_catheter_refill_863073b5
  params:
    straight_tip_allowance_per_30_days: 200
    kit_recent_months: 3
    kit_year_months: 12
    phase_in_recent_days: 60
    phase_in_window_days: 180
    recent_phase_blocks: 1
    window_phase_blocks: 2
    slow_delivery_days: 2
  rule: >-
    This policy settles the billing units of a straight-tip intermittent catheter (A4351) refill on the Original Medicare
    tier. For a straight-tip intermittent catheter refill on the Original Medicare tier, and only for such a refill, the
    supply days of the refill are set by the supply-span rule of this policy; every other refill keeps the base supply
    days. For a straight-tip intermittent catheter refill on the Original Medicare tier, and only for such a refill, the
    units are those this policy states; every other refill keeps the base units. For a straight-tip intermittent catheter
    refill on the Original Medicare tier, and only for such a refill, the customer personally confirms in the call that
    they are still using the catheters, and the supply they hold is counted from the records by this policy's unused-supply
    rule rather than from their own count; every other refill keeps the base confirmation rule. The refill's units are
    fixed only after the posting named on the program's newest approved hardship application carries its hardship waiver
    adjustment. When no over-limit justification record qualifies, the above-allowance units ship only after a liability
    notice the customer signed for the straight-tip catheter, dated on or before the ship date, stands on the program.
    Records read. The newest written order is the straight-tip order with the latest order date; the newest kit order
    is the closed-system kit (A4353) order with the latest order date. The previous refill is the program's straight-tip
    refill with the latest ship date, and the earlier order is the written order behind the authorization grant that previous
    refill drew on. The newest grant is the straight-tip authorization grant with the latest valid-from date; when none
    is on file the refill has no supply days. When the program has no earlier straight-tip refill, there is no earlier
    order and no unused supply. Standard method. The supply days are the tier's standard supply days per shipment, and
    the 30-day blocks are the supply days divided by 30. The covered limit per 30 days is the straight-tip allowance of
    200 units per 30 days. The covered units per 30 days are the covered limit, or the newest written order's quantity
    per 30 days when that is lower. The previous refill's supply starts on its ship date, and the days left are its supply
    days less the calendar days from that start to the ship date of this refill, never below zero. The daily rate is the
    previous refill's units divided by its supply days. The unused supply is the days left times the daily rate, rounded
    down to a whole unit. The refill's units are the covered units per 30 days times the 30-day blocks, less the unused
    supply, never below zero. The order's excess per 30 days is the newest written order's quantity per 30 days less the
    covered units per 30 days, and the order's excess for the refill is that excess times the 30-day blocks. Each adjustment
    set out below changes the refill's units as that adjustment states: every replacement of a standard quantity is made
    first and the quantities resting on it are counted again, then every addition is made, each never more than its own
    limit; the refill's units are never below zero. Supply span. When the valid-through date of the newest grant is fewer
    than the standard supply days after the ship date, the supply days are replaced by the whole 30-day blocks from the
    ship date to that valid-through date. Otherwise, when the customer holds an Ostomy Supply Program in active status
    and the supply end of the latest ostomy refill shipped to the customer, that is its ship date plus its supply days,
    falls at least 30 and fewer than the standard supply days after the ship date, the supply days are replaced by the
    whole 30-day blocks from the ship date to that ostomy supply end, so that both refills fall due together. Otherwise
    the supply days stay the standard supply days. Kit allowance room. When closed-system catheter kits shipped on the
    program within the last 3 calendar months, the covered limit per 30 days is replaced by the allowance less the newest
    kit order's quantity per 30 days. When kits shipped on the program within the last 12 calendar months but none within
    the last 3, the covered limit is replaced by the allowance less one twelfth of the kit units shipped in those 12 months,
    rounded down. Otherwise the covered limit stays the allowance. Above-allowance route. When a medical record with purpose
    over-limit justification has a visit date no more than the tier's over-limit record months before the ship date, counted
    in whole calendar months with a partial month not counted, and the newest written order and the newest kit order together
    ask more than the allowance per 30 days, the order's excess for the refill is added to the refill's units, never more
    than the newest written order's quantity for the tier's standard supply days, so the record carries the whole excess.
    When no such record qualifies and a liability notice for the straight-tip catheter dated on or before the ship date
    is on file, the order's excess for the refill is added, never more than the units on the newest such notice. Otherwise
    nothing is added. Increase phase-in. When the program has an earlier order, the newest written order's quantity per
    30 days is above it, and the newest order is dated no more than 60 calendar days before the ship date, the order's
    excess for the refill counts for 1 of the 30-day blocks instead of all of them. When it has an earlier order, the
    newest order is above it and dated more than 60 but no more than 180 calendar days before the ship date, it counts
    for 2 of them. Otherwise it counts for the blocks of the tier's standard supply days; in every case for no more than
    the 30-day blocks. Supply start. When a replacement shipment was sent for the previous refill, the previous refill's
    supply starts on the replacement's ship date instead. When no replacement was sent and the proof of delivery for the
    previous refill shows a delivery date more than 2 calendar days after its ship date, it starts on that delivery date
    instead. Otherwise it starts on the previous refill's ship date. Unused-supply rate. When the newest written order
    is dated after the previous refill's ship date and asks more per 30 days than the earlier order, the daily rate is
    replaced by the newest order's quantity per 30 days divided by 30. When that is not so and closed-system kits shipped
    on the previous refill's ship date, it is replaced by the previous refill's units plus those kit units, divided by
    the previous refill's supply days. Otherwise the daily rate stays the standard daily rate. Every eligibility of the
    base refill, quantity, consolidation, exclusion, liability-notice and patient-account rules stays in force for this
    refill.
  prerequisite:
  - problem: continence_ext_abn_quantity_notice
    kind: value_input
    gate: extra_units
    form: state
    policy_source: >-
      When no over-limit justification record qualifies, the above-allowance units ship only after a liability notice
      the customer signed for the straight-tip catheter, dated on or before the ship date, stands on the program.
    condition: >-
      When no over-limit justification record of the program is within the tier's over-limit record months of the ship
      date, a continence_liability_notice_signed record for item A4351 on the program with notice_date on or before the
      ship date.
    resolved_by: sign_liability_notice_4a664827
    effect: >-
      With the notice on file and no qualifying over-limit record, the order's excess for the refill is added to the
      refill's units, never more than the notice's units, so the refill units rise by that amount instead of nothing.
  - problem: continence_ext_hardship_waiver
    kind: state_gate
    gate: continence_billing.adjustment_reason
    form: state
    policy_source: >-
      The refill's units are fixed only after the posting named on the program's newest approved hardship application
      carries its hardship waiver adjustment.
    condition: >-
      For the continence_requests row of the program with request_type hardship_application and request_status approved
      and the latest received_at, a continence_balance_adjustment row with adjustment_reason hardship_waiver whose original_continence_ledger_id
      is that request's continence_ledger_id.
    resolved_by: post_hardship_waiver_d1a5476f
    effect: >-
      The named posting carries its hardship waiver adjustment, the program balance and the past-due amount fall by the
      waiver (the past-due amount never below zero), and the refill's units may be fixed and shipped.
  cross_category:
  - category: ostomy
    as: history
    reads:
    - status
    - ostomy_shipments.ship_date
    - ostomy_shipments.supply_days
    note: >-
      The supply-span rule reads the customer's Ostomy Supply Program status and its latest ostomy refill's ship date
      and supply days to align the catheter supply end with the ostomy supply end.
  compute:
  - std_days: P('supply_days_per_shipment')
  - std_blocks: int(std_days / 30)
  - allowance: K('straight_tip_allowance_per_30_days')
  - auth_through: >-
      LATEST('continence_orders', 'valid_through', date_field='valid_from', event_type='continence_authorization_grant',
      item_code='A4351')
  - auth_days: DAYS(NOW, auth_through) if auth_through != None else 0
  - order_qty: >-
      LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', event_type='continence_order_receipt',
      item_code='A4351') or 0
  - newest_order_date: >-
      LATEST('continence_orders', 'order_date', date_field='order_date', event_type='continence_order_receipt', item_code='A4351')
  - kit_qty: >-
      LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', event_type='continence_order_receipt',
      item_code='A4353') or 0
  - prev_id: >-
      LATEST('continence_shipments', 'continence_shipment_id', date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4351')
  - prev_ship: >-
      LATEST('continence_shipments', 'ship_date', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
  - prev_units: >-
      LATEST('continence_shipments', 'units', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
      or 0
  - prev_days: >-
      LATEST('continence_shipments', 'supply_days', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
      or 0
  - prev_grant: >-
      LATEST('continence_shipments', 'continence_order_id', date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4351')
  - prev_order_id: >-
      LATEST('continence_orders', 'related_continence_order_id', date_field='valid_from', continence_order_id=prev_grant)
  - prev_order_qty: >-
      LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', continence_order_id=prev_order_id)
      or 0
  - record_visit: >-
      LATEST('continence_orders', 'visit_date', date_field='visit_date', event_type='continence_medical_record_receipt',
      record_purpose='over_limit_justification')
  - notice_units_on_file: >-
      LATEST('continence_orders', 'notice_units', date_field='notice_date', event_type='continence_liability_notice_signed',
      item_code='A4351')
  - notice_date_on_file: >-
      LATEST('continence_orders', 'notice_date', date_field='notice_date', event_type='continence_liability_notice_signed',
      item_code='A4351')
  - ostomy_active: EXISTS('ostomy', status='active')
  - ostomy_last_ship: >-
      XLATEST('ostomy', 'ostomy_shipments', 'ship_date', date_field='ship_date', event_type='ostomy_refill_shipment')
  - ostomy_last_days: >-
      XLATEST('ostomy', 'ostomy_shipments', 'supply_days', date_field='ship_date', event_type='ostomy_refill_shipment')
  - ostomy_days_ahead: >-
      (ostomy_last_days - DAYS(ostomy_last_ship, NOW)) if (ostomy_last_ship != None and ostomy_last_days != None) else
      0
  - span_days: >-
      30 * int(auth_days / 30) if auth_days < std_days else (30 * int(ostomy_days_ahead / 30) if (ostomy_active and ostomy_days_ahead
      >= 30 and ostomy_days_ahead < std_days) else std_days)
  - kits_recent: >-
      COUNT('continence_shipments', within_months=K('kit_recent_months'), date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4353')
  - kits_year_units: >-
      SUM('continence_shipments', 'units', within_months=K('kit_year_months'), date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4353')
  - room_per30: >-
      allowance - kit_qty if kits_recent > 0 else (allowance - int(kits_year_units / 12) if kits_year_units > 0 else allowance)
  - covered_per30: MN(order_qty, room_per30)
  - record_ok: record_visit != None and MONTHS(record_visit, NOW) <= P('over_limit_record_months')
  - notice_ok: notice_date_on_file != None and notice_date_on_file <= NOW
  - route_cap: >-
      order_qty * std_blocks if (record_ok and order_qty + kit_qty > allowance) else (notice_units_on_file if ((not record_ok)
      and notice_ok) else 0)
  - phase_cap: >-
      K('recent_phase_blocks') if (prev_order_qty > 0 and order_qty > prev_order_qty and newest_order_date != None and
      DAYS(newest_order_date, NOW) <= K('phase_in_recent_days')) else (K('window_phase_blocks') if (prev_order_qty > 0
      and order_qty > prev_order_qty and newest_order_date != None and DAYS(newest_order_date, NOW) <= K('phase_in_window_days'))
      else std_blocks)
  - prev_pod: >-
      LATEST('continence_shipments', 'delivery_date', date_field='delivery_date', event_type='continence_delivery_confirmation',
      original_continence_shipment_id=prev_id)
  - prev_repl_ship: >-
      LATEST('continence_shipments', 'ship_date', date_field='ship_date', event_type='continence_replacement_shipment',
      original_continence_shipment_id=prev_id)
  - supply_start: >-
      prev_repl_ship if prev_repl_ship != None else (prev_pod if (prev_pod != None and DAYS(prev_ship, prev_pod) > K('slow_delivery_days'))
      else prev_ship)
  - kits_with_prev: >-
      COUNT('continence_shipments', event_type='continence_refill_shipment', item_code='A4353', ship_date=prev_ship)
  - kits_prev_units: >-
      SUM('continence_shipments', 'units', event_type='continence_refill_shipment', item_code='A4353', ship_date=prev_ship)
  - daily_rate: >-
      order_qty / 30 if (prev_ship != None and newest_order_date != None and newest_order_date > prev_ship and order_qty
      > prev_order_qty) else (((prev_units + kits_prev_units) / prev_days if kits_with_prev > 0 else prev_units / prev_days)
      if prev_days else 0)
  - blocks: int(span_days / 30)
  - covered_units: covered_per30 * blocks
  - excess_units: (order_qty - covered_per30) * MN(phase_cap, blocks)
  - extra_units: MN(route_cap, excess_units)
  - days_left: MX(0, prev_days - DAYS(supply_start, NOW)) if prev_ship != None else 0
  - carry_units: int(days_left * daily_rate)
  - result: MX(0, covered_units + extra_units - carry_units)
  compute_basis:
    std_days: >-
      The supply days are the tier's standard supply days per shipment, and the 30-day blocks are the supply days divided
      by 30.
    allowance: The covered limit per 30 days is the straight-tip allowance of 200 units per 30 days.
    covered_per30: >-
      The covered units per 30 days are the covered limit, or the newest written order's quantity per 30 days when that
      is lower.
    covered_units: >-
      The refill's units are the covered units per 30 days times the 30-day blocks, less the unused supply, never below
      zero.
    auth_through: >-
      The newest grant is the straight-tip authorization grant with the latest valid-from date; when none is on file the
      refill has no supply days.
    order_qty: The newest written order is the straight-tip order with the latest order date;
    prev_ship: The previous refill is the program's straight-tip refill with the latest ship date,
    prev_order_qty: the earlier order is the written order behind the authorization grant that previous refill drew on.
    span_days: >-
      When the valid-through date of the newest grant is fewer than the standard supply days after the ship date, the
      supply days are replaced by the whole 30-day blocks from the ship date to that valid-through date. Otherwise, when
      the customer holds an Ostomy Supply Program in active status and the supply end of the latest ostomy refill shipped
      to the customer, that is its ship date plus its supply days, falls at least 30 and fewer than the standard supply
      days after the ship date, the supply days are replaced by the whole 30-day blocks from the ship date to that ostomy
      supply end, so that both refills fall due together. Otherwise the supply days stay the standard supply days.
    ostomy_active: when the customer holds an Ostomy Supply Program in active status
    ostomy_last_ship: >-
      the supply end of the latest ostomy refill shipped to the customer, that is its ship date plus its supply days,
    kits_recent: When closed-system catheter kits shipped on the program within the last 3 calendar months,
    kits_year_units: When kits shipped on the program within the last 12 calendar months but none within the last 3,
    room_per30: >-
      When closed-system catheter kits shipped on the program within the last 3 calendar months, the covered limit per
      30 days is replaced by the allowance less the newest kit order's quantity per 30 days. When kits shipped on the
      program within the last 12 calendar months but none within the last 3, the covered limit is replaced by the allowance
      less one twelfth of the kit units shipped in those 12 months, rounded down. Otherwise the covered limit stays the
      allowance.
    record_ok: >-
      When a medical record with purpose over-limit justification has a visit date no more than the tier's over-limit
      record months before the ship date, counted in whole calendar months with a partial month not counted,
    notice_ok: a liability notice for the straight-tip catheter dated on or before the ship date is on file,
    route_cap: >-
      When a medical record with purpose over-limit justification has a visit date no more than the tier's over-limit
      record months before the ship date, counted in whole calendar months with a partial month not counted, and the newest
      written order and the newest kit order together ask more than the allowance per 30 days, the order's excess for
      the refill is added to the refill's units, never more than the newest written order's quantity for the tier's standard
      supply days, so the record carries the whole excess. When no such record qualifies and a liability notice for the
      straight-tip catheter dated on or before the ship date is on file, the order's excess for the refill is added, never
      more than the units on the newest such notice. Otherwise nothing is added.
    phase_cap: >-
      When the program has an earlier order, the newest written order's quantity per 30 days is above it, and the newest
      order is dated no more than 60 calendar days before the ship date, the order's excess for the refill counts for
      1 of the 30-day blocks instead of all of them. When it has an earlier order, the newest order is above it and dated
      more than 60 but no more than 180 calendar days before the ship date, it counts for 2 of them. Otherwise it counts
      for the blocks of the tier's standard supply days; in every case for no more than the 30-day blocks.
    supply_start: >-
      When a replacement shipment was sent for the previous refill, the previous refill's supply starts on the replacement's
      ship date instead. When no replacement was sent and the proof of delivery for the previous refill shows a delivery
      date more than 2 calendar days after its ship date, it starts on that delivery date instead. Otherwise it starts
      on the previous refill's ship date.
    daily_rate: >-
      When the newest written order is dated after the previous refill's ship date and asks more per 30 days than the
      earlier order, the daily rate is replaced by the newest order's quantity per 30 days divided by 30. When that is
      not so and closed-system kits shipped on the previous refill's ship date, it is replaced by the previous refill's
      units plus those kit units, divided by the previous refill's supply days. Otherwise the daily rate stays the standard
      daily rate.
    blocks: >-
      The supply days are the tier's standard supply days per shipment, and the 30-day blocks are the supply days divided
      by 30.
    excess_units: >-
      The order's excess per 30 days is the newest written order's quantity per 30 days less the covered units per 30
      days, and the order's excess for the refill is that excess times the 30-day blocks.
    days_left: >-
      The previous refill's supply starts on its ship date, and the days left are its supply days less the calendar days
      from that start to the ship date of this refill, never below zero.
    carry_units: The unused supply is the days left times the daily rate, rounded down to a whole unit.
    extra_units: >-
      Each adjustment set out below changes the refill's units as that adjustment states: every replacement of a standard
      quantity is made first and the quantities resting on it are counted again, then every addition is made, each never
      more than its own limit; the refill's units are never below zero.
    result: >-
      Each adjustment set out below changes the refill's units as that adjustment states: every replacement of a standard
      quantity is made first and the quantities resting on it are counted again, then every addition is made, each never
      more than its own limit; the refill's units are never below zero.
  factors:
  - id: sync_span_rule
    effect: method
    decides: span_days
    bindings:
    - ostomy_active
    - ostomy_last_ship
    - ostomy_last_days
    - ostomy_days_ahead
    - span_days
    ladder:
    - when: >-
        the newest straight-tip grant's valid-through date is fewer than the standard supply days after the ship date
      method: >-
        the supply days are replaced by the whole 30-day blocks from the ship date to that valid-through date
    - when: >-
        the grant runs past the standard span AND the customer's Ostomy Supply Program is active AND the latest ostomy
        refill's supply end is at least 30 and fewer than the standard supply days ahead
      method: the supply days are replaced by the whole 30-day blocks from the ship date to the ostomy supply end
    - when: otherwise
      method: the supply days stay the tier's standard supply days per shipment
    baseline:
      span_days: std_days
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: ostomy
  - id: kit_room_rule
    effect: parameter
    decides: room_per30
    bindings:
    - kits_recent
    - kits_year_units
    - room_per30
    ladder:
    - when: closed-system kits (A4353) shipped on the program within the last 3 calendar months
      value: the covered limit is replaced by the allowance less the newest kit order's quantity per 30 days
    - when: kits shipped within the last 12 calendar months but none within the last 3
      value: >-
        the covered limit is replaced by the allowance less one twelfth of the 12-month kit units, rounded down
    - when: otherwise
      value: the covered limit stays the allowance (K('straight_tip_allowance_per_30_days'))
    baseline:
      room_per30: allowance
    evidence:
    - history
    cross_difficulty: null
  - id: above_allowance_route
    effect: parameter
    decides: route_cap
    bindings:
    - record_ok
    - notice_ok
    - route_cap
    ladder:
    - when: >-
        an over-limit justification record no more than the tier's over-limit record months old AND the newest straight-tip
        and kit orders together above the allowance
      value: >-
        the order's excess for the refill is added, never more than the newest written order's quantity for the tier's
        standard supply days
    - when: no qualifying record AND a straight-tip liability notice dated on or before the ship date
      value: the order's excess for the refill is added, never more than the units on the newest such notice
    - when: otherwise
      value: nothing is added (0)
    baseline:
      route_cap: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: increase_phase_in_rule
    effect: parameter
    decides: phase_cap
    bindings:
    - phase_cap
    ladder:
    - when: >-
        an earlier order exists AND the newest order asks more AND it is dated no more than 60 days before the ship date
      value: the order's excess counts for 1 block (K('recent_phase_blocks'))
    - when: >-
        an earlier order exists AND the newest order asks more AND it is dated more than 60 but no more than 180 days
        before the ship date
      value: the order's excess counts for 2 blocks (K('window_phase_blocks'))
    - when: otherwise
      value: the order's excess counts for the blocks of the standard supply days
    baseline:
      phase_cap: std_blocks
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: supply_start_anchor
    effect: method
    decides: supply_start
    bindings:
    - prev_pod
    - prev_repl_ship
    - supply_start
    ladder:
    - when: a replacement shipment was sent for the previous straight-tip refill
      method: the previous refill's supply starts on the replacement's ship date
    - when: no replacement AND the previous refill's proof of delivery is more than 2 days after its ship date
      method: the previous refill's supply starts on the delivery date
    - when: otherwise
      method: the previous refill's supply starts on its ship date
    baseline:
      supply_start: prev_ship
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: carry_rate_rule
    effect: parameter
    decides: daily_rate
    bindings:
    - kits_with_prev
    - kits_prev_units
    - daily_rate
    ladder:
    - when: >-
        the newest written order is dated after the previous refill's ship date AND asks more than the earlier order
      value: the daily rate is replaced by the newest order's quantity per 30 days divided by 30
    - when: not so AND closed-system kits shipped on the previous refill's ship date
      value: >-
        the daily rate is replaced by the previous refill's units plus those kit units, divided by its supply days
    - when: otherwise
      value: the daily rate stays the previous refill's units divided by its supply days
    baseline:
      daily_rate: prev_units / prev_days if prev_days else 0
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The supply days are the tier's standard supply days per shipment, and the 30-day blocks are the supply days divided
      by 30. The covered limit per 30 days is the straight-tip allowance of 200 units per 30 days. The covered units per
      30 days are the covered limit, or the newest written order's quantity per 30 days when that is lower. The previous
      refill's supply starts on its ship date, and the days left are its supply days less the calendar days from that
      start to the ship date of this refill, never below zero. The daily rate is the previous refill's units divided by
      its supply days. The unused supply is the days left times the daily rate, rounded down to a whole unit. The refill's
      units are the covered units per 30 days times the 30-day blocks, less the unused supply, never below zero.
    params:
    - straight_tip_allowance_per_30_days
    - supply_days_per_shipment
  inputs:
    history:
    - table: continence_orders
      aggregate: latest
      field: valid_through
      filters:
        event_type: continence_authorization_grant
        item_code: A4351
    - table: continence_orders
      aggregate: latest
      field: quantity_per_30_days
      filters:
        event_type: continence_order_receipt
    - table: continence_shipments
      aggregate: count
      field: continence_shipment_id
      within_months: 3
      filters:
        event_type: continence_refill_shipment
        item_code: A4353
    - table: continence_shipments
      aggregate: sum
      field: units
      within_months: 12
      filters:
        event_type: continence_refill_shipment
        item_code: A4353
    - table: continence_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: continence_refill_shipment
        item_code: A4351
    - table: continence_shipments
      aggregate: latest
      field: delivery_date
      filters:
        event_type: continence_delivery_confirmation
    - table: continence_orders
      aggregate: latest
      field: visit_date
      filters:
        event_type: continence_medical_record_receipt
        record_purpose: over_limit_justification
    - table: continence_orders
      aggregate: latest
      field: notice_units
      filters:
        event_type: continence_liability_notice_signed
        item_code: A4351
    - category: ostomy
      table: ostomy_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: ostomy_refill_shipment
    cross_category:
    - ostomy
- id: continence_ext_abn_quantity_notice
  base_policy_refs:
  - continence_liability_notice
  - continence_evt_quantity_limits
  overwrite:
  - base_policy: continence_liability_notice
    superseded_clause: the customer signs it personally, and no Larkfield representative can sign it for them.
    replaced_by: >-
      For a straight-tip catheter notice this policy settles, and only for such a notice, the customer signs it in the
      call through the signing step the agent hands to them, or the customer's authorized representative signs it for
      them, and no Larkfield representative signs it; every other notice keeps the base signing rule.
  trigger: on_request
  subject:
  - continence_liability_notice_signed
  computes: notice_units
  target_tool: sign_liability_notice_4a664827
  params:
    straight_tip_allowance_per_30_days: 200
    raised_term_blocks: 12
    renewed_term_blocks: 6
    term_window_days: 180
    kit_recent_months: 3
    kit_year_months: 12
    slow_delivery_days: 2
    rush_margin_per_30_days: 10
    raise_margin_per_30_days: 5
    raise_margin_days: 60
    heavy_use_cushion_days: 5
    regular_use_cushion_days: 3
    heavy_use_per_30_days: 240
    regular_use_per_30_days: 180
  rule: >-
    This policy settles the billing units on the liability notice a customer signs on the Original Medicare tier for straight-tip
    intermittent catheters (A4351) ordered above the straight-tip allowance, the Advance Beneficiary Notice of Noncoverage.
    For a straight-tip catheter notice this policy settles, and only for such a notice, the customer signs it in the call
    through the signing step the agent hands to them, or the customer's authorized representative signs it for them, and
    no Larkfield representative signs it; every other notice keeps the base signing rule. Records read. The newest written
    order is the straight-tip order with the latest order date, with its quantity per 30 days and its valid-through date;
    the newest kit order is the closed-system kit (A4353) order with the latest order date. The previous refill is the
    program's straight-tip refill with the latest ship date, and the earlier order is the written order behind the authorization
    grant that previous refill drew on; a program with no earlier straight-tip refill has no earlier order. When no straight-tip
    written order is on file, the notice covers no units. Standard method. The term blocks are the tier's standard supply
    days per shipment divided by 30. The order horizon is the whole 30-day blocks from the signing date to the newest
    written order's valid-through date, never below zero. The notice blocks are the term blocks or the order horizon,
    whichever is fewer. The expected-denial quantity per 30 days is the newest written order's quantity less the straight-tip
    allowance of 200 units per 30 days, never below zero. The notice units are the expected-denial quantity per 30 days
    times the notice blocks. Each adjustment set out below changes the notice units as that adjustment states: every replacement
    of a standard quantity is made first and the quantities resting on it are counted again, then every addition is made.
    Notice term. When the program has an earlier order, the newest written order asks more per 30 days than it, and the
    newest order is dated no more than 180 calendar days before the signing date, the term blocks are replaced by twelve
    30-day blocks, the one-year span a notice for repeated supplies may cover. When the program has an earlier order,
    the newest order asks no more than it and is dated no more than 180 calendar days before the signing date, the term
    blocks are replaced by six. Otherwise the term blocks stay those of one standard shipment. Order horizon. When the
    proof of delivery for the previous refill shows a delivery date more than 2 calendar days after its ship date, the
    order horizon is counted instead from that delivery date plus the previous refill's supply days, or from the signing
    date when that date is already past. Otherwise, when the previous refill's ship date plus its supply days falls after
    the signing date, it is counted instead from that date. Otherwise it stays counted from the signing date. Expected-denial
    basis. When closed-system catheter kits shipped on the program within the last 3 calendar months, the expected-denial
    quantity per 30 days is replaced by the newest written order's quantity plus the newest kit order's quantity per 30
    days, less the allowance, because the payer counts both against the same monthly limit. When kits shipped within the
    last 12 calendar months but none within the last 3, it is replaced by the newest written order's quantity plus one
    twelfth of the kit units shipped in those 12 months, rounded down, less the allowance. Otherwise it stays the newest
    written order's quantity less the allowance. None of these is below zero. Shortfall margin. When a refill of the program
    shipped by customer-requested expedited shipping within the last 12 calendar months, 10 units per 30 days are added
    to the notice units for each of the notice blocks. When no such refill shipped and the newest written order asks more
    than the earlier order and is dated no more than 60 calendar days before the signing date, 5 units per 30 days are
    added for each of the notice blocks. Otherwise nothing is added. Delivery cushion. When the newest written order is
    for 240 or more units per 30 days, the expected-denial quantity per 30 days times 5 days divided by 30, rounded down,
    is added to the notice units. When it is for at least 180 but fewer than 240 units per 30 days, the expected-denial
    quantity per 30 days times 3 days divided by 30, rounded down, is added. Otherwise nothing is added. The notice type
    is the tier's liability notice type, and every eligibility of the base liability-notice rule stays in force.
  prerequisite: []
  cross_category: []
  compute:
  - std_blocks: int(P('supply_days_per_shipment') / 30)
  - allowance: K('straight_tip_allowance_per_30_days')
  - order_qty: >-
      LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', event_type='continence_order_receipt',
      item_code='A4351') or 0
  - newest_order_date: >-
      LATEST('continence_orders', 'order_date', date_field='order_date', event_type='continence_order_receipt', item_code='A4351')
  - order_through: >-
      LATEST('continence_orders', 'valid_through', date_field='order_date', event_type='continence_order_receipt', item_code='A4351')
  - kit_qty: >-
      LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', event_type='continence_order_receipt',
      item_code='A4353') or 0
  - prev_id: >-
      LATEST('continence_shipments', 'continence_shipment_id', date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4351')
  - prev_ship: >-
      LATEST('continence_shipments', 'ship_date', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
  - prev_days: >-
      LATEST('continence_shipments', 'supply_days', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
      or 0
  - prev_grant: >-
      LATEST('continence_shipments', 'continence_order_id', date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4351')
  - prev_order_id: >-
      LATEST('continence_orders', 'related_continence_order_id', date_field='valid_from', continence_order_id=prev_grant)
  - prev_order_qty: >-
      LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', continence_order_id=prev_order_id)
      or 0
  - term_blocks: >-
      K('raised_term_blocks') if (prev_order_qty > 0 and order_qty > prev_order_qty and newest_order_date != None and
      DAYS(newest_order_date, NOW) <= K('term_window_days')) else (K('renewed_term_blocks') if (prev_order_qty > 0 and
      order_qty <= prev_order_qty and newest_order_date != None and DAYS(newest_order_date, NOW) <= K('term_window_days'))
      else std_blocks)
  - prev_pod: >-
      LATEST('continence_shipments', 'delivery_date', date_field='delivery_date', event_type='continence_delivery_confirmation',
      original_continence_shipment_id=prev_id)
  - horizon_blocks: >-
      0 if order_through == None else MX(0, int((DAYS(NOW, order_through) - (MX(0, prev_days - DAYS(prev_pod, NOW)) if
      (prev_pod != None and DAYS(prev_ship, prev_pod) > K('slow_delivery_days')) else ((prev_days - DAYS(prev_ship, NOW))
      if (prev_ship != None and prev_days - DAYS(prev_ship, NOW) > 0) else 0))) / 30))
  - kits_recent: >-
      COUNT('continence_shipments', within_months=K('kit_recent_months'), date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4353')
  - kits_year_units: >-
      SUM('continence_shipments', 'units', within_months=K('kit_year_months'), date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4353')
  - denied_per30: >-
      MX(0, order_qty + kit_qty - allowance) if kits_recent > 0 else (MX(0, order_qty + int(kits_year_units / 12) - allowance)
      if kits_year_units > 0 else MX(0, order_qty - allowance))
  - rush_count: >-
      COUNT('continence_shipments', within_months=12, date_field='ship_date', event_type='continence_refill_shipment',
      shipping_method='expedited')
  - margin_per30: >-
      K('rush_margin_per_30_days') if rush_count > 0 else (K('raise_margin_per_30_days') if (prev_order_qty > 0 and order_qty
      > prev_order_qty and newest_order_date != None and DAYS(newest_order_date, NOW) <= K('raise_margin_days')) else
      0)
  - cushion_days: >-
      K('heavy_use_cushion_days') if (LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', event_type='continence_order_receipt',
      item_code='A4351') or 0) >= K('heavy_use_per_30_days') else (K('regular_use_cushion_days') if order_qty >= K('regular_use_per_30_days')
      else 0)
  - notice_blocks: MN(term_blocks, horizon_blocks)
  - cushion_units: int(denied_per30 * cushion_days / 30)
  - result: (denied_per30 + margin_per30) * notice_blocks + cushion_units if order_qty > 0 else 0
  compute_basis:
    std_blocks: The term blocks are the tier's standard supply days per shipment divided by 30.
    allowance: >-
      The expected-denial quantity per 30 days is the newest written order's quantity less the straight-tip allowance
      of 200 units per 30 days, never below zero.
    order_qty: >-
      The newest written order is the straight-tip order with the latest order date, with its quantity per 30 days and
      its valid-through date; the newest kit order is the closed-system kit (A4353) order with the latest order date.
    prev_ship: >-
      The previous refill is the program's straight-tip refill with the latest ship date, and the earlier order is the
      written order behind the authorization grant that previous refill drew on; a program with no earlier straight-tip
      refill has no earlier order.
    term_blocks: >-
      When the program has an earlier order, the newest written order asks more per 30 days than it, and the newest order
      is dated no more than 180 calendar days before the signing date, the term blocks are replaced by twelve 30-day blocks,
      the one-year span a notice for repeated supplies may cover. When the program has an earlier order, the newest order
      asks no more than it and is dated no more than 180 calendar days before the signing date, the term blocks are replaced
      by six. Otherwise the term blocks stay those of one standard shipment.
    prev_pod: >-
      When the proof of delivery for the previous refill shows a delivery date more than 2 calendar days after its ship
      date,
    horizon_blocks: >-
      When the proof of delivery for the previous refill shows a delivery date more than 2 calendar days after its ship
      date, the order horizon is counted instead from that delivery date plus the previous refill's supply days, or from
      the signing date when that date is already past. Otherwise, when the previous refill's ship date plus its supply
      days falls after the signing date, it is counted instead from that date. Otherwise it stays counted from the signing
      date.
    kits_recent: When closed-system catheter kits shipped on the program within the last 3 calendar months,
    kits_year_units: When kits shipped within the last 12 calendar months but none within the last 3,
    denied_per30: >-
      When closed-system catheter kits shipped on the program within the last 3 calendar months, the expected-denial quantity
      per 30 days is replaced by the newest written order's quantity plus the newest kit order's quantity per 30 days,
      less the allowance, because the payer counts both against the same monthly limit. When kits shipped within the last
      12 calendar months but none within the last 3, it is replaced by the newest written order's quantity plus one twelfth
      of the kit units shipped in those 12 months, rounded down, less the allowance. Otherwise it stays the newest written
      order's quantity less the allowance. None of these is below zero.
    rush_count: >-
      When a refill of the program shipped by customer-requested expedited shipping within the last 12 calendar months,
    margin_per30: >-
      When a refill of the program shipped by customer-requested expedited shipping within the last 12 calendar months,
      10 units per 30 days are added to the notice units for each of the notice blocks. When no such refill shipped and
      the newest written order asks more than the earlier order and is dated no more than 60 calendar days before the
      signing date, 5 units per 30 days are added for each of the notice blocks. Otherwise nothing is added.
    cushion_days: >-
      When the newest written order is for 240 or more units per 30 days, the expected-denial quantity per 30 days times
      5 days divided by 30, rounded down, is added to the notice units. When it is for at least 180 but fewer than 240
      units per 30 days, the expected-denial quantity per 30 days times 3 days divided by 30, rounded down, is added.
      Otherwise nothing is added.
    notice_blocks: The notice blocks are the term blocks or the order horizon, whichever is fewer.
    cushion_units: >-
      Each adjustment set out below changes the notice units as that adjustment states: every replacement of a standard
      quantity is made first and the quantities resting on it are counted again, then every addition is made.
    result: >-
      Each adjustment set out below changes the notice units as that adjustment states: every replacement of a standard
      quantity is made first and the quantities resting on it are counted again, then every addition is made.
  factors:
  - id: notice_term_rule
    effect: parameter
    decides: term_blocks
    bindings:
    - term_blocks
    ladder:
    - when: >-
        an earlier order exists AND the newest order asks more per 30 days AND it is dated no more than 180 days before
        the signing date
      value: K('raised_term_blocks')
    - when: >-
        an earlier order exists AND the newest order asks no more AND it is dated no more than 180 days before the signing
        date
      value: K('renewed_term_blocks')
    - when: otherwise
      value: the term blocks stay those of one standard shipment
    baseline:
      term_blocks: std_blocks
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: order_horizon_rule
    effect: method
    decides: horizon_blocks
    bindings:
    - prev_pod
    - horizon_blocks
    ladder:
    - when: the previous refill's proof of delivery is more than 2 days after its ship date
      method: >-
        the horizon is counted instead from the delivery date plus the previous refill's supply days, or from the signing
        date when that date is past
    - when: no slow delivery AND the previous refill's ship date plus supply days falls after the signing date
      method: the horizon is counted instead from the previous refill's ship date plus its supply days
    - when: otherwise
      method: the horizon stays counted from the signing date
    baseline:
      horizon_blocks: 0 if order_through == None else MX(0, int(DAYS(NOW, order_through) / 30))
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: expected_denial_basis
    effect: parameter
    decides: denied_per30
    bindings:
    - kits_recent
    - kits_year_units
    - denied_per30
    ladder:
    - when: closed-system kits shipped on the program within the last 3 calendar months
      value: >-
        replaced by the newest straight-tip quantity plus the newest kit order's quantity, less the allowance
    - when: kits shipped within the last 12 calendar months but none within the last 3
      value: >-
        replaced by the newest straight-tip quantity plus one twelfth of the 12-month kit units, less the allowance
    - when: otherwise
      value: stays the newest straight-tip quantity less the allowance
    baseline:
      denied_per30: MX(0, order_qty - allowance)
    evidence:
    - history
    cross_difficulty: null
  - id: shortfall_margin_rule
    effect: parameter
    decides: margin_per30
    bindings:
    - rush_count
    - margin_per30
    ladder:
    - when: >-
        a refill of the program shipped by customer-requested expedited shipping within the last 12 calendar months
      value: 10 units per 30 days added for each notice block (K('rush_margin_per_30_days'))
    - when: no such refill AND the newest order asks more than the earlier order AND is no more than 60 days old
      value: 5 units per 30 days added for each notice block (K('raise_margin_per_30_days'))
    - when: otherwise
      value: nothing added (0)
    baseline:
      margin_per30: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: delivery_cushion_rule
    effect: parameter
    decides: cushion_days
    bindings:
    - cushion_days
    ladder:
    - when: the newest straight-tip order is for 240 or more units per 30 days
      value: 5 days of the expected-denial quantity added (K('heavy_use_cushion_days'))
    - when: it is for at least 180 but fewer than 240 units per 30 days
      value: 3 days of the expected-denial quantity added (K('regular_use_cushion_days'))
    - when: otherwise
      value: nothing added (0)
    baseline:
      cushion_days: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The term blocks are the tier's standard supply days per shipment divided by 30. The order horizon is the whole 30-day
      blocks from the signing date to the newest written order's valid-through date, never below zero. The notice blocks
      are the term blocks or the order horizon, whichever is fewer. The expected-denial quantity per 30 days is the newest
      written order's quantity less the straight-tip allowance of 200 units per 30 days, never below zero. The notice
      units are the expected-denial quantity per 30 days times the notice blocks.
    params:
    - straight_tip_allowance_per_30_days
    - supply_days_per_shipment
  inputs:
    history:
    - table: continence_orders
      aggregate: latest
      field: quantity_per_30_days
      filters:
        event_type: continence_order_receipt
        item_code: A4351
    - table: continence_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: continence_refill_shipment
        item_code: A4351
    - table: continence_shipments
      aggregate: count
      field: continence_shipment_id
      within_months: 12
      filters:
        event_type: continence_refill_shipment
        shipping_method: expedited
    - table: continence_shipments
      aggregate: sum
      field: units
      within_months: 12
      filters:
        event_type: continence_refill_shipment
        item_code: A4353
    cross_category: []
- id: continence_ext_hardship_waiver
  base_policy_refs:
  - continence_evt_patient_account
  - continence_holds_and_closure
  overwrite:
  - base_policy: continence_evt_patient_account
    superseded_clause: only for postings named on a hardship application whose request status is approved
    replaced_by: >-
      For a hardship waiver this policy handles, and only for such a waiver, an approved hardship application reaches
      the posting it names and, through the look-back, the program's other remittance postings this policy names; every
      balance adjustment other than such a hardship waiver remains under the base rule.
  - base_policy: continence_evt_patient_account
    superseded_clause: each against the one posting it adjusts and never for more than that posting's unpaid remainder
    replaced_by: >-
      For a hardship waiver this policy handles, and only for such a waiver, the single adjustment is posted against the
      named posting and carries the whole waiver this policy computes, even where that is more than the named posting's
      unpaid remainder; every other balance adjustment is still posted against the one posting it adjusts and never for
      more than that posting's unpaid remainder.
  - base_policy: continence_evt_patient_account
    superseded_clause: a payment is applied to the oldest unpaid posting first
    replaced_by: >-
      For a hardship waiver this policy handles, and only for such a waiver, the waived amount is counted by this policy's open-amount deduction, which sets the customer's recent payments against the waived amount first; for every other purpose a payment is still applied to the oldest unpaid posting first.
  trigger: state_due
  subject:
  - continence_balance_adjustment
  computes: amount
  target_tool: post_hardship_waiver_d1a5476f
  params:
    full_share: 1.0
    open_balance_share: 0.75
    standard_share: 0.5
    old_posting_days: 180
    aged_posting_days: 90
    old_posting_bonus: 0.15
    aged_posting_bonus: 0.1
    recent_application_days: 120
    application_year_days: 365
    lookback_months: 6
    payment_credit_months: 3
  rule: >-
    This policy settles the amount of the hardship waiver Larkfield posts on a continence program whose hardship application
    is approved, on tiers where hardship waivers are allowed; the approval is the financial counseling team's confirmation
    of household income, and a waiver is never posted on the customer's statement alone. A waiver owed under an approved
    application is posted as soon as it is found, whatever the customer called about. For a hardship waiver this policy
    handles, and only for such a waiver, an approved hardship application reaches the posting it names and, through the
    look-back, the program's other remittance postings this policy names; every balance adjustment other than such a hardship
    waiver remains under the base rule. For a hardship waiver this policy handles, and only for such a waiver, the single
    adjustment is posted against the named posting and carries the whole waiver this policy computes, even where that
    is more than the named posting's unpaid remainder; every other balance adjustment is still posted against the one
    posting it adjusts and never for more than that posting's unpaid remainder. For a hardship waiver this policy handles,
    and only for such a waiver, the waived amount is counted by this policy's open-amount deduction, which sets the customer's recent payments against the waived amount first; for every other purpose a payment is still
    applied to the oldest unpaid posting first. Records read. The application is the program's approved hardship application
    with the latest received date, and the named posting is the posting it names, with its amount and posting date. When
    the program carries no approved hardship application, no waiver is owed. Standard method. The waived amount is the
    named posting's amount. The waiver share is one half. The waiver is the waived amount times the waiver share, rounded
    to the nearest cent on the final figure only. Each adjustment set out below changes the waiver as that adjustment
    states: amounts are added to or taken from the waived amount, which never falls below zero, the waiver share is replaced
    before anything is added to it, and the share never exceeds the whole of the waived amount. Look-back. When the application
    was received no more than 120 calendar days before the waiver date, the program's remittance postings dated within
    the last 6 calendar months are added to the waived amount. When it was received more than 120 but no more than 365
    days before, the program's remittance postings of the latest remittance posting date, the most recent statement batch,
    are added. Otherwise nothing is added. The named posting, when it is itself one of those remittance postings, is counted
    once. Open-amount deduction. When the customer has payments posted on the program within the last 3 calendar months,
    those payments are taken from the waived amount, set against it first. When there are no such payments and a balance
    adjustment already stands against the named posting, that adjustment is taken from the waived amount. Otherwise nothing
    is taken. Hardship share. When the customer also holds an Ostomy Supply Program in active status and the customer's
    latest ostomy hardship application is approved and was received within the last 12 calendar months, the waiver share
    is replaced by the whole. When the customer holds an active Ostomy Supply Program that carries a balance due above
    zero and no such approved application, the waiver share is replaced by three quarters. Otherwise the waiver share
    stays one half. Posting-age addition. When the named posting is dated more than 180 calendar days before the waiver
    date, 0.15 is added to the waiver share; when it is dated more than 90 but no more than 180 days before, 0.10 is added;
    otherwise nothing is added. The waiver is posted with reason hardship waiver, and every other eligibility of the base
    patient-account rule stays in force.
  prerequisite: []
  cross_category:
  - category: ostomy
    as: branch
    reads:
    - status
    - patient_balance_due
    - ostomy_requests.request_status
    note: >-
      The hardship share reads the customer's active Ostomy Supply Programs, their balance due and the latest ostomy hardship
      application to place the customer on the whole, three-quarter or half share.
  compute:
  - named_id: >-
      LATEST('continence_requests', 'continence_ledger_id', date_field='received_at', request_type='hardship_application',
      request_status='approved')
  - app_date: >-
      LATEST('continence_requests', 'received_at', date_field='received_at', request_type='hardship_application', request_status='approved')
  - named_amt: >-
      LATEST('continence_billing', 'amount', date_field='posting_date', continence_ledger_id=named_id) or 0
  - named_date: >-
      LATEST('continence_billing', 'posting_date', date_field='posting_date', continence_ledger_id=named_id)
  - named_type: LATEST('continence_billing', 'event_type', date_field='posting_date', continence_ledger_id=named_id)
  - last_rem_date: >-
      LATEST('continence_billing', 'posting_date', date_field='posting_date', event_type='continence_claim_adjudication')
  - window_sum: >-
      (SUM('continence_billing', 'amount', within_months=K('lookback_months'), date_field='posting_date', event_type='continence_claim_adjudication')
      - (named_amt if (named_type == 'continence_claim_adjudication' and named_date != None and MONTHS(named_date, NOW)
      < K('lookback_months')) else 0)) if (app_date != None and DAYS(app_date, NOW) <= K('recent_application_days')) else
      ((SUM('continence_billing', 'amount', event_type='continence_claim_adjudication', posting_date=last_rem_date) -
      (named_amt if (named_type == 'continence_claim_adjudication' and named_date == last_rem_date) else 0)) if (app_date
      != None and DAYS(app_date, NOW) <= K('application_year_days')) else 0)
  - paid3: >-
      SUM('continence_billing', 'amount', within_months=K('payment_credit_months'), date_field='posting_date', event_type='continence_patient_payment')
  - named_adj: >-
      SUM('continence_billing', 'amount', event_type='continence_balance_adjustment', original_continence_ledger_id=named_id)
  - deduction: paid3 if paid3 > 0 else (named_adj if named_adj > 0 else 0)
  - ostomy_active: EXISTS('ostomy', status='active')
  - ostomy_balance: XMAX('ostomy', 'ostomy_programs', 'patient_balance_due', status='active')
  - ostomy_hs_status: >-
      XLATEST('ostomy', 'ostomy_requests', 'request_status', date_field='received_at', request_type='hardship_application')
  - ostomy_hs_date: >-
      XLATEST('ostomy', 'ostomy_requests', 'received_at', date_field='received_at', request_type='hardship_application')
  - ostomy_hs_ok: ostomy_hs_status == 'approved' and MONTHS(ostomy_hs_date, NOW) < 12
  - base_share: >-
      K('full_share') if (ostomy_active and ostomy_hs_ok) else (K('open_balance_share') if (ostomy_active and ostomy_balance
      > 0) else K('standard_share'))
  - age_bonus: >-
      0 if named_date == None else (K('old_posting_bonus') if DAYS(named_date, NOW) > K('old_posting_days') else (K('aged_posting_bonus')
      if DAYS(named_date, NOW) > K('aged_posting_days') else 0))
  - open_amt: MX(0, named_amt + window_sum - deduction)
  - share: MN(K('full_share'), base_share + age_bonus)
  - result: RND(open_amt * share, 2) if named_id != None else 0
  compute_basis:
    named_id: >-
      The application is the program's approved hardship application with the latest received date, and the named posting
      is the posting it names, with its amount and posting date.
    app_date: The application is the program's approved hardship application with the latest received date
    named_amt: The waived amount is the named posting's amount.
    last_rem_date: >-
      the program's remittance postings of the latest remittance posting date, the most recent statement batch, are added.
    window_sum: >-
      When the application was received no more than 120 calendar days before the waiver date, the program's remittance
      postings dated within the last 6 calendar months are added to the waived amount. When it was received more than
      120 but no more than 365 days before, the program's remittance postings of the latest remittance posting date, the
      most recent statement batch, are added. Otherwise nothing is added. The named posting, when it is itself one of
      those remittance postings, is counted once.
    paid3: When the customer has payments posted on the program within the last 3 calendar months,
    named_adj: a balance adjustment already stands against the named posting,
    deduction: >-
      When the customer has payments posted on the program within the last 3 calendar months, those payments are taken
      from the waived amount, set against it first. When there are no such payments and a balance adjustment already stands
      against the named posting, that adjustment is taken from the waived amount. Otherwise nothing is taken.
    ostomy_active: "When the customer also holds an Ostomy Supply Program in active status"
    ostomy_balance: >-
      When the customer holds an active Ostomy Supply Program that carries a balance due above zero and no such approved
      application,
    ostomy_hs_status: >-
      and the customer's latest ostomy hardship application is approved and was received within the last 12 calendar months
    ostomy_hs_ok: >-
      and the customer's latest ostomy hardship application is approved and was received within the last 12 calendar months
    base_share: >-
      When the customer also holds an Ostomy Supply Program in active status and the customer's latest ostomy hardship
      application is approved and was received within the last 12 calendar months, the waiver share is replaced by the
      whole. When the customer holds an active Ostomy Supply Program that carries a balance due above zero and no such
      approved application, the waiver share is replaced by three quarters. Otherwise the waiver share stays one half.
    age_bonus: >-
      When the named posting is dated more than 180 calendar days before the waiver date, 0.15 is added to the waiver
      share; when it is dated more than 90 but no more than 180 days before, 0.10 is added; otherwise nothing is added.
    open_amt: >-
      Each adjustment set out below changes the waiver as that adjustment states: amounts are added to or taken from the
      waived amount, which never falls below zero, the waiver share is replaced before anything is added to it, and the
      share never exceeds the whole of the waived amount.
    share: >-
      Each adjustment set out below changes the waiver as that adjustment states: amounts are added to or taken from the
      waived amount, which never falls below zero, the waiver share is replaced before anything is added to it, and the
      share never exceeds the whole of the waived amount.
    result: >-
      Each adjustment set out below changes the waiver as that adjustment states: amounts are added to or taken from the
      waived amount, which never falls below zero, the waiver share is replaced before anything is added to it, and the
      share never exceeds the whole of the waived amount.
  factors:
  - id: hardship_lookback_rule
    effect: method
    decides: window_sum
    bindings:
    - last_rem_date
    - window_sum
    ladder:
    - when: the approved application was received no more than 120 days before the waiver date
      method: >-
        a time window: the remittance postings dated within the last 6 calendar months are added to the waived amount,
        the named posting counted once
    - when: it was received more than 120 but no more than 365 days before
      method: >-
        a statement window: the remittance postings of the latest remittance posting date are added to the waived amount,
        the named posting counted once
    - when: otherwise
      method: 'no window: nothing is added to the waived amount'
    baseline:
      window_sum: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: open_amount_basis
    effect: parameter
    decides: deduction
    bindings:
    - paid3
    - named_adj
    - deduction
    ladder:
    - when: payments posted on the program within the last 3 calendar months
      value: those payments are taken from the waived amount
    - when: no such payments AND a balance adjustment already stands against the named posting
      value: that adjustment is taken from the waived amount
    - when: otherwise
      value: nothing is taken (0)
    baseline:
      deduction: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: hardship_share_rule
    effect: parameter
    decides: base_share
    bindings:
    - ostomy_active
    - ostomy_balance
    - ostomy_hs_status
    - ostomy_hs_date
    - ostomy_hs_ok
    - base_share
    ladder:
    - when: >-
        an active Ostomy Supply Program AND the customer's latest ostomy hardship application approved and received within
        the last 12 calendar months
      value: the waiver share is replaced by the whole (K('full_share'))
    - when: >-
        an active Ostomy Supply Program AND a balance due above zero on it, with no such approved application
      value: the waiver share is replaced by three quarters (K('open_balance_share'))
    - when: otherwise
      value: the waiver share stays one half (K('standard_share'))
    baseline:
      base_share: K('standard_share')
    evidence:
    - cross_category
    - history
    cross_difficulty: ostomy
  - id: posting_age_rule
    effect: parameter
    decides: age_bonus
    bindings:
    - age_bonus
    ladder:
    - when: the named posting is dated more than 180 days before the waiver date
      value: 0.15 is added to the waiver share (K('old_posting_bonus'))
    - when: it is dated more than 90 but no more than 180 days before
      value: 0.10 is added to the waiver share (K('aged_posting_bonus'))
    - when: otherwise
      value: nothing is added (0)
    baseline:
      age_bonus: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The waived amount is the named posting's amount. The waiver share is one half. The waiver is the waived amount times
      the waiver share, rounded to the nearest cent on the final figure only.
    params:
    - standard_share
  inputs:
    history:
    - table: continence_requests
      aggregate: latest
      field: continence_ledger_id
      filters:
        request_type: hardship_application
        request_status: approved
    - table: continence_billing
      aggregate: sum
      field: amount
      within_months: 6
      filters:
        event_type: continence_claim_adjudication
    - table: continence_billing
      aggregate: sum
      field: amount
      within_months: 3
      filters:
        event_type: continence_patient_payment
    - category: ostomy
      table: ostomy_requests
      aggregate: latest
      field: request_status
      filters:
        request_type: hardship_application
    cross_category:
    - ostomy
- id: continence_ext_noncovered_catheter_charge
  base_policy_refs:
  - continence_liability_notice
  - continence_evt_denials_and_appeals
  - continence_evt_quantity_limits
  overwrite:
  - base_policy: continence_liability_notice
    superseded_clause: charged at the Larkfield cash price of the units concerned
    replaced_by: >-
      For a straight-tip catheter charge on the Commercial HMO tier that this policy settles, and only for such a charge,
      the units charged and their price are those this policy states; every other non-covered item charge is still charged
      at the Larkfield cash price of the units concerned.
  - base_policy: continence_evt_denials_and_appeals
    superseded_clause: >-
      otherwise the denial is not appealed and is handled as a non-covered amount under continence_liability_notice.
    replaced_by: >-
      For a straight-tip CO-151 denial on the Commercial HMO tier that this policy settles, and only for such a denial,
      the denial is handled as a non-covered amount only when no over-limit justification record is on file for the program,
      and a denial whose records on file are all dated after the date of service is absorbed by Larkfield; every other
      denial that is not appealed is still handled as a non-covered amount under continence_liability_notice.
  - base_policy: continence_liability_notice
    superseded_clause: >-
      A non_covered_item charge requires a liability notice signed on or before the ship date covering that item and at
      least those units
    replaced_by: >-
      For a straight-tip catheter charge on the Commercial HMO tier that this policy settles, and only for such a charge,
      the notice that counts is the customer's current plan member waiver for the straight-tip catheter, the one with
      the latest notice date, which replaces every earlier waiver: the charge is owed only when that waiver was signed
      on or before the ship date, and the waiver limits the units charged as this policy states; every other non_covered_item
      charge still requires a liability notice signed on or before the ship date covering that item and at least those
      units.
  trigger: state_due
  subject:
  - continence_patient_charge
  computes: amount
  target_tool: post_noncovered_charge_0f5c8cfb
  params:
    straight_tip_allowance_per_30_days: 150
    cash_price_a4351: 1.85
    kit_recent_months: 3
    kit_year_months: 12
    fresh_assistance_months: 6
    aging_assistance_months: 12
    fresh_assistance_share: 0.5
    aging_assistance_share: 0.75
  rule: >-
    This policy settles the non-covered item charge Larkfield posts on a Commercial HMO continence program for the straight-tip
    intermittent catheters (A4351) of the program's latest straight-tip refill when the plan denied its claim line and
    the denial leaves the customer liable under the plan member waiver they signed. A charge owed under a signed waiver
    is posted as soon as the denial stands, whatever the customer called about, and it is posted against the denied refill.
    For a straight-tip catheter charge on the Commercial HMO tier that this policy settles, and only for such a charge,
    the units charged and their price are those this policy states; every other non-covered item charge is still charged
    at the Larkfield cash price of the units concerned. For a straight-tip CO-151 denial on the Commercial HMO tier that
    this policy settles, and only for such a denial, the denial is handled as a non-covered amount only when no over-limit
    justification record is on file for the program, and a denial whose records on file are all dated after the date of
    service is absorbed by Larkfield; every other denial that is not appealed is still handled as a non-covered amount
    under continence_liability_notice. For a straight-tip catheter charge on the Commercial HMO tier that this policy
    settles, and only for such a charge, the notice that counts is the customer's current plan member waiver for the straight-tip
    catheter, the one with the latest notice date, which replaces every earlier waiver: the charge is owed only when that
    waiver was signed on or before the ship date, and the waiver limits the units charged as this policy states; every
    other non_covered_item charge still requires a liability notice signed on or before the ship date covering that item
    and at least those units. Records read. The refill concerned is the program's straight-tip refill with the latest
    ship date, with its units and supply days; its denial is the denial posted against its original claim; the plan's
    straight-tip limit for the refill is 150 units per 30 days for its supply days; the customer's current waiver is the
    straight-tip plan member waiver with the latest notice date, which replaces every earlier waiver; the newest kit order
    is the closed-system kit (A4353) order with the latest order date. Standard method. The refill's excess over the limit
    is its units less the limit for its supply days, never below zero and never more than the refill's units. Larkfield
    absorbs a denied line, so the units concerned are none. The units charged are the units concerned, never more than
    the refill's units. The price is the Larkfield cash price of 1.85 per straight-tip catheter. The charge is the units
    charged times the price, rounded to the nearest cent on the final figure only. Each adjustment set out below changes
    the charge as that adjustment states: every replacement of a standard quantity and every addition to one is made first
    and the quantities resting on it are counted again, every limit is applied next, and every change to the price is
    made last. Denial route. When the denial is CO-151 (quantity not supported) and no over-limit justification record
    is on file for the program, the units concerned are replaced by the refill's excess over the limit. When the denial
    is PR-204 (not covered under the plan), the units concerned are replaced by all of the refill's units. Otherwise they
    stay none: a CO-151 denial with a record dated on or before the ship date goes to appeal, one whose records are all
    dated after the ship date is Larkfield's write-off, and a CO-197 denial goes to appeal, because a refill ships only
    on an authorization grant valid on its ship date. Kit counting. When closed-system catheter kits shipped on the program
    within the last 3 calendar months, the newest kit order's quantity per 30 days, for the refill's supply days, is added
    to the refill's units in its excess over the limit, because the plan counts the kits against the same monthly limit.
    When kits shipped within the last 12 calendar months but none within the last 3, one twelfth of the kit units shipped
    in those 12 months, rounded down, per 30 days, is added instead. Otherwise nothing is added. Waiver cover. When no
    straight-tip plan member waiver stands on the program, or the current waiver is dated after the refill's ship date,
    the units charged are replaced by none and the amount is Larkfield's write-off. When the current waiver is dated on
    or before the ship date and covers fewer units than the refill holds, the units charged are never more than the waiver's
    units. Otherwise the units charged are not limited further. Assistance freshness. When the customer's Continuous Glucose
    Monitoring Supply Program carries a hardship application approved and received within the last 6 calendar months,
    the price is multiplied by one half. When the newest such approved application was received within the last 12 calendar
    months but not the last 6, the price is multiplied by three quarters. Otherwise the price stays the cash price. The
    charge is posted with charge type non-covered item, and every other eligibility of the base liability-notice and denial
    rules stays in force.
  prerequisite: []
  cross_category:
  - category: cgm
    as: branch
    reads:
    - cgm_requests.request_status
    - cgm_requests.received_at
    note: The assistance freshness reads the customer's newest approved CGM hardship application.
  compute:
  - ship_id: >-
      LATEST('continence_shipments', 'continence_shipment_id', date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4351')
  - ship_date: >-
      LATEST('continence_shipments', 'ship_date', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
  - ship_units: >-
      LATEST('continence_shipments', 'units', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
      or 0
  - ship_days: >-
      LATEST('continence_shipments', 'supply_days', date_field='ship_date', event_type='continence_refill_shipment', item_code='A4351')
      or 30
  - claim_id: >-
      LATEST('continence_billing', 'continence_ledger_id', date_field='posting_date', event_type='continence_claim_submission',
      submission_type='original', continence_shipment_id=ship_id)
  - denial_code: >-
      LATEST('continence_billing', 'denial_code', date_field='posting_date', event_type='continence_claim_denial', original_continence_ledger_id=claim_id)
  - limit_units: K('straight_tip_allowance_per_30_days') * ship_days / 30
  - kit_qty: >-
      LATEST('continence_orders', 'quantity_per_30_days', date_field='order_date', event_type='continence_order_receipt',
      item_code='A4353') or 0
  - rec_count: >-
      COUNT('continence_orders', event_type='continence_medical_record_receipt', record_purpose='over_limit_justification')
  - route: 1 if (denial_code == 'CO-151' and rec_count == 0) else (2 if denial_code == 'PR-204' else 0)
  - kits_recent: >-
      COUNT('continence_shipments', within_months=K('kit_recent_months'), date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4353')
  - kits_year_units: >-
      SUM('continence_shipments', 'units', within_months=K('kit_year_months'), date_field='ship_date', event_type='continence_refill_shipment',
      item_code='A4353')
  - kits_counted: kit_qty if kits_recent > 0 else (int(kits_year_units / 12) if kits_year_units > 0 else 0)
  - notice_units_on_file: >-
      LATEST('continence_orders', 'notice_units', date_field='notice_date', event_type='continence_liability_notice_signed',
      item_code='A4351', notice_type='plan_member_waiver')
  - notice_date_on_file: >-
      LATEST('continence_orders', 'notice_date', date_field='notice_date', event_type='continence_liability_notice_signed',
      item_code='A4351', notice_type='plan_member_waiver')
  - waiver_cap: >-
      0 if (notice_date_on_file == None or ship_date == None or notice_date_on_file > ship_date) else (notice_units_on_file
      if notice_units_on_file < ship_units else ship_units)
  - cgm_hs_date: >-
      XLATEST('cgm', 'cgm_requests', 'received_at', date_field='received_at', request_type='hardship_application', request_status='approved')
  - fresh_share: >-
      K('fresh_assistance_share') if (cgm_hs_date != None and MONTHS(cgm_hs_date, NOW) < K('fresh_assistance_months'))
      else (K('aging_assistance_share') if (cgm_hs_date != None and MONTHS(cgm_hs_date, NOW) < K('aging_assistance_months'))
      else 1)
  - excess_units: MN(ship_units, MX(0, ship_units + kits_counted * ship_days / 30 - limit_units))
  - units_concerned: excess_units if route == 1 else (ship_units if route == 2 else 0)
  - charged_units: MN(units_concerned, waiver_cap)
  - result: RND(charged_units * K('cash_price_a4351') * fresh_share, 2)
  compute_basis:
    ship_id: >-
      The refill concerned is the program's straight-tip refill with the latest ship date, with its units and supply days;
      its denial is the denial posted against its original claim;
    denial_code: its denial is the denial posted against its original claim;
    limit_units: the plan's straight-tip limit for the refill is 150 units per 30 days for its supply days;
    kit_qty: the newest kit order is the closed-system kit (A4353) order with the latest order date.
    rec_count: >-
      When the denial is CO-151 (quantity not supported) and no over-limit justification record is on file for the program,
    route: >-
      When the denial is CO-151 (quantity not supported) and no over-limit justification record is on file for the program,
      the units concerned are replaced by the refill's excess over the limit. When the denial is PR-204 (not covered under
      the plan), the units concerned are replaced by all of the refill's units. Otherwise they stay none: a CO-151 denial
      with a record dated on or before the ship date goes to appeal, one whose records are all dated after the ship date
      is Larkfield's write-off, and a CO-197 denial goes to appeal, because a refill ships only on an authorization grant
      valid on its ship date.
    kits_recent: When closed-system catheter kits shipped on the program within the last 3 calendar months,
    kits_year_units: When kits shipped within the last 12 calendar months but none within the last 3,
    kits_counted: >-
      When closed-system catheter kits shipped on the program within the last 3 calendar months, the newest kit order's
      quantity per 30 days, for the refill's supply days, is added to the refill's units in its excess over the limit,
      because the plan counts the kits against the same monthly limit. When kits shipped within the last 12 calendar months
      but none within the last 3, one twelfth of the kit units shipped in those 12 months, rounded down, per 30 days,
      is added instead. Otherwise nothing is added.
    notice_date_on_file: >-
      the customer's current waiver is the straight-tip plan member waiver with the latest notice date, which replaces
      every earlier waiver;
    waiver_cap: >-
      When no straight-tip plan member waiver stands on the program, or the current waiver is dated after the refill's
      ship date, the units charged are replaced by none and the amount is Larkfield's write-off. When the current waiver
      is dated on or before the ship date and covers fewer units than the refill holds, the units charged are never more
      than the waiver's units. Otherwise the units charged are not limited further.
    cgm_hs_date: >-
      When the customer's Continuous Glucose Monitoring Supply Program carries a hardship application approved and received
      within the last 6 calendar months,
    fresh_share: >-
      When the customer's Continuous Glucose Monitoring Supply Program carries a hardship application approved and received
      within the last 6 calendar months, the price is multiplied by one half. When the newest such approved application
      was received within the last 12 calendar months but not the last 6, the price is multiplied by three quarters. Otherwise
      the price stays the cash price.
    excess_units: >-
      The refill's excess over the limit is its units less the limit for its supply days, never below zero and never more
      than the refill's units.
    units_concerned: >-
      Each adjustment set out below changes the charge as that adjustment states: every replacement of a standard quantity
      and every addition to one is made first and the quantities resting on it are counted again, every limit is applied
      next, and every change to the price is made last.
    charged_units: The units charged are the units concerned, never more than the refill's units.
    result: >-
      The charge is the units charged times the price, rounded to the nearest cent on the final figure only.
  factors:
  - id: denial_route_rule
    effect: method
    decides: route
    bindings:
    - rec_count
    - route
    ladder:
    - when: the denial is CO-151 AND no over-limit justification record is on file for the program
      method: the units concerned are replaced by the refill's excess over the limit
    - when: the denial is PR-204
      method: the units concerned are replaced by all of the refill's units
    - when: otherwise
      method: >-
        the units concerned stay none (appeal, or Larkfield's write-off when every record on file is dated after the ship
        date)
    baseline:
      route: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: kit_count_rule
    effect: parameter
    decides: kits_counted
    bindings:
    - kits_recent
    - kits_year_units
    - kits_counted
    ladder:
    - when: closed-system kits shipped on the program within the last 3 calendar months
      value: the newest kit order's quantity per 30 days is added to the refill's units in the excess
    - when: kits shipped within the last 12 calendar months but none within the last 3
      value: one twelfth of the 12-month kit units, rounded down, is added to the refill's units in the excess
    - when: otherwise
      value: nothing is added (0)
    baseline:
      kits_counted: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: waiver_cover_rule
    effect: parameter
    decides: waiver_cap
    bindings:
    - notice_units_on_file
    - notice_date_on_file
    - waiver_cap
    ladder:
    - when: >-
        no straight-tip plan member waiver on file, OR the current (newest) waiver dated after the refill's ship date
      value: the units charged are replaced by none (0)
    - when: the current waiver is dated on or before the ship date AND covers fewer units than the refill holds
      value: the units charged are never more than the waiver's units
    - when: otherwise
      value: the units charged are not limited further (the refill's units)
    baseline:
      waiver_cap: ship_units
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: assistance_freshness_rule
    effect: parameter
    decides: fresh_share
    bindings:
    - cgm_hs_date
    - fresh_share
    ladder:
    - when: a CGM hardship application approved and received within the last 6 calendar months
      value: the price is multiplied by one half (K('fresh_assistance_share'))
    - when: >-
        the newest approved CGM hardship application received within the last 12 calendar months but not the last 6
      value: the price is multiplied by three quarters (K('aging_assistance_share'))
    - when: otherwise
      value: the price stays the cash price (1)
    baseline:
      fresh_share: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: cgm
  baseline:
    rule: >-
      The refill's excess over the limit is its units less the limit for its supply days, never below zero and never more
      than the refill's units. Larkfield absorbs a denied line, so the units concerned are none. The units charged are
      the units concerned, never more than the refill's units. The price is the Larkfield cash price of 1.85 per straight-tip
      catheter. The charge is the units charged times the price, rounded to the nearest cent on the final figure only.
    params:
    - cash_price_a4351
  inputs:
    history:
    - table: continence_shipments
      aggregate: latest
      field: units
      filters:
        event_type: continence_refill_shipment
        item_code: A4351
    - table: continence_billing
      aggregate: latest
      field: denial_code
      filters:
        event_type: continence_claim_denial
    - table: continence_shipments
      aggregate: count
      field: continence_shipment_id
      within_months: 3
      filters:
        event_type: continence_refill_shipment
        item_code: A4353
    - table: continence_orders
      aggregate: latest
      field: notice_units
      filters:
        event_type: continence_liability_notice_signed
        item_code: A4351
    - category: cgm
      table: cgm_requests
      aggregate: latest
      field: received_at
      filters:
        request_type: hardship_application
        request_status: approved
    cross_category:
    - cgm
- id: continence_ext_returned_unit_credit
  base_policy_refs:
  - continence_evt_patient_account
  - continence_evt_returns
  overwrite:
  - base_policy: continence_evt_patient_account
    superseded_clause: >-
      return_credit (an accepted self-pay return, for the price paid for the returned units less restocking_fee_pct percent)
    replaced_by: >-
      For a return credit on non-covered straight-tip catheter units of a Commercial HMO program that this policy settles,
      and only for such a credit, the credit covers the accepted returned units this policy allocates to the customer's
      own purchase, at the price and less the restocking charge this policy states; every self-pay return credit remains
      under the base rule.
  trigger: state_due
  subject:
  - continence_balance_adjustment
  computes: amount
  target_tool: post_return_credit_03d701bf
  params:
    straight_tip_allowance_per_30_days: 150
    cash_price_a4351: 1.85
    box_units: 30
    two_box_units: 60
    late_return_days: 30
    mid_return_days: 14
    late_restock_share: 0.2
    mid_restock_share: 0.1
    hardship_relief_recent: 0.5
    hardship_relief_older: 0.75
    tenure_relief_long: 0.75
    tenure_relief_mid: 0.9
  rule: >-
    This policy settles the return credit Larkfield posts on a Commercial HMO continence program when the warehouse has
    accepted unopened straight-tip catheters (A4351) returned from a refill whose units above the plan's limit were charged
    to the customer as a non-covered item; the credit is posted against that non-covered item charge as soon as the receipt
    stands, whatever the customer called about, and the payer-billed part of the return is handled by the corrected claim.
    When the returned refill carries no non-covered item charge, no credit is owed under this policy. For a return credit
    on non-covered straight-tip catheter units of a Commercial HMO program that this policy settles, and only for such
    a credit, the credit covers the accepted returned units this policy allocates to the customer's own purchase, at the
    price and less the restocking charge this policy states; every self-pay return credit remains under the base rule.
    Records read. The returned refill is the shipment named on the program's latest return receipt, and the accepted units
    are the units on its return receipts. The customer's own units of that refill are its units above the plan's straight-tip
    limit of 150 units per 30 days for its supply days, the closed-system kits shipped with it on the same day counted
    against the same limit. The charge is the non-covered item charge posted against the returned refill. Returned units
    come first out of the customer's own units: the corrected claim re-bills the payer only for the units the customer
    kept, so the plan's limit then falls on the kept units and the customer's own units fall one for one with the accepted
    returned units. The credited units are the accepted units or the customer's own units, whichever is fewer. Standard
    method. The price is the Larkfield cash price of 1.85 per catheter. The gross credit is the credited units times the
    price. The credit is the gross credit, rounded to the nearest cent on the final figure only. The restocking basis
    is the gross credit. Each adjustment set out below changes the credit as that adjustment states: every replacement
    of a standard quantity is made first and the quantities resting on it are counted again, every multiplication of a
    standard quantity is made next, and anything withheld is taken from the credit last; the credit never falls below
    zero. Credit price. When a balance adjustment already stands against the charge, the price is replaced by the charge
    less that adjustment, divided by the customer's own units. When no adjustment stands and the charge per customer unit
    is below the cash price, the price is replaced by the charge divided by the customer's own units, the price the customer
    actually paid. Otherwise the price stays the cash price. Restocking form. When the accepted units fill at least one
    box of 30 but fewer than two, the restocking basis is replaced by one box's worth, that is 30 units times the price.
    When they fill less than one box, the restocking basis is replaced by nothing. Otherwise the restocking basis stays
    the gross credit. Restocking schedule. When the warehouse accepted the return more than 30 calendar days after the
    delivery date on the refill's proof of delivery, one fifth of the restocking basis is withheld from the credit. When
    it accepted the return more than 14 but no more than 30 days after delivery, one tenth of the restocking basis is
    withheld. Otherwise nothing is withheld. Hardship relief. When the customer's Continuous Glucose Monitoring Supply
    Program carries a hardship application approved and received within the last 12 calendar months, the restocking basis
    is multiplied by one half. When the newest such approved application was received within the last 24 calendar months
    but not the last 12, it is multiplied by three quarters. Otherwise it is not changed. Tenure relief. When the program
    became active 24 or more whole calendar months before the credit, the restocking basis is multiplied by three quarters.
    When it became active at least 12 but fewer than 24 whole calendar months before, it is multiplied by nine tenths.
    Otherwise it is not changed. The credit is posted with reason return credit, and every other eligibility of the base
    patient-account and returns rules stays in force.
  prerequisite: []
  cross_category:
  - category: cgm
    as: branch
    reads:
    - cgm_requests.request_status
    - cgm_requests.received_at
    note: The hardship relief reads the customer's approved CGM hardship application.
  compute:
  - ret_ship: >-
      LATEST('continence_shipments', 'original_continence_shipment_id', date_field='receipt_date', event_type='continence_return_receipt')
  - accepted: >-
      SUM('continence_shipments', 'units', event_type='continence_return_receipt', original_continence_shipment_id=ret_ship)
  - rs_units: >-
      LATEST('continence_shipments', 'units', date_field='ship_date', continence_shipment_id=ret_ship) or 0
  - rs_days: >-
      LATEST('continence_shipments', 'supply_days', date_field='ship_date', continence_shipment_id=ret_ship) or 0
  - rs_date: LATEST('continence_shipments', 'ship_date', date_field='ship_date', continence_shipment_id=ret_ship)
  - rs_kits: >-
      SUM('continence_shipments', 'units', event_type='continence_refill_shipment', item_code='A4353', ship_date=rs_date)
  - own_units: MX(0, rs_units + rs_kits - K('straight_tip_allowance_per_30_days') * rs_days / 30)
  - charge_id: >-
      LATEST('continence_billing', 'continence_ledger_id', date_field='posting_date', event_type='continence_patient_charge',
      charge_type='non_covered_item', continence_shipment_id=ret_ship)
  - charge_amt: >-
      LATEST('continence_billing', 'amount', date_field='posting_date', event_type='continence_patient_charge', charge_type='non_covered_item',
      continence_shipment_id=ret_ship) or 0
  - credited_units: MN(accepted, own_units)
  - charge_adj: >-
      SUM('continence_billing', 'amount', event_type='continence_balance_adjustment', original_continence_ledger_id=charge_id)
  - price: >-
      ((charge_amt - charge_adj) / own_units if own_units > 0 else 0) if charge_adj > 0 else ((charge_amt / own_units)
      if (own_units > 0 and charge_amt > 0 and charge_amt / own_units < K('cash_price_a4351')) else K('cash_price_a4351'))
  - restock_form: >-
      2 if (SUM('continence_shipments', 'units', event_type='continence_return_receipt', original_continence_shipment_id=ret_ship)
      >= K('box_units') and accepted < K('two_box_units')) else (0 if accepted < K('box_units') else 1)
  - rs_pod: >-
      LATEST('continence_shipments', 'delivery_date', date_field='delivery_date', event_type='continence_delivery_confirmation',
      original_continence_shipment_id=ret_ship)
  - receipt_date: >-
      LATEST('continence_shipments', 'receipt_date', date_field='receipt_date', event_type='continence_return_receipt',
      original_continence_shipment_id=ret_ship)
  - restock: >-
      0 if (rs_pod == None or receipt_date == None) else (K('late_restock_share') if DAYS(rs_pod, receipt_date) > K('late_return_days')
      else (K('mid_restock_share') if DAYS(rs_pod, receipt_date) > K('mid_return_days') else 0))
  - cgm_hs_date: >-
      XLATEST('cgm', 'cgm_requests', 'received_at', date_field='received_at', request_type='hardship_application', request_status='approved')
  - h_relief: >-
      K('hardship_relief_recent') if (cgm_hs_date != None and MONTHS(cgm_hs_date, NOW) < 12) else (K('hardship_relief_older')
      if (cgm_hs_date != None and MONTHS(cgm_hs_date, NOW) < 24) else 1)
  - p_relief: >-
      K('tenure_relief_long') if (F('activated_date') and MONTHS(F('activated_date'), NOW) >= 24) else (K('tenure_relief_mid')
      if (F('activated_date') and MONTHS(F('activated_date'), NOW) >= 12) else 1)
  - gross_credit: credited_units * price
  - box_value: K('box_units') * price
  - restock_basis: >-
      (gross_credit if restock_form == 1 else (box_value if restock_form == 2 else 0)) * h_relief * p_relief
  - restock_charge: restock * restock_basis
  - result: RND(MX(0, gross_credit - restock_charge), 2) if charge_id != None else 0
  compute_basis:
    ret_ship: >-
      The returned refill is the shipment named on the program's latest return receipt, and the accepted units are the
      units on its return receipts.
    accepted: the accepted units are the units on its return receipts.
    rs_kits: the closed-system kits shipped with it on the same day counted against the same limit.
    own_units: >-
      The customer's own units of that refill are its units above the plan's straight-tip limit of 150 units per 30 days
      for its supply days, the closed-system kits shipped with it on the same day counted against the same limit.
    charge_id: The charge is the non-covered item charge posted against the returned refill.
    credited_units: The credited units are the accepted units or the customer's own units, whichever is fewer.
    charge_adj: When a balance adjustment already stands against the charge,
    price: >-
      When a balance adjustment already stands against the charge, the price is replaced by the charge less that adjustment,
      divided by the customer's own units. When no adjustment stands and the charge per customer unit is below the cash
      price, the price is replaced by the charge divided by the customer's own units, the price the customer actually
      paid. Otherwise the price stays the cash price.
    restock_form: >-
      When the accepted units fill at least one box of 30 but fewer than two, the restocking basis is replaced by one
      box's worth, that is 30 units times the price. When they fill less than one box, the restocking basis is replaced
      by nothing. Otherwise the restocking basis stays the gross credit.
    rs_pod: the delivery date on the refill's proof of delivery,
    restock: >-
      When the warehouse accepted the return more than 30 calendar days after the delivery date on the refill's proof
      of delivery, one fifth of the restocking basis is withheld from the credit. When it accepted the return more than
      14 but no more than 30 days after delivery, one tenth of the restocking basis is withheld. Otherwise nothing is
      withheld.
    cgm_hs_date: >-
      When the customer's Continuous Glucose Monitoring Supply Program carries a hardship application approved and received
      within the last 12 calendar months,
    h_relief: >-
      When the customer's Continuous Glucose Monitoring Supply Program carries a hardship application approved and received
      within the last 12 calendar months, the restocking basis is multiplied by one half. When the newest such approved
      application was received within the last 24 calendar months but not the last 12, it is multiplied by three quarters.
      Otherwise it is not changed.
    p_relief: >-
      When the program became active 24 or more whole calendar months before the credit, the restocking basis is multiplied
      by three quarters. When it became active at least 12 but fewer than 24 whole calendar months before, it is multiplied
      by nine tenths. Otherwise it is not changed.
    gross_credit: The gross credit is the credited units times the price.
    box_value: one box's worth, that is 30 units times the price.
    restock_charge: >-
      Each adjustment set out below changes the credit as that adjustment states: every replacement of a standard quantity
      is made first and the quantities resting on it are counted again, every multiplication of a standard quantity is
      made next, and anything withheld is taken from the credit last; the credit never falls below zero.
    result: >-
      Each adjustment set out below changes the credit as that adjustment states: every replacement of a standard quantity
      is made first and the quantities resting on it are counted again, every multiplication of a standard quantity is
      made next, and anything withheld is taken from the credit last; the credit never falls below zero.
    restock_basis: >-
      Each adjustment set out below changes the credit as that adjustment states: every replacement of a standard quantity
      is made first and the quantities resting on it are counted again, every multiplication of a standard quantity is
      made next, and anything withheld is taken from the credit last; the credit never falls below zero.
  factors:
  - id: credit_price_rule
    effect: parameter
    decides: price
    bindings:
    - charge_adj
    - price
    ladder:
    - when: a balance adjustment already stands against the non-covered item charge
      value: the price is replaced by the charge less the adjustment, per customer unit
    - when: no adjustment AND the charge per customer unit is below the cash price
      value: the price is replaced by the charge per customer unit
    - when: otherwise
      value: the price stays the cash price (K('cash_price_a4351'))
    baseline:
      price: K('cash_price_a4351')
    evidence:
    - history
    cross_difficulty: null
  - id: restocking_form_rule
    effect: method
    decides: restock_form
    bindings:
    - restock_form
    ladder:
    - when: the accepted units fill at least one box of 30 but fewer than two
      method: the restocking basis is replaced by one box's worth (30 units times the price)
    - when: they fill less than one box
      method: the restocking basis is replaced by nothing
    - when: otherwise
      method: the restocking basis stays the gross credit
    baseline:
      restock_form: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: restocking_schedule_rule
    effect: parameter
    decides: restock
    bindings:
    - rs_pod
    - receipt_date
    - restock
    ladder:
    - when: the return was accepted more than 30 days after the refill's delivery date
      value: one fifth of the restocking basis is withheld (K('late_restock_share'))
    - when: it was accepted more than 14 but no more than 30 days after delivery
      value: one tenth of the restocking basis is withheld (K('mid_restock_share'))
    - when: otherwise
      value: nothing is withheld (0)
    baseline:
      restock: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: hardship_restock_relief
    effect: parameter
    decides: h_relief
    bindings:
    - cgm_hs_date
    - h_relief
    ladder:
    - when: a CGM hardship application approved and received within the last 12 calendar months
      value: the restocking basis is multiplied by one half (K('hardship_relief_recent'))
    - when: the newest approved CGM hardship application received within 24 calendar months but not the last 12
      value: the restocking basis is multiplied by three quarters (K('hardship_relief_older'))
    - when: otherwise
      value: not changed (1)
    baseline:
      h_relief: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: cgm
  - id: tenure_restock_relief
    effect: parameter
    decides: p_relief
    bindings:
    - p_relief
    ladder:
    - when: the program became active 24 or more whole calendar months before the credit
      value: the restocking basis is multiplied by three quarters (K('tenure_relief_long'))
    - when: it became active at least 12 but fewer than 24 whole calendar months before
      value: the restocking basis is multiplied by nine tenths (K('tenure_relief_mid'))
    - when: otherwise
      value: not changed (1)
    baseline:
      p_relief: '1'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The price is the Larkfield cash price of 1.85 per catheter. The gross credit is the credited units times the price.
      The credit is the gross credit, rounded to the nearest cent on the final figure only.
    params:
    - cash_price_a4351
  inputs:
    history:
    - table: continence_shipments
      aggregate: sum
      field: units
      filters:
        event_type: continence_return_receipt
    - table: continence_billing
      aggregate: latest
      field: amount
      filters:
        event_type: continence_patient_charge
        charge_type: non_covered_item
    - category: cgm
      table: cgm_requests
      aggregate: latest
      field: received_at
      filters:
        request_type: hardship_application
        request_status: approved
    cross_category:
    - cgm
- id: continence_ext_payment_plan_installment
  base_policy_refs:
  - continence_evt_patient_account
  - continence_holds_and_closure
  overwrite:
  - base_policy: continence_evt_patient_account
    superseded_clause: >-
      in no more than payment_plan_max_months monthly installments of at least payment_plan_min_monthly_usd
    replaced_by: >-
      For a payment plan on a Commercial HMO continence program that this policy settles, and only for such a plan, the
      plan runs for the term and in the monthly installments this policy states, in place of the tier's longest term,
      each installment at least the tier's smallest monthly installment; every other payment plan remains under the base
      term rule.
  trigger: on_request
  subject:
  - continence_patient_payment
  computes: monthly_amount_usd
  target_tool: accept_payment_plan_f3b8d099
  params:
    short_term_months: 3
    mid_term_cut: 2
    hardship_extension_recent: 4
    hardship_extension_older: 2
    tenure_extension_long: 2
    tenure_extension_mid: 1
    broken_plan_first_share: 0.25
    recent_payment_days: 30
  rule: >-
    This policy settles the monthly installment of the interest-free payment plan a customer accepts for the balance of
    a Commercial HMO continence program; a plan is offered only for a balance of at least the tier's smallest plan balance,
    the customer accepts it personally, and it covers the program's whole balance as the ledger stands when the plan is
    accepted. For a payment plan on a Commercial HMO continence program that this policy settles, and only for such a
    plan, the plan runs for the term and in the monthly installments this policy states, in place of the tier's longest
    term, each installment at least the tier's smallest monthly installment; every other payment plan remains under the
    base term rule. The installment is fixed only after the program's latest straight-tip refill carries its non-covered
    item charge whenever its claim line stands denied as a quantity above the plan's limit with no over-limit justification
    record on file, or as not covered, the customer's current plan member waiver is dated on or before its ship date,
    and the charge owed comes to more than zero. The plan is not set up until the refill named on the program's latest
    return receipt, when it carries a non-covered item charge, has its return credit standing against that charge whenever
    the credit owed comes to more than zero. Records read. The covered balance is the program's balance: its remittance
    patient responsibility, patient charges and refunds, less its payments and balance adjustments. Standard method. The
    term is the tier's longest plan term in months. The installments recorded on the plan are the term's months, never
    fewer than one. The amount spread is the covered balance. The installment is the amount spread divided by the installments
    recorded on the plan, rounded up to the next cent, and never below the tier's smallest monthly installment. Each adjustment
    set out below changes the plan as that adjustment states: every replacement of a standard quantity is made first,
    then every addition to or subtraction from one, and the quantities resting on them are counted again; the installment
    is then counted as the standard method states. Term band. When the covered balance is below twice the tier's smallest
    plan balance, the term is replaced by 3 months. When it is at least twice but below four times that balance, the term
    is replaced by the tier's longest term less 2 months. Otherwise the term stays the tier's longest term. Hardship extension.
    When the customer's Continuous Glucose Monitoring Supply Program carries a hardship application approved and received
    within the last 12 calendar months, 4 months are added to the term. When the newest such approved application was
    received within the last 24 calendar months but not the last 12, 2 months are added. Otherwise nothing is added. Tenure
    addition. When the program became active 24 or more whole calendar months before the plan is accepted, 2 months are
    added to the term. When it became active at least 12 but fewer than 24 whole calendar months before, 1 month is added.
    Otherwise nothing is added. First-installment form. When a payment plan request the customer made on their Continuous
    Glucose Monitoring Supply Program was received within the last 24 calendar months and now stands withdrawn, a quarter
    of the covered balance, rounded to the nearest cent, is set as a first installment, billed on the next statement and
    not one of the installments recorded on the plan; it is taken from the amount spread, and one month is taken off the
    installments recorded on the plan. When there is no such withdrawn plan and the customer made a payment on the program
    within the last 30 calendar days, the plan starts a month later and one month is taken off the installments recorded
    on the plan. Otherwise nothing changes. The plan is recorded as an approved payment plan request with the installments
    recorded on the plan as its number of installments and the installment as its monthly amount, and every eligibility
    of the base patient-account rule stays in force.
  prerequisite:
  - problem: continence_ext_noncovered_catheter_charge
    kind: value_input
    gate: bal
    form: state
    policy_source: >-
      The installment is fixed only after the program's latest straight-tip refill carries its non-covered item charge
      whenever its claim line stands denied as a quantity above the plan's limit with no over-limit justification record
      on file, or as not covered, the customer's current plan member waiver is dated on or before its ship date, and the
      charge owed comes to more than zero.
    condition: >-
      For the program's straight-tip refill with the latest ship date: when its original claim carries a CO-151 denial
      and no over-limit justification record is on file for the program, or a PR-204 denial, the newest plan member waiver
      for A4351 is dated on or before its ship date, and the non-covered item charge owed on it is above zero, a continence_patient_charge
      row with charge_type non_covered_item and that continence_shipment_id stands.
    resolved_by: post_noncovered_charge_0f5c8cfb
    effect: >-
      The non-covered item charge joins the program balance, so the covered balance (bal) rises by the charge and the
      installment is recomputed on it.
  - problem: continence_ext_returned_unit_credit
    kind: value_input
    gate: bal
    form: state
    policy_source: >-
      The plan is not set up until the refill named on the program's latest return receipt, when it carries a non-covered
      item charge, has its return credit standing against that charge whenever the credit owed comes to more than zero.
    condition: >-
      For the shipment named on the program's continence_return_receipt with the latest receipt_date, when it carries
      a non_covered_item continence_patient_charge and the return credit owed on it is above zero, a continence_balance_adjustment
      with adjustment_reason return_credit whose original_continence_ledger_id is that charge.
    resolved_by: post_return_credit_03d701bf
    effect: >-
      The return credit leaves the program balance, so the covered balance (bal) falls by the credit and the installment
      is recomputed on it.
  cross_category:
  - category: cgm
    as: branch
    reads:
    - cgm_requests.request_status
    - cgm_requests.received_at
    note: >-
      The hardship extension and the first-installment form read the customer's CGM hardship application and the CGM payment
      plans the customer withdrew from.
  compute:
  - bal: >-
      SUM('continence_billing', 'amount', event_type='continence_claim_adjudication') + SUM('continence_billing', 'amount',
      event_type='continence_patient_charge') + SUM('continence_billing', 'amount', event_type='continence_patient_refund')
      - SUM('continence_billing', 'amount', event_type='continence_patient_payment') - SUM('continence_billing', 'amount',
      event_type='continence_balance_adjustment')
  - min_bal: P('payment_plan_min_balance_usd')
  - max_m: P('payment_plan_max_months')
  - band_count: >-
      SUM('continence_billing', 'amount', event_type='continence_claim_adjudication') + SUM('continence_billing', 'amount',
      event_type='continence_patient_charge') + SUM('continence_billing', 'amount', event_type='continence_patient_refund')
      - SUM('continence_billing', 'amount', event_type='continence_patient_payment') - SUM('continence_billing', 'amount',
      event_type='continence_balance_adjustment')
  - band_months: >-
      K('short_term_months') if band_count < 2 * min_bal else (max_m - K('mid_term_cut') if band_count < 4 * min_bal else
      max_m)
  - cgm_hs_date: >-
      XLATEST('cgm', 'cgm_requests', 'received_at', date_field='received_at', request_type='hardship_application', request_status='approved')
  - ext_h: >-
      K('hardship_extension_recent') if (cgm_hs_date != None and MONTHS(cgm_hs_date, NOW) < 12) else (K('hardship_extension_older')
      if (cgm_hs_date != None and MONTHS(cgm_hs_date, NOW) < 24) else 0)
  - ext_c: >-
      K('tenure_extension_long') if (F('activated_date') and MONTHS(F('activated_date'), NOW) >= 24) else (K('tenure_extension_mid')
      if (F('activated_date') and MONTHS(F('activated_date'), NOW) >= 12) else 0)
  - cgm_withdrawn: >-
      XCOUNT('cgm', 'cgm_requests', within_months=24, date_field='received_at', request_type='payment_plan', request_status='withdrawn')
  - last_pay: >-
      LATEST('continence_billing', 'posting_date', date_field='posting_date', event_type='continence_patient_payment')
  - first_inst: RND(bal * K('broken_plan_first_share'), 2) if cgm_withdrawn > 0 else 0
  - shift: >-
      1 if cgm_withdrawn > 0 else (1 if (last_pay != None and DAYS(last_pay, NOW) <= K('recent_payment_days')) else 0)
  - term: band_months + ext_h + ext_c
  - installments: MX(1, term - shift)
  - spread: bal - first_inst
  - cents: RND(spread * 100, 0)
  - installment: -((-cents) // installments) / 100
  - result: MX(P('payment_plan_min_monthly_usd'), installment)
  compute_basis:
    bal: >-
      The covered balance is the program's balance: its remittance patient responsibility, patient charges and refunds,
      less its payments and balance adjustments.
    max_m: The term is the tier's longest plan term in months.
    band_count: When the covered balance is below twice the tier's smallest plan balance,
    band_months: >-
      When the covered balance is below twice the tier's smallest plan balance, the term is replaced by 3 months. When
      it is at least twice but below four times that balance, the term is replaced by the tier's longest term less 2 months.
      Otherwise the term stays the tier's longest term.
    cgm_hs_date: >-
      When the customer's Continuous Glucose Monitoring Supply Program carries a hardship application approved and received
      within the last 12 calendar months,
    ext_h: >-
      When the customer's Continuous Glucose Monitoring Supply Program carries a hardship application approved and received
      within the last 12 calendar months, 4 months are added to the term. When the newest such approved application was
      received within the last 24 calendar months but not the last 12, 2 months are added. Otherwise nothing is added.
    ext_c: >-
      When the program became active 24 or more whole calendar months before the plan is accepted, 2 months are added
      to the term. When it became active at least 12 but fewer than 24 whole calendar months before, 1 month is added.
      Otherwise nothing is added.
    cgm_withdrawn: >-
      When a payment plan request the customer made on their Continuous Glucose Monitoring Supply Program was received
      within the last 24 calendar months and now stands withdrawn,
    last_pay: the customer made a payment on the program within the last 30 calendar days,
    first_inst: >-
      When a payment plan request the customer made on their Continuous Glucose Monitoring Supply Program was received
      within the last 24 calendar months and now stands withdrawn, a quarter of the covered balance, rounded to the nearest
      cent, is set as a first installment, billed on the next statement and not one of the installments recorded on the
      plan; it is taken from the amount spread, and one month is taken off the installments recorded on the plan. When
      there is no such withdrawn plan and the customer made a payment on the program within the last 30 calendar days,
      the plan starts a month later and one month is taken off the installments recorded on the plan. Otherwise nothing
      changes.
    shift: >-
      When a payment plan request the customer made on their Continuous Glucose Monitoring Supply Program was received
      within the last 24 calendar months and now stands withdrawn, a quarter of the covered balance, rounded to the nearest
      cent, is set as a first installment, billed on the next statement and not one of the installments recorded on the
      plan; it is taken from the amount spread, and one month is taken off the installments recorded on the plan. When
      there is no such withdrawn plan and the customer made a payment on the program within the last 30 calendar days,
      the plan starts a month later and one month is taken off the installments recorded on the plan. Otherwise nothing
      changes.
    term: >-
      Each adjustment set out below changes the plan as that adjustment states: every replacement of a standard quantity
      is made first, then every addition to or subtraction from one, and the quantities resting on them are counted again;
      the installment is then counted as the standard method states.
    installments: >-
      Each adjustment set out below changes the plan as that adjustment states: every replacement of a standard quantity
      is made first, then every addition to or subtraction from one, and the quantities resting on them are counted again;
      the installment is then counted as the standard method states.
    cents: >-
      The installment is the amount spread divided by the installments recorded on the plan, rounded up to the next cent,
      and never below the tier's smallest monthly installment.
    installment: rounded up to the next cent
    result: and never below the tier's smallest monthly installment.
    spread: >-
      Each adjustment set out below changes the plan as that adjustment states: every replacement of a standard quantity
      is made first, then every addition to or subtraction from one, and the quantities resting on them are counted again;
      the installment is then counted as the standard method states.
  factors:
  - id: plan_term_rule
    effect: parameter
    decides: band_months
    bindings:
    - band_count
    - band_months
    ladder:
    - when: the covered balance is below twice the tier's smallest plan balance
      value: the term is replaced by 3 months (K('short_term_months'))
    - when: it is at least twice but below four times that balance
      value: the term is replaced by the tier's longest term less K('mid_term_cut') months
    - when: otherwise
      value: the term stays the tier's longest term (P('payment_plan_max_months'))
    baseline:
      band_months: max_m
    evidence:
    - history
    cross_difficulty: null
  - id: hardship_term_extension
    effect: parameter
    decides: ext_h
    bindings:
    - cgm_hs_date
    - ext_h
    ladder:
    - when: a CGM hardship application approved and received within the last 12 calendar months
      value: 4 months are added to the term (K('hardship_extension_recent'))
    - when: the newest approved CGM hardship application received within 24 months but not 12
      value: 2 months are added to the term (K('hardship_extension_older'))
    - when: otherwise
      value: nothing is added (0)
    baseline:
      ext_h: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: cgm
  - id: tenure_term_extension
    effect: parameter
    decides: ext_c
    bindings:
    - ext_c
    ladder:
    - when: the program became active 24 or more whole calendar months before the plan is accepted
      value: 2 months are added to the term (K('tenure_extension_long'))
    - when: it became active at least 12 but fewer than 24 whole calendar months before
      value: 1 month is added to the term (K('tenure_extension_mid'))
    - when: otherwise
      value: nothing is added (0)
    baseline:
      ext_c: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: first_installment_form
    effect: method
    decides: first_inst
    bindings:
    - cgm_withdrawn
    - last_pay
    - first_inst
    - shift
    ladder:
    - when: >-
        a payment plan request on the customer's CGM program received within the last 24 calendar months AND now withdrawn
      method: >-
        a quarter of the covered balance is set as a first installment and taken from the amount spread, and one month
        is taken off the installments recorded
    - when: no such withdrawn plan AND a customer payment on the program within the last 30 days
      method: the plan starts a month later and one month is taken off the installments recorded
    - when: otherwise
      method: nothing changes
    baseline:
      first_inst: '0'
      shift: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: cgm
  baseline:
    rule: >-
      The term is the tier's longest plan term in months. The installments recorded on the plan are the term's months,
      never fewer than one. The amount spread is the covered balance. The installment is the amount spread divided by
      the installments recorded on the plan, rounded up to the next cent, and never below the tier's smallest monthly
      installment.
    params:
    - payment_plan_max_months
    - payment_plan_min_monthly_usd
  inputs:
    history:
    - table: continence_billing
      aggregate: sum
      field: amount
      filters:
        event_type: continence_claim_adjudication
    - table: continence_billing
      aggregate: sum
      field: amount
      filters:
        event_type: continence_patient_charge
    - table: continence_billing
      aggregate: sum
      field: amount
      filters:
        event_type: continence_patient_payment
    - category: cgm
      table: cgm_requests
      aggregate: count
      field: cgm_request_id
      within_months: 24
      filters:
        request_type: payment_plan
        request_status: withdrawn
    cross_category:
    - cgm
