    x_returned: 'Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the supported charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the supported charge; otherwise nothing is taken off.'
    x_late_days: 'The late-billing courtesy on the reviewed charge follows the days from the line''s denial posting date to the charge''s posting date in three cases: where those days exceed the late full days, the supported charge is reduced by the late courtesy percent; where they exceed the late half days but not the late full days, it is reduced by half the late courtesy percent; otherwise there is no late-billing courtesy.'
    x_late_pct: 'The late-billing courtesy on the reviewed charge follows the days from the line''s denial posting date to the charge''s posting date in three cases: where those days exceed the late full days, the supported charge is reduced by the late courtesy percent; where they exceed the late half days but not the late full days, it is reduced by half the late courtesy percent; otherwise there is no late-billing courtesy.'
    x_pays_3m: 'The payment-history courtesy on the reviewed charge follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the supported charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, it is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    x_pays_6m: 'The payment-history courtesy on the reviewed charge follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the supported charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, it is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    x_pay_pct: 'The payment-history courtesy on the reviewed charge follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the supported charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, it is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    other_recent: 'The first-liability courtesy on the reviewed charge follows the program''s other non-covered item charges in three cases: where the program carries no other non-covered item charge and none posted in the first-liability months before today, the supported charge is reduced by the first-liability percent; where it carries another one but none posted in those months, it is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    other_all: 'The first-liability courtesy on the reviewed charge follows the program''s other non-covered item charges in three cases: where the program carries no other non-covered item charge and none posted in the first-liability months before today, the supported charge is reduced by the first-liability percent; where it carries another one but none posted in those months, it is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    x_first_pct: 'The first-liability courtesy on the reviewed charge follows the program''s other non-covered item charges in three cases: where the program carries no other non-covered item charge and none posted in the first-liability months before today, the supported charge is reduced by the first-liability percent; where it carries another one but none posted in those months, it is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    x_open: The charge's open amount is its amount less the credits already set against it.
    x_pr204: 'The reviewed line''s denied units follow the denial answering its original claim: where a CO-151 denial answers it, they are its units less the covered rate times its supply days divided by 30, never below zero; where a PR-204 denial answers it, or a CO-197 denial does and the grant the line drew on did not cover its ship date, its valid-from date being later or its valid-through date earlier than the ship date, so that the denial is not appealed, every unit of the line is denied; otherwise none is.'
    x_co197: 'The reviewed line''s denied units follow the denial answering its original claim: where a CO-151 denial answers it, they are its units less the covered rate times its supply days divided by 30, never below zero; where a PR-204 denial answers it, or a CO-197 denial does and the grant the line drew on did not cover its ship date, its valid-from date being later or its valid-through date earlier than the ship date, so that the denial is not appealed, every unit of the line is denied; otherwise none is.'
    x_gthru: 'The reviewed line''s denied units follow the denial answering its original claim: where a CO-151 denial answers it, they are its units less the covered rate times its supply days divided by 30, never below zero; where a PR-204 denial answers it, or a CO-197 denial does and the grant the line drew on did not cover its ship date, its valid-from date being later or its valid-through date earlier than the ship date, so that the denial is not appealed, every unit of the line is denied; otherwise none is.'
    x_gfrom: 'The reviewed line''s denied units follow the denial answering its original claim: where a CO-151 denial answers it, they are its units less the covered rate times its supply days divided by 30, never below zero; where a PR-204 denial answers it, or a CO-197 denial does and the grant the line drew on did not cover its ship date, its valid-from date being later or its valid-through date earlier than the ship date, so that the denial is not appealed, every unit of the line is denied; otherwise none is.'
    x_denied: 'The reviewed line''s denied units follow the denial answering its original claim: where a CO-151 denial answers it, they are its units less the covered rate times its supply days divided by 30, never below zero; where a PR-204 denial answers it, or a CO-197 denial does and the grant the line drew on did not cover its ship date, its valid-from date being later or its valid-through date earlier than the ship date, so that the denial is not appealed, every unit of the line is denied; otherwise none is.'
    x_liable: 'Each adjustment set out above changes the supported charge as it states: replacements first, then the amounts taken off, never below zero, then the percentage reductions, which add together and are taken once from the supported charge; the supported charge is rounded half up to the cent, and the reversal is the charge''s open amount less the supported charge, never below zero, rounded half up to the cent.'
    x_supported: 'Each adjustment set out above changes the supported charge as it states: replacements first, then the amounts taken off, never below zero, then the percentage reductions, which add together and are taken once from the supported charge; the supported charge is rounded half up to the cent, and the reversal is the charge''s open amount less the supported charge, never below zero, rounded half up to the cent.'
    result: 'Each adjustment set out above changes the supported charge as it states: replacements first, then the amounts taken off, never below zero, then the percentage reductions, which add together and are taken once from the supported charge; the supported charge is rounded half up to the cent, and the reversal is the charge''s open amount less the supported charge, never below zero, rounded half up to the cent.'
  baseline:
    rule: 'A billing correction reverses the part of the program''s largest non-covered item charge that the charter does not let the charge carry, as follows. The charge under review is the program''s non-covered item charge with the largest amount; its shipment is the line it bills, that line''s grant is the authorization grant it drew on, the line''s written order is the order that grant rests on, and the line''s denial is the claim denial answering the original claim for that shipment. The charge''s open amount is its amount less the credits already set against it. The credits set against the charge are the billing corrections and hardship waivers already posted against it. The cash price per unit for the reviewed line is the Larkfield cash price of its item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The standard covered rate for the reviewed line is the tier''s reservoirs per 30 days. The reviewed line''s denied units follow the denial answering its original claim: where a CO-151 denial answers it, they are its units less the covered rate times its supply days divided by 30, never below zero; where a PR-204 denial answers it, or a CO-197 denial does and the grant the line drew on did not cover its ship date, its valid-from date being later or its valid-through date earlier than the ship date, so that the denial is not appealed, every unit of the line is denied; otherwise none is. In the standard computation the reviewed charge has no supported part and the reversal is the charge''s open amount.'
    params:
    - block_days
    - cash_price_a4224
    - cash_price_a4225
    - cash_price_a4232
    - cash_price_a4239
    - cash_price_pump_beta_bionics_ilet
    - cash_price_pump_minimed_780g
    - cash_price_pump_tandem_mobi
    - cash_price_pump_tandem_tslim_x2
    - reservoirs_per_30_days
  factors:
  - id: fx_rv_cover
    effect: parameter
    decides: rv_cover
    bindings:
    - rv_basis
    - rv_units_auth
    - rv_from
    - rv_through
    - rv_order_rate
    - rv_olj
    - rv_cover
    ladder:
    - when: the grant the denied line drew on is a payer prior authorization
      value: its units authorized times 30 divided by the days its span covers, both ends included, rounded down
    - when: that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file
      value: the written order's quantity per 30 days
    - when: otherwise
      value: P('reservoirs_per_30_days')
    baseline:
      rv_cover: P('reservoirs_per_30_days')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: fx_rv_returns
    effect: parameter
    decides: x_returned
    bindings:
    - xr_cc_n
    - xr_cc_billed
    - xr_orig_billed
    - xr_cc_off
    - xr_received
    - x_returned
    ladder:
    - when: a corrected claim for the line has been transmitted
      value: the units the corrected claim no longer bills, taken off the supported charge at the cash price
    - when: no corrected claim is on file but the warehouse has received unopened units of the line back
      value: those received units, taken off the supported charge at the cash price
    - when: otherwise
      value: '0'
    baseline:
      x_returned: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fx_rv_late_billing
    effect: parameter
    decides: x_late_pct
    bindings:
    - x_late_days
    - x_late_pct
    ladder:
    - when: more than the late full days passed from the line's denial posting date to the charge's posting date
      value: K('late_courtesy_pct')
    - when: more than the late half days but not more than the late full days have passed
      value: half of K('late_courtesy_pct')
    - when: otherwise
      value: '0'
    baseline:
      x_late_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: fx_rv_payment_history
    effect: parameter
    decides: x_pay_pct
    bindings:
    - x_pays_3m
    - x_pays_6m
    - x_pay_pct
    ladder:
    - when: a payment posted in the three months before today and another in the three months before those
      value: K('payment_history_pct')
    - when: a payment posted in the six months before today but not in both three-month spans
      value: half of K('payment_history_pct')
    - when: otherwise
      value: '0'
    baseline:
      x_pay_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fx_rv_first_liability
    effect: parameter
    decides: x_first_pct
    bindings:
    - other_recent
    - other_all
    - x_first_pct
    ladder:
    - when: the program carries no other non-covered item charge and none posted in the first-liability months before today
      value: K('first_liability_pct')
    - when: it carries another one but none posted in those months
      value: half of K('first_liability_pct')
    - when: otherwise
      value: '0'
    baseline:
      x_first_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fx_rv_liability
    effect: method
    decides: x_liab_basis
    bindings:
    - xn_date
    - xn_units
    - x_od
    - x_liab_basis
    ladder:
    - when: the tier is the Medicare Advantage tier and the plan issued an organization determination denial for the line's item
      method: the standard of no supported part is replaced with every denied unit
    - when: the tier is any other tier and the newest liability notice signed against the line's grant was signed on or before the line's ship date
      method: it is replaced with the lesser of the denied units and that notice's units
    - when: otherwise
      method: nothing is supported
    baseline:
      x_liab_basis: '3'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  inputs:
    history:
    - table: pump_billing
      aggregate: max
      field: amount
      filters:
        event_type: pump_patient_charge
        charge_type: non_covered_item
    - table: pump_billing
      aggregate: sum
      field: amount
      filters:
        event_type: pump_balance_adjustment
    - table: pump_shipments
      aggregate: sum
      field: units
      filters:
        event_type: pump_return_receipt
    - table: pump_billing
      aggregate: count
      field: pump_ledger_id
      within_months: 6
      filters:
        event_type: pump_patient_payment
    cross_category: []
- id: pump_ext_cartridge_refill_quantity
  base_policy_refs:
  - pump_evt_refill_shipment
  - pump_evt_quantity_limits
  - pump_combo_sensor_and_insulin
  - pump_liability_notice
  - pump_holds_and_closure
  overwrite:
  - base_policy: pump_evt_quantity_limits
    superseded_clause: cartridges or reservoirs ship as the item reservoir_item_by_model names for the model, reservoirs_per_30_days for every 30 days of supply
    replaced_by: For a cartridge or reservoir refill this policy handles, and only for such a refill, the cartridges shipped are the covered cartridges plus the noticed cartridges worked out below, in the cartridge or reservoir item the pump model uses; every other supply line of the program remains under the base quantity rule.
  - base_policy: pump_evt_refill_shipment
    superseded_clause: the supply days of a shipment are the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that remain before the authorization's valid-through date when fewer remain
    replaced_by: For a cartridge or reservoir refill this policy handles, and only for such a refill, the supply days are the refill's 30-day blocks worked out below times 30; an infusion-set refill keeps the supply days its own refill policy sets, and every other refill of the program keeps the base supply-days rule.
  - base_policy: pump_evt_refill_shipment
    superseded_clause: On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms, for this shipment, that they are still using the item and how much supply they have on hand
    replaced_by: 'For a cartridge or reservoir refill this policy handles, and only for such a refill, the customer''s refill confirmation is taken on the day the refill ships: on a tier that requires refill confirmation, the cartridge refill ships only after the customer personally confirms on that day, for this shipment, that they are still using the cartridges and how many they have on hand, and that day is the refill''s confirmation date; an infusion-set refill keeps the confirmation its own refill policy sets, and every other refill of the program keeps the base confirmation rule.'
  trigger: on_request
  subject:
  - pump_refill_shipment
  computes: units
  target_tool: ship_cartridge_refill_a415cb78
  params:
    block_days: 30
    new_pump_start_days: 90
    pump_insulin_unit_insulin: 50
    vial_insulin: 1000
    stability_days: 3
    fill_mobi: 200
    fill_ilet: 160
    fill_standard: 300
  rule: 'For a cartridge or reservoir refill this policy handles, and only for such a refill, the cartridges shipped are the covered cartridges plus the noticed cartridges worked out below, in the cartridge or reservoir item the pump model uses; every other supply line of the program remains under the base quantity rule. For a cartridge or reservoir refill this policy handles, and only for such a refill, the supply days are the refill''s 30-day blocks worked out below times 30; an infusion-set refill keeps the supply days its own refill policy sets, and every other refill of the program keeps the base supply-days rule. For a cartridge or reservoir refill this policy handles, and only for such a refill, the customer''s refill confirmation is taken on the day the refill ships: on a tier that requires refill confirmation, the cartridge refill ships only after the customer personally confirms on that day, for this shipment, that they are still using the cartridges and how many they have on hand, and that day is the refill''s confirmation date; an infusion-set refill keeps the confirmation its own refill policy sets, and every other refill of the program keeps the base confirmation rule. The cartridge refill is not shipped until the program''s past-due amount the patient-balance postings show, after leaving out any balance an approved payment plan covers, is below the tier''s past-due hold minimum. On a tier whose past-due hold days are 0, the refill is never held for a past-due balance. The cartridge or reservoir item is the A4232 reservoir for a MiniMed 780G and the A4225 cartridge for every other model. The standard refill period is the tier''s supply days per shipment divided by 30, giving the refill''s 30-day blocks. The standard ordered rate is the quantity per 30 days on the written order the newest authorization grant for the cartridge item rests on. The standard cartridge rate is the ordered rate. The customer''s pump insulin is the insulin dispensed under the customer''s active insulin pharmacy program whose delivery method is insulin pump, counted in the standard way from its J1817 dispensing, each billing unit holding the pump insulin unit insulin. The daily pump insulin is, in the standard way, the pump insulin dispensed in the three months before the ship date divided by the supply days those dispensings cover, and zero when nothing was dispensed in that time. The usable fill per cartridge is the Mobi fill for a Tandem Mobi, the iLet fill for a Beta Bionics iLet and the standard fill for every other model. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date. The covered rate follows the authorization being drawn in three cases: where the newest authorization grant for the cartridge item is a payer prior authorization, the covered rate is that prior authorization''s rate, its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where the newest grant rests on the written order itself and an over-limit justification record dated in the 12 months before the ship date is on file, the covered rate is the written order''s quantity; otherwise the covered rate is the tier''s reservoirs per 30 days. The covered cartridges are the lesser of the cartridge rate and the covered rate, times the refill''s 30-day blocks. The cartridges above coverage are the cartridge rate less the covered rate, never below zero, times the refill''s 30-day blocks. The noticed cartridges are the lesser of the cartridges above coverage and the units of the newest liability notice for the cartridge item when that notice was signed after the program''s previous refill of that item, and none otherwise. The noticed cartridges are fixed only after the cartridge item carries a liability notice signed after the program''s previous refill of that item. The cartridges shipped are the covered cartridges plus the noticed cartridges, never more than the program''s authorized units remaining. In the standard computation the cartridge rate is the standard ordered rate, the covered cartridges are the lesser of that rate and the covered rate times the standard refill period''s 30-day blocks, the cartridges above coverage are that rate less the covered rate, never below zero, times those blocks, and the cartridges shipped are the covered cartridges plus the noticed cartridges, never more than the program''s authorized units remaining. The refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for the cartridge item covers fewer days than the standard refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand. The ordered rate follows the program''s written orders for the cartridge item in three cases: where a written order for the item is dated in the three months before the ship date, the standard ordered rate is replaced with the newest written order''s quantity per 30 days; where the newest written order for the item is older than that and the program has a previous refill of the item, it is replaced with the lesser of that order''s quantity per 30 days and the previous refill''s units times 30 divided by its supply days, rounded up; otherwise the standard ordered rate stands. The counting of the customer''s pump insulin follows the customer''s insulin pharmacy programs in three cases: where the active pump-delivery program is on any tier other than the Insulin Pharmacy Medicare Part B Pump Insulin Program, the standard counting is replaced with its rapid-acting 10 mL vial dispensing, each vial holding the vial insulin; where the customer holds no active pump-delivery program, no pump insulin is counted; otherwise the standard counting stands. The daily pump insulin follows the dispensing records in three cases: where a written order dated in the three months before the ship date is on the active pump-delivery insulin pharmacy program, the standard window is replaced with the newest pump insulin dispensing, its insulin divided by its own supply days; where no such order is on file and the program''s pump insulin item, J1817 on the Insulin Pharmacy Medicare Part B Pump Insulin Program and rapid-acting 10 mL vials on any other tier, was not dispensed in the three months before the ship date but was in the six months before it, the standard window is replaced with those six months, their insulin divided by the supply days they cover; otherwise the standard window stands. The cartridge rate follows the customer''s dispensing in three cases: where the customer holds an active pump-delivery insulin pharmacy program and its pump insulin item, J1817 on the Insulin Pharmacy Medicare Part B Pump Insulin Program and rapid-acting 10 mL vials on any other tier, was dispensed under it in the six months before the ship date, the standard cartridge rate is replaced with the lesser of the ordered rate and the cartridges the daily pump insulin needs per 30 days, 30 times the daily pump insulin divided by the usable fill per cartridge, rounded up to a whole cartridge and never fewer than one cartridge for every stability period of days in 30 days, rounded up; where the customer holds such a program but that item was not dispensed under it in those six months, it is replaced with the tier''s reservoirs per 30 days; otherwise the standard cartridge rate stands. Each adjustment set out above changes the standard figure it names, replacements before limits; the covered cartridges, the cartridges above coverage, the noticed cartridges and the cartridges shipped are then figured from the cartridge rate and the refill''s 30-day blocks as set out above.'
  prerequisite:
  - problem: pump_ext_cartridge_liability_notice
    kind: value_input
    gate: noticed_cartridges
    form: state
    policy_source: The noticed cartridges are fixed only after the cartridge item carries a liability notice signed after the program's previous refill of that item.
    condition: pump_orders holds a pump_liability_notice_signed row for the program's cartridge item whose notice_date is later than the ship_date of the program's newest pump_refill_shipment of that item.
    resolved_by: sign_cartridge_liability_notice_61b55bc8
    effect: noticed_cartridges moves from zero to the lesser of the cartridges above the covered rate and the units of that notice.
  - problem: pump_ext_hardship_waiver_amount
    kind: state_gate
    gate: pump_billing.amount
    form: state
    policy_source: The cartridge refill is not shipped until the program's past-due amount the patient-balance postings show, after leaving out any balance an approved payment plan covers, is below the tier's past-due hold minimum.
    condition: The program's past-due amount (remittance patient responsibility, patient charges and refunds posted more than the tier's past-due hold days before the ship date, less every payment and balance adjustment posted on or before it), after leaving out the balance an approved pump_requests payment_plan row covers, is below the tier's past-due hold minimum; on a tier whose past-due hold days are 0 the gate does not apply.
    resolved_by: post_hardship_waiver_2af40412
    effect: A hardship waiver lowers the past-due amount by its amount; the cartridge refill may ship once what is left, after any approved plan's covered balance, is below the hold minimum.
  cross_category:
  - category: insulin
    as: history
    reads:
    - insulin_program_id
    - variant_name
    - status
    - delivery_method
    - insulin_shipments.units
    - insulin_shipments.supply_days
    - insulin_shipments.ship_date
    - insulin_orders.order_date
    note: The cartridge rate and the daily pump insulin are decided from the customer's pump-delivery insulin pharmacy program and its dispensing and order ledger.
  compute:
  - cart_item: '''A4232'' if F(''pump_model'') == ''minimed_780g'' else ''A4225'''
  - o_recent_n: COUNT('pump_orders', within_months=3, date_field='order_date', event_type='pump_order_receipt', item_code=cart_item)
  - o_newest_qty: LATEST('pump_orders', 'quantity_per_30_days', date_field='order_date', event_type='pump_order_receipt', item_code=cart_item) or 0
  - prev_units: LATEST('pump_shipments', 'units', date_field='ship_date', event_type='pump_refill_shipment', item_code=cart_item) or 0
  - prev_days: LATEST('pump_shipments', 'supply_days', date_field='ship_date', event_type='pump_refill_shipment', item_code=cart_item) or 0
  - g_order: LATEST('pump_orders', 'related_pump_order_id', date_field='valid_from', event_type='pump_authorization_grant', item_code=cart_item) or ''
  - g_order_qty: LATEST('pump_orders', 'quantity_per_30_days', date_field='order_date', pump_order_id=g_order) or 0
  - ordered_rate: o_newest_qty if o_recent_n > 0 else (MN(o_newest_qty, -(-(prev_units * K('block_days')) // prev_days)) if (o_recent_n == 0 and prev_days > 0) else g_order_qty)
  - std_blocks: P('supply_days_per_shipment') // K('block_days')
  - grant_end: LATEST('pump_orders', 'valid_through', date_field='valid_from', event_type='pump_authorization_grant', item_code=cart_item) or NOW
  - grant_days: DAYS(NOW, grant_end) + 1
  - pump_age_days: DAYS(F('pump_delivery_date'), NOW)
  - refill_blocks: 1 if pump_age_days < K('new_pump_start_days') else (grant_days // K('block_days') if grant_days < std_blocks * K('block_days') else std_blocks)
  - c_prog_id: CFIELD('insulin', 'insulin_program_id', status='active', delivery_method='insulin_pump') or ''
  - c_variant: CFIELD('insulin', 'variant_name', status='active', delivery_method='insulin_pump') or ''
  - c_src: 2 if (c_prog_id != '' and c_variant != 'Insulin Pharmacy Medicare Part B Pump Insulin Program') else (0 if c_prog_id == '' else 1)
  - cj_u3: XSUM('insulin', 'insulin_shipments', 'units', within_months=3, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=c_prog_id)
  - cj_d3: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=3, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=c_prog_id)
  - cv_u3: XSUM('insulin', 'insulin_shipments', 'units', within_months=3, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=c_prog_id) + XSUM('insulin', 'insulin_shipments', 'units', within_months=3, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=c_prog_id)
  - cv_d3: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=3, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=c_prog_id) + XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=3, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=c_prog_id)
  - cj_u6: XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=c_prog_id)
  - cj_d6: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=c_prog_id)
  - cv_u6: XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=c_prog_id) + XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=c_prog_id)
  - cv_d6: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=c_prog_id) + XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=c_prog_id)
  - cins_3m: cj_u3 * K('pump_insulin_unit_insulin') if c_src == 1 else (cv_u3 * K('vial_insulin') if c_src == 2 else 0)
  - cdays_3m: cj_d3 if c_src == 1 else (cv_d3 if c_src == 2 else 0)
  - cins_6m: cj_u6 * K('pump_insulin_unit_insulin') if c_src == 1 else (cv_u6 * K('vial_insulin') if c_src == 2 else 0)
  - cdays_6m: cj_d6 if c_src == 1 else (cv_d6 if c_src == 2 else 0)
  - cnj_units: XLATEST('insulin', 'insulin_shipments', 'units', date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=c_prog_id) or 0
  - cnj_days: XLATEST('insulin', 'insulin_shipments', 'supply_days', date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=c_prog_id) or 0
  - cna_date: XLATEST('insulin', 'insulin_shipments', 'ship_date', date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=c_prog_id) or ''
  - cna_units: XLATEST('insulin', 'insulin_shipments', 'units', date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=c_prog_id) or 0
  - cna_days: XLATEST('insulin', 'insulin_shipments', 'supply_days', date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=c_prog_id) or 0
  - cnl_date: XLATEST('insulin', 'insulin_shipments', 'ship_date', date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=c_prog_id) or ''
  - cnl_units: XLATEST('insulin', 'insulin_shipments', 'units', date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=c_prog_id) or 0
  - cnl_days: XLATEST('insulin', 'insulin_shipments', 'supply_days', date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=c_prog_id) or 0
  - cnew_ins: cnj_units * K('pump_insulin_unit_insulin') if c_src == 1 else (((cna_units if cna_date >= cnl_date else cnl_units) * K('vial_insulin')) if c_src == 2 else 0)
  - cnew_days: cnj_days if c_src == 1 else ((cna_days if cna_date >= cnl_date else cnl_days) if c_src == 2 else 0)
  - c_orders_3m: XCOUNT('insulin', 'insulin_orders', within_months=3, date_field='order_date', event_type='insulin_order_receipt', insulin_program_id=c_prog_id) if c_prog_id != '' else 0
  - w_variant: CFIELD('insulin', 'variant_name', status='active', delivery_method='insulin_pump') or ''
