  - pump_evt_denials_and_appeals
  overwrite:
  - base_policy: pump_liability_notice
    superseded_clause: charged at the Larkfield cash price of the units concerned
    replaced_by: For a non-covered item charge this policy reviews, and only for such a charge, the supported charge is the cash price of its liable units less the courtesy percents worked out below; a newly posted non-covered item charge follows the charge policy's own figures, and every other patient charge keeps the base cash-price rule.
  - base_policy: pump_evt_patient_account
    superseded_clause: never for more than that posting's unpaid remainder
    replaced_by: For a billing correction this policy posts against a non-covered item charge, and only for such a correction, the correction reverses the whole unsupported part of the charge even where payments were already applied to it, and the payments it frees are applied to the program's next oldest unpaid posting or refunded under the credit-balance rule; a hardship waiver or a remittance posting correction follows its own policy's limit, and every other adjustment keeps the base unpaid-remainder limit.
