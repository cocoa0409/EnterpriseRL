        denial_code: CO-151
    - table: pump_shipments
      aggregate: sum
      field: units
      filters:
        event_type: pump_return_receipt
    - table: pump_billing
      aggregate: count
      field: pump_ledger_id
      within_months: 6
      filters:
        event_type: pump_patient_payment
    - table: pump_billing
      aggregate: count
      field: pump_ledger_id
      within_months: 6
      filters:
        event_type: pump_patient_charge
        charge_type: non_covered_item
    cross_category: []
- id: pump_ext_unsupported_charge_reversal
