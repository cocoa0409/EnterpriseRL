  - v_d3: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=3, date_field='ship_date', item_code='insulin_aspart_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id) + XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=3, date_field='ship_date', item_code='insulin_lispro_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id)
