    g_order_qty: The standard ordered rate is the quantity per 30 days on the written order the newest authorization grant for the cartridge item rests on.
    ordered_rate: 'The standard ordered rate is the quantity per 30 days on the written order the newest authorization grant for the cartridge item rests on. The ordered rate follows the program''s written orders for the cartridge item in three cases: where a written order for the item is dated in the three months before the ship date, the standard ordered rate is replaced with the newest written order''s quantity per 30 days; where the newest written order for the item is older than that and the program has a previous refill of the item, it is replaced with the lesser of that order''s quantity per 30 days and the previous refill''s units times 30 divided by its supply days, rounded up; otherwise the standard ordered rate stands. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date.'
    std_blocks: The standard refill period is the tier's supply days per shipment divided by 30, giving the refill's 30-day blocks.
    grant_end: 'The standard refill period is the tier''s supply days per shipment divided by 30, giving the refill''s 30-day blocks. The refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for the cartridge item covers fewer days than the standard refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
    grant_days: 'The standard refill period is the tier''s supply days per shipment divided by 30, giving the refill''s 30-day blocks. The refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for the cartridge item covers fewer days than the standard refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
    pump_age_days: 'The standard refill period is the tier''s supply days per shipment divided by 30, giving the refill''s 30-day blocks. The refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for the cartridge item covers fewer days than the standard refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
    refill_blocks: 'The standard refill period is the tier''s supply days per shipment divided by 30, giving the refill''s 30-day blocks. The refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for the cartridge item covers fewer days than the standard refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
