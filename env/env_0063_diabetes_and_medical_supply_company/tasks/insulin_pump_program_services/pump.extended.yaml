  - g_units: LATEST('pump_orders', 'units_authorized', date_field='valid_from', event_type='pump_authorization_grant', item_code=cart_item) or 0
  - g_from: LATEST('pump_orders', 'valid_from', date_field='valid_from', event_type='pump_authorization_grant', item_code=cart_item) or NOW
  - g_order_rate: g_order_qty
  - olj_12m: COUNT('pump_orders', within_months=12, date_field='visit_date', event_type='pump_medical_record_receipt', record_purpose='over_limit_justification')
  - covered_rate: ((g_units * K('block_days')) // (DAYS(g_from, grant_end) + 1)) if g_basis == 'payer_prior_authorization' else (g_order_rate if (g_basis != 'payer_prior_authorization' and olj_12m > 0) else P('reservoirs_per_30_days'))
  - covered_cartridges: MN(cartridge_rate, covered_rate) * refill_blocks
  - above_cartridges: MX(0, cartridge_rate - covered_rate) * refill_blocks
  - notice_after: LATEST('pump_orders', 'notice_date', date_field='notice_date', event_type='pump_liability_notice_signed', item_code=cart_item) or ''
  - previous_refill: LATEST('pump_shipments', 'ship_date', date_field='ship_date', event_type='pump_refill_shipment', item_code=cart_item) or ''
  - open_notice_units: (LATEST('pump_orders', 'notice_units', date_field='notice_date', event_type='pump_liability_notice_signed', item_code=cart_item) or 0) if notice_after > previous_refill else 0
  - noticed_cartridges: MN(open_notice_units, above_cartridges)
  - result: MN(covered_cartridges + noticed_cartridges, F('authorized_units_remaining'))
  compute_basis:
    cart_item: The cartridge or reservoir item is the A4232 reservoir for a MiniMed 780G and the A4225 cartridge for every other model.
    o_recent_n: 'The standard ordered rate is the quantity per 30 days on the written order the newest authorization grant for the cartridge item rests on. The ordered rate follows the program''s written orders for the cartridge item in three cases: where a written order for the item is dated in the three months before the ship date, the standard ordered rate is replaced with the newest written order''s quantity per 30 days; where the newest written order for the item is older than that and the program has a previous refill of the item, it is replaced with the lesser of that order''s quantity per 30 days and the previous refill''s units times 30 divided by its supply days, rounded up; otherwise the standard ordered rate stands. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date.'
