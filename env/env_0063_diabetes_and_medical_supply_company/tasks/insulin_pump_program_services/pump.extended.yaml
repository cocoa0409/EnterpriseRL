    capped_rate: The standard expected rate is the quantity per 30 days on the written order the newest authorization grant for the item rests on. Each adjustment set out above changes the standard figure it names, replacements before limits; the notice units are then the expected rate less the allowance, never below zero, times the notice's 30-day blocks.
    result: Each adjustment set out above changes the standard figure it names, replacements before limits; the notice units are then the expected rate less the allowance, never below zero, times the notice's 30-day blocks.
  baseline:
    rule: A liability notice for the cartridges a coming refill ships above the payer's allowance is signed in the tier's notice type against the newest authorization grant for the cartridge item, the grant that refill draws on, for the notice units worked out as follows. The notice item is the A4232 reservoir for a MiniMed 780G and the A4225 cartridge for every other model. The standard notice period is the tier's supply days per shipment divided by 30, giving the notice's 30-day blocks. The standard allowance is the tier's reservoirs per 30 days. The standard expected rate is the quantity per 30 days on the written order the newest authorization grant for the item rests on. In the standard computation the notice units are the standard expected rate less the standard allowance, never below zero, times the standard notice period's 30-day blocks.
    params:
    - supply_days_per_shipment
    - reservoirs_per_30_days
    - block_days
  factors:
  - id: fx_nt_period
    effect: method
    decides: notice_blocks
    bindings:
    - no_end
    - ng_days
    - no_days
    - notice_blocks
    ladder:
    - when: the newest authorization grant for the item ends fewer days after today than the standard notice period, counted from today through its valid-through date with both days included
      method: the standard blocks are replaced with the whole 30-day blocks within those days
    - when: the grant runs that long but the newest written order for the item ends within the standard notice period, counted the same way
      method: the standard blocks are replaced with the whole 30-day blocks to the order's valid-through date
    - when: otherwise
      method: the standard blocks stand
    baseline:
      notice_blocks: std_blocks
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: fx_nt_allowance
    effect: parameter
    decides: allowance
    bindings:
    - ng_basis
    - ng_units
    - ng_from
    - n_olj
    - allowance
    ladder:
    - when: the newest authorization grant for the item is a payer prior authorization
      value: its units authorized times 30 divided by the days its span covers, both ends included, rounded down
    - when: it rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file
      value: the quantity per 30 days on the written order it rests on
    - when: otherwise
      value: P('reservoirs_per_30_days')
    baseline:
      allowance: P('reservoirs_per_30_days')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: fx_nt_expected
    effect: parameter
    decides: expected_rate
    bindings:
    - n_newest_qty
    - n_prev_units
    - n_prev_days
    - n_recent
    - expected_rate
    ladder:
    - when: a written order for the item is dated in the three months before today
      value: the newest written order's quantity per 30 days
    - when: the newest written order is older than that and the program has a previous refill of the item
      value: the lesser of that order's quantity and the previous refill's units times 30 divided by its supply days, rounded up
    - when: otherwise
      value: the quantity on the written order the newest authorization grant rests on
    baseline:
      expected_rate: ng_order_qty
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: fx_nt_insulin_cap
    effect: method
    decides: cap_basis
    bindings:
    - ni_prog
    - ni_variant
    - n_fill
    - oq_j
    - od_a
    - oq_a
    - od_l
    - oq_l
    - dose_ins
    - nj_u6
    - nj_d6
    - nv_u6
    - nv_d6
    - n_ins_6m
    - n_days_6m
    - cap_dose
    - cap_6m
    - cap_variant
    - cap_orders_3m
    - cap_days_6m
    - cap_basis
    ladder:
    - when: a written order for the customer's pump insulin dated in the three months before today is on the active pump-delivery insulin pharmacy program
      method: the expected rate is held to no more than the cartridges per 30 days the prescribed dose fills at the pump's fill
    - when: no such order is on it but pump insulin was dispensed under it in the six months before today
      method: the expected rate is held to no more than the cartridges per 30 days those dispensings fill at the pump's fill
    - when: otherwise
      method: the expected rate is not held
    baseline:
      cap_basis: '3'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: insulin
