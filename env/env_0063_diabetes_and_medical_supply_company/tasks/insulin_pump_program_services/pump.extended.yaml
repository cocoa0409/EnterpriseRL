- id: pump_ext_hardship_waiver_amount
  base_policy_refs:
  - pump_evt_patient_account
  - pump_holds_and_closure
  overwrite:
  - base_policy: pump_evt_patient_account
    superseded_clause: never for more than that posting's unpaid remainder
    replaced_by: For a hardship waiver this policy posts, and only for such a waiver, the waiver is figured on the named posting's amount less the adjustments against it even where payments were already applied to that posting, and any payment it leaves uncovered is applied to the program's next oldest unpaid posting or refunded under the credit-balance rule, as financial assistance refunds what a customer paid above the assisted amount; a billing correction follows its own policy's limit, and every other adjustment keeps the base unpaid-remainder limit.
  trigger: state_due
  subject:
  - pump_balance_adjustment
  computes: amount
  target_tool: post_hardship_waiver_2af40412
  params:
    standard_share_pct: 40
    effort_full_points: 10
    effort_partial_points: 5
    long_age_days: 180
    short_age_days: 90
    aged_full_points: 10
    aged_partial_points: 5
    history_full_points: 10
    history_partial_points: 5
    balance_full_points: 10
    balance_partial_points: 5
    high_cost_share_pct: 20
    cost_full_points: 10
    cost_partial_points: 5
    burden_points: 10
  rule: 'For a hardship waiver this policy posts, and only for such a waiver, the waiver is figured on the named posting''s amount less the adjustments against it even where payments were already applied to that posting, and any payment it leaves uncovered is applied to the program''s next oldest unpaid posting or refunded under the credit-balance rule, as financial assistance refunds what a customer paid above the assisted amount; a billing correction follows its own policy''s limit, and every other adjustment keeps the base unpaid-remainder limit. A hardship waiver on an insulin pump program is posted against the posting the program''s approved hardship application names, for the amount worked out as follows. The hardship waiver on a posting is figured only after that posting carries no patient responsibility beyond what its remittance supports. The waiver base is the named posting''s amount less every balance adjustment already posted against it, never below zero. In the standard computation the waiver is the standard share percent of the waiver base, rounded half up to the cent. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window. The household burden follows the customer''s other Larkfield programs, the active insulin pharmacy program whose delivery method is insulin pump and the active CGM program, in three cases: where both carry a balance above zero, the standard share is replaced with 100 percent, the whole waiver base; where exactly one of them carries a balance above zero, the burden points are added to the share; otherwise nothing is added. The payment-effort points follow the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the full effort points are added to the share; where a payment posted in the six months before today but not in both of those three-month spans, the partial effort points are added; otherwise nothing is added. The aged-posting points follow the named posting''s age in three cases: where it was posted more than the long age days before today, the full aged points are added to the share; where it was posted more than the short age days but not more than the long age days before today, the partial aged points are added; otherwise nothing is added. The assistance-history points follow the program''s earlier hardship waivers in three cases: where no hardship waiver was ever posted on the program, the full history points are added to the share; where none was posted in the 12 months before today but an older one was, the partial history points are added; otherwise nothing is added. The balance points follow the program balance, the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments, in three cases: where it is at least the tier''s payment-plan minimum balance, the full balance points are added to the share; where it is at least the tier''s past-due hold minimum but below the payment-plan minimum balance, the partial balance points are added; otherwise nothing is added. The cost-share points follow the share of the named remittance''s allowed amount the payer left to the member, its allowed amount less the payer''s payment divided by its allowed amount, in three cases: where that share is at least the high cost-share percent, the full cost-share points are added to the share; where it is above zero but below the high cost-share percent, the partial cost-share points are added; otherwise nothing is added. Each adjustment set out above changes the standard share as it states, a replacement taking precedence over additions; the share is never more than 100 percent, and the waiver is the waiver base times the share, rounded half up to the cent.'
