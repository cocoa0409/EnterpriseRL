    covered_cartridges: The covered cartridges are the lesser of the cartridge rate and the covered rate, times the refill's 30-day blocks.
    above_cartridges: The cartridges above coverage are the cartridge rate less the covered rate, never below zero, times the refill's 30-day blocks.
    notice_after: The noticed cartridges are the lesser of the cartridges above coverage and the units of the newest liability notice for the cartridge item when that notice was signed after the program's previous refill of that item, and none otherwise.
    previous_refill: The noticed cartridges are the lesser of the cartridges above coverage and the units of the newest liability notice for the cartridge item when that notice was signed after the program's previous refill of that item, and none otherwise.
    open_notice_units: The noticed cartridges are the lesser of the cartridges above coverage and the units of the newest liability notice for the cartridge item when that notice was signed after the program's previous refill of that item, and none otherwise.
    noticed_cartridges: The noticed cartridges are the lesser of the cartridges above coverage and the units of the newest liability notice for the cartridge item when that notice was signed after the program's previous refill of that item, and none otherwise. The noticed cartridges are fixed only after the cartridge item carries a liability notice signed after the program's previous refill of that item.
    result: The cartridges shipped are the covered cartridges plus the noticed cartridges, never more than the program's authorized units remaining. Each adjustment set out above changes the standard figure it names, replacements before limits; the covered cartridges, the cartridges above coverage, the noticed cartridges and the cartridges shipped are then figured from the cartridge rate and the refill's 30-day blocks as set out above.
  baseline:
    rule: 'The cartridge or reservoir item is the A4232 reservoir for a MiniMed 780G and the A4225 cartridge for every other model. The standard refill period is the tier''s supply days per shipment divided by 30, giving the refill''s 30-day blocks. The standard ordered rate is the quantity per 30 days on the written order the newest authorization grant for the cartridge item rests on. The standard cartridge rate is the ordered rate. The customer''s pump insulin is the insulin dispensed under the customer''s active insulin pharmacy program whose delivery method is insulin pump, counted in the standard way from its J1817 dispensing, each billing unit holding the pump insulin unit insulin. The daily pump insulin is, in the standard way, the pump insulin dispensed in the three months before the ship date divided by the supply days those dispensings cover, and zero when nothing was dispensed in that time. The usable fill per cartridge is the Mobi fill for a Tandem Mobi, the iLet fill for a Beta Bionics iLet and the standard fill for every other model. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date. The covered rate follows the authorization being drawn in three cases: where the newest authorization grant for the cartridge item is a payer prior authorization, the covered rate is that prior authorization''s rate, its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where the newest grant rests on the written order itself and an over-limit justification record dated in the 12 months before the ship date is on file, the covered rate is the written order''s quantity; otherwise the covered rate is the tier''s reservoirs per 30 days. The covered cartridges are the lesser of the cartridge rate and the covered rate, times the refill''s 30-day blocks. The cartridges above coverage are the cartridge rate less the covered rate, never below zero, times the refill''s 30-day blocks. The noticed cartridges are the lesser of the cartridges above coverage and the units of the newest liability notice for the cartridge item when that notice was signed after the program''s previous refill of that item, and none otherwise. The cartridges shipped are the covered cartridges plus the noticed cartridges, never more than the program''s authorized units remaining. In the standard computation the cartridge rate is the standard ordered rate, the covered cartridges are the lesser of that rate and the covered rate times the standard refill period''s 30-day blocks, the cartridges above coverage are that rate less the covered rate, never below zero, times those blocks, and the cartridges shipped are the covered cartridges plus the noticed cartridges, never more than the program''s authorized units remaining.'
