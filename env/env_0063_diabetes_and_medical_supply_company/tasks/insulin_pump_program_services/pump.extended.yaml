  cross_category: []
  compute:
  - x_amount: MAX('pump_billing', 'amount', event_type='pump_patient_charge', charge_type='non_covered_item')
  - x_id: LATEST('pump_billing', 'pump_ledger_id', date_field='posting_date', event_type='pump_patient_charge', charge_type='non_covered_item', amount=x_amount) or ''
  - x_posted: LATEST('pump_billing', 'posting_date', date_field='posting_date', pump_ledger_id=x_id) or NOW
  - x_ship: LATEST('pump_billing', 'pump_shipment_id', date_field='posting_date', pump_ledger_id=x_id) or ''
  - x_claim: LATEST('pump_billing', 'pump_ledger_id', date_field='posting_date', event_type='pump_claim_submission', submission_type='original', pump_shipment_id=x_ship) or ''
  - x_denial_date: LATEST('pump_billing', 'posting_date', date_field='posting_date', event_type='pump_claim_denial', original_pump_ledger_id=x_claim) or x_posted
  - x_co151: COUNT('pump_billing', event_type='pump_claim_denial', denial_code='CO-151', original_pump_ledger_id=x_claim)
  - x_item: LATEST('pump_shipments', 'item_code', date_field='ship_date', pump_shipment_id=x_ship) or ''
  - x_units: LATEST('pump_shipments', 'units', date_field='ship_date', pump_shipment_id=x_ship) or 0
  - x_days: LATEST('pump_shipments', 'supply_days', date_field='ship_date', pump_shipment_id=x_ship) or 0
  - x_date: LATEST('pump_shipments', 'ship_date', date_field='ship_date', pump_shipment_id=x_ship) or ''
  - x_grant: LATEST('pump_shipments', 'pump_order_id', date_field='ship_date', pump_shipment_id=x_ship) or ''
  - x_order: LATEST('pump_orders', 'related_pump_order_id', date_field='valid_from', pump_order_id=x_grant) or ''
  - x_price: K('cash_price_a4225') if x_item == 'A4225' else (K('cash_price_a4232') if x_item == 'A4232' else (K('cash_price_a4224') if x_item == 'A4224' else (K('cash_price_a4239') if x_item == 'A4239' else ((K('cash_price_pump_tandem_mobi') if F('pump_model') == 'tandem_mobi' else (K('cash_price_pump_tandem_tslim_x2') if F('pump_model') == 'tandem_tslim_x2' else (K('cash_price_pump_minimed_780g') if F('pump_model') == 'minimed_780g' else (K('cash_price_pump_beta_bionics_ilet') if F('pump_model') == 'beta_bionics_ilet' else 0)))) if x_item == 'E0784' else 0))))
  - xn_date: LATEST('pump_orders', 'notice_date', date_field='notice_date', event_type='pump_liability_notice_signed', related_pump_order_id=x_grant) or ''
  - xn_units: LATEST('pump_orders', 'notice_units', date_field='notice_date', event_type='pump_liability_notice_signed', related_pump_order_id=x_grant) or 0
  - x_od: COUNT('pump_orders', event_type='pump_prior_auth_denial', item_code=x_item)
  - x_liab_basis: 1 if (F('variant_name') == 'Insulin Pump Medicare Advantage Program' and x_od > 0) else (2 if (F('variant_name') != 'Insulin Pump Medicare Advantage Program' and xn_date != '' and xn_date <= x_date) else 3)
  - corr_sum: SUM('pump_billing', 'amount', event_type='pump_balance_adjustment', adjustment_reason='billing_correction', original_pump_ledger_id=x_id)
  - waiver_sum: SUM('pump_billing', 'amount', event_type='pump_balance_adjustment', adjustment_reason='hardship_waiver', original_pump_ledger_id=x_id)
  - x_credits: RND(corr_sum + waiver_sum, 2)
  - rv_basis: LATEST('pump_orders', 'authorization_basis', date_field='valid_from', pump_order_id=x_grant) or ''
  - rv_units_auth: LATEST('pump_orders', 'units_authorized', date_field='valid_from', pump_order_id=x_grant) or 0
  - rv_from: LATEST('pump_orders', 'valid_from', date_field='valid_from', pump_order_id=x_grant) or NOW
  - rv_through: LATEST('pump_orders', 'valid_through', date_field='valid_from', pump_order_id=x_grant) or NOW
  - rv_order_rate: LATEST('pump_orders', 'quantity_per_30_days', date_field='order_date', pump_order_id=x_order) or 0
  - rv_olj: COUNT('pump_orders', within_months=12, date_field='visit_date', event_type='pump_medical_record_receipt', record_purpose='over_limit_justification')
  - rv_cover: ((rv_units_auth * K('block_days')) // (DAYS(rv_from, rv_through) + 1)) if rv_basis == 'payer_prior_authorization' else (rv_order_rate if (rv_basis != 'payer_prior_authorization' and rv_olj > 0) else P('reservoirs_per_30_days'))
  - xr_cc_n: COUNT('pump_billing', event_type='pump_claim_submission', submission_type='corrected', pump_shipment_id=x_ship)
  - xr_cc_billed: LATEST('pump_billing', 'billed_amount', date_field='posting_date', event_type='pump_claim_submission', submission_type='corrected', pump_shipment_id=x_ship) or 0
  - xr_orig_billed: SUM('pump_billing', 'billed_amount', event_type='pump_claim_submission', submission_type='original', pump_shipment_id=x_ship)
  - xr_cc_off: RND((xr_orig_billed - xr_cc_billed) * x_units / xr_orig_billed, 0) if (xr_cc_n > 0 and xr_orig_billed > 0) else 0
  - xr_received: SUM('pump_shipments', 'units', event_type='pump_return_receipt', original_pump_shipment_id=x_ship)
  - x_returned: xr_cc_off if xr_cc_n > 0 else (xr_received if xr_received > 0 else 0)
  - x_late_days: DAYS(x_denial_date, x_posted)
  - x_late_pct: K('late_courtesy_pct') if x_late_days > K('late_full_days') else (K('late_courtesy_pct') / 2 if (x_late_days > K('late_half_days') and x_late_days <= K('late_full_days')) else 0)
  - x_pays_3m: COUNT('pump_billing', within_months=3, date_field='posting_date', event_type='pump_patient_payment')
  - x_pays_6m: COUNT('pump_billing', within_months=6, date_field='posting_date', event_type='pump_patient_payment')
  - x_pay_pct: K('payment_history_pct') if (x_pays_3m > 0 and x_pays_6m > x_pays_3m) else (K('payment_history_pct') / 2 if (x_pays_6m > 0 and not (x_pays_3m > 0 and x_pays_6m > x_pays_3m)) else 0)
  - other_recent: COUNT('pump_billing', within_months=K('first_liability_months'), date_field='posting_date', event_type='pump_patient_charge', charge_type='non_covered_item') - (1 if (x_posted != '' and MONTHS(x_posted, NOW) < K('first_liability_months')) else 0)
  - other_all: COUNT('pump_billing', event_type='pump_patient_charge', charge_type='non_covered_item') - 1
  - x_first_pct: K('first_liability_pct') if (other_all == 0 and other_recent == 0) else (K('first_liability_pct') / 2 if (other_all > 0 and other_recent == 0) else 0)
  - x_open: RND(x_amount - x_credits, 2)
  - x_pr204: COUNT('pump_billing', event_type='pump_claim_denial', denial_code='PR-204', original_pump_ledger_id=x_claim)
  - x_co197: COUNT('pump_billing', event_type='pump_claim_denial', denial_code='CO-197', original_pump_ledger_id=x_claim)
  - x_gthru: LATEST('pump_orders', 'valid_through', date_field='valid_from', pump_order_id=x_grant) or ''
  - x_gfrom: LATEST('pump_orders', 'valid_from', date_field='valid_from', pump_order_id=x_grant) or ''
  - x_denied: (MX(0, x_units - rv_cover * x_days // K('block_days'))) if x_co151 > 0 else (x_units if (x_pr204 > 0 or (x_co197 > 0 and (x_gthru == '' or x_gthru < x_date or x_gfrom > x_date))) else 0)
  - x_liable: x_denied if x_liab_basis == 1 else (MN(x_denied, xn_units) if x_liab_basis == 2 else 0)
  - x_supported: (((MX(0, x_liable - x_returned) * x_price * (100 - x_late_pct - x_pay_pct - x_first_pct) / 100) * 100 + 0.5000001) // 1) / 100
  - result: (((MX(0, x_open - x_supported)) * 100 + 0.5000001) // 1) / 100
