  rule: 'For a non-covered item charge this policy reviews, and only for such a charge, the supported charge is the cash price of its liable units less the courtesy percents worked out below; a newly posted non-covered item charge follows the charge policy''s own figures, and every other patient charge keeps the base cash-price rule. For a billing correction this policy posts against a non-covered item charge, and only for such a correction, the correction reverses the whole unsupported part of the charge even where payments were already applied to it, and the payments it frees are applied to the program''s next oldest unpaid posting or refunded under the credit-balance rule; a hardship waiver or a remittance posting correction follows its own policy''s limit, and every other adjustment keeps the base unpaid-remainder limit. A billing correction reverses the part of the program''s largest non-covered item charge that the charter does not let the charge carry, as follows. The charge under review is the program''s non-covered item charge with the largest amount; its shipment is the line it bills, that line''s grant is the authorization grant it drew on, the line''s written order is the order that grant rests on, and the line''s denial is the claim denial answering the original claim for that shipment. The charge''s open amount is its amount less the credits already set against it. The credits set against the charge are the billing corrections and hardship waivers already posted against it. The cash price per unit for the reviewed line is the Larkfield cash price of its item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The standard covered rate for the reviewed line is the tier''s reservoirs per 30 days. The reviewed line''s denied units follow the denial answering its original claim: where a CO-151 denial answers it, they are its units less the covered rate times its supply days divided by 30, never below zero; where a PR-204 denial answers it, or a CO-197 denial does and the grant the line drew on did not cover its ship date, its valid-from date being later or its valid-through date earlier than the ship date, so that the denial is not appealed, every unit of the line is denied; otherwise none is. In the standard computation the reviewed charge has no supported part and the reversal is the charge''s open amount. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window. The covered rate for the reviewed line follows the grant the line drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with the written order''s quantity per 30 days; otherwise the standard covered rate stands. The supported charge follows the tier and the line''s liability records in three cases: where the tier is the Medicare Advantage tier and the plan issued an organization determination denial for the line''s item, the standard of no supported part is replaced with every denied unit at the cash price per unit; where the tier is any other tier and the newest liability notice signed against the line''s grant was signed on or before the line''s ship date, it is replaced with the lesser of the denied units and that notice''s units at the cash price per unit, a notice signed after the ship date covering only later lines of the grant; otherwise nothing is supported. Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the supported charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the supported charge; otherwise nothing is taken off. The late-billing courtesy on the reviewed charge follows the days from the line''s denial posting date to the charge''s posting date in three cases: where those days exceed the late full days, the supported charge is reduced by the late courtesy percent; where they exceed the late half days but not the late full days, it is reduced by half the late courtesy percent; otherwise there is no late-billing courtesy. The payment-history courtesy on the reviewed charge follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the supported charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, it is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. The first-liability courtesy on the reviewed charge follows the program''s other non-covered item charges in three cases: where the program carries no other non-covered item charge and none posted in the first-liability months before today, the supported charge is reduced by the first-liability percent; where it carries another one but none posted in those months, it is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. Each adjustment set out above changes the supported charge as it states: replacements first, then the amounts taken off, never below zero, then the percentage reductions, which add together and are taken once from the supported charge; the supported charge is rounded half up to the cent, and the reversal is the charge''s open amount less the supported charge, never below zero, rounded half up to the cent.'
