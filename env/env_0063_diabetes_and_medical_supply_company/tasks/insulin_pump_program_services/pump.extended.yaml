    usable_fill: The usable fill per cartridge is the Mobi fill for a Tandem Mobi, the iLet fill for a Beta Bionics iLet and the standard fill for every other model.
    insulin_cartridges: The standard cartridge rate is the ordered rate. Each adjustment set out above changes the standard figure it names, replacements before limits; the covered cartridges, the cartridges above coverage, the noticed cartridges and the cartridges shipped are then figured from the cartridge rate and the refill's 30-day blocks as set out above.
    rt_variant: 'The standard cartridge rate is the ordered rate. The cartridge rate follows the customer''s dispensing in three cases: where the customer holds an active pump-delivery insulin pharmacy program and its pump insulin item, J1817 on the Insulin Pharmacy Medicare Part B Pump Insulin Program and rapid-acting 10 mL vials on any other tier, was dispensed under it in the six months before the ship date, the standard cartridge rate is replaced with the lesser of the ordered rate and the cartridges the daily pump insulin needs per 30 days, 30 times the daily pump insulin divided by the usable fill per cartridge, rounded up to a whole cartridge and never fewer than one cartridge for every stability period of days in 30 days, rounded up; where the customer holds such a program but that item was not dispensed under it in those six months, it is replaced with the tier''s reservoirs per 30 days; otherwise the standard cartridge rate stands. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date.'
    rate_days_6m: 'The standard cartridge rate is the ordered rate. The cartridge rate follows the customer''s dispensing in three cases: where the customer holds an active pump-delivery insulin pharmacy program and its pump insulin item, J1817 on the Insulin Pharmacy Medicare Part B Pump Insulin Program and rapid-acting 10 mL vials on any other tier, was dispensed under it in the six months before the ship date, the standard cartridge rate is replaced with the lesser of the ordered rate and the cartridges the daily pump insulin needs per 30 days, 30 times the daily pump insulin divided by the usable fill per cartridge, rounded up to a whole cartridge and never fewer than one cartridge for every stability period of days in 30 days, rounded up; where the customer holds such a program but that item was not dispensed under it in those six months, it is replaced with the tier''s reservoirs per 30 days; otherwise the standard cartridge rate stands. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date.'
