  overwrite:
  - base_policy: pump_liability_notice
    superseded_clause: charged at the Larkfield cash price of the units concerned
    replaced_by: For a non-covered item charge this policy posts, and only for such a charge, the charge is the cash price of the liable units less the courtesy percents worked out below; a non-covered item charge under review for a billing correction is supported by the reversal policy's own figures, and every other patient charge keeps the base cash-price rule.
  trigger: state_due
  subject:
  - pump_patient_charge
  computes: amount
  target_tool: post_non_covered_item_charge_86d5d568
  params:
    block_days: 30
    cash_price_a4225: 6.85
    cash_price_a4232: 7.1
    late_full_days: 90
    late_half_days: 45
    late_courtesy_pct: 20
    payment_history_pct: 5
    first_liability_months: 6
    first_liability_pct: 10
    cash_price_a4224: 38.4
    cash_price_a4239: 395.0
    cash_price_pump_tandem_tslim_x2: 6295.0
    cash_price_pump_tandem_mobi: 4995.0
    cash_price_pump_minimed_780g: 7350.0
    cash_price_pump_beta_bionics_ilet: 5250.0
  rule: 'For a non-covered item charge this policy posts, and only for such a charge, the charge is the cash price of the liable units less the courtesy percents worked out below; a non-covered item charge under review for a billing correction is supported by the reversal policy''s own figures, and every other patient charge keeps the base cash-price rule. A non-covered item charge owed on an insulin pump program is posted for the shipment the program''s newest CO-151 claim denial bills, and is worked out as follows. A non-covered item charge is posted only after the program carries no non-covered item charge larger than the charge its shipment''s liability records and the payer''s denial support. The denied line is the shipment the newest CO-151 denial''s claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on. The cash price per unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The standard covered rate for a denied line is the tier''s reservoirs per 30 days. The denied units are the line''s units less the covered rate times the line''s supply days divided by 30, never below zero. In the standard computation the denied line is Larkfield''s write-off and nothing is charged. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window. The covered rate for a denied line follows the grant the line drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with the written order''s quantity per 30 days; otherwise the standard covered rate stands. The charge follows the tier and the line''s liability records in three cases: where the tier is the Medicare Advantage tier and the plan issued an organization determination denial for the line''s item, the standard write-off is replaced with a charge of every denied unit at the cash price per unit; where the tier is any other tier and the newest liability notice signed against the line''s grant was signed on or before the line''s ship date, it is replaced with a charge of the lesser of the denied units and that notice''s units at the cash price per unit, a notice signed after the ship date covering only later lines of the grant; otherwise the standard write-off stands. Returned units follow the line''s return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the charge; otherwise nothing is taken off. The late-billing courtesy follows the days from the denial''s posting date to today in three cases: where those days exceed the late full days, the charge is reduced by the late courtesy percent; where they exceed the late half days but not the late full days, the charge is reduced by half the late courtesy percent; otherwise there is no late-billing courtesy. The payment-history courtesy follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, the charge is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. The first-liability courtesy follows the program''s non-covered item charges in three cases: where the program carries no non-covered item charge posted in the first-liability months before today and none at all before, the charge is reduced by the first-liability percent; where it carries none posted in those months but an older one, the charge is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. Each adjustment set out above changes the charge as it states: replacements first, then the amounts taken off, never below zero, then the percentage reductions, which add together and are taken once from the charge; the charge is then rounded half up to the cent.'
  prerequisite:
