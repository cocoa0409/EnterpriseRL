    liab_basis: 'The charge follows the tier and the line''s liability records in three cases: where the tier is the Medicare Advantage tier and the plan issued an organization determination denial for the line''s item, the standard write-off is replaced with a charge of every denied unit at the cash price per unit; where the tier is any other tier and the newest liability notice signed against the line''s grant was signed on or before the line''s ship date, it is replaced with a charge of the lesser of the denied units and that notice''s units at the cash price per unit, a notice signed after the ship date covering only later lines of the grant; otherwise the standard write-off stands.'
    nc_basis: 'The standard covered rate for a denied line is the tier''s reservoirs per 30 days. The covered rate for a denied line follows the grant the line drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with the written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
