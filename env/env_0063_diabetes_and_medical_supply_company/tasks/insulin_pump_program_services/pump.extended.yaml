    d_grant: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
    d_order: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
    unit_price: 'The cash price per unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump.'
