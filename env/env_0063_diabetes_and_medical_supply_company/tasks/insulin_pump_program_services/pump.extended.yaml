  - j_d6: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=ins_prog_id)
  - v_u6: XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', item_code='insulin_aspart_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id) + XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', item_code='insulin_lispro_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id)
