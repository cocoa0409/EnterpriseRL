    rt_received: 'Returned units follow the line''s return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the charge; otherwise nothing is taken off.'
    nc_returned: 'Returned units follow the line''s return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the charge; otherwise nothing is taken off.'
    late_days: 'The late-billing courtesy follows the days from the denial''s posting date to today in three cases: where those days exceed the late full days, the charge is reduced by the late courtesy percent; where they exceed the late half days but not the late full days, the charge is reduced by half the late courtesy percent; otherwise there is no late-billing courtesy.'
    late_pct: 'The late-billing courtesy follows the days from the denial''s posting date to today in three cases: where those days exceed the late full days, the charge is reduced by the late courtesy percent; where they exceed the late half days but not the late full days, the charge is reduced by half the late courtesy percent; otherwise there is no late-billing courtesy.'
    pays_3m: 'The payment-history courtesy follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, the charge is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    pays_6m: 'The payment-history courtesy follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, the charge is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    pay_pct: 'The payment-history courtesy follows the program''s payments in three cases: where a payment posted in the three months before today and another in the three months before those, the charge is reduced by the payment-history percent; where a payment posted in the six months before today but not in both of those three-month spans, the charge is reduced by half the payment-history percent; otherwise there is no payment-history courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    recent_liability: 'The first-liability courtesy follows the program''s non-covered item charges in three cases: where the program carries no non-covered item charge posted in the first-liability months before today and none at all before, the charge is reduced by the first-liability percent; where it carries none posted in those months but an older one, the charge is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    all_liability: 'The first-liability courtesy follows the program''s non-covered item charges in three cases: where the program carries no non-covered item charge posted in the first-liability months before today and none at all before, the charge is reduced by the first-liability percent; where it carries none posted in those months but an older one, the charge is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    first_pct: 'The first-liability courtesy follows the program''s non-covered item charges in three cases: where the program carries no non-covered item charge posted in the first-liability months before today and none at all before, the charge is reduced by the first-liability percent; where it carries none posted in those months but an older one, the charge is reduced by half the first-liability percent; otherwise there is no first-liability courtesy. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    denied_units: The denied units are the line's units less the covered rate times the line's supply days divided by 30, never below zero.
    liable_units: 'Each adjustment set out above changes the charge as it states: replacements first, then the amounts taken off, never below zero, then the percentage reductions, which add together and are taken once from the charge; the charge is then rounded half up to the cent.'
    result: 'Each adjustment set out above changes the charge as it states: replacements first, then the amounts taken off, never below zero, then the percentage reductions, which add together and are taken once from the charge; the charge is then rounded half up to the cent.'
  baseline:
    rule: 'A non-covered item charge owed on an insulin pump program is posted for the shipment the program''s newest CO-151 claim denial bills, and is worked out as follows. The denied line is the shipment the newest CO-151 denial''s claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on. The cash price per unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The standard covered rate for a denied line is the tier''s reservoirs per 30 days. The denied units are the line''s units less the covered rate times the line''s supply days divided by 30, never below zero. In the standard computation the denied line is Larkfield''s write-off and nothing is charged.'
    params:
    - block_days
    - cash_price_a4224
    - cash_price_a4225
    - cash_price_a4232
    - cash_price_a4239
    - cash_price_pump_beta_bionics_ilet
    - cash_price_pump_minimed_780g
    - cash_price_pump_tandem_mobi
    - cash_price_pump_tandem_tslim_x2
    - reservoirs_per_30_days
  factors:
  - id: fx_nc_cover
    effect: parameter
    decides: nc_cover
    bindings:
    - nc_basis
    - nc_units_auth
    - nc_from
    - nc_through
    - nc_order_rate
    - nc_olj
    - nc_cover
    ladder:
    - when: the grant the denied line drew on is a payer prior authorization
      value: its units authorized times 30 divided by the days its span covers, both ends included, rounded down
    - when: that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file
      value: the written order's quantity per 30 days
    - when: otherwise
      value: P('reservoirs_per_30_days')
    baseline:
      nc_cover: P('reservoirs_per_30_days')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: fx_nc_returns
    effect: parameter
    decides: nc_returned
    bindings:
    - rt_cc_n
    - rt_cc_billed
    - rt_orig_billed
    - rt_cc_off
    - rt_received
    - nc_returned
    ladder:
    - when: a corrected claim for the line has been transmitted
      value: the units the corrected claim no longer bills, taken off the charge at the cash price
    - when: no corrected claim is on file but the warehouse has received unopened units of the line back
      value: those received units, taken off the charge at the cash price
    - when: otherwise
      value: '0'
    baseline:
      nc_returned: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fx_nc_late_billing
    effect: parameter
    decides: late_pct
    bindings:
    - late_days
    - late_pct
    ladder:
    - when: more than the late full days have passed from the denial's posting date to today
      value: K('late_courtesy_pct')
    - when: more than the late half days but not more than the late full days have passed
      value: half of K('late_courtesy_pct')
    - when: otherwise
      value: '0'
    baseline:
      late_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: fx_nc_payment_history
    effect: parameter
    decides: pay_pct
    bindings:
    - pays_3m
    - pays_6m
    - pay_pct
    ladder:
    - when: a payment posted in the three months before today and another in the three months before those
      value: K('payment_history_pct')
    - when: a payment posted in the six months before today but not in both three-month spans
      value: half of K('payment_history_pct')
    - when: otherwise
      value: '0'
    baseline:
      pay_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fx_nc_first_liability
    effect: parameter
    decides: first_pct
    bindings:
    - recent_liability
    - all_liability
    - first_pct
    ladder:
    - when: the program carries no non-covered item charge posted in the first-liability months before today and none before
      value: K('first_liability_pct')
    - when: it carries none posted in those months but an older one
      value: half of K('first_liability_pct')
    - when: otherwise
      value: '0'
    baseline:
      first_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fx_nc_liability
    effect: method
    decides: liab_basis
    bindings:
    - nt_date
    - nt_units
    - nc_od
    - liab_basis
    ladder:
    - when: the tier is the Medicare Advantage tier and the plan issued an organization determination denial for the line's item
      method: the standard write-off is replaced with a charge of every denied unit
    - when: the tier is any other tier and the newest liability notice signed against the line's grant was signed on or before the line's ship date
      method: the standard write-off is replaced with a charge of the lesser of the denied units and that notice's units
    - when: otherwise
      method: the standard write-off stands
    baseline:
      liab_basis: '3'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
