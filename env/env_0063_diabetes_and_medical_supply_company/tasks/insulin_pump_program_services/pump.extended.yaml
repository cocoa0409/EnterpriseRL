  compute:
  - hw_post: LATEST('pump_requests', 'pump_ledger_id', date_field='received_at', request_type='hardship_application', request_status='approved') or ''
  - hw_amount: SUM('pump_billing', 'amount', pump_ledger_id=hw_post)
  - hw_adjusted: SUM('pump_billing', 'amount', event_type='pump_balance_adjustment', original_pump_ledger_id=hw_post)
  - hw_base: RND(MX(0, hw_amount - hw_adjusted), 2) if hw_post != '' else 0
  - ins_balance: CFIELD('insulin', 'patient_balance_due', status='active', delivery_method='insulin_pump') or 0
  - cgm_balance: CFIELD('cgm', 'patient_balance_due', status='active') or 0
  - burden_basis: 1 if (ins_balance > 0 and cgm_balance > 0) else (2 if ((ins_balance > 0 and cgm_balance <= 0) or (ins_balance <= 0 and cgm_balance > 0)) else 3)
  - pays_3m: COUNT('pump_billing', within_months=3, date_field='posting_date', event_type='pump_patient_payment')
  - pays_6m: COUNT('pump_billing', within_months=6, date_field='posting_date', event_type='pump_patient_payment')
  - effort_pts: K('effort_full_points') if (pays_3m > 0 and pays_6m > pays_3m) else (K('effort_partial_points') if (pays_6m > 0 and not (pays_3m > 0 and pays_6m > pays_3m)) else 0)
  - hw_post_date: LATEST('pump_billing', 'posting_date', date_field='posting_date', pump_ledger_id=hw_post) or NOW
  - hw_age: DAYS(hw_post_date, NOW)
  - aged_pts: K('aged_full_points') if hw_age > K('long_age_days') else (K('aged_partial_points') if (hw_age > K('short_age_days') and hw_age <= K('long_age_days')) else 0)
  - waivers_12m: COUNT('pump_billing', within_months=12, date_field='posting_date', event_type='pump_balance_adjustment', adjustment_reason='hardship_waiver')
  - waivers_all: COUNT('pump_billing', event_type='pump_balance_adjustment', adjustment_reason='hardship_waiver')
  - history_pts: K('history_full_points') if waivers_all == 0 else (K('history_partial_points') if (waivers_12m == 0 and waivers_all > 0) else 0)
  - hw_balance: RND(SUM('pump_billing', 'amount', event_type='pump_claim_adjudication') + SUM('pump_billing', 'amount', event_type='pump_patient_charge') + SUM('pump_billing', 'amount', event_type='pump_patient_refund') - SUM('pump_billing', 'amount', event_type='pump_patient_payment') - SUM('pump_billing', 'amount', event_type='pump_balance_adjustment'), 2)
  - balance_pts: K('balance_full_points') if hw_balance >= P('payment_plan_min_balance_usd') else (K('balance_partial_points') if (hw_balance >= P('past_due_hold_min_usd') and hw_balance < P('payment_plan_min_balance_usd')) else 0)
  - hw_allowed: SUM('pump_billing', 'allowed_amount', event_type='pump_claim_adjudication', pump_ledger_id=hw_post)
  - hw_paid: SUM('pump_billing', 'payer_paid_amount', event_type='pump_claim_adjudication', pump_ledger_id=hw_post)
  - member_pct: ((hw_allowed - hw_paid) * 100 / hw_allowed) if hw_allowed > 0 else 0
  - cost_pts: K('cost_full_points') if member_pct >= K('high_cost_share_pct') else (K('cost_partial_points') if (member_pct > 0 and member_pct < K('high_cost_share_pct')) else 0)
  - burden_add: K('burden_points') if burden_basis == 2 else 0
  - share_pct: MN(100, K('standard_share_pct') + burden_add + effort_pts + aged_pts + history_pts + balance_pts + cost_pts)
  - result: hw_base if burden_basis == 1 else (((hw_base * share_pct / 100) * 100 + 0.5000001) // 1) / 100
