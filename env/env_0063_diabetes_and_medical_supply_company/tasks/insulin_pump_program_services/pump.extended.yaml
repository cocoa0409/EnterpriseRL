  - na_date: XLATEST('insulin', 'insulin_shipments', 'ship_date', date_field='ship_date', item_code='insulin_aspart_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id) or ''
  - na_units: XLATEST('insulin', 'insulin_shipments', 'units', date_field='ship_date', item_code='insulin_aspart_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id) or 0
  - na_days: XLATEST('insulin', 'insulin_shipments', 'supply_days', date_field='ship_date', item_code='insulin_aspart_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id) or 0
  - nl_date: XLATEST('insulin', 'insulin_shipments', 'ship_date', date_field='ship_date', item_code='insulin_lispro_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id) or ''
  - nl_units: XLATEST('insulin', 'insulin_shipments', 'units', date_field='ship_date', item_code='insulin_lispro_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=ins_prog_id) or 0
