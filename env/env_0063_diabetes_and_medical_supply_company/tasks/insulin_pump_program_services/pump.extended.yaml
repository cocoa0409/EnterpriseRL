  - w_days_6m: ((XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', item_code='J1817', event_type='insulin_refill_shipment', insulin_program_id=c_prog_id)) if w_variant == 'Insulin Pharmacy Medicare Part B Pump Insulin Program' else (XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', item_code='insulin_aspart_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=c_prog_id) + XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', item_code='insulin_lispro_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=c_prog_id))) if c_prog_id != '' else 0
  - window_basis: 1 if c_orders_3m > 0 else (2 if (c_orders_3m == 0 and w_days_3m == 0 and w_days_6m > 0) else 3)
  - daily_insulin: ((cnew_ins / cnew_days) if cnew_days > 0 else 0) if window_basis == 1 else (((cins_6m / cdays_6m) if cdays_6m > 0 else 0) if window_basis == 2 else ((cins_3m / cdays_3m) if cdays_3m > 0 else 0))
  - usable_fill: K('fill_mobi') if F('pump_model') == 'tandem_mobi' else (K('fill_ilet') if F('pump_model') == 'beta_bionics_ilet' else K('fill_standard'))
  - insulin_cartridges: MX(-(-(K('block_days') * daily_insulin) // usable_fill), -(-K('block_days') // K('stability_days')))
  - rt_variant: CFIELD('insulin', 'variant_name', status='active', delivery_method='insulin_pump') or ''
  - rate_days_6m: ((XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', item_code='J1817', event_type='insulin_refill_shipment', insulin_program_id=c_prog_id)) if rt_variant == 'Insulin Pharmacy Medicare Part B Pump Insulin Program' else (XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', item_code='insulin_aspart_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=c_prog_id) + XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', item_code='insulin_lispro_vial_10ml', event_type='insulin_refill_shipment', insulin_program_id=c_prog_id))) if c_prog_id != '' else 0
  - rate_basis: 1 if (c_prog_id != '' and rate_days_6m > 0) else (2 if (c_prog_id != '' and rate_days_6m == 0) else 3)
  - cartridge_rate: MN(ordered_rate, insulin_cartridges) if rate_basis == 1 else (P('reservoirs_per_30_days') if rate_basis == 2 else ordered_rate)
