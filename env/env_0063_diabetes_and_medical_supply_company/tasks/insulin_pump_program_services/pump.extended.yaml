    r_variant: 'The set rate follows the customer''s dispensing in three cases: where the customer holds an active pump-delivery insulin pharmacy program and its pump insulin item, J1817 on the Insulin Pharmacy Medicare Part B Pump Insulin Program and rapid-acting 10 mL vials on any other tier, was dispensed under it in the six months before the ship date, the standard set rate is replaced with the set changes the daily pump insulin needs, 30 times the daily pump insulin divided by the cartridge fill for the pump, rounded up to a whole set and never fewer than the standard sets per 30 days; where the customer holds such a program but that item was not dispensed under it in those six months, the standard set rate is replaced with the previous infusion-set refill''s sets times 30 divided by its supply days, rounded up, and stands where there is no previous infusion-set refill; otherwise the standard set rate stands.'
