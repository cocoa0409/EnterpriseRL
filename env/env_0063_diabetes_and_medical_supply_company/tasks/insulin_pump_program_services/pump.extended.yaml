    covered_balance: In the standard computation the covered balance is the whole program balance and the plan months are the tier's payment-plan maximum months, cut where the covered balance divided by them falls below the tier's minimum installment to the whole number of months at which it is met, rounded down and never fewer than one; the monthly installment is the covered balance divided by those months, rounded up to the cent. Each adjustment set out above changes the standard figure it names, replacements before additions and reductions; the plan months are then never more than the tier's payment-plan maximum months and never fewer than one, and where the covered balance divided by them falls below the tier's minimum installment they are cut to the whole number of months at which the minimum installment is met, rounded down and never fewer than one; the monthly installment is the covered balance divided by the plan months, rounded up to the cent, the last installment absorbing the difference.
    term_balance: 'The plan months follow the program balance in three cases: where the program balance is below the short-term ceiling, the tier''s payment-plan maximum months are replaced with the short-term months; where it is at least the short-term ceiling and below the mid-term ceiling, they are replaced with the mid-term months; otherwise the maximum months stand.'
    term_months: 'The plan months follow the program balance in three cases: where the program balance is below the short-term ceiling, the tier''s payment-plan maximum months are replaced with the short-term months; where it is at least the short-term ceiling and below the mid-term ceiling, they are replaced with the mid-term months; otherwise the maximum months stand.'
    cgm_plans: 'The household extension follows the customer''s CGM programs in three cases: where the customer carries an approved payment plan on a CGM program and holds an active CGM program whose balance is at least the tier''s payment-plan minimum balance, the long household extension months are added to the plan months; where the customer carries an approved payment plan on a CGM program and holds an active CGM program whose balance is below that minimum, the short household extension months are added; otherwise, including where the customer holds no active CGM program, nothing is added.'
    cgm_active: 'The household extension follows the customer''s CGM programs in three cases: where the customer carries an approved payment plan on a CGM program and holds an active CGM program whose balance is at least the tier''s payment-plan minimum balance, the long household extension months are added to the plan months; where the customer carries an approved payment plan on a CGM program and holds an active CGM program whose balance is below that minimum, the short household extension months are added; otherwise, including where the customer holds no active CGM program, nothing is added.'
