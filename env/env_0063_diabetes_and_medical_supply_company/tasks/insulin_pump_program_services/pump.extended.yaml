    history_change: 'The plan-history change follows the program''s earlier payment plans in three cases: where a payment plan on the program was withdrawn in the plan-history lookback months before the acceptance date, the withdrawn-plan reduction months are taken off the plan months; where none was withdrawn in that time and a payment plan on the program was completed in that time, the completed-plan extension months are added; otherwise nothing changes. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    aged_postings: 'A posting counts as aged when its posting date is on or before the same day of the month the aged months before the acceptance date, and the aged balance is the aged postings less every payment and balance adjustment on the program, never below zero. The aged-balance reduction follows the aged balance in three cases: where the aged balance is more than a third of the program balance and the program balance is at least the mid-term ceiling, the large aged reduction months are taken off the plan months; where the aged balance is more than a third of the program balance and the program balance is below the mid-term ceiling, the small aged reduction months are taken off; otherwise nothing is taken off.'
