  baseline:
    rule: The sets shipped on an infusion-set refill are worked out from the program's records and the customer's pump insulin records as follows. The standard set refill period is the tier's supply days per shipment divided by 30, giving the set refill's 30-day blocks. The standard set rate is the standard sets per 30 days. The customer's pump insulin is the insulin dispensed under the customer's active insulin pharmacy program whose delivery method is insulin pump, counted in the standard way from its J1817 dispensing, each billing unit holding the pump insulin unit insulin. The daily pump insulin is, in the standard way, the pump insulin dispensed in the three months before the ship date divided by the supply days those dispensings cover, and zero when nothing was dispensed in that time. The cartridge fill for a set refill is the Mobi fill for a Tandem Mobi, the iLet fill for a Beta Bionics iLet and the standard fill for every other model. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date. In the standard computation the set refill ships the standard set rate times the standard set refill period's 30-day blocks and bills one A4224 unit for every seven days of supply, rounded up.
    params:
    - supply_days_per_shipment
    - block_days
    - standard_sets_per_30_days
    - a4224_days_per_unit
  factors:
  - id: fx_set_span
    effect: method
    decides: set_blocks
    bindings:
    - set_grant_end
    - set_grant_days
    - set_pump_age
    - set_blocks
    ladder:
    - when: the pump on the program was delivered fewer than the new-pump start days before the ship date
      method: the standard blocks are replaced with one 30-day block
    - when: the pump was delivered at least the new-pump start days before the ship date and the newest infusion-set authorization grant covers fewer days than the standard set refill period, counted from the ship date through its valid-through date with both days included
      method: the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped
    - when: otherwise
      method: the standard blocks stand
    baseline:
      set_blocks: std_set_blocks
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: fx_set_insulin_source
    effect: parameter
    decides: ins_source
    bindings:
    - ins_variant
    - ins_source
    ladder:
    - when: the active pump-delivery insulin pharmacy program is on any tier other than the Insulin Pharmacy Medicare Part B Pump Insulin Program
      value: the standard counting is replaced with its rapid-acting 10 mL vial dispensing at the vial insulin per vial
    - when: the customer holds no active pump-delivery insulin pharmacy program
      value: no pump insulin is counted
    - when: otherwise
      value: the standard counting from J1817 at the pump insulin unit insulin per billing unit stands
    baseline:
      ins_source: '1'
    evidence:
    - cross_category
    cross_difficulty: insulin
  - id: fx_set_rate_basis
    effect: method
    decides: set_rate_basis
    bindings:
    - r_variant
    - r_days_6m
    - set_rate_basis
    ladder:
    - when: the customer holds an active pump-delivery insulin pharmacy program and its pump insulin item was dispensed under it in the six months before the ship date
      method: the standard set rate is replaced with the set changes the daily pump insulin needs, never fewer than the standard sets per 30 days
    - when: the customer holds such a program but that item was not dispensed under it in those six months
      method: the standard set rate is replaced with the previous infusion-set refill's sets per 30 days, rounded up
    - when: otherwise
      method: the standard set rate stands
    baseline:
      set_rate_basis: '3'
    evidence:
    - cross_category
    - history
    cross_difficulty: insulin
  - id: fx_set_dose_window
    effect: method
    decides: window_basis
    bindings:
    - w_variant
    - w_orders_3m
    - w_days_3m
    - w_days_6m
    - window_basis
    ladder:
    - when: a written order dated in the three months before the ship date is on the active pump-delivery insulin pharmacy program
      method: the standard window is replaced with the newest pump insulin dispensing, its insulin divided by its own supply days
    - when: no such order is on file and the program's pump insulin item was not dispensed in the three months before the ship date but was in the six months before it
      method: the standard window is replaced with those six months
    - when: otherwise
      method: the standard three-month window stands
    baseline:
      window_basis: '3'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: insulin
  - id: fx_set_defect_spares
    effect: parameter
    decides: spare_sets
    bindings:
    - set_defects_12m
    - spare_sets
    ladder:
    - when: two or more product-defect replacements of infusion sets shipped in the defect lookback months before the ship date
      value: K('spares_two_defects')
    - when: exactly one product-defect replacement of infusion sets shipped in that time
      value: K('spares_one_defect')
    - when: otherwise
      value: '0'
    baseline:
      spare_sets: '0'
    evidence:
    - history
    cross_difficulty: null
  inputs:
    history:
    - table: pump_orders
      aggregate: latest
      field: valid_through
      filters:
        event_type: pump_authorization_grant
        item_code: A4224
    - table: pump_shipments
      aggregate: latest
      field: pieces
      filters:
        event_type: pump_refill_shipment
        item_code: A4224
    - table: pump_shipments
      aggregate: count
      field: pump_shipment_id
      within_months: 12
      filters:
        event_type: pump_replacement_shipment
        item_code: A4224
        replacement_reason: product_defect
    - category: insulin
      table: insulin_shipments
      aggregate: sum
      field: units
      within_months: 6
      filters:
        event_type: insulin_refill_shipment
    - category: insulin
      table: insulin_orders
      aggregate: count
      field: insulin_order_id
      within_months: 3
      filters:
        event_type: insulin_order_receipt
    cross_category:
    - insulin
- id: pump_ext_payment_plan_installment
  base_policy_refs:
  - pump_evt_patient_account
  - pump_holds_and_closure
  overwrite: []
  trigger: on_request
  subject:
  - pump_patient_payment
  computes: monthly_amount_usd
  target_tool: accept_payment_plan_163cafb9
  params:
    short_term_ceiling_usd: 150.0
    mid_term_ceiling_usd: 300.0
    short_term_months: 2
    mid_term_months: 4
    household_long_extension_months: 4
    household_short_extension_months: 2
    withdrawn_plan_reduction_months: 2
    completed_plan_extension_months: 1
    plan_history_lookback_months: 24
    aged_months: 4
    aged_large_reduction_months: 2
    aged_small_reduction_months: 1
    insulin_balance_long_extension_months: 2
    insulin_balance_short_extension_months: 1
  rule: 'A payment plan the customer accepts on an insulin pump program sets the plan months and the monthly installment as follows, within the base limits on the tier''s minimum balance, maximum months and minimum installment. The plan''s installments are fixed only after the program carries no non-covered item charge larger than the charge its line''s liability records and the payer''s denial support. The plan''s installments are fixed only after the program''s balance carries the non-covered item charge owed for the line the program''s newest CO-151 denial bills. The program balance is the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments. In the standard computation the covered balance is the whole program balance and the plan months are the tier''s payment-plan maximum months, cut where the covered balance divided by them falls below the tier''s minimum installment to the whole number of months at which it is met, rounded down and never fewer than one; the monthly installment is the covered balance divided by those months, rounded up to the cent. No plan is offered where the program balance is below the tier''s payment-plan minimum balance, and the installment is then nothing. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window. The covered balance follows the program''s open requests in three cases: where a hardship application on the program is in received status, the unpaid amount of the posting the most recently received such application names, that posting''s amount less the adjustments against it, is taken off the whole program balance; where no hardship application is in received status and a payment plan on the program is already approved, what the most recently received approved plan covers, its months times its monthly installment, is taken off; otherwise the whole program balance stands; the covered balance is never below zero. The plan months follow the program balance in three cases: where the program balance is below the short-term ceiling, the tier''s payment-plan maximum months are replaced with the short-term months; where it is at least the short-term ceiling and below the mid-term ceiling, they are replaced with the mid-term months; otherwise the maximum months stand. The household extension follows the customer''s CGM programs in three cases: where the customer carries an approved payment plan on a CGM program and holds an active CGM program whose balance is at least the tier''s payment-plan minimum balance, the long household extension months are added to the plan months; where the customer carries an approved payment plan on a CGM program and holds an active CGM program whose balance is below that minimum, the short household extension months are added; otherwise, including where the customer holds no active CGM program, nothing is added. The insulin-balance extension follows the customer''s active insulin pharmacy program whose delivery method is insulin pump in three cases: where its balance is at least the tier''s payment-plan minimum balance, the long insulin-balance extension months are added to the plan months; where its balance is above zero and below that minimum, the short insulin-balance extension months are added; otherwise nothing is added. The plan-history change follows the program''s earlier payment plans in three cases: where a payment plan on the program was withdrawn in the plan-history lookback months before the acceptance date, the withdrawn-plan reduction months are taken off the plan months; where none was withdrawn in that time and a payment plan on the program was completed in that time, the completed-plan extension months are added; otherwise nothing changes. A posting counts as aged when its posting date is on or before the same day of the month the aged months before the acceptance date, and the aged balance is the aged postings less every payment and balance adjustment on the program, never below zero. The aged-balance reduction follows the aged balance in three cases: where the aged balance is more than a third of the program balance and the program balance is at least the mid-term ceiling, the large aged reduction months are taken off the plan months; where the aged balance is more than a third of the program balance and the program balance is below the mid-term ceiling, the small aged reduction months are taken off; otherwise nothing is taken off. Each adjustment set out above changes the standard figure it names, replacements before additions and reductions; the plan months are then never more than the tier''s payment-plan maximum months and never fewer than one, and where the covered balance divided by them falls below the tier''s minimum installment they are cut to the whole number of months at which the minimum installment is met, rounded down and never fewer than one; the monthly installment is the covered balance divided by the plan months, rounded up to the cent, the last installment absorbing the difference.'
  prerequisite:
  - problem: pump_ext_unsupported_charge_reversal
    kind: value_input
    gate: plan_balance
    form: state
    policy_source: The plan's installments are fixed only after the program carries no non-covered item charge larger than the charge its line's liability records and the payer's denial support.
    condition: Every pump_patient_charge row of charge_type non_covered_item on the program, less the balance adjustments posted against it, is no larger than the charge its line's liability records and payer denial support under the reversal policy.
    resolved_by: reverse_unsupported_liability_charge_60bc70aa
    effect: plan_balance falls by the unsupported part of the overstated non-covered item charge, which changes the covered balance and the installment.
  - problem: pump_ext_non_covered_item_charge
    kind: value_input
    gate: plan_balance
    form: state
    policy_source: The plan's installments are fixed only after the program's balance carries the non-covered item charge owed for the line the program's newest CO-151 denial bills.
    condition: The shipment the program's newest CO-151 pump_claim_denial bills carries a pump_patient_charge of charge_type non_covered_item whenever its liability records make units of it the customer's liability.
    resolved_by: post_non_covered_item_charge_86d5d568
    effect: plan_balance rises by the non-covered item charge owed on that line, which changes the covered balance and the installment.
  cross_category:
  - category: cgm
    as: history
    reads:
    - patient_balance_due
    - status
    - cgm_requests.request_type
    - cgm_requests.request_status
    note: The household extension is decided from the customer's CGM payment plans and the active CGM program's balance.
  - category: insulin
    as: branch
    reads:
    - patient_balance_due
    - status
    - delivery_method
    note: The insulin-balance extension is decided from the balance of the customer's pump-delivery insulin pharmacy program.
  compute:
  - rem_sum: SUM('pump_billing', 'amount', event_type='pump_claim_adjudication')
  - chg_sum: SUM('pump_billing', 'amount', event_type='pump_patient_charge')
  - ref_sum: SUM('pump_billing', 'amount', event_type='pump_patient_refund')
  - pay_sum: SUM('pump_billing', 'amount', event_type='pump_patient_payment')
  - adj_sum: SUM('pump_billing', 'amount', event_type='pump_balance_adjustment')
  - plan_balance: RND(rem_sum + chg_sum + ref_sum - pay_sum - adj_sum, 2)
  - hw_received: COUNT('pump_requests', request_type='hardship_application', request_status='received')
  - hw_posting: LATEST('pump_requests', 'pump_ledger_id', date_field='received_at', request_type='hardship_application', request_status='received') or ''
  - hw_posting_amount: SUM('pump_billing', 'amount', pump_ledger_id=hw_posting)
  - hw_posting_adjusted: SUM('pump_billing', 'amount', event_type='pump_balance_adjustment', original_pump_ledger_id=hw_posting)
  - approved_plans: COUNT('pump_requests', request_type='payment_plan', request_status='approved')
  - approved_plan_cover: (LATEST('pump_requests', 'plan_months', date_field='received_at', request_type='payment_plan', request_status='approved') or 0) * (LATEST('pump_requests', 'monthly_amount_usd', date_field='received_at', request_type='payment_plan', request_status='approved') or 0)
  - left_out: RND(hw_posting_amount - hw_posting_adjusted, 2) if hw_received > 0 else (RND(approved_plan_cover, 2) if (hw_received == 0 and approved_plans > 0) else 0)
  - covered_balance: RND(MX(0, plan_balance - left_out), 2)
  - term_balance: RND(SUM('pump_billing', 'amount', event_type='pump_claim_adjudication') + SUM('pump_billing', 'amount', event_type='pump_patient_charge') + SUM('pump_billing', 'amount', event_type='pump_patient_refund') - SUM('pump_billing', 'amount', event_type='pump_patient_payment') - SUM('pump_billing', 'amount', event_type='pump_balance_adjustment'), 2)
  - term_months: K('short_term_months') if term_balance < K('short_term_ceiling_usd') else (K('mid_term_months') if (term_balance >= K('short_term_ceiling_usd') and term_balance < K('mid_term_ceiling_usd')) else P('payment_plan_max_months'))
  - cgm_plans: XCOUNT('cgm', 'cgm_requests', request_type='payment_plan', request_status='approved')
  - cgm_active: CFIELD('cgm', 'cgm_program_id', status='active') or ''
  - cgm_balance: CFIELD('cgm', 'patient_balance_due', status='active') or 0
  - household_ext: K('household_long_extension_months') if (cgm_plans > 0 and cgm_active != '' and cgm_balance >= P('payment_plan_min_balance_usd')) else (K('household_short_extension_months') if (cgm_plans > 0 and cgm_active != '' and cgm_balance < P('payment_plan_min_balance_usd')) else 0)
  - ins_balance: CFIELD('insulin', 'patient_balance_due', status='active', delivery_method='insulin_pump') or 0
  - insulin_ext: K('insulin_balance_long_extension_months') if ins_balance >= P('payment_plan_min_balance_usd') else (K('insulin_balance_short_extension_months') if (ins_balance > 0 and ins_balance < P('payment_plan_min_balance_usd')) else 0)
  - withdrawn_plans: COUNT('pump_requests', within_months=K('plan_history_lookback_months'), date_field='received_at', request_type='payment_plan', request_status='withdrawn')
  - completed_plans: COUNT('pump_requests', within_months=K('plan_history_lookback_months'), date_field='received_at', request_type='payment_plan', request_status='completed')
  - history_change: -K('withdrawn_plan_reduction_months') if withdrawn_plans > 0 else (K('completed_plan_extension_months') if (withdrawn_plans == 0 and completed_plans > 0) else 0)
  - aged_postings: (rem_sum - SUM('pump_billing', 'amount', within_months=K('aged_months'), date_field='posting_date', event_type='pump_claim_adjudication')) + (chg_sum - SUM('pump_billing', 'amount', within_months=K('aged_months'), date_field='posting_date', event_type='pump_patient_charge')) + (ref_sum - SUM('pump_billing', 'amount', within_months=K('aged_months'), date_field='posting_date', event_type='pump_patient_refund'))
  - aged_balance: RND(MX(0, aged_postings - pay_sum - adj_sum), 2)
  - aged_reduction: K('aged_large_reduction_months') if (aged_balance * 3 > plan_balance and plan_balance >= K('mid_term_ceiling_usd')) else (K('aged_small_reduction_months') if (aged_balance * 3 > plan_balance and plan_balance < K('mid_term_ceiling_usd')) else 0)
  - months_set: MN(P('payment_plan_max_months'), MX(1, term_months + household_ext + insulin_ext + history_change - aged_reduction))
  - plan_months: MX(1, MN(months_set, int(covered_balance // P('payment_plan_min_monthly_usd'))))
  - result: (-(-RND(covered_balance * 100, 0) // plan_months) / 100) if plan_balance >= P('payment_plan_min_balance_usd') else 0
  compute_basis:
    rem_sum: The program balance is the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments.
    chg_sum: The program balance is the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments.
    ref_sum: The program balance is the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments.
    pay_sum: The program balance is the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments.
    adj_sum: The program balance is the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments.
    plan_balance: The program balance is the remittance patient responsibility, patient charges and refunds posted on the program less its payments and balance adjustments.
    hw_received: 'The covered balance follows the program''s open requests in three cases: where a hardship application on the program is in received status, the unpaid amount of the posting the most recently received such application names, that posting''s amount less the adjustments against it, is taken off the whole program balance; where no hardship application is in received status and a payment plan on the program is already approved, what the most recently received approved plan covers, its months times its monthly installment, is taken off; otherwise the whole program balance stands; the covered balance is never below zero.'
