  baseline:
    rule: 'A billing correction reviews the remittance posting the program''s approved hardship application names and reverses the part of its patient responsibility that the remittance does not support, as follows. The reviewed line is the shipment the remittance''s claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on. The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units are its covered units per 30 days times its supply days divided by 30, never more than its units, and its denied units are the rest of its units. The standard value of a denied unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The member responsibility is the remittance''s allowed amount less the payer''s payment, or the posted amount where the remittance itemizes no allowed amount, never below zero. In the standard computation the supported responsibility is the member responsibility, and the correction is the remittance posting''s amount less the billing corrections already posted against it, less that supported responsibility, never below zero, rounded half up to the cent.'
    params:
    - block_days
    - cash_price_a4224
    - cash_price_a4225
    - cash_price_a4232
    - cash_price_a4239
    - cash_price_pump_beta_bionics_ilet
    - cash_price_pump_minimed_780g
    - cash_price_pump_tandem_mobi
    - cash_price_pump_tandem_tslim_x2
    - reservoirs_per_30_days
  factors:
  - id: fx_rc_covered_rate
    effect: parameter
    decides: rc_cover
    bindings:
    - rc_basis
    - rc_gunits
    - rc_from
    - rc_through
    - rc_order_rate
    - rc_olj
    - rc_cover
    ladder:
    - when: the grant the reviewed line drew on is a payer prior authorization
      value: its units authorized times 30 divided by the days its span covers, both ends included, rounded down
    - when: that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file
      value: that written order's quantity per 30 days
    - when: otherwise
      value: P('reservoirs_per_30_days')
    baseline:
      rc_cover: P('reservoirs_per_30_days')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: fx_rc_unit_value
    effect: parameter
    decides: rc_unit_value
    bindings:
    - rc_billed
    - rc_unit_value
    ladder:
    - when: the remittance itemizes an allowed amount
      value: that allowed amount divided by the line's units
    - when: it itemizes no allowed amount but the claim shows a billed amount
      value: that billed amount divided by the line's units
    - when: otherwise
      value: the Larkfield cash price of the line's item
    baseline:
      rc_unit_value: rc_cash
    evidence:
    - history
    cross_difficulty: null
  - id: fx_rc_contractual
    effect: method
    decides: rc_co_basis
    bindings:
    - rc_co151
    - rc_co29
    - rc_co_basis
    ladder:
    - when: a CO-151 denial answers the remittance's claim
      method: the denied units, as the payer denied them, times the value of a denied unit are taken off the member responsibility
    - when: a CO-29 denial answers it
      method: the whole member responsibility is taken off
    - when: otherwise
      method: nothing is taken off
    baseline:
      rc_co_basis: '3'
    evidence:
    - history
    cross_difficulty: null
  - id: fx_rc_returns
    effect: parameter
    decides: rc_returned
    bindings:
    - rc_rt_cc_n
    - rc_rt_cc_billed
    - rc_rt_orig_billed
    - rc_rt_cc_off
    - rc_rt_received
    - rc_returned
    ladder:
    - when: a corrected claim for the line has been transmitted
      value: the units the corrected claim no longer bills, scaling the member responsibility to the covered units still kept
    - when: no corrected claim is on file but the warehouse has received unopened units of the line back
      value: those received units, scaling the member responsibility the same way
    - when: otherwise
      value: '0'
    baseline:
      rc_returned: '0'
    evidence:
    - history
    cross_difficulty: null
  inputs:
    history:
    - table: pump_requests
      aggregate: latest
      field: pump_ledger_id
      filters:
        request_type: hardship_application
        request_status: approved
    - table: pump_billing
      aggregate: sum
      field: allowed_amount
      filters:
        event_type: pump_claim_adjudication
    - table: pump_billing
      aggregate: count
      field: pump_ledger_id
      filters:
        event_type: pump_claim_denial
        denial_code: CO-151
    - table: pump_shipments
      aggregate: sum
      field: units
      filters:
        event_type: pump_return_receipt
    cross_category: []
