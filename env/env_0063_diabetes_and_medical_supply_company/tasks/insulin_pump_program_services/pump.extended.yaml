  - pump_evt_claims
  - pump_evt_denials_and_appeals
  - pump_evt_returns
  overwrite:
  - base_policy: pump_evt_claims
    superseded_clause: When a remittance posts, the patient responsibility added to the customer's balance is the allowed amount less the amount the payer paid, which the remittance itemizes as deductible, coinsurance and copay
    replaced_by: For a remittance posting this policy reviews, and only for that posting, the patient responsibility it may carry is the supported responsibility worked out below, which leaves out the allowed value of units a contractual denial assigns to Larkfield and the share of covered units returned unopened; every other remittance of the program keeps the base patient-responsibility rule.
  - base_policy: pump_evt_patient_account
    superseded_clause: never for more than that posting's unpaid remainder
    replaced_by: For a billing correction this policy posts against a remittance posting, and only for such a correction, the correction reverses the whole unsupported responsibility even where payments were already applied to that posting, and the payments it frees are applied to the program's next oldest unpaid posting or refunded under the credit-balance rule; a hardship waiver or a correction of a non-covered item charge follows its own policy's limit, and every other adjustment keeps the base unpaid-remainder limit.
  trigger: state_due
  subject:
  - pump_balance_adjustment
  computes: amount
  target_tool: correct_remittance_posting_ab84bf6f
  params:
    block_days: 30
    cash_price_a4225: 6.85
    cash_price_a4232: 7.1
    cash_price_a4224: 38.4
    cash_price_a4239: 395.0
    cash_price_pump_tandem_tslim_x2: 6295.0
    cash_price_pump_tandem_mobi: 4995.0
    cash_price_pump_minimed_780g: 7350.0
    cash_price_pump_beta_bionics_ilet: 5250.0
  rule: 'For a remittance posting this policy reviews, and only for that posting, the patient responsibility it may carry is the supported responsibility worked out below, which leaves out the allowed value of units a contractual denial assigns to Larkfield and the share of covered units returned unopened; every other remittance of the program keeps the base patient-responsibility rule. For a billing correction this policy posts against a remittance posting, and only for such a correction, the correction reverses the whole unsupported responsibility even where payments were already applied to that posting, and the payments it frees are applied to the program''s next oldest unpaid posting or refunded under the credit-balance rule; a hardship waiver or a correction of a non-covered item charge follows its own policy''s limit, and every other adjustment keeps the base unpaid-remainder limit. A billing correction reviews the remittance posting the program''s approved hardship application names and reverses the part of its patient responsibility that the remittance does not support, as follows. The reviewed line is the shipment the remittance''s claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on. The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units are its covered units per 30 days times its supply days divided by 30, never more than its units, and its denied units are the rest of its units. The standard value of a denied unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The member responsibility is the remittance''s allowed amount less the payer''s payment, or the posted amount where the remittance itemizes no allowed amount, never below zero. In the standard computation the supported responsibility is the member responsibility, and the correction is the remittance posting''s amount less the billing corrections already posted against it, less that supported responsibility, never below zero, rounded half up to the cent. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. The value of a denied unit follows the remittance in three cases: where the remittance itemizes an allowed amount, the standard value is replaced with that allowed amount divided by the line''s units; where it itemizes no allowed amount but the claim shows a billed amount, it is replaced with that billed amount divided by the line''s units; otherwise the standard value stands. What comes off for contractual denials follows the denials answering the remittance''s claim in three cases: where a CO-151 denial answers it, the denied units, as the payer denied them, times the value of a denied unit are taken off the member responsibility; where a CO-29 denial answers it, the claim''s filing limit having passed, the whole member responsibility is taken off; otherwise nothing is taken off. Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the returned units are the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit; where no corrected claim is on file but the warehouse has received unopened units of the line back, the returned units are those received units; otherwise no units are returned. Returned units come off the line''s denied units first and then off its covered units, and they scale the member responsibility to the covered units still kept: it is multiplied by those kept covered units and divided by the covered units, and it is nothing when the line has no covered units. Each adjustment set out above changes the standard figure it names, replacements first, then the amounts taken off the member responsibility, never below zero, then any scaling of it; the supported responsibility is the member responsibility so changed, rounded half up to the cent, and the correction is the remittance posting''s amount less the billing corrections already posted against it, less the supported responsibility, never below zero, rounded half up to the cent.'
