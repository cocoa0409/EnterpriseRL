    fill_standard: 300
  rule: 'For a cartridge liability notice this policy fixes, and only for such a notice, the customer signs it personally on the call, through the signing step the representative hands over to them; every other liability notice keeps the base signing rule. A liability notice for the cartridges a coming refill ships above the payer''s allowance is signed in the tier''s notice type against the newest authorization grant for the cartridge item, the grant that refill draws on, for the notice units worked out as follows. The notice item is the A4232 reservoir for a MiniMed 780G and the A4225 cartridge for every other model. The standard notice period is the tier''s supply days per shipment divided by 30, giving the notice''s 30-day blocks. The standard allowance is the tier''s reservoirs per 30 days. The standard expected rate is the quantity per 30 days on the written order the newest authorization grant for the item rests on. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window. In the standard computation the notice units are the standard expected rate less the standard allowance, never below zero, times the standard notice period''s 30-day blocks. The notice''s 30-day blocks follow the item''s authorization and order in three cases: where the newest authorization grant for the item ends fewer days after today than the standard notice period, counting from today through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days; where the grant runs that long but the newest written order for the item ends within the standard notice period, counted the same way, they are replaced with the whole 30-day blocks to the order''s valid-through date; otherwise the standard blocks stand. The allowance follows the newest authorization grant for the item in three cases: where it is a payer prior authorization, the standard allowance is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where it rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with the quantity per 30 days on the written order it rests on; otherwise the standard allowance stands. The expected rate follows the item''s written orders in three cases: where a written order for the item is dated in the three months before today, the standard expected rate is replaced with the newest written order''s quantity per 30 days; where the newest written order is older than that and the program has a previous refill of the item, it is replaced with the lesser of that order''s quantity and the previous refill''s units times 30 divided by its supply days, rounded up; otherwise the standard expected rate stands. The pump-insulin cap follows the customer''s active insulin pharmacy program whose delivery method is insulin pump in three cases: where a written order for its pump insulin dated in the three months before today is on that program, the expected rate is held to no more than the cartridges per 30 days the prescribed dose fills, the newest such order''s billing units per 30 days times the insulin each unit holds, divided by the pump''s fill per cartridge, rounded up; where no such order is on it but pump insulin was dispensed under it in the six months before today, it is held to no more than the cartridges per 30 days those dispensings fill, their insulin times 30 divided by the supply days they cover and by the pump''s fill per cartridge, rounded up; otherwise the expected rate is not held. Pump insulin on that program is its J1817 orders and dispensing at the pump insulin unit insulin per billing unit on the Insulin Pharmacy Medicare Part B Pump Insulin Program, and its rapid-acting 10 mL vial orders and dispensing at the vial insulin per vial on any other tier; the pump''s fill per cartridge is the Mobi fill for a Tandem Mobi, the iLet fill for a Beta Bionics iLet and the standard fill for every other model; and an order or dispensing counts as in the three or six months before today when its date is later than the same day of the month three or six months before today. Each adjustment set out above changes the standard figure it names, replacements before limits; the notice units are then the expected rate less the allowance, never below zero, times the notice''s 30-day blocks.'
  prerequisite: []
  cross_category:
  - category: insulin
    as: history
    reads:
    - insulin_program_id
    - variant_name
    - status
    - delivery_method
    - insulin_orders.item_code
    - insulin_orders.order_date
    - insulin_orders.quantity_per_30_days
    - insulin_shipments.item_code
    - insulin_shipments.units
    - insulin_shipments.supply_days
    - insulin_shipments.ship_date
    note: The pump-insulin cap on the expected rate is decided from the customer's pump-delivery insulin pharmacy program, its prescribed dose and its dispensing.
  compute:
  - n_item: '''A4232'' if F(''pump_model'') == ''minimed_780g'' else ''A4225'''
  - std_blocks: P('supply_days_per_shipment') // K('block_days')
  - ng_end: LATEST('pump_orders', 'valid_through', date_field='valid_from', event_type='pump_authorization_grant', item_code=n_item) or NOW
  - no_end: LATEST('pump_orders', 'valid_through', date_field='order_date', event_type='pump_order_receipt', item_code=n_item) or NOW
  - ng_days: DAYS(NOW, ng_end) + 1
  - no_days: DAYS(NOW, no_end) + 1
  - notice_blocks: (ng_days // K('block_days')) if ng_days < std_blocks * K('block_days') else ((no_days // K('block_days')) if no_days < std_blocks * K('block_days') else std_blocks)
  - ng_order: LATEST('pump_orders', 'related_pump_order_id', date_field='valid_from', event_type='pump_authorization_grant', item_code=n_item) or ''
  - ng_order_qty: LATEST('pump_orders', 'quantity_per_30_days', date_field='order_date', pump_order_id=ng_order) or 0
  - ng_basis: LATEST('pump_orders', 'authorization_basis', date_field='valid_from', event_type='pump_authorization_grant', item_code=n_item) or ''
  - ng_units: LATEST('pump_orders', 'units_authorized', date_field='valid_from', event_type='pump_authorization_grant', item_code=n_item) or 0
  - ng_from: LATEST('pump_orders', 'valid_from', date_field='valid_from', event_type='pump_authorization_grant', item_code=n_item) or NOW
  - n_olj: COUNT('pump_orders', within_months=12, date_field='visit_date', event_type='pump_medical_record_receipt', record_purpose='over_limit_justification')
  - allowance: ((ng_units * K('block_days')) // (DAYS(ng_from, ng_end) + 1)) if ng_basis == 'payer_prior_authorization' else (ng_order_qty if (ng_basis != 'payer_prior_authorization' and n_olj > 0) else P('reservoirs_per_30_days'))
  - n_recent: COUNT('pump_orders', within_months=3, date_field='order_date', event_type='pump_order_receipt', item_code=n_item)
  - n_newest_qty: LATEST('pump_orders', 'quantity_per_30_days', date_field='order_date', event_type='pump_order_receipt', item_code=n_item) or 0
  - n_prev_units: LATEST('pump_shipments', 'units', date_field='ship_date', event_type='pump_refill_shipment', item_code=n_item) or 0
  - n_prev_days: LATEST('pump_shipments', 'supply_days', date_field='ship_date', event_type='pump_refill_shipment', item_code=n_item) or 0
  - expected_rate: n_newest_qty if n_recent > 0 else (MN(n_newest_qty, -(-(n_prev_units * K('block_days')) // n_prev_days)) if (n_recent == 0 and n_prev_days > 0) else ng_order_qty)
  - ni_prog: CFIELD('insulin', 'insulin_program_id', status='active', delivery_method='insulin_pump') or ''
  - ni_variant: CFIELD('insulin', 'variant_name', status='active', delivery_method='insulin_pump') or ''
  - n_fill: K('fill_mobi') if F('pump_model') == 'tandem_mobi' else (K('fill_ilet') if F('pump_model') == 'beta_bionics_ilet' else K('fill_standard'))
  - oq_j: XLATEST('insulin', 'insulin_orders', 'quantity_per_30_days', date_field='order_date', event_type='insulin_order_receipt', item_code='J1817', insulin_program_id=ni_prog) or 0
  - od_a: XLATEST('insulin', 'insulin_orders', 'order_date', date_field='order_date', event_type='insulin_order_receipt', item_code='insulin_aspart_vial_10ml', insulin_program_id=ni_prog) or ''
  - oq_a: XLATEST('insulin', 'insulin_orders', 'quantity_per_30_days', date_field='order_date', event_type='insulin_order_receipt', item_code='insulin_aspart_vial_10ml', insulin_program_id=ni_prog) or 0
  - od_l: XLATEST('insulin', 'insulin_orders', 'order_date', date_field='order_date', event_type='insulin_order_receipt', item_code='insulin_lispro_vial_10ml', insulin_program_id=ni_prog) or ''
  - oq_l: XLATEST('insulin', 'insulin_orders', 'quantity_per_30_days', date_field='order_date', event_type='insulin_order_receipt', item_code='insulin_lispro_vial_10ml', insulin_program_id=ni_prog) or 0
  - dose_ins: oq_j * K('pump_insulin_unit_insulin') if ni_variant == 'Insulin Pharmacy Medicare Part B Pump Insulin Program' else ((oq_a if od_a >= od_l else oq_l) * K('vial_insulin'))
  - nj_u6: XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=ni_prog)
  - nj_d6: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=ni_prog)
  - nv_u6: XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=ni_prog) + XSUM('insulin', 'insulin_shipments', 'units', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=ni_prog)
  - nv_d6: XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=ni_prog) + XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=ni_prog)
  - n_ins_6m: nj_u6 * K('pump_insulin_unit_insulin') if ni_variant == 'Insulin Pharmacy Medicare Part B Pump Insulin Program' else nv_u6 * K('vial_insulin')
  - n_days_6m: nj_d6 if ni_variant == 'Insulin Pharmacy Medicare Part B Pump Insulin Program' else nv_d6
  - cap_dose: -(-dose_ins // n_fill)
  - cap_6m: (-(-(K('block_days') * n_ins_6m / n_days_6m) // n_fill)) if n_days_6m > 0 else 0
  - cap_variant: CFIELD('insulin', 'variant_name', status='active', delivery_method='insulin_pump') or ''
  - cap_orders_3m: (XCOUNT('insulin', 'insulin_orders', within_months=3, date_field='order_date', event_type='insulin_order_receipt', item_code='J1817', insulin_program_id=ni_prog) if cap_variant == 'Insulin Pharmacy Medicare Part B Pump Insulin Program' else (XCOUNT('insulin', 'insulin_orders', within_months=3, date_field='order_date', event_type='insulin_order_receipt', item_code='insulin_aspart_vial_10ml', insulin_program_id=ni_prog) + XCOUNT('insulin', 'insulin_orders', within_months=3, date_field='order_date', event_type='insulin_order_receipt', item_code='insulin_lispro_vial_10ml', insulin_program_id=ni_prog))) if ni_prog != '' else 0
  - cap_days_6m: (XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='J1817', insulin_program_id=ni_prog) if cap_variant == 'Insulin Pharmacy Medicare Part B Pump Insulin Program' else (XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_aspart_vial_10ml', insulin_program_id=ni_prog) + XSUM('insulin', 'insulin_shipments', 'supply_days', within_months=6, date_field='ship_date', event_type='insulin_refill_shipment', item_code='insulin_lispro_vial_10ml', insulin_program_id=ni_prog))) if ni_prog != '' else 0
  - cap_basis: 1 if cap_orders_3m > 0 else (2 if (cap_orders_3m == 0 and cap_days_6m > 0) else 3)
  - capped_rate: MN(expected_rate, cap_dose) if cap_basis == 1 else (MN(expected_rate, cap_6m) if cap_basis == 2 else expected_rate)
  - result: MX(0, capped_rate - allowance) * notice_blocks
