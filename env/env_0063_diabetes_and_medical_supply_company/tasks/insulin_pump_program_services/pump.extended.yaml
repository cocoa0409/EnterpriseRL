  - rc_item: LATEST('pump_shipments', 'item_code', date_field='ship_date', pump_shipment_id=rc_ship) or ''
  - rc_units: LATEST('pump_shipments', 'units', date_field='ship_date', pump_shipment_id=rc_ship) or 0
  - rc_days: LATEST('pump_shipments', 'supply_days', date_field='ship_date', pump_shipment_id=rc_ship) or 0
  - rc_grant: LATEST('pump_shipments', 'pump_order_id', date_field='ship_date', pump_shipment_id=rc_ship) or ''
  - rc_order: LATEST('pump_orders', 'related_pump_order_id', date_field='valid_from', pump_order_id=rc_grant) or ''
  - rc_basis: LATEST('pump_orders', 'authorization_basis', date_field='valid_from', pump_order_id=rc_grant) or ''
  - rc_gunits: LATEST('pump_orders', 'units_authorized', date_field='valid_from', pump_order_id=rc_grant) or 0
  - rc_from: LATEST('pump_orders', 'valid_from', date_field='valid_from', pump_order_id=rc_grant) or NOW
  - rc_through: LATEST('pump_orders', 'valid_through', date_field='valid_from', pump_order_id=rc_grant) or NOW
  - rc_order_rate: LATEST('pump_orders', 'quantity_per_30_days', date_field='order_date', pump_order_id=rc_order) or 0
  - rc_olj: COUNT('pump_orders', within_months=12, date_field='visit_date', event_type='pump_medical_record_receipt', record_purpose='over_limit_justification')
  - rc_cover: ((rc_gunits * K('block_days')) // (DAYS(rc_from, rc_through) + 1)) if rc_basis == 'payer_prior_authorization' else (rc_order_rate if (rc_basis != 'payer_prior_authorization' and rc_olj > 0) else P('reservoirs_per_30_days'))
  - rc_covered: MN(rc_units, rc_cover * rc_days // K('block_days'))
  - rc_denied: MX(0, rc_units - rc_covered)
  - rc_cash: K('cash_price_a4225') if rc_item == 'A4225' else (K('cash_price_a4232') if rc_item == 'A4232' else (K('cash_price_a4224') if rc_item == 'A4224' else (K('cash_price_a4239') if rc_item == 'A4239' else ((K('cash_price_pump_tandem_mobi') if F('pump_model') == 'tandem_mobi' else (K('cash_price_pump_tandem_tslim_x2') if F('pump_model') == 'tandem_tslim_x2' else (K('cash_price_pump_minimed_780g') if F('pump_model') == 'minimed_780g' else (K('cash_price_pump_beta_bionics_ilet') if F('pump_model') == 'beta_bionics_ilet' else 0)))) if rc_item == 'E0784' else 0))))
  - rc_unit_value: (rc_allowed / rc_units) if (rc_allowed > 0 and rc_units > 0) else ((rc_billed / rc_units) if (rc_allowed == 0 and rc_billed > 0 and rc_units > 0) else rc_cash)
  - rc_co151: COUNT('pump_billing', event_type='pump_claim_denial', denial_code='CO-151', original_pump_ledger_id=rc_claim)
  - rc_co29: COUNT('pump_billing', event_type='pump_claim_denial', denial_code='CO-29', original_pump_ledger_id=rc_claim)
  - rc_co_basis: 1 if rc_co151 > 0 else (2 if (rc_co151 == 0 and rc_co29 > 0) else 3)
  - rc_off: (rc_denied * rc_unit_value) if rc_co_basis == 1 else ((((rc_allowed - rc_paid) if rc_allowed > 0 else rc_amount)) if rc_co_basis == 2 else 0)
  - rc_member: MX(0, ((rc_allowed - rc_paid) if rc_allowed > 0 else rc_amount) - rc_off)
  - rc_rt_cc_n: COUNT('pump_billing', event_type='pump_claim_submission', submission_type='corrected', pump_shipment_id=rc_ship)
  - rc_rt_cc_billed: LATEST('pump_billing', 'billed_amount', date_field='posting_date', event_type='pump_claim_submission', submission_type='corrected', pump_shipment_id=rc_ship) or 0
  - rc_rt_orig_billed: SUM('pump_billing', 'billed_amount', event_type='pump_claim_submission', submission_type='original', pump_shipment_id=rc_ship)
  - rc_rt_cc_off: RND((rc_rt_orig_billed - rc_rt_cc_billed) * rc_units / rc_rt_orig_billed, 0) if (rc_rt_cc_n > 0 and rc_rt_orig_billed > 0) else 0
  - rc_rt_received: SUM('pump_shipments', 'units', event_type='pump_return_receipt', original_pump_shipment_id=rc_ship)
  - rc_returned: rc_rt_cc_off if rc_rt_cc_n > 0 else (rc_rt_received if rc_rt_received > 0 else 0)
  - rc_kept: MX(0, rc_covered - MX(0, rc_returned - rc_denied))
  - rc_supported: (((rc_member * rc_kept / rc_covered) * 100 + 0.5000001) // 1) / 100 if rc_covered > 0 else 0
  - result: (((MX(0, rc_amount - rc_prior - rc_supported)) * 100 + 0.5000001) // 1) / 100
  compute_basis:
    rc_post: A billing correction reviews the remittance posting the program's approved hardship application names and reverses the part of its patient responsibility that the remittance does not support, as follows.
    rc_amount: In the standard computation the supported responsibility is the member responsibility, and the correction is the remittance posting's amount less the billing corrections already posted against it, less that supported responsibility, never below zero, rounded half up to the cent.
    rc_prior: In the standard computation the supported responsibility is the member responsibility, and the correction is the remittance posting's amount less the billing corrections already posted against it, less that supported responsibility, never below zero, rounded half up to the cent.
    rc_allowed: The member responsibility is the remittance's allowed amount less the payer's payment, or the posted amount where the remittance itemizes no allowed amount, never below zero.
    rc_paid: The member responsibility is the remittance's allowed amount less the payer's payment, or the posted amount where the remittance itemizes no allowed amount, never below zero.
    rc_claim: The reviewed line is the shipment the remittance's claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on.
    rc_billed: 'The standard value of a denied unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The value of a denied unit follows the remittance in three cases: where the remittance itemizes an allowed amount, the standard value is replaced with that allowed amount divided by the line''s units; where it itemizes no allowed amount but the claim shows a billed amount, it is replaced with that billed amount divided by the line''s units; otherwise the standard value stands.'
    rc_ship: The reviewed line is the shipment the remittance's claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on.
    rc_item: The reviewed line is the shipment the remittance's claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on.
    rc_units: The reviewed line is the shipment the remittance's claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on.
    rc_days: The reviewed line is the shipment the remittance's claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on.
    rc_grant: The reviewed line is the shipment the remittance's claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on.
    rc_order: The reviewed line is the shipment the remittance's claim bills; its item, units and supply days are read from that shipment, and its grant is the authorization grant it drew on.
    rc_basis: 'The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rc_gunits: 'The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rc_from: 'The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rc_through: 'The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rc_order_rate: 'The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rc_olj: 'The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rc_cover: 'The standard covered rate of the reviewed line is the tier''s reservoirs per 30 days. The line''s covered units per 30 days follow the grant it drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with that written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rc_covered: The line's covered units are its covered units per 30 days times its supply days divided by 30, never more than its units, and its denied units are the rest of its units.
    rc_denied: The line's covered units are its covered units per 30 days times its supply days divided by 30, never more than its units, and its denied units are the rest of its units.
    rc_cash: 'The standard value of a denied unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump.'
    rc_unit_value: 'The standard value of a denied unit is the Larkfield cash price of the line''s item: the A4225 cash price for an A4225 cartridge, the A4232 cash price for an A4232 reservoir, the A4224 cash price for an A4224 infusion-set supply, the A4239 cash price for an A4239 sensor allowance and the pump cash price for the program''s pump model for an E0784 pump. The value of a denied unit follows the remittance in three cases: where the remittance itemizes an allowed amount, the standard value is replaced with that allowed amount divided by the line''s units; where it itemizes no allowed amount but the claim shows a billed amount, it is replaced with that billed amount divided by the line''s units; otherwise the standard value stands.'
    rc_co151: 'What comes off for contractual denials follows the denials answering the remittance''s claim in three cases: where a CO-151 denial answers it, the denied units, as the payer denied them, times the value of a denied unit are taken off the member responsibility; where a CO-29 denial answers it, the claim''s filing limit having passed, the whole member responsibility is taken off; otherwise nothing is taken off.'
    rc_co29: 'What comes off for contractual denials follows the denials answering the remittance''s claim in three cases: where a CO-151 denial answers it, the denied units, as the payer denied them, times the value of a denied unit are taken off the member responsibility; where a CO-29 denial answers it, the claim''s filing limit having passed, the whole member responsibility is taken off; otherwise nothing is taken off.'
    rc_co_basis: 'What comes off for contractual denials follows the denials answering the remittance''s claim in three cases: where a CO-151 denial answers it, the denied units, as the payer denied them, times the value of a denied unit are taken off the member responsibility; where a CO-29 denial answers it, the claim''s filing limit having passed, the whole member responsibility is taken off; otherwise nothing is taken off.'
    rc_off: Each adjustment set out above changes the standard figure it names, replacements first, then the amounts taken off the member responsibility, never below zero, then any scaling of it; the supported responsibility is the member responsibility so changed, rounded half up to the cent, and the correction is the remittance posting's amount less the billing corrections already posted against it, less the supported responsibility, never below zero, rounded half up to the cent.
    rc_member: The member responsibility is the remittance's allowed amount less the payer's payment, or the posted amount where the remittance itemizes no allowed amount, never below zero. Each adjustment set out above changes the standard figure it names, replacements first, then the amounts taken off the member responsibility, never below zero, then any scaling of it; the supported responsibility is the member responsibility so changed, rounded half up to the cent, and the correction is the remittance posting's amount less the billing corrections already posted against it, less the supported responsibility, never below zero, rounded half up to the cent.
    rc_rt_cc_n: 'Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the returned units are the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit; where no corrected claim is on file but the warehouse has received unopened units of the line back, the returned units are those received units; otherwise no units are returned. Returned units come off the line''s denied units first and then off its covered units, and they scale the member responsibility to the covered units still kept: it is multiplied by those kept covered units and divided by the covered units, and it is nothing when the line has no covered units.'
    rc_rt_cc_billed: 'Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the returned units are the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit; where no corrected claim is on file but the warehouse has received unopened units of the line back, the returned units are those received units; otherwise no units are returned. Returned units come off the line''s denied units first and then off its covered units, and they scale the member responsibility to the covered units still kept: it is multiplied by those kept covered units and divided by the covered units, and it is nothing when the line has no covered units.'
    rc_rt_orig_billed: 'Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the returned units are the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit; where no corrected claim is on file but the warehouse has received unopened units of the line back, the returned units are those received units; otherwise no units are returned. Returned units come off the line''s denied units first and then off its covered units, and they scale the member responsibility to the covered units still kept: it is multiplied by those kept covered units and divided by the covered units, and it is nothing when the line has no covered units.'
    rc_rt_cc_off: 'Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the returned units are the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit; where no corrected claim is on file but the warehouse has received unopened units of the line back, the returned units are those received units; otherwise no units are returned. Returned units come off the line''s denied units first and then off its covered units, and they scale the member responsibility to the covered units still kept: it is multiplied by those kept covered units and divided by the covered units, and it is nothing when the line has no covered units.'
    rc_rt_received: 'Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the returned units are the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit; where no corrected claim is on file but the warehouse has received unopened units of the line back, the returned units are those received units; otherwise no units are returned. Returned units come off the line''s denied units first and then off its covered units, and they scale the member responsibility to the covered units still kept: it is multiplied by those kept covered units and divided by the covered units, and it is nothing when the line has no covered units.'
    rc_returned: 'Returned units on the reviewed line follow its return records in three cases: where a corrected claim for the line has been transmitted, the returned units are the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit; where no corrected claim is on file but the warehouse has received unopened units of the line back, the returned units are those received units; otherwise no units are returned. Returned units come off the line''s denied units first and then off its covered units, and they scale the member responsibility to the covered units still kept: it is multiplied by those kept covered units and divided by the covered units, and it is nothing when the line has no covered units.'
