    nc_order_rate: 'The standard covered rate for a denied line is the tier''s reservoirs per 30 days. The covered rate for a denied line follows the grant the line drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with the written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    nc_olj: 'The standard covered rate for a denied line is the tier''s reservoirs per 30 days. The covered rate for a denied line follows the grant the line drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with the written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    nc_cover: 'The standard covered rate for a denied line is the tier''s reservoirs per 30 days. The covered rate for a denied line follows the grant the line drew on in three cases: where that grant is a payer prior authorization, the standard covered rate is replaced with its units authorized times 30 divided by the days its span covers with both ends included, rounded down; where that grant rests on the written order itself and an over-limit justification record dated in the 12 months before today is on file, it is replaced with the written order''s quantity per 30 days; otherwise the standard covered rate stands. A record counts as in a number of months before today when its date is later than the same day of the month that many months before today, so a record dated exactly that many months before today is outside the window.'
    rt_cc_n: 'Returned units follow the line''s return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the charge; otherwise nothing is taken off.'
    rt_cc_billed: 'Returned units follow the line''s return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the charge; otherwise nothing is taken off.'
    rt_orig_billed: 'Returned units follow the line''s return records in three cases: where a corrected claim for the line has been transmitted, the cash price of the units it no longer bills, the original claim''s billed amount less the corrected claim''s, times the line''s units, divided by the original claim''s billed amount, rounded to a whole unit, is taken off the charge; where no corrected claim is on file but the warehouse has received unopened units of the line back, the cash price of those received units is taken off the charge; otherwise nothing is taken off.'
