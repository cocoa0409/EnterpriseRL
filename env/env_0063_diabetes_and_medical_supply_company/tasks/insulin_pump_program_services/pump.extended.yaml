    - refill_blocks
    ladder:
    - when: the pump on the program was delivered fewer than the new-pump start days before the ship date
      method: the standard blocks are replaced with one 30-day block
    - when: the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for the cartridge item covers fewer days than the standard refill period, counted from the ship date through its valid-through date with both days included
      method: the standard blocks are replaced with the whole 30-day blocks within those days
    - when: otherwise
