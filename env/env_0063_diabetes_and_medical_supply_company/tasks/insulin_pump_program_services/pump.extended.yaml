      method: the standard window is replaced with the newest pump insulin dispensing, its insulin divided by its own supply days
    - when: no such order is on file and the program's pump insulin item was not dispensed in the three months before the ship date but was in the six months before it
      method: the standard window is replaced with those six months
    - when: otherwise
