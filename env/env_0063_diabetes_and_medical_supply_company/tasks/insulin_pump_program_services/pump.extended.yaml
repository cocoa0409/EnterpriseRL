  compute_basis:
    std_set_blocks: The standard set refill period is the tier's supply days per shipment divided by 30, giving the set refill's 30-day blocks.
    set_grant_end: 'The set refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for infusion sets covers fewer days than the standard set refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
    set_grant_days: 'The set refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for infusion sets covers fewer days than the standard set refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
    set_pump_age: 'The set refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for infusion sets covers fewer days than the standard set refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
    set_blocks: 'The standard set refill period is the tier''s supply days per shipment divided by 30, giving the set refill''s 30-day blocks. The set refill''s 30-day blocks follow the program''s records in three cases: where the pump on the program was delivered fewer than the new-pump start days before the ship date, the standard blocks are replaced with one 30-day block; where the pump was delivered at least the new-pump start days before the ship date and the newest authorization grant for infusion sets covers fewer days than the standard set refill period, counting from the ship date through the grant''s valid-through date with both days included, the standard blocks are replaced with the whole 30-day blocks within those days, any part block dropped; otherwise the standard blocks stand.'
    ins_prog_id: The customer's pump insulin is the insulin dispensed under the customer's active insulin pharmacy program whose delivery method is insulin pump, counted in the standard way from its J1817 dispensing, each billing unit holding the pump insulin unit insulin.
    ins_variant: 'The counting of the customer''s pump insulin follows the customer''s insulin pharmacy programs in three cases: where the active pump-delivery program is on any tier other than the Insulin Pharmacy Medicare Part B Pump Insulin Program, the standard counting is replaced with its rapid-acting 10 mL vial dispensing, each vial holding the vial insulin; where the customer holds no active pump-delivery program, no pump insulin is counted; otherwise the standard counting stands.'
    ins_source: 'The customer''s pump insulin is the insulin dispensed under the customer''s active insulin pharmacy program whose delivery method is insulin pump, counted in the standard way from its J1817 dispensing, each billing unit holding the pump insulin unit insulin. The counting of the customer''s pump insulin follows the customer''s insulin pharmacy programs in three cases: where the active pump-delivery program is on any tier other than the Insulin Pharmacy Medicare Part B Pump Insulin Program, the standard counting is replaced with its rapid-acting 10 mL vial dispensing, each vial holding the vial insulin; where the customer holds no active pump-delivery program, no pump insulin is counted; otherwise the standard counting stands.'
    w_variant: 'The daily pump insulin follows the dispensing records in three cases: where a written order dated in the three months before the ship date is on the active pump-delivery insulin pharmacy program, the standard window is replaced with the newest pump insulin dispensing, its insulin divided by its own supply days; where no such order is on file and the program''s pump insulin item, J1817 on the Insulin Pharmacy Medicare Part B Pump Insulin Program and rapid-acting 10 mL vials on any other tier, was not dispensed in the three months before the ship date but was in the six months before it, the standard window is replaced with those six months, their insulin divided by the supply days they cover; otherwise the standard window stands.'
    w_orders_3m: 'The daily pump insulin follows the dispensing records in three cases: where a written order dated in the three months before the ship date is on the active pump-delivery insulin pharmacy program, the standard window is replaced with the newest pump insulin dispensing, its insulin divided by its own supply days; where no such order is on file and the program''s pump insulin item, J1817 on the Insulin Pharmacy Medicare Part B Pump Insulin Program and rapid-acting 10 mL vials on any other tier, was not dispensed in the three months before the ship date but was in the six months before it, the standard window is replaced with those six months, their insulin divided by the supply days they cover; otherwise the standard window stands. A dispensing or a written order counts as in the three or six months before the ship date when its date is later than the same day of the month three or six months before the ship date, and a record counts as in any other number of months before the ship date when its date is later than the same day of the month that many months before the ship date.'
