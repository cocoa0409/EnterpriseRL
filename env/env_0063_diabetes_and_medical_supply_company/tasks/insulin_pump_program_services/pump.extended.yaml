  - nc_od: COUNT('pump_orders', event_type='pump_prior_auth_denial', item_code=d_item)
  - liab_basis: 1 if (F('variant_name') == 'Insulin Pump Medicare Advantage Program' and nc_od > 0) else (2 if (F('variant_name') != 'Insulin Pump Medicare Advantage Program' and nt_date != '' and nt_date <= d_date) else 3)
  - nc_basis: LATEST('pump_orders', 'authorization_basis', date_field='valid_from', pump_order_id=d_grant) or ''
  - nc_units_auth: LATEST('pump_orders', 'units_authorized', date_field='valid_from', pump_order_id=d_grant) or 0
  - nc_from: LATEST('pump_orders', 'valid_from', date_field='valid_from', pump_order_id=d_grant) or NOW
  - nc_through: LATEST('pump_orders', 'valid_through', date_field='valid_from', pump_order_id=d_grant) or NOW
  - nc_order_rate: LATEST('pump_orders', 'quantity_per_30_days', date_field='order_date', pump_order_id=d_order) or 0
  - nc_olj: COUNT('pump_orders', within_months=12, date_field='visit_date', event_type='pump_medical_record_receipt', record_purpose='over_limit_justification')
  - nc_cover: ((nc_units_auth * K('block_days')) // (DAYS(nc_from, nc_through) + 1)) if nc_basis == 'payer_prior_authorization' else (nc_order_rate if (nc_basis != 'payer_prior_authorization' and nc_olj > 0) else P('reservoirs_per_30_days'))
  - rt_cc_n: COUNT('pump_billing', event_type='pump_claim_submission', submission_type='corrected', pump_shipment_id=d_ship)
  - rt_cc_billed: LATEST('pump_billing', 'billed_amount', date_field='posting_date', event_type='pump_claim_submission', submission_type='corrected', pump_shipment_id=d_ship) or 0
  - rt_orig_billed: SUM('pump_billing', 'billed_amount', event_type='pump_claim_submission', submission_type='original', pump_shipment_id=d_ship)
  - rt_cc_off: RND((rt_orig_billed - rt_cc_billed) * d_units / rt_orig_billed, 0) if (rt_cc_n > 0 and rt_orig_billed > 0) else 0
  - rt_received: SUM('pump_shipments', 'units', event_type='pump_return_receipt', original_pump_shipment_id=d_ship)
  - nc_returned: rt_cc_off if rt_cc_n > 0 else (rt_received if rt_received > 0 else 0)
  - late_days: DAYS(d_denial_date, NOW)
  - late_pct: K('late_courtesy_pct') if late_days > K('late_full_days') else (K('late_courtesy_pct') / 2 if (late_days > K('late_half_days') and late_days <= K('late_full_days')) else 0)
  - pays_3m: COUNT('pump_billing', within_months=3, date_field='posting_date', event_type='pump_patient_payment')
  - pays_6m: COUNT('pump_billing', within_months=6, date_field='posting_date', event_type='pump_patient_payment')
  - pay_pct: K('payment_history_pct') if (pays_3m > 0 and pays_6m > pays_3m) else (K('payment_history_pct') / 2 if (pays_6m > 0 and not (pays_3m > 0 and pays_6m > pays_3m)) else 0)
  - recent_liability: COUNT('pump_billing', within_months=K('first_liability_months'), date_field='posting_date', event_type='pump_patient_charge', charge_type='non_covered_item')
  - all_liability: COUNT('pump_billing', event_type='pump_patient_charge', charge_type='non_covered_item')
  - first_pct: K('first_liability_pct') if (recent_liability == 0 and all_liability == 0) else (K('first_liability_pct') / 2 if (recent_liability == 0 and all_liability > 0) else 0)
  - denied_units: MX(0, d_units - nc_cover * d_days // K('block_days'))
  - liable_units: denied_units if liab_basis == 1 else (MN(denied_units, nt_units) if liab_basis == 2 else 0)
  - result: (((MX(0, liable_units - nc_returned) * unit_price * (100 - late_pct - pay_pct - first_pct) / 100) * 100 + 0.5000001) // 1) / 100
  compute_basis:
    d_denial_date: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
    d_claim: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
    d_ship: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
    d_item: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
    d_units: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
    d_days: The denied line is the shipment the newest CO-151 denial's claim bills; its item, units, supply days and ship date are read from that shipment, its grant is the authorization grant it drew on, and its written order is the order that grant rests on.
