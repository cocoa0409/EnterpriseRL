  factors:
  - id: pending_exclusion
    effect: method
    decides: left_out
    bindings:
    - cc_id
    - cc_ship
    - cc_remits
    - cc_original
    - cc_resp
    - ap_id
    - ap_denial
    - ap_decisions
    - ap_claim
    - ap_remits
    - ap_resp
    - left_out
    ladder:
    - when: >-
        the program's most recent corrected claim has been transmitted and no remittance has posted on it yet
      method: leave out the patient responsibility posted on the remittance of that shipment's original claim
    - when: >-
        no corrected claim awaits a remittance, and the program's most recent first-level appeal has been filed with no decision posted on it (no new denial against the filing and no
        second remittance on the appealed claim)
