    assistance_lookback_months: 12
    withdrawn_lookback_months: 24
    withdrawn_recent_months: 2
    withdrawn_older_months: 1
    tenure_long_months: 60
    tenure_mid_months: 36
    tenure_long_add: 2
    tenure_mid_add: 1
  rule: >-
    A payment plan is set up when the customer asks to pay the program's balance in monthly installments, on a tier where payment plans are offered and for a balance of at least the
    tier's smallest plan balance; the customer accepts it personally, and it is recorded as an approved payment plan request carrying the number of monthly installments and the monthly
    installment. The plan's installment is fixed only after the program's most recent refill shipped expedited at the customer's request carries its expedited shipping charge. A payment
    plan's installment is not set until the expedited shipping charge posted against the program's most recent shipment sent expedited at no charge carries its billing correction. A
    payment plan's installment is not worked out until the records carry a non-covered item charge against the most recent convex-barrier refill whose original claim the plan denied
    under its organization determination denial. The amount the plan finances is the program's balance due on the day the plan is set up, which is the running total of its patient-balance
    postings (remittance patient responsibility, patient charges and refunds, less payments and balance adjustments), and the plan runs the tier's longest number of monthly installments;
    the monthly installment is the amount financed divided by the number of installments, rounded to the cent, and the last installment absorbs any rounding difference. Where the installment
    so found would fall below the tier's smallest monthly installment, the number of installments is reduced to the whole number of months at which the installment reaches that minimum.
    Each adjustment set out below changes the standard plan as that adjustment states, and an adjustment that takes an amount off the balance due does so before the amount is financed.
    The numbers of installments the adjustments set, add or take off are combined into one number, held to no more than the tier's longest number of monthly installments and no fewer
    than one, before the smallest monthly installment is applied. Postings whose amount is still expected to change are left out of the amount financed: where the program's most recent
    corrected claim has been transmitted and no remittance has posted on it yet, the patient responsibility posted on the remittance of that shipment's original claim is left out; where
    no corrected claim awaits a remittance but the program's most recent first-level appeal has been filed and no decision has posted on it - neither an upheld decision (a new denial
    posted against the appeal filing) nor an overturning one (a second remittance posted on the appealed claim), the patient responsibility posted on the remittance of the appealed claim
    is left out; otherwise nothing is left out. The balance band replaces the tier's longest number of monthly installments with a number set on the program's balance due: below 250.00
    the band is the low-balance months, from 250.00 to below 500.00 it is the mid-balance months, and from 500.00 it is the tier's longest number of monthly installments. Continence
    balances lengthen the plan, the continence balance being the running total of the patient-balance postings on all of the customer's continence programs: a customer with an active
    continence program and a continence balance above 0.00 adds the continence-owing months, a customer with an active continence program and a continence balance of 0.00 or less adds
    the continence-clear months, and any other customer adds none. Financial assistance lengthens the plan: a hardship application of the program received in the last 12 months that
    financial counseling approved (approved, or completed once its waiver is posted) adds the assistance-approved months, otherwise a hardship application received in the last 12 months
    that is still awaiting a decision adds the assistance-pending months, and otherwise none is added. An earlier plan the customer withdrew shortens the plan: a payment plan request
    of the program received in the last 24 months and since withdrawn takes off the recent-withdrawal months, a withdrawn payment plan request received more than 24 months ago with none
    received in the last 24 months takes off the older-withdrawal months, and otherwise nothing is taken off. Tenure lengthens the plan: a program enrolled for 60 months or more adds
    the long-tenure months, a program enrolled for at least 36 but fewer than 60 months adds the mid-tenure month, and any other program adds none.
  cross_category:
  - category: continence
    as: history
    reads:
    - status
    - continence_billing.amount
    - continence_billing.event_type
    note: >-
      the continence adjustment to the number of installments is decided from whether the customer holds an active continence program and the running total of the customer's continence
      billing postings
  compute:
  - ledger_debits: >-
      SUM('ostomy_billing', 'amount', event_type='ostomy_claim_adjudication') + SUM('ostomy_billing', 'amount', event_type='ostomy_patient_charge') + SUM('ostomy_billing', 'amount',
      event_type='ostomy_patient_refund')
  - ledger_credits: >-
      SUM('ostomy_billing', 'amount', event_type='ostomy_patient_payment') + SUM('ostomy_billing', 'amount', event_type='ostomy_balance_adjustment')
  - balance_due: RND(ledger_debits - ledger_credits, 2)
  - cc_id: >-
      LATEST('ostomy_billing', 'ostomy_ledger_id', date_field='posting_date', event_type='ostomy_claim_submission', submission_type='corrected')
  - cc_ship: >-
      LATEST('ostomy_billing', 'ostomy_shipment_id', date_field='posting_date', event_type='ostomy_claim_submission', submission_type='corrected')
  - cc_remits: COUNT('ostomy_billing', event_type='ostomy_claim_adjudication', original_ostomy_ledger_id=cc_id)
  - cc_original: >-
      LATEST('ostomy_billing', 'ostomy_ledger_id', date_field='posting_date', event_type='ostomy_claim_submission', submission_type='original', ostomy_shipment_id=cc_ship)
  - cc_resp: >-
      SUM('ostomy_billing', 'amount', event_type='ostomy_claim_adjudication', original_ostomy_ledger_id=cc_original)
  - ap_id: >-
      LATEST('ostomy_billing', 'ostomy_ledger_id', date_field='posting_date', event_type='ostomy_appeal_filing', appeal_level='first_level')
  - ap_denial: >-
      LATEST('ostomy_billing', 'original_ostomy_ledger_id', date_field='posting_date', event_type='ostomy_appeal_filing', appeal_level='first_level')
  - ap_decisions: COUNT('ostomy_billing', event_type='ostomy_claim_denial', original_ostomy_ledger_id=ap_id)
  - ap_claim: >-
      LATEST('ostomy_billing', 'original_ostomy_ledger_id', date_field='posting_date', event_type='ostomy_claim_denial', ostomy_ledger_id=ap_denial)
  - ap_remits: COUNT('ostomy_billing', event_type='ostomy_claim_adjudication', original_ostomy_ledger_id=ap_claim)
  - ap_resp: >-
      SUM('ostomy_billing', 'amount', event_type='ostomy_claim_adjudication', original_ostomy_ledger_id=ap_claim)
  - left_out: >-
      cc_resp if (cc_id != None and cc_remits == 0) else (ap_resp if (ap_id != None and ap_decisions == 0 and ap_remits < 2) else 0)
  - financed: RND(balance_due - left_out, 2)
  - longest_months: P('payment_plan_max_months')
  - band_balance: >-
      RND(SUM('ostomy_billing', 'amount', event_type='ostomy_claim_adjudication') + SUM('ostomy_billing', 'amount', event_type='ostomy_patient_charge') + SUM('ostomy_billing', 'amount',
      event_type='ostomy_patient_refund') - SUM('ostomy_billing', 'amount', event_type='ostomy_patient_payment') - SUM('ostomy_billing', 'amount', event_type='ostomy_balance_adjustment'),
      2)
  - band_months: >-
      K('band_low_months') if band_balance < K('band_low_balance') else (K('band_mid_months') if band_balance < K('band_mid_balance') else longest_months)
  - cont_active: EXISTS('continence', status='active')
  - cont_balance: >-
      RND(XSUM('continence', 'continence_billing', 'amount', event_type='continence_claim_adjudication') + XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_charge')
      + XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_refund') - XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_payment')
      - XSUM('continence', 'continence_billing', 'amount', event_type='continence_balance_adjustment'), 2)
  - continence_months: >-
      K('continence_owing_months') if (cont_active and cont_balance > 0) else (K('continence_clear_months') if (cont_active and cont_balance <= 0) else 0)
  - approved_apps_12m: >-
      COUNT('ostomy_requests', within_months=K('assistance_lookback_months'), date_field='received_at', request_type='hardship_application', request_status='approved') + COUNT('ostomy_requests',
      within_months=K('assistance_lookback_months'), date_field='received_at', request_type='hardship_application', request_status='completed')
  - pending_apps_12m: >-
      COUNT('ostomy_requests', within_months=K('assistance_lookback_months'), date_field='received_at', request_type='hardship_application', request_status='received')
  - assistance_months: >-
      K('assistance_approved_months') if approved_apps_12m >= 1 else (K('assistance_pending_months') if pending_apps_12m >= 1 else 0)
  - withdrawn_24m: >-
      COUNT('ostomy_requests', within_months=K('withdrawn_lookback_months'), date_field='received_at', request_type='payment_plan', request_status='withdrawn')
  - withdrawn_all: COUNT('ostomy_requests', request_type='payment_plan', request_status='withdrawn')
  - withdrawal_months: >-
      K('withdrawn_recent_months') if withdrawn_24m >= 1 else (K('withdrawn_older_months') if withdrawn_all >= 1 else 0)
  - plan_enrolled_months: MONTHS(F('enrolled_date'), NOW)
  - tenure_add: >-
      K('tenure_long_add') if plan_enrolled_months >= K('tenure_long_months') else (K('tenure_mid_add') if plan_enrolled_months >= K('tenure_mid_months') else 0)
  - built_months: >-
      MX(1, MN(longest_months, band_months + continence_months + assistance_months - withdrawal_months + tenure_add))
  - plan_months: MX(1, MN(built_months, int(financed / P('payment_plan_min_monthly_usd'))))
  - result: RND(financed / plan_months, 2)
  prerequisite:
  - problem: ostomy_ext_plan_denial_charge
    kind: value_input
    gate: balance_due
    form: state
    policy_source: >-
      A payment plan's installment is not worked out until the records carry a non-covered item charge against the most recent convex-barrier refill whose original claim the plan denied
      under its organization determination denial.
