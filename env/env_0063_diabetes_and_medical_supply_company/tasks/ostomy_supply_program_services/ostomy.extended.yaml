  - problem: ostomy_ext_reship_correction
    kind: value_input
    gate: balance_due
    form: state
    policy_source: >-
      A payment plan's installment is not set until the expedited shipping charge posted against the program's most recent shipment sent expedited at no charge carries its billing correction.
    condition: >-
