- id: ostomy_ext_refill_units
  base_policy_refs:
  - ostomy_evt_refill_shipment
  - ostomy_agg_dual_stoma_accessories
  - ostomy_evt_quantity_limits
  - ostomy_liability_notice
  - ostomy_documentation_and_authorization
