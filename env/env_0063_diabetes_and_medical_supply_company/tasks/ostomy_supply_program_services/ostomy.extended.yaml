  - base_policy: ostomy_liability_notice
    superseded_clause: the customer signs it personally, and no Larkfield representative can sign it for them.
    replaced_by: >-
      For a liability notice this policy handles, and only for such a notice, the customer signs it personally through the signing step Larkfield hands to them for the enrollment the
      representative names to them, and no Larkfield representative can sign it for them; every other liability notice remains one the customer signs personally, and no Larkfield representative
      can sign it for them.
  trigger: on_request
  subject:
  - ostomy_liability_notice_signed
  computes: notice_units
  target_tool: sign_liability_notice_87444016
  params:
