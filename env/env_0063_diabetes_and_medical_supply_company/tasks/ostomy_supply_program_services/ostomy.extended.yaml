    span_full_blocks: 12
    span_full_days: 360
    established_refills: 2
    step_half_days: 60
    step_three_quarter_days: 120
    step_half_less_blocks: 1.0
    step_three_quarter_less_blocks: 0.5
    window_recent_months: 12
    window_older_months: 24
    replacements_many: 2
    buffer_many: 0.2
    buffer_one: 0.1
    notices_many: 2
    margin_many: 0.1
    margin_one: 0.05
    convex_allowance_standard: 20
    convex_allowance_hmo: 15
    convex_allowance_medicaid: 10
  rule: >-
    For a liability notice this policy handles, and only for such a notice, the customer signs it personally through the signing step Larkfield hands to them for the enrollment the representative
    names to them, and no Larkfield representative can sign it for them; every other liability notice remains one the customer signs personally, and no Larkfield representative can sign
    it for them. When a customer wants convex barriers (A4407) above what the tier's allowance covers and no medical record documents the need, Larkfield supplies the extra barriers
    billable to the customer only on the tier's liability notice, which the customer signs personally; this policy fixes the number of barriers that notice covers. The units a notice
    covers are the order's excess per 30 days (the newest written order's quantity per 30 days less the tier's allowance, never below zero) times one standard supply of 30-day blocks
    (the tier's standard supply days divided by 30), rounded down to a whole barrier. Each adjustment set out below changes the standard units as that adjustment states: changes to the
    30-day blocks and shares added to the excess act before the units are rounded down to a whole barrier, the shares being added into one share applied once, and units deducted come
    off after the rounding, never below zero. How long the notice runs replaces the one standard supply of 30-day blocks and follows the written order: where the newest written order's
    valid-through date is at least 360 days away and the program has shipped at least two convex-barrier refills, the notice runs for twelve 30-day blocks; where the valid-through date
    is fewer than 360 days and at least 30 days away, it runs for the whole 30-day blocks to that date; otherwise it runs for one standard supply. The step-up blocks are taken off the
    30-day blocks the excess is counted for after the newest written order raised the quantity: where the newest written order was signed 60 days or fewer ago, one block is taken off;
    more than 60 and at most 120 days ago, half a block is taken off; otherwise none. Earlier cover still unused is deducted according to how recent the customer's latest earlier liability
    notice for the convex barrier is: signed fewer than 12 whole calendar months ago, the deduction is that notice's units less the barriers shipped above the allowance in the last 12
    months; signed 12 to 23 whole calendar months ago, its units less the barriers shipped above the allowance in the last 24 months; otherwise nothing is deducted; the deduction is
    never below zero. The barriers shipped above the allowance in a window are the convex-barrier refill units shipped in it less the tier's allowance times their supply days divided
    by 30. A leakage share is added to the excess, as a share of it, according to the no-charge replacements of the convex barrier for a product defect or transit damage shipped in the
    last 12 months: two or more add the larger leakage margin, one adds the smaller leakage margin, none adds nothing. A repeat share is added to the excess, as a share of it, according
    to the liability notices for the convex barrier the customer signed in the last 24 months: two or more add the larger repeat margin, one adds the smaller repeat margin, none adds
    nothing. The tier's allowance for the convex barrier is the billing units per 30 days that the tier's monthly allowance by item sets for A4407: 20 on the Self-Pay, Commercial PPO,
    Medicare Advantage and Original Medicare tiers, 15 on the Commercial HMO tier and 10 on the Medicaid tier. This policy applies only on tiers whose liability notice is one the customer
    can sign - the plan member waiver, the CMS Advance Beneficiary Notice (form CMS-R-131) or the Medicaid non-covered service agreement; on the Medicare Advantage tier no notice can
    make the member liable and on the self-pay tier no notice applies, so no notice units are fixed there. A program without a written order for the convex barrier has no order excess,
    so no notice units are fixed for it.
  prerequisite: []
  cross_category: []
  compute:
  - tier_allowance: >-
      K('convex_allowance_medicaid') if F('variant_name') == 'Ostomy Medicaid Program' else (K('convex_allowance_hmo') if F('variant_name') == 'Ostomy Commercial HMO Program' else K('convex_allowance_standard'))
  - signable_tier: >-
      P('liability_notice_type') == 'plan_member_waiver' or P('liability_notice_type') == 'abn_cms_r_131' or P('liability_notice_type') == 'medicaid_non_covered_agreement'
  - order_qty: >-
      LATEST('ostomy_orders', 'quantity_per_30_days', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407') if LATEST('ostomy_orders', 'quantity_per_30_days',
      date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407') != None else 0
  - excess_per30: MX(0, order_qty - tier_allowance)
  - std_blocks: P('supply_days_per_shipment') / K('block_days')
  - order_left: >-
      DAYS(NOW, LATEST('ostomy_orders', 'valid_through', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407')) if LATEST('ostomy_orders', 'valid_through', date_field='order_date',
      event_type='ostomy_order_receipt', item_code='A4407') != None else 0
  - refills_shipped: COUNT('ostomy_shipments', event_type='ostomy_refill_shipment', item_code='A4407')
  - span_blocks: >-
      K('span_full_blocks') if (order_left >= K('span_full_days') and refills_shipped >= K('established_refills')) else (int(order_left / K('block_days')) if (order_left < K('span_full_days')
      and order_left >= K('block_days')) else std_blocks)
  - order_age: >-
      DAYS(LATEST('ostomy_orders', 'order_date', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407'), NOW) if LATEST('ostomy_orders', 'order_date', date_field='order_date',
      event_type='ostomy_order_receipt', item_code='A4407') != None else 999
  - step_blocks: >-
      K('step_half_less_blocks') if order_age <= K('step_half_days') else (K('step_three_quarter_less_blocks') if order_age <= K('step_three_quarter_days') else 0)
  - prior_notice_units: >-
      LATEST('ostomy_orders', 'notice_units', date_field='notice_date', event_type='ostomy_liability_notice_signed', item_code='A4407')
  - prior_notice_months: >-
      MONTHS(LATEST('ostomy_orders', 'notice_date', date_field='notice_date', event_type='ostomy_liability_notice_signed', item_code='A4407'), NOW) if prior_notice_units != None else
      999
  - over_12m: >-
      SUM('ostomy_shipments', 'units', within_months=K('window_recent_months'), date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') - tier_allowance * SUM('ostomy_shipments',
      'supply_days', within_months=K('window_recent_months'), date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') / K('block_days')
  - over_24m: >-
      SUM('ostomy_shipments', 'units', within_months=K('window_older_months'), date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') - tier_allowance * SUM('ostomy_shipments',
      'supply_days', within_months=K('window_older_months'), date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') / K('block_days')
  - unused_cover: >-
      MX(0, prior_notice_units - over_12m) if prior_notice_months < K('window_recent_months') else (MX(0, prior_notice_units - over_24m) if (prior_notice_months >= K('window_recent_months')
      and prior_notice_months < K('window_older_months')) else 0)
  - leak_repl_12m: >-
      COUNT('ostomy_shipments', within_months=K('window_recent_months'), date_field='ship_date', event_type='ostomy_replacement_shipment', item_code='A4407', replacement_reason='product_defect')
      + COUNT('ostomy_shipments', within_months=K('window_recent_months'), date_field='ship_date', event_type='ostomy_replacement_shipment', item_code='A4407', replacement_reason='damaged_in_transit')
  - leak_margin: >-
      K('buffer_many') if leak_repl_12m >= K('replacements_many') else (K('buffer_one') if leak_repl_12m == 1 else 0)
  - notices_24m: >-
      COUNT('ostomy_orders', within_months=K('window_older_months'), date_field='notice_date', event_type='ostomy_liability_notice_signed', item_code='A4407')
  - repeat_margin: >-
      K('margin_many') if notices_24m >= K('notices_many') else (K('margin_one') if notices_24m == 1 else 0)
  - result: >-
      0 if not signable_tier else int(MX(0, int(RND(excess_per30 * (span_blocks - step_blocks) * (1 + leak_margin + repeat_margin), 6)) - unused_cover))
  compute_basis:
    tier_allowance: >-
      The tier's allowance for the convex barrier is the billing units per 30 days that the tier's monthly allowance by item sets for A4407: 20 on the Self-Pay, Commercial PPO, Medicare
      Advantage and Original Medicare tiers, 15 on the Commercial HMO tier and 10 on the Medicaid tier.
    order_qty: >-
      A program without a written order for the convex barrier has no order excess, so no notice units are fixed for it.
    excess_per30: >-
      the order's excess per 30 days (the newest written order's quantity per 30 days less the tier's allowance, never below zero)
    std_blocks: one standard supply of 30-day blocks (the tier's standard supply days divided by 30)
    order_left: where the newest written order's valid-through date is at least 360 days away
    refills_shipped: the program has shipped at least two convex-barrier refills
    span_blocks: >-
      How long the notice runs replaces the one standard supply of 30-day blocks and follows the written order: where the newest written order's valid-through date is at least 360 days
      away and the program has shipped at least two convex-barrier refills, the notice runs for twelve 30-day blocks; where the valid-through date is fewer than 360 days and at least
      30 days away, it runs for the whole 30-day blocks to that date; otherwise it runs for one standard supply.
    order_age: where the newest written order was signed 60 days or fewer ago
    step_blocks: >-
      The step-up blocks are taken off the 30-day blocks the excess is counted for after the newest written order raised the quantity: where the newest written order was signed 60 days
      or fewer ago, one block is taken off; more than 60 and at most 120 days ago, half a block is taken off; otherwise none.
    prior_notice_units: >-
      the deduction is that notice's units less the barriers shipped above the allowance in the last 12 months
    prior_notice_months: according to how recent the customer's latest earlier liability notice for the convex barrier is
    over_12m: >-
      The barriers shipped above the allowance in a window are the convex-barrier refill units shipped in it less the tier's allowance times their supply days divided by 30.
    over_24m: >-
      The barriers shipped above the allowance in a window are the convex-barrier refill units shipped in it less the tier's allowance times their supply days divided by 30.
    unused_cover: >-
      Earlier cover still unused is deducted according to how recent the customer's latest earlier liability notice for the convex barrier is: signed fewer than 12 whole calendar months
      ago, the deduction is that notice's units less the barriers shipped above the allowance in the last 12 months; signed 12 to 23 whole calendar months ago, its units less the barriers
      shipped above the allowance in the last 24 months; otherwise nothing is deducted; the deduction is never below zero.
    leak_repl_12m: >-
      A leakage share is added to the excess, as a share of it, according to the no-charge replacements of the convex barrier for a product defect or transit damage shipped in the last
      12 months
    leak_margin: >-
      A leakage share is added to the excess, as a share of it, according to the no-charge replacements of the convex barrier for a product defect or transit damage shipped in the last
      12 months: two or more add the larger leakage margin, one adds the smaller leakage margin, none adds nothing.
    notices_24m: >-
      A repeat share is added to the excess, as a share of it, according to the liability notices for the convex barrier the customer signed in the last 24 months
    repeat_margin: >-
      A repeat share is added to the excess, as a share of it, according to the liability notices for the convex barrier the customer signed in the last 24 months: two or more add the
      larger repeat margin, one adds the smaller repeat margin, none adds nothing.
    result: >-
      Each adjustment set out below changes the standard units as that adjustment states: changes to the 30-day blocks and shares added to the excess act before the units are rounded
      down to a whole barrier, the shares being added into one share applied once, and units deducted come off after the rounding, never below zero.
    signable_tier: >-
      This policy applies only on tiers whose liability notice is one the customer can sign - the plan member waiver, the CMS Advance Beneficiary Notice (form CMS-R-131) or the Medicaid
      non-covered service agreement; on the Medicare Advantage tier no notice can make the member liable and on the self-pay tier no notice applies, so no notice units are fixed there.
  factors:
  - id: notice_span
    effect: method
    decides: span_blocks
    bindings:
    - order_left
    - refills_shipped
    - span_blocks
    ladder:
    - when: newest written order valid at least 360 more days and at least two convex-barrier refills shipped
      method: twelve 30-day blocks
    - when: newest written order valid fewer than 360 and at least 30 more days
      method: the whole 30-day blocks to the order's valid-through date
    - when: otherwise
      method: one standard supply of 30-day blocks
    baseline:
      span_blocks: std_blocks
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: increase_blocks
    effect: parameter
    decides: step_blocks
    bindings:
    - order_age
    - step_blocks
    ladder:
    - when: newest written order signed 60 days or fewer ago
      value: K('step_half_less_blocks')
    - when: signed more than 60 and at most 120 days ago
      value: K('step_three_quarter_less_blocks')
    - when: otherwise
      value: '0'
    baseline:
      step_blocks: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: unused_cover
    effect: parameter
    decides: unused_cover
    bindings:
    - prior_notice_units
    - prior_notice_months
    - over_12m
    - over_24m
    - unused_cover
    ladder:
    - when: >-
        latest earlier liability notice for the convex barrier signed fewer than 12 whole calendar months ago
      value: MX(0, prior_notice_units - over_12m)
    - when: latest earlier notice signed 12 to 23 whole calendar months ago
      value: MX(0, prior_notice_units - over_24m)
    - when: otherwise
      value: '0'
    baseline:
      unused_cover: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: leakage_margin
    effect: parameter
    decides: leak_margin
    bindings:
    - leak_repl_12m
    - leak_margin
    ladder:
    - when: >-
        two or more no-charge replacements of the convex barrier for a product defect or transit damage in the last 12 months
      value: K('buffer_many')
    - when: exactly one such replacement
      value: K('buffer_one')
    - when: otherwise
      value: '0'
    baseline:
      leak_margin: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: repeat_signer
    effect: parameter
    decides: repeat_margin
    bindings:
    - notices_24m
    - repeat_margin
    ladder:
    - when: two or more liability notices for the convex barrier signed in the last 24 months
      value: K('margin_many')
    - when: exactly one such notice
      value: K('margin_one')
    - when: otherwise
      value: '0'
    baseline:
      repeat_margin: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The units a notice covers are the order's excess per 30 days (the newest written order's quantity per 30 days less the tier's allowance, never below zero) times one standard supply
      of 30-day blocks (the tier's standard supply days divided by 30), rounded down to a whole barrier.
    params:
    - monthly_allowance_by_item
    - block_days
    - supply_days_per_shipment
  inputs:
    history:
    - table: ostomy_shipments
      aggregate: sum
      field: units
      within_months: 12
      filters:
        event_type: ostomy_refill_shipment
        item_code: A4407
    - table: ostomy_orders
      aggregate: latest
      field: notice_units
      filters:
        event_type: ostomy_liability_notice_signed
        item_code: A4407
    - table: ostomy_shipments
      aggregate: count
      field: ostomy_shipment_id
      within_months: 12
      filters:
        event_type: ostomy_replacement_shipment
    cross_category: []
- id: ostomy_ext_expedite_fee
  base_policy_refs:
  - ostomy_liability_notice
  - ostomy_evt_refill_shipment
  - ostomy_evt_replacement_and_delivery
  overwrite:
  - base_policy: ostomy_evt_refill_shipment
    superseded_clause: >-
      Expedited shipping is provided on the customer's request for expedited_shipping_fee_usd, posted as a patient charge because no payer covers delivery speed
    replaced_by: >-
      For the expedited shipping charge this policy handles - the charge for a refill a program shipped expedited at the customer's own request - and only for such a charge, the amount
      is set as this policy states; every other expedite is provided on the customer's request for expedited_shipping_fee_usd, posted as a patient charge because no payer covers delivery
      speed.
  trigger: state_due
  subject:
  - ostomy_patient_charge
  computes: amount
  target_tool: post_expedite_charge_9c5d9761
  params:
    promise_days: 2
    full_share: 1.0
    courtesy_none: 0.1
    courtesy_one: 0.05
    lookback_months: 12
    stale_days_long: 90
    stale_days_mid: 60
    stale_rate_long: 0.1
    stale_rate_mid: 0.05
    tenure_long_months: 36
    tenure_mid_months: 12
    tenure_rate_long: 0.05
    tenure_rate_mid: 0.02
    standing_low_balance: 50.0
    standing_rate_clear: 0.05
    standing_rate_low: 0.02
    delay_days_long: 10
    delay_days_mid: 5
    delay_rate_long: 0.2
    delay_rate_mid: 0.1
    late_day_share: 0.25
  rule: >-
    For the expedited shipping charge this policy handles - the charge for a refill a program shipped expedited at the customer's own request - and only for such a charge, the amount
    is set as this policy states; every other expedite is provided on the customer's request for expedited_shipping_fee_usd, posted as a patient charge because no payer covers delivery
    speed. The charge is owed once the program's most recent refill shipped with the shipping method expedited carries no expedited shipping charge; one charge is posted against that
    refill, and a program with no such refill owes no charge under this policy. The expedite charge on the refill is the tier's expedited shipping fee, rounded to the cent. Each adjustment
    set out below changes the standard charge as that adjustment states: a share multiplies the fee, and the rates taken off the fee are added into one rate that reduces it once rather
    than successively; the charge is then rounded to the cent. The delivery share multiplies the fee and follows Larkfield's two-day promise, measured in calendar days from the refill's
    ship date to the delivery date on its proof of delivery: where no proof of delivery is on file the share is nothing; where the delivery came more than 2 days after the ship date,
    each day beyond the second takes a quarter of the fee off, so the share is the full share less a quarter for every such day, never below nothing; otherwise the share is the full
    share. A first-expedite courtesy rate is taken off the fee according to the program's refills shipped expedited in the last 12 months, counted together with this refill even when
    it shipped earlier than that: where this refill is the only one, it takes the larger courtesy; where there are exactly two, the smaller courtesy; otherwise none. A late-billing rate
    is taken off the fee according to the calendar days from the refill's ship date to today: more than 90 days takes the larger late-billing rate, more than 60 and at most 90 days the
    smaller late-billing rate, 60 days or fewer none. A tenure rate is taken off the fee according to how long the program has been active: 36 months or more takes the long-tenure rate,
    at least 12 but fewer than 36 months the mid-tenure rate, fewer than 12 months none. A standing rate is taken off the fee according to the customer's continence account, the continence
    balance being the running total of the patient-balance postings on all of the customer's continence programs: an active continence program and a continence balance of 0.00 or less
    takes the clear-account rate, an active continence program and a continence balance above 0.00 and below 50.00 takes the low-balance rate, and any other customer takes none. A confirmation-delay
    rate is taken off the fee when Larkfield was slow to ship after the customer confirmed the refill, measured in calendar days from the refill's confirmation date to its ship date:
    more than 10 days takes the larger delay rate, more than 5 and at most 10 days the smaller delay rate, 5 days or fewer none.
  prerequisite: []
  cross_category:
  - category: continence
    as: history
    reads:
    - status
    - continence_billing.amount
    - continence_billing.event_type
    note: >-
      the standing reduction is decided from whether the customer holds an active continence program and the running total of the customer's continence billing postings
  compute:
  - ex_ship_id: >-
      LATEST('ostomy_shipments', 'ostomy_shipment_id', date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited')
  - ex_ship_date: >-
      LATEST('ostomy_shipments', 'ship_date', date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited')
  - ex_charged: >-
      COUNT('ostomy_billing', event_type='ostomy_patient_charge', charge_type='expedited_shipping', ostomy_shipment_id=ex_ship_id)
  - base_fee: P('expedited_shipping_fee_usd')
  - ex_pod: >-
      LATEST('ostomy_shipments', 'delivery_date', date_field='delivery_date', event_type='ostomy_delivery_confirmation', original_ostomy_shipment_id=LATEST('ostomy_shipments', 'ostomy_shipment_id',
      date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited'))
  - transit_days: >-
      DAYS(LATEST('ostomy_shipments', 'ship_date', date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited'), ex_pod) if ex_pod != None else 0
  - delivery_share: >-
      0 if ex_pod == None else (MX(0, K('full_share') - K('late_day_share') * (transit_days - K('promise_days'))) if transit_days > K('promise_days') else K('full_share'))
  - other_expedites: >-
      COUNT('ostomy_shipments', within_months=K('lookback_months'), date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited') + (0 if (ex_ship_date ==
      None or MONTHS(ex_ship_date, NOW) < K('lookback_months')) else 1)
  - courtesy_rate: K('courtesy_none') if other_expedites == 1 else (K('courtesy_one') if other_expedites == 2 else 0)
  - billing_lag: >-
      DAYS(LATEST('ostomy_shipments', 'ship_date', date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited'), NOW) if ex_ship_date != None else 0
  - late_rate: >-
      K('stale_rate_long') if billing_lag > K('stale_days_long') else (K('stale_rate_mid') if billing_lag > K('stale_days_mid') else 0)
  - active_months: MONTHS(F('activated_date'), NOW)
  - tenure_rate: >-
      K('tenure_rate_long') if active_months >= K('tenure_long_months') else (K('tenure_rate_mid') if active_months >= K('tenure_mid_months') else 0)
  - cont_active: EXISTS('continence', status='active')
  - cont_balance: >-
      RND(XSUM('continence', 'continence_billing', 'amount', event_type='continence_claim_adjudication') + XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_charge')
      + XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_refund') - XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_payment')
      - XSUM('continence', 'continence_billing', 'amount', event_type='continence_balance_adjustment'), 2)
  - standing_rate: >-
      K('standing_rate_clear') if (cont_active and cont_balance <= 0) else (K('standing_rate_low') if (cont_active and cont_balance > 0 and cont_balance < K('standing_low_balance'))
      else 0)
  - confirm_lag: >-
      DAYS(LATEST('ostomy_shipments', 'refill_confirmed_date', date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited'), LATEST('ostomy_shipments', 'ship_date',
      date_field='ship_date', event_type='ostomy_refill_shipment', shipping_method='expedited')) if (ex_ship_date != None and LATEST('ostomy_shipments', 'refill_confirmed_date', date_field='ship_date',
      event_type='ostomy_refill_shipment', shipping_method='expedited') != None and LATEST('ostomy_shipments', 'refill_confirmed_date', date_field='ship_date', event_type='ostomy_refill_shipment',
      shipping_method='expedited') != '') else 0
  - delay_rate: >-
      K('delay_rate_long') if confirm_lag > K('delay_days_long') else (K('delay_rate_mid') if confirm_lag > K('delay_days_mid') else 0)
  - result: >-
      0 if (ex_ship_id == None or ex_charged > 0) else RND(base_fee * delivery_share * (1 - courtesy_rate - late_rate - tenure_rate - standing_rate - delay_rate), 2)
  compute_basis:
    ex_ship_id: >-
      one charge is posted against that refill, and a program with no such refill owes no charge under this policy.
    ex_ship_date: >-
      The charge is owed once the program's most recent refill shipped with the shipping method expedited carries no expedited shipping charge
    ex_charged: >-
      The charge is owed once the program's most recent refill shipped with the shipping method expedited carries no expedited shipping charge
    base_fee: The expedite charge on the refill is the tier's expedited shipping fee, rounded to the cent.
    ex_pod: measured in calendar days from the refill's ship date to the delivery date on its proof of delivery
    transit_days: measured in calendar days from the refill's ship date to the delivery date on its proof of delivery
    delivery_share: >-
      The delivery share multiplies the fee and follows Larkfield's two-day promise, measured in calendar days from the refill's ship date to the delivery date on its proof of delivery:
      where no proof of delivery is on file the share is nothing; where the delivery came more than 2 days after the ship date, each day beyond the second takes a quarter of the fee
      off, so the share is the full share less a quarter for every such day, never below nothing; otherwise the share is the full share.
    other_expedites: >-
      A first-expedite courtesy rate is taken off the fee according to the program's refills shipped expedited in the last 12 months, counted together with this refill even when it shipped
      earlier than that
    courtesy_rate: >-
      A first-expedite courtesy rate is taken off the fee according to the program's refills shipped expedited in the last 12 months, counted together with this refill even when it shipped
      earlier than that: where this refill is the only one, it takes the larger courtesy; where there are exactly two, the smaller courtesy; otherwise none.
    billing_lag: >-
      A late-billing rate is taken off the fee according to the calendar days from the refill's ship date to today
    late_rate: >-
      A late-billing rate is taken off the fee according to the calendar days from the refill's ship date to today: more than 90 days takes the larger late-billing rate, more than 60
      and at most 90 days the smaller late-billing rate, 60 days or fewer none.
    active_months: A tenure rate is taken off the fee according to how long the program has been active
    tenure_rate: >-
      A tenure rate is taken off the fee according to how long the program has been active: 36 months or more takes the long-tenure rate, at least 12 but fewer than 36 months the mid-tenure
      rate, fewer than 12 months none.
    cont_active: an active continence program and a continence balance of 0.00 or less takes the clear-account rate
    cont_balance: >-
      the continence balance being the running total of the patient-balance postings on all of the customer's continence programs
    standing_rate: >-
      A standing rate is taken off the fee according to the customer's continence account, the continence balance being the running total of the patient-balance postings on all of the
      customer's continence programs: an active continence program and a continence balance of 0.00 or less takes the clear-account rate, an active continence program and a continence
      balance above 0.00 and below 50.00 takes the low-balance rate, and any other customer takes none.
    confirm_lag: measured in calendar days from the refill's confirmation date to its ship date
    delay_rate: >-
      A confirmation-delay rate is taken off the fee when Larkfield was slow to ship after the customer confirmed the refill, measured in calendar days from the refill's confirmation
      date to its ship date: more than 10 days takes the larger delay rate, more than 5 and at most 10 days the smaller delay rate, 5 days or fewer none.
    result: >-
      Each adjustment set out below changes the standard charge as that adjustment states: a share multiplies the fee, and the rates taken off the fee are added into one rate that reduces
      it once rather than successively; the charge is then rounded to the cent.
  factors:
  - id: two_day_promise
    effect: method
    decides: delivery_share
    bindings:
    - ex_pod
    - transit_days
    - delivery_share
    ladder:
    - when: no proof of delivery on file for the expedited refill
      method: charge nothing
    - when: delivered more than 2 calendar days after the ship date
      method: take a quarter of the fee off for every day beyond the second, never below nothing
    - when: otherwise (delivered within 2 days)
      method: charge the full fee
    baseline:
      delivery_share: K('full_share')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: first_expedite
    effect: parameter
    decides: courtesy_rate
    bindings:
    - other_expedites
    - courtesy_rate
    ladder:
    - when: this refill is the only refill of the program shipped expedited in the last 12 months
      value: K('courtesy_none')
    - when: exactly two refills shipped expedited in the last 12 months
      value: K('courtesy_one')
    - when: otherwise
      value: '0'
    baseline:
      courtesy_rate: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: late_billing
    effect: parameter
    decides: late_rate
    bindings:
    - billing_lag
    - late_rate
    ladder:
    - when: more than 90 calendar days from the refill's ship date to today
      value: K('stale_rate_long')
    - when: more than 60 and at most 90 days
      value: K('stale_rate_mid')
    - when: otherwise
      value: '0'
    baseline:
      late_rate: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: expedite_tenure
    effect: parameter
    decides: tenure_rate
    bindings:
    - active_months
    - tenure_rate
    ladder:
    - when: program active 36 months or more
      value: K('tenure_rate_long')
    - when: active at least 12 but fewer than 36 months
      value: K('tenure_rate_mid')
    - when: otherwise
      value: '0'
    baseline:
      tenure_rate: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: continence_standing
    effect: parameter
    decides: standing_rate
    bindings:
    - cont_active
    - cont_balance
    - standing_rate
    ladder:
    - when: an active continence program and a continence balance of 0.00 or less
      value: K('standing_rate_clear')
    - when: an active continence program and a continence balance above 0.00 and below 50.00
      value: K('standing_rate_low')
    - when: otherwise
      value: '0'
    baseline:
      standing_rate: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: continence
  - id: confirmation_delay
    effect: parameter
    decides: delay_rate
    bindings:
    - confirm_lag
    - delay_rate
    ladder:
    - when: more than 10 calendar days from the refill's confirmation to its ship date
      value: K('delay_rate_long')
    - when: more than 5 and at most 10 days
      value: K('delay_rate_mid')
    - when: otherwise
      value: '0'
    baseline:
      delay_rate: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The expedite charge on the refill is the tier's expedited shipping fee, rounded to the cent.
    params:
    - expedited_shipping_fee_usd
    - full_share
  inputs:
    history:
    - table: ostomy_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: ostomy_refill_shipment
        shipping_method: expedited
    - table: ostomy_shipments
      aggregate: count
      field: ostomy_shipment_id
      within_months: 12
      filters:
        event_type: ostomy_refill_shipment
        shipping_method: expedited
    - category: continence
      table: continence_billing
      aggregate: sum
      field: amount
      filters: {}
    cross_category:
    - continence
- id: ostomy_ext_reship_correction
  base_policy_refs:
  - ostomy_evt_patient_account
  - ostomy_evt_replacement_and_delivery
  - ostomy_evt_refill_shipment
  overwrite:
  - base_policy: ostomy_evt_patient_account
    superseded_clause: each against the one posting it adjusts and never for more than that posting's unpaid remainder
    replaced_by: >-
      For the billing correction this policy handles - an expedited shipping charge posted against a shipment Larkfield sent at its own cost - and only for such a correction, the adjustment
      is posted against that one charge and may exceed the charge by the service-recovery amount this policy states; every other balance adjustment is posted each against the one posting
      it adjusts and never for more than that posting's unpaid remainder.
  trigger: state_due
  subject:
  - ostomy_balance_adjustment
  computes: amount
  target_tool: post_reship_correction_64ee6975
  params:
    recovery_tenure_long: 10.0
    recovery_tenure_mid: 5.0
    tenure_long_months: 36
    tenure_mid_months: 12
    recovery_repeat_many: 10.0
    recovery_repeat_one: 5.0
    repeat_lookback_months: 12
    age_days_long: 60
    age_days_mid: 30
    recovery_age_step: 2.5
    recovery_reason_lost: 10.0
    recovery_reason_damaged: 5.0
  rule: >-
    For the billing correction this policy handles - an expedited shipping charge posted against a shipment Larkfield sent at its own cost - and only for such a correction, the adjustment
    is posted against that one charge and may exceed the charge by the service-recovery amount this policy states; every other balance adjustment is posted each against the one posting
    it adjusts and never for more than that posting's unpaid remainder. A correction is owed when an expedited shipping charge stands against the program's most recent shipment sent
    with the shipping method expedited at no charge (where more than one stands, the most recently posted one) and no billing correction has been posted against that charge; it is posted
    once, against that charge, with reason billing correction, and a program without such a charge owes no correction under this policy. The correction is the whole charge, rounded to
    the cent. Each service-recovery part set out below adds to the whole charge as that part states, before the correction is rounded to the cent. A tenure part follows how long the
    program has been active: 36 months or more adds the long-tenure recovery, at least 12 but fewer than 36 months the mid-tenure recovery, fewer than 12 months nothing. A repeat part
    follows the billing corrections already posted on the program in the last 12 months: two or more add the larger repeat recovery, exactly one adds the smaller repeat recovery, none
    adds nothing. An age part follows the calendar days from the charge's posting date to today: more than 60 days adds the age recovery for every whole 30 days the charge has stood,
    more than 30 and at most 60 days adds the age recovery once, 30 days or fewer nothing. A reason part follows why Larkfield sent the shipment at no charge: a replacement for a package
    lost in transit adds the larger reason recovery, a replacement for a package damaged in transit adds the smaller reason recovery, and any other no-charge shipment adds nothing.
  prerequisite: []
  cross_category: []
  compute:
  - nc_ship_id: >-
      LATEST('ostomy_shipments', 'ostomy_shipment_id', date_field='ship_date', shipping_method='expedited_no_charge')
  - err_id: >-
      LATEST('ostomy_billing', 'ostomy_ledger_id', date_field='posting_date', event_type='ostomy_patient_charge', charge_type='expedited_shipping', ostomy_shipment_id=nc_ship_id)
  - err_amount: SUM('ostomy_billing', 'amount', ostomy_ledger_id=err_id)
  - err_corrected: >-
      SUM('ostomy_billing', 'amount', event_type='ostomy_balance_adjustment', adjustment_reason='billing_correction', original_ostomy_ledger_id=err_id)
  - active_months: MONTHS(F('activated_date'), NOW)
  - tenure_recovery: >-
      K('recovery_tenure_long') if active_months >= K('tenure_long_months') else (K('recovery_tenure_mid') if active_months >= K('tenure_mid_months') else 0)
  - corrections_12m: >-
      COUNT('ostomy_billing', within_months=K('repeat_lookback_months'), date_field='posting_date', event_type='ostomy_balance_adjustment', adjustment_reason='billing_correction')
  - repeat_recovery: >-
      K('recovery_repeat_many') if corrections_12m >= 2 else (K('recovery_repeat_one') if corrections_12m == 1 else 0)
  - charge_age: >-
      DAYS(LATEST('ostomy_billing', 'posting_date', date_field='posting_date', event_type='ostomy_patient_charge', charge_type='expedited_shipping', ostomy_shipment_id=LATEST('ostomy_shipments',
      'ostomy_shipment_id', date_field='ship_date', shipping_method='expedited_no_charge')), NOW) if err_id != None else 0
  - age_recovery: >-
      K('recovery_age_step') * int(charge_age / K('age_days_mid')) if charge_age > K('age_days_long') else (K('recovery_age_step') if charge_age > K('age_days_mid') else 0)
  - nc_reason: >-
      LATEST('ostomy_shipments', 'replacement_reason', date_field='ship_date', shipping_method='expedited_no_charge')
  - reason_recovery: >-
      K('recovery_reason_lost') if (nc_reason == 'lost_in_transit' and nc_ship_id != None) else (K('recovery_reason_damaged') if (nc_reason == 'damaged_in_transit' and nc_ship_id !=
      None) else 0)
  - result: >-
      0 if (err_id == None or err_corrected > 0) else RND(err_amount + tenure_recovery + repeat_recovery + age_recovery + reason_recovery, 2)
  compute_basis:
    nc_ship_id: the program's most recent shipment sent with the shipping method expedited at no charge
    err_id: >-
      it is posted once, against that charge, with reason billing correction, and a program without such a charge owes no correction under this policy.
    err_amount: The correction is the whole charge, rounded to the cent.
    err_corrected: no billing correction has been posted against that charge
    active_months: A tenure part follows how long the program has been active
    tenure_recovery: >-
      A tenure part follows how long the program has been active: 36 months or more adds the long-tenure recovery, at least 12 but fewer than 36 months the mid-tenure recovery, fewer
      than 12 months nothing.
    corrections_12m: A repeat part follows the billing corrections already posted on the program in the last 12 months
    repeat_recovery: >-
      A repeat part follows the billing corrections already posted on the program in the last 12 months: two or more add the larger repeat recovery, exactly one adds the smaller repeat
      recovery, none adds nothing.
    charge_age: An age part follows the calendar days from the charge's posting date to today
    age_recovery: >-
      An age part follows the calendar days from the charge's posting date to today: more than 60 days adds the age recovery for every whole 30 days the charge has stood, more than 30
      and at most 60 days adds the age recovery once, 30 days or fewer nothing.
    result: >-
      Each service-recovery part set out below adds to the whole charge as that part states, before the correction is rounded to the cent.
    nc_reason: A reason part follows why Larkfield sent the shipment at no charge
    reason_recovery: >-
      A reason part follows why Larkfield sent the shipment at no charge: a replacement for a package lost in transit adds the larger reason recovery, a replacement for a package damaged
      in transit adds the smaller reason recovery, and any other no-charge shipment adds nothing.
  factors:
  - id: recovery_tenure
    effect: parameter
    decides: tenure_recovery
    bindings:
    - active_months
    - tenure_recovery
    ladder:
    - when: program active 36 months or more
      value: K('recovery_tenure_long')
    - when: active at least 12 but fewer than 36 months
      value: K('recovery_tenure_mid')
    - when: otherwise
      value: '0'
    baseline:
      tenure_recovery: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: recovery_repeat
    effect: parameter
    decides: repeat_recovery
    bindings:
    - corrections_12m
    - repeat_recovery
    ladder:
    - when: two or more billing corrections posted on the program in the last 12 months
      value: K('recovery_repeat_many')
    - when: exactly one
      value: K('recovery_repeat_one')
    - when: otherwise
      value: '0'
    baseline:
      repeat_recovery: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: recovery_age
    effect: method
    decides: age_recovery
    bindings:
    - charge_age
    - age_recovery
    ladder:
    - when: more than 60 calendar days from the charge's posting date to today
      method: add the age recovery for every whole 30 days the charge has stood
    - when: more than 30 and at most 60 days
      method: add the age recovery once
    - when: otherwise
      method: add nothing
    baseline:
      age_recovery: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: reship_reason
    effect: parameter
    decides: reason_recovery
    bindings:
    - nc_reason
    - reason_recovery
    ladder:
    - when: the no-charge shipment replaced a package lost in transit
      value: K('recovery_reason_lost')
    - when: it replaced a package damaged in transit
      value: K('recovery_reason_damaged')
    - when: otherwise
      value: '0'
    baseline:
      reason_recovery: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The correction is the whole charge, rounded to the cent.
    params: []
  inputs:
    history:
    - table: ostomy_billing
      aggregate: sum
      field: amount
      filters:
        event_type: ostomy_patient_charge
        charge_type: expedited_shipping
    - table: ostomy_billing
      aggregate: count
      field: ostomy_ledger_id
      within_months: 12
      filters:
        event_type: ostomy_balance_adjustment
        adjustment_reason: billing_correction
    cross_category: []
