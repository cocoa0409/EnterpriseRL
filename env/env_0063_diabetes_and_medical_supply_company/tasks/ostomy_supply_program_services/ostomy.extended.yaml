  computes: monthly_amount_usd
  target_tool: accept_payment_plan_7a7f8df9
  params:
    band_low_balance: 250.0
    band_mid_balance: 500.0
    band_low_months: 3
    band_mid_months: 5
    continence_owing_months: 2
    continence_clear_months: 1
