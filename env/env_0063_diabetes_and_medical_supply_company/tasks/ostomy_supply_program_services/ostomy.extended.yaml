    documented_cover_blocks: 12
    convex_allowance_standard: 20
    convex_allowance_hmo: 15
    convex_allowance_medicaid: 10
  rule: >-
    For a convex-barrier (A4407) refill this policy handles, and only for such a refill, a medical record with purpose over-limit justification backs the barriers above the allowance
    only while it is fewer than the tier's over-limit record months old in whole calendar months, and it backs at most twelve 30-day blocks of the order's excess instead of raising the
    allowance; for every other refill a quantity above the allowance is covered only when a medical record with purpose over_limit_justification, documenting the clinical reason, is
    dated no more than over_limit_record_months calendar months before the ship date, the allowance then becomes the quantity that record documents, and without it an above-allowance
    quantity ships only under ostomy_liability_notice at cash_price_by_item. For a convex-barrier (A4407) refill this policy handles, and only for such a refill, the supply days are
    set as this policy states; every other refill keeps the supply days of a shipment as the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that remain before
    the authorization's valid-through date when fewer remain. For a convex-barrier (A4407) refill this policy handles, and only for such a refill, the units are set as this policy states;
    for every other refill the units of each item are the tier's monthly_allowance_by_item for that item times the supply days divided by 30, or the written order's quantity when that
    is lower. Where the extra barriers rest on no over-limit record, they are fixed only after the records carry a liability notice for the convex barrier signed on or after the newest
    written order's date. For a convex-barrier (A4407) refill this policy handles, and only for such a refill, on tiers where refill_confirmation_required is true the refill ships only
    after the customer personally confirms to the representative, for this shipment and for the enrollment the representative names to them, that they are still using the item and how
    much supply they have on hand; every other refill on those tiers ships only after the customer personally confirms, for this shipment, that they are still using the item and how
    much supply they have on hand. On a program whose past-due amount has reached the hold minimum, a refill is not shipped until the posting named on the most recently received approved
    hardship application carries its hardship waiver adjustment. The refill draws on the authorization grant recorded on the newest written order for the convex barrier (the program's
    written order for A4407 with the latest order date); where more than one grant is recorded on that order, the one with the latest decision date. The standard units of the refill
    are the covered barriers less the barriers still on hand, never below zero. The covered barriers are the lower of the newest written order's quantity per 30 days and the tier's allowance,
    times the tier's standard supply days divided by 30. The barriers still on hand are the tier's allowance times the days left in the previous convex-barrier refill's supply divided
    by 30, rounded down to a whole barrier; the days left run from today to the end of that supply, which is counted from that refill's ship date and ends its supply days later, never
    below zero. The extra barriers are the order's excess per 30 days (its quantity per 30 days less the tier's allowance, never below zero) times the tier's standard supply days divided
    by 30, rounded down to a whole barrier. Each adjustment set out below changes the standard refill as that adjustment states; figures and quantities of the standard method that an
    adjustment replaces or multiplies are changed before the units are worked out, and the units are never below zero. The supply days of the refill replace the tier's standard supply
    days and follow the customer's other Larkfield deliveries and the authorization: a customer with an active continence program whose latest continence refill's supply ends at least
    30 days and fewer than the tier's standard supply days from today, on a grant valid at least the standard supply days from today, gets the whole 30-day blocks to the end of that
    continence supply, so both lines come due together; where the grant's valid-through date is fewer than the standard supply days from today and at least 30 days away, the supply is
    the whole 30-day blocks to the valid-through date; otherwise the supply is the tier's standard supply days. The previous refill's supply is counted, in place of its ship date, from
    when the barriers actually reached the customer: where a replacement for that refill was shipped because it was lost in transit, its supply is counted from the replacement's ship
    date; where no such replacement exists and the refill's proof of delivery is dated more than 5 days after its ship date, it is counted from the delivery date; otherwise it is counted
    from the refill's ship date; the supply ends that many supply days later. The on-hand rate replaces the tier's allowance in the barriers still on hand and is the rate at which the
    customer has been using barriers: where the previous convex-barrier refill shipped more units than the tier's allowance for its supply days, the rate is that refill's own units per
    30 days (its units divided by its supply days times 30); where it did not and the newest written order orders fewer per 30 days than the tier's allowance, the rate is the order's
    quantity per 30 days; otherwise the rate is the tier's allowance. The step-up share multiplies the order's excess per 30 days in the extra barriers after a written order raises the
    quantity: where the newest written order for the convex barrier was signed 60 days or fewer ago, the share is one half; more than 60 and at most 120 days ago, three quarters; otherwise
    the full share. The extra barriers are added to the standard units, never more than the extra cover available, which depends on what backs them: a medical record with purpose over-limit
    justification dated fewer than the tier's over-limit record months, counted in whole calendar months, before today covers twelve 30-day blocks of the order's excess; where no such
    record exists and the customer's most recent liability notice for the convex barrier was signed on or after the newest written order's date, the cover is the units that notice covers;
    otherwise there is no extra cover. The tier's allowance for the convex barrier is the billing units per 30 days that the tier's monthly allowance by item sets for A4407: 20 on the
    Self-Pay, Commercial PPO, Medicare Advantage and Original Medicare tiers, 15 on the Commercial HMO tier and 10 on the Medicaid tier. A program without a written order for the convex
    barrier gets no covered or extra barriers, and a program with no earlier convex-barrier refill has no barriers still on hand.
  cross_category:
  - category: continence
    as: history
    reads:
    - status
    - continence_shipments.ship_date
    - continence_shipments.supply_days
    note: >-
      the supply period is aligned to the end of the customer's latest continence refill supply when the customer holds an active continence program
  compute:
  - tier_allowance: >-
      K('convex_allowance_medicaid') if F('variant_name') == 'Ostomy Medicaid Program' else (K('convex_allowance_hmo') if F('variant_name') == 'Ostomy Commercial HMO Program' else K('convex_allowance_standard'))
  - newest_order_id: >-
      LATEST('ostomy_orders', 'ostomy_order_id', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407')
  - grant_id: >-
      LATEST('ostomy_orders', 'ostomy_order_id', date_field='decision_date', event_type='ostomy_authorization_grant', item_code='A4407', related_ostomy_order_id=newest_order_id)
  - grant_through: >-
      LATEST('ostomy_orders', 'valid_through', date_field='decision_date', event_type='ostomy_authorization_grant', item_code='A4407', related_ostomy_order_id=newest_order_id)
  - order_qty: >-
      LATEST('ostomy_orders', 'quantity_per_30_days', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407') if LATEST('ostomy_orders', 'quantity_per_30_days',
      date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407') != None else 0
  - order_signed: >-
      LATEST('ostomy_orders', 'order_date', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407')
  - std_days: P('supply_days_per_shipment')
  - prev_id: >-
      LATEST('ostomy_shipments', 'ostomy_shipment_id', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407')
  - prev_ship: >-
      LATEST('ostomy_shipments', 'ship_date', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407')
  - prev_units: >-
      LATEST('ostomy_shipments', 'units', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') if LATEST('ostomy_shipments', 'units', date_field='ship_date',
      event_type='ostomy_refill_shipment', item_code='A4407') != None else 0
  - prev_days: >-
      LATEST('ostomy_shipments', 'supply_days', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') if LATEST('ostomy_shipments', 'supply_days', date_field='ship_date',
      event_type='ostomy_refill_shipment', item_code='A4407') != None else 0
  - excess_per30: MX(0, order_qty - tier_allowance)
  - cont_active: EXISTS('continence', status='active')
  - cont_last: >-
      XLATEST('continence', 'continence_shipments', 'ship_date', date_field='ship_date', event_type='continence_refill_shipment')
  - cont_days: >-
      XLATEST('continence', 'continence_shipments', 'supply_days', date_field='ship_date', event_type='continence_refill_shipment')
  - cont_left: DAYS(NOW, cont_last) + cont_days if cont_last != None else 0
  - grant_left: DAYS(NOW, grant_through) if grant_through != None else 0
  - supply_days: >-
      int(cont_left / K('block_days')) * K('block_days') if (cont_active and cont_left >= K('block_days') and cont_left < std_days and grant_left >= std_days) else (int(grant_left /
      K('block_days')) * K('block_days') if (grant_left < std_days and grant_left >= K('block_days')) else std_days)
  - lost_repl_ship: >-
      LATEST('ostomy_shipments', 'ship_date', date_field='ship_date', event_type='ostomy_replacement_shipment', replacement_reason='lost_in_transit', original_ostomy_shipment_id=prev_id)
  - prev_pod: >-
      LATEST('ostomy_shipments', 'delivery_date', date_field='delivery_date', event_type='ostomy_delivery_confirmation', original_ostomy_shipment_id=prev_id)
  - supply_anchor: >-
      NOW if prev_ship == None else (lost_repl_ship if lost_repl_ship != None else (prev_pod if (prev_pod != None and DAYS(prev_ship, prev_pod) > K('late_delivery_days')) else prev_ship))
  - prev_rate_units: >-
      SUM('ostomy_shipments', 'units', event_type='ostomy_refill_shipment', ostomy_shipment_id=LATEST('ostomy_shipments', 'ostomy_shipment_id', date_field='ship_date', event_type='ostomy_refill_shipment',
      item_code='A4407'))
  - prev_rate_days: >-
      LATEST('ostomy_shipments', 'supply_days', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') if LATEST('ostomy_shipments', 'supply_days', date_field='ship_date',
      event_type='ostomy_refill_shipment', item_code='A4407') != None else 0
  - on_hand_rate: >-
      prev_rate_units / prev_rate_days * K('block_days') if (prev_rate_days > 0 and prev_rate_units > tier_allowance * prev_rate_days / K('block_days')) else (order_qty if (order_qty
      < tier_allowance and prev_rate_days > 0) else tier_allowance)
  - order_age_days: >-
      DAYS(LATEST('ostomy_orders', 'order_date', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407'), NOW) if order_signed != None else 999
  - step_share: >-
      K('step_half') if order_age_days <= K('step_half_days') else (K('step_three_quarter') if order_age_days <= K('step_three_quarter_days') else K('step_full'))
  - record_months: >-
      MONTHS(LATEST('ostomy_orders', 'visit_date', date_field='visit_date', event_type='ostomy_medical_record_receipt', record_purpose='over_limit_justification'), NOW) if LATEST('ostomy_orders',
      'visit_date', date_field='visit_date', event_type='ostomy_medical_record_receipt', record_purpose='over_limit_justification') != None else 999
  - notice_units: >-
      LATEST('ostomy_orders', 'notice_units', date_field='notice_date', event_type='ostomy_liability_notice_signed', item_code='A4407')
  - notice_signed: >-
      LATEST('ostomy_orders', 'notice_date', date_field='notice_date', event_type='ostomy_liability_notice_signed', item_code='A4407')
  - extra_cover: >-
      MX(0, order_qty - tier_allowance) * K('documented_cover_blocks') if record_months < P('over_limit_record_months') else (notice_units if (notice_signed != None and order_signed
      != None and DAYS(order_signed, notice_signed) >= 0) else 0)
  - covered_barriers: MN(order_qty, tier_allowance) * supply_days / K('block_days')
  - extra_barriers: MN(extra_cover, int(excess_per30 * step_share * supply_days / K('block_days')))
  - days_left: MX(0, DAYS(NOW, supply_anchor) + prev_days)
  - on_hand_barriers: int(on_hand_rate * days_left / K('block_days'))
  - result: int(MX(0, covered_barriers + extra_barriers - on_hand_barriers))
  compute_basis:
    tier_allowance: >-
      The tier's allowance for the convex barrier is the billing units per 30 days that the tier's monthly allowance by item sets for A4407: 20 on the Self-Pay, Commercial PPO, Medicare
      Advantage and Original Medicare tiers, 15 on the Commercial HMO tier and 10 on the Medicaid tier.
    grant_id: >-
      The refill draws on the authorization grant recorded on the newest written order for the convex barrier (the program's written order for A4407 with the latest order date); where
      more than one grant is recorded on that order, the one with the latest decision date.
    grant_through: >-
      where the grant's valid-through date is fewer than the standard supply days from today and at least 30 days away
    order_qty: >-
      A program without a written order for the convex barrier gets no covered or extra barriers, and a program with no earlier convex-barrier refill has no barriers still on hand.
    order_signed: >-
      the customer's most recent liability notice for the convex barrier was signed on or after the newest written order's date
    std_days: times the tier's standard supply days divided by 30
    prev_id: >-
      The barriers still on hand are the tier's allowance times the days left in the previous convex-barrier refill's supply divided by 30, rounded down to a whole barrier
    prev_ship: which is counted from that refill's ship date
    prev_units: >-
      The barriers still on hand are the tier's allowance times the days left in the previous convex-barrier refill's supply divided by 30, rounded down to a whole barrier
    prev_days: >-
      the days left run from today to the end of that supply, which is counted from that refill's ship date and ends its supply days later, never below zero.
    excess_per30: >-
      the order's excess per 30 days (its quantity per 30 days less the tier's allowance, never below zero)
    cont_active: >-
      a customer with an active continence program whose latest continence refill's supply ends at least 30 days and fewer than the tier's standard supply days from today
    cont_last: >-
      whose latest continence refill's supply ends at least 30 days and fewer than the tier's standard supply days from today
    cont_days: >-
      whose latest continence refill's supply ends at least 30 days and fewer than the tier's standard supply days from today
    cont_left: >-
      whose latest continence refill's supply ends at least 30 days and fewer than the tier's standard supply days from today
    grant_left: on a grant valid at least the standard supply days from today
    supply_days: >-
      The supply days of the refill replace the tier's standard supply days and follow the customer's other Larkfield deliveries and the authorization: a customer with an active continence
      program whose latest continence refill's supply ends at least 30 days and fewer than the tier's standard supply days from today, on a grant valid at least the standard supply days
      from today, gets the whole 30-day blocks to the end of that continence supply, so both lines come due together; where the grant's valid-through date is fewer than the standard
      supply days from today and at least 30 days away, the supply is the whole 30-day blocks to the valid-through date; otherwise the supply is the tier's standard supply days.
    lost_repl_ship: >-
      where a replacement for that refill was shipped because it was lost in transit, its supply is counted from the replacement's ship date
    prev_pod: >-
      where no such replacement exists and the refill's proof of delivery is dated more than 5 days after its ship date, it is counted from the delivery date
    supply_anchor: >-
      The previous refill's supply is counted, in place of its ship date, from when the barriers actually reached the customer: where a replacement for that refill was shipped because
      it was lost in transit, its supply is counted from the replacement's ship date; where no such replacement exists and the refill's proof of delivery is dated more than 5 days after
      its ship date, it is counted from the delivery date; otherwise it is counted from the refill's ship date; the supply ends that many supply days later.
    prev_rate_units: the rate is that refill's own units per 30 days (its units divided by its supply days times 30)
    prev_rate_days: the rate is that refill's own units per 30 days (its units divided by its supply days times 30)
    on_hand_rate: >-
      The on-hand rate replaces the tier's allowance in the barriers still on hand and is the rate at which the customer has been using barriers: where the previous convex-barrier refill
      shipped more units than the tier's allowance for its supply days, the rate is that refill's own units per 30 days (its units divided by its supply days times 30); where it did
      not and the newest written order orders fewer per 30 days than the tier's allowance, the rate is the order's quantity per 30 days; otherwise the rate is the tier's allowance.
    order_age_days: where the newest written order for the convex barrier was signed 60 days or fewer ago
    step_share: >-
      The step-up share multiplies the order's excess per 30 days in the extra barriers after a written order raises the quantity: where the newest written order for the convex barrier
      was signed 60 days or fewer ago, the share is one half; more than 60 and at most 120 days ago, three quarters; otherwise the full share.
    record_months: >-
      a medical record with purpose over-limit justification dated fewer than the tier's over-limit record months, counted in whole calendar months, before today covers twelve 30-day
      blocks of the order's excess
    notice_units: the cover is the units that notice covers
    notice_signed: >-
      the customer's most recent liability notice for the convex barrier was signed on or after the newest written order's date
    extra_cover: >-
      The extra barriers are added to the standard units, never more than the extra cover available, which depends on what backs them: a medical record with purpose over-limit justification
      dated fewer than the tier's over-limit record months, counted in whole calendar months, before today covers twelve 30-day blocks of the order's excess; where no such record exists
      and the customer's most recent liability notice for the convex barrier was signed on or after the newest written order's date, the cover is the units that notice covers; otherwise
      there is no extra cover.
    covered_barriers: >-
      The covered barriers are the lower of the newest written order's quantity per 30 days and the tier's allowance, times the tier's standard supply days divided by 30.
    extra_barriers: >-
      The extra barriers are the order's excess per 30 days (its quantity per 30 days less the tier's allowance, never below zero) times the tier's standard supply days divided by 30,
      rounded down to a whole barrier.
    days_left: >-
      the days left run from today to the end of that supply, which is counted from that refill's ship date and ends its supply days later, never below zero.
    on_hand_barriers: >-
      The barriers still on hand are the tier's allowance times the days left in the previous convex-barrier refill's supply divided by 30, rounded down to a whole barrier
    result: >-
      Each adjustment set out below changes the standard refill as that adjustment states; figures and quantities of the standard method that an adjustment replaces or multiplies are
      changed before the units are worked out, and the units are never below zero.
    newest_order_id: >-
      The refill draws on the authorization grant recorded on the newest written order for the convex barrier (the program's written order for A4407 with the latest order date); where
      more than one grant is recorded on that order, the one with the latest decision date.
  prerequisite:
  - problem: ostomy_ext_notice_units
    kind: value_input
    gate: extra_cover
    form: state
    policy_source: >-
      Where the extra barriers rest on no over-limit record, they are fixed only after the records carry a liability notice for the convex barrier signed on or after the newest written
      order's date.
    condition: >-
      An ostomy_orders row with event_type ostomy_liability_notice_signed and item_code A4407 whose notice_date is on or after the order_date of the newest A4407 ostomy_order_receipt
      exists for the program.
    resolved_by: sign_liability_notice_87444016
    effect: >-
      extra_cover changes from 0 to the notice's notice_units, so the extra barriers rise from 0 to the stepped excess for the supply.
  - problem: ostomy_ext_hardship_waiver
    kind: state_gate
    gate: ostomy_billing.adjustment_reason
    form: state
    policy_source: >-
      On a program whose past-due amount has reached the hold minimum, a refill is not shipped until the posting named on the most recently received approved hardship application carries
      its hardship waiver adjustment.
    condition: >-
      The ostomy_billing posting named by the most recently received ostomy_requests row with request_type hardship_application and request_status approved carries an ostomy_balance_adjustment
      with adjustment_reason hardship_waiver.
    resolved_by: post_hardship_waiver_31941945
    effect: The named posting carries its hardship waiver, so the refill held for the past-due amount may ship.
  factors:
  - id: supply_alignment
    effect: method
    decides: supply_days
    bindings:
    - cont_active
    - cont_last
    - cont_days
    - cont_left
    - grant_left
    - supply_days
    ladder:
    - when: >-
        an active continence program whose latest refill's supply ends at least 30 and fewer than the standard supply days from today, on a grant valid at least the standard supply days
      method: whole 30-day blocks to the end of that continence supply
    - when: the grant's valid-through date fewer than the standard supply days and at least 30 days away
      method: whole 30-day blocks to the grant's valid-through date
    - when: otherwise
      method: the tier's standard supply days
    baseline:
      supply_days: std_days
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: continence
  - id: supply_start
    effect: method
    decides: supply_anchor
    bindings:
    - lost_repl_ship
    - prev_pod
    - supply_anchor
    ladder:
    - when: a replacement for the previous refill was shipped because it was lost in transit
      method: count the previous supply from the replacement's ship date
    - when: >-
        no such replacement, and the previous refill's proof of delivery is dated more than 5 days after its ship date
      method: count the previous supply from the delivery date
    - when: otherwise
      method: count the previous supply from the refill's ship date
    baseline:
      supply_anchor: prev_ship
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: usage_pace
    effect: parameter
    decides: on_hand_rate
    bindings:
    - prev_rate_units
    - prev_rate_days
    - on_hand_rate
    ladder:
    - when: the previous convex-barrier refill shipped more units than the tier's allowance for its supply days
      value: that refill's own units per 30 days
    - when: it did not, and the newest written order orders fewer per 30 days than the allowance
      value: the order's quantity per 30 days
    - when: otherwise
      value: tier_allowance
    baseline:
      on_hand_rate: tier_allowance
    evidence:
    - history
    cross_difficulty: null
  - id: step_up
    effect: parameter
    decides: step_share
    bindings:
    - order_age_days
    - step_share
    ladder:
    - when: newest written order for the convex barrier signed 60 days or fewer ago
      value: K('step_half')
    - when: signed more than 60 and at most 120 days ago
      value: K('step_three_quarter')
    - when: otherwise
      value: K('step_full')
    baseline:
      step_share: K('step_full')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: extra_backing
    effect: parameter
    decides: extra_cover
    bindings:
    - record_months
    - notice_units
    - notice_signed
    - extra_cover
    ladder:
    - when: >-
        a medical record with purpose over-limit justification dated fewer than the tier's over-limit record months, counted in whole calendar months, before today
      value: twelve 30-day blocks of the order's excess
    - when: >-
        no such record, and the most recent liability notice for the convex barrier signed on or after the newest written order's date
      value: the units that notice covers
    - when: otherwise
      value: '0'
    baseline:
      extra_cover: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The refill draws on the authorization grant recorded on the newest written order for the convex barrier (the program's written order for A4407 with the latest order date); where
      more than one grant is recorded on that order, the one with the latest decision date. The standard units of the refill are the covered barriers less the barriers still on hand,
      never below zero. The covered barriers are the lower of the newest written order's quantity per 30 days and the tier's allowance, times the tier's standard supply days divided
      by 30. The barriers still on hand are the tier's allowance times the days left in the previous convex-barrier refill's supply divided by 30, rounded down to a whole barrier; the
      days left run from today to the end of that supply, which is counted from that refill's ship date and ends its supply days later, never below zero. The extra barriers are the order's
      excess per 30 days (its quantity per 30 days less the tier's allowance, never below zero) times the tier's standard supply days divided by 30, rounded down to a whole barrier.
    params:
    - monthly_allowance_by_item
    - step_full
    - supply_days_per_shipment
  inputs:
    history:
    - table: ostomy_shipments
      aggregate: latest
      field: units
      filters:
        event_type: ostomy_refill_shipment
        item_code: A4407
    - table: ostomy_shipments
      aggregate: latest
      field: delivery_date
      filters:
        event_type: ostomy_delivery_confirmation
    - table: ostomy_orders
      aggregate: latest
      field: notice_units
      filters:
        event_type: ostomy_liability_notice_signed
        item_code: A4407
    - table: ostomy_orders
      aggregate: latest
      field: quantity_per_30_days
      filters:
        event_type: ostomy_order_receipt
        item_code: A4407
    - category: continence
      table: continence_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: continence_refill_shipment
    cross_category:
    - continence
- id: ostomy_ext_notice_units
  base_policy_refs:
