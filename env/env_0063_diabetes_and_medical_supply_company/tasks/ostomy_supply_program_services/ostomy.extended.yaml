  overwrite:
  - base_policy: ostomy_evt_refill_shipment
    superseded_clause: >-
      the supply days of a shipment are the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that remain before the authorization's valid-through date when fewer
      remain
    replaced_by: >-
      For a convex-barrier (A4407) refill this policy handles, and only for such a refill, the supply days are set as this policy states; every other refill keeps the supply days of
      a shipment as the tier's supply_days_per_shipment, shortened to the whole 30-day blocks that remain before the authorization's valid-through date when fewer remain.
  - base_policy: ostomy_evt_quantity_limits
    superseded_clause: >-
      The units of each item are the tier's monthly_allowance_by_item for that item times the supply days divided by 30, or the written order's quantity when that is lower.
    replaced_by: >-
      For a convex-barrier (A4407) refill this policy handles, and only for such a refill, the units are set as this policy states; for every other refill the units of each item are
      the tier's monthly_allowance_by_item for that item times the supply days divided by 30, or the written order's quantity when that is lower.
  - base_policy: ostomy_evt_refill_shipment
    superseded_clause: >-
      On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms, for this shipment, that they are still using the item and how
      much supply they have on hand
    replaced_by: >-
      For a convex-barrier (A4407) refill this policy handles, and only for such a refill, on tiers where refill_confirmation_required is true the refill ships only after the customer
      personally confirms to the representative, for this shipment and for the enrollment the representative names to them, that they are still using the item and how much supply they
      have on hand; every other refill on those tiers ships only after the customer personally confirms, for this shipment, that they are still using the item and how much supply they
      have on hand.
  - base_policy: ostomy_evt_quantity_limits
    superseded_clause: >-
      A quantity above the allowance is covered only when a medical record with purpose over_limit_justification, documenting the clinical reason, is dated no more than over_limit_record_months
      calendar months before the ship date; the allowance then becomes the quantity that record documents, and without it an above-allowance quantity ships only under ostomy_liability_notice
      at cash_price_by_item.
    replaced_by: >-
      For a convex-barrier (A4407) refill this policy handles, and only for such a refill, a medical record with purpose over-limit justification backs the barriers above the allowance
      only while it is fewer than the tier's over-limit record months old in whole calendar months, and it backs at most twelve 30-day blocks of the order's excess instead of raising
      the allowance; for every other refill a quantity above the allowance is covered only when a medical record with purpose over_limit_justification, documenting the clinical reason,
      is dated no more than over_limit_record_months calendar months before the ship date, the allowance then becomes the quantity that record documents, and without it an above-allowance
      quantity ships only under ostomy_liability_notice at cash_price_by_item.
