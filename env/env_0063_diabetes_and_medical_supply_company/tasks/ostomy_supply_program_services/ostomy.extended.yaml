- id: ostomy_evt_refill_shipment
  subject: [ostomy_refill_shipment]
  rule: >-
    A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
    or closed receives no refill. Each refill draws on one authorization grant of the program, recorded on the shipment,
    and the ship date must be on or before the valid-through date on the authorization being drawn. The units shipped
    may not exceed the program's authorized units remaining, and the supply days of a shipment are the tier's supply_days_per_shipment,
    shortened to the whole 30-day blocks that remain before the authorization's valid-through date when fewer remain;
    the units and pieces follow from the supply days under ostomy_evt_quantity_limits. On tiers where refill_confirmation_required
    is true, the refill ships only after the customer personally confirms, for this shipment, that they are still
    using the item and how much supply they have on hand; the confirmation date is recorded on the shipment, Larkfield
    never ships those tiers automatically, and Larkfield's own refill reminder for those tiers is made no sooner
    than refill_contact_lead_days calendar days before the planned ship date. On the self-pay tier refills ship
    on the subscription schedule without a per-shipment confirmation. The next refill of the same item ships no
    earlier than refill_ship_lead_days calendar days before the end of the supply of the previous refill shipment
    of that item, counted in calendar days: the previous refill's ship date plus its supply days gives the end of
    its supply, the earliest permitted ship date is refill_ship_lead_days calendar days before that end date, and
    shipping on that earliest date is allowed. A replacement shipment never counts as the previous refill. The coverage
    record the program bills must have been verified with the payer within coverage_reverification_months calendar
    months before the ship date, as shown by the coverage record's last verified date; the self-pay tier has no
    coverage to verify. Standard ground shipping is free on insured tiers; on the self-pay tier standard shipping
    costs standard_shipping_fee_usd, posted as a patient charge, unless the shipment's cash-price total reaches
    free_shipping_threshold_usd. Expedited shipping is provided on the customer's request for expedited_shipping_fee_usd,
    posted as a patient charge because no payer covers delivery speed, and is recorded as expedited_no_charge when
    the expedite only makes up for a delay Larkfield caused. A refill on a payer tier is billed to the payer by
    claim with the ship date as the date of service; a refill on the self-pay tier is charged to the customer at
    the Larkfield cash price. On tiers where inpatient_hold_required is true, nothing ships while the customer is
    an inpatient in a hospital or skilled nursing facility; the program is held under ostomy_holds_and_closure.
  eligibility:
  - id: program_active
    applies_to: [ostomy_refill_shipment]
    kind: state
    condition: >-
      A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
      or closed receives no refill.
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
    state_contract:
      field: ostomy_programs.status
      allowed: [active]
  - id: authorization_valid_on_ship_date
    applies_to: [ostomy_refill_shipment]
    kind: authorization
    condition: the ship date must be on or before the valid-through date on the authorization being drawn.
    evidence_fields: [ostomy_orders.ostomy_order_id, ostomy_orders.event_type, ostomy_orders.valid_from, ostomy_orders.valid_through]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_orders.ostomy_order_id]
      action_bindings: {ostomy_orders.ostomy_order_id: ostomy_order_id}
  - id: units_within_authorization
    applies_to: [ostomy_refill_shipment]
    kind: authorization
    condition: The units shipped may not exceed the program's authorized units remaining
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.authorized_units_remaining]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
  - id: customer_confirmation
    applies_to: [ostomy_refill_shipment]
    kind: caller_fact
    condition: >-
      On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms,
      for this shipment, that they are still using the item and how much supply they have on hand
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
  - id: refill_not_too_early
    applies_to: [ostomy_refill_shipment]
    kind: time
    condition: >-
      The next refill of the same item ships no earlier than refill_ship_lead_days calendar days before the end
      of the supply of the previous refill shipment of that item
    evidence_fields: [ostomy_shipments.ostomy_shipment_id, ostomy_shipments.ship_date, ostomy_shipments.supply_days,
      ostomy_shipments.item_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.ostomy_shipment_id]
      action_bindings: {ostomy_shipments.ostomy_shipment_id: previous_ostomy_shipment_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the end of the supply of the previous refill shipment of that item
      anchor_source: ostomy_shipments.ship_date
      relation: not_before
      duration_source: variants.refill_ship_lead_days
      unit: calendar_days
      counting_rule: >-
        the previous refill's ship date plus its supply days gives the end of its supply, the earliest permitted
        ship date is refill_ship_lead_days calendar days before that end date, and shipping on that earliest date
        is allowed.
      boundary: inclusive
  - id: coverage_recently_verified
    applies_to: [ostomy_refill_shipment]
    kind: time
    condition: >-
      The coverage record the program bills must have been verified with the payer within coverage_reverification_months
      calendar months before the ship date, as shown by the coverage record's last verified date
    evidence_fields: [coverages.coverage_id, coverages.last_verified_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [coverages.coverage_id]
      action_bindings: {coverages.coverage_id: coverage_id}
    temporal_basis: {clock: frozen_time, anchor_event: the coverage record's last verified date, anchor_source: coverages.last_verified_date,
      relation: not_after, duration_source: variants.coverage_reverification_months, unit: calendar_months, counting_rule: within
        coverage_reverification_months calendar months before the ship date, boundary: inclusive}
  params:
    per_tier:
      Ostomy Self-Pay Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Ostomy Commercial HMO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Ostomy Commercial PPO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Ostomy Medicare Advantage Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Ostomy Original Medicare Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Ostomy Medicaid Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
  formula: {earliest_ship_date_offset_days: supply_days - refill_ship_lead_days}
- id: ostomy_evt_replacement_and_delivery
  subject: [ostomy_replacement_shipment, ostomy_delivery_confirmation]
  rule: >-
    A replacement ships at no charge, draws no authorized units and is never billed to a payer; it is recorded against
    the original shipment it replaces, and its quantity never exceeds the units of that original shipment that were
    lost, damaged, not received or defective. A package is lost in transit when no proof of delivery is on file
    for it and carrier_trace_business_days business days (Monday to Friday, excluding US federal holidays) have
    passed after the carrier's expected delivery date; a package lost in transit is always replaced, expedited at
    no charge, and does not count toward any courtesy limit, because Larkfield bears the risk until delivery. A
    package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
    calendar days after the delivery date on the proof of delivery for that package, counted in calendar days from
    that delivery date with the last day allowed; a later damage report is not replaced. A package the proof of
    delivery shows as delivered but the customer reports not received is replaced as a courtesy only while the program's
    courtesy reships over the rolling 12 months ending on the reship date, counted by ostomy_msr_courtesy_reships_12m,
    are fewer than courtesy_reships_per_12_months; beyond that the customer may buy the item at the cash price or
    wait for the next eligible refill. Larkfield replaces as product_defect a box that was defective as shipped
    - the wrong size or cut, the wrong system, a broken seal or a recalled lot - reported no later than defect_report_days
    calendar days after the delivery date. A product the customer finds does not fit or leaks is not a defect: it
    is a product change, handled by a new written order and, if the customer wants to try alternatives, samples
    under ostomy_samples. A proof of delivery is recorded as received from the carrier, with a signature where the
    tier or item requires signature_required_on_delivery, and it fixes the delivery date that return, damage and
    warranty windows count from; a package without a proof of delivery has no delivery date.
  eligibility:
  - id: damage_report_window
    applies_to: [ostomy_replacement_shipment]
    kind: time
    condition: >-
      A package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
      calendar days after the delivery date on the proof of delivery for that package
    evidence_fields: [ostomy_shipments.original_ostomy_shipment_id, ostomy_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.original_ostomy_shipment_id]
      action_bindings: {ostomy_shipments.original_ostomy_shipment_id: original_ostomy_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that package,
      anchor_source: ostomy_shipments.delivery_date, relation: not_after, duration_source: variants.damage_report_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: courtesy_limit
    applies_to: [ostomy_replacement_shipment]
    kind: dedup
    condition: >-
      A package the proof of delivery shows as delivered but the customer reports not received is replaced as a
      courtesy only while the program's courtesy reships over the rolling 12 months ending on the reship date, counted
      by ostomy_msr_courtesy_reships_12m, are fewer than courtesy_reships_per_12_months
    evidence_fields: [ostomy_shipments.ostomy_program_id, ostomy_shipments.replacement_reason, ostomy_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.ostomy_program_id]
      action_bindings: {ostomy_shipments.ostomy_program_id: ostomy_program_id}
    dedup_contract:
      table: ostomy_shipments
      mode: separate_record
      object_bindings: {ostomy_program_id: ostomy_program_id}
      duplicate_filters:
        replacement_reason: [delivered_not_received]
      distinct_fields: [ship_date]
  params:
    per_tier:
      Ostomy Self-Pay Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Ostomy Commercial HMO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Ostomy Commercial PPO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Ostomy Medicare Advantage Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Ostomy Original Medicare Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Ostomy Medicaid Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
  measures: [ostomy_msr_courtesy_reships_12m]
- id: ostomy_evt_returns
  subject: [ostomy_return_authorization, ostomy_return_receipt]
  rule: >-
    Larkfield accepts a return only of items that are unopened and in their original sealed packaging; opened medical
    supplies are never returned to stock or credited on any tier where opened_returnable is false, because a supply
    that has left Larkfield's control cannot be re-dispensed to another patient. A return is authorized only when
    the customer asks for it no later than return_window_days calendar days after the delivery date on the proof
    of delivery for that shipment, counted in calendar days from that delivery date with the last day allowed; a
    shipment without a proof of delivery cannot be returned, and a package damaged in transit is handled as a replacement,
    not a return. The units authorized for return never exceed the units of that shipment, less any units of it
    already authorized for return. When the warehouse accepts the returned units as unopened_sealed, the units are
    credited back to the authorization they were drawn from; a payer-billed shipment is then re-billed by a void
    claim (all units returned) or a corrected claim (some units returned), and a self-pay shipment is credited to
    the customer's balance at the price paid for the returned units less restocking_fee_pct percent. Returned units
    the warehouse finds opened are not accepted and no receipt is recorded. A box of barriers or pouches opened
    to check the size or cut is opened and is not returnable.
  eligibility:
  - id: return_window
    applies_to: [ostomy_return_authorization]
    kind: time
    condition: >-
      A return is authorized only when the customer asks for it no later than return_window_days calendar days after
      the delivery date on the proof of delivery for that shipment
    evidence_fields: [ostomy_shipments.original_ostomy_shipment_id, ostomy_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.original_ostomy_shipment_id]
      action_bindings: {ostomy_shipments.original_ostomy_shipment_id: original_ostomy_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that shipment,
      anchor_source: ostomy_shipments.delivery_date, relation: not_after, duration_source: variants.return_window_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: unopened_only
    applies_to: [ostomy_return_authorization]
    kind: caller_fact
    condition: Larkfield accepts a return only of items that are unopened and in their original sealed packaging
    evidence_fields: [ostomy_shipments.ostomy_shipment_id, ostomy_shipments.item_code]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.ostomy_shipment_id]
      action_bindings: {ostomy_shipments.ostomy_shipment_id: original_ostomy_shipment_id}
  - id: no_double_return
    applies_to: [ostomy_return_authorization]
    kind: dedup
    condition: >-
      The units authorized for return never exceed the units of that shipment, less any units of it already authorized
      for return.
    evidence_fields: [ostomy_shipments.original_ostomy_shipment_id, ostomy_shipments.event_type, ostomy_shipments.units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.original_ostomy_shipment_id]
      action_bindings: {ostomy_shipments.original_ostomy_shipment_id: original_ostomy_shipment_id}
    dedup_contract:
      table: ostomy_shipments
      mode: separate_record
      object_bindings: {original_ostomy_shipment_id: original_ostomy_shipment_id, item_code: item_code}
      duplicate_filters:
        event_type: [ostomy_return_authorization]
      distinct_fields: [rma_issue_date]
  params:
    per_tier:
      Ostomy Self-Pay Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Ostomy Commercial HMO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Ostomy Commercial PPO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Ostomy Medicare Advantage Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Ostomy Original Medicare Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Ostomy Medicaid Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
- id: ostomy_evt_claims
  subject: [ostomy_claim_submission, ostomy_claim_adjudication]
  rule: >-
    Every refill shipped on a payer tier is billed to the payer named by the program's coverage record by one original
    claim per shipment, with the ship date as the date of service; the self-pay tier files no claims. An original
    claim must be transmitted no later than timely_filing_days calendar days after the date of service of the shipment
    it bills, counted in calendar days from that ship date with the last day allowed; a shipment whose filing limit
    has passed is billed to neither the payer nor the customer and is written off by Larkfield. A corrected claim
    replaces an original claim when the units, item or dates billed were wrong or some of the units were returned,
    and a void claim withdraws an original claim when all of its units were returned; both reference the same shipment
    as the original. When a remittance posts, the patient responsibility added to the customer's balance is the
    allowed amount less the amount the payer paid, which the remittance itemizes as deductible, coinsurance and
    copay; Larkfield never posts more than that and never bills the customer the difference between its billed charge
    and the allowed amount on a payer tier. On tiers where crossover_to_secondary is true and the customer has an
    in-effect secondary coverage record, the patient responsibility is crossed over to the secondary payer, and
    the secondary payer's payment is posted as a balance adjustment with reason secondary_payer_payment against
    that remittance before any amount is statemented; on other tiers a secondary coverage is billed by Larkfield's
    billing team only after the primary remittance posts. On the Medicaid tier a customer is never billed for a
    Medicaid-covered item beyond the patient responsibility the Medicaid remittance shows.
  eligibility:
  - id: timely_filing
    applies_to: [ostomy_claim_submission]
    kind: time
    condition: >-
      An original claim must be transmitted no later than timely_filing_days calendar days after the date of service
      of the shipment it bills
    evidence_fields: [ostomy_shipments.ostomy_shipment_id, ostomy_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.ostomy_shipment_id]
      action_bindings: {ostomy_shipments.ostomy_shipment_id: ostomy_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the date of service of the shipment it bills, anchor_source: ostomy_shipments.ship_date,
      relation: not_after, duration_source: variants.timely_filing_days, unit: calendar_days, counting_rule: counted
        in calendar days from that ship date with the last day allowed, boundary: inclusive}
  params:
    per_tier:
      Ostomy Self-Pay Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct, copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd,
        deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Ostomy Commercial HMO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Ostomy Commercial PPO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Ostomy Medicare Advantage Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Ostomy Original Medicare Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Ostomy Medicaid Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct, copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd,
        deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
  formula: {amount: allowed_amount - payer_paid_amount}
- id: ostomy_evt_denials_and_appeals
  subject: [ostomy_claim_denial, ostomy_appeal_filing]
  rule: >-
    A denial is worked by its denial code, and the code alone decides the route; the self-pay tier has no denials
    or appeals. CO-16 (claim lacks information) is unprocessable and is never appealed: it is cured only by a corrected
    claim transmitted no later than corrected_claim_window_days calendar days after the denial's posting date. CO-50
    (not medically necessary), CO-151 (frequency or quantity not supported) and CO-197 (authorization absent) are
    appealable. A first-level appeal may be filed no later than appeal_window_days calendar days after the posting
    date of the denial it appeals, counted in calendar days from that posting date with the last day allowed; a
    CO-197 denial is appealed only when an authorization grant valid on the date of service is on file, and a CO-151
    denial only when a medical record supporting the quantity, dated on or before the date of service, is on file;
    otherwise the denial is not appealed and is handled as a non-covered amount under ostomy_liability_notice. An
    appeal decision that upholds the denial posts as a new denial whose original posting is the appeal filing. A
    second-level appeal may be filed only against such an upheld first-level decision, no later than second_level_appeal_window_days
    calendar days after its posting date; where second_level_appeal_window_days is 0 there is no customer-filed
    second level on the tier, and on the Medicare Advantage tier the plan forwards an upheld denial to the independent
    review entity itself. One appeal is filed per level per denial; a denial already appealed at a level is not
    appealed again at that level. CO-29 (timely filing expired) is never appealed and never billed to the customer;
    Larkfield writes it off with a billing_correction adjustment. PR-204 (not covered under the plan) becomes the
    customer's responsibility only under ostomy_liability_notice; otherwise Larkfield absorbs it.
  eligibility:
  - id: appeal_window
    applies_to: [ostomy_appeal_filing]
    kind: time
    condition: >-
      A first-level appeal may be filed no later than appeal_window_days calendar days after the posting date of
      the denial it appeals
    evidence_fields: [ostomy_billing.ostomy_ledger_id, ostomy_billing.posting_date, ostomy_billing.denial_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_billing.ostomy_ledger_id]
      action_bindings: {ostomy_billing.ostomy_ledger_id: original_ostomy_ledger_id}
    temporal_basis: {clock: frozen_time, anchor_event: the posting date of the denial it appeals, anchor_source: ostomy_billing.posting_date,
      relation: not_after, duration_source: variants.appeal_window_days, unit: calendar_days, counting_rule: counted
        in calendar days from that posting date with the last day allowed, boundary: inclusive}
  - id: one_appeal_per_level
    applies_to: [ostomy_appeal_filing]
    kind: dedup
    condition: One appeal is filed per level per denial; a denial already appealed at a level is not appealed again
      at that level.
    evidence_fields: [ostomy_billing.original_ostomy_ledger_id, ostomy_billing.appeal_level, ostomy_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_billing.original_ostomy_ledger_id]
      action_bindings: {ostomy_billing.original_ostomy_ledger_id: original_ostomy_ledger_id}
    dedup_contract:
      table: ostomy_billing
      mode: separate_record
      object_bindings: {original_ostomy_ledger_id: original_ostomy_ledger_id, appeal_level: appeal_level}
      duplicate_filters:
        event_type: [ostomy_appeal_filing]
      distinct_fields: [posting_date]
  params:
    per_tier:
      Ostomy Self-Pay Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Ostomy Commercial HMO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Ostomy Commercial PPO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Ostomy Medicare Advantage Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Ostomy Original Medicare Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Ostomy Medicaid Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
- id: ostomy_liability_notice
  subject: [ostomy_liability_notice_signed, ostomy_patient_charge]
  rule: >-
    When an item or quantity the customer wants is expected not to be paid by the payer - above the tier's allowance
    without supporting documentation, an item the tier does not cover, or a replacement before the payer's replacement
    interval - Larkfield supplies it billable to the customer only after the customer signs the tier's liability
    notice (liability_notice_type) for that item and quantity before the ship date; the customer signs it personally,
    and no Larkfield representative can sign it for them. On the Original Medicare tier the notice is the CMS Advance
    Beneficiary Notice of Noncoverage (form CMS-R-131); the claim is still submitted to Medicare with the notice
    on file, and the customer becomes liable only for a line Medicare denies. On the Medicare Advantage tier no
    notice can make the member liable; the member becomes liable only for an item for which the plan has issued
    a pre-service organization determination denial, recorded as a prior authorization denial for that item. On
    the self-pay tier no notice applies, because every item is priced at the Larkfield cash price. A patient charge
    is posted only as one of these charge types: self_pay_price (a self-pay refill at the cash price), standard_shipping
    (a self-pay shipment below the free-shipping threshold), expedited_shipping (a customer-requested expedite),
    or non_covered_item (an item or quantity covered by a signed liability notice, or by a Medicare Advantage organization
    determination denial, that the payer denied, charged at the Larkfield cash price of the units concerned). A
    non_covered_item charge requires a liability notice signed on or before the ship date covering that item and
    at least those units, or on the Medicare Advantage tier the plan's organization determination denial for that
    item; without it the amount is Larkfield's write-off and is never billed to the customer.
  eligibility:
  - id: notice_before_charge
    applies_to: [ostomy_patient_charge]
    kind: authorization
    condition: >-
      A non_covered_item charge requires a liability notice signed on or before the ship date covering that item
      and at least those units, or on the Medicare Advantage tier the plan's organization determination denial for
      that item
    evidence_fields: [ostomy_orders.ostomy_program_id, ostomy_orders.item_code, ostomy_orders.event_type, ostomy_orders.notice_date,
      ostomy_orders.notice_units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_orders.ostomy_program_id, ostomy_orders.item_code]
      action_bindings: {ostomy_orders.ostomy_program_id: ostomy_program_id, ostomy_orders.item_code: item_code}
  - id: customer_signs
    applies_to: [ostomy_liability_notice_signed]
    kind: caller_fact
    condition: the customer signs it personally, and no Larkfield representative can sign it for them.
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
  params:
    per_tier:
      Ostomy Self-Pay Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Ostomy Commercial HMO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Ostomy Commercial PPO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Ostomy Medicare Advantage Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Ostomy Original Medicare Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Ostomy Medicaid Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
- id: ostomy_evt_patient_account
  subject: [ostomy_patient_payment, ostomy_balance_adjustment, ostomy_patient_refund]
  rule: >-
    The customer's balance on the program is the running total of its patient-balance postings: remittance patient
    responsibility, patient charges and refunds add to it, and payments and balance adjustments reduce it; a payment
    is applied to the oldest unpaid posting first. A balance adjustment is posted only for one of these reasons,
    each against the one posting it adjusts and never for more than that posting's unpaid remainder: return_credit
    (an accepted self-pay return, for the price paid for the returned units less restocking_fee_pct percent); secondary_payer_payment
    (the amount a secondary payer paid against a remittance's patient responsibility); hardship_waiver; small_balance_writeoff;
    billing_correction (a posting made in error, or a timely-filing write-off). A hardship waiver is granted only
    on tiers where hardship_waiver_allowed is true, only for postings named on a hardship application whose request
    status is approved, and only after Larkfield's financial counseling team confirms household income at or below
    hardship_income_fpl_pct percent of the HHS poverty guideline; it is never granted routinely, never advertised
    and never granted on the customer's statement alone. A small-balance write-off is made only when the whole remaining
    balance of the program is greater than 0.00 and no more than small_balance_writeoff_usd; on tiers where small_balance_writeoff_usd
    is 0.00 no write-off is made and the balance is statemented. A credit balance - a balance below zero - is refunded
    to the original payment method no later than credit_balance_refund_days calendar days after the posting date
    of the entry that created it, unless the customer asks in writing to keep it on account; a refund never exceeds
    the credit. A payment plan is offered only on tiers where payment_plan_max_months is greater than 0, for a balance
    of at least payment_plan_min_balance_usd, in no more than payment_plan_max_months monthly installments of at
    least payment_plan_min_monthly_usd; it is created as a payment plan request the customer accepts, and while
    an approved plan's installments are current the balance it covers is left out of the past-due test measured
    by ostomy_msr_past_due_amount.
  eligibility:
  - id: hardship_approved
    applies_to: [ostomy_balance_adjustment]
    kind: authorization
    condition: >-
      A hardship waiver is granted only on tiers where hardship_waiver_allowed is true, only for postings named
      on a hardship application whose request status is approved
    evidence_fields: [ostomy_requests.ostomy_request_id, ostomy_requests.request_type, ostomy_requests.request_status,
      ostomy_requests.ostomy_ledger_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_requests.ostomy_ledger_id]
      action_bindings: {ostomy_requests.ostomy_ledger_id: original_ostomy_ledger_id}
  - id: small_balance_ceiling
    applies_to: [ostomy_balance_adjustment]
    kind: authorization
    condition: >-
      A small-balance write-off is made only when the whole remaining balance of the program is greater than 0.00
      and no more than small_balance_writeoff_usd
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.patient_balance_due]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
  params:
    per_tier:
      Ostomy Self-Pay Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Ostomy Commercial HMO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Ostomy Commercial PPO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Ostomy Medicare Advantage Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Ostomy Original Medicare Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Ostomy Medicaid Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
  measures: [ostomy_msr_past_due_amount]
- id: ostomy_holds_and_closure
  subject: [ostomy_program_hold, ostomy_program_resume, ostomy_program_administrative_close]
  rule: >-
    An active program is placed on hold for exactly one recorded reason: inpatient_stay (the customer or caregiver
    reports a current inpatient admission to a hospital or skilled nursing facility, on tiers where inpatient_hold_required
    is true); coverage_lapse (the coverage record the program bills has a termination date earlier than the date
    of the write and no other in-effect coverage on file fixes the program's tier); documentation_lapse (no authorization
    grant of the program is valid on the date of the write); past_due_balance (on tiers where past_due_hold_days
    is greater than 0, the past-due amount measured by ostomy_msr_past_due_amount is at least past_due_hold_min_usd
    and no approved payment plan covers it); or customer_request (the customer asks to pause shipments). A hold
    is placed only for a reason that is true on the date of the write. A program on hold resumes only when its recorded
    hold reason has cleared: discharge reported for inpatient_stay; an in-effect coverage on file and written onto
    the program for coverage_lapse; an authorization grant valid on the date of the write for documentation_lapse;
    a past-due amount below past_due_hold_min_usd or an approved payment plan for past_due_balance; the customer's
    own request for customer_request. A program closes administratively, with the matching closure reason, in exactly
    these cases: documentation_not_received, for a program still in referral_received or pending_authorization once
    the date of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior
    authorization decision pending; authorization_denied, when a payer prior authorization denial stands and no
    new request is pending; hold_limit_reached, for a program on hold once the date of the write is later than the
    hold start date plus hold_max_days calendar days; coverage_ended, for a program on hold for coverage_lapse whose
    customer reports no replacement coverage; customer_discontinued, when the customer confirms the cancellation
    of a program on hold; deceased, when Larkfield's records team has recorded the customer's death. Day counts
    in this policy are calendar days counted from the named date, and a closure is made only on a day strictly later
    than the named date plus the stated days.
  eligibility:
  - id: inpatient_reported
    applies_to: [ostomy_program_hold]
    kind: caller_fact
    condition: >-
      the customer or caregiver reports a current inpatient admission to a hospital or skilled nursing facility,
      on tiers where inpatient_hold_required is true
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.variant_name]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
  - id: hold_reason_true
    applies_to: [ostomy_program_hold]
    kind: authorization
    condition: A hold is placed only for a reason that is true on the date of the write.
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.coverage_id, coverages.termination_date,
      ostomy_orders.valid_through, ostomy_programs.patient_balance_due]
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
  - id: hold_limit_elapsed
    applies_to: [ostomy_program_administrative_close]
    kind: time
    condition: >-
      hold_limit_reached, for a program on hold once the date of the write is later than the hold start date plus
      hold_max_days calendar days
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.hold_start_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold start date
      anchor_source: ostomy_programs.hold_start_date
      relation: not_before
      duration_source: variants.hold_max_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  - id: referral_window_elapsed
    applies_to: [ostomy_program_administrative_close]
    kind: time
    condition: >-
      documentation_not_received, for a program still in referral_received or pending_authorization once the date
      of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior authorization
      decision pending
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.enrolled_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrolled date
      anchor_source: ostomy_programs.enrolled_date
      relation: not_before
      duration_source: variants.referral_docs_window_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  params:
    per_tier:
      Ostomy Self-Pay Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Ostomy Commercial HMO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Ostomy Commercial PPO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Ostomy Medicare Advantage Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Ostomy Original Medicare Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Ostomy Medicaid Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
  measures: [ostomy_msr_past_due_amount]
- id: ostomy_discontinuation
  subject: [ostomy_program_discontinue]
  rule: >-
    Only the customer can end an active program: Larkfield records the cancellation as a program cancellation request,
    and the program closes only when the customer personally confirms that request. A confirmed cancellation closes
    the program with closure_reason customer_discontinued, or changed_supplier when the customer states they are
    moving these supplies to another supplier; a cancellation of a program on hold is closed under ostomy_holds_and_closure.
    Ending a program carries no fee and cancels nothing the customer already owes: the balance stays payable, credit
    balances are still refunded under ostomy_evt_patient_account, and unopened items delivered within the return
    window stay returnable under ostomy_evt_returns. Authorized units remaining on a closed program lapse and are
    never shipped; a later restart needs a new referral and a new program. A package already shipped is not recalled.
  eligibility:
  - id: cancellation_confirmed
    applies_to: [ostomy_program_discontinue]
    kind: authorization
    condition: >-
      Larkfield records the cancellation as a program cancellation request, and the program closes only when the
      customer personally confirms that request.
    evidence_fields: [ostomy_requests.ostomy_request_id, ostomy_requests.ostomy_program_id, ostomy_requests.request_type,
      ostomy_requests.request_status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_requests.ostomy_program_id]
      action_bindings: {ostomy_requests.ostomy_program_id: ostomy_program_id}
- id: ostomy_agg_multi_holding
  subject: [ostomy_program_enroll]
  rule: >-
    A customer may hold up to max_per_customer ostomy programs at the same time, one for each stoma, because a customer
    with both a colostomy or ileostomy and a urostomy needs a separate appliance for each. A new ostomy program
    is opened only when the customer has no ostomy program of the same ostomy type in referral_received, pending_authorization,
    active or on_hold; a new system, size or insurance for an existing stoma is written as a program change on that
    stoma's program, and a closed program does not count. Each program carries its own tier from the coverage it
    bills; both programs of one customer normally bill the same primary coverage.
  eligibility:
  - id: one_program_per_stoma
    applies_to: [ostomy_program_enroll]
    kind: dedup
    condition: >-
      A new ostomy program is opened only when the customer has no ostomy program of the same ostomy type in referral_received,
      pending_authorization, active or on_hold
    evidence_fields: [ostomy_programs.customer_id, ostomy_programs.ostomy_type, ostomy_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.customer_id, ostomy_programs.ostomy_type]
      action_bindings: {ostomy_programs.customer_id: customer_id, ostomy_programs.ostomy_type: ostomy_type}
    dedup_contract:
      table: ostomy_programs
      mode: separate_record
      object_bindings: {customer_id: customer_id, ostomy_type: ostomy_type}
      duplicate_filters:
        status: [referral_received, pending_authorization, active, on_hold]
      distinct_fields: []
  params: {max_per_customer: 2}
- id: ostomy_agg_dual_stoma_accessories
  subject: [ostomy_refill_shipment]
  rule: >-
    For a customer holding two ostomy programs, barriers and pouches are allowed per program, but the accessories
    listed in per_customer_accessory_items (paste, adhesive remover and the ostomy belt) are allowed once per customer.
    Accessories ship only on the customer's ostomy program with the earlier enrolled date that is not closed, and
    the other program receives none; when that program closes, the remaining program carries them from its next
    refill. When the earliest permitted ship dates of the two programs fall within shipment_consolidation_days calendar
    days of each other, both refills ship together on the later of the two dates.
  eligibility:
  - id: accessories_on_one_program
    applies_to: [ostomy_refill_shipment]
    kind: authorization
    condition: >-
      Accessories ship only on the customer's ostomy program with the earlier enrolled date that is not closed,
      and the other program receives none
    evidence_fields: [ostomy_programs.customer_id, ostomy_programs.enrolled_date, ostomy_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.customer_id]
      action_bindings: {ostomy_programs.customer_id: customer_id}
  params:
    per_tier:
      Ostomy Self-Pay Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Ostomy Commercial HMO Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Ostomy Commercial PPO Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Ostomy Medicare Advantage Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Ostomy Original Medicare Program: {shipment_consolidation_days: =shipment_consolidation_days}
      Ostomy Medicaid Program: {shipment_consolidation_days: =shipment_consolidation_days}
- id: ostomy_evt_quantity_limits
  subject: [ostomy_refill_shipment, ostomy_replacement_shipment]
  rule: >-
    A refill may carry only items that eligible_items_by_system_and_type lists for the program's appliance system
    and ostomy type, plus the accessories; a one_piece program never receives separate barriers, and a two_piece
    program never receives pouches with a barrier attached, because the barrier of a one-piece pouch is part of
    the pouch. The units of each item are the tier's monthly_allowance_by_item for that item times the supply days
    divided by 30, or the written order's quantity when that is lower. On tiers where convex_barrier_documentation_required
    is true, a convex barrier (A4407) ships only when a medical record with purpose convexity_justification documents
    a flush or retracted stoma. A quantity above the allowance is covered only when a medical record with purpose
    over_limit_justification, documenting the clinical reason, is dated no more than over_limit_record_months calendar
    months before the ship date; the allowance then becomes the quantity that record documents, and without it an
    above-allowance quantity ships only under ostomy_liability_notice at cash_price_by_item. On the self-pay tier
    every item is sold at cash_price_by_item up to the written order's quantity. A replacement never exceeds the
    units of the shipment it replaces.
  eligibility:
  - id: items_match_system
    applies_to: [ostomy_refill_shipment]
    kind: authorization
    condition: >-
      A refill may carry only items that eligible_items_by_system_and_type lists for the program's appliance system
      and ostomy type, plus the accessories
    evidence_fields: [ostomy_programs.ostomy_program_id, ostomy_programs.appliance_system, ostomy_programs.ostomy_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_programs.ostomy_program_id]
      action_bindings: {ostomy_programs.ostomy_program_id: ostomy_program_id}
  - id: convexity_documented
    applies_to: [ostomy_refill_shipment]
    kind: authorization
    condition: >-
      On tiers where convex_barrier_documentation_required is true, a convex barrier (A4407) ships only when a medical
      record with purpose convexity_justification documents a flush or retracted stoma.
    evidence_fields: [ostomy_orders.ostomy_program_id, ostomy_orders.record_purpose]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_orders.ostomy_program_id]
      action_bindings: {ostomy_orders.ostomy_program_id: ostomy_program_id}
  params:
    per_tier:
      Ostomy Self-Pay Program: {monthly_allowance_by_item: =monthly_allowance_by_item, over_limit_record_months: =over_limit_record_months,
        convex_barrier_documentation_required: =convex_barrier_documentation_required}
      Ostomy Commercial HMO Program: {monthly_allowance_by_item: =monthly_allowance_by_item, over_limit_record_months: =over_limit_record_months,
        convex_barrier_documentation_required: =convex_barrier_documentation_required}
      Ostomy Commercial PPO Program: {monthly_allowance_by_item: =monthly_allowance_by_item, over_limit_record_months: =over_limit_record_months,
        convex_barrier_documentation_required: =convex_barrier_documentation_required}
      Ostomy Medicare Advantage Program: {monthly_allowance_by_item: =monthly_allowance_by_item, over_limit_record_months: =over_limit_record_months,
        convex_barrier_documentation_required: =convex_barrier_documentation_required}
      Ostomy Original Medicare Program: {monthly_allowance_by_item: =monthly_allowance_by_item, over_limit_record_months: =over_limit_record_months,
        convex_barrier_documentation_required: =convex_barrier_documentation_required}
      Ostomy Medicaid Program: {monthly_allowance_by_item: =monthly_allowance_by_item, over_limit_record_months: =over_limit_record_months,
        convex_barrier_documentation_required: =convex_barrier_documentation_required}
  formula: {units: monthly_allowance_by_item * supply_days / 30}
- id: ostomy_samples
  subject: [ostomy_sample_shipment]
  rule: >-
    When a customer's current barrier or pouch does not fit or leaks, Larkfield may send a no-charge manufacturer
    sample kit of an alternative item so the customer and their ostomy nurse can choose a new product; a sample
    is never billed, draws no authorized units and does not count toward the allowance. A sample kit is sent only
    while the program's sample kits over the rolling 12 months ending on the sample ship date, counted by ostomy_msr_samples_12m,
    are fewer than sample_kits_per_12_months, and only for an item eligible for the program's appliance system and
    ostomy type or for the system the customer's ostomy nurse is moving them to. A product the customer chooses
    after a trial is supplied only after a new written order names it.
  eligibility:
  - id: sample_limit
    applies_to: [ostomy_sample_shipment]
    kind: dedup
    condition: >-
      A sample kit is sent only while the program's sample kits over the rolling 12 months ending on the sample
      ship date, counted by ostomy_msr_samples_12m, are fewer than sample_kits_per_12_months
    evidence_fields: [ostomy_shipments.ostomy_program_id, ostomy_shipments.event_type, ostomy_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [ostomy_shipments.ostomy_program_id]
      action_bindings: {ostomy_shipments.ostomy_program_id: ostomy_program_id}
    dedup_contract:
      table: ostomy_shipments
      mode: separate_record
      object_bindings: {ostomy_program_id: ostomy_program_id}
      duplicate_filters:
        event_type: [ostomy_sample_shipment]
      distinct_fields: [ship_date, item_code]
  params:
    per_tier:
      Ostomy Self-Pay Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Ostomy Commercial HMO Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Ostomy Commercial PPO Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Ostomy Medicare Advantage Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Ostomy Original Medicare Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
      Ostomy Medicaid Program: {sample_kits_per_12_months: =sample_kits_per_12_months}
  measures: [ostomy_msr_samples_12m]

extended_policies:
- id: ostomy_ext_plan_denial_charge
  base_policy_refs:
  - ostomy_liability_notice
  - ostomy_evt_quantity_limits
  - ostomy_documentation_and_authorization
  - ostomy_evt_returns
  - ostomy_evt_claims
  - ostomy_evt_denials_and_appeals
  overwrite:
  - base_policy: ostomy_liability_notice
    superseded_clause: >-
      non_covered_item (an item or quantity covered by a signed liability notice, or by a Medicare Advantage organization determination denial, that the payer denied, charged at the
      Larkfield cash price of the units concerned)
    replaced_by: >-
      For a non_covered_item charge this policy handles - the over-limit convex barriers (A4407) of a program's most recent convex-barrier refill on the Medicare Advantage tier, denied
      by the plan under its organization determination denial - and only for such a charge, the charge is priced as this policy states; every other non_covered_item charge remains an
      item or quantity covered by a signed liability notice, or by a Medicare Advantage organization determination denial, that the payer denied, charged at the Larkfield cash price
      of the units concerned.
  trigger: state_due
  subject:
  - ostomy_patient_charge
  computes: amount
  target_tool: post_plan_denial_charge_c6cdcbbb
  params:
    convex_cash_price: 12.4
    days_per_year: 365
    months_per_year: 12
    volume_units_high: 30
    volume_units_low: 15
    volume_rate_high: 0.1
    volume_rate_low: 0.05
    multiline_refills: 2
    multiline_rate_high: 0.1
    multiline_rate_low: 0.05
    tenure_long_months: 36
    tenure_mid_months: 12
    tenure_credit_long: 15.0
    tenure_credit_mid: 5.0
    credit_lookback_months: 24
    late_days_long: 60
    late_days_mid: 30
    late_rate_high: 0.1
    late_rate_low: 0.05
    convex_allowance_standard: 20
    convex_allowance_hmo: 15
    convex_allowance_medicaid: 10
  rule: >-
    For a non_covered_item charge this policy handles - the over-limit convex barriers (A4407) of a program's most recent convex-barrier refill on the Medicare Advantage tier, denied
    by the plan under its organization determination denial - and only for such a charge, the charge is priced as this policy states; every other non_covered_item charge remains an item
    or quantity covered by a signed liability notice, or by a Medicare Advantage organization determination denial, that the payer denied, charged at the Larkfield cash price of the
    units concerned. The charge is owed once the plan's organization determination denial for the convex barrier is on file and the plan has posted a denial on the original claim of
    the program's most recent convex-barrier refill; one charge is posted against that refill, and a program without such a denial owes no charge under this policy. Larkfield charges
    the barriers concerned on the denied refill at the Larkfield cash price per convex barrier. The the barriers concerned on the denied refill are the units the refill shipped less
    the units of that refill the warehouse received back unopened less the tier's monthly allowance for the convex barrier times the refill's supply days divided by 30, never below zero.
    The charge is the barriers concerned on the denied refill times the cash price, rounded to the cent. Each adjustment set out below changes the standard charge as that adjustment
    states: the rates taken off the cash price of the barriers concerned are first added into one total rate that reduces it once, not successively, the reduced amount is rounded to
    the cent, and an amount an adjustment deducts then comes off the rounded amount. The barriers the plan covered replace the tier's allowance times the supply days divided by 30 in
    the barriers concerned and follow the plan's own approval: where the program's most recent payer prior authorization grant for the convex barrier is valid on the refill's ship date
    and approves fewer units than twelve months of the tier's allowance, the barriers the plan covered are the grant's approved units times the refill's supply days divided by 365, rounded
    down to a whole barrier; where no such grant exists and the newest written order for the convex barrier orders fewer per 30 days than the tier's allowance, they are the order's quantity
    per 30 days times the supply days divided by 30; otherwise they are the tier's allowance times the supply days divided by 30. A quantity rate comes off the cash price according to
    the barriers the refill shipped above the tier's allowance for its supply days (the units shipped less the allowance times the supply days divided by 30): 30 or more such barriers
    take the higher quantity rate, 15 to 29 take the lower quantity rate, and fewer than 15 take no quantity rate. A late-decision rate comes off the cash price when the plan took long
    to deny the refill's claim, measured in calendar days from the refill's ship date to the posting date of the plan's denial on its original claim: more than 60 days takes the higher
    late-decision rate, 31 to 60 days takes the lower late-decision rate, and 30 days or fewer takes no late-decision rate. A multi-line rate comes off the cash price when the customer
    also receives continence supplies from Larkfield: a customer with an active continence program and at least two continence refills shipped in the last 12 months takes the higher
    multi-line rate, a customer with an active continence program and fewer than two continence refills shipped in the last 12 months takes the lower multi-line rate, and any other customer
    takes no multi-line rate. A tenure credit is deducted from the rounded amount: a program active for 36 months or more with no non_covered_item charge posted in the last 24 months
    takes the long-tenure credit, a program active for at least 12 but fewer than 36 months with no non_covered_item charge posted in the last 24 months takes the mid-tenure credit,
    and any other program takes no credit; the charge after the credit is never below zero and is rounded to the cent. The tier's allowance for the convex barrier is the billing units
    per 30 days that the tier's monthly allowance by item sets for A4407: 20 on the Self-Pay, Commercial PPO, Medicare Advantage and Original Medicare tiers, 15 on the Commercial HMO
    tier and 10 on the Medicaid tier.
  prerequisite: []
  cross_category:
  - category: continence
    as: history
    reads:
    - status
    - continence_shipments.event_type
    - continence_shipments.ship_date
    note: >-
      the multi-line rate is decided from whether the customer holds an active continence program and how many continence refills shipped to the customer in the last 12 months
  compute:
  - tier_allowance: >-
      K('convex_allowance_medicaid') if F('variant_name') == 'Ostomy Medicaid Program' else (K('convex_allowance_hmo') if F('variant_name') == 'Ostomy Commercial HMO Program' else K('convex_allowance_standard'))
  - od_denials: COUNT('ostomy_orders', event_type='ostomy_prior_auth_denial', item_code='A4407')
  - dn_ship_date: >-
      LATEST('ostomy_shipments', 'ship_date', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407')
  - dn_ship_id: >-
      LATEST('ostomy_shipments', 'ostomy_shipment_id', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407')
  - dn_ship_units: >-
      LATEST('ostomy_shipments', 'units', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') if dn_ship_id != None else 0
  - dn_ship_days: >-
      LATEST('ostomy_shipments', 'supply_days', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') if dn_ship_id != None else 0
  - dn_claim_id: >-
      LATEST('ostomy_billing', 'ostomy_ledger_id', date_field='posting_date', event_type='ostomy_claim_submission', submission_type='original', ostomy_shipment_id=dn_ship_id)
  - dn_denial_date: >-
      LATEST('ostomy_billing', 'posting_date', date_field='posting_date', event_type='ostomy_claim_denial', original_ostomy_ledger_id=dn_claim_id)
  - pa_units: >-
      LATEST('ostomy_orders', 'units_authorized', date_field='decision_date', event_type='ostomy_authorization_grant', item_code='A4407', authorization_basis='payer_prior_authorization')
  - pa_from: >-
      LATEST('ostomy_orders', 'valid_from', date_field='decision_date', event_type='ostomy_authorization_grant', item_code='A4407', authorization_basis='payer_prior_authorization')
  - pa_through: >-
      LATEST('ostomy_orders', 'valid_through', date_field='decision_date', event_type='ostomy_authorization_grant', item_code='A4407', authorization_basis='payer_prior_authorization')
  - order_qty: >-
      LATEST('ostomy_orders', 'quantity_per_30_days', date_field='order_date', event_type='ostomy_order_receipt', item_code='A4407')
  - pa_short: >-
      dn_ship_date != None and pa_units != None and DAYS(pa_from, dn_ship_date) >= 0 and DAYS(dn_ship_date, pa_through) >= 0 and pa_units < tier_allowance * K('months_per_year')
  - covered_barriers: >-
      int(pa_units * dn_ship_days / K('days_per_year')) if pa_short else (order_qty * dn_ship_days / 30 if ((not pa_short) and order_qty != None and order_qty < tier_allowance) else
      tier_allowance * dn_ship_days / 30)
  - over_allowance_units: >-
      (LATEST('ostomy_shipments', 'units', date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') - tier_allowance * LATEST('ostomy_shipments', 'supply_days',
      date_field='ship_date', event_type='ostomy_refill_shipment', item_code='A4407') / 30) if dn_ship_id != None else 0
  - quantity_rate: >-
      K('volume_rate_high') if over_allowance_units >= K('volume_units_high') else (K('volume_rate_low') if over_allowance_units >= K('volume_units_low') else 0)
  - denial_lag_days: DAYS(dn_ship_date, dn_denial_date) if (dn_denial_date != None and dn_ship_date != None) else 0
  - late_rate: >-
      K('late_rate_high') if denial_lag_days > K('late_days_long') else (K('late_rate_low') if denial_lag_days > K('late_days_mid') else 0)
  - rcv_units: >-
      SUM('ostomy_shipments', 'units', event_type='ostomy_return_receipt', original_ostomy_shipment_id=dn_ship_id)
  - cont_active: EXISTS('continence', status='active')
  - cont_refills_12m: >-
      XCOUNT('continence', 'continence_shipments', within_months=12, date_field='ship_date', event_type='continence_refill_shipment')
  - multiline_rate: >-
      K('multiline_rate_high') if (cont_active and cont_refills_12m >= K('multiline_refills')) else (K('multiline_rate_low') if (cont_active and cont_refills_12m < K('multiline_refills'))
      else 0)
  - tenure_months: MONTHS(F('activated_date'), NOW)
  - prior_nc_24m: >-
      COUNT('ostomy_billing', within_months=K('credit_lookback_months'), date_field='posting_date', event_type='ostomy_patient_charge', charge_type='non_covered_item')
  - tenure_credit: >-
      K('tenure_credit_long') if (tenure_months >= K('tenure_long_months') and prior_nc_24m == 0) else (K('tenure_credit_mid') if (tenure_months >= K('tenure_mid_months') and tenure_months
      < K('tenure_long_months') and prior_nc_24m == 0) else 0)
  - barriers_concerned: MX(0, dn_ship_units - rcv_units - covered_barriers)
  - reduced_amount: >-
      RND(barriers_concerned * K('convex_cash_price') * (1 - quantity_rate - multiline_rate - late_rate), 2)
  - result: >-
      0 if (F('variant_name') != 'Ostomy Medicare Advantage Program' or dn_denial_date == None or od_denials == 0) else RND(MX(0, reduced_amount - tenure_credit), 2)
  compute_basis:
    tier_allowance: >-
      The tier's allowance for the convex barrier is the billing units per 30 days that the tier's monthly allowance by item sets for A4407: 20 on the Self-Pay, Commercial PPO, Medicare
      Advantage and Original Medicare tiers, 15 on the Commercial HMO tier and 10 on the Medicaid tier.
    dn_ship_date: >-
      For a non_covered_item charge this policy handles - the over-limit convex barriers (A4407) of a program's most recent convex-barrier refill on the Medicare Advantage tier, denied
      by the plan under its organization determination denial - and only for such a charge, the charge is priced as this policy states
    dn_ship_id: >-
      one charge is posted against that refill, and a program without such a denial owes no charge under this policy.
    dn_ship_units: >-
      the barriers concerned on the denied refill are the units the refill shipped less the units of that refill the warehouse received back unopened less the tier's monthly allowance
      for the convex barrier times the refill's supply days divided by 30, never below zero.
    dn_ship_days: the tier's monthly allowance for the convex barrier times the refill's supply days divided by 30
    dn_claim_id: >-
      The charge is owed once the plan's organization determination denial for the convex barrier is on file and the plan has posted a denial on the original claim of the program's most
      recent convex-barrier refill
    dn_denial_date: >-
      measured in calendar days from the refill's ship date to the posting date of the plan's denial on its original claim
    pa_units: >-
      where the program's most recent payer prior authorization grant for the convex barrier is valid on the refill's ship date and approves fewer units than twelve months of the tier's
      allowance, the barriers the plan covered are the grant's approved units times the refill's supply days divided by 365, rounded down to a whole barrier
    pa_from: >-
      where the program's most recent payer prior authorization grant for the convex barrier is valid on the refill's ship date
    pa_through: >-
      where the program's most recent payer prior authorization grant for the convex barrier is valid on the refill's ship date
    order_qty: >-
      where no such grant exists and the newest written order for the convex barrier orders fewer per 30 days than the tier's allowance, they are the order's quantity per 30 days times
      the supply days divided by 30
    pa_short: >-
      where the program's most recent payer prior authorization grant for the convex barrier is valid on the refill's ship date and approves fewer units than twelve months of the tier's
      allowance
    covered_barriers: >-
      The barriers the plan covered replace the tier's allowance times the supply days divided by 30 in the barriers concerned and follow the plan's own approval: where the program's
      most recent payer prior authorization grant for the convex barrier is valid on the refill's ship date and approves fewer units than twelve months of the tier's allowance, the barriers
      the plan covered are the grant's approved units times the refill's supply days divided by 365, rounded down to a whole barrier; where no such grant exists and the newest written
      order for the convex barrier orders fewer per 30 days than the tier's allowance, they are the order's quantity per 30 days times the supply days divided by 30; otherwise they are
      the tier's allowance times the supply days divided by 30.
    over_allowance_units: >-
      the barriers the refill shipped above the tier's allowance for its supply days (the units shipped less the allowance times the supply days divided by 30)
    quantity_rate: >-
      A quantity rate comes off the cash price according to the barriers the refill shipped above the tier's allowance for its supply days (the units shipped less the allowance times
      the supply days divided by 30): 30 or more such barriers take the higher quantity rate, 15 to 29 take the lower quantity rate, and fewer than 15 take no quantity rate.
    denial_lag_days: >-
      measured in calendar days from the refill's ship date to the posting date of the plan's denial on its original claim
    late_rate: >-
      A late-decision rate comes off the cash price when the plan took long to deny the refill's claim, measured in calendar days from the refill's ship date to the posting date of the
      plan's denial on its original claim: more than 60 days takes the higher late-decision rate, 31 to 60 days takes the lower late-decision rate, and 30 days or fewer takes no late-decision
      rate.
    rcv_units: less the units of that refill the warehouse received back unopened
    cont_active: >-
      a customer with an active continence program and at least two continence refills shipped in the last 12 months takes the higher multi-line rate
    cont_refills_12m: >-
      a customer with an active continence program and at least two continence refills shipped in the last 12 months takes the higher multi-line rate
    multiline_rate: >-
      A multi-line rate comes off the cash price when the customer also receives continence supplies from Larkfield: a customer with an active continence program and at least two continence
      refills shipped in the last 12 months takes the higher multi-line rate, a customer with an active continence program and fewer than two continence refills shipped in the last 12
      months takes the lower multi-line rate, and any other customer takes no multi-line rate.
    tenure_months: >-
      a program active for 36 months or more with no non_covered_item charge posted in the last 24 months takes the long-tenure credit
    prior_nc_24m: >-
      a program active for 36 months or more with no non_covered_item charge posted in the last 24 months takes the long-tenure credit
    tenure_credit: >-
      A tenure credit is deducted from the rounded amount: a program active for 36 months or more with no non_covered_item charge posted in the last 24 months takes the long-tenure credit,
      a program active for at least 12 but fewer than 36 months with no non_covered_item charge posted in the last 24 months takes the mid-tenure credit, and any other program takes
      no credit; the charge after the credit is never below zero and is rounded to the cent.
    barriers_concerned: >-
      the barriers concerned on the denied refill are the units the refill shipped less the units of that refill the warehouse received back unopened less the tier's monthly allowance
      for the convex barrier times the refill's supply days divided by 30, never below zero.
    reduced_amount: >-
      Each adjustment set out below changes the standard charge as that adjustment states: the rates taken off the cash price of the barriers concerned are first added into one total
      rate that reduces it once, not successively, the reduced amount is rounded to the cent, and an amount an adjustment deducts then comes off the rounded amount.
    result: >-
      For a non_covered_item charge this policy handles - the over-limit convex barriers (A4407) of a program's most recent convex-barrier refill on the Medicare Advantage tier, denied
      by the plan under its organization determination denial - and only for such a charge, the charge is priced as this policy states
    od_denials: >-
      The charge is owed once the plan's organization determination denial for the convex barrier is on file
  factors:
  - id: covered_count
    effect: method
    decides: covered_barriers
    bindings:
    - pa_units
    - pa_from
    - pa_through
    - order_qty
    - pa_short
    - covered_barriers
    ladder:
    - when: >-
        the program's most recent payer prior authorization grant for the convex barrier is valid on the refill's ship date and approves fewer units than twelve months of the tier's
        allowance
      method: >-
        the grant's approved units times the refill's supply days divided by 365, rounded down to a whole barrier
    - when: >-
        no such grant exists and the newest written order for the convex barrier orders fewer per 30 days than the tier's allowance
      method: the order's quantity per 30 days times the supply days divided by 30
    - when: otherwise
      method: the tier's allowance times the supply days divided by 30
    baseline:
      covered_barriers: tier_allowance * dn_ship_days / 30
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: late_decision
    effect: parameter
    decides: late_rate
    bindings:
    - denial_lag_days
    - late_rate
    ladder:
    - when: >-
        more than 60 calendar days from the refill's ship date to the posting of the plan's denial on its original claim
      value: K('late_rate_high')
    - when: 31 to 60 calendar days
      value: K('late_rate_low')
    - when: otherwise (30 days or fewer)
      value: '0'
    baseline:
      late_rate: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: quantity_discount
    effect: parameter
    decides: quantity_rate
    bindings:
    - over_allowance_units
    - quantity_rate
    ladder:
    - when: 30 or more barriers shipped above the tier's allowance for the supply days
      value: K('volume_rate_high')
    - when: 15 to 29 barriers shipped above the allowance
      value: K('volume_rate_low')
    - when: otherwise (fewer than 15)
      value: '0'
    baseline:
      quantity_rate: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: multiline_discount
    effect: parameter
    decides: multiline_rate
    bindings:
    - cont_active
    - cont_refills_12m
    - multiline_rate
    ladder:
    - when: an active continence program and at least two continence refills shipped in the last 12 months
      value: K('multiline_rate_high')
    - when: an active continence program and fewer than two continence refills shipped in the last 12 months
      value: K('multiline_rate_low')
    - when: otherwise
      value: '0'
    baseline:
      multiline_rate: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: continence
  - id: tenure_courtesy
    effect: parameter
    decides: tenure_credit
    bindings:
    - tenure_months
    - prior_nc_24m
    - tenure_credit
    ladder:
    - when: program active for 36 months or more and no non_covered_item charge posted in the last 24 months
      value: K('tenure_credit_long')
    - when: >-
        program active for at least 12 but fewer than 36 months and no non_covered_item charge posted in the last 24 months
      value: K('tenure_credit_mid')
    - when: otherwise
      value: '0'
    baseline:
      tenure_credit: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      Larkfield charges the barriers concerned on the denied refill at the Larkfield cash price per convex barrier. The the barriers concerned on the denied refill are the units the
      refill shipped less the units of that refill the warehouse received back unopened less the tier's monthly allowance for the convex barrier times the refill's supply days divided
      by 30, never below zero. The charge is the barriers concerned on the denied refill times the cash price, rounded to the cent.
    params:
    - monthly_allowance_by_item
    - convex_cash_price
  inputs:
    history:
    - table: ostomy_shipments
      aggregate: latest
      field: units
      filters:
        event_type: ostomy_refill_shipment
        item_code: A4407
    - table: ostomy_shipments
      aggregate: sum
      field: units
      filters:
        event_type: ostomy_return_receipt
    - table: ostomy_orders
      aggregate: latest
      field: units_authorized
      filters:
        event_type: ostomy_authorization_grant
        item_code: A4407
    - table: ostomy_billing
      aggregate: latest
      field: posting_date
      filters:
        event_type: ostomy_claim_denial
    - table: ostomy_billing
      aggregate: count
      field: ostomy_ledger_id
      within_months: 24
      filters:
        event_type: ostomy_patient_charge
        charge_type: non_covered_item
    - category: continence
      table: continence_shipments
      aggregate: count
      field: continence_shipment_id
      within_months: 12
      filters:
        event_type: continence_refill_shipment
    cross_category:
    - continence
- id: ostomy_ext_hardship_waiver
  base_policy_refs:
  - ostomy_evt_patient_account
  - ostomy_evt_claims
  overwrite: []
  trigger: state_due
  subject:
  - ostomy_balance_adjustment
  computes: amount
  target_tool: post_hardship_waiver_31941945
  params:
    share_full: 1.0
    share_once: 0.75
    share_repeat: 0.5
    repeat_lookback_months: 24
    need_balance_high: 100.0
    need_share_high: 0.2
    age_days_long: 180
    age_days_mid: 120
    age_share_long: 0.1
    age_share_mid: 0.05
    payments_lookback_months: 12
    payments_regular: 6
    payments_some: 3
    cap_regular: 150.0
    cap_some: 100.0
    cap_default: 60.0
    tenure_long_months: 36
    tenure_mid_months: 12
    window_long_tenure_months: 12
    window_mid_tenure_months: 18
    window_default_months: 24
    burden_refills_many: 4
    burden_refills_some: 2
    burden_share_many: 0.05
    burden_share_some: 0.02
    need_scale_balance: 500.0
  rule: >-
    A hardship waiver is owed once Larkfield's financial counseling team has approved a hardship application on a tier where hardship waivers are allowed and the posting the application
    names carries no hardship waiver yet; it is posted once, against that named posting, for the most recently received approved application, and a program whose most recent approved
    application's posting already carries a hardship waiver, or that has no approved application, owes no waiver under this policy. Financial counseling approves an application only
    for a posting that payments have not reached, because payments are applied to the oldest unpaid posting first, so the waiver base of the named posting is its amount less the balance
    adjustments already posted against it, never below zero. The standard waiver is the waiver base of the named posting, up to the cap room, rounded to the cent. The cap room is the
    default cap less the hardship waivers already posted on the program in the last 24 months, never below zero. Each adjustment set out below changes the standard waiver as that adjustment
    states: the shares the adjustments set or add are added into one share, never more than the full share, which multiplies the capped waiver base once, and the waiver is then rounded
    to the cent. A repeat share is part of the share that multiplies the capped waiver base and follows the program's earlier hardship waivers posted in the last 24 months: two or more
    earlier waivers set the repeat share, exactly one earlier waiver sets the once share, and no earlier waiver sets the full share. Shared need adds a need share to the share that multiplies
    the capped waiver base when the customer also carries a continence balance with Larkfield, the continence balance being the running total of the patient-balance postings on all of
    the customer's continence programs: a customer with an active continence program and a continence balance of 100.00 or more adds the higher need share, a customer with an active
    continence program and a continence balance above 0.00 and below 100.00 adds a need share in proportion to that balance, the balance divided by 500.00, and any other customer adds
    nothing. The age of the named posting adds an age share to the share that multiplies the capped waiver base, measured in calendar days from the named posting's posting date to the
    date the application was received: more than 180 days adds the long-age share, more than 120 and at most 180 days adds the mid-age share, and 120 days or fewer adds nothing. Supply
    burden adds a burden share to the share that multiplies the capped waiver base when the customer also depends on continence supplies from Larkfield: four or more continence refills
    shipped to the customer in the last 12 months add the higher burden share, two or three add the lower burden share, and fewer than two add nothing. The assistance cap replaces the
    default cap in the cap room and follows the customer's payment record over the last 12 months: six or more payments posted set the regular-payer cap, three to five payments set the
    some-payments cap, and fewer than three set the default cap. The cap window replaces the last 24 months in the cap room and follows how long the program has been enrolled: a program
    enrolled for 36 months or more adds up the amounts of the hardship waivers posted in the last 12 months, a program enrolled for at least 12 but fewer than 36 months adds up those
    posted in the last 18 months, and a program enrolled for fewer than 12 months adds up those posted in the last 24 months.
  prerequisite: []
  cross_category:
  - category: continence
    as: history
    reads:
    - status
    - continence_billing.amount
    - continence_billing.event_type
    - continence_shipments.event_type
    - continence_shipments.ship_date
    note: >-
      the shared-need share is decided from whether the customer holds an active continence program and the running total of the customer's continence billing postings; the supply-burden
      share is decided from the count of continence refills shipped to the customer in the last 12 months
  compute:
  - named_id: >-
      LATEST('ostomy_requests', 'ostomy_ledger_id', date_field='received_at', request_type='hardship_application', request_status='approved')
  - app_date: >-
      LATEST('ostomy_requests', 'received_at', date_field='received_at', request_type='hardship_application', request_status='approved')
  - named_amount: SUM('ostomy_billing', 'amount', ostomy_ledger_id=named_id)
  - named_date: LATEST('ostomy_billing', 'posting_date', date_field='posting_date', ostomy_ledger_id=named_id)
  - named_adjusted: >-
      SUM('ostomy_billing', 'amount', event_type='ostomy_balance_adjustment', original_ostomy_ledger_id=named_id)
  - named_waived: >-
      SUM('ostomy_billing', 'amount', event_type='ostomy_balance_adjustment', adjustment_reason='hardship_waiver', original_ostomy_ledger_id=named_id)
  - waiver_base: MX(0, named_amount - named_adjusted)
  - prior_waivers_24m: >-
      COUNT('ostomy_billing', within_months=K('repeat_lookback_months'), date_field='posting_date', event_type='ostomy_balance_adjustment', adjustment_reason='hardship_waiver')
  - start_share: >-
      K('share_repeat') if prior_waivers_24m >= 2 else (K('share_once') if prior_waivers_24m == 1 else K('share_full'))
  - cont_active: EXISTS('continence', status='active')
  - cont_balance: >-
      RND(XSUM('continence', 'continence_billing', 'amount', event_type='continence_claim_adjudication') + XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_charge')
      + XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_refund') - XSUM('continence', 'continence_billing', 'amount', event_type='continence_patient_payment')
      - XSUM('continence', 'continence_billing', 'amount', event_type='continence_balance_adjustment'), 2)
  - need_share: >-
      K('need_share_high') if (cont_active and cont_balance >= K('need_balance_high')) else (cont_balance / K('need_scale_balance') if (cont_active and cont_balance > 0 and cont_balance
      < K('need_balance_high')) else 0)
  - named_age_days: DAYS(named_date, app_date) if (named_date != None and app_date != None) else 0
  - age_share: >-
      K('age_share_long') if named_age_days > K('age_days_long') else (K('age_share_mid') if named_age_days > K('age_days_mid') else 0)
  - cont_refills_12m: >-
      XCOUNT('continence', 'continence_shipments', within_months=12, date_field='ship_date', event_type='continence_refill_shipment')
  - burden_share: >-
      K('burden_share_many') if cont_refills_12m >= K('burden_refills_many') else (K('burden_share_some') if cont_refills_12m >= K('burden_refills_some') else 0)
  - payments_12m: >-
      COUNT('ostomy_billing', within_months=K('payments_lookback_months'), date_field='posting_date', event_type='ostomy_patient_payment')
  - assist_cap: >-
      K('cap_regular') if payments_12m >= K('payments_regular') else (K('cap_some') if payments_12m >= K('payments_some') else K('cap_default'))
  - enrolled_months: MONTHS(F('enrolled_date'), NOW)
  - window_months: >-
      K('window_long_tenure_months') if enrolled_months >= K('tenure_long_months') else (K('window_mid_tenure_months') if enrolled_months >= K('tenure_mid_months') else K('window_default_months'))
  - cap_used: >-
      SUM('ostomy_billing', 'amount', within_months=window_months, date_field='posting_date', event_type='ostomy_balance_adjustment', adjustment_reason='hardship_waiver')
  - cap_room: MX(0, assist_cap - cap_used)
  - assist_share: MN(K('share_full'), start_share + need_share + age_share + burden_share)
  - result: >-
      0 if (not P('hardship_waiver_allowed') or named_waived > 0) else RND(MN(waiver_base, cap_room) * assist_share, 2)
  compute_basis:
    named_id: it is posted once, against that named posting, for the most recently received approved application
    app_date: >-
      measured in calendar days from the named posting's posting date to the date the application was received
    named_amount: >-
      the waiver base of the named posting is its amount less the balance adjustments already posted against it, never below zero.
    named_date: >-
      measured in calendar days from the named posting's posting date to the date the application was received
    named_adjusted: >-
      the waiver base of the named posting is its amount less the balance adjustments already posted against it, never below zero.
    named_waived: >-
      a program whose most recent approved application's posting already carries a hardship waiver, or that has no approved application, owes no waiver under this policy.
    waiver_base: >-
      Financial counseling approves an application only for a posting that payments have not reached, because payments are applied to the oldest unpaid posting first, so the waiver base
      of the named posting is its amount less the balance adjustments already posted against it, never below zero.
    prior_waivers_24m: >-
      A repeat share is part of the share that multiplies the capped waiver base and follows the program's earlier hardship waivers posted in the last 24 months
    start_share: >-
      A repeat share is part of the share that multiplies the capped waiver base and follows the program's earlier hardship waivers posted in the last 24 months: two or more earlier
      waivers set the repeat share, exactly one earlier waiver sets the once share, and no earlier waiver sets the full share.
    cont_active: >-
      a customer with an active continence program and a continence balance of 100.00 or more adds the higher need share
    cont_balance: >-
      the continence balance being the running total of the patient-balance postings on all of the customer's continence programs
    need_share: >-
      Shared need adds a need share to the share that multiplies the capped waiver base when the customer also carries a continence balance with Larkfield, the continence balance being
      the running total of the patient-balance postings on all of the customer's continence programs: a customer with an active continence program and a continence balance of 100.00
      or more adds the higher need share, a customer with an active continence program and a continence balance above 0.00 and below 100.00 adds a need share in proportion to that balance,
      the balance divided by 500.00, and any other customer adds nothing.
    named_age_days: >-
      The age of the named posting adds an age share to the share that multiplies the capped waiver base, measured in calendar days from the named posting's posting date to the date
      the application was received
    age_share: >-
      more than 180 days adds the long-age share, more than 120 and at most 180 days adds the mid-age share, and 120 days or fewer adds nothing.
    payments_12m: >-
      The assistance cap replaces the default cap in the cap room and follows the customer's payment record over the last 12 months
    assist_cap: >-
      The assistance cap replaces the default cap in the cap room and follows the customer's payment record over the last 12 months: six or more payments posted set the regular-payer
      cap, three to five payments set the some-payments cap, and fewer than three set the default cap.
    enrolled_months: >-
      The cap window replaces the last 24 months in the cap room and follows how long the program has been enrolled
    cap_used: >-
      The cap room is the default cap less the hardship waivers already posted on the program in the last 24 months, never below zero.
    cap_room: >-
      The cap room is the default cap less the hardship waivers already posted on the program in the last 24 months, never below zero.
    assist_share: >-
      Each adjustment set out below changes the standard waiver as that adjustment states: the shares the adjustments set or add are added into one share, never more than the full share,
      which multiplies the capped waiver base once, and the waiver is then rounded to the cent.
    result: >-
      A hardship waiver is owed once Larkfield's financial counseling team has approved a hardship application on a tier where hardship waivers are allowed and the posting the application
      names carries no hardship waiver yet
    cont_refills_12m: >-
      four or more continence refills shipped to the customer in the last 12 months add the higher burden share
    burden_share: >-
      Supply burden adds a burden share to the share that multiplies the capped waiver base when the customer also depends on continence supplies from Larkfield: four or more continence
      refills shipped to the customer in the last 12 months add the higher burden share, two or three add the lower burden share, and fewer than two add nothing.
    window_months: >-
      The cap window replaces the last 24 months in the cap room and follows how long the program has been enrolled: a program enrolled for 36 months or more adds up the amounts of the
      hardship waivers posted in the last 12 months, a program enrolled for at least 12 but fewer than 36 months adds up those posted in the last 18 months, and a program enrolled for
      fewer than 12 months adds up those posted in the last 24 months.
  factors:
  - id: repeat_assistance
    effect: parameter
    decides: start_share
    bindings:
    - prior_waivers_24m
    - start_share
    ladder:
    - when: two or more earlier hardship waivers posted on the program in the last 24 months
      value: K('share_repeat')
    - when: exactly one earlier hardship waiver posted on the program in the last 24 months
      value: K('share_once')
    - when: otherwise (no earlier waiver in the last 24 months)
      value: K('share_full')
    baseline:
      start_share: K('share_full')
    evidence:
    - history
    cross_difficulty: null
  - id: shared_need
    effect: method
    decides: need_share
    bindings:
    - cont_active
    - cont_balance
    - need_share
    ladder:
    - when: an active continence program and a continence balance of 100.00 or more
      method: add the flat higher need share
    - when: an active continence program and a continence balance above 0.00 and below 100.00
      method: add a need share in proportion to the continence balance (the balance divided by 500.00)
    - when: otherwise
      method: add nothing
    baseline:
      need_share: '0'
    evidence:
    - cross_category
    cross_difficulty: continence
  - id: posting_age
    effect: parameter
    decides: age_share
    bindings:
    - named_date
    - app_date
    - named_age_days
    - age_share
    ladder:
    - when: more than 180 calendar days from the named posting's posting date to the application's received date
      value: K('age_share_long')
    - when: more than 120 and at most 180 calendar days
      value: K('age_share_mid')
    - when: otherwise (120 days or fewer)
      value: '0'
    baseline:
      age_share: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: supply_burden
    effect: parameter
    decides: burden_share
    bindings:
    - cont_refills_12m
    - burden_share
    ladder:
    - when: four or more continence refills shipped to the customer in the last 12 months
      value: K('burden_share_many')
    - when: two or three continence refills
      value: K('burden_share_some')
    - when: otherwise
      value: '0'
    baseline:
      burden_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: continence
  - id: payer_record_cap
    effect: parameter
    decides: assist_cap
    bindings:
    - payments_12m
    - assist_cap
    ladder:
    - when: six or more payments posted on the program in the last 12 months
      value: K('cap_regular')
    - when: three to five payments posted in the last 12 months
      value: K('cap_some')
    - when: otherwise (fewer than three)
      value: K('cap_default')
    baseline:
      assist_cap: K('cap_default')
    evidence:
    - history
    cross_difficulty: null
  - id: cap_window
    effect: parameter
    decides: window_months
    bindings:
    - enrolled_months
    - window_months
    ladder:
    - when: program enrolled for 36 months or more
      value: K('window_long_tenure_months')
    - when: program enrolled for at least 12 but fewer than 36 months
      value: K('window_mid_tenure_months')
    - when: otherwise (enrolled fewer than 12 months)
      value: K('window_default_months')
    baseline:
      window_months: K('window_default_months')
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      Financial counseling approves an application only for a posting that payments have not reached, because payments are applied to the oldest unpaid posting first, so the waiver base
      of the named posting is its amount less the balance adjustments already posted against it, never below zero. The standard waiver is the waiver base of the named posting, up to
      the cap room, rounded to the cent. The cap room is the default cap less the hardship waivers already posted on the program in the last 24 months, never below zero.
    params:
    - cap_default
    - window_default_months
    - share_full
  inputs:
    history:
    - table: ostomy_requests
      aggregate: latest
      field: ostomy_ledger_id
      filters:
        request_type: hardship_application
        request_status: approved
    - table: ostomy_billing
      aggregate: sum
      field: amount
      filters:
        event_type: ostomy_balance_adjustment
    - table: ostomy_billing
      aggregate: count
      field: ostomy_ledger_id
      within_months: 24
      filters:
        event_type: ostomy_balance_adjustment
        adjustment_reason: hardship_waiver
    - table: ostomy_billing
      aggregate: count
      field: ostomy_ledger_id
      within_months: 12
      filters:
        event_type: ostomy_patient_payment
    - category: continence
      table: continence_billing
      aggregate: sum
      field: amount
      filters: {}
    - category: continence
      table: continence_shipments
      aggregate: count
      field: continence_shipment_id
      within_months: 12
      filters:
        event_type: continence_refill_shipment
    cross_category:
    - continence
- id: ostomy_ext_plan_installment
  base_policy_refs:
  - ostomy_evt_patient_account
  - ostomy_evt_claims
  - ostomy_evt_denials_and_appeals
  overwrite: []
  trigger: on_request
  subject:
