      tier's liability_notice_type is abn_cms_r_131; and it reaches one 30-day block otherwise.
    cgm_hold_max: >-
      When the newest written order for test strips was signed within the last 30 days, prescribes more units per
      30 days than the order behind the program's latest strip refill, and the tier's liability_notice_type is plan_member_waiver
      or medicaid_non_covered_agreement, the notice reaches, if the customer's CGM program is on hold and its hold
      limit, which is its hold start date plus the CGM tier's hold_max_days, falls after the ship date, the whole
      30-day blocks needed to reach that hold limit, counted up to a whole block, plus one more block, and otherwise
      raised_order_reach_blocks 30-day blocks; it reaches the whole 30-day blocks held by the days from the ship
      date through that newest order's valid-through date, at least one and at most abn_reach_max_blocks, when the
      tier's liability_notice_type is abn_cms_r_131; and it reaches one 30-day block otherwise.
    hold_days_left: >-
      When the newest written order for test strips was signed within the last 30 days, prescribes more units per
      30 days than the order behind the program's latest strip refill, and the tier's liability_notice_type is plan_member_waiver
      or medicaid_non_covered_agreement, the notice reaches, if the customer's CGM program is on hold and its hold
      limit, which is its hold start date plus the CGM tier's hold_max_days, falls after the ship date, the whole
      30-day blocks needed to reach that hold limit, counted up to a whole block, plus one more block, and otherwise
      raised_order_reach_blocks 30-day blocks; it reaches the whole 30-day blocks held by the days from the ship
      date through that newest order's valid-through date, at least one and at most abn_reach_max_blocks, when the
      tier's liability_notice_type is abn_cms_r_131; and it reaches one 30-day block otherwise.
    raised_waiver_order: >-
      When the newest written order for test strips was signed within the last 30 days, prescribes more units per
      30 days than the order behind the program's latest strip refill, and the tier's liability_notice_type is plan_member_waiver
      or medicaid_non_covered_agreement, the notice reaches, if the customer's CGM program is on hold and its hold
      limit, which is its hold start date plus the CGM tier's hold_max_days, falls after the ship date, the whole
      30-day blocks needed to reach that hold limit, counted up to a whole block, plus one more block, and otherwise
      raised_order_reach_blocks 30-day blocks; it reaches the whole 30-day blocks held by the days from the ship
      date through that newest order's valid-through date, at least one and at most abn_reach_max_blocks, when the
      tier's liability_notice_type is abn_cms_r_131; and it reaches one 30-day block otherwise.
    reach_blocks: >-
      When the newest written order for test strips was signed within the last 30 days, prescribes more units per
      30 days than the order behind the program's latest strip refill, and the tier's liability_notice_type is plan_member_waiver
      or medicaid_non_covered_agreement, the notice reaches, if the customer's CGM program is on hold and its hold
      limit, which is its hold start date plus the CGM tier's hold_max_days, falls after the ship date, the whole
      30-day blocks needed to reach that hold limit, counted up to a whole block, plus one more block, and otherwise
      raised_order_reach_blocks 30-day blocks; it reaches the whole 30-day blocks held by the days from the ship
      date through that newest order's valid-through date, at least one and at most abn_reach_max_blocks, when the
      tier's liability_notice_type is abn_cms_r_131; and it reaches one 30-day block otherwise.
    covered_reach_units: >-
      The standard sizing is this: the notice covers the units per 30 days of the written order behind the program's
      latest strip refill times the 30-day blocks the notice reaches, less the units the coverage covers over that
      reach, and never fewer than 0; the notice reaches one 30-day block; the coverage is the tier's strips_per_90_days_non_insulin,
      and what is measured against the window is that whole coverage, the window being the 3 calendar months ending
      on the ship date, a strip refill falling in the window when its ship date is later than the same calendar
      day 3 months earlier; the strips the window counts are the units of the program's strip refills shipped in
      it, replacement shipments not counted, less the units of take-back authorizations for test strips issued in
      the last calendar month and the units of liability notices for test strips signed in the last calendar month,
      never below 0, times strips_per_billing_unit, because units on their way back and units the customer pays
      for under a notice do not use the plan's coverage; the units the coverage covers are the strips that what
      is measured against the window leaves after the window's count, divided by strips_per_billing_unit, rounded
      down to whole units and never below 0; and every 30-day block of the reach beyond the blocks the window spans
      adds one block's share of what is measured against the window, that share being what is measured against the
      window divided by the window's 30-day blocks and by strips_per_billing_unit, rounded down to whole units.
    notice_tier: >-
      No notice is sized on a tier whose liability_notice_type is organization_determination_required or not_applicable,
      because there bgm_liability_notice lets no notice make the customer liable.
    notice_rate: >-
      The units per 30 days the notice covers are those of the program's newest written order for test strips when
      that order is not the order behind the program's latest strip refill and was signed within the last 30 days,
      the lower of the newest order's and that earlier order's units per 30 days when the newest order is not the
      order behind the latest strip refill and was signed more than 30 days ago, and otherwise those of the order
      behind the latest strip refill, because the notice covers the rate the next refill ships at.
    result: >-
      Each rule set out below replaces only the standard quantity it names, the coverage, the window and what is
      measured against it, the units per 30 days the notice covers, or the 30-day blocks it reaches, and the notice
      is then sized as the standard method states.
  factors:
  - id: coverage_allowance_tier
    effect: parameter
    decides: coverage_allowance
    bindings:
    - insulin_class
    - cgm_active
    - coverage_allowance
    ladder:
    - when: the customer is insulin-treated and holds an active CGM program
      value: MN(P('strips_per_90_days_insulin'), P('strips_per_90_days_with_cgm'))
    - when: the customer is not treated with insulin and holds an active CGM program
      value: MN(P('strips_per_90_days_non_insulin'), P('strips_per_90_days_with_cgm'))
    - when: the customer is insulin-treated and holds no active CGM program
      value: P('strips_per_90_days_insulin')
    - when: otherwise (not treated with insulin and no active CGM program)
      value: P('strips_per_90_days_non_insulin')
    baseline:
      coverage_allowance: P('strips_per_90_days_non_insulin')
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: cgm
  - id: notice_order_rate
    effect: parameter
    decides: notice_rate
    bindings:
    - newest_order_id
    - notice_rate
    ladder:
    - when: >-
        the newest written order for test strips is not the order behind the latest strip refill and was signed
        within the last 30 days
      value: the newest order's units per 30 days
    - when: >-
        the newest written order for test strips is not the order behind the latest strip refill and was signed
        more than 30 days ago
      value: the lower of the newest order's and the earlier order's units per 30 days
    - when: otherwise
      value: the units per 30 days of the order behind the latest strip refill
    baseline:
      notice_rate: prior_order_qty
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: notice_reach
    effect: method
    decides: reach_blocks
    bindings:
    - newest_order_through
    - cgm_hold_start
    - cgm_hold_max
    - hold_days_left
    - raised_waiver_order
    - reach_blocks
    ladder:
    - when: >-
        the newest order for test strips was signed within the last 30 days and raises the units per 30 days over
        the order behind the latest strip refill, on a plan member waiver or Medicaid non-covered agreement tier,
        and the customer's CGM program is on hold with its hold limit after the ship date
      method: >-
        the notice reaches the whole 30-day blocks up to the CGM hold limit (hold start plus the CGM tier's hold_max_days),
        counted up, plus one block
    - when: >-
        the same raised order on a plan member waiver or Medicaid non-covered agreement tier, and no CGM program
        of the customer is on hold with its hold limit after the ship date
      method: the notice reaches raised_order_reach_blocks 30-day blocks
    - when: the tier's notice is the CMS Advance Beneficiary Notice
      method: >-
        the notice reaches the whole 30-day blocks up to the newest order's valid-through date, at least one and
        at most abn_reach_max_blocks
    - when: otherwise
      method: the notice reaches one 30-day block
    baseline:
      reach_blocks: '1'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: cgm
  - id: window_convention
    effect: method
    decides: window_months
    bindings:
    - pa_tier
    - thirty_day_tier
    - pa_grant_units
    - pa_grant_from
    - pa_grant_through
    - pa_blocks
    - pa_monthly_strips
    - window_months
    - window_share
    - window_uses_pa
    ladder:
    - when: the tier ships 30-day supplies and needs no prior authorization
      method: a one-calendar-month window spanning one block, against one third of the coverage
    - when: the tier requires prior authorization
      method: >-
        a one-calendar-month window spanning one block, measured against the units the latest payer prior authorization
        approves, per whole 30-day block of its span and never fewer than one block, instead of the coverage; nothing
        is measured against the window when no payer prior authorization for test strips is on file
    - when: otherwise
      method: a 3-calendar-month window spanning three blocks, against the whole coverage
    baseline:
      window_months: '3'
      window_share: '1'
      window_uses_pa: 'False'
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The standard sizing is this: the notice covers the units per 30 days of the written order behind the program's
      latest strip refill times the 30-day blocks the notice reaches, less the units the coverage covers over that
      reach, and never fewer than 0; the notice reaches one 30-day block; the coverage is the tier's strips_per_90_days_non_insulin,
      and what is measured against the window is that whole coverage, the window being the 3 calendar months ending
      on the ship date, a strip refill falling in the window when its ship date is later than the same calendar
      day 3 months earlier; the strips the window counts are the units of the program's strip refills shipped in
      it, replacement shipments not counted, less the units of take-back authorizations for test strips issued in
      the last calendar month and the units of liability notices for test strips signed in the last calendar month,
      never below 0, times strips_per_billing_unit, because units on their way back and units the customer pays
      for under a notice do not use the plan's coverage; the units the coverage covers are the strips that what
      is measured against the window leaves after the window's count, divided by strips_per_billing_unit, rounded
      down to whole units and never below 0; and every 30-day block of the reach beyond the blocks the window spans
      adds one block's share of what is measured against the window, that share being what is measured against the
      window divided by the window's 30-day blocks and by strips_per_billing_unit, rounded down to whole units.
      The order behind a strip refill is the written order its authorization grant rests on, and the program's newest
      written order for test strips is the one with the latest order date.
    params:
    - strips_per_90_days_non_insulin
    - strips_per_billing_unit
  inputs:
    history:
    - table: bgm_shipments
      aggregate: sum
      field: units
      within_months: 1
      filters:
        event_type: bgm_refill_shipment
        item_code: A4253
    - table: bgm_shipments
      aggregate: sum
      field: units
      within_months: 1
      filters:
        event_type: bgm_return_authorization
        item_code: A4253
    - table: bgm_orders
      aggregate: sum
      field: notice_units
      within_months: 1
      filters:
        event_type: bgm_liability_notice_signed
        item_code: A4253
    - table: bgm_orders
      aggregate: latest
      field: quantity_per_30_days
      filters:
        event_type: bgm_order_receipt
        item_code: A4253
    cross_category:
    - cgm
- id: bgm_ext_new_meter_strip_supply
  base_policy_refs:
  - bgm_evt_refill_shipment
  - bgm_evt_quantity_limits
  - bgm_preferred_meter
  - bgm_combo_cgm_backup
  overwrite:
  - base_policy: bgm_evt_refill_shipment
    superseded_clause: >-
      the supply days of a shipment are the tier's supply_days_per_shipment, shortened to the whole 30-day blocks
      that remain before the authorization's valid-through date when fewer remain; the units and pieces follow from
      the supply days under bgm_evt_quantity_limits
    replaced_by: >-
      For a strip refill this policy quantifies, and only for such a refill, the supply days are the ones stated
      here, namely the tier's supply_days_per_shipment, shortened to the whole 30-day blocks left before the drawn
      grant's valid-through date when fewer remain, or lengthened to the rest of the current supply plus one block
      for the first strip refill after a newly supplied meter, and the units, with the pieces they hold, follow
      from those days, the rates, the take-back exchange and the setup units stated here, never beyond the order's
      rate or the grant; every other refill keeps the supply days and units of bgm_evt_refill_shipment and bgm_evt_quantity_limits.
  trigger: on_request
  subject:
  - bgm_refill_shipment
  computes: units
  target_tool: ship_strip_refill_72890190
  params:
    setup_units_new_meter: 1
    setup_units_new_program: 2
  rule: >-
    A strip refill on a testing supplies program draws on the program's newest authorization grant for test strips
    and ships at the rate of a written order, under bgm_evt_refill_shipment and bgm_evt_quantity_limits; on tiers
    where refill_confirmation_required is true the customer confirms it personally first. A strip refill that takes
    the program's test strips shipped over the 90 days ending on its ship date, that refill counted, above the tier's
    strip allowance is not shipped until a liability notice for test strips, signed by the customer on or after
    the date of the newest written order for test strips, stands on the program's file. The units of the first strip
    refill after a newly supplied meter are fixed only after the shipment of strips the customer holds from the
    latest strip refill, while its return window is open, carries a take-back authorization for any of its units
    counted as still sealed. The standard quantity is this: the refill ships, for each day of the tier's supply_days_per_shipment,
    the strips that the written order behind the program's latest strip refill prescribes per day, that is its units
    per 30 days times strips_per_billing_unit divided by 30; those strips are divided by strips_per_billing_unit
    and rounded up to a whole unit; and the units shipped never exceed the units the order's rate prescribes for
    those supply days or the units still unshipped on the newest authorization grant for test strips. The order
    behind a strip refill is the written order its authorization grant rests on. A refill is the first strip refill
    after a newly supplied meter when the program already has a strip refill and the meter ship date on the program
    is later than the ship date of the program's latest strip refill; a program with no strip refill yet has no
    refill after a newly supplied meter, and its first strip refill is the first strip refill of the program. Each
    rule set out below changes the standard quantity only as it states, the supply days, the order whose rate is
    shipped, the supply days supplied at another rate, or units added, replacements before additions, and the limits
    of the standard method apply after them. The rate is that of the program's newest written order for test strips
    when it is not the order behind the latest strip refill and was signed within the last 30 days; it is the lower
    of that newest order's and the earlier order's units per 30 days when the newest order is not the order behind
    the latest strip refill and was signed more than 30 days ago; and otherwise it is the rate of the order behind
    the latest strip refill. The supply days are, for the first strip refill after a newly supplied meter, the whole
    30-day blocks needed to cover the days still left in the latest strip refill's supply, counted up to a whole
    block, plus one more 30-day block; otherwise, when the days from the ship date through the valid-through date
    of the newest authorization grant for test strips are fewer than the tier's supply_days_per_shipment, they are
    the whole 30-day blocks those days hold; and otherwise they are the tier's supply_days_per_shipment. The supply
    days at the order's daily rate run only from the ship date to the CGM hold limit, never past the end of the
    supply days, when the customer's CGM program is on hold and that hold limit, the CGM hold start date plus the
    CGM tier's hold_max_days, falls after the ship date; they run only over the supply days after the CGM sensor
    supply ends when the customer's CGM program is active and its latest sensor refill, by its ship date plus its
    supply days, still covers days after the ship date; and otherwise they run over every supply day; the remaining
    supply days are supplied at the CGM backup rate of strips_per_90_days_with_cgm divided by 90 strips a day. A
    take-back of test strips adds its units to the refill one for one: the units of test strips the warehouse recorded
    as received back on the program within the last calendar month when any were received, the units authorized
    on a take-back of test strips issued within the last calendar month when none have yet been received, and nothing
    otherwise; a date falls within the last calendar month when it is later than the same calendar day one month
    earlier. The first strip refill after a newly supplied meter adds setup_units_new_meter unit for the new meter's
    control checks and setup; the first strip refill of a program activated within the last 30 days, with no earlier
    strip refill on it, adds setup_units_new_program units; and no setup units are added otherwise. For a strip
    refill this policy quantifies, and only for such a refill, the supply days are the ones stated here, namely
    the tier's supply_days_per_shipment, shortened to the whole 30-day blocks left before the drawn grant's valid-through
    date when fewer remain, or lengthened to the rest of the current supply plus one block for the first strip refill
    after a newly supplied meter, and the units, with the pieces they hold, follow from those days, the rates, the
    take-back exchange and the setup units stated here, never beyond the order's rate or the grant; every other
    refill keeps the supply days and units of bgm_evt_refill_shipment and bgm_evt_quantity_limits.
  prerequisite:
  - problem: bgm_ext_above_coverage_notice
    kind: state_gate
    gate: bgm_orders.notice_units
    form: state
    policy_source: >-
      A strip refill that takes the program's test strips shipped over the 90 days ending on its ship date, that
      refill counted, above the tier's strip allowance is not shipped until a liability notice for test strips,
      signed by the customer on or after the date of the newest written order for test strips, stands on the program's
      file.
    condition: >-
      when the A4253 strips of the program's bgm_refill_shipment rows over the rolling 90 days ending on the refill's
      ship date, the refill counted (bgm_msr_strips_shipped_90d), exceed the tier's strip allowance under bgm_evt_quantity_limits,
      a bgm_liability_notice_signed record for item A4253, signed by the customer, stands on the program with a
      notice_date on or after the order_date of the program's newest bgm_order_receipt for A4253
    resolved_by: sign_liability_notice_3f2fa265
    effect: >-
      the units above coverage become billable to the customer, so the refill may ship at the quantity computed
      here
  - problem: bgm_ext_superseded_strip_takeback
    kind: value_input
    gate: exchange_units
    form: state
    policy_source: >-
      The units of the first strip refill after a newly supplied meter are fixed only after the shipment of strips
      the customer holds from the latest strip refill, while its return window is open, carries a take-back authorization
      for any of its units counted as still sealed.
    condition: >-
      for the first strip refill after a newly supplied meter, while the return window of the shipment of A4253
      strips the customer holds from the program's latest strip refill is open, that shipment carries a bgm_return_authorization
      record for its units counted as still sealed
    resolved_by: issue_return_authorization_3dfb992f
    effect: >-
      the take-back's authorized units, issued within the last calendar month, enter the take-back exchange and
      are added to the refill one for one
  cross_category:
  - category: cgm
    as: branch
    reads:
    - status
    - hold_start_date
    - hold_max_days
    - cgm_shipments.ship_date
    - cgm_shipments.supply_days
    note: >-
      The CGM program's hold start and its tier's hold limit, or its latest sensor refill, decide how many supply
      days run at the order's rate.
  compute:
  - latest_refill_id: >-
      LATEST('bgm_shipments','bgm_shipment_id', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
  - latest_refill_ship: >-
      LATEST('bgm_shipments','ship_date', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
      or ''
  - latest_refill_days: >-
      LATEST('bgm_shipments','supply_days', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
      or 0
  - latest_refill_grant: >-
      LATEST('bgm_shipments','bgm_order_id', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
  - prior_order_id: LATEST('bgm_orders','related_bgm_order_id', bgm_order_id=latest_refill_grant)
  - prior_order_qty: LATEST('bgm_orders','quantity_per_30_days', bgm_order_id=prior_order_id) or 0
  - newest_order_id: >-
      LATEST('bgm_orders','bgm_order_id', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
  - newest_order_qty: >-
      LATEST('bgm_orders','quantity_per_30_days', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
      or 0
  - newest_order_date: >-
      LATEST('bgm_orders','order_date', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
      or NOW
  - order_rate: >-
      newest_order_qty if (newest_order_id != prior_order_id and DAYS(newest_order_date, NOW) <= 30) else (MN(newest_order_qty,
      prior_order_qty) if (newest_order_id != prior_order_id and DAYS(newest_order_date, NOW) > 30) else prior_order_qty)
  - grant_id: >-
      LATEST('bgm_orders','bgm_order_id', date_field='decision_date', event_type='bgm_authorization_grant', item_code='A4253')
  - grant_units: >-
      LATEST('bgm_orders','units_authorized', date_field='decision_date', event_type='bgm_authorization_grant',
      item_code='A4253') or 0
  - grant_through: >-
      LATEST('bgm_orders','valid_through', date_field='decision_date', event_type='bgm_authorization_grant', item_code='A4253')
  - grant_shipped: SUM('bgm_shipments','units', event_type='bgm_refill_shipment', bgm_order_id=grant_id)
  - meter_newly_supplied: True if (latest_refill_ship and (F('meter_ship_date') or '') > latest_refill_ship) else
      False
  - cycle_days_left: latest_refill_days - DAYS(latest_refill_ship, NOW) if latest_refill_ship else 0
  - grant_days_left: DAYS(NOW, grant_through) + 1 if grant_through else 0
  - span_days: >-
      30 * (int(-((-MX(0, cycle_days_left)) // 30)) + 1) if meter_newly_supplied else (30 * int(MX(0, grant_days_left)
      // 30) if grant_days_left < P('supply_days_per_shipment') else P('supply_days_per_shipment'))
  - cgm_hold_start: CFIELD('cgm','hold_start_date', status='on_hold')
  - cgm_hold_max: CPARAM('cgm','hold_max_days', status='on_hold') or 0
  - hold_days_left: cgm_hold_max - DAYS(cgm_hold_start, NOW) if cgm_hold_start else 0
  - cgm_active: EXISTS('cgm', status='active')
  - sensor_ship: >-
      XLATEST('cgm','cgm_shipments','ship_date', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
  - sensor_days: >-
      XLATEST('cgm','cgm_shipments','supply_days', date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
      or 0
  - sensor_days_left: sensor_days - DAYS(sensor_ship, NOW) if sensor_ship else 0
  - phase_split_days: >-
      hold_days_left if (cgm_hold_start and hold_days_left > 0) else (sensor_days_left if (cgm_active and sensor_days_left
      > 0) else 0)
  - order_rate_after_split: False if (cgm_hold_start and hold_days_left > 0) else True
  - split_in_span: MN(span_days, phase_split_days)
  - high_rate_days: (span_days - split_in_span) if order_rate_after_split else split_in_span
  - phased_strips: >-
      order_rate * P('strips_per_billing_unit') * high_rate_days / 30 + P('strips_per_90_days_with_cgm') * (span_days
      - high_rate_days) / 90
  - strip_units: int(-((-phased_strips) // P('strips_per_billing_unit')))
  - takeback_open: >-
      SUM('bgm_shipments','units', within_months=1, date_field='rma_issue_date', event_type='bgm_return_authorization',
      item_code='A4253')
  - takeback_received: >-
      SUM('bgm_shipments','units', within_months=1, date_field='receipt_date', event_type='bgm_return_receipt',
      item_code='A4253')
  - exchange_units: takeback_received if takeback_received > 0 else (takeback_open if takeback_open > 0 else 0)
  - setup_units: >-
      K('setup_units_new_meter') if meter_newly_supplied else (K('setup_units_new_program') if ((not latest_refill_id)
      and F('activated_date') and DAYS(F('activated_date'), NOW) <= 30) else 0)
  - order_cap_units: int(order_rate * span_days // 30)
  - grant_left_units: MX(0, grant_units - grant_shipped)
  - result: int(MN(strip_units + exchange_units + setup_units, order_cap_units, grant_left_units))
  compute_basis:
    latest_refill_id: >-
      A refill is the first strip refill after a newly supplied meter when the program already has a strip refill
      and the meter ship date on the program is later than the ship date of the program's latest strip refill; a
