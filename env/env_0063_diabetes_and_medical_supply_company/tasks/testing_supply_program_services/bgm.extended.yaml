      strips that the written order behind the program's latest strip refill prescribes per day, that is its units
      per 30 days times strips_per_billing_unit divided by 30; those strips are divided by strips_per_billing_unit
      and rounded up to a whole unit; and the units shipped never exceed the units the order's rate prescribes for
      those supply days or the units still unshipped on the newest authorization grant for test strips.
    result: >-
      Each rule set out below changes the standard quantity only as it states, the supply days, the order whose
      rate is shipped, the supply days supplied at another rate, or units added, replacements before additions,
      and the limits of the standard method apply after them.
  factors:
  - id: order_rate_choice
    effect: parameter
    decides: order_rate
    bindings:
    - latest_refill_grant
    - prior_order_id
    - prior_order_qty
    - newest_order_id
    - newest_order_qty
    - newest_order_date
    - order_rate
    ladder:
    - when: >-
        the newest written order for test strips is not the order behind the latest strip refill and was signed
        within the last 30 days
      value: the newest order's units per 30 days
    - when: >-
        the newest written order for test strips is not the order behind the latest strip refill and was signed
        more than 30 days ago
      value: the lower of the newest order's and the earlier order's units per 30 days
    - when: otherwise
      value: the units per 30 days of the order behind the latest strip refill
    baseline:
      order_rate: prior_order_qty
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: supply_span
    effect: method
    decides: span_days
    bindings:
    - latest_refill_days
    - cycle_days_left
    - grant_through
    - grant_days_left
    - span_days
    ladder:
    - when: >-
        the program already has a strip refill and the meter ship date on the program is later than the latest strip
        refill's ship date (first strip refill after a newly supplied meter)
      method: >-
        the whole 30-day blocks covering the days left in the latest refill's supply, counted up, plus one block
    - when: >-
        no newly supplied meter, and the days through the newest grant's valid-through date are fewer than the tier's
        supply days
      method: the whole 30-day blocks those days hold
    - when: otherwise
      method: the tier's supply_days_per_shipment
    baseline:
      span_days: P('supply_days_per_shipment')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: sensor_phase
    effect: method
    decides: phase_split_days
    bindings:
    - cgm_hold_start
    - cgm_hold_max
    - hold_days_left
    - cgm_active
    - sensor_ship
    - sensor_days
    - sensor_days_left
    - phase_split_days
    - order_rate_after_split
    ladder:
    - when: the customer's CGM program is on hold and its hold limit falls after the ship date
      method: >-
        order rate from the ship date to the CGM hold limit (never past the supply days), CGM backup rate for the
        rest
    - when: >-
        the customer's CGM program is active and its latest sensor refill still covers days after the ship date
      method: CGM backup rate while the sensor supply lasts, order rate for the supply days after it
    - when: otherwise
      method: order rate for every supply day
    baseline:
      phase_split_days: '0'
      order_rate_after_split: 'True'
    evidence:
    - cross_category
    - date
    cross_difficulty: cgm
  - id: takeback_exchange
    effect: parameter
    decides: exchange_units
    bindings:
    - takeback_open
    - takeback_received
    - exchange_units
    ladder:
    - when: the warehouse recorded test strips received back on the program within the last calendar month
      value: the units received back
    - when: >-
        a take-back of test strips was issued within the last calendar month and nothing has been received yet
      value: the units authorized on it
    - when: otherwise
      value: '0'
    baseline:
      exchange_units: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: setup_allowance
    effect: parameter
    decides: setup_units
    bindings:
    - setup_units
    ladder:
    - when: the refill is the first strip refill after a newly supplied meter
      value: K('setup_units_new_meter')
    - when: >-
        the refill is the first strip refill of a program activated within the last 30 days, with no earlier strip
        refill
      value: K('setup_units_new_program')
    - when: otherwise
      value: '0'
    baseline:
      setup_units: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The standard quantity is this: the refill ships, for each day of the tier's supply_days_per_shipment, the
      strips that the written order behind the program's latest strip refill prescribes per day, that is its units
      per 30 days times strips_per_billing_unit divided by 30; those strips are divided by strips_per_billing_unit
      and rounded up to a whole unit; and the units shipped never exceed the units the order's rate prescribes for
      those supply days or the units still unshipped on the newest authorization grant for test strips. The order
      behind a strip refill is the written order its authorization grant rests on. A refill is the first strip refill
      after a newly supplied meter when the program already has a strip refill and the meter ship date on the program
      is later than the ship date of the program's latest strip refill; a program with no strip refill yet has no
      refill after a newly supplied meter, and its first strip refill is the first strip refill of the program.
    params:
    - supply_days_per_shipment
    - strips_per_billing_unit
  inputs:
    history:
    - table: bgm_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: bgm_refill_shipment
        item_code: A4253
    - table: bgm_orders
      aggregate: latest
      field: quantity_per_30_days
      filters:
        event_type: bgm_order_receipt
        item_code: A4253
    - table: bgm_shipments
      aggregate: sum
      field: units
      within_months: 1
      filters:
        event_type: bgm_return_authorization
        item_code: A4253
    - table: bgm_shipments
      aggregate: sum
      field: units
      filters:
        event_type: bgm_refill_shipment
    - category: cgm
      table: cgm_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: cgm_refill_shipment
        item_code: A4239
    cross_category:
    - cgm
- id: bgm_ext_noncovered_strip_charge
  base_policy_refs:
  - bgm_liability_notice
  - bgm_evt_denials_and_appeals
  - bgm_evt_claims
  - bgm_evt_quantity_limits
  overwrite:
  - base_policy: bgm_liability_notice
    superseded_clause: charged at the Larkfield cash price of the units concerned
    replaced_by: >-
      For a non_covered_item charge on test strips that this policy prices, and only for such a charge, the units
      concerned and the price of a unit are the ones stated here, on the Original Medicare tier the Medicare allowed
      amount per unit, with the late-posting and hardship reductions stated here; every other patient charge, and
      every charge for an item other than test strips, stays at the Larkfield cash price of the units concerned
      as bgm_liability_notice states.
  trigger: state_due
  subject:
  - bgm_patient_charge
  computes: amount
  target_tool: post_noncovered_charge_41a38519
  params:
    member_discount_pct: 10
    late_share_over_60: 0.75
    late_share_31_60: 0.9
    hardship_share_recent: 0.6
    hardship_share_older: 0.8
  rule: >-
    When the payer denies a strip claim line that the customer's signed liability notice covers and the denial is
    not appealed but handled as a non-covered amount, Larkfield posts the units concerned to the customer as a non_covered_item
    patient charge; the charge concerns the program's latest claim denial, the claim it denies and the shipment
    that claim bills, and the notice that counts is the program's latest liability notice for test strips. This
    policy prices that charge only when the shipment is a refill of test strips, the denial code is CO-151 and no
    medical record with purpose over_limit_justification is on file for the program, or the denial code is PR-204,
    and the notice that counts was signed on or before the shipment's ship date; it prices no charge on a tier whose
    liability_notice_type is organization_determination_required or not_applicable. Any other denial, among them
    a CO-50 or CO-197 denial and a CO-151 denial while such a medical record is on file, and any denial whose latest
    notice was signed after the ship date, is worked as bgm_evt_denials_and_appeals and bgm_liability_notice provide,
    and this policy posts no charge for it. The standard charge is this: the units concerned are the units that
    notice covers; the price of a unit is Larkfield's billed charge on the denied claim divided by the shipment's
    units; the charge is the units concerned times that price, never for more units than the notice covers or than
    the shipment carried, rounded to cents only at the end. The units the treatment-class allowance gives for a
    shipment's supply days are strips_per_90_days_insulin for an insulin-treated customer and strips_per_90_days_non_insulin
    otherwise, times the supply days divided by 90 and by strips_per_billing_unit, rounded down to whole units.
    Each rule set out below replaces or reduces only the standard quantity it names, the units concerned, the price
    of a unit or the charge, reductions applying after the units and the price are set, and the charge is then capped
    and rounded as the standard method states. The units concerned are, when the denied claim also carries a remittance
    and the denial code is CO-151, the shipment's units above the units the treatment-class allowance gives for
    its supply days; when the denied claim carries no remittance, every unit of the shipment; and otherwise the
    units the notice covers. The price of a unit is, on a tier whose liability_notice_type is abn_cms_r_131 when
    the denied claim carries remittances whose allowed amounts total more than 0 and the treatment-class allowance
    gives at least one unit for the supply days, the allowed amounts on those remittances divided by the units that
    allowance gives; on a tier whose liability_notice_type is plan_member_waiver, the billed charge per unit less
    member_discount_pct percent; and otherwise the billed charge per unit, the billed charge per unit being the
    billed charge on the denied claim divided by the shipment's units, and 0 when the shipment records no units.
    A charge Larkfield posts more than 60 calendar days after the denial's posting date is reduced to late_share_over_60
    of itself, one posted 31 to 60 days after it to late_share_31_60, and one posted within 30 days is not reduced.
    When the program has a hardship application with request status approved that was received within the last 12
    calendar months, the charge is reduced to hardship_share_recent of itself; when its approved hardship application
    is older, to hardship_share_older; and otherwise it is not reduced; a date falls within the last 12 calendar
    months when it is later than the same calendar day 12 months earlier. For a non_covered_item charge on test
    strips that this policy prices, and only for such a charge, the units concerned and the price of a unit are
    the ones stated here, on the Original Medicare tier the Medicare allowed amount per unit, with the late-posting
    and hardship reductions stated here; every other patient charge, and every charge for an item other than test
    strips, stays at the Larkfield cash price of the units concerned as bgm_liability_notice states.
  prerequisite: []
  cross_category: []
  compute:
  - denial_id: LATEST('bgm_billing','bgm_ledger_id', date_field='posting_date', event_type='bgm_claim_denial')
  - denial_code: LATEST('bgm_billing','denial_code', date_field='posting_date', event_type='bgm_claim_denial')
  - denial_posted: LATEST('bgm_billing','posting_date', date_field='posting_date', event_type='bgm_claim_denial')
  - denied_claim: LATEST('bgm_billing','original_bgm_ledger_id', bgm_ledger_id=denial_id)
  - denied_ship: LATEST('bgm_billing','bgm_shipment_id', bgm_ledger_id=denied_claim)
  - claim_billed: LATEST('bgm_billing','billed_amount', bgm_ledger_id=denied_claim) or 0
  - ship_units: LATEST('bgm_shipments','units', bgm_shipment_id=denied_ship) or 0
  - ship_days: LATEST('bgm_shipments','supply_days', bgm_shipment_id=denied_ship) or 0
  - ship_date: LATEST('bgm_shipments','ship_date', bgm_shipment_id=denied_ship) or ''
  - denied_item: LATEST('bgm_shipments','item_code', bgm_shipment_id=denied_ship) or ''
  - notice_date: >-
      LATEST('bgm_orders','notice_date', date_field='notice_date', event_type='bgm_liability_notice_signed', item_code='A4253')
      or ''
  - notice_units_signed: >-
      LATEST('bgm_orders','notice_units', date_field='notice_date', event_type='bgm_liability_notice_signed', item_code='A4253')
      or 0
  - notice_units: notice_units_signed if (notice_date and notice_date <= ship_date) else 0
  - class_allowance_units: >-
      int(((P('strips_per_90_days_insulin') if F('treatment_class') == 'insulin_treated' else P('strips_per_90_days_non_insulin'))
      * ship_days / 90) // P('strips_per_billing_unit'))
  - remit_count: COUNT('bgm_billing', event_type='bgm_claim_adjudication', original_bgm_ledger_id=denied_claim)
  - units_concerned: >-
      MX(0, ship_units - class_allowance_units) if (remit_count > 0 and denial_code == 'CO-151') else (ship_units
      if remit_count == 0 else notice_units)
  - remit_allowed: >-
      SUM('bgm_billing','allowed_amount', event_type='bgm_claim_adjudication', original_bgm_ledger_id=denied_claim)
  - unit_price: >-
      (remit_allowed / class_allowance_units) if (P('liability_notice_type') == 'abn_cms_r_131' and remit_allowed
      > 0 and class_allowance_units > 0) else ((claim_billed / ship_units) * (1 - K('member_discount_pct') / 100)
      if (P('liability_notice_type') == 'plan_member_waiver' and ship_units > 0) else ((claim_billed / ship_units)
      if ship_units > 0 else 0))
  - days_since_denial: DAYS(denial_posted, NOW) if denial_posted else 0
  - late_share: >-
      K('late_share_over_60') if days_since_denial > 60 else (K('late_share_31_60') if days_since_denial > 30 else
      1)
  - hardship_recent: >-
      COUNT('bgm_requests', within_months=12, date_field='received_at', request_type='hardship_application', request_status='approved')
  - hardship_any: COUNT('bgm_requests', request_type='hardship_application', request_status='approved')
  - hardship_share: >-
      K('hardship_share_recent') if hardship_recent > 0 else (K('hardship_share_older') if hardship_any > 0 else
      1)
  - support_records: >-
      COUNT('bgm_orders', event_type='bgm_medical_record_receipt', record_purpose='over_limit_justification')
  - notice_tier: >-
      P('liability_notice_type') != 'organization_determination_required' and P('liability_notice_type') != 'not_applicable'
  - priced_here: >-
      denied_item == 'A4253' and ((denial_code == 'CO-151' and support_records == 0) or denial_code == 'PR-204')
      and notice_tier
  - charged_units: MN(units_concerned, notice_units, ship_units)
  - result: RND(charged_units * unit_price * late_share * hardship_share, 2) if priced_here else 0
  compute_basis:
    denial_id: >-
      When the payer denies a strip claim line that the customer's signed liability notice covers and the denial
      is not appealed but handled as a non-covered amount, Larkfield posts the units concerned to the customer as
      a non_covered_item patient charge; the charge concerns the program's latest claim denial, the claim it denies
      and the shipment that claim bills, and the notice that counts is the program's latest liability notice for
      test strips.
    denial_code: >-
      The units concerned are, when the denied claim also carries a remittance and the denial code is CO-151, the
      shipment's units above the units the treatment-class allowance gives for its supply days; when the denied
      claim carries no remittance, every unit of the shipment; and otherwise the units the notice covers.
    denial_posted: >-
      A charge Larkfield posts more than 60 calendar days after the denial's posting date is reduced to late_share_over_60
      of itself, one posted 31 to 60 days after it to late_share_31_60, and one posted within 30 days is not reduced.
    denied_claim: >-
      When the payer denies a strip claim line that the customer's signed liability notice covers and the denial
      is not appealed but handled as a non-covered amount, Larkfield posts the units concerned to the customer as
      a non_covered_item patient charge; the charge concerns the program's latest claim denial, the claim it denies
      and the shipment that claim bills, and the notice that counts is the program's latest liability notice for
      test strips.
    denied_ship: >-
      When the payer denies a strip claim line that the customer's signed liability notice covers and the denial
