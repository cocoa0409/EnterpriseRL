- id: bgm_evt_refill_shipment
  subject: [bgm_refill_shipment]
  rule: >-
    A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
    or closed receives no refill. Each refill draws on one authorization grant of the program, recorded on the shipment,
    and the ship date must be on or before the valid-through date on the authorization being drawn. The units shipped
    may not exceed the program's authorized units remaining, and the supply days of a shipment are the tier's supply_days_per_shipment,
    shortened to the whole 30-day blocks that remain before the authorization's valid-through date when fewer remain;
    the units and pieces follow from the supply days under bgm_evt_quantity_limits. On tiers where refill_confirmation_required
    is true, the refill ships only after the customer personally confirms, for this shipment, that they are still
    using the item and how much supply they have on hand; the confirmation date is recorded on the shipment, Larkfield
    never ships those tiers automatically, and Larkfield's own refill reminder for those tiers is made no sooner
    than refill_contact_lead_days calendar days before the planned ship date. On the self-pay tier refills ship
    on the subscription schedule without a per-shipment confirmation. The next refill of the same item ships no
    earlier than refill_ship_lead_days calendar days before the end of the supply of the previous refill shipment
    of that item, counted in calendar days: the previous refill's ship date plus its supply days gives the end of
    its supply, the earliest permitted ship date is refill_ship_lead_days calendar days before that end date, and
    shipping on that earliest date is allowed. A replacement shipment never counts as the previous refill. The coverage
    record the program bills must have been verified with the payer within coverage_reverification_months calendar
    months before the ship date, as shown by the coverage record's last verified date; the self-pay tier has no
    coverage to verify. Standard ground shipping is free on insured tiers; on the self-pay tier standard shipping
    costs standard_shipping_fee_usd, posted as a patient charge, unless the shipment's cash-price total reaches
    free_shipping_threshold_usd. Expedited shipping is provided on the customer's request for expedited_shipping_fee_usd,
    posted as a patient charge because no payer covers delivery speed, and is recorded as expedited_no_charge when
    the expedite only makes up for a delay Larkfield caused. A refill on a payer tier is billed to the payer by
    claim with the ship date as the date of service; a refill on the self-pay tier is charged to the customer at
    the Larkfield cash price. On tiers where inpatient_hold_required is true, nothing ships while the customer is
    an inpatient in a hospital or skilled nursing facility; the program is held under bgm_holds_and_closure.
  eligibility:
  - id: program_active
    applies_to: [bgm_refill_shipment]
    kind: state
    condition: >-
      A refill ships only while the program is active; a program in referral_received, pending_authorization, on_hold
      or closed receives no refill.
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
    state_contract:
      field: bgm_programs.status
      allowed: [active]
  - id: authorization_valid_on_ship_date
    applies_to: [bgm_refill_shipment]
    kind: authorization
    condition: the ship date must be on or before the valid-through date on the authorization being drawn.
    evidence_fields: [bgm_orders.bgm_order_id, bgm_orders.event_type, bgm_orders.valid_from, bgm_orders.valid_through]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_orders.bgm_order_id]
      action_bindings: {bgm_orders.bgm_order_id: bgm_order_id}
  - id: units_within_authorization
    applies_to: [bgm_refill_shipment]
    kind: authorization
    condition: The units shipped may not exceed the program's authorized units remaining
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.authorized_units_remaining]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  - id: customer_confirmation
    applies_to: [bgm_refill_shipment]
    kind: caller_fact
    condition: >-
      On tiers where refill_confirmation_required is true, the refill ships only after the customer personally confirms,
      for this shipment, that they are still using the item and how much supply they have on hand
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  - id: refill_not_too_early
    applies_to: [bgm_refill_shipment]
    kind: time
    condition: >-
      The next refill of the same item ships no earlier than refill_ship_lead_days calendar days before the end
      of the supply of the previous refill shipment of that item
    evidence_fields: [bgm_shipments.bgm_shipment_id, bgm_shipments.ship_date, bgm_shipments.supply_days, bgm_shipments.item_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_shipments.bgm_shipment_id]
      action_bindings: {bgm_shipments.bgm_shipment_id: previous_bgm_shipment_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the end of the supply of the previous refill shipment of that item
      anchor_source: bgm_shipments.ship_date
      relation: not_before
      duration_source: variants.refill_ship_lead_days
      unit: calendar_days
      counting_rule: >-
        the previous refill's ship date plus its supply days gives the end of its supply, the earliest permitted
        ship date is refill_ship_lead_days calendar days before that end date, and shipping on that earliest date
        is allowed.
      boundary: inclusive
  - id: coverage_recently_verified
    applies_to: [bgm_refill_shipment]
    kind: time
    condition: >-
      The coverage record the program bills must have been verified with the payer within coverage_reverification_months
      calendar months before the ship date, as shown by the coverage record's last verified date
    evidence_fields: [coverages.coverage_id, coverages.last_verified_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [coverages.coverage_id]
      action_bindings: {coverages.coverage_id: coverage_id}
    temporal_basis: {clock: frozen_time, anchor_event: the coverage record's last verified date, anchor_source: coverages.last_verified_date,
      relation: not_after, duration_source: variants.coverage_reverification_months, unit: calendar_months, counting_rule: within
        coverage_reverification_months calendar months before the ship date, boundary: inclusive}
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Testing Supplies Commercial HMO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Testing Supplies Commercial PPO Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Testing Supplies Medicare Advantage Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Testing Supplies Original Medicare Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
      Testing Supplies Medicaid Program: {supply_days_per_shipment: =supply_days_per_shipment, refill_confirmation_required: =refill_confirmation_required,
        refill_contact_lead_days: =refill_contact_lead_days, refill_ship_lead_days: =refill_ship_lead_days, coverage_reverification_months: =coverage_reverification_months,
        standard_shipping_fee_usd: =standard_shipping_fee_usd, free_shipping_threshold_usd: =free_shipping_threshold_usd,
        expedited_shipping_fee_usd: =expedited_shipping_fee_usd, inpatient_hold_required: =inpatient_hold_required}
  formula: {earliest_ship_date_offset_days: supply_days - refill_ship_lead_days}
- id: bgm_evt_replacement_and_delivery
  subject: [bgm_replacement_shipment, bgm_delivery_confirmation]
  rule: >-
    A replacement ships at no charge, draws no authorized units and is never billed to a payer; it is recorded against
    the original shipment it replaces, and its quantity never exceeds the units of that original shipment that were
    lost, damaged, not received or defective. A package is lost in transit when no proof of delivery is on file
    for it and carrier_trace_business_days business days (Monday to Friday, excluding US federal holidays) have
    passed after the carrier's expected delivery date; a package lost in transit is always replaced, expedited at
    no charge, and does not count toward any courtesy limit, because Larkfield bears the risk until delivery. A
    package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
    calendar days after the delivery date on the proof of delivery for that package, counted in calendar days from
    that delivery date with the last day allowed; a later damage report is not replaced. A package the proof of
    delivery shows as delivered but the customer reports not received is replaced as a courtesy only while the program's
    courtesy reships over the rolling 12 months ending on the reship date, counted by bgm_msr_courtesy_reships_12m,
    are fewer than courtesy_reships_per_12_months; beyond that the customer may buy the item at the cash price or
    wait for the next eligible refill. A meter that fails within meter_warranty_months calendar months of its delivery
    date is replaced by its manufacturer under warranty through the manufacturer's customer line. Larkfield replaces
    as product_defect only an item that was defective as shipped - expired or short-dated strips, strips that do
    not match the meter on the program, a broken vial seal, or a manufacturer-recalled lot - reported no later than
    defect_report_days calendar days after the delivery date. A proof of delivery is recorded as received from the
    carrier, with a signature where the tier or item requires signature_required_on_delivery, and it fixes the delivery
    date that return, damage and warranty windows count from; a package without a proof of delivery has no delivery
    date.
  eligibility:
  - id: damage_report_window
    applies_to: [bgm_replacement_shipment]
    kind: time
    condition: >-
      A package damaged in transit is replaced when the customer reports the damage no later than damage_report_days
      calendar days after the delivery date on the proof of delivery for that package
    evidence_fields: [bgm_shipments.original_bgm_shipment_id, bgm_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_shipments.original_bgm_shipment_id]
      action_bindings: {bgm_shipments.original_bgm_shipment_id: original_bgm_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that package,
      anchor_source: bgm_shipments.delivery_date, relation: not_after, duration_source: variants.damage_report_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: courtesy_limit
    applies_to: [bgm_replacement_shipment]
    kind: dedup
    condition: >-
      A package the proof of delivery shows as delivered but the customer reports not received is replaced as a
      courtesy only while the program's courtesy reships over the rolling 12 months ending on the reship date, counted
      by bgm_msr_courtesy_reships_12m, are fewer than courtesy_reships_per_12_months
    evidence_fields: [bgm_shipments.bgm_program_id, bgm_shipments.replacement_reason, bgm_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_shipments.bgm_program_id]
      action_bindings: {bgm_shipments.bgm_program_id: bgm_program_id}
    dedup_contract:
      table: bgm_shipments
      mode: separate_record
      object_bindings: {bgm_program_id: bgm_program_id}
      duplicate_filters:
        replacement_reason: [delivered_not_received]
      distinct_fields: [ship_date]
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Testing Supplies Commercial HMO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Testing Supplies Commercial PPO Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Testing Supplies Medicare Advantage Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Testing Supplies Original Medicare Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
      Testing Supplies Medicaid Program: {carrier_trace_business_days: =carrier_trace_business_days, damage_report_days: =damage_report_days,
        courtesy_reships_per_12_months: =courtesy_reships_per_12_months, defect_report_days: =defect_report_days,
        signature_required_on_delivery: =signature_required_on_delivery}
  measures: [bgm_msr_courtesy_reships_12m]
- id: bgm_evt_returns
  subject: [bgm_return_authorization, bgm_return_receipt]
  rule: >-
    Larkfield accepts a return only of items that are unopened and in their original sealed packaging; opened medical
    supplies are never returned to stock or credited on any tier where opened_returnable is false, because a supply
    that has left Larkfield's control cannot be re-dispensed to another patient. A return is authorized only when
    the customer asks for it no later than return_window_days calendar days after the delivery date on the proof
    of delivery for that shipment, counted in calendar days from that delivery date with the last day allowed; a
    shipment without a proof of delivery cannot be returned, and a package damaged in transit is handled as a replacement,
    not a return. The units authorized for return never exceed the units of that shipment, less any units of it
    already authorized for return. When the warehouse accepts the returned units as unopened_sealed, the units are
    credited back to the authorization they were drawn from; a payer-billed shipment is then re-billed by a void
    claim (all units returned) or a corrected claim (some units returned), and a self-pay shipment is credited to
    the customer's balance at the price paid for the returned units less restocking_fee_pct percent. Returned units
    the warehouse finds opened are not accepted and no receipt is recorded. A strip vial or lancet box whose seal
    is broken is opened, and a meter that has been powered on is opened; neither is returnable.
  eligibility:
  - id: return_window
    applies_to: [bgm_return_authorization]
    kind: time
    condition: >-
      A return is authorized only when the customer asks for it no later than return_window_days calendar days after
      the delivery date on the proof of delivery for that shipment
    evidence_fields: [bgm_shipments.original_bgm_shipment_id, bgm_shipments.delivery_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_shipments.original_bgm_shipment_id]
      action_bindings: {bgm_shipments.original_bgm_shipment_id: original_bgm_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the delivery date on the proof of delivery for that shipment,
      anchor_source: bgm_shipments.delivery_date, relation: not_after, duration_source: variants.return_window_days,
      unit: calendar_days, counting_rule: counted in calendar days from that delivery date with the last day allowed,
      boundary: inclusive}
  - id: unopened_only
    applies_to: [bgm_return_authorization]
    kind: caller_fact
    condition: Larkfield accepts a return only of items that are unopened and in their original sealed packaging
    evidence_fields: [bgm_shipments.bgm_shipment_id, bgm_shipments.item_code]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [bgm_shipments.bgm_shipment_id]
      action_bindings: {bgm_shipments.bgm_shipment_id: original_bgm_shipment_id}
  - id: no_double_return
    applies_to: [bgm_return_authorization]
    kind: dedup
    condition: >-
      The units authorized for return never exceed the units of that shipment, less any units of it already authorized
      for return.
    evidence_fields: [bgm_shipments.original_bgm_shipment_id, bgm_shipments.event_type, bgm_shipments.units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_shipments.original_bgm_shipment_id]
      action_bindings: {bgm_shipments.original_bgm_shipment_id: original_bgm_shipment_id}
    dedup_contract:
      table: bgm_shipments
      mode: separate_record
      object_bindings: {original_bgm_shipment_id: original_bgm_shipment_id, item_code: item_code}
      duplicate_filters:
        event_type: [bgm_return_authorization]
      distinct_fields: [rma_issue_date]
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Testing Supplies Commercial HMO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Testing Supplies Commercial PPO Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Testing Supplies Medicare Advantage Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Testing Supplies Original Medicare Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
      Testing Supplies Medicaid Program: {return_window_days: =return_window_days, restocking_fee_pct: =restocking_fee_pct,
        opened_returnable: =opened_returnable}
- id: bgm_evt_claims
  subject: [bgm_claim_submission, bgm_claim_adjudication]
  rule: >-
    Every refill shipped on a payer tier is billed to the payer named by the program's coverage record by one original
    claim per shipment, with the ship date as the date of service; the self-pay tier files no claims. An original
    claim must be transmitted no later than timely_filing_days calendar days after the date of service of the shipment
    it bills, counted in calendar days from that ship date with the last day allowed; a shipment whose filing limit
    has passed is billed to neither the payer nor the customer and is written off by Larkfield. A corrected claim
    replaces an original claim when the units, item or dates billed were wrong or some of the units were returned,
    and a void claim withdraws an original claim when all of its units were returned; both reference the same shipment
    as the original. When a remittance posts, the patient responsibility added to the customer's balance is the
    allowed amount less the amount the payer paid, which the remittance itemizes as deductible, coinsurance and
    copay; Larkfield never posts more than that and never bills the customer the difference between its billed charge
    and the allowed amount on a payer tier. On tiers where crossover_to_secondary is true and the customer has an
    in-effect secondary coverage record, the patient responsibility is crossed over to the secondary payer, and
    the secondary payer's payment is posted as a balance adjustment with reason secondary_payer_payment against
    that remittance before any amount is statemented; on other tiers a secondary coverage is billed by Larkfield's
    billing team only after the primary remittance posts. On the Medicaid tier a customer is never billed for a
    Medicaid-covered item beyond the patient responsibility the Medicaid remittance shows.
  eligibility:
  - id: timely_filing
    applies_to: [bgm_claim_submission]
    kind: time
    condition: >-
      An original claim must be transmitted no later than timely_filing_days calendar days after the date of service
      of the shipment it bills
    evidence_fields: [bgm_shipments.bgm_shipment_id, bgm_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_shipments.bgm_shipment_id]
      action_bindings: {bgm_shipments.bgm_shipment_id: bgm_shipment_id}
    temporal_basis: {clock: frozen_time, anchor_event: the date of service of the shipment it bills, anchor_source: bgm_shipments.ship_date,
      relation: not_after, duration_source: variants.timely_filing_days, unit: calendar_days, counting_rule: counted
        in calendar days from that ship date with the last day allowed, boundary: inclusive}
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Testing Supplies Commercial HMO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Testing Supplies Commercial PPO Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Testing Supplies Medicare Advantage Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Testing Supplies Original Medicare Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
      Testing Supplies Medicaid Program: {timely_filing_days: =timely_filing_days, coinsurance_pct: =coinsurance_pct,
        copay_per_30_day_supply_usd: =copay_per_30_day_supply_usd, deductible_applies: =deductible_applies, crossover_to_secondary: =crossover_to_secondary}
  formula: {amount: allowed_amount - payer_paid_amount}
- id: bgm_evt_denials_and_appeals
  subject: [bgm_claim_denial, bgm_appeal_filing]
  rule: >-
    A denial is worked by its denial code, and the code alone decides the route; the self-pay tier has no denials
    or appeals. CO-16 (claim lacks information) is unprocessable and is never appealed: it is cured only by a corrected
    claim transmitted no later than corrected_claim_window_days calendar days after the denial's posting date. CO-50
    (not medically necessary), CO-151 (frequency or quantity not supported) and CO-197 (authorization absent) are
    appealable. A first-level appeal may be filed no later than appeal_window_days calendar days after the posting
    date of the denial it appeals, counted in calendar days from that posting date with the last day allowed; a
    CO-197 denial is appealed only when an authorization grant valid on the date of service is on file, and a CO-151
    denial only when a medical record supporting the quantity, dated on or before the date of service, is on file;
    otherwise the denial is not appealed and is handled as a non-covered amount under bgm_liability_notice. An appeal
    decision that upholds the denial posts as a new denial whose original posting is the appeal filing. A second-level
    appeal may be filed only against such an upheld first-level decision, no later than second_level_appeal_window_days
    calendar days after its posting date; where second_level_appeal_window_days is 0 there is no customer-filed
    second level on the tier, and on the Medicare Advantage tier the plan forwards an upheld denial to the independent
    review entity itself. One appeal is filed per level per denial; a denial already appealed at a level is not
    appealed again at that level. CO-29 (timely filing expired) is never appealed and never billed to the customer;
    Larkfield writes it off with a billing_correction adjustment. PR-204 (not covered under the plan) becomes the
    customer's responsibility only under bgm_liability_notice; otherwise Larkfield absorbs it.
  eligibility:
  - id: appeal_window
    applies_to: [bgm_appeal_filing]
    kind: time
    condition: >-
      A first-level appeal may be filed no later than appeal_window_days calendar days after the posting date of
      the denial it appeals
    evidence_fields: [bgm_billing.bgm_ledger_id, bgm_billing.posting_date, bgm_billing.denial_code]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_billing.bgm_ledger_id]
      action_bindings: {bgm_billing.bgm_ledger_id: original_bgm_ledger_id}
    temporal_basis: {clock: frozen_time, anchor_event: the posting date of the denial it appeals, anchor_source: bgm_billing.posting_date,
      relation: not_after, duration_source: variants.appeal_window_days, unit: calendar_days, counting_rule: counted
        in calendar days from that posting date with the last day allowed, boundary: inclusive}
  - id: one_appeal_per_level
    applies_to: [bgm_appeal_filing]
    kind: dedup
    condition: One appeal is filed per level per denial; a denial already appealed at a level is not appealed again
      at that level.
    evidence_fields: [bgm_billing.original_bgm_ledger_id, bgm_billing.appeal_level, bgm_billing.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_billing.original_bgm_ledger_id]
      action_bindings: {bgm_billing.original_bgm_ledger_id: original_bgm_ledger_id}
    dedup_contract:
      table: bgm_billing
      mode: separate_record
      object_bindings: {original_bgm_ledger_id: original_bgm_ledger_id, appeal_level: appeal_level}
      duplicate_filters:
        event_type: [bgm_appeal_filing]
      distinct_fields: [posting_date]
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Testing Supplies Commercial HMO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Testing Supplies Commercial PPO Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Testing Supplies Medicare Advantage Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Testing Supplies Original Medicare Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
      Testing Supplies Medicaid Program: {appeal_window_days: =appeal_window_days, second_level_appeal_window_days: =second_level_appeal_window_days,
        corrected_claim_window_days: =corrected_claim_window_days}
- id: bgm_liability_notice
  subject: [bgm_liability_notice_signed, bgm_patient_charge]
  rule: >-
    When an item or quantity the customer wants is expected not to be paid by the payer - above the tier's allowance
    without supporting documentation, an item the tier does not cover, or a replacement before the payer's replacement
    interval - Larkfield supplies it billable to the customer only after the customer signs the tier's liability
    notice (liability_notice_type) for that item and quantity before the ship date; the customer signs it personally,
    and no Larkfield representative can sign it for them. On the Original Medicare tier the notice is the CMS Advance
    Beneficiary Notice of Noncoverage (form CMS-R-131); the claim is still submitted to Medicare with the notice
    on file, and the customer becomes liable only for a line Medicare denies. On the Medicare Advantage tier no
    notice can make the member liable; the member becomes liable only for an item for which the plan has issued
    a pre-service organization determination denial, recorded as a prior authorization denial for that item. On
    the self-pay tier no notice applies, because every item is priced at the Larkfield cash price. A patient charge
    is posted only as one of these charge types: self_pay_price (a self-pay refill at the cash price), standard_shipping
    (a self-pay shipment below the free-shipping threshold), expedited_shipping (a customer-requested expedite),
    or non_covered_item (an item or quantity covered by a signed liability notice, or by a Medicare Advantage organization
    determination denial, that the payer denied, charged at the Larkfield cash price of the units concerned). A
    non_covered_item charge requires a liability notice signed on or before the ship date covering that item and
    at least those units, or on the Medicare Advantage tier the plan's organization determination denial for that
    item; without it the amount is Larkfield's write-off and is never billed to the customer.
  eligibility:
  - id: notice_before_charge
    applies_to: [bgm_patient_charge]
    kind: authorization
    condition: >-
      A non_covered_item charge requires a liability notice signed on or before the ship date covering that item
      and at least those units, or on the Medicare Advantage tier the plan's organization determination denial for
      that item
    evidence_fields: [bgm_orders.bgm_program_id, bgm_orders.item_code, bgm_orders.event_type, bgm_orders.notice_date,
      bgm_orders.notice_units]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_orders.bgm_program_id, bgm_orders.item_code]
      action_bindings: {bgm_orders.bgm_program_id: bgm_program_id, bgm_orders.item_code: item_code}
  - id: customer_signs
    applies_to: [bgm_liability_notice_signed]
    kind: caller_fact
    condition: the customer signs it personally, and no Larkfield representative can sign it for them.
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.customer_id]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Testing Supplies Commercial HMO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Testing Supplies Commercial PPO Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Testing Supplies Medicare Advantage Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Testing Supplies Original Medicare Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
      Testing Supplies Medicaid Program: {liability_notice_type: =liability_notice_type, expedited_shipping_fee_usd: =expedited_shipping_fee_usd,
        standard_shipping_fee_usd: =standard_shipping_fee_usd}
- id: bgm_evt_patient_account
  subject: [bgm_patient_payment, bgm_balance_adjustment, bgm_patient_refund]
  rule: >-
    The customer's balance on the program is the running total of its patient-balance postings: remittance patient
    responsibility, patient charges and refunds add to it, and payments and balance adjustments reduce it; a payment
    is applied to the oldest unpaid posting first. A balance adjustment is posted only for one of these reasons,
    each against the one posting it adjusts and never for more than that posting's unpaid remainder: return_credit
    (an accepted self-pay return, for the price paid for the returned units less restocking_fee_pct percent); secondary_payer_payment
    (the amount a secondary payer paid against a remittance's patient responsibility); hardship_waiver; small_balance_writeoff;
    billing_correction (a posting made in error, or a timely-filing write-off). A hardship waiver is granted only
    on tiers where hardship_waiver_allowed is true, only for postings named on a hardship application whose request
    status is approved, and only after Larkfield's financial counseling team confirms household income at or below
    hardship_income_fpl_pct percent of the HHS poverty guideline; it is never granted routinely, never advertised
    and never granted on the customer's statement alone. A small-balance write-off is made only when the whole remaining
    balance of the program is greater than 0.00 and no more than small_balance_writeoff_usd; on tiers where small_balance_writeoff_usd
    is 0.00 no write-off is made and the balance is statemented. A credit balance - a balance below zero - is refunded
    to the original payment method no later than credit_balance_refund_days calendar days after the posting date
    of the entry that created it, unless the customer asks in writing to keep it on account; a refund never exceeds
    the credit. A payment plan is offered only on tiers where payment_plan_max_months is greater than 0, for a balance
    of at least payment_plan_min_balance_usd, in no more than payment_plan_max_months monthly installments of at
    least payment_plan_min_monthly_usd; it is created as a payment plan request the customer accepts, and while
    an approved plan's installments are current the balance it covers is left out of the past-due test measured
    by bgm_msr_past_due_amount.
  eligibility:
  - id: hardship_approved
    applies_to: [bgm_balance_adjustment]
    kind: authorization
    condition: >-
      A hardship waiver is granted only on tiers where hardship_waiver_allowed is true, only for postings named
      on a hardship application whose request status is approved
    evidence_fields: [bgm_requests.bgm_request_id, bgm_requests.request_type, bgm_requests.request_status, bgm_requests.bgm_ledger_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_requests.bgm_ledger_id]
      action_bindings: {bgm_requests.bgm_ledger_id: original_bgm_ledger_id}
  - id: small_balance_ceiling
    applies_to: [bgm_balance_adjustment]
    kind: authorization
    condition: >-
      A small-balance write-off is made only when the whole remaining balance of the program is greater than 0.00
      and no more than small_balance_writeoff_usd
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.patient_balance_due]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Testing Supplies Commercial HMO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Testing Supplies Commercial PPO Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Testing Supplies Medicare Advantage Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Testing Supplies Original Medicare Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
      Testing Supplies Medicaid Program: {hardship_waiver_allowed: =hardship_waiver_allowed, hardship_income_fpl_pct: =hardship_income_fpl_pct,
        small_balance_writeoff_usd: =small_balance_writeoff_usd, credit_balance_refund_days: =credit_balance_refund_days,
        payment_plan_min_balance_usd: =payment_plan_min_balance_usd, payment_plan_max_months: =payment_plan_max_months,
        payment_plan_min_monthly_usd: =payment_plan_min_monthly_usd, restocking_fee_pct: =restocking_fee_pct}
  measures: [bgm_msr_past_due_amount]
- id: bgm_holds_and_closure
  subject: [bgm_program_hold, bgm_program_resume, bgm_program_administrative_close]
  rule: >-
    An active program is placed on hold for exactly one recorded reason: inpatient_stay (the customer or caregiver
    reports a current inpatient admission to a hospital or skilled nursing facility, on tiers where inpatient_hold_required
    is true); coverage_lapse (the coverage record the program bills has a termination date earlier than the date
    of the write and no other in-effect coverage on file fixes the program's tier); documentation_lapse (no authorization
    grant of the program is valid on the date of the write); past_due_balance (on tiers where past_due_hold_days
    is greater than 0, the past-due amount measured by bgm_msr_past_due_amount is at least past_due_hold_min_usd
    and no approved payment plan covers it); or customer_request (the customer asks to pause shipments). A hold
    is placed only for a reason that is true on the date of the write. A program on hold resumes only when its recorded
    hold reason has cleared: discharge reported for inpatient_stay; an in-effect coverage on file and written onto
    the program for coverage_lapse; an authorization grant valid on the date of the write for documentation_lapse;
    a past-due amount below past_due_hold_min_usd or an approved payment plan for past_due_balance; the customer's
    own request for customer_request. A program closes administratively, with the matching closure reason, in exactly
    these cases: documentation_not_received, for a program still in referral_received or pending_authorization once
    the date of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior
    authorization decision pending; authorization_denied, when a payer prior authorization denial stands and no
    new request is pending; hold_limit_reached, for a program on hold once the date of the write is later than the
    hold start date plus hold_max_days calendar days; coverage_ended, for a program on hold for coverage_lapse whose
    customer reports no replacement coverage; customer_discontinued, when the customer confirms the cancellation
    of a program on hold; deceased, when Larkfield's records team has recorded the customer's death. Day counts
    in this policy are calendar days counted from the named date, and a closure is made only on a day strictly later
    than the named date plus the stated days.
  eligibility:
  - id: inpatient_reported
    applies_to: [bgm_program_hold]
    kind: caller_fact
    condition: >-
      the customer or caregiver reports a current inpatient admission to a hospital or skilled nursing facility,
      on tiers where inpatient_hold_required is true
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.variant_name]
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  - id: hold_reason_true
    applies_to: [bgm_program_hold]
    kind: authorization
    condition: A hold is placed only for a reason that is true on the date of the write.
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.coverage_id, coverages.termination_date, bgm_orders.valid_through,
      bgm_programs.patient_balance_due]
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  - id: hold_limit_elapsed
    applies_to: [bgm_program_administrative_close]
    kind: time
    condition: >-
      hold_limit_reached, for a program on hold once the date of the write is later than the hold start date plus
      hold_max_days calendar days
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.hold_start_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold start date
      anchor_source: bgm_programs.hold_start_date
      relation: not_before
      duration_source: variants.hold_max_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  - id: referral_window_elapsed
    applies_to: [bgm_program_administrative_close]
    kind: time
    condition: >-
      documentation_not_received, for a program still in referral_received or pending_authorization once the date
      of the write is later than the enrolled date plus referral_docs_window_days calendar days with no prior authorization
      decision pending
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.enrolled_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrolled date
      anchor_source: bgm_programs.enrolled_date
      relation: not_before
      duration_source: variants.referral_docs_window_days
      unit: calendar_days
      counting_rule: >-
        Day counts in this policy are calendar days counted from the named date, and a closure is made only on a
        day strictly later than the named date plus the stated days.
      boundary: exclusive
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Testing Supplies Commercial HMO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Testing Supplies Commercial PPO Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Testing Supplies Medicare Advantage Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Testing Supplies Original Medicare Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
      Testing Supplies Medicaid Program: {inpatient_hold_required: =inpatient_hold_required, past_due_hold_days: =past_due_hold_days,
        past_due_hold_min_usd: =past_due_hold_min_usd, hold_max_days: =hold_max_days, referral_docs_window_days: =referral_docs_window_days}
  measures: [bgm_msr_past_due_amount]
- id: bgm_discontinuation
  subject: [bgm_program_discontinue]
  rule: >-
    Only the customer can end an active program: Larkfield records the cancellation as a program cancellation request,
    and the program closes only when the customer personally confirms that request. A confirmed cancellation closes
    the program with closure_reason customer_discontinued, or changed_supplier when the customer states they are
    moving these supplies to another supplier; a cancellation of a program on hold is closed under bgm_holds_and_closure.
    Ending a program carries no fee and cancels nothing the customer already owes: the balance stays payable, credit
    balances are still refunded under bgm_evt_patient_account, and unopened items delivered within the return window
    stay returnable under bgm_evt_returns. Authorized units remaining on a closed program lapse and are never shipped;
    a later restart needs a new referral and a new program. A package already shipped is not recalled.
  eligibility:
  - id: cancellation_confirmed
    applies_to: [bgm_program_discontinue]
    kind: authorization
    condition: >-
      Larkfield records the cancellation as a program cancellation request, and the program closes only when the
      customer personally confirms that request.
    evidence_fields: [bgm_requests.bgm_request_id, bgm_requests.bgm_program_id, bgm_requests.request_type, bgm_requests.request_status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_requests.bgm_program_id]
      action_bindings: {bgm_requests.bgm_program_id: bgm_program_id}
- id: bgm_agg_multi_holding
  subject: [bgm_program_enroll]
  rule: >-
    A customer holds at most max_per_customer testing supplies program at a time across every tier, because a payer
    covers one meter and one strip allowance per beneficiary. A new testing supplies program is opened only when
    the customer has no testing supplies program in referral_received, pending_authorization, active or on_hold;
    a new meter, treatment change or new insurance is written as a program change on the existing program, and a
    closed program does not count.
  eligibility:
  - id: one_open_program
    applies_to: [bgm_program_enroll]
    kind: dedup
    condition: >-
      A new testing supplies program is opened only when the customer has no testing supplies program in referral_received,
      pending_authorization, active or on_hold
    evidence_fields: [bgm_programs.customer_id, bgm_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.customer_id]
      action_bindings: {bgm_programs.customer_id: customer_id}
    dedup_contract:
      table: bgm_programs
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [referral_received, pending_authorization, active, on_hold]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: bgm_evt_quantity_limits
  subject: [bgm_refill_shipment, bgm_replacement_shipment]
  rule: >-
    The strips a refill may ship are limited by the tier's allowance for the program's treatment class over the
    rolling 90 days ending on the ship date: strips_per_90_days_insulin for an insulin-treated customer and strips_per_90_days_non_insulin
    otherwise, both counted by bgm_msr_strips_shipped_90d including the refill being shipped, and further limited
    by the quantity on the written order. While the customer holds an active CGM program, the allowance is the lower
    of the treatment-class allowance and strips_per_90_days_with_cgm, under bgm_combo_cgm_backup. A quantity above
    the allowance is covered only when a medical record with purpose over_limit_justification, documenting the testing
    frequency the practitioner ordered and the customer's testing log, is dated no more than high_utilization_record_months
    calendar months before the ship date; the allowance then becomes the testing frequency documented in that record
    times 90 days, and without such a record an above-allowance quantity ships only under bgm_liability_notice at
    cash_price_by_item. Units are whole billing units: strips ship strips_per_billing_unit to a unit (A4253) and
    lancets lancets_per_billing_unit to a unit (A4259), and the lancets covered are lancets_per_strip_allowed for
    every strip covered; quantities are rounded down to whole units within the allowance. Control solution (A4256)
    is covered at control_solution_per_90_days unit per rolling 90 days, a lancing device (A4258) no sooner than
    lancing_device_replacement_months calendar months after the previous one, and a meter (E0607) no sooner than
    meter_replacement_months calendar months after the meter ship date on the program, counted in calendar months
    from that ship date with the same calendar day allowed (the last day of the month when that day does not exist);
    on the self-pay tier every item is sold at cash_price_by_item without a quantity cap beyond the written order.
    A replacement never exceeds the units of the shipment it replaces and never counts toward the allowance.
  eligibility:
  - id: strip_allowance
    applies_to: [bgm_refill_shipment]
    kind: authorization
    condition: >-
      The strips a refill may ship are limited by the tier's allowance for the program's treatment class over the
      rolling 90 days ending on the ship date
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.treatment_class, bgm_shipments.units, bgm_shipments.ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  - id: meter_interval
    applies_to: [bgm_refill_shipment]
    kind: time
    condition: a meter (E0607) no sooner than meter_replacement_months calendar months after the meter ship date
      on the program
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.meter_ship_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the meter ship date on the program
      anchor_source: bgm_programs.meter_ship_date
      relation: not_before
      duration_source: variants.meter_replacement_months
      unit: calendar_months
      counting_rule: >-
        counted in calendar months from that ship date with the same calendar day allowed (the last day of the month
        when that day does not exist)
      boundary: inclusive
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {strips_per_90_days_insulin: =strips_per_90_days_insulin, strips_per_90_days_non_insulin: =strips_per_90_days_non_insulin,
        strips_per_90_days_with_cgm: =strips_per_90_days_with_cgm, high_utilization_record_months: =high_utilization_record_months,
        meter_replacement_months: =meter_replacement_months}
      Testing Supplies Commercial HMO Program: {strips_per_90_days_insulin: =strips_per_90_days_insulin, strips_per_90_days_non_insulin: =strips_per_90_days_non_insulin,
        strips_per_90_days_with_cgm: =strips_per_90_days_with_cgm, high_utilization_record_months: =high_utilization_record_months,
        meter_replacement_months: =meter_replacement_months}
      Testing Supplies Commercial PPO Program: {strips_per_90_days_insulin: =strips_per_90_days_insulin, strips_per_90_days_non_insulin: =strips_per_90_days_non_insulin,
        strips_per_90_days_with_cgm: =strips_per_90_days_with_cgm, high_utilization_record_months: =high_utilization_record_months,
        meter_replacement_months: =meter_replacement_months}
      Testing Supplies Medicare Advantage Program: {strips_per_90_days_insulin: =strips_per_90_days_insulin, strips_per_90_days_non_insulin: =strips_per_90_days_non_insulin,
        strips_per_90_days_with_cgm: =strips_per_90_days_with_cgm, high_utilization_record_months: =high_utilization_record_months,
        meter_replacement_months: =meter_replacement_months}
      Testing Supplies Original Medicare Program: {strips_per_90_days_insulin: =strips_per_90_days_insulin, strips_per_90_days_non_insulin: =strips_per_90_days_non_insulin,
        strips_per_90_days_with_cgm: =strips_per_90_days_with_cgm, high_utilization_record_months: =high_utilization_record_months,
        meter_replacement_months: =meter_replacement_months}
      Testing Supplies Medicaid Program: {strips_per_90_days_insulin: =strips_per_90_days_insulin, strips_per_90_days_non_insulin: =strips_per_90_days_non_insulin,
        strips_per_90_days_with_cgm: =strips_per_90_days_with_cgm, high_utilization_record_months: =high_utilization_record_months,
        meter_replacement_months: =meter_replacement_months}
  measures: [bgm_msr_strips_shipped_90d]
  formula: {when: item_code == "A4253", max_strip_units_insulin_treated: strips_per_90_days_insulin / strips_per_billing_unit}
- id: bgm_preferred_meter
  subject: [bgm_program_enroll, bgm_program_change, bgm_refill_shipment]
  rule: >-
    Strips are covered only for the meter written on the program, and a meter is covered only when its model is
    on the tier's preferred_meter_models list. On tiers where non_preferred_meter_requires_exception is true, a
    meter that is not on the list, and strips for it, are covered only after the payer approves a formulary exception,
    recorded as an authorization grant for E0607 with basis payer_prior_authorization; until then the customer may
    switch to a preferred meter on a new written order, or receive the non-preferred meter and its strips under
    bgm_liability_notice. On tiers where non_preferred_meter_requires_exception is false, every listed model is
    covered. A change of meter is written as a program change only from a new written order naming the new meter,
    and strips for the old meter are not shipped after the change.
  eligibility:
  - id: strips_match_meter
    applies_to: [bgm_refill_shipment]
    kind: authorization
    condition: >-
      Strips are covered only for the meter written on the program, and a meter is covered only when its model is
      on the tier's preferred_meter_models list.
    evidence_fields: [bgm_programs.bgm_program_id, bgm_programs.meter_model, bgm_programs.variant_name]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [bgm_programs.bgm_program_id]
      action_bindings: {bgm_programs.bgm_program_id: bgm_program_id}
  params:
    per_tier:
      Testing Supplies Self-Pay Program: {preferred_meter_models: =preferred_meter_models, non_preferred_meter_requires_exception: =non_preferred_meter_requires_exception}
      Testing Supplies Commercial HMO Program: {preferred_meter_models: =preferred_meter_models, non_preferred_meter_requires_exception: =non_preferred_meter_requires_exception}
      Testing Supplies Commercial PPO Program: {preferred_meter_models: =preferred_meter_models, non_preferred_meter_requires_exception: =non_preferred_meter_requires_exception}
      Testing Supplies Medicare Advantage Program: {preferred_meter_models: =preferred_meter_models, non_preferred_meter_requires_exception: =non_preferred_meter_requires_exception}
      Testing Supplies Original Medicare Program: {preferred_meter_models: =preferred_meter_models, non_preferred_meter_requires_exception: =non_preferred_meter_requires_exception}
      Testing Supplies Medicaid Program: {preferred_meter_models: =preferred_meter_models, non_preferred_meter_requires_exception: =non_preferred_meter_requires_exception}
- id: bgm_combo_cgm_backup
  subject: [bgm_refill_shipment]
  rule: >-
    Holding a CGM program changes the strip allowance of the testing supplies program. While the customer holds
    a CGM program in active status, strips are supplied for backup and confirmation testing, and the strip allowance
    is the lower of the treatment-class allowance and strips_per_90_days_with_cgm; a CGM program in referral_received,
    pending_authorization, on_hold or closed does not reduce the allowance. The reduction applies to strips and
    lancets only, not to control solution, lancing devices or meters, and an over_limit_justification record that
    documents a testing frequency above the reduced allowance lifts it under bgm_evt_quantity_limits.
  eligibility:
  - id: cgm_status_checked
    applies_to: [bgm_refill_shipment]
    kind: authorization
    condition: >-
      While the customer holds a CGM program in active status, strips are supplied for backup and confirmation testing,
      and the strip allowance is the lower of the treatment-class allowance and strips_per_90_days_with_cgm
    evidence_fields: [cgm_programs.customer_id, cgm_programs.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [cgm_programs.customer_id]
      action_bindings: {cgm_programs.customer_id: customer_id}
  formula: {allowance_with_cgm: 'min(strips_per_90_days_insulin, strips_per_90_days_with_cgm)'}
extended_policies:
- id: bgm_ext_superseded_strip_takeback
  base_policy_refs:
  - bgm_evt_returns
  - bgm_preferred_meter
  - bgm_evt_replacement_and_delivery
  overwrite: []
  trigger: on_request
  subject:
  - bgm_return_authorization
  computes: units
  target_tool: issue_return_authorization_3dfb992f
  params:
    daily_pace_pump: 5.0
    daily_pace_mdi: 4.0
    daily_pace_default: 1.5
    cgm_paused_pace_shift: 2.0
    cgm_wearing_pace_shift: 2.5
  rule: >-
    When the meter written on a testing supplies program is replaced under a new written order, the test strips
    the customer holds from the program's latest strip refill no longer fit the meter, and Larkfield issues a take-back
    authorization for the units of that shipment it counts as still sealed, so that they come back unopened inside
    the return window that bgm_evt_returns sets. The standard count of the units still sealed is this: start from
    the units of the program's latest strip refill, take away the units counted as opened and any units of that
    shipment already authorized for return, and never go below 0; the units counted as opened are the strips counted
    as used divided by strips_per_billing_unit and rounded up to a whole unit, because a box that has been started
    is opened; the strips counted as used are the days of use times the strips counted for a day of use; the days
    of use are the calendar days from the delivery date on that refill's proof of delivery to today; and the strips
    counted for a day of use are daily_pace_default strips. Each rule set out below changes the standard count only
    in the part it names, where the days of use start or end, which shipment's units are counted, or the strips
    counted for a day of use, and the count is then made as the standard method states, the strips counted for a
    day of use never falling below 0 and days of use that would end before they start counting as none. When the
    program's latest strip refill shipped on or after the ship date of the newest meter on the program, its strips
    fit that meter and nothing is taken back. The shipment the customer holds is the replacement shipment recorded
    against the latest strip refill when that refill was replaced as delivered but not received or as lost in transit
    (the latest replacement for non-receipt when one is on file, and otherwise the latest replacement for loss in
    transit), its units counted and its days of use starting on the replacement's delivery date, or today while
    that replacement has no proof of delivery, so that its days of use then count as none; it is nothing when the
    latest strip refill has no proof of delivery and no such replacement, so no units are counted as sealed; and
    otherwise it is the latest strip refill itself, from its own delivery date. The days of use end on the delivery
    date on the proof of delivery of the newest meter shipped on the program when that meter was delivered later
    than the latest strip refill was, by that refill's own proof of delivery; they end on the testing supplies program's
    hold start date when no newer meter was delivered later than that refill and the program went on hold later
    than that refill was delivered; otherwise they end today. In place of daily_pace_default, the strips counted
    for a day of use are daily_pace_pump strips for an insulin-treated customer whose open CGM program records the
    insulin regimen insulin_pump, daily_pace_mdi strips for an insulin-treated customer whose open CGM program records
    multiple_daily_injections or who holds no open CGM program, and daily_pace_default strips for any other customer;
    an open CGM program is one that is not closed. cgm_paused_pace_shift strips are added to the strips counted
    for every day of use when the customer's CGM program is on hold, because fingersticks then stand in for the
    sensor readings; cgm_wearing_pace_shift strips are taken off the strips counted for every day of use when the
    customer's CGM program is active and a sensor refill shipped to the customer on any of the customer's CGM programs
    within the last 3 calendar months, a sensor refill falling in that span when its ship date is later than the
    same calendar day 3 months earlier; otherwise the strips counted for a day of use are left as they are.
  prerequisite: []
  cross_category:
  - category: cgm
    as: branch
    reads:
    - status
    - insulin_regimen
    - cgm_shipments.ship_date
    note: >-
      The open CGM program's recorded insulin regimen decides the testing pace tier, and its status with its sensor
      refills in the last 3 calendar months decides the pace shift.
  compute:
  - strip_refill_id: >-
      LATEST('bgm_shipments','bgm_shipment_id', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
  - strip_refill_units: >-
      LATEST('bgm_shipments','units', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
      or 0
  - refill_delivered_on: >-
      LATEST('bgm_shipments','delivery_date', date_field='delivery_date', event_type='bgm_delivery_confirmation',
      original_bgm_shipment_id=strip_refill_id)
  - not_received_repl_id: >-
      LATEST('bgm_shipments','bgm_shipment_id', date_field='ship_date', event_type='bgm_replacement_shipment', original_bgm_shipment_id=strip_refill_id,
      replacement_reason='delivered_not_received')
  - lost_repl_id: >-
      LATEST('bgm_shipments','bgm_shipment_id', date_field='ship_date', event_type='bgm_replacement_shipment', original_bgm_shipment_id=strip_refill_id,
      replacement_reason='lost_in_transit')
  - stand_in_count: >-
      COUNT('bgm_shipments', event_type='bgm_replacement_shipment', original_bgm_shipment_id=strip_refill_id, replacement_reason='delivered_not_received')
      + COUNT('bgm_shipments', event_type='bgm_replacement_shipment', original_bgm_shipment_id=strip_refill_id,
      replacement_reason='lost_in_transit')
  - stand_in_id: (not_received_repl_id or lost_repl_id) if stand_in_count > 0 else None
  - stand_in_units: LATEST('bgm_shipments','units', bgm_shipment_id=stand_in_id) or 0
  - stand_in_delivered_on: >-
      LATEST('bgm_shipments','delivery_date', date_field='delivery_date', event_type='bgm_delivery_confirmation',
      original_bgm_shipment_id=stand_in_id)
  - held_units: stand_in_units if stand_in_id else (0 if (not refill_delivered_on) else strip_refill_units)
  - held_from: >-
      (stand_in_delivered_on or NOW) if stand_in_id else (NOW if (not refill_delivered_on) else refill_delivered_on)
  - held_id: stand_in_id if stand_in_id else strip_refill_id
  - newest_meter_id: >-
      LATEST('bgm_shipments','bgm_shipment_id', date_field='ship_date', event_type='bgm_refill_shipment', item_code='E0607')
  - newest_meter_delivered_on: >-
      LATEST('bgm_shipments','delivery_date', date_field='delivery_date', event_type='bgm_delivery_confirmation',
      original_bgm_shipment_id=newest_meter_id)
  - program_hold_start: F('hold_start_date') if F('status') == 'on_hold' else ''
  - use_end_day: >-
      newest_meter_delivered_on if (newest_meter_delivered_on and newest_meter_delivered_on > (refill_delivered_on
      or '')) else (program_hold_start if (program_hold_start and program_hold_start > (refill_delivered_on or ''))
      else NOW)
  - use_days: MX(0, DAYS(held_from, use_end_day))
  - insulin_class: F('treatment_class') == 'insulin_treated'
  - open_cgm_regimen: >-
      CFIELD('cgm','insulin_regimen', status='active') or CFIELD('cgm','insulin_regimen', status='on_hold') or CFIELD('cgm','insulin_regimen',
      status='pending_authorization') or CFIELD('cgm','insulin_regimen', status='referral_received')
  - daily_pace: >-
      K('daily_pace_pump') if (insulin_class and open_cgm_regimen == 'insulin_pump') else (K('daily_pace_mdi') if
      (insulin_class and (open_cgm_regimen == 'multiple_daily_injections' or (not open_cgm_regimen))) else K('daily_pace_default'))
  - cgm_on_hold: EXISTS('cgm', status='on_hold')
  - cgm_active: EXISTS('cgm', status='active')
  - recent_sensor_refills: >-
      XCOUNT('cgm','cgm_shipments', within_months=3, date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
  - pace_shift: >-
      K('cgm_paused_pace_shift') if cgm_on_hold else ((0 - K('cgm_wearing_pace_shift')) if (cgm_active and recent_sensor_refills
      > 0) else 0)
  - strips_used: use_days * MX(0, daily_pace + pace_shift)
  - opened_units: int(-((-strips_used) // P('strips_per_billing_unit')))
  - already_authorized: >-
      SUM('bgm_shipments','units', event_type='bgm_return_authorization', original_bgm_shipment_id=held_id)
  - strips_superseded: >-
      True if ((F('meter_ship_date') or '') > (LATEST('bgm_shipments','ship_date', date_field='ship_date', event_type='bgm_refill_shipment',
      item_code='A4253') or '')) else False
  - result: int(MX(0, held_units - already_authorized - opened_units)) if strips_superseded else 0
  compute_basis:
    strip_refill_id: >-
      The standard count of the units still sealed is this: start from the units of the program's latest strip refill,
      take away the units counted as opened and any units of that shipment already authorized for return, and never
      go below 0; the units counted as opened are the strips counted as used divided by strips_per_billing_unit
      and rounded up to a whole unit, because a box that has been started is opened; the strips counted as used
      are the days of use times the strips counted for a day of use; the days of use are the calendar days from
      the delivery date on that refill's proof of delivery to today; and the strips counted for a day of use are
      daily_pace_default strips.
    strip_refill_units: >-
      The standard count of the units still sealed is this: start from the units of the program's latest strip refill,
      take away the units counted as opened and any units of that shipment already authorized for return, and never
      go below 0; the units counted as opened are the strips counted as used divided by strips_per_billing_unit
      and rounded up to a whole unit, because a box that has been started is opened; the strips counted as used
      are the days of use times the strips counted for a day of use; the days of use are the calendar days from
      the delivery date on that refill's proof of delivery to today; and the strips counted for a day of use are
      daily_pace_default strips.
    refill_delivered_on: >-
      The standard count of the units still sealed is this: start from the units of the program's latest strip refill,
      take away the units counted as opened and any units of that shipment already authorized for return, and never
      go below 0; the units counted as opened are the strips counted as used divided by strips_per_billing_unit
      and rounded up to a whole unit, because a box that has been started is opened; the strips counted as used
      are the days of use times the strips counted for a day of use; the days of use are the calendar days from
      the delivery date on that refill's proof of delivery to today; and the strips counted for a day of use are
      daily_pace_default strips.
    not_received_repl_id: >-
      The shipment the customer holds is the replacement shipment recorded against the latest strip refill when
      that refill was replaced as delivered but not received or as lost in transit (the latest replacement for non-receipt
      when one is on file, and otherwise the latest replacement for loss in transit), its units counted and its
      days of use starting on the replacement's delivery date, or today while that replacement has no proof of delivery,
      so that its days of use then count as none; it is nothing when the latest strip refill has no proof of delivery
      and no such replacement, so no units are counted as sealed; and otherwise it is the latest strip refill itself,
      from its own delivery date.
    lost_repl_id: >-
      The shipment the customer holds is the replacement shipment recorded against the latest strip refill when
      that refill was replaced as delivered but not received or as lost in transit (the latest replacement for non-receipt
