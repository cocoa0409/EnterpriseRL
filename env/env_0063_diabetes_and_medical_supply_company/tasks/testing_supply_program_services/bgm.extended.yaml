    latest_refill_days: >-
      The supply days are, for the first strip refill after a newly supplied meter, the whole 30-day blocks needed
      to cover the days still left in the latest strip refill's supply, counted up to a whole block, plus one more
      30-day block; otherwise, when the days from the ship date through the valid-through date of the newest authorization
      grant for test strips are fewer than the tier's supply_days_per_shipment, they are the whole 30-day blocks
      those days hold; and otherwise they are the tier's supply_days_per_shipment.
