- id: bgm_ext_above_coverage_notice
  base_policy_refs:
  - bgm_liability_notice
  - bgm_evt_quantity_limits
  - bgm_combo_cgm_backup
  overwrite:
  - base_policy: bgm_evt_quantity_limits
    superseded_clause: >-
      over the rolling 90 days ending on the ship date: strips_per_90_days_insulin for an insulin-treated customer
      and strips_per_90_days_non_insulin otherwise, both counted by bgm_msr_strips_shipped_90d including the refill
      being shipped
    replaced_by: >-
      For a liability notice for test strips that this policy sizes, and only for such a notice, the coverage keeps
      the tier's strips_per_90_days_insulin for an insulin-treated customer and strips_per_90_days_non_insulin otherwise
      as the treatment-class allowances it is built from, with the CGM adjustment stated here, but it is measured
      over the window and against the count net of the units this policy states; the allowance every refill itself
      must fit stays under bgm_evt_quantity_limits, over the rolling 90 days ending on its ship date.
  trigger: on_request
  subject:
  - bgm_liability_notice_signed
  computes: notice_units
  target_tool: sign_liability_notice_3f2fa265
  params:
    raised_order_reach_blocks: 3
    abn_reach_max_blocks: 12
  rule: >-
    When a customer wants more test strips than the plan's coverage leaves, Larkfield sizes the tier's liability
    notice for test strips so that it covers the ordered units of test strips that the coverage leaves unpaid over
    the notice's reach; the customer signs it personally, on or before the ship date, as bgm_liability_notice requires.
    The units a liability notice for test strips covers are fixed only after the strips the customer holds from
    the program's latest strip refill, when the meter they were shipped for has since been replaced on the program
    and their return window is still open, carry a take-back authorization for every unit counted as still sealed.
    The standard sizing is this: the notice covers the units per 30 days of the written order behind the program's
    latest strip refill times the 30-day blocks the notice reaches, less the units the coverage covers over that
    reach, and never fewer than 0; the notice reaches one 30-day block; the coverage is the tier's strips_per_90_days_non_insulin,
    and what is measured against the window is that whole coverage, the window being the 3 calendar months ending
    on the ship date, a strip refill falling in the window when its ship date is later than the same calendar day
    3 months earlier; the strips the window counts are the units of the program's strip refills shipped in it, replacement
    shipments not counted, less the units of take-back authorizations for test strips issued in the last calendar
    month and the units of liability notices for test strips signed in the last calendar month, never below 0, times
    strips_per_billing_unit, because units on their way back and units the customer pays for under a notice do not
    use the plan's coverage; the units the coverage covers are the strips that what is measured against the window
    leaves after the window's count, divided by strips_per_billing_unit, rounded down to whole units and never below
    0; and every 30-day block of the reach beyond the blocks the window spans adds one block's share of what is
    measured against the window, that share being what is measured against the window divided by the window's 30-day
    blocks and by strips_per_billing_unit, rounded down to whole units. The order behind a strip refill is the written
    order its authorization grant rests on, and the program's newest written order for test strips is the one with
    the latest order date. Each rule set out below replaces only the standard quantity it names, the coverage, the
    window and what is measured against it, the units per 30 days the notice covers, or the 30-day blocks it reaches,
    and the notice is then sized as the standard method states. The coverage is the lower of strips_per_90_days_insulin
    and strips_per_90_days_with_cgm for an insulin-treated customer who holds an active CGM program, the lower of
    strips_per_90_days_non_insulin and strips_per_90_days_with_cgm for a customer not treated with insulin who holds
    an active CGM program, strips_per_90_days_insulin for an insulin-treated customer who holds no active CGM program,
    and strips_per_90_days_non_insulin for a customer not treated with insulin who holds no active CGM program;
    a CGM program that is on hold, closed or not yet active is not an active CGM program. The units per 30 days
    the notice covers are those of the program's newest written order for test strips when that order is not the
    order behind the program's latest strip refill and was signed within the last 30 days, the lower of the newest
    order's and that earlier order's units per 30 days when the newest order is not the order behind the latest
    strip refill and was signed more than 30 days ago, and otherwise those of the order behind the latest strip
    refill, because the notice covers the rate the next refill ships at. On a tier whose supply_days_per_shipment
    is 30 and whose prior_auth_required is false, the window is the one calendar month ending on the ship date,
    a strip refill falling in it when its ship date is later than the same calendar day one month earlier, that
    window spans one 30-day block, and what is measured against it is one third of the coverage; on a tier whose
    prior_auth_required is true, the window is that one calendar month, spanning one 30-day block, and what is measured
    against it is not the coverage but the units approved on the program's latest payer prior authorization for
    test strips, divided by the whole 30-day blocks of its approved span, never fewer than one block, and multiplied
    by strips_per_billing_unit, nothing being measured against the window when the program holds no payer prior
    authorization for test strips; on any other tier the window is the 3 calendar months ending on the ship date,
    spanning three 30-day blocks, and what is measured against it is the whole coverage. A date falls in the last
    calendar month when it is later than the same calendar day one month earlier. No notice is sized on a tier whose
    liability_notice_type is organization_determination_required or not_applicable, because there bgm_liability_notice
    lets no notice make the customer liable. When the newest written order for test strips was signed within the
    last 30 days, prescribes more units per 30 days than the order behind the program's latest strip refill, and
    the tier's liability_notice_type is plan_member_waiver or medicaid_non_covered_agreement, the notice reaches,
    if the customer's CGM program is on hold and its hold limit, which is its hold start date plus the CGM tier's
    hold_max_days, falls after the ship date, the whole 30-day blocks needed to reach that hold limit, counted up
    to a whole block, plus one more block, and otherwise raised_order_reach_blocks 30-day blocks; it reaches the
    whole 30-day blocks held by the days from the ship date through that newest order's valid-through date, at least
    one and at most abn_reach_max_blocks, when the tier's liability_notice_type is abn_cms_r_131; and it reaches
    one 30-day block otherwise. For a liability notice for test strips that this policy sizes, and only for such
    a notice, the coverage keeps the tier's strips_per_90_days_insulin for an insulin-treated customer and strips_per_90_days_non_insulin
    otherwise as the treatment-class allowances it is built from, with the CGM adjustment stated here, but it is
    measured over the window and against the count net of the units this policy states; the allowance every refill
    itself must fit stays under bgm_evt_quantity_limits, over the rolling 90 days ending on its ship date.
  prerequisite:
  - problem: bgm_ext_superseded_strip_takeback
    kind: value_input
    gate: window_netting
    form: state
    policy_source: >-
      The units a liability notice for test strips covers are fixed only after the strips the customer holds from
      the program's latest strip refill, when the meter they were shipped for has since been replaced on the program
      and their return window is still open, carry a take-back authorization for every unit counted as still sealed.
    condition: >-
      when the meter the A4253 strips of the program's latest strip refill were shipped for has since been replaced
      on the program and the return window of the shipment the customer holds from that refill (that refill, or
      its replacement when it was replaced as not received or lost) is still open, that shipment carries bgm_return_authorization
      records for every unit counted as still sealed
    resolved_by: issue_return_authorization_3dfb992f
    effect: >-
      the take-back units issued in the last calendar month enter the window netting, so the window count falls,
      the covered units rise and the notice covers fewer units
  cross_category:
  - category: cgm
    as: branch
    reads:
    - status
    - hold_start_date
    - hold_max_days
    note: >-
      Whether the customer holds an active CGM program decides the coverage tier; a CGM program on hold, with its
      hold start and its tier's hold_max_days, decides how far the notice reaches.
  compute:
  - insulin_class: F('treatment_class') == 'insulin_treated'
  - cgm_active: EXISTS('cgm', status='active')
  - coverage_allowance: >-
      MN(P('strips_per_90_days_insulin'), P('strips_per_90_days_with_cgm')) if (insulin_class and cgm_active) else
      (MN(P('strips_per_90_days_non_insulin'), P('strips_per_90_days_with_cgm')) if ((not insulin_class) and cgm_active)
      else (P('strips_per_90_days_insulin') if (insulin_class and (not cgm_active)) else P('strips_per_90_days_non_insulin')))
  - pa_tier: P('prior_auth_required') == True
  - thirty_day_tier: P('supply_days_per_shipment') == 30
  - pa_grant_units: >-
      LATEST('bgm_orders','units_authorized', date_field='decision_date', event_type='bgm_authorization_grant',
      item_code='A4253', authorization_basis='payer_prior_authorization')
  - pa_grant_from: >-
      LATEST('bgm_orders','valid_from', date_field='decision_date', event_type='bgm_authorization_grant', item_code='A4253',
      authorization_basis='payer_prior_authorization')
  - pa_grant_through: >-
      LATEST('bgm_orders','valid_through', date_field='decision_date', event_type='bgm_authorization_grant', item_code='A4253',
      authorization_basis='payer_prior_authorization')
  - pa_blocks: MX(1, (DAYS(pa_grant_from, pa_grant_through) + 1) // 30) if pa_grant_from else 1
  - window_months: 1 if (thirty_day_tier and (not pa_tier)) else (1 if pa_tier else 3)
  - pa_monthly_strips: ((pa_grant_units or 0) / pa_blocks) * P('strips_per_billing_unit')
  - window_share: (1 / 3) if (thirty_day_tier and (not pa_tier)) else (0 if pa_tier else 1)
  - window_uses_pa: True if pa_tier else False
  - window_allowance: pa_monthly_strips if window_uses_pa else coverage_allowance * window_share
  - window_blocks: window_months
  - window_strip_units: >-
      SUM('bgm_shipments','units', within_months=window_months, date_field='ship_date', event_type='bgm_refill_shipment',
      item_code='A4253')
  - takeback_units: >-
      SUM('bgm_shipments','units', within_months=1, date_field='rma_issue_date', event_type='bgm_return_authorization',
      item_code='A4253')
  - notice_units_window: >-
      SUM('bgm_orders','notice_units', within_months=1, date_field='notice_date', event_type='bgm_liability_notice_signed',
      item_code='A4253')
  - window_netting: takeback_units + notice_units_window
  - counted_strips: MX(0, window_strip_units - window_netting) * P('strips_per_billing_unit')
  - covered_now_units: int(MX(0, window_allowance - counted_strips) // P('strips_per_billing_unit'))
  - block_units: int((window_allowance / window_blocks) // P('strips_per_billing_unit'))
  - newest_order_id: >-
      LATEST('bgm_orders','bgm_order_id', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
  - newest_order_qty: >-
      LATEST('bgm_orders','quantity_per_30_days', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
      or 0
  - newest_order_date: >-
      LATEST('bgm_orders','order_date', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
  - newest_order_through: >-
      LATEST('bgm_orders','valid_through', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
  - latest_refill_grant: >-
      LATEST('bgm_shipments','bgm_order_id', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
  - prior_order_id: LATEST('bgm_orders','related_bgm_order_id', bgm_order_id=latest_refill_grant)
  - prior_order_qty: LATEST('bgm_orders','quantity_per_30_days', bgm_order_id=prior_order_id) or 0
  - cgm_hold_start: CFIELD('cgm','hold_start_date', status='on_hold')
  - cgm_hold_max: CPARAM('cgm','hold_max_days', status='on_hold') or 0
  - hold_days_left: (cgm_hold_max - DAYS(cgm_hold_start, NOW)) if cgm_hold_start else 0
  - raised_waiver_order: >-
      True if (newest_order_date and DAYS(newest_order_date, NOW) <= 30 and newest_order_qty > prior_order_qty and
      (P('liability_notice_type') == 'plan_member_waiver' or P('liability_notice_type') == 'medicaid_non_covered_agreement'))
      else False
  - reach_blocks: >-
      (int(-((-hold_days_left) // 30)) + 1) if (raised_waiver_order and cgm_hold_start and hold_days_left > 0) else
      (K('raised_order_reach_blocks') if (raised_waiver_order and (not (cgm_hold_start and hold_days_left > 0)))
      else ((MN(K('abn_reach_max_blocks'), MX(1, ((DAYS(NOW, newest_order_through) + 1) // 30) if newest_order_through
      else 1))) if P('liability_notice_type') == 'abn_cms_r_131' else 1))
  - covered_reach_units: covered_now_units + MX(0, reach_blocks - window_blocks) * block_units
  - notice_tier: >-
      P('liability_notice_type') != 'organization_determination_required' and P('liability_notice_type') != 'not_applicable'
  - notice_rate: >-
      newest_order_qty if (newest_order_id != prior_order_id and newest_order_date and DAYS(newest_order_date, NOW)
      <= 30) else (MN(newest_order_qty, prior_order_qty) if (newest_order_id != prior_order_id and newest_order_date
      and DAYS(newest_order_date, NOW) > 30) else prior_order_qty)
  - result: MX(0, notice_rate * reach_blocks - covered_reach_units) if notice_tier else 0
  compute_basis:
    insulin_class: >-
      The coverage is the lower of strips_per_90_days_insulin and strips_per_90_days_with_cgm for an insulin-treated
      customer who holds an active CGM program, the lower of strips_per_90_days_non_insulin and strips_per_90_days_with_cgm
      for a customer not treated with insulin who holds an active CGM program, strips_per_90_days_insulin for an
      insulin-treated customer who holds no active CGM program, and strips_per_90_days_non_insulin for a customer
      not treated with insulin who holds no active CGM program; a CGM program that is on hold, closed or not yet
      active is not an active CGM program.
