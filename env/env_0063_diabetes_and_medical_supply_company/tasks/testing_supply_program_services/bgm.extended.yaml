      any denial whose latest notice was signed after the ship date, is worked as bgm_evt_denials_and_appeals and
      bgm_liability_notice provide, and this policy posts no charge for it.
    notice_tier: >-
      This policy prices that charge only when the shipment is a refill of test strips, the denial code is CO-151
      and no medical record with purpose over_limit_justification is on file for the program, or the denial code
      is PR-204, and the notice that counts was signed on or before the shipment's ship date; it prices no charge
      on a tier whose liability_notice_type is organization_determination_required or not_applicable. Any other
      denial, among them a CO-50 or CO-197 denial and a CO-151 denial while such a medical record is on file, and
      any denial whose latest notice was signed after the ship date, is worked as bgm_evt_denials_and_appeals and
      bgm_liability_notice provide, and this policy posts no charge for it.
    priced_here: >-
      This policy prices that charge only when the shipment is a refill of test strips, the denial code is CO-151
      and no medical record with purpose over_limit_justification is on file for the program, or the denial code
      is PR-204, and the notice that counts was signed on or before the shipment's ship date; it prices no charge
      on a tier whose liability_notice_type is organization_determination_required or not_applicable. Any other
      denial, among them a CO-50 or CO-197 denial and a CO-151 denial while such a medical record is on file, and
      any denial whose latest notice was signed after the ship date, is worked as bgm_evt_denials_and_appeals and
      bgm_liability_notice provide, and this policy posts no charge for it.
    charged_units: >-
      Each rule set out below replaces or reduces only the standard quantity it names, the units concerned, the
      price of a unit or the charge, reductions applying after the units and the price are set, and the charge is
      then capped and rounded as the standard method states.
    result: >-
      Each rule set out below replaces or reduces only the standard quantity it names, the units concerned, the
      price of a unit or the charge, reductions applying after the units and the price are set, and the charge is
      then capped and rounded as the standard method states.
  factors:
  - id: concerned_units_route
    effect: method
    decides: units_concerned
    bindings:
    - remit_count
    - units_concerned
    ladder:
    - when: the denied claim also carries a remittance and the denial code is CO-151
      method: the shipment's units above the treatment-class allowance for its supply days
    - when: the denied claim carries no remittance
      method: every unit of the shipment
    - when: otherwise
      method: the units the notice covers
    baseline:
      units_concerned: notice_units
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: unit_price_basis
    effect: parameter
    decides: unit_price
    bindings:
    - remit_allowed
    - unit_price
    ladder:
    - when: >-
        the tier's notice is abn_cms_r_131, the denied claim carries remittances whose allowed amounts total more
        than 0, and the treatment-class allowance gives at least one unit for the supply days
      value: the remittances' allowed amounts divided by the allowance units for the supply days
    - when: the tier's notice is plan_member_waiver
      value: the billed charge per unit less member_discount_pct percent
    - when: otherwise
      value: the billed charge per unit (0 when the shipment records no units)
    baseline:
      unit_price: (claim_billed / ship_units) if ship_units > 0 else 0
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: posting_delay_share
    effect: parameter
    decides: late_share
    bindings:
    - denial_posted
    - days_since_denial
    - late_share
    ladder:
    - when: the charge is posted more than 60 calendar days after the denial's posting date
      value: K('late_share_over_60')
    - when: it is posted 31 to 60 days after it
      value: K('late_share_31_60')
    - when: otherwise (within 30 days)
      value: '1'
    baseline:
      late_share: '1'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: hardship_relief_share
    effect: parameter
    decides: hardship_share
    bindings:
    - hardship_recent
    - hardship_any
    - hardship_share
    ladder:
    - when: an approved hardship application on the program was received within the last 12 calendar months
      value: K('hardship_share_recent')
    - when: the program's approved hardship application is older
      value: K('hardship_share_older')
    - when: otherwise
      value: '1'
    baseline:
      hardship_share: '1'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The standard charge is this: the units concerned are the units that notice covers; the price of a unit is
      Larkfield's billed charge on the denied claim divided by the shipment's units; the charge is the units concerned
      times that price, never for more units than the notice covers or than the shipment carried, rounded to cents
      only at the end. The units the treatment-class allowance gives for a shipment's supply days are strips_per_90_days_insulin
      for an insulin-treated customer and strips_per_90_days_non_insulin otherwise, times the supply days divided
      by 90 and by strips_per_billing_unit, rounded down to whole units.
    params:
    - strips_per_billing_unit
  inputs:
    history:
    - table: bgm_billing
      aggregate: latest
      field: bgm_ledger_id
      filters:
        event_type: bgm_claim_denial
    - table: bgm_billing
      aggregate: sum
      field: allowed_amount
      filters:
        event_type: bgm_claim_adjudication
    - table: bgm_orders
      aggregate: latest
      field: notice_units
      filters:
        event_type: bgm_liability_notice_signed
        item_code: A4253
    - table: bgm_requests
      aggregate: count
      field: received_at
      within_months: 12
      filters:
        request_type: hardship_application
        request_status: approved
    - table: bgm_orders
      aggregate: count
      field: bgm_order_id
      filters:
        event_type: bgm_medical_record_receipt
        record_purpose: over_limit_justification
    cross_category: []
- id: bgm_ext_hardship_cost_share_waiver
  base_policy_refs:
  - bgm_evt_patient_account
  - bgm_evt_claims
  overwrite: []
  trigger: state_due
  subject:
  - bgm_balance_adjustment
  computes: amount
  target_tool: post_hardship_waiver_f8410ea4
  params:
    deductible_waiver_share: 0.5
    medicare_hardship_share: 0.75
    recent_posting_share: 0.8
    middle_posting_share: 0.9
    household_share_high: 0.7
    household_share_low: 0.85
    household_waiver_threshold: 50.0
    payment_lapse_share_mid: 0.9
    payment_lapse_share_long: 0.8
    medicare_repeat_share: 0.6
  rule: >-
    When a hardship application on a testing supplies program has request status approved and names a posting, Larkfield
    posts the hardship waiver against that posting as a hardship_waiver balance adjustment, as bgm_evt_patient_account
    allows only on tiers where hardship_waiver_allowed is true; the posting concerned is the one named on the program's
    latest approved hardship application, and on a tier where hardship_waiver_allowed is false this policy posts
    no waiver. The standard waiver is this: the waivable cost share is the named posting's amount; the waiver is
    the waivable cost share less every balance adjustment already posted against that posting, never below 0; it
    is never more than the named posting's amount less those adjustments, nor more than the program's balance less
    every other remittance patient responsibility, patient charge and refund of the program posted within the last
    N calendar months, N being one more than the whole calendar months from the named posting's date to today, and
    never below 0, so that the waiver never exceeds what payments applied to the oldest unpaid posting first can
    leave of that posting; and it is rounded to cents only at the end. The whole calendar months from a date to
    today are the months from that date's calendar month to the current one, less one when today's day of the month
    is earlier than that date's; a date falls within the last N calendar months when it is later than the same calendar
    day N months earlier. Each rule set out below replaces or multiplies only the standard quantity it names, the
    waivable cost share or the waiver, and the ceilings and the rounding of the standard method apply after them.
    The waivable cost share is, for a remittance posting on a tier where deductible_applies is true and the posting
    carries a deductible part, the coinsurance part in full plus deductible_waiver_share of the deductible part,
    the coinsurance part being coinsurance_pct percent of the allowed amount less the deductible part and the deductible
    part being the posting's amount less coinsurance_pct percent of the allowed amount, divided by one less coinsurance_pct
    percent; for a remittance posting on a tier with a copay_per_30_day_supply_usd above 0, the lower of the posting's
    amount and that copay; and otherwise the posting's amount. Before the ceilings and the rounding apply, the waiver
    is multiplied by the payer share, which is medicare_repeat_share on the Original Medicare and Medicare Advantage
    tiers when the program has more than one approved hardship application received within the last 12 calendar
    months, medicare_hardship_share on those tiers when it has one such application or none, because a waiver of
    a Medicare beneficiary's cost share must stay partial and exceptional, and 1 otherwise, which leaves the Commercial
    HMO and Commercial PPO tiers, the only other tiers on which this policy waives, at the full waivable cost share.
    Before the ceilings and the rounding apply, the waiver is multiplied by the payment share, which is payment_lapse_share_long
    when no patient payment was posted on the program within the last 6 calendar months, payment_lapse_share_mid
    when one was posted within the last 6 calendar months but none within the last 3, and 1 otherwise, when a payment
    was posted within the last 3 calendar months, because Larkfield's hardship relief weighs the customer's own
    payments on the account. Before the ceilings and the rounding apply, the waiver is multiplied by the age share,
    which is recent_posting_share when the named posting was posted within the last 90 calendar days, middle_posting_share
    when it was posted 91 to 180 days ago, and 1 when it is older. Before the ceilings and the rounding apply, the
    waiver is multiplied by the household share, which is household_share_high when the customer's CGM programs
    carry hardship_waiver adjustments posted within the last 12 calendar months totalling at least household_waiver_threshold,
    household_share_low when they carry such adjustments totalling less, and 1 when they carry none, because one
    household's hardship relief is shared across its Larkfield programs; a date falls within the last 12 calendar
    months when it is later than the same calendar day 12 months earlier.
  prerequisite: []
  cross_category:
  - category: cgm
    as: history
    reads:
    - cgm_billing.amount
    note: >-
      Hardship waivers posted on the customer's CGM programs in the last 12 calendar months decide the household
      share.
  compute:
  - named_id: >-
      LATEST('bgm_requests','bgm_ledger_id', date_field='received_at', request_type='hardship_application', request_status='approved')
  - named_amount: LATEST('bgm_billing','amount', bgm_ledger_id=named_id) or 0
  - named_allowed: LATEST('bgm_billing','allowed_amount', bgm_ledger_id=named_id) or 0
  - named_type: LATEST('bgm_billing','event_type', bgm_ledger_id=named_id) or ''
  - named_posted: LATEST('bgm_billing','posting_date', bgm_ledger_id=named_id) or ''
  - coins_rate: P('coinsurance_pct') / 100
  - deductible_part: MX(0, (named_amount - coins_rate * named_allowed) / (1 - coins_rate)) if coins_rate < 1 else
      0
  - waivable: >-
      (named_amount - deductible_part) + deductible_part * K('deductible_waiver_share') if (P('deductible_applies')
      == True and named_type == 'bgm_claim_adjudication' and deductible_part > 0) else (MN(named_amount, P('copay_per_30_day_supply_usd'))
      if (P('copay_per_30_day_supply_usd') > 0 and named_type == 'bgm_claim_adjudication') else named_amount)
  - counted_adjustments: SUM('bgm_billing','amount', event_type='bgm_balance_adjustment', original_bgm_ledger_id=named_id)
  - approved_recent: >-
      COUNT('bgm_requests', within_months=12, date_field='received_at', request_type='hardship_application', request_status='approved')
  - medicare_tier: >-
      F('variant_name') == 'Testing Supplies Original Medicare Program' or F('variant_name') == 'Testing Supplies
      Medicare Advantage Program'
  - payer_share: >-
      K('medicare_repeat_share') if (medicare_tier and approved_recent > 1) else (K('medicare_hardship_share') if
      medicare_tier else 1)
  - payments_3: COUNT('bgm_billing', within_months=3, date_field='posting_date', event_type='bgm_patient_payment')
  - payments_6: COUNT('bgm_billing', within_months=6, date_field='posting_date', event_type='bgm_patient_payment')
  - payment_share: >-
      K('payment_lapse_share_long') if payments_6 == 0 else (K('payment_lapse_share_mid') if payments_3 == 0 else
      1)
  - posting_age_days: DAYS(named_posted, NOW) if named_posted else 9999
  - age_share: >-
      K('recent_posting_share') if posting_age_days <= 90 else (K('middle_posting_share') if posting_age_days <=
      180 else 1)
  - household_waivers: >-
      XSUM('cgm','cgm_billing','amount', within_months=12, date_field='posting_date', event_type='cgm_balance_adjustment',
      adjustment_reason='hardship_waiver')
  - household_share: >-
      K('household_share_high') if household_waivers >= K('household_waiver_threshold') else (K('household_share_low')
      if household_waivers > 0 else 1)
  - program_balance: >-
      RND(SUM('bgm_billing','amount', event_type='bgm_claim_adjudication') + SUM('bgm_billing','amount', event_type='bgm_patient_charge')
      + SUM('bgm_billing','amount', event_type='bgm_patient_refund') - SUM('bgm_billing','amount', event_type='bgm_patient_payment')
      - SUM('bgm_billing','amount', event_type='bgm_balance_adjustment'), 2)
  - named_months: MONTHS(named_posted, NOW) if named_posted else 0
  - other_recent_postings: >-
      SUM('bgm_billing','amount', within_months=named_months + 1, date_field='posting_date', event_type='bgm_claim_adjudication')
      + SUM('bgm_billing','amount', within_months=named_months + 1, date_field='posting_date', event_type='bgm_patient_charge')
      + SUM('bgm_billing','amount', within_months=named_months + 1, date_field='posting_date', event_type='bgm_patient_refund')
      - named_amount
  - waiver_cap: MX(0, MN(named_amount - counted_adjustments, program_balance - other_recent_postings))
  - waiver_raw: MX(0, waivable - counted_adjustments) * payer_share * payment_share * age_share * household_share
  - waiver_tier: P('hardship_waiver_allowed') == True
  - result: RND(MN(waiver_raw, waiver_cap), 2) if waiver_tier else 0
  compute_basis:
    named_id: >-
      When a hardship application on a testing supplies program has request status approved and names a posting,
      Larkfield posts the hardship waiver against that posting as a hardship_waiver balance adjustment, as bgm_evt_patient_account
      allows only on tiers where hardship_waiver_allowed is true; the posting concerned is the one named on the
      program's latest approved hardship application, and on a tier where hardship_waiver_allowed is false this
      policy posts no waiver.
    named_amount: >-
      The standard waiver is this: the waivable cost share is the named posting's amount; the waiver is the waivable
      cost share less every balance adjustment already posted against that posting, never below 0; it is never more
      than the named posting's amount less those adjustments, nor more than the program's balance less every other
      remittance patient responsibility, patient charge and refund of the program posted within the last N calendar
      months, N being one more than the whole calendar months from the named posting's date to today, and never
      below 0, so that the waiver never exceeds what payments applied to the oldest unpaid posting first can leave
      of that posting; and it is rounded to cents only at the end.
    named_allowed: >-
      The waivable cost share is, for a remittance posting on a tier where deductible_applies is true and the posting
      carries a deductible part, the coinsurance part in full plus deductible_waiver_share of the deductible part,
      the coinsurance part being coinsurance_pct percent of the allowed amount less the deductible part and the
      deductible part being the posting's amount less coinsurance_pct percent of the allowed amount, divided by
      one less coinsurance_pct percent; for a remittance posting on a tier with a copay_per_30_day_supply_usd above
      0, the lower of the posting's amount and that copay; and otherwise the posting's amount.
    named_type: >-
      The waivable cost share is, for a remittance posting on a tier where deductible_applies is true and the posting
      carries a deductible part, the coinsurance part in full plus deductible_waiver_share of the deductible part,
      the coinsurance part being coinsurance_pct percent of the allowed amount less the deductible part and the
      deductible part being the posting's amount less coinsurance_pct percent of the allowed amount, divided by
      one less coinsurance_pct percent; for a remittance posting on a tier with a copay_per_30_day_supply_usd above
      0, the lower of the posting's amount and that copay; and otherwise the posting's amount.
    named_posted: >-
      When a hardship application on a testing supplies program has request status approved and names a posting,
      Larkfield posts the hardship waiver against that posting as a hardship_waiver balance adjustment, as bgm_evt_patient_account
      allows only on tiers where hardship_waiver_allowed is true; the posting concerned is the one named on the
