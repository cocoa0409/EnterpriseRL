    - table: bgm_shipments
      aggregate: latest
      field: delivery_date
      filters:
        event_type: bgm_delivery_confirmation
    - table: bgm_shipments
      aggregate: latest
      field: bgm_shipment_id
      filters:
        event_type: bgm_replacement_shipment
    - table: bgm_shipments
      aggregate: sum
      field: units
      filters:
        event_type: bgm_return_authorization
    - category: cgm
      table: cgm_shipments
      aggregate: count
