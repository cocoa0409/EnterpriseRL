      shipment's units above the units the treatment-class allowance gives for its supply days; when the denied
      claim carries no remittance, every unit of the shipment; and otherwise the units the notice covers.
    remit_allowed: >-
      The price of a unit is, on a tier whose liability_notice_type is abn_cms_r_131 when the denied claim carries
      remittances whose allowed amounts total more than 0 and the treatment-class allowance gives at least one unit
      for the supply days, the allowed amounts on those remittances divided by the units that allowance gives; on
      a tier whose liability_notice_type is plan_member_waiver, the billed charge per unit less member_discount_pct
      percent; and otherwise the billed charge per unit, the billed charge per unit being the billed charge on the
      denied claim divided by the shipment's units, and 0 when the shipment records no units.
    unit_price: >-
      The price of a unit is, on a tier whose liability_notice_type is abn_cms_r_131 when the denied claim carries
      remittances whose allowed amounts total more than 0 and the treatment-class allowance gives at least one unit
      for the supply days, the allowed amounts on those remittances divided by the units that allowance gives; on
      a tier whose liability_notice_type is plan_member_waiver, the billed charge per unit less member_discount_pct
