    class_allowance_units: >-
      The units the treatment-class allowance gives for a shipment's supply days are strips_per_90_days_insulin
      for an insulin-treated customer and strips_per_90_days_non_insulin otherwise, times the supply days divided
      by 90 and by strips_per_billing_unit, rounded down to whole units.
    remit_count: >-
      The units concerned are, when the denied claim also carries a remittance and the denial code is CO-151, the
      shipment's units above the units the treatment-class allowance gives for its supply days; when the denied
