    pa_tier: >-
      On a tier whose supply_days_per_shipment is 30 and whose prior_auth_required is false, the window is the one
      calendar month ending on the ship date, a strip refill falling in it when its ship date is later than the
      same calendar day one month earlier, that window spans one 30-day block, and what is measured against it is
      one third of the coverage; on a tier whose prior_auth_required is true, the window is that one calendar month,
      spanning one 30-day block, and what is measured against it is not the coverage but the units approved on the
      program's latest payer prior authorization for test strips, divided by the whole 30-day blocks of its approved
      span, never fewer than one block, and multiplied by strips_per_billing_unit, nothing being measured against
      the window when the program holds no payer prior authorization for test strips; on any other tier the window
      is the 3 calendar months ending on the ship date, spanning three 30-day blocks, and what is measured against
      it is the whole coverage.
