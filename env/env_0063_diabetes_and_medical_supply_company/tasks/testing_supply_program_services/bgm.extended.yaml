      the coinsurance part being coinsurance_pct percent of the allowed amount less the deductible part and the
      deductible part being the posting's amount less coinsurance_pct percent of the allowed amount, divided by
      one less coinsurance_pct percent; for a remittance posting on a tier with a copay_per_30_day_supply_usd above
      0, the lower of the posting's amount and that copay; and otherwise the posting's amount.
    deductible_part: >-
      The waivable cost share is, for a remittance posting on a tier where deductible_applies is true and the posting
      carries a deductible part, the coinsurance part in full plus deductible_waiver_share of the deductible part,
      the coinsurance part being coinsurance_pct percent of the allowed amount less the deductible part and the
      deductible part being the posting's amount less coinsurance_pct percent of the allowed amount, divided by
      one less coinsurance_pct percent; for a remittance posting on a tier with a copay_per_30_day_supply_usd above
      0, the lower of the posting's amount and that copay; and otherwise the posting's amount.
    waivable: >-
      The waivable cost share is, for a remittance posting on a tier where deductible_applies is true and the posting
      carries a deductible part, the coinsurance part in full plus deductible_waiver_share of the deductible part,
      the coinsurance part being coinsurance_pct percent of the allowed amount less the deductible part and the
      deductible part being the posting's amount less coinsurance_pct percent of the allowed amount, divided by
      one less coinsurance_pct percent; for a remittance posting on a tier with a copay_per_30_day_supply_usd above
      0, the lower of the posting's amount and that copay; and otherwise the posting's amount.
    counted_adjustments: >-
      The standard waiver is this: the waivable cost share is the named posting's amount; the waiver is the waivable
      cost share less every balance adjustment already posted against that posting, never below 0; it is never more
      than the named posting's amount less those adjustments, nor more than the program's balance less every other
      remittance patient responsibility, patient charge and refund of the program posted within the last N calendar
      months, N being one more than the whole calendar months from the named posting's date to today, and never
      below 0, so that the waiver never exceeds what payments applied to the oldest unpaid posting first can leave
      of that posting; and it is rounded to cents only at the end.
    approved_recent: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the payer share, which is medicare_repeat_share
      on the Original Medicare and Medicare Advantage tiers when the program has more than one approved hardship
      application received within the last 12 calendar months, medicare_hardship_share on those tiers when it has
      one such application or none, because a waiver of a Medicare beneficiary's cost share must stay partial and
      exceptional, and 1 otherwise, which leaves the Commercial HMO and Commercial PPO tiers, the only other tiers
      on which this policy waives, at the full waivable cost share.
    medicare_tier: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the payer share, which is medicare_repeat_share
      on the Original Medicare and Medicare Advantage tiers when the program has more than one approved hardship
      application received within the last 12 calendar months, medicare_hardship_share on those tiers when it has
      one such application or none, because a waiver of a Medicare beneficiary's cost share must stay partial and
      exceptional, and 1 otherwise, which leaves the Commercial HMO and Commercial PPO tiers, the only other tiers
      on which this policy waives, at the full waivable cost share.
    payer_share: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the payer share, which is medicare_repeat_share
      on the Original Medicare and Medicare Advantage tiers when the program has more than one approved hardship
      application received within the last 12 calendar months, medicare_hardship_share on those tiers when it has
      one such application or none, because a waiver of a Medicare beneficiary's cost share must stay partial and
      exceptional, and 1 otherwise, which leaves the Commercial HMO and Commercial PPO tiers, the only other tiers
      on which this policy waives, at the full waivable cost share.
    payments_3: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the payment share, which is payment_lapse_share_long
      when no patient payment was posted on the program within the last 6 calendar months, payment_lapse_share_mid
      when one was posted within the last 6 calendar months but none within the last 3, and 1 otherwise, when a
      payment was posted within the last 3 calendar months, because Larkfield's hardship relief weighs the customer's
      own payments on the account.
    payments_6: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the payment share, which is payment_lapse_share_long
      when no patient payment was posted on the program within the last 6 calendar months, payment_lapse_share_mid
      when one was posted within the last 6 calendar months but none within the last 3, and 1 otherwise, when a
      payment was posted within the last 3 calendar months, because Larkfield's hardship relief weighs the customer's
      own payments on the account.
    payment_share: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the payment share, which is payment_lapse_share_long
      when no patient payment was posted on the program within the last 6 calendar months, payment_lapse_share_mid
      when one was posted within the last 6 calendar months but none within the last 3, and 1 otherwise, when a
      payment was posted within the last 3 calendar months, because Larkfield's hardship relief weighs the customer's
      own payments on the account.
    posting_age_days: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the age share, which is recent_posting_share
      when the named posting was posted within the last 90 calendar days, middle_posting_share when it was posted
      91 to 180 days ago, and 1 when it is older.
    age_share: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the age share, which is recent_posting_share
      when the named posting was posted within the last 90 calendar days, middle_posting_share when it was posted
      91 to 180 days ago, and 1 when it is older.
    household_waivers: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the household share, which is household_share_high
      when the customer's CGM programs carry hardship_waiver adjustments posted within the last 12 calendar months
      totalling at least household_waiver_threshold, household_share_low when they carry such adjustments totalling
      less, and 1 when they carry none, because one household's hardship relief is shared across its Larkfield programs;
      a date falls within the last 12 calendar months when it is later than the same calendar day 12 months earlier.
    household_share: >-
      Before the ceilings and the rounding apply, the waiver is multiplied by the household share, which is household_share_high
      when the customer's CGM programs carry hardship_waiver adjustments posted within the last 12 calendar months
      totalling at least household_waiver_threshold, household_share_low when they carry such adjustments totalling
      less, and 1 when they carry none, because one household's hardship relief is shared across its Larkfield programs;
      a date falls within the last 12 calendar months when it is later than the same calendar day 12 months earlier.
    program_balance: >-
      The standard waiver is this: the waivable cost share is the named posting's amount; the waiver is the waivable
      cost share less every balance adjustment already posted against that posting, never below 0; it is never more
      than the named posting's amount less those adjustments, nor more than the program's balance less every other
      remittance patient responsibility, patient charge and refund of the program posted within the last N calendar
      months, N being one more than the whole calendar months from the named posting's date to today, and never
      below 0, so that the waiver never exceeds what payments applied to the oldest unpaid posting first can leave
      of that posting; and it is rounded to cents only at the end.
    named_months: >-
      The whole calendar months from a date to today are the months from that date's calendar month to the current
      one, less one when today's day of the month is earlier than that date's; a date falls within the last N calendar
      months when it is later than the same calendar day N months earlier.
    other_recent_postings: >-
      The standard waiver is this: the waivable cost share is the named posting's amount; the waiver is the waivable
      cost share less every balance adjustment already posted against that posting, never below 0; it is never more
      than the named posting's amount less those adjustments, nor more than the program's balance less every other
      remittance patient responsibility, patient charge and refund of the program posted within the last N calendar
      months, N being one more than the whole calendar months from the named posting's date to today, and never
      below 0, so that the waiver never exceeds what payments applied to the oldest unpaid posting first can leave
      of that posting; and it is rounded to cents only at the end.
    waiver_cap: >-
      The standard waiver is this: the waivable cost share is the named posting's amount; the waiver is the waivable
      cost share less every balance adjustment already posted against that posting, never below 0; it is never more
      than the named posting's amount less those adjustments, nor more than the program's balance less every other
      remittance patient responsibility, patient charge and refund of the program posted within the last N calendar
      months, N being one more than the whole calendar months from the named posting's date to today, and never
      below 0, so that the waiver never exceeds what payments applied to the oldest unpaid posting first can leave
      of that posting; and it is rounded to cents only at the end.
    waiver_raw: >-
      Each rule set out below replaces or multiplies only the standard quantity it names, the waivable cost share
      or the waiver, and the ceilings and the rounding of the standard method apply after them.
    waiver_tier: >-
      When a hardship application on a testing supplies program has request status approved and names a posting,
      Larkfield posts the hardship waiver against that posting as a hardship_waiver balance adjustment, as bgm_evt_patient_account
      allows only on tiers where hardship_waiver_allowed is true; the posting concerned is the one named on the
      program's latest approved hardship application, and on a tier where hardship_waiver_allowed is false this
      policy posts no waiver.
    result: >-
      Each rule set out below replaces or multiplies only the standard quantity it names, the waivable cost share
      or the waiver, and the ceilings and the rounding of the standard method apply after them.
  factors:
  - id: waivable_basis
    effect: method
    decides: waivable
    bindings:
    - named_allowed
    - named_type
    - coins_rate
    - deductible_part
    - waivable
    ladder:
    - when: >-
        the named posting is a remittance on a tier where deductible_applies is true and it carries a deductible
        part
      method: coinsurance part in full plus deductible_waiver_share of the deductible part
    - when: the named posting is a remittance on a tier with a copay above 0
      method: the lower of the posting's amount and the copay
    - when: otherwise
      method: the posting's amount
    baseline:
      waivable: named_amount
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: payer_class_share
    effect: parameter
    decides: payer_share
    bindings:
    - approved_recent
    - medicare_tier
    - payer_share
    ladder:
    - when: >-
        the Original Medicare or Medicare Advantage tier, and more than one approved hardship application of the
        program received within the last 12 calendar months
      value: K('medicare_repeat_share')
    - when: one of those Medicare tiers with one such application or none
      value: K('medicare_hardship_share')
    - when: >-
        otherwise (the Commercial HMO or Commercial PPO tier, the only other tiers on which this policy waives)
      value: '1'
    baseline:
      payer_share: '1'
    evidence:
    - tier_param
    - history
    cross_difficulty: null
  - id: payment_effort_share
    effect: parameter
    decides: payment_share
    bindings:
    - payments_3
    - payments_6
    - payment_share
    ladder:
    - when: no patient payment was posted on the program within the last 6 calendar months
      value: K('payment_lapse_share_long')
    - when: one was posted within the last 6 calendar months but none within the last 3
      value: K('payment_lapse_share_mid')
    - when: otherwise (a patient payment was posted within the last 3 calendar months)
      value: '1'
    baseline:
      payment_share: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: posting_age_share
    effect: parameter
    decides: age_share
    bindings:
    - posting_age_days
    - age_share
    ladder:
    - when: the named posting was posted within the last 90 calendar days
      value: K('recent_posting_share')
    - when: it was posted 91 to 180 days ago
      value: K('middle_posting_share')
    - when: otherwise
      value: '1'
    baseline:
      age_share: '1'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: household_relief_share
    effect: parameter
    decides: household_share
    bindings:
    - household_waivers
    - household_share
    ladder:
    - when: >-
        the customer's CGM programs carry hardship waivers of the last 12 calendar months totalling at least household_waiver_threshold
      value: K('household_share_high')
    - when: they carry such waivers totalling less
      value: K('household_share_low')
    - when: otherwise
      value: '1'
    baseline:
      household_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: cgm
  baseline:
    rule: >-
      The standard waiver is this: the waivable cost share is the named posting's amount; the waiver is the waivable
      cost share less every balance adjustment already posted against that posting, never below 0; it is never more
      than the named posting's amount less those adjustments, nor more than the program's balance less every other
      remittance patient responsibility, patient charge and refund of the program posted within the last N calendar
      months, N being one more than the whole calendar months from the named posting's date to today, and never
      below 0, so that the waiver never exceeds what payments applied to the oldest unpaid posting first can leave
      of that posting; and it is rounded to cents only at the end. The whole calendar months from a date to today
      are the months from that date's calendar month to the current one, less one when today's day of the month
      is earlier than that date's; a date falls within the last N calendar months when it is later than the same
      calendar day N months earlier.
    params: []
  inputs:
    history:
    - table: bgm_requests
      aggregate: latest
      field: bgm_ledger_id
      filters:
        request_type: hardship_application
        request_status: approved
    - table: bgm_billing
      aggregate: sum
      field: amount
      filters:
        event_type: bgm_balance_adjustment
    - table: bgm_billing
      aggregate: count
      field: bgm_ledger_id
      within_months: 6
      filters:
        event_type: bgm_patient_payment
    - table: bgm_billing
      aggregate: sum
      field: amount
      filters:
        event_type: bgm_claim_adjudication
    - category: cgm
      table: cgm_billing
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: cgm_balance_adjustment
        adjustment_reason: hardship_waiver
    cross_category:
    - cgm
- id: bgm_ext_payment_plan_installment
  base_policy_refs:
  - bgm_evt_patient_account
  overwrite: []
  trigger: on_request
  subject:
  - bgm_patient_payment
  computes: monthly_amount_usd
  target_tool: accept_payment_plan_2bd91da1
  params:
    short_plan_months: 2
    middle_plan_months: 6
    short_plan_balance: 150.0
    long_plan_balance: 300.0
    withdrawn_plan_months_off: 1
    completed_plan_months_on: 2
    hardship_plan_months_on: 2
    hardship_plan_months_older: 1
    household_balance_threshold: 100.0
    household_plan_months_on: 1
    household_plan_months_high: 2
  rule: >-
    A payment plan for a testing supplies program is offered under bgm_evt_patient_account only on tiers where payment_plan_max_months
    is greater than 0 and only for a program's balance of at least payment_plan_min_balance_usd, and no plan is
    offered otherwise; it is created as a payment plan request that the customer accepts personally, recording the
    monthly installment and the number of installments. The monthly installment of a payment plan is fixed only
    after the program's latest claim denial, when it denies a strip claim line and is not appealed but handled as
    a non-covered amount under a signed liability notice, carries its non-covered item patient charge on the program.
    Before the monthly installment of a payment plan is fixed, the posting named on the program's latest approved
    hardship application must carry its hardship waiver balance adjustment. The standard installment is this: the
    plan covers the program's balance; the installments number the tier's payment_plan_max_months; the monthly installment
    is the covered balance divided by the number of installments and rounded to cents, never below payment_plan_min_monthly_usd
    and never more than the covered balance; the number of installments is never more than payment_plan_max_months
    and never fewer than 1. The program's balance here is the running total of its patient-balance postings: remittance
    patient responsibility, patient charges and refunds less payments and balance adjustments. Each rule set out
    below replaces or changes only the standard quantity it names, the balance the plan covers or the number of
    installments, replacements before installments are added or taken off, and the limits of the standard method
    apply after them. The plan covers the program's balance less the patient charges posted on it within the last
    calendar month when such charges are on file, because those charges are still within their first statement's
    terms; it covers only the program's aged balance when no such charges are on file and the program carries an
    aged balance above 0 together with postings made within the last 4 calendar months, because the newer postings
    are still billed in the regular statement cycle; and otherwise it covers the program's balance; a date falls
    within the last calendar month when it is later than the same calendar day one month earlier. The aged balance
    is the program's postings dated more than 4 calendar months before today less all of its payments and balance
    adjustments, never below 0, a posting being that old when its posting date is not later than the same calendar
    day 4 months earlier. The installments number short_plan_months when the program's balance is below short_plan_balance,
    middle_plan_months when it is at least short_plan_balance and below long_plan_balance, and the tier's payment_plan_max_months
    when it is at least long_plan_balance. A payment plan request on the program received within the last 12 calendar
    months that now stands withdrawn takes withdrawn_plan_months_off installments off, even when another received
    in that span now stands completed; one received within that span that now stands completed, with none received
    in it standing withdrawn, adds completed_plan_months_on installments; and otherwise the count is left as it
    is; a date falls within the last 12 calendar months when it is later than the same calendar day 12 months earlier.
    An approved hardship application of the program received within the last 12 calendar months adds hardship_plan_months_on
    installments, an older approved one adds hardship_plan_months_older, and otherwise nothing is added. When the
    customer's active CGM program carries a balance of at least household_balance_threshold, the plan adds household_plan_months_high
    installments, when that CGM balance is above 0 but below household_balance_threshold it adds household_plan_months_on,
    and otherwise nothing is added, because the household is then paying a second Larkfield balance at the same
    time.
  prerequisite:
  - problem: bgm_ext_noncovered_strip_charge
    kind: value_input
    gate: program_balance
    form: state
    policy_source: >-
      The monthly installment of a payment plan is fixed only after the program's latest claim denial, when it denies
      a strip claim line and is not appealed but handled as a non-covered amount under a signed liability notice,
      carries its non-covered item patient charge on the program.
    condition: >-
      when the program's latest bgm_claim_denial denies a claim billing an A4253 shipment, is not routed to appeal
      under bgm_evt_denials_and_appeals and is covered by a bgm_liability_notice_signed record for A4253 dated on
      or before that shipment's ship date, that shipment has a bgm_patient_charge of charge_type non_covered_item
    resolved_by: post_noncovered_charge_41a38519
    effect: >-
      the non-covered charge enters the program's balance, which the plan's minimum-balance test and installment
      band read; a charge posted within the last calendar month is then left out of the covered balance
  - problem: bgm_ext_hardship_cost_share_waiver
    kind: value_input
    gate: program_balance
    form: state
    policy_source: >-
      Before the monthly installment of a payment plan is fixed, the posting named on the program's latest approved
      hardship application must carry its hardship waiver balance adjustment.
    condition: >-
      the posting named by the program's latest bgm_requests hardship_application with request_status approved has
      a bgm_balance_adjustment with adjustment_reason hardship_waiver against it
    resolved_by: post_hardship_waiver_f8410ea4
    effect: the hardship waiver leaves the program's balance, lowering the covered balance and the installment
  cross_category:
  - category: cgm
    as: branch
    reads:
    - patient_balance_due
    note: The active CGM program's balance decides how many installments the household months add.
  compute:
  - remit_total: SUM('bgm_billing','amount', event_type='bgm_claim_adjudication')
  - charge_total: SUM('bgm_billing','amount', event_type='bgm_patient_charge')
  - refund_total: SUM('bgm_billing','amount', event_type='bgm_patient_refund')
  - payment_total: SUM('bgm_billing','amount', event_type='bgm_patient_payment')
  - adjustment_total: SUM('bgm_billing','amount', event_type='bgm_balance_adjustment')
  - program_balance: RND(remit_total + charge_total + refund_total - payment_total - adjustment_total, 2)
  - recent_charges: >-
      SUM('bgm_billing','amount', within_months=1, date_field='posting_date', event_type='bgm_patient_charge')
  - recent_postings: >-
      SUM('bgm_billing','amount', within_months=4, date_field='posting_date', event_type='bgm_claim_adjudication')
      + SUM('bgm_billing','amount', within_months=4, date_field='posting_date', event_type='bgm_patient_charge')
      + SUM('bgm_billing','amount', within_months=4, date_field='posting_date', event_type='bgm_patient_refund')
  - aged_balance: >-
      MX(0, remit_total + charge_total + refund_total - recent_postings - payment_total - adjustment_total)
  - covered_balance: >-
      (program_balance - recent_charges) if recent_charges > 0 else (aged_balance if (aged_balance > 0 and recent_postings
      > 0) else program_balance)
  - band_balance: >-
      RND(SUM('bgm_billing','amount', event_type='bgm_claim_adjudication') + SUM('bgm_billing','amount', event_type='bgm_patient_charge')
      + SUM('bgm_billing','amount', event_type='bgm_patient_refund') - SUM('bgm_billing','amount', event_type='bgm_patient_payment')
      - SUM('bgm_billing','amount', event_type='bgm_balance_adjustment'), 2)
  - schedule_months: >-
      K('short_plan_months') if band_balance < K('short_plan_balance') else (K('middle_plan_months') if band_balance
      < K('long_plan_balance') else P('payment_plan_max_months'))
  - withdrawn_plans: >-
      COUNT('bgm_requests', within_months=12, date_field='received_at', request_type='payment_plan', request_status='withdrawn')
  - completed_plans: >-
      COUNT('bgm_requests', within_months=12, date_field='received_at', request_type='payment_plan', request_status='completed')
  - prior_plan_months: >-
      (0 - K('withdrawn_plan_months_off')) if withdrawn_plans > 0 else (K('completed_plan_months_on') if completed_plans
      > 0 else 0)
  - hardship_recent: >-
      COUNT('bgm_requests', within_months=12, date_field='received_at', request_type='hardship_application', request_status='approved')
  - hardship_any: COUNT('bgm_requests', request_type='hardship_application', request_status='approved')
  - hardship_months: >-
      K('hardship_plan_months_on') if hardship_recent > 0 else (K('hardship_plan_months_older') if hardship_any
      > 0 else 0)
  - cgm_balance: CFIELD('cgm','patient_balance_due', status='active') or 0
  - household_months: >-
      K('household_plan_months_high') if cgm_balance >= K('household_balance_threshold') else (K('household_plan_months_on')
      if cgm_balance > 0 else 0)
  - plan_months: >-
      MN(P('payment_plan_max_months'), MX(1, schedule_months + prior_plan_months + hardship_months + household_months))
  - plan_offered: P('payment_plan_max_months') > 0 and program_balance >= P('payment_plan_min_balance_usd')
  - result: >-
      MN(MX(0, covered_balance), MX(P('payment_plan_min_monthly_usd'), RND(covered_balance / plan_months, 2))) if
      plan_offered else 0
  compute_basis:
    remit_total: >-
      The program's balance here is the running total of its patient-balance postings: remittance patient responsibility,
      patient charges and refunds less payments and balance adjustments.
    charge_total: >-
      The program's balance here is the running total of its patient-balance postings: remittance patient responsibility,
      patient charges and refunds less payments and balance adjustments.
    refund_total: >-
      The program's balance here is the running total of its patient-balance postings: remittance patient responsibility,
      patient charges and refunds less payments and balance adjustments.
    payment_total: >-
      The program's balance here is the running total of its patient-balance postings: remittance patient responsibility,
      patient charges and refunds less payments and balance adjustments.
    adjustment_total: >-
      The program's balance here is the running total of its patient-balance postings: remittance patient responsibility,
      patient charges and refunds less payments and balance adjustments.
    program_balance: >-
      The program's balance here is the running total of its patient-balance postings: remittance patient responsibility,
      patient charges and refunds less payments and balance adjustments.
    recent_charges: >-
      The plan covers the program's balance less the patient charges posted on it within the last calendar month
      when such charges are on file, because those charges are still within their first statement's terms; it covers
      only the program's aged balance when no such charges are on file and the program carries an aged balance above
      0 together with postings made within the last 4 calendar months, because the newer postings are still billed
      in the regular statement cycle; and otherwise it covers the program's balance; a date falls within the last
      calendar month when it is later than the same calendar day one month earlier. The aged balance is the program's
      postings dated more than 4 calendar months before today less all of its payments and balance adjustments,
      never below 0, a posting being that old when its posting date is not later than the same calendar day 4 months
      earlier.
    recent_postings: >-
      The plan covers the program's balance less the patient charges posted on it within the last calendar month
      when such charges are on file, because those charges are still within their first statement's terms; it covers
      only the program's aged balance when no such charges are on file and the program carries an aged balance above
      0 together with postings made within the last 4 calendar months, because the newer postings are still billed
      in the regular statement cycle; and otherwise it covers the program's balance; a date falls within the last
      calendar month when it is later than the same calendar day one month earlier. The aged balance is the program's
      postings dated more than 4 calendar months before today less all of its payments and balance adjustments,
      never below 0, a posting being that old when its posting date is not later than the same calendar day 4 months
      earlier.
    aged_balance: >-
      The plan covers the program's balance less the patient charges posted on it within the last calendar month
      when such charges are on file, because those charges are still within their first statement's terms; it covers
      only the program's aged balance when no such charges are on file and the program carries an aged balance above
      0 together with postings made within the last 4 calendar months, because the newer postings are still billed
      in the regular statement cycle; and otherwise it covers the program's balance; a date falls within the last
      calendar month when it is later than the same calendar day one month earlier. The aged balance is the program's
      postings dated more than 4 calendar months before today less all of its payments and balance adjustments,
      never below 0, a posting being that old when its posting date is not later than the same calendar day 4 months
      earlier.
    covered_balance: >-
      The plan covers the program's balance less the patient charges posted on it within the last calendar month
      when such charges are on file, because those charges are still within their first statement's terms; it covers
      only the program's aged balance when no such charges are on file and the program carries an aged balance above
      0 together with postings made within the last 4 calendar months, because the newer postings are still billed
      in the regular statement cycle; and otherwise it covers the program's balance; a date falls within the last
      calendar month when it is later than the same calendar day one month earlier. The aged balance is the program's
      postings dated more than 4 calendar months before today less all of its payments and balance adjustments,
      never below 0, a posting being that old when its posting date is not later than the same calendar day 4 months
      earlier.
    band_balance: >-
      The installments number short_plan_months when the program's balance is below short_plan_balance, middle_plan_months
      when it is at least short_plan_balance and below long_plan_balance, and the tier's payment_plan_max_months
      when it is at least long_plan_balance.
    schedule_months: >-
      The installments number short_plan_months when the program's balance is below short_plan_balance, middle_plan_months
      when it is at least short_plan_balance and below long_plan_balance, and the tier's payment_plan_max_months
      when it is at least long_plan_balance.
    withdrawn_plans: >-
      A payment plan request on the program received within the last 12 calendar months that now stands withdrawn
      takes withdrawn_plan_months_off installments off, even when another received in that span now stands completed;
      one received within that span that now stands completed, with none received in it standing withdrawn, adds
      completed_plan_months_on installments; and otherwise the count is left as it is; a date falls within the last
      12 calendar months when it is later than the same calendar day 12 months earlier.
    completed_plans: >-
      A payment plan request on the program received within the last 12 calendar months that now stands withdrawn
      takes withdrawn_plan_months_off installments off, even when another received in that span now stands completed;
      one received within that span that now stands completed, with none received in it standing withdrawn, adds
      completed_plan_months_on installments; and otherwise the count is left as it is; a date falls within the last
      12 calendar months when it is later than the same calendar day 12 months earlier.
    prior_plan_months: >-
      A payment plan request on the program received within the last 12 calendar months that now stands withdrawn
      takes withdrawn_plan_months_off installments off, even when another received in that span now stands completed;
      one received within that span that now stands completed, with none received in it standing withdrawn, adds
      completed_plan_months_on installments; and otherwise the count is left as it is; a date falls within the last
      12 calendar months when it is later than the same calendar day 12 months earlier.
    hardship_recent: >-
      An approved hardship application of the program received within the last 12 calendar months adds hardship_plan_months_on
      installments, an older approved one adds hardship_plan_months_older, and otherwise nothing is added.
    hardship_any: >-
      An approved hardship application of the program received within the last 12 calendar months adds hardship_plan_months_on
      installments, an older approved one adds hardship_plan_months_older, and otherwise nothing is added.
    hardship_months: >-
      An approved hardship application of the program received within the last 12 calendar months adds hardship_plan_months_on
      installments, an older approved one adds hardship_plan_months_older, and otherwise nothing is added.
    cgm_balance: >-
      When the customer's active CGM program carries a balance of at least household_balance_threshold, the plan
      adds household_plan_months_high installments, when that CGM balance is above 0 but below household_balance_threshold
      it adds household_plan_months_on, and otherwise nothing is added, because the household is then paying a second
      Larkfield balance at the same time.
    household_months: >-
      When the customer's active CGM program carries a balance of at least household_balance_threshold, the plan
      adds household_plan_months_high installments, when that CGM balance is above 0 but below household_balance_threshold
      it adds household_plan_months_on, and otherwise nothing is added, because the household is then paying a second
      Larkfield balance at the same time.
    plan_months: >-
      Each rule set out below replaces or changes only the standard quantity it names, the balance the plan covers
      or the number of installments, replacements before installments are added or taken off, and the limits of
      the standard method apply after them.
    plan_offered: >-
      A payment plan for a testing supplies program is offered under bgm_evt_patient_account only on tiers where
      payment_plan_max_months is greater than 0 and only for a program's balance of at least payment_plan_min_balance_usd,
      and no plan is offered otherwise; it is created as a payment plan request that the customer accepts personally,
      recording the monthly installment and the number of installments.
    result: >-
      Each rule set out below replaces or changes only the standard quantity it names, the balance the plan covers
      or the number of installments, replacements before installments are added or taken off, and the limits of
      the standard method apply after them.
  factors:
  - id: plan_balance_scope
    effect: method
    decides: covered_balance
    bindings:
    - recent_charges
    - recent_postings
    - aged_balance
    - covered_balance
    ladder:
    - when: patient charges were posted on the program within the last calendar month
      method: the program's balance less those charges
    - when: >-
        no such charges, and the program carries an aged balance above 0 together with postings made within the
        last 4 calendar months
      method: the program's aged balance alone
    - when: otherwise
      method: the program's balance
    baseline:
      covered_balance: program_balance
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: balance_band_months
    effect: parameter
    decides: schedule_months
    bindings:
    - band_balance
    - schedule_months
    ladder:
    - when: the program's balance is below short_plan_balance
      value: K('short_plan_months')
    - when: it is at least short_plan_balance and below long_plan_balance
      value: K('middle_plan_months')
    - when: otherwise
      value: P('payment_plan_max_months')
    baseline:
      schedule_months: P('payment_plan_max_months')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: prior_plan_record
    effect: parameter
    decides: prior_plan_months
    bindings:
    - withdrawn_plans
    - completed_plans
    - prior_plan_months
    ladder:
    - when: >-
        a payment plan request on the program received within the last 12 calendar months now stands withdrawn
      value: 0 - K('withdrawn_plan_months_off')
    - when: none such stands withdrawn, and one received within that span now stands completed
      value: K('completed_plan_months_on')
    - when: otherwise
      value: '0'
    baseline:
      prior_plan_months: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: hardship_months_extension
    effect: parameter
    decides: hardship_months
    bindings:
    - hardship_recent
    - hardship_any
    - hardship_months
    ladder:
    - when: an approved hardship application of the program was received within the last 12 calendar months
      value: K('hardship_plan_months_on')
    - when: the program's approved hardship application is older
      value: K('hardship_plan_months_older')
    - when: otherwise
      value: '0'
    baseline:
      hardship_months: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: household_months_extension
    effect: parameter
    decides: household_months
    bindings:
    - cgm_balance
    - household_months
    ladder:
    - when: the customer's active CGM program carries a balance of at least household_balance_threshold
      value: K('household_plan_months_high')
    - when: that CGM balance is above 0 but below household_balance_threshold
      value: K('household_plan_months_on')
    - when: otherwise
      value: '0'
    baseline:
      household_months: '0'
    evidence:
    - cross_category
    cross_difficulty: cgm
  baseline:
    rule: >-
      The standard installment is this: the plan covers the program's balance; the installments number the tier's
      payment_plan_max_months; the monthly installment is the covered balance divided by the number of installments
      and rounded to cents, never below payment_plan_min_monthly_usd and never more than the covered balance; the
      number of installments is never more than payment_plan_max_months and never fewer than 1. The program's balance
      here is the running total of its patient-balance postings: remittance patient responsibility, patient charges
      and refunds less payments and balance adjustments.
    params:
    - payment_plan_max_months
    - payment_plan_min_monthly_usd
  inputs:
    history:
    - table: bgm_billing
      aggregate: sum
      field: amount
      filters:
        event_type: bgm_claim_adjudication
    - table: bgm_billing
      aggregate: sum
      field: amount
      filters:
        event_type: bgm_patient_payment
    - table: bgm_billing
      aggregate: sum
      field: amount
      within_months: 4
      filters:
        event_type: bgm_claim_adjudication
    - table: bgm_requests
      aggregate: count
      field: received_at
      within_months: 12
      filters:
        request_type: payment_plan
    - table: bgm_billing
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: bgm_patient_charge
    cross_category:
    - cgm
- id: bgm_ext_courtesy_bridge_reship
  base_policy_refs:
  - bgm_evt_replacement_and_delivery
  - bgm_evt_quantity_limits
  - bgm_evt_patient_account
  overwrite: []
  trigger: on_request
  subject:
  - bgm_replacement_shipment
  computes: units
  target_tool: ship_courtesy_reship_05d6f35c
  params:
    repeat_share_12_24: 0.75
    repeat_share_24_36: 0.9
    cgm_wearing_share: 0.6
    cgm_paused_share: 1.25
    standard_transit_days: 7
    expedited_transit_days: 2
    pump_reserve_strips: 40
    mdi_reserve_strips: 30
  rule: >-
    When the proof of delivery shows the program's latest strip refill as delivered but the customer reports it
    not received, Larkfield sends a no-charge courtesy reship under bgm_evt_replacement_and_delivery while the program's
    courtesy reships over the rolling 12 months are fewer than courtesy_reships_per_12_months; the courtesy reship
    carries the customer for a bounded number of days rather than repeating the whole package, and it never ships
    more units than the refill it stands in for. The days until the next refill may ship are that refill's supply
    days less refill_ship_lead_days, less the calendar days since its ship date. A courtesy reship for a program
    that carries a past-due amount is not shipped until an approved payment plan request stands on the program.
    The standard courtesy reship is this: the days it covers are one 30-day block, and it ships the strips for those
    days plus the transit days at strips_per_90_days_non_insulin divided by 90 strips a day, divided by strips_per_billing_unit
    and rounded up to a whole unit, never more than the refill's units. The courtesy reship ships expedited at no
    charge when the refill it stands in for shipped expedited at no charge, because Larkfield then owed that refill
    a two-day delivery, and by standard shipping otherwise, a customer-paid expedite included; its transit days
    are standard_transit_days when it ships by standard shipping and expedited_transit_days when it ships expedited.
    Each rule set out below changes only the standard quantity it names: the days the reship covers are replaced,
    then days are added to them, before the strips a day are applied; the strips are then multiplied before strips
    are added; and the rounding and the cap of the standard method apply last. When the days until the next refill
    may ship are more than 30, the days the reship covers are those days instead of the 30-day block, so that it
    bridges the customer to the next refill; when they are 0 or fewer, the reship instead replaces every unit of
    the refill, one for one, and no other rule below changes it; and when they are 1 to 30, it keeps the 30-day
    block. Days are added to the days the reship covers: refill_ship_lead_days when the refill stood in for shipped
    on the customer's recorded refill confirmation on a tier whose supply_days_per_shipment is 90, because the next
    90-day refill ships only once the customer confirms it again; refill_ship_lead_days less refill_contact_lead_days,
    which takes days off where the contact lead is the longer, when that refill shipped on a recorded confirmation
    on a tier whose supply_days_per_shipment is 30, because the next refill then waits on Larkfield's refill contact;
    and none otherwise. In place of strips_per_90_days_non_insulin divided by 90, the strips a day the reship carries
    are the strips per 30 days on the program's newest written order for test strips divided by 30 when a medical
    record with purpose over_limit_justification is dated within the last high_utilization_record_months calendar
    months; strips_per_90_days_insulin divided by 90 for an insulin-treated customer without such a record; and
    strips_per_90_days_non_insulin divided by 90 otherwise. The strips for the days the reship covers and the transit
    days are multiplied by the repeat share, which is repeat_share_12_24 when the program had a courtesy reship
    more than 12 and at most 24 calendar months ago, repeat_share_24_36 when its latest earlier courtesy reship
    was more than 24 and at most 36 months ago, and 1 otherwise; a reship counts as within N months when its ship
    date is later than the same calendar day N months earlier. They are also multiplied by the sensor share, which
    is cgm_wearing_share when the customer's CGM program is active and a sensor refill shipped to the customer on
    any of the customer's CGM programs within the last 3 calendar months, because confirmation testing is all that
    the bridge must carry; cgm_paused_share when the customer's CGM program is on hold; and 1 otherwise. To the
    strips so found are added, before they are divided into whole units, the reserve strips, which are pump_reserve_strips
    when the customer's open CGM program records the insulin regimen insulin_pump, mdi_reserve_strips when it records
    multiple_daily_injections, and none otherwise, because a customer on insulin keeps a fingerstick reserve for
    sensor failures and warm-up periods; an open CGM program is one that is not closed. A courtesy reship this policy
    quantifies ships the units stated here, which stay within the cap bgm_evt_replacement_and_delivery sets; a replacement
    for a package lost in transit, damaged in transit or defective is outside this policy.
  prerequisite:
  - problem: bgm_ext_payment_plan_installment
    kind: state_gate
    gate: bgm_requests.request_status
    form: state
    policy_source: >-
      A courtesy reship for a program that carries a past-due amount is not shipped until an approved payment plan
      request stands on the program.
    condition: >-
      whenever the program's past-due amount (bgm_msr_past_due_amount) is above 0, a bgm_requests row with request_type
      payment_plan and request_status approved stands on the program
    resolved_by: accept_payment_plan_2bd91da1
    effect: the courtesy reship may ship at the bridge quantity computed here
  cross_category:
  - category: cgm
    as: branch
    reads:
    - status
    - insulin_regimen
    - cgm_shipments.ship_date
    note: >-
      The CGM program's status and its sensor refills in the last 3 calendar months decide the sensor share; the
      insulin regimen on the customer's open CGM program decides the reserve strips.
  compute:
  - lost_id: >-
      LATEST('bgm_shipments','bgm_shipment_id', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
  - lost_units: >-
      LATEST('bgm_shipments','units', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
      or 0
  - lost_ship: >-
      LATEST('bgm_shipments','ship_date', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
      or NOW
  - lost_days: >-
      LATEST('bgm_shipments','supply_days', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
      or 0
  - days_to_next: lost_days - P('refill_ship_lead_days') - DAYS(lost_ship, NOW)
  - bridge_mode: 1 if days_to_next > 30 else (3 if days_to_next <= 0 else 2)
  - lost_confirmed: >-
      LATEST('bgm_shipments','refill_confirmed_date', date_field='ship_date', event_type='bgm_refill_shipment',
      item_code='A4253') or ''
  - lead_adjust_days: >-
      P('refill_ship_lead_days') if (lost_confirmed and P('supply_days_per_shipment') == 90) else ((P('refill_ship_lead_days')
      - P('refill_contact_lead_days')) if (lost_confirmed and P('supply_days_per_shipment') == 30) else 0)
  - overlimit_records: >-
      COUNT('bgm_orders', within_months=P('high_utilization_record_months'), date_field='visit_date', event_type='bgm_medical_record_receipt',
      record_purpose='over_limit_justification')
  - newest_order_qty: >-
      LATEST('bgm_orders','quantity_per_30_days', date_field='order_date', event_type='bgm_order_receipt', item_code='A4253')
      or 0
  - daily_rate: >-
      (newest_order_qty * P('strips_per_billing_unit') / 30) if (overlimit_records > 0 and P('high_utilization_record_months')
      > 0) else ((P('strips_per_90_days_insulin') / 90) if (F('treatment_class') == 'insulin_treated' and overlimit_records
      == 0) else (P('strips_per_90_days_non_insulin') / 90))
  - courtesy_12: >-
      COUNT('bgm_shipments', within_months=12, date_field='ship_date', event_type='bgm_replacement_shipment', replacement_reason='delivered_not_received')
  - courtesy_24: >-
      COUNT('bgm_shipments', within_months=24, date_field='ship_date', event_type='bgm_replacement_shipment', replacement_reason='delivered_not_received')
  - courtesy_36: >-
      COUNT('bgm_shipments', within_months=36, date_field='ship_date', event_type='bgm_replacement_shipment', replacement_reason='delivered_not_received')
  - repeat_share: >-
      K('repeat_share_12_24') if (courtesy_24 > courtesy_12) else (K('repeat_share_24_36') if (courtesy_36 > courtesy_24)
      else 1)
  - cgm_active: EXISTS('cgm', status='active')
  - cgm_on_hold: EXISTS('cgm', status='on_hold')
  - recent_sensor_refills: >-
      XCOUNT('cgm','cgm_shipments', within_months=3, date_field='ship_date', event_type='cgm_refill_shipment', item_code='A4239')
  - sensor_share: >-
      K('cgm_wearing_share') if (cgm_active and recent_sensor_refills > 0) else (K('cgm_paused_share') if cgm_on_hold
      else 1)
  - lost_method: >-
      LATEST('bgm_shipments','shipping_method', date_field='ship_date', event_type='bgm_refill_shipment', item_code='A4253')
      or ''
  - reship_method: '''expedited_no_charge'' if lost_method == ''expedited_no_charge'' else ''standard'''
  - transit_days: K('standard_transit_days') if reship_method == 'standard' else K('expedited_transit_days')
  - open_regimen: >-
      CFIELD('cgm','insulin_regimen', status='active') or CFIELD('cgm','insulin_regimen', status='on_hold') or CFIELD('cgm','insulin_regimen',
      status='pending_authorization') or CFIELD('cgm','insulin_regimen', status='referral_received')
  - reserve_strips: >-
      K('pump_reserve_strips') if open_regimen == 'insulin_pump' else (K('mdi_reserve_strips') if open_regimen ==
      'multiple_daily_injections' else 0)
  - cover_days: (days_to_next if bridge_mode == 1 else 30) + lead_adjust_days
  - reship_strips: (cover_days + transit_days) * daily_rate * repeat_share * sensor_share + reserve_strips
  - result: >-
      lost_units if bridge_mode == 3 else MN(lost_units, int(-((-reship_strips) // P('strips_per_billing_unit'))))
  compute_basis:
    lost_id: >-
      When the proof of delivery shows the program's latest strip refill as delivered but the customer reports it
      not received, Larkfield sends a no-charge courtesy reship under bgm_evt_replacement_and_delivery while the
      program's courtesy reships over the rolling 12 months are fewer than courtesy_reships_per_12_months; the courtesy
      reship carries the customer for a bounded number of days rather than repeating the whole package, and it never
      ships more units than the refill it stands in for.
    lost_units: >-
      When the proof of delivery shows the program's latest strip refill as delivered but the customer reports it
      not received, Larkfield sends a no-charge courtesy reship under bgm_evt_replacement_and_delivery while the
      program's courtesy reships over the rolling 12 months are fewer than courtesy_reships_per_12_months; the courtesy
      reship carries the customer for a bounded number of days rather than repeating the whole package, and it never
      ships more units than the refill it stands in for.
    lost_ship: >-
      When the proof of delivery shows the program's latest strip refill as delivered but the customer reports it
      not received, Larkfield sends a no-charge courtesy reship under bgm_evt_replacement_and_delivery while the
      program's courtesy reships over the rolling 12 months are fewer than courtesy_reships_per_12_months; the courtesy
      reship carries the customer for a bounded number of days rather than repeating the whole package, and it never
      ships more units than the refill it stands in for.
    lost_days: >-
      The days until the next refill may ship are that refill's supply days less refill_ship_lead_days, less the
      calendar days since its ship date.
    days_to_next: >-
      The days until the next refill may ship are that refill's supply days less refill_ship_lead_days, less the
      calendar days since its ship date.
    bridge_mode: >-
      When the days until the next refill may ship are more than 30, the days the reship covers are those days instead
      of the 30-day block, so that it bridges the customer to the next refill; when they are 0 or fewer, the reship
      instead replaces every unit of the refill, one for one, and no other rule below changes it; and when they
      are 1 to 30, it keeps the 30-day block.
    lost_confirmed: >-
      Days are added to the days the reship covers: refill_ship_lead_days when the refill stood in for shipped on
      the customer's recorded refill confirmation on a tier whose supply_days_per_shipment is 90, because the next
      90-day refill ships only once the customer confirms it again; refill_ship_lead_days less refill_contact_lead_days,
      which takes days off where the contact lead is the longer, when that refill shipped on a recorded confirmation
      on a tier whose supply_days_per_shipment is 30, because the next refill then waits on Larkfield's refill contact;
      and none otherwise.
    lead_adjust_days: >-
      Days are added to the days the reship covers: refill_ship_lead_days when the refill stood in for shipped on
      the customer's recorded refill confirmation on a tier whose supply_days_per_shipment is 90, because the next
      90-day refill ships only once the customer confirms it again; refill_ship_lead_days less refill_contact_lead_days,
      which takes days off where the contact lead is the longer, when that refill shipped on a recorded confirmation
      on a tier whose supply_days_per_shipment is 30, because the next refill then waits on Larkfield's refill contact;
      and none otherwise.
    overlimit_records: >-
      In place of strips_per_90_days_non_insulin divided by 90, the strips a day the reship carries are the strips
      per 30 days on the program's newest written order for test strips divided by 30 when a medical record with
      purpose over_limit_justification is dated within the last high_utilization_record_months calendar months;
      strips_per_90_days_insulin divided by 90 for an insulin-treated customer without such a record; and strips_per_90_days_non_insulin
      divided by 90 otherwise.
    newest_order_qty: >-
      In place of strips_per_90_days_non_insulin divided by 90, the strips a day the reship carries are the strips
      per 30 days on the program's newest written order for test strips divided by 30 when a medical record with
      purpose over_limit_justification is dated within the last high_utilization_record_months calendar months;
      strips_per_90_days_insulin divided by 90 for an insulin-treated customer without such a record; and strips_per_90_days_non_insulin
      divided by 90 otherwise.
    daily_rate: >-
      In place of strips_per_90_days_non_insulin divided by 90, the strips a day the reship carries are the strips
      per 30 days on the program's newest written order for test strips divided by 30 when a medical record with
      purpose over_limit_justification is dated within the last high_utilization_record_months calendar months;
      strips_per_90_days_insulin divided by 90 for an insulin-treated customer without such a record; and strips_per_90_days_non_insulin
      divided by 90 otherwise.
    courtesy_12: >-
      The strips for the days the reship covers and the transit days are multiplied by the repeat share, which is
      repeat_share_12_24 when the program had a courtesy reship more than 12 and at most 24 calendar months ago,
      repeat_share_24_36 when its latest earlier courtesy reship was more than 24 and at most 36 months ago, and
      1 otherwise; a reship counts as within N months when its ship date is later than the same calendar day N months
      earlier.
    courtesy_24: >-
      The strips for the days the reship covers and the transit days are multiplied by the repeat share, which is
      repeat_share_12_24 when the program had a courtesy reship more than 12 and at most 24 calendar months ago,
      repeat_share_24_36 when its latest earlier courtesy reship was more than 24 and at most 36 months ago, and
      1 otherwise; a reship counts as within N months when its ship date is later than the same calendar day N months
      earlier.
    courtesy_36: >-
      The strips for the days the reship covers and the transit days are multiplied by the repeat share, which is
      repeat_share_12_24 when the program had a courtesy reship more than 12 and at most 24 calendar months ago,
      repeat_share_24_36 when its latest earlier courtesy reship was more than 24 and at most 36 months ago, and
      1 otherwise; a reship counts as within N months when its ship date is later than the same calendar day N months
      earlier.
    repeat_share: >-
      The strips for the days the reship covers and the transit days are multiplied by the repeat share, which is
      repeat_share_12_24 when the program had a courtesy reship more than 12 and at most 24 calendar months ago,
      repeat_share_24_36 when its latest earlier courtesy reship was more than 24 and at most 36 months ago, and
      1 otherwise; a reship counts as within N months when its ship date is later than the same calendar day N months
      earlier.
    cgm_active: >-
      They are also multiplied by the sensor share, which is cgm_wearing_share when the customer's CGM program is
      active and a sensor refill shipped to the customer on any of the customer's CGM programs within the last 3
      calendar months, because confirmation testing is all that the bridge must carry; cgm_paused_share when the
      customer's CGM program is on hold; and 1 otherwise.
    cgm_on_hold: >-
      They are also multiplied by the sensor share, which is cgm_wearing_share when the customer's CGM program is
      active and a sensor refill shipped to the customer on any of the customer's CGM programs within the last 3
      calendar months, because confirmation testing is all that the bridge must carry; cgm_paused_share when the
      customer's CGM program is on hold; and 1 otherwise.
    recent_sensor_refills: >-
      They are also multiplied by the sensor share, which is cgm_wearing_share when the customer's CGM program is
      active and a sensor refill shipped to the customer on any of the customer's CGM programs within the last 3
      calendar months, because confirmation testing is all that the bridge must carry; cgm_paused_share when the
      customer's CGM program is on hold; and 1 otherwise.
    sensor_share: >-
      They are also multiplied by the sensor share, which is cgm_wearing_share when the customer's CGM program is
      active and a sensor refill shipped to the customer on any of the customer's CGM programs within the last 3
      calendar months, because confirmation testing is all that the bridge must carry; cgm_paused_share when the
      customer's CGM program is on hold; and 1 otherwise.
    lost_method: >-
      The courtesy reship ships expedited at no charge when the refill it stands in for shipped expedited at no
      charge, because Larkfield then owed that refill a two-day delivery, and by standard shipping otherwise, a
      customer-paid expedite included; its transit days are standard_transit_days when it ships by standard shipping
      and expedited_transit_days when it ships expedited.
    reship_method: >-
      The courtesy reship ships expedited at no charge when the refill it stands in for shipped expedited at no
      charge, because Larkfield then owed that refill a two-day delivery, and by standard shipping otherwise, a
      customer-paid expedite included; its transit days are standard_transit_days when it ships by standard shipping
      and expedited_transit_days when it ships expedited.
    transit_days: >-
      The courtesy reship ships expedited at no charge when the refill it stands in for shipped expedited at no
      charge, because Larkfield then owed that refill a two-day delivery, and by standard shipping otherwise, a
      customer-paid expedite included; its transit days are standard_transit_days when it ships by standard shipping
      and expedited_transit_days when it ships expedited.
    open_regimen: >-
      To the strips so found are added, before they are divided into whole units, the reserve strips, which are
      pump_reserve_strips when the customer's open CGM program records the insulin regimen insulin_pump, mdi_reserve_strips
      when it records multiple_daily_injections, and none otherwise, because a customer on insulin keeps a fingerstick
      reserve for sensor failures and warm-up periods; an open CGM program is one that is not closed.
    reserve_strips: >-
      To the strips so found are added, before they are divided into whole units, the reserve strips, which are
      pump_reserve_strips when the customer's open CGM program records the insulin regimen insulin_pump, mdi_reserve_strips
      when it records multiple_daily_injections, and none otherwise, because a customer on insulin keeps a fingerstick
      reserve for sensor failures and warm-up periods; an open CGM program is one that is not closed.
    cover_days: >-
      Each rule set out below changes only the standard quantity it names: the days the reship covers are replaced,
      then days are added to them, before the strips a day are applied; the strips are then multiplied before strips
      are added; and the rounding and the cap of the standard method apply last.
    reship_strips: >-
      Each rule set out below changes only the standard quantity it names: the days the reship covers are replaced,
      then days are added to them, before the strips a day are applied; the strips are then multiplied before strips
      are added; and the rounding and the cap of the standard method apply last.
    result: >-
      Each rule set out below changes only the standard quantity it names: the days the reship covers are replaced,
      then days are added to them, before the strips a day are applied; the strips are then multiplied before strips
      are added; and the rounding and the cap of the standard method apply last.
  factors:
  - id: bridge_shape
    effect: method
    decides: bridge_mode
    bindings:
    - days_to_next
    - bridge_mode
    ladder:
    - when: the days until the next refill may ship are more than 30
      method: the days the reship covers are those days instead of the 30-day block
    - when: they are 0 or fewer
      method: every unit of the refill stood in for, one for one, with no other change
    - when: otherwise (1 to 30)
      method: the reship keeps the 30-day block
    baseline:
      bridge_mode: '2'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: bridge_day_convention
    effect: parameter
    decides: lead_adjust_days
    bindings:
    - lost_confirmed
    - lead_adjust_days
    ladder:
    - when: >-
        the refill stood in for shipped on the customer's recorded refill confirmation, on a tier that ships 90-day
        supplies
      value: P('refill_ship_lead_days')
    - when: that refill shipped on a recorded confirmation, on a tier that ships 30-day supplies
      value: P('refill_ship_lead_days') - P('refill_contact_lead_days')
    - when: otherwise (no recorded confirmation on that refill)
      value: '0'
    baseline:
      lead_adjust_days: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: bridge_daily_rate
    effect: parameter
    decides: daily_rate
    bindings:
    - overlimit_records
    - newest_order_qty
    - daily_rate
    ladder:
    - when: >-
        an over_limit_justification medical record is dated within the last high_utilization_record_months months
      value: the newest strip order's strips per 30 days divided by 30
    - when: the customer is insulin-treated and no such record is on file
      value: P('strips_per_90_days_insulin') / 90
    - when: otherwise
      value: P('strips_per_90_days_non_insulin') / 90
    baseline:
      daily_rate: P('strips_per_90_days_non_insulin') / 90
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: repeat_courtesy_share
    effect: parameter
    decides: repeat_share
    bindings:
    - courtesy_12
    - courtesy_24
    - courtesy_36
    - repeat_share
    ladder:
    - when: a courtesy reship shipped more than 12 and at most 24 calendar months ago
      value: K('repeat_share_12_24')
    - when: the latest earlier courtesy reship shipped more than 24 and at most 36 months ago
      value: K('repeat_share_24_36')
    - when: otherwise
      value: '1'
    baseline:
      repeat_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: sensor_wear_share
    effect: parameter
    decides: sensor_share
    bindings:
    - cgm_active
    - cgm_on_hold
    - recent_sensor_refills
    - sensor_share
    ladder:
    - when: >-
        the customer's CGM program is active and a sensor refill shipped to the customer on any of the customer's
        CGM programs within the last 3 calendar months
      value: K('cgm_wearing_share')
    - when: the customer's CGM program is on hold
      value: K('cgm_paused_share')
    - when: otherwise
      value: '1'
    baseline:
      sensor_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: cgm
  - id: fingerstick_reserve
    effect: parameter
    decides: reserve_strips
    bindings:
    - open_regimen
    - reserve_strips
    ladder:
    - when: the customer's open CGM program records the insulin regimen insulin_pump
      value: K('pump_reserve_strips')
    - when: it records multiple_daily_injections
      value: K('mdi_reserve_strips')
    - when: otherwise (no open CGM program records either regimen)
      value: '0'
    baseline:
      reserve_strips: '0'
    evidence:
    - cross_category
    cross_difficulty: cgm
  baseline:
    rule: >-
      The standard courtesy reship is this: the days it covers are one 30-day block, and it ships the strips for
      those days plus the transit days at strips_per_90_days_non_insulin divided by 90 strips a day, divided by
      strips_per_billing_unit and rounded up to a whole unit, never more than the refill's units. The courtesy reship
      ships expedited at no charge when the refill it stands in for shipped expedited at no charge, because Larkfield
      then owed that refill a two-day delivery, and by standard shipping otherwise, a customer-paid expedite included;
      its transit days are standard_transit_days when it ships by standard shipping and expedited_transit_days when
      it ships expedited.
    params:
    - strips_per_90_days_non_insulin
    - strips_per_billing_unit
  inputs:
    history:
    - table: bgm_shipments
      aggregate: latest
      field: ship_date
      filters:
        event_type: bgm_refill_shipment
        item_code: A4253
    - table: bgm_shipments
      aggregate: count
      field: ship_date
      within_months: 24
      filters:
        event_type: bgm_replacement_shipment
        replacement_reason: delivered_not_received
    - table: bgm_orders
      aggregate: count
      field: visit_date
      within_months: 6
      filters:
        event_type: bgm_medical_record_receipt
        record_purpose: over_limit_justification
    - category: cgm
      table: cgm_shipments
      aggregate: count
      field: ship_date
      within_months: 3
      filters:
        event_type: cgm_refill_shipment
        item_code: A4239
    cross_category:
    - cgm
