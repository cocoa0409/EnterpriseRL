    late_share: >-
      A charge Larkfield posts more than 60 calendar days after the denial's posting date is reduced to late_share_over_60
      of itself, one posted 31 to 60 days after it to late_share_31_60, and one posted within 30 days is not reduced.
    hardship_recent: >-
      When the program has a hardship application with request status approved that was received within the last
      12 calendar months, the charge is reduced to hardship_share_recent of itself; when its approved hardship application
      is older, to hardship_share_older; and otherwise it is not reduced; a date falls within the last 12 calendar
      months when it is later than the same calendar day 12 months earlier.
    hardship_any: >-
      When the program has a hardship application with request status approved that was received within the last
      12 calendar months, the charge is reduced to hardship_share_recent of itself; when its approved hardship application
      is older, to hardship_share_older; and otherwise it is not reduced; a date falls within the last 12 calendar
      months when it is later than the same calendar day 12 months earlier.
    hardship_share: >-
      When the program has a hardship application with request status approved that was received within the last
      12 calendar months, the charge is reduced to hardship_share_recent of itself; when its approved hardship application
      is older, to hardship_share_older; and otherwise it is not reduced; a date falls within the last 12 calendar
      months when it is later than the same calendar day 12 months earlier.
    support_records: >-
      This policy prices that charge only when the shipment is a refill of test strips, the denial code is CO-151
      and no medical record with purpose over_limit_justification is on file for the program, or the denial code
