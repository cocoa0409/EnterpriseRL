    window_allowance: >-
      Each rule set out below replaces only the standard quantity it names, the coverage, the window and what is
      measured against it, the units per 30 days the notice covers, or the 30-day blocks it reaches, and the notice
      is then sized as the standard method states.
    window_blocks: >-
