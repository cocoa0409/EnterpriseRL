      when that meter was delivered later than the latest strip refill was, by that refill's own proof of delivery;
      they end on the testing supplies program's hold start date when no newer meter was delivered later than that
      refill and the program went on hold later than that refill was delivered; otherwise they end today.
    program_hold_start: >-
