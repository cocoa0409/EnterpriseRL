      a non_covered_item patient charge; the charge concerns the program's latest claim denial, the claim it denies
      and the shipment that claim bills, and the notice that counts is the program's latest liability notice for
      test strips.
    claim_billed: >-
      The standard charge is this: the units concerned are the units that notice covers; the price of a unit is
      Larkfield's billed charge on the denied claim divided by the shipment's units; the charge is the units concerned
      times that price, never for more units than the notice covers or than the shipment carried, rounded to cents
      only at the end.
    ship_units: >-
      When the payer denies a strip claim line that the customer's signed liability notice covers and the denial
