    window_strip_units: >-
      The standard sizing is this: the notice covers the units per 30 days of the written order behind the program's
      latest strip refill times the 30-day blocks the notice reaches, less the units the coverage covers over that
      reach, and never fewer than 0; the notice reaches one 30-day block; the coverage is the tier's strips_per_90_days_non_insulin,
      and what is measured against the window is that whole coverage, the window being the 3 calendar months ending
      on the ship date, a strip refill falling in the window when its ship date is later than the same calendar
      day 3 months earlier; the strips the window counts are the units of the program's strip refills shipped in
      it, replacement shipments not counted, less the units of take-back authorizations for test strips issued in
      the last calendar month and the units of liability notices for test strips signed in the last calendar month,
      never below 0, times strips_per_billing_unit, because units on their way back and units the customer pays
      for under a notice do not use the plan's coverage; the units the coverage covers are the strips that what
      is measured against the window leaves after the window's count, divided by strips_per_billing_unit, rounded
      down to whole units and never below 0; and every 30-day block of the reach beyond the blocks the window spans
      adds one block's share of what is measured against the window, that share being what is measured against the
      window divided by the window's 30-day blocks and by strips_per_billing_unit, rounded down to whole units.
