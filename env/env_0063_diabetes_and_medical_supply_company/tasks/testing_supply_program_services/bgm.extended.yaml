      when that meter was delivered later than the latest strip refill was, by that refill's own proof of delivery;
      they end on the testing supplies program's hold start date when no newer meter was delivered later than that
      refill and the program went on hold later than that refill was delivered; otherwise they end today.
    use_days: >-
      Each rule set out below changes the standard count only in the part it names, where the days of use start
      or end, which shipment's units are counted, or the strips counted for a day of use, and the count is then
      made as the standard method states, the strips counted for a day of use never falling below 0 and days of
      use that would end before they start counting as none.
    insulin_class: >-
      In place of daily_pace_default, the strips counted for a day of use are daily_pace_pump strips for an insulin-treated
      customer whose open CGM program records the insulin regimen insulin_pump, daily_pace_mdi strips for an insulin-treated
      customer whose open CGM program records multiple_daily_injections or who holds no open CGM program, and daily_pace_default
      strips for any other customer; an open CGM program is one that is not closed.
    open_cgm_regimen: >-
      In place of daily_pace_default, the strips counted for a day of use are daily_pace_pump strips for an insulin-treated
      customer whose open CGM program records the insulin regimen insulin_pump, daily_pace_mdi strips for an insulin-treated
      customer whose open CGM program records multiple_daily_injections or who holds no open CGM program, and daily_pace_default
      strips for any other customer; an open CGM program is one that is not closed.
    daily_pace: >-
      In place of daily_pace_default, the strips counted for a day of use are daily_pace_pump strips for an insulin-treated
      customer whose open CGM program records the insulin regimen insulin_pump, daily_pace_mdi strips for an insulin-treated
      customer whose open CGM program records multiple_daily_injections or who holds no open CGM program, and daily_pace_default
      strips for any other customer; an open CGM program is one that is not closed.
    cgm_on_hold: >-
      cgm_paused_pace_shift strips are added to the strips counted for every day of use when the customer's CGM
      program is on hold, because fingersticks then stand in for the sensor readings; cgm_wearing_pace_shift strips
      are taken off the strips counted for every day of use when the customer's CGM program is active and a sensor
      refill shipped to the customer on any of the customer's CGM programs within the last 3 calendar months, a
      sensor refill falling in that span when its ship date is later than the same calendar day 3 months earlier;
      otherwise the strips counted for a day of use are left as they are.
    cgm_active: >-
      cgm_paused_pace_shift strips are added to the strips counted for every day of use when the customer's CGM
      program is on hold, because fingersticks then stand in for the sensor readings; cgm_wearing_pace_shift strips
      are taken off the strips counted for every day of use when the customer's CGM program is active and a sensor
      refill shipped to the customer on any of the customer's CGM programs within the last 3 calendar months, a
      sensor refill falling in that span when its ship date is later than the same calendar day 3 months earlier;
      otherwise the strips counted for a day of use are left as they are.
    recent_sensor_refills: >-
      cgm_paused_pace_shift strips are added to the strips counted for every day of use when the customer's CGM
      program is on hold, because fingersticks then stand in for the sensor readings; cgm_wearing_pace_shift strips
      are taken off the strips counted for every day of use when the customer's CGM program is active and a sensor
      refill shipped to the customer on any of the customer's CGM programs within the last 3 calendar months, a
      sensor refill falling in that span when its ship date is later than the same calendar day 3 months earlier;
      otherwise the strips counted for a day of use are left as they are.
    pace_shift: >-
      cgm_paused_pace_shift strips are added to the strips counted for every day of use when the customer's CGM
      program is on hold, because fingersticks then stand in for the sensor readings; cgm_wearing_pace_shift strips
      are taken off the strips counted for every day of use when the customer's CGM program is active and a sensor
      refill shipped to the customer on any of the customer's CGM programs within the last 3 calendar months, a
      sensor refill falling in that span when its ship date is later than the same calendar day 3 months earlier;
      otherwise the strips counted for a day of use are left as they are.
    strips_used: >-
      Each rule set out below changes the standard count only in the part it names, where the days of use start
      or end, which shipment's units are counted, or the strips counted for a day of use, and the count is then
      made as the standard method states, the strips counted for a day of use never falling below 0 and days of
      use that would end before they start counting as none.
    opened_units: >-
      Each rule set out below changes the standard count only in the part it names, where the days of use start
      or end, which shipment's units are counted, or the strips counted for a day of use, and the count is then
      made as the standard method states, the strips counted for a day of use never falling below 0 and days of
      use that would end before they start counting as none.
    already_authorized: >-
      The standard count of the units still sealed is this: start from the units of the program's latest strip refill,
      take away the units counted as opened and any units of that shipment already authorized for return, and never
      go below 0; the units counted as opened are the strips counted as used divided by strips_per_billing_unit
      and rounded up to a whole unit, because a box that has been started is opened; the strips counted as used
      are the days of use times the strips counted for a day of use; the days of use are the calendar days from
      the delivery date on that refill's proof of delivery to today; and the strips counted for a day of use are
      daily_pace_default strips.
    strips_superseded: >-
      When the program's latest strip refill shipped on or after the ship date of the newest meter on the program,
      its strips fit that meter and nothing is taken back.
    result: >-
      Each rule set out below changes the standard count only in the part it names, where the days of use start
      or end, which shipment's units are counted, or the strips counted for a day of use, and the count is then
      made as the standard method states, the strips counted for a day of use never falling below 0 and days of
      use that would end before they start counting as none.
  factors:
  - id: held_shipment_choice
    effect: method
    decides: held_units
    bindings:
    - not_received_repl_id
    - lost_repl_id
    - stand_in_count
    - stand_in_id
    - stand_in_units
    - stand_in_delivered_on
    - held_units
    - held_from
    - held_id
    ladder:
    - when: the latest strip refill was replaced as delivered but not received or as lost in transit
      method: >-
        count the latest not-received replacement's units when one is on file, otherwise the latest lost-in-transit
        replacement's, with the days of use starting on that replacement's delivery date, or today while it has
        no proof of delivery
    - when: the latest strip refill has no proof of delivery and no such replacement
      method: nothing is held, so no units are counted as sealed
    - when: otherwise
      method: count the latest strip refill's own units from its own delivery date
    baseline:
      held_units: strip_refill_units
      held_from: refill_delivered_on
      held_id: strip_refill_id
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: use_end_anchor
    effect: method
    decides: use_end_day
    bindings:
    - newest_meter_id
    - newest_meter_delivered_on
    - program_hold_start
    - use_end_day
    ladder:
    - when: >-
        the newest meter shipped on the program was delivered, by its proof of delivery, later than the latest strip
        refill was
      method: the days of use end on that meter's delivery date
    - when: >-
        no newer meter was delivered later than the latest strip refill, and the testing supplies program went on
        hold later than that refill was delivered
      method: the days of use end on the program's hold start date
    - when: otherwise
      method: the days of use end today
    baseline:
      use_end_day: NOW
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: testing_pace
    effect: parameter
    decides: daily_pace
    bindings:
    - insulin_class
    - open_cgm_regimen
    - daily_pace
    ladder:
    - when: the customer is insulin-treated and the open CGM program records the insulin regimen insulin_pump
      value: K('daily_pace_pump')
    - when: >-
        the customer is insulin-treated and the open CGM program records multiple_daily_injections, or the customer
        holds no open CGM program
      value: K('daily_pace_mdi')
    - when: otherwise
      value: K('daily_pace_default')
    baseline:
      daily_pace: K('daily_pace_default')
    evidence:
    - tier_param
    - cross_category
    cross_difficulty: cgm
  - id: sensor_status_shift
    effect: parameter
    decides: pace_shift
    bindings:
    - cgm_on_hold
    - cgm_active
    - recent_sensor_refills
    - pace_shift
    ladder:
    - when: the customer's CGM program is on hold
      value: K('cgm_paused_pace_shift')
    - when: >-
        the customer's CGM program is active and a sensor refill shipped to the customer on any of the customer's
        CGM programs within the last 3 calendar months
      value: 0 - K('cgm_wearing_pace_shift')
    - when: otherwise
      value: '0'
    baseline:
      pace_shift: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: cgm
  baseline:
    rule: >-
      The standard count of the units still sealed is this: start from the units of the program's latest strip refill,
      take away the units counted as opened and any units of that shipment already authorized for return, and never
      go below 0; the units counted as opened are the strips counted as used divided by strips_per_billing_unit
      and rounded up to a whole unit, because a box that has been started is opened; the strips counted as used
      are the days of use times the strips counted for a day of use; the days of use are the calendar days from
