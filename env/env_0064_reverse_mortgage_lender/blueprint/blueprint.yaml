name: env_0064_reverse_mortgage_lender
company: Cedarline Reverse Mortgage, LLC
background: |
  Cedarline Reverse Mortgage, LLC is a Charlotte-based reverse mortgage lender and servicer that originates FHA-insured Home Equity Conversion Mortgages and its own proprietary jumbo reverse mortgages and services about 41,000 loans for homeowners aged 60 and older in 38 states.
  Its borrower services desk speaks with seniors, their spouses, adult children, attorneys-in-fact, trustees and the heirs and executors who settle a loan after a borrower dies, and it keeps a patient, plain-spoken tone with callers who are often hard of hearing or grieving.
  Every HECM is held under one payout plan: the HECM Line of Credit, HECM Tenure Payment Plan, HECM Term Payment Plan, HECM Modified Tenure Plan, HECM Modified Term Plan or HECM Fixed-Rate Single Disbursement.
  A HECM is booked as a running ledger in which draws, scheduled monthly payments, interest, the annual FHA mortgage insurance premium, monthly servicing fees and advances raise the loan balance, while prepayments lower it and the unused line of credit grows each month.
  The proprietary Cedarline Summit line is held as the Summit Fixed Lump Sum, Summit Flex Fixed, Summit Select Line, Summit Condo Line, Summit Second Lien or Summit Estate Line, each with its own balance and draw ledger.
  Set-aside accounts reserve part of a loan's principal limit for a purpose and are drawn down over time: the Fully Funded LESA (Mandatory), Fully Funded LESA (Borrower-Elected), Partially Funded LESA, Repair Set-Aside, Servicing Fee Set-Aside and the Summit Tax and Insurance Reserve pay property taxes, insurance premiums, repair invoices or servicing fees as bills arrive.
  When Cedarline must pay a delinquent tax or insurance bill itself, the advance is tracked in a property charge repayment record held as a Lump-Sum Repayment, Repayment Plan - 12 Months, Repayment Plan - 24 Months, Repayment Plan - 36 Months, Repayment Plan - 60 Months or At-Risk Extension.
  Every funded loan is enrolled in annual occupancy certification under a Standard Annual Certification, Joint Borrower Certification, Non-Borrowing Spouse Household Certification, Deferral Period Certification, Living Trust Certification or Authorized Representative Certification profile, which logs notices, signed certifications, inspections and health-care absences.
  When a loan matures, a case is opened as Death of Last Surviving Borrower, Sale or Title Transfer, Extended Health-Care Absence, Principal Residence Change, Property Charge Default or Property Condition Default and carries the loan through HUD steps, notices, appraisal, extensions and resolution.
  Loans are paid off through payoff cases held as a Borrower Voluntary Payoff, HECM-to-HECM Refinance Payoff, Heir Retention Payoff, Estate Market Sale Payoff, Approved Short Sale Payoff or Deed in Lieu of Foreclosure, each recording statements, remittances and the final satisfaction.
  A typical borrower holds one reverse mortgage together with its occupancy profile and often a LESA or Servicing Fee Set-Aside, and some also carry a Repair Set-Aside from closing or a repayment record for an advanced tax bill.
  Callers arrive with years of history behind them: monthly accruals and fee postings, past draws and returned checks, earlier certifications and inspections, tax and insurance bills paid from a set-aside, and for heirs a maturity case already moving through its deadlines.
logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log
difficulties:
  - name: hecm_line_draws_and_plan_servicing
    claim:
      categories: [hecm]
      event_types: [hecm_loc_draw, hecm_advance_posting, hecm_prepayment, hecm_line_restore, hecm_disbursement_return, hecm_advance_reversal, hecm_servicing_fee, hecm_plan_change, hecm_plan_change_fee, hecm_line_commitment, hecm_line_release]
    summary: >
      HECM borrowers, co-borrowers and their authorized representatives call to draw on the line of credit, prepay part of the balance, ask about a returned or uncashed draw, dispute a servicing fee or change payout plan, and their settings vary by payout plan, rate type, servicing fee option, how long ago the loan closed, the request channel they used and whether a maturity case, set-aside or property charge advance already sits on the loan.
      The governing records are the loan with its available line, balance, initial disbursement limit and closing figures, the transaction ledger with its draws, accruals, fees, prepayment allocations and reversals, and the signed borrower requests; the rules gate draws on loan status, the plan's draw entitlement, the minimum draw and phone cap, the available line and the first-year disbursement limit (hecm_evt_loc_draw), allocate prepayments across MIP, fees, interest and principal and restore the line by plan (hecm_evt_prepayment), price fees by rate type and fee option (hecm_evt_servicing_fee), credit back returned or voided draws (hecm_evt_disbursement_return) and recompute payments with the actuarial formula on a plan change (hecm_payment_plan_change), while maturity cases suspend disbursements and set-asides never feed the line.
      The agent verifies identity, reads the loan, ledger, requests and any open maturity case, then books draws, postings, prepayment allocations, reversals, plan changes and their fees, and records request outcomes, whereas only the borrowers themselves can submit a draw request, sign a payout plan change or give a rescission notice, which the agent hands over as customer actions.
      Requests the HECM rules cannot decide, such as a refund of the upfront MIP, a waiver of accrued interest, switching the note between an adjustable and a fixed rate, or a dispute over how the expected rate was locked at closing, have no governing policy and go to a human representative as POLICY_NOT_COVERED.
  - name: setaside_property_charges_and_repairs
    claim:
      categories: [setaside]
      event_types: [setaside_tax_disbursement, setaside_insurance_disbursement, setaside_borrower_disbursement, setaside_repair_disbursement, setaside_fee_draw, setaside_growth_credit, setaside_refund_credit, setaside_release, setaside_charges_updated, setaside_depleted, setaside_cancelled, setaside_closed]
    summary: >
      Borrowers with a LESA, Repair Set-Aside, Servicing Fee Set-Aside or Summit reserve call about a tax bill or insurance premium that should have been paid, a semi-annual LESA installment, a contractor's repair draw, a refund from the county or an insurer, a low or exhausted set-aside, or cancelling a borrower-elected LESA, and their situations differ by set-aside plan, set-aside status, the loan's program and status, the bills and requests on file and the disbursement and growth history.
      The governing records are the set-aside with its balance and annual charges, its ledger of disbursements, growth credits, fee draws, refunds and releases, the bills and borrower requests received, and the linked loan and any property charge repayment record; the rules decide which charges each plan pays and how a shortfall is handled (setaside_evt_property_charges, setaside_agg_shortfall_funding), size and time partial-LESA installments (setaside_evt_partial_lesa), pay repair draws against inspections, holdbacks and the completion deadline (setaside_evt_repair), credit growth and refunds (setaside_evt_growth, setaside_evt_refund), and gate borrower cancellation on plan, waiting period and open repayment arrangements (setaside_borrower_cancellation).
      The agent verifies identity, reads the set-aside, its ledger and the bills and requests on file, then books disbursements, releases, refunds, charge updates and status changes, while only the borrowers can sign a cancellation of a borrower-elected set-aside or submit their own repair draw request.
      Situations no set-aside rule decides, such as moving money between two set-asides on the same loan, re-establishing a LESA that has run dry, contesting the amount a county assessed, or a repair request that arrives after the completion deadline and passes to the property preservation unit, call for a POLICY_NOT_COVERED handoff.
  - name: residency_occupancy_certification
    claim:
      categories: [residency]
      event_types: [residency_certification_recorded, residency_cycle_completed, residency_certified, residency_marked_overdue, residency_inspection_ordered, residency_inspection_result, residency_absence_started, residency_absence_checkin, residency_returned_home, residency_nonoccupancy_confirmed, residency_reoccupied, residency_reclassified, residency_closed]
    summary: >
      Borrowers, non-borrowing spouses, trustees, attorneys-in-fact and family members call to return an annual occupancy certification, ask why an inspection fee appeared, report a move to a nursing home or a return home, report a borrower's death or explain a returned certification letter, and their settings vary by certification plan, profile status, how many signatures the cycle has, the age of a health-care absence and the loan's program.
      The governing records are the residency profile with its due date, last certification and absence dates, its event log of notices, recorded signatures, inspection orders and results and check-ins, and the submissions received; the rules accept or reject certifications by signer, channel, supporting document and window and complete cycles on the plan's signature count (residency_evt_certification), make profiles overdue after the grace period and order inspections within the per-cycle limit (residency_overdue_inspection), monitor health-care absences up to the consecutive-month limit (residency_health_absence), confirm or reverse non-occupancy (residency_nonoccupancy) and reclassify or close profiles after a death (residency_household_change, residency_closure).
      The agent verifies identity, reads the profile, its event log and the submissions, then records signatures, cycle completions, inspection orders and results, absence monitoring, non-occupancy and reclassification, while only the signers themselves can submit and sign a certification or a notice about their own absence, move or a death they report.
      Requests outside these rules, such as waiving an inspection fee already charged, moving the certification due date to a different month, or reopening a profile that has already closed, have no governing policy and go to a human representative as POLICY_NOT_COVERED.
  - name: maturity_due_and_payable_cases
    claim:
      categories: [maturity]
      event_types: [maturity_case_opened, maturity_case_reclassified, maturity_hud_action, maturity_approval_requested, maturity_called_due, maturity_deferred, maturity_notice_sent, maturity_appraisal_recorded, maturity_intent_recorded, maturity_extension_granted, maturity_extension_started, maturity_deadline_extended, maturity_foreclosure_referred, maturity_cured]
    summary: >
      Heirs, executors, surviving non-borrowing spouses and living borrowers call after a death, a sale, a long nursing-home stay, a move, an unpaid tax advance or a failed condition inspection to learn what happens next, state their plans for the home, ask for more time or show that a default is cured, and their settings vary by maturity event type, case status, whether HUD approval or extensions are already on record, the age of the appraisal, the successor's confirmation status and the loan's program.
      The governing records are the maturity case with its event date, deadlines, appraisal and declared intent, its log of HUD steps, notices and extensions, the requests received, and the linked loan, residency profile, property charge record and customer profiles; the rules open cases only on documented evidence and resolve overlapping events by precedence (maturity_case_opening, maturity_agg_multi_holding), call loans due with or without HUD approval and set the response and resolution deadlines (maturity_call_due), record intents only from confirmed successors within the window (maturity_intent_appraisal), grant at most the plan's extensions on evidence and HUD approval before the deadline (maturity_extensions), and govern deferral, cure and foreclosure referral (maturity_deferral, maturity_cure, maturity_foreclosure_referral).
      The agent verifies identity, reads the case, its log, the requests and the linked records, then opens or reclassifies cases, records HUD steps, notices, appraisals, intents and extensions and moves the case through its statuses, while only the borrower or confirmed successor can declare an intent, request an extension or submit cure evidence, which the agent hands over as their own submission.
      Matters the case rules cannot decide, such as disputing the appraised value, competing heirs contesting who the rightful successor is, an heir asking to assume the loan in their own name, or asking Cedarline to stop a foreclosure sale counsel has already scheduled, go to a human representative as POLICY_NOT_COVERED.
  - name: payoff_heir_and_borrower_payoffs
    claim:
      categories: [payoff]
      event_types: [payoff_case_opened, payoff_terms_issued, payoff_terms_reissued, payoff_terms_accepted, payoff_funds_received, payoff_funds_returned, payoff_funds_applied, payoff_overage_refund, payoff_incentive_committed, payoff_incentive_paid, payoff_satisfied, payoff_lapsed, payoff_withdrawn]
    summary: >
      Borrowers refinancing or selling, heirs who want to keep the house, executors selling the estate's home, title companies and new lenders call for payoff figures, submit purchase contracts, send funds or offer a deed in lieu, and their settings vary by payoff plan, case status, the statement's good-through date, the appraisal on the maturity case, the contract's price and costs, the buyer's relationship and the remittances already received from several parties.
      The governing records are the payoff case with its statement figures, required amount and held funds, its ledger of receipts, returns, refunds, applications and relocation incentives, the requests and contracts received, and the linked loan, maturity case and customer profiles; the rules authorize requesters and compute the per diem, statement balance and the lesser-of-balance-or-appraisal retention amount (payoff_statement_terms), test sale contracts against price floors, closing-cost caps and arm's-length rules (payoff_sale_review), pool remittances and refund excess (payoff_agg_funds), time signatures, incentives, satisfaction and lapse (payoff_acceptance, payoff_relocation_incentive, payoff_satisfaction, payoff_lapse), and limit a loan to one open case (payoff_agg_multi_holding).
      The agent verifies identity, reads the case, ledger, requests and linked loan and maturity case, then opens cases, issues or reissues terms, records receipts, returns, refunds, incentives and satisfaction, while only the borrower or confirmed successor can request a payoff in their own name, sign a retention, sale or deed-in-lieu agreement or withdraw it.
      Requests no payoff rule decides, such as accepting a payoff below the computed amount for a hardship, paying the estate's other debts from sale proceeds, releasing the lien before funds arrive or releasing part of the property from the lien, go to a human representative as POLICY_NOT_COVERED.
