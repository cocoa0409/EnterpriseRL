category: hecm
display_name: Home Equity Conversion Mortgage (HECM)
binding:
  holding_table: hecm_loans
  event_tables:
  - hecm_transactions
  intake_tables:
  - hecm_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    principal_balance: loan_balance
    available_line: line_of_credit
lifecycle:
  states:
  - rescission_period
  - active
  - rescinded
  - due_and_payable
  - deferral_period
  - paid_in_full
  - claim_terminated
  transitions:
  - from: rescission_period
    to: active
    by: system
    means: The right-of-rescission period ended without a rescission notice and the loan funded on the first disbursement
      business day.
  - from: rescission_period
    to: rescinded
    by: user
    means: The borrower exercised the right of rescission before the rescission period ended, cancelling the loan.
  - from: active
    to: due_and_payable
    by: agent
    means: A maturity event was confirmed and the loan entered due-and-payable status; draws and scheduled payments
      stop.
  - from: active
    to: deferral_period
    by: agent
    means: The last surviving borrower died and an eligible non-borrowing spouse qualified for the deferral period.
  - from: deferral_period
    to: due_and_payable
    by: agent
    means: The deferral period ended because the eligible non-borrowing spouse died, moved out or stopped meeting
      the deferral conditions.
  - from: due_and_payable
    to: active
    by: agent
    means: The maturity case was cured before resolution and the loan was reinstated to active status.
  - from: active
    to: paid_in_full
    by: agent
    means: A voluntary full payoff was received and the lien was released.
  - from: due_and_payable
    to: paid_in_full
    by: agent
    means: The required payoff amount on a due-and-payable loan was received and the lien was released.
  - from: deferral_period
    to: paid_in_full
    by: agent
    means: The loan was paid in full during the deferral period.
  - from: due_and_payable
    to: claim_terminated
    by: agent
    means: The loan ended through an approved short sale, a deed in lieu of foreclosure or foreclosure, and the
      FHA insurance claim stage began.
accounts:
- key: loan_balance
  unit: USD
  meaning: 'Outstanding HECM balance owed: principal advanced plus accrued interest, mortgage insurance premium
    and servicing fees, less amounts repaid; held on the loan record as principal_balance.'
- key: line_of_credit
  unit: USD
  meaning: Net principal limit currently available for line-of-credit draws, after set-asides and amounts committed
    to scheduled payments; held on the loan record as available_line.
parameter_schema:
  min_youngest_borrower_age: Minimum age in whole years of the youngest borrower at closing (integer years)
  max_claim_limit: FHA national HECM maximum claim amount limit for case numbers assigned in calendar 2026 (USD)
  rate_types_permitted: Rate types the payout plan may carry (list of hecm_loans.rate_type values)
  monthly_adjustable_index: Index the monthly adjustable rate follows (index name; 'none' where the plan cannot
    carry that rate type)
  annual_adjustable_index: Index the annual adjustable rate follows (index name; 'none' where not applicable)
  monthly_adjustable_lifetime_cap_pct: Lifetime rate increase cap over the initial note rate for a monthly adjustable
    loan (percentage points; 0.00 where not applicable)
  annual_adjustable_periodic_cap_pct: Maximum change in the note rate at one annual adjustment (percentage points;
    0.00 where not applicable)
  annual_adjustable_lifetime_cap_pct: Lifetime rate increase cap over the initial note rate for an annual adjustable
    loan (percentage points; 0.00 where not applicable)
  initial_mip_rate_pct: Upfront FHA mortgage insurance premium charged at closing, percent of the maximum claim
    amount
  annual_mip_rate_pct: Annual FHA mortgage insurance premium rate charged on the outstanding balance (percent per
    year, accrued monthly at one twelfth)
  origination_fee_pct_first_200k: Origination fee rate on the first 200,000.00 of the maximum claim amount (percent)
  origination_fee_pct_above_200k: Origination fee rate on the portion of the maximum claim amount above 200,000.00
    (percent)
  origination_fee_floor: Minimum origination fee the lender may charge (USD)
  origination_fee_cap: Maximum origination fee regardless of the maximum claim amount (USD)
  rescission_period_business_days: Length of the right-of-rescission period after the loan closing, in rescission
    business days (every calendar day except Sundays and federal legal public holidays)
  rescission_refund_calendar_days: Calendar days after a timely rescission notice within which every fee and charge
    paid by the borrower is refunded
  first_disbursement_business_day: Rescission business day after the closing on which the loan funds when no rescission
    notice was received (ordinal day)
  first_year_period_months: Length of the first-year disbursement period counted from the closing date (calendar
    months)
  first_year_disbursement_limit_pct: Initial disbursement limit as a percent of the initial principal limit, used
    when it exceeds the mandatory-obligations alternative
  mandatory_obligation_cushion_pct: Additional percent of the initial principal limit allowed above mandatory obligations
    when mandatory obligations exceed the percentage limit
  loc_draws_permitted: Whether the payout plan carries a line of credit the borrower may draw on after closing (boolean)
  min_draw_amount: Smallest line-of-credit draw the servicer will disburse (USD; 0.00 where the plan has no draws)
  draw_processing_business_days: Business days (Monday-Friday excluding federal holidays) within which a complete
    draw request is disbursed
  phone_draw_max_amount: Largest single draw accepted through a verified phone request; larger draws need a servicing-portal
    or signed written request (USD; 0.00 where the plan has no draws)
  wire_min_amount: Smallest draw that may be disbursed by wire transfer; smaller draws go by ACH or check (USD)
  draw_disbursement_methods: Disbursement methods a line-of-credit draw may use (list of disbursement_method values;
    empty list where the plan has no draws)
  uncashed_check_void_days: Calendar days after issue after which an uncashed draw or scheduled-payment check is
    voided and its amount credited back
  scheduled_payments_permitted: Whether the payout plan pays fixed monthly scheduled payments (boolean)
  scheduled_payment_day: Calendar day of the month on which scheduled payments are disbursed (0 where the plan has
    no scheduled payments)
  term_min_months: Shortest term a term-based plan may be set to (months; 0 where the plan is not term-based)
  term_max_months: Longest term a term-based plan may be set to (months; 0 where the plan is not term-based)
  tenure_age_horizon_years: Age of the youngest borrower to which tenure payments are actuarially computed (years;
    0 where the plan is not tenure-based)
  line_growth_applies: Whether the unused available line grows monthly (boolean)
  line_growth_spread_pct: Percentage points added to the current note rate to give the annual line growth rate (0.00
    where growth does not apply)
  interest_accrual_method: How monthly interest is computed (method code)
  accrual_rounding: Rounding rule for every monthly accrual and fee amount (rule code)
  servicing_fee_monthly_adjustable: Monthly servicing fee on a monthly adjustable loan whose servicing fee option
    is a monthly fee (USD; 0.00 where the plan cannot carry that rate type)
  servicing_fee_annual_or_fixed: Monthly servicing fee on an annual adjustable or fixed-rate loan whose servicing
    fee option is a monthly fee (USD)
  servicing_fee_assessment_day: Calendar day of the month on which the monthly servicing fee, interest and MIP for
    the prior month are posted
  prepayment_penalty_pct: Penalty on a voluntary partial or full prepayment (percent of the amount prepaid)
  prepayment_allocation_order: Order in which a partial prepayment is applied to the balance components (ordered
    list of allocation_bucket values)
  prepayment_restores_line: Whether amounts prepaid are credited back to the available line for future draws (boolean)
  payment_plan_change_permitted: Whether the borrower may change to another payout plan after closing (boolean)
  payment_plan_change_fee: Fee charged to the loan balance for processing one payout plan change (USD; 0.00 where
    changes are not permitted)
  plan_change_effective_rule: When a processed payout plan change takes effect (rule code)
  plan_change_signed_request_required: Whether a payout plan change needs a request signed by every borrower (boolean)
  returned_disbursement_line_credit: Whether a draw returned undeliverable or voided is credited back to the available
    line and reversed from the balance (boolean)
  nbs_deferral_available: Whether an eligible non-borrowing spouse may enter the deferral period after the last
    borrower's death (boolean)
  deferral_legal_right_days: Calendar days after the last borrower's death within which an eligible non-borrowing
    spouse must establish a legal right to remain in the property
  draws_stop_at_due_and_payable: Whether draws and scheduled payments stop once the loan is due and payable (boolean)
  single_full_draw_at_closing: Whether the entire available principal is disbursed at closing with no later disbursements
    (boolean)
  servicing_fee_options_offered: Servicing fee options the plan may be closed with (list of servicing_fee_option
    values)
