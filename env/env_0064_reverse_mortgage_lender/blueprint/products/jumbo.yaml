events:
- type: jumbo_loan_boarded
  target: jumbo_loans
  mutation: create
  meaning: A closed Summit loan is boarded to servicing in its rescission period.
  grain: One row per loan.
  fields:
    jumbo_loan_id: Loan id.
    customer_id: Primary borrower.
    co_borrower_customer_id: Second borrower, if any.
    variant_name: Summit plan.
    status: Always rescission_period.
    loan_number: Loan number.
    closing_date: Closing date.
    note_rate_pct: Initial note rate.
    initial_note_rate_pct: Note rate at closing.
    margin_pct: Margin, or 0.000.
    rate_change_date: Closing date.
    initial_principal_limit: Principal limit.
    appraised_value_at_closing: Appraised value.
    principal_balance: Opening balance.
    available_line: Opening line.
    draw_period_end_date: End of draw period, if any.
    property_state: Property state.
  triggers: []
- type: jumbo_rate_adjusted
  target: jumbo_loans
  mutation: update
  meaning: The note rate of an adjustable Summit plan resets on its adjustment date.
  grain: One row per rate adjustment.
  fields:
    note_rate_pct: New note rate.
    rate_change_date: Date the new rate took effect.
  triggers: []
- type: jumbo_funded
  target: jumbo_loans
  mutation:
    transition:
      from: rescission_period
      to: active
  meaning: The rescission period ends and the loan funds.
  grain: One row per transition.
  fields:
    status: Set to active.
    funding_date: Funding date.
  triggers: []
- type: jumbo_rescinded
  target: jumbo_loans
  mutation:
    transition:
      from: rescission_period
      to: rescinded
  meaning: The borrower's timely rescission cancels the loan.
  grain: One row per transition.
  fields:
    status: Set to rescinded.
    terminated_date: Rescission date.
  triggers: []
- type: jumbo_line_draw
  target: jumbo_transactions
  meaning: A draw on the Summit line is disbursed.
  grain: One row per draw request.
  distinguish_by:
  - draw_reference
  fields:
    amount: Amount drawn.
    effective_date: Disbursement date.
    draw_reference: Draw request confirmation number.
    disbursement_method: ach, wire or check.
  account: summit_line
  direction: out
  triggers:
  - event: jumbo:jumbo_advance_posting
    map:
      amount: amount
      effective_date: effective_date
      advance_type: line_draw
      source_txn_ref: jumbo_txn_id
- type: jumbo_advance_posting
  target: jumbo_transactions
  meaning: An amount paid to or for the borrower is added to the Summit balance.
  grain: One row per originating disbursement.
  distinguish_by:
  - advance_type
  - source_txn_ref
  fields:
    amount: Amount added.
    effective_date: Posting date.
    advance_type: What was paid.
    source_txn_ref: Originating record.
  account: summit_balance
  direction: in
  triggers: []
- type: jumbo_interest_accrual
  target: jumbo_transactions
  meaning: Monthly interest is accrued to the Summit balance.
  grain: One row per loan per month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Interest accrued.
    effective_date: Posting date.
    accrual_period: Month accrued.
  account: summit_balance
  direction: in
  triggers: []
- type: jumbo_line_growth
  target: jumbo_transactions
  meaning: The undrawn line grows at the plan's fixed growth rate.
  grain: One row per loan per month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Growth credited.
    effective_date: Posting date.
    accrual_period: Month credited.
  account: summit_line
  direction: in
  triggers: []
- type: jumbo_prepayment
  target: jumbo_transactions
  meaning: A partial prepayment, a reserve release or a repayment of advances is applied to the Summit balance.
  grain: One row per remittance per allocation bucket.
  distinguish_by:
  - effective_date
  - allocation_bucket
  - source_txn_ref
  fields:
    amount: Portion applied.
    effective_date: Date received.
    allocation_bucket: interest or principal.
    restores_line: Whether credited back to the line.
    source_txn_ref: Originating reserve release or plan installment, if any.
  account: summit_balance
  direction: out
  triggers:
  - event: jumbo:jumbo_line_restore
    when:
      restores_line: true
    map:
      amount: amount
      effective_date: effective_date
      source_txn_ref: jumbo_txn_id
- type: jumbo_line_restore
  target: jumbo_transactions
  meaning: A prepaid portion is credited back to the line during the draw period.
  grain: One row per prepayment portion restored.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount restored.
    effective_date: Credit date.
    source_txn_ref: The prepayment portion.
  account: summit_line
  direction: in
  triggers: []
- type: jumbo_draw_period_ended
  target: jumbo_loans
  mutation:
    transition:
      from: active
      to: draw_period_expired
  meaning: The draw period ends and the undrawn line is cancelled.
  grain: One row per transition.
  fields:
    status: Set to draw_period_expired.
  triggers:
  - event: jumbo:jumbo_line_cancellation
    map: {}
- type: jumbo_line_cancellation
  target: jumbo_transactions
  meaning: The undrawn line is cancelled when the draw period ends.
  grain: One row per loan.
  distinguish_by:
  - effective_date
  fields:
    amount: Undrawn line cancelled.
    effective_date: Draw period end date.
  account: summit_line
  direction: out
  triggers: []
- type: jumbo_due_and_payable
  target: jumbo_loans
  mutation:
    transition:
    - from: active
      to: due_and_payable
    - from: draw_period_expired
      to: due_and_payable
  meaning: A maturity event makes the Summit loan due and payable.
  grain: One row per transition.
  fields:
    status: Set to due_and_payable.
    due_and_payable_date: Due date.
  triggers: []
- type: jumbo_paid_in_full
  target: jumbo_loans
  mutation:
    transition:
    - from: active
      to: paid_in_full
    - from: draw_period_expired
      to: paid_in_full
    - from: due_and_payable
      to: paid_in_full
  meaning: A payoff satisfies the Summit loan.
  grain: One row per transition.
  fields:
    status: Set to paid_in_full.
    terminated_date: Satisfaction date.
  triggers: []
- type: jumbo_liquidated
  target: jumbo_loans
  mutation:
    transition:
      from: due_and_payable
      to: liquidated
  meaning: The Summit loan ends through short sale, deed in lieu or foreclosure.
  grain: One row per transition.
  fields:
    status: Set to liquidated.
    terminated_date: Liquidation date.
  triggers: []
measures: []
policies:
- id: jumbo_agg_multi_holding
  subject:
  - jumbo_loan_boarded
  rule: 'A borrower may hold only max_one_per_borrower open Summit loan, because each Summit loan is secured by
    the borrower''s principal residence. A Summit loan is boarded only when the borrower holds no other Summit loan
    whose status is rescission_period, active, draw_period_expired or due_and_payable. A Summit loan and a HECM
    are mutually exclusive on the same borrower, per hecm_coexistence_allowed: a first-lien Summit plan replaces
    any HECM at closing, and a Summit Second Lien sits only behind a forward first mortgage, never behind a HECM.'
  eligibility:
  - id: one_open_summit
    applies_to:
    - jumbo_loan_boarded
    kind: dedup
    condition: A Summit loan is boarded only when the borrower holds no other Summit loan whose status is rescission_period,
      active, draw_period_expired or due_and_payable.
    evidence_fields:
    - jumbo_loans.customer_id
    - jumbo_loans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.customer_id
      action_bindings:
        jumbo_loans.customer_id: customer_id
    dedup_contract:
      table: jumbo_loans
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - rescission_period
        - active
        - draw_period_expired
        - due_and_payable
      distinct_fields: []
  params:
    max_per_customer: 1
- id: jumbo_rescission
  subject:
  - jumbo_funded
  - jumbo_rescinded
  rule: A Summit loan carries the federal right of rescission. Rescission business days count every calendar day
    except Sundays and federal legal public holidays, starting the day after the closing date. A Summit rescission
    is honored only when the borrower's notice is given no later than the last rescission business day of the period
    that starts at the loan closing and lasts rescission_period_business_days. Without a timely notice the loan
    funds on the next rescission business day after the period and becomes active.
  eligibility:
  - id: summit_rescission_window
    applies_to:
    - jumbo_rescinded
    kind: time
    condition: A Summit rescission is honored only when the borrower's notice is given no later than the last rescission
      business day of the period that starts at the loan closing and lasts rescission_period_business_days.
    evidence_fields:
    - jumbo_loans.closing_date
    - jumbo_loans.jumbo_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.jumbo_loan_id
      action_bindings:
        jumbo_loans.jumbo_loan_id: jumbo_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the loan closing
      anchor_source: jumbo_loans.closing_date
      relation: not_after
      duration_source: variants.rescission_period_business_days
      unit: business_days
      counting_rule: Rescission business days count every calendar day except Sundays and federal legal public holidays,
        starting the day after the closing date.
      boundary: inclusive
- id: jumbo_evt_line_draw
  subject:
  - jumbo_line_draw
  - jumbo_advance_posting
  rule: Only plans whose line_available is true can be drawn; a Summit Fixed Lump Sum or Summit Second Lien has
    no line. A Summit draw is booked only while the loan status is active. Draws stop for good once a maturity case
    is opened on the loan, per draws_stop_on_maturity_case. A draw must be at least min_draw_amount and no more
    than the available_line; a phone request may not exceed phone_draw_max_amount; the method must be one of draw_methods
    and a wire is used only for a draw of at least wire_min_amount, a smaller wire request going by ach; each draw
    request, identified by its draw_reference, is disbursed once, within draw_processing_business_days business
    days, and books one jumbo_line_draw and one jumbo_advance_posting with advance_type line_draw for the same amount
    and date. Advance postings of other types follow only from a reserve disbursement, a property charge advance
    or an occupancy inspection, for the same amount and date.
  eligibility:
  - id: summit_draw_active
    applies_to:
    - jumbo_line_draw
    kind: state
    condition: A Summit draw is booked only while the loan status is active.
    evidence_fields:
    - jumbo_loans.status
    - jumbo_loans.jumbo_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.jumbo_loan_id
      action_bindings:
        jumbo_loans.jumbo_loan_id: jumbo_loan_id
    state_contract:
      field: jumbo_loans.status
      allowed:
      - active
  params:
    per_tier:
      Summit Fixed Lump Sum:
        line_available: =line_available
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      Summit Flex Fixed:
        line_available: =line_available
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      Summit Select Line:
        line_available: =line_available
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      Summit Condo Line:
        line_available: =line_available
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      Summit Second Lien:
        line_available: =line_available
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      Summit Estate Line:
        line_available: =line_available
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
- id: jumbo_evt_interest
  subject:
  - jumbo_interest_accrual
  rule: Interest accrues monthly at one twelfth of the note_rate_pct on the balance at the end of the month and
    is posted on interest_posting_day of the following month, rounded half up to the cent; no mortgage insurance
    and no servicing fee is charged on a Summit loan, per mortgage_insurance and monthly_servicing_fee. Summit interest
    accrues only while the loan status is active, draw_period_expired or due_and_payable.
  eligibility:
  - id: summit_accrual_states
    applies_to:
    - jumbo_interest_accrual
    kind: state
    condition: Summit interest accrues only while the loan status is active, draw_period_expired or due_and_payable.
    evidence_fields:
    - jumbo_loans.status
    - jumbo_loans.jumbo_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.jumbo_loan_id
      action_bindings:
        jumbo_loans.jumbo_loan_id: jumbo_loan_id
    state_contract:
      field: jumbo_loans.status
      allowed:
      - active
      - draw_period_expired
      - due_and_payable
  formula:
    interest_amount: round(principal_balance * note_rate_pct / 1200, 2)
- id: jumbo_evt_line_growth
  subject:
  - jumbo_line_growth
  rule: The undrawn line grows monthly at one twelfth of the plan's fixed line_growth_rate_pct, independent of the
    note rate, on the line at the end of the month, posted on interest_posting_day of the following month and rounded
    half up to the cent. Summit line growth is credited only while the loan status is active. A plan whose growth
    rate is 0.00 never earns growth.
  eligibility:
  - id: summit_growth_active
    applies_to:
    - jumbo_line_growth
    kind: state
    condition: Summit line growth is credited only while the loan status is active.
    evidence_fields:
    - jumbo_loans.status
    - jumbo_loans.jumbo_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.jumbo_loan_id
      action_bindings:
        jumbo_loans.jumbo_loan_id: jumbo_loan_id
    state_contract:
      field: jumbo_loans.status
      allowed:
      - active
  params:
    per_tier:
      Summit Fixed Lump Sum:
        line_growth_rate_pct: =line_growth_rate_pct
      Summit Flex Fixed:
        line_growth_rate_pct: =line_growth_rate_pct
      Summit Select Line:
        line_growth_rate_pct: =line_growth_rate_pct
      Summit Condo Line:
        line_growth_rate_pct: =line_growth_rate_pct
      Summit Second Lien:
        line_growth_rate_pct: =line_growth_rate_pct
      Summit Estate Line:
        line_growth_rate_pct: =line_growth_rate_pct
  formula:
    growth_amount: round(available_line * line_growth_rate_pct / 1200, 2)
- id: jumbo_evt_prepayment
  subject:
  - jumbo_prepayment
  - jumbo_line_restore
  rule: A Summit borrower may prepay at any time without penalty, per prepayment_penalty_pct; a partial prepayment
    is applied first to accrued unpaid interest and then to principal, per prepayment_allocation_order. A Summit
    prepayment is applied only while the loan status is active, draw_period_expired or due_and_payable. On plans
    whose prepayment_restores_line is true, a portion prepaid while the loan is active is credited back to the line
    on the same day; after the draw period, on a due-and-payable loan and on plans without a line nothing is restored.
    Releases of a cancelled Summit Tax and Insurance Reserve and installments under a property charge repayment
    plan are applied the same way, referencing their originating record.
  eligibility:
  - id: summit_prepay_states
    applies_to:
    - jumbo_prepayment
    kind: state
    condition: A Summit prepayment is applied only while the loan status is active, draw_period_expired or due_and_payable.
    evidence_fields:
    - jumbo_loans.status
    - jumbo_loans.jumbo_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.jumbo_loan_id
      action_bindings:
        jumbo_loans.jumbo_loan_id: jumbo_loan_id
    state_contract:
      field: jumbo_loans.status
      allowed:
      - active
      - draw_period_expired
      - due_and_payable
- id: jumbo_draw_period_end
  subject:
  - jumbo_draw_period_ended
  - jumbo_line_cancellation
  rule: The draw period of a line plan lasts draw_period_months calendar months from the closing date; the borrower
    is reminded draw_period_end_notice_days calendar days before it ends. The draw period ends only on or after
    the date draw_period_months calendar months after the loan closing. That date is the same day number in the
    month draw_period_months calendar months after the closing date, falling back to the last day of that month
    when that day does not exist, and the period ends on that date itself. When it ends, the whole undrawn line
    is cancelled on that date, per unused_line_at_draw_period_end, and the loan continues to accrue interest until
    it is repaid.
  eligibility:
  - id: draw_period_elapsed
    applies_to:
    - jumbo_draw_period_ended
    kind: time
    condition: The draw period ends only on or after the date draw_period_months calendar months after the loan
      closing.
    evidence_fields:
    - jumbo_loans.closing_date
    - jumbo_loans.jumbo_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.jumbo_loan_id
      action_bindings:
        jumbo_loans.jumbo_loan_id: jumbo_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the loan closing
      anchor_source: jumbo_loans.closing_date
      relation: not_before
      duration_source: variants.draw_period_months
      unit: calendar_months
      counting_rule: That date is the same day number in the month draw_period_months calendar months after the
        closing date, falling back to the last day of that month when that day does not exist, and the period ends
        on that date itself.
      boundary: inclusive
- id: jumbo_status
  subject:
  - jumbo_due_and_payable
  - jumbo_paid_in_full
  - jumbo_liquidated
  rule: A Summit loan becomes due and payable only when a maturity case on the loan has reached due_and_payable
    status; no HUD step applies to a Summit loan. It is marked paid_in_full when a payoff case on it is satisfied
    under Borrower Voluntary Payoff, Heir Retention Payoff or Estate Market Sale Payoff, and liquidated when one
    is satisfied under Approved Short Sale Payoff or Deed in Lieu of Foreclosure; because the loan is non-recourse,
    per non_recourse, no balance above the satisfied amount is ever collected from the borrower or the estate.
  eligibility:
  - id: summit_case_due
    applies_to:
    - jumbo_due_and_payable
    kind: state
    condition: A Summit loan becomes due and payable only when a maturity case on the loan has reached due_and_payable
      status; no HUD step applies to a Summit loan.
    evidence_fields:
    - maturity_cases.status
    - maturity_cases.maturity_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    state_contract:
      field: maturity_cases.status
      allowed:
      - due_and_payable
- id: jumbo_terms_and_rate
  subject:
  - jumbo_loan_boarded
  - jumbo_rate_adjusted
  rule: 'A Summit loan is boarded with the terms fixed at closing: the youngest borrower was at least min_youngest_borrower_age,
    or the lower age state_min_age_override gives for the property_state; the home was appraised at least min_home_value
    using appraisal_count_at_closing appraisals; the initial principal limit is at most max_ltv_pct percent of the
    appraised value and at most max_loan_amount; at least initial_draw_min_pct percent of it was drawn at closing;
    and the origination fee was origination_fee_pct percent of the principal limit capped at origination_fee_cap,
    financed from proceeds where closing_cost_financed is true. The loan holds the lien_position of its plan; only
    the Summit Second Lien may sit behind an existing forward first mortgage, per first_mortgage_allowed_behind;
    a condominium without FHA approval is eligible only under non_fha_condo_eligible; title may be held in a revocable
    living trust, per title_in_trust_allowed. Every Summit loan is enrolled in annual occupancy certification, per
    occupancy_certification_required; a Summit Tax and Insurance Reserve may be set up at closing where property_charge_reserve_option
    is true; Cedarline may advance unpaid property charges, per corporate_advance_allowed; a surviving non-borrowing
    spouse may remain where nbs_protection is true; and payoffs are available under the plans in payoff_statement_program,
    a retaining heir paying per heir_payoff_basis. Interest follows interest_accrual_method and accrual_rounding;
    a draw returned by the receiving bank is handled per returned_draw_handling, with no ledger entry until it is
    reissued. An adjustable plan''s rate (rate_type adjustable) resets every rate_adjustment_months months to rate_index
    plus margin_pct, never more than lifetime_rate_cap_pct above initial_note_rate_pct and never below the margin;
    a fixed plan''s rate never changes. A Summit rate adjustment is recorded only while the loan status is active,
    draw_period_expired or due_and_payable.'
  eligibility:
  - id: summit_adjust_open
    applies_to:
    - jumbo_rate_adjusted
    kind: state
    condition: A Summit rate adjustment is recorded only while the loan status is active, draw_period_expired or
      due_and_payable.
    evidence_fields:
    - jumbo_loans.status
    - jumbo_loans.jumbo_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - jumbo_loans.jumbo_loan_id
      action_bindings:
        jumbo_loans.jumbo_loan_id: jumbo_loan_id
    state_contract:
      field: jumbo_loans.status
      allowed:
      - active
      - draw_period_expired
      - due_and_payable
  params:
    per_tier:
      Summit Fixed Lump Sum:
        rate_type: =rate_type
        rate_adjustment_months: =rate_adjustment_months
        lifetime_rate_cap_pct: =lifetime_rate_cap_pct
      Summit Flex Fixed:
        rate_type: =rate_type
        rate_adjustment_months: =rate_adjustment_months
        lifetime_rate_cap_pct: =lifetime_rate_cap_pct
      Summit Select Line:
        rate_type: =rate_type
        rate_adjustment_months: =rate_adjustment_months
        lifetime_rate_cap_pct: =lifetime_rate_cap_pct
      Summit Condo Line:
        rate_type: =rate_type
        rate_adjustment_months: =rate_adjustment_months
        lifetime_rate_cap_pct: =lifetime_rate_cap_pct
      Summit Second Lien:
        rate_type: =rate_type
        rate_adjustment_months: =rate_adjustment_months
        lifetime_rate_cap_pct: =lifetime_rate_cap_pct
      Summit Estate Line:
        rate_type: =rate_type
        rate_adjustment_months: =rate_adjustment_months
        lifetime_rate_cap_pct: =lifetime_rate_cap_pct
