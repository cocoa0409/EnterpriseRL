category: jumbo
display_name: Cedarline Summit Proprietary Reverse Mortgage
binding:
  holding_table: jumbo_loans
  event_tables:
  - jumbo_transactions
  status_field: status
  variant_field: variant_name
  quantity_fields:
    principal_balance: summit_balance
    available_line: summit_line
lifecycle:
  states:
  - rescission_period
  - active
  - rescinded
  - draw_period_expired
  - due_and_payable
  - paid_in_full
  - liquidated
  transitions:
  - from: rescission_period
    to: active
    by: system
    means: The rescission period ended without a notice and the loan funded.
  - from: rescission_period
    to: rescinded
    by: user
    means: The borrower exercised the right of rescission.
  - from: active
    to: draw_period_expired
    by: system
    means: The line's draw period ended; the loan continues without further draws.
  - from: active
    to: due_and_payable
    by: agent
    means: A maturity event made the loan due and payable.
  - from: draw_period_expired
    to: due_and_payable
    by: agent
    means: A maturity event made the loan due and payable after the draw period.
  - from: active
    to: paid_in_full
    by: agent
    means: A voluntary payoff satisfied the loan.
  - from: draw_period_expired
    to: paid_in_full
    by: agent
    means: A voluntary payoff satisfied the loan.
  - from: due_and_payable
    to: paid_in_full
    by: agent
    means: The required payoff satisfied the due-and-payable loan.
  - from: due_and_payable
    to: liquidated
    by: agent
    means: The loan ended through short sale, deed in lieu or foreclosure.
accounts:
- key: summit_balance
  unit: USD
  meaning: 'Outstanding Summit loan balance: amounts advanced plus accrued interest, less repayments; held on the
    loan record as principal_balance.'
- key: summit_line
  unit: USD
  meaning: Undrawn Summit line available for draws; held on the loan record as available_line.
parameter_schema:
  min_youngest_borrower_age: Minimum age in whole years of the youngest borrower at closing
  min_home_value: Minimum appraised value of the home at closing (USD)
  max_loan_amount: Largest initial principal limit Cedarline lends (USD)
  rate_type: Interest rate type of the note (code)
  rate_index: Index an adjustable rate follows ('none' for fixed)
  rate_adjustment_months: Months between rate adjustments (0 for fixed)
  lifetime_rate_cap_pct: Lifetime increase cap over the initial note rate in percentage points (0.00 for fixed)
  line_available: Whether the plan carries a line the borrower may draw after closing (boolean)
  initial_draw_min_pct: Smallest share of the principal limit that must be drawn at closing (percent)
  draw_period_months: Months after closing during which the line may be drawn (0 where no line)
  line_growth_rate_pct: Fixed annual growth rate credited monthly on the undrawn line (percent; 0.00 where no growth)
  min_draw_amount: Smallest line draw disbursed (USD; 0.00 where no line)
  phone_draw_max_amount: Largest draw accepted through a verified phone request (USD; 0.00 where no line)
  draw_processing_business_days: Business days within which a complete draw request is disbursed
  draw_methods: Disbursement methods for a line draw (list; empty where no line)
  wire_min_amount: Smallest draw that may be sent by wire (USD)
  origination_fee_pct: Origination fee as a percent of the initial principal limit
  origination_fee_cap: Largest origination fee (USD)
  mortgage_insurance: Whether mortgage insurance is charged (boolean)
  monthly_servicing_fee: Monthly servicing fee (USD)
  interest_accrual_method: How monthly interest is computed (method code)
  accrual_rounding: Rounding rule for accruals (rule code)
  interest_posting_day: Calendar day of the month on which the prior month's interest and line growth are posted
  prepayment_penalty_pct: Penalty on a voluntary prepayment (percent of the amount prepaid)
  prepayment_restores_line: Whether prepaid amounts are credited back to the line during the draw period (boolean)
  prepayment_allocation_order: Order in which a partial prepayment is applied (ordered list)
  rescission_period_business_days: Length of the right-of-rescission period in rescission business days (every calendar
    day except Sundays and federal legal public holidays)
  lien_position: Lien position of the loan (code)
  first_mortgage_allowed_behind: Whether an existing forward first mortgage may stay ahead of this loan (boolean)
  non_fha_condo_eligible: Whether a condominium without FHA approval is eligible (boolean)
  non_recourse: Whether repayment is limited to the home's value (boolean)
  heir_payoff_basis: What a retaining heir pays (code)
  nbs_protection: Whether a non-borrowing spouse may remain after the borrower's death under the company's spouse
    protection rider (boolean)
  occupancy_certification_required: Whether annual occupancy certification applies (boolean)
  property_charge_reserve_option: Whether a Summit Tax and Insurance Reserve may be set up at closing (boolean)
  corporate_advance_allowed: Whether Cedarline may advance unpaid property charges and add them to the balance (boolean)
  draws_stop_on_maturity_case: Whether draws stop once a maturity case is opened on the loan (boolean)
  draw_period_end_notice_days: Calendar days before the draw period ends on which the borrower is notified (0 where
    no line)
  unused_line_at_draw_period_end: What happens to the undrawn line when the draw period ends (code)
  returned_draw_handling: How a draw returned by the receiving bank is handled (code; not_applicable where no line)
  max_ltv_pct: Largest initial principal limit as a percent of the appraised value
  state_min_age_override: States where the minimum age is lower, with that age (mapping state -> age)
  payoff_statement_program: Payoff plans available on the loan (list)
  hecm_coexistence_allowed: Whether the borrower may also hold a HECM (boolean)
  closing_cost_financed: Whether closing costs may be paid from loan proceeds (boolean)
  appraisal_count_at_closing: Number of appraisals required at closing
  title_in_trust_allowed: Whether title may be held in a revocable living trust (boolean)
  max_one_per_borrower: Largest number of open Summit loans one borrower may hold (integer)
