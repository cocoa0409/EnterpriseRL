category: maturity
display_name: Maturity and Due-and-Payable Cases
binding:
  holding_table: maturity_cases
  event_tables:
  - maturity_case_events
  intake_tables:
  - maturity_requests
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - opened
  - awaiting_hud_approval
  - deferred
  - due_and_payable
  - extension_period
  - foreclosure_referred
  - cured
  - resolved
  transitions:
  - from: opened
    to: awaiting_hud_approval
    by: agent
    means: HUD approval to call the loan due was requested for a maturity event that needs it.
  - from: opened
    to: due_and_payable
    by: agent
    means: A death or sale case was called due after HUD was notified.
  - from: awaiting_hud_approval
    to: due_and_payable
    by: agent
    means: HUD approval was recorded and the loan was called due.
  - from: opened
    to: deferred
    by: agent
    means: The last borrower died and an eligible non-borrowing spouse's deferral period began instead of a call
      due.
  - from: deferred
    to: due_and_payable
    by: agent
    means: The deferral period ended and the loan was called due.
  - from: due_and_payable
    to: extension_period
    by: agent
    means: A first HUD-approved extension of the resolution period was granted.
  - from: due_and_payable
    to: foreclosure_referred
    by: agent
    means: The resolution period ended without resolution and the case was referred to foreclosure counsel.
  - from: extension_period
    to: foreclosure_referred
    by: agent
    means: The extended resolution period ended without resolution and the case was referred to foreclosure counsel.
  - from: opened
    to: cured
    by: agent
    means: The maturity condition was cured before the loan was called due.
  - from: awaiting_hud_approval
    to: cured
    by: agent
    means: The maturity condition was cured while HUD approval was pending.
  - from: due_and_payable
    to: cured
    by: agent
    means: A curable default was cured before the foreclosure sale.
  - from: due_and_payable
    to: resolved
    by: agent
    means: The loan was satisfied by payoff, sale or deed in lieu.
  - from: extension_period
    to: resolved
    by: agent
    means: The loan was satisfied during an extension.
  - from: foreclosure_referred
    to: resolved
    by: agent
    means: The loan was satisfied or the foreclosure sale completed.
  - from: deferred
    to: resolved
    by: agent
    means: The loan was paid in full during the deferral period.
accounts: []
parameter_schema:
  hud_approval_required: Whether HUD approval is required before the loan may be called due for this maturity event
    (boolean)
  hud_notice_days: Calendar days after the servicer learns of the maturity event within which HUD is notified or
    approval is requested
  learned_date_basis: Which date is the date the servicer learns of the event (code)
  due_and_payable_notice_days: Calendar days after the loan is called due within which the due-and-payable notice
    is sent to the borrower or successors
  successor_response_days: Calendar days after the due-and-payable notice within which the borrower or successors
    must state how the loan will be resolved
  appraisal_order_days: Calendar days after the loan is called due within which an as-is appraisal is ordered
  appraisal_valid_months: Months an as-is appraisal remains usable for resolution before a new one is ordered
  resolution_period_months: Calendar months after the due-and-payable date within which the loan must be resolved
    before foreclosure is started
  extension_days: Calendar days added to the resolution deadline by one extension
  max_extensions: Largest number of extensions on one case (integer)
  extension_evidence: Documents that support an extension request (list of evidence_type values)
  extension_hud_approval_required: Whether each extension needs HUD approval recorded on the case first (boolean)
  deferral_eligible: Whether the case can enter a non-borrowing spouse deferral instead of being called due (boolean)
  cure_permitted: Whether the maturity condition can be cured and the loan reinstated (boolean)
  cure_deadline_basis: Latest stage at which a cure is accepted (code)
  cure_evidence: Record that proves a cure (code)
  opening_evidence: Record that opens the case (code)
  event_date_basis: Which date is the case's event_date (code)
  property_charge_default_threshold: Unrepaid property-charge advances above which Cedarline requests HUD approval
    to call the loan due (USD; 0.00 where not a property charge case)
  default_notice_cure_days: Calendar days a default notice gives the borrower to cure before HUD approval is requested
    (0 where not a default case)
  condition_inspection_required: Whether a property condition inspection report must be on file (boolean)
  foreclosure_referral_notice_days: Minimum calendar days between the foreclosure referral notice and the referral
  referral_days_after_deadline: Calendar days after the resolution deadline on which the case may first be referred
    to foreclosure
  property_preservation_inspection_days: Calendar days after the case opens within which a vacant-property inspection
    is ordered (0 where the property is normally occupied)
  successor_documents: Documents that confirm a successor in interest (list)
  notice_recipients: Who receives case notices (code)
  notice_delivery_method: How case notices are sent (code)
  sale_into_revocable_trust_is_transfer: Whether a transfer of title into a revocable living trust in which a borrower
    keeps occupancy and a life interest counts as a sale or transfer (boolean)
  sale_to_co_borrower_is_transfer: Whether a transfer between borrowers on the note counts as a sale or transfer
    (boolean)
  interest_and_mip_continue: Whether interest, MIP and servicing fees keep accruing during the case (boolean)
  successor_confirmation_required: Whether a caller must be a confirmed successor in interest before declaring intent
    or requesting an extension for a deceased borrower's loan (boolean)
  intent_options: Resolution intents a borrower or successor may declare (list of stated_intent values)
  no_response_handling: What happens when no intent is declared within the response window (code)
  case_review_cycle_days: Calendar days between scheduled reviews of an open case
  supersede_priority: Order of precedence when another maturity event occurs on a loan with an open case (ordered
    list of plan names, highest first)
  reappraisal_for_extension: Whether a new appraisal is ordered when an extension is granted after the current appraisal
    is older than appraisal_valid_months (boolean)
  deferral_end_events: Events that end a deferral period (list of codes)
  vacant_property_securing: Whether the servicer may secure a vacant property against damage once the case opens
    (boolean)
  hud_extension_lead_days: Calendar days before the current resolution deadline by which an extension request must
    reach Cedarline so HUD approval can be sought in time
  open_case_statuses: Statuses in which a case counts as open (list)
  resolution_types: Resolution types a resolved case may record (list)
  resolution_evidence: Record that resolves the case (code)
  draws_suspended_while_open: Whether loan disbursements are suspended while the case is open (boolean)
  heir_communication_before_confirmation: What may be told to a potential successor before confirmation (code)
  borrower_statement_sufficient_for_cure: Whether the borrower's oral statement alone proves a cure (boolean)
  condition_repair_inspection_days: Calendar days after a borrower reports condition repairs complete within which
    a reinspection is ordered (0 where not a condition case)
  loan_programs_covered: Loan programs the case plan applies to (list)
  summit_hud_steps_apply: Whether HUD notification, approval and extension steps apply to a Summit loan (boolean)
