- id: maturity_resolution
  subject:
  - maturity_resolved
  rule: 'A case is resolved only when a payoff case on the loan has reached satisfied status, or when foreclosure
    counsel reports the foreclosure sale completed, per resolution_evidence. The resolution_type follows the satisfied
    payoff case''s plan: Borrower Voluntary Payoff, HECM-to-HECM Refinance Payoff and Heir Retention Payoff give
    paid_in_full, Estate Market Sale Payoff gives sale, Approved Short Sale Payoff gives short_sale and Deed in
    Lieu of Foreclosure gives deed_in_lieu; a completed foreclosure sale gives foreclosure_sale. The closed_date
    is the payoff case''s satisfaction date or the foreclosure sale date. The resolution_type is always one of resolution_types.'
  eligibility:
  - id: payoff_satisfied
    applies_to:
    - maturity_resolved
    kind: state
    condition: A case is resolved only when a payoff case on the loan has reached satisfied status, or when foreclosure
      counsel reports the foreclosure sale completed, per resolution_evidence.
    evidence_fields:
    - payoff_cases.status
    - payoff_cases.payoff_case_id
    - payoff_cases.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    state_contract:
      field: payoff_cases.status
      allowed:
      - satisfied
- id: maturity_deferral
  subject:
  - maturity_deferred
  rule: Only a death case can be deferred, per deferral_eligible, and only on a HECM loan. A death case is deferred
    instead of called due only when the loan names a non-borrowing spouse whose profile_type is eligible_non_borrowing_spouse
    and that spouse still occupies the home and has established a legal right to remain within the HECM deferral
    window. While deferred, the case stays open without a call due; the deferral ends on any of deferral_end_events,
    after which the case is called due on the day the ending event is documented. An ineligible non-borrowing spouse,
    or a spouse who married the borrower after closing, never defers the case and may only resolve it like any successor.
  eligibility:
  - id: eligible_spouse
    applies_to:
    - maturity_deferred
    kind: authorization
    condition: A death case is deferred instead of called due only when the loan names a non-borrowing spouse whose
      profile_type is eligible_non_borrowing_spouse and that spouse still occupies the home and has established
      a legal right to remain within the HECM deferral window.
    evidence_fields:
    - hecm_loans.nbs_customer_id
    - customers.profile_type
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
  params:
    per_tier:
      Death of Last Surviving Borrower:
        deferral_eligible: =deferral_eligible
      Sale or Title Transfer:
        deferral_eligible: =deferral_eligible
      Extended Health-Care Absence:
        deferral_eligible: =deferral_eligible
      Principal Residence Change:
        deferral_eligible: =deferral_eligible
      Property Charge Default:
        deferral_eligible: =deferral_eligible
      Property Condition Default:
        deferral_eligible: =deferral_eligible
