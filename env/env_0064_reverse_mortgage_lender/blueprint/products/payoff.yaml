category: payoff
display_name: Payoff and Loan Satisfaction
binding:
  holding_table: payoff_cases
  event_tables:
  - payoff_transactions
  intake_tables:
  - payoff_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    funds_held: payoff_funds
    relocation_incentive_due: relocation_incentive
lifecycle:
  states:
  - opened
  - terms_issued
  - accepted
  - satisfied
  - lapsed
  - withdrawn
  transitions:
  - from: opened
    to: terms_issued
    by: agent
    means: A payoff statement or settlement terms were issued to an authorized requester.
  - from: terms_issued
    to: accepted
    by: user
    means: The borrower or confirmed successor signed the retention, sale, short sale or deed-in-lieu agreement.
  - from: terms_issued
    to: satisfied
    by: agent
    means: Funds covering the required payoff arrived on a plan that needs no signed agreement, and the loan was
      satisfied.
  - from: accepted
    to: satisfied
    by: agent
    means: The agreed funds or the recorded deed in lieu arrived and the loan was satisfied.
  - from: terms_issued
    to: lapsed
    by: system
    means: The statement's good-through date and tolerance passed without sufficient funds or a signed agreement.
  - from: opened
    to: withdrawn
    by: user
    means: The requester withdrew the request before terms were issued.
  - from: terms_issued
    to: withdrawn
    by: user
    means: The requester withdrew after terms were issued.
  - from: accepted
    to: withdrawn
    by: user
    means: The requester withdrew from a signed agreement before it completed.
accounts:
- key: payoff_funds
  unit: USD
  meaning: Payoff funds received on the case and not yet applied to the loan, refunded or returned; held on the
    case as funds_held.
- key: relocation_incentive
  unit: USD
  meaning: Cash-for-keys relocation incentive committed to the occupants and not yet paid; held on the case as relocation_incentive_due.
parameter_schema:
  payoff_statement_business_days: Business days (Monday-Friday excluding federal holidays) after a written payoff
    request within which the statement is issued
  statement_good_through_days: Calendar days after issue through which a payoff statement's figures are good
  per_diem_rate_basis: Annual rate from which the daily accrual on the statement is computed (code)
  per_diem_day_count: Days per year used to turn the annual rate into a daily accrual
  payoff_statement_fee: Fee for a payoff statement (USD)
  required_amount_rounding: Rounding rule for every computed payoff figure (rule code)
  retention_pct_of_appraised: Percent of the as-is appraised value that, when lower than the balance, satisfies
    the loan for a retaining successor (0.00 where not applicable)
  sale_min_pct_of_appraised: Percent of the as-is appraised value the contract price must reach, when lower than
    the balance, for a market sale to satisfy the loan (0.00 where not applicable)
  short_sale_min_pct_of_appraised: Lowest contract price, as a percent of the as-is appraised value, Cedarline approves
    for a short sale (0.00 where not applicable)
  max_commission_pct: Largest real estate commission allowed out of the sale price (percent; 0.00 where no sale)
  max_other_closing_costs_pct: Largest other seller closing costs allowed out of the sale price (percent; 0.00 where
    no sale)
  arms_length_required: Whether the buyer must be unrelated to the borrower and successors (boolean)
  appraisal_required: Whether a current as-is appraisal from the maturity case is needed to set the terms (boolean)
  deficiency_waived: Whether any part of the balance above the required payoff is forgiven and never collected (boolean)
  surplus_to_estate: Whether sale proceeds above the balance are released to the estate (boolean)
  acceptance_required: Whether a signed agreement from the borrower or successor is needed before funds or a deed
    are taken (boolean)
  acceptance_signature_days: Calendar days after terms are issued within which the agreement must be signed (0 where
    no agreement is needed)
  successor_confirmation_required: Whether the requester must be the borrower or a confirmed successor in interest
    (boolean)
  third_party_authorization_accepted: Whether a title company or new lender may obtain the statement with the borrower's
    written authorization (boolean)
  accepted_remittance_methods: Ways payoff funds may be remitted (list of remittance_method values; empty where
    no funds are taken)
  personal_check_accepted: Whether a personal check is accepted as payoff funds (boolean)
  late_funds_tolerance_days: Calendar days after the good-through date within which funds are still accepted with
    additional daily accrual
  short_funds_hold_days: Calendar days insufficient funds are held on the case before they are returned to the remitter
  overpayment_refund_business_days: Business days after satisfaction within which funds above the required payoff
    are refunded to the remitter
  lien_release_days: Calendar days after satisfaction within which the lien release is sent for recording
  refinance_after_new_loan_rescission: Whether refinance payoff funds are accepted only after the new loan's rescission
    period ended (boolean)
  deed_in_lieu_vacancy_required: Whether the property must be vacant and broom-clean before the deed in lieu is
    accepted (boolean)
  deed_in_lieu_clear_title_required: Whether title must be free of other liens before the deed in lieu is accepted
    (boolean)
  cash_for_keys_max: Largest relocation incentive paid to occupants who vacate under a deed in lieu (USD; 0.00 where
    not offered)
  cash_for_keys_vacate_days: Calendar days after the agreement is signed within which the property must be vacated
    to earn the incentive (0 where not offered)
  vacate_inspection_required: Whether a vacancy inspection must confirm the property is vacant before the incentive
    is paid (boolean)
  incentive_payment_method: How the relocation incentive is paid (code)
  short_sale_min_marketing_days: Calendar days the property must have been listed before a short sale is approved
    (0 where not applicable)
  surplus_release_business_days: Business days after satisfaction within which a surplus is released to the estate
    (0 where not applicable)
  interest_through_basis: Date through which daily accrual is charged on a payoff (code)
  lapsed_case_reopen_rule: What a requester does after a case lapses (code)
  withdrawal_after_acceptance_allowed: Whether a signed agreement can be withdrawn before it completes (boolean)
  statement_recipients: Who may receive the payoff statement (list of codes)
  claim_after_satisfaction: Whether the satisfied loan proceeds to an FHA insurance claim rather than a paid-in-full
    status (boolean)
  related_party_sale_treated_as: Plan a sale to a related party is handled under (official plan name, or not_applicable)
  loan_programs_covered: Loan programs the plan applies to (list)
  maturity_case_required: Whether the loan must have a maturity case in due_and_payable, extension_period or foreclosure_referred
    status (boolean)
  funds_application_timing: When held funds are applied to the loan (code)
  remitter_refund_target: Who receives a refund of excess or returned funds (code)
  dishonored_funds_handling: What happens when remitted funds are recalled or dishonored (code)
  max_open_cases_per_loan: Largest number of open payoff cases on one loan (integer)
  retention_proof_of_funds_required: Whether a retaining successor must show proof of funds or a financing commitment
    before the agreement is issued for signature (boolean)
  contract_review_business_days: Business days within which a submitted purchase contract or short sale package
    is reviewed (0 where no contract is reviewed)
