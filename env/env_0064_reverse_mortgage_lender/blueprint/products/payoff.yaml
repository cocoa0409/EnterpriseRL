events:
- type: payoff_case_opened
  target: payoff_cases
  mutation: create
  meaning: A payoff case is opened on a written payoff request from an authorized requester.
  grain: One row per payoff case.
  fields:
    payoff_case_id: Case id.
    customer_id: Requester.
    borrower_customer_id: Borrower of record.
    hecm_loan_id: HECM loan, if any.
    jumbo_loan_id: Summit loan, if any.
    maturity_case_id: Maturity case, if any.
    loan_program: hecm or summit.
    variant_name: Payoff plan.
    status: Always opened.
    opened_date: Request date.
  triggers: []
- type: payoff_terms_issued
  target: payoff_cases
  mutation:
    transition:
      from: opened
      to: terms_issued
  meaning: The payoff statement or settlement terms are issued.
  grain: One row per transition.
  fields:
    status: Set to terms_issued.
    statement_date: Issue date.
    statement_good_through_date: Good-through date.
    statement_balance: Balance projected to the good-through date.
    per_diem_amount: Daily accrual.
    appraised_value_basis: Appraised value used, or 0.00.
    contract_price: Approved contract price, or 0.00.
    allowed_closing_costs: Allowed closing costs, or 0.00.
    required_payoff_amount: Amount that satisfies the loan.
  triggers: []
- type: payoff_terms_reissued
  target: payoff_cases
  mutation: update
  meaning: Updated terms replace the current statement, for a new good-through date, a new appraisal or a revised
    contract.
  grain: One row per reissue.
  fields:
    statement_date: Reissue date.
    statement_good_through_date: New good-through date.
    statement_balance: New projected balance.
    per_diem_amount: New daily accrual.
    appraised_value_basis: Appraised value used.
    contract_price: Approved contract price.
    allowed_closing_costs: Allowed closing costs.
    required_payoff_amount: New required amount.
  triggers: []
- type: payoff_terms_accepted
  target: payoff_cases
  mutation:
    transition:
      from: terms_issued
      to: accepted
  meaning: The borrower or confirmed successor signs the agreement under the issued terms.
  grain: One row per transition.
  fields:
    status: Set to accepted.
    accepted_date: Signature date.
    variant_name: Plan signed under (unchanged).
  triggers:
  - event: payoff:payoff_incentive_committed
    when:
      variant_name: Deed in Lieu of Foreclosure
    map:
      effective_date: accepted_date
- type: payoff_funds_received
  target: payoff_transactions
  meaning: Payoff funds arrive from the requester, a title company or a new lender.
  grain: One row per remittance.
  distinguish_by:
  - remittance_reference
  fields:
    amount: Funds received.
    effective_date: Date received.
    remittance_method: wire or cashiers_check.
    remittance_reference: Wire reference or check number.
    remitter_name: Sender.
  account: payoff_funds
  direction: in
  triggers: []
- type: payoff_funds_returned
  target: payoff_transactions
  meaning: Held funds leave the case because the remittance was recalled or dishonored, or because insufficient
    funds were returned after the hold period.
  grain: One row per remittance returned.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount returned.
    effective_date: Return date.
    source_txn_ref: The receipt returned.
    remittance_method: Method of the return.
  account: payoff_funds
  direction: out
  triggers: []
- type: payoff_funds_applied
  target: payoff_transactions
  meaning: On satisfaction the required payoff amount is applied to the loan.
  grain: One row per satisfied case.
  distinguish_by:
  - effective_date
  fields:
    amount: Amount applied.
    effective_date: Satisfaction date.
  account: payoff_funds
  direction: out
  triggers: []
- type: payoff_overage_refund
  target: payoff_transactions
  meaning: Funds held above the required payoff, or an estate's sale surplus, are refunded after satisfaction.
  grain: One row per refunded receipt.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount refunded.
    effective_date: Refund date.
    source_txn_ref: The receipt whose excess is refunded.
    remittance_method: How refunded.
  account: payoff_funds
  direction: out
  triggers: []
- type: payoff_incentive_committed
  target: payoff_transactions
  meaning: A cash-for-keys relocation incentive is committed when a deed-in-lieu agreement is signed.
  grain: One row per deed-in-lieu case.
  distinguish_by:
  - effective_date
  fields:
    amount: Incentive committed.
    effective_date: Agreement signature date.
  account: relocation_incentive
  direction: in
  triggers: []
- type: payoff_incentive_paid
  target: payoff_transactions
  meaning: The relocation incentive is paid after the occupants vacate, or released unpaid when they do not vacate
    in time.
  grain: One row per deed-in-lieu case.
  distinguish_by:
  - effective_date
  fields:
    amount: Incentive paid or released.
    effective_date: Payment or release date.
    remittance_method: check, or not_applicable when released unpaid.
  account: relocation_incentive
  direction: out
  triggers: []
- type: payoff_satisfied
  target: payoff_cases
  mutation:
    transition:
    - from: terms_issued
      to: satisfied
    - from: accepted
      to: satisfied
  meaning: The loan is satisfied by the required funds or the recorded deed in lieu, and the lien release is ordered.
  grain: One row per transition.
  fields:
    status: Set to satisfied.
    closed_date: Satisfaction date.
    variant_name: Payoff plan (unchanged).
    loan_program: Loan program (unchanged).
    maturity_case_id: Maturity case, if any (unchanged).
  triggers:
  - event: hecm:hecm_paid_in_full
    when:
      loan_program: hecm
      variant_name:
      - Borrower Voluntary Payoff
      - HECM-to-HECM Refinance Payoff
      - Heir Retention Payoff
      - Estate Market Sale Payoff
    map:
      terminated_date: closed_date
  - event: hecm:hecm_claim_terminated
    when:
      loan_program: hecm
      variant_name:
      - Approved Short Sale Payoff
      - Deed in Lieu of Foreclosure
    map:
      terminated_date: closed_date
  - event: jumbo:jumbo_paid_in_full
    when:
      loan_program: summit
      variant_name:
      - Borrower Voluntary Payoff
      - Heir Retention Payoff
      - Estate Market Sale Payoff
    map:
      terminated_date: closed_date
  - event: jumbo:jumbo_liquidated
    when:
      loan_program: summit
      variant_name:
      - Approved Short Sale Payoff
      - Deed in Lieu of Foreclosure
    map:
      terminated_date: closed_date
  - event: maturity:maturity_resolved
    when:
      maturity_case_id:
        not: ''
    map:
      closed_date: closed_date
  - event: payoff:payoff_funds_applied
    when:
      variant_name:
        not: Deed in Lieu of Foreclosure
    map:
      effective_date: closed_date
- type: payoff_lapsed
  target: payoff_cases
  mutation:
    transition:
      from: terms_issued
      to: lapsed
  meaning: The terms expired without sufficient funds or a signed agreement.
  grain: One row per transition.
  fields:
    status: Set to lapsed.
    closed_date: Lapse date.
  triggers: []
- type: payoff_withdrawn
  target: payoff_cases
  mutation:
    transition:
    - from: opened
      to: withdrawn
    - from: terms_issued
      to: withdrawn
    - from: accepted
      to: withdrawn
  meaning: The requester withdraws the payoff request or agreement.
  grain: One row per transition.
  fields:
    status: Set to withdrawn.
    closed_date: Withdrawal date.
  triggers: []
measures:
- id: payoff_msr_net_remitted
  window: Life of the payoff case up to and including the handling date.
  measure: Sum of payoff_funds_received amounts on the case less payoff_funds_returned amounts on the case.
policies:
- id: payoff_agg_multi_holding
  subject:
  - payoff_case_opened
  rule: 'A requester may hold payoff cases on more than one loan, such as a successor settling two estates, but
    a loan has at most max_open_cases_per_loan open payoff case at a time. A payoff case is opened only when the
    loan has no other payoff case whose status is opened, terms_issued or accepted. A request on a loan that already
    has an open case is handled on that case: new figures are reissued on it rather than opening a second case,
    and a request under a different plan withdraws nothing until the requester withdraws the open case. A plan applies
    only to a loan program listed in its loan_programs_covered, and the plans other than Borrower Voluntary Payoff
    and HECM-to-HECM Refinance Payoff apply only while the loan has a maturity case in due_and_payable, extension_period
    or foreclosure_referred status, per maturity_case_required; otherwise the request is declined with reason plan_not_available.'
  eligibility:
  - id: one_open_case_per_loan
    applies_to:
    - payoff_case_opened
    kind: dedup
    condition: A payoff case is opened only when the loan has no other payoff case whose status is opened, terms_issued
      or accepted.
    evidence_fields:
    - payoff_cases.hecm_loan_id
    - payoff_cases.jumbo_loan_id
    - payoff_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.hecm_loan_id
      - - payoff_cases.jumbo_loan_id
      action_bindings:
        payoff_cases.hecm_loan_id: hecm_loan_id
        payoff_cases.jumbo_loan_id: jumbo_loan_id
    dedup_contract:
      table: payoff_cases
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
        jumbo_loan_id: jumbo_loan_id
      duplicate_filters:
        status:
        - opened
        - terms_issued
        - accepted
      distinct_fields: []
  params:
    max_per_customer: null
- id: payoff_agg_funds
  subject:
  - payoff_funds_received
  - payoff_funds_returned
  - payoff_funds_applied
  - payoff_overage_refund
  rule: 'Funds from several remitters on one case, such as several heirs, a title company or a new lender, are pooled:
    payoff_msr_net_remitted counts every receipt less every returned receipt, and the case is funded when that sum
    reaches the required payoff amount. Funds are accepted only by a method in the plan''s accepted_remittance_methods;
    a personal check is never accepted, per personal_check_accepted, and is sent back without being recorded as
    a receipt. Each remittance is recorded once, identified by its remittance_reference. A recalled wire or dishonored
    check is returned against its receipt on the day Cedarline learns of it, per dishonored_funds_handling, and
    the shortfall reopens. Funds that still fall short of the required amount short_funds_hold_days calendar days
    after the first receipt are returned receipt by receipt to each original remitter. On satisfaction exactly the
    required payoff amount is applied to the loan, per funds_application_timing; any held excess is refunded within
    overpayment_refund_business_days business days to the remitter of the receipt that took the pooled total over
    the required amount, up to that receipt''s amount, and then to earlier remitters in reverse order of receipt,
    per remitter_refund_target.'
  eligibility:
  - id: remittance_once
    applies_to:
    - payoff_funds_received
    kind: dedup
    condition: Each remittance is recorded once, identified by its remittance_reference.
    evidence_fields:
    - payoff_transactions.remittance_reference
    - payoff_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_transactions.remittance_reference
      action_bindings:
        payoff_transactions.remittance_reference: remittance_reference
    dedup_contract:
      table: payoff_transactions
      mode: separate_record
      object_bindings:
        remittance_reference: remittance_reference
      duplicate_filters:
        event_type:
        - payoff_funds_received
      distinct_fields: []
  formula:
    excess_to_refund: max(0, payoff_msr_net_remitted - required_payoff_amount)
  measures:
  - payoff_msr_net_remitted
- id: payoff_statement_terms
  subject:
  - payoff_terms_issued
  - payoff_terms_reissued
  rule: 'Terms are issued only to a requester the plan''s statement_recipients allow: the borrower, a confirmed
    successor in interest (profile_type successor_in_interest linked to the borrower) where successor_confirmation_required
    is true, or a title company or new lender holding the borrower''s written authorization where third_party_authorization_accepted
    is true; any other request is declined with reason requester_not_authorized. Terms are issued only on a payoff
    request on file for the loan from such a requester whose request status is received. A statement is issued within
    payoff_statement_business_days business days of the request at a fee of payoff_statement_fee, with statement_date
    the issue date and statement_good_through_date statement_good_through_days calendar days later. The per diem
    is the loan balance on the statement date times the loan''s note rate plus, for a HECM, the annual MIP rate,
    divided by per_diem_day_count, rounded half up to the cent; the statement_balance is the balance on the statement
    date plus the per diem for each day from the statement date to the good-through date. The required payoff amount
    is the statement_balance for Borrower Voluntary Payoff and HECM-to-HECM Refinance Payoff; for Heir Retention
    Payoff it is the lesser of the statement_balance and retention_pct_of_appraised percent of the appraised value;
    for the two sale plans it is set by the sale review rule; for Deed in Lieu of Foreclosure it is 0.00. Terms
    that rely on an appraisal use the latest appraisal recorded on the loan''s maturity case, which must still be
    within that case''s appraisal validity period; otherwise new terms wait for a new appraisal. Reissued terms
    replace every figure and restart the good-through period, and are issued on request or when a new appraisal
    or revised contract is recorded. The per diem''s annual rate follows per_diem_rate_basis, and every computed
    figure is rounded per required_amount_rounding.'
  eligibility:
  - id: authorized_request_on_file
    applies_to:
    - payoff_terms_issued
    - payoff_terms_reissued
    kind: authorization
    condition: Terms are issued only on a payoff request on file for the loan from such a requester whose request
      status is received.
    evidence_fields:
    - payoff_requests.payoff_request_id
    - payoff_requests.request_type
    - payoff_requests.request_status
    - payoff_requests.authorization_basis
    - customers.profile_type
    - customers.linked_customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_requests.payoff_request_id
      action_bindings:
        payoff_requests.payoff_request_id: payoff_request_id
  - id: appraisal_current
    applies_to:
    - payoff_terms_issued
    - payoff_terms_reissued
    kind: authorization
    condition: Terms that rely on an appraisal use the latest appraisal recorded on the loan's maturity case, which
      must still be within that case's appraisal validity period; otherwise new terms wait for a new appraisal.
    evidence_fields:
    - maturity_cases.appraised_value
    - maturity_cases.appraisal_date
    - maturity_cases.maturity_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
  params:
    per_tier:
      Borrower Voluntary Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      HECM-to-HECM Refinance Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Heir Retention Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Estate Market Sale Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Approved Short Sale Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Deed in Lieu of Foreclosure:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
  formula:
    retention_required: min(statement_balance, round(appraised_value_basis * retention_pct_of_appraised / 100, 2))
- id: payoff_sale_review
  subject:
  - payoff_terms_issued
  - payoff_terms_reissued
  rule: Sale terms are set only from a purchase contract submission on file for the case whose request status is
    received; Cedarline reviews it within contract_review_business_days business days. The buyer must be arm's length
    where arms_length_required is true; a sale to a related party is not a sale under these plans and is handled
    under the plan named in related_party_sale_treated_as, and the submission is declined with reason not_arms_length.
    The allowed closing costs are the commission up to max_commission_pct percent of the contract price plus other
    seller costs up to max_other_closing_costs_pct percent of the contract price; a contract whose costs exceed
    either cap is declined with reason closing_costs_exceed_limit unless resubmitted within the caps. For Estate
    Market Sale Payoff the contract price must be at least the lesser of the statement_balance and sale_min_pct_of_appraised
    percent of the appraised value, otherwise it is declined with reason price_below_minimum; the required payoff
    amount is the lesser of the statement_balance and the contract price less the allowed closing costs, and any
    net proceeds above the statement_balance belong to the estate, released within surplus_release_business_days
    business days per surplus_to_estate. For Approved Short Sale Payoff the contract price must be at least short_sale_min_pct_of_appraised
    percent of the appraised value and the property must have been listed at least short_sale_min_marketing_days
    calendar days before the contract was submitted, otherwise it is declined with reason price_below_minimum or
    marketing_period_short; the required payoff amount is the contract price less the allowed closing costs, and
    the remaining balance is not collected per deficiency_waived. A contract that meets the Estate Market Sale Payoff
    minimum is never approved as a short sale.
  eligibility:
  - id: contract_on_file
    applies_to:
    - payoff_terms_issued
    - payoff_terms_reissued
    kind: authorization
    condition: Sale terms are set only from a purchase contract submission on file for the case whose request status
      is received; Cedarline reviews it within contract_review_business_days business days.
    evidence_fields:
    - payoff_requests.payoff_request_id
    - payoff_requests.request_type
    - payoff_requests.contract_price
    - payoff_requests.commission_amount
    - payoff_requests.other_closing_costs
    - payoff_requests.buyer_relationship
    - payoff_requests.listing_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_requests.payoff_request_id
      action_bindings:
        payoff_requests.payoff_request_id: payoff_request_id
  params:
    per_tier:
      Borrower Voluntary Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      HECM-to-HECM Refinance Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Heir Retention Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Estate Market Sale Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Approved Short Sale Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Deed in Lieu of Foreclosure:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
  formula:
    estate_sale_required: min(statement_balance, contract_price - allowed_closing_costs)
    short_sale_required: contract_price - allowed_closing_costs
- id: payoff_acceptance
  subject:
  - payoff_terms_accepted
  - payoff_withdrawn
  rule: On plans whose acceptance_required is true, nothing is taken toward satisfaction until the borrower or confirmed
    successor signs the agreement under the issued terms; only that person can sign or withdraw, and the servicer
    records their own signed submission. An agreement is accepted only when it is signed no later than acceptance_signature_days
    calendar days after the terms were issued. Those days are counted as calendar days starting the day after the
    statement_date, and a signature on the last counted day still qualifies; a later signature is declined with
    reason signature_window_passed and new terms must be issued. A Heir Retention Payoff agreement is issued for
    signature only after proof of funds or a financing commitment is on file, per retention_proof_of_funds_required;
    a Deed in Lieu of Foreclosure is accepted only when the property is vacant and title carries no other lien,
    per deed_in_lieu_vacancy_required and deed_in_lieu_clear_title_required, otherwise it is declined with reason
    property_not_vacant or title_not_clear. A requester may withdraw before satisfaction, including after signing
    where withdrawal_after_acceptance_allowed is true; held funds are then returned to their remitters.
  eligibility:
  - id: signature_window
    applies_to:
    - payoff_terms_accepted
    kind: time
    condition: An agreement is accepted only when it is signed no later than acceptance_signature_days calendar
      days after the terms were issued.
    evidence_fields:
    - payoff_cases.statement_date
    - payoff_cases.payoff_case_id
    - payoff_requests.request_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the terms were issued
      anchor_source: payoff_cases.statement_date
      relation: not_after
      duration_source: variants.acceptance_signature_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the statement_date, and a signature
        on the last counted day still qualifies; a later signature is declined with reason signature_window_passed
        and new terms must be issued.
      boundary: inclusive
  params:
    per_tier:
      Borrower Voluntary Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      HECM-to-HECM Refinance Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Heir Retention Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Estate Market Sale Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Approved Short Sale Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Deed in Lieu of Foreclosure:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
- id: payoff_relocation_incentive
  subject:
  - payoff_incentive_committed
  - payoff_incentive_paid
  rule: When a Deed in Lieu of Foreclosure agreement is signed, a relocation incentive of cash_for_keys_max is committed
    on the signature date; no other plan carries an incentive. The incentive is paid only when the property is vacated
    no later than cash_for_keys_vacate_days calendar days after the agreement was signed. Those days are counted
    as calendar days starting the day after the accepted_date, and vacating on the last counted day still qualifies.
    Payment needs a vacancy inspection confirming the property is vacant, per vacate_inspection_required, and is
    made by incentive_payment_method on the day the inspection is recorded; when the occupants have not vacated
    in time the committed incentive is released unpaid on the day after the period ends, with remittance_method
    not_applicable.
  eligibility:
  - id: vacated_in_time
    applies_to:
    - payoff_incentive_paid
    kind: time
    condition: The incentive is paid only when the property is vacated no later than cash_for_keys_vacate_days calendar
      days after the agreement was signed.
    evidence_fields:
    - payoff_cases.accepted_date
    - payoff_cases.payoff_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the agreement was signed
      anchor_source: payoff_cases.accepted_date
      relation: not_after
      duration_source: variants.cash_for_keys_vacate_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the accepted_date, and vacating
        on the last counted day still qualifies.
      boundary: inclusive
- id: payoff_satisfaction
  subject:
  - payoff_satisfied
  - payoff_funds_applied
  rule: A funds-based case is satisfied on the day payoff_msr_net_remitted first reaches the required payoff amount,
    and a Deed in Lieu of Foreclosure case on the day the deed recording is confirmed by a deed_in_lieu_recording
    submission. A case whose plan has acceptance_required true is satisfied only from accepted status; Borrower
    Voluntary Payoff and HECM-to-HECM Refinance Payoff are satisfied from terms_issued. Funds count toward satisfaction
    only when they are received no later than late_funds_tolerance_days calendar days after the statement's good-through
    date. Those days are counted as calendar days starting the day after the statement_good_through_date, and funds
    received on the last counted day still count. Funds received after the good-through date but within the tolerance
    must also cover the per diem for each day past the good-through date, which is added to the required payoff
    amount, per interest_through_basis. For HECM-to-HECM Refinance Payoff the funds are accepted only after the
    new loan's rescission period has ended, per refinance_after_new_loan_rescission. On satisfaction the required
    payoff amount is applied to the loan, the loan is marked paid in full or, where claim_after_satisfaction is
    true, claim-terminated, any open maturity case is resolved, and the lien release is sent for recording within
    lien_release_days calendar days.
  eligibility:
  - id: funds_within_tolerance
    applies_to:
    - payoff_satisfied
    kind: time
    condition: Funds count toward satisfaction only when they are received no later than late_funds_tolerance_days
      calendar days after the statement's good-through date.
    evidence_fields:
    - payoff_cases.statement_good_through_date
    - payoff_cases.payoff_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the statement's good-through date
      anchor_source: payoff_cases.statement_good_through_date
      relation: not_after
      duration_source: variants.late_funds_tolerance_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the statement_good_through_date,
        and funds received on the last counted day still count.
      boundary: inclusive
  - id: applied_once
    applies_to:
    - payoff_funds_applied
    kind: dedup
    condition: On satisfaction the required payoff amount is applied to the loan, the loan is marked paid in full
      or, where claim_after_satisfaction is true, claim-terminated, any open maturity case is resolved, and the
      lien release is sent for recording within lien_release_days calendar days.
    evidence_fields:
    - payoff_transactions.payoff_case_id
    - payoff_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_transactions.payoff_case_id
      action_bindings:
        payoff_transactions.payoff_case_id: payoff_case_id
    dedup_contract:
      table: payoff_transactions
      mode: separate_record
      object_bindings:
        payoff_case_id: payoff_case_id
      duplicate_filters:
        event_type:
        - payoff_funds_applied
      distinct_fields: []
  measures:
  - payoff_msr_net_remitted
- id: payoff_lapse
  subject:
  - payoff_lapsed
  rule: Terms lapse only when more than late_funds_tolerance_days calendar days have passed since the statement's
    good-through date without the case being funded or, where acceptance_required is true, accepted. Those days
    are counted as calendar days starting the day after the statement_good_through_date, and the case does not lapse
    on the last tolerance day itself. A lapsed case is final; the requester must open a new case, per lapsed_case_reopen_rule,
    and any held funds are returned to their remitters.
  eligibility:
  - id: lapse_after_tolerance
    applies_to:
    - payoff_lapsed
    kind: time
    condition: Terms lapse only when more than late_funds_tolerance_days calendar days have passed since the statement's
      good-through date without the case being funded or, where acceptance_required is true, accepted.
    evidence_fields:
    - payoff_cases.statement_good_through_date
    - payoff_cases.payoff_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the statement's good-through date
      anchor_source: payoff_cases.statement_good_through_date
      relation: not_before
      duration_source: variants.late_funds_tolerance_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the statement_good_through_date,
        and the case does not lapse on the last tolerance day itself.
      boundary: exclusive
