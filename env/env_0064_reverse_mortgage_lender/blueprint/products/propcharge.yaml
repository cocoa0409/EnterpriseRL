events:
- type: propcharge_record_opened
  target: propcharge_plans
  mutation: create
  meaning: An arrangement record opens on the loan with the first unrepaid property-charge advance, under the lump-sum
    notice.
  grain: One row per arrangement.
  fields:
    propcharge_plan_id: Arrangement id.
    customer_id: Primary borrower.
    hecm_loan_id: HECM loan, if any.
    jumbo_loan_id: Summit loan, if any.
    loan_program: hecm or summit.
    variant_name: Always Lump-Sum Repayment at opening.
    status: Always notice_period.
    opened_date: Date of the first advance.
  triggers: []
- type: propcharge_advance
  target: propcharge_transactions
  meaning: Cedarline pays an unpaid property tax or insurance bill on the borrower's behalf as a corporate advance.
  grain: One row per bill advanced.
  distinguish_by:
  - bill_reference
  fields:
    amount: Amount advanced.
    effective_date: Payment date.
    charge_type: Charge paid.
    bill_reference: Bill paid.
    loan_program: Loan program.
  account: arrearage
  direction: in
  triggers:
  - event: hecm:hecm_advance_posting
    when:
      loan_program: hecm
      charge_type: property_tax
    map:
      amount: amount
      effective_date: effective_date
      advance_type: corporate_advance_property_tax
      source_txn_ref: propcharge_txn_id
      disbursement_method: not_applicable
  - event: hecm:hecm_advance_posting
    when:
      loan_program: hecm
      charge_type:
      - hazard_insurance
      - flood_insurance
    map:
      amount: amount
      effective_date: effective_date
      advance_type: corporate_advance_insurance
      source_txn_ref: propcharge_txn_id
      disbursement_method: not_applicable
  - event: jumbo:jumbo_advance_posting
    when:
      loan_program: summit
      charge_type: property_tax
    map:
      amount: amount
      effective_date: effective_date
      advance_type: corporate_advance_property_tax
      source_txn_ref: propcharge_txn_id
  - event: jumbo:jumbo_advance_posting
    when:
      loan_program: summit
      charge_type:
      - hazard_insurance
      - flood_insurance
    map:
      amount: amount
      effective_date: effective_date
      advance_type: corporate_advance_insurance
      source_txn_ref: propcharge_txn_id
- type: propcharge_repayment
  target: propcharge_transactions
  meaning: The borrower repays advanced property charges, as a lump sum or an installment.
  grain: One row per payment received.
  distinguish_by:
  - payment_reference
  fields:
    amount: Amount repaid.
    effective_date: Date received.
    payment_reference: Payment confirmation number.
    loan_program: Loan program.
  account: arrearage
  direction: out
  triggers:
  - event: hecm:hecm_prepayment
    when:
      loan_program: hecm
    map:
      effective_date: effective_date
      source_txn_ref: propcharge_txn_id
  - event: jumbo:jumbo_prepayment
    when:
      loan_program: summit
    map:
      effective_date: effective_date
      source_txn_ref: propcharge_txn_id
- type: propcharge_installment_missed
  target: propcharge_transactions
  meaning: An installment remained unpaid past its grace period.
  grain: One row per missed installment.
  distinguish_by:
  - installment_number
  fields:
    amount: 0.00 (documentary).
    effective_date: Date the grace period ended.
    installment_number: Installment missed.
    loan_program: Loan program.
  triggers: []
- type: propcharge_at_risk_review
  target: propcharge_transactions
  meaning: The annual review of an at-risk extension is completed.
  grain: One row per review year.
  distinguish_by:
  - review_year
  fields:
    amount: 0.00 (documentary).
    effective_date: Review date.
    review_year: Year reviewed.
    review_outcome: renewed or not_renewed.
    loan_program: Loan program.
  triggers: []
- type: propcharge_agreement_issued
  target: propcharge_plans
  mutation:
    transition:
      from: notice_period
      to: pending_signature
  meaning: The chosen arrangement's agreement is issued for the borrowers' signature.
  grain: One row per transition.
  fields:
    status: Set to pending_signature.
    variant_name: Arrangement chosen.
    monthly_installment: Installment.
    term_months: Number of installments.
    first_installment_date: First due date.
    agreement_issued_date: Issue date.
  triggers: []
- type: propcharge_agreement_signed
  target: propcharge_plans
  mutation:
    transition:
      from: pending_signature
      to: active
  meaning: Every borrower signs the agreement and the arrangement starts.
  grain: One row per transition.
  fields:
    status: Set to active.
    signed_date: Signature date.
  triggers: []
- type: propcharge_completed
  target: propcharge_plans
  mutation:
    transition:
    - from: notice_period
      to: completed
    - from: active
      to: completed
  meaning: The arrearage is repaid in full.
  grain: One row per transition.
  fields:
    status: Set to completed.
    closed_date: Completion date.
  triggers: []
- type: propcharge_defaulted
  target: propcharge_plans
  mutation:
    transition:
      from: active
      to: defaulted
  meaning: The arrangement defaults on missed installments.
  grain: One row per transition.
  fields:
    status: Set to defaulted.
    default_date: Default date.
  triggers: []
- type: propcharge_default_cured
  target: propcharge_plans
  mutation:
    transition:
      from: defaulted
      to: active
  meaning: Every missed installment is paid within the cure period and the arrangement resumes.
  grain: One row per transition.
  fields:
    status: Set to active.
    default_date: Cleared to empty.
  triggers: []
- type: propcharge_referred
  target: propcharge_plans
  mutation:
    transition:
    - from: notice_period
      to: referred
    - from: pending_signature
      to: referred
    - from: defaulted
      to: referred
  meaning: The unresolved arrearage is referred for a property charge default maturity case.
  grain: One row per transition.
  fields:
    status: Set to referred.
    closed_date: Referral date.
  triggers:
  - event: maturity:maturity_case_opened
    map:
      variant_name: Property Charge Default
      opened_date: closed_date
measures:
- id: propcharge_msr_missed_installments
  window: From the arrangement's signed_date (inclusive) to the handling date (inclusive).
  measure: Count of propcharge_installment_missed rows of the arrangement in the window.
policies:
- id: propcharge_agg_multi_holding
  subject:
  - propcharge_record_opened
  rule: A loan carries at most max_arrangements_per_loan open arrangement record, and a borrower has only one reverse
    mortgage, so a borrower holds at most one open record. An arrangement record is opened only when the loan has
    no other record whose status is notice_period, pending_signature, active or defaulted. While a record is open,
    every new advance on the loan is added to it rather than opening another. A record opens on the first unrepaid
    advance, per open_from_first_advance, for any loan program in loan_programs_covered, under the Lump-Sum Repayment
    notice, which asks for repayment in full within lump_sum_due_days calendar days; notices go by notice_channels.
  eligibility:
  - id: one_open_record
    applies_to:
    - propcharge_record_opened
    kind: dedup
    condition: An arrangement record is opened only when the loan has no other record whose status is notice_period,
      pending_signature, active or defaulted.
    evidence_fields:
    - propcharge_plans.hecm_loan_id
    - propcharge_plans.jumbo_loan_id
    - propcharge_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.hecm_loan_id
      - - propcharge_plans.jumbo_loan_id
      action_bindings:
        propcharge_plans.hecm_loan_id: hecm_loan_id
        propcharge_plans.jumbo_loan_id: jumbo_loan_id
    dedup_contract:
      table: propcharge_plans
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
        jumbo_loan_id: jumbo_loan_id
      duplicate_filters:
        status:
        - notice_period
        - pending_signature
        - active
        - defaulted
      distinct_fields: []
  params:
    max_per_customer: 1
- id: propcharge_evt_advance
  subject:
  - propcharge_advance
  rule: Cedarline advances only the charge types in advance_charge_types, and only when the bill is past its due
    date unpaid and no set-aside on the loan pays it in full; a bill a Fully Funded LESA or Summit reserve can pay
    is paid from the set-aside instead, and only a set-aside shortfall left unpaid by the borrower is advanced,
    per setaside_shortfall_advances_included. Delinquent homeowners-association dues are never advanced, per hoa_dues_advanced,
    and remain a matter between the borrower and the association. An advance is recorded only while the arrangement
    record is notice_period, pending_signature, active or defaulted. Each bill is advanced at most once, identified
    by its bill_reference, and the borrower is notified within advance_notice_days calendar days; the advance is
    added to the loan balance on its payment date. A new advance during an active installment arrangement is added
    to the arrearage and, where recast_on_new_advance is true, the installment is recomputed over the remaining
    installments.
  eligibility:
  - id: advance_open_record
    applies_to:
    - propcharge_advance
    kind: state
    condition: An advance is recorded only while the arrangement record is notice_period, pending_signature, active
      or defaulted.
    evidence_fields:
    - propcharge_plans.status
    - propcharge_plans.propcharge_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.propcharge_plan_id
      action_bindings:
        propcharge_plans.propcharge_plan_id: propcharge_plan_id
    state_contract:
      field: propcharge_plans.status
      allowed:
      - notice_period
      - pending_signature
      - active
      - defaulted
  - id: bill_advanced_once
    applies_to:
    - propcharge_advance
    kind: dedup
    condition: Each bill is advanced at most once, identified by its bill_reference, and the borrower is notified
      within advance_notice_days calendar days; the advance is added to the loan balance on its payment date.
    evidence_fields:
    - propcharge_transactions.bill_reference
    - propcharge_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_transactions.bill_reference
      action_bindings:
        propcharge_transactions.bill_reference: bill_reference
    dedup_contract:
      table: propcharge_transactions
      mode: separate_record
      object_bindings:
        bill_reference: bill_reference
      duplicate_filters:
        event_type:
        - propcharge_advance
      distinct_fields: []
- id: propcharge_arrangement_selection
  subject:
  - propcharge_agreement_issued
  rule: 'The arrangement is chosen per term_selection_rule: the installment plan whose arrearage band (arrearage_band_min
    to arrearage_band_max, where a maximum of 0.00 means no limit) covers the arrearage_balance on the issue date,
    unless the borrower elects a shorter plan per borrower_may_elect_shorter_term; the borrower may instead repay
    in full under the Lump-Sum Repayment. The At-Risk Extension is offered instead only when the youngest borrower
    is at least at_risk_min_age and one of at_risk_circumstances is documented by at_risk_documentation; it carries
    no installments. An agreement is issued only when the borrower chooses an arrangement no later than notice_period_days
    calendar days after the arrangement record opened. Those days are counted as calendar days starting the day
    after the opened_date, and a choice made on the last counted day still qualifies. The monthly installment is
    the arrearage_balance divided by the plan''s term, rounded up to the cent, with the final installment adjusted
    to the remaining arrearage; the first installment falls due on installment_due_day of the month after the agreement
    is signed, per first_installment_rule. No installment arrangement is offered for replan_after_default_months
    months after an earlier arrangement on the loan was referred for an uncured default. Installments are paid only
    under arrangements whose installments_required is true, and are rounded per installment_rounding; a hardship
    review per financial_hardship_review, supported by hardship_documentation, may move the borrower to another
    offered plan.'
  eligibility:
  - id: chosen_within_notice
    applies_to:
    - propcharge_agreement_issued
    kind: time
    condition: An agreement is issued only when the borrower chooses an arrangement no later than notice_period_days
      calendar days after the arrangement record opened.
    evidence_fields:
    - propcharge_plans.opened_date
    - propcharge_plans.propcharge_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.propcharge_plan_id
      action_bindings:
        propcharge_plans.propcharge_plan_id: propcharge_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the arrangement record opened
      anchor_source: propcharge_plans.opened_date
      relation: not_after
      duration_source: variants.notice_period_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the opened_date, and a choice
        made on the last counted day still qualifies.
      boundary: inclusive
  params:
    per_tier:
      Lump-Sum Repayment:
        plan_term_months: =plan_term_months
        arrearage_band_min: =arrearage_band_min
        arrearage_band_max: =arrearage_band_max
      Repayment Plan - 12 Months:
        plan_term_months: =plan_term_months
        arrearage_band_min: =arrearage_band_min
        arrearage_band_max: =arrearage_band_max
      Repayment Plan - 24 Months:
        plan_term_months: =plan_term_months
        arrearage_band_min: =arrearage_band_min
        arrearage_band_max: =arrearage_band_max
      Repayment Plan - 36 Months:
        plan_term_months: =plan_term_months
        arrearage_band_min: =arrearage_band_min
        arrearage_band_max: =arrearage_band_max
      Repayment Plan - 60 Months:
        plan_term_months: =plan_term_months
        arrearage_band_min: =arrearage_band_min
        arrearage_band_max: =arrearage_band_max
      At-Risk Extension:
        plan_term_months: =plan_term_months
        arrearage_band_min: =arrearage_band_min
        arrearage_band_max: =arrearage_band_max
- id: propcharge_signature
  subject:
  - propcharge_agreement_signed
  rule: An arrangement starts only when every borrower on the loan signs the agreement; only the borrowers can sign,
    and the servicer records their own signed agreement. The agreement takes effect only when it is signed no later
    than agreement_signature_days calendar days after it was issued. Those days are counted as calendar days starting
    the day after the agreement_issued_date, and a signature on the last counted day still qualifies; an agreement
    not signed in time lapses and the record is referred unless the arrearage has been repaid.
  eligibility:
  - id: signed_in_time
    applies_to:
    - propcharge_agreement_signed
    kind: time
    condition: The agreement takes effect only when it is signed no later than agreement_signature_days calendar
      days after it was issued.
    evidence_fields:
    - propcharge_plans.agreement_issued_date
    - propcharge_plans.propcharge_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.propcharge_plan_id
      action_bindings:
        propcharge_plans.propcharge_plan_id: propcharge_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: it was issued
      anchor_source: propcharge_plans.agreement_issued_date
      relation: not_after
      duration_source: variants.agreement_signature_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the agreement_issued_date, and
        a signature on the last counted day still qualifies; an agreement not signed in time lapses and the record
        is referred unless the arrearage has been repaid.
      boundary: inclusive
- id: propcharge_evt_repayment
  subject:
  - propcharge_repayment
  - propcharge_completed
  rule: Repayments are accepted by any of accepted_payment_methods without penalty, per prepayment_penalty_pct,
    and are applied to the oldest advance first, per installment_application_order; each repayment reduces the loan
    balance as a prepayment, per repayment_application. Each payment is recorded once, identified by its payment_reference.
    A payment smaller than the installment is applied but the installment still counts as missed if not completed
    by the end of its grace period, per partial_payment_handling; a larger payment reduces the arrearage and shortens
    the final installments, per overpayment_handling. The record is completed on the day the arrearage_balance reaches
    0.00, per completion_basis, whether in the notice period or during an arrangement, and a completion letter follows
    within completion_letter_days calendar days. Each repayment is identified by its repayment_receipt_reference;
    where autopay_available is true installments may be drafted by ach on autopay_draft_day, and a reminder goes
    out installment_reminder_days calendar days before each due day.
  eligibility:
  - id: payment_once
    applies_to:
    - propcharge_repayment
    kind: dedup
    condition: Each payment is recorded once, identified by its payment_reference.
    evidence_fields:
    - propcharge_transactions.payment_reference
    - propcharge_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_transactions.payment_reference
      action_bindings:
        propcharge_transactions.payment_reference: payment_reference
    dedup_contract:
      table: propcharge_transactions
      mode: separate_record
      object_bindings:
        payment_reference: payment_reference
      duplicate_filters:
        event_type:
        - propcharge_repayment
      distinct_fields: []
- id: propcharge_default
  subject:
  - propcharge_installment_missed
  - propcharge_defaulted
  - propcharge_default_cured
  rule: An installment counts as missed when it is not fully paid by the end of installment_grace_days calendar
    days after its due day, and each installment is recorded as missed at most once. An arrangement defaults on
    the day propcharge_msr_missed_installments reaches the plan's missed_installments_to_default, and a default
    notice is sent within default_notice_days calendar days. A default is cured only when every missed installment
    is paid no later than default_cure_days calendar days after the default date. Those days are counted as calendar
    days starting the day after the default_date, and payment on the last counted day still cures; an uncured default
    is referred. Arrangements without installments, the Lump-Sum Repayment and the At-Risk Extension, never default
    through missed installments.
  eligibility:
  - id: missed_once
    applies_to:
    - propcharge_installment_missed
    kind: dedup
    condition: An installment counts as missed when it is not fully paid by the end of installment_grace_days calendar
      days after its due day, and each installment is recorded as missed at most once.
    evidence_fields:
    - propcharge_transactions.propcharge_plan_id
    - propcharge_transactions.installment_number
    - propcharge_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_transactions.propcharge_plan_id
        - propcharge_transactions.installment_number
      action_bindings:
        propcharge_transactions.propcharge_plan_id: propcharge_plan_id
        propcharge_transactions.installment_number: installment_number
    dedup_contract:
      table: propcharge_transactions
      mode: separate_record
      object_bindings:
        propcharge_plan_id: propcharge_plan_id
        installment_number: installment_number
      duplicate_filters:
        event_type:
        - propcharge_installment_missed
      distinct_fields: []
  - id: cure_in_time
    applies_to:
    - propcharge_default_cured
    kind: time
    condition: A default is cured only when every missed installment is paid no later than default_cure_days calendar
      days after the default date.
    evidence_fields:
    - propcharge_plans.default_date
    - propcharge_plans.propcharge_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.propcharge_plan_id
      action_bindings:
        propcharge_plans.propcharge_plan_id: propcharge_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the default date
      anchor_source: propcharge_plans.default_date
      relation: not_after
      duration_source: variants.default_cure_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the default_date, and payment
        on the last counted day still cures; an uncured default is referred.
      boundary: inclusive
  params:
    per_tier:
      Lump-Sum Repayment:
        missed_installments_to_default: =missed_installments_to_default
        default_cure_days: =default_cure_days
      Repayment Plan - 12 Months:
        missed_installments_to_default: =missed_installments_to_default
        default_cure_days: =default_cure_days
      Repayment Plan - 24 Months:
        missed_installments_to_default: =missed_installments_to_default
        default_cure_days: =default_cure_days
      Repayment Plan - 36 Months:
        missed_installments_to_default: =missed_installments_to_default
        default_cure_days: =default_cure_days
      Repayment Plan - 60 Months:
        missed_installments_to_default: =missed_installments_to_default
        default_cure_days: =default_cure_days
      At-Risk Extension:
        missed_installments_to_default: =missed_installments_to_default
        default_cure_days: =default_cure_days
  measures:
  - propcharge_msr_missed_installments
- id: propcharge_referral
  subject:
  - propcharge_referred
  rule: A record in its notice period is referred only when more than notice_period_days calendar days have passed
    since it opened with the arrearage unpaid and no arrangement chosen. Those days are counted as calendar days
    starting the day after the opened_date, and the record is not referred on the last counted day itself. A record
    is also referred when its agreement was not signed in time, or when its default was not cured in time; an active
    At-Risk Extension holds off referral, per at_risk_suspends_referral. Referral opens a Property Charge Default
    maturity case on the loan, per referral_target. On a HECM loan every arrangement, default and referral is reported
    to HUD as a property charge loss mitigation step, per hud_reporting_required.
  eligibility:
  - id: notice_period_over
    applies_to:
    - propcharge_referred
    kind: time
    condition: A record in its notice period is referred only when more than notice_period_days calendar days have
      passed since it opened with the arrearage unpaid and no arrangement chosen.
    evidence_fields:
    - propcharge_plans.opened_date
    - propcharge_plans.propcharge_plan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.propcharge_plan_id
      action_bindings:
        propcharge_plans.propcharge_plan_id: propcharge_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: it opened
      anchor_source: propcharge_plans.opened_date
      relation: not_before
      duration_source: variants.notice_period_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the opened_date, and the record
        is not referred on the last counted day itself.
      boundary: exclusive
- id: propcharge_at_risk
  subject:
  - propcharge_at_risk_review
  rule: An At-Risk Extension is reviewed every at_risk_review_months months from the date the agreement was signed,
    once per review year. It is renewed only when the youngest borrower still occupies the home and the documented
    critical circumstance continues; otherwise the review outcome is not_renewed and the record is referred. The
    At-Risk Extension carries at_risk_installment_amount monthly and the borrower must keep paying new charges,
    per current_charges_required.
  eligibility:
  - id: review_once
    applies_to:
    - propcharge_at_risk_review
    kind: dedup
    condition: An At-Risk Extension is reviewed every at_risk_review_months months from the date the agreement was
      signed, once per review year.
    evidence_fields:
    - propcharge_transactions.propcharge_plan_id
    - propcharge_transactions.review_year
    - propcharge_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_transactions.propcharge_plan_id
        - propcharge_transactions.review_year
      action_bindings:
        propcharge_transactions.propcharge_plan_id: propcharge_plan_id
        propcharge_transactions.review_year: review_year
    dedup_contract:
      table: propcharge_transactions
      mode: separate_record
      object_bindings:
        propcharge_plan_id: propcharge_plan_id
        review_year: review_year
      duplicate_filters:
        event_type:
        - propcharge_at_risk_review
      distinct_fields: []
