category: propcharge
display_name: Property Charge Advance Repayment
binding:
  holding_table: propcharge_plans
  event_tables:
  - propcharge_transactions
  status_field: status
  variant_field: variant_name
  quantity_fields:
    arrearage_balance: arrearage
lifecycle:
  states:
  - notice_period
  - pending_signature
  - active
  - completed
  - defaulted
  - referred
  transitions:
  - from: notice_period
    to: pending_signature
    by: agent
    means: The borrower chose a repayment arrangement and the agreement was issued for signature.
  - from: pending_signature
    to: active
    by: user
    means: Every borrower signed the repayment agreement.
  - from: notice_period
    to: completed
    by: agent
    means: The advances were repaid in full during the notice period.
  - from: active
    to: completed
    by: agent
    means: The arrangement's arrearage was repaid in full.
  - from: active
    to: defaulted
    by: agent
    means: The borrower missed the number of installments that defaults the arrangement.
  - from: defaulted
    to: active
    by: agent
    means: The missed installments were paid within the default cure period.
  - from: notice_period
    to: referred
    by: agent
    means: The notice period ended with the advances unpaid and no arrangement chosen.
  - from: pending_signature
    to: referred
    by: agent
    means: The agreement was not signed in time and the advances remained unpaid.
  - from: defaulted
    to: referred
    by: agent
    means: The default was not cured in time.
accounts:
- key: arrearage
  unit: USD
  meaning: Property-charge corporate advances the servicer paid on the borrower's behalf and the borrower has not
    yet repaid; held on the arrangement as arrearage_balance.
parameter_schema:
  notice_period_days: Calendar days after the arrangement record opened within which the borrower must repay in
    full or choose an arrangement
  advance_notice_days: Calendar days after a corporate advance within which the borrower is notified of it
  advance_charge_types: Charges Cedarline advances when unpaid (list of charge_type values)
  hoa_dues_advanced: Whether delinquent homeowners-association dues are advanced (boolean)
  plan_term_months: Number of monthly installments in the arrangement (0 where no installments)
  arrearage_band_min: Smallest arrearage at agreement issue the arrangement is offered for (USD)
  arrearage_band_max: Largest arrearage at agreement issue the arrangement is offered for (USD; 0.00 means no upper
    limit)
  term_selection_rule: How the installment arrangement is chosen (code)
  borrower_may_elect_shorter_term: Whether the borrower may choose a shorter plan than the band assigns (boolean)
  installment_rounding: How the monthly installment is rounded (rule code)
  installment_due_day: Calendar day of the month each installment is due (0 where no installments)
  first_installment_rule: When the first installment falls due (code)
  installment_grace_days: Calendar days after the due day before an unpaid installment counts as missed (0 where
    no installments)
  missed_installments_to_default: Missed installments, counted over the life of the arrangement, that default it
    (0 where no installments)
  default_cure_days: Calendar days after default within which paying every missed installment restores the arrangement
    (0 where no installments)
  agreement_signature_days: Calendar days after the agreement is issued within which every borrower must sign
  lump_sum_due_days: Calendar days after the arrangement record opened within which a lump-sum repayment must arrive
    (0 where not lump-sum)
  at_risk_min_age: Minimum age of the youngest borrower for an at-risk extension (years; 0 where not applicable)
  at_risk_circumstances: Critical circumstances that qualify for an at-risk extension (list; empty where not applicable)
  at_risk_review_months: Months between at-risk extension reviews (0 where not applicable)
  at_risk_documentation: Evidence needed for an at-risk extension (code)
  installments_required: Whether monthly installments are paid under the arrangement (boolean)
  recast_on_new_advance: Whether a new advance during an active arrangement is added and the installment recomputed
    over the remaining term (boolean)
  current_charges_required: Whether the borrower must keep paying new property charges on time during the arrangement
    (boolean)
  prepayment_penalty_pct: Penalty for repaying the arrearage early (percent)
  partial_payment_handling: How a payment smaller than the installment is treated (code)
  overpayment_handling: How a payment larger than the installment is treated (code)
  accepted_payment_methods: Ways repayments may be made (list)
  replan_after_default_months: Months after a referred default during which no new arrangement is offered
  max_arrangements_per_loan: Largest number of open arrangements on one loan (integer)
  repayment_application: How repayments reach the loan (code)
  referral_target: Where an unresolved arrangement is referred (code)
  at_risk_suspends_referral: Whether an active at-risk extension holds off referral (boolean)
  notice_channels: How advance and default notices are sent (list)
  default_notice_days: Calendar days after default within which the default notice is sent
  completion_letter_days: Calendar days after completion within which the completion letter is sent
  installment_reminder_days: Calendar days before each due day on which a reminder is sent (0 where no installments)
  autopay_available: Whether installments may be drafted automatically by ach (boolean)
  autopay_draft_day: Calendar day installments are drafted when autopay is used (0 where unavailable)
  financial_hardship_review: Whether a hardship review may shorten or lengthen the band-assigned term within the
    offered plans (boolean)
  hardship_documentation: Evidence for a hardship review (code)
  loan_programs_covered: Loan programs the arrangement applies to (list)
  open_from_first_advance: Whether an arrangement record opens on the first unrepaid advance (boolean)
  installment_application_order: Order in which a payment is applied within the arrangement (ordered list)
  completion_basis: When an arrangement is complete (code)
  setaside_shortfall_advances_included: Whether a corporate advance made because a set-aside was short is included
    (boolean)
  repayment_receipt_reference: Reference recorded for each repayment (code)
  hud_reporting_required: Whether, on a HECM loan, the arrangement is reported to HUD as a property charge loss
    mitigation option (boolean)
  at_risk_installment_amount: Monthly installment during an at-risk extension (USD)
