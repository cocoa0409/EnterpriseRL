- id: residency_closure
  subject:
  - residency_closed
  rule: A profile is closed for loan termination only when the monitored HECM loan's status is paid_in_full, claim_terminated
    or rescinded, or the monitored Summit loan's status is paid_in_full or liquidated. The closed_date is the loan's
    terminated_date, or the date of death when the profile closes because the last certifying occupant died with
    no deferral. A loan that is merely due and payable keeps its profile open, because occupancy still governs a
    cure and the deferral rules until the loan ends. A closed profile receives no notices, inspections or check-ins.
  eligibility:
  - id: loan_ended
    applies_to:
    - residency_closed
    kind: authorization
    condition: A profile is closed for loan termination only when the monitored HECM loan's status is paid_in_full,
