category: residency
display_name: Occupancy and Residency Certification
binding:
  holding_table: residency_profiles
  event_tables:
  - residency_events
  intake_tables:
  - residency_submissions
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - pending_first_certification
  - current
  - overdue
  - absence_monitoring
  - nonoccupancy_confirmed
  - closed
  transitions:
  - from: pending_first_certification
    to: current
    by: agent
    means: The first annual occupancy certification was completed.
  - from: pending_first_certification
    to: overdue
    by: system
    means: The first certification was not completed within the response grace period.
  - from: current
    to: overdue
    by: system
    means: An annual certification was not completed within the response grace period.
  - from: overdue
    to: current
    by: agent
    means: The overdue certification was completed.
  - from: pending_first_certification
    to: absence_monitoring
    by: agent
    means: A health-care absence was reported and monitoring began.
  - from: current
    to: absence_monitoring
    by: agent
    means: A health-care absence was reported and monitoring began.
  - from: overdue
    to: absence_monitoring
    by: agent
    means: A health-care absence was reported for an overdue profile and monitoring began.
  - from: absence_monitoring
    to: current
    by: agent
    means: The borrower returned home and resumed occupancy before the absence limit.
  - from: absence_monitoring
    to: nonoccupancy_confirmed
    by: agent
    means: The health-care absence exceeded the consecutive-month limit.
  - from: overdue
    to: nonoccupancy_confirmed
    by: agent
    means: An occupancy inspection or the borrower's own written statement confirmed that no borrower occupies the
      home.
  - from: current
    to: nonoccupancy_confirmed
    by: agent
    means: The borrower's own written statement or an inspection confirmed a permanent move.
  - from: nonoccupancy_confirmed
    to: current
    by: agent
    means: The related maturity case was cured because a borrower resumed occupancy and certified.
  - from: pending_first_certification
    to: closed
    by: agent
    means: The loan ended or the last certifying occupant died.
  - from: current
    to: closed
    by: agent
    means: The loan ended or the last certifying occupant died.
  - from: overdue
    to: closed
    by: agent
    means: The loan ended or the last certifying occupant died.
  - from: absence_monitoring
    to: closed
    by: agent
    means: The loan ended or the last certifying occupant died.
  - from: nonoccupancy_confirmed
    to: closed
    by: agent
    means: The loan ended.
accounts: []
parameter_schema:
  certification_frequency_months: Interval between annual occupancy certifications (calendar months)
  certification_due_basis: How each annual due date is set (code)
  request_lead_days: Calendar days before the due date on which the certification request is mailed
  early_certification_days: Earliest point, in calendar days before the due date, from which a signed certification
    counts for that cycle
  second_notice_after_due_days: Calendar days after the due date on which a second notice is mailed if the certification
    is incomplete
  final_notice_after_due_days: Calendar days after the due date on which a final notice is mailed if the certification
    is incomplete
  response_grace_days: Calendar days after the due date after which an incomplete certification makes the profile
    overdue
  required_certifiers: Who must sign the annual certification (list of certifier roles)
  min_signatures: Number of distinct signers needed to complete one cycle (integer)
  missing_signer_cure_days: Calendar days after a partial certification within which the missing signature may be
    supplied without a new request
  phone_certification_permitted: Whether a recorded phone certification by the signer counts (boolean)
  portal_certification_permitted: Whether a servicing-portal certification counts (boolean)
  mail_certification_permitted: Whether a signed paper certification returned by mail counts (boolean)
  supporting_document: Document that must be on file before the certification counts (code)
  supporting_document_refresh_months: Months after which the supporting document must be resubmitted (0 where none
    is required)
  inspection_order_days_after_overdue: Calendar days after a profile becomes overdue within which an occupancy inspection
    is ordered
  occupancy_inspection_fee: Fee for one occupancy inspection, charged to the loan balance (USD)
  inspection_fee_chargeable: Whether occupancy inspection fees are charged to the borrower's loan (boolean)
  max_inspections_per_cycle: Largest number of occupancy inspections ordered within one certification cycle (integer)
  returned_mail_triggers_inspection: Whether a certification request returned undeliverable leads to an inspection
    order (boolean)
  vacancy_report_triggers_inspection: Whether a utility shut-off or vacancy report from a third party leads to an
    inspection order (boolean)
  inspection_turnaround_days: Calendar days the inspection vendor has to return a result
  health_absence_max_consecutive_months: Longest consecutive absence for physical or mental illness before the home
    stops counting as the principal residence (calendar months)
  health_absence_checkin_days: Interval in calendar days between contacts during a health-care absence
  health_absence_documentation: Evidence required to open health-care absence monitoring (code)
  absence_start_basis: Which date starts a health-care absence (code)
  non_health_absence_max_days: Longest absence for reasons other than illness in a 12-month period before the home
    stops counting as the principal residence (calendar days)
  caregiver_occupancy_counts: Whether a caregiver or relative living in the home satisfies occupancy for the borrower
    (boolean)
  nbs_occupancy_required: Whether the eligible non-borrowing spouse must also occupy the home for the profile to
    stay current (boolean)
  nbs_marriage_attestation_required: Whether the certification must attest that the non-borrowing spouse remained
    married to the borrower (boolean)
  trust_beneficiary_occupancy_required: Whether a living-trust beneficiary who is a borrower must occupy the home
    (boolean)
  reclassify_on_borrower_death: Plan the profile moves to when one certifying borrower dies and the loan continues
    (official plan name, or not_applicable)
  death_documentation: Evidence required to record a borrower's death (code)
  death_report_channel: Who may report a death (list of profile types)
  successor_confirmation_days: Calendar days within which a potential successor in interest is told what documents
    confirm their status
  nonoccupancy_evidence: Records that may confirm non-occupancy (list of codes)
  nonoccupancy_caller_statement_sufficient: Whether a third party's oral statement alone can confirm non-occupancy
    (boolean)
  cure_by_reoccupancy_permitted: Whether a confirmed non-occupancy is reversed when a borrower resumes occupancy
    and certifies before the loan is due and payable (boolean)
  seasonal_second_home_allowed: Whether the borrower may treat another home as principal residence for part of the
    year (boolean)
  multi_unit_owner_unit_required: Whether on a two-to-four-unit property the borrower must occupy one unit (boolean)
  request_channels: Channels the certification request is sent through (list)
  certification_year_basis: How certification_year is assigned to a cycle (code)
  email_reminder_days: Calendar days before the due date on which an email reminder is sent where an email is on
    file
  skip_trace_days: Calendar days after returned mail within which a new address search is completed
  close_on_loan_termination: Whether the profile closes when the loan is paid in full, claim-terminated or rescinded
    (boolean)
  absence_suspends_annual_request: Whether annual certification requests are replaced by absence check-ins during
    a health-care absence (boolean)
  inspection_result_codes: Outcomes an occupancy inspection may return (list)
  unable_to_determine_reinspect: Whether an unable_to_determine inspection result leads to a second inspection within
    the cycle (boolean)
