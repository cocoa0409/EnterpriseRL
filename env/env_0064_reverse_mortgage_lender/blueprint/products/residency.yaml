events:
- type: residency_enrolled
  target: residency_profiles
  mutation: create
  meaning: The funded loan is enrolled in annual occupancy certification under the plan matching its household.
  grain: One row per loan.
  fields:
    residency_profile_id: Profile id.
    customer_id: Primary borrower.
    hecm_loan_id: HECM loan, if any.
    jumbo_loan_id: Summit loan, if any.
    loan_program: hecm or summit.
    nbs_customer_id: Eligible non-borrowing spouse, if any.
    representative_customer_id: Representative signer, if any.
    variant_name: Certification plan.
    status: Always pending_first_certification.
    enrolled_date: Funding date.
    certification_due_date: First closing anniversary.
  triggers: []
- type: residency_notice_sent
  target: residency_events
  meaning: A certification request, second notice or final notice for a cycle is mailed.
  grain: One row per cycle per notice type.
  distinguish_by:
  - certification_year
  - notice_type
  fields:
    effective_date: Mailing date.
    certification_year: Cycle.
    notice_type: Which notice.
    loan_program: Loan program.
  triggers: []
- type: residency_certification_recorded
  target: residency_events
  meaning: One signer's occupancy certification for a cycle is accepted and recorded.
  grain: One row per cycle per signer.
  distinguish_by:
  - certification_year
  - certifier_customer_id
  fields:
    effective_date: Signature date.
    certification_year: Cycle.
    certifier_customer_id: Signer.
    certification_method: mail, servicing_portal or phone.
    residency_submission_id: The certification submission.
    loan_program: Loan program.
  triggers: []
- type: residency_cycle_completed
  target: residency_profiles
  mutation: update
  meaning: A cycle's required signatures are complete; the completion date is recorded and the next due date set.
  grain: One row per completed cycle.
  fields:
    last_certified_date: Date the last required signature was recorded.
    certification_due_date: Next due date.
  triggers: []
- type: residency_certified
  target: residency_profiles
  mutation:
    transition:
    - from: pending_first_certification
      to: current
    - from: overdue
      to: current
  meaning: Completing the first or an overdue cycle makes the profile current.
  grain: One row per transition.
  fields:
    status: Set to current.
  triggers: []
- type: residency_marked_overdue
  target: residency_profiles
  mutation:
    transition:
    - from: pending_first_certification
      to: overdue
    - from: current
      to: overdue
  meaning: A cycle remained incomplete past the response grace period.
  grain: One row per transition.
  fields:
    status: Set to overdue.
  triggers: []
- type: residency_inspection_ordered
  target: residency_events
  meaning: An occupancy inspection of the property is ordered from the inspection vendor.
  grain: One row per inspection order.
  distinguish_by:
  - certification_year
  - inspection_reason
  - effective_date
  fields:
    effective_date: Order date.
    certification_year: Cycle.
    inspection_reason: Why ordered.
    inspection_fee: Fee of this inspection.
    loan_program: Loan program.
  triggers:
  - event: hecm:hecm_advance_posting
    when:
      loan_program: hecm
    map:
      amount: inspection_fee
      effective_date: effective_date
      advance_type: occupancy_inspection_fee
      source_txn_ref: residency_event_id
      disbursement_method: not_applicable
  - event: jumbo:jumbo_advance_posting
    when:
      loan_program: summit
    map:
      amount: inspection_fee
      effective_date: effective_date
      advance_type: inspection_fee
      source_txn_ref: residency_event_id
- type: residency_inspection_result
  target: residency_events
  meaning: The inspector's finding for an inspection order is recorded.
  grain: One row per inspection order answered.
  distinguish_by:
  - source_event_ref
  fields:
    effective_date: Result date.
    certification_year: Cycle.
    inspection_outcome: Finding.
    source_event_ref: The inspection order.
    loan_program: Loan program.
  triggers: []
- type: residency_absence_started
  target: residency_profiles
  mutation:
    transition:
    - from: pending_first_certification
      to: absence_monitoring
    - from: current
      to: absence_monitoring
    - from: overdue
      to: absence_monitoring
  meaning: A documented health-care absence of the occupying borrower begins monitoring.
  grain: One row per transition.
  fields:
    status: Set to absence_monitoring.
    absence_start_date: Facility admission date.
  triggers: []
- type: residency_absence_checkin
  target: residency_events
  meaning: A scheduled contact during a health-care absence confirms the borrower's situation and intent to return.
  grain: One row per check-in of the current absence.
  distinguish_by:
  - checkin_sequence
  - effective_date
  fields:
    effective_date: Check-in date.
    checkin_sequence: Sequence within the absence.
    loan_program: Loan program.
  triggers: []
- type: residency_returned_home
  target: residency_profiles
  mutation:
    transition:
      from: absence_monitoring
      to: current
  meaning: The borrower returned home within the absence limit and occupancy resumed.
  grain: One row per transition.
  fields:
    status: Set to current.
    absence_start_date: Cleared to empty.
  triggers: []
- type: residency_nonoccupancy_confirmed
  target: residency_profiles
  mutation:
    transition:
    - from: absence_monitoring
      to: nonoccupancy_confirmed
    - from: overdue
      to: nonoccupancy_confirmed
    - from: current
      to: nonoccupancy_confirmed
  meaning: Records confirm the home is no longer any borrower's principal residence.
  grain: One row per transition.
  fields:
    status: Set to nonoccupancy_confirmed.
    nonoccupancy_basis: Basis of the confirmation.
    nonoccupancy_date: Confirmation date.
  triggers:
  - event: maturity:maturity_case_opened
    when:
      nonoccupancy_basis: health_absence_limit_exceeded
    map:
      variant_name: Extended Health-Care Absence
      opened_date: nonoccupancy_date
  - event: maturity:maturity_case_opened
    when:
      nonoccupancy_basis: not_principal_residence
    map:
      variant_name: Principal Residence Change
      opened_date: nonoccupancy_date
- type: residency_reoccupied
  target: residency_profiles
  mutation:
    transition:
      from: nonoccupancy_confirmed
      to: current
  meaning: A borrower resumed occupancy and certified, curing the confirmed non-occupancy before the loan became
    due and payable.
  grain: One row per transition.
  fields:
    status: Set to current.
    nonoccupancy_basis: Reset to not_applicable.
    nonoccupancy_date: Cleared to empty.
  triggers: []
- type: residency_reclassified
  target: residency_profiles
  mutation: update
  meaning: After a certifying borrower's death the profile moves to the plan matching the remaining household.
  grain: One row per reclassification.
  fields:
    variant_name: New certification plan.
    nbs_customer_id: Eligible non-borrowing spouse, if the new plan needs one.
    certification_due_date: Due date of the open cycle (unchanged).
  triggers: []
- type: residency_closed
  target: residency_profiles
  mutation:
    transition:
    - from: pending_first_certification
      to: closed
    - from: current
      to: closed
    - from: overdue
      to: closed
    - from: absence_monitoring
      to: closed
    - from: nonoccupancy_confirmed
      to: closed
  meaning: The profile closes because the loan ended or no certifying occupant remains.
  grain: One row per transition.
  fields:
    status: Set to closed.
    closed_date: Closing date.
  triggers: []
measures:
- id: residency_msr_cycle_signatures
  window: 'The open certification cycle: rows whose certification_year equals the calendar year of the profile''s
    certification_due_date.'
  measure: Count of distinct certifier_customer_id over residency_certification_recorded rows of the profile in
    the window.
- id: residency_msr_cycle_inspections
  window: 'The open certification cycle: rows whose certification_year equals the calendar year of the profile''s
    certification_due_date.'
  measure: Count of residency_inspection_ordered rows of the profile in the window.
- id: residency_msr_absence_checkins
  window: From the profile's absence_start_date (inclusive) to the handling date (inclusive).
  measure: Count of residency_absence_checkin rows of the profile with effective_date in the window.
policies:
- id: residency_agg_multi_holding
  subject:
  - residency_enrolled
  rule: 'Each funded reverse mortgage is enrolled in exactly one certification profile, and because a borrower can
    hold only one reverse mortgage on a principal residence, a borrower holds at most one open profile. A profile
    is enrolled only when the borrower has no other profile whose status is pending_first_certification, current,
    overdue, absence_monitoring or nonoccupancy_confirmed. The plan is chosen from the household on the loan record,
    and when more than one plan''s entry conditions hold the first match in this order applies: Deferral Period
    Certification, Authorized Representative Certification, Living Trust Certification, Non-Borrowing Spouse Household
    Certification, Joint Borrower Certification, Standard Annual Certification. The first certification_due_date
    is the first anniversary of the loan''s closing date, per certification_due_basis.'
  eligibility:
  - id: one_open_profile
    applies_to:
    - residency_enrolled
    kind: dedup
    condition: A profile is enrolled only when the borrower has no other profile whose status is pending_first_certification,
      current, overdue, absence_monitoring or nonoccupancy_confirmed.
    evidence_fields:
    - residency_profiles.customer_id
    - residency_profiles.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_profiles.customer_id
      action_bindings:
        residency_profiles.customer_id: customer_id
    dedup_contract:
      table: residency_profiles
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending_first_certification
        - current
        - overdue
        - absence_monitoring
        - nonoccupancy_confirmed
      distinct_fields: []
  params:
    max_per_customer: 1
- id: residency_evt_notices
  subject:
  - residency_notice_sent
  rule: For each cycle the certification request (annual_request) is mailed request_lead_days calendar days before
    the certification_due_date through the plan's request_channels, and an email reminder follows email_reminder_days
    before the due date where an email is on file. If the cycle is still incomplete, a second_notice is mailed second_notice_after_due_days
    calendar days after the due date and a final_notice final_notice_after_due_days calendar days after it. Certification
    notices are mailed only while the profile status is pending_first_certification, current or overdue. While a
    health-care absence is being monitored, annual notices are replaced by absence check-ins per absence_suspends_annual_request,
    and no notice is mailed for a closed profile or one whose non-occupancy is confirmed. Each notice type is mailed
    at most once per cycle, and certification_year is the calendar year of the cycle's due date. The certification_year
    of every notice and entry follows certification_year_basis.
  eligibility:
  - id: notice_states
    applies_to:
    - residency_notice_sent
    kind: state
    condition: Certification notices are mailed only while the profile status is pending_first_certification, current
      or overdue.
    evidence_fields:
    - residency_profiles.status
    - residency_profiles.residency_profile_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_profiles.residency_profile_id
      action_bindings:
        residency_profiles.residency_profile_id: residency_profile_id
    state_contract:
      field: residency_profiles.status
      allowed:
      - pending_first_certification
      - current
      - overdue
  - id: notice_once
    applies_to:
    - residency_notice_sent
    kind: dedup
    condition: Each notice type is mailed at most once per cycle, and certification_year is the calendar year of
      the cycle's due date.
    evidence_fields:
    - residency_events.residency_profile_id
    - residency_events.certification_year
    - residency_events.notice_type
    - residency_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_events.residency_profile_id
        - residency_events.certification_year
        - residency_events.notice_type
      action_bindings:
        residency_events.residency_profile_id: residency_profile_id
        residency_events.certification_year: certification_year
        residency_events.notice_type: notice_type
    dedup_contract:
      table: residency_events
      mode: separate_record
      object_bindings:
        residency_profile_id: residency_profile_id
        certification_year: certification_year
        notice_type: notice_type
      duplicate_filters:
        event_type:
        - residency_notice_sent
      distinct_fields: []
- id: residency_evt_certification
  subject:
  - residency_certification_recorded
  - residency_cycle_completed
  - residency_certified
  rule: An occupancy certification submission is accepted only when its signer holds one of the plan's required_certifiers
    roles, its channel is permitted for the plan (phone_certification_permitted, portal_certification_permitted,
    mail_certification_permitted), the plan's supporting_document is on file and not older than supporting_document_refresh_months,
    and it is signed no earlier than early_certification_days calendar days before the cycle's due date; otherwise
    it is rejected with reason signer_not_required, channel_not_accepted, supporting_document_missing or outside_certification_window
    respectively. A certification is recorded only from an occupancy certification submission on file whose review
    status is accepted. Each signer is recorded once per cycle, with the signature date as effective_date and the
    cycle's certification_year. A cycle is complete when residency_msr_cycle_signatures reaches the plan's min_signatures;
    a signer missing from a partial certification may sign within missing_signer_cure_days calendar days without
    a new request. When a cycle completes, last_certified_date becomes the date of the last required signature and
    certification_due_date moves forward certification_frequency_months months to the next closing anniversary;
    a profile that was pending_first_certification or overdue becomes current. A certification never counts if it
    states that no borrower lives in the home; such a statement is handled as non-occupancy. A Non-Borrowing Spouse
    Household or Deferral Period certification also attests that the non-borrowing spouse remained married to the
    borrower, per nbs_marriage_attestation_required, and stays current only while that spouse occupies the home,
    per nbs_occupancy_required; a Living Trust certification needs a borrower-beneficiary in occupancy, per trust_beneficiary_occupancy_required.
    No plan allows a seasonal or second home to count as the principal residence, per seasonal_second_home_allowed,
    and on a two-to-four-unit property a borrower must occupy one unit, per multi_unit_owner_unit_required.
  eligibility:
  - id: accepted_submission
    applies_to:
    - residency_certification_recorded
    kind: authorization
    condition: A certification is recorded only from an occupancy certification submission on file whose review
      status is accepted.
    evidence_fields:
    - residency_submissions.residency_submission_id
    - residency_submissions.submission_type
    - residency_submissions.review_status
    - residency_submissions.subject_customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_submissions.residency_submission_id
      action_bindings:
        residency_submissions.residency_submission_id: residency_submission_id
  - id: signer_once
    applies_to:
    - residency_certification_recorded
    kind: dedup
    condition: Each signer is recorded once per cycle, with the signature date as effective_date and the cycle's
      certification_year.
    evidence_fields:
    - residency_events.residency_profile_id
    - residency_events.certification_year
    - residency_events.certifier_customer_id
    - residency_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_events.residency_profile_id
        - residency_events.certification_year
        - residency_events.certifier_customer_id
      action_bindings:
        residency_events.residency_profile_id: residency_profile_id
        residency_events.certification_year: certification_year
        residency_events.certifier_customer_id: certifier_customer_id
    dedup_contract:
      table: residency_events
      mode: separate_record
      object_bindings:
        residency_profile_id: residency_profile_id
        certification_year: certification_year
        certifier_customer_id: certifier_customer_id
      duplicate_filters:
        event_type:
        - residency_certification_recorded
      distinct_fields: []
  params:
    per_tier:
      Standard Annual Certification:
        min_signatures: =min_signatures
        phone_certification_permitted: =phone_certification_permitted
        portal_certification_permitted: =portal_certification_permitted
        supporting_document: =supporting_document
      Joint Borrower Certification:
        min_signatures: =min_signatures
        phone_certification_permitted: =phone_certification_permitted
        portal_certification_permitted: =portal_certification_permitted
        supporting_document: =supporting_document
      Non-Borrowing Spouse Household Certification:
        min_signatures: =min_signatures
        phone_certification_permitted: =phone_certification_permitted
        portal_certification_permitted: =portal_certification_permitted
        supporting_document: =supporting_document
      Deferral Period Certification:
        min_signatures: =min_signatures
        phone_certification_permitted: =phone_certification_permitted
        portal_certification_permitted: =portal_certification_permitted
        supporting_document: =supporting_document
      Living Trust Certification:
        min_signatures: =min_signatures
        phone_certification_permitted: =phone_certification_permitted
        portal_certification_permitted: =portal_certification_permitted
        supporting_document: =supporting_document
      Authorized Representative Certification:
        min_signatures: =min_signatures
        phone_certification_permitted: =phone_certification_permitted
        portal_certification_permitted: =portal_certification_permitted
        supporting_document: =supporting_document
  formula:
    cycle_complete: residency_msr_cycle_signatures >= min_signatures
  measures:
  - residency_msr_cycle_signatures
- id: residency_overdue_inspection
  subject:
  - residency_marked_overdue
  - residency_inspection_ordered
  - residency_inspection_result
  rule: A profile becomes overdue only when more than response_grace_days calendar days have passed since the cycle's
    due date without the cycle being complete. Those days are counted as calendar days starting the day after the
    certification_due_date, so the profile is still not overdue on the last grace day itself. Within inspection_order_days_after_overdue
    calendar days after a profile becomes overdue, an occupancy inspection is ordered with inspection_reason no_certification_response;
    an inspection is also ordered with inspection_reason returned_mail when a certification request comes back undeliverable
    and the skip trace finds no new address within skip_trace_days, per returned_mail_triggers_inspection, and with
    inspection_reason vacancy_report on a utility shut-off or vacancy report, per vacancy_report_triggers_inspection.
    No more than max_inspections_per_cycle inspections are ordered in one cycle, counted by residency_msr_cycle_inspections;
    a further trigger in the same cycle orders nothing. Each inspection carries occupancy_inspection_fee, which
    is added to the loan balance on the order date when inspection_fee_chargeable is true. An inspection result
    is recorded only against an inspection order on file for that profile that has no result yet. An occupied_by_borrower
    finding does not complete the cycle, which still needs the required signatures; a vacant or occupied_by_others
    finding is evidence for confirming non-occupancy; an unable_to_determine finding leads to a second inspection
    in the cycle when unable_to_determine_reinspect is true and the cycle limit allows. The vendor returns its finding
    within inspection_turnaround_days calendar days, and the finding is always one of inspection_result_codes.
  eligibility:
  - id: overdue_after_grace
    applies_to:
    - residency_marked_overdue
    kind: time
    condition: A profile becomes overdue only when more than response_grace_days calendar days have passed since
      the cycle's due date without the cycle being complete.
    evidence_fields:
    - residency_profiles.certification_due_date
    - residency_profiles.residency_profile_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_profiles.residency_profile_id
      action_bindings:
        residency_profiles.residency_profile_id: residency_profile_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the cycle's due date
      anchor_source: residency_profiles.certification_due_date
      relation: not_before
      duration_source: variants.response_grace_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the certification_due_date,
        so the profile is still not overdue on the last grace day itself.
      boundary: exclusive
  - id: result_for_open_order
    applies_to:
    - residency_inspection_result
    kind: dedup
    condition: An inspection result is recorded only against an inspection order on file for that profile that has
      no result yet.
    evidence_fields:
    - residency_events.source_event_ref
    - residency_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_events.source_event_ref
      action_bindings:
        residency_events.source_event_ref: source_event_ref
    dedup_contract:
      table: residency_events
      mode: separate_record
      object_bindings:
        source_event_ref: source_event_ref
      duplicate_filters:
        event_type:
        - residency_inspection_result
      distinct_fields: []
  measures:
  - residency_msr_cycle_inspections
- id: residency_health_absence
  subject:
  - residency_absence_started
  - residency_absence_checkin
  - residency_returned_home
  rule: A borrower who leaves home for a hospital, rehabilitation center, nursing home or assisted-living facility
    because of physical or mental illness keeps the home as principal residence for up to health_absence_max_consecutive_months
    consecutive months. Monitoring begins only on a health-care absence notice on file for the profile whose review
    status is accepted and which carries the facility admission letter required by health_absence_documentation.
    The absence_start_date is the facility admission date per absence_start_basis, not the date the notice was received;
    when another borrower or the eligible non-borrowing spouse of a Non-Borrowing Spouse Household plan still occupies
    the home, no monitoring is opened because occupancy continues. During monitoring a check-in is made every health_absence_checkin_days
    calendar days counted from the absence_start_date, numbered by residency_msr_absence_checkins plus one, and
    annual notices are suspended. Monitoring ends with the borrower's return only on an accepted return_home_notice
    dated before the absence limit is exceeded; the profile becomes current, the absence_start_date is cleared,
    and any cycle whose due date passed during the absence is due within response_grace_days of the return. A caregiver
    or relative living in the home never counts as occupancy for the absent borrower, per caregiver_occupancy_counts.
  eligibility:
  - id: absence_notice_accepted
    applies_to:
    - residency_absence_started
    kind: authorization
    condition: Monitoring begins only on a health-care absence notice on file for the profile whose review status
      is accepted and which carries the facility admission letter required by health_absence_documentation.
    evidence_fields:
    - residency_submissions.residency_submission_id
    - residency_submissions.submission_type
    - residency_submissions.review_status
    - residency_submissions.event_date
    - residency_submissions.document_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_submissions.residency_submission_id
      action_bindings:
        residency_submissions.residency_submission_id: residency_submission_id
  - id: checkin_once
    applies_to:
    - residency_absence_checkin
    kind: dedup
    condition: During monitoring a check-in is made every health_absence_checkin_days calendar days counted from
      the absence_start_date, numbered by residency_msr_absence_checkins plus one, and annual notices are suspended.
    evidence_fields:
    - residency_events.residency_profile_id
    - residency_events.checkin_sequence
    - residency_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_events.residency_profile_id
        - residency_events.checkin_sequence
      action_bindings:
        residency_events.residency_profile_id: residency_profile_id
        residency_events.checkin_sequence: checkin_sequence
    dedup_contract:
      table: residency_events
      mode: separate_record
      object_bindings:
        residency_profile_id: residency_profile_id
        checkin_sequence: checkin_sequence
      duplicate_filters:
        event_type:
        - residency_absence_checkin
      distinct_fields:
      - effective_date
  measures:
  - residency_msr_absence_checkins
- id: residency_nonoccupancy
  subject:
  - residency_nonoccupancy_confirmed
  - residency_reoccupied
  rule: 'Non-occupancy is confirmed only from the records listed in nonoccupancy_evidence: a vacant or occupied_by_others
    inspection finding, the borrower''s own written permanent_move_statement, or a health-care absence that exceeded
    its limit; a third party''s oral statement is never enough, per nonoccupancy_caller_statement_sufficient. Non-occupancy
    is confirmed for a health-care absence only when health_absence_max_consecutive_months calendar months have
    passed since the facility admission date. The limit is reached on the same day number in the month health_absence_max_consecutive_months
    calendar months after the absence_start_date, falling back to the last day of that month when that day does
    not exist, and confirmation is allowed only on a later day, because the absence must exceed the limit. A health-care
    confirmation uses nonoccupancy_basis health_absence_limit_exceeded; every other confirmation uses not_principal_residence,
    including an absence for other reasons longer than non_health_absence_max_days days in a 12-month period. Confirmation
    opens a maturity case on the loan on the confirmation date: Extended Health-Care Absence for health_absence_limit_exceeded
    and Principal Residence Change for not_principal_residence. On plans whose cure_by_reoccupancy_permitted is
    true, a confirmed non-occupancy is reversed when a borrower resumes occupancy and completes a certification
    before the related maturity case reaches due_and_payable status; the profile becomes current and the maturity
    case is cured.'
  eligibility:
  - id: health_limit_exceeded
    applies_to:
    - residency_nonoccupancy_confirmed
    kind: time
    condition: Non-occupancy is confirmed for a health-care absence only when health_absence_max_consecutive_months
      calendar months have passed since the facility admission date.
    evidence_fields:
    - residency_profiles.absence_start_date
    - residency_profiles.residency_profile_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_profiles.residency_profile_id
      action_bindings:
        residency_profiles.residency_profile_id: residency_profile_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the facility admission date
      anchor_source: residency_profiles.absence_start_date
      relation: not_before
      duration_source: variants.health_absence_max_consecutive_months
      unit: calendar_months
      counting_rule: The limit is reached on the same day number in the month health_absence_max_consecutive_months
        calendar months after the absence_start_date, falling back to the last day of that month when that day does
        not exist, and confirmation is allowed only on a later day, because the absence must exceed the limit.
      boundary: exclusive
  - id: reoccupy_before_due
    applies_to:
    - residency_reoccupied
    kind: state
    condition: On plans whose cure_by_reoccupancy_permitted is true, a confirmed non-occupancy is reversed when
      a borrower resumes occupancy and completes a certification before the related maturity case reaches due_and_payable
      status; the profile becomes current and the maturity case is cured.
    evidence_fields:
    - maturity_cases.status
    - maturity_cases.maturity_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    state_contract:
      field: maturity_cases.status
      allowed:
      - opened
      - awaiting_hud_approval
  params:
    per_tier:
      Standard Annual Certification:
        cure_by_reoccupancy_permitted: =cure_by_reoccupancy_permitted
      Joint Borrower Certification:
        cure_by_reoccupancy_permitted: =cure_by_reoccupancy_permitted
      Non-Borrowing Spouse Household Certification:
        cure_by_reoccupancy_permitted: =cure_by_reoccupancy_permitted
      Deferral Period Certification:
        cure_by_reoccupancy_permitted: =cure_by_reoccupancy_permitted
      Living Trust Certification:
        cure_by_reoccupancy_permitted: =cure_by_reoccupancy_permitted
      Authorized Representative Certification:
        cure_by_reoccupancy_permitted: =cure_by_reoccupancy_permitted
- id: residency_household_change
  subject:
  - residency_reclassified
  - residency_closed
  rule: 'A borrower''s death is recorded only from an accepted death_notice submission carrying the death certificate
    required by death_documentation; any person whose profile type is listed in death_report_channel may report
    it, and a caller who is not yet a confirmed successor in interest is told within successor_confirmation_days
    calendar days which documents confirm that status. A profile is reclassified or closed for a death only on an
    accepted death notice on file for that profile. When a certifying borrower dies and the loan continues, the
    profile moves to the plan named in reclassify_on_borrower_death for its current plan: a Joint Borrower or Living
    Trust profile with a surviving borrower moves to Standard Annual Certification, and a Non-Borrowing Spouse Household
    profile moves to Deferral Period Certification once the loan has entered its deferral period; the open cycle''s
    due date is unchanged. When the last borrower dies and no deferral applies, or when the loan is paid in full,
    claim-terminated or rescinded per close_on_loan_termination, the profile closes on the date of death or the
    loan''s terminated_date.'
  eligibility:
  - id: death_notice_on_file
    applies_to:
    - residency_reclassified
    kind: authorization
    condition: A profile is reclassified or closed for a death only on an accepted death notice on file for that
      profile.
    evidence_fields:
    - residency_submissions.residency_submission_id
    - residency_submissions.submission_type
    - residency_submissions.review_status
    - residency_submissions.event_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_submissions.residency_submission_id
      action_bindings:
        residency_submissions.residency_submission_id: residency_submission_id
  params:
    per_tier:
      Standard Annual Certification:
        reclassify_on_borrower_death: =reclassify_on_borrower_death
      Joint Borrower Certification:
        reclassify_on_borrower_death: =reclassify_on_borrower_death
      Non-Borrowing Spouse Household Certification:
