events:
- type: setaside_established
  target: setaside_accounts
  mutation: create
  meaning: A set-aside is established on the loan at closing and boarded with the loan.
  grain: One row per set-aside.
  fields:
    setaside_id: Set-aside record id.
    customer_id: Primary borrower.
    hecm_loan_id: HECM loan, if any.
    jumbo_loan_id: Summit loan, if any.
    loan_program: hecm or summit.
    variant_name: Set-aside plan.
    status: Always active when established.
    established_date: Closing date.
    initial_setaside_amount: Amount reserved.
    setaside_balance: Opening balance.
    annual_property_tax: Annual property tax on file.
    annual_hazard_premium: Annual hazard premium on file.
    annual_flood_premium: Annual flood premium on file.
    semiannual_installment_amount: Semi-annual installment, if partially funded.
    repair_estimate_amount: Repair estimate, if a repair set-aside.
  triggers:
  - event: setaside:setaside_initial_funding
    map:
      amount: initial_setaside_amount
      effective_date: established_date
      loan_program: loan_program
- type: setaside_initial_funding
  target: setaside_transactions
  meaning: The amount reserved at closing is credited to the set-aside.
  grain: One row per set-aside.
  distinguish_by:
  - effective_date
  fields:
    amount: Amount reserved.
    effective_date: Establishment date.
    loan_program: Loan program.
  account: setaside_funds
  direction: in
  triggers: []
- type: setaside_tax_disbursement
  target: setaside_transactions
  meaning: The servicer pays one property tax bill installment from the set-aside directly to the taxing authority.
  grain: One row per tax bill installment paid.
  distinguish_by:
  - setaside_request_id
  fields:
    amount: Amount paid from the set-aside.
    effective_date: Payment date.
    setaside_request_id: The tax bill paid.
    loan_program: Loan program.
  account: setaside_funds
  direction: out
  triggers:
  - event: hecm:hecm_advance_posting
    when:
      loan_program: hecm
    map:
      amount: amount
      effective_date: effective_date
      advance_type: setaside_property_tax
      source_txn_ref: setaside_txn_id
      disbursement_method: not_applicable
  - event: jumbo:jumbo_advance_posting
    when:
      loan_program: summit
    map:
      amount: amount
      effective_date: effective_date
      advance_type: reserve_property_tax
      source_txn_ref: setaside_txn_id
- type: setaside_insurance_disbursement
  target: setaside_transactions
  meaning: The servicer pays one hazard or flood insurance premium from the set-aside directly to the insurer.
  grain: One row per premium bill paid.
  distinguish_by:
  - setaside_request_id
  fields:
    amount: Amount paid from the set-aside.
    effective_date: Payment date.
    setaside_request_id: The premium bill paid.
    coverage_type: hazard or flood.
    loan_program: Loan program.
  account: setaside_funds
  direction: out
  triggers:
  - event: hecm:hecm_advance_posting
    when:
      loan_program: hecm
      coverage_type: hazard
    map:
      amount: amount
      effective_date: effective_date
      advance_type: setaside_hazard_insurance
      source_txn_ref: setaside_txn_id
      disbursement_method: not_applicable
  - event: hecm:hecm_advance_posting
    when:
      loan_program: hecm
      coverage_type: flood
    map:
      amount: amount
      effective_date: effective_date
      advance_type: setaside_flood_insurance
      source_txn_ref: setaside_txn_id
      disbursement_method: not_applicable
  - event: jumbo:jumbo_advance_posting
    when:
      loan_program: summit
    map:
      amount: amount
      effective_date: effective_date
      advance_type: reserve_insurance
      source_txn_ref: setaside_txn_id
- type: setaside_borrower_disbursement
  target: setaside_transactions
  meaning: A semi-annual installment of a Partially Funded LESA is paid to the borrower toward property charges.
  grain: One row per semi-annual installment.
  distinguish_by:
  - accrual_period
  fields:
    amount: Installment paid.
    effective_date: Payment date.
    accrual_period: Installment month.
    loan_program: Loan program.
  account: setaside_funds
  direction: out
  triggers:
  - event: hecm:hecm_advance_posting
    map:
      amount: amount
      effective_date: effective_date
      advance_type: lesa_borrower_disbursement
      source_txn_ref: setaside_txn_id
      disbursement_method: ach
- type: setaside_repair_disbursement
  target: setaside_transactions
  meaning: A progress or final repair draw is paid from the Repair Set-Aside to the contractor after inspection.
  grain: One row per repair draw request paid.
  distinguish_by:
  - setaside_request_id
  fields:
    amount: Amount paid to the contractor.
    effective_date: Payment date.
    setaside_request_id: The repair draw request.
    repair_draw_number: Sequence number of this repair draw.
    loan_program: Loan program.
  account: setaside_funds
  direction: out
  triggers:
  - event: hecm:hecm_advance_posting
    map:
      amount: amount
      effective_date: effective_date
      advance_type: repair_disbursement
      source_txn_ref: setaside_txn_id
      disbursement_method: check
- type: setaside_fee_draw
  target: setaside_transactions
  meaning: The monthly HECM servicing fee is drawn from the Servicing Fee Set-Aside.
  grain: One row per fee month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Fee drawn.
    effective_date: Draw date.
    accrual_period: Fee month.
    source_txn_ref: The HECM servicing fee transaction it pays.
    loan_program: Loan program.
  account: setaside_funds
  direction: out
  triggers: []
- type: setaside_growth_credit
  target: setaside_transactions
  meaning: The undisbursed LESA balance grows by one twelfth of the loan's note rate plus the growth spread.
  grain: One row per set-aside per growth month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Growth credited.
    effective_date: Posting date.
    accrual_period: Month credited.
    rate_applied_pct: Annual growth rate applied.
    loan_program: Loan program.
  account: setaside_funds
  direction: in
  triggers: []
- type: setaside_refund_credit
  target: setaside_transactions
  meaning: A refund from a taxing authority or insurer, or the reversal of an erroneous fee draw, is credited back
    to the set-aside.
  grain: One row per original disbursement or fee draw refunded.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount refunded.
    effective_date: Refund date.
    source_txn_ref: The original disbursement or fee draw.
    loan_program: Loan program.
  account: setaside_funds
  direction: in
  triggers:
  - event: hecm:hecm_advance_reversal
    when:
      loan_program: hecm
    map:
      amount: amount
      effective_date: effective_date
- type: setaside_release
  target: setaside_transactions
  meaning: The unused balance leaves the set-aside because repairs were completed, a borrower-elected set-aside
    was cancelled, or the loan terminated.
  grain: One row per set-aside per release reason.
  distinguish_by:
  - release_reason
  fields:
    amount: Balance released.
    effective_date: Release date.
    release_reason: Why the balance was released.
    loan_program: Loan program.
  account: setaside_funds
  direction: out
  triggers:
  - event: hecm:hecm_line_restore
    when:
      loan_program: hecm
      release_reason:
      - repair_completed
      - borrower_elected_cancellation
    map:
      amount: amount
      effective_date: effective_date
      source_txn_ref: setaside_txn_id
  - event: jumbo:jumbo_prepayment
    when:
      loan_program: summit
      release_reason: borrower_elected_cancellation
    map:
      amount: amount
      effective_date: effective_date
      source_txn_ref: setaside_txn_id
- type: setaside_charges_updated
  target: setaside_accounts
  mutation: update
  meaning: The annual property charges on file are updated from a current tax bill or insurance declaration page.
  grain: One row per update.
  fields:
    annual_property_tax: Updated annual tax.
    annual_hazard_premium: Updated annual hazard premium.
    annual_flood_premium: Updated annual flood premium.
  triggers: []
- type: setaside_depleted
  target: setaside_accounts
  mutation:
    transition:
      from: active
      to: depleted
  meaning: The set-aside balance reached 0.00.
  grain: One row per transition.
  fields:
    status: Set to depleted.
  triggers: []
- type: setaside_cancelled
  target: setaside_accounts
  mutation:
    transition:
      from: active
      to: cancelled
  meaning: The borrower's signed cancellation of a borrower-elected set-aside takes effect.
  grain: One row per transition.
  fields:
    status: Set to cancelled.
    closed_date: Cancellation date.
  triggers:
  - event: setaside:setaside_release
    map:
      release_reason: borrower_elected_cancellation
      effective_date: closed_date
- type: setaside_closed
  target: setaside_accounts
  mutation:
    transition:
    - from: active
      to: closed
    - from: depleted
      to: closed
  meaning: The set-aside closes because repairs were completed or the loan was paid in full or terminated.
  grain: One row per transition.
  fields:
    status: Set to closed.
    closed_date: Closing date.
  triggers:
  - event: setaside:setaside_release
    map:
      effective_date: closed_date
measures:
- id: setaside_msr_repair_draws_paid
  window: Life of the set-aside up to and including the handling date.
  measure: Count of setaside_repair_disbursement rows of the set-aside.
- id: setaside_msr_repair_holdback
  window: Life of the set-aside up to and including the handling date.
  measure: Sum, over repair_progress_draw requests of the set-aside with request_status paid, of billed_amount less
    the amount of the setaside_repair_disbursement that paid the request.
policies:
- id: setaside_agg_multi_holding
  subject:
  - setaside_established
  - setaside_initial_funding
  rule: 'A borrower may hold several set-asides, because one loan can carry a property-charge set-aside, a Repair
    Set-Aside and a Servicing Fee Set-Aside at the same time, but never more than max_per_loan open set-aside of
    the same plan on one loan. A set-aside is established only when the same loan has no other set-aside of the
    same plan whose status is active or depleted. The three LESA plans are mutually exclusive on one loan: a loan
    carries at most one LESA, whether Fully Funded (Mandatory), Fully Funded (Borrower-Elected) or Partially Funded.
    A set-aside attaches only to a loan of a program listed in its eligible_loan_programs: HECM set-asides to a
    HECM loan and the Summit Tax and Insurance Reserve to a Cedarline Summit loan. On establishment the initial_setaside_amount
    is credited once as the opening funds, effective on the established_date. The plan is set at closing: the Fully
    Funded LESA (Mandatory) and Partially Funded LESA are imposed by the financial assessment per required_by_financial_assessment,
    and the LESA and Servicing Fee Set-Aside amounts are computed to the age in computation_horizon_age of the youngest
    borrower or eligible non-borrowing spouse, while the Summit reserve holds reserve_months_of_charges months of
    charges. A Repair Set-Aside equals repair_setaside_pct_of_estimate percent of the accepted repair estimate,
    may not exceed repair_max_pct_of_max_claim percent of the loan''s maximum claim amount, and carries a repair
    administration fee of the greater of repair_admin_fee_pct percent of the set-aside and repair_admin_fee_minimum,
    paid at closing as a mandatory obligation and never from the set-aside. Only the Summit reserve accepts additional
    borrower deposits, per borrower_top_up_permitted; a HECM set-aside is never added to after closing.'
  eligibility:
  - id: one_per_plan_per_loan
    applies_to:
    - setaside_established
    kind: dedup
    condition: A set-aside is established only when the same loan has no other set-aside of the same plan whose
      status is active or depleted.
    evidence_fields:
    - setaside_accounts.hecm_loan_id
    - setaside_accounts.variant_name
    - setaside_accounts.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.hecm_loan_id
        - setaside_accounts.variant_name
      action_bindings:
        setaside_accounts.hecm_loan_id: hecm_loan_id
        setaside_accounts.variant_name: variant_name
    dedup_contract:
      table: setaside_accounts
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
        variant_name: variant_name
      duplicate_filters:
        status:
        - active
        - depleted
      distinct_fields: []
  params:
    max_per_customer: null
- id: setaside_agg_shortfall_funding
  subject:
  - setaside_tax_disbursement
  - setaside_insurance_disbursement
  - setaside_depleted
  rule: 'A bill is paid only from the set-aside on the same loan whose plan pays that charge type; a bill for a
    charge the plan does not pay, or for homeowners-association dues, ground rent or a special assessment, is declined
    with reason not_payable_from_this_setaside, and the charge stays the borrower''s to pay. A bill is paid from
    a set-aside only while the set-aside status is active. When a payable bill exceeds the set-aside balance, the
    set-aside pays its entire remaining balance and no more; the unpaid remainder is handled per the plan''s shortfall_source:
    under borrower_billed_then_corporate_advance the borrower is billed for it and, if the borrower has not paid
    it by the bill''s due date, Cedarline pays it as a corporate advance under the property charge repayment rules;
    under corporate_advance Cedarline pays it as a corporate advance at once. When a disbursement or fee draw brings
    the balance to 0.00, the set-aside becomes depleted on the same date and the borrower is notified within depletion_notice_days
    calendar days that the charges it paid are now the borrower''s to pay; a depleted set-aside pays nothing further.
    While a Fully Funded LESA pays a charge, a missed payment of that charge is never a borrower property-charge
    default. No plan pays homeowners-association dues, ground rent or special assessments, per pays_hoa_and_other_charges.'
  eligibility:
  - id: pay_from_active
    applies_to:
    - setaside_tax_disbursement
    - setaside_insurance_disbursement
    kind: state
    condition: A bill is paid from a set-aside only while the set-aside status is active.
    evidence_fields:
    - setaside_accounts.status
    - setaside_accounts.setaside_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    state_contract:
      field: setaside_accounts.status
      allowed:
      - active
- id: setaside_evt_property_charges
  subject:
  - setaside_tax_disbursement
  - setaside_insurance_disbursement
  rule: The servicer pays property tax bills only from plans whose pays_property_tax is true, hazard premiums only
    from plans whose pays_hazard_insurance is true and flood premiums only from plans whose pays_flood_insurance
    is true, always directly to the taxing authority or insurer. A disbursement is made only against a bill on file
    for that set-aside whose request type matches the charge and whose request status is received. Each tax installment
    is paid as its own disbursement when pays_installments_separately is true, and each bill is paid at most once.
    The amount paid is the bill's billed_amount, limited by the set-aside balance as set out in the shortfall rule;
    the effective date is the handling date, and the request_status of the bill becomes paid. The servicer pays
    a tax bill at least tax_payment_lead_days calendar days before its due date and a premium at least insurance_payment_lead_days
    calendar days before its due date; a penalty or lapse cost caused by paying later is borne per late_payment_penalty_bearer
    and is never charged to the set-aside or the loan. Disbursements continue while the loan is due and payable
    only where continues_while_due_and_payable is true, and stop once the loan is paid in full, claim-terminated
    or rescinded. Plans whose pays_payee_directly is true pay the taxing authority, insurer or contractor directly,
    never the borrower.
  eligibility:
  - id: bill_on_file
    applies_to:
    - setaside_tax_disbursement
    - setaside_insurance_disbursement
    kind: authorization
    condition: A disbursement is made only against a bill on file for that set-aside whose request type matches
      the charge and whose request status is received.
    evidence_fields:
    - setaside_requests.setaside_request_id
    - setaside_requests.request_type
    - setaside_requests.request_status
    - setaside_requests.billed_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_requests.setaside_request_id
      action_bindings:
        setaside_requests.setaside_request_id: setaside_request_id
  - id: bill_paid_once
    applies_to:
    - setaside_tax_disbursement
    - setaside_insurance_disbursement
    kind: dedup
    condition: Each tax installment is paid as its own disbursement when pays_installments_separately is true, and
      each bill is paid at most once.
    evidence_fields:
    - setaside_transactions.setaside_request_id
    - setaside_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_transactions.setaside_request_id
      action_bindings:
        setaside_transactions.setaside_request_id: setaside_request_id
    dedup_contract:
      table: setaside_transactions
      mode: separate_record
      object_bindings:
        setaside_request_id: setaside_request_id
      duplicate_filters:
        event_type:
        - setaside_tax_disbursement
        - setaside_insurance_disbursement
      distinct_fields: []
  params:
    per_tier:
      Fully Funded LESA (Mandatory):
        pays_property_tax: =pays_property_tax
        pays_hazard_insurance: =pays_hazard_insurance
        pays_flood_insurance: =pays_flood_insurance
        continues_while_due_and_payable: =continues_while_due_and_payable
      Fully Funded LESA (Borrower-Elected):
        pays_property_tax: =pays_property_tax
        pays_hazard_insurance: =pays_hazard_insurance
        pays_flood_insurance: =pays_flood_insurance
        continues_while_due_and_payable: =continues_while_due_and_payable
      Partially Funded LESA:
        pays_property_tax: =pays_property_tax
        pays_hazard_insurance: =pays_hazard_insurance
        pays_flood_insurance: =pays_flood_insurance
        continues_while_due_and_payable: =continues_while_due_and_payable
      Repair Set-Aside:
        pays_property_tax: =pays_property_tax
        pays_hazard_insurance: =pays_hazard_insurance
        pays_flood_insurance: =pays_flood_insurance
        continues_while_due_and_payable: =continues_while_due_and_payable
      Servicing Fee Set-Aside:
        pays_property_tax: =pays_property_tax
        pays_hazard_insurance: =pays_hazard_insurance
        pays_flood_insurance: =pays_flood_insurance
        continues_while_due_and_payable: =continues_while_due_and_payable
      Summit Tax and Insurance Reserve:
        pays_property_tax: =pays_property_tax
        pays_hazard_insurance: =pays_hazard_insurance
        pays_flood_insurance: =pays_flood_insurance
        continues_while_due_and_payable: =continues_while_due_and_payable
- id: setaside_evt_partial_lesa
  subject:
  - setaside_borrower_disbursement
  rule: Only plans whose borrower_semiannual_disbursement is true pay installments to the borrower; the borrower
    remains responsible for paying the property charges on time. An installment is paid on semiannual_disbursement_day
    of each month listed in semiannual_disbursement_months, by ach to the borrower, with that month as accrual_period.
    The installment is the semiannual_installment_amount fixed at closing per semiannual_amount_basis, or the remaining
    balance when that is smaller, after which the set-aside depletes. A semi-annual installment is paid only while
    the set-aside status is active. No installment is paid once the loan is due and payable, because continues_while_due_and_payable
    is false for this plan, and none is paid for a month before the loan funded. Each installment month is paid
    at most once.
  eligibility:
  - id: installment_active
    applies_to:
    - setaside_borrower_disbursement
    kind: state
    condition: A semi-annual installment is paid only while the set-aside status is active.
    evidence_fields:
    - setaside_accounts.status
    - setaside_accounts.setaside_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    state_contract:
      field: setaside_accounts.status
      allowed:
      - active
  - id: installment_once
    applies_to:
    - setaside_borrower_disbursement
    kind: dedup
    condition: Each installment month is paid at most once.
    evidence_fields:
    - setaside_transactions.setaside_id
    - setaside_transactions.accrual_period
    - setaside_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_transactions.setaside_id
        - setaside_transactions.accrual_period
      action_bindings:
        setaside_transactions.setaside_id: setaside_id
        setaside_transactions.accrual_period: accrual_period
    dedup_contract:
      table: setaside_transactions
      mode: separate_record
      object_bindings:
        setaside_id: setaside_id
        accrual_period: accrual_period
      duplicate_filters:
        event_type:
        - setaside_borrower_disbursement
      distinct_fields: []
  formula:
    installment: min(semiannual_installment_amount, setaside_balance)
- id: setaside_evt_repair
  subject:
  - setaside_repair_disbursement
  - setaside_release
  - setaside_closed
  rule: Only plans whose repair_disbursements is true pay repair draws, always by check to the contractor named
    on the invoice. A repair draw is paid only against a repair draw request on file for that set-aside whose request
    status is received and which carries an inspection report reference. Repair disbursements are made only when
    the repair draw request is received no later than repair_completion_months calendar months after the set-aside
    was established. That deadline is the same day number in the month repair_completion_months calendar months
    after the established_date, falling back to the last day of that month when that day does not exist, and a request
    received on the deadline itself still qualifies. A request received after the deadline is declined with reason
    repair_deadline_passed; the remaining repair funds stay reserved and the case passes to Cedarline's property
    preservation unit, which these rules do not cover. A progress draw (repair_progress_draw) is paid only when
    the inspection found at least repair_progress_min_pct_complete percent of the work complete and fewer than repair_max_progress_disbursements
    progress draws have been paid, otherwise it is declined with reason inspection_insufficient; it pays the invoiced
    billed_amount less repair_holdback_pct percent held back. The final draw (repair_final_draw) is paid only when
    the inspection found the work 100.00 percent complete, otherwise it is declined with reason inspection_insufficient;
    it pays the final invoice's billed_amount plus setaside_msr_repair_holdback. Every repair draw is limited to
    the set-aside balance, and repair_draw_number is setaside_msr_repair_draws_paid plus one. After the final draw
    is paid, the unused balance is released on the same date with release_reason repair_completed to the destination
    in unused_repair_funds_destination, and the set-aside is closed on that date. Each repair draw request is paid
    at most once. Every repair draw needs an inspection report on file, per repair_inspection_required.
  eligibility:
  - id: repair_request_on_file
    applies_to:
    - setaside_repair_disbursement
    kind: authorization
    condition: A repair draw is paid only against a repair draw request on file for that set-aside whose request
      status is received and which carries an inspection report reference.
    evidence_fields:
    - setaside_requests.setaside_request_id
    - setaside_requests.request_type
    - setaside_requests.request_status
    - setaside_requests.inspection_reference
    - setaside_requests.inspection_pct_complete
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_requests.setaside_request_id
      action_bindings:
        setaside_requests.setaside_request_id: setaside_request_id
  - id: repair_deadline
    applies_to:
    - setaside_repair_disbursement
    kind: time
    condition: Repair disbursements are made only when the repair draw request is received no later than repair_completion_months
      calendar months after the set-aside was established.
    evidence_fields:
    - setaside_accounts.established_date
    - setaside_accounts.setaside_id
    - setaside_requests.request_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the set-aside was established
      anchor_source: setaside_accounts.established_date
      relation: not_after
      duration_source: variants.repair_completion_months
      unit: calendar_months
      counting_rule: That deadline is the same day number in the month repair_completion_months calendar months
        after the established_date, falling back to the last day of that month when that day does not exist, and
        a request received on the deadline itself still qualifies.
      boundary: inclusive
  - id: repair_paid_once
    applies_to:
    - setaside_repair_disbursement
    kind: dedup
    condition: Each repair draw request is paid at most once.
    evidence_fields:
    - setaside_transactions.setaside_request_id
    - setaside_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_transactions.setaside_request_id
      action_bindings:
        setaside_transactions.setaside_request_id: setaside_request_id
    dedup_contract:
      table: setaside_transactions
      mode: separate_record
      object_bindings:
        setaside_request_id: setaside_request_id
      duplicate_filters:
        event_type:
        - setaside_repair_disbursement
      distinct_fields: []
  formula:
    progress_draw_amount: min(round(amount * (100 - repair_holdback_pct) / 100, 2), setaside_balance)
  measures:
  - setaside_msr_repair_draws_paid
  - setaside_msr_repair_holdback
- id: setaside_evt_fee_draw
  subject:
  - setaside_fee_draw
  rule: Only plans whose servicing_fee_draws is true pay the HECM monthly servicing fee. Each servicing fee posted
    on the loan is drawn from the loan's Servicing Fee Set-Aside on the same date, for the same amount and accrual_period,
    with source_txn_ref set to that fee. A fee draw is made only while the set-aside status is active. When the
    balance is smaller than the fee, the draw takes the remaining balance and the set-aside depletes; from then
    on, per sfsa_exhaustion_rule, fees are still charged to the loan balance but nothing is drawn. Each fee month
    is drawn at most once.
  eligibility:
  - id: fee_draw_active
    applies_to:
    - setaside_fee_draw
    kind: state
    condition: A fee draw is made only while the set-aside status is active.
    evidence_fields:
    - setaside_accounts.status
    - setaside_accounts.setaside_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    state_contract:
      field: setaside_accounts.status
      allowed:
      - active
  - id: fee_draw_once
    applies_to:
    - setaside_fee_draw
    kind: dedup
    condition: Each fee month is drawn at most once.
    evidence_fields:
    - setaside_transactions.setaside_id
    - setaside_transactions.accrual_period
    - setaside_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_transactions.setaside_id
        - setaside_transactions.accrual_period
      action_bindings:
        setaside_transactions.setaside_id: setaside_id
        setaside_transactions.accrual_period: accrual_period
    dedup_contract:
      table: setaside_transactions
      mode: separate_record
      object_bindings:
        setaside_id: setaside_id
        accrual_period: accrual_period
      duplicate_filters:
        event_type:
        - setaside_fee_draw
      distinct_fields: []
  formula:
    fee_draw_amount: min(amount, setaside_balance)
- id: setaside_evt_growth
  subject:
  - setaside_growth_credit
  rule: On plans whose growth_applies is true the undisbursed balance grows monthly at an annual rate equal to the
    HECM loan's note_rate_pct in effect for the month plus growth_spread_pct, and rate_applied_pct records that
    annual rate. Growth for a month is credited on growth_posting_day of the following month with that month as
    accrual_period, on the setaside_balance at the end of the month, rounded half up to the cent per disbursement_rounding.
    Growth is credited only while the set-aside status is active. A month whose ending balance is 0.00 posts nothing,
    and Repair, Servicing Fee and Summit reserve balances never grow. Each growth month is credited at most once.
  eligibility:
  - id: growth_active
    applies_to:
    - setaside_growth_credit
    kind: state
    condition: Growth is credited only while the set-aside status is active.
    evidence_fields:
    - setaside_accounts.status
    - setaside_accounts.setaside_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    state_contract:
      field: setaside_accounts.status
      allowed:
      - active
  - id: growth_once
    applies_to:
    - setaside_growth_credit
    kind: dedup
    condition: Each growth month is credited at most once.
    evidence_fields:
    - setaside_transactions.setaside_id
    - setaside_transactions.accrual_period
    - setaside_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_transactions.setaside_id
        - setaside_transactions.accrual_period
      action_bindings:
        setaside_transactions.setaside_id: setaside_id
        setaside_transactions.accrual_period: accrual_period
    dedup_contract:
      table: setaside_transactions
      mode: separate_record
      object_bindings:
        setaside_id: setaside_id
        accrual_period: accrual_period
      duplicate_filters:
        event_type:
        - setaside_growth_credit
      distinct_fields: []
  params:
    per_tier:
      Fully Funded LESA (Mandatory):
        growth_applies: =growth_applies
        growth_spread_pct: =growth_spread_pct
      Fully Funded LESA (Borrower-Elected):
        growth_applies: =growth_applies
        growth_spread_pct: =growth_spread_pct
      Partially Funded LESA:
        growth_applies: =growth_applies
        growth_spread_pct: =growth_spread_pct
      Repair Set-Aside:
        growth_applies: =growth_applies
        growth_spread_pct: =growth_spread_pct
      Servicing Fee Set-Aside:
        growth_applies: =growth_applies
        growth_spread_pct: =growth_spread_pct
      Summit Tax and Insurance Reserve:
        growth_applies: =growth_applies
        growth_spread_pct: =growth_spread_pct
  formula:
    when_not: growth_applies == False
    growth_amount: round(setaside_balance * rate_applied_pct / 1200, 2)
- id: setaside_evt_refund
  subject:
  - setaside_refund_credit
  rule: When a taxing authority or insurer refunds a disbursement the set-aside made (a duplicate or overpaid tax
    installment, or the unearned premium of a cancelled policy), or when an erroneous servicing fee is reversed
    on the loan, the refunded amount is credited back to the set-aside per refund_credit_target, referencing the
    original disbursement or fee draw in source_txn_ref, and is reversed from the HECM loan balance. A refund is
    credited to the set-aside only while the set-aside status is active. A refund that arrives after the set-aside
    is depleted, cancelled or closed is not credited to the set-aside; it is applied per closed_setaside_refund_target
    as a reduction of the loan balance. A refund credit never exceeds the original disbursement, and each original
    disbursement or fee draw is refunded at most once.
  eligibility:
  - id: refund_active
    applies_to:
    - setaside_refund_credit
    kind: state
    condition: A refund is credited to the set-aside only while the set-aside status is active.
    evidence_fields:
    - setaside_accounts.status
    - setaside_accounts.setaside_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    state_contract:
      field: setaside_accounts.status
      allowed:
      - active
  - id: refund_once
    applies_to:
    - setaside_refund_credit
    kind: dedup
    condition: A refund credit never exceeds the original disbursement, and each original disbursement or fee draw
      is refunded at most once.
    evidence_fields:
    - setaside_transactions.source_txn_ref
    - setaside_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_transactions.source_txn_ref
      action_bindings:
        setaside_transactions.source_txn_ref: source_txn_ref
    dedup_contract:
      table: setaside_transactions
      mode: separate_record
      object_bindings:
        source_txn_ref: source_txn_ref
      duplicate_filters:
        event_type:
        - setaside_refund_credit
      distinct_fields: []
- id: setaside_borrower_cancellation
  subject:
  - setaside_cancelled
  - setaside_release
  rule: 'Only plans whose borrower_cancellation_permitted is true may be cancelled by the borrower; a request to
    cancel any other plan, including a mandatory LESA imposed by the financial assessment, is declined with reason
    cancellation_not_permitted. A cancellation takes effect only against a borrower-elected cancellation request
    on file for that set-aside whose request status is received and which every borrower on the loan signed. A cancellation
    is accepted only on or after the date cancellation_min_months calendar months after the set-aside was established.
    That date is the same day number in the month cancellation_min_months calendar months after the established_date,
    falling back to the last day of that month when that day does not exist, and the date itself qualifies; an earlier
    request is declined with reason cancellation_too_early. A cancellation is refused while the loan has a property
    charge repayment plan whose status is pending_signature, active or defaulted, and such a request is declined
    with reason corporate_advance_outstanding, per cancellation_requires_no_corporate_advance. On cancellation the
    whole remaining balance is released on the same date with release_reason borrower_elected_cancellation to the
    destination in cancellation_release_destination: the HECM available line for a borrower-elected LESA, a reduction
    of the Summit loan balance for the Summit reserve; from then on every property charge is the borrower''s to
    pay. Only the borrower can cancel; the servicer records the borrower''s own signed request.'
  eligibility:
  - id: cancellation_request_on_file
    applies_to:
    - setaside_cancelled
    kind: authorization
    condition: A cancellation takes effect only against a borrower-elected cancellation request on file for that
      set-aside whose request status is received and which every borrower on the loan signed.
    evidence_fields:
    - setaside_requests.setaside_request_id
    - setaside_requests.request_type
    - setaside_requests.request_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_requests.setaside_request_id
      action_bindings:
        setaside_requests.setaside_request_id: setaside_request_id
  - id: cancellation_waiting_period
    applies_to:
    - setaside_cancelled
    kind: time
    condition: A cancellation is accepted only on or after the date cancellation_min_months calendar months after
      the set-aside was established.
    evidence_fields:
    - setaside_accounts.established_date
    - setaside_accounts.setaside_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the set-aside was established
      anchor_source: setaside_accounts.established_date
      relation: not_before
      duration_source: variants.cancellation_min_months
      unit: calendar_months
      counting_rule: That date is the same day number in the month cancellation_min_months calendar months after
        the established_date, falling back to the last day of that month when that day does not exist, and the date
        itself qualifies; an earlier request is declined with reason cancellation_too_early.
      boundary: inclusive
  - id: no_open_repayment_plan
    applies_to:
    - setaside_cancelled
    kind: dedup
    condition: A cancellation is refused while the loan has a property charge repayment plan whose status is pending_signature,
      active or defaulted, and such a request is declined with reason corporate_advance_outstanding, per cancellation_requires_no_corporate_advance.
    evidence_fields:
    - propcharge_plans.hecm_loan_id
    - propcharge_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.hecm_loan_id
      action_bindings:
        propcharge_plans.hecm_loan_id: hecm_loan_id
    dedup_contract:
      table: propcharge_plans
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
      duplicate_filters:
        status:
        - pending_signature
        - active
        - defaulted
      distinct_fields: []
  params:
    per_tier:
      Fully Funded LESA (Mandatory):
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Fully Funded LESA (Borrower-Elected):
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Partially Funded LESA:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Repair Set-Aside:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Servicing Fee Set-Aside:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Summit Tax and Insurance Reserve:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
- id: setaside_lifecycle_close
  subject:
  - setaside_closed
  - setaside_depleted
  - setaside_release
  rule: A set-aside closes for loan termination only when the loan status is paid_in_full, claim_terminated or rescinded,
    per close_on_loan_termination; it closes on the loan's terminated_date, and any remaining balance is released
    on that date with release_reason loan_terminated, which restores nothing because the loan has ended. A Repair
    Set-Aside also closes on the date its final repair draw is paid, as set out in the repair rule. A set-aside
    becomes depleted on the date a disbursement or fee draw brings its balance to 0.00, and a depleted set-aside
    only ever moves on to closed. A set-aside is never closed merely because the loan became due and payable; while
    the loan is due and payable it keeps paying only where continues_while_due_and_payable is true.
  eligibility:
  - id: loan_terminated
    applies_to:
    - setaside_closed
    kind: state
    condition: A set-aside closes for loan termination only when the loan status is paid_in_full, claim_terminated
      or rescinded, per close_on_loan_termination; it closes on the loan's terminated_date, and any remaining balance
      is released on that date with release_reason loan_terminated, which restores nothing because the loan has
      ended.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    - hecm_loans.terminated_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - paid_in_full
      - claim_terminated
      - rescinded
- id: setaside_charge_review
  subject:
  - setaside_charges_updated
  rule: The annual property charges on file are reviewed every charge_review_frequency_months months and whenever
    a new bill is received, and are updated only from the evidence named in charge_update_evidence. The annual charges
    on file are updated only from a property tax, hazard insurance or flood insurance bill on file for that set-aside.
    The annual property tax is the sum of the billed_amount of every installment bill of the current tax year, the
    annual hazard premium is the billed_amount of the current hazard policy term, and the annual flood premium is
    the billed_amount of the current flood policy term. An update never changes a Partially Funded LESA's fixed
    semi-annual installment and never adds funds to the set-aside; when the updated charges leave the balance projected
    to cover fewer than low_balance_notice_months months of the charges the set-aside pays, the borrower receives
    a low-balance notice.
  eligibility:
  - id: update_from_bill
    applies_to:
    - setaside_charges_updated
    kind: authorization
    condition: The annual charges on file are updated only from a property tax, hazard insurance or flood insurance
      bill on file for that set-aside.
    evidence_fields:
    - setaside_requests.setaside_request_id
    - setaside_requests.request_type
    - setaside_requests.billed_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_requests.setaside_request_id
      action_bindings:
        setaside_requests.setaside_request_id: setaside_request_id
