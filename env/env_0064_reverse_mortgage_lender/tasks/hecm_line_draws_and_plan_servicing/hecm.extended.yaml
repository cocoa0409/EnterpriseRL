- id: hecm_ext_payment_release
  base_policy_refs:
  - hecm_payment_plan_change
  overwrite:
  - base_policy: hecm_payment_plan_change
    superseded_clause: >-
      The release amount is the current scheduled_payment_amount times (1 + monthly rate) times (1 - (1 + monthly
      rate) to the power of minus the remaining payments) divided by the monthly rate, rounded half up to the cent;
      the remaining payments are scheduled_payment_term_months less hecm_msr_term_payments_made for a term-based
      plan, and for a tenure-based plan twelve times the difference between tenure_age_horizon_years and the age
      in whole years, on the first day of the month the change takes effect, of the youngest borrower or eligible
      non-borrowing spouse on the loan.
    replaced_by: >-
      The release amount is the current scheduled_payment_amount times (1 + monthly rate) times (1 - (1 + monthly
      rate) to the power of minus the remaining payments) divided by the monthly rate, rounded half up to the cent;
      the remaining payments are scheduled_payment_term_months less hecm_msr_term_payments_made for a term-based
      plan, and for a tenure-based plan twelve times the difference between tenure_age_horizon_years and the age
      in whole years, on the first day of the month the change takes effect, of the youngest borrower or eligible
      non-borrowing spouse on the loan; for the payment release of a change onto the HECM Line of Credit, and only
      for it, the age is the youngest_borrower_age_at_closing plus the whole years from the closing date to the
      handling date (whole calendar months between two dates are complete on the later month's day with the same
      day number as the earlier date, or on the first day of the following month when that month has no such day
      number, and whole years are twelve whole months), the remaining payments of a tenure-based plan are never
      fewer than five_year_minimum_months, and the release amount adds a timing adjustment and a processing credit
      to that value and deducts the amount kept committed.
  trigger: state_due
  subject:
  - hecm_line_release
  computes: release_amount
  target_tool: convert_payout_plan_to_line_d82e9c7e
  params:
    five_year_minimum_months: 60
    installments_in_coming_year: 12
    processing_credit_days: 7
  rule: >-
    When a borrower's signed payout plan change request moves a loan off scheduled payments onto the HECM Line of
    Credit, Cedarline processes the change on the handling date and books the payment release, the amount of the
    scheduled payments not yet made that returns to the available line. A plan change is processed only while the
    loan status is active. The release amount is the current scheduled_payment_amount times (1 + monthly rate) times
    (1 - (1 + monthly rate) to the power of minus the remaining payments) divided by the monthly rate, rounded half
    up to the cent; the remaining payments are scheduled_payment_term_months less hecm_msr_term_payments_made for
    a term-based plan, and for a tenure-based plan twelve times the difference between tenure_age_horizon_years
    and the age in whole years, on the first day of the month the change takes effect, of the youngest borrower
    or eligible non-borrowing spouse on the loan; for the payment release of a change onto the HECM Line of Credit,
    and only for it, the age is the youngest_borrower_age_at_closing plus the whole years from the closing date
    to the handling date (whole calendar months between two dates are complete on the later month's day with the
    same day number as the earlier date, or on the first day of the following month when that month has no such
    day number, and whole years are twelve whole months), the remaining payments of a tenure-based plan are never
    fewer than five_year_minimum_months, and the release amount adds a timing adjustment and a processing credit
    to that value and deducts the amount kept committed. For the payment release the borrower's age is the youngest_borrower_age_at_closing
    plus the whole years from the closing date to the handling date (whole calendar months between two dates are
    complete on the later month's day with the same day number as the earlier date, or on the first day of the following
    month when that month has no such day number, and whole years are twelve whole months), and a plan is tenure-based
    when its tenure_age_horizon_years is above 0. A loan carries at most one submitted payout plan change request
    at a time, so the submitted change request onto the HECM Line of Credit is a single request. Interest accruals
    and line growth credits each post once a month, so the most recent one is a single entry. The payment release
    is the value of the remaining payments plus the timing adjustment plus the processing credit, less the amount
    kept committed, floored at 0.00 and rounded half up to the cent once, at the end, where the value of the remaining
    payments is the scheduled_payment_amount times (1 + the monthly rate) times (1 - (1 + the monthly rate) to the
    power of minus the remaining payments) divided by the monthly rate, and the monthly rate is one twelfth of the
    sum of the loan's expected_rate_pct and annual_mip_rate_pct, divided by 100. Under the standard rule the remaining
    payments are, for a tenure-based plan, twelve times the difference between tenure_age_horizon_years and the
    borrower's age, and for a term-based plan scheduled_payment_term_months less the scheduled payments already
    disbursed on the loan; the timing adjustment, the processing credit and the amount kept committed are 0.00;
    and the standard value is the value of the remaining payments counted in this standard way. In place of the
    standard remaining payments Cedarline applies the HUD five-year minimum: on a tenure-based plan where twelve
    times the difference between tenure_age_horizon_years and the borrower's age is less than five_year_minimum_months,
    the remaining payments are five_year_minimum_months; on any other tenure-based plan they are twelve times that
    difference; on a term-based plan they are scheduled_payment_term_months less the scheduled payments already
    disbursed on the loan. Added to the timing adjustment, Cedarline follows the payment calendar of the handling
    month: when a scheduled payment was disbursed on a date after the same day of the previous month, the handling
    month is already paid and the first remaining payment is a month away, so the timing adjustment is minus the
    standard value times the monthly rate divided by (1 + the monthly rate); when none was disbursed in that window
    but one was disbursed on a date after the same day two months before the handling date, the handling month's
    payment is still owed, so the timing adjustment is the scheduled_payment_amount less the standard value times
    the monthly rate divided by (1 + the monthly rate); otherwise the timing adjustment is 0.00. Added to the amount
    kept committed, until the loan's property charge repayment record is closed, is the part of a property charge
    arrearage the repayment plan will not collect in the coming year, a loan holding at most one open record: when
    that record is in notice_period, pending_signature or defaulted with an arrearage_balance above 0.00, it is
    the whole arrearage_balance; when it is active with an arrearage_balance above 0.00 and a monthly_installment
    above 0.00, it is the arrearage_balance less installments_in_coming_year monthly installments, never below 0.00;
    otherwise it is 0.00. Added to the processing credit, Cedarline credits line growth on the standard value for
    the time the signed change request waited, at the annual rate applied by the most recent line growth posted
    on the loan (0 when none has posted): when the whole calendar months from the request_date of the submitted
    change request onto the HECM Line of Credit to the handling date, counted in the same way, are at least one,
    the processing credit is the standard value times one twelfth of that rate, divided by 100, times those months;
    otherwise, when the calendar days from that request_date to the handling date are at least processing_credit_days,
    it is the standard value times that rate, divided by 100, times those days divided by 365; otherwise it is 0.00.
    The change also charges payment_plan_change_fee to the loan balance, sets the plan to HECM Line of Credit with
    scheduled_payment_amount 0.00, scheduled_payment_term_months 0 and no scheduled_payment_start_period, and marks
    the request processed.
  compute:
  - pay: F('scheduled_payment_amount')
  - r: (float(F('expected_rate_pct')) + P('annual_mip_rate_pct')) / 1200
  - h: P('tenure_age_horizon_years')
  - age_now: F('youngest_borrower_age_at_closing') + int(MONTHS(F('closing_date'), NOW) / 12)
  - made: COUNT('hecm_transactions', event_type='hecm_scheduled_payment')
  - n_base: 12 * (h - age_now) if h > 0 else F('scheduled_payment_term_months') - made
  - sv: pay * (1 + r) * (1 - (1 + r) ** (-n_base)) / r
  - n_rel: >-
      K('five_year_minimum_months') if (h > 0 and 12 * (h - F('youngest_borrower_age_at_closing') - int(MONTHS(F('closing_date'),
      NOW) / 12)) < K('five_year_minimum_months')) else (12 * (h - age_now) if h > 0 else F('scheduled_payment_term_months')
      - COUNT('hecm_transactions', event_type='hecm_scheduled_payment'))
  - tadj: >-
      (0 - sv * r / (1 + r)) if COUNT('hecm_transactions', within_months=1, date_field='effective_date', event_type='hecm_scheduled_payment')
      > 0 else ((pay - sv * r / (1 + r)) if COUNT('hecm_transactions', within_months=2, date_field='effective_date',
      event_type='hecm_scheduled_payment') > 0 else 0)
  - pc_lump: >-
      (CFIELD('propcharge', 'arrearage_balance', hecm_loan_id=HID, status='notice_period') or 0) + (CFIELD('propcharge',
      'arrearage_balance', hecm_loan_id=HID, status='pending_signature') or 0) + (CFIELD('propcharge', 'arrearage_balance',
      hecm_loan_id=HID, status='defaulted') or 0)
  - pc_act: >-
      CFIELD('propcharge', 'arrearage_balance', hecm_loan_id=HID, status='active') or 0
  - pc_inst: >-
      CFIELD('propcharge', 'monthly_installment', hecm_loan_id=HID, status='active') or 0
  - defer: >-
      pc_lump if pc_lump > 0 else (MX(0, pc_act - pc_inst * K('installments_in_coming_year')) if (pc_act > 0 and
      pc_inst > 0) else 0)
  - req_date: >-
      LATEST('hecm_requests', 'request_date', date_field='request_date', request_type='payment_plan_change', request_status='submitted',
      requested_plan='HECM Line of Credit') or NOW
  - g_rate: >-
      float(LATEST('hecm_transactions', 'rate_applied_pct', date_field='effective_date', event_type='hecm_line_growth')
      or 0)
  - credit: >-
      sv * g_rate / 1200 * MONTHS(req_date, NOW) if MONTHS(req_date, NOW) >= 1 else (sv * g_rate / 100 * DAYS(req_date,
      NOW) / 365 if DAYS(req_date, NOW) >= K('processing_credit_days') else 0)
  - result: >-
      RND(MX(0, pay * (1 + r) * (1 - (1 + r) ** (-n_rel)) / r + tadj + credit - defer), 2)
  compute_basis:
    pay: >-
      The payment release is the value of the remaining payments plus the timing adjustment plus the processing
      credit, less the amount kept committed, floored at 0.00 and rounded half up to the cent once, at the end,
      where the value of the remaining payments is the scheduled_payment_amount times (1 + the monthly rate) times
      (1 - (1 + the monthly rate) to the power of minus the remaining payments) divided by the monthly rate, and
      the monthly rate is one twelfth of the sum of the loan's expected_rate_pct and annual_mip_rate_pct, divided
      by 100.
    r: >-
      The payment release is the value of the remaining payments plus the timing adjustment plus the processing
      credit, less the amount kept committed, floored at 0.00 and rounded half up to the cent once, at the end,
      where the value of the remaining payments is the scheduled_payment_amount times (1 + the monthly rate) times
      (1 - (1 + the monthly rate) to the power of minus the remaining payments) divided by the monthly rate, and
      the monthly rate is one twelfth of the sum of the loan's expected_rate_pct and annual_mip_rate_pct, divided
      by 100.
    h: >-
      For the payment release the borrower's age is the youngest_borrower_age_at_closing plus the whole years from
      the closing date to the handling date (whole calendar months between two dates are complete on the later month's
      day with the same day number as the earlier date, or on the first day of the following month when that month
      has no such day number, and whole years are twelve whole months), and a plan is tenure-based when its tenure_age_horizon_years
      is above 0. A loan carries at most one submitted payout plan change request at a time, so the submitted change
      request onto the HECM Line of Credit is a single request. Interest accruals and line growth credits each post
      once a month, so the most recent one is a single entry.
    age_now: >-
      For the payment release the borrower's age is the youngest_borrower_age_at_closing plus the whole years from
      the closing date to the handling date (whole calendar months between two dates are complete on the later month's
      day with the same day number as the earlier date, or on the first day of the following month when that month
      has no such day number, and whole years are twelve whole months), and a plan is tenure-based when its tenure_age_horizon_years
      is above 0. A loan carries at most one submitted payout plan change request at a time, so the submitted change
      request onto the HECM Line of Credit is a single request. Interest accruals and line growth credits each post
      once a month, so the most recent one is a single entry.
    made: >-
      Under the standard rule the remaining payments are, for a tenure-based plan, twelve times the difference between
      tenure_age_horizon_years and the borrower's age, and for a term-based plan scheduled_payment_term_months less
      the scheduled payments already disbursed on the loan; the timing adjustment, the processing credit and the
      amount kept committed are 0.00; and the standard value is the value of the remaining payments counted in this
      standard way.
    n_base: >-
      Under the standard rule the remaining payments are, for a tenure-based plan, twelve times the difference between
      tenure_age_horizon_years and the borrower's age, and for a term-based plan scheduled_payment_term_months less
      the scheduled payments already disbursed on the loan; the timing adjustment, the processing credit and the
      amount kept committed are 0.00; and the standard value is the value of the remaining payments counted in this
      standard way.
    sv: >-
      Under the standard rule the remaining payments are, for a tenure-based plan, twelve times the difference between
      tenure_age_horizon_years and the borrower's age, and for a term-based plan scheduled_payment_term_months less
      the scheduled payments already disbursed on the loan; the timing adjustment, the processing credit and the
      amount kept committed are 0.00; and the standard value is the value of the remaining payments counted in this
      standard way.
    n_rel: >-
      In place of the standard remaining payments Cedarline applies the HUD five-year minimum: on a tenure-based
      plan where twelve times the difference between tenure_age_horizon_years and the borrower's age is less than
      five_year_minimum_months, the remaining payments are five_year_minimum_months; on any other tenure-based plan
      they are twelve times that difference; on a term-based plan they are scheduled_payment_term_months less the
      scheduled payments already disbursed on the loan.
    tadj: >-
      Added to the timing adjustment, Cedarline follows the payment calendar of the handling month: when a scheduled
      payment was disbursed on a date after the same day of the previous month, the handling month is already paid
      and the first remaining payment is a month away, so the timing adjustment is minus the standard value times
      the monthly rate divided by (1 + the monthly rate); when none was disbursed in that window but one was disbursed
      on a date after the same day two months before the handling date, the handling month's payment is still owed,
      so the timing adjustment is the scheduled_payment_amount less the standard value times the monthly rate divided
      by (1 + the monthly rate); otherwise the timing adjustment is 0.00.
    pc_lump: >-
      Added to the amount kept committed, until the loan's property charge repayment record is closed, is the part
      of a property charge arrearage the repayment plan will not collect in the coming year, a loan holding at most
      one open record: when that record is in notice_period, pending_signature or defaulted with an arrearage_balance
      above 0.00, it is the whole arrearage_balance; when it is active with an arrearage_balance above 0.00 and
      a monthly_installment above 0.00, it is the arrearage_balance less installments_in_coming_year monthly installments,
      never below 0.00; otherwise it is 0.00.
    pc_act: >-
      Added to the amount kept committed, until the loan's property charge repayment record is closed, is the part
      of a property charge arrearage the repayment plan will not collect in the coming year, a loan holding at most
      one open record: when that record is in notice_period, pending_signature or defaulted with an arrearage_balance
      above 0.00, it is the whole arrearage_balance; when it is active with an arrearage_balance above 0.00 and
      a monthly_installment above 0.00, it is the arrearage_balance less installments_in_coming_year monthly installments,
      never below 0.00; otherwise it is 0.00.
    pc_inst: >-
      Added to the amount kept committed, until the loan's property charge repayment record is closed, is the part
      of a property charge arrearage the repayment plan will not collect in the coming year, a loan holding at most
      one open record: when that record is in notice_period, pending_signature or defaulted with an arrearage_balance
      above 0.00, it is the whole arrearage_balance; when it is active with an arrearage_balance above 0.00 and
      a monthly_installment above 0.00, it is the arrearage_balance less installments_in_coming_year monthly installments,
      never below 0.00; otherwise it is 0.00.
    defer: >-
      Added to the amount kept committed, until the loan's property charge repayment record is closed, is the part
      of a property charge arrearage the repayment plan will not collect in the coming year, a loan holding at most
      one open record: when that record is in notice_period, pending_signature or defaulted with an arrearage_balance
      above 0.00, it is the whole arrearage_balance; when it is active with an arrearage_balance above 0.00 and
      a monthly_installment above 0.00, it is the arrearage_balance less installments_in_coming_year monthly installments,
      never below 0.00; otherwise it is 0.00.
    req_date: >-
      Added to the processing credit, Cedarline credits line growth on the standard value for the time the signed
      change request waited, at the annual rate applied by the most recent line growth posted on the loan (0 when
      none has posted): when the whole calendar months from the request_date of the submitted change request onto
      the HECM Line of Credit to the handling date, counted in the same way, are at least one, the processing credit
      is the standard value times one twelfth of that rate, divided by 100, times those months; otherwise, when
      the calendar days from that request_date to the handling date are at least processing_credit_days, it is the
      standard value times that rate, divided by 100, times those days divided by 365; otherwise it is 0.00.
    g_rate: >-
      Added to the processing credit, Cedarline credits line growth on the standard value for the time the signed
      change request waited, at the annual rate applied by the most recent line growth posted on the loan (0 when
      none has posted): when the whole calendar months from the request_date of the submitted change request onto
      the HECM Line of Credit to the handling date, counted in the same way, are at least one, the processing credit
      is the standard value times one twelfth of that rate, divided by 100, times those months; otherwise, when
      the calendar days from that request_date to the handling date are at least processing_credit_days, it is the
      standard value times that rate, divided by 100, times those days divided by 365; otherwise it is 0.00.
    credit: >-
      Added to the processing credit, Cedarline credits line growth on the standard value for the time the signed
      change request waited, at the annual rate applied by the most recent line growth posted on the loan (0 when
      none has posted): when the whole calendar months from the request_date of the submitted change request onto
      the HECM Line of Credit to the handling date, counted in the same way, are at least one, the processing credit
      is the standard value times one twelfth of that rate, divided by 100, times those months; otherwise, when
      the calendar days from that request_date to the handling date are at least processing_credit_days, it is the
      standard value times that rate, divided by 100, times those days divided by 365; otherwise it is 0.00.
    result: >-
      The payment release is the value of the remaining payments plus the timing adjustment plus the processing
      credit, less the amount kept committed, floored at 0.00 and rounded half up to the cent once, at the end,
      where the value of the remaining payments is the scheduled_payment_amount times (1 + the monthly rate) times
      (1 - (1 + the monthly rate) to the power of minus the remaining payments) divided by the monthly rate, and
      the monthly rate is one twelfth of the sum of the loan's expected_rate_pct and annual_mip_rate_pct, divided
      by 100.
  factors:
  - id: release_count_floor
    effect: parameter
    decides: n_rel
    bindings:
    - n_rel
    ladder:
    - when: >-
        a tenure-based plan where twelve times the difference between tenure_age_horizon_years and the borrower's
        age is below five_year_minimum_months
      value: five_year_minimum_months
    - when: any other tenure-based plan
      value: >-
        twelve times the difference between tenure_age_horizon_years and the borrower's age
    - when: otherwise (a term-based plan)
      value: scheduled_payment_term_months less the scheduled payments already disbursed
    baseline:
      n_rel: n_base
    evidence:
    - history
    cross_difficulty: null
  - id: release_timing
    effect: method
    decides: tadj
    bindings:
    - tadj
    ladder:
    - when: >-
        a scheduled payment was disbursed on a date after the same day of the previous month
      method: minus one month's discount on the standard value
    - when: >-
        none in that window but one after the same day two months before the handling date
      method: the owed payment at face less one month's discount on the standard value
    - when: otherwise
      method: no adjustment (0.00)
    baseline:
      tadj: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: release_arrearage_deferral
    effect: parameter
    decides: defer
    bindings:
    - pc_lump
    - pc_act
    - pc_inst
    - defer
    ladder:
    - when: >-
        the loan's open property charge repayment record is in notice_period, pending_signature or defaulted with
        an arrearage_balance above 0.00
      value: its whole arrearage_balance
    - when: >-
        the open record is active with an arrearage_balance and a monthly_installment above 0.00
      value: >-
        the arrearage_balance less installments_in_coming_year monthly installments, never below 0.00
    - when: otherwise
      value: '0.00'
    baseline:
      defer: '0'
    evidence:
    - cross_category
    cross_difficulty: propcharge
  - id: release_processing_credit
    effect: method
    decides: credit
    bindings:
    - req_date
    - g_rate
    - credit
    ladder:
    - when: the change request has waited at least one whole calendar month
      method: 'month-count convention: standard value x latest growth rate / 1200 x months'
    - when: it has waited at least processing_credit_days calendar days
      method: 'day-count convention: standard value x latest growth rate / 100 x days / 365'
    - when: otherwise
      method: no credit (0.00)
    baseline:
      credit: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      For the payment release the borrower's age is the youngest_borrower_age_at_closing plus the whole years from
      the closing date to the handling date (whole calendar months between two dates are complete on the later month's
      day with the same day number as the earlier date, or on the first day of the following month when that month
      has no such day number, and whole years are twelve whole months), and a plan is tenure-based when its tenure_age_horizon_years
      is above 0. A loan carries at most one submitted payout plan change request at a time, so the submitted change
      request onto the HECM Line of Credit is a single request. Interest accruals and line growth credits each post
      once a month, so the most recent one is a single entry. The payment release is the value of the remaining
      payments plus the timing adjustment plus the processing credit, less the amount kept committed, floored at
      0.00 and rounded half up to the cent once, at the end, where the value of the remaining payments is the scheduled_payment_amount
      times (1 + the monthly rate) times (1 - (1 + the monthly rate) to the power of minus the remaining payments)
      divided by the monthly rate, and the monthly rate is one twelfth of the sum of the loan's expected_rate_pct
      and annual_mip_rate_pct, divided by 100. Under the standard rule the remaining payments are, for a tenure-based
      plan, twelve times the difference between tenure_age_horizon_years and the borrower's age, and for a term-based
      plan scheduled_payment_term_months less the scheduled payments already disbursed on the loan; the timing adjustment,
      the processing credit and the amount kept committed are 0.00; and the standard value is the value of the remaining
      payments counted in this standard way.
    params:
    - annual_mip_rate_pct
    - tenure_age_horizon_years
  prerequisite: []
  cross_category:
  - category: propcharge
    as: branch
    reads:
    - status
    - arrearage_balance
    - monthly_installment
    note: >-
      The amount kept committed reads the loan's open property charge repayment record.
  inputs:
    history:
    - table: hecm_transactions
      aggregate: count
      field: hecm_txn_id
      filters:
        event_type: hecm_scheduled_payment
    - table: hecm_transactions
      aggregate: latest
      field: rate_applied_pct
      filters:
        event_type: hecm_line_growth
    - table: hecm_requests
      aggregate: latest
      field: request_date
      filters:
        request_type: payment_plan_change
        request_status: submitted
    cross_category:
    - propcharge
- id: hecm_ext_reinstatement_restore
  base_policy_refs:
  - hecm_evt_prepayment
  overwrite:
  - base_policy: hecm_evt_prepayment
    superseded_clause: >-
      on the fixed-rate single disbursement plan, and on any loan that is due_and_payable or in the deferral period,
      restores_line is false and nothing is restored.
    replaced_by: >-
      On the fixed-rate single disbursement plan, and on any loan that is due_and_payable or in the deferral period,
      restores_line is false and nothing is restored at the time; once a loan other than a fixed-rate single disbursement
      returns to active status after a cured maturity case, and only then, the portions it posted with restores_line
      false are credited back through the reinstatement restoration.
  trigger: state_due
  subject:
  - hecm_line_restore
  computes: restore_amount
  target_tool: restore_reinstated_line_c85e4df8
  params:
    restoration_grace_months: 3
    cure_holdback_pct: 10
    slow_cure_holdback_pct: 25
  rule: >-
    When a loan returns to active status after a cured maturity case, Cedarline books the reinstatement restoration,
    the amount credited back to the available line for the prepaid portions applied while the loan was due and payable.
    On the fixed-rate single disbursement plan, and on any loan that is due_and_payable or in the deferral period,
    restores_line is false and nothing is restored at the time; once a loan other than a fixed-rate single disbursement
    returns to active status after a cured maturity case, and only then, the portions it posted with restores_line
    false are credited back through the reinstatement restoration. The reinstatement restoration is booked as one
    line restoration entry referencing the most recent prepaid portion posted on the loan with restores_line false,
    and that one entry covers every portion posted on the loan with restores_line false; a loan with no such portion
    has nothing to restore. The reinstatement restoration is the portions counted, less the amount kept back, plus
    the wait credit, floored at 0.00 and rounded half up to the cent once, at the end, where the wait credit is
    the total of every portion posted on the loan with restores_line false times the wait credit rate, divided by
    100, times the wait period. The cured maturity case is the case named by the loan's most recent cure confirmation
    notice; a loan has at most one open maturity case at a time, so its cure confirmation notices fall on different
    dates. Interest accruals and line growth credits each post once a month, so the most recent one is a single
    entry. Under the standard rule the portions counted are the principal portions posted on the loan with restores_line
    false, the amount kept back is 0.00, the wait credit rate is the annual growth rate applied by the most recent
    line growth credit on the loan, or the note_rate_pct plus the plan's line_growth_spread_pct when none has been
    credited, and the wait period is the calendar days from the cured maturity case's closed_date to the handling
    date divided by 365, or 0 when the loan has no cured case. In place of the standard portions counted, Cedarline
    counts by how the cured case was put right: when the loan's cured maturity case is a Property Charge Default
    and no property charge repayment record on the loan is active, the arrearage having been repaid, every portion
    posted with restores_line false counts, whatever its allocation bucket; when the cured case is a Property Charge
    Default and a property charge repayment record on the loan is active, the cure resting on a repayment plan,
    the principal and interest portions posted with restores_line false count; otherwise only the principal portions
    posted with restores_line false count. In place of the standard wait period, Cedarline counts the wait in whole
    months (whole calendar months between two dates are complete on the later month's day with the same day number
    as the earlier date, or on the first day of the following month when that month has no such day number, and
    whole years are twelve whole months): when more than restoration_grace_months whole calendar months have passed
    since the cured case's closed_date, the wait period is those whole months divided by 12; when at least one and
    no more than restoration_grace_months whole months have passed, it is those whole months less one, divided by
    12; otherwise the wait period is 0. In place of the standard wait credit rate: when the loan's current note
    rate took effect after the cured case's closed_date, the wait credit rate is the note_rate_pct plus the plan's
    line_growth_spread_pct; when it took effect after the cured case's due_and_payable_date and no later than that
    closed_date, it is the average of the standard wait credit rate and the note_rate_pct plus the line_growth_spread_pct;
    otherwise it is the standard wait credit rate. Added to the amount kept back, by how long the cured case ran:
    when more than sixty calendar days passed from the cured case's due_and_payable_date to its closed_date, slow_cure_holdback_pct
    percent of the total of every portion posted with restores_line false; when more than thirty and no more than
    sixty days passed, cure_holdback_pct percent of that total; otherwise nothing. The amount kept back is credited
    to the line by a further line restoration entry once twelve months pass after the cure without a new property
    charge default on the loan.
  compute:
  - dp_all: >-
      SUM('hecm_transactions', 'amount', event_type='hecm_prepayment', restores_line=False)
  - dp_prin: >-
      SUM('hecm_transactions', 'amount', event_type='hecm_prepayment', restores_line=False, allocation_bucket='principal')
  - dp_int: >-
      SUM('hecm_transactions', 'amount', event_type='hecm_prepayment', restores_line=False, allocation_bucket='interest')
  - cure_case: >-
      XLATEST('maturity', 'maturity_case_events', 'maturity_case_id', date_field='effective_date', event_type='maturity_notice_sent',
      notice_type='cure_confirmation') or 'none'
  - cure_type: >-
      CFIELD('maturity', 'variant_name', maturity_case_id=cure_case, status='cured') or 'none'
  - pc_act_n: 1 if EXISTS('propcharge', hecm_loan_id=HID, status='active') else 0
  - scope_amt: >-
      dp_all if (cure_type == 'Property Charge Default' and pc_act_n == 0) else (dp_prin + dp_int if (cure_type
      == 'Property Charge Default' and pc_act_n == 1) else dp_prin)
  - cure_date: >-
      CFIELD('maturity', 'closed_date', maturity_case_id=cure_case, status='cured') or NOW
  - dp_date: >-
      CFIELD('maturity', 'due_and_payable_date', maturity_case_id=cure_case, status='cured') or cure_date
  - lag_period: >-
      MONTHS(cure_date, NOW) / 12 if MONTHS(cure_date, NOW) > K('restoration_grace_months') else ((MONTHS(cure_date,
      NOW) - 1) / 12 if MONTHS(cure_date, NOW) >= 1 else 0)
  - last_growth: >-
      float(LATEST('hecm_transactions', 'rate_applied_pct', date_field='effective_date', event_type='hecm_line_growth')
      or 0)
  - nsp: float(F('note_rate_pct')) + P('line_growth_spread_pct')
  - std_rate: last_growth if last_growth > 0 else nsp
  - lag_rate: >-
      nsp if F('rate_change_date') > (CFIELD('maturity', 'closed_date', maturity_case_id=cure_case, status='cured')
      or NOW) else ((std_rate + nsp) / 2 if F('rate_change_date') > dp_date else std_rate)
  - hb: >-
      dp_all * K('slow_cure_holdback_pct') / 100 if DAYS(dp_date, cure_date) > 60 else (dp_all * K('cure_holdback_pct')
      / 100 if DAYS(dp_date, cure_date) > 30 else 0)
  - result: RND(MX(0, scope_amt - hb + dp_all * lag_rate / 100 * lag_period), 2)
