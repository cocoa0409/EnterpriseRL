  baseline:
    rule: >-
      The draw ceiling is the drawable figure less the amounts kept, each amount worked out on its own and added
      to the amounts kept, the result floored at 0.00; the only roundings are those stated for an amount itself
      and the final rounding of the draw ceiling, half up to the cent. On or after the first anniversary of the
      loan closing the drawable figure is the loan's available_line. Before the first anniversary the drawable figure
      is the lesser of the available_line and the draw ceiling's own first-year room. The first anniversary is the
      same day number in the month first_year_period_months calendar months after the closing date, falling back
      to the last day of that month when that day does not exist; for a draw request sized at the draw ceiling,
      and only for such a request, the first anniversary is reached once first_year_period_months whole calendar
      months have passed since the closing date, a whole month being complete on the later month's day with the
      closing date's day number, or on the first day of the following month when that month has no such day number.
      During the first-year period the closing disbursement amount plus hecm_msr_first_year_draws plus the requested
      draw may not exceed the loan's initial_disbursement_limit; for a draw request sized at the draw ceiling, and
      only for such a request, that limit is applied through the draw ceiling's own first-year room, the initial_disbursement_limit
      less the closing_disbursement_amount less the draw ceiling's first-year draws, which count every advance posting
      of type loc_draw on the loan at its amount less every return entry crediting a draw back to the line. Under
      the standard rule no amount is kept in the line or earmarked for the draw ceiling, so the amounts kept are
      0.00.
    params:
    - first_year_period_months
  prerequisite:
  - problem: hecm_ext_payment_release
    kind: value_input
    gate: line
    form: state
    policy_source: >-
      The draw ceiling is worked out only once no payout plan change request on file for the loan still shows request
      status submitted.
    condition: >-
      No hecm_requests row of the loan with request_type payment_plan_change has request_status submitted.
    resolved_by: convert_payout_plan_to_line_d82e9c7e
    effect: >-
      Processing the submitted change onto the Line of Credit sets its request to processed and credits the payment
      release to the available_line, which is the drawable figure after the first anniversary.
  - problem: hecm_ext_check_void
    kind: value_input
    gate: line
    form: state
    policy_source: >-
      The draw ceiling is not worked out until every check draw on the loan whose draw request shows request status
      withdrawn carries its return entry.
    condition: >-
      Every hecm_loc_draw row of the loan disbursed by check whose hecm_request_id names a hecm_requests row with
      request_status withdrawn has a hecm_disbursement_return row referencing it.
    resolved_by: void_uncashed_draw_check_f08764ed
    effect: >-
      The return entry credits the stopped check back to the available_line (and, before the first anniversary,
      lowers the first-year draws by its amount), raising the drawable figure.
  cross_category:
  - category: propcharge
    as: history
    reads:
    - status
    - arrearage_balance
    - monthly_installment
    - propcharge_transactions.amount
    - propcharge_transactions.charge_type
    note: >-
      The arrangement reserve reads the open repayment record; the tax and insurance renewal reserves read the advances
      of the last twelve months.
  - category: setaside
    as: branch
    reads:
    - status
    - annual_property_tax
    note: The tax renewal reserve falls back on a depleted set-aside's annual tax.
  - category: residency
    as: branch
    reads:
    - status
    - occupancy_inspection_fee
    note: >-
      The inspection reserve reads the occupancy certification profile and its plan's fee.
  inputs:
    history:
    - table: hecm_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: hecm_advance_posting
        advance_type: loc_draw
    - table: hecm_requests
      aggregate: sum
      field: requested_amount
      filters:
        request_type: loc_draw
        request_status: submitted
    - table: hecm_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: hecm_advance_posting
        advance_type: occupancy_inspection_fee
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: propcharge_advance
    cross_category:
    - propcharge
    - setaside
    - residency
- id: hecm_ext_check_void
  base_policy_refs:
  - hecm_evt_servicing_fee
  - hecm_evt_disbursement_return
  overwrite:
  - base_policy: hecm_evt_disbursement_return
    superseded_clause: >-
      On plans whose returned_disbursement_line_credit is true, a draw that the receiving bank returns, or a draw
      check that is voided as uncashed, is credited back to the available line by one hecm_disbursement_return and
      reversed from the balance on the same date by one hecm_advance_reversal with advance_type loc_draw, both for
      the full draw amount and both referencing the original draw in source_txn_ref.
    replaced_by: >-
      On plans whose returned_disbursement_line_credit is true, a draw that the receiving bank returns, or a draw
      check that is voided as uncashed, is credited back to the available line by one return entry and reversed
      from the balance on the same date by one reversal of type loc_draw, both for the full draw amount and both
      referencing the original draw; for a stopped draw check, and only for such a check, the reversal is instead
      for the stopped-check settlement while the return entry stays at the full draw amount.
  - base_policy: hecm_evt_disbursement_return
    superseded_clause: >-
      A draw check is voided as uncashed only when uncashed_check_void_days calendar days have passed since the
      draw was disbursed.
    replaced_by: >-
      A draw check is voided as uncashed only when uncashed_check_void_days calendar days have passed since the
      draw was disbursed; a stopped draw check, and only such a check, is voided as uncashed on the handling date
      with no waiting period.
  - base_policy: hecm_evt_disbursement_return
    superseded_clause: >-
      Each original transaction is reversed from the balance at most once, and a reversal never exceeds the original
      amount; for a returned draw the reversal references the original draw itself.
    replaced_by: >-
      Each original transaction is reversed from the balance at most once, and a reversal never exceeds the original
      amount; for a returned draw the reversal references the original draw itself; the reversal for a stopped draw
      check, and only that reversal, exceeds the original amount by the interest, premium and compounding returned
      with it.
  trigger: state_due
  subject:
  - hecm_disbursement_return
  - hecm_advance_reversal
  computes: reversal_amount
  target_tool: void_uncashed_draw_check_f08764ed
  params:
    premium_return_cap_months: 6
    compounding_after_months: 6
    premium_compounding_after_months: 3
  rule: >-
    When a borrower stops a line-of-credit draw check before cashing it, Cedarline voids the stopped draw check
    and books the stopped-check settlement, the amount taken off the loan balance for it. A borrower who reports
    a disbursed draw check lost or unwanted before it is cashed has Cedarline stop payment on it, and Cedarline
    records the stop by marking that check's draw request with request status withdrawn; Cedarline takes a stop
    on a draw check only while no other stopped draw check on the loan awaits its return entry, so a loan carries
    at most one stopped draw check awaiting its return entry at a time, and every stopped draw check a loan ever
    has is handled under this rule in turn. The stopped draw check handled is the line-of-credit draw that references
    the loan's most recently created draw request, by its created_at timestamp, with disbursement method check and
    request status withdrawn, handled only while no return entry references that draw; the stopped check's amount
    is the amount of that draw, and a loan with no such draw has nothing to settle. A draw check is voided as uncashed
    only when uncashed_check_void_days calendar days have passed since the draw was disbursed; a stopped draw check,
    and only such a check, is voided as uncashed on the handling date with no waiting period. The accrual months
    charged are the number of calendar months from the month of the stopped check's effective_date to the month
    of the most recent interest accrual posted on the loan, when that accrual is dated after the effective_date,
    and 0 when no interest accrual is dated after it; interest accruals post once a month, so the most recent one
    is a single entry. The stopped-check settlement is the stopped check's amount plus the interest returned, the
    premium returned and the compounding returned, rounded half up to the cent once, at the end, where the interest
    returned is the stopped check's amount times the interest rate, divided by 100, times the accrual months charged,
    divided by 12, and the premium returned is the stopped check's amount times the plan's annual_mip_rate_pct,
    divided by 100, times the premium months, divided by 12. Under the standard rule the interest rate is the note_rate_pct,
    the premium months are the accrual months charged, and the compounding returned is 0.00. In place of the standard
    interest rate Cedarline uses the rate the stopped check was actually charged at: for a monthly adjustable loan
    the interest rate is the annual rate applied by the most recent interest accrual posted on the loan, or the
    note_rate_pct when none has posted; for an annual adjustable loan whose current note rate took effect after
    the stopped check's effective_date, it is the average of the note_rate_pct and that same most recent applied
    rate; otherwise it is the note_rate_pct. In place of the standard premium months Cedarline returns the premium
    only for the months it can still correct with FHA: when the accrual months charged exceed premium_return_cap_months,
    the premium months are premium_return_cap_months; when a mortgage insurance premium accrual posted on the loan
    is dated after the stopped check's effective_date, the premium months are the accrual months charged; otherwise
    the premium months are 0. Added to the compounding returned is the interest the monthly ledger charged on the
    stopped check's earlier interest, figured at the last applied rate, the annual rate applied by the most recent
    interest accrual posted on the loan or the note_rate_pct when none has posted: when the accrual months charged
    exceed compounding_after_months, it is the stopped check's amount times ((1 + the last applied rate / 1200)
    to the power of the accrual months charged, less 1, less the last applied rate / 1200 times the accrual months
    charged); when the accrual months charged are at least two and no more than compounding_after_months, it is
    the stopped check's amount times the square of (the last applied rate / 1200) times the accrual months charged
    times (the accrual months charged less one) divided by 2; otherwise it is 0.00. Added to the compounding returned
    is the interest and premium the monthly ledger charged on the stopped check's earlier premium, over the premium-correctable
    months, the accrual months charged but no more than premium_return_cap_months, with the monthly charge being
    the last applied rate plus the plan's annual_mip_rate_pct, divided by 1200: when the premium-correctable months
    exceed premium_compounding_after_months, it is the stopped check's amount times ((1 + the monthly charge) to
    the power of the premium-correctable months, less (1 + the last applied rate / 1200) to that same power, less
    the plan's annual_mip_rate_pct / 1200 times the premium-correctable months); when the premium-correctable months
    are at least two and no more than premium_compounding_after_months, it is the stopped check's amount times the
    plan's annual_mip_rate_pct / 1200 times the monthly charge times the premium-correctable months times (the premium-correctable
    months less one) divided by 2; otherwise it is 0.00. On plans whose returned_disbursement_line_credit is true,
    a draw that the receiving bank returns, or a draw check that is voided as uncashed, is credited back to the
    available line by one return entry and reversed from the balance on the same date by one reversal of type loc_draw,
    both for the full draw amount and both referencing the original draw; for a stopped draw check, and only for
    such a check, the reversal is instead for the stopped-check settlement while the return entry stays at the full
    draw amount. Each original transaction is reversed from the balance at most once, and a reversal never exceeds
    the original amount; for a returned draw the reversal references the original draw itself; the reversal for
    a stopped draw check, and only that reversal, exceeds the original amount by the interest, premium and compounding
    returned with it.
  compute:
  - stop_rq: >-
      LATEST('hecm_requests', 'hecm_request_id', date_field='created_at', request_type='loc_draw', disbursement_method='check',
      request_status='withdrawn') or 'none'
  - chk_amt: >-
      SUM('hecm_transactions', 'amount', event_type='hecm_loc_draw', hecm_request_id=stop_rq)
  - chk_date: >-
      LATEST('hecm_transactions', 'effective_date', date_field='effective_date', event_type='hecm_loc_draw', hecm_request_id=stop_rq)
      or NOW
  - last_acc: >-
      LATEST('hecm_transactions', 'effective_date', date_field='effective_date', event_type='hecm_interest_accrual')
      or '1900-01-01'
  - n: >-
      MONTHS('2000-01-01', last_acc) - MONTHS('2000-01-01', chk_date) if last_acc > chk_date else 0
  - acc_rate: >-
      float(LATEST('hecm_transactions', 'rate_applied_pct', date_field='effective_date', event_type='hecm_interest_accrual')
      or F('note_rate_pct'))
  - i_rate: >-
      acc_rate if F('rate_type') == 'monthly_adjustable' else ((float(F('note_rate_pct')) + acc_rate) / 2 if (F('rate_type')
      == 'annual_adjustable' and F('rate_change_date') > chk_date) else float(F('note_rate_pct')))
  - last_mip: >-
      LATEST('hecm_transactions', 'effective_date', date_field='effective_date', event_type='hecm_mip_accrual')
      or '1900-01-01'
  - prem_months: >-
      K('premium_return_cap_months') if n > K('premium_return_cap_months') else (n if last_mip > chk_date else 0)
  - lr: >-
      float(LATEST('hecm_transactions', 'rate_applied_pct', date_field='effective_date', event_type='hecm_interest_accrual')
      or F('note_rate_pct')) / 1200
  - icomp: >-
      chk_amt * ((1 + lr) ** n - 1 - lr * n) if n > K('compounding_after_months') else (chk_amt * lr * lr * n *
      (n - 1) / 2 if n >= 2 else 0)
  - lr2: >-
      float(LATEST('hecm_transactions', 'rate_applied_pct', date_field='effective_date', event_type='hecm_interest_accrual')
      or F('note_rate_pct')) / 1200
  - k: MN(n, K('premium_return_cap_months'))
  - mc: lr2 + P('annual_mip_rate_pct') / 1200
  - pcomp: >-
      chk_amt * ((1 + mc) ** k - (1 + lr2) ** k - P('annual_mip_rate_pct') / 1200 * k) if k > K('premium_compounding_after_months')
      else (chk_amt * P('annual_mip_rate_pct') / 1200 * mc * k * (k - 1) / 2 if k >= 2 else 0)
  - result: >-
      RND(chk_amt + chk_amt * i_rate / 100 * n / 12 + chk_amt * P('annual_mip_rate_pct') / 100 * prem_months / 12
      + icomp + pcomp, 2)
  compute_basis:
    stop_rq: >-
      The stopped draw check handled is the line-of-credit draw that references the loan's most recently created
      draw request, by its created_at timestamp, with disbursement method check and request status withdrawn, handled
      only while no return entry references that draw; the stopped check's amount is the amount of that draw, and
      a loan with no such draw has nothing to settle.
    chk_amt: >-
      The stopped draw check handled is the line-of-credit draw that references the loan's most recently created
      draw request, by its created_at timestamp, with disbursement method check and request status withdrawn, handled
      only while no return entry references that draw; the stopped check's amount is the amount of that draw, and
      a loan with no such draw has nothing to settle.
    chk_date: >-
      The stopped draw check handled is the line-of-credit draw that references the loan's most recently created
      draw request, by its created_at timestamp, with disbursement method check and request status withdrawn, handled
      only while no return entry references that draw; the stopped check's amount is the amount of that draw, and
      a loan with no such draw has nothing to settle.
    last_acc: >-
      The accrual months charged are the number of calendar months from the month of the stopped check's effective_date
      to the month of the most recent interest accrual posted on the loan, when that accrual is dated after the
      effective_date, and 0 when no interest accrual is dated after it; interest accruals post once a month, so
      the most recent one is a single entry.
    n: >-
      The accrual months charged are the number of calendar months from the month of the stopped check's effective_date
      to the month of the most recent interest accrual posted on the loan, when that accrual is dated after the
      effective_date, and 0 when no interest accrual is dated after it; interest accruals post once a month, so
      the most recent one is a single entry.
    acc_rate: >-
      In place of the standard interest rate Cedarline uses the rate the stopped check was actually charged at:
      for a monthly adjustable loan the interest rate is the annual rate applied by the most recent interest accrual
      posted on the loan, or the note_rate_pct when none has posted; for an annual adjustable loan whose current
      note rate took effect after the stopped check's effective_date, it is the average of the note_rate_pct and
      that same most recent applied rate; otherwise it is the note_rate_pct.
    i_rate: >-
      In place of the standard interest rate Cedarline uses the rate the stopped check was actually charged at:
      for a monthly adjustable loan the interest rate is the annual rate applied by the most recent interest accrual
      posted on the loan, or the note_rate_pct when none has posted; for an annual adjustable loan whose current
      note rate took effect after the stopped check's effective_date, it is the average of the note_rate_pct and
      that same most recent applied rate; otherwise it is the note_rate_pct.
    last_mip: >-
      In place of the standard premium months Cedarline returns the premium only for the months it can still correct
      with FHA: when the accrual months charged exceed premium_return_cap_months, the premium months are premium_return_cap_months;
      when a mortgage insurance premium accrual posted on the loan is dated after the stopped check's effective_date,
      the premium months are the accrual months charged; otherwise the premium months are 0.
    prem_months: >-
      In place of the standard premium months Cedarline returns the premium only for the months it can still correct
      with FHA: when the accrual months charged exceed premium_return_cap_months, the premium months are premium_return_cap_months;
      when a mortgage insurance premium accrual posted on the loan is dated after the stopped check's effective_date,
      the premium months are the accrual months charged; otherwise the premium months are 0.
    lr: >-
      Added to the compounding returned is the interest the monthly ledger charged on the stopped check's earlier
      interest, figured at the last applied rate, the annual rate applied by the most recent interest accrual posted
      on the loan or the note_rate_pct when none has posted: when the accrual months charged exceed compounding_after_months,
      it is the stopped check's amount times ((1 + the last applied rate / 1200) to the power of the accrual months
      charged, less 1, less the last applied rate / 1200 times the accrual months charged); when the accrual months
      charged are at least two and no more than compounding_after_months, it is the stopped check's amount times
      the square of (the last applied rate / 1200) times the accrual months charged times (the accrual months charged
      less one) divided by 2; otherwise it is 0.00.
    icomp: >-
      Added to the compounding returned is the interest the monthly ledger charged on the stopped check's earlier
      interest, figured at the last applied rate, the annual rate applied by the most recent interest accrual posted
      on the loan or the note_rate_pct when none has posted: when the accrual months charged exceed compounding_after_months,
      it is the stopped check's amount times ((1 + the last applied rate / 1200) to the power of the accrual months
      charged, less 1, less the last applied rate / 1200 times the accrual months charged); when the accrual months
      charged are at least two and no more than compounding_after_months, it is the stopped check's amount times
      the square of (the last applied rate / 1200) times the accrual months charged times (the accrual months charged
      less one) divided by 2; otherwise it is 0.00.
    lr2: >-
      Added to the compounding returned is the interest and premium the monthly ledger charged on the stopped check's
      earlier premium, over the premium-correctable months, the accrual months charged but no more than premium_return_cap_months,
      with the monthly charge being the last applied rate plus the plan's annual_mip_rate_pct, divided by 1200:
      when the premium-correctable months exceed premium_compounding_after_months, it is the stopped check's amount
      times ((1 + the monthly charge) to the power of the premium-correctable months, less (1 + the last applied
      rate / 1200) to that same power, less the plan's annual_mip_rate_pct / 1200 times the premium-correctable
      months); when the premium-correctable months are at least two and no more than premium_compounding_after_months,
      it is the stopped check's amount times the plan's annual_mip_rate_pct / 1200 times the monthly charge times
      the premium-correctable months times (the premium-correctable months less one) divided by 2; otherwise it
      is 0.00.
    k: >-
      Added to the compounding returned is the interest and premium the monthly ledger charged on the stopped check's
      earlier premium, over the premium-correctable months, the accrual months charged but no more than premium_return_cap_months,
      with the monthly charge being the last applied rate plus the plan's annual_mip_rate_pct, divided by 1200:
      when the premium-correctable months exceed premium_compounding_after_months, it is the stopped check's amount
      times ((1 + the monthly charge) to the power of the premium-correctable months, less (1 + the last applied
      rate / 1200) to that same power, less the plan's annual_mip_rate_pct / 1200 times the premium-correctable
      months); when the premium-correctable months are at least two and no more than premium_compounding_after_months,
      it is the stopped check's amount times the plan's annual_mip_rate_pct / 1200 times the monthly charge times
      the premium-correctable months times (the premium-correctable months less one) divided by 2; otherwise it
      is 0.00.
    mc: >-
      Added to the compounding returned is the interest and premium the monthly ledger charged on the stopped check's
      earlier premium, over the premium-correctable months, the accrual months charged but no more than premium_return_cap_months,
      with the monthly charge being the last applied rate plus the plan's annual_mip_rate_pct, divided by 1200:
      when the premium-correctable months exceed premium_compounding_after_months, it is the stopped check's amount
      times ((1 + the monthly charge) to the power of the premium-correctable months, less (1 + the last applied
      rate / 1200) to that same power, less the plan's annual_mip_rate_pct / 1200 times the premium-correctable
      months); when the premium-correctable months are at least two and no more than premium_compounding_after_months,
      it is the stopped check's amount times the plan's annual_mip_rate_pct / 1200 times the monthly charge times
      the premium-correctable months times (the premium-correctable months less one) divided by 2; otherwise it
      is 0.00.
    pcomp: >-
      Added to the compounding returned is the interest and premium the monthly ledger charged on the stopped check's
      earlier premium, over the premium-correctable months, the accrual months charged but no more than premium_return_cap_months,
      with the monthly charge being the last applied rate plus the plan's annual_mip_rate_pct, divided by 1200:
      when the premium-correctable months exceed premium_compounding_after_months, it is the stopped check's amount
      times ((1 + the monthly charge) to the power of the premium-correctable months, less (1 + the last applied
      rate / 1200) to that same power, less the plan's annual_mip_rate_pct / 1200 times the premium-correctable
      months); when the premium-correctable months are at least two and no more than premium_compounding_after_months,
      it is the stopped check's amount times the plan's annual_mip_rate_pct / 1200 times the monthly charge times
      the premium-correctable months times (the premium-correctable months less one) divided by 2; otherwise it
      is 0.00.
    result: >-
      The stopped-check settlement is the stopped check's amount plus the interest returned, the premium returned
      and the compounding returned, rounded half up to the cent once, at the end, where the interest returned is
      the stopped check's amount times the interest rate, divided by 100, times the accrual months charged, divided
      by 12, and the premium returned is the stopped check's amount times the plan's annual_mip_rate_pct, divided
      by 100, times the premium months, divided by 12.
  factors:
  - id: interest_return_rate
    effect: parameter
    decides: i_rate
    bindings:
    - acc_rate
    - i_rate
    ladder:
    - when: the loan is monthly adjustable
      value: >-
        the annual rate applied by the most recent interest accrual (the note_rate_pct when none has posted)
    - when: >-
        the loan is annual adjustable and its current note rate took effect after the stopped check's effective_date
      value: the average of the note_rate_pct and that most recent applied rate
    - when: otherwise
      value: the note_rate_pct
    baseline:
      i_rate: float(F('note_rate_pct'))
    evidence:
    - history
    cross_difficulty: null
  - id: premium_return_months
    effect: parameter
    decides: prem_months
    bindings:
    - last_mip
    - prem_months
    ladder:
    - when: the accrual months charged exceed premium_return_cap_months
      value: premium_return_cap_months
    - when: >-
        a mortgage insurance premium accrual is dated after the stopped check's effective_date
      value: the accrual months charged
    - when: otherwise
      value: '0'
    baseline:
      prem_months: n
    evidence:
    - history
    cross_difficulty: null
  - id: interest_compounding
    effect: method
    decides: icomp
    bindings:
    - lr
    - icomp
    ladder:
    - when: the accrual months charged exceed compounding_after_months
      method: exact monthly compounding at the last applied rate, less the simple part
    - when: the accrual months charged are two to compounding_after_months
      method: 'the first compounding term: amount x (rate/1200)^2 x n(n-1)/2'
    - when: otherwise
      method: no compounding (0.00)
    baseline:
      icomp: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: premium_compounding
    effect: method
    decides: pcomp
    bindings:
    - lr2
    - k
    - mc
    - pcomp
    ladder:
    - when: the premium-correctable months exceed premium_compounding_after_months
      method: >-
        exact monthly growth at rate plus premium, less growth at the rate alone, less the simple premium
    - when: the premium-correctable months are two to premium_compounding_after_months
      method: 'the first term: amount x premium/1200 x monthly charge x k(k-1)/2'
    - when: otherwise
      method: no premium compounding (0.00)
    baseline:
      pcomp: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The accrual months charged are the number of calendar months from the month of the stopped check's effective_date
      to the month of the most recent interest accrual posted on the loan, when that accrual is dated after the
      effective_date, and 0 when no interest accrual is dated after it; interest accruals post once a month, so
      the most recent one is a single entry. The stopped-check settlement is the stopped check's amount plus the
      interest returned, the premium returned and the compounding returned, rounded half up to the cent once, at
      the end, where the interest returned is the stopped check's amount times the interest rate, divided by 100,
      times the accrual months charged, divided by 12, and the premium returned is the stopped check's amount times
      the plan's annual_mip_rate_pct, divided by 100, times the premium months, divided by 12. Under the standard
      rule the interest rate is the note_rate_pct, the premium months are the accrual months charged, and the compounding
      returned is 0.00.
    params:
    - annual_mip_rate_pct
  prerequisite: []
  cross_category: []
  inputs:
    history:
    - table: hecm_requests
      aggregate: latest
      field: hecm_request_id
      filters:
