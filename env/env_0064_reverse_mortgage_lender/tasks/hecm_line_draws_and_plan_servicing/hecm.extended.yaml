- id: hecm_ext_payment_reset
  base_policy_refs:
  - hecm_payment_plan_change
  overwrite:
  - base_policy: hecm_payment_plan_change
    superseded_clause: >-
      The new scheduled payment is the committed amount times the monthly rate divided by ((1 + monthly rate) times
      (1 - (1 + monthly rate) to the power of minus the payment count)), rounded half up to the cent, where the
      payment count is the requested term for a term-based plan and, for a tenure-based plan, twelve times the difference
      between tenure_age_horizon_years and that same youngest age.
    replaced_by: >-
      The new scheduled payment is the committed amount times the monthly rate divided by ((1 + monthly rate) times
      (1 - (1 + monthly rate) to the power of minus the payment count)), rounded half up to the cent, where the
      payment count is the requested term for a term-based plan and, for a tenure-based plan, twelve times the difference
      between tenure_age_horizon_years and that same youngest age; for the new scheduled payment of a change onto
      a plan with monthly scheduled payments, and only for it, the age is the youngest_borrower_age_at_closing plus
      the whole years from the closing date to the handling date (whole calendar months between two dates are complete
      on the later month's day with the same day number as the earlier date, or on the first day of the following
      month when that month has no such day number, and whole years are twelve whole months), a tenure payment count
      below five_year_minimum_months is raised to five_year_minimum_months, and the withholdings are deducted from
      that payment.
  trigger: on_request
  subject:
  - hecm_plan_change
  computes: scheduled_payment_amount
  target_tool: process_payout_plan_change_72a1f37c
  params:
    tenure_horizon_years: 100
    five_year_minimum_months: 60
  rule: >-
    When a borrower's signed payout plan change request moves a loan onto a plan with monthly scheduled payments,
    Cedarline processes the change on the handling date: the committed amount leaves the available line, the new
    scheduled payment, term and first payment month are recorded, and payment_plan_change_fee is charged. This rule
    processes a change only for a loan whose current plan pays no scheduled payments, such as the HECM Line of Credit,
    so no payment release arises and the whole available line after any release is the loan's available_line; a
    change from a plan that pays scheduled payments needs its payment release booked first and is not processed
    under this rule. The new scheduled payment is fixed only after a signed payout plan change request for the change
    stands on file for the loan with request status submitted. A plan change is processed only while the loan status
    is active. The new scheduled payment is the committed amount times the monthly rate divided by ((1 + monthly
    rate) times (1 - (1 + monthly rate) to the power of minus the payment count)), rounded half up to the cent,
    where the payment count is the requested term for a term-based plan and, for a tenure-based plan, twelve times
    the difference between tenure_age_horizon_years and that same youngest age; for the new scheduled payment of
    a change onto a plan with monthly scheduled payments, and only for it, the age is the youngest_borrower_age_at_closing
    plus the whole years from the closing date to the handling date (whole calendar months between two dates are
    complete on the later month's day with the same day number as the earlier date, or on the first day of the following
    month when that month has no such day number, and whole years are twelve whole months), a tenure payment count
    below five_year_minimum_months is raised to five_year_minimum_months, and the withholdings are deducted from
    that payment. The new scheduled payment is the payment the committed amount buys less the withholdings, each
    withholding worked out on its own and added to the withholdings, floored at 0.00, with the only roundings those
    stated for a withholding itself and the final rounding of the new scheduled payment, half up to the cent, where
    the payment the committed amount buys is the committed amount times the payment rate divided by ((1 + the payment
    rate) times (1 - (1 + the payment rate) to the power of minus the payment count)), with every payment treated
    as made at the start of its month and the first payment in the month after the handling month, and none when
    the payment count is 0. Under the standard rule, a loan carrying at most one submitted payout plan change request
    at a time, the committed amount is the requested_amount on that request for the HECM Modified Tenure Plan or
    HECM Modified Term Plan and the whole available_line for the HECM Tenure Payment Plan or HECM Term Payment Plan,
    the payment rate is one twelfth of the sum of the expected_rate_pct and annual_mip_rate_pct, divided by 100,
    the new scheduled payment is 0.00 for a loan outside this rule's scope, the payment count is twelve times the
    difference between tenure_horizon_years and the borrower's age for a tenure-based plan (HECM Tenure Payment
    Plan or HECM Modified Tenure Plan) and the requested_term_months for any other plan, the borrower's age is the
    youngest_borrower_age_at_closing plus the whole years from the closing date to the handling date (whole calendar
    months between two dates are complete on the later month's day with the same day number as the earlier date,
    or on the first day of the following month when that month has no such day number, and whole years are twelve
    whole months), tenure_horizon_years is the tenure_age_horizon_years the tenure-based plans carry, and the withholdings
    are 0.00. In place of the standard payment count Cedarline applies the HUD five-year minimum: for a tenure-based
    plan where twelve times the difference between tenure_horizon_years and the borrower's age is below five_year_minimum_months,
    the payment count is five_year_minimum_months; for any other tenure-based plan it is twelve times that difference;
    otherwise it is the requested_term_months on the request. Added to the withholdings is a property tax escrow
    that builds, a twelfth at a time, the property tax bill falling due a year after the next one: when Cedarline
    advanced property tax on the loan on a payment date after the same day of the month twelve calendar months before
    the handling date, the total of the property tax advanced in that window divided by 12; when none was advanced
    in that window but a set-aside on the loan is depleted with an annual_property_tax above 0.00, that annual_property_tax
    divided by 12; otherwise nothing. Added to the withholdings is a hazard insurance escrow that builds, a twelfth
    at a time, the hazard renewal falling due a year after the next one: when Cedarline advanced a hazard insurance
    premium on the loan on a payment date after the same day of the month twelve calendar months before the handling
    date, the total of the hazard insurance premiums advanced in that window divided by 12; when none was advanced
    in that window but a set-aside on the loan is depleted with an annual_hazard_premium above 0.00, that annual_hazard_premium
    divided by 12; otherwise nothing. Added to the withholdings is a flood insurance escrow that builds, a twelfth
    at a time, the flood renewal falling due a year after the next one: when Cedarline advanced a flood insurance
    premium on the loan on a payment date after the same day of the month twelve calendar months before the handling
    date, the total of the flood insurance premiums advanced in that window divided by 12; when none was advanced
    in that window but a set-aside on the loan is depleted with an annual_flood_premium above 0.00, that annual_flood_premium
    divided by 12; otherwise nothing. Added to the withholdings is the repayment of a property charge Cedarline
    advanced, a loan holding at most one open property charge repayment record: when that record is in notice_period,
    pending_signature or defaulted with an arrearage_balance above 0.00, the arrearage is spread evenly over twelve
    payments, that arrearage_balance divided by 12, rounded half up to the cent; when it is active with a monthly_installment
    above 0.00, the plan's own monthly_installment is passed through; otherwise nothing. The change sets scheduled_payment_start_period
    to the month after the handling month, records the committed amount as one line commitment entry, charges payment_plan_change_fee
    to the loan balance, and on success the request_status becomes processed.
  compute:
  - req_plan: >-
      LATEST('hecm_requests', 'requested_plan', date_field='request_date', request_type='payment_plan_change', request_status='submitted')
      or 'not_applicable'
  - req_amt: >-
      SUM('hecm_requests', 'requested_amount', request_type='payment_plan_change', request_status='submitted')
  - req_term: >-
      int(LATEST('hecm_requests', 'requested_term_months', date_field='request_date', request_type='payment_plan_change',
      request_status='submitted') or 0)
  - line: F('available_line')
  - in_scope: F('scheduled_payment_amount') <= 0
  - committed: >-
      req_amt if (req_plan == 'HECM Modified Tenure Plan' or req_plan == 'HECM Modified Term Plan') else (line if
      (req_plan == 'HECM Tenure Payment Plan' or req_plan == 'HECM Term Payment Plan') else 0)
  - is_tenure: >-
      req_plan == 'HECM Tenure Payment Plan' or req_plan == 'HECM Modified Tenure Plan'
  - r: (float(F('expected_rate_pct')) + P('annual_mip_rate_pct')) / 1200
  - age_now: F('youngest_borrower_age_at_closing') + int(MONTHS(F('closing_date'), NOW) / 12)
  - n_base: 12 * (K('tenure_horizon_years') - age_now) if is_tenure else req_term
  - n_new: >-
      K('five_year_minimum_months') if (is_tenure and 12 * (K('tenure_horizon_years') - F('youngest_borrower_age_at_closing')
      - int(MONTHS(F('closing_date'), NOW) / 12)) < K('five_year_minimum_months')) else (12 * (K('tenure_horizon_years')
      - age_now) if is_tenure else req_term)
  - tx_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='property_tax')
  - tax_esc: >-
      tx_adv / 12 if tx_adv > 0 else ((CFIELD('setaside', 'annual_property_tax', hecm_loan_id=HID, status='depleted')
      or 0) / 12 if (CFIELD('setaside', 'annual_property_tax', hecm_loan_id=HID, status='depleted') or 0) > 0 else
      0)
  - hz_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='hazard_insurance')
  - hz_esc: >-
      hz_adv / 12 if hz_adv > 0 else ((CFIELD('setaside', 'annual_hazard_premium', hecm_loan_id=HID, status='depleted')
      or 0) / 12 if (CFIELD('setaside', 'annual_hazard_premium', hecm_loan_id=HID, status='depleted') or 0) > 0
      else 0)
  - fl_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='flood_insurance')
  - fl_esc: >-
      fl_adv / 12 if fl_adv > 0 else ((CFIELD('setaside', 'annual_flood_premium', hecm_loan_id=HID, status='depleted')
      or 0) / 12 if (CFIELD('setaside', 'annual_flood_premium', hecm_loan_id=HID, status='depleted') or 0) > 0 else
      0)
  - pc_lump: >-
      (CFIELD('propcharge', 'arrearage_balance', hecm_loan_id=HID, status='notice_period') or 0) + (CFIELD('propcharge',
      'arrearage_balance', hecm_loan_id=HID, status='pending_signature') or 0) + (CFIELD('propcharge', 'arrearage_balance',
      hecm_loan_id=HID, status='defaulted') or 0)
  - pc_inst: >-
      CFIELD('propcharge', 'monthly_installment', hecm_loan_id=HID, status='active') or 0
  - arr_wh: RND(pc_lump / 12, 2) if pc_lump > 0 else (pc_inst if pc_inst > 0 else 0)
  - result: >-
      RND(MX(0, (committed * r / ((1 + r) * (1 - (1 + r) ** (-n_new))) if n_new > 0 else 0) - tax_esc - hz_esc -
      fl_esc - arr_wh), 2) if in_scope else 0
