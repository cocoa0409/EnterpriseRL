    ladder:
    - when: >-
        the cured case is a Property Charge Default and no property charge repayment record on the loan is active
      method: count every portion posted with restores_line false, whatever its bucket
    - when: >-
        the cured case is a Property Charge Default and a repayment record on the loan is active
      method: count the principal and interest portions only
    - when: otherwise
      method: count the principal portions only
    baseline:
      scope_amt: dp_prin
    evidence:
    - cross_category
    - history
    cross_difficulty: maturity
  - id: restore_wait_period
    effect: method
    decides: lag_period
    bindings:
    - lag_period
    ladder:
    - when: more than restoration_grace_months whole months have passed since the cure
      method: those whole months divided by 12
    - when: at least one and no more than restoration_grace_months whole months have passed
      method: those whole months less one, divided by 12
    - when: otherwise
      method: no wait period (0)
    baseline:
      lag_period: DAYS(cure_date, NOW) / 365 if cure_date < NOW else 0
    evidence:
    - cross_category
    cross_difficulty: null
  - id: restore_wait_rate
    effect: parameter
    decides: lag_rate
    bindings:
    - lag_rate
    ladder:
    - when: the current note rate took effect after the cure
      value: note_rate_pct plus line_growth_spread_pct
    - when: it took effect while the loan was due and payable
      value: >-
        the average of the standard wait credit rate and note_rate_pct plus line_growth_spread_pct
    - when: otherwise
      value: the standard wait credit rate
    baseline:
      lag_rate: std_rate
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  - id: restore_cure_holdback
    effect: parameter
    decides: hb
    bindings:
    - hb
    ladder:
    - when: more than sixty days ran from the due_and_payable_date to the cure
      value: slow_cure_holdback_pct percent of every portion posted with restores_line false
    - when: more than thirty and no more than sixty days ran
      value: cure_holdback_pct percent of that total
    - when: otherwise
      value: '0.00'
    baseline:
      hb: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      The reinstatement restoration is the portions counted, less the amount kept back, plus the wait credit, floored
      at 0.00 and rounded half up to the cent once, at the end, where the wait credit is the total of every portion
      posted on the loan with restores_line false times the wait credit rate, divided by 100, times the wait period.
      The cured maturity case is the case named by the loan's most recent cure confirmation notice; a loan has at
      most one open maturity case at a time, so its cure confirmation notices fall on different dates. Interest
      accruals and line growth credits each post once a month, so the most recent one is a single entry. Under the
      standard rule the portions counted are the principal portions posted on the loan with restores_line false,
      the amount kept back is 0.00, the wait credit rate is the annual growth rate applied by the most recent line
      growth credit on the loan, or the note_rate_pct plus the plan's line_growth_spread_pct when none has been
      credited, and the wait period is the calendar days from the cured maturity case's closed_date to the handling
      date divided by 365, or 0 when the loan has no cured case.
    params: []
  prerequisite: []
  cross_category:
  - category: maturity
    as: branch
    reads:
    - closed_date
    - due_and_payable_date
    - maturity_case_events.maturity_case_id
    - status
    - variant_name
    note: >-
      The cure scope, the wait period, the wait credit rate and the amount kept back read the cured maturity case.
  - category: propcharge
    as: branch
    reads:
    - status
    note: The cure scope reads whether a property charge repayment record is active.
  inputs:
    history:
    - table: hecm_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: hecm_prepayment
        restores_line: false
    - table: hecm_transactions
      aggregate: latest
      field: rate_applied_pct
      filters:
        event_type: hecm_line_growth
    - category: maturity
      table: maturity_case_events
      aggregate: latest
      field: maturity_case_id
      filters:
        event_type: maturity_notice_sent
        notice_type: cure_confirmation
    cross_category:
    - maturity
    - propcharge
- id: hecm_ext_payment_designation
  base_policy_refs:
  - hecm_payment_plan_change
  overwrite:
  - base_policy: hecm_payment_plan_change
    superseded_clause: >-
      for a change into a Modified plan the committed amount is the requested_amount on the request, which may not
      exceed the available line after any release, otherwise the request is declined with reason insufficient_available_line.
    replaced_by: >-
      For a change into a Modified plan the committed amount is the requested_amount on the request, which may not
      exceed the available line after any release, otherwise the request is declined with reason insufficient_available_line;
      for a request signed for the designated amount, and only for it, the requested_amount is the designated amount,
      the available line less the amounts kept in the line, which never exceeds that available line.
  trigger: on_request
  subject:
  - hecm_line_commitment
  computes: requested_amount
  target_tool: sign_payout_plan_change_346bec33
  params:
    post_cure_hold_pct: 10
    post_cure_repeat_hold_pct: 25
  rule: >-
    When a borrower asks to move the line onto lifetime or fixed-term monthly payments while keeping in the line
    only what Cedarline requires, the borrower's own signed payout plan change request names a Modified plan and
    designates the designated amount, the most of the line Cedarline lets the borrower commit to the payments on
    the handling date. This rule applies to a loan whose current plan pays no scheduled payments, such as the HECM
    Line of Credit, so no payment release arises and the available line after any release is the loan's available_line.
    The designated amount is not worked out until the most recent prepaid portion that restored nothing to the line
    when it was applied carries its line restoration entry. For a change into a Modified plan the committed amount
    is the requested_amount on the request, which may not exceed the available line after any release, otherwise
    the request is declined with reason insufficient_available_line; for a request signed for the designated amount,
    and only for it, the requested_amount is the designated amount, the available line less the amounts kept in
    the line, which never exceeds that available line. The designated amount is the loan's available_line less the
    amounts kept in the line, and 0.00 for a loan outside this rule's scope, each amount worked out on its own and
    added to the amounts kept, floored at 0.00 and rounded half up to the cent once, at the end. Under the standard
    rule nothing is kept in the line for the designation, so the amounts kept are 0.00. Added to the amounts kept
    is the next property tax bill: when Cedarline advanced property tax on the loan on a payment date after the
    same day of the month twelve calendar months before the handling date, the total of the property tax advanced
    in that window; when no property tax was advanced in that window but a set-aside on the loan is depleted with
    an annual_property_tax above 0.00, that annual_property_tax; otherwise nothing. Added to the amounts kept is
    the next insurance renewal: when Cedarline advanced a hazard or flood insurance premium on the loan on a payment
    date after the same day of the month twelve calendar months before the handling date, the total of the hazard
    and flood insurance premiums advanced in that window; when none was advanced in that window but a set-aside
    on the loan is depleted with an annual_hazard_premium or annual_flood_premium above 0.00, those two annual premiums
    together; otherwise nothing. Added to the amounts kept are the occupancy inspection fees a certification lapse
    will cost: when the loan's occupancy certification profile is overdue or in absence_monitoring and its plan's
    occupancy_inspection_fee is above 0.00, twice that fee; when the profile is current and occupancy inspection
    fees were posted to the loan on a date after the same day of the month twelve calendar months before the handling
    date, what the last cycle actually cost, the total of the occupancy inspection fees posted in that window; otherwise
    nothing. Added to the amounts kept are the draw requests already queued on the loan, meaning its draw requests
    whose request status is submitted: when at least one came through the servicing portal or a signed written form,
    the full total of every queued draw request; when every queued draw request came by phone, their total but no
    more than the plan's phone_draw_max_amount; otherwise nothing. Added to the amounts kept after a cured property
    charge default is a share of the available_line: when the loan's most recently cured maturity case, the case
    named by its most recent cure confirmation notice, is a Property Charge Default closed as cured on a date after
    the same day of the month twelve calendar months before the handling date and two or more cure confirmation
    notices were sent on the loan after the same day of the month thirty-six calendar months before the handling
    date, post_cure_repeat_hold_pct percent of the available_line; when that case was cured in that twelve-month
    window and fewer than two cure confirmation notices were sent in that thirty-six-month window, post_cure_hold_pct
    percent of the available_line; otherwise nothing.
  compute:
  - line: F('available_line')
  - in_scope: F('scheduled_payment_amount') <= 0
  - tx_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='property_tax')
  - dep_tax: >-
      CFIELD('setaside', 'annual_property_tax', hecm_loan_id=HID, status='depleted') or 0
  - tax_hold: tx_adv if tx_adv > 0 else (dep_tax if dep_tax > 0 else 0)
  - hzfl_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='hazard_insurance') + XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12,
      date_field='effective_date', event_type='propcharge_advance', charge_type='flood_insurance')
  - dep_ins: >-
      (CFIELD('setaside', 'annual_hazard_premium', hecm_loan_id=HID, status='depleted') or 0) + (CFIELD('setaside',
      'annual_flood_premium', hecm_loan_id=HID, status='depleted') or 0)
  - ins_hold: hzfl_adv if hzfl_adv > 0 else (dep_ins if dep_ins > 0 else 0)
  - res_status: CFIELD('residency', 'status', hecm_loan_id=HID) or 'none'
  - res_fee: CPARAM('residency', 'occupancy_inspection_fee', hecm_loan_id=HID) or 0
  - insp_fees: >-
      SUM('hecm_transactions', 'amount', within_months=12, date_field='effective_date', event_type='hecm_advance_posting',
      advance_type='occupancy_inspection_fee')
  - insp_hold: >-
      2 * res_fee if ((res_status == 'overdue' or res_status == 'absence_monitoring') and res_fee > 0) else (insp_fees
      if (res_status == 'current' and insp_fees > 0) else 0)
  - q_pw: >-
      SUM('hecm_requests', 'requested_amount', request_type='loc_draw', request_status='submitted', request_channel='servicing_portal')
      + SUM('hecm_requests', 'requested_amount', request_type='loc_draw', request_status='submitted', request_channel='signed_written')
  - q_ph: >-
      SUM('hecm_requests', 'requested_amount', request_type='loc_draw', request_status='submitted', request_channel='phone')
  - queued_hold: >-
      q_pw + q_ph if q_pw > 0 else (MN(q_ph, P('phone_draw_max_amount')) if q_ph > 0 else 0)
  - cure_case: >-
      XLATEST('maturity', 'maturity_case_events', 'maturity_case_id', date_field='effective_date', event_type='maturity_notice_sent',
      notice_type='cure_confirmation') or 'none'
  - pcd_cured: >-
      MONTHS(CFIELD('maturity', 'closed_date', maturity_case_id=cure_case, variant_name='Property Charge Default',
      status='cured') or '1900-01-01', NOW) < 12
  - cure_notices: >-
      XCOUNT('maturity', 'maturity_case_events', within_months=36, date_field='effective_date', event_type='maturity_notice_sent',
      notice_type='cure_confirmation')
  - cure_hold: >-
      line * K('post_cure_repeat_hold_pct') / 100 if (pcd_cured and cure_notices >= 2) else (line * K('post_cure_hold_pct')
      / 100 if (pcd_cured and cure_notices < 2) else 0)
  - result: >-
      RND(MX(0, line - tax_hold - ins_hold - insp_hold - queued_hold - cure_hold), 2) if in_scope else 0
  compute_basis:
    line: >-
      The designated amount is the loan's available_line less the amounts kept in the line, and 0.00 for a loan
      outside this rule's scope, each amount worked out on its own and added to the amounts kept, floored at 0.00
      and rounded half up to the cent once, at the end.
    tx_adv: >-
      Added to the amounts kept is the next property tax bill: when Cedarline advanced property tax on the loan
      on a payment date after the same day of the month twelve calendar months before the handling date, the total
      of the property tax advanced in that window; when no property tax was advanced in that window but a set-aside
      on the loan is depleted with an annual_property_tax above 0.00, that annual_property_tax; otherwise nothing.
    dep_tax: >-
      Added to the amounts kept is the next property tax bill: when Cedarline advanced property tax on the loan
      on a payment date after the same day of the month twelve calendar months before the handling date, the total
      of the property tax advanced in that window; when no property tax was advanced in that window but a set-aside
      on the loan is depleted with an annual_property_tax above 0.00, that annual_property_tax; otherwise nothing.
    tax_hold: >-
      Added to the amounts kept is the next property tax bill: when Cedarline advanced property tax on the loan
      on a payment date after the same day of the month twelve calendar months before the handling date, the total
      of the property tax advanced in that window; when no property tax was advanced in that window but a set-aside
      on the loan is depleted with an annual_property_tax above 0.00, that annual_property_tax; otherwise nothing.
    hzfl_adv: >-
      Added to the amounts kept is the next insurance renewal: when Cedarline advanced a hazard or flood insurance
      premium on the loan on a payment date after the same day of the month twelve calendar months before the handling
      date, the total of the hazard and flood insurance premiums advanced in that window; when none was advanced
      in that window but a set-aside on the loan is depleted with an annual_hazard_premium or annual_flood_premium
      above 0.00, those two annual premiums together; otherwise nothing.
    dep_ins: >-
      Added to the amounts kept is the next insurance renewal: when Cedarline advanced a hazard or flood insurance
      premium on the loan on a payment date after the same day of the month twelve calendar months before the handling
      date, the total of the hazard and flood insurance premiums advanced in that window; when none was advanced
      in that window but a set-aside on the loan is depleted with an annual_hazard_premium or annual_flood_premium
      above 0.00, those two annual premiums together; otherwise nothing.
    ins_hold: >-
      Added to the amounts kept is the next insurance renewal: when Cedarline advanced a hazard or flood insurance
      premium on the loan on a payment date after the same day of the month twelve calendar months before the handling
      date, the total of the hazard and flood insurance premiums advanced in that window; when none was advanced
      in that window but a set-aside on the loan is depleted with an annual_hazard_premium or annual_flood_premium
      above 0.00, those two annual premiums together; otherwise nothing.
    res_status: >-
      Added to the amounts kept are the occupancy inspection fees a certification lapse will cost: when the loan's
      occupancy certification profile is overdue or in absence_monitoring and its plan's occupancy_inspection_fee
      is above 0.00, twice that fee; when the profile is current and occupancy inspection fees were posted to the
      loan on a date after the same day of the month twelve calendar months before the handling date, what the last
      cycle actually cost, the total of the occupancy inspection fees posted in that window; otherwise nothing.
    res_fee: >-
      Added to the amounts kept are the occupancy inspection fees a certification lapse will cost: when the loan's
      occupancy certification profile is overdue or in absence_monitoring and its plan's occupancy_inspection_fee
      is above 0.00, twice that fee; when the profile is current and occupancy inspection fees were posted to the
      loan on a date after the same day of the month twelve calendar months before the handling date, what the last
      cycle actually cost, the total of the occupancy inspection fees posted in that window; otherwise nothing.
    insp_fees: >-
      Added to the amounts kept are the occupancy inspection fees a certification lapse will cost: when the loan's
      occupancy certification profile is overdue or in absence_monitoring and its plan's occupancy_inspection_fee
      is above 0.00, twice that fee; when the profile is current and occupancy inspection fees were posted to the
      loan on a date after the same day of the month twelve calendar months before the handling date, what the last
      cycle actually cost, the total of the occupancy inspection fees posted in that window; otherwise nothing.
    insp_hold: >-
      Added to the amounts kept are the occupancy inspection fees a certification lapse will cost: when the loan's
      occupancy certification profile is overdue or in absence_monitoring and its plan's occupancy_inspection_fee
      is above 0.00, twice that fee; when the profile is current and occupancy inspection fees were posted to the
      loan on a date after the same day of the month twelve calendar months before the handling date, what the last
      cycle actually cost, the total of the occupancy inspection fees posted in that window; otherwise nothing.
    q_pw: >-
      Added to the amounts kept are the draw requests already queued on the loan, meaning its draw requests whose
      request status is submitted: when at least one came through the servicing portal or a signed written form,
      the full total of every queued draw request; when every queued draw request came by phone, their total but
      no more than the plan's phone_draw_max_amount; otherwise nothing.
    q_ph: >-
      Added to the amounts kept are the draw requests already queued on the loan, meaning its draw requests whose
      request status is submitted: when at least one came through the servicing portal or a signed written form,
      the full total of every queued draw request; when every queued draw request came by phone, their total but
      no more than the plan's phone_draw_max_amount; otherwise nothing.
    queued_hold: >-
      Added to the amounts kept are the draw requests already queued on the loan, meaning its draw requests whose
      request status is submitted: when at least one came through the servicing portal or a signed written form,
      the full total of every queued draw request; when every queued draw request came by phone, their total but
      no more than the plan's phone_draw_max_amount; otherwise nothing.
    pcd_cured: >-
      Added to the amounts kept after a cured property charge default is a share of the available_line: when the
      loan's most recently cured maturity case, the case named by its most recent cure confirmation notice, is a
      Property Charge Default closed as cured on a date after the same day of the month twelve calendar months before
      the handling date and two or more cure confirmation notices were sent on the loan after the same day of the
      month thirty-six calendar months before the handling date, post_cure_repeat_hold_pct percent of the available_line;
      when that case was cured in that twelve-month window and fewer than two cure confirmation notices were sent
      in that thirty-six-month window, post_cure_hold_pct percent of the available_line; otherwise nothing.
    cure_notices: >-
      Added to the amounts kept after a cured property charge default is a share of the available_line: when the
      loan's most recently cured maturity case, the case named by its most recent cure confirmation notice, is a
      Property Charge Default closed as cured on a date after the same day of the month twelve calendar months before
      the handling date and two or more cure confirmation notices were sent on the loan after the same day of the
      month thirty-six calendar months before the handling date, post_cure_repeat_hold_pct percent of the available_line;
      when that case was cured in that twelve-month window and fewer than two cure confirmation notices were sent
      in that thirty-six-month window, post_cure_hold_pct percent of the available_line; otherwise nothing.
    cure_hold: >-
      Added to the amounts kept after a cured property charge default is a share of the available_line: when the
      loan's most recently cured maturity case, the case named by its most recent cure confirmation notice, is a
      Property Charge Default closed as cured on a date after the same day of the month twelve calendar months before
      the handling date and two or more cure confirmation notices were sent on the loan after the same day of the
      month thirty-six calendar months before the handling date, post_cure_repeat_hold_pct percent of the available_line;
      when that case was cured in that twelve-month window and fewer than two cure confirmation notices were sent
      in that thirty-six-month window, post_cure_hold_pct percent of the available_line; otherwise nothing.
    result: >-
      The designated amount is the loan's available_line less the amounts kept in the line, and 0.00 for a loan
      outside this rule's scope, each amount worked out on its own and added to the amounts kept, floored at 0.00
      and rounded half up to the cent once, at the end.
    cure_case: >-
      Added to the amounts kept after a cured property charge default is a share of the available_line: when the
      loan's most recently cured maturity case, the case named by its most recent cure confirmation notice, is a
      Property Charge Default closed as cured on a date after the same day of the month twelve calendar months before
      the handling date and two or more cure confirmation notices were sent on the loan after the same day of the
      month thirty-six calendar months before the handling date, post_cure_repeat_hold_pct percent of the available_line;
      when that case was cured in that twelve-month window and fewer than two cure confirmation notices were sent
      in that thirty-six-month window, post_cure_hold_pct percent of the available_line; otherwise nothing.
    in_scope: >-
      This rule applies to a loan whose current plan pays no scheduled payments, such as the HECM Line of Credit,
      so no payment release arises and the available line after any release is the loan's available_line.
  factors:
  - id: designation_tax_hold
    effect: parameter
    decides: tax_hold
    bindings:
    - tx_adv
    - dep_tax
    - tax_hold
    ladder:
    - when: property tax was advanced on the loan in the twelve-month window
      value: the total advanced in that window
    - when: >-
        none in the window but a set-aside on the loan is depleted with an annual_property_tax above 0.00
      value: that annual_property_tax
    - when: otherwise
      value: '0.00'
    baseline:
      tax_hold: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: propcharge
  - id: designation_insurance_hold
    effect: parameter
    decides: ins_hold
    bindings:
    - hzfl_adv
    - dep_ins
    - ins_hold
    ladder:
    - when: >-
        a hazard or flood insurance premium was advanced on the loan in the twelve-month window
      value: the hazard and flood premiums advanced in that window
    - when: >-
        none in the window but a set-aside on the loan is depleted with an annual hazard or flood premium above
        0.00
      value: those two annual premiums together
    - when: otherwise
      value: '0.00'
    baseline:
      ins_hold: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: propcharge
  - id: designation_inspection_hold
    effect: method
    decides: insp_hold
    bindings:
    - res_status
    - res_fee
    - insp_fees
    - insp_hold
    ladder:
    - when: >-
        the occupancy certification profile is overdue or in absence_monitoring and its plan's occupancy_inspection_fee
        is above 0.00
      method: 'schedule basis: twice the profile plan''s occupancy_inspection_fee'
    - when: >-
        the profile is current and occupancy inspection fees were posted in the twelve-month window
      method: >-
        ledger basis: the occupancy inspection fees actually posted in the twelve-month window
    - when: otherwise
      method: nothing kept (0.00)
    baseline:
      insp_hold: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: designation_queued_hold
    effect: parameter
    decides: queued_hold
    bindings:
    - q_pw
    - q_ph
    - queued_hold
    ladder:
    - when: >-
        at least one queued draw request came through the servicing portal or a signed written form
      value: the full total of every queued draw request
    - when: every queued draw request came by phone
      value: their total capped at the plan's phone_draw_max_amount
    - when: otherwise
      value: '0.00'
    baseline:
      queued_hold: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: designation_post_cure_hold
    effect: parameter
    decides: cure_hold
    bindings:
    - cure_case
    - pcd_cured
    - cure_notices
    - cure_hold
    ladder:
    - when: >-
        a Property Charge Default case was cured in the last twelve months and two or more cure confirmation notices
        were sent in the last thirty-six months
      value: post_cure_repeat_hold_pct percent of the available_line
    - when: >-
        a Property Charge Default case was cured in the last twelve months and fewer than two cure confirmation
        notices were sent
      value: post_cure_hold_pct percent of the available_line
    - when: otherwise
      value: '0.00'
    baseline:
      cure_hold: '0'
    evidence:
    - cross_category
    cross_difficulty: maturity
  baseline:
    rule: >-
      The designated amount is the loan's available_line less the amounts kept in the line, and 0.00 for a loan
      outside this rule's scope, each amount worked out on its own and added to the amounts kept, floored at 0.00
      and rounded half up to the cent once, at the end. Under the standard rule nothing is kept in the line for
      the designation, so the amounts kept are 0.00.
    params: []
  prerequisite:
  - problem: hecm_ext_reinstatement_restore
    kind: value_input
    gate: line
    form: state
    policy_source: >-
      The designated amount is not worked out until the most recent prepaid portion that restored nothing to the
      line when it was applied carries its line restoration entry.
    condition: >-
      The most recent hecm_prepayment row of the loan with restores_line false, if there is one, has a hecm_line_restore
      row referencing it.
    resolved_by: restore_reinstated_line_c85e4df8
    effect: >-
      The single restoration entry references that most recent portion and raises the loan's available_line by the
      reinstatement restoration; the designated amount starts from the available_line.
  cross_category:
  - category: propcharge
    as: history
    reads:
    - propcharge_transactions.amount
    - propcharge_transactions.charge_type
    note: The tax and insurance holds read the advances of the last twelve months.
  - category: setaside
    as: branch
    reads:
    - status
    - annual_property_tax
    - annual_hazard_premium
    - annual_flood_premium
    note: The tax and insurance holds fall back on a depleted set-aside's annual charges.
  - category: residency
    as: branch
    reads:
    - status
    - occupancy_inspection_fee
    note: >-
      The inspection hold reads the occupancy certification profile and its plan's fee.
  - category: maturity
    as: history
    reads:
    - closed_date
    - maturity_case_events.maturity_case_id
    - maturity_case_events.notice_type
    - status
    - variant_name
    note: The post-cure hold reads the cured case and its cure confirmation notices.
  inputs:
    history:
    - table: hecm_requests
      aggregate: sum
      field: requested_amount
      filters:
        request_type: loc_draw
        request_status: submitted
    - category: maturity
      table: maturity_case_events
