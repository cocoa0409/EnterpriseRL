      with an arrearage_balance above 0.00, the arrearage is spread evenly over twelve payments, that arrearage_balance
      divided by 12, rounded half up to the cent; when it is active with a monthly_installment above 0.00, the plan's
      own monthly_installment is passed through; otherwise nothing.
    result: >-
      The new scheduled payment is the payment the committed amount buys less the withholdings, each withholding
      worked out on its own and added to the withholdings, floored at 0.00, with the only roundings those stated
      for a withholding itself and the final rounding of the new scheduled payment, half up to the cent, where the
      payment the committed amount buys is the committed amount times the payment rate divided by ((1 + the payment
      rate) times (1 - (1 + the payment rate) to the power of minus the payment count)), with every payment treated
      as made at the start of its month and the first payment in the month after the handling month, and none when
      the payment count is 0.
    in_scope: >-
      This rule processes a change only for a loan whose current plan pays no scheduled payments, such as the HECM
      Line of Credit, so no payment release arises and the whole available line after any release is the loan's
      available_line; a change from a plan that pays scheduled payments needs its payment release booked first and
      is not processed under this rule.
  factors:
  - id: new_payment_count_floor
    effect: parameter
    decides: n_new
    bindings:
    - n_new
    ladder:
    - when: >-
        a tenure-based plan where twelve times the difference between tenure_horizon_years and the borrower's age
        is below five_year_minimum_months
      value: five_year_minimum_months
    - when: any other tenure-based plan
      value: twelve times the difference between tenure_horizon_years and the borrower's age
    - when: otherwise (a term-based plan)
      value: the requested_term_months on the request
    baseline:
      n_new: n_base
    evidence:
    - history
    cross_difficulty: null
  - id: new_payment_tax_escrow
    effect: parameter
    decides: tax_esc
    bindings:
    - tx_adv
    - tax_esc
    ladder:
    - when: property tax was advanced on the loan in the twelve-month window
      value: that total divided by 12
    - when: >-
        none in the window but a set-aside on the loan is depleted with an annual_property_tax above 0.00
      value: that annual_property_tax divided by 12
    - when: otherwise
      value: '0.00'
    baseline:
      tax_esc: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: propcharge
  - id: new_payment_hazard_escrow
    effect: parameter
    decides: hz_esc
    bindings:
    - hz_adv
    - hz_esc
    ladder:
    - when: a hazard insurance premium was advanced in the twelve-month window
      value: that total divided by 12
    - when: >-
        none in the window but a set-aside on the loan is depleted with an annual_hazard_premium above 0.00
      value: that premium divided by 12
    - when: otherwise
      value: '0.00'
    baseline:
      hz_esc: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: propcharge
  - id: new_payment_flood_escrow
    effect: parameter
    decides: fl_esc
    bindings:
    - fl_adv
    - fl_esc
    ladder:
    - when: a flood insurance premium was advanced in the twelve-month window
      value: that total divided by 12
    - when: >-
        none in the window but a set-aside on the loan is depleted with an annual_flood_premium above 0.00
      value: that premium divided by 12
    - when: otherwise
      value: '0.00'
    baseline:
      fl_esc: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: propcharge
  - id: new_payment_arrearage_withholding
    effect: method
    decides: arr_wh
    bindings:
    - pc_lump
    - pc_inst
    - arr_wh
    ladder:
    - when: >-
        the loan's open property charge repayment record is in notice_period, pending_signature or defaulted with
        an arrearage_balance above 0.00
      method: >-
        spread the arrearage evenly over twelve payments: arrearage_balance / 12, rounded half up to the cent
    - when: the open record is active with a monthly_installment above 0.00
      method: pass the plan's own monthly_installment through
    - when: otherwise
      method: no withholding (0.00)
    baseline:
      arr_wh: '0'
    evidence:
    - cross_category
    cross_difficulty: propcharge
  baseline:
    rule: >-
      The new scheduled payment is the payment the committed amount buys less the withholdings, each withholding
      worked out on its own and added to the withholdings, floored at 0.00, with the only roundings those stated
      for a withholding itself and the final rounding of the new scheduled payment, half up to the cent, where the
      payment the committed amount buys is the committed amount times the payment rate divided by ((1 + the payment
      rate) times (1 - (1 + the payment rate) to the power of minus the payment count)), with every payment treated
      as made at the start of its month and the first payment in the month after the handling month, and none when
      the payment count is 0. Under the standard rule, a loan carrying at most one submitted payout plan change
      request at a time, the committed amount is the requested_amount on that request for the HECM Modified Tenure
      Plan or HECM Modified Term Plan and the whole available_line for the HECM Tenure Payment Plan or HECM Term
      Payment Plan, the payment rate is one twelfth of the sum of the expected_rate_pct and annual_mip_rate_pct,
      divided by 100, the new scheduled payment is 0.00 for a loan outside this rule's scope, the payment count
      is twelve times the difference between tenure_horizon_years and the borrower's age for a tenure-based plan
      (HECM Tenure Payment Plan or HECM Modified Tenure Plan) and the requested_term_months for any other plan,
      the borrower's age is the youngest_borrower_age_at_closing plus the whole years from the closing date to the
      handling date (whole calendar months between two dates are complete on the later month's day with the same
      day number as the earlier date, or on the first day of the following month when that month has no such day
      number, and whole years are twelve whole months), tenure_horizon_years is the tenure_age_horizon_years the
      tenure-based plans carry, and the withholdings are 0.00.
    params:
    - annual_mip_rate_pct
    - tenure_horizon_years
  prerequisite:
  - problem: hecm_ext_payment_designation
    kind: value_input
    gate: committed
    form: state
    policy_source: >-
      The new scheduled payment is fixed only after a signed payout plan change request for the change stands on
      file for the loan with request status submitted.
    condition: >-
      A hecm_requests row of the loan with request_type payment_plan_change, request_channel signed_written and
      request_status submitted carries the requested plan and the requested_amount.
    resolved_by: sign_payout_plan_change_346bec33
    effect: >-
      The signed request supplies the plan asked for and the designated requested_amount, which becomes the committed
      amount the new scheduled payment is computed on.
  cross_category:
  - category: propcharge
    as: history
    reads:
    - status
    - arrearage_balance
    - monthly_installment
    - propcharge_transactions.amount
    - propcharge_transactions.charge_type
    note: >-
      The escrows read the advances of the last twelve months; the arrearage withholding reads the open repayment
      record.
  - category: setaside
    as: branch
    reads:
    - status
    - annual_property_tax
    - annual_hazard_premium
    - annual_flood_premium
    note: The escrows fall back on a depleted set-aside's annual charges.
  inputs:
    history:
    - table: hecm_requests
      aggregate: latest
      field: requested_amount
      filters:
        request_type: payment_plan_change
        request_status: submitted
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: propcharge_advance
    cross_category:
    - propcharge
    - setaside
