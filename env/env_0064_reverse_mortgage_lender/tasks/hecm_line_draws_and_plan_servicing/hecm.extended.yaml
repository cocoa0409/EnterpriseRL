        disbursement_method: check
        request_status: withdrawn
    - table: hecm_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: hecm_loc_draw
    - table: hecm_transactions
      aggregate: latest
      field: rate_applied_pct
      filters:
        event_type: hecm_interest_accrual
    - table: hecm_transactions
      aggregate: latest
      field: effective_date
      filters:
        event_type: hecm_mip_accrual
