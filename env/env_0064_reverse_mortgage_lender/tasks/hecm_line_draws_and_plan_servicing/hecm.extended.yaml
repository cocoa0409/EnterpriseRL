    plan_change_effective_rule: first_day_of_month_after_processing
    plan_change_signed_request_required: true
    returned_disbursement_line_credit: false
    nbs_deferral_available: true
    deferral_legal_right_days: 90
    draws_stop_at_due_and_payable: true
    single_full_draw_at_closing: true
    servicing_fee_options_offered:
    - included_in_rate
    - monthly_fee_with_setaside
events:
- type: hecm_loan_boarded
  target: hecm_loans
  mutation: create
  meaning: A closed HECM is boarded to servicing on its closing date, entering the rescission period.
  grain: One row per loan.
  fields:
    hecm_loan_id: Loan record id.
    customer_id: Primary borrower.
    co_borrower_customer_id: Second borrower, if any.
    nbs_customer_id: Non-borrowing spouse named at closing, if any.
    variant_name: Payout plan elected at closing.
    status: Always rescission_period on boarding.
    loan_number: Servicing loan number.
    fha_case_number: FHA case number.
    closing_date: Consummation date.
    rate_type: Rate type of the note.
    margin_pct: Lender margin.
    note_rate_pct: Initial note rate.
    initial_note_rate_pct: Note rate at closing.
    rate_change_date: Closing date.
    expected_rate_pct: Expected rate at closing.
    max_claim_amount: Maximum claim amount.
    initial_principal_limit: Principal limit at closing.
    initial_disbursement_limit: First-year disbursement limit computed at closing.
    mandatory_obligations_amount: Mandatory obligations paid at closing.
    closing_disbursement_amount: Total disbursed at closing.
    principal_balance: Opening balance (closing disbursement amount).
    available_line: Opening available line.
    scheduled_payment_amount: Opening scheduled payment, if any.
    scheduled_payment_term_months: Opening term, if term-based.
    scheduled_payment_start_period: First scheduled payment month, if any.
    servicing_fee_option: Servicing fee option elected.
    property_type: Property type.
    appraised_value_at_closing: Appraised value at closing.
    youngest_borrower_age_at_closing: Youngest borrower's age at closing.
  triggers: []
- type: hecm_rate_adjusted
  target: hecm_loans
  mutation: update
  meaning: The note rate of an adjustable HECM resets on its adjustment date.
  grain: One row per rate adjustment.
  fields:
    note_rate_pct: New note rate.
    rate_change_date: Date the new rate took effect.
  triggers: []
- type: hecm_funded
  target: hecm_loans
  mutation:
    transition:
      from: rescission_period
      to: active
  meaning: The rescission period ends without a rescission notice and the loan funds.
  grain: One row per loan (a single transition).
  fields:
    status: Set to active.
    funding_date: Date the loan funded.
  triggers: []
- type: hecm_rescinded
  target: hecm_loans
  mutation:
    transition:
      from: rescission_period
      to: rescinded
  meaning: The borrower's timely rescission notice cancels the loan.
  grain: One row per loan (a single transition).
  fields:
    status: Set to rescinded.
    terminated_date: Date the rescission took effect.
  triggers: []
- type: hecm_loc_draw
  target: hecm_transactions
  meaning: A line-of-credit draw is disbursed to the borrower against a draw request, reducing the available line.
  grain: One row per disbursed draw request.
  distinguish_by:
  - hecm_request_id
  fields:
    amount: Draw amount disbursed.
    effective_date: Disbursement date.
    hecm_request_id: The draw request disbursed.
    disbursement_method: ach, wire or check.
  account: line_of_credit
  direction: out
  triggers:
  - event: hecm:hecm_advance_posting
    map:
      amount: amount
      effective_date: effective_date
      hecm_request_id: hecm_request_id
      disbursement_method: disbursement_method
      advance_type: loc_draw
      source_txn_ref: hecm_txn_id
- type: hecm_advance_posting
  target: hecm_transactions
  meaning: An amount paid out on the borrower's behalf or to the borrower (a draw, a set-aside disbursement, a corporate
    advance or an inspection fee) is added to the loan balance.
  grain: One row per originating disbursement.
  distinguish_by:
  - advance_type
  - source_txn_ref
  fields:
    amount: Amount added to the balance.
    effective_date: Posting date (the originating disbursement date).
    advance_type: What was paid.
    source_txn_ref: The originating draw, set-aside disbursement, plan advance or inspection record.
    hecm_request_id: Draw request for a loc_draw posting; empty otherwise.
    disbursement_method: Method for a draw posting; not_applicable otherwise.
  account: loan_balance
  direction: in
  triggers: []
- type: hecm_scheduled_payment
  target: hecm_transactions
  meaning: The monthly tenure or term scheduled payment is disbursed to the borrower and added to the loan balance.
  grain: One row per loan per payment month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Scheduled payment disbursed.
    effective_date: Disbursement date.
    accrual_period: Payment month.
    disbursement_method: ach or check.
  account: loan_balance
  direction: in
  triggers: []
- type: hecm_interest_accrual
  target: hecm_transactions
  meaning: Monthly interest at one twelfth of the note rate is accrued to the loan balance.
  grain: One row per loan per accrual month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Interest accrued.
    effective_date: Posting date.
    accrual_period: Month accrued.
    rate_applied_pct: Annual note rate applied.
  account: loan_balance
  direction: in
  triggers: []
- type: hecm_mip_accrual
  target: hecm_transactions
  meaning: Monthly FHA mortgage insurance premium at one twelfth of the annual MIP rate is accrued to the loan balance.
  grain: One row per loan per accrual month.
  distinguish_by:
  - accrual_period
  fields:
    amount: MIP accrued.
    effective_date: Posting date.
    accrual_period: Month accrued.
    rate_applied_pct: Annual MIP rate applied.
  account: loan_balance
  direction: in
  triggers: []
- type: hecm_servicing_fee
  target: hecm_transactions
  meaning: The monthly servicing fee is charged to the loan balance and drawn from the servicing fee set-aside.
  grain: One row per loan per fee month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Servicing fee charged.
    effective_date: Posting date.
    accrual_period: Month the fee covers.
  account: loan_balance
  direction: in
  triggers:
  - event: setaside:setaside_fee_draw
    map:
      amount: amount
      effective_date: effective_date
      accrual_period: accrual_period
      source_txn_ref: hecm_txn_id
- type: hecm_line_growth
  target: hecm_transactions
  meaning: The unused available line grows by one twelfth of the note rate plus the growth spread.
  grain: One row per loan per growth month.
  distinguish_by:
  - accrual_period
  fields:
    amount: Growth credited.
    effective_date: Posting date.
    accrual_period: Month credited.
    rate_applied_pct: Annual growth rate applied.
  account: line_of_credit
  direction: in
  triggers: []
- type: hecm_prepayment
  target: hecm_transactions
  meaning: A voluntary partial prepayment, or a repayment of property-charge advances, is applied to one balance
    component.
  grain: One row per remittance per allocation bucket; remittances received the same day for the same source are
    posted as one remittance.
  distinguish_by:
  - effective_date
  - allocation_bucket
  - source_txn_ref
  fields:
    amount: Portion applied to this bucket.
    effective_date: Date received.
    allocation_bucket: mip, servicing_fee, interest or principal.
    restores_line: Whether this portion is credited back to the available line.
    source_txn_ref: Repayment-plan installment that remitted it; empty for a direct borrower prepayment.
  account: loan_balance
  direction: out
  triggers:
  - event: hecm:hecm_line_restore
    when:
      restores_line: true
    map:
      amount: amount
      effective_date: effective_date
      source_txn_ref: hecm_txn_id
- type: hecm_line_restore
  target: hecm_transactions
  meaning: A prepaid portion is credited back to the available line for future draws.
  grain: One row per prepayment portion restored.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount credited back.
    effective_date: Credit date.
    source_txn_ref: The prepayment portion restored.
  account: line_of_credit
  direction: in
  triggers: []
- type: hecm_disbursement_return
  target: hecm_transactions
  meaning: A draw returned by the receiving bank or a draw check voided as uncashed is credited back to the available
    line.
  grain: One row per returned or voided draw.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount returned.
    effective_date: Return or void date.
    source_txn_ref: The original draw.
    disbursement_method: Method of the original draw.
  account: line_of_credit
  direction: in
  triggers:
  - event: hecm:hecm_advance_reversal
    map:
      amount: amount
      effective_date: effective_date
      source_txn_ref: source_txn_ref
      advance_type: loc_draw
- type: hecm_advance_reversal
  target: hecm_transactions
  meaning: An amount previously added to the balance is reversed because the disbursement was returned, refunded
    or charged in error.
  grain: One row per original transaction reversed.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount reversed.
    effective_date: Reversal date.
    advance_type: What the reversed amount had paid for; not_applicable for a reversed fee.
    source_txn_ref: The original draw, advance posting or fee reversed.
  account: loan_balance
  direction: out
  triggers: []
- type: hecm_plan_change
  target: hecm_loans
  mutation: update
  meaning: The borrower's signed payout plan change is processed and the new plan and payment terms are recorded.
  grain: One row per processed plan change.
  fields:
    variant_name: New payout plan.
    scheduled_payment_amount: New monthly scheduled payment (0.00 if none).
    scheduled_payment_term_months: New term (0 if not term-based).
    scheduled_payment_start_period: First month of the new payments (empty if none).
  triggers:
  - event: hecm:hecm_plan_change_fee
    map: {}
  - event: hecm:hecm_line_commitment
    when:
      variant_name:
      - HECM Tenure Payment Plan
      - HECM Term Payment Plan
      - HECM Modified Tenure Plan
      - HECM Modified Term Plan
    map: {}
- type: hecm_plan_change_fee
  target: hecm_transactions
  meaning: The plan change processing fee is charged to the loan balance.
  grain: One row per processed plan change request.
  distinguish_by:
  - hecm_request_id
  fields:
    amount: Fee charged.
    effective_date: Posting date.
    hecm_request_id: The plan change request processed.
  account: loan_balance
  direction: in
  triggers: []
- type: hecm_due_and_payable
  target: hecm_loans
  mutation:
    transition:
    - from: active
      to: due_and_payable
    - from: deferral_period
      to: due_and_payable
  meaning: The loan enters due-and-payable status following a confirmed maturity event.
  grain: One row per transition.
  fields:
    status: Set to due_and_payable.
    due_and_payable_date: Date of the due-and-payable status.
  triggers: []
- type: hecm_deferral_started
  target: hecm_loans
  mutation:
    transition:
      from: active
      to: deferral_period
  meaning: After the last borrower's death an eligible non-borrowing spouse qualifies and the deferral period begins.
  grain: One row per transition.
  fields:
    status: Set to deferral_period.
    deferral_start_date: Date of the last borrower's death.
  triggers: []
- type: hecm_reinstated
  target: hecm_loans
  mutation:
    transition:
      from: due_and_payable
      to: active
  meaning: A cured maturity case returns the loan to active status.
  grain: One row per transition.
  fields:
    status: Set to active.
    due_and_payable_date: Cleared to empty.
  triggers: []
- type: hecm_paid_in_full
  target: hecm_loans
  mutation:
    transition:
    - from: active
      to: paid_in_full
    - from: due_and_payable
      to: paid_in_full
    - from: deferral_period
      to: paid_in_full
  meaning: The loan is satisfied by a payoff and the lien is released.
  grain: One row per loan (a terminal transition).
  fields:
    status: Set to paid_in_full.
    terminated_date: Date the payoff satisfied the loan.
  triggers: []
- type: hecm_claim_terminated
  target: hecm_loans
  mutation:
    transition:
      from: due_and_payable
      to: claim_terminated
  meaning: The loan ends through short sale, deed in lieu or foreclosure and passes to the FHA insurance claim stage.
  grain: One row per loan (a terminal transition).
  fields:
    status: Set to claim_terminated.
    terminated_date: Date the property disposition completed.
  triggers: []
- type: hecm_line_commitment
  target: hecm_transactions
  meaning: On a plan change into a plan with scheduled payments, the amount the borrower designates to fund the
    payments leaves the available line.
  grain: One row per processed plan change request that commits line funds.
  distinguish_by:
  - hecm_request_id
  fields:
    amount: Amount committed to scheduled payments.
    effective_date: Processing date.
    hecm_request_id: The plan change request.
  account: line_of_credit
  direction: out
  triggers: []
- type: hecm_line_release
  target: hecm_transactions
  meaning: On a plan change out of a plan with scheduled payments, the present value of the payments not yet made
    returns to the available line.
  grain: One row per processed plan change request that releases a payment commitment.
  distinguish_by:
  - hecm_request_id
  fields:
    amount: Commitment released to the line.
    effective_date: Processing date.
    hecm_request_id: The plan change request.
  account: line_of_credit
  direction: in
  triggers: []
measures:
- id: hecm_msr_first_year_draws
  window: From the loan's closing_date (inclusive) to the date first_year_period_months calendar months later (exclusive).
  measure: Sum of amount over hecm_advance_posting rows of the loan with advance_type loc_draw and effective_date
    in the window, less hecm_advance_reversal rows with advance_type loc_draw whose original draw falls in the window.
- id: hecm_msr_outstanding_mip
  window: Life of the loan up to and including the handling date.
  measure: Sum of hecm_mip_accrual amounts less hecm_prepayment amounts with allocation_bucket mip.
- id: hecm_msr_outstanding_fees
  window: Life of the loan up to and including the handling date.
  measure: Sum of hecm_servicing_fee and hecm_plan_change_fee amounts, less hecm_advance_reversal amounts whose
    source is one of those fees, less hecm_prepayment amounts with allocation_bucket servicing_fee.
- id: hecm_msr_outstanding_interest
  window: Life of the loan up to and including the handling date.
  measure: Sum of hecm_interest_accrual amounts less hecm_prepayment amounts with allocation_bucket interest.
- id: hecm_msr_term_payments_made
  window: From the loan's scheduled_payment_start_period (inclusive) to the handling month (inclusive).
  measure: Count of hecm_scheduled_payment rows of the loan whose accrual_period lies in the window.
policies:
- id: hecm_agg_multi_holding
  subject:
  - hecm_loan_boarded
  rule: 'A borrower may hold only one HECM at a time, because FHA insures one HECM per borrower and per principal
    residence. A new HECM is boarded only when the borrower holds no other HECM loan whose status is rescission_period,
    active, due_and_payable or deferral_period. A HECM and a Cedarline Summit first-lien reverse mortgage are mutually
    exclusive on the same borrower: a HECM must be the only lien-holder''s reverse mortgage on the home, so a borrower
    with an open Summit loan of any plan other than Summit Second Lien cannot also hold a HECM, and a Summit Second
    Lien is never placed behind a HECM. Paid-in-full, rescinded and claim-terminated loans do not count toward the
    limit.'
  eligibility:
  - id: one_open_hecm
    applies_to:
    - hecm_loan_boarded
    kind: dedup
    condition: A new HECM is boarded only when the borrower holds no other HECM loan whose status is rescission_period,
      active, due_and_payable or deferral_period.
    evidence_fields:
    - hecm_loans.customer_id
    - hecm_loans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.customer_id
      action_bindings:
        hecm_loans.customer_id: customer_id
    dedup_contract:
      table: hecm_loans
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - rescission_period
        - active
        - due_and_payable
        - deferral_period
      distinct_fields: []
  params:
    max_per_customer: 1
- id: hecm_rescission
  subject:
  - hecm_funded
  - hecm_rescinded
  rule: Every HECM secured by the borrower's principal residence carries a federal right of rescission. Rescission
    business days count every calendar day except Sundays and federal legal public holidays, starting the day after
    the closing date. A rescission is honored only when the borrower's rescission notice is given no later than
    the last rescission business day of the period that starts at the loan closing and lasts rescission_period_business_days.
    A timely rescission cancels the loan, nothing is disbursed, and every fee the borrower paid is refunded within
    rescission_refund_calendar_days calendar days of the notice; a notice given after the period has ended is declined
    with reason rescission_period_expired and the loan proceeds. When no timely notice was received, the loan funds
    on the first_disbursement_business_day-th rescission business day after closing and its status becomes active
    with funding_date set to that day. Only the borrower can give the rescission notice; the servicer records it
    from the borrower's own submission.
  eligibility:
  - id: rescission_window
    applies_to:
    - hecm_rescinded
    kind: time
    condition: A rescission is honored only when the borrower's rescission notice is given no later than the last
      rescission business day of the period that starts at the loan closing and lasts rescission_period_business_days.
    evidence_fields:
    - hecm_loans.closing_date
    - hecm_loans.hecm_loan_id
    - hecm_requests.request_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the loan closing
      anchor_source: hecm_loans.closing_date
      relation: not_after
      duration_source: variants.rescission_period_business_days
      unit: business_days
      counting_rule: Rescission business days count every calendar day except Sundays and federal legal public holidays,
        starting the day after the closing date.
      boundary: inclusive
- id: hecm_evt_loc_draw
  subject:
  - hecm_loc_draw
  - hecm_advance_posting
  rule: A line-of-credit draw is available only on a payout plan whose loc_draws_permitted is true; on any other
    plan the request is declined with reason plan_not_eligible. A draw is booked only while the loan status is active.
    A draw is booked only against a borrower draw request on file for that loan whose request type is loc_draw and
    whose request status is submitted. Cedarline suspends every disbursement from the day a maturity case is opened
    on the loan, so a draw request is declined with reason loan_not_active while the loan has a maturity case whose
    status is opened, awaiting_hud_approval, due_and_payable, extension_period or foreclosure_referred. The draw
    amount must be at least the plan's min_draw_amount, otherwise the request is declined with reason below_minimum_draw,
    and may not exceed the loan's available_line on the handling date, otherwise it is declined with reason insufficient_available_line;
    funds held in any set-aside are never part of the available line and are never released through a draw. During
    the first-year period the closing disbursement amount plus hecm_msr_first_year_draws plus the requested draw
    may not exceed the loan's initial_disbursement_limit. Draws that would bring first-year disbursements above
    the initial disbursement limit are booked only on or after the first anniversary of the loan closing. The first
    anniversary is the same day number in the month first_year_period_months calendar months after the closing date,
    falling back to the last day of that month when that day does not exist. A request that breaches the first-year
    limit before the anniversary is declined in full with reason first_year_limit_exceeded; Cedarline never partially
    funds a draw request. A phone request above phone_draw_max_amount is declined with reason channel_limit_exceeded;
    servicing-portal and signed written requests carry no channel cap. The disbursement method must be one of draw_disbursement_methods;
    a wire is used only for a draw of at least wire_min_amount, and a smaller draw requested by wire is disbursed
    by ach instead. Each request is disbursed at most once. A disbursed draw books one hecm_loc_draw against the
    available line and, on the same effective date, one hecm_advance_posting with advance_type loc_draw for the
    same amount against the loan balance; the effective date is the handling date, which must fall within draw_processing_business_days
    business days of the request date. On success the request's request_status becomes processed with decline_reason
    not_applicable; a declined request gets request_status declined and its decline reason, and nothing is posted.
    Advance postings of every other advance_type are booked only as the consequence of the originating set-aside
    disbursement, repayment-plan advance or occupancy inspection, for the same amount and date, with source_txn_ref
    set to that originating record.
  eligibility:
  - id: draw_loan_active
    applies_to:
    - hecm_loc_draw
    kind: state
    condition: A draw is booked only while the loan status is active.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
  - id: draw_request_on_file
    applies_to:
    - hecm_loc_draw
    kind: authorization
    condition: A draw is booked only against a borrower draw request on file for that loan whose request type is
      loc_draw and whose request status is submitted.
    evidence_fields:
    - hecm_requests.hecm_request_id
    - hecm_requests.request_type
    - hecm_requests.request_status
    - hecm_requests.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_requests.hecm_request_id
      action_bindings:
        hecm_requests.hecm_request_id: hecm_request_id
  - id: first_year_limit
    applies_to:
    - hecm_loc_draw
    kind: time
    condition: Draws that would bring first-year disbursements above the initial disbursement limit are booked only
      on or after the first anniversary of the loan closing.
    evidence_fields:
    - hecm_loans.closing_date
    - hecm_loans.hecm_loan_id
    - hecm_loans.initial_disbursement_limit
    - hecm_loans.closing_disbursement_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the loan closing
      anchor_source: hecm_loans.closing_date
      relation: not_before
      duration_source: variants.first_year_period_months
      unit: calendar_months
      counting_rule: The first anniversary is the same day number in the month first_year_period_months calendar
        months after the closing date, falling back to the last day of that month when that day does not exist.
      boundary: inclusive
  - id: draw_once
    applies_to:
    - hecm_loc_draw
    kind: dedup
    condition: Each request is disbursed at most once.
    evidence_fields:
    - hecm_transactions.hecm_request_id
    - hecm_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_transactions.hecm_request_id
      action_bindings:
        hecm_transactions.hecm_request_id: hecm_request_id
    dedup_contract:
      table: hecm_transactions
      mode: separate_record
      object_bindings:
        hecm_request_id: hecm_request_id
      duplicate_filters:
        event_type:
        - hecm_loc_draw
      distinct_fields: []
  params:
    per_tier:
      HECM Line of Credit:
        loc_draws_permitted: =loc_draws_permitted
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      HECM Tenure Payment Plan:
        loc_draws_permitted: =loc_draws_permitted
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      HECM Term Payment Plan:
        loc_draws_permitted: =loc_draws_permitted
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      HECM Modified Tenure Plan:
        loc_draws_permitted: =loc_draws_permitted
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      HECM Modified Term Plan:
        loc_draws_permitted: =loc_draws_permitted
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
      HECM Fixed-Rate Single Disbursement:
        loc_draws_permitted: =loc_draws_permitted
        min_draw_amount: =min_draw_amount
        phone_draw_max_amount: =phone_draw_max_amount
  formula:
    first_year_headroom: initial_disbursement_limit - closing_disbursement_amount - hecm_msr_first_year_draws
    max_draw_first_year: min(available_line, first_year_headroom)
    max_draw_after_anniversary: available_line
  measures:
  - hecm_msr_first_year_draws
- id: hecm_evt_scheduled_payment
  subject:
  - hecm_scheduled_payment
  rule: Scheduled payments are disbursed only on plans whose scheduled_payments_permitted is true, on scheduled_payment_day
    of each month, in the scheduled_payment_amount on the loan record. A scheduled payment is disbursed only while
    the loan status is active; payments stop for good once the loan is due and payable or in the deferral period,
    and no payment is made for a month that began before the loan funded. A tenure-based plan pays every month while
    the loan is active. A term-based plan pays only while hecm_msr_term_payments_made is less than scheduled_payment_term_months;
    after the last term payment the scheduled payments end and any available line remains drawable only on the Modified
    Term plan. Each payment month is disbursed once. The effective date of a payment is scheduled_payment_day of
    its month and its accrual_period is that month.
  eligibility:
  - id: payment_loan_active
    applies_to:
    - hecm_scheduled_payment
    kind: state
    condition: A scheduled payment is disbursed only while the loan status is active; payments stop for good once
      the loan is due and payable or in the deferral period, and no payment is made for a month that began before
      the loan funded.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
  - id: payment_month_once
    applies_to:
    - hecm_scheduled_payment
    kind: dedup
    condition: Each payment month is disbursed once.
    evidence_fields:
    - hecm_transactions.hecm_loan_id
    - hecm_transactions.accrual_period
    - hecm_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_transactions.hecm_loan_id
        - hecm_transactions.accrual_period
      action_bindings:
        hecm_transactions.hecm_loan_id: hecm_loan_id
        hecm_transactions.accrual_period: accrual_period
    dedup_contract:
      table: hecm_transactions
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
        accrual_period: accrual_period
      duplicate_filters:
        event_type:
        - hecm_scheduled_payment
      distinct_fields: []
  measures:
  - hecm_msr_term_payments_made
- id: hecm_evt_interest_mip
  subject:
  - hecm_interest_accrual
  - hecm_mip_accrual
  rule: Interest and the annual mortgage insurance premium accrue monthly and are posted on servicing_fee_assessment_day
    for the prior month, which is the accrual_period of both rows. The balance basis is the principal_balance at
    the end of the accrual month, that is the sum of all loan_balance deltas with effective_date on or before the
    last day of that month. Interest equals the balance basis times one twelfth of the note_rate_pct in effect for
    that month; MIP equals the balance basis times one twelfth of annual_mip_rate_pct; each is rounded half up to
    the cent per accrual_rounding, and rate_applied_pct records the annual rate used. Interest and MIP accrue only
    while the loan status is active, due_and_payable or deferral_period. Nothing accrues for a month that ended
    before the loan funded, and accrual stops with the month in which the loan is paid in full or claim-terminated;
    a month whose balance basis is 0.00 posts no rows. Each accrual month is posted once per family. The computation
    follows interest_accrual_method.
  eligibility:
  - id: accrual_states
    applies_to:
    - hecm_interest_accrual
    - hecm_mip_accrual
    kind: state
    condition: Interest and MIP accrue only while the loan status is active, due_and_payable or deferral_period.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
      - due_and_payable
      - deferral_period
  formula:
    interest_amount: round(principal_balance * note_rate_pct / 1200, 2)
    mip_amount: round(principal_balance * annual_mip_rate_pct / 1200, 2)
- id: hecm_evt_servicing_fee
  subject:
  - hecm_servicing_fee
  - hecm_advance_reversal
  rule: A monthly servicing fee is charged only on a loan whose servicing_fee_option is monthly_fee_with_setaside;
    a loan whose servicing fee is included_in_rate is never charged a servicing fee. The fee is servicing_fee_monthly_adjustable
    when the loan's rate_type is monthly_adjustable and servicing_fee_annual_or_fixed when the rate_type is annual_adjustable
    or fixed. The fee for a month is posted on servicing_fee_assessment_day of the following month with that month
    as accrual_period, and the same amount is drawn from the loan's Servicing Fee Set-Aside. A servicing fee is
    charged only while the loan status is active, due_and_payable or deferral_period; no fee is charged for a month
    that ended before the loan funded or after the month the loan was paid in full or claim-terminated. A fee charged
    on a loan whose option is included_in_rate, or charged twice for the same month, is reversed in full by one
    hecm_advance_reversal with advance_type not_applicable and source_txn_ref set to the erroneous fee, and the
    set-aside draw it caused is refunded to the set-aside. Each fee month is charged once.
  eligibility:
  - id: fee_states
    applies_to:
    - hecm_servicing_fee
    kind: state
    condition: A servicing fee is charged only while the loan status is active, due_and_payable or deferral_period;
      no fee is charged for a month that ended before the loan funded or after the month the loan was paid in full
      or claim-terminated.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
      - due_and_payable
      - deferral_period
  - id: fee_month_once
    applies_to:
    - hecm_servicing_fee
    kind: dedup
    condition: Each fee month is charged once.
    evidence_fields:
    - hecm_transactions.hecm_loan_id
    - hecm_transactions.accrual_period
    - hecm_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_transactions.hecm_loan_id
        - hecm_transactions.accrual_period
      action_bindings:
        hecm_transactions.hecm_loan_id: hecm_loan_id
        hecm_transactions.accrual_period: accrual_period
    dedup_contract:
      table: hecm_transactions
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
        accrual_period: accrual_period
      duplicate_filters:
        event_type:
        - hecm_servicing_fee
      distinct_fields: []
  params:
    per_tier:
      HECM Line of Credit:
        servicing_fee_monthly_adjustable: =servicing_fee_monthly_adjustable
        servicing_fee_annual_or_fixed: =servicing_fee_annual_or_fixed
      HECM Tenure Payment Plan:
        servicing_fee_monthly_adjustable: =servicing_fee_monthly_adjustable
        servicing_fee_annual_or_fixed: =servicing_fee_annual_or_fixed
      HECM Term Payment Plan:
        servicing_fee_monthly_adjustable: =servicing_fee_monthly_adjustable
        servicing_fee_annual_or_fixed: =servicing_fee_annual_or_fixed
      HECM Modified Tenure Plan:
        servicing_fee_monthly_adjustable: =servicing_fee_monthly_adjustable
        servicing_fee_annual_or_fixed: =servicing_fee_annual_or_fixed
      HECM Modified Term Plan:
        servicing_fee_monthly_adjustable: =servicing_fee_monthly_adjustable
        servicing_fee_annual_or_fixed: =servicing_fee_annual_or_fixed
      HECM Fixed-Rate Single Disbursement:
        servicing_fee_monthly_adjustable: =servicing_fee_monthly_adjustable
        servicing_fee_annual_or_fixed: =servicing_fee_annual_or_fixed
  formula:
    when_not: servicing_fee_option == 'included_in_rate'
    fee_amount: servicing_fee_monthly_adjustable if rate_type == 'monthly_adjustable' else servicing_fee_annual_or_fixed
- id: hecm_evt_line_growth
  subject:
  - hecm_line_growth
  rule: On plans whose line_growth_applies is true the unused available line grows every month at an annual rate
    equal to the note_rate_pct in effect for the month plus line_growth_spread_pct, compounded monthly. Growth for
    a month is credited on servicing_fee_assessment_day of the following month with that month as accrual_period,
    on the available_line at the end of the month, rounded half up to the cent; rate_applied_pct records the annual
    growth rate used. Line growth is credited only while the loan status is active. A month whose ending available
    line is 0.00 posts no row, the fixed-rate single disbursement plan never earns growth, and growth stops for
    good once the loan is due and payable, in the deferral period or terminated. Each growth month is credited once.
  eligibility:
  - id: growth_active
    applies_to:
    - hecm_line_growth
    kind: state
    condition: Line growth is credited only while the loan status is active.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
  params:
    per_tier:
      HECM Line of Credit:
        line_growth_applies: =line_growth_applies
        line_growth_spread_pct: =line_growth_spread_pct
      HECM Tenure Payment Plan:
        line_growth_applies: =line_growth_applies
        line_growth_spread_pct: =line_growth_spread_pct
      HECM Term Payment Plan:
        line_growth_applies: =line_growth_applies
        line_growth_spread_pct: =line_growth_spread_pct
      HECM Modified Tenure Plan:
        line_growth_applies: =line_growth_applies
        line_growth_spread_pct: =line_growth_spread_pct
      HECM Modified Term Plan:
        line_growth_applies: =line_growth_applies
        line_growth_spread_pct: =line_growth_spread_pct
      HECM Fixed-Rate Single Disbursement:
        line_growth_applies: =line_growth_applies
        line_growth_spread_pct: =line_growth_spread_pct
  formula:
    when_not: line_growth_applies == False
    growth_amount: round(available_line * (note_rate_pct + line_growth_spread_pct) / 1200, 2)
- id: hecm_evt_prepayment
  subject:
  - hecm_prepayment
  - hecm_line_restore
  rule: 'A borrower may prepay any part of the balance at any time without penalty, per prepayment_penalty_pct.
    A prepayment is applied only while the loan status is active, deferral_period or due_and_payable. A partial
    prepayment is applied in prepayment_allocation_order: first to outstanding MIP (hecm_msr_outstanding_mip), then
    to outstanding servicing fees (hecm_msr_outstanding_fees), then to outstanding interest (hecm_msr_outstanding_interest),
    and the rest to principal; each bucket takes the lesser of the remittance still unapplied and that bucket''s
    outstanding amount, and one row is posted per bucket that receives a positive amount, all dated the day the
    funds were received. A remittance equal to or larger than the whole principal_balance is not a partial prepayment
    and is handled as a payoff under the payoff charter. Installments remitted under a property-charge repayment
    plan are applied the same way, with source_txn_ref set to the installment. On plans whose prepayment_restores_line
    is true and while the loan status is active, every prepaid portion posts with restores_line true and the same
    amount is credited back to the available line on the same date as one hecm_line_restore referencing that portion;
    on the fixed-rate single disbursement plan, and on any loan that is due_and_payable or in the deferral period,
    restores_line is false and nothing is restored.'
  eligibility:
  - id: prepay_states
    applies_to:
    - hecm_prepayment
    kind: state
    condition: A prepayment is applied only while the loan status is active, deferral_period or due_and_payable.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
      - deferral_period
      - due_and_payable
  params:
    per_tier:
      HECM Line of Credit:
        prepayment_restores_line: =prepayment_restores_line
      HECM Tenure Payment Plan:
        prepayment_restores_line: =prepayment_restores_line
      HECM Term Payment Plan:
        prepayment_restores_line: =prepayment_restores_line
      HECM Modified Tenure Plan:
        prepayment_restores_line: =prepayment_restores_line
      HECM Modified Term Plan:
        prepayment_restores_line: =prepayment_restores_line
      HECM Fixed-Rate Single Disbursement:
        prepayment_restores_line: =prepayment_restores_line
  formula:
    to_principal_after_buckets: max(0, amount - hecm_msr_outstanding_mip - hecm_msr_outstanding_fees - hecm_msr_outstanding_interest)
  measures:
  - hecm_msr_outstanding_mip
  - hecm_msr_outstanding_fees
  - hecm_msr_outstanding_interest
- id: hecm_evt_disbursement_return
  subject:
  - hecm_disbursement_return
  - hecm_advance_reversal
  rule: On plans whose returned_disbursement_line_credit is true, a draw that the receiving bank returns, or a draw
    check that is voided as uncashed, is credited back to the available line by one hecm_disbursement_return and
    reversed from the balance on the same date by one hecm_advance_reversal with advance_type loc_draw, both for
    the full draw amount and both referencing the original draw in source_txn_ref. A draw check is voided as uncashed
    only when uncashed_check_void_days calendar days have passed since the draw was disbursed. The days are counted
    as calendar days starting the day after the draw's effective_date, and the void is allowed on the last counted
    day itself. A returned bank transfer is credited on the date the return was received, with no waiting period.
    When a tax authority or insurer refunds a set-aside disbursement, the refunded amount is reversed from the balance
    by one hecm_advance_reversal carrying the original advance_type and referencing the refunded advance posting.
    Each original transaction is reversed from the balance at most once, and a reversal never exceeds the original
    amount; for a returned draw the reversal references the original draw itself. A returned scheduled payment is
    not reversed; it is reissued to corrected payment instructions with no new ledger entry.
  eligibility:
  - id: void_after_days
    applies_to:
    - hecm_disbursement_return
    kind: time
    condition: A draw check is voided as uncashed only when uncashed_check_void_days calendar days have passed since
      the draw was disbursed.
    evidence_fields:
    - hecm_transactions.effective_date
    - hecm_transactions.hecm_txn_id
    - hecm_transactions.disbursement_method
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_transactions.hecm_txn_id
      action_bindings:
        hecm_transactions.hecm_txn_id: source_txn_ref
    temporal_basis:
      clock: frozen_time
      anchor_event: the draw was disbursed
      anchor_source: hecm_transactions.effective_date
      relation: not_before
      duration_source: variants.uncashed_check_void_days
      unit: calendar_days
      counting_rule: The days are counted as calendar days starting the day after the draw's effective_date, and
        the void is allowed on the last counted day itself.
      boundary: inclusive
  - id: reverse_once
    applies_to:
    - hecm_advance_reversal
    kind: dedup
    condition: Each original transaction is reversed from the balance at most once, and a reversal never exceeds
      the original amount; for a returned draw the reversal references the original draw itself.
    evidence_fields:
    - hecm_transactions.source_txn_ref
    - hecm_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_transactions.source_txn_ref
      action_bindings:
        hecm_transactions.source_txn_ref: source_txn_ref
    dedup_contract:
      table: hecm_transactions
      mode: separate_record
      object_bindings:
        source_txn_ref: source_txn_ref
      duplicate_filters:
        event_type:
        - hecm_advance_reversal
      distinct_fields: []
- id: hecm_payment_plan_change
  subject:
  - hecm_plan_change
  - hecm_plan_change_fee
  - hecm_line_commitment
  - hecm_line_release
  rule: 'A borrower may change payout plan only where payment_plan_change_permitted is true; the HECM Fixed-Rate
    Single Disbursement is closed-end, can never change plan, and no adjustable loan may change into it, so such
    requests are declined with reason plan_not_eligible. A plan change is processed only while the loan status is
    active. A plan change is processed only against a payment plan change request on file for that loan whose request
    status is submitted and which was submitted through the signed_written channel bearing the signature of every
    borrower on the note. A requested term for a term-based plan must lie between the target plan''s term_min_months
    and term_max_months inclusive, otherwise the request is declined with reason plan_not_eligible. Processing happens
    in this order on the handling date: when the current plan pays scheduled payments, the present value of the
    payments not yet made returns to the available line as one hecm_line_release; then, when the target plan pays
    scheduled payments, the committed amount leaves the available line as one hecm_line_commitment; then the plan,
    payment and term on the loan record are updated; then payment_plan_change_fee is charged as one hecm_plan_change_fee.
    The monthly rate for every payment computation is one twelfth of the sum of the loan''s expected_rate_pct and
    annual_mip_rate_pct, and payments are treated as made at the start of each month. The release amount is the
    current scheduled_payment_amount times (1 + monthly rate) times (1 - (1 + monthly rate) to the power of minus
    the remaining payments) divided by the monthly rate, rounded half up to the cent; the remaining payments are
    scheduled_payment_term_months less hecm_msr_term_payments_made for a term-based plan, and for a tenure-based
    plan twelve times the difference between tenure_age_horizon_years and the age in whole years, on the first day
    of the month the change takes effect, of the youngest borrower or eligible non-borrowing spouse on the loan.
    For a change into the Tenure or Term plan the whole available line after any release is committed; for a change
    into a Modified plan the committed amount is the requested_amount on the request, which may not exceed the available
    line after any release, otherwise the request is declined with reason insufficient_available_line. The new scheduled
    payment is the committed amount times the monthly rate divided by ((1 + monthly rate) times (1 - (1 + monthly
    rate) to the power of minus the payment count)), rounded half up to the cent, where the payment count is the
    requested term for a term-based plan and, for a tenure-based plan, twelve times the difference between tenure_age_horizon_years
    and that same youngest age. A change into the HECM Line of Credit sets scheduled_payment_amount to 0.00, scheduled_payment_term_months
    to 0 and scheduled_payment_start_period to empty; any other change sets scheduled_payment_start_period to the
    month after the handling month, per plan_change_effective_rule. Each request is processed at most once, and
    on success its request_status becomes processed. Every borrower''s signature is needed, per plan_change_signed_request_required.'
  eligibility:
  - id: change_loan_active
    applies_to:
    - hecm_plan_change_fee
    - hecm_line_commitment
    - hecm_line_release
    kind: state
    condition: A plan change is processed only while the loan status is active.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
  - id: signed_change_request
    applies_to:
    - hecm_plan_change
    kind: authorization
    condition: A plan change is processed only against a payment plan change request on file for that loan whose
      request status is submitted and which was submitted through the signed_written channel bearing the signature
      of every borrower on the note.
    evidence_fields:
    - hecm_requests.hecm_request_id
    - hecm_requests.request_type
    - hecm_requests.request_status
    - hecm_requests.request_channel
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_requests.hecm_request_id
      action_bindings:
        hecm_requests.hecm_request_id: hecm_request_id
  - id: change_once
    applies_to:
    - hecm_plan_change_fee
    kind: dedup
    condition: Each request is processed at most once, and on success its request_status becomes processed.
    evidence_fields:
    - hecm_transactions.hecm_request_id
    - hecm_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_transactions.hecm_request_id
      action_bindings:
        hecm_transactions.hecm_request_id: hecm_request_id
    dedup_contract:
      table: hecm_transactions
      mode: separate_record
      object_bindings:
        hecm_request_id: hecm_request_id
      duplicate_filters:
        event_type:
        - hecm_plan_change_fee
      distinct_fields: []
  params:
    per_tier:
      HECM Line of Credit:
        payment_plan_change_permitted: =payment_plan_change_permitted
        payment_plan_change_fee: =payment_plan_change_fee
        term_min_months: =term_min_months
        term_max_months: =term_max_months
      HECM Tenure Payment Plan:
        payment_plan_change_permitted: =payment_plan_change_permitted
        payment_plan_change_fee: =payment_plan_change_fee
        term_min_months: =term_min_months
        term_max_months: =term_max_months
      HECM Term Payment Plan:
        payment_plan_change_permitted: =payment_plan_change_permitted
        payment_plan_change_fee: =payment_plan_change_fee
        term_min_months: =term_min_months
        term_max_months: =term_max_months
      HECM Modified Tenure Plan:
        payment_plan_change_permitted: =payment_plan_change_permitted
        payment_plan_change_fee: =payment_plan_change_fee
        term_min_months: =term_min_months
        term_max_months: =term_max_months
      HECM Modified Term Plan:
        payment_plan_change_permitted: =payment_plan_change_permitted
        payment_plan_change_fee: =payment_plan_change_fee
        term_min_months: =term_min_months
        term_max_months: =term_max_months
      HECM Fixed-Rate Single Disbursement:
        payment_plan_change_permitted: =payment_plan_change_permitted
        payment_plan_change_fee: =payment_plan_change_fee
        term_min_months: =term_min_months
        term_max_months: =term_max_months
  formula:
    monthly_rate: (expected_rate_pct + annual_mip_rate_pct) / 1200
    term_release_amount: round(scheduled_payment_amount * (1 + monthly_rate) * (1 - (1 + monthly_rate) ** (-(scheduled_payment_term_months
      - hecm_msr_term_payments_made))) / monthly_rate, 2)
    term_payment_on_commitment: round(amount * monthly_rate / ((1 + monthly_rate) * (1 - (1 + monthly_rate) ** (-scheduled_payment_term_months))),
      2)
  measures:
  - hecm_msr_term_payments_made
- id: hecm_status_maturity
  subject:
  - hecm_due_and_payable
  - hecm_deferral_started
  - hecm_reinstated
  - hecm_paid_in_full
  - hecm_claim_terminated
  rule: The loan's servicing status follows its maturity case and payoff case; the servicer never changes it on
    a caller's statement alone. The loan is moved to due_and_payable only when a maturity case on the loan has reached
    due_and_payable status, and due_and_payable_date is set to that case's due_and_payable_date. When the last surviving
    borrower dies and the loan names a non-borrowing spouse whose profile_type is eligible_non_borrowing_spouse
    who still occupies the home as principal residence, and nbs_deferral_available is true, the loan enters the
    deferral period instead of due-and-payable status, with deferral_start_date set to the date of death. The deferral
    period is entered only when the eligible non-borrowing spouse establishes a legal right to remain no later than
    deferral_legal_right_days calendar days after the last borrower's death. Those days are counted as calendar
    days starting the day after the date of death recorded on the maturity case, and the last counted day still
    qualifies. An ineligible non-borrowing spouse never qualifies for deferral, and a deferral loan becomes due
    and payable when its deferral-period case reaches due_and_payable status. A loan is reinstated to active only
    when its maturity case has reached cured status. The loan is marked paid_in_full only when a payoff case on
    the loan has reached satisfied status under a payoff plan other than Approved Short Sale Payoff and Deed in
    Lieu of Foreclosure, and it is marked claim_terminated only when such a case is satisfied under Approved Short
    Sale Payoff or Deed in Lieu of Foreclosure; terminated_date is the date the payoff case was satisfied. Once
    due and payable, no draw or scheduled payment is made, per draws_stop_at_due_and_payable.
  eligibility:
  - id: maturity_case_due
    applies_to:
    - hecm_due_and_payable
    kind: state
    condition: The loan is moved to due_and_payable only when a maturity case on the loan has reached due_and_payable
      status, and due_and_payable_date is set to that case's due_and_payable_date.
    evidence_fields:
    - maturity_cases.status
    - maturity_cases.hecm_loan_id
    - maturity_cases.maturity_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    state_contract:
      field: maturity_cases.status
      allowed:
      - due_and_payable
  - id: deferral_legal_right
    applies_to:
    - hecm_deferral_started
    kind: time
    condition: The deferral period is entered only when the eligible non-borrowing spouse establishes a legal right
      to remain no later than deferral_legal_right_days calendar days after the last borrower's death.
    evidence_fields:
    - maturity_cases.event_date
    - maturity_cases.maturity_case_id
    - customers.profile_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the last borrower's death
      anchor_source: maturity_cases.event_date
      relation: not_after
      duration_source: variants.deferral_legal_right_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the date of death recorded on
        the maturity case, and the last counted day still qualifies.
      boundary: inclusive
  - id: cured_case
    applies_to:
    - hecm_reinstated
    kind: state
    condition: A loan is reinstated to active only when its maturity case has reached cured status.
    evidence_fields:
    - maturity_cases.status
    - maturity_cases.maturity_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    state_contract:
      field: maturity_cases.status
      allowed:
      - cured
  - id: payoff_satisfied
    applies_to:
    - hecm_paid_in_full
    - hecm_claim_terminated
    kind: state
    condition: The loan is marked paid_in_full only when a payoff case on the loan has reached satisfied status
      under a payoff plan other than Approved Short Sale Payoff and Deed in Lieu of Foreclosure, and it is marked
      claim_terminated only when such a case is satisfied under Approved Short Sale Payoff or Deed in Lieu of Foreclosure;
      terminated_date is the date the payoff case was satisfied.
    evidence_fields:
    - payoff_cases.status
    - payoff_cases.variant_name
    - payoff_cases.payoff_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    state_contract:
      field: payoff_cases.status
      allowed:
      - satisfied
- id: hecm_terms_and_rate
  subject:
  - hecm_loan_boarded
  - hecm_rate_adjusted
  rule: 'A loan is boarded with the terms fixed at closing: the youngest borrower was at least min_youngest_borrower_age,
    the rate type is one of the plan''s rate_types_permitted, the maximum claim amount is the lesser of the appraised
    value and max_claim_limit, the upfront premium was initial_mip_rate_pct percent of the maximum claim amount,
    and the origination fee was origination_fee_pct_first_200k percent of the first 200,000.00 plus origination_fee_pct_above_200k
    percent of the rest, never below origination_fee_floor nor above origination_fee_cap. The initial_disbursement_limit
    is the greater of first_year_disbursement_limit_pct percent of the initial principal limit and the mandatory
    obligations plus mandatory_obligation_cushion_pct percent of the initial principal limit, never more than the
    initial principal limit; on the HECM Fixed-Rate Single Disbursement the whole available amount is paid at closing,
    per single_full_draw_at_closing. The loan''s servicing_fee_option is one of the plan''s servicing_fee_options_offered
    and never changes after closing. A monthly adjustable rate resets on the first day of every month to the plan''s
    monthly_adjustable_index plus margin_pct, never more than monthly_adjustable_lifetime_cap_pct above initial_note_rate_pct;
    an annual adjustable rate resets on each closing anniversary to annual_adjustable_index plus margin_pct, moving
    at most annual_adjustable_periodic_cap_pct at one reset and never more than annual_adjustable_lifetime_cap_pct
    above initial_note_rate_pct; a fixed rate never changes, and no rate falls below the margin. A rate adjustment
    is recorded only while the loan status is active, due_and_payable or deferral_period.'
  eligibility:
  - id: adjust_open_loan
    applies_to:
    - hecm_rate_adjusted
    kind: state
    condition: A rate adjustment is recorded only while the loan status is active, due_and_payable or deferral_period.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - active
      - due_and_payable
      - deferral_period
  params:
    per_tier:
      HECM Line of Credit:
        monthly_adjustable_lifetime_cap_pct: =monthly_adjustable_lifetime_cap_pct
        annual_adjustable_periodic_cap_pct: =annual_adjustable_periodic_cap_pct
        annual_adjustable_lifetime_cap_pct: =annual_adjustable_lifetime_cap_pct
      HECM Tenure Payment Plan:
        monthly_adjustable_lifetime_cap_pct: =monthly_adjustable_lifetime_cap_pct
        annual_adjustable_periodic_cap_pct: =annual_adjustable_periodic_cap_pct
        annual_adjustable_lifetime_cap_pct: =annual_adjustable_lifetime_cap_pct
      HECM Term Payment Plan:
        monthly_adjustable_lifetime_cap_pct: =monthly_adjustable_lifetime_cap_pct
        annual_adjustable_periodic_cap_pct: =annual_adjustable_periodic_cap_pct
        annual_adjustable_lifetime_cap_pct: =annual_adjustable_lifetime_cap_pct
      HECM Modified Tenure Plan:
        monthly_adjustable_lifetime_cap_pct: =monthly_adjustable_lifetime_cap_pct
        annual_adjustable_periodic_cap_pct: =annual_adjustable_periodic_cap_pct
        annual_adjustable_lifetime_cap_pct: =annual_adjustable_lifetime_cap_pct
      HECM Modified Term Plan:
        monthly_adjustable_lifetime_cap_pct: =monthly_adjustable_lifetime_cap_pct
        annual_adjustable_periodic_cap_pct: =annual_adjustable_periodic_cap_pct
        annual_adjustable_lifetime_cap_pct: =annual_adjustable_lifetime_cap_pct
      HECM Fixed-Rate Single Disbursement:
        monthly_adjustable_lifetime_cap_pct: =monthly_adjustable_lifetime_cap_pct
        annual_adjustable_periodic_cap_pct: =annual_adjustable_periodic_cap_pct
        annual_adjustable_lifetime_cap_pct: =annual_adjustable_lifetime_cap_pct
  formula:
    initial_disbursement_limit_calc: min(initial_principal_limit, max(round(initial_principal_limit * first_year_disbursement_limit_pct
      / 100, 2), mandatory_obligations_amount + round(initial_principal_limit * mandatory_obligation_cushion_pct
      / 100, 2)))
extended_policies:
- id: hecm_ext_draw_ceiling
  base_policy_refs:
  - hecm_evt_loc_draw
  overwrite:
  - base_policy: hecm_evt_loc_draw
    superseded_clause: >-
      During the first-year period the closing disbursement amount plus hecm_msr_first_year_draws plus the requested
      draw may not exceed the loan's initial_disbursement_limit.
    replaced_by: >-
      During the first-year period the closing disbursement amount plus hecm_msr_first_year_draws plus the requested
      draw may not exceed the loan's initial_disbursement_limit; for a draw request sized at the draw ceiling, and
      only for such a request, that limit is applied through the draw ceiling's own first-year room, the initial_disbursement_limit
      less the closing_disbursement_amount less the draw ceiling's first-year draws, which count every advance posting
      of type loc_draw on the loan at its amount less every return entry crediting a draw back to the line.
  - base_policy: hecm_evt_loc_draw
    superseded_clause: >-
      The draw amount must be at least the plan's min_draw_amount, otherwise the request is declined with reason
      below_minimum_draw, and may not exceed the loan's available_line on the handling date, otherwise it is declined
      with reason insufficient_available_line; funds held in any set-aside are never part of the available line
      and are never released through a draw.
    replaced_by: >-
      The draw amount must be at least the plan's min_draw_amount, otherwise the request is declined with reason
      below_minimum_draw, and may not exceed the loan's available_line on the handling date, otherwise it is declined
      with reason insufficient_available_line; funds held in any set-aside are never part of the available line
      and are never released through a draw; a draw request sized at the draw ceiling, and only such a request,
      may in addition not exceed the draw ceiling on the handling date, otherwise it is declined with reason insufficient_available_line.
  - base_policy: hecm_evt_loc_draw
    superseded_clause: >-
      The first anniversary is the same day number in the month first_year_period_months calendar months after the
      closing date, falling back to the last day of that month when that day does not exist.
    replaced_by: >-
      The first anniversary is the same day number in the month first_year_period_months calendar months after the
      closing date, falling back to the last day of that month when that day does not exist; for a draw request
      sized at the draw ceiling, and only for such a request, the first anniversary is reached once first_year_period_months
      whole calendar months have passed since the closing date, a whole month being complete on the later month's
      day with the closing date's day number, or on the first day of the following month when that month has no
      such day number.
  trigger: on_request
  subject:
  - hecm_advance_posting
  computes: requested_amount
  target_tool: submit_line_draw_request_b0795434
  params:
    installment_months_reserved: 12
  rule: >-
    When a borrower asks to draw the most the line allows, the borrower's own draw request is filed for the draw
    ceiling, the largest line-of-credit draw request Cedarline accepts on the handling date. The draw ceiling is
    worked out only once no payout plan change request on file for the loan still shows request status submitted.
    The draw ceiling is not worked out until every check draw on the loan whose draw request shows request status
    withdrawn carries its return entry. The draw ceiling is the drawable figure less the amounts kept, each amount
    worked out on its own and added to the amounts kept, the result floored at 0.00; the only roundings are those
    stated for an amount itself and the final rounding of the draw ceiling, half up to the cent. On or after the
    first anniversary of the loan closing the drawable figure is the loan's available_line. Before the first anniversary
    the drawable figure is the lesser of the available_line and the draw ceiling's own first-year room. The first
    anniversary is the same day number in the month first_year_period_months calendar months after the closing date,
    falling back to the last day of that month when that day does not exist; for a draw request sized at the draw
    ceiling, and only for such a request, the first anniversary is reached once first_year_period_months whole calendar
    months have passed since the closing date, a whole month being complete on the later month's day with the closing
    date's day number, or on the first day of the following month when that month has no such day number. Under
    the standard rule no amount is kept in the line or earmarked for the draw ceiling, so the amounts kept are 0.00.
    During the first-year period the closing disbursement amount plus hecm_msr_first_year_draws plus the requested
    draw may not exceed the loan's initial_disbursement_limit; for a draw request sized at the draw ceiling, and
    only for such a request, that limit is applied through the draw ceiling's own first-year room, the initial_disbursement_limit
    less the closing_disbursement_amount less the draw ceiling's first-year draws, which count every advance posting
    of type loc_draw on the loan at its amount less every return entry crediting a draw back to the line. Added
    to the amounts kept for the draw ceiling: Cedarline keeps in the line what the loan's open property charge repayment
    record still needs, a loan holding at most one open record: when that record's status is notice_period, pending_signature
    or defaulted with an arrearage_balance above 0.00, the arrangement reserve is its whole arrearage_balance; when
    its status is active with an arrearage_balance above 0.00 and a monthly_installment above 0.00, the arrangement
    reserve is installment_months_reserved monthly installments, rounded half up to the cent, or the arrearage_balance
    when smaller; otherwise the arrangement reserve is 0.00. Added to the amounts kept for the draw ceiling: Cedarline
    keeps in the line for the draw ceiling the next property tax bill it last had to advance: when Cedarline advanced
    property tax on the loan on a payment date after the same day of the month twelve calendar months before the
    handling date, the tax renewal reserve is the total of the property tax advanced in that window; when no property
    tax was advanced in that window but a set-aside on the loan is depleted with an annual_property_tax above 0.00,
    the tax renewal reserve is that annual_property_tax; otherwise the tax renewal reserve is 0.00. Added to the
    amounts kept for the draw ceiling: Cedarline keeps in the line for the draw ceiling the insurance renewal it
    last had to advance: when Cedarline advanced a hazard or flood insurance premium on the loan on a payment date
    after the same day of the month twelve calendar months before the handling date, the insurance renewal reserve
    is the total of the hazard and flood insurance premiums advanced in that window; when none was advanced in that
    window but a set-aside on the loan is depleted with an annual_hazard_premium or annual_flood_premium above 0.00,
    it is those two annual premiums together; otherwise the insurance renewal reserve is 0.00. Added to the amounts
    kept for the draw ceiling: Cedarline earmarks for the draw ceiling the draw requests already queued on the loan,
    meaning its draw requests whose request status is submitted: when at least one queued draw request came through
    the servicing portal or a signed written form, the queued request earmark is the full total of every queued
    draw request; when every queued draw request came by phone, the queued request earmark is their total but no
    more than the plan's phone_draw_max_amount; otherwise the queued request earmark is 0.00. Added to the amounts
    kept for the draw ceiling: Cedarline keeps in the line for the draw ceiling the occupancy inspection fees a
    certification lapse will cost: when the loan's occupancy certification profile is overdue or in absence_monitoring
    and its plan's occupancy_inspection_fee is above 0.00, the inspection reserve is twice the profile plan's occupancy_inspection_fee;
    when the profile is current and occupancy inspection fees were posted to the loan on a date after the same day
    of the month twelve calendar months before the handling date, the inspection reserve is what the last cycle
    actually cost, the total of the occupancy inspection fees posted in that window; otherwise the inspection reserve
    is 0.00. The draw amount must be at least the plan's min_draw_amount, otherwise the request is declined with
    reason below_minimum_draw, and may not exceed the loan's available_line on the handling date, otherwise it is
    declined with reason insufficient_available_line; funds held in any set-aside are never part of the available
    line and are never released through a draw; a draw request sized at the draw ceiling, and only such a request,
    may in addition not exceed the draw ceiling on the handling date, otherwise it is declined with reason insufficient_available_line.
    Every other clause of the base draw rule stays in force for the draw that follows the request.
  compute:
  - line: F('available_line')
  - before_anniv: MONTHS(F('closing_date'), NOW) < P('first_year_period_months')
  - fy_draws: >-
      SUM('hecm_transactions', 'amount', event_type='hecm_advance_posting', advance_type='loc_draw') - SUM('hecm_transactions',
      'amount', event_type='hecm_disbursement_return')
  - room: F('initial_disbursement_limit') - F('closing_disbursement_amount') - fy_draws
  - drawable: MN(line, room) if before_anniv else line
  - pc_lump: >-
      (CFIELD('propcharge', 'arrearage_balance', hecm_loan_id=HID, status='notice_period') or 0) + (CFIELD('propcharge',
      'arrearage_balance', hecm_loan_id=HID, status='pending_signature') or 0) + (CFIELD('propcharge', 'arrearage_balance',
      hecm_loan_id=HID, status='defaulted') or 0)
  - pc_act: >-
      CFIELD('propcharge', 'arrearage_balance', hecm_loan_id=HID, status='active') or 0
  - pc_inst: >-
      CFIELD('propcharge', 'monthly_installment', hecm_loan_id=HID, status='active') or 0
  - arrangement_reserve: >-
      pc_lump if pc_lump > 0 else (MN(pc_act, RND(pc_inst * K('installment_months_reserved'), 2)) if (pc_act > 0
      and pc_inst > 0) else 0)
  - tx_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='property_tax')
  - dep_tax: >-
      CFIELD('setaside', 'annual_property_tax', hecm_loan_id=HID, status='depleted') or 0
  - tax_reserve: tx_adv if tx_adv > 0 else (dep_tax if dep_tax > 0 else 0)
  - hz_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='hazard_insurance')
  - fl_adv: >-
      XSUM('propcharge', 'propcharge_transactions', 'amount', within_months=12, date_field='effective_date', event_type='propcharge_advance',
      charge_type='flood_insurance')
  - dep_ins: >-
      (CFIELD('setaside', 'annual_hazard_premium', hecm_loan_id=HID, status='depleted') or 0) + (CFIELD('setaside',
      'annual_flood_premium', hecm_loan_id=HID, status='depleted') or 0)
  - insurance_reserve: hz_adv + fl_adv if hz_adv + fl_adv > 0 else (dep_ins if dep_ins > 0 else 0)
  - q_pw: >-
      SUM('hecm_requests', 'requested_amount', request_type='loc_draw', request_status='submitted', request_channel='servicing_portal')
      + SUM('hecm_requests', 'requested_amount', request_type='loc_draw', request_status='submitted', request_channel='signed_written')
  - q_ph: >-
      SUM('hecm_requests', 'requested_amount', request_type='loc_draw', request_status='submitted', request_channel='phone')
  - queued_earmark: >-
      q_pw + q_ph if q_pw > 0 else (MN(q_ph, P('phone_draw_max_amount')) if q_ph > 0 else 0)
  - res_status: CFIELD('residency', 'status', hecm_loan_id=HID) or 'none'
  - res_fee: CPARAM('residency', 'occupancy_inspection_fee', hecm_loan_id=HID) or 0
  - insp_fees: >-
      SUM('hecm_transactions', 'amount', within_months=12, date_field='effective_date', event_type='hecm_advance_posting',
      advance_type='occupancy_inspection_fee')
  - insp_reserve: >-
      2 * res_fee if ((res_status == 'overdue' or res_status == 'absence_monitoring') and res_fee > 0) else (insp_fees
      if (res_status == 'current' and insp_fees > 0) else 0)
  - result: >-
      RND(MX(0, drawable - arrangement_reserve - tax_reserve - insurance_reserve - queued_earmark - insp_reserve),
      2)
  compute_basis:
    line: >-
      On or after the first anniversary of the loan closing the drawable figure is the loan's available_line.
    before_anniv: >-
      The first anniversary is the same day number in the month first_year_period_months calendar months after the
      closing date, falling back to the last day of that month when that day does not exist; for a draw request
      sized at the draw ceiling, and only for such a request, the first anniversary is reached once first_year_period_months
      whole calendar months have passed since the closing date, a whole month being complete on the later month's
      day with the closing date's day number, or on the first day of the following month when that month has no
      such day number.
    fy_draws: >-
      During the first-year period the closing disbursement amount plus hecm_msr_first_year_draws plus the requested
      draw may not exceed the loan's initial_disbursement_limit; for a draw request sized at the draw ceiling, and
      only for such a request, that limit is applied through the draw ceiling's own first-year room, the initial_disbursement_limit
      less the closing_disbursement_amount less the draw ceiling's first-year draws, which count every advance posting
      of type loc_draw on the loan at its amount less every return entry crediting a draw back to the line.
    room: >-
      During the first-year period the closing disbursement amount plus hecm_msr_first_year_draws plus the requested
      draw may not exceed the loan's initial_disbursement_limit; for a draw request sized at the draw ceiling, and
      only for such a request, that limit is applied through the draw ceiling's own first-year room, the initial_disbursement_limit
      less the closing_disbursement_amount less the draw ceiling's first-year draws, which count every advance posting
      of type loc_draw on the loan at its amount less every return entry crediting a draw back to the line.
    drawable: >-
      Before the first anniversary the drawable figure is the lesser of the available_line and the draw ceiling's
      own first-year room.
    pc_lump: >-
      Added to the amounts kept for the draw ceiling: Cedarline keeps in the line what the loan's open property
      charge repayment record still needs, a loan holding at most one open record: when that record's status is
      notice_period, pending_signature or defaulted with an arrearage_balance above 0.00, the arrangement reserve
      is its whole arrearage_balance; when its status is active with an arrearage_balance above 0.00 and a monthly_installment
      above 0.00, the arrangement reserve is installment_months_reserved monthly installments, rounded half up to
      the cent, or the arrearage_balance when smaller; otherwise the arrangement reserve is 0.00.
    pc_act: >-
      Added to the amounts kept for the draw ceiling: Cedarline keeps in the line what the loan's open property
      charge repayment record still needs, a loan holding at most one open record: when that record's status is
      notice_period, pending_signature or defaulted with an arrearage_balance above 0.00, the arrangement reserve
      is its whole arrearage_balance; when its status is active with an arrearage_balance above 0.00 and a monthly_installment
      above 0.00, the arrangement reserve is installment_months_reserved monthly installments, rounded half up to
      the cent, or the arrearage_balance when smaller; otherwise the arrangement reserve is 0.00.
    pc_inst: >-
      Added to the amounts kept for the draw ceiling: Cedarline keeps in the line what the loan's open property
      charge repayment record still needs, a loan holding at most one open record: when that record's status is
      notice_period, pending_signature or defaulted with an arrearage_balance above 0.00, the arrangement reserve
      is its whole arrearage_balance; when its status is active with an arrearage_balance above 0.00 and a monthly_installment
      above 0.00, the arrangement reserve is installment_months_reserved monthly installments, rounded half up to
      the cent, or the arrearage_balance when smaller; otherwise the arrangement reserve is 0.00.
    arrangement_reserve: >-
      Added to the amounts kept for the draw ceiling: Cedarline keeps in the line what the loan's open property
      charge repayment record still needs, a loan holding at most one open record: when that record's status is
      notice_period, pending_signature or defaulted with an arrearage_balance above 0.00, the arrangement reserve
      is its whole arrearage_balance; when its status is active with an arrearage_balance above 0.00 and a monthly_installment
      above 0.00, the arrangement reserve is installment_months_reserved monthly installments, rounded half up to
      the cent, or the arrearage_balance when smaller; otherwise the arrangement reserve is 0.00.
    tx_adv: >-
      Added to the amounts kept for the draw ceiling: Cedarline keeps in the line for the draw ceiling the next
      property tax bill it last had to advance: when Cedarline advanced property tax on the loan on a payment date
      after the same day of the month twelve calendar months before the handling date, the tax renewal reserve is
      the total of the property tax advanced in that window; when no property tax was advanced in that window but
      a set-aside on the loan is depleted with an annual_property_tax above 0.00, the tax renewal reserve is that
      annual_property_tax; otherwise the tax renewal reserve is 0.00.
    dep_tax: >-
