events:
- type: maturity_case_opened
  target: maturity_cases
  mutation: create
  meaning: A maturity case is opened on the loan when the servicer learns of a documented maturity event.
  grain: One row per maturity case.
  fields:
    maturity_case_id: Case id.
    customer_id: Borrower of record.
    hecm_loan_id: HECM loan, if any.
    jumbo_loan_id: Summit loan, if any.
    loan_program: hecm or summit.
    variant_name: Maturity event type.
    status: Always opened.
    event_date: Date of the maturity event.
    opened_date: Date the servicer learned of it.
    successor_intent: not_applicable at opening.
    resolution_type: not_applicable at opening.
  triggers: []
- type: maturity_case_reclassified
  target: maturity_cases
  mutation: update
  meaning: A higher-precedence maturity event on a loan with an open case takes over the case's event type and event
    date.
  grain: One row per reclassification.
  fields:
    variant_name: New maturity event type.
    event_date: Date of the new event.
  triggers: []
- type: maturity_hud_action
  target: maturity_case_events
  meaning: 'A HUD step on the case is recorded: notification, approval request, approval, or an extension request
    or decision.'
  grain: One row per HUD step per extension number.
  distinguish_by:
  - hud_action
  - extension_number
  fields:
    effective_date: Date of the step.
    hud_action: Which step.
    extension_number: Extension concerned, or 0.
    maturity_request_id: Extension request concerned, if any.
  triggers: []
- type: maturity_approval_requested
  target: maturity_cases
  mutation:
    transition:
      from: opened
      to: awaiting_hud_approval
  meaning: HUD approval to call the loan due is requested.
  grain: One row per transition.
  fields:
    status: Set to awaiting_hud_approval.
    hud_request_date: Request date.
  triggers: []
- type: maturity_called_due
  target: maturity_cases
  mutation:
    transition:
    - from: opened
      to: due_and_payable
    - from: awaiting_hud_approval
      to: due_and_payable
    - from: deferred
      to: due_and_payable
  meaning: The loan is called due and the response and resolution deadlines are set.
  grain: One row per transition.
  fields:
    status: Set to due_and_payable.
    due_and_payable_date: Call-due date.
    response_deadline: Last day to declare intent.
    resolution_deadline: Last day to resolve.
    successor_intent: Remains not_applicable until declared.
    loan_program: Loan program (unchanged).
  triggers:
  - event: hecm:hecm_due_and_payable
    when:
      loan_program: hecm
    map:
      due_and_payable_date: due_and_payable_date
  - event: jumbo:jumbo_due_and_payable
    when:
      loan_program: summit
    map:
      due_and_payable_date: due_and_payable_date
- type: maturity_deferred
  target: maturity_cases
  mutation:
    transition:
      from: opened
      to: deferred
  meaning: An eligible non-borrowing spouse's deferral period begins instead of a call due.
  grain: One row per transition.
  fields:
    status: Set to deferred.
    loan_program: Loan program (unchanged).
  triggers:
  - event: hecm:hecm_deferral_started
    when:
      loan_program: hecm
    map: {}
- type: maturity_notice_sent
  target: maturity_case_events
  meaning: A case notice is sent to a borrower, successor or estate.
  grain: One row per notice type per recipient per date.
  distinguish_by:
  - notice_type
  - recipient_customer_id
  - effective_date
  fields:
    effective_date: Mailing date.
    notice_type: Which notice.
    recipient_customer_id: Addressee.
  triggers: []
- type: maturity_appraisal_recorded
  target: maturity_cases
  mutation: update
  meaning: An as-is appraisal ordered for the case is recorded.
  grain: One row per appraisal.
  fields:
    appraised_value: As-is appraised value.
    appraisal_date: Appraisal effective date.
  triggers: []
- type: maturity_intent_recorded
  target: maturity_cases
  mutation: update
  meaning: The borrower's or confirmed successor's declared resolution intent, or the lapse of the response window,
    is recorded.
  grain: One row per recorded intent.
  fields:
    successor_customer_id: Who declared it.
    successor_intent: Declared intent or no_response.
  triggers: []
- type: maturity_extension_granted
  target: maturity_case_events
  meaning: A HUD-approved extension of the resolution deadline is granted.
  grain: One row per extension.
  distinguish_by:
  - extension_number
  fields:
    effective_date: Grant date.
    extension_number: 1 or 2.
    extended_deadline: New resolution deadline.
    maturity_request_id: The extension request.
  triggers:
  - event: maturity:maturity_extension_started
    when:
      extension_number: 1
    map:
      resolution_deadline: extended_deadline
  - event: maturity:maturity_deadline_extended
    when:
      extension_number: 2
    map:
      resolution_deadline: extended_deadline
- type: maturity_extension_started
  target: maturity_cases
  mutation:
    transition:
      from: due_and_payable
      to: extension_period
  meaning: The first extension moves the case into its extension period.
  grain: One row per transition.
  fields:
    status: Set to extension_period.
    resolution_deadline: Extended deadline.
  triggers: []
- type: maturity_deadline_extended
  target: maturity_cases
  mutation: update
  meaning: A further extension moves the resolution deadline.
  grain: One row per further extension.
  fields:
    resolution_deadline: Extended deadline.
  triggers: []
- type: maturity_foreclosure_referred
  target: maturity_cases
  mutation:
    transition:
    - from: due_and_payable
      to: foreclosure_referred
    - from: extension_period
      to: foreclosure_referred
  meaning: The unresolved case is referred to foreclosure counsel.
  grain: One row per transition.
  fields:
    status: Set to foreclosure_referred.
    referral_date: Referral date.
  triggers: []
- type: maturity_cured
  target: maturity_cases
  mutation:
    transition:
    - from: opened
      to: cured
    - from: awaiting_hud_approval
      to: cured
    - from: due_and_payable
      to: cured
  meaning: A curable maturity condition is cured and the case ends without repayment.
  grain: One row per transition.
  fields:
    status: Set to cured.
    closed_date: Cure date.
    resolution_type: cured.
    loan_program: Loan program (unchanged).
    due_and_payable_date: Call-due date if the loan had been called due (unchanged).
  triggers:
  - event: hecm:hecm_reinstated
    when:
      loan_program: hecm
      due_and_payable_date:
        not: ''
    map: {}
- type: maturity_resolved
  target: maturity_cases
  mutation:
    transition:
    - from: due_and_payable
      to: resolved
    - from: extension_period
      to: resolved
    - from: foreclosure_referred
      to: resolved
    - from: deferred
      to: resolved
  meaning: The case ends because the loan was satisfied or the foreclosure sale completed.
  grain: One row per transition.
  fields:
    status: Set to resolved.
    closed_date: Resolution date.
    resolution_type: How it ended.
  triggers: []
measures:
- id: maturity_msr_extensions_granted
  window: Life of the case up to and including the handling date.
  measure: Count of maturity_extension_granted rows of the case.
policies:
- id: maturity_agg_multi_holding
  subject:
  - maturity_case_opened
  - maturity_case_reclassified
  rule: 'A loan has at most one open maturity case, and because a borrower holds only one reverse mortgage the borrower
    of record has at most one open case. A case is opened only when the borrower of record has no other case whose
    status is opened, awaiting_hud_approval, deferred, due_and_payable, extension_period or foreclosure_referred.
    When another documented maturity event occurs on a loan whose case is open, no second case is opened: if the
    new event ranks higher in supersede_priority than the case''s current event type, the case is reclassified to
    the new event type and event_date while keeping its status and deadlines, and from then on the new type''s parameters
    govern (a death or sale removes any cure option); if it ranks lower, it is only noted on the case. A case counts
    as open while its status is one of open_case_statuses.'
  eligibility:
  - id: one_open_case
    applies_to:
    - maturity_case_opened
    kind: dedup
    condition: A case is opened only when the borrower of record has no other case whose status is opened, awaiting_hud_approval,
      deferred, due_and_payable, extension_period or foreclosure_referred.
    evidence_fields:
    - maturity_cases.customer_id
    - maturity_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.customer_id
      action_bindings:
        maturity_cases.customer_id: customer_id
    dedup_contract:
      table: maturity_cases
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - opened
        - awaiting_hud_approval
        - deferred
        - due_and_payable
        - extension_period
        - foreclosure_referred
      distinct_fields: []
  params:
    max_per_customer: 1
- id: maturity_case_opening
  subject:
  - maturity_case_opened
  rule: 'A case is opened only on the record named in the plan''s opening_evidence: an accepted death notice with
    a death certificate for a death, a recorded deed to someone other than a borrower for a sale or transfer, a
    residency profile whose non-occupancy was confirmed for the two occupancy plans, a property charge arrearage
    referred for non-payment for a property charge default, and a failed condition inspection report for a property
    condition default; a caller''s statement alone never opens a case. A transfer into a revocable living trust
    in which a borrower keeps occupancy and a life interest, and a transfer between borrowers on the note, are not
    a sale or transfer, per sale_into_revocable_trust_is_transfer and sale_to_co_borrower_is_transfer. The opened_date
    is the date the servicer received the documentation, per learned_date_basis, and the event_date follows the
    plan''s event_date_basis. A vacant-property inspection is ordered within property_preservation_inspection_days
    calendar days of opening where that is not 0, and from the opening date every loan disbursement is suspended,
    per draws_suspended_while_open. Case plans apply to every loan program in loan_programs_covered; a property
    condition case additionally needs the inspection report on file, per condition_inspection_required. Interest,
    MIP and servicing fees keep accruing on the loan throughout the case, per interest_and_mip_continue; an open
    case is reviewed every case_review_cycle_days calendar days, and where vacant_property_securing is true a vacant
    property may be secured against damage.'
  eligibility:
  - id: opening_record_on_file
    applies_to:
    - maturity_case_opened
    kind: authorization
    condition: 'A case is opened only on the record named in the plan''s opening_evidence: an accepted death notice
      with a death certificate for a death, a recorded deed to someone other than a borrower for a sale or transfer,
      a residency profile whose non-occupancy was confirmed for the two occupancy plans, a property charge arrearage
      referred for non-payment for a property charge default, and a failed condition inspection report for a property
      condition default; a caller''s statement alone never opens a case.'
    evidence_fields:
    - residency_submissions.residency_submission_id
    - residency_profiles.status
    - maturity_requests.maturity_request_id
    - maturity_requests.evidence_type
    - propcharge_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - residency_submissions.residency_submission_id
      - - maturity_requests.maturity_request_id
      action_bindings:
        residency_submissions.residency_submission_id: residency_submission_id
        maturity_requests.maturity_request_id: maturity_request_id
- id: maturity_call_due
  subject:
  - maturity_hud_action
  - maturity_approval_requested
  - maturity_called_due
  rule: HUD is notified of a death or sale, or asked to approve calling the loan due for any other event, within
    hud_notice_days calendar days of the opened_date; on a Summit loan no HUD step applies, per summit_hud_steps_apply,
    and the loan is called due on the opened_date. A loan whose plan has hud_approval_required true is called due
    only after a HUD approval_received step is recorded on the case. A death or sale case is called due on the day
    the due_and_payable_notification to HUD is recorded; a case awaiting approval is called due on the day approval
    is recorded; a deferred case is called due on the day its deferral ends. For a property charge default, approval
    is requested only when the unrepaid property-charge advances on the loan exceed property_charge_default_threshold
    and the borrower has not cured within default_notice_cure_days calendar days of the default notice; at or below
    the threshold the case stays opened under monitoring. When the loan is called due, due_and_payable_date is that
    day, response_deadline is successor_response_days calendar days after that day, because the due-and-payable
    notice is sent the same day, and resolution_deadline is the same day number resolution_period_months calendar
    months after the due_and_payable_date, falling back to the last day of that month when that day does not exist.
    Each HUD step is recorded once per extension number.
  eligibility:
  - id: hud_approval_on_file
    applies_to:
    - maturity_called_due
    kind: authorization
    condition: A loan whose plan has hud_approval_required true is called due only after a HUD approval_received
      step is recorded on the case.
    evidence_fields:
    - maturity_case_events.maturity_case_id
    - maturity_case_events.hud_action
    - maturity_cases.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_case_events.maturity_case_id
      action_bindings:
        maturity_case_events.maturity_case_id: maturity_case_id
  - id: hud_step_once
    applies_to:
    - maturity_hud_action
    kind: dedup
    condition: Each HUD step is recorded once per extension number.
    evidence_fields:
    - maturity_case_events.maturity_case_id
    - maturity_case_events.hud_action
    - maturity_case_events.extension_number
    - maturity_case_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_case_events.maturity_case_id
        - maturity_case_events.hud_action
        - maturity_case_events.extension_number
      action_bindings:
        maturity_case_events.maturity_case_id: maturity_case_id
        maturity_case_events.hud_action: hud_action
        maturity_case_events.extension_number: extension_number
    dedup_contract:
      table: maturity_case_events
      mode: separate_record
      object_bindings:
        maturity_case_id: maturity_case_id
        hud_action: hud_action
        extension_number: extension_number
      duplicate_filters:
        event_type:
        - maturity_hud_action
      distinct_fields: []
  params:
    per_tier:
      Death of Last Surviving Borrower:
        hud_approval_required: =hud_approval_required
        property_charge_default_threshold: =property_charge_default_threshold
        default_notice_cure_days: =default_notice_cure_days
      Sale or Title Transfer:
        hud_approval_required: =hud_approval_required
        property_charge_default_threshold: =property_charge_default_threshold
        default_notice_cure_days: =default_notice_cure_days
      Extended Health-Care Absence:
        hud_approval_required: =hud_approval_required
        property_charge_default_threshold: =property_charge_default_threshold
        default_notice_cure_days: =default_notice_cure_days
      Principal Residence Change:
        hud_approval_required: =hud_approval_required
        property_charge_default_threshold: =property_charge_default_threshold
        default_notice_cure_days: =default_notice_cure_days
      Property Charge Default:
        hud_approval_required: =hud_approval_required
        property_charge_default_threshold: =property_charge_default_threshold
        default_notice_cure_days: =default_notice_cure_days
      Property Condition Default:
        hud_approval_required: =hud_approval_required
        property_charge_default_threshold: =property_charge_default_threshold
        default_notice_cure_days: =default_notice_cure_days
- id: maturity_notices
  subject:
  - maturity_notice_sent
  rule: On the day the loan is called due, and in no case later than due_and_payable_notice_days calendar days after
    it, a due_and_payable_notice and a successor_options_letter go to each recipient named by the plan's notice_recipients,
    by notice_delivery_method; the options letter lists the plan's intent_options and the response window. A default_notice
    goes to the borrower when a property charge or property condition case opens, starting its default_notice_cure_days.
    A foreclosure_referral_notice goes to the recipients at least foreclosure_referral_notice_days calendar days
    before any referral, an extension_letter on each granted extension, and a cure_confirmation when a case is cured.
    For a deceased borrower's loan, a caller who is not yet a confirmed successor in interest receives only the
    list of documents in successor_documents, per heir_communication_before_confirmation. Each notice type goes
    to each recipient once per date.
  eligibility:
  - id: notice_once_per_date
    applies_to:
    - maturity_notice_sent
    kind: dedup
    condition: Each notice type goes to each recipient once per date.
    evidence_fields:
    - maturity_case_events.maturity_case_id
    - maturity_case_events.notice_type
    - maturity_case_events.recipient_customer_id
    - maturity_case_events.effective_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_case_events.maturity_case_id
        - maturity_case_events.notice_type
        - maturity_case_events.recipient_customer_id
      action_bindings:
        maturity_case_events.maturity_case_id: maturity_case_id
        maturity_case_events.notice_type: notice_type
        maturity_case_events.recipient_customer_id: recipient_customer_id
    dedup_contract:
      table: maturity_case_events
      mode: separate_record
      object_bindings:
        maturity_case_id: maturity_case_id
        notice_type: notice_type
        recipient_customer_id: recipient_customer_id
      duplicate_filters:
        event_type:
        - maturity_notice_sent
      distinct_fields:
      - effective_date
- id: maturity_intent_appraisal
  subject:
  - maturity_intent_recorded
  - maturity_appraisal_recorded
  rule: After the loan is called due, an as-is appraisal is ordered within appraisal_order_days calendar days and
    recorded on the case; an appraisal older than appraisal_valid_months months at the time a payoff or sale is
    evaluated is replaced by a new one. An intent is recorded only from an intent declaration on file for the case
    whose request status is received and which was made by the living borrower or, for a deceased borrower's loan,
    by a customer whose profile_type is successor_in_interest linked to that borrower, per successor_confirmation_required;
    a declaration by anyone else is declined with reason not_confirmed_successor. An intent is recorded only when
    the declaration is received no later than the case's response_deadline. The deadline day itself still counts,
    and a declaration received on any later day is declined with reason outside_response_window. The declared intent
    must be one of intent_options; when the response window passes with no valid declaration, successor_intent is
    recorded as no_response on the following day and the case proceeds toward its resolution deadline, per no_response_handling.
    A later valid declaration within the window replaces an earlier one.
  eligibility:
  - id: declaration_on_file
    applies_to:
    - maturity_intent_recorded
    kind: authorization
    condition: An intent is recorded only from an intent declaration on file for the case whose request status is
      received and which was made by the living borrower or, for a deceased borrower's loan, by a customer whose
      profile_type is successor_in_interest linked to that borrower, per successor_confirmation_required; a declaration
      by anyone else is declined with reason not_confirmed_successor.
    evidence_fields:
    - maturity_requests.maturity_request_id
    - maturity_requests.request_type
    - maturity_requests.request_status
    - maturity_requests.customer_id
    - customers.profile_type
    - customers.linked_customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_requests.maturity_request_id
      action_bindings:
        maturity_requests.maturity_request_id: maturity_request_id
  - id: within_response_window
    applies_to:
    - maturity_intent_recorded
    kind: time
    condition: An intent is recorded only when the declaration is received no later than the case's response_deadline.
    evidence_fields:
    - maturity_cases.response_deadline
    - maturity_cases.maturity_case_id
    - maturity_requests.request_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the case's response_deadline
      anchor_source: maturity_cases.response_deadline
      relation: not_after
      duration_source: params.post_deadline_grace_days
      unit: calendar_days
      counting_rule: The deadline day itself still counts, and a declaration received on any later day is declined
        with reason outside_response_window.
      boundary: inclusive
  params:
    post_deadline_grace_days: 0
- id: maturity_extensions
  subject:
  - maturity_extension_granted
  - maturity_extension_started
  - maturity_deadline_extended
  rule: An extension adds extension_days calendar days to the current resolution_deadline and is granted only to
    a borrower or confirmed successor whose declared intent is sell_property or retain_property and who is actively
    marketing the property or obtaining financing. An extension is granted only against an extension request on
    file for the case whose request status is received and whose evidence_type is one of the plan's extension_evidence.
    An extension is granted only when the extension request is received no later than the current resolution deadline.
    The deadline day itself still counts; Cedarline asks requesters to submit at least hud_extension_lead_days calendar
    days ahead, but a request received on the deadline is still processed, and one received later is declined with
    reason request_after_deadline. An extension is granted only after HUD's extension_approved step for that extension
    number is recorded on the case, per extension_hud_approval_required; on a Summit loan Cedarline approves it
    directly. No case receives more than max_extensions extensions, counted by maturity_msr_extensions_granted;
    a request beyond the limit is declined with reason extension_limit_reached, and a request whose evidence is
    missing or of another type is declined with reason evidence_insufficient. The first extension moves the case
    to extension_period and every extension sets resolution_deadline to the extended_deadline; when the appraisal
    is older than appraisal_valid_months, a new appraisal is ordered, per reappraisal_for_extension.
  eligibility:
  - id: extension_request_on_file
    applies_to:
    - maturity_extension_granted
    kind: authorization
    condition: An extension is granted only against an extension request on file for the case whose request status
      is received and whose evidence_type is one of the plan's extension_evidence.
    evidence_fields:
    - maturity_requests.maturity_request_id
    - maturity_requests.request_type
    - maturity_requests.request_status
    - maturity_requests.evidence_type
    - maturity_requests.evidence_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_requests.maturity_request_id
      action_bindings:
        maturity_requests.maturity_request_id: maturity_request_id
  - id: extension_before_deadline
    applies_to:
    - maturity_extension_granted
    kind: time
    condition: An extension is granted only when the extension request is received no later than the current resolution
      deadline.
    evidence_fields:
    - maturity_cases.resolution_deadline
    - maturity_cases.maturity_case_id
    - maturity_requests.request_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the current resolution deadline
      anchor_source: maturity_cases.resolution_deadline
      relation: not_after
      duration_source: params.post_deadline_grace_days
      unit: calendar_days
      counting_rule: The deadline day itself still counts; Cedarline asks requesters to submit at least hud_extension_lead_days
        calendar days ahead, but a request received on the deadline is still processed, and one received later is
        declined with reason request_after_deadline.
      boundary: inclusive
  - id: hud_extension_approved
    applies_to:
    - maturity_extension_granted
    kind: authorization
    condition: An extension is granted only after HUD's extension_approved step for that extension number is recorded
      on the case, per extension_hud_approval_required; on a Summit loan Cedarline approves it directly.
    evidence_fields:
    - maturity_case_events.maturity_case_id
    - maturity_case_events.hud_action
    - maturity_case_events.extension_number
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_case_events.maturity_case_id
        - maturity_case_events.extension_number
      action_bindings:
        maturity_case_events.maturity_case_id: maturity_case_id
        maturity_case_events.extension_number: extension_number
  - id: extension_number_once
    applies_to:
    - maturity_extension_granted
    kind: dedup
    condition: No case receives more than max_extensions extensions, counted by maturity_msr_extensions_granted;
      a request beyond the limit is declined with reason extension_limit_reached, and a request whose evidence is
      missing or of another type is declined with reason evidence_insufficient.
    evidence_fields:
    - maturity_case_events.maturity_case_id
    - maturity_case_events.extension_number
    - maturity_case_events.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_case_events.maturity_case_id
        - maturity_case_events.extension_number
      action_bindings:
        maturity_case_events.maturity_case_id: maturity_case_id
        maturity_case_events.extension_number: extension_number
    dedup_contract:
      table: maturity_case_events
      mode: separate_record
      object_bindings:
        maturity_case_id: maturity_case_id
        extension_number: extension_number
      duplicate_filters:
        event_type:
        - maturity_extension_granted
      distinct_fields: []
  params:
    post_deadline_grace_days: 0
    per_tier:
      Death of Last Surviving Borrower:
        max_extensions: =max_extensions
      Sale or Title Transfer:
        max_extensions: =max_extensions
      Extended Health-Care Absence:
        max_extensions: =max_extensions
      Principal Residence Change:
        max_extensions: =max_extensions
      Property Charge Default:
        max_extensions: =max_extensions
      Property Condition Default:
        max_extensions: =max_extensions
  measures:
  - maturity_msr_extensions_granted
- id: maturity_foreclosure_referral
  subject:
  - maturity_foreclosure_referred
  rule: A case is referred to foreclosure counsel only when the loan has not been satisfied, no cure has been accepted
    and no extension is pending HUD decision. A case is referred only on or after the day after the current resolution
    deadline. That day is resolution_deadline plus referral_days_after_deadline calendar days, and the referral
    is allowed on that day itself. A referral also needs a foreclosure_referral_notice sent at least foreclosure_referral_notice_days
    calendar days earlier; when the notice was sent later than that, the referral waits until the notice period
    has run. A referral never stops a payoff, sale or deed in lieu that completes before the foreclosure sale, which
    resolves the case instead.
  eligibility:
  - id: after_resolution_deadline
    applies_to:
    - maturity_foreclosure_referred
    kind: time
    condition: A case is referred only on or after the day after the current resolution deadline.
    evidence_fields:
    - maturity_cases.resolution_deadline
    - maturity_cases.maturity_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the current resolution deadline
      anchor_source: maturity_cases.resolution_deadline
      relation: not_before
      duration_source: variants.referral_days_after_deadline
      unit: calendar_days
      counting_rule: That day is resolution_deadline plus referral_days_after_deadline calendar days, and the referral
        is allowed on that day itself.
      boundary: inclusive
- id: maturity_cure
  subject:
  - maturity_cured
  rule: 'Only plans whose cure_permitted is true can be cured; a death or sale case is never cured and ends only
    by resolution. A case is cured only on a cure_evidence request on file for the case whose request status is
    received and whose evidence_type matches the plan''s cure_evidence: a reoccupancy certification recorded on
    the residency profile for the occupancy plans, a repayment receipt showing every unrepaid property-charge advance
    repaid or a signed repayment plan for a property charge default, and a passing repair inspection for a property
    condition default; the borrower''s oral statement is never enough, per borrower_statement_sufficient_for_cure.
    The cure must arrive by the plan''s cure_deadline_basis: the occupancy plans only before the loan is called
    due, the default plans only before the case is referred to foreclosure; a later request is declined with reason
    cure_not_permitted. A cured case closes with resolution_type cured on the cure date, a cure_confirmation notice
    is sent, and a loan that had been called due is reinstated. When a borrower reports property condition repairs
    complete, a reinspection is ordered within condition_repair_inspection_days calendar days and its passing report
    is the cure evidence.'
  eligibility:
  - id: cure_evidence_on_file
    applies_to:
    - maturity_cured
    kind: authorization
    condition: 'A case is cured only on a cure_evidence request on file for the case whose request status is received
      and whose evidence_type matches the plan''s cure_evidence: a reoccupancy certification recorded on the residency
      profile for the occupancy plans, a repayment receipt showing every unrepaid property-charge advance repaid
      or a signed repayment plan for a property charge default, and a passing repair inspection for a property condition
      default; the borrower''s oral statement is never enough, per borrower_statement_sufficient_for_cure.'
    evidence_fields:
    - maturity_requests.maturity_request_id
    - maturity_requests.request_type
    - maturity_requests.request_status
    - maturity_requests.evidence_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_requests.maturity_request_id
      action_bindings:
        maturity_requests.maturity_request_id: maturity_request_id
  params:
    per_tier:
      Death of Last Surviving Borrower:
        cure_permitted: =cure_permitted
        cure_deadline_basis: =cure_deadline_basis
        cure_evidence: =cure_evidence
      Sale or Title Transfer:
        cure_permitted: =cure_permitted
