- id: maturity_ext_successor_evidence_window
  base_policy_refs:
  - maturity_intent_appraisal
  overwrite:
  - base_policy: maturity_intent_appraisal
    superseded_clause: An intent is recorded only from an intent declaration on file for the case whose request status is received and which was made by the living borrower or, for a deceased borrower's loan, by a customer whose profile_type is successor_in_interest linked to that borrower, per successor_confirmation_required; a declaration by anyone else is declined with reason not_confirmed_successor.
    replaced_by: An intent is recorded only from an intent declaration already on file for the case whose request status is received, made by the living borrower or, for a deceased borrower's loan, by a customer whose profile type is successor in interest linked to that borrower, as the plan's successor confirmation requirement provides, and received no later than the response deadline, a declaration by anyone else being declined as not a confirmed successor and one received later as outside the response window; for a successor in interest who declares in person on a Summit loan's death case, and only for such a declaration, the intent is recorded from the declaration the successor files in that same act, which is accepted only from such a successor and only when the day it is filed is no later than the case's response deadline, the deadline day itself still counting.
  - base_policy: maturity_intent_appraisal
    superseded_clause: An intent is recorded only when the declaration is received no later than the case's response_deadline.
    replaced_by: An intent is recorded only from an intent declaration already on file for the case whose request status is received, made by the living borrower or, for a deceased borrower's loan, by a customer whose profile type is successor in interest linked to that borrower, as the plan's successor confirmation requirement provides, and received no later than the response deadline, a declaration by anyone else being declined as not a confirmed successor and one received later as outside the response window; for a successor in interest who declares in person on a Summit loan's death case, and only for such a declaration, the intent is recorded from the declaration the successor files in that same act, which is accepted only from such a successor and only when the day it is filed is no later than the case's response deadline, the deadline day itself still counting.
  trigger: on_request
  subject:
