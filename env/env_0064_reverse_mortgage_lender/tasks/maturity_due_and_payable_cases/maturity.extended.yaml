    condition: The case's response_deadline falls on or after the day the successor declares, having been reset from the mailing of the successor's due-and-payable notice and options letter.
    resolved_by: mail_successor_due_notices_bb6e23d7
    effect: With the successor response deadline written by the successor's notices on the case, the evidence clock start is decided by the case's extension status and by the gap between that response deadline and the resolution deadline, instead of resting on the borrower's lapsed response deadline; the clock start offset, and with it the evidence due days, change.
