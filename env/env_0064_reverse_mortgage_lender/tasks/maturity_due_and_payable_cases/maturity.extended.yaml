    charge_days: Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan's Summit Tax and Insurance Reserve is not active, 5 days are taken off the window count; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 2 days are taken off; where there are none, or that reserve is active, nothing is taken off.
    window_count: The window count is the base count with every addition made and every deduction taken, all of them made before the count is turned into calendar days
    inspection_day: Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding.
