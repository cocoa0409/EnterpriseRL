- id: maturity_ext_further_extension_sizing
  base_policy_refs:
  - maturity_extensions
  - maturity_notices
  overwrite:
  - base_policy: maturity_extensions
    superseded_clause: An extension adds extension_days calendar days to the current resolution_deadline and is granted only to a borrower or confirmed successor whose declared intent is sell_property or retain_property and who is actively marketing the property or obtaining financing.
    replaced_by: An extension adds the plan's extension days to the current resolution deadline and is granted only to a borrower or confirmed successor whose declared intent is to sell or to retain the property and who is actively marketing the property or obtaining financing, apart from the first extension on a Summit loan's case whose borrower has died; for a further extension on a Summit loan's case, and only for such an extension, the extension adds the further extension days this policy computes to the current resolution deadline, on the same grant conditions.
  - base_policy: maturity_extensions
    superseded_clause: An extension is granted only after HUD's extension_approved step for that extension number is recorded on the case, per extension_hud_approval_required; on a Summit loan Cedarline approves it directly.
    replaced_by: An extension is granted only after HUD's extension approval for that extension number is recorded on the case, no case receives more than the plan's maximum number of extensions, a request beyond that limit is declined as extension limit reached, and a request whose evidence is missing or of another kind is declined as evidence insufficient; for an extension on a Summit loan's case, and only for such an extension, Cedarline approves the extension itself without any HUD step and the extension carries the number one higher than the extensions already granted on the case, under the same limit and decline reasons.
  - base_policy: maturity_extensions
    superseded_clause: No case receives more than max_extensions extensions, counted by maturity_msr_extensions_granted; a request beyond the limit is declined with reason extension_limit_reached, and a request whose evidence is missing or of another type is declined with reason evidence_insufficient.
    replaced_by: An extension is granted only after HUD's extension approval for that extension number is recorded on the case, no case receives more than the plan's maximum number of extensions, a request beyond that limit is declined as extension limit reached, and a request whose evidence is missing or of another kind is declined as evidence insufficient; for an extension on a Summit loan's case, and only for such an extension, Cedarline approves the extension itself without any HUD step and the extension carries the number one higher than the extensions already granted on the case, under the same limit and decline reasons.
  - base_policy: maturity_extensions
    superseded_clause: when the appraisal is older than appraisal_valid_months, a new appraisal is ordered, per reappraisal_for_extension
    replaced_by: Every extension sets the resolution deadline to the extended deadline and, when the appraisal is older than the plan's appraisal validity, orders a new appraisal at the grant wherever the plan's reappraisal-for-extension setting calls for one; for the first extension on a Summit loan's case whose borrower has died and for a further extension on a Summit loan's case, and only for such extensions, an appraisal older than the plan's appraisal validity is not reordered at the grant, and it is replaced by a new one when a payoff or sale is next evaluated.
  trigger: on_request
  subject:
  - maturity_extension_granted
  - maturity_deadline_extended
  computes: extension_days
  target_tool: grant_further_extension_50c8b1d2
  params:
    commitment_valid_days: 60
    equity_strong_pct: 50
    equity_moderate_pct: 80
    equity_days_strong: 14
    equity_days_moderate: 7
    listing_used_cut: 14
    occupant_days_household: 7
    occupant_days_vacant: 3
    aging_appraisal_months: 4
    reappraisal_missing_days: 30
    reappraisal_stale_days: 21
    reappraisal_aging_days: 7
    closing_funds_days: 10
    stale_marketing_days: 60
    minimum_extension_days: 30
    recent_listing_cut: 7
    reserve_short_days: 7
    reserve_depleted_days: 14
  rule: 'An extension adds the plan''s extension days to the current resolution deadline and is granted only to a borrower or confirmed successor whose declared intent is to sell or to retain the property and who is actively marketing the property or obtaining financing, apart from the first extension on a Summit loan''s case whose borrower has died; for a further extension on a Summit loan''s case, and only for such an extension, the extension adds the further extension days this policy computes to the current resolution deadline, on the same grant conditions. An extension is granted only after HUD''s extension approval for that extension number is recorded on the case, no case receives more than the plan''s maximum number of extensions, a request beyond that limit is declined as extension limit reached, and a request whose evidence is missing or of another kind is declined as evidence insufficient; for an extension on a Summit loan''s case, and only for such an extension, Cedarline approves the extension itself without any HUD step and the extension carries the number one higher than the extensions already granted on the case, under the same limit and decline reasons. A further extension is not granted until the case carries an extension request awaiting a decision whose supporting document is dated no more than 30 days before the day that request was received. Every extension sets the resolution deadline to the extended deadline and, when the appraisal is older than the plan''s appraisal validity, orders a new appraisal at the grant wherever the plan''s reappraisal-for-extension setting calls for one; for the first extension on a Summit loan''s case whose borrower has died and for a further extension on a Summit loan''s case, and only for such extensions, an appraisal older than the plan''s appraisal validity is not reordered at the grant, and it is replaced by a new one when a payoff or sale is next evaluated. The grant books the further extension under the next extension number, moves the case''s resolution deadline to the extended deadline while the case stays in its extension period, marks the extension request accepted, and sends the extension letter to the person acting on the case that day. The measured extension is the number of calendar days the request''s supporting document measures from the current resolution deadline, counted below zero when the end it measures to falls before the current resolution deadline, and the extension length is the measured extension with every addition made and every deduction taken; the further extension days are the extension length raised to 30 calendar days when it is fewer, so that no extension shorter than 30 days is granted, and then limited to the plan''s extension days when it is more, every addition and deduction being made before the extension length is raised or limited, as a whole number of calendar days. As standard, the measured extension is the plan''s extension days, and nothing is added to or taken off the extension length. The extension request the grant rests on is the most recently received extension request on the case that is still awaiting a decision. The measured extension is set by that request''s supporting document: where it is a financing commitment and the loan has a payoff case whose terms are issued with a statement good-through date, the measured extension runs from the current resolution deadline to 10 calendar days after that good-through date, the scheduled closing plus time for the payoff funds to post; where it is a financing commitment and no such statement is on the payoff file, the measured extension runs from the current resolution deadline to 60 calendar days after the commitment date; where it is a listing agreement, the measured extension is the plan''s extension days. Among extension requests received on the same day, the more recently received is the one recorded later by its recorded date and time, so that a request re-filed on the day of the request it replaces is the one a grant rests on. Where no extension request on the case is awaiting a decision, no extension is granted and the further extension days are zero. Where the supporting document of that request is neither a financing commitment nor a listing agreement, or carries no date, the request''s evidence is insufficient, no extension is granted and the further extension days are zero. The case''s as-is appraised value is the appraised value recorded on the case. The equity share is the Summit loan balance divided by the case''s as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file; where it is no more than 50, 14 calendar days are added to the extension length; where it is more than 50 and no more than 80, 7 calendar days are added to it; where it is more than 80, nothing is added. The extension already granted on the case is the most recently granted extension, and the request behind it is the accepted extension request received most recently, and among accepted requests received on the same day the one recorded later by its recorded date and time; where that request rested on a listing agreement and the extension was granted more than 60 calendar days before this grant, 14 calendar days are taken off the extension length, the property having been marketed that long without a sale; where that request rested on a listing agreement and the extension was granted no more than 60 calendar days before this grant, 7 calendar days are taken off it; where that request rested on a financing commitment or a document of another kind, or no granted extension is on record on the case, nothing is taken off. Where the loan''s Summit Tax and Insurance Reserve is active but holds less than one year''s property tax and hazard premium on file, 7 calendar days are added to the extension length for clearing the coming charges at closing; where that reserve is depleted, 14 calendar days are added to it; otherwise nothing is added. Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding. Where the most recent occupancy inspection finding on the borrower''s occupancy profile is that the home is occupied by someone other than a borrower, 7 calendar days are added to the extension length; where that finding is that the home is vacant, 3 calendar days are added to it; any other finding, or none, adds nothing. The age of the case''s as-is appraisal is the number of whole calendar months from the appraisal date to the grant date, an appraisal dated after the grant date counting as less than 4 months old; where the case has no appraisal recorded, 30 calendar days are added to the extension length for ordering one; where the appraisal is at least the plan''s appraisal validity in months old, 21 calendar days are added to it for the reappraisal; where it is at least 4 and less than the plan''s appraisal validity in months old, 7 calendar days are added to it; where it is less than 4 months old, nothing is added.'
  prerequisite:
  - problem: maturity_ext_further_extension_ask
    kind: value_input
    gate: measured_extension
    form: state
    policy_source: A further extension is not granted until the case carries an extension request awaiting a decision whose supporting document is dated no more than 30 days before the day that request was received.
    condition: The most recently received maturity_requests row of type extension_request with request_status received carries an evidence_date no more than 30 days before its request_date.
    resolved_by: supplement_extension_request_11bdc0c2
    effect: The re-filed request with a current financing commitment becomes the request awaiting a decision, so the measured extension is taken from the commitment, running to 10 days after the payoff statement's good-through date when the loan has issued payoff terms and otherwise to 60 days after the commitment date, instead of the plan's extension days a listing request gives.
  cross_category:
  - category: jumbo
    as: branch
    reads:
    - principal_balance
    note: The Summit loan balance sets the equity share that adds days.
  - category: payoff
    as: branch
    reads:
    - statement_good_through_date
    note: The payoff statement good-through date measures a commitment-backed further extension.
  - category: residency
    as: history
    reads:
    - residency_events.inspection_outcome
    note: The most recent inspection finding sets the occupant addition.
  - category: setaside
    as: branch
    reads:
    - status
    - setaside_balance
    - annual_property_tax
    - annual_hazard_premium
    note: The Summit Tax and Insurance Reserve's status and balance against a year's charges set the reserve addition.
  compute:
  - deadline_now: F('resolution_deadline')
  - pending_requests: COUNT('maturity_requests', request_type='extension_request', request_status='received')
  - pending_request_day: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='extension_request', request_status='received')
  - request_document: LATEST('maturity_requests', 'evidence_type', date_field='created_at', request_type='extension_request', request_status='received', request_date=pending_request_day)
  - request_document_date: LATEST('maturity_requests', 'evidence_date', date_field='created_at', request_type='extension_request', request_status='received', request_date=pending_request_day)
  - document_usable: (request_document == 'financing_commitment' or request_document == 'listing_agreement') and request_document_date != None and request_document_date != ''
  - statement_through: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='terms_issued')
  - measured_extension: ((DAYS(deadline_now, statement_through) + K('closing_funds_days')) if (request_document == 'financing_commitment' and statement_through != None and statement_through != '') else ((DAYS(deadline_now, request_document_date) + K('commitment_valid_days')) if request_document == 'financing_commitment' else P('extension_days'))) if document_usable else 0
  - case_appraised_value: float(F('appraised_value') or 0)
  - loan_balance: CFIELD('jumbo', 'principal_balance', jumbo_loan_id=F('jumbo_loan_id'))
  - equity_share: RND(float(loan_balance) / case_appraised_value * 100, 2) if (loan_balance != None and case_appraised_value > 0) else 100.0
  - equity_days: K('equity_days_strong') if equity_share <= K('equity_strong_pct') else (K('equity_days_moderate') if equity_share <= K('equity_moderate_pct') else 0)
  - accepted_request_day: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='extension_request', request_status='accepted')
  - granted_document: LATEST('maturity_requests', 'evidence_type', date_field='created_at', request_type='extension_request', request_status='accepted', request_date=accepted_request_day)
  - last_grant_date: LATEST('maturity_case_events', 'effective_date', date_field='effective_date', event_type='maturity_extension_granted')
  - days_since_grant: DAYS(last_grant_date, NOW) if last_grant_date != None else None
  - used_cut: 0 if days_since_grant == None else (K('listing_used_cut') if (granted_document == 'listing_agreement' and days_since_grant > K('stale_marketing_days')) else (K('recent_listing_cut') if (granted_document == 'listing_agreement' and days_since_grant <= K('stale_marketing_days')) else 0))
  - reserve_status: CFIELD('setaside', 'status', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id'))
  - reserve_balance: CFIELD('setaside', 'setaside_balance', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id'))
  - reserve_year_charges: RND(float(CFIELD('setaside', 'annual_property_tax', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id')) or 0) + float(CFIELD('setaside', 'annual_hazard_premium', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id')) or 0), 2)
  - reserve_days: K('reserve_short_days') if (reserve_status == 'active' and float(reserve_balance or 0) < reserve_year_charges) else (K('reserve_depleted_days') if reserve_status == 'depleted' else 0)
  - inspection_day: XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result')
  - last_inspection_finding: '''occupied_by_others'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''occupied_by_others'') > 0 else (''vacant'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''vacant'') > 0 else XLATEST(''residency'', ''residency_events'', ''inspection_outcome'', date_field=''effective_date'', event_type=''residency_inspection_result''))'
  - occupant_days: K('occupant_days_household') if last_inspection_finding == 'occupied_by_others' else (K('occupant_days_vacant') if last_inspection_finding == 'vacant' else 0)
  - appraisal_age_months: MONTHS(F('appraisal_date'), NOW) if (F('appraisal_date') != None and F('appraisal_date') != '') else None
  - reappraisal_days: K('reappraisal_missing_days') if appraisal_age_months == None else (K('reappraisal_stale_days') if appraisal_age_months >= P('appraisal_valid_months') else (K('reappraisal_aging_days') if appraisal_age_months >= K('aging_appraisal_months') else 0))
  - result: MN(P('extension_days'), MX(K('minimum_extension_days'), measured_extension + equity_days + reserve_days + occupant_days + reappraisal_days - used_cut)) if (pending_requests > 0 and document_usable) else 0
  compute_basis:
    deadline_now: the measured extension runs from the current resolution deadline to 60 calendar days after the commitment date
    pending_requests: Where no extension request on the case is awaiting a decision, no extension is granted and the further extension days are zero.
    pending_request_day: Among extension requests received on the same day, the more recently received is the one recorded later by its recorded date and time, so that a request re-filed on the day of the request it replaces is the one a grant rests on.
    request_document: The extension request the grant rests on is the most recently received extension request on the case that is still awaiting a decision.
    request_document_date: The extension request the grant rests on is the most recently received extension request on the case that is still awaiting a decision.
    document_usable: Where the supporting document of that request is neither a financing commitment nor a listing agreement, or carries no date, the request's evidence is insufficient, no extension is granted and the further extension days are zero.
    statement_through: where it is a financing commitment and the loan has a payoff case whose terms are issued with a statement good-through date
    measured_extension: 'The measured extension is set by that request''s supporting document: where it is a financing commitment and the loan has a payoff case whose terms are issued with a statement good-through date, the measured extension runs from the current resolution deadline to 10 calendar days after that good-through date, the scheduled closing plus time for the payoff funds to post; where it is a financing commitment and no such statement is on the payoff file, the measured extension runs from the current resolution deadline to 60 calendar days after the commitment date; where it is a listing agreement, the measured extension is the plan''s extension days.'
    case_appraised_value: The case's as-is appraised value is the appraised value recorded on the case.
    loan_balance: The equity share is the Summit loan balance divided by the case's as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file
    equity_share: The equity share is the Summit loan balance divided by the case's as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file
    equity_days: where it is no more than 50, 14 calendar days are added to the extension length; where it is more than 50 and no more than 80, 7 calendar days are added to it; where it is more than 80, nothing is added.
    accepted_request_day: and the request behind it is the accepted extension request received most recently, and among accepted requests received on the same day the one recorded later by its recorded date and time
    granted_document: The extension already granted on the case is the most recently granted extension, and the request behind it is the accepted extension request received most recently, and among accepted requests received on the same day the one recorded later by its recorded date and time
    last_grant_date: The extension already granted on the case is the most recently granted extension, and the request behind it is the accepted extension request received most recently, and among accepted requests received on the same day the one recorded later by its recorded date and time
    days_since_grant: where that request rested on a listing agreement and the extension was granted more than 60 calendar days before this grant
    used_cut: where that request rested on a listing agreement and the extension was granted more than 60 calendar days before this grant, 14 calendar days are taken off the extension length, the property having been marketed that long without a sale; where that request rested on a listing agreement and the extension was granted no more than 60 calendar days before this grant, 7 calendar days are taken off it; where that request rested on a financing commitment or a document of another kind, or no granted extension is on record on the case, nothing is taken off.
    reserve_status: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file
    reserve_balance: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file
    reserve_year_charges: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file
    reserve_days: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file, 7 calendar days are added to the extension length for clearing the coming charges at closing; where that reserve is depleted, 14 calendar days are added to it; otherwise nothing is added.
    inspection_day: Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding.
    last_inspection_finding: Where the most recent occupancy inspection finding on the borrower's occupancy profile is that the home is occupied by someone other than a borrower
    occupant_days: Where the most recent occupancy inspection finding on the borrower's occupancy profile is that the home is occupied by someone other than a borrower, 7 calendar days are added to the extension length; where that finding is that the home is vacant, 3 calendar days are added to it; any other finding, or none, adds nothing.
    appraisal_age_months: The age of the case's as-is appraisal is the number of whole calendar months from the appraisal date to the grant date, an appraisal dated after the grant date counting as less than 4 months old
    reappraisal_days: where the case has no appraisal recorded, 30 calendar days are added to the extension length for ordering one; where the appraisal is at least the plan's appraisal validity in months old, 21 calendar days are added to it for the reappraisal; where it is at least 4 and less than the plan's appraisal validity in months old, 7 calendar days are added to it; where it is less than 4 months old, nothing is added.
    result: The measured extension is the number of calendar days the request's supporting document measures from the current resolution deadline, counted below zero when the end it measures to falls before the current resolution deadline, and the extension length is the measured extension with every addition made and every deduction taken; the further extension days are the extension length raised to 30 calendar days when it is fewer, so that no extension shorter than 30 days is granted, and then limited to the plan's extension days when it is more, every addition and deduction being made before the extension length is raised or limited, as a whole number of calendar days. Where no extension request on the case is awaiting a decision, no extension is granted and the further extension days are zero. Where the supporting document of that request is neither a financing commitment nor a listing agreement, or carries no date, the request's evidence is insufficient, no extension is granted and the further extension days are zero.
  factors:
  - id: current_document_measure
    effect: method
    decides: measured_extension
    bindings:
    - pending_request_day
    - request_document
    - request_document_date
    - statement_through
    - measured_extension
    ladder:
    - when: the request's supporting document is a financing commitment AND the loan's payoff case has terms issued with a statement good-through date
      method: the measured extension runs from the current resolution deadline to 10 calendar days after the good-through date
    - when: the supporting document is a financing commitment AND no such statement is on the payoff file
      method: the measured extension runs from the current resolution deadline to 60 calendar days after the commitment date
    - when: otherwise (a listing agreement)
      method: the measured extension is the plan's extension days
    baseline:
      measured_extension: P('extension_days') if document_usable else 0
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: balance_to_value_days
    effect: parameter
    decides: equity_days
    bindings:
    - loan_balance
    - equity_share
    - equity_days
    ladder:
    - when: the equity share is no more than 50
      value: K('equity_days_strong') = 14 calendar days added to the extension length
    - when: the equity share is more than 50 and no more than 80
      value: K('equity_days_moderate') = 7 calendar days added to the extension length
    - when: otherwise (more than 80, or no appraisal or no Summit loan balance recorded, the share then being taken as 100)
      value: 0 calendar days added to the extension length
    baseline:
      equity_days: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: prior_grant_cut
    effect: parameter
    decides: used_cut
    bindings:
    - accepted_request_day
    - granted_document
    - last_grant_date
    - days_since_grant
    - used_cut
    ladder:
    - when: the request behind the extension already granted rested on a listing agreement AND that extension was granted more than 60 calendar days before this grant
      value: K('listing_used_cut') = 14 calendar days taken off the extension length
    - when: that request rested on a listing agreement AND the extension was granted no more than 60 calendar days before this grant
      value: K('recent_listing_cut') = 7 calendar days taken off the extension length
    - when: otherwise (that request rested on a financing commitment or a document of another kind, or no granted extension is on record)
      value: 0 calendar days taken off the extension length
    baseline:
      used_cut: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: closing_charge_days
    effect: parameter
    decides: reserve_days
    bindings:
    - reserve_status
    - reserve_balance
    - reserve_year_charges
    - reserve_days
    ladder:
    - when: the Summit Tax and Insurance Reserve is active AND its balance is below one year's property tax and hazard premium on file
      value: K('reserve_short_days') = 7 calendar days added to the extension length
    - when: the Summit Tax and Insurance Reserve is depleted
      value: K('reserve_depleted_days') = 14 calendar days added to the extension length
    - when: otherwise
      value: 0 calendar days added to the extension length
    baseline:
      reserve_days: '0'
    evidence:
    - cross_category
    cross_difficulty: setaside
  - id: household_occupant_days
    effect: parameter
    decides: occupant_days
    bindings:
    - inspection_day
    - last_inspection_finding
    - occupant_days
    ladder:
    - when: the most recent occupancy inspection finding is that the home is occupied by someone other than a borrower
      value: K('occupant_days_household') = 7 calendar days added to the extension length
    - when: the most recent finding is that the home is vacant
      value: K('occupant_days_vacant') = 3 calendar days added to the extension length
    - when: otherwise
      value: 0 calendar days added to the extension length
    baseline:
      occupant_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: reappraisal_allowance
    effect: parameter
    decides: reappraisal_days
    bindings:
    - appraisal_age_months
    - reappraisal_days
    ladder:
    - when: the case has no as-is appraisal recorded
      value: K('reappraisal_missing_days') = 30 calendar days added to the extension length
    - when: the appraisal is at least the plan's appraisal validity (6 whole months) old
      value: K('reappraisal_stale_days') = 21 calendar days added to the extension length
    - when: the appraisal is at least 4 and less than 6 whole months old
      value: K('reappraisal_aging_days') = 7 calendar days added to the extension length
    - when: otherwise (less than 4 whole months old, or dated after the grant date)
      value: 0 calendar days added to the extension length
    baseline:
      reappraisal_days: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The measured extension is the number of calendar days the request's supporting document measures from the current resolution deadline, counted below zero when the end it measures to falls before the current resolution deadline, and the extension length is the measured extension with every addition made and every deduction taken; the further extension days are the extension length raised to 30 calendar days when it is fewer, so that no extension shorter than 30 days is granted, and then limited to the plan's extension days when it is more, every addition and deduction being made before the extension length is raised or limited, as a whole number of calendar days. As standard, the measured extension is the plan's extension days, and nothing is added to or taken off the extension length.
    params:
    - extension_days
  inputs:
    history:
    - table: maturity_requests
      aggregate: latest
      field: evidence_type
      filters:
        request_type: extension_request
        request_status: received
    - category: residency
      table: residency_events
      aggregate: latest
      field: inspection_outcome
      filters:
        event_type: residency_inspection_result
    - table: maturity_case_events
      aggregate: latest
      field: effective_date
      filters:
        event_type: maturity_extension_granted
    cross_category:
    - jumbo
    - payoff
    - residency
    - setaside
