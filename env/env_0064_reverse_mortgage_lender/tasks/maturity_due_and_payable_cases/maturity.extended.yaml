    result: The successor response window is the number of calendar days from the mailing date to the successor response deadline, as a whole number of calendar days. The window count is the base count with every addition made and every deduction taken, all of them made before the count is turned into calendar days, and the successor response deadline is the day reached by counting the window count forward from the mailing date under the counting convention, the day after mailing being the first day counted.
  factors:
  - id: sale_underway_window
    effect: parameter
    decides: base_count
    bindings:
    - supported_requests
    - declaration_day
    - recorded_intent
    - base_count
    ladder:
    - when: the case carries a received extension request supported by a listing agreement or a financing commitment AND the most recent accepted intent declaration on the case declares a sale or a retention of the property
      value: K('window_days_supported') = 21 days of base count
    - when: the case carries no such request AND the most recent accepted intent declaration on the case declares a sale or a retention of the property
      value: K('window_days_declared') = 25 days of base count
    - when: otherwise
      value: P('successor_response_days') (the death plan's successor response days, 30)
    baseline:
      base_count: P('successor_response_days')
    evidence:
    - history
    cross_difficulty: null
  - id: appraisal_age_window
    effect: parameter
    decides: appraisal_days
    bindings:
    - appraisal_age_months
    - appraisal_days
    ladder:
    - when: the case has no as-is appraisal recorded
      value: K('appraisal_days_missing') = 15 days added to the window count
    - when: the appraisal is at least the plan's appraisal validity (6 whole months) old at mailing
      value: K('appraisal_days_stale') = 10 days added to the window count
    - when: the appraisal is at least 4 and less than 6 whole months old at mailing
      value: K('appraisal_days_aging') = 5 days added to the window count
    - when: otherwise (less than 4 whole months old, or dated after the mailing date)
      value: 0 days added to the window count
    baseline:
      appraisal_days: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: charge_window
    effect: parameter
    decides: charge_days
    bindings:
    - advances_recorded
    - repayments_recorded
    - unrepaid_advances
    - reserve_status
    - charge_days
    ladder:
    - when: the unrepaid property-charge advances exceed 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_days_high') = 5 days taken off the window count
    - when: the unrepaid property-charge advances are more than zero and no more than 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_days_low') = 2 days taken off the window count
    - when: otherwise (no unrepaid advances, or the reserve is active)
      value: 0 days taken off the window count
    baseline:
      charge_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: setaside
  - id: counting_convention
    effect: method
    decides: counted_window
    bindings:
    - inspection_day
    - last_inspection_finding
    - mailing_weekday
    - counted_window
    ladder:
    - when: the most recent occupancy inspection finding is that the home is occupied by someone other than a borrower
      method: the window count is counted in business days (Monday to Friday after the mailing date, Saturdays and Sundays skipped) and the window is the calendar days to the last business day so counted
    - when: the most recent occupancy inspection finding is that the home is vacant
      method: the window count is counted in calendar days and an end on a Saturday or Sunday moves to the following Monday
    - when: otherwise (any other finding, or none)
      method: the window count is counted in calendar days with no move
    baseline:
      counted_window: window_count
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: residency
