    recorded_intent: where the case carries a received extension request supported by a listing agreement or a financing commitment and the most recent accepted intent declaration on the case declares a sale or a retention of the property
    evidence_window: 'The base evidence window is set by the evidence already on the case: where the case carries a received extension request supported by a listing agreement or a financing commitment and the most recent accepted intent declaration on the case declares a sale or a retention of the property, the base evidence window is 14 calendar days; where that declaration declares a sale or a retention but the case carries no such request, the base evidence window is 21 calendar days; otherwise the base evidence window is 30 calendar days.'
    response_deadline_now: in every other case, including a case in its extension period with no granted extension on record and a case with no resolution deadline, the clock starts on the response deadline.
    resolution_deadline_now: or the case is not in its extension period and its resolution deadline falls before its response deadline or no more than 30 calendar days after it, the clock starts on the declaration date
    latest_grant_date: where the case is in its extension period and an extension granted on the case is on record, the clock starts on the date the most recent extension was granted
    clock_start_offset: 'The evidence clock starts according to where the case stands: where the case is in its extension period and an extension granted on the case is on record, the clock starts on the date the most recent extension was granted; where the case shows no response deadline, or the case is not in its extension period and its resolution deadline falls before its response deadline or no more than 30 calendar days after it, the clock starts on the declaration date, so that the evidence is on file before the resolution deadline; in every other case, including a case in its extension period with no granted extension on record and a case with no resolution deadline, the clock starts on the response deadline.'
    appraisal_age_months: The age of the case's as-is appraisal is the number of whole calendar months from the appraisal date to the declaration date, an appraisal dated after the declaration date counting as less than 4 months old.
    appraisal_allowance: Where the case has no appraisal recorded, 21 calendar days are added to the evidence window; where the appraisal is at least the plan's appraisal validity in months old, 14 calendar days are added; where it is at least 4 and less than the plan's appraisal validity in months old, 7 calendar days are added; where it is less than 4 months old, nothing is added.
    advances_recorded: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it.
    repayments_recorded: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it.
    unrepaid_advances: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it.
    reserve_status: Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan's Summit Tax and Insurance Reserve is not active
    charge_cut: Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan's Summit Tax and Insurance Reserve is not active, 7 calendar days are taken off the evidence window; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 3 calendar days are taken off; where there are none, or that reserve is active, nothing is taken off.
    result: 'The declaration carries an evidence due date: the day by which the listing agreement or financing commitment supporting the declared intent must be on file for the case; the evidence due days are the calendar days from the declaration date to that day. The evidence due date is the evidence clock start date plus the evidence window, and the evidence window is the base evidence window with every addition made and every deduction taken; the evidence due days are a whole number never less than 1, a lower count being raised to 1 after every addition and deduction is made.'
  factors:
  - id: on_file_evidence_window
    effect: parameter
    decides: evidence_window
    bindings:
    - supported_requests
    - declaration_day
    - recorded_intent
    - evidence_window
    ladder:
    - when: the case carries a received extension request supported by a listing agreement or a financing commitment AND the most recent accepted intent declaration on the case declares a sale or a retention of the property
      value: K('evidence_days_supported') = 14 calendar days of base evidence window
    - when: the case carries no such request AND the most recent accepted intent declaration on the case declares a sale or a retention of the property
      value: K('evidence_days_declared') = 21 calendar days of base evidence window
    - when: otherwise
      value: K('evidence_days_standard') = 30 calendar days of base evidence window
    baseline:
      evidence_window: K('evidence_days_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: evidence_clock_anchor
    effect: method
    decides: clock_start_offset
    bindings:
    - response_deadline_now
    - resolution_deadline_now
    - latest_grant_date
    - clock_start_offset
    ladder:
    - when: the case is in its extension period AND an extension granted on the case is on record
      method: the evidence clock starts on the date the most recent extension was granted
    - when: the case shows no response deadline, OR the case is not in its extension period AND its resolution deadline falls before its response deadline or no more than 30 calendar days after it
      method: the evidence clock starts on the declaration date
    - when: otherwise (including a case in its extension period with no granted extension on record, or a case with no resolution deadline)
      method: the evidence clock starts on the response deadline
    baseline:
      clock_start_offset: DAYS(declaration_date, response_deadline_now) if (response_deadline_now != None and response_deadline_now != '') else 0
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: appraisal_evidence_allowance
    effect: parameter
    decides: appraisal_allowance
    bindings:
    - appraisal_age_months
    - appraisal_allowance
    ladder:
    - when: the case has no as-is appraisal recorded
      value: K('appraisal_allowance_missing') = 21 calendar days added to the evidence window
    - when: the appraisal is at least the plan's appraisal validity (6 whole months) old at the declaration date
      value: K('appraisal_allowance_stale') = 14 calendar days added to the evidence window
    - when: the appraisal is at least 4 and less than 6 whole months old
      value: K('appraisal_allowance_aging') = 7 calendar days added to the evidence window
    - when: otherwise (less than 4 whole months old, or dated after the declaration date)
      value: 0 calendar days added to the evidence window
    baseline:
      appraisal_allowance: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: charge_evidence_cut
    effect: parameter
    decides: charge_cut
    bindings:
    - advances_recorded
    - repayments_recorded
    - unrepaid_advances
    - reserve_status
    - charge_cut
    ladder:
    - when: the unrepaid property-charge advances exceed 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_cut_high') = 7 calendar days taken off the evidence window
    - when: the unrepaid property-charge advances are more than zero and no more than 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_cut_low') = 3 calendar days taken off the evidence window
    - when: otherwise (no unrepaid advances, or the reserve is active)
      value: 0 calendar days taken off the evidence window
    baseline:
      charge_cut: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: setaside
  baseline:
    rule: 'The declaration carries an evidence due date: the day by which the listing agreement or financing commitment supporting the declared intent must be on file for the case; the evidence due days are the calendar days from the declaration date to that day. The evidence due date is the evidence clock start date plus the evidence window, and the evidence window is the base evidence window with every addition made and every deduction taken; the evidence due days are a whole number never less than 1, a lower count being raised to 1 after every addition and deduction is made. As standard, the evidence clock starts on the case''s response deadline, or on the declaration date when the case shows no response deadline, the base evidence window is 30 calendar days, and nothing is added to or taken off the evidence window.'
    params:
    - evidence_days_standard
  inputs:
    history:
    - table: maturity_requests
      aggregate: count
      field: maturity_request_id
      filters:
        request_type: extension_request
        request_status: received
    - table: maturity_case_events
      aggregate: latest
      field: effective_date
      filters:
        event_type: maturity_extension_granted
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: propcharge_advance
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: propcharge_repayment
    cross_category:
    - propcharge
    - setaside
- id: maturity_ext_first_extension_sizing
  base_policy_refs:
  - maturity_extensions
  - maturity_notices
  overwrite:
  - base_policy: maturity_extensions
    superseded_clause: An extension adds extension_days calendar days to the current resolution_deadline and is granted only to a borrower or confirmed successor whose declared intent is sell_property or retain_property and who is actively marketing the property or obtaining financing.
    replaced_by: An extension adds the plan's extension days to the current resolution deadline and is granted only to a borrower or confirmed successor whose declared intent is to sell or to retain the property and who is actively marketing the property or obtaining financing, apart from a further extension on a Summit loan's case; for the first extension on a Summit loan's case whose borrower has died, and only for such an extension, the extension adds the first extension days this policy computes to the current resolution deadline, on the same grant conditions.
  - base_policy: maturity_extensions
    superseded_clause: An extension is granted only after HUD's extension_approved step for that extension number is recorded on the case, per extension_hud_approval_required; on a Summit loan Cedarline approves it directly.
    replaced_by: An extension is granted only after HUD's extension approval for that extension number is recorded on the case, no case receives more than the plan's maximum number of extensions, a request beyond that limit is declined as extension limit reached, and a request whose evidence is missing or of another kind is declined as evidence insufficient; for an extension on a Summit loan's case, and only for such an extension, Cedarline approves the extension itself without any HUD step and the extension carries the number one higher than the extensions already granted on the case, under the same limit and decline reasons.
  - base_policy: maturity_extensions
    superseded_clause: No case receives more than max_extensions extensions, counted by maturity_msr_extensions_granted; a request beyond the limit is declined with reason extension_limit_reached, and a request whose evidence is missing or of another type is declined with reason evidence_insufficient.
    replaced_by: An extension is granted only after HUD's extension approval for that extension number is recorded on the case, no case receives more than the plan's maximum number of extensions, a request beyond that limit is declined as extension limit reached, and a request whose evidence is missing or of another kind is declined as evidence insufficient; for an extension on a Summit loan's case, and only for such an extension, Cedarline approves the extension itself without any HUD step and the extension carries the number one higher than the extensions already granted on the case, under the same limit and decline reasons.
  - base_policy: maturity_extensions
    superseded_clause: when the appraisal is older than appraisal_valid_months, a new appraisal is ordered, per reappraisal_for_extension
    replaced_by: Every extension sets the resolution deadline to the extended deadline and, when the appraisal is older than the plan's appraisal validity, orders a new appraisal at the grant wherever the plan's reappraisal-for-extension setting calls for one; for the first extension on a Summit loan's case whose borrower has died and for a further extension on a Summit loan's case, and only for such extensions, an appraisal older than the plan's appraisal validity is not reordered at the grant, and it is replaced by a new one when a payoff or sale is next evaluated.
  trigger: on_request
  subject:
  - maturity_extension_granted
  - maturity_extension_started
  computes: extension_days
  target_tool: grant_first_extension_77f15011
  params:
    commitment_valid_days: 60
    listing_term_days: 180
    household_allowance_days: 15
    vacant_allowance_days: 7
    equity_strong_pct: 50
    equity_moderate_pct: 80
    equity_allowance_strong: 14
    equity_allowance_moderate: 7
    charge_threshold: 2000.0
    charge_cut_high: 10
    charge_cut_low: 5
    carried_request_days: 10
    successor_request_days: 5
    minimum_extension_days: 30
    recent_takeover_days: 7
    settling_takeover_days: 30
    takeover_recent_allowance: 14
    takeover_settling_allowance: 7
    fresh_listing_days: 90
    aged_listing_days: 150
  rule: 'An extension adds the plan''s extension days to the current resolution deadline and is granted only to a borrower or confirmed successor whose declared intent is to sell or to retain the property and who is actively marketing the property or obtaining financing, apart from a further extension on a Summit loan''s case; for the first extension on a Summit loan''s case whose borrower has died, and only for such an extension, the extension adds the first extension days this policy computes to the current resolution deadline, on the same grant conditions. An extension is granted only after HUD''s extension approval for that extension number is recorded on the case, no case receives more than the plan''s maximum number of extensions, a request beyond that limit is declined as extension limit reached, and a request whose evidence is missing or of another kind is declined as evidence insufficient; for an extension on a Summit loan''s case, and only for such an extension, Cedarline approves the extension itself without any HUD step and the extension carries the number one higher than the extensions already granted on the case, under the same limit and decline reasons. A first extension on a deceased borrower''s case is granted only after the case records the resolution intent declared by a successor in interest of that borrower. A first extension on a case whose event was superseded by the borrower''s death is not sized until the case''s event type reads the death of the last surviving borrower. Every extension sets the resolution deadline to the extended deadline and, when the appraisal is older than the plan''s appraisal validity, orders a new appraisal at the grant wherever the plan''s reappraisal-for-extension setting calls for one; for the first extension on a Summit loan''s case whose borrower has died and for a further extension on a Summit loan''s case, and only for such extensions, an appraisal older than the plan''s appraisal validity is not reordered at the grant, and it is replaced by a new one when a payoff or sale is next evaluated. The grant books the extension, moves the case into its extension period with the extended deadline as its resolution deadline, marks the extension request accepted, and sends the extension letter to the person acting on the case that day. The measured extension is the calendar days from the current resolution deadline to the end the request''s supporting document sets, counted below zero when that end falls before the current resolution deadline, and the extension length is the measured extension with every addition made and every deduction taken; the first extension days are the extension length raised to 30 calendar days when it is fewer, so that no extension shorter than 30 days is granted, and then limited to the plan''s extension days when it is more, every addition and deduction being made before the extension length is raised or limited, as a whole number of calendar days. As standard, the measured extension runs from the current resolution deadline to 180 calendar days after the date on the extension request''s supporting document, the end of a standard six-month marketing term, and nothing is added to or taken off the extension length. The extension request the grant rests on is the most recently received extension request on the case that is still awaiting a decision, and its supporting document sets how far the measured extension runs from the current resolution deadline: where that document is a financing commitment, to 60 calendar days after the commitment date; where it is a listing agreement dated more than 90 calendar days before the request was received, a listing marketed a full quarter without a sale, to 150 calendar days after the listing date, a month short of its six-month term so that its price is reviewed sooner; where it is a listing agreement dated no more than 90 calendar days before the request was received, to 180 calendar days after the listing date, the end of its six-month term. Among extension requests received on the same day, the more recently received is the one recorded later by its recorded date and time, so that a request re-filed on the day of the request it replaces is the one a grant rests on. Where no extension request on the case is awaiting a decision, no extension is granted and the first extension days are zero. Where the supporting document of that request is neither a financing commitment nor a listing agreement, or carries no date, the request''s evidence is insufficient, no extension is granted and the first extension days are zero. Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding. Where the most recent occupancy inspection finding on the borrower''s occupancy profile is that the home is occupied by someone other than a borrower, 15 calendar days are added to the extension length; where that finding is that the home is vacant, 7 calendar days are added to it; any other finding, or none, adds nothing. The case''s as-is appraised value is the appraised value recorded on the case. The equity share is the Summit loan balance divided by the case''s as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file; where it is no more than 50, 14 calendar days are added to the extension length; where it is more than 50 and no more than 80, 7 calendar days are added to it; where it is more than 80, nothing is added. The unrepaid property-charge advances are the advances recorded on the loan''s property charge repayment arrangement less the repayments recorded on it; where they exceed 2,000.00 dollars and the loan''s Summit Tax and Insurance Reserve is not active, 10 calendar days are taken off the extension length; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 5 calendar days are taken off it; where there are none, or that reserve is active, nothing is taken off. Where more than one accepted death notice is on the borrower''s occupancy profile, the date of death is read from the one received most recently, and among accepted notices received on the same day from the one recorded later by its recorded date and time. Where the extension request was filed by the borrower of record and the borrower''s date of death on the accepted death notice falls after the day the request was received, 10 calendar days are added to the extension length for carrying the request over to the estate; where the request was filed by someone other than the borrower of record, 5 calendar days are added to it; where the borrower of record filed it and the request was received on or after the date of death, or no date of death is on an accepted death notice, nothing is added. The successor''s takeover days are the calendar days from the most recent accepted intent declaration on the case to the grant date; where they are no more than 7, 14 calendar days are added to the extension length for the successor taking over the sale or refinance; where they are more than 7 and no more than 30, 7 calendar days are added to it; where they are more than 30, or the case carries no accepted intent declaration, nothing is added.'
  prerequisite:
  - problem: maturity_ext_successor_evidence_window
    kind: value_input
    gate: takeover_allowance
    form: state
    policy_source: A first extension on a deceased borrower's case is granted only after the case records the resolution intent declared by a successor in interest of that borrower.
    condition: The case's successor_customer_id names a successor in interest linked to the deceased borrower and its successor_intent is retain_property or sell_property, recorded from that successor's own declaration.
    resolved_by: declare_successor_intent_94ee6efc
    effect: The successor's recorded declaration becomes the most recent accepted intent declaration on the case, dated the grant day, which moves the successor takeover allowance from nothing (the borrower's months-old declaration) to the recent-takeover days.
  - problem: maturity_ext_successor_runway
    kind: value_input
    gate: horizon_days
    form: state
    policy_source: A first extension on a case whose event was superseded by the borrower's death is not sized until the case's event type reads the death of the last surviving borrower.
    condition: The Summit case's variant_name reads Death of Last Surviving Borrower, which on such a case is written together with the resolution deadline carried forward by the successor runway days.
    resolved_by: reclassify_case_to_death_eeacbce3
    effect: The reclassification carries the resolution deadline forward, so the measured extension, counted from the current resolution deadline to the end of the supporting document's horizon, changes.
  cross_category:
  - category: residency
    as: history
    reads:
    - residency_events.inspection_outcome
    - residency_submissions.event_date
    note: The latest inspection finding adds household or vacancy days, and the date of death on the accepted death notice decides the carried-request allowance.
  - category: jumbo
    as: branch
    reads:
    - principal_balance
    note: The Summit loan balance sets the equity share that adds days.
  - category: propcharge
    as: history
    reads:
    - propcharge_transactions.amount
    note: Advances less repayments give the unrepaid property-charge advances that take days off.
  - category: setaside
    as: branch
    reads:
    - status
    note: Whether the Summit Tax and Insurance Reserve is active decides whether unrepaid advances take days off.
  compute:
  - deadline_now: F('resolution_deadline')
  - borrower_id: F('customer_id')
  - listing_request_received: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='extension_request', request_status='received')
  - request_document: LATEST('maturity_requests', 'evidence_type', date_field='created_at', request_type='extension_request', request_status='received', request_date=listing_request_received)
  - request_document_date: LATEST('maturity_requests', 'evidence_date', date_field='created_at', request_type='extension_request', request_status='received', request_date=listing_request_received)
  - pending_requests: COUNT('maturity_requests', request_type='extension_request', request_status='received')
  - document_usable: (request_document == 'financing_commitment' or request_document == 'listing_agreement') and request_document_date != None and request_document_date != ''
  - horizon_days: ((DAYS(deadline_now, request_document_date) + K('commitment_valid_days')) if request_document == 'financing_commitment' else ((DAYS(deadline_now, request_document_date) + K('aged_listing_days')) if DAYS(request_document_date, listing_request_received) > K('fresh_listing_days') else (DAYS(deadline_now, request_document_date) + K('listing_term_days')))) if document_usable else 0
  - inspection_day: XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result')
  - last_inspection_finding: '''occupied_by_others'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''occupied_by_others'') > 0 else (''vacant'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''vacant'') > 0 else XLATEST(''residency'', ''residency_events'', ''inspection_outcome'', date_field=''effective_date'', event_type=''residency_inspection_result''))'
  - household_allowance: K('household_allowance_days') if last_inspection_finding == 'occupied_by_others' else (K('vacant_allowance_days') if last_inspection_finding == 'vacant' else 0)
  - case_appraised_value: float(F('appraised_value') or 0)
  - loan_balance: CFIELD('jumbo', 'principal_balance', jumbo_loan_id=F('jumbo_loan_id'))
  - equity_share: RND(float(loan_balance) / case_appraised_value * 100, 2) if (loan_balance != None and case_appraised_value > 0) else 100.0
  - equity_allowance: K('equity_allowance_strong') if equity_share <= K('equity_strong_pct') else (K('equity_allowance_moderate') if equity_share <= K('equity_moderate_pct') else 0)
  - advances_recorded: XSUM('propcharge', 'propcharge_transactions', 'amount', event_type='propcharge_advance')
  - repayments_recorded: XSUM('propcharge', 'propcharge_transactions', 'amount', event_type='propcharge_repayment')
  - unrepaid_advances: RND(advances_recorded - repayments_recorded, 2)
  - reserve_status: CFIELD('setaside', 'status', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id'))
  - charge_cut: K('charge_cut_high') if (unrepaid_advances > K('charge_threshold') and reserve_status != 'active') else (K('charge_cut_low') if (unrepaid_advances > 0 and unrepaid_advances <= K('charge_threshold') and reserve_status != 'active') else 0)
  - request_received: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='extension_request', request_status='received')
  - request_filer: LATEST('maturity_requests', 'customer_id', date_field='created_at', request_type='extension_request', request_status='received', request_date=request_received)
  - death_notice_day: XLATEST('residency', 'residency_submissions', 'received_date', date_field='received_date', submission_type='death_notice', review_status='accepted')
  - death_date: XLATEST('residency', 'residency_submissions', 'event_date', date_field='created_at', submission_type='death_notice', review_status='accepted', received_date=death_notice_day)
  - carried_request_allowance: K('carried_request_days') if (request_filer == borrower_id and death_date != None and DAYS(request_received, death_date) > 0) else (K('successor_request_days') if request_filer != borrower_id else 0)
  - declared_date: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='intent_declaration', request_status='accepted')
  - takeover_days: DAYS(declared_date, NOW) if declared_date != None else None
  - takeover_allowance: 0 if takeover_days == None else (K('takeover_recent_allowance') if takeover_days <= K('recent_takeover_days') else (K('takeover_settling_allowance') if takeover_days <= K('settling_takeover_days') else 0))
  - result: MN(P('extension_days'), MX(K('minimum_extension_days'), horizon_days + household_allowance + equity_allowance + carried_request_allowance + takeover_allowance - charge_cut)) if (pending_requests > 0 and document_usable) else 0
  compute_basis:
    deadline_now: sets how far the measured extension runs from the current resolution deadline
    borrower_id: Where the extension request was filed by the borrower of record
    listing_request_received: where it is a listing agreement dated more than 90 calendar days before the request was received
    request_document: The extension request the grant rests on is the most recently received extension request on the case that is still awaiting a decision, and its supporting document sets how far the measured extension runs from the current resolution deadline
    request_document_date: The extension request the grant rests on is the most recently received extension request on the case that is still awaiting a decision, and its supporting document sets how far the measured extension runs from the current resolution deadline
    pending_requests: Where no extension request on the case is awaiting a decision, no extension is granted and the first extension days are zero.
    document_usable: Where the supporting document of that request is neither a financing commitment nor a listing agreement, or carries no date, the request's evidence is insufficient, no extension is granted and the first extension days are zero.
    horizon_days: where that document is a financing commitment, to 60 calendar days after the commitment date; where it is a listing agreement dated more than 90 calendar days before the request was received, a listing marketed a full quarter without a sale, to 150 calendar days after the listing date, a month short of its six-month term so that its price is reviewed sooner; where it is a listing agreement dated no more than 90 calendar days before the request was received, to 180 calendar days after the listing date, the end of its six-month term.
    inspection_day: Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding.
    last_inspection_finding: Where the most recent occupancy inspection finding on the borrower's occupancy profile is that the home is occupied by someone other than a borrower
    household_allowance: Where the most recent occupancy inspection finding on the borrower's occupancy profile is that the home is occupied by someone other than a borrower, 15 calendar days are added to the extension length; where that finding is that the home is vacant, 7 calendar days are added to it; any other finding, or none, adds nothing.
    case_appraised_value: The case's as-is appraised value is the appraised value recorded on the case.
    loan_balance: The equity share is the Summit loan balance divided by the case's as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file
    equity_share: The equity share is the Summit loan balance divided by the case's as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file
    equity_allowance: where it is no more than 50, 14 calendar days are added to the extension length; where it is more than 50 and no more than 80, 7 calendar days are added to it; where it is more than 80, nothing is added.
    advances_recorded: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it
    repayments_recorded: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it
    unrepaid_advances: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it
    reserve_status: where they exceed 2,000.00 dollars and the loan's Summit Tax and Insurance Reserve is not active
    charge_cut: where they exceed 2,000.00 dollars and the loan's Summit Tax and Insurance Reserve is not active, 10 calendar days are taken off the extension length; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 5 calendar days are taken off it; where there are none, or that reserve is active, nothing is taken off.
    request_received: the borrower's date of death on the accepted death notice falls after the day the request was received
    request_filer: Where the extension request was filed by the borrower of record
    death_notice_day: Where more than one accepted death notice is on the borrower's occupancy profile, the date of death is read from the one received most recently, and among accepted notices received on the same day from the one recorded later by its recorded date and time.
    death_date: Where more than one accepted death notice is on the borrower's occupancy profile, the date of death is read from the one received most recently, and among accepted notices received on the same day from the one recorded later by its recorded date and time.
    carried_request_allowance: Where the extension request was filed by the borrower of record and the borrower's date of death on the accepted death notice falls after the day the request was received, 10 calendar days are added to the extension length for carrying the request over to the estate; where the request was filed by someone other than the borrower of record, 5 calendar days are added to it; where the borrower of record filed it and the request was received on or after the date of death, or no date of death is on an accepted death notice, nothing is added.
    declared_date: The successor's takeover days are the calendar days from the most recent accepted intent declaration on the case to the grant date
    takeover_days: The successor's takeover days are the calendar days from the most recent accepted intent declaration on the case to the grant date
    takeover_allowance: where they are no more than 7, 14 calendar days are added to the extension length for the successor taking over the sale or refinance; where they are more than 7 and no more than 30, 7 calendar days are added to it; where they are more than 30, or the case carries no accepted intent declaration, nothing is added.
    result: The measured extension is the calendar days from the current resolution deadline to the end the request's supporting document sets, counted below zero when that end falls before the current resolution deadline, and the extension length is the measured extension with every addition made and every deduction taken; the first extension days are the extension length raised to 30 calendar days when it is fewer, so that no extension shorter than 30 days is granted, and then limited to the plan's extension days when it is more, every addition and deduction being made before the extension length is raised or limited, as a whole number of calendar days. Where no extension request on the case is awaiting a decision, no extension is granted and the first extension days are zero. Where the supporting document of that request is neither a financing commitment nor a listing agreement, or carries no date, the request's evidence is insufficient, no extension is granted and the first extension days are zero.
  factors:
  - id: document_horizon
    effect: method
    decides: horizon_days
    bindings:
    - listing_request_received
    - request_document
    - request_document_date
    - horizon_days
    ladder:
    - when: the extension request's supporting document is a financing commitment
      method: the measured extension runs from the current resolution deadline to 60 calendar days after the commitment date
    - when: the supporting document is a listing agreement dated more than 90 calendar days before the request was received
      method: the measured extension runs from the current resolution deadline to 150 calendar days after the listing date
    - when: otherwise (a listing agreement dated no more than 90 calendar days before the request was received)
      method: the measured extension runs from the current resolution deadline to 180 calendar days after the listing date
    baseline:
      horizon_days: (DAYS(deadline_now, request_document_date) + K('listing_term_days')) if document_usable else 0
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: occupant_allowance
    effect: parameter
    decides: household_allowance
    bindings:
    - inspection_day
    - last_inspection_finding
    - household_allowance
    ladder:
    - when: the most recent occupancy inspection finding is that the home is occupied by someone other than a borrower
      value: K('household_allowance_days') = 15 calendar days added to the extension length
    - when: the most recent occupancy inspection finding is that the home is vacant
      value: K('vacant_allowance_days') = 7 calendar days added to the extension length
    - when: otherwise
      value: 0 calendar days added to the extension length
    baseline:
      household_allowance: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: equity_cushion
    effect: parameter
    decides: equity_allowance
    bindings:
    - loan_balance
    - equity_share
    - equity_allowance
    ladder:
    - when: the equity share is no more than 50
      value: K('equity_allowance_strong') = 14 calendar days added to the extension length
    - when: the equity share is more than 50 and no more than 80
      value: K('equity_allowance_moderate') = 7 calendar days added to the extension length
    - when: otherwise (more than 80, or no appraisal or no Summit loan balance recorded, the share then being taken as 100)
      value: 0 calendar days added to the extension length
    baseline:
      equity_allowance: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: advance_exposure_cut
    effect: parameter
    decides: charge_cut
    bindings:
    - advances_recorded
    - repayments_recorded
    - unrepaid_advances
    - reserve_status
    - charge_cut
    ladder:
    - when: the unrepaid property-charge advances exceed 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_cut_high') = 10 calendar days taken off the extension length
    - when: the unrepaid property-charge advances are more than zero and no more than 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_cut_low') = 5 calendar days taken off the extension length
    - when: otherwise
      value: 0 calendar days taken off the extension length
    baseline:
      charge_cut: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: setaside
  - id: carried_request
    effect: parameter
    decides: carried_request_allowance
    bindings:
    - request_received
    - request_filer
    - death_notice_day
    - death_date
    - carried_request_allowance
    ladder:
    - when: the extension request was filed by the borrower of record AND the borrower's date of death falls after the day the request was received
      value: K('carried_request_days') = 10 calendar days added to the extension length
    - when: the request was filed by someone other than the borrower of record
      value: K('successor_request_days') = 5 calendar days added to the extension length
    - when: otherwise (filed by the borrower of record and received on or after the date of death, or no date of death on an accepted death notice)
      value: 0 calendar days added to the extension length
    baseline:
      carried_request_allowance: '0'
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: residency
  - id: successor_takeover
    effect: parameter
    decides: takeover_allowance
    bindings:
    - declared_date
    - takeover_days
    - takeover_allowance
    ladder:
    - when: the most recent accepted intent declaration on the case was made no more than 7 calendar days before the grant date
      value: K('takeover_recent_allowance') = 14 calendar days added to the extension length
    - when: it was made more than 7 and no more than 30 calendar days before the grant date
      value: K('takeover_settling_allowance') = 7 calendar days added to the extension length
    - when: otherwise (more than 30 calendar days before, or no accepted intent declaration on the case)
      value: 0 calendar days added to the extension length
    baseline:
      takeover_allowance: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The measured extension is the calendar days from the current resolution deadline to the end the request's supporting document sets, counted below zero when that end falls before the current resolution deadline, and the extension length is the measured extension with every addition made and every deduction taken; the first extension days are the extension length raised to 30 calendar days when it is fewer, so that no extension shorter than 30 days is granted, and then limited to the plan's extension days when it is more, every addition and deduction being made before the extension length is raised or limited, as a whole number of calendar days. As standard, the measured extension runs from the current resolution deadline to 180 calendar days after the date on the extension request's supporting document, the end of a standard six-month marketing term, and nothing is added to or taken off the extension length.
    params:
    - listing_term_days
    - minimum_extension_days
    - extension_days
  inputs:
    history:
    - table: maturity_requests
      aggregate: latest
      field: evidence_type
      filters:
        request_type: extension_request
        request_status: received
    - category: residency
      table: residency_events
      aggregate: latest
      field: inspection_outcome
      filters:
        event_type: residency_inspection_result
    - category: residency
      table: residency_submissions
      aggregate: latest
      field: event_date
      filters:
        submission_type: death_notice
        review_status: accepted
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: propcharge_advance
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: propcharge_repayment
    - table: maturity_requests
      aggregate: latest
      field: request_date
      filters:
        request_type: intent_declaration
        request_status: accepted
    cross_category:
    - residency
    - jumbo
    - propcharge
    - setaside
- id: maturity_ext_further_extension_ask
  base_policy_refs:
  - maturity_extensions
  overwrite: []
  trigger: on_request
  subject:
  - maturity_extension_granted
  computes: requested_extension_days
  target_tool: supplement_extension_request_11bdc0c2
  params:
    contract_closing_days: 45
    shortfall_review_days: 21
    payoff_posting_days: 7
    occupant_vacate_days: 10
    vacant_closing_days: 3
    aging_appraisal_months: 4
    appraisal_missing_days: 21
    appraisal_stale_days: 14
    appraisal_aging_days: 7
    late_filing_days: 5
    close_filing_window_days: 30
    close_filing_days: 2
    reserve_short_days: 7
    reserve_depleted_days: 14
  rule: 'A borrower or confirmed successor whose further extension request on a Summit loan''s case rests on supporting evidence that is no longer current re-files it in person with current evidence: the re-filed request is recorded as received on the day it is filed and states the number of further extension days it asks for, and the earlier request stays on file while any grant rests on the most recently received request awaiting a decision. Among extension requests received on the same day, the more recently received is the one recorded later by its recorded date and time, so that a request re-filed on the day of the request it replaces is the one a grant rests on. The requested extension days are the calendar days the re-filed request asks to add to the current resolution deadline, never more than the plan''s extension days and never less than zero. The requested length is the span with every addition made, and the requested extension days are the requested length or the plan''s extension days, whichever is smaller, as a whole number of calendar days, every addition being made before that limit is applied. As standard, the span is the plan''s extension days and nothing is added to the requested length. The span the request asks to cover is measured from the current resolution deadline according to the sale evidence on the loan''s payoff file: where the loan has a payoff case whose terms are issued with a statement good-through date, the span runs to that good-through date; where there is no such statement but an accepted purchase contract is on the payoff file, the span runs to 45 calendar days after the day that contract was received; otherwise the span is the plan''s extension days. A span that would end before the current resolution deadline is zero. Where more than one accepted purchase contract is on the payoff file, the one received most recently is used, and among accepted contracts received on the same day the one recorded later by its recorded date and time. Where the accepted purchase contract''s price less its commission and other seller closing costs is below the required payoff amount on the issued payoff terms, 21 calendar days are added to the requested length for review of a payoff shortfall; where that net amount covers the required payoff amount, 7 calendar days are added to it for the payoff funds to post and the loan to be satisfied; where there is no accepted contract or no issued terms, nothing is added. A commission or other seller closing cost not recorded on the contract counts as zero. Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding. Where the most recent occupancy inspection finding on the borrower''s occupancy profile is that the home is occupied by someone other than a borrower, 10 calendar days are added to the requested length for that occupant to vacate before closing; where that finding is that the home is vacant, 3 calendar days are added to it; any other finding, or none, adds nothing. The age of the case''s as-is appraisal is the number of whole calendar months from the appraisal date to the day the request is re-filed, an appraisal dated after that day counting as less than 4 months old; where the case has no appraisal recorded, 21 calendar days are added to the requested length; where the appraisal is at least the plan''s appraisal validity in months old, 14 calendar days are added to it for the new appraisal a sale evaluated on it requires; where it is at least 4 and less than the plan''s appraisal validity in months old, 7 calendar days are added to it; where it is less than 4 months old, nothing is added. The filing lead is the calendar days from the day the request being replaced was received to the current resolution deadline; where it is less than the plan''s extension lead days, including a request received after the current resolution deadline, 5 calendar days are added to the requested length for the processing a late request leaves no room for; where it is at least the plan''s extension lead days and no more than 30, 2 calendar days are added to it; where it is more than 30, nothing is added. Where no extension request on the case is awaiting a decision there is nothing to re-file and the requested extension days are zero. Where the loan''s Summit Tax and Insurance Reserve is active but holds less than one year''s property tax and hazard premium on file, 7 calendar days are added to the requested length for clearing the coming charges at closing; where that reserve is depleted, 14 calendar days are added to it; otherwise nothing is added.'
  prerequisite: []
  cross_category:
  - category: payoff
    as: history
    reads:
    - statement_good_through_date
    - required_payoff_amount
    - status
    - payoff_requests.request_date
    - payoff_requests.contract_price
    - payoff_requests.commission_amount
    - payoff_requests.other_closing_costs
    note: The payoff case's good-through date and the accepted purchase contract set the span and the payoff-funds addition.
  - category: residency
    as: history
    reads:
    - residency_events.inspection_outcome
    note: The most recent inspection finding sets the occupant addition.
  - category: setaside
    as: branch
    reads:
    - status
    - setaside_balance
    - annual_property_tax
    - annual_hazard_premium
    note: The Summit Tax and Insurance Reserve's status and balance against a year's charges set the reserve addition.
  compute:
  - deadline_now: F('resolution_deadline')
  - statement_through: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='terms_issued')
  - contract_received: XLATEST('payoff', 'payoff_requests', 'request_date', date_field='request_date', request_type='purchase_contract_submission', request_status='accepted')
  - ask_span: MX(0, DAYS(deadline_now, statement_through)) if (statement_through != None and statement_through != '') else ((MX(0, DAYS(deadline_now, contract_received) + K('contract_closing_days'))) if contract_received != None else P('extension_days'))
  - contract_day: XLATEST('payoff', 'payoff_requests', 'request_date', date_field='request_date', request_type='purchase_contract_submission', request_status='accepted')
  - contract_price: XLATEST('payoff', 'payoff_requests', 'contract_price', date_field='created_at', request_type='purchase_contract_submission', request_status='accepted', request_date=contract_day)
  - contract_commission: XLATEST('payoff', 'payoff_requests', 'commission_amount', date_field='created_at', request_type='purchase_contract_submission', request_status='accepted', request_date=contract_day)
  - contract_other_costs: XLATEST('payoff', 'payoff_requests', 'other_closing_costs', date_field='created_at', request_type='purchase_contract_submission', request_status='accepted', request_date=contract_day)
  - required_payoff: CFIELD('payoff', 'required_payoff_amount', jumbo_loan_id=F('jumbo_loan_id'), status='terms_issued')
  - payoff_funds_days: K('shortfall_review_days') if (contract_price != None and required_payoff != None and RND(float(contract_price) - float(contract_commission or 0) - float(contract_other_costs or 0), 2) < float(required_payoff)) else (K('payoff_posting_days') if (contract_price != None and required_payoff != None and RND(float(contract_price) - float(contract_commission or 0) - float(contract_other_costs or 0), 2) >= float(required_payoff)) else 0)
  - inspection_day: XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result')
  - last_inspection_finding: '''occupied_by_others'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''occupied_by_others'') > 0 else (''vacant'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''vacant'') > 0 else XLATEST(''residency'', ''residency_events'', ''inspection_outcome'', date_field=''effective_date'', event_type=''residency_inspection_result''))'
  - occupant_days: K('occupant_vacate_days') if last_inspection_finding == 'occupied_by_others' else (K('vacant_closing_days') if last_inspection_finding == 'vacant' else 0)
  - appraisal_age_months: MONTHS(F('appraisal_date'), NOW) if (F('appraisal_date') != None and F('appraisal_date') != '') else None
  - appraisal_days: K('appraisal_missing_days') if appraisal_age_months == None else (K('appraisal_stale_days') if appraisal_age_months >= P('appraisal_valid_months') else (K('appraisal_aging_days') if appraisal_age_months >= K('aging_appraisal_months') else 0))
  - replaced_request_received: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='extension_request', request_status='received')
  - filing_lead: DAYS(replaced_request_received, deadline_now) if replaced_request_received != None else None
  - pending_requests: COUNT('maturity_requests', request_type='extension_request', request_status='received')
  - filing_days: 0 if filing_lead == None else (K('late_filing_days') if filing_lead < P('hud_extension_lead_days') else (K('close_filing_days') if filing_lead <= K('close_filing_window_days') else 0))
  - reserve_status: CFIELD('setaside', 'status', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id'))
  - reserve_balance: CFIELD('setaside', 'setaside_balance', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id'))
  - reserve_year_charges: RND(float(CFIELD('setaside', 'annual_property_tax', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id')) or 0) + float(CFIELD('setaside', 'annual_hazard_premium', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id')) or 0), 2)
  - reserve_days: K('reserve_short_days') if (reserve_status == 'active' and float(reserve_balance or 0) < reserve_year_charges) else (K('reserve_depleted_days') if reserve_status == 'depleted' else 0)
  - result: MN(P('extension_days'), ask_span + payoff_funds_days + occupant_days + appraisal_days + filing_days + reserve_days) if pending_requests > 0 else 0
  compute_basis:
    deadline_now: The requested extension days are the calendar days the re-filed request asks to add to the current resolution deadline
    statement_through: where the loan has a payoff case whose terms are issued with a statement good-through date, the span runs to that good-through date
    contract_received: where there is no such statement but an accepted purchase contract is on the payoff file, the span runs to 45 calendar days after the day that contract was received
    ask_span: 'The span the request asks to cover is measured from the current resolution deadline according to the sale evidence on the loan''s payoff file: where the loan has a payoff case whose terms are issued with a statement good-through date, the span runs to that good-through date; where there is no such statement but an accepted purchase contract is on the payoff file, the span runs to 45 calendar days after the day that contract was received; otherwise the span is the plan''s extension days. A span that would end before the current resolution deadline is zero.'
    contract_day: Where more than one accepted purchase contract is on the payoff file, the one received most recently is used, and among accepted contracts received on the same day the one recorded later by its recorded date and time.
    contract_price: Where the accepted purchase contract's price less its commission and other seller closing costs is below the required payoff amount on the issued payoff terms
    contract_commission: A commission or other seller closing cost not recorded on the contract counts as zero.
    contract_other_costs: A commission or other seller closing cost not recorded on the contract counts as zero.
    required_payoff: Where the accepted purchase contract's price less its commission and other seller closing costs is below the required payoff amount on the issued payoff terms
    payoff_funds_days: Where the accepted purchase contract's price less its commission and other seller closing costs is below the required payoff amount on the issued payoff terms, 21 calendar days are added to the requested length for review of a payoff shortfall; where that net amount covers the required payoff amount, 7 calendar days are added to it for the payoff funds to post and the loan to be satisfied; where there is no accepted contract or no issued terms, nothing is added.
    inspection_day: Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding.
    last_inspection_finding: Where the most recent occupancy inspection finding on the borrower's occupancy profile is that the home is occupied by someone other than a borrower
    occupant_days: Where the most recent occupancy inspection finding on the borrower's occupancy profile is that the home is occupied by someone other than a borrower, 10 calendar days are added to the requested length for that occupant to vacate before closing; where that finding is that the home is vacant, 3 calendar days are added to it; any other finding, or none, adds nothing.
    appraisal_age_months: The age of the case's as-is appraisal is the number of whole calendar months from the appraisal date to the day the request is re-filed, an appraisal dated after that day counting as less than 4 months old
    appraisal_days: where the case has no appraisal recorded, 21 calendar days are added to the requested length; where the appraisal is at least the plan's appraisal validity in months old, 14 calendar days are added to it for the new appraisal a sale evaluated on it requires; where it is at least 4 and less than the plan's appraisal validity in months old, 7 calendar days are added to it; where it is less than 4 months old, nothing is added.
    replaced_request_received: The filing lead is the calendar days from the day the request being replaced was received to the current resolution deadline
    filing_lead: The filing lead is the calendar days from the day the request being replaced was received to the current resolution deadline
    pending_requests: Where no extension request on the case is awaiting a decision there is nothing to re-file and the requested extension days are zero.
    filing_days: where it is less than the plan's extension lead days, including a request received after the current resolution deadline, 5 calendar days are added to the requested length for the processing a late request leaves no room for; where it is at least the plan's extension lead days and no more than 30, 2 calendar days are added to it; where it is more than 30, nothing is added.
    reserve_status: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file
    reserve_balance: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file
    reserve_year_charges: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file
    reserve_days: Where the loan's Summit Tax and Insurance Reserve is active but holds less than one year's property tax and hazard premium on file, 7 calendar days are added to the requested length for clearing the coming charges at closing; where that reserve is depleted, 14 calendar days are added to it; otherwise nothing is added.
    result: The requested extension days are the calendar days the re-filed request asks to add to the current resolution deadline, never more than the plan's extension days and never less than zero. The requested length is the span with every addition made, and the requested extension days are the requested length or the plan's extension days, whichever is smaller, as a whole number of calendar days, every addition being made before that limit is applied. Where no extension request on the case is awaiting a decision there is nothing to re-file and the requested extension days are zero.
  factors:
  - id: sale_span
    effect: method
    decides: ask_span
    bindings:
    - statement_through
    - contract_received
    - ask_span
    ladder:
    - when: the loan has a payoff case with terms issued and a statement good-through date
      method: the span runs from the current resolution deadline to the statement good-through date, and is zero when that date falls before the current resolution deadline
    - when: no such statement, but an accepted purchase contract is on the payoff file
      method: the span runs from the current resolution deadline to 45 calendar days after the contract was received, and is zero when that day falls before the current resolution deadline
    - when: otherwise
      method: the span is the plan's extension days
    baseline:
      ask_span: P('extension_days')
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: payoff
  - id: payoff_funds_allowance
    effect: parameter
    decides: payoff_funds_days
    bindings:
    - contract_day
    - contract_price
    - contract_commission
    - contract_other_costs
    - required_payoff
    - payoff_funds_days
    ladder:
    - when: an accepted purchase contract AND issued payoff terms are on file AND the contract price less commission and other seller costs is below the required payoff amount
      value: K('shortfall_review_days') = 21 calendar days added to the requested length
    - when: an accepted purchase contract AND issued payoff terms are on file AND that net amount covers the required payoff amount
      value: K('payoff_posting_days') = 7 calendar days added to the requested length
    - when: otherwise
      value: 0 calendar days added to the requested length
    baseline:
      payoff_funds_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: payoff
  - id: occupant_vacate_allowance
    effect: parameter
    decides: occupant_days
    bindings:
    - inspection_day
    - last_inspection_finding
    - occupant_days
    ladder:
    - when: the most recent occupancy inspection finding is that the home is occupied by someone other than a borrower
      value: K('occupant_vacate_days') = 10 calendar days added to the requested length
    - when: the most recent occupancy inspection finding is that the home is vacant
      value: K('vacant_closing_days') = 3 calendar days added to the requested length
    - when: otherwise
      value: 0 calendar days added to the requested length
    baseline:
      occupant_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: appraisal_currency_allowance
    effect: parameter
    decides: appraisal_days
    bindings:
    - appraisal_age_months
    - appraisal_days
    ladder:
    - when: the case has no as-is appraisal recorded
      value: K('appraisal_missing_days') = 21 calendar days added to the requested length
    - when: the appraisal is at least the plan's appraisal validity (6 whole months) old
      value: K('appraisal_stale_days') = 14 calendar days added to the requested length
    - when: the appraisal is at least 4 and less than 6 whole months old
      value: K('appraisal_aging_days') = 7 calendar days added to the requested length
    - when: otherwise (less than 4 whole months old, or dated after the re-filing day)
      value: 0 calendar days added to the requested length
    baseline:
      appraisal_days: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: filing_lead_allowance
    effect: parameter
    decides: filing_days
    bindings:
    - replaced_request_received
    - filing_lead
    - filing_days
    ladder:
    - when: the request being replaced was received less than the plan's extension lead days (15) before the current resolution deadline, or after it
      value: K('late_filing_days') = 5 calendar days added to the requested length
    - when: it was received at least 15 and no more than 30 days before that deadline
      value: K('close_filing_days') = 2 calendar days added to the requested length
    - when: otherwise (more than 30 days before)
      value: 0 calendar days added to the requested length
    baseline:
      filing_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: reserve_charge_allowance
    effect: parameter
    decides: reserve_days
    bindings:
    - reserve_status
    - reserve_balance
    - reserve_year_charges
    - reserve_days
    ladder:
    - when: the Summit Tax and Insurance Reserve is active AND its balance is below one year's property tax and hazard premium on file
      value: K('reserve_short_days') = 7 calendar days added to the requested length
    - when: the Summit Tax and Insurance Reserve is depleted
      value: K('reserve_depleted_days') = 14 calendar days added to the requested length
    - when: otherwise
      value: 0 calendar days added to the requested length
    baseline:
      reserve_days: '0'
    evidence:
    - cross_category
    cross_difficulty: setaside
  baseline:
    rule: The requested extension days are the calendar days the re-filed request asks to add to the current resolution deadline, never more than the plan's extension days and never less than zero. The requested length is the span with every addition made, and the requested extension days are the requested length or the plan's extension days, whichever is smaller, as a whole number of calendar days, every addition being made before that limit is applied. As standard, the span is the plan's extension days and nothing is added to the requested length.
    params:
    - extension_days
  inputs:
