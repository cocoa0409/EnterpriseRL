  rule: 'A successor in interest who declares how the loan will be resolved on a Summit loan''s death case files the declaration in person, and the declared intent is recorded on the case as the successor''s intent on the day it is declared, provided the declaration meets the acceptance conditions stated next. An intent is recorded only from an intent declaration already on file for the case whose request status is received, made by the living borrower or, for a deceased borrower''s loan, by a customer whose profile type is successor in interest linked to that borrower, as the plan''s successor confirmation requirement provides, and received no later than the response deadline, a declaration by anyone else being declined as not a confirmed successor and one received later as outside the response window; for a successor in interest who declares in person on a Summit loan''s death case, and only for such a declaration, the intent is recorded from the declaration the successor files in that same act, which is accepted only from such a successor and only when the day it is filed is no later than the case''s response deadline, the deadline day itself still counting. A successor''s intent declaration, and the evidence due date it carries, are taken only after the case shows a response deadline that falls on or after the day of the declaration. The declaration carries an evidence due date: the day by which the listing agreement or financing commitment supporting the declared intent must be on file for the case; the evidence due days are the calendar days from the declaration date to that day. The evidence due date is the evidence clock start date plus the evidence window, and the evidence window is the base evidence window with every addition made and every deduction taken; the evidence due days are a whole number never less than 1, a lower count being raised to 1 after every addition and deduction is made. As standard, the evidence clock starts on the case''s response deadline, or on the declaration date when the case shows no response deadline, the base evidence window is 30 calendar days, and nothing is added to or taken off the evidence window. Among accepted intent declarations made on the same day, the most recent is the one recorded later by its recorded date and time. The base evidence window is set by the evidence already on the case: where the case carries a received extension request supported by a listing agreement or a financing commitment and the most recent accepted intent declaration on the case declares a sale or a retention of the property, the base evidence window is 14 calendar days; where that declaration declares a sale or a retention but the case carries no such request, the base evidence window is 21 calendar days; otherwise the base evidence window is 30 calendar days. The evidence clock starts according to where the case stands: where the case is in its extension period and an extension granted on the case is on record, the clock starts on the date the most recent extension was granted; where the case shows no response deadline, or the case is not in its extension period and its resolution deadline falls before its response deadline or no more than 30 calendar days after it, the clock starts on the declaration date, so that the evidence is on file before the resolution deadline; in every other case, including a case in its extension period with no granted extension on record and a case with no resolution deadline, the clock starts on the response deadline. The age of the case''s as-is appraisal is the number of whole calendar months from the appraisal date to the declaration date, an appraisal dated after the declaration date counting as less than 4 months old. Where the case has no appraisal recorded, 21 calendar days are added to the evidence window; where the appraisal is at least the plan''s appraisal validity in months old, 14 calendar days are added; where it is at least 4 and less than the plan''s appraisal validity in months old, 7 calendar days are added; where it is less than 4 months old, nothing is added. The unrepaid property-charge advances are the advances recorded on the loan''s property charge repayment arrangement less the repayments recorded on it. Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan''s Summit Tax and Insurance Reserve is not active, 7 calendar days are taken off the evidence window; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 3 calendar days are taken off; where there are none, or that reserve is active, nothing is taken off.'
