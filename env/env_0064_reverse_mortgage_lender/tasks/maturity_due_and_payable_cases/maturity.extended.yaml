  - charge_cut: K('charge_cut_high') if (unrepaid_advances > K('charge_threshold') and reserve_status != 'active') else (K('charge_cut_low') if (unrepaid_advances > 0 and unrepaid_advances <= K('charge_threshold') and reserve_status != 'active') else 0)
  - result: MX(1, clock_start_offset + evidence_window + appraisal_allowance - charge_cut)
