    note: The most recent inspection finding on the borrower's occupancy profile picks the counting convention.
  compute:
  - mailing_date: NOW
  - supported_requests: COUNT('maturity_requests', request_type='extension_request', request_status='received', evidence_type='listing_agreement') + COUNT('maturity_requests', request_type='extension_request', request_status='received', evidence_type='financing_commitment')
  - declaration_day: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='intent_declaration', request_status='accepted')
  - recorded_intent: LATEST('maturity_requests', 'stated_intent', date_field='created_at', request_type='intent_declaration', request_status='accepted', request_date=declaration_day)
  - base_count: K('window_days_supported') if (supported_requests > 0 and (recorded_intent == 'sell_property' or recorded_intent == 'retain_property')) else (K('window_days_declared') if (supported_requests == 0 and (recorded_intent == 'sell_property' or recorded_intent == 'retain_property')) else P('successor_response_days'))
  - appraisal_age_months: MONTHS(F('appraisal_date'), mailing_date) if (F('appraisal_date') != None and F('appraisal_date') != '') else None
  - appraisal_days: K('appraisal_days_missing') if appraisal_age_months == None else (K('appraisal_days_stale') if appraisal_age_months >= P('appraisal_valid_months') else (K('appraisal_days_aging') if appraisal_age_months >= K('aging_appraisal_months') else 0))
  - advances_recorded: XSUM('propcharge', 'propcharge_transactions', 'amount', event_type='propcharge_advance')
  - repayments_recorded: XSUM('propcharge', 'propcharge_transactions', 'amount', event_type='propcharge_repayment')
  - unrepaid_advances: RND(advances_recorded - repayments_recorded, 2)
  - reserve_status: CFIELD('setaside', 'status', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id'))
  - charge_days: K('charge_days_high') if (unrepaid_advances > K('charge_threshold') and reserve_status != 'active') else (K('charge_days_low') if (unrepaid_advances > 0 and unrepaid_advances <= K('charge_threshold') and reserve_status != 'active') else 0)
