- id: maturity_resolution
  subject:
  - maturity_resolved
  rule: 'A case is resolved only when a payoff case on the loan has reached satisfied status, or when foreclosure
    counsel reports the foreclosure sale completed, per resolution_evidence. The resolution_type follows the satisfied
    payoff case''s plan: Borrower Voluntary Payoff, HECM-to-HECM Refinance Payoff and Heir Retention Payoff give
    paid_in_full, Estate Market Sale Payoff gives sale, Approved Short Sale Payoff gives short_sale and Deed in
    Lieu of Foreclosure gives deed_in_lieu; a completed foreclosure sale gives foreclosure_sale. The closed_date
    is the payoff case''s satisfaction date or the foreclosure sale date. The resolution_type is always one of resolution_types.'
  eligibility:
  - id: payoff_satisfied
    applies_to:
    - maturity_resolved
    kind: state
    condition: A case is resolved only when a payoff case on the loan has reached satisfied status, or when foreclosure
      counsel reports the foreclosure sale completed, per resolution_evidence.
    evidence_fields:
    - payoff_cases.status
    - payoff_cases.payoff_case_id
    - payoff_cases.variant_name
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    state_contract:
      field: payoff_cases.status
      allowed:
      - satisfied
- id: maturity_deferral
  subject:
  - maturity_deferred
  rule: Only a death case can be deferred, per deferral_eligible, and only on a HECM loan. A death case is deferred
    instead of called due only when the loan names a non-borrowing spouse whose profile_type is eligible_non_borrowing_spouse
    and that spouse still occupies the home and has established a legal right to remain within the HECM deferral
    window. While deferred, the case stays open without a call due; the deferral ends on any of deferral_end_events,
    after which the case is called due on the day the ending event is documented. An ineligible non-borrowing spouse,
    or a spouse who married the borrower after closing, never defers the case and may only resolve it like any successor.
  eligibility:
  - id: eligible_spouse
    applies_to:
    - maturity_deferred
    kind: authorization
    condition: A death case is deferred instead of called due only when the loan names a non-borrowing spouse whose
      profile_type is eligible_non_borrowing_spouse and that spouse still occupies the home and has established
      a legal right to remain within the HECM deferral window.
    evidence_fields:
    - hecm_loans.nbs_customer_id
    - customers.profile_type
    - hecm_loans.hecm_loan_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
  params:
    per_tier:
      Death of Last Surviving Borrower:
        deferral_eligible: =deferral_eligible
      Sale or Title Transfer:
        deferral_eligible: =deferral_eligible
      Extended Health-Care Absence:
        deferral_eligible: =deferral_eligible
      Principal Residence Change:
        deferral_eligible: =deferral_eligible
      Property Charge Default:
        deferral_eligible: =deferral_eligible
      Property Condition Default:
        deferral_eligible: =deferral_eligible
extended_policies:
- id: maturity_ext_successor_runway
  base_policy_refs:
  - maturity_agg_multi_holding
  - maturity_case_opening
  overwrite:
  - base_policy: maturity_agg_multi_holding
    superseded_clause: if the new event ranks higher in supersede_priority than the case's current event type, the case is reclassified to the new event type and event_date while keeping its status and deadlines, and from then on the new type's parameters govern (a death or sale removes any cure option)
    replaced_by: When another documented maturity event occurs on a loan whose case is open and the new event ranks higher in supersede priority than the case's current event type, the case is reclassified to the new event type and event date while keeping its status and deadlines, and from then on the new type's parameters govern, a death or sale removing any cure option; where the death of the last surviving borrower supersedes another maturity event on a Summit loan's open case, and only for such a case, the case is reclassified to the Death of Last Surviving Borrower plan with the date of death as its event date, keeps its status and its response deadline, has its resolution deadline carried forward by the successor runway days this policy computes, and from then on is governed by the death plan's parameters with no cure option.
  trigger: state_due
  subject:
  - maturity_case_reclassified
  computes: runway_days_added
  target_tool: reclassify_case_to_death_eeacbce3
  params:
    runway_days_standard: 30
    runway_days_household: 60
    runway_days_vacant: 20
    prompt_report_days: 10
    late_report_days: 30
    equity_strong_pct: 50
    equity_moderate_pct: 80
    equity_days_strong: 15
    equity_days_moderate: 7
    charge_threshold: 2000.0
    charge_days_high: 10
    charge_days_low: 5
    underway_days_supported: 7
    underway_days_declared: 3
  rule: 'When another documented maturity event occurs on a loan whose case is open and the new event ranks higher in supersede priority than the case''s current event type, the case is reclassified to the new event type and event date while keeping its status and deadlines, and from then on the new type''s parameters govern, a death or sale removing any cure option; where the death of the last surviving borrower supersedes another maturity event on a Summit loan''s open case, and only for such a case, the case is reclassified to the Death of Last Surviving Borrower plan with the date of death as its event date, keeps its status and its response deadline, has its resolution deadline carried forward by the successor runway days this policy computes, and from then on is governed by the death plan''s parameters with no cure option. The date of death, the date the death was documented and any earlier telephone report of the death are read from the death notices on the borrower''s occupancy profile; the accepted death notice is the one that documents the death. Where more than one accepted death notice is on the profile, the one received most recently documents the death, and among accepted notices received on the same day the one recorded later by its recorded date and time. The successor runway days are the calendar days from the current resolution deadline to the runway end date, or zero when the current resolution deadline already falls on or after the runway end date, as a whole number of calendar days. The runway end date is the runway start date plus the runway length, and the runway length is the base runway length with every addition made and every deduction taken; the additions and deductions change only the runway length, never the runway start date. As standard, the runway starts on the date the accepted death notice was received, the base runway length is 30 calendar days, and nothing is added to or taken off the runway length. Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding. The base runway length is set by the most recent occupancy inspection finding on the borrower''s occupancy profile: where that finding is that the home is occupied by someone other than a borrower, the base runway length is 60 calendar days; where that finding is that the home is vacant, the base runway length is 20 calendar days; any other finding, or no inspection finding at all, leaves the base runway length at 30 calendar days. The runway start date depends on how the death reached Cedarline: where the death was first reported by telephone and the accepted death notice was received no more than 10 calendar days after that telephone report, the runway starts on the date of the telephone report; where no telephone report was made and the accepted death notice was received more than 30 calendar days after the date of death, the runway starts 30 calendar days after the date of death; in every other case the runway starts on the date the accepted death notice was received. The case''s as-is appraised value is the appraised value recorded on the case. The equity share is the Summit loan balance divided by the case''s as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file. Where the equity share is no more than 50, 15 calendar days are added to the runway length; where it is more than 50 and no more than 80, 7 calendar days are added; where it is more than 80, nothing is added. The unrepaid property-charge advances are the advances recorded on the loan''s property charge repayment arrangement less the repayments recorded on it. Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan''s Summit Tax and Insurance Reserve is not active, 10 calendar days are taken off the runway length; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 5 calendar days are taken off; where there are none, or that reserve is active, nothing is taken off. Among accepted intent declarations made on the same day, the most recent is the one recorded later by its recorded date and time. Where the case already carries a received extension request supported by a listing agreement or a financing commitment and the most recent accepted intent declaration on the case declares a sale or a retention of the property, 7 calendar days are taken off the runway length; where that declaration declares a sale or a retention but the case carries no such request, 3 calendar days are taken off; otherwise nothing is taken off.'
  prerequisite: []
  cross_category:
  - category: residency
    as: history
    reads:
    - residency_submissions.received_date
    - residency_submissions.event_date
    - residency_submissions.submission_channel
    - residency_events.inspection_outcome
    note: The runway length and the runway start date are decided from the borrower's occupancy-profile death notices and inspection findings.
  - category: jumbo
    as: branch
    reads:
    - principal_balance
    note: The Summit loan balance sets the equity share that adds runway days.
  - category: propcharge
    as: history
    reads:
    - propcharge_transactions.amount
    note: Advances less repayments on the repayment arrangement give the unrepaid property-charge advances.
  - category: setaside
    as: branch
    reads:
    - status
    note: Whether the Summit Tax and Insurance Reserve is still active decides whether unrepaid advances take runway days off.
  compute:
  - deadline_now: F('resolution_deadline')
  - documented_notice_date: XLATEST('residency', 'residency_submissions', 'received_date', date_field='received_date', submission_type='death_notice', review_status='accepted')
  - date_of_death: XLATEST('residency', 'residency_submissions', 'event_date', date_field='created_at', submission_type='death_notice', review_status='accepted', received_date=documented_notice_date)
  - phone_report_date: XLATEST('residency', 'residency_submissions', 'received_date', date_field='received_date', submission_type='death_notice', submission_channel='phone')
  - runway_start_offset: DAYS(deadline_now, phone_report_date) if (phone_report_date != None and DAYS(phone_report_date, documented_notice_date) >= 0 and DAYS(phone_report_date, documented_notice_date) <= K('prompt_report_days')) else (DAYS(deadline_now, date_of_death) + K('late_report_days') if (phone_report_date == None and DAYS(date_of_death, documented_notice_date) > K('late_report_days')) else DAYS(deadline_now, documented_notice_date))
  - inspection_day: XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result')
  - last_inspection_finding: '''occupied_by_others'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''occupied_by_others'') > 0 else (''vacant'' if XCOUNT(''residency'', ''residency_events'', event_type=''residency_inspection_result'', effective_date=inspection_day, inspection_outcome=''vacant'') > 0 else XLATEST(''residency'', ''residency_events'', ''inspection_outcome'', date_field=''effective_date'', event_type=''residency_inspection_result''))'
  - base_runway_length: K('runway_days_household') if last_inspection_finding == 'occupied_by_others' else (K('runway_days_vacant') if last_inspection_finding == 'vacant' else K('runway_days_standard'))
  - case_appraised_value: float(F('appraised_value') or 0)
  - loan_balance: CFIELD('jumbo', 'principal_balance', jumbo_loan_id=F('jumbo_loan_id'))
  - equity_share: RND(float(loan_balance) / case_appraised_value * 100, 2) if (loan_balance != None and case_appraised_value > 0) else 100.0
  - equity_days: K('equity_days_strong') if equity_share <= K('equity_strong_pct') else (K('equity_days_moderate') if equity_share <= K('equity_moderate_pct') else 0)
  - advances_recorded: XSUM('propcharge', 'propcharge_transactions', 'amount', event_type='propcharge_advance')
  - repayments_recorded: XSUM('propcharge', 'propcharge_transactions', 'amount', event_type='propcharge_repayment')
  - unrepaid_advances: RND(advances_recorded - repayments_recorded, 2)
  - reserve_status: CFIELD('setaside', 'status', variant_name='Summit Tax and Insurance Reserve', jumbo_loan_id=F('jumbo_loan_id'))
  - charge_days: K('charge_days_high') if (unrepaid_advances > K('charge_threshold') and reserve_status != 'active') else (K('charge_days_low') if (unrepaid_advances > 0 and unrepaid_advances <= K('charge_threshold') and reserve_status != 'active') else 0)
  - supported_requests: COUNT('maturity_requests', request_type='extension_request', request_status='received', evidence_type='listing_agreement') + COUNT('maturity_requests', request_type='extension_request', request_status='received', evidence_type='financing_commitment')
  - declaration_day: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='intent_declaration', request_status='accepted')
  - recorded_intent: LATEST('maturity_requests', 'stated_intent', date_field='created_at', request_type='intent_declaration', request_status='accepted', request_date=declaration_day)
  - underway_days: K('underway_days_supported') if (supported_requests > 0 and (recorded_intent == 'sell_property' or recorded_intent == 'retain_property')) else (K('underway_days_declared') if (supported_requests == 0 and (recorded_intent == 'sell_property' or recorded_intent == 'retain_property')) else 0)
  - result: MX(0, runway_start_offset + base_runway_length + equity_days - charge_days - underway_days)
  compute_basis:
    deadline_now: The successor runway days are the calendar days from the current resolution deadline to the runway end date
    documented_notice_date: The date of death, the date the death was documented and any earlier telephone report of the death are read from the death notices on the borrower's occupancy profile; the accepted death notice is the one that documents the death.
    date_of_death: Where more than one accepted death notice is on the profile, the one received most recently documents the death, and among accepted notices received on the same day the one recorded later by its recorded date and time.
    phone_report_date: The date of death, the date the death was documented and any earlier telephone report of the death are read from the death notices on the borrower's occupancy profile; the accepted death notice is the one that documents the death.
    runway_start_offset: 'The runway start date depends on how the death reached Cedarline: where the death was first reported by telephone and the accepted death notice was received no more than 10 calendar days after that telephone report, the runway starts on the date of the telephone report; where no telephone report was made and the accepted death notice was received more than 30 calendar days after the date of death, the runway starts 30 calendar days after the date of death; in every other case the runway starts on the date the accepted death notice was received.'
    inspection_day: Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding.
    last_inspection_finding: The base runway length is set by the most recent occupancy inspection finding on the borrower's occupancy profile
    base_runway_length: where that finding is that the home is occupied by someone other than a borrower, the base runway length is 60 calendar days; where that finding is that the home is vacant, the base runway length is 20 calendar days; any other finding, or no inspection finding at all, leaves the base runway length at 30 calendar days.
    case_appraised_value: The case's as-is appraised value is the appraised value recorded on the case.
    loan_balance: The equity share is the Summit loan balance divided by the case's as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file.
    equity_share: The equity share is the Summit loan balance divided by the case's as-is appraised value, multiplied by 100 and rounded half up to two decimal places, and it is taken as 100 when the case has no appraisal recorded or no Summit loan balance is on file.
    equity_days: Where the equity share is no more than 50, 15 calendar days are added to the runway length; where it is more than 50 and no more than 80, 7 calendar days are added; where it is more than 80, nothing is added.
    advances_recorded: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it.
    repayments_recorded: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it.
    unrepaid_advances: The unrepaid property-charge advances are the advances recorded on the loan's property charge repayment arrangement less the repayments recorded on it.
    reserve_status: Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan's Summit Tax and Insurance Reserve is not active
    charge_days: Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan's Summit Tax and Insurance Reserve is not active, 10 calendar days are taken off the runway length; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 5 calendar days are taken off; where there are none, or that reserve is active, nothing is taken off.
    supported_requests: Where the case already carries a received extension request supported by a listing agreement or a financing commitment and the most recent accepted intent declaration on the case declares a sale or a retention of the property
    declaration_day: Among accepted intent declarations made on the same day, the most recent is the one recorded later by its recorded date and time.
    recorded_intent: and the most recent accepted intent declaration on the case declares a sale or a retention of the property
    underway_days: Where the case already carries a received extension request supported by a listing agreement or a financing commitment and the most recent accepted intent declaration on the case declares a sale or a retention of the property, 7 calendar days are taken off the runway length; where that declaration declares a sale or a retention but the case carries no such request, 3 calendar days are taken off; otherwise nothing is taken off.
    result: The successor runway days are the calendar days from the current resolution deadline to the runway end date, or zero when the current resolution deadline already falls on or after the runway end date, as a whole number of calendar days. The runway end date is the runway start date plus the runway length, and the runway length is the base runway length with every addition made and every deduction taken; the additions and deductions change only the runway length, never the runway start date.
  factors:
  - id: household_runway
    effect: parameter
    decides: base_runway_length
    bindings:
    - inspection_day
    - last_inspection_finding
    - base_runway_length
    ladder:
    - when: the most recent occupancy inspection finding on the borrower's occupancy profile is that the home is occupied by someone other than a borrower
      value: K('runway_days_household') = 60 calendar days of base runway length
    - when: the most recent occupancy inspection finding is that the home is vacant
      value: K('runway_days_vacant') = 20 calendar days of base runway length
    - when: otherwise (any other finding, or no inspection finding)
      value: K('runway_days_standard') = 30 calendar days of base runway length
    baseline:
      base_runway_length: K('runway_days_standard')
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: report_anchor
    effect: method
    decides: runway_start_offset
    bindings:
    - documented_notice_date
    - date_of_death
    - phone_report_date
    - runway_start_offset
    ladder:
    - when: the death was first reported by telephone AND the accepted death notice was received no more than 10 calendar days after that telephone report
      method: the runway starts on the date of the telephone report
    - when: no telephone report was made AND the accepted death notice was received more than 30 calendar days after the date of death
      method: the runway starts 30 calendar days after the date of death
    - when: otherwise
      method: the runway starts on the date the accepted death notice was received
    baseline:
      runway_start_offset: DAYS(deadline_now, documented_notice_date)
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: residency
  - id: equity_runway
    effect: parameter
    decides: equity_days
    bindings:
    - loan_balance
    - equity_share
    - equity_days
    ladder:
    - when: the equity share (Summit loan balance as a percentage of the as-is appraised value) is no more than 50
      value: K('equity_days_strong') = 15 calendar days added to the runway length
    - when: the equity share is more than 50 and no more than 80
      value: K('equity_days_moderate') = 7 calendar days added to the runway length
    - when: otherwise (more than 80, or no appraisal or no Summit loan balance recorded, the share then being taken as 100)
      value: 0 calendar days added to the runway length
    baseline:
      equity_days: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: charge_runway
    effect: parameter
    decides: charge_days
    bindings:
    - advances_recorded
    - repayments_recorded
    - unrepaid_advances
    - reserve_status
    - charge_days
    ladder:
    - when: the unrepaid property-charge advances exceed 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_days_high') = 10 calendar days taken off the runway length
    - when: the unrepaid property-charge advances are more than zero and no more than 2,000.00 dollars AND the Summit Tax and Insurance Reserve is not active
      value: K('charge_days_low') = 5 calendar days taken off the runway length
    - when: otherwise (no unrepaid advances, or the reserve is active)
      value: 0 calendar days taken off the runway length
    baseline:
      charge_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: setaside
  - id: underway_runway
    effect: parameter
    decides: underway_days
    bindings:
    - supported_requests
    - declaration_day
    - recorded_intent
    - underway_days
    ladder:
    - when: the case carries a received extension request supported by a listing agreement or a financing commitment AND the most recent accepted intent declaration on the case declares a sale or a retention of the property
      value: K('underway_days_supported') = 7 calendar days taken off the runway length
    - when: the case carries no such request AND the most recent accepted intent declaration on the case declares a sale or a retention of the property
      value: K('underway_days_declared') = 3 calendar days taken off the runway length
    - when: otherwise
      value: 0 calendar days taken off the runway length
    baseline:
      underway_days: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The successor runway days are the calendar days from the current resolution deadline to the runway end date, or zero when the current resolution deadline already falls on or after the runway end date, as a whole number of calendar days. The runway end date is the runway start date plus the runway length, and the runway length is the base runway length with every addition made and every deduction taken; the additions and deductions change only the runway length, never the runway start date. As standard, the runway starts on the date the accepted death notice was received, the base runway length is 30 calendar days, and nothing is added to or taken off the runway length.
    params:
    - runway_days_standard
  inputs:
    history:
    - category: residency
      table: residency_submissions
      aggregate: latest
      field: received_date
      filters:
        submission_type: death_notice
    - category: residency
      table: residency_events
      aggregate: latest
      field: inspection_outcome
      filters:
        event_type: residency_inspection_result
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: propcharge_advance
    - category: propcharge
      table: propcharge_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: propcharge_repayment
    - table: maturity_requests
      aggregate: count
      field: maturity_request_id
      filters:
        request_type: extension_request
        request_status: received
    cross_category:
    - residency
    - jumbo
    - propcharge
    - setaside
- id: maturity_ext_successor_response_window
  base_policy_refs:
  - maturity_notices
  - maturity_call_due
  - maturity_intent_appraisal
  overwrite:
  - base_policy: maturity_notices
    superseded_clause: On the day the loan is called due, and in no case later than due_and_payable_notice_days calendar days after it, a due_and_payable_notice and a successor_options_letter go to each recipient named by the plan's notice_recipients, by notice_delivery_method; the options letter lists the plan's intent_options and the response window.
    replaced_by: A due-and-payable notice and a successor options letter go to each recipient named by the plan on the day the loan is called due, and in no case later than the plan's notice period after it, by the plan's delivery method, and the options letter lists the plan's intent options and the response window; for a Summit loan's case reclassified to the death of the last surviving borrower, and only for such a case, the two notices go to each successor in interest of the deceased borrower by first-class and certified mail, and the options letter lists the death plan's intent options and the successor response window this policy computes.
  - base_policy: maturity_call_due
    superseded_clause: response_deadline is successor_response_days calendar days after that day, because the due-and-payable notice is sent the same day
    replaced_by: When the loan is called due, the case's response deadline is the plan's successor response days calendar days after that day, because the due-and-payable notice is sent the same day; for a Summit loan's case reclassified to the death of the last surviving borrower, and only for such a case, the response deadline becomes the mailing date of the successor's notices plus the successor response window this policy computes.
  - base_policy: maturity_notices
    superseded_clause: Each notice type goes to each recipient once per date.
    replaced_by: Each notice type goes to each recipient once per date; for the successor's due-and-payable notice and options letter on a Summit loan's case reclassified to the death of the last surviving borrower, and only for that pair, the two notices go together to each successor once per date and the pair is identified by the case and the successor.
  trigger: state_due
  subject:
  - maturity_notice_sent
  computes: response_window_days
  target_tool: mail_successor_due_notices_bb6e23d7
  params:
    window_days_supported: 21
    window_days_declared: 25
    aging_appraisal_months: 4
    appraisal_days_missing: 15
    appraisal_days_stale: 10
    appraisal_days_aging: 5
    charge_threshold: 2000.0
    charge_days_high: 5
    charge_days_low: 2
    monday_reference: '2026-01-05'
  rule: 'A due-and-payable notice and a successor options letter go to each recipient named by the plan on the day the loan is called due, and in no case later than the plan''s notice period after it, by the plan''s delivery method, and the options letter lists the plan''s intent options and the response window; for a Summit loan''s case reclassified to the death of the last surviving borrower, and only for such a case, the two notices go to each successor in interest of the deceased borrower by first-class and certified mail, and the options letter lists the death plan''s intent options and the successor response window this policy computes. When the loan is called due, the case''s response deadline is the plan''s successor response days calendar days after that day, because the due-and-payable notice is sent the same day; for a Summit loan''s case reclassified to the death of the last surviving borrower, and only for such a case, the response deadline becomes the mailing date of the successor''s notices plus the successor response window this policy computes. Each notice type goes to each recipient once per date; for the successor''s due-and-payable notice and options letter on a Summit loan''s case reclassified to the death of the last surviving borrower, and only for that pair, the two notices go together to each successor once per date and the pair is identified by the case and the successor. The successor''s due-and-payable notice and options letter are not mailed, and the successor response window is not counted, until the case''s event type is the death of the last surviving borrower. The successor response window is the number of calendar days from the mailing date to the successor response deadline, as a whole number of calendar days. The window count is the base count with every addition made and every deduction taken, all of them made before the count is turned into calendar days, and the successor response deadline is the day reached by counting the window count forward from the mailing date under the counting convention, the day after mailing being the first day counted. As standard, the base count is the death plan''s successor response days, nothing is added to or taken off the window count, and the counting convention counts calendar days with no move. Among accepted intent declarations made on the same day, the most recent is the one recorded later by its recorded date and time. The base count is set by the sale already under way on the case: where the case carries a received extension request supported by a listing agreement or a financing commitment and the most recent accepted intent declaration on the case declares a sale or a retention of the property, the base count is 21 days; where that declaration declares a sale or a retention but the case carries no such request, the base count is 25 days; otherwise the base count is the death plan''s successor response days. The age of the case''s as-is appraisal is the number of whole calendar months from the appraisal date to the mailing date, an appraisal dated after the mailing date counting as less than 4 months old. Where the case has no appraisal recorded, 15 days are added to the window count; where the appraisal is at least the plan''s appraisal validity in months old, 10 days are added; where it is at least 4 and less than the plan''s appraisal validity in months old, 5 days are added; where it is less than 4 months old, nothing is added. The unrepaid property-charge advances are the advances recorded on the loan''s property charge repayment arrangement less the repayments recorded on it. Where the unrepaid property-charge advances exceed 2,000.00 dollars and the loan''s Summit Tax and Insurance Reserve is not active, 5 days are taken off the window count; where they are more than zero and no more than 2,000.00 dollars and that reserve is not active, 2 days are taken off; where there are none, or that reserve is active, nothing is taken off. Where two occupancy inspection findings carry the same most recent date, a finding that the home is occupied by someone other than a borrower prevails over a finding that it is vacant, and a vacant finding prevails over any other finding. The counting convention follows the most recent occupancy inspection finding on the borrower''s occupancy profile: where that finding is that the home is occupied by someone other than a borrower, the household living there is given working days, so the window count is counted in business days, each Monday to Friday after the mailing date counting as one day and Saturdays and Sundays being skipped, and the window is the calendar days from the mailing date to the last business day so counted; where that finding is that the home is vacant, the window count is counted in calendar days and an end that falls on a Saturday or a Sunday moves to the following Monday; any other finding, or no inspection finding at all, counts the window count in calendar days with no move. Federal holidays are counted like any other weekday.'
