    kind: state_gate
    gate: maturity_cases.variant_name
    form: state
    policy_source: The successor's due-and-payable notice and options letter are not mailed, and the successor response window is not counted, until the case's event type is the death of the last surviving borrower.
    condition: The Summit case's variant_name reads Death of Last Surviving Borrower, the case having been reclassified from the event it was opened for after the borrower's documented death.
