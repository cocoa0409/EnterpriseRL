  compute:
  - declaration_date: NOW
  - supported_requests: COUNT('maturity_requests', request_type='extension_request', request_status='received', evidence_type='listing_agreement') + COUNT('maturity_requests', request_type='extension_request', request_status='received', evidence_type='financing_commitment')
  - declaration_day: LATEST('maturity_requests', 'request_date', date_field='request_date', request_type='intent_declaration', request_status='accepted')
  - recorded_intent: LATEST('maturity_requests', 'stated_intent', date_field='created_at', request_type='intent_declaration', request_status='accepted', request_date=declaration_day)
  - evidence_window: K('evidence_days_supported') if (supported_requests > 0 and (recorded_intent == 'sell_property' or recorded_intent == 'retain_property')) else (K('evidence_days_declared') if (supported_requests == 0 and (recorded_intent == 'sell_property' or recorded_intent == 'retain_property')) else K('evidence_days_standard'))
  - response_deadline_now: F('response_deadline')
  - resolution_deadline_now: F('resolution_deadline')
  - latest_grant_date: LATEST('maturity_case_events', 'effective_date', date_field='effective_date', event_type='maturity_extension_granted')
  - clock_start_offset: DAYS(declaration_date, latest_grant_date) if (F('status') == 'extension_period' and latest_grant_date != None) else (0 if (response_deadline_now == None or response_deadline_now == '') else (0 if (F('status') != 'extension_period' and resolution_deadline_now != None and resolution_deadline_now != '' and DAYS(response_deadline_now, resolution_deadline_now) <= K('short_runway_days')) else DAYS(declaration_date, response_deadline_now)))
  - appraisal_age_months: MONTHS(F('appraisal_date'), declaration_date) if (F('appraisal_date') != None and F('appraisal_date') != '') else None
