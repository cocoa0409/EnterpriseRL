- id: payoff_ext_sale_daily_accrual
  base_policy_refs:
  - payoff_statement_terms
  - payoff_sale_review
  overwrite:
  - base_policy: payoff_statement_terms
    superseded_clause: The per diem is the loan balance on the statement date times the loan's note rate plus, for a HECM, the annual MIP rate, divided
      by per_diem_day_count, rounded half up to the cent
    replaced_by: For an Approved Short Sale Payoff requested by the borrower of record, and only for such a payoff, the per diem is the short-sale daily
      accrual; every payoff case other than such a short-sale payoff and a retention payoff keeps its per diem as the loan balance on the statement date
      times the loan's note rate plus, for a HECM, the annual MIP rate, divided by per_diem_day_count, rounded half up to the cent.
  trigger: on_request
  subject:
  - payoff_terms_issued
  computes: per_diem_amount
  target_tool: record_sale_daily_accrual_1c6aaad4
  params:
    appraisal_fee_standard: 475.0
    appraisal_fee_condo_manufactured: 550.0
    appraisal_fee_two_to_four: 650.0
    update_appraisal_fee: 295.0
    replacement_appraisal_fee: 395.0
    securing_fee_vacant: 285.0
    securing_fee_unconfirmed: 85.0
    maintenance_flat_association: 120.0
    maintenance_monthly: 55.0
    foreclosure_charges_full: 2525.0
    foreclosure_charges_initial: 875.0
    first_legal_action_days: 30
  rule: 'This policy sets the short-sale daily accrual, the per diem recorded on the payoff case of an Approved Short Sale Payoff requested by the borrower
    of record. For an Approved Short Sale Payoff requested by the borrower of record, and only for such a payoff, the per diem is the short-sale daily accrual;
    every payoff case other than such a short-sale payoff and a retention payoff keeps its per diem as the loan balance on the statement date times the
    loan''s note rate plus, for a HECM, the annual MIP rate, divided by per_diem_day_count, rounded half up to the cent. Under the standard rule, the short-sale
    daily accrual is the short-sale accrual basis times the loan''s daily accrual rate, rounded half up to the cent and only at that last step. The loan''s
    daily accrual rate for a short sale is its note_rate_pct plus, for a HECM, the annual_mip_rate_pct of its payout plan, divided by 100 and by per_diem_day_count;
    a Summit loan carries no MIP. The short-sale accrual basis is the loan''s principal_balance plus six carried advances: the short-sale set-aside carry,
    the short-sale securing carry, the short-sale maintenance carry, the short-sale called-due appraisal carry, the short-sale replacement appraisal carry
    and the short-sale foreclosure carry. Under the standard rule the short-sale set-aside carry, the short-sale securing carry, the short-sale maintenance
    carry, the short-sale replacement appraisal carry and the short-sale foreclosure carry are each 0.00, and the short-sale called-due appraisal carry
    is appraisal_fee_standard. The short-sale set-aside carry is instead figured from the set-aside on the loan that pays its property charges: for a loan
    with an active Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale bills, limited to
    its setaside_balance; for a loan with an active Summit Tax and Insurance Reserve it is the sum of that reserve''s short-sale bills in full, because
    the reserve''s shortfall_source pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00. A short-sale bill is,
    for each of property_tax_bill, hazard_insurance_bill and flood_insurance_bill, the received bill of that type on the set-aside with the latest due_date,
    when its payment date falls no later than statement_good_through_days calendar days after the statement date; a bill''s payment date is its due_date
    less the set-aside plan''s tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days for a hazard or flood bill, and a type with
    no received bill adds nothing. Where several such bills of one type share that latest due_date, their billed_amounts are taken together as that type''s
    bill. The short-sale securing carry is instead securing_fee_vacant when the latest residency_inspection_result on the loan''s occupancy profile found
    the home vacant and securing_fee_unconfirmed when that result was unable_to_determine, in each case only where the maturity case''s plan has vacant_property_securing
    true; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00. The short-sale maintenance carry is instead figured
    from the latest residency_inspection_result on the loan''s occupancy profile, and only where the maturity case''s plan has vacant_property_securing
    true: when that result found the home vacant and the loan''s property_type is fha_approved_condominium or planned_unit_development it is the flat maintenance_flat_association;
    when it found the home vacant and the property is of any other type, or is a Summit loan, which records no property_type, it is maintenance_monthly
    for each short-sale month of vacancy; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00. The short-sale months
    of vacancy are the whole calendar months from the occupancy profile''s nonoccupancy_date to the statement date, not below 0, plus one; a profile with
    no nonoccupancy_date counts one month. The short-sale called-due appraisal carry is instead appraisal_fee_two_to_four for a two_to_four_unit property
    and appraisal_fee_condo_manufactured for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan, keeps appraisal_fee_standard.
    The short-sale replacement appraisal carry is instead update_appraisal_fee when the maturity case''s appraisal_date falls on or after the effective_date
    of the case''s latest maturity_extension_granted entry and no more than the case plan''s appraisal_order_days calendar days after it, and replacement_appraisal_fee
    when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case''s due_and_payable_date; a case with no appraisal_date,
    or whose appraisal falls within neither span, keeps 0.00. The short-sale foreclosure carry is instead foreclosure_charges_full when the maturity case''s
    status is foreclosure_referred and its referral_date is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial
    when its status is foreclosure_referred and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case
    in any other status keeps 0.00. Where several residency_inspection_result entries on the occupancy profile share the latest effective_date, a vacant
    finding among them counts as the latest result, and otherwise an unable_to_determine finding does.'
  prerequisite: []
  cross_category:
  - category: hecm
    as: read
    reads:
    - principal_balance
    - note_rate_pct
    - annual_mip_rate_pct
    - property_type
    note: Balance, rate and property type of a HECM.
  - category: jumbo
    as: read
    reads:
    - principal_balance
    - note_rate_pct
    note: Balance and rate of a Summit loan.
  - category: setaside
    as: branch
    reads:
    - variant_name
    - status
    - setaside_balance
    - tax_payment_lead_days
    - insurance_payment_lead_days
    - setaside_requests.due_date
    - setaside_requests.billed_amount
    note: The property-charge set-aside and its received bills decide the set-aside disbursement carry.
  - category: residency
    as: history
    reads:
    - residency_profile_id
    - nonoccupancy_date
    - residency_events.inspection_outcome
    note: The latest inspection result on the loan profile decides the securing and maintenance carries.
  - category: maturity
    as: history
    reads:
    - status
    - referral_date
    - appraisal_date
    - due_and_payable_date
    - vacant_property_securing
    - appraisal_order_days
    - maturity_case_events.effective_date
    note: The maturity case decides the appraisal, preservation and foreclosure carries.
  compute:
  - posted_balance: CFIELD('hecm', 'principal_balance', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('jumbo', 'principal_balance',
      jumbo_loan_id=F('jumbo_loan_id'))
  - note_rate: CFIELD('hecm', 'note_rate_pct', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('jumbo', 'note_rate_pct', jumbo_loan_id=F('jumbo_loan_id'))
  - mip_rate: CPARAM('hecm', 'annual_mip_rate_pct', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else 0
  - daily_rate: (note_rate + mip_rate) / 100 / P('per_diem_day_count')
  - ff_lesa_id: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Mandatory)', status='active') or CFIELD('setaside',
      'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Borrower-Elected)', status='active')
  - reserve_id: CFIELD('setaside', 'setaside_id', jumbo_loan_id=F('jumbo_loan_id'), variant_name='Summit Tax and Insurance Reserve', status='active')
  - sa_id: ff_lesa_id or reserve_id
  - sa_balance: CFIELD('setaside', 'setaside_balance', setaside_id=sa_id) if sa_id else 0
  - tax_lead: CPARAM('setaside', 'tax_payment_lead_days', setaside_id=sa_id) if sa_id else 0
  - ins_lead: CPARAM('setaside', 'insurance_payment_lead_days', setaside_id=sa_id) if sa_id else 0
  - tax_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='property_tax_bill', request_status='received')
      if sa_id else None
  - tax_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='property_tax_bill', request_status='received', due_date=tax_due)
      if sa_id and tax_due else 0
  - haz_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='hazard_insurance_bill', request_status='received')
      if sa_id else None
  - haz_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='hazard_insurance_bill', request_status='received',
      due_date=haz_due) if sa_id and haz_due else 0
  - fld_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='flood_insurance_bill', request_status='received')
      if sa_id else None
  - fld_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='flood_insurance_bill', request_status='received', due_date=fld_due)
      if sa_id and fld_due else 0
  - qualifying_bills: (tax_amt if tax_due and DAYS(NOW, tax_due) - tax_lead <= P('statement_good_through_days') else 0) + (haz_amt if haz_due and DAYS(NOW,
      haz_due) - ins_lead <= P('statement_good_through_days') else 0) + (fld_amt if fld_due and DAYS(NOW, fld_due) - ins_lead <= P('statement_good_through_days')
      else 0)
  - setaside_carry: MN(qualifying_bills, sa_balance) if ff_lesa_id else (qualifying_bills if reserve_id else 0)
  - se_profile: CFIELD('residency', 'residency_profile_id', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('residency', 'residency_profile_id',
      jumbo_loan_id=F('jumbo_loan_id'))
  - se_result: ('vacant' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='vacant', residency_profile_id=se_profile,
      effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result', residency_profile_id=se_profile))
      > 0 else ('unable_to_determine' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='unable_to_determine',
      residency_profile_id=se_profile, effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=se_profile)) > 0 else XLATEST('residency', 'residency_events', 'inspection_outcome', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=se_profile))) if se_profile else None
  - se_allowed: CPARAM('maturity', 'vacant_property_securing', maturity_case_id=F('maturity_case_id'))
  - securing_carry: K('securing_fee_vacant') if se_allowed and se_result == 'vacant' else (K('securing_fee_unconfirmed') if se_allowed and se_result ==
      'unable_to_determine' else 0)
  - ma_profile: CFIELD('residency', 'residency_profile_id', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('residency', 'residency_profile_id',
      jumbo_loan_id=F('jumbo_loan_id'))
  - ma_status: ('vacant' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='vacant', residency_profile_id=ma_profile,
      effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result', residency_profile_id=ma_profile))
      > 0 else ('unable_to_determine' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='unable_to_determine',
      residency_profile_id=ma_profile, effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=ma_profile)) > 0 else XLATEST('residency', 'residency_events', 'inspection_outcome', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=ma_profile))) if ma_profile else None
  - ma_allowed: CPARAM('maturity', 'vacant_property_securing', maturity_case_id=F('maturity_case_id'))
  - ma_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - ma_nonocc: CFIELD('residency', 'nonoccupancy_date', residency_profile_id=ma_profile) if ma_profile else None
  - ma_months: (MX(0, MONTHS(ma_nonocc, NOW)) if ma_nonocc else 0) + 1
  - maintenance_carry: K('maintenance_flat_association') if ma_allowed and ma_status == 'vacant' and (ma_type == 'fha_approved_condominium' or ma_type ==
      'planned_unit_development') else (K('maintenance_monthly') * ma_months if ma_allowed and ma_status == 'vacant' else 0)
  - dp_property_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - dp_appraisal_carry: K('appraisal_fee_two_to_four') if dp_property_type == 'two_to_four_unit' else (K('appraisal_fee_condo_manufactured') if dp_property_type
      == 'fha_approved_condominium' or dp_property_type == 'manufactured_home' else K('appraisal_fee_standard'))
  - appraisal_date: CFIELD('maturity', 'appraisal_date', maturity_case_id=F('maturity_case_id'))
  - called_due_date: CFIELD('maturity', 'due_and_payable_date', maturity_case_id=F('maturity_case_id'))
  - appraisal_order_days: CPARAM('maturity', 'appraisal_order_days', maturity_case_id=F('maturity_case_id'))
  - last_extension_date: XLATEST('maturity', 'maturity_case_events', 'effective_date', date_field='effective_date', event_type='maturity_extension_granted',
      maturity_case_id=F('maturity_case_id'))
  - replacement_carry: K('update_appraisal_fee') if appraisal_date and last_extension_date and DAYS(last_extension_date, appraisal_date) >= 0 and DAYS(last_extension_date,
      appraisal_date) <= appraisal_order_days else (K('replacement_appraisal_fee') if appraisal_date and called_due_date and DAYS(called_due_date, appraisal_date)
      > appraisal_order_days else 0)
  - maturity_status: CFIELD('maturity', 'status', maturity_case_id=F('maturity_case_id'))
  - referral_date: CFIELD('maturity', 'referral_date', maturity_case_id=F('maturity_case_id'))
  - referral_age: DAYS(referral_date, NOW) if referral_date else 0
  - foreclosure_carry: K('foreclosure_charges_full') if maturity_status == 'foreclosure_referred' and referral_age >= K('first_legal_action_days') else
      (K('foreclosure_charges_initial') if maturity_status == 'foreclosure_referred' else 0)
  - accrual_basis: posted_balance + setaside_carry + securing_carry + maintenance_carry + dp_appraisal_carry + replacement_carry + foreclosure_carry
  - result: RND(accrual_basis * daily_rate, 2)
  compute_basis:
    posted_balance: 'The short-sale accrual basis is the loan''s principal_balance plus six carried advances: the short-sale set-aside carry, the short-sale
      securing carry, the short-sale maintenance carry, the short-sale called-due appraisal carry, the short-sale replacement appraisal carry and the short-sale
      foreclosure carry.'
    note_rate: The loan's daily accrual rate for a short sale is its note_rate_pct plus, for a HECM, the annual_mip_rate_pct of its payout plan, divided
      by 100 and by per_diem_day_count; a Summit loan carries no MIP.
    mip_rate: The loan's daily accrual rate for a short sale is its note_rate_pct plus, for a HECM, the annual_mip_rate_pct of its payout plan, divided
      by 100 and by per_diem_day_count; a Summit loan carries no MIP.
    daily_rate: The loan's daily accrual rate for a short sale is its note_rate_pct plus, for a HECM, the annual_mip_rate_pct of its payout plan, divided
      by 100 and by per_diem_day_count; a Summit loan carries no MIP.
    ff_lesa_id: 'The short-sale set-aside carry is instead figured from the set-aside on the loan that pays its property charges: for a loan with an active
      Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale bills, limited to its setaside_balance;
      for a loan with an active Summit Tax and Insurance Reserve it is the sum of that reserve''s short-sale bills in full, because the reserve''s shortfall_source
      pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00.'
    reserve_id: 'The short-sale set-aside carry is instead figured from the set-aside on the loan that pays its property charges: for a loan with an active
      Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale bills, limited to its setaside_balance;
      for a loan with an active Summit Tax and Insurance Reserve it is the sum of that reserve''s short-sale bills in full, because the reserve''s shortfall_source
      pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00.'
    sa_id: 'The short-sale set-aside carry is instead figured from the set-aside on the loan that pays its property charges: for a loan with an active Fully
      Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale bills, limited to its setaside_balance;
      for a loan with an active Summit Tax and Insurance Reserve it is the sum of that reserve''s short-sale bills in full, because the reserve''s shortfall_source
