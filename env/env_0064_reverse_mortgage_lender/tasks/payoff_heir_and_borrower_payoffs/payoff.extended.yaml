    sa_balance: 'The short-sale set-aside carry is instead figured from the set-aside on the loan that pays its property charges: for a loan with an active
      Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale bills, limited to its setaside_balance;
      for a loan with an active Summit Tax and Insurance Reserve it is the sum of that reserve''s short-sale bills in full, because the reserve''s shortfall_source
      pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00.'
    tax_lead: A short-sale bill is, for each of property_tax_bill, hazard_insurance_bill and flood_insurance_bill, the received bill of that type on the
      set-aside with the latest due_date, when its payment date falls no later than statement_good_through_days calendar days after the statement date;
      a bill's payment date is its due_date less the set-aside plan's tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days for
      a hazard or flood bill, and a type with no received bill adds nothing. Where several such bills of one type share that latest due_date, their billed_amounts
      are taken together as that type's bill.
    ins_lead: A short-sale bill is, for each of property_tax_bill, hazard_insurance_bill and flood_insurance_bill, the received bill of that type on the
