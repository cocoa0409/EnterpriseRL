  factors:
  - id: short_sale_statement_setaside
    effect: method
    decides: statement_setaside
    bindings:
    - ff_lesa_id
    - reserve_id
    - sa_id
    - sa_balance
    - tax_lead
    - ins_lead
    - tax_due
    - tax_amt
    - haz_due
    - haz_amt
    - fld_due
    - fld_amt
    - qualifying_bills
    - statement_setaside
    ladder:
    - when: an active Fully Funded LESA (Mandatory or Borrower-Elected) on the loan
      method: sum the set-aside's short-sale statement bills and limit the sum to its setaside_balance
    - when: an active Summit Tax and Insurance Reserve on the loan
      method: sum the reserve's short-sale statement bills in full, the part above its balance being paid at once as a corporate advance
    - when: otherwise
      method: carry nothing (0.00)
    baseline:
      statement_setaside: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: setaside
  - id: short_sale_statement_fee
    effect: parameter
    decides: statement_fee
    bindings:
    - fee_option
    - rate_type
    - fee_period
    - fee_months
    - fee_per_month
    - statement_fee
    ladder:
    - when: HECM with monthly_fee_with_setaside and rate_type monthly_adjustable
      value: servicing_fee_monthly_adjustable per short-sale fee month still to post
    - when: HECM with monthly_fee_with_setaside and rate_type annual_adjustable or fixed
      value: servicing_fee_annual_or_fixed per short-sale fee month still to post
    - when: otherwise
      value: '0.00'
    baseline:
      statement_fee: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: hecm
  - id: short_sale_statement_preservation
    effect: method
    decides: statement_preservation
    bindings:
    - profile_id
    - inspection_result
    - securing_allowed
    - property_type
    - nonocc_date
    - vacancy_months
    - statement_preservation
    ladder:
    - when: securing permitted, latest inspection found the home vacant, fha_approved_condominium or planned_unit_development
      method: securing_fee_vacant plus the flat maintenance_flat_association
    - when: securing permitted, latest inspection found the home vacant, any other property type
      method: securing_fee_vacant plus maintenance_monthly times the months of vacancy
    - when: securing permitted, latest inspection unable_to_determine
      method: the flat securing_fee_unconfirmed
    - when: otherwise
      method: carry nothing (0.00)
    baseline:
      statement_preservation: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: residency
  - id: short_sale_statement_called_due_appraisal
    effect: parameter
    decides: statement_dp_appraisal
    bindings:
    - dp_property_type
    - statement_dp_appraisal
    ladder:
    - when: two_to_four_unit property
      value: appraisal_fee_two_to_four
    - when: fha_approved_condominium or manufactured_home property
      value: appraisal_fee_condo_manufactured
    - when: otherwise
      value: appraisal_fee_standard
    baseline:
      statement_dp_appraisal: K('appraisal_fee_standard')
    evidence:
    - cross_category
    cross_difficulty: hecm
  - id: short_sale_statement_replacement_appraisal
    effect: parameter
    decides: statement_replacement
    bindings:
    - appraisal_date
    - called_due_date
    - appraisal_order_days
    - last_extension_date
    - statement_replacement
    ladder:
    - when: appraisal dated within appraisal_order_days on or after the latest granted extension
      value: update_appraisal_fee
    - when: otherwise an appraisal dated more than appraisal_order_days after the due-and-payable date
      value: replacement_appraisal_fee
    - when: otherwise
      value: '0.00'
    baseline:
      statement_replacement: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: maturity
  - id: short_sale_statement_foreclosure
    effect: parameter
    decides: statement_foreclosure
    bindings:
    - maturity_status
    - referral_date
    - referral_age
    - statement_foreclosure
    ladder:
    - when: foreclosure_referred and referred at least first_legal_action_days before the statement date
      value: foreclosure_charges_full
    - when: foreclosure_referred and referred fewer days before
      value: foreclosure_charges_initial
    - when: otherwise
      value: '0.00'
    baseline:
      statement_foreclosure: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  baseline:
    rule: Under the standard rule, the short-sale statement balance is the loan's principal_balance plus the short-sale accrual charge plus six short-sale
      statement charges, the short-sale statement set-aside disbursement, the short-sale statement servicing fee, the short-sale statement preservation
      charge, the short-sale statement called-due appraisal charge, the short-sale statement replacement appraisal charge and the short-sale statement foreclosure
      charge, rounded half up to the cent and only at that last step. The short-sale accrual charge is the per diem the payoff case carries times the short-sale
      accrual days, which are the calendar days from the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a
      loan with no posted interest accrual, plus statement_good_through_days. Under the standard rule the short-sale statement called-due appraisal charge
      is appraisal_fee_standard and the other five short-sale statement charges are each 0.00.
    params:
    - statement_good_through_days
    - appraisal_fee_standard
  inputs:
    history:
    - category: hecm
      table: hecm_transactions
      aggregate: latest
      field: effective_date
      filters:
        event_type: hecm_interest_accrual
    - category: setaside
      table: setaside_requests
      aggregate: latest
      field: billed_amount
      filters:
        request_status: received
    - category: residency
      table: residency_events
      aggregate: latest
      field: inspection_outcome
      filters:
        event_type: residency_inspection_result
    - category: maturity
      table: maturity_case_events
      aggregate: latest
      field: effective_date
      filters:
        event_type: maturity_extension_granted
    cross_category:
    - hecm
    - jumbo
    - setaside
    - residency
    - maturity
- id: payoff_ext_sale_cost_allowance
  base_policy_refs:
  - payoff_statement_terms
  - payoff_sale_review
  overwrite:
  - base_policy: payoff_sale_review
    superseded_clause: The allowed closing costs are the commission up to max_commission_pct percent of the contract price plus other seller costs up to
      max_other_closing_costs_pct percent of the contract price; a contract whose costs exceed either cap is declined with reason closing_costs_exceed_limit
      unless resubmitted within the caps.
    replaced_by: The allowed closing costs are the commission up to max_commission_pct percent of the contract price plus other seller costs up to max_other_closing_costs_pct
      percent of the contract price, and a contract whose costs exceed either cap is declined with reason closing_costs_exceed_limit unless resubmitted
      within the caps; on the payoff case of an Approved Short Sale Payoff requested by the borrower of record the allowed closing costs are instead the
      short-sale commission allowance plus the short-sale other-cost allowance, and contract costs above them are left for the seller to cover rather than
      declined.
  - base_policy: payoff_sale_review
    superseded_clause: the required payoff amount is the contract price less the allowed closing costs, and the remaining balance is not collected per deficiency_waived.
    replaced_by: The required payoff amount is the contract price less the allowed closing costs, except that on the payoff case of an Approved Short Sale
      Payoff requested by the borrower of record it is the contract price less the allowed closing costs and less the short-sale closing deductions, and
      in either case the remaining balance is not collected per deficiency_waived.
  - base_policy: payoff_statement_terms
    superseded_clause: Reissued terms replace every figure and restart the good-through period, and are issued on request or when a new appraisal or revised
      contract is recorded.
    replaced_by: Reissued terms other than an approved retention payoff and a short-sale approval replace every figure and restart the good-through period,
      and every reissue is issued on request or when a new appraisal or revised contract is recorded; a short-sale approval on the payoff case of an Approved
      Short Sale Payoff requested by the borrower of record sets the contract price, the allowed closing costs, the required payoff amount and the appraised
      value basis and keeps the current statement's date, good-through date, statement balance and per diem.
  trigger: on_request
  subject:
  - payoff_terms_reissued
  computes: required_payoff_amount
  target_tool: approve_sale_closing_costs_11c6cfd9
  params:
    high_price_threshold: 1000000.0
    mid_price_threshold: 500000.0
    commission_pct_high_price: 5.0
    commission_pct_mid_price: 5.5
    other_cost_pct_multi_unit: 3.5
    other_cost_pct_association: 3.25
    release_recording_fee_per_instrument: 48.0
    postponement_fee_full: 450.0
    postponement_fee_initial: 250.0
    first_legal_action_days: 30
    marketing_pct_long: 0.75
    marketing_pct_mid: 0.5
    marketing_long_days: 180
    marketing_mid_days: 90
  rule: 'This policy sets the short-sale approval on the payoff case of an Approved Short Sale Payoff requested by the borrower of record: the contract
    price, the allowed closing costs, the required payoff amount and the appraised value basis, from the purchase contract submission on file for the case.
    The allowed closing costs are the commission up to max_commission_pct percent of the contract price plus other seller costs up to max_other_closing_costs_pct
    percent of the contract price, and a contract whose costs exceed either cap is declined with reason closing_costs_exceed_limit unless resubmitted within
    the caps; on the payoff case of an Approved Short Sale Payoff requested by the borrower of record the allowed closing costs are instead the short-sale
    commission allowance plus the short-sale other-cost allowance, and contract costs above them are left for the seller to cover rather than declined.
    The required payoff amount is the contract price less the allowed closing costs, except that on the payoff case of an Approved Short Sale Payoff requested
    by the borrower of record it is the contract price less the allowed closing costs and less the short-sale closing deductions, and in either case the
    remaining balance is not collected per deficiency_waived. Reissued terms other than an approved retention payoff and a short-sale approval replace every
    figure and restart the good-through period, and every reissue is issued on request or when a new appraisal or revised contract is recorded; a short-sale
    approval on the payoff case of an Approved Short Sale Payoff requested by the borrower of record sets the contract price, the allowed closing costs,
    the required payoff amount and the appraised value basis and keeps the current statement''s date, good-through date, statement balance and per diem.
    The short-sale approval is not made until the payoff case carries an issued statement balance. A contract that meets the Estate Market Sale Payoff minimum,
    the lesser of the case''s statement_balance and 95 percent of the appraised value basis, is never approved as a short sale. Under the standard rule,
    the required payoff amount on a short-sale approval is the contract price less the allowed closing costs and less the short-sale closing deductions,
    rounded half up to the cent and only at that last step. The contract price, the contract commission and the contract other costs, each 0.00 where the
    case has no such submission, are the contract_price, commission_amount and other_closing_costs of the purchase_contract_submission on file for the case
    whose request status is received. The allowed closing costs are the short-sale commission allowance plus the short-sale other-cost allowance; under
    the standard rule the short-sale commission allowance is the contract commission up to max_commission_pct percent of the contract price, and the short-sale
    other-cost allowance is the contract other costs up to max_other_closing_costs_pct percent of the contract price, each percent amount rounded half up
    to the cent before the lesser is taken. The short-sale closing deductions are four amounts paid from the price at closing, the property-charge shortfall,
    the release recording allowance, the foreclosure postponement allowance and the extended-marketing allowance; under the standard rule the release recording
    allowance is release_recording_fee_per_instrument for one instrument and the other three are each 0.00. The appraised value basis is the appraised_value
    on the loan''s maturity case, which must be dated within that case plan''s appraisal_valid_months. A case with no purchase_contract_submission on file
    whose request status is received, or with more than one, has no short-sale approval figures until a single one remains, and its required payoff amount
    stays 0.00. The short-sale commission allowance is instead the contract commission up to commission_pct_high_price percent of the contract price when
    that price is at least high_price_threshold, and up to commission_pct_mid_price percent when the price is at least mid_price_threshold but below high_price_threshold;
    a lower price keeps max_commission_pct. The short-sale other-cost allowance is instead the contract other costs up to other_cost_pct_multi_unit percent
    of the contract price for a two_to_four_unit property, and up to other_cost_pct_association percent for an fha_approved_condominium or planned_unit_development
    property; every other property, and a Summit loan, keeps max_other_closing_costs_pct. The property-charge shortfall is instead figured from the set-aside
    on the loan that pays its property charges and its approval bills: for an active Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected),
    whose shortfall_source bills the borrower for what the set-aside cannot pay, it is the sum of that set-aside''s approval bills less its setaside_balance,
    not below 0.00; for a loan whose property-charge set-aside is an active Partially Funded LESA, which pays no bill, it is the sum of the bills that set-aside
    declined of each type with the latest due_date whose due_date falls no later than statement_good_through_days calendar days after the approval date,
    several declined bills of one type due on that latest due_date taken together; a loan with an active Summit Tax and Insurance Reserve, or with no such
    set-aside, keeps 0.00. An approval bill is, for each of property_tax_bill, hazard_insurance_bill and flood_insurance_bill, the received bill of that
    type on the Fully Funded LESA with the latest due_date, when its payment date, its due_date less the plan''s tax_payment_lead_days for a tax bill and
    less its insurance_payment_lead_days for a hazard or flood bill, falls no later than statement_good_through_days calendar days after the approval date.
    Where several such bills of one type share that latest due_date, their billed_amounts are taken together as that type''s bill. The release recording
    allowance is instead release_recording_fee_per_instrument for each of three instruments, the lender''s mortgage, the Secretary''s second mortgage and
    the trustee''s certification, for a HECM whose occupancy profile is a Living Trust Certification, and for each of two instruments, the lender''s mortgage
    and the Secretary''s second mortgage, for any other HECM; a Summit loan keeps one instrument. The foreclosure postponement allowance is instead postponement_fee_full
    when the maturity case''s status is foreclosure_referred and its referral_date is at least first_legal_action_days calendar days before the approval
    date, and postponement_fee_initial when its status is foreclosure_referred and it was referred fewer days before, a case with no referral_date counting
    as referred 0 days before; a case in any other status keeps 0.00. The extended-marketing allowance is instead marketing_pct_long percent of the contract
    price when the contract''s listing_date is at least marketing_long_days calendar days before its request_date, and marketing_pct_mid percent when it
    is at least marketing_mid_days but fewer than marketing_long_days calendar days before it, rounded half up to the cent; a contract with a shorter listing
    or no listing_date keeps 0.00.'
  prerequisite:
  - problem: payoff_ext_sale_statement_balance
    kind: state_gate
    gate: payoff_cases.statement_balance
    form: state
    policy_source: The short-sale approval is not made until the payoff case carries an issued statement balance.
    condition: payoff_cases.status is terms_issued and payoff_cases.statement_balance carries the short-sale statement balance (not 0.00).
    resolved_by: issue_sale_payoff_statement_764045f1
    effect: The Estate Market Sale minimum the contract is tested against can be read, so the short-sale approval may be made.
  cross_category:
  - category: hecm
    as: read
    reads:
    - property_type
    note: The property type decides the other-cost allowance.
  - category: setaside
    as: branch
    reads:
    - variant_name
    - status
    - setaside_balance
    - tax_payment_lead_days
    - insurance_payment_lead_days
    - setaside_requests.due_date
    - setaside_requests.billed_amount
    note: The property-charge set-aside and its bills decide the property-charge shortfall.
  - category: residency
    as: read
    reads:
    - residency_profile_id
    - variant_name
    note: A Living Trust Certification profile adds the trustee instrument.
  - category: maturity
    as: branch
    reads:
    - appraised_value
    - status
    - referral_date
    note: The appraisal and the foreclosure referral.
  compute:
  - contracts_on_file: COUNT('payoff_requests', request_type='purchase_contract_submission', request_status='received')
  - contract_price: LATEST('payoff_requests', 'contract_price', date_field='request_date', request_type='purchase_contract_submission', request_status='received')
      or 0
  - contract_commission: LATEST('payoff_requests', 'commission_amount', date_field='request_date', request_type='purchase_contract_submission', request_status='received')
      or 0
  - contract_other: LATEST('payoff_requests', 'other_closing_costs', date_field='request_date', request_type='purchase_contract_submission', request_status='received')
      or 0
  - appraised_value: CFIELD('maturity', 'appraised_value', maturity_case_id=F('maturity_case_id'))
  - co_price: LATEST('payoff_requests', 'contract_price', date_field='request_date', request_type='purchase_contract_submission', request_status='received')
      or 0
  - commission_allowance: MN(contract_commission, RND(co_price * (K('commission_pct_high_price') if co_price >= K('high_price_threshold') else (K('commission_pct_mid_price')
      if co_price >= K('mid_price_threshold') else P('max_commission_pct'))) / 100, 2))
  - oc_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - other_cost_allowance: MN(contract_other, RND(contract_price * (K('other_cost_pct_multi_unit') if oc_type == 'two_to_four_unit' else (K('other_cost_pct_association')
      if oc_type == 'fha_approved_condominium' or oc_type == 'planned_unit_development' else P('max_other_closing_costs_pct'))) / 100, 2))
  - allowed_closing_costs: commission_allowance + other_cost_allowance
  - sh_ff: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Mandatory)', status='active') or CFIELD('setaside',
      'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Borrower-Elected)', status='active')
  - sh_partial: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Partially Funded LESA', status='active')
  - sh_bal: CFIELD('setaside', 'setaside_balance', setaside_id=sh_ff) if sh_ff else 0
  - sh_tlead: CPARAM('setaside', 'tax_payment_lead_days', setaside_id=sh_ff) if sh_ff else 0
  - sh_ilead: CPARAM('setaside', 'insurance_payment_lead_days', setaside_id=sh_ff) if sh_ff else 0
  - sh_tdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sh_ff, request_type='property_tax_bill', request_status='received')
      if sh_ff else None
  - sh_tamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sh_ff, request_type='property_tax_bill', request_status='received', due_date=sh_tdue)
      if sh_ff and sh_tdue else 0
  - sh_hdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sh_ff, request_type='hazard_insurance_bill', request_status='received')
      if sh_ff else None
  - sh_hamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sh_ff, request_type='hazard_insurance_bill', request_status='received',
      due_date=sh_hdue) if sh_ff and sh_hdue else 0
  - sh_fdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sh_ff, request_type='flood_insurance_bill', request_status='received')
      if sh_ff else None
  - sh_famt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sh_ff, request_type='flood_insurance_bill', request_status='received', due_date=sh_fdue)
      if sh_ff and sh_fdue else 0
  - sh_bills: (sh_tamt if sh_tdue and DAYS(NOW, sh_tdue) - sh_tlead <= P('statement_good_through_days') else 0) + (sh_hamt if sh_hdue and DAYS(NOW, sh_hdue)
      - sh_ilead <= P('statement_good_through_days') else 0) + (sh_famt if sh_fdue and DAYS(NOW, sh_fdue) - sh_ilead <= P('statement_good_through_days')
      else 0)
  - sh_ptdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sh_partial, request_type='property_tax_bill', request_status='declined')
      if sh_partial else None
  - sh_ptamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sh_partial, request_type='property_tax_bill', request_status='declined',
      due_date=sh_ptdue) if sh_partial and sh_ptdue else 0
  - sh_phdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sh_partial, request_type='hazard_insurance_bill',
      request_status='declined') if sh_partial else None
  - sh_phamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sh_partial, request_type='hazard_insurance_bill', request_status='declined',
      due_date=sh_phdue) if sh_partial and sh_phdue else 0
  - sh_pfdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sh_partial, request_type='flood_insurance_bill', request_status='declined')
      if sh_partial else None
  - sh_pfamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sh_partial, request_type='flood_insurance_bill', request_status='declined',
      due_date=sh_pfdue) if sh_partial and sh_pfdue else 0
  - sh_declined: (sh_ptamt if sh_ptdue and DAYS(NOW, sh_ptdue) <= P('statement_good_through_days') else 0) + (sh_phamt if sh_phdue and DAYS(NOW, sh_phdue)
      <= P('statement_good_through_days') else 0) + (sh_pfamt if sh_pfdue and DAYS(NOW, sh_pfdue) <= P('statement_good_through_days') else 0)
  - charge_shortfall: MX(0, sh_bills - sh_bal) if sh_ff else (sh_declined if sh_partial else 0)
  - rl_profile: CFIELD('residency', 'residency_profile_id', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('residency', 'residency_profile_id',
      jumbo_loan_id=F('jumbo_loan_id'))
  - rl_plan: CFIELD('residency', 'variant_name', residency_profile_id=rl_profile) if rl_profile else None
  - release_allowance: K('release_recording_fee_per_instrument') * 3 if F('loan_program') == 'hecm' and rl_plan == 'Living Trust Certification' else (K('release_recording_fee_per_instrument')
      * 2 if F('loan_program') == 'hecm' else K('release_recording_fee_per_instrument'))
  - pp_status: CFIELD('maturity', 'status', maturity_case_id=F('maturity_case_id'))
  - pp_referral: CFIELD('maturity', 'referral_date', maturity_case_id=F('maturity_case_id'))
  - pp_age: DAYS(pp_referral, NOW) if pp_referral else 0
  - postponement_allowance: K('postponement_fee_full') if pp_status == 'foreclosure_referred' and pp_age >= K('first_legal_action_days') else (K('postponement_fee_initial')
      if pp_status == 'foreclosure_referred' else 0)
  - mk_listing: LATEST('payoff_requests', 'listing_date', date_field='request_date', request_type='purchase_contract_submission', request_status='received')
  - mk_request: LATEST('payoff_requests', 'request_date', date_field='request_date', request_type='purchase_contract_submission', request_status='received')
  - mk_days: DAYS(mk_listing, mk_request) if mk_listing and mk_request else 0
  - marketing_allowance: RND(contract_price * K('marketing_pct_long') / 100, 2) if mk_listing and mk_days >= K('marketing_long_days') else (RND(contract_price
      * K('marketing_pct_mid') / 100, 2) if mk_listing and mk_days >= K('marketing_mid_days') else 0)
  - closing_deductions: charge_shortfall + release_allowance + postponement_allowance + marketing_allowance
  - result: RND(contract_price - allowed_closing_costs - closing_deductions, 2) if contracts_on_file == 1 else 0
