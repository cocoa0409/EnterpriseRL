    rl_profile: The release recording allowance is instead release_recording_fee_per_instrument for each of three instruments, the lender's mortgage, the
      Secretary's second mortgage and the trustee's certification, for a HECM whose occupancy profile is a Living Trust Certification, and for each of two
      instruments, the lender's mortgage and the Secretary's second mortgage, for any other HECM; a Summit loan keeps one instrument.
    rl_plan: The release recording allowance is instead release_recording_fee_per_instrument for each of three instruments, the lender's mortgage, the Secretary's
      second mortgage and the trustee's certification, for a HECM whose occupancy profile is a Living Trust Certification, and for each of two instruments,
      the lender's mortgage and the Secretary's second mortgage, for any other HECM; a Summit loan keeps one instrument.
    release_allowance: The release recording allowance is instead release_recording_fee_per_instrument for each of three instruments, the lender's mortgage,
      the Secretary's second mortgage and the trustee's certification, for a HECM whose occupancy profile is a Living Trust Certification, and for each
      of two instruments, the lender's mortgage and the Secretary's second mortgage, for any other HECM; a Summit loan keeps one instrument.
    pp_status: The foreclosure postponement allowance is instead postponement_fee_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the approval date, and postponement_fee_initial when its status is foreclosure_referred and
      it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    pp_referral: The foreclosure postponement allowance is instead postponement_fee_full when the maturity case's status is foreclosure_referred and its
      referral_date is at least first_legal_action_days calendar days before the approval date, and postponement_fee_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    pp_age: The foreclosure postponement allowance is instead postponement_fee_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the approval date, and postponement_fee_initial when its status is foreclosure_referred and
      it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    postponement_allowance: The foreclosure postponement allowance is instead postponement_fee_full when the maturity case's status is foreclosure_referred
      and its referral_date is at least first_legal_action_days calendar days before the approval date, and postponement_fee_initial when its status is
      foreclosure_referred and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status
      keeps 0.00.
    mk_listing: The extended-marketing allowance is instead marketing_pct_long percent of the contract price when the contract's listing_date is at least
      marketing_long_days calendar days before its request_date, and marketing_pct_mid percent when it is at least marketing_mid_days but fewer than marketing_long_days
      calendar days before it, rounded half up to the cent; a contract with a shorter listing or no listing_date keeps 0.00.
    mk_request: The extended-marketing allowance is instead marketing_pct_long percent of the contract price when the contract's listing_date is at least
      marketing_long_days calendar days before its request_date, and marketing_pct_mid percent when it is at least marketing_mid_days but fewer than marketing_long_days
      calendar days before it, rounded half up to the cent; a contract with a shorter listing or no listing_date keeps 0.00.
    mk_days: The extended-marketing allowance is instead marketing_pct_long percent of the contract price when the contract's listing_date is at least marketing_long_days
      calendar days before its request_date, and marketing_pct_mid percent when it is at least marketing_mid_days but fewer than marketing_long_days calendar
      days before it, rounded half up to the cent; a contract with a shorter listing or no listing_date keeps 0.00.
    marketing_allowance: The extended-marketing allowance is instead marketing_pct_long percent of the contract price when the contract's listing_date is
      at least marketing_long_days calendar days before its request_date, and marketing_pct_mid percent when it is at least marketing_mid_days but fewer
      than marketing_long_days calendar days before it, rounded half up to the cent; a contract with a shorter listing or no listing_date keeps 0.00.
    closing_deductions: The short-sale closing deductions are four amounts paid from the price at closing, the property-charge shortfall, the release recording
      allowance, the foreclosure postponement allowance and the extended-marketing allowance; under the standard rule the release recording allowance is
      release_recording_fee_per_instrument for one instrument and the other three are each 0.00.
    result: A case with no purchase_contract_submission on file whose request status is received, or with more than one, has no short-sale approval figures
      until a single one remains, and its required payoff amount stays 0.00.
  factors:
  - id: short_sale_commission_allowance
    effect: parameter
    decides: commission_allowance
    bindings:
    - co_price
    - commission_allowance
    ladder:
    - when: contract price at least high_price_threshold
      value: commission_pct_high_price percent of the price as the commission limit
    - when: price at least mid_price_threshold and below high_price_threshold
      value: commission_pct_mid_price percent of the price
    - when: otherwise
      value: max_commission_pct percent of the price
    baseline:
      commission_allowance: MN(contract_commission, RND(contract_price * P('max_commission_pct') / 100, 2))
    evidence:
    - history
  - id: short_sale_other_cost_allowance
    effect: parameter
    decides: other_cost_allowance
    bindings:
    - oc_type
    - other_cost_allowance
    ladder:
    - when: two_to_four_unit property
      value: other_cost_pct_multi_unit percent of the price as the other-cost limit
    - when: fha_approved_condominium or planned_unit_development property
      value: other_cost_pct_association percent of the price
    - when: otherwise
      value: max_other_closing_costs_pct percent of the price
    baseline:
      other_cost_allowance: MN(contract_other, RND(contract_price * P('max_other_closing_costs_pct') / 100, 2))
    evidence:
    - cross_category
    cross_difficulty: hecm
  - id: short_sale_property_charge_shortfall
    effect: method
    decides: charge_shortfall
    bindings:
    - sh_ff
    - sh_partial
    - sh_bal
    - sh_tlead
    - sh_ilead
    - sh_tdue
    - sh_tamt
    - sh_hdue
    - sh_hamt
    - sh_fdue
    - sh_famt
    - sh_bills
    - sh_ptdue
    - sh_ptamt
    - sh_phdue
    - sh_phamt
    - sh_pfdue
    - sh_pfamt
    - sh_declined
    - charge_shortfall
    ladder:
    - when: an active Fully Funded LESA (Mandatory or Borrower-Elected) pays the loan property charges
      method: sum its approval bills (payment-date test) and take the part above its setaside_balance
    - when: the property-charge set-aside is an active Partially Funded LESA
      method: sum the declined bills due by the good-through horizon in full (due-date test)
    - when: otherwise
      method: no shortfall (0.00)
    baseline:
      charge_shortfall: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: setaside
  - id: short_sale_release_allowance
    effect: parameter
    decides: release_allowance
    bindings:
    - rl_profile
    - rl_plan
    - release_allowance
    ladder:
    - when: HECM whose occupancy profile is a Living Trust Certification
      value: three times release_recording_fee_per_instrument
    - when: any other HECM
      value: two times release_recording_fee_per_instrument
    - when: otherwise
      value: release_recording_fee_per_instrument
    baseline:
      release_allowance: K('release_recording_fee_per_instrument')
    evidence:
    - cross_category
    cross_difficulty: residency
  - id: short_sale_postponement_allowance
    effect: parameter
    decides: postponement_allowance
    bindings:
    - pp_status
    - pp_referral
    - pp_age
    - postponement_allowance
    ladder:
    - when: foreclosure_referred and referred at least first_legal_action_days before the approval date
      value: postponement_fee_full
    - when: foreclosure_referred and referred fewer days before
      value: postponement_fee_initial
    - when: otherwise
      value: '0.00'
    baseline:
      postponement_allowance: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  - id: short_sale_marketing_allowance
    effect: parameter
    decides: marketing_allowance
    bindings:
    - mk_listing
    - mk_request
    - mk_days
    - marketing_allowance
    ladder:
    - when: listing at least marketing_long_days before the contract request_date
      value: marketing_pct_long percent of the price
    - when: listing marketing_mid_days to fewer than marketing_long_days before
      value: marketing_pct_mid percent of the price
    - when: otherwise
      value: '0.00'
    baseline:
      marketing_allowance: '0'
    evidence:
    - history
    - date
  baseline:
    rule: Under the standard rule, the required payoff amount on a short-sale approval is the contract price less the allowed closing costs and less the
      short-sale closing deductions, rounded half up to the cent and only at that last step. The contract price, the contract commission and the contract
      other costs, each 0.00 where the case has no such submission, are the contract_price, commission_amount and other_closing_costs of the purchase_contract_submission
      on file for the case whose request status is received. The allowed closing costs are the short-sale commission allowance plus the short-sale other-cost
      allowance; under the standard rule the short-sale commission allowance is the contract commission up to max_commission_pct percent of the contract
      price, and the short-sale other-cost allowance is the contract other costs up to max_other_closing_costs_pct percent of the contract price, each percent
      amount rounded half up to the cent before the lesser is taken. The short-sale closing deductions are four amounts paid from the price at closing,
      the property-charge shortfall, the release recording allowance, the foreclosure postponement allowance and the extended-marketing allowance; under
      the standard rule the release recording allowance is release_recording_fee_per_instrument for one instrument and the other three are each 0.00. The
      appraised value basis is the appraised_value on the loan's maturity case, which must be dated within that case plan's appraisal_valid_months. A case
      with no purchase_contract_submission on file whose request status is received, or with more than one, has no short-sale approval figures until a single
      one remains, and its required payoff amount stays 0.00.
    params:
    - max_commission_pct
    - max_other_closing_costs_pct
    - release_recording_fee_per_instrument
  inputs:
    history:
    - category: payoff
      table: payoff_requests
      aggregate: count
      field: payoff_request_id
      filters:
        request_type: purchase_contract_submission
        request_status: received
    - category: payoff
      table: payoff_requests
      aggregate: latest
      field: contract_price
      filters:
        request_type: purchase_contract_submission
        request_status: received
    - category: setaside
      table: setaside_requests
      aggregate: latest
      field: billed_amount
      filters:
        request_status: received
    cross_category:
    - hecm
    - setaside
    - residency
    - maturity
- id: payoff_ext_sale_seller_shortfall
  base_policy_refs:
  - payoff_agg_funds
  - payoff_acceptance
  overwrite:
  - base_policy: payoff_acceptance
    superseded_clause: On plans whose acceptance_required is true, nothing is taken toward satisfaction until the borrower or confirmed successor signs
      the agreement under the issued terms;
    replaced_by: On plans whose acceptance_required is true, nothing is taken toward satisfaction until the borrower or confirmed successor signs the agreement
      under the issued terms, except that on the payoff case of an Approved Short Sale Payoff requested by the borrower of record the seller's own closing
      contribution is received and held on the case before the agreement is signed and is applied only when the case is satisfied from accepted status.
  - base_policy: payoff_agg_funds
    superseded_clause: Each remittance is recorded once, identified by its remittance_reference.
    replaced_by: Each remittance is recorded once, identified by its remittance_reference; a remittance the borrower of record sends in person on a retention
      payoff or as a short-sale seller contribution receives its remittance_reference from the servicer when it is recorded, and is recorded once under
      that issued reference.
  - base_policy: payoff_agg_funds
    superseded_clause: On satisfaction exactly the required payoff amount is applied to the loan, per funds_application_timing; any held excess is refunded
      within overpayment_refund_business_days business days to the remitter of the receipt that took the pooled total over the required amount, up to that
      receipt's amount, and then to earlier remitters in reverse order of receipt, per remitter_refund_target.
    replaced_by: On satisfaction exactly the required payoff amount is applied to the loan, per funds_application_timing, and on a retention payoff, the
      payoff case of a Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period
      or foreclosure_referred, or on the payoff case of an Approved Short Sale Payoff requested by the borrower of record, the remittance charges collected
      with the borrower's own remittance, other than its clearing cushion, are then retained for those charges, and the clearing cushion, per diem collected
      in advance, is kept only for the per diem the case owes for each day its funds were credited after the statement's good-through date, per interest_through_basis;
      any held excess left, an unused cushion included, is refunded within overpayment_refund_business_days business days to the remitter of the receipt
      that took the pooled total over the required amount, up to that receipt's amount, and then to earlier remitters in reverse order of receipt, per remitter_refund_target.
  trigger: on_request
  subject:
  - payoff_funds_received
  computes: amount
  target_tool: remit_seller_closing_shortfall_d501bd8d
  params:
    cushion_flat_extension: 100.0
    wire_fee_three_plus: 30.0
    wire_fee_two: 15.0
    returned_check_fee: 35.0
    recalled_wire_fee: 25.0
    title_search_fee_standard: 40.0
    title_search_fee_mid: 65.0
    title_search_fee_long: 95.0
    title_search_mid_months: 60
    title_search_long_months: 120
  rule: This policy sets the seller closing contribution, the amount the borrower of record sends in person, by wire, to the payoff case of an Approved
    Short Sale Payoff requested by the borrower of record so that the sale's net proceeds reach the required payoff amount. On plans whose acceptance_required
    is true, nothing is taken toward satisfaction until the borrower or confirmed successor signs the agreement under the issued terms, except that on the
    payoff case of an Approved Short Sale Payoff requested by the borrower of record the seller's own closing contribution is received and held on the case
    before the agreement is signed and is applied only when the case is satisfied from accepted status. Each remittance is recorded once, identified by
    its remittance_reference; a remittance the borrower of record sends in person on a retention payoff or as a short-sale seller contribution receives
    its remittance_reference from the servicer when it is recorded, and is recorded once under that issued reference. On satisfaction exactly the required
    payoff amount is applied to the loan, per funds_application_timing, and on a retention payoff, the payoff case of a Borrower Voluntary Payoff requested
    by the borrower of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred, or on the payoff case of an Approved
    Short Sale Payoff requested by the borrower of record, the remittance charges collected with the borrower's own remittance, other than its clearing
    cushion, are then retained for those charges, and the clearing cushion, per diem collected in advance, is kept only for the per diem the case owes for
    each day its funds were credited after the statement's good-through date, per interest_through_basis; any held excess left, an unused cushion included,
    is refunded within overpayment_refund_business_days business days to the remitter of the receipt that took the pooled total over the required amount,
    up to that receipt's amount, and then to earlier remitters in reverse order of receipt, per remitter_refund_target. The seller closing contribution
    is not worked out until the payoff case carries an approved short-sale allowance for its closing costs. Under the standard rule, the seller closing
    contribution is the contribution shortfall plus the contribution cushion plus three contribution charges, the contribution wire fee, the contribution
    returned-item fee and the contribution title search fee, rounded half up to the cent and only at that last step; the shortfall is floored at 0.00 before
    the cushion and the charges are added. The contribution shortfall is the contract costs above the allowance, the commission_amount plus the other_closing_costs
    of the case's accepted purchase_contract_submission, the latest by request_date (where several accepted submissions share that request_date, the largest
    commission_amount and the largest other_closing_costs among them), less the allowed_closing_costs the payoff case carries, less the funds the case holds
    net of returns, every payoff_funds_received amount on the case less every payoff_funds_returned amount on it, and never below 0.00; a case with no accepted
    purchase_contract_submission counts its contract costs as 0.00. Under the standard rule the contribution cushion, the contribution wire fee and the
    contribution returned-item fee are each 0.00 and the contribution title search fee is title_search_fee_standard. The contribution cushion is per diem
    collected in advance against funds being credited after the statement's good-through date, and whatever of it is not needed for that per diem is refunded
    with the held excess. It is instead the per diem the payoff case carries times late_funds_tolerance_days when the maturity case's status is foreclosure_referred,
    and the flat cushion_flat_extension when its status is extension_period; a case in any other status keeps 0.00. The contribution wire fee is instead
    wire_fee_three_plus when the case carries three or more payoff_funds_received entries with remittance_method wire, recalled ones included, and wire_fee_two
    when it carries exactly two; a case with fewer keeps 0.00. The contribution returned-item fee is instead returned_check_fee when any payoff_funds_returned
    entry on the case has remittance_method cashiers_check, and recalled_wire_fee when the case carries a payoff_funds_returned entry with remittance_method
    wire and none with cashiers_check; a case with neither keeps 0.00. The contribution title search fee is instead title_search_fee_long when the loan's
    closing_date is at least title_search_long_months whole calendar months before the remittance date and title_search_fee_mid when it is at least title_search_mid_months
    but fewer than title_search_long_months whole calendar months before it; a loan closed more recently keeps title_search_fee_standard, and a loan with
    no closing_date counts 0 months.
  prerequisite:
  - problem: payoff_ext_sale_cost_allowance
    kind: value_input
    gate: allowed_on_case
    form: state
    policy_source: The seller closing contribution is not worked out until the payoff case carries an approved short-sale allowance for its closing costs.
    condition: payoff_cases.allowed_closing_costs carries the short-sale allowed closing costs and the purchase contract submission is accepted.
    resolved_by: approve_sale_closing_costs_11c6cfd9
    effect: The allowed closing costs the contribution shortfall deducts change from 0.00 to the approved allowance, and the contract becomes the accepted
      one the shortfall reads.
  cross_category:
  - category: hecm
    as: read
    reads:
    - closing_date
    note: The loan closing date decides the title search fee.
  - category: jumbo
    as: read
    reads:
    - closing_date
    note: The closing date of a Summit loan.
  - category: maturity
    as: branch
    reads:
    - status
    note: The maturity case status decides the cushion.
  compute:
  - accepted_date: LATEST('payoff_requests', 'request_date', date_field='request_date', request_type='purchase_contract_submission', request_status='accepted')
  - contract_commission: MAX('payoff_requests', 'commission_amount', request_type='purchase_contract_submission', request_status='accepted', request_date=accepted_date)
  - contract_other: MAX('payoff_requests', 'other_closing_costs', request_type='purchase_contract_submission', request_status='accepted', request_date=accepted_date)
  - allowed_on_case: F('allowed_closing_costs')
  - funds_received: SUM('payoff_transactions', 'amount', event_type='payoff_funds_received')
  - funds_returned: SUM('payoff_transactions', 'amount', event_type='payoff_funds_returned')
  - contribution_shortfall: MX(0, contract_commission + contract_other - allowed_on_case - (funds_received - funds_returned))
  - per_diem_on_case: F('per_diem_amount')
  - maturity_status: CFIELD('maturity', 'status', maturity_case_id=F('maturity_case_id'))
  - clearing_cushion: per_diem_on_case * P('late_funds_tolerance_days') if maturity_status == 'foreclosure_referred' else (K('cushion_flat_extension') if
      maturity_status == 'extension_period' else 0)
  - wire_receipts: COUNT('payoff_transactions', event_type='payoff_funds_received', remittance_method='wire')
  - wire_fee: K('wire_fee_three_plus') if wire_receipts >= 3 else (K('wire_fee_two') if wire_receipts == 2 else 0)
  - check_returns: COUNT('payoff_transactions', event_type='payoff_funds_returned', remittance_method='cashiers_check')
  - wire_returns: COUNT('payoff_transactions', event_type='payoff_funds_returned', remittance_method='wire')
  - returned_fee: K('returned_check_fee') if check_returns > 0 else (K('recalled_wire_fee') if wire_returns > 0 else 0)
  - closing_date: CFIELD('hecm', 'closing_date', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('jumbo', 'closing_date', jumbo_loan_id=F('jumbo_loan_id'))
  - loan_age_months: MONTHS(closing_date, NOW) if closing_date else 0
  - title_search_fee: K('title_search_fee_long') if loan_age_months >= K('title_search_long_months') else (K('title_search_fee_mid') if loan_age_months
      >= K('title_search_mid_months') else K('title_search_fee_standard'))
  - result: RND(contribution_shortfall + clearing_cushion + wire_fee + returned_fee + title_search_fee, 2)
  compute_basis:
    contract_commission: The contribution shortfall is the contract costs above the allowance, the commission_amount plus the other_closing_costs of the
      case's accepted purchase_contract_submission, the latest by request_date (where several accepted submissions share that request_date, the largest
      commission_amount and the largest other_closing_costs among them), less the allowed_closing_costs the payoff case carries, less the funds the case
