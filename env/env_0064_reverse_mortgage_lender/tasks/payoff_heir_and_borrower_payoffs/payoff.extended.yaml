  - fee_per_month: CPARAM('hecm', 'servicing_fee_monthly_adjustable', hecm_loan_id=F('hecm_loan_id')) if fee_option == 'monthly_fee_with_setaside' and rate_type
      == 'monthly_adjustable' else (CPARAM('hecm', 'servicing_fee_annual_or_fixed', hecm_loan_id=F('hecm_loan_id')) if fee_option == 'monthly_fee_with_setaside'
      and (rate_type == 'annual_adjustable' or rate_type == 'fixed') else 0)
