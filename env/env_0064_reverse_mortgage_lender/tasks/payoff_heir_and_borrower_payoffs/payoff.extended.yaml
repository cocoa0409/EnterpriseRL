      other type, or is a Summit loan, which records no property_type, it is securing_fee_vacant plus maintenance_monthly for each month of vacancy; when
      the result was unable_to_determine it is securing_fee_unconfirmed; any other result, no result, or a plan whose vacant_property_securing is false
      keeps 0.00.'
    property_type: 'The preservation advance carry is instead figured from the latest residency_inspection_result on the loan''s occupancy profile, and
      only where the maturity case''s plan has vacant_property_securing true: when that result found the home vacant and the loan''s property_type is fha_approved_condominium
      or planned_unit_development, it is securing_fee_vacant plus maintenance_flat_association; when it found the home vacant and the property is of any
      other type, or is a Summit loan, which records no property_type, it is securing_fee_vacant plus maintenance_monthly for each month of vacancy; when
      the result was unable_to_determine it is securing_fee_unconfirmed; any other result, no result, or a plan whose vacant_property_securing is false
      keeps 0.00.'
    nonocc_date: The months of vacancy that preservation advance counts are the whole calendar months from the occupancy profile's nonoccupancy_date to
      the statement date, not below 0, plus one; a profile with no nonoccupancy_date counts one month.
    vacancy_months: The months of vacancy that preservation advance counts are the whole calendar months from the occupancy profile's nonoccupancy_date
      to the statement date, not below 0, plus one; a profile with no nonoccupancy_date counts one month.
    preservation_carry: 'The preservation advance carry is instead figured from the latest residency_inspection_result on the loan''s occupancy profile,
      and only where the maturity case''s plan has vacant_property_securing true: when that result found the home vacant and the loan''s property_type is
      fha_approved_condominium or planned_unit_development, it is securing_fee_vacant plus maintenance_flat_association; when it found the home vacant and
      the property is of any other type, or is a Summit loan, which records no property_type, it is securing_fee_vacant plus maintenance_monthly for each
      month of vacancy; when the result was unable_to_determine it is securing_fee_unconfirmed; any other result, no result, or a plan whose vacant_property_securing
      is false keeps 0.00.'
    dp_appraisal_carry: The due-and-payable appraisal carry is instead appraisal_fee_two_to_four for a two_to_four_unit property and appraisal_fee_condo_manufactured
      for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan, keeps appraisal_fee_standard.
    dp_property_type: The due-and-payable appraisal carry is instead appraisal_fee_two_to_four for a two_to_four_unit property and appraisal_fee_condo_manufactured
      for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan, keeps appraisal_fee_standard.
    appraisal_date: The replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the effective_date
      of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it, and replacement_appraisal_fee
      when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date; a case with no appraisal_date,
      or whose appraisal falls within neither span, keeps 0.00.
    called_due_date: The replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the effective_date
      of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it, and replacement_appraisal_fee
      when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date; a case with no appraisal_date,
      or whose appraisal falls within neither span, keeps 0.00.
    appraisal_order_days: The replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the
      effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it,
      and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    last_extension_date: The replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the effective_date
      of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it, and replacement_appraisal_fee
      when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date; a case with no appraisal_date,
      or whose appraisal falls within neither span, keeps 0.00.
    replacement_carry: The replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the effective_date
      of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it, and replacement_appraisal_fee
      when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date; a case with no appraisal_date,
      or whose appraisal falls within neither span, keeps 0.00.
    maturity_status: The foreclosure charge carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    referral_date: The foreclosure charge carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    referral_age: The foreclosure charge carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    foreclosure_carry: The foreclosure charge carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its
      referral_date is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    accrual_basis: 'The retention accrual basis is the loan''s principal_balance plus five carried advances: the set-aside disbursement carry, the preservation
      advance carry, the due-and-payable appraisal carry, the replacement appraisal carry and the foreclosure charge carry.'
    result: Under the standard rule, the retention daily accrual is the retention accrual basis times the loan's daily accrual rate, rounded half up to
      the cent and only at that last step.
  factors:
  - id: retention_setaside_disbursement_carry
    effect: method
    decides: setaside_carry
    bindings:
    - ff_lesa_id
    - reserve_id
    - sa_id
    - sa_balance
    - tax_lead
    - ins_lead
    - tax_due
    - tax_amt
    - haz_due
    - haz_amt
    - fld_due
    - fld_amt
    - qualifying_bills
    - setaside_carry
    ladder:
    - when: an active Fully Funded LESA (Mandatory or Borrower-Elected) on the loan
      method: sum the set-aside's qualifying bills and limit the sum to its setaside_balance
    - when: an active Summit Tax and Insurance Reserve on the loan
      method: sum the reserve's qualifying bills in full, the part above its balance being paid at once as a corporate advance
    - when: otherwise
      method: carry nothing (0.00)
    baseline:
      setaside_carry: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: setaside
  - id: retention_preservation_advance_carry
    effect: method
    decides: preservation_carry
    bindings:
    - profile_id
    - inspection_result
    - securing_allowed
    - property_type
    - nonocc_date
    - vacancy_months
    - preservation_carry
    ladder:
    - when: securing permitted, latest inspection found the home vacant, fha_approved_condominium or planned_unit_development
      method: securing_fee_vacant plus the flat maintenance_flat_association
    - when: securing permitted, latest inspection found the home vacant, any other property type
      method: securing_fee_vacant plus maintenance_monthly times the months of vacancy
    - when: securing permitted, latest inspection unable_to_determine
      method: the flat securing_fee_unconfirmed
    - when: otherwise
      method: carry nothing (0.00)
    baseline:
      preservation_carry: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: residency
  - id: retention_called_due_appraisal_carry
    effect: parameter
    decides: dp_appraisal_carry
    bindings:
    - dp_property_type
    - dp_appraisal_carry
    ladder:
    - when: two_to_four_unit property
      value: appraisal_fee_two_to_four
    - when: fha_approved_condominium or manufactured_home property
      value: appraisal_fee_condo_manufactured
    - when: otherwise
      value: appraisal_fee_standard
    baseline:
      dp_appraisal_carry: K('appraisal_fee_standard')
    evidence:
    - cross_category
    cross_difficulty: hecm
  - id: retention_replacement_appraisal_carry
    effect: parameter
    decides: replacement_carry
    bindings:
    - appraisal_date
    - called_due_date
    - appraisal_order_days
    - last_extension_date
    - replacement_carry
    ladder:
    - when: appraisal dated within appraisal_order_days on or after the latest granted extension
      value: update_appraisal_fee
    - when: otherwise an appraisal dated more than appraisal_order_days after the due-and-payable date
      value: replacement_appraisal_fee
    - when: otherwise
      value: '0.00'
    baseline:
      replacement_carry: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: maturity
  - id: retention_foreclosure_charge_carry
    effect: parameter
    decides: foreclosure_carry
    bindings:
    - maturity_status
    - referral_date
    - referral_age
    - foreclosure_carry
    ladder:
    - when: foreclosure_referred and referred at least first_legal_action_days before the statement date
      value: foreclosure_charges_full
    - when: foreclosure_referred and referred fewer days before
      value: foreclosure_charges_initial
    - when: otherwise
      value: '0.00'
    baseline:
      foreclosure_carry: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  baseline:
    rule: 'Under the standard rule, the retention daily accrual is the retention accrual basis times the loan''s daily accrual rate, rounded half up to
      the cent and only at that last step. The loan''s daily accrual rate is its note_rate_pct plus, for a HECM, the annual_mip_rate_pct of its payout plan,
      divided by 100 and by per_diem_day_count; a Summit loan carries no MIP. The retention accrual basis is the loan''s principal_balance plus five carried
      advances: the set-aside disbursement carry, the preservation advance carry, the due-and-payable appraisal carry, the replacement appraisal carry and
      the foreclosure charge carry. Under the standard rule the set-aside disbursement carry, the preservation advance carry, the replacement appraisal
      carry and the foreclosure charge carry are each 0.00, and the due-and-payable appraisal carry is appraisal_fee_standard.'
    params:
    - appraisal_fee_standard
  inputs:
    history:
    - category: setaside
      table: setaside_requests
      aggregate: latest
      field: billed_amount
      filters:
        request_status: received
    - category: residency
      table: residency_events
      aggregate: latest
      field: inspection_outcome
      filters:
        event_type: residency_inspection_result
    - category: maturity
      table: maturity_case_events
      aggregate: latest
      field: effective_date
      filters:
        event_type: maturity_extension_granted
    cross_category:
    - hecm
    - jumbo
    - setaside
    - residency
    - maturity
- id: payoff_ext_retention_statement_balance
  base_policy_refs:
  - payoff_statement_terms
  - payoff_sale_review
  overwrite:
  - base_policy: payoff_statement_terms
    superseded_clause: A statement is issued within payoff_statement_business_days business days of the request at a fee of payoff_statement_fee, with statement_date
      the issue date and statement_good_through_date statement_good_through_days calendar days later.
    replaced_by: A statement is issued within payoff_statement_business_days business days of the request at a fee of payoff_statement_fee, with statement_date
      the issue date; every statement other than a retention statement has its statement_good_through_date statement_good_through_days calendar days after
      its statement_date, and a retention statement, the statement on the payoff case of a Borrower Voluntary Payoff requested by the borrower of record
      on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred, has its statement_good_through_date at the statement date
      plus the statement window days.
  - base_policy: payoff_statement_terms
    superseded_clause: the statement_balance is the balance on the statement date plus the per diem for each day from the statement date to the good-through
      date.
    replaced_by: Every statement other than a retention statement and a short-sale statement keeps its statement_balance as the balance on the statement
      date plus the per diem for each day from the statement date to the good-through date; a retention statement, the statement on the payoff case of a
      Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred,
      carries the retention statement balance as its statement_balance.
  trigger: on_request
  subject:
  - payoff_terms_issued
  computes: statement_balance
  target_tool: issue_retention_payoff_statement_a856e53a
  params:
    foreclosure_window_days: 15
    maintenance_flat_association: 120.0
    maintenance_monthly: 55.0
  rule: 'This policy sets the retention statement balance and good-through date on the payoff case of a Borrower Voluntary Payoff requested by the borrower
    of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred, issued to the borrower of record. A statement
    is issued within payoff_statement_business_days business days of the request at a fee of payoff_statement_fee, with statement_date the issue date; every
    statement other than a retention statement has its statement_good_through_date statement_good_through_days calendar days after its statement_date, and
    a retention statement, the statement on the payoff case of a Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity
    case is due_and_payable, extension_period or foreclosure_referred, has its statement_good_through_date at the statement date plus the statement window
    days. Every statement other than a retention statement and a short-sale statement keeps its statement_balance as the balance on the statement date plus
    the per diem for each day from the statement date to the good-through date; a retention statement, the statement on the payoff case of a Borrower Voluntary
    Payoff requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred, carries the retention
    statement balance as its statement_balance. The retention statement balance is fixed only after the payoff case carries a recorded per diem for the
    statement date. Under the standard rule, the retention statement balance is the loan''s principal_balance plus the retention accrual charge plus five
    statement charges, the statement tax disbursement, the statement hazard disbursement, the statement flood disbursement, the statement servicing fee
    and the statement maintenance charge, rounded half up to the cent and only at that last step. The retention accrual charge is the per diem the payoff
    case carries times the retention accrual days, which are the calendar days from the effective_date of the latest posted interest accrual on the loan
    to the statement date, 0 for a loan with no posted interest accrual, plus the statement window days. Under the standard rule the statement window days
    are statement_good_through_days, and the statement tax disbursement, the statement hazard disbursement, the statement flood disbursement, the statement
    servicing fee and the statement maintenance charge are each 0.00. The statement_good_through_date is the statement date plus the statement window days.
    The statement window days are instead foreclosure_window_days when the maturity case''s status is foreclosure_referred, and the calendar days from the
    statement date to the case''s resolution_deadline when its status is extension_period and that deadline falls on or after the statement date and fewer
    than statement_good_through_days calendar days after it; every other case keeps statement_good_through_days. A statement bill is, for each of property_tax_bill,
    hazard_insurance_bill and flood_insurance_bill, the received bill of that type with the latest due_date on the set-aside that pays the loan''s property
    charges, an active Fully Funded LESA (Mandatory), an active Fully Funded LESA (Borrower-Elected) or an active Summit Tax and Insurance Reserve, when
    its payment date falls no later than statement_good_through_days calendar days after the statement date; a bill''s payment date is its due_date less
    the set-aside plan''s tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days for a hazard or flood bill. Where several such bills
    of one type share that latest due_date, their billed_amounts are taken together as that type''s bill. The statement tax disbursement is instead the
    statement bill of type property_tax_bill limited to the set-aside''s setaside_balance when that set-aside is a Fully Funded LESA, and that bill in full
    when it is a Summit Tax and Insurance Reserve, whose shortfall_source pays any part above its balance at once as a corporate advance; a loan with no
    such bill or no such set-aside keeps 0.00. The statement hazard disbursement is instead the statement bill of type hazard_insurance_bill limited to
    the set-aside''s setaside_balance less its statement bill of type property_tax_bill, not below 0.00, when that set-aside is a Fully Funded LESA, and
    that hazard bill in full when it is a Summit Tax and Insurance Reserve; a loan with no such bill or no such set-aside keeps 0.00. The statement flood
    disbursement is instead the statement bill of type flood_insurance_bill limited to the set-aside''s setaside_balance less its statement bills of types
    property_tax_bill and hazard_insurance_bill, not below 0.00, when that set-aside is a Fully Funded LESA, and that flood bill in full when it is a Summit
    Tax and Insurance Reserve; a loan with no such bill or no such set-aside keeps 0.00. The statement servicing fee is instead, for a HECM whose servicing_fee_option
    is monthly_fee_with_setaside, the servicing_fee_monthly_adjustable of its payout plan when its rate_type is monthly_adjustable, or the servicing_fee_annual_or_fixed
    of its payout plan when its rate_type is annual_adjustable or fixed, for each fee month still to post; a HECM whose servicing fee is included_in_rate,
    and a Summit loan, keep 0.00. The fee months still to post are the whole calendar months from the first day of the latest accrual_period among the posted
    hecm_servicing_fee entries on the loan to the statement date, 0 for a loan with no posted servicing fee. The statement maintenance charge is instead
    figured from the latest residency_inspection_result on the loan''s occupancy profile, and only where the maturity case''s plan has vacant_property_securing
    true: when that result found the home vacant and the loan''s property_type is fha_approved_condominium or planned_unit_development it is maintenance_flat_association;
    when it found the home vacant and the property is of any other type, or is a Summit loan, which records no property_type, it is maintenance_monthly
    for each statement month of vacancy; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00. The statement months
    of vacancy are the whole calendar months from the occupancy profile''s nonoccupancy_date to the statement date, not below 0, plus one; a profile with
    no nonoccupancy_date counts one month. Where several residency_inspection_result entries on the occupancy profile share the latest effective_date, a
    vacant finding among them counts as the latest result, and otherwise an unable_to_determine finding does.'
  prerequisite:
  - problem: payoff_ext_retention_daily_accrual
    kind: value_input
    gate: per_diem_on_case
    form: state
    policy_source: The retention statement balance is fixed only after the payoff case carries a recorded per diem for the statement date.
    condition: payoff_cases.per_diem_amount carries the retention daily accrual recorded for the statement date (not 0.00).
    resolved_by: record_payoff_daily_accrual_16b003bd
    effect: The per diem the retention accrual charge multiplies changes from 0.00 to the recorded retention daily accrual.
  cross_category:
  - category: hecm
    as: history
    reads:
    - principal_balance
    - servicing_fee_option
    - rate_type
    - property_type
    - hecm_transactions.effective_date
    - hecm_transactions.accrual_period
    note: Balance, interest and fee postings, fee option and property type of a HECM.
  - category: jumbo
    as: history
    reads:
    - principal_balance
    - jumbo_transactions.effective_date
    note: Balance and interest postings of a Summit loan.
  - category: setaside
    as: branch
    reads:
    - variant_name
    - status
    - setaside_balance
    - tax_payment_lead_days
    - insurance_payment_lead_days
    - setaside_requests.due_date
    - setaside_requests.billed_amount
    note: The property-charge set-aside and its received bills decide the three statement disbursements.
  - category: residency
    as: history
    reads:
    - residency_profile_id
    - nonoccupancy_date
    - residency_events.inspection_outcome
    note: The latest inspection result on the loan profile decides the statement maintenance charge.
  - category: maturity
    as: branch
    reads:
    - status
    - resolution_deadline
    - vacant_property_securing
    note: The maturity case decides the statement window days and whether securing is permitted.
  compute:
  - per_diem_on_case: F('per_diem_amount')
  - posted_balance: CFIELD('hecm', 'principal_balance', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('jumbo', 'principal_balance',
      jumbo_loan_id=F('jumbo_loan_id'))
  - last_interest_date: XLATEST('hecm', 'hecm_transactions', 'effective_date', date_field='effective_date', event_type='hecm_interest_accrual', hecm_loan_id=F('hecm_loan_id'))
      if F('loan_program') == 'hecm' else XLATEST('jumbo', 'jumbo_transactions', 'effective_date', date_field='effective_date', event_type='jumbo_interest_accrual',
      jumbo_loan_id=F('jumbo_loan_id'))
  - elapsed_days: DAYS(last_interest_date, NOW) if last_interest_date else 0
  - maturity_status: CFIELD('maturity', 'status', maturity_case_id=F('maturity_case_id'))
  - resolution_deadline: CFIELD('maturity', 'resolution_deadline', maturity_case_id=F('maturity_case_id'))
  - window_days: K('foreclosure_window_days') if maturity_status == 'foreclosure_referred' else (DAYS(NOW, resolution_deadline) if maturity_status == 'extension_period'
      and resolution_deadline and DAYS(NOW, resolution_deadline) >= 0 and DAYS(NOW, resolution_deadline) < P('statement_good_through_days') else P('statement_good_through_days'))
  - accrual_days: elapsed_days + window_days
  - tx_ff: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Mandatory)', status='active') or CFIELD('setaside',
      'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Borrower-Elected)', status='active')
  - tx_res: CFIELD('setaside', 'setaside_id', jumbo_loan_id=F('jumbo_loan_id'), variant_name='Summit Tax and Insurance Reserve', status='active')
  - tx_sa: tx_ff or tx_res
  - tx_bal: CFIELD('setaside', 'setaside_balance', setaside_id=tx_sa) if tx_sa else 0
  - tx_tlead: CPARAM('setaside', 'tax_payment_lead_days', setaside_id=tx_sa) if tx_sa else 0
  - tx_ilead: CPARAM('setaside', 'insurance_payment_lead_days', setaside_id=tx_sa) if tx_sa else 0
  - tx_tdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=tx_sa, request_type='property_tax_bill', request_status='received')
      if tx_sa else None
  - tx_tamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=tx_sa, request_type='property_tax_bill', request_status='received', due_date=tx_tdue)
      if tx_sa and tx_tdue else 0
  - tx_tq: tx_tamt if tx_tdue and DAYS(NOW, tx_tdue) - tx_tlead <= P('statement_good_through_days') else 0
  - statement_tax: MN(tx_tq, tx_bal) if tx_ff else (tx_tq if tx_res else 0)
  - hz_ff: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Mandatory)', status='active') or CFIELD('setaside',
      'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Borrower-Elected)', status='active')
  - hz_res: CFIELD('setaside', 'setaside_id', jumbo_loan_id=F('jumbo_loan_id'), variant_name='Summit Tax and Insurance Reserve', status='active')
  - hz_sa: hz_ff or hz_res
  - hz_bal: CFIELD('setaside', 'setaside_balance', setaside_id=hz_sa) if hz_sa else 0
  - hz_tlead: CPARAM('setaside', 'tax_payment_lead_days', setaside_id=hz_sa) if hz_sa else 0
  - hz_ilead: CPARAM('setaside', 'insurance_payment_lead_days', setaside_id=hz_sa) if hz_sa else 0
  - hz_tdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=hz_sa, request_type='property_tax_bill', request_status='received')
      if hz_sa else None
  - hz_tamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=hz_sa, request_type='property_tax_bill', request_status='received', due_date=hz_tdue)
      if hz_sa and hz_tdue else 0
  - hz_tq: hz_tamt if hz_tdue and DAYS(NOW, hz_tdue) - hz_tlead <= P('statement_good_through_days') else 0
  - hz_hdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=hz_sa, request_type='hazard_insurance_bill', request_status='received')
      if hz_sa else None
  - hz_hamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=hz_sa, request_type='hazard_insurance_bill', request_status='received',
      due_date=hz_hdue) if hz_sa and hz_hdue else 0
  - hz_hq: hz_hamt if hz_hdue and DAYS(NOW, hz_hdue) - hz_ilead <= P('statement_good_through_days') else 0
  - statement_hazard: MN(hz_hq, MX(0, hz_bal - hz_tq)) if hz_ff else (hz_hq if hz_res else 0)
  - fl_ff: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Mandatory)', status='active') or CFIELD('setaside',
      'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Borrower-Elected)', status='active')
  - fl_res: CFIELD('setaside', 'setaside_id', jumbo_loan_id=F('jumbo_loan_id'), variant_name='Summit Tax and Insurance Reserve', status='active')
  - fl_sa: fl_ff or fl_res
  - fl_bal: CFIELD('setaside', 'setaside_balance', setaside_id=fl_sa) if fl_sa else 0
  - fl_tlead: CPARAM('setaside', 'tax_payment_lead_days', setaside_id=fl_sa) if fl_sa else 0
  - fl_ilead: CPARAM('setaside', 'insurance_payment_lead_days', setaside_id=fl_sa) if fl_sa else 0
  - fl_tdue: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=fl_sa, request_type='property_tax_bill', request_status='received')
      if fl_sa else None
  - fl_tamt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=fl_sa, request_type='property_tax_bill', request_status='received', due_date=fl_tdue)
