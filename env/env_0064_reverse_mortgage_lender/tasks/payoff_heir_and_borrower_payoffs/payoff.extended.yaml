      a bill's payment date is its due_date less the set-aside plan's tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days for
      a hazard or flood bill, and a type with no received bill adds nothing. Where several such bills of one type share that latest due_date, their billed_amounts
      are taken together as that type's bill.
    qualifying_bills: A short-sale bill is, for each of property_tax_bill, hazard_insurance_bill and flood_insurance_bill, the received bill of that type
      on the set-aside with the latest due_date, when its payment date falls no later than statement_good_through_days calendar days after the statement
      date; a bill's payment date is its due_date less the set-aside plan's tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days
      for a hazard or flood bill, and a type with no received bill adds nothing. Where several such bills of one type share that latest due_date, their
      billed_amounts are taken together as that type's bill.
    setaside_carry: 'The short-sale set-aside carry is instead figured from the set-aside on the loan that pays its property charges: for a loan with an
      active Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale bills, limited to its setaside_balance;
      for a loan with an active Summit Tax and Insurance Reserve it is the sum of that reserve''s short-sale bills in full, because the reserve''s shortfall_source
      pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00.'
    se_profile: The short-sale securing carry is instead securing_fee_vacant when the latest residency_inspection_result on the loan's occupancy profile
      found the home vacant and securing_fee_unconfirmed when that result was unable_to_determine, in each case only where the maturity case's plan has
      vacant_property_securing true; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00.
    se_result: Where several residency_inspection_result entries on the occupancy profile share the latest effective_date, a vacant finding among them counts
      as the latest result, and otherwise an unable_to_determine finding does.
    se_allowed: The short-sale securing carry is instead securing_fee_vacant when the latest residency_inspection_result on the loan's occupancy profile
      found the home vacant and securing_fee_unconfirmed when that result was unable_to_determine, in each case only where the maturity case's plan has
      vacant_property_securing true; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00.
    securing_carry: The short-sale securing carry is instead securing_fee_vacant when the latest residency_inspection_result on the loan's occupancy profile
      found the home vacant and securing_fee_unconfirmed when that result was unable_to_determine, in each case only where the maturity case's plan has
      vacant_property_securing true; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00.
    ma_profile: 'The short-sale maintenance carry is instead figured from the latest residency_inspection_result on the loan''s occupancy profile, and only
      where the maturity case''s plan has vacant_property_securing true: when that result found the home vacant and the loan''s property_type is fha_approved_condominium
      or planned_unit_development it is the flat maintenance_flat_association; when it found the home vacant and the property is of any other type, or is
      a Summit loan, which records no property_type, it is maintenance_monthly for each short-sale month of vacancy; any other result, no result, or a plan
      whose vacant_property_securing is false keeps 0.00.'
    ma_status: Where several residency_inspection_result entries on the occupancy profile share the latest effective_date, a vacant finding among them counts
      as the latest result, and otherwise an unable_to_determine finding does.
    ma_allowed: 'The short-sale maintenance carry is instead figured from the latest residency_inspection_result on the loan''s occupancy profile, and only
      where the maturity case''s plan has vacant_property_securing true: when that result found the home vacant and the loan''s property_type is fha_approved_condominium
      or planned_unit_development it is the flat maintenance_flat_association; when it found the home vacant and the property is of any other type, or is
      a Summit loan, which records no property_type, it is maintenance_monthly for each short-sale month of vacancy; any other result, no result, or a plan
      whose vacant_property_securing is false keeps 0.00.'
    ma_type: 'The short-sale maintenance carry is instead figured from the latest residency_inspection_result on the loan''s occupancy profile, and only
      where the maturity case''s plan has vacant_property_securing true: when that result found the home vacant and the loan''s property_type is fha_approved_condominium
      or planned_unit_development it is the flat maintenance_flat_association; when it found the home vacant and the property is of any other type, or is
      a Summit loan, which records no property_type, it is maintenance_monthly for each short-sale month of vacancy; any other result, no result, or a plan
      whose vacant_property_securing is false keeps 0.00.'
    ma_nonocc: The short-sale months of vacancy are the whole calendar months from the occupancy profile's nonoccupancy_date to the statement date, not
      below 0, plus one; a profile with no nonoccupancy_date counts one month.
    ma_months: The short-sale months of vacancy are the whole calendar months from the occupancy profile's nonoccupancy_date to the statement date, not
      below 0, plus one; a profile with no nonoccupancy_date counts one month.
    maintenance_carry: 'The short-sale maintenance carry is instead figured from the latest residency_inspection_result on the loan''s occupancy profile,
      and only where the maturity case''s plan has vacant_property_securing true: when that result found the home vacant and the loan''s property_type is
      fha_approved_condominium or planned_unit_development it is the flat maintenance_flat_association; when it found the home vacant and the property is
      of any other type, or is a Summit loan, which records no property_type, it is maintenance_monthly for each short-sale month of vacancy; any other
      result, no result, or a plan whose vacant_property_securing is false keeps 0.00.'
    dp_property_type: The short-sale called-due appraisal carry is instead appraisal_fee_two_to_four for a two_to_four_unit property and appraisal_fee_condo_manufactured
      for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan, keeps appraisal_fee_standard.
    dp_appraisal_carry: The short-sale called-due appraisal carry is instead appraisal_fee_two_to_four for a two_to_four_unit property and appraisal_fee_condo_manufactured
      for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan, keeps appraisal_fee_standard.
    appraisal_date: The short-sale replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after
      the effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after
      it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    called_due_date: The short-sale replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after
      the effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after
      it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    appraisal_order_days: The short-sale replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or
      after the effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days
      after it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    last_extension_date: The short-sale replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or
      after the effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days
      after it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    replacement_carry: The short-sale replacement appraisal carry is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after
      the effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after
      it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    maturity_status: The short-sale foreclosure carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its
      referral_date is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    referral_date: The short-sale foreclosure carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its
      referral_date is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    referral_age: The short-sale foreclosure carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    foreclosure_carry: The short-sale foreclosure carry is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and
      its referral_date is at least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is
      foreclosure_referred and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status
      keeps 0.00.
    accrual_basis: 'The short-sale accrual basis is the loan''s principal_balance plus six carried advances: the short-sale set-aside carry, the short-sale
      securing carry, the short-sale maintenance carry, the short-sale called-due appraisal carry, the short-sale replacement appraisal carry and the short-sale
      foreclosure carry.'
    result: Under the standard rule, the short-sale daily accrual is the short-sale accrual basis times the loan's daily accrual rate, rounded half up to
      the cent and only at that last step.
  factors:
  - id: short_sale_setaside_carry
    effect: method
    decides: setaside_carry
    bindings:
    - ff_lesa_id
    - reserve_id
    - sa_id
    - sa_balance
    - tax_lead
    - ins_lead
    - tax_due
    - tax_amt
    - haz_due
    - haz_amt
    - fld_due
    - fld_amt
    - qualifying_bills
    - setaside_carry
    ladder:
    - when: an active Fully Funded LESA (Mandatory or Borrower-Elected) on the loan
      method: sum the set-aside's short-sale bills and limit the sum to its setaside_balance
    - when: an active Summit Tax and Insurance Reserve on the loan
      method: sum the reserve's short-sale bills in full, the part above its balance being paid at once as a corporate advance
    - when: otherwise
      method: carry nothing (0.00)
    baseline:
      setaside_carry: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: setaside
  - id: short_sale_securing_carry
    effect: parameter
    decides: securing_carry
    bindings:
    - se_profile
    - se_result
    - se_allowed
    - securing_carry
    ladder:
    - when: securing permitted and the latest inspection found the home vacant
      value: securing_fee_vacant
    - when: securing permitted and the latest inspection was unable_to_determine
      value: securing_fee_unconfirmed
    - when: otherwise
      value: '0.00'
    baseline:
      securing_carry: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: short_sale_maintenance_carry
    effect: method
    decides: maintenance_carry
    bindings:
    - ma_profile
    - ma_status
    - ma_allowed
    - ma_type
    - ma_nonocc
    - ma_months
    - maintenance_carry
    ladder:
    - when: securing permitted, latest inspection found the home vacant, fha_approved_condominium or planned_unit_development
      method: the flat maintenance_flat_association
    - when: securing permitted, latest inspection found the home vacant, any other property type
      method: maintenance_monthly times the short-sale months of vacancy
    - when: otherwise
      method: carry nothing (0.00)
    baseline:
      maintenance_carry: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: residency
  - id: short_sale_called_due_appraisal_carry
    effect: parameter
    decides: dp_appraisal_carry
    bindings:
    - dp_property_type
    - dp_appraisal_carry
    ladder:
    - when: two_to_four_unit property
      value: appraisal_fee_two_to_four
    - when: fha_approved_condominium or manufactured_home property
      value: appraisal_fee_condo_manufactured
    - when: otherwise
      value: appraisal_fee_standard
    baseline:
      dp_appraisal_carry: K('appraisal_fee_standard')
    evidence:
    - cross_category
    cross_difficulty: hecm
  - id: short_sale_replacement_appraisal_carry
    effect: parameter
    decides: replacement_carry
    bindings:
    - appraisal_date
    - called_due_date
    - appraisal_order_days
    - last_extension_date
    - replacement_carry
    ladder:
    - when: appraisal dated within appraisal_order_days on or after the latest granted extension
      value: update_appraisal_fee
    - when: otherwise an appraisal dated more than appraisal_order_days after the due-and-payable date
      value: replacement_appraisal_fee
    - when: otherwise
      value: '0.00'
    baseline:
      replacement_carry: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: maturity
  - id: short_sale_foreclosure_carry
    effect: parameter
    decides: foreclosure_carry
    bindings:
    - maturity_status
    - referral_date
    - referral_age
    - foreclosure_carry
    ladder:
    - when: foreclosure_referred and referred at least first_legal_action_days before the statement date
      value: foreclosure_charges_full
    - when: foreclosure_referred and referred fewer days before
      value: foreclosure_charges_initial
    - when: otherwise
      value: '0.00'
    baseline:
      foreclosure_carry: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  baseline:
    rule: 'Under the standard rule, the short-sale daily accrual is the short-sale accrual basis times the loan''s daily accrual rate, rounded half up to
      the cent and only at that last step. The loan''s daily accrual rate for a short sale is its note_rate_pct plus, for a HECM, the annual_mip_rate_pct
      of its payout plan, divided by 100 and by per_diem_day_count; a Summit loan carries no MIP. The short-sale accrual basis is the loan''s principal_balance
      plus six carried advances: the short-sale set-aside carry, the short-sale securing carry, the short-sale maintenance carry, the short-sale called-due
      appraisal carry, the short-sale replacement appraisal carry and the short-sale foreclosure carry. Under the standard rule the short-sale set-aside
      carry, the short-sale securing carry, the short-sale maintenance carry, the short-sale replacement appraisal carry and the short-sale foreclosure
      carry are each 0.00, and the short-sale called-due appraisal carry is appraisal_fee_standard.'
    params:
    - appraisal_fee_standard
  inputs:
    history:
    - category: setaside
      table: setaside_requests
      aggregate: latest
      field: billed_amount
      filters:
        request_status: received
    - category: residency
      table: residency_events
      aggregate: latest
      field: inspection_outcome
      filters:
        event_type: residency_inspection_result
    - category: maturity
      table: maturity_case_events
      aggregate: latest
      field: effective_date
      filters:
        event_type: maturity_extension_granted
    cross_category:
    - hecm
    - jumbo
    - setaside
    - residency
    - maturity
- id: payoff_ext_sale_statement_balance
  base_policy_refs:
  - payoff_statement_terms
  - payoff_sale_review
  overwrite:
  - base_policy: payoff_statement_terms
    superseded_clause: 'Terms are issued only to a requester the plan''s statement_recipients allow: the borrower, a confirmed successor in interest (profile_type
      successor_in_interest linked to the borrower) where successor_confirmation_required is true, or a title company or new lender holding the borrower''s
      written authorization where third_party_authorization_accepted is true; any other request is declined with reason requester_not_authorized.'
    replaced_by: 'Terms are issued only to a requester the plan''s statement_recipients allow: the borrower, a confirmed successor in interest (profile_type
      successor_in_interest linked to the borrower) where successor_confirmation_required is true, or a title company or new lender holding the borrower''s
      written authorization where third_party_authorization_accepted is true, and in addition to the borrower of record on the payoff case of an Approved
      Short Sale Payoff requested by the borrower of record; any other request is declined with reason requester_not_authorized.'
  - base_policy: payoff_statement_terms
    superseded_clause: the statement_balance is the balance on the statement date plus the per diem for each day from the statement date to the good-through
      date.
    replaced_by: Every statement other than a retention statement and a short-sale statement keeps its statement_balance as the balance on the statement
      date plus the per diem for each day from the statement date to the good-through date; a short-sale statement, the statement on the payoff case of
      an Approved Short Sale Payoff requested by the borrower of record, carries the short-sale statement balance as its statement_balance.
  trigger: on_request
  subject:
  - payoff_terms_issued
  computes: statement_balance
  target_tool: issue_sale_payoff_statement_764045f1
  params:
    appraisal_fee_standard: 475.0
    appraisal_fee_condo_manufactured: 550.0
    appraisal_fee_two_to_four: 650.0
    update_appraisal_fee: 295.0
    replacement_appraisal_fee: 395.0
    securing_fee_vacant: 285.0
    securing_fee_unconfirmed: 85.0
    maintenance_flat_association: 120.0
    maintenance_monthly: 55.0
    foreclosure_charges_full: 2525.0
    foreclosure_charges_initial: 875.0
    first_legal_action_days: 30
  rule: 'This policy sets the short-sale statement balance on the payoff case of an Approved Short Sale Payoff requested by the borrower of record, issued
    to that borrower, whose good-through date is statement_good_through_days calendar days after the statement date. Terms are issued only to a requester
    the plan''s statement_recipients allow: the borrower, a confirmed successor in interest (profile_type successor_in_interest linked to the borrower)
    where successor_confirmation_required is true, or a title company or new lender holding the borrower''s written authorization where third_party_authorization_accepted
    is true, and in addition to the borrower of record on the payoff case of an Approved Short Sale Payoff requested by the borrower of record; any other
    request is declined with reason requester_not_authorized. Every statement other than a retention statement and a short-sale statement keeps its statement_balance
    as the balance on the statement date plus the per diem for each day from the statement date to the good-through date; a short-sale statement, the statement
    on the payoff case of an Approved Short Sale Payoff requested by the borrower of record, carries the short-sale statement balance as its statement_balance.
    The short-sale statement balance is fixed only after the payoff case carries a recorded per diem for the statement date. Under the standard rule, the
    short-sale statement balance is the loan''s principal_balance plus the short-sale accrual charge plus six short-sale statement charges, the short-sale
    statement set-aside disbursement, the short-sale statement servicing fee, the short-sale statement preservation charge, the short-sale statement called-due
    appraisal charge, the short-sale statement replacement appraisal charge and the short-sale statement foreclosure charge, rounded half up to the cent
    and only at that last step. The short-sale accrual charge is the per diem the payoff case carries times the short-sale accrual days, which are the calendar
    days from the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual,
    plus statement_good_through_days. Under the standard rule the short-sale statement called-due appraisal charge is appraisal_fee_standard and the other
    five short-sale statement charges are each 0.00. The short-sale statement set-aside disbursement is instead figured from the set-aside on the loan that
    pays its property charges: for an active Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale
    statement bills limited to its setaside_balance; for an active Summit Tax and Insurance Reserve it is the sum of its short-sale statement bills in full,
    because the reserve''s shortfall_source pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00. A short-sale
    statement bill is, for each of property_tax_bill, hazard_insurance_bill and flood_insurance_bill, the received bill of that type on the set-aside with
    the latest due_date, when its payment date, its due_date less the set-aside plan''s tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days
    for a hazard or flood bill, falls no later than the good-through date; a type with no received bill adds nothing. Where several such bills of one type
    share that latest due_date, their billed_amounts are taken together as that type''s bill. The short-sale statement servicing fee is instead, for a HECM
    whose servicing_fee_option is monthly_fee_with_setaside, the servicing_fee_monthly_adjustable of its payout plan when its rate_type is monthly_adjustable,
    or the servicing_fee_annual_or_fixed of its payout plan when its rate_type is annual_adjustable or fixed, for each short-sale fee month still to post;
    a HECM whose servicing fee is included_in_rate, and a Summit loan, keep 0.00. The short-sale fee months still to post are the whole calendar months
    from the first day of the latest accrual_period among the posted hecm_servicing_fee entries on the loan to the statement date, 0 for a loan with no
    posted servicing fee. The short-sale statement preservation charge is instead figured from the latest residency_inspection_result on the loan''s occupancy
    profile, and only where the maturity case''s plan has vacant_property_securing true: when that result found the home vacant and the loan''s property_type
    is fha_approved_condominium or planned_unit_development it is securing_fee_vacant plus maintenance_flat_association; when it found the home vacant and
    the property is of any other type, or is a Summit loan, it is securing_fee_vacant plus maintenance_monthly for each statement month of vacancy; when
    the result was unable_to_determine it is securing_fee_unconfirmed; any other result, no result, or a plan whose vacant_property_securing is false keeps
    0.00. The statement months of vacancy for a short sale are the whole calendar months from the occupancy profile''s nonoccupancy_date to the statement
    date, not below 0, plus one; a profile with no nonoccupancy_date counts one month. The short-sale statement called-due appraisal charge is instead appraisal_fee_two_to_four
    for a two_to_four_unit property and appraisal_fee_condo_manufactured for an fha_approved_condominium or manufactured_home property; every other property,
    and a Summit loan, keeps appraisal_fee_standard. The short-sale statement replacement appraisal charge is instead update_appraisal_fee when the maturity
    case''s appraisal_date falls on or after the effective_date of the case''s latest maturity_extension_granted entry and no more than the case plan''s
    appraisal_order_days calendar days after it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days
    calendar days after the case''s due_and_payable_date; a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00. The short-sale
    statement foreclosure charge is instead foreclosure_charges_full when the maturity case''s status is foreclosure_referred and its referral_date is at
    least first_legal_action_days calendar days before the statement date, and foreclosure_charges_initial when its status is foreclosure_referred and it
    was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00. Where several
    residency_inspection_result entries on the occupancy profile share the latest effective_date, a vacant finding among them counts as the latest result,
    and otherwise an unable_to_determine finding does.'
  prerequisite:
  - problem: payoff_ext_sale_daily_accrual
    kind: value_input
    gate: per_diem_on_case
    form: state
    policy_source: The short-sale statement balance is fixed only after the payoff case carries a recorded per diem for the statement date.
    condition: payoff_cases.per_diem_amount carries the short-sale daily accrual recorded for the statement date (not 0.00).
    resolved_by: record_sale_daily_accrual_1c6aaad4
    effect: The per diem the short-sale accrual charge multiplies changes from 0.00 to the recorded short-sale daily accrual.
  cross_category:
  - category: hecm
    as: history
    reads:
    - principal_balance
    - servicing_fee_option
    - rate_type
    - property_type
    - hecm_transactions.effective_date
    - hecm_transactions.accrual_period
    note: Balance, postings, fee option and property type of a HECM.
  - category: jumbo
    as: history
    reads:
    - principal_balance
    - jumbo_transactions.effective_date
    note: Balance and interest postings of a Summit loan.
  - category: setaside
    as: branch
    reads:
    - variant_name
    - status
    - setaside_balance
    - tax_payment_lead_days
    - insurance_payment_lead_days
    - setaside_requests.due_date
    - setaside_requests.billed_amount
    note: The property-charge set-aside and its received bills decide the statement set-aside disbursement.
  - category: residency
    as: history
    reads:
    - residency_profile_id
    - nonoccupancy_date
    - residency_events.inspection_outcome
    note: The latest inspection result decides the preservation charge.
  - category: maturity
    as: history
    reads:
    - status
    - referral_date
    - appraisal_date
    - due_and_payable_date
    - vacant_property_securing
    - appraisal_order_days
    - maturity_case_events.effective_date
    note: The maturity case decides the appraisal, preservation and foreclosure charges.
  compute:
  - per_diem_on_case: F('per_diem_amount')
  - posted_balance: CFIELD('hecm', 'principal_balance', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('jumbo', 'principal_balance',
      jumbo_loan_id=F('jumbo_loan_id'))
  - last_interest_date: XLATEST('hecm', 'hecm_transactions', 'effective_date', date_field='effective_date', event_type='hecm_interest_accrual', hecm_loan_id=F('hecm_loan_id'))
      if F('loan_program') == 'hecm' else XLATEST('jumbo', 'jumbo_transactions', 'effective_date', date_field='effective_date', event_type='jumbo_interest_accrual',
      jumbo_loan_id=F('jumbo_loan_id'))
  - elapsed_days: DAYS(last_interest_date, NOW) if last_interest_date else 0
  - accrual_days: elapsed_days + P('statement_good_through_days')
  - ff_lesa_id: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Mandatory)', status='active') or CFIELD('setaside',
      'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Borrower-Elected)', status='active')
  - reserve_id: CFIELD('setaside', 'setaside_id', jumbo_loan_id=F('jumbo_loan_id'), variant_name='Summit Tax and Insurance Reserve', status='active')
  - sa_id: ff_lesa_id or reserve_id
  - sa_balance: CFIELD('setaside', 'setaside_balance', setaside_id=sa_id) if sa_id else 0
  - tax_lead: CPARAM('setaside', 'tax_payment_lead_days', setaside_id=sa_id) if sa_id else 0
  - ins_lead: CPARAM('setaside', 'insurance_payment_lead_days', setaside_id=sa_id) if sa_id else 0
  - tax_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='property_tax_bill', request_status='received')
      if sa_id else None
  - tax_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='property_tax_bill', request_status='received', due_date=tax_due)
      if sa_id and tax_due else 0
  - haz_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='hazard_insurance_bill', request_status='received')
      if sa_id else None
  - haz_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='hazard_insurance_bill', request_status='received',
      due_date=haz_due) if sa_id and haz_due else 0
  - fld_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='flood_insurance_bill', request_status='received')
      if sa_id else None
  - fld_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='flood_insurance_bill', request_status='received', due_date=fld_due)
      if sa_id and fld_due else 0
  - qualifying_bills: (tax_amt if tax_due and DAYS(NOW, tax_due) - tax_lead <= P('statement_good_through_days') else 0) + (haz_amt if haz_due and DAYS(NOW,
      haz_due) - ins_lead <= P('statement_good_through_days') else 0) + (fld_amt if fld_due and DAYS(NOW, fld_due) - ins_lead <= P('statement_good_through_days')
      else 0)
  - statement_setaside: MN(qualifying_bills, sa_balance) if ff_lesa_id else (qualifying_bills if reserve_id else 0)
  - fee_option: CFIELD('hecm', 'servicing_fee_option', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - rate_type: CFIELD('hecm', 'rate_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - fee_period: XLATEST('hecm', 'hecm_transactions', 'accrual_period', date_field='accrual_period', event_type='hecm_servicing_fee', hecm_loan_id=F('hecm_loan_id'))
      if F('loan_program') == 'hecm' else None
  - fee_months: MONTHS(fee_period + '-01', NOW) if fee_period else 0
  - fee_per_month: CPARAM('hecm', 'servicing_fee_monthly_adjustable', hecm_loan_id=F('hecm_loan_id')) if fee_option == 'monthly_fee_with_setaside' and rate_type
      == 'monthly_adjustable' else (CPARAM('hecm', 'servicing_fee_annual_or_fixed', hecm_loan_id=F('hecm_loan_id')) if fee_option == 'monthly_fee_with_setaside'
      and (rate_type == 'annual_adjustable' or rate_type == 'fixed') else 0)
  - statement_fee: fee_per_month * fee_months
  - profile_id: CFIELD('residency', 'residency_profile_id', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('residency', 'residency_profile_id',
      jumbo_loan_id=F('jumbo_loan_id'))
  - inspection_result: ('vacant' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='vacant', residency_profile_id=profile_id,
      effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result', residency_profile_id=profile_id))
      > 0 else ('unable_to_determine' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='unable_to_determine',
      residency_profile_id=profile_id, effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=profile_id)) > 0 else XLATEST('residency', 'residency_events', 'inspection_outcome', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=profile_id))) if profile_id else None
  - securing_allowed: CPARAM('maturity', 'vacant_property_securing', maturity_case_id=F('maturity_case_id'))
  - property_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - nonocc_date: CFIELD('residency', 'nonoccupancy_date', residency_profile_id=profile_id) if profile_id else None
  - vacancy_months: (MX(0, MONTHS(nonocc_date, NOW)) if nonocc_date else 0) + 1
  - statement_preservation: (K('securing_fee_vacant') + K('maintenance_flat_association')) if securing_allowed and inspection_result == 'vacant' and (property_type
      == 'fha_approved_condominium' or property_type == 'planned_unit_development') else ((K('securing_fee_vacant') + K('maintenance_monthly') * vacancy_months)
      if securing_allowed and inspection_result == 'vacant' else (K('securing_fee_unconfirmed') if securing_allowed and inspection_result == 'unable_to_determine'
      else 0))
  - dp_property_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - statement_dp_appraisal: K('appraisal_fee_two_to_four') if dp_property_type == 'two_to_four_unit' else (K('appraisal_fee_condo_manufactured') if dp_property_type
      == 'fha_approved_condominium' or dp_property_type == 'manufactured_home' else K('appraisal_fee_standard'))
  - appraisal_date: CFIELD('maturity', 'appraisal_date', maturity_case_id=F('maturity_case_id'))
  - called_due_date: CFIELD('maturity', 'due_and_payable_date', maturity_case_id=F('maturity_case_id'))
  - appraisal_order_days: CPARAM('maturity', 'appraisal_order_days', maturity_case_id=F('maturity_case_id'))
  - last_extension_date: XLATEST('maturity', 'maturity_case_events', 'effective_date', date_field='effective_date', event_type='maturity_extension_granted',
      maturity_case_id=F('maturity_case_id'))
  - statement_replacement: K('update_appraisal_fee') if appraisal_date and last_extension_date and DAYS(last_extension_date, appraisal_date) >= 0 and DAYS(last_extension_date,
      appraisal_date) <= appraisal_order_days else (K('replacement_appraisal_fee') if appraisal_date and called_due_date and DAYS(called_due_date, appraisal_date)
      > appraisal_order_days else 0)
  - maturity_status: CFIELD('maturity', 'status', maturity_case_id=F('maturity_case_id'))
  - referral_date: CFIELD('maturity', 'referral_date', maturity_case_id=F('maturity_case_id'))
  - referral_age: DAYS(referral_date, NOW) if referral_date else 0
  - statement_foreclosure: K('foreclosure_charges_full') if maturity_status == 'foreclosure_referred' and referral_age >= K('first_legal_action_days') else
      (K('foreclosure_charges_initial') if maturity_status == 'foreclosure_referred' else 0)
  - result: RND(posted_balance + per_diem_on_case * accrual_days + statement_setaside + statement_fee + statement_preservation + statement_dp_appraisal
      + statement_replacement + statement_foreclosure, 2)
  compute_basis:
    per_diem_on_case: The short-sale accrual charge is the per diem the payoff case carries times the short-sale accrual days, which are the calendar days
      from the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual, plus
      statement_good_through_days.
    posted_balance: Under the standard rule, the short-sale statement balance is the loan's principal_balance plus the short-sale accrual charge plus six
      short-sale statement charges, the short-sale statement set-aside disbursement, the short-sale statement servicing fee, the short-sale statement preservation
      charge, the short-sale statement called-due appraisal charge, the short-sale statement replacement appraisal charge and the short-sale statement foreclosure
      charge, rounded half up to the cent and only at that last step.
    last_interest_date: The short-sale accrual charge is the per diem the payoff case carries times the short-sale accrual days, which are the calendar
      days from the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual,
      plus statement_good_through_days.
    elapsed_days: The short-sale accrual charge is the per diem the payoff case carries times the short-sale accrual days, which are the calendar days from
      the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual, plus statement_good_through_days.
    accrual_days: The short-sale accrual charge is the per diem the payoff case carries times the short-sale accrual days, which are the calendar days from
      the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual, plus statement_good_through_days.
    ff_lesa_id: 'The short-sale statement set-aside disbursement is instead figured from the set-aside on the loan that pays its property charges: for an
      active Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale statement bills limited
      to its setaside_balance; for an active Summit Tax and Insurance Reserve it is the sum of its short-sale statement bills in full, because the reserve''s
      shortfall_source pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00.'
    reserve_id: 'The short-sale statement set-aside disbursement is instead figured from the set-aside on the loan that pays its property charges: for an
      active Fully Funded LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s short-sale statement bills limited
