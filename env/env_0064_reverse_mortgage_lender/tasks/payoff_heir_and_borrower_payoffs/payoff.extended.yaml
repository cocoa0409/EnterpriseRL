events:
- type: payoff_case_opened
  target: payoff_cases
  mutation: create
  meaning: A payoff case is opened on a written payoff request from an authorized requester.
  grain: One row per payoff case.
  fields:
    payoff_case_id: Case id.
    customer_id: Requester.
    borrower_customer_id: Borrower of record.
    hecm_loan_id: HECM loan, if any.
    jumbo_loan_id: Summit loan, if any.
    maturity_case_id: Maturity case, if any.
    loan_program: hecm or summit.
    variant_name: Payoff plan.
    status: Always opened.
    opened_date: Request date.
  triggers: []
- type: payoff_terms_issued
  target: payoff_cases
  mutation:
    transition:
      from: opened
      to: terms_issued
  meaning: The payoff statement or settlement terms are issued.
  grain: One row per transition.
  fields:
    status: Set to terms_issued.
    statement_date: Issue date.
    statement_good_through_date: Good-through date.
    statement_balance: Balance projected to the good-through date.
    per_diem_amount: Daily accrual.
    appraised_value_basis: Appraised value used, or 0.00.
    contract_price: Approved contract price, or 0.00.
    allowed_closing_costs: Allowed closing costs, or 0.00.
    required_payoff_amount: Amount that satisfies the loan.
  triggers: []
- type: payoff_terms_reissued
  target: payoff_cases
  mutation: update
  meaning: Updated terms replace the current statement, for a new good-through date, a new appraisal or a revised contract.
  grain: One row per reissue.
  fields:
    statement_date: Reissue date.
    statement_good_through_date: New good-through date.
    statement_balance: New projected balance.
    per_diem_amount: New daily accrual.
    appraised_value_basis: Appraised value used.
    contract_price: Approved contract price.
    allowed_closing_costs: Allowed closing costs.
    required_payoff_amount: New required amount.
  triggers: []
- type: payoff_terms_accepted
  target: payoff_cases
  mutation:
    transition:
      from: terms_issued
      to: accepted
  meaning: The borrower or confirmed successor signs the agreement under the issued terms.
  grain: One row per transition.
  fields:
    status: Set to accepted.
    accepted_date: Signature date.
    variant_name: Plan signed under (unchanged).
  triggers:
  - event: payoff:payoff_incentive_committed
    when:
      variant_name: Deed in Lieu of Foreclosure
    map:
      effective_date: accepted_date
- type: payoff_funds_received
  target: payoff_transactions
  meaning: Payoff funds arrive from the requester, a title company or a new lender.
  grain: One row per remittance.
  distinguish_by:
  - remittance_reference
  fields:
    amount: Funds received.
    effective_date: Date received.
    remittance_method: wire or cashiers_check.
    remittance_reference: Wire reference or check number.
    remitter_name: Sender.
  account: payoff_funds
  direction: in
  triggers: []
- type: payoff_funds_returned
  target: payoff_transactions
  meaning: Held funds leave the case because the remittance was recalled or dishonored, or because insufficient funds were returned after the hold period.
  grain: One row per remittance returned.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount returned.
    effective_date: Return date.
    source_txn_ref: The receipt returned.
    remittance_method: Method of the return.
  account: payoff_funds
  direction: out
  triggers: []
- type: payoff_funds_applied
  target: payoff_transactions
  meaning: On satisfaction the required payoff amount is applied to the loan.
  grain: One row per satisfied case.
  distinguish_by:
  - effective_date
  fields:
    amount: Amount applied.
    effective_date: Satisfaction date.
  account: payoff_funds
  direction: out
  triggers: []
- type: payoff_overage_refund
  target: payoff_transactions
  meaning: Funds held above the required payoff, or an estate's sale surplus, are refunded after satisfaction.
  grain: One row per refunded receipt.
  distinguish_by:
  - source_txn_ref
  fields:
    amount: Amount refunded.
    effective_date: Refund date.
    source_txn_ref: The receipt whose excess is refunded.
    remittance_method: How refunded.
  account: payoff_funds
  direction: out
  triggers: []
- type: payoff_incentive_committed
  target: payoff_transactions
  meaning: A cash-for-keys relocation incentive is committed when a deed-in-lieu agreement is signed.
  grain: One row per deed-in-lieu case.
  distinguish_by:
  - effective_date
  fields:
    amount: Incentive committed.
    effective_date: Agreement signature date.
  account: relocation_incentive
  direction: in
  triggers: []
- type: payoff_incentive_paid
  target: payoff_transactions
  meaning: The relocation incentive is paid after the occupants vacate, or released unpaid when they do not vacate in time.
  grain: One row per deed-in-lieu case.
  distinguish_by:
  - effective_date
  fields:
    amount: Incentive paid or released.
    effective_date: Payment or release date.
    remittance_method: check, or not_applicable when released unpaid.
  account: relocation_incentive
  direction: out
  triggers: []
- type: payoff_satisfied
  target: payoff_cases
  mutation:
    transition:
    - from: terms_issued
      to: satisfied
    - from: accepted
      to: satisfied
  meaning: The loan is satisfied by the required funds or the recorded deed in lieu, and the lien release is ordered.
  grain: One row per transition.
  fields:
    status: Set to satisfied.
    closed_date: Satisfaction date.
    variant_name: Payoff plan (unchanged).
    loan_program: Loan program (unchanged).
    maturity_case_id: Maturity case, if any (unchanged).
  triggers:
  - event: hecm:hecm_paid_in_full
    when:
      loan_program: hecm
      variant_name:
      - Borrower Voluntary Payoff
      - HECM-to-HECM Refinance Payoff
      - Heir Retention Payoff
      - Estate Market Sale Payoff
    map:
      terminated_date: closed_date
  - event: hecm:hecm_claim_terminated
    when:
      loan_program: hecm
      variant_name:
      - Approved Short Sale Payoff
      - Deed in Lieu of Foreclosure
    map:
      terminated_date: closed_date
  - event: jumbo:jumbo_paid_in_full
    when:
      loan_program: summit
      variant_name:
      - Borrower Voluntary Payoff
      - Heir Retention Payoff
      - Estate Market Sale Payoff
    map:
      terminated_date: closed_date
  - event: jumbo:jumbo_liquidated
    when:
      loan_program: summit
      variant_name:
      - Approved Short Sale Payoff
      - Deed in Lieu of Foreclosure
    map:
      terminated_date: closed_date
  - event: maturity:maturity_resolved
    when:
      maturity_case_id:
        not: ''
    map:
      closed_date: closed_date
  - event: payoff:payoff_funds_applied
    when:
      variant_name:
        not: Deed in Lieu of Foreclosure
    map:
      effective_date: closed_date
- type: payoff_lapsed
  target: payoff_cases
  mutation:
    transition:
      from: terms_issued
      to: lapsed
  meaning: The terms expired without sufficient funds or a signed agreement.
  grain: One row per transition.
  fields:
    status: Set to lapsed.
    closed_date: Lapse date.
  triggers: []
- type: payoff_withdrawn
  target: payoff_cases
  mutation:
    transition:
    - from: opened
      to: withdrawn
    - from: terms_issued
      to: withdrawn
    - from: accepted
      to: withdrawn
  meaning: The requester withdraws the payoff request or agreement.
  grain: One row per transition.
  fields:
    status: Set to withdrawn.
    closed_date: Withdrawal date.
  triggers: []
measures:
- id: payoff_msr_net_remitted
  window: Life of the payoff case up to and including the handling date.
  measure: Sum of payoff_funds_received amounts on the case less payoff_funds_returned amounts on the case.
policies:
- id: payoff_agg_multi_holding
  subject:
  - payoff_case_opened
  rule: 'A requester may hold payoff cases on more than one loan, such as a successor settling two estates, but a loan has at most max_open_cases_per_loan
    open payoff case at a time. A payoff case is opened only when the loan has no other payoff case whose status is opened, terms_issued or accepted. A
    request on a loan that already has an open case is handled on that case: new figures are reissued on it rather than opening a second case, and a request
    under a different plan withdraws nothing until the requester withdraws the open case. A plan applies only to a loan program listed in its loan_programs_covered,
    and the plans other than Borrower Voluntary Payoff and HECM-to-HECM Refinance Payoff apply only while the loan has a maturity case in due_and_payable,
    extension_period or foreclosure_referred status, per maturity_case_required; otherwise the request is declined with reason plan_not_available.'
  eligibility:
  - id: one_open_case_per_loan
    applies_to:
    - payoff_case_opened
    kind: dedup
    condition: A payoff case is opened only when the loan has no other payoff case whose status is opened, terms_issued or accepted.
    evidence_fields:
    - payoff_cases.hecm_loan_id
    - payoff_cases.jumbo_loan_id
    - payoff_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.hecm_loan_id
      - - payoff_cases.jumbo_loan_id
      action_bindings:
        payoff_cases.hecm_loan_id: hecm_loan_id
        payoff_cases.jumbo_loan_id: jumbo_loan_id
    dedup_contract:
      table: payoff_cases
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
        jumbo_loan_id: jumbo_loan_id
      duplicate_filters:
        status:
        - opened
        - terms_issued
        - accepted
      distinct_fields: []
  params:
    max_per_customer: null
- id: payoff_agg_funds
  subject:
  - payoff_funds_received
  - payoff_funds_returned
  - payoff_funds_applied
  - payoff_overage_refund
  rule: 'Funds from several remitters on one case, such as several heirs, a title company or a new lender, are pooled: payoff_msr_net_remitted counts every
    receipt less every returned receipt, and the case is funded when that sum reaches the required payoff amount. Funds are accepted only by a method in
    the plan''s accepted_remittance_methods; a personal check is never accepted, per personal_check_accepted, and is sent back without being recorded as
    a receipt. Each remittance is recorded once, identified by its remittance_reference. A recalled wire or dishonored check is returned against its receipt
    on the day Cedarline learns of it, per dishonored_funds_handling, and the shortfall reopens. Funds that still fall short of the required amount short_funds_hold_days
    calendar days after the first receipt are returned receipt by receipt to each original remitter. On satisfaction exactly the required payoff amount
    is applied to the loan, per funds_application_timing; any held excess is refunded within overpayment_refund_business_days business days to the remitter
    of the receipt that took the pooled total over the required amount, up to that receipt''s amount, and then to earlier remitters in reverse order of
    receipt, per remitter_refund_target.'
  eligibility:
  - id: remittance_once
    applies_to:
    - payoff_funds_received
    kind: dedup
    condition: Each remittance is recorded once, identified by its remittance_reference.
    evidence_fields:
    - payoff_transactions.remittance_reference
    - payoff_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_transactions.remittance_reference
      action_bindings:
        payoff_transactions.remittance_reference: remittance_reference
    dedup_contract:
      table: payoff_transactions
      mode: separate_record
      object_bindings:
        remittance_reference: remittance_reference
      duplicate_filters:
        event_type:
        - payoff_funds_received
      distinct_fields: []
  formula:
    excess_to_refund: max(0, payoff_msr_net_remitted - required_payoff_amount)
  measures:
  - payoff_msr_net_remitted
- id: payoff_statement_terms
  subject:
  - payoff_terms_issued
  - payoff_terms_reissued
  rule: 'Terms are issued only to a requester the plan''s statement_recipients allow: the borrower, a confirmed successor in interest (profile_type successor_in_interest
    linked to the borrower) where successor_confirmation_required is true, or a title company or new lender holding the borrower''s written authorization
    where third_party_authorization_accepted is true; any other request is declined with reason requester_not_authorized. Terms are issued only on a payoff
    request on file for the loan from such a requester whose request status is received. A statement is issued within payoff_statement_business_days business
    days of the request at a fee of payoff_statement_fee, with statement_date the issue date and statement_good_through_date statement_good_through_days
    calendar days later. The per diem is the loan balance on the statement date times the loan''s note rate plus, for a HECM, the annual MIP rate, divided
    by per_diem_day_count, rounded half up to the cent; the statement_balance is the balance on the statement date plus the per diem for each day from the
    statement date to the good-through date. The required payoff amount is the statement_balance for Borrower Voluntary Payoff and HECM-to-HECM Refinance
    Payoff; for Heir Retention Payoff it is the lesser of the statement_balance and retention_pct_of_appraised percent of the appraised value; for the two
    sale plans it is set by the sale review rule; for Deed in Lieu of Foreclosure it is 0.00. Terms that rely on an appraisal use the latest appraisal recorded
    on the loan''s maturity case, which must still be within that case''s appraisal validity period; otherwise new terms wait for a new appraisal. Reissued
    terms replace every figure and restart the good-through period, and are issued on request or when a new appraisal or revised contract is recorded. The
    per diem''s annual rate follows per_diem_rate_basis, and every computed figure is rounded per required_amount_rounding.'
  eligibility:
  - id: authorized_request_on_file
    applies_to:
    - payoff_terms_issued
    - payoff_terms_reissued
    kind: authorization
    condition: Terms are issued only on a payoff request on file for the loan from such a requester whose request status is received.
    evidence_fields:
    - payoff_requests.payoff_request_id
    - payoff_requests.request_type
    - payoff_requests.request_status
    - payoff_requests.authorization_basis
    - customers.profile_type
    - customers.linked_customer_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_requests.payoff_request_id
      action_bindings:
        payoff_requests.payoff_request_id: payoff_request_id
  - id: appraisal_current
    applies_to:
    - payoff_terms_issued
    - payoff_terms_reissued
    kind: authorization
    condition: Terms that rely on an appraisal use the latest appraisal recorded on the loan's maturity case, which must still be within that case's appraisal
      validity period; otherwise new terms wait for a new appraisal.
    evidence_fields:
    - maturity_cases.appraised_value
    - maturity_cases.appraisal_date
    - maturity_cases.maturity_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - maturity_cases.maturity_case_id
      action_bindings:
        maturity_cases.maturity_case_id: maturity_case_id
  params:
    per_tier:
      Borrower Voluntary Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      HECM-to-HECM Refinance Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Heir Retention Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Estate Market Sale Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Approved Short Sale Payoff:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
      Deed in Lieu of Foreclosure:
        retention_pct_of_appraised: =retention_pct_of_appraised
        appraisal_required: =appraisal_required
        successor_confirmation_required: =successor_confirmation_required
  formula:
    retention_required: min(statement_balance, round(appraised_value_basis * retention_pct_of_appraised / 100, 2))
- id: payoff_sale_review
  subject:
  - payoff_terms_issued
  - payoff_terms_reissued
  rule: Sale terms are set only from a purchase contract submission on file for the case whose request status is received; Cedarline reviews it within contract_review_business_days
    business days. The buyer must be arm's length where arms_length_required is true; a sale to a related party is not a sale under these plans and is handled
    under the plan named in related_party_sale_treated_as, and the submission is declined with reason not_arms_length. The allowed closing costs are the
    commission up to max_commission_pct percent of the contract price plus other seller costs up to max_other_closing_costs_pct percent of the contract
    price; a contract whose costs exceed either cap is declined with reason closing_costs_exceed_limit unless resubmitted within the caps. For Estate Market
    Sale Payoff the contract price must be at least the lesser of the statement_balance and sale_min_pct_of_appraised percent of the appraised value, otherwise
    it is declined with reason price_below_minimum; the required payoff amount is the lesser of the statement_balance and the contract price less the allowed
    closing costs, and any net proceeds above the statement_balance belong to the estate, released within surplus_release_business_days business days per
    surplus_to_estate. For Approved Short Sale Payoff the contract price must be at least short_sale_min_pct_of_appraised percent of the appraised value
    and the property must have been listed at least short_sale_min_marketing_days calendar days before the contract was submitted, otherwise it is declined
    with reason price_below_minimum or marketing_period_short; the required payoff amount is the contract price less the allowed closing costs, and the
    remaining balance is not collected per deficiency_waived. A contract that meets the Estate Market Sale Payoff minimum is never approved as a short sale.
  eligibility:
  - id: contract_on_file
    applies_to:
    - payoff_terms_issued
    - payoff_terms_reissued
    kind: authorization
    condition: Sale terms are set only from a purchase contract submission on file for the case whose request status is received; Cedarline reviews it within
      contract_review_business_days business days.
    evidence_fields:
    - payoff_requests.payoff_request_id
    - payoff_requests.request_type
    - payoff_requests.contract_price
    - payoff_requests.commission_amount
    - payoff_requests.other_closing_costs
    - payoff_requests.buyer_relationship
    - payoff_requests.listing_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_requests.payoff_request_id
      action_bindings:
        payoff_requests.payoff_request_id: payoff_request_id
  params:
    per_tier:
      Borrower Voluntary Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      HECM-to-HECM Refinance Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Heir Retention Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Estate Market Sale Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Approved Short Sale Payoff:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
      Deed in Lieu of Foreclosure:
        sale_min_pct_of_appraised: =sale_min_pct_of_appraised
        short_sale_min_pct_of_appraised: =short_sale_min_pct_of_appraised
        max_commission_pct: =max_commission_pct
        max_other_closing_costs_pct: =max_other_closing_costs_pct
  formula:
    estate_sale_required: min(statement_balance, contract_price - allowed_closing_costs)
    short_sale_required: contract_price - allowed_closing_costs
- id: payoff_acceptance
  subject:
  - payoff_terms_accepted
  - payoff_withdrawn
  rule: On plans whose acceptance_required is true, nothing is taken toward satisfaction until the borrower or confirmed successor signs the agreement under
    the issued terms; only that person can sign or withdraw, and the servicer records their own signed submission. An agreement is accepted only when it
    is signed no later than acceptance_signature_days calendar days after the terms were issued. Those days are counted as calendar days starting the day
    after the statement_date, and a signature on the last counted day still qualifies; a later signature is declined with reason signature_window_passed
    and new terms must be issued. A Heir Retention Payoff agreement is issued for signature only after proof of funds or a financing commitment is on file,
    per retention_proof_of_funds_required; a Deed in Lieu of Foreclosure is accepted only when the property is vacant and title carries no other lien, per
    deed_in_lieu_vacancy_required and deed_in_lieu_clear_title_required, otherwise it is declined with reason property_not_vacant or title_not_clear. A
    requester may withdraw before satisfaction, including after signing where withdrawal_after_acceptance_allowed is true; held funds are then returned
    to their remitters.
  eligibility:
  - id: signature_window
    applies_to:
    - payoff_terms_accepted
    kind: time
    condition: An agreement is accepted only when it is signed no later than acceptance_signature_days calendar days after the terms were issued.
    evidence_fields:
    - payoff_cases.statement_date
    - payoff_cases.payoff_case_id
    - payoff_requests.request_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the terms were issued
      anchor_source: payoff_cases.statement_date
      relation: not_after
      duration_source: variants.acceptance_signature_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the statement_date, and a signature on the last counted day still qualifies;
        a later signature is declined with reason signature_window_passed and new terms must be issued.
      boundary: inclusive
  params:
    per_tier:
      Borrower Voluntary Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      HECM-to-HECM Refinance Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Heir Retention Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Estate Market Sale Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Approved Short Sale Payoff:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
      Deed in Lieu of Foreclosure:
        acceptance_required: =acceptance_required
        acceptance_signature_days: =acceptance_signature_days
- id: payoff_relocation_incentive
  subject:
  - payoff_incentive_committed
  - payoff_incentive_paid
  rule: When a Deed in Lieu of Foreclosure agreement is signed, a relocation incentive of cash_for_keys_max is committed on the signature date; no other
    plan carries an incentive. The incentive is paid only when the property is vacated no later than cash_for_keys_vacate_days calendar days after the agreement
    was signed. Those days are counted as calendar days starting the day after the accepted_date, and vacating on the last counted day still qualifies.
    Payment needs a vacancy inspection confirming the property is vacant, per vacate_inspection_required, and is made by incentive_payment_method on the
    day the inspection is recorded; when the occupants have not vacated in time the committed incentive is released unpaid on the day after the period ends,
    with remittance_method not_applicable.
  eligibility:
  - id: vacated_in_time
    applies_to:
    - payoff_incentive_paid
    kind: time
    condition: The incentive is paid only when the property is vacated no later than cash_for_keys_vacate_days calendar days after the agreement was signed.
    evidence_fields:
    - payoff_cases.accepted_date
    - payoff_cases.payoff_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the agreement was signed
      anchor_source: payoff_cases.accepted_date
      relation: not_after
      duration_source: variants.cash_for_keys_vacate_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the accepted_date, and vacating on the last counted day still qualifies.
      boundary: inclusive
- id: payoff_satisfaction
  subject:
  - payoff_satisfied
  - payoff_funds_applied
  rule: A funds-based case is satisfied on the day payoff_msr_net_remitted first reaches the required payoff amount, and a Deed in Lieu of Foreclosure case
    on the day the deed recording is confirmed by a deed_in_lieu_recording submission. A case whose plan has acceptance_required true is satisfied only
    from accepted status; Borrower Voluntary Payoff and HECM-to-HECM Refinance Payoff are satisfied from terms_issued. Funds count toward satisfaction only
    when they are received no later than late_funds_tolerance_days calendar days after the statement's good-through date. Those days are counted as calendar
    days starting the day after the statement_good_through_date, and funds received on the last counted day still count. Funds received after the good-through
    date but within the tolerance must also cover the per diem for each day past the good-through date, which is added to the required payoff amount, per
    interest_through_basis. For HECM-to-HECM Refinance Payoff the funds are accepted only after the new loan's rescission period has ended, per refinance_after_new_loan_rescission.
    On satisfaction the required payoff amount is applied to the loan, the loan is marked paid in full or, where claim_after_satisfaction is true, claim-terminated,
    any open maturity case is resolved, and the lien release is sent for recording within lien_release_days calendar days.
  eligibility:
  - id: funds_within_tolerance
    applies_to:
    - payoff_satisfied
    kind: time
    condition: Funds count toward satisfaction only when they are received no later than late_funds_tolerance_days calendar days after the statement's good-through
      date.
    evidence_fields:
    - payoff_cases.statement_good_through_date
    - payoff_cases.payoff_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the statement's good-through date
      anchor_source: payoff_cases.statement_good_through_date
      relation: not_after
      duration_source: variants.late_funds_tolerance_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the statement_good_through_date, and funds received on the last counted
        day still count.
      boundary: inclusive
  - id: applied_once
    applies_to:
    - payoff_funds_applied
    kind: dedup
    condition: On satisfaction the required payoff amount is applied to the loan, the loan is marked paid in full or, where claim_after_satisfaction is
      true, claim-terminated, any open maturity case is resolved, and the lien release is sent for recording within lien_release_days calendar days.
    evidence_fields:
    - payoff_transactions.payoff_case_id
    - payoff_transactions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_transactions.payoff_case_id
      action_bindings:
        payoff_transactions.payoff_case_id: payoff_case_id
    dedup_contract:
      table: payoff_transactions
      mode: separate_record
      object_bindings:
        payoff_case_id: payoff_case_id
      duplicate_filters:
        event_type:
        - payoff_funds_applied
      distinct_fields: []
  measures:
  - payoff_msr_net_remitted
- id: payoff_lapse
  subject:
  - payoff_lapsed
  rule: Terms lapse only when more than late_funds_tolerance_days calendar days have passed since the statement's good-through date without the case being
    funded or, where acceptance_required is true, accepted. Those days are counted as calendar days starting the day after the statement_good_through_date,
    and the case does not lapse on the last tolerance day itself. A lapsed case is final; the requester must open a new case, per lapsed_case_reopen_rule,
    and any held funds are returned to their remitters.
  eligibility:
  - id: lapse_after_tolerance
    applies_to:
    - payoff_lapsed
    kind: time
    condition: Terms lapse only when more than late_funds_tolerance_days calendar days have passed since the statement's good-through date without the case
      being funded or, where acceptance_required is true, accepted.
    evidence_fields:
    - payoff_cases.statement_good_through_date
    - payoff_cases.payoff_case_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - payoff_cases.payoff_case_id
      action_bindings:
        payoff_cases.payoff_case_id: payoff_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the statement's good-through date
      anchor_source: payoff_cases.statement_good_through_date
      relation: not_before
      duration_source: variants.late_funds_tolerance_days
      unit: calendar_days
      counting_rule: Those days are counted as calendar days starting the day after the statement_good_through_date, and the case does not lapse on the
        last tolerance day itself.
      boundary: exclusive
extended_policies:
- id: payoff_ext_retention_daily_accrual
  base_policy_refs:
  - payoff_statement_terms
  - payoff_sale_review
  overwrite:
  - base_policy: payoff_statement_terms
    superseded_clause: The per diem is the loan balance on the statement date times the loan's note rate plus, for a HECM, the annual MIP rate, divided
      by per_diem_day_count, rounded half up to the cent
    replaced_by: For a Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period
      or foreclosure_referred, and only for such a payoff, the per diem is the retention daily accrual; every payoff case other than a retention payoff
      and the payoff case of an Approved Short Sale Payoff requested by the borrower of record keeps its per diem as the loan balance on the statement date
      times the loan's note rate plus, for a HECM, the annual MIP rate, divided by per_diem_day_count, rounded half up to the cent.
  trigger: on_request
  subject:
  - payoff_terms_issued
  computes: per_diem_amount
  target_tool: record_payoff_daily_accrual_16b003bd
  params:
    appraisal_fee_standard: 475.0
    appraisal_fee_condo_manufactured: 550.0
    appraisal_fee_two_to_four: 650.0
    update_appraisal_fee: 295.0
    replacement_appraisal_fee: 395.0
    securing_fee_vacant: 285.0
    securing_fee_unconfirmed: 85.0
    maintenance_flat_association: 120.0
    maintenance_monthly: 55.0
    foreclosure_charges_full: 2525.0
    foreclosure_charges_initial: 875.0
    first_legal_action_days: 30
  rule: 'This policy sets the retention daily accrual, the per diem recorded on the payoff case of a Borrower Voluntary Payoff requested by the borrower
    of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred. For a Borrower Voluntary Payoff requested by the
    borrower of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred, and only for such a payoff, the per diem
    is the retention daily accrual; every payoff case other than a retention payoff and the payoff case of an Approved Short Sale Payoff requested by the
    borrower of record keeps its per diem as the loan balance on the statement date times the loan''s note rate plus, for a HECM, the annual MIP rate, divided
    by per_diem_day_count, rounded half up to the cent. Under the standard rule, the retention daily accrual is the retention accrual basis times the loan''s
    daily accrual rate, rounded half up to the cent and only at that last step. The loan''s daily accrual rate is its note_rate_pct plus, for a HECM, the
    annual_mip_rate_pct of its payout plan, divided by 100 and by per_diem_day_count; a Summit loan carries no MIP. The retention accrual basis is the loan''s
    principal_balance plus five carried advances: the set-aside disbursement carry, the preservation advance carry, the due-and-payable appraisal carry,
    the replacement appraisal carry and the foreclosure charge carry. Under the standard rule the set-aside disbursement carry, the preservation advance
    carry, the replacement appraisal carry and the foreclosure charge carry are each 0.00, and the due-and-payable appraisal carry is appraisal_fee_standard.
    The set-aside disbursement carry is instead figured from the set-aside on the loan that pays its property charges: for a loan with an active Fully Funded
    LESA (Mandatory) or Fully Funded LESA (Borrower-Elected) it is the sum of that set-aside''s qualifying bills, limited to its setaside_balance; for a
    loan with an active Summit Tax and Insurance Reserve it is the sum of that reserve''s qualifying bills in full, because the reserve''s shortfall_source
    pays any part above its balance at once as a corporate advance; a loan with neither keeps 0.00. A qualifying bill is, for each of property_tax_bill,
    hazard_insurance_bill and flood_insurance_bill, the received bill of that type on the set-aside with the latest due_date, when its payment date falls
    no later than statement_good_through_days calendar days after the statement date; a bill''s payment date is its due_date less the set-aside plan''s
    tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days for a hazard or flood bill, and a type with no received bill adds nothing.
    Where several such bills of one type share that latest due_date, their billed_amounts are taken together as that type''s bill. The preservation advance
    carry is instead figured from the latest residency_inspection_result on the loan''s occupancy profile, and only where the maturity case''s plan has
    vacant_property_securing true: when that result found the home vacant and the loan''s property_type is fha_approved_condominium or planned_unit_development,
    it is securing_fee_vacant plus maintenance_flat_association; when it found the home vacant and the property is of any other type, or is a Summit loan,
    which records no property_type, it is securing_fee_vacant plus maintenance_monthly for each month of vacancy; when the result was unable_to_determine
    it is securing_fee_unconfirmed; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00. The months of vacancy that
    preservation advance counts are the whole calendar months from the occupancy profile''s nonoccupancy_date to the statement date, not below 0, plus one;
    a profile with no nonoccupancy_date counts one month. The due-and-payable appraisal carry is instead appraisal_fee_two_to_four for a two_to_four_unit
    property and appraisal_fee_condo_manufactured for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan,
    keeps appraisal_fee_standard. The replacement appraisal carry is instead update_appraisal_fee when the maturity case''s appraisal_date falls on or after
    the effective_date of the case''s latest maturity_extension_granted entry and no more than the case plan''s appraisal_order_days calendar days after
    it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case''s due_and_payable_date;
    a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00. The foreclosure charge carry is instead foreclosure_charges_full
    when the maturity case''s status is foreclosure_referred and its referral_date is at least first_legal_action_days calendar days before the statement
    date, and foreclosure_charges_initial when its status is foreclosure_referred and it was referred fewer days before, a case with no referral_date counting
    as referred 0 days before; a case in any other status keeps 0.00. Where several residency_inspection_result entries on the occupancy profile share the
    latest effective_date, a vacant finding among them counts as the latest result, and otherwise an unable_to_determine finding does.'
  prerequisite: []
  cross_category:
  - category: hecm
    as: read
    reads:
    - principal_balance
    - note_rate_pct
    - annual_mip_rate_pct
    - property_type
    note: Balance, rate and property type of a HECM.
  - category: jumbo
    as: read
    reads:
    - principal_balance
    - note_rate_pct
    note: Balance and rate of a Summit loan.
  - category: setaside
    as: branch
    reads:
    - variant_name
    - status
    - setaside_balance
    - tax_payment_lead_days
    - insurance_payment_lead_days
    - setaside_requests.due_date
    - setaside_requests.billed_amount
    note: The property-charge set-aside and its received bills decide the set-aside disbursement carry.
  - category: residency
    as: history
    reads:
    - residency_profile_id
    - nonoccupancy_date
    - residency_events.inspection_outcome
    note: The latest inspection result on the loan profile decides the preservation advance carry.
  - category: maturity
    as: history
    reads:
    - status
    - referral_date
    - appraisal_date
    - due_and_payable_date
    - vacant_property_securing
    - appraisal_order_days
    - maturity_case_events.effective_date
    note: The maturity case decides the appraisal, preservation and foreclosure carries.
  compute:
  - posted_balance: CFIELD('hecm', 'principal_balance', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('jumbo', 'principal_balance',
      jumbo_loan_id=F('jumbo_loan_id'))
  - note_rate: CFIELD('hecm', 'note_rate_pct', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('jumbo', 'note_rate_pct', jumbo_loan_id=F('jumbo_loan_id'))
  - mip_rate: CPARAM('hecm', 'annual_mip_rate_pct', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else 0
  - daily_rate: (note_rate + mip_rate) / 100 / P('per_diem_day_count')
  - ff_lesa_id: CFIELD('setaside', 'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Mandatory)', status='active') or CFIELD('setaside',
      'setaside_id', hecm_loan_id=F('hecm_loan_id'), variant_name='Fully Funded LESA (Borrower-Elected)', status='active')
  - reserve_id: CFIELD('setaside', 'setaside_id', jumbo_loan_id=F('jumbo_loan_id'), variant_name='Summit Tax and Insurance Reserve', status='active')
  - sa_id: ff_lesa_id or reserve_id
  - sa_balance: CFIELD('setaside', 'setaside_balance', setaside_id=sa_id) if sa_id else 0
  - tax_lead: CPARAM('setaside', 'tax_payment_lead_days', setaside_id=sa_id) if sa_id else 0
  - ins_lead: CPARAM('setaside', 'insurance_payment_lead_days', setaside_id=sa_id) if sa_id else 0
  - tax_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='property_tax_bill', request_status='received')
      if sa_id else None
  - tax_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='property_tax_bill', request_status='received', due_date=tax_due)
      if sa_id and tax_due else 0
  - haz_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='hazard_insurance_bill', request_status='received')
      if sa_id else None
  - haz_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='hazard_insurance_bill', request_status='received',
      due_date=haz_due) if sa_id and haz_due else 0
  - fld_due: XLATEST('setaside', 'setaside_requests', 'due_date', date_field='due_date', setaside_id=sa_id, request_type='flood_insurance_bill', request_status='received')
      if sa_id else None
  - fld_amt: XSUM('setaside', 'setaside_requests', 'billed_amount', setaside_id=sa_id, request_type='flood_insurance_bill', request_status='received', due_date=fld_due)
      if sa_id and fld_due else 0
  - qualifying_bills: (tax_amt if tax_due and DAYS(NOW, tax_due) - tax_lead <= P('statement_good_through_days') else 0) + (haz_amt if haz_due and DAYS(NOW,
      haz_due) - ins_lead <= P('statement_good_through_days') else 0) + (fld_amt if fld_due and DAYS(NOW, fld_due) - ins_lead <= P('statement_good_through_days')
      else 0)
  - setaside_carry: MN(qualifying_bills, sa_balance) if ff_lesa_id else (qualifying_bills if reserve_id else 0)
  - profile_id: CFIELD('residency', 'residency_profile_id', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('residency', 'residency_profile_id',
      jumbo_loan_id=F('jumbo_loan_id'))
  - inspection_result: ('vacant' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='vacant', residency_profile_id=profile_id,
      effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result', residency_profile_id=profile_id))
      > 0 else ('unable_to_determine' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='unable_to_determine',
      residency_profile_id=profile_id, effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=profile_id)) > 0 else XLATEST('residency', 'residency_events', 'inspection_outcome', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=profile_id))) if profile_id else None
  - securing_allowed: CPARAM('maturity', 'vacant_property_securing', maturity_case_id=F('maturity_case_id'))
  - property_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - nonocc_date: CFIELD('residency', 'nonoccupancy_date', residency_profile_id=profile_id) if profile_id else None
  - vacancy_months: (MX(0, MONTHS(nonocc_date, NOW)) if nonocc_date else 0) + 1
  - preservation_carry: (K('securing_fee_vacant') + K('maintenance_flat_association')) if securing_allowed and inspection_result == 'vacant' and (property_type
      == 'fha_approved_condominium' or property_type == 'planned_unit_development') else ((K('securing_fee_vacant') + K('maintenance_monthly') * vacancy_months)
      if securing_allowed and inspection_result == 'vacant' else (K('securing_fee_unconfirmed') if securing_allowed and inspection_result == 'unable_to_determine'
      else 0))
  - dp_property_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - dp_appraisal_carry: K('appraisal_fee_two_to_four') if dp_property_type == 'two_to_four_unit' else (K('appraisal_fee_condo_manufactured') if dp_property_type
      == 'fha_approved_condominium' or dp_property_type == 'manufactured_home' else K('appraisal_fee_standard'))
  - appraisal_date: CFIELD('maturity', 'appraisal_date', maturity_case_id=F('maturity_case_id'))
  - called_due_date: CFIELD('maturity', 'due_and_payable_date', maturity_case_id=F('maturity_case_id'))
  - appraisal_order_days: CPARAM('maturity', 'appraisal_order_days', maturity_case_id=F('maturity_case_id'))
  - last_extension_date: XLATEST('maturity', 'maturity_case_events', 'effective_date', date_field='effective_date', event_type='maturity_extension_granted',
      maturity_case_id=F('maturity_case_id'))
  - replacement_carry: K('update_appraisal_fee') if appraisal_date and last_extension_date and DAYS(last_extension_date, appraisal_date) >= 0 and DAYS(last_extension_date,
      appraisal_date) <= appraisal_order_days else (K('replacement_appraisal_fee') if appraisal_date and called_due_date and DAYS(called_due_date, appraisal_date)
      > appraisal_order_days else 0)
  - maturity_status: CFIELD('maturity', 'status', maturity_case_id=F('maturity_case_id'))
  - referral_date: CFIELD('maturity', 'referral_date', maturity_case_id=F('maturity_case_id'))
  - referral_age: DAYS(referral_date, NOW) if referral_date else 0
  - foreclosure_carry: K('foreclosure_charges_full') if maturity_status == 'foreclosure_referred' and referral_age >= K('first_legal_action_days') else
      (K('foreclosure_charges_initial') if maturity_status == 'foreclosure_referred' else 0)
  - accrual_basis: posted_balance + setaside_carry + preservation_carry + dp_appraisal_carry + replacement_carry + foreclosure_carry
  - result: RND(accrual_basis * daily_rate, 2)
