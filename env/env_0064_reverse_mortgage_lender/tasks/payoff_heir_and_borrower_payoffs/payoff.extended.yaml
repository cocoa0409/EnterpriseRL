      a bill's payment date is its due_date less the set-aside plan's tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days for
      a hazard or flood bill, and a type with no received bill adds nothing. Where several such bills of one type share that latest due_date, their billed_amounts
