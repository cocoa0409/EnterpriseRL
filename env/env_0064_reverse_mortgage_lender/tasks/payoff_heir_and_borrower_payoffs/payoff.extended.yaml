  compute_basis:
    per_diem_on_case: The retention accrual charge is the per diem the payoff case carries times the retention accrual days, which are the calendar days
      from the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual, plus
      the statement window days.
    posted_balance: Under the standard rule, the retention statement balance is the loan's principal_balance plus the retention accrual charge plus five
      statement charges, the statement tax disbursement, the statement hazard disbursement, the statement flood disbursement, the statement servicing fee
      and the statement maintenance charge, rounded half up to the cent and only at that last step.
    last_interest_date: The retention accrual charge is the per diem the payoff case carries times the retention accrual days, which are the calendar days
      from the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual, plus
      the statement window days.
    elapsed_days: The retention accrual charge is the per diem the payoff case carries times the retention accrual days, which are the calendar days from
      the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual, plus the
      statement window days.
    maturity_status: The statement window days are instead foreclosure_window_days when the maturity case's status is foreclosure_referred, and the calendar
      days from the statement date to the case's resolution_deadline when its status is extension_period and that deadline falls on or after the statement
      date and fewer than statement_good_through_days calendar days after it; every other case keeps statement_good_through_days.
    resolution_deadline: The statement window days are instead foreclosure_window_days when the maturity case's status is foreclosure_referred, and the
      calendar days from the statement date to the case's resolution_deadline when its status is extension_period and that deadline falls on or after the
      statement date and fewer than statement_good_through_days calendar days after it; every other case keeps statement_good_through_days.
    window_days: The statement window days are instead foreclosure_window_days when the maturity case's status is foreclosure_referred, and the calendar
      days from the statement date to the case's resolution_deadline when its status is extension_period and that deadline falls on or after the statement
      date and fewer than statement_good_through_days calendar days after it; every other case keeps statement_good_through_days.
    accrual_days: The retention accrual charge is the per diem the payoff case carries times the retention accrual days, which are the calendar days from
      the effective_date of the latest posted interest accrual on the loan to the statement date, 0 for a loan with no posted interest accrual, plus the
      statement window days.
    tx_ff: A statement bill is, for each of property_tax_bill, hazard_insurance_bill and flood_insurance_bill, the received bill of that type with the latest
      due_date on the set-aside that pays the loan's property charges, an active Fully Funded LESA (Mandatory), an active Fully Funded LESA (Borrower-Elected)
      or an active Summit Tax and Insurance Reserve, when its payment date falls no later than statement_good_through_days calendar days after the statement
      date; a bill's payment date is its due_date less the set-aside plan's tax_payment_lead_days for a tax bill and less its insurance_payment_lead_days
      for a hazard or flood bill. Where several such bills of one type share that latest due_date, their billed_amounts are taken together as that type's
      bill.
