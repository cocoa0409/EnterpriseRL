- id: payoff_ext_retention_payoff_approval
  base_policy_refs:
  - payoff_statement_terms
  - payoff_sale_review
  overwrite:
  - base_policy: payoff_statement_terms
    superseded_clause: The required payoff amount is the statement_balance for Borrower Voluntary Payoff and HECM-to-HECM Refinance Payoff;
    replaced_by: The required payoff amount is the statement_balance for every Borrower Voluntary Payoff other than a retention payoff and for every HECM-to-HECM
      Refinance Payoff, and a retention payoff, the payoff case of a Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity
      case is due_and_payable, extension_period or foreclosure_referred, carries the approved retention payoff as its required payoff amount.
  - base_policy: payoff_statement_terms
    superseded_clause: Reissued terms replace every figure and restart the good-through period, and are issued on request or when a new appraisal or revised
      contract is recorded.
    replaced_by: Reissued terms other than an approved retention payoff and a short-sale approval replace every figure and restart the good-through period,
      and every reissue is issued on request or when a new appraisal or revised contract is recorded; an approved retention payoff reissued on the payoff
      case of a Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred
      replaces only the required payoff amount and the appraised value basis and keeps the current statement's date, good-through date, statement balance
      and per diem.
  trigger: on_request
  subject:
  - payoff_terms_reissued
  computes: required_payoff_amount
  target_tool: approve_appraisal_based_payoff_a02ac9a5
  params:
    due_and_payable_pct_of_appraised: 95.0
    appraisal_fee_standard: 475.0
    appraisal_fee_condo_manufactured: 550.0
    appraisal_fee_two_to_four: 650.0
    update_appraisal_fee: 295.0
    replacement_appraisal_fee: 395.0
    foreclosure_charges_full: 2525.0
    foreclosure_charges_initial: 875.0
    first_legal_action_days: 30
    securing_fee_vacant: 285.0
    securing_fee_unconfirmed: 85.0
    notice_postage_four_plus: 35.4
    notice_postage_two_three: 17.7
    prompt_decision_credit: 500.0
    credit_reduction_per_extension: 125.0
  rule: 'This policy sets the approved retention payoff, the required payoff amount on the payoff case of a Borrower Voluntary Payoff requested by the borrower
    of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred, under HUD''s due-and-payable payoff rule, which
    lets the borrower satisfy the loan for the lesser of the balance owed and 95 percent of the current appraised value. The required payoff amount is the
    statement_balance for every Borrower Voluntary Payoff other than a retention payoff and for every HECM-to-HECM Refinance Payoff, and a retention payoff,
    the payoff case of a Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period
    or foreclosure_referred, carries the approved retention payoff as its required payoff amount. Reissued terms other than an approved retention payoff
    and a short-sale approval replace every figure and restart the good-through period, and every reissue is issued on request or when a new appraisal or
    revised contract is recorded; an approved retention payoff reissued on the payoff case of a Borrower Voluntary Payoff requested by the borrower of record
    on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred replaces only the required payoff amount and the appraised
    value basis and keeps the current statement''s date, good-through date, statement balance and per diem. The approved retention payoff is not set until
    the payoff case carries an issued statement balance. Under the standard rule, the approved retention payoff is the lesser of the retention balance figure
    and the due-and-payable value cap, rounded half up to the cent and only at that last step. The due-and-payable value cap is due_and_payable_pct_of_appraised
    percent of the appraised value basis, rounded half up to the cent, and the appraised value basis is the appraised_value on the loan''s maturity case,
    which must be dated within that case plan''s appraisal_valid_months. The retention balance figure is the statement_balance the payoff case carries plus
    five resolution charges, the called-due appraisal charge, the replacement appraisal charge, the foreclosure charge, the property securing charge and
    the notice postage charge, less the prompt-decision credit; the charges are added and the credit deducted before the lesser of the two figures is taken.
    Under the standard rule the called-due appraisal charge is appraisal_fee_standard, and the replacement appraisal charge, the foreclosure charge, the
    property securing charge, the notice postage charge and the prompt-decision credit are each 0.00. The called-due appraisal charge is instead appraisal_fee_two_to_four
    for a two_to_four_unit property and appraisal_fee_condo_manufactured for an fha_approved_condominium or manufactured_home property; every other property,
    and a Summit loan, which records no property_type, keeps appraisal_fee_standard. The replacement appraisal charge is instead update_appraisal_fee when
    the maturity case''s appraisal_date falls on or after the effective_date of the case''s latest maturity_extension_granted entry and no more than the
    case plan''s appraisal_order_days calendar days after it, and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days
    calendar days after the case''s due_and_payable_date; a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00. The foreclosure
    charge is instead foreclosure_charges_full when the maturity case''s status is foreclosure_referred and its referral_date is at least first_legal_action_days
    calendar days before the approval date, and foreclosure_charges_initial when its status is foreclosure_referred and it was referred fewer days before,
    a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00. The property securing charge is instead securing_fee_vacant
    when the latest residency_inspection_result on the loan''s occupancy profile found the home vacant and securing_fee_unconfirmed when that result was
    unable_to_determine, in each case only where the maturity case''s plan has vacant_property_securing true; any other result, no result, or a plan whose
    vacant_property_securing is false keeps 0.00. The notice postage charge is instead notice_postage_four_plus when the maturity case carries four or more
    maturity_notice_sent entries and notice_postage_two_three when it carries two or three; a case with fewer keeps 0.00. The prompt-decision credit is
    instead figured from the latest accepted intent_declaration on the maturity case when it states retain_property and its request_date is on or before
    the case''s response_deadline: it is prompt_decision_credit when the case carries no maturity_extension_granted entry, and prompt_decision_credit less
    credit_reduction_per_extension for each maturity_extension_granted entry on the case, not below 0.00, when it carries one or more; a case whose latest
    accepted intent_declaration states another intent or is dated after the response_deadline, or that has none, keeps 0.00. Where several residency_inspection_result
    entries on the occupancy profile share the latest effective_date, a vacant finding among them counts as the latest result, and otherwise an unable_to_determine
    finding does. Where several accepted intent_declarations on the case share the latest request_date, the latest declaration states retain_property only
    when every one of them does.'
  prerequisite:
  - problem: payoff_ext_retention_statement_balance
    kind: value_input
    gate: stmt_on_case
    form: state
    policy_source: The approved retention payoff is not set until the payoff case carries an issued statement balance.
    condition: payoff_cases.status is terms_issued and payoff_cases.statement_balance carries the retention statement balance (not 0.00).
    resolved_by: issue_retention_payoff_statement_a856e53a
    effect: The statement balance the retention balance figure starts from changes from 0.00 to the issued retention statement balance.
  cross_category:
  - category: hecm
    as: read
    reads:
    - property_type
    note: The property type decides the called-due appraisal charge.
  - category: residency
    as: history
    reads:
    - residency_profile_id
    - residency_events.inspection_outcome
    note: The latest inspection result decides the property securing charge.
  - category: maturity
    as: history
    reads:
    - appraised_value
    - appraisal_date
    - due_and_payable_date
    - status
    - referral_date
    - response_deadline
    - vacant_property_securing
    - appraisal_order_days
    - maturity_case_events.event_type
    - maturity_requests.stated_intent
    note: The maturity case decides the value cap and the appraisal, foreclosure, notice and credit figures.
  compute:
  - stmt_on_case: F('statement_balance')
  - appraised_value: CFIELD('maturity', 'appraised_value', maturity_case_id=F('maturity_case_id'))
  - value_cap: RND(appraised_value * K('due_and_payable_pct_of_appraised') / 100, 2)
  - property_type: CFIELD('hecm', 'property_type', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else None
  - called_due_appraisal: K('appraisal_fee_two_to_four') if property_type == 'two_to_four_unit' else (K('appraisal_fee_condo_manufactured') if property_type
      == 'fha_approved_condominium' or property_type == 'manufactured_home' else K('appraisal_fee_standard'))
  - appraisal_date: CFIELD('maturity', 'appraisal_date', maturity_case_id=F('maturity_case_id'))
  - called_due_date: CFIELD('maturity', 'due_and_payable_date', maturity_case_id=F('maturity_case_id'))
  - appraisal_order_days: CPARAM('maturity', 'appraisal_order_days', maturity_case_id=F('maturity_case_id'))
  - extensions_granted: XCOUNT('maturity', 'maturity_case_events', event_type='maturity_extension_granted', maturity_case_id=F('maturity_case_id'))
  - last_extension_date: XLATEST('maturity', 'maturity_case_events', 'effective_date', date_field='effective_date', event_type='maturity_extension_granted',
      maturity_case_id=F('maturity_case_id'))
  - replacement_appraisal: K('update_appraisal_fee') if appraisal_date and last_extension_date and DAYS(last_extension_date, appraisal_date) >= 0 and DAYS(last_extension_date,
      appraisal_date) <= appraisal_order_days else (K('replacement_appraisal_fee') if appraisal_date and called_due_date and DAYS(called_due_date, appraisal_date)
      > appraisal_order_days else 0)
  - maturity_status: CFIELD('maturity', 'status', maturity_case_id=F('maturity_case_id'))
  - referral_date: CFIELD('maturity', 'referral_date', maturity_case_id=F('maturity_case_id'))
  - referral_age: DAYS(referral_date, NOW) if referral_date else 0
  - foreclosure_charge: K('foreclosure_charges_full') if maturity_status == 'foreclosure_referred' and referral_age >= K('first_legal_action_days') else
      (K('foreclosure_charges_initial') if maturity_status == 'foreclosure_referred' else 0)
  - profile_id: CFIELD('residency', 'residency_profile_id', hecm_loan_id=F('hecm_loan_id')) if F('loan_program') == 'hecm' else CFIELD('residency', 'residency_profile_id',
      jumbo_loan_id=F('jumbo_loan_id'))
  - inspection_result: ('vacant' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='vacant', residency_profile_id=profile_id,
      effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result', residency_profile_id=profile_id))
      > 0 else ('unable_to_determine' if XCOUNT('residency', 'residency_events', event_type='residency_inspection_result', inspection_outcome='unable_to_determine',
      residency_profile_id=profile_id, effective_date=XLATEST('residency', 'residency_events', 'effective_date', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=profile_id)) > 0 else XLATEST('residency', 'residency_events', 'inspection_outcome', date_field='effective_date', event_type='residency_inspection_result',
      residency_profile_id=profile_id))) if profile_id else None
  - securing_allowed: CPARAM('maturity', 'vacant_property_securing', maturity_case_id=F('maturity_case_id'))
  - securing_charge: K('securing_fee_vacant') if securing_allowed and inspection_result == 'vacant' else (K('securing_fee_unconfirmed') if securing_allowed
      and inspection_result == 'unable_to_determine' else 0)
  - notices_sent: XCOUNT('maturity', 'maturity_case_events', event_type='maturity_notice_sent', maturity_case_id=F('maturity_case_id'))
  - notice_postage: K('notice_postage_four_plus') if notices_sent >= 4 else (K('notice_postage_two_three') if notices_sent >= 2 else 0)
  - latest_intent_date: XLATEST('maturity', 'maturity_requests', 'request_date', date_field='request_date', request_type='intent_declaration', request_status='accepted',
      maturity_case_id=F('maturity_case_id'))
  - latest_intent: '''retain_property'' if latest_intent_date and XCOUNT(''maturity'', ''maturity_requests'', request_type=''intent_declaration'', request_status=''accepted'',
      maturity_case_id=F(''maturity_case_id''), request_date=latest_intent_date, stated_intent=''retain_property'') == XCOUNT(''maturity'', ''maturity_requests'',
      request_type=''intent_declaration'', request_status=''accepted'', maturity_case_id=F(''maturity_case_id''), request_date=latest_intent_date) else
      ''other'''
  - response_deadline: CFIELD('maturity', 'response_deadline', maturity_case_id=F('maturity_case_id'))
  - prompt_credit: K('prompt_decision_credit') if latest_intent == 'retain_property' and response_deadline and DAYS(latest_intent_date, response_deadline)
      >= 0 and extensions_granted == 0 else (MX(0, K('prompt_decision_credit') - K('credit_reduction_per_extension') * extensions_granted) if latest_intent
      == 'retain_property' and response_deadline and DAYS(latest_intent_date, response_deadline) >= 0 else 0)
  - balance_figure: stmt_on_case + called_due_appraisal + replacement_appraisal + foreclosure_charge + securing_charge + notice_postage - prompt_credit
  - result: RND(MN(balance_figure, value_cap), 2)
  compute_basis:
    stmt_on_case: The retention balance figure is the statement_balance the payoff case carries plus five resolution charges, the called-due appraisal charge,
      the replacement appraisal charge, the foreclosure charge, the property securing charge and the notice postage charge, less the prompt-decision credit;
      the charges are added and the credit deducted before the lesser of the two figures is taken.
    appraised_value: The due-and-payable value cap is due_and_payable_pct_of_appraised percent of the appraised value basis, rounded half up to the cent,
      and the appraised value basis is the appraised_value on the loan's maturity case, which must be dated within that case plan's appraisal_valid_months.
    value_cap: The due-and-payable value cap is due_and_payable_pct_of_appraised percent of the appraised value basis, rounded half up to the cent, and
      the appraised value basis is the appraised_value on the loan's maturity case, which must be dated within that case plan's appraisal_valid_months.
    property_type: The called-due appraisal charge is instead appraisal_fee_two_to_four for a two_to_four_unit property and appraisal_fee_condo_manufactured
      for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan, which records no property_type, keeps appraisal_fee_standard.
    called_due_appraisal: The called-due appraisal charge is instead appraisal_fee_two_to_four for a two_to_four_unit property and appraisal_fee_condo_manufactured
      for an fha_approved_condominium or manufactured_home property; every other property, and a Summit loan, which records no property_type, keeps appraisal_fee_standard.
    appraisal_date: The replacement appraisal charge is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the effective_date
      of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it, and replacement_appraisal_fee
      when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date; a case with no appraisal_date,
      or whose appraisal falls within neither span, keeps 0.00.
    called_due_date: The replacement appraisal charge is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the effective_date
      of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it, and replacement_appraisal_fee
      when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date; a case with no appraisal_date,
      or whose appraisal falls within neither span, keeps 0.00.
    appraisal_order_days: The replacement appraisal charge is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the
      effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it,
      and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    extensions_granted: 'The prompt-decision credit is instead figured from the latest accepted intent_declaration on the maturity case when it states retain_property
      and its request_date is on or before the case''s response_deadline: it is prompt_decision_credit when the case carries no maturity_extension_granted
      entry, and prompt_decision_credit less credit_reduction_per_extension for each maturity_extension_granted entry on the case, not below 0.00, when
      it carries one or more; a case whose latest accepted intent_declaration states another intent or is dated after the response_deadline, or that has
      none, keeps 0.00.'
    last_extension_date: The replacement appraisal charge is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the
      effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it,
      and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    replacement_appraisal: The replacement appraisal charge is instead update_appraisal_fee when the maturity case's appraisal_date falls on or after the
      effective_date of the case's latest maturity_extension_granted entry and no more than the case plan's appraisal_order_days calendar days after it,
      and replacement_appraisal_fee when it does not and the appraisal_date is more than appraisal_order_days calendar days after the case's due_and_payable_date;
      a case with no appraisal_date, or whose appraisal falls within neither span, keeps 0.00.
    maturity_status: The foreclosure charge is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the approval date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    referral_date: The foreclosure charge is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the approval date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    referral_age: The foreclosure charge is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the approval date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    foreclosure_charge: The foreclosure charge is instead foreclosure_charges_full when the maturity case's status is foreclosure_referred and its referral_date
      is at least first_legal_action_days calendar days before the approval date, and foreclosure_charges_initial when its status is foreclosure_referred
      and it was referred fewer days before, a case with no referral_date counting as referred 0 days before; a case in any other status keeps 0.00.
    profile_id: The property securing charge is instead securing_fee_vacant when the latest residency_inspection_result on the loan's occupancy profile
      found the home vacant and securing_fee_unconfirmed when that result was unable_to_determine, in each case only where the maturity case's plan has
      vacant_property_securing true; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00.
    inspection_result: Where several residency_inspection_result entries on the occupancy profile share the latest effective_date, a vacant finding among
      them counts as the latest result, and otherwise an unable_to_determine finding does.
    securing_allowed: The property securing charge is instead securing_fee_vacant when the latest residency_inspection_result on the loan's occupancy profile
      found the home vacant and securing_fee_unconfirmed when that result was unable_to_determine, in each case only where the maturity case's plan has
      vacant_property_securing true; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00.
    securing_charge: The property securing charge is instead securing_fee_vacant when the latest residency_inspection_result on the loan's occupancy profile
      found the home vacant and securing_fee_unconfirmed when that result was unable_to_determine, in each case only where the maturity case's plan has
      vacant_property_securing true; any other result, no result, or a plan whose vacant_property_securing is false keeps 0.00.
    notices_sent: The notice postage charge is instead notice_postage_four_plus when the maturity case carries four or more maturity_notice_sent entries
      and notice_postage_two_three when it carries two or three; a case with fewer keeps 0.00.
    notice_postage: The notice postage charge is instead notice_postage_four_plus when the maturity case carries four or more maturity_notice_sent entries
      and notice_postage_two_three when it carries two or three; a case with fewer keeps 0.00.
    latest_intent: Where several accepted intent_declarations on the case share the latest request_date, the latest declaration states retain_property only
      when every one of them does.
    latest_intent_date: 'The prompt-decision credit is instead figured from the latest accepted intent_declaration on the maturity case when it states retain_property
      and its request_date is on or before the case''s response_deadline: it is prompt_decision_credit when the case carries no maturity_extension_granted
      entry, and prompt_decision_credit less credit_reduction_per_extension for each maturity_extension_granted entry on the case, not below 0.00, when
      it carries one or more; a case whose latest accepted intent_declaration states another intent or is dated after the response_deadline, or that has
      none, keeps 0.00.'
    response_deadline: 'The prompt-decision credit is instead figured from the latest accepted intent_declaration on the maturity case when it states retain_property
      and its request_date is on or before the case''s response_deadline: it is prompt_decision_credit when the case carries no maturity_extension_granted
      entry, and prompt_decision_credit less credit_reduction_per_extension for each maturity_extension_granted entry on the case, not below 0.00, when
      it carries one or more; a case whose latest accepted intent_declaration states another intent or is dated after the response_deadline, or that has
      none, keeps 0.00.'
    prompt_credit: 'The prompt-decision credit is instead figured from the latest accepted intent_declaration on the maturity case when it states retain_property
      and its request_date is on or before the case''s response_deadline: it is prompt_decision_credit when the case carries no maturity_extension_granted
      entry, and prompt_decision_credit less credit_reduction_per_extension for each maturity_extension_granted entry on the case, not below 0.00, when
      it carries one or more; a case whose latest accepted intent_declaration states another intent or is dated after the response_deadline, or that has
      none, keeps 0.00.'
    balance_figure: The retention balance figure is the statement_balance the payoff case carries plus five resolution charges, the called-due appraisal
      charge, the replacement appraisal charge, the foreclosure charge, the property securing charge and the notice postage charge, less the prompt-decision
      credit; the charges are added and the credit deducted before the lesser of the two figures is taken.
    result: Under the standard rule, the approved retention payoff is the lesser of the retention balance figure and the due-and-payable value cap, rounded
      half up to the cent and only at that last step.
  factors:
  - id: approval_called_due_appraisal_charge
    effect: parameter
    decides: called_due_appraisal
    bindings:
    - property_type
    - called_due_appraisal
    ladder:
    - when: two_to_four_unit property
      value: appraisal_fee_two_to_four
    - when: fha_approved_condominium or manufactured_home property
      value: appraisal_fee_condo_manufactured
    - when: otherwise
      value: appraisal_fee_standard
    baseline:
      called_due_appraisal: K('appraisal_fee_standard')
    evidence:
    - cross_category
    cross_difficulty: hecm
  - id: approval_replacement_appraisal_charge
    effect: parameter
    decides: replacement_appraisal
    bindings:
    - appraisal_date
    - called_due_date
    - appraisal_order_days
    - last_extension_date
    - replacement_appraisal
    ladder:
    - when: appraisal dated within appraisal_order_days on or after the latest granted extension
      value: update_appraisal_fee
    - when: otherwise an appraisal dated more than appraisal_order_days after the due-and-payable date
      value: replacement_appraisal_fee
    - when: otherwise
      value: '0.00'
    baseline:
      replacement_appraisal: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: maturity
  - id: approval_foreclosure_charge
    effect: parameter
    decides: foreclosure_charge
    bindings:
    - maturity_status
    - referral_date
    - referral_age
    - foreclosure_charge
    ladder:
    - when: foreclosure_referred and referred at least first_legal_action_days before the approval date
      value: foreclosure_charges_full
    - when: foreclosure_referred and referred fewer days before
      value: foreclosure_charges_initial
    - when: otherwise
      value: '0.00'
    baseline:
      foreclosure_charge: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  - id: approval_property_securing_charge
    effect: parameter
    decides: securing_charge
    bindings:
    - profile_id
    - inspection_result
    - securing_allowed
    - securing_charge
    ladder:
    - when: securing permitted and the latest inspection found the home vacant
      value: securing_fee_vacant
    - when: securing permitted and the latest inspection was unable_to_determine
      value: securing_fee_unconfirmed
    - when: otherwise
      value: '0.00'
    baseline:
      securing_charge: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: approval_notice_postage_charge
    effect: parameter
    decides: notice_postage
    bindings:
    - notices_sent
    - notice_postage
    ladder:
    - when: four or more maturity_notice_sent entries on the case
      value: notice_postage_four_plus
    - when: two or three such entries
      value: notice_postage_two_three
    - when: otherwise
      value: '0.00'
    baseline:
      notice_postage: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: maturity
  - id: approval_prompt_decision_credit
    effect: method
    decides: prompt_credit
    bindings:
    - extensions_granted
    - latest_intent
    - latest_intent_date
    - response_deadline
    - prompt_credit
    ladder:
    - when: latest accepted intent declaration states retain_property on time and no granted extension
      method: the flat prompt_decision_credit
    - when: such a timely retain declaration and one or more granted extensions
      method: prompt_decision_credit less credit_reduction_per_extension per granted extension, not below 0.00
    - when: otherwise
      method: no credit (0.00)
    baseline:
      prompt_credit: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: maturity
  baseline:
    rule: Under the standard rule, the approved retention payoff is the lesser of the retention balance figure and the due-and-payable value cap, rounded
      half up to the cent and only at that last step. The due-and-payable value cap is due_and_payable_pct_of_appraised percent of the appraised value basis,
      rounded half up to the cent, and the appraised value basis is the appraised_value on the loan's maturity case, which must be dated within that case
      plan's appraisal_valid_months. The retention balance figure is the statement_balance the payoff case carries plus five resolution charges, the called-due
      appraisal charge, the replacement appraisal charge, the foreclosure charge, the property securing charge and the notice postage charge, less the prompt-decision
      credit; the charges are added and the credit deducted before the lesser of the two figures is taken. Under the standard rule the called-due appraisal
      charge is appraisal_fee_standard, and the replacement appraisal charge, the foreclosure charge, the property securing charge, the notice postage charge
      and the prompt-decision credit are each 0.00.
    params:
    - due_and_payable_pct_of_appraised
    - appraisal_fee_standard
  inputs:
    history:
    - category: maturity
      table: maturity_case_events
      aggregate: count
      field: maturity_event_id
      filters:
        event_type: maturity_notice_sent
    - category: maturity
      table: maturity_case_events
      aggregate: count
      field: maturity_event_id
      filters:
        event_type: maturity_extension_granted
    - category: maturity
      table: maturity_requests
      aggregate: latest
      field: stated_intent
      filters:
        request_type: intent_declaration
        request_status: accepted
    - category: residency
      table: residency_events
      aggregate: latest
      field: inspection_outcome
      filters:
        event_type: residency_inspection_result
    cross_category:
    - hecm
    - residency
    - maturity
- id: payoff_ext_retention_remittance
  base_policy_refs:
  - payoff_agg_funds
  overwrite:
  - base_policy: payoff_agg_funds
    superseded_clause: Each remittance is recorded once, identified by its remittance_reference.
    replaced_by: Each remittance is recorded once, identified by its remittance_reference; a remittance the borrower of record sends in person on a retention
      payoff or as a short-sale seller contribution receives its remittance_reference from the servicer when it is recorded, and is recorded once under
      that issued reference.
  - base_policy: payoff_agg_funds
    superseded_clause: On satisfaction exactly the required payoff amount is applied to the loan, per funds_application_timing; any held excess is refunded
      within overpayment_refund_business_days business days to the remitter of the receipt that took the pooled total over the required amount, up to that
      receipt's amount, and then to earlier remitters in reverse order of receipt, per remitter_refund_target.
    replaced_by: On satisfaction exactly the required payoff amount is applied to the loan, per funds_application_timing, and on a retention payoff, the
      payoff case of a Borrower Voluntary Payoff requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period
      or foreclosure_referred, or on the payoff case of an Approved Short Sale Payoff requested by the borrower of record, the remittance charges collected
      with the borrower's own remittance, other than its clearing cushion, are then retained for those charges, and the clearing cushion, per diem collected
      in advance, is kept only for the per diem the case owes for each day its funds were credited after the statement's good-through date, per interest_through_basis;
      any held excess left, an unused cushion included, is refunded within overpayment_refund_business_days business days to the remitter of the receipt
      that took the pooled total over the required amount, up to that receipt's amount, and then to earlier remitters in reverse order of receipt, per remitter_refund_target.
  trigger: on_request
  subject:
  - payoff_funds_received
  computes: amount
  target_tool: remit_borrower_payoff_funds_17f1493b
  params:
    cushion_flat_extension: 100.0
    wire_fee_three_plus: 30.0
    wire_fee_two: 15.0
    returned_check_fee: 35.0
    recalled_wire_fee: 25.0
    title_search_fee_standard: 40.0
    title_search_fee_mid: 65.0
    title_search_fee_long: 95.0
    title_search_mid_months: 60
    title_search_long_months: 120
    release_recording_fee_per_instrument: 48.0
  rule: This policy sets the retention remittance, the amount the borrower of record sends in person to the payoff case of a Borrower Voluntary Payoff requested
    by the borrower of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred. Each remittance is recorded once,
    identified by its remittance_reference; a remittance the borrower of record sends in person on a retention payoff or as a short-sale seller contribution
    receives its remittance_reference from the servicer when it is recorded, and is recorded once under that issued reference. On satisfaction exactly the
    required payoff amount is applied to the loan, per funds_application_timing, and on a retention payoff, the payoff case of a Borrower Voluntary Payoff
    requested by the borrower of record on a loan whose maturity case is due_and_payable, extension_period or foreclosure_referred, or on the payoff case
    of an Approved Short Sale Payoff requested by the borrower of record, the remittance charges collected with the borrower's own remittance, other than
    its clearing cushion, are then retained for those charges, and the clearing cushion, per diem collected in advance, is kept only for the per diem the
    case owes for each day its funds were credited after the statement's good-through date, per interest_through_basis; any held excess left, an unused
    cushion included, is refunded within overpayment_refund_business_days business days to the remitter of the receipt that took the pooled total over the
    required amount, up to that receipt's amount, and then to earlier remitters in reverse order of receipt, per remitter_refund_target. The retention remittance
    is worked out only once the payoff case carries an approved appraisal basis with its required payoff amount. Under the standard rule, the retention
    remittance is the remittance shortfall plus the clearing cushion plus four remittance charges, the wire receipt fee, the returned remittance fee, the
    release title search fee and the release recording charge, rounded half up to the cent and only at that last step; the shortfall is floored at 0.00
    before the cushion and the charges are added. The remittance shortfall is the required_payoff_amount the payoff case carries less the funds the case
    holds net of returns, every payoff_funds_received amount on the case less every payoff_funds_returned amount on it, and never below 0.00. Under the
    standard rule the clearing cushion, the wire receipt fee and the returned remittance fee are each 0.00, the release title search fee is title_search_fee_standard
    and the release recording charge is release_recording_fee_per_instrument for one recorded instrument. The clearing cushion is per diem collected in
    advance against funds being credited after the statement's good-through date, and whatever of it is not needed for that per diem is refunded with the
    held excess. It is instead the per diem the payoff case carries times late_funds_tolerance_days when the maturity case's status is foreclosure_referred,
    and the flat cushion_flat_extension when its status is extension_period; a case in any other status keeps 0.00. The wire receipt fee is instead wire_fee_three_plus
    when the case carries three or more payoff_funds_received entries with remittance_method wire, recalled ones included, and wire_fee_two when it carries
    exactly two; a case with fewer keeps 0.00. The returned remittance fee is instead returned_check_fee when any payoff_funds_returned entry on the case
    has remittance_method cashiers_check, and recalled_wire_fee when the case carries a payoff_funds_returned entry with remittance_method wire and none
    with cashiers_check; a case with neither keeps 0.00. The release title search fee is instead title_search_fee_long when the loan's closing_date is at
    least title_search_long_months whole calendar months before the remittance date and title_search_fee_mid when it is at least title_search_mid_months
    but fewer than title_search_long_months whole calendar months before it; a loan closed more recently keeps title_search_fee_standard, and a loan with
    no closing_date counts 0 months. The release recording charge is instead release_recording_fee_per_instrument for each of three instruments, the lender's
    mortgage, the Secretary's second mortgage and the trustee's certification, for a HECM whose occupancy profile is a Living Trust Certification, and for
    each of two instruments, the lender's mortgage and the Secretary's second mortgage, for any other HECM; a Summit loan keeps one instrument.
