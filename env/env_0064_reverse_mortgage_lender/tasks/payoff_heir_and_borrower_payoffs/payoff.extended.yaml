  baseline:
    rule: Under the standard rule, the retention statement balance is the loan's principal_balance plus the retention accrual charge plus five statement
      charges, the statement tax disbursement, the statement hazard disbursement, the statement flood disbursement, the statement servicing fee and the
      statement maintenance charge, rounded half up to the cent and only at that last step. The retention accrual charge is the per diem the payoff case
      carries times the retention accrual days, which are the calendar days from the effective_date of the latest posted interest accrual on the loan to
      the statement date, 0 for a loan with no posted interest accrual, plus the statement window days. Under the standard rule the statement window days
      are statement_good_through_days, and the statement tax disbursement, the statement hazard disbursement, the statement flood disbursement, the statement
      servicing fee and the statement maintenance charge are each 0.00. The statement_good_through_date is the statement date plus the statement window
      days.
    params:
    - statement_good_through_days
