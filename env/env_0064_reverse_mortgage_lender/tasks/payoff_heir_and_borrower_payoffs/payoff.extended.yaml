  factors:
  - id: contribution_clearing_cushion
    effect: method
    decides: clearing_cushion
    bindings:
    - per_diem_on_case
    - maturity_status
    - clearing_cushion
    ladder:
    - when: maturity case foreclosure_referred
      method: the per diem on the case times late_funds_tolerance_days collected in advance, the unused part refunded
    - when: maturity case extension_period
      method: the flat cushion_flat_extension collected in advance, the unused part refunded
    - when: otherwise
      method: no cushion (0.00)
    baseline:
      clearing_cushion: '0'
    evidence:
    - cross_category
    cross_difficulty: maturity
  - id: contribution_wire_fee
    effect: parameter
    decides: wire_fee
    bindings:
    - wire_receipts
    - wire_fee
    ladder:
    - when: three or more wire receipts on the case, recalled ones included
      value: wire_fee_three_plus
    - when: exactly two wire receipts
      value: wire_fee_two
    - when: otherwise
      value: '0.00'
    baseline:
      wire_fee: '0'
    evidence:
    - history
  - id: contribution_returned_item_fee
    effect: parameter
    decides: returned_fee
    bindings:
    - check_returns
    - wire_returns
    - returned_fee
    ladder:
    - when: a returned cashiers_check on the case
      value: returned_check_fee
    - when: a returned wire and no returned cashiers_check
      value: recalled_wire_fee
    - when: otherwise
      value: '0.00'
    baseline:
      returned_fee: '0'
    evidence:
    - history
  - id: contribution_title_search
    effect: parameter
    decides: title_search_fee
    bindings:
    - closing_date
    - loan_age_months
    - title_search_fee
    ladder:
    - when: loan closed at least title_search_long_months whole months before
      value: title_search_fee_long
    - when: closed title_search_mid_months to fewer than title_search_long_months months before
      value: title_search_fee_mid
    - when: otherwise
      value: title_search_fee_standard
    baseline:
      title_search_fee: K('title_search_fee_standard')
    evidence:
    - cross_category
    - date
    cross_difficulty: hecm
  baseline:
    rule: Under the standard rule, the seller closing contribution is the contribution shortfall plus the contribution cushion plus three contribution charges,
      the contribution wire fee, the contribution returned-item fee and the contribution title search fee, rounded half up to the cent and only at that
      last step; the shortfall is floored at 0.00 before the cushion and the charges are added. The contribution shortfall is the contract costs above the
      allowance, the commission_amount plus the other_closing_costs of the case's accepted purchase_contract_submission, the latest by request_date (where
      several accepted submissions share that request_date, the largest commission_amount and the largest other_closing_costs among them), less the allowed_closing_costs
      the payoff case carries, less the funds the case holds net of returns, every payoff_funds_received amount on the case less every payoff_funds_returned
      amount on it, and never below 0.00; a case with no accepted purchase_contract_submission counts its contract costs as 0.00. Under the standard rule
      the contribution cushion, the contribution wire fee and the contribution returned-item fee are each 0.00 and the contribution title search fee is
      title_search_fee_standard.
    params:
    - title_search_fee_standard
  inputs:
    history:
    - category: payoff
      table: payoff_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: payoff_funds_received
    - category: payoff
      table: payoff_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: payoff_funds_returned
    - category: payoff
      table: payoff_transactions
      aggregate: count
      field: payoff_txn_id
      filters:
        event_type: payoff_funds_received
        remittance_method: wire
    cross_category:
    - hecm
    - jumbo
    - maturity
