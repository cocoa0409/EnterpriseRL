    wire_fee: The contribution wire fee is instead wire_fee_three_plus when the case carries three or more payoff_funds_received entries with remittance_method
      wire, recalled ones included, and wire_fee_two when it carries exactly two; a case with fewer keeps 0.00.
    check_returns: The contribution returned-item fee is instead returned_check_fee when any payoff_funds_returned entry on the case has remittance_method
