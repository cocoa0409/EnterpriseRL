extended_policies:
  - id: residency_ext_reclass_due_redating
    base_policy_refs:
    - residency_household_change
    - residency_evt_certification
    - residency_overdue_inspection
    overwrite:
    - base_policy: residency_household_change
      superseded_clause: the open cycle's due date is unchanged.
      replaced_by: When a profile is reclassified after a certifying borrower's death, the plan it moves to is the plan named
        in reclassify_on_borrower_death for its current plan and the move rests on an accepted death notice on file for the
        profile; an open cycle whose due date has already passed is re-dated under this policy, and an open cycle whose due
        date has not passed keeps its due date.
    trigger: state_due
    subject:
    - residency_reclassified
    computes: response_days
    target_tool: reclassify_occupancy_plan_0e562024
    params:
      letters_two: 30
      letters_one: 15
      overdue_both: 21
      overdue_one: 14
      cob_active: 15
      cob_inactive: 7
      report_prompt_days: 30
      report_prompt: 14
      report_late: 7
      headroom_early_months: 6
      headroom_limit_months: 12
      headroom_early: 30
      headroom_mid: 15
      letter_window_months: 12
      report_late_days: 90
    rule: This policy fixes the response days a profile's open certification cycle is given when the profile is reclassified
      after a certifying borrower's death. When a profile is reclassified after a certifying borrower's death, the plan it moves
      to is the plan named in reclassify_on_borrower_death for its current plan and the move rests on an accepted death notice
      on file for the profile; an open cycle whose due date has already passed is re-dated under this policy, and an open cycle
      whose due date has not passed keeps its due date. The response days are the calendar days from the reclassification date
      to the open cycle's resulting due date, negative where that due date lies before the reclassification date. Where the
      open cycle's due date has passed by the reclassification date, the resulting due date is the re-dating anchor plus the
      survivor allowance, the survivor allowance being the sum of the allowances this policy sets out. Under the standard rule
      the re-dating anchor is the reclassification date, and the facility-letter allowance, the overdue-cycle allowance, the
      co-borrower allowance, the report allowance and the headroom allowance are each zero days. Where the open cycle's due
      date has not passed, the resulting due date is that due date. The death notice is the accepted death notice on file for
      the profile received most recently, with the date of death it states and the date it was received; where none is on file,
      the handling date stands in for both. A facility letter is an accepted supporting document on file about the primary borrower,
      received less than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document
      is none. The open cycle is the certification year equal to the calendar year of the open cycle's due date. Whole calendar
      months are counted as anniversaries of the day number, a month being complete only on the same day number of a later month.
      The re-dating anchor is the date the death notice was received where the primary borrower has an accepted health-care
      absence notice on file (the surviving borrower, in care, could answer only once the death was reported); the date of death
      where the primary borrower has no such notice and the death came on or after the open cycle's due date; and the reclassification
      date in every other case. The facility-letter allowance is letters_two days where two or more facility letters are on
      file, letters_one days where exactly one is, and zero days where none is. The overdue-cycle allowance is overdue_both
      days where the open cycle carries both a recorded occupied_by_borrower inspection finding and a recorded certification,
      overdue_one days where it carries exactly one of the two, and zero days where it carries neither. The co-borrower allowance
      is cob_active days where the monitored HECM loan names a co-borrower and its status is active, cob_inactive days where
      it names a co-borrower and its status is not active, and zero days where it names none or the profile monitors no HECM
      loan. The report allowance is report_prompt days where the death notice was received no more than report_prompt_days calendar
      days after the date of death it states, a notice received before that date counting as received on it; report_late days
      where it was received more than report_prompt_days and no more than report_late_days calendar days after it; and zero
      days where it was received later still. The headroom allowance is headroom_early days where the facility admission stated
      on the primary borrower's accepted health-care absence notice received most recently lies fewer than headroom_early_months
      whole calendar months before the handling date, headroom_mid days where it lies headroom_early_months or more but fewer
      than headroom_limit_months, and zero days where it lies headroom_limit_months or more or no such notice is on file. Where
      two records share the date a reading is ordered by, the one entered first is read.
    prerequisite: []
    cross_category:
    - category: hecm
      as: branch
      reads:
      - co_borrower_customer_id
      - status
      note: The co-borrower allowance reads whether the monitored HECM loan names a co-borrower and whether its status is active.
    compute:
    - due_on_file: F('certification_due_date')
    - due_passed: due_on_file < NOW
    - death_day: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='death_notice', review_status='accepted')
        or NOW
    - death_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='death_notice',
        review_status='accepted') or NOW
    - open_cycle_year: MONTHS('0000-01-01', due_on_file) // 12
    - primary_stay_notices: COUNT('residency_submissions', submission_type='health_absence_notice', review_status='accepted',
        subject_customer_id=CUST)
    - redating_anchor_day: death_received if primary_stay_notices >= 1 else (death_day if death_day >= due_on_file else NOW)
    - facility_letters: COUNT('residency_submissions', within_months=K('letter_window_months'), date_field='received_date',
        submission_type='supporting_document', review_status='accepted', subject_customer_id=CUST) if P('supporting_document')
        == 'none' else 0
    - letter_allowance: K('letters_two') if facility_letters >= 2 else (K('letters_one') if facility_letters == 1 else 0)
    - cycle_occupied_findings: COUNT('residency_events', event_type='residency_inspection_result', inspection_outcome='occupied_by_borrower',
        certification_year=open_cycle_year)
    - cycle_recorded_signatures: COUNT('residency_events', event_type='residency_certification_recorded', certification_year=open_cycle_year)
    - overdue_allowance: K('overdue_both') if (cycle_occupied_findings >= 1 and cycle_recorded_signatures >= 1) else (K('overdue_one')
        if (cycle_occupied_findings >= 1 or cycle_recorded_signatures >= 1) else 0)
    - monitored_loan: F('hecm_loan_id')
    - co_borrower_named: (CFIELD('hecm', 'co_borrower_customer_id', hecm_loan_id=monitored_loan) or '') != ''
    - loan_state: CFIELD('hecm', 'status', hecm_loan_id=monitored_loan) or ''
    - co_borrower_allowance: K('cob_active') if (co_borrower_named and loan_state == 'active') else (K('cob_inactive') if (co_borrower_named
        and loan_state != 'active') else 0)
    - report_lag: MX(0, DAYS(death_day, death_received))
    - report_allowance: K('report_prompt') if report_lag <= K('report_prompt_days') else (K('report_late') if report_lag <=
        K('report_late_days') else 0)
    - survivor_admission: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - survivor_months: MONTHS(survivor_admission, NOW) if survivor_admission != '' else 99
    - headroom_allowance: K('headroom_early') if survivor_months < K('headroom_early_months') else (K('headroom_mid') if survivor_months
        < K('headroom_limit_months') else 0)
    - result: (DAYS(NOW, redating_anchor_day) + letter_allowance + overdue_allowance + co_borrower_allowance + report_allowance
        + headroom_allowance) if due_passed else DAYS(NOW, due_on_file)
    compute_basis:
      due_on_file: Where the open cycle's due date has passed by the reclassification date
      due_passed: Where the open cycle's due date has passed by the reclassification date
      death_day: The death notice is the accepted death notice on file for the profile received most recently, with the date
        of death it states and the date it was received; where none is on file, the handling date stands in for both.
      death_received: The death notice is the accepted death notice on file for the profile received most recently, with the
        date of death it states and the date it was received; where none is on file, the handling date stands in for both.
      open_cycle_year: The open cycle is the certification year equal to the calendar year of the open cycle's due date.
      primary_stay_notices: the primary borrower has an accepted health-care absence notice on file
      redating_anchor_day: The re-dating anchor is the date the death notice was received where the primary borrower has an
        accepted health-care absence notice on file (the surviving borrower, in care, could answer only once the death was reported);
        the date of death where the primary borrower has no such notice and the death came on or after the open cycle's due
        date; and the reclassification date in every other case.
      facility_letters: A facility letter is an accepted supporting document on file about the primary borrower, received less
        than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is none.
      letter_allowance: The facility-letter allowance is letters_two days where two or more facility letters are on file, letters_one
        days where exactly one is, and zero days where none is.
      cycle_occupied_findings: where the open cycle carries both a recorded occupied_by_borrower inspection finding and a recorded
        certification
      cycle_recorded_signatures: where the open cycle carries both a recorded occupied_by_borrower inspection finding and a
        recorded certification
      overdue_allowance: The overdue-cycle allowance is overdue_both days where the open cycle carries both a recorded occupied_by_borrower
        inspection finding and a recorded certification, overdue_one days where it carries exactly one of the two, and zero
        days where it carries neither.
      monitored_loan: where the monitored HECM loan names a co-borrower and its status is active
      co_borrower_named: where the monitored HECM loan names a co-borrower and its status is active
      loan_state: where the monitored HECM loan names a co-borrower and its status is active
      co_borrower_allowance: The co-borrower allowance is cob_active days where the monitored HECM loan names a co-borrower
        and its status is active, cob_inactive days where it names a co-borrower and its status is not active, and zero days
        where it names none or the profile monitors no HECM loan.
      report_lag: where the death notice was received no more than report_prompt_days calendar days after the date of death
        it states, a notice received before that date counting as received on it
      report_allowance: The report allowance is report_prompt days where the death notice was received no more than report_prompt_days
        calendar days after the date of death it states, a notice received before that date counting as received on it; report_late
        days where it was received more than report_prompt_days and no more than report_late_days calendar days after it; and
        zero days where it was received later still.
      survivor_admission: the facility admission stated on the primary borrower's accepted health-care absence notice received
        most recently
      survivor_months: lies fewer than headroom_early_months whole calendar months before the handling date
      headroom_allowance: The headroom allowance is headroom_early days where the facility admission stated on the primary borrower's
        accepted health-care absence notice received most recently lies fewer than headroom_early_months whole calendar months
        before the handling date, headroom_mid days where it lies headroom_early_months or more but fewer than headroom_limit_months,
        and zero days where it lies headroom_limit_months or more or no such notice is on file.
      result: The response days are the calendar days from the reclassification date to the open cycle's resulting due date,
        negative where that due date lies before the reclassification date. Where the open cycle's due date has passed by the
        reclassification date, the resulting due date is the re-dating anchor plus the survivor allowance, the survivor allowance
        being the sum of the allowances this policy sets out. Under the standard rule the re-dating anchor is the reclassification
        date, and the facility-letter allowance, the overdue-cycle allowance, the co-borrower allowance, the report allowance
        and the headroom allowance are each zero days. Where the open cycle's due date has not passed, the resulting due date
        is that due date.
    factors:
    - id: redating_anchor
      effect: method
      decides: redating_anchor_day
      bindings:
      - primary_stay_notices
      - redating_anchor_day
      ladder:
      - when: the primary borrower has an accepted health-care absence notice on file
        method: the re-dating anchor is the date the death notice was received
      - when: the primary borrower has no such notice and the death came on or after the open cycle's due date
        method: the re-dating anchor is the date of death
      - when: otherwise
        method: the re-dating anchor is the reclassification date
      baseline:
        redating_anchor_day: NOW
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: letter_allowance_days
      effect: parameter
      decides: letter_allowance
      bindings:
      - facility_letters
      - letter_allowance
      ladder:
      - when: two or more facility letters are on file
        value: K('letters_two')
      - when: exactly one facility letter is on file
        value: K('letters_one')
      - when: otherwise
        value: '0'
      baseline:
        letter_allowance: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: overdue_cycle_allowance
      effect: parameter
      decides: overdue_allowance
      bindings:
      - cycle_occupied_findings
      - cycle_recorded_signatures
      - overdue_allowance
      ladder:
      - when: the open cycle carries both a recorded occupied_by_borrower inspection finding and a recorded certification
        value: K('overdue_both')
      - when: it carries exactly one of the two
        value: K('overdue_one')
      - when: otherwise
        value: '0'
      baseline:
        overdue_allowance: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: co_borrower_allowance_days
      effect: parameter
      decides: co_borrower_allowance
      bindings:
      - co_borrower_named
      - loan_state
      - co_borrower_allowance
      ladder:
      - when: the monitored HECM loan names a co-borrower and its status is active
        value: K('cob_active')
      - when: it names a co-borrower and its status is not active
        value: K('cob_inactive')
      - when: otherwise
        value: '0'
      baseline:
        co_borrower_allowance: '0'
      evidence:
      - cross_category
      cross_difficulty: hecm
    - id: report_allowance_days
      effect: parameter
      decides: report_allowance
      bindings:
      - report_lag
      - report_allowance
      ladder:
      - when: the death notice was received no more than report_prompt_days calendar days after the date of death it states,
          a notice received before that date counting as received on it
        value: K('report_prompt')
      - when: it was received more than report_prompt_days and no more than report_late_days calendar days after it
        value: K('report_late')
      - when: otherwise (received later still)
        value: '0'
      baseline:
        report_allowance: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: headroom_allowance_days
      effect: parameter
      decides: headroom_allowance
      bindings:
      - survivor_admission
      - survivor_months
      - headroom_allowance
      ladder:
      - when: the facility admission on the primary borrower's accepted health-care absence notice lies fewer than headroom_early_months
          whole calendar months before the handling date
        value: K('headroom_early')
      - when: it lies headroom_early_months or more but fewer than headroom_limit_months whole calendar months before it
        value: K('headroom_mid')
      - when: otherwise (headroom_limit_months or more, or no such notice)
        value: '0'
      baseline:
        headroom_allowance: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: The response days are the calendar days from the reclassification date to the open cycle's resulting due date, negative
        where that due date lies before the reclassification date. Where the open cycle's due date has passed by the reclassification
        date, the resulting due date is the re-dating anchor plus the survivor allowance, the survivor allowance being the sum
        of the allowances this policy sets out. Under the standard rule the re-dating anchor is the reclassification date, and
        the facility-letter allowance, the overdue-cycle allowance, the co-borrower allowance, the report allowance and the
        headroom allowance are each zero days. Where the open cycle's due date has not passed, the resulting due date is that
        due date.
      params: []
    inputs:
      history:
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: death_notice
          review_status: accepted
      - table: residency_submissions
        aggregate: count
        field: residency_submission_id
        filters:
          submission_type: supporting_document
          review_status: accepted
        within_months: 12
      - table: residency_events
        aggregate: count
        field: residency_event_id
        filters:
          event_type: residency_inspection_result
          inspection_outcome: occupied_by_borrower
      - table: residency_events
        aggregate: count
        field: residency_event_id
        filters:
          event_type: residency_certification_recorded
      cross_category:
      - hecm
  - id: residency_ext_absence_start_vacancy
    base_policy_refs:
    - residency_health_absence
    - residency_nonoccupancy
    - residency_overdue_inspection
    overwrite:
    - base_policy: residency_health_absence
      superseded_clause: The absence_start_date is the facility admission date per absence_start_basis, not the date the notice
        was received;
      replaced_by: 'The absence_start_date is the date the monitored borrower left the home for health care: the departure date
        where every continuity limit is met and otherwise the facility admission date per absence_start_basis, never the date
        the accepted notice was received;'
    trigger: state_due
    subject:
    - residency_absence_started
    computes: absence_start_date
    target_tool: open_absence_monitoring_c2b89a70
    params:
      window_household_sender: 30
      window_other_sender: 10
      corroboration_two_letters: 240
      corroboration_one_letter: 150
      own_notice_inspected: 30
      own_notice_one_signal: 21
      letter_window_months: 12
    rule: 'This policy fixes the date from which a borrower''s own health-care absence is counted when monitoring is opened
      on a profile. Monitoring begins only on an accepted health-care absence notice about the monitored borrower that carries
      the facility admission letter, no monitoring is opened while another borrower still occupies the home, and the consecutive-month
      limit is counted from the absence start date. The absence_start_date is the date the monitored borrower left the home
      for health care: the departure date where every continuity limit is met and otherwise the facility admission date per
      absence_start_basis, never the date the accepted notice was received; another borrower''s continued occupancy never moves
      it. Monitoring of a health-care absence is not opened until the profile carries the certification plan matching the borrowers
      still living on the loan. The monitored borrower is the profile''s primary borrower; the facility admission date is the
      date stated on the accepted health-care absence notice about that borrower received most recently, with the date that
      notice was received; where no such notice is on file, the handling date stands in for both. Every continuity limit is
      met when the departure date is earlier than the facility admission date, the calendar days from the departure date to
      the facility admission date are no more than the transfer window, a facility letter is on file and the calendar days from
      the facility admission date to its contact date are no more than the corroboration window, and the calendar days from
      the facility admission date to the accepted notice''s receipt are no more than the own-notice window. A letter contact
      date or a notice receipt earlier than the facility admission date counts as zero days after it. Under the standard rule
      the departure date is the facility admission date and the transfer window, the corroboration window and the own-notice
      window are each zero days, so the absence start date is the facility admission date. The turned-away notice is the rejected
      health-care absence notice about the monitored borrower received most recently, with the admission date it states, the
      date it was received, its reject reason and the person who sent it. A facility letter is an accepted supporting document
      on file about the monitored borrower, received less than letter_window_months whole calendar months before the handling
      date, on a plan whose supporting_document is none; the facility letter read is the one received most recently, with the
      contact date it states. Whole calendar months are counted as anniversaries of the day number, a month being complete only
      on the same day number of a later month. Where two records share the date a reading is ordered by, the one entered first
      is read. The departure date is the admission date the turned-away notice states where that admission is earlier than the
      facility admission date and the notice was rejected only because of who sent it (signer_not_required); it is the earlier
      of the date the turned-away notice was received and the facility admission date where the notice states such an earlier
      admission and was rejected for any other reason; and it is the facility admission date otherwise. The transfer window
      is window_household_sender days where the turned-away notice was sent by the co-borrower named on the monitored HECM loan,
      window_other_sender days where it was sent by anyone else, and zero days where no turned-away notice is on file. The corroboration
      window is corroboration_two_letters days where two or more facility letters are on file, corroboration_one_letter days
      where exactly one is, and zero days where none is. The own-notice window is own_notice_inspected days where an occupancy
      inspection was ordered on the profile with an order date less than twelve whole calendar months before the handling date
      and the monitored borrower has exactly one accepted health-care absence notice on file, own_notice_one_signal days where
      exactly one of those two holds, and zero days where neither holds.'
    prerequisite:
    - problem: residency_ext_reclass_due_redating
      kind: state_gate
      gate: residency_profiles.variant_name
      form: state
      policy_source: Monitoring of a health-care absence is not opened until the profile carries the certification plan matching
        the borrowers still living on the loan.
      condition: residency_profiles.variant_name names the plan whose entry conditions the living borrowers meet; after one
        of two Joint Borrower Certification borrowers has died with an accepted death notice on file, it reads Standard Annual
        Certification.
      resolved_by: reclassify_occupancy_plan_0e562024
      effect: Once the profile carries the plan of the surviving household, the gate on opening monitoring is satisfied and
        the absence start date is fixed on the reclassified profile.
    cross_category:
    - category: hecm
      as: branch
      reads:
      - co_borrower_customer_id
      note: The transfer-window factor reads whether the turned-away notice came from the co-borrower named on the monitored
        HECM loan.
    compute:
    - facility_admission: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='accepted', subject_customer_id=CUST) or NOW
    - facility_notice_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='accepted', subject_customer_id=CUST) or NOW
    - ta_admission: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='rejected', subject_customer_id=CUST) or ''
    - ta_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='rejected', subject_customer_id=CUST) or ''
    - ta_reason: LATEST('residency_submissions', 'reject_reason', date_field='received_date', submission_type='health_absence_notice',
        review_status='rejected', subject_customer_id=CUST) or ''
    - departure_day: ta_admission if (ta_admission != '' and ta_admission < facility_admission and ta_reason == 'signer_not_required')
        else (MN(ta_received, facility_admission) if (ta_admission != '' and ta_admission < facility_admission and ta_reason
        != 'signer_not_required') else facility_admission)
    - ta_sender: LATEST('residency_submissions', 'customer_id', date_field='received_date', submission_type='health_absence_notice',
        review_status='rejected', subject_customer_id=CUST) or ''
    - co_borrower_on_loan: CFIELD('hecm', 'co_borrower_customer_id', hecm_loan_id=F('hecm_loan_id')) or ''
    - transfer_window: K('window_household_sender') if (ta_sender != '' and ta_sender == co_borrower_on_loan) else (K('window_other_sender')
        if ta_sender != '' else 0)
    - letters_allowed: P('supporting_document') == 'none'
    - latest_letter_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='supporting_document',
        review_status='accepted', subject_customer_id=CUST) or ''
    - latest_letter_day: (LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='supporting_document',
        review_status='accepted', subject_customer_id=CUST) or '') if (letters_allowed and latest_letter_received != '' and
        MONTHS(latest_letter_received, NOW) >= 0 and MONTHS(latest_letter_received, NOW) < K('letter_window_months')) else ''
    - facility_letters: COUNT('residency_submissions', within_months=K('letter_window_months'), date_field='received_date',
        submission_type='supporting_document', review_status='accepted', subject_customer_id=CUST) if letters_allowed else 0
    - corroboration_window: K('corroboration_two_letters') if facility_letters >= 2 else (K('corroboration_one_letter') if facility_letters
        == 1 else 0)
    - recent_inspection_orders: COUNT('residency_events', within_months=12, date_field='effective_date', event_type='residency_inspection_ordered')
    - own_stay_notices: COUNT('residency_submissions', submission_type='health_absence_notice', review_status='accepted', subject_customer_id=CUST)
    - own_notice_window: K('own_notice_inspected') if (recent_inspection_orders >= 1 and own_stay_notices == 1) else (K('own_notice_one_signal')
        if (recent_inspection_orders >= 1 or own_stay_notices == 1) else 0)
    - result: departure_day if (departure_day < facility_admission and DAYS(departure_day, facility_admission) <= transfer_window
        and latest_letter_day != '' and MX(0, DAYS(facility_admission, latest_letter_day)) <= corroboration_window and MX(0,
        DAYS(facility_admission, facility_notice_received)) <= own_notice_window) else facility_admission
    compute_basis:
      facility_admission: the facility admission date is the date stated on the accepted health-care absence notice about that
        borrower received most recently, with the date that notice was received; where no such notice is on file, the handling
        date stands in for both.
      facility_notice_received: the facility admission date is the date stated on the accepted health-care absence notice about
        that borrower received most recently, with the date that notice was received; where no such notice is on file, the handling
        date stands in for both.
      ta_admission: The turned-away notice is the rejected health-care absence notice about the monitored borrower received
        most recently, with the admission date it states, the date it was received, its reject reason and the person who sent
        it.
      ta_received: The turned-away notice is the rejected health-care absence notice about the monitored borrower received most
        recently, with the admission date it states, the date it was received, its reject reason and the person who sent it.
      ta_reason: The turned-away notice is the rejected health-care absence notice about the monitored borrower received most
        recently, with the admission date it states, the date it was received, its reject reason and the person who sent it.
      departure_day: The departure date is the admission date the turned-away notice states where that admission is earlier
        than the facility admission date and the notice was rejected only because of who sent it (signer_not_required); it is
        the earlier of the date the turned-away notice was received and the facility admission date where the notice states
        such an earlier admission and was rejected for any other reason; and it is the facility admission date otherwise.
      ta_sender: The turned-away notice is the rejected health-care absence notice about the monitored borrower received most
        recently, with the admission date it states, the date it was received, its reject reason and the person who sent it.
      co_borrower_on_loan: where the turned-away notice was sent by the co-borrower named on the monitored HECM loan
      transfer_window: The transfer window is window_household_sender days where the turned-away notice was sent by the co-borrower
        named on the monitored HECM loan, window_other_sender days where it was sent by anyone else, and zero days where no
        turned-away notice is on file.
      letters_allowed: A facility letter is an accepted supporting document on file about the monitored borrower, received less
        than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is none;
      latest_letter_received: A facility letter is an accepted supporting document on file about the monitored borrower, received
        less than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is
        none;
      latest_letter_day: A facility letter is an accepted supporting document on file about the monitored borrower, received
        less than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is
        none; the facility letter read is the one received most recently, with the contact date it states.
      facility_letters: A facility letter is an accepted supporting document on file about the monitored borrower, received
        less than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is
        none;
      corroboration_window: The corroboration window is corroboration_two_letters days where two or more facility letters are
        on file, corroboration_one_letter days where exactly one is, and zero days where none is.
      recent_inspection_orders: where an occupancy inspection was ordered on the profile with an order date less than twelve
        whole calendar months before the handling date
      own_stay_notices: the monitored borrower has exactly one accepted health-care absence notice on file
      own_notice_window: The own-notice window is own_notice_inspected days where an occupancy inspection was ordered on the
        profile with an order date less than twelve whole calendar months before the handling date and the monitored borrower
        has exactly one accepted health-care absence notice on file, own_notice_one_signal days where exactly one of those two
        holds, and zero days where neither holds.
      result: Every continuity limit is met when the departure date is earlier than the facility admission date, the calendar
        days from the departure date to the facility admission date are no more than the transfer window, a facility letter
        is on file and the calendar days from the facility admission date to its contact date are no more than the corroboration
        window, and the calendar days from the facility admission date to the accepted notice's receipt are no more than the
        own-notice window. A letter contact date or a notice receipt earlier than the facility admission date counts as zero
        days after it.
    factors:
    - id: departure_anchor
      effect: method
      decides: departure_day
      bindings:
      - ta_reason
      - departure_day
      ladder:
      - when: the turned-away notice states an admission earlier than the facility admission date and was rejected only because
          of who sent it
        method: the departure date is the admission date the turned-away notice states
      - when: the turned-away notice states such an earlier admission and was rejected for any other reason
        method: the departure date is the earlier of the turned-away notice's receipt date and the facility admission date
      - when: otherwise
        method: the departure date is the facility admission date
      baseline:
        departure_day: facility_admission
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: transfer_window_days
      effect: parameter
      decides: transfer_window
      bindings:
      - ta_sender
      - co_borrower_on_loan
      - transfer_window
      ladder:
      - when: the turned-away notice was sent by the co-borrower named on the monitored HECM loan
        value: K('window_household_sender')
      - when: it was sent by anyone else
        value: K('window_other_sender')
      - when: otherwise (no turned-away notice on file)
        value: '0'
      baseline:
        transfer_window: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: hecm
    - id: corroboration_days
      effect: parameter
      decides: corroboration_window
      bindings:
      - facility_letters
      - corroboration_window
      ladder:
      - when: two or more facility letters are on file
        value: K('corroboration_two_letters')
      - when: exactly one facility letter is on file
        value: K('corroboration_one_letter')
      - when: otherwise
        value: '0'
      baseline:
        corroboration_window: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: own_notice_days
      effect: parameter
      decides: own_notice_window
      bindings:
      - recent_inspection_orders
      - own_stay_notices
      - own_notice_window
      ladder:
      - when: an occupancy inspection was ordered on the profile in the last twelve whole calendar months and the monitored
          borrower has exactly one accepted health-care absence notice on file
        value: K('own_notice_inspected')
      - when: exactly one of those two holds
        value: K('own_notice_one_signal')
      - when: otherwise
        value: '0'
      baseline:
        own_notice_window: '0'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: Every continuity limit is met when the departure date is earlier than the facility admission date, the calendar
        days from the departure date to the facility admission date are no more than the transfer window, a facility letter
        is on file and the calendar days from the facility admission date to its contact date are no more than the corroboration
        window, and the calendar days from the facility admission date to the accepted notice's receipt are no more than the
        own-notice window. A letter contact date or a notice receipt earlier than the facility admission date counts as zero
        days after it. Under the standard rule the departure date is the facility admission date and the transfer window, the
        corroboration window and the own-notice window are each zero days, so the absence start date is the facility admission
        date.
      params: []
    inputs:
      history:
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: health_absence_notice
          review_status: accepted
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: health_absence_notice
          review_status: rejected
      - table: residency_submissions
        aggregate: count
        field: residency_submission_id
        filters:
          submission_type: supporting_document
          review_status: accepted
        within_months: 12
      - table: residency_events
        aggregate: count
        field: residency_event_id
        within_months: 12
        filters:
          event_type: residency_inspection_ordered
      cross_category:
      - hecm
  - id: residency_ext_facility_contact_number
    base_policy_refs:
    - residency_health_absence
    overwrite:
    - base_policy: residency_health_absence
      superseded_clause: During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the
        absence_start_date, numbered by residency_msr_absence_checkins plus one, and annual notices are suspended.
      replaced_by: During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the absence_start_date
        and annual notices are suspended; a check-in recording a contact confirmed by an accepted facility letter is numbered
        under this policy, a check-in the borrower confirms in person while still in care and the closing contact in which the
        borrower confirms having come home are numbered under their own rules, and every other check-in is numbered by residency_msr_absence_checkins
        plus one.
    trigger: state_due
    subject:
    - residency_absence_checkin
    computes: checkin_sequence
    target_tool: record_facility_checkin_6c7d3fa5
    params:
      late_letter_days: 30
      letter_stale_days: 120
      allowance_first: 14
      allowance_later: 7
      facility_link_days: 30
      first_offset_transfer: 30
      first_offset_late: 60
      cadence_paid_after_death: 60
      cadence_one_signal: 75
      letter_window_months: 12
      inspection_window_months: 6
    rule: 'This policy fixes the number a health-care absence check-in carries when it records a contact that the borrower''s
      care facility confirmed in an accepted facility letter on file for the profile''s primary borrower; the contact is recorded
      on the date the letter states for it, and the monitoring it belongs to remains as the base rule on health-care absences
      provides. A facility-confirmed contact is numbered only after the profile carries the start date of the health-care absence
      under monitoring. During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the
      absence_start_date and annual notices are suspended; a check-in recording a contact confirmed by an accepted facility
      letter is numbered under this policy, a check-in the borrower confirms in person while still in care and the closing contact
      in which the borrower confirms having come home are numbered under their own rules, and every other check-in is numbered
      by residency_msr_absence_checkins plus one. A facility letter is an accepted supporting document on file about the primary
      borrower, received less than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document
      is none; the letter read is the one received most recently, with the contact date it states and the date it was received,
      a letter received before the contact date it states counting as received on it; where none is on file, the handling date
      stands in for both. The borrower''s facility admission date is the date stated on the accepted health-care absence notice
      on file for the primary borrower received most recently; where none is on file, the profile''s absence start date stands
      in for it. Where the profile carries no absence start date, the handling date stands in for it. The check-in number is
      the scheduled contact number plus the numbers held for earlier contacts, those being the earlier-letter numbers and the
      inspection number. The scheduled contact number is the number of whole contact intervals in the calendar days from the
      profile''s absence start date to the standing date, after adding the early-answer allowance and taking away the first-contact
      offset, plus one, and never less than one; whole contact intervals are counted by dividing the day count by the contact
      interval and dropping any fraction. Under the standard rule the standing date is the contact date the letter states, the
      early-answer allowance is zero days, the first-contact offset and the contact interval are each health_absence_checkin_days
      calendar days, and the earlier-letter numbers and the inspection number are each zero. The standing date is the date the
      letter was received where it was received more than late_letter_days and no more than letter_stale_days calendar days
      after the contact date it states, the handling date where it was received later still, and the contact date it states
      otherwise. The early-answer allowance is allowance_first calendar days where no check-in is yet recorded on the profile,
      allowance_later calendar days where the latest recorded check-in cites the supporting document that confirmed it, and
      zero days where the latest recorded check-in cites none. The first-contact offset is first_offset_transfer calendar days
      where the borrower''s facility admission date falls after the profile''s absence start date by no more than facility_link_days
      calendar days (the absence began with a hospital stay and the facility made its first contact soon after the transfer),
      first_offset_late calendar days where it falls after the absence start date by more than facility_link_days calendar days,
      and health_absence_checkin_days calendar days where it falls on or before the absence start date. The contact interval
      is cadence_paid_after_death calendar days where the monitored HECM loan disbursed three or more scheduled monthly payments
      dated on or before the handling date and less than three whole calendar months before it and the profile has an accepted
      death notice on file, cadence_one_signal calendar days where exactly one of those two holds, and health_absence_checkin_days
      calendar days where neither holds. The earlier-letter numbers hold one number for each accepted facility letter on file
      other than the letter read, up to two: two where two or more such earlier letters are on file, one where exactly one is,
      and zero where none is. The inspection number holds one number for each occupancy inspection visit whose result is recorded
      on the profile dated less than inspection_window_months whole calendar months before the handling date, up to two: two
      where two or more such results are recorded, one where exactly one is, and zero where none is. Whole calendar months are
      counted as anniversaries of the day number, a month being complete only on the same day number of a later month. Where
      two records share the date a reading is ordered by, the one entered first is read.'
    prerequisite:
    - problem: residency_ext_absence_start_vacancy
      kind: value_input
      gate: stay_start
      form: state
      policy_source: A facility-confirmed contact is numbered only after the profile carries the start date of the health-care
        absence under monitoring.
      condition: residency_profiles.absence_start_date carries the start date of the monitored health-care absence (the profile
        is under absence monitoring).
      resolved_by: open_absence_monitoring_c2b89a70
      effect: Once the profile carries the absence start date, the scheduled contact number is counted from it and the first-contact
        offset and the inspection number test against it; without it the handling date stands in for the start date and the
        scheduled contact number falls to one.
    cross_category:
    - category: hecm
      as: history
      reads:
      - hecm_transactions.event_type
      - hecm_transactions.effective_date
      note: The contact-interval factor counts the monitored HECM loan's scheduled monthly payments in the last three months.
    compute:
    - stay_start: F('absence_start_date') or NOW
    - letters_allowed: P('supporting_document') == 'none'
    - letter_received_raw: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='supporting_document',
        review_status='accepted', subject_customer_id=CUST) or ''
    - letter_in_window: letters_allowed and letter_received_raw != '' and MONTHS(letter_received_raw, NOW) >= 0 and MONTHS(letter_received_raw,
        NOW) < K('letter_window_months')
    - letter_contact_day: (LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='supporting_document',
        review_status='accepted', subject_customer_id=CUST) or NOW) if letter_in_window else NOW
    - letter_received_day: MX(letter_contact_day, letter_received_raw) if letter_in_window else NOW
    - letter_lag: MX(0, DAYS(letter_contact_day, letter_received_day))
    - standing_day: letter_received_day if (letter_lag > K('late_letter_days') and letter_lag <= K('letter_stale_days')) else
        (NOW if letter_lag > K('letter_stale_days') else letter_contact_day)
    - recorded_checkins: COUNT('residency_events', event_type='residency_absence_checkin')
    - latest_checkin_ref: LATEST('residency_events', 'residency_submission_id', date_field='effective_date', event_type='residency_absence_checkin')
        or ''
    - early_allowance: K('allowance_first') if recorded_checkins == 0 else (K('allowance_later') if latest_checkin_ref != ''
        else 0)
    - facility_admission: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='accepted', subject_customer_id=CUST) or stay_start
    - first_offset: K('first_offset_transfer') if (facility_admission > stay_start and DAYS(stay_start, facility_admission)
        <= K('facility_link_days')) else (K('first_offset_late') if facility_admission > stay_start else P('health_absence_checkin_days'))
    - monitored_loan: F('hecm_loan_id')
    - paid_months_recent: XCOUNT('hecm', 'hecm_transactions', event_type='hecm_scheduled_payment', hecm_loan_id=monitored_loan,
        within_months=3, date_field='effective_date')
    - death_notices: COUNT('residency_submissions', submission_type='death_notice', review_status='accepted')
    - contact_interval: K('cadence_paid_after_death') if (paid_months_recent >= 3 and death_notices >= 1) else (K('cadence_one_signal')
        if (paid_months_recent >= 3 or death_notices >= 1) else P('health_absence_checkin_days'))
    - facility_letters: COUNT('residency_submissions', within_months=K('letter_window_months'), date_field='received_date',
        submission_type='supporting_document', review_status='accepted', subject_customer_id=CUST) if letters_allowed else 0
    - earlier_letter_numbers: 2 if facility_letters >= 3 else (1 if facility_letters == 2 else 0)
    - recent_inspection_results: COUNT('residency_events', within_months=K('inspection_window_months'), date_field='effective_date',
        event_type='residency_inspection_result')
    - inspection_number: 2 if recent_inspection_results >= 2 else (1 if recent_inspection_results == 1 else 0)
    - result: int(MX(1, (DAYS(stay_start, standing_day) + early_allowance - first_offset) // contact_interval + 1) + earlier_letter_numbers
        + inspection_number)
    compute_basis:
      stay_start: Where the profile carries no absence start date, the handling date stands in for it.
      letters_allowed: A facility letter is an accepted supporting document on file about the primary borrower, received less
        than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is none;
      letter_contact_day: the letter read is the one received most recently, with the contact date it states and the date it
        was received, a letter received before the contact date it states counting as received on it; where none is on file,
        the handling date stands in for both.
      letter_received_day: the letter read is the one received most recently, with the contact date it states and the date it
        was received, a letter received before the contact date it states counting as received on it; where none is on file,
        the handling date stands in for both.
      letter_lag: a letter received before the contact date it states counting as received on it;
      standing_day: The standing date is the date the letter was received where it was received more than late_letter_days and
        no more than letter_stale_days calendar days after the contact date it states, the handling date where it was received
        later still, and the contact date it states otherwise.
      recorded_checkins: where no check-in is yet recorded on the profile
      early_allowance: The early-answer allowance is allowance_first calendar days where no check-in is yet recorded on the
        profile, allowance_later calendar days where the latest recorded check-in cites the supporting document that confirmed
        it, and zero days where the latest recorded check-in cites none.
      facility_admission: The borrower's facility admission date is the date stated on the accepted health-care absence notice
        on file for the primary borrower received most recently; where none is on file, the profile's absence start date stands
        in for it.
      first_offset: The first-contact offset is first_offset_transfer calendar days where the borrower's facility admission
        date falls after the profile's absence start date by no more than facility_link_days calendar days (the absence began
        with a hospital stay and the facility made its first contact soon after the transfer), first_offset_late calendar days
        where it falls after the absence start date by more than facility_link_days calendar days, and health_absence_checkin_days
        calendar days where it falls on or before the absence start date.
      monitored_loan: the monitored HECM loan
      paid_months_recent: the monitored HECM loan disbursed three or more scheduled monthly payments dated on or before the
        handling date and less than three whole calendar months before it
      death_notices: the profile has an accepted death notice on file
      contact_interval: The contact interval is cadence_paid_after_death calendar days where the monitored HECM loan disbursed
        three or more scheduled monthly payments dated on or before the handling date and less than three whole calendar months
        before it and the profile has an accepted death notice on file, cadence_one_signal calendar days where exactly one of
        those two holds, and health_absence_checkin_days calendar days where neither holds.
      facility_letters: A facility letter is an accepted supporting document on file about the primary borrower, received less
        than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is none;
      earlier_letter_numbers: 'The earlier-letter numbers hold one number for each accepted facility letter on file other than
        the letter read, up to two: two where two or more such earlier letters are on file, one where exactly one is, and zero
        where none is.'
      inspection_number: 'The inspection number holds one number for each occupancy inspection visit whose result is recorded
        on the profile dated less than inspection_window_months whole calendar months before the handling date, up to two: two
        where two or more such results are recorded, one where exactly one is, and zero where none is.'
      result: The check-in number is the scheduled contact number plus the numbers held for earlier contacts, those being the
        earlier-letter numbers and the inspection number. The scheduled contact number is the number of whole contact intervals
        in the calendar days from the profile's absence start date to the standing date, after adding the early-answer allowance
        and taking away the first-contact offset, plus one, and never less than one; whole contact intervals are counted by
        dividing the day count by the contact interval and dropping any fraction.
      letter_received_raw: A facility letter is an accepted supporting document on file about the primary borrower, received
        less than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is
        none;
      letter_in_window: A facility letter is an accepted supporting document on file about the primary borrower, received less
        than letter_window_months whole calendar months before the handling date, on a plan whose supporting_document is none;
      latest_checkin_ref: where the latest recorded check-in cites the supporting document that confirmed it
      recent_inspection_results: each occupancy inspection visit whose result is recorded on the profile dated less than inspection_window_months
        whole calendar months before the handling date
    factors:
    - id: standing_day
      effect: method
      decides: standing_day
      bindings:
      - letter_lag
      - standing_day
      ladder:
      - when: the letter was received more than late_letter_days and no more than letter_stale_days calendar days after the
          contact date it states
        method: the standing date is the date the letter was received
      - when: the letter was received more than letter_stale_days calendar days after the contact date it states
        method: the standing date is the handling date
      - when: otherwise, including a letter received before the contact date it states
        method: the standing date is the contact date the letter states
      baseline:
        standing_day: letter_contact_day
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: early_answer_days
      effect: parameter
      decides: early_allowance
      bindings:
      - latest_checkin_ref
      - early_allowance
      ladder:
      - when: no check-in is yet recorded on the profile
        value: K('allowance_first')
      - when: the latest recorded check-in cites the supporting document that confirmed it
        value: K('allowance_later')
      - when: otherwise (the latest recorded check-in cites none)
        value: '0'
      baseline:
        early_allowance: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: first_contact_offset
      effect: parameter
      decides: first_offset
      bindings:
      - facility_admission
      - first_offset
      ladder:
      - when: the facility admission date falls after the absence start date by no more than facility_link_days calendar days
        value: K('first_offset_transfer')
      - when: it falls after the absence start date by more than facility_link_days calendar days
        value: K('first_offset_late')
      - when: otherwise (on or before the absence start date)
        value: P('health_absence_checkin_days')
      baseline:
        first_offset: P('health_absence_checkin_days')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: contact_interval_days
      effect: parameter
      decides: contact_interval
      bindings:
      - monitored_loan
      - paid_months_recent
      - death_notices
      - contact_interval
      ladder:
      - when: the monitored HECM loan disbursed three or more scheduled monthly payments in the last three whole calendar months
          and an accepted death notice is on file
        value: K('cadence_paid_after_death')
      - when: exactly one of those two holds
        value: K('cadence_one_signal')
      - when: otherwise
        value: P('health_absence_checkin_days')
      baseline:
        contact_interval: P('health_absence_checkin_days')
      evidence:
      - cross_category
      - history
      cross_difficulty: hecm
    - id: earlier_letter_count
      effect: parameter
      decides: earlier_letter_numbers
      bindings:
      - facility_letters
      - earlier_letter_numbers
      ladder:
      - when: two or more accepted facility letters are on file besides the letter read
        value: '2'
      - when: exactly one is
        value: '1'
      - when: otherwise
        value: '0'
      baseline:
        earlier_letter_numbers: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: inspection_visit
      effect: parameter
      decides: inspection_number
      bindings:
      - recent_inspection_results
      - inspection_number
      ladder:
      - when: two or more occupancy inspection results are recorded on the profile dated less than inspection_window_months
          whole calendar months before the handling date
        value: '2'
      - when: exactly one is
        value: '1'
      - when: otherwise (none is)
        value: '0'
