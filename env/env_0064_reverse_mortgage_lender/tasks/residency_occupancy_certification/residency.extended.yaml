  - id: residency_ext_call_in_checkin_number
    base_policy_refs:
    - residency_health_absence
    overwrite:
    - base_policy: residency_health_absence
      superseded_clause: During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the
        absence_start_date, numbered by residency_msr_absence_checkins plus one, and annual notices are suspended.
      replaced_by: During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the absence_start_date
        and annual notices are suspended; a check-in the borrower confirms in person while still in care is numbered under this
        policy, a contact confirmed by an accepted facility letter and the closing contact in which the borrower confirms having
        come home are numbered under their own rules, and every other check-in is numbered by residency_msr_absence_checkins
        plus one.
    trigger: on_request
    subject:
    - residency_absence_checkin
    computes: checkin_sequence
    target_tool: confirm_absence_checkin_948ffc7a
    params:
      call_cadence_long_paid: 28
      call_cadence_one_signal: 60
      long_stay_months: 6
      grace_after_facility_contact: 21
      grace_after_own_contact: 14
      settling_recent: 21
      settling_older: 10
      bereavement_months: 3
      letter_window_months: 12
      notice_link_days: 45
    rule: This policy fixes the number a health-care absence check-in carries when the absent primary borrower, still in care,
      confirms the check-in in person on the handling date; the monitoring it belongs to remains as the base rule on health-care
      absences provides. During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the
      absence_start_date and annual notices are suspended; a check-in the borrower confirms in person while still in care is
      numbered under this policy, a contact confirmed by an accepted facility letter and the closing contact in which the borrower
      confirms having come home are numbered under their own rules, and every other check-in is numbered by residency_msr_absence_checkins
      plus one. The borrower's own check-in is not numbered until the contact confirmed by the most recently received accepted
      facility letter stands on the profile as a recorded check-in. A facility letter is an accepted supporting document on
      file about the primary borrower, received less than letter_window_months whole calendar months before the handling date,
      on a plan whose supporting_document is none. The borrower's admission date is the date stated on the accepted health-care
      absence notice on file for the primary borrower received most recently, with the date that notice was received; where
      none is on file, the profile's absence start date stands in for both, and where the profile carries no absence start date
      the handling date stands in for that. The latest recorded check-in is the check-in on the profile with the latest date,
      with the supporting document it cites, if any; the highest recorded number is the highest check-in number on the profile,
      zero where none is recorded. The check-in number is the numbering basis plus the scheduled contacts that fell due since
      the count-from date. The scheduled contacts are the calendar days from the count-from date to the handling date, less
      the late-contact grace and less the settling period, divided by the call-in interval with any fraction dropped, and never
      fewer than one; that floor applies to the scheduled contacts before they are added to the numbering basis. Under the standard
      rule the numbering basis is the count of check-ins recorded on the profile, the count-from date is the profile's absence
      start date, the call-in interval is health_absence_checkin_days calendar days, and the late-contact grace and the settling
      period are each zero days. The numbering basis is the highest recorded number where the latest recorded check-in cites
      a supporting document (the facility numbers its contacts against the schedule); one where no check-in is recorded (the
      opening of monitoring is held as the first contact); and the count of check-ins recorded on the profile where the latest
      recorded check-in cites none. The count-from date is the date of the latest recorded check-in where a check-in is recorded
      on the profile; the date the borrower's absence notice was received where no check-in is recorded and that notice was
      received more than notice_link_days calendar days after the profile's absence start date (the schedule could be followed
      only from then); and the profile's absence start date in every other case. The call-in interval is call_cadence_long_paid
      calendar days where the borrower's admission date lies long_stay_months or more whole calendar months before the handling
      date and the monitored HECM loan disbursed three or more scheduled monthly payments dated on or before the handling date
      and less than three whole calendar months before it, call_cadence_one_signal calendar days where exactly one of those
      two holds, and health_absence_checkin_days calendar days where neither holds. The late-contact grace is grace_after_facility_contact
      calendar days where the latest recorded check-in cites a supporting document, grace_after_own_contact calendar days where
      a check-in is recorded but the latest cites none, and zero days where no check-in is recorded. The settling period is
      settling_recent calendar days where an accepted death notice on file for the profile was received less than bereavement_months
      whole calendar months before the handling date, settling_older calendar days where accepted death notices are on file
      but none received that recently, and zero days where none is on file. Whole calendar months are counted as anniversaries
      of the day number, a month being complete only on the same day number of a later month. Where two records share the date
      a reading is ordered by, the one entered first is read.
    prerequisite:
    - problem: residency_ext_facility_contact_number
      kind: value_input
      gate: top_number
      form: state
      policy_source: The borrower's own check-in is not numbered until the contact confirmed by the most recently received accepted
        facility letter stands on the profile as a recorded check-in.
      condition: residency_events carries a residency_absence_checkin entry for the profile citing the most recently received
        accepted facility letter (residency_submission_id), with its check-in number.
      resolved_by: record_facility_checkin_6c7d3fa5
      effect: Once the facility-confirmed contact is recorded, the highest recorded number and the date of the latest recorded
        check-in come from it, so the call-in number continues from that number and counts from that date; without it no check-in
        is recorded, the numbering basis is one (the opening of monitoring held as the first contact) and the scheduled contacts
        are counted from the absence start date, or from the absence notice's receipt where it came more than notice_link_days
        calendar days after the start.
    cross_category:
    - category: hecm
      as: history
      reads:
      - hecm_transactions.event_type
      - hecm_transactions.effective_date
      note: The call-in interval counts the monitored HECM loan's scheduled monthly payments in the last three months.
    compute:
    - stay_start: F('absence_start_date') or NOW
    - own_admission: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='accepted', subject_customer_id=CUST) or stay_start
    - own_notice_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='accepted', subject_customer_id=CUST) or stay_start
    - top_number: MAX('residency_events', 'checkin_sequence', event_type='residency_absence_checkin')
    - recorded_checkins: COUNT('residency_events', event_type='residency_absence_checkin')
    - latest_letter_ref: LATEST('residency_events', 'residency_submission_id', date_field='effective_date', event_type='residency_absence_checkin')
        or ''
    - basis_checkin_ref: LATEST('residency_events', 'residency_submission_id', date_field='effective_date', event_type='residency_absence_checkin')
        or ''
    - numbering_basis: top_number if (recorded_checkins >= 1 and basis_checkin_ref != '') else (1 if recorded_checkins == 0
        else recorded_checkins)
    - latest_checkin_day: LATEST('residency_events', 'effective_date', date_field='effective_date', event_type='residency_absence_checkin')
        or stay_start
    - count_from_day: latest_checkin_day if recorded_checkins >= 1 else (own_notice_received if DAYS(stay_start, own_notice_received)
        > K('notice_link_days') else stay_start)
    - monitored_loan: F('hecm_loan_id')
    - stay_months: MONTHS(own_admission, NOW)
    - paid_months_recent: XCOUNT('hecm', 'hecm_transactions', event_type='hecm_scheduled_payment', hecm_loan_id=monitored_loan,
        within_months=3, date_field='effective_date')
    - call_interval: K('call_cadence_long_paid') if (stay_months >= K('long_stay_months') and paid_months_recent >= 3) else
        (K('call_cadence_one_signal') if (stay_months >= K('long_stay_months') or paid_months_recent >= 3) else P('health_absence_checkin_days'))
    - late_grace: K('grace_after_facility_contact') if (recorded_checkins >= 1 and latest_letter_ref != '') else (K('grace_after_own_contact')
        if recorded_checkins >= 1 else 0)
    - recent_death_notices: COUNT('residency_submissions', within_months=K('bereavement_months'), date_field='received_date',
        submission_type='death_notice', review_status='accepted')
    - death_notices: COUNT('residency_submissions', submission_type='death_notice', review_status='accepted')
    - settling_days: K('settling_recent') if recent_death_notices >= 1 else (K('settling_older') if death_notices >= 1 else
        0)
    - result: int(numbering_basis + MX(1, (DAYS(count_from_day, NOW) - late_grace - settling_days) // call_interval))
    compute_basis:
      stay_start: where the profile carries no absence start date the handling date stands in for that.
      own_admission: The borrower's admission date is the date stated on the accepted health-care absence notice on file for
        the primary borrower received most recently, with the date that notice was received; where none is on file, the profile's
        absence start date stands in for both,
      top_number: the highest recorded number is the highest check-in number on the profile, zero where none is recorded.
      recorded_checkins: the count of check-ins recorded on the profile
      latest_letter_ref: The latest recorded check-in is the check-in on the profile with the latest date, with the supporting
        document it cites, if any;
      numbering_basis: The numbering basis is the highest recorded number where the latest recorded check-in cites a supporting
        document (the facility numbers its contacts against the schedule); one where no check-in is recorded (the opening of
        monitoring is held as the first contact); and the count of check-ins recorded on the profile where the latest recorded
        check-in cites none.
      latest_checkin_day: The latest recorded check-in is the check-in on the profile with the latest date, with the supporting
        document it cites, if any;
      count_from_day: The count-from date is the date of the latest recorded check-in where a check-in is recorded on the profile;
        the date the borrower's absence notice was received where no check-in is recorded and that notice was received more
        than notice_link_days calendar days after the profile's absence start date (the schedule could be followed only from
        then); and the profile's absence start date in every other case.
      monitored_loan: the monitored HECM loan
      stay_months: the borrower's admission date lies long_stay_months or more whole calendar months before the handling date
      paid_months_recent: the monitored HECM loan disbursed three or more scheduled monthly payments dated on or before the
        handling date and less than three whole calendar months before it
      call_interval: The call-in interval is call_cadence_long_paid calendar days where the borrower's admission date lies long_stay_months
        or more whole calendar months before the handling date and the monitored HECM loan disbursed three or more scheduled
        monthly payments dated on or before the handling date and less than three whole calendar months before it, call_cadence_one_signal
        calendar days where exactly one of those two holds, and health_absence_checkin_days calendar days where neither holds.
      late_grace: The late-contact grace is grace_after_facility_contact calendar days where the latest recorded check-in cites
        a supporting document, grace_after_own_contact calendar days where a check-in is recorded but the latest cites none,
        and zero days where no check-in is recorded.
      recent_death_notices: an accepted death notice on file for the profile was received less than bereavement_months whole
        calendar months before the handling date
      death_notices: where accepted death notices are on file but none received that recently
      settling_days: The settling period is settling_recent calendar days where an accepted death notice on file for the profile
        was received less than bereavement_months whole calendar months before the handling date, settling_older calendar days
        where accepted death notices are on file but none received that recently, and zero days where none is on file.
      result: The check-in number is the numbering basis plus the scheduled contacts that fell due since the count-from date.
        The scheduled contacts are the calendar days from the count-from date to the handling date, less the late-contact grace
        and less the settling period, divided by the call-in interval with any fraction dropped, and never fewer than one; that
        floor applies to the scheduled contacts before they are added to the numbering basis.
      own_notice_received: The borrower's admission date is the date stated on the accepted health-care absence notice on file
        for the primary borrower received most recently, with the date that notice was received; where none is on file, the
        profile's absence start date stands in for both,
      basis_checkin_ref: The latest recorded check-in is the check-in on the profile with the latest date, with the supporting
        document it cites, if any;
    factors:
    - id: numbering_basis
      effect: method
      decides: numbering_basis
      bindings:
      - basis_checkin_ref
      - numbering_basis
      ladder:
      - when: the latest recorded check-in cites a supporting document
        method: the numbering basis is the highest recorded number
      - when: no check-in is recorded
        method: the numbering basis is one, the opening of monitoring held as the first contact
      - when: otherwise (the latest recorded check-in cites none)
        method: the numbering basis is the count of check-ins recorded on the profile
      baseline:
        numbering_basis: recorded_checkins
      evidence:
      - history
      cross_difficulty: null
    - id: count_from
      effect: method
      decides: count_from_day
      bindings:
      - latest_checkin_day
      - own_notice_received
      - count_from_day
      ladder:
      - when: a check-in is recorded on the profile
        method: the count-from date is the date of the latest recorded check-in
      - when: no check-in is recorded and the borrower's absence notice was received more than notice_link_days calendar days
          after the absence start date
        method: the count-from date is the date that notice was received
      - when: otherwise
        method: the count-from date is the profile's absence start date
      baseline:
        count_from_day: stay_start
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: call_cadence_days
      effect: parameter
      decides: call_interval
      bindings:
      - stay_months
      - paid_months_recent
      - call_interval
      ladder:
      - when: the admission date lies long_stay_months or more whole calendar months before the handling date and the monitored
          HECM loan disbursed three or more scheduled monthly payments in the last three whole calendar months
        value: K('call_cadence_long_paid')
      - when: exactly one of those two holds
        value: K('call_cadence_one_signal')
      - when: otherwise
        value: P('health_absence_checkin_days')
      baseline:
        call_interval: P('health_absence_checkin_days')
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: hecm
    - id: late_contact_grace
      effect: parameter
      decides: late_grace
      bindings:
      - latest_letter_ref
      - late_grace
      ladder:
      - when: the latest recorded check-in cites a supporting document
        value: K('grace_after_facility_contact')
      - when: a check-in is recorded but the latest cites none
        value: K('grace_after_own_contact')
      - when: otherwise (no check-in recorded)
        value: '0'
      baseline:
        late_grace: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: settling_period
      effect: parameter
      decides: settling_days
      bindings:
      - recent_death_notices
      - death_notices
      - settling_days
      ladder:
      - when: an accepted death notice on file was received less than bereavement_months whole calendar months before the handling
          date
        value: K('settling_recent')
      - when: accepted death notices are on file but none that recent
        value: K('settling_older')
      - when: otherwise
        value: '0'
      baseline:
        settling_days: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: Under the standard rule the numbering basis is the count of check-ins recorded on the profile, the count-from date
        is the profile's absence start date, the call-in interval is health_absence_checkin_days calendar days, and the late-contact
        grace and the settling period are each zero days.
      params: []
    inputs:
      history:
      - table: residency_events
        aggregate: max
        field: checkin_sequence
        filters:
          event_type: residency_absence_checkin
      - table: residency_events
        aggregate: count
        field: residency_event_id
        filters:
          event_type: residency_absence_checkin
      - table: residency_events
        aggregate: latest
        field: effective_date
        filters:
          event_type: residency_absence_checkin
      - table: residency_submissions
        aggregate: count
        field: residency_submission_id
        within_months: 3
        filters:
          submission_type: death_notice
          review_status: accepted
      - category: hecm
        table: hecm_transactions
        aggregate: count
        field: hecm_txn_id
        within_months: 3
        filters:
          event_type: hecm_scheduled_payment
      cross_category:
