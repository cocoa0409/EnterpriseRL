  - id: residency_ext_return_redating
    base_policy_refs:
    - residency_health_absence
    overwrite:
    - base_policy: residency_health_absence
      superseded_clause: and any cycle whose due date passed during the absence is due within response_grace_days of the return.
      replaced_by: and any cycle whose due date passed during the absence is re-dated under this policy, while a cycle whose
        due date did not pass during the absence keeps the due date the profile shows.
    trigger: state_due
    subject:
    - residency_returned_home
    computes: response_days
    target_tool: record_return_home_baa2f4ef
    params:
      documented_mail: 14
      documented_one: 7
      long_absence_months: 6
      medium_absence_months: 3
      long_stay: 10
      medium_stay: 5
      paid_three: 7
      paid_some: 3
      contacts_two: 7
      contacts_many: 10
      confirm_gap_days: 14
      prompt_return_days: 7
    rule: This policy fixes the response days the open certification cycle is given when health-care absence monitoring ends
      with the primary borrower's return home on an accepted return-home notice; the status change and the clearing of the absence
      start date remain exactly as the base rule on health-care absences provides. When monitoring ends with the borrower's
      return, the profile becomes current and the absence_start_date is cleared, and any cycle whose due date passed during
      the absence is re-dated under this policy, while a cycle whose due date did not pass during the absence keeps the due
      date the profile shows. The return is not recorded until the borrower's own confirmation that the borrower is back home
      stands on the profile as a check-in. The return date is the date stated on the accepted return-home notice about the primary
      borrower received most recently, with the date that notice was received, a notice received before the return date it states
      counting as received on it. The absence start date and the due date are the ones the profile shows, and the due date passed
      during the absence when it falls on or after the absence start date and before the return date. The borrower's confirmation
      is the latest recorded check-in dated on or after the return date. The response days are the calendar days from the handling
      date to the open cycle's resulting due date, negative where that due date lies before the handling date. Where the due
      date passed during the absence, the resulting due date is the re-dating anchor plus the return allowance, the return allowance
      being the sum of the allowances this policy sets out; otherwise it is the due date the profile shows. Under the standard
      rule the re-dating anchor is the return date, and the documented-return allowance, the long-stay allowance, the payment
      allowance and the contact allowance are each zero days. The re-dating anchor is the date of the borrower's confirmation
      where that confirmation came more than confirm_gap_days calendar days after the return notice was received (the cycle
      then runs from the borrower's own word); otherwise, the date the return notice was received where it was received more
      than prompt_return_days calendar days after the return date it states; and otherwise the return date, including where
      the notice was received on or before the return date it states. The documented-return allowance is documented_mail days
      where the return notice carries a document reference and came by mail, documented_one days where exactly one of those
      two holds, and zero days where neither holds. The long-stay allowance is long_stay days where the absence start date lies
      long_absence_months or more whole calendar months before the return date, medium_stay days where it lies medium_absence_months
      or more but fewer than long_absence_months whole calendar months before it, and zero days otherwise. The payment allowance
      is paid_three days where the monitored HECM loan disbursed three or more scheduled monthly payments dated on or before
      the handling date and less than three whole calendar months before it, paid_some days where it disbursed one or two such
      payments, and zero days where it disbursed none. The contact allowance is contacts_many days where three or more check-ins
      are recorded on the profile, contacts_two days where exactly two are, and zero days where only one is (the borrower's
      own confirmation) or none is. Whole calendar months are counted as anniversaries of the day number, a month being complete
      only on the same day number of a later month. Where two records share the date a reading is ordered by, the one entered
      first is read.
    prerequisite:
    - problem: residency_ext_return_contact_number
      kind: value_input
      gate: confirm_day
      form: state
      policy_source: The return is not recorded until the borrower's own confirmation that the borrower is back home stands
        on the profile as a check-in.
      condition: residency_events carries a residency_absence_checkin entry for the profile dated on or after the return date
        on the accepted return-home notice (the borrower's own closing contact).
      resolved_by: confirm_return_home_701e433e
      effect: Once the borrower's confirmation is recorded, the re-dating anchor can run from its date and the contact allowance
        counts it; without it the anchor falls to the notice receipt or the return date and the contact allowance to zero.
    cross_category:
    - category: hecm
      as: history
      reads:
      - hecm_transactions.event_type
      - hecm_transactions.effective_date
      note: The payment-allowance factor counts the monitored HECM loan's scheduled monthly payments in the last three months.
    compute:
    - due_on_file: F('certification_due_date')
    - stay_start: F('absence_start_date') or due_on_file
    - return_day: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - return_received: MX(return_day, LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST)) if return_day != '' else ''
    - due_passed: return_day != '' and due_on_file >= stay_start and due_on_file < return_day
    - confirm_day: LATEST('residency_events', 'effective_date', date_field='effective_date', event_type='residency_absence_checkin')
        or ''
    - redate_anchor: confirm_day if (confirm_day != '' and return_day != '' and confirm_day >= return_day and DAYS(return_received,
        confirm_day) > K('confirm_gap_days')) else (return_received if (return_day != '' and DAYS(return_day, return_received)
        > K('prompt_return_days')) else (return_day if return_day != '' else NOW))
    - return_doc_ref: LATEST('residency_submissions', 'document_reference', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - return_channel: LATEST('residency_submissions', 'submission_channel', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - documented_allowance: K('documented_mail') if (return_doc_ref != '' and return_channel == 'mail') else (K('documented_one')
        if (return_doc_ref != '' or return_channel == 'mail') else 0)
    - absence_months_at_return: MONTHS(stay_start, return_day) if return_day != '' else 0
    - long_stay_allowance: K('long_stay') if absence_months_at_return >= K('long_absence_months') else (K('medium_stay') if
        absence_months_at_return >= K('medium_absence_months') else 0)
    - paid_months_recent: XCOUNT('hecm', 'hecm_transactions', event_type='hecm_scheduled_payment', hecm_loan_id=F('hecm_loan_id'),
        within_months=3, date_field='effective_date')
    - payment_allowance: K('paid_three') if paid_months_recent >= 3 else (K('paid_some') if paid_months_recent >= 1 else 0)
    - recorded_checkins: COUNT('residency_events', event_type='residency_absence_checkin')
    - contact_allowance: K('contacts_many') if recorded_checkins >= 3 else (K('contacts_two') if recorded_checkins == 2 else
        0)
    - result: int((DAYS(NOW, redate_anchor) + documented_allowance + long_stay_allowance + payment_allowance + contact_allowance)
        if due_passed else DAYS(NOW, due_on_file))
    compute_basis:
      due_on_file: The absence start date and the due date are the ones the profile shows,
      stay_start: The absence start date and the due date are the ones the profile shows,
      return_day: The return date is the date stated on the accepted return-home notice about the primary borrower received
        most recently, with the date that notice was received, a notice received before the return date it states counting as
        received on it.
      return_received: The return date is the date stated on the accepted return-home notice about the primary borrower received
        most recently, with the date that notice was received, a notice received before the return date it states counting as
        received on it.
      due_passed: the due date passed during the absence when it falls on or after the absence start date and before the return
        date.
      confirm_day: The borrower's confirmation is the latest recorded check-in dated on or after the return date.
      redate_anchor: The re-dating anchor is the date of the borrower's confirmation where that confirmation came more than
        confirm_gap_days calendar days after the return notice was received (the cycle then runs from the borrower's own word);
        otherwise, the date the return notice was received where it was received more than prompt_return_days calendar days
        after the return date it states; and otherwise the return date, including where the notice was received on or before
        the return date it states.
      return_doc_ref: where the return notice carries a document reference and came by mail
      return_channel: where the return notice carries a document reference and came by mail
      documented_allowance: The documented-return allowance is documented_mail days where the return notice carries a document
        reference and came by mail, documented_one days where exactly one of those two holds, and zero days where neither holds.
      absence_months_at_return: the absence start date lies long_absence_months or more whole calendar months before the return
        date
      long_stay_allowance: The long-stay allowance is long_stay days where the absence start date lies long_absence_months or
        more whole calendar months before the return date, medium_stay days where it lies medium_absence_months or more but
        fewer than long_absence_months whole calendar months before it, and zero days otherwise.
      paid_months_recent: the monitored HECM loan disbursed three or more scheduled monthly payments dated on or before the
        handling date and less than three whole calendar months before it
      payment_allowance: The payment allowance is paid_three days where the monitored HECM loan disbursed three or more scheduled
        monthly payments dated on or before the handling date and less than three whole calendar months before it, paid_some
        days where it disbursed one or two such payments, and zero days where it disbursed none.
      recorded_checkins: three or more check-ins are recorded on the profile
      contact_allowance: The contact allowance is contacts_many days where three or more check-ins are recorded on the profile,
        contacts_two days where exactly two are, and zero days where only one is (the borrower's own confirmation) or none is.
      result: The response days are the calendar days from the handling date to the open cycle's resulting due date, negative
        where that due date lies before the handling date. Where the due date passed during the absence, the resulting due date
        is the re-dating anchor plus the return allowance, the return allowance being the sum of the allowances this policy
        sets out; otherwise it is the due date the profile shows.
    factors:
    - id: redate_anchor_on_return
      effect: method
      decides: redate_anchor
      bindings:
      - confirm_day
      - redate_anchor
      ladder:
      - when: the borrower's confirmation came more than confirm_gap_days calendar days after the return notice was received
        method: the re-dating anchor is the date of that confirmation
      - when: otherwise, the return notice was received more than prompt_return_days calendar days after the return date it
          states
        method: the re-dating anchor is the date the notice was received
      - when: otherwise, including a notice received on or before the return date it states
        method: the re-dating anchor is the return date
      baseline:
        redate_anchor: (return_day if return_day != '' else NOW)
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: documented_return_days
      effect: parameter
      decides: documented_allowance
      bindings:
      - return_doc_ref
      - return_channel
      - documented_allowance
      ladder:
      - when: the return notice carries a document reference and came by mail
        value: K('documented_mail')
      - when: exactly one of those two holds
        value: K('documented_one')
      - when: otherwise
        value: '0'
      baseline:
        documented_allowance: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: long_stay_days
      effect: parameter
      decides: long_stay_allowance
      bindings:
      - absence_months_at_return
      - long_stay_allowance
      ladder:
      - when: the absence start date lies long_absence_months or more whole calendar months before the return date
        value: K('long_stay')
      - when: it lies medium_absence_months or more but fewer than long_absence_months
        value: K('medium_stay')
      - when: otherwise
        value: '0'
      baseline:
        long_stay_allowance: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: payment_allowance_days
      effect: parameter
      decides: payment_allowance
      bindings:
      - paid_months_recent
      - payment_allowance
      ladder:
      - when: the monitored HECM loan disbursed three or more scheduled monthly payments in the last three whole calendar months
        value: K('paid_three')
      - when: it disbursed one or two such payments
        value: K('paid_some')
      - when: otherwise
        value: '0'
      baseline:
        payment_allowance: '0'
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: hecm
    - id: contact_allowance_days
      effect: parameter
      decides: contact_allowance
      bindings:
      - recorded_checkins
      - contact_allowance
      ladder:
      - when: three or more check-ins are recorded on the profile
        value: K('contacts_many')
      - when: exactly two are
        value: K('contacts_two')
      - when: otherwise (only the borrower's own confirmation, or no check-in)
        value: '0'
      baseline:
        contact_allowance: '0'
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: Under the standard rule the re-dating anchor is the return date, and the documented-return allowance, the long-stay
        allowance, the payment allowance and the contact allowance are each zero days.
      params: []
    inputs:
      history:
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: return_home_notice
          review_status: accepted
      - table: residency_events
        aggregate: latest
        field: effective_date
        filters:
          event_type: residency_absence_checkin
      - table: residency_events
        aggregate: count
        field: residency_event_id
        filters:
          event_type: residency_absence_checkin
      - category: hecm
        table: hecm_transactions
        aggregate: count
        field: hecm_txn_id
        within_months: 3
        filters:
          event_type: hecm_scheduled_payment
      cross_category:
      - hecm
  - id: residency_ext_mailed_form_standing
    base_policy_refs:
    - residency_evt_certification
    overwrite:
    - base_policy: residency_evt_certification
      superseded_clause: Each signer is recorded once per cycle, with the signature date as effective_date and the cycle's certification_year.
      replaced_by: Each signer is recorded once per cycle under the cycle's certification_year, the calendar year of the due
        date the profile shows; a mailed certification form is recorded with its standing date under this policy as its effective_date,
        and every other certification with its signature date as effective_date.
    trigger: state_due
    subject:
    - residency_certification_recorded
    computes: effective_date
    target_tool: record_occupancy_certification_e8b1dc9f
    params:
      pre_return_days_confirmed: 14
      pre_return_days_unconfirmed: 7
      receipt_lag_return_first: 21
      receipt_lag_form_first: 10
      recent_certification_months: 18
      window_days_recent: 60
      window_days_older: 30
    rule: This policy fixes the date a borrower's accepted mailed certification form stands on when it is recorded; the acceptance
      of the form and the signer's role and channel remain as the base rule on certifications provides. Each signer is recorded
      once per cycle under the cycle's certification_year, the calendar year of the due date the profile shows; a mailed certification
      form is recorded with its standing date under this policy as its effective_date, and every other certification with its
      signature date as effective_date. A mailed certification's standing date is fixed only after the profile shows no health-care
      absence under monitoring. The mailed form is the accepted occupancy certification form on file for the profile that came
      by mail and was received most recently, with the signature date it states and the date it was received, a form received
      before the signature date it states counting as received on it; where none is on file, the handling date stands in for
      both. The return date is the date stated on the accepted return-home notice about the primary borrower received most recently,
      with the date that notice was received. The standing date is the form's anchor date where every standing limit is met,
      and the signature date the form states otherwise. Every standing limit is met when the calendar days from the form's signature
      date to the anchor date are no more than the pre-return window, the calendar days from the form's signature date to its
      receipt are no more than the receipt lag limit, and the due date the profile shows falls on or after the anchor date by
      no more than the crediting window. Under the standard rule the anchor date is the signature date the form states and the
      pre-return window, the receipt lag limit and the crediting window are each zero days, so the form stands on its signature
      date. The anchor date is the return date where a return notice is on file and the form's signature date is earlier than
      the return date, because the form attests occupancy only from the day the signer was back home; it is the date the form
      was received where no return notice is on file and the signature date is earlier than the receipt; and it is the signature
      date the form states in every other case. The pre-return window is pre_return_days_confirmed days where a check-in dated
      after the form's signature date is recorded on the profile, pre_return_days_unconfirmed days where check-ins are recorded
      but none is dated after it, and zero days where no check-in is recorded. The receipt lag limit is receipt_lag_return_first
      days where the return notice was received before the form, receipt_lag_form_first days where it was received on or after
      the form's receipt, and zero days where no return notice is on file. The crediting window is window_days_recent days where
      a certification is recorded on the profile with a date less than recent_certification_months whole calendar months before
      the handling date, window_days_older days where certifications are recorded but none that recent, and zero days where
      none is recorded. Whole calendar months are counted as anniversaries of the day number, a month being complete only on
      the same day number of a later month. Where two records share the date a reading is ordered by, the one entered first
      is read.
    prerequisite:
    - problem: residency_ext_return_redating
      kind: value_input
      gate: due_on_file
      form: state
      policy_source: A mailed certification's standing date is fixed only after the profile shows no health-care absence under
        monitoring.
      condition: residency_profiles.status is not absence_monitoring and residency_profiles.absence_start_date is empty, the
        return having been recorded with the due date it fixes.
      resolved_by: record_return_home_baa2f4ef
      effect: Once the return is recorded the profile shows no absence under monitoring and the due date fixed on the return,
        so the crediting window is measured to that due date and a form signed before the return can stand on the return date;
        before it the due date the profile shows (the passed one) precedes the anchor date and the form stands on the signature
        date it states.
    cross_category: []
    compute:
    - due_on_file: F('certification_due_date')
    - form_signed: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='occupancy_certification',
        review_status='accepted', submission_channel='mail') or NOW
    - form_received: MX(form_signed, LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='occupancy_certification',
        review_status='accepted', submission_channel='mail') or NOW)
    - return_day: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - return_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - anchor_day: return_day if (return_day != '' and form_signed < return_day) else (form_received if (return_day == '' and
        form_signed < form_received) else form_signed)
    - latest_checkin_day: LATEST('residency_events', 'effective_date', date_field='effective_date', event_type='residency_absence_checkin')
        or ''
    - pre_return_window: K('pre_return_days_confirmed') if (latest_checkin_day != '' and latest_checkin_day > form_signed) else
        (K('pre_return_days_unconfirmed') if latest_checkin_day != '' else 0)
    - receipt_lag_limit: K('receipt_lag_return_first') if (return_received != '' and return_received < form_received) else (K('receipt_lag_form_first')
        if return_received != '' else 0)
    - recent_certifications: COUNT('residency_events', within_months=K('recent_certification_months'), date_field='effective_date',
        event_type='residency_certification_recorded')
    - any_certifications: COUNT('residency_events', event_type='residency_certification_recorded')
    - crediting_window: K('window_days_recent') if recent_certifications >= 1 else (K('window_days_older') if any_certifications
        >= 1 else 0)
    - result: anchor_day if (DAYS(form_signed, anchor_day) <= pre_return_window and DAYS(form_signed, form_received) <= receipt_lag_limit
        and due_on_file >= anchor_day and DAYS(anchor_day, due_on_file) <= crediting_window) else form_signed
    compute_basis:
      due_on_file: the calendar year of the due date the profile shows;
      form_signed: The mailed form is the accepted occupancy certification form on file for the profile that came by mail and
        was received most recently, with the signature date it states and the date it was received, a form received before the
        signature date it states counting as received on it; where none is on file, the handling date stands in for both.
      form_received: The mailed form is the accepted occupancy certification form on file for the profile that came by mail
        and was received most recently, with the signature date it states and the date it was received, a form received before
        the signature date it states counting as received on it; where none is on file, the handling date stands in for both.
      return_day: The return date is the date stated on the accepted return-home notice about the primary borrower received
        most recently, with the date that notice was received.
      return_received: The return date is the date stated on the accepted return-home notice about the primary borrower received
        most recently, with the date that notice was received.
      anchor_day: The anchor date is the return date where a return notice is on file and the form's signature date is earlier
        than the return date, because the form attests occupancy only from the day the signer was back home; it is the date
        the form was received where no return notice is on file and the signature date is earlier than the receipt; and it is
        the signature date the form states in every other case.
      latest_checkin_day: where a check-in dated after the form's signature date is recorded on the profile
      pre_return_window: The pre-return window is pre_return_days_confirmed days where a check-in dated after the form's signature
        date is recorded on the profile, pre_return_days_unconfirmed days where check-ins are recorded but none is dated after
        it, and zero days where no check-in is recorded.
      receipt_lag_limit: The receipt lag limit is receipt_lag_return_first days where the return notice was received before
        the form, receipt_lag_form_first days where it was received on or after the form's receipt, and zero days where no return
        notice is on file.
      recent_certifications: a certification is recorded on the profile with a date less than recent_certification_months whole
        calendar months before the handling date
      any_certifications: where certifications are recorded but none that recent
      crediting_window: The crediting window is window_days_recent days where a certification is recorded on the profile with
        a date less than recent_certification_months whole calendar months before the handling date, window_days_older days
        where certifications are recorded but none that recent, and zero days where none is recorded.
      result: The standing date is the form's anchor date where every standing limit is met, and the signature date the form
        states otherwise. Every standing limit is met when the calendar days from the form's signature date to the anchor date
        are no more than the pre-return window, the calendar days from the form's signature date to its receipt are no more
        than the receipt lag limit, and the due date the profile shows falls on or after the anchor date by no more than the
        crediting window.
    factors:
    - id: standing_rule
      effect: method
      decides: anchor_day
      bindings:
      - return_day
      - anchor_day
      ladder:
      - when: a return notice is on file and the signature date is earlier than the return date
        method: the anchor date is the return date
      - when: no return notice is on file and the signature date is earlier than the receipt
        method: the anchor date is the date the form was received
      - when: otherwise
        method: the anchor date is the signature date the form states
      baseline:
        anchor_day: form_signed
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: pre_return_days
      effect: parameter
      decides: pre_return_window
      bindings:
      - latest_checkin_day
      - pre_return_window
      ladder:
      - when: a check-in dated after the form's signature date is recorded on the profile
        value: K('pre_return_days_confirmed')
      - when: check-ins are recorded but none is dated after it
        value: K('pre_return_days_unconfirmed')
      - when: otherwise (no check-in recorded)
        value: '0'
      baseline:
        pre_return_window: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: receipt_lag_days
      effect: parameter
      decides: receipt_lag_limit
      bindings:
      - return_received
      - receipt_lag_limit
      ladder:
      - when: the return notice was received before the form
        value: K('receipt_lag_return_first')
      - when: it was received on or after the form's receipt
        value: K('receipt_lag_form_first')
      - when: otherwise (no return notice on file)
        value: '0'
      baseline:
        receipt_lag_limit: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: crediting_window_days
      effect: parameter
      decides: crediting_window
      bindings:
      - recent_certifications
      - any_certifications
      - crediting_window
      ladder:
      - when: a certification is recorded on the profile dated less than recent_certification_months whole calendar months before
          the handling date
        value: K('window_days_recent')
      - when: certifications are recorded but none that recent
        value: K('window_days_older')
      - when: otherwise
        value: '0'
      baseline:
        crediting_window: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: Under the standard rule the anchor date is the signature date the form states and the pre-return window, the receipt
        lag limit and the crediting window are each zero days, so the form stands on its signature date.
      params: []
    inputs:
      history:
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: occupancy_certification
          review_status: accepted
          submission_channel: mail
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: return_home_notice
          review_status: accepted
      - table: residency_events
        aggregate: latest
        field: effective_date
        filters:
          event_type: residency_absence_checkin
      - table: residency_events
        aggregate: count
        field: residency_event_id
        within_months: 18
        filters:
          event_type: residency_certification_recorded
      cross_category: []
  - id: residency_ext_cycle_completion_date
    base_policy_refs:
    - residency_evt_certification
    overwrite:
    - base_policy: residency_evt_certification
      superseded_clause: When a cycle completes, last_certified_date becomes the date of the last required signature and certification_due_date
        moves forward certification_frequency_months months to the next closing anniversary;
      replaced_by: When a cycle completes, last_certified_date becomes the cycle's completion date under this policy and certification_due_date
        moves forward certification_frequency_months months to the next closing anniversary.
    trigger: on_request
    subject:
    - residency_cycle_completed
    computes: last_certified_date
    target_tool: complete_certification_cycle_e152f965
    params:
      mail_receipt_days: 30
      return_link_closed: 30
      return_link_one_signal: 14
      confirm_link_two_contacts: 21
      confirm_link_one_contact: 10
      due_window_paying: 60
      due_window_not_paying: 45
    rule: This policy fixes the date a completed certification cycle is recorded as certified; when a cycle counts as complete
      (the plan's required signatures recorded under the cycle's certification year) and the return of a pending or overdue
      profile to current remain as the base rule on certifications provides. When a cycle completes, last_certified_date becomes
      the cycle's completion date under this policy and certification_due_date moves forward certification_frequency_months
      months to the next closing anniversary. A cycle's completion date is fixed only after every accepted certification form
      on file for the cycle stands on the profile as a recorded certification. The open cycle is the certification year equal
      to the calendar year of the due date the profile shows. The last signature is the certification recorded on the profile
      under the open cycle with the latest standing date, with its channel and the form it was recorded from; the form's receipt
      date is the date that form was received, a form received before the signature's standing date counting as received on
      it. The return notice is the accepted return-home notice about the primary borrower received most recently, with the return
      date it states. The latest contact is the latest check-in recorded on the profile. The completion date is the cycle's
      anchor date where every completion limit is met, and the last signature's standing date otherwise. Every completion limit
      is met when a return notice and a latest contact are on file, the calendar days from the return date to the anchor date
      are no more than the return link limit, the calendar days from the anchor date to the latest contact are no more than
      the confirmation link limit, and the anchor date precedes the due date the profile shows by no more than the due-date
      window. An anchor date before the return date, or a latest contact before the anchor date, counts as zero days after it.
      Under the standard rule the anchor date is the last signature's standing date and the return link limit, the confirmation
      link limit and the due-date window are each zero days, so the cycle is certified as of the last signature's standing date.
      The anchor date is the form's receipt date where the last signature came by mail and its form was received no more than
      mail_receipt_days calendar days after the signature's standing date, the day the servicer held the last required signature;
      it is the date the cycle is completed where the last signature came by mail and its form was received later than that;
      and it is the last signature's standing date in every other case. The return link limit is return_link_closed days where
      a return notice is on file and the profile shows no absence start date, return_link_one_signal days where exactly one
      of those two holds, and zero days where neither holds. The confirmation link limit is confirm_link_two_contacts days where
      two or more check-ins are recorded on the profile, confirm_link_one_contact days where exactly one is, and zero days where
      none is. The due-date window is due_window_paying days where the monitored HECM loan disbursed three or more scheduled
      monthly payments dated on or before the handling date and less than three whole calendar months before it, due_window_not_paying
      days where it disbursed one or two such payments, and zero days where it disbursed none or the profile monitors no HECM
      loan. Whole calendar months are counted as anniversaries of the day number, a month being complete only on the same day
      number of a later month. Where two records share the date a reading is ordered by, the one entered first is read.
    prerequisite:
    - problem: residency_ext_mailed_form_standing
      kind: value_input
      gate: last_sig_day
      form: state
      policy_source: A cycle's completion date is fixed only after every accepted certification form on file for the cycle stands
        on the profile as a recorded certification.
      condition: residency_events carries a residency_certification_recorded entry under the open cycle's certification year
        for each accepted occupancy certification form on file for the cycle (residency_submission_id).
      resolved_by: record_occupancy_certification_e8b1dc9f
      effect: Once the mailed form is recorded it is the cycle's last signature, with its standing date and its form's receipt
        date; without it the open cycle has no recorded signature and no completion date can be fixed.
    cross_category:
    - category: hecm
      as: history
      reads:
      - hecm_transactions.event_type
      - hecm_transactions.effective_date
      note: The due-date window counts the monitored HECM loan's scheduled monthly payments in the last three months.
    compute:
    - due_on_file: F('certification_due_date')
    - cycle_year: MONTHS('0000-01-01', due_on_file) // 12
    - last_sig_day: LATEST('residency_events', 'effective_date', date_field='effective_date', event_type='residency_certification_recorded',
        certification_year=cycle_year) or ''
    - last_sig_method: LATEST('residency_events', 'certification_method', date_field='effective_date', event_type='residency_certification_recorded',
        certification_year=cycle_year) or ''
    - last_sig_form: LATEST('residency_events', 'residency_submission_id', date_field='effective_date', event_type='residency_certification_recorded',
        certification_year=cycle_year) or ''
    - form_receipt: MX(last_sig_day, LATEST('residency_submissions', 'received_date', date_field='received_date', residency_submission_id=last_sig_form)
        or last_sig_day) if last_sig_form != '' else last_sig_day
    - anchor_day: form_receipt if (last_sig_method == 'mail' and last_sig_day != '' and DAYS(last_sig_day, form_receipt) <=
        K('mail_receipt_days')) else (NOW if (last_sig_method == 'mail' and last_sig_day != '') else last_sig_day)
    - return_day: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - absence_cleared: (F('absence_start_date') or '') == ''
    - return_link_limit: K('return_link_closed') if (return_day != '' and absence_cleared) else (K('return_link_one_signal')
        if (return_day != '' or absence_cleared) else 0)
    - latest_contact: LATEST('residency_events', 'effective_date', date_field='effective_date', event_type='residency_absence_checkin')
        or ''
    - recorded_checkins: COUNT('residency_events', event_type='residency_absence_checkin')
    - confirm_link_limit: K('confirm_link_two_contacts') if recorded_checkins >= 2 else (K('confirm_link_one_contact') if recorded_checkins
        == 1 else 0)
    - paid_months_recent: XCOUNT('hecm', 'hecm_transactions', event_type='hecm_scheduled_payment', hecm_loan_id=F('hecm_loan_id'),
        within_months=3, date_field='effective_date')
    - due_window: K('due_window_paying') if paid_months_recent >= 3 else (K('due_window_not_paying') if paid_months_recent >=
        1 else 0)
    - result: anchor_day if (last_sig_day != '' and return_day != '' and latest_contact != '' and MX(0, DAYS(return_day, anchor_day))
        <= return_link_limit and MX(0, DAYS(anchor_day, latest_contact)) <= confirm_link_limit and anchor_day <= due_on_file
        and DAYS(anchor_day, due_on_file) <= due_window) else last_sig_day
    compute_basis:
      due_on_file: The open cycle is the certification year equal to the calendar year of the due date the profile shows.
      cycle_year: The open cycle is the certification year equal to the calendar year of the due date the profile shows.
      last_sig_day: The last signature is the certification recorded on the profile under the open cycle with the latest standing
        date, with its channel and the form it was recorded from;
      last_sig_method: The last signature is the certification recorded on the profile under the open cycle with the latest
        standing date, with its channel and the form it was recorded from;
      last_sig_form: The last signature is the certification recorded on the profile under the open cycle with the latest standing
        date, with its channel and the form it was recorded from;
      form_receipt: the form's receipt date is the date that form was received, a form received before the signature's standing
        date counting as received on it.
      anchor_day: The anchor date is the form's receipt date where the last signature came by mail and its form was received
        no more than mail_receipt_days calendar days after the signature's standing date, the day the servicer held the last
        required signature; it is the date the cycle is completed where the last signature came by mail and its form was received
        later than that; and it is the last signature's standing date in every other case.
      return_day: The return notice is the accepted return-home notice about the primary borrower received most recently, with
        the return date it states.
      absence_cleared: the profile shows no absence start date
      return_link_limit: The return link limit is return_link_closed days where a return notice is on file and the profile shows
        no absence start date, return_link_one_signal days where exactly one of those two holds, and zero days where neither
        holds.
      latest_contact: The latest contact is the latest check-in recorded on the profile.
      recorded_checkins: where two or more check-ins are recorded on the profile
      confirm_link_limit: The confirmation link limit is confirm_link_two_contacts days where two or more check-ins are recorded
        on the profile, confirm_link_one_contact days where exactly one is, and zero days where none is.
      paid_months_recent: the monitored HECM loan disbursed three or more scheduled monthly payments dated on or before the
        handling date and less than three whole calendar months before it
      due_window: The due-date window is due_window_paying days where the monitored HECM loan disbursed three or more scheduled
        monthly payments dated on or before the handling date and less than three whole calendar months before it, due_window_not_paying
        days where it disbursed one or two such payments, and zero days where it disbursed none or the profile monitors no HECM
        loan.
      result: The completion date is the cycle's anchor date where every completion limit is met, and the last signature's standing
        date otherwise. Every completion limit is met when a return notice and a latest contact are on file, the calendar days
        from the return date to the anchor date are no more than the return link limit, the calendar days from the anchor date
        to the latest contact are no more than the confirmation link limit, and the anchor date precedes the due date the profile
        shows by no more than the due-date window. An anchor date before the return date, or a latest contact before the anchor
        date, counts as zero days after it.
    factors:
    - id: completion_anchor
      effect: method
      decides: anchor_day
      bindings:
      - last_sig_method
      - anchor_day
      ladder:
      - when: the last signature came by mail and its form was received no more than mail_receipt_days calendar days after the
          signature's standing date
        method: the anchor date is the form's receipt date
      - when: the last signature came by mail and its form was received later than that
        method: the anchor date is the date the cycle is completed
      - when: otherwise
        method: the anchor date is the last signature's standing date
      baseline:
        anchor_day: last_sig_day
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: return_link_days
      effect: parameter
      decides: return_link_limit
      bindings:
      - return_day
      - absence_cleared
      - return_link_limit
      ladder:
      - when: a return notice is on file and the profile shows no absence start date
        value: K('return_link_closed')
      - when: exactly one of those two holds
        value: K('return_link_one_signal')
      - when: otherwise
        value: '0'
      baseline:
        return_link_limit: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: confirm_link_days
      effect: parameter
      decides: confirm_link_limit
      bindings:
      - latest_contact
      - recorded_checkins
      - confirm_link_limit
      ladder:
      - when: two or more check-ins are recorded on the profile
        value: K('confirm_link_two_contacts')
      - when: exactly one is
        value: K('confirm_link_one_contact')
      - when: otherwise
        value: '0'
      baseline:
        confirm_link_limit: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: due_window_days
      effect: parameter
      decides: due_window
      bindings:
      - paid_months_recent
      - due_window
      ladder:
      - when: the monitored HECM loan disbursed three or more scheduled monthly payments in the last three whole calendar months
        value: K('due_window_paying')
      - when: it disbursed one or two such payments
        value: K('due_window_not_paying')
      - when: otherwise (none, or no HECM loan monitored)
        value: '0'
      baseline:
        due_window: '0'
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: hecm
    baseline:
      rule: Under the standard rule the anchor date is the last signature's standing date and the return link limit, the confirmation
        link limit and the due-date window are each zero days, so the cycle is certified as of the last signature's standing
        date.
      params: []
    inputs:
      history:
      - table: residency_events
        aggregate: latest
        field: effective_date
        filters:
          event_type: residency_certification_recorded
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: return_home_notice
          review_status: accepted
      - table: residency_events
        aggregate: count
        field: residency_event_id
        filters:
          event_type: residency_absence_checkin
      - category: hecm
        table: hecm_transactions
        aggregate: count
        field: hecm_txn_id
        within_months: 3
        filters:
          event_type: hecm_scheduled_payment
      cross_category:
      - hecm
  - id: residency_ext_return_contact_number
    base_policy_refs:
    - residency_health_absence
    overwrite:
    - base_policy: residency_health_absence
      superseded_clause: During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the
        absence_start_date, numbered by residency_msr_absence_checkins plus one, and annual notices are suspended.
      replaced_by: During monitoring a check-in is made every health_absence_checkin_days calendar days counted from the absence_start_date
        and annual notices are suspended; the closing contact in which the borrower confirms in person having come home is numbered
        under this policy, a contact confirmed by an accepted facility letter and a check-in the borrower confirms in person
        while still in care are numbered under their own rules, and every other check-in is numbered by residency_msr_absence_checkins
        plus one.
    trigger: on_request
    subject:
    - residency_absence_checkin
    computes: checkin_sequence
    target_tool: confirm_return_home_701e433e
    params:
      closing_cadence_paid: 30
      closing_cadence_some_paid: 60
      prompt_return_days: 7
      grace_prompt_notice: 14
      grace_late_notice: 10
      long_absence_months: 6
      medium_absence_months: 3
      settling_long: 21
      settling_medium: 10
      return_notice_months: 12
      notice_link_days: 45
    rule: 'This policy fixes the number of the closing contact of a health-care absence: the check-in in which the primary borrower,
      back at home while the profile is still under monitoring, confirms in person on the handling date that occupancy has resumed.
      The monitoring it closes and the recording of the return remain as the base rule on health-care absences provides. During
      monitoring a check-in is made every health_absence_checkin_days calendar days counted from the absence_start_date and
      annual notices are suspended; the closing contact in which the borrower confirms in person having come home is numbered
      under this policy, a contact confirmed by an accepted facility letter and a check-in the borrower confirms in person while
      still in care are numbered under their own rules, and every other check-in is numbered by residency_msr_absence_checkins
      plus one. The absence start date is the one the profile shows; where it shows none, the handling date stands in for it.
      The borrower''s absence notice is the accepted health-care absence notice about the primary borrower received most recently,
      with the date it was received; where none is on file, the absence start date stands in for that date. The highest recorded
      number is the highest check-in number on the profile, zero where none is recorded; the latest recorded check-in is the
      check-in on the profile with the latest date. The return notice is the accepted return-home notice about the primary borrower
      received most recently, with the return date it states and the date it was received, a notice received before the return
      date it states counting as received on it. The closing-contact number is the highest recorded number plus the scheduled
      contacts that fell due since the count-from date plus the return-notice numbers. The scheduled contacts are the calendar
      days from the count-from date to the handling date, less the closing grace and less the home-settling period, divided
      by the closing interval with any fraction dropped, and never fewer than one. Under the standard rule the count-from date
      is the absence start date, the closing interval is health_absence_checkin_days calendar days, the closing grace and the
      home-settling period are each zero days, and the return-notice numbers are zero. The count-from date is the date of the
      latest recorded check-in where a check-in is recorded on the profile; the date the borrower''s absence notice was received
      where no check-in is recorded and that notice was received more than notice_link_days calendar days after the absence
      start date (the schedule could be followed only from then); and the absence start date in every other case. The closing
      interval is closing_cadence_paid calendar days where the monitored HECM loan disbursed three or more scheduled monthly
      payments dated on or before the handling date and less than three whole calendar months before it, closing_cadence_some_paid
      calendar days where it disbursed one or two such payments, and health_absence_checkin_days calendar days where it disbursed
      none. The closing grace is grace_prompt_notice calendar days where the return notice was received no more than prompt_return_days
      calendar days after the return date it states (including a notice received before that date), grace_late_notice calendar
      days where it was received later, and zero days where no return notice is on file. The home-settling period is settling_long
      calendar days where the absence start date lies long_absence_months or more whole calendar months before the return date,
      settling_medium calendar days where it lies medium_absence_months or more but fewer than long_absence_months whole calendar
      months before it, and zero days otherwise or where no return notice is on file. The return-notice numbers hold one number
      for each accepted return-home notice about the primary borrower received less than return_notice_months whole calendar
      months before the handling date, the notice being a contact of its own, up to two: two where two or more such notices
      are on file, one where exactly one is, and zero where none is. Whole calendar months are counted as anniversaries of the
      day number, a month being complete only on the same day number of a later month. Where two records share the date a reading
      is ordered by, the one entered first is read.'
    prerequisite: []
    cross_category:
    - category: hecm
      as: history
      reads:
      - hecm_transactions.event_type
      - hecm_transactions.effective_date
      note: The closing-interval factor counts the monitored HECM loan's scheduled monthly payments in the last three months.
    compute:
    - stay_start: F('absence_start_date') or NOW
    - top_number: MAX('residency_events', 'checkin_sequence', event_type='residency_absence_checkin')
    - recorded_checkins: COUNT('residency_events', event_type='residency_absence_checkin')
    - latest_checkin_day: LATEST('residency_events', 'effective_date', date_field='effective_date', event_type='residency_absence_checkin')
        or stay_start
    - own_notice_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='health_absence_notice',
        review_status='accepted', subject_customer_id=CUST) or stay_start
    - count_from_day: latest_checkin_day if recorded_checkins >= 1 else (own_notice_received if DAYS(stay_start, own_notice_received)
        > K('notice_link_days') else stay_start)
    - paid_months_recent: XCOUNT('hecm', 'hecm_transactions', event_type='hecm_scheduled_payment', hecm_loan_id=F('hecm_loan_id'),
        within_months=3, date_field='effective_date')
    - closing_interval: K('closing_cadence_paid') if paid_months_recent >= 3 else (K('closing_cadence_some_paid') if paid_months_recent
        >= 1 else P('health_absence_checkin_days'))
    - return_day: LATEST('residency_submissions', 'event_date', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - return_received: LATEST('residency_submissions', 'received_date', date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST) or ''
    - return_lag: MX(0, DAYS(return_day, return_received)) if return_day != '' else 0
    - closing_grace: (K('grace_prompt_notice') if return_lag <= K('prompt_return_days') else K('grace_late_notice')) if return_day
        != '' else 0
    - absence_months_at_return: MONTHS(stay_start, return_day) if return_day != '' else 0
    - settling_days: K('settling_long') if absence_months_at_return >= K('long_absence_months') else (K('settling_medium') if
        absence_months_at_return >= K('medium_absence_months') else 0)
    - return_notices: COUNT('residency_submissions', within_months=K('return_notice_months'), date_field='received_date', submission_type='return_home_notice',
        review_status='accepted', subject_customer_id=CUST)
    - return_notice_numbers: 2 if return_notices >= 2 else (1 if return_notices == 1 else 0)
    - result: int(top_number + MX(1, (DAYS(count_from_day, NOW) - closing_grace - settling_days) // closing_interval) + return_notice_numbers)
    compute_basis:
      stay_start: The absence start date is the one the profile shows; where it shows none, the handling date stands in for
        it. The borrower's absence notice is the accepted health-care absence notice about the primary borrower received most
        recently, with the date it was received; where none is on file, the absence start date stands in for that date.
      top_number: highest recorded number is the highest check-in number on the profile, zero where none is recorded;
      recorded_checkins: where a check-in is recorded on the profile
      latest_checkin_day: the latest recorded check-in is the check-in on the profile with the latest date.
      count_from_day: The count-from date is the date of the latest recorded check-in where a check-in is recorded on the profile;
        the date the borrower's absence notice was received where no check-in is recorded and that notice was received more
        than notice_link_days calendar days after the absence start date (the schedule could be followed only from then); and
        the absence start date in every other case.
      paid_months_recent: the monitored HECM loan disbursed three or more scheduled monthly payments dated on or before the
        handling date and less than three whole calendar months before it
      closing_interval: The closing interval is closing_cadence_paid calendar days where the monitored HECM loan disbursed three
        or more scheduled monthly payments dated on or before the handling date and less than three whole calendar months before
        it, closing_cadence_some_paid calendar days where it disbursed one or two such payments, and health_absence_checkin_days
        calendar days where it disbursed none.
      return_day: The return notice is the accepted return-home notice about the primary borrower received most recently, with
        the return date it states and the date it was received, a notice received before the return date it states counting
        as received on it.
      return_received: The return notice is the accepted return-home notice about the primary borrower received most recently,
        with the return date it states and the date it was received, a notice received before the return date it states counting
        as received on it.
      return_lag: a notice received before the return date it states counting as received on it.
      closing_grace: The closing grace is grace_prompt_notice calendar days where the return notice was received no more than
        prompt_return_days calendar days after the return date it states (including a notice received before that date), grace_late_notice
        calendar days where it was received later, and zero days where no return notice is on file.
      absence_months_at_return: the absence start date lies long_absence_months or more whole calendar months before the return
        date
      settling_days: The home-settling period is settling_long calendar days where the absence start date lies long_absence_months
        or more whole calendar months before the return date, settling_medium calendar days where it lies medium_absence_months
        or more but fewer than long_absence_months whole calendar months before it, and zero days otherwise or where no return
        notice is on file.
      return_notices: one number for each accepted return-home notice about the primary borrower received less than return_notice_months
        whole calendar months before the handling date
      return_notice_numbers: 'The return-notice numbers hold one number for each accepted return-home notice about the primary
        borrower received less than return_notice_months whole calendar months before the handling date, the notice being a
        contact of its own, up to two: two where two or more such notices are on file, one where exactly one is, and zero where
        none is.'
      result: The closing-contact number is the highest recorded number plus the scheduled contacts that fell due since the
        count-from date plus the return-notice numbers.
      own_notice_received: The borrower's absence notice is the accepted health-care absence notice about the primary borrower
        received most recently, with the date it was received; where none is on file, the absence start date stands in for that
        date.
    factors:
    - id: count_from_anchor
      effect: method
      decides: count_from_day
      bindings:
      - latest_checkin_day
      - own_notice_received
      - count_from_day
      ladder:
      - when: a check-in is recorded on the profile
        method: the count-from date is the date of the latest recorded check-in
      - when: no check-in is recorded and the borrower's absence notice was received more than notice_link_days calendar days
          after the absence start date
        method: the count-from date is the date that notice was received
      - when: otherwise
        method: the count-from date is the absence start date
      baseline:
        count_from_day: stay_start
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: closing_interval_days
      effect: parameter
      decides: closing_interval
      bindings:
      - paid_months_recent
      - closing_interval
      ladder:
      - when: the monitored HECM loan disbursed three or more scheduled monthly payments in the last three whole calendar months
        value: K('closing_cadence_paid')
      - when: it disbursed one or two such payments
        value: K('closing_cadence_some_paid')
      - when: otherwise
        value: P('health_absence_checkin_days')
      baseline:
        closing_interval: P('health_absence_checkin_days')
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: hecm
    - id: closing_grace_days
      effect: parameter
      decides: closing_grace
      bindings:
      - return_lag
      - closing_grace
      ladder:
      - when: the return notice was received no more than prompt_return_days calendar days after the return date it states,
          including a notice received before that date
        value: K('grace_prompt_notice')
      - when: it was received later
        value: K('grace_late_notice')
      - when: otherwise (no return notice on file)
        value: '0'
      baseline:
        closing_grace: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: home_settling_days
      effect: parameter
      decides: settling_days
      bindings:
      - absence_months_at_return
      - settling_days
      ladder:
      - when: the absence start date lies long_absence_months or more whole calendar months before the return date
        value: K('settling_long')
      - when: it lies medium_absence_months or more but fewer than long_absence_months whole calendar months before it
        value: K('settling_medium')
      - when: otherwise or no return notice on file
        value: '0'
      baseline:
        settling_days: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: return_notice_count
      effect: parameter
      decides: return_notice_numbers
      bindings:
      - return_notices
      - return_notice_numbers
      ladder:
      - when: two or more accepted return-home notices about the primary borrower were received less than return_notice_months
          whole calendar months before the handling date
        value: '2'
      - when: exactly one is
        value: '1'
      - when: otherwise
        value: '0'
      baseline:
        return_notice_numbers: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: Under the standard rule the count-from date is the absence start date, the closing interval is health_absence_checkin_days
        calendar days, the closing grace and the home-settling period are each zero days, and the return-notice numbers are
        zero.
      params: []
    inputs:
      history:
      - table: residency_events
        aggregate: max
        field: checkin_sequence
        filters:
          event_type: residency_absence_checkin
      - table: residency_events
        aggregate: latest
        field: effective_date
        filters:
          event_type: residency_absence_checkin
      - table: residency_submissions
        aggregate: latest
        field: event_date
        filters:
          submission_type: return_home_notice
          review_status: accepted
      - table: residency_submissions
        aggregate: count
        field: residency_submission_id
        filters:
          submission_type: return_home_notice
          review_status: accepted
        within_months: 12
      - category: hecm
        table: hecm_transactions
        aggregate: count
        field: hecm_txn_id
        within_months: 3
        filters:
          event_type: hecm_scheduled_payment
      cross_category:
      - hecm
