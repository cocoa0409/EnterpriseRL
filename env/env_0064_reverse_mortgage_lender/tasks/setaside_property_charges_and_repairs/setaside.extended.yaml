- id: setaside_ext_reserve_flood_projection
  base_policy_refs:
  - setaside_charge_review
  overwrite:
  - base_policy: setaside_charge_review
    superseded_clause: the annual flood premium is the billed_amount of the current flood policy term
    replaced_by: For a Summit Tax and Insurance Reserve, and only for such a reserve, the annual flood premium held on file is the projected annual flood premium worked out below rather than the billed amount of the current flood policy term; the annual flood premium of every other set-aside remains under the base rule.
  trigger: state_due
  subject:
  - setaside_charges_updated
  computes: annual_flood_premium
  target_tool: update_reserve_flood_ec384f8d
  params:
    review_window_months: 12
    change_threshold_pct: 10.0
    change_high_pct: 8.0
    change_low_pct: 4.0
    appraisal_currency_months: 6
    appraisal_threshold_pct: 10.0
    appraisal_high_pct: 6.0
    appraisal_low_pct: 3.0
    estate_residence_loading_pct: 20.0
    moved_out_loading_pct: 10.0
    standard_renewal_increase_pct: 4.0
    default_renewal_share: 0.5
  rule: 'This rule sets the annual flood premium held on a Summit Tax and Insurance Reserve, called here the projected annual flood premium, whenever the flood insurance bills on file are reviewed. For a Summit Tax and Insurance Reserve, and only for such a reserve, the annual flood premium held on file is the projected annual flood premium worked out below rather than the billed amount of the current flood policy term; the annual flood premium of every other set-aside remains under the base rule. The flood bills of the review are the flood insurance bills on file for the reserve received within the twelve months before the review. The current flood premium is the billed amount of the paid flood insurance bill with the latest due date. The renewal flood premium is the current flood premium increased once by the flood renewal loading, which is the standard renewal increase plus the flood premium-change loading, the flood residence loading and the flood appraisal loading, all in percent, added together and applied once to the current flood premium, not one after another; the flood premium-change loading, the flood residence loading and the flood appraisal loading are each zero. The flood renewal share is one half. The projected annual flood premium is the current flood premium times one less the flood renewal share, plus the renewal flood premium times the flood renewal share. The projected annual flood premium is rounded half up to the cent once, at the end, and the review takes it from the flood insurance bill on file with the latest due date. Where two or more of the flood bills of the review are paid or received, the pay-plan basis applies: the current flood premium is the sum of the billed amounts of those paid and received bills, because a policy billed in installments costs the sum of its installments. Where none of the flood bills of the review is paid or received, the carry-forward basis applies: the current flood premium is the annual flood premium already on file. Otherwise the current flood premium is the billed amount of the paid flood insurance bill with the latest due date. Where at least one of the flood bills of the review is withdrawn and the paid and received flood bills of the review sum to more than the withdrawn flood bills of the review increased by the premium-change threshold percentage, the flood premium-change loading is the high premium-change loading. Where at least one is withdrawn and the paid and received flood bills sum to more than the withdrawn flood bills but not more than that threshold, the flood premium-change loading is the low premium-change loading. Otherwise the flood premium-change loading is zero. Where the occupancy profile of the reserve''s Summit loan is closed and the loan''s maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood residence loading is the estate residence loading, because a home nobody lives in is rated as a non-primary residence at the next renewal. Where the occupancy profile shows non-occupancy confirmed, the flood residence loading is the moved-out residence loading, because a confirmed move can still be cured by reoccupancy. Otherwise the flood residence loading is zero. Where the loan''s maturity case that is due and payable or in its extension period carries an appraisal dated fewer whole months before the review than the appraisal-currency months, and its appraised value exceeds the Summit loan''s appraised value at closing by more than the appraisal threshold percentage, the flood appraisal loading is the high appraisal loading, because coverage must keep pace with the home''s value. Where it carries such an appraisal whose value exceeds the closing value by no more than that threshold, the flood appraisal loading is the low appraisal loading. Otherwise the flood appraisal loading is zero. Where at least one of the flood bills of the review is withdrawn, the replacement month basis applies: the flood renewal share is the whole months from the due date of the latest paid flood insurance bill to the review date, divided by twelve, never below zero and never above one, because a replacement policy renews on the anniversary of its own start. Where none is withdrawn and two or more of the flood bills of the review are paid or received, the installment count basis applies: the flood renewal share is the number of paid flood bills of the review divided by the number of paid and received flood bills of the review. Otherwise the flood renewal share is one half.'
  prerequisite: []
  cross_category:
  - category: residency
    as: branch
    reads:
    - status
    note: The flood occupancy-related loading is decided from the status of the occupancy profile of the reserve's Summit loan.
  - category: maturity
    as: branch
    reads:
    - variant_name
    - status
    - appraised_value
    - appraisal_date
    note: The death case status and the current case appraisal decide the flood occupancy-related and appraisal loadings.
  - category: jumbo
    as: branch
    reads:
    - appraised_value_at_closing
    note: The closing appraisal is the base the case appraisal is compared with.
  compute:
  - pr_amt: SUM('setaside_requests', 'billed_amount', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='paid') + SUM('setaside_requests', 'billed_amount', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='received')
  - latest_paid_amt: LATEST('setaside_requests', 'billed_amount', date_field='due_date', request_type='flood_insurance_bill', request_status='paid')
  - plan_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='paid') + COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='received')
  - cur_prem: pr_amt if plan_n >= 2 else (F('annual_flood_premium') if plan_n == 0 else latest_paid_amt)
  - chg_wd_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='withdrawn')
  - chg_wd_amt: SUM('setaside_requests', 'billed_amount', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='withdrawn')
  - chg_pct: K('change_high_pct') if (chg_wd_n >= 1 and pr_amt > chg_wd_amt * (1 + K('change_threshold_pct') / 100)) else (K('change_low_pct') if (chg_wd_n >= 1 and pr_amt > chg_wd_amt) else 0)
  - occ_status: CFIELD('residency', 'status', jumbo_loan_id=F('jumbo_loan_id'))
  - occ_case_dp: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - occ_case_ext: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - occ_pct: K('estate_residence_loading_pct') if (occ_status == 'closed' and (occ_case_dp or occ_case_ext) == 'Death of Last Surviving Borrower') else (K('moved_out_loading_pct') if occ_status == 'nonoccupancy_confirmed' else 0)
  - ap_val: CFIELD('maturity', 'appraised_value', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable') or CFIELD('maturity', 'appraised_value', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - ap_date: CFIELD('maturity', 'appraisal_date', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable') or CFIELD('maturity', 'appraisal_date', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - ap_close: CFIELD('jumbo', 'appraised_value_at_closing', jumbo_loan_id=F('jumbo_loan_id'))
  - appr_pct: K('appraisal_high_pct') if (ap_val and ap_date and ap_close and MONTHS(ap_date, NOW) < K('appraisal_currency_months') and ap_val > ap_close * (1 + K('appraisal_threshold_pct') / 100)) else (K('appraisal_low_pct') if (ap_val and ap_date and ap_close and MONTHS(ap_date, NOW) < K('appraisal_currency_months') and ap_val > ap_close) else 0)
  - sp_wd_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='withdrawn')
  - sp_paid_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='paid')
  - sp_pr_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='paid') + COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='flood_insurance_bill', request_status='received')
  - sp_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='flood_insurance_bill', request_status='paid')
  - share: MN(1, MX(0, MONTHS(sp_due, NOW) / 12)) if (sp_wd_n >= 1 and sp_due) else (sp_paid_n / sp_pr_n if sp_pr_n >= 2 else K('default_renewal_share'))
  - renewal_prem: cur_prem * (1 + (K('standard_renewal_increase_pct') + chg_pct + occ_pct + appr_pct) / 100)
  - result: RND(cur_prem * (1 - share) + renewal_prem * share, 2)
  compute_basis:
    pr_amt: The flood bills of the review are the flood insurance bills on file for the reserve received within the twelve months before the review.
    latest_paid_amt: The current flood premium is the billed amount of the paid flood insurance bill with the latest due date.
    plan_n: 'Where two or more of the flood bills of the review are paid or received, the pay-plan basis applies: the current flood premium is the sum of the billed amounts of those paid and received bills, because a policy billed in installments costs the sum of its installments. Where none of the flood bills of the review is paid or received, the carry-forward basis applies: the current flood premium is the annual flood premium already on file. Otherwise the current flood premium is the billed amount of the paid flood insurance bill with the latest due date.'
    cur_prem: 'Where two or more of the flood bills of the review are paid or received, the pay-plan basis applies: the current flood premium is the sum of the billed amounts of those paid and received bills, because a policy billed in installments costs the sum of its installments. Where none of the flood bills of the review is paid or received, the carry-forward basis applies: the current flood premium is the annual flood premium already on file. Otherwise the current flood premium is the billed amount of the paid flood insurance bill with the latest due date.'
    chg_wd_n: Where at least one of the flood bills of the review is withdrawn and the paid and received flood bills of the review sum to more than the withdrawn flood bills of the review increased by the premium-change threshold percentage, the flood premium-change loading is the high premium-change loading. Where at least one is withdrawn and the paid and received flood bills sum to more than the withdrawn flood bills but not more than that threshold, the flood premium-change loading is the low premium-change loading. Otherwise the flood premium-change loading is zero.
