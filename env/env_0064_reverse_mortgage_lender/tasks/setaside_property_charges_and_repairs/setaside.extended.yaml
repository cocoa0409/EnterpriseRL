    effect: method
    decides: cur_prem
    bindings:
    - plan_n
    - cur_prem
    ladder:
    - when: two or more hazard bills of the review are paid or received
      method: 'pay-plan basis: the sum of the billed amounts of those paid and received hazard bills'
    - when: none of the hazard bills of the review is paid or received
