category: setaside
display_name: Set-Aside Accounts
binding:
  holding_table: setaside_accounts
  event_tables:
  - setaside_transactions
  intake_tables:
  - setaside_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    setaside_balance: setaside_funds
lifecycle:
  states:
  - active
  - depleted
  - cancelled
  - closed
  transitions:
  - from: active
    to: depleted
    by: agent
    means: The set-aside balance reached 0.00 after a disbursement or fee draw.
  - from: active
    to: cancelled
    by: user
    means: The borrower cancelled a borrower-elected set-aside by signed request; the unused balance was released.
  - from: active
    to: closed
    by: agent
    means: The set-aside ended because its purpose was fulfilled (repairs completed) or the loan was paid in full
      or terminated.
  - from: depleted
    to: closed
    by: agent
    means: A depleted set-aside was closed when the loan was paid in full or terminated.
accounts:
- key: setaside_funds
  unit: USD
  meaning: Portion of the principal limit reserved in this set-aside and not yet disbursed; held on the set-aside
    record as setaside_balance.
parameter_schema:
  pays_property_tax: Whether the servicer pays property tax bills directly from the set-aside (boolean)
  pays_hazard_insurance: Whether the servicer pays hazard insurance premiums directly from the set-aside (boolean)
  pays_flood_insurance: Whether the servicer pays flood insurance premiums directly from the set-aside (boolean)
  pays_hoa_and_other_charges: Whether homeowners-association dues, ground rent or special assessments are paid from
    the set-aside (boolean)
  borrower_semiannual_disbursement: Whether the set-aside is paid to the borrower in semi-annual installments for
    the borrower to pay property charges (boolean)
  semiannual_disbursement_months: Calendar months (1-12) in which semi-annual borrower installments are disbursed
    (list; empty where none)
  semiannual_disbursement_day: Calendar day of the disbursement month on which a semi-annual installment is paid
    (0 where none)
  repair_disbursements: Whether the set-aside pays contractors for required repairs (boolean)
  servicing_fee_draws: Whether the monthly HECM servicing fee is drawn from the set-aside (boolean)
  growth_applies: Whether the undisbursed balance grows monthly (boolean)
  growth_spread_pct: Percentage points added to the loan's note rate to give the annual set-aside growth rate (0.00
    where growth does not apply)
  growth_posting_day: Calendar day of the month on which growth for the prior month is credited (0 where growth
    does not apply)
  required_by_financial_assessment: Whether this set-aside is imposed by the financial assessment rather than elected
    (boolean)
  borrower_cancellation_permitted: Whether the borrower may cancel the set-aside by signed request (boolean)
  cancellation_min_months: Calendar months that must elapse after the set-aside was established before a borrower
    cancellation is accepted (0 where cancellation is not permitted)
  cancellation_requires_no_corporate_advance: Whether cancellation is refused while the loan carries an unrepaid
    property-charge corporate advance (boolean)
  cancellation_release_destination: 'Where the unused balance goes when a set-aside is cancelled (code: available_line
    or loan_balance_reduction; not_applicable where cancellation is not permitted)'
  computation_horizon_age: Age of the youngest borrower or eligible non-borrowing spouse to which the initial set-aside
    was computed (years; 0 where not computed actuarially)
  reserve_months_of_charges: Months of property charges funded into the reserve at closing (0 where the set-aside
    is not a fixed-months reserve)
  tax_payment_lead_days: Calendar days before the tax bill's delinquency date by which the servicer pays it (0 where
    the set-aside does not pay taxes)
  insurance_payment_lead_days: Calendar days before the premium due date by which the servicer pays it (0 where
    the set-aside does not pay insurance)
  late_payment_penalty_bearer: Who bears a penalty or lapse cost caused by a late payment of a charge the set-aside
    pays (code)
  shortfall_source: How the unpaid remainder of a payable charge is funded when the set-aside balance is short (code)
  low_balance_notice_months: Notice is sent when the balance is projected to cover fewer than this many months of
    the charges it pays (0 where no projection notice)
  charge_review_frequency_months: Interval in months at which the annual property charges on file are reviewed against
    current bills (0 where the set-aside pays no charges)
  charge_update_evidence: Document that supports an update to the annual charges on file (code)
  semiannual_amount_basis: How each semi-annual borrower installment is sized (code; not_applicable where none)
  repair_setaside_pct_of_estimate: Repair set-aside as a percent of the accepted repair estimate (0.00 where not
    a repair set-aside)
  repair_max_pct_of_max_claim: Largest repair set-aside allowed, as a percent of the maximum claim amount (0.00
    where not a repair set-aside)
  repair_completion_months: Calendar months after the set-aside was established within which repairs must be completed
    and disbursed (0 where not a repair set-aside)
  repair_admin_fee_pct: Repair administration fee as a percent of the repair set-aside, charged at closing (0.00
    where not a repair set-aside)
  repair_admin_fee_minimum: Minimum repair administration fee (USD; 0.00 where not a repair set-aside)
  repair_max_progress_disbursements: Largest number of progress disbursements before the final disbursement (0 where
    not a repair set-aside)
  repair_progress_min_pct_complete: Minimum percent of the work an inspection must find complete before a progress
    disbursement (0.00 where not a repair set-aside)
  repair_holdback_pct: Percent of each progress disbursement held back until the final inspection (0.00 where not
    a repair set-aside)
  repair_inspection_required: Whether every repair disbursement needs an inspection report on file (boolean)
  unused_repair_funds_destination: Where the unused repair balance goes once repairs are certified complete (code)
  sfsa_exhaustion_rule: What happens to servicing fees once the servicing fee set-aside is exhausted (code)
  pays_payee_directly: Whether disbursements go directly to the taxing authority, insurer or contractor rather than
    to the borrower (boolean)
  borrower_top_up_permitted: Whether the borrower may deposit additional funds into the set-aside (boolean)
  refund_credit_target: Where a payee refund of a set-aside disbursement is credited while the set-aside is active
    or depleted (code)
  closed_setaside_refund_target: Where a payee refund received after the set-aside is closed is applied (code)
  close_on_loan_termination: Whether the set-aside closes when the loan is paid in full or terminated (boolean)
  continues_while_due_and_payable: Whether disbursements continue while the loan is due and payable but not yet
    terminated (boolean)
  disbursement_rounding: Rounding rule for growth credits and computed disbursements (rule code)
  pays_installments_separately: Whether each installment of a property tax bill is paid as its own disbursement
    on its own due schedule rather than prepaying the full year (boolean)
  depletion_notice_days: Calendar days after depletion within which the borrower is notified that the charges the
    set-aside paid are now theirs to pay (0 where not applicable)
  eligible_loan_programs: Loan programs the set-aside can be attached to (list of loan_program values)
  max_per_loan: Largest number of open set-asides of this plan on one loan (integer)
