    flood_last_due: 'Where exactly one hazard insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the hazard refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more hazard insurance payments were made from the reserve within those twelve months, the insurance part of the hazard refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the hazard refund need is prorated over the horizon months.'
    cu_status: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    cu_pid: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    cu_case_dp: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    cu_case_ext: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    cu_found_n: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    cushion_m: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    fl_dp: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the hazard release floor is the leaving-home release floor. Where that case records an intent to retain the property, the hazard release floor is the retaining release floor. Otherwise the hazard release floor is the standard release floor.
    fl_ext: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the hazard release floor is the leaving-home release floor. Where that case records an intent to retain the property, the hazard release floor is the retaining release floor. Otherwise the hazard release floor is the standard release floor.
    release_floor: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the hazard release floor is the leaving-home release floor. Where that case records an intent to retain the property, the hazard release floor is the retaining release floor. Otherwise the hazard release floor is the standard release floor.
    rt_adv_n: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released hazard refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower's side keeps the released hazard refund excess times one less the reserve's retention share.
    rt_fee_n: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released hazard refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower's side keeps the released hazard refund excess times one less the reserve's retention share.
    retain_share: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released hazard refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower's side keeps the released hazard refund excess times one less the reserve's retention share.
    tax_part: The tax part of the hazard refund need is the annual property tax on file times the horizon months divided by twelve.
    ins_part: 'Where exactly one hazard insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the hazard refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more hazard insurance payments were made from the reserve within those twelve months, the insurance part of the hazard refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the hazard refund need is prorated over the horizon months.'
    month_charges: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    cushion_amt: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero.
    need: The hazard refund need is the tax part plus the insurance part plus the hazard refund cushion, and the hazard refund cushion is zero.
    room: The hazard refund room is the hazard refund need less the reserve balance, never below zero, and the hazard refund excess is the unearned hazard premium less the hazard refund room, never below zero.
    excess: The hazard refund room is the hazard refund need less the reserve balance, never below zero, and the hazard refund excess is the unearned hazard premium less the hazard refund room, never below zero.
    released: A hazard refund excess above zero that is at least the standard release floor is released to the borrower's side, and a smaller excess stays in the reserve.
    result: The kept amount of a returned hazard premium is the unearned hazard premium less the part of the released excess the borrower's side keeps, rounded half up to the cent once, at the end.
  factors:
  - id: hr_basis
    effect: method
    decides: unearned
    bindings:
    - bs_repl_due
    - unearned
    ladder:
    - when: days in force zero
      method: 'flat: the whole payment is unearned'
    - when: days in force above zero and the cancellation date is a paid replacement hazard bill's due date
      method: 'short-rate: payment times whole months left after the month of cancellation (twelve less months in force less one) over twelve'
    - when: otherwise
      method: 'by days: payment times policy-year days less days in force over policy-year days'
    baseline:
      unearned: wd_paid * (K('policy_year_days') - days_in) / K('policy_year_days')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: hr_horizon
    effect: method
    decides: horizon_m
    bindings:
    - hz_dp
    - hz_ext
    - hz_terms
    - hz_acc
    - horizon_m
    ladder:
    - when: a due-and-payable or extension maturity case with a resolution deadline
      method: whole months from the handling date to the resolution deadline
    - when: no such case, and a payoff case with terms issued or accepted carries a good-through date
      method: whole months from the handling date to the good-through date
    - when: otherwise
      method: the reserve period left
    baseline:
      horizon_m: reserve_left
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  - id: hr_insneed
    effect: method
    decides: ins_mode
    bindings:
    - in_paid_n
    - ins_mode
    ladder:
    - when: exactly one hazard insurance payment from the reserve within twelve months
      method: 'renewal dates: each premium on file counts in full only when its next renewal falls fewer whole months away than the horizon'
    - when: two or more hazard insurance payments from the reserve within twelve months
      method: 'quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file'
    - when: otherwise
      method: prorated over the horizon months
    baseline:
      ins_mode: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: hr_cushion
    effect: parameter
    decides: cushion_m
    bindings:
    - cu_status
    - cu_pid
    - cu_case_dp
    - cu_case_ext
    - cu_found_n
    - cushion_m
    ladder:
    - when: occupancy profile closed and the maturity case is a death of the last surviving borrower, due and payable or in extension
      value: K('estate_cushion_months')
    - when: non-occupancy confirmed and an occupancy inspection ordered within twelve months
      value: K('moved_out_cushion_months')
    - when: otherwise
      value: '0'
    baseline:
      cushion_m: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: hr_floor
    effect: parameter
    decides: release_floor
    bindings:
    - fl_dp
    - fl_ext
    - release_floor
    ladder:
    - when: the due-and-payable or extension maturity case records an intent to sell or to give a deed in lieu
      value: K('floor_leaving')
    - when: that case records an intent to retain the property
      value: K('floor_retaining')
    - when: otherwise
      value: K('floor_standard')
    baseline:
      release_floor: K('floor_standard')
    evidence:
    - cross_category
    cross_difficulty: maturity
  - id: hr_retain
    effect: parameter
    decides: retain_share
    bindings:
    - rt_adv_n
    - rt_fee_n
    - retain_share
    ladder:
    - when: a corporate advance for property tax or insurance on the Summit ledger within twenty-four months
      value: K('retention_share_full')
    - when: no such advance, and an occupancy inspection fee on the Summit ledger within twelve months
      value: K('retention_share_half')
    - when: otherwise
      value: '0'
    baseline:
      retain_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  baseline:
    rule: The withdrawn hazard term is the withdrawn hazard insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's hazard insurance payment made against that bill. The cancellation date is the due date of the latest paid hazard insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero. The unearned hazard premium is the reserve's payment of the withdrawn term times the policy-year days less the days in force, divided by the policy-year days. The reserve period left is the plan's reserve months less the whole months from the reserve's established date to the handling date, never below zero, and the horizon of the hazard refund review is that many whole months. The tax part of the hazard refund need is the annual property tax on file times the horizon months divided by twelve. The insurance part of the hazard refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve. The hazard refund need is the tax part plus the insurance part plus the hazard refund cushion, and the hazard refund cushion is zero. The hazard refund room is the hazard refund need less the reserve balance, never below zero, and the hazard refund excess is the unearned hazard premium less the hazard refund room, never below zero. A hazard refund excess above zero that is at least the standard release floor is released to the borrower's side, and a smaller excess stays in the reserve. The borrower's side keeps the whole released hazard refund excess. The kept amount of a returned hazard premium is the unearned hazard premium less the part of the released excess the borrower's side keeps, rounded half up to the cent once, at the end.
    params:
    - policy_year_days
    - floor_standard
    - reserve_months_of_charges
  inputs:
    history:
    - table: setaside_requests
      aggregate: latest
      field: due_date
      filters:
        request_type: hazard_insurance_bill
        request_status: withdrawn
    - table: setaside_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: setaside_insurance_disbursement
        coverage_type: hazard
    - category: residency
      table: residency_events
      aggregate: count
      field: residency_event_id
      within_months: 12
      filters:
        event_type: residency_inspection_ordered
    - category: jumbo
      table: jumbo_transactions
      aggregate: count
      field: jumbo_txn_id
      within_months: 24
      filters:
        event_type: jumbo_advance_posting
    cross_category:
    - maturity
    - payoff
    - residency
    - jumbo
- id: setaside_ext_returned_flood_premium
  base_policy_refs:
  - setaside_evt_refund
  overwrite:
  - base_policy: setaside_evt_refund
    superseded_clause: the refunded amount is credited back to the set-aside per refund_credit_target
    replaced_by: For a flood insurance premium that an insurer returned to the borrower or the borrower's estate after a reserve-paid term was withdrawn, and that is paid back into a Summit Tax and Insurance Reserve, and only for such a premium, the reserve is credited with the kept amount of a returned flood premium rather than the whole refunded amount; a returned property tax refund and a returned hazard premium are settled by the rules written for them, and every other refund is credited under the base rule.
  trigger: on_request
  subject:
  - setaside_refund_credit
  computes: credit_amount
  target_tool: return_flood_premium_57ae44ac
  params:
    policy_year_days: 365
    insurance_window_months: 12
    inspection_window_months: 12
    estate_cushion_months: 3
    moved_out_cushion_months: 1
    floor_standard: 50.0
    floor_leaving: 0.0
    floor_retaining: 25.0
    advance_window_months: 24
    fee_window_months: 12
    retention_share_full: 1.0
    retention_share_half: 0.5
    earned_policy_fee: 50.0
  rule: 'This rule works out the kept amount of a returned flood premium: the part of the unearned premium that an insurer returned to the borrower, or to the borrower''s estate, for a flood insurance term the Summit Tax and Insurance Reserve paid and that was later withdrawn, which is paid back into the reserve. For a flood insurance premium that an insurer returned to the borrower or the borrower''s estate after a reserve-paid term was withdrawn, and that is paid back into a Summit Tax and Insurance Reserve, and only for such a premium, the reserve is credited with the kept amount of a returned flood premium rather than the whole refunded amount; a returned property tax refund and a returned hazard premium are settled by the rules written for them, and every other refund is credited under the base rule. The credit references the reserve''s payment of the withdrawn flood term and is dated the handling date. A returned flood premium''s kept amount is not settled until the annual flood premium on file has been reviewed against every flood insurance bill received since it was last set. A returned flood premium''s kept amount is not settled until the annual hazard premium on file has been reviewed against every hazard insurance bill received since it was last set. The kept amount of a returned flood premium is fixed only after the reserve''s payment of the latest withdrawn hazard insurance term carries a refund credit. The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve''s payment of it is the reserve''s flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero. The unearned flood premium is the reserve''s payment of the withdrawn term times the policy-year days less the days in force, divided by the policy-year days. Where the days in force are zero, the flat basis applies: the whole payment is unearned, because the term was cancelled before it began. Where the days in force are above zero and the cancellation date is the due date of a paid replacement flood bill, the duplicate-coverage basis applies: the earned flood policy fee is first taken off the payment as fully earned, and the remainder is multiplied by the policy-year days less the days in force and divided by the policy-year days. Otherwise the unearned flood premium is worked out by days as stated. The reserve period left is the plan''s reserve months less the whole months from the reserve''s established date to the handling date, never below zero, and the horizon of the flood refund review is that many whole months. The tax part of the flood refund need is the annual property tax on file times the horizon months divided by twelve. The insurance part of the flood refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve. The flood refund need is the tax part plus the insurance part plus the flood refund cushion, and the flood refund cushion is zero. The flood refund room is the flood refund need less the reserve balance, never below zero, and the flood refund excess is the unearned flood premium less the flood refund room, never below zero. A flood refund excess above zero that is at least the standard release floor is released to the borrower''s side, and a smaller excess stays in the reserve. The borrower''s side keeps the whole released flood refund excess. The kept amount of a returned flood premium is the unearned flood premium less the part of the released excess the borrower''s side keeps, rounded half up to the cent once, at the end. Where the reserve''s Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the flood refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the flood refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the flood refund review is the reserve period left. Where exactly one flood insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the flood refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more flood insurance payments were made from the reserve within those twelve months, the insurance part of the flood refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the flood refund need is prorated over the horizon months. A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve''s Summit loan is closed and the loan''s maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero. Where the loan''s maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the flood release floor is the leaving-home release floor. Where that case records an intent to retain the property, the flood release floor is the retaining release floor. Otherwise the flood release floor is the standard release floor. Where the Summit loan''s ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released flood refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower''s side keeps the released flood refund excess times one less the reserve''s retention share.'
  prerequisite:
  - problem: setaside_ext_reserve_flood_projection
    kind: value_input
    gate: flood_on_file
    form: action
    policy_source: A returned flood premium's kept amount is not settled until the annual flood premium on file has been reviewed against every flood insurance bill received since it was last set.
    fallback_reason: 'The review leaves nothing on the reserve but a changed annual flood premium: the reserve record carries no review date and no link to the bill the review relied on, so no record-visible state shows that the review against the latest flood insurance bill has happened; the sentence therefore names the review itself.'
    condition: The reserve's annual flood premium equals the projected annual flood premium worked out from the flood insurance bills on file, including a replacement bill received after the figure was last set.
    resolved_by: update_reserve_flood_ec384f8d
    effect: The annual flood premium on file, read into the insurance part of the need and into a month of charges, changes to the projected figure, which changes the room and the kept amount.
  - problem: setaside_ext_reserve_hazard_projection
    kind: value_input
    gate: haz_on_file
    form: action
    policy_source: A returned flood premium's kept amount is not settled until the annual hazard premium on file has been reviewed against every hazard insurance bill received since it was last set.
    fallback_reason: 'The review leaves nothing on the reserve but a changed annual hazard premium: the reserve record carries no review date and no link to the bill the review relied on, so no record-visible state shows that the review against the latest hazard insurance bill has happened; the sentence therefore names the review itself.'
    condition: The reserve's annual hazard premium equals the projected annual hazard premium worked out from the bills on file.
    resolved_by: update_reserve_hazard_5ea539e7
    effect: The annual hazard premium on file, read into the insurance part of the need and a month of charges, changes to the projected figure, which changes the room and the kept amount.
  - problem: setaside_ext_returned_hazard_premium
    kind: value_input
    gate: reserve_balance
    form: state
    policy_source: The kept amount of a returned flood premium is fixed only after the reserve's payment of the latest withdrawn hazard insurance term carries a refund credit.
    condition: The reserve's payment of the withdrawn hazard insurance bill with the latest due date has a refund credit on the reserve referencing that payment.
    resolved_by: return_hazard_premium_b6a621c2
    effect: The refund credit for the withdrawn hazard term raises the reserve balance, which lowers the room for the returned flood premium and changes its kept amount.
  cross_category:
  - category: maturity
    as: branch
    reads:
    - status
    - resolution_deadline
    - successor_intent
    - variant_name
    note: The horizon, the cushion and the release floor of the flood refund review read the due-and-payable maturity case.
  - category: payoff
    as: branch
    reads:
    - status
    - statement_good_through_date
    note: A payoff case with terms issued or accepted ends the horizon where no due-and-payable case exists.
  - category: residency
    as: branch
    reads:
    - status
    - residency_profile_id
    - residency_events.event_type
    note: The cushion tier reads the occupancy profile and its inspections.
  - category: jumbo
    as: history
    reads:
    - jumbo_transactions.advance_type
    - jumbo_transactions.effective_date
    note: The retention share reads the advances on the Summit ledger.
  compute:
  - tax_on_file: F('annual_property_tax')
  - haz_on_file: F('annual_hazard_premium')
  - flood_on_file: F('annual_flood_premium')
  - reserve_balance: F('setaside_balance')
  - wd_id: LATEST('setaside_requests', 'setaside_request_id', date_field='due_date', request_type='flood_insurance_bill', request_status='withdrawn')
  - wd_start: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='flood_insurance_bill', request_status='withdrawn')
  - wd_paid: SUM('setaside_transactions', 'amount', event_type='setaside_insurance_disbursement', coverage_type='flood', setaside_request_id=wd_id)
  - repl_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='flood_insurance_bill', request_status='paid')
  - cancel_on: repl_due if (repl_due and wd_start and repl_due >= wd_start) else NOW
  - days_in: MX(0, DAYS(wd_start, cancel_on)) if wd_start else 0
  - months_in: MX(0, MONTHS(wd_start, cancel_on)) if wd_start else 0
  - bs_repl_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='flood_insurance_bill', request_status='paid')
  - unearned: wd_paid if days_in == 0 else ((wd_paid - K('earned_policy_fee')) * (K('policy_year_days') - days_in) / K('policy_year_days') if (days_in > 0 and bs_repl_due and cancel_on == bs_repl_due) else wd_paid * (K('policy_year_days') - days_in) / K('policy_year_days'))
  - reserve_left: MX(0, P('reserve_months_of_charges') - MONTHS(F('established_date'), NOW))
  - hz_dp: CFIELD('maturity', 'resolution_deadline', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - hz_ext: CFIELD('maturity', 'resolution_deadline', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - hz_terms: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='terms_issued')
  - hz_acc: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='accepted')
  - horizon_m: MX(0, MONTHS(NOW, hz_dp or hz_ext)) if (hz_dp or hz_ext) else (MX(0, MONTHS(NOW, hz_terms or hz_acc)) if (hz_terms or hz_acc) else reserve_left)
  - in_paid_n: COUNT('setaside_transactions', within_months=K('insurance_window_months'), date_field='effective_date', event_type='setaside_insurance_disbursement', coverage_type='flood')
  - ins_mode: 1 if in_paid_n == 1 else (3 if in_paid_n >= 2 else 0)
  - haz_last_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='hazard_insurance_bill', request_status='paid')
  - flood_last_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='flood_insurance_bill', request_status='paid')
  - cu_status: CFIELD('residency', 'status', jumbo_loan_id=F('jumbo_loan_id'))
  - cu_pid: CFIELD('residency', 'residency_profile_id', jumbo_loan_id=F('jumbo_loan_id'))
  - cu_case_dp: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - cu_case_ext: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - cu_found_n: XCOUNT('residency', 'residency_events', within_months=K('inspection_window_months'), date_field='effective_date', residency_profile_id=cu_pid, event_type='residency_inspection_ordered')
  - cushion_m: K('estate_cushion_months') if (cu_status == 'closed' and (cu_case_dp or cu_case_ext) == 'Death of Last Surviving Borrower') else (K('moved_out_cushion_months') if (cu_status == 'nonoccupancy_confirmed' and cu_found_n >= 1) else 0)
  - fl_dp: CFIELD('maturity', 'successor_intent', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - fl_ext: CFIELD('maturity', 'successor_intent', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - release_floor: K('floor_leaving') if ((fl_dp or fl_ext) == 'sell_property' or (fl_dp or fl_ext) == 'deed_in_lieu') else (K('floor_retaining') if (fl_dp or fl_ext) == 'retain_property' else K('floor_standard'))
  - rt_adv_n: XCOUNT('jumbo', 'jumbo_transactions', within_months=K('advance_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='corporate_advance_property_tax') + XCOUNT('jumbo', 'jumbo_transactions', within_months=K('advance_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='corporate_advance_insurance')
  - rt_fee_n: XCOUNT('jumbo', 'jumbo_transactions', within_months=K('fee_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='inspection_fee')
  - retain_share: K('retention_share_full') if rt_adv_n >= 1 else (K('retention_share_half') if (rt_adv_n == 0 and rt_fee_n >= 1) else 0)
  - tax_part: tax_on_file * horizon_m / 12
  - ins_part: ((haz_on_file if (haz_last_due and MONTHS(NOW, haz_last_due) + 12 < horizon_m) else 0) + (flood_on_file if (flood_last_due and MONTHS(NOW, flood_last_due) + 12 < horizon_m) else 0)) if ins_mode == 1 else (int((horizon_m + 2) / 3) * (haz_on_file + flood_on_file) / 4 if ins_mode == 3 else (haz_on_file + flood_on_file) * horizon_m / 12)
  - month_charges: (tax_on_file + haz_on_file + flood_on_file) / 12
  - cushion_amt: cushion_m * month_charges
  - need: tax_part + ins_part + cushion_amt
  - room: MX(0, need - reserve_balance)
  - excess: MX(0, unearned - room)
  - released: excess if (excess > 0 and excess >= release_floor) else 0
  - result: RND(unearned - released * (1 - retain_share), 2)
  compute_basis:
    tax_on_file: The tax part of the flood refund need is the annual property tax on file times the horizon months divided by twelve.
    haz_on_file: The insurance part of the flood refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve.
    flood_on_file: The insurance part of the flood refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve.
    reserve_balance: The flood refund room is the flood refund need less the reserve balance, never below zero, and the flood refund excess is the unearned flood premium less the flood refund room, never below zero.
    wd_id: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero.
    wd_start: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero.
    wd_paid: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero.
    repl_due: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero.
    cancel_on: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero.
    days_in: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero.
    months_in: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero.
    bs_repl_due: 'Where the days in force are zero, the flat basis applies: the whole payment is unearned, because the term was cancelled before it began. Where the days in force are above zero and the cancellation date is the due date of a paid replacement flood bill, the duplicate-coverage basis applies: the earned flood policy fee is first taken off the payment as fully earned, and the remainder is multiplied by the policy-year days less the days in force and divided by the policy-year days. Otherwise the unearned flood premium is worked out by days as stated.'
    unearned: 'Where the days in force are zero, the flat basis applies: the whole payment is unearned, because the term was cancelled before it began. Where the days in force are above zero and the cancellation date is the due date of a paid replacement flood bill, the duplicate-coverage basis applies: the earned flood policy fee is first taken off the payment as fully earned, and the remainder is multiplied by the policy-year days less the days in force and divided by the policy-year days. Otherwise the unearned flood premium is worked out by days as stated.'
    reserve_left: The reserve period left is the plan's reserve months less the whole months from the reserve's established date to the handling date, never below zero, and the horizon of the flood refund review is that many whole months.
    hz_dp: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the flood refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the flood refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the flood refund review is the reserve period left.
    hz_ext: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the flood refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the flood refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the flood refund review is the reserve period left.
    hz_terms: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the flood refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the flood refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the flood refund review is the reserve period left.
    hz_acc: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the flood refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the flood refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the flood refund review is the reserve period left.
    horizon_m: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the flood refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the flood refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the flood refund review is the reserve period left.
    in_paid_n: 'Where exactly one flood insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the flood refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more flood insurance payments were made from the reserve within those twelve months, the insurance part of the flood refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the flood refund need is prorated over the horizon months.'
    ins_mode: 'Where exactly one flood insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the flood refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more flood insurance payments were made from the reserve within those twelve months, the insurance part of the flood refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the flood refund need is prorated over the horizon months.'
    haz_last_due: 'Where exactly one flood insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the flood refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more flood insurance payments were made from the reserve within those twelve months, the insurance part of the flood refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the flood refund need is prorated over the horizon months.'
    flood_last_due: 'Where exactly one flood insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the flood refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more flood insurance payments were made from the reserve within those twelve months, the insurance part of the flood refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the flood refund need is prorated over the horizon months.'
    cu_status: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    cu_pid: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    cu_case_dp: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    cu_case_ext: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    cu_found_n: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    cushion_m: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    fl_dp: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the flood release floor is the leaving-home release floor. Where that case records an intent to retain the property, the flood release floor is the retaining release floor. Otherwise the flood release floor is the standard release floor.
    fl_ext: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the flood release floor is the leaving-home release floor. Where that case records an intent to retain the property, the flood release floor is the retaining release floor. Otherwise the flood release floor is the standard release floor.
    release_floor: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the flood release floor is the leaving-home release floor. Where that case records an intent to retain the property, the flood release floor is the retaining release floor. Otherwise the flood release floor is the standard release floor.
    rt_adv_n: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released flood refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower's side keeps the released flood refund excess times one less the reserve's retention share.
    rt_fee_n: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released flood refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower's side keeps the released flood refund excess times one less the reserve's retention share.
    retain_share: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released flood refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower's side keeps the released flood refund excess times one less the reserve's retention share.
    tax_part: The tax part of the flood refund need is the annual property tax on file times the horizon months divided by twelve.
    ins_part: 'Where exactly one flood insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the flood refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more flood insurance payments were made from the reserve within those twelve months, the insurance part of the flood refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the flood refund need is prorated over the horizon months.'
    month_charges: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    cushion_amt: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the flood refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the flood refund cushion is the moved-out cushion months times a month of charges. Otherwise the flood refund cushion is zero.
    need: The flood refund need is the tax part plus the insurance part plus the flood refund cushion, and the flood refund cushion is zero.
    room: The flood refund room is the flood refund need less the reserve balance, never below zero, and the flood refund excess is the unearned flood premium less the flood refund room, never below zero.
    excess: The flood refund room is the flood refund need less the reserve balance, never below zero, and the flood refund excess is the unearned flood premium less the flood refund room, never below zero.
    released: A flood refund excess above zero that is at least the standard release floor is released to the borrower's side, and a smaller excess stays in the reserve.
    result: The kept amount of a returned flood premium is the unearned flood premium less the part of the released excess the borrower's side keeps, rounded half up to the cent once, at the end.
  factors:
  - id: fr_basis
    effect: method
    decides: unearned
    bindings:
    - bs_repl_due
    - unearned
    ladder:
    - when: days in force zero
      method: 'flat: the whole payment is unearned'
    - when: days in force above zero and the cancellation date is a paid replacement flood bill's due date
      method: 'duplicate coverage: the earned policy fee comes off first, the remainder is prorated by days'
    - when: otherwise
      method: 'by days: payment times policy-year days less days in force over policy-year days'
    baseline:
      unearned: wd_paid * (K('policy_year_days') - days_in) / K('policy_year_days')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: fr_horizon
    effect: method
    decides: horizon_m
    bindings:
    - hz_dp
    - hz_ext
    - hz_terms
    - hz_acc
    - horizon_m
    ladder:
    - when: a due-and-payable or extension maturity case with a resolution deadline
      method: whole months from the handling date to the resolution deadline
    - when: no such case, and a payoff case with terms issued or accepted carries a good-through date
      method: whole months from the handling date to the good-through date
    - when: otherwise
      method: the reserve period left
    baseline:
      horizon_m: reserve_left
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  - id: fr_insneed
    effect: method
    decides: ins_mode
    bindings:
    - in_paid_n
    - ins_mode
    ladder:
    - when: exactly one flood insurance payment from the reserve within twelve months
      method: 'renewal dates: each premium on file counts in full only when its next renewal falls fewer whole months away than the horizon'
    - when: two or more flood insurance payments from the reserve within twelve months
      method: 'quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file'
    - when: otherwise
      method: prorated over the horizon months
    baseline:
      ins_mode: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fr_cushion
    effect: parameter
    decides: cushion_m
    bindings:
    - cu_status
    - cu_pid
    - cu_case_dp
    - cu_case_ext
    - cu_found_n
    - cushion_m
    ladder:
    - when: occupancy profile closed and the maturity case is a death of the last surviving borrower, due and payable or in extension
      value: K('estate_cushion_months')
    - when: non-occupancy confirmed and an occupancy inspection ordered within twelve months
      value: K('moved_out_cushion_months')
    - when: otherwise
      value: '0'
    baseline:
      cushion_m: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: fr_floor
    effect: parameter
    decides: release_floor
    bindings:
    - fl_dp
    - fl_ext
    - release_floor
    ladder:
    - when: the due-and-payable or extension maturity case records an intent to sell or to give a deed in lieu
      value: K('floor_leaving')
    - when: that case records an intent to retain the property
      value: K('floor_retaining')
    - when: otherwise
      value: K('floor_standard')
    baseline:
      release_floor: K('floor_standard')
    evidence:
    - cross_category
    cross_difficulty: maturity
  - id: fr_retain
    effect: parameter
    decides: retain_share
    bindings:
    - rt_adv_n
    - rt_fee_n
    - retain_share
    ladder:
    - when: a corporate advance for property tax or insurance on the Summit ledger within twenty-four months
      value: K('retention_share_full')
    - when: no such advance, and an occupancy inspection fee on the Summit ledger within twelve months
      value: K('retention_share_half')
    - when: otherwise
      value: '0'
    baseline:
      retain_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  baseline:
    rule: The withdrawn flood term is the withdrawn flood insurance bill on file with the latest due date, which is the day that term began, and the reserve's payment of it is the reserve's flood insurance payment made against that bill. The cancellation date is the due date of the latest paid flood insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero. The unearned flood premium is the reserve's payment of the withdrawn term times the policy-year days less the days in force, divided by the policy-year days. The reserve period left is the plan's reserve months less the whole months from the reserve's established date to the handling date, never below zero, and the horizon of the flood refund review is that many whole months. The tax part of the flood refund need is the annual property tax on file times the horizon months divided by twelve. The insurance part of the flood refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve. The flood refund need is the tax part plus the insurance part plus the flood refund cushion, and the flood refund cushion is zero. The flood refund room is the flood refund need less the reserve balance, never below zero, and the flood refund excess is the unearned flood premium less the flood refund room, never below zero. A flood refund excess above zero that is at least the standard release floor is released to the borrower's side, and a smaller excess stays in the reserve. The borrower's side keeps the whole released flood refund excess. The kept amount of a returned flood premium is the unearned flood premium less the part of the released excess the borrower's side keeps, rounded half up to the cent once, at the end.
    params:
    - policy_year_days
    - floor_standard
    - reserve_months_of_charges
  inputs:
    history:
    - table: setaside_requests
      aggregate: latest
      field: due_date
      filters:
        request_type: flood_insurance_bill
        request_status: withdrawn
    - table: setaside_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: setaside_insurance_disbursement
        coverage_type: flood
    - category: residency
      table: residency_events
      aggregate: count
      field: residency_event_id
