      value: K('moved_out_loading_pct')
    - when: otherwise
      value: '0'
    baseline:
      occ_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: residency
  - id: fu_appraisal
    effect: parameter
    decides: appr_pct
    bindings:
    - ap_val
    - ap_date
    - ap_close
    - appr_pct
    ladder:
    - when: a current maturity-case appraisal exceeds the closing appraisal by more than the threshold
      value: K('appraisal_high_pct')
    - when: a current maturity-case appraisal exceeds the closing appraisal by no more than the threshold
      value: K('appraisal_low_pct')
    - when: otherwise
      value: '0'
    baseline:
      appr_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  - id: fu_span
    effect: method
    decides: share
    bindings:
    - sp_wd_n
    - sp_paid_n
    - sp_pr_n
    - sp_due
    - share
    ladder:
    - when: a flood bill of the review is withdrawn
      method: 'replacement month basis: whole months from the latest paid flood bill''s due date to the review, divided by twelve, between zero and one'
    - when: none withdrawn and two or more flood bills of the review paid or received
      method: 'installment count basis: paid flood bills divided by paid and received flood bills'
    - when: otherwise
      method: 'one half: the renewal is taken to fall midway through the coming twelve months'
    baseline:
      share: K('default_renewal_share')
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The flood bills of the review are the flood insurance bills on file for the reserve received within the twelve months before the review. The current flood premium is the billed amount of the paid flood insurance bill with the latest due date. The renewal flood premium is the current flood premium increased once by the flood renewal loading, which is the standard renewal increase plus the flood premium-change loading, the flood residence loading and the flood appraisal loading, all in percent, added together and applied once to the current flood premium, not one after another; the flood premium-change loading, the flood residence loading and the flood appraisal loading are each zero. The flood renewal share is one half. The projected annual flood premium is the current flood premium times one less the flood renewal share, plus the renewal flood premium times the flood renewal share. The projected annual flood premium is rounded half up to the cent once, at the end, and the review takes it from the flood insurance bill on file with the latest due date.
    params:
    - review_window_months
    - standard_renewal_increase_pct
    - default_renewal_share
  inputs:
    history:
    - table: setaside_requests
      aggregate: sum
      field: billed_amount
      within_months: 12
      filters:
        request_type: flood_insurance_bill
        request_status: paid
    - table: setaside_requests
      aggregate: sum
      field: billed_amount
      within_months: 12
      filters:
        request_type: flood_insurance_bill
        request_status: withdrawn
    cross_category:
    - residency
    - maturity
    - jumbo
- id: setaside_ext_returned_hazard_premium
  base_policy_refs:
  - setaside_evt_refund
  overwrite:
  - base_policy: setaside_evt_refund
    superseded_clause: the refunded amount is credited back to the set-aside per refund_credit_target
    replaced_by: For a hazard insurance premium that an insurer returned to the borrower or the borrower's estate after a reserve-paid term was withdrawn, and that is paid back into a Summit Tax and Insurance Reserve, and only for such a premium, the reserve is credited with the kept amount of a returned hazard premium rather than the whole refunded amount; a returned property tax refund and a returned flood premium are settled by the rules written for them, and every other refund is credited under the base rule.
  trigger: on_request
  subject:
  - setaside_refund_credit
  computes: credit_amount
  target_tool: return_hazard_premium_b6a621c2
  params:
    policy_year_days: 365
    insurance_window_months: 12
    inspection_window_months: 12
    estate_cushion_months: 2
    moved_out_cushion_months: 1
    floor_standard: 50.0
    floor_leaving: 0.0
    floor_retaining: 25.0
    advance_window_months: 24
    fee_window_months: 12
    retention_share_full: 1.0
    retention_share_half: 0.5
  rule: 'This rule works out the kept amount of a returned hazard premium: the part of the unearned premium that an insurer returned to the borrower, or to the borrower''s estate, for a hazard insurance term the Summit Tax and Insurance Reserve paid and that was later withdrawn, which is paid back into the reserve. For a hazard insurance premium that an insurer returned to the borrower or the borrower''s estate after a reserve-paid term was withdrawn, and that is paid back into a Summit Tax and Insurance Reserve, and only for such a premium, the reserve is credited with the kept amount of a returned hazard premium rather than the whole refunded amount; a returned property tax refund and a returned flood premium are settled by the rules written for them, and every other refund is credited under the base rule. The credit references the reserve''s payment of the withdrawn hazard term and is dated the handling date. The kept amount of a returned hazard premium is worked out only after the annual hazard premium on file has been reviewed against every hazard insurance bill received since it was last set. The kept amount of a returned hazard premium is worked out only after the annual flood premium on file has been reviewed against every flood insurance bill received since it was last set. The withdrawn hazard term is the withdrawn hazard insurance bill on file with the latest due date, which is the day that term began, and the reserve''s payment of it is the reserve''s hazard insurance payment made against that bill. The cancellation date is the due date of the latest paid hazard insurance bill when that date is on or after the day the withdrawn term began, and otherwise the handling date; the days in force are the days from the day the withdrawn term began to the cancellation date and the months in force are the whole months between those dates, neither below zero. The unearned hazard premium is the reserve''s payment of the withdrawn term times the policy-year days less the days in force, divided by the policy-year days. Where the days in force are zero, the flat basis applies: the whole payment is unearned, because the term was cancelled before it began. Where the days in force are above zero and the cancellation date is the due date of a paid replacement hazard bill, the short-rate basis applies, because the borrower''s side asked for the cancellation: the unearned hazard premium is the payment times the whole months left after the month in which the cancellation falls, which is twelve less the months in force less one and never below zero, divided by twelve. Otherwise the unearned hazard premium is worked out by days as stated. The reserve period left is the plan''s reserve months less the whole months from the reserve''s established date to the handling date, never below zero, and the horizon of the hazard refund review is that many whole months. The tax part of the hazard refund need is the annual property tax on file times the horizon months divided by twelve. The insurance part of the hazard refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve. The hazard refund need is the tax part plus the insurance part plus the hazard refund cushion, and the hazard refund cushion is zero. The hazard refund room is the hazard refund need less the reserve balance, never below zero, and the hazard refund excess is the unearned hazard premium less the hazard refund room, never below zero. A hazard refund excess above zero that is at least the standard release floor is released to the borrower''s side, and a smaller excess stays in the reserve. The borrower''s side keeps the whole released hazard refund excess. The kept amount of a returned hazard premium is the unearned hazard premium less the part of the released excess the borrower''s side keeps, rounded half up to the cent once, at the end. Where the reserve''s Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the hazard refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the hazard refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the hazard refund review is the reserve period left. Where exactly one hazard insurance payment was made from the reserve within the twelve months before the handling date, the insurance part of the hazard refund need is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the latest paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the latest paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more hazard insurance payments were made from the reserve within those twelve months, the insurance part of the hazard refund need is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part of the hazard refund need is prorated over the horizon months. A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve''s Summit loan is closed and the loan''s maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard refund cushion is the estate cushion months times a month of charges. Where the occupancy profile shows non-occupancy confirmed and an occupancy inspection was ordered on it within the twelve months before the handling date, the hazard refund cushion is the moved-out cushion months times a month of charges. Otherwise the hazard refund cushion is zero. Where the loan''s maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the hazard release floor is the leaving-home release floor. Where that case records an intent to retain the property, the hazard release floor is the retaining release floor. Otherwise the hazard release floor is the standard release floor. Where the Summit loan''s ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released hazard refund excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of it. Otherwise the reserve keeps none of it. The borrower''s side keeps the released hazard refund excess times one less the reserve''s retention share.'
  prerequisite:
  - problem: setaside_ext_reserve_hazard_projection
    kind: value_input
    gate: haz_on_file
    form: action
    policy_source: The kept amount of a returned hazard premium is worked out only after the annual hazard premium on file has been reviewed against every hazard insurance bill received since it was last set.
    fallback_reason: 'The review leaves nothing on the reserve but a changed annual hazard premium: the reserve record carries no review date and no link to the bill the review relied on, so no record-visible state shows that the review against the latest hazard insurance bill has happened; the sentence therefore names the review itself.'
    condition: The reserve's annual hazard premium equals the projected annual hazard premium worked out from the hazard insurance bills on file, including a replacement bill received after the figure was last set.
    resolved_by: update_reserve_hazard_5ea539e7
    effect: The annual hazard premium on file, read into the insurance part of the need and into a month of charges, changes to the projected figure, which changes the room and the kept amount.
  - problem: setaside_ext_reserve_flood_projection
    kind: value_input
    gate: flood_on_file
    form: action
    policy_source: The kept amount of a returned hazard premium is worked out only after the annual flood premium on file has been reviewed against every flood insurance bill received since it was last set.
    fallback_reason: 'The review leaves nothing on the reserve but a changed annual flood premium: the reserve record carries no review date and no link to the bill the review relied on, so no record-visible state shows that the review against the latest flood insurance bill has happened; the sentence therefore names the review itself.'
    condition: The reserve's annual flood premium equals the projected annual flood premium worked out from the bills on file.
    resolved_by: update_reserve_flood_ec384f8d
    effect: The annual flood premium on file, read into the insurance part of the need and a month of charges, changes to the projected figure, which changes the room and the kept amount.
  cross_category:
  - category: maturity
    as: branch
    reads:
    - status
    - resolution_deadline
    - successor_intent
    - variant_name
    note: The horizon, the cushion and the release floor of the hazard refund review read the due-and-payable maturity case.
  - category: payoff
    as: branch
    reads:
    - status
    - statement_good_through_date
    note: A payoff case with terms issued or accepted ends the horizon where no due-and-payable case exists.
  - category: residency
    as: branch
    reads:
    - status
    - residency_profile_id
    - residency_events.event_type
    note: The cushion tier reads the occupancy profile and its inspections.
  - category: jumbo
    as: history
    reads:
    - jumbo_transactions.advance_type
    - jumbo_transactions.effective_date
    note: The retention share reads the advances on the Summit ledger.
  compute:
  - tax_on_file: F('annual_property_tax')
  - haz_on_file: F('annual_hazard_premium')
  - flood_on_file: F('annual_flood_premium')
  - reserve_balance: F('setaside_balance')
  - wd_id: LATEST('setaside_requests', 'setaside_request_id', date_field='due_date', request_type='hazard_insurance_bill', request_status='withdrawn')
  - wd_start: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='hazard_insurance_bill', request_status='withdrawn')
  - wd_paid: SUM('setaside_transactions', 'amount', event_type='setaside_insurance_disbursement', coverage_type='hazard', setaside_request_id=wd_id)
  - repl_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='hazard_insurance_bill', request_status='paid')
  - cancel_on: repl_due if (repl_due and wd_start and repl_due >= wd_start) else NOW
  - days_in: MX(0, DAYS(wd_start, cancel_on)) if wd_start else 0
  - months_in: MX(0, MONTHS(wd_start, cancel_on)) if wd_start else 0
  - bs_repl_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='hazard_insurance_bill', request_status='paid')
  - unearned: wd_paid if days_in == 0 else (wd_paid * MX(0, 12 - months_in - 1) / 12 if (days_in > 0 and bs_repl_due and cancel_on == bs_repl_due) else wd_paid * (K('policy_year_days') - days_in) / K('policy_year_days'))
  - reserve_left: MX(0, P('reserve_months_of_charges') - MONTHS(F('established_date'), NOW))
  - hz_dp: CFIELD('maturity', 'resolution_deadline', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - hz_ext: CFIELD('maturity', 'resolution_deadline', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - hz_terms: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='terms_issued')
  - hz_acc: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='accepted')
  - horizon_m: MX(0, MONTHS(NOW, hz_dp or hz_ext)) if (hz_dp or hz_ext) else (MX(0, MONTHS(NOW, hz_terms or hz_acc)) if (hz_terms or hz_acc) else reserve_left)
  - in_paid_n: COUNT('setaside_transactions', within_months=K('insurance_window_months'), date_field='effective_date', event_type='setaside_insurance_disbursement', coverage_type='hazard')
  - ins_mode: 1 if in_paid_n == 1 else (3 if in_paid_n >= 2 else 0)
  - haz_last_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='hazard_insurance_bill', request_status='paid')
  - flood_last_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='flood_insurance_bill', request_status='paid')
  - cu_status: CFIELD('residency', 'status', jumbo_loan_id=F('jumbo_loan_id'))
  - cu_pid: CFIELD('residency', 'residency_profile_id', jumbo_loan_id=F('jumbo_loan_id'))
  - cu_case_dp: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - cu_case_ext: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - cu_found_n: XCOUNT('residency', 'residency_events', within_months=K('inspection_window_months'), date_field='effective_date', residency_profile_id=cu_pid, event_type='residency_inspection_ordered')
  - cushion_m: K('estate_cushion_months') if (cu_status == 'closed' and (cu_case_dp or cu_case_ext) == 'Death of Last Surviving Borrower') else (K('moved_out_cushion_months') if (cu_status == 'nonoccupancy_confirmed' and cu_found_n >= 1) else 0)
  - fl_dp: CFIELD('maturity', 'successor_intent', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - fl_ext: CFIELD('maturity', 'successor_intent', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - release_floor: K('floor_leaving') if ((fl_dp or fl_ext) == 'sell_property' or (fl_dp or fl_ext) == 'deed_in_lieu') else (K('floor_retaining') if (fl_dp or fl_ext) == 'retain_property' else K('floor_standard'))
  - rt_adv_n: XCOUNT('jumbo', 'jumbo_transactions', within_months=K('advance_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='corporate_advance_property_tax') + XCOUNT('jumbo', 'jumbo_transactions', within_months=K('advance_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='corporate_advance_insurance')
  - rt_fee_n: XCOUNT('jumbo', 'jumbo_transactions', within_months=K('fee_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='inspection_fee')
  - retain_share: K('retention_share_full') if rt_adv_n >= 1 else (K('retention_share_half') if (rt_adv_n == 0 and rt_fee_n >= 1) else 0)
  - tax_part: tax_on_file * horizon_m / 12
  - ins_part: ((haz_on_file if (haz_last_due and MONTHS(NOW, haz_last_due) + 12 < horizon_m) else 0) + (flood_on_file if (flood_last_due and MONTHS(NOW, flood_last_due) + 12 < horizon_m) else 0)) if ins_mode == 1 else (int((horizon_m + 2) / 3) * (haz_on_file + flood_on_file) / 4 if ins_mode == 3 else (haz_on_file + flood_on_file) * horizon_m / 12)
  - month_charges: (tax_on_file + haz_on_file + flood_on_file) / 12
  - cushion_amt: cushion_m * month_charges
  - need: tax_part + ins_part + cushion_amt
  - room: MX(0, need - reserve_balance)
  - excess: MX(0, unearned - room)
  - released: excess if (excess > 0 and excess >= release_floor) else 0
  - result: RND(unearned - released * (1 - retain_share), 2)
  compute_basis:
    tax_on_file: The tax part of the hazard refund need is the annual property tax on file times the horizon months divided by twelve.
    haz_on_file: The insurance part of the hazard refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve.
    flood_on_file: The insurance part of the hazard refund need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve.
