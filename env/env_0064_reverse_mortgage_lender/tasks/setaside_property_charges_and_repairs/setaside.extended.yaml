- id: setaside_borrower_cancellation
  subject:
  - setaside_cancelled
  - setaside_release
  rule: 'Only plans whose borrower_cancellation_permitted is true may be cancelled by the borrower; a request to
    cancel any other plan, including a mandatory LESA imposed by the financial assessment, is declined with reason
    cancellation_not_permitted. A cancellation takes effect only against a borrower-elected cancellation request
    on file for that set-aside whose request status is received and which every borrower on the loan signed. A cancellation
    is accepted only on or after the date cancellation_min_months calendar months after the set-aside was established.
    That date is the same day number in the month cancellation_min_months calendar months after the established_date,
    falling back to the last day of that month when that day does not exist, and the date itself qualifies; an earlier
    request is declined with reason cancellation_too_early. A cancellation is refused while the loan has a property
    charge repayment plan whose status is pending_signature, active or defaulted, and such a request is declined
    with reason corporate_advance_outstanding, per cancellation_requires_no_corporate_advance. On cancellation the
    whole remaining balance is released on the same date with release_reason borrower_elected_cancellation to the
    destination in cancellation_release_destination: the HECM available line for a borrower-elected LESA, a reduction
    of the Summit loan balance for the Summit reserve; from then on every property charge is the borrower''s to
    pay. Only the borrower can cancel; the servicer records the borrower''s own signed request.'
  eligibility:
  - id: cancellation_request_on_file
    applies_to:
    - setaside_cancelled
    kind: authorization
    condition: A cancellation takes effect only against a borrower-elected cancellation request on file for that
      set-aside whose request status is received and which every borrower on the loan signed.
    evidence_fields:
    - setaside_requests.setaside_request_id
    - setaside_requests.request_type
    - setaside_requests.request_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_requests.setaside_request_id
      action_bindings:
        setaside_requests.setaside_request_id: setaside_request_id
  - id: cancellation_waiting_period
    applies_to:
    - setaside_cancelled
    kind: time
    condition: A cancellation is accepted only on or after the date cancellation_min_months calendar months after
      the set-aside was established.
    evidence_fields:
    - setaside_accounts.established_date
    - setaside_accounts.setaside_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_accounts.setaside_id
      action_bindings:
        setaside_accounts.setaside_id: setaside_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the set-aside was established
      anchor_source: setaside_accounts.established_date
      relation: not_before
      duration_source: variants.cancellation_min_months
      unit: calendar_months
      counting_rule: That date is the same day number in the month cancellation_min_months calendar months after
        the established_date, falling back to the last day of that month when that day does not exist, and the date
        itself qualifies; an earlier request is declined with reason cancellation_too_early.
      boundary: inclusive
  - id: no_open_repayment_plan
    applies_to:
    - setaside_cancelled
    kind: dedup
    condition: A cancellation is refused while the loan has a property charge repayment plan whose status is pending_signature,
      active or defaulted, and such a request is declined with reason corporate_advance_outstanding, per cancellation_requires_no_corporate_advance.
    evidence_fields:
    - propcharge_plans.hecm_loan_id
    - propcharge_plans.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - propcharge_plans.hecm_loan_id
      action_bindings:
        propcharge_plans.hecm_loan_id: hecm_loan_id
    dedup_contract:
      table: propcharge_plans
      mode: separate_record
      object_bindings:
        hecm_loan_id: hecm_loan_id
      duplicate_filters:
        status:
        - pending_signature
        - active
        - defaulted
      distinct_fields: []
  params:
    per_tier:
      Fully Funded LESA (Mandatory):
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Fully Funded LESA (Borrower-Elected):
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Partially Funded LESA:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Repair Set-Aside:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Servicing Fee Set-Aside:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
      Summit Tax and Insurance Reserve:
        borrower_cancellation_permitted: =borrower_cancellation_permitted
        cancellation_min_months: =cancellation_min_months
- id: setaside_lifecycle_close
  subject:
  - setaside_closed
  - setaside_depleted
  - setaside_release
  rule: A set-aside closes for loan termination only when the loan status is paid_in_full, claim_terminated or rescinded,
    per close_on_loan_termination; it closes on the loan's terminated_date, and any remaining balance is released
    on that date with release_reason loan_terminated, which restores nothing because the loan has ended. A Repair
    Set-Aside also closes on the date its final repair draw is paid, as set out in the repair rule. A set-aside
    becomes depleted on the date a disbursement or fee draw brings its balance to 0.00, and a depleted set-aside
    only ever moves on to closed. A set-aside is never closed merely because the loan became due and payable; while
    the loan is due and payable it keeps paying only where continues_while_due_and_payable is true.
  eligibility:
  - id: loan_terminated
    applies_to:
    - setaside_closed
    kind: state
    condition: A set-aside closes for loan termination only when the loan status is paid_in_full, claim_terminated
      or rescinded, per close_on_loan_termination; it closes on the loan's terminated_date, and any remaining balance
      is released on that date with release_reason loan_terminated, which restores nothing because the loan has
      ended.
    evidence_fields:
    - hecm_loans.status
    - hecm_loans.hecm_loan_id
    - hecm_loans.terminated_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - hecm_loans.hecm_loan_id
      action_bindings:
        hecm_loans.hecm_loan_id: hecm_loan_id
    state_contract:
      field: hecm_loans.status
      allowed:
      - paid_in_full
      - claim_terminated
      - rescinded
- id: setaside_charge_review
  subject:
  - setaside_charges_updated
  rule: The annual property charges on file are reviewed every charge_review_frequency_months months and whenever
    a new bill is received, and are updated only from the evidence named in charge_update_evidence. The annual charges
    on file are updated only from a property tax, hazard insurance or flood insurance bill on file for that set-aside.
    The annual property tax is the sum of the billed_amount of every installment bill of the current tax year, the
    annual hazard premium is the billed_amount of the current hazard policy term, and the annual flood premium is
    the billed_amount of the current flood policy term. An update never changes a Partially Funded LESA's fixed
    semi-annual installment and never adds funds to the set-aside; when the updated charges leave the balance projected
    to cover fewer than low_balance_notice_months months of the charges the set-aside pays, the borrower receives
    a low-balance notice.
  eligibility:
  - id: update_from_bill
    applies_to:
    - setaside_charges_updated
    kind: authorization
    condition: The annual charges on file are updated only from a property tax, hazard insurance or flood insurance
      bill on file for that set-aside.
    evidence_fields:
    - setaside_requests.setaside_request_id
    - setaside_requests.request_type
    - setaside_requests.billed_amount
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - setaside_requests.setaside_request_id
      action_bindings:
        setaside_requests.setaside_request_id: setaside_request_id
extended_policies:
- id: setaside_ext_reserve_tax_projection
  base_policy_refs:
  - setaside_charge_review
  overwrite:
  - base_policy: setaside_charge_review
    superseded_clause: The annual property tax is the sum of the billed_amount of every installment bill of the current tax year
    replaced_by: For a Summit Tax and Insurance Reserve, and only for such a reserve, the annual property tax held on file is the projected annual property tax worked out below rather than the sum of the current tax year's installment bills; the annual property tax of every other set-aside remains under the base rule.
  trigger: state_due
  subject:
  - setaside_charges_updated
  computes: annual_property_tax
  target_tool: update_reserve_tax_b755da65
  params:
    current_window_months: 12
    prior_window_months: 24
    installments_per_year: 2
    restoration_allowance_pct: 6.0
    exemption_assessed_value: 7000.0
    exemption_levy_pct: 1.1
    exemption_review_share: 0.5
    inspection_window_months: 12
    standard_increase_pct: 2.0
  rule: 'This rule sets the annual property tax held on a Summit Tax and Insurance Reserve, called here the projected annual property tax, whenever the property tax bills on file are reviewed. For a Summit Tax and Insurance Reserve, and only for such a reserve, the annual property tax held on file is the projected annual property tax worked out below rather than the sum of the current tax year''s installment bills; the annual property tax of every other set-aside remains under the base rule. The bills of the tax year are the property tax bills on file for the reserve that were received within the twelve months before the review. The bills of the previous tax year are the paid property tax bills received within the twenty-four months before the review less the paid property tax bills received within those twelve months. The tax year''s tax is the sum of the billed amounts of the tax year''s bills whose status is paid or received, withdrawn bills left out. The next tax year''s tax is the tax year''s tax increased by the assessment allowance percentage and then increased by the exemption allowance amount; the assessment allowance is the standard increase percentage and the exemption allowance is zero. The next-year share is the whole months from the due date of the paid property tax bill with the latest due date to the review date, divided by twelve, never below zero and never above one. The projected annual property tax is the tax year''s tax times one less the next-year share, plus the next tax year''s tax times the next-year share. The projected annual property tax is rounded half up to the cent once, at the end, and the review takes it from the most recently received property tax bill on file. Where at least one of the tax year''s bills is withdrawn and at least one is received and still unpaid, the corrected installment basis applies: the tax year''s tax is the billed amount of the most recently received unpaid property tax bill times the number of installments in a tax year. Where exactly one of the tax year''s bills is paid or received and none is withdrawn, the single installment basis applies: the tax year''s tax is that bill''s billed amount plus the previous tax year''s paid bills divided by the number of installments in a tax year. Otherwise the tax year''s tax is the sum of the billed amounts of the tax year''s paid and received bills. Where at least one of the tax year''s bills is withdrawn, at least one is received and unpaid, and the most recently received unpaid property tax bill is lower than the average billed amount of the tax year''s withdrawn bills, the assessment allowance is the restoration allowance, because a value lowered by a correction can be restored by the assessor the next year. Where none of the tax year''s bills is withdrawn, the previous tax year''s paid bills are more than zero, and the tax year''s paid and received bills sum to less than the previous tax year''s paid bills, the assessment allowance is zero, because a value already falling carries no increase. Otherwise the assessment allowance is the standard increase percentage. The exemption allowance prices the homeowners'' exemption the property can lose when it stops being the borrower''s principal residence; the full exemption allowance is the homeowners'' exemption assessed value times the exemption levy percentage. Where the occupancy profile of the reserve''s Summit loan shows non-occupancy confirmed and an occupancy inspection on that profile within the twelve months before the review found the home vacant or occupied by others, the exemption allowance is the full exemption allowance. Where that occupancy profile shows an overdue certification and an occupancy inspection was ordered on it within the twelve months before the review, the exemption allowance is the full exemption allowance times the exemption review share. Otherwise the exemption allowance is zero. Where the plan pays tax installments separately and at least two of the tax year''s bills are paid or received, the installment count basis applies: the next-year share is the number of the tax year''s paid bills divided by the number of installments in a tax year, because each installment the reserve has already paid is followed within the coming twelve months by the next tax year''s matching installment. Where the plan pays tax installments separately and exactly one of the tax year''s bills is paid or received, the annual block basis applies: the next-year share is one when the due date of the most recently received property tax bill is on or before the review date, and zero otherwise. Otherwise the next-year share is counted in months from the latest-due paid bill as stated above.'
  prerequisite: []
  cross_category:
  - category: residency
    as: branch
    reads:
    - status
    - residency_profile_id
    - residency_events.event_type
    - residency_events.inspection_outcome
    note: The exemption allowance tier is decided from the occupancy profile of the reserve's Summit loan and the inspections logged on it.
  compute:
  - yr_paid_amt: SUM('setaside_requests', 'billed_amount', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='paid')
  - yr_paid_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='paid')
  - yr_open_amt: SUM('setaside_requests', 'billed_amount', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='received')
  - yr_open_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='received')
  - prior_paid_amt: SUM('setaside_requests', 'billed_amount', within_months=K('prior_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='paid') - yr_paid_amt
  - open_inst_amt: LATEST('setaside_requests', 'billed_amount', date_field='request_date', request_type='property_tax_bill', request_status='received')
  - basis_wd_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='withdrawn')
  - year_tax: open_inst_amt * K('installments_per_year') if (basis_wd_n >= 1 and yr_open_n >= 1) else ((yr_paid_amt + yr_open_amt) + prior_paid_amt / K('installments_per_year') if (yr_paid_n + yr_open_n == 1 and basis_wd_n == 0) else yr_paid_amt + yr_open_amt)
  - assess_wd_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='withdrawn')
  - assess_wd_amt: SUM('setaside_requests', 'billed_amount', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='withdrawn')
  - assess_pct: K('restoration_allowance_pct') if (assess_wd_n >= 1 and yr_open_n >= 1 and open_inst_amt < assess_wd_amt / assess_wd_n) else (0 if (assess_wd_n == 0 and prior_paid_amt > 0 and yr_paid_amt + yr_open_amt < prior_paid_amt) else K('standard_increase_pct'))
  - occ_status: CFIELD('residency', 'status', jumbo_loan_id=F('jumbo_loan_id'))
  - occ_pid: CFIELD('residency', 'residency_profile_id', jumbo_loan_id=F('jumbo_loan_id'))
  - occ_found_n: XCOUNT('residency', 'residency_events', within_months=K('inspection_window_months'), date_field='effective_date', residency_profile_id=occ_pid, event_type='residency_inspection_result', inspection_outcome='vacant') + XCOUNT('residency', 'residency_events', within_months=K('inspection_window_months'), date_field='effective_date', residency_profile_id=occ_pid, event_type='residency_inspection_result', inspection_outcome='occupied_by_others')
  - occ_ordered_n: XCOUNT('residency', 'residency_events', within_months=K('inspection_window_months'), date_field='effective_date', residency_profile_id=occ_pid, event_type='residency_inspection_ordered')
  - exempt_amt: K('exemption_assessed_value') * K('exemption_levy_pct') / 100 if (occ_status == 'nonoccupancy_confirmed' and occ_found_n >= 1) else (K('exemption_assessed_value') * K('exemption_levy_pct') / 100 * K('exemption_review_share') if (occ_status == 'overdue' and occ_ordered_n >= 1) else 0)
  - span_paid_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='paid')
  - span_last_due: LATEST('setaside_requests', 'due_date', date_field='request_date', request_type='property_tax_bill')
  - span_paid_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='property_tax_bill', request_status='paid')
  - span_share: span_paid_n / K('installments_per_year') if (P('pays_installments_separately') and yr_paid_n + yr_open_n >= 2) else ((1 if (span_last_due and DAYS(span_last_due, NOW) >= 0) else 0) if (P('pays_installments_separately') and yr_paid_n + yr_open_n == 1) else (MN(1, MX(0, MONTHS(span_paid_due, NOW) / 12)) if span_paid_due else 0))
  - next_year_tax: year_tax * (1 + assess_pct / 100) + exempt_amt
  - result: RND(year_tax * (1 - span_share) + next_year_tax * span_share, 2)
  compute_basis:
    yr_paid_amt: The bills of the tax year are the property tax bills on file for the reserve that were received within the twelve months before the review.
    yr_paid_n: The bills of the tax year are the property tax bills on file for the reserve that were received within the twelve months before the review.
    yr_open_amt: The bills of the tax year are the property tax bills on file for the reserve that were received within the twelve months before the review.
    yr_open_n: The bills of the tax year are the property tax bills on file for the reserve that were received within the twelve months before the review.
    prior_paid_amt: The bills of the previous tax year are the paid property tax bills received within the twenty-four months before the review less the paid property tax bills received within those twelve months.
    open_inst_amt: the tax year's tax is the billed amount of the most recently received unpaid property tax bill times the number of installments in a tax year.
    basis_wd_n: Where at least one of the tax year's bills is withdrawn and at least one is received and still unpaid, the corrected installment basis applies
    year_tax: 'Where at least one of the tax year''s bills is withdrawn and at least one is received and still unpaid, the corrected installment basis applies: the tax year''s tax is the billed amount of the most recently received unpaid property tax bill times the number of installments in a tax year. Where exactly one of the tax year''s bills is paid or received and none is withdrawn, the single installment basis applies: the tax year''s tax is that bill''s billed amount plus the previous tax year''s paid bills divided by the number of installments in a tax year. Otherwise the tax year''s tax is the sum of the billed amounts of the tax year''s paid and received bills.'
    assess_wd_n: Where at least one of the tax year's bills is withdrawn, at least one is received and unpaid, and the most recently received unpaid property tax bill is lower than the average billed amount of the tax year's withdrawn bills
    assess_wd_amt: the most recently received unpaid property tax bill is lower than the average billed amount of the tax year's withdrawn bills
    assess_pct: Where at least one of the tax year's bills is withdrawn, at least one is received and unpaid, and the most recently received unpaid property tax bill is lower than the average billed amount of the tax year's withdrawn bills, the assessment allowance is the restoration allowance, because a value lowered by a correction can be restored by the assessor the next year. Where none of the tax year's bills is withdrawn, the previous tax year's paid bills are more than zero, and the tax year's paid and received bills sum to less than the previous tax year's paid bills, the assessment allowance is zero, because a value already falling carries no increase. Otherwise the assessment allowance is the standard increase percentage.
    occ_status: Where the occupancy profile of the reserve's Summit loan shows non-occupancy confirmed
    occ_pid: an occupancy inspection on that profile within the twelve months before the review found the home vacant or occupied by others
    occ_found_n: an occupancy inspection on that profile within the twelve months before the review found the home vacant or occupied by others
    occ_ordered_n: Where that occupancy profile shows an overdue certification and an occupancy inspection was ordered on it within the twelve months before the review
    exempt_amt: the full exemption allowance is the homeowners' exemption assessed value times the exemption levy percentage. Where the occupancy profile of the reserve's Summit loan shows non-occupancy confirmed and an occupancy inspection on that profile within the twelve months before the review found the home vacant or occupied by others, the exemption allowance is the full exemption allowance. Where that occupancy profile shows an overdue certification and an occupancy inspection was ordered on it within the twelve months before the review, the exemption allowance is the full exemption allowance times the exemption review share. Otherwise the exemption allowance is zero.
    span_paid_n: the next-year share is the number of the tax year's paid bills divided by the number of installments in a tax year
    span_last_due: the next-year share is one when the due date of the most recently received property tax bill is on or before the review date, and zero otherwise
    span_share: 'Where the plan pays tax installments separately and at least two of the tax year''s bills are paid or received, the installment count basis applies: the next-year share is the number of the tax year''s paid bills divided by the number of installments in a tax year, because each installment the reserve has already paid is followed within the coming twelve months by the next tax year''s matching installment. Where the plan pays tax installments separately and exactly one of the tax year''s bills is paid or received, the annual block basis applies: the next-year share is one when the due date of the most recently received property tax bill is on or before the review date, and zero otherwise. Otherwise the next-year share is counted in months from the latest-due paid bill as stated above.'
    next_year_tax: The next tax year's tax is the tax year's tax increased by the assessment allowance percentage and then increased by the exemption allowance amount; the assessment allowance is the standard increase percentage and the exemption allowance is zero.
    result: The projected annual property tax is the tax year's tax times one less the next-year share, plus the next tax year's tax times the next-year share. The projected annual property tax is rounded half up to the cent once, at the end, and the review takes it from the most recently received property tax bill on file.
    span_paid_due: The next-year share is the whole months from the due date of the paid property tax bill with the latest due date to the review date, divided by twelve, never below zero and never above one.
  factors:
  - id: tu_basis
    effect: method
    decides: year_tax
    bindings:
    - basis_wd_n
    - year_tax
    ladder:
    - when: at least one of the tax year's property tax bills is withdrawn and at least one is received and still unpaid
      method: 'corrected installment basis: the billed amount of the most recently received unpaid property tax bill times the number of installments in a tax year'
    - when: exactly one of the tax year's property tax bills is paid or received and none is withdrawn
      method: 'single installment basis: that bill''s billed amount plus the previous tax year''s paid bills divided by the number of installments in a tax year'
    - when: otherwise
      method: the sum of the billed amounts of the tax year's paid and received bills
    baseline:
      year_tax: yr_paid_amt + yr_open_amt
    evidence:
    - history
    cross_difficulty: null
  - id: tu_assess
    effect: parameter
    decides: assess_pct
    bindings:
    - assess_wd_n
    - assess_wd_amt
    - assess_pct
    ladder:
    - when: a tax year's bill is withdrawn, one is received and unpaid, and the most recently received unpaid bill is lower than the average of the withdrawn bills
      value: K('restoration_allowance_pct')
    - when: no tax year's bill is withdrawn, the previous tax year's paid bills are more than zero, and the tax year's paid and received bills sum to less than them
      value: '0'
    - when: otherwise
      value: K('standard_increase_pct')
    baseline:
      assess_pct: K('standard_increase_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: tu_exempt
    effect: parameter
    decides: exempt_amt
    bindings:
    - occ_status
    - occ_pid
    - occ_found_n
    - occ_ordered_n
    - exempt_amt
    ladder:
    - when: the occupancy profile shows non-occupancy confirmed and an occupancy inspection within twelve months found the home vacant or occupied by others
      value: K('exemption_assessed_value') * K('exemption_levy_pct') / 100
    - when: the occupancy profile shows an overdue certification and an occupancy inspection was ordered within twelve months
      value: K('exemption_assessed_value') * K('exemption_levy_pct') / 100 * K('exemption_review_share')
    - when: otherwise
      value: '0'
    baseline:
      exempt_amt: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: residency
  - id: tu_span
    effect: method
    decides: span_share
    bindings:
    - span_paid_n
    - span_last_due
    - span_paid_due
    - span_share
    ladder:
    - when: the plan pays tax installments separately and at least two of the tax year's bills are paid or received
      method: 'installment count basis: the number of the tax year''s paid bills divided by the number of installments in a tax year'
    - when: the plan pays tax installments separately and exactly one of the tax year's bills is paid or received
      method: 'annual block basis: one when the most recently received bill''s due date has arrived, zero before'
    - when: otherwise
      method: 'month basis: whole months from the latest-due paid bill''s due date to the review, divided by twelve, between zero and one'
    baseline:
      span_share: MN(1, MX(0, MONTHS(span_paid_due, NOW) / 12)) if span_paid_due else 0
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: The bills of the tax year are the property tax bills on file for the reserve that were received within the twelve months before the review. The tax year's tax is the sum of the billed amounts of the tax year's bills whose status is paid or received, withdrawn bills left out. The next tax year's tax is the tax year's tax increased by the assessment allowance percentage and then increased by the exemption allowance amount; the assessment allowance is the standard increase percentage and the exemption allowance is zero. The next-year share is the whole months from the due date of the paid property tax bill with the latest due date to the review date, divided by twelve, never below zero and never above one. The projected annual property tax is the tax year's tax times one less the next-year share, plus the next tax year's tax times the next-year share. The projected annual property tax is rounded half up to the cent once, at the end, and the review takes it from the most recently received property tax bill on file.
    params:
    - current_window_months
    - standard_increase_pct
  inputs:
    history:
    - table: setaside_requests
      aggregate: sum
      field: billed_amount
      within_months: 12
      filters:
        request_type: property_tax_bill
        request_status: paid
    - table: setaside_requests
      aggregate: sum
      field: billed_amount
      within_months: 12
      filters:
        request_type: property_tax_bill
        request_status: received
    - table: setaside_requests
      aggregate: count
      field: setaside_request_id
      within_months: 12
      filters:
        request_type: property_tax_bill
        request_status: withdrawn
    - table: setaside_requests
      aggregate: sum
      field: billed_amount
      within_months: 24
      filters:
        request_type: property_tax_bill
        request_status: paid
    - category: residency
      table: residency_events
      aggregate: count
      field: residency_event_id
      within_months: 12
      filters:
        event_type: residency_inspection_result
    cross_category:
    - residency
- id: setaside_ext_returned_tax_refund
  base_policy_refs:
  - setaside_evt_refund
  overwrite:
  - base_policy: setaside_evt_refund
    superseded_clause: the refunded amount is credited back to the set-aside per refund_credit_target
    replaced_by: For a property tax refund that a taxing authority mailed to the borrower and that the borrower pays back into a Summit Tax and Insurance Reserve, and only for such a refund, the reserve is credited with the kept amount of a returned property tax refund rather than the whole refunded amount; a returned hazard or flood insurance premium is settled by the rule written for it, and every other refund is credited under the base rule.
  trigger: on_request
  subject:
  - setaside_refund_credit
  computes: credit_amount
  target_tool: return_tax_refund_0b9f20b8
  params:
    current_window_months: 12
    installments_per_year: 2
    insurance_window_months: 12
    inspection_window_months: 12
    absence_months_min: 6
    cushion_months_vacant: 2
    cushion_months_absence: 1
    floor_standard: 50.0
    floor_leaving: 0.0
    floor_retaining: 25.0
    advance_window_months: 24
    fee_window_months: 12
    retention_share_full: 1.0
    retention_share_half: 0.5
  rule: 'This rule works out the kept amount of a returned property tax refund: the part of a property tax refund that a taxing authority mailed to the borrower, for an installment a Summit Tax and Insurance Reserve paid and a corrected bill later lowered, that the borrower pays back into the reserve. For a property tax refund that a taxing authority mailed to the borrower and that the borrower pays back into a Summit Tax and Insurance Reserve, and only for such a refund, the reserve is credited with the kept amount of a returned property tax refund rather than the whole refunded amount; a returned hazard or flood insurance premium is settled by the rule written for it, and every other refund is credited under the base rule. The credit references the reserve''s payment of the overpaid installment, and where more than one paid installment of the tax year is overpaid, the reserve''s payment of the paid property tax bill with the latest due date; it is dated the handling date. The kept amount of a returned property tax refund is not worked out until the annual property tax on file has been reviewed against every property tax bill received since it was last set. The tax year''s bills are the property tax bills on file for the reserve received within the twelve months before the handling date. Where at least one of the tax year''s bills is withdrawn and at least one is received and unpaid, the refund restores an overpayment equal to the billed amounts of the tax year''s paid bills less the billed amount of the most recently received unpaid property tax bill times the number of those paid bills, never below zero, because the corrected installments of a tax year are equal; otherwise there is no overpayment to restore. The reserve period left is the plan''s reserve months less the whole months from the reserve''s established date to the handling date, never below zero, and the horizon of the refund review is that many whole months. The tax part of the reserve''s need is the annual property tax on file times the horizon months divided by twelve. The insurance part of the reserve''s need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve. The reserve''s need is the tax part plus the insurance part plus the cushion, and the cushion is zero. The room is the reserve''s need less the reserve balance, never below zero, and the excess is the overpayment less the room, never below zero. An excess above zero that is at least the standard release floor is released to the borrower, and a smaller excess stays in the reserve. The borrower keeps the whole released excess. The kept amount of a returned property tax refund is the overpayment less the part of the released excess the borrower keeps, rounded half up to the cent once, at the end. Where the reserve''s Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the refund review is the reserve period left. Where the plan pays tax installments separately and at least two of the tax year''s bills are paid or received, the tax part of the reserve''s need is counted in half-year blocks: each started half-year of the horizon carries one installment of the annual property tax on file divided by the number of installments in a tax year. Where the plan pays tax installments separately and exactly one of the tax year''s bills is paid or received, the tax part is counted in year blocks: each started year of the horizon carries the whole annual property tax on file. Otherwise the tax part is prorated over the horizon months. Where exactly one hazard insurance payment was made from the reserve within the twelve months before the handling date, the insurance part is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the most recent paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the most recent paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more hazard insurance payments were made from the reserve within those twelve months, the insurance part is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part is prorated over the horizon months. A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve. Where the occupancy profile of the reserve''s Summit loan shows non-occupancy confirmed and an occupancy inspection on that profile within the twelve months before the handling date found the home vacant or occupied by others, the cushion is the vacant-home cushion months times a month of charges. Where that occupancy profile shows a health-care absence under monitoring whose absence start date is at least the minimum absence months before the handling date, the cushion is the absence cushion months times a month of charges. Otherwise the cushion is zero. Where the loan''s maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the release floor is the leaving-home release floor. Where that case records an intent to retain the property, the release floor is the retaining release floor. Otherwise the release floor is the standard release floor. Where the Summit loan''s ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of the released excess. Otherwise the reserve keeps none of it. The borrower keeps the released excess times one less the reserve''s retention share.'
  prerequisite:
  - problem: setaside_ext_reserve_tax_projection
    kind: value_input
    gate: tax_on_file
    form: action
    policy_source: The kept amount of a returned property tax refund is not worked out until the annual property tax on file has been reviewed against every property tax bill received since it was last set.
    fallback_reason: 'The review leaves nothing on the reserve but a changed annual property tax figure: the reserve record carries no review date and no link to the bill the review relied on, so no record-visible state shows that the review against the latest property tax bill has happened; the sentence therefore names the review itself.'
    condition: The reserve's annual property tax equals the projected annual property tax worked out from the property tax bills on file, including any corrected bill received after the figure was last set.
    resolved_by: update_reserve_tax_b755da65
    effect: The annual property tax on file, read into the tax part of the reserve's need and into a month of charges, changes from the figure set from the superseded bills to the projected annual property tax, which changes the room and the kept amount.
  cross_category:
  - category: maturity
    as: branch
    reads:
    - status
    - resolution_deadline
    - successor_intent
    note: The horizon of the refund review and the release floor are decided from the due-and-payable maturity case on the reserve's Summit loan.
  - category: payoff
    as: branch
    reads:
    - status
    - statement_good_through_date
    note: Where no due-and-payable maturity case exists, a payoff case with terms issued or accepted ends the horizon at its good-through date.
  - category: residency
    as: branch
    reads:
    - status
    - residency_profile_id
    - absence_start_date
    - residency_events.event_type
    - residency_events.inspection_outcome
    note: The cushion tier is decided from the occupancy profile of the reserve's Summit loan and the inspections logged on it.
  - category: jumbo
    as: history
    reads:
    - jumbo_transactions.event_type
    - jumbo_transactions.advance_type
    - jumbo_transactions.effective_date
    note: The retention share is decided from the advances posted to the Summit loan's ledger.
  compute:
  - tax_on_file: F('annual_property_tax')
  - haz_on_file: F('annual_hazard_premium')
  - flood_on_file: F('annual_flood_premium')
  - reserve_balance: F('setaside_balance')
  - ref_paid_amt: SUM('setaside_requests', 'billed_amount', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='paid')
  - ref_paid_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='paid')
  - ref_open_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='received')
  - ref_wd_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='withdrawn')
  - ref_open_amt: LATEST('setaside_requests', 'billed_amount', date_field='request_date', request_type='property_tax_bill', request_status='received')
  - overpay: MX(0, ref_paid_amt - ref_open_amt * ref_paid_n) if (ref_wd_n >= 1 and ref_open_n >= 1) else 0
  - reserve_left: MX(0, P('reserve_months_of_charges') - MONTHS(F('established_date'), NOW))
  - hz_dp_deadline: CFIELD('maturity', 'resolution_deadline', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - hz_ext_deadline: CFIELD('maturity', 'resolution_deadline', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - hz_terms_gt: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='terms_issued')
  - hz_accepted_gt: CFIELD('payoff', 'statement_good_through_date', jumbo_loan_id=F('jumbo_loan_id'), status='accepted')
  - horizon_m: MX(0, MONTHS(NOW, hz_dp_deadline or hz_ext_deadline)) if (hz_dp_deadline or hz_ext_deadline) else (MX(0, MONTHS(NOW, hz_terms_gt or hz_accepted_gt)) if (hz_terms_gt or hz_accepted_gt) else reserve_left)
  - tn_paid_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='paid')
  - tn_open_n: COUNT('setaside_requests', within_months=K('current_window_months'), date_field='request_date', request_type='property_tax_bill', request_status='received')
  - tax_mode: 1 if (P('pays_installments_separately') and tn_paid_n + tn_open_n >= 2) else (2 if (P('pays_installments_separately') and tn_paid_n + tn_open_n == 1) else 0)
  - in_haz_paid_n: COUNT('setaside_transactions', within_months=K('insurance_window_months'), date_field='effective_date', event_type='setaside_insurance_disbursement', coverage_type='hazard')
  - ins_mode: 1 if in_haz_paid_n == 1 else (3 if in_haz_paid_n >= 2 else 0)
  - haz_last_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='hazard_insurance_bill', request_status='paid')
  - flood_last_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='flood_insurance_bill', request_status='paid')
  - cu_status: CFIELD('residency', 'status', jumbo_loan_id=F('jumbo_loan_id'))
  - cu_pid: CFIELD('residency', 'residency_profile_id', jumbo_loan_id=F('jumbo_loan_id'))
  - cu_found_n: XCOUNT('residency', 'residency_events', within_months=K('inspection_window_months'), date_field='effective_date', residency_profile_id=cu_pid, event_type='residency_inspection_result', inspection_outcome='vacant') + XCOUNT('residency', 'residency_events', within_months=K('inspection_window_months'), date_field='effective_date', residency_profile_id=cu_pid, event_type='residency_inspection_result', inspection_outcome='occupied_by_others')
  - cu_absence_start: CFIELD('residency', 'absence_start_date', jumbo_loan_id=F('jumbo_loan_id'))
  - cushion_m: K('cushion_months_vacant') if (cu_status == 'nonoccupancy_confirmed' and cu_found_n >= 1) else (K('cushion_months_absence') if (cu_status == 'absence_monitoring' and cu_absence_start and MONTHS(cu_absence_start, NOW) >= K('absence_months_min')) else 0)
  - fl_dp_intent: CFIELD('maturity', 'successor_intent', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - fl_ext_intent: CFIELD('maturity', 'successor_intent', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - release_floor: K('floor_leaving') if ((fl_dp_intent or fl_ext_intent) == 'sell_property' or (fl_dp_intent or fl_ext_intent) == 'deed_in_lieu') else (K('floor_retaining') if (fl_dp_intent or fl_ext_intent) == 'retain_property' else K('floor_standard'))
  - rt_charge_adv_n: XCOUNT('jumbo', 'jumbo_transactions', within_months=K('advance_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='corporate_advance_property_tax') + XCOUNT('jumbo', 'jumbo_transactions', within_months=K('advance_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='corporate_advance_insurance')
  - rt_fee_n: XCOUNT('jumbo', 'jumbo_transactions', within_months=K('fee_window_months'), date_field='effective_date', event_type='jumbo_advance_posting', advance_type='inspection_fee')
  - retain_share: K('retention_share_full') if rt_charge_adv_n >= 1 else (K('retention_share_half') if (rt_charge_adv_n == 0 and rt_fee_n >= 1) else 0)
  - tax_need: int((horizon_m + 5) / 6) * tax_on_file / K('installments_per_year') if tax_mode == 1 else (int((horizon_m + 11) / 12) * tax_on_file if tax_mode == 2 else tax_on_file * horizon_m / 12)
  - ins_need: ((haz_on_file if (haz_last_due and MONTHS(NOW, haz_last_due) + 12 < horizon_m) else 0) + (flood_on_file if (flood_last_due and MONTHS(NOW, flood_last_due) + 12 < horizon_m) else 0)) if ins_mode == 1 else (int((horizon_m + 2) / 3) * (haz_on_file + flood_on_file) / 4 if ins_mode == 3 else (haz_on_file + flood_on_file) * horizon_m / 12)
  - month_charges: (tax_on_file + haz_on_file + flood_on_file) / 12
  - cushion_amt: cushion_m * month_charges
  - need: tax_need + ins_need + cushion_amt
  - room: MX(0, need - reserve_balance)
  - excess: MX(0, overpay - room)
  - released: excess if (excess > 0 and excess >= release_floor) else 0
  - result: RND(overpay - released * (1 - retain_share), 2)
  compute_basis:
    tax_on_file: The tax part of the reserve's need is the annual property tax on file times the horizon months divided by twelve.
    haz_on_file: The insurance part of the reserve's need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve.
    flood_on_file: The insurance part of the reserve's need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve.
    reserve_balance: The room is the reserve's need less the reserve balance, never below zero
    ref_paid_amt: The tax year's bills are the property tax bills on file for the reserve received within the twelve months before the handling date.
    ref_paid_n: the billed amounts of the tax year's paid bills less the billed amount of the most recently received unpaid property tax bill times the number of those paid bills
    ref_open_n: Where at least one of the tax year's bills is withdrawn and at least one is received and unpaid
    ref_wd_n: Where at least one of the tax year's bills is withdrawn and at least one is received and unpaid
    ref_open_amt: the billed amount of the most recently received unpaid property tax bill
    overpay: Where at least one of the tax year's bills is withdrawn and at least one is received and unpaid, the refund restores an overpayment equal to the billed amounts of the tax year's paid bills less the billed amount of the most recently received unpaid property tax bill times the number of those paid bills, never below zero, because the corrected installments of a tax year are equal; otherwise there is no overpayment to restore.
    reserve_left: The reserve period left is the plan's reserve months less the whole months from the reserve's established date to the handling date, never below zero, and the horizon of the refund review is that many whole months.
    hz_dp_deadline: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline
    hz_ext_deadline: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline
    hz_terms_gt: a payoff case on the loan has terms issued or accepted and carries a statement good-through date
    hz_accepted_gt: a payoff case on the loan has terms issued or accepted and carries a statement good-through date
    horizon_m: Where the reserve's Summit loan has a maturity case that is due and payable, or in its extension period, and that case carries a resolution deadline, the horizon of the refund review is the whole months from the handling date to that resolution deadline, never below zero. Where it has no such maturity case and a payoff case on the loan has terms issued or accepted and carries a statement good-through date, the horizon of the refund review is the whole months from the handling date to that good-through date, never below zero. Otherwise the horizon of the refund review is the reserve period left.
    tn_paid_n: Where the plan pays tax installments separately and at least two of the tax year's bills are paid or received
    tn_open_n: Where the plan pays tax installments separately and at least two of the tax year's bills are paid or received
    tax_mode: 'Where the plan pays tax installments separately and at least two of the tax year''s bills are paid or received, the tax part of the reserve''s need is counted in half-year blocks: each started half-year of the horizon carries one installment of the annual property tax on file divided by the number of installments in a tax year. Where the plan pays tax installments separately and exactly one of the tax year''s bills is paid or received, the tax part is counted in year blocks: each started year of the horizon carries the whole annual property tax on file. Otherwise the tax part is prorated over the horizon months.'
    in_haz_paid_n: Where exactly one hazard insurance payment was made from the reserve within the twelve months before the handling date
    ins_mode: 'Where exactly one hazard insurance payment was made from the reserve within the twelve months before the handling date, the insurance part is counted on renewal dates: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the most recent paid hazard insurance bill, is fewer whole months from the handling date than the horizon months, and the annual flood premium on file counts in full only when the next flood renewal, one year after the due date of the most recent paid flood insurance bill, is fewer whole months away than the horizon months. Where two or more hazard insurance payments were made from the reserve within those twelve months, the insurance part is counted in quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file. Otherwise the insurance part is prorated over the horizon months.'
    haz_last_due: the next hazard renewal, one year after the due date of the most recent paid hazard insurance bill
    flood_last_due: the next flood renewal, one year after the due date of the most recent paid flood insurance bill
    cu_status: Where the occupancy profile of the reserve's Summit loan shows non-occupancy confirmed
    cu_pid: an occupancy inspection on that profile within the twelve months before the handling date found the home vacant or occupied by others
    cu_found_n: an occupancy inspection on that profile within the twelve months before the handling date found the home vacant or occupied by others
    cu_absence_start: Where that occupancy profile shows a health-care absence under monitoring whose absence start date is at least the minimum absence months before the handling date
    cushion_m: Where the occupancy profile of the reserve's Summit loan shows non-occupancy confirmed and an occupancy inspection on that profile within the twelve months before the handling date found the home vacant or occupied by others, the cushion is the vacant-home cushion months times a month of charges. Where that occupancy profile shows a health-care absence under monitoring whose absence start date is at least the minimum absence months before the handling date, the cushion is the absence cushion months times a month of charges. Otherwise the cushion is zero.
    fl_dp_intent: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu
    fl_ext_intent: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu
    release_floor: Where the loan's maturity case that is due and payable or in its extension period records an intent to sell the property or to give a deed in lieu, the release floor is the leaving-home release floor. Where that case records an intent to retain the property, the release floor is the retaining release floor. Otherwise the release floor is the standard release floor.
    rt_charge_adv_n: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date
    rt_fee_n: Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date
    retain_share: Where the Summit loan's ledger shows a corporate advance for property tax or for insurance posted within the twenty-four months before the handling date, the reserve keeps the full retention share of the released excess. Where it shows no such advance but shows an occupancy inspection fee posted within the twelve months before the handling date, the reserve keeps the half retention share of the released excess. Otherwise the reserve keeps none of it.
    tax_need: each started half-year of the horizon carries one installment of the annual property tax on file divided by the number of installments in a tax year
    ins_need: the annual hazard premium on file counts in full only when the next hazard renewal, one year after the due date of the most recent paid hazard insurance bill, is fewer whole months from the handling date than the horizon months
    month_charges: A month of charges is the annual property tax plus the annual hazard premium plus the annual flood premium on file, divided by twelve.
    cushion_amt: the cushion is the vacant-home cushion months times a month of charges
    need: The reserve's need is the tax part plus the insurance part plus the cushion
    room: The room is the reserve's need less the reserve balance, never below zero
    excess: the excess is the overpayment less the room, never below zero.
    released: An excess above zero that is at least the standard release floor is released to the borrower, and a smaller excess stays in the reserve.
    result: The kept amount of a returned property tax refund is the overpayment less the part of the released excess the borrower keeps, rounded half up to the cent once, at the end.
  factors:
  - id: tr_horizon
    effect: method
    decides: horizon_m
    bindings:
    - hz_dp_deadline
    - hz_ext_deadline
    - hz_terms_gt
    - hz_accepted_gt
    - horizon_m
    ladder:
    - when: the Summit loan has a maturity case that is due and payable or in its extension period and carries a resolution deadline
      method: the horizon runs from the handling date to the maturity case's resolution deadline, in whole months
    - when: no such maturity case, and a payoff case with terms issued or accepted carries a statement good-through date
      method: the horizon runs from the handling date to the payoff statement's good-through date, in whole months
    - when: otherwise
      method: 'the horizon is the reserve period left: the plan''s reserve months less the whole months since the reserve was established'
    baseline:
      horizon_m: reserve_left
    evidence:
    - cross_category
    - date
    cross_difficulty: maturity
  - id: tr_taxneed
    effect: method
    decides: tax_mode
    bindings:
    - tn_paid_n
    - tn_open_n
    - tax_mode
    ladder:
    - when: the plan pays tax installments separately and at least two of the tax year's bills are paid or received
      method: 'half-year blocks: each started half-year of the horizon carries one installment of the annual property tax on file'
    - when: the plan pays tax installments separately and exactly one of the tax year's bills is paid or received
      method: 'year blocks: each started year of the horizon carries the whole annual property tax on file'
    - when: otherwise
      method: 'prorated: the annual property tax on file times the horizon months divided by twelve'
    baseline:
      tax_mode: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: tr_insneed
    effect: method
    decides: ins_mode
    bindings:
    - in_haz_paid_n
    - ins_mode
    ladder:
    - when: exactly one hazard insurance payment from the reserve within the twelve months
      method: 'renewal dates: each premium on file counts in full only when its next renewal falls fewer whole months away than the horizon'
    - when: two or more hazard insurance payments from the reserve within the twelve months
      method: 'quarter blocks: each started quarter of the horizon carries a quarter of the annual hazard and flood premiums on file'
    - when: otherwise
      method: 'prorated: the annual hazard and flood premiums on file times the horizon months divided by twelve'
    baseline:
      ins_mode: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: tr_cushion
    effect: parameter
    decides: cushion_m
    bindings:
    - cu_status
    - cu_pid
    - cu_found_n
    - cu_absence_start
    - cushion_m
    ladder:
    - when: the occupancy profile shows non-occupancy confirmed and an inspection within twelve months found the home vacant or occupied by others
      value: K('cushion_months_vacant')
    - when: the occupancy profile shows a health-care absence under monitoring that started at least the minimum absence months ago
      value: K('cushion_months_absence')
    - when: otherwise
      value: '0'
    baseline:
      cushion_m: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: residency
  - id: tr_floor
    effect: parameter
    decides: release_floor
    bindings:
    - fl_dp_intent
    - fl_ext_intent
    - release_floor
    ladder:
    - when: the due-and-payable or extension-period maturity case records an intent to sell the property or to give a deed in lieu
      value: K('floor_leaving')
    - when: that maturity case records an intent to retain the property
      value: K('floor_retaining')
    - when: otherwise
      value: K('floor_standard')
    baseline:
      release_floor: K('floor_standard')
    evidence:
    - cross_category
    cross_difficulty: maturity
  - id: tr_retain
    effect: parameter
    decides: retain_share
    bindings:
    - rt_charge_adv_n
    - rt_fee_n
    - retain_share
    ladder:
    - when: a corporate advance for property tax or insurance was posted to the Summit loan within twenty-four months
      value: K('retention_share_full')
    - when: no such advance, and an occupancy inspection fee was posted to the Summit loan within twelve months
      value: K('retention_share_half')
    - when: otherwise
      value: '0'
    baseline:
      retain_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  baseline:
    rule: The tax year's bills are the property tax bills on file for the reserve received within the twelve months before the handling date. Where at least one of the tax year's bills is withdrawn and at least one is received and unpaid, the refund restores an overpayment equal to the billed amounts of the tax year's paid bills less the billed amount of the most recently received unpaid property tax bill times the number of those paid bills, never below zero, because the corrected installments of a tax year are equal; otherwise there is no overpayment to restore. The reserve period left is the plan's reserve months less the whole months from the reserve's established date to the handling date, never below zero, and the horizon of the refund review is that many whole months. The tax part of the reserve's need is the annual property tax on file times the horizon months divided by twelve. The insurance part of the reserve's need is the annual hazard premium plus the annual flood premium on file, times the horizon months divided by twelve. The reserve's need is the tax part plus the insurance part plus the cushion, and the cushion is zero. The room is the reserve's need less the reserve balance, never below zero, and the excess is the overpayment less the room, never below zero. An excess above zero that is at least the standard release floor is released to the borrower, and a smaller excess stays in the reserve. The borrower keeps the whole released excess. The kept amount of a returned property tax refund is the overpayment less the part of the released excess the borrower keeps, rounded half up to the cent once, at the end.
    params:
    - current_window_months
    - installments_per_year
    - floor_standard
    - reserve_months_of_charges
  inputs:
    history:
    - table: setaside_requests
      aggregate: sum
      field: billed_amount
      within_months: 12
      filters:
        request_type: property_tax_bill
        request_status: paid
    - table: setaside_requests
      aggregate: count
      field: setaside_request_id
      within_months: 12
      filters:
        request_type: property_tax_bill
        request_status: withdrawn
    - table: setaside_transactions
      aggregate: count
      field: setaside_txn_id
      within_months: 12
      filters:
        event_type: setaside_insurance_disbursement
        coverage_type: hazard
    - category: residency
      table: residency_events
      aggregate: count
      field: residency_event_id
      within_months: 12
      filters:
        event_type: residency_inspection_result
    - category: jumbo
      table: jumbo_transactions
      aggregate: count
      field: jumbo_txn_id
      within_months: 24
      filters:
        event_type: jumbo_advance_posting
    cross_category:
    - maturity
    - payoff
    - residency
    - jumbo
- id: setaside_ext_reserve_hazard_projection
  base_policy_refs:
  - setaside_charge_review
  overwrite:
  - base_policy: setaside_charge_review
    superseded_clause: the annual hazard premium is the billed_amount of the current hazard policy term
    replaced_by: For a Summit Tax and Insurance Reserve, and only for such a reserve, the annual hazard premium held on file is the projected annual hazard premium worked out below rather than the billed amount of the current hazard policy term; the annual hazard premium of every other set-aside remains under the base rule.
  trigger: state_due
  subject:
  - setaside_charges_updated
  computes: annual_hazard_premium
  target_tool: update_reserve_hazard_5ea539e7
  params:
    review_window_months: 12
    change_threshold_pct: 10.0
    change_high_pct: 8.0
    change_low_pct: 4.0
    appraisal_currency_months: 6
    appraisal_threshold_pct: 10.0
    appraisal_high_pct: 6.0
    appraisal_low_pct: 3.0
    vacant_home_loading_pct: 10.0
    absence_loading_pct: 5.0
    quarterly_fee: 32.0
    semiannual_fee: 12.0
    standard_renewal_increase_pct: 4.0
    default_renewal_share: 0.5
  rule: 'This rule sets the annual hazard premium held on a Summit Tax and Insurance Reserve, called here the projected annual hazard premium, whenever the hazard insurance bills on file are reviewed. For a Summit Tax and Insurance Reserve, and only for such a reserve, the annual hazard premium held on file is the projected annual hazard premium worked out below rather than the billed amount of the current hazard policy term; the annual hazard premium of every other set-aside remains under the base rule. The hazard bills of the review are the hazard insurance bills on file for the reserve received within the twelve months before the review. The current hazard premium is the billed amount of the paid hazard insurance bill with the latest due date. The renewal hazard premium is the current hazard premium increased once by the hazard renewal loading, which is the standard renewal increase plus the hazard premium-change loading, the hazard occupancy loading and the hazard appraisal loading, all in percent, added together and applied once to the current hazard premium, not one after another; the hazard premium-change loading, the hazard occupancy loading and the hazard appraisal loading are each zero. The hazard pay-plan fee is zero. The hazard renewal share is one half. The projected annual hazard premium is the current hazard premium times one less the hazard renewal share, plus the renewal hazard premium times the hazard renewal share, plus the hazard pay-plan fee. The projected annual hazard premium is rounded half up to the cent once, at the end, and the review takes it from the hazard insurance bill on file with the latest due date. Where two or more of the hazard bills of the review are paid or received, the pay-plan basis applies: the current hazard premium is the sum of the billed amounts of those paid and received bills, because a policy billed in installments costs the sum of its installments. Where none of the hazard bills of the review is paid or received, the carry-forward basis applies: the current hazard premium is the annual hazard premium already on file. Otherwise the current hazard premium is the billed amount of the paid hazard insurance bill with the latest due date. Where at least one of the hazard bills of the review is withdrawn and the paid and received hazard bills of the review sum to more than the withdrawn hazard bills of the review increased by the premium-change threshold percentage, the hazard premium-change loading is the high premium-change loading. Where at least one is withdrawn and the paid and received hazard bills sum to more than the withdrawn hazard bills but not more than that threshold, the hazard premium-change loading is the low premium-change loading. Otherwise the hazard premium-change loading is zero. Where the occupancy profile of the reserve''s Summit loan is closed and the loan''s maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard occupancy loading is the vacant-home loading, because a home left empty after the last borrower''s death renews at unoccupied rates. Where the occupancy profile shows non-occupancy confirmed or a health-care absence under monitoring, the hazard occupancy loading is the absence loading. Otherwise the hazard occupancy loading is zero. Where the loan''s maturity case that is due and payable or in its extension period carries an appraisal dated fewer whole months before the review than the appraisal-currency months, and its appraised value exceeds the Summit loan''s appraised value at closing by more than the appraisal threshold percentage, the hazard appraisal loading is the high appraisal loading, because coverage must keep pace with the home''s value. Where it carries such an appraisal whose value exceeds the closing value by no more than that threshold, the hazard appraisal loading is the low appraisal loading. Otherwise the hazard appraisal loading is zero. Where four or more of the hazard bills of the review are paid or received, the hazard pay-plan fee is the quarterly pay-plan fee, and where two or three are, the semiannual pay-plan fee; otherwise it is zero. Where at least one of the hazard bills of the review is withdrawn, the replacement month basis applies: the hazard renewal share is the whole months from the due date of the latest paid hazard insurance bill to the review date, divided by twelve, never below zero and never above one, because a replacement policy renews on the anniversary of its own start. Where none is withdrawn and two or more of the hazard bills of the review are paid or received, the installment count basis applies: the hazard renewal share is the number of paid hazard bills of the review divided by the number of paid and received hazard bills of the review. Otherwise the hazard renewal share is one half.'
  prerequisite: []
  cross_category:
  - category: residency
    as: branch
    reads:
    - status
    note: The hazard occupancy-related loading is decided from the status of the occupancy profile of the reserve's Summit loan.
  - category: maturity
    as: branch
    reads:
    - variant_name
    - status
    - appraised_value
    - appraisal_date
    note: The death case status and the current case appraisal decide the hazard occupancy-related and appraisal loadings.
  - category: jumbo
    as: branch
    reads:
    - appraised_value_at_closing
    note: The closing appraisal is the base the case appraisal is compared with.
  compute:
  - pr_amt: SUM('setaside_requests', 'billed_amount', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='paid') + SUM('setaside_requests', 'billed_amount', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='received')
  - latest_paid_amt: LATEST('setaside_requests', 'billed_amount', date_field='due_date', request_type='hazard_insurance_bill', request_status='paid')
  - plan_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='paid') + COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='received')
  - cur_prem: pr_amt if plan_n >= 2 else (F('annual_hazard_premium') if plan_n == 0 else latest_paid_amt)
  - chg_wd_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='withdrawn')
  - chg_wd_amt: SUM('setaside_requests', 'billed_amount', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='withdrawn')
  - chg_pct: K('change_high_pct') if (chg_wd_n >= 1 and pr_amt > chg_wd_amt * (1 + K('change_threshold_pct') / 100)) else (K('change_low_pct') if (chg_wd_n >= 1 and pr_amt > chg_wd_amt) else 0)
  - occ_status: CFIELD('residency', 'status', jumbo_loan_id=F('jumbo_loan_id'))
  - occ_case_dp: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable')
  - occ_case_ext: CFIELD('maturity', 'variant_name', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - occ_pct: K('vacant_home_loading_pct') if (occ_status == 'closed' and (occ_case_dp or occ_case_ext) == 'Death of Last Surviving Borrower') else (K('absence_loading_pct') if (occ_status == 'nonoccupancy_confirmed' or occ_status == 'absence_monitoring') else 0)
  - ap_val: CFIELD('maturity', 'appraised_value', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable') or CFIELD('maturity', 'appraised_value', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - ap_date: CFIELD('maturity', 'appraisal_date', jumbo_loan_id=F('jumbo_loan_id'), status='due_and_payable') or CFIELD('maturity', 'appraisal_date', jumbo_loan_id=F('jumbo_loan_id'), status='extension_period')
  - ap_close: CFIELD('jumbo', 'appraised_value_at_closing', jumbo_loan_id=F('jumbo_loan_id'))
  - appr_pct: K('appraisal_high_pct') if (ap_val and ap_date and ap_close and MONTHS(ap_date, NOW) < K('appraisal_currency_months') and ap_val > ap_close * (1 + K('appraisal_threshold_pct') / 100)) else (K('appraisal_low_pct') if (ap_val and ap_date and ap_close and MONTHS(ap_date, NOW) < K('appraisal_currency_months') and ap_val > ap_close) else 0)
  - fee_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='paid') + COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='received')
  - fee_amt: K('quarterly_fee') if fee_n >= 4 else (K('semiannual_fee') if fee_n >= 2 else 0)
  - sp_wd_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='withdrawn')
  - sp_paid_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='paid')
  - sp_pr_n: COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='paid') + COUNT('setaside_requests', within_months=K('review_window_months'), date_field='request_date', request_type='hazard_insurance_bill', request_status='received')
  - sp_due: LATEST('setaside_requests', 'due_date', date_field='due_date', request_type='hazard_insurance_bill', request_status='paid')
  - share: MN(1, MX(0, MONTHS(sp_due, NOW) / 12)) if (sp_wd_n >= 1 and sp_due) else (sp_paid_n / sp_pr_n if sp_pr_n >= 2 else K('default_renewal_share'))
  - renewal_prem: cur_prem * (1 + (K('standard_renewal_increase_pct') + chg_pct + occ_pct + appr_pct) / 100)
  - result: RND(cur_prem * (1 - share) + renewal_prem * share + fee_amt, 2)
  compute_basis:
    pr_amt: The hazard bills of the review are the hazard insurance bills on file for the reserve received within the twelve months before the review.
    latest_paid_amt: The current hazard premium is the billed amount of the paid hazard insurance bill with the latest due date.
    plan_n: 'Where two or more of the hazard bills of the review are paid or received, the pay-plan basis applies: the current hazard premium is the sum of the billed amounts of those paid and received bills, because a policy billed in installments costs the sum of its installments. Where none of the hazard bills of the review is paid or received, the carry-forward basis applies: the current hazard premium is the annual hazard premium already on file. Otherwise the current hazard premium is the billed amount of the paid hazard insurance bill with the latest due date.'
    cur_prem: 'Where two or more of the hazard bills of the review are paid or received, the pay-plan basis applies: the current hazard premium is the sum of the billed amounts of those paid and received bills, because a policy billed in installments costs the sum of its installments. Where none of the hazard bills of the review is paid or received, the carry-forward basis applies: the current hazard premium is the annual hazard premium already on file. Otherwise the current hazard premium is the billed amount of the paid hazard insurance bill with the latest due date.'
    chg_wd_n: Where at least one of the hazard bills of the review is withdrawn and the paid and received hazard bills of the review sum to more than the withdrawn hazard bills of the review increased by the premium-change threshold percentage, the hazard premium-change loading is the high premium-change loading. Where at least one is withdrawn and the paid and received hazard bills sum to more than the withdrawn hazard bills but not more than that threshold, the hazard premium-change loading is the low premium-change loading. Otherwise the hazard premium-change loading is zero.
    chg_wd_amt: Where at least one of the hazard bills of the review is withdrawn and the paid and received hazard bills of the review sum to more than the withdrawn hazard bills of the review increased by the premium-change threshold percentage, the hazard premium-change loading is the high premium-change loading. Where at least one is withdrawn and the paid and received hazard bills sum to more than the withdrawn hazard bills but not more than that threshold, the hazard premium-change loading is the low premium-change loading. Otherwise the hazard premium-change loading is zero.
    chg_pct: Where at least one of the hazard bills of the review is withdrawn and the paid and received hazard bills of the review sum to more than the withdrawn hazard bills of the review increased by the premium-change threshold percentage, the hazard premium-change loading is the high premium-change loading. Where at least one is withdrawn and the paid and received hazard bills sum to more than the withdrawn hazard bills but not more than that threshold, the hazard premium-change loading is the low premium-change loading. Otherwise the hazard premium-change loading is zero.
    occ_status: Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard occupancy loading is the vacant-home loading, because a home left empty after the last borrower's death renews at unoccupied rates. Where the occupancy profile shows non-occupancy confirmed or a health-care absence under monitoring, the hazard occupancy loading is the absence loading. Otherwise the hazard occupancy loading is zero.
    occ_case_dp: Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard occupancy loading is the vacant-home loading, because a home left empty after the last borrower's death renews at unoccupied rates. Where the occupancy profile shows non-occupancy confirmed or a health-care absence under monitoring, the hazard occupancy loading is the absence loading. Otherwise the hazard occupancy loading is zero.
    occ_case_ext: Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard occupancy loading is the vacant-home loading, because a home left empty after the last borrower's death renews at unoccupied rates. Where the occupancy profile shows non-occupancy confirmed or a health-care absence under monitoring, the hazard occupancy loading is the absence loading. Otherwise the hazard occupancy loading is zero.
    occ_pct: Where the occupancy profile of the reserve's Summit loan is closed and the loan's maturity case is a death of the last surviving borrower that is due and payable or in its extension period, the hazard occupancy loading is the vacant-home loading, because a home left empty after the last borrower's death renews at unoccupied rates. Where the occupancy profile shows non-occupancy confirmed or a health-care absence under monitoring, the hazard occupancy loading is the absence loading. Otherwise the hazard occupancy loading is zero.
    ap_val: Where the loan's maturity case that is due and payable or in its extension period carries an appraisal dated fewer whole months before the review than the appraisal-currency months, and its appraised value exceeds the Summit loan's appraised value at closing by more than the appraisal threshold percentage, the hazard appraisal loading is the high appraisal loading, because coverage must keep pace with the home's value. Where it carries such an appraisal whose value exceeds the closing value by no more than that threshold, the hazard appraisal loading is the low appraisal loading. Otherwise the hazard appraisal loading is zero.
    ap_date: Where the loan's maturity case that is due and payable or in its extension period carries an appraisal dated fewer whole months before the review than the appraisal-currency months, and its appraised value exceeds the Summit loan's appraised value at closing by more than the appraisal threshold percentage, the hazard appraisal loading is the high appraisal loading, because coverage must keep pace with the home's value. Where it carries such an appraisal whose value exceeds the closing value by no more than that threshold, the hazard appraisal loading is the low appraisal loading. Otherwise the hazard appraisal loading is zero.
    ap_close: Where the loan's maturity case that is due and payable or in its extension period carries an appraisal dated fewer whole months before the review than the appraisal-currency months, and its appraised value exceeds the Summit loan's appraised value at closing by more than the appraisal threshold percentage, the hazard appraisal loading is the high appraisal loading, because coverage must keep pace with the home's value. Where it carries such an appraisal whose value exceeds the closing value by no more than that threshold, the hazard appraisal loading is the low appraisal loading. Otherwise the hazard appraisal loading is zero.
    appr_pct: Where the loan's maturity case that is due and payable or in its extension period carries an appraisal dated fewer whole months before the review than the appraisal-currency months, and its appraised value exceeds the Summit loan's appraised value at closing by more than the appraisal threshold percentage, the hazard appraisal loading is the high appraisal loading, because coverage must keep pace with the home's value. Where it carries such an appraisal whose value exceeds the closing value by no more than that threshold, the hazard appraisal loading is the low appraisal loading. Otherwise the hazard appraisal loading is zero.
    fee_n: Where four or more of the hazard bills of the review are paid or received, the hazard pay-plan fee is the quarterly pay-plan fee, and where two or three are, the semiannual pay-plan fee; otherwise it is zero.
    fee_amt: Where four or more of the hazard bills of the review are paid or received, the hazard pay-plan fee is the quarterly pay-plan fee, and where two or three are, the semiannual pay-plan fee; otherwise it is zero.
    sp_wd_n: 'Where at least one of the hazard bills of the review is withdrawn, the replacement month basis applies: the hazard renewal share is the whole months from the due date of the latest paid hazard insurance bill to the review date, divided by twelve, never below zero and never above one, because a replacement policy renews on the anniversary of its own start. Where none is withdrawn and two or more of the hazard bills of the review are paid or received, the installment count basis applies: the hazard renewal share is the number of paid hazard bills of the review divided by the number of paid and received hazard bills of the review. Otherwise the hazard renewal share is one half.'
    sp_paid_n: 'Where at least one of the hazard bills of the review is withdrawn, the replacement month basis applies: the hazard renewal share is the whole months from the due date of the latest paid hazard insurance bill to the review date, divided by twelve, never below zero and never above one, because a replacement policy renews on the anniversary of its own start. Where none is withdrawn and two or more of the hazard bills of the review are paid or received, the installment count basis applies: the hazard renewal share is the number of paid hazard bills of the review divided by the number of paid and received hazard bills of the review. Otherwise the hazard renewal share is one half.'
    sp_pr_n: 'Where at least one of the hazard bills of the review is withdrawn, the replacement month basis applies: the hazard renewal share is the whole months from the due date of the latest paid hazard insurance bill to the review date, divided by twelve, never below zero and never above one, because a replacement policy renews on the anniversary of its own start. Where none is withdrawn and two or more of the hazard bills of the review are paid or received, the installment count basis applies: the hazard renewal share is the number of paid hazard bills of the review divided by the number of paid and received hazard bills of the review. Otherwise the hazard renewal share is one half.'
    sp_due: 'Where at least one of the hazard bills of the review is withdrawn, the replacement month basis applies: the hazard renewal share is the whole months from the due date of the latest paid hazard insurance bill to the review date, divided by twelve, never below zero and never above one, because a replacement policy renews on the anniversary of its own start. Where none is withdrawn and two or more of the hazard bills of the review are paid or received, the installment count basis applies: the hazard renewal share is the number of paid hazard bills of the review divided by the number of paid and received hazard bills of the review. Otherwise the hazard renewal share is one half.'
    share: 'Where at least one of the hazard bills of the review is withdrawn, the replacement month basis applies: the hazard renewal share is the whole months from the due date of the latest paid hazard insurance bill to the review date, divided by twelve, never below zero and never above one, because a replacement policy renews on the anniversary of its own start. Where none is withdrawn and two or more of the hazard bills of the review are paid or received, the installment count basis applies: the hazard renewal share is the number of paid hazard bills of the review divided by the number of paid and received hazard bills of the review. Otherwise the hazard renewal share is one half.'
    renewal_prem: The renewal hazard premium is the current hazard premium increased once by the hazard renewal loading, which is the standard renewal increase plus the hazard premium-change loading, the hazard occupancy loading and the hazard appraisal loading, all in percent, added together and applied once to the current hazard premium, not one after another; the hazard premium-change loading, the hazard occupancy loading and the hazard appraisal loading are each zero.
    result: The projected annual hazard premium is the current hazard premium times one less the hazard renewal share, plus the renewal hazard premium times the hazard renewal share, plus the hazard pay-plan fee. The projected annual hazard premium is rounded half up to the cent once, at the end, and the review takes it from the hazard insurance bill on file with the latest due date.
  factors:
