name: env_0065_flood_insurance_carrier
company: Tidemark Flood Insurance Company

background: |
  Tidemark Flood Insurance Company is a specialty flood carrier headquartered in Tampa, Florida, licensed across the
  continental United States and serving roughly 520,000 policyholders through independent agents, mortgage lenders and
  its own policy and claims desk. As a Write Your Own company under the National Flood Insurance Program it sells and
  services federal flood policies in its own name, and alongside that federal book it writes its own private flood
  products, some admitted and some through its surplus lines affiliate. Its federal book has two product lines: NFIP
  Dwelling Form Flood Policies, held as NFIP Dwelling Form – Tenant Contents, – Residential Condominium Unit, –
  Manufactured Home, – Secondary Single-Family Home, – Primary Single-Family Home and – Two-to-Four Unit Building; and
  NFIP General Property Form and RCBAP Flood Policies, held as NFIP General Property Form – Non-Residential Condominium
  Unit, – Non-Residential Manufactured Building, – Other Residential Building and – Non-Residential Building, and as
  NFIP RCBAP – Two-to-Four Unit Condominium Building and NFIP RCBAP – Five-or-More Unit Condominium Building. Its
  private residential line, HomeFlood Private Residential Flood Policies, is held as HomeFlood Renters, Essential,
  Standard, Plus, Premier and Estate, and homes worth more than their primary limits add Excess Flood Policies, held
  as Excess Flood 250K, 500K, 1M, 2M, 3M and 5M. Businesses can buy BizFlood Commercial Flood Policies, held as
  BizFlood Building, Building and Contents, Building, Contents and Business Income, Excess over NFIP, Multi-Location
  and Large Property, and households and shops can add FloodPay Parametric Flood Cover, held as FloodPay Home 5K, 10K
  and 25K and FloodPay Business 50K, 100K and 250K. Mortgage lenders and servicers hold Lender-Placed Flood Master
  Programs, held as Lender-Placed Flood – Residential Mandatory Amount, – Residential Gap, – Residential Replacement
  Cost, – Manufactured Home, – Commercial Building and – Commercial Building and Contents. Every policy is a running
  annual contract on one insured building, unit or location, tied to its FEMA flood zone and often to an Elevation
  Certificate, and it books a stream of premium components, payments, credits and refunds on its own account. Each
  policy also carries a claim file in which first notices, adjuster reports, proofs of loss, payments and denials
  accumulate claim by claim, and a servicing file of endorsements, renewal offers, certificates and notices. A
  lender-placed program instead books certificates, borrower notices, borrower evidence and monthly statements for
  every tracked loan. Callers are homeowners and renters with a federal or private policy, owners of second homes and
  rental buildings, condominium boards, small-business owners, and servicing staff of banks and mortgage servicers.
  A typical household holds one federal or HomeFlood policy on its home, sometimes with an Excess Flood layer above
  it, and calls around a home purchase or refinance, a new flood map, a renewal bill, a sale, or a flood loss.
  Business and association callers usually hold several building policies and bring renewal, coverage and claim
  histories spanning past hurricane seasons, while lenders call about tracked loans, certificates and statements.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoffs

difficulties:
  - name: nfip_dwelling_servicing
    claim:
      categories: [dwelling]
      event_types: [dwelling_policy_issued, dwelling_endorsement_issued, dwelling_coverage_updated, dwelling_premium_charged, dwelling_premium_payment, dwelling_ec_received, dwelling_rating_updated, dwelling_premium_credit, dwelling_refund_disbursed, dwelling_grace_renewed, dwelling_term_renewed, dwelling_policy_cancelled, dwelling_policy_assigned, dwelling_mortgagee_notice]
    summary: >-
      Homeowners, renters, condominium unit owners, second-home owners and small landlords call about their NFIP Dwelling
      Form policies when they buy or refinance a home, receive a new flood map, get a renewal bill, sell a property,
      obtain an Elevation Certificate or want to stop coverage, and their situation differs by occupancy tier, by whether
      the policy is pending_effective, in_force or in renewal_grace, by whether a lender requires the coverage and pays
      from escrow, and by the claims already reported in the current term. The agent works from the policy record, its
      premium ledger, servicing documents, claim file and signed requests, under the federal effective-date rules with
      their loan-transaction and map-revision exceptions (dwelling_waiting_period), the per-tier limits and minimum
      deductibles (dwelling_coverage_limits_deductibles), the component premium build-up with its primary-residence
      surcharge distinction (dwelling_premium_components), pro rata endorsement and certificate re-rating
      (dwelling_endorsement_premium, dwelling_ec_rating), the capped renewal and grace period (dwelling_renewal), and the
      reason-driven cancellation refund with its documentation, lender-release, claim-bar and payee rules
      (dwelling_cancellation_refund), alongside the one-building-policy rule and the mortgagee's rights. Background
      order in this domain runs from application and payment, through the waiting period and the term, to endorsement,
      renewal and finally cancellation or assignment. The agent books issuance, endorsements, re-ratings, ledger
      entries, grace renewals and cancellation processing as service actions, while signing a cancellation or
      assignment request — the named insured disposing of their own contract — is the customer's own step, handed over
      to them. Requests that no rule here decides, such as a FEMA appeal of a claim denial, a demand to backdate coverage
      outside the statutory exceptions, a dispute of the FEMA flood zone itself, or a request to re-rate the federal risk
      premium by hand, can only be routed to a human representative as POLICY_NOT_COVERED.
  - name: nfip_commercial_rcbap_claims
    claim:
      categories: [nfipcom]
      event_types: [nfipcom_claim_reported, nfipcom_adjuster_report, nfipcom_proof_of_loss_filed, nfipcom_claim_paid, nfipcom_claim_payment_voided, nfipcom_claim_denied, nfipcom_endorsement_issued, nfipcom_coverage_updated, nfipcom_premium_charged, nfipcom_policy_cancelled, nfipcom_premium_credit, nfipcom_refund_disbursed]
    summary: >-
      Business owners, landlords of larger residential buildings, non-profits and condominium association boards call
      about General Property Form and RCBAP policies, most often after a flood to report a loss, follow an adjuster's
      report, file a proof of loss, ask about a payment or replace a lost claim check, and otherwise to raise limits or
      to cancel a building's policy, with settings that vary by form and occupancy tier, by the number of units an RCBAP
      covers, by whether the building limit meets the coinsurance requirement, by the mortgagee of record and by what
      has already been paid on each claim and coverage. The records involved are the policy, the claim file keyed by
      claim number and coverage, the premium ledger, endorsements and signed cancellation requests, and the governing
      rules are the per-tier caps including the per-unit RCBAP cap (nfipcom_coverage_limits_deductibles), settlement at
      actual cash value or replacement cost with the RCBAP coinsurance penalty, separate deductibles, ICC and
      loss-avoidance additions and prior payments net of voids (nfipcom_claim_settlement), the proof-of-loss deadline
      and payment timing (nfipcom_proof_of_loss), coverage-period and denial rules (nfipcom_claim_intake,
      nfipcom_claim_denial), pro rata endorsement premium (nfipcom_endorsement_premium) and the reason-driven
      cancellation refund (nfipcom_cancellation_refund). In the natural course of a loss, first notice comes before the
      adjuster's reports, the proof of loss before payment, and a void before any reissue. The agent records claim
      events, payments, voids, denials, endorsements and cancellation processing, while an authorized signer of the
      insured entity alone signs a proof of loss or a cancellation request, which the agent hands over. Matters outside
      every rule — deciding a FEMA appeal, paying business interruption or living expenses the federal forms never
      cover, deciding whether FEMA should extend a proof-of-loss deadline for an event, or apportioning an RCBAP
      payment among unit owners — go to a human representative as POLICY_NOT_COVERED.
  - name: private_homeflood_rating_billing
    claim:
      categories: [homeflood]
      event_types: [homeflood_policy_issued, homeflood_premium_charged, homeflood_premium_payment, homeflood_premium_credit, homeflood_refund_disbursed, homeflood_ec_received, homeflood_rating_updated, homeflood_endorsement_issued, homeflood_coverage_updated, homeflood_cancel_notice_issued, homeflood_cancel_notice_rescinded, homeflood_term_renewed, homeflood_policy_reinstated, homeflood_policy_cancelled, homeflood_notice_sent]
    summary: >-
      Homeowners and renters call about HomeFlood when they shop a private policy, switch from an NFIP policy, close on a
      mortgaged home, send in an Elevation Certificate, change limits or deductible, fall behind on installments, let a
      renewal lapse or cancel, and their situations vary by tier, by flood zone and certified elevation, by the payment
      plan and who pays, by whether a lender requires the coverage, by their Tidemark claim history on the property and
      by whether an Excess Flood policy or a live NFIP Dwelling Form policy sits on the same home. The agent reads the
      policy, its ledger and servicing documents, the claim files of the customer's Tidemark residential flood policies
      at the address and the customer's other holdings, under the filed rating schedule with its zone, elevation and
      deductible factors and minimum premium (homeflood_premium_rating), the additive capped credits
      (homeflood_credits), the compliance aid and mortgage-required rule (homeflood_limits_deductible_compliance), the
      property-combination rule with the NFIP replacement path and package credit (homeflood_agg_property_combination),
      the installment, notice and rescission rules (homeflood_payment_plans, homeflood_insurer_notices), pro rata
      endorsement and re-rating (homeflood_endorsements, homeflood_ec_rating), renewal and reinstatement
      (homeflood_renewal) and the cancellation refund with its paid-claim bar (homeflood_cancellation_refund). In the
      ordinary course a policy is rated and bound, then billed by installment, endorsed or re-rated, renewed or allowed
      to expire, and possibly cancelled. The agent rates, books premium items and credits, records certificates,
      endorsements, notices, rescissions, renewals and reinstatements, while the customer alone signs a cancellation
      request or a statement of no loss, which the agent hands over. Requests the charter does not decide — financing the
      premium through an outside premium finance company, insuring a houseboat or a building over water, splitting one
      policy between co-owners who no longer share the home, or rating on an elevation survey that is not an Elevation
      Certificate — can only go to a human representative as POLICY_NOT_COVERED.
  - name: excess_flood_layering
    claim:
      categories: [excess]
      event_types: [excess_policy_issued, excess_underlying_evidence_received, excess_underlying_updated, excess_premium_charged, excess_premium_payment, excess_endorsement_issued, excess_coverage_updated, excess_term_renewed, excess_policy_cancelled, excess_premium_credit, excess_refund_disbursed, excess_claim_reported, excess_adjuster_report, excess_underlying_settlement_recorded, excess_claim_paid, excess_claim_denied]
    summary: >-
      Owners of higher-value homes call about Excess Flood when they add a layer above an NFIP or private primary
      policy, renew, change their excess limits, cancel, or claim after a flood that exceeded their primary limits, and
      their situations vary by tier, by the type, limits and status of the underlying policy — often a Tidemark NFIP
      Dwelling Form or HomeFlood policy on the same home — by flood zone and certified elevation, by the state surplus
      lines tax and stamping fee recorded on the policy, and by what the underlying carrier and Tidemark have already
      paid on the loss. The agent works from the excess policy, its ledger and servicing documents, the underlying
      declarations or the customer's Tidemark primary policy, and the excess claim file, under the underlying
      requirement and attachment rule with no drop-down (excess_agg_underlying_requirement), the limit and eligibility
      rule (excess_limits_eligibility), the rating, fee and tax build-up (excess_premium_rating), the waiting period
      (excess_waiting_period), pro rata endorsements (excess_endorsements), renewal without grace (excess_renewal), the
      cancellation refund with its minimum earned premium, tax return and paid-claim bar (excess_cancellation_refund),
      and excess settlement above the attachment with first-dollar loss of use (excess_claim_intake_pol,
      excess_claim_settlement). In the natural course of a loss, the underlying policy settles first and the excess
      policy pays only what lies above its attachment. The agent binds, records underlying evidence, books premium,
      taxes, credits and refunds, records claim events and issues excess payments, while the insured alone signs a
      cancellation request, which the agent hands over. Requests no rule decides — attaching the layer over a
      commercial or condominium association policy, disputing how the underlying carrier adjusted its own claim,
      extending the excess layer to wind or storm-surge damage another insurer has declined, or moving the policy to a
      new home mid-term — go to a human representative as POLICY_NOT_COVERED.
  - name: lender_placed_flood_programs
    claim:
      categories: [forceplaced]
      event_types: [forceplaced_notice_mailed, forceplaced_evidence_received, forceplaced_certificate_issued, forceplaced_certificate_renewed, forceplaced_certificate_cancelled, forceplaced_premium_charged, forceplaced_premium_credit, forceplaced_lender_payment, forceplaced_refund_disbursed, forceplaced_program_suspended, forceplaced_program_reinstated, forceplaced_program_terminated]
    summary: >-
      Servicing staff of banks and mortgage servicers call about their lender-placed flood master programs to ask why a
      loan was or was not placed, to send in a borrower's evidence of coverage, to report payoffs, servicing transfers
      and map amendments, to question a monthly statement, or to end a program, and the settings vary by program tier,
      by program status, by the loan's tracking history of notices, lapse date and evidence, by the balances and values
      the lender reported, and by claims already paid on a certificate. The agent reads the program, its certificates,
      tracking entries, statements and claim files, under the federal notice period before placement with the
      program-status requirement (forceplaced_notice_and_placement), the mandatory purchase amount by coverage method
      (forceplaced_coverage_amount), backdating to the lapse date and certificate premium
      (forceplaced_effective_date_premium), evidence acceptance with the federal overlap-refund deadline and flat or pro
      rata credit (forceplaced_evidence_cancellation), loan-event credits with their paid-claim bar
      (forceplaced_loan_event_cancellation), statement aging and suspension (forceplaced_agg_program_account), renewal
      (forceplaced_renewal) and termination with runoff (forceplaced_program_termination). In the ordinary course a
      loan is reported, the borrower is notified, the notice period runs, a certificate is placed, and it later renews
      or is cancelled on evidence or a loan event. The agent mails notices, reviews evidence, issues, renews and cancels
      certificates, books premiums, credits, remittances and refunds and suspends or reinstates placements, while the
      lender alone signs a program termination notice, which the agent hands over. Matters no rule covers — refunding
      the borrower directly, settling an escrow dispute between the lender and the borrower, re-determining the flood
      zone in place of the determination form, or tracking loans the lender has never reported — go to a human
      representative as POLICY_NOT_COVERED.
