# Tidemark Flood — BizFlood, Tidemark's commercial flood program written on a surplus lines basis for
# businesses, landlords and property owners whose needs exceed or fall outside the NFIP General Property
# Form (business income, higher limits, multiple locations). Rates, limits, deductibles, fees and
# servicing periods are Tidemark's own written schedules; the surplus lines tax and stamping fee rates of
# the property's state are recorded on the policy record.
category: bizflood
display_name: BizFlood Commercial Flood Policies (Surplus Lines)

binding:
  holding_table: bizflood_policies
  event_tables: [bizflood_billing, bizflood_claims, bizflood_changes]
  intake_tables: [bizflood_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [pending_effective, active, expired, cancelled]
  transitions:
    - {from: pending_effective, to: active, by: system, means: The waiting period ends and coverage attaches at 12:01 a.m. on the effective date.}
    - {from: active, to: expired, by: system, means: The term ends without a renewal being bound.}
    - {from: active, to: cancelled, by: user, means: An authorized signer of the named insured signs a cancellation request.}
    - {from: pending_effective, to: cancelled, by: user, means: An authorized signer cancels before the policy took effect.}
    - {from: active, to: cancelled, by: agent, means: Tidemark cancels after its written notice period runs out.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: The amount the insured owes on the policy; premium, fees and taxes raise it, payments and credits lower it, refunds paid out bring a credit balance back to zero.
  - key: claim_paid
    unit: USD
    meaning: Net claim money issued on the policy; payments raise it and voids lower it.

parameter_schema:
  max_building_limit_per_location: Highest building limit per scheduled location; USD.
  max_contents_limit_per_location: Highest business personal property limit per location; USD (0 where not written).
  max_total_insured_value: Highest total insured value across all scheduled locations; USD.
  max_locations: Highest number of scheduled locations; count.
  business_income_available: Whether business income and extra expense coverage is written; boolean.
  max_business_income_limit: Highest business income and extra expense limit per location; USD (0 where unavailable).
  business_income_waiting_hours: Hours after the direct physical loss before business income loss is covered; elapsed hours.
  period_of_restoration_max_months: Longest period of restoration for business income; calendar months.
  extra_expense_pct_of_bi: Extra expense sublimit as a percent of the business income limit; percent.
  excess_over_nfip: Whether the policy attaches above NFIP General Property Form limits on each location; boolean.
  nfip_building_attachment: Building attachment per location when written excess of NFIP; USD (0 when primary).
  nfip_contents_attachment: Contents attachment per location when written excess of NFIP; USD (0 when primary).
  coinsurance_pct: Coinsurance percentage applied to building and contents at loss; percent.
  agreed_value_available: Whether coinsurance can be suspended for the term on a signed statement of values; boolean.
  building_settlement_basis: Basis for building losses; enum (ACTUAL_CASH_VALUE, REPLACEMENT_COST).
  contents_settlement_basis: Basis for business personal property losses; enum (ACTUAL_CASH_VALUE, REPLACEMENT_COST).
  min_deductible_per_location: Lowest flat deductible per location per occurrence; USD.
  deductible_options: Flat deductible options per location; list of USD.
  v_zone_pct_deductible: Percentage-of-location-value deductible for a location in zone V or VE; percent.
  v_zone_min_deductible: Minimum deductible for a V-zone location; USD.
  building_rate_per_100: Annual rate per 100 USD of building limit; USD.
  contents_rate_per_100: Annual rate per 100 USD of business personal property limit; USD.
  business_income_rate_per_100: Annual rate per 100 USD of business income limit; USD.
  zone_factor_table: Rating factor by FEMA flood zone of each location; mapping zone -> factor.
  multi_location_credit_pct: Credit on the total premium when more than the threshold number of locations is scheduled; percent.
  multi_location_threshold: Number of locations above which the multi-location credit applies; count.
  minimum_premium: Lowest annual premium of the policy before fees and taxes; USD.
  policy_fee: Annual policy fee, fully earned; USD.
  inspection_fee_per_location: Fee per location for the underwriting inspection at new business; USD.
  inspection_required_over_tiv: Location value above which an underwriting inspection is required before binding; USD.
  payment_plans: Payment plans available; list of enum (ANNUAL, QUARTERLY).
  quarterly_down_pct: Down payment percent on the quarterly plan; percent.
  installment_fee: Fee per installment after the first; USD.
  standard_waiting_days: Waiting period from receipt of the signed application and payment to coverage attaching; calendar days.
  loan_closing_waiting_days: Waiting period when bound for a commercial loan closing and received by the closing date; calendar days.
  renewal_offer_days: Days before term end the renewal offer is issued; calendar days.
  sov_update_required_at_renewal: Whether a signed statement of values is required to renew; boolean.
  nonrenewal_notice_days: Written notice before term end for a Tidemark non-renewal; calendar days.
  insurer_cancellation_notice_days: Written notice before Tidemark cancels for nonpayment or misrepresentation; calendar days.
  minimum_earned_premium_pct: Share of the term premium fully earned at binding; percent.
  fees_refundable: Whether the policy fee and inspection fees are returned on cancellation; boolean.
  taxes_returned_with_premium: Whether surplus lines tax and stamping fee are returned with returned premium; boolean.
  location_add_waiting_days: Waiting period for a location added mid-term; calendar days.
  location_delete_refund_method: Credit method when a location is deleted mid-term; enum (PRO_RATA).
  proof_of_loss_days: Days after the date of loss within which the proof of loss must be received; calendar days.
  claim_payment_days: Days after the agreed proof of loss within which Tidemark pays; calendar days.
  adjuster_contact_hours: Tidemark standard for the adjuster's first contact; elapsed hours.
  suit_limitation_months: Months after the written denial within which suit may be filed; calendar months.
  appraisal_available: Whether either party may demand appraisal; boolean.
  authorized_signer_required: Whether requests must be signed by an authorized signer of the insured entity; boolean.

