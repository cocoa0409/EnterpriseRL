events:
  - type: bizflood_policy_issued
    target: bizflood_policies
    mutation: create
    meaning: A BizFlood policy is bound on a signed application, statement of values and payment.
    grain: one row per policy bound
    fields:
      policy_number: Policy number.
      variant_name: Tier written.
      locations_scheduled: Number of locations on the statement of values.
      total_insured_value: Total insured value scheduled.
      deductible_per_location: Flat deductible per location.
      payment_plan: Payment plan.
      application_date: Date the signed application and payment were received.
      effective_date: Date coverage first attaches.
      term_start: Start of the first term.
      term_end: End of the first term.
      surplus_lines_state: State whose surplus lines tax applies.
      surplus_lines_tax_pct: Tax rate in force.
      stamping_fee_pct: Stamping fee rate in force.
      term_premium: Rated term premium before fees and taxes.
    triggers:
      - event: bizflood:bizflood_premium_charged
        map: {term_start: term_start, charge_basis: NEW_BUSINESS}
  - type: bizflood_policy_effective
    target: bizflood_policies
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: Coverage attaches on the effective date.
    grain: one row per policy taking effect
    fields:
      effective_date: Date coverage attached.
    triggers: []
  - type: bizflood_term_renewed
    target: bizflood_policies
    mutation: update
    meaning: The renewal is bound on an updated statement of values and payment by term end.
    grain: one row per term renewed
    fields:
      term_start: Start of the renewed term.
      term_end: End of the renewed term.
      locations_scheduled: Locations scheduled for the renewed term.
      total_insured_value: Total insured value for the renewed term.
      term_premium: Rated premium for the renewed term.
    triggers:
      - event: bizflood:bizflood_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
  - type: bizflood_policy_expired
    target: bizflood_policies
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without a renewal bound.
    grain: one row per expiration
    fields:
      closed_date: Term end.
    triggers: []
  - type: bizflood_policy_cancelled
    target: bizflood_policies
    mutation: {transition: [{from: active, to: cancelled}, {from: pending_effective, to: cancelled}]}
    meaning: An authorized signer's cancellation request takes effect.
    grain: one row per insured cancellation
    fields:
      cancellation_reason: Reason on the request.
      cancellation_effective_date: Date the cancellation takes effect.
      closed_date: Date processed.
    triggers:
      - event: bizflood:bizflood_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: bizflood_insurer_cancelled
    target: bizflood_policies
    mutation: {transition: {from: active, to: cancelled}}
    meaning: Tidemark cancels for nonpayment or material misrepresentation after its notice period.
    grain: one row per insurer cancellation
    fields:
      cancellation_reason: NONPAYMENT or MATERIAL_MISREPRESENTATION.
      cancellation_effective_date: Cancellation date on the notice.
      closed_date: Date processed.
    triggers:
      - event: bizflood:bizflood_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: bizflood_schedule_updated
    target: bizflood_policies
    mutation: update
    meaning: An endorsement adding or deleting a location, or changing a location's values, updates the policy totals.
    grain: one row per schedule change applied
    fields:
      locations_scheduled: Locations after the change.
      total_insured_value: Total insured value after the change.
      term_premium: Full-term premium as endorsed.
    triggers: []
  - type: bizflood_premium_charged
    target: bizflood_billing
    meaning: One premium item is booked — term premium, policy fee, inspection fee, installment fee, surplus lines tax, stamping fee or endorsement premium.
    grain: one row per item per term per booking occasion and installment
    distinguish_by: [component, term_start, charge_basis, reference_id, installment_number]
    fields:
      term_start: Term.
      component: Item booked.
      charge_basis: Occasion.
      amount: Amount, positive.
      posted_date: Date booked.
      reference_id: Endorsement record behind an ENDORSEMENT booking; empty otherwise.
      installment_number: Installment of an installment fee; 0 otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: bizflood_premium_payment
    target: bizflood_billing
    meaning: A payment or installment is received.
    grain: one row per payment item
    distinguish_by: [payment_ref, term_start]
    fields:
      term_start: Term paid.
      amount: Amount, positive.
      posted_date: Date received.
      payment_ref: Wire, ACH or check reference.
      installment_number: Installment settled.
    account: premium_balance
    direction: out
    triggers: []
  - type: bizflood_premium_credit
    target: bizflood_billing
    meaning: Returned premium with its tax and stamping fee is credited on a cancellation or a location deletion.
    grain: one row per credited item per occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term.
      component: Item credited.
      charge_basis: CANCELLATION or ENDORSEMENT.
      amount: Amount, positive.
      posted_date: Date booked.
      reference_id: Cancellation request or endorsement record; the policy itself for an insurer cancellation.
    account: premium_balance
    direction: out
    triggers: []
  - type: bizflood_refund_disbursed
    target: bizflood_billing
    meaning: A credit balance is paid out to the insured.
    grain: one row per refund
    distinguish_by: [reference_id]
    fields:
      amount: Refund, positive.
      posted_date: Date issued.
      reference_id: Record whose credit is refunded.
      payment_ref: Refund reference.
    account: premium_balance
    direction: in
    triggers: []
  - type: bizflood_endorsement_issued
    target: bizflood_changes
    meaning: A location is added, deleted or revalued mid-term.
    grain: one row per endorsement
    distinguish_by: [change_type, location_number, change_effective_date]
    fields:
      change_type: Kind of change.
      location_number: Location on the statement of values.
      location_address: Address of the location.
      location_flood_zone: Flood zone of the location.
      building_limit: Building limit of the location after the change.
      contents_limit: Contents limit of the location after the change.
      business_income_limit: Business income limit of the location after the change.
      change_effective_date: Date the change takes effect.
      recorded_date: Date processed.
      revised_term_premium: Full-term premium as endorsed.
    triggers:
      - event: bizflood:bizflood_schedule_updated
        map: {term_premium: revised_term_premium}
      - event: bizflood:bizflood_premium_charged
        when: {change_type: [LOCATION_ADD, VALUE_INCREASE]}
        map: {component: ENDORSEMENT_PREMIUM, charge_basis: ENDORSEMENT}
      - event: bizflood:bizflood_premium_credit
        when: {change_type: [LOCATION_DELETE, VALUE_DECREASE]}
        map: {component: TERM_PREMIUM, charge_basis: ENDORSEMENT}
  - type: bizflood_sov_received
    target: bizflood_changes
    meaning: A signed statement of values for the locations is received.
    grain: one row per location per statement received
    distinguish_by: [location_number, recorded_date]
    fields:
      location_number: Location.
      location_address: Address.
      location_flood_zone: Flood zone.
      building_limit: Building value declared.
      contents_limit: Contents value declared.
      business_income_limit: Twelve-month business income value declared.
      recorded_date: Date received.
    triggers: []
  - type: bizflood_renewal_offered
    target: bizflood_changes
    meaning: The renewal offer is issued.
    grain: one row per offer
    distinguish_by: [recorded_date]
    fields:
      recorded_date: Date issued.
      revised_term_premium: Premium offered.
    triggers: []
  - type: bizflood_claim_reported
    target: bizflood_claims
    meaning: A flood loss at a scheduled location is reported.
    grain: one row per claim
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      location_number: Location damaged.
      date_of_loss: Date of the flood.
      event_date: Date reported.
    triggers: []
  - type: bizflood_adjuster_report
    target: bizflood_claims
    meaning: The adjuster reports the measured loss at a location.
    grain: one row per report
    distinguish_by: [claim_number, report_type, event_date]
    fields:
      claim_number: Claim.
      location_number: Location.
      report_type: Kind of report.
      event_date: Date filed.
      building_loss: Building loss at the settlement basis.
      contents_loss: Contents loss at the settlement basis.
      business_income_loss: Business income and extra expense loss after the waiting hours.
      location_value_at_loss: Replacement cost value of the location at the time of loss.
    triggers: []
  - type: bizflood_claim_paid
    target: bizflood_claims
    meaning: A claim payment is issued.
    grain: one row per payment item
    distinguish_by: [claim_number, coverage_part, payment_ref]
    fields:
      claim_number: Claim.
      coverage_part: Coverage paid.
      payment_amount: Amount, positive.
      payment_ref: Reference.
      event_date: Date issued.
    account: claim_paid
    direction: in
    triggers: []
  - type: bizflood_claim_payment_voided
    target: bizflood_claims
    meaning: An issued payment is voided.
    grain: one row per item voided
    distinguish_by: [payment_ref]
    fields:
      claim_number: Claim.
      coverage_part: Coverage.
      payment_amount: Amount, positive.
      payment_ref: Reference voided.
      event_date: Date voided.
    account: claim_paid
    direction: out
    triggers: []
  - type: bizflood_claim_denied
    target: bizflood_claims
    meaning: Tidemark denies a coverage in writing.
    grain: one row per denial per coverage
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim.
      coverage_part: Coverage.
      denial_reason: Reason.
      event_date: Date of denial.
    triggers: []

measures:
  - id: bizflood_msr_term_claims_paid
    window: The current policy term, from term_start inclusive to term_end exclusive, judged by each claim's date_of_loss.
    measure: Count of distinct claim_number values with a date_of_loss inside the window whose net payment (bizflood_claim_paid minus bizflood_claim_payment_voided payment_amount) is above zero.
  - id: bizflood_msr_claim_part_paid
    window: The whole life of one claim_number, for one coverage_part.
    measure: Sum of payment_amount on bizflood_claim_paid rows minus sum of payment_amount on bizflood_claim_payment_voided rows for that claim_number and coverage_part.

policies:
  - id: bizflood_agg_multi_holding
    subject: [bizflood_policy_issued]
    rule: >-
      A business may hold any number of BizFlood policies, but a location may be scheduled on only one live BizFlood
      policy at a time; locations of one insured are normally combined on a single Multi-Location or Large Property
      policy. Each policy is rated, billed and settled on its own.
    eligibility: []
    params:
      max_per_customer: null
  - id: bizflood_agg_location_schedule
    subject: [bizflood_policy_issued, bizflood_sov_received, bizflood_schedule_updated, bizflood_term_renewed]
    rule: >-
      The statement of values schedules each location with its address, flood zone and building, contents and business
      income values, and the policy totals are the sums over the scheduled locations. The number of locations may not
      exceed max_locations and the total insured value may not exceed max_total_insured_value; each location's building
      and contents limits may not exceed max_building_limit_per_location and max_contents_limit_per_location. When the
      number of scheduled locations is above multi_location_threshold, the multi_location_credit_pct credit applies to
      the whole policy premium; it is re-decided at renewal and on every location added or deleted. A location whose
      value exceeds inspection_required_over_tiv is bound only after Tidemark's underwriting inspection, charged at
      inspection_fee_per_location.
    eligibility: []
    params:
      per_tier:
        BizFlood Building: {max_locations: =max_locations, max_total_insured_value: =max_total_insured_value, multi_location_credit_pct: =multi_location_credit_pct}
        BizFlood Building and Contents: {max_locations: =max_locations, max_total_insured_value: =max_total_insured_value, multi_location_credit_pct: =multi_location_credit_pct}
        BizFlood Building, Contents and Business Income: {max_locations: =max_locations, max_total_insured_value: =max_total_insured_value, multi_location_credit_pct: =multi_location_credit_pct}
        BizFlood Excess over NFIP: {max_locations: =max_locations, max_total_insured_value: =max_total_insured_value, multi_location_credit_pct: =multi_location_credit_pct}
        BizFlood Multi-Location: {max_locations: =max_locations, max_total_insured_value: =max_total_insured_value, multi_location_credit_pct: =multi_location_credit_pct}
        BizFlood Large Property: {max_locations: =max_locations, max_total_insured_value: =max_total_insured_value, multi_location_credit_pct: =multi_location_credit_pct}
  - id: bizflood_deductibles_waiting
    subject: [bizflood_policy_issued, bizflood_policy_effective, bizflood_endorsement_issued]
    rule: >-
      Each location carries the policy's flat deductible per occurrence, chosen from deductible_options and not below
      min_deductible_per_location; a location in zone V or VE instead carries v_zone_pct_deductible of that location's
      value at the time of loss, never less than v_zone_min_deductible. On the Excess over NFIP tier the attachment per
      location is nfip_building_attachment and nfip_contents_attachment, and the insured must keep the NFIP General
      Property Form policy in force; the excess never drops down. Coverage takes effect at 12:01 a.m. on the day
      standard_waiting_days calendar days after the signed application and payment are received, or on the loan closing
      date when bound for a commercial loan closing with the application received by that date; a location added
      mid-term takes effect location_add_waiting_days calendar days after its request is received.
    eligibility: []
  - id: bizflood_premium_rating
    subject: [bizflood_policy_issued, bizflood_term_renewed, bizflood_premium_charged, bizflood_renewal_offered]
    rule: >-
      For each location, the building limit divided by 100 times building_rate_per_100, plus the contents limit divided by
      100 times contents_rate_per_100, plus the business income limit divided by 100 times business_income_rate_per_100,
      is multiplied by the zone factor of the location's flood zone. The location amounts are added, reduced by the
      multi-location credit where it applies, rounded to the cent, and the term premium is never less than
      minimum_premium. The policy fee and any inspection fees are added; the surplus lines tax and stamping fee are the
      policy's recorded rates applied to the premium plus fees, each rounded to the cent.
    eligibility: []
    params:
      per_tier:
        BizFlood Building: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium}
        BizFlood Building and Contents: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium}
        BizFlood Building, Contents and Business Income: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium}
        BizFlood Excess over NFIP: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium}
        BizFlood Multi-Location: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium}
        BizFlood Large Property: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium}
  - id: bizflood_payments_insurer_cancellation
    subject: [bizflood_premium_payment, bizflood_insurer_cancelled, bizflood_refund_disbursed]
    rule: >-
      The premium is paid on a plan from payment_plans: ANNUAL in full at binding, or QUARTERLY with quarterly_down_pct
      down and the balance in three equal installments due 3, 6 and 9 calendar months after term_start, each later
      installment carrying installment_fee. Fees and the taxes on them are collected with the first payment. Tidemark
      cancels for NONPAYMENT or MATERIAL_MISREPRESENTATION only by written notice giving insurer_cancellation_notice_days
      calendar days, and only on a policy whose status is active; the minimum earned premium does not apply to an
      insurer cancellation, the unearned premium after the cancellation date being credited pro rata by days with its
      tax and stamping fee, set against any amount owed, and only a remaining credit balance refunded.
    eligibility:
      - id: insurer_cancel_status
        applies_to: [bizflood_insurer_cancelled]
        kind: state
        condition: Tidemark cancels for NONPAYMENT or MATERIAL_MISREPRESENTATION only by written notice giving insurer_cancellation_notice_days calendar days, and only on a policy whose status is active; the minimum earned premium does not apply to an insurer cancellation, the unearned premium after the cancellation date being credited pro rata by days with its tax and stamping fee, set against any amount owed, and only a remaining credit balance refunded.
        evidence_fields: [bizflood_policies.status, bizflood_policies.bizflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizflood_policies.bizflood_policy_id]
          action_bindings:
            bizflood_policies.bizflood_policy_id: bizflood_policy_id
        state_contract:
          field: bizflood_policies.status
          allowed: [active, cancelled]
  - id: bizflood_renewal
    subject: [bizflood_renewal_offered, bizflood_term_renewed, bizflood_policy_expired]
    rule: >-
      The renewal offer is issued renewal_offer_days calendar days before term_end. When sov_update_required_at_renewal
      is true the renewal is bound only on a statement of values signed within the renewal offer period and payment
      under the elected plan by term_end; otherwise the policy expires at term_end with no grace period. Tidemark may
      non-renew only by written notice mailed nonrenewal_notice_days calendar days before term_end.
    eligibility: []
  - id: bizflood_endorsements
    subject: [bizflood_endorsement_issued, bizflood_schedule_updated, bizflood_premium_charged, bizflood_premium_credit]
    rule: >-
      A location is added (LOCATION_ADD), deleted (LOCATION_DELETE) or revalued (VALUE_INCREASE, VALUE_DECREASE) only on a
      policy whose status is pending_effective or active. The policy is re-rated for the full term, and the change in
      the full-term premium times the days from the change effective date to term_end divided by the days in the term,
      rounded to the cent, is booked as an ENDORSEMENT_PREMIUM item or, for a deletion or decrease, credited under
      location_delete_refund_method with the matching tax and stamping fee; the minimum earned premium does not apply
      to a mid-term deletion. A deletion takes effect on the date the signed request is received.
    eligibility:
      - id: endorsable_status
        applies_to: [bizflood_endorsement_issued]
        kind: state
        condition: A location is added (LOCATION_ADD), deleted (LOCATION_DELETE) or revalued (VALUE_INCREASE, VALUE_DECREASE) only on a policy whose status is pending_effective or active.
        evidence_fields: [bizflood_policies.status, bizflood_policies.bizflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizflood_policies.bizflood_policy_id]
          action_bindings:
            bizflood_policies.bizflood_policy_id: bizflood_policy_id
        state_contract:
          field: bizflood_policies.status
          allowed: [pending_effective, active]
  - id: bizflood_cancellation_refund
    subject: [bizflood_policy_cancelled, bizflood_premium_credit]
    rule: >-
      A cancellation is processed only on a cancellation request signed by an authorized signer of the insured and on
      file for the policy. It takes effect on the date the signed request is received or a later date named in it. The
      earned premium is the larger of the pro rata share of the term premium to the cancellation date and
      minimum_earned_premium_pct of the term premium; the policy fee and inspection fees are earned when fees_refundable
      is false; tax and stamping fee are returned on the returned premium at the recorded rates when
      taxes_returned_with_premium is true. Nothing is returned when a claim with a date of loss in the term has a net
      payment above zero (bizflood_msr_term_claims_paid above zero).
    eligibility:
      - id: signed_request_on_file
        applies_to: [bizflood_policy_cancelled]
        kind: authorization
        condition: A cancellation is processed only on a cancellation request signed by an authorized signer of the insured and on file for the policy.
        evidence_fields: [bizflood_requests.bizflood_request_id, bizflood_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizflood_requests.bizflood_request_id]
          action_bindings:
            bizflood_requests.bizflood_request_id: bizflood_request_id
    measures: [bizflood_msr_term_claims_paid]
  - id: bizflood_claims
    subject: [bizflood_claim_reported, bizflood_adjuster_report, bizflood_claim_paid, bizflood_claim_payment_voided]
    rule: >-
      A claim is covered only when the date of loss falls inside the term and on or after the location's effective date.
      Each location is adjusted on its own. When the location's limit is below coinsurance_pct of its value at the time
      of loss and agreed value is not in force for the term, the building or contents payment is the loss times the limit
      divided by coinsurance_pct of that value, rounded to the cent, less the deductible; otherwise it is the loss less
      the deductible; each is never below zero and capped at the limit. On the Excess over NFIP tier the loss is first
      reduced by the attachment. Business income is paid for the loss after business_income_waiting_hours elapsed hours
      and within period_of_restoration_max_months, up to the business income limit, with extra expense within
      extra_expense_pct_of_bi of it. The proof of loss is due within proof_of_loss_days calendar days of the date of loss,
      payment within claim_payment_days calendar days of agreement, and a new payment is the payable amount less what
      has been paid net of voids (bizflood_msr_claim_part_paid).
    eligibility: []
    measures: [bizflood_msr_claim_part_paid]
  - id: bizflood_claim_denial
    subject: [bizflood_claim_denied]
    rule: >-
      A denial is written and states one denial_reason: NOT_A_FLOOD_EVENT, NO_COVERAGE_ON_DATE_OF_LOSS,
      PROOF_OF_LOSS_NOT_TIMELY, LOCATION_NOT_SCHEDULED, EXCLUDED_PROPERTY or LOSS_BELOW_DEDUCTIBLE, and informs the insured
      that suit may be filed within suit_limitation_months calendar months and that appraisal is available when
      appraisal_available is true.
    eligibility: []
