events:
  - type: forceplaced_program_enrolled
    target: forceplaced_programs
    mutation: create
    meaning: A lender's master lender-placed flood program for one tier is set up and waits in enrolled until its effective date.
    grain: one row per master program enrolled
    fields:
      master_policy_number: Master policy number issued to the lender.
      variant_name: Program tier.
      program_effective_date: Date the master policy takes effect.
      program_term_end: End of the master policy's first annual term.
    triggers: []
  - type: forceplaced_program_activated
    target: forceplaced_programs
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The master policy takes effect and placements may begin.
    grain: one row per program activation
    fields:
      program_effective_date: Date the master policy took effect.
    triggers: []
  - type: forceplaced_program_suspended
    target: forceplaced_programs
    mutation: {transition: {from: active, to: suspended}}
    meaning: New placements are suspended because a statement is past due beyond the threshold.
    grain: one row per suspension
    fields:
      oldest_unpaid_due_date: Due date of the oldest unpaid statement that triggered the suspension.
    triggers: []
  - type: forceplaced_program_reinstated
    target: forceplaced_programs
    mutation: {transition: {from: suspended, to: active}}
    meaning: All past-due statements are paid and placements resume.
    grain: one row per reinstatement
    fields:
      oldest_unpaid_due_date: Cleared once nothing is past due.
    triggers: []
  - type: forceplaced_program_terminated
    target: forceplaced_programs
    mutation: {transition: [{from: active, to: terminated}, {from: suspended, to: terminated}]}
    meaning: The lender's signed termination notice takes effect; no new certificates are issued.
    grain: one row per program termination
    fields:
      closed_date: Date the termination took effect.
    triggers: []
  - type: forceplaced_notice_mailed
    target: forceplaced_tracking
    meaning: A borrower notice is mailed on the lender's behalf — the first notice that flood coverage is missing or insufficient, the reminder before placement, or a certificate renewal notice.
    grain: one row per notice mailed for a loan
    distinguish_by: [loan_number, notice_type, notice_date]
    fields:
      loan_number: Lender's loan number.
      certificate_number: Certificate a renewal notice concerns; empty otherwise.
      notice_type: Kind of notice.
      notice_date: Date mailed.
      lapse_date: Date the borrower's coverage lapsed or became insufficient, as tracked.
      required_amount: Mandatory purchase amount stated in the notice.
    triggers: []
  - type: forceplaced_evidence_received
    target: forceplaced_tracking
    meaning: Evidence of the borrower's own flood policy is received from the borrower, the borrower's agent or carrier, and reviewed.
    grain: one row per evidence document received for a loan
    distinguish_by: [loan_number, evidence_policy_number, received_date]
    fields:
      loan_number: Lender's loan number.
      certificate_number: Certificate the evidence concerns; empty when none was issued yet.
      received_date: Date the evidence was received.
      evidence_type: Kind of borrower policy shown.
      evidence_carrier: Carrier shown.
      evidence_policy_number: Policy number shown.
      evidence_building_limit: Building limit shown.
      evidence_effective_date: Effective date shown.
      evidence_expiration_date: Expiration date shown.
      evidence_mortgagee_named: Whether the lender is named as mortgagee.
      evidence_acceptable: Whether the evidence meets the acceptance rule.
    triggers:
      - event: forceplaced:forceplaced_certificate_cancelled
        when: {evidence_acceptable: true}
        map: {loan_number: loan_number, certificate_number: certificate_number, cancellation_reason: BORROWER_COVERAGE_CONFIRMED}
  - type: forceplaced_certificate_issued
    target: forceplaced_certificates
    meaning: A certificate of lender-placed flood coverage is issued on one loan and building under the master policy.
    grain: one row per certificate issued
    distinguish_by: [certificate_number]
    fields:
      certificate_number: Certificate number.
      loan_number: Lender's loan number.
      borrower_name: Borrower named on the certificate.
      property_address: Address of the building.
      flood_zone: Flood zone on the Standard Flood Hazard Determination Form.
      outstanding_principal_balance: Unpaid principal balance reported by the lender.
      insurable_value: Building replacement cost value reported by the lender.
      borrower_existing_limit: Building limit of the borrower's own policy in force (gap tier); 0 otherwise.
      required_amount: Mandatory purchase amount for the loan.
      building_limit: Certificate building limit.
      secured_contents_value: Value of business contents securing the loan, reported by the lender; 0 when contents do not secure the loan.
      contents_limit: Certificate contents limit.
      lapse_date: Date the borrower's coverage lapsed or became insufficient.
      coverage_effective_date: Date the certificate coverage starts.
      certificate_expiration_date: Date the certificate expires.
      annual_premium: Annual certificate premium.
      event_date: Date issued.
    triggers:
      - event: forceplaced:forceplaced_premium_charged
        map: {certificate_number: certificate_number, charge_basis: NEW_PLACEMENT, amount: annual_premium}
  - type: forceplaced_certificate_renewed
    target: forceplaced_certificates
    meaning: A certificate with no acceptable borrower evidence renews for another term.
    grain: one row per certificate renewal
    distinguish_by: [certificate_number, coverage_effective_date]
    fields:
      certificate_number: Certificate renewed.
      loan_number: Loan.
      outstanding_principal_balance: Unpaid principal balance at renewal.
      insurable_value: Replacement cost value at renewal.
      required_amount: Mandatory purchase amount at renewal.
      building_limit: Building limit for the renewed term.
      contents_limit: Contents limit for the renewed term.
      coverage_effective_date: Start of the renewed term.
      certificate_expiration_date: End of the renewed term.
      annual_premium: Premium for the renewed term.
      event_date: Date renewed.
    triggers:
      - event: forceplaced:forceplaced_premium_charged
        map: {certificate_number: certificate_number, charge_basis: RENEWAL, amount: annual_premium}
  - type: forceplaced_certificate_cancelled
    target: forceplaced_certificates
    meaning: A certificate ends before its expiration — the borrower's coverage is confirmed, the loan is paid off or transferred, or the building leaves the Special Flood Hazard Area.
    grain: one row per certificate cancelled
    distinguish_by: [certificate_number, cancellation_reason]
    fields:
      certificate_number: Certificate cancelled.
      loan_number: Loan.
      cancellation_reason: Why it ended.
      cancellation_effective_date: Date coverage ends (the certificate start for a flat cancellation).
      event_date: Date processed.
    triggers:
      - event: forceplaced:forceplaced_premium_credit
        map: {certificate_number: certificate_number}
  - type: forceplaced_premium_charged
    target: forceplaced_billing
    meaning: A certificate premium is billed to the lender on its monthly statement.
    grain: one row per certificate premium per term
    distinguish_by: [certificate_number, charge_basis, statement_month]
    fields:
      certificate_number: Certificate billed.
      statement_month: Statement the charge appears on.
      charge_basis: NEW_PLACEMENT or RENEWAL.
      amount: Premium billed, positive.
      posted_date: Date billed.
    account: premium_balance
    direction: in
    triggers: []
  - type: forceplaced_lender_payment
    target: forceplaced_billing
    meaning: The lender remits payment against a monthly statement.
    grain: one row per remittance
    distinguish_by: [payment_ref]
    fields:
      statement_month: Statement paid.
      amount: Amount remitted, positive.
      posted_date: Date received.
      payment_ref: Wire or ACH reference.
    account: premium_balance
    direction: out
    triggers: []
  - type: forceplaced_premium_credit
    target: forceplaced_billing
    meaning: Unearned certificate premium is credited to the lender's account on a cancellation.
    grain: one row per certificate credit
    distinguish_by: [certificate_number, charge_basis, statement_month]
    fields:
      certificate_number: Certificate credited.
      statement_month: Statement the credit appears on.
      charge_basis: FLAT_CANCEL or PRO_RATA_CANCEL.
      amount: Credit, positive.
      posted_date: Date booked.
      reference_id: The cancellation entry the credit belongs to.
    account: premium_balance
    direction: out
    triggers: []
  - type: forceplaced_refund_disbursed
    target: forceplaced_billing
    meaning: A credit balance on the lender's program account is paid back to the lender.
    grain: one row per refund issued
    distinguish_by: [payment_ref]
    fields:
      statement_month: Statement whose credit balance is refunded.
      amount: Refund, positive.
      posted_date: Date issued.
      payment_ref: Refund wire or ACH reference.
    account: premium_balance
    direction: in
    triggers: []
  - type: forceplaced_claim_reported
    target: forceplaced_claims
    meaning: A flood loss to a building under a certificate is reported.
    grain: one row per claim
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      certificate_number: Certificate claimed under.
      date_of_loss: Date of the flood.
      event_date: Date reported.
    triggers: []
  - type: forceplaced_adjuster_report
    target: forceplaced_claims
    meaning: The adjuster reports the measured loss.
    grain: one row per report
    distinguish_by: [claim_number, report_type, event_date]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      report_type: Kind of report.
      event_date: Date filed.
      building_rcv_loss: Building loss at replacement cost.
      building_acv_loss: Building loss at actual cash value.
      contents_acv_loss: Contents loss at actual cash value.
    triggers: []
  - type: forceplaced_claim_paid
    target: forceplaced_claims
    meaning: A certificate claim payment is issued.
    grain: one row per payment item
    distinguish_by: [claim_number, coverage_part, payment_ref]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      coverage_part: Coverage paid.
      payment_amount: Amount, positive.
      payment_ref: Check or ACH reference.
      payee: Payee line.
      event_date: Date issued.
    account: claim_paid
    direction: in
    triggers: []
  - type: forceplaced_claim_payment_voided
    target: forceplaced_claims
    meaning: An issued certificate claim payment is voided.
    grain: one row per item voided
    distinguish_by: [payment_ref]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      coverage_part: Coverage.
      payment_amount: Amount voided, positive.
      payment_ref: Reference voided.
      event_date: Date voided.
    account: claim_paid
    direction: out
    triggers: []
  - type: forceplaced_claim_denied
    target: forceplaced_claims
    meaning: Tidemark denies a certificate claim coverage in writing.
    grain: one row per denial per coverage
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      coverage_part: Coverage denied.
      denial_reason: Reason.
      event_date: Date of denial.
    triggers: []

measures:
  - id: forceplaced_msr_certificate_paid
    window: The whole life of one certificate_number.
    measure: Sum of payment_amount on forceplaced_claim_paid rows minus sum of payment_amount on forceplaced_claim_payment_voided rows for that certificate_number.
  - id: forceplaced_msr_claim_part_paid
    window: The whole life of one claim_number, for one coverage_part.
    measure: Sum of payment_amount on forceplaced_claim_paid rows minus sum of payment_amount on forceplaced_claim_payment_voided rows for that claim_number and coverage_part.

policies:
  - id: forceplaced_agg_multi_holding
    subject: [forceplaced_program_enrolled]
    rule: >-
      A lender or servicer may hold several master programs, but only one program per tier: a program is enrolled only
      when the lender has no other program of the same tier in status enrolled, active or suspended. All certificates a
      lender places on loans of one occupancy class and coverage method sit under that tier's program, and each program
      has its own master policy number, account and monthly statement.
    eligibility:
      - id: one_program_per_tier
        applies_to: [forceplaced_program_enrolled]
        kind: dedup
        condition: 'A lender or servicer may hold several master programs, but only one program per tier: a program is enrolled only when the lender has no other program of the same tier in status enrolled, active or suspended.'
        evidence_fields: [forceplaced_programs.customer_id, forceplaced_programs.variant_name, forceplaced_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.customer_id, forceplaced_programs.variant_name]
          action_bindings:
            forceplaced_programs.customer_id: customer_id
            forceplaced_programs.variant_name: variant_name
        dedup_contract:
          table: forceplaced_programs
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [enrolled, active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: forceplaced_agg_program_account
    subject: [forceplaced_premium_charged, forceplaced_lender_payment, forceplaced_premium_credit, forceplaced_refund_disbursed, forceplaced_program_suspended, forceplaced_program_reinstated]
    rule: >-
      Every certificate premium and credit of a program posts to that program's single account and appears on the
      statement for the calendar month in which it is posted (statement_month YYYY-MM); the statement_cycle is monthly,
      the statement is dated the first day of the following month, and it is due statement_due_days calendar days after
      its date. Lender payments are applied to the oldest open statement first. New placements are suspended only when
      the oldest unpaid statement is more than suspension_past_due_days calendar days past its due date, counted by
      adding the days to that due date on the calendar, the day itself not qualifying. While suspended, certificates
      already issued stay in force and renew, credits keep posting, and claims are paid. When reinstate_on_cure is true,
      placements resume once every past-due statement is paid. A credit balance on the account is refunded to the lender
      on its request or at termination.
    eligibility:
      - id: suspension_threshold
        applies_to: [forceplaced_program_suspended]
        kind: time
        condition: New placements are suspended only when the oldest unpaid statement is more than suspension_past_due_days calendar days past its due date, counted by adding the days to that due date on the calendar, the day itself not qualifying.
        evidence_fields: [forceplaced_programs.oldest_unpaid_due_date, forceplaced_programs.forceplaced_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.forceplaced_program_id]
          action_bindings:
            forceplaced_programs.forceplaced_program_id: forceplaced_program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the oldest unpaid statement
          anchor_source: forceplaced_programs.oldest_unpaid_due_date
          relation: not_before
          duration_source: variants.suspension_past_due_days
          unit: calendar_days
          counting_rule: counted by adding the days to that due date on the calendar, the day itself not qualifying
          boundary: exclusive
  - id: forceplaced_notice_and_placement
    subject: [forceplaced_notice_mailed, forceplaced_certificate_issued]
    rule: >-
      Tidemark tracks the lender's loans and mails borrower notices on the lender's behalf when tracking_included is
      true. When the Standard Flood Hazard Determination Form (determination_form) shows the building in a Special Flood
      Hazard Area and the borrower's flood coverage has lapsed or is below the mandatory purchase amount, a FIRST_NOTICE
      is mailed to the borrower stating the required amount; a SECOND_NOTICE is mailed second_notice_days_before_placement
      calendar days before the earliest placement date. A certificate is issued only after more than
      borrower_notice_days calendar days have passed since the first notice is mailed, counted by adding the days to the
      notice date on the calendar, the last day of the notice period not qualifying. A certificate is issued only under
      a program whose status is active. When sfha_only_placement is true no certificate is placed on a building outside a
      Special Flood Hazard Area. No certificate is issued when acceptable borrower evidence was received before
      placement, and no more than max_certificates_per_loan certificate may be in force on one loan. A borrower and
      lender who dispute the determination may jointly ask FEMA for a Letter of Determination Review within
      determination_review_days calendar days of the borrower's notification; the request does not stop placement, and a
      FEMA decision removing the building from the area is handled under the loan-event cancellation rule.
    eligibility:
      - id: forty_five_day_notice
        applies_to: [forceplaced_certificate_issued]
        kind: time
        condition: A certificate is issued only after more than borrower_notice_days calendar days have passed since the first notice is mailed, counted by adding the days to the notice date on the calendar, the last day of the notice period not qualifying.
        evidence_fields: [forceplaced_tracking.notice_date, forceplaced_tracking.notice_type, forceplaced_tracking.loan_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_tracking.loan_number]
          action_bindings:
            forceplaced_tracking.loan_number: loan_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the first notice is mailed
          anchor_source: forceplaced_tracking.notice_date
          relation: not_before
          duration_source: variants.borrower_notice_days
          unit: calendar_days
          counting_rule: counted by adding the days to the notice date on the calendar, the last day of the notice period not qualifying
          boundary: exclusive
      - id: program_active
        applies_to: [forceplaced_certificate_issued]
        kind: state
        condition: A certificate is issued only under a program whose status is active.
        evidence_fields: [forceplaced_programs.status, forceplaced_programs.forceplaced_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.forceplaced_program_id]
          action_bindings:
            forceplaced_programs.forceplaced_program_id: forceplaced_program_id
        state_contract:
          field: forceplaced_programs.status
          allowed: [active]
  - id: forceplaced_coverage_amount
    subject: [forceplaced_certificate_issued, forceplaced_certificate_renewed]
    rule: >-
      The mandatory purchase amount (required_amount) is the lowest of the loan's outstanding principal balance, the
      tier's nfip_max_building_reference and the building's insurable value. Under MANDATORY_MINIMUM the building limit
      is the required amount; under GAP_TO_MANDATORY it is the required amount less the building limit of the borrower's
      own policy in force; under REPLACEMENT_COST it is the insurable value. In every method the limit is rounded up to
      the next limit_rounding_increment and capped at max_certificate_building_limit, and when the result is below
      min_certificate_building_limit no certificate is issued. A contents limit is placed only when contents_available
      is true and business contents secure the loan, equal to the secured contents value capped at
      max_certificate_contents_limit. The amount is recomputed from the balances reported at each renewal.
    eligibility: []
    params:
      per_tier:
        Lender-Placed Flood – Residential Mandatory Amount: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Residential Gap: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Residential Replacement Cost: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Manufactured Home: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Commercial Building: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Commercial Building and Contents: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
    formula:
      required_amount: min(outstanding_principal_balance, nfip_max_building_reference, insurable_value)
      raw_limit: required_amount if coverage_amount_method == "MANDATORY_MINIMUM" else (required_amount - borrower_existing_limit if coverage_amount_method == "GAP_TO_MANDATORY" else insurable_value)
      contents_limit: min(secured_contents_value, max_certificate_contents_limit) if contents_available else 0
  - id: forceplaced_effective_date_premium
    subject: [forceplaced_certificate_issued, forceplaced_certificate_renewed, forceplaced_premium_charged]
    rule: >-
      When backdate_to_lapse_allowed is true and the first notice on the loan was mailed no later than
      auto_coverage_reporting_days calendar days after the lapse date, the certificate starts on the lapse date, so the
      lender may charge the borrower from the date coverage lapsed or became insufficient; otherwise it starts on the
      date it is issued. A certificate runs certificate_term_months calendar months from its start. The annual premium
      is the building limit divided by 100 times building_rate_per_100 plus the contents limit divided by 100 times
      contents_rate_per_100, rounded to the cent, and never less than minimum_certificate_premium; the full annual
      premium is billed to the lender on the statement for the month the certificate is issued or renewed.
    eligibility: []
    formula:
      annual_premium: max(minimum_certificate_premium, round(building_limit / 100 * building_rate_per_100 + contents_limit / 100 * contents_rate_per_100, 2))
  - id: forceplaced_evidence_cancellation
    subject: [forceplaced_evidence_received, forceplaced_certificate_cancelled, forceplaced_premium_credit]
    rule: >-
      Borrower evidence is acceptable only when it shows a flood policy — an NFIP policy, or a private policy carrying the
      private flood compliance aid statement or otherwise accepted in writing by the lender — on the same building, with
      a building limit at least the required amount, in force on the date reviewed, and naming the lender as mortgagee
      when evidence_requires_mortgagee_clause is true. Evidence that fails any of these leaves the certificate in force.
      On acceptable evidence the certificate is cancelled for BORROWER_COVERAGE_CONFIRMED, and the cancellation and its
      credit are processed no later than overlap_refund_days calendar days after the evidence is received, counted by
      adding the days to the received date on the calendar with the last day qualifying. When
      flat_cancel_when_evidence_covers_inception is true and the borrower's policy was in force on the certificate's
      start date, the cancellation is FLAT_CANCEL effective on that start date and the whole certificate premium is
      credited; otherwise it is PRO_RATA_CANCEL effective on the borrower policy's effective date and the credit is the
      annual premium multiplied by the days from that date to the certificate expiration date divided by the days in the
      certificate term, rounded to the cent. This overlap credit is due even when a claim was paid on the certificate.
      The lender must refund to the borrower any premium it charged for the overlap period.
    eligibility:
      - id: overlap_refund_deadline
        applies_to: [forceplaced_certificate_cancelled]
        kind: time
        condition: On acceptable evidence the certificate is cancelled for BORROWER_COVERAGE_CONFIRMED, and the cancellation and its credit are processed no later than overlap_refund_days calendar days after the evidence is received, counted by adding the days to the received date on the calendar with the last day qualifying.
        evidence_fields: [forceplaced_tracking.received_date, forceplaced_tracking.evidence_policy_number, forceplaced_tracking.loan_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_tracking.loan_number, forceplaced_tracking.evidence_policy_number]
          action_bindings:
            forceplaced_tracking.loan_number: loan_number
            forceplaced_tracking.evidence_policy_number: evidence_policy_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the evidence is received
          anchor_source: forceplaced_tracking.received_date
          relation: not_after
          duration_source: variants.overlap_refund_days
          unit: calendar_days
          counting_rule: counted by adding the days to the received date on the calendar with the last day qualifying
          boundary: inclusive
    formula:
      overlap_days: certificate_expiration_date - evidence_effective_date
      term_days: certificate_expiration_date - coverage_effective_date
      pro_rata_credit: round(annual_premium * overlap_days / term_days, 2)
  - id: forceplaced_loan_event_cancellation
    subject: [forceplaced_certificate_cancelled, forceplaced_premium_credit]
    rule: >-
      A certificate is also cancelled when the lender reports that the loan was paid off (LOAN_PAID_OFF, effective on the
      payoff date), that servicing moved to another servicer (SERVICING_TRANSFERRED, effective on the transfer date), or
      that a FEMA Letter of Map Amendment or Revision removed the building from the Special Flood Hazard Area
      (REMOVED_FROM_SFHA, effective on the letter's effective date). Each uses its tier's refund method, PRO_RATA: the
      credit is the annual premium multiplied by the days from the cancellation effective date to the certificate
      expiration date divided by the days in the certificate term, rounded to the cent. When no_credit_after_paid_claim
      is true and a claim on the certificate has a net payment above zero (forceplaced_msr_certificate_paid above zero),
      no credit is given for these three reasons.
    eligibility: []
    measures: [forceplaced_msr_certificate_paid]
  - id: forceplaced_renewal
    subject: [forceplaced_certificate_renewed, forceplaced_notice_mailed]
    rule: >-
      A RENEWAL_NOTICE is mailed to the borrower renewal_notice_days calendar days before a certificate expires. The
      certificate renews on its expiration date for another certificate_term_months when no acceptable borrower evidence
      has been received by then and the loan is still serviced by the lender with the building in a Special Flood
      Hazard Area; the limit and premium are recomputed from the balances reported at renewal. A certificate whose
      program is terminated does not renew.
    eligibility: []
  - id: forceplaced_program_termination
    subject: [forceplaced_program_terminated, forceplaced_program_activated, forceplaced_program_enrolled]
    rule: >-
      A program is set up on the lender's signed master policy application and takes effect on its program effective
      date. A lender ends a program only by a signed termination notice on file, taking effect no earlier than
      program_termination_notice_days calendar days after Tidemark receives it, and only on a program whose status is
      active or suspended. After termination no new certificate is issued; when runoff_certificates_honored is true the
      certificates already issued stay in force to their expiration and do not renew, and their credits and claims are
      still handled. Any credit balance remaining when the last certificate ends is refunded to the lender.
    eligibility:
      - id: signed_termination_on_file
        applies_to: [forceplaced_program_terminated]
        kind: authorization
        condition: A lender ends a program only by a signed termination notice on file, taking effect no earlier than program_termination_notice_days calendar days after Tidemark receives it, and only on a program whose status is active or suspended.
        evidence_fields: [forceplaced_requests.forceplaced_request_id, forceplaced_requests.outcome, forceplaced_requests.requested_effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_requests.forceplaced_request_id]
          action_bindings:
            forceplaced_requests.forceplaced_request_id: forceplaced_request_id
      - id: terminable_status
        applies_to: [forceplaced_program_terminated]
        kind: state
        condition: A lender ends a program only by a signed termination notice on file, taking effect no earlier than program_termination_notice_days calendar days after Tidemark receives it, and only on a program whose status is active or suspended.
        evidence_fields: [forceplaced_programs.status, forceplaced_programs.forceplaced_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.forceplaced_program_id]
          action_bindings:
            forceplaced_programs.forceplaced_program_id: forceplaced_program_id
        state_contract:
          field: forceplaced_programs.status
          allowed: [active, suspended, terminated]
  - id: forceplaced_claims
    subject: [forceplaced_claim_reported, forceplaced_adjuster_report, forceplaced_claim_paid, forceplaced_claim_payment_voided, forceplaced_claim_denied]
    rule: >-
      A claim is covered only when the date of loss falls on or after the certificate's coverage effective date and
      before its expiration or cancellation effective date. The adjuster contacts the borrower within
      adjuster_contact_hours elapsed hours, and the proof of loss is due within proof_of_loss_days calendar days of the
      date of loss. The building loss is taken at the tier's building_settlement_basis and the contents loss at actual
      cash value; each coverage bears its own deductible (building_deductible, contents_deductible) and is capped at the
      certificate limit. ICC, loss of use and basement contents are covered only as the tier's icc_coverage_limit,
      loss_of_use_covered and basement_contents_covered allow. A new payment on a coverage is the payable amount less
      what has been paid net of voids on that claim and coverage (forceplaced_msr_claim_part_paid), issued only when
      positive, payable to the claim_payee — the lender and the borrower jointly — and due within claim_payment_days
      calendar days of the agreed proof of loss. A denial states one denial_reason: NOT_A_FLOOD_EVENT,
      NO_COVERAGE_ON_DATE_OF_LOSS, PROOF_OF_LOSS_NOT_TIMELY, EXCLUDED_PROPERTY or LOSS_BELOW_DEDUCTIBLE.
    eligibility: []
    measures: [forceplaced_msr_claim_part_paid]
    formula:
      building_payable: min(building_limit, max(0, (building_rcv_loss if building_settlement_basis == "REPLACEMENT_COST" else building_acv_loss) - building_deductible))
      contents_payable: min(contents_limit, max(0, contents_acv_loss - contents_deductible))
