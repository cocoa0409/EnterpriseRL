# Tidemark Flood — Lender-Placed Flood master programs for mortgage lenders and servicers. The federal
# anchors are the mandatory purchase rules of the Flood Disaster Protection Act as amended by the
# Biggert-Waters Act (42 U.S.C. 4012a(e) and the federal banking agencies' flood insurance regulations):
# the lender notifies the borrower, may force-place coverage if the borrower has not obtained it within
# 45 days, may charge from the date coverage lapsed or became insufficient, and must terminate the
# force-placed coverage and refund overlapping premium within 30 days of receiving confirmation of the
# borrower's own coverage. Rates, premiums, deductibles, billing and servicing periods are Tidemark's own
# written program schedule. The customer is the lender or servicer that holds the master policy.
category: forceplaced
display_name: Lender-Placed Flood Master Programs

binding:
  holding_table: forceplaced_programs
  event_tables: [forceplaced_certificates, forceplaced_tracking, forceplaced_billing, forceplaced_claims]
  intake_tables: [forceplaced_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [enrolled, active, suspended, terminated]
  transitions:
    - {from: enrolled, to: active, by: system, means: The master policy takes effect on the program effective date and placements may begin.}
    - {from: active, to: suspended, by: agent, means: New placements are suspended because a monthly statement is past due beyond the suspension threshold.}
    - {from: suspended, to: active, by: agent, means: The past-due statements are paid and new placements resume.}
    - {from: active, to: terminated, by: user, means: The lender's signed termination notice takes effect.}
    - {from: suspended, to: terminated, by: user, means: The lender's signed termination notice takes effect while placements are suspended.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: The amount the lender owes on the program; certificate premiums and refunds paid out raise it, lender payments and cancellation credits lower it.
  - key: claim_paid
    unit: USD
    meaning: Net claim money issued under the program's certificates; payments raise it and voids lower it.

parameter_schema:
  occupancy_class: Kind of building the tier places; enum (RESIDENTIAL, MANUFACTURED, COMMERCIAL).
  coverage_amount_method: How the certificate building limit is set; enum (MANDATORY_MINIMUM, GAP_TO_MANDATORY, REPLACEMENT_COST).
  nfip_max_building_reference: NFIP maximum building limit for the occupancy, used in the mandatory purchase amount; USD.
  max_certificate_building_limit: Highest building limit one certificate carries; USD.
  min_certificate_building_limit: Lowest building limit Tidemark issues on a certificate; USD.
  contents_available: Whether contents coverage is placed where the lender's security interest covers contents; boolean.
  max_certificate_contents_limit: Highest contents limit on one certificate; USD (0 where unavailable).
  limit_rounding_increment: Increment to which a computed certificate limit is rounded up; USD.
  building_rate_per_100: Annual rate per 100 USD of certificate building limit; USD.
  contents_rate_per_100: Annual rate per 100 USD of certificate contents limit; USD (0 where unavailable).
  minimum_certificate_premium: Lowest annual premium of one certificate; USD.
  certificate_term_months: Term of one certificate from its coverage effective date; calendar months.
  premium_proration_basis: Basis for any partial-term premium or credit; enum (DAILY_PRO_RATA).
  building_deductible: Building deductible per loss on a certificate; USD.
  contents_deductible: Contents deductible per loss on a certificate; USD (0 where unavailable).
  building_settlement_basis: Basis for building losses; enum (ACTUAL_CASH_VALUE, REPLACEMENT_COST).
  contents_settlement_basis: Basis for contents losses; enum (ACTUAL_CASH_VALUE).
  icc_coverage_limit: Increased Cost of Compliance coverage on a certificate; USD (0 = not included).
  loss_of_use_covered: Whether additional living expense or business income is covered; boolean.
  basement_contents_covered: Whether contents in a basement are covered; boolean.
  borrower_notice_days: Days after the borrower notice is mailed before coverage may be placed when the borrower has not shown adequate coverage; calendar days.
  second_notice_days_before_placement: Days before the earliest placement date the reminder notice is mailed under Tidemark's tracking schedule; calendar days.
  overlap_refund_days: Days after confirmation of the borrower's coverage is received within which the certificate is cancelled and the overlap premium credited; calendar days.
  auto_coverage_reporting_days: Days after the borrower's coverage lapsed within which the lender's loan report lets the certificate start on the lapse date; calendar days.
  backdate_to_lapse_allowed: Whether a certificate may start on the lapse date rather than the placement date; boolean.
  sfha_only_placement: Whether certificates are placed only on buildings in a Special Flood Hazard Area per the Standard Flood Hazard Determination Form; boolean.
  determination_form: Form on which the lender's flood zone determination is made; text.
  determination_review_days: Days after the borrower is notified of the determination within which borrower and lender may jointly ask FEMA for a Letter of Determination Review; calendar days.
  evidence_requires_mortgagee_clause: Whether borrower evidence must name the lender as mortgagee to be acceptable; boolean.
  evidence_private_policy_rule: Which private policies are acceptable borrower evidence; enum (COMPLIANCE_AID_OR_LENDER_ACCEPTANCE).
  flat_cancel_when_evidence_covers_inception: Whether a certificate is cancelled from its start when the borrower's coverage was in force on that date; boolean.
  loan_payoff_refund_method: Credit method when the loan is paid off; enum (PRO_RATA).
  servicing_transfer_refund_method: Credit method when servicing of the loan moves to another servicer; enum (PRO_RATA).
  sfha_removal_refund_method: Credit method when a Letter of Map Amendment or Revision removes the building from the Special Flood Hazard Area; enum (PRO_RATA).
  no_credit_after_paid_claim: Whether a certificate with a paid claim earns its full premium; boolean.
  renewal_notice_days: Days before a certificate expires that the borrower renewal notice is mailed; calendar days.
  statement_cycle: Frequency of the lender's premium statement; enum (MONTHLY).
  statement_due_days: Days after the statement date the statement is due; calendar days.
  suspension_past_due_days: Days past due of the oldest unpaid statement after which new placements are suspended; calendar days.
  reinstate_on_cure: Whether placements resume once every past-due statement is paid; boolean.
  program_termination_notice_days: Days of written notice for the lender to terminate the master program; calendar days.
  runoff_certificates_honored: Whether certificates issued before termination run to their expiration; boolean.
  claim_payee: Payee of certificate claim payments; enum (LENDER_AND_BORROWER).
  proof_of_loss_days: Days after the date of loss within which the proof of loss must be received; calendar days.
  claim_payment_days: Days after the agreed proof of loss within which Tidemark pays; calendar days.
  adjuster_contact_hours: Tidemark standard for the adjuster's first contact; elapsed hours.
  max_certificates_per_loan: Certificates that may be in force on one loan and building at a time; count.
  tracking_included: Whether flood tracking and borrower notices are performed by Tidemark on the lender's behalf; boolean.

