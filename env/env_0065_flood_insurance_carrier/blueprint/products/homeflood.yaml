events:
  # ---- contract writes on the policy record ----
  - type: homeflood_policy_issued
    target: homeflood_policies
    mutation: create
    meaning: A HomeFlood policy is bound on a signed application with its first payment and waits in pending_effective until its effective date.
    grain: one row per policy issued
    fields:
      policy_number: HomeFlood policy number assigned at issue.
      variant_name: Tier written, as the official full tier name.
      property_address: Address of the insured home.
      flood_zone: FEMA flood zone of the property.
      building_coverage: Dwelling limit.
      contents_coverage: Personal property limit.
      deductible: Per-occurrence deductible.
      replacement_cost_value: Dwelling replacement cost value.
      application_date: Date the signed application and first payment were received.
      effective_date: Date coverage first attaches.
      term_start: Start of the first term.
      term_end: End of the first term.
      waiting_period_basis: Waiting rule that set the effective date.
      loan_closing_date: Loan closing date when bought for a closing.
      replaced_nfip_policy_number: NFIP policy replaced with no gap, when any.
      mortgage_required: Whether a lender requires the coverage.
      mortgagee_name: Mortgagee of record.
      loan_number: Mortgagee's loan number.
      compliance_aid_statement: Whether the policy carries the private flood compliance aid statement.
      payment_plan: Payment plan elected.
      premium_payor: Who pays the premium.
      ec_on_file: Whether an accepted Elevation Certificate is on file.
      elevation_difference_ft: Whole feet of the lowest floor above or below the base flood elevation.
      flood_openings_certified: Whether engineered flood openings are certified.
      excess_package: Whether the package credit condition was met at the term start.
      credits_applied_pct: Total credit percent applied to the term.
      term_premium: Rated annual premium for the term, before the policy fee and installment fees.
    triggers:
      - event: homeflood:homeflood_premium_charged
        map: {term_start: term_start, charge_basis: NEW_BUSINESS}
      - event: homeflood:homeflood_premium_payment
        map: {term_start: term_start}
  - type: homeflood_policy_effective
    target: homeflood_policies
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: Coverage attaches on the effective date once the waiting period has run.
    grain: one row per policy taking effect
    fields:
      effective_date: Date coverage attached.
    triggers: []
  - type: homeflood_term_renewed
    target: homeflood_policies
    mutation: update
    meaning: The renewal offer is accepted with payment by term end and the next term is booked on the same policy number.
    grain: one row per term renewed
    fields:
      term_start: Start of the renewed term.
      term_end: End of the renewed term.
      term_premium: Rated annual premium for the renewed term.
      excess_package: Whether the package credit condition was met at the renewed term start.
      credits_applied_pct: Credit percent applied to the renewed term.
      payment_plan: Payment plan for the renewed term.
    triggers:
      - event: homeflood:homeflood_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
  - type: homeflood_policy_expired
    target: homeflood_policies
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without the renewal being paid, or at the end of a term Tidemark non-renewed.
    grain: one row per expiration
    fields:
      closed_date: Term end at which coverage stopped.
    triggers: []
  - type: homeflood_policy_reinstated
    target: homeflood_policies
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired renewal is reinstated inside the reinstatement window on a signed statement of no loss, with the renewed term running from the prior term end.
    grain: one row per reinstatement
    fields:
      term_start: Start of the reinstated term (the prior term end).
      term_end: End of the reinstated term.
      term_premium: Rated annual premium for the reinstated term.
      closed_date: Cleared on reinstatement.
    triggers:
      - event: homeflood:homeflood_premium_charged
        map: {term_start: term_start, charge_basis: REINSTATEMENT}
  - type: homeflood_cancel_notice_issued
    target: homeflood_policies
    mutation: {transition: {from: active, to: pending_cancellation}}
    meaning: Tidemark issues a notice of cancellation for nonpayment or material misrepresentation that runs until its cancellation date.
    grain: one row per notice of cancellation
    fields:
      cancellation_reason: NONPAYMENT or MATERIAL_MISREPRESENTATION.
      cancellation_effective_date: Cancellation date stated on the notice.
    triggers:
      - event: homeflood:homeflood_notice_sent
        map: {notice_reason: cancellation_reason, notice_effective_date: cancellation_effective_date}
  - type: homeflood_cancel_notice_rescinded
    target: homeflood_policies
    mutation: {transition: {from: pending_cancellation, to: active}}
    meaning: The past-due amount arrives before the notice's cancellation date and the notice is withdrawn with no break in coverage.
    grain: one row per notice rescinded
    fields:
      cancellation_reason: Reset to NONE.
      cancellation_effective_date: Cleared.
    triggers: []
  - type: homeflood_insurer_cancelled
    target: homeflood_policies
    mutation: {transition: {from: pending_cancellation, to: cancelled}}
    meaning: The notice period runs out uncured and Tidemark cancels the policy on the notice's cancellation date.
    grain: one row per insurer cancellation
    fields:
      closed_date: Date the cancellation was processed.
    triggers:
      - event: homeflood:homeflood_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: homeflood_policy_cancelled
    target: homeflood_policies
    mutation: {transition: [{from: active, to: cancelled}, {from: pending_effective, to: cancelled}]}
    meaning: The named insured's signed cancellation request takes effect.
    grain: one row per insured cancellation
    fields:
      cancellation_reason: Reason on the signed request.
      cancellation_effective_date: Date the cancellation takes effect.
      closed_date: Date the cancellation was processed.
    triggers:
      - event: homeflood:homeflood_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: homeflood_coverage_updated
    target: homeflood_policies
    mutation: update
    meaning: An endorsement changes the limits, deductible, mortgagee or compliance status shown on the policy as of its effective date.
    grain: one row per endorsement applied
    fields:
      building_coverage: Dwelling limit after the endorsement.
      contents_coverage: Personal property limit after the endorsement.
      deductible: Deductible after the endorsement.
      mortgagee_name: Mortgagee after the endorsement.
      loan_number: Loan number after the endorsement.
      mortgage_required: Mortgage requirement after the endorsement.
      premium_payor: Premium payor after the endorsement.
      compliance_aid_statement: Compliance aid statement after the endorsement.
      term_premium: Full-term premium for the policy as endorsed.
    triggers: []
  - type: homeflood_rating_updated
    target: homeflood_policies
    mutation: update
    meaning: An accepted Elevation Certificate changes the elevation, openings or credits used to rate the term.
    grain: one row per rating change
    fields:
      ec_on_file: Whether an accepted certificate is on file.
      elevation_difference_ft: Whole feet above or below base flood elevation now used.
      flood_openings_certified: Whether engineered openings are certified.
      credits_applied_pct: Credit percent now applied.
      term_premium: Full-term premium as re-rated.
    triggers: []
  # ---- premium ledger ----
  - type: homeflood_premium_charged
    target: homeflood_billing
    meaning: One premium item is booked — a term premium, the policy fee, an installment fee or an endorsement's additional premium.
    grain: one row per premium item per term per booking occasion and installment
    distinguish_by: [component, term_start, charge_basis, reference_id, installment_number]
    fields:
      term_start: Term the item belongs to.
      component: Premium item booked.
      charge_basis: Occasion of the booking.
      amount: Item amount, positive.
      posted_date: Date booked.
      reference_id: Endorsement or certificate record behind an ENDORSEMENT or RERATE booking; empty otherwise.
      installment_number: Installment the fee belongs to; 0 when not an installment fee.
    account: premium_balance
    direction: in
    triggers: []
  - type: homeflood_premium_payment
    target: homeflood_billing
    meaning: A premium payment or installment is received.
    grain: one row per payment item received
    distinguish_by: [payment_ref, term_start]
    fields:
      term_start: Term the payment is applied to.
      amount: Amount received, positive.
      posted_date: Date received.
      payment_ref: Check number, ACH trace or card authorization.
      payment_method: How the payment was made.
      installment_number: Installment the payment settles; 1 for a down payment or annual payment.
    account: premium_balance
    direction: out
    triggers: []
  - type: homeflood_premium_credit
    target: homeflood_billing
    meaning: Unearned premium is credited back — on a cancellation, a mid-term reduction or a favorable re-rate.
    grain: one row per credited item per crediting occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term the credit belongs to.
      component: Premium item credited.
      charge_basis: CANCELLATION, ENDORSEMENT or RERATE.
      amount: Credited amount, positive.
      posted_date: Date booked.
      reference_id: Cancellation request, endorsement or certificate record behind the credit; the policy itself for an insurer cancellation.
    account: premium_balance
    direction: out
    triggers: []
  - type: homeflood_refund_disbursed
    target: homeflood_billing
    meaning: A credit balance on the policy is paid out to the payor of record.
    grain: one row per refund payment issued
    distinguish_by: [reference_id, payee]
    fields:
      amount: Refund paid, positive.
      posted_date: Date issued.
      reference_id: Record whose credit the refund settles.
      payee: Who receives the refund.
      payment_ref: Refund check or ACH reference.
    account: premium_balance
    direction: in
    triggers: []
  # ---- servicing documents ----
  - type: homeflood_endorsement_issued
    target: homeflood_changes
    meaning: A mid-term endorsement is recorded with its effective date.
    grain: one row per endorsement processed
    distinguish_by: [change_type, change_effective_date, recorded_date]
    fields:
      change_type: Kind of endorsement.
      change_effective_date: Date the endorsement takes effect.
      recorded_date: Date processed.
      new_building_coverage: Dwelling limit requested.
      new_contents_coverage: Personal property limit requested.
      new_deductible: Deductible requested.
      new_mortgagee_name: Mortgagee requested.
      new_loan_number: Loan number requested.
      revised_term_premium: Full-term premium for the policy as endorsed.
    triggers:
      - event: homeflood:homeflood_coverage_updated
        map: {building_coverage: new_building_coverage, contents_coverage: new_contents_coverage, deductible: new_deductible, mortgagee_name: new_mortgagee_name, loan_number: new_loan_number, term_premium: revised_term_premium}
      - event: homeflood:homeflood_premium_charged
        when: {change_type: [COVERAGE_INCREASE, DEDUCTIBLE_DECREASE]}
        map: {component: ENDORSEMENT_PREMIUM, charge_basis: ENDORSEMENT}
      - event: homeflood:homeflood_premium_credit
        when: {change_type: [COVERAGE_DECREASE, DEDUCTIBLE_INCREASE]}
        map: {component: TERM_PREMIUM, charge_basis: ENDORSEMENT}
  - type: homeflood_ec_received
    target: homeflood_changes
    meaning: An Elevation Certificate for the insured home is received and reviewed for rating.
    grain: one row per certificate received
    distinguish_by: [ec_survey_date, recorded_date]
    fields:
      recorded_date: Date received.
      change_effective_date: Date a favorable re-rate takes effect, or the next term start for an unfavorable one.
      ec_survey_date: Date the surveyor certified the elevations.
      ec_lowest_floor_elevation: Elevation of the top of the lowest floor.
      ec_base_flood_elevation: Base flood elevation at the building; empty when none is shown.
      ec_elevation_difference_ft: Lowest floor elevation minus base flood elevation, in whole feet rounded down.
      ec_flood_openings: Whether engineered flood openings are certified on the certificate.
      ec_applied: Whether the certificate is accepted and lowers the premium, so it is applied to the current term.
      revised_term_premium: Full-term premium re-rated with the certificate.
    triggers:
      - event: homeflood:homeflood_rating_updated
        when: {ec_applied: true}
        map: {elevation_difference_ft: ec_elevation_difference_ft, flood_openings_certified: ec_flood_openings, ec_on_file: true, term_premium: revised_term_premium}
  - type: homeflood_renewal_offered
    target: homeflood_changes
    meaning: The renewal offer for the coming term is issued with its rated premium.
    grain: one row per renewal offer
    distinguish_by: [renewal_term_start]
    fields:
      recorded_date: Date the offer was issued.
      renewal_term_start: Start of the offered term.
      revised_term_premium: Rated premium offered for the coming term.
    triggers: []
  - type: homeflood_notice_sent
    target: homeflood_changes
    meaning: A written notice of cancellation or non-renewal is sent to the insured and, when there is one, the mortgagee of record.
    grain: one row per notice sent
    distinguish_by: [notice_reason, notice_effective_date]
    fields:
      recorded_date: Date the notice was mailed.
      notice_reason: Why the notice is sent.
      notice_effective_date: Date the cancellation or non-renewal takes effect under the notice.
      notice_recipients: Who receives the notice.
    triggers: []
  # ---- claims ----
  - type: homeflood_claim_reported
    target: homeflood_claims
    meaning: A first notice of a flood loss is taken and a claim number assigned.
    grain: one row per claim reported
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      date_of_loss: Date the flood occurred.
      event_date: Date reported.
    triggers: []
  - type: homeflood_adjuster_report
    target: homeflood_claims
    meaning: The adjuster files a preliminary, final or supplemental report measuring the loss by coverage.
    grain: one row per adjuster report on a claim
    distinguish_by: [claim_number, report_type, event_date]
    fields:
      claim_number: Claim the report belongs to.
      date_of_loss: Date of loss.
      report_type: Kind of report.
      event_date: Date filed.
      dwelling_rcv_loss: Dwelling loss at replacement cost.
      dwelling_acv_loss: Dwelling loss at actual cash value.
      other_structures_loss: Detached structures loss at replacement cost.
      contents_rcv_loss: Personal property loss at replacement cost.
      contents_acv_loss: Personal property loss at actual cash value.
      basement_loss: Part of the dwelling and personal property loss located in a finished basement.
      pool_loss: Swimming pool repair, refill and debris removal cost.
      loss_of_use_incurred: Additional living expense incurred and documented to date.
    triggers: []
  - type: homeflood_proof_of_loss_filed
    target: homeflood_claims
    meaning: The insured's signed proof of loss is received.
    grain: one row per proof of loss received
    distinguish_by: [claim_number, coverage_part, event_date]
    fields:
      claim_number: Claim.
      date_of_loss: Date of loss.
      coverage_part: Coverage the proof of loss is for.
      claimed_amount: Amount sworn.
      event_date: Date received.
    triggers: []
  - type: homeflood_claim_paid
    target: homeflood_claims
    meaning: A claim payment for one coverage is issued.
    grain: one row per payment item
    distinguish_by: [claim_number, coverage_part, payment_ref]
    fields:
      claim_number: Claim.
      coverage_part: Coverage paid.
      payment_amount: Amount paid, positive.
      payment_ref: Claim check or ACH reference.
      payee: Payee line.
      event_date: Date issued.
    account: claim_paid
    direction: in
    triggers: []
  - type: homeflood_claim_payment_voided
    target: homeflood_claims
    meaning: An issued claim payment is voided before reissue.
    grain: one row per payment item voided
    distinguish_by: [payment_ref]
    fields:
      claim_number: Claim.
      coverage_part: Coverage of the voided payment.
      payment_amount: Amount voided, positive.
      payment_ref: Reference of the voided item.
      event_date: Date voided.
    account: claim_paid
    direction: out
    triggers: []
  - type: homeflood_claim_denied
    target: homeflood_claims
    meaning: Tidemark denies all or part of a claim in writing for one coverage.
    grain: one row per written denial per coverage
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim.
      coverage_part: Coverage denied.
      denial_reason: Reason stated.
      event_date: Date of the denial.
    triggers: []

measures:
  - id: homeflood_msr_term_claims_paid
    window: The current policy term, from term_start inclusive to term_end exclusive, judged by each claim's date_of_loss.
    measure: Count of distinct claim_number values on the policy with a date_of_loss inside the window whose net payment (homeflood_claim_paid payment_amount minus homeflood_claim_payment_voided payment_amount) is above zero.
  - id: homeflood_msr_paid_claims_lookback
    window: The claims_free_years years ending the day before the term_start being rated (for a term starting 2026-06-01 with 3 years, 2023-06-01 through 2026-05-31), judged by each claim's date_of_loss.
    measure: Count of distinct claims with a net payment above zero at the same property address under any Tidemark residential flood policy of the customer — HomeFlood claims (homeflood_claims) and NFIP Dwelling Form claims (dwelling_claims) alike.
  - id: homeflood_msr_claim_part_paid
    window: The whole life of one claim_number, for one coverage_part.
    measure: Sum of payment_amount on homeflood_claim_paid rows minus sum of payment_amount on homeflood_claim_payment_voided rows for that claim_number and coverage_part.

policies:
  - id: homeflood_agg_multi_holding
    subject: [homeflood_policy_issued]
    rule: >-
      A customer may hold any number of HomeFlood policies, one for each home at a different property address; there
      is no per-customer cap. Each policy is rated, billed, renewed and cancelled on its own, and nothing on one policy
      is pooled into or offset against another policy of the same customer.
    eligibility: []
    params:
      max_per_customer: null
  - id: homeflood_agg_property_combination
    subject: [homeflood_policy_issued, homeflood_term_renewed]
    rule: >-
      Only one HomeFlood policy may be live on a property address: a new policy is issued only when no other HomeFlood
      policy at the same property address is in status pending_effective, active or pending_cancellation. Tidemark does
      not write HomeFlood over its own live NFIP Dwelling Form building policy on the same building: when the customer
      holds a Dwelling Form policy with building coverage at the same property address in status pending_effective,
      in_force or renewal_grace, HomeFlood can be issued only with the waiting_period_basis NFIP_REPLACEMENT, its
      effective date equal to the date the NFIP policy's cancellation (reason REPLACED_BY_PRIVATE_FLOOD) takes effect,
      and the NFIP policy number recorded in replaced_nfip_policy_number. Holding a Tidemark Excess Flood policy in
      status active at the same property address on the term start earns the package credit for that term; the
      credit is decided at issue and at each renewal and is not added or removed mid-term.
    eligibility:
      - id: one_live_homeflood_per_address
        applies_to: [homeflood_policy_issued]
        kind: dedup
        condition: 'Only one HomeFlood policy may be live on a property address: a new policy is issued only when no other HomeFlood policy at the same property address is in status pending_effective, active or pending_cancellation.'
        evidence_fields: [homeflood_policies.property_address, homeflood_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.property_address]
          action_bindings:
            homeflood_policies.property_address: property_address
        dedup_contract:
          table: homeflood_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [pending_effective, active, pending_cancellation]}
          distinct_fields: []
    params:
      package_credit_source: Tidemark Excess Flood policy, status active, same property address, on the term start
  - id: homeflood_limits_deductible_compliance
    subject: [homeflood_policy_issued, homeflood_endorsement_issued, homeflood_coverage_updated]
    rule: >-
      The dwelling limit must lie between the tier's min_building_coverage and max_building_coverage and may not exceed
      the replacement_cost_value, and the replacement_cost_value must be at least min_replacement_cost_value; the
      personal property limit must lie between min_contents_coverage and max_contents_coverage. Limits are written in
      whole multiples of coverage_increment. The deductible is one per-occurrence amount from the tier's
      deductible_options, not below min_deductible, with default_deductible when none is elected. The policy carries
      the private flood compliance aid statement only when the tier's meets_mandatory_purchase_definition is true and
      the elected deductible is no more than compliance_aid_max_deductible; the statement is re-decided on every
      endorsement that changes the deductible. A mortgage-required policy is written only when it carries the
      compliance aid statement, because only then must the lender accept it in place of NFIP coverage; a request that
      would leave a mortgage-required policy without the statement is not processed.
    eligibility:
      - id: mortgage_required_needs_statement
        applies_to: [homeflood_policy_issued, homeflood_endorsement_issued]
        kind: caller_fact
        condition: A mortgage-required policy is written only when it carries the compliance aid statement, because only then must the lender accept it in place of NFIP coverage; a request that would leave a mortgage-required policy without the statement is not processed.
        evidence_fields: [homeflood_policies.mortgage_required, homeflood_policies.compliance_aid_statement, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
    params:
      per_tier:
        HomeFlood Renters: {meets_mandatory_purchase_definition: =meets_mandatory_purchase_definition, max_building_coverage: =max_building_coverage, min_deductible: =min_deductible}
        HomeFlood Essential: {meets_mandatory_purchase_definition: =meets_mandatory_purchase_definition, max_building_coverage: =max_building_coverage, min_deductible: =min_deductible}
        HomeFlood Standard: {meets_mandatory_purchase_definition: =meets_mandatory_purchase_definition, max_building_coverage: =max_building_coverage, min_deductible: =min_deductible}
        HomeFlood Plus: {meets_mandatory_purchase_definition: =meets_mandatory_purchase_definition, max_building_coverage: =max_building_coverage, min_deductible: =min_deductible}
        HomeFlood Premier: {meets_mandatory_purchase_definition: =meets_mandatory_purchase_definition, max_building_coverage: =max_building_coverage, min_deductible: =min_deductible}
        HomeFlood Estate: {meets_mandatory_purchase_definition: =meets_mandatory_purchase_definition, max_building_coverage: =max_building_coverage, min_deductible: =min_deductible}
    formula:
      compliance_aid_statement: meets_mandatory_purchase_definition and deductible <= compliance_aid_max_deductible
  - id: homeflood_waiting_period
    subject: [homeflood_policy_issued, homeflood_policy_effective, homeflood_endorsement_issued]
    rule: >-
      A new policy, and a mid-term increase of a limit or decrease of the deductible, takes effect at 12:01 a.m. on the
      day standard_waiting_days calendar days after the date the signed application (or endorsement request) and the
      first payment are received, and the basis recorded is STANDARD. When the purchase or increase is required for a
      home purchase or refinance, the closing exception applies only when the application and first payment are received
      no later than the date the loan closes, counted on the calendar with the closing day itself qualifying; coverage then
      takes effect on the loan closing date with loan_closing_waiting_days and the basis is LOAN_CLOSING. When the
      policy replaces an NFIP policy on the same building with no gap, coverage takes effect on the date the NFIP
      coverage ends with nfip_replacement_waiting_days and the basis is NFIP_REPLACEMENT. A reduction of a limit or
      increase of the deductible takes effect on the date the signed request is received. A loss that begins before
      coverage or an increase takes effect is not covered by it.
    eligibility:
      - id: closing_exception_received_by_closing
        applies_to: [homeflood_policy_issued, homeflood_endorsement_issued]
        kind: time
        condition: When the purchase or increase is required for a home purchase or refinance, the closing exception applies only when the application and first payment are received no later than the date the loan closes, counted on the calendar with the closing day itself qualifying; coverage then takes effect on the loan closing date with loan_closing_waiting_days and the basis is LOAN_CLOSING.
        evidence_fields: [homeflood_policies.loan_closing_date, homeflood_policies.application_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.loan_closing_date]
          action_bindings:
            homeflood_policies.loan_closing_date: loan_closing_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the loan closes
          anchor_source: homeflood_policies.loan_closing_date
          relation: not_after
          duration_source: variants.loan_closing_waiting_days
          unit: calendar_days
          counting_rule: counted on the calendar with the closing day itself qualifying
          boundary: inclusive
  - id: homeflood_premium_rating
    subject: [homeflood_policy_issued, homeflood_term_renewed, homeflood_premium_charged, homeflood_renewal_offered]
    rule: >-
      The annual term premium is rated on Tidemark's HomeFlood schedule. The dwelling part is the dwelling limit divided
      by 100 times building_rate_per_100, and the personal property part is the personal property limit divided by 100
      times contents_rate_per_100. Their sum is multiplied by the zone factor for the property's flood_zone from
      zone_factor_table, by the elevation factor and by the factor for the elected deductible from
      deductible_factor_table. The elevation factor is no_ec_factor_non_sfha for a property in zone X, B, C or D; for a
      property in any other zone it is the elevation_factor_table row for elevation_difference_ft when an accepted
      Elevation Certificate showing a base flood elevation is on file — a difference of 4 feet or more takes the "+4 or
      more" row and a difference of -2 feet or lower takes the "-2 or lower" row — and no_ec_factor_sfha when none is
      on file. The total credit percent from the credit rule then reduces the result. The term premium is that reduced
      amount plus loss_of_use_premium, rounded to the cent once at the end, and never less than minimum_premium. The
      policy_fee is booked in addition for each term and is not subject to factors, credits or the minimum. Each term
      is booked as a TERM_PREMIUM item and a POLICY_FEE item; installment fees are booked as each installment falls due.
    eligibility: []
    params:
      per_tier:
        HomeFlood Renters: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium, loss_of_use_premium: =loss_of_use_premium}
        HomeFlood Essential: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium, loss_of_use_premium: =loss_of_use_premium}
        HomeFlood Standard: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium, loss_of_use_premium: =loss_of_use_premium}
        HomeFlood Plus: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium, loss_of_use_premium: =loss_of_use_premium}
        HomeFlood Premier: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium, loss_of_use_premium: =loss_of_use_premium}
        HomeFlood Estate: {building_rate_per_100: =building_rate_per_100, contents_rate_per_100: =contents_rate_per_100, minimum_premium: =minimum_premium, loss_of_use_premium: =loss_of_use_premium}
    formula:
      base_rate_amount: building_coverage / 100 * building_rate_per_100 + contents_coverage / 100 * contents_rate_per_100
      elevation_factor: no_ec_factor_non_sfha if flood_zone in ["X", "B", "C", "D"] else (elevation_factor_table[min(4, max(-2, elevation_difference_ft))] if ec_on_file else no_ec_factor_sfha)
      factored: base_rate_amount * zone_factor_table[flood_zone] * elevation_factor * deductible_factor_table[deductible]
      term_premium: max(minimum_premium, round(factored * (1 - credits_applied_pct / 100) + loss_of_use_premium, 2))
  - id: homeflood_credits
    subject: [homeflood_policy_issued, homeflood_term_renewed, homeflood_rating_updated]
    rule: >-
      Three credits exist and are decided at issue, at each renewal, and on a rating change from an accepted Elevation
      Certificate. The mitigation credit of mitigation_credit_pct applies when the accepted certificate on file certifies
      engineered flood openings. The claims-free credit of claims_free_credit_pct applies when the customer has held
      Tidemark flood coverage on the property, under HomeFlood or an NFIP Dwelling Form policy, since a date on or before
      the start of the lookback period and no claim with a net payment above zero has a date of loss in the lookback
      period (homeflood_msr_paid_claims_lookback is zero). The package credit of package_credit_pct applies under the
      property-combination rule and is recorded as excess_package. Credits are added together, never multiplied, and the sum is capped at
      max_combined_credit_pct; a credit whose condition is not met is not applicable, not zero-rated. The capped sum is
      recorded as credits_applied_pct and used by the rating rule.
    eligibility: []
    measures: [homeflood_msr_paid_claims_lookback]
    formula:
      credits_applied_pct: min(max_combined_credit_pct, (mitigation_credit_pct if flood_openings_certified else 0) + (claims_free_credit_pct if homeflood_msr_paid_claims_lookback == 0 else 0) + (package_credit_pct if excess_package else 0))
  - id: homeflood_payment_plans
    subject: [homeflood_premium_charged, homeflood_premium_payment, homeflood_cancel_notice_issued, homeflood_cancel_notice_rescinded, homeflood_insurer_cancelled]
    rule: >-
      The term premium is paid under one of the tier's payment_plans. ANNUAL collects the whole term premium and policy
      fee at the start. SEMI_ANNUAL collects the down share at the start and the remaining share on the day 6 calendar
      months after term_start. QUARTERLY collects the down share at the start and equal shares 3, 6 and 9 calendar
      months after term_start; a due date that falls on a day the month lacks moves to that month's last day. The policy fee is collected in full with the first payment, each installment after the
      first carries installment_fee, every installment is rounded to the cent and the last installment absorbs the
      rounding difference. When the premium is paid by the lender from escrow the plan is escrow_billed_plan. An
      installment not received by its due date is past due, and Tidemark may then issue a notice of cancellation for
      nonpayment whose cancellation date is nonpayment_notice_days calendar days after the notice date; the notice is
      also sent to the mortgagee of record. A notice of cancellation is rescinded only when the full past-due amount is
      received before the cancellation date stated on the notice, the day itself not qualifying; the policy then
      continues with no break in coverage. A payment received on or after the cancellation date does not reinstate the
      policy; it is applied to any earned premium still owed and the rest is refunded.
    eligibility:
      - id: rescission_before_cancellation_date
        applies_to: [homeflood_cancel_notice_rescinded]
        kind: time
        condition: A notice of cancellation is rescinded only when the full past-due amount is received before the cancellation date stated on the notice, the day itself not qualifying; the policy then continues with no break in coverage.
        evidence_fields: [homeflood_policies.cancellation_effective_date, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation date stated on the notice
          anchor_source: homeflood_policies.cancellation_effective_date
          relation: not_after
          duration_source: params.rescission_offset_days
          unit: calendar_days
          counting_rule: the day itself not qualifying
          boundary: exclusive
      - id: rescind_only_pending
        applies_to: [homeflood_cancel_notice_rescinded]
        kind: state
        condition: A notice of cancellation is rescinded only when the full past-due amount is received before the cancellation date stated on the notice, the day itself not qualifying; the policy then continues with no break in coverage.
        evidence_fields: [homeflood_policies.status, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
        state_contract:
          field: homeflood_policies.status
          allowed: [pending_cancellation, active]
    params:
      rescission_offset_days: 0
      down_share_pct: {ANNUAL: 100, SEMI_ANNUAL: 50, QUARTERLY: 40}
      later_installment_share_pct: {ANNUAL: 0, SEMI_ANNUAL: 50, QUARTERLY: 20}
      later_installment_months: {ANNUAL: [], SEMI_ANNUAL: [6], QUARTERLY: [3, 6, 9]}
  - id: homeflood_ec_rating
    subject: [homeflood_ec_received, homeflood_rating_updated, homeflood_premium_credit]
    rule: >-
      An Elevation Certificate is accepted for rating only when it is on FEMA Form 086-0-33, completed and sealed by a
      licensed land surveyor, engineer or architect, and its survey date is no more than ec_max_age_years before the
      date Tidemark receives it, with no alteration to the building since the survey. The elevation difference is the
      certified lowest floor elevation minus the base flood elevation, rounded down to the whole foot; a certificate
      with no base flood elevation feeds only the openings credit. Tidemark re-rates the current term with the
      certificate. When the re-rated term premium is lower, the certificate is applied (ec_applied true) from the date it
      is received and the reduction is credited as a RERATE credit equal to the fall in the full-term premium multiplied
      by the days from the receipt date to term_end divided by the days from term_start to term_end, rounded to the
      cent. When the re-rated premium is not lower, the certificate is kept on file and applied from the next term
      start through the renewal rating. A certificate is applied mid-term only on a policy whose status is
      pending_effective or active.
    eligibility:
      - id: ec_midterm_status
        applies_to: [homeflood_rating_updated]
        kind: state
        condition: A certificate is applied mid-term only on a policy whose status is pending_effective or active.
        evidence_fields: [homeflood_policies.status, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
        state_contract:
          field: homeflood_policies.status
          allowed: [pending_effective, active]
    formula:
      days_remaining: term_end - change_effective_date
      term_days: term_end - term_start
      rerate_credit: round((term_premium - revised_term_premium) * days_remaining / term_days, 2)
  - id: homeflood_endorsements
    subject: [homeflood_endorsement_issued, homeflood_coverage_updated, homeflood_premium_charged, homeflood_premium_credit]
    rule: >-
      A mid-term endorsement is one of COVERAGE_INCREASE, COVERAGE_DECREASE, DEDUCTIBLE_DECREASE, DEDUCTIBLE_INCREASE or
      MORTGAGEE_CHANGE and is processed only on a policy whose status is pending_effective or active. The policy as
      endorsed is re-rated for the full term on the rating rule with the credits already applied to the term, giving the
      revised term premium. An increase in the full-term premium is booked as an ENDORSEMENT_PREMIUM item, and a
      decrease as an ENDORSEMENT credit of the TERM_PREMIUM item, each equal to the change in the full-term premium
      multiplied by the days from the endorsement effective date to term_end divided by the days from term_start to
      term_end, rounded to the cent. The effective date follows the waiting-period rule. A MORTGAGEE_CHANGE takes
      effect on the date recorded with no premium change, and the compliance aid statement is re-decided whenever the
      deductible changes.
    eligibility:
      - id: endorsable_status
        applies_to: [homeflood_endorsement_issued]
        kind: state
        condition: A mid-term endorsement is one of COVERAGE_INCREASE, COVERAGE_DECREASE, DEDUCTIBLE_DECREASE, DEDUCTIBLE_INCREASE or MORTGAGEE_CHANGE and is processed only on a policy whose status is pending_effective or active.
        evidence_fields: [homeflood_policies.status, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
        state_contract:
          field: homeflood_policies.status
          allowed: [pending_effective, active]
    formula:
      days_remaining: term_end - change_effective_date
      term_days: term_end - term_start
      pro_rata_change: round((revised_term_premium - term_premium) * days_remaining / term_days, 2)
  - id: homeflood_renewal
    subject: [homeflood_renewal_offered, homeflood_term_renewed, homeflood_policy_expired, homeflood_policy_reinstated, homeflood_notice_sent]
    rule: >-
      Tidemark issues the renewal offer renewal_offer_days calendar days before term_end, rated on the schedule in
      effect for the coming term with the credits re-decided as of the coming term start. The renewal is booked when the
      first payment of the coming term under the elected plan is received on or before term_end. When it is not, the
      policy expires at term_end. An expired policy is reinstated only when the signed statement of no loss and the
      first payment are received no later than reinstatement_window_days calendar days after the term end, counted by
      adding the days to term_end on the calendar with the last day qualifying; the reinstated term runs from the prior
      term_end, but no loss that began between the term end and the reinstatement date is covered. After the window a
      new application with a new waiting period is required. Tidemark may non-renew a policy only by written notice to
      the insured and the mortgagee of record mailed at least insurer_cancellation_notice_days calendar days before
      term_end.
    eligibility:
      - id: reinstatement_window
        applies_to: [homeflood_policy_reinstated]
        kind: time
        condition: An expired policy is reinstated only when the signed statement of no loss and the first payment are received no later than reinstatement_window_days calendar days after the term end, counted by adding the days to term_end on the calendar with the last day qualifying; the reinstated term runs from the prior term_end, but no loss that began between the term end and the reinstatement date is covered.
        evidence_fields: [homeflood_policies.term_end, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term end
          anchor_source: homeflood_policies.term_end
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: counted by adding the days to term_end on the calendar with the last day qualifying
          boundary: inclusive
      - id: reinstate_only_expired
        applies_to: [homeflood_policy_reinstated]
        kind: authorization
        condition: An expired policy is reinstated only when the signed statement of no loss and the first payment are received no later than reinstatement_window_days calendar days after the term end, counted by adding the days to term_end on the calendar with the last day qualifying; the reinstated term runs from the prior term_end, but no loss that began between the term end and the reinstatement date is covered.
        evidence_fields: [homeflood_requests.homeflood_request_id, homeflood_requests.request_type, homeflood_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_requests.homeflood_request_id]
          action_bindings:
            homeflood_requests.homeflood_request_id: homeflood_request_id
  - id: homeflood_cancellation_refund
    subject: [homeflood_policy_cancelled, homeflood_premium_credit, homeflood_refund_disbursed]
    rule: >-
      The named insured may cancel at any time, but a cancellation is processed only on the named insured's signed
      cancellation request on file for the policy, and only on a policy whose status is pending_effective or active,
      which it leaves cancelled. The request states one reason: PROPERTY_SOLD takes effect on the closing date shown on
      the settlement statement; REPLACED_COVERAGE takes effect on the effective date of the replacing flood policy shown
      on its declarations; NO_LONGER_REQUIRED and INSURED_REQUEST take effect on the date the signed request is received,
      or a later date the insured names. A cancellation of a mortgage-required policy for NO_LONGER_REQUIRED or
      INSURED_REQUEST needs the lender's written release on file, and one for REPLACED_COVERAGE needs the replacing
      policy's declarations naming the same mortgagee. The refund follows cancellation_refund_method: the unearned share
      of the term premium and of any ENDORSEMENT_PREMIUM items, net of ENDORSEMENT and RERATE credits already given, is
      the full-term net amount multiplied by the days from the cancellation effective date to term_end divided by the
      days from term_start to term_end, rounded to the cent. The policy fee and installment fees are fully earned when
      policy_fee_refundable is false. When no_refund_after_paid_claim is true and a claim with a date of loss in the
      current term has a net payment above zero (homeflood_msr_term_claims_paid above zero), the term premium is fully
      earned and no credit is booked. The credit is first set against any amount still owed on the policy, and only a
      remaining credit balance is refunded, to the lender when premium_payor is LENDER_ESCROW and to the insured
      otherwise.
    eligibility:
      - id: signed_request_on_file
        applies_to: [homeflood_policy_cancelled]
        kind: authorization
        condition: The named insured may cancel at any time, but a cancellation is processed only on the named insured's signed cancellation request on file for the policy, and only on a policy whose status is pending_effective or active, which it leaves cancelled.
        evidence_fields: [homeflood_requests.homeflood_request_id, homeflood_requests.outcome, homeflood_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_requests.homeflood_request_id]
          action_bindings:
            homeflood_requests.homeflood_request_id: homeflood_request_id
      - id: cancellable_status
        applies_to: [homeflood_policy_cancelled]
        kind: state
        condition: The named insured may cancel at any time, but a cancellation is processed only on the named insured's signed cancellation request on file for the policy, and only on a policy whose status is pending_effective or active, which it leaves cancelled.
        evidence_fields: [homeflood_policies.status, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
        state_contract:
          field: homeflood_policies.status
          allowed: [pending_effective, active, cancelled]
      - id: lender_release_when_required
        applies_to: [homeflood_policy_cancelled]
        kind: authorization
        condition: A cancellation of a mortgage-required policy for NO_LONGER_REQUIRED or INSURED_REQUEST needs the lender's written release on file, and one for REPLACED_COVERAGE needs the replacing policy's declarations naming the same mortgagee.
        evidence_fields: [homeflood_policies.mortgage_required, homeflood_requests.supporting_document, homeflood_requests.homeflood_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_requests.homeflood_request_id]
          action_bindings:
            homeflood_requests.homeflood_request_id: homeflood_request_id
    measures: [homeflood_msr_term_claims_paid]
    formula:
      days_unearned: term_end - cancellation_effective_date
      term_days: term_end - term_start
      unearned_credit: round(amount * days_unearned / term_days, 2)
  - id: homeflood_insurer_notices
    subject: [homeflood_cancel_notice_issued, homeflood_insurer_cancelled, homeflood_notice_sent, homeflood_premium_credit]
    rule: >-
      Tidemark cancels a policy mid-term only for NONPAYMENT of a past-due installment or for MATERIAL_MISREPRESENTATION
      in the application, and only by a written notice mailed to the insured and to the mortgagee of record. A notice
      for NONPAYMENT gives nonpayment_notice_days calendar days, and a notice for MATERIAL_MISREPRESENTATION gives
      insurer_cancellation_notice_days calendar days, counted from the mailing date to the cancellation date stated on
      the notice. A notice of cancellation is issued only on a policy whose status is active, and moves it to
      pending_cancellation. When the notice runs out uncured, the policy is cancelled on the stated date and the
      unearned share of the net term premium after that date is credited pro rata by days with no paid-claim bar; the
      credit is set against any earned premium still owed and only a remaining credit balance is refunded to the payor
      of record.
    eligibility:
      - id: notice_only_active
        applies_to: [homeflood_cancel_notice_issued]
        kind: state
        condition: A notice of cancellation is issued only on a policy whose status is active, and moves it to pending_cancellation.
        evidence_fields: [homeflood_policies.status, homeflood_policies.homeflood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_policies.homeflood_policy_id]
          action_bindings:
            homeflood_policies.homeflood_policy_id: homeflood_policy_id
        state_contract:
          field: homeflood_policies.status
          allowed: [active, pending_cancellation]
    params:
      per_tier:
        HomeFlood Renters: {nonpayment_notice_days: =nonpayment_notice_days, insurer_cancellation_notice_days: =insurer_cancellation_notice_days}
        HomeFlood Essential: {nonpayment_notice_days: =nonpayment_notice_days, insurer_cancellation_notice_days: =insurer_cancellation_notice_days}
        HomeFlood Standard: {nonpayment_notice_days: =nonpayment_notice_days, insurer_cancellation_notice_days: =insurer_cancellation_notice_days}
        HomeFlood Plus: {nonpayment_notice_days: =nonpayment_notice_days, insurer_cancellation_notice_days: =insurer_cancellation_notice_days}
        HomeFlood Premier: {nonpayment_notice_days: =nonpayment_notice_days, insurer_cancellation_notice_days: =insurer_cancellation_notice_days}
        HomeFlood Estate: {nonpayment_notice_days: =nonpayment_notice_days, insurer_cancellation_notice_days: =insurer_cancellation_notice_days}
  - id: homeflood_claim_intake_pol
    subject: [homeflood_claim_reported, homeflood_adjuster_report, homeflood_proof_of_loss_filed]
    rule: >-
      A claim is taken for direct physical loss by flood to insured property at the insured address. A claim is covered
      only when the date of loss falls on or after the date the coverage took effect and before the cancellation
      effective date or term_end, and not within a lapse between an expiration and a reinstatement. The adjuster
      contacts the insured within adjuster_contact_hours elapsed hours of the report, and every report measures the
      dwelling loss at replacement cost and actual cash value, the other structures loss, the personal property loss at
      replacement cost and actual cash value, the part of the loss in a finished basement, the pool loss and the loss
      of use incurred; a FINAL report supersedes earlier ones and a later SUPPLEMENTAL report supersedes it for what it
      measures. A proof of loss is accepted only when it is received no later than proof_of_loss_days calendar days
      after the date of loss, counted by adding the days to date_of_loss on the calendar with the last day qualifying.
      Tidemark pays within claim_payment_days calendar days after agreeing the proof of loss. When the insured and
      Tidemark disagree on the amount of loss and appraisal_available is true, either may demand appraisal.
    eligibility:
      - id: loss_inside_coverage_period
        applies_to: [homeflood_claim_reported]
        kind: caller_fact
        condition: A claim is covered only when the date of loss falls on or after the date the coverage took effect and before the cancellation effective date or term_end, and not within a lapse between an expiration and a reinstatement.
        evidence_fields: [homeflood_claims.date_of_loss, homeflood_policies.effective_date, homeflood_policies.term_end, homeflood_policies.cancellation_effective_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [homeflood_claims.date_of_loss]
          action_bindings:
            homeflood_claims.date_of_loss: date_of_loss
      - id: pol_deadline
        applies_to: [homeflood_proof_of_loss_filed]
        kind: time
        condition: A proof of loss is accepted only when it is received no later than proof_of_loss_days calendar days after the date of loss, counted by adding the days to date_of_loss on the calendar with the last day qualifying.
        evidence_fields: [homeflood_claims.date_of_loss, homeflood_claims.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homeflood_claims.claim_number]
          action_bindings:
            homeflood_claims.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of loss
          anchor_source: homeflood_claims.date_of_loss
          relation: not_after
          duration_source: variants.proof_of_loss_days
          unit: calendar_days
          counting_rule: counted by adding the days to date_of_loss on the calendar with the last day qualifying
          boundary: inclusive
  - id: homeflood_claim_settlement
    subject: [homeflood_claim_paid, homeflood_claim_payment_voided]
    rule: >-
      Each coverage is settled from the latest governing adjuster report. The dwelling loss is taken at replacement cost
      when building_rc_available is true and the dwelling limit is at least rc_insurance_to_value_pct of the
      replacement_cost_value, and at actual cash value otherwise; the part of the basement loss above
      finished_basement_limit is removed from the dwelling loss. Other structures are paid at replacement cost up to
      other_structures_pct of the dwelling limit. Personal property is taken at the tier's contents_settlement_basis.
      The pool loss is paid up to pool_repair_limit. One per-occurrence deductible applies once to the whole claim,
      taken first from the dwelling loss, then any remainder from other structures, then personal property, then the
      pool. Each coverage is then capped at its limit. Loss of use is paid as incurred up to loss_of_use_limit for no
      longer than loss_of_use_max_months after the date of loss, and loss-avoidance costs up to loss_avoidance_limit,
      neither bearing the deductible. A new payment on a coverage is its payable amount less what has already been paid
      net of voids on that claim and coverage (homeflood_msr_claim_part_paid), issued only when positive. Dwelling and
      other-structures payments name the mortgagee of record with the insured; the others go to the insured alone. A
      void reverses one issued payment item in full by its reference and the amount is reissued under a new reference.
    eligibility: []
    params:
      deductible_order: [DWELLING, OTHER_STRUCTURES, PERSONAL_PROPERTY, POOL]
      per_tier:
        HomeFlood Renters: {contents_settlement_basis: =contents_settlement_basis, building_rc_available: =building_rc_available, finished_basement_limit: =finished_basement_limit, loss_of_use_limit: =loss_of_use_limit}
        HomeFlood Essential: {contents_settlement_basis: =contents_settlement_basis, building_rc_available: =building_rc_available, finished_basement_limit: =finished_basement_limit, loss_of_use_limit: =loss_of_use_limit}
        HomeFlood Standard: {contents_settlement_basis: =contents_settlement_basis, building_rc_available: =building_rc_available, finished_basement_limit: =finished_basement_limit, loss_of_use_limit: =loss_of_use_limit}
        HomeFlood Plus: {contents_settlement_basis: =contents_settlement_basis, building_rc_available: =building_rc_available, finished_basement_limit: =finished_basement_limit, loss_of_use_limit: =loss_of_use_limit}
        HomeFlood Premier: {contents_settlement_basis: =contents_settlement_basis, building_rc_available: =building_rc_available, finished_basement_limit: =finished_basement_limit, loss_of_use_limit: =loss_of_use_limit}
        HomeFlood Estate: {contents_settlement_basis: =contents_settlement_basis, building_rc_available: =building_rc_available, finished_basement_limit: =finished_basement_limit, loss_of_use_limit: =loss_of_use_limit}
    measures: [homeflood_msr_claim_part_paid]
    formula:
      dwelling_basis: (dwelling_rcv_loss if (building_rc_available and building_coverage >= replacement_cost_value * rc_insurance_to_value_pct / 100) else dwelling_acv_loss) - max(0, basement_loss - finished_basement_limit)
      dwelling_payable: min(max(0, dwelling_basis - deductible), building_coverage)
      deductible_left_after_dwelling: max(0, deductible - dwelling_basis)
      other_structures_payable: min(max(0, other_structures_loss - deductible_left_after_dwelling), building_coverage * other_structures_pct / 100)
  - id: homeflood_claim_denial
    subject: [homeflood_claim_denied]
    rule: >-
      Tidemark denies a coverage on a claim in writing with one denial_reason: NOT_A_FLOOD_EVENT, NO_COVERAGE_ON_DATE_OF_LOSS
      (including a loss inside the waiting period or a lapse), PROOF_OF_LOSS_NOT_TIMELY, EXCLUDED_PROPERTY or
      LOSS_BELOW_DEDUCTIBLE. A partial denial covers only the denied coverage. The letter states that suit may be filed
      within suit_limitation_months calendar months after the date of the denial and, where appraisal_available is true,
      that a disagreement on the amount of loss may go to appraisal.
    eligibility: []
