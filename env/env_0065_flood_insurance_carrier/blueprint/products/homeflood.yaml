# Tidemark Flood — HomeFlood, Tidemark's own admitted private residential flood program, filed on
# Tidemark's own rate and form schedules. All rates, factors, limits, fees and servicing periods below
# are Tidemark's written schedules. The only federal anchor is the private flood insurance definition
# of 42 U.S.C. 4012a(b)(7) that lenders apply under the mandatory purchase rules, which decides whether
# a policy may carry the compliance aid statement that lenders must accept.
category: homeflood
display_name: HomeFlood Private Residential Flood Policies

binding:
  holding_table: homeflood_policies
  event_tables: [homeflood_billing, homeflood_claims, homeflood_changes]
  intake_tables: [homeflood_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [pending_effective, active, pending_cancellation, expired, cancelled]
  transitions:
    - {from: pending_effective, to: active, by: system, means: The waiting period ends and coverage attaches at 12:01 a.m. on the effective date.}
    - {from: active, to: pending_cancellation, by: agent, means: A notice of cancellation for nonpayment or misrepresentation is issued and runs until its cancellation date.}
    - {from: pending_cancellation, to: active, by: agent, means: The past-due amount is received before the notice's cancellation date and the notice is rescinded.}
    - {from: pending_cancellation, to: cancelled, by: system, means: The notice period runs out and the policy is cancelled by Tidemark on the notice's cancellation date.}
    - {from: active, to: cancelled, by: user, means: The named insured signs a cancellation request for an active policy.}
    - {from: pending_effective, to: cancelled, by: user, means: The named insured signs a cancellation request before the policy took effect.}
    - {from: active, to: expired, by: system, means: The term ends without the renewal premium being paid, or after a non-renewal notice.}
    - {from: expired, to: active, by: agent, means: The renewal is reinstated inside the reinstatement window on a signed statement of no loss.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: The amount the policyholder owes on the policy; premium, fees and installment charges raise it, payments and credits lower it, and refunds paid out bring a credit balance back to zero.
  - key: claim_paid
    unit: USD
    meaning: Net claim money issued on the policy; each claim payment raises it and each voided payment lowers it.

parameter_schema:
  building_coverage_available: Whether dwelling (building) coverage is written on the tier; boolean.
  min_building_coverage: Lowest dwelling limit the tier writes; USD (0 where no building coverage).
  max_building_coverage: Highest dwelling limit the tier writes; USD (0 where no building coverage).
  min_contents_coverage: Lowest personal property limit the tier writes; USD.
  max_contents_coverage: Highest personal property limit the tier writes; USD.
  coverage_increment: Increment in which limits are written; USD.
  min_replacement_cost_value: Lowest dwelling replacement cost value the tier accepts; USD (0 where no building coverage).
  other_structures_pct: Detached other-structures coverage as a percent of the dwelling limit, in addition to it; percent.
  loss_of_use_limit: Additional living expense limit while the home is uninhabitable after a covered flood; USD per occurrence.
  loss_of_use_max_months: Longest period additional living expense is paid after the date of loss; calendar months.
  building_rc_available: Whether dwelling losses can be settled at replacement cost when the insurance-to-value test is met; boolean.
  rc_insurance_to_value_pct: Share of the dwelling replacement cost value the dwelling limit must reach for replacement cost settlement; percent.
  contents_settlement_basis: Basis for personal property losses; enum (ACTUAL_CASH_VALUE, REPLACEMENT_COST).
  finished_basement_limit: Sublimit for finished basement walls, floors and the contents kept there; USD per occurrence (0 = basement items limited to those the policy lists).
  pool_repair_limit: Sublimit for repair, refill and debris removal of an in-ground swimming pool; USD per occurrence.
  loss_avoidance_limit: Reimbursement for sandbags, pumps and moving property to protect it, with no deductible; USD per occurrence.
  deductible_options: Per-occurrence deductible amounts that may be elected; list of USD.
  min_deductible: Lowest deductible the tier allows; USD.
  default_deductible: Deductible applied when the application elects none; USD.
  compliance_aid_max_deductible: Highest deductible with which the policy can still carry the private flood compliance aid statement; USD.
  meets_mandatory_purchase_definition: Whether the tier's form is at least as broad as the SFIP and can carry the compliance aid statement; boolean.
  building_rate_per_100: Base annual rate per 100 USD of dwelling coverage; USD.
  contents_rate_per_100: Base annual rate per 100 USD of personal property coverage; USD.
  zone_factor_table: Rating factor by FEMA flood zone of the property; mapping zone -> factor.
  elevation_factor_table: Rating factor by whole feet of the lowest floor above (+) or below (-) the base flood elevation on an accepted Elevation Certificate; ladder.
  no_ec_factor_sfha: Rating factor for a property in a Special Flood Hazard Area without an accepted Elevation Certificate showing a base flood elevation; factor.
  no_ec_factor_non_sfha: Rating factor for a property outside a Special Flood Hazard Area, where the elevation ladder is not used; factor.
  deductible_factor_table: Rating factor by elected deductible; mapping USD -> factor.
  mitigation_credit_pct: Credit when the Elevation Certificate certifies engineered flood openings in the enclosure or foundation; percent.
  claims_free_credit_pct: Credit when no paid claim has a date of loss within the claims-free period; percent.
  claims_free_years: Length of the claims-free period counted back from the term start; years.
  package_credit_pct: Credit when the customer holds an active Tidemark Excess Flood policy on the same property; percent.
  max_combined_credit_pct: Ceiling on the sum of all credits applied to one term; percent.
  loss_of_use_premium: Flat annual charge for the loss-of-use coverage; USD.
  minimum_premium: Lowest annual premium the tier charges after factors and credits, before the policy fee; USD.
  policy_fee: Annual policy fee, fully earned when the term starts; USD.
  payment_plans: Payment plans offered; list of enum (ANNUAL, SEMI_ANNUAL, QUARTERLY).
  installment_fee: Fee added to each installment after the first on a SEMI_ANNUAL or QUARTERLY plan; USD per installment.
  escrow_billed_plan: The only plan available when the premium is paid by the lender from escrow; enum.
  standard_waiting_days: Waiting period from the date the application and first payment are received to coverage attaching, and for mid-term increases; calendar days.
  loan_closing_waiting_days: Waiting period when the policy is bought for a home purchase or refinance closing and received no later than the closing date; calendar days.
  nfip_replacement_waiting_days: Waiting period when the policy replaces an NFIP policy on the same building with no gap; calendar days.
  nonpayment_notice_days: Days between issuing a notice of cancellation for nonpayment and the cancellation date; calendar days.
  insurer_cancellation_notice_days: Days of written notice to the insured and the mortgagee before Tidemark cancels for any reason other than nonpayment, or non-renews; calendar days.
  renewal_offer_days: Days before term end Tidemark issues the renewal offer; calendar days.
  reinstatement_window_days: Days after expiration within which an unpaid renewal can be reinstated on a signed statement of no loss; calendar days.
  cancellation_refund_method: How unearned premium is returned on an insured's cancellation; enum (PRO_RATA).
  policy_fee_refundable: Whether the policy fee comes back on a cancellation; boolean.
  no_refund_after_paid_claim: Whether a term with a paid claim earns its full premium on cancellation; boolean.
  proof_of_loss_days: Days after the date of loss within which the signed proof of loss must be received; calendar days.
  claim_payment_days: Days after an agreed proof of loss within which Tidemark pays; calendar days.
  adjuster_contact_hours: Tidemark standard for the adjuster's first contact after the claim is reported; elapsed hours.
  suit_limitation_months: Months after the written denial within which suit may be filed; calendar months.
  appraisal_available: Whether either party may demand appraisal of the amount of loss; boolean.
  ec_max_age_years: Oldest Elevation Certificate survey date accepted for rating, when the building has not been altered since; years.

