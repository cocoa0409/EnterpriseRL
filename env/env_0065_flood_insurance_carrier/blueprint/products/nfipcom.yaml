events:
  # ---- contract writes on the policy record ----
  - type: nfipcom_policy_issued
    target: nfipcom_policies
    mutation: create
    meaning: A new NFIP General Property Form or RCBAP policy is issued on an application received with its full premium; it waits in pending_effective until its effective date.
    grain: one row per policy issued
    fields:
      policy_number: NFIP policy number assigned at issue.
      variant_name: Form and occupancy tier written, as the official full tier name.
      property_address: Address of the insured building or non-residential unit.
      flood_zone: FEMA flood zone shown for the building on the effective Flood Insurance Rate Map.
      number_of_units: Number of units in the building (residential units for an RCBAP; 1 for a General Property Form building or unit).
      building_coverage: Building limit written.
      contents_coverage: Contents limit written.
      building_deductible: Building deductible elected.
      contents_deductible: Contents deductible elected.
      replacement_cost_value: Building replacement cost value stated on the application.
      application_date: Date the signed application and full premium were received.
      original_effective_date: Date coverage first attaches.
      term_start: Start of the first term (equal to the original effective date).
      term_end: End of the first term.
      waiting_period_basis: Which waiting rule set the effective date.
      loan_closing_date: Loan closing date when the purchase is in connection with a loan.
      map_revision_date: Effective date of the map revision when the map-revision exception is used.
      mortgage_required: Whether a federally regulated lender requires the coverage.
      mortgagee_name: First mortgagee of record.
      loan_number: Mortgagee's loan number.
      premium_payor: Who pays the premium.
      rated_risk_premium: Risk premium line produced by the Risk Rating 2.0 rating engine for the term.
      rated_icc_premium: ICC premium line produced by the rating engine for the term.
      rated_federal_policy_fee: Federal Policy Fee produced by the rating engine for the term.
      community_probation: Whether the community is on NFIP probation at issue.
    triggers:
      - event: nfipcom:nfipcom_premium_charged
        map: {term_start: term_start, charge_basis: NEW_BUSINESS}
      - event: nfipcom:nfipcom_premium_payment
        map: {term_start: term_start}
  - type: nfipcom_policy_effective
    target: nfipcom_policies
    mutation: {transition: {from: pending_effective, to: in_force}}
    meaning: Coverage attaches on the effective date once the waiting period has run.
    grain: one row per policy taking effect
    fields:
      original_effective_date: Date coverage attached.
    triggers: []
  - type: nfipcom_term_renewed
    target: nfipcom_policies
    mutation: update
    meaning: The renewal premium is received on or before expiration and the next term is booked on the same policy number.
    grain: one row per term renewed
    fields:
      term_start: Start of the renewed term (the prior term end).
      term_end: End of the renewed term.
      rated_risk_premium: Capped risk premium booked for the renewed term.
      rated_icc_premium: ICC premium line for the renewed term.
      rated_federal_policy_fee: Federal Policy Fee for the renewed term.
    triggers:
      - event: nfipcom:nfipcom_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
  - type: nfipcom_grace_entered
    target: nfipcom_policies
    mutation: {transition: {from: in_force, to: renewal_grace}}
    meaning: The term expires with the renewal premium unpaid and the renewal grace period starts.
    grain: one row per expiration
    fields:
      term_end: Expiration date that opened the grace period.
    triggers: []
  - type: nfipcom_grace_renewed
    target: nfipcom_policies
    mutation: {transition: {from: renewal_grace, to: in_force}}
    meaning: The full renewal premium arrives inside the grace period and the renewed term is booked from the prior expiration date.
    grain: one row per grace-period renewal
    fields:
      term_start: Start of the renewed term (the prior expiration date).
      term_end: End of the renewed term.
      rated_risk_premium: Capped risk premium booked for the renewed term.
      rated_icc_premium: ICC premium line for the renewed term.
      rated_federal_policy_fee: Federal Policy Fee for the renewed term.
    triggers:
      - event: nfipcom:nfipcom_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
  - type: nfipcom_policy_lapsed
    target: nfipcom_policies
    mutation: {transition: {from: renewal_grace, to: lapsed}}
    meaning: The grace period ends unpaid; coverage ended at the expiration date and a new policy would be needed.
    grain: one row per lapse
    fields:
      closed_date: Expiration date at which coverage ended.
    triggers: []
  - type: nfipcom_policy_cancelled
    target: nfipcom_policies
    mutation: {transition: [{from: pending_effective, to: cancelled}, {from: in_force, to: cancelled}]}
    meaning: The named insured's signed cancellation request takes effect and the policy ends on the cancellation effective date.
    grain: one row per policy cancelled
    fields:
      cancellation_reason: NFIP-aligned cancellation reason on the signed request.
      cancellation_effective_date: Date the cancellation takes effect.
      closed_date: Date the cancellation was processed.
    triggers:
      - event: nfipcom:nfipcom_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: nfipcom_policy_nullified
    target: nfipcom_policies
    mutation: {transition: [{from: pending_effective, to: nullified}, {from: in_force, to: nullified}]}
    meaning: Tidemark voids the policy from its inception because it should never have been issued.
    grain: one row per policy nullified
    fields:
      cancellation_reason: Nullification reason.
      cancellation_effective_date: The original effective date (a nullification always reaches back to inception).
      closed_date: Date the nullification was processed.
    triggers:
      - event: nfipcom:nfipcom_premium_credit
        map: {charge_basis: NULLIFICATION}
  - type: nfipcom_rating_updated
    target: nfipcom_policies
    mutation: update
    meaning: Rating facts on the policy change mid-term — an Elevation Certificate first floor height — and the rating engine re-rates the term.
    grain: one row per rating change
    fields:
      ec_on_file: Whether an Elevation Certificate is on file.
      first_floor_height_ft: First floor height used for rating.
      rated_risk_premium: Re-rated risk premium for the full current term.
      rated_icc_premium: Re-rated ICC premium for the full current term.
    triggers: []
  - type: nfipcom_coverage_updated
    target: nfipcom_policies
    mutation: update
    meaning: An endorsement changes the limits, deductibles or mortgagee shown on the policy as of its effective date.
    grain: one row per endorsement applied
    fields:
      building_coverage: Building limit after the endorsement.
      contents_coverage: Contents limit after the endorsement.
      building_deductible: Building deductible after the endorsement.
      contents_deductible: Contents deductible after the endorsement.
      mortgagee_name: Mortgagee of record after the endorsement.
      loan_number: Loan number after the endorsement.
      mortgage_required: Whether coverage is mortgage-required after the endorsement.
      premium_payor: Premium payor after the endorsement.
      rated_risk_premium: Full-term risk premium for the policy as endorsed.
      rated_icc_premium: Full-term ICC premium for the policy as endorsed.
    triggers: []
  # ---- premium ledger ----
  - type: nfipcom_premium_charged
    target: nfipcom_billing
    meaning: One premium component is booked to the policy for a term — at new business, at renewal or by an endorsement.
    grain: one row per premium component per term per booking occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Start of the term the component belongs to.
      component: Premium component booked.
      charge_basis: Occasion of the booking.
      amount: Component amount, positive.
      posted_date: Date the component was booked.
      reference_id: The endorsement record that caused an endorsement booking; empty for new business and renewal.
    account: premium_balance
    direction: in
    triggers: []
  - type: nfipcom_premium_payment
    target: nfipcom_billing
    meaning: A premium payment is received and applied to the policy.
    grain: one row per payment item received
    distinguish_by: [payment_ref, term_start]
    fields:
      term_start: Term the payment is applied to.
      amount: Amount received, positive.
      posted_date: Date the payment was received.
      payment_ref: Check number, ACH trace or card authorization of the payment item.
      payment_method: How the payment was made.
    account: premium_balance
    direction: out
    triggers: []
  - type: nfipcom_premium_credit
    target: nfipcom_billing
    meaning: The returnable share of one premium component is credited back — on a cancellation, a nullification or a mid-term re-rate that lowers the term premium.
    grain: one row per credited component per crediting occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term the credited component belongs to.
      component: Premium component credited.
      charge_basis: CANCELLATION, NULLIFICATION or RERATE.
      amount: Credited amount, positive.
      posted_date: Date the credit was booked.
      reference_id: The record that caused the credit — the cancellation request, the Elevation Certificate record, or the policy itself for a nullification.
    account: premium_balance
    direction: out
    triggers:
      - event: nfipcom:nfipcom_refund_disbursed
        map: {reference_id: reference_id}
  - type: nfipcom_refund_disbursed
    target: nfipcom_billing
    meaning: The credit balance created by a cancellation, nullification or overpayment is paid out to the payor of record.
    grain: one row per refund payment issued
    distinguish_by: [reference_id, payee]
    fields:
      amount: Refund paid, positive.
      posted_date: Date the refund was issued.
      reference_id: The cancellation request (or nullified policy) the refund settles.
      payee: Who receives the refund.
      payment_ref: Refund check or ACH reference.
    account: premium_balance
    direction: in
    triggers: []
  # ---- servicing documents ----
  - type: nfipcom_endorsement_issued
    target: nfipcom_changes
    meaning: A mid-term endorsement is recorded with its effective date — a coverage increase or decrease, a deductible change or a mortgagee change.
    grain: one row per endorsement request processed
    distinguish_by: [change_type, change_effective_date, recorded_date]
    fields:
      change_type: Kind of endorsement.
      change_effective_date: Date the endorsement takes effect.
      recorded_date: Date the endorsement was processed.
      new_building_coverage: Building limit requested.
      new_contents_coverage: Contents limit requested.
      new_building_deductible: Building deductible requested.
      new_contents_deductible: Contents deductible requested.
      new_mortgagee_name: Mortgagee requested.
      new_loan_number: Loan number requested.
      loan_closing_date: Closing date of the loan transaction tied to the endorsement, when any.
      rerated_risk_premium: Full-term risk premium the rating engine returns for the policy as endorsed.
      rerated_icc_premium: Full-term ICC premium the rating engine returns for the policy as endorsed.
    triggers:
      - event: nfipcom:nfipcom_coverage_updated
        map: {building_coverage: new_building_coverage, contents_coverage: new_contents_coverage, building_deductible: new_building_deductible, contents_deductible: new_contents_deductible, mortgagee_name: new_mortgagee_name, loan_number: new_loan_number, rated_risk_premium: rerated_risk_premium, rated_icc_premium: rerated_icc_premium}
      - event: nfipcom:nfipcom_premium_charged
        when: {change_type: [COVERAGE_INCREASE, DEDUCTIBLE_DECREASE]}
        map: {charge_basis: ENDORSEMENT}
  - type: nfipcom_ec_received
    target: nfipcom_changes
    meaning: An Elevation Certificate (FEMA Form 086-0-33) for the insured building is received and its certified elevations are recorded.
    grain: one row per certificate received
    distinguish_by: [ec_survey_date, recorded_date]
    fields:
      recorded_date: Date the certificate was received.
      change_effective_date: Date the rating change takes effect.
      ec_survey_date: Date the surveyor certified the elevations.
      ec_building_diagram: Building diagram number selected on the certificate.
      ec_first_floor_height_ft: First floor height certified on the certificate.
      ec_lowest_floor_elevation: Elevation of the top of the lowest floor.
      ec_base_flood_elevation: Base flood elevation at the building.
      ec_applied: Whether the certified first floor height lowers the term premium and is applied to rating.
      rerated_risk_premium: Full-term risk premium the rating engine returns with the certified first floor height.
      rerated_icc_premium: Full-term ICC premium the rating engine returns with the certified first floor height.
    triggers:
      - event: nfipcom:nfipcom_rating_updated
        when: {ec_applied: true}
        map: {first_floor_height_ft: ec_first_floor_height_ft, ec_on_file: true, rated_risk_premium: rerated_risk_premium, rated_icc_premium: rerated_icc_premium}
      - event: nfipcom:nfipcom_premium_credit
        when: {ec_applied: true}
        map: {charge_basis: RERATE}
  - type: nfipcom_renewal_offered
    target: nfipcom_changes
    meaning: The renewal bill for the coming term is issued, carrying the rating engine's indicated risk premium for that term.
    grain: one row per renewal bill issued
    distinguish_by: [renewal_term_start]
    fields:
      recorded_date: Date the renewal bill was issued.
      renewal_term_start: Start date of the term being offered.
      indicated_risk_premium: Full-risk premium the rating engine indicates for the coming term before the annual cap.
    triggers: []
  - type: nfipcom_mortgagee_notice
    target: nfipcom_changes
    meaning: Written notice of a cancellation or non-renewal is sent to the mortgagee of record.
    grain: one row per notice sent
    distinguish_by: [notice_reason, recorded_date]
    fields:
      recorded_date: Date the notice was sent.
      notice_reason: Why the mortgagee is being notified.
      new_mortgagee_name: Mortgagee the notice is addressed to.
    triggers: []
  # ---- claims ----
  - type: nfipcom_claim_reported
    target: nfipcom_claims
    meaning: A first notice of a flood loss is taken and a claim number is assigned.
    grain: one row per claim reported
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number assigned at first notice.
      date_of_loss: Date the flood loss occurred.
      event_date: Date the loss was reported.
    triggers: []
  - type: nfipcom_adjuster_report
    target: nfipcom_claims
    meaning: The assigned adjuster files a preliminary, final or supplemental report with the measured loss by coverage.
    grain: one row per adjuster report filed on a claim
    distinguish_by: [claim_number, report_type, event_date]
    fields:
      claim_number: Claim the report belongs to.
      date_of_loss: Date of loss on the claim.
      report_type: Kind of report.
      event_date: Date the report was filed.
      building_rcv_loss: Building loss measured at replacement cost.
      building_acv_loss: Building loss measured at actual cash value.
      contents_acv_loss: Contents loss measured at actual cash value.
    triggers: []
  - type: nfipcom_proof_of_loss_filed
    target: nfipcom_claims
    meaning: The insured's signed and sworn proof of loss for one coverage is received.
    grain: one row per proof of loss received for a coverage on a claim
    distinguish_by: [claim_number, coverage_part, event_date]
    fields:
      claim_number: Claim the proof of loss belongs to.
      date_of_loss: Date of loss on the claim.
      coverage_part: Coverage the proof of loss is for.
      claimed_amount: Amount sworn on the proof of loss.
      event_date: Date the proof of loss was received.
    triggers: []
  - type: nfipcom_claim_paid
    target: nfipcom_claims
    meaning: A claim payment for one coverage is issued.
    grain: one row per payment item issued
    distinguish_by: [claim_number, coverage_part, payment_ref]
    fields:
      claim_number: Claim the payment belongs to.
      coverage_part: Coverage the payment is for.
      payment_amount: Amount paid, positive.
      payment_ref: Claim check or ACH reference.
      payee: Payee line on the payment.
      event_date: Date the payment was issued.
    account: claim_paid
    direction: in
    triggers: []
  - type: nfipcom_claim_payment_voided
    target: nfipcom_claims
    meaning: An issued claim payment is voided (lost, stale-dated or issued to the wrong payee) before it is reissued.
    grain: one row per payment item voided
    distinguish_by: [payment_ref]
    fields:
      claim_number: Claim the voided payment belongs to.
      coverage_part: Coverage of the voided payment.
      payment_amount: Amount voided, positive.
      payment_ref: Reference of the payment item being voided.
      event_date: Date the payment was voided.
    account: claim_paid
    direction: out
    triggers: []
  - type: nfipcom_claim_denied
    target: nfipcom_claims
    meaning: Tidemark issues a written denial of all or part of a claim for one coverage.
    grain: one row per written denial per coverage on a claim
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim being denied.
      coverage_part: Coverage denied.
      denial_reason: Reason stated in the denial letter.
      event_date: Date of the written denial.
    triggers: []

measures:
  - id: nfipcom_msr_term_claims_paid
    window: The current policy term of the policy, from term_start inclusive to term_end exclusive, judged by each claim's date_of_loss.
    measure: Count of distinct claim_number values with a date_of_loss inside the window whose net payment (sum of nfipcom_claim_paid payment_amount minus nfipcom_claim_payment_voided payment_amount on that claim) is above zero.
  - id: nfipcom_msr_term_claims_open
    window: The current policy term of the policy, from term_start inclusive to term_end exclusive, judged by each claim's date_of_loss.
    measure: Count of distinct claim_number values reported (nfipcom_claim_reported) with a date_of_loss inside the window that have neither a nfipcom_claim_paid row nor a nfipcom_claim_denied row on record.
  - id: nfipcom_msr_claim_part_paid
    window: The whole life of one claim_number, for one coverage_part.
    measure: Sum of payment_amount on nfipcom_claim_paid rows minus sum of payment_amount on nfipcom_claim_payment_voided rows for that claim_number and coverage_part.


policies:
  - id: nfipcom_agg_multi_holding
    subject: [nfipcom_policy_issued]
    rule: >-
      A business, landlord, non-profit or condominium association may hold any number of General Property Form and
      RCBAP policies, one per insured building, or per non-residential condominium unit; there is no per-customer
      cap. Each building is a separate policy with its own limits, deductibles, premium and term, even when several
      buildings share one street address or one owner, and nothing on one policy is pooled into or offset against
      another policy of the same customer. A condominium association insures its buildings only under the RCBAP
      tiers, and an individual unit owner's interest is never written on this category.
    eligibility: []
    params:
      max_per_customer: null
  - id: nfipcom_agg_one_policy_per_building
    subject: [nfipcom_policy_issued, nfipcom_policy_cancelled]
    rule: >-
      The National Flood Insurance Program allows only one NFIP building policy on a building. A new building policy
      is issued only when no other General Property Form or RCBAP policy with building coverage at the same property
      address is in status pending_effective, in_force or renewal_grace. A non-residential condominium unit policy can
      coexist with the association's RCBAP on the same building because it insures only the unit owner's interest.
      When two building policies on the same building are found in force, the one with the later
      original_effective_date is the duplicate and is cancelled under reason DUPLICATE_NFIP_POLICY. Limits are never
      added across duplicate policies.
    eligibility:
      - id: no_live_building_policy_at_address
        applies_to: [nfipcom_policy_issued]
        kind: dedup
        condition: A new building policy is issued only when no other General Property Form or RCBAP policy with building coverage at the same property address is in status pending_effective, in_force or renewal_grace.
        evidence_fields: [nfipcom_policies.property_address, nfipcom_policies.status, nfipcom_policies.building_coverage]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.property_address]
          action_bindings:
            nfipcom_policies.property_address: property_address
        dedup_contract:
          table: nfipcom_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [pending_effective, in_force, renewal_grace]}
          distinct_fields: [variant_name]
  - id: nfipcom_coverage_limits_deductibles
    subject: [nfipcom_policy_issued, nfipcom_endorsement_issued, nfipcom_coverage_updated]
    rule: >-
      On a General Property Form tier the building limit may not exceed max_building_coverage_fixed. On an RCBAP
      tier the building limit may not exceed the lower of building_limit_per_unit times the number_of_units on the
      policy and the building replacement_cost_value. The contents limit may not exceed max_contents_coverage, and
      contents coverage insures only the property described by the tier's contents_owner_basis. Limits are written
      in whole multiples of coverage_increment. Each deductible must be one of the tier's listed options and may
      not exceed max_deductible. The minimum building deductible is min_building_deductible_up_to_threshold when
      the building limit is at or below deductible_limit_threshold and min_building_deductible_over_threshold when
      it is above; the minimum contents deductible is min_contents_deductible. An application or endorsement that
      elects no deductible takes the tier's defaults, raised to the applicable minimum. A limit or deductible
      outside these bounds is written at the nearest permitted value only when the customer accepts that value,
      and otherwise it is not processed. On an RCBAP the association is told at application and at each renewal
      the coinsurance requirement that its building limit must meet to avoid a penalty at loss.
    eligibility: []
    params:
      per_tier:
        NFIP General Property Form – Non-Residential Condominium Unit: {max_building_coverage_fixed: =max_building_coverage_fixed, building_limit_per_unit: =building_limit_per_unit, max_contents_coverage: =max_contents_coverage}
        NFIP General Property Form – Non-Residential Manufactured Building: {max_building_coverage_fixed: =max_building_coverage_fixed, building_limit_per_unit: =building_limit_per_unit, max_contents_coverage: =max_contents_coverage}
        NFIP General Property Form – Other Residential Building: {max_building_coverage_fixed: =max_building_coverage_fixed, building_limit_per_unit: =building_limit_per_unit, max_contents_coverage: =max_contents_coverage}
        NFIP General Property Form – Non-Residential Building: {max_building_coverage_fixed: =max_building_coverage_fixed, building_limit_per_unit: =building_limit_per_unit, max_contents_coverage: =max_contents_coverage}
        NFIP RCBAP – Two-to-Four Unit Condominium Building: {max_building_coverage_fixed: =max_building_coverage_fixed, building_limit_per_unit: =building_limit_per_unit, max_contents_coverage: =max_contents_coverage}
        NFIP RCBAP – Five-or-More Unit Condominium Building: {max_building_coverage_fixed: =max_building_coverage_fixed, building_limit_per_unit: =building_limit_per_unit, max_contents_coverage: =max_contents_coverage}
    formula:
      building_cap: max_building_coverage_fixed if building_limit_per_unit == 0 else min(building_limit_per_unit * number_of_units, replacement_cost_value)
      min_building_deductible: min_building_deductible_up_to_threshold if building_coverage <= deductible_limit_threshold else min_building_deductible_over_threshold
  - id: nfipcom_premium_components
    subject: [nfipcom_premium_charged, nfipcom_policy_issued, nfipcom_term_renewed, nfipcom_grace_renewed]
    rule: >-
      Every term's premium is booked as separate components. RISK_PREMIUM is the rated_risk_premium, ICC_PREMIUM is
      the rated_icc_premium and FEDERAL_POLICY_FEE is the rated_federal_policy_fee that the Risk Rating 2.0 rating
      engine returned for the term (on an RCBAP the engine's Federal Policy Fee already reflects the number of
      units); the desk never recalculates these three. RESERVE_FUND_ASSESSMENT is reserve_fund_assessment_pct of the
      sum of the risk premium and ICC premium, rounded to the cent. HFIAA_SURCHARGE is hfiaa_surcharge on every
      policy of this category, because none of them is a primary residence. PROBATION_SURCHARGE is booked only when
      community_probation is true, at probation_surcharge per term. The HFIAA surcharge, Federal Policy Fee and
      probation surcharge are booked once per term at new business or renewal and never on an endorsement. A
      component of zero is not booked, and the total term premium is the sum of the booked components.
    eligibility: []
    formula:
      reserve_fund_assessment: round((rated_risk_premium + rated_icc_premium) * reserve_fund_assessment_pct / 100, 2)
      probation: probation_surcharge if community_probation else 0
      total_term_premium: rated_risk_premium + rated_icc_premium + reserve_fund_assessment + hfiaa_surcharge + rated_federal_policy_fee + probation
  - id: nfipcom_claim_settlement
    subject: [nfipcom_claim_paid, nfipcom_claim_payment_voided]
    rule: >-
      Each coverage is settled separately from the latest governing adjuster report on the claim, with its own
      deductible. On a tier whose building_settlement_basis is ACTUAL_CASH_VALUE the building payable is the
      actual cash value loss less the building deductible, never below zero, capped at the building limit. On a tier
      whose building_settlement_basis is REPLACEMENT_COST the building loss is taken at replacement cost, and when
      coinsurance_applies the required insurance is the lower of coinsurance_pct of the replacement_cost_value and
      building_limit_per_unit times the number_of_units. When the building limit is at least the required
      insurance, the building payable is the replacement cost loss less the deductible, never below zero, capped
      at the building limit; when it is less, the building payable is the replacement cost loss multiplied by the
      building limit divided by the required insurance and rounded to the cent, less the deductible, never below
      zero, capped at the building limit. Contents are always settled at actual cash value less the contents
      deductible, never below zero, capped at the contents limit, and cover only the property described by
      contents_owner_basis. Increased Cost of Compliance is paid up to icc_limit without a deductible only on a
      community's substantial-damage determination, and loss-avoidance supplies up to loss_avoidance_limit without
      a deductible. A unit owner's own Dwelling Form policy never reduces what the RCBAP pays. A new payment on a
      coverage is the payable amount less what has already been paid net of voids on that claim and coverage
      (nfipcom_msr_claim_part_paid), issued only when positive; building payments name the mortgagee of record
      when mortgagee_named_on_building_payment is true. A void reverses one issued payment item in full by its
      payment reference and the voided amount is reissued under a new payment reference.
    eligibility: []
    params:
      per_tier:
        NFIP General Property Form – Non-Residential Condominium Unit: {building_settlement_basis: =building_settlement_basis, coinsurance_pct: =coinsurance_pct, icc_limit: =icc_limit}
        NFIP General Property Form – Non-Residential Manufactured Building: {building_settlement_basis: =building_settlement_basis, coinsurance_pct: =coinsurance_pct, icc_limit: =icc_limit}
        NFIP General Property Form – Other Residential Building: {building_settlement_basis: =building_settlement_basis, coinsurance_pct: =coinsurance_pct, icc_limit: =icc_limit}
        NFIP General Property Form – Non-Residential Building: {building_settlement_basis: =building_settlement_basis, coinsurance_pct: =coinsurance_pct, icc_limit: =icc_limit}
        NFIP RCBAP – Two-to-Four Unit Condominium Building: {building_settlement_basis: =building_settlement_basis, coinsurance_pct: =coinsurance_pct, icc_limit: =icc_limit}
        NFIP RCBAP – Five-or-More Unit Condominium Building: {building_settlement_basis: =building_settlement_basis, coinsurance_pct: =coinsurance_pct, icc_limit: =icc_limit}
    measures: [nfipcom_msr_claim_part_paid]
    formula:
      required_insurance: min(replacement_cost_value * coinsurance_pct / 100, building_limit_per_unit * number_of_units)
      rcv_payable_full: min(max(0, building_rcv_loss - building_deductible), building_coverage)
      rcv_payable_penalized: min(max(0, round(building_rcv_loss * building_coverage / required_insurance, 2) - building_deductible), building_coverage)
      acv_payable: min(max(0, building_acv_loss - building_deductible), building_coverage)
      contents_payable: min(max(0, contents_acv_loss - contents_deductible), contents_coverage)
  - id: nfipcom_waiting_period
    subject: [nfipcom_policy_issued, nfipcom_policy_effective, nfipcom_endorsement_issued]
    rule: >-
      New business and every mid-term coverage increase or deductible decrease take effect at 12:01 a.m. on the
      day that is standard_waiting_days calendar days after the date the signed application (or endorsement
      request) and the full premium are received, counted by adding the days to that receipt date on the calendar,
      and the waiting_period_basis recorded is STANDARD. Two statutory exceptions replace the standard wait, and
      only one basis is recorded per transaction. Loan transaction: the coverage is bought or increased in
      connection with making, increasing, extending or renewing a loan secured by the building. The loan-transaction
      exception applies only when the application and full premium are received no later than the date the loan
      closes; coverage then takes effect at the loan closing date, the waiting_period_basis is LOAN_TRANSACTION and
      loan_closing_date is recorded. Map revision: the building was newly placed in a Special Flood Hazard Area by
      a revision of the Flood Insurance Rate Map. The map-revision exception applies only when the application and
      full premium are received no later than map_revision_window_months calendar months after the map revision that placed the building in a
      Special Flood Hazard Area takes effect; coverage then takes effect at 12:01 a.m. on the day after receipt
      (map_revision_waiting_days), the waiting_period_basis is MAP_REVISION and map_revision_date is recorded. The
      window is counted by adding calendar months to the map revision effective date, falling back to the
      last day of the month when that day does not exist, and a receipt on the last day of the window qualifies.
      When both exceptions could apply, the one giving the earlier effective date is recorded. Coverage decreases and deductible increases are never effective mid-term; they are
      accepted only effective on a renewal date. A loss that begins before the effective date of the coverage, or
      of an increase, is not covered by that coverage or increase.
    eligibility:
      - id: loan_exception_received_by_closing
        applies_to: [nfipcom_policy_issued, nfipcom_endorsement_issued]
        kind: time
        condition: The loan-transaction exception applies only when the application and full premium are received no later than the date the loan closes; coverage then takes effect at the loan closing date, the waiting_period_basis is LOAN_TRANSACTION and loan_closing_date is recorded.
        evidence_fields: [nfipcom_policies.loan_closing_date, nfipcom_policies.application_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.loan_closing_date]
          action_bindings:
            nfipcom_policies.loan_closing_date: loan_closing_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the loan closes
          anchor_source: nfipcom_policies.loan_closing_date
          relation: not_after
          duration_source: variants.loan_transaction_waiting_days
          unit: calendar_days
          counting_rule: counted by adding the days to that receipt date on the calendar
          boundary: inclusive
      - id: map_revision_window
        applies_to: [nfipcom_policy_issued, nfipcom_endorsement_issued]
        kind: time
        condition: The map-revision exception applies only when the application and full premium are received no later than map_revision_window_months calendar months after the map revision that placed the building in a Special Flood Hazard Area takes effect; coverage then takes effect at 12:01 a.m. on the day after receipt (map_revision_waiting_days), the waiting_period_basis is MAP_REVISION and map_revision_date is recorded.
        evidence_fields: [nfipcom_policies.map_revision_date, nfipcom_policies.flood_zone]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.map_revision_date]
          action_bindings:
            nfipcom_policies.map_revision_date: map_revision_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the map revision that placed the building in a Special Flood Hazard Area takes effect
          anchor_source: nfipcom_policies.map_revision_date
          relation: not_after
          duration_source: variants.map_revision_window_months
          unit: calendar_months
          counting_rule: The window is counted by adding calendar months to the map revision effective date, falling back to the last day of the month when that day does not exist, and a receipt on the last day of the window qualifies.
          boundary: inclusive
  - id: nfipcom_payment_application
    subject: [nfipcom_premium_payment, nfipcom_refund_disbursed]
    rule: >-
      NFIP premium is payable in full for the term: full_premium_with_application is true and no installment plan
      exists. A payment is accepted only by one of the accepted_payment_methods and is applied to the policy and
      term named on the payment; it is never moved to another policy of the same customer. When a lender pays from
      escrow the payment_method is ESCROW_DISBURSEMENT and the policy's premium_payor is LENDER_ESCROW. When the
      amount received at application is less than the total term premium, Tidemark sends an underpayment notice
      and the policyholder has underpayment_cure_days calendar days from the notice to pay the difference; if the
      difference is not received, the limits are reduced to the amounts the premium received will buy and the
      difference is not pursued. When the amount received exceeds the total due, the excess is refunded to the
      payor in the same way as a cancellation refund. A dishonored payment is reversed and, when it was the
      application premium, the policy is nullified under PREMIUM_PAYMENT_DISHONORED. Every refund is paid to the
      payor of record: payee LENDER_ESCROW when premium_payor is LENDER_ESCROW, and payee INSURED otherwise.
    eligibility: []
    params:
      refund_payee_by_payor: {INSURED: INSURED, LENDER_ESCROW: LENDER_ESCROW}
  - id: nfipcom_endorsement_premium
    subject: [nfipcom_endorsement_issued, nfipcom_premium_charged, nfipcom_coverage_updated]
    rule: >-
      A mid-term endorsement is recorded as one of COVERAGE_INCREASE, DEDUCTIBLE_DECREASE, MORTGAGEE_CHANGE,
      COVERAGE_DECREASE_AT_RENEWAL or DEDUCTIBLE_INCREASE_AT_RENEWAL. An endorsement is processed only on a policy
      whose status is pending_effective or in_force. For a COVERAGE_INCREASE or DEDUCTIBLE_DECREASE the rating
      engine returns the full-term risk premium and ICC premium for the policy as endorsed, and the additional
      premium is booked as ENDORSEMENT components: the RISK_PREMIUM component is the increase in the full-term risk
      premium and the ICC_PREMIUM component is the increase in the full-term ICC premium, each multiplied by the
      days from the endorsement effective date to term_end divided by the days from term_start to term_end and
      rounded to the cent, and the RESERVE_FUND_ASSESSMENT component is reserve_fund_assessment_pct of those two
      pro rata amounts, rounded to the cent. The endorsement effective date follows the waiting-period rule. A
      MORTGAGEE_CHANGE takes effect on the date it is recorded and carries no premium. A
      COVERAGE_DECREASE_AT_RENEWAL or DEDUCTIBLE_INCREASE_AT_RENEWAL takes effect on the next term_start and
      changes premium only through the renewal booking; no mid-term credit is given for it.
    eligibility:
      - id: endorsable_status
        applies_to: [nfipcom_endorsement_issued]
        kind: state
        condition: An endorsement is processed only on a policy whose status is pending_effective or in_force.
        evidence_fields: [nfipcom_policies.status, nfipcom_policies.nfipcom_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.nfipcom_policy_id]
          action_bindings:
            nfipcom_policies.nfipcom_policy_id: nfipcom_policy_id
        state_contract:
          field: nfipcom_policies.status
          allowed: [pending_effective, in_force]
    formula:
      days_remaining: term_end - change_effective_date
      term_days: term_end - term_start
      risk_component: round((rerated_risk_premium - rated_risk_premium) * days_remaining / term_days, 2)
      icc_component: round((rerated_icc_premium - rated_icc_premium) * days_remaining / term_days, 2)
      rfa_component: round((risk_component + icc_component) * reserve_fund_assessment_pct / 100, 2)
  - id: nfipcom_ec_rating
    subject: [nfipcom_ec_received, nfipcom_rating_updated, nfipcom_premium_credit]
    rule: >-
      Under Risk Rating 2.0 an Elevation Certificate is optional (ec_required_for_rating is false); the rating
      engine otherwise uses its own estimated first floor height. A certificate is accepted only on FEMA Form
      086-0-33, completed and sealed by a licensed land surveyor, engineer or architect, for the building as it
      currently stands. When ec_first_floor_height_used is true, the first floor height certified on an accepted
      certificate is submitted to the rating engine and the engine returns the full-term risk premium and ICC
      premium with that height. The certificate is applied (ec_applied true) only when the re-rated full-term
      risk premium plus ICC premium is lower than the rated figures on the policy; otherwise it is kept on file
      with ec_applied false and the rating is not changed. A certificate is applied only on a policy whose status
      is pending_effective or in_force. An applied certificate takes effect on the date it is received, and the
      reduction is credited as RERATE components: the RISK_PREMIUM credit is the fall in the full-term risk premium
      and the ICC_PREMIUM credit is the fall in the full-term ICC premium, each multiplied by the days from the
      receipt date to term_end divided by the days from term_start to term_end and rounded to the cent, and the
      RESERVE_FUND_ASSESSMENT credit is reserve_fund_assessment_pct of those two pro rata credits, rounded to the
      cent. The HFIAA surcharge and the Federal Policy Fee are not affected. The credit is refunded to the payor of
      record. From the next renewal the re-rated premium is the prior-term figure the annual cap is measured from.
    eligibility:
      - id: ec_applicable_status
        applies_to: [nfipcom_rating_updated]
        kind: state
        condition: A certificate is applied only on a policy whose status is pending_effective or in_force.
        evidence_fields: [nfipcom_policies.status, nfipcom_policies.nfipcom_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.nfipcom_policy_id]
          action_bindings:
            nfipcom_policies.nfipcom_policy_id: nfipcom_policy_id
        state_contract:
          field: nfipcom_policies.status
          allowed: [pending_effective, in_force]
    formula:
      ec_applied: (rerated_risk_premium + rerated_icc_premium) < (rated_risk_premium + rated_icc_premium)
      days_remaining: term_end - change_effective_date
      term_days: term_end - term_start
      risk_credit: round((rated_risk_premium - rerated_risk_premium) * days_remaining / term_days, 2)
      icc_credit: round((rated_icc_premium - rerated_icc_premium) * days_remaining / term_days, 2)
      rfa_credit: round((risk_credit + icc_credit) * reserve_fund_assessment_pct / 100, 2)
  - id: nfipcom_renewal
    subject: [nfipcom_renewal_offered, nfipcom_term_renewed, nfipcom_grace_entered, nfipcom_grace_renewed, nfipcom_policy_lapsed]
    rule: >-
      Tidemark issues the renewal bill renewal_notice_days calendar days before term_end, and also sends it to the
      mortgagee of record when the policy is mortgage-required and renewal_bill_copy_to_mortgagee is true. The
      renewal bill carries the rating engine's indicated full-risk premium for the coming term. The risk premium
      booked for the renewed term is the lower of that indicated premium and the prior term's rated_risk_premium
      increased by annual_risk_premium_increase_cap_pct, rounded to the cent; the ICC premium and Federal Policy
      Fee are the engine's figures for the coming term, and the Reserve Fund Assessment, HFIAA surcharge and any
      probation surcharge are booked as for new business. When the full renewal premium is received on or before
      term_end the term is renewed on the same policy number with no break. When it is not, the policy enters
      renewal_grace at term_end. A grace-period renewal is booked only when the full renewal premium is received
      no later than renewal_grace_days calendar days after the policy term expires, counted by adding the days
      to term_end on the calendar, a receipt on the last grace day qualifying; the renewed term then starts on the
      prior term_end with no break in coverage. A loss that occurs during the grace period is covered only if the
      renewal premium is received inside the grace period. When the grace period ends unpaid the policy lapses
      with coverage ended at term_end; a payment received after that cannot renew the policy and is refunded, and
      coverage requires a new application subject to the waiting-period rule. A grace-period renewal is booked
      only on a policy whose status is renewal_grace, and leaves it in_force.
    eligibility:
      - id: grace_payment_window
        applies_to: [nfipcom_grace_renewed]
        kind: time
        condition: A grace-period renewal is booked only when the full renewal premium is received no later than renewal_grace_days calendar days after the policy term expires, counted by adding the days to term_end on the calendar, a receipt on the last grace day qualifying; the renewed term then starts on the prior term_end with no break in coverage.
        evidence_fields: [nfipcom_policies.term_end, nfipcom_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.term_end]
          action_bindings:
            nfipcom_policies.term_end: term_end
        temporal_basis:
          clock: frozen_time
          anchor_event: the policy term expires
          anchor_source: nfipcom_policies.term_end
          relation: not_after
          duration_source: variants.renewal_grace_days
          unit: calendar_days
          counting_rule: counted by adding the days to term_end on the calendar, a receipt on the last grace day qualifying
          boundary: inclusive
      - id: grace_status
        applies_to: [nfipcom_grace_renewed]
        kind: state
        condition: A grace-period renewal is booked only on a policy whose status is renewal_grace, and leaves it in_force.
        evidence_fields: [nfipcom_policies.status, nfipcom_policies.nfipcom_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.nfipcom_policy_id]
          action_bindings:
            nfipcom_policies.nfipcom_policy_id: nfipcom_policy_id
        state_contract:
          field: nfipcom_policies.status
          allowed: [renewal_grace, in_force]
    formula:
      capped_risk_premium: min(indicated_risk_premium, round(rated_risk_premium * (1 + annual_risk_premium_increase_cap_pct / 100), 2))
  - id: nfipcom_cancellation_refund
    subject: [nfipcom_policy_cancelled, nfipcom_premium_credit, nfipcom_refund_disbursed]
    rule: >-
      A cancellation is processed only on a cancellation request signed by an authorized signer of the named insured and on file for the policy.
      The policy status must be pending_effective or in_force when the cancellation is processed, and it is
      cancelled once processed. Each reason carries its own documentation and effective date. BUILDING_SOLD needs the
      closing disclosure or settlement statement and takes effect on the title transfer date; BUILDING_REMOVED_OR_DEMOLISHED
      needs evidence of removal and takes effect on the removal date; CONTENTS_SOLD_OR_REMOVED (contents-only
      policies) takes effect on the date the contents left the premises; DUPLICATE_NFIP_POLICY needs the other
      policy's declarations and takes effect on the original_effective_date of the later-dated policy, which is
      the one cancelled; CLOSING_DID_NOT_OCCUR needs the lender's statement that the loan did not close and takes
      effect on the original_effective_date; REMOVED_FROM_SFHA_BY_LOMA_LOMR needs the FEMA Letter of Map Amendment
      or Revision and takes effect on the current term_start; MORTGAGE_PAID_OFF needs the payoff letter,
      VOLUNTARY_NOT_REQUIRED needs no document, and REPLACED_BY_PRIVATE_FLOOD needs the private policy's
      declarations; for these three the effective date may not be earlier than voluntary_backdate_days before the
      date the signed request is received, and for REPLACED_BY_PRIVATE_FLOOD it is the private policy's effective
      date when that is later. A cancellation for MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED, REPLACED_BY_PRIVATE_FLOOD
      or REMOVED_FROM_SFHA_BY_LOMA_LOMR on a mortgage-required policy needs the lender's written release on file.
      The refund method follows the reason: FULL_FROM_INCEPTION returns every component booked on the policy,
      fees included; CURRENT_TERM_FULL returns the current term's risk premium, ICC premium, Reserve Fund
      Assessment and HFIAA surcharge in full; PRO_RATA returns the same four components of the current term
      multiplied by the days from the cancellation effective date to term_end divided by the days from term_start
      to term_end. Each component is rounded half-up to refund_rounding_increment before the components are added.
      Under CURRENT_TERM_FULL and PRO_RATA the Federal Policy Fee and probation surcharge are fully earned
      (fees_refundable_on_pro_rata is false). No refund at all is due for the current term under the reasons in
      claim_bar_reasons when a claim with a date of loss in the current term has been paid
      (nfipcom_msr_term_claims_paid above zero) or is still open (nfipcom_msr_term_claims_open above zero); the
      cancellation still proceeds. Each refunded component is booked as a CANCELLATION credit referencing the
      cancellation request, and the total is refunded to the payor of record. When the policy is mortgage-required,
      the mortgagee of record is notified of the cancellation.
    eligibility:
      - id: signed_request_on_file
        applies_to: [nfipcom_policy_cancelled]
        kind: authorization
        condition: A cancellation is processed only on a cancellation request signed by an authorized signer of the named insured and on file for the policy.
        evidence_fields: [nfipcom_requests.nfipcom_request_id, nfipcom_requests.outcome, nfipcom_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_requests.nfipcom_request_id]
          action_bindings:
            nfipcom_requests.nfipcom_request_id: nfipcom_request_id
      - id: cancellable_status
        applies_to: [nfipcom_policy_cancelled]
        kind: state
        condition: The policy status must be pending_effective or in_force when the cancellation is processed, and it is cancelled once processed.
        evidence_fields: [nfipcom_policies.status, nfipcom_policies.nfipcom_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.nfipcom_policy_id]
          action_bindings:
            nfipcom_policies.nfipcom_policy_id: nfipcom_policy_id
        state_contract:
          field: nfipcom_policies.status
          allowed: [pending_effective, in_force, cancelled]
      - id: lender_release_when_required
        applies_to: [nfipcom_policy_cancelled]
        kind: authorization
        condition: A cancellation for MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED, REPLACED_BY_PRIVATE_FLOOD or REMOVED_FROM_SFHA_BY_LOMA_LOMR on a mortgage-required policy needs the lender's written release on file.
        evidence_fields: [nfipcom_policies.mortgage_required, nfipcom_requests.lender_release_on_file, nfipcom_requests.nfipcom_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_requests.nfipcom_request_id]
          action_bindings:
            nfipcom_requests.nfipcom_request_id: nfipcom_request_id
    params:
      refund_method_by_reason:
        BUILDING_SOLD: PRO_RATA
        BUILDING_REMOVED_OR_DEMOLISHED: PRO_RATA
        CONTENTS_SOLD_OR_REMOVED: PRO_RATA
        DUPLICATE_NFIP_POLICY: FULL_FROM_INCEPTION
        CLOSING_DID_NOT_OCCUR: FULL_FROM_INCEPTION
        REMOVED_FROM_SFHA_BY_LOMA_LOMR: CURRENT_TERM_FULL
        MORTGAGE_PAID_OFF: PRO_RATA
        VOLUNTARY_NOT_REQUIRED: PRO_RATA
        REPLACED_BY_PRIVATE_FLOOD: PRO_RATA
      claim_bar_reasons: [MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED, REPLACED_BY_PRIVATE_FLOOD, REMOVED_FROM_SFHA_BY_LOMA_LOMR]
      refundable_components_partial: [RISK_PREMIUM, ICC_PREMIUM, RESERVE_FUND_ASSESSMENT, HFIAA_SURCHARGE]
    measures: [nfipcom_msr_term_claims_paid, nfipcom_msr_term_claims_open]
    formula:
      days_unearned: term_end - cancellation_effective_date
      term_days: term_end - term_start
      pro_rata_component_refund: round(amount * days_unearned / term_days, 2)
  - id: nfipcom_nullification
    subject: [nfipcom_policy_nullified, nfipcom_premium_credit]
    rule: >-
      Tidemark nullifies a policy, voiding it from inception as if it had never been issued, for NO_INSURABLE_INTEREST
      (the named insured never had an ownership or tenancy interest in the property), INELIGIBLE_PROPERTY (the
      building is not insurable under the NFIP, such as a building entirely over water or in a non-participating or
      suspended community at issue) or PREMIUM_PAYMENT_DISHONORED (the application premium was dishonored).
      Nullification is decided by Tidemark on its records, never on the customer's request, and is processed only on
      a policy whose status is pending_effective or in_force, which it leaves nullified. The cancellation_effective_date
      is the original_effective_date. Every component collected on the policy, the Federal Policy Fee and probation
      surcharge included, is credited as NULLIFICATION and refunded to the payor of record; under
      PREMIUM_PAYMENT_DISHONORED nothing was collected, so no credit or refund is booked. A claim on a nullified policy
      is not payable.
    eligibility:
      - id: nullifiable_status
        applies_to: [nfipcom_policy_nullified]
        kind: state
        condition: Nullification is decided by Tidemark on its records, never on the customer's request, and is processed only on a policy whose status is pending_effective or in_force, which it leaves nullified.
        evidence_fields: [nfipcom_policies.status, nfipcom_policies.nfipcom_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_policies.nfipcom_policy_id]
          action_bindings:
            nfipcom_policies.nfipcom_policy_id: nfipcom_policy_id
        state_contract:
          field: nfipcom_policies.status
          allowed: [pending_effective, in_force, nullified]
    params:
      nullification_reasons: [NO_INSURABLE_INTEREST, INELIGIBLE_PROPERTY, PREMIUM_PAYMENT_DISHONORED]
  - id: nfipcom_mortgagee_rights
    subject: [nfipcom_mortgagee_notice, nfipcom_coverage_updated]
    rule: >-
      A policy is mortgage-required when a federally regulated lender requires flood coverage as a condition of a
      loan secured by the building in a Special Flood Hazard Area; the first mortgagee and loan number are shown on
      the policy. A MORTGAGEE_CHANGE endorsement replaces the mortgagee of record and the loan number on the date it is
      recorded, and a mortgagee can be removed only with that mortgagee's written release or a payoff letter. When
      a mortgage-required policy is cancelled or is not renewed, Tidemark sends written notice to the mortgagee of
      record on the date the cancellation is processed or the grace period ends; the policy then continues for the
      benefit of the mortgagee only for mortgagee_protection_days calendar days after that notice. Building claim
      payments are issued jointly to the insured and the mortgagee of record when
      mortgagee_named_on_building_payment is true; contents, ICC and loss-avoidance payments go to the insured alone.
    eligibility: []
  - id: nfipcom_claim_intake
    subject: [nfipcom_claim_reported, nfipcom_adjuster_report]
    rule: >-
      A claim is taken for direct physical loss by or from flood — a general and temporary condition of partial or
      complete inundation of two or more acres of normally dry land or of two or more properties, at least one of
      which is the insured's, from overflow of inland or tidal waters, unusual and rapid accumulation or runoff of
      surface waters, mudflow, or collapse of land along a shore caused by erosion or undermining from flood. A
      claim is covered only when the date of loss falls on or after the date the coverage took effect and before the
      policy's cancellation effective date or term_end, a loss in renewal_grace being covered only if the renewal
      premium is then received inside the grace period. The claim number is assigned at first notice, and the
      assigned adjuster contacts the insured within adjuster_contact_hours elapsed hours under Tidemark's servicing
      standard. Every adjuster report records the measured building loss at replacement cost and at actual cash
      value and the contents loss at actual cash value. A FINAL report supersedes earlier reports on the claim, and a
      SUPPLEMENTAL report filed after it supersedes it for the coverages it measures.
    eligibility:
      - id: loss_inside_coverage_period
        applies_to: [nfipcom_claim_reported]
        kind: caller_fact
        condition: A claim is covered only when the date of loss falls on or after the date the coverage took effect and before the policy's cancellation effective date or term_end, a loss in renewal_grace being covered only if the renewal premium is then received inside the grace period.
        evidence_fields: [nfipcom_claims.date_of_loss, nfipcom_policies.original_effective_date, nfipcom_policies.term_end, nfipcom_policies.cancellation_effective_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [nfipcom_claims.date_of_loss]
          action_bindings:
            nfipcom_claims.date_of_loss: date_of_loss
  - id: nfipcom_proof_of_loss
    subject: [nfipcom_proof_of_loss_filed, nfipcom_claim_paid]
    rule: >-
      The insured must send a signed and sworn proof of loss for each coverage claimed. A proof of loss is accepted
      only when it is received no later than proof_of_loss_days calendar days after the date of loss, counted by
      adding the days to date_of_loss on the calendar, a receipt on the last day qualifying. Tidemark may accept the
      adjuster's report signed and sworn by the insured in lieu of a proof of loss. A proof of loss received after
      the deadline is not accepted and the coverage is denied as PROOF_OF_LOSS_NOT_TIMELY unless FEMA has issued a
      written extension of the deadline for the event, recorded on the claim. The loss is payable within
      claim_payment_days_after_pol calendar days after an accepted proof of loss, or within
      claim_payment_days_after_adjuster_report calendar days after an adjuster's report signed in lieu of it. A
      payment is never issued for more than the amount sworn on the proof of loss for that coverage.
    eligibility:
      - id: pol_deadline
        applies_to: [nfipcom_proof_of_loss_filed]
        kind: time
        condition: A proof of loss is accepted only when it is received no later than proof_of_loss_days calendar days after the date of loss, counted by adding the days to date_of_loss on the calendar, a receipt on the last day qualifying.
        evidence_fields: [nfipcom_claims.date_of_loss, nfipcom_claims.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nfipcom_claims.claim_number]
          action_bindings:
            nfipcom_claims.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of loss
          anchor_source: nfipcom_claims.date_of_loss
          relation: not_after
          duration_source: variants.proof_of_loss_days
          unit: calendar_days
          counting_rule: counted by adding the days to date_of_loss on the calendar, a receipt on the last day qualifying
          boundary: inclusive
  - id: nfipcom_claim_denial
    subject: [nfipcom_claim_denied]
    rule: >-
      Tidemark denies a coverage on a claim in writing, stating one denial_reason: NOT_A_FLOOD_EVENT when the damage
      did not result from flood as defined; LOSS_DURING_WAITING_PERIOD when the loss began before the coverage or
      increase took effect; NO_COVERAGE_ON_DATE_OF_LOSS when the policy was lapsed, cancelled or nullified on the date
      of loss; PROOF_OF_LOSS_NOT_TIMELY under the proof-of-loss rule; EXCLUDED_PROPERTY when the damaged items are not
      insured property (including basement contents beyond the listed basement items when basement_contents_covered
      is false); LOSS_BELOW_DEDUCTIBLE when the payable amount is zero after the deductible. A partial denial
      covers only the denied coverage and does not stop payment of the others. The denial letter informs the
      insured that an appeal may be filed with FEMA within appeal_window_days calendar days of the denial date and
      that suit must be filed within suit_limitation_months calendar months of the denial date; Tidemark does not
      decide FEMA appeals.
    eligibility: []
