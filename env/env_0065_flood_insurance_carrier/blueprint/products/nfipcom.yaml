# Tidemark Flood — NFIP Standard Flood Insurance Policy, General Property Form and Residential
# Condominium Building Association Policy (RCBAP), Write Your Own servicing for businesses, landlords of
# larger residential buildings, non-profits and condominium associations. Federal program rules are stated
# as the NFIP sets them; servicing cadences left to the Write Your Own company are Tidemark's own written
# schedule. The rating engine's premium lines (risk premium, ICC premium, Federal Policy Fee) are read from
# the rated figures recorded on the policy and never recomputed at the desk.
category: nfipcom
display_name: NFIP General Property Form and RCBAP Flood Policies (Write Your Own)

binding:
  holding_table: nfipcom_policies
  event_tables: [nfipcom_billing, nfipcom_claims, nfipcom_changes]
  intake_tables: [nfipcom_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [pending_effective, in_force, renewal_grace, lapsed, cancelled, nullified]
  transitions:
    - {from: pending_effective, to: in_force, by: system, means: The waiting period ends and coverage attaches at 12:01 a.m. on the policy effective date.}
    - {from: in_force, to: renewal_grace, by: system, means: The policy term expires with the renewal premium unpaid and the renewal grace period begins.}
    - {from: renewal_grace, to: in_force, by: agent, means: The full renewal premium is received inside the grace period and the new term is booked without a break in coverage.}
    - {from: renewal_grace, to: lapsed, by: system, means: The grace period ends with the renewal premium still unpaid; coverage ended at the expiration date.}
    - {from: pending_effective, to: cancelled, by: user, means: An authorized signer of the named insured signs a cancellation request before the policy took effect.}
    - {from: in_force, to: cancelled, by: user, means: An authorized signer of the named insured signs a cancellation request for an in-force policy.}
    - {from: pending_effective, to: nullified, by: agent, means: Tidemark voids the policy from inception because it should never have been issued.}
    - {from: in_force, to: nullified, by: agent, means: Tidemark voids an in-force policy from inception because it should never have been issued.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: The amount the named insured owes on the policy; premium components booked raise it, payments and credits lower it, and refunds paid out bring a credit balance back to zero.
  - key: claim_paid
    unit: USD
    meaning: Net claim money issued on the policy; each claim payment raises it and each voided payment lowers it.

parameter_schema:
  building_coverage_available: Whether building coverage may be written on this tier; boolean.
  contents_coverage_available: Whether contents coverage may be written on this tier; boolean.
  max_building_coverage_fixed: Statutory maximum building coverage per building for a General Property Form tier; USD (0 on RCBAP tiers, whose cap is per unit).
  building_limit_per_unit: Statutory building coverage available per residential unit under an RCBAP, the building cap being the lower of this times the number of units and the replacement cost value; USD (0 on General Property Form tiers).
  max_contents_coverage: Statutory maximum contents coverage per building or unit; USD.
  coverage_increment: Increment in which limits are written; USD.
  contents_owner_basis: Whose property the contents coverage insures; enum (BUSINESS_OWNED_PROPERTY, OWNER_PROPERTY_IN_BUILDING, ASSOCIATION_COMMON_PROPERTY).
  icc_available: Whether Increased Cost of Compliance coverage attaches; boolean.
  icc_limit: Increased Cost of Compliance limit per building per loss, in addition to the building limit; USD (0 where not available).
  building_settlement_basis: Basis on which building losses are settled; enum (ACTUAL_CASH_VALUE, REPLACEMENT_COST).
  coinsurance_applies: Whether a coinsurance penalty applies when the building is under-insured; boolean.
  coinsurance_pct: Share of replacement cost value the building limit must reach (or the statutory building cap, whichever is lower) to avoid the coinsurance penalty; percent (0 where coinsurance does not apply).
  contents_settlement_basis: Basis on which contents losses are settled; enum (ACTUAL_CASH_VALUE).
  loss_avoidance_limit: Maximum reimbursement for sandbags, fill and pumping supplies bought to protect insured property, with no deductible; USD.
  property_removed_to_safety_days: Days that insured property moved away to protect it from flood stays covered at the safe location; calendar days.
  building_deductible_options: Building deductible amounts that may be elected; list of USD.
  contents_deductible_options: Contents deductible amounts that may be elected; list of USD.
  min_building_deductible_up_to_threshold: Minimum building deductible when the building limit is at or below the deductible threshold; USD.
  min_building_deductible_over_threshold: Minimum building deductible when the building limit exceeds the deductible threshold; USD.
  deductible_limit_threshold: Building limit at or below which the lower minimum deductible applies; USD.
  min_contents_deductible: Minimum contents deductible; USD.
  default_building_deductible: Building deductible applied when the application elects none; USD.
  default_contents_deductible: Contents deductible applied when the application elects none; USD.
  max_deductible: Highest deductible that may be elected on either coverage; USD.
  standard_waiting_days: Waiting period between the application-and-payment date and coverage attaching for new business and coverage increases; calendar days.
  loan_transaction_waiting_days: Waiting period when coverage is bought or increased in connection with making, increasing, extending or renewing a loan; calendar days.
  map_revision_window_months: Window after a flood map revision that places the building in a Special Flood Hazard Area during which the map-revision exception applies; calendar months.
  map_revision_waiting_days: Waiting period under the map-revision exception; calendar days.
  policy_term_months: Length of one policy term; calendar months.
  hfiaa_surcharge: HFIAA annual surcharge for a policy that is not a primary residence, which is every policy on this form; USD per term.
  reserve_fund_assessment_pct: Reserve Fund Assessment charged on the risk premium plus ICC premium; percent.
  annual_risk_premium_increase_cap_pct: Statutory cap on the year-over-year increase of the risk premium line at renewal; percent.
  probation_surcharge: Surcharge added to each term while the community is on probation; USD per term.
  full_premium_with_application: Whether the full term premium must accompany the application or renewal (no installments); boolean.
  underpayment_cure_days: Days after Tidemark's underpayment notice to pay the difference before limits are reduced to what the premium received buys; calendar days.
  accepted_payment_methods: Payment methods Tidemark accepts on NFIP premium; list of enum.
  renewal_notice_days: Days before expiration Tidemark issues the renewal bill under its servicing schedule; calendar days.
  renewal_grace_days: Grace period after expiration in which the full renewal premium keeps coverage continuous; calendar days.
  renewal_bill_copy_to_mortgagee: Whether the renewal bill is also sent to the mortgagee of record when the policy is mortgage-required; boolean.
  signed_cancellation_request_required: Whether a cancellation needs a signed cancellation request from an authorized signer of the named insured; boolean.
  fees_refundable_on_pro_rata: Whether the Federal Policy Fee and probation surcharge come back on a pro rata or current-term refund; boolean.
  refund_rounding_increment: Rounding applied to each refunded component (half-up); USD.
  voluntary_backdate_days: How many days before the date the signed request is received a voluntary, mortgage-payoff or private-replacement cancellation may take effect; calendar days.
  mortgagee_protection_days: Days a cancelled or non-renewed policy stays in force for the mortgagee only after Tidemark notifies it; calendar days.
  proof_of_loss_days: Days after the date of loss within which a signed and sworn proof of loss must be received; calendar days.
  claim_payment_days_after_pol: Days after receipt of an accepted proof of loss within which the loss is payable; calendar days.
  claim_payment_days_after_adjuster_report: Days after an adjuster's report signed by the insured in lieu of proof of loss within which the loss is payable; calendar days.
  appeal_window_days: Days after the date of a written denial within which the policyholder may appeal to FEMA; calendar days.
  suit_limitation_months: Months after the date of the written denial within which suit must be filed; calendar months.
  adjuster_contact_hours: Tidemark servicing standard for the assigned adjuster to contact the insured after the claim is reported; elapsed hours.
  mortgagee_named_on_building_payment: Whether building claim payments are issued jointly to the insured and the mortgagee of record; boolean.
  ec_required_for_rating: Whether an Elevation Certificate is required to rate the policy under Risk Rating 2.0; boolean.
  ec_first_floor_height_used: Whether a first floor height certified on an Elevation Certificate replaces the rating engine's estimated first floor height; boolean.
  basement_contents_covered: Whether contents kept in a basement are covered beyond the listed basement items; boolean.
  authorized_signer_required: Whether requests on the policy must be signed by an officer, partner, owner or association board officer on the authorized-signer list; boolean.

