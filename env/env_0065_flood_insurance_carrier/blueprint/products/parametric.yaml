# Tidemark Flood — FloodPay, a parametric flood cover written on a surplus lines basis. A depth sensor
# that Tidemark installs at the insured location measures flood water; when the measured depth crosses a
# trigger band, a pre-agreed amount is paid with no adjuster and no proof of loss. FloodPay pays regardless
# of the actual damage and is sold alongside, never in place of, indemnity flood insurance: it does not
# satisfy a lender's mandatory purchase requirement. All payouts, bands, rates and periods are Tidemark's
# own written schedules; surplus lines tax rates are recorded on the policy record.
category: parametric
display_name: FloodPay Parametric Flood Cover (Surplus Lines)

binding:
  holding_table: parametric_policies
  event_tables: [parametric_billing, parametric_events]
  intake_tables: [parametric_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance, aggregate_remaining: aggregate_remaining}

lifecycle:
  states: [pending_installation, active, sensor_fault, expired, cancelled]
  transitions:
    - {from: pending_installation, to: active, by: system, means: The sensor is installed and reports its first verified reading, and cover attaches.}
    - {from: active, to: sensor_fault, by: system, means: The sensor stops reporting for longer than the fault threshold and cover is suspended.}
    - {from: sensor_fault, to: active, by: system, means: The sensor is repaired or replaced and reports again, and cover resumes.}
    - {from: active, to: expired, by: system, means: The term ends without renewal.}
    - {from: active, to: cancelled, by: user, means: The policyholder signs a cancellation request.}
    - {from: pending_installation, to: cancelled, by: user, means: The policyholder cancels before the sensor is installed.}
    - {from: sensor_fault, to: cancelled, by: user, means: The policyholder cancels while cover is suspended.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: The amount the policyholder owes; premium, fee and taxes raise it, payments and credits lower it, refunds paid out bring a credit balance back to zero.
  - key: aggregate_remaining
    unit: USD
    meaning: Payout capacity left in the current term; the term aggregate is booked in at the term start and each payout draws it down.

parameter_schema:
  payout_limit: Payout for a full-band event; USD.
  annual_aggregate_multiple: Term aggregate as a multiple of the payout limit; number.
  depth_band_1_inches: Measured depth that triggers band 1; inches.
  depth_band_2_inches: Measured depth that triggers band 2; inches.
  depth_band_3_inches: Measured depth that triggers band 3 (full payout); inches.
  band_1_payout_pct: Payout for band 1 as a percent of the payout limit; percent.
  band_2_payout_pct: Payout for band 2 as a percent of the payout limit; percent.
  band_3_payout_pct: Payout for band 3 as a percent of the payout limit; percent.
  event_window_hours: Window within which all readings belong to one flood event; elapsed hours.
  max_payouts_per_event: Payouts per flood event; count.
  payout_days_after_trigger: Business days after a verified trigger within which the payout is issued; business days.
  reading_verification_required: Whether a trigger reading must be verified against the sensor's health log before payout; boolean.
  sensor_fault_hours: Hours without a sensor report after which cover is suspended; elapsed hours.
  sensor_repair_target_days: Tidemark's target for repairing or replacing a faulty sensor; business days.
  installation_window_days: Days after binding within which the sensor must be installed or the policy is cancelled flat; calendar days.
  installation_fee: Fee for sensor installation, fully earned once installed; USD.
  annual_monitoring_fee: Annual sensor monitoring fee, fully earned at each term start; USD.
  customer_type_allowed: Kind of customer the tier serves; enum (INDIVIDUAL, BUSINESS).
  max_policies_per_location: Policies allowed on one location; count.
  base_rate_pct_of_limit: Annual premium as a percent of the payout limit before the zone factor; percent.
  zone_factor_table: Rating factor by FEMA flood zone; mapping zone -> factor.
  minimum_premium: Lowest annual premium before fees and taxes; USD.
  premium_rounding_increment: Rounding of the annual premium; USD.
  surplus_lines_taxable_fees: Whether the surplus lines tax applies to installation and monitoring fees as well as premium; boolean.
  payment_plans: Payment plans offered; list of enum (ANNUAL).
  standard_waiting_days: Waiting period after sensor activation before a reading can trigger a payout; calendar days.
  named_storm_exclusion_hours: Hours before a named storm's forecast landfall within which a new policy cannot be bound; elapsed hours.
  renewal_offer_days: Days before term end the renewal offer is issued; calendar days.
  nonrenewal_notice_days: Written notice before term end for a Tidemark non-renewal; calendar days.
  cancellation_refund_method: Credit method on a policyholder cancellation; enum (PRO_RATA).
  minimum_earned_premium_pct: Share of the term premium fully earned at activation; percent.
  no_refund_after_payout: Whether the term premium is fully earned once a payout has been made; boolean.
  flat_cancel_if_not_installed: Whether a policy whose sensor was never installed is cancelled with full return of premium; boolean.
  mandatory_purchase_eligible: Whether the cover can satisfy a lender's flood insurance requirement; boolean.
  payout_payee: Who receives payouts; enum (POLICYHOLDER).
  payout_method: How payouts are made; enum (ACH).
  dispute_window_days: Days after a payout decision within which the policyholder may dispute the reading; calendar days.
  independent_gauge_check: Whether a disputed reading is checked against the nearest USGS stream gauge or NOAA tide gauge record; boolean.
  data_retention_years: Years sensor readings are retained; years.
  max_location_elevation_band: Highest band of lowest-floor height above base flood elevation the tier accepts; whole feet.
  occupancy_allowed: Occupancies the tier accepts; list of enum.
  sensor_mount_height_inches: Height above the location's lowest finished floor at which the sensor's zero point is set; inches.
  tamper_exclusion: Whether readings from a moved or tampered sensor are void; boolean.
  aggregate_reinstatement_available: Whether used aggregate can be bought back mid-term; boolean.
  aggregate_reinstatement_rate_pct: Premium to buy back used aggregate, as a percent of the amount reinstated pro rata for the remaining term; percent.
  claims_contact_hours: Hours within which Tidemark confirms a trigger to the policyholder; elapsed hours.
  suit_limitation_months: Months after a payout decision within which suit may be filed; calendar months.
  policy_term_months: Term length; calendar months.

