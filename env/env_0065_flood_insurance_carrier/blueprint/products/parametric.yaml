events:
  - type: parametric_policy_bound
    target: parametric_policies
    mutation: create
    meaning: A FloodPay policy is bound with full payment and waits in pending_installation until its sensor reports.
    grain: one row per policy bound
    fields:
      policy_number: Policy number.
      variant_name: Tier written.
      location_address: Insured location.
      flood_zone: FEMA flood zone of the location.
      application_date: Date the signed application and payment were received.
      term_start: Start of the term (the binding date).
      term_end: End of the term.
      surplus_lines_state: State whose surplus lines tax applies.
      surplus_lines_tax_pct: Tax rate in force.
      term_premium: Annual premium before fees and taxes.
    triggers:
      - event: parametric:parametric_premium_charged
        map: {term_start: term_start, charge_basis: NEW_BUSINESS}
      - event: parametric:parametric_premium_payment
        map: {term_start: term_start}
  - type: parametric_sensor_activated
    target: parametric_policies
    mutation: {transition: {from: pending_installation, to: active}}
    meaning: The installed sensor reports its first verified reading and cover attaches.
    grain: one row per activation
    fields:
      sensor_serial: Serial number of the installed sensor.
      sensor_activated_date: Date of the first verified reading.
    triggers:
      - event: parametric:parametric_aggregate_booked
        map: {term_start: sensor_activated_date, booking_reason: TERM_AGGREGATE}
  - type: parametric_cover_suspended
    target: parametric_policies
    mutation: {transition: {from: active, to: sensor_fault}}
    meaning: The sensor stops reporting beyond the fault threshold and cover is suspended.
    grain: one row per suspension
    fields:
      fault_started_at: Moment of the sensor's last report before the fault.
    triggers: []
  - type: parametric_cover_resumed
    target: parametric_policies
    mutation: {transition: {from: sensor_fault, to: active}}
    meaning: The sensor is repaired or replaced and reports again.
    grain: one row per resumption
    fields:
      sensor_serial: Serial number of the sensor now reporting.
      fault_started_at: Cleared on resumption.
    triggers: []
  - type: parametric_term_renewed
    target: parametric_policies
    mutation: update
    meaning: The renewal is paid by term end and the next term booked.
    grain: one row per term renewed
    fields:
      term_start: Start of the renewed term.
      term_end: End of the renewed term.
      term_premium: Premium for the renewed term.
      surplus_lines_tax_pct: Tax rate for the renewed term.
    triggers:
      - event: parametric:parametric_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
      - event: parametric:parametric_aggregate_booked
        map: {term_start: term_start, booking_reason: TERM_AGGREGATE}
  - type: parametric_policy_expired
    target: parametric_policies
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without renewal.
    grain: one row per expiration
    fields:
      closed_date: Term end.
    triggers: []
  - type: parametric_policy_cancelled
    target: parametric_policies
    mutation: {transition: [{from: active, to: cancelled}, {from: pending_installation, to: cancelled}, {from: sensor_fault, to: cancelled}]}
    meaning: The policyholder's signed cancellation request takes effect, or a policy whose sensor was never installed is cancelled flat.
    grain: one row per cancellation
    fields:
      cancellation_reason: Reason.
      cancellation_effective_date: Date the cancellation takes effect.
      closed_date: Date processed.
    triggers:
      - event: parametric:parametric_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: parametric_premium_charged
    target: parametric_billing
    meaning: One premium item is booked — term premium, installation fee, monitoring fee, surplus lines tax or aggregate reinstatement premium.
    grain: one row per item per term per occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term.
      component: Item.
      charge_basis: Occasion.
      amount: Amount, positive.
      posted_date: Date booked.
      reference_id: Aggregate booking behind a reinstatement premium; empty otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: parametric_premium_payment
    target: parametric_billing
    meaning: A payment is received.
    grain: one row per payment item
    distinguish_by: [payment_ref, term_start]
    fields:
      term_start: Term.
      amount: Amount, positive.
      posted_date: Date received.
      payment_ref: Card or ACH reference.
    account: premium_balance
    direction: out
    triggers: []
  - type: parametric_premium_credit
    target: parametric_billing
    meaning: Returned premium and tax are credited on a cancellation.
    grain: one row per credited item
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term.
      component: Item credited.
      charge_basis: CANCELLATION.
      amount: Amount, positive.
      posted_date: Date booked.
      reference_id: Cancellation request record.
    account: premium_balance
    direction: out
    triggers:
      - event: parametric:parametric_refund_disbursed
        map: {reference_id: reference_id}
  - type: parametric_refund_disbursed
    target: parametric_billing
    meaning: A credit balance is paid out.
    grain: one row per refund
    distinguish_by: [reference_id]
    fields:
      amount: Refund, positive.
      posted_date: Date issued.
      reference_id: Record whose credit is refunded.
      payment_ref: Refund reference.
    account: premium_balance
    direction: in
    triggers: []
  - type: parametric_aggregate_booked
    target: parametric_events
    meaning: Payout capacity is booked for the term at activation or renewal, or bought back mid-term.
    grain: one row per aggregate booking
    distinguish_by: [term_start, booking_reason, event_date]
    fields:
      term_start: Term the capacity belongs to.
      booking_reason: TERM_AGGREGATE or REINSTATEMENT.
      amount: Capacity booked, positive.
      event_date: Date booked.
    account: aggregate_remaining
    direction: in
    triggers: []
  - type: parametric_trigger_recorded
    target: parametric_events
    meaning: A flood event's peak verified sensor reading is recorded with the band it reached.
    grain: one row per flood event at the location
    distinguish_by: [event_reference]
    fields:
      event_reference: Flood event reference assigned at the first reading above band 1.
      event_start_at: Moment of the first reading above band 1.
      peak_depth_inches: Peak verified depth in the event window.
      band_reached: Highest band reached.
      reading_verified: Whether the reading passed the sensor health check.
      event_date: Date recorded.
    triggers:
      - event: parametric:parametric_payout_issued
        when: {band_reached: [BAND_1, BAND_2, BAND_3]}
        map: {event_reference: event_reference, band_reached: band_reached}
  - type: parametric_payout_issued
    target: parametric_events
    meaning: The payout for a flood event's band is paid to the policyholder.
    grain: one row per payout
    distinguish_by: [event_reference]
    fields:
      event_reference: Flood event paid.
      band_reached: Band paid.
      amount: Payout, positive.
      payment_ref: ACH reference.
      event_date: Date paid.
    account: aggregate_remaining
    direction: out
    triggers: []
  - type: parametric_payout_declined
    target: parametric_events
    meaning: A recorded reading does not lead to a payout and the decision is sent in writing.
    grain: one row per declined event
    distinguish_by: [event_reference, decline_reason]
    fields:
      event_reference: Flood event.
      decline_reason: Reason.
      event_date: Date of the decision.
    triggers: []

measures:
  - id: parametric_msr_term_payouts
    window: The current term, from term_start inclusive to term_end exclusive, judged by each payout's event_date.
    measure: Count of parametric_payout_issued rows on the policy in the window.

policies:
  - id: parametric_agg_multi_holding
    subject: [parametric_policy_bound]
    rule: >-
      A customer may hold FloodPay policies on several locations, but no more than max_policies_per_location policy may be
      live on one location: a policy is bound only when no other FloodPay policy at the same location address is in
      status pending_installation, active or sensor_fault. A FloodPay policy pays on its own trigger and is never
      combined with, reduced by or coordinated with any indemnity flood policy on the same property; because
      mandatory_purchase_eligible is false it never satisfies a lender's flood insurance requirement.
    eligibility:
      - id: one_live_policy_per_location
        applies_to: [parametric_policy_bound]
        kind: dedup
        condition: 'A customer may hold FloodPay policies on several locations, but no more than max_policies_per_location policy may be live on one location: a policy is bound only when no other FloodPay policy at the same location address is in status pending_installation, active or sensor_fault.'
        evidence_fields: [parametric_policies.location_address, parametric_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parametric_policies.location_address]
          action_bindings:
            parametric_policies.location_address: location_address
        dedup_contract:
          table: parametric_policies
          mode: separate_record
          object_bindings: {location_address: location_address}
          duplicate_filters: {status: [pending_installation, active, sensor_fault]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: parametric_agg_aggregate
    subject: [parametric_aggregate_booked, parametric_payout_issued, parametric_premium_charged]
    rule: >-
      Each term's payout capacity is the payout_limit times annual_aggregate_multiple, booked when the sensor activates and
      at each renewal; every payout draws it down, and no payout may exceed the capacity remaining, a band payout larger
      than what remains being paid only up to what remains. On a tier where aggregate_reinstatement_available is true the
      policyholder may buy back used capacity up to the original term aggregate, for a premium of
      aggregate_reinstatement_rate_pct of the amount reinstated multiplied by the days left in the term divided by the
      days in the term, rounded to the cent.
    eligibility: []
    formula:
      term_aggregate: payout_limit * annual_aggregate_multiple
  - id: parametric_binding_installation
    subject: [parametric_policy_bound, parametric_sensor_activated, parametric_policy_cancelled]
    rule: >-
      A policy is not bound while a named storm's forecast landfall affecting the location is within
      named_storm_exclusion_hours elapsed hours. The location's lowest floor may stand no more than
      max_location_elevation_band whole feet above the base flood elevation, and its occupancy must be one of
      occupancy_allowed. Tidemark installs the sensor with its zero point sensor_mount_height_inches above the lowest
      finished floor, and cover attaches when the sensor reports its first verified reading. When the sensor is not
      installed within installation_window_days calendar days of binding, the policy is cancelled flat with full return
      of premium and taxes when flat_cancel_if_not_installed is true.
    eligibility: []
  - id: parametric_premium
    subject: [parametric_premium_charged, parametric_policy_bound, parametric_term_renewed, parametric_premium_payment]
    rule: >-
      The annual premium is base_rate_pct_of_limit of the payout_limit multiplied by the zone factor for the location's
      flood zone, rounded to premium_rounding_increment and never less than minimum_premium. The installation_fee is
      booked once at binding and the annual_monitoring_fee at each term start; the surplus lines tax is the recorded rate
      applied to the premium, and to the fees when surplus_lines_taxable_fees is true, rounded to the cent. Payment is in
      full under the ANNUAL plan.
    eligibility: []
    params:
      per_tier:
        FloodPay Home 5K: {payout_limit: =payout_limit, base_rate_pct_of_limit: =base_rate_pct_of_limit, minimum_premium: =minimum_premium}
        FloodPay Home 10K: {payout_limit: =payout_limit, base_rate_pct_of_limit: =base_rate_pct_of_limit, minimum_premium: =minimum_premium}
        FloodPay Home 25K: {payout_limit: =payout_limit, base_rate_pct_of_limit: =base_rate_pct_of_limit, minimum_premium: =minimum_premium}
        FloodPay Business 50K: {payout_limit: =payout_limit, base_rate_pct_of_limit: =base_rate_pct_of_limit, minimum_premium: =minimum_premium}
        FloodPay Business 100K: {payout_limit: =payout_limit, base_rate_pct_of_limit: =base_rate_pct_of_limit, minimum_premium: =minimum_premium}
        FloodPay Business 250K: {payout_limit: =payout_limit, base_rate_pct_of_limit: =base_rate_pct_of_limit, minimum_premium: =minimum_premium}
    formula:
      term_premium: max(minimum_premium, round(payout_limit * base_rate_pct_of_limit / 100 * zone_factor_table[flood_zone], 0))
  - id: parametric_trigger_payout
    subject: [parametric_trigger_recorded, parametric_payout_issued, parametric_payout_declined]
    rule: >-
      All readings within event_window_hours elapsed hours of the first reading above depth_band_1_inches belong to one
      flood event, which pays at most max_payouts_per_event payout on its peak verified depth: band 3 at or above
      depth_band_3_inches pays band_3_payout_pct of the payout_limit, band 2 at or above depth_band_2_inches pays
      band_2_payout_pct, and band 1 at or above depth_band_1_inches pays band_1_payout_pct. A payout is made only on a
      reading that passed the sensor health check when reading_verification_required is true, only for an event that
      starts at least standard_waiting_days calendar days after the sensor activated, and only while the policy status is
      active; readings from a moved or tampered sensor are void when tamper_exclusion is true. The payout is issued by
      payout_method to the payout_payee within payout_days_after_trigger business days of the verified trigger, and
      Tidemark confirms the trigger within claims_contact_hours. An event that reaches no band, starts in the waiting
      period, falls in a sensor fault or rests on an unverified reading is declined in writing.
    eligibility:
      - id: payout_only_active
        applies_to: [parametric_payout_issued]
        kind: caller_fact
        condition: A payout is made only on a reading that passed the sensor health check when reading_verification_required is true, only for an event that starts at least standard_waiting_days calendar days after the sensor activated, and only while the policy status is active; readings from a moved or tampered sensor are void when tamper_exclusion is true.
        evidence_fields: [parametric_events.event_reference, parametric_events.reading_verified, parametric_events.event_start_at, parametric_policies.sensor_activated_date, parametric_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parametric_events.event_reference]
          action_bindings:
            parametric_events.event_reference: event_reference
    params:
      per_tier:
        FloodPay Home 5K: {depth_band_1_inches: =depth_band_1_inches, band_1_payout_pct: =band_1_payout_pct}
        FloodPay Home 10K: {depth_band_1_inches: =depth_band_1_inches, band_1_payout_pct: =band_1_payout_pct}
        FloodPay Home 25K: {depth_band_1_inches: =depth_band_1_inches, band_1_payout_pct: =band_1_payout_pct}
        FloodPay Business 50K: {depth_band_1_inches: =depth_band_1_inches, band_1_payout_pct: =band_1_payout_pct}
        FloodPay Business 100K: {depth_band_1_inches: =depth_band_1_inches, band_1_payout_pct: =band_1_payout_pct}
        FloodPay Business 250K: {depth_band_1_inches: =depth_band_1_inches, band_1_payout_pct: =band_1_payout_pct}
  - id: parametric_sensor_fault
    subject: [parametric_cover_suspended, parametric_cover_resumed]
    rule: >-
      When the sensor sends no report for more than sensor_fault_hours elapsed hours, cover is suspended from the moment
      of its last report and Tidemark repairs or replaces it within sensor_repair_target_days business days at no charge;
      cover resumes when the sensor reports again. No payout is made for an event that starts during a suspension, and
      the term is not extended or the premium returned for it.
    eligibility: []
  - id: parametric_renewal
    subject: [parametric_term_renewed, parametric_policy_expired]
    rule: >-
      The renewal offer is issued renewal_offer_days calendar days before term_end and is bound when paid by term_end;
      otherwise the policy expires at term_end. Tidemark non-renews only by written notice nonrenewal_notice_days calendar
      days before term_end. Unused aggregate does not carry over.
    eligibility: []
  - id: parametric_cancellation_refund
    subject: [parametric_policy_cancelled, parametric_premium_credit, parametric_refund_disbursed]
    rule: >-
      A cancellation is processed only on the policyholder's signed cancellation request on file, except the flat
      cancellation of a policy whose sensor was never installed. The earned premium is the larger of the pro rata share
      of the term premium to the cancellation date and minimum_earned_premium_pct of it; the whole term premium is earned
      when a payout has been made in the term (parametric_msr_term_payouts above zero) and no_refund_after_payout is true.
      The installation and monitoring fees are earned, tax is returned on the returned premium, and the credit is
      refunded to the policyholder. A disputed reading may be raised within dispute_window_days calendar days of the
      decision and is checked against the nearest USGS stream gauge or NOAA tide gauge when independent_gauge_check is
      true.
    eligibility:
      - id: signed_request_on_file
        applies_to: [parametric_policy_cancelled]
        kind: authorization
        condition: A cancellation is processed only on the policyholder's signed cancellation request on file, except the flat cancellation of a policy whose sensor was never installed.
        evidence_fields: [parametric_requests.parametric_request_id, parametric_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parametric_requests.parametric_request_id]
          action_bindings:
            parametric_requests.parametric_request_id: parametric_request_id
    measures: [parametric_msr_term_payouts]
