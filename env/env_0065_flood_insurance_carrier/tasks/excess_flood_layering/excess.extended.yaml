    ladder:
    - when: >-
        at least one layer payment, or two or more primary payments (building payments of the NFIP policy of the home, dwelling
        payments of the HomeFlood policy of the home), issued fewer than 36 whole months before the renewal is booked
      value: K('loss_severe_pct') — a surcharge of 25 percent
    - when: no layer payment and exactly one primary payment in that window
      value: K('loss_single_pct') — a surcharge of 10 percent
    - when: otherwise
      value: no loss-history adjustment (0 percent)
    baseline:
      loss_history_pct: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: dwelling
  - id: tidemark_account_relationship
    effect: parameter
    decides: account_pct
    bindings:
    - homeflood_primary_active
    - nfip_primary_in_force
    - account_pct
    ladder:
    - when: the HomeFlood policy of the home exists
      value: K('account_homeflood_pct') — a credit of 7 percent
    - when: it does not but the NFIP policy of the home exists
      value: K('account_nfip_pct') — a credit of 4 percent
    - when: otherwise
      value: no account adjustment (0 percent)
    baseline:
      account_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: dwelling
  - id: residence_designation
    effect: parameter
    decides: occupancy_pct
    bindings:
    - nfip_primary_residence
    - occupancy_pct
    ladder:
    - when: the NFIP policy of the home does not designate the home the insured's primary residence
      value: K('occupancy_secondary_pct') — a surcharge of 12 percent
    - when: that NFIP policy designates the home the insured's primary residence
      value: K('occupancy_primary_pct') — a credit of 3 percent
    - when: otherwise (no NFIP policy of the home)
      value: no occupancy adjustment (0 percent)
    baseline:
      occupancy_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: dwelling
  - id: tenure_on_layer
    effect: parameter
    decides: tenure_pct
    bindings:
    - renewals_booked
    - tenure_pct
    ladder:
    - when: five or more renewal term premiums already booked on the policy
      value: K('tenure_long_pct') — a credit of 6 percent
    - when: two to four renewal term premiums already booked
      value: K('tenure_mid_pct') — a credit of 3 percent
    - when: otherwise (fewer than two)
      value: no tenure adjustment (0 percent)
    baseline:
      tenure_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: payment_ahead_of_term_end
    effect: parameter
    decides: early_pay_pct
    bindings:
    - renewal_paid_on
    - days_paid_ahead
    - early_pay_pct
    ladder:
    - when: the latest payment for the coming term was posted 30 days or more before the current term end
      value: K('early_long_pct') — a credit of 4 percent
    - when: it was posted 10 to 29 days before the current term end
      value: K('early_short_pct') — a credit of 2 percent
    - when: otherwise (fewer days, or no payment for the coming term)
      value: no early-renewal adjustment (0 percent)
    baseline:
      early_pay_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: certificate_source
    effect: method
    decides: elevation_credit_mult
    bindings:
    - nfip_cert_lowest
    - nfip_cert_bfe
    - nfip_cert_age_months
    - elevation_credit_mult
    ladder:
    - when: the policy record carries an accepted Elevation Certificate
      method: >-
        the multiplier is read from the policy record's own whole-foot figure against the tier's credit threshold
    - when: >-
        the policy record carries none and the NFIP policy of the home holds an applied certificate (the latest received)
        surveyed no more than the tier's maximum certificate age, counted in whole months (twelve for each year), before the
        date it was received
      method: >-
        the multiplier is read from that NFIP certificate: certified lowest floor elevation less certified base flood elevation,
        compared with the tier's credit threshold
    - when: otherwise (neither record carries such a certificate)
      method: no certificate is read; the multiplier is one
    baseline:
      elevation_credit_mult: >-
        ((1 - P('elevation_credit_pct') / 100) if F('elevation_difference_ft') >= P('elevation_credit_threshold_ft') else
        1) if F('ec_on_file') == True else 1
    evidence:
    - cross_category
    - date
    cross_difficulty: dwelling
  baseline:
    rule: >-
      The renewal term premium starts from the scheduled layer charge: the excess dwelling limit divided by 1,000 times the
      tier's dwelling rate per 1,000, plus the excess personal property limit divided by 1,000 times the tier's personal property
      rate per 1,000. The scheduled layer charge is multiplied by the zone factor that the tier's zone factor table gives
      the flood zone on the policy record and by the elevation multiplier. The elevation multiplier is one less the tier's
      elevation credit percentage where the policy record carries an accepted Elevation Certificate showing the lowest floor
      at least the tier's credit threshold in whole feet above the base flood elevation, and one where it does not. The tier's
      loss-of-use charge is then added, the sum is rounded to the cent once, and the renewal term premium is never less than
      the tier's minimum premium.
    params:
    - building_rate_per_1000
    - contents_rate_per_1000
    - zone_factor_table
    - elevation_credit_pct
    - elevation_credit_threshold_ft
    - loss_of_use_premium
    - minimum_premium
    - zone_factor_low
    - zone_factor_a99_ar
    - zone_factor_ao
    - zone_factor_a
    - zone_factor_d
    - zone_factor_v
  inputs:
    history:
    - table: excess_billing
      aggregate: count
      field: excess_billing_id
      filters:
        event_type: excess_premium_charged
        component: TERM_PREMIUM
        charge_basis: RENEWAL
    - table: excess_billing
      aggregate: latest
      field: posted_date
      filters:
        event_type: excess_premium_payment
    - table: excess_claims
      aggregate: count
      field: excess_claim_event_id
      within_months: 36
      filters:
        event_type: excess_claim_paid
    - category: dwelling
      table: dwelling_claims
      aggregate: count
      field: dwelling_claim_event_id
      within_months: 36
      filters:
        event_type: dwelling_claim_paid
    - category: dwelling
      table: dwelling_changes
      aggregate: latest
      field: ec_lowest_floor_elevation
      filters:
        event_type: dwelling_ec_received
        ec_applied: true
    - category: homeflood
      table: homeflood_claims
      aggregate: count
      field: homeflood_claim_event_id
      within_months: 36
      filters:
        event_type: homeflood_claim_paid
        coverage_part: DWELLING
    cross_category:
    - dwelling
    - homeflood
- id: excess_ext_limit_increase_premium
  base_policy_refs:
  - excess_limits_eligibility
  - excess_waiting_period
  - excess_endorsements
  overwrite:
  - base_policy: excess_waiting_period
    superseded_clause: >-
      An Excess Flood policy, and a mid-term limit increase, takes effect at 12:01 a.m. on the day standard_waiting_days calendar
      days after the signed application (or endorsement request) and full payment are received.
    replaced_by: >-
      For a limit increase handled under this rule, and only for such an increase, the increase takes effect as of the term
      start when it is signed on or after the term start and no more than 30 days after it with no claim on the policy having
      a date of loss on or after the term start, and otherwise at 12:01 a.m. on the day the tier's standard waiting period
      in calendar days after the signed request and full payment are received; a new policy, and every other change, takes
      effect at 12:01 a.m. on the day the tier's standard waiting period in calendar days after the signed application or
      endorsement request and full payment are received.
  - base_policy: excess_endorsements
    superseded_clause: >-
      The policy as endorsed is re-rated for the full term, and the change in the full-term premium multiplied by the days
      from the endorsement effective date to term_end divided by the days from term_start to term_end, rounded to the cent,
      is booked as an ENDORSEMENT_PREMIUM item for an increase or an ENDORSEMENT credit of the TERM_PREMIUM item for a decrease,
      with the surplus lines tax and stamping fee on that amount booked or credited at the policy's recorded rates.
    replaced_by: >-
      For a limit increase handled under this rule, and only for such an increase, the additional premium figured under this
      rule is booked as an endorsement premium item for the current term with the surplus lines tax and stamping fee on it
      at the policy's recorded rates, in place of re-rating the policy for the full term and pro-rating the change; for a
      decrease and for every other endorsement the policy as endorsed is re-rated for the full term, and the change in the
      full-term premium multiplied by the days from the endorsement effective date to the term end divided by the days from
      the term start to the term end, rounded to the cent, is booked as an endorsement premium item for an increase or an
      endorsement credit of the term premium item for a decrease, with the surplus lines tax and stamping fee on that amount
      booked or credited at the policy's recorded rates.
  trigger: on_request
  subject:
  - excess_endorsement_issued
  computes: additional_premium
  target_tool: sign_excess_limit_increase_cddf0413
  params:
    zone_factor_low: 0.3
    zone_factor_a99_ar: 0.6
    zone_factor_ao: 0.9
    zone_factor_a: 1.0
    zone_factor_d: 1.2
    zone_factor_v: 2.75
    relativity_high_floor: 1500000
    relativity_high: 0.8
    relativity_mid_floor: 750000
    relativity_mid: 0.9
    recency_short_months: 12
    recency_short_pct: 20
    recency_long_months: 36
    recency_long_pct: 10
    repeat_window_months: 12
    repeat_two_pct: 15
    repeat_one_pct: 7.5
    zone_v_pct: 15
    zone_a_pct: 5
    flat_window_days: 30
    deferral_days: 60
  rule: >-
    An increase the named insured signs to raise the excess dwelling limit to the full value the policy allows (a to-value
    increase) has its additional premium figured under this rule; an increase to a stated limit remains under the base endorsement
    rule. The additional premium for a limit increase is figured only once the policy record carries the term in which the
    increase takes effect, from that term's start up to, but not including, its end. The new excess dwelling limit of a to-value
    increase is the highest whole multiple of the tier's limit increment for which the building attachment point plus that
    limit stays within the tier's maximum percentage of the replacement cost value on the policy record, and never above the
    tier's maximum excess dwelling limit; the added limit is the new limit less the excess dwelling limit in force. The additional
    premium for an increase is the added limit divided by 1,000 times the layer rate per 1,000, multiplied by the charged
    share of the term, rounded to the cent once at the end. The layer rate per 1,000 is the latest term premium item booked
    for the current term (the term premium on the policy record where no term premium item is booked for that term) less the
    tier's loss-of-use charge, divided by the excess dwelling limit in thousands. The charged share of the term is the days
    from the day the increase takes effect to the term end, divided by the days from the term start to the term end, where
    the increase takes effect the tier's standard waiting period in calendar days after the signed request and full payment
    are received, and the share is nothing where that day falls on or after the term end. For a limit increase handled under
    this rule, and only for such an increase, the increase takes effect as of the term start when it is signed on or after
    the term start and no more than 30 days after it with no claim on the policy having a date of loss on or after the term
    start, and otherwise at 12:01 a.m. on the day the tier's standard waiting period in calendar days after the signed request
    and full payment are received; a new policy, and every other change, takes effect at 12:01 a.m. on the day the tier's
    standard waiting period in calendar days after the signed application or endorsement request and full payment are received.
    For a limit increase handled under this rule, and only for such an increase, the additional premium figured under this
    rule is booked as an endorsement premium item for the current term with the surplus lines tax and stamping fee on it at
    the policy's recorded rates, in place of re-rating the policy for the full term and pro-rating the change; for a decrease
    and for every other endorsement the policy as endorsed is re-rated for the full term, and the change in the full-term
    premium multiplied by the days from the endorsement effective date to the term end divided by the days from the term start
    to the term end, rounded to the cent, is booked as an endorsement premium item for an increase or an endorsement credit
    of the term premium item for a decrease, with the surplus lines tax and stamping fee on that amount booked or credited
    at the policy's recorded rates. Every surcharge percentage this rule sets on an increase is added into one increase loading,
    which acts once on the added limit's charge at the layer rate. The charged share of the term for an increase signed on
    or after the term start and no more than 30 days after it, where no claim on the policy has a date of loss on or after
    the term start, is one, the increase being made flat as of the term start and charged for the whole term; any other increase
    takes effect after the standard waiting period and, where that period ends before the term end, is charged the share of
    the term counted from the end of that period, never less than a minimum share of 60 days over the days of the term; where
    that period ends on or after the term end the share is nothing, the increase then belonging to the next term. The scheduled
    dwelling charge is the excess dwelling limit divided by 1,000 times the tier's dwelling rate per 1,000, and the scheduled
    personal property charge is the excess personal property limit divided by 1,000 times the tier's personal property rate
    per 1,000. The layer rate per 1,000 for an increase is found by the method the booked term premium calls for: where the
    term premium booked for the current term is at or below the tier's minimum premium, it is the tier's dwelling rate per
    1,000 times the zone factor that the tier's zone factor table gives the flood zone on the policy record; where it is above
    the minimum and the policy carries excess personal property, it is the booked term premium less the tier's loss-of-use
    charge, times the share the scheduled dwelling charge makes of the scheduled dwelling and personal property charges together,
    divided by the excess dwelling limit in thousands; and where it is above the minimum with no excess personal property,
    it is the booked term premium less the tier's loss-of-use charge, divided by the excess dwelling limit in thousands. The
    layer relativity applied to the layer rate for an increase is 80 percent where the dwelling limit on the latest declarations
    received for the underlying policy number on the policy record (or, where none are on file, the underlying dwelling limit
    on the policy record) plus the excess dwelling limit in force is at least 1,500,000, 90 percent where that sum is at least
    750,000 but below 1,500,000, and 100 percent otherwise. The primary-loss surcharge on an increase is 20 percent where
    the latest claim payment on the claim file of the Tidemark NFIP Dwelling Form policy in force whose policy number is the
    underlying policy number on the policy record was issued fewer than 12 whole months before the increase is signed, 10
    percent where it was issued at least 12 but fewer than 36 whole months before, and nothing otherwise or where that policy
    carries no claim payment. The repeat-increase surcharge is 15 percent where two or more limit increases were recorded
    on the policy in the 12 whole months before the increase is signed, 7.5 percent where exactly one was, and nothing where
    none was. The flood-zone surcharge on an increase reads the flood zone shown on the Tidemark NFIP Dwelling Form policy
    in force whose policy number is the underlying policy number on the policy record, or the flood zone on the policy record
    where there is no such NFIP policy: it is 15 percent for zone V or VE, 5 percent for zone A, AE, AH or AO, and nothing
    for any other zone. The full-term premium as endorsed is the term premium before the increase plus the additional premium
    before the charged share of the term is applied, rounded to the cent. A credit standing on the current term that covers
    the additional premium with its surplus lines tax and stamping fee counts as the full payment, received with the signed
    request. Where two entries on a file share the date this rule reads them by, or two policy records answer the same description,
    the one entered first is read.
  prerequisite:
  - problem: excess_ext_renewal_term_premium
    kind: value_input
    gate: charged_share
    form: state
    policy_source: >-
      The additional premium for a limit increase is figured only once the policy record carries the term in which the increase
      takes effect, from that term's start up to, but not including, its end.
    condition: >-
      excess_policies.term_start is on or before the date the increase takes effect and excess_policies.term_end is after
      it.
    resolved_by: book_excess_renewal_30706efc
    effect: >-
      Once the renewal is booked the policy record's term runs from the renewal date for one year and its booked term premium
      is the renewal term premium, so the charged share of the term and the layer rate per 1,000 are read from the term in
      which the increase takes effect.
  cross_category:
  - category: dwelling
    as: history
    reads:
    - policy_number
    - dwelling_policy_id
    - status
    - flood_zone
    - dwelling_claims.event_date
    note: >-
      The primary-loss surcharge reads the claim payments of the Tidemark NFIP Dwelling Form policy in force named as the
      underlying on the policy record and the flood-zone surcharge reads that policy's flood zone.
  compute:
  - dwelling_rate: P('building_rate_per_1000')
  - contents_rate: P('contents_rate_per_1000')
  - lou_charge: P('loss_of_use_premium')
  - floor_premium: P('minimum_premium')
  - zone_factor: >-
      K('zone_factor_low') if (F('flood_zone') == 'X' or F('flood_zone') == 'B' or F('flood_zone') == 'C') else (K('zone_factor_a99_ar')
      if (F('flood_zone') == 'A99' or F('flood_zone') == 'AR') else (K('zone_factor_ao') if F('flood_zone') == 'AO' else (K('zone_factor_d')
      if F('flood_zone') == 'D' else (K('zone_factor_v') if (F('flood_zone') == 'V' or F('flood_zone') == 'VE') else K('zone_factor_a')))))
  - top_limit: >-
      MN(P('max_excess_building_limit'), int((F('replacement_cost_value') * P('max_total_insured_to_rcv_pct') / 100 - F('building_attachment_point'))
      / P('excess_limit_increment')) * P('excess_limit_increment'))
  - added_limit: top_limit - F('excess_building_limit')
  - home_nfip_id: >-
      CFIELD('dwelling', 'dwelling_policy_id', policy_number=F('underlying_policy_number'), status='in_force')
  - booked_term_premium: >-
      LATEST('excess_billing', 'amount', date_field='posted_date', event_type='excess_premium_charged', component='TERM_PREMIUM',
      term_start=F('term_start')) if LATEST('excess_billing', 'amount', date_field='posted_date', event_type='excess_premium_charged',
      component='TERM_PREMIUM', term_start=F('term_start')) != None else F('term_premium')
  - layer_rate: >-
      (dwelling_rate * zone_factor) if booked_term_premium <= floor_premium else (((booked_term_premium - lou_charge) * (F('excess_building_limit')
      / 1000 * dwelling_rate) / (F('excess_building_limit') / 1000 * dwelling_rate + F('excess_contents_limit') / 1000 * contents_rate)
      / (F('excess_building_limit') / 1000)) if F('excess_contents_limit') > 0 else (booked_term_premium - lou_charge) / (F('excess_building_limit')
      / 1000))
  - underlying_dwelling_limit: >-
      LATEST('excess_changes', 'underlying_building_limit', date_field='recorded_date', event_type='excess_underlying_evidence_received',
      underlying_policy_number=F('underlying_policy_number')) if LATEST('excess_changes', 'underlying_building_limit', date_field='recorded_date',
      event_type='excess_underlying_evidence_received', underlying_policy_number=F('underlying_policy_number')) != None else
      F('underlying_building_limit')
  - layer_relativity: >-
      K('relativity_high') if underlying_dwelling_limit + F('excess_building_limit') >= K('relativity_high_floor') else (K('relativity_mid')
      if underlying_dwelling_limit + F('excess_building_limit') >= K('relativity_mid_floor') else 1)
  - last_primary_payment: >-
      XLATEST('dwelling', 'dwelling_claims', 'event_date', date_field='event_date', event_type='dwelling_claim_paid', dwelling_policy_id=home_nfip_id)
  - months_since_primary_payment: MONTHS(last_primary_payment, NOW) if last_primary_payment != None else 9999
  - primary_loss_pct: >-
      K('recency_short_pct') if months_since_primary_payment < K('recency_short_months') else (K('recency_long_pct') if months_since_primary_payment
      < K('recency_long_months') else 0)
  - increases_recent: >-
      COUNT('excess_changes', within_months=K('repeat_window_months'), date_field='recorded_date', event_type='excess_endorsement_issued',
      change_type='LIMIT_INCREASE')
  - repeat_pct: >-
      K('repeat_two_pct') if increases_recent >= 2 else (K('repeat_one_pct') if increases_recent == 1 else 0)
  - nfip_zone: CFIELD('dwelling', 'flood_zone', policy_number=F('underlying_policy_number'), status='in_force')
  - zone_read: nfip_zone if nfip_zone != None else F('flood_zone')
  - zone_surcharge_pct: >-
      K('zone_v_pct') if (zone_read == 'V' or zone_read == 'VE') else (K('zone_a_pct') if (zone_read == 'A' or zone_read ==
      'AE' or zone_read == 'AH' or zone_read == 'AO') else 0)
  - increase_loading_pct: primary_loss_pct + repeat_pct + zone_surcharge_pct
  - full_term_charge: added_limit / 1000 * layer_rate * layer_relativity * (1 + increase_loading_pct / 100)
  - days_into_term: DAYS(F('term_start'), NOW)
  - days_left: DAYS(NOW, F('term_end'))
  - term_days: DAYS(F('term_start'), F('term_end'))
  - latest_loss_in_file: >-
      LATEST('excess_claims', 'date_of_loss', date_field='date_of_loss', event_type='excess_claim_reported')
  - charged_share: >-
      1 if (days_into_term >= 0 and days_into_term <= K('flat_window_days') and (latest_loss_in_file == None or latest_loss_in_file
      < F('term_start'))) else ((MX(K('deferral_days'), days_left - P('standard_waiting_days')) / term_days) if days_left
      > P('standard_waiting_days') else 0)
  - result: RND(full_term_charge * charged_share, 2)
  compute_basis:
    dwelling_rate: >-
      where the term premium booked for the current term is at or below the tier's minimum premium, it is the tier's dwelling
      rate per 1,000 times the zone factor that the tier's zone factor table gives the flood zone on the policy record
    contents_rate: >-
      the scheduled personal property charge is the excess personal property limit divided by 1,000 times the tier's personal
      property rate per 1,000.
    lou_charge: >-
      The layer rate per 1,000 is the latest term premium item booked for the current term (the term premium on the policy
      record where no term premium item is booked for that term) less the tier's loss-of-use charge, divided by the excess
      dwelling limit in thousands.
    floor_premium: where the term premium booked for the current term is at or below the tier's minimum premium
    zone_factor: >-
      it is the tier's dwelling rate per 1,000 times the zone factor that the tier's zone factor table gives the flood zone
      on the policy record
    top_limit: >-
      The new excess dwelling limit of a to-value increase is the highest whole multiple of the tier's limit increment for
      which the building attachment point plus that limit stays within the tier's maximum percentage of the replacement cost
      value on the policy record, and never above the tier's maximum excess dwelling limit
    added_limit: the added limit is the new limit less the excess dwelling limit in force.
    booked_term_premium: >-
      The layer rate per 1,000 is the latest term premium item booked for the current term (the term premium on the policy
      record where no term premium item is booked for that term) less the tier's loss-of-use charge, divided by the excess
      dwelling limit in thousands.
    layer_rate: >-
      The layer rate per 1,000 for an increase is found by the method the booked term premium calls for: where the term premium
      booked for the current term is at or below the tier's minimum premium, it is the tier's dwelling rate per 1,000 times
      the zone factor that the tier's zone factor table gives the flood zone on the policy record; where it is above the minimum
      and the policy carries excess personal property, it is the booked term premium less the tier's loss-of-use charge, times
      the share the scheduled dwelling charge makes of the scheduled dwelling and personal property charges together, divided
      by the excess dwelling limit in thousands; and where it is above the minimum with no excess personal property, it is
      the booked term premium less the tier's loss-of-use charge, divided by the excess dwelling limit in thousands.
    underlying_dwelling_limit: >-
      The layer relativity applied to the layer rate for an increase is 80 percent where the dwelling limit on the latest
      declarations received for the underlying policy number on the policy record (or, where none are on file, the underlying
      dwelling limit on the policy record) plus the excess dwelling limit in force is at least 1,500,000
    layer_relativity: >-
      The layer relativity applied to the layer rate for an increase is 80 percent where the dwelling limit on the latest
      declarations received for the underlying policy number on the policy record (or, where none are on file, the underlying
      dwelling limit on the policy record) plus the excess dwelling limit in force is at least 1,500,000, 90 percent where
      that sum is at least 750,000 but below 1,500,000, and 100 percent otherwise.
    last_primary_payment: >-
      where the latest claim payment on the claim file of the Tidemark NFIP Dwelling Form policy in force whose policy number
      is the underlying policy number on the policy record was issued fewer than 12 whole months before the increase is signed
    months_since_primary_payment: and nothing otherwise or where that policy carries no claim payment.
    primary_loss_pct: >-
      The primary-loss surcharge on an increase is 20 percent where the latest claim payment on the claim file of the Tidemark
      NFIP Dwelling Form policy in force whose policy number is the underlying policy number on the policy record was issued
      fewer than 12 whole months before the increase is signed, 10 percent where it was issued at least 12 but fewer than
      36 whole months before, and nothing otherwise or where that policy carries no claim payment.
    increases_recent: >-
      where two or more limit increases were recorded on the policy in the 12 whole months before the increase is signed
    repeat_pct: >-
      The repeat-increase surcharge is 15 percent where two or more limit increases were recorded on the policy in the 12
      whole months before the increase is signed, 7.5 percent where exactly one was, and nothing where none was.
    nfip_zone: >-
      The flood-zone surcharge on an increase reads the flood zone shown on the Tidemark NFIP Dwelling Form policy in force
      whose policy number is the underlying policy number on the policy record, or the flood zone on the policy record where
      there is no such NFIP policy
    zone_read: >-
      The flood-zone surcharge on an increase reads the flood zone shown on the Tidemark NFIP Dwelling Form policy in force
      whose policy number is the underlying policy number on the policy record, or the flood zone on the policy record where
      there is no such NFIP policy
    zone_surcharge_pct: >-
      it is 15 percent for zone V or VE, 5 percent for zone A, AE, AH or AO, and nothing for any other zone.
    increase_loading_pct: >-
      Every surcharge percentage this rule sets on an increase is added into one increase loading, which acts once on the
      added limit's charge at the layer rate.
    full_term_charge: >-
      The additional premium for an increase is the added limit divided by 1,000 times the layer rate per 1,000, multiplied
      by the charged share of the term, rounded to the cent once at the end.
    days_into_term: >-
      The charged share of the term for an increase signed on or after the term start and no more than 30 days after it, where
      no claim on the policy has a date of loss on or after the term start, is one, the increase being made flat as of the
      term start and charged for the whole term
    days_left: >-
      any other increase takes effect after the standard waiting period and, where that period ends before the term end, is
      charged the share of the term counted from the end of that period, never less than a minimum share of 60 days over the
      days of the term
    term_days: >-
      The charged share of the term is the days from the day the increase takes effect to the term end, divided by the days
      from the term start to the term end, where the increase takes effect the tier's standard waiting period in calendar
      days after the signed request and full payment are received, and the share is nothing where that day falls on or after
      the term end.
    charged_share: >-
      The charged share of the term for an increase signed on or after the term start and no more than 30 days after it, where
      no claim on the policy has a date of loss on or after the term start, is one, the increase being made flat as of the
      term start and charged for the whole term; any other increase takes effect after the standard waiting period and, where
      that period ends before the term end, is charged the share of the term counted from the end of that period, never less
      than a minimum share of 60 days over the days of the term; where that period ends on or after the term end the share
      is nothing, the increase then belonging to the next term.
    result: >-
      The additional premium for an increase is the added limit divided by 1,000 times the layer rate per 1,000, multiplied
      by the charged share of the term, rounded to the cent once at the end.
    home_nfip_id: >-
      where the latest claim payment on the claim file of the Tidemark NFIP Dwelling Form policy in force whose policy number
      is the underlying policy number on the policy record was issued fewer than 12 whole months before the increase is signed
    latest_loss_in_file: where no claim on the policy has a date of loss on or after the term start
  factors:
  - id: signing_window
    effect: method
    decides: charged_share
    bindings:
    - days_into_term
    - days_left
    - term_days
    - latest_loss_in_file
    - charged_share
    ladder:
    - when: >-
        the increase is signed on or after the term start and no more than 30 days after it, and no claim on the policy has
        a date of loss on or after the term start
      method: the increase is made flat as of the term start and charged for the whole term (charged share one)
    - when: the increase is not made flat and the standard waiting period ends before the term end
      method: >-
        the share is the days from the end of the standard waiting period to the term end over the days of the term, never
        less than a minimum share of 60 days over the days of the term
    - when: otherwise (the standard waiting period ends on or after the term end)
      method: nothing is charged, the increase belonging to the next term
    baseline:
      charged_share: MX(0, days_left - P('standard_waiting_days')) / term_days
    evidence:
    - date
    cross_difficulty: null
  - id: rate_derivation
    effect: method
    decides: layer_rate
    bindings:
    - lou_charge
    - dwelling_rate
    - contents_rate
    - floor_premium
    - zone_factor
    - booked_term_premium
    - layer_rate
    ladder:
    - when: the latest term premium item booked for the current term is at or below the tier's minimum premium
      method: the tier's dwelling rate per 1,000 times the zone factor of the flood zone on the policy record
    - when: the booked term premium is above the minimum and the policy carries excess personal property
      method: >-
        the booked term premium less the loss-of-use charge, times the scheduled dwelling charge's share of the scheduled
        dwelling and personal property charges, over the excess dwelling limit in thousands
    - when: otherwise (above the minimum, no excess personal property)
      method: the booked term premium less the loss-of-use charge over the excess dwelling limit in thousands
    baseline:
      layer_rate: (booked_term_premium - lou_charge) / (F('excess_building_limit') / 1000)
    evidence:
    - history
    cross_difficulty: null
  - id: layer_position
    effect: parameter
    decides: layer_relativity
    bindings:
    - underlying_dwelling_limit
    - layer_relativity
    ladder:
    - when: >-
        the dwelling limit on the latest declarations received for the underlying policy number on the policy record (or the
        policy record's underlying dwelling limit where none is on file) plus the excess dwelling limit in force is at least
        1,500,000
      value: K('relativity_high') — 80 percent
    - when: that sum is at least 750,000 but below 1,500,000
      value: K('relativity_mid') — 90 percent
    - when: otherwise
      value: 100 percent
    baseline:
      layer_relativity: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: primary_loss_recency
    effect: parameter
    decides: primary_loss_pct
    bindings:
    - home_nfip_id
    - last_primary_payment
    - months_since_primary_payment
    - primary_loss_pct
    ladder:
    - when: >-
        the latest claim payment on the claim file of the Tidemark NFIP Dwelling Form policy in force whose policy number
        is the underlying policy number on the policy record was issued fewer than 12 whole months before the increase is
        signed
      value: K('recency_short_pct') — 20 percent
    - when: it was issued at least 12 but fewer than 36 whole months before
      value: K('recency_long_pct') — 10 percent
    - when: otherwise, or that policy carries no claim payment
      value: nothing (0 percent)
    baseline:
      primary_loss_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: dwelling
  - id: repeat_increase
    effect: parameter
    decides: repeat_pct
    bindings:
    - increases_recent
    - repeat_pct
    ladder:
    - when: >-
        two or more limit increases were recorded on the policy in the 12 whole months before the increase is signed
      value: K('repeat_two_pct') — 15 percent
    - when: exactly one was
      value: K('repeat_one_pct') — 7.5 percent
    - when: otherwise (none)
      value: nothing (0 percent)
    baseline:
      repeat_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: zone_of_record_surcharge
    effect: parameter
    decides: zone_surcharge_pct
    bindings:
    - nfip_zone
    - zone_read
    - zone_surcharge_pct
    ladder:
    - when: >-
        the flood zone read (the Tidemark NFIP Dwelling Form policy in force named as the underlying, else the policy record)
        is V or VE
      value: K('zone_v_pct') — 15 percent
    - when: it is A, AE, AH or AO
      value: K('zone_a_pct') — 5 percent
    - when: otherwise
      value: nothing (0 percent)
    baseline:
      zone_surcharge_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: dwelling
  baseline:
    rule: >-
      The new excess dwelling limit of a to-value increase is the highest whole multiple of the tier's limit increment for
      which the building attachment point plus that limit stays within the tier's maximum percentage of the replacement cost
      value on the policy record, and never above the tier's maximum excess dwelling limit; the added limit is the new limit
      less the excess dwelling limit in force. The additional premium for an increase is the added limit divided by 1,000
      times the layer rate per 1,000, multiplied by the charged share of the term, rounded to the cent once at the end. The
      layer rate per 1,000 is the latest term premium item booked for the current term (the term premium on the policy record
      where no term premium item is booked for that term) less the tier's loss-of-use charge, divided by the excess dwelling
      limit in thousands. The charged share of the term is the days from the day the increase takes effect to the term end,
      divided by the days from the term start to the term end, where the increase takes effect the tier's standard waiting
      period in calendar days after the signed request and full payment are received, and the share is nothing where that
      day falls on or after the term end.
    params:
    - max_excess_building_limit
    - max_total_insured_to_rcv_pct
    - excess_limit_increment
    - loss_of_use_premium
    - standard_waiting_days
  inputs:
    history:
    - table: excess_billing
      aggregate: latest
      field: amount
      filters:
        event_type: excess_premium_charged
        component: TERM_PREMIUM
    - table: excess_changes
      aggregate: latest
      field: underlying_building_limit
      filters:
        event_type: excess_underlying_evidence_received
    - table: excess_changes
      aggregate: count
      field: excess_change_id
      within_months: 12
      filters:
        event_type: excess_endorsement_issued
        change_type: LIMIT_INCREASE
    - category: dwelling
      table: dwelling_claims
      aggregate: latest
      field: event_date
      filters:
        event_type: dwelling_claim_paid
    cross_category:
    - dwelling
- id: excess_ext_sale_cancellation_return
  base_policy_refs:
  - excess_cancellation_refund
  overwrite:
  - base_policy: excess_cancellation_refund
    superseded_clause: >-
      A cancellation is processed only on the named insured's signed cancellation request on file for the policy, and only
      on a policy whose status is pending_effective or active, which it leaves cancelled.
    replaced_by: >-
      For a sale cancellation handled under this rule, and only for such a cancellation, the named insured signs the cancellation
      request when the cancellation is made and that signature is the signed request on file, and the cancellation is made
      only on a policy whose status is pending_effective or active, which it leaves cancelled; every other cancellation is
      processed only on the named insured's signed cancellation request on file for the policy, and only on a policy whose
      status is pending_effective or active, which it leaves cancelled.
  - base_policy: excess_cancellation_refund
    superseded_clause: PROPERTY_SOLD takes effect on the closing date on the settlement statement
    replaced_by: >-
      For a sale cancellation handled under this rule, and only for such a cancellation, the cancellation takes effect on
      the sale closing date when the signed request is received no more than 30 days after it, 30 days before the date the
      signed request is received when it is received 31 to 90 days after the sale closing date, and on the date the signed
      request is received when it is received later; every other cancellation for a sale takes effect on the closing date
      on the settlement statement.
  - base_policy: excess_cancellation_refund
    superseded_clause: >-
      Under PRO_RATA_WITH_MINIMUM_EARNED the earned premium is the larger of the term premium multiplied by the days from
      term_start to the cancellation effective date divided by the days from term_start to term_end, and minimum_earned_premium_pct
      of the term premium; the returned premium is the term premium less the earned premium, rounded to the cent.
    replaced_by: >-
      For a sale cancellation handled under this rule, and only for such a cancellation, the returned premium is figured as
      this rule sets out in place of the base pro rata method with minimum earned premium; for every other cancellation the
      earned premium is the larger of the term premium multiplied by the days from the term start to the cancellation effective
      date divided by the days from the term start to the term end, and the tier's minimum earned premium percentage of the
      term premium, and the returned premium is the term premium less the earned premium, rounded to the cent.
  - base_policy: excess_cancellation_refund
    superseded_clause: >-
      When no_refund_after_paid_claim is true and a claim with a date of loss in the term has a net payment above zero (excess_msr_term_claims_paid
      above zero), nothing is returned.
    replaced_by: >-
      For a sale cancellation handled under this rule, and only for such a cancellation, the paid-claim bar is read on the
      paid claim with the latest date of loss on this policy: where that claim's date of loss is on or after the term start
      and its net payment after voided payments is above zero, nothing is returned; for every other cancellation nothing is
      returned when a claim with a date of loss in the term has a net payment above zero.
  trigger: on_request
  subject:
  - excess_policy_cancelled
  computes: returned_premium
  target_tool: sign_excess_sale_cancellation_a26754a5
  params:
    backdate_days: 30
    backdate_max_days: 90
    waiver_renewals: 3
    short_tenure_sale_floor: 0.1
    retain_prior_share: 0.5
    early_short_days: 30
    early_charge_short: 100
    early_mid_days: 90
    early_charge_mid: 50
    recent_payment_window_months: 12
    paid_after_voids_floor: 0
  rule: >-
    A cancellation of an Excess Flood policy because the insured home was sold, where the Tidemark HomeFlood policy whose
    policy number is the underlying policy number on the policy record has been cancelled for that sale, is signed by the
    named insured, and its returned premium is figured under this rule; the sale closing date is the cancellation effective
    date of that HomeFlood policy. The returned premium on a sale cancellation is not fixed until every claim on the policy
    whose latest adjuster report documents more loss of use than has been paid carries a loss-of-use payment issued after
    that report. The returned premium is the term premium times the unexpired days over the days from the term start to the
    term end, but never more than the term premium less the minimum earned share of it, rounded to the cent once at the end.
    The unexpired days are the days from the term start to the term end less the earned days. The earned days are the days
    from the term start to the date the cancellation takes effect, which is the sale closing date. The minimum earned share
    is the tier's minimum earned premium percentage. Where the paid claim with the latest date of loss on this policy has
    a date of loss on or after the term start and a net payment above zero after voided payments, nothing is returned. For
    a sale cancellation handled under this rule, and only for such a cancellation, the paid-claim bar is read on the paid
    claim with the latest date of loss on this policy: where that claim's date of loss is on or after the term start and its
    net payment after voided payments is above zero, nothing is returned; for every other cancellation nothing is returned
    when a claim with a date of loss in the term has a net payment above zero. For a sale cancellation handled under this
    rule, and only for such a cancellation, the named insured signs the cancellation request when the cancellation is made
    and that signature is the signed request on file, and the cancellation is made only on a policy whose status is pending_effective
    or active, which it leaves cancelled; every other cancellation is processed only on the named insured's signed cancellation
    request on file for the policy, and only on a policy whose status is pending_effective or active, which it leaves cancelled.
    For a sale cancellation handled under this rule, and only for such a cancellation, the cancellation takes effect on the
    sale closing date when the signed request is received no more than 30 days after it, 30 days before the date the signed
    request is received when it is received 31 to 90 days after the sale closing date, and on the date the signed request
    is received when it is received later; every other cancellation for a sale takes effect on the closing date on the settlement
    statement. For a sale cancellation handled under this rule, and only for such a cancellation, the returned premium is
    figured as this rule sets out in place of the base pro rata method with minimum earned premium; for every other cancellation
    the earned premium is the larger of the term premium multiplied by the days from the term start to the cancellation effective
    date divided by the days from the term start to the term end, and the tier's minimum earned premium percentage of the
    term premium, and the returned premium is the term premium less the earned premium, rounded to the cent. Every number
    of days this rule removes from the unexpired days is removed before the returned premium is figured, and every retention
    or charge this rule sets is subtracted from the returned premium, which never falls below nothing. The unexpired days
    stop short of the term end as follows: where the latest declarations on file for the underlying policy number on the policy
    record show the underlying policy expiring before the term end, the days from that expiration to the term end are removed;
    where the declarations show no earlier expiration but the underlying policy number on the policy record is that of a Tidemark
    HomeFlood policy whose own record shows its term ending before the excess term end, the days from that HomeFlood term
    end to the excess term end are removed; otherwise nothing is removed. The minimum earned share on a sale cancellation
    is nothing where three or more renewal term premiums are booked on this policy and no claim payment on this policy was
    issued in the 12 whole months before the cancellation is signed, 10 percent where three or more renewal term premiums
    are booked and such a claim payment was issued in those 12 months, and the tier's minimum earned premium percentage otherwise.
    The loss-of-use charge retention keeps back the tier's loss-of-use charge times the unexpired days over the days of the
    term, in full where the latest loss-of-use payment on the policy's claims was issued on or after the term start, at half
    where the latest one was issued before the term start, and not at all where no loss-of-use payment was ever issued. The
    early-cancellation charge is 100 where the sale closing date is no more than 30 days after the term start, 50 where it
    is 31 to 90 days after, and nothing otherwise. Where two entries on a file share the date this rule reads them by, or
    two policy records answer the same description, the one entered first is read.
  prerequisite:
  - problem: excess_ext_loss_of_use_payment
    kind: value_input
    gate: retention_share
    form: state
    policy_source: >-
      The returned premium on a sale cancellation is not fixed until every claim on the policy whose latest adjuster report
      documents more loss of use than has been paid carries a loss-of-use payment issued after that report.
    condition: >-
      For every excess claim of the policy whose latest excess_adjuster_report shows loss_of_use_incurred above the loss-of-use
      payments issued, an excess_claim_paid row with coverage_part LOSS_OF_USE dated after that report stands on excess_claims.
    resolved_by: pay_excess_loss_of_use_f5cb8480
    effect: >-
      Once the loss-of-use payment documented on the latest report is issued, the latest loss-of-use payment on the policy's
      claims falls on or after the term start, so the loss-of-use charge retention moves to the full tier.
  cross_category:
  - category: homeflood
    as: branch
    reads:
    - policy_number
    - cancellation_reason
    - cancellation_effective_date
    - term_end
    note: >-
      The sale closing date reads the Tidemark HomeFlood policy named as the underlying on the policy record, cancelled for
      the sale; the unexpired-day cut reads the HomeFlood record of the underlying policy number.
  compute:
  - term_prem: F('term_premium')
  - lou_charge: P('loss_of_use_premium')
  - term_days: DAYS(F('term_start'), F('term_end'))
  - sale_closing: >-
      CFIELD('homeflood', 'cancellation_effective_date', policy_number=F('underlying_policy_number'), cancellation_reason='PROPERTY_SOLD')
  - days_after_closing: DAYS(sale_closing, NOW)
  - earned_days: >-
      (DAYS(F('term_start'), NOW) - K('backdate_days')) if (days_after_closing > K('backdate_days') and days_after_closing
      <= K('backdate_max_days')) else (DAYS(F('term_start'), NOW) if days_after_closing > K('backdate_max_days') else DAYS(F('term_start'),
      sale_closing))
  - declared_expiry: >-
      LATEST('excess_changes', 'underlying_expiration_date', date_field='recorded_date', event_type='excess_underlying_evidence_received',
      underlying_policy_number=F('underlying_policy_number'))
  - homeflood_term_end: CFIELD('homeflood', 'term_end', policy_number=F('underlying_policy_number'))
  - removed_days: >-
      DAYS(declared_expiry, F('term_end')) if (declared_expiry != None and declared_expiry < F('term_end')) else ((DAYS(homeflood_term_end,
      F('term_end'))) if (homeflood_term_end != None and homeflood_term_end < F('term_end')) else 0)
  - unexpired_days: term_days - earned_days - removed_days
  - renewals_on_policy: >-
      COUNT('excess_billing', event_type='excess_premium_charged', component='TERM_PREMIUM', charge_basis='RENEWAL')
  - layer_payments_recent: >-
      COUNT('excess_claims', within_months=K('recent_payment_window_months'), date_field='event_date', event_type='excess_claim_paid')
  - floor_share: >-
      0 if (renewals_on_policy >= K('waiver_renewals') and layer_payments_recent == 0) else (K('short_tenure_sale_floor')
      if (renewals_on_policy >= K('waiver_renewals') and layer_payments_recent >= 1) else P('minimum_earned_premium_pct')
      / 100)
  - latest_lou_payment: >-
      LATEST('excess_claims', 'event_date', date_field='event_date', event_type='excess_claim_paid', coverage_part='LOSS_OF_USE')
  - retention_share: >-
      1 if (latest_lou_payment != None and latest_lou_payment >= F('term_start')) else (K('retain_prior_share') if latest_lou_payment
      != None else 0)
  - days_in_force_at_sale: DAYS(F('term_start'), sale_closing)
  - early_charge: >-
      K('early_charge_short') if days_in_force_at_sale <= K('early_short_days') else (K('early_charge_mid') if days_in_force_at_sale
      <= K('early_mid_days') else 0)
  - latest_paid_loss_date: LATEST('excess_claims', 'date_of_loss', date_field='date_of_loss', event_type='excess_claim_paid')
  - latest_paid_claim: LATEST('excess_claims', 'claim_number', date_field='date_of_loss', event_type='excess_claim_paid')
  - latest_paid_claim_net: >-
      SUM('excess_claims', 'payment_amount', event_type='excess_claim_paid', claim_number=latest_paid_claim) - SUM('excess_claims',
      'payment_amount', event_type='excess_claim_payment_voided', claim_number=latest_paid_claim)
  - returned_core: MN(term_prem * unexpired_days / term_days, term_prem * (1 - floor_share))
  - lou_retained: lou_charge * retention_share * unexpired_days / term_days
  - result: >-
      0 if (latest_paid_loss_date != None and latest_paid_loss_date >= F('term_start') and latest_paid_claim_net > K('paid_after_voids_floor'))
      else RND(MX(0, returned_core - lou_retained - early_charge), 2)
  compute_basis:
    term_prem: >-
      The returned premium is the term premium times the unexpired days over the days from the term start to the term end,
      but never more than the term premium less the minimum earned share of it, rounded to the cent once at the end.
    lou_charge: >-
      The loss-of-use charge retention keeps back the tier's loss-of-use charge times the unexpired days over the days of
      the term
    term_days: The unexpired days are the days from the term start to the term end less the earned days.
    sale_closing: the sale closing date is the cancellation effective date of that HomeFlood policy.
    days_after_closing: >-
      the cancellation takes effect on the sale closing date when the signed request is received no more than 30 days after
      it, 30 days before the date the signed request is received when it is received 31 to 90 days after the sale closing
      date, and on the date the signed request is received when it is received later
    earned_days: >-
      For a sale cancellation handled under this rule, and only for such a cancellation, the cancellation takes effect on
      the sale closing date when the signed request is received no more than 30 days after it, 30 days before the date the
      signed request is received when it is received 31 to 90 days after the sale closing date, and on the date the signed
      request is received when it is received later; every other cancellation for a sale takes effect on the closing date
      on the settlement statement.
    declared_expiry: >-
      where the latest declarations on file for the underlying policy number on the policy record show the underlying policy
      expiring before the term end, the days from that expiration to the term end are removed
    homeflood_term_end: >-
      where the declarations show no earlier expiration but the underlying policy number on the policy record is that of a
      Tidemark HomeFlood policy whose own record shows its term ending before the excess term end
    removed_days: >-
      The unexpired days stop short of the term end as follows: where the latest declarations on file for the underlying policy
      number on the policy record show the underlying policy expiring before the term end, the days from that expiration to
      the term end are removed; where the declarations show no earlier expiration but the underlying policy number on the
      policy record is that of a Tidemark HomeFlood policy whose own record shows its term ending before the excess term end,
      the days from that HomeFlood term end to the excess term end are removed; otherwise nothing is removed.
    unexpired_days: >-
      Every number of days this rule removes from the unexpired days is removed before the returned premium is figured
    renewals_on_policy: where three or more renewal term premiums are booked on this policy
    floor_share: >-
      The minimum earned share on a sale cancellation is nothing where three or more renewal term premiums are booked on this
      policy and no claim payment on this policy was issued in the 12 whole months before the cancellation is signed, 10 percent
      where three or more renewal term premiums are booked and such a claim payment was issued in those 12 months, and the
      tier's minimum earned premium percentage otherwise.
    latest_lou_payment: >-
      in full where the latest loss-of-use payment on the policy's claims was issued on or after the term start, at half where
      the latest one was issued before the term start, and not at all where no loss-of-use payment was ever issued.
    retention_share: >-
      The loss-of-use charge retention keeps back the tier's loss-of-use charge times the unexpired days over the days of
      the term, in full where the latest loss-of-use payment on the policy's claims was issued on or after the term start,
      at half where the latest one was issued before the term start, and not at all where no loss-of-use payment was ever
      issued.
    days_in_force_at_sale: >-
      The early-cancellation charge is 100 where the sale closing date is no more than 30 days after the term start
    early_charge: >-
      The early-cancellation charge is 100 where the sale closing date is no more than 30 days after the term start, 50 where
      it is 31 to 90 days after, and nothing otherwise.
    latest_paid_loss_date: >-
      Where the paid claim with the latest date of loss on this policy has a date of loss on or after the term start and a
      net payment above zero after voided payments, nothing is returned.
    returned_core: >-
      The returned premium is the term premium times the unexpired days over the days from the term start to the term end,
      but never more than the term premium less the minimum earned share of it, rounded to the cent once at the end.
    lou_retained: >-
      every retention or charge this rule sets is subtracted from the returned premium, which never falls below nothing.
    result: >-
      Where the paid claim with the latest date of loss on this policy has a date of loss on or after the term start and a
      net payment above zero after voided payments, nothing is returned.
    layer_payments_recent: no claim payment on this policy was issued in the 12 whole months before the cancellation is signed
    latest_paid_claim: the paid-claim bar is read on the paid claim with the latest date of loss on this policy
    latest_paid_claim_net: >-
      where that claim's date of loss is on or after the term start and its net payment after voided payments is above zero,
      nothing is returned
  factors:
  - id: backdating_limit
    effect: method
    decides: earned_days
    bindings:
    - days_after_closing
    - earned_days
    ladder:
    - when: the signed request is received 31 to 90 days after the sale closing date
      method: >-
        the cancellation takes effect 30 days before the request is received; earned days run from the term start to that
        date
    - when: it is received more than 90 days after the sale closing date
      method: the cancellation takes effect on the date the request is received
    - when: otherwise (received no more than 30 days after the closing)
      method: the cancellation takes effect on the sale closing date
    baseline:
      earned_days: DAYS(F('term_start'), sale_closing)
    evidence:
    - date
    - cross_category
    cross_difficulty: null
  - id: unexpired_cutoff
    effect: method
    decides: removed_days
    bindings:
    - declared_expiry
    - homeflood_term_end
    - removed_days
    ladder:
    - when: >-
        the latest declarations on file for the underlying policy number show the underlying expiring before the term end
      method: remove the days from that expiration to the term end
    - when: >-
        no earlier expiration on the declarations, but the underlying policy number on the record is a Tidemark HomeFlood
        policy whose record shows its term ending before the excess term end
      method: remove the days from that HomeFlood term end to the excess term end
    - when: otherwise
      method: nothing is removed; unexpired days run to the term end
    baseline:
      removed_days: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: homeflood
  - id: tenure_minimum_waiver
    effect: parameter
    decides: floor_share
    bindings:
    - renewals_on_policy
    - layer_payments_recent
    - floor_share
    ladder:
    - when: >-
        three or more renewal term premiums are booked on this policy and no claim payment on it was issued in the 12 whole
        months before the cancellation is signed
      value: nothing (no minimum earned share)
    - when: >-
        three or more renewal term premiums are booked and such a claim payment was issued in those 12 months
      value: K('short_tenure_sale_floor') — 10 percent
    - when: otherwise
      value: the tier's minimum earned premium percentage
    baseline:
      floor_share: P('minimum_earned_premium_pct') / 100
    evidence:
    - history
    cross_difficulty: null
  - id: use_charge_retention
    effect: parameter
    decides: retention_share
    bindings:
    - latest_lou_payment
    - retention_share
    ladder:
    - when: the latest loss-of-use payment on the policy's claims was issued on or after the term start
      value: the whole charge share (1)
    - when: the latest one was issued before the term start
      value: K('retain_prior_share') — half
    - when: otherwise (no loss-of-use payment ever issued)
      value: nothing
    baseline:
      retention_share: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: early_cancellation_charge
    effect: parameter
    decides: early_charge
    bindings:
    - days_in_force_at_sale
    - early_charge
    ladder:
    - when: the sale closing date is no more than 30 days after the term start
      value: K('early_charge_short') — 100
    - when: it is 31 to 90 days after the term start
      value: K('early_charge_mid') — 50
    - when: otherwise
      value: nothing
    baseline:
      early_charge: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      The returned premium is the term premium times the unexpired days over the days from the term start to the term end,
      but never more than the term premium less the minimum earned share of it, rounded to the cent once at the end. The unexpired
      days are the days from the term start to the term end less the earned days. The earned days are the days from the term
      start to the date the cancellation takes effect, which is the sale closing date. The minimum earned share is the tier's
      minimum earned premium percentage. Where the paid claim with the latest date of loss on this policy has a date of loss
      on or after the term start and a net payment above zero after voided payments, nothing is returned.
    params:
    - minimum_earned_premium_pct
    - loss_of_use_premium
  inputs:
    history:
