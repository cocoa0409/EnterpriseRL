events:
  - type: excess_policy_issued
    target: excess_policies
    mutation: create
    meaning: An Excess Flood policy is bound on a signed application, full payment and the underlying policy's declarations, and waits in pending_effective until its effective date.
    grain: one row per policy bound
    fields:
      policy_number: Excess policy number.
      variant_name: Tier written.
      property_address: Address of the insured home.
      flood_zone: FEMA flood zone of the property.
      replacement_cost_value: Dwelling replacement cost value.
      excess_building_limit: Excess dwelling limit.
      excess_contents_limit: Excess personal property limit.
      building_attachment_point: Dwelling loss amount above which the excess policy pays.
      contents_attachment_point: Personal property loss amount above which the excess policy pays.
      underlying_type: Kind of underlying primary policy.
      underlying_carrier: Carrier of the underlying policy.
      underlying_policy_number: Underlying policy number.
      underlying_building_limit: Dwelling limit of the underlying policy.
      underlying_contents_limit: Personal property limit of the underlying policy.
      underlying_expiration_date: Expiration date of the underlying policy term on file.
      application_date: Date the signed application and full payment were received.
      effective_date: Date the excess coverage first attaches.
      term_start: Start of the first term.
      term_end: End of the first term.
      ec_on_file: Whether an accepted Elevation Certificate is on file.
      elevation_difference_ft: Whole feet of lowest floor above or below base flood elevation.
      surplus_lines_state: State whose surplus lines tax applies.
      surplus_lines_tax_pct: Surplus lines premium tax rate of that state in force for the term.
      stamping_fee_pct: Stamping or service fee rate of that state in force for the term.
      term_premium: Rated full-term premium before fee and taxes.
    triggers:
      - event: excess:excess_premium_charged
        map: {term_start: term_start, charge_basis: NEW_BUSINESS}
      - event: excess:excess_premium_payment
        map: {term_start: term_start}
  - type: excess_policy_effective
    target: excess_policies
    mutation: {transition: {from: pending_effective, to: active}}
    meaning: The excess coverage attaches on its effective date.
    grain: one row per policy taking effect
    fields:
      effective_date: Date the coverage attached.
    triggers: []
  - type: excess_term_renewed
    target: excess_policies
    mutation: update
    meaning: The renewal is bound with full payment and current underlying declarations by term end, and the next term is booked.
    grain: one row per term renewed
    fields:
      term_start: Start of the renewed term.
      term_end: End of the renewed term.
      term_premium: Rated premium for the renewed term.
      surplus_lines_tax_pct: Tax rate in force for the renewed term.
      stamping_fee_pct: Stamping fee rate in force for the renewed term.
    triggers:
      - event: excess:excess_premium_charged
        map: {term_start: term_start, charge_basis: RENEWAL}
  - type: excess_policy_expired
    target: excess_policies
    mutation: {transition: {from: active, to: expired}}
    meaning: The term ends without a renewal bound.
    grain: one row per expiration
    fields:
      closed_date: Term end at which coverage stopped.
    triggers: []
  - type: excess_policy_cancelled
    target: excess_policies
    mutation: {transition: [{from: active, to: cancelled}, {from: pending_effective, to: cancelled}]}
    meaning: The named insured's signed cancellation request takes effect.
    grain: one row per insured cancellation
    fields:
      cancellation_reason: Reason on the signed request.
      cancellation_effective_date: Date the cancellation takes effect.
      closed_date: Date processed.
    triggers:
      - event: excess:excess_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: excess_insurer_cancelled
    target: excess_policies
    mutation: {transition: {from: active, to: cancelled}}
    meaning: Tidemark cancels the policy for a dishonored payment or material misrepresentation after its written notice period runs out.
    grain: one row per insurer cancellation
    fields:
      cancellation_reason: DISHONORED_PAYMENT or MATERIAL_MISREPRESENTATION.
      cancellation_effective_date: Cancellation date stated on the notice.
      closed_date: Date processed.
    triggers:
      - event: excess:excess_premium_credit
        map: {charge_basis: CANCELLATION}
  - type: excess_underlying_updated
    target: excess_policies
    mutation: update
    meaning: New declarations of the underlying primary policy are recorded on the excess policy.
    grain: one row per underlying update
    fields:
      underlying_type: Kind of underlying policy.
      underlying_carrier: Underlying carrier.
      underlying_policy_number: Underlying policy number.
      underlying_building_limit: Underlying dwelling limit.
      underlying_contents_limit: Underlying personal property limit.
      underlying_expiration_date: Underlying term expiration.
    triggers: []
  - type: excess_coverage_updated
    target: excess_policies
    mutation: update
    meaning: An endorsement changes the excess limits as of its effective date.
    grain: one row per endorsement applied
    fields:
      excess_building_limit: Excess dwelling limit after the endorsement.
      excess_contents_limit: Excess personal property limit after the endorsement.
      term_premium: Full-term premium as endorsed.
    triggers: []
  - type: excess_premium_charged
    target: excess_billing
    meaning: One premium item is booked — term premium, policy fee, surplus lines tax, stamping fee or endorsement premium.
    grain: one row per item per term per booking occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term the item belongs to.
      component: Item booked.
      charge_basis: Occasion.
      amount: Amount, positive.
      posted_date: Date booked.
      reference_id: Endorsement record behind an ENDORSEMENT booking; empty otherwise.
    account: premium_balance
    direction: in
    triggers: []
  - type: excess_premium_payment
    target: excess_billing
    meaning: A payment is received.
    grain: one row per payment item
    distinguish_by: [payment_ref, term_start]
    fields:
      term_start: Term paid.
      amount: Amount received, positive.
      posted_date: Date received.
      payment_ref: Check, ACH or card reference.
      payment_method: How paid.
    account: premium_balance
    direction: out
    triggers: []
  - type: excess_premium_credit
    target: excess_billing
    meaning: Returned premium and the matching tax and stamping fee are credited on a cancellation or a mid-term reduction.
    grain: one row per credited item per crediting occasion
    distinguish_by: [component, term_start, charge_basis, reference_id]
    fields:
      term_start: Term credited.
      component: Item credited.
      charge_basis: CANCELLATION or ENDORSEMENT.
      amount: Amount credited, positive.
      posted_date: Date booked.
      reference_id: Cancellation request or endorsement record; the policy itself for an insurer cancellation.
    account: premium_balance
    direction: out
    triggers:
      - event: excess:excess_refund_disbursed
        map: {reference_id: reference_id}
  - type: excess_refund_disbursed
    target: excess_billing
    meaning: A credit balance is paid out to the insured.
    grain: one row per refund issued
    distinguish_by: [reference_id, payee]
    fields:
      amount: Refund paid, positive.
      posted_date: Date issued.
      reference_id: Record whose credit is refunded.
      payee: Refund payee.
      payment_ref: Refund check or ACH reference.
    account: premium_balance
    direction: in
    triggers: []
  - type: excess_endorsement_issued
    target: excess_changes
    meaning: A mid-term change of the excess limits is recorded with its effective date.
    grain: one row per endorsement processed
    distinguish_by: [change_type, change_effective_date, recorded_date]
    fields:
      change_type: Kind of endorsement.
      change_effective_date: Date it takes effect.
      recorded_date: Date processed.
      new_excess_building_limit: Excess dwelling limit requested.
      new_excess_contents_limit: Excess personal property limit requested.
      revised_term_premium: Full-term premium as endorsed.
    triggers:
      - event: excess:excess_coverage_updated
        map: {excess_building_limit: new_excess_building_limit, excess_contents_limit: new_excess_contents_limit, term_premium: revised_term_premium}
      - event: excess:excess_premium_charged
        when: {change_type: LIMIT_INCREASE}
        map: {component: ENDORSEMENT_PREMIUM, charge_basis: ENDORSEMENT}
      - event: excess:excess_premium_credit
        when: {change_type: LIMIT_DECREASE}
        map: {component: TERM_PREMIUM, charge_basis: ENDORSEMENT}
  - type: excess_underlying_evidence_received
    target: excess_changes
    meaning: Declarations of the underlying primary policy are received and reviewed.
    grain: one row per set of underlying declarations received
    distinguish_by: [underlying_policy_number, underlying_term_start]
    fields:
      recorded_date: Date received.
      underlying_type: Kind of underlying policy shown.
      underlying_carrier: Carrier shown.
      underlying_policy_number: Policy number shown.
      underlying_term_start: Term start shown.
      underlying_expiration_date: Term expiration shown.
      underlying_building_limit: Dwelling limit shown.
      underlying_contents_limit: Personal property limit shown.
    triggers:
      - event: excess:excess_underlying_updated
        map: {underlying_type: underlying_type, underlying_carrier: underlying_carrier, underlying_policy_number: underlying_policy_number, underlying_building_limit: underlying_building_limit, underlying_contents_limit: underlying_contents_limit, underlying_expiration_date: underlying_expiration_date}
  - type: excess_renewal_offered
    target: excess_changes
    meaning: The renewal offer is issued with its rated premium.
    grain: one row per offer
    distinguish_by: [renewal_term_start]
    fields:
      recorded_date: Date issued.
      renewal_term_start: Offered term start.
      revised_term_premium: Premium offered.
    triggers: []
  - type: excess_notice_sent
    target: excess_changes
    meaning: A written notice of cancellation or non-renewal is mailed to the insured.
    grain: one row per notice
    distinguish_by: [notice_reason, notice_effective_date]
    fields:
      recorded_date: Date mailed.
      notice_reason: Why.
      notice_effective_date: Date the cancellation or non-renewal takes effect.
    triggers: []
  - type: excess_claim_reported
    target: excess_claims
    meaning: A flood loss expected to exceed the underlying limits, or needing loss-of-use coverage, is reported and a claim number assigned.
    grain: one row per claim reported
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      date_of_loss: Date of the flood.
      event_date: Date reported.
      underlying_claim_number: Claim number on the underlying policy, exactly as the underlying carrier issued it.
    triggers: []
  - type: excess_adjuster_report
    target: excess_claims
    meaning: The adjuster reports the whole covered loss, measured from the first dollar, so the part above the attachment can be found.
    grain: one row per report on a claim
    distinguish_by: [claim_number, report_type, event_date]
    fields:
      claim_number: Claim.
      date_of_loss: Date of loss.
      report_type: Kind of report.
      event_date: Date filed.
      building_covered_loss: Whole covered dwelling loss at the policy's settlement basis.
      contents_covered_loss: Whole covered personal property loss at the policy's settlement basis.
      loss_of_use_incurred: Additional living expense incurred to date.
    triggers: []
  - type: excess_underlying_settlement_recorded
    target: excess_claims
    meaning: The underlying carrier's settlement of the same flood loss is recorded from its payment letter or statement of loss.
    grain: one row per underlying settlement statement received
    distinguish_by: [claim_number, event_date]
    fields:
      claim_number: Excess claim the settlement relates to.
      underlying_claim_number: Underlying claim number.
      event_date: Date the statement was received.
      underlying_paid_building: Dwelling amount the underlying policy paid or agreed.
      underlying_paid_contents: Personal property amount the underlying policy paid or agreed.
    triggers: []
  - type: excess_proof_of_loss_filed
    target: excess_claims
    meaning: The insured's signed proof of loss for the excess coverage is received.
    grain: one row per proof of loss received
    distinguish_by: [claim_number, coverage_part, event_date]
    fields:
      claim_number: Claim.
      date_of_loss: Date of loss.
      coverage_part: Coverage.
      claimed_amount: Amount sworn.
      event_date: Date received.
    triggers: []
  - type: excess_claim_paid
    target: excess_claims
    meaning: An excess claim payment for one coverage is issued.
    grain: one row per payment item
    distinguish_by: [claim_number, coverage_part, payment_ref]
    fields:
      claim_number: Claim.
      coverage_part: Coverage paid.
      payment_amount: Amount paid, positive.
      payment_ref: Check or ACH reference.
      payee: Payee line.
      event_date: Date issued.
    account: claim_paid
    direction: in
    triggers: []
  - type: excess_claim_payment_voided
    target: excess_claims
    meaning: An issued excess payment is voided before reissue.
    grain: one row per payment item voided
    distinguish_by: [payment_ref]
    fields:
      claim_number: Claim.
      coverage_part: Coverage.
      payment_amount: Amount voided, positive.
      payment_ref: Reference voided.
      event_date: Date voided.
    account: claim_paid
    direction: out
    triggers: []
  - type: excess_claim_denied
    target: excess_claims
    meaning: Tidemark denies an excess coverage on a claim in writing.
    grain: one row per denial per coverage
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim.
      coverage_part: Coverage denied.
      denial_reason: Reason.
      event_date: Date of denial.
    triggers: []

measures:
  - id: excess_msr_term_claims_paid
    window: The current policy term, from term_start inclusive to term_end exclusive, judged by each claim's date_of_loss.
    measure: Count of distinct claim_number values on the policy with a date_of_loss inside the window whose net payment (excess_claim_paid minus excess_claim_payment_voided payment_amount) is above zero.
  - id: excess_msr_claim_part_paid
    window: The whole life of one claim_number, for one coverage_part.
    measure: Sum of payment_amount on excess_claim_paid rows minus sum of payment_amount on excess_claim_payment_voided rows for that claim_number and coverage_part.

policies:
  - id: excess_agg_multi_holding
    subject: [excess_policy_issued]
    rule: >-
      A customer may hold any number of Excess Flood policies, one for each insured home at a different property address;
      there is no per-customer cap. Each policy is rated, billed and settled on its own, and limits are never combined
      across a customer's policies.
    eligibility: []
    params:
      max_per_customer: null
  - id: excess_agg_underlying_requirement
    subject: [excess_policy_issued, excess_term_renewed, excess_underlying_updated, excess_underlying_evidence_received]
    rule: >-
      Only one Excess Flood policy may be live on a property address: a new policy is bound only when no other Excess
      Flood policy at the same property address is in status pending_effective or active. An Excess Flood policy always
      sits over a primary flood policy on the same home of a type in underlying_types_accepted. A policy is bound or
      renewed only when declarations of the underlying primary flood policy showing it in force on the excess term start
      are on file; when the underlying is a Tidemark NFIP Dwelling Form or HomeFlood policy, the Tidemark policy record
      itself is that evidence. The attachment points are fixed at binding from the underlying type: over an NFIP
      Dwelling Form policy the building attachment is building_attachment_nfip and the contents attachment is
      contents_attachment_nfip; over a private primary policy each attachment is the underlying limit, but never less
      than building_attachment_private_min or contents_attachment_private_min. When drop_down_on_underlying_gap is false
      the excess policy never pays any part of a loss below its attachment point — not when the underlying policy has
      lapsed, been cancelled or carries a lower limit, and not when the underlying carrier pays less for its own
      deductible or exclusions; the insured bears that gap.
    eligibility:
      - id: one_live_excess_per_address
        applies_to: [excess_policy_issued]
        kind: dedup
        condition: 'Only one Excess Flood policy may be live on a property address: a new policy is bound only when no other Excess Flood policy at the same property address is in status pending_effective or active.'
        evidence_fields: [excess_policies.property_address, excess_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [excess_policies.property_address]
          action_bindings:
            excess_policies.property_address: property_address
        dedup_contract:
          table: excess_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [pending_effective, active]}
          distinct_fields: []
      - id: underlying_in_force_on_term_start
        applies_to: [excess_policy_issued, excess_term_renewed]
        kind: authorization
        condition: A policy is bound or renewed only when declarations of the underlying primary flood policy showing it in force on the excess term start are on file; when the underlying is a Tidemark NFIP Dwelling Form or HomeFlood policy, the Tidemark policy record itself is that evidence.
        evidence_fields: [excess_changes.underlying_policy_number, excess_changes.underlying_term_start, excess_changes.underlying_expiration_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [excess_changes.underlying_policy_number]
          action_bindings:
            excess_changes.underlying_policy_number: underlying_policy_number
    formula:
      building_attachment_point: building_attachment_nfip if underlying_type == "NFIP_DWELLING" else max(building_attachment_private_min, underlying_building_limit)
      contents_attachment_point: contents_attachment_nfip if underlying_type == "NFIP_DWELLING" else max(contents_attachment_private_min, underlying_contents_limit)
  - id: excess_limits_eligibility
    subject: [excess_policy_issued, excess_endorsement_issued, excess_coverage_updated]
    rule: >-
      The excess dwelling limit lies between the tier's min_excess_building_limit and max_excess_building_limit in whole
      multiples of excess_limit_increment, and the building attachment point plus the excess dwelling limit may not
      exceed max_total_insured_to_rcv_pct of the replacement_cost_value, which must itself be at least
      min_replacement_cost_value. Excess personal property may be added only when contents_excess_available is true, up
      to max_excess_contents_limit in the same increment. A property in zone V or VE is written only on a tier whose
      v_zone_eligible is true and only when an accepted Elevation Certificate shows the lowest floor at least
      v_zone_min_elevation_ft whole feet above the base flood elevation. A property in any zone listed in
      ec_required_zones is bound only with an accepted Elevation Certificate on file, accepted on the same terms as for
      rating: FEMA Form 086-0-33, sealed by a licensed surveyor, engineer or architect, survey date no more than
      ec_max_age_years before receipt, and no alteration since. The excess policy carries no deductible of its own
      beyond excess_deductible.
    eligibility: []
    params:
      per_tier:
        Excess Flood 250K: {max_excess_building_limit: =max_excess_building_limit, v_zone_eligible: =v_zone_eligible, ec_required_zones: =ec_required_zones}
        Excess Flood 500K: {max_excess_building_limit: =max_excess_building_limit, v_zone_eligible: =v_zone_eligible, ec_required_zones: =ec_required_zones}
        Excess Flood 1M: {max_excess_building_limit: =max_excess_building_limit, v_zone_eligible: =v_zone_eligible, ec_required_zones: =ec_required_zones}
        Excess Flood 2M: {max_excess_building_limit: =max_excess_building_limit, v_zone_eligible: =v_zone_eligible, ec_required_zones: =ec_required_zones}
        Excess Flood 3M: {max_excess_building_limit: =max_excess_building_limit, v_zone_eligible: =v_zone_eligible, ec_required_zones: =ec_required_zones}
        Excess Flood 5M: {max_excess_building_limit: =max_excess_building_limit, v_zone_eligible: =v_zone_eligible, ec_required_zones: =ec_required_zones}
    formula:
      total_insured_ok: building_attachment_point + excess_building_limit <= replacement_cost_value * max_total_insured_to_rcv_pct / 100
  - id: excess_waiting_period
    subject: [excess_policy_issued, excess_policy_effective, excess_endorsement_issued]
    rule: >-
      An Excess Flood policy, and a mid-term limit increase, takes effect at 12:01 a.m. on the day standard_waiting_days
      calendar days after the signed application (or endorsement request) and full payment are received. When the excess
      policy is bound together with a new underlying primary policy, it takes effect on the underlying policy's
      effective date with concurrent_purchase_waiting_days, but never before that underlying date. A limit decrease takes
      effect on the date the signed request is received. A loss that begins before coverage or an increase takes
      effect is not covered by it.
    eligibility: []
  - id: excess_premium_rating
    subject: [excess_policy_issued, excess_term_renewed, excess_premium_charged, excess_premium_payment, excess_renewal_offered]
    rule: >-
      The annual term premium is the excess dwelling limit divided by 1,000 times building_rate_per_1000 plus the excess
      personal property limit divided by 1,000 times contents_rate_per_1000, multiplied by the zone factor for the
      property's flood_zone from zone_factor_table, reduced by elevation_credit_pct when an accepted Elevation
      Certificate on file shows the lowest floor at least elevation_credit_threshold_ft whole feet above the base flood
      elevation, plus loss_of_use_premium, rounded to the cent once at the end and never less than minimum_premium. The
      policy_fee is added for each term. The surplus lines tax and the stamping fee are the policy's recorded
      surplus_lines_tax_pct and stamping_fee_pct of the taxable amount — the term premium plus the policy fee when
      policy_fee_taxable is true — each rounded to the cent. Each term is booked as TERM_PREMIUM, POLICY_FEE,
      SURPLUS_LINES_TAX and STAMPING_FEE items, and payment_in_full_required means the whole amount is due at binding or
      renewal with no installment plan. A payment is applied to the policy and term named on it, never moved to another
      policy, and a dishonored payment is reversed and handled under the insurer-cancellation rule.
    eligibility: []
    params:
      per_tier:
        Excess Flood 250K: {building_rate_per_1000: =building_rate_per_1000, contents_rate_per_1000: =contents_rate_per_1000, minimum_premium: =minimum_premium}
        Excess Flood 500K: {building_rate_per_1000: =building_rate_per_1000, contents_rate_per_1000: =contents_rate_per_1000, minimum_premium: =minimum_premium}
        Excess Flood 1M: {building_rate_per_1000: =building_rate_per_1000, contents_rate_per_1000: =contents_rate_per_1000, minimum_premium: =minimum_premium}
        Excess Flood 2M: {building_rate_per_1000: =building_rate_per_1000, contents_rate_per_1000: =contents_rate_per_1000, minimum_premium: =minimum_premium}
        Excess Flood 3M: {building_rate_per_1000: =building_rate_per_1000, contents_rate_per_1000: =contents_rate_per_1000, minimum_premium: =minimum_premium}
        Excess Flood 5M: {building_rate_per_1000: =building_rate_per_1000, contents_rate_per_1000: =contents_rate_per_1000, minimum_premium: =minimum_premium}
    formula:
      base_amount: excess_building_limit / 1000 * building_rate_per_1000 + excess_contents_limit / 1000 * contents_rate_per_1000
      factored: base_amount * zone_factor_table[flood_zone] * ((1 - elevation_credit_pct / 100) if (ec_on_file and elevation_difference_ft >= elevation_credit_threshold_ft) else 1)
      term_premium: max(minimum_premium, round(factored + loss_of_use_premium, 2))
      taxable_amount: term_premium + (policy_fee if policy_fee_taxable else 0)
      surplus_lines_tax: round(taxable_amount * surplus_lines_tax_pct / 100, 2)
      stamping_fee: round(taxable_amount * stamping_fee_pct / 100, 2)
  - id: excess_renewal
    subject: [excess_renewal_offered, excess_term_renewed, excess_policy_expired, excess_notice_sent]
    rule: >-
      Tidemark issues the renewal offer renewal_offer_days calendar days before term_end, rated on the schedule in force
      for the coming term with the state tax rates in force on the renewal date. The renewal is bound only when full
      payment and current underlying evidence are received on or before term_end; renewal_payment_by_term_end means
      there is no grace period, and a policy not renewed by term_end expires and can be replaced only by a new
      application with a new waiting period. Tidemark may non-renew only by written notice mailed to the insured at
      least nonrenewal_notice_days calendar days before term_end.
    eligibility: []
  - id: excess_endorsements
    subject: [excess_endorsement_issued, excess_coverage_updated, excess_premium_charged, excess_premium_credit]
    rule: >-
      A mid-term endorsement is LIMIT_INCREASE or LIMIT_DECREASE and is processed only on a policy whose status is
      pending_effective or active. The policy as endorsed is re-rated for the full term, and the change in the full-term
      premium multiplied by the days from the endorsement effective date to term_end divided by the days from
      term_start to term_end, rounded to the cent, is booked as an ENDORSEMENT_PREMIUM item for an increase or an
      ENDORSEMENT credit of the TERM_PREMIUM item for a decrease, with the surplus lines tax and stamping fee on that
      amount booked or credited at the policy's recorded rates. The minimum earned premium does not apply to a
      mid-term decrease, and the policy fee is unchanged.
    eligibility:
      - id: endorsable_status
        applies_to: [excess_endorsement_issued]
        kind: state
        condition: A mid-term endorsement is LIMIT_INCREASE or LIMIT_DECREASE and is processed only on a policy whose status is pending_effective or active.
        evidence_fields: [excess_policies.status, excess_policies.excess_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [excess_policies.excess_policy_id]
          action_bindings:
            excess_policies.excess_policy_id: excess_policy_id
        state_contract:
          field: excess_policies.status
          allowed: [pending_effective, active]
    formula:
      days_remaining: term_end - change_effective_date
      term_days: term_end - term_start
      pro_rata_change: round((revised_term_premium - term_premium) * days_remaining / term_days, 2)
  - id: excess_cancellation_refund
    subject: [excess_policy_cancelled, excess_premium_credit, excess_refund_disbursed]
    rule: >-
      A cancellation is processed only on the named insured's signed cancellation request on file for the policy, and
      only on a policy whose status is pending_effective or active, which it leaves cancelled. The request states one
      reason: PROPERTY_SOLD takes effect on the closing date on the settlement statement; UNDERLYING_REPLACED_OR_ENDED and
      INSURED_REQUEST take effect on the date the signed request is received or a later date the insured names; a
      cancellation before the effective date takes effect on the effective date. Under PRO_RATA_WITH_MINIMUM_EARNED the
      earned premium is the larger of the term premium multiplied by the days from term_start to the cancellation
      effective date divided by the days from term_start to term_end, and minimum_earned_premium_pct of the term
      premium; the returned premium is the term premium less the earned premium, rounded to the cent. The policy fee is
      fully earned. When taxes_returned_with_premium is true, the surplus lines tax and stamping fee on the returned
      premium are returned at the policy's recorded rates, each rounded to the cent. When no_refund_after_paid_claim is
      true and a claim with a date of loss in the term has a net payment above zero (excess_msr_term_claims_paid above
      zero), nothing is returned. Each returned item is booked as a CANCELLATION credit referencing the request and the
      total is refunded to the insured.
    eligibility:
      - id: signed_request_on_file
        applies_to: [excess_policy_cancelled]
        kind: authorization
        condition: A cancellation is processed only on the named insured's signed cancellation request on file for the policy, and only on a policy whose status is pending_effective or active, which it leaves cancelled.
        evidence_fields: [excess_requests.excess_request_id, excess_requests.outcome, excess_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [excess_requests.excess_request_id]
          action_bindings:
            excess_requests.excess_request_id: excess_request_id
      - id: cancellable_status
        applies_to: [excess_policy_cancelled]
        kind: state
        condition: A cancellation is processed only on the named insured's signed cancellation request on file for the policy, and only on a policy whose status is pending_effective or active, which it leaves cancelled.
        evidence_fields: [excess_policies.status, excess_policies.excess_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [excess_policies.excess_policy_id]
          action_bindings:
            excess_policies.excess_policy_id: excess_policy_id
        state_contract:
          field: excess_policies.status
          allowed: [pending_effective, active, cancelled]
    measures: [excess_msr_term_claims_paid]
    formula:
      days_elapsed: cancellation_effective_date - term_start
      term_days: term_end - term_start
      earned_premium: max(round(term_premium * days_elapsed / term_days, 2), round(term_premium * minimum_earned_premium_pct / 100, 2))
      returned_premium: term_premium - earned_premium
      returned_tax: round(returned_premium * surplus_lines_tax_pct / 100, 2)
      returned_stamping_fee: round(returned_premium * stamping_fee_pct / 100, 2)
  - id: excess_insurer_cancellation
    subject: [excess_insurer_cancelled, excess_notice_sent, excess_premium_credit]
    rule: >-
      Tidemark cancels mid-term only for DISHONORED_PAYMENT of the premium or MATERIAL_MISREPRESENTATION in the
      application, by written notice mailed to the insured giving insurer_cancellation_notice_days calendar days from
      the mailing date to the cancellation date. Tidemark cancels only a policy whose status is active, which the
      cancellation leaves cancelled. On an insurer cancellation the minimum earned premium does not apply: the returned
      premium is the term premium multiplied by the days from the cancellation date to term_end divided by the days
      from term_start to term_end, rounded to the cent, with tax and stamping fee returned on it, set first against any
      amount still owed and only a remaining credit balance refunded.
    eligibility:
      - id: insurer_cancel_status
        applies_to: [excess_insurer_cancelled]
        kind: state
        condition: Tidemark cancels only a policy whose status is active, which the cancellation leaves cancelled.
        evidence_fields: [excess_policies.status, excess_policies.excess_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [excess_policies.excess_policy_id]
          action_bindings:
            excess_policies.excess_policy_id: excess_policy_id
        state_contract:
          field: excess_policies.status
          allowed: [active, cancelled]
  - id: excess_claim_intake_pol
    subject: [excess_claim_reported, excess_adjuster_report, excess_underlying_settlement_recorded, excess_proof_of_loss_filed]
    rule: >-
      A claim is taken for direct physical loss by flood to the insured home. A claim is covered only when the date of
      loss falls on or after the excess effective date and before the cancellation effective date or term_end. The
      underlying claim number is recorded at first notice, and the adjuster contacts the insured within
      adjuster_contact_hours elapsed hours. Every adjuster report measures the whole covered dwelling loss at
      building_settlement_basis and the whole covered personal property loss at the tier's contents_settlement_basis,
      from the first dollar, and the loss of use incurred; a FINAL report supersedes earlier ones and a later
      SUPPLEMENTAL report supersedes it for what it measures. The underlying carrier's payment letter or statement of
      loss is recorded as received. A proof of loss is accepted only when it is received no later than
      proof_of_loss_days calendar days after the date of loss, counted by adding the days to date_of_loss on the
      calendar with the last day qualifying. When underlying_settlement_required is true, an excess dwelling or personal
      property payment is issued only after the underlying settlement is recorded; loss of use is not held for it.
      Payment is due within claim_payment_days calendar days after the later of the agreed proof of loss and the
      underlying settlement record.
    eligibility:
      - id: loss_inside_coverage_period
        applies_to: [excess_claim_reported]
        kind: caller_fact
        condition: A claim is covered only when the date of loss falls on or after the excess effective date and before the cancellation effective date or term_end.
        evidence_fields: [excess_claims.date_of_loss, excess_policies.effective_date, excess_policies.term_end, excess_policies.cancellation_effective_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [excess_claims.date_of_loss]
          action_bindings:
            excess_claims.date_of_loss: date_of_loss
      - id: pol_deadline
        applies_to: [excess_proof_of_loss_filed]
        kind: time
        condition: A proof of loss is accepted only when it is received no later than proof_of_loss_days calendar days after the date of loss, counted by adding the days to date_of_loss on the calendar with the last day qualifying.
        evidence_fields: [excess_claims.date_of_loss, excess_claims.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [excess_claims.claim_number]
          action_bindings:
            excess_claims.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of loss
          anchor_source: excess_claims.date_of_loss
          relation: not_after
          duration_source: variants.proof_of_loss_days
          unit: calendar_days
          counting_rule: counted by adding the days to date_of_loss on the calendar with the last day qualifying
          boundary: inclusive
  - id: excess_claim_settlement
    subject: [excess_claim_paid, excess_claim_payment_voided]
    rule: >-
      The excess dwelling payable is the whole covered dwelling loss less the building attachment point less
      excess_deductible, never below zero, capped at the excess dwelling limit; the excess personal property payable is
      the whole covered personal property loss less the contents attachment point, never below zero, capped at the excess
      personal property limit, and is zero when no excess personal property limit is written. The attachment points are
      those fixed at binding, whatever the underlying actually paid. Loss of use is paid from the first dollar as
      incurred, up to loss_of_use_limit and for no longer than loss_of_use_max_months after the date of loss. A new
      payment on a coverage is its payable amount less what has already been paid net of voids on that claim and
      coverage (excess_msr_claim_part_paid), issued only when positive, to the insured. A void reverses one issued
      payment item in full by its reference and the amount is reissued under a new reference.
    eligibility: []
    measures: [excess_msr_claim_part_paid]
    formula:
      building_payable: min(excess_building_limit, max(0, building_covered_loss - building_attachment_point - excess_deductible))
      contents_payable: min(excess_contents_limit, max(0, contents_covered_loss - contents_attachment_point))
      loss_of_use_payable: min(loss_of_use_limit, loss_of_use_incurred)
  - id: excess_claim_denial
    subject: [excess_claim_denied]
    rule: >-
      Tidemark denies an excess coverage in writing with one denial_reason: NOT_A_FLOOD_EVENT, NO_COVERAGE_ON_DATE_OF_LOSS,
      PROOF_OF_LOSS_NOT_TIMELY, LOSS_WITHIN_ATTACHMENT (the covered loss does not exceed the attachment point) or
      EXCLUDED_PROPERTY. The letter states that suit may be filed within suit_limitation_months calendar months of the
      denial date and that a disagreement on the amount of loss may go to appraisal when appraisal_available is true.
    eligibility: []

extended_policies:
- id: excess_ext_renewal_term_premium
  base_policy_refs:
  - excess_agg_underlying_requirement
  - excess_premium_rating
  - excess_renewal
  overwrite:
  - base_policy: excess_premium_rating
    superseded_clause: >-
      The annual term premium is the excess dwelling limit divided by 1,000 times building_rate_per_1000 plus the excess personal
      property limit divided by 1,000 times contents_rate_per_1000, multiplied by the zone factor for the property's flood_zone
      from zone_factor_table, reduced by elevation_credit_pct when an accepted Elevation Certificate on file shows the lowest
      floor at least elevation_credit_threshold_ft whole feet above the base flood elevation, plus loss_of_use_premium, rounded
      to the cent once at the end and never less than minimum_premium.
    replaced_by: >-
      For a renewal term booked under this rule, and only for such a term, the renewal term premium is the scheduled layer
      charge multiplied by the zone factor, by the elevation multiplier and by one plus the net adjustment percentage, plus
      the tier's loss-of-use charge, rounded to the cent once at the end and never less than the tier's minimum premium; every
      other term premium is the excess dwelling limit divided by 1,000 times the tier's dwelling rate per 1,000 plus the excess
      personal property limit divided by 1,000 times the tier's personal property rate per 1,000, multiplied by the zone factor
      for the property's flood zone from the tier's zone factor table, reduced by the tier's elevation credit percentage when
      an accepted Elevation Certificate on file shows the lowest floor at least the tier's credit threshold in whole feet
      above the base flood elevation, plus the tier's loss-of-use charge, rounded to the cent once at the end and never less
      than the tier's minimum premium.
  trigger: state_due
  subject:
  - excess_term_renewed
  computes: term_premium
  target_tool: book_excess_renewal_30706efc
  params:
    zone_factor_low: 0.3
    zone_factor_a99_ar: 0.6
    zone_factor_ao: 0.9
    zone_factor_a: 1.0
    zone_factor_d: 1.2
    zone_factor_v: 2.75
    loss_window_months: 36
    loss_severe_pct: 25
    loss_single_pct: 10
    account_homeflood_pct: -7
    account_nfip_pct: -4
    occupancy_secondary_pct: 12
    occupancy_primary_pct: -3
    tenure_long_count: 5
    tenure_long_pct: -6
    tenure_mid_count: 2
    tenure_mid_pct: -3
    early_long_days: 30
    early_long_pct: -4
    early_short_days: 10
    early_short_pct: -2
  rule: >-
    An Excess Flood renewal whose full payment for the coming term was received on or before the current term end, with declarations
    of the underlying primary policy showing it in force on the renewal date on file, is booked as the next term, starting
    on the day the current term ends and running one calendar year, and its renewal term premium is figured under this rule;
    the renewal offer issued before the term end is a quotation on the schedule, not the booked figure. The renewal term premium
    starts from the scheduled layer charge: the excess dwelling limit divided by 1,000 times the tier's dwelling rate per
    1,000, plus the excess personal property limit divided by 1,000 times the tier's personal property rate per 1,000. The
    scheduled layer charge is multiplied by the zone factor that the tier's zone factor table gives the flood zone on the
    policy record and by the elevation multiplier. The elevation multiplier is one less the tier's elevation credit percentage
    where the policy record carries an accepted Elevation Certificate showing the lowest floor at least the tier's credit
    threshold in whole feet above the base flood elevation, and one where it does not. The tier's loss-of-use charge is then
    added, the sum is rounded to the cent once, and the renewal term premium is never less than the tier's minimum premium.
    For a renewal term booked under this rule, and only for such a term, the renewal term premium is the scheduled layer charge
    multiplied by the zone factor, by the elevation multiplier and by one plus the net adjustment percentage, plus the tier's
    loss-of-use charge, rounded to the cent once at the end and never less than the tier's minimum premium; every other term
    premium is the excess dwelling limit divided by 1,000 times the tier's dwelling rate per 1,000 plus the excess personal
    property limit divided by 1,000 times the tier's personal property rate per 1,000, multiplied by the zone factor for the
    property's flood zone from the tier's zone factor table, reduced by the tier's elevation credit percentage when an accepted
    Elevation Certificate on file shows the lowest floor at least the tier's credit threshold in whole feet above the base
    flood elevation, plus the tier's loss-of-use charge, rounded to the cent once at the end and never less than the tier's
    minimum premium. Every percentage this rule selects is added into the net adjustment percentage, which acts once on the
    zone-factored layer charge after the elevation multiplier and never on the loss-of-use charge. Where the policy record
    carries an accepted Elevation Certificate, the elevation multiplier is read from that certificate's whole-foot figure;
    where the policy record carries none but the NFIP policy of the home holds an applied certificate, the one received latest,
    surveyed no more than the tier's maximum certificate age, counted in whole months (twelve for each year), before the date
    it was received, the elevation multiplier is read from that certificate instead, comparing the lowest floor elevation
    it certifies less the base flood elevation it certifies with the tier's credit threshold; where neither record carries
    such a certificate, the elevation multiplier is one. The NFIP policy of the home is the Tidemark NFIP Dwelling Form policy
    in force whose policy number is the underlying policy number on the policy record, and the HomeFlood policy of the home
    is the active Tidemark HomeFlood policy whose policy number is that underlying policy number; of these two policies only
    their status, the NFIP policy's primary-residence designation, their claim payments and voided payments and the NFIP policy's
    applied Elevation Certificates are read. The renewal loss-history adjustment counts claim payments issued fewer than 36
    whole months before the renewal is booked: building payments on the claim file of the NFIP policy of the home or dwelling
    payments on the claim file of the HomeFlood policy of the home (primary payments), and claim payments on this excess policy
    (layer payments); each void of a claim payment posted in that same window takes one payment off the count. It is a surcharge
    of 25 percent where at least one layer payment or two or more primary payments stand, a surcharge of 10 percent where
    no layer payment and exactly one primary payment stands, and otherwise there is no loss-history adjustment. The renewal
    account adjustment is a credit of 7 percent where the HomeFlood policy of the home exists, a credit of 4 percent where
    it does not but the NFIP policy of the home exists, and nothing otherwise. The renewal occupancy adjustment reads the
    primary-residence designation of the NFIP policy of the home: a home that policy does not designate as the insured's primary
    residence carries a surcharge of 12 percent, a home it designates as the primary residence earns a credit of 3 percent,
    and where there is no NFIP policy of the home there is no occupancy adjustment. The renewal tenure adjustment counts the
    renewal term premiums already booked on this policy: five or more earn a credit of 6 percent, two to four earn a credit
    of 3 percent, and fewer earn none. The early-renewal adjustment counts the days from the posting date of the latest payment
    received for the coming term to the current term end: 30 days or more earn a credit of 4 percent, 10 to 29 days earn a
    credit of 2 percent, and fewer days, or no payment for the coming term, earn none. An amount received for the coming term
    above the renewal items as booked stays on the policy as a credit for that term and is set against the next amount the
    term owes. Where two entries on a file share the date this rule reads them by, or two policy records answer the same description,
    the one entered first is read.
  prerequisite: []
  cross_category:
  - category: dwelling
    as: history
    reads:
    - policy_number
    - dwelling_policy_id
    - status
    - primary_residence
    - dwelling_claims.event_date
    - dwelling_claims.coverage_part
    - dwelling_changes.ec_lowest_floor_elevation
    - dwelling_changes.ec_base_flood_elevation
    - dwelling_changes.ec_survey_date
    - dwelling_changes.recorded_date
    - dwelling_changes.ec_applied
    note: >-
      The loss-history, account, occupancy and certificate-source tiers are read from the Tidemark NFIP Dwelling Form policy
      in force named as the underlying on the policy record, its claim payments and its applied Elevation Certificate.
  - category: homeflood
    as: history
    reads:
    - policy_number
    - homeflood_policy_id
    - status
    - homeflood_claims.event_date
    - homeflood_claims.coverage_part
    note: >-
      The account tier checks for the active Tidemark HomeFlood policy named as the underlying on the policy record and the
      loss-history tier counts that policy's dwelling payments.
  compute:
  - dwelling_rate: P('building_rate_per_1000')
  - contents_rate: P('contents_rate_per_1000')
  - lou_charge: P('loss_of_use_premium')
  - floor_premium: P('minimum_premium')
  - zone_factor: >-
      K('zone_factor_low') if (F('flood_zone') == 'X' or F('flood_zone') == 'B' or F('flood_zone') == 'C') else (K('zone_factor_a99_ar')
      if (F('flood_zone') == 'A99' or F('flood_zone') == 'AR') else (K('zone_factor_ao') if F('flood_zone') == 'AO' else (K('zone_factor_d')
      if F('flood_zone') == 'D' else (K('zone_factor_v') if (F('flood_zone') == 'V' or F('flood_zone') == 'VE') else K('zone_factor_a')))))
  - scheduled_layer: >-
      F('excess_building_limit') / 1000 * dwelling_rate + F('excess_contents_limit') / 1000 * contents_rate
  - home_nfip_id: >-
      CFIELD('dwelling', 'dwelling_policy_id', policy_number=F('underlying_policy_number'), status='in_force')
  - home_homeflood_id: >-
      CFIELD('homeflood', 'homeflood_policy_id', policy_number=F('underlying_policy_number'), status='active')
  - nfip_cert_lowest: >-
      XLATEST('dwelling', 'dwelling_changes', 'ec_lowest_floor_elevation', date_field='recorded_date', event_type='dwelling_ec_received',
      ec_applied=True, dwelling_policy_id=home_nfip_id)
  - nfip_cert_bfe: >-
      XLATEST('dwelling', 'dwelling_changes', 'ec_base_flood_elevation', date_field='recorded_date', event_type='dwelling_ec_received',
      ec_applied=True, dwelling_policy_id=home_nfip_id)
  - nfip_cert_age_months: >-
      MONTHS(XLATEST('dwelling', 'dwelling_changes', 'ec_survey_date', date_field='recorded_date', event_type='dwelling_ec_received',
      ec_applied=True, dwelling_policy_id=home_nfip_id), XLATEST('dwelling', 'dwelling_changes', 'recorded_date', date_field='recorded_date',
      event_type='dwelling_ec_received', ec_applied=True, dwelling_policy_id=home_nfip_id)) if nfip_cert_lowest != None else
      9999
  - elevation_credit_mult: >-
      ((1 - P('elevation_credit_pct') / 100) if F('elevation_difference_ft') >= P('elevation_credit_threshold_ft') else 1)
      if F('ec_on_file') == True else ((1 - P('elevation_credit_pct') / 100) if (nfip_cert_lowest != None and nfip_cert_age_months
      <= P('ec_max_age_years') * 12 and nfip_cert_lowest - nfip_cert_bfe >= P('elevation_credit_threshold_ft')) else 1)
  - primary_paid_recent: >-
      XCOUNT('dwelling', 'dwelling_claims', within_months=K('loss_window_months'), date_field='event_date', event_type='dwelling_claim_paid',
      coverage_part='BUILDING', dwelling_policy_id=home_nfip_id) - XCOUNT('dwelling', 'dwelling_claims', within_months=K('loss_window_months'),
      date_field='event_date', event_type='dwelling_claim_payment_voided', coverage_part='BUILDING', dwelling_policy_id=home_nfip_id)
      + XCOUNT('homeflood', 'homeflood_claims', within_months=K('loss_window_months'), date_field='event_date', event_type='homeflood_claim_paid',
      coverage_part='DWELLING', homeflood_policy_id=home_homeflood_id) - XCOUNT('homeflood', 'homeflood_claims', within_months=K('loss_window_months'),
      date_field='event_date', event_type='homeflood_claim_payment_voided', coverage_part='DWELLING', homeflood_policy_id=home_homeflood_id)
  - layer_paid_recent: >-
      COUNT('excess_claims', within_months=K('loss_window_months'), date_field='event_date', event_type='excess_claim_paid')
      - COUNT('excess_claims', within_months=K('loss_window_months'), date_field='event_date', event_type='excess_claim_payment_voided')
  - loss_history_pct: >-
      K('loss_severe_pct') if (layer_paid_recent >= 1 or primary_paid_recent >= 2) else (K('loss_single_pct') if (layer_paid_recent
      == 0 and primary_paid_recent == 1) else 0)
  - homeflood_primary_active: EXISTS('homeflood', policy_number=F('underlying_policy_number'), status='active')
  - nfip_primary_in_force: EXISTS('dwelling', policy_number=F('underlying_policy_number'), status='in_force')
  - account_pct: >-
      K('account_homeflood_pct') if homeflood_primary_active else (K('account_nfip_pct') if nfip_primary_in_force else 0)
  - nfip_primary_residence: >-
      CFIELD('dwelling', 'primary_residence', policy_number=F('underlying_policy_number'), status='in_force')
  - occupancy_pct: >-
      K('occupancy_secondary_pct') if nfip_primary_residence == False else (K('occupancy_primary_pct') if nfip_primary_residence
      == True else 0)
  - renewals_booked: >-
      COUNT('excess_billing', event_type='excess_premium_charged', component='TERM_PREMIUM', charge_basis='RENEWAL')
  - tenure_pct: >-
      K('tenure_long_pct') if renewals_booked >= K('tenure_long_count') else (K('tenure_mid_pct') if renewals_booked >= K('tenure_mid_count')
      else 0)
  - renewal_paid_on: >-
      LATEST('excess_billing', 'posted_date', date_field='posted_date', event_type='excess_premium_payment', term_start=F('term_end'))
  - days_paid_ahead: DAYS(renewal_paid_on, F('term_end')) if renewal_paid_on != None else 0
  - early_pay_pct: >-
      K('early_long_pct') if days_paid_ahead >= K('early_long_days') else (K('early_short_pct') if days_paid_ahead >= K('early_short_days')
      else 0)
  - net_adjust_pct: loss_history_pct + account_pct + occupancy_pct + tenure_pct + early_pay_pct
  - adjusted_layer: scheduled_layer * zone_factor * elevation_credit_mult * (1 + net_adjust_pct / 100)
  - result: MX(floor_premium, RND(adjusted_layer + lou_charge, 2))
  compute_basis:
