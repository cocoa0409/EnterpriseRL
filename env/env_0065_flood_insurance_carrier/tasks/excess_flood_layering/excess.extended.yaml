  factors:
  - id: comparable_housing_share
    effect: parameter
    decides: housing_share
    bindings:
    - monthly_ratio_pct
    - housing_share
    ladder:
    - when: the loss of use counted per displacement month exceeds 0.40 percent of the replacement cost value
      value: K('share_high') — 80 percent
    - when: it exceeds 0.25 percent but not 0.40 percent
      value: K('share_mid') — 90 percent
    - when: otherwise
      value: the whole figure (100 percent)
    baseline:
      housing_share: '1'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: displacement_period_end
    effect: method
    decides: period_fraction
    bindings:
    - max_months
    - sale_closing
    - displacement_months
    - days_loss_to_report
    - period_fraction
    ladder:
    - when: >-
        a sale closing date falls on or after the date of loss and before the date of the latest adjuster report
      method: >-
        multiply by the days from the date of loss to the closing over the days from the date of loss to the report
    - when: no such sale and the displacement months exceed the tier's maximum months
      method: multiply by the maximum months over the displacement months
    - when: otherwise
      method: the figure stands as reported
    baseline:
      period_fraction: '1'
    evidence:
    - date
    - cross_category
    cross_difficulty: homeflood
  - id: primary_lou_offset
    effect: method
    decides: underlying_offset
    bindings:
    - homeflood_lou_limit
    - underlying_offset
    ladder:
    - when: the underlying policy number on the policy record is that of a Tidemark HomeFlood policy
      method: subtract the loss-of-use limit of that HomeFlood policy's tier
    - when: the underlying is a private primary policy of another carrier
      method: subtract 10 percent of the underlying dwelling limit on the policy record
    - when: otherwise (an underlying NFIP Dwelling Form policy, no loss-of-use cover)
      method: nothing is subtracted; loss of use is paid from the first dollar
    baseline:
      underlying_offset: '0'
    evidence:
    - cross_category
    cross_difficulty: homeflood
  - id: loss_severity_allowance
    effect: parameter
    decides: moving_allowance
    bindings:
    - final_dwelling_loss
    - loss_severity_pct
    - moving_allowance
    ladder:
    - when: >-
        the whole covered dwelling loss on the claim's latest FINAL adjuster report is at least 40 percent of the replacement
        cost value
      value: K('move_major') — 2,500
    - when: it is at least 20 percent but below 40 percent
      value: K('move_mid') — 1,000
    - when: otherwise
      value: nothing
    baseline:
      moving_allowance: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: interest_due_anchor
    effect: method
    decides: days_late
    bindings:
    - report_kind
    - pay_days
    - lou_proof_date
    - claim_proof_date
    - settlement_date
    - days_late
    ladder:
    - when: the latest adjuster report is a SUPPLEMENTAL report
      method: due the tier's claim-payment days after that report
    - when: the latest report is a FINAL report and a proof of loss for loss of use is on file
      method: due the tier's claim-payment days after the later of that proof of loss and the report
    - when: otherwise
      method: >-
        due the tier's claim-payment days after the later of the latest proof of loss on the claim and the underlying settlement
        record (none where neither is on file)
    baseline:
      days_late: >-
        (MX(0, DAYS(claim_proof_date if (settlement_date == None or (claim_proof_date != None and claim_proof_date > settlement_date))
        else settlement_date, NOW) - pay_days) if (claim_proof_date != None or settlement_date != None) else 0)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: claim_age_rate
    effect: parameter
    decides: interest_rate_pct
    bindings:
    - claim_age_months
    - interest_rate_pct
    ladder:
    - when: the date of loss is 12 or more whole months before the payment
      value: K('rate_long_pct') — 10 percent a year
    - when: it is 6 to 11 whole months before
      value: K('rate_mid_pct') — 9 percent a year
    - when: otherwise
      value: K('rate_base_pct') — 8 percent a year
    baseline:
      interest_rate_pct: K('rate_base_pct')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The loss of use counted is the figure incurred to date on the latest adjuster report of the claim. The loss-of-use payable
      is the loss of use counted, never more than the tier's loss-of-use limit, and the new loss-of-use payment is the loss-of-use
      payable less the loss-of-use payments already issued on the claim net of voided ones, issued only when positive, rounded
      to the cent once at the end. Late-payment interest is the new loss-of-use payment times the yearly interest rate times
      the interest days over 365, the yearly interest rate being 8 percent. The interest days are the days after the due date,
      which is the tier's claim-payment days after the later of the latest proof of loss on the claim and the latest underlying
      settlement record of the claim, and there are none where neither is on file or the due date has not passed.
    params:
    - claim_payment_days
    - loss_of_use_limit
    - loss_of_use_max_months
    - rate_base_pct
  inputs:
    history:
    - table: excess_claims
      aggregate: latest
      field: loss_of_use_incurred
      filters:
        event_type: excess_adjuster_report
    - table: excess_claims
      aggregate: sum
      field: payment_amount
      filters:
        event_type: excess_claim_paid
        coverage_part: LOSS_OF_USE
    cross_category:
    - homeflood
