# Tidemark Flood — Excess Flood, written on a surplus lines basis through Tidemark's surplus lines
# affiliate for homes whose value exceeds the limits of their primary flood policy. All rates, limits,
# fees and servicing periods are Tidemark's own written schedules. The surplus lines premium tax and
# stamping fee are set by the state where the property is located; the rates in force for the policy
# are recorded on the policy record and are never set by this charter.
category: excess
display_name: Excess Flood Policies (Surplus Lines)

binding:
  holding_table: excess_policies
  event_tables: [excess_billing, excess_claims, excess_changes]
  intake_tables: [excess_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [pending_effective, active, expired, cancelled]
  transitions:
    - {from: pending_effective, to: active, by: system, means: The waiting period ends and the excess coverage attaches at 12:01 a.m. on the effective date.}
    - {from: active, to: expired, by: system, means: The term ends without a renewal being bound.}
    - {from: active, to: cancelled, by: user, means: The named insured signs a cancellation request for an active policy.}
    - {from: pending_effective, to: cancelled, by: user, means: The named insured signs a cancellation request before the policy took effect.}
    - {from: active, to: cancelled, by: agent, means: Tidemark cancels the policy after its written notice period runs out.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: The amount the insured owes on the policy; premium, policy fee, surplus lines tax and stamping fee raise it, payments and credits lower it, and refunds paid out bring a credit balance back to zero.
  - key: claim_paid
    unit: USD
    meaning: Net excess claim money issued on the policy; each payment raises it and each void lowers it.

parameter_schema:
  min_excess_building_limit: Lowest excess dwelling limit the tier writes; USD.
  max_excess_building_limit: Highest excess dwelling limit the tier writes; USD.
  excess_limit_increment: Increment in which excess limits are written; USD.
  contents_excess_available: Whether excess personal property coverage may be added; boolean.
  max_excess_contents_limit: Highest excess personal property limit; USD (0 where unavailable).
  building_attachment_nfip: Dwelling attachment point when the underlying is an NFIP Dwelling Form policy; USD.
  contents_attachment_nfip: Personal property attachment point when the underlying is an NFIP Dwelling Form policy; USD.
  building_attachment_private_min: Lowest dwelling attachment point accepted when the underlying is a private primary flood policy; USD.
  contents_attachment_private_min: Lowest personal property attachment point accepted over a private primary policy; USD.
  underlying_types_accepted: Kinds of underlying primary flood policy accepted; list of enum (NFIP_DWELLING, PRIVATE_PRIMARY).
  drop_down_on_underlying_gap: Whether the excess policy pays inside the attachment point when the underlying lapses or carries less than the attachment; boolean.
  underlying_evidence_at_bind: Whether current declarations of the underlying policy must be on file before binding and at each renewal; boolean.
  min_replacement_cost_value: Lowest dwelling replacement cost value the tier accepts; USD.
  max_total_insured_to_rcv_pct: Ceiling on attachment point plus excess dwelling limit as a percent of the replacement cost value; percent.
  loss_of_use_limit: Additional living expense limit, paid from the first dollar because NFIP primary policies carry none; USD per occurrence.
  loss_of_use_max_months: Longest period additional living expense is paid after the date of loss; calendar months.
  building_settlement_basis: Basis for the dwelling loss measured above the attachment; enum (REPLACEMENT_COST).
  contents_settlement_basis: Basis for the personal property loss measured above the attachment; enum (ACTUAL_CASH_VALUE, REPLACEMENT_COST).
  v_zone_eligible: Whether a property in zone V or VE may be written on the tier; boolean.
  v_zone_min_elevation_ft: Lowest floor height above base flood elevation required on an accepted certificate for a V-zone property; whole feet.
  ec_required_zones: Flood zones in which an accepted Elevation Certificate is required to bind; list of enum.
  building_rate_per_1000: Annual rate per 1,000 USD of excess dwelling limit; USD.
  contents_rate_per_1000: Annual rate per 1,000 USD of excess personal property limit; USD.
  zone_factor_table: Rating factor by FEMA flood zone; mapping zone -> factor.
  elevation_credit_threshold_ft: Lowest floor height above base flood elevation that earns the elevation credit; whole feet.
  elevation_credit_pct: Credit when the accepted certificate shows the threshold height or more; percent.
  loss_of_use_premium: Flat annual charge for loss-of-use coverage; USD.
  minimum_premium: Lowest annual premium after factors and credits, before fee and taxes; USD.
  policy_fee: Annual policy fee, fully earned at binding; USD.
  policy_fee_taxable: Whether the surplus lines tax and stamping fee apply to the policy fee as well as the premium; boolean.
  payment_in_full_required: Whether the full term premium, fee and taxes must be paid at binding and renewal; boolean.
  standard_waiting_days: Waiting period from receipt of the signed application and full payment to the excess coverage attaching, and for mid-term increases; calendar days.
  concurrent_purchase_waiting_days: Waiting period when the excess policy is bound together with a new underlying policy and is to start on the underlying effective date; calendar days.
  renewal_offer_days: Days before term end the renewal offer is issued; calendar days.
  renewal_payment_by_term_end: Whether renewal payment must be received by term end with no grace period; boolean.
  nonrenewal_notice_days: Days of written notice before term end for a Tidemark non-renewal; calendar days.
  insurer_cancellation_notice_days: Days of written notice before Tidemark cancels for a dishonored payment or material misrepresentation; calendar days.
  minimum_earned_premium_pct: Share of the term premium that is fully earned once the policy is bound, whatever the cancellation date; percent.
  cancellation_refund_method: Method for returning premium on an insured's cancellation; enum (PRO_RATA_WITH_MINIMUM_EARNED).
  no_refund_after_paid_claim: Whether the term premium is fully earned when a claim in the term has been paid; boolean.
  taxes_returned_with_premium: Whether surplus lines tax and stamping fee are returned in proportion to returned premium; boolean.
  proof_of_loss_days: Days after the date of loss within which the signed proof of loss must be received; calendar days.
  underlying_settlement_required: Whether the excess building or contents payment waits for the underlying policy's settlement record; boolean.
  claim_payment_days: Days after the agreed proof of loss and the underlying settlement record within which Tidemark pays; calendar days.
  adjuster_contact_hours: Tidemark standard for the adjuster's first contact; elapsed hours.
  suit_limitation_months: Months after the written denial within which suit may be filed; calendar months.
  appraisal_available: Whether either party may demand appraisal of the amount of loss; boolean.
  ec_max_age_years: Oldest Elevation Certificate survey date accepted, with no alteration since; years.
  excess_deductible: Deductible applied by the excess policy itself beyond its attachment point; USD.

