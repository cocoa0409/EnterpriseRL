      field: event_date
      filters:
        event_type: excess_claim_paid
        coverage_part: LOSS_OF_USE
    - table: excess_billing
      aggregate: count
      field: excess_billing_id
      filters:
        event_type: excess_premium_charged
        component: TERM_PREMIUM
        charge_basis: RENEWAL
    - table: excess_claims
      aggregate: count
      field: excess_claim_event_id
      within_months: 12
      filters:
        event_type: excess_claim_paid
    cross_category:
    - homeflood
- id: excess_ext_loss_of_use_payment
  base_policy_refs:
  - excess_claim_settlement
  - excess_claim_intake_pol
  overwrite:
  - base_policy: excess_claim_settlement
    superseded_clause: >-
      Loss of use is paid from the first dollar as incurred, up to loss_of_use_limit and for no longer than loss_of_use_max_months
      after the date of loss.
    replaced_by: >-
      For a loss-of-use payment on an Excess Flood claim figured under this rule, and only for such a payment, the documented
      loss of use is taken as this rule adjusts it, less the underlying offset this rule sets, capped at the tier's loss-of-use
      limit and kept within the tier's maximum months after the date of loss, with the additions this rule sets out; every
      loss-of-use payment is figured this way, and the settlement sentences on building and personal property payments are
      not affected.
  - base_policy: excess_claim_intake_pol
    superseded_clause: >-
      Payment is due within claim_payment_days calendar days after the later of the agreed proof of loss and the underlying
      settlement record.
    replaced_by: >-
      For a loss-of-use payment figured under this rule, and only for such a payment, the payment is due as this rule's late-payment
      interest sentences set out; a building or personal property payment is due within the tier's claim-payment days after
      the later of the agreed proof of loss and the underlying settlement record.
  trigger: state_due
  subject:
  - excess_claim_paid
  computes: payment_amount
  target_tool: pay_excess_loss_of_use_f5cb8480
  params:
    ratio_high_pct: 0.4
    share_high: 0.8
    ratio_mid_pct: 0.25
    share_mid: 0.9
    rate_long_months: 12
    rate_long_pct: 10
    rate_mid_months: 6
    rate_mid_pct: 9
    severity_major_pct: 40
    move_major: 2500
    severity_mid_pct: 20
    move_mid: 1000
    other_carrier_lou_share: 0.1
    rate_base_pct: 8
  rule: >-
    A loss-of-use payment on an Excess Flood claim falls due once an adjuster report documents loss of use beyond what has
    been paid, and its amount is figured under this rule. The claim is the claim of the policy that carries the latest adjuster
    report, and every claim figure this rule reads is read from that claim's own entries. The loss of use counted is the figure
    incurred to date on the latest adjuster report of the claim. The loss-of-use payable is the loss of use counted, never
    more than the tier's loss-of-use limit, and the new loss-of-use payment is the loss-of-use payable less the loss-of-use
    payments already issued on the claim net of voided ones, issued only when positive, rounded to the cent once at the end.
    For a loss-of-use payment on an Excess Flood claim figured under this rule, and only for such a payment, the documented
    loss of use is taken as this rule adjusts it, less the underlying offset this rule sets, capped at the tier's loss-of-use
    limit and kept within the tier's maximum months after the date of loss, with the additions this rule sets out; every loss-of-use
    payment is figured this way, and the settlement sentences on building and personal property payments are not affected.
    The displacement months are the whole months from the date of loss to the date of the latest adjuster report, counted
    as at least one, and the sale closing date is the cancellation effective date of the Tidemark HomeFlood policy whose policy
    number is the underlying policy number on the policy record, where that policy was cancelled because the home was sold.
    Every share or period cut this rule sets multiplies the loss of use counted; every amount this rule deducts is then subtracted,
    never taking the figure below nothing; every allowance this rule sets is then added; the loss-of-use limit then caps the
    result; payments already issued on the claim are subtracted after the cap; and every interest charge this rule sets is
    added last. The comparable-housing share of the loss of use counted is 80 percent where the loss of use counted per displacement
    month exceeds 0.40 percent of the replacement cost value on the policy record, 90 percent where it exceeds 0.25 percent
    but not 0.40 percent, and the whole figure otherwise. The displacement period is cut as follows: where a sale closing
    date falls on or after the date of loss and before the date of the latest adjuster report, the loss of use counted is
    multiplied by the days from the date of loss to the sale closing date over the days from the date of loss to the report
    date; where there is no such sale and the displacement months exceed the tier's maximum months, it is multiplied by those
    maximum months over the displacement months; otherwise the figure stands as reported. The underlying offset keeps the
    excess layer above the primary policy's own loss-of-use cover: where the underlying policy number on the policy record
    is that of a Tidemark HomeFlood policy, the offset is the loss-of-use limit of that HomeFlood policy's tier; where the
    underlying is a private primary policy of another carrier, the offset is 10 percent of the underlying dwelling limit on
    the policy record; and otherwise, for an underlying NFIP Dwelling Form policy, which carries no loss-of-use cover, there
    is no underlying offset and loss of use is paid from the first dollar. A moving and storage allowance is added: 2,500
    where the whole covered dwelling loss on the claim's latest FINAL adjuster report is at least 40 percent of the replacement
    cost value on the policy record, 1,000 where it is at least 20 percent but below 40 percent, and nothing otherwise. Late-payment
    interest is the new loss-of-use payment times the yearly interest rate times the interest days over 365, the yearly interest
    rate being 8 percent. The interest days are the days after the due date, which is the tier's claim-payment days after
    the later of the latest proof of loss on the claim and the latest underlying settlement record of the claim, and there
    are none where neither is on file or the due date has not passed. The due date is instead the tier's claim-payment days
    after the latest adjuster report where that report is a SUPPLEMENTAL report, and the tier's claim-payment days after the
    later of the latest proof of loss for loss of use and the report where the latest report is a FINAL report and such a
    proof of loss is on file. The yearly interest rate is instead 10 percent where the date of loss is 12 or more whole months
    before the payment and 9 percent where it is 6 to 11 whole months before. For a loss-of-use payment figured under this
    rule, and only for such a payment, the payment is due as this rule's late-payment interest sentences set out; a building
    or personal property payment is due within the tier's claim-payment days after the later of the agreed proof of loss and
    the underlying settlement record. Where two entries on a file share the date this rule reads them by, or two policy records
    answer the same description, the one entered first is read.
  prerequisite: []
  cross_category:
  - category: homeflood
    as: branch
    reads:
    - policy_number
    - cancellation_reason
    - cancellation_effective_date
    - loss_of_use_limit
    note: >-
      The underlying offset reads the loss-of-use limit of the tier of the Tidemark HomeFlood policy named as the underlying;
      the sale closing date is that HomeFlood policy's cancellation for the sale of the home.
  compute:
  - lou_limit: P('loss_of_use_limit')
  - max_months: P('loss_of_use_max_months')
  - pay_days: P('claim_payment_days')
  - claim_in_hand: >-
      LATEST('excess_claims', 'claim_number', date_field='event_date', event_type='excess_adjuster_report')
  - date_of_loss: >-
      LATEST('excess_claims', 'date_of_loss', date_field='event_date', event_type='excess_claim_reported', claim_number=claim_in_hand)
  - report_incurred: >-
      LATEST('excess_claims', 'loss_of_use_incurred', date_field='event_date', event_type='excess_adjuster_report', claim_number=claim_in_hand)
  - report_date: >-
      LATEST('excess_claims', 'event_date', date_field='event_date', event_type='excess_adjuster_report', claim_number=claim_in_hand)
  - report_kind: >-
      LATEST('excess_claims', 'report_type', date_field='event_date', event_type='excess_adjuster_report', claim_number=claim_in_hand)
  - prior_lou_paid: >-
      SUM('excess_claims', 'payment_amount', event_type='excess_claim_paid', coverage_part='LOSS_OF_USE', claim_number=claim_in_hand)
      - SUM('excess_claims', 'payment_amount', event_type='excess_claim_payment_voided', coverage_part='LOSS_OF_USE', claim_number=claim_in_hand)
  - displacement_months: MX(1, MONTHS(date_of_loss, report_date))
  - sale_closing: >-
      CFIELD('homeflood', 'cancellation_effective_date', policy_number=F('underlying_policy_number'), cancellation_reason='PROPERTY_SOLD')
  - monthly_ratio_pct: report_incurred / MX(1, MONTHS(date_of_loss, report_date)) / F('replacement_cost_value') * 100
  - housing_share: >-
      K('share_high') if monthly_ratio_pct > K('ratio_high_pct') else (K('share_mid') if monthly_ratio_pct > K('ratio_mid_pct')
      else 1)
  - days_loss_to_report: DAYS(date_of_loss, report_date)
  - period_fraction: >-
      (DAYS(date_of_loss, sale_closing) / days_loss_to_report) if (sale_closing != None and sale_closing >= date_of_loss and
      sale_closing < report_date) else ((max_months / displacement_months) if displacement_months > max_months else 1)
  - homeflood_lou_limit: CPARAM('homeflood', 'loss_of_use_limit', policy_number=F('underlying_policy_number'))
  - underlying_offset: >-
      homeflood_lou_limit if homeflood_lou_limit != None else ((F('underlying_building_limit') * K('other_carrier_lou_share'))
      if F('underlying_type') == 'PRIVATE_PRIMARY' else 0)
  - final_dwelling_loss: >-
      LATEST('excess_claims', 'building_covered_loss', date_field='event_date', event_type='excess_adjuster_report', report_type='FINAL',
      claim_number=claim_in_hand)
  - loss_severity_pct: (final_dwelling_loss / F('replacement_cost_value') * 100) if final_dwelling_loss != None else 0
  - moving_allowance: >-
      K('move_major') if loss_severity_pct >= K('severity_major_pct') else (K('move_mid') if loss_severity_pct >= K('severity_mid_pct')
      else 0)
  - lou_payable: >-
      MN(lou_limit, MX(0, report_incurred * housing_share * period_fraction - underlying_offset) + moving_allowance)
  - lou_due: MX(0, lou_payable - prior_lou_paid)
  - lou_proof_date: >-
      LATEST('excess_claims', 'event_date', date_field='event_date', event_type='excess_proof_of_loss_filed', coverage_part='LOSS_OF_USE',
      claim_number=claim_in_hand)
  - claim_proof_date: >-
      LATEST('excess_claims', 'event_date', date_field='event_date', event_type='excess_proof_of_loss_filed', claim_number=claim_in_hand)
  - settlement_date: >-
      LATEST('excess_claims', 'event_date', date_field='event_date', event_type='excess_underlying_settlement_recorded', claim_number=claim_in_hand)
  - days_late: >-
      MX(0, DAYS(report_date, NOW) - pay_days) if report_kind == 'SUPPLEMENTAL' else ((MX(0, DAYS(lou_proof_date if lou_proof_date
      > report_date else report_date, NOW) - pay_days)) if (report_kind == 'FINAL' and lou_proof_date != None) else (MX(0,
      DAYS(claim_proof_date if (settlement_date == None or (claim_proof_date != None and claim_proof_date > settlement_date))
      else settlement_date, NOW) - pay_days) if (claim_proof_date != None or settlement_date != None) else 0))
  - claim_age_months: MONTHS(date_of_loss, NOW)
  - interest_rate_pct: >-
      K('rate_long_pct') if claim_age_months >= K('rate_long_months') else (K('rate_mid_pct') if claim_age_months >= K('rate_mid_months')
      else K('rate_base_pct'))
  - late_interest: lou_due * interest_rate_pct / 100 * days_late / 365
  - result: RND(lou_due + late_interest, 2)
  compute_basis:
    lou_limit: The loss-of-use payable is the loss of use counted, never more than the tier's loss-of-use limit
    max_months: >-
      where there is no such sale and the displacement months exceed the tier's maximum months, it is multiplied by those
      maximum months over the displacement months
    pay_days: >-
      The interest days are the days after the due date, which is the tier's claim-payment days after the later of the latest
