      params: []
    inputs:
      history:
        - {table: forceplaced_certificates, aggregate: latest, field: annual_premium, filters: {event_type: forceplaced_certificate_issued}}
        - {table: forceplaced_claims, aggregate: sum, field: payment_amount, filters: {event_type: forceplaced_claim_paid}}
        - {table: forceplaced_certificates, aggregate: count, field: certificate_number, filters: {event_type: forceplaced_certificate_issued}}
      cross_category: []

