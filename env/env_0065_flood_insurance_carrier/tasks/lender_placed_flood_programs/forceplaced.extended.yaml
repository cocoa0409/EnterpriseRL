events:
  - type: forceplaced_program_enrolled
    target: forceplaced_programs
    mutation: create
    meaning: A lender's master lender-placed flood program for one tier is set up and waits in enrolled until its effective date.
    grain: one row per master program enrolled
    fields:
      master_policy_number: Master policy number issued to the lender.
      variant_name: Program tier.
      program_effective_date: Date the master policy takes effect.
      program_term_end: End of the master policy's first annual term.
    triggers: []
  - type: forceplaced_program_activated
    target: forceplaced_programs
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The master policy takes effect and placements may begin.
    grain: one row per program activation
    fields:
      program_effective_date: Date the master policy took effect.
    triggers: []
  - type: forceplaced_program_suspended
    target: forceplaced_programs
    mutation: {transition: {from: active, to: suspended}}
    meaning: New placements are suspended because a statement is past due beyond the threshold.
    grain: one row per suspension
    fields:
      oldest_unpaid_due_date: Due date of the oldest unpaid statement that triggered the suspension.
    triggers: []
  - type: forceplaced_program_reinstated
    target: forceplaced_programs
    mutation: {transition: {from: suspended, to: active}}
    meaning: All past-due statements are paid and placements resume.
    grain: one row per reinstatement
    fields:
      oldest_unpaid_due_date: Cleared once nothing is past due.
    triggers: []
  - type: forceplaced_program_terminated
    target: forceplaced_programs
    mutation: {transition: [{from: active, to: terminated}, {from: suspended, to: terminated}]}
    meaning: The lender's signed termination notice takes effect; no new certificates are issued.
    grain: one row per program termination
    fields:
      closed_date: Date the termination took effect.
    triggers: []
  - type: forceplaced_notice_mailed
    target: forceplaced_tracking
    meaning: A borrower notice is mailed on the lender's behalf — the first notice that flood coverage is missing or insufficient, the reminder before placement, or a certificate renewal notice.
    grain: one row per notice mailed for a loan
    distinguish_by: [loan_number, notice_type, notice_date]
    fields:
      loan_number: Lender's loan number.
      certificate_number: Certificate a renewal notice concerns; empty otherwise.
      notice_type: Kind of notice.
      notice_date: Date mailed.
      lapse_date: Date the borrower's coverage lapsed or became insufficient, as tracked.
      required_amount: Mandatory purchase amount stated in the notice.
    triggers: []
  - type: forceplaced_evidence_received
    target: forceplaced_tracking
    meaning: Evidence of the borrower's own flood policy is received from the borrower, the borrower's agent or carrier, and reviewed.
    grain: one row per evidence document received for a loan
    distinguish_by: [loan_number, evidence_policy_number, received_date]
    fields:
      loan_number: Lender's loan number.
      certificate_number: Certificate the evidence concerns; empty when none was issued yet.
      received_date: Date the evidence was received.
      evidence_type: Kind of borrower policy shown.
      evidence_carrier: Carrier shown.
      evidence_policy_number: Policy number shown.
      evidence_building_limit: Building limit shown.
      evidence_effective_date: Effective date shown.
      evidence_expiration_date: Expiration date shown.
      evidence_mortgagee_named: Whether the lender is named as mortgagee.
      evidence_acceptable: Whether the evidence meets the acceptance rule.
    triggers:
      - event: forceplaced:forceplaced_certificate_cancelled
        when: {evidence_acceptable: true}
        map: {loan_number: loan_number, certificate_number: certificate_number, cancellation_reason: BORROWER_COVERAGE_CONFIRMED}
  - type: forceplaced_certificate_issued
    target: forceplaced_certificates
    meaning: A certificate of lender-placed flood coverage is issued on one loan and building under the master policy.
    grain: one row per certificate issued
    distinguish_by: [certificate_number]
    fields:
      certificate_number: Certificate number.
      loan_number: Lender's loan number.
      borrower_name: Borrower named on the certificate.
      property_address: Address of the building.
      flood_zone: Flood zone on the Standard Flood Hazard Determination Form.
      outstanding_principal_balance: Unpaid principal balance reported by the lender.
      insurable_value: Building replacement cost value reported by the lender.
      borrower_existing_limit: Building limit of the borrower's own policy in force (gap tier); 0 otherwise.
      required_amount: Mandatory purchase amount for the loan.
      building_limit: Certificate building limit.
      secured_contents_value: Value of business contents securing the loan, reported by the lender; 0 when contents do not secure the loan.
      contents_limit: Certificate contents limit.
      lapse_date: Date the borrower's coverage lapsed or became insufficient.
      coverage_effective_date: Date the certificate coverage starts.
      certificate_expiration_date: Date the certificate expires.
      annual_premium: Annual certificate premium.
      event_date: Date issued.
    triggers:
      - event: forceplaced:forceplaced_premium_charged
        map: {certificate_number: certificate_number, charge_basis: NEW_PLACEMENT, amount: annual_premium}
  - type: forceplaced_certificate_renewed
    target: forceplaced_certificates
    meaning: A certificate with no acceptable borrower evidence renews for another term.
    grain: one row per certificate renewal
    distinguish_by: [certificate_number, coverage_effective_date]
    fields:
      certificate_number: Certificate renewed.
      loan_number: Loan.
      outstanding_principal_balance: Unpaid principal balance at renewal.
      insurable_value: Replacement cost value at renewal.
      required_amount: Mandatory purchase amount at renewal.
      building_limit: Building limit for the renewed term.
      contents_limit: Contents limit for the renewed term.
      coverage_effective_date: Start of the renewed term.
      certificate_expiration_date: End of the renewed term.
      annual_premium: Premium for the renewed term.
      event_date: Date renewed.
    triggers:
      - event: forceplaced:forceplaced_premium_charged
        map: {certificate_number: certificate_number, charge_basis: RENEWAL, amount: annual_premium}
  - type: forceplaced_certificate_cancelled
    target: forceplaced_certificates
    meaning: A certificate ends before its expiration — the borrower's coverage is confirmed, the loan is paid off or transferred, or the building leaves the Special Flood Hazard Area.
    grain: one row per certificate cancelled
    distinguish_by: [certificate_number, cancellation_reason]
    fields:
      certificate_number: Certificate cancelled.
      loan_number: Loan.
      cancellation_reason: Why it ended.
      cancellation_effective_date: Date coverage ends (the certificate start for a flat cancellation).
      event_date: Date processed.
    triggers:
      - event: forceplaced:forceplaced_premium_credit
        map: {certificate_number: certificate_number}
  - type: forceplaced_premium_charged
    target: forceplaced_billing
    meaning: A certificate premium is billed to the lender on its monthly statement.
    grain: one row per certificate premium per term
    distinguish_by: [certificate_number, charge_basis, statement_month]
    fields:
      certificate_number: Certificate billed.
      statement_month: Statement the charge appears on.
      charge_basis: NEW_PLACEMENT or RENEWAL.
      amount: Premium billed, positive.
      posted_date: Date billed.
    account: premium_balance
    direction: in
    triggers: []
  - type: forceplaced_lender_payment
    target: forceplaced_billing
    meaning: The lender remits payment against a monthly statement.
    grain: one row per remittance
    distinguish_by: [payment_ref]
    fields:
      statement_month: Statement paid.
      amount: Amount remitted, positive.
      posted_date: Date received.
      payment_ref: Wire or ACH reference.
    account: premium_balance
    direction: out
    triggers: []
  - type: forceplaced_premium_credit
    target: forceplaced_billing
    meaning: Unearned certificate premium is credited to the lender's account on a cancellation.
    grain: one row per certificate credit
    distinguish_by: [certificate_number, charge_basis, statement_month]
    fields:
      certificate_number: Certificate credited.
      statement_month: Statement the credit appears on.
      charge_basis: FLAT_CANCEL or PRO_RATA_CANCEL.
      amount: Credit, positive.
      posted_date: Date booked.
      reference_id: The cancellation entry the credit belongs to.
    account: premium_balance
    direction: out
    triggers: []
  - type: forceplaced_refund_disbursed
    target: forceplaced_billing
    meaning: A credit balance on the lender's program account is paid back to the lender.
    grain: one row per refund issued
    distinguish_by: [payment_ref]
    fields:
      statement_month: Statement whose credit balance is refunded.
      amount: Refund, positive.
      posted_date: Date issued.
      payment_ref: Refund wire or ACH reference.
    account: premium_balance
    direction: in
    triggers: []
  - type: forceplaced_claim_reported
    target: forceplaced_claims
    meaning: A flood loss to a building under a certificate is reported.
    grain: one row per claim
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      certificate_number: Certificate claimed under.
      date_of_loss: Date of the flood.
      event_date: Date reported.
    triggers: []
  - type: forceplaced_adjuster_report
    target: forceplaced_claims
    meaning: The adjuster reports the measured loss.
    grain: one row per report
    distinguish_by: [claim_number, report_type, event_date]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      report_type: Kind of report.
      event_date: Date filed.
      building_rcv_loss: Building loss at replacement cost.
      building_acv_loss: Building loss at actual cash value.
      contents_acv_loss: Contents loss at actual cash value.
    triggers: []
  - type: forceplaced_claim_paid
    target: forceplaced_claims
    meaning: A certificate claim payment is issued.
    grain: one row per payment item
    distinguish_by: [claim_number, coverage_part, payment_ref]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      coverage_part: Coverage paid.
      payment_amount: Amount, positive.
      payment_ref: Check or ACH reference.
      payee: Payee line.
      event_date: Date issued.
    account: claim_paid
    direction: in
    triggers: []
  - type: forceplaced_claim_payment_voided
    target: forceplaced_claims
    meaning: An issued certificate claim payment is voided.
    grain: one row per item voided
    distinguish_by: [payment_ref]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      coverage_part: Coverage.
      payment_amount: Amount voided, positive.
      payment_ref: Reference voided.
      event_date: Date voided.
    account: claim_paid
    direction: out
    triggers: []
  - type: forceplaced_claim_denied
    target: forceplaced_claims
    meaning: Tidemark denies a certificate claim coverage in writing.
    grain: one row per denial per coverage
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim.
      certificate_number: Certificate.
      coverage_part: Coverage denied.
      denial_reason: Reason.
      event_date: Date of denial.
    triggers: []

measures:
  - id: forceplaced_msr_certificate_paid
    window: The whole life of one certificate_number.
    measure: Sum of payment_amount on forceplaced_claim_paid rows minus sum of payment_amount on forceplaced_claim_payment_voided rows for that certificate_number.
  - id: forceplaced_msr_claim_part_paid
    window: The whole life of one claim_number, for one coverage_part.
    measure: Sum of payment_amount on forceplaced_claim_paid rows minus sum of payment_amount on forceplaced_claim_payment_voided rows for that claim_number and coverage_part.

policies:
  - id: forceplaced_agg_multi_holding
    subject: [forceplaced_program_enrolled]
    rule: >-
      A lender or servicer may hold several master programs, but only one program per tier: a program is enrolled only
      when the lender has no other program of the same tier in status enrolled, active or suspended. All certificates a
      lender places on loans of one occupancy class and coverage method sit under that tier's program, and each program
      has its own master policy number, account and monthly statement.
    eligibility:
      - id: one_program_per_tier
        applies_to: [forceplaced_program_enrolled]
        kind: dedup
        condition: 'A lender or servicer may hold several master programs, but only one program per tier: a program is enrolled only when the lender has no other program of the same tier in status enrolled, active or suspended.'
        evidence_fields: [forceplaced_programs.customer_id, forceplaced_programs.variant_name, forceplaced_programs.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.customer_id, forceplaced_programs.variant_name]
          action_bindings:
            forceplaced_programs.customer_id: customer_id
            forceplaced_programs.variant_name: variant_name
        dedup_contract:
          table: forceplaced_programs
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [enrolled, active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: forceplaced_agg_program_account
    subject: [forceplaced_premium_charged, forceplaced_lender_payment, forceplaced_premium_credit, forceplaced_refund_disbursed, forceplaced_program_suspended, forceplaced_program_reinstated]
    rule: >-
      Every certificate premium and credit of a program posts to that program's single account and appears on the
      statement for the calendar month in which it is posted (statement_month YYYY-MM); the statement_cycle is monthly,
      the statement is dated the first day of the following month, and it is due statement_due_days calendar days after
      its date. Lender payments are applied to the oldest open statement first. New placements are suspended only when
      the oldest unpaid statement is more than suspension_past_due_days calendar days past its due date, counted by
      adding the days to that due date on the calendar, the day itself not qualifying. While suspended, certificates
      already issued stay in force and renew, credits keep posting, and claims are paid. When reinstate_on_cure is true,
      placements resume once every past-due statement is paid. A credit balance on the account is refunded to the lender
      on its request or at termination.
    eligibility:
      - id: suspension_threshold
        applies_to: [forceplaced_program_suspended]
        kind: time
        condition: New placements are suspended only when the oldest unpaid statement is more than suspension_past_due_days calendar days past its due date, counted by adding the days to that due date on the calendar, the day itself not qualifying.
        evidence_fields: [forceplaced_programs.oldest_unpaid_due_date, forceplaced_programs.forceplaced_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.forceplaced_program_id]
          action_bindings:
            forceplaced_programs.forceplaced_program_id: forceplaced_program_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the oldest unpaid statement
          anchor_source: forceplaced_programs.oldest_unpaid_due_date
          relation: not_before
          duration_source: variants.suspension_past_due_days
          unit: calendar_days
          counting_rule: counted by adding the days to that due date on the calendar, the day itself not qualifying
          boundary: exclusive
  - id: forceplaced_notice_and_placement
    subject: [forceplaced_notice_mailed, forceplaced_certificate_issued]
    rule: >-
      Tidemark tracks the lender's loans and mails borrower notices on the lender's behalf when tracking_included is
      true. When the Standard Flood Hazard Determination Form (determination_form) shows the building in a Special Flood
      Hazard Area and the borrower's flood coverage has lapsed or is below the mandatory purchase amount, a FIRST_NOTICE
      is mailed to the borrower stating the required amount; a SECOND_NOTICE is mailed second_notice_days_before_placement
      calendar days before the earliest placement date. A certificate is issued only after more than
      borrower_notice_days calendar days have passed since the first notice is mailed, counted by adding the days to the
      notice date on the calendar, the last day of the notice period not qualifying. A certificate is issued only under
      a program whose status is active. When sfha_only_placement is true no certificate is placed on a building outside a
      Special Flood Hazard Area. No certificate is issued when acceptable borrower evidence was received before
      placement, and no more than max_certificates_per_loan certificate may be in force on one loan. A borrower and
      lender who dispute the determination may jointly ask FEMA for a Letter of Determination Review within
      determination_review_days calendar days of the borrower's notification; the request does not stop placement, and a
      FEMA decision removing the building from the area is handled under the loan-event cancellation rule.
    eligibility:
      - id: forty_five_day_notice
        applies_to: [forceplaced_certificate_issued]
        kind: time
        condition: A certificate is issued only after more than borrower_notice_days calendar days have passed since the first notice is mailed, counted by adding the days to the notice date on the calendar, the last day of the notice period not qualifying.
        evidence_fields: [forceplaced_tracking.notice_date, forceplaced_tracking.notice_type, forceplaced_tracking.loan_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_tracking.loan_number]
          action_bindings:
            forceplaced_tracking.loan_number: loan_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the first notice is mailed
          anchor_source: forceplaced_tracking.notice_date
          relation: not_before
          duration_source: variants.borrower_notice_days
          unit: calendar_days
          counting_rule: counted by adding the days to the notice date on the calendar, the last day of the notice period not qualifying
          boundary: exclusive
      - id: program_active
        applies_to: [forceplaced_certificate_issued]
        kind: state
        condition: A certificate is issued only under a program whose status is active.
        evidence_fields: [forceplaced_programs.status, forceplaced_programs.forceplaced_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.forceplaced_program_id]
          action_bindings:
            forceplaced_programs.forceplaced_program_id: forceplaced_program_id
        state_contract:
          field: forceplaced_programs.status
          allowed: [active]
  - id: forceplaced_coverage_amount
    subject: [forceplaced_certificate_issued, forceplaced_certificate_renewed]
    rule: >-
      The mandatory purchase amount (required_amount) is the lowest of the loan's outstanding principal balance, the
      tier's nfip_max_building_reference and the building's insurable value. Under MANDATORY_MINIMUM the building limit
      is the required amount; under GAP_TO_MANDATORY it is the required amount less the building limit of the borrower's
      own policy in force; under REPLACEMENT_COST it is the insurable value. In every method the limit is rounded up to
      the next limit_rounding_increment and capped at max_certificate_building_limit, and when the result is below
      min_certificate_building_limit no certificate is issued. A contents limit is placed only when contents_available
      is true and business contents secure the loan, equal to the secured contents value capped at
      max_certificate_contents_limit. The amount is recomputed from the balances reported at each renewal.
    eligibility: []
    params:
      per_tier:
        Lender-Placed Flood – Residential Mandatory Amount: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Residential Gap: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Residential Replacement Cost: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Manufactured Home: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Commercial Building: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
        Lender-Placed Flood – Commercial Building and Contents: {coverage_amount_method: =coverage_amount_method, nfip_max_building_reference: =nfip_max_building_reference, max_certificate_building_limit: =max_certificate_building_limit}
    formula:
      required_amount: min(outstanding_principal_balance, nfip_max_building_reference, insurable_value)
      raw_limit: required_amount if coverage_amount_method == "MANDATORY_MINIMUM" else (required_amount - borrower_existing_limit if coverage_amount_method == "GAP_TO_MANDATORY" else insurable_value)
      contents_limit: min(secured_contents_value, max_certificate_contents_limit) if contents_available else 0
  - id: forceplaced_effective_date_premium
    subject: [forceplaced_certificate_issued, forceplaced_certificate_renewed, forceplaced_premium_charged]
    rule: >-
      When backdate_to_lapse_allowed is true and the first notice on the loan was mailed no later than
      auto_coverage_reporting_days calendar days after the lapse date, the certificate starts on the lapse date, so the
      lender may charge the borrower from the date coverage lapsed or became insufficient; otherwise it starts on the
      date it is issued. A certificate runs certificate_term_months calendar months from its start. The annual premium
      is the building limit divided by 100 times building_rate_per_100 plus the contents limit divided by 100 times
      contents_rate_per_100, rounded to the cent, and never less than minimum_certificate_premium; the full annual
      premium is billed to the lender on the statement for the month the certificate is issued or renewed.
    eligibility: []
    formula:
      annual_premium: max(minimum_certificate_premium, round(building_limit / 100 * building_rate_per_100 + contents_limit / 100 * contents_rate_per_100, 2))
  - id: forceplaced_evidence_cancellation
    subject: [forceplaced_evidence_received, forceplaced_certificate_cancelled, forceplaced_premium_credit]
    rule: >-
      Borrower evidence is acceptable only when it shows a flood policy — an NFIP policy, or a private policy carrying the
      private flood compliance aid statement or otherwise accepted in writing by the lender — on the same building, with
      a building limit at least the required amount, in force on the date reviewed, and naming the lender as mortgagee
      when evidence_requires_mortgagee_clause is true. Evidence that fails any of these leaves the certificate in force.
      On acceptable evidence the certificate is cancelled for BORROWER_COVERAGE_CONFIRMED, and the cancellation and its
      credit are processed no later than overlap_refund_days calendar days after the evidence is received, counted by
      adding the days to the received date on the calendar with the last day qualifying. When
      flat_cancel_when_evidence_covers_inception is true and the borrower's policy was in force on the certificate's
      start date, the cancellation is FLAT_CANCEL effective on that start date and the whole certificate premium is
      credited; otherwise it is PRO_RATA_CANCEL effective on the borrower policy's effective date and the credit is the
      annual premium multiplied by the days from that date to the certificate expiration date divided by the days in the
      certificate term, rounded to the cent. This overlap credit is due even when a claim was paid on the certificate.
      The lender must refund to the borrower any premium it charged for the overlap period.
    eligibility:
      - id: overlap_refund_deadline
        applies_to: [forceplaced_certificate_cancelled]
        kind: time
        condition: On acceptable evidence the certificate is cancelled for BORROWER_COVERAGE_CONFIRMED, and the cancellation and its credit are processed no later than overlap_refund_days calendar days after the evidence is received, counted by adding the days to the received date on the calendar with the last day qualifying.
        evidence_fields: [forceplaced_tracking.received_date, forceplaced_tracking.evidence_policy_number, forceplaced_tracking.loan_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_tracking.loan_number, forceplaced_tracking.evidence_policy_number]
          action_bindings:
            forceplaced_tracking.loan_number: loan_number
            forceplaced_tracking.evidence_policy_number: evidence_policy_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the evidence is received
          anchor_source: forceplaced_tracking.received_date
          relation: not_after
          duration_source: variants.overlap_refund_days
          unit: calendar_days
          counting_rule: counted by adding the days to the received date on the calendar with the last day qualifying
          boundary: inclusive
    formula:
      overlap_days: certificate_expiration_date - evidence_effective_date
      term_days: certificate_expiration_date - coverage_effective_date
      pro_rata_credit: round(annual_premium * overlap_days / term_days, 2)
  - id: forceplaced_loan_event_cancellation
    subject: [forceplaced_certificate_cancelled, forceplaced_premium_credit]
    rule: >-
      A certificate is also cancelled when the lender reports that the loan was paid off (LOAN_PAID_OFF, effective on the
      payoff date), that servicing moved to another servicer (SERVICING_TRANSFERRED, effective on the transfer date), or
      that a FEMA Letter of Map Amendment or Revision removed the building from the Special Flood Hazard Area
      (REMOVED_FROM_SFHA, effective on the letter's effective date). Each uses its tier's refund method, PRO_RATA: the
      credit is the annual premium multiplied by the days from the cancellation effective date to the certificate
      expiration date divided by the days in the certificate term, rounded to the cent. When no_credit_after_paid_claim
      is true and a claim on the certificate has a net payment above zero (forceplaced_msr_certificate_paid above zero),
      no credit is given for these three reasons.
    eligibility: []
    measures: [forceplaced_msr_certificate_paid]
  - id: forceplaced_renewal
    subject: [forceplaced_certificate_renewed, forceplaced_notice_mailed]
    rule: >-
      A RENEWAL_NOTICE is mailed to the borrower renewal_notice_days calendar days before a certificate expires. The
      certificate renews on its expiration date for another certificate_term_months when no acceptable borrower evidence
      has been received by then and the loan is still serviced by the lender with the building in a Special Flood
      Hazard Area; the limit and premium are recomputed from the balances reported at renewal. A certificate whose
      program is terminated does not renew.
    eligibility: []
  - id: forceplaced_program_termination
    subject: [forceplaced_program_terminated, forceplaced_program_activated, forceplaced_program_enrolled]
    rule: >-
      A program is set up on the lender's signed master policy application and takes effect on its program effective
      date. A lender ends a program only by a signed termination notice on file, taking effect no earlier than
      program_termination_notice_days calendar days after Tidemark receives it, and only on a program whose status is
      active or suspended. After termination no new certificate is issued; when runoff_certificates_honored is true the
      certificates already issued stay in force to their expiration and do not renew, and their credits and claims are
      still handled. Any credit balance remaining when the last certificate ends is refunded to the lender.
    eligibility:
      - id: signed_termination_on_file
        applies_to: [forceplaced_program_terminated]
        kind: authorization
        condition: A lender ends a program only by a signed termination notice on file, taking effect no earlier than program_termination_notice_days calendar days after Tidemark receives it, and only on a program whose status is active or suspended.
        evidence_fields: [forceplaced_requests.forceplaced_request_id, forceplaced_requests.outcome, forceplaced_requests.requested_effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_requests.forceplaced_request_id]
          action_bindings:
            forceplaced_requests.forceplaced_request_id: forceplaced_request_id
      - id: terminable_status
        applies_to: [forceplaced_program_terminated]
        kind: state
        condition: A lender ends a program only by a signed termination notice on file, taking effect no earlier than program_termination_notice_days calendar days after Tidemark receives it, and only on a program whose status is active or suspended.
        evidence_fields: [forceplaced_programs.status, forceplaced_programs.forceplaced_program_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [forceplaced_programs.forceplaced_program_id]
          action_bindings:
            forceplaced_programs.forceplaced_program_id: forceplaced_program_id
        state_contract:
          field: forceplaced_programs.status
          allowed: [active, suspended, terminated]
  - id: forceplaced_claims
    subject: [forceplaced_claim_reported, forceplaced_adjuster_report, forceplaced_claim_paid, forceplaced_claim_payment_voided, forceplaced_claim_denied]
    rule: >-
      A claim is covered only when the date of loss falls on or after the certificate's coverage effective date and
      before its expiration or cancellation effective date. The adjuster contacts the borrower within
      adjuster_contact_hours elapsed hours, and the proof of loss is due within proof_of_loss_days calendar days of the
      date of loss. The building loss is taken at the tier's building_settlement_basis and the contents loss at actual
      cash value; each coverage bears its own deductible (building_deductible, contents_deductible) and is capped at the
      certificate limit. ICC, loss of use and basement contents are covered only as the tier's icc_coverage_limit,
      loss_of_use_covered and basement_contents_covered allow. A new payment on a coverage is the payable amount less
      what has been paid net of voids on that claim and coverage (forceplaced_msr_claim_part_paid), issued only when
      positive, payable to the claim_payee — the lender and the borrower jointly — and due within claim_payment_days
      calendar days of the agreed proof of loss. A denial states one denial_reason: NOT_A_FLOOD_EVENT,
      NO_COVERAGE_ON_DATE_OF_LOSS, PROOF_OF_LOSS_NOT_TIMELY, EXCLUDED_PROPERTY or LOSS_BELOW_DEDUCTIBLE.
    eligibility: []
    measures: [forceplaced_msr_claim_part_paid]
    formula:
      building_payable: min(building_limit, max(0, (building_rcv_loss if building_settlement_basis == "REPLACEMENT_COST" else building_acv_loss) - building_deductible))
      contents_payable: min(contents_limit, max(0, contents_acv_loss - contents_deductible))

extended_policies:
  - id: forceplaced_ext_placement_premium
    base_policy_refs: [forceplaced_notice_and_placement, forceplaced_coverage_amount, forceplaced_effective_date_premium, forceplaced_agg_program_account]
    overwrite:
      - base_policy: forceplaced_effective_date_premium
        superseded_clause: >-
          The annual premium is the building limit divided by 100 times building_rate_per_100 plus the contents limit
          divided by 100 times contents_rate_per_100, rounded to the cent, and never less than minimum_certificate_premium
        replaced_by: >-
          For a new placement on the loan named on the most recently mailed first notice of a program on the Residential
          Mandatory Amount tier, and only for such a placement, the annual premium is set by this residential placement
          schedule in place of the base premium formula; every renewal on that tier is priced by the residential renewal schedule and a placement on the loan named on the most recently mailed first notice of a program on the Commercial Building tier by the commercial placement schedule, and every other certificate premium remains the building limit divided by 100 times the tier's building rate per 100 plus the contents limit divided by 100 times the tier's contents rate per 100, rounded to the cent, and never less than the tier's minimum certificate premium.
      - base_policy: forceplaced_coverage_amount
        superseded_clause: >-
          The mandatory purchase amount (required_amount) is the lowest of the loan's outstanding principal balance, the
          tier's nfip_max_building_reference and the building's insurable value.
        replaced_by: >-
          For a placement this residential placement schedule prices, and only for such a placement, the mandatory purchase
          amount is the required amount stated on the loan's latest first notice, the figure Tidemark set there as the lowest
          of the principal balance the lender reported, the tier's NFIP maximum building reference and the insurable value;
          a placement under the commercial placement schedule follows that schedule's own first-notice rule, a
          renewal under the residential renewal schedule follows that schedule's renewal-notice rule, and for
          every other certificate the mandatory purchase amount remains the lowest of those three figures.
      - base_policy: forceplaced_notice_and_placement
        superseded_clause: >-
          No certificate is issued when acceptable borrower evidence was received before placement
        replaced_by: >-
          For a placement this residential placement schedule prices, and only for such a placement, acceptable borrower
          evidence bars the certificate only when it was received on or after the loan's latest first notice, evidence from
          an earlier lapse not counting; a placement under the commercial placement schedule follows that schedule's own
          reading, and for every other placement no certificate is issued when acceptable borrower evidence was received
          before placement.
    trigger: state_due
    subject: [forceplaced_certificate_issued, forceplaced_premium_charged]
    computes: annual_premium
    target_tool: issue_residential_certificate_c6c06832
    params:
      rate_large: 0.88
      rate_small: 1.05
      large_threshold: 200000
      small_threshold: 100000
      reo_high: 0.92
      reo_mid: 0.96
      reo_paid_high: 10000
      reo_paid_mid: 3000
      reo_tenure_high: 24
      reo_tenure_mid: 12
      exp_long: 36
      exp_short: 12
      exp_weight: 0.5
      exp_target: 0.40
      exp_floor: 0.85
      exp_cap: 1.25
      exp_claim_mod: 1.10
      exp_clean_mod: 0.97
      retro_long_days: 60
      retro_mid_days: 15
      retro_long: 1.10
      retro_mid: 1.04
      repeat_two: 1.10
      repeat_one: 1.05
      volume_high_count: 12
      volume_mid_count: 5
      volume_high: 0.95
      volume_mid: 0.98
    rule: >
      For a new placement on the loan named on the most recently mailed first notice of a program on the Residential
      Mandatory Amount tier, and only for such a placement, the annual premium is set by this residential placement
      schedule in place of the base premium formula; every renewal on that tier is priced by the residential renewal schedule and a placement on the loan named on the most recently mailed first notice of a program on the Commercial Building tier by the commercial placement schedule, and every other certificate premium remains the building limit divided by 100 times the tier's building rate per 100 plus the contents limit divided by 100 times the tier's contents rate per 100, rounded to the cent, and never less than the tier's minimum certificate premium.
      For a placement this residential placement schedule prices, and only for such a placement, the mandatory purchase
      amount is the required amount stated on the loan's latest first notice, the figure Tidemark set there as the lowest
      of the principal balance the lender reported, the tier's NFIP maximum building reference and the insurable value;
      a placement under the commercial placement schedule follows that schedule's own first-notice rule, a
      renewal under the residential renewal schedule follows that schedule's renewal-notice rule, and for every
      other certificate the mandatory purchase amount remains the lowest of those three figures.
      For a placement this residential placement schedule prices, and only for such a placement, acceptable borrower
      evidence bars the certificate only when it was received on or after the loan's latest first notice, evidence from
      an earlier lapse not counting; a placement under the commercial placement schedule follows that schedule's own
      reading, and for every other placement no certificate is issued when acceptable borrower evidence was received
      before placement.
      The placement is priced for the loan named on the first notice with the latest notice date among the program's
      first notices, and that loan's mandatory purchase amount is the required amount stated on that first notice.
      The building limit of a new placement is that mandatory purchase amount rounded up to the next multiple of the
      tier's limit rounding increment and capped at the tier's maximum certificate building limit.
      The rated amount of a new placement is its building limit divided by 100 times the rate per 100 for a new
      placement.
      The standard rate per 100 for a new placement is the tier's building rate per 100.
      The annual premium of a new placement is its rated amount rounded half to even to the cent, and never less than
      the tier's minimum certificate premium.
      Placement band rate: the rate per 100 for a new placement is 0.88 when the required amount on the loan's first
      notice is 200,000 dollars or more, 1.05 when it is below 100,000 dollars, and the standard rate per 100 for a new
      placement when it is at least 100,000 but below 200,000 dollars.
      Owned-property account factor for a new placement: the rated amount of a new placement is multiplied by 0.92
      when the premium payments the lender made in the last 12 months on its own NFIP Dwelling Form policies with
      Tidemark total 10,000 dollars or more and the program has been in force 24 months or more; by 0.96 when those
      payments total 3,000 dollars or more and the program has been in force 12 months or more, but the payments are
      below 10,000 dollars or the program has been in force fewer than 24 months; and by 1.00 in every other case.
      Placement experience modifier: the rated amount of a new placement is multiplied by a modifier worked out from
      the program's own claim experience. For a program in force 36 months or more, the modifier is 1 plus one half of
      the amount by which the program's 36-month placement loss ratio exceeds 0.40 (a ratio below 0.40 lowers it), kept
      no lower than 0.85 and no higher than 1.25; that loss ratio is the claim payments issued under the program's
      certificates in the last 36 months less the claim payments voided in those 36 months, divided by the lender
      payments the program received in those 36 months, and it is zero when no lender payment was received in that
      window. For a program in force at least 12 but fewer than 36 months, the modifier is 1.10 when any claim payment
      was issued under the program's certificates in the last 12 months and 0.97 when none was. For a program in force
      fewer than 12 months the modifier is 1.00.
      Retroactive-exposure load for a new placement: the rated amount of a new placement is multiplied by 1.10 when
      more than 60 days run from the lapse date to the notice date on the loan's first notice, by 1.04 when 15 to 60 days run from the lapse date to that notice date, and by 1.00 when fewer than 15 days run from the lapse date to that notice date or the notice is dated on or before the lapse date.
      Repeat-placement load for a new placement: the rated amount of a new placement is multiplied by 1.10 when two or
      more certificates were issued earlier under the program on the same loan number, by 1.05 when exactly one was,
      and by 1.00 when none was.
      Placement volume factor: the rated amount of a new placement is multiplied by 0.95 when 12 or more certificates
      were issued under the program in the last 12 months, by 0.98 when 5 to 11 were, and by 1.00 when fewer than 5
      were.
      Months in force for a new placement are the whole calendar months from the program effective date to
      today, a month counting only
      once its day of the month is reached; a window of the last N months covers every entry dated on a day from which
      fewer than N such whole months have passed by today; days between two dates are counted from the earlier date
      to the later date, the earlier date excluded and the later date included.
      When several first notices share the latest notice date, the one entered first in the program's records is
      used, and a program with no first notice has no placement for this schedule to price, the premium this schedule gives being zero.
    prerequisite: []
    cross_category:
      - category: dwelling
        as: history
        reads: [dwelling_billing.amount]
        note: The owned-property account factor reads the lender's own NFIP Dwelling Form premium payments over the last 12 months.
    compute:
      - fn_loan: "LATEST('forceplaced_tracking', 'loan_number', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE')"
      - fn_req: "LATEST('forceplaced_tracking', 'required_amount', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - bldg_limit: "0 if not fn_req else MN(P('max_certificate_building_limit'), -(-int(fn_req) // P('limit_rounding_increment')) * P('limit_rounding_increment'))"
      - band_req: "LATEST('forceplaced_tracking', 'required_amount', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - band_rate: "K('rate_large') if (band_req or 0) >= K('large_threshold') else (K('rate_small') if (band_req or 0) < K('small_threshold') else P('building_rate_per_100'))"
      - reo_paid: "XSUM('dwelling', 'dwelling_billing', 'amount', within_months=12, date_field='posted_date', event_type='dwelling_premium_payment')"
      - reo_tenure: "MONTHS(F('program_effective_date'), NOW)"
      - reo_factor: "K('reo_high') if reo_paid >= K('reo_paid_high') and reo_tenure >= K('reo_tenure_high') else (K('reo_mid') if reo_paid >= K('reo_paid_mid') and reo_tenure >= K('reo_tenure_mid') else 1.0)"
      - exp_tenure: "MONTHS(F('program_effective_date'), NOW)"
      - exp_claims: "SUM('forceplaced_claims', 'payment_amount', within_months=36, event_type='forceplaced_claim_paid') - SUM('forceplaced_claims', 'payment_amount', within_months=36, event_type='forceplaced_claim_payment_voided')"
      - exp_cash: "SUM('forceplaced_billing', 'amount', within_months=36, date_field='posted_date', event_type='forceplaced_lender_payment')"
      - exp_recent: "COUNT('forceplaced_claims', within_months=12, event_type='forceplaced_claim_paid')"
      - exp_mod: "MN(K('exp_cap'), MX(K('exp_floor'), 1 + K('exp_weight') * ((exp_claims / exp_cash if exp_cash > 0 else 0) - K('exp_target')))) if exp_tenure >= K('exp_long') else ((K('exp_claim_mod') if exp_recent > 0 else K('exp_clean_mod')) if exp_tenure >= K('exp_short') else 1.0)"
      - retro_lapse: "LATEST('forceplaced_tracking', 'lapse_date', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - retro_notice: "LATEST('forceplaced_tracking', 'notice_date', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - retro_mult: "1.0 if not retro_lapse or not retro_notice else (K('retro_long') if DAYS(retro_lapse, retro_notice) > K('retro_long_days') else (K('retro_mid') if DAYS(retro_lapse, retro_notice) >= K('retro_mid_days') else 1.0))"
      - repeat_count: "COUNT('forceplaced_certificates', event_type='forceplaced_certificate_issued', loan_number=fn_loan)"
      - repeat_mult: "K('repeat_two') if repeat_count >= 2 else (K('repeat_one') if repeat_count == 1 else 1.0)"
      - vol_count: "COUNT('forceplaced_certificates', within_months=12, event_type='forceplaced_certificate_issued')"
      - volume_mult: "K('volume_high') if vol_count >= K('volume_high_count') else (K('volume_mid') if vol_count >= K('volume_mid_count') else 1.0)"
      - rated: "bldg_limit / 100 * band_rate * reo_factor * exp_mod * retro_mult * repeat_mult * volume_mult"
      - result: "0 if not fn_loan else MX(P('minimum_certificate_premium'), RND(rated, 2))"
    compute_basis:
      fn_loan: "When several first notices share the latest notice date, the one entered first in the program's records is used, and a program with no first notice has no placement for this schedule to price, the premium this schedule gives being zero."
      fn_req: "The placement is priced for the loan named on the first notice with the latest notice date among the program's first notices, and that loan's mandatory purchase amount is the required amount stated on that first notice."
      bldg_limit: "The building limit of a new placement is that mandatory purchase amount rounded up to the next multiple of the tier's limit rounding increment and capped at the tier's maximum certificate building limit."
      band_req: "the rate per 100 for a new placement is 0.88 when the required amount on the loan's first notice is 200,000 dollars or more"
      band_rate: "Placement band rate: the rate per 100 for a new placement is 0.88 when the required amount on the loan's first notice is 200,000 dollars or more, 1.05 when it is below 100,000 dollars, and the standard rate per 100 for a new placement when it is at least 100,000 but below 200,000 dollars."
      reo_paid: "when the premium payments the lender made in the last 12 months on its own NFIP Dwelling Form policies with Tidemark total 10,000 dollars or more"
      reo_tenure: "Months in force for a new placement are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      reo_factor: "Owned-property account factor for a new placement: the rated amount of a new placement is multiplied by 0.92 when the premium payments the lender made in the last 12 months on its own NFIP Dwelling Form policies with Tidemark total 10,000 dollars or more and the program has been in force 24 months or more; by 0.96 when those payments total 3,000 dollars or more and the program has been in force 12 months or more, but the payments are below 10,000 dollars or the program has been in force fewer than 24 months; and by 1.00 in every other case."
      exp_tenure: "Months in force for a new placement are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      exp_claims: "that loss ratio is the claim payments issued under the program's certificates in the last 36 months less the claim payments voided in those 36 months"
      exp_cash: "divided by the lender payments the program received in those 36 months, and it is zero when no lender payment was received in that window."
      exp_recent: "the modifier is 1.10 when any claim payment was issued under the program's certificates in the last 12 months and 0.97 when none was."
      exp_mod: "For a program in force 36 months or more, the modifier is 1 plus one half of the amount by which the program's 36-month placement loss ratio exceeds 0.40 (a ratio below 0.40 lowers it), kept no lower than 0.85 and no higher than 1.25; that loss ratio is the claim payments issued under the program's certificates in the last 36 months less the claim payments voided in those 36 months, divided by the lender payments the program received in those 36 months, and it is zero when no lender payment was received in that window. For a program in force at least 12 but fewer than 36 months, the modifier is 1.10 when any claim payment was issued under the program's certificates in the last 12 months and 0.97 when none was. For a program in force fewer than 12 months the modifier is 1.00."
      retro_lapse: "the rated amount of a new placement is multiplied by 1.10 when more than 60 days run from the lapse date to the notice date on the loan's first notice"
      retro_notice: "the rated amount of a new placement is multiplied by 1.10 when more than 60 days run from the lapse date to the notice date on the loan's first notice"
      retro_mult: "Retroactive-exposure load for a new placement: the rated amount of a new placement is multiplied by 1.10 when more than 60 days run from the lapse date to the notice date on the loan's first notice, by 1.04 when 15 to 60 days run from the lapse date to that notice date, and by 1.00 when fewer than 15 days run from the lapse date to that notice date or the notice is dated on or before the lapse date."
      repeat_count: "when two or more certificates were issued earlier under the program on the same loan number"
      repeat_mult: "Repeat-placement load for a new placement: the rated amount of a new placement is multiplied by 1.10 when two or more certificates were issued earlier under the program on the same loan number, by 1.05 when exactly one was, and by 1.00 when none was."
      vol_count: "when 12 or more certificates were issued under the program in the last 12 months"
      volume_mult: "Placement volume factor: the rated amount of a new placement is multiplied by 0.95 when 12 or more certificates were issued under the program in the last 12 months, by 0.98 when 5 to 11 were, and by 1.00 when fewer than 5 were."
      rated: "The rated amount of a new placement is its building limit divided by 100 times the rate per 100 for a new placement."
      result: "The annual premium of a new placement is its rated amount rounded half to even to the cent, and never less than the tier's minimum certificate premium."
    factors:
      - id: band_rate
        effect: parameter
        decides: band_rate
        bindings: [band_req, band_rate]
        ladder:
          - {when: "the required amount on the loan's first notice is 200,000 dollars or more", value: "K('rate_large')"}
          - {when: "the required amount on the loan's first notice is below 100,000 dollars", value: "K('rate_small')"}
          - {when: "otherwise (at least 100,000 but below 200,000 dollars)", value: "P('building_rate_per_100')"}
        baseline: {band_rate: "P('building_rate_per_100')"}
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: reo_credit
        effect: parameter
        decides: reo_factor
        bindings: [reo_paid, reo_tenure, reo_factor]
        ladder:
          - {when: "own NFIP Dwelling Form premium payments in the last 12 months total 10,000 dollars or more AND the program has been in force 24 months or more", value: "K('reo_high')"}
          - {when: "those payments total 3,000 dollars or more AND the program has been in force 12 months or more, but not both of the first tier's conditions", value: "K('reo_mid')"}
          - {when: "otherwise", value: "1.0"}
        baseline: {reo_factor: "1.0"}
        evidence: [cross_category, date]
        cross_difficulty: dwelling
      - id: experience_mod
        effect: method
        decides: exp_mod
        bindings: [exp_tenure, exp_claims, exp_cash, exp_recent, exp_mod]
        ladder:
          - {when: "the program has been in force 36 months or more", method: "credibility formula: 1 + 0.5 x (36-month loss ratio - 0.40), kept within 0.85 and 1.25, the loss ratio being net claim payments over lender payments in the last 36 months"}
          - {when: "the program has been in force at least 12 but fewer than 36 months", method: "claim-count rule: 1.10 when any claim payment was issued in the last 12 months, 0.97 when none was"}
          - {when: "otherwise (fewer than 12 months)", method: "no modification: 1.00"}
        baseline: {exp_mod: "1.0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: retro_load
        effect: parameter
        decides: retro_mult
        bindings: [retro_lapse, retro_notice, retro_mult]
        ladder:
          - {when: "more than 60 days run from the lapse date to the first-notice date", value: "K('retro_long')"}
          - {when: "15 to 60 days run from the lapse date to the first-notice date", value: "K('retro_mid')"}
          - {when: "otherwise (fewer than 15 days, or the notice dated on or before the lapse date)", value: "1.0"}
        baseline: {retro_mult: "1.0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: repeat_load
        effect: parameter
        decides: repeat_mult
        bindings: [repeat_count, repeat_mult]
        ladder:
          - {when: "two or more certificates were issued earlier under the program on the same loan number", value: "K('repeat_two')"}
          - {when: "exactly one was", value: "K('repeat_one')"}
          - {when: "otherwise (none)", value: "1.0"}
        baseline: {repeat_mult: "1.0"}
        evidence: [history]
        cross_difficulty: null
      - id: volume_mod
        effect: parameter
        decides: volume_mult
        bindings: [vol_count, volume_mult]
        ladder:
          - {when: "12 or more certificates were issued under the program in the last 12 months", value: "K('volume_high')"}
          - {when: "5 to 11 were", value: "K('volume_mid')"}
          - {when: "otherwise (fewer than 5)", value: "1.0"}
        baseline: {volume_mult: "1.0"}
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The placement is priced for the loan named on the first notice with the latest notice date among the program's
        first notices, and that loan's mandatory purchase amount is the required amount stated on that first notice.
        The building limit of a new placement is that mandatory purchase amount rounded up to the next multiple of the
        tier's limit rounding increment and capped at the tier's maximum certificate building limit.
        The rated amount of a new placement is its building limit divided by 100 times the rate per 100 for a new
        placement.
        The standard rate per 100 for a new placement is the tier's building rate per 100.
        The annual premium of a new placement is its rated amount rounded half to even to the cent, and never less than
        the tier's minimum certificate premium.
      params: [building_rate_per_100, limit_rounding_increment, max_certificate_building_limit, minimum_certificate_premium]
    inputs:
      history:
        - {table: forceplaced_tracking, aggregate: latest, field: required_amount, filters: {event_type: forceplaced_notice_mailed, notice_type: FIRST_NOTICE}}
        - {table: forceplaced_claims, aggregate: sum, field: payment_amount, within_months: 36, filters: {event_type: forceplaced_claim_paid}}
        - {table: forceplaced_billing, aggregate: sum, field: amount, within_months: 36, filters: {event_type: forceplaced_lender_payment}}
        - {table: forceplaced_certificates, aggregate: count, field: certificate_number, within_months: 12, filters: {event_type: forceplaced_certificate_issued}}
        - {category: dwelling, table: dwelling_billing, aggregate: sum, field: amount, within_months: 12, filters: {event_type: dwelling_premium_payment}}
      cross_category: [dwelling]

  - id: forceplaced_ext_renewal_premium
    base_policy_refs: [forceplaced_coverage_amount, forceplaced_effective_date_premium, forceplaced_renewal, forceplaced_agg_program_account]
    overwrite:
      - base_policy: forceplaced_effective_date_premium
        superseded_clause: >-
          The annual premium is the building limit divided by 100 times building_rate_per_100 plus the contents limit
          divided by 100 times contents_rate_per_100, rounded to the cent, and never less than minimum_certificate_premium
        replaced_by: >-
          For every certificate that renews under a program on the Residential Mandatory Amount tier, and only for
          such renewals, the premium for the renewed term is the renewed building limit divided by 100 times the
          program renewal rate per 100 in effect on the renewal date, rounded to the cent and never less than the
          tier's minimum certificate premium; a new placement on the loan named on the most recently mailed first notice of a program on the Residential Mandatory Amount or the Commercial Building tier is priced by that tier's placement schedule, and every other certificate premium remains the
          building limit divided by 100 times the tier's building rate per 100 plus the contents limit divided by 100
          times the tier's contents rate per 100, rounded to the cent, and never less than the tier's minimum
          certificate premium.
      - base_policy: forceplaced_coverage_amount
        superseded_clause: >-
          The amount is recomputed from the balances reported at each renewal.
        replaced_by: >-
          For a renewal on the Residential Mandatory Amount tier, and only for such a renewal, the mandatory purchase
          amount for the renewed term is the required amount stated on the certificate's renewal notice, the figure
          Tidemark recomputed there from the balances the lender reported for the renewal, or, with no renewal notice
          on file, the required amount on its latest issue or renewal entry; a placement under the residential or the
          commercial placement schedule takes its amount from the loan's latest first notice under that schedule, and
          at the renewal of every other certificate the amount is recomputed from the balances reported at that
          renewal.
      - base_policy: forceplaced_renewal
        superseded_clause: >-
          the limit and premium are recomputed from the balances reported at renewal
        replaced_by: >-
          For a renewal on the Residential Mandatory Amount tier, and only for such a renewal, the renewed building
          limit and the premium for the renewed term are figured by this residential renewal schedule from the
          mandatory purchase amount it sets for the renewed term; at the renewal of every other certificate the limit
          and premium are recomputed from the balances reported at renewal.
    trigger: state_due
    subject: [forceplaced_certificate_renewed, forceplaced_premium_charged]
    computes: renewal_rate_per_100
    target_tool: renew_certificate_c91c4d46
    params:
      exp_long: 36
      exp_short: 12
      exp_weight: 0.5
      exp_target: 0.40
      exp_floor: 0.85
      exp_cap: 1.25
      exp_claim_mod: 1.10
      exp_clean_mod: 0.97
      reo_high: 0.92
      reo_mid: 0.96
      reo_paid_high: 10000
      reo_paid_mid: 3000
      reo_tenure_high: 24
      reo_tenure_mid: 12
      tenure_long: 60
      tenure_mid: 24
      tenure_long_mod: 0.95
      tenure_mid_mod: 0.98
      freq_high_count: 5
      freq_high: 1.08
      freq_low: 1.04
      coastal_high_count: 3
      coastal_high: 1.10
      coastal_low: 1.05
      pay_high_count: 10
      pay_mid_count: 6
      pay_high: 0.98
      pay_mid: 0.99
    rule: >
      For every certificate that renews under a program on the Residential Mandatory Amount tier, and only for
      such renewals, the premium for the renewed term is the renewed building limit divided by 100 times the
      program renewal rate per 100 in effect on the renewal date, rounded to the cent and never less than the
      tier's minimum certificate premium; a new placement on the loan named on the most recently mailed first notice of a program on the Residential Mandatory Amount or the Commercial Building tier is priced by that tier's placement schedule, and every other certificate premium remains the
      building limit divided by 100 times the tier's building rate per 100 plus the contents limit divided by 100
      times the tier's contents rate per 100, rounded to the cent, and never less than the tier's minimum
      certificate premium.
      For a renewal on the Residential Mandatory Amount tier, and only for such a renewal, the mandatory purchase
      amount for the renewed term is the required amount stated on the certificate's renewal notice, the figure
      Tidemark recomputed there from the balances the lender reported for the renewal, or, with no renewal notice
      on file, the required amount on its latest issue or renewal entry; a placement under the residential or the
      commercial placement schedule takes its amount from the loan's latest first notice under that schedule, and
      at the renewal of every other certificate the amount is recomputed from the balances reported at that
      renewal.
      For a renewal on the Residential Mandatory Amount tier, and only for such a renewal, the renewed building
      limit and the premium for the renewed term are figured by this residential renewal schedule from the
      mandatory purchase amount it sets for the renewed term; at the renewal of every other certificate the limit
      and premium are recomputed from the balances reported at renewal.
      Every certificate of the program whose current term expires today renews today, unless it carries a cancellation entry (among them the entry for a loan paid off, a servicing transfer or a building removed from the Special Flood Hazard Area, the record that the loan is no longer serviced by the lender with the building in that area), acceptable borrower evidence has been received for it, or the program is terminated (its run-off certificates stay in force to their expiration and do not renew), and all renewals booked on one day take the same program renewal rate per 100.
      The renewed building limit is the mandatory purchase amount for the renewed term rounded up to the next
      multiple of the tier's limit rounding increment and capped at the tier's maximum certificate building limit.
      The program renewal rate per 100 starts from the standard renewal rate per 100 and is rounded half to even
      to 4 decimal places as the last step of the figure.
      The standard renewal rate per 100 is the tier's building rate per 100.
      Renewal experience modifier: the program renewal rate per 100 is multiplied by a modifier worked out from the
      program's own claim experience. For a program in force 36 months or more, the modifier is 1 plus one half of
      the amount by which the program's 36-month renewal loss ratio exceeds 0.40 (a ratio below 0.40 lowers it),
      kept no lower than 0.85 and no higher than 1.25; that ratio is the claim payments issued under the program's
      certificates in the last 36 months less the claim payments voided in those 36 months, divided by the lender
      payments the program received in those 36 months, and it is zero when no lender payment was received in that
      window. For a program in force at least 12 but fewer than 36 months, the modifier is 1.10 when any claim
      payment was issued under the program's certificates in the last 12 months and 0.97 when none was. For a
      program in force fewer than 12 months the modifier is 1.00.
      Owned-property account factor for a renewal: the program renewal rate per 100 is multiplied by 0.92 when the
      premium payments the lender made in the last 12 months on its own NFIP Dwelling Form policies with Tidemark
      total 10,000 dollars or more and the program has been in force 24 months or more; by 0.96 when those
      payments total 3,000 dollars or more and the program has been in force 12 months or more, but the payments are
      below 10,000 dollars or the program has been in force fewer than 24 months; and by 1.00 in every other case.
      Program tenure factor: the program renewal rate per 100 is multiplied by 0.95 when the program has been in
      force 60 months or more, by 0.98 when it has been in force at least 24 but fewer than 60 months, and by 1.00
      when it has been in force fewer than 24 months.
      Claim frequency load: the program renewal rate per 100 is multiplied by 1.08 when 5 or more claims were reported under the program's certificates in the last 12 months, each claim counted once by its first notice of loss, by 1.04 when 1 to 4 were, and by 1.00 when none was.
      Coastal concentration load: the program renewal rate per 100 is multiplied by 1.10 when 3 or more
      certificates on buildings in flood zone V or VE were issued under the program in the last 36 months, by 1.05
      when 1 or 2 were, and by 1.00 when none was.
      Lender payment record credit: the program renewal rate per 100 is multiplied by 0.98 when the program received
      10 or more lender payments in the last 12 months, by 0.99 when it received 6 to 9, and by 1.00 when it
      received fewer than 6.
      Months in force for a renewal are the whole calendar months from the program effective date to today, a month
      counting only once its day of the month is reached, and a renewal window of the last N months covers every entry
      dated on a day from which fewer than N such whole months have passed by today.
    prerequisite: []
    cross_category:
      - category: dwelling
        as: history
        reads: [dwelling_billing.amount]
        note: The owned-property account factor for a renewal reads the lender's own NFIP Dwelling Form premium payments over the last 12 months.
    compute:
      - std_rate: "P('building_rate_per_100')"
      - rx_tenure: "MONTHS(F('program_effective_date'), NOW)"
      - rx_claims: "SUM('forceplaced_claims', 'payment_amount', within_months=36, event_type='forceplaced_claim_paid') - SUM('forceplaced_claims', 'payment_amount', within_months=36, event_type='forceplaced_claim_payment_voided')"
      - rx_cash: "SUM('forceplaced_billing', 'amount', within_months=36, date_field='posted_date', event_type='forceplaced_lender_payment')"
      - rx_recent: "COUNT('forceplaced_claims', within_months=12, event_type='forceplaced_claim_paid')"
      - rx_mod: "MN(K('exp_cap'), MX(K('exp_floor'), 1 + K('exp_weight') * ((rx_claims / rx_cash if rx_cash > 0 else 0) - K('exp_target')))) if rx_tenure >= K('exp_long') else ((K('exp_claim_mod') if rx_recent > 0 else K('exp_clean_mod')) if rx_tenure >= K('exp_short') else 1.0)"
      - ro_paid: "XSUM('dwelling', 'dwelling_billing', 'amount', within_months=12, date_field='posted_date', event_type='dwelling_premium_payment')"
      - ro_tenure: "MONTHS(F('program_effective_date'), NOW)"
      - ro_factor: "K('reo_high') if ro_paid >= K('reo_paid_high') and ro_tenure >= K('reo_tenure_high') else (K('reo_mid') if ro_paid >= K('reo_paid_mid') and ro_tenure >= K('reo_tenure_mid') else 1.0)"
      - pt_months: "MONTHS(F('program_effective_date'), NOW)"
      - pt_mod: "K('tenure_long_mod') if pt_months >= K('tenure_long') else (K('tenure_mid_mod') if pt_months >= K('tenure_mid') else 1.0)"
      - cf_count: "COUNT('forceplaced_claims', within_months=12, event_type='forceplaced_claim_reported')"
      - cf_mod: "K('freq_high') if cf_count >= K('freq_high_count') else (K('freq_low') if cf_count >= 1 else 1.0)"
      - cc_count: "COUNT('forceplaced_certificates', within_months=36, event_type='forceplaced_certificate_issued', flood_zone='VE') + COUNT('forceplaced_certificates', within_months=36, event_type='forceplaced_certificate_issued', flood_zone='V')"
      - cc_mod: "K('coastal_high') if cc_count >= K('coastal_high_count') else (K('coastal_low') if cc_count >= 1 else 1.0)"
      - pr_count: "COUNT('forceplaced_billing', within_months=12, date_field='posted_date', event_type='forceplaced_lender_payment')"
      - pr_mod: "K('pay_high') if pr_count >= K('pay_high_count') else (K('pay_mid') if pr_count >= K('pay_mid_count') else 1.0)"
      - result: "RND(std_rate * rx_mod * ro_factor * pt_mod * cf_mod * cc_mod * pr_mod, 4)"
    compute_basis:
      std_rate: "The standard renewal rate per 100 is the tier's building rate per 100."
      rx_tenure: "Months in force for a renewal are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      rx_claims: "that ratio is the claim payments issued under the program's certificates in the last 36 months less the claim payments voided in those 36 months"
      rx_cash: "divided by the lender payments the program received in those 36 months, and it is zero when no lender payment was received in that window."
      rx_recent: "the modifier is 1.10 when any claim payment was issued under the program's certificates in the last 12 months and 0.97 when none was."
      rx_mod: "For a program in force 36 months or more, the modifier is 1 plus one half of the amount by which the program's 36-month renewal loss ratio exceeds 0.40 (a ratio below 0.40 lowers it), kept no lower than 0.85 and no higher than 1.25; that ratio is the claim payments issued under the program's certificates in the last 36 months less the claim payments voided in those 36 months, divided by the lender payments the program received in those 36 months, and it is zero when no lender payment was received in that window. For a program in force at least 12 but fewer than 36 months, the modifier is 1.10 when any claim payment was issued under the program's certificates in the last 12 months and 0.97 when none was. For a program in force fewer than 12 months the modifier is 1.00."
      ro_paid: "when the premium payments the lender made in the last 12 months on its own NFIP Dwelling Form policies with Tidemark total 10,000 dollars or more"
      ro_tenure: "Months in force for a renewal are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      ro_factor: "Owned-property account factor for a renewal: the program renewal rate per 100 is multiplied by 0.92 when the premium payments the lender made in the last 12 months on its own NFIP Dwelling Form policies with Tidemark total 10,000 dollars or more and the program has been in force 24 months or more; by 0.96 when those payments total 3,000 dollars or more and the program has been in force 12 months or more, but the payments are below 10,000 dollars or the program has been in force fewer than 24 months; and by 1.00 in every other case."
      pt_months: "Months in force for a renewal are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      pt_mod: "Program tenure factor: the program renewal rate per 100 is multiplied by 0.95 when the program has been in force 60 months or more, by 0.98 when it has been in force at least 24 but fewer than 60 months, and by 1.00 when it has been in force fewer than 24 months."
      cf_count: "when 5 or more claims were reported under the program's certificates in the last 12 months, each claim counted once by its first notice of loss"
      cf_mod: "Claim frequency load: the program renewal rate per 100 is multiplied by 1.08 when 5 or more claims were reported under the program's certificates in the last 12 months, each claim counted once by its first notice of loss, by 1.04 when 1 to 4 were, and by 1.00 when none was."
      cc_count: "when 3 or more certificates on buildings in flood zone V or VE were issued under the program in the last 36 months"
      cc_mod: "Coastal concentration load: the program renewal rate per 100 is multiplied by 1.10 when 3 or more certificates on buildings in flood zone V or VE were issued under the program in the last 36 months, by 1.05 when 1 or 2 were, and by 1.00 when none was."
      pr_count: "when the program received 10 or more lender payments in the last 12 months"
      pr_mod: "Lender payment record credit: the program renewal rate per 100 is multiplied by 0.98 when the program received 10 or more lender payments in the last 12 months, by 0.99 when it received 6 to 9, and by 1.00 when it received fewer than 6."
      result: "The program renewal rate per 100 starts from the standard renewal rate per 100 and is rounded half to even to 4 decimal places as the last step of the figure."
    factors:
      - id: renewal_experience
        effect: method
        decides: rx_mod
        bindings: [rx_tenure, rx_claims, rx_cash, rx_recent, rx_mod]
        ladder:
          - {when: "the program has been in force 36 months or more", method: "credibility formula: 1 + 0.5 x (36-month renewal loss ratio - 0.40), kept within 0.85 and 1.25"}
          - {when: "the program has been in force at least 12 but fewer than 36 months", method: "claim-count rule: 1.10 when any claim payment was issued in the last 12 months, 0.97 when none was"}
          - {when: "otherwise (fewer than 12 months)", method: "no modification: 1.00"}
        baseline: {rx_mod: "1.0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: renewal_reo
        effect: parameter
        decides: ro_factor
        bindings: [ro_paid, ro_tenure, ro_factor]
        ladder:
          - {when: "own NFIP Dwelling Form premium payments in the last 12 months total 10,000 dollars or more AND the program has been in force 24 months or more", value: "K('reo_high')"}
          - {when: "those payments total 3,000 dollars or more AND the program has been in force 12 months or more, but not both of the first tier's conditions", value: "K('reo_mid')"}
          - {when: "otherwise", value: "1.0"}
        baseline: {ro_factor: "1.0"}
        evidence: [cross_category, date]
        cross_difficulty: dwelling
      - id: program_tenure
        effect: parameter
        decides: pt_mod
        bindings: [pt_months, pt_mod]
        ladder:
          - {when: "the program has been in force 60 months or more", value: "K('tenure_long_mod')"}
          - {when: "it has been in force at least 24 but fewer than 60 months", value: "K('tenure_mid_mod')"}
          - {when: "otherwise (fewer than 24 months)", value: "1.0"}
        baseline: {pt_mod: "1.0"}
        evidence: [date]
        cross_difficulty: null
      - id: claim_frequency
        effect: parameter
        decides: cf_mod
        bindings: [cf_count, cf_mod]
        ladder:
          - {when: "5 or more claims were reported under the program's certificates in the last 12 months (one first notice of loss per claim)", value: "K('freq_high')"}
          - {when: "1 to 4 were", value: "K('freq_low')"}
          - {when: "otherwise (none)", value: "1.0"}
        baseline: {cf_mod: "1.0"}
        evidence: [history]
        cross_difficulty: null
      - id: coastal_concentration
        effect: parameter
        decides: cc_mod
        bindings: [cc_count, cc_mod]
        ladder:
          - {when: "3 or more certificates on buildings in flood zone V or VE were issued under the program in the last 36 months", value: "K('coastal_high')"}
          - {when: "1 or 2 were", value: "K('coastal_low')"}
          - {when: "otherwise (none)", value: "1.0"}
        baseline: {cc_mod: "1.0"}
        evidence: [history]
        cross_difficulty: null
      - id: payment_record
        effect: parameter
        decides: pr_mod
        bindings: [pr_count, pr_mod]
        ladder:
          - {when: "the program received 10 or more lender payments in the last 12 months", value: "K('pay_high')"}
          - {when: "it received 6 to 9", value: "K('pay_mid')"}
          - {when: "otherwise (fewer than 6)", value: "1.0"}
        baseline: {pr_mod: "1.0"}
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard renewal rate per 100 is the tier's building rate per 100.
        The program renewal rate per 100 starts from the standard renewal rate per 100 and is rounded half to even
        to 4 decimal places as the last step of the figure.
      params: [building_rate_per_100]
    inputs:
      history:
        - {table: forceplaced_claims, aggregate: sum, field: payment_amount, within_months: 36, filters: {event_type: forceplaced_claim_paid}}
        - {table: forceplaced_claims, aggregate: count, field: claim_number, within_months: 12, filters: {event_type: forceplaced_claim_reported}}
        - {table: forceplaced_billing, aggregate: sum, field: amount, within_months: 36, filters: {event_type: forceplaced_lender_payment}}
        - {table: forceplaced_billing, aggregate: count, field: amount, within_months: 12, filters: {event_type: forceplaced_lender_payment}}
        - {table: forceplaced_certificates, aggregate: count, field: certificate_number, within_months: 36, filters: {event_type: forceplaced_certificate_issued, flood_zone: VE}}
        - {category: dwelling, table: dwelling_billing, aggregate: sum, field: amount, within_months: 12, filters: {event_type: dwelling_premium_payment}}
      cross_category: [dwelling]

  - id: forceplaced_ext_overlap_credit
    base_policy_refs: [forceplaced_evidence_cancellation, forceplaced_loan_event_cancellation, forceplaced_agg_program_account]
    overwrite:
      - base_policy: forceplaced_evidence_cancellation
        superseded_clause: >-
          When flat_cancel_when_evidence_covers_inception is true and the borrower's policy was in force on the
          certificate's start date, the cancellation is FLAT_CANCEL effective on that start date and the whole
          certificate premium is credited; otherwise it is PRO_RATA_CANCEL effective on the borrower policy's effective
          date and the credit is the annual premium multiplied by the days from that date to the certificate expiration
          date divided by the days in the certificate term, rounded to the cent.
        replaced_by: >-
          For the overlap credit on the certificate named on the acceptable borrower evidence most recently received on
          the program, and only for that credit, the credit and its effective date are figured by this overlap schedule;
          a credit on any other evidence keeps the base treatment, under which the cancellation takes effect on the
          certificate's start date with the whole premium credited when the borrower's policy was in force on that date,
          and otherwise takes effect on the borrower policy's effective date with the premium credited pro rata by days
          to the certificate expiration date over the days in the certificate term, rounded to the cent.
    trigger: state_due
    subject: [forceplaced_certificate_cancelled, forceplaced_premium_credit]
    computes: credit_amount
    target_tool: cancel_certificate_on_evidence_b90eab97
    params:
      short_days: 60
      mid_days: 180
      short_keep: 100
      mid_keep: 40
      first_term_keep: 50
      second_term_keep: 25
      late_long_days: 365
      late_mid_days: 180
      late_long_keep: 75
      late_mid_keep: 35
    rule: >
      For the overlap credit on the certificate named on the acceptable borrower evidence most recently received on
      the program, and only for that credit, the credit and its effective date are figured by this overlap schedule;
      a credit on any other evidence keeps the base treatment, under which the cancellation takes effect on the
      certificate's start date with the whole premium credited when the borrower's policy was in force on that date,
      and otherwise takes effect on the borrower policy's effective date with the premium credited pro rata by days
      to the certificate expiration date over the days in the certificate term, rounded to the cent.
      The evidence used is the borrower evidence with the latest received date among the program's evidence entries
      that meet the acceptance rule, and the borrower's coverage start is the effective date shown on that evidence.
      The current term of the certificate is the term on its latest renewal entry, or on its issue entry when it has
      no renewal entry.
      The current-term overlap credit is the current term's premium multiplied by the days from the borrower's coverage
      start to the current term's expiration date, divided by the days from the current term's start date to its
      expiration date, rounded half to even to the cent.
      The overlap credit is the current-term overlap credit, rounded half to even to the cent and never below zero.
      Current-term credit basis: when the borrower's coverage start falls on or before the current term's start date,
      the current-term overlap credit is the whole premium of the current term; when it falls on or after the current
      term's expiration date, the current-term overlap credit is zero; when it falls between them, the current-term
      overlap credit is figured pro rata by days as stated above.
      Prior-term lookback: the prior term is the term whose expiration date is the current term's start date; when the
      certificate has a prior term and the borrower's coverage start falls on or before
      that prior term's start date, the whole premium of the prior term is added to the overlap credit; when it falls
      after the prior term's start date and before its expiration date, the prior term's premium multiplied by the
      days from the borrower's coverage start to the prior term's expiration date, divided by the days in the prior
      term and rounded half to even to the cent, is added to the overlap credit; in every other case nothing is added.
      Short-period retention: Tidemark keeps, without taking the overlap credit below zero, 100 dollars of it when the borrower's coverage started 1
      to 60 days after the certificate's original start date on its issue entry, keeps 40 dollars when it started 61
      to 180 days after that date, and keeps nothing otherwise.
      Term retention: Tidemark keeps, without taking the overlap credit below zero, 50 dollars of it when the certificate carries no renewal entry, 25
      dollars when it carries exactly one renewal entry, and nothing when it carries two or more.
      Late-evidence retention: Tidemark keeps, without taking the overlap credit below zero, 75 dollars of it when the
      evidence was received more than 365 days after the borrower's coverage start, keeps 35 dollars when it was
      received more than 180 but at most 365 days after it, and keeps nothing otherwise.
      The earliest term the credit reaches is the prior term when the borrower's coverage start falls before the
      current term's start date and the certificate has a prior term, and the current term otherwise. The
      cancellation takes effect on the borrower's coverage start or, when that start falls before the start date
      of the earliest term the credit reaches, on that term's start date; the credit is booked as a flat
      cancellation when the cancellation takes effect on the start date of the earliest term the credit reaches
      and as a pro rata cancellation otherwise. In working out the overlap credit, every amount added to it is
      added before any amount kept is taken off, and the result is never below zero.
      Days between two dates are counted from the earlier date to the later date, the earlier date excluded and the
      later date included.
      When several acceptable evidence entries share the latest received date, the one entered first in the
      program's records is used; when the evidence used names no certificate, there is no certificate to cancel
      and the overlap credit is zero.
      When no evidence entry on the program meets the acceptance rule, there is nothing to cancel and the overlap credit is zero; when the certificate named on the evidence used already carries a cancellation entry, it has already ended and the overlap credit is zero.
    prerequisite: []
    cross_category: []
    compute:
      - ev_cert: "LATEST('forceplaced_tracking', 'certificate_number', date_field='received_date', event_type='forceplaced_evidence_received', evidence_acceptable=True)"
      - ev_eff: "LATEST('forceplaced_tracking', 'evidence_effective_date', date_field='received_date', event_type='forceplaced_evidence_received', evidence_acceptable=True, certificate_number=ev_cert)"
      - ev_cancel: "COUNT('forceplaced_certificates', event_type='forceplaced_certificate_cancelled', certificate_number=ev_cert)"
      - rn_start: "LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_renewed', certificate_number=ev_cert)"
      - is_start: "LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_issued', certificate_number=ev_cert)"
      - cur_start: "rn_start if rn_start else is_start"
      - cur_exp: "LATEST('forceplaced_certificates', 'certificate_expiration_date', event_type='forceplaced_certificate_renewed', certificate_number=ev_cert) if rn_start else LATEST('forceplaced_certificates', 'certificate_expiration_date', event_type='forceplaced_certificate_issued', certificate_number=ev_cert)"
      - cur_prem: "LATEST('forceplaced_certificates', 'annual_premium', event_type='forceplaced_certificate_renewed', certificate_number=ev_cert) if rn_start else LATEST('forceplaced_certificates', 'annual_premium', event_type='forceplaced_certificate_issued', certificate_number=ev_cert)"
      - cur_part: "0 if not ev_cert else (cur_prem if DAYS(ev_eff, cur_start) >= 0 else (0 if DAYS(cur_exp, ev_eff) >= 0 else RND(cur_prem * DAYS(ev_eff, cur_exp) / DAYS(cur_start, cur_exp), 2)))"
      - pr_rn_start: "LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_renewed', certificate_number=ev_cert, certificate_expiration_date=cur_start)"
      - pr_is_start: "LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_issued', certificate_number=ev_cert, certificate_expiration_date=cur_start)"
      - pr_start: "pr_rn_start if pr_rn_start else pr_is_start"
      - pr_prem: "LATEST('forceplaced_certificates', 'annual_premium', event_type='forceplaced_certificate_renewed', certificate_number=ev_cert, certificate_expiration_date=cur_start) if pr_rn_start else LATEST('forceplaced_certificates', 'annual_premium', event_type='forceplaced_certificate_issued', certificate_number=ev_cert, certificate_expiration_date=cur_start)"
      - prior_part: "0 if not ev_cert else ((pr_prem if DAYS(ev_eff, pr_start) >= 0 else (RND(pr_prem * DAYS(ev_eff, cur_start) / DAYS(pr_start, cur_start), 2) if DAYS(ev_eff, cur_start) > 0 else 0)) if pr_start else 0)"
      - sp_orig: "LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_issued', certificate_number=ev_cert)"
      - sp_keep: "0 if not ev_cert else (K('short_keep') if DAYS(sp_orig, ev_eff) >= 1 and DAYS(sp_orig, ev_eff) <= K('short_days') else (K('mid_keep') if DAYS(sp_orig, ev_eff) > K('short_days') and DAYS(sp_orig, ev_eff) <= K('mid_days') else 0))"
      - tr_count: "COUNT('forceplaced_certificates', event_type='forceplaced_certificate_renewed', certificate_number=ev_cert)"
      - tr_keep: "K('first_term_keep') if tr_count == 0 else (K('second_term_keep') if tr_count == 1 else 0)"
      - le_recv: "LATEST('forceplaced_tracking', 'received_date', date_field='received_date', event_type='forceplaced_evidence_received', evidence_acceptable=True, certificate_number=ev_cert)"
      - le_keep: "0 if not ev_eff or not le_recv else (K('late_long_keep') if DAYS(ev_eff, le_recv) > K('late_long_days') else (K('late_mid_keep') if DAYS(ev_eff, le_recv) > K('late_mid_days') else 0))"
      - result: "0 if ev_cancel > 0 else MX(0, RND(cur_part + prior_part - sp_keep - tr_keep - le_keep, 2))"
    compute_basis:
      ev_cancel: "when the certificate named on the evidence used already carries a cancellation entry, it has already ended and the overlap credit is zero."
      ev_cert: "The evidence used is the borrower evidence with the latest received date among the program's evidence entries that meet the acceptance rule, and the borrower's coverage start is the effective date shown on that evidence."
      ev_eff: "The evidence used is the borrower evidence with the latest received date among the program's evidence entries that meet the acceptance rule, and the borrower's coverage start is the effective date shown on that evidence."
