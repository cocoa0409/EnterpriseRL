          - {when: "it was processed 31 to 60 days after it", value: "K('late_mid_keep')"}
          - {when: "otherwise (30 days or fewer)", value: "0"}
        baseline: {lp_keep: "0"}
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The certificate credited is the one on the issue entry with the latest processing date under the program, and its premium, start date and expiration date are those of its term in force, read from its latest renewal entry, or from its issue entry when it has no renewal entry; the cancellation takes effect
