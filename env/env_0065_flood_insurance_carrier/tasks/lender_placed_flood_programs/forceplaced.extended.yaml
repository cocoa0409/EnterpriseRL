      rule: >-
        The evidence used is the borrower evidence with the latest received date among the program's evidence entries
        that meet the acceptance rule, and the borrower's coverage start is the effective date shown on that evidence.
        The current term of the certificate is the term on its latest renewal entry, or on its issue entry when it has
        no renewal entry.
        The current-term overlap credit is the current term's premium multiplied by the days from the borrower's
        coverage start to the current term's expiration date, divided by the days from the current term's start date
        to its expiration date, rounded half to even to the cent.
        The overlap credit is the current-term overlap credit, rounded half to even to the cent and never below zero.
      params: []
    inputs:
      history:
        - {table: forceplaced_tracking, aggregate: latest, field: evidence_effective_date, filters: {event_type: forceplaced_evidence_received, evidence_acceptable: true}}
        - {table: forceplaced_certificates, aggregate: latest, field: annual_premium, filters: {event_type: forceplaced_certificate_renewed}}
        - {table: forceplaced_certificates, aggregate: latest, field: annual_premium, filters: {event_type: forceplaced_certificate_issued}}
        - {table: forceplaced_certificates, aggregate: count, field: certificate_number, filters: {event_type: forceplaced_certificate_renewed}}
      cross_category: []

  - id: forceplaced_ext_credit_refund
    base_policy_refs: [forceplaced_agg_program_account]
    overwrite:
      - base_policy: forceplaced_agg_program_account
        superseded_clause: >-
          A credit balance on the account is refunded to the lender on its request or at termination.
        replaced_by: >-
          When a lender asks for the credit balance on an active or suspended program to be refunded, and only then, the refund paid on that request is the refundable credit figured by this refund schedule; a credit balance on a terminated program is still refunded to the lender in full at termination.
    trigger: on_request
    subject: [forceplaced_refund_disbursed]
    computes: refund_amount
    target_tool: refund_program_credit_d16acbc2
    params:
      hold_new_months: 24
      hold_mid_months: 60
      hold_min_payments: 6
      hold_half: 0.5
      rc_many_count: 5
      rc_few_count: 2
      wb_large_count: 12
      wb_mid_count: 5
      wb_large: 1000
      wb_mid: 500
    rule: >
      When a lender asks for the credit balance on an active or suspended program to be refunded, and only then, the refund paid on that request is the refundable credit figured by this refund schedule; a credit balance on a terminated program is still refunded to the lender in full at termination.
      The refund is not figured until the program account carries, for the certificate named on every borrower
      evidence on file that meets the acceptance rule, a credit booked on a cancellation for confirmed borrower coverage, unless that certificate had already been cancelled for another reason.
      The refund is fixed only after every certificate whose current term expires today, other than one carrying a cancellation entry, one for which acceptable borrower evidence has been received or a run-off certificate of a terminated program, carries a renewal entry for the following term.
      The refund is fixed only after the loan named on the program's most recently mailed first notice, once that notice is more than the borrower notice period old with no acceptable borrower evidence received since it, carries a certificate issued on or after that notice.
      The program's credit balance is the lender payments plus the premium credits on the program account, less the
      premium charges and the refunds already paid, taken over every entry on the account.
      The refundable credit is the program's credit balance, never below zero, rounded half to even to the cent as the last step of the figure.
      Clearing hold: Tidemark holds back from the refundable credit, without taking it below zero, the whole of the
      lender payments received in the last month when the program has been in force fewer than 24 months or the
      program received fewer than 6 lender payments in the last 12 months; half of those payments when the program
      has been in force at least 24 but fewer than 60 months and received 6 or more lender payments in the last 12
      months; and nothing when it has been in force 60 months or more and received 6 or more lender payments in the
      last 12 months.
      Renewal reserve: Tidemark holds back from the refundable credit, without taking it below zero, a reserve
      for renewals about to be billed, estimated from the renewal notices mailed in the last month: when the
      required amounts on those notices average at least the amount at which the tier's building rate per 100
      reaches the tier's minimum certificate premium, the reserve is the sum of those required amounts divided
      by 100 times the tier's building rate per 100; when they average less, the reserve is the tier's minimum
      certificate premium for each such notice; with no such notice the reserve is zero.
      Recent-credit hold: Tidemark holds back from the refundable credit, without taking it below zero, the whole of
      the premium credits posted in the last month when 5 or more premium credits were posted in that month, half of
      them when 2 to 4 were posted, and nothing when fewer than 2 were posted.
      Working balance: Tidemark keeps on the account, without taking the refundable credit below zero, 1,000 dollars
      when 12 or more certificates were issued under the program in the last 12 months, 500 dollars when 5 to 11 were,
      and nothing when fewer than 5 were.
      Months in force for a refund are the whole calendar months from the program effective date to today, a month
      counting only once its day of the month is reached, and a refund window of the last N months covers every entry
      dated on a day from which fewer than N such whole months have passed by today.
    prerequisite:
      - problem: forceplaced_ext_overlap_credit
        kind: value_input
        gate: g_cred
        form: state
        policy_source: >-
          The refund is not figured until the program account carries, for the certificate named on every
          borrower evidence on file that meets the acceptance rule, a credit booked on a cancellation for
          confirmed borrower coverage, unless that certificate had already been cancelled for another reason.
        condition: >-
          For the certificate_number on every forceplaced_tracking evidence entry with evidence_acceptable true, the
          program's forceplaced_billing carries a forceplaced_premium_credit entry whose reference_id is a
          forceplaced_certificate_cancelled entry with cancellation_reason BORROWER_COVERAGE_CONFIRMED, unless the certificate already carried a cancellation entry with another reason.
        resolved_by: cancel_certificate_on_evidence_b90eab97
        effect: >-
          The overlap credit booked for the certificate raises the premium credits summed into the program's credit
          balance by the credit amount, so the refundable credit rises by that amount.
      - problem: forceplaced_ext_renewal_premium
        kind: value_input
        gate: g_chg
        form: state
        policy_source: >-
          The refund is fixed only after every certificate whose current term expires today, other than one carrying a cancellation entry, one for which acceptable borrower evidence has been received or a run-off certificate of a terminated program, carries a renewal entry for the following term.
        condition: >-
          Every certificate whose latest issue or renewal entry has certificate_expiration_date equal to today, and which has no forceplaced_certificate_cancelled entry and no acceptable evidence entry, under a program whose status is not terminated, carries a forceplaced_certificate_renewed entry starting on that expiration date with its RENEWAL premium charge.
        resolved_by: renew_certificate_c91c4d46
        effect: >-
          The renewal premium billed for the renewed term raises the premium charges summed into the program's credit
          balance, so the refundable credit falls by the renewal premium.
      - problem: forceplaced_ext_placement_premium
        kind: value_input
        gate: g_chg
        form: state
        policy_source: >-
          The refund is fixed only after the loan named on the program's most recently mailed first notice, once
          that notice is more than the borrower notice period old with no acceptable borrower evidence received
          since it, carries a certificate issued on or after that notice.
        condition: >-
          The loan named on the program's most recent FIRST_NOTICE, once that notice is more than borrower_notice_days old with no acceptable evidence received on or after it, carries a forceplaced_certificate_issued entry with event_date on or after that notice date, with its NEW_PLACEMENT premium charge on the account.
        resolved_by: issue_residential_certificate_c6c06832
        effect: >-
          The placement premium billed raises the premium charges summed into the program's credit balance, so the
          refundable credit falls by the placement premium; the issued certificate also counts toward the certificates
          issued in the last 12 months.
    cross_category: []
    compute:
      - g_pay: "SUM('forceplaced_billing', 'amount', event_type='forceplaced_lender_payment')"
      - g_cred: "SUM('forceplaced_billing', 'amount', event_type='forceplaced_premium_credit')"
      - g_chg: "SUM('forceplaced_billing', 'amount', event_type='forceplaced_premium_charged')"
      - g_ref: "SUM('forceplaced_billing', 'amount', event_type='forceplaced_refund_disbursed')"
      - credit_bal: "g_pay + g_cred - g_chg - g_ref"
      - ch_tenure: "MONTHS(F('program_effective_date'), NOW)"
      - ch_count: "COUNT('forceplaced_billing', within_months=12, date_field='posted_date', event_type='forceplaced_lender_payment')"
      - ch_recent: "SUM('forceplaced_billing', 'amount', within_months=1, date_field='posted_date', event_type='forceplaced_lender_payment')"
      - clr_hold: "ch_recent if ch_tenure < K('hold_new_months') or ch_count < K('hold_min_payments') else (K('hold_half') * ch_recent if ch_tenure < K('hold_mid_months') and ch_count >= K('hold_min_payments') else 0)"
      - rr_count: "COUNT('forceplaced_tracking', within_months=1, date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='RENEWAL_NOTICE')"
      - rr_sum: "SUM('forceplaced_tracking', 'required_amount', within_months=1, date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='RENEWAL_NOTICE')"
      - rr_reserve: "rr_sum / 100 * P('building_rate_per_100') if rr_count >= 1 and rr_sum / rr_count >= P('minimum_certificate_premium') / P('building_rate_per_100') * 100 else (rr_count * P('minimum_certificate_premium') if rr_count >= 1 else 0)"
      - rc_count: "COUNT('forceplaced_billing', within_months=1, date_field='posted_date', event_type='forceplaced_premium_credit')"
      - rc_sum: "SUM('forceplaced_billing', 'amount', within_months=1, date_field='posted_date', event_type='forceplaced_premium_credit')"
      - rc_hold: "rc_sum if rc_count >= K('rc_many_count') else (K('hold_half') * rc_sum if rc_count >= K('rc_few_count') else 0)"
      - wb_count: "COUNT('forceplaced_certificates', within_months=12, event_type='forceplaced_certificate_issued')"
      - wb_keep: "K('wb_large') if wb_count >= K('wb_large_count') else (K('wb_mid') if wb_count >= K('wb_mid_count') else 0)"
      - result: "MX(0, RND(credit_bal - clr_hold - rr_reserve - rc_hold - wb_keep, 2))"
    compute_basis:
      g_pay: "The program's credit balance is the lender payments plus the premium credits on the program account, less the premium charges and the refunds already paid, taken over every entry on the account."
      g_cred: "The program's credit balance is the lender payments plus the premium credits on the program account, less the premium charges and the refunds already paid, taken over every entry on the account."
      g_chg: "The program's credit balance is the lender payments plus the premium credits on the program account, less the premium charges and the refunds already paid, taken over every entry on the account."
      g_ref: "The program's credit balance is the lender payments plus the premium credits on the program account, less the premium charges and the refunds already paid, taken over every entry on the account."
      credit_bal: "The program's credit balance is the lender payments plus the premium credits on the program account, less the premium charges and the refunds already paid, taken over every entry on the account."
      ch_tenure: "Months in force for a refund are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      ch_count: "the program received fewer than 6 lender payments in the last 12 months"
      ch_recent: "the whole of the lender payments received in the last month"
      clr_hold: "Clearing hold: Tidemark holds back from the refundable credit, without taking it below zero, the whole of the lender payments received in the last month when the program has been in force fewer than 24 months or the program received fewer than 6 lender payments in the last 12 months; half of those payments when the program has been in force at least 24 but fewer than 60 months and received 6 or more lender payments in the last 12 months; and nothing when it has been in force 60 months or more and received 6 or more lender payments in the last 12 months."
      rr_count: "estimated from the renewal notices mailed in the last month:"
      rr_sum: "the reserve is the sum of those required amounts divided by 100 times the tier's building rate per 100;"
      rr_reserve: "Renewal reserve: Tidemark holds back from the refundable credit, without taking it below zero, a reserve for renewals about to be billed, estimated from the renewal notices mailed in the last month: when the required amounts on those notices average at least the amount at which the tier's building rate per 100 reaches the tier's minimum certificate premium, the reserve is the sum of those required amounts divided by 100 times the tier's building rate per 100; when they average less, the reserve is the tier's minimum certificate premium for each such notice; with no such notice the reserve is zero."
      rc_count: "the whole of the premium credits posted in the last month when 5 or more premium credits were posted in that month"
      rc_sum: "the whole of the premium credits posted in the last month when 5 or more premium credits were posted in that month"
      rc_hold: "Recent-credit hold: Tidemark holds back from the refundable credit, without taking it below zero, the whole of the premium credits posted in the last month when 5 or more premium credits were posted in that month, half of them when 2 to 4 were posted, and nothing when fewer than 2 were posted."
      wb_count: "when 12 or more certificates were issued under the program in the last 12 months"
      wb_keep: "Working balance: Tidemark keeps on the account, without taking the refundable credit below zero, 1,000 dollars when 12 or more certificates were issued under the program in the last 12 months, 500 dollars when 5 to 11 were, and nothing when fewer than 5 were."
      result: "The refundable credit is the program's credit balance, never below zero, rounded half to even to the cent as the last step of the figure."
    factors:
      - id: clearing_hold
        effect: parameter
        decides: clr_hold
        bindings: [ch_tenure, ch_count, ch_recent, clr_hold]
        ladder:
          - {when: "the program has been in force fewer than 24 months OR it received fewer than 6 lender payments in the last 12 months", value: "the whole of the lender payments received in the last month"}
          - {when: "the program has been in force at least 24 but fewer than 60 months AND it received 6 or more lender payments in the last 12 months", value: "K('hold_half') times the lender payments received in the last month"}
          - {when: "otherwise (60 months or more and 6 or more payments)", value: "0"}
        baseline: {clr_hold: "0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: renewal_reserve
        effect: method
        decides: rr_reserve
        bindings: [rr_count, rr_sum, rr_reserve]
        ladder:
          - {when: "renewal notices were mailed in the last month and their required amounts average at least the amount at which the tier rate reaches the minimum premium", method: "sum of the notice amounts / 100 x the tier's building rate per 100"}
          - {when: "renewal notices were mailed in the last month and their required amounts average less than that amount", method: "the tier's minimum certificate premium for each notice"}
          - {when: "otherwise (none)", method: "no reserve"}
        baseline: {rr_reserve: "0"}
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: recent_credit_hold
        effect: parameter
        decides: rc_hold
        bindings: [rc_count, rc_sum, rc_hold]
        ladder:
          - {when: "5 or more premium credits were posted in the last month", value: "the whole of the premium credits posted in the last month"}
          - {when: "2 to 4 premium credits were posted in the last month", value: "K('hold_half') times those credits"}
          - {when: "otherwise (fewer than 2)", value: "0"}
        baseline: {rc_hold: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: working_balance
        effect: parameter
        decides: wb_keep
        bindings: [wb_count, wb_keep]
        ladder:
          - {when: "12 or more certificates were issued under the program in the last 12 months", value: "K('wb_large')"}
          - {when: "5 to 11 were", value: "K('wb_mid')"}
          - {when: "otherwise (fewer than 5)", value: "0"}
        baseline: {wb_keep: "0"}
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The program's credit balance is the lender payments plus the premium credits on the program account, less the
        premium charges and the refunds already paid, taken over every entry on the account.
        The refundable credit is the program's credit balance, never below zero, rounded half to even to the cent as the last step of the figure.
      params: []
    inputs:
      history:
        - {table: forceplaced_billing, aggregate: sum, field: amount, filters: {event_type: forceplaced_lender_payment}}
        - {table: forceplaced_billing, aggregate: sum, field: amount, filters: {event_type: forceplaced_premium_credit}}
        - {table: forceplaced_billing, aggregate: sum, field: amount, filters: {event_type: forceplaced_premium_charged}}
        - {table: forceplaced_billing, aggregate: count, field: amount, within_months: 12, filters: {event_type: forceplaced_lender_payment}}
        - {table: forceplaced_tracking, aggregate: count, field: required_amount, within_months: 1, filters: {notice_type: RENEWAL_NOTICE}}
        - {table: forceplaced_billing, aggregate: sum, field: amount, within_months: 1, filters: {event_type: forceplaced_premium_credit}}
        - {table: forceplaced_certificates, aggregate: count, field: certificate_number, within_months: 12, filters: {event_type: forceplaced_certificate_issued}}
      cross_category: []

  - id: forceplaced_ext_commercial_placement_premium
    base_policy_refs: [forceplaced_notice_and_placement, forceplaced_coverage_amount, forceplaced_effective_date_premium, forceplaced_agg_program_account]
    overwrite:
      - base_policy: forceplaced_effective_date_premium
        superseded_clause: >-
          The annual premium is the building limit divided by 100 times building_rate_per_100 plus the contents limit
          divided by 100 times contents_rate_per_100, rounded to the cent, and never less than minimum_certificate_premium
        replaced_by: >-
          For a commercial placement on the loan named on the most recently mailed first notice of a program on
          the Commercial Building tier, and only for such a placement, the annual premium is set by this
          commercial placement schedule in place of the base premium formula; a placement on the loan named on the most recently mailed first notice of a program on the Residential Mandatory Amount tier is priced by the residential placement schedule and every renewal on that tier by the residential renewal schedule, and every other certificate premium, including any on the Commercial Building and Contents tier, remains the building limit divided by 100 times the tier's building rate per 100 plus the contents limit divided by 100 times the tier's contents rate per 100, rounded to the cent, and never less than the tier's minimum certificate premium.
      - base_policy: forceplaced_coverage_amount
        superseded_clause: >-
          The mandatory purchase amount (required_amount) is the lowest of the loan's outstanding principal balance, the
          tier's nfip_max_building_reference and the building's insurable value.
        replaced_by: >-
          For a placement this commercial placement schedule prices, and only for such a placement, the
          mandatory purchase amount is the required amount stated on the loan's latest first notice, the figure
          Tidemark set there as the lowest of the principal balance the lender reported, the tier's NFIP maximum
          building reference and the insurable value; a placement under the residential placement schedule
          follows that schedule's own first-notice rule, a renewal under the residential renewal schedule
          follows that schedule's renewal-notice rule, and for every other certificate the mandatory purchase
          amount remains the lowest of those three figures.
      - base_policy: forceplaced_notice_and_placement
        superseded_clause: >-
          No certificate is issued when acceptable borrower evidence was received before placement
        replaced_by: >-
          For a placement this commercial placement schedule prices, and only for such a placement, acceptable
          borrower evidence bars the certificate only when it was received on or after the loan's latest first
          notice, evidence from an earlier lapse not counting; a placement under the residential placement
          schedule follows that schedule's own reading, and for every other placement no certificate is issued
          when acceptable borrower evidence was received before placement.
    trigger: state_due
    subject: [forceplaced_certificate_issued, forceplaced_premium_charged]
    computes: annual_premium
    target_tool: issue_commercial_certificate_61c928bb
    params:
      rate_large: 0.98
      rate_small: 1.20
      large_threshold: 400000
      small_threshold: 150000
      reo_high: 0.92
      reo_mid: 0.96
      reo_paid_high: 15000
      reo_paid_mid: 5000
      reo_tenure_high: 24
      reo_tenure_mid: 12
      exp_long: 36
      exp_short: 12
      exp_weight: 0.5
      exp_target: 0.40
      exp_floor: 0.85
      exp_cap: 1.25
      exp_claim_mod: 1.10
      exp_clean_mod: 0.97
      retro_long_days: 60
      retro_mid_days: 15
      retro_long: 1.10
      retro_mid: 1.04
      repeat_two: 1.10
      repeat_one: 1.05
    rule: >
      For a commercial placement on the loan named on the most recently mailed first notice of a program on the
      Commercial Building tier, and only for such a placement, the annual premium is set by this commercial
      placement schedule in place of the base premium formula; a placement on the loan named on the most recently mailed first notice of a program on the Residential Mandatory Amount tier is priced by the residential placement schedule and every renewal on that tier by the residential renewal schedule, and every other certificate premium, including any on the Commercial Building and Contents tier, remains the building limit divided by 100 times the tier's building rate per 100 plus the contents limit divided by 100 times the tier's contents rate per 100, rounded to the cent, and never less than the tier's minimum certificate premium.
      For a placement this commercial placement schedule prices, and only for such a placement, the mandatory
      purchase amount is the required amount stated on the loan's latest first notice, the figure Tidemark set
      there as the lowest of the principal balance the lender reported, the tier's NFIP maximum building
      reference and the insurable value; a placement under the residential placement schedule follows that
      schedule's own first-notice rule, a renewal under the residential renewal schedule follows that schedule's
      renewal-notice rule, and for every other certificate the mandatory purchase amount remains the lowest of
      those three figures.
      For a placement this commercial placement schedule prices, and only for such a placement, acceptable
      borrower evidence bars the certificate only when it was received on or after the loan's latest first
      notice, evidence from an earlier lapse not counting; a placement under the residential placement schedule
      follows that schedule's own reading, and for every other placement no certificate is issued when
      acceptable borrower evidence was received before placement.
      The placement is priced for the loan named on the first notice with the latest notice date among the program's
      first notices, and that loan's mandatory purchase amount is the required amount stated on that first notice.
      The building limit of a commercial placement is that mandatory purchase amount rounded up to the next multiple of the
      tier's limit rounding increment and capped at the tier's maximum certificate building limit.
      The rated amount of a commercial placement is its building limit divided by 100 times the rate per 100 for a commercial
      placement.
      The standard rate per 100 for a commercial placement is the tier's building rate per 100.
      The annual premium of a commercial placement is its rated amount rounded half to even to the cent, and never less than
      the tier's minimum certificate premium.
      Commercial placement band rate: the rate per 100 for a commercial placement is 0.98 when the required
      amount on the loan's first
      notice is 400,000 dollars or more, 1.20 when it is below 150,000 dollars, and the standard rate per 100
      for a commercial
      placement when it is at least 150,000 but below 400,000 dollars.
      Owned-building account factor for a commercial placement: the rated amount of a commercial placement is
      multiplied by 0.92
      when the premium payments the lender made in the last 12 months on its own NFIP General Property Form or RCBAP policies with
      Tidemark total 15,000 dollars or more and the program has been in force 24 months or more; by 0.96 when those
      payments total 5,000 dollars or more and the program has been in force 12 months or more, but the payments are
      below 15,000 dollars or the program has been in force fewer than 24 months; and by 1.00 in every other case.
      Commercial placement experience modifier: the rated amount of a commercial placement is multiplied by a
      modifier worked out from
      the program's own claim experience. For a program in force 36 months or more, the modifier is 1 plus one half of
      the amount by which the program's 36-month commercial placement loss ratio exceeds 0.40 (a ratio below
      0.40 lowers it), kept
      no lower than 0.85 and no higher than 1.25; that loss ratio is the claim payments issued under the program's
      certificates in the last 36 months less the claim payments voided in those 36 months, divided by the lender
      payments the program received in those 36 months, and it is zero when no lender payment was received in that
      window. For a program in force at least 12 but fewer than 36 months, the modifier is 1.10 when any claim payment
      was issued under the program's certificates in the last 12 months and 0.97 when none was. For a program in force
      fewer than 12 months the modifier is 1.00.
      Retroactive-exposure load for a commercial placement: the rated amount of a commercial placement is
      multiplied by 1.10 when
      more than 60 days run from the lapse date to the notice date on the loan's first notice, by 1.04 when 15 to 60 days run from the lapse date to that notice date, and by 1.00 when fewer than 15 days run from the lapse date to that notice date or the notice is dated on or before the lapse date.
      Repeat-placement load for a commercial placement: the rated amount of a commercial placement is multiplied
      by 1.10 when two or
      more certificates were issued earlier under the program on the same loan number, by 1.05 when exactly one was,
      and by 1.00 when none was.
      Months in force for a commercial placement are the whole calendar months from the program effective date
      to today, a month counting only
      once its day of the month is reached; a window of the last N months covers every entry dated on a day from which
      fewer than N such whole months have passed by today; days between two dates are counted from the earlier date
      to the later date, the earlier date excluded and the later date included.
      When several first notices share the latest notice date, the one entered first in the program's records is
      used, and a program with no first notice has no placement for this schedule to price, the premium this schedule gives being zero.
    prerequisite: []
    cross_category:
      - category: nfipcom
        as: history
        reads: [nfipcom_billing.amount]
        note: The owned-building account factor reads the lender's own NFIP General Property Form or RCBAP premium payments over the last 12 months.
    compute:
      - fn_loan: "LATEST('forceplaced_tracking', 'loan_number', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE')"
      - fn_req: "LATEST('forceplaced_tracking', 'required_amount', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - bldg_limit: "0 if not fn_req else MN(P('max_certificate_building_limit'), -(-int(fn_req) // P('limit_rounding_increment')) * P('limit_rounding_increment'))"
      - band_req: "LATEST('forceplaced_tracking', 'required_amount', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - band_rate: "K('rate_large') if (band_req or 0) >= K('large_threshold') else (K('rate_small') if (band_req or 0) < K('small_threshold') else P('building_rate_per_100'))"
      - reo_paid: "XSUM('nfipcom', 'nfipcom_billing', 'amount', within_months=12, date_field='posted_date', event_type='nfipcom_premium_payment')"
      - reo_tenure: "MONTHS(F('program_effective_date'), NOW)"
      - reo_factor: "K('reo_high') if reo_paid >= K('reo_paid_high') and reo_tenure >= K('reo_tenure_high') else (K('reo_mid') if reo_paid >= K('reo_paid_mid') and reo_tenure >= K('reo_tenure_mid') else 1.0)"
      - exp_tenure: "MONTHS(F('program_effective_date'), NOW)"
      - exp_claims: "SUM('forceplaced_claims', 'payment_amount', within_months=36, event_type='forceplaced_claim_paid') - SUM('forceplaced_claims', 'payment_amount', within_months=36, event_type='forceplaced_claim_payment_voided')"
      - exp_cash: "SUM('forceplaced_billing', 'amount', within_months=36, date_field='posted_date', event_type='forceplaced_lender_payment')"
      - exp_recent: "COUNT('forceplaced_claims', within_months=12, event_type='forceplaced_claim_paid')"
      - exp_mod: "MN(K('exp_cap'), MX(K('exp_floor'), 1 + K('exp_weight') * ((exp_claims / exp_cash if exp_cash > 0 else 0) - K('exp_target')))) if exp_tenure >= K('exp_long') else ((K('exp_claim_mod') if exp_recent > 0 else K('exp_clean_mod')) if exp_tenure >= K('exp_short') else 1.0)"
      - retro_lapse: "LATEST('forceplaced_tracking', 'lapse_date', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - retro_notice: "LATEST('forceplaced_tracking', 'notice_date', date_field='notice_date', event_type='forceplaced_notice_mailed', notice_type='FIRST_NOTICE', loan_number=fn_loan)"
      - retro_mult: "1.0 if not retro_lapse or not retro_notice else (K('retro_long') if DAYS(retro_lapse, retro_notice) > K('retro_long_days') else (K('retro_mid') if DAYS(retro_lapse, retro_notice) >= K('retro_mid_days') else 1.0))"
      - repeat_count: "COUNT('forceplaced_certificates', event_type='forceplaced_certificate_issued', loan_number=fn_loan)"
      - repeat_mult: "K('repeat_two') if repeat_count >= 2 else (K('repeat_one') if repeat_count == 1 else 1.0)"
      - rated: "bldg_limit / 100 * band_rate * reo_factor * exp_mod * retro_mult * repeat_mult"
      - result: "0 if not fn_loan else MX(P('minimum_certificate_premium'), RND(rated, 2))"
    compute_basis:
      fn_loan: "When several first notices share the latest notice date, the one entered first in the program's records is used, and a program with no first notice has no placement for this schedule to price, the premium this schedule gives being zero."
      fn_req: "The placement is priced for the loan named on the first notice with the latest notice date among the program's first notices, and that loan's mandatory purchase amount is the required amount stated on that first notice."
      bldg_limit: "The building limit of a commercial placement is that mandatory purchase amount rounded up to the next multiple of the tier's limit rounding increment and capped at the tier's maximum certificate building limit."
      band_req: "the rate per 100 for a commercial placement is 0.98 when the required amount on the loan's first notice is 400,000 dollars or more"
      band_rate: "Commercial placement band rate: the rate per 100 for a commercial placement is 0.98 when the required amount on the loan's first notice is 400,000 dollars or more, 1.20 when it is below 150,000 dollars, and the standard rate per 100 for a commercial placement when it is at least 150,000 but below 400,000 dollars."
      reo_paid: "when the premium payments the lender made in the last 12 months on its own NFIP General Property Form or RCBAP policies with Tidemark total 15,000 dollars or more"
      reo_tenure: "Months in force for a commercial placement are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      reo_factor: "Owned-building account factor for a commercial placement: the rated amount of a commercial placement is multiplied by 0.92 when the premium payments the lender made in the last 12 months on its own NFIP General Property Form or RCBAP policies with Tidemark total 15,000 dollars or more and the program has been in force 24 months or more; by 0.96 when those payments total 5,000 dollars or more and the program has been in force 12 months or more, but the payments are below 15,000 dollars or the program has been in force fewer than 24 months; and by 1.00 in every other case."
      exp_tenure: "Months in force for a commercial placement are the whole calendar months from the program effective date to today, a month counting only once its day of the month is reached"
      exp_claims: "that loss ratio is the claim payments issued under the program's certificates in the last 36 months less the claim payments voided in those 36 months"
      exp_cash: "divided by the lender payments the program received in those 36 months, and it is zero when no lender payment was received in that window."
      exp_recent: "the modifier is 1.10 when any claim payment was issued under the program's certificates in the last 12 months and 0.97 when none was."
      exp_mod: "For a program in force 36 months or more, the modifier is 1 plus one half of the amount by which the program's 36-month commercial placement loss ratio exceeds 0.40 (a ratio below 0.40 lowers it), kept no lower than 0.85 and no higher than 1.25; that loss ratio is the claim payments issued under the program's certificates in the last 36 months less the claim payments voided in those 36 months, divided by the lender payments the program received in those 36 months, and it is zero when no lender payment was received in that window. For a program in force at least 12 but fewer than 36 months, the modifier is 1.10 when any claim payment was issued under the program's certificates in the last 12 months and 0.97 when none was. For a program in force fewer than 12 months the modifier is 1.00."
      retro_lapse: "the rated amount of a commercial placement is multiplied by 1.10 when more than 60 days run from the lapse date to the notice date on the loan's first notice"
      retro_notice: "the rated amount of a commercial placement is multiplied by 1.10 when more than 60 days run from the lapse date to the notice date on the loan's first notice"
      retro_mult: "Retroactive-exposure load for a commercial placement: the rated amount of a commercial placement is multiplied by 1.10 when more than 60 days run from the lapse date to the notice date on the loan's first notice, by 1.04 when 15 to 60 days run from the lapse date to that notice date, and by 1.00 when fewer than 15 days run from the lapse date to that notice date or the notice is dated on or before the lapse date."
      repeat_count: "when two or more certificates were issued earlier under the program on the same loan number"
      repeat_mult: "Repeat-placement load for a commercial placement: the rated amount of a commercial placement is multiplied by 1.10 when two or more certificates were issued earlier under the program on the same loan number, by 1.05 when exactly one was, and by 1.00 when none was."
      rated: "The rated amount of a commercial placement is its building limit divided by 100 times the rate per 100 for a commercial placement."
      result: "The annual premium of a commercial placement is its rated amount rounded half to even to the cent, and never less than the tier's minimum certificate premium."
    factors:
      - id: commercial_band
        effect: parameter
        decides: band_rate
        bindings: [band_req, band_rate]
        ladder:
          - {when: "the required amount on the loan's first notice is 400,000 dollars or more", value: "K('rate_large')"}
          - {when: "the required amount on the loan's first notice is below 150,000 dollars", value: "K('rate_small')"}
          - {when: "otherwise (at least 150,000 but below 400,000 dollars)", value: "P('building_rate_per_100')"}
        baseline: {band_rate: "P('building_rate_per_100')"}
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: branch_credit
        effect: parameter
        decides: reo_factor
        bindings: [reo_paid, reo_tenure, reo_factor]
        ladder:
          - {when: "own NFIP General Property Form or RCBAP premium payments in the last 12 months total 15,000 dollars or more AND the program has been in force 24 months or more", value: "K('reo_high')"}
          - {when: "those payments total 5,000 dollars or more AND the program has been in force 12 months or more, but not both of the first tier's conditions", value: "K('reo_mid')"}
          - {when: "otherwise", value: "1.0"}
        baseline: {reo_factor: "1.0"}
        evidence: [cross_category, date]
        cross_difficulty: nfipcom
      - id: commercial_experience
        effect: method
        decides: exp_mod
        bindings: [exp_tenure, exp_claims, exp_cash, exp_recent, exp_mod]
        ladder:
          - {when: "the program has been in force 36 months or more", method: "credibility formula: 1 + 0.5 x (36-month loss ratio - 0.40), kept within 0.85 and 1.25, the loss ratio being net claim payments over lender payments in the last 36 months"}
          - {when: "the program has been in force at least 12 but fewer than 36 months", method: "claim-count rule: 1.10 when any claim payment was issued in the last 12 months, 0.97 when none was"}
          - {when: "otherwise (fewer than 12 months)", method: "no modification: 1.00"}
        baseline: {exp_mod: "1.0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: commercial_retro
        effect: parameter
        decides: retro_mult
        bindings: [retro_lapse, retro_notice, retro_mult]
        ladder:
          - {when: "more than 60 days run from the lapse date to the first-notice date", value: "K('retro_long')"}
          - {when: "15 to 60 days run from the lapse date to the first-notice date", value: "K('retro_mid')"}
          - {when: "otherwise (fewer than 15 days, or the notice dated on or before the lapse date)", value: "1.0"}
        baseline: {retro_mult: "1.0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: commercial_repeat
        effect: parameter
        decides: repeat_mult
        bindings: [repeat_count, repeat_mult]
        ladder:
          - {when: "two or more certificates were issued earlier under the program on the same loan number", value: "K('repeat_two')"}
          - {when: "exactly one was", value: "K('repeat_one')"}
          - {when: "otherwise (none)", value: "1.0"}
        baseline: {repeat_mult: "1.0"}
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The placement is priced for the loan named on the first notice with the latest notice date among the program's
        first notices, and that loan's mandatory purchase amount is the required amount stated on that first notice.
        The building limit of a commercial placement is that mandatory purchase amount rounded up to the next multiple of the
        tier's limit rounding increment and capped at the tier's maximum certificate building limit.
        The rated amount of a commercial placement is its building limit divided by 100 times the rate per 100
        for a commercial
        placement.
        The standard rate per 100 for a commercial placement is the tier's building rate per 100.
        The annual premium of a commercial placement is its rated amount rounded half to even to the cent, and
        never less than
        the tier's minimum certificate premium.
      params: [building_rate_per_100, limit_rounding_increment, max_certificate_building_limit, minimum_certificate_premium]
    inputs:
      history:
        - {table: forceplaced_tracking, aggregate: latest, field: required_amount, filters: {event_type: forceplaced_notice_mailed, notice_type: FIRST_NOTICE}}
        - {table: forceplaced_claims, aggregate: sum, field: payment_amount, within_months: 36, filters: {event_type: forceplaced_claim_paid}}
        - {table: forceplaced_billing, aggregate: sum, field: amount, within_months: 36, filters: {event_type: forceplaced_lender_payment}}
        - {category: nfipcom, table: nfipcom_billing, aggregate: sum, field: amount, within_months: 12, filters: {event_type: nfipcom_premium_payment}}
      cross_category: [nfipcom]

  - id: forceplaced_ext_loan_event_credit
    base_policy_refs: [forceplaced_evidence_cancellation, forceplaced_loan_event_cancellation, forceplaced_agg_program_account]
    overwrite:
      - base_policy: forceplaced_loan_event_cancellation
        superseded_clause: >-
          Each uses its tier's refund method, PRO_RATA: the credit is the annual premium multiplied by the days from the
          cancellation effective date to the certificate expiration date divided by the days in the certificate term,
          rounded to the cent.
        replaced_by: >-
          For a loan event that the lender reports on the day it takes effect, on the certificate most recently issued
          under the program, and only for such an event, the loan-event credit is figured by this loan-event schedule;
          any other loan-event cancellation keeps the base treatment, under which the credit is the annual premium
          multiplied by the days from the cancellation effective date to the certificate expiration date divided by the
          days in the certificate term, rounded to the cent.
    trigger: on_request
    subject: [forceplaced_premium_credit]
    computes: credit_amount
    target_tool: cancel_certificate_for_loan_event_5b69d826
    params:
      short_days: 90
      mid_days: 180
      min_earned_share: 0.25
      three_keep: 80
      two_keep: 40
      fee_high_premium: 5000
      fee_mid_premium: 1000
      fee_high: 100
      fee_mid: 75
      late_long_days: 60
      late_mid_days: 30
      late_long_keep: 150
      late_mid_keep: 75
    rule: >
      For a loan event that the lender reports on the day it takes effect, on the certificate most recently issued
      under the program, and only for such an event, the loan-event credit is figured by this loan-event schedule;
      any other loan-event cancellation keeps the base treatment, under which the credit is the annual premium
      multiplied by the days from the cancellation effective date to the certificate expiration date divided by the
      days in the certificate term, rounded to the cent.
      The loan-event credit is fixed only after the loan carries a certificate issued on or after its latest
      first notice, once that notice's borrower notice period has run with no acceptable borrower evidence
      received since that notice.
      The certificate credited is the one on the issue entry with the latest processing date under the program, and its premium, start date and expiration date are those of its term in force, read from its latest renewal entry, or from its issue entry when it has no renewal entry; the cancellation takes effect today, the
      day the loan event takes effect.
      The loan-event credit is the certificate's premium multiplied by the days from today to its expiration date,
      divided by the days from its start date to its expiration date, rounded half to even to the cent and never below
      zero.
      When a claim on the certificate has a net payment above zero, the claim payments issued on it less the payments
      voided, no loan-event credit is given.
      Earned-premium method for a loan event: when the certificate has been in force fewer than 90 days, counted from
      its start date to today, Tidemark treats as earned the greater of one quarter of the premium and the premium
      multiplied by the days in force divided by the days in the term, and the loan-event credit is the premium less
      that earned amount; when it has been in force 90 to 180 days, the earned amount is the premium multiplied by the
      whole months in force plus one more month for the month in progress, divided by 12, and the credit is
      the premium less that earned amount; when it has been in force more than 180 days, the credit is figured pro rata
      by days as stated above.
      Re-placement retention for a loan event: Tidemark keeps, without taking the loan-event credit below zero, 80
      dollars of it when three or more certificates have been issued under the program on the credited certificate's loan
      number, 40 dollars when exactly two have, and nothing when only one has.
      Certificate fee retention: the certificate's issuance fee is fully earned, so Tidemark keeps, without
      taking the loan-event credit below zero, 100 dollars of it when the certificate's premium on its issue
      entry is 5,000 dollars or more, 75 dollars when that premium is at least 1,000 but below 5,000 dollars,
      and nothing when it is below 1,000 dollars.
      Late-placement retention: Tidemark keeps, without taking the loan-event credit below zero, 150 dollars of it when the certificate's issue entry was processed more than 60 days after the start date shown on that issue entry, 75 dollars when it was processed 31 to 60 days after that date, and nothing when it was processed 30 days or fewer after that date.
      For a loan event, months in force are whole calendar months from the start date to today, a month counting only
      once its day of the month is reached, and days between two dates are counted from the earlier date to the later
      date, the earlier date excluded and the later date included.
      When several issue entries share the latest processing date, the one entered first in the program's
      records is used, and a program with no issue entry has no certificate to credit.
      When the certificate so selected already carries a cancellation entry, it has already ended and the loan-event credit is zero.
    prerequisite:
      - problem: forceplaced_ext_commercial_placement_premium
        kind: value_input
        gate: c_prem
        form: state
        policy_source: >-
          The loan-event credit is fixed only after the loan carries a certificate issued on or after its latest
          first notice, once that notice's borrower notice period has run with no acceptable borrower evidence
          received since that notice.
        condition: >-
          The loan whose latest FIRST_NOTICE is more than borrower_notice_days old, with no acceptable evidence received
          on or after that notice, carries a forceplaced_certificate_issued entry with event_date on or after that notice
          date (backdated to the lapse date when the reporting window allows), with its NEW_PLACEMENT premium charge.
        resolved_by: issue_commercial_certificate_61c928bb
        effect: >-
          The placement issues the certificate whose premium, start date and expiration date the loan-event credit reads;
          without it there is no issued certificate for the loan and the credit is figured on a different certificate.
    cross_category: []
    compute:
      - c_cert: "LATEST('forceplaced_certificates', 'certificate_number', event_type='forceplaced_certificate_issued')"
      - c_prem: "LATEST('forceplaced_certificates', 'annual_premium', event_type='forceplaced_certificate_renewed', certificate_number=c_cert) or LATEST('forceplaced_certificates', 'annual_premium', event_type='forceplaced_certificate_issued', certificate_number=c_cert)"
      - c_start: "LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_renewed', certificate_number=c_cert) or LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_issued', certificate_number=c_cert)"
      - c_exp: "LATEST('forceplaced_certificates', 'certificate_expiration_date', event_type='forceplaced_certificate_renewed', certificate_number=c_cert) or LATEST('forceplaced_certificates', 'certificate_expiration_date', event_type='forceplaced_certificate_issued', certificate_number=c_cert)"
      - c_cancel: "COUNT('forceplaced_certificates', event_type='forceplaced_certificate_cancelled', certificate_number=c_cert)"
      - c_claimnet: "SUM('forceplaced_claims', 'payment_amount', event_type='forceplaced_claim_paid', certificate_number=c_cert) - SUM('forceplaced_claims', 'payment_amount', event_type='forceplaced_claim_payment_voided', certificate_number=c_cert)"
      - em_credit: "0 if not c_cert else (c_prem - MX(K('min_earned_share') * c_prem, c_prem * DAYS(c_start, NOW) / DAYS(c_start, c_exp)) if DAYS(c_start, NOW) < K('short_days') else ((c_prem - c_prem * (MONTHS(c_start, NOW) + 1) / 12) if DAYS(c_start, NOW) <= K('mid_days') else c_prem * DAYS(NOW, c_exp) / DAYS(c_start, c_exp)))"
      - lt_loan: "LATEST('forceplaced_certificates', 'loan_number', event_type='forceplaced_certificate_issued', certificate_number=c_cert)"
      - lt_count: "COUNT('forceplaced_certificates', event_type='forceplaced_certificate_issued', loan_number=lt_loan)"
      - lt_keep: "K('three_keep') if lt_count >= 3 else (K('two_keep') if lt_count == 2 else 0)"
      - fk_prem: "LATEST('forceplaced_certificates', 'annual_premium', event_type='forceplaced_certificate_issued', certificate_number=c_cert)"
      - fk_keep: "K('fee_high') if (fk_prem or 0) >= K('fee_high_premium') else (K('fee_mid') if (fk_prem or 0) >= K('fee_mid_premium') else 0)"
      - lp_issued: "LATEST('forceplaced_certificates', 'event_date', event_type='forceplaced_certificate_issued', certificate_number=c_cert)"
      - lp_start: "LATEST('forceplaced_certificates', 'coverage_effective_date', event_type='forceplaced_certificate_issued', certificate_number=c_cert)"
      - lp_keep: "0 if not c_cert else (K('late_long_keep') if DAYS(lp_start, lp_issued) > K('late_long_days') else (K('late_mid_keep') if DAYS(lp_start, lp_issued) > K('late_mid_days') else 0))"
      - result: "0 if c_claimnet > 0 or c_cancel > 0 or not c_cert else MX(0, RND(em_credit - lt_keep - fk_keep - lp_keep, 2))"
    compute_basis:
      lp_start: "150 dollars of it when the certificate's issue entry was processed more than 60 days after the start date shown on that issue entry"
      c_cancel: "When the certificate so selected already carries a cancellation entry, it has already ended and the loan-event credit is zero."
      c_cert: "The certificate credited is the one on the issue entry with the latest processing date under the program, and its premium, start date and expiration date are those of its term in force, read from its latest renewal entry, or from its issue entry when it has no renewal entry;"
      c_prem: "The certificate credited is the one on the issue entry with the latest processing date under the program, and its premium, start date and expiration date are those of its term in force, read from its latest renewal entry, or from its issue entry when it has no renewal entry;"
      c_start: "The certificate credited is the one on the issue entry with the latest processing date under the program, and its premium, start date and expiration date are those of its term in force, read from its latest renewal entry, or from its issue entry when it has no renewal entry;"
      c_exp: "The certificate credited is the one on the issue entry with the latest processing date under the program, and its premium, start date and expiration date are those of its term in force, read from its latest renewal entry, or from its issue entry when it has no renewal entry;"
      c_claimnet: "When a claim on the certificate has a net payment above zero, the claim payments issued on it less the payments voided, no loan-event credit is given."
      em_credit: "Earned-premium method for a loan event: when the certificate has been in force fewer than 90 days, counted from its start date to today, Tidemark treats as earned the greater of one quarter of the premium and the premium multiplied by the days in force divided by the days in the term, and the loan-event credit is the premium less that earned amount; when it has been in force 90 to 180 days, the earned amount is the premium multiplied by the whole months in force plus one more month for the month in progress, divided by 12, and the credit is the premium less that earned amount; when it has been in force more than 180 days, the credit is figured pro rata by days as stated above."
      lt_loan: "when three or more certificates have been issued under the program on the credited certificate's loan number"
      lt_count: "when three or more certificates have been issued under the program on the credited certificate's loan number"
      lt_keep: "Re-placement retention for a loan event: Tidemark keeps, without taking the loan-event credit below zero, 80 dollars of it when three or more certificates have been issued under the program on the credited certificate's loan number, 40 dollars when exactly two have, and nothing when only one has."
      fk_prem: "100 dollars of it when the certificate's premium on its issue entry is 5,000 dollars or more"
      fk_keep: "Certificate fee retention: the certificate's issuance fee is fully earned, so Tidemark keeps, without taking the loan-event credit below zero, 100 dollars of it when the certificate's premium on its issue entry is 5,000 dollars or more, 75 dollars when that premium is at least 1,000 but below 5,000 dollars, and nothing when it is below 1,000 dollars."
      lp_issued: "150 dollars of it when the certificate's issue entry was processed more than 60 days after the start date shown on that issue entry"
      lp_keep: "Late-placement retention: Tidemark keeps, without taking the loan-event credit below zero, 150 dollars of it when the certificate's issue entry was processed more than 60 days after the start date shown on that issue entry, 75 dollars when it was processed 31 to 60 days after that date, and nothing when it was processed 30 days or fewer after that date."
      result: "The loan-event credit is the certificate's premium multiplied by the days from today to its expiration date, divided by the days from its start date to its expiration date, rounded half to even to the cent and never below zero."
    factors:
      - id: earned_method
        effect: method
        decides: em_credit
        bindings: [em_credit]
        ladder:
          - {when: "the certificate has been in force fewer than 90 days", method: "minimum-earned: premium less the greater of one quarter of the premium and the pro rata earned premium"}
          - {when: "it has been in force 90 to 180 days", method: "monthly: premium less premium x (whole months in force + 1) / 12"}
          - {when: "otherwise (more than 180 days)", method: "pro rata by days from today to expiration over the days in the term"}
        baseline: {em_credit: "0 if not c_cert else c_prem * DAYS(NOW, c_exp) / DAYS(c_start, c_exp)"}
        evidence: [history, date]
        cross_difficulty: null
      - id: replacement_keep
        effect: parameter
        decides: lt_keep
        bindings: [lt_loan, lt_count, lt_keep]
        ladder:
          - {when: "three or more certificates have been issued under the program on the loan number", value: "K('three_keep')"}
          - {when: "exactly two have", value: "K('two_keep')"}
          - {when: "otherwise (only one)", value: "0"}
        baseline: {lt_keep: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: certificate_fee_keep
        effect: parameter
        decides: fk_keep
        bindings: [fk_prem, fk_keep]
        ladder:
          - {when: "the certificate's premium on its issue entry is 5,000 dollars or more", value: "K('fee_high')"}
          - {when: "it is at least 1,000 but below 5,000 dollars", value: "K('fee_mid')"}
