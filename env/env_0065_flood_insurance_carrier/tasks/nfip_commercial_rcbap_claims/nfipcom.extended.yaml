      and those of the term before it for the days from the cancellation effective date to the current term_start over the
      days of the current term, or in full when the cancellation took effect on or before that term's start; otherwise the
      current term's ICC premium charges are returned for the days from the cancellation effective date to term_end over the
      days of the current term. The Reserve Fund Assessment a cancellation refund returns is settled as follows: when the reason refunds from inception, the Reserve Fund Assessment charges of the current term and the term before it are returned in full, less their re-rate credits; when the claim bar set out above applies, nothing of the current term's Reserve Fund Assessment is returned; when the policy's latest Reserve Fund Assessment booked on an endorsement or its latest one credited on a re-rate belongs to the term in which the cancellation took effect, that term's Reserve Fund Assessment entries are returned the way their own occasions are, the term's other Reserve Fund Assessment charges for the days from the cancellation effective date to the end of that term over the days of the current term, that endorsement's charge for those days over the days from the endorsement's effective date to the end of that term, or in full when the endorsement took effect after the cancellation effective date, and that re-rate credit taken back for those days over the days from the certificate's effective date to the end of that term, or in full when the certificate took effect after the cancellation effective date, and the Reserve Fund Assessment charges of a term that began after the cancellation took effect are returned in full, less the re-rate credits booked on them; when the cancellation took effect before the current term_start, the current term's Reserve Fund Assessment charges are returned in full, less the re-rate credits booked on them, and those of the term before it for the days from the cancellation effective date to the current term_start over the days of the current term, or in full, less the re-rate credits booked on them, when the cancellation took effect on or before that term's start; otherwise the current term's Reserve Fund Assessment charges are returned for the days from the cancellation effective date to term_end over the days of the current term. The Federal Policy Fee a cancellation refund returns is
      settled as follows: when the reason refunds from inception, the Federal Policy Fees of the current term and the term
      before it; when the cancellation took effect before the current term_start, the current term's Federal Policy Fee in
      full; otherwise none. The probation surcharge a cancellation refund returns is settled as follows: when the reason
      refunds from inception, the probation surcharges of the current term and the term before it; when the cancellation
      took effect before the current term_start, the current term's probation surcharge in full; otherwise none. The premium
      received but not owed is settled as follows: when a payment has been posted for a term that has not yet begun, it is
      that whole payment plus the amount by which the payments posted for each term the cancellation returns exceed that
      term's charges; when the payments posted for a term the cancellation returns exceed that term's charges, it is that excess; otherwise there is none. Whichever case applies, the premium received but not owed is reduced, never below zero, by the amount by which the refunds already disbursed on the policy exceed the premium credits booked on it other than cancellation credits.
    prerequisite:
      - problem: nfipcom_ext_cancellation_credit
        kind: value_input
        gate: xr_risk
        form: state
        policy_source: >-
          A cancellation refund is fixed only after the policy shows the cancellation processed on the signed request, cancelled with its cancellation effective date set.
        condition: >-
          The nfipcom_policies row is cancelled with cancellation_effective_date set and cancellation_reason equal to the
          signed nfipcom_requests entry's cancellation_reason.
        resolved_by: process_cancellation_a892a1e4
        effect: >-
          With the cancellation processed, the refund reads the cancellation effective date from the policy and the risk
          premium CANCELLATION credit referencing the request, so its credits are worked out from that date and the risk
          premium credit enters the refund.
    cross_category: []
    compute:
      - xr_req_cr: "LATEST('nfipcom_billing', 'reference_id', date_field='posted_date', event_type='nfipcom_premium_credit', charge_basis='CANCELLATION', component='RISK_PREMIUM')"
      - xr_req_id: "xr_req_cr if xr_req_cr != None else LATEST('nfipcom_requests', 'nfipcom_request_id', date_field='created_at', request_type='CANCELLATION', outcome='SIGNED')"
      - xr_reason: "F('cancellation_reason')"
      - xr_risk: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_credit', charge_basis='CANCELLATION', component='RISK_PREMIUM', reference_id=xr_req_id)"
      - xr_eff: "F('cancellation_effective_date') if F('cancellation_effective_date') else LATEST('nfipcom_requests', 'created_at', date_field='created_at', request_type='CANCELLATION', outcome='SIGNED')"
      - xr_term_days: "DAYS(F('term_start'), F('term_end'))"
      - xr_in_cur: "DAYS(F('term_start'), xr_eff) >= 0"
      - xr_eff_end: "F('term_end') if xr_in_cur else F('term_start')"
      - xr_prev_full: "(not xr_in_cur) and MONTHS(xr_eff, F('term_start')) >= 12"
      - xr_incep: "xr_reason == 'DUPLICATE_NFIP_POLICY' or xr_reason == 'CLOSING_DID_NOT_OCCUR'"
      - xr_ldol: "MONTHS(F('term_start'), NOW)"
      - xr_netin: "RND(SUM('nfipcom_claims', 'payment_amount', within_months=xr_ldol, date_field='date_of_loss', event_type='nfipcom_claim_paid') - SUM('nfipcom_claims', 'payment_amount', within_months=xr_ldol, date_field='date_of_loss', event_type='nfipcom_claim_payment_voided'), 2)"
      - xr_netall: "RND(SUM('nfipcom_claims', 'payment_amount', within_months=xr_ldol + 1, date_field='date_of_loss', event_type='nfipcom_claim_paid') - SUM('nfipcom_claims', 'payment_amount', within_months=xr_ldol + 1, date_field='date_of_loss', event_type='nfipcom_claim_payment_voided'), 2)"
      - xr_dp: "LATEST('nfipcom_claims', 'date_of_loss', date_field='date_of_loss', event_type='nfipcom_claim_paid')"
      - xr_netdp: "RND(SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', date_of_loss=xr_dp) - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', date_of_loss=xr_dp), 2)"
      - xr_dpband: "xr_dp != None and MONTHS(xr_dp, NOW) == xr_ldol"
      - xr_held: "xr_netin <= 0 and xr_netall - xr_netin > 0 and not (xr_dpband and (DAYS(F('term_start'), xr_dp) < 0 or xr_netdp > 0))"
      - xr_paidcur: "xr_netin > 0 or (xr_netall - xr_netin > 0 and xr_dpband and DAYS(F('term_start'), xr_dp) >= 0 and xr_netdp > 0)"
      - xr_barred: "xr_reason in K('claim_bar_reasons') and xr_in_cur and (xr_paidcur or xr_held)"
      - xr_h_cur: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='HFIAA_SURCHARGE', term_start=F('term_start'))"
      - xr_h_prev: "RND(SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', component='HFIAA_SURCHARGE') - xr_h_cur, 2)"
      - xr_hfiaa: "(RND(xr_h_cur + xr_h_prev, 2) if xr_prev_full else RND(xr_h_cur + RND(xr_h_prev * DAYS(xr_eff, F('term_start')) / xr_term_days + 0.0000001, 2), 2)) if not xr_in_cur else (0 if xr_barred else RND(xr_h_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2))"
      - xr_i_cur: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='ICC_PREMIUM', term_start=F('term_start'))"
      - xr_i_prev: "RND(SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', component='ICC_PREMIUM') - xr_i_cur, 2)"
      - xr_icc: "0 if P('icc_available') == False else ((RND(xr_i_cur + xr_i_prev, 2) if xr_prev_full else RND(xr_i_cur + RND(xr_i_prev * DAYS(xr_eff, F('term_start')) / xr_term_days + 0.0000001, 2), 2)) if not xr_in_cur else (0 if xr_barred else RND(xr_i_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2)))"
      - xr_r_cur: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='RESERVE_FUND_ASSESSMENT', term_start=F('term_start'))"
      - xr_r_two: "SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', component='RESERVE_FUND_ASSESSMENT')"
      - xr_rc_cur: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RESERVE_FUND_ASSESSMENT', term_start=F('term_start'))"
      - xr_rc_two: "SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RESERVE_FUND_ASSESSMENT')"
      - xr_endo_id: "LATEST('nfipcom_billing', 'reference_id', date_field='posted_date', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RESERVE_FUND_ASSESSMENT')"
      - xr_endo_rfa: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RESERVE_FUND_ASSESSMENT', reference_id=xr_endo_id)"
      - xr_endo_ts: "LATEST('nfipcom_billing', 'term_start', date_field='posted_date', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RESERVE_FUND_ASSESSMENT', reference_id=xr_endo_id)"
      - xr_endo_eff: "LATEST('nfipcom_changes', 'change_effective_date', date_field='recorded_date', nfipcom_change_id=xr_endo_id)"
      - xr_rr_id: "LATEST('nfipcom_billing', 'reference_id', date_field='posted_date', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RESERVE_FUND_ASSESSMENT')"
      - xr_rr_rfa: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RESERVE_FUND_ASSESSMENT', reference_id=xr_rr_id)"
      - xr_rr_ts: "LATEST('nfipcom_billing', 'term_start', date_field='posted_date', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RESERVE_FUND_ASSESSMENT', reference_id=xr_rr_id)"
      - xr_ec_eff: "LATEST('nfipcom_changes', 'change_effective_date', date_field='recorded_date', nfipcom_change_id=xr_rr_id)"
      - xr_eff_ts_ok_e: "xr_endo_id != None and ((xr_in_cur and xr_endo_ts == F('term_start')) or ((not xr_in_cur) and xr_endo_ts != F('term_start') and MONTHS(xr_endo_ts, F('term_start')) == 12))"
      - xr_eff_ts_ok_r: "xr_rr_id != None and ((xr_in_cur and xr_rr_ts == F('term_start')) or ((not xr_in_cur) and xr_rr_ts != F('term_start') and MONTHS(xr_rr_ts, F('term_start')) == 12))"
      - xr_r_term: "RND(xr_r_cur - (xr_endo_rfa if (xr_eff_ts_ok_e and xr_in_cur) else 0), 2) if xr_in_cur else RND(xr_r_two - xr_r_cur - (xr_endo_rfa if xr_eff_ts_ok_e else 0), 2)"
      - xr_endo_part: "(xr_endo_rfa if DAYS(xr_eff, xr_endo_eff) > 0 else RND(xr_endo_rfa * DAYS(xr_eff, xr_eff_end) / DAYS(xr_endo_eff, xr_eff_end) + 0.0000001, 2)) if xr_eff_ts_ok_e else 0"
      - xr_rr_part: "(xr_rr_rfa if DAYS(xr_eff, xr_ec_eff) > 0 else RND(xr_rr_rfa * DAYS(xr_eff, xr_eff_end) / DAYS(xr_ec_eff, xr_eff_end) + 0.0000001, 2)) if xr_eff_ts_ok_r else 0"
      - xr_r_prev: "RND(xr_r_two - xr_r_cur, 2)"
      - xr_rc_prev: "RND(xr_rc_two - xr_rc_cur, 2)"
      - xr_rfa: "RND(xr_r_two - xr_rc_two, 2) if xr_incep else (0 if xr_barred else (RND(RND(xr_r_term * DAYS(xr_eff, xr_eff_end) / xr_term_days + 0.0000001, 2) + xr_endo_part - xr_rr_part + (0 if xr_in_cur else RND(xr_r_cur - xr_rc_cur, 2)), 2) if ((xr_eff_ts_ok_e or xr_eff_ts_ok_r) and MONTHS(xr_eff, F('term_start')) < 12) else (RND(RND(xr_r_cur - xr_rc_cur, 2) + (RND(xr_r_prev - xr_rc_prev, 2) if xr_prev_full else RND(xr_r_prev * DAYS(xr_eff, F('term_start')) / xr_term_days + 0.0000001, 2)), 2) if not xr_in_cur else RND(xr_r_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2))))"
      - xr_f_cur: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='FEDERAL_POLICY_FEE', term_start=F('term_start'))"
      - xr_fpf: "SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', component='FEDERAL_POLICY_FEE') if xr_incep else (xr_f_cur if not xr_in_cur else 0)"
      - xr_p_cur: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='PROBATION_SURCHARGE', term_start=F('term_start'))"
      - xr_prob: "SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', component='PROBATION_SURCHARGE') if xr_incep else (xr_p_cur if not xr_in_cur else 0)"
      - xr_pay_all: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_payment')"
      - xr_pay_future: "RND(xr_pay_all - SUM('nfipcom_billing', 'amount', within_months=1200, date_field='term_start', event_type='nfipcom_premium_payment'), 2)"
      - xr_ex_cur: "MX(0, RND(SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_payment', term_start=F('term_start')) - SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', term_start=F('term_start')), 2))"
      - xr_ex_prev: "MX(0, RND(SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_payment') - SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_payment', term_start=F('term_start')) - SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged') + SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', term_start=F('term_start')), 2)) if not xr_in_cur else 0"
      - xr_refd: "MX(0, RND(SUM('nfipcom_billing', 'amount', event_type='nfipcom_refund_disbursed') - SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_credit') + SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_credit', charge_basis='CANCELLATION'), 2))"
      - xr_excess: "MX(0, RND((RND(xr_pay_future + xr_ex_cur + xr_ex_prev, 2) if xr_pay_future > 0 else (RND(xr_ex_cur + xr_ex_prev, 2) if xr_ex_cur + xr_ex_prev > 0 else 0)) - xr_refd, 2))"
      - xr_n_endo2: "COUNT('nfipcom_billing', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RISK_PREMIUM')"
      - xr_n_rr2: "COUNT('nfipcom_billing', within_months=24, date_field='term_start', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM')"
      - xr_scope: "xr_n_endo2 <= 1 and xr_n_rr2 <= 1"
      - xr_base_other: "(SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='ICC_PREMIUM') + SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='RESERVE_FUND_ASSESSMENT') + SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='HFIAA_SURCHARGE') + SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='FEDERAL_POLICY_FEE') + SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='PROBATION_SURCHARGE')) if xr_incep else (0 if xr_barred else ((xr_i_cur + xr_r_cur + xr_h_cur) if xr_reason == 'REMOVED_FROM_SFHA_BY_LOMA_LOMR' else (RND(xr_i_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2) + RND(xr_r_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2) + RND(xr_h_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2))))"
      - result: "MX(0, RND(xr_risk + xr_icc + xr_rfa + xr_hfiaa + xr_fpf + xr_prob + xr_excess + 0.0000001, 2)) if xr_scope else MX(0, RND(xr_risk + xr_base_other + 0.0000001, 2))"
    compute_basis:
      xr_held: "when the records cannot place such a paid loss on either side of the current term_start"
      xr_scope: "only while the current term and the term before it together carry at most one premium-bearing endorsement and at most one re-rate credit, each counted by its risk premium entries,"
      xr_base_other: "when those terms carry more than one premium-bearing endorsement or more than one re-rate credit, the case the premium-received and fee sentences of this rule leave to the base clause, the base clause applies to those credits as written"
      xr_req_id: "each referencing the cancellation request"
      xr_risk: "the risk premium credit is booked when the cancellation is processed"
      xr_eff: "the policy shows the cancellation processed on the signed request, cancelled with its cancellation effective date set."
      xr_prev_full: "or in full when the cancellation took effect on or before that term's start"
      xr_incep: "when the reason refunds from inception"
      xr_barred: "For the ICC premium, Reserve Fund Assessment and HFIAA surcharge credits a cancellation refund books for the current term, and only for those credits, the claim bar is read as the sentences below set out, the current term's return being held where the records cannot place a paid loss on either side of the current term_start; the risk premium credit follows the cancellation processing rule's claim bar, and in every other case the claim bar stands as the base cancellation rule states it. Under a reason that bars a refund once a claim has been paid, when the cancellation took effect in the current term and a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero, nothing of the current term is returned; when the records cannot place such a paid loss on either side of the current term_start, that is when no loss dated after the month band around the current term_start carries such payments, a loss dated in that band does, and the latest loss on which a claim payment was ever issued is dated after the band, or is dated in the band on or after the current term_start with its payments all voided, the month band being the losses dated as many whole calendar months before the processing date as the current term_start is, this schedule holds the current term's return: nothing of the current term is returned by these credits and the other parts are returned as worked out, which departs from the base claim bar for that case only; in every other case the claim bar stands as the base cancellation rule states it: no refund at all is due for the current term under the reasons in claim_bar_reasons when a claim with a date of loss in the current term has been paid or is still open."
      xr_hfiaa: "The HFIAA surcharge is returned the way the risk premium is: when the cancellation took effect before the current term_start, the current term's HFIAA surcharge in full and the term before it for the days from the cancellation effective date to the current term_start over the days of the current term, or in full when the cancellation took effect on or before that term's start; otherwise the current term's HFIAA surcharge for the days from the cancellation effective date to term_end over the days of the current term."
      xr_icc: "when the policy's tier carries no ICC coverage, nothing is returned; when the cancellation took effect before the current term_start, the current term's ICC premium charges are returned in full and those of the term before it for the days from the cancellation effective date to the current term_start over the days of the current term, or in full when the cancellation took effect on or before that term's start; otherwise the current term's ICC premium charges are returned for the days from the cancellation effective date to term_end over the days of the current term."
      xr_rfa: "when the reason refunds from inception, the Reserve Fund Assessment charges of the current term and the term before it are returned in full, less their re-rate credits; when the claim bar set out above applies, nothing of the current term's Reserve Fund Assessment is returned; when the policy's latest Reserve Fund Assessment booked on an endorsement or its latest one credited on a re-rate belongs to the term in which the cancellation took effect, that term's Reserve Fund Assessment entries are returned the way their own occasions are, the term's other Reserve Fund Assessment charges for the days from the cancellation effective date to the end of that term over the days of the current term, that endorsement's charge for those days over the days from the endorsement's effective date to the end of that term, or in full when the endorsement took effect after the cancellation effective date, and that re-rate credit taken back for those days over the days from the certificate's effective date to the end of that term, or in full when the certificate took effect after the cancellation effective date, and the Reserve Fund Assessment charges of a term that began after the cancellation took effect are returned in full, less the re-rate credits booked on them; when the cancellation took effect before the current term_start, the current term's Reserve Fund Assessment charges are returned in full, less the re-rate credits booked on them, and those of the term before it for the days from the cancellation effective date to the current term_start over the days of the current term, or in full, less the re-rate credits booked on them, when the cancellation took effect on or before that term's start; otherwise the current term's Reserve Fund Assessment charges are returned for the days from the cancellation effective date to term_end over the days of the current term."
      xr_fpf: "when the reason refunds from inception, the Federal Policy Fees of the current term and the term before it; when the cancellation took effect before the current term_start, the current term's Federal Policy Fee in full; otherwise none."
      xr_prob: "when the reason refunds from inception, the probation surcharges of the current term and the term before it; when the cancellation took effect before the current term_start, the current term's probation surcharge in full; otherwise none."
      xr_excess: "when a payment has been posted for a term that has not yet begun, it is that whole payment plus the amount by which the payments posted for each term the cancellation returns exceed that term's charges; when the payments posted for a term the cancellation returns exceed that term's charges, it is that excess; otherwise there is none. Whichever case applies, the premium received but not owed is reduced, never below zero, by the amount by which the refunds already disbursed on the policy exceed the premium credits booked on it other than cancellation credits."
      result: "The cancellation refund adds up every CANCELLATION credit referencing the signed request, those booked at processing and those this refund books, and, where the booking sentence above adds it, the premium received but not owed; each credit is rounded half-up to the cent before they are added, and the refund is never below zero."
    factors:
      - id: rfd_icc_return
        effect: method
        decides: xr_icc
        bindings: [xr_i_cur, xr_i_prev, xr_icc]
        ladder:
          - when: "the policy's tier carries no ICC coverage"
            method: "nothing is returned"
          - when: "the cancellation took effect before the current term_start"
            method: "the current term's ICC premium charges are returned in full and those of the term before it for the days from the cancellation effective date to the current term_start over the days of the current term, or in full when the cancellation took effect on or before that term's start"
          - when: "otherwise"
            method: "the current term's ICC premium charges are returned for the days from the cancellation effective date to term_end over the days of the current term"
        baseline:
          xr_icc: "RND(xr_i_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2)"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: rfd_rfa_return
        effect: method
        decides: xr_rfa
        bindings: [xr_eff_end, xr_r_cur, xr_r_two, xr_rc_cur, xr_rc_two, xr_endo_id, xr_endo_rfa, xr_endo_ts, xr_endo_eff, xr_rr_id, xr_rr_rfa, xr_rr_ts, xr_ec_eff, xr_eff_ts_ok_e, xr_eff_ts_ok_r, xr_r_term, xr_endo_part, xr_rr_part, xr_r_prev, xr_rc_prev, xr_rfa]
        ladder:
          - when: "the reason refunds from inception"
            method: "the Reserve Fund Assessment charges of the current term and the term before it are returned in full, less their re-rate credits"
          - when: "the claim bar applies: a reason that bars a refund once a claim has been paid, the cancellation taking effect in the current term, and a loss dated in that term carrying claim payments standing net of voided items, where the records place that loss, or the records cannot place a paid loss and the current term's return is held"
            method: "nothing of the current term's Reserve Fund Assessment is returned"
          - when: "the policy's latest Reserve Fund Assessment booked on an endorsement or its latest one credited on a re-rate belongs to the term in which the cancellation took effect"
            method: "that term's Reserve Fund Assessment entries are returned the way their own occasions are, and the Reserve Fund Assessment charges of a term that began after the cancellation took effect are returned in full, less the re-rate credits booked on them"
          - when: "the cancellation took effect before the current term_start"
            method: "the current term's Reserve Fund Assessment charges are returned in full, less the re-rate credits booked on them, and those of the term before it for the days from the cancellation effective date to the current term_start over the days of the current term, or in full, less the re-rate credits booked on them, when the cancellation took effect on or before that term's start"
          - when: "otherwise"
            method: "the current term's Reserve Fund Assessment charges are returned for the days from the cancellation effective date to term_end over the days of the current term"
        baseline:
          xr_rfa: "RND(xr_r_cur * DAYS(xr_eff, F('term_end')) / xr_term_days + 0.0000001, 2)"
        evidence: [history, date]
        cross_difficulty: null
      - id: rfd_policy_fee_return
        effect: parameter
        decides: xr_fpf
        bindings: [xr_f_cur, xr_fpf]
        ladder:
          - when: "the reason refunds from inception"
            value: "the Federal Policy Fees of the current term and the term before it"
          - when: "the cancellation took effect before the current term_start"
            value: "the current term's Federal Policy Fee in full"
          - when: "otherwise"
            value: "none"
        baseline:
          xr_fpf: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: rfd_probation_return
        effect: parameter
        decides: xr_prob
        bindings: [xr_p_cur, xr_prob]
        ladder:
          - when: "the reason refunds from inception"
            value: "the probation surcharges of the current term and the term before it"
          - when: "the cancellation took effect before the current term_start"
            value: "the current term's probation surcharge in full"
          - when: "otherwise"
            value: "none"
        baseline:
          xr_prob: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: rfd_excess_payment
        effect: parameter
        decides: xr_excess
        bindings: [xr_pay_all, xr_pay_future, xr_ex_cur, xr_ex_prev, xr_refd, xr_excess]
        ladder:
          - when: "a payment has been posted for a term that has not yet begun"
            value: "that whole payment plus the amount by which the payments posted for each term the cancellation returns exceed that term's charges"
          - when: "the payments posted for a term the cancellation returns exceed that term's charges"
            value: "that excess"
          - when: "otherwise"
            value: "none"
        baseline:
          xr_excess: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The cancellation refund adds up every CANCELLATION credit referencing the signed request, those booked at processing and those this refund books, and, where the booking sentence above adds it, the premium received but not owed; each credit is rounded half-up to the cent before they are added, and the refund is never below zero. In the
        standard refund working the ICC premium and the Reserve Fund Assessment of the current term are returned for the
        days from the cancellation effective date to term_end over the days of the current term, the Federal Policy Fee and
        probation surcharge are fully earned, and no premium is treated as received but not owed. The HFIAA surcharge is
        returned the way the risk premium is: when the cancellation took effect before the current term_start, the current
        term's HFIAA surcharge in full and the term before it for the days from the cancellation effective date to the
        current term_start over the days of the current term, or in full when the cancellation took effect on or before that
        term's start; otherwise the current term's HFIAA surcharge for the days from the cancellation effective date to
        term_end over the days of the current term. For the ICC premium, Reserve Fund Assessment and HFIAA surcharge credits a cancellation refund books for the current term, and only for those credits, the claim bar is read as the sentences below set out, the current term's return being held where the records cannot place a paid loss on either side of the current term_start; the risk premium credit follows the cancellation processing rule's claim bar, and in every other case the claim bar stands as the base cancellation rule states it. Under a reason that bars a refund once a claim has been paid, when the cancellation took effect in the current term and a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero, nothing of the current term is returned; when the records cannot place such a paid loss on either side of the current term_start, that is when no loss dated after the month band around the current term_start carries such payments, a loss dated in that band does, and the latest loss on which a claim payment was ever issued is dated after the band, or is dated in the band on or after the current term_start with its payments all voided, the month band being the losses dated as many whole calendar months before the processing date as the current term_start is, this schedule holds the current term's return: nothing of the current term is returned by these credits and the other parts are returned as worked out, which departs from the base claim bar for that case only; in every other case the claim bar stands as the base cancellation rule states it: no refund at all is due for the current term under the reasons in claim_bar_reasons when a claim with a date of loss in the current term has been paid or is still open. For the refund credits the term before the
        current one ends at the current term_start and its days are counted as those of the current term.
      params: []
    inputs:
      history:
        - {table: nfipcom_billing, aggregate: sum, field: amount, filters: {event_type: nfipcom_premium_credit, charge_basis: CANCELLATION}}
        - {table: nfipcom_billing, aggregate: sum, field: amount, filters: {event_type: nfipcom_premium_charged, component: ICC_PREMIUM}}
        - {table: nfipcom_billing, aggregate: sum, field: amount, filters: {event_type: nfipcom_premium_charged, component: RESERVE_FUND_ASSESSMENT}}
        - {table: nfipcom_billing, aggregate: sum, field: amount, filters: {event_type: nfipcom_premium_payment}}
        - {table: nfipcom_requests, aggregate: latest, field: cancellation_reason, filters: {outcome: SIGNED}}
      cross_category: []



