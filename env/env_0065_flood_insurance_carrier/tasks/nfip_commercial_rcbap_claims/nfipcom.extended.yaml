      params: []
    inputs:
      history:
        - {table: nfipcom_claims, aggregate: latest, field: building_rcv_loss, filters: {event_type: nfipcom_adjuster_report}}
        - {table: nfipcom_claims, aggregate: sum, field: claimed_amount, filters: {event_type: nfipcom_proof_of_loss_filed, coverage_part: BUILDING}}
        - {table: nfipcom_claims, aggregate: sum, field: payment_amount, filters: {event_type: nfipcom_claim_paid, coverage_part: BUILDING}}
        - {table: nfipcom_billing, aggregate: count, field: amount, filters: {event_type: nfipcom_premium_charged, charge_basis: RENEWAL}}
        - {category: bizflood, table: bizflood_claims, aggregate: latest, field: location_value_at_loss, filters: {event_type: bizflood_adjuster_report}}
