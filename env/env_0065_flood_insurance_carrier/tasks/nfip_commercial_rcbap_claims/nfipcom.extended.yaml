      cp_ded: "when the building limit is above the deductible threshold, the contents deductible shown on the policy is below the higher minimum building deductible and the premium account shows a renewal risk premium charge, it is that higher minimum; when the building limit is at or below the deductible threshold, the contents deductible shown on the policy is below the tier's minimum contents deductible and the premium account shows a renewal risk premium charge, it is that minimum contents deductible; otherwise it is the contents deductible shown on the policy."
      cp_net: "The contents loss is held to the contents value ceiling, the contents deductible is then subtracted, the remainder is held between zero and the contents limit"
      cp_prev: "when the claim carries contents proofs of loss and the latest of them was received no later than the proof-of-loss period after the date of loss, counted by adding the days to the date of loss on the calendar, the amounts sworn on them are added together; when the claim carries no contents proof of loss whose latest was received within that period but contents payments were issued on the claim on the adjuster's report signed in lieu of a proof of loss, the contents payment items voided on the claim are subtracted from the contents payments issued on it; otherwise nothing is already sworn on the claim."
      cp_dup: "when contents proofs of loss were filed under that number, it is the amounts sworn on them; when no contents proof of loss was filed for the date of loss under either number but contents payments were issued under that number, it is those payments less the contents payment items voided under it; otherwise it is nothing."
      result: "the contents amount already sworn on the claim and the contents amount already sworn under a duplicate claim number are subtracted, the amount sworn never going below zero. Every amount in the contents working is rounded half-up to the cent."
    factors:
      - id: cpol_report_choice
        effect: parameter
        decides: cp_gov_date
        bindings: [cp_n_final, cp_n_supp, cp_final_date, cp_supp_date, cp_supp_cont, cp_prelim_date, cp_gov_date, cp_gov_type]
        ladder:
          - when: "the claim's latest SUPPLEMENTAL report was filed after its latest FINAL report and measures a contents loss above zero"
            value: "that SUPPLEMENTAL report"
          - when: "the claim has no FINAL report"
            value: "the claim's latest PRELIMINARY report"
          - when: "otherwise"
            value: "the claim's latest FINAL report"
        baseline:
          cp_gov_date: "cp_final_date"
          cp_gov_type: "'FINAL'"
        evidence: [history, date]
        cross_difficulty: null
      - id: cpol_value_ceiling
        effect: parameter
        decides: cp_ceiling
        bindings: [cp_bz, cp_bz_eff, cp_bz_cxl, cp_bz_end, cp_bz_in, cp_sov_cont, cp_n_inc, cp_inc_eff, cp_inc_cont, cp_n_dec, cp_dec_eff, cp_dec_cont, cp_inc_rec, cp_dec_rec, cp_inc_ok, cp_dec_ok, cp_chg_eff, cp_chg_cont, cp_one, cp_ceiling]
        ladder:
          - when: "the BizFlood policy that schedules the building's address and was in force on the date of loss declares a contents value for the address and a value endorsement for that location was in force on the date of loss, the address appearing on one BizFlood statement of values and that policy holding at most one value increase and at most one value decrease for it"
            value: "the contents limit set by the value endorsement in force on the date of loss"
          - when: "that BizFlood policy declares a contents value for the address and no value endorsement for that location was in force on the date of loss, the address appearing on one BizFlood statement of values and that policy holding at most one value increase and at most one value decrease for it"
            value: "the contents value on its statement of values"
          - when: "otherwise"
            value: "the contents limit"
        baseline:
          cp_ceiling: "F('contents_coverage')"
        evidence: [cross_category, date]
        cross_difficulty: bizflood
      - id: cpol_deductible_floor
        effect: parameter
        decides: cp_ded
        bindings: [cp_n_renewal, cp_ded]
        ladder:
          - when: "the building limit is above the deductible threshold, the contents deductible shown on the policy is below the higher minimum building deductible and the premium account shows a renewal risk premium charge"
            value: "the higher minimum building deductible"
          - when: "the building limit is at or below the deductible threshold, the contents deductible shown on the policy is below the tier's minimum contents deductible and the premium account shows a renewal risk premium charge"
            value: "the tier's minimum contents deductible"
          - when: "otherwise"
            value: "the contents deductible shown on the policy"
        baseline:
          cp_ded: "F('contents_deductible')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: cpol_prior_sworn
        effect: method
        decides: cp_prev
        bindings: [cp_n_pol, cp_pol_sum, cp_pol_last, cp_paid_lieu, cp_prev]
        ladder:
          - when: "the claim carries contents proofs of loss and the latest of them was received no later than the proof-of-loss period after the date of loss"
            method: "the amounts sworn on those proofs of loss are added together"
          - when: "the claim carries no contents proof of loss whose latest was received within that period but contents payments were issued on the claim on the adjuster's report signed in lieu of a proof of loss"
            method: "the contents payment items voided on the claim are subtracted from the contents payments issued on it"
          - when: "otherwise"
            method: "nothing is treated as already sworn on the claim"
        baseline:
          cp_prev: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cpol_duplicate_sworn
        effect: parameter
        decides: cp_dup
        bindings: [cp_pol_dol, cp_dup_pol, cp_paid_dol, cp_dup_paid, cp_dup]
        ladder:
          - when: "contents proofs of loss were filed under a duplicate claim number reported for the same date of loss"
            value: "the amounts sworn on them"
          - when: "no contents proof of loss was filed for the date of loss under either number but contents payments were issued under the duplicate claim number"
            value: "those payments less the contents payment items voided under it"
          - when: "otherwise"
            value: "nothing"
        baseline:
          cp_dup: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The contents amount sworn on a contents proof of loss is worked out from the contents loss at actual cash value on
        the claim's FINAL adjuster report. In the standard working the contents value ceiling is the contents limit, the
        contents deductible subtracted is the one shown on the policy, and no contents amount is treated as already sworn on
        the claim or under a duplicate claim number. The working applies its steps in this order: the contents value ceiling
        first, then the deductible, then the contents limit, then what is already sworn. The contents loss is held to the
        contents value ceiling, the contents deductible is then subtracted, the remainder is held between zero and the
        contents limit, and the contents amount already sworn on the claim and the contents amount already sworn under a
        duplicate claim number are subtracted, the amount sworn never going below zero. Every amount in the contents working
        is rounded half-up to the cent.
      params: []
    inputs:
      history:
        - {table: nfipcom_claims, aggregate: latest, field: contents_acv_loss, filters: {event_type: nfipcom_adjuster_report}}
        - {table: nfipcom_claims, aggregate: sum, field: claimed_amount, filters: {event_type: nfipcom_proof_of_loss_filed, coverage_part: CONTENTS}}
        - {table: nfipcom_claims, aggregate: sum, field: payment_amount, filters: {event_type: nfipcom_claim_paid, coverage_part: CONTENTS}}
        - {table: nfipcom_billing, aggregate: count, field: amount, filters: {event_type: nfipcom_premium_charged, charge_basis: RENEWAL}}
        - {category: bizflood, table: bizflood_changes, aggregate: latest, field: contents_limit, filters: {event_type: bizflood_sov_received}}
      cross_category: [bizflood]

  - id: nfipcom_ext_contents_payment
    base_policy_refs: [nfipcom_claim_settlement, nfipcom_proof_of_loss, nfipcom_claim_intake, nfipcom_mortgagee_rights]
    overwrite:
      - base_policy: nfipcom_claim_settlement
        superseded_clause: >-
          A new payment on a coverage is the payable amount less what has already been paid net of voids on that claim and
          coverage (nfipcom_msr_claim_part_paid), issued only when positive;
        replaced_by: >-
          For a contents payment, and only for a contents payment, the payable amount is the part of the sworn contents
          amount this policy carries alone plus its share of the rest, and what has already been paid is settled as the
          sentences below set out; a building payment follows the building payment rule, and every other coverage's new
          payment remains the payable amount less what has already been paid net of voids on that claim and coverage.
    trigger: on_request
    subject: [nfipcom_claim_paid]
    computes: payment_amount
    target_tool: issue_contents_claim_payment_a4dbf5ac
    params: {}
    rule: >-
      A contents payment on a claim is fixed only after the claim file carries a signed and sworn contents proof of loss
      received after the claim's latest adjuster report that measures a contents loss. A contents payment is issued on the
      policy's claim that carries its latest adjuster report, for that claim's date of loss, and the contents proofs of loss
      and contents payments for that date of loss include those filed under a duplicate claim number reported for the same
      date of loss. The contents payment issued on a claim is worked out from the sworn contents amount, which in the
      standard working is the amount sworn on the latest contents proof of loss for the date of loss; in the standard
      working this policy carries the whole sworn contents amount alone, there is no other insurance on the contents, and
      the contents payments already made are the contents payments issued on the claim less the contents payment items
      voided on it. Where flood insurance not issued under the National Flood Insurance Program covers the same contents, a
      contents payment follows the other-insurance condition that the General Property Form and the RCBAP both carry: this
      policy is primary, subject to its own deductible, up to the deductible of the other flood policy, and for the rest of
      the loss it pays the share that its contents limit bears to the sum of its contents limit and the other insurance on
      the contents; a policy written excess of the National Flood Insurance Program leaves this policy primary for the whole
      loss. The other flood policy's deductible is one layer for the date of loss over the property that policy insures; when it insures the building at the address as well as the contents, the layer is shared between the contents and the building in proportion to the amounts sworn for each, so the part of the sworn contents amount this policy carries alone is that layer multiplied by the sworn contents amount and divided by the sum of the sworn contents amount and the building amount sworn for the date of loss, never more than the sworn contents amount; when it insures no building there, the building amount sworn for the date of loss is nothing and the contents carry the whole layer. The contents working
      applies its steps in this order: the part carried alone first, then the share of the rest, then the payments already
      made are subtracted; each step is rounded half-up to the cent, and the contents payment is issued only when positive.
      For a contents payment, and only for a contents payment, the payable amount is the part of the sworn contents amount
      this policy carries alone plus its share of the rest, and what has already been paid is settled as the sentences below
      set out; a building payment follows the building payment rule, and every other coverage's new payment remains the
      payable amount less what has already been paid net of voids on that claim and coverage. A contents payment is paid to
      the insured alone. For a contents payment, the BizFlood policy the sentences below mean is the named insured's BizFlood policy whose statement of values schedules the building's address, counted only when it was in force on the date of loss and is not written excess of the National Flood Insurance Program. The building's location on that BizFlood policy is the location number its statement of values gives the building's address. That BizFlood policy is in force on the date of loss when the date of loss falls on or after its effective date, before its term end and before any cancellation effective date it carries. This rule issues a contents payment only where the named insured's BizFlood statements of values schedule the building's address at most once and that BizFlood policy holds at most one value increase and at most one value decrease for the address; otherwise no contents payment is issued under this rule, the amount being nil, and the claim is referred to the adjuster to apportion the other insurance. The sworn contents amount a
      contents payment is measured against is settled as follows: when the latest contents proof of loss for the date of
      loss was received after the proof-of-loss period, counted by adding the days to the date of loss on the calendar, the
      amounts sworn on the other contents proofs of loss for the date of loss are added together and the late one is left
      out; when more than one contents proof of loss was filed for the date of loss and the latest was received within that
      period, the amounts sworn on all of them are added together, each later proof of loss claiming an additional amount;
      otherwise it is the amount sworn on the latest contents proof of loss for the date of loss. The other flood policy's
      deductible layer a contents payment uses is settled as follows: when that BizFlood policy schedules the address with a contents value and the building is in flood zone V or VE, it is the BizFlood tier's V-zone deductible percentage of the location's value at the time of loss, never less than the BizFlood tier's V-zone minimum deductible, that value being the one on that policy's adjuster's latest report for the location and the date of loss and, when its adjuster has filed no report for them, the building and contents values its statement of values schedules for the location added together; when that BizFlood policy schedules the address with a contents value and the building is outside flood zones V and VE, it is that BizFlood policy's flat deductible per location; otherwise no other flood policy's
      deductible applies and the layer is the sum of the building limit and the contents limit, so the whole sworn contents
      amount is carried alone. The building amount sworn for the date of loss that shares the deductible layer is settled as follows, every case requiring that BizFlood policy to declare a building value for the address: when the latest building proof of loss for the date of loss was received after the proof-of-loss period, it is the amounts sworn on the other building proofs of loss for the date of loss added together; when building proofs of
      loss were filed for the date of loss and the latest was received within that period, it is the amounts sworn on all of
      them added together; when no building proof of loss was filed for the date of loss but building payments were issued
      for it on the adjuster's report signed in lieu of a proof of loss, it is those building payments less the building
      payment items voided; otherwise it is nothing. The other insurance on the contents is settled as follows: when that
      BizFlood policy declares a contents value for the address and a value endorsement for that location was in force on the date of loss, it is the contents limit set by that endorsement, the value endorsement in force being, of the value increase and the value decrease endorsed for the location, the one that took effect later among those that took effect on or before the date of loss, an increase and a decrease taking effect the same day being settled by the one recorded later, and by the increase when both were recorded the same day; when that
      BizFlood policy declares a contents value for the address and no value endorsement for that location was in force on the date of loss, it is the contents value on its statement of
      values; otherwise there is none. The contents payments already made that a contents payment is reduced by are settled
      as follows: when another claim number on the policy carries the same date of loss as a duplicate first notice, they
      are the contents payments issued under both claim numbers less the contents payment items voided under both; when
      there is no such duplicate first notice, contents payment items on the claim have been voided and no contents payment
      was issued on the claim after the latest void, they are all the contents payments issued on the claim, because the
      voided item is reissued on its own under a new payment reference; otherwise they are the contents payments issued on
      the claim less the contents payment items voided on it.
    prerequisite:
      - problem: nfipcom_ext_contents_proof_amount
        kind: value_input
        gate: cy_sworn
        form: state
        policy_source: >-
          A contents payment on a claim is fixed only after the claim file carries a signed and sworn contents proof of loss
          received after the claim's latest adjuster report that measures a contents loss.
        condition: >-
          The claim's nfipcom_claims entries include an nfipcom_proof_of_loss_filed entry with coverage_part CONTENTS whose
          event_date is later than the event_date of the claim's latest nfipcom_adjuster_report entry with
          contents_acv_loss above zero.
        resolved_by: sign_contents_proof_of_loss_65413413
        effect: >-
          The newly sworn contents proof of loss joins the contents proofs of loss for the date of loss, so the sworn
          contents amount the payment is measured against includes the additional amount just sworn.
    cross_category:
      - category: bizflood
        as: history
        reads: [effective_date, cancellation_effective_date, deductible_per_location, bizflood_policy_id, bizflood_changes.event_type, bizflood_changes.change_type, bizflood_changes.bizflood_policy_id, bizflood_changes.location_address, bizflood_changes.location_number, bizflood_changes.contents_limit, bizflood_changes.change_effective_date, bizflood_claims.event_type, bizflood_claims.bizflood_policy_id, bizflood_claims.location_number, bizflood_claims.date_of_loss, bizflood_claims.location_value_at_loss]
        note: The deductible-layer and other-insurance factors read the named insured's BizFlood policy that schedules the building's address, in force on the date of loss, its statement of values and value endorsements for the building's address, and its adjuster's value at the time of loss for that location.
    compute:
      - cy_cn: "LATEST('nfipcom_claims', 'claim_number', date_field='event_date', event_type='nfipcom_adjuster_report')"
      - cy_dol: "LATEST('nfipcom_claims', 'date_of_loss', date_field='event_date', event_type='nfipcom_adjuster_report')"
      - cy_n_pol: "COUNT('nfipcom_claims', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='CONTENTS')"
      - cy_pol_sum: "SUM('nfipcom_claims', 'claimed_amount', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='CONTENTS')"
      - cy_pol_last_date: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='CONTENTS')"
      - cy_pol_last_amt: "LATEST('nfipcom_claims', 'claimed_amount', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='CONTENTS')"
      - cy_sworn: "RND(cy_pol_sum - cy_pol_last_amt, 2) if (cy_n_pol > 0 and DAYS(cy_dol, cy_pol_last_date) > P('proof_of_loss_days')) else (cy_pol_sum if cy_n_pol > 1 else cy_pol_last_amt)"
      - cy_bz: "XLATEST('bizflood', 'bizflood_changes', 'bizflood_policy_id', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'))"
      - cy_bz_eff: "CFIELD('bizflood', 'effective_date', bizflood_policy_id=cy_bz)"
      - cy_bz_cxl: "CFIELD('bizflood', 'cancellation_effective_date', bizflood_policy_id=cy_bz)"
      - cy_bz_end: "CFIELD('bizflood', 'term_end', bizflood_policy_id=cy_bz)"
      - cy_bz_ok: "cy_bz != None and cy_bz_eff != None and DAYS(cy_bz_eff, cy_dol) >= 0 and (cy_bz_cxl == None or cy_bz_cxl == '' or DAYS(cy_dol, cy_bz_cxl) > 0) and cy_bz_end != None and cy_bz_end != '' and DAYS(cy_dol, cy_bz_end) > 0 and CPARAM('bizflood', 'excess_over_nfip', bizflood_policy_id=cy_bz) == False"
      - cy_bz_bldg: "XLATEST('bizflood', 'bizflood_changes', 'building_limit', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_bz_cont: "XLATEST('bizflood', 'bizflood_changes', 'contents_limit', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_loc: "XLATEST('bizflood', 'bizflood_changes', 'location_number', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_n_val: "XCOUNT('bizflood', 'bizflood_claims', event_type='bizflood_adjuster_report', bizflood_policy_id=cy_bz, location_number=cy_loc, date_of_loss=cy_dol)"
      - cy_locval: "XLATEST('bizflood', 'bizflood_claims', 'location_value_at_loss', date_field='event_date', event_type='bizflood_adjuster_report', bizflood_policy_id=cy_bz, location_number=cy_loc, date_of_loss=cy_dol)"
      - cy_lv: "cy_locval if cy_n_val > 0 else (RND(cy_bz_bldg + cy_bz_cont, 2) if (cy_bz_bldg != None and cy_bz_cont != None) else 0)"
      - cy_layer: "MX(CPARAM('bizflood', 'v_zone_min_deductible', bizflood_policy_id=cy_bz), RND(cy_lv * CPARAM('bizflood', 'v_zone_pct_deductible', bizflood_policy_id=cy_bz) / 100 + 0.0000001, 2)) if (cy_bz_ok and cy_bz_cont != None and cy_bz_cont > 0 and (F('flood_zone') == 'VE' or F('flood_zone') == 'V')) else (CFIELD('bizflood', 'deductible_per_location', bizflood_policy_id=cy_bz) if (cy_bz_ok and cy_bz_cont != None and cy_bz_cont > 0 and F('flood_zone') != 'VE' and F('flood_zone') != 'V') else F('building_coverage') + F('contents_coverage'))"
      - cy_n_bpol: "COUNT('nfipcom_claims', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='BUILDING')"
      - cy_bpol_sum: "SUM('nfipcom_claims', 'claimed_amount', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='BUILDING')"
      - cy_bpol_last_date: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='BUILDING')"
      - cy_bpol_last_amt: "LATEST('nfipcom_claims', 'claimed_amount', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cy_dol, coverage_part='BUILDING')"
      - cy_bpaid: "RND(SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', date_of_loss=cy_dol, coverage_part='BUILDING') - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', date_of_loss=cy_dol, coverage_part='BUILDING'), 2)"
      - cy_bldg: "0 if not (cy_bz_ok and cy_bz_bldg != None and cy_bz_bldg > 0) else (RND(cy_bpol_sum - cy_bpol_last_amt, 2) if (cy_n_bpol > 0 and DAYS(cy_dol, cy_bpol_last_date) > P('proof_of_loss_days')) else (cy_bpol_sum if cy_n_bpol > 0 else (cy_bpaid if cy_bpaid > 0 else 0)))"
      - cy_n_inc: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_inc_eff: "XLATEST('bizflood', 'bizflood_changes', 'change_effective_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_inc_cont: "XLATEST('bizflood', 'bizflood_changes', 'contents_limit', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_n_dec: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_dec_eff: "XLATEST('bizflood', 'bizflood_changes', 'change_effective_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_dec_cont: "XLATEST('bizflood', 'bizflood_changes', 'contents_limit', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_inc_rec: "XLATEST('bizflood', 'bizflood_changes', 'recorded_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_dec_rec: "XLATEST('bizflood', 'bizflood_changes', 'recorded_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz)"
      - cy_inc_ok: "cy_n_inc > 0 and DAYS(cy_inc_eff, cy_dol) >= 0"
      - cy_dec_ok: "cy_n_dec > 0 and DAYS(cy_dec_eff, cy_dol) >= 0"
      - cy_chg_eff: "cy_inc_eff if (cy_inc_ok and ((not cy_dec_ok) or (DAYS(cy_dec_eff, cy_inc_eff) > 0 or (DAYS(cy_dec_eff, cy_inc_eff) == 0 and DAYS(cy_dec_rec, cy_inc_rec) >= 0)))) else (cy_dec_eff if cy_dec_ok else None)"
      - cy_chg_cont: "cy_inc_cont if (cy_inc_ok and ((not cy_dec_ok) or (DAYS(cy_dec_eff, cy_inc_eff) > 0 or (DAYS(cy_dec_eff, cy_inc_eff) == 0 and DAYS(cy_dec_rec, cy_inc_rec) >= 0)))) else (cy_dec_cont if cy_dec_ok else None)"
      - cy_other: "cy_chg_cont if (cy_bz_ok and cy_bz_cont != None and cy_bz_cont > 0 and (cy_inc_ok or cy_dec_ok)) else (cy_bz_cont if (cy_bz_ok and cy_bz_cont != None and cy_bz_cont > 0) else 0)"
      - cy_n_notice: "COUNT('nfipcom_claims', event_type='nfipcom_claim_reported', date_of_loss=cy_dol) - COUNT('nfipcom_claims', event_type='nfipcom_claim_reported', date_of_loss=cy_dol, claim_number=cy_cn)"
      - cy_paid_dol: "RND(SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', coverage_part='CONTENTS', date_of_loss=cy_dol) - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', coverage_part='CONTENTS', date_of_loss=cy_dol), 2)"
      - cy_paid_cn: "SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', claim_number=cy_cn, coverage_part='CONTENTS')"
      - cy_void_cn: "SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', claim_number=cy_cn, coverage_part='CONTENTS')"
      - cy_n_void: "COUNT('nfipcom_claims', event_type='nfipcom_claim_payment_voided', claim_number=cy_cn, coverage_part='CONTENTS')"
      - cy_n_paidcn: "COUNT('nfipcom_claims', event_type='nfipcom_claim_paid', claim_number=cy_cn, coverage_part='CONTENTS')"
      - cy_last_void: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_claim_payment_voided', claim_number=cy_cn, coverage_part='CONTENTS')"
      - cy_last_paid: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_claim_paid', claim_number=cy_cn, coverage_part='CONTENTS')"
      - cy_paid: "cy_paid_dol if cy_n_notice > 0 else (cy_paid_cn if (cy_n_void > 0 and cy_n_paidcn > 0 and DAYS(cy_last_void, cy_last_paid) <= 0) else RND(cy_paid_cn - cy_void_cn, 2))"
      - cy_carried: "MN(cy_sworn, RND(cy_layer * cy_sworn / (cy_sworn + cy_bldg) + 0.0000001, 2)) if cy_sworn > 0 else 0"
      - cy_share: "RND(cy_carried + MX(0, cy_sworn - cy_carried) * F('contents_coverage') / (F('contents_coverage') + cy_other) + 0.0000001, 2)"
      - cy_one: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_sov_received', location_address=F('property_address')) <= 1 and XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz) <= 1 and XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cy_bz) <= 1"
      - result: "(MX(0, RND(cy_share - cy_paid + 0.0000001, 2))) if cy_one else 0"
    compute_basis:
      cy_cn: "A contents payment is issued on the policy's claim that carries its latest adjuster report, for that claim's date of loss"
      cy_dol: "A contents payment is issued on the policy's claim that carries its latest adjuster report, for that claim's date of loss"
      cy_sworn: "when the latest contents proof of loss for the date of loss was received after the proof-of-loss period, counted by adding the days to the date of loss on the calendar, the amounts sworn on the other contents proofs of loss for the date of loss are added together and the late one is left out; when more than one contents proof of loss was filed for the date of loss and the latest was received within that period, the amounts sworn on all of them are added together, each later proof of loss claiming an additional amount; otherwise it is the amount sworn on the latest contents proof of loss for the date of loss."
      cy_bz_ok: "For a contents payment, the BizFlood policy the sentences below mean is the named insured's BizFlood policy whose statement of values schedules the building's address, counted only when it was in force on the date of loss and is not written excess of the National Flood Insurance Program."
      cy_layer: "when that BizFlood policy schedules the address with a contents value and the building is in flood zone V or VE, it is the BizFlood tier's V-zone deductible percentage of the location's value at the time of loss, never less than the BizFlood tier's V-zone minimum deductible, that value being the one on that policy's adjuster's latest report for the location and the date of loss and, when its adjuster has filed no report for them, the building and contents values its statement of values schedules for the location added together; when that BizFlood policy schedules the address with a contents value and the building is outside flood zones V and VE, it is that BizFlood policy's flat deductible per location; otherwise no other flood policy's deductible applies and the layer is the sum of the building limit and the contents limit, so the whole sworn contents amount is carried alone."
      cy_bldg: "every case requiring that BizFlood policy to declare a building value for the address: when the latest building proof of loss for the date of loss was received after the proof-of-loss period, it is the amounts sworn on the other building proofs of loss for the date of loss added together; when building proofs of loss were filed for the date of loss and the latest was received within that period, it is the amounts sworn on all of them added together; when no building proof of loss was filed for the date of loss but building payments were issued for it on the adjuster's report signed in lieu of a proof of loss, it is those building payments less the building payment items voided; otherwise it is nothing."
      cy_other: "when that BizFlood policy declares a contents value for the address and a value endorsement for that location was in force on the date of loss, it is the contents limit set by that endorsement, the value endorsement in force being, of the value increase and the value decrease endorsed for the location, the one that took effect later among those that took effect on or before the date of loss, an increase and a decrease taking effect the same day being settled by the one recorded later, and by the increase when both were recorded the same day; when that BizFlood policy declares a contents value for the address and no value endorsement for that location was in force on the date of loss, it is the contents value on its statement of values; otherwise there is none."
      cy_paid: "when another claim number on the policy carries the same date of loss as a duplicate first notice, they are the contents payments issued under both claim numbers less the contents payment items voided under both; when there is no such duplicate first notice, contents payment items on the claim have been voided and no contents payment was issued on the claim after the latest void, they are all the contents payments issued on the claim, because the voided item is reissued on its own under a new payment reference; otherwise they are the contents payments issued on the claim less the contents payment items voided on it."
      cy_carried: "the part of the sworn contents amount this policy carries alone is that layer multiplied by the sworn contents amount and divided by the sum of the sworn contents amount and the building amount sworn for the date of loss, never more than the sworn contents amount; when it insures no building there, the building amount sworn for the date of loss is nothing and the contents carry the whole layer."
      cy_share: "for the rest of the loss it pays the share that its contents limit bears to the sum of its contents limit and the other insurance on the contents"
      result: "The contents working applies its steps in this order: the part carried alone first, then the share of the rest, then the payments already made are subtracted; each step is rounded half-up to the cent, and the contents payment is issued only when positive."
    factors:
      - id: cpay_sworn_total
        effect: method
        decides: cy_sworn
        bindings: [cy_n_pol, cy_pol_sum, cy_pol_last_date, cy_pol_last_amt, cy_sworn]
        ladder:
          - when: "the latest contents proof of loss for the date of loss was received after the proof-of-loss period"
            method: "the amounts sworn on the other contents proofs of loss for the date of loss are added together and the late one is left out"
          - when: "more than one contents proof of loss was filed for the date of loss and the latest was received within that period"
            method: "the amounts sworn on all of them are added together, each later proof of loss claiming an additional amount"
          - when: "otherwise"
            method: "the amount sworn on the latest contents proof of loss for the date of loss is used"
        baseline:
          cy_sworn: "cy_pol_last_amt"
        evidence: [history, date]
        cross_difficulty: null
      - id: cpay_alone_layer
        effect: parameter
        decides: cy_layer
        bindings: [cy_loc, cy_n_val, cy_locval, cy_lv, cy_layer]
        ladder:
          - when: "the named insured's BizFlood policy that schedules the building's address with a contents value was in force on the date of loss and is not written excess of the National Flood Insurance Program and the building is in flood zone V or VE"
            value: "the BizFlood tier's V-zone deductible percentage of that value, never less than the V-zone minimum deductible"
          - when: "that BizFlood policy schedules the address with a contents value and the building is outside flood zones V and VE"
            value: "that BizFlood policy's flat deductible per location"
          - when: "otherwise"
            value: "no other flood policy's deductible: the sum of the building limit and the contents limit, so the whole sworn contents amount is carried alone"
        baseline:
          cy_layer: "F('building_coverage') + F('contents_coverage')"
        evidence: [cross_category, history]
        cross_difficulty: bizflood
      - id: cpay_building_share
        effect: parameter
        decides: cy_bldg
        bindings: [cy_n_bpol, cy_bpol_sum, cy_bpol_last_date, cy_bpol_last_amt, cy_bpaid, cy_bldg]
        ladder:
          - when: "that BizFlood policy declares a building value for the address and the latest building proof of loss for the date of loss was received after the proof-of-loss period"
            value: "the amounts sworn on the other building proofs of loss for the date of loss added together"
          - when: "that BizFlood policy declares a building value for the address and building proofs of loss were filed for the date of loss, the latest received within that period"
            value: "the amounts sworn on all of them added together"
          - when: "that BizFlood policy declares a building value for the address, no building proof of loss was filed for the date of loss but building payments were issued for it on the adjuster's report signed in lieu of a proof of loss"
            value: "those building payments less the building payment items voided"
          - when: "otherwise"
            value: "nothing"
        baseline:
          cy_bldg: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cpay_other_cover
        effect: parameter
        decides: cy_other
        bindings: [cy_n_inc, cy_inc_eff, cy_inc_cont, cy_n_dec, cy_dec_eff, cy_dec_cont, cy_inc_rec, cy_dec_rec, cy_inc_ok, cy_dec_ok, cy_chg_eff, cy_chg_cont, cy_other]
        ladder:
          - when: "that BizFlood policy declares a contents value for the address and a value endorsement for that location was in force on the date of loss"
            value: "the contents limit set by the value endorsement in force on the date of loss"
          - when: "that BizFlood policy declares a contents value for the address and no value endorsement for that location was in force on the date of loss"
            value: "the contents value on its statement of values"
          - when: "otherwise"
            value: "none"
        baseline:
          cy_other: "0"
        evidence: [cross_category, date]
        cross_difficulty: bizflood
      - id: cpay_paid_before
        effect: parameter
        decides: cy_paid
        bindings: [cy_n_notice, cy_paid_dol, cy_paid_cn, cy_void_cn, cy_n_void, cy_n_paidcn, cy_last_void, cy_last_paid, cy_paid]
        ladder:
          - when: "another claim number on the policy carries the same date of loss as a duplicate first notice"
            value: "the contents payments issued under both claim numbers less the contents payment items voided under both"
          - when: "there is no such duplicate first notice, contents payment items on the claim have been voided and no contents payment was issued on the claim after the latest void"
            value: "all the contents payments issued on the claim"
          - when: "otherwise"
            value: "the contents payments issued on the claim less the contents payment items voided on it"
        baseline:
          cy_paid: "RND(cy_paid_cn - cy_void_cn, 2)"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The contents payment issued on a claim is worked out from the sworn contents amount, which in the standard working
        is the amount sworn on the latest contents proof of loss for the date of loss; in the standard working this policy
        carries the whole sworn contents amount alone, there is no other insurance on the contents, and the contents
        payments already made are the contents payments issued on the claim less the contents payment items voided on it.
        Where flood insurance not issued under the National Flood Insurance Program covers the same contents, a contents
        payment follows the other-insurance condition that the General Property Form and the RCBAP both carry: this policy
        is primary, subject to its own deductible, up to the deductible of the other flood policy, and for the rest of the
        loss it pays the share that its contents limit bears to the sum of its contents limit and the other insurance on the
        contents; a policy written excess of the National Flood Insurance Program leaves this policy primary for the whole
        loss. The other flood policy's deductible is one layer for the date of loss over the property that policy insures; when it insures the building at the address as well as the contents, the layer is shared between the contents and the building in proportion to the amounts sworn for each, so the part of the sworn contents amount this policy carries alone is that layer multiplied by the sworn contents amount and divided by the sum of the sworn contents amount and the building amount sworn for the date of loss, never more than the sworn contents amount; when it insures no building there, the building amount sworn for the date of loss is nothing and the contents carry the whole layer. The contents working
        applies its steps in this order: the part carried alone first, then the share of the rest, then the payments already
        made are subtracted; each step is rounded half-up to the cent, and the contents payment is issued only when
        positive.
      params: []
    inputs:
      history:
        - {table: nfipcom_claims, aggregate: sum, field: claimed_amount, filters: {event_type: nfipcom_proof_of_loss_filed, coverage_part: CONTENTS}}
        - {table: nfipcom_claims, aggregate: sum, field: claimed_amount, filters: {event_type: nfipcom_proof_of_loss_filed, coverage_part: BUILDING}}
        - {table: nfipcom_claims, aggregate: sum, field: payment_amount, filters: {event_type: nfipcom_claim_paid, coverage_part: CONTENTS}}
        - {table: nfipcom_claims, aggregate: count, field: claim_number, filters: {event_type: nfipcom_claim_reported}}
        - {category: bizflood, table: bizflood_changes, aggregate: latest, field: contents_limit, filters: {event_type: bizflood_endorsement_issued}}
        - {category: bizflood, table: bizflood_claims, aggregate: latest, field: location_value_at_loss, filters: {event_type: bizflood_adjuster_report}}
      cross_category: [bizflood]

  - id: nfipcom_ext_cancellation_credit
    base_policy_refs: [nfipcom_cancellation_refund, nfipcom_agg_one_policy_per_building, nfipcom_ec_rating, nfipcom_nullification, nfipcom_mortgagee_rights, nfipcom_endorsement_premium, nfipcom_claim_settlement]
    overwrite:
      - base_policy: nfipcom_cancellation_refund
        superseded_clause: >-
          The refund method follows the reason: FULL_FROM_INCEPTION returns every component booked on the policy, fees
          included; CURRENT_TERM_FULL returns the current term's risk premium, ICC premium, Reserve Fund Assessment and
          HFIAA surcharge in full; PRO_RATA returns the same four components of the current term multiplied by the days
          from the cancellation effective date to term_end divided by the days from term_start to term_end.
        replaced_by: >-
          For the risk premium a cancellation credits when it is processed, and only for that credit and only while the current term and the term before it together carry at most one premium-bearing endorsement and at most one re-rate credit, each counted by its risk premium entries, the reason's refund method is applied over the current term and the term before it as the sentences below set out, and risk premium of terms earlier than that is returned only through the NFIP Bureau; when those terms carry more than one premium-bearing endorsement or more than one re-rate credit, the base clause applies to the risk premium as written, that is: the refund method follows the reason: FULL_FROM_INCEPTION returns every component booked on the policy, fees included; CURRENT_TERM_FULL returns the current term's risk premium, ICC premium, Reserve Fund Assessment and HFIAA surcharge in full; PRO_RATA returns the same four components of the current term multiplied by the days from the cancellation effective date to term_end divided by the days from term_start to term_end, with the claim bar as stated below; the ICC premium, Reserve Fund
          Assessment, HFIAA surcharge, Federal Policy Fee and probation surcharge follow the cancellation refund rule, and
          every other credit follows the refund method as the base cancellation rule states it.
      - base_policy: nfipcom_cancellation_refund
        superseded_clause: >-
          No refund at all is due for the current term under the reasons in claim_bar_reasons when a claim with a date of
          loss in the current term has been paid (nfipcom_msr_term_claims_paid above zero) or is still open
          (nfipcom_msr_term_claims_open above zero); the cancellation still proceeds.
        replaced_by: >-
          For the risk premium credit of a cancellation processed under this rule, and only for it, the cancellation refund's credits following the cancellation refund rule, a policy with an open claim is not cancelled until every claim on it is closed, so the claim bar is applied once the claims are closed: under the reasons in claim_bar_reasons nothing is returned for the current term, the latest premium-bearing endorsement's risk premium charges included, when a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero; when the records cannot place such a paid loss on either side of the current term_start, that is when no loss dated after the month band around the current term_start carries such payments, a loss dated in that band does, and the latest loss on which a claim payment was ever issued is dated after the band, or is dated in the band on or after the current term_start with its payments all voided, the month band being the losses dated as many whole calendar months before the processing date as the current term_start is, this schedule holds the current term's return: nothing of the current term, the latest premium-bearing endorsement's risk premium charges included, is returned by this credit, which departs from the base claim bar for that case only; in every other case the claim bar stands as the base cancellation rule states it: no refund at all is due for the current term under the reasons in claim_bar_reasons when a claim with a date of loss in the current term has been paid or is still open; apart from that hold, the claim bar stands as the base cancellation
          rule states it.
    trigger: on_request
    subject: [nfipcom_policy_cancelled, nfipcom_premium_credit, nfipcom_mortgagee_notice]
    computes: risk_credit
    target_tool: process_cancellation_a892a1e4
    params:
      claim_bar_reasons: [MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED, REPLACED_BY_PRIVATE_FLOOD, REMOVED_FROM_SFHA_BY_LOMA_LOMR]
    rule: >-
      Processing a cancellation ends the policy on the cancellation effective date and leaves it cancelled, books a
      CANCELLATION credit for the risk premium referencing the signed cancellation request, and, when the policy is
      mortgage-required, sends written notice of the cancellation to the mortgagee of record on the date it is processed. A cancellation is not processed until no claim on the policy is open, every coverage measured on the latest adjuster report for each date of loss on the policy carrying a payment or a written denial for that date of loss dated after that report. For the risk premium credit of a cancellation processed under this rule, and only for it, the cancellation refund's credits following the cancellation refund rule, a policy with an open claim is not cancelled until every claim on it is closed, so the
      claim bar is applied once the claims are closed: under the reasons in claim_bar_reasons nothing is returned for the current term, the latest premium-bearing endorsement's risk premium charges included, when a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero; when the records cannot place such a paid loss on either side of the current term_start, that is when no loss dated after the month band around the current term_start carries such payments, a loss dated in that band does, and the latest loss on which a claim payment was ever issued is dated after the band, or is dated in the band on or after the current term_start with its payments all voided, the month band being the losses dated as many whole calendar months before the processing date as the current term_start is, this schedule holds the current term's return: nothing of the current term, the latest premium-bearing endorsement's risk premium charges included, is returned by this credit, which departs from the base claim bar for that case only; in every other case the claim bar stands as the base cancellation rule states it: no refund at all is due for the current term under the reasons in claim_bar_reasons when a claim with a date of loss in the current term has been paid or is still open; apart from that hold, the claim bar stands as the base cancellation rule states it. The cancellation effective date follows the reason on the signed request, read from the latest signed cancellation request received on the policy, a withdrawn or unsigned request not counting, as the base cancellation rule sets it: the event date the request names for a
      building sold, a building removed or demolished, or contents sold or removed; the current term_start for a removal
      from the Special Flood Hazard Area by a Letter of Map Amendment or Revision; the policy's original effective date for
      a duplicate NFIP policy or a loan closing that did not occur; for a replacement by private flood insurance, the date
      the request names when it falls after the request was received; otherwise the date the signed request was received.
      For the risk premium a cancellation credits when it is processed, and only for that credit and only while the current term and the term before it together carry at most one premium-bearing endorsement and at most one re-rate credit, each counted by its risk premium entries, the reason's refund method is applied over the current term and the term before it as the sentences below set out, and risk premium of terms earlier than that is returned only through the NFIP Bureau; when those terms carry more than one premium-bearing endorsement or more than one re-rate credit, the base clause applies to the risk premium as written, that is: the refund method follows the reason: FULL_FROM_INCEPTION returns every component booked on the policy, fees included; CURRENT_TERM_FULL returns the current term's risk premium, ICC premium, Reserve Fund Assessment and HFIAA surcharge in full; PRO_RATA returns the same four components of the current term multiplied by the days from the cancellation effective date to term_end divided by the days from term_start to term_end, with the claim bar as stated below; the ICC premium, Reserve Fund Assessment, HFIAA surcharge,
      Federal Policy Fee and probation surcharge follow the cancellation refund rule, and every other credit follows the
      refund method as the base cancellation rule states it. The risk premium credit of a cancellation is worked out from
      the risk premium of the current term and of the term before it, a term's risk premium being the risk premium charges
      booked for that term apart from those of the policy's latest premium-bearing endorsement. In the standard working the
      current term's risk premium is returned for the days from the cancellation effective date to term_end over the days of
      the current term, nothing is returned for the term before it, the latest premium-bearing endorsement's risk premium
      charges are returned with the term premium they belong to, and no re-rate credit is taken back. The working adds the returned parts the sentences below settle, in the order they are set out, and then subtracts the part taken back; each part is rounded half-up to the cent and the credit is never below zero. Endorsement
      charges returned with the term premium they belong to are returned for the days from the cancellation effective date
      to the end of their term over the days of the current term when their term is the one the cancellation takes effect
      in, in full when their term began after the cancellation effective date, and not at all when their term ended before
      it; the term before the current one ends at the current term_start, and the days of a term are counted as the days of
      the current term. The current term's risk premium a cancellation returns is settled as follows: when the cancellation
      effective date falls before the current term_start, it is returned in full; when the cancellation effective date falls
      on or after the current term_start, the reason is one of those that bar a refund once a claim has been paid, and a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero, where the records place that loss, or the records cannot place a paid loss on either side of the current term_start and the current term's return is held, as set out above, nothing is returned;
      otherwise it is returned for the days from the cancellation effective date to term_end over the days of the current
      term. The risk premium of the term before the current one is settled as follows: when the cancellation effective date
      falls on or before the start of that term, it is returned in full; when the cancellation effective date falls within
      that term, it is returned for the days from the cancellation effective date to the current term_start over the days of
      the current term; otherwise nothing is returned for it. The endorsement risk premium a cancellation returns is settled
      as follows: when the cancellation effective date falls on or after the current term_start and the claim bar set out above applies, nothing is returned; when the policy's latest premium-bearing endorsement took effect after the cancellation effective date, its risk premium charges are returned in full; when it took effect on or before the cancellation effective date within
      the term the cancellation takes effect in, they are returned for the days from the cancellation effective date to the
      end of that term over the days from the endorsement's effective date to the end of that term; otherwise they are
      returned with the term premium they belong to. The re-rate credit a cancellation takes back is settled as follows:
      when the Elevation Certificate behind the policy's latest risk premium re-rate credit took effect on or before the
      cancellation effective date within the term the cancellation takes effect in, it is that re-rate credit for the days
      from the cancellation effective date to the end of that term over the days from the certificate's effective date to
      the end of that term; when the certificate took effect after the cancellation effective date, it is the whole re-rate
      credit; otherwise nothing is taken back.
    prerequisite:
      - problem: nfipcom_ext_contents_payment
        kind: state_gate
        gate: nfipcom_claims.event_type
        form: state
        policy_source: >-
          A cancellation is not processed until no claim on the policy is open, every coverage measured on the latest adjuster report for each date of loss on the policy carrying a payment or a written denial for that date of loss dated after that report.
        condition: >-
          For every date_of_loss in the policy's nfipcom_claims, each coverage with a loss above zero on the latest nfipcom_adjuster_report carrying that date_of_loss, under whichever claim number it was filed, has an nfipcom_claim_paid or nfipcom_claim_denied entry for that coverage and that date_of_loss with an event_date later than that report's event_date.
        resolved_by: issue_contents_claim_payment_a4dbf5ac
        effect: >-
          Once every coverage measured on the latest adjuster report for each date of loss carries a payment or a written denial for that date of loss dated after that report, no claim on the policy remains open and the cancellation can be processed.
    cross_category: []
    compute:
      - xc_reason: "LATEST('nfipcom_requests', 'cancellation_reason', date_field='created_at', request_type='CANCELLATION', outcome='SIGNED')"
      - xc_req_date: "LATEST('nfipcom_requests', 'requested_effective_date', date_field='created_at', request_type='CANCELLATION', outcome='SIGNED')"
      - xc_received: "LATEST('nfipcom_requests', 'created_at', date_field='created_at', request_type='CANCELLATION', outcome='SIGNED')"
      - xc_eff: "xc_req_date if (xc_reason == 'BUILDING_SOLD' or xc_reason == 'BUILDING_REMOVED_OR_DEMOLISHED' or xc_reason == 'CONTENTS_SOLD_OR_REMOVED' or (xc_reason == 'REPLACED_BY_PRIVATE_FLOOD' and DAYS(xc_received, xc_req_date) > 0)) else (F('term_start') if xc_reason == 'REMOVED_FROM_SFHA_BY_LOMA_LOMR' else (F('original_effective_date') if (xc_reason == 'DUPLICATE_NFIP_POLICY' or xc_reason == 'CLOSING_DID_NOT_OCCUR') else xc_received))"
      - xc_term_days: "DAYS(F('term_start'), F('term_end'))"
      - xc_in_cur: "DAYS(F('term_start'), xc_eff) >= 0"
      - xc_eff_end: "F('term_end') if xc_in_cur else F('term_start')"
      - xc_n_endo: "COUNT('nfipcom_billing', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RISK_PREMIUM')"
      - xc_endo_id: "LATEST('nfipcom_billing', 'reference_id', date_field='posted_date', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RISK_PREMIUM')"
      - xc_endo_chg: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RISK_PREMIUM', reference_id=xc_endo_id)"
      - xc_endo_ts: "LATEST('nfipcom_billing', 'term_start', date_field='posted_date', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RISK_PREMIUM', reference_id=xc_endo_id)"
      - xc_endo_cur: "xc_n_endo > 0 and xc_endo_ts == F('term_start')"
      - xc_endo_prev: "xc_n_endo > 0 and xc_endo_ts != F('term_start') and MONTHS(xc_endo_ts, F('term_start')) == 12"
      - xc_cur: "RND(SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='RISK_PREMIUM', term_start=F('term_start')) - (xc_endo_chg if xc_endo_cur else 0), 2)"
      - xc_prev: "RND(SUM('nfipcom_billing', 'amount', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', component='RISK_PREMIUM') - SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='RISK_PREMIUM', term_start=F('term_start')) - (xc_endo_chg if xc_endo_prev else 0), 2)"
      - xc_ldol: "MONTHS(F('term_start'), NOW)"
      - xc_netin: "RND(SUM('nfipcom_claims', 'payment_amount', within_months=xc_ldol, date_field='date_of_loss', event_type='nfipcom_claim_paid') - SUM('nfipcom_claims', 'payment_amount', within_months=xc_ldol, date_field='date_of_loss', event_type='nfipcom_claim_payment_voided'), 2)"
      - xc_netall: "RND(SUM('nfipcom_claims', 'payment_amount', within_months=xc_ldol + 1, date_field='date_of_loss', event_type='nfipcom_claim_paid') - SUM('nfipcom_claims', 'payment_amount', within_months=xc_ldol + 1, date_field='date_of_loss', event_type='nfipcom_claim_payment_voided'), 2)"
      - xc_dp: "LATEST('nfipcom_claims', 'date_of_loss', date_field='date_of_loss', event_type='nfipcom_claim_paid')"
      - xc_netdp: "RND(SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', date_of_loss=xc_dp) - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', date_of_loss=xc_dp), 2)"
      - xc_dpband: "xc_dp != None and MONTHS(xc_dp, NOW) == xc_ldol"
      - xc_held: "xc_netin <= 0 and xc_netall - xc_netin > 0 and not (xc_dpband and (DAYS(F('term_start'), xc_dp) < 0 or xc_netdp > 0))"
      - xc_paidcur: "xc_netin > 0 or (xc_netall - xc_netin > 0 and xc_dpband and DAYS(F('term_start'), xc_dp) >= 0 and xc_netdp > 0)"
      - xc_barred: "xc_reason in K('claim_bar_reasons') and (xc_paidcur or xc_held)"
      - xc_cur_ret: "RND(xc_cur, 2) if not xc_in_cur else (0 if xc_barred else RND(xc_cur * DAYS(xc_eff, F('term_end')) / xc_term_days + 0.0000001, 2))"
      - xc_prev_ret: "RND(xc_prev, 2) if (not xc_in_cur and MONTHS(xc_eff, F('term_start')) >= 12) else (RND(xc_prev * DAYS(xc_eff, F('term_start')) / xc_term_days + 0.0000001, 2) if not xc_in_cur else 0)"
      - xc_endo_eff: "LATEST('nfipcom_changes', 'change_effective_date', date_field='recorded_date', nfipcom_change_id=xc_endo_id)"
      - xc_endo_in: "(xc_in_cur and xc_endo_cur) or ((not xc_in_cur) and xc_endo_prev and MONTHS(xc_eff, F('term_start')) < 12)"
      - xc_endo_term: "(xc_endo_chg if DAYS(xc_eff, xc_endo_ts) > 0 else (RND(xc_endo_chg * DAYS(xc_eff, xc_eff_end) / xc_term_days + 0.0000001, 2) if xc_endo_in else 0)) if xc_n_endo > 0 else 0"
      - xc_endo_ret: "0 if (xc_in_cur and xc_barred) else (xc_endo_chg if (xc_n_endo > 0 and DAYS(xc_eff, xc_endo_eff) > 0) else (RND(xc_endo_chg * DAYS(xc_eff, xc_eff_end) / DAYS(xc_endo_eff, xc_eff_end) + 0.0000001, 2) if (xc_n_endo > 0 and xc_endo_in) else xc_endo_term))"
      - xc_n_rr: "COUNT('nfipcom_billing', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM')"
      - xc_rr_id: "LATEST('nfipcom_billing', 'reference_id', date_field='posted_date', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM')"
      - xc_rr: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM', reference_id=xc_rr_id)"
      - xc_rr_ts: "LATEST('nfipcom_billing', 'term_start', date_field='posted_date', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM', reference_id=xc_rr_id)"
      - xc_ec_eff: "LATEST('nfipcom_changes', 'change_effective_date', date_field='recorded_date', nfipcom_change_id=xc_rr_id)"
      - xc_rr_in: "xc_n_rr > 0 and ((xc_in_cur and xc_rr_ts == F('term_start')) or ((not xc_in_cur) and xc_rr_ts != F('term_start') and MONTHS(xc_rr_ts, F('term_start')) == 12 and MONTHS(xc_eff, F('term_start')) < 12))"
      - xc_rr_back: "RND(xc_rr * DAYS(xc_eff, xc_eff_end) / DAYS(xc_ec_eff, xc_eff_end) + 0.0000001, 2) if (xc_rr_in and DAYS(xc_ec_eff, xc_eff) >= 0) else (xc_rr if (xc_n_rr > 0 and DAYS(xc_eff, xc_ec_eff) > 0) else 0)"
      - xc_n_endo2: "COUNT('nfipcom_billing', within_months=24, date_field='term_start', event_type='nfipcom_premium_charged', charge_basis='ENDORSEMENT', component='RISK_PREMIUM')"
      - xc_n_rr2: "COUNT('nfipcom_billing', within_months=24, date_field='term_start', event_type='nfipcom_premium_credit', charge_basis='RERATE', component='RISK_PREMIUM')"
      - xc_scope: "xc_n_endo2 <= 1 and xc_n_rr2 <= 1"
      - xc_base_ret: "SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='RISK_PREMIUM') if (xc_reason == 'DUPLICATE_NFIP_POLICY' or xc_reason == 'CLOSING_DID_NOT_OCCUR') else (0 if xc_barred else (SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='RISK_PREMIUM', term_start=F('term_start')) if xc_reason == 'REMOVED_FROM_SFHA_BY_LOMA_LOMR' else RND(SUM('nfipcom_billing', 'amount', event_type='nfipcom_premium_charged', component='RISK_PREMIUM', term_start=F('term_start')) * DAYS(xc_eff, F('term_end')) / xc_term_days + 0.0000001, 2)))"
      - result: "MX(0, RND(xc_cur_ret + xc_prev_ret + xc_endo_ret - xc_rr_back + 0.0000001, 2)) if xc_scope else MX(0, RND(xc_base_ret, 2))"
    compute_basis:
      xc_held: "when the records cannot place such a paid loss on either side of the current term_start"
      xc_scope: "only while the current term and the term before it together carry at most one premium-bearing endorsement and at most one re-rate credit, each counted by its risk premium entries,"
      xc_base_ret: "when those terms carry more than one premium-bearing endorsement or more than one re-rate credit, the base clause applies to the risk premium as written"
      xc_reason: "The cancellation effective date follows the reason on the signed request, read from the latest signed cancellation request received on the policy, a withdrawn or unsigned request not counting, as the base cancellation rule sets it"
      xc_eff: "the event date the request names for a building sold, a building removed or demolished, or contents sold or removed; the current term_start for a removal from the Special Flood Hazard Area by a Letter of Map Amendment or Revision; the policy's original effective date for a duplicate NFIP policy or a loan closing that did not occur; for a replacement by private flood insurance, the date the request names when it falls after the request was received; otherwise the date the signed request was received."
      xc_cur: "a term's risk premium being the risk premium charges booked for that term apart from those of the policy's latest premium-bearing endorsement"
      xc_prev: "the term before the current one ends at the current term_start, and the days of a term are counted as the days of the current term"
      xc_barred: "the reason is one of those that bar a refund once a claim has been paid, and a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero, where the records place that loss, or the records cannot place a paid loss on either side of the current term_start and the current term's return is held, as set out above"

      xc_cur_ret: "when the cancellation effective date falls before the current term_start, it is returned in full; when the cancellation effective date falls on or after the current term_start, the reason is one of those that bar a refund once a claim has been paid, and a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero, where the records place that loss, or the records cannot place a paid loss on either side of the current term_start and the current term's return is held, as set out above, nothing is returned; otherwise it is returned for the days from the cancellation effective date to term_end over the days of the current term."
      xc_prev_ret: "when the cancellation effective date falls on or before the start of that term, it is returned in full; when the cancellation effective date falls within that term, it is returned for the days from the cancellation effective date to the current term_start over the days of the current term; otherwise nothing is returned for it."
      xc_endo_term: "Endorsement charges returned with the term premium they belong to are returned for the days from the cancellation effective date to the end of their term over the days of the current term when their term is the one the cancellation takes effect in, in full when their term began after the cancellation effective date, and not at all when their term ended before it"
      xc_endo_ret: "when the cancellation effective date falls on or after the current term_start and the claim bar set out above applies, nothing is returned; when the policy's latest premium-bearing endorsement took effect after the cancellation effective date, its risk premium charges are returned in full; when it took effect on or before the cancellation effective date within the term the cancellation takes effect in, they are returned for the days from the cancellation effective date to the end of that term over the days from the endorsement's effective date to the end of that term; otherwise they are returned with the term premium they belong to."
      xc_rr_back: "when the Elevation Certificate behind the policy's latest risk premium re-rate credit took effect on or before the cancellation effective date within the term the cancellation takes effect in, it is that re-rate credit for the days from the cancellation effective date to the end of that term over the days from the certificate's effective date to the end of that term; when the certificate took effect after the cancellation effective date, it is the whole re-rate credit; otherwise nothing is taken back."
      result: "The working adds the returned parts the sentences below settle, in the order they are set out, and then subtracts the part taken back; each part is rounded half-up to the cent and the credit is never below zero."
    factors:
      - id: cxl_current_term_return
        effect: method
        decides: xc_cur_ret
        bindings: [xc_cur_ret]
        ladder:
          - when: "the cancellation effective date falls before the current term_start"
            method: "the current term's risk premium is returned in full"
          - when: "the cancellation effective date falls on or after the current term_start, the reason is one of those that bar a refund once a claim has been paid, and a loss dated on or after the current term_start carries claim payments, net of the payment items voided, above zero, where the records place that loss, or the records cannot place a paid loss on either side of the current term_start and the current term's return is held"

            method: "nothing is returned for the current term"
          - when: "otherwise"
            method: "the current term's risk premium is returned for the days from the cancellation effective date to term_end over the days of the current term"
        baseline:
          xc_cur_ret: "RND(xc_cur * DAYS(xc_eff, F('term_end')) / xc_term_days + 0.0000001, 2)"
        evidence: [history, date]
        cross_difficulty: null
      - id: cxl_previous_term_return
        effect: parameter
        decides: xc_prev_ret
        bindings: [xc_prev, xc_prev_ret]
        ladder:
          - when: "the cancellation effective date falls on or before the start of the term before the current one"
            value: "that term's risk premium in full"
          - when: "the cancellation effective date falls within the term before the current one"
            value: "that term's risk premium for the days from the cancellation effective date to the current term_start over the days of the current term"
          - when: "otherwise"
            value: "nothing"
        baseline:
          xc_prev_ret: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cxl_endorsement_return
        effect: method
        decides: xc_endo_ret
        bindings: [xc_endo_eff, xc_endo_in, xc_endo_ret]
        ladder:
          - when: "the cancellation effective date falls on or after the current term_start and the claim bar set out for the current term's risk premium applies"
            method: "nothing is returned"
          - when: "the policy's latest premium-bearing endorsement took effect after the cancellation effective date"
            method: "its risk premium charges are returned in full"
          - when: "it took effect on or before the cancellation effective date within the term the cancellation takes effect in"
            method: "its charges are returned for the days from the cancellation effective date to the end of that term over the days from the endorsement's effective date to the end of that term"
          - when: "otherwise"
            method: "its charges are returned with the term premium they belong to"
        baseline:
          xc_endo_ret: "xc_endo_term"
        evidence: [history, date]
        cross_difficulty: null
      - id: cxl_rerate_takeback
        effect: parameter
        decides: xc_rr_back
        bindings: [xc_n_rr, xc_rr_id, xc_rr, xc_rr_ts, xc_ec_eff, xc_rr_in, xc_rr_back]
        ladder:
          - when: "the Elevation Certificate behind the policy's latest risk premium re-rate credit took effect on or before the cancellation effective date within the term the cancellation takes effect in"
            value: "that re-rate credit for the days from the cancellation effective date to the end of that term over the days from the certificate's effective date to the end of that term"
          - when: "the certificate took effect after the cancellation effective date"
            value: "the whole re-rate credit"
          - when: "otherwise"
            value: "nothing"
        baseline:
          xc_rr_back: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The risk premium credit of a cancellation is worked out from the risk premium of the current term and of the term
        before it, a term's risk premium being the risk premium charges booked for that term apart from those of the
        policy's latest premium-bearing endorsement. In the standard working the current term's risk premium is returned for
        the days from the cancellation effective date to term_end over the days of the current term, nothing is returned for
        the term before it, the latest premium-bearing endorsement's risk premium charges are returned with the term premium
        they belong to, and no re-rate credit is taken back. The working adds the returned parts the sentences below settle, in the order they are set out, and then subtracts the part taken back; each part is rounded half-up to the cent and the credit is never below zero. Endorsement charges returned with the term
        premium they belong to are returned for the days from the cancellation effective date to the end of their term over
        the days of the current term when their term is the one the cancellation takes effect in, in full when their term
        began after the cancellation effective date, and not at all when their term ended before it; the term before the
        current one ends at the current term_start, and the days of a term are counted as the days of the current term.
      params: []
    inputs:
      history:
        - {table: nfipcom_billing, aggregate: sum, field: amount, filters: {event_type: nfipcom_premium_charged, component: RISK_PREMIUM}}
        - {table: nfipcom_billing, aggregate: sum, field: amount, filters: {event_type: nfipcom_premium_charged, charge_basis: ENDORSEMENT, component: RISK_PREMIUM}}
        - {table: nfipcom_billing, aggregate: sum, field: amount, filters: {event_type: nfipcom_premium_credit, charge_basis: RERATE, component: RISK_PREMIUM}}
        - {table: nfipcom_requests, aggregate: latest, field: requested_effective_date, filters: {outcome: SIGNED}}
        - {table: nfipcom_claims, aggregate: sum, field: payment_amount, filters: {event_type: nfipcom_claim_paid}}
      cross_category: []

  - id: nfipcom_ext_cancellation_refund
