      - cp_prev: "cp_pol_sum if (cp_n_pol > 0 and DAYS(cp_dol, cp_pol_last) <= P('proof_of_loss_days')) else (cp_paid_lieu if cp_paid_lieu > 0 else 0)"
      - cp_pol_dol: "SUM('nfipcom_claims', 'claimed_amount', event_type='nfipcom_proof_of_loss_filed', date_of_loss=cp_dol, coverage_part='CONTENTS')"
      - cp_dup_pol: "RND(cp_pol_dol - SUM('nfipcom_claims', 'claimed_amount', event_type='nfipcom_proof_of_loss_filed', claim_number=cp_cn, coverage_part='CONTENTS'), 2)"
      - cp_paid_dol: "RND(SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', date_of_loss=cp_dol, coverage_part='CONTENTS') - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', date_of_loss=cp_dol, coverage_part='CONTENTS'), 2)"
      - cp_dup_paid: "RND(cp_paid_dol - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', claim_number=cp_cn, coverage_part='CONTENTS') + SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', claim_number=cp_cn, coverage_part='CONTENTS'), 2)"
      - cp_dup: "cp_dup_pol if cp_dup_pol > 0 else (cp_dup_paid if (cp_pol_dol == 0 and cp_dup_paid > 0) else 0)"
