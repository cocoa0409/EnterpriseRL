  - id: nfipcom_ext_building_payment
    base_policy_refs: [nfipcom_claim_settlement, nfipcom_proof_of_loss, nfipcom_claim_intake, nfipcom_mortgagee_rights]
    overwrite:
      - base_policy: nfipcom_claim_settlement
        superseded_clause: >-
          A new payment on a coverage is the payable amount less what has already been paid net of voids on that claim and
          coverage (nfipcom_msr_claim_part_paid), issued only when positive;
        replaced_by: >-
          For a building payment, and only for a building payment, the payable amount is the part of the sworn building
          amount this policy carries alone plus its share of the rest, and what has already been paid is settled as the
          sentences below set out; a contents payment follows the contents payment rule, and every other coverage's new
          payment remains the payable amount less what has already been paid net of voids on that claim and coverage.
    trigger: on_request
    subject: [nfipcom_claim_paid]
    computes: payment_amount
    target_tool: issue_building_claim_payment_972d0779
    params: {}
    rule: >-
      A building payment on a claim is not issued until the claim file carries a signed and sworn building proof of loss
      received after the claim's latest adjuster report that measures a building loss. A building payment is issued on the
      policy's claim that carries its latest adjuster report, for that claim's date of loss, and the building proofs of loss
      and building payments for that date of loss include those filed under a duplicate claim number reported for the same
      date of loss. The building payment issued on a claim is worked out from the sworn building amount, which in the
      standard working is the amount sworn on the latest building proof of loss for the date of loss; in the standard
      working this policy carries the whole sworn building amount alone, there is no other insurance on the building, and
      the building payments already made are the building payments issued on the claim less the building payment items
      voided on it. Where flood insurance not issued under the National Flood Insurance Program covers the same building, a
      building payment follows the other-insurance condition that the General Property Form and the RCBAP both carry: this
      policy is primary, subject to its own deductible, up to the deductible of the other flood policy, and for the rest of
      the loss it pays the share that its building limit bears to the sum of its building limit and the other insurance on
      the building; a policy written excess of the National Flood Insurance Program leaves this policy primary for the whole
      loss. The other flood policy's deductible is one layer for the date of loss over the property that policy insures; when it insures the contents at the address as well as the building, the layer is shared between the building and the contents in proportion to the amounts sworn for each, so the part of the sworn building amount this policy carries alone is that layer multiplied by the sworn building amount and divided by the sum of the sworn building amount and the contents amount sworn for the date of loss, never more than the sworn building amount; when it insures no contents there, the contents amount sworn for the date of loss is nothing and the building carries the whole layer. The working applies its
      steps in this order: the part carried alone first, then the share of the rest, then the payments already made are
      subtracted; each step is rounded half-up to the cent, and the payment is issued only when positive. For a building
      payment, and only for a building payment, the payable amount is the part of the sworn building amount this policy
      carries alone plus its share of the rest, and what has already been paid is settled as the sentences below set out; a
      contents payment follows the contents payment rule, and every other coverage's new payment remains the payable amount
      less what has already been paid net of voids on that claim and coverage. The payee follows the mortgagee rule: a
      building payment names the insured and the mortgagee of record when the policy shows a mortgagee and the tier names
      the mortgagee on building payments, and the insured alone otherwise. For a building payment, the BizFlood policy the
      sentences below mean is the named insured's BizFlood policy whose statement of values schedules the building's address, counted only when it was in force on the date of loss and is not written excess of the National Flood
      Insurance Program. The building's location on that BizFlood policy is the location number its statement of values gives the building's address. That BizFlood policy is in force on the date of loss when the date of loss falls on or after its effective date, before its term end and before any cancellation effective date it carries. This rule issues a building payment only where the named insured's BizFlood statements of values schedule the building's address at most once and that BizFlood policy holds at most one value increase and at most one value decrease for the address; otherwise no building payment is issued under this rule, the amount being nil, and the claim is referred to the adjuster to apportion the other insurance. The sworn building amount a building payment is measured against is settled as follows: when the
      latest building proof of loss for the date of loss was received after the proof-of-loss period, counted by adding the
      days to the date of loss on the calendar, the amounts sworn on the other building proofs of loss for the date of loss
      are added together and the late one is left out; when more than one building proof of loss was filed for the date of
      loss and the latest was received within that period, the amounts sworn on all of them are added together, each later
      proof of loss claiming an additional amount; otherwise it is the amount sworn on the latest building proof of loss for
      the date of loss. The other flood policy's deductible layer a building payment uses is settled as follows: when that BizFlood policy schedules the address with a building value and the building is in flood zone V or VE, it is the BizFlood tier's V-zone deductible percentage of the location's value at the time of loss, never less than the BizFlood tier's V-zone minimum deductible, that value being the one on that policy's adjuster's latest report for the location and the date of loss and, when its adjuster has filed no report for them, the building and contents values its statement of values schedules for the location added together; when that BizFlood policy schedules the address with a building value and the building is outside flood zones V and VE, it is that BizFlood policy's flat deductible per location;
      otherwise no other flood policy's deductible applies and the layer is the sum of the building limit and the contents
      limit, so the whole sworn building amount is carried alone. The contents amount sworn for the date of loss that shares the deductible layer is settled as follows, every case requiring that BizFlood policy to declare a contents value for the address: when the latest contents proof of loss for the date of loss was received after the proof-of-loss period, it is the amounts sworn on the other contents proofs of loss for the date of loss
      added together; when contents proofs of loss were filed for the date of loss and the latest was received within that
      period, it is the amounts sworn on all of them added together; when no contents proof of loss was filed for the date
      of loss but contents payments were issued for it on the adjuster's report signed in lieu of a proof of loss, it is
      those contents payments less the contents payment items voided; otherwise it is nothing. The other insurance on the
      building is settled as follows: when that BizFlood policy schedules the building's address and a value endorsement for that location was in force on the date of loss, it is the building limit set by that endorsement, the value endorsement in force being, of the value increase and the value decrease endorsed for the location, the one that took effect later among those that took effect on or before the date of loss, an increase and a decrease taking effect the same day being settled by the one recorded later, and by the increase when both were recorded the same day; when that BizFlood policy schedules the address and no value endorsement for that location was in force on the date of loss, it is the building value
      on its statement of values for that address; otherwise there is none. The building payments already made that a
      building payment is reduced by are settled as follows: when another claim number on the policy carries the same date
      of loss as a duplicate first notice, they are the building payments issued under both claim numbers less the building
      payment items voided under both; when there is no such duplicate first notice, building payment items on the claim
      have been voided and no building payment was issued on the claim after the latest void, they are all the building
      payments issued on the claim, because the voided item is reissued on its own under a new payment reference; otherwise
      they are the building payments issued on the claim less the building payment items voided on it.
    prerequisite:
      - problem: nfipcom_ext_building_proof_amount
        kind: value_input
        gate: pb_sworn
        form: state
        policy_source: >-
          A building payment on a claim is not issued until the claim file carries a signed and sworn building proof of
          loss received after the claim's latest adjuster report that measures a building loss.
        condition: >-
          The claim's nfipcom_claims entries include an nfipcom_proof_of_loss_filed entry with coverage_part BUILDING whose
          event_date is later than the event_date of the claim's latest nfipcom_adjuster_report entry with
          building_rcv_loss above zero.
        resolved_by: sign_building_proof_of_loss_d76eab34
        effect: >-
          The newly sworn building proof of loss joins the building proofs of loss for the date of loss, so the sworn
          building amount the payment is measured against includes the additional amount just sworn.
    cross_category:
      - category: bizflood
        as: history
        reads: [effective_date, cancellation_effective_date, deductible_per_location, bizflood_policy_id, bizflood_changes.event_type, bizflood_changes.change_type, bizflood_changes.bizflood_policy_id, bizflood_changes.location_address, bizflood_changes.location_number, bizflood_changes.building_limit, bizflood_changes.change_effective_date, bizflood_claims.event_type, bizflood_claims.bizflood_policy_id, bizflood_claims.location_number, bizflood_claims.date_of_loss, bizflood_claims.location_value_at_loss]
        note: The deductible-layer and other-insurance factors read the named insured's BizFlood policy that schedules the building's address, in force on the date of loss, its statement of values and value endorsements for the building's address, and its adjuster's value at the time of loss for that location.
    compute:
      - pb_cn: "LATEST('nfipcom_claims', 'claim_number', date_field='event_date', event_type='nfipcom_adjuster_report')"
      - pb_dol: "LATEST('nfipcom_claims', 'date_of_loss', date_field='event_date', event_type='nfipcom_adjuster_report')"
      - pb_n_pol: "COUNT('nfipcom_claims', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='BUILDING')"
      - pb_pol_sum: "SUM('nfipcom_claims', 'claimed_amount', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='BUILDING')"
      - pb_pol_last_date: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='BUILDING')"
      - pb_pol_last_amt: "LATEST('nfipcom_claims', 'claimed_amount', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='BUILDING')"
      - pb_sworn: "RND(pb_pol_sum - pb_pol_last_amt, 2) if (pb_n_pol > 0 and DAYS(pb_dol, pb_pol_last_date) > P('proof_of_loss_days')) else (pb_pol_sum if pb_n_pol > 1 else pb_pol_last_amt)"
      - pb_bz: "XLATEST('bizflood', 'bizflood_changes', 'bizflood_policy_id', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'))"
      - pb_bz_eff: "CFIELD('bizflood', 'effective_date', bizflood_policy_id=pb_bz)"
      - pb_bz_cxl: "CFIELD('bizflood', 'cancellation_effective_date', bizflood_policy_id=pb_bz)"
      - pb_bz_end: "CFIELD('bizflood', 'term_end', bizflood_policy_id=pb_bz)"
      - pb_bz_primary: "pb_bz != None and pb_bz_eff != None and DAYS(pb_bz_eff, pb_dol) >= 0 and (pb_bz_cxl == None or pb_bz_cxl == '' or DAYS(pb_dol, pb_bz_cxl) > 0) and pb_bz_end != None and pb_bz_end != '' and DAYS(pb_dol, pb_bz_end) > 0 and CPARAM('bizflood', 'excess_over_nfip', bizflood_policy_id=pb_bz) == False"
      - pb_n_sched: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_bz_bldg: "XLATEST('bizflood', 'bizflood_changes', 'building_limit', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_bz_cont: "XLATEST('bizflood', 'bizflood_changes', 'contents_limit', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_loc: "XLATEST('bizflood', 'bizflood_changes', 'location_number', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_n_val: "XCOUNT('bizflood', 'bizflood_claims', event_type='bizflood_adjuster_report', bizflood_policy_id=pb_bz, location_number=pb_loc, date_of_loss=pb_dol)"
      - pb_locval: "XLATEST('bizflood', 'bizflood_claims', 'location_value_at_loss', date_field='event_date', event_type='bizflood_adjuster_report', bizflood_policy_id=pb_bz, location_number=pb_loc, date_of_loss=pb_dol)"
      - pb_lv: "pb_locval if pb_n_val > 0 else (RND(pb_bz_bldg + pb_bz_cont, 2) if (pb_bz_bldg != None and pb_bz_cont != None) else 0)"
      - pb_layer: "MX(CPARAM('bizflood', 'v_zone_min_deductible', bizflood_policy_id=pb_bz), RND(pb_lv * CPARAM('bizflood', 'v_zone_pct_deductible', bizflood_policy_id=pb_bz) / 100 + 0.0000001, 2)) if (pb_bz_primary and pb_n_sched > 0 and pb_bz_bldg > 0 and (F('flood_zone') == 'VE' or F('flood_zone') == 'V')) else (CFIELD('bizflood', 'deductible_per_location', bizflood_policy_id=pb_bz) if (pb_bz_primary and pb_n_sched > 0 and pb_bz_bldg > 0 and F('flood_zone') != 'VE' and F('flood_zone') != 'V') else F('building_coverage') + F('contents_coverage'))"
      - pb_n_cpol: "COUNT('nfipcom_claims', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='CONTENTS')"
      - pb_cpol_sum: "SUM('nfipcom_claims', 'claimed_amount', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='CONTENTS')"
      - pb_cpol_last_date: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='CONTENTS')"
      - pb_cpol_last_amt: "LATEST('nfipcom_claims', 'claimed_amount', date_field='event_date', event_type='nfipcom_proof_of_loss_filed', date_of_loss=pb_dol, coverage_part='CONTENTS')"
      - pb_cpaid: "RND(SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', date_of_loss=pb_dol, coverage_part='CONTENTS') - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', date_of_loss=pb_dol, coverage_part='CONTENTS'), 2)"
      - pb_cont: "0 if not (pb_bz_primary and pb_bz_cont != None and pb_bz_cont > 0) else (RND(pb_cpol_sum - pb_cpol_last_amt, 2) if (pb_n_cpol > 0 and DAYS(pb_dol, pb_cpol_last_date) > P('proof_of_loss_days')) else (pb_cpol_sum if pb_n_cpol > 0 else (pb_cpaid if pb_cpaid > 0 else 0)))"
      - pb_n_inc: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_inc_eff: "XLATEST('bizflood', 'bizflood_changes', 'change_effective_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_inc_lim: "XLATEST('bizflood', 'bizflood_changes', 'building_limit', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_n_dec: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_dec_eff: "XLATEST('bizflood', 'bizflood_changes', 'change_effective_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_dec_lim: "XLATEST('bizflood', 'bizflood_changes', 'building_limit', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_inc_rec: "XLATEST('bizflood', 'bizflood_changes', 'recorded_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_dec_rec: "XLATEST('bizflood', 'bizflood_changes', 'recorded_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz)"
      - pb_inc_ok: "pb_n_inc > 0 and DAYS(pb_inc_eff, pb_dol) >= 0"
      - pb_dec_ok: "pb_n_dec > 0 and DAYS(pb_dec_eff, pb_dol) >= 0"
      - pb_chg_eff: "pb_inc_eff if (pb_inc_ok and ((not pb_dec_ok) or (DAYS(pb_dec_eff, pb_inc_eff) > 0 or (DAYS(pb_dec_eff, pb_inc_eff) == 0 and DAYS(pb_dec_rec, pb_inc_rec) >= 0)))) else (pb_dec_eff if pb_dec_ok else None)"
      - pb_chg_lim: "pb_inc_lim if (pb_inc_ok and ((not pb_dec_ok) or (DAYS(pb_dec_eff, pb_inc_eff) > 0 or (DAYS(pb_dec_eff, pb_inc_eff) == 0 and DAYS(pb_dec_rec, pb_inc_rec) >= 0)))) else (pb_dec_lim if pb_dec_ok else None)"
      - pb_other: "pb_chg_lim if (pb_bz_primary and pb_bz_bldg != None and (pb_inc_ok or pb_dec_ok)) else (pb_bz_bldg if (pb_bz_primary and pb_bz_bldg != None) else 0)"
      - pb_n_notice: "COUNT('nfipcom_claims', event_type='nfipcom_claim_reported', date_of_loss=pb_dol) - COUNT('nfipcom_claims', event_type='nfipcom_claim_reported', date_of_loss=pb_dol, claim_number=pb_cn)"
      - pb_paid_dol: "RND(SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', coverage_part='BUILDING', date_of_loss=pb_dol) - SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', coverage_part='BUILDING', date_of_loss=pb_dol), 2)"
      - pb_paid_cn: "SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_paid', claim_number=pb_cn, coverage_part='BUILDING')"
      - pb_void_cn: "SUM('nfipcom_claims', 'payment_amount', event_type='nfipcom_claim_payment_voided', claim_number=pb_cn, coverage_part='BUILDING')"
      - pb_n_void: "COUNT('nfipcom_claims', event_type='nfipcom_claim_payment_voided', claim_number=pb_cn, coverage_part='BUILDING')"
      - pb_n_paidcn: "COUNT('nfipcom_claims', event_type='nfipcom_claim_paid', claim_number=pb_cn, coverage_part='BUILDING')"
      - pb_last_void: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_claim_payment_voided', claim_number=pb_cn, coverage_part='BUILDING')"
      - pb_last_paid: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_claim_paid', claim_number=pb_cn, coverage_part='BUILDING')"
      - pb_paid: "pb_paid_dol if pb_n_notice > 0 else (pb_paid_cn if (pb_n_void > 0 and pb_n_paidcn > 0 and DAYS(pb_last_void, pb_last_paid) <= 0) else RND(pb_paid_cn - pb_void_cn, 2))"
      - pb_carried: "MN(pb_sworn, RND(pb_layer * pb_sworn / (pb_sworn + pb_cont) + 0.0000001, 2)) if pb_sworn > 0 else 0"
      - pb_share: "RND(pb_carried + MX(0, pb_sworn - pb_carried) * F('building_coverage') / (F('building_coverage') + pb_other) + 0.0000001, 2)"
      - pb_one: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_sov_received', location_address=F('property_address')) <= 1 and XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz) <= 1 and XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=pb_bz) <= 1"
      - result: "(MX(0, RND(pb_share - pb_paid + 0.0000001, 2))) if pb_one else 0"
    compute_basis:
