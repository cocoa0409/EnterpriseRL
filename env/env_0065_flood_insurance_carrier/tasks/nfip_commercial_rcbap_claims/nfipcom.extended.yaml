    rule: >-
      A cancellation refund is fixed only after the policy shows the cancellation processed on the signed request, cancelled with its cancellation effective date set. The signed request a cancellation refund means is the one the risk premium CANCELLATION credit booked at processing references or, when the risk premium credit was zero and none was booked, the latest signed cancellation request received on the policy, a withdrawn or unsigned request not counting, and its reason is the cancellation reason the cancelled policy shows. Disbursing a cancellation refund books the CANCELLATION credits for the ICC
      premium, the Reserve Fund Assessment, the HFIAA surcharge, the Federal Policy Fee and the probation surcharge
