        replaced_by: >-
          For the ICC premium, Reserve Fund Assessment, HFIAA surcharge, Federal Policy Fee and probation surcharge credits a cancellation refund books, and only for those credits and only while the current term and the term before it together carry at most one premium-bearing endorsement and at most one re-rate credit, each counted by its risk premium entries, the reason's refund method is applied over the current term and the term before it as the sentences below set out, and amounts of terms earlier than that are returned only through the NFIP Bureau; when those terms carry more than one premium-bearing endorsement or more than one re-rate credit, the case the premium-received and fee sentences of this rule leave to the base clause, the base clause applies to those credits as written, that is: the refund method follows the reason: FULL_FROM_INCEPTION returns every component booked on the policy, fees included; CURRENT_TERM_FULL returns the current term's risk premium, ICC premium, Reserve Fund Assessment and HFIAA surcharge in full; PRO_RATA returns the same four components of the current term multiplied by the days from the cancellation effective date to term_end divided by the days from term_start to term_end; under CURRENT_TERM_FULL and PRO_RATA the Federal Policy Fee and probation surcharge are fully earned, the claim bar applies as stated below, and the refund is the total of the credits; the risk premium credit follows the cancellation processing rule, and every other
