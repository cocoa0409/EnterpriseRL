    factors:
      - id: bpay_sworn_total
        effect: method
        decides: pb_sworn
        bindings: [pb_n_pol, pb_pol_sum, pb_pol_last_date, pb_pol_last_amt, pb_sworn]
        ladder:
          - when: "the latest building proof of loss for the date of loss was received after the proof-of-loss period"
            method: "the amounts sworn on the other building proofs of loss for the date of loss are added together and the late one is left out"
          - when: "more than one building proof of loss was filed for the date of loss and the latest was received within that period"
            method: "the amounts sworn on all of them are added together, each later proof of loss claiming an additional amount"
          - when: "otherwise"
            method: "the amount sworn on the latest building proof of loss for the date of loss is used"
        baseline:
          pb_sworn: "pb_pol_last_amt"
        evidence: [history, date]
        cross_difficulty: null
      - id: bpay_alone_layer
        effect: parameter
        decides: pb_layer
        bindings: [pb_n_sched, pb_loc, pb_n_val, pb_locval, pb_lv, pb_layer]
        ladder:
          - when: "the named insured's BizFlood policy that schedules the building's address with a building value was in force on the date of loss and is not written excess of the National Flood Insurance Program and the building is in flood zone V or VE"
            value: "the BizFlood tier's V-zone deductible percentage of that value, never less than the V-zone minimum deductible"
          - when: "that BizFlood policy schedules the address with a building value and the building is outside flood zones V and VE"
            value: "that BizFlood policy's flat deductible per location"
          - when: "otherwise"
            value: "no other flood policy's deductible: the sum of the building limit and the contents limit, so the whole sworn building amount is carried alone"
        baseline:
          pb_layer: "F('building_coverage') + F('contents_coverage')"
        evidence: [cross_category, history]
        cross_difficulty: bizflood
      - id: bpay_contents_share
        effect: parameter
        decides: pb_cont
        bindings: [pb_n_cpol, pb_cpol_sum, pb_cpol_last_date, pb_cpol_last_amt, pb_cpaid, pb_cont]
        ladder:
          - when: "that BizFlood policy declares a contents value for the address and the latest contents proof of loss for the date of loss was received after the proof-of-loss period"
            value: "the amounts sworn on the other contents proofs of loss for the date of loss added together"
          - when: "that BizFlood policy declares a contents value for the address and contents proofs of loss were filed for the date of loss, the latest received within that period"
            value: "the amounts sworn on all of them added together"
          - when: "that BizFlood policy declares a contents value for the address, no contents proof of loss was filed for the date of loss but contents payments were issued for it on the adjuster's report signed in lieu of a proof of loss"
            value: "those contents payments less the contents payment items voided"
          - when: "otherwise"
            value: "nothing"
        baseline:
          pb_cont: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: bpay_other_cover
        effect: parameter
        decides: pb_other
        bindings: [pb_n_inc, pb_inc_eff, pb_inc_lim, pb_n_dec, pb_dec_eff, pb_dec_lim, pb_inc_rec, pb_dec_rec, pb_inc_ok, pb_dec_ok, pb_chg_eff, pb_chg_lim, pb_other]
        ladder:
          - when: "the named insured's BizFlood policy that schedules the building's address was in force on the date of loss, is not written excess of the National Flood Insurance Program, and a value endorsement for that location was in force on the date of loss"
            value: "the building limit set by the value endorsement in force on the date of loss"
          - when: "that BizFlood policy schedules the address and no value endorsement for that location was in force on the date of loss"
            value: "the building value on its statement of values for that address"
          - when: "otherwise"
            value: "none"
        baseline:
          pb_other: "0"
        evidence: [cross_category, date]
        cross_difficulty: bizflood
      - id: bpay_paid_before
        effect: parameter
        decides: pb_paid
        bindings: [pb_n_notice, pb_paid_dol, pb_paid_cn, pb_void_cn, pb_n_void, pb_n_paidcn, pb_last_void, pb_last_paid, pb_paid]
        ladder:
          - when: "another claim number on the policy carries the same date of loss as a duplicate first notice"
            value: "the building payments issued under both claim numbers less the building payment items voided under both"
          - when: "there is no such duplicate first notice, building payment items on the claim have been voided and no building payment was issued on the claim after the latest void"
            value: "all the building payments issued on the claim"
          - when: "otherwise"
            value: "the building payments issued on the claim less the building payment items voided on it"
        baseline:
          pb_paid: "RND(pb_paid_cn - pb_void_cn, 2)"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The building payment issued on a claim is worked out from the sworn building amount, which in the standard working
        is the amount sworn on the latest building proof of loss for the date of loss; in the standard working this policy
        carries the whole sworn building amount alone, there is no other insurance on the building, and the building
        payments already made are the building payments issued on the claim less the building payment items voided on it.
        Where flood insurance not issued under the National Flood Insurance Program covers the same building, a building
        payment follows the other-insurance condition that the General Property Form and the RCBAP both carry: this policy
        is primary, subject to its own deductible, up to the deductible of the other flood policy, and for the rest of the
        loss it pays the share that its building limit bears to the sum of its building limit and the other insurance on the
        building; a policy written excess of the National Flood Insurance Program leaves this policy primary for the whole
        loss. The other flood policy's deductible is one layer for the date of loss over the property that policy insures; when it insures the contents at the address as well as the building, the layer is shared between the building and the contents in proportion to the amounts sworn for each, so the part of the sworn building amount this policy carries alone is that layer multiplied by the sworn building amount and divided by the sum of the sworn building amount and the contents amount sworn for the date of loss, never more than the sworn building amount; when it insures no contents there, the contents amount sworn for the date of loss is nothing and the building carries the whole layer. The working applies its
        steps in this order: the part carried alone first, then the share of the rest, then the payments already made are
        subtracted; each step is rounded half-up to the cent, and the payment is issued only when positive.
      params: []
    inputs:
      history:
        - {table: nfipcom_claims, aggregate: sum, field: claimed_amount, filters: {event_type: nfipcom_proof_of_loss_filed, coverage_part: BUILDING}}
        - {table: nfipcom_claims, aggregate: sum, field: claimed_amount, filters: {event_type: nfipcom_proof_of_loss_filed, coverage_part: CONTENTS}}
        - {table: nfipcom_claims, aggregate: sum, field: payment_amount, filters: {event_type: nfipcom_claim_paid, coverage_part: BUILDING}}
        - {table: nfipcom_claims, aggregate: count, field: claim_number, filters: {event_type: nfipcom_claim_reported}}
        - {category: bizflood, table: bizflood_changes, aggregate: latest, field: building_limit, filters: {event_type: bizflood_endorsement_issued}}
        - {category: bizflood, table: bizflood_claims, aggregate: latest, field: location_value_at_loss, filters: {event_type: bizflood_adjuster_report}}
      cross_category: [bizflood]

  - id: nfipcom_ext_contents_proof_amount
    base_policy_refs: [nfipcom_proof_of_loss, nfipcom_claim_settlement, nfipcom_claim_intake, nfipcom_coverage_limits_deductibles]
    overwrite:
      - base_policy: nfipcom_claim_settlement
        superseded_clause: >-
          Contents are always settled at actual cash value less the contents deductible, never below zero, capped at the
          contents limit, and cover only the property described by contents_owner_basis.
        replaced_by: >-
          For a contents amount sworn on a contents proof of loss, and only for such an amount, the contents loss at
          actual cash value is first held to the contents value ceiling, then the contents deductible is subtracted, the
          remainder is never below zero and never above the contents limit, and it covers only the property the tier's
          contents owner basis describes; every other contents settlement remains at actual cash value less the contents
          deductible, never below zero, capped at the contents limit.
      - base_policy: nfipcom_coverage_limits_deductibles
        superseded_clause: >-
          the minimum contents deductible is min_contents_deductible.
        replaced_by: >-
          For the contents deductible a contents proof of loss subtracts, and only for that deductible, the minimum follows
          the building limit the way the federal minimum deductibles pair the building and contents minimums: the higher
          minimum building deductible when the building limit is above the deductible threshold, and the tier's minimum
          contents deductible otherwise; every other minimum contents deductible remains the tier's minimum contents
          deductible.
    trigger: on_request
    subject: [nfipcom_proof_of_loss_filed]
    computes: claimed_amount
    target_tool: sign_contents_proof_of_loss_65413413
    params: {}
    rule: >-
      A contents proof of loss is the signed and sworn statement in which an authorized signer of the named insured states
      the contents amount claimed for a date of loss, and it is filed under the policy's claim that carries its latest
      adjuster report. The contents amount sworn on a contents proof of loss is worked out from the contents loss at actual
      cash value on the claim's FINAL adjuster report. In the standard working the contents value ceiling is the contents
      limit, the contents deductible subtracted is the one shown on the policy, and no contents amount is treated as already
      sworn on the claim or under a duplicate claim number. The working applies its steps in this order: the contents value
      ceiling first, then the deductible, then the contents limit, then what is already sworn. The contents loss is held to
      the contents value ceiling, the contents deductible is then subtracted, the remainder is held between zero and the
      contents limit, and the contents amount already sworn on the claim and the contents amount already sworn under a
      duplicate claim number are subtracted, the amount sworn never going below zero. Every amount in the contents working
      is rounded half-up to the cent. For a contents amount sworn on a contents proof of loss, and only for such an amount,
      the contents loss at actual cash value is first held to the contents value ceiling, then the contents deductible is
      subtracted, the remainder is never below zero and never above the contents limit, and it covers only the property the
      tier's contents owner basis describes; every other contents settlement remains at actual cash value less the contents
      deductible, never below zero, capped at the contents limit. For the contents deductible a contents proof of loss
      subtracts, and only for that deductible, the minimum follows the building limit the way the federal minimum
      deductibles pair the building and contents minimums: the higher minimum building deductible when the building limit is
      above the deductible threshold, and the tier's minimum contents deductible otherwise; every other minimum contents
      deductible remains the tier's minimum contents deductible. The adjuster report a contents proof of loss swears from is
      settled as follows: when the claim's latest SUPPLEMENTAL report was filed after its latest FINAL report and measures a
      contents loss above zero, it is that SUPPLEMENTAL report; when the claim has no FINAL report, it is the claim's latest
      PRELIMINARY report; otherwise it is the claim's latest FINAL report. The contents value ceiling is settled as follows, the BizFlood
      policy meant being the named insured's BizFlood policy whose statement of values schedules the building's address, counted only when it was in force on the date of loss : when that BizFlood policy declares a contents value
      for the address and a value endorsement for that location was in force on the date of loss, it is the contents limit set by that endorsement, the value endorsement in force being, of the value increase and the value decrease endorsed for the location, the one that took effect later among those that took effect on or before the date of loss, an increase and a decrease taking effect the same day being settled by the one recorded later, and by the increase when both were recorded the same day; when that BizFlood policy declares a contents value
      for the address and no value endorsement for that location was in force on the date of loss, it is the contents value on its statement of values; otherwise it is the contents
      limit. The building's location on that BizFlood policy is the location number its statement of values gives the building's address. That BizFlood policy is in force on the date of loss when the date of loss falls on or after its effective date, before its term end and before any cancellation effective date it carries. The BizFlood readings above are used only where the named insured's BizFlood statements of values schedule the building's address at most once and that BizFlood policy holds at most one value increase and at most one value decrease for the address; otherwise the contents value ceiling is the contents limit. The contents deductible a contents proof of loss subtracts is settled as follows: when the building limit is
      above the deductible threshold, the contents deductible shown on the policy is below the higher minimum building
      deductible and the premium account shows a renewal risk premium charge, it is that higher minimum; when the building
      limit is at or below the deductible threshold, the contents deductible shown on the policy is below the tier's minimum
      contents deductible and the premium account shows a renewal risk premium charge, it is that minimum contents
      deductible; otherwise it is the contents deductible shown on the policy. The contents amount already sworn on the
      claim is worked out as follows: when the claim carries contents proofs of loss and the latest of them was received no
      later than the proof-of-loss period after the date of loss, counted by adding the days to the date of loss on the
      calendar, the amounts sworn on them are added together; when the claim carries no contents proof of loss whose latest
      was received within that period but contents payments were issued on the claim on the adjuster's report signed in lieu
      of a proof of loss, the contents payment items voided on the claim are subtracted from the contents payments issued on
      it; otherwise nothing is already sworn on the claim. The contents amount already sworn under a duplicate claim number
      reported for the same date of loss is settled as follows: when contents proofs of loss were filed under that number,
      it is the amounts sworn on them; when no contents proof of loss was filed for the date of loss under either number but
      contents payments were issued under that number, it is those payments less the contents payment items voided under it;
      otherwise it is nothing.
    prerequisite: []
    cross_category:
      - category: bizflood
        as: history
        reads: [effective_date, cancellation_effective_date, bizflood_changes.event_type, bizflood_changes.change_type, bizflood_changes.bizflood_policy_id, bizflood_changes.location_address, bizflood_changes.contents_limit, bizflood_changes.change_effective_date]
        note: The contents value ceiling reads the contents value the named insured declared for the address on the BizFlood statement of values, or set by a BizFlood value endorsement in force on the date of loss.
    compute:
      - cp_cn: "LATEST('nfipcom_claims', 'claim_number', date_field='event_date', event_type='nfipcom_adjuster_report')"
      - cp_dol: "LATEST('nfipcom_claims', 'date_of_loss', date_field='event_date', event_type='nfipcom_adjuster_report')"
      - cp_n_final: "COUNT('nfipcom_claims', event_type='nfipcom_adjuster_report', claim_number=cp_cn, report_type='FINAL')"
      - cp_n_supp: "COUNT('nfipcom_claims', event_type='nfipcom_adjuster_report', claim_number=cp_cn, report_type='SUPPLEMENTAL')"
      - cp_final_date: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_adjuster_report', claim_number=cp_cn, report_type='FINAL')"
      - cp_supp_date: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_adjuster_report', claim_number=cp_cn, report_type='SUPPLEMENTAL')"
      - cp_supp_cont: "LATEST('nfipcom_claims', 'contents_acv_loss', date_field='event_date', event_type='nfipcom_adjuster_report', claim_number=cp_cn, report_type='SUPPLEMENTAL')"
      - cp_prelim_date: "LATEST('nfipcom_claims', 'event_date', date_field='event_date', event_type='nfipcom_adjuster_report', claim_number=cp_cn, report_type='PRELIMINARY')"
      - cp_gov_date: "cp_supp_date if (cp_n_final > 0 and cp_n_supp > 0 and DAYS(cp_final_date, cp_supp_date) > 0 and cp_supp_cont > 0) else (cp_prelim_date if cp_n_final == 0 else cp_final_date)"
      - cp_gov_type: "'SUPPLEMENTAL' if (cp_n_final > 0 and cp_n_supp > 0 and DAYS(cp_final_date, cp_supp_date) > 0 and cp_supp_cont > 0) else ('PRELIMINARY' if cp_n_final == 0 else 'FINAL')"
      - cp_measured: "LATEST('nfipcom_claims', 'contents_acv_loss', date_field='event_date', event_type='nfipcom_adjuster_report', claim_number=cp_cn, report_type=cp_gov_type, event_date=cp_gov_date)"
      - cp_bz: "XLATEST('bizflood', 'bizflood_changes', 'bizflood_policy_id', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'))"
      - cp_bz_eff: "CFIELD('bizflood', 'effective_date', bizflood_policy_id=cp_bz)"
      - cp_bz_cxl: "CFIELD('bizflood', 'cancellation_effective_date', bizflood_policy_id=cp_bz)"
      - cp_bz_end: "CFIELD('bizflood', 'term_end', bizflood_policy_id=cp_bz)"
      - cp_bz_in: "cp_bz != None and cp_bz_eff != None and DAYS(cp_bz_eff, cp_dol) >= 0 and (cp_bz_cxl == None or cp_bz_cxl == '' or DAYS(cp_dol, cp_bz_cxl) > 0) and cp_bz_end != None and cp_bz_end != '' and DAYS(cp_dol, cp_bz_end) > 0"
      - cp_sov_cont: "XLATEST('bizflood', 'bizflood_changes', 'contents_limit', date_field='recorded_date', event_type='bizflood_sov_received', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_n_inc: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_inc_eff: "XLATEST('bizflood', 'bizflood_changes', 'change_effective_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_inc_cont: "XLATEST('bizflood', 'bizflood_changes', 'contents_limit', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_n_dec: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_dec_eff: "XLATEST('bizflood', 'bizflood_changes', 'change_effective_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_dec_cont: "XLATEST('bizflood', 'bizflood_changes', 'contents_limit', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_inc_rec: "XLATEST('bizflood', 'bizflood_changes', 'recorded_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_dec_rec: "XLATEST('bizflood', 'bizflood_changes', 'recorded_date', date_field='change_effective_date', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz)"
      - cp_inc_ok: "cp_n_inc > 0 and DAYS(cp_inc_eff, cp_dol) >= 0"
      - cp_dec_ok: "cp_n_dec > 0 and DAYS(cp_dec_eff, cp_dol) >= 0"
      - cp_chg_eff: "cp_inc_eff if (cp_inc_ok and ((not cp_dec_ok) or (DAYS(cp_dec_eff, cp_inc_eff) > 0 or (DAYS(cp_dec_eff, cp_inc_eff) == 0 and DAYS(cp_dec_rec, cp_inc_rec) >= 0)))) else (cp_dec_eff if cp_dec_ok else None)"
      - cp_chg_cont: "cp_inc_cont if (cp_inc_ok and ((not cp_dec_ok) or (DAYS(cp_dec_eff, cp_inc_eff) > 0 or (DAYS(cp_dec_eff, cp_inc_eff) == 0 and DAYS(cp_dec_rec, cp_inc_rec) >= 0)))) else (cp_dec_cont if cp_dec_ok else None)"
      - cp_one: "XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_sov_received', location_address=F('property_address')) <= 1 and XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_INCREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz) <= 1 and XCOUNT('bizflood', 'bizflood_changes', event_type='bizflood_endorsement_issued', change_type='VALUE_DECREASE', location_address=F('property_address'), bizflood_policy_id=cp_bz) <= 1"
      - cp_ceiling: "cp_chg_cont if (cp_one and cp_bz_in and cp_sov_cont > 0 and (cp_inc_ok or cp_dec_ok)) else (cp_sov_cont if (cp_one and cp_bz_in and cp_sov_cont > 0) else F('contents_coverage'))"
      - cp_n_renewal: "COUNT('nfipcom_billing', event_type='nfipcom_premium_charged', charge_basis='RENEWAL', component='RISK_PREMIUM')"
      - cp_ded: "P('min_building_deductible_over_threshold') if (F('building_coverage') > P('deductible_limit_threshold') and F('contents_deductible') < P('min_building_deductible_over_threshold') and cp_n_renewal > 0) else (P('min_contents_deductible') if (F('building_coverage') <= P('deductible_limit_threshold') and F('contents_deductible') < P('min_contents_deductible') and cp_n_renewal > 0) else F('contents_deductible'))"
      - cp_net: "MN(MX(0, RND(MN(cp_measured, cp_ceiling) - cp_ded + 0.0000001, 2)), F('contents_coverage'))"
      - cp_n_pol: "COUNT('nfipcom_claims', event_type='nfipcom_proof_of_loss_filed', claim_number=cp_cn, coverage_part='CONTENTS')"
