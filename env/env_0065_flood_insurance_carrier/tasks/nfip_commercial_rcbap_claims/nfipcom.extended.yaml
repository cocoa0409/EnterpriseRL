aim bar applies as stated below, and the refund is the total of the credits; the risk premium credit follows the cancellation processing rule, and
      every other credit follows the refund method as the base cancellation rule states it. For a cancellation refund whose current term and the term before it together carry at most one premium-bearing endorsement and at most one re-rate credit, each counted by its risk premium entries, and only for such a refund, the Federal Policy Fee and probation surcharge of a term that began after the cancellation took effect are returned in full, while those of the term in which a cancellation under CURRENT_TERM_FULL or PRO_RATA takes effect stay fully earned; for a cancellation refund whose terms carry more than one premium-bearing endorsement or more than one re-rate credit, and for every other Federal Policy Fee and probation surcharge, the base clause stands: under CURRENT_TERM_FULL and PRO_RATA the Federal Policy Fee and probation surcharge are fully earned (fees_refundable_on_pro_rata is false). The cancellation refund adds up every CANCELLATION credit referencing the signed request, those booked at processing and those this refund books, and, where the booking sentence above adds it, the premium received but not owed; each credit is rounded half-up to the cent before they are added, and the refund is never below zero. In
      the standard refund working the ICC premium and the Reserve Fund Assessment of the current term are returned for the
      days from the cancellation effective date to term_end over the days of the current term, the Federal Policy Fee and
      probation surcharge are fully earned, and no premium is treated as received but not owed. The HFIAA surcharge is
