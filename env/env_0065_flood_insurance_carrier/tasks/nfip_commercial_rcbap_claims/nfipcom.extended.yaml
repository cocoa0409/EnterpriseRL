      pb_layer: "when that BizFlood policy schedules the address with a building value and the building is in flood zone V or VE, it is the BizFlood tier's V-zone deductible percentage of the location's value at the time of loss, never less than the BizFlood tier's V-zone minimum deductible, that value being the one on that policy's adjuster's latest report for the location and the date of loss and, when its adjuster has filed no report for them, the building and contents values its statement of values schedules for the location added together; when that BizFlood policy schedules the address with a building value and the building is outside flood zones V and VE, it is that BizFlood policy's flat deductible per location; otherwise no other flood policy's deductible applies and the layer is the sum of the building limit and the contents limit, so the whole sworn building amount is carried alone."
      pb_cont: "every case requiring that BizFlood policy to declare a contents value for the address: when the latest contents proof of loss for the date of loss was received after the proof-of-loss period, it is the amounts sworn on the other contents proofs of loss for the date of loss added together; when contents proofs of loss were filed for the date of loss and the latest was received within that period, it is the amounts sworn on all of them added together; when no contents proof of loss was filed for the date of loss but contents payments were issued for it on the adjuster's report signed in lieu of a proof of loss, it is those contents payments less the contents payment items voided; otherwise it is nothing."
      pb_other: "when that BizFlood policy schedules the building's address and a value endorsement for that location was in force on the date of loss, it is the building limit set by that endorsement, the value endorsement in force being, of the value increase and the value decrease endorsed for the location, the one that took effect later among those that took effect on or before the date of loss, an increase and a decrease taking effect the same day being settled by the one recorded later, and by the increase when both were recorded the same day; when that BizFlood policy schedules the address and no value endorsement for that location was in force on the date of loss, it is the building value on its statement of values for that address; otherwise there is none."
      pb_paid: "when another claim number on the policy carries the same date of loss as a duplicate first notice, they are the building payments issued under both claim numbers less the building payment items voided under both; when there is no such duplicate first notice, building payment items on the claim have been voided and no building payment was issued on the claim after the latest void, they are all the building payments issued on the claim, because the voided item is reissued on its own under a new payment reference; otherwise they are the building payments issued on the claim less the building payment items voided on it."
      pb_carried: "the part of the sworn building amount this policy carries alone is that layer multiplied by the sworn building amount and divided by the sum of the sworn building amount and the contents amount sworn for the date of loss, never more than the sworn building amount; when it insures no contents there, the contents amount sworn for the date of loss is nothing and the building carries the whole layer."
