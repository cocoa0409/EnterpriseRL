    rule: 'For a renewal remittance the insured makes before the term end on a policy on a tier that carries no ICC coverage, and only for such a remittance, the risk premium of the renewed term follows the cap rule of this policy and the Federal Policy Fee of the coming term is the fee rated on the policy; every other renewal keeps the base rule: the risk premium booked for the renewed term is the lower of that indicated premium and the prior term''s rated_risk_premium increased by annual_risk_premium_increase_cap_pct, rounded to the cent; the ICC premium and Federal Policy Fee are the engine''s figures for the coming term. For a policy that carries the insured''s primary-residence designation on a tier that can carry the lower surcharge while its current term was booked with the other HFIAA surcharge, on which the insured makes a renewal remittance before the term end, and only for such a policy, the current term''s HFIAA surcharge is reduced by the residence credit of this policy, the credit being booked with the remittance as a re-rate credit on the current term''s HFIAA surcharge line and deducted from the remittance; on every other policy, and for the Federal Policy Fee and the probation surcharge on every policy, the HFIAA surcharge, the Federal Policy Fee and the probation surcharge are booked once per term at new business or renewal and never on an endorsement. For a credit balance no larger than the renewal premium on a policy whose insured is the payor of record and makes a renewal remittance before the term end, and only for such a balance, the balance is set against that remittance as the set-off rule of this policy states; every other credit, a credit balance larger than the renewal premium included, is refunded to the payor of record, and every refund is paid to the payor of record: payee LENDER_ESCROW when premium_payor is LENDER_ESCROW, and payee INSURED otherwise. For a renewal remittance the insured makes before the term end while the policy''s premium account shows a balance owed, and only for such a remittance, the remittance also pays that balance as the set-off rule of this policy states; every other payment is accepted only by one of the accepted_payment_methods and is applied to the policy and term named on the payment; it is never moved to another policy of the same customer. The renewal remittance is fixed only after the premium account for the expiring term carries the charge for every coverage change recorded during that term. The indicated premium is the one on the renewal bill for the term that starts on this policy''s term end, the most recently issued such bill. The residence basis: the coming term is rated as the insured''s primary residence when the tier can carry the lower surcharge and the policy carries the insured''s primary-residence designation, the designation being the record of the residence documentation the insured gave. The annual cap percentage is 18 percent when the coming term is rated as the insured''s primary residence and 25 percent otherwise, as the statutory limits for those categories set it. The cap rule: the capped amount is the rated risk premium increased by the annual cap percentage and rounded half-up to the cent, and the renewed risk premium is the lower of the indicated premium and the capped amount. The renewal premium is the sum of the coming term''s components as the rules of this policy give them, the reserve fund assessment being the reserve fund assessment percentage of the renewed risk premium rounded half-up to the cent and the Federal Policy Fee being the fee rated on the policy. The remittance is the renewal premium adjusted as the rules of this policy give, in this order: adjustments first, then limits, then the credits booked with the remittance, rounded half-up to the cent. The standard remittance is the coming term''s premium alone. The rise kept outside the cap is, when the deductible decrease recorded last took effect during the expiring term, that decrease''s
      full-term risk premium less the risk premium booked for the term at its start; when the coverage increase recorded last took effect during the expiring term and no such deductible decrease did, that increase''s full-term risk premium less the risk premium booked for the term at its start; and nothing otherwise. A rise kept outside the cap is taken out of the rated risk premium before the cap is applied and added to the capped amount before the lower figure is taken. The term surcharges are the tier''s primary-residence HFIAA surcharge and the probation surcharge when the coming term is rated as the insured''s primary residence and the community is on probation; the primary-residence HFIAA surcharge alone when it is so rated and the community is not on probation; the other HFIAA surcharge and the probation surcharge when it is not so rated and the community is on probation; and the other HFIAA surcharge otherwise. The residence credit returns the part of the current term''s HFIAA surcharge above the tier''s primary-residence surcharge for the part of the term the insured has lived at the insured building, because a primary residence is the home the insured lives in for more than half of the term: the move date is the date on which the insured''s former home, insured with Tidemark under a HomeFlood policy, was cancelled because that home was sold, taking the latest such sale, and the surcharge gap is the HFIAA surcharge booked for the current term less the tier''s primary-residence surcharge, never below zero; when the coming term is rated as the insured''s primary residence and the move took effect on or before the current term start, the credit is the whole surcharge gap; when it is so rated and the move took effect after the term start with more than half of the term''s days running from the move date to the term end, the credit is the surcharge gap for the days from the move date to the term end over the days of the current term, rounded half-up to the cent; otherwise, with no move on record or half of the term''s days or fewer remaining, there is no residence credit on the current term and the lower surcharge applies from the renewal. The set-off rule reads the policy''s premium account and applies when the insured is the payor of record: when the account holds a credit balance, the balance is subtracted from the remittance; when the account shows a balance owed, that balance is added to the remittance; otherwise nothing is set against the remittance. The bill window is measured from the date the renewal bill was issued to the day of the remittance and is 45 days when the policy is mortgage-required, 30 days when it is not, and no days when there is no renewal bill; when the remittance falls outside the window, the remittance before the credits booked with it may not be less than the renewal premium. The term-end window is measured from the day of the remittance to the term end and is 30 days when the premium booked at the expiring term''s start was paid in full by payments other than escrow disbursements, 15 days when escrow disbursements paid any of it, and no days otherwise; when the remittance falls outside the window, the remittance before the credits booked with it may not be less than the renewal premium. The claim window is measured from the date the renewal bill was issued to the day of the remittance and is 60 days when no flood claim with a date of loss in the expiring term has been reported on the policy, 45 days when such claims were reported and the most recent of them, the one with the latest date of loss, has a payment or a denial on record, and no days otherwise; when the remittance falls outside the window, the remittance before the credits booked with it may not be less than the renewal premium. A remittance on a tier that carries ICC coverage is not settled under this schedule: it is referred to the underwriting desk and nothing is computed under this policy.'
    prerequisite:
    - problem: dwelling_ext_deductible_decrease_charge
      kind: value_input
      gate: outside_rise
      form: state
      policy_source: The renewal remittance is fixed only after the premium account for the expiring term carries the charge for every coverage change recorded during that term.
      condition: dwelling_billing carries ENDORSEMENT charges for the expiring term referencing every dwelling_endorsement_issued COVERAGE_INCREASE or DEDUCTIBLE_DECREASE record of that term, and those records carry their change_effective_date.
      resolved_by: bill_deductible_decrease_87aa0055
      effect: Billing the deductible decrease records its effective date inside the expiring term, so its rise is kept outside the cap, and raises the rated risk premium the cap starts from.
    cross_category:
    - category: homeflood
      as: history
      reads:
      - status
      - cancellation_reason
      - cancellation_effective_date
      note: The residence credit reads the sale date of the insured's former home, cancelled under its HomeFlood policy, as the move date.
    compute:
    - indicated: LATEST('dwelling_changes', 'indicated_risk_premium', date_field='recorded_date', event_type='dwelling_renewal_offered', renewal_term_start=F('term_end'))
    - bill_date: LATEST('dwelling_changes', 'recorded_date', date_field='recorded_date', event_type='dwelling_renewal_offered', renewal_term_start=F('term_end'))
    - booked_risk: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='RENEWAL', term_start=F('term_start')) + SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='NEW_BUSINESS', term_start=F('term_start'))
    - dd_effective: LATEST('dwelling_changes', 'change_effective_date', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='DEDUCTIBLE_DECREASE')
    - dd_figure: LATEST('dwelling_changes', 'rerated_risk_premium', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='DEDUCTIBLE_DECREASE')
    - inc_effective: LATEST('dwelling_changes', 'change_effective_date', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE')
    - inc_figure: LATEST('dwelling_changes', 'rerated_risk_premium', date_field='recorded_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE')
    - dd_in_term: dd_effective != None and dd_effective != '' and dd_effective >= F('term_start') and dd_effective < F('term_end')
    - inc_in_term: inc_effective != None and inc_effective != '' and inc_effective >= F('term_start') and inc_effective < F('term_end')
    - outside_rise: (dd_figure - booked_risk) if dd_in_term else ((inc_figure - booked_risk) if inc_in_term else 0)
    - primary_basis: P('hfiaa_primary_residence_eligible') == True and F('primary_residence') == True
    - term_surcharge: (P('hfiaa_surcharge_primary_residence') + P('probation_surcharge')) if (primary_basis and F('community_probation') == True) else (P('hfiaa_surcharge_primary_residence') if (primary_basis and F('community_probation') != True) else ((P('hfiaa_surcharge_other') + P('probation_surcharge')) if (primary_basis == False and F('community_probation') == True) else P('hfiaa_surcharge_other')))
    - term_days: DAYS(F('term_start'), F('term_end'))
    - sale_date: XLATEST('homeflood', 'homeflood_policies', 'cancellation_effective_date', date_field='cancellation_effective_date', status='cancelled', cancellation_reason='PROPERTY_SOLD')
    - booked_hfiaa: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='HFIAA_SURCHARGE', term_start=F('term_start'))
    - surcharge_gap: MX(0, booked_hfiaa - P('hfiaa_surcharge_primary_residence'))
    - residence_credit: surcharge_gap if (primary_basis and sale_date != None and sale_date != '' and sale_date <= F('term_start')) else (RND(surcharge_gap * DAYS(sale_date, F('term_end')) / term_days + K('eps'), 2) if (primary_basis and sale_date != None and sale_date != '' and sale_date > F('term_start') and DAYS(sale_date, F('term_end')) * 2 > term_days) else 0)
    - cap_pct: K('primary_cap_pct') if primary_basis else K('non_primary_cap_pct')
    - cap_figure: RND((F('rated_risk_premium') - outside_rise) * (1 + cap_pct / 100) + K('eps'), 2)
    - renewed_risk: MN(indicated, cap_figure + outside_rise)
    - renewed_rfa: RND(renewed_risk * P('reserve_fund_assessment_pct') / 100 + K('eps'), 2)
    - renewal_premium: renewed_risk + renewed_rfa + term_surcharge + F('rated_federal_policy_fee')
    - ledger_balance: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged') + SUM('dwelling_billing', 'amount', event_type='dwelling_refund_disbursed') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_payment') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_credit')
    - setoff: 0 if F('premium_payor') != 'INSURED' else (ledger_balance if ledger_balance < 0 else (ledger_balance if ledger_balance > 0 else 0))
    - bill_window: K('required_bill_window_days') if (bill_date != None and F('mortgage_required') == True) else (K('plain_bill_window_days') if bill_date != None else 0)
    - start_charges: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', charge_basis='RENEWAL', term_start=F('term_start')) + SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', charge_basis='NEW_BUSINESS', term_start=F('term_start'))
    - escrow_paid: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_payment', payment_method='ESCROW_DISBURSEMENT', term_start=F('term_start'))
    - other_paid: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_payment', term_start=F('term_start')) - escrow_paid
    - term_end_window: K('insured_term_end_window_days') if (start_charges > 0 and other_paid >= start_charges) else (K('escrow_term_end_window_days') if escrow_paid > 0 else 0)
    - loss_claim: LATEST('dwelling_claims', 'claim_number', date_field='date_of_loss', event_type='dwelling_claim_reported')
    - loss_date: LATEST('dwelling_claims', 'date_of_loss', date_field='date_of_loss', event_type='dwelling_claim_reported')
    - loss_closed: COUNT('dwelling_claims', event_type='dwelling_claim_paid', claim_number=loss_claim) + COUNT('dwelling_claims', event_type='dwelling_claim_denied', claim_number=loss_claim) >= 1
    - claim_window: K('no_claim_window_days') if (loss_date == None or loss_date < F('term_start')) else (K('closed_claim_window_days') if loss_closed else 0)
    - adjusted: renewal_premium + (setoff if 0 - setoff <= renewal_premium else 0)
    - bill_floor: 0 if (bill_date != None and DAYS(bill_date, NOW) <= bill_window) else renewal_premium
    - term_end_floor: 0 if DAYS(NOW, F('term_end')) <= term_end_window else renewal_premium
    - claim_floor: 0 if (bill_date != None and DAYS(bill_date, NOW) <= claim_window) else renewal_premium
    - result: RND(MX(adjusted, bill_floor, term_end_floor, claim_floor) - residence_credit + K('eps'), 2) if P('icc_available') == False else 0
