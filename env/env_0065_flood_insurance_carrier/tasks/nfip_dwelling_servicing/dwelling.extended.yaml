    - anchor_date: replacing_effective if (CFIELD('homeflood', 'homeflood_policy_id', status='active', replaced_nfip_policy_number=F('policy_number')) != None and DAYS(F('original_effective_date'), replacing_effective) >= 0 and DAYS(replacing_effective, NOW) >= 0) else (F('original_effective_date') if (CFIELD('homeflood', 'homeflood_policy_id', status='active', replaced_nfip_policy_number=F('policy_number')) != None and DAYS(replacing_effective, F('original_effective_date')) > 0) else signing_date)
