      replaced_by: 'For a renewal remittance the insured makes before the term end on a policy on a tier that carries no ICC coverage, and only for such a remittance, the risk premium of the renewed term follows the cap rule of this policy and the Federal Policy Fee of the coming term is the fee rated on the policy; every other renewal keeps the base rule: the risk premium booked for the renewed term is the lower of that indicated premium and the prior term''s rated_risk_premium increased by annual_risk_premium_increase_cap_pct, rounded to the cent; the ICC premium and Federal Policy Fee are the engine''s figures for the coming term.'
