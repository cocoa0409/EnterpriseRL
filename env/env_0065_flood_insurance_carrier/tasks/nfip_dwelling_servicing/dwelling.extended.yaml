    - paid_up_limit: ''''' if (replacing_last_paid != None and DAYS(replacing_last_paid, NOW) <= paid_up_window) else signing_date'
    - own_deductible: F('contents_deductible') if F('building_coverage') == 0 else F('building_deductible')
    - breadth_excess: K('contents_only_deductible_excess') if (F('mortgage_required') == False and CFIELD('homeflood', 'variant_name', status='active', replaced_nfip_policy_number=F('policy_number')) == 'HomeFlood Renters') else (K('building_deductible_excess') if F('mortgage_required') == False else K('required_deductible_excess'))
    - breadth_limit: ''''' if (replacing_deductible != None and replacing_deductible <= own_deductible + breadth_excess) else signing_date'
