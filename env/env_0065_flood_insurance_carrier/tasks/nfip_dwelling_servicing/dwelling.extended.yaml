no earlier than the signing date. The lead window is measured from the replacing policy''s application date to its effective date and is 30 days when the replacing policy was written on the basis that it replaces an NFIP policy with no gap; 20 days when it was written on the standard waiting basis; and no days otherwise; when the replacing policy''s application came longer before its effective date than the window allows, the request may be dated no earlier than the signing date. The paid-up window is measured from the latest premium payment on the replacing policy to the signing date and is 365 days under an annual payment plan, 183 days under a semi-annual plan, 92 days under a quarterly plan, and no days otherwise; when the latest payment came longer before the signing date than the window allows, the request may be dated no earlier than the signing date. The breadth test compares the replacing policy''s deductible with this policy''s own deductible, which is the contents deductible on a policy with no building coverage and the building deductible otherwise: the replacing deductible may exceed it by 1000 dollars when this policy is not mortgage-required and the replacing policy is a HomeFlood Renters plan; by 500 dollars when this policy is not mortgage-required and the replacing policy is any other plan; and by nothing when this policy is mortgage-required; when the replacing deductible exceeds this policy''s deductible by more than that, the request may be dated no earlier than the signing date.'
