 standard dating is 30 days after the receipt date, and the standard rise is the request''s full-term risk premium less the rated risk premium on the policy. The dating rules: the waiting days are counted from the receipt date, except that an increase requested with the coming term''s renewal premium takes effect at the coming term start; when more than one dating applies, the one giving the earlier effective date is recorded. The waiting days are 1 when the policy''s recorded map revision placed the building in a Special Flood Hazard Area and the receipt date falls no later than 13 calendar months after that revision, counted by adding calendar months to the revision date with a receipt on the last day qualifying; 0 when the increase was requested with the coming term''s renewal premium; and 30 otherwise. The premium window is measured from the request date to the payment date and is 45 days when the payment came from a lender''s escrow account, 30 days when it came by any other method, and no days when no payment was received; when the premium was not received within the window, the increase may take effect no earlier than the standard dating. The quote window is measured from the request date to the receipt date and is 60 days when the increase was requested with the coming term''s renewal premium, 30 days when the request carries a full-term risk premium from the rating engine, and no days otherwise; when the receipt date falls outside the window, the increase may take effect no earlier than the standard dating. The rise rule: when the request carries no full-term risk premium from the rating engine, there is no rise; otherwise, when a re-rate credit from an applied Elevation Certificate was booked on the current term after the request was recorded, the rise is the request''s full-term risk premium less the risk premium booked for the term at its start, because both figures stand on the rating basis the request was rated on; otherwise the rise is the request''s full-term
      risk premium less the rated risk premium on the policy. The increase takes effect on the latest of the dates the dating and limit rules give, and the rated risk premium on the policy is raised by the rise. The reserve fund charge is booked with the same request and is the reserve fund assessment percentage of the risk premium charge, rounded half-up to the cent. A request on a tier that carries ICC coverage is not handled by this schedule: it is referred to the underwriting desk and nothing is charged under this policy.'
