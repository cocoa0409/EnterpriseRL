    rule: 'For a policy whose current term carries an endorsement charge or a re-rate credit, or whose cancellation takes effect on or before the current term start, and only for such a policy, the risk premium and reserve fund assessment charges are returned as the refund-method rule of this policy states, the HFIAA surcharge and ICC premium as the lines rule of this policy states, and each endorsement charge and re-rate credit of the term is taken back in the part this policy''s fractions give, judged on the coverage increase most recently put into effect and the applied certificate most recently recorded; on every other policy PRO_RATA returns the same four components of the current term multiplied by the days from the cancellation effective date to term_end divided by the days from term_start to term_end. For a cancellation under one of the claim_bar_reasons whose claims file the claim-bar reading of this policy finds neither barred nor clear, and only for such a cancellation, the current-term return is held and no cancellation credit and no refund are booked with the cancellation; for every other cancellation, no refund at all is due for the current term under the reasons in claim_bar_reasons when a claim with a date of loss in the current term has been paid (dwelling_msr_term_claims_paid above zero) or is still open (dwelling_msr_term_claims_open above zero); the cancellation still proceeds. The cancellation credit is fixed only after the policy carries the named insured''s signed cancellation request stating the date the cancellation takes effect. The cancellation credit is fixed only after the premium account carries the charge for every coverage increase the insured requested on the current term, because the cancellation returns the term''s charges line by line. The cancellation takes effect on the date and for the reason stated on the most recent signed cancellation request on the policy; the days of the current term run from the term start to the term end, and the term share is the days from the cancellation date to the term end divided by the days of the current term. A term that has already ended is fully earned, so only the current term''s charges and credits are returned, except where the cancellation reaches back to the policy''s inception. The refund paid out is the total of the cancellation credits, and it is paid to the payor of record. The standard credit is the PRO_RATA method applied to the current term as booked: the risk premium and reserve fund assessment booked at the term start, the term''s endorsement charges and its re-rate credits each taken at the term share, the HFIAA surcharge and ICC premium taken at the term share, and the Federal Policy Fee and probation surcharge earned; no credit at all is returned when a claim bars the refund or the return is held. Each of the risk premium and reserve fund credits combines the line''s charge booked at the term start, its endorsement charges and its re-rate credits, each taken for the part of the term the rules below give back; such a credit is never below zero and is rounded half-up to the cent. A claim bars the refund when the reason is REPLACED_BY_PRIVATE_FLOOD, MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED or REMOVED_FROM_SFHA_BY_LOMA_LOMR and the claims file shows a claim with a date of loss in the current term that has been paid or is still open, read as follows. Each loss is placed by the whole calendar months counted back from the processing date to its date of loss: a loss fewer whole months back than the term start lies in the current term, and a loss the same number of whole months back as the term start lies in the boundary month, where only a loss whose date can be read is placed, by comparing that date with the term start. A payment bars the refund when the claims of the current term''s whole months are paid net of voided payments above zero, or when the claims of the boundary month are paid net of voided payments above zero and the paid claim with the
      latest date of loss lies in the boundary month on or after the term start with its own payments net of voided payments above zero. An open claim bars the refund when the claim with the latest date of loss reported on the policy has a date of loss on or after the term start and has neither a payment nor a denial on record, as the base open-claim measure counts it. The claims file is clear of payments when the claims of the current term''s whole months are not paid net above zero and either the boundary month''s claims are not paid net above zero or the paid claim with the latest date of loss lies in the boundary month before the term start; it is clear of open claims when no claim is reported, when the claim with the latest date of loss reported on the policy has a date of loss before the term start, or when exactly one claim is reported in the current term''s whole months and the boundary month together and it has a payment or a denial on record. When the reason is one of these four and the claims file is neither barred nor clear of both, the current-term return is held: no cancellation credit and no refund are booked with the cancellation. The refund-method rule decides how much of the risk premium and reserve fund assessment charges is given back: when the reason is DUPLICATE_NFIP_POLICY or CLOSING_DID_NOT_OCCUR, the cancellation reaches back to the policy''s inception and every such charge booked on the policy, net of its re-rate credits on earlier terms, is returned in full; when the reason is REMOVED_FROM_SFHA_BY_LOMA_LOMR or the cancellation takes effect on or before the current term start, because the current term then never ran, the charges booked at the current term start are returned in full; and otherwise those charges are returned at the term share. The endorsement fraction is 1 when the coverage increase took effect after the cancellation date, because it was never in force; the days from the cancellation date to the term end divided by the days from the increase''s effective date to the term end when it took effect after the term start and on or before the cancellation date; and the term share otherwise. The re-rate fraction is 1 when the certificate''s rating change took effect after the cancellation date, because the lower rating never applied; the days from the cancellation date to the term end divided by the days from the rating change to the term end when it took effect after the term start and on or before the cancellation date; and the term share otherwise. The lines rule decides the other lines: when the reason is DUPLICATE_NFIP_POLICY or CLOSING_DID_NOT_OCCUR, every HFIAA surcharge, ICC premium, Federal Policy Fee and probation surcharge booked on the policy is returned in full; when the reason is REMOVED_FROM_SFHA_BY_LOMA_LOMR or the cancellation takes effect on or before the current term start, the current term''s HFIAA surcharge and ICC premium are returned in full and the fees are earned; otherwise they are returned at the term share, each line rounded half-up to the cent, and the fees are earned.'
    prerequisite:
    - problem: dwelling_ext_replacement_cancellation_date
      kind: value_input
      gate: cancel_date
      form: state
      policy_source: The cancellation credit is fixed only after the policy carries the named insured's signed cancellation request stating the date the cancellation takes effect.
      condition: dwelling_requests carries a CANCELLATION request for the policy with outcome SIGNED, a reason and a requested_effective_date.
      resolved_by: sign_cancellation_request_cbba569e
      effect: The signed request supplies the cancellation date and reason; the refund method, both fractions and the lines all follow from them.
    - problem: dwelling_ext_insured_increase_charge
      kind: value_input
      gate: endo_risk
      form: state
      policy_source: The cancellation credit is fixed only after the premium account carries the charge for every coverage increase the insured requested on the current term, because the cancellation returns the term's charges line by line.
      condition: dwelling_billing carries ENDORSEMENT charges on the current term referencing every COVERAGE_INCREASE request recorded on the term, and that request carries its change_effective_date.
      resolved_by: bill_insured_increase_9da169e7
      effect: The endorsement charges join the risk premium and reserve fund credits through the endorsement fraction.
    cross_category: []
    compute:
    - cancel_date: LATEST('dwelling_requests', 'requested_effective_date', date_field='created_at', request_type='CANCELLATION', outcome='SIGNED')
    - cancel_reason: LATEST('dwelling_requests', 'cancellation_reason', date_field='created_at', request_type='CANCELLATION', outcome='SIGNED')
    - term_days: DAYS(F('term_start'), F('term_end'))
    - term_share: DAYS(cancel_date, F('term_end')) / term_days
    - bar_reason: cancel_reason == 'REPLACED_BY_PRIVATE_FLOOD' or cancel_reason == 'MORTGAGE_PAID_OFF' or cancel_reason == 'VOLUNTARY_NOT_REQUIRED' or cancel_reason == 'REMOVED_FROM_SFHA_BY_LOMA_LOMR'
    - months_back: MONTHS(F('term_start'), NOW)
    - inner_paid: SUM('dwelling_claims', 'payment_amount', within_months=months_back, date_field='date_of_loss', event_type='dwelling_claim_paid') - SUM('dwelling_claims', 'payment_amount', within_months=months_back, date_field='date_of_loss', event_type='dwelling_claim_payment_voided')
    - window_paid: SUM('dwelling_claims', 'payment_amount', within_months=months_back + 1, date_field='date_of_loss', event_type='dwelling_claim_paid') - SUM('dwelling_claims', 'payment_amount', within_months=months_back + 1, date_field='date_of_loss', event_type='dwelling_claim_payment_voided')
    - band_paid: window_paid - inner_paid
    - paid_latest_dol: LATEST('dwelling_claims', 'date_of_loss', date_field='date_of_loss', event_type='dwelling_claim_paid')
    - paid_latest_claim: LATEST('dwelling_claims', 'claim_number', date_field='date_of_loss', event_type='dwelling_claim_paid')
    - paid_latest_net: SUM('dwelling_claims', 'payment_amount', event_type='dwelling_claim_paid', claim_number=paid_latest_claim) - SUM('dwelling_claims', 'payment_amount', event_type='dwelling_claim_payment_voided', claim_number=paid_latest_claim)
    - paid_latest_in_band: paid_latest_dol != None and paid_latest_dol != '' and MONTHS(paid_latest_dol, NOW) == months_back
    - paid_bar: inner_paid > 0 or (band_paid > 0 and paid_latest_in_band and paid_latest_dol >= F('term_start') and paid_latest_net > 0)
    - paid_clear: inner_paid <= 0 and (band_paid <= 0 or (paid_latest_in_band and paid_latest_dol < F('term_start')))
    - reported_latest_dol: LATEST('dwelling_claims', 'date_of_loss', date_field='date_of_loss', event_type='dwelling_claim_reported')
    - reported_latest_claim: LATEST('dwelling_claims', 'claim_number', date_field='date_of_loss', event_type='dwelling_claim_reported')
    - reported_latest_closed: COUNT('dwelling_claims', event_type='dwelling_claim_paid', claim_number=reported_latest_claim) + COUNT('dwelling_claims', event_type='dwelling_claim_denied', claim_number=reported_latest_claim) >= 1
    - reported_window: COUNT('dwelling_claims', within_months=months_back + 1, date_field='date_of_loss', event_type='dwelling_claim_reported')
    - open_bar: reported_latest_dol != None and reported_latest_dol != '' and reported_latest_dol >= F('term_start') and not reported_latest_closed
    - open_clear: reported_latest_dol == None or reported_latest_dol == '' or reported_latest_dol < F('term_start') or (reported_window == 1 and reported_latest_closed)
    - claim_bars: bar_reason and (paid_bar or open_bar)
    - claim_hold: bar_reason and not claim_bars and not (paid_clear and open_clear)
    - booked_risk: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='RENEWAL', term_start=F('term_start')) + SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='NEW_BUSINESS', term_start=F('term_start'))
    - booked_rfa: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RESERVE_FUND_ASSESSMENT', charge_basis='RENEWAL', term_start=F('term_start')) + SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RESERVE_FUND_ASSESSMENT', charge_basis='NEW_BUSINESS', term_start=F('term_start'))
    - earlier_risk: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', term_start=F('term_start')) - (SUM('dwelling_billing', 'amount', event_type='dwelling_premium_credit', component='RISK_PREMIUM', charge_basis='RERATE') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_credit', component='RISK_PREMIUM', charge_basis='RERATE', term_start=F('term_start')))
    - earlier_rfa: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RESERVE_FUND_ASSESSMENT') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RESERVE_FUND_ASSESSMENT', term_start=F('term_start')) - (SUM('dwelling_billing', 'amount', event_type='dwelling_premium_credit', component='RESERVE_FUND_ASSESSMENT', charge_basis='RERATE') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_credit', component='RESERVE_FUND_ASSESSMENT', charge_basis='RERATE', term_start=F('term_start')))
    - risk_returned: (booked_risk + earlier_risk) if (cancel_reason == 'DUPLICATE_NFIP_POLICY' or cancel_reason == 'CLOSING_DID_NOT_OCCUR') else (booked_risk if (cancel_reason == 'REMOVED_FROM_SFHA_BY_LOMA_LOMR' or cancel_date <= F('term_start')) else booked_risk * term_share)
    - rfa_returned: (booked_rfa + earlier_rfa) if (cancel_reason == 'DUPLICATE_NFIP_POLICY' or cancel_reason == 'CLOSING_DID_NOT_OCCUR') else (booked_rfa if (cancel_reason == 'REMOVED_FROM_SFHA_BY_LOMA_LOMR' or cancel_date <= F('term_start')) else booked_rfa * term_share)
    - endo_risk: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM', charge_basis='ENDORSEMENT', term_start=F('term_start'))
    - endo_rfa: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RESERVE_FUND_ASSESSMENT', charge_basis='ENDORSEMENT', term_start=F('term_start'))
    - increase_effective: LATEST('dwelling_changes', 'change_effective_date', date_field='change_effective_date', event_type='dwelling_endorsement_issued', change_type='COVERAGE_INCREASE')
    - endo_fraction: 1 if (increase_effective != None and increase_effective != '' and increase_effective > cancel_date) else ((DAYS(cancel_date, F('term_end')) / DAYS(increase_effective, F('term_end'))) if (increase_effective != None and increase_effective != '' and increase_effective > F('term_start') and increase_effective <= cancel_date) else term_share)
    - rr_risk: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_credit', component='RISK_PREMIUM', charge_basis='RERATE', term_start=F('term_start'))
    - rr_rfa: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_credit', component='RESERVE_FUND_ASSESSMENT', charge_basis='RERATE', term_start=F('term_start'))
    - rerate_effective: LATEST('dwelling_changes', 'change_effective_date', date_field='recorded_date', event_type='dwelling_ec_received', ec_applied=True)
    - rr_fraction: 1 if (rerate_effective != None and rerate_effective != '' and rerate_effective > cancel_date) else ((DAYS(cancel_date, F('term_end')) / DAYS(rerate_effective, F('term_end'))) if (rerate_effective != None and rerate_effective != '' and rerate_effective > F('term_start') and rerate_effective <= cancel_date) else term_share)
    - term_hfiaa: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='HFIAA_SURCHARGE', term_start=F('term_start'))
    - term_icc: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='ICC_PREMIUM', term_start=F('term_start'))
    - policy_rest: SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RISK_PREMIUM') - SUM('dwelling_billing', 'amount', event_type='dwelling_premium_charged', component='RESERVE_FUND_ASSESSMENT')
    - other_lines: policy_rest if (cancel_reason == 'DUPLICATE_NFIP_POLICY' or cancel_reason == 'CLOSING_DID_NOT_OCCUR') else ((term_hfiaa + term_icc) if (cancel_reason == 'REMOVED_FROM_SFHA_BY_LOMA_LOMR' or cancel_date <= F('term_start')) else RND(term_hfiaa * term_share + K('eps'), 2) + RND(term_icc * term_share + K('eps'), 2))
    - risk_credit: RND(MX(0, risk_returned + endo_risk * endo_fraction - rr_risk * rr_fraction) + K('eps'), 2)
    - rfa_credit: RND(MX(0, rfa_returned + endo_rfa * endo_fraction - rr_rfa * rr_fraction) + K('eps'), 2)
    - result: 0 if (claim_bars or claim_hold) else RND(risk_credit + rfa_credit + other_lines, 2)
    compute_basis:
      cancel_date: The cancellation takes effect on the date and for the reason stated on the most recent signed cancellation request on the policy; the days of the current term run from the term start to the term end, and the term share is the days from the cancellation date to the term end divided by the days of the current term.
      cancel_reason: for the reason stated on the most recent signed cancellation request on the policy
      term_days: the days of the current term run from the term start to the term end
      term_share: the term share is the days from the cancellation date to the term end divided by the days of the current term
      bar_reason: the reason is REPLACED_BY_PRIVATE_FLOOD, MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED or REMOVED_FROM_SFHA_BY_LOMA_LOMR
      booked_risk: the line's charge booked at the term start
      booked_rfa: the line's charge booked at the term start
      endo_risk: its endorsement charges
      endo_rfa: its endorsement charges
      increase_effective: the coverage increase most recently put into effect
      endo_fraction: The endorsement fraction is 1 when the coverage increase took effect after the cancellation date, because it was never in force; the days from the cancellation date to the term end divided by the days from the increase's effective date to the term end when it took effect after the term start and on or before the cancellation date; and the term share otherwise.
      rr_risk: its re-rate credits
      rr_rfa: its re-rate credits
      rerate_effective: the applied certificate most recently recorded
      rr_fraction: The re-rate fraction is 1 when the certificate's rating change took effect after the cancellation date, because the lower rating never applied; the days from the cancellation date to the term end divided by the days from the rating change to the term end when it took effect after the term start and on or before the cancellation date; and the term share otherwise.
      term_hfiaa: the current term's HFIAA surcharge and ICC premium are returned in full
      term_icc: the current term's HFIAA surcharge and ICC premium are returned in full
      policy_rest: every HFIAA surcharge, ICC premium, Federal Policy Fee and probation surcharge booked on the policy is returned in full
      other_lines: 'The lines rule decides the other lines: when the reason is DUPLICATE_NFIP_POLICY or CLOSING_DID_NOT_OCCUR, every HFIAA surcharge, ICC premium, Federal Policy Fee and probation surcharge booked on the policy is returned in full; when the reason is REMOVED_FROM_SFHA_BY_LOMA_LOMR or the cancellation takes effect on or before the current term start, the current term''s HFIAA surcharge and ICC premium are returned in full and the fees are earned; otherwise they are returned at the term share, each line rounded half-up to the cent, and the fees are earned.'
      risk_credit: Each of the risk premium and reserve fund credits combines the line's charge booked at the term start, its endorsement charges and its re-rate credits, each taken for the part of the term the rules below give back; such a credit is never below zero and is rounded half-up to the cent.
      rfa_credit: Each of the risk premium and reserve fund credits combines the line's charge booked at the term start, its endorsement charges and its re-rate credits, each taken for the part of the term the rules below give back; such a credit is never below zero and is rounded half-up to the cent.
      result: 'The standard credit is the PRO_RATA method applied to the current term as booked: the risk premium and reserve fund assessment booked at the term start, the term''s endorsement charges and its re-rate credits each taken at the term share, the HFIAA surcharge and ICC premium taken at the term share, and the Federal Policy Fee and probation surcharge earned; no credit at all is returned when a claim bars the refund or the return is held.'
      months_back: Each loss is placed by the whole calendar months counted back from the processing date to its date of loss
      inner_paid: the claims of the current term's whole months are paid net of voided payments above zero
      window_paid: the claims of the boundary month are paid net of voided payments above zero
      band_paid: the claims of the boundary month are paid net of voided payments above zero
      paid_latest_dol: the paid claim with the latest date of loss
      paid_latest_claim: the paid claim with the latest date of loss
      paid_latest_net: with its own payments net of voided payments above zero
      paid_latest_in_band: lies in the boundary month
      paid_bar: A payment bars the refund when the claims of the current term's whole months are paid net of voided payments above zero, or when the claims of the boundary month are paid net of voided payments above zero and the paid claim with the latest date of loss lies in the boundary month on or after the term start with its own payments net of voided payments above zero.
      paid_clear: The claims file is clear of payments when the claims of the current term's whole months are not paid net above zero and either the boundary month's claims are not paid net above zero or the paid claim with the latest date of loss lies in the boundary month before the term start
      reported_latest_dol: the claim with the latest date of loss reported on the policy
      reported_latest_claim: the claim with the latest date of loss reported on the policy
      reported_latest_closed: has neither a payment nor a denial on record, as the base open-claim measure counts it
      reported_window: exactly one claim is reported in the current term's whole months and the boundary month together
      open_bar: An open claim bars the refund when the claim with the latest date of loss reported on the policy has a date of loss on or after the term start and has neither a payment nor a denial on record, as the base open-claim measure counts it.
      open_clear: it is clear of open claims when no claim is reported, when the claim with the latest date of loss reported on the policy has a date of loss before the term start, or when exactly one claim is reported in the current term's whole months and the boundary month together and it has a payment or a denial on record
      claim_bars: A claim bars the refund when the reason is REPLACED_BY_PRIVATE_FLOOD, MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED or REMOVED_FROM_SFHA_BY_LOMA_LOMR and the claims file shows a claim with a date of loss in the current term that has been paid or is still open
      claim_hold: 'When the reason is one of these four and the claims file is neither barred nor clear of both, the current-term return is held: no cancellation credit and no refund are booked with the cancellation.'
      earlier_risk: every such charge booked on the policy, net of its re-rate credits on earlier terms
      earlier_rfa: every such charge booked on the policy, net of its re-rate credits on earlier terms
      risk_returned: 'The refund-method rule decides how much of the risk premium and reserve fund assessment charges is given back: when the reason is DUPLICATE_NFIP_POLICY or CLOSING_DID_NOT_OCCUR, the cancellation reaches back to the policy''s inception and every such charge booked on the policy, net of its re-rate credits on earlier terms, is returned in full; when the reason is REMOVED_FROM_SFHA_BY_LOMA_LOMR or the cancellation takes effect on or before the current term start, because the current term then never ran, the charges booked at the current term start are returned in full; and otherwise those charges are returned at the term share.'
      rfa_returned: 'The refund-method rule decides how much of the risk premium and reserve fund assessment charges is given back: when the reason is DUPLICATE_NFIP_POLICY or CLOSING_DID_NOT_OCCUR, the cancellation reaches back to the policy''s inception and every such charge booked on the policy, net of its re-rate credits on earlier terms, is returned in full; when the reason is REMOVED_FROM_SFHA_BY_LOMA_LOMR or the cancellation takes effect on or before the current term start, because the current term then never ran, the charges booked at the current term start are returned in full; and otherwise those charges are returned at the term share.'
    factors:
    - id: refund_method_rule
      effect: method
      decides: risk_returned
      bindings:
      - earlier_risk
      - earlier_rfa
      - risk_returned
      - rfa_returned
      ladder:
      - when: the reason is DUPLICATE_NFIP_POLICY or CLOSING_DID_NOT_OCCUR
        method: return every risk premium and reserve fund charge booked on the policy, net of earlier terms' re-rate credits, in full
      - when: the reason is REMOVED_FROM_SFHA_BY_LOMA_LOMR or the cancellation takes effect on or before the current term start
        method: return the charges booked at the current term start in full
      - when: otherwise
        method: return those charges at the term share
      baseline:
        risk_returned: booked_risk * term_share
        rfa_returned: booked_rfa * term_share
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: endorsement_fraction_rule
      effect: parameter
      decides: endo_fraction
      bindings:
      - increase_effective
      - endo_fraction
      ladder:
      - when: the coverage increase took effect after the cancellation date
        value: '1'
      - when: it took effect after the term start and on or before the cancellation date
        value: the days from the cancellation date to the term end divided by the days from the increase's effective date to the term end
      - when: otherwise
        value: the term share
      baseline:
        endo_fraction: term_share
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: rerate_fraction_rule
      effect: parameter
      decides: rr_fraction
      bindings:
      - rerate_effective
      - rr_fraction
      ladder:
      - when: the certificate's rating change took effect after the cancellation date
        value: '1'
      - when: it took effect after the term start and on or before the cancellation date
        value: the days from the cancellation date to the term end divided by the days from the rating change to the term end
      - when: otherwise
        value: the term share
      baseline:
        rr_fraction: term_share
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: lines_rule
      effect: method
      decides: other_lines
      bindings:
      - term_hfiaa
      - term_icc
      - policy_rest
      - other_lines
      ladder:
      - when: the reason is DUPLICATE_NFIP_POLICY or CLOSING_DID_NOT_OCCUR
        method: return every HFIAA surcharge, ICC premium, Federal Policy Fee and probation surcharge on the policy in full
      - when: the reason is REMOVED_FROM_SFHA_BY_LOMA_LOMR or the cancellation takes effect on or before the current term start
        method: return the current term's HFIAA surcharge and ICC premium in full; the fees are earned
      - when: otherwise
        method: return the current term's HFIAA surcharge and ICC premium at the term share; the fees are earned
      baseline:
        other_lines: RND(term_hfiaa * term_share + K('eps'), 2) + RND(term_icc * term_share + K('eps'), 2)
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: 'For a policy whose current term carries an endorsement charge or a re-rate credit, or whose cancellation takes effect on or before the current term start, and only for such a policy, the risk premium and reserve fund assessment charges are returned as the refund-method rule of this policy states, the HFIAA surcharge and ICC premium as the lines rule of this policy states, and each endorsement charge and re-rate credit of the term is taken back in the part this policy''s fractions give, judged on the coverage increase most recently put into effect and the applied certificate most recently recorded; on every other policy PRO_RATA returns the same four components of the current term multiplied by the days from the cancellation effective date to term_end divided by the days from term_start to term_end. The standard credit is the PRO_RATA method applied to the current term as booked: the risk premium and reserve fund assessment booked at the term start, the term''s endorsement charges and its re-rate credits each taken at the term share, the HFIAA surcharge and ICC premium taken at the term share, and the Federal Policy Fee and probation surcharge earned; no credit at all is returned when a claim bars the refund or the return is held. A claim bars the refund when the reason is REPLACED_BY_PRIVATE_FLOOD, MORTGAGE_PAID_OFF, VOLUNTARY_NOT_REQUIRED or REMOVED_FROM_SFHA_BY_LOMA_LOMR and the claims file shows a claim with a date of loss in the current term that has been paid or is still open, read as follows. Each loss is placed by the whole calendar months counted back from the processing date to its date of loss: a loss fewer whole months back than the term start lies in the current term, and a loss the same number of whole months back as the term start lies in the boundary month, where only a loss whose date can be read is placed, by comparing that date with the term start. A payment bars the refund when the claims of the current term''s whole months are paid net of voided payments above zero, or when the claims of the boundary month are paid net of voided payments above zero and the paid claim with the latest date of loss lies in the boundary month on or after the term start with its own payments net of voided payments above zero. An open claim bars the refund when the claim with the latest date of loss reported on the policy has a date of loss on or after the term start and has neither a payment nor a denial on record, as the base open-claim measure counts it. The claims file is clear of payments when the claims of the current term''s whole months are not paid net above zero and either the boundary month''s claims are not paid net above zero or the paid claim with the latest date of loss lies in the boundary month before the term start; it is clear of open claims when no claim is reported, when the claim with the latest date of loss reported on the policy has a date of loss before the term start, or when exactly one claim is reported in the current term''s whole months and the boundary month together and it has a payment or a denial on record. When the reason is one of these four and the claims file is neither barred nor clear of both, the current-term return is held: no cancellation credit and no refund are booked with the cancellation.'
      params: []
    inputs:
      history:
