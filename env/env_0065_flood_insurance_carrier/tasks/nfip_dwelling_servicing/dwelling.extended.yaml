      - dd_effective
      - dd_figure
      - inc_effective
      - inc_figure
      - dd_in_term
      - inc_in_term
      - outside_rise
      ladder:
      - when: the deductible decrease recorded last took effect during the expiring term
        value: that decrease's full-term risk premium less the risk premium booked at the term start
      - when: the coverage increase recorded last took effect during the expiring term and no such deductible decrease did
        value: that increase's full-term risk premium less the risk premium booked at the term start
