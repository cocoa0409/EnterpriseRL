      decides: residence_credit
      bindings:
      - term_days
      - sale_date
      - booked_hfiaa
      - surcharge_gap
      - residence_credit
      ladder:
      - when: the coming term is rated as the insured's primary residence and the move (the sale of the insured's former home insured under HomeFlood) took effect on or before the current term start
